<template data-pop="g55-racines-lombaires" data-title="Racines lombaires : technique d’examen">
<div class="lab">Technique</div><p>Pour chaque racine, le médecin cote la force du muscle indicateur, teste le réflexe et explore la sensibilité. L3 : flexion de la hanche (ilio-psoas) et extension du genou (quadriceps). L4 : quadriceps et flexion dorsale avec inversion du pied (tibial antérieur). L5 : tibial antérieur, extenseur des orteils et péroniers (éversion). Première racine sacrée : flexion plantaire (triceps sural), biceps fémoral, grand fessier <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Réflexes</div><p>Le réflexe rotulien diminue puis disparaît pour L3 et L4 ; le réflexe achilléen pour la première racine sacrée ; les réflexes restent intacts pour L5 <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Retentissement fonctionnel</div><p>L3 : signe du tabouret ; L4 : difficulté à s’accroupir, dans les escaliers et à marcher sur les talons ; L5 : steppage et marche sur les talons impossible ; première racine sacrée : marche sur la pointe des pieds impossible <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<p><b>Piège.</b> Un déficit du tibial antérieur avec réflexes normaux oriente vers L5 ; un pied tombant peut aussi venir d’une atteinte du nerf péronier. <b>Erreur fréquente.</b> Conclure à une radiculopathie L5 sans avoir cherché une atteinte du nerf péronier.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31288916/" target="_blank" rel="noopener">Carolus et coll., The interdisciplinary management of foot drop, Deutsches Ärzteblatt International 2019;116:347–354</a>.</p></template>
<template data-pop="g55-mnemo-racines" data-title="Mnémotechnique des réflexes (aide pédagogique)">
<div class="lab">Aide pédagogique, non critère officiel</div><p>La correspondance entre racine et réflexe peut se retenir en trois phrases courtes tirées du tableau de la revue suisse : le réflexe rotulien appartient à L3 et L4, le réflexe achilléen à la première racine sacrée, et L5 est la racine sans réflexe propre, dont les réflexes restent intacts <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<p>Cette aide ne remplace pas l’examen musculaire ni sensitif ; elle sert seulement à ordonner les observations. Elle n’est pas un critère diagnostique officiel.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-trendelenburg" data-title="Signe de Trendelenburg">
<div class="lab">Définition</div><p>Le signe de Trendelenburg traduit la faiblesse des muscles moyen et petit fessiers, rattachée à la racine L5 dans la revue suisse de 2010 <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Application</div><p>Il complète le déficit du tibial antérieur et des extenseurs des orteils pour confirmer une atteinte de L5. Le dossier ne décrit pas la technique du test ; elle relève d’un manuel d’examen clinique.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-lasegue" data-title="Signe de Lasègue : technique, valeur et pièges">
<div class="lab">Technique et seuil</div><p>Le Lasègue ipsilatéral est positif quand la mise en tension de la jambe provoque la douleur radiculaire avant 60° <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>. Le Lasègue croisé est positif quand l’élévation de la jambe saine provoque la douleur radiculaire (définition d’usage, que les sources lues ne détaillent pas).</p>
<div class="lab">Valeur (revue de 2014)</div><table class="t"><thead><tr><th>Signe</th><th>Sensibilité</th><th>Spécificité</th></tr></thead><tbody><tr><td>Lasègue ipsilatéral</td><td>0,8</td><td>0,4</td></tr><tr><td>Lasègue croisé</td><td>0,25</td><td>0,9</td></tr><tr><td>Réflexe achilléen diminué</td><td>0,5</td><td>0,6</td></tr><tr><td>Troubles sensitifs</td><td>0,5</td><td>0,5</td></tr></tbody></table>
<p>Le réflexe rotulien diminué a une sensibilité de 0,5 pour une hernie située au-dessus de L5-S1 <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>. Autre source suisse (2010) : Lasègue, sensibilité de 0,88 à 1 et spécificité de 0,11 à 0,44 ; Lasègue croisé, sensibilité de 0,23 à 0,44 et spécificité de 0,86 à 0,95 <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Lecture</div><p>Un test sensible rend le diagnostic peu probable s’il est négatif ; un test spécifique le rend probable s’il est positif. Le Lasègue croisé est donc plus utile pour affirmer, le Lasègue ipsilatéral pour écarter.</p>
<p><b>Piège.</b> Le Lasègue sollicite L4, L5 et la première racine sacrée ; il ne localise pas la racine. <b>Erreur fréquente.</b> Utiliser un Lasègue positif comme preuve de hernie discale.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-perianal" data-title="Sensibilité périanale">
<div class="lab">Fait</div><p>Il faut étendre systématiquement l’examen de la sensibilité à la région périanale ; l’hypoesthésie y a une valeur topographique plus que de gravité <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Conséquence</div><p>L’anesthésie en selle est un élément de la définition du syndrome de la queue de cheval. Son absence ne l’exclut pas à elle seule : il faut aussi interroger la miction et mesurer le résidu post-mictionnel.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-marche" data-title="Marche sur les talons et sur les pointes">
<div class="lab">Fait</div><p>Le médecin teste la marche sur les talons et sur les pointes, la distance doigt-sol et le test de Schober <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</p>
<div class="lab">Lecture</div><p>La marche sur les talons échoue en cas de faiblesse du tibial antérieur (L4, L5) ; la marche sur la pointe des pieds échoue en cas de faiblesse du triceps sural (première racine sacrée) <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. Ces tests fonctionnels rendent le déficit visible sans outil.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-spurling" data-title="Manœuvre de Spurling">
<div class="lab">Technique</div><p>La manœuvre associe une compression axiale, une rotation ipsilatérale et une extension du cou ; elle augmente la douleur radiculaire <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<div class="lab">Valeur</div><p>La spécificité est de 0,84 à 1,00 et la sensibilité de 0,38 à 0,98. Des tests combinés de tension du membre supérieur ont une sensibilité de 0,97 et une spécificité de 0,51 ; le test d’abduction soulageante a une sensibilité de 0,49 et une spécificité de 0,76. La certitude des données est très faible <a href="https://pubmed.ncbi.nlm.nih.gov/41680685/" target="_blank" rel="noopener">BMC 2026, tests cervicaux</a>.</p>
<p><b>Piège.</b> Une manœuvre négative n’exclut pas une radiculopathie cervicale : sa sensibilité est variable.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41680685/" target="_blank" rel="noopener">Diagnostic accuracy of physical examination tests for painful cervical radiculopathy, BMC Musculoskeletal Disorders 2026</a>.</p></template>
<template data-pop="g55-myelopathie-signes" data-title="Signes de myélopathie cervicale">
<div class="lab">Signes</div><p>Les troubles de l’initiation mictionnelle apparaissent d’abord, puis un globe vésical ; l’incontinence fécale est tardive. L’examen montre une hyperréflexie et un clonus <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<div class="lab">Limite</div><p>Le tableau des signes de myélopathie de la revue n’a pas été lu en entier ; la liste est donc restreinte à ce qui figure dans le texte lu.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a>.</p></template>
<template data-pop="g55-parsonage" data-title="Syndrome de Parsonage-Turner">
<div class="lab">Définition</div><p>Le syndrome de Parsonage-Turner est une plexopathie cervicale aiguë : douleur intense d’épaule, amyotrophie, faiblesse <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<div class="lab">Application</div><p>Il figure dans le diagnostic différentiel cervical avec les tumeurs des racines, le tunnel carpien, l’arrachement du plexus, la plexite zostérienne, la sclérose latérale amyotrophique et le défilé thoracique. La douleur intense précède la faiblesse.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a>.</p></template>
<template data-pop="g55-pied-tombant" data-title="Pied tombant">
<div class="lab">Fait</div><p>La radiculopathie L5 et l’atteinte du nerf péronier sont les causes les plus fréquentes de pied tombant <a href="https://pubmed.ncbi.nlm.nih.gov/31288916/" target="_blank" rel="noopener">Carolus 2019</a>.</p>
<div class="lab">Application</div><p>Le déficit du tibial antérieur et des extenseurs des orteils est commun aux deux causes ; les sources lues ne détaillent pas leur distinction ; l’examen des autres muscles de L5 et l’électroneuromyographie, indiquée si l’examen ne localise pas l’atteinte, y contribuent.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31288916/" target="_blank" rel="noopener">Carolus et coll., The interdisciplinary management of foot drop, Deutsches Ärzteblatt International 2019;116:347–354</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-residu" data-title="Résidu post-mictionnel et rétention urinaire">
<div class="lab">Valeur</div><p>La rétention urinaire a une sensibilité d’environ 90 % pour le syndrome de la queue de cheval ; en son absence, la probabilité du diagnostic est d’environ 1 sur 10 000 <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. L’imagerie par résonance magnétique est préférée à la tomodensitométrie ; la mesure du résidu post-mictionnel complète l’évaluation <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>.</p>
<div class="lab">Limite</div><p>Le dossier ne donne pas de seuil de volume. Le protocole local fixe la valeur au-delà de laquelle le résidu est considéré comme pathologique.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et coll., Lumbar disc herniation, the significance of symptom duration for the indication for surgery, Deutsches Ärzteblatt International 2024;121(13):440–448</a>.</p></template>
<template data-pop="g55-irm" data-title="Imagerie par résonance magnétique du rachis">
<div class="lab">Indication</div><p>L’imagerie par résonance magnétique est l’examen de choix de la hernie discale ; la séquence pondérée en T2 est la plus sensible et la plus spécifique. Une myélo-tomodensitométrie la remplace en cas de contre-indication ou d’examen non concluant <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a><a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<div class="lab">Compression médullaire métastatique</div><p>Elle est réalisée dès que possible et toujours dans les 24 heures en présence de signes neurologiques ; dans la semaine en cas de métastases suspectées sans compression. Elle couvre le rachis entier (séquence sagittale en T1 ou à suppression de graisse, séquence sagittale en T2, coupes axiales ciblées). La tomodensitométrie la remplace si elle est contre-indiquée. La radiographie standard n’est pas utilisée pour exclure le diagnostic <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>. Une revue recommande l’imagerie de tout le rachis sans délai <a href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-503/les-urgences-oncologiques-ca-existe" target="_blank" rel="noopener">Amram 2016</a>.</p>
<div class="lab">Limites</div><p>La corrélation entre image et clinique est faible : 36 % de hernies et 21 % de sténoses chez des asymptomatiques de plus de 60 ans <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>. La tomodensitométrie cervicale est moins utile aux étages C6 à D1 <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-503/les-urgences-oncologiques-ca-existe" target="_blank" rel="noopener">Amram, Les urgences oncologiques : ça existe, Revue Médicale Suisse 2016;12(503):176–177</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer, Eysel, Bredow, The diagnosis and treatment of degenerative changes of the lumbar spine, Deutsches Ärzteblatt International 2025;122(9):249–256</a> ; <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a>.</p></template>
<template data-pop="g55-emg" data-title="Électroneuromyographie">
<div class="lab">Indication</div><p>Elle est utile si l’anamnèse et l’examen ne localisent pas l’atteinte, ou si plusieurs racines sont concernées. Les anomalies apparaissent au moins 3 semaines après la compression <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>. Dans le canal lombaire étroit, elle n’apporte rien en routine <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>.</p>
<div class="lab">Valeur prédictive clinique</div><p>Dans une série de 200 patients, la douleur dermatomale est le prédicteur le plus sensible d’une radiculopathie confirmée par électromyographie, la perte du réflexe segmentaire et la faiblesse myotomale les plus spécifiques, et la faiblesse myotomale le meilleur prédicteur. L’étude n’est pas européenne <a href="https://pubmed.ncbi.nlm.nih.gov/23419571/" target="_blank" rel="noopener">Hassan 2013</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay et coll., Canal lombaire étroit : clinique, physiopathologie et traitement, Revue Médicale Suisse 2012;8(332):585–589</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23419571/" target="_blank" rel="noopener">Hassan et coll., Clinical predictors of electromyography-confirmed cervical and lumbosacral radiculopathy, Canadian Journal of Neurological Sciences 2013</a>.</p></template>
<template data-pop="g55-conservateur-nice" data-title="Recommandations britanniques pour la sciatique (NICE NG59)">
<div class="lab">À proposer</div><ul><li>Information du patient et encouragement à poursuivre les activités.</li><li>Programme d’exercice.</li><li>Anti-inflammatoires non stéroïdiens avec prudence, à la dose minimale et pour la durée minimale.</li><li>Injection épidurale d’anesthésique local et de corticoïde dans la sciatique aiguë sévère, à envisager.</li></ul>
<div class="lab">À ne pas proposer</div><ul><li>Ceinture lombaire, traction, acupuncture, stimulation électrique transcutanée.</li><li>Gabapentinoïdes, autres antiépileptiques, corticoïdes oraux, benzodiazépines : absence de bénéfice et preuves de nocivité.</li><li>Opioïdes dans la sciatique chronique.</li><li>Injection épidurale pour la claudication neurogène due à une sténose centrale <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE NG59</a>.</li></ul>
<div class="lab">Limite</div><p>Le texte est britannique ; l’organisation des soins n’est pas transposable à la Suisse.</p>
<p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE, Low back pain and sciatica in over 16s : assessment and management (NG59)</a>.</p></template>
<template data-pop="g55-gabapentinoide" data-title="Gabapentinoïdes : arbitrage de source">
<div class="lab">Position britannique (2020)</div><p>NICE déconseille de proposer les gabapentinoïdes pour la sciatique : absence de bénéfice et preuves de nocivité <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE NG59</a>.</p>
<div class="lab">Position suisse</div><p>L’information professionnelle suisse de la prégabaline l’indique dans les douleurs neuropathiques périphériques et centrales de l’adulte, avec 150 mg par jour au début, puis 300 mg après 3 à 7 jours, maximum 600 mg par jour information professionnelle suisse Prégabaline Spirig HC. Dans le canal étroit, une petite étude a utilisé la gabapentine à environ 900 mg par jour <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>.</p>
<div class="lab">Arbitrage</div><p>La règle du projet donne priorité à la source primaire applicable la plus récente. Pour la sciatique, la recommandation britannique de 2020 porte précisément sur la sciatique ; l’information suisse vise les douleurs neuropathiques en général. Le choix dans la sciatique suit donc la recommandation spécifique, et la prégabaline garde sa place pour la douleur neuropathique d’une autre origine. Le texte plus ancien (petite étude sur le canal étroit) reste lisible ci-dessus.</p>
<p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE, Low back pain and sciatica in over 16s : assessment and management (NG59)</a> ; Information professionnelle suisse Prégabaline Spirig HC, Swissmedic (AIPS via AmiKo), consultée le 15.10.2026 ; <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay et coll., Canal lombaire étroit : clinique, physiopathologie et traitement, Revue Médicale Suisse 2012;8(332):585–589</a>.</p></template>
<template data-pop="g55-infiltration" data-title="Infiltration périradiculaire et épidurale">
<div class="lab">Efficacité</div><p>L’infiltration périradiculaire est efficace dans jusqu’à 51 % des cas, avec un effet de 3 à 6 mois et un intervalle d’au moins 3 semaines entre deux gestes <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>. Dans une cohorte rétrospective de 212 patients à Bâle, atteints de sténose, la douleur de jambe est passée de 5,59 à 3,58 à 3 mois après infiltration épidurale de dexaméthasone-21-palmitate <a href="https://pubmed.ncbi.nlm.nih.gov/40450747/" target="_blank" rel="noopener">Swiss Med Wkly 2025</a>. Pour le canal étroit, l’infiltration caudale radioguidée est la mieux évaluée <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>.</p>
<div class="lab">Limites</div><p>L’étude de Bâle n’a pas de groupe témoin. NICE ne recommande pas l’injection épidurale pour la claudication neurogène par sténose centrale, mais propose d’envisager une injection dans la sciatique aiguë sévère <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE NG59</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay et coll., Canal lombaire étroit : clinique, physiopathologie et traitement, Revue Médicale Suisse 2012;8(332):585–589</a> ; <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE, Low back pain and sciatica in over 16s : assessment and management (NG59)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40450747/" target="_blank" rel="noopener">Epidural dexamethasone-21-palmitate for spinal stenosis-related pain, cohorte rétrospective, Swiss Medical Weekly 2025</a>.</p></template>
<template data-pop="g55-duree-conservateur" data-title="Durée du traitement conservateur : contentieux entre sources">
<div class="lab">Positions</div><ul><li>6 à 12 semaines : recommandations allemandes et danoises citées par la revue de 2024 <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>.</li><li>4 à 6 mois : revue suisse de 2014 pour la hernie lombaire <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</li><li>6 à 8 mois : revue suisse de 2015 pour la hernie cervicale <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</li></ul>
<div class="lab">Arbitrage</div><p>La source primaire applicable la plus récente retient 6 à 12 semaines pour la hernie lombaire <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>. Cette durée est cohérente avec la résolution de 60 à 80 % en 6 à 12 semaines. Les durées plus longues restent accessibles ; elles proviennent de revues suisses plus anciennes.</p>
<div class="lab">Réserve</div><p>Le dossier ne donne pas de durée d’attente différente selon le déficit ; un déficit sévère ou progressif ne bénéficie pas d’une attente de 6 à 12 semaines.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et coll., Lumbar disc herniation, the significance of symptom duration for the indication for surgery, Deutsches Ärzteblatt International 2024;121(13):440–448</a>.</p></template>
<template data-pop="g55-indications-chir" data-title="Indications chirurgicales de la hernie discale lombaire">
<div class="lab">Absolues</div><ul><li>Atteinte motrice subite inférieure ou égale à 3 sur 5.</li><li>Déficit progressif.</li><li>Douleurs intolérables malgré une antalgie maximale.</li><li>Menace de mort radiculaire : atteinte motrice avec disparition des douleurs.</li><li>Syndrome de la queue de cheval.</li></ul>
<div class="lab">Relatives</div><ul><li>Sciatique persistante malgré une antalgie maximale.</li><li>Patient qui ne souhaite pas investir plusieurs mois en traitement conservateur.</li></ul>
<div class="lab">Absence d’indication</div><ul><li>Douleurs diffuses non irradiantes.</li><li>Diagnostic peu clair.</li><li>Réticence du patient <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</li></ul>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a>.</p></template>
<template data-pop="g55-chir-vs-cons" data-title="Chirurgie et traitement conservateur : méta-analyses">
<div class="lab">Effet de la discectomie (méta-analyse de 2023)</div><table class="t"><thead><tr><th>Délai</th><th>Variation de la douleur de jambe (sur 100)</th></tr></thead><tbody><tr><td>Court terme</td><td>−12,1 et −11,7</td></tr><tr><td>Moyen terme</td><td>−6,5</td></tr><tr><td>12 mois</td><td>−2,3</td></tr></tbody></table>
<p>Les événements indésirables sont similaires (risque relatif de 1,34, intervalle de confiance de 0,91 à 1,98). La certitude est très faible à faible <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10498296/" target="_blank" rel="noopener">Liu 2023</a>.</p>
<div class="lab">Autres données</div><p>Une méta-analyse de 2026 trouve des résultats comparables à long terme entre chirurgie et traitement conservateur <a href="https://pubmed.ncbi.nlm.nih.gov/41704281/" target="_blank" rel="noopener">Brain Spine 2026</a>. Opérer dans les 12 mois suivant le début améliore légèrement la douleur de jambe, d’environ un point d’une échelle visuelle analogique, d’après 29 études et 23 550 patients de preuves de faible qualité <a href="https://pubmed.ncbi.nlm.nih.gov/40488872/" target="_blank" rel="noopener">Eur Spine J 2025</a>. Pour la radiculopathie cervicale, la chirurgie améliore la douleur cervicale et du bras, surtout pour une hernie (cinq essais) <a href="https://pubmed.ncbi.nlm.nih.gov/42029974/" target="_blank" rel="noopener">Eur J Orthop Surg Traumatol 2026</a>.</p>
<div class="lab">Limite</div><p>Les auteurs de la méta-analyse de 2023 sont surtout australiens ; l’étude sert à estimer l’effet, non à fonder une recommandation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10498296/" target="_blank" rel="noopener">Liu et coll., Surgical versus non-surgical treatment for sciatica, revue systématique et méta-analyse d’essais randomisés, British Medical Journal 2023;381:e070730</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40488872/" target="_blank" rel="noopener">Effect of symptom duration on outcomes of lumbar discectomy, revue systématique et méta-analyse, European Spine Journal 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41704281/" target="_blank" rel="noopener">Systematic review and meta-analysis on surgery for lumbar disc herniation : timing, return to work and outcomes, Brain and Spine 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42029974/" target="_blank" rel="noopener">Nonsurgical versus surgical treatment for cervical radiculopathy, European Journal of Orthopaedic Surgery and Traumatology 2026</a>.</p></template>
<template data-pop="g55-cout" data-title="Coût-efficacité suisse de la chirurgie primaire">
<div class="lab">Résultat</div><p>Dans un modèle décisionnel suisse, la chirurgie primaire comparée au traitement conservateur coûte 113 396 francs suisses par année de vie pondérée par la qualité du point de vue du système de santé, et 70 711 francs du point de vue de la société <a href="https://pubmed.ncbi.nlm.nih.gov/27922167/" target="_blank" rel="noopener">Swiss Med Wkly 2016</a>.</p>
<div class="lab">Limite</div><p>Il s’agit d’une modélisation avec incertitude ; le résumé ne donne pas de seuil de décision. Le résultat ne remplace pas l’indication clinique.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27922167/" target="_blank" rel="noopener">Cost-effectiveness of primarily surgical versus conservative treatment of radiculopathies due to disc herniation from the Swiss perspective, Swiss Medical Weekly 2016</a>.</p></template>
<template data-pop="g55-msc-dexa" data-title="Compression médullaire métastatique : conduite immédiate et dexaméthasone">
<div class="lab">Conduite immédiate</div><p>Contacter sans délai le coordinateur de la compression médullaire (organisation britannique ; l’équivalent suisse n’a pas été documenté), immobiliser le patient en cas de signe neurologique ou d’instabilité suspectée <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<div class="lab">Dexaméthasone</div><p>La dose est de 16 mg par voie orale, ou équivalent parentéral, dès que possible, puis 16 mg par jour jusqu’à la chirurgie ou la radiothérapie, avec décroissance ensuite ; le traitement s’arrête si la compression est exclue. La glycémie est surveillée et un inhibiteur de la pompe à protons associé <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<div class="lab">Source suisse</div><p>L’information professionnelle de la dexaméthasone indique le traitement palliatif des tumeurs malignes, avec 8 à 16 mg au début puis 4 à 12 mg par jour, et une réduction progressive ; au-delà de 2 semaines, le risque d’insuffisance corticosurrénalienne existe information professionnelle suisse Dexaméthasone Galepharm. Le libellé suisse ne cite pas la compression médullaire en tant que telle ; la dose de 16 mg vient de NICE.</p>
<div class="lab">Piège</div><p>En cas de lymphome ou de myélome suspecté sans signe neurologique, un avis hématologique précède les corticoïdes, qui pourraient compromettre le diagnostic <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a> ; Information professionnelle suisse Dexaméthasone Galepharm, Swissmedic (AIPS via AmiKo), consultée le 15.10.2026.</p></template>
<template data-pop="g55-msc-rt" data-title="Radiothérapie de la compression médullaire">
<div class="lab">Indication et dose</div><p>Une radiothérapie urgente est donnée dans les 24 heures si la chirurgie n’est pas possible, à 8 gray en fraction unique, sauf si le risque d’effets indésirables est élevé <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>. Une radiothérapie postopératoire est proposée après stabilisation <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<div class="lab">Fertilité</div><p>La discussion sur la fertilité a lieu sans retarder le traitement urgent <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a>.</p></template>
<template data-pop="g55-msc-chir" data-title="Chirurgie de la compression médullaire">
<div class="lab">Délai</div><p>La chirurgie est proposée dès que possible après le début des signes ; un délai écoulé après une plégie complète ne doit pas servir de seul critère d’exclusion <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>. Une méta-analyse de sept études et 538 patients trouve qu’une décompression urgente dans les 48 heures améliore la force d’au moins un point chez 83 % des patients ; 48 heures est la fenêtre jugée la plus favorable si l’espérance de vie dépasse trois mois <a href="https://pubmed.ncbi.nlm.nih.gov/38674277/" target="_blank" rel="noopener">Medicina 2024</a>.</p>
<div class="lab">Stabilisation</div><p>La stabilisation est indiquée en cas d’instabilité avec douleur mécanique non contrôlée, même avec déficit sévère <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>. Le score de stabilité et le score pronostique orientent la décision.</p>
<div class="lab">Limite</div><p>Les intervalles de confiance de la méta-analyse sont larges, et le texte n’a été lu qu’au niveau du résumé.</p>
<p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38674277/" target="_blank" rel="noopener">Optimal timing of surgery for acute symptomatic metastatic spinal cord compression, revue systématique et méta-analyse, Medicina 2024</a>.</p></template>
<template data-pop="g55-pronostic" data-title="Pronostic de la compression radiculaire">
<div class="lab">Évolution</div><p>La résolution est obtenue chez 60 à 80 % des patients en 6 à 12 semaines et 80 à 90 % à long terme <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>. Le pronostic est favorable dans 95 % des cas à un an quel que soit le traitement ; la chirurgie divise par trois le délai de guérison <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Facteurs de mauvais pronostic</div><p>Âge supérieur à 40 ans, arrêt de travail de plus de 2 à 3 mois, douleur chronique, déficit, récidive, facteurs psychologiques <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a> ; douleurs de plus de 8 mois pour le résultat chirurgical <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Séquelles après queue de cheval</div><p>Incontinence urinaire dans 43 % des cas et dysfonction sexuelle dans 40 % <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et coll., Lumbar disc herniation, the significance of symptom duration for the indication for surgery, Deutsches Ärzteblatt International 2024;121(13):440–448</a>.</p></template>
<template data-pop="g55-d-ibuprofene" data-title="Ibuprofène : monographie suisse">
<div class="lab">Mécanisme et classe</div><p>L’ibuprofène est un anti-inflammatoire non stéroïdien. Le mécanisme d’action détaillé n’a pas été extrait de l’information professionnelle lue.</p>
<div class="lab">Indication et posologie</div><p>L’information professionnelle d’Ibuprofen-Mepha Teva inclut les lombalgies et les névralgies secondaires à des lésions discales. Dans les affections rhumatismales, la dose est de 1200 à 1800 mg par jour, avec un maximum de 2400 mg par jour ; la dose efficace la plus faible est utilisée pour la durée la plus courte information professionnelle suisse Ibuprofen-Mepha Teva.</p>
<div class="lab">Contre-indications</div><p>Ulcère ou hémorragie digestive actifs ou récidivants ; troisième trimestre de la grossesse ; insuffisance rénale avec clairance de la créatinine inférieure à 30 ; insuffisance hépatique grave ; insuffisance cardiaque de classe III ou IV ; antécédent de bronchospasme aux anti-inflammatoires non stéroïdiens information professionnelle suisse Ibuprofen-Mepha Teva.</p>
<div class="lab">Preuves</div><p>Les recommandations britanniques proposent les anti-inflammatoires non stéroïdiens avec prudence, à la dose et pour la durée minimales <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE NG59</a>. La revue suisse de 2010 les juge plus efficaces que le paracétamol dans la forme hyperalgique <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Surveillance</div><p>Le dossier ne précise pas de surveillance spécifique ; la prescription brève et à faible dose est la mesure de prudence retenue.</p>
<p class="src">Références : Information professionnelle suisse Ibuprofen-Mepha Teva, Swissmedic (AIPS via AmiKo), consultée le 15.10.2026 ; <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE, Low back pain and sciatica in over 16s : assessment and management (NG59)</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-d-dexamethasone" data-title="Dexaméthasone : monographie suisse">
<div class="lab">Classe</div><p>La dexaméthasone est un corticoïde. Le mécanisme détaillé n’a pas été extrait de l’information professionnelle lue.</p>
<div class="lab">Indication et posologie</div><p>L’information professionnelle de Dexaméthasone Galepharm inclut l’œdème cérébral et le traitement palliatif de tumeurs malignes, avec une dose initiale de 8 à 16 mg, puis 4 à 12 mg par jour. La réduction est progressive information professionnelle suisse Dexaméthasone Galepharm. Dans la compression médullaire métastatique, la dose de 16 mg vient des recommandations britanniques <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<div class="lab">Précautions</div><p>Un traitement de plus de 2 semaines expose à une insuffisance corticosurrénalienne ; l’immunosuppression et les infections latentes imposent la prudence information professionnelle suisse Dexaméthasone Galepharm. La glycémie est surveillée en cas de dose élevée, avec un inhibiteur de la pompe à protons <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<div class="lab">Usage hors indication</div><p>Pour la sciatique discale, les corticoïdes oraux sont controversés (revue suisse) ou non proposés (NICE) <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a><a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE NG59</a>.</p>
<p class="src">Références : Information professionnelle suisse Dexaméthasone Galepharm, Swissmedic (AIPS via AmiKo), consultée le 15.10.2026 ; <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE, Low back pain and sciatica in over 16s : assessment and management (NG59)</a>.</p></template>
<template data-pop="g55-d-pregabaline" data-title="Prégabaline : monographie suisse">
<div class="lab">Classe</div><p>La prégabaline est un gabapentinoïde. Son mécanisme n’a pas été extrait de l’information professionnelle lue.</p>
<div class="lab">Indication et posologie</div><p>L’information professionnelle de Prégabaline Spirig HC l’indique dans les douleurs neuropathiques périphériques et centrales de l’adulte. La dose est de 150 mg par jour au début, portée à 300 mg par jour après 3 à 7 jours, avec un maximum de 600 mg par jour information professionnelle suisse Prégabaline Spirig HC.</p>
<div class="lab">Contentieux</div><p>NICE déconseille les gabapentinoïdes pour la sciatique (2020) <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE NG59</a>. La fenêtre « gabapentinoïdes : arbitrage de source » expose la règle appliquée.</p>
<div class="lab">Limites</div><p>Les effets indésirables, les contre-indications et la surveillance n’ont pas été extraits ; ils relèvent de la lecture de l’information professionnelle complète.</p>
<p class="src">Références : Information professionnelle suisse Prégabaline Spirig HC, Swissmedic (AIPS via AmiKo), consultée le 15.10.2026 ; <a href="https://www.nice.org.uk/guidance/ng59/chapter/Recommendations" target="_blank" rel="noopener">NICE, Low back pain and sciatica in over 16s : assessment and management (NG59)</a>.</p></template>
<template data-pop="pareto-g55-definition" data-title="Pareto — Question clinique, définitions et classifications">
<p class="ratio" data-cover="g55-0,g55-1"></p><ul><li>G55 est un code de manifestation : il note la compression nerveuse au cours d’une maladie classée ailleurs.</li><li>Une radiculopathie est la compression d’une racine, avec ou sans déficit ; on classe par cause, par niveau et par gravité.</li><li>Les trois sciatiques à adresser en urgence sont hyperalgique, paralysante et avec queue de cheval.</li></ul></template>
<template data-pop="pareto-g55-epidemio" data-title="Pareto — Fréquence">
<p class="ratio" data-cover="g55-2"></p><ul><li>La hernie discale cause 85 à 90 % des sciatiques ; L4-L5 et L5-S1 représentent 90 % des hernies lombaires.</li><li>La queue de cheval concerne environ 2 % des hernies discales lombaires.</li><li>Les images anormales sont fréquentes chez les asymptomatiques : la corrélation clinique est obligatoire.</li></ul></template>
<template data-pop="pareto-g55-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g55-3"></p><ul><li>La racine souffre par déformation mécanique et par irritation chimique.</li><li>Les fibres sensitives sont atteintes avant les fibres motrices ; les fibres motrices récupèrent mieux après décompression.</li><li>Un déficit brutal avec arrêt de la douleur évoque une ischémie radiculaire.</li></ul></template>
<template data-pop="pareto-g55-causes" data-title="Pareto — Causes et facteurs de risque">
<p class="ratio" data-cover="g55-4"></p><ul><li>Cinq groupes : tumeurs, disque, spondylose, autres dorsopathies, autres maladies.</li><li>La cause la plus fréquente est discale ; la plus urgente est tumorale.</li><li>La plexopathie radique survient des mois ou des années après l’irradiation.</li></ul></template>
<template data-pop="pareto-g55-anamnese" data-title="Pareto — Anamnèse">
<p class="ratio" data-cover="g55-5"></p><ul><li>Rechercher d’abord les signaux d’alerte : cancer, fièvre, traumatisme, déficit, troubles sphinctériens.</li><li>La claudication neurogène se soulage en flexion ; le vélo n’est pas limité.</li><li>Un cancer connu avec douleur nocturne et mécanique évoque une compression médullaire.</li></ul></template>
<template data-pop="pareto-g55-clinique" data-title="Pareto — Examen clinique">
<p class="ratio" data-cover="g55-6"></p><ul><li>Force, réflexe et sensibilité localisent la racine ; L5 est la racine à réflexes intacts.</li><li>Le Lasègue est sensible, le Lasègue croisé est spécifique.</li><li>Examiner toujours la sensibilité périanale en cas de signal d’alerte.</li></ul></template>
<template data-pop="pareto-g55-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g55-7"></p><ul><li>Écarter d’abord les urgences : compression, queue de cheval, infection, fracture.</li><li>Plexopathie métastatique et radique se chevauchent à l’imagerie.</li><li>Le pied tombant vient le plus souvent de L5 ou du nerf péronier.</li></ul></template>
<template data-pop="pareto-g55-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g55-8"></p><ul><li>Queue de cheval : décompression entre 24 et 48 heures.</li><li>Déficit inférieur ou égal à 3 sur 5 : chirurgie dans les 3 jours si possible.</li><li>Compression médullaire métastatique : imagerie du rachis entier en moins de 24 heures, dexaméthasone 16 mg, radiothérapie ou chirurgie.</li></ul></template>
<template data-pop="pareto-g55-prise-en-charge" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g55-9"></p><ul><li>Traitement conservateur pour la majorité : 60 à 80 % de résolution en 6 à 12 semaines.</li><li>NICE ne propose ni gabapentinoïdes, ni corticoïdes oraux, ni benzodiazépines pour la sciatique.</li><li>La chirurgie répond au déficit sévère ou progressif, à la queue de cheval et à la douleur intolérable.</li></ul></template>
<template data-pop="pareto-g55-suivi" data-title="Pareto — Suivi et pronostic">
<p class="ratio" data-cover="g55-10"></p><ul><li>La force à 3 mois prédit la récupération finale.</li><li>Pronostic favorable dans 95 % des cas à un an.</li><li>Après une queue de cheval, séquelles vésicales et sexuelles fréquentes.</li></ul></template>
<template data-pop="pareto-g55-situations" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="g55-11"></p><ul><li>Hémopathie suspectée : avis hématologique avant les corticoïdes.</li><li>Radiothérapie : discuter la fertilité sans retarder le traitement.</li><li>Grossesse, insuffisance rénale ou hépatique : appliquer les contre-indications de chaque médicament.</li></ul></template>
<template data-pop="pareto-g55-criteres" data-title="Pareto — Critères formels et paramètres clés">
<p class="ratio" data-cover="g55-12"></p><ul><li>Aucun critère consensuel unique pour G55 : syndrome radiculaire ou plexuel plus cause classée ailleurs.</li><li>Sciatique paralysante : déficit inférieur à 3 sur 5 ou progressif.</li><li>Compression médullaire métastatique : cancer connu avec signes de compression, imagerie en 24 heures.</li></ul></template>
<template data-pop="pareto-g55-examens" data-title="Pareto — Hiérarchie des examens">
<p class="ratio" data-cover="g55-e-1"></p><ul><li>L’imagerie par résonance magnétique est l’examen de choix de la hernie ; la séquence T2 est la plus sensible.</li><li>Pas d’imagerie de routine en soins non spécialisés.</li><li>La radiographie standard n’exclut pas une compression médullaire métastatique.</li></ul></template>
<template data-pop="pareto-g55-fiches" data-title="Pareto — Fiches et associations">
<p class="ratio" data-cover="g55-e-2,g55-e-3"></p><ul><li>L’électroneuromyographie n’est anormale qu’après 3 semaines.</li><li>La rétention urinaire a une sensibilité d’environ 90 % pour la queue de cheval.</li><li>Seule l’association terrain, signe et examen distingue plexopathie radique et métastatique.</li></ul></template>
<template data-pop="pareto-g55-cas" data-title="Pareto — Cas cliniques">
<p class="ratio" data-cover="g55-e-4"></p><ul><li>Cancer connu et douleur nocturne : imagerie par résonance magnétique du rachis entier en 24 heures.</li><li>Rétention et anesthésie en selle : imagerie en urgence et décompression en 24 à 48 heures.</li><li>Une image sans symptôme n’appelle pas de traitement.</li></ul></template>
<template data-pop="pareto-g55-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g55-s-anat-cours"></p><ul><li>Cinq racines, de C5 à D1, contribuent au plexus brachial.</li><li>Le disque C4/C5 comprime la racine C5, et ainsi de suite jusqu’au disque C7/D1 et à la racine C8 (tableau de la revue de 2015).</li><li>Les racines sacrées forment la queue de cheval.</li></ul></template>
<template data-pop="pareto-g55-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g55-s-histo-cours"></p><ul><li>Le disque comprend un noyau et un anneau de collagène de type II et de protéoglycanes.</li><li>La dégénérescence touche 85 à 95 % des adultes de plus de 50 ans.</li><li>La plexopathie radique associe fibrose et démyélinisation.</li></ul></template>
<template data-pop="pareto-g55-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g55-s-physio-cours"></p><ul><li>Les fibres sensitives sont touchées avant les fibres motrices.</li><li>L’extension réduit le volume du canal ; la flexion le soulage.</li><li>La myélopathie résulte d’une compression ou d’une ischémie de la moelle.</li></ul></template>
<template data-pop="pareto-g55-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g55-s-bioch-cours"></p><ul><li>La douleur radiculaire a une composante mécanique et une composante chimique.</li><li>Cytokines pro-inflammatoires et facteur de croissance nerveuse y jouent un rôle majeur.</li><li>Un mécanisme inflammatoire ne justifie pas à lui seul un traitement.</li></ul></template>
<template data-pop="pareto-g55-pharma" data-title="Pareto — Stratégie et posologies">
<p class="ratio" data-cover="g55-p-1,g55-p-2"></p><ul><li>Anti-inflammatoire non stéroïdien à la dose et pour la durée minimales ; ibuprofène maximum 2400 mg par jour.</li><li>Dexaméthasone 16 mg dès que possible dans la compression médullaire métastatique.</li><li>NICE déconseille les gabapentinoïdes dans la sciatique ; la prégabaline garde son indication neuropathique suisse.</li></ul></template>
<template data-pop="pareto-g55-pharma-risques" data-title="Pareto — Risques et surveillance">
<p class="ratio" data-cover="g55-p-3"></p><ul><li>L’ibuprofène a des contre-indications digestives, rénales, hépatiques, cardiaques et respiratoires.</li><li>La dexaméthasone au-delà de 2 semaines expose à l’insuffisance corticosurrénalienne.</li><li>Les interactions se lisent dans l’information professionnelle avant toute association.</li></ul></template>
