<template data-pop="pareto-g96-definition" data-title="Pareto — Définition et classifications">
<p class="ratio" data-cover="g96-0,g96-1"></p>
<ul><li data-src="S2">Une céphalée orthostatique fait penser à une fuite de liquide céphalorachidien.</li><li data-src="S3">La classification retient une pression inférieure à 60 mm de liquide et/ou une fuite à l’imagerie.</li><li data-src="S6">Trois types de fuite spinale : déchirure ventrale, diverticule ou gaine, fistule liquido-veineuse.</li><li data-src="S4">Score de Berne : 2 ou moins faible, 3-4 intermédiaire, 5 ou plus élevé.</li></ul></template>
<template data-pop="pareto-g96-mecanismes" data-title="Pareto — Épidémiologie, mécanismes, causes">
<p class="ratio" data-cover="g96-2,g96-3,g96-4"></p>
<ul><li data-src="S2 S5">Environ 3,7 à 5 cas pour 100 000 par an, deux fois plus de femmes, début vers 40 ans.</li><li data-src="S5">La perte de liquide est compensée par le sang (Monro-Kellie) : signes d’imagerie.</li><li data-src="S2 S6">Un éperon, une hernie discale ou une hypermobilité précèdent souvent la déchirure.</li><li data-src="S8">Une IRM normale ou un score bas n’exclut pas le diagnostic.</li></ul></template>
<template data-pop="pareto-g96-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g96-5,g96-6"></p>
<ul><li data-src="S5">Céphalée orthostatique chez 75 à 80 % des patients.</li><li data-src="S3">Rechercher le caractère orthostatique au début de l’histoire.</li><li data-src="S2">Mesurer fréquence cardiaque et pression couchée puis debout.</li><li data-src="S5">Ne pas parler d’épuisement professionnel sans écarter la fuite.</li></ul></template>
<template data-pop="pareto-g96-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g96-7"></p>
<ul><li data-src="S2">IRM cérébrale avec gadolinium et IRM de tout le rachis en première ligne.</li><li data-src="S2 S15">Pas de ponction lombaire pour confirmer seul ; pression normale possible.</li><li data-src="S2 S6">Myélographie adaptée à la présence ou l’absence de collection.</li></ul></template>
<template data-pop="pareto-g96-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g96-8"></p>
<ul><li data-src="S2">Coup de tonnerre : écarter une hémorragie sous-arachnoïdienne.</li><li data-src="S2">Changement brutal ou signes focaux : thrombose veineuse cérébrale.</li><li data-src="S2">Hématome sous-dural : conservateur si petit, trou de trépan si effet de masse.</li></ul></template>
<template data-pop="pareto-g96-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g96-9"></p>
<ul><li data-src="S2">Conservateur environ deux semaines, puis patch non ciblé d’au moins 20 mL.</li><li data-src="S2 S6">Traitement ciblé et chirurgie si échec ; fistule liquido-veineuse : voie endovasculaire possible.</li><li data-src="S6">Rebond environ une fois sur cinq.</li><li data-src="S12">Rhinorrhée : réparation endoscopique, succès supérieur à 90 %.</li></ul></template>
<template data-pop="pareto-g96-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g96-10,g96-11"></p>
<ul><li data-src="S2">Revue à 24-48 heures, 10-14 jours après patch, 3-6 semaines après chirurgie.</li><li data-src="S10">Plus de la moitié des patients bernois ont un arrêt de travail de plus de trois mois.</li><li data-src="S2 S5">Hématome sous-dural inexpliqué : chercher une fuite.</li></ul></template>
<template data-pop="pareto-g96-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g96-e-1,g96-e-2,g96-e-3,g96-e-4,g96-e-5,g96-e-6"></p>
<ul><li data-src="S2">Première ligne : IRM cérébrale et rachis ; ponction non systématique.</li><li data-src="S6">Myélographie pour localiser ; dose 19,7 mSv contre 6,6 mSv.</li><li data-src="S12 S13">Rhinorrhée : bêta-2-transferrine ou bêta-trace, puis scanner de la base.</li></ul></template>
<template data-pop="pareto-g96-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g96-p-1,g96-p-2,g96-p-3,g96-p-4"></p>
<ul><li data-src="S2">Aucun médicament ne ferme la fuite ; le patch ou la chirurgie la traite.</li><li data-src="S16 S17">Acétazolamide et défériprone : hors indication en Suisse.</li><li data-src="S5">Doses de caféine de la revue de Fribourg, non d’une information professionnelle.</li></ul></template>
<template data-pop="pareto-g96-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g96-s-anat-cours"></p>
<ul><li data-src="S6">Trois types de fuite, trois lieux : face ventrale, gaine, veine.</li><li data-src="S4">Trois repères d’IRM : 4 mm, 5 mm, 6,5 mm.</li></ul></template>
<template data-pop="pareto-g96-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g96-s-physio-cours"></p>
<ul><li data-src="S5">Perte de liquide, gain de sang, affaissement du cerveau.</li><li data-src="S7">Après fermeture, volume ventriculaire de 15,3 à 18,0 mL.</li></ul></template>
<template data-pop="pareto-g96-bioch" data-title="Pareto — Biochimie et imagerie">
<p class="ratio" data-cover="g96-s-bioch-cours"></p>
<ul><li data-src="S12">Bêta-2-transferrine ou bêta-trace : confirmation du liquide nasal.</li><li data-src="S6">Doses : myélographie dynamique 19,7 mSv, soustraction numérique 6,6 mSv.</li></ul></template>
