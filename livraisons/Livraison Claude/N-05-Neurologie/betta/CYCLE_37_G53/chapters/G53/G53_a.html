<template id="ch-G53"><div class="chap"><div class="chap-head"><div class="code">G 53 · Neurologie · Nerfs crâniens</div><h1>Affections des nerfs crâniens au cours de maladies classées ailleurs</h1><span class="status">Cycle 37 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des atteintes crâniennes secondaires</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g53-0">Question clinique</a></li><li><a href="#g53-1">Définition et classification</a></li><li><a href="#g53-2">Fréquence et pronostic de population</a></li><li><a href="#g53-3">Physiopathologie</a></li><li><a href="#g53-4">Causes et facteurs de risque</a></li><li><a href="#g53-5">Anamnèse</a></li><li><a href="#g53-6">Examen clinique</a></li><li><a href="#g53-7">Démarche diagnostique</a></li><li><a href="#g53-8">Urgences et complications</a></li><li><a href="#g53-9">Prise en charge hiérarchisée</a></li><li><a href="#g53-10">Suivi, pronostic et prévention</a></li><li><a href="#g53-11">Situations particulières</a></li><li><a href="#g53-12">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g53-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>première vignette fictive</b>, une femme de 76 ans consulte quatre mois après un zona ophtalmique. L’éruption a guéri, mais le front reste le siège d’une douleur brûlante cotée 6 sur 10, que le simple contact des cheveux déclenche. Ces valeurs sont pédagogiques ; elles illustrent la <button class="w" data-k="g53-npz">névralgie post-zostérienne</button>, c’est-à-dire une douleur qui dépasse 90 jours après l’éruption (Shingrix, Swissmedic).</p>
<p>Dans la <b>seconde vignette fictive</b>, un homme de 62 ans, suivi pour un cancer du poumon, présente en trois semaines une diplopie, une paralysie faciale périphérique et une baisse de l’audition. Plusieurs nerfs crâniens sont atteints en même temps : le médecin ne cherche pas trois maladies, il cherche une seule cause qui explique le tableau. Dans une série de 979 patients hospitalisés pour atteinte de plusieurs nerfs crâniens, la tumeur était la cause la plus fréquente (305 cas, plus d’un quart) (Keane 2005 ; source américaine, donnée descriptive).</p>
<p>La catégorie G 53 de la classification CIM-10-GM 2024 (BfArM 2024 ; OFS 2024) ne désigne pas une maladie propre. Elle décrit la <b>manifestation</b> crânienne d’une maladie déjà classée ailleurs : un zona, une infection, une sarcoïdose, une tumeur. La question clinique est donc toujours la même : quelle maladie causale explique l’atteinte crânienne, et quel traitement cette cause réclame-t-elle ? Les sections suivantes répondent cause par cause, avec les sources effectivement lues.</p>
<p>À la fin de ce cours, le lecteur sait distinguer une névralgie post-zostérienne d’une atteinte aiguë, reconnaître le contexte qui oriente vers une neuroborréliose, une neurosyphilis, une neurosarcoïdose ou des métastases leptoméningées, choisir l’examen qui tranche pour chacune (ponction lombaire, imagerie par résonance magnétique), appliquer le traitement de la cause et connaître les interdits médicamenteux, dont l’association brivudine–fluoropyrimidines.</p>
<div class="key"><b>À retenir.</b> Une atteinte crânienne classée en G 53 est un symptôme de maladie, jamais un diagnostic final. Une douleur persistante après un zona se traite comme une douleur neuropathique ; plusieurs nerfs crâniens atteints imposent la recherche d’une cause infectieuse, inflammatoire ou tumorale.</div>
</section>
<section class="ilot" id="g53-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La classification CIM-10-GM 2024 utilise un double codage. Le code marqué d’une <button class="w" data-k="g53-codage">croix (†)</button> désigne la maladie causale, le code marqué d’un <b>astérisque (*)</b> désigne sa manifestation. G 53 porte l’astérisque : il ne s’emploie jamais seul, et aucune exclusion n’est listée sous cette catégorie (BfArM 2024). Les atteintes crâniennes qui constituent une maladie propre restent codées en G 51 (nerf facial, VII) ou en G 52 (autres nerfs crâniens) (BfArM 2024).</p>
<p>Le tableau classe les cinq sous-codes par cause clinique. Il sert à retenir que le traitement dépend de la maladie causale et non du nerf touché.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Cause clinique</th><th>Maladie causale (code †)</th></tr></thead><tbody><tr><td>G 53.0*</td><td><button class="w" data-k="g53-npz">Névralgie post-zostérienne</button> ; inclut l’inflammation du <button class="w" data-k="g53-geniculate">ganglion géniculé</button> après zona et la névralgie du trijumeau après zona</td><td>Zona (B02.2†)</td></tr><tr><td>G 53.1*</td><td>Paralysie de plusieurs nerfs crâniens au cours d’une <button class="w" data-k="g53-g531">maladie infectieuse ou parasitaire</button></td><td>Maladies infectieuses et parasitaires (A00–B99†)</td></tr><tr><td>G 53.2*</td><td>Paralysie de plusieurs nerfs crâniens au cours d’une <button class="w" data-k="g53-sarcoidose">sarcoïdose</button></td><td>Sarcoïdose (D86.8†)</td></tr><tr><td>G 53.3*</td><td>Paralysie de plusieurs nerfs crâniens au cours d’une <button class="w" data-k="g53-ml">maladie tumorale</button></td><td>Tumeurs (C00–D48†)</td></tr><tr><td>G 53.8*</td><td><button class="w" data-k="g53-g538">Autres affections des nerfs crâniens</button> au cours d’autres maladies classées ailleurs</td><td>Aucun code † listé dans la classification</td></tr></tbody></table>
<p>Quatre définitions opérationnelles structurent la suite. Elles viennent de textes différents ; chacune est attribuée à sa source.</p>
<ul><li><b>Névralgie post-zostérienne.</b> Douleur associée au zona, cotée au moins 3 sur 10, qui persiste ou apparaît plus de 90 jours après le début de l’éruption (Shingrix, Swissmedic, définition des essais).</li><li><b>Neuroborréliose.</b> Possible, probable ou confirmée selon que l’analyse du liquide céphalorachidien manque, montre une inflammation, ou prouve une production locale d’anticorps spécifiques (<button class="w" data-k="g53-borreliose">DGN neuroborréliose 2025</button>).</li><li><b>Neurosarcoïdose.</b> Possible, probable ou définie selon la preuve histologique de granulome, avec un principe clé : exclure d’abord une infection et un cancer (Westendorp 2025 ; Stern 2018).</li><li><b>Métastases leptoméningées.</b> Type I confirmé par cytologie ou biopsie, type II établi par la clinique et l’imagerie (<button class="w" data-k="g53-ml">EANO-ESMO 2023</button>).</li></ul>
<div class="trap"><span class="k">Piège</span> Une paralysie faciale isolée sans maladie causale connue relève de G 51, non de G 53. Le codage en G 53.- suppose qu’une maladie classée ailleurs ait été identifiée (BfArM 2024).</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Shingrix</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">DGN neuroborréliose 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a> ; <a href="https://doi.org/10.1001/jamaneurol.2018.2295" target="_blank" rel="noopener">Stern 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a></p>

<section class="ilot" id="g53-2"><h2><span class="n">2</span>Fréquence et pronostic de population</h2>
<p>Aucune source suisse propre à ce sujet n’a été trouvée ; les données ci-dessous viennent de recommandations européennes et d’essais. L’incidence de G 53 en tant que catégorie n’est pas connue : seules les causes sont chiffrées.</p>
<table class="t"><thead><tr><th>Cause</th><th>Donnée lue</th><th>Source</th></tr></thead><tbody><tr><td>Zona et névralgie post-zostérienne</td><td>Incidence de la névralgie sous placebo : 0,6 pour 1000 personnes-années dans l’essai ZOE-50 (50 ans et plus) ; 1,2 pour 1000 dans l’analyse groupée (70 ans et plus). Fréquence et sévérité du zona plus élevées dès 65 ans</td><td>Shingrix ; Plan de vaccination 2026</td></tr><tr><td>Douleur neuropathique chronique</td><td>6,9 à 10 % de la population générale (résumé seulement)</td><td>Arztebl 2016</td></tr><tr><td>Neuroborréliose</td><td>3 à 15 % des borrélioses de Lyme. En Suisse, 5 à 7 % des tiques sont infectées selon la région ; en Suisse romande, le risque d’infection après piqûre est un peu inférieur à 5 %</td><td>DGN neuroborréliose 2025</td></tr><tr><td>Neurosarcoïdose</td><td>5 à 15 % des sarcoïdoses ; manifestation inaugurale dans 50 à 70 % des cas ; forme isolée dans 22 %. Incidence de la sarcoïdose : 1 à 40 pour 100 000 par an, plus élevée en Europe du Nord</td><td>Westendorp 2025</td></tr><tr><td>Métastases leptoméningées</td><td>À évoquer surtout dans le cancer du sein, le cancer du poumon et le mélanome</td><td>EANO-ESMO 2023</td></tr><tr><td>Neurosyphilis</td><td>Séquelles chez 41,8 % de 142 patients, dont paralysies de nerfs crâniens 15,2 % et troubles visuels 11,8 %</td><td>DGN neurosyphilis 2026</td></tr></tbody></table>
<p>Pour les atteintes de plusieurs nerfs crâniens, la série de Keane répartit les 979 patients ainsi : nerfs les plus touchés VI (565), VII (466), V (353) et III (339) ; causes tumorale (305), vasculaire (128), traumatique (128), infectieuse (102) et syndromes de Guillain-Barré et de Fisher (91) (Keane 2005 ; série hospitalière américaine, valeur descriptive seulement).</p>
<p>Le pronostic dépend de la cause. La neuroborréliose récupère le plus souvent : la parésie faciale guérit complètement en un à deux mois dans la plupart des cas, avec 5 à 10 % de séquelles ou de syncinésies (DGN neuroborréliose 2025). Les métastases leptoméningées ont au contraire une survie médiane de quelques mois : 3,8 à 5,4 mois dans le cancer du sein, 4,2 à 8,1 mois dans le cancer du poumon, 4,8 mois dans le mélanome (EANO-ESMO 2023).</p>
<div class="key"><b>À retenir.</b> Les chiffres de fréquence ne se transposent pas d’une cause à l’autre. La tumeur domine dans les séries hospitalières d’atteintes multiples, mais le zona est la cause la plus accessible à la prévention par la vaccination.</div>

<section class="ilot" id="g53-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le mécanisme se comprend en distinguant l’atteinte du nerf par la douleur, par l’inflammation ou par la compression. Chaque cause épargne ou touche des nerfs différents ; l’explication de chaque chaîne figure ci-dessous.</p>
<p><b>Zona puis douleur persistante.</b> Le <button class="w" data-k="g53-zona">zona</button> est la réactivation d’un virus varicelle-zona resté latent dans un ganglion sensitif. La douleur aiguë accompagne la réplication virale ; quand elle dure au-delà de 90 jours, elle définit la névralgie post-zostérienne (Shingrix, Swissmedic). Le <button class="w" data-k="g53-valaciclovir">valaciclovir</button> agit en bloquant la réplication virale : il se transforme en aciclovir, que la thymidine kinase du virus phosphoryle ; le dérivé triphosphate inhibe l’ADN-polymérase virale, et la sélectivité vient de ce que l’enzyme virale n’existe que dans les cellules infectées (Valtrex, Swissmedic). Le traitement abrège la durée de la douleur zostérienne aiguë, notamment chez le sujet âgé. Le vaccin prévient la névralgie <b>en prévenant le zona</b> ; un effet propre sur la névralgie chez un vacciné qui fait un zona n’a pas pu être démontré (Shingrix, Swissmedic).</p>
<p><b>Neuroborréliose.</b> L’inflammation touche les méninges et les racines nerveuses. Le liquide céphalorachidien contient alors des plasmocytes et des lymphocytes activés, avec une barrière hémato-liquidienne altérée ; la cellularité moyenne est de 170 à 220 par microlitre (extrêmes 6 à 1100) et la synthèse intrathécale d’immunoglobuline G se retrouve dans 70 à 80 % des cas (DGN neuroborréliose 2025). L’<button class="w" data-k="g53-lcr-borrelia">index anticorps spécifique</button> devient positif vers la deuxième semaine.</p>
<p><b>Neurosyphilis.</b> Dans la méningite syphilitique précoce, les nerfs crâniens sont lésés au sein de l’inflammation méningée ; la forme méningovasculaire associe vascularite et méningite (DGN neurosyphilis 2026).</p>
<p><b>Neurosarcoïdose.</b> Le granulome est non nécrosant et formé de cellules épithélioïdes dérivées des macrophages ; le facteur de nécrose tumorale alpha est essentiel à sa formation, ce qui en fait une cible thérapeutique. La réponse est polarisée vers les lymphocytes CD4 de type Th1 et Th17.1 (Westendorp 2025). La neuropathie optique résulte d’une compression granulomateuse, d’une hypertension intracrânienne ou d’une névrite optique.</p>
<p><b>Métastases leptoméningées.</b> Les cellules tumorales se disséminent dans les espaces sous-arachnoïdiens et atteignent les nerfs II, III, IV et VI (diplopie, troubles visuels), VII (paralysie faciale) et VIII (hypoacousie) ; l’atteinte spinale concerne 34 à 52 % des cas et des blocs de circulation du liquide céphalorachidien peuvent apparaître (EANO-ESMO 2023).</p>

<section class="ilot" id="g53-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se rangent par sous-code. Pour chacune, la liste suivante donne ce que les sources permettent d’affirmer ; elle n’est pas exhaustive pour G 53.8, faute de directive (voir plus bas).</p>
<div class="two"><div class="card"><h4>G 53.0 — zona céphalique</h4><p>Zona de la région céphalique avec névralgie dans le territoire d’un nerf crânien : le trijumeau (nerf V) ou le ganglion géniculé du nerf facial (BfArM 2024). L’âge à partir de 65 ans et l’immunodépression augmentent fréquence et gravité (Plan de vaccination 2026).</p></div><div class="card"><h4>G 53.1 — infections</h4><p>Virus responsables de paralysies de nerfs crâniens : virus varicelle-zona, herpès simplex, cytomégalovirus, VIH, méningo-encéphalite verno-estivale, oreillons, poliovirus et virus de l’hépatite C (DGN méningo-encéphalite 2025). Bactéries : <button class="w" data-k="g53-borreliose">Borrelia</button> et <button class="w" data-k="g53-neurosyphilis">Treponema pallidum</button>.</p></div></div>
<div class="two"><div class="card"><h4>G 53.2 — sarcoïdose</h4><p>Les neuropathies crâniennes touchent 55 % des neurosarcoïdoses : nerf facial 24 %, optique 21 %, trijumeau 12 %, plusieurs nerfs 28 % (Westendorp 2025). Le syndrome de <button class="w" data-k="g53-heerfordt">Heerfordt</button> associe paralysie faciale, parotidite, uvéite et fièvre.</p></div><div class="card"><h4>G 53.3 — tumeurs</h4><p>Métastases leptoméningées des tumeurs solides, surtout sein, poumon et mélanome (EANO-ESMO 2023). Un cas d’atteintes crâniennes multiples sous pembrolizumab, cortico-sensible, a été décrit (Minagawa 2026, cas clinique).</p></div></div>
<p>Dans la neuroborréliose, tous les nerfs crâniens peuvent être touchés sauf l’olfactif. Le nerf facial est concerné dans plus de 80 % des atteintes crâniennes, de façon bilatérale dans environ un tiers des cas ; viennent ensuite le nerf abducens (VI), plus rarement le VIII, le nerf optique (II, névrite optique ou œdème papillaire), les nerfs III, IV, V et IX à XII (DGN neuroborréliose 2025). Dans la neurosyphilis, les nerfs VIII, VII et III sont les plus fréquents, parfois le nerf optique (DGN neurosyphilis 2026).</p>
<p><b>G 53.8.</b> Les sources lues se limitent à des cas cliniques et à des revues : artérite à cellules géantes avec atteinte des nerfs III et VI (Ye 2023, cas) ; polyradiculoneuropathie inflammatoire démyélinisante chronique avec atteinte des nerfs III, VII, X et XII (Shahjouei 2024, résumé) ; diabète comme cause de neuropathie crânienne récidivante (Keane 2005). La classification ne liste pas de maladies typiquement codées en G 53.8.</p>
<div class="key"><b>À retenir.</b> Les facteurs de risque sont ceux de la cause : âge et immunodépression pour le zona, exposition aux tiques pour Lyme, exposition sexuelle pour la syphilis, cancer connu pour les métastases leptoméningées. Une <button class="w" data-k="g53-mnemo">aide mémoire des sous-codes (non officielle)</button> relie les chiffres 0, 1, 2 et 3 aux quatre causes.</div>

<section class="ilot" id="g53-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche la maladie causale avant le nerf. Le médecin pose les questions suivantes, chacune orientée vers une cause précise.</p>
<table class="t"><thead><tr><th>Cause évoquée</th><th>Question posée</th><th>Justification</th></tr></thead><tbody><tr><td>Zona</td><td>Quand l’éruption est-elle apparue ? Siège céphalique ou ophtalmique ? Immunodépression ? Chimiothérapie par fluoropyrimidine ?</td><td>L’antiviral se débute au plus tard dans les 72 heures (Valtrex) ; la brivudine est contre-indiquée en cas de fluoropyrimidine (Brivex) ; l’immunodépression modifie traitement et prévention (Plan de vaccination 2026)</td></tr><tr><td>Neuroborréliose</td><td>Piqûre de tique ? Érythème migrant ? Douleurs radiculaires nocturnes peu sensibles aux antalgiques ?</td><td>Les déficits neurologiques surviennent 1 à 4 semaines après le début des douleurs chez trois patients sur quatre (DGN neuroborréliose 2025)</td></tr><tr><td>Neurosyphilis</td><td>Exposition sexuelle ? Statut VIH ? Symptômes oculaires ou auditifs ?</td><td>La syphilis oculaire est plus fréquente chez les personnes vivant avec le VIH (DGN neurosyphilis 2026)</td></tr><tr><td>Neurosarcoïdose</td><td>Sarcoïdose connue ? Symptômes pulmonaires, oculaires, ganglionnaires, cutanés ou articulaires ?</td><td>84 % des patients ont une atteinte extraneurologique au cours de l’évolution (Westendorp 2025)</td></tr><tr><td>Métastases leptoméningées</td><td>Cancer connu (sein, poumon, mélanome) ? Céphalées, nausées, vomissements, troubles cognitifs ou de la marche, douleurs radiculaires ?</td><td>Ce sont les signes cliniques listés par la recommandation (EANO-ESMO 2023)</td></tr></tbody></table>
<p>La <b>chronologie</b> est consignée avec précision. Dans la neuroborréliose, les déficits apparaissent 1 à 4 semaines après les douleurs radiculaires chez trois patients sur quatre (DGN neuroborréliose 2025) ; dans le zona, le délai depuis l’éruption décide de l’antiviral (72 heures) et définit la névralgie (plus de 90 jours) (Valtrex ; Shingrix). Pour les autres causes, les sources lues ne donnent pas de délai de référence : le médecin note la date d’apparition de chaque déficit pour juger la progression.</p>
<div class="trap"><span class="k">Piège</span> Chez un patient qui a déjà reçu le diagnostic de sarcoïdose, attribuer d’emblée un nouveau déficit crânien à la maladie connue expose à manquer une infection ou un cancer : le principe clé est d’exclure ces deux causes avant de retenir la neurosarcoïdose (Westendorp 2025).</div>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Valtrex</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Brivex</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final%20%283%29.pdf" target="_blank" rel="noopener">Plan de vaccination 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">DGN neuroborréliose 2025</a> ; <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">DGN neurosyphilis 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a></p>
</section>
<section class="ilot" id="g53-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen est systématique : chaque nerf crânien est testé, car l’atteinte d’un second nerf modifie le diagnostic. Pour la paralysie faciale, l’otoscopie recherche des lésions vésiculeuses du zona (Arztebl 2019, résumé).</p>
<div class="two"><div class="card"><h4>Nerfs crâniens et peau</h4><p>La paralysie faciale est recherchée du côté atteint et du côté opposé : la bilatérale évoque la sarcoïdose, la neuroborréliose, le syndrome de Guillain-Barré ou le syndrome de Melkersson-Rosenthal (Westendorp 2025). Dans la neuroborréliose, le goût peut être épargné (DGN neuroborréliose 2025). La peau est examinée pour des vésicules ou une cicatrice de zona dans le territoire du trijumeau (Shingrix).</p></div><div class="card"><h4>Vision et muscles oculaires</h4><p>La neuropathie optique de la sarcoïdose est moins souvent douloureuse que la névrite optique classique (20 à 30 % contre plus de 60 %) et plus souvent bilatérale (Westendorp 2025). La diplopie et l’atteinte des nerfs III, IV et VI sont précisées par la direction du déficit.</p></div></div>
<div class="two"><div class="card"><h4>Audition et équilibre</h4><p>L’hypoacousie et le déficit vestibulaire orientent vers une neurosyphilis (otosyphilis) ou vers une métastase leptoméningée (DGN neurosyphilis 2026 ; EANO-ESMO 2023).</p></div><div class="card"><h4>Signes méningés et radiculaires</h4><p>Une raideur méningée, des douleurs radiculaires et plusieurs déficits crâniens simultanés évoquent les métastases leptoméningées (EANO-ESMO 2023). Chez un patient avec zona, l’examen cherche aussi des signes d’encéphalite (DGN méningo-encéphalite 2025).</p></div></div>
<p>L’examen sensitif de la zone douloureuse décrit la douleur neuropathique : brûlure, contact douloureux, extension de la zone. Cette caractérisation oriente le traitement (Arztebl 2016, résumé), mais aucune échelle d’évaluation standardisée n’est détaillée dans les sources lues.</p>
<div class="trap"><span class="k">Piège</span> 25 à 40 % des paralysies faciales périphériques ne sont pas idiopathiques (Arztebl 2019, résumé). Une paralysie faciale sans cause évidente exige donc un examen neurologique complet, une otoscopie et, selon le contexte, une ponction lombaire.</div>
