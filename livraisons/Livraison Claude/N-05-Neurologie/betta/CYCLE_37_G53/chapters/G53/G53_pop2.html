<template data-pop="g53-valaciclovir" data-title="Valaciclovir (Valtrex)">
<div class="lab">Mécanisme</div><p>Ester de l’aciclovir, converti en aciclovir après absorption. La thymidine kinase du virus varicelle-zona le phosphoryle ; le triphosphate inhibe l’ADN-polymérase virale et arrête l’élongation de l’ADN viral. La sélectivité tient à l’enzyme virale, présente seulement dans les cellules infectées (Valtrex, Swissmedic).</p>
<div class="lab">Indication et posologie</div><p>Zona, y compris ophtalmique : 1000 mg trois fois par jour pendant 7 jours, dès que possible et au plus tard dans les 72 heures. Clairance 30 à 49 mL/min : 1000 mg deux fois par jour ; 10 à 29 : 1000 mg une fois par jour ; sous 10 : 500 mg une fois par jour.</p>
<div class="lab">Effet attendu</div><p>Abréger la durée de la douleur zostérienne aiguë, notamment chez le sujet âgé.</p>
<div class="lab">Grossesse</div><p>Chez la femme enceinte en fin de grossesse, l’exposition à l’aciclovir est environ doublée par rapport à l’aciclovir oral.</p>
<div class="lab">Limite</div><p>Les effets indésirables et les contre-indications détaillés de l’information professionnelle n’ont pas été extraits dans le dossier ; ils sont à relire dans le texte du produit.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Valtrex</a></p></template>
<template data-pop="g53-brivudine" data-title="Brivudine (Brivex)">
<div class="lab">Indication</div><p>Zona en phase précoce chez l’adulte immunocompétent. Posologie 125 mg par jour pendant 7 jours, début dans les 72 heures (DGN méningo-encéphalite 2025 ; Brivex, Swissmedic).</p>
<div class="lab">Mécanisme de l’interaction</div><p>Le métabolite bromovinyluracile inhibe irréversiblement la dihydropyrimidine-déshydrogénase, ce qui fait s’accumuler le 5-fluorouracile et les autres fluoropyrimidines de façon potentiellement mortelle. L’enzyme se rétablit 18 jours après la dernière dose (Brivex).</p>
<div class="lab">Contre-indications</div><p>Immunodépression ; fluorouracile, capécitabine ou flucytosine, récents, en cours ou prévus dans les 4 semaines ; grossesse (Brivex).</p>
<div class="lab">Décision</div><p>Devant un patient sous chimiothérapie, on choisit le valaciclovir. L’indication de la brivudine se limite à l’adulte immunocompétent sans fluoropyrimidine.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Brivex</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN méningo-encéphalite 2025</a></p></template>
<template data-pop="g53-pregabaline" data-title="Prégabaline (Lyrica)">
<div class="lab">Indication</div><p>Douleurs neuropathiques périphériques et centrales (Lyrica, Swissmedic).</p>
<div class="lab">Posologie</div><p>150 mg par jour en 2 ou 3 prises, 300 mg par jour après 3 à 7 jours, maximum 600 mg par jour après 7 jours supplémentaires.</p>
<div class="lab">Preuves dans la névralgie post-zostérienne</div><p>150, 300 et 600 mg par jour sont supérieurs au placebo. Les répondeurs (diminution de la douleur d’au moins 50 %) sont 22–26 %, 26–28 % et 38–50 % selon la dose, contre 9–20 % sous placebo.</p>
<div class="lab">Effets indésirables</div><p>Vertiges 30,7 % et somnolence 16,4 %. L’association à des opioïdes expose à une dépression respiratoire et à un décès (rapport de cotes ajusté 1,68).</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Lyrica</a></p></template>
<template data-pop="g53-gabapentine" data-title="Gabapentine (Gabapentine Spirig HC)">
<div class="lab">Indication</div><p>Chez l’adulte, neuropathie diabétique et névralgie post-zostérienne (Gabapentine Spirig HC, Swissmedic).</p>
<div class="lab">Posologie</div><p>300 mg le jour 1, 600 mg le jour 2, 900 mg le jour 3 ; entretien de 900 à 3600 mg par jour en trois prises. Adaptation si la clairance de la créatinine est inférieure à 80 mL/min.</p>
<div class="lab">Sécurité</div><p>Risque de syndrome DRESS. La gabapentine n’est pas recommandée chez l’enfant pour la douleur neuropathique.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Gabapentine Spirig</a></p></template>
<template data-pop="g53-qutenza" data-title="Capsaïcine 8 % en patch (Qutenza)">
<div class="lab">Indication</div><p>Douleurs neuropathiques périphériques de l’adulte (Qutenza, Swissmedic).</p>
<div class="lab">Posologie</div><p>Application de 60 minutes pour la névralgie post-zostérienne, jusqu’à 4 patchs, répétable tous les 90 jours (au minimum 60).</p>
<div class="lab">Précaution</div><p>Ne pas appliquer près des yeux ni des muqueuses. Pour une névralgie post-zostérienne faciale, cette limite restreint l’utilisation.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Qutenza</a></p></template>
<template data-pop="g53-efns" data-title="Recommandations de traitement de la douleur neuropathique">
<div class="lab">EFNS 2010</div><p>Niveau A pour les antidépresseurs tricycliques, la prégabaline, la gabapentine, le tramadol et les opioïdes, la lidocaïne topique et le patch de capsaïcine selon les conditions. L’association tricyclique–gabapentine et gabapentine–opioïde est utile (niveau A) (EFNS 2010, résumé).</p>
<div class="lab">Revue allemande 2016</div><p>Tricycliques, inhibiteurs de la recapture de la sérotonine et de la noradrénaline, et anticonvulsivants calciques en première intention, avec un nombre à traiter de 3,5 à 7,7 (Arztebl 2016, résumé).</p>
<div class="lab">Arbitrage de source</div><p>La recommandation de 2010 est plus ancienne que la revue de 2016. En cas de divergence, la source primaire applicable la plus récente prévaut, et le texte de 2010 reste accessible comme référence historique. Les deux ne sont lues qu’au niveau du résumé ; la directive allemande AWMF 030-114 n’a pas pu être consultée.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.02999.x" target="_blank" rel="noopener">EFNS 2010</a> ; <a href="https://doi.org/10.3238/arztebl.2016.0616" target="_blank" rel="noopener">Arztebl 2016</a></p></template>
<template data-pop="g53-vaccin" data-title="Vaccin Shingrix et plan de vaccination suisse 2026">
<div class="lab">Indications</div><p>Deux doses à 0 et 2 mois pour toutes les personnes de 65 ans et plus immunocompétentes (vaccination complémentaire, y compris après Zostavax avec un intervalle d’au moins 2 mois). Dès 50 ans en cas d’immunodéficience actuelle ou prévisible (VIH, insuffisance rénale terminale ou dialyse, traitements biologiques, azathioprine, méthotrexate à faible dose, corticothérapie d’entretien à faible dose, polyarthrite rhumatoïde, asthme sévère ou bronchopneumopathie chronique obstructive, diabète de type 1 mal contrôlé, autres maladies auto-immunes). Dès 18 ans en cas d’immunodéficience sévère ou d’immunosuppression forte (chimiothérapie, greffe, inhibiteurs de JAK, VIH avec moins de 200 CD4 par microlitre) : 0 et 1 à 2 mois (Plan de vaccination 2026).</p>
<div class="lab">Modalités</div><p>Pas de sérologie préalable ; attendre la guérison d’un zona aigu ; première dose idéalement au moins 2 semaines avant la chimiothérapie. La vaccination ne traite ni le zona ni la névralgie (Plan de vaccination 2026).</p>
<div class="lab">Efficacité</div><p>Contre la névralgie post-zostérienne : 100 % (intervalle de confiance 77,1–100) à 50 ans et plus ; 88,8 % (68,7–97,1) à 70 ans et plus ; 89,3 % après greffe de cellules souches hématopoïétiques. Le vaccin prévient la névralgie en prévenant le zona (Shingrix, Swissmedic).</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final%20%283%29.pdf" target="_blank" rel="noopener">Plan de vaccination 2026</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Shingrix</a></p></template>
<template data-pop="g53-penicilline" data-title="Pénicilline G et ceftriaxone dans la neurosyphilis">
<div class="lab">Schéma</div><p>Pénicilline G par voie intraveineuse : 4 × 6, 5 × 5 ou 3 × 10 millions d’unités par jour pendant 14 jours (minimum 10). Alternative : ceftriaxone 2 g par jour par voie intraveineuse pendant 14 jours, sans dose de charge de 4 g (DGN neurosyphilis 2026).</p>
<div class="lab">Extensions</div><p>Même schéma pour la syphilis oculaire, l’otosyphilis et toute coinfection par le VIH.</p>
<div class="lab">Sécurité</div><p>Des crises convulsives ont été observées sous fortes doses de pénicilline : un traitement antiépileptique concomitant est proposé si un antécédent de crises existe.</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse de la pénicilline G et de la ceftriaxone n’a pas été lue.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">DGN neurosyphilis 2026</a></p></template>
<template data-pop="g53-nsarc-ttt" data-title="Traitement de la neurosarcoïdose">
<div class="lab">Première ligne</div><p>Corticoïdes : prednisone 1 mg/kg avec décroissance sur des mois, ou méthylprednisolone 1000 mg par jour par voie intraveineuse pendant 3 jours puis prednisone orale plus faible (par exemple 20 mg par jour). Évolution favorable chez 71 % (161 sur 227) ; rechute chez 33 % sous corticoïdes seuls, dont 23 % neurologique (Westendorp 2025).</p>
<div class="lab">Deuxième ligne</div><p>Méthotrexate, agent de deuxième ligne de premier choix selon la directive européenne de 2021 ; azathioprine, mycophénolate ; réponse globale de 55 % (Westendorp 2025 ; ERS 2021, résumé).</p>
<div class="lab">Troisième ligne</div><p>Infliximab (amélioration 72 %, stabilisation 21 %, échec 7 % ; infections 10 à 39 %), adalimumab, rituximab, cyclophosphamide. Une tendance existe à une approche par phénotype et gravité avec anti-TNF précoce. Dans une cohorte espagnole, 82,4 % des patients sous biologique étaient en rémission complète à 12 mois (Herrero-Morant 2025, résumé).</p>
<div class="lab">Limite</div><p>Aucun essai randomisé n’existe pour la neurosarcoïdose ; les données sont observationnelles.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a> ; <a href="https://doi.org/10.1183/13993003.04079-2020" target="_blank" rel="noopener">ERS 2021</a> ; <a href="https://doi.org/10.3390/biomedicines13061360" target="_blank" rel="noopener">Herrero-Morant 2025</a></p></template>
<template data-pop="g53-intrathecal" data-title="Traitement intrathécal des métastases leptoméningées">
<div class="lab">Indication</div><p>Types IA et IC (niveau III, B) ; la voie ventriculaire est préférée (EANO-ESMO 2023).</p>
<div class="lab">Produits</div><p>Méthotrexate 10 à 15 mg deux fois par semaine pendant 4 semaines, puis hebdomadaire 4 semaines, puis mensuel, avec acide folinique ; cytarabine 10 mg ; thiotépa 10 mg ; trastuzumab (HER2 positif) ; pémétrexed (cancer bronchique non à petites cellules à EGFR muté, réponse de 85 %).</p>
<div class="lab">Systémique et radiothérapie</div><p>Types B et C : traitement systémique (osimertinib pour EGFR, céritinib pour ALK, nivolumab dans le mélanome). La radiothérapie stéréotaxique focale s’adresse aux lésions nodulaires ou symptomatiques ; la panencéphalique (30 Gy en 10 fractions, ou 20 Gy en 5) n’apporte pas de bénéfice de survie démontré ; la craniospinale expose à une myélosuppression de grade 3–4 jusqu’à 37 %.</p>
<div class="lab">Limite</div><p>Les informations professionnelles suisses de ces produits n’ont pas été lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a></p></template>
<template data-pop="g53-ponction" data-title="Ponction lombaire dans les atteintes crâniennes">
<div class="lab">Indication</div><p>Elle est indispensable pour classer la neuroborréliose en probable ou confirmée (DGN neuroborréliose 2025) et pour la cytologie des métastases leptoméningées (EANO-ESMO 2023).</p>
<div class="lab">Modalités</div><p>Pour les métastases : plus de 10 mL (minimum 5), analyse dans les 30 minutes, après l’imagerie, répétée une fois si la cytologie est négative ou équivoque, 14 jours environ après une chirurgie du système nerveux central (EANO-ESMO 2023).</p>
<div class="lab">Limite</div><p>Les contre-indications de la ponction lombaire ne sont pas détaillées dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">DGN neuroborréliose 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a></p></template>
<template data-pop="g53-irm" data-title="Imagerie par résonance magnétique : protocole">
<div class="lab">Métastases leptoméningées</div><p>Appareil de 1,5 tesla ou de préférence 3 teslas, gadolinium 0,1 mmol/kg, cerveau et moelle le même jour ou à 7 jours au plus. Une imagerie normale reste possible malgré un liquide positif : 26 % dans le cancer du poumon, 4 % dans le cancer du sein (EANO-ESMO 2023).</p>
<div class="lab">Neurosarcoïdose</div><p>Imagerie cérébrale anormale 79 %, spinale 50 % ; rehaussement méningé 46 %, des nerfs crâniens 26 % (Westendorp 2025).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a></p></template>
<template data-pop="g53-biomarqueurs" data-title="Enzyme de conversion de l’angiotensine et lysozyme">
<div class="lab">Valeur diagnostique</div><p>Enzyme de conversion sérique : sensibilité 75 % non traité, 35 % sous traitement ; lysozyme 46 % ; enzyme de conversion du liquide 67 % de sensibilité et 67 % de spécificité (Westendorp 2025).</p>
<div class="lab">Neuropathie optique</div><p>Enzyme : sensibilité 21,4 %, spécificité 97 % ; lysozyme : 33,3 % et 98 %. Ces dosages ne conviennent pas au dépistage (Daly 2026, résumé, source américaine descriptive).</p>
<div class="lab">Autre biomarqueur</div><p>Le récepteur soluble de l’interleukine 2 du liquide, au-dessus de 150 pg/mL, a une précision de 93 % contre les maladies non infectieuses seulement (Westendorp 2025).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a> ; <a href="https://doi.org/10.1097/WNO.0000000000002468" target="_blank" rel="noopener">Daly 2026</a></p></template>
<template data-pop="g53-dpd" data-title="Dihydropyrimidine-déshydrogénase">
<div class="lab">Définition</div><p>Enzyme qui dégrade le 5-fluorouracile et les fluoropyrimidines apparentées.</p>
<div class="lab">Interaction</div><p>Le bromovinyluracile, métabolite de la brivudine, l’inhibe de façon irréversible : les fluoropyrimidines s’accumulent. L’enzyme se rétablit 18 jours après la dernière dose de brivudine (Brivex).</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Brivex</a></p></template>
<template data-pop="g53-thymidine" data-title="Thymidine kinase virale">
<div class="lab">Définition</div><p>Enzyme du virus varicelle-zona qui phosphoryle l’aciclovir en première étape. Elle n’existe que dans les cellules infectées, ce qui explique la sélectivité de l’antiviral (Valtrex).</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Valtrex</a></p></template>
<template data-pop="g53-th" data-title="Réponse lymphocytaire Th1 et Th17.1">
<div class="lab">Définition</div><p>Dans la neurosarcoïdose, la réponse des lymphocytes CD4 est polarisée en Th1 et Th17.1 ; le rapport CD4/CD8 est élevé dans le liquide dans plusieurs séries (Westendorp 2025).</p>
<div class="lab">Limite</div><p>Les données sur la polarisation viennent d’une revue ; leur valeur diagnostique en pratique courante n’est pas établie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a></p></template>
<template data-pop="g53-tnf" data-title="Facteur de nécrose tumorale alpha">
<div class="lab">Rôle</div><p>Cytokine sécrétée par les cellules épithélioïdes, cruciale pour la formation du granulome de la sarcoïdose (Westendorp 2025).</p>
<div class="lab">Cible thérapeutique</div><p>L’infliximab et l’adalimumab bloquent cette cytokine dans les formes sévères (Westendorp 2025).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a></p></template>
<template data-pop="pareto-g53-definition" data-title="Pareto — Définition, classification et fréquence">
<p class="ratio" data-cover="g53-0,g53-1,g53-2"></p><ul><li>G 53 est un code astérisque : il se lit avec la maladie causale.</li><li>Cinq sous-codes : zona, infection, sarcoïdose, tumeur, autres.</li><li>Névralgie post-zostérienne : plus de 90 jours après l’éruption.</li><li>Tumeur : première cause des atteintes multiples hospitalières.</li></ul></template>
<template data-pop="pareto-g53-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g53-3,g53-4"></p><ul><li>Zona : réplication virale puis douleur ; le vaccin prévient la névralgie en prévenant le zona.</li><li>Infection : inflammation méningée.</li><li>Sarcoïdose : granulome non nécrosant, facteur de nécrose tumorale alpha.</li><li>Cancer : cellules dans les espaces sous-arachnoïdiens.</li></ul></template>
<template data-pop="pareto-g53-clinique" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="g53-5,g53-6"></p><ul><li>Rechercher tique, exposition sexuelle, zona, cancer, sarcoïdose.</li><li>Tester tous les nerfs crâniens.</li><li>Diplégie faciale : sarcoïdose, Lyme, Guillain-Barré.</li></ul></template>
<template data-pop="pareto-g53-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="g53-7,g53-8"></p><ul><li>Imagerie avant ponction lombaire.</li><li>Zona ophtalmique compliqué : aciclovir par voie intraveineuse.</li><li>Hydrocéphalie : neurochirurgie.</li></ul></template>
<template data-pop="pareto-g53-pec" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g53-9"></p><ul><li>Valaciclovir dans les 72 heures.</li><li>Lyme : 14 jours, sans corticoïdes.</li><li>Neurosyphilis : pénicilline G ou ceftriaxone, 14 jours.</li><li>Neurosarcoïdose : corticoïdes, méthotrexate, infliximab.</li><li>Métastases : intrathécal ou systémique.</li></ul></template>
<template data-pop="pareto-g53-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g53-10,g53-11"></p><ul><li>Vaccin : 2 doses à 0 et 2 mois dès 65 ans, ou 50 ans et 18 ans selon l’immunodéficience.</li><li>Jamais de brivudine avec une fluoropyrimidine.</li><li>L’index anticorps ne suit pas l’efficacité.</li></ul></template>
<template data-pop="pareto-g53-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="g53-e-1,g53-e-2,g53-e-3,g53-e-4"></p><ul><li>Cytologie répétée pour les métastases.</li><li>Index anticorps pour Lyme.</li><li>Biopsie pour la sarcoïdose ; enzyme de conversion non utile au dépistage.</li></ul></template>
<template data-pop="pareto-g53-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g53-s-anat-cours"></p><ul><li>Facial 24 % et optique 21 % dans la neurosarcoïdose.</li><li>Plusieurs nerfs : siège commun méningé, du tronc ou du sinus.</li></ul></template>
<template data-pop="pareto-g53-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g53-s-histo-cours"></p><ul><li>Granulome non nécrosant.</li><li>Cytologie du liquide pour les métastases.</li></ul></template>
<template data-pop="pareto-g53-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g53-s-physio-cours"></p><ul><li>Synthèse intrathécale d’anticorps dans Lyme.</li><li>Blocs de circulation et hydrocéphalie.</li></ul></template>
<template data-pop="pareto-g53-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g53-s-bioch-cours"></p><ul><li>Valaciclovir : activation par la thymidine kinase virale.</li><li>Brivudine : inhibition irréversible de la dihydropyrimidine-déshydrogénase.</li></ul></template>
<template data-pop="pareto-g53-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="g53-s-immuno-cours"></p><ul><li>Th1 et Th17.1 ; facteur de nécrose tumorale alpha.</li><li>Anti-TNF dans les formes sévères.</li></ul></template>
<template data-pop="pareto-g53-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g53-p-1,g53-p-2,g53-p-3"></p><ul><li>Brivudine interdite avec fluoropyrimidines.</li><li>Prégabaline : vertiges, somnolence, opioïdes.</li><li>Pas de corticoïdes dans la paralysie faciale de Lyme.</li></ul></template>
