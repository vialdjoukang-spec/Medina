<template data-pop="g82-codage" data-title="Codage CIM-10-GM de la catégorie G82">
<div class="lab">Ce que couvre le code</div><p>La catégorie G82 de la CIM-10-GM 2024 regroupe la paraparésie, la paraplégie, la tétraparésie et la tétraplégie (bloc G80–G83). Elle s’applique aux paralysies d’origine médullaire ou cérébrale lorsqu’aucun autre code n’existe, et elle peut être ajoutée en codage multiple pour signaler l’état, quelle qu’en soit la cause. Elle comprend la paraplégie, la quadriplégie, la tétraplégie et la forme chronique.</p>
<div class="lab">Exclusions</div><p>La paralysie médullaire traumatique aiguë se code S14, S24 ou S34 selon la région ; la paralysie cérébrale infantile se code G80. Un même patient change donc de code selon la phase : S pour l’épisode aigu, G82 pour l’état chronique.</p>
<div class="lab">Cinquième caractère (G82.0 à G82.5)</div><table class="t"><thead><tr><th>Caractère</th><th>Signification</th></tr></thead><tbody><tr><td>0</td><td>Aiguë complète, non traumatique</td></tr><tr><td>1</td><td>Aiguë incomplète, non traumatique</td></tr><tr><td>2</td><td>Chronique complète</td></tr><tr><td>3</td><td>Chronique incomplète</td></tr><tr><td>9</td><td>Non précisée, y compris d’origine cérébrale</td></tr></tbody></table>
<div class="lab">Codes supplémentaires</div><p>Le code G82.6-! note le niveau fonctionnel ; Z99.1 note une dépendance de longue durée à la ventilation. Le syndrome voisin de la queue de cheval relève de G83.4.</p>
<div class="lab">Limite</div><p>Les libellés ont été lus dans la version allemande du BfArM par un outil de résumé ; les libellés français de l’Office fédéral de la statistique n’ont pas été relus, et les règles suisses d’attribution du code ne l’ont pas été non plus. La correspondance avec la CIM-11 n’est pas vérifiée.</p>
<p class="src">Références : {{S1|BfArM, CIM-10-GM 2024, bloc G80–G83}}, lu le 15 octobre 2026.</p></template>
<template data-pop="g82-niveau-fonctionnel" data-title="Niveau fonctionnel G82.6-! et niveau neurologique">
<div class="lab">Tableau du code supplémentaire</div><p>Le niveau fonctionnel est le segment médullaire le plus bas dont la fonction motrice est intacte.</p>
<table class="t"><thead><tr><th>Code</th><th>Segments</th></tr></thead><tbody><tr><td>G82.60!</td><td>1er au 3e cervical</td></tr><tr><td>G82.61!</td><td>4e et 5e cervicaux</td></tr><tr><td>G82.62!</td><td>6e au 8e cervical</td></tr><tr><td>G82.63!</td><td>1er au 6e thoracique</td></tr><tr><td>G82.64!</td><td>7e au 10e thoracique</td></tr><tr><td>G82.65!</td><td>11e thoracique au 1er lombaire</td></tr><tr><td>G82.66!</td><td>2e lombaire au 1er sacré</td></tr><tr><td>G82.67!</td><td>2e au 5e sacré</td></tr><tr><td>G82.69!</td><td>Non précisé</td></tr></tbody></table>
<div class="lab">Différence avec l’examen standardisé</div><p>Le niveau neurologique lésionnel de la classification clinique se définit par la sensibilité et la motricité des deux côtés et correspond au plus rostral des quatre niveaux. Le niveau fonctionnel du codage se définit par la motricité seule. Les deux nombres peuvent différer chez un même patient : l’apprenant note l’un pour la clinique, l’autre pour le codage.</p>
<p class="src">Références : {{S1|BfArM, CIM-10-GM 2024}} ; {{S2|ISNCSCI, révision 2019}}.</p></template>
<template data-pop="g82-isncsci" data-title="Examen ISNCSCI 2019 : muscles clés et cotations">
<div class="lab">Principe</div><p>La classification internationale des lésions médullaires examine, de chaque côté, dix muscles clés et vingt-huit points sensitifs, puis les fonctions du segment sacré le plus bas. La révision 2019 est la référence actuelle citée.</p>
<div class="lab">Muscles clés</div><table class="t"><thead><tr><th>Segment</th><th>Muscle clé</th></tr></thead><tbody><tr><td>5e cervical</td><td>Fléchisseurs du coude</td></tr><tr><td>6e cervical</td><td>Extenseurs du poignet</td></tr><tr><td>7e cervical</td><td>Extenseurs du coude</td></tr><tr><td>8e cervical</td><td>Fléchisseurs des doigts (majeur)</td></tr><tr><td>1er thoracique</td><td>Abducteur du 5e doigt</td></tr><tr><td>2e lombaire</td><td>Fléchisseurs de hanche</td></tr><tr><td>3e lombaire</td><td>Extenseurs du genou</td></tr><tr><td>4e lombaire</td><td>Releveurs du pied</td></tr><tr><td>5e lombaire</td><td>Extenseur long des orteils</td></tr><tr><td>1er sacré</td><td>Fléchisseurs plantaires</td></tr></tbody></table>
<div class="lab">Cotation motrice</div><p>0 : paralysie ; 1 : contraction palpable ou visible ; 2 : mouvement sans pesanteur ; 3 : mouvement contre la pesanteur ; 4 : contre une résistance modérée ; 5 : force normale. Un muscle non testable reçoit la mention « non testable ». Le score moteur maximal est de 50 pour les membres supérieurs et de 50 pour les membres inférieurs.</p>
<div class="lab">Cotation sensitive</div><p>Le tact léger et la piqûre se testent en 28 points clés par côté, du 2e cervical aux 4e et 5e segments sacrés. Chaque point reçoit 0 (absent), 1 (altéré) ou 2 (normal), soit au maximum 56 par modalité et par côté.</p>
<div class="lab">Limite</div><p>Le dossier ne décrit pas la technique de chaque point ; l’apprentissage de l’examen suppose une démonstration pratique.</p>
<p class="src">Références : {{S2|Rupp et collaborateurs, ISNCSCI révision 2019}}, lu le 15 octobre 2026.</p></template>
<template data-pop="g82-nli" data-title="Niveau neurologique lésionnel : règle et exemple">
<div class="lab">Règle</div><p>Le niveau sensitif est le dermatome le plus caudal normal (cotation 2) au tact léger et à la piqûre, tous les dermatomes au-dessus étant normaux. Le niveau moteur est le muscle clé le plus bas coté 3 ou plus, les muscles clés situés au-dessus étant à 5. Le niveau neurologique lésionnel est le segment le plus caudal dont la sensibilité est intacte et la motricité antigravitaire, des deux côtés ; en pratique, c’est le plus rostral des quatre niveaux (sensitif droit, sensitif gauche, moteur droit, moteur gauche).</p>
<div class="lab">Exemple fictif</div><p>Sensitif droit : 6e cervical. Sensitif gauche : 5e cervical. Moteur droit : 6e cervical. Moteur gauche : 6e cervical. Le plus rostral est le 5e cervical : le niveau neurologique lésionnel est le 5e cervical.</p>
<div class="lab">Pourquoi le plus haut ?</div><p>La lésion est là où la moelle cesse de fonctionner normalement d’un côté au moins pour une modalité. Retenir le niveau le plus haut évite de sous-estimer l’atteinte.</p>
<p class="src">Références : {{S2|ISNCSCI, révision 2019}}.</p></template>
<template data-pop="g82-sacre" data-title="Épargne sacrée et toucher rectal">
<div class="lab">Définition</div><p>L’épargne sacrée est la présence d’une fonction au niveau des segments sacrés les plus bas : tact ou piqûre aux 4e et 5e segments sacrés, pression anale profonde ou contraction anale volontaire. Une lésion est complète lorsqu’aucune épargne sacrée n’existe.</p>
<div class="lab">Application</div><p>Deux de ces quatre éléments ne s’obtiennent que par un toucher rectal : sans lui, le classement en lésion complète ou incomplète n’est pas établi. Le résultat décide du grade A (aucune épargne) ou d’un grade supérieur.</p>
<div class="lab">Limite</div><p>L’épargne sacrée prouve qu’une fonction traverse la lésion ; elle ne prédit pas, dans ce dossier, le degré de récupération.</p>
<p class="src">Références : {{S2|ISNCSCI, révision 2019}}.</p></template>
<template data-pop="g82-ais" data-title="Grades AIS A à E">
<div class="lab">Grades</div><table class="t"><thead><tr><th>Grade</th><th>Critère</th></tr></thead><tbody><tr><td>A</td><td>Complet : aucune fonction sensitive ni motrice aux 4e et 5e segments sacrés</td></tr><tr><td>B</td><td>Sensitif incomplet : sensibilité sacrée sans motricité, et aucune motricité au-delà de trois niveaux sous le niveau moteur</td></tr><tr><td>C</td><td>Moteur incomplet : moins de la moitié des muscles clés sous le niveau neurologique lésionnel cotés 3 ou plus</td></tr><tr><td>D</td><td>Moteur incomplet : au moins la moitié de ces muscles cotés 3 ou plus</td></tr><tr><td>E</td><td>Normal chez un patient ayant eu des déficits</td></tr></tbody></table>
<div class="lab">Lecture</div><p>Le grade se détermine par étapes : la complétude d’abord (épargne sacrée), puis la motricité sous le niveau. L’échelle décrit la gravité neurologique ; elle ne remplace pas la description du niveau.</p>
<div class="lab">Limite</div><p>En l’absence de lésion médullaire, aucun grade AIS ne s’attribue.</p>
<p class="src">Références : {{S2|ISNCSCI, révision 2019}}.</p></template>
<template data-pop="g82-zpp" data-title="Zone de préservation partielle">
<div class="lab">Définition</div><p>La zone de préservation partielle est le segment le plus caudal qui conserve une fonction, rapportée pour quatre catégories. Elle s’utilise lorsque la contraction anale volontaire est absente (zone motrice) ou lorsque la pression anale profonde, le tact et la piqûre des segments sacrés sont absents (zone sensitive).</p>
<div class="lab">Révision 2019</div><p>Le texte de 2019 l’étend à certaines lésions incomplètes. Dans une cohorte européenne, les zones motrices étaient applicables dans 35,2 % des examens de lésions incomplètes, et dans tous les examens de grade B.</p>
<div class="lab">Limite</div><p>Un seul échantillon est cité ; le chiffre ne se généralise pas à d’autres populations.</p>
<p class="src">Références : {{S2|ISNCSCI, révision 2019}} ; {{S3|zone de préservation partielle, cohorte EMSCI, Spinal Cord 2024}}.</p></template>
<template data-pop="g82-syndromes" data-title="Syndromes médullaires cliniques">
<div class="lab">Tableau</div><table class="t"><thead><tr><th>Syndrome</th><th>Profil</th></tr></thead><tbody><tr><td>Centromédullaire</td><td>Souvent après hyperextension sur un canal cervical spondylotique ; membres supérieurs plus faibles que les membres inférieurs</td></tr><tr><td>Brown-Séquard</td><td>Déficit moteur et proprioceptif du même côté, déficit thermo-algique du côté opposé ; forme pure rare</td></tr><tr><td>Antérieur</td><td>Perte de la motricité et de la sensibilité thermo-algique ; tact et position préservés</td></tr><tr><td>Cône médullaire</td><td>Vers les 1er et 2e segments lombaires ; signes centraux et périphériques mêlés ; réflexes sacrés parfois conservés</td></tr><tr><td>Queue de cheval</td><td>Atteinte périphérique des racines : paralysie flasque, vessie et intestin aréflexiques</td></tr></tbody></table>
<div class="lab">Statut</div><p>Ces syndromes sont qualitatifs et ne remplacent pas le grade AIS ; ils décrivent un profil.</p>
<div class="lab">Limite</div><p>Le dossier ne rapporte pas l’explication anatomique de chaque profil.</p>
<p class="src">Références : {{S2|ISNCSCI, révision 2019}}.</p></template>
<template data-pop="g82-cauda" data-title="Queue de cheval et cône médullaire">
<div class="lab">Distinction</div><p>La queue de cheval est l’atteinte des racines nerveuses ; elle est périphérique, donc flasque, avec vessie et intestin aréflexiques. Le cône médullaire, vers les 1er et 2e segments lombaires, mêle signes centraux et périphériques ; des réflexes sacrés peuvent rester conservés. Une lésion médullaire plus haute peut devenir spastique.</p>
<div class="lab">Codage</div><p>La queue de cheval se code G83.4 : G83.40 pour la forme complète, G83.41 pour l’incomplète, G83.49 sans précision, avec un code G95.8 pour la vessie neurogène.</p>
<div class="lab">Limite</div><p>La conduite urgente d’une compression de la queue de cheval n’a pas été documentée dans le dossier.</p>
<p class="src">Références : {{S1|BfArM, CIM-10-GM 2024}} ; {{S2|ISNCSCI, révision 2019}}.</p></template>
<template data-pop="g82-calcul-moteur" data-title="Calcul du score moteur de la vignette">
<h3>Addition</h3><p>À droite : 5 + 4 + 2 + 0 + 0 = 11. À gauche : 5 + 3 + 1 + 0 + 0 = 9. Le score moteur du membre supérieur est 11 + 9 = 20 sur un maximum de 50.</p>
<h3>Lecture</h3><p>Les cinq muscles du membre supérieur ont chacun une valeur maximale de 5, donc 25 par côté et 50 au total. Le score exprime l’étendue de la force préservée ; il ne donne pas le niveau, qui se lit sur le muscle clé le plus bas coté 3 ou plus, au-dessus duquel tous les muscles sont à 5.</p>
<h3>Limite</h3><p>Valeurs fictives, choisies pour illustrer le raisonnement. Les membres inférieurs, cotés 0, ajoutent 0 au score total.</p></template>
<template data-pop="g82-calcul-da" data-title="Calcul de la hausse tensionnelle de la vignette">
<h3>Hausse</h3><p>170 − 105 = 65 mmHg au-dessus de la valeur de base.</p>
<h3>Comparaison au seuil</h3><p>Le seuil de la définition est une hausse de plus de 20 mmHg, soit une valeur supérieure à 105 + 20 = 125 mmHg. La valeur de 170 dépasse le seuil de 45 mmHg (65 − 20).</p>
<h3>Limite</h3><p>Valeurs fictives. Le seuil définit l’épisode ; il ne donne pas à lui seul la gravité, et le dossier ne fournit pas de seuil thérapeutique.</p></template>
<template data-pop="g82-incidence" data-title="Incidence suisse des lésions médullaires traumatiques">
<div class="lab">Résultat</div><p>D’après les données hospitalières de l’Office fédéral de la statistique pour 2012–2013, l’incidence varie de 19,9 à 49,7 par million d’habitants et par an selon les critères. Elle est plus élevée chez l’homme, aux âges élevés et pour la paraplégie.</p>
<div class="lab">Sous-couverture</div><p>On compte 621 cas administratifs contre 213 dans la cohorte SwiSCI. Les centres spécialisés ne voient donc pas tous les patients, surtout les personnes âgées et les lésions moins sévères.</p>
<div class="lab">Limite</div><p>Les cas administratifs dépendent des codes de sortie d’hôpital ; ils ne distinguent pas toujours une vraie lésion médullaire d’une codification large. La cohorte spécialisée sous-estime la fréquence chez les personnes âgées.</p>
<p class="src">Références : {{S4|Chamberlain et collaborateurs, incidence suisse, Swiss Medical Weekly 2017}} ; {{S28|cohorte SwiSCI, une décennie de recherche}}.</p></template>
<template data-pop="g82-profil" data-title="Profil des patients en réadaptation spécialisée suisse">
<div class="lab">Premier échantillon (nouveaux cas)</div><p>Âge médian 53,5 ans ; 69,6 % d’hommes ; 53,3 % de paraplégies ; 53,7 % de lésions motrices incomplètes ; séjour médian de 5,2 mois.</p>
<div class="lab">Second échantillon</div><p>77,7 % d’hommes ; 73,7 % de causes traumatiques ; 59,8 % de paraplégies ; âge médian de 51 ans.</p>
<div class="lab">Lecture</div><p>Plus d’une lésion sur deux est motrice incomplète dans le premier échantillon, ce qui rappelle que la tétraplégie complète ne résume pas la population.</p>
<div class="lab">Limite</div><p>Ce sont des échantillons de centres spécialisés ; ils sous-représentent les personnes âgées.</p>
<p class="src">Références : {{S5|SwiSCI, risque cardiovasculaire et réadaptation}} ; {{S6|SwiSCI, cohorte d’incidence}}.</p></template>
<template data-pop="g82-mortalite" data-title="Mortalité et espérance de vie après lésion médullaire en Suisse">
<div class="lab">Lésion traumatique</div><p>La mortalité est 2,32 fois celle de la population suisse (rapport standardisé de mortalité 2,32 ; intervalle de confiance à 95 % 2,10–2,56). La tétraplégie s’associe à davantage de décès respiratoires, cardiovasculaires, infectieux et accidentels, et les rapports sont élevés pour les infections urinaires et les septicémies.</p>
<div class="lab">Espérance de vie</div><p>À 30 ans, elle atteint 80,6 % (hommes) et 76,9 % (femmes) de celle de la population suisse ; il reste 45,1 années en cas de paraplégie incomplète contre 28,7 en cas de tétraplégie complète.</p>
<div class="lab">Lésion non traumatique</div><p>La mortalité est 1,6 fois celle de la population générale (causes : cardiovasculaires 39,8 %, néoplasiques 22 %, infectieuses 9,9 %). Par rapport à l’étiologie traumatique, le rapport de risque est de 10 pour une cause maligne, 2,6 pour une cause infectieuse et 2,5 pour une cause vasculaire.</p>
<div class="lab">Limite</div><p>Ces rapports comparent des groupes ; ils ne prédisent pas l’évolution d’un patient. Les associations par étiologie ne prouvent pas la causalité.</p>
<p class="src">Références : {{S7|Chamberlain et collaborateurs, mortalité traumatique, Neuroepidemiology 2019}} ; {{S8|années de vie perdues, International Journal of Public Health 2019}} ; {{S9|mortalité non traumatique, Spinal Cord 2019}} ; {{S10|variation selon l’étiologie, Spinal Cord 2020}}.</p></template>
<template data-pop="g82-nontrauma" data-title="Lésions non traumatiques et myélopathie cervicale dégénérative">
<div class="lab">Fréquence</div><p>La myélopathie cervicale dégénérative est présentée comme la cause la plus fréquente de lésion médullaire non traumatique de l’adulte (protocole de recommandations de récupération améliorée après chirurgie, 2025).</p>
<div class="lab">Délai diagnostique</div><p>Dans une cohorte britannique, l’adressage survenait à 6,4 mois, l’IRM à 12,5 mois et l’avis chirurgical à 15,8 mois après le début des symptômes. Le diagnostic est donc tardif dans cette cohorte.</p>
<div class="lab">Groupes étiologiques</div><p>La cohorte SwiSCI distingue les causes dégénératives, malignes, infectieuses et vasculaires, dont la survie diffère.</p>
<div class="lab">Limite</div><p>Le délai vient d’un système de soins britannique et ne décrit pas la Suisse ; aucune donnée suisse sur le délai n’a été lue.</p>
<p class="src">Références : {{S24|protocole de récupération améliorée, chirurgie de la myélopathie cervicale, Spinal Cord 2025}} ; {{S23|Hilton et collaborateurs, parcours diagnostique, BMJ Open 2019}} ; {{S10|variation selon l’étiologie}}.</p></template>
<template data-pop="g82-cardiometa" data-title="Risque cardiométabolique après lésion médullaire">
<div class="lab">Chiffres suisses</div><p>Un tiers des patients sont à haut risque cardiovasculaire à la sortie de réadaptation, et le syndrome cardiométabolique touche environ 40 % d’entre eux. L’hypertension, le diabète et l’obésité sont plus fréquents après une lésion non traumatique qu’après une lésion traumatique.</p>
<div class="lab">Conduite</div><p>Le risque se dépiste dès la réadaptation. Les causes cardiovasculaires représentent 39,8 % des décès après lésion non traumatique, ce qui donne au dépistage un poids pronostique.</p>
<div class="lab">Limite</div><p>Les valeurs cibles et les traitements ne sont pas détaillés dans le dossier ; l’association entre lésion et risque ne prouve pas à elle seule le mécanisme.</p>
<p class="src">Références : {{S5|SwiSCI, risque cardiovasculaire}} ; {{S34|risque cardiométabolique traumatique et non traumatique, Spinal Cord 2024}} ; {{S9|mortalité non traumatique}}.</p></template>
<template data-pop="g82-perdus" data-title="Patients perdus de vue des centres spécialisés">
<div class="lab">Résultat</div><p>Les patients qui quittent le suivi des centres spécialisés ont un risque de décès multiplié par 3,62 après lésion traumatique.</p>
<div class="lab">Interprétation</div><p>L’association est forte, mais elle peut refléter des patients plus fragiles ou plus isolés, autant qu’un effet du suivi. La conduite qui en découle est de maintenir le lien avec le centre.</p>
<div class="lab">Autres données de soins</div><p>Une aide à domicile professionnelle est utilisée par 22 % des personnes (médiane de 6 heures par semaine), plus souvent si l’indépendance fonctionnelle est faible ; les troubles du sommeil touchent 58,8 % des patients, dont 69,4 % ne sont pas traités.</p>
<p class="src">Références : {{S32|attrition et mortalité, BMJ Open 2020}} ; {{S29|aide à domicile professionnelle, BMC Health Services Research 2023}} ; {{S30|troubles du sommeil, Journal of Spinal Cord Medicine 2020}}.</p></template>
<template data-pop="g82-age" data-title="Vessie neurogène de l’homme âgé">
<div class="lab">Risques</div><p>Chez l’homme âgé avec lésion médullaire, l’hypertrophie prostatique, la dysfonction vésicale neurogène et le cancer de vessie se cumulent. Le risque de cancer de vessie est multiplié par 16 à 28, et le passage à une sonde à demeure est fréquent.</p>
<div class="lab">Dysréflexie</div><p>Les gestes prostatiques exposent au risque de dysréflexie autonome ; les recommandations européennes demandent de surveiller la pression artérielle et la fréquence cardiaque pendant les gestes invasifs chez les patients à risque.</p>
<div class="lab">Limite</div><p>Il s’agit d’une revue publiée en 2026 ; le dossier ne rapporte pas de conduite de dépistage du cancer de vessie.</p>
<p class="src">Références : {{S31|dysfonction vésicale neurogène de l’homme âgé, Nature Reviews Urology 2026}} ; {{S4|incidence suisse, sous-représentation des personnes âgées}}.</p></template>
<template data-pop="g82-dysraphisme" data-title="Dysraphisme spinal de l’enfant et de l’adolescent">
<div class="lab">Recommandation</div><p>Un guide européen conjoint de 2025 (urologie, urologie pédiatrique et réseau de référence), dont le résumé a paru en 2026, demande une prise en charge multidisciplinaire et une urodynamique centrale chez les enfants et adolescents avec dysraphisme spinal.</p>
<div class="lab">Lien avec la leçon</div><p>Le spina bifida est une cause de paralysie médullaire de l’enfant ; la vessie neurogène suit les mêmes principes de protection du haut appareil urinaire.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu ; la prise en charge neurologique et orthopédique de l’enfant n’est pas documentée.</p>
<p class="src">Références : {{S37|recommandation européenne sur le dysraphisme spinal, résumé, Eur Urol Open Science 2026}}.</p></template>
<template data-pop="g82-lacunes" data-title="Ce que le dossier de ce cours ne couvre pas">
<div class="lab">Sources manquantes</div><p>Aucune recommandation suisse de paraplégiologie (société suisse de paraplégie, centres spécialisés, Swiss Medical Forum) n’a pu être lue. Les lignes directrices AO Spine ont été lues au niveau des résumés ; elles sont internationales et non européennes. Les recommandations américaines antérieures qu’elles actualisent n’ont pas été utilisées.</p>
<div class="lab">Sujets non documentés</div><p>Traitement médicamenteux de la dysréflexie autonome (seuils, antihypertenseurs, doses) ; choc neurogène et choc spinal (seule une étude observationnelle sur la définition) ; prévention et traitement des escarres, programme intestinal, ostéoporose, douleur neuropathique, ossifications hétérotopiques, fonction respiratoire du tétraplégique ; différentiel non traumatique ; information professionnelle des héparines de bas poids moléculaire, de la tizanidine et de la toxine botulique ; score fonctionnel de mesure d’indépendance, cité sans description.</p>
<div class="lab">Conséquence</div><p>Le cours n’invente aucune dose ni aucun seuil sur ces points. Il renvoie au protocole du centre spécialisé et à un audit ultérieur.</p>
<p class="src">Références : dossier de recherche du cycle Betta 39, lacunes explicites, 15 octobre 2026.</p></template>
