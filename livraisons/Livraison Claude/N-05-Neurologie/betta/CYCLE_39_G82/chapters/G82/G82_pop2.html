<template data-pop="g82-lesion2" data-title="Lésion primaire et lésion secondaire">
<div class="lab">Deux temps</div><p>La lésion primaire est l’atteinte mécanique initiale. La lésion secondaire est l’aggravation du tissu nerveux qui suit, notamment d’origine ischémique. Elle est la cible des gestes de la phase aiguë.</p>
<div class="lab">Deux leviers</div><p>La décompression précoce vise à limiter l’atteinte secondaire du tissu nerveux, d’après des données précliniques. Le maintien d’une pression de perfusion vise à limiter la lésion ischémique secondaire en améliorant la perfusion et l’oxygénation de la moelle.</p>
<div class="lab">Limite</div><p>L’effet de la pression sur la récupération reste incertain ; la justification de la décompression repose en partie sur des données animales.</p>
<p class="src">Références : {{S11|AO Spine et Praxis, décompression chirurgicale, Global Spine Journal 2024}} ; {{S12|AO Spine et Praxis, prise en charge hémodynamique, 2024}}.</p></template>
<template data-pop="g82-pam" data-title="Pression artérielle moyenne et perfusion médullaire">
<div class="lab">Recommandation</div><p>Les lignes directrices AO Spine et Praxis recommandent d’élever la pression artérielle moyenne à au moins 75–80 mmHg, de ne pas l’augmenter activement au-delà de 90–95 mmHg, pendant 3 à 7 jours. Elles ne se prononcent pas sur le choix du vasopresseur. Les recommandations sont faibles, appuyées sur des preuves très faibles.</p>
<div class="lab">Raisonnement</div><p>La moelle lésée dépend de la pression de perfusion ; une pression basse aggrave l’ischémie secondaire. La borne haute évite d’élever la pression sans bénéfice démontré.</p>
<div class="lab">Limite</div><p>Une revue systématique actualisée conclut que l’effet de l’optimisation de la perfusion sur la récupération reste incertain. Ces lignes directrices sont internationales, non européennes.</p>
<p class="src">Références : {{S12|AO Spine et Praxis, hémodynamique, 2024}} ; {{S13|Kwon et collaborateurs, introduction aux lignes directrices, 2024}} ; {{S39|Evaniew et collaborateurs, perfusion médullaire, revue systématique 2024}}.</p></template>
<template data-pop="g82-choc" data-title="Choc neurogène : ce que le dossier documente">
<div class="lab">Définition</div><p>Dans les lésions cervicales, la perte brutale du tonus sympathique produit une vasodilatation, une hypotension et une bradycardie.</p>
<div class="lab">Conséquence</div><p>L’hypotension compromet la perfusion de la moelle lésée, ce qui rejoint l’objectif de pression artérielle de la phase aiguë.</p>
<div class="lab">Limite</div><p>La seule source lue est une étude observationnelle de niveau faible sur la microcirculation. Aucun seuil ni traitement n’est documenté, et le choc spinal n’est pas traité dans ce cours.</p>
<p class="src">Références : {{S35|Cureus 2025, microcirculation et choc neurogène}}.</p></template>
<template data-pop="g82-vessie" data-title="Vessie neurogène selon le niveau de la lésion">
<div class="lab">Lésion suprasacrée</div><p>Entre le pont et la moelle sacrée, le détrusor devient hyperactif et la coordination avec le sphincter se perd (dyssynergie) ; le résidu post-mictionnel est souvent augmenté.</p>
<div class="lab">Lésion sacrée ou infrasacrée</div><p>Le détrusor est hypo- ou acontractile, et le résidu est augmenté.</p>
<div class="lab">Fréquences et danger</div><p>L’hyperactivité et la dyssynergie atteignent jusqu’à 95 % des cas, l’hypoactivité jusqu’à 83 %, selon le niveau. Le danger principal est l’atteinte du haut appareil urinaire par des pressions vésicales élevées.</p>
<div class="lab">Limite</div><p>Le niveau oriente mais ne tranche pas : l’urodynamique est obligatoire pour typer la dysfonction.</p>
<p class="src">Références : {{S18|EAU, recommandations de neuro-urologie, mise à jour limitée de mars 2026}}.</p></template>
<template data-pop="g82-da" data-title="Dysréflexie autonome : définition, signes, déclencheurs, gravité">
<div class="lab">Définition</div><p>La dysréflexie autonome est une réponse autonome brutale et exagérée à un stimulus, en général lorsque la lésion se situe au 6e segment thoracique ou au-dessus. Elle se définit par une hausse de la pression systolique de plus de 20 mmHg par rapport à la valeur de base.</p>
<div class="lab">Signes</div><p>Céphalée sévère, vision floue, anxiété, variation de la fréquence cardiaque, sudation, piloérection, érythème au-dessus de la lésion, pâleur et peau froide en dessous.</p>
<div class="lab">Déclencheurs</div><p>Vessie ou intestin distendus (y compris cystoscopie et urodynamique), sonde à demeure, ongle incarné infecté, escarre, stimulation sexuelle. Une urodynamique a déclenché l’épisode dans 43,3 % des examens de patients lésés au 6e segment thoracique ou au-dessus, avec une hausse diastolique de plus de 10 mmHg dans 76,2 % des épisodes (étude observationnelle).</p>
<div class="lab">Gravité</div><p>Une revue de cas rapporte des atteintes du système nerveux central (83 %), des décès (2 cas sur 18) et des déclencheurs vésicaux ou intestinaux dans 89 % des cas ; un rapport de cas décrit des hémorragies cérébrales récidivantes.</p>
<div class="lab">Limite</div><p>Le traitement médicamenteux de l’épisode n’est pas documenté dans le dossier. Le cours s’en tient à la définition, aux déclencheurs et à la prévention urologique.</p>
<p class="src">Références : {{S18|EAU 2026}} ; {{S19|Kirshblum et collaborateurs, pression diastolique, J Spinal Cord Med 2021}} ; {{S33|Hirsch et Krassioukov, décès et séquelles, 2026}} ; {{S36|dysréflexie et hémorragies cérébrales récidivantes, rapport de cas 2026}}.</p></template>
<template data-pop="g82-da-neuro" data-title="Dysréflexie autonome : mécanisme neuronal et traitement de l’hyperactivité vésicale">
<div class="lab">Mécanisme</div><p>Une équipe lausannoise (CHUV, université de Lausanne, EPFL) a décrit une architecture neuronale de la moelle qui se réorganise après la lésion et produit la dysréflexie. Une stimulation électrique épidurale ciblée l’a inversée chez la souris, le rat et l’humain.</p>
<div class="lab">Lien vésical</div><p>Une revue systématique de 2026 rapporte que traiter l’hyperactivité du détrusor, par la fésotérodine ou la toxine botulique, réduit la fréquence et la gravité des épisodes.</p>
<div class="lab">Limite</div><p>La stimulation épidurale est un résultat de recherche et non une pratique recommandée dans ce dossier ; aucune indication clinique n’en découle.</p>
<p class="src">Références : {{S22|Soriano et collaborateurs, Nature 2025}} ; {{S20|traiter l’hyperactivité du détrusor pour gérer la dysréflexie, revue systématique, Autonomic Neuroscience 2026}}.</p></template>
<template data-pop="g82-spasticite" data-title="Spasticité : un tonus utile qu’on ne supprime pas">
<div class="lab">Fonction</div><p>Le tonus résiduel et des spasmes occasionnels peuvent soutenir la posture, la circulation et la prévention de la thrombose.</p>
<div class="lab">Conséquence</div><p>Réduire trop la spasticité expose aux chutes. La dose se règle sur l’effet fonctionnel.</p>
<div class="lab">Limite</div><p>La spasticité est ici décrite d’après l’information professionnelle suisse du baclofène ; ni échelle d’évaluation ni autre traitement (tizanidine, toxine botulique) n’ont été relus.</p>
<p class="src">Références : informations professionnelles suisses {{S25|Liorésal®, baclofène oral}}.</p></template>
<template data-pop="g82-decompression" data-title="Décompression chirurgicale précoce">
<div class="lab">Recommandation</div><p>Chez l’adulte, la chirurgie de décompression dans les 24 heures est l’option préférée, quel que soit le niveau de la lésion. Il n’y a pas de recommandation pour la chirurgie ultra-précoce (avant 12 heures).</p>
<div class="lab">Chiffres</div><p>La récupération d’au moins deux grades AIS à 6 mois est plus fréquente avec la décompression précoce : risque relatif 2,76 (intervalle de confiance à 95 % 1,60–4,98). Le score moteur gagne 4,50 points de plus.</p>
<div class="lab">Syndrome centromédullaire</div><p>Une chirurgie précoce est à envisager (recommandation faible, ligne directrice de 2017).</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu. Les études sont observationnelles pour une part, et ces lignes directrices sont internationales.</p>
<p class="src">Références : {{S11|AO Spine et Praxis, décompression chirurgicale, 2024}} ; {{S38|AO Spine, syndrome centromédullaire, 2017}}.</p></template>
<template data-pop="g82-mpss" data-title="Méthylprednisolone dans la lésion aiguë">
<div class="lab">Recommandation</div><p>Un schéma de 24 heures à dose élevée est proposé comme option si l’administration débute dans les 8 heures. Il n’est pas proposé après 8 heures. Aucun schéma de 48 heures n’est proposé.</p>
<div class="lab">Force</div><p>Les recommandations sont faibles. Elles datent de 2017 et sont internationales.</p>
<div class="lab">Limite</div><p>Le dossier ne précise pas la dose ; le cours n’en donne aucune. Une administration tardive n’entre pas dans la recommandation.</p>
<p class="src">Références : {{S14|AO Spine, méthylprednisolone, Global Spine Journal 2017}}.</p></template>
<template data-pop="g82-thrombo" data-title="Thromboprophylaxie dans la lésion aiguë">
<div class="lab">Recommandation</div><p>Une anticoagulation de routine est recommandée, par héparine de bas poids moléculaire sous-cutanée ou héparine non fractionnée à dose fixe faible. L’héparine non fractionnée à dose ajustée est à éviter. Le traitement débute dans les 72 heures si possible.</p>
<div class="lab">Raisonnement</div><p>La paralysie immobilise le patient, ce qui expose à la thrombose ; le tonus résiduel qui la prévient plus tard est absent en phase aiguë flasque (lecture du cours).</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse des héparines n’a pas été lue ; aucune dose n’est donnée ici.</p>
<p class="src">Références : {{S15|AO Spine, thromboprophylaxie anticoagulante, Global Spine Journal 2017}}.</p></template>
<template data-pop="g82-irm" data-title="IRM dans la lésion aiguë">
<div class="lab">Recommandation</div><p>L’IRM est suggérée avant la chirurgie, lorsque c’est faisable, pour la décision opératoire, et à la phase aiguë pour le pronostic neurologique.</p>
<div class="lab">Force</div><p>Recommandations faibles, appuyées sur des preuves très faibles à faibles.</p>
<div class="lab">Limite</div><p>Lignes directrices de 2017 lues en résumé ; les paramètres de séquences ne sont pas documentés.</p>
<p class="src">Références : {{S16|AO Spine, IRM de base, Global Spine Journal 2017}}.</p></template>
<template data-pop="g82-readapt" data-title="Réadaptation de la lésion aiguë">
<div class="lab">Recommandations</div><p>La réadaptation débute dès que le patient est stable et tolère l’intensité. L’entraînement sur tapis avec allègement du poids peut être ajouté. La stimulation électrique fonctionnelle peut aider la main dans les lésions cervicales aiguës ou subaiguës. Aucun entraînement supplémentaire en position assise sans appui n’est recommandé.</p>
<div class="lab">Contexte suisse</div><p>La réadaptation se fait dans des centres spécialisés, que couvre la cohorte SwiSCI.</p>
<div class="lab">Limite</div><p>Recommandations faibles de 2017 ; elles ne chiffrent ni la durée ni l’intensité.</p>
<p class="src">Références : {{S17|AO Spine, type et délai de la réadaptation, 2017}} ; {{S8|Chamberlain et collaborateurs, cohorte suisse}}.</p></template>
<template data-pop="g82-neurourologie" data-title="Neuro-urologie : recommandations européennes de 2026">
<div class="lab">Priorités</div><p>Premièrement protéger le haut appareil urinaire, deuxièmement la continence, troisièmement restaurer la fonction, quatrièmement la qualité de vie.</p>
<div class="lab">À éviter</div><p>Le Credé et la poussée abdominale créent des pressions élevées. La miction réflexe déclenchée est déconseillée.</p>
<div class="lab">Choix selon le type</div><p>Antimuscariniques ou bêta-3 pour l’hyperactivité ; alpha-bloquants pour réduire la résistance de sortie ; aucun parasympathomimétique pour un détrusor hypoactif ; natrémie à contrôler sous desmopressine.</p>
<div class="lab">Autre document</div><p>Un guide allemand de pratique clinique (mise à jour 3.0, 2026) est consacré à l’auto-sondage intermittent, y compris la gestion des infections et de la dysréflexie ; seul son résumé a été lu.</p>
<p class="src">Références : {{S18|EAU, neuro-urologie 2026, texte complet}} ; {{S21|auto-sondage intermittent, guide allemand, 2026}}.</p></template>
<template data-pop="g82-sondage" data-title="Auto-sondage intermittent et traitements de deuxième ligne">
<div class="lab">Auto-sondage</div><p>La décision est partagée et l’instruction approfondie. En cas d’intolérance orale, l’oxybutynine intravésicale est une option.</p>
<div class="lab">Deuxième ligne</div><p>Toxine botulique A intradétrusorienne si l’antimuscarinique est inefficace ; entérocystoplastie si la compliance est faible ou l’hyperactivité réfractaire ; neuromodulation sacrée chez des patients choisis.</p>
<div class="lab">Limite</div><p>L’information professionnelle de la toxine botulique n’a pas été relue ; aucune dose n’est donnée. Les indications chirurgicales se décident en centre spécialisé.</p>
<p class="src">Références : {{S18|EAU 2026}} ; {{S21|guide allemand de l’auto-sondage}}.</p></template>
<template data-pop="g82-itu" data-title="Infections urinaires du patient lésé médullaire">
<div class="lab">Recommandations</div><p>Ne pas dépister par bandelette urinaire ; ne pas dépister ni traiter une bactériurie asymptomatique ; en cas de récidive, optimiser la vessie et retirer les corps étrangers ; une antibioprophylaxie hebdomadaire cyclique est possible chez certains patients en auto-sondage ; éviter l’antibiothérapie continue.</p>
<div class="lab">Importance</div><p>Les infections urinaires et les septicémies ont des rapports de mortalité élevés dans la cohorte suisse.</p>
<div class="lab">Limite</div><p>Le fondement détaillé de chaque recommandation n’est pas reproduit dans le dossier ; aucune dose d’antibiotique n’est donnée.</p>
<p class="src">Références : {{S18|EAU 2026}} ; {{S7|mortalité traumatique suisse}}.</p></template>
<template data-pop="g82-sexualite" data-title="Sexualité et fertilité après lésion médullaire">
<div class="lab">Dysfonction érectile</div><p>Les inhibiteurs de la phosphodiestérase de type 5 sont le traitement de première ligne, les injections intracaverneuses la deuxième ligne.</p>
<div class="lab">Fertilité</div><p>La vibrostimulation et l’électro-éjaculation permettent le recueil de sperme. Les hommes dont la lésion se situe au 6e segment thoracique ou au-dessus et les centres de fertilité sont informés du risque de dysréflexie. Chez la femme, une approche multidisciplinaire est recommandée.</p>
<div class="lab">Limite</div><p>Les informations professionnelles suisses de ces médicaments n’ont pas été relues ; aucune dose n’est donnée.</p>
<p class="src">Références : {{S18|EAU 2026}}.</p></template>
<template data-pop="g82-sevrage" data-title="Sevrage de baclofène intrathécal">
<div class="lab">Causes</div><p>Panne de pompe ou déconnexion du cathéter.</p>
<div class="lab">Séquence</div><p>Spasticité accrue, prurit, paresthésies, hypotension ; puis hyperthermie, tachycardie, rigidité, convulsions, rhabdomyolyse, défaillance multiviscérale ; décès possible.</p>
<div class="lab">Conduite</div><p>Le baclofène oral ou entéral, ou des benzodiazépines, peuvent prévenir des complications mortelles, sans garantie.</p>
<div class="lab">Limite</div><p>L’information professionnelle ne chiffre pas le délai d’apparition dans le passage lu ; les doses de relais ne sont pas reprises.</p>
<p class="src">Références : information professionnelle suisse {{S26|Liorésal intrathécal®, mise à jour d’avril 2024}}.</p></template>
<template data-pop="g82-suivi-urinaire" data-title="Suivi du haut appareil urinaire">
<div class="lab">Rythme</div><p>Chez les patients à haut risque, échographie environ tous les 6 mois ; examen clinique et analyses d’urine chaque année ; urodynamique de référence puis répétée ; intervalle de contrôle en général de 1 à 2 ans, plus court si le risque est élevé ; programme individualisé.</p>
<div class="lab">Règle</div><p>Tout changement clinique impose des examens spécialisés.</p>
<div class="lab">Limite</div><p>Le dossier ne définit pas précisément le « haut risque » ; cette définition relève de l’évaluation urodynamique.</p>
<p class="src">Références : {{S18|EAU 2026}}.</p></template>
<template data-pop="g82-calendrier" data-title="Calendrier mictionnel, débit et résidu">
<div class="lab">Contenu</div><p>Un calendrier mictionnel sur 2 à 3 jours. Chez les patients qui urinent, la débitmétrie et le résidu échographique sont répétés 2 à 3 fois.</p>
<div class="lab">Intérêt</div><p>La répétition réduit la variabilité d’une mesure isolée (lecture du cours).</p>
<div class="lab">Limite</div><p>Le dossier ne donne pas de valeurs de référence du résidu.</p>
<p class="src">Références : {{S18|EAU 2026}}.</p></template>
<template data-pop="g82-urodynamique" data-title="Urodynamique invasive et vidéo-urodynamique">
<div class="lab">Statut</div><p>L’urodynamique invasive est obligatoire pour typer la dysfonction vésicale, de préférence en vidéo-urodynamique, avec un remplissage physiologique au sérum tiède.</p>
<div class="lab">Sécurité</div><p>Surveiller la pression artérielle et la fréquence cardiaque pendant les gestes invasifs si le risque de dysréflexie existe : l’examen a lui-même déclenché des épisodes chez 43,3 % des patients lésés au 6e segment thoracique ou au-dessus dans une étude.</p>
<div class="lab">Limite</div><p>Le dossier ne détaille ni les paramètres mesurés ni les seuils de pression.</p>
<p class="src">Références : {{S18|EAU 2026}} ; {{S19|Kirshblum et collaborateurs, 2021}}.</p></template>
<template data-pop="g82-cystatine" data-title="Fonction rénale : cystatine C et créatinine">
<div class="lab">Recommandation</div><p>Chez la personne peu musclée, le débit de filtration glomérulaire fondé sur la cystatine C semble plus exact que celui fondé sur la créatinine.</p>
<div class="lab">Limite</div><p>Le dossier ne chiffre pas l’écart ni n’explique le mécanisme ; la formule à utiliser n’est pas rapportée.</p>
<p class="src">Références : {{S18|EAU 2026}}.</p></template>
<template data-pop="g82-lioresal" data-title="Liorésal® (baclofène oral) : information professionnelle suisse">
<div class="lab">Indication</div><p>Spasticité, y compris d’origine médullaire (infectieuse, dégénérative, traumatique, néoplasique).</p>
<div class="lab">Posologie de l’adulte</div><p>Début à 5 mg trois fois par jour, augmentation de 5 mg par prise tous les trois jours ; dose habituelle de 30 à 80 mg par jour ; 100 à 120 mg par jour sous surveillance hospitalière.</p>
<div class="lab">Précautions</div><p>Arrêt progressif sur environ trois semaines (confusion, hallucinations, convulsions, hyperthermie, rebond). Réévaluer si aucun effet six à huit semaines après la dose maximale. Insuffisance rénale : débuter vers 5 mg par jour (risque d’encéphalopathie toxique). Prudence en cas d’hypertonie sphinctérienne (rétention aiguë).</p>
<div class="lab">Limite</div><p>Les interactions et les contre-indications complètes n’ont pas été reprises. Version : mise à jour de janvier 2025.</p>
<p class="src">Références : information professionnelle suisse {{S25|Liorésal®, Swissmedic via AIPS}}, consultée le 15 octobre 2026.</p></template>
<template data-pop="g82-lioresal-it" data-title="Liorésal intrathécal® : information professionnelle suisse">
<div class="lab">Indication</div><p>Spasticité chronique grave d’origine médullaire ou cérébrale, ne répondant pas aux antispastiques oraux ou mal tolérés par ceux-ci.</p>
<div class="lab">Risques</div><p>Granulome au bout du cathéter ; sevrage en cas d’interruption.</p>
<div class="lab">Limite</div><p>La posologie intrathécale n’est pas reprise dans ce cours. Version : mise à jour d’avril 2024.</p>
<p class="src">Références : information professionnelle suisse {{S26|Liorésal intrathécal®}}, consultée le 15 octobre 2026.</p></template>
<template data-pop="g82-oxybutynine" data-title="Oxybutynin Macure : information professionnelle suisse">
<div class="lab">Indication</div><p>Hyperactivité vésicale neurogène (hyperactivité du détrusor).</p>
<div class="lab">Posologie de l’adulte</div><p>2,5 mg trois fois par jour au départ ; 10 à 15 mg par jour ; maximum 20 mg par jour.</p>
<div class="lab">Contre-indications</div><p>Glaucome à angle étroit, myasthénie, obstruction ou atonie digestive.</p>
<div class="lab">Limite</div><p>Version : mise à jour d’août 2025 ; les effets indésirables et les interactions ne sont pas repris.</p>
<p class="src">Références : information professionnelle suisse {{S27|Oxybutynin Macure, comprimés}}, consultée le 15 octobre 2026.</p></template>
<template data-pop="g82-antimuscariniques" data-title="Classes médicamenteuses de la vessie neurogène">
<div class="lab">Tableau</div><table class="t"><thead><tr><th>Situation</th><th>Recommandation</th></tr></thead><tbody><tr><td>Hyperactivité neurogène du détrusor</td><td>Antimuscariniques ou bêta-3 ; ne pas compter sur les bêta-3 pour réduire l’hyperactivité urodynamique</td></tr><tr><td>Résistance de sortie élevée</td><td>Alpha-bloquants</td></tr><tr><td>Détrusor hypoactif</td><td>Pas de parasympathomimétiques</td></tr><tr><td>Intolérance orale</td><td>Oxybutynine intravésicale</td></tr><tr><td>Antimuscarinique inefficace</td><td>Toxine botulique A intradétrusorienne</td></tr><tr><td>Desmopressine</td><td>Contrôle de la natrémie</td></tr></tbody></table>
<div class="lab">Limite</div><p>Aucune dose ni information professionnelle suisse, hors oxybutynine orale, n’a été lue.</p>
<p class="src">Références : {{S18|EAU 2026}}.</p></template>
<template data-pop="g82-calcul-baclofene" data-title="Montée de dose du baclofène : calcul">
<h3>Calcul</h3><p>Début : 5 mg × 3 = 15 mg par jour. Après trois jours, 10 mg × 3 = 30 mg par jour, soit la limite basse de la dose habituelle. Ensuite 15 mg × 3 = 45 mg (jour 7), 20 mg × 3 = 60 mg (jour 10), 25 mg × 3 = 75 mg (jour 13).</p>
<h3>Lecture</h3><p>La montée par paliers de trois jours laisse le temps d’observer l’effet et la tolérance avant d’augmenter. Elle sert d’illustration du schéma de l’information professionnelle, non de prescription.</p>
<h3>Limite</h3><p>Calcul pédagogique : la dose réelle dépend de l’effet, de la fonction rénale et de la tolérance du patient.</p></template>
<template data-pop="pareto-g82-definition" data-title="Pareto — Définition et codage">
<p class="ratio" data-cover="g82-1"></p><ul><li>G82 : para- ou tétra-parésie ou -plégie, flasque (0, 3) ou spastique (1, 4) ; sans précision (2, 5).</li><li>Cinquième caractère : 0 à 3 et 9 (aigu ou chronique, complet ou incomplet) ; niveau fonctionnel G82.6-!.</li><li>Phase aiguë traumatique : S14, S24, S34 ; queue de cheval : G83.4 ; paralysie cérébrale infantile : G80.</li></ul></template>
<template data-pop="pareto-g82-isncsci" data-title="Pareto — Classification ISNCSCI">
<p class="ratio" data-cover="g82-2"></p><ul><li>Trois résultats : niveau, complétude, grade AIS.</li><li>Dix muscles clés cotés 0 à 5 ; 28 points sensitifs cotés 0 à 2 ; toucher rectal obligatoire.</li><li>AIS A : rien aux segments sacrés 4 et 5 ; B : sensitif ; C et D : moteur selon la moitié des muscles à 3 ou plus ; E : normal après déficit.</li></ul></template>
<template data-pop="pareto-g82-epidemio" data-title="Pareto — Fréquence">
<p class="ratio" data-cover="g82-3"></p><ul><li>Incidence suisse 19,9 à 49,7 par million et par an, avec sous-couverture des centres spécialisés.</li><li>Âge médian 51 à 53,5 ans ; majorité d’hommes ; environ 54 à 60 % de paraplégies.</li><li>Cause non traumatique fréquente : myélopathie cervicale dégénérative, diagnostiquée tard.</li></ul></template>
<template data-pop="pareto-g82-pronostic" data-title="Pareto — Pronostic et morbidité">
<p class="ratio" data-cover="g82-4"></p><ul><li>Mortalité 2,32 fois (traumatique) et 1,6 fois (non traumatique) celle de la population.</li><li>Un tiers à haut risque cardiométabolique à la sortie de réadaptation.</li><li>Perdus de vue : risque de décès multiplié par 3,62 (association).</li></ul></template>
<template data-pop="pareto-g82-meca" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="g82-5"></p><ul><li>Lésion primaire mécanique, puis secondaire ischémique et accessible au traitement.</li><li>Vessie hyperactive et dyssynergique si lésion suprasacrée ; hypoactive si sacrée ou plus bas.</li><li>Dysréflexie : hausse systolique de plus de 20 mmHg, lésion au 6e segment thoracique ou au-dessus.</li></ul></template>
<template data-pop="pareto-g82-demarche" data-title="Pareto — Anamnèse, examen et démarche">
<p class="ratio" data-cover="g82-7,g82-8"></p><ul><li>Anamnèse : vessie, intestin, spasticité, dysréflexie, mobilité, main.</li><li>Examen standardisé avec toucher rectal ; pression de base à connaître.</li><li>Différentiel : plexus et nerfs exclus ; moelle, cône, queue de cheval ; différentiel non traumatique non documenté.</li></ul></template>
<template data-pop="pareto-g82-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g82-9"></p><ul><li>Décompression dans les 24 heures ; pression artérielle moyenne 75–80 à 90–95 mmHg pendant 3 à 7 jours.</li><li>Méthylprednisolone seulement avant 8 heures ; thromboprophylaxie dans les 72 heures.</li><li>Dysréflexie : supprimer le déclencheur, protocole du centre ; sevrage de baclofène intrathécal : urgence vitale.</li></ul></template>
<template data-pop="pareto-g82-prise" data-title="Pareto — Réadaptation et vessie">
<p class="ratio" data-cover="g82-10"></p><ul><li>Priorités : haut appareil, continence, fonction, qualité de vie.</li><li>Éviter Credé et poussée ; antimuscariniques, alpha-bloquants, auto-sondage, toxine botulique.</li><li>Infections : pas de bandelette ni de traitement de la bactériurie asymptomatique.</li></ul></template>
<template data-pop="pareto-g82-suivi" data-title="Pareto — Suivi et prévention">
<p class="ratio" data-cover="g82-11"></p><ul><li>Échographie environ tous les 6 mois si haut risque ; analyses d’urine annuelles ; urodynamique répétée.</li><li>Dépister le risque cardiométabolique et les troubles du sommeil ; garder le lien avec le centre.</li><li>Escarres, intestin, douleur : non documentés.</li></ul></template>
<template data-pop="pareto-g82-particulier" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="g82-12"></p><ul><li>Homme âgé : cancer de vessie multiplié par 16 à 28.</li><li>Enfant : dysraphisme, prise en charge multidisciplinaire, urodynamique centrale.</li><li>Lésion non traumatique : profil cardiométabolique plus lourd.</li></ul></template>
<template data-pop="pareto-g82-examen" data-title="Pareto — Examen standardisé">
<p class="ratio" data-cover="g82-e-2"></p><ul><li>Score moteur : 5 points par muscle, 50 par membre supérieur et inférieur.</li><li>Niveau neurologique : le plus rostral des quatre niveaux.</li><li>Épargne sacrée aux segments sacrés 4 et 5 : trancher complet ou incomplet.</li></ul></template>
<template data-pop="pareto-g82-cas" data-title="Pareto — Cas corrigés">
<p class="ratio" data-cover="g82-e-5"></p><ul><li>Tact sacré conservé sans motricité : AIS B.</li><li>Hausse de 20 mmHg ou moins : définition de la dysréflexie non remplie.</li><li>Chronique, spastique, complet : G82.12 et niveau fonctionnel.</li></ul></template>
<template data-pop="pareto-g82-anat" data-title="Pareto — Neuroanatomie classificatoire">
<p class="ratio" data-cover="g82-s-anat-cours"></p><ul><li>Cervical : tétraplégie ; thoracique, lombaire, sacré : paraplégie.</li><li>Dix muscles clés du 5e cervical au 1er sacré.</li><li>Racines : flasque ; moelle : souvent spastique.</li></ul></template>
<template data-pop="pareto-g82-physio" data-title="Pareto — Physiologie autonome">
<p class="ratio" data-cover="g82-s-physio-cours"></p><ul><li>Perfusion de la moelle lésée : objectif de pression artérielle.</li><li>Choc neurogène : perte du tonus sympathique.</li><li>Dysréflexie : stimulus sous la lésion ; prévention par la vessie.</li></ul></template>
<template data-pop="pareto-g82-vesicale" data-title="Pareto — Physiologie vésicale">
<p class="ratio" data-cover="g82-s-vesicale-cours"></p><ul><li>Suprasacrée : détrusor hyperactif et dyssynergie ; sacrée : hypoactivité.</li><li>Danger : haut appareil urinaire.</li><li>Urodynamique obligatoire.</li></ul></template>
<template data-pop="pareto-g82-baclofene" data-title="Pareto — Baclofène oral">
<p class="ratio" data-cover="g82-p-2"></p><ul><li>5 mg trois fois par jour, +5 mg par prise tous les trois jours ; 30 à 80 mg par jour.</li><li>Arrêt sur environ trois semaines.</li><li>Rénal : début à 5 mg par jour ; prudence en cas d’hypertonie sphinctérienne.</li></ul></template>
<template data-pop="pareto-g82-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g82-p-4"></p><ul><li>Oxybutynine : 2,5 mg trois fois par jour, maximum 20 mg par jour.</li><li>Contre-indications : glaucome à angle étroit, myasthénie, obstruction ou atonie digestive.</li><li>Interactions et traitement de la dysréflexie : non documentés.</li></ul></template>
