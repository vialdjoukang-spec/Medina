<template data-pop="r47-cim" data-title="Périmètre CIM-10-GM : R47 à R49">
<div class="lab">Définition</div><p>Dans la CIM-10-GM 2024, le bloc R47–R49 s’intitule « Symptômes relatifs au langage et à la voix ». R47 regroupe les troubles du langage non classés ailleurs : R47.0 dysphasie et aphasie, R47.1 dysarthrie et anarthrie, R47.8 troubles du langage autres et non précisés. R48 regroupe la dyslexie et l’alexie (R48.0), l’agnosie (R48.1), l’apraxie (R48.2) et d’autres troubles de la fonction symbolique (R48.8, qui inclut l’agraphie et l’acalculie). R49 regroupe les troubles de la voix : dysphonie et enrouement (R49.0), aphonie (R49.1), hyper- et hyponasalité (R49.2).</p>
<div class="lab">Exclusions</div><p>R47 exclut l’autisme (F84.0–F84.1), le bredouillement (F98.6), le bégaiement (F98.5) et les troubles spécifiques du développement de la parole et du langage (F80.-). R47.0 exclut l’aphasie progressive isolée (G31.0). R49 exclut le trouble psychogène de la voix (F44.4).</p>
<div class="lab">Application</div><p>Un code R décrit un symptôme. Lorsque la cause est établie, la catégorie de la maladie s’applique : par exemple l’infarctus cérébral ou l’aphasie primaire progressive. Le cours range l’apraxie de la parole sous R47.8, par choix pédagogique ; R48.2 désigne l’apraxie en général.</p>
<div class="lab">Limite</div><p>Les libellés français proviennent du registre du dépôt, établi à partir de la classification de l’Office fédéral de la statistique, et non du fichier brut de l’Office. Les exclusions proviennent de la version allemande de l’institut BfArM (état du 15 septembre 2023). Le rattachement à PROFILES (situations de départ 19 et 99) est pédagogique et non une table officielle de correspondance. La cartographie vers la CIM-11 reste à établir.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r47-r49.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc R47–R49</a> ; classification française de l’Office fédéral de la statistique, 2024.</p></template>
<template data-pop="r47-aphasie-def" data-title="Trois définitions de l’aphasie">
<div class="lab">Définition clinique</div><p>L’aphasie est un trouble acquis du langage dû à une atteinte du système nerveux central. Elle touche la compréhension, l’expression, la lecture et l’écriture, à tous les niveaux de traitement : syntaxe, lexique, sémantique, phonologie (revue de formation continue suisse, 2013).</p>
<div class="lab">Définition neurologique</div><p>L’aphasie est la perte ou l’altération de la communication verbale par dysfonction cérébrale : expression, compréhension orale ou écrite, répétition, dénomination, lecture, écriture (revue croate, 2011).</p>
<div class="lab">Définition anatomique</div><p>L’aphasie est un trouble de la compréhension ou de la production des mots dû à une dysfonction des aires du langage du cortex, des noyaux gris centraux ou des faisceaux de substance blanche qui les relient (manuel MSD, 2025).</p>
<div class="lab">Termes voisins</div><p>La dysphasie développementale est un trouble du développement, codé F80.-, distinct de l’aphasie acquise. L’alexie, l’agraphie et l’acalculie sont des pertes acquises de la lecture, de l’écriture et du calcul ; elles se distinguent de la dyslexie développementale et de l’illettrisme (codes R48).</p>
<div class="lab">Limite</div><p>La revue croate n’a été lue que par son résumé. Le manuel MSD est une source nord-américaine, utilisée pour la sémiologie et l’anatomie, jamais pour fonder une conduite.</p>
<p class="src">Références : <a href="https://rosenfluh.ch/psychiatrie-neurologie-2013-05/sprachstoerungen-nach-schlaganfall" target="_blank" rel="noopener">Leisi, 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22034787/" target="_blank" rel="noopener">Sinanović et al., Acta Clin Croat 2011</a> ; <a href="https://www.msdmanuals.com/fr/professional/neurologie/fonction-et-dysfonctionnement-des-lobes-cérébraux/aphasie" target="_blank" rel="noopener">Manuel MSD, Aphasie, révision septembre 2025</a>.</p></template>
<template data-pop="r47-dysarthrie-def" data-title="Dysarthrie : définition et chaîne motrice de la parole">
<div class="lab">Définition</div><p>La dysarthrie est un trouble moteur de la parole, classé selon la neuropathologie. Elle atteint la respiration, la fonction laryngée, la direction du flux d’air et l’articulation, d’où une parole dont la qualité et l’intelligibilité sont altérées.</p>
<div class="lab">Conséquence clinique</div><p>Le langage n’est pas atteint : la compréhension, la lecture et l’écriture restent intactes. C’est le critère qui sépare la dysarthrie de l’aphasie au lit du patient.</p>
<div class="lab">Limite</div><p>La source n’a été lue que par son résumé. La ligne directrice allemande sur les dysarthries (AWMF 030/103) n’a pas pu être lue : le serveur renvoyait une erreur et la page de la société savante était vide.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/B978-0-444-52901-5.00022-8" target="_blank" rel="noopener">Enderby, Handbook of Clinical Neurology 2013;110:273–81</a>.</p></template>
<template data-pop="r47-apraxie" data-title="Apraxie de la parole">
<div class="lab">Ce que disent les sources</div><p>L’apraxie de la parole (en allemand <i>Sprechapraxie</i>) est un symptôme rare selon la commission des lignes directrices de la société allemande de neurologie. Elle constitue un signe d’appui de la variante non fluente et agrammatique de l’aphasie primaire progressive. Dans l’aphasie de Broca, elle fait partie des symptômes directeurs.</p>
<div class="lab">Limite</div><p>La définition formelle de l’apraxie de la parole n’a pas pu être lue, car la ligne directrice allemande était inaccessible. Le cours ne donne donc pas de critère diagnostique propre. La source utilisée est un article de formation de logopédistes de 2021 qui rapporte l’état des lignes directrices allemandes ; elle renvoie aussi à des lignes directrices américaines, non utilisées ici.</p>
<p class="src">Références : <a href="https://www.dbl-ev.de/wp-content/uploads/2025/03/21_05_38-43_Aichert_Update_Sprechapraxietherapie.pdf" target="_blank" rel="noopener">Aichert, forum:logopädie 2021;35(5):38–43</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3059138/" target="_blank" rel="noopener">Gorno-Tempini et al., Neurology 2011</a>.</p></template>
<template data-pop="r47-phases" data-title="Phases de l’aphasie vasculaire">
<div class="lab">Trois phases</div><table class="t"><thead><tr><th>Phase</th><th>Période</th></tr></thead><tbody><tr><td>Aiguë</td><td>4 à 6 premières semaines (distincte de la phase médicale aiguë de l’accident vasculaire cérébral)</td></tr><tr><td>Post-aiguë</td><td>Dès environ 4 semaines</td></tr><tr><td>Chronique</td><td>Dès environ 1 an</td></tr></tbody></table>
<div class="lab">Application</div><p>La phase conditionne la thérapie : stimulation générale dans les deux premières semaines, exercices spécifiques dès la troisième, et intensité adaptée ensuite.</p>
<p class="src">Références : <a href="https://rosenfluh.ch/psychiatrie-neurologie-2013-05/sprachstoerungen-nach-schlaganfall" target="_blank" rel="noopener">Leisi, 2013</a>.</p></template>
<template data-pop="r47-syndromes" data-title="Syndromes aphasiques : lecture du tableau">
<div class="lab">Principe</div><p>Quatre critères au lit définissent le syndrome : fluence, compréhension, répétition, dénomination. Le siège de la lésion est donné à titre habituel, dans l’hémisphère gauche.</p>
<div class="lab">Lecture rapide</div><ul><li>Fluente avec bonne compréhension : syndromes anomique et de conduction. La répétition les sépare : normale dans l’anomique, altérée dans la conduction.</li><li>Fluente avec mauvaise compréhension : syndromes de Wernicke (répétition altérée) et transcortical sensoriel (répétition normale).</li><li>Non fluente avec compréhension relativement bonne : syndromes de Broca (répétition altérée) et transcortical moteur (répétition normale).</li><li>Non fluente avec mauvaise compréhension : syndrome global.</li></ul>
<div class="lab">Limites</div><p>Aucune classification n’est parfaite. Les tableaux aigus changent vite et la classification n’est fiable qu’après environ quatre semaines. Le tableau d’origine de la revue suisse a été restitué partiellement par l’outil de lecture ; les caractéristiques proviennent donc du manuel MSD, source nord-américaine utilisée ici pour la sémiologie seulement.</p>
<p class="src">Références : <a href="https://www.msdmanuals.com/fr/professional/neurologie/fonction-et-dysfonctionnement-des-lobes-cérébraux/aphasie" target="_blank" rel="noopener">Manuel MSD, Aphasie, 2025</a> ; <a href="https://rosenfluh.ch/psychiatrie-neurologie-2013-05/sprachstoerungen-nach-schlaganfall" target="_blank" rel="noopener">Leisi, 2013</a>.</p></template>
<template data-pop="r47-huber" data-title="Symptômes directeurs des syndromes standard">
<div class="lab">Définition</div><p>Un symptôme directeur est le signe qui, dans la classification de Huber, caractérise le syndrome standard.</p>
<table class="t"><thead><tr><th>Syndrome</th><th>Symptômes directeurs</th></tr></thead><tbody><tr><td>Global</td><td>Automatismes verbaux (énoncés qui reviennent à l’identique)</td></tr><tr><td>Broca</td><td>Agrammatisme, apraxie de la parole, débit ralenti avec effort</td></tr><tr><td>Wernicke</td><td>Paragrammatisme, paraphasies, jargon, débit précipité</td></tr><tr><td>Amnésique</td><td>Manque du mot</td></tr></tbody></table>
<div class="lab">Application</div><p>Le débit précipité et le jargon de l’aphasie de Wernicke expliquent la confusion fréquente avec un délire.</p>
<p class="src">Références : <a href="https://rosenfluh.ch/psychiatrie-neurologie-2013-05/sprachstoerungen-nach-schlaganfall" target="_blank" rel="noopener">Leisi, 2013</a>.</p></template>
<template data-pop="r47-app" data-title="Aphasie primaire progressive : critères de consensus">
<div class="lab">Critères généraux</div><p>L’aphasie primaire progressive se caractérise par un déficit langagier prédominant et isolé au début, les activités quotidiennes étant préservées en dehors du langage. Elle est exclue en cas de troubles mnésiques épisodiques ou visuospatiaux précoces, de cause lésionnelle à l’imagerie (accident vasculaire cérébral, tumeur), de syndrome parkinsonien net ou de trouble comportemental au premier plan.</p>
<table class="t"><thead><tr><th>Variante</th><th>Critères centraux</th><th>Signes d’appui</th><th>Imagerie</th></tr></thead><tbody>
<tr><td>Non fluente et agrammatique</td><td>Au moins un : agrammatisme ; parole lente et laborieuse</td><td>Au moins deux : compréhension syntaxique complexe altérée, compréhension des mots isolés préservée, apraxie de la parole…</td><td>Fronto-insulaire postérieure gauche</td></tr>
<tr><td>Sémantique</td><td>Deux : anomie sévère ; trouble de la compréhension des mots isolés</td><td>Au moins trois</td><td>Temporale antérieure</td></tr>
<tr><td>Logopénique</td><td>Deux : manque du mot ; répétition de phrases altérée</td><td>Au moins trois</td><td>Jonction temporo-pariétale gauche</td></tr></tbody></table>
<div class="lab">Limite</div><p>Ces critères sont diagnostiques, non thérapeutiques. Le consensus est international, avec des auteurs majoritairement nord-américains. Les tableaux de signes d’appui sont des images non lues : la liste des signes d’appui est donc partielle. L’association des régions d’imagerie aux variantes suit l’ordre des variantes dans le texte.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3059138/" target="_blank" rel="noopener">Gorno-Tempini et al., Neurology 2011;76:1006–14</a>.</p></template>
<template data-pop="r47-alzheimer" data-title="Aphasies de la maladie d’Alzheimer">
<div class="lab">Fait</div><p>La pathologie d’Alzheimer explique environ 30 % des aphasies dégénératives primaires. La maladie peut avoir une présentation langagière, primaire ou secondaire selon le variant.</p>
<div class="lab">Limite</div><p>La source n’a été lue que par son résumé. Le cours n’en tire aucune conduite thérapeutique.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.neurol.2013.06.001" target="_blank" rel="noopener">Teichmann, Ferrieux, Rev Neurol 2013;169:680–6</a>.</p></template>
<template data-pop="r47-dysarthries" data-title="Six types de dysarthrie">
<div class="lab">Principe</div><p>La dysarthrie se classe selon la neuropathologie. Chaque type a des traits distinctifs qui aident au diagnostic topographique.</p>
<table class="t"><thead><tr><th>Type</th><th>Structure atteinte</th></tr></thead><tbody><tr><td>Flasque</td><td>Motoneurone périphérique</td></tr><tr><td>Spastique</td><td>Motoneurone central (voies issues du cortex moteur)</td></tr><tr><td>Ataxique</td><td>Cervelet</td></tr><tr><td>Hypokinétique</td><td>Système extrapyramidal</td></tr><tr><td>Hyperkinétique</td><td>Système extrapyramidal</td></tr><tr><td>Mixte</td><td>Au moins deux systèmes, traits d’au moins deux groupes</td></tr></tbody></table>
<div class="lab">Limite</div><p>Le résumé lu n’énumère pas les traits sonores de chaque type ; le cours ne les décrit pas.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/B978-0-444-52901-5.00022-8" target="_blank" rel="noopener">Enderby, 2013</a>.</p></template>
<template data-pop="r47-art" data-title="Aphasia Rapid Test et Aphasia Handicap Score">
<div class="lab">Aphasia Rapid Test</div><p>Échelle de 26 points, réalisable en moins de 3 minutes au lit, dont le nom la rapproche de l’échelle d’accident vasculaire cérébral NIHSS. Au huitième jour, un score inférieur à 12 annonce un bon pronostic et un score supérieur à 21 un mauvais pronostic, avec une sensibilité supérieure à 90 % et une spécificité supérieure à 80 %.</p>
<div class="lab">Aphasia Handicap Score</div><p>Échelle de 0 à 5, de type Rankin, qui mesure le handicap dû à l’aphasie. Elle est utilisée à trois mois.</p>
<div class="lab">Limite</div><p>Les deux études (91 et 70 patients, Pitié-Salpêtrière) n’ont été lues que par leur résumé. Les seuils s’appliquent à l’aphasie après accident vasculaire cérébral.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3734736/" target="_blank" rel="noopener">Azuar et al., J Neurol 2013;260:2110–7</a>.</p></template>
<template data-pop="r47-bale" data-title="Étude de population de Bâle-Ville">
<div class="lab">Méthode</div><p>Étude de population prospective d’un an, dans les 188 015 habitants de Bâle-Ville : 269 premiers infarctus cérébraux ont été recensés.</p>
<div class="lab">Résultats</div><p>L’aphasie touche 30 % des premiers infarctus (80 sur 269 ; intervalle de confiance à 95 % : 24–36 %). L’incidence est de 43 pour 100 000 habitants par an (intervalle de confiance à 95 % : 33–52). Le risque augmente de 4 % par année d’âge, et de 3 % après ajustement sur la fibrillation atriale. La cardio-embolie est plus fréquente chez les patients aphasiques (rapport de cotes 1,85 ; 1,07–3,20). Les patients aphasiques reçoivent plus souvent la thrombolyse (rapport de cotes 3,5 ; 1,12–10,96), même après ajustement sur le délai.</p>
<div class="lab">Limite</div><p>Le résumé seul a été lu. L’étude porte sur les infarctus uniquement (non les hémorragies) et sur une année de données de 2006 ; elle ne précise pas l’incidence de la dysarthrie.</p>
<p class="src">Références : <a href="https://doi.org/10.1161/01.STR.0000221815.64093.8c" target="_blank" rel="noopener">Engelter et al., Stroke 2006;37:1379–84</a>.</p></template>
<template data-pop="r47-calcul-bale" data-title="Calcul : 80 sur 269 et incidence">
<div class="lab">Proportion</div><p>80 ÷ 269 = 0,297, soit 29,7 %, arrondi à 30 % comme dans l’étude.</p>
<div class="lab">Incidence</div><p>43 pour 100 000 habitants par an, appliqués à 188 015 habitants : 43 × 188 015 ÷ 100 000 = 80,8 cas. Ce résultat correspond aux 80 cas observés, ce qui confirme que les deux chiffres décrivent la même série.</p>
<div class="lab">Interprétation</div><p>La concordance est approximative, car l’incidence de l’étude est une estimation avec un intervalle de confiance de 33 à 52 pour 100 000. Elle montre que l’incidence de l’aphasie provient du nombre de cas d’aphasie, non du nombre total d’infarctus.</p></template>
<template data-pop="r47-copenhague" data-title="Copenhagen Stroke Study">
<div class="lab">Série</div><p>881 accidents vasculaires cérébraux aigus consécutifs, population danoise, publiée en 1995.</p>
<div class="lab">Résultats</div><p>L’aphasie touche 38 % des patients à l’admission et 18 % à la sortie. Le langage est stable chez 95 % des patients en 2 semaines pour une aphasie légère, 6 semaines pour une aphasie modérée et 10 semaines pour une aphasie sévère. La gravité initiale est le seul prédicteur clinique pertinent ; le sexe, la latéralité manuelle et le côté de la lésion ne sont pas des prédicteurs indépendants et l’âge a peu d’influence.</p>
<div class="lab">Limite</div><p>Le résumé seul a été lu. Les données sont anciennes et l’échelle d’évaluation est scandinave.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/ana.410380416" target="_blank" rel="noopener">Pedersen et al., Ann Neurol 1995;38:659–66</a>.</p></template>
<template data-pop="r47-lateralisation" data-title="Latéralisation et aires du langage">
<div class="lab">Fait</div><p>Chez le droitier et chez environ deux tiers des gauchers, le langage est surtout dans l’hémisphère gauche. Le réseau du langage est à gauche chez plus de 90 % des personnes.</p>
<div class="lab">Aires</div><p>Aire de Wernicke (partie postéro-supérieure du lobe temporal), lobule pariétal inférieur adjacent, aire de Broca (partie postéro-inférieure du lobe frontal en avant du cortex moteur), connexions sous-corticales et région périsylvienne avec l’insula, dans le territoire de l’artère cérébrale moyenne. Les noyaux gris centraux et le thalamus participent probablement.</p>
<div class="lab">Prosodie</div><p>La prosodie dépend des deux hémisphères ; une lésion de l’hémisphère non dominant seul peut l’altérer.</p>
<p class="src">Références : <a href="https://www.msdmanuals.com/fr/professional/neurologie/fonction-et-dysfonctionnement-des-lobes-cérébraux/aphasie" target="_blank" rel="noopener">Manuel MSD, Aphasie, 2025</a> ; <a href="https://rosenfluh.ch/psychiatrie-neurologie-2013-05/sprachstoerungen-nach-schlaganfall" target="_blank" rel="noopener">Leisi, 2013</a>.</p></template>
<template data-pop="r47-dysarthrie-topo" data-title="Dysarthrie vasculaire : topographie et étiologie">
<div class="lab">Série</div><p>68 patients présentant un infarctus unique avec dysarthrie aiguë, dans une série hospitalière de Mayence.</p>
<div class="lab">Topographie</div><p>Toutes les lésions extracérébelleuses responsables siégeaient sur le trajet du faisceau pyramidal : cortex moteur inférieur 5,9 %, centre semi-ovale 23,5 %, capsule interne 8,8 %, pédoncule cérébral 1,5 %, base du pont 30,9 %, jonction pontomédullaire 1,5 % (soit 72,1 % au total). Les infarctus cérébelleux isolés responsables sont décrits à part : ils siégeaient dans le territoire de l’artère cérébelleuse supérieure, région paravermienne rostrale ; leur proportion n’est pas rapportée dans le résumé lu.</p>
<div class="lab">Étiologie</div><p>Maladie des petits vaisseaux 52,9 %, cardio-embolie 11,8 %, maladie des gros vaisseaux 4,4 % (soit 69,1 % au total) ; le résumé ne détaille pas le reste.</p>
<div class="lab">Syndromes</div><p>Syndrome lacunaire classique 52,9 % ; dysarthrie isolée 2,9 % ; dysarthrie avec parésie faciale et linguale centrale 10,3 % ; dysarthrie avec main malhabile 11,7 %. Les signes pyramidaux accompagnent la dysarthrie dans 90,7 % des cas.</p>
<div class="lab">Limite</div><p>Le résumé seul a été lu. La série est petite et hospitalière, et ne se généralise pas à toute dysarthrie.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/wnl.56.8.1021" target="_blank" rel="noopener">Urban et al., Neurology 2001;56:1021–7</a>.</p></template>
<template data-pop="r47-recuperation" data-title="Récupération de l’aphasie : courbe et prédicteurs">
<div class="lab">Courbe</div><p>Langage stable chez 95 % des patients en 2 semaines (aphasie légère), 6 semaines (modérée) et 10 semaines (sévère) ; pronostic valide en 1 à 4 semaines (Copenhague). Récupération complète à 6 mois : environ 56 % des formes légères et environ 12 % des formes sévères (revue suisse). Récupération spontanée surtout dans les 3 premiers mois, plus précoce et plus intense dans les 2 premières semaines dans l’ischémie, plus lente dans l’hémorragie (4e à 8e semaine) ; amélioration possible jusqu’à 1 an.</p>
<div class="lab">Prédicteurs</div><p>La gravité initiale et la taille de la lésion (ou l’étendue de l’hypoperfusion) sont les plus forts prédicteurs négatifs. Chez les patients dont l’aphasie est initialement sévère, un infarctus d’au moins 50 mL ou une atteinte d’au moins 20 % de la jonction temporo-pariétale gauche annonce un mauvais pronostic à trois mois (89 % de patients bien classés).</p>
<div class="lab">Limite</div><p>Les séries de Copenhague (1995), de Benghanem (73 patients) et de Sinanović n’ont été lues que par leur résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/ana.410380416" target="_blank" rel="noopener">Pedersen et al., 1995</a> ; <a href="https://doi.org/10.1007/s00415-019-09259-3" target="_blank" rel="noopener">Benghanem et al., J Neurol 2019;266:1303–9</a> ; <a href="https://rosenfluh.ch/psychiatrie-neurologie-2013-05/sprachstoerungen-nach-schlaganfall" target="_blank" rel="noopener">Leisi, 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22034787/" target="_blank" rel="noopener">Sinanović et al., 2011</a>.</p></template>
