<template data-pop="g05-ganciclovir" data-title="Ganciclovir : monographie suisse">
<div class="lab">Posologie</div><p data-src="S17">5 mg/kg en 1 h toutes les 12 h pendant 14 à 21 jours chez l’adulte à fonction rénale normale ; adaptation rénale nécessaire.</p><div class="lab">Contre-indications et risques</div><p data-src="S17">Contre-indiqué si neutrophiles < 500/µL ou plaquettes < 25 000/µL. Neutropénie < 1000/mm³ chez 38 % des patients ; potentiellement tératogène et cancérogène.</p><div class="lab">Limite</div><p data-src="S17">L’encéphalite à CMV n’est pas nommée explicitement dans l’information professionnelle (« autres atteintes viscérales »). Dans la ligne directrice DGN : 5 mg/kg/12 h avec foscarnet en phase initiale.</p><p class="src">Références : <a href="https://amiko.oddb.org" data-reference-source="1" target="_blank" rel="noopener">Information professionnelle suisse Cymevene® (ganciclovir i.v.), mise à jour janvier 2026</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-foscarnet" data-title="Foscarnet">
<div class="lab">Posologie</div><p data-src="S4">HSV résistant (sida, transplanté) : 60 mg/kg en 1 h toutes les 8 h pendant 3 semaines. VZV en cas d’échec de l’aciclovir. CMV : 60 mg/kg/8 h ou 90 mg/kg/12 h en phase initiale avec ganciclovir.</p><div class="lab">Limite</div><p data-src="S4">L’information professionnelle suisse du foscarnet n’a pas été lue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-amoxicilline" data-title="Amoxicilline et ampicilline (Listeria)">
<div class="lab">Posologie</div><p data-src="S7,S18">Ampicilline 6 × 2 g/jour (ligne directrice 2023). Amoxicilline intraveineuse suisse : 2 g en perfusion courte, 3 à 6 fois/jour, maximum 12 g/jour.</p><div class="lab">Spectre et diffusion</div><p data-src="S18">Listeria monocytogenes figure dans le spectre ; la diffusion dans le LCR est faible sans inflammation méningée.</p><div class="lab">Limite</div><p data-src="S18">L’information professionnelle ne détaille pas la neurolistériose.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" data-reference-source="1" target="_blank" rel="noopener">German guidelines on community-acquired acute bacterial meningitis in adults (DGN S2k, version abrégée anglaise ; DOI 10.1186/s42466-023-00264-6), 2023</a> ; <a href="https://amiko.oddb.org" data-reference-source="1" target="_blank" rel="noopener">Information professionnelle suisse Amoxicillin OrPha (poudre i.v.), mise à jour février 2026, v1.0</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-penicilline" data-title="Pénicilline G et neurosyphilis">
<div class="lab">Posologie</div><p data-src="S10">Pénicilline G intraveineuse 4 × 6, 5 × 5 ou 3 × 10 MUI/jour, pendant 14 jours (au moins 10) ; alternative ceftriaxone 2 g/jour ; doxycycline 2 × 200 mg pendant 28 jours envisageable (exclue pendant la grossesse).</p><div class="lab">Limite</div><p data-src="S10">Les informations professionnelles suisses de la pénicilline G et de la ceftriaxone n’ont pas été lues pour cette leçon.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" data-reference-source="1" target="_blank" rel="noopener">German guidelines on the diagnosis and treatment of neurosyphilis (DGN S1 030/101, approuvée par la Société suisse de neurologie ; DOI 10.1186/s42466-020-00081-1), mai 2020, validité indiquée jusqu&#x27;au 30.04.2025</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-pyrimethamine" data-title="Pyriméthamine-sulfadiazine">
<div class="lab">Posologie</div><p data-src="S12">Pyriméthamine 200 mg le premier jour puis 75 mg/jour (≥ 60 kg) ou 50 mg/jour (< 60 kg) ; sulfadiazine 3000 mg 2 fois/jour (≥ 60 kg) ou 2000 mg 2 fois/jour ; acide folinique 10 à 15 mg/jour ; ou triméthoprime-sulfaméthoxazole 5/25 mg/kg 2 fois/jour. Durée : 6 semaines, puis prophylaxie secondaire.</p><div class="lab">Toxicité</div><p data-src="S12">Sulfadiazine : cristallurie, insuffisance rénale, lithiase. Pyriméthamine : myélotoxique. Dexaméthasone seulement en cas d’effet de masse, à arrêter dès que possible.</p><p class="src">Références : <a href="https://www.eacsociety.org/media/guidelines-12.0.pdf" data-reference-source="1" target="_blank" rel="noopener">EACS Guidelines version 12.0 — Toxoplasma gondii Encephalitis, v12.0, octobre 2023</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-brivudine" data-title="Brivudine : contre-indication absolue">
<div class="lab">Alerte</div><p data-src="S4">Contre-indiquée avec le 5-fluorouracile, la capécitabine, le tégafur et la flucytosine : la toxicité potentiellement mortelle peut survenir jusqu’à 4 semaines après.</p><div class="lab">Limite</div><p data-src="S4">L’information professionnelle suisse de la brivudine n’a pas été lue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-herxheimer" data-title="Réaction de Jarisch-Herxheimer">
<div class="lab">Données</div><p data-src="S10">Fréquence de 1 à 2 % ; 12 à 24 heures après le début du traitement de la neurosyphilis ; traitement symptomatique par AINS ; l’antibiotique n’est pas interrompu ; les corticoïdes de routine ne sont pas recommandés.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" data-reference-source="1" target="_blank" rel="noopener">German guidelines on the diagnosis and treatment of neurosyphilis (DGN S1 030/101, approuvée par la Société suisse de neurologie ; DOI 10.1186/s42466-020-00081-1), mai 2020, validité indiquée jusqu&#x27;au 30.04.2025</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-mnemo" data-title="Aide mnémotechnique">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Associer l’agent à son médicament par une phrase : « Herpès et zona : aciclovir ; CMV : ganciclovir ; Listeria : ampicilline ; syphilis : pénicilline ; toxoplasme : pyriméthamine ». Cette liste ne remplace pas la ligne directrice.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-lacunes" data-title="Sources non lues et limites">
<div class="lab">Lacunes</div><p>Aucune source suisse spécifique à l’encéphalite n’a été trouvée. La ligne directrice ESCMID 2016 (méningite bactérienne), les recommandations EAN/EFNS de l’encéphalite et de l’encéphalite à tiques, ainsi que le texte intégral IUSTI 2020 n’ont pas été lus directement. Aucune information professionnelle suisse lue pour le foscarnet, la brivudine, la pyriméthamine, la sulfadiazine, la pénicilline G et la ceftriaxone. Trypanosomiase, maladie de Chagas, Naegleria, méningo-encéphalite à éosinophiles et tuberculose : codage seulement. Rattachement de l’encéphalite à EBV non confirmé. Fréquence suisse de la panencéphalite sclérosante subaiguë non lue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="pareto-g05-definition" data-title="Pareto — Définition, codage et fréquence">
<p class="ratio" data-cover="g05-0,g05-1,g05-2"></p><ul><li data-src="S1">G05.-\* est un code de manifestation, toujours associé au code † de la maladie causale.</li><li data-src="S4">Critère majeur : trouble de la conscience, de la personnalité ou manifestation psychiatrique > 24 h sans autre cause.</li><li data-src="S5">Incidence 1,18/100 000 ; VZV 32 %, HSV-1 31 %, inconnue 24 %.</li></ul></template>
<template data-pop="pareto-g05-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g05-3,g05-4"></p><ul><li data-src="S4">Lésion directe et lésion immunitaire peuvent se succéder.</li><li data-src="S4">Après encéphalite herpétique, l’aggravation tardive évoque réactivation ou anti-NMDAR.</li><li data-src="S4">Les causes se classent par sous-code ; le contexte oriente l’agent.</li></ul></template>
<template data-pop="pareto-g05-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g05-5,g05-6"></p><ul><li data-src="S4">L’histoire biphasique oriente vers HSV, l’éruption vers VZV, la tique vers l’encéphalite à tiques.</li><li data-src="S4">Le méningisme et les signes focaux peuvent manquer.</li></ul></template>
<template data-pop="pareto-g05-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g05-7"></p><ul><li data-src="S4">Recherche virale par paliers : virus traitables d’abord.</li><li data-src="S7">Méningite bactérienne à exclure ; aciclovir et antibiotique se débutent sans attendre.</li></ul></template>
<template data-pop="pareto-g05-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g05-8"></p><ul><li data-src="S4">Aciclovir immédiat dès la suspicion, sans attendre la PCR.</li><li data-src="S7">Scanner avant ponction seulement si trouble sévère, déficit focal nouveau ou crise ; hémocultures avant antibiotique.</li></ul></template>
<template data-pop="pareto-g05-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g05-9"></p><ul><li data-src="S4">Un antimicrobien par agent : aciclovir, ganciclovir, ampicilline, pénicilline G, pyriméthamine-sulfadiazine.</li><li data-src="S16">Durée de l’aciclovir : 10 jours (suisse), au moins 14 (DGN) ; contentieux à nommer.</li></ul></template>
<template data-pop="pareto-g05-suivi" data-title="Pareto — Suivi et terrains">
<p class="ratio" data-cover="g05-10,g05-11"></p><ul><li data-src="S5">Mortalité 15 % à 6 mois ; immunodépression, HSV-1 et GCS < 12 sont associés au risque.</li><li data-src="S10">Neurosyphilis : LCR à 3–6 mois puis tous les 6 mois.</li><li data-src="S16">Adapter l’aciclovir chez le sujet âgé et l’insuffisant rénal.</li></ul></template>
<template data-pop="pareto-g05-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g05-e-1,g05-e-2,g05-e-3,g05-e-4,g05-e-5"></p><ul><li data-src="S4">IRM : examen de choix ; scanner souvent normal 4 jours ; PCR HSV sensible à 95–100 % au début.</li><li data-src="S4">LCR viral : lactate ≤ 4,0 mmol/L ; procalcitonine < 0,5 ng/mL ; indice d’anticorps tardif.</li><li data-src="S10">Neurosyphilis : sérologie sérique puis LCR.</li></ul></template>
<template data-pop="pareto-g05-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g05-s-anat-cours"></p><ul><li data-src="S4">Temporal médio-basal : HSV ; noyaux gris centraux : arbovirus ; tronc cérébral : Listeria (17 %).</li></ul></template>
<template data-pop="pareto-g05-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="g05-s-immuno-cours"></p><ul><li data-src="S4">Lésion directe ou immunitaire ; anti-NMDAR après HSV en semaines à mois.</li><li data-src="S13">Lupus : inflammation ou thrombose antiphospholipide.</li></ul></template>
<template data-pop="pareto-g05-liquide" data-title="Pareto — Liquide cérébro-spinal">
<p class="ratio" data-cover="g05-s-liquide-cours"></p><ul><li data-src="S4">Indice d’anticorps > 1,5 après plus de 10 jours ; PCR précoce.</li></ul></template>
<template data-pop="pareto-g05-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g05-p-1,g05-p-2,g05-p-3,g05-p-4,g05-p-5"></p><ul><li data-src="S16">Aciclovir : adapter l’intervalle à la clairance.</li><li data-src="S17">Ganciclovir : surveiller neutrophiles et plaquettes.</li><li data-src="S4">Brivudine contre-indiquée avec le 5-fluorouracile et apparentés.</li></ul></template>
