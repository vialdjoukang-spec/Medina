<template id="ch-I65"><div class="chap"><div class="chap-head"><div class="code">I 65 · Neurologie · Artères précérébrales</div><h1>Occlusion et sténose des artères précérébrales, n’entraînant pas un infarctus cérébral</h1><span class="status">Cycle 32 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des sténoses précérébrales</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#i65-0">Question clinique</a></li><li><a href="#i65-1">Définition et classification</a></li><li><a href="#i65-2">Fréquence et pronostic</a></li><li><a href="#i65-3">Anatomie et physiopathologie</a></li><li><a href="#i65-4">Facteurs de vulnérabilité et causes</a></li><li><a href="#i65-5">Anamnèse et clinique</a></li><li><a href="#i65-6">Démarche diagnostique</a></li><li><a href="#i65-7">Urgences et complications</a></li><li><a href="#i65-8">Principes de prise en charge</a></li><li><a href="#i65-9">Sténose carotidienne symptomatique</a></li><li><a href="#i65-10">Sténose carotidienne asymptomatique</a></li><li><a href="#i65-11">Sténose vertébrale et basilaire</a></li><li><a href="#i65-12">Suivi, situations particulières et limites</a></li><li><a href="#i65-13">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="i65-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 72 ans a perdu la vision de l’œil droit pendant quelques minutes il y a quatre jours, puis l’a retrouvée entièrement. L’examen neurologique est normal. Le duplex cervical décrit une sténose de l’artère carotide interne droite estimée à 75 % selon la méthode <button class="w" data-k="i65-nascet">NASCET</button> ; l’IRM cérébrale ne montre aucun infarctus récent. Ces valeurs sont pédagogiques et ne proviennent d’aucun dossier réel.</p>
<p>Trois questions structurent le cours. Cette sténose est-elle <b>symptomatique</b> ? Quel est son <b>degré</b> ? Faut-il la traiter par médicaments seuls ou la <b>revasculariser</b>, et dans quel délai ? Le code I65 ne répond à aucune des trois : il dit seulement que la lésion artérielle existe et qu’elle n’a pas, à ce jour, produit d’infarctus.</p>
<p>Dans la vignette, la cécité monoculaire transitoire ipsilatérale est un événement oculaire datant de moins de six mois : la sténose est <button class="w" data-k="i65-symptomatique">symptomatique</button>. Avec 75 %, elle entre dans la catégorie « serrée » (70–99 %), pour laquelle la ligne directrice de l’<button class="w" data-k="i65-eso">European Stroke Organisation</button> (ESO) recommande l’endartériectomie, idéalement dans les deux semaines suivant le dernier événement. La raison est le risque de récidive, maximal dans les tout premiers jours après l’événement <button class="w" data-k="i65-plaque">(rupture de plaque)</button>. Le traitement médical optimal démarre le jour même, sans attendre la décision chirurgicale.</p>
<div class="key"><b>À retenir.</b> Qui opérer, qui stenter, qui traiter médicalement seul, et quand ? Le symptôme récent, le degré de sténose et le risque périprocédural répondent à cette question. Le code I65 s’applique tant qu’aucun infarctus n’est constitué ; il passe à I63 dès qu’un infarctus apparaît.</div>
</section>
<section class="ilot" id="i65-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Le code <b>I65</b> de la CIM-10-GM 2024 désigne l’occlusion et la sténose des artères <b>précérébrales</b> — les artères basilaire, carotide et vertébrale — <b>sans infarctus cérébral résultant</b>. La classification y range l’embolie, l’obstruction complète ou partielle, la sténose et la thrombose de ces artères. Elle exclut les situations où l’occlusion ou la sténose entraîne un infarctus : celles-là relèvent de I63.- . Le codage suit donc l’imagerie cérébrale, non la gravité de la lésion artérielle : une sténose très serrée sans infarctus reste I65, un infarctus minuscule sur une sténose modérée devient I63. (<button class="w" data-k="i65-classification">fenêtre : sous-codes et codes voisins</button>)</p>
<table class="t"><thead><tr><th>Code</th><th>Intitulé</th><th>Artère concernée</th></tr></thead><tbody><tr><td>I65.0</td><td>Occlusion et sténose de l’artère vertébrale</td><td>Vertébrale</td></tr><tr><td>I65.1</td><td>Occlusion et sténose de l’artère basilaire</td><td>Basilaire</td></tr><tr><td>I65.2</td><td>Occlusion et sténose de l’artère carotide</td><td>Carotide</td></tr><tr><td>I65.3</td><td>Occlusion et sténose des artères précérébrales, multiples et bilatérales</td><td>Plusieurs artères, ou deux côtés</td></tr><tr><td>I65.8</td><td>Occlusion et sténose d’une autre artère précérébrale</td><td>Autre artère précérébrale</td></tr><tr><td>I65.9</td><td>Occlusion et sténose d’une artère précérébrale, sans précision</td><td>Non précisée</td></tr></tbody></table>
<p>Ce tableau reprend les sous-codes de la CIM-10-GM 2024 avec les intitulés français du registre du dépôt. Il sert à choisir le code le plus précis possible : I65.9 ne se justifie que si le compte rendu ne nomme pas l’artère. Trois codes voisins se distinguent de I65 : <b>I66</b> (même structure pour les artères cérébrales, comme la cérébrale moyenne), <b>I63.0 à I63.2</b> (infarctus par occlusion ou sténose d’une artère précérébrale) et <b>G45.-</b> (accident ischémique transitoire et syndromes apparentés, codés séparément).</p>
<p>Deux axes cliniques gouvernent ensuite la décision. Le premier oppose les sténoses <button class="w" data-k="i65-symptomatique">symptomatiques et asymptomatiques</button> : une sténose est symptomatique si un événement ischémique oculaire ou hémisphérique du même côté est survenu dans les <b>six mois</b> précédents. Le second est le <b>degré de sténose</b>, mesuré par la méthode <button class="w" data-k="i65-nascet">NASCET</button>.</p>
<table class="t"><thead><tr><th>Catégorie</th><th>Degré NASCET</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Légère</td><td>&lt; 50 %</td><td>Pas d’endartériectomie en cas de sténose symptomatique (recommandation forte contre)</td></tr><tr><td>Modérée</td><td>50–69 %</td><td>Endartériectomie suggérée si symptomatique</td></tr><tr><td>Serrée (sévère)</td><td>70–99 %</td><td>Endartériectomie recommandée si symptomatique</td></tr><tr><td>Quasi-occlusion</td><td>Collapsus de la lumière distale</td><td>Aucune recommandation de l’ESO : pas de définition standardisée</td></tr></tbody></table>
<p>Le tableau explique pourquoi deux seuils, 50 % et 70 %, reviennent sans cesse : ils délimitent les zones où le bénéfice de la revascularisation est établi, suggéré ou absent. Une sténose ipsilatérale de 50 % ou plus est considérée comme une cause potentielle de l’AVC ; en dessous, la recherche d’une autre cause reste obligatoire.</p>
<div class="trap"><span class="k">I65 n’est pas un AVC statistique</span> L’étude épidémiologique suisse de référence du fragment définit l’AVC aigu par les codes I60 à I64 et exclut I65 à I69. Un patient codé I65 n’est donc pas compté parmi les AVC de ces statistiques, même s’il porte un risque élevé d’en faire un.</div>
<div class="key"><b>À retenir.</b> Le code I65 décrit une lésion artérielle précérébrale sans infarctus. L’<b>état symptomatique</b> (événement ipsilatéral dans les six mois) et le <b>degré NASCET</b> (50 % et 70 %) déterminent le traitement.</div>
</section>
<section class="ilot" id="i65-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>La maladie athéroscléreuse carotidienne cause environ <b>10 à 15 %</b> des AVC ischémiques et des accidents ischémiques transitoires (AIT), selon la méthode de classification et la population. La revue bernoise et bâloise donne <b>15 %</b> des AVC pour la sténose ou l’occlusion de l’artère carotide interne extracrânienne ; une revue zurichoise estime qu’un quart des AVC ischémiques provient d’obstructions athéroscléreuses des artères extra- et intracrâniennes à destinée cérébrale. Ces estimations diffèrent parce qu’elles ne comptent pas les mêmes artères ni les mêmes patients. La <b>circulation postérieure</b> représente environ un cinquième des AVC ; la sténose vertébrobasilaire est responsable d’environ 20 % des AVC de ce territoire.</p>
<table class="t"><thead><tr><th>Âge</th><th>Hommes</th><th>Femmes</th></tr></thead><tbody><tr><td>Sixième décennie</td><td>2,3 %</td><td>2,0 %</td></tr><tr><td>Septième décennie</td><td>6,0 %</td><td>3,6 %</td></tr><tr><td>80 ans et plus</td><td>7,5 %</td><td>5,0 %</td></tr></tbody></table>
<p>Ce tableau donne la prévalence d’une sténose carotidienne de 50 % ou plus dans des populations caucasiennes, selon la ligne directrice de l’ESO. Elle augmente avec l’âge et reste plus élevée chez l’homme ; le dépistage est donc une question d’âge et de risque, non d’exhaustivité. D’autres sources donnent environ 7 % des hommes et 4,5 % des femmes dès 75 ans, ou 6 à 15 % dès 65 ans : l’écart tient aux populations étudiées. Les sources lues ne fournissent <b>aucune donnée suisse propre à I65</b> (<button class="w" data-k="i65-epidemio">fenêtre : limites des chiffres</button>).</p>
<p>Le pronostic dépend presque entièrement de l’état symptomatique. Après un AVC ou un AIT, la sténose symptomatique expose à un risque d’AVC de <b>25 % dans les 14 jours</b> selon la revue zurichoise ; la ligne directrice insiste sur la concentration du risque dans les premiers jours. À l’inverse, la sténose asymptomatique sous traitement médical moderne comporte un risque annuel d’AVC ipsilatéral de <b>0,34 à 1,4 %</b> dans les études observationnelles récentes, inférieur à celui des bras médicaux des essais anciens ; l’essai ACST-2 rapporte environ 1 % par an après les 30 premiers jours. Cette baisse s’explique par l’amélioration du traitement médical.</p>
<p>Dans la circulation postérieure, une analyse poolée retrouve une récidive d’AVC à 90 jours de <b>33 %</b> en cas de sténose intracrânienne basilaire ou vertébrale, contre <b>16 %</b> en cas de sténose vertébrale extracrânienne. Le siège intracrânien ou extracrânien change donc le pronostic autant que le degré de sténose.</p>
<div class="trap"><span class="k">Chiffres non comparables</span> Le 25 % à 14 jours et le 0,34–1,4 % par an viennent de populations, de méthodes et d’époques différentes. Ils indiquent deux ordres de grandeur, pas un rapport de risque calculé. Leur écart justifie la précocité en cas de symptôme et la sélectivité sans symptôme.</div>
<button class="pareto-btn ui" data-k="pareto-i65-definition">▲ Loi de Pareto — Définition, fréquence et pronostic</button>
</section>
<section class="ilot" id="i65-3"><h2><span class="n">3</span>Anatomie et physiopathologie</h2>
<p>La sténose athéroscléreuse carotidienne siège typiquement à la <b>bifurcation carotidienne</b>, sur la partie distale de l’artère carotide commune et la partie proximale de l’artère carotide interne. Plus rarement, elle touche la carotide commune proximale ou la carotide interne distale, surtout dans son segment caverneux. Connaître ce siège explique deux faits pratiques : la lésion est accessible à l’échographie cervicale, et elle se trouve au cou, donc dans une zone où le chirurgien peut ouvrir l’artère (<button class="w" data-k="i65-bifurcation">fenêtre : anatomie de la bifurcation</button>).</p>
<figure><svg viewBox="0 0 400 300" role="img" aria-label="Figure 1 — Bifurcation carotidienne et embolie" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M165 290V170"/><path d="M215 290V170"/><path d="M165 170L150 120V30"/><path d="M215 170L230 120V30"/><path d="M150 30h80"/><path d="M165 150c8-6 8-18 0-24" stroke-width="3"/><path d="M215 150c-8-6-8-18 0-24" stroke-width="3"/><circle cx="205" cy="105" r="5"/><path d="M205 95V60m-4 6l4-6 4 6" stroke-dasharray="4 3"/></g><g fill="currentColor"><text x="20" y="262">Carotide commune</text><text x="20" y="150">Bifurcation :</text><text x="20" y="166">plaque (trait épais)</text><text x="245" y="105">Embole détaché</text><text x="245" y="60">Vers l’œil et le cerveau</text><text x="245" y="130">Carotide interne</text></g></svg><figcaption>Figure 1 — Bifurcation carotidienne. Schéma didactique : la plaque se développe sur la partie distale de la carotide commune et la partie proximale de la carotide interne ; la rupture libère un embole qui occlut une artère plus distale.</figcaption></figure>
<p>Le <b>mécanisme principal</b> de l’ischémie d’origine carotidienne est la <b>rupture de la plaque</b> : elle libère du matériel embolique qui occlut une artère plus distale. L’obstacle est ainsi à distance de la lésion. Si l’embole atteint la rétine, il provoque une cécité monoculaire transitoire (amaurose fugace) ou, plus rarement, une ischémie rétinienne ; s’il atteint un hémisphère, il provoque un AIT ou un AVC. Tant que l’épisode régresse sans infarctus, le code reste I65 ; une ischémie persistante avec infarctus relève de I63 (<button class="w" data-k="i65-plaque">fenêtre : rupture de plaque et embolie</button>).</p>
<p>Une plaque dite <b>vulnérable</b> (*high-risk plaque*) justifie une revascularisation rapide, car le risque de récidive est nettement accru dans les premiers jours. Les marqueurs de vulnérabilité sont l’<b>hémorragie intraplaque</b>, présente dans 30 à 50 % des sténoses symptomatiques contre 20 à 30 % des asymptomatiques, un noyau nécrotique lipidique à chape fibreuse fine et l’inflammation dans la plaque. L’hémorragie intraplaque accroît le risque d’AVC ipsilatéral même pour une sténose inférieure à 50 % NASCET et serait un prédicteur plus fort que le degré de sténose (<button class="w" data-k="i65-hemorragie">fenêtre : hémorragie intraplaque</button>).</p>
<p>Le risque de récidive est plus élevé après un événement hémisphérique qu’après un AIT ou un événement oculaire. Deux phénomènes complètent le tableau : les <b>micro-emboles</b> détectés au Doppler transcrânien, qui prouvent que la plaque libère encore des fragments, et une <b>réserve cérébrovasculaire</b> diminuée (<button class="w" data-k="i65-reserve">fenêtre</button>). Le dossier de recherche ne chiffre pas la part exacte de l’origine hémodynamique : il présente l’embolie comme mécanisme principal.</p>
<p>Les artères vertébrales et basilaires obéissent à la même logique d’obstacle, mais leurs conséquences diffèrent. La circulation postérieure représente environ un cinquième des AVC, et le risque de récidive varie fortement selon le siège (<button class="w" data-k="i65-posterieure">fenêtre : circulation postérieure</button>). Hors du champ de l’athérosclérose, d’autres lésions sténosent les artères précérébrales : dissections carotidiennes, anévrismes, dysplasie fibromusculaire, vascularites. Elles se cherchent quand le contexte ne ressemble pas à l’athérosclérose.</p>
<div class="key"><b>À retenir.</b> Plaque vulnérable → rupture → embole → occlusion distale (œil ou hémisphère). La sténose elle-même est le marqueur d’une plaque instable : l’<b>hémorragie intraplaque</b> prédit le risque mieux que le degré seul.</div>
</section>
<section class="ilot" id="i65-4"><h2><span class="n">4</span>Facteurs de vulnérabilité et causes</h2>
<p>Les facteurs de vulnérabilité sont les caractéristiques de la plaque ou du patient qui prédisent un AVC ipsilatéral. Ils intéressent surtout la sténose asymptomatique, où le degré seul ne suffit pas à choisir entre traitement médical et revascularisation (<button class="w" data-k="i65-vulnerabilite">fenêtre : prédicteurs et limites</button>).</p>
<table class="t"><thead><tr><th>Facteur prédictif</th><th>Ce qu’il reflète</th><th>Examen qui le montre</th></tr></thead><tbody><tr><td>Degré de sténose et progression</td><td>Obstacle croissant et plaque active</td><td>Duplex</td></tr><tr><td>Plaque irrégulière ou ulcérée</td><td>Surface fragile exposée au sang</td><td>Tomodensitométrie, IRM, échographie</td></tr><tr><td>Plaque échopauvre ; zone échopauvre juxtaluminale</td><td>Contenu lipidique ou hémorragique mou</td><td>Duplex</td></tr><tr><td>Hémorragie intraplaque</td><td>Saignement dans la plaque</td><td>IRM de plaque</td></tr><tr><td>Noyau nécrotique lipidique à chape fine</td><td>Plaque prête à se rompre</td><td>Imagerie de plaque</td></tr><tr><td>Infarctus cérébraux silencieux</td><td>Emboles déjà passés sans symptôme</td><td>Imagerie cérébrale</td></tr><tr><td>Micro-emboles</td><td>Libération active de fragments</td><td>Doppler transcrânien</td></tr><tr><td>Réserve cérébrovasculaire diminuée</td><td>Faible capacité de compensation en aval</td><td>Doppler transcrânien</td></tr><tr><td>AVC ou AIT controlatéral</td><td>Maladie athéroscléreuse étendue</td><td>Anamnèse et imagerie</td></tr><tr><td>Inflammation dans la plaque</td><td>Activité biologique de la plaque</td><td>Non précisé dans les sources lues</td></tr></tbody></table>
<p>Le tableau regroupe les prédicteurs cités par la revue de Berne et Bâle et par la ligne directrice de l’ESO ; la revue bâloise ajoute la grande surface de plaque, l’irrégularité ou l’ulcération en mode B et la vascularisation intraplaque à l’échographie de contraste. La colonne centrale est une lecture didactique : elle relie chaque marqueur à une propriété de la plaque, sans prétendre à un seuil validé. Les sources lues ne fixent aucun seuil de décision fondé sur ces marqueurs ; la revue zurichoise de 2023 propose d’identifier des sous-groupes à risque morphologique et de décider au cas par cas en équipe.</p>
<p>Les leviers du traitement médical visent les facteurs de risque de l’athérosclérose : tabac, lipides et pression artérielle (<button class="w" data-k="i65-bmt">fenêtre : traitement médical optimal</button>). Les causes non athéroscléreuses — dissection, dysplasie fibromusculaire, vascularite, anévrisme — changent le traitement et se cherchent devant un patient jeune ou un tableau atypique.</p>
<button class="pareto-btn ui" data-k="pareto-i65-physio">▲ Loi de Pareto — Physiopathologie et vulnérabilité</button>
</section>
<section class="ilot" id="i65-5"><h2><span class="n">5</span>Anamnèse et clinique</h2>
<p>L’interrogatoire cherche d’abord la <b>date et la nature du dernier événement ischémique</b>, car ces deux éléments classent la sténose et fixent le délai de revascularisation. Une sténose asymptomatique, par définition, n’a donné aucun symptôme ipsilatéral dans les six mois ; elle est découverte fortuitement ou lors d’un bilan vasculaire. Une sténose symptomatique sans infarctus se présente comme un AIT hémisphérique ou comme un événement oculaire.</p>
<div class="two"><div class="card"><h4>Forme asymptomatique</h4><p>Aucun événement oculaire ou cérébral ipsilatéral depuis six mois. Le diagnostic est fortuit ; la question est de décider si la revascularisation apporte un bénéfice net.</p>
<p>L’examen neurologique est normal. Les sources lues ne précisent pas la valeur diagnostique du souffle cervical (<button class="w" data-k="i65-lacune-clinique">fenêtre : ce qui n’est pas documenté</button>).</p>
</div><div class="card"><h4>Forme symptomatique sans infarctus</h4><p><b>Cécité monoculaire transitoire</b> (amaurose fugace) ou ischémie rétinienne ; <b>AIT hémisphérique</b> : symptômes neurologiques focaux transitoires de moins de 24 heures, d’origine ischémique vraisemblable (<button class="w" data-k="i65-ait">fenêtre : AIT et haut risque</button>).</p>
<p>Le déficit moteur ou le trouble du langage de plus de cinq minutes, les événements récidivants et la maladie d’une grosse artère ipsilatérale classent l’AIT à haut risque.</p>
</div></div>
<p>La <b>circulation postérieure</b> pose un problème particulier : les AIT et les AVC y sont plus difficiles à diagnostiquer, et les échelles de dépistage rapide de l’AVC (visage, bras, parole) y sont moins sensibles. Un interrogatoire qui s’arrête à un déficit moteur ou à un trouble du langage peut donc manquer une sténose vertébrobasilaire.</p>
<p>Le risque de récidive est plus élevé après un événement hémisphérique qu’après un événement oculaire. Cette différence guide l’urgence, mais elle ne dispense pas de traiter un événement oculaire : l’amaurose fugace compte comme événement symptomatique dans la ligne directrice.</p>
<div class="quiz ui"><p><b>Cas.</b> Un homme de 68 ans présente, il y a trois mois, une cécité monoculaire gauche de cinq minutes. Le duplex révèle aujourd’hui une sténose carotidienne gauche de 60 %. Cette sténose est-elle symptomatique ?</p><button data-ok="1">Oui : un événement oculaire ipsilatéral de moins de six mois la rend symptomatique.</button><button data-ok="0">Non : seuls les déficits hémisphériques comptent.</button><button data-ok="0">Non : le degré de 60 % la classe d’emblée comme asymptomatique.</button><p class="fb" hidden>L’événement oculaire transitoire ipsilatéral survenu dans les six mois définit la sténose comme symptomatique ; le degré ne modifie pas cette classification. Avec 60 %, la sténose est modérée (50–69 %) : l’endartériectomie est suggérée, avec une force faible.</p></div>
<div class="key"><b>À retenir.</b> Deux questions à l’interrogatoire : quand et quoi ? Un événement ipsilatéral oculaire ou hémisphérique dans les six mois rend la sténose symptomatique. Le diagnostic clinique de la sténose elle-même est impossible sans imagerie.</div>
</section>
<section class="ilot" id="i65-6"><h2><span class="n">6</span>Démarche diagnostique</h2>
<p>Le diagnostic doit établir quatre points : la présence d’une sténose, son degré, l’absence d’infarctus constitué et le statut symptomatique. L’<b>écho-Doppler</b> (duplex) est l’examen de première intention pour détecter la sténose carotidienne extracrânienne et en évaluer l’étendue et la sévérité ; il fournit aussi la morphologie de la plaque (<button class="w" data-k="i65-duplex">fenêtre : duplex</button>). L’ESO recommande ensuite, chez le patient avec AIT, une angio-IRM ou un angio-scanner pour <b>confirmer</b> une sténose de grosse artère de 50 % ou plus et préciser son degré (<button class="w" data-k="i65-angio">fenêtre</button>).</p>

<p>L’imagerie cérébrale joue un rôle de classement : en présence d’un infarctus constitué, le diagnostic bascule de I65 vers I63. Les examens de plaque — IRM pour l’hémorragie intraplaque, Doppler transcrânien pour les micro-emboles et la réserve — précisent le risque sans remplacer le degré (<button class="w" data-k="i65-irm-plaque">fenêtre</button>). Les sténoses vertébrobasilaires sont identifiées par angio-scanner ou angio-IRM dans les études poolées.</p>
<table class="t"><thead><tr><th>Diagnostic différentiel</th><th>Pourquoi le distinguer</th><th>Ce qui le sépare</th></tr></thead><tbody><tr><td>Infarctus constitué (I63.-)</td><td>Le pronostic et le codage changent</td><td>Imagerie cérébrale</td></tr><tr><td>Atteinte d’une artère cérébrale intracrânienne (I66)</td><td>L’artère n’est pas précérébrale</td><td>Siège de la lésion en imagerie</td></tr><tr><td>AIT cardio-embolique</td><td>Le traitement antithrombotique diffère</td><td>Recherche d’une source cardiaque (non détaillée dans les sources lues)</td></tr><tr><td>Dissection, dysplasie fibromusculaire, vascularite, anévrisme</td><td>L’athérosclérose n’explique pas la sténose</td><td>Aspect et contexte d’imagerie</td></tr></tbody></table>
<p>Le tableau classe les diagnostics par conséquence : le plus lourd, l’infarctus, vient en premier parce qu’il change la prise en charge immédiate. Le dossier de recherche ne détaille pas la démarche cardiologique de recherche d’une source embolique ; elle reste hors de ce cours.</p>
<div class="key"><b>À retenir.</b> Duplex d’abord, confirmation par angio-IRM ou angio-scanner, imagerie cérébrale pour exclure l’infarctus, puis classement symptomatique et NASCET. Le degré rapporté sans méthode de mesure ne suffit pas à décider.</div>
</section>
