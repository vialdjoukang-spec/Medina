<template data-pop="g80-tonus" data-title="Tonus et mouvement : logique de la classification">
<div class="lab">Principe</div><p>La classification SCPE combine le tonus (augmenté, variable ou diminué) et le mouvement (réduit ou augmenté). Spastique : tonus augmenté. Dystonique : hypertonique et hypokinétique. Choréo-athétosique : hypotonique et hyperkinétique. Ataxique : tonus surtout diminué.</p><div class="lab">Application</div><p>Le médecin décrit le tonus et le mouvement avant de nommer le type ; la raideur seule ne suffit pas à conclure à une forme spastique.</p><div class="lab">Limite</div><p>Les techniques d’examen du tonus ne sont pas détaillées dans les sources lues.</p>
</template>
<template data-pop="g80-sevrage" data-title="Sevrage du baclofène">
<div class="lab">Tableau</div><p>Arrêt brutal : confusion, hallucinations, convulsions, hyperthermie, rebond de spasticité. Par voie intrathécale : tableau hypermétabolique et rhabdomyolyse.</p><div class="lab">Prévention</div><p>Arrêt progressif sur environ 3 semaines par voie orale ; ne jamais interrompre une pompe intrathécale sans plan.</p><div class="lab">Source</div><p>Informations professionnelles suisses du Liorésal® (janvier 2025) et du Liorésal intrathécal® (avril 2024).</p>
</template>
<template data-pop="g80-feux" data-title="Synthèse « feux tricolores » de 2019">
<div class="lab">Résumé</div><p>Feu vert : thérapie par contrainte induite, entraînement bimanuel, entraînement orienté vers des buts, entraînement spécifique à la tâche, plâtres, renforcement, tapis roulant, programmes à domicile ; antiépileptiques, bisphosphonates, toxine botulique, diazépam, soins dentaires, surveillance des hanches, baclofène intrathécal, correction de scoliose, rhizotomie dorsale sélective. Feu rouge (revue de 2013 citée) : thérapie crânio-sacrée, attelle de hanche, oxygène hyperbare, thérapie neurodéveloppementale, intégration sensorielle.</p><div class="lab">Limite</div><p>Revue australienne : synthèse de preuves, non recommandation nationale suisse. Seul le résumé a été lu.</p>
</template>
<template data-pop="g80-consensus" data-title="Consensus européen de 2009 sur la toxine botulique">
<div class="lab">Contenu</div><p>Approche intégrée multidisciplinaire, buts réalistes, utilisation des courbes GMFCS et GMFM. Basé sur 36 institutions de 9 pays et plus de 10 000 patients.</p><div class="lab">Limite</div><p>Ancien (2009) ; résumé seul.</p>
</template>
<template data-pop="g80-baclofene-it" data-title="Liorésal intrathécal®">
<div class="lab">Mécanisme</div><p>Le baclofène stimule les récepteurs GABA-B de la moelle et inhibe les réflexes mono- et polysynaptiques.</p><div class="lab">Posologie</div><p>Test en bolus (25 µg chez l’enfant) ; un non-répondeur à 100 µg est exclu ; dans la spasticité cérébrale, augmentations de 5–20 % au plus ; entretien de 22 à 1400 µg/jour (moyenne 276 µg/jour à 12 mois) ; avant 12 ans, 24 à 1199 µg/jour.</p><div class="lab">Sécurité</div><p>Sécurité non démontrée avant 4 ans. Arrêt brutal : tableau hypermétabolique et rhabdomyolyse.</p><div class="lab">Accès</div><p>En Europe, 3,4 % des enfants atteints de PC sont traités, surtout en GMFCS IV–V et en forme spastique bilatérale ; l’accès varie selon la richesse des pays.</p><div class="lab">Limite</div><p>Contre-indications et surveillance détaillées non extraites du dossier.</p>
</template>
<template data-pop="g80-rhizotomie" data-title="Rhizotomie dorsale sélective">
<div class="lab">Technique</div><p>Section de 50 à 75 % des fibres afférentes de la première racine lombaire à la première racine sacrée ; irréversible ; membres inférieurs.</p><div class="lab">Place</div><p>Classée « feu vert » dans la synthèse de preuves de 2019. Les indications précises n’ont pas été lues.</p>
</template>
<template data-pop="g80-chir-hanche" data-title="Chirurgie de hanche en GMFCS IV–V">
<div class="lab">Données</div><p>Ostéotomie pelvienne percutanée associée à une ostéotomie fémorale de varisation, 54 patients GMFCS IV–V : migration de 66,8 % à 8,1 %.</p><div class="lab">Niveau de preuve</div><p>Série rétrospective, niveau III ; équipe de Genève.</p>
</template>
<template data-pop="g80-cannabis" data-title="Cannabinoïdes : pratique sans preuve">
<div class="lab">Données</div><p>Enquête auprès de 70 médecins du registre suisse : prescription pour l’épilepsie (69 %), la spasticité (64 %), la douleur (63 %) ; somnolence fréquente.</p><div class="lab">Conclusion</div><p>Absence de preuve d’efficacité ; des essais contrôlés randomisés sont nécessaires.</p>
</template>
<template data-pop="g80-prevention" data-title="Préventions efficaces">
<div class="lab">Liste</div><p>Corticoïdes anténatals, sulfate de magnésium, caféine, hypothermie néonatale (synthèse de preuves).</p><div class="lab">Sulfate de magnésium</div><p>Avant 34 SA : réduction de la PC à 2 ans (risque relatif 0,71 ; intervalle de confiance à 95 % 0,57–0,89 ; 6 essais, 6107 enfants ; 60 femmes à traiter pour éviter une PC) ; décès ou PC : risque relatif 0,87 ; pas de différence démontrée à l’âge scolaire ; effets indésirables maternels imposant l’arrêt : risque relatif 3,21.</p>
</template>
<template data-pop="g80-pronostic" data-title="Pronostic global et lacunes">
<div class="lab">Données</div><p>Pays à hauts revenus : 2 enfants sur 3 marcheront, 3 sur 4 parleront, 1 sur 2 aura une intelligence normale.</p><div class="lab">Lacunes</div><p>L’espérance de vie et la transition vers l’âge adulte n’ont pas été sourcées.</p>
</template>
<template data-pop="g80-dysport" data-title="Dysport® (toxine botulique A)">
<div class="lab">Mécanisme</div><p>Blocage de la libération d’acétylcholine à la jonction neuromusculaire : dénervation chimique et paralysie flasque locale.</p><div class="lab">Indication</div><p>Spasticité focale des membres supérieurs et inférieurs (pied équin dynamique) dès 2 ans.</p><div class="lab">Posologie</div><p>Membre supérieur : au plus 16 U/kg ou 640 U (unilatéral), 21 U/kg ou 840 U (bilatéral), la plus faible. Membre inférieur : au plus 15 U/kg (unilatéral), 30 U/kg (bilatéral), 500 U par jambe, 1000 U ou 30 U/kg par séance ; au plus 0,5 mL par site.</p><div class="lab">Effets indésirables</div><p>Propagation à distance, dysphagie, troubles respiratoires ; risque accru si troubles de déglutition préexistants.</p><div class="lab">Surveillance</div><p>Effet maximal vers 2 semaines, durée d’environ 3 à 8 mois ; les unités ne sont pas interchangeables.</p><div class="lab">Limite</div><p>Contre-indications non extraites du dossier.</p>
</template>
<template data-pop="g80-baclofene-oral" data-title="Liorésal® (baclofène oral)">
<div class="lab">Mécanisme</div><p>Stimulation des récepteurs GABA-B de la moelle ; inhibition des réflexes mono- et polysynaptiques par réduction de la libération de glutamate et d’aspartate.</p><div class="lab">Posologie</div><p>Dès 12 mois ; départ 0,3 mg/kg/jour en 4 prises ; paliers de 1 à 2 semaines ; entretien 0,75 à 2 mg/kg/jour ; maximum 40 mg/jour avant 8 ans et 60 mg/jour après 8 ans.</p><div class="lab">Effets indésirables</div><p>Plus fréquents dans la spasticité d’origine cérébrale ; sevrage à l’arrêt brutal.</p><div class="lab">Précautions</div><p>Prudence si la spasticité sert à la station debout ; prudence en cas d’insuffisance rénale ; arrêt progressif sur environ 3 semaines.</p><div class="lab">Limite</div><p>Peu d’expérience pédiatrique selon la fiche.</p>
</template>
<template data-pop="g80-lacunes" data-title="Ce que ce cours ne couvre pas">
<div class="lab">Sources non lues</div><p>Aucune recommandation suisse de société (neuropédiatrie ou médecine physique) n’a pu être lue ; l’accès à la recommandation britannique NG62 a été refusé ; la page du réseau SCPE est introuvable.</p><div class="lab">Contenus manquants</div><p>Assurance-invalidité et infirmité congénitale ; niveaux de la fonction manuelle et de la communication ; intervalles de surveillance des hanches ; informations professionnelles du diazépam, de la tizanidine, du glycopyrronium et des antiépileptiques ; espérance de vie et transition vers l’âge adulte ; prévalence suisse populationnelle.</p><div class="lab">Conséquence</div><p>Ces points ne doivent pas être déduits de ce cours ; ils sont à rechercher dans les sources primaires.</p>
</template>
<template data-pop="pareto-g80-definition" data-title="Pareto — Définition et périmètre">
<p class="ratio" data-cover="g80-0,g80-1"></p><ul><li>La PC est un trouble moteur permanent, attribué à une lésion non progressive du cerveau en développement, avec limitation d’activité.</li><li>G80 couvre sept sous-codes ; la paraplégie spastique héréditaire est exclue (G11.4).</li><li>Le tableau change avec l’âge même si la lésion est fixe.</li></ul></template>
<template data-pop="pareto-g80-classif" data-title="Pareto — Classifications">
<p class="ratio" data-cover="g80-2"></p><ul><li>Trois classifications : type SCPE, niveau GMFCS, groupe d’imagerie MRICS.</li><li>GMFCS I–V par tranches d’âge, fiable dès 2 ans.</li><li>Les lésions bilatérales prédisent une atteinte plus sévère.</li></ul></template>
<template data-pop="pareto-g80-epidemio" data-title="Pareto — Fréquence">
<p class="ratio" data-cover="g80-3"></p><ul><li>Environ 2 pour 1000 en Europe ; 146 pour 1000 avant 28 SA.</li><li>Suisse : 59 % GMFCS I–II, 29 % IV–V ; 6 % de PC à 5 ans chez les moins de 30 SA.</li><li>Registre suisse non exhaustif : pas de prévalence nationale.</li></ul></template>
<template data-pop="pareto-g80-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g80-4"></p><ul><li>Le siège de la lésion indique le moment de l’atteinte.</li><li>Facteurs prénataux environ 75 % ; prématurité facteur majeur.</li><li>Génétique : exome en trio si imagerie normale ou évolution atypique.</li></ul></template>
<template data-pop="pareto-g80-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g80-5,g80-6"></p><ul><li>Comorbidités : épilepsie, déficience intellectuelle, dysphagie, parole, hanches.</li><li>Outils standardisés : mouvements généraux 98 %, HINE 90 %.</li><li>Hanches : l’amplitude est un mauvais indicateur, la radiographie est nécessaire.</li></ul></template>
<template data-pop="pareto-g80-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g80-7"></p><ul><li>Diagnostic clinique, possible avant 6 mois d’âge corrigé.</li><li>Concordance de l’anamnèse, de l’IRM et d’un examen standardisé.</li><li>Régression ou imagerie normale : chercher une autre maladie.</li></ul></template>
<template data-pop="pareto-g80-pec" data-title="Pareto — Urgences et prise en charge">
<p class="ratio" data-cover="g80-8,g80-9"></p><ul><li>Sevrage du baclofène et propagation de la toxine : deux urgences.</li><li>Rééducation intensive centrée sur des buts ; toxine pour le focal ; baclofène pour le sévère.</li><li>Éviter les interventions « feu rouge » et les cannabinoïdes sans preuve.</li></ul></template>
<template data-pop="pareto-g80-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g80-10,g80-11"></p><ul><li>Sulfate de magnésium avant 34 SA : 60 femmes à traiter pour éviter une PC.</li><li>Surveillance des hanches et des comorbidités.</li><li>Âges limites : 12 mois, 2 ans, 4 ans selon le médicament.</li></ul></template>
<template data-pop="pareto-g80-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="g80-e-1,g80-e-2,g80-e-3,g80-e-4"></p><ul><li>Mouvements généraux, HINE et IRM pour le risque précoce.</li><li>Radiographie de hanche, seuil de migration 40 %.</li><li>Génétique en cascade si imagerie normale.</li></ul></template>
<template data-pop="pareto-g80-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g80-s-anat-cours"></p><ul><li>Cinq groupes d’imagerie selon le moment de l’atteinte.</li><li>Hanche centrée ou déplacée ; risque selon GMFCS.</li></ul></template>
<template data-pop="pareto-g80-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g80-s-physio-cours"></p><ul><li>Tonus et mouvement définissent le type moteur.</li><li>Le baclofène agit sur les réflexes de la moelle.</li></ul></template>
<template data-pop="pareto-g80-gen" data-title="Pareto — Génétique">
<p class="ratio" data-cover="g80-s-gen-cours"></p><ul><li>Exome en trio, puis puce, puis génome.</li><li>PC ataxique : 9 % de syndromes génétiques.</li></ul></template>
<template data-pop="pareto-g80-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g80-s-bioch-cours"></p><ul><li>Baclofène : GABA-B, moins de glutamate.</li><li>Toxine botulique : moins d’acétylcholine.</li></ul></template>
<template data-pop="pareto-g80-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g80-p-1,g80-p-2,g80-p-3,g80-p-4"></p><ul><li>Toxine pour le focal, baclofène oral pour le diffus, intrathécal pour le sévère.</li><li>Unités de Dysport® non interchangeables.</li><li>Ne jamais arrêter brutalement le baclofène.</li></ul></template>
