<template data-pop="g99-midodrine" data-title="Midodrine (Gutron)">
<div class="lab">Indication suisse</div><p>Hypotension orthostatique secondaire (p. ex. neuropathie diabétique) et formes sévères.</p>
<div class="lab">Posologie</div><p>Formes sévères : début 3 × 2,5 mg par jour, première dose 30 à 45 minutes avant le lever ; adaptation hebdomadaire selon la pression systolique 3 minutes après le lever ; jusqu’à 15 mg par jour dans certains cas. Dernière dose au moins 4 heures avant le coucher.</p>
<div class="lab">Contre-indications</div><p>Cardiopathie organique sévère, hypertension, arythmies, maladie rénale aiguë, insuffisance rénale sévère, rétention urinaire, rétinopathie diabétique proliférante, phéochromocytome, hyperthyroïdie, glaucome à angle fermé, grossesse et allaitement.</p>
<div class="lab">Surveillance</div><p>Pression couchée et assise au moins deux fois par semaine au début ; fonction rénale.</p>
<div class="lab">Limite</div><p>Date de mise à jour de la fiche non extraite.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse, AIPS via AmiKo, consultée le 15.10.2026</a>.</p></template>
<template data-pop="g99-fludro" data-title="Fludrocortisone (Florinef)">
<div class="lab">Indication suisse</div><p>Insuffisance corticosurrénale (Addison), syndrome de perte de sel. L’hypotension orthostatique n’est pas une indication autorisée : usage hors indication si prescrit selon l’ESC.</p>
<div class="lab">Posologie</div><p>0,1 mg trois fois par semaine à 0,2 mg par jour (indications suisses).</p>
<div class="lab">Effets et contrôle</div><p>Rétention sodée, œdèmes, hypertension, hypokaliémie : contrôle des électrolytes.</p>
<div class="lab">Contre-indications</div><p>Hypertension artérielle sévère, ulcères gastro-intestinaux aigus, mycoses systémiques.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse, AIPS via AmiKo, consultée le 15.10.2026</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">ESC 2018, syncope (Eur Heart J 2018;39:1883-1948)</a>.</p></template>
<template data-pop="g99-domperidone" data-title="Dompéridone (Motilium)">
<div class="lab">Indication suisse</div><p>Nausées et vomissements, à partir de 12 ans et 35 kg. La gastroparésie n’est pas mentionnée.</p>
<div class="lab">Posologie</div><p>10 mg trois fois par jour, 15 à 30 minutes avant les repas ; durée continue d’au plus 1 semaine.</p>
<div class="lab">Contre-indications</div><p>Allongement du QTc, troubles électrolytiques significatifs, insuffisance cardiaque, inhibiteurs puissants du CYP3A4 allongeant le QT, insuffisance hépatique modérée ou sévère, prolactinome.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse, AIPS via AmiKo, consultée le 15.10.2026</a>.</p></template>
<template data-pop="g99-metoclopramide" data-title="Métoclopramide (Paspertin)">
<div class="lab">Posologie</div><p>10 mg jusqu’à 3 fois par jour, maximum 30 mg par jour ou 0,5 mg/kg ; durée maximale 5 jours (dyskinésies tardives potentiellement irréversibles).</p>
<div class="lab">Insuffisance rénale</div><p>Réduction de 50 % (clairance 15 à 60 mL/min) et de 75 % (clairance ≤ 15 mL/min).</p>
<div class="lab">Contre-indications</div><p>Maladie de Parkinson, antécédent de dyskinésie tardive, épilepsie, phéochromocytome, hémorragie, occlusion ou perforation digestive, association à la lévodopa.</p>
<div class="lab">Limite</div><p>La gastroparésie n’est pas mentionnée comme indication dans la fiche lue.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse, AIPS via AmiKo, consultée le 15.10.2026</a>.</p></template>
<template data-pop="g99-tafamidis" data-title="Tafamidis (Vyndaqel)">
<div class="lab">Indication suisse</div><p>Cardiomyopathie amyloïde à transthyrétine (sauvage ou héréditaire). Aucune indication suisse lue pour la polyneuropathie.</p>
<div class="lab">Posologie</div><p>61 mg de tafamidis ou 80 mg de tafamidis méglumine une fois par jour ; les deux formes ne sont pas interchangeables mg pour mg.</p>
<div class="lab">Limite</div><p>Les traitements spécifiques de la polyneuropathie à transthyrétine (patisiran, vutrisiran, inotersen, eplontersen) n’ont pas été lus.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse, AIPS via AmiKo, consultée le 15.10.2026</a>.</p></template>
<template data-pop="g99-mnemo" data-title="Aide mnémotechnique : les quatre urgences à ne pas manquer">
<p><b>Aide pédagogique, non critère officiel.</b> Pour mémoriser les quatre tableaux du cours, on peut retenir « <b>Cœur, estomac, moelle, nerf</b> » : cœur = neuropathie autonome cardiovasculaire ; estomac = gastroparésie ; moelle = myélopathie ; nerf = neuropathie périphérique (urémique ou amyloïde).</p>
<p>Les seuils à retenir restent ceux des sources : baisse systolique de 20 mmHg, retard de vidange avec endoscopie normale, score mJOA 15-17/12-14/≤ 11, stades de locomotion 1 à 3.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">ESC 2018, syncope (Eur Heart J 2018;39:1883-1948)</a>.</p></template>
<template data-pop="pareto-g99-def" data-title="Pareto — Notions et définitions">
<p class="ratio" data-cover="g99-0,g99-1,g99-2"></p><ul><li>L’hypotension orthostatique est une baisse systolique ≥ 20 mmHg ou diastolique ≥ 10 mmHg à la verticalisation.</li><li>La gastroparésie associe symptômes, retard de vidange et absence d’obstruction.</li><li>La MCD est une compression cervicale dégénérative, graduée par le score mJOA.</li><li>Une compression asymptomatique existe chez 59 % des 40-80 ans.</li></ul></template>
<template data-pop="pareto-g99-meca" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g99-3,g99-4"></p><ul><li>L’atteinte longueur-dépendante touche d’abord le nerf vague.</li><li>La moelle souffre par compression directe et ischémie.</li><li>L’hyperkaliémie chronique est le mécanisme proposé de la neuropathie urémique.</li></ul></template>
<template data-pop="pareto-g99-clin" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g99-5,g99-6"></p><ul><li>Chercher une aggravation sur des mois pour la MCD.</li><li>Examen peu sensible mais spécifique ; un examen normal n’exclut pas.</li><li>43 % des présentations de MCD ressemblent à un canal carpien.</li></ul></template>
<template data-pop="pareto-g99-diag" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g99-7"></p><ul><li>Tests cardiovasculaires réflexes pour la neuropathie autonome.</li><li>Endoscopie puis test de vidange pour la gastroparésie.</li><li>IRM cervicale pour la MCD ; IRM de tout le rachis pour la compression métastatique.</li><li>Séquençage de TTR, biopsie et typage pour l’amylose.</li></ul></template>
<template data-pop="pareto-g99-urg" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g99-8"></p><ul><li>La compression médullaire métastatique est une urgence absolue.</li><li>La manipulation cervicale est contre-indiquée en cas de myélopathie.</li><li>L’hypoglycémie majore le risque cardiovasculaire.</li></ul></template>
<template data-pop="pareto-g99-trait" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g99-9,g99-10,g99-11"></p><ul><li>Traiter seulement l’hypotension orthostatique symptomatique.</li><li>Eau 2-3 L, sel 10 g, tête du lit > 10°.</li><li>Chirurgie recommandée pour la MCD modérée et sévère ; la myélopathie clinique pose l’indication en Suisse.</li></ul></template>
<template data-pop="pareto-g99-crit" data-title="Pareto — Critères">
<p class="ratio" data-cover="g99-12"></p><ul><li>Chaque entité a son critère formel : pression, vidange, mJOA, stades, génétique plus biopsie.</li><li>Les lacunes de source sont assumées dans la monographie.</li></ul></template>
<template data-pop="pareto-g99-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g99-e-1,g99-e-2,g99-e-3,g99-e-4,g99-e-5,g99-e-6"></p><ul><li>Lever actif, tests réflexes, endoscopie, vidange, IRM, biopsie : un examen par question.</li><li>Aucun examen ne remplace la clinique.</li></ul></template>
<template data-pop="pareto-g99-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g99-s-anat-cours"></p><ul><li>Le nerf vague est le plus long nerf autonome.</li><li>La moelle cervicale contient fibres motrices et sensitives.</li></ul></template>
<template data-pop="pareto-g99-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g99-s-histo-cours"></p><ul><li>Rouge Congo : biréfringence vert pomme.</li><li>Deux sites de biopsie si le premier est négatif.</li></ul></template>
<template data-pop="pareto-g99-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g99-s-physio-cours"></p><ul><li>Verticalisation : vasoconstriction sympathique défaillante.</li><li>Profil non-dipper : hypotension debout et hypertension couchée.</li></ul></template>
<template data-pop="pareto-g99-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g99-s-bioch-cours"></p><ul><li>Diabète : glycation et stress oxydatif.</li><li>TTR : pénétrance incomplète.</li><li>Potassium : mécanisme proposé de la neuropathie urémique.</li></ul></template>
<template data-pop="pareto-g99-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g99-p-1,g99-p-2,g99-p-3,g99-p-4"></p><ul><li>Midodrine : dernière dose ≥ 4 h avant le coucher.</li><li>Métoclopramide ≤ 5 jours ; dompéridone ≤ 1 semaine.</li><li>Fludrocortisone : hors indication pour l’hypotension orthostatique en Suisse.</li><li>Tafamidis : cardiomyopathie.</li></ul></template>
