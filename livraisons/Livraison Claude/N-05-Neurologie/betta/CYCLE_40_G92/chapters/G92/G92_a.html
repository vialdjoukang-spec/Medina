<p>Dans cette <b>vignette fictive</b>, une femme de 64 ans reçoit une perfusion de cellules CAR-T (axicabtagène ciloleucel) pour un lymphome à grandes cellules B. Au jour 2, elle a de la fièvre ; au jour 5, son écriture devient illisible et elle ne retrouve plus le nom d’un stylo. Son score <button class="w" data-k="g92-ice">ICE</button> est de 8 sur 10. Ces valeurs sont pédagogiques ; elles servent à poser trois questions : s’agit-il d’une neurotoxicité des cellules effectrices immunitaires (<button class="w" data-k="g92-icans">ICANS</button>), quel est son grade, et quelle décision en découle ?</p>
<p>Dans une seconde <b>vignette fictive</b>, un homme de 82 ans, dont le débit de filtration glomérulaire estimé est de 24 mL/min/1,73 m², reçoit du céfépime à dose standard pour une pneumonie. Au jour 3, il devient confus et présente des myoclonies. La question n’est plus la même : l’agent en cause est un antibiotique, et le geste décisif est d’en réviser la dose ou de l’arrêter.</p>
<p>Ces deux patients relèvent de la même catégorie, <b>G92 — Encéphalopathie toxique</b> : une atteinte cérébrale diffuse provoquée par un agent exogène. Le chapitre commence donc par ce socle commun, puis développe l’ICANS, qui est la forme la mieux documentée, et les encéphalopathies médicamenteuses décrites par l’information professionnelle suisse (céfépime, ifosfamide, valproate, métronidazole) ainsi que le méthotrexate.</p>
<p><b>Objectifs.</b> À la fin du chapitre, le lecteur sait définir l’encéphalopathie toxique, reconnaître les signes précoces de l’ICANS, attribuer un grade, exclure les diagnostics différentiels dangereux, choisir le traitement par grade, et identifier les médicaments qui exposent à une encéphalopathie en cas d’insuffisance rénale ou de surdosage.</p><div class="key"><b>À retenir.</b> Devant toute confusion récente, l’agent exogène se recherche en même temps que la cause infectieuse, vasculaire ou métabolique. Le médicament le plus récemment introduit ou dosé n’est pas le seul candidat, mais il est le premier à vérifier.</div>

</section>

<section class="ilot" id="g92-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Une <b>encéphalopathie toxique</b> est une atteinte diffuse de la fonction cérébrale provoquée par une substance exogène. Les encéphalopathies toxico-métaboliques constituent une cause importante d’encéphalopathie aiguë potentiellement réversible. Leurs signes sont souvent peu spécifiques et les dosages toxicologiques ne sont pas toujours disponibles ; l’imagerie oriente le diagnostic, la suite des examens et le pronostic.</p>
<p>La <b>CIM-10-GM 2024</b>, publiée par le BfArM, range cette entité sous <b>G92</b>, « Toxische Enzephalopathie », traduite par l’Office fédéral de la statistique en « Encéphalopathie toxique ». La catégorie comporte deux sous-codes : <b>G92.0</b>, « Encéphalopathie toxique sous immunothérapie », dont le texte d’inclusion cite le syndrome de neurotoxicité associé aux cellules effectrices immunitaires (ICANS), et <b>G92.9</b>, « Encéphalopathie toxique, autres et sans précision ». Aucune exclusion n’est listée sous G92 ; il n’existe ni cinquième position ni code G92.8 dans cette version.</p>
<p>Une note de codage demande d’ajouter, pour désigner l’agent toxique, un code du chapitre des causes externes. La catégorie voisine G93.4, « Encéphalopathie sans précision », exclut les encéphalopathies alcooliques (G31.2) et toxiques (G92.-). Le codage ne remplace pas le diagnostic : il suppose qu’un agent a été identifié ou soupçonné.</p>
<p>L’<b><button class="w" data-k="g92-icans">ICANS</button></b> est défini par consensus comme une affection du système nerveux central survenant après toute immunothérapie qui active ou engage des lymphocytes T endogènes ou perfusés, ou d’autres cellules effectrices immunitaires. Le terme remplace l’ancien « CRES » (encéphalopathie associée aux CAR-T) et s’applique aussi aux anticorps bispécifiques. Il est <b>classé en <button class="w" data-k="g92-grade">quatre grades</button></b> par le consensus de l’ASTCT, repris par les sources européennes.</p>
<p>Certains signes sont <b>exclus de la définition</b> parce qu’ils sont moins spécifiques, qu’ils reçoivent un traitement symptomatique et qu’ils ne déclenchent pas de corticoïdes : céphalées, tremblement, myoclonies, astérixis, hallucinations, faiblesse de déconditionnement, hémorragie intracrânienne liée à une coagulopathie.</p><div class="trap"><span class="k">Piège</span> Le code G92.0 décrit une toxicité de l’immunothérapie ; il ne couvre pas les encéphalopathies dues aux antibiotiques, aux antiépileptiques ou aux chimiothérapies, qui relèvent de G92.9. Le grade ICANS ne s’applique pas à ces dernières.</div>
<div class="key"><b>À retenir.</b> G92.0 est l’ICANS et ses équivalents après immunothérapie ; G92.9 regroupe toutes les autres encéphalopathies toxiques. L’agent se code séparément.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM), G92</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, grades du syndrome de relargage de cytokines et de la neurotoxicité</a> ; <a href="https://doi.org/10.1016/B978-0-323-99209-1.00006-5" target="_blank" rel="noopener">Bandeira et Lucato 2024, leucoencéphalopathies toxiques</a>.</p>
</section>

<section class="ilot" id="g92-2"><h2><span class="n">2</span>Fréquence et chronologie</h2>
<p>L’ICANS touche <b>20 à 60 % des receveurs de CAR-T</b>, et les formes de grade 3 ou plus concernent 3 à 30 % d’entre eux, selon le produit. Le tableau reprend les taux publiés dans les essais pivots selon la revue européenne de 2026 ; ces taux ne sont pas comparables d’un produit à l’autre, car les essais diffèrent par leur population et leur méthode.</p><table class="t"><thead><tr><th>Produit</th><th>ICANS, tous grades</th><th>Grade 3 ou plus</th></tr></thead><tbody><tr><td>Axicabtagène ciloleucel</td><td>64 %</td><td>28–32 %</td></tr><tr><td>Brexucabtagène autoleucel</td><td>69 %</td><td>31 %</td></tr><tr><td>Tisagenlecleucel</td><td>21–40 %</td><td>13 %</td></tr><tr><td>Lisocabtagène maraleucel</td><td>27–30 %</td><td>10 %</td></tr><tr><td>Obécabtagène autoleucel</td><td>22,8 %</td><td>7,1 %</td></tr><tr><td>Idécabtagène vicleucel</td><td>18 %</td><td>3 %</td></tr><tr><td>Ciltacabtagène autoleucel</td><td>23–26 %</td><td>10 %</td></tr><tr><td>Tabelecleucel (cellules spécifiques de virus)</td><td>aucun ICANS</td><td>—</td></tr></tbody></table>
<p>L’information professionnelle suisse de Yescarta rapporte des effets neurologiques chez <b>62 %</b> des patients (essais ZUMA-1 et ZUMA-7), de grade 3 ou plus chez 25 %. Soixante-quinze pour cent surviennent dans les sept premiers jours ; le délai médian est de 6 jours (extrêmes 1 à 133) et la durée médiane de 10 jours. Dans l’essai ZUMA-5, 56 % des patients sont atteints (grade 3 ou plus : 15 %). Les manifestations les plus fréquentes sont l’encéphalopathie (51 %), les céphalées (33 %), les tremblements (28 %), les vertiges (22 %) et le délire (13 %). Un état de mal épileptique a été signalé après commercialisation (0,3 %).</p>
<p>La <b>chronologie</b> guide la surveillance. Le délai moyen d’apparition est d’environ 5 jours après la perfusion. L’ICANS peut être concomitant du <button class="w" data-k="g92-crs">syndrome de relargage de cytokines (SRC)</button>, survenir après sa résolution ou apparaître tardivement ; environ 10 % des cas surviennent plus de trois semaines après le SRC. Les complications précoces se situent en général entre le jour 7 et le jour 30, l’ICANS tardif pouvant aller jusqu’à 6 à 8 semaines. Pour le lisocabtagène, le registre américain CIBMTR (877 patients) retrouve 95 % des ICANS dans les 15 premiers jours, avec une résolution médiane de 5,5 jours ; cette source est descriptive et ne fonde pas de recommandation.</p>
<p>Pour les <b>encéphalopathies médicamenteuses</b>, les données utiles viennent de séries de cas. Dans une revue de 73 cas de neurotoxicité du céfépime, 52 % des patients avaient 65 ans ou plus, l’apparition se situait surtout entre le jour 2 et le jour 5 (71 %) et la résolution survenait en un à cinq jours dans 85 % des cas ; la dose était rarement adaptée à la fonction rénale. Le niveau de preuve est faible. <b>Aucune donnée épidémiologique suisse sur G92 n’a été trouvée</b> dans les sources lues.</p><div class="key"><b>À retenir.</b> L’ICANS apparaît le plus souvent au cours de la première semaine, mais le risque ne s’éteint pas au jour 7 : la vigilance et l’information du patient se prolongent plusieurs semaines. L’encéphalopathie du céfépime survient en quelques jours et régresse rapidement à l’arrêt.</div>

<section class="ilot" id="g92-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 Socle commun</h3>
<p>Une substance exogène peut altérer le fonctionnement neuronal ou la substance blanche de façon transitoire ou permanente. Les leucoencéphalopathies toxiques ont des causes très variées (irradiation crânienne, chimiothérapie, antiépileptiques, drogues, toxiques environnementaux) et aucun tableau clinique typique. À l’<button class="w" data-k="g92-irm">IRM</button>, l’atteinte est bilatérale et symétrique de la substance blanche, avec un hypersignal en séquences T2 et FLAIR et une restriction de diffusion à la phase aiguë. La plupart des anomalies sont réversibles quand l’agent est reconnu et arrêté tôt.</p>
<h3>3.2 La cascade de l’ICANS</h3>
<p>Après la lymphodéplétion, les cellules CAR-T reconnaissent l’antigène tumoral, s’activent, prolifèrent et sécrètent des <button class="w" data-k="g92-cytokines">cytokines</button> : interleukine 6, interféron gamma, interleukine 1 et facteur de nécrose tumorale alpha. L’activation des macrophages amplifie la cascade, ce qui produit le SRC. L’inflammation active l’endothélium et augmente sa perméabilité, notamment par le facteur de croissance de l’endothélium vasculaire : la <button class="w" data-k="g92-bhe">barrière hémato-encéphalique</button>, qui sépare à l’état normal le sang du tissu cérébral, se rompt, ce qui permet le passage de cytokines et de cellules dans le liquide cérébrospinal. Dans les formes sévères, des CAR-T et des cytokines élevées y sont retrouvées.</p>
<p>Le pic des cytokines se situe entre le jour 7 et le jour 14 et suit l’expansion des CAR-T ; selon l’information professionnelle de Yescarta, les concentrations d’interleukines 6, 8, 10 et 15, de facteur de nécrose tumorale alpha, d’interféron gamma et du récepteur soluble de l’interleukine 2 alpha culminent dans les 14 premiers jours et reviennent à la valeur de base en 28 jours. Le rôle du glutamate et de l’acide quinolinique, agonistes du récepteur NMDA élevés dans le liquide cérébrospinal, est discuté.</p><figure><svg viewBox="0 0 640 300" role="img" aria-label="Figure 1 — Cascade de l’ICANS. Schéma didactique : de l’activation des cellules CAR-T à la rupture de la barrière hémato-encéphalique." font-size="14"><defs><marker id="g92-ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="20" width="170" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="105.0" y="44.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">Cellules CAR-T</text><text x="105.0" y="60.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">reconnaissent la cible</text><path d="M190 48L225 48" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#g92-ar1)"/><rect x="225" y="20" width="190" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320.0" y="36.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">Cytokines : interleukine 6,</text><text x="320.0" y="52.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">interféron gamma, facteur de</text><text x="320.0" y="68.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">nécrose tumorale alpha</text><path d="M415 48L450 48" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#g92-ar1)"/><rect x="450" y="20" width="170" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="535.0" y="44.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">Activation des</text><text x="535.0" y="60.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">macrophages</text><path d="M535 76L535 112" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#g92-ar1)"/><rect x="450" y="112" width="170" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="535.0" y="136.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">Endothélium actif,</text><text x="535.0" y="152.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">perméabilité accrue</text><path d="M450 140L415 140" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#g92-ar1)"/><rect x="225" y="112" width="190" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320.0" y="136.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">Rupture de la barrière</text><text x="320.0" y="152.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">hémato-encéphalique</text><path d="M320 168L320 204" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#g92-ar1)"/><rect x="150" y="204" width="340" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320.0" y="228.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">Cytokines et cellules dans le liquide</text><text x="320.0" y="244.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">cérébrospinal : ICANS</text></svg><figcaption>Figure 1 — Cascade de l’ICANS. Schéma didactique : de l’activation des cellules CAR-T à la rupture de la barrière hémato-encéphalique.</figcaption></figure>
<p>Un point thérapeutique découle de cette chaîne. Le tocilizumab bloque le récepteur de l’interleukine 6 et traite le SRC ; or ce blocage élève l’interleukine 6 circulante, qui peut franchir la barrière hémato-encéphalique. Un tocilizumab prophylactique n’est donc pas recommandé en routine, car il a été associé à un ICANS plus fréquent ou plus sévère.</p>
<h3>3.3 Mécanismes médicamenteux documentés</h3>
<p><b>Valproate.</b> L’information professionnelle de Depakine indique que le valproate peut abaisser la carnitine tissulaire et plasmatique, perturber la bêta-oxydation et le cycle de l’urée, et provoquer une hyperammoniémie pouvant conduire à une encéphalopathie hyperammoniémique. Un déficit du cycle de l’urée est une contre-indication ; le topiramate et l’acétazolamide associés aggravent le risque.</p>
<p><b>Céfépime, ifosfamide, métronidazole, méthotrexate.</b> Les sources lues décrivent les circonstances de survenue (surdosage, insuffisance rénale, dose cumulée, délai) mais non le mécanisme moléculaire de l’atteinte neuronale ; ce mécanisme n’est donc pas développé ici. Pour le céfépime, l’adaptation de la dose à la clairance de la créatinine et l’élimination par hémodialyse (environ 68 % en trois heures) indiquent une élimination rénale : une baisse de la fonction rénale expose à l’accumulation du produit en cas de dose inchangée. Il s’agit d’un raisonnement déduit de ces deux données, non d’une affirmation de la source.</p>
<p>Chez les patients en réanimation avec COVID-19 grave, l’encéphalopathie aiguë est associée à l’hypoxémie, aux désordres toxiques et métaboliques et à l’inflammation systémique : plusieurs mécanismes s’additionnent, ce qui impose un bilan multimodal.</p><div class="key"><b>Corrélation clinique.</b> L’inflammation cytokinique explique le calendrier de l’ICANS (début vers le jour 5, pic des cytokines aux jours 7 à 14) et la prudence vis-à-vis du tocilizumab prophylactique. Le métabolisme du valproate explique la mesure de l’ammoniémie devant une confusion sous ce traitement.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://amiko.oddb.org (GTIN 7680669860011)" target="_blank" rel="noopener">Information professionnelle suisse Yescarta</a> ; <a href="https://doi.org/10.1016/B978-0-323-99209-1.00006-5" target="_blank" rel="noopener">Bandeira et Lucato 2024, leucoencéphalopathies toxiques</a> ; <a href="https://doi.org/10.1053/j.sult.2013.09.005" target="_blank" rel="noopener">Rimkus et coll., leucoencéphalopathies toxiques</a> ; <a href="https://doi.org/10.1097/MCC.0000000000001029" target="_blank" rel="noopener">Sonneville et coll., complications neurologiques de la COVID-19 grave</a> ; <a href="https://amiko.oddb.org (GTIN 7680700080019)" target="_blank" rel="noopener">Information professionnelle suisse Cefepim Leman</a> ; <a href="https://amiko.oddb.org (GTIN 7680347340125)" target="_blank" rel="noopener">Information professionnelle suisse Depakine</a>.</p>
</section>

<section class="ilot" id="g92-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Le tableau regroupe les agents documentés par les sources lues. La liste n’est pas exhaustive : les solvants, le monoxyde de carbone, le lithium et les métaux lourds ne sont pas traités ici, faute de source lue.</p><table class="t"><thead><tr><th>Agent</th><th>Contexte ou facteurs de risque</th><th>Remarque</th></tr></thead><tbody><tr><td>Cellules CAR-T (ICANS)</td><td>Forte masse tumorale, lymphodéplétion par fludarabine et cyclophosphamide, marqueurs inflammatoires élevés avant traitement, nombreuses lignes antérieures, antécédents du système nerveux central (convulsions, ischémie)</td><td>Œdème cérébral grave : masse médiastinale ou syndrome cave supérieur (information professionnelle de Yescarta)</td></tr><tr><td>Céfépime</td><td>Débit de filtration glomérulaire estimé inférieur à 30 mL/min/1,73 m² (rapport de cotes 10,06), âge, anomalies du système nerveux central, faible albumine, diabète, hypertension, maladie pulmonaire chronique, dose non adaptée</td><td>Perfusion continue associée à un rapport de cotes plus bas</td></tr><tr><td>Ifosfamide</td><td>Hypoalbuminémie, atteinte rénale, mauvais état général, maladie pelvienne, traitement néphrotoxique dont le cisplatine</td><td>Toxicité dose-dépendante</td></tr><tr><td>Valproate</td><td>Déficit du cycle de l’urée, association au topiramate ou à l’acétazolamide, maladies mitochondriales (mutations POLG)</td><td>Hyperammoniémie</td></tr><tr><td>Métronidazole</td><td>Troubles préexistants du système nerveux central ou périphérique, insuffisance hépatique sévère</td><td>Effets très rares</td></tr><tr><td>Méthotrexate</td><td>Prédisposition génétique, interactions, insuffisance rénale, radiothérapie concomitante</td><td>Délai de quelques heures à plusieurs années</td></tr><tr><td>Autres</td><td>Irradiation crânienne, chimiothérapie, antiépileptiques, drogues, toxiques environnementaux</td><td>Leucoencéphalopathies toxiques</td></tr></tbody></table>
<p>Le point commun de nombreuses encéphalopathies médicamenteuses est la <b>diminution de la fonction rénale</b> : elle augmente le risque pour le céfépime et pour l’ifosfamide. Le médecin calcule donc la fonction rénale avant de prescrire ces agents, puis la suit pendant le traitement.</p><div class="trap"><span class="k">Erreur fréquente</span> Attribuer la confusion d’un patient sous antibiotique à une infection du système nerveux central ou à son âge, sans vérifier que la dose du céfépime est adaptée à la clairance de la créatinine.</div>
<button class="pareto-btn ui" data-k="pareto-g92-mecanismes">▲ Loi de Pareto — Mécanismes et causes</button>

<section class="ilot" id="g92-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord <b>l’exposition</b>, ensuite la chronologie. Il se fait auprès du patient quand il est capable de répondre, et auprès de l’entourage ou du dossier de soins sinon, car le patient confus ne peut pas décrire lui-même ses symptômes.</p>
<ul><li><b>Immunothérapie cellulaire.</b> Date de la perfusion de cellules CAR-T, produit utilisé, survenue et date d’une fièvre ou d’un SRC, traitements du SRC déjà reçus, antécédents de convulsions ou d’ischémie cérébrale.</li>
<li><b>Médicaments.</b> Céfépime, ifosfamide, valproate, métronidazole, méthotrexate, mais aussi dépresseurs du système nerveux central (antiémétiques, sédatifs, opioïdes, antihistaminiques) et alcool ; dose, voie, durée, date de début et d’éventuelles modifications récentes.</li>
<li><b>Fonction rénale et hépatique</b> au moment du début des symptômes, état d’hydratation, poids et albumine.</li>
<li><b>Autres expositions</b> : irradiation crânienne, chimiothérapie antérieure, drogues, toxiques environnementaux.</li></ul>
<p>Les symptômes se classent par fréquence. Dans l’information professionnelle de Yescarta, l’encéphalopathie vient en premier (51 %), puis les céphalées (33 %), les tremblements (28 %), les vertiges (22 %) et le délire (13 %). Les signes précoces de l’ICANS sont plus discrets : tremblement, <b><button class="w" data-k="g92-ecriture">dysgraphie</button></b>, difficulté à nommer des objets, troubles de l’attention, apraxie et léthargie légère. La détérioration de l’écriture est un signe d’alerte précoce. Une <b>aphasie expressive</b> est très spécifique : elle a été observée chez 19 des 22 patients atteints de neurotoxicité sévère dans un essai ; elle peut progresser vers une aphasie globale, le patient restant éveillé mais mutique et akinétique.</p><div class="two"><div class="card"><h4>Forme typique : ICANS précoce</h4><p>Début vers le jour 5 après la perfusion, souvent après une fièvre ; troubles de l’écriture et de la dénomination, puis aphasie, somnolence, crises dans les formes sévères.</p></div><div class="card"><h4>Formes atypiques</h4><p>Début tardif (plus de trois semaines après le SRC), œdème cérébral fulminant sans signe avant-coureur, présentation de l’enfant par irritabilité, comportement anormal ou régression.</p></div></div>
<div class="two"><div class="card"><h4>Encéphalopathie du céfépime</h4><p>Troubles de conscience avec confusion, hallucinations, stupeur, délire, coma ; myoclonies, convulsions, état de mal non convulsif. Début surtout aux jours 2 à 5.</p></div><div class="card"><h4>Encéphalopathie à l’ifosfamide</h4><p>Dans les heures ou les jours après l’administration : confusion, somnolence, coma, hallucinations, vision trouble, réaction psychotique, trouble extrapyramidal, incontinence urinaire, convulsions.</p></div></div>
<div class="trap"><span class="k">Piège</span> Une céphalée isolée n’est pas un marqueur utile d’ICANS ; elle ne justifie pas à elle seule le classement ni les corticoïdes. La recherche porte sur la parole, l’écriture et l’attention.</div>
<div class="key"><b>À retenir.</b> Le dossier de soins fournit la date de perfusion, la dose et la fonction rénale ; ces trois éléments valent plus qu’un interrogatoire d’un patient confus.</div>

</section>

<section class="ilot" id="g92-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, constantes, puis signes ciblés. Chez un patient traité par cellules CAR-T, la <b>température</b> est notée car l’ICANS peut être concomitant d’un SRC ; la pression artérielle et la fréquence cardiaque aident à reconnaître une hypertension intracrânienne.</p>
<div class="two"><div class="card"><h4>Fonctions supérieures</h4><ul><li><b><button class="w" data-k="g92-ice">Score ICE</button></b> : cinq domaines — orientation, dénomination, exécution d’ordres, écriture, attention — sur dix points (<button class="w" data-k="g92-mnemo">moyen mnémotechnique</button>).</li><li><b>Écriture</b> : demander d’écrire une phrase ; la dégradation est précoce.</li><li><b>Langage</b> : aphasie expressive, réceptive ou globale.</li><li><b>Vigilance</b> : éveil spontané, à la voix, au seul stimulus tactile, stupeur ou coma.</li></ul></div><div class="card"><h4>Signes neurologiques focaux et de gravité</h4><ul><li><b>Motricité</b> : déficit moteur profond (hémiparésie, paraparésie) en grade 4.</li><li><b>Crises</b> : crise clinique brève, crise de plus de cinq minutes, crises répétées.</li><li><b>Hypertension intracrânienne</b> : œdème papillaire au fond d’œil, paralysie du nerf crânien VI, triade de Cushing, posture de décérébration ou de décortication.</li><li><b>Signes non spécifiques</b> : tremblement, myoclonies, astérixis, qui ne font pas le grade.</li></ul></div></div>
<p>Le grade se détermine par le <b>paramètre le plus sévère</b> : un patient avec un score ICE de 8 (grade 1) mais une crise clinique est classé au moins en grade 3. L’examen est répété car l’état évolue en quelques heures : le dépistage par le score ICE est recommandé toutes les 8 à 12 heures en phase aiguë.</p><div class="trap"><span class="k">Piège</span> Un patient éveillé, mutique et ne répondant ni verbalement ni physiquement ne doit pas être considéré comme éveillé et en bon état : c’est le tableau distinctif d’une aphasie globale, et le score ICE est alors très bas ou non évaluable.</div>
<div class="key"><b>À retenir.</b> Le score ICE, la vigilance, les crises, la motricité et les signes d’hypertension intracrânienne fixent le grade. Le fond d’œil et les nerfs crâniens se recherchent devant toute suspicion d’œdème cérébral.</div>
