<template data-pop="g92-icans" data-title="ICANS : définition consensuelle">
<div class="lab">Définition</div><p>L’ICANS (neurotoxicité associée aux cellules effectrices immunitaires) est une affection caractérisée par un processus pathologique touchant le système nerveux central après toute immunothérapie qui active ou engage des lymphocytes T endogènes ou perfusés, ou d’autres cellules effectrices immunitaires. Les signes possibles sont l’aphasie, l’altération de la conscience, les troubles cognitifs, la faiblesse motrice, les convulsions et l’œdème cérébral.</p>
<div class="lab">Exclusions</div><p>Céphalées, tremblement, myoclonies, astérixis, hallucinations, faiblesse de déconditionnement et hémorragie intracrânienne liée à une coagulopathie ne définissent pas l’ICANS : ils reçoivent un traitement symptomatique.</p>
<div class="lab">Limite</div><p>Le consensus de l’ASTCT est une source internationale de classement ; il ne constitue pas une recommandation suisse de conduite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, grades du syndrome de relargage de cytokines et de la neurotoxicité</a>.</p>
</template>
<template data-pop="g92-ice" data-title="Score ICE">
<div class="lab">Définition</div><p>Le score ICE (Immune effector Cell-associated Encephalopathy) est un outil de dépistage sur 10 points dérivé du CARTOX-10, avec un item de compréhension. Cinq domaines sont explorés : orientation, dénomination, exécution d’ordres, écriture, attention.</p>
<div class="lab">Application</div><p>Il est réalisé toutes les 8 à 12 heures en phase aiguë. Les seuils de grade sont : 7 à 9 = grade 1, 3 à 6 = grade 2, 0 à 2 = grade 3, 0 non évaluable = grade 4.</p>
<div class="lab">Limite</div><p>Le barème des points par item n’a pas été lu dans une source accessible. Le score est inadapté chez l’enfant de moins de 12 ans.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, grades du syndrome de relargage de cytokines et de la neurotoxicité</a>.</p>
</template>
<template data-pop="g92-grade" data-title="Grade de l’ICANS">
<div class="lab">Principe</div><p>Le grade est fixé par le paramètre le plus sévère.</p>
<table class="t"><thead><tr><th>Grade</th><th>ICE</th><th>Conscience</th><th>Crises</th><th>Motricité</th><th>Œdème</th></tr></thead><tbody><tr><td>1</td><td>7–9</td><td>éveil spontané</td><td>—</td><td>—</td><td>—</td></tr><tr><td>2</td><td>3–6</td><td>éveil à la voix</td><td>—</td><td>—</td><td>—</td></tr><tr><td>3</td><td>0–2</td><td>éveil au seul stimulus tactile</td><td>crise clinique brève ou crise EEG résolutive</td><td>—</td><td>œdème focal à l’imagerie</td></tr><tr><td>4</td><td>0 (non évaluable)</td><td>stupeur ou coma</td><td>crise de plus de 5 minutes ou crises répétées</td><td>déficit moteur profond</td><td>œdème diffus, posture, paralysie du nerf VI, œdème papillaire, triade de Cushing</td></tr></tbody></table>
<div class="lab">Limite</div><p>Outil de classement international, non recommandation de conduite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, grades du syndrome de relargage de cytokines et de la neurotoxicité</a>.</p>
</template>
<template data-pop="g92-crs" data-title="Syndrome de relargage de cytokines">
<div class="lab">Définition</div><p>Le SRC est la cascade inflammatoire déclenchée par l’activation des CAR-T et des macrophages. Il peut précéder, accompagner ou suivre l’ICANS.</p>
<div class="lab">Traitement</div><p>Le tocilizumab traite le SRC : 8 mg/kg (30 kg ou plus) ou 12 mg/kg (moins de 30 kg) par voie intraveineuse sur 60 minutes, jusqu’à 3 doses supplémentaires, intervalle d’au moins 8 heures, au plus 800 mg par perfusion.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://amiko.oddb.org (GTIN 7680588680011)" target="_blank" rel="noopener">Information professionnelle suisse Actemra</a>.</p>
</template>
<template data-pop="g92-cytokines" data-title="Cytokines de l’ICANS">
<div class="lab">Mécanisme</div><p>Après lymphodéplétion, les CAR-T sécrètent l’interleukine 6, l’interféron gamma, l’interleukine 1 et le facteur de nécrose tumorale alpha. Les concentrations culminent dans les 14 premiers jours et reviennent à la base en 28 jours selon l’information professionnelle de Yescarta.</p>
<div class="lab">Conséquence</div><p>Une forte inflammation active l’endothélium et rend la barrière hémato-encéphalique perméable.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://amiko.oddb.org (GTIN 7680669860011)" target="_blank" rel="noopener">Information professionnelle suisse Yescarta</a>.</p>
</template>
<template data-pop="g92-bhe" data-title="Barrière hémato-encéphalique">
<div class="lab">Principe</div><p>À l’état normal, cette barrière sépare le sang du tissu cérébral. L’inflammation et le facteur de croissance de l’endothélium vasculaire augmentent la perméabilité endothéliale.</p>
<div class="lab">Conséquence clinique</div><p>Des cytokines élevées et des CAR-T sont retrouvées dans le liquide cérébrospinal dans les formes sévères ; l’interleukine 6 augmentée par le tocilizumab peut franchir la barrière.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a>.</p>
</template>
<template data-pop="g92-irm" data-title="IRM des leucoencéphalopathies toxiques">
<div class="lab">Aspect</div><p>Atteinte bilatérale et symétrique de la substance blanche, hypersignal T2 et FLAIR, restriction de diffusion à la phase aiguë ; d’autres zones à haut métabolisme peuvent être touchées.</p>
<div class="lab">Pronostic</div><p>La plupart des anomalies sont réversibles quand l’agent est reconnu tôt.</p>
<div class="lab">Différentiel</div><p>Maladies démyélinisantes, leucodystrophies, encéphalopathie hépatique, maladie vasculaire, états hypoxo-ischémiques.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/B978-0-323-99209-1.00006-5" target="_blank" rel="noopener">Bandeira et Lucato 2024, leucoencéphalopathies toxiques</a> ; <a href="https://doi.org/10.1053/j.sult.2013.09.005" target="_blank" rel="noopener">Rimkus et coll., leucoencéphalopathies toxiques</a>.</p>
</template>
<template data-pop="g92-ecriture" data-title="Dysgraphie et signes précoces">
<div class="lab">Signes</div><p>Tremblement, dysgraphie, difficulté de dénomination, troubles de l’attention, apraxie, léthargie légère.</p>
<div class="lab">Intérêt</div><p>La détérioration de l’écriture est un signe d’alerte précoce ; l’aphasie expressive est très spécifique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, grades du syndrome de relargage de cytokines et de la neurotoxicité</a>.</p>
</template>
<template data-pop="g92-lemp" data-title="Leucoencéphalopathie multifocale progressive">
<div class="lab">Rôle</div><p>Cette infection opportuniste du système nerveux central, avec l’infection par HHV-6, est à évoquer devant tout événement neurologique après CAR-T.</p>
<div class="lab">Limite</div><p>Les sources lues ne détaillent pas son diagnostic.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://amiko.oddb.org (GTIN 7680669860011)" target="_blank" rel="noopener">Information professionnelle suisse Yescarta</a>.</p>
</template>
<template data-pop="g92-eeg" data-title="Électroencéphalogramme dans l’ICANS">
<div class="lab">Indication</div><p>Pour tout ICANS de grade 2 ou plus, afin de détecter des crises non convulsives. Une crise EEG résolutive sous traitement correspond au grade 3.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, grades du syndrome de relargage de cytokines et de la neurotoxicité</a>.</p>
</template>
<template data-pop="g92-oedeme" data-title="Œdème cérébral de l’ICANS">
<div class="lab">Définition</div><p>Œdème diffus rare, parfois fulminant et sans signes avant-coureurs.</p>
<div class="lab">Signes</div><p>Œdème papillaire, paralysie du nerf crânien VI, triade de Cushing, posture de décérébration ou de décortication.</p>
<div class="lab">Traitement</div><p>Tête surélevée, hyperventilation, osmothérapie (mannitol ou solution saline hypertonique), avec neurologie et réanimation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, grades du syndrome de relargage de cytokines et de la neurotoxicité</a>.</p>
</template>
<template data-pop="g92-mnemo" data-title="Moyen mnémotechnique : cinq domaines du score ICE">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Les cinq domaines forment les initiales O-D-E-E-A : Orientation, Dénomination, Exécution d’ordres, Écriture, Attention.</p>

</template>
