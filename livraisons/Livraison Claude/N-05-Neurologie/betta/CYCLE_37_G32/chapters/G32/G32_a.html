<section class="ilot" id="g32-0"><h2><span class="n">0</span>Question clinique</h2>
<p data-evidence="G32-C0001">Un jeune adulte consulte pour des fourmillements des pieds et une marche devenue instable. Il ne présente ni anémie ni baisse nette de la vitamine B12 sanguine. Un cas publié en Suisse romande en 2026 correspond exactement à cette situation : un homme de 27 ans, consommateur régulier de <button class="w" data-k="g32-n2o">protoxyde d’azote</button>, dont la sensibilité profonde était très altérée aux orteils et aux chevilles, avec un signe de Romberg positif.</p>
<p data-evidence="G32-C0002">La question de cette leçon est donc précise : devant des paresthésies distales et une ataxie sensitive subaiguës, comment reconnaître une <button class="w" data-k="g32-dcs">dégénérescence combinée subaiguë de la moelle</button> (<button class="w" data-k="g32-dcs">DCS</button>) liée à un déficit fonctionnel en vitamine B12, et pourquoi le dosage de la B12 sérique ne suffit-il pas ? La réponse passe par l’<button class="w" data-k="g32-amm">acide méthylmalonique</button> (<button class="w" data-k="g32-amm">AMM</button>) et l’<button class="w" data-k="g32-hcy">homocystéine</button>, deux molécules qui s’accumulent lorsque la vitamine ne remplit plus son rôle.</p>
<p data-evidence="G32-C0003">Le code G32 se place à l’arrière-plan de ce raisonnement. Il porte un astérisque : il décrit la manifestation neurologique d’une maladie déjà codée ailleurs, et ne s’emploie jamais seul (<button class="w" data-k="g32-cim">logique † et *</button>).</p>
<div class="key" data-evidence="G32-C0004"><b>À retenir.</b> Le raisonnement tient en trois temps : reconnaître le syndrome cordonal postérieur, prouver le déficit fonctionnel par l’AMM et l’homocystéine, puis traiter vite et durablement en supprimant la cause.</div>
</section>
<section class="ilot" id="g32-1"><h2><span class="n">1</span>Définition et logique de codage</h2>
<p data-evidence="G32-C0005">Dans la classification suisse (CIM-10-GM 2024), la catégorie G32 regroupe les « autres affections dégénératives du système nerveux au cours de maladies classées ailleurs ». Ses deux sous-codes portent le marqueur astérisque (*). Selon la logique du double codage, la maladie causale reçoit un code à croix (†) et sa manifestation neurologique un code à astérisque ; l’astérisque n’est jamais employé seul (<button class="w" data-k="g32-cim">détail du double codage</button>).</p>
<table class="t"><thead><tr><th>Code</th><th>Intitulé</th><th>Code causal listé</th><th>Observation</th></tr></thead><tbody><tr><td data-evidence="G32-C0006">G32.0*</td><td data-evidence="G32-C0007">Dégénérescence combinée subaiguë de la moelle épinière au cours de maladies classées ailleurs</td><td data-evidence="G32-C0008">E53.8† (carence en vitamine B12)</td><td data-evidence="G32-C0009">Inclusion : dégénérescence combinée subaiguë de la moelle lors de carence en vitamine B12</td></tr><tr><td data-evidence="G32-C0010">G32.8*</td><td data-evidence="G32-C0011">Autres affections dégénératives précisées du système nerveux au cours de maladies classées ailleurs</td><td data-evidence="G32-C0012">Aucun</td><td data-evidence="G32-C0013">Aucune inclusion, aucune exclusion et aucun code † ne sont listés</td></tr></tbody></table>
<p data-evidence="G32-C0014">Le tableau montre que seul G32.0* dispose d’un contenu clinique défini. Le dossier de recherche n’a trouvé aucune source clinique rattachée à G32.8* : cette leçon ne lui consacre donc qu’une définition de code, sans description inventée (<button class="w" data-k="g32-lacunes">limites des sources</button>).</p>
<p data-evidence="G32-C0015">La <button class="w" data-k="g32-dcs">DCS</button> est une démyélinisation des cordons postérieurs et latéraux de la moelle, surtout cervicale, liée à un déficit fonctionnel en vitamine B12. L’adjectif « fonctionnel » signifie que la vitamine peut être présente dans le sang mais rendue inutilisable : c’est le cas du protoxyde d’azote, qui inactive la cobalamine alors que les réserves peuvent rester normales.</p>
<div class="trap" data-evidence="G32-C0016"><span class="k">Piège</span> Le dossier ne permet pas de choisir un code causal † pour une myélopathie provoquée par le protoxyde d’azote : seul E53.8† est listé sous G32.0*. Ne pas déduire de règle de codage au-delà de ce que la classification imprime.</div>
</section>
<section class="ilot" id="g32-2"><h2><span class="n">2</span>Classification</h2>
<p data-evidence="G32-C0017">Les causes de carence se classent par mécanisme, car chacune oriente le traitement et le pronostic. Le tableau suivant reprend l’ensemble des catégories retrouvées dans les sources lues.</p>
<table class="t"><thead><tr><th>Axe</th><th>Catégories</th></tr></thead><tbody><tr><td data-evidence="G32-C0018">Cause de la carence</td><td data-evidence="G32-C0019">Auto-immune (anémie pernicieuse, gastrite atrophique) ; médicamenteuse (metformine, inhibiteurs de la pompe à protons, anti-H2, antiacides) ; chirurgie gastrique ou bariatrique ; régime végétarien ou végan ; maladie cœliaque ; âge ; protoxyde d’azote ; génétique rare (syndrome d’Imerslund-Gräsbeck, mutations du facteur intrinsèque ou de la transcobalamine, variant MTHFR C677T) ; résection gastrique, sprue tropicale et non tropicale</td></tr><tr><td data-evidence="G32-C0020">Topographie neurologique</td><td data-evidence="G32-C0021">Myélopathie cordonale postérieure, avec ou sans atteinte latérale ; neuropathie périphérique ; atteinte cognitive ou psychiatrique</td></tr><tr><td data-evidence="G32-C0022">Profil électrophysiologique de la neuropathie au protoxyde d’azote (n = 15)</td><td data-evidence="G32-C0023">Axonal 20 % ; démyélinisant 13,3 % ; mixte 66 %</td></tr></tbody></table>
<p data-evidence="G32-C0024">Ces trois axes se combinent chez un même patient. La même carence peut donc s’exprimer par une myélopathie, une neuropathie ou des troubles cognitifs, et le <button class="w" data-k="g32-diffmyelo">diagnostic différentiel</button> doit rester ouvert tant que le déficit fonctionnel n’est pas prouvé.</p>
</section>
<section class="ilot" id="g32-3"><h2><span class="n">3</span>Fréquence</h2>
<p data-evidence="G32-C0025">Le point le plus important de l’épidémiologie est négatif : l’anémie ne prédit pas l’atteinte neurologique. Moins de 20 % des personnes dont la vitamine B12 est basse ont une anémie macrocytaire, et Lindenbaum a décrit 40 patients neurologiques ou psychiatriques sans anémie ni macrocytose. Un hémogramme normal n’écarte donc pas la carence.</p>
<table class="t"><thead><tr><th>Population</th><th>Donnée</th><th>Source</th></tr></thead><tbody><tr><td data-evidence="G32-C0026">Après chirurgie bariatrique</td><td data-evidence="G32-C0027">Incidence de carence de 60 % dans une étude néerlandaise</td><td data-evidence="G32-C0028">Revue néerlandaise</td></tr><tr><td data-evidence="G32-C0029">Suisse, consommation de protoxyde d’azote</td><td data-evidence="G32-C0030">Consommation déclarée sur 30 jours de 5 % (2022) à 8 % (2023) ; prévalence sur 12 mois de 13 % à 11 % (données Infodrog citées de seconde main)</td><td data-evidence="G32-C0031">Cas suisse</td></tr><tr><td data-evidence="G32-C0032">Suisse, expérience hospitalière</td><td data-evidence="G32-C0033">Aucun cas antérieur à l’hôpital Riviera-Chablais ; un seul cas comparable en 20 ans au CHUV</td><td data-evidence="G32-C0034">Cas suisse</td></tr><tr><td data-evidence="G32-C0035">Allemagne, 2020–2024</td><td data-evidence="G32-C0036">23 cas dans 5 services de neurologie ; âge moyen 24,9 ans ; deux tiers d’hommes ; augmentation au fil des ans</td><td data-evidence="G32-C0037">Série allemande</td></tr><tr><td data-evidence="G32-C0038">Adolescents de 14 à 18 ans</td><td data-evidence="G32-C0039">59 cas (2011–2026)</td><td data-evidence="G32-C0040">Série pédiatrique</td></tr></tbody></table>
<p data-evidence="G32-C0041">La rareté hospitalière suisse contraste avec la hausse de consommation déclarée : un clinicien qui n’a jamais vu le tableau peut donc le manquer. Aucune épidémiologie suisse globale de la carence en vitamine B12 n’a été trouvée ; elle n’est pas estimée ici (<button class="w" data-k="g32-epid">limites des chiffres</button>).</p>
<button class="pareto-btn ui" data-k="pareto-g32-code">▲ Loi de Pareto — Définition, codage, fréquence</button>
</section>
<section class="ilot" id="g32-4"><h2><span class="n">4</span>Physiopathologie</h2>
<p data-evidence="G32-C0042">À l’état normal, la vitamine B12 est le cofacteur de deux enzymes. La méthylmalonyl-coenzyme A mutase transforme le méthylmalonyl-CoA en succinyl-CoA ; la méthionine synthase transforme l’homocystéine en méthionine (<button class="w" data-k="g32-enzymes">les deux voies enzymatiques</button>). La forme active dans le plasma est la holotranscobalamine. Le besoin quotidien est d’environ 1 à 2 µg, le stock corporel de 2 à 5 mg dont environ 1 mg dans le foie : sans apport, les réserves s’épuisent en trois à cinq ans.</p>
<p data-evidence="G32-C0043">Lorsque la vitamine fait défaut, chaque enzyme s’arrête et son substrat s’accumule. L’AMM s’élève parce que la mutase ne le consomme plus ; l’homocystéine s’élève parce que la méthionine synthase ne la transforme plus. Ces deux élévations sont les témoins biologiques du déficit, même quand la B12 sérique paraît normale (<button class="w" data-k="g32-amm">lecture de l’AMM</button>, <button class="w" data-k="g32-hcy">lecture de l’homocystéine</button>).</p>
<p data-evidence="G32-C0044">La lésion neurologique découle du second blocage. Le manque de méthionine et de S-adénosylméthionine perturbe la méthylation des phospholipides de la myéline : la gaine se démyélinise dans les cordons postérieurs et latéraux, surtout au niveau cervical. Cette topographie correspond à la clinique décrite : atteinte de la pallesthésie et du sens de position, ataxie sensitive et signe de Romberg, avec une composante pyramidale possible.</p>
<figure data-evidence="G32-C0045"><svg viewBox="0 0 400 250" role="img" aria-label="Figure 1 — De la cobalamine à la démyélinisation" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="110" y="10" width="180" height="36" rx="5"/><path d="M150 46v26m-4-5l4 5 4-5M250 46v26m-4-5l4 5 4-5"/><rect x="20" y="72" width="170" height="44" rx="5"/><rect x="210" y="72" width="170" height="44" rx="5"/><path d="M105 116v22m-4-5l4 5 4-5M295 116v22m-4-5l4 5 4-5"/><rect x="20" y="138" width="170" height="40" rx="5"/><rect x="210" y="138" width="170" height="40" rx="5"/><path d="M295 178v22m-4-5l4 5 4-5"/><rect x="210" y="200" width="170" height="40" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="200" y="33">Cobalamine active</text><text x="105" y="92">Méthylmalonyl-CoA</text><text x="105" y="108">mutase</text><text x="295" y="92">Méthionine</text><text x="295" y="108">synthase</text><text x="105" y="163">AMM élevé</text><text x="295" y="163">Homocystéine élevée</text><text x="295" y="225">Démyélinisation</text></g></svg><figcaption>Figure 1 — Une cobalamine inactive bloque deux enzymes. Les deux substrats s’accumulent ; le blocage de la méthionine synthase est relié à la démyélinisation cordonale (cas publié, Cureus 2026).</figcaption></figure>
<p data-evidence="G32-C0046">Le <button class="w" data-k="g32-n2o">protoxyde d’azote</button> reproduit ce déficit sans carence d’apport : il oxyde l’ion cobalt de la cobalamine et inactive ainsi les deux enzymes. Des contributions du stress oxydatif et de l’excitotoxicité liée au récepteur NMDA sont évoquées. L’information professionnelle suisse de l’hydroxocobalamine précise que l’exposition prolongée peut induire une carence fonctionnelle et des effets neurologiques graves, même si les réserves en vitamine B12 sont normales. D’où la conséquence pratique : un dosage de B12 normal ne protège pas un consommateur de protoxyde d’azote.</p>
<p data-evidence="G32-C0047">L’hyperhomocystéinémie expose enfin à des événements thrombotiques, notamment la thrombose veineuse profonde et l’embolie pulmonaire (<button class="w" data-k="g32-thrombose">complications thrombotiques</button>).</p>
<div class="trap" data-evidence="G32-C0048"><span class="k">Piège</span> La physiologie de l’absorption de la vitamine B12 (haptocorrine, facteur intrinsèque, iléon terminal) n’a pas été lue dans une source du dossier. Elle n’est pas développée ici : <button class="w" data-k="g32-absorption">pourquoi</button>.</div>
<button class="pareto-btn ui" data-k="pareto-g32-mecanismes">▲ Loi de Pareto — Physiopathologie</button>
</section>
<section class="ilot" id="g32-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-evidence="G32-C0049">L’interrogatoire cherche d’abord le symptôme sensitif, puis la cause. Dans la série allemande de patients exposés au protoxyde d’azote (n = 23), les fréquences étaient les suivantes.</p>
<table class="t"><thead><tr><th>Signe rapporté ou constaté</th><th>Fréquence</th></tr></thead><tbody><tr><td data-evidence="G32-C0050">Paresthésies ou hypoesthésie</td><td data-evidence="G32-C0051">95,7 %</td></tr><tr><td data-evidence="G32-C0052">Ataxie ou trouble de la marche</td><td data-evidence="G32-C0053">82,6 %</td></tr><tr><td data-evidence="G32-C0054">Parésie</td><td data-evidence="G32-C0055">52,2 %</td></tr><tr><td data-evidence="G32-C0056">Dysautonomie</td><td data-evidence="G32-C0057">13 %</td></tr><tr><td data-evidence="G32-C0058">Autres signes (dont signe de Lhermitte et spasticité)</td><td data-evidence="G32-C0059">30 %</td></tr></tbody></table>
<p data-evidence="G32-C0060">Les paresthésies dominent donc, suivies de l’instabilité. Une parésie est présente dans la moitié des cas, ce qui rappelle que l’atteinte n’est pas purement sensitive ; les cordons latéraux et la neuropathie y contribuent.</p>
<p data-evidence="G32-C0061">Quatre catégories de questions orientent le bilan. La consommation de protoxyde d’azote se quantifie : fréquence, nombre de cartouches par épisode ; le patient suisse en consommait de 5 à 20 par épisode, 2 à 5 fois par mois, depuis 7 à 10 ans, avec une aggravation après une prise massive. Le régime (végétarien, végan), une chirurgie gastrique ou bariatrique et les médicaments (metformine, inhibiteurs de la pompe à protons) recherchent une carence d’apport ou d’absorption. Les symptômes cognitifs et psychiatriques (dépression, manie, psychose) font partie du tableau possible de la carence.</p>
<div class="trap" data-evidence="G32-C0062"><span class="k">Piège</span> Le patient ne mentionne pas toujours spontanément le gaz. La question doit être directe, sans jugement, car l’exposition change le diagnostic, le dosage interprétable et le traitement.</div>
</section>
<section class="ilot" id="g32-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-evidence="G32-C0063">L’examen documente le syndrome cordonal postérieur. Chez le patient suisse, la pallesthésie était abolie jusqu’aux crêtes iliaques et le sens de position très altéré aux orteils et aux chevilles. Le signe de Romberg était positif, la marche en tandem impossible. La force était conservée (5 sur 5), les réflexes diminués de façon symétrique et les réponses plantaires en flexion.</p>
<p data-evidence="G32-C0064">Dans la série allemande, la pallesthésie était anormale chez 88,5 % des patients et une hyporéflexie chez 73,9 %. La diminution des réflexes, inattendue pour une atteinte médullaire isolée, traduit la coexistence fréquente d’une neuropathie périphérique : celle-ci était présente chez 100 % des patients testés par électroneuromyographie. Un syndrome médullaire pur n’est donc pas la règle ; la myéloneuropathie l’est.</p>
<div class="two"><div class="card"><h4>Cordons postérieurs</h4><p data-evidence="G32-C0065">Perte de la pallesthésie et du sens de position, ataxie sensitive, signe de Romberg positif.</p></div><div class="card"><h4>Nerfs périphériques</h4><p data-evidence="G32-C0066">Hyporéflexie et parésies ; paresthésies distales symétriques.</p></div><div class="card"><h4>Cordons latéraux</h4><p data-evidence="G32-C0067">Spasticité et signe de Lhermitte, classés parmi les autres signes de la série allemande.</p></div></div>
<div class="key" data-evidence="G32-C0068"><b>À retenir.</b> Un signe de Romberg positif avec abolition de la pallesthésie et des réflexes diminués désigne un syndrome cordonal postérieur associé à une neuropathie, pas une atteinte pyramidale pure.</div>
</section>
