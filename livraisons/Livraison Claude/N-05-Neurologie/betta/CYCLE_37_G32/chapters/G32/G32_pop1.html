<template data-pop="g32-cim" data-title="Double codage † et * : G32">
<div class="lab">Principe</div><p data-evidence="G32-C0281">Le marqueur astérisque (*) désigne un code de manifestation. Il est toujours associé au code à croix (†) de la maladie causale. La catégorie G32 contient deux sous-codes à astérisque, G32.0* et G32.8*.</p>
<div class="lab">Application</div><p data-evidence="G32-C0282">G32.0* est la dégénérescence combinée subaiguë de la moelle épinière au cours de maladies classées ailleurs ; son code causal listé est E53.8†. G32.8* regroupe les autres affections dégénératives précisées du système nerveux au cours de maladies classées ailleurs, sans inclusion, exclusion ni code † listés.</p>
<div class="lab">Limite</div><p data-evidence="G32-C0283">Le dossier lit la classification allemande (BfArM) et son registre suisse (OFS). Il ne contient aucune règle sur le code causal à choisir lorsque la myélopathie est provoquée par le protoxyde d’azote ; ce choix n’est pas tranché ici.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g30-g32.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G30–G32</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 (registre du dépôt)</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-dcs" data-title="Dégénérescence combinée subaiguë (DCS)">
<div class="lab">Définition</div><p data-evidence="G32-C0284">La DCS est une démyélinisation des cordons postérieurs et latéraux de la moelle, surtout cervicale, liée à un déficit fonctionnel en vitamine B12.</p>
<div class="lab">Sens de « fonctionnel »</div><p data-evidence="G32-C0285">La vitamine peut être présente mais inutilisable. Le protoxyde d’azote oxyde le cobalt de la cobalamine et inactive ses deux enzymes ; les réserves peuvent donc rester normales.</p>
<div class="lab">Conséquence</div><p data-evidence="G32-C0286">Le diagnostic ne peut pas reposer sur la seule B12 sérique. Il associe un syndrome cordonal postérieur, un marqueur fonctionnel élevé et, souvent, une IRM.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680335840026)" target="_blank" rel="noopener">Information professionnelle suisse Vitarubine® Dépôt</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-epid" data-title="Limites des chiffres d’épidémiologie">
<div class="lab">Origine</div><p data-evidence="G32-C0287">Les données suisses sur la consommation de protoxyde d’azote (5 % à 8 % sur 30 jours, 13 % à 11 % sur 12 mois) sont des chiffres d’Infodrog cités par un cas publié ; l’échantillon n’est pas précisé.</p>
<div class="lab">Séries</div><p data-evidence="G32-C0288">La série allemande (23 patients) est rétrospective et de petite taille. La série adolescente (59 cas) mêle 5 nouveaux cas et 54 cas publiés, issus de centres israéliens ; elle ne représente pas la population suisse.</p>
<div class="lab">Absence</div><p data-evidence="G32-C0289">Aucune estimation suisse de la fréquence globale de la carence en vitamine B12 n’a été trouvée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42474763/" target="_blank" rel="noopener">Cohen-Vig et collaborateurs, Eur J Pediatr 2026, adolescents</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-n2o" data-title="Protoxyde d’azote">
<div class="lab">Mécanisme</div><p data-evidence="G32-C0290">Il oxyde l’ion cobalt de la cobalamine et inactive la méthylmalonyl-CoA mutase et la méthionine synthase. Un stress oxydatif et une excitotoxicité NMDA pourraient y contribuer.</p>
<div class="lab">Information professionnelle suisse</div><p data-evidence="G32-C0291">L’exposition prolongée peut induire une carence fonctionnelle et des effets neurologiques graves, même si les réserves en vitamine B12 sont normales.</p>
<div class="lab">Conséquence pratique</div><p data-evidence="G32-C0292">Chez un consommateur, la B12 sérique normale ne rassure pas. L’arrêt du gaz est la première mesure, avant tout complément.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680335840026)" target="_blank" rel="noopener">Information professionnelle suisse Vitarubine® Dépôt</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-enzymes" data-title="Deux enzymes dépendantes de la B12">
<div class="lab">Voie de la mutase</div><p data-evidence="G32-C0293">La méthylmalonyl-CoA mutase transforme le méthylmalonyl-CoA en succinyl-CoA. Quand elle s’arrête, l’acide méthylmalonique s’accumule.</p>
<div class="lab">Voie de la synthase</div><p data-evidence="G32-C0294">La méthionine synthase transforme l’homocystéine en méthionine. Quand elle s’arrête, l’homocystéine s’accumule et la méthionine manque ; le défaut de S-adénosylméthionine perturbe la méthylation des phospholipides de la myéline.</p>
<div class="lab">Lecture clinique</div><p data-evidence="G32-C0295">Deux marqueurs élevés permettent donc de prouver le déficit même si la concentration de B12 est normale.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-thrombose" data-title="Hyperhomocystéinémie et thrombose">
<div class="lab">Fait</div><p data-evidence="G32-C0296">L’hyperhomocystéinémie expose à des thromboses veineuses profondes et à des embolies pulmonaires, décrites chez les consommateurs de protoxyde d’azote.</p>
<div class="lab">Limite</div><p data-evidence="G32-C0297">Association décrite dans un cas publié ; le dossier ne contient pas de seuil de risque ni de recommandation de prévention.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-absorption" data-title="Absorption de la vitamine B12 : limite de la leçon">
<div class="lab">Limite</div><p data-evidence="G32-C0298">Le dossier ne contient pas de lecture de la physiologie de l’absorption (haptocorrine, facteur intrinsèque, iléon terminal). La leçon ne la développe donc pas pour respecter la règle de n’utiliser que des sources lues.</p>
<div class="lab">Conséquence</div><p data-evidence="G32-C0299">Les causes de malabsorption sont énumérées (anémie pernicieuse, chirurgie gastrique, maladie cœliaque) sans leur mécanisme détaillé. Le mécanisme est à compléter lors d’un cycle ultérieur.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-lacunes" data-title="Lacunes des sources">
<div class="lab">Recommandations</div><p data-evidence="G32-C0300">Aucune recommandation d’une société savante suisse ou européenne n’a été lue en texte intégral : la page NICE a renvoyé une erreur, la ligne directrice BSH n’a pas été trouvée et Swiss Medical Forum était inaccessible.</p>
<div class="lab">Contenus non lus</div><p data-evidence="G32-C0301">Les revues de Zou (2024) et de Keddie (2018), citées par le cas suisse, n’ont pas été lues directement. L’article RöFo 2023 n’est connu que par ses métadonnées.</p>
<div class="lab">Autres limites</div><p data-evidence="G32-C0302">G32.8* n’a aucune source clinique. La date de révision de la Vitarubine® n’a pas été extraite. La notice suisse de la cyanocobalamine orale n’a pas été trouvée.</p>
<div class="lab">Statut</div><p data-evidence="G32-C0303">Revue par intelligence artificielle, distincte d’une validation médicale humaine ; audit différé.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680335840026)" target="_blank" rel="noopener">Information professionnelle suisse Vitarubine® Dépôt</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36577430/" target="_blank" rel="noopener">Heckl et collaborateurs, RöFo 2023, références d’imagerie</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-diag" data-title="Faisceau diagnostique : sources et limites">
<div class="lab">Absence de critère</div><p data-evidence="G32-C0304">Aucun critère diagnostique formel publié de la DCS n’a été trouvé dans les sources lues.</p>
<div class="lab">Faisceau</div><p data-evidence="G32-C0305">Syndrome cordonal postérieur ou neuropathie ; AMM et/ou homocystéine élevés ; hypersignal T2 postérieur cervical non obligatoire ; cause identifiée.</p>
<div class="lab">Statut</div><p data-evidence="G32-C0306">Ce faisceau est une synthèse du dossier, non une définition officielle ; il ne remplace pas un avis spécialisé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
