<template data-pop="g32-amm" data-title="Acide méthylmalonique (AMM)">
<div class="lab">Définition</div><p data-evidence="G32-C0307">L’AMM s’accumule lorsque la méthylmalonyl-CoA mutase est privée de cobalamine active. Il est élevé au-delà de 300 nmol/l.</p>
<div class="lab">Performance</div><p data-evidence="G32-C0308">Il était anormal chez 94,7 % des patients de la série allemande exposés au protoxyde d’azote. Il tranche lorsque la B12 est dans la zone grise ou que la holotranscobalamine est entre 23 et 75 pmol/l.</p>
<div class="lab">Limites</div><p data-evidence="G32-C0309">L’insuffisance rénale l’élève sans carence. Il se normalise en quelques jours après l’arrêt du gaz.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-hcy" data-title="Homocystéine">
<div class="lab">Définition</div><p data-evidence="G32-C0310">L’homocystéine s’accumule quand la méthionine synthase est inactive. La référence est d’environ 10 µmol/l.</p>
<div class="lab">Performance</div><p data-evidence="G32-C0311">Elle était anormale chez 88,9 % des patients de la série allemande ; l’AMM ou l’homocystéine étaient élevés chez 92 % des adolescents.</p>
<div class="lab">Limites</div><p data-evidence="G32-C0312">Elle augmente aussi en cas de carence en folates ou en B6, d’hypothyroïdie et avec certains médicaments. Elle se normalise en quelques jours après l’arrêt du protoxyde d’azote.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42474763/" target="_blank" rel="noopener">Cohen‑Vig et collaborateurs, Eur J Pediatr 2026, adolescents</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-b12" data-title="Vitamine B12 sérique">
<div class="lab">Seuils</div><p data-evidence="G32-C0313">Référence 140–450 pmol/l ; inférieure à 140 : basse ; 140 à 300 : zone grise.</p>
<div class="lab">Limites</div><p data-evidence="G32-C0314">Normale chez environ 30 % des cas liés au protoxyde d’azote ; anormale chez 34,8 % dans la série allemande ; carence vraie chez seulement 45 % des adolescents. Les suppléments oraux l’élèvent sans restaurer les tissus, et les anticorps anti-facteur intrinsèque la rendent faussement normale dans 25 % des anémies pernicieuses.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42474763/" target="_blank" rel="noopener">Cohen‑Vig et collaborateurs, Eur J Pediatr 2026, adolescents</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-holotc" data-title="Holotranscobalamine">
<div class="lab">Seuils</div><p data-evidence="G32-C0315">Inférieure à 27 pmol/l : carence ; 23 à 75 pmol/l : doser l’AMM.</p>
<div class="lab">Comportement sous protoxyde d’azote</div><p data-evidence="G32-C0316">Elle peut être normale ou élevée (plus de 300 pmol/l chez le patient suisse) et n’était anormale que chez 33,3 % de la série allemande.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-pieges" data-title="Pièges biologiques">
<div class="lab">Faux positifs</div><p data-evidence="G32-C0317">Insuffisance rénale (AMM) ; carence en folates ou en B6, hypothyroïdie, médicaments (homocystéine).</p>
<div class="lab">Faux négatifs</div><p data-evidence="G32-C0318">Anticorps anti-facteur intrinsèque : B12 faussement normale dans 25 % des anémies pernicieuses ; ces anticorps sont peu sensibles (55 %). Suppléments oraux : B12 sérique élevée sans restauration tissulaire.</p>
<div class="lab">Temps</div><p data-evidence="G32-C0319">L’AMM et l’homocystéine se normalisent en quelques jours après l’arrêt du protoxyde d’azote.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-irm" data-title="IRM médullaire">
<div class="lab">Aspect</div><p data-evidence="G32-C0320">Hypersignal T2 des cordons postérieurs, en « V inversé » en coupe axiale, typiquement entre C3 et C5.</p>
<div class="lab">Fréquence</div><p data-evidence="G32-C0321">Myélopathie chez 66,7 % de la série allemande (niveau documenté toujours entre C2 et C4) et chez 89 % des adolescents ; jusqu’à un tiers sans anomalie.</p>
<div class="lab">Référence</div><p data-evidence="G32-C0322">Un article suisse-allemand de 2023 (RöFo) traite des signes typiques d’IRM de la myélose funiculaire ; il n’a pas été lu en texte intégral.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42474763/" target="_blank" rel="noopener">Cohen‑Vig et collaborateurs, Eur J Pediatr 2026, adolescents</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36577430/" target="_blank" rel="noopener">Heckl et collaborateurs, RöFo 2023, références d’imagerie</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-enmg" data-title="Électroneuromyographie et potentiels évoqués">
<div class="lab">Électroneuromyographie</div><p data-evidence="G32-C0323">Neuropathie chez 100 % des patients testés de la série allemande (n = 20), surtout axonale sensorimotrice chez les adolescents (88 %), mais normale chez le patient suisse. Profil axonal 20 %, démyélinisant 13,3 %, mixte 66 % (n = 15).</p>
<div class="lab">Potentiels évoqués somesthésiques</div><p data-evidence="G32-C0324">Anormaux chez 83,3 % des patients testés (10 sur 12).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11737043/" target="_blank" rel="noopener">Meißner et collaborateurs, Neurol Res Pract 2025, série allemande</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42474763/" target="_blank" rel="noopener">Cohen‑Vig et collaborateurs, Eur J Pediatr 2026, adolescents</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-diffmyelo" data-title="Diagnostic différentiel : listes">
<div class="lab">Myélopathie cordonale postérieure</div><p data-evidence="G32-C0325">Carence en cuivre ; myélopathie vacuolaire du VIH ; paraplégie spastique héréditaire ; sclérose en plaques ; carence en folates ; ischémie de l’artère spinale postérieure ; plus rarement neurosyphilis, carence en vitamine E, myélopathies paranéoplasiques ou inflammatoires.</p>
<div class="lab">Polyneuropathie ataxiante</div><p data-evidence="G32-C0326">VIH, maladie de Lyme, hépatites, lèpre ; porphyrie ; carences B1, B6, B9, B12 ; métaux lourds, cisplatine, éthambutol, amiodarone ; syndrome de Guillain-Barré, syndrome de Sjögren, vasculite, sarcoïdose ; formes héréditaires et paranéoplasiques.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-cuivre" data-title="Carence en cuivre">
<div class="lab">Tableau</div><p data-evidence="G32-C0327">Myéloneuropathie avec ataxie sensitive et marche spastique, neuropathie axonale sensorimotrice et hypersignal T2 des cordons postérieurs : le tableau est décrit comme indistinguable de la DCS.</p>
<div class="lab">Causes</div><p data-evidence="G32-C0328">Chirurgie gastrique, excès de zinc, malabsorption, parfois sans cause. Après bypass de Roux-en-Y, la carence est signalée chez jusqu’à 10 % des patients.</p>
<div class="lab">Traitement</div><p data-evidence="G32-C0329">Une amélioration neurologique est possible mais inconstante sous supplémentation. Les sources lues sont des cas isolés.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20466396/" target="_blank" rel="noopener">Videt‑Gibou et collaborateurs, Rev Neurol 2010, carence en cuivre</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28659010/" target="_blank" rel="noopener">King et collaborateurs, Nutr Clin Pract 2017, carence en cuivre</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-folates" data-title="Acide folique et masquage de la carence">
<div class="lab">Mécanisme décrit</div><p data-evidence="G32-C0330">L’acide folique seul peut corriger l’anémie et masquer la carence en vitamine B12 pendant que l’atteinte neurologique progresse.</p>
<div class="lab">Recommandation citée</div><p data-evidence="G32-C0331">La revue citée par le cas suisse recommande de différer les folates jusqu’à la normalisation de la B12 ; le cas décrit leur introduction simultanée comme un écart au protocole.</p>
<div class="lab">Décision</div><p data-evidence="G32-C0332">Doser et traiter la vitamine B12 d’abord ; dépister ensuite une carence en folates, comme le demande l’information professionnelle suisse.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680335840026)" target="_blank" rel="noopener">Information professionnelle suisse Vitarubine® Dépôt</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-arret" data-title="Arrêt intempestif du traitement">
<div class="lab">Fait</div><p data-evidence="G32-C0333">Un arrêt du traitement provoque une aggravation neurologique sévère, parfois irréversible.</p>
<div class="lab">Principe</div><p data-evidence="G32-C0334">Selon la revue néerlandaise, l’hydroxocobalamine n’est pas toxique et un traitement efficace ne doit pas être arrêté.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-hypok" data-title="Hypokaliémie au début du traitement">
<div class="lab">Fait</div><p data-evidence="G32-C0335">Au début du traitement, une érythropoïèse intense peut entraîner une hypokaliémie ; la kaliémie est contrôlée régulièrement.</p>
<div class="lab">Autres effets</div><p data-evidence="G32-C0336">Thrombocytose transitoire avec risque thromboembolique en cas de prédisposition ; carence transitoire en fer et en folates.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680335840026)" target="_blank" rel="noopener">Information professionnelle suisse Vitarubine® Dépôt</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-hydroxo" data-title="Vitarubine® Dépôt (information professionnelle suisse)">
<div class="lab">Produit</div><p data-evidence="G32-C0337">Acétate d’hydroxocobalamine 1 mg/ml, Streuli Pharma AG, texte AIPS consulté via la base AmiKo ; la date de révision n’a pas été extraite.</p>
<div class="lab">Posologie</div><p data-evidence="G32-C0338">Cas aigus : 1000 µg 2 à 3 fois par semaine par voie intramusculaire. Anémie pernicieuse au long cours : 1000 µg tous les 2 à 3 mois à vie.</p>
<div class="lab">Sécurité</div><p data-evidence="G32-C0339">Contre-indication : hypersensibilité. Interaction : chloramphénicol. Effets indésirables : anaphylaxie rare, éruptions acnéiformes. Non étudiée chez l’enfant.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680335840026)" target="_blank" rel="noopener">Information professionnelle suisse Vitarubine® Dépôt</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-oral" data-title="Voie orale : essai suisse">
<div class="lab">Essai</div><p data-evidence="G32-C0340">37 patients de médecine de famille : après 4 semaines, holotranscobalamine et AMM normalisés chez tous dans les deux bras. Cyanocobalamine orale 1000 µg par jour contre hydroxocobalamine intramusculaire 1000 µg par semaine pendant 4 semaines.</p>
<div class="lab">Résultat</div><p data-evidence="G32-C0341">La non-infériorité biologique de la voie orale a été rejetée. La préférence initiale pour l’oral était de 45,9 %.</p>
<div class="lab">Limite</div><p data-evidence="G32-C0342">Population sans atteinte neurologique précisée, critère biologique : ne pas transposer à la DCS. La revue néerlandaise juge les preuves faibles et note que 1000 à 2000 µg par jour peuvent être nécessaires.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28421567/" target="_blank" rel="noopener">Metaxas et collaborateurs, Swiss Med Wkly 2017</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-methionine" data-title="Méthionine">
<div class="lab">Schéma cité</div><p data-evidence="G32-C0343">Méthionine 1 g trois fois par jour pendant au moins 4 à 6 semaines, dans le cas suisse, avec hydroxocobalamine 1 mg une fois par jour pendant environ 2 semaines puis 2 mg par jour par voie orale.</p>
<div class="lab">Raisonnement</div><p data-evidence="G32-C0344">Le blocage de la méthionine synthase prive de méthionine ; la supplémenter vise à compenser ce manque. Le dossier ne contient pas de preuve d’efficacité.</p>
<div class="lab">Limite</div><p data-evidence="G32-C0345">La revue de Zou 2024 qui fonde ce schéma n’a pas été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-droit" data-title="Cadre légal suisse du protoxyde d’azote">
<div class="lab">Statut</div><p data-evidence="G32-C0346">Hors de la loi sur les stupéfiants. Usage médical sous la loi sur les produits thérapeutiques (autorisation Swissmedic) ; cartouches alimentaires sous la loi sur les denrées alimentaires ; autres ventes sous la loi sur les produits chimiques et son ordonnance.</p>
<div class="lab">Jurisprudence</div><p data-evidence="G32-C0347">Arrêt du Tribunal fédéral du 21 mars 2024 (2C_24/2024) confirmant l’interdiction bâloise de vente pour inhalation récréative ; postulat parlementaire du 20 janvier 2026.</p>
<div class="lab">Aide</div><p data-evidence="G32-C0348">Consultation SafeZone.ch ; Tox Info Suisse, numéro 145.</p>
<p class="src">Références : <a href="https://www.infodrog.ch/fr/ressources/formes-de-dependances/gaz-hilarant.html" target="_blank" rel="noopener">Infodrog, page « Gaz hilarant »</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-prono" data-title="Pronostic : données">
<div class="lab">Revue systématique</div><p data-evidence="G32-C0349">66 cas ; la marche autonome au diagnostic prédit la récupération (environ 90 % de guérison complète). Un schéma plus intensif est associé à de meilleurs résultats chez les non-marchants (NNT de 4). Pronostic moins bon pour les causes malabsorptives.</p>
<div class="lab">Limite</div><p data-evidence="G32-C0350">Cas publiés, donc biais de publication ; résumé seul lu.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/33780172/" target="_blank" rel="noopener">Jhunjhnuwala et collaborateurs, PM R 2021, revue systématique</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-ado" data-title="Adolescents">
<div class="lab">Série</div><p data-evidence="G32-C0351">59 cas de 14 à 18 ans. Présentation surtout sensitive ; hypertension intracrânienne suggérée chez 2 patients. Guérison 27 %, amélioration 61 %.</p>
<div class="lab">Biologie</div><p data-evidence="G32-C0352">Vraie carence en B12 chez 45 % ; AMM ou homocystéine élevés chez 92 % ; IRM anormale chez 89 % ; neuropathie chez 88 %.</p>
<div class="lab">Hypothèse</div><p data-evidence="G32-C0353">Une carence infraclinique serait un facteur prédisposant.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42474763/" target="_blank" rel="noopener">Cohen‑Vig et collaborateurs, Eur J Pediatr 2026, adolescents</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-grossesse" data-title="Grossesse et allaitement">
<div class="lab">Fait</div><p data-evidence="G32-C0354">Aucune étude contrôlée. La Vitarubine® n’est à utiliser qu’en cas de nécessité absolue ; la vitamine B12 passe la barrière placentaire.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680335840026)" target="_blank" rel="noopener">Information professionnelle suisse Vitarubine® Dépôt</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-nourrisson" data-title="Nourrisson">
<div class="lab">Fait</div><p data-evidence="G32-C0355">Un diagnostic tardif de carence peut laisser des séquelles neurologiques irréversibles, notamment retard moteur et convulsions.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6543499/" target="_blank" rel="noopener">Wolffenbuttel et collaborateurs, Mayo Clin Proc Innov Qual Outcomes 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g32-anesthesie" data-title="Anesthésie chez un consommateur">
<div class="lab">Fait</div><p data-evidence="G32-C0356">Chez un consommateur de protoxyde d’azote, éviter l’emploi de ce gaz pendant l’anesthésie.</p>
<div class="lab">Limite</div><p data-evidence="G32-C0357">Donnée britannique non lue en texte intégral ; à confirmer avec une source suisse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13049691/" target="_blank" rel="noopener">Witzig et collaborateurs, Cureus 2026, myélopathie au protoxyde d’azote en Suisse romande</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="pareto-g32-code" data-title="Pareto — Définition, codage, fréquence">
<p class="ratio" data-cover="g32-0,g32-1,g32-2,g32-3"></p><ul><li data-evidence="G32-C0358">G32 est un code à astérisque : la manifestation d’une maladie causale, jamais isolé.</li><li data-evidence="G32-C0359">La DCS est une démyélinisation cordonale postérieure et latérale, surtout cervicale, par déficit fonctionnel en vitamine B12.</li><li data-evidence="G32-C0360">L’anémie ne prédit pas l’atteinte neurologique : moins de 20 % des B12 basses ont une anémie macrocytaire.</li></ul></template>
<template data-pop="pareto-g32-mecanismes" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="g32-4"></p><ul><li data-evidence="G32-C0361">La B12 est le cofacteur de la mutase et de la méthionine synthase.</li><li data-evidence="G32-C0362">Les substrats s’accumulent : AMM et homocystéine.</li><li data-evidence="G32-C0363">Le protoxyde d’azote oxyde le cobalt et inactive les deux enzymes, même avec des réserves normales.</li></ul></template>
<template data-pop="pareto-g32-diagnostic" data-title="Pareto — Anamnèse, examen, diagnostic">
<p class="ratio" data-cover="g32-5,g32-6,g32-7"></p><ul><li data-evidence="G32-C0364">Paresthésies (95,7 %) et ataxie (82,6 %) dominent.</li><li data-evidence="G32-C0365">Romberg positif, pallesthésie abolie, réflexes diminués.</li><li data-evidence="G32-C0366">Doser AMM et homocystéine : la B12 sérique peut être normale.</li></ul></template>
<template data-pop="pareto-g32-urgences" data-title="Pareto — Diagnostic différentiel et pièges">
<p class="ratio" data-cover="g32-8,g32-9"></p><ul><li data-evidence="G32-C0367">Le cuivre, le VIH, la sclérose en plaques et les carences vitaminiques imitent le tableau.</li><li data-evidence="G32-C0368">L’acide folique seul masque la carence.</li><li data-evidence="G32-C0369">Un arrêt du traitement aggrave l’atteinte ; surveiller le potassium au début.</li></ul></template>
<template data-pop="pareto-g32-traitement" data-title="Pareto — Prise en charge, suivi, situations particulières">
<p class="ratio" data-cover="g32-10,g32-11,g32-12"></p><ul><li data-evidence="G32-C0370">Arrêter le protoxyde d’azote et injecter de l’hydroxocobalamine par voie intramusculaire.</li><li data-evidence="G32-C0371">La marche autonome au diagnostic prédit la guérison.</li><li data-evidence="G32-C0372">La voie orale et la méthionine reposent sur des preuves limitées.</li></ul></template>
<template data-pop="pareto-g32-criteres" data-title="Pareto — Critères et paramètres">
