<template id="ch-N18"><div class="chap"><div class="chap-head"><div class="code">N 18 · Néphrologie · Rein, eau et électrolytes</div><h1>Maladie rénale chronique</h1><span class="status">Cycle 2 · Revue par intelligence artificielle · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la maladie rénale chronique</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#n18-a01">Cas initial et objectifs</a></li><li><a href="#n18-a02">Définition et démonstration de chronicité</a></li><li><a href="#n18-a03">Classification et gradation du risque</a></li><li><a href="#n18-a04">Épidémiologie, causes et facteurs de progression</a></li><li><a href="#n18-a05">Anamnèse et examen clinique</a></li><li><a href="#n18-a06">Diagnostic étiologique et orientation</a></li><li><a href="#n18-a07">Interventions pour ralentir la progression</a></li><li><a href="#n18-a08">Complications métaboliques et cardiovasculaires</a></li><li><a href="#n18-a09">Formes avancées et choix de parcours</a></li><li><a href="#n18-a10">Autres formes et atteinte unilatérale</a></li><li><a href="#n18-a11">Suivi et situations particulières</a></li><li><a href="#n18-a12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="n18-a01"><h2><span class="n">A01</span> Cas initial et objectifs</h2><h3 id="n18-a01-partie-1">1. Un cas fictif suivi dans le temps</h3><p data-evidence="N18-C0001" id="N18-C0001">M. L., personnage fictif de 60 ans, vit avec un diabète de type 2 et une hypertension. Il apporte deux résultats obtenus à quatre mois d’intervalle : débit de filtration glomérulaire estimé, ou <button class="w" data-k="n18-dfg">DFGe</button>, de 43 puis 40 mL/min/1,73 m²; rapport albumine/<button class="w" data-k="n18-creatinine">créatinine</button> urinaire, ou <button class="w" data-k="n18-acr">ACR</button>, de 38 puis 35 mg/mmol. Il n’a pas de <button class="w" data-k="n18-volume">dyspnée</button> ni de vomissements et continue ses activités. Ces données sont inventées pour apprendre un raisonnement; elles ne constituent pas un dossier à traiter.</p><p data-evidence="N18-C0002" id="N18-C0002">L’absence de plainte n’exclut pas une maladie rénale. La filtration baisse souvent avant l’apparition de symptômes spécifiques. Nous chercherons donc les résultats antérieurs, leur contexte et les autres signes rénaux avant de conclure.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>.</p><h3 id="n18-a01-partie-2">2. Vérifier le temps avant de nommer la maladie</h3><p data-evidence="N18-C0003" id="N18-C0003">Les deux prélèvements sont-ils comparables et ont-ils été réalisés hors infection, déshydratation ou changement thérapeutique récent? Une baisse isolée du <button class="w" data-k="n18-dfg">DFGe</button> peut être aiguë. Dans ce cas, une anomalie de filtration et une albuminurie persistent au-delà de trois mois; cela apporte une preuve de chronicité, à condition de vérifier les comptes rendus et les conditions du prélèvement. Une aggravation survenue cette semaine resterait possible sur ce terrain chronique.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a01-partie-3">3. Les quatre résultats attendus du raisonnement</h3><p data-evidence="N18-C0004" id="N18-C0004">Le raisonnement confirme la chronicité, décrit la maladie par sa cause et ses catégories G et A, recherche une affection traitable, puis organise la protection. Une seule étiquette ne remplit pas ces quatre fonctions. « G3b A3 » décrit une filtration et une albuminurie; elle ne prouve ni une cause diabétique ni la nécessité d’une dialyse.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><h3 id="n18-a01-partie-4">4. Filtrer, excréter et conserver une structure fonctionnelle</h3><p data-evidence="N18-C0005" id="N18-C0005">La <button class="w" data-k="n18-filtration">filtration</button> transfère de l’eau et de petites molécules du plasma vers l’espace de Bowman. Le tubule réabsorbe une grande part de ce filtrat et sécrète certaines substances; l’excrétion est la quantité finalement éliminée dans l’urine par unité de temps. Le volume urinaire ne mesure donc pas directement la filtration. Une lésion de structure, par exemple une anomalie rénale persistante à l’imagerie, peut témoigner d’une maladie même si la filtration globale reste conservée.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a01-partie-5">5. Reconnaître une atteinte aiguë sur une maladie chronique</h3><p data-evidence="N18-C0006" id="N18-C0006">Une <button class="w" data-k="n18-creatinine">créatinine</button> qui augmente rapidement après diarrhée, un obstacle urinaire ou un médicament doit faire rechercher une atteinte aiguë. Le chapitre N17 développe ses critères et son traitement; ici, la priorité est de ne pas attribuer cette variation au vieillissement de la maladie. Inversement, une atteinte aiguë peut laisser des séquelles chroniques. La chronologie des deux phénomènes doit être écrite séparément, avec les dates et les preuves disponibles.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><h3 id="n18-a01-partie-6">6. Première conclusion et données manquantes</h3><p data-evidence="N18-C0007" id="N18-C0007">Pour M. L., les données répétées soutiennent une maladie rénale chronique G3b A3. Le diabète rend une origine diabétique plausible, mais une <button class="w" data-k="n18-hematurie">hématurie</button> glomérulaire, une chute rapide de filtration ou une anomalie échographique pourrait changer cette hypothèse. Il manque notamment la pression mesurée correctement, le potassium, l’analyse urinaire, la liste des médicaments et le contexte des résultats. L’exercice consiste à demander ces informations avant de proposer une ordonnance.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><div class="key" data-evidence="N18-C0008" id="N18-C0008"><strong>À retenir.</strong> Le cas de M. L. est fictif. Devant deux résultats rénaux anormaux, le médecin date d’abord les anomalies, puis il classe la filtration (G) et l’albuminurie (A), recherche la cause et organise le suivi. Le diabète rend une origine diabétique plausible, mais il ne la prouve pas.</div><p><button class="w" data-k="n18-a01-fenetre-1">Filtration : bases</button> <button class="w" data-k="n18-a01-fenetre-2">Chronologie : données nécessaires</button> </p><button class="pareto-btn ui" data-k="pareto-n18-a01">▲ Loi de Pareto — Cas initial et objectifs</button></section><section class="ilot" id="n18-a02"><h2><span class="n">A02</span> Définition et démonstration de chronicité</h2><h3 id="n18-a02-partie-1">1. Une définition fondée sur une durée et une conséquence sanitaire</h3><p data-evidence="N18-C0009" id="N18-C0009">Les recommandations KDIGO 2024, internationales et reprises dans la fiche suisse SSN du 17 mars 2025, définissent la maladie rénale chronique par une anomalie de structure ou de fonction rénale présente pendant au moins trois mois et ayant des implications pour la santé. Chez l’adulte, un <button class="w" data-k="n18-dfg">DFGe</button> inférieur à 60 mL/min/1,73 m² satisfait le critère fonctionnel s’il persiste. Un marqueur de lésion rénale peut satisfaire la définition avec un <button class="w" data-k="n18-dfg">DFGe</button> plus élevé.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><h3 id="n18-a02-partie-2">2. Établir la chronicité sans attendre aveuglément</h3><p data-evidence="N18-C0010" id="N18-C0010">La <button class="w" data-k="n18-chronologie">chronologie</button> repose sur les anciennes créatinines, les anciennes albuminuries, les analyses urinaires, l’histoire de la maladie et les examens morphologiques. Des reins petits avec cortex aminci ou une histologie montrant <button class="w" data-k="n18-s04-fenetre-2">fibrose</button> et atrophie peuvent établir une ancienneté sans trois nouveaux mois d’attente. Ces indices se confrontent au contexte : toute anomalie d’imagerie n’est pas une preuve suffisante à elle seule.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p><h3 id="n18-a02-partie-3">3. Reconnaître plusieurs types de preuve</h3><p data-evidence="N18-C0011" id="N18-C0011">Une albuminurie persistante d’au moins 3 mg/mmol, une anomalie du sédiment urinaire, certaines anomalies tubulaires, une lésion histologique, une anomalie structurelle d’imagerie ou un antécédent de transplantation rénale constituent des marqueurs possibles. Il faut préciser lequel est présent, depuis quand et dans quelles conditions. Une bandelette positive isolée ne remplace pas une mesure quantitative et sa confirmation.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a02-partie-4">4. Comparer trois chronologies</h3><p data-evidence="N18-C0012" id="N18-C0012">Le tableau relie l’évolution observée à la conclusion permise. Il ne remplace pas l’évaluation immédiate d’un patient instable.</p><table><thead><tr><th>Situation</th><th>Preuve disponible</th><th>Conséquence</th></tr></thead><tbody><tr><td data-evidence="N18-C0013" id="N18-C0013">Atteinte aiguë</td><td data-evidence="N18-C0014" id="N18-C0014">Variation récente de <button class="w" data-k="n18-creatinine">créatinine</button> ou diurèse dans le contexte aigu</td><td data-evidence="N18-C0015" id="N18-C0015">Rechercher rapidement cause réversible et complications; voir N17.</td></tr><tr><td data-evidence="N18-C0016" id="N18-C0016">Atteinte chronique</td><td data-evidence="N18-C0017" id="N18-C0017">Anomalie rénale documentée ≥ 3 mois ou autres preuves de chronicité</td><td data-evidence="N18-C0018" id="N18-C0018">Classer, chercher la cause et organiser la protection.</td></tr><tr><td data-evidence="N18-C0019" id="N18-C0019">Aiguë sur chronique</td><td data-evidence="N18-C0020" id="N18-C0020">Maladie antérieure prouvée et dégradation récente</td><td data-evidence="N18-C0021" id="N18-C0021">Traiter l’épisode aigu puis réévaluer le niveau stable.</td></tr></tbody></table><p data-evidence="N18-C0022" id="N18-C0022">Le troisième scénario interdit de considérer une nouvelle <button class="w" data-k="n18-creatinine">créatinine</button> comme le simple « stade habituel ».</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><h3 id="n18-a02-partie-5">5. Ce qu’un résultat isolé ne permet pas</h3><p data-evidence="N18-C0023" id="N18-C0023">Une <button class="w" data-k="n18-creatinine">créatinine</button> unique élevée ne date pas la maladie. Un <button class="w" data-k="n18-acr">ACR</button> élevé pendant une infection urinaire, une menstruation ou après un exercice important demande une interprétation et une confirmation. Un <button class="w" data-k="n18-dfg">DFGe</button> calculé pendant une variation rapide de <button class="w" data-k="n18-creatinine">créatinine</button> ne représente pas fidèlement un état d’équilibre. L’incertitude doit être écrite, plutôt que remplacée par une certitude fondée sur l’âge ou le diabète.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a02-partie-6">6. Réévaluer sans retarder une prise en charge nécessaire</h3><p data-evidence="N18-C0024" id="N18-C0024">On recherche les données antérieures immédiatement, puis on répète les examens dans un délai adapté à la gravité et, si nécessaire, au-delà de trois mois pour démontrer la chronicité. Une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button>, une surcharge ou une suspicion de glomérulonéphrite rapidement progressive ne peut attendre cette échéance. Exercice : un <button class="w" data-k="n18-dfg">DFGe</button> de 42 obtenu aujourd’hui sans antériorité autorise « filtration réduite à explorer », mais pas encore l’affirmation d’une maladie chronique sur ce seul résultat.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><div class="key" data-evidence="N18-C0025" id="N18-C0025"><strong>À retenir.</strong> Une maladie rénale chronique exige une anomalie de structure ou de fonction présente depuis au moins trois mois, ou une preuve d’ancienneté équivalente : valeurs antérieures, reins petits à cortex aminci, fibrose à l’histologie. Une hyperkaliémie, une surcharge ou une glomérulonéphrite rapidement progressive se traitent sans attendre cette démonstration.</div><p><button class="w" data-k="n18-a02-fenetre-1">Chronicité : critères et limites</button> <button class="w" data-k="n18-a02-fenetre-2">Atteinte rénale : preuve et interprétation</button> </p><button class="pareto-btn ui" data-k="pareto-n18-a02">▲ Loi de Pareto — Définition et démonstration de chronicité</button></section><section class="ilot" id="n18-a03"><h2><span class="n">A03</span> Classification et gradation du risque</h2><h3 id="n18-a03-partie-1">1. Décrire la cause, la filtration et l’albuminurie</h3><p data-evidence="N18-C0026" id="N18-C0026">La classification clinique associe la cause, la catégorie de filtration G et la catégorie d’albuminurie A. La cause explique ce qui lèse le rein; G décrit la capacité globale de filtration estimée; A renseigne sur une fuite d’albumine et contribue au pronostic. Écrire les trois axes évite de confondre sévérité fonctionnelle et mécanisme de maladie.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a03-partie-2">2. Lire les catégories avec leurs unités</h3><p data-evidence="N18-C0027" id="N18-C0027">Le tableau reprend KDIGO 2024 pour l’adulte, après confirmation de chronicité. Le <button class="w" data-k="n18-dfg">DFGe</button> est indexé sur une surface corporelle de 1,73 m²; il ne s’agit pas d’une clairance médicamenteuse automatiquement interchangeable.</p><table><thead><tr><th>Catégorie</th><th><button class="w" data-k="n18-dfg">DFGe</button>, mL/min/1,73 m²</th><th>Portée</th></tr></thead><tbody><tr><td data-evidence="N18-C0028" id="N18-C0028">G1</td><td data-evidence="N18-C0029" id="N18-C0029">≥ 90</td><td data-evidence="N18-C0030" id="N18-C0030">Filtration normale ou élevée; un autre marqueur est nécessaire pour parler de maladie chronique.</td></tr><tr><td data-evidence="N18-C0031" id="N18-C0031">G2</td><td data-evidence="N18-C0032" id="N18-C0032">60–89</td><td data-evidence="N18-C0033" id="N18-C0033">Filtration légèrement diminuée; même exigence de marqueur.</td></tr><tr><td data-evidence="N18-C0034" id="N18-C0034">G3a</td><td data-evidence="N18-C0035" id="N18-C0035">45–59</td><td data-evidence="N18-C0036" id="N18-C0036">Diminution légère à modérée.</td></tr><tr><td data-evidence="N18-C0037" id="N18-C0037">G3b</td><td data-evidence="N18-C0038" id="N18-C0038">30–44</td><td data-evidence="N18-C0039" id="N18-C0039">Diminution modérée à sévère.</td></tr><tr><td data-evidence="N18-C0040" id="N18-C0040">G4</td><td data-evidence="N18-C0041" id="N18-C0041">15–29</td><td data-evidence="N18-C0042" id="N18-C0042">Diminution sévère; suivi spécialisé habituellement nécessaire.</td></tr><tr><td data-evidence="N18-C0043" id="N18-C0043">G5</td><td data-evidence="N18-C0044" id="N18-C0044">&lt; 15</td><td data-evidence="N18-C0045" id="N18-C0045">Insuffisance rénale (« kidney failure » dans KDIGO) ; évaluation du parcours, pas dialyse automatique.</td></tr></tbody></table><p data-evidence="N18-C0046" id="N18-C0046">Les valeurs frontières appartiennent à une seule ligne : 30 est G3b et 15 est G4. Le risque reste continu malgré ces catégories pratiques.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a03-partie-3">3. Ajouter une information urinaire indépendante</h3><p data-evidence="N18-C0047" id="N18-C0047">L’<button class="w" data-k="n18-acr">ACR</button> rapporte l’albumine à la <button class="w" data-k="n18-creatinine">créatinine</button> du même échantillon. Il renseigne sur une fuite urinaire et complète la filtration.</p><p data-evidence="N18-C0048" id="N18-C0048">Les catégories suivantes décrivent l’albuminurie chez l’adulte. Les seuils conventionnels sont ceux de KDIGO 2024; le prélèvement et la persistance restent à vérifier.</p><table class="t"><thead><tr><th>Catégorie</th><th><button class="w" data-k="n18-acr">ACR</button> mg/mmol</th><th>Convention mg/g</th><th>Conséquence</th></tr></thead><tbody><tr><td data-evidence="N18-C0049" id="N18-C0049">A1</td><td data-evidence="N18-C0050" id="N18-C0050">&lt;3</td><td data-evidence="N18-C0051" id="N18-C0051">&lt;30</td><td data-evidence="N18-C0052" id="N18-C0052">L’albuminurie est faible; elle n’exclut pas une autre preuve de maladie.</td></tr><tr><td data-evidence="N18-C0053" id="N18-C0053">A2</td><td data-evidence="N18-C0054" id="N18-C0054">3–30</td><td data-evidence="N18-C0055" id="N18-C0055">30–300</td><td data-evidence="N18-C0056" id="N18-C0056">La hausse modérée persistante constitue un marqueur de lésion.</td></tr><tr><td data-evidence="N18-C0057" id="N18-C0057">A3</td><td data-evidence="N18-C0058" id="N18-C0058">&gt;30</td><td data-evidence="N18-C0059" id="N18-C0059">&gt;300</td><td data-evidence="N18-C0060" id="N18-C0060">La hausse importante augmente le risque et participe au recours suisse.</td></tr></tbody></table><p data-evidence="N18-C0061" id="N18-C0061">Les valeurs en mg/g sont des bornes conventionnelles arrondies, pas une conversion arithmétique exacte. Un adulte à 15 mg/mmol est A2; un seul résultat ne démontre pas la chronicité.</p><p data-evidence="N18-C0062" id="N18-C0062">Une filtration conservée avec A3 peut signaler un risque élevé; un <button class="w" data-k="n18-dfg">DFGe</button> bas persistant reste une maladie chronique avec A1.</p><p data-evidence="N18-C1792" id="N18-C1792">Une valeur d’exactement 30 mg/mmol est classée A2 par le tableau 3 de KDIGO 2024, mais A3 par le premier tableau du consensus SSED/SSN, qui écrit A2 3–29 et A3 ≥ 30. Le cours suit KDIGO, que reprend la fiche SSN 2025, et expose cette divergence dans la <button class="w" data-k="n18-a3-borne">fenêtre sur la frontière A2/A3</button>.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a03-partie-4">4. Interpréter une matrice sans lui attribuer un pourcentage</h3><p data-evidence="N18-C0063" id="N18-C0063">La matrice croise G et A pour comparer les risques de progression et d’événements associés. Les couleurs expriment des niveaux relatifs, sans horizon chiffré unique ni probabilité personnelle. L’âge, la cause, les comorbidités et la trajectoire restent nécessaires. Le vert n’exclut pas une lésion structurelle; en G1–G2 A1 sans autre marqueur, il n’y a pas de maladie rénale chronique définie par ces seules valeurs.</p><p data-evidence="N18-C0064" id="N18-C0064">La figure publiée ci-dessous ajoute des fréquences indicatives de contrôle et des mentions d’orientation. « Treat » signifie prise en charge, « Refer » avis spécialisé; les chiffres 1, 2, 3 et 4+ correspondent au nombre indicatif de contrôles annuels, non à un stade ou à un risque en pour-cent. L’astérisque renvoie à la possibilité de discuter le besoin d’un avis formel lorsque l’anomalie est isolée et stable, selon l’organisation locale. Ces éléments proviennent de la figure adaptée de KDIGO dans l’article; les critères suisses de recours sont développés en A06 et priment pour ce cours.</p><p data-evidence="N18-C0065" id="N18-C0065">Les couleurs de la matrice publiée représentent une gradation qualitative. Elles n’ont pas de bornes de probabilité individuelle inventées.</p><table class="t"><thead><tr><th>Couleur</th><th>Niveau relatif</th><th>Lecture</th></tr></thead><tbody><tr><td data-evidence="N18-C0066" id="N18-C0066">Vert</td><td data-evidence="N18-C0067" id="N18-C0067">Faible</td><td data-evidence="N18-C0068" id="N18-C0068">La présence d’une maladie dépend encore des autres marqueurs.</td></tr><tr><td data-evidence="N18-C0069" id="N18-C0069">Jaune</td><td data-evidence="N18-C0070" id="N18-C0070">Modérément accru</td><td data-evidence="N18-C0071" id="N18-C0071">Le suivi prend en compte cause et trajectoire.</td></tr><tr><td data-evidence="N18-C0072" id="N18-C0072">Orange</td><td data-evidence="N18-C0073" id="N18-C0073">Élevé</td><td data-evidence="N18-C0074" id="N18-C0074">La protection et les complications demandent davantage d’attention.</td></tr><tr><td data-evidence="N18-C0075" id="N18-C0075">Rouge</td><td data-evidence="N18-C0076" id="N18-C0076">Très élevé</td><td data-evidence="N18-C0077" id="N18-C0077">Une évaluation spécialisée et un suivi adapté sont discutés selon les critères cliniques.</td></tr></tbody></table><p data-evidence="N18-C0078" id="N18-C0078">Ces niveaux comparent des catégories G/A. Ils ne donnent ni une date de dialyse ni un pourcentage à cinq ans; une équation appropriée répond à cette autre question.</p><figure><img src="assets/img/cycle2/n18/n18_01.gif" alt="Matrice de filtration et albuminurie : catégories G et A, couleurs du risque. Figure publiée dérivée de KDIGO ; les conduites suisses sont commentées dans le texte." loading="lazy" width="669" height="485"><p data-evidence="N18-C0079" id="N18-C0079"><a href="assets/img/cycle2/n18/n18_01.gif" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></p><figcaption data-evidence="N18-C0080" id="N18-C0080">Figure 1 — Matrice G/A publiée, adaptée de KDIGO : couleurs de risque relatif; 1, 2, 3 et 4+ indiquent des contrôles par an. Treat = prise en charge; Refer = avis spécialisé; l’astérisque nuance le besoin d’avis formel pour anomalie isolée stable selon les ressources locales. Ces repères illustratifs ne remplacent pas les critères suisses SSN 2025 exposés en A06. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10809507/" target="_blank" rel="noopener">Source publiée</a> — Douglas R. Farrell et Joseph A. Vassalotti — <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Conversion au format GIF; contenu conservé.</figcaption></figure><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><h3 id="n18-a03-partie-5">5. Faire correspondre les descriptions sans fusionner les nomenclatures</h3><p data-evidence="N18-C0081" id="N18-C0081">Dans le catalogue historique de cette leçon, N18.1 et N18.2 désignent les stades 1 et 2, N18.3 le stade 3, N18.4 le stade 4 et N18.5 le stade 5. La subdivision clinique G3a/G3b apporte une précision supplémentaire au sein du stade 3; elle n’invente pas deux nouveaux sous-codes dans ce catalogue. Le terme « stade » ne suffit pas à établir une cause. Les autres formes et le stade non précisé sont repris en A10, dans leur contexte clinique.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a03-partie-6">6. Classer puis poser une décision proportionnée</h3><p data-evidence="N18-C0082" id="N18-C0082">M. L. a une filtration de 40, donc G3b, et un <button class="w" data-k="n18-acr">ACR</button> de 35, donc A3. La classe combinée justifie une recherche causale, une protection et un avis selon les critères suisses; elle n’autorise pas un pronostic chiffré sans modèle adapté. Exercice : un adulte G1 A1 avec une anomalie structurelle chronique peut avoir une maladie rénale; un adulte G1 A1 sans aucun marqueur n’en a pas sur ces seules données. La présence du marqueur change la conclusion.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><div class="key" data-evidence="N18-C0083" id="N18-C0083"><strong>À retenir.</strong> La classification combine trois axes : la cause, la catégorie de filtration G et la catégorie d’albuminurie A. Les catégories G1 et G2 ne définissent une maladie qu’en présence d’un autre marqueur de lésion. G3a et G3b subdivisent le stade 3, et la matrice de couleurs compare des risques relatifs sans donner de probabilité individuelle.</div><p><button class="w" data-k="n18-a03-fenetre-1">Filtration et albuminurie : axes distincts</button> <button class="w" data-k="n18-a03-fenetre-2">Matrice de risque : lecture et limites</button> </p><button class="pareto-btn ui" data-k="pareto-n18-a03">▲ Loi de Pareto — Classification et gradation du risque</button></section><section class="ilot" id="n18-a04"><h2><span class="n">A04</span> Épidémiologie, causes et facteurs de progression</h2><h3 id="n18-a04-partie-1">1. Une estimation suisse avec son dénominateur</h3><p data-evidence="N18-C0084" id="N18-C0084">La fiche SSN du 17 mars 2025 indique que la maladie rénale chronique touche environ un adulte sur dix en Suisse. Il s’agit d’un ordre de grandeur de prévalence chez les adultes, diffusé dans une recommandation de dépistage; la fiche ne fournit pas, à cet endroit, un recrutement national détaillé, un intervalle de confiance ni une année unique de mesure. On ne doit donc pas transformer cette proportion en incidence annuelle ou en résultat d’une cohorte nationale décrite dans ce cours.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><h3 id="n18-a04-partie-2">2. Le recrutement modifie les chiffres observés</h3><p data-evidence="N18-C0085" id="N18-C0085">Une population dépistée pour diabète ou hypertension, une consultation de médecine générale et un service de néphrologie ne contiennent pas les mêmes profils. La SSN recommande un dépistage ciblé sur les facteurs de risque. Les patients adressés au néphrologue sont sélectionnés notamment pour sévérité, progression ou incertitude causale; leur risque ne se transfère pas automatiquement à l’ensemble des adultes. Toute proportion doit donc être accompagnée de son dénominateur et de la méthode de sélection.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>.</p><h3 id="n18-a04-partie-3">3. Orienter la recherche parmi plusieurs groupes de causes</h3><p data-evidence="N18-C0086" id="N18-C0086">Les atteintes glomérulaires se discutent devant albuminurie et <button class="w" data-k="n18-hematurie">hématurie</button>; les maladies vasculaires devant le contexte cardiovasculaire et tensionnel; les atteintes tubulo-interstitielles devant certaines expositions, anomalies tubulaires ou infections; les anomalies obstructives et structurelles à partir de l’histoire et de l’imagerie. Les maladies héréditaires nécessitent une histoire familiale et parfois une exploration génétique. Ces indices orientent une hypothèse; aucun n’attribue à lui seul une cause certaine.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a04-partie-4">4. Séparer facteur associé et effet démontré d’une intervention</h3><p data-evidence="N18-C0087" id="N18-C0087">Une albuminurie plus importante, une pression mal contrôlée ou une filtration plus basse signalent un risque accru. La protection repose cependant sur des interventions étudiées dans des populations définies : maîtrise tensionnelle, inhibition du système rénine–angiotensine selon l’indication, inhibiteurs SGLT2 dans les groupes concernés, et prise en charge de la cause. L’existence d’un facteur de risque ne justifie pas l’ensemble des médicaments disponibles chez chaque patient.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a04-partie-5">5. Lire une trajectoire plutôt que prolonger une droite</h3><p data-evidence="N18-C0088" id="N18-C0088">La <button class="w" data-k="n18-trajectoire">trajectoire</button> combine plusieurs mesures datées, les changements de traitement et les épisodes intercurrents. Une diminution initiale après un médicament hémodynamique n’a pas la même signification qu’une baisse persistante inexpliquée. KDIGO propose d’évaluer une variation de <button class="w" data-k="n18-dfg">DFGe</button> supérieure à 20 % entre contrôles; après l’introduction d’un traitement hémodynamique, une baisse supérieure à 30 % mérite une évaluation. Ces seuils déclenchent une recherche, sans nommer automatiquement la cause.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a04-partie-6">6. Relier le mécanisme au choix du traitement</h3><p data-evidence="N18-C0089" id="N18-C0089">Une obstruction appelle une évaluation urologique; une maladie immunologique peut demander une preuve et un traitement spécialisé; une maladie héréditaire conduit à une information familiale adaptée. La protection commune s’ajoute à ces interventions, elle ne les remplace pas. Exercice : une chute brutale de 55 à 35 après une diarrhée et une baisse de 55 à 50 sur plusieurs années ne se lisent pas de la même façon ; la première impose d’abord une recherche aiguë, sans extrapoler la même pente future aux deux personnes.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><div class="key" data-evidence="N18-C0090" id="N18-C0090"><strong>À retenir.</strong> En Suisse, environ un adulte sur dix est atteint selon la SSN : c’est une prévalence, non une incidence annuelle. La portée d’un chiffre dépend du recrutement de la population étudiée, de la cause, de la trajectoire et des interventions dont l’effet a été démontré.</div><p><button class="w" data-k="n18-a04-fenetre-1">Progression : trajectoires et biais</button> <button class="w" data-k="n18-a04-fenetre-2">Recherche causale : examens orientés</button> </p><button class="pareto-btn ui" data-k="pareto-n18-a04">▲ Loi de Pareto — Épidémiologie, causes et facteurs de progression</button></section><section class="ilot" id="n18-a05"><h2><span class="n">A05</span> Anamnèse et examen clinique</h2><h3 id="n18-a05-partie-1">1. Reconstituer l’histoire rénale et générale</h3><p data-evidence="N18-C0091" id="N18-C0091">L’entretien recherche dates des premières anomalies, épisodes aigus, diabète, hypertension, maladies cardiovasculaires, maladies systémiques, troubles urinaires et antécédents de calculs. Les antécédents familiaux de maladie rénale ou de dialyse, une prématurité et une prééclampsie antérieure peuvent orienter le risque. L’exposition professionnelle et environnementale fait partie de la recherche causale. On demande le déroulement précis, plutôt que d’attribuer toute atteinte au facteur de risque le plus visible.</p><p data-evidence="N18-C0092" id="N18-C0092">La fiche suisse cite explicitement aussi le virus de l’immunodéficience humaine, le lupus et les vascularites comme maladies systémiques à risque. L’interrogatoire recherche une irradiation abdominale ou une chimiothérapie néphrotoxique antérieure. Chez l’adulte diabétique, le dépistage est au moins annuel; pour les autres facteurs persistants, sa fréquence est individualisée, même si le premier bilan ne démontre pas de maladie.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><h3 id="n18-a05-partie-2">2. Faire une liste de produits réellement pris</h3><p data-evidence="N18-C0093" id="N18-C0093">Le <button class="w" data-k="n18-medicaments">bilan médicamenteux</button> inclut ordonnances, anti-inflammatoires achetés sans ordonnance, compléments, plantes, produits de contraste récents et adaptations prises pendant une maladie aiguë. Pour chaque produit : nom exact, dose, fréquence, date de début, motif et dernière prise. On recherche aussi les associations qui favorisent déshydratation, <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> ou interaction. Un patient peut considérer un complément comme un aliment et ne pas le citer spontanément.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><h3 id="n18-a05-partie-3">3. Interroger les symptômes et leurs explications concurrentes</h3><p data-evidence="N18-C0094" id="N18-C0094"><button class="w" data-k="n18-symptomes">Fatigue</button>, diminution de l’appétit, <button class="w" data-k="n18-symptomes">nausées</button>, <button class="w" data-k="n18-symptomes">prurit</button>, crampes ou <button class="w" data-k="n18-symptomes">nycturie</button> peuvent accompagner une atteinte avancée mais restent peu spécifiques. Une <button class="w" data-k="n18-volume">dyspnée</button> peut traduire surcharge, <button class="w" data-k="n18-fer-criteres">anémie</button> ou maladie cardiaque; elle exige son propre examen. L’<button class="w" data-k="n18-oedeme">œdème</button> ne prouve pas une cause rénale. On documente début, évolution, retentissement, traitements associés et signes nouveaux pour éviter de tout regrouper sous le diagnostic chronique.</p><p class="src">Sources : <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a05-partie-4">4. Mesurer avec une méthode reproductible</h3><p data-evidence="N18-C0095" id="N18-C0095">On mesure la pression avec un dispositif et un brassard adaptés, au repos, et on recherche une <button class="w" data-k="n18-orthostase">intolérance orthostatique</button> si symptômes ou fragilité. Poids, évolution pondérale et examen du <button class="w" data-k="n18-volume">volume extracellulaire</button> aident à interpréter œdèmes, <button class="w" data-k="n18-volume">dyspnée</button> ou déshydratation. L’auscultation pulmonaire, l’examen cardiovasculaire, cutané et urinaire se choisissent selon les hypothèses. Une cible tensionnelle n’a de sens qu’avec la méthode de mesure qui lui correspond.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><h3 id="n18-a05-partie-5">5. Identifier les motifs d’évaluation urgente</h3><p data-evidence="N18-C0096" id="N18-C0096">Une <button class="w" data-k="n18-volume">dyspnée</button> importante avec surcharge, une altération neurologique, une suspicion de péricardite urémique, une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> préoccupante, une oligurie nouvelle ou une dégradation rapide demandent une évaluation urgente. Une <button class="w" data-k="n18-hematurie">hématurie</button> associée à une baisse rapide de fonction et à des signes systémiques peut annoncer une atteinte glomérulaire grave. La décision dépend du tableau et des ressources; elle ne doit pas attendre le prochain contrôle programmé pour la maladie chronique.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><h3 id="n18-a05-partie-6">6. Conserver un point de comparaison utile</h3><p data-evidence="N18-C0097" id="N18-C0097">Le dossier de suivi rassemble la pression et sa méthode, le poids, les symptômes, les médicaments, le <button class="w" data-k="n18-dfg">DFGe</button> avec équation, l’<button class="w" data-k="n18-acr">ACR</button> avec unités et les événements depuis la dernière visite. Il précise aussi le responsable du prochain contrôle et les signes motivant un contact anticipé. Exercice : l’entretien de M. L. sépare les questions de cause, de tolérance médicamenteuse et de complication; cette séparation rend la transmission plus précise.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p><div class="key" data-evidence="N18-C0098" id="N18-C0098"><strong>À retenir.</strong> L’anamnèse recherche les expositions et les médicaments réellement pris, y compris les anti-inflammatoires achetés sans ordonnance. L’examen mesure la pression avec une méthode reproductible, apprécie le volume extracellulaire et repère les signes de gravité. Les données consignées servent ensuite de point de comparaison au suivi.</div><p><button class="w" data-k="n18-a05-fenetre-1">Examen de volume : technique et limites</button> <button class="w" data-k="n18-a05-fenetre-2">Traitements et néphrotoxicité : interrogatoire</button> </p><button class="pareto-btn ui" data-k="pareto-n18-a05">▲ Loi de Pareto — Anamnèse et examen clinique</button></section><section class="ilot" id="n18-a06"><h2><span class="n">A06</span> Diagnostic étiologique et orientation</h2><h3 id="n18-a06-partie-1">1. Choisir chaque examen pour une question</h3><p data-evidence="N18-C0099" id="N18-C0099">Le bilan doit répondre à quatre questions : quelle cause, quelle gravité actuelle, quelle complication et quelle évolution? La <button class="w" data-k="n18-creatinine">créatinine</button> et l’<button class="w" data-k="n18-acr">ACR</button> participent à plusieurs réponses, mais ne remplacent ni l’examen ni l’imagerie ciblée. Une exploration supplémentaire n’est utile que si son résultat peut modifier le diagnostic, la surveillance, le traitement ou l’information du patient.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><h3 id="n18-a06-partie-2">2. Associer les indices biologiques et urinaires</h3><p data-evidence="N18-C0100" id="N18-C0100">On confronte albuminurie, <button class="w" data-k="n18-proteinurie">protéinurie</button> et sédiment urinaire. Une <button class="w" data-k="n18-proteinurie">protéinurie</button> dont l’albumine n’explique qu’une faible part peut faire rechercher d’autres protéines, dont des chaînes légères selon le contexte. Une <button class="w" data-k="n18-hematurie">hématurie glomérulaire</button> associée à une <button class="w" data-k="n18-proteinurie">protéinurie</button> oriente autrement qu’une infection symptomatique. Immunologie, électrophorèse ou sérologies sont demandées selon les indices cliniques; elles ne forment pas un panel obligatoire identique pour tous.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a06-partie-3">3. Interroger la morphologie</h3><p data-evidence="N18-C0101" id="N18-C0101">L’<button class="w" data-k="n18-echographie">échographie</button> recherche notamment taille et asymétrie, aspect cortical, dilatation des cavités, kystes et autres anomalies structurelles. Un petit rein avec cortex aminci soutient une atteinte chronique; l’échogénicité est peu spécifique et dépend de comparaisons et de la technique. L’examen ne mesure pas directement la filtration séparée de chaque rein et ne remplace pas une histologie lorsqu’une question histologique précise demeure.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a06-partie-4">4. Discuter biopsie et génétique à partir d’un bénéfice attendu</h3><p data-evidence="N18-C0102" id="N18-C0102">Une <button class="w" data-k="n18-biopsie">biopsie rénale</button> se discute lorsque l’identification de la lésion peut guider le traitement ou le pronostic, après évaluation du risque et de l’acceptabilité. Un examen génétique peut être pertinent devant une histoire familiale, un phénotype évocateur ou une cause inexpliquée. Le patient doit connaître les limites de rendement et les conséquences possibles pour lui et sa famille. Ni la <button class="w" data-k="n18-biopsie">biopsie</button> ni le test génétique ne sont automatiques pour toute catégorie G3.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><h3 id="n18-a06-partie-5">5. Adresser selon les critères suisses et distinguer l’urgence</h3><p data-evidence="N18-C0103" id="N18-C0103">La SSN 2025 recommande un avis notamment pour <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30, <button class="w" data-k="n18-acr">ACR</button> persistant &gt; 30 mg/mmol, cause inconnue, progression, <button class="w" data-k="n18-hematurie">hématurie</button> glomérulaire, <button class="w" data-k="n18-resistance">hypertension résistante</button>, anomalie persistante du potassium, maladie héréditaire ou calculs récurrents. Une insuffisance aiguë ou une baisse abrupte persistante demande une orientation adaptée à sa gravité. Le <button class="w" data-k="n18-recours">dossier d’orientation</button> contient la chronologie, les analyses, l’imagerie, les traitements et la question adressée.</p><p data-evidence="N18-C0104" id="N18-C0104">La figure suivante est un algorithme publié de coordination des soins primaires en Australie; son dépistage, sa confirmation et son retour vers le suivi illustrent une organisation, sans constituer une directive suisse. Les branches cliniques appliquées ici sont celles de la SSN ci-dessus et de la démarche étiologique précédente. Le schéma ne contient pas à lui seul toutes les indications de <button class="w" data-k="n18-biopsie">biopsie</button> et d’imagerie exposées dans le texte.</p><figure><img src="assets/img/cycle2/n18/n18_02.gif" alt="Parcours publié de détection et de coordination des soins rénaux. Document australien : les critères suisses de recours sont ceux du texte adjacent." loading="lazy" width="780" height="881"><p data-evidence="N18-C0105" id="N18-C0105"><a href="assets/img/cycle2/n18/n18_02.gif" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></p><figcaption data-evidence="N18-C0106" id="N18-C0106">Parcours publié de détection et de coordination des soins rénaux. Document australien : les critères suisses de recours sont ceux du texte adjacent. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11179444/" target="_blank" rel="noopener">Source publiée</a> — Breonny Robson, Gary Deed et Richard K. S. Phoon — <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Conversion au format GIF; contenu conservé.</figcaption></figure><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p><h3 id="n18-a06-partie-6">6. Réviser une hypothèse quand les faits ne concordent pas</h3><p data-evidence="N18-C0107" id="N18-C0107">Si le patient supposé avoir une atteinte diabétique présente un sédiment actif, une progression rapide ou une asymétrie marquée, l’hypothèse doit être réexaminée. Une cause peut rester indéterminée après une exploration proportionnée; cette incertitude est documentée sans bloquer la protection. Pour M. L., l’<button class="w" data-k="n18-acr">ACR</button> A3 persistant motive déjà un avis selon la SSN, même si sa filtration reste au-dessus de 30.</p><p data-evidence="N18-C0929" id="N18-C0929">Le raisonnement de l’Examen fédéral demande de hiérarchiser les hypothèses : d’abord celles qui menacent le rein ou la vie à court terme, ensuite les causes habituelles de la maladie chronique. Le tableau suivant reprend les urgences néphrologiques listées par la stratégie des Hôpitaux universitaires de Genève, puis les grandes causes chroniques ; chaque ligne nomme l’élément qui discrimine et l’examen qui tranche.</p><table class="t"><thead><tr><th>Hypothèse, par gravité décroissante</th><th>Élément discriminant</th><th>Examen décisif et conduite</th></tr></thead><tbody><tr><td data-evidence="N18-C0930" id="N18-C0930">Glomérulonéphrite rapidement progressive</td><td data-evidence="N18-C0931" id="N18-C0931">Élévation rapide de la <button class="w" data-k="n18-creatinine">créatinine</button> avec oligoanurie, <button class="w" data-k="n18-hematurie">hématurie</button> glomérulaire et syndrome néphritique</td><td data-evidence="N18-C0932" id="N18-C0932">Sédiment urinaire, avis néphrologique en urgence ; la <button class="w" data-k="n18-biopsie">biopsie rénale</button> identifie la lésion</td></tr><tr><td data-evidence="N18-C0933" id="N18-C0933">Microangiopathie thrombotique</td><td data-evidence="N18-C0934" id="N18-C0934">Anémie hémolytique, thrombopénie, insuffisance rénale aiguë et hypertension sévère</td><td data-evidence="N18-C0935" id="N18-C0935">Hémogramme avec réticulocytes et lactate déshydrogénase, puis appel immédiat du néphrologue de garde</td></tr><tr><td data-evidence="N18-C0936" id="N18-C0936">Néphropathie à cylindres myélomateux</td><td data-evidence="N18-C0937" id="N18-C0937">Myélome connu ou suspecté ; <button class="w" data-k="n18-proteinurie">protéinurie</button> dont l’albumine n’explique qu’une faible part</td><td data-evidence="N18-C0938" id="N18-C0938">Chaînes légères libres et immunofixation, avis en urgence</td></tr><tr><td data-evidence="N18-C0939" id="N18-C0939">Syndrome urémique ou syndrome néphrotique</td><td data-evidence="N18-C0940" id="N18-C0940">Symptômes urémiques en catégorie G5 ; ou protéinurie de rang néphrotique, hypoalbuminémie et œdèmes</td><td data-evidence="N18-C0941" id="N18-C0941">Bilan électrolytique et acido-basique, protéinurie quantifiée, avis néphrologique urgent</td></tr><tr><td data-evidence="N18-C0942" id="N18-C0942">Atteinte aiguë sur maladie chronique</td><td data-evidence="N18-C0943" id="N18-C0943">Variation récente de <button class="w" data-k="n18-creatinine">créatinine</button> dans un contexte de diarrhée, de médicament ou d’obstacle</td><td data-evidence="N18-C0944" id="N18-C0944">Comparaison aux valeurs antérieures, revue des médicaments, échographie à la recherche d’une dilatation</td></tr><tr><td data-evidence="N18-C0945" id="N18-C0945">Maladie rénale associée au diabète</td><td data-evidence="N18-C0946" id="N18-C0946">Albuminurie dominante, déclin lent, sans hématurie ni drapeau rouge ; environ 40 % des diabétiques de type 2 développent une néphropathie</td><td data-evidence="N18-C0947" id="N18-C0947"><button class="w" data-k="n18-acr">ACR</button> répété, sédiment sans hématurie, absence des <button class="w" data-k="n18-drapeaux">drapeaux rouges du consensus suisse</button></td></tr><tr><td data-evidence="N18-C0948" id="N18-C0948">Atteinte vasculaire</td><td data-evidence="N18-C0949" id="N18-C0949">Contexte cardiovasculaire et hypertensif ; sténose des grosses artères ou atteinte des petits vaisseaux</td><td data-evidence="N18-C0950" id="N18-C0950">Échographie avec Doppler, recherche d’une asymétrie</td></tr><tr><td data-evidence="N18-C0951" id="N18-C0951">Maladie héréditaire, dont la polykystose autosomique dominante</td><td data-evidence="N18-C0952" id="N18-C0952">Antécédents familiaux, sujet plus jeune, kystes bilatéraux</td><td data-evidence="N18-C0953" id="N18-C0953">Échographie, puis conseil et éventuel test génétique</td></tr><tr><td data-evidence="N18-C0954" id="N18-C0954">Atteinte tubulo-interstitielle</td><td data-evidence="N18-C0955" id="N18-C0955">Exposition médicamenteuse, maladie auto-immune ou obstruction chronique ; albuminurie modeste</td><td data-evidence="N18-C0956" id="N18-C0956">Anamnèse médicamenteuse, protéinurie et albuminurie simultanées, échographie</td></tr></tbody></table><p data-evidence="N18-C0957" id="N18-C0957">La lecture commence toujours par les quatre premières lignes : leur élément discriminant se cherche le jour même, car le délai compte en jours. Les lignes suivantes se départagent ensuite par le sédiment, l’échographie et le rapport entre albuminurie et protéinurie. L’erreur fréquente consiste à conclure « néphropathie diabétique » chez un diabétique sans avoir lu le sédiment.</p><div class="quiz ui"><p>Quiz — Un homme de 58 ans, diabétique de type 2 depuis 4 ans, a un <button class="w" data-k="n18-dfg">DFGe</button> qui passe de 62 à 38 mL/min/1,73 m² en six semaines ; la bandelette montre du sang et le sédiment des hématies déformées. Quelle conduite est la plus juste ?</p><button data-ok="0">Retenir une néphropathie diabétique et introduire un inhibiteur SGLT2.</button><button data-ok="1">Rechercher une glomérulonéphrite rapidement progressive et demander un avis néphrologique urgent.</button><button data-ok="0">Contrôler la créatinine dans trois mois pour démontrer la chronicité.</button><p class="fb" hidden>La chute rapide du DFGe et l’hématurie glomérulaire sont deux drapeaux rouges du consensus suisse : elles ne cadrent pas avec une maladie rénale associée au diabète, d’évolution lente. La glomérulonéphrite rapidement progressive est une urgence néphrologique selon la stratégie des Hôpitaux universitaires de Genève ; attendre trois mois ferait perdre le rein.</p></div><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p><div class="key" data-evidence="N18-C0108" id="N18-C0108"><strong>À retenir.</strong> Chaque examen répond à une question de cause, de gravité, de complication ou d’évolution. La SSN adresse au néphrologue notamment pour un <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30 mL/min/1,73 m², un <button class="w" data-k="n18-acr">ACR</button> durablement &gt; 30 mg/mmol, une cause inconnue, une hématurie glomérulaire ou une progression. Le délai de l’avis dépend de la gravité du tableau, et les urgences néphrologiques passent avant toute hypothèse fréquente.</div><p><button class="w" data-k="n18-a06-fenetre-1">Recours néphrologique : critères</button> <button class="w" data-k="n18-drapeaux">Drapeaux rouges du consensus suisse</button> <button class="w" data-k="n18-a06-fenetre-2">Biopsie : question et limites</button> </p><button class="pareto-btn ui" data-k="pareto-n18-a06">▲ Loi de Pareto — Diagnostic étiologique et orientation</button></section>
