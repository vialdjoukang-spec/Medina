C0997">Mesures répétées avant et après trois mois</td><td data-evidence="N18-C0998" id="N18-C0998">Contrôles programmés</td><td data-evidence="N18-C0999" id="N18-C0999">Elle impose d’attendre si aucune autre preuve n’existe.</td></tr></tbody></table><h3>Ce que KDIGO interdit et ce qu’il permet</h3><p data-evidence="N18-C1000" id="N18-C1000">KDIGO interdit de présumer la chronicité sur une seule valeur anormale de DFGe ou d’ACR, car cette valeur peut traduire une atteinte rénale aiguë récente. Il permet en revanche de commencer un traitement de maladie rénale chronique dès la première présentation lorsque d’autres indices cliniques rendent la chronicité probable.</p><h3>Application au cas</h3><p data-evidence="N18-C1001" id="N18-C1001">M. L. apporte deux DFGe (43 puis 40 mL/min/1,73 m²) et deux ACR (38 puis 35 mg/mmol) à quatre mois d’intervalle : la sixième preuve est remplie. S’il n’avait apporté qu’un résultat, une échographie montrant deux reins petits à cortex aminci aurait fourni une preuve indépendante, sans attendre trois mois supplémentaires.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="n18-a02-fenetre-1" data-title="Chronicité : critères et limites"><h3>Une même créatinine, trois situations</h3><p data-evidence="N18-C1002" id="N18-C1002">Le document des Hôpitaux universitaires de Genève montre qu’une créatinine de 120 µmol/L peut correspondre à trois réalités : une fonction rénale normale chez une personne de 25 ans très musclée, une maladie chronique stable chez une personne dont les valeurs fluctuent entre 120 et 140 µmol/L sans changement de poids, ou une insuffisance rénale aiguë. Seule la comparaison avec les valeurs antérieures permet de trancher.</p><h3>Quelle variation dépasse le bruit de mesure ?</h3><p data-evidence="N18-C1003" id="N18-C1003">Une estimation varie d’un prélèvement à l’autre sans que la filtration change. KDIGO fixe donc des seuils au-delà desquels la variation doit être expliquée.</p><table class="t"><thead><tr><th>Situation</th><th>Seuil KDIGO 2024</th><th>Signification</th></tr></thead><tbody><tr><td data-evidence="N18-C1004" id="N18-C1004">Contrôle de routine d’une maladie chronique</td><td data-evidence="N18-C1005" id="N18-C1005">Variation du DFGe supérieure à 20 %</td><td data-evidence="N18-C1006" id="N18-C1006">La variation dépasse la variabilité attendue et impose une évaluation.</td></tr><tr><td data-evidence="N18-C1007" id="N18-C1007">Après début d’un traitement hémodynamique (inhibiteur de l’enzyme de conversion, sartan, inhibiteur SGLT2)</td><td data-evidence="N18-C1008" id="N18-C1008">Baisse supérieure à 30 %</td><td data-evidence="N18-C1009" id="N18-C1009">La baisse dépasse l’effet attendu du médicament.</td></tr><tr><td data-evidence="N18-C1010" id="N18-C1010">Suivi de l’albuminurie</td><td data-evidence="N18-C1011" id="N18-C1011">Doublement de l’ACR</td><td data-evidence="N18-C1012" id="N18-C1012">La variation dépasse la variabilité du laboratoire.</td></tr></tbody></table><p data-evidence="N18-C1013" id="N18-C1013">Exemple fictif : un DFGe qui passe de 50 à 42 baisse de 16 % ; un contrôle suffit pour confirmer la tendance. Un DFGe qui passe de 50 à 38 baisse de 24 % ; la variation dépasse 20 % et appelle une recherche de cause.</p><h3>Les pièges préanalytiques</h3><p data-evidence="N18-C1014" id="N18-C1014">Un repas de viande ou de poisson cuit élève transitoirement la <button class="w" data-k="n18-creatinine">créatinine</button> : une étude citée par KDIGO décrit une hausse d’environ 20 µmol/L, équivalente dans cette population à une baisse apparente du DFGe d’environ 20 mL/min/1,73 m². KDIGO conseille d’attendre au moins 12 heures après un tel repas lorsque c’est possible. Un changement de masse musculaire ou un effort extrême produit le même type d’erreur.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a02-fenetre-2" data-title="Atteinte rénale : preuve et interprétation"><h3>Les marqueurs de lésion reconnus par KDIGO</h3><p data-evidence="N18-C1015" id="N18-C1015">La maladie rénale chronique ne se limite pas à une filtration basse. KDIGO accepte sept marqueurs de lésion, chacun suffisant s’il persiste au moins trois mois. Le tableau indique un exemple concret et ce que le dossier doit contenir.</p><table class="t"><thead><tr><th>Marqueur</th><th>Exemple concret</th><th>À documenter</th></tr></thead><tbody><tr><td data-evidence="N18-C1016" id="N18-C1016">Albuminurie, ACR ≥ 3 mg/mmol</td><td data-evidence="N18-C1017" id="N18-C1017">ACR de 5 mg/mmol confirmé sur une urine du matin</td><td data-evidence="N18-C1018" id="N18-C1018">Deux mesures datées et les conditions de prélèvement</td></tr><tr><td data-evidence="N18-C1019" id="N18-C1019">Anomalies du sédiment urinaire</td><td data-evidence="N18-C1020" id="N18-C1020">Cylindres d’hématies au microscope</td><td data-evidence="N18-C1021" id="N18-C1021">Examen microscopique et contexte infectieux</td></tr><tr><td data-evidence="N18-C1022" id="N18-C1022">Hématurie persistante</td><td data-evidence="N18-C1023" id="N18-C1023">Hématurie retrouvée à plusieurs reprises</td><td data-evidence="N18-C1024" id="N18-C1024">Persistance et origine glomérulaire ou urologique</td></tr><tr><td data-evidence="N18-C1025" id="N18-C1025">Anomalies électrolytiques d’origine tubulaire</td><td data-evidence="N18-C1026" id="N18-C1026">Trouble électrolytique expliqué par une tubulopathie</td><td data-evidence="N18-C1027" id="N18-C1027">Lien établi entre trouble et maladie tubulaire</td></tr><tr><td data-evidence="N18-C1028" id="N18-C1028">Anomalies histologiques</td><td data-evidence="N18-C1029" id="N18-C1029">Fibrose ou atrophie sur une biopsie</td><td data-evidence="N18-C1030" id="N18-C1030">Compte rendu anatomopathologique</td></tr><tr><td data-evidence="N18-C1031" id="N18-C1031">Anomalies structurelles à l’imagerie</td><td data-evidence="N18-C1032" id="N18-C1032">Kystes multiples et bilatéraux</td><td data-evidence="N18-C1033" id="N18-C1033">Description morphologique datée</td></tr><tr><td data-evidence="N18-C1034" id="N18-C1034">Antécédent de transplantation rénale</td><td data-evidence="N18-C1035" id="N18-C1035">Personne greffée avec DFGe de 70</td><td data-evidence="N18-C1036" id="N18-C1036">Date de greffe</td></tr></tbody></table><h3>Une nuance souvent oubliée</h3><p data-evidence="N18-C1037" id="N18-C1037">KDIGO souligne que la définition accepte tous ces marqueurs, alors que la classification n’utilise que deux axes : la catégorie G et la catégorie A. Une personne porteuse de reins polykystiques avec DFGe de 95 et ACR de 1 mg/mmol a donc une maladie rénale chronique classée G1 A1, avec une cause précisée. La fiche SSN 2025 retient le même cadre pour le dépistage : DFGe inférieur à 60 et/ou ACR d’au moins 3 mg/mmol pendant au moins trois mois, ou autres indications de chronicité.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="n18-a03-fenetre-1" data-title="Filtration et albuminurie : axes distincts"><h3>Deux structures différentes, deux mesures différentes</h3><p data-evidence="N18-C1038" id="N18-C1038">Le DFGe reflète la somme du travail de filtration de tous les néphrons fonctionnels. L’albuminurie reflète l’état de la barrière glomérulaire, formée d’un endothélium fenêtré, d’une membrane basale et des prolongements des podocytes séparés par des fentes de filtration. Le document des Hôpitaux universitaires de Genève précise que l’albuminurie n’est pas spécifique d’une maladie mais du compartiment atteint, et qu’elle peut précéder la baisse du DFGe.</p><h3>Lire une protéinurie avec sa part d’albumine</h3><p data-evidence="N18-C1039" id="N18-C1039">Lorsque la protéinurie contient plus de 60 % d’albumine, elle est considérée comme glomérulaire. Lorsqu’elle en contient moins de 50 %, elle est considérée comme tubulaire ou de surcharge ; une recherche de chaînes légères devient alors nécessaire. Exemple fictif : une protéinurie de 1 g/24 h dont l’albumine ne représente que 0,3 g (30 %) oriente vers une protéinurie non glomérulaire, et la recherche de chaînes légères précède toute autre hypothèse.</p><h3>Les profils discordants</h3><p data-evidence="N18-C1040" id="N18-C1040">Les deux axes peuvent diverger, car ils n’explorent pas la même structure. Le tableau donne deux profils fréquents et la question qu’ils posent.</p><table class="t"><thead><tr><th>Profil</th><th>Ce qu’il signifie</th><th>Question suivante</th></tr></thead><tbody><tr><td data-evidence="N18-C1041" id="N18-C1041">G1–G2 avec A3</td><td data-evidence="N18-C1042" id="N18-C1042">Barrière glomérulaire lésée alors que la masse filtrante est conservée</td><td data-evidence="N18-C1043" id="N18-C1043">Quelle atteinte glomérulaire, et quel risque malgré un DFGe normal ?</td></tr><tr><td data-evidence="N18-C1044" id="N18-C1044">G3b–G4 avec A1</td><td data-evidence="N18-C1045" id="N18-C1045">Perte de filtration sans fuite importante d’albumine</td><td data-evidence="N18-C1046" id="N18-C1046">Quelle cause explique la perte de néphrons sans lésion glomérulaire active ?</td></tr></tbody></table><p data-evidence="N18-C1047" id="N18-C1047">La borne entre A2 et A3 n’est pas écrite de la même façon dans tous les textes ; la <button class="w" data-k="n18-a3-borne">frontière de 30 mg/mmol</button> est exposée séparément.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a03-fenetre-2" data-title="Matrice de risque : lecture et limites"><h3>Les nombres inscrits dans chaque case</h3><p data-evidence="N18-C1048" id="N18-C1048">Les cases de la matrice adaptée de KDIGO portent un nombre : la fréquence minimale de contrôles par an. Le consensus SSED/SSN ajoute une consigne d’action. Le tableau reproduit cette grille pour l’adulte ; « référer » signifie demander un avis néphrologique.</p><table class="t"><thead><tr><th>Catégorie G</th><th>A1 (&lt; 3 mg/mmol)</th><th>A2</th><th>A3</th></tr></thead><tbody><tr><td data-evidence="N18-C1049" id="N18-C1049">G1 (≥ 90)</td><td data-evidence="N18-C1050" id="N18-C1050">Dépistage</td><td data-evidence="N18-C1051" id="N18-C1051">Traiter, 1</td><td data-evidence="N18-C1052" id="N18-C1052">Traiter et orienter, 3</td></tr><tr><td data-evidence="N18-C1053" id="N18-C1053">G2 (60–89)</td><td data-evidence="N18-C1054" id="N18-C1054">Dépistage</td><td data-evidence="N18-C1055" id="N18-C1055">Traiter, 1</td><td data-evidence="N18-C1056" id="N18-C1056">Traiter et orienter, 3</td></tr><tr><td data-evidence="N18-C1057" id="N18-C1057">G3a (45–59)</td><td data-evidence="N18-C1058" id="N18-C1058">Traiter, 1</td><td data-evidence="N18-C1059" id="N18-C1059">Traiter, 2</td><td data-evidence="N18-C1060" id="N18-C1060">Traiter et référer, 3</td></tr><tr><td data-evidence="N18-C1061" id="N18-C1061">G3b (30–44)</td><td data-evidence="N18-C1062" id="N18-C1062">Traiter, 2</td><td data-evidence="N18-C1063" id="N18-C1063">Traiter et référer, 3</td><td data-evidence="N18-C1064" id="N18-C1064">Traiter et référer, 3</td></tr><tr><td data-evidence="N18-C1065" id="N18-C1065">G4 (15–29)</td><td data-evidence="N18-C1066" id="N18-C1066">Traiter et référer, 3</td><td data-evidence="N18-C1067" id="N18-C1067">Traiter et référer, 3</td><td data-evidence="N18-C1068" id="N18-C1068">Traiter et référer, 4 et plus</td></tr><tr><td data-evidence="N18-C1069" id="N18-C1069">G5 (&lt; 15)</td><td data-evidence="N18-C1070" id="N18-C1070">Traiter et référer, 4 et plus</td><td data-evidence="N18-C1071" id="N18-C1071">Traiter et référer, 4 et plus</td><td data-evidence="N18-C1072" id="N18-C1072">Traiter et référer, 4 et plus</td></tr></tbody></table><h3>Comment la lire</h3><p data-evidence="N18-C1073" id="N18-C1073">M. L., en G3b A3, se situe dans une case « traiter et référer » avec au moins trois contrôles par an. Le document des Hôpitaux universitaires de Genève traduit les couleurs de la même manière : vert, un contrôle par an ; jaune, deux ; orange, trois ; rouge, au moins quatre, voire un par mois juste avant une dialyse.</p><h3>Ce que la grille ne dit pas</h3><p data-evidence="N18-C1074" id="N18-C1074">Ces fréquences sont des minimums de surveillance de la progression. Après l’introduction ou l’augmentation d’un bloqueur du système rénine–angiotensine, des contrôles supplémentaires s’ajoutent : une semaine en catégorie G3 ou plus chez le diabétique selon le consensus SSED/SSN, deux à quatre semaines selon KDIGO. La couleur compare des catégories ; elle ne remplace pas une équation de risque individuel.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a04-fenetre-1" data-title="Progression : trajectoires et biais"><h3>Calculer une pente avant de la qualifier</h3><p data-evidence="N18-C1075" id="N18-C1075">Le déclin annuel se calcule en soustrayant le DFGe d’une année de celui de l’année précédente. Le document des Hôpitaux universitaires de Genève demande des mesures faites dans le même laboratoire et en dehors d’un épisode aigu. Le tableau rassemble les qualifications publiées et leur conséquence.</p><table class="t"><thead><tr><th>Déclin</th><th>Qualification</th><th>Conséquence</th></tr></thead><tbody><tr><td data-evidence="N18-C1076" id="N18-C1076">0,75–1 mL/min/1,73 m² par an après 40 ans</td><td data-evidence="N18-C1077" id="N18-C1077">Physiologique (HUG)</td><td data-evidence="N18-C1078" id="N18-C1078">Surveillance selon la matrice</td></tr><tr><td data-evidence="N18-C1079" id="N18-C1079">2–3 mL/min/1,73 m² par an</td><td data-evidence="N18-C1080" id="N18-C1080">Modéré (HUG)</td><td data-evidence="N18-C1081" id="N18-C1081">Recherche des facteurs de progression</td></tr><tr><td data-evidence="N18-C1082" id="N18-C1082">5 mL/min/1,73 m² par an ou plus</td><td data-evidence="N18-C1083" id="N18-C1083">Rapide (HUG) ; drapeau rouge au-delà de 5 (SSED/SSN)</td><td data-evidence="N18-C1084" id="N18-C1084">Avis néphrologique</td></tr><tr><td data-evidence="N18-C1085" id="N18-C1085">Baisse de plus de 30 % en deux ans</td><td data-evidence="N18-C1086" id="N18-C1086">Progression rapide (HUG)</td><td data-evidence="N18-C1087" id="N18-C1087">Avis néphrologique</td></tr></tbody></table><h3>Exemple : deux critères qui ne coïncident pas</h3><p data-evidence="N18-C1088" id="N18-C1088">Exemple fictif : DFGe de 58 en 2024, 52 en 2025, 47 en 2026. La perte annuelle est de 6 puis 5 mL/min/1,73 m² : le déclin est rapide et constitue un drapeau rouge du consensus diabète. La baisse totale atteint 19 % en deux ans et reste inférieure au critère de 30 %. Un seul critère rempli suffit à justifier l’avis.</p><h3>Ne pas compter une baisse attendue comme une progression</h3><p data-evidence="N18-C1089" id="N18-C1089">Certains traitements abaissent la filtration par un mécanisme hémodynamique. La FI de Kerendia décrit une baisse moyenne du DFG de 2 à 3 mL/min/1,73 m² dans les quatre premières semaines, puis une stabilisation, réversible à l’arrêt. KDIGO considère qu’une baisse inférieure à 30 % après un traitement hémodynamique reste dans l’effet attendu. La pente se calcule donc à partir d’une nouvelle valeur de base, mesurée après cette phase initiale.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>.</p></template>
<template data-pop="n18-a04-fenetre-2" data-title="Recherche causale : examens orientés"><h3>Quatre familles d’examens</h3><p data-evidence="N18-C1090" id="N18-C1090">KDIGO classe les examens de recherche causale en quatre familles. Chacune répond à une question différente ; le tableau évite de demander un examen qui ne peut pas répondre à la question posée.</p><table class="t"><thead><tr><th>Famille</th><th>Exemples</th><th>Question posée</th></tr></thead><tbody><tr><td data-evidence="N18-C1091" id="N18-C1091">Imagerie</td><td data-evidence="N18-C1092" id="N18-C1092">Échographie, urographie intraveineuse, scanner, scintigraphie, IRM</td><td data-evidence="N18-C1093" id="N18-C1093">Forme, taille, symétrie, obstacle, kystes, reflux</td></tr><tr><td data-evidence="N18-C1094" id="N18-C1094">Biopsie rénale</td><td data-evidence="N18-C1095" id="N18-C1095">Ponction percutanée guidée par échographie</td><td data-evidence="N18-C1096" id="N18-C1096">Diagnostic exact, activité et chronicité, réponse attendue au traitement</td></tr><tr><td data-evidence="N18-C1097" id="N18-C1097">Biologie sanguine et urinaire</td><td data-evidence="N18-C1098" id="N18-C1098">Anticorps anti-membrane basale glomérulaire, anticorps anti-cytoplasme des polynucléaires neutrophiles, chaînes légères libres, électrophorèse et immunofixation, sédiment</td><td data-evidence="N18-C1099" id="N18-C1099">Glomérulopathie, vascularite, gammapathie monoclonale de signification rénale</td></tr><tr><td data-evidence="N18-C1100" id="N18-C1100">Génétique</td><td data-evidence="N18-C1101" id="N18-C1101">Gènes de la polykystose, du collagène IV ou de l’uromoduline</td><td data-evidence="N18-C1102" id="N18-C1102">Maladie héréditaire, même sans histoire familiale typique</td></tr></tbody></table><p data-evidence="N18-C1103" id="N18-C1103">KDIGO rappelle que les chaînes légères peuvent léser le rein même sans myélome, et que les causes génétiques sont plus fréquentes qu’on ne le pensait.</p><h3>Le bilan initial d’une créatinine élevée</h3><p data-evidence="N18-C1104" id="N18-C1104">Les Hôpitaux universitaires de Genève proposent un bilan à obtenir dans les 12 à 24 heures. Il comprend une formule sanguine, complétée par les réticulocytes et la lactate déshydrogénase en cas d’anémie, le CO2 total, la calcémie, la kaliémie, les chaînes légères libres avec immunofixation, le sédiment urinaire, un spot urinaire pour albuminurie, protéinurie et créatininurie, et une échographie de l’appareil urinaire avec Doppler. Ce bilan sépare rapidement une urgence glomérulaire, hématologique ou obstructive d’une maladie chronique stable.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a05-fenetre-1" data-title="Examen de volume : technique et limites"><h3>Trois façons de mesurer la pression</h3><p data-evidence="N18-C1105" id="N18-C1105">La même personne peut présenter trois valeurs tensionnelles selon la méthode. Le tableau précise le rôle de chacune dans la maladie rénale chronique.</p><table class="t"><thead><tr><th>Méthode</th><th>Rôle</th><th>Source</th></tr></thead><tbody><tr><td data-evidence="N18-C1106" id="N18-C1106">Mesure standardisée au cabinet</td><td data-evidence="N18-C1107" id="N18-C1107">Référence des objectifs KDIGO (systolique &lt; 120 mmHg si tolérée)</td><td data-evidence="N18-C1108" id="N18-C1108">KDIGO 2024</td></tr><tr><td data-evidence="N18-C1109" id="N18-C1109">Automesure avec appareil validé</td><td data-evidence="N18-C1110" id="N18-C1110">Suivi à domicile, contrôle du carnet à chaque consultation</td><td data-evidence="N18-C1111" id="N18-C1111">SSED/SSN ; HUG</td></tr><tr><td data-evidence="N18-C1112" id="N18-C1112">Mesure ambulatoire sur 24 heures (MAPA)</td><td data-evidence="N18-C1113" id="N18-C1113">Confirmation d’une hypertension et d’une résistance au traitement</td><td data-evidence="N18-C1114" id="N18-C1114">SSED/SSN</td></tr></tbody></table><h3>Pourquoi l’hypotension menace la filtration</h3><p data-evidence="N18-C1115" id="N18-C1115">La pression nette de filtration ne vaut qu’environ 10 mmHg. OpenStax indique que la filtration reste assurée tant que la pression artérielle moyenne dépasse environ 60 mmHg. La pression moyenne s’estime en ajoutant à la diastolique un tiers de la différence entre systolique et diastolique : pour 110/80 mmHg, 80 + 10 = 90 mmHg. Une hypotension orthostatique symptomatique signale donc un risque pour la perfusion rénale autant que pour la chute.</p><h3>Ce que l’examen doit contenir</h3><p data-evidence="N18-C1116" id="N18-C1116">Le document des Hôpitaux universitaires de Genève demande à chaque consultation une mesure de pression, le contrôle du carnet d’automesures, la recherche d’œdèmes et une auscultation cardio-pulmonaire. Sa liste de vérification sous inhibiteur de l’enzyme de conversion pose trois questions : hypotension orthostatique, hyperkaliémie, hausse de créatinine de plus de 30 %. KDIGO conseille un objectif moins intensif en cas de fragilité, de risque de chute ou d’hypotension orthostatique symptomatique.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-a05-fenetre-2" data-title="Traitements et néphrotoxicité : interrogatoire"><h3>Les produits qui modifient la conduite</h3><p data-evidence="N18-C1117" id="N18-C1117">L’interrogatoire médicamenteux cherche des produits précis, car chacun appelle une décision différente. Le tableau rassemble ceux que citent KDIGO, le consensus SSED/SSN et les Hôpitaux universitaires de Genève.</p><table class="t"><thead><tr><th>Produit ou exposition</th><th>Risque rénal décrit</th><th>Conduite</th></tr></thead><tbody><tr><td data-evidence="N18-C1118" id="N18-C1118">Anti-inflammatoires non stéroïdiens</td><td data-evidence="N18-C1119" id="N18-C1119">Atteinte rénale aiguë, néphrite interstitielle aiguë, hyperkaliémie</td><td data-evidence="N18-C1120" id="N18-C1120">À proscrire dans la maladie rénale chronique (SSED/SSN, HUG)</td></tr><tr><td data-evidence="N18-C1121" id="N18-C1121">Aminosides</td><td data-evidence="N18-C1122" id="N18-C1122">Nécrose tubulaire aiguë</td><td data-evidence="N18-C1123" id="N18-C1123">Suspension à envisager avant une chirurgie programmée (KDIGO)</td></tr><tr><td data-evidence="N18-C1124" id="N18-C1124">Produit de contraste iodé intraveineux</td><td data-evidence="N18-C1125" id="N18-C1125">Atteinte rénale aiguë</td><td data-evidence="N18-C1126" id="N18-C1126">Indication claire (SSN) ; protocole des sociétés de radiologie (KDIGO)</td></tr><tr><td data-evidence="N18-C1127" id="N18-C1127">Préparation colique à base de phosphate</td><td data-evidence="N18-C1128" id="N18-C1128">Citée parmi les produits à éviter pour protéger le rein</td><td data-evidence="N18-C1129" id="N18-C1129">À proscrire (HUG)</td></tr><tr><td data-evidence="N18-C1130" id="N18-C1130">Triméthoprime–sulfaméthoxazole</td><td data-evidence="N18-C1131" id="N18-C1131">Hyperkaliémie</td><td data-evidence="N18-C1132" id="N18-C1132">Surveillance du potassium (SSN)</td></tr><tr><td data-evidence="N18-C1133" id="N18-C1133">Bêtabloquant</td><td data-evidence="N18-C1134" id="N18-C1134">Hyperkaliémie</td><td data-evidence="N18-C1135" id="N18-C1135">Arrêt à discuter en cas d’hyperkaliémie (SSED/SSN)</td></tr></tbody></table><h3>La cascade de prescription</h3><p data-evidence="N18-C1136" id="N18-C1136">KDIGO décrit la cascade de prescription : un effet indésirable est pris pour une nouvelle maladie et traité par un nouveau médicament. Exemple publié : un œdème des chevilles dû à un anticalcique est traité par un diurétique, qui provoque ensuite une hypokaliémie et des vertiges. Avant toute nouvelle prescription, on vérifie donc si le symptôme provient d’un traitement existant.</p><h3>Le moment de la revue</h3><p data-evidence="N18-C1137" id="N18-C1137">KDIGO demande une revue complète des médicaments à intervalles réguliers et à chaque transition de soins : sortie d’hôpital, changement de médecin, nouvelle spécialité. Le document HUG de 2017 décrivait une préparation par bicarbonate avant un produit de contraste ; KDIGO 2024, plus récent, renvoie aux consensus des sociétés de radiologie, qui priment donc pour cette procédure.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a06-fenetre-1" data-title="Recours néphrologique : critères"><h3>Quatre textes, des seuils différents</h3><p data-evidence="N18-C1138" id="N18-C1138">Les critères d’orientation varient selon le texte et sa date. Le tableau les aligne par domaine ; la fiche SSN 2025, la plus récente des sources suisses générales, fixe la règle de base.</p><table class="t"><thead><tr><th>Domaine</th><th>SSN 2025</th><th>SSED/SSN 2024 (diabète)</th><th>KDIGO 2024</th><th>HUG 2017</th></tr></thead><tbody><tr><td data-evidence="N18-C1139" id="N18-C1139">Filtration</td><td data-evidence="N18-C1140" id="N18-C1140">DFGe &lt; 30</td><td data-evidence="N18-C1141" id="N18-C1141">DFGe trop bas pour l’âge</td><td data-evidence="N18-C1142" id="N18-C1142">DFGe &lt; 30 ; risque à 5 ans &gt; 3–5 %</td><td data-evidence="N18-C1143" id="N18-C1143">Clairance &lt; 45 avec cause claire</td></tr><tr><td data-evidence="N18-C1144" id="N18-C1144">Progression</td><td data-evidence="N18-C1145" id="N18-C1145">Progression, chute brutale persistante</td><td data-evidence="N18-C1146" id="N18-C1146">Baisse &gt; 5 mL/min/an ; baisse &gt; 30 % sous bloqueur</td><td data-evidence="N18-C1147" id="N18-C1147">Baisse soutenue &gt; 20 % (&gt; 30 % sous traitement hémodynamique)</td><td data-evidence="N18-C1148" id="N18-C1148">Déclin rapide ; baisse &gt; 30 % en 2 ans</td></tr><tr><td data-evidence="N18-C1149" id="N18-C1149">Albuminurie</td><td data-evidence="N18-C1150" id="N18-C1150">ACR systématiquement &gt; 30 mg/mmol</td><td data-evidence="N18-C1151" id="N18-C1151">Hausse rapide ; stade A3</td><td data-evidence="N18-C1152" id="N18-C1152">ACR ≥ 30 mg/mmol avec hématurie ; doublement ; &gt; 70 mg/mmol</td><td data-evidence="N18-C1153" id="N18-C1153">Protéinurie néphrotique ; sédiment actif</td></tr><tr><td data-evidence="N18-C1154" id="N18-C1154">Autres</td><td data-evidence="N18-C1155" id="N18-C1155">Cause inconnue, hématurie glomérulaire, hypertension résistante, potassium anormal persistant, maladie héréditaire, lithiase récurrente</td><td data-evidence="N18-C1156" id="N18-C1156">Syndrome néphrotique, hérédité, hypertension résistante</td><td data-evidence="N18-C1157" id="N18-C1157">Hypertension sous au moins 4 traitements, potassium, acidose, anémie, os, dénutrition</td><td data-evidence="N18-C1158" id="N18-C1158">Gammapathie monoclonale, histoire familiale</td></tr></tbody></table><h3>Lire les discordances</h3><p data-evidence="N18-C1159" id="N18-C1159">La fiche SSN 2025, plus récente, retient un seuil de 30 combiné à d’autres critères, alors que le document HUG de 2017 retenait 45 ; la règle suisse actuelle est celle de la SSN. L’hypertension résistante est définie sous trithérapie par le consensus SSED/SSN et sous au moins quatre traitements par KDIGO ; le texte suisse, qui oriente plus tôt, est retenu pour le patient diabétique.</p><h3>Application au cas</h3><p data-evidence="N18-C1160" id="N18-C1160">M. L., 60 ans, a un DFGe de 40 : le consensus diabète fixe à 60 le seuil « trop bas pour l’âge » entre 40 et 65 ans. Il présente donc un drapeau rouge, en plus de son ACR persistant au-dessus de 30 mg/mmol. Deux critères indépendants motivent l’avis.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a06-fenetre-2" data-title="Biopsie : question et limites"><h3>Ce qu’une biopsie peut apporter</h3><p data-evidence="N18-C1161" id="N18-C1161">KDIGO suggère la biopsie rénale comme examen diagnostique acceptable et sûr lorsque la situation clinique le justifie (suggestion de grade 2D). Le prélèvement percutané est guidé par échographie et examiné en microscopie optique, en immunofluorescence et en microscopie électronique, parfois avec des analyses moléculaires. Le tableau sépare les questions auxquelles elle répond de celles qui relèvent d’autres examens.</p><table class="t"><thead><tr><th>Question</th><th>La biopsie répond-elle ?</th><th>Examen adapté sinon</th></tr></thead><tbody><tr><td data-evidence="N18-C1162" id="N18-C1162">Quelle glomérulopathie ?</td><td data-evidence="N18-C1163" id="N18-C1163">Oui</td><td data-evidence="N18-C1164" id="N18-C1164">—</td></tr><tr><td data-evidence="N18-C1165" id="N18-C1165">Lésions actives ou cicatricielles ?</td><td data-evidence="N18-C1166" id="N18-C1166">Oui</td><td data-evidence="N18-C1167" id="N18-C1167">—</td></tr><tr><td data-evidence="N18-C1168" id="N18-C1168">Réponse probable au traitement ?</td><td data-evidence="N18-C1169" id="N18-C1169">Oui, en partie</td><td data-evidence="N18-C1170" id="N18-C1170">—</td></tr><tr><td data-evidence="N18-C1171" id="N18-C1171">Maladie génétique ?</td><td data-evidence="N18-C1172" id="N18-C1172">Parfois</td><td data-evidence="N18-C1173" id="N18-C1173">Analyse génétique</td></tr><tr><td data-evidence="N18-C1174" id="N18-C1174">Niveau de filtration globale ?</td><td data-evidence="N18-C1175" id="N18-C1175">Non</td><td data-evidence="N18-C1176" id="N18-C1176">DFGe, éventuellement DFG mesuré</td></tr><tr><td data-evidence="N18-C1177" id="N18-C1177">Obstacle sur les voies urinaires ?</td><td data-evidence="N18-C1178" id="N18-C1178">Non</td><td data-evidence="N18-C1179" id="N18-C1179">Échographie</td></tr></tbody></table><h3>Quand le rendement baisse</h3><p data-evidence="N18-C1180" id="N18-C1180">Le document des Hôpitaux universitaires de Genève décrit un aspect histologique commun aux maladies rénales chroniques évoluées : glomérulosclérose, artériosclérose, fibrose interstitielle et atrophie tubulaire. Hansen et collaborateurs décrivent au stade terminal des reins petits et homogènes. Une biopsie tardive montre donc surtout ces lésions communes, qui confirment l’ancienneté mais désignent rarement la maladie initiale. La décision appartient au néphrologue, qui pèse ce que le résultat peut changer au traitement.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="n18-a07-fenetre-1" data-title="Protection rénale : indication et preuve"><h3>La force des recommandations</h3><p data-evidence="N18-C1181" id="N18-C1181">Les traitements protecteurs ne reposent pas tous sur le même niveau de preuve. Le tableau associe chaque classe à la population étudiée et à la force attribuée par KDIGO 2024.</p><table class="t"><thead><tr><th>Classe</th><th>Population</th><th>Force KDIGO</th></tr></thead><tbody><tr><td data-evidence="N18-C1182" id="N18-C1182">Bloqueur du système rénine–angiotensine</td><td data-evidence="N18-C1183" id="N18-C1183">Diabète avec A2 ou A3, catégories G1–G4</td><td data-evidence="N18-C1184" id="N18-C1184">Recommandation 1B</td></tr><tr><td data-evidence="N18-C1185" id="N18-C1185">Bloqueur du système rénine–angiotensine</td><td data-evidence="N18-C1186" id="N18-C1186">Sans diabète, A3</td><td data-evidence="N18-C1187" id="N18-C1187">Recommandation 1B</td></tr><tr><td data-evidence="N18-C1188" id="N18-C1188">Bloqueur du système rénine–angiotensine</td><td data-evidence="N18-C1189" id="N18-C1189">Sans diabète, A2</td><td data-evidence="N18-C1190" id="N18-C1190">Suggestion 2C</td></tr><tr><td data-evidence="N18-C1191" id="N18-C1191">Inhibiteur SGLT2</td><td data-evidence="N18-C1192" id="N18-C1192">Diabète de type 2 et DFGe ≥ 20</td><td data-evidence="N18-C1193" id="N18-C1193">Recommandation 1A</td></tr><tr><td data-evidence="N18-C1194" id="N18-C1194">Inhibiteur SGLT2</td><td data-evidence="N18-C1195" id="N18-C1195">DFGe ≥ 20 avec ACR ≥ 20 mg/mmol, ou insuffisance cardiaque</td><td data-evidence="N18-C1196" id="N18-C1196">Recommandation 1A</td></tr><tr><td data-evidence="N18-C1197" id="N18-C1197">Antagoniste minéralocorticoïde non stéroïdien</td><td data-evidence="N18-C1198" id="N18-C1198">Diabète de type 2, DFGe &gt; 25, potassium normal, albuminurie malgré un bloqueur à dose maximale</td><td data-evidence="N18-C1199" id="N18-C1199">Suggestion 2A</td></tr></tbody></table><p data-evidence="N18-C1200" id="N18-C1200">KDIGO recommande aussi d’éviter toute association d’inhibiteur de l’enzyme de conversion, de sartan et d’inhibiteur direct de la rénine (1B). Le consensus SSED/SSN qualifie l’inhibiteur SGLT2 de recommandation à preuve élevée et la metformine de recommandation à preuve modérée.</p><h3>Lire un résultat d’essai</h3><p data-evidence="N18-C1201" id="N18-C1201">La FI de Forxiga rapporte pour DAPA-CKD un rapport de risques de 0,61 (intervalle de confiance à 95 % 0,51–0,72) et un nombre de patients à traiter de 19 sur 27 mois : traiter 19 personnes pendant environ 27 mois évite un événement du critère composite. La FI de Kerendia rapporte pour FIDELIO-DKD un rapport de risques de 0,82 (0,73–0,92) sur le critère rénal composite et de 0,86 (0,75–0,99) sur le critère cardiovasculaire ; l’hyperkaliémie y survenait chez 18,2 % des patients traités contre 9,0 % sous placebo. Le bénéfice et le risque se lisent ensemble.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>.</p></template>
<template data-pop="n18-a07-fenetre-2" data-title="Nutrition : objectifs et limites"><h3>Les repères chiffrés et leurs exceptions</h3><p data-evidence="N18-C1202" id="N18-C1202">Les recommandations nutritionnelles varient avec le stade, l’âge et l’état métabolique. Le tableau rassemble les repères de KDIGO 2024 et des Hôpitaux universitaires de Genève avec les situations où ils ne s’appliquent pas.</p><table class="t"><thead><tr><th>Nutriment</th><th>Repère</th><th>Exception</th></tr></thead><tbody><tr><td data-evidence="N18-C1203" id="N18-C1203">Protéines, G3–G5</td><td data-evidence="N18-C1204" id="N18-C1204">0,8 g/kg/j (KDIGO, suggestion 2C) ; 0,8–1 g/kg/j (HUG)</td><td data-evidence="N18-C1205" id="N18-C1205">Personne âgée fragile ou sarcopénique : cible plus élevée</td></tr><tr><td data-evidence="N18-C1206" id="N18-C1206">Protéines, plafond</td><td data-evidence="N18-C1207" id="N18-C1207">Éviter plus de 1,3 g/kg/j chez la personne à risque de progression</td><td data-evidence="N18-C1208" id="N18-C1208">—</td></tr><tr><td data-evidence="N18-C1209" id="N18-C1209">Régime très pauvre en protéines</td><td data-evidence="N18-C1210" id="N18-C1210">0,3–0,4 g/kg/j complété par acides aminés essentiels ou céto-analogues, jusqu’à 0,6 g/kg/j, sous surveillance étroite</td><td data-evidence="N18-C1211" id="N18-C1211">Interdit chez la personne métaboliquement instable</td></tr><tr><td data-evidence="N18-C1212" id="N18-C1212">Sodium</td><td data-evidence="N18-C1213" id="N18-C1213">Moins de 2 g/j, soit moins de 90 mmol/j ou moins de 5 g de NaCl</td><td data-evidence="N18-C1214" id="N18-C1214">Néphropathie avec perte de sel</td></tr><tr><td data-evidence="N18-C1215" id="N18-C1215">Phosphate ajouté</td><td data-evidence="N18-C1216" id="N18-C1216">Réduire les additifs (lettres E de la liste d’ingrédients)</td><td data-evidence="N18-C1217" id="N18-C1217">—</td></tr><tr><td data-evidence="N18-C1218" id="N18-C1218">Liquides</td><td data-evidence="N18-C1219" id="N18-C1219">1–2 L/j sans excès (HUG)</td><td data-evidence="N18-C1220" id="N18-C1220">Surcharge ou restriction prescrite</td></tr></tbody></table><h3>Un calcul pour un homme de 82 kg</h3><p data-evidence="N18-C1221" id="N18-C1221">Exemple fictif : 0,8 × 82 = 65,6 g de protéines par jour pour la cible KDIGO ; le plafond de 1,3 g/kg/j correspond à 106,6 g. Un régime très pauvre en protéines représenterait 24,6 à 32,8 g par jour et ne se prescrit qu’avec un suivi diététique spécialisé.</p><h3>Pourquoi ne pas restreindre davantage</h3><p data-evidence="N18-C1222" id="N18-C1222">Le document HUG explique qu’un apport inférieur à 0,8 g/kg/j freine la progression mais expose à une dénutrition capable d’annuler ce bénéfice. Il note qu’un apport de 0,8–1 g/kg/j correspond généralement à l’apport habituel en Suisse, et propose d’alterner viande rouge, viande blanche et poisson plutôt que d’interdire.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a08-fenetre-1" data-title="Troubles minéraux : mécanismes et mesures"><h3>La chaîne d’événements</h3><p data-evidence="N18-C1223" id="N18-C1223">Le document des Hôpitaux universitaires de Genève décrit une chaîne précise. La baisse du DFG réduit l’excrétion du phosphate et la production d’alpha-1-hydroxylase, donc de vitamine D active (1,25-dihydroxyvitamine D). Sans vitamine D activée, l’absorption intestinale du calcium diminue. L’organisme compense par deux hormones : le FGF23, hormone phosphaturiante sécrétée dès les stades précoces, puis la parathormone, qui maintient la calcémie en mobilisant les réserves osseuses.</p><h3>Les repères de suivi</h3><p data-evidence="N18-C1224" id="N18-C1224">Le tableau rassemble les repères publiés ; le traitement des troubles phosphocalciques relève du néphrologue.</p><table class="t"><thead><tr><th>Paramètre</th><th>Repère</th><th>Conduite</th></tr></thead><tbody><tr><td data-evidence="N18-C1225" id="N18-C1225">Calcium, phosphate, parathormone, phosphatase alcaline osseuse</td><td data-evidence="N18-C1226" id="N18-C1226">Suivi dès le stade 3 (HUG)</td><td data-evidence="N18-C1227" id="N18-C1227">Lecture conjointe et dans le temps</td></tr><tr><td data-evidence="N18-C1228" id="N18-C1228">Phosphatémie</td><td data-evidence="N18-C1229" id="N18-C1229">0,8–1,45 mmol/L (HUG)</td><td data-evidence="N18-C1230" id="N18-C1230">Chélateur non calcique de préférence au-delà de 1,45, prescrit par le néphrologue</td></tr><tr><td data-evidence="N18-C1231" id="N18-C1231">Parathormone</td><td data-evidence="N18-C1232" id="N18-C1232">2 à 9 fois la limite supérieure du laboratoire (HUG)</td><td data-evidence="N18-C1233" id="N18-C1233">Zone d’observation, pas une cible ; calcitriol si plus de 9 fois et en hausse</td></tr><tr><td data-evidence="N18-C1234" id="N18-C1234">25-hydroxyvitamine D</td><td data-evidence="N18-C1235" id="N18-C1235">Supérieure à 75 nmol/L (HUG)</td><td data-evidence="N18-C1236" id="N18-C1236">Supplémentation en cas de carence (SSED/SSN, SSN)</td></tr><tr><td data-evidence="N18-C1237" id="N18-C1237">Calcium apporté</td><td data-evidence="N18-C1238" id="N18-C1238">Selon les apports</td><td data-evidence="N18-C1239" id="N18-C1239">Substitution seulement si apport insuffisant (SSN)</td></tr></tbody></table><h3>Ce que l’on évite</h3><p data-evidence="N18-C1240" id="N18-C1240">Le document HUG déconseille les marqueurs de remodelage osseux hors avis spécialisé et demande de réduire calcitriol et analogues si la parathormone descend sous deux fois la limite supérieure. Le consensus SSED/SSN demande un avis néphrologique en cas d’hyperphosphatémie. KDIGO 2024 renvoie le détail de ces traitements à son texte spécifique sur le trouble minéral et osseux.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a08-fenetre-2" data-title="Anémie rénale : portée et renvois"><h3>Quatre mécanismes, pas un seul</h3><p data-evidence="N18-C1241" id="N18-C1241">Le document des Hôpitaux universitaires de Genève attribue l’anémie rénale à quatre mécanismes : déficit en érythropoïétine, inhibition de l’érythropoïèse par les toxines urémiques, durée de vie raccourcie des globules rouges et perte de l’homéostasie du fer. Corriger l’érythropoïétine seule ne corrige donc pas toujours l’anémie.</p><h3>Un algorithme en trois temps</h3><p data-evidence="N18-C1242" id="N18-C1242">Le tableau résume l’algorithme HUG ; les seuils martiaux de décision sont comparés dans la <button class="w" data-k="n18-fer-criteres">fenêtre sur le fer</button>.</p><table class="t"><thead><tr><th>Étape</th><th>Action</th><th>Délai</th></tr></thead><tbody><tr><td data-evidence="N18-C1243" id="N18-C1243">Dépistage</td><td data-evidence="N18-C1244" id="N18-C1244">Hémoglobine une fois par an en catégorie G3, deux fois en G4, quatre fois en G5 ou en hémodialyse</td><td data-evidence="N18-C1245" id="N18-C1245">Selon la catégorie</td></tr><tr><td data-evidence="N18-C1246" id="N18-C1246">Bilan</td><td data-evidence="N18-C1247" id="N18-C1247">Vitamine B12, folates, ferritine, saturation de la transferrine ; recherche d’une perte sanguine ou d’une hémolyse si anémie régénérative</td><td data-evidence="N18-C1248" id="N18-C1248">Avant tout traitement</td></tr><tr><td data-evidence="N18-C1249" id="N18-C1249">Fer</td><td data-evidence="N18-C1250" id="N18-C1250">Fer, de préférence intraveineux, si les réserves sont insuffisantes</td><td data-evidence="N18-C1251" id="N18-C1251">Contrôle de l’hémoglobine et du bilan martial après 2 à 4 semaines</td></tr><tr><td data-evidence="N18-C1252" id="N18-C1252">Agent stimulant l’érythropoïèse</td><td data-evidence="N18-C1253" id="N18-C1253">Prescrit par le néphrologue, toujours associé au fer, si hémoglobine &lt; 100 g/L après correction du déficit</td><td data-evidence="N18-C1254" id="N18-C1254">Selon la FI du produit</td></tr></tbody></table><h3>Deux règles de sécurité</h3><p data-evidence="N18-C1255" id="N18-C1255">Le consensus SSED/SSN exclut le fer en cas d’infection systémique active et réserve l’initiation de l’érythropoïétine recombinante au néphrologue. Le document HUG réserve les transfusions aux complications sévères de l’anémie et aux chocs hémorragiques, en raison du risque d’allo-immunisation.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-a09-fenetre-1" data-title="Suppléance : décision clinique et limites"><h3>Trois seuils de risque, trois décisions</h3><p data-evidence="N18-C1256" id="N18-C1256">KDIGO associe chaque niveau de risque d’insuffisance rénale nécessitant une suppléance à une décision d’organisation. Le tableau précise l’horizon de chaque seuil, qui ne se compare qu’à un calcul fait sur le même horizon.</p><table class="t"><thead><tr><th>Risque calculé</th><th>Horizon</th><th>Décision KDIGO</th></tr></thead><tbody><tr><td data-evidence="N18-C1257" id="N18-C1257">3–5 %</td><td data-evidence="N18-C1258" id="N18-C1258">5 ans</td><td data-evidence="N18-C1259" id="N18-C1259">Orientation néphrologique (point de pratique 2.2.1)</td></tr><tr><td data-evidence="N18-C1260" id="N18-C1260">Plus de 10 %</td><td data-evidence="N18-C1261" id="N18-C1261">2 ans</td><td data-evidence="N18-C1262" id="N18-C1262">Organisation des soins multidisciplinaires (point de pratique 2.2.2)</td></tr><tr><td data-evidence="N18-C1263" id="N18-C1263">Plus de 40 %, ou DFG &lt; 15–20</td><td data-evidence="N18-C1264" id="N18-C1264">2 ans</td><td data-evidence="N18-C1265" id="N18-C1265">Information sur les modalités, préparation de l’accès vasculaire, orientation vers la greffe (points de pratique 2.2.3 et 5.4.3)</td></tr></tbody></table><p data-evidence="N18-C1266" id="N18-C1266">Exemple fictif : un risque à deux ans de 12 % déclenche l’organisation multidisciplinaire mais pas encore la création d’un accès ; un risque de 45 % déclenche les deux.</p><h3>Protéger les veines dès G3b</h3><p data-evidence="N18-C1267" id="N18-C1267">Le document des Hôpitaux universitaires de Genève demande, dès la catégorie G3b, de préserver le capital veineux du membre supérieur non dominant, en vue d’une éventuelle fistule artério-veineuse. Le patient en est informé pour le signaler lui-même lors des prises de sang, et les prélèvements des différents intervenants sont regroupés.</p><h3>Le moment de commencer</h3><p data-evidence="N18-C1268" id="N18-C1268">KDIGO fonde le début de la dialyse sur une évaluation composite : symptômes, signes, qualité de vie, préférences, DFG et anomalies biologiques. Ce moment survient souvent, mais pas toujours, entre 5 et 10 mL/min/1,73 m². La greffe préemptive, avant toute dialyse, est préparée lorsque la trajectoire le permet.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a09-fenetre-2" data-title="Parcours conservateur : objectifs"><h3>Ce que les soins conservateurs complets comprennent</h3><p data-evidence="N18-C1269" id="N18-C1269">KDIGO demande d’informer chaque personne des options de suppléance et des soins conservateurs complets, de soutenir ce parcours lorsqu’elle ne choisit pas la suppléance, et de donner accès à la planification anticipée des soins. Le tableau traduit ces principes en actions concrètes.</p><table class="t"><thead><tr><th>Besoin</th><th>Action</th><th>Source</th></tr></thead><tbody><tr><td data-evidence="N18-C1270" id="N18-C1270">Symptômes urémiques</td><td data-evidence="N18-C1271" id="N18-C1271">Question à chaque consultation sur l’appétit, les nausées et la fatigue, avec un outil validé</td><td data-evidence="N18-C1272" id="N18-C1272">KDIGO, point de pratique 5.2.2.1</td></tr><tr><td data-evidence="N18-C1273" id="N18-C1273">Dénutrition</td><td data-evidence="N18-C1274" id="N18-C1274">Dépistage deux fois par an en G4–G5, après 65 ans ou en cas de perte de poids ou de fragilité</td><td data-evidence="N18-C1275" id="N18-C1275">KDIGO, point de pratique 5.2.3.2</td></tr><tr><td data-evidence="N18-C1276" id="N18-C1276">Humeur</td><td data-evidence="N18-C1277" id="N18-C1277">Dépistage d’une dépression</td><td data-evidence="N18-C1278" id="N18-C1278">HUG</td></tr><tr><td data-evidence="N18-C1279" id="N18-C1279">Coordination</td><td data-evidence="N18-C1280" id="N18-C1280">Équipe incluant diététique, gestion des médicaments, éducation, soutien éthique, psychologique et social</td><td data-evidence="N18-C1281" id="N18-C1281">KDIGO, point de pratique 5.3.1</td></tr><tr><td data-evidence="N18-C1282" id="N18-C1282">Projet de soins</td><td data-evidence="N18-C1283" id="N18-C1283">Planification anticipée, soins de fin de vie si nécessaire</td><td data-evidence="N18-C1284" id="N18-C1284">KDIGO, point de pratique 5.5.3</td></tr></tbody></table><h3>Adapter les traitements au but</h3><p data-evidence="N18-C1285" id="N18-C1285">KDIGO admet de réduire ou d’arrêter un inhibiteur de l’enzyme de conversion ou un sartan pour réduire les symptômes urémiques lorsque le DFGe est inférieur à 15. Le but du traitement change : la priorité devient le confort et l’autonomie. OpenStax rappelle les manifestations qui guident ce suivi : faiblesse, léthargie, dyspnée, œdèmes, anémie, acidose, troubles du rythme et perte d’appétit.</p><h3>Une décision révisable</h3><p data-evidence="N18-C1286" id="N18-C1286">Le document HUG insiste sur la cohérence des messages entre intervenants. La personne peut revenir sur son choix ; la décision est datée et réexaminée lorsque la situation clinique ou les priorités changent.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-a10-fenetre-1" data-title="Atteinte unilatérale : fonction et morphologie"><h3>Pourquoi le DFGe ne voit pas un rein isolé</h3><p data-evidence="N18-C1287" id="N18-C1287">Le DFGe est calculé à partir d’une concentration sanguine, commune aux deux reins : il estime la somme de leurs filtrations. Chaque rein contient environ 1,3 million de néphrons. Le document des Hôpitaux universitaires de Genève décrit l’hypertrophie des néphrons restants après une lésion ; ce mécanisme explique qu’une filtration globale puisse rester normale malgré un rein lésé.</p><h3>Ce que l’échographie apporte</h3><p data-evidence="N18-C1288" id="N18-C1288">Hansen et collaborateurs donnent les repères morphologiques utiles pour comparer deux reins. Le tableau associe chaque constat à son interprétation et à sa limite.</p><table class="t"><thead><tr><th>Constat</th><th>Interprétation</th><th>Limite</th></tr></thead><tbody><tr><td data-evidence="N18-C1289" id="N18-C1289">Longueur inférieure à 10 cm d’un côté</td><td data-evidence="N18-C1290" id="N18-C1290">Rein petit, possiblement cicatriciel</td><td data-evidence="N18-C1291" id="N18-C1291">La longueur normale de 10–12 cm suit la taille et l’âge</td></tr><tr><td data-evidence="N18-C1292" id="N18-C1292">Amincissement cortical focal</td><td data-evidence="N18-C1293" id="N18-C1293">Évoque une pyélonéphrite chronique</td><td data-evidence="N18-C1294" id="N18-C1294">Ne date pas la lésion</td></tr><tr><td data-evidence="N18-C1295" id="N18-C1295">Vitesse systolique de l’artère rénale supérieure à 180 cm/s</td><td data-evidence="N18-C1296" id="N18-C1296">Prédit une sténose de plus de 60 %</td><td data-evidence="N18-C1297" id="N18-C1297">Examen dépendant de l’opérateur</td></tr><tr><td data-evidence="N18-C1298" id="N18-C1298">Indice de résistance supérieur à 0,70</td><td data-evidence="N18-C1299" id="N18-C1299">Résistance rénovasculaire anormale</td><td data-evidence="N18-C1300" id="N18-C1300">Peu spécifique d’une cause</td></tr><tr><td data-evidence="N18-C1301" id="N18-C1301">Dilatation des cavités</td><td data-evidence="N18-C1302" id="N18-C1302">Obstacle possible</td><td data-evidence="N18-C1303" id="N18-C1303">Existe aussi sous diurétique, pendant la grossesse ou en cas de reflux</td></tr></tbody></table><h3>Exemple</h3><p data-evidence="N18-C1304" id="N18-C1304">Exemple fictif : rein droit de 8,5 cm, rein gauche de 11,5 cm, DFGe de 95 et ACR de 1 mg/mmol. La maladie est structurelle et unilatérale, avec une filtration globale conservée par le rein gauche. La surveillance porte sur la pression, l’ACR et le DFGe ; un Doppler recherche une cause vasculaire si l’histoire l’évoque.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a10-fenetre-2" data-title="Stade non précisé : données manquantes"><h3>Les données qui manquent le plus souvent</h3><p data-evidence="N18-C1305" id="N18-C1305">Un diagnostic « sans précision » traduit souvent un dossier incomplet. KDIGO fixe les informations qu’un laboratoire doit fournir et celles qu’une classification exige. Le tableau indique comment obtenir chaque donnée et ce qu’elle change.</p><table class="t"><thead><tr><th>Donnée manquante</th><th>Comment l’obtenir</th><th>Ce qu’elle change</th></tr></thead><tbody><tr><td data-evidence="N18-C1306" id="N18-C1306">DFGe avec l’équation utilisée</td><td data-evidence="N18-C1307" id="N18-C1307">Compte rendu qui nomme le marqueur (créatinine, cystatine C ou les deux) et l’équation</td><td data-evidence="N18-C1308" id="N18-C1308">Catégorie G et comparabilité dans le temps</td></tr><tr><td data-evidence="N18-C1309" id="N18-C1309">ACR avec unité</td><td data-evidence="N18-C1310" id="N18-C1310">Mesure sur urine du matin, confirmée</td><td data-evidence="N18-C1311" id="N18-C1311">Catégorie A et risque</td></tr><tr><td data-evidence="N18-C1312" id="N18-C1312">Date des deux mesures</td><td data-evidence="N18-C1313" id="N18-C1313">Dossier antérieur</td><td data-evidence="N18-C1314" id="N18-C1314">Preuve de chronicité</td></tr><tr><td data-evidence="N18-C1315" id="N18-C1315">Cause</td><td data-evidence="N18-C1316" id="N18-C1316">Anamnèse, sédiment, imagerie, avis spécialisé</td><td data-evidence="N18-C1317" id="N18-C1317">Traitement spécifique</td></tr><tr><td data-evidence="N18-C1318" id="N18-C1318">Trajectoire</td><td data-evidence="N18-C1319" id="N18-C1319">Au moins trois valeurs datées</td><td data-evidence="N18-C1320" id="N18-C1320">Rapidité de progression</td></tr></tbody></table><h3>Les normes de rendu des laboratoires</h3><p data-evidence="N18-C1321" id="N18-C1321">KDIGO demande que le laboratoire rende le DFGe arrondi à l’unité et rapporté à 1,73 m², signale comme bas tout DFGe inférieur à 60, arrondisse la créatinine à l’unité en µmol/L et la cystatine C au centième en mg/L. Le compte rendu indique le marqueur et l’équation utilisés. Ces normes permettent de reprendre un résultat ancien sans le recalculer.</p><h3>Exemple</h3><p data-evidence="N18-C1322" id="N18-C1322">Exemple fictif : une lettre mentionne une « maladie rénale chronique » avec une créatinine de 160 µmol/L en 2023, sans DFGe, sans ACR ni équation. On ne peut pas en déduire une catégorie G : l’âge, le sexe et l’équation manquent. On demande un DFGe actuel, un ACR et les résultats antérieurs avant de préciser la classification.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a11-fenetre-1" data-title="Maladie intercurrente : conduite documentée"><h3>Les médicaments concernés</h3><p data-evidence="N18-C1323" id="N18-C1323">KDIGO décrit des règles de jours de maladie : pendant une maladie aiguë déshydratante, certains médicaments sont suspendus temporairement. Le tableau associe chaque classe au risque qu’elle fait courir pendant une déshydratation ou une chirurgie.</p><table class="t"><thead><tr><th>Classe</th><th>Risque en situation aiguë</th></tr></thead><tbody><tr><td data-evidence="N18-C1324" id="N18-C1324">Sulfonylurées</td><td data-evidence="N18-C1325" id="N18-C1325">Suspension liée au jeûne avant une chirurgie</td></tr><tr><td data-evidence="N18-C1326" id="N18-C1326">Inhibiteurs de l’enzyme de conversion et sartans</td><td data-evidence="N18-C1327" id="N18-C1327">Hypotension, atteinte rénale aiguë</td></tr><tr><td data-evidence="N18-C1328" id="N18-C1328">Diurétiques</td><td data-evidence="N18-C1329" id="N18-C1329">Déplétion volémique, atteinte rénale aiguë</td></tr><tr><td data-evidence="N18-C1330" id="N18-C1330">Metformine</td><td data-evidence="N18-C1331" id="N18-C1331">Acidose lactique si une atteinte aiguë survient</td></tr><tr><td data-evidence="N18-C1332" id="N18-C1332">Anti-inflammatoires non stéroïdiens</td><td data-evidence="N18-C1333" id="N18-C1333">Atteinte rénale aiguë, néphrite interstitielle</td></tr><tr><td data-evidence="N18-C1334" id="N18-C1334">Inhibiteurs SGLT2</td><td data-evidence="N18-C1335" id="N18-C1335">Acidocétose de jeûne ou diabétique</td></tr></tbody></table><h3>Les quatre étapes qui doivent réussir</h3><p data-evidence="N18-C1336" id="N18-C1336">KDIGO souligne que ces règles reposent sur peu de preuves et peuvent nuire si une étape échoue. Le patient doit reconnaître la maladie déshydratante, retrouver la liste des médicaments à suspendre, les arrêter, puis les reprendre. L’échec le plus fréquent est l’absence de reprise ; une revue médicamenteuse dans le mois suivant est utile.</p><h3>Avant une chirurgie programmée</h3><p data-evidence="N18-C1337" id="N18-C1337">KDIGO propose de suspendre metformine, inhibiteurs de l’enzyme de conversion, sartans et inhibiteurs SGLT2 dans les 48 à 72 heures précédant une chirurgie programmée, et les inhibiteurs SGLT2 au moins trois à quatre jours avant. La FI de Forxiga demande l’interruption au moins trois jours avant une intervention lourde. Le document HUG demande d’informer le patient qu’il arrête son inhibiteur de l’enzyme de conversion en cas de vomissements ou de diarrhée.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>.</p></template>
<template data-pop="n18-a11-fenetre-2" data-title="Adaptation médicamenteuse : paramètre pertinent"><h3>Le paramètre dépend de l’enjeu</h3><p data-evidence="N18-C1338" id="N18-C1338">KDIGO module la précision exigée selon le risque du médicament. Le tableau résume ses points de pratique sur l’adaptation posologique, complétés par la règle des FI suisses.</p><table class="t"><thead><tr><th>Situation</th><th>Paramètre conseillé</th></tr></thead><tbody><tr><td data-evidence="N18-C1339" id="N18-C1339">Médicament éliminé par le rein, cas habituel</td><td data-evidence="N18-C1340" id="N18-C1340">DFGe fondé sur la créatinine</td></tr><tr><td data-evidence="N18-C1341" id="N18-C1341">Marge thérapeutique étroite, toxicité, estimation douteuse</td><td data-evidence="N18-C1342" id="N18-C1342">DFGe créatinine–cystatine C ou DFG mesuré</td></tr><tr><td data-evidence="N18-C1343" id="N18-C1343">Poids extrême</td><td data-evidence="N18-C1344" id="N18-C1344">DFGe non indexé sur la surface corporelle</td></tr><tr><td data-evidence="N18-C1345" id="N18-C1345">Fonction rénale instable</td><td data-evidence="N18-C1346" id="N18-C1346">Adaptation en tenant compte de l’absence d’état d’équilibre</td></tr><tr><td data-evidence="N18-C1347" id="N18-C1347">Toute prescription</td><td data-evidence="N18-C1348" id="N18-C1348">Respect du paramètre nommé par la FI du produit</td></tr></tbody></table><h3>Calculer une valeur non indexée</h3><p data-evidence="N18-C1349" id="N18-C1349">Exemple fictif : une personne de petite taille a un DFGe de 32 mL/min/1,73 m² et une surface corporelle de 1,45 m². Sa filtration non indexée vaut 32 × 1,45 / 1,73 = 26,8 mL/min. Pour un produit dont la FI fixe une limite à 30 mL/min sans indexation, cette personne se trouve sous la limite, alors que son DFGe indexé la place au-dessus.</p><h3>Trois FI, trois paramètres</h3><p data-evidence="N18-C1350" id="N18-C1350">La FI de Kerendia raisonne en DFGe indexé. La FI de Crestor raisonne en clairance de la créatinine. La FI d’Eliquis utilise directement la créatinine sérique, avec un critère de réduction de dose à 133 µmol/L ou plus. Le prescripteur applique le paramètre de chaque produit ; il ne remplace pas l’un par l’autre.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>.</p></template>
<template data-pop="n18-a12-fenetre-1" data-title="Critères formels : preuve de chronicité"><h3>Six profils pour appliquer la définition</h3><p data-evidence="N18-C1351" id="N18-C1351">La définition KDIGO exige un marqueur de lésion ou un DFG inférieur à 60, présent depuis au moins trois mois. Les six profils fictifs du tableau montrent comment la règle s’applique.</p><table class="t"><thead><tr><th>Profil</th><th>Conclusion</th><th>Raison</th></tr></thead><tbody><tr><td data-evidence="N18-C1352" id="N18-C1352">DFGe 52 puis 50 à quatre mois, ACR 1</td><td data-evidence="N18-C1353" id="N18-C1353">Maladie rénale chronique G3a A1</td><td data-evidence="N18-C1354" id="N18-C1354">Critère fonctionnel persistant</td></tr><tr><td data-evidence="N18-C1355" id="N18-C1355">DFGe 95, ACR 6 puis 5 à quatre mois</td><td data-evidence="N18-C1356" id="N18-C1356">Maladie rénale chronique G1 A2</td><td data-evidence="N18-C1357" id="N18-C1357">Albuminurie persistante</td></tr><tr><td data-evidence="N18-C1358" id="N18-C1358">DFGe 95, ACR 1, reins polykystiques</td><td data-evidence="N18-C1359" id="N18-C1359">Maladie rénale chronique G1 A1</td><td data-evidence="N18-C1360" id="N18-C1360">Marqueur structurel</td></tr><tr><td data-evidence="N18-C1361" id="N18-C1361">DFGe 95, ACR 1, aucun marqueur</td><td data-evidence="N18-C1362" id="N18-C1362">Pas de maladie rénale chronique</td><td data-evidence="N18-C1363" id="N18-C1363">G1 sans marqueur ne remplit pas les critères</td></tr><tr><td data-evidence="N18-C1364" id="N18-C1364">DFGe 55 unique pendant une gastro-entérite</td><td data-evidence="N18-C1365" id="N18-C1365">Pas de conclusion</td><td data-evidence="N18-C1366" id="N18-C1366">Valeur isolée, atteinte aiguë possible</td></tr><tr><td data-evidence="N18-C1367" id="N18-C1367">Personne greffée, DFGe 70, ACR 2</td><td data-evidence="N18-C1368" id="N18-C1368">Maladie rénale chronique G2 A1</td><td data-evidence="N18-C1369" id="N18-C1369">Antécédent de transplantation</td></tr></tbody></table><h3>Les implications pour la santé</h3><p data-evidence="N18-C1370" id="N18-C1370">KDIGO précise que G1 et G2 ne remplissent pas les critères en l’absence de lésion, et que la diminution « légère » de G2 se mesure par rapport au niveau du jeune adulte. Une catégorie G2 isolée décrit donc un niveau de filtration, pas une maladie : la définition exige une anomalie ayant des implications pour la santé.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a12-fenetre-2" data-title="Pareto de classification et suivi"><h3>Les seuils qui déclenchent une action</h3><p data-evidence="N18-C1371" id="N18-C1371">Un suivi efficace repose sur peu de seuils, chacun lié à une action. Le tableau les rassemble dans l’ordre où ils apparaissent en consultation.</p><table class="t"><thead><tr><th>Signal</th><th>Seuil</th><th>Action</th></tr></thead><tbody><tr><td data-evidence="N18-C1372" id="N18-C1372">Variation du DFGe</td><td data-evidence="N18-C1373" id="N18-C1373">Plus de 20 % entre deux contrôles</td><td data-evidence="N18-C1374" id="N18-C1374">Rechercher une cause (KDIGO)</td></tr><tr><td data-evidence="N18-C1375" id="N18-C1375">Baisse après traitement hémodynamique</td><td data-evidence="N18-C1376" id="N18-C1376">Plus de 30 %</td><td data-evidence="N18-C1377" id="N18-C1377">Rechercher hypovolémie, interaction ou autre cause (KDIGO)</td></tr><tr><td data-evidence="N18-C1378" id="N18-C1378">Créatinine après bloqueur du système rénine–angiotensine</td><td data-evidence="N18-C1379" id="N18-C1379">Hausse de plus de 30 % en quatre semaines</td><td data-evidence="N18-C1380" id="N18-C1380">Réévaluer le traitement (KDIGO)</td></tr><tr><td data-evidence="N18-C1381" id="N18-C1381">ACR</td><td data-evidence="N18-C1382" id="N18-C1382">Doublement</td><td data-evidence="N18-C1383" id="N18-C1383">Rechercher une cause (KDIGO)</td></tr><tr><td data-evidence="N18-C1384" id="N18-C1384">Potassium sous bloqueur</td><td data-evidence="N18-C1385" id="N18-C1385">Plus de 5,5 mmol/L ; plus de 6 mmol/L</td><td data-evidence="N18-C1386" id="N18-C1386">Réduire ; arrêter (SSED/SSN)</td></tr><tr><td data-evidence="N18-C1387" id="N18-C1387">Potassium sous Kerendia</td><td data-evidence="N18-C1388" id="N18-C1388">Plus de 5,5 mmol/L</td><td data-evidence="N18-C1389" id="N18-C1389">Interrompre, reprendre à 10 mg si ≤ 5,0 (FI)</td></tr><tr><td data-evidence="N18-C1390" id="N18-C1390">Bicarbonate</td><td data-evidence="N18-C1391" id="N18-C1391">Moins de 18 mmol/L</td><td data-evidence="N18-C1392" id="N18-C1392">Envisager un traitement alcalinisant (SSN, KDIGO)</td></tr><tr><td data-evidence="N18-C1393" id="N18-C1393">Hémoglobine sous Aranesp</td><td data-evidence="N18-C1394" id="N18-C1394">Hausse de plus de 2 g/dL en quatre semaines</td><td data-evidence="N18-C1395" id="N18-C1395">Réduire la dose d’environ 25 % (FI)</td></tr><tr><td data-evidence="N18-C1396" id="N18-C1396">Risque à deux ans</td><td data-evidence="N18-C1397" id="N18-C1397">Plus de 10 % ; plus de 40 %</td><td data-evidence="N18-C1398" id="N18-C1398">Soins multidisciplinaires ; préparation de la suppléance (KDIGO)</td></tr></tbody></table><h3>Comment s’en servir</h3><p data-evidence="N18-C1399" id="N18-C1399">Chaque ligne associe un nombre à une conduite et à sa source. Un seuil de FI s’applique au produit concerné ; un seuil de recommandation s’applique à la situation clinique. Les deux ne se substituent pas.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>.</p></template>
<template data-pop="n18-e01-fenetre-1" data-title="Estimation : variables, formule et calcul pas à pas"><h3>Un calcul chez une femme</h3><p data-evidence="N18-C1456" id="N18-C1456">Le corps du cours détaille le calcul CKD-EPI 2021 chez un homme. Le calcul chez une femme montre le rôle des deux constantes propres au sexe : k vaut 62 µmol/L et le facteur final vaut 1,012. Exemple fictif : femme de 70 ans, créatinine stable de 90 µmol/L.</p><table class="t"><thead><tr><th>Étape</th><th>Calcul</th><th>Résultat</th></tr></thead><tbody><tr><td data-evidence="N18-C1457" id="N18-C1457">Rapport créatinine/k</td><td data-evidence="N18-C1458" id="N18-C1458">90 / 62</td><td data-evidence="N18-C1459" id="N18-C1459">1,452</td></tr><tr><td data-evidence="N18-C1460" id="N18-C1460">Terme minimum</td><td data-evidence="N18-C1461" id="N18-C1461">min(1,452 ; 1) = 1, donc 1 à la puissance −0,241</td><td data-evidence="N18-C1462" id="N18-C1462">1</td></tr><tr><td data-evidence="N18-C1463" id="N18-C1463">Terme maximum</td><td data-evidence="N18-C1464" id="N18-C1464">1,452 à la puissance −1,2</td><td data-evidence="N18-C1465" id="N18-C1465">0,639</td></tr><tr><td data-evidence="N18-C1466" id="N18-C1466">Terme d’âge</td><td data-evidence="N18-C1467" id="N18-C1467">0,9938 à la puissance 70</td><td data-evidence="N18-C1468" id="N18-C1468">0,647</td></tr><tr><td data-evidence="N18-C1469" id="N18-C1469">Produit</td><td data-evidence="N18-C1470" id="N18-C1470">142 × 1 × 0,639 × 0,647 × 1,012</td><td data-evidence="N18-C1471" id="N18-C1471">59,4</td></tr></tbody></table><p data-evidence="N18-C1472" id="N18-C1472">Le DFGe vaut 59 mL/min/1,73 m², catégorie G3a si la valeur persiste. Chez une femme de 30 ans avec une créatinine de 50 µmol/L, le rapport vaut 0,806 : le terme minimum devient 0,806 à la puissance −0,241, soit 1,053, et le résultat atteint 126 mL/min/1,73 m².</p><h3>L’incertitude autour du résultat</h3><p data-evidence="N18-C1473" id="N18-C1473">KDIGO rappelle que, dans le meilleur des cas, 90 % des estimations se situent à moins de 30 % du DFG mesuré. Pour un DFG réel de 60, l’estimation se situe donc entre 42 et 78 chez 90 % des personnes. Un DFGe de 59 ne sépare pas G2 et G3a avec certitude : c’est la répétition et la trajectoire qui consolident la catégorie.</p><h3>Quand passer à un autre outil</h3><p data-evidence="N18-C1474" id="N18-C1474">Si une décision dépend d’une précision plus grande, KDIGO propose l’estimation combinée <button class="w" data-k="n18-cystatine">créatinine–cystatine C</button>, puis un DFG mesuré par la clairance d’un marqueur exogène. Le DFG mesuré a lui aussi une variabilité : 90 % des mesures répétées restent à moins de 15 % l’une de l’autre.</p><p class="src">Sources : <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-e01-fenetre-2" data-title="Indexation : surface corporelle et limites"><h3>Ce que signifie « par 1,73 m² »</h3><p data-evidence="N18-C1475" id="N18-C1475">KDIGO demande aux laboratoires de rendre le DFGe chez l’adulte rapporté à une surface corporelle de 1,73 m², en mL/min/1,73 m². Cette indexation rend les valeurs comparables d’une personne à l’autre et fonde les catégories G. Elle ne décrit pas la quantité de plasma réellement filtrée chez une personne donnée.</p><h3>Deux personnes, le même DFGe indexé</h3><p data-evidence="N18-C1476" id="N18-C1476">Exemple fictif : deux personnes ont un DFGe indexé de 46 mL/min/1,73 m². La première a une surface corporelle de 1,5 m² : sa filtration non indexée vaut 46 × 1,5 / 1,73 = 39,9 mL/min. La seconde a une surface de 2,3 m² : sa filtration non indexée vaut 46 × 2,3 / 1,73 = 61,2 mL/min. Leur catégorie G est identique, mais un médicament à marge étroite ne serait pas exposé de la même façon.</p><h3>Quelle valeur pour quel usage</h3><table class="t"><thead><tr><th>Usage</th><th>Valeur à employer</th><th>Source</th></tr></thead><tbody><tr><td data-evidence="N18-C1477" id="N18-C1477">Classification, dépistage, suivi</td><td data-evidence="N18-C1478" id="N18-C1478">DFGe indexé, mL/min/1,73 m²</td><td data-evidence="N18-C1479" id="N18-C1479">KDIGO, tableau 11</td></tr><tr><td data-evidence="N18-C1480" id="N18-C1480">Médicament à marge étroite chez une personne de poids extrême</td><td data-evidence="N18-C1481" id="N18-C1481">DFGe non indexé, mL/min</td><td data-evidence="N18-C1482" id="N18-C1482">KDIGO, point de pratique 4.2.4</td></tr><tr><td data-evidence="N18-C1483" id="N18-C1483">Obésité de classe III</td><td data-evidence="N18-C1484" id="N18-C1484">Estimation créatinine–cystatine C</td><td data-evidence="N18-C1485" id="N18-C1485">KDIGO, tableau 8</td></tr><tr><td data-evidence="N18-C1486" id="N18-C1486">Produit dont la FI fixe un paramètre</td><td data-evidence="N18-C1487" id="N18-C1487">Paramètre nommé par la FI</td><td data-evidence="N18-C1488" id="N18-C1488">FI du produit</td></tr></tbody></table><p data-evidence="N18-C1489" id="N18-C1489">La FI de Kerendia, par exemple, précise qu’aucun ajustement selon le poids corporel n’est nécessaire ; ses seuils s’expriment en DFGe indexé.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>.</p></template>
