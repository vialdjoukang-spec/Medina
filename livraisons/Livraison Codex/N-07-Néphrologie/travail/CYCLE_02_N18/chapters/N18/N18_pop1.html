<template data-pop="n18-e03-fenetre-1" data-title="Bilan des complications : références et discordances"><h3>Rechercher les complications selon stade et contexte</h3><p data-evidence="N18-C0699" id="N18-C0699">Potassium et bicarbonates explorent les risques électrolytique et acido-basique; hémogramme, ferritine et saturation de la transferrine explorent l’<button class="w" data-k="n18-fer-criteres">anémie</button>; calcium, phosphate et parathormone participent au bilan minéral. Les examens sont choisis et répétés selon la situation, les traitements et les résultats antérieurs. Une prise de sang « rénale » identique à toutes les consultations peut manquer la vraie question ou multiplier des analyses sans conséquence.</p><h3>Distinguer référence biologique et seuil de décision</h3><p data-evidence="N18-C0700" id="N18-C0700">La page publique HUG mise à jour le 9 mars 2026 donne comme repères usuels <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> 62–106 µmol/L, urée 2,8–7,1 mmol/L et potassium 3,6–4,6 mmol/L. Elle ne détaille pas une population, un sexe ou une méthode pour chacun : ces intervalles sont illustratifs et le compte rendu du laboratoire reste la référence individuelle. Le seuil de <button class="w" data-k="n18-dfg">DFGe</button> &lt; 60 pour définir une maladie persistante ou le potassium &gt; 5,5 pour interrompre la finérénone répondent à des décisions précises, pas à la définition générale d’une « norme suisse ».</p><h3>Explorer la discordance au lieu de masquer l’incertitude</h3><p data-evidence="N18-C0701" id="N18-C0701">Si le risque calculé semble faible malgré une glomérulonéphrite active, une progression rapide ou une maladie héréditaire particulière, le contexte et les modèles spécifiques peuvent primer. Le score ne doit pas être recalculé sur une <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> en variation aiguë comme si elle était stable. Une erreur d’unité d’<button class="w" data-k="n18-acr">ACR</button> multiplie artificiellement le signal; on vérifie d’abord les données d’entrée avant d’attribuer le résultat à la biologie.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>.</p></template>
<template data-pop="n18-e03-fenetre-2" data-title="Risque pronostique : variables, calcul et horizon"><h3>Calculer un risque avec un modèle identifié</h3><p data-evidence="N18-C0702" id="N18-C0702">La <button class="w" data-k="n18-calcul-kfre">KFRE</button> à quatre variables utilise âge, sexe, <button class="w" data-k="n18-dfg">DFGe</button> et <button class="w" data-k="n18-acr">ACR</button> pour estimer le risque de suppléance rénale. Pour rendre un exemple traçable, on retient la formule à cinq ans calibrée hors Amérique du Nord reproduite dans le tableau 1 de Schulz et collaborateurs, étude européenne de 2022 : risque = 1 − 0,9365<sup>exp(z)</sup>, avec z = −0,2201 × (âge/10 − 7,036) + 0,2467 × (homme − 0,5642) − 0,5567 × (<button class="w" data-k="n18-dfg">DFGe</button>/5 − 7,222) + 0,4510 × (ln <button class="w" data-k="n18-acr">ACR</button> − 5,137).</p><p data-evidence="N18-C0703" id="N18-C0703">L’âge est en années; « homme » vaut 1 pour un homme et 0 pour une femme; <button class="w" data-k="n18-dfg">DFGe</button> est en mL/min/1,73 m²; <button class="w" data-k="n18-acr">ACR</button> est impérativement en mg/g. ln est le logarithme naturel et exp(z) la fonction exponentielle. Exemple fictif : 60 ans, homme, <button class="w" data-k="n18-dfg">DFGe</button> 40, <button class="w" data-k="n18-acr">ACR</button> 300 mg/g donnent z ≈ 0,1580, exp(z) ≈ 1,1712, puis risque ≈ 0,07396, soit 7,4 % à cinq ans. Ce calcul distinct du cas initial utilise 300 mg/g, pas 300 mg/mmol.</p><p data-evidence="N18-C0704" id="N18-C0704"><button class="w" data-k="n18-calcul-kfre">Calcul KFRE à cinq ans</button> permet de revoir les grandeurs et les limites de l’exemple.</p><h3>Donner le domaine de validité du score</h3><p data-evidence="N18-C0705" id="N18-C0705">KDIGO recommande une équation extérieurement validée chez les adultes G3–G5; un modèle développé dans ces catégories peut être inadapté à G1–G2. La calibration non nord-américaine n’est pas une preuve de validation nationale suisse. Le résultat dépend des mesures, de la population, de la concurrence du décès et de l’horizon choisi. Un risque à cinq ans de 3–5 % peut contribuer à l’orientation selon KDIGO; les critères SSN restent applicables. Le seuil à deux ans de 40 % pour la préparation ne se compare pas au résultat à cinq ans.</p><h3>Explorer la discordance au lieu de masquer l’incertitude</h3><p data-evidence="N18-C0706" id="N18-C0706">Si le risque calculé semble faible malgré une glomérulonéphrite active, une progression rapide ou une maladie héréditaire particulière, le contexte et les modèles spécifiques peuvent primer. Le score ne doit pas être recalculé sur une <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> en variation aiguë comme si elle était stable. Une erreur d’unité d’<button class="w" data-k="n18-acr">ACR</button> multiplie artificiellement le signal; on vérifie d’abord les données d’entrée avant d’attribuer le résultat à la biologie.</p><p class="src">Sources : <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-s01-fenetre-1" data-title="Néphron : segments et fonctions"><h3>Du rein macroscopique aux voies excrétrices</h3><p data-evidence="N18-C0707" id="N18-C0707">Le cortex périphérique contient notamment les corpuscules rénaux; la médullaire contient des portions tubulaires organisées en pyramides. Les urines rejoignent papilles, calices, pelvis puis uretère. Cette continuité explique pourquoi une obstruction située en aval peut retentir sur la fonction en amont. L’imagerie distingue ces territoires et recherche dilatation, asymétrie ou anomalie parenchymateuse; elle n’observe pas directement chaque barrière de filtration.</p><h3>Suivre séparément le sang et le liquide tubulaire</h3><p data-evidence="N18-C0708" id="N18-C0708">Le sang arrive au glomérule par l’artériole afférente et en sort par l’artériole efférente, avant de rejoindre les réseaux capillaires autour des tubules. Le filtrat rejoint tubule proximal, anse, tubule distal et système collecteur. Ces deux circulations voisines permettent réabsorption et sécrétion. Dans la figure, les conduits orange représentent la voie tubulaire et le réseau rouge la vascularisation; la flèche finale désigne l’écoulement urinaire vers la papille, pas le sens du sang.</p><h3>Comprendre la barrière et les cellules normales</h3><p data-evidence="N18-C0709" id="N18-C0709">La barrière glomérulaire associe endothélium fenestré, membrane basale et prolongements des podocytes avec leurs fentes. Le mésangium soutient le réseau. La sélectivité de cette barrière et la récupération tubulaire contribuent à limiter l’albumine urinaire. Le tubule proximal possède une bordure en brosse et des cellules adaptées au transport; les autres segments ont des propriétés différentes. Une structure normale ne se résume donc pas à un simple tuyau perforé.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-s01-fenetre-2" data-title="Lésion histologique : description et portée"><h3>Comprendre la barrière et les cellules normales</h3><p data-evidence="N18-C0710" id="N18-C0710">La barrière glomérulaire associe endothélium fenestré, membrane basale et prolongements des podocytes avec leurs fentes. Le mésangium soutient le réseau. La sélectivité de cette barrière et la récupération tubulaire contribuent à limiter l’albumine urinaire. Le tubule proximal possède une bordure en brosse et des cellules adaptées au transport; les autres segments ont des propriétés différentes. Une structure normale ne se résume donc pas à un simple tuyau perforé.</p><h3>Identifier une lésion sans prétendre déterminer sa cause</h3><p data-evidence="N18-C0711" id="N18-C0711">Dans les maladies chroniques, glomérulosclérose, <button class="w" data-k="n18-s04-fenetre-2">fibrose</button> interstitielle, atrophie tubulaire et lésions vasculaires peuvent se combiner. La microphotographie publiée montre une glomérulosclérose segmentaire et focale, coloration PAS selon sa source : une partie du glomérule présente une matrice rose dense avec perte d’architecture capillaire, à côté de territoires plus ouverts. Elle illustre une lésion glomérulaire; elle ne montre pas toute la diversité des lésions chroniques ni une comparaison expérimentale normal/malade. La structure normale a été expliquée juste avant.</p><h3>Garder les limites de l’échantillon</h3><p data-evidence="N18-C0712" id="N18-C0712">Une <button class="w" data-k="n18-biopsie">biopsie</button> prélève une petite partie du rein. Une lésion focale peut ne pas être représentée et une <button class="w" data-k="n18-s04-fenetre-2">fibrose</button> renseigne sur l’ancienneté sans identifier à elle seule l’événement initial. L’anatomopathologiste confronte techniques, échantillon et contexte clinique. La corrélation utile va de la structure à la question : l’imagerie cherche notamment l’obstacle, l’histologie caractérise certaines lésions, et les marqueurs évaluent leurs conséquences fonctionnelles.</p><div class="key" data-evidence="N18-C0713" id="N18-C0713"><strong>Science → clinique.</strong> Une lésion glomérulaire peut provoquer une albuminurie avant une baisse importante de filtration.</div><div class="key" data-evidence="N18-C0714" id="N18-C0714"><strong>Science → examen.</strong> L’échographie recherche une anomalie structurelle; une <button class="w" data-k="n18-biopsie">biopsie</button> répond à une question histologique différente.</div><div class="key" data-evidence="N18-C0715" id="N18-C0715"><strong>Science → traitement.</strong> Une obstruction et une maladie glomérulaire ne reçoivent pas le même traitement causal.</div><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="n18-s02-fenetre-1" data-title="Filtration : grandeurs et unités"><h3>Définir les quantités avant les équations</h3><p data-evidence="N18-C0716" id="N18-C0716">Une concentration décrit une quantité par volume, par exemple mmol/L. Un débit volumique décrit un volume par temps, par exemple mL/min. Une quantité excrétée par temps est le produit de concentration urinaire et débit urinaire. Le débit de filtration décrit un volume de plasma filtré par temps; il diffère du volume final d’urine puisque le tubule récupère une grande part de l’eau. Cette distinction évite de confondre polyurie et bonne filtration.</p><h3>Écrire le bilan de masse</h3><p data-evidence="N18-C0717" id="N18-C0717">Pour une substance donnée : quantité excrétée = quantité filtrée − quantité réabsorbée + quantité sécrétée, toutes exprimées dans la même unité par temps. La figure publiée indique des directions de transport, sans attribuer une fraction identique à toutes les molécules. Une flèche sortant du tubule indique une réabsorption vers l’interstitium; une flèche entrant dans la lumière indique une sécrétion. Les protéines mentionnées au proximal correspondent aux petites quantités filtrées et récupérées, pas à une filtration normale massive de l’albumine.</p><h3>Faire un calcul de clairance sans confondre ses unités</h3><p data-evidence="N18-C0718" id="N18-C0718">La clairance d’une substance x se calcule Cx = Ux × V/Px : Ux est sa concentration urinaire, Px sa concentration plasmatique dans la même unité, et V le débit urinaire. Exemple fictif : Ux = 10 mmol/L, Px = 0,1 mmol/L et V = 1 mL/min donnent Cx = 10/0,1 × 1 = 100 mL/min. Les unités de concentration se simplifient; il reste un débit. La clairance représente un volume virtuel de plasma épuré par minute, pas un volume de substance recueilli.</p><p data-evidence="N18-C0719" id="N18-C0719"><button class="w" data-k="n18-calcul-clairance">Calcul de clairance</button> permet de revoir les grandeurs et les limites de l’exemple.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-s02-fenetre-2" data-title="Transport tubulaire : bases"><h3>Comprendre les transports segmentaires</h3><p data-evidence="N18-C0720" id="N18-C0720">Le tubule proximal récupère une grande fraction de l’eau et du sodium filtrés, ainsi que glucose, acides aminés et bicarbonate. La pompe sodium/potassium basolatérale entretient un gradient qui permet des transports couplés à la face luminale. L’anse contribue au gradient médullaire; les segments distaux et collecteurs ajustent notamment sodium, potassium, acide et eau sous influence hormonale. Un médicament qui agit sur un transport ne possède donc pas le même effet qu’un médicament qui modifie la pression glomérulaire.</p><h3>Comprendre ce qui arrive quand des néphrons sont perdus</h3><p data-evidence="N18-C0721" id="N18-C0721">Les néphrons restants peuvent augmenter leur travail et leur filtration individuelle. Cette adaptation maintient une partie de la fonction globale mais peut s’accompagner de contraintes glomérulaires et de mécanismes de progression. Une même filtration totale peut ainsi recouvrir un nombre différent de néphrons et une réserve différente. Le mécanisme explique pourquoi des médicaments peuvent modifier initialement l’hémodynamique tout en améliorant des résultats à plus long terme dans les populations étudiées.</p><h3>Rattacher la physiologie aux choix cliniques</h3><p data-evidence="N18-C0722" id="N18-C0722">Le furosémide augmente l’excrétion sodée pour traiter notamment une surcharge, mais une diurèse accrue ne prouve pas une réparation du rein. L’inhibition SGLT2 modifie un transport proximal et intervient dans la protection de certaines populations; son effet ne se réduit pas à la baisse de glycémie. La clinique vérifie volume, pression, électrolytes et fonction avant de traduire un mécanisme en traitement. La FI précise ensuite comment employer le produit choisi.</p><div class="key" data-evidence="N18-C0723" id="N18-C0723"><strong>Science → clinique.</strong> Une production d’urine conservée n’exclut pas une filtration basse, car les transports modifient le volume final.</div><div class="key" data-evidence="N18-C0724" id="N18-C0724"><strong>Science → examen.</strong> Une clairance confronte concentration urinaire, débit urinaire et concentration plasmatique avec des unités compatibles.</div><div class="key" data-evidence="N18-C0725" id="N18-C0725"><strong>Science → traitement.</strong> Un diurétique peut corriger une surcharge sans restaurer le nombre de néphrons.</div><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>.</p></template>
<template data-pop="n18-s03-fenetre-1" data-title="Équilibre acido-basique : bases et calculs"><h3>Maintenir un équilibre malgré la production d’acides</h3><p data-evidence="N18-C0726" id="N18-C0726">Le métabolisme produit des acides. Les tampons amortissent les variations de protons; la ventilation élimine le dioxyde de carbone; le rein récupère le bicarbonate filtré et participe à l’excrétion nette d’acide. Ces mécanismes ont des temporalités différentes. Une baisse des bicarbonates n’est donc pas interprétée isolément comme une incapacité rénale : diarrhée, production d’acides et troubles respiratoires peuvent modifier le même système.</p><h3>Suivre les transformations chimiques</h3><p data-evidence="N18-C0727" id="N18-C0727">La réaction H⁺ + HCO₃⁻ ⇄ H₂CO₃ ⇄ CO₂ + H₂O relie protons, bicarbonate, acide carbonique, dioxyde de carbone et eau. Dans le tubule proximal, la sécrétion d’un proton permet la récupération du bicarbonate filtré par des transformations et des transports successifs; ce proton peut être recyclé. L’élimination d’acide avec des tampons urinaires, notamment ammonium et phosphate, est une autre composante. Récupérer un bicarbonate filtré et produire un gain net de bicarbonate ne décrivent pas exactement le même bilan.</p><h3>Calculer un apport sans le confondre avec un bénéfice</h3><p data-evidence="N18-C0728" id="N18-C0728">Néphrotrans contient 500 mg de bicarbonate de sodium et 137 mg de sodium par capsule selon sa FI. Quatre capsules représentent 2 000 mg de bicarbonate et 548 mg de sodium par jour; huit représentent 4 000 mg et 1 096 mg de sodium. Le calcul quantifie une charge; il ne prouve pas que la dose convient. Pression, volume, électrolytes, équilibre acido-basique et contre-indications du produit déterminent la décision.</p><p data-evidence="N18-C0729" id="N18-C0729"><button class="w" data-k="n18-calcul-nutrition">Calcul de charge sodée</button> permet de revoir les grandeurs et les limites de l’exemple.</p><div class="key" data-evidence="N18-C0730" id="N18-C0730"><strong>Science → clinique.</strong> Une rétention d’acide et un trouble minéral peuvent compliquer la maladie sans définir sa cause.</div><div class="key" data-evidence="N18-C0731" id="N18-C0731"><strong>Science → examen.</strong> Bicarbonate et gaz du sang explorent une question différente de calcium, phosphate et parathormone.</div><div class="key" data-evidence="N18-C0732" id="N18-C0732"><strong>Science → traitement.</strong> Un alcalinisant sodé apporte une charge de sodium qui doit être confrontée au volume et à la pression.</div><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>.</p></template>
<template data-pop="n18-s03-fenetre-2" data-title="Métabolisme minéral : molécules et rétrocontrôles"><h3>Relier rein, calcium, os et hormones</h3><p data-evidence="N18-C0733" id="N18-C0733">La parathormone participe à la réponse à une baisse du calcium; le rein contribue à la réabsorption calcique et à l’activation de vitamine D, qui favorise l’absorption intestinale. Le phosphate et d’autres signaux participent au trouble minéral de la maladie chronique; ils ne sont pas tous représentés dans cette figure générale. Le schéma publié utilise 10 mg/dL comme repère simplifié du calcium sanguin, soit environ 2,5 mmol/L : cette valeur centrale n’est ni un seuil individuel ni une cible thérapeutique. Les indications « + » et « − » se lisent ici comme au-dessus et au-dessous de ce repère schématique.</p><p data-evidence="N18-C0734" id="N18-C0734">La <button class="w" data-k="n18-conversions">conversion du calcium de la figure</button> utilise le facteur publié par KDIGO; elle ne change pas la portée schématique du nombre.</p><h3>Expliquer les perturbations chroniques</h3><p data-evidence="N18-C0735" id="N18-C0735">Lorsque les fonctions rénales diminuent, l’excrétion de phosphate et la production de vitamine D active se modifient; les réponses hormonales cherchent à maintenir les concentrations et peuvent devenir pathologiques. Une parathormone augmentée ne s’interprète pas sans calcium, phosphate, statut vitaminique et évolution. La calcémie totale peut aussi dépendre de protéines circulantes; une mesure ionisée peut répondre à une autre question. L’ensemble explique pourquoi le traitement ne consiste pas à normaliser mécaniquement un seul nombre.</p><h3>Passer aux indications avec prudence</h3><p data-evidence="N18-C0736" id="N18-C0736">Une acidose pertinente peut conduire à une intervention nutritionnelle ou pharmacologique surveillée; une anomalie minérale nécessite une stratégie adaptée aux tendances et au stade. Le bicarbonate sodé apporte aussi du sodium, et certains traitements calciques peuvent exposer à un excès. La fiche SSN fournit un cadre suisse, tandis que les produits et situations complexes demandent leur information professionnelle et, selon le cas, un avis spécialisé.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>.</p></template>
<template data-pop="n18-s04-fenetre-1" data-title="Érythropoïèse : régulation et limites"><h3>Identifier les fonctions endocrines</h3><p data-evidence="N18-C0737" id="N18-C0737">Le rein participe à la production d’érythropoïétine, à l’activation de vitamine D et au système rénine–angiotensine. Ces fonctions expliquent des complications qui ne se réduisent pas à l’accumulation d’urée. L’érythropoïétine stimule la production médullaire de globules rouges; le calcitriol contribue au métabolisme minéral; la rénine intervient dans la régulation de pression et de sodium. Une maladie chronique peut perturber plusieurs fonctions simultanément.</p><h3>Lire une boucle de régulation</h3><p data-evidence="N18-C0738" id="N18-C0738">La rénine agit sur l’angiotensinogène pour former l’angiotensine I, puis l’enzyme de conversion participe à la formation d’angiotensine II. Cette dernière favorise notamment vasoconstriction et sécrétion d’aldostérone; l’aldostérone agit sur les transports distaux. La figure montre aussi l’action de l’hormone antidiurétique sur les aquaporines et l’eau. Ce sont des voies coordonnées, mais l’aldostérone et l’hormone antidiurétique restent deux hormones distinctes. Le schéma aide à situer un médicament sans suffire à établir son indication.</p><h3>Relier l’endocrinologie au bilan d’<button class="w" data-k="n18-fer-criteres">anémie</button></h3><p data-evidence="N18-C0739" id="N18-C0739">Une production d’érythropoïétine insuffisante contribue à une réponse médullaire inadéquate, mais la production de globules rouges exige aussi du fer disponible et d’autres facteurs. L’inflammation peut limiter l’utilisation du fer même avec une ferritine non basse. C’est pourquoi ferritine et saturation de la transferrine se lisent ensemble avec l’hémogramme et le contexte. Un agent stimulant l’érythropoïèse se choisit après bilan, avec objectifs et risques documentés.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>.</p></template>
<template data-pop="n18-s04-fenetre-2" data-title="Progression tissulaire : mécanismes démontrés"><h3>Comprendre adaptation et <button class="w" data-k="n18-s04-fenetre-2">fibrose</button></h3><p data-evidence="N18-C0740" id="N18-C0740">Après perte de néphrons, les unités restantes s’adaptent. Les contraintes hémodynamiques, l’albuminurie et les signaux inflammatoires ou profibrosants peuvent entretenir les lésions. Le document HUG décrit notamment le rôle de médiateurs comme TGF-β dans ces mécanismes. La <button class="w" data-k="n18-s04-fenetre-2">fibrose</button> est une accumulation de matrice et une transformation du tissu, pas une cause unique commune à toutes les maladies. Elle aide à comprendre la progression sans effacer la recherche de l’événement initial.</p><h3>Situer la génétique dans le raisonnement causal</h3><p data-evidence="N18-C0741" id="N18-C0741">Une histoire familiale, une présentation précoce, des anomalies structurelles ou des manifestations extrarénales peuvent motiver une exploration génétique. Le résultat peut préciser la cause, guider le conseil familial ou modifier un parcours, mais un test négatif n’exclut pas toutes les causes héréditaires. Le choix du test et le consentement nécessitent une question clinique et une information sur les limites. On ne déduit pas un mécanisme moléculaire du seul stade G.</p><h3>Faire trois corrélations utiles</h3><p data-evidence="N18-C0742" id="N18-C0742">Science vers clinique : la baisse de production d’érythropoïétine peut contribuer à la <button class="w" data-k="n18-symptomes">fatigue</button> par <button class="w" data-k="n18-fer-criteres">anémie</button>, sans en être l’unique explication. Science vers examen : la perturbation des boucles minérales motive la lecture conjointe de calcium, phosphate et parathormone. Science vers traitement : agir sur le système rénine–angiotensine peut protéger certaines maladies albuminuriques mais expose à hypotension et <button class="w" data-k="n18-hyperkal">hyperkaliémie</button>. Chaque corrélation conduit à une vérification, pas à une prescription automatique.</p><div class="key" data-evidence="N18-C0743" id="N18-C0743"><strong>Science → clinique.</strong> Une production insuffisante d’érythropoïétine peut contribuer à une <button class="w" data-k="n18-fer-criteres">anémie</button> symptomatique.</div><div class="key" data-evidence="N18-C0744" id="N18-C0744"><strong>Science → examen.</strong> Le bilan martial et l’hémogramme recherchent aussi des causes autres que la baisse d’érythropoïétine.</div><div class="key" data-evidence="N18-C0745" id="N18-C0745"><strong>Science → traitement.</strong> Un blocage hormonal utile exige une indication et un contrôle de pression, potassium et fonction.</div><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>.</p></template>
<template data-pop="n18-p01-fenetre-1" data-title="Monographie suisse : produit et forme"><h3>Attribuer une fonction précise à chaque produit</h3><p data-evidence="N18-C0746" id="N18-C0746">Les traitements n’ont pas tous le même objectif. <button class="w" data-k="n18-ramipril">Ramipril Zentiva</button>, <button class="w" data-k="n18-forxiga">Forxiga</button> et <button class="w" data-k="n18-kerendia">Kerendia</button> interviennent dans des stratégies protectrices avec indications propres. <button class="w" data-k="n18-lasix">Lasix 40 mg</button> traite notamment les œdèmes; <button class="w" data-k="n18-crestor">Crestor</button> contribue à la prévention cardiovasculaire; <button class="w" data-k="n18-nephrotrans">Néphrotrans</button>, <button class="w" data-k="n18-venofer">Venofer</button> et <button class="w" data-k="n18-aranesp">Aranesp</button> répondent à certaines complications. Chaque fenêtre détaille forme, dose, restrictions et surveillance du produit suisse exact.</p><p data-evidence="N18-C0747" id="N18-C0747">Des situations complémentaires appellent des produits précis : <button class="w" data-k="n18-ozempic">Ozempic</button> pour le diabète de type 2 et son indication rénale, <button class="w" data-k="n18-norvasc">Norvasc</button> ou <button class="w" data-k="n18-aldactone">Aldactone</button> dans des stratégies tensionnelles sélectionnées, <button class="w" data-k="n18-eliquis">Eliquis</button> pour certaines fibrillations auriculaires, <button class="w" data-k="n18-aspirine">Aspirine Cardio</button> pour certaines préventions secondaires, <button class="w" data-k="n18-lipides">Ezetrol ou Repatha</button> pour le risque lipidique et <button class="w" data-k="n18-veltassa">Veltassa</button> pour l’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button>. Chacun a des restrictions distinctes.</p><h3>Vérifier l’indication et la population</h3><p data-evidence="N18-C0748" id="N18-C0748">Une maladie G3 ne suffit pas à rendre l’un de ces produits nécessaire. L’indication repose sur albuminurie, diabète, pression, risque cardiovasculaire ou complication documentée. La finérénone dans le parcours rénal présenté concerne le diabète de type 2; l’algorithme d’insuffisance cardiaque présent dans sa FI récente est distinct. Le fer intraveineux nécessite une carence et une raison de ne pas utiliser efficacement la voie orale. La darbépoétine traite une <button class="w" data-k="n18-fer-criteres">anémie</button> symptomatique après bilan, sous conduite expérimentée.</p><h3>Lire le bénéfice avec les exclusions de l’essai</h3><p data-evidence="N18-C0749" id="N18-C0749">La FI Forxiga décrit <button class="w" data-k="n18-forxiga">DAPA-CKD</button> : 4 304 participants, <button class="w" data-k="n18-dfg">DFGe</button> 25–75, <button class="w" data-k="n18-acr">ACR</button> 200–5 000 mg/g, suivi médian 28,5 mois; environ deux tiers avaient un diabète de type 2 et 97 % un inhibiteur du système rénine–angiotensine. Pour le critère composite rénal et cardiovasculaire décrit dans la FI, le rapport de risques était 0,61, intervalle de confiance à 95 % 0,51–0,72; le nombre à traiter présenté était 19 sur 27 mois. Ces chiffres appartiennent à cette population et à cet horizon.</p><p data-evidence="N18-C0750" id="N18-C0750">La polykystose et certaines maladies immunologiques actives ou récemment immunosupprimées étaient exclues. La possibilité de poursuivre le produit en dialyse dans le protocole de l’essai ne supprime pas la restriction de la rubrique posologique suisse actuelle. On distingue donc résultat d’essai, recommandation internationale, autorisation et remboursement suisse.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic DualDose/FixDose (Juillet 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" target="_blank" rel="noopener">Information professionnelle suisse Norvasc (Avril 2023.)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Information professionnelle suisse Aspirine Cardio 100/300 (Mars 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561950025" target="_blank" rel="noopener">Information professionnelle suisse Ezetrol (Mars 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680656220019" target="_blank" rel="noopener">Information professionnelle suisse Repatha (Juin 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-p01-fenetre-2" data-title="Adaptation : formule ou tableau FI"><h3>Identifier la spécialité avant d’utiliser sa dose</h3><p data-evidence="N18-C0751" id="N18-C0751">La DCI est le nom de la substance; le nom commercial, la forme, le dosage et l’autorisation identifient le produit. Les informations professionnelles suisses ont été consultées pour les spécialités exactes citées. Une dose de finérénone de 40 mg disponible dans une autre indication de Kerendia ne devient pas le maximum du parcours néphropathie diabétique, qui reste 20 mg/jour. Un comprimé de Lasix 40 mg ne se confond pas avec une présentation injectable concentrée.</p><h3>Donner une dose avec sa progression et son contrôle</h3><p data-evidence="N18-C0752" id="N18-C0752">Pour la néphropathie selon la FI de Ramipril Zentiva, la dose initiale est 1,25 mg une fois par jour, doublée selon tolérance à intervalles de deux à trois semaines, jusqu’à 5 mg/jour. Forxiga est utilisé à 10 mg une fois par jour dans la néphropathie chronique, sous réserve de son admissibilité. Kerendia débute à 20 mg par jour si le <button class="w" data-k="n18-dfg">DFGe</button> atteint 60 mL/min/1,73 m² et à 10 mg s’il est compris entre 25 et 59 ; un inhibiteur modéré du CYP3A4 déjà prescrit, comme l’érythromycine ou le vérapamil, impose 10 mg quel que soit le <button class="w" data-k="n18-dfg">DFGe</button>. Le potassium et le <button class="w" data-k="n18-dfg">DFGe</button> sont recontrôlés à quatre semaines. Les adaptations détaillées des fenêtres font partie de la dose; elles ne sont pas des précautions facultatives ajoutées après prescription.</p><h3>Adapter sans inventer une règle de classe</h3><p data-evidence="N18-C0753" id="N18-C0753">Pour Forxiga, une initiation n’est pas recommandée si <button class="w" data-k="n18-dfg">DFGe</button> &lt; 25; le traitement déjà pris peut être poursuivi à 10 mg si le débit descend au-dessous, mais la FI demande l’arrêt avant dialyse ou transplantation. Pour Crestor, une clairance &lt; 30 mL/min contre-indique ce produit. Pour Ramipril Zentiva, une insuffisance hépatique limite la dose à 2,5 mg/jour. Ces règles différentes démontrent pourquoi « adapter au rein » doit être remplacé par un paramètre, un seuil et une action propres au produit.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>.</p></template>
<template data-pop="n18-p02-fenetre-1" data-title="Interaction : mécanisme et conduite"><h3>Rechercher les interactions qui changent la sécurité</h3><p data-evidence="N18-C0754" id="N18-C0754">Une association de médicaments augmentant le potassium peut devenir dangereuse, particulièrement avec filtration basse. Ramipril ne s’associe pas sans restriction aux autres bloqueurs du système rénine–angiotensine; Kerendia est contre-indiqué avec les inhibiteurs puissants du CYP3A4 ; un inhibiteur modéré déjà prescrit impose une dose initiale de 10 mg et une surveillance du potassium, et un antagoniste minéralocorticoïde supplémentaire est à éviter parce que les effets sur la kaliémie s’additionnent. Les anti-inflammatoires peuvent aggraver la fonction et réduire la réponse à certains traitements. La liste exacte des produits est revue à chaque transition de soins.</p><h3>Distinguer effet attendu et événement préoccupant</h3><p data-evidence="N18-C0755" id="N18-C0755">Une petite baisse initiale de <button class="w" data-k="n18-dfg">DFGe</button> après un traitement hémodynamique peut être compatible avec son mécanisme; une chute importante, une hypotension symptomatique ou une déshydratation nécessite une recherche. Une infection génitale sous Forxiga ne s’interprète pas comme une progression rénale. <button class="w" data-k="n18-symptomes">Nausées</button>, douleurs abdominales, malaise ou respiration inhabituelle doivent faire envisager une acidocétose sous inhibiteur SGLT2, même sans glycémie très élevée. La tolérance se juge sur le patient et les mesures, pas sur une seule étiquette d’effet indésirable.</p><h3>Repérer les prescriptions à éviter dans la situation présente</h3><p data-evidence="N18-C0756" id="N18-C0756">On évite les extrapolations : Forxiga pour le diabète de type 1, Crestor avec clairance &lt; 30, Aranesp si hypertension mal contrôlée, Venofer si <button class="w" data-k="n18-fer-criteres">anémie</button> sans carence ou surcharge martiale, et Néphrotrans lorsque sa contre-indication de régime pauvre en sel s’applique. Une recommandation de réduire les apports sodés n’autorise pas à ignorer la FI de l’alcalinisant. La contradiction doit conduire à une réévaluation du produit et de la stratégie, avec le spécialiste si nécessaire.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-p02-fenetre-2" data-title="Surveillance : variation attendue et alerte"><h3>Rendre la surveillance opérationnelle</h3><p data-evidence="N18-C0757" id="N18-C0757">Le tableau associe quelques contrôles au risque visé; les fenêtres de produits précisent les exceptions.</p><table><thead><tr><th>Produit</th><th>Contrôle utile</th><th>Décision attendue</th></tr></thead><tbody><tr><td data-evidence="N18-C0758" id="N18-C0758">Ramipril Zentiva</td><td data-evidence="N18-C0759" id="N18-C0759">Pression, <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> et potassium à une semaine chez le diabétique en catégorie G3 ou plus ou après une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> (consensus suisse) ; sinon généralement deux à quatre semaines après adaptation (KDIGO)</td><td data-evidence="N18-C0760" id="N18-C0760">Vérifier tolérance, cause d’une hausse importante et possibilité de poursuivre.</td></tr><tr><td data-evidence="N18-C0761" id="N18-C0761">Kerendia</td><td data-evidence="N18-C0762" id="N18-C0762">Potassium et <button class="w" data-k="n18-dfg">DFGe</button> à quatre semaines, puis à chaque ajout ou changement de dose d’un inhibiteur du CYP3A4</td><td data-evidence="N18-C0763" id="N18-C0763">Maintenir, augmenter ou interrompre selon l’algorithme rénal.</td></tr><tr><td data-evidence="N18-C0764" id="N18-C0764">Lasix</td><td data-evidence="N18-C0765" id="N18-C0765">Poids, symptômes, volume, électrolytes et fonction</td><td data-evidence="N18-C0766" id="N18-C0766">Éviter une déplétion en traitant la surcharge.</td></tr><tr><td data-evidence="N18-C0767" id="N18-C0767">Aranesp</td><td data-evidence="N18-C0768" id="N18-C0768">Hémoglobine chaque semaine ou deux semaines jusqu’à stabilité, pression et fer</td><td data-evidence="N18-C0769" id="N18-C0769">Employer la dose minimale efficace et éviter une hausse excessive.</td></tr></tbody></table><p data-evidence="N18-C0770" id="N18-C0770">Une date de prélèvement sans personne chargée de lire le résultat n’est pas un plan de surveillance complet.</p><h3>Prévoir l’interruption et la reprise</h3><p data-evidence="N18-C0771" id="N18-C0771">En cas de maladie aiguë avec apports insuffisants, le risque de déshydratation, d’acidocétose ou d’accumulation change. L’équipe rédige une conduite adaptée : produit concerné, raison, contrôle, contact et reprise. La FI Forxiga prévoit notamment l’interruption au moins trois jours avant une chirurgie majeure ou un jeûne prolongé; la reprise exige stabilité et alimentation. Une personne ne doit pas rester indéfiniment privée d’un traitement protecteur parce que la consigne initiale n’indiquait pas quand le réévaluer.</p><h3>Terminer par une décision argumentée et révisable</h3><p data-evidence="N18-C0772" id="N18-C0772">Pour M. L., on vérifie d’abord médicaments actuels, potassium, pression, cause et contexte. Une stratégie protectrice peut être discutée avec l’avis néphrologique motivé par A3; chaque ajout exige son indication, ses exclusions et son contrôle. Le <button class="w" data-k="n18-pareto">Pareto de la leçon</button> rappelle les points de sécurité des quatre onglets. Exercice : rédiger une justification de traitement avec le produit exact, puis une phrase indiquant quelle donnée conduirait à modifier ou interrompre ce choix.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-drapeaux" data-title="Drapeaux rouges — consensus suisse diabète et rein"><p data-evidence="N18-C0958" id="N18-C0958">Chez une personne diabétique de type 2, le consensus de la Société suisse d’endocrinologie et de diabétologie et de la Société suisse de néphrologie (publication initiale mai 2024) énumère les signes qui doivent faire adresser au néphrologue, parce qu’ils ne cadrent pas avec une maladie rénale associée au diabète d’évolution habituelle :</p><ul><li>une hématurie persistante ou un sédiment actif ;</li><li>une baisse rapide et soutenue du DFGe, de plus de 5 mL/min par an ;</li><li>une augmentation rapide de l’albuminurie, ou une albuminurie de catégorie A3 ;</li><li>un DFGe trop bas pour l’âge (tableau ci-dessous) ;</li><li>un syndrome néphrotique : protéinurie de rang néphrotique, hypoalbuminémie, œdèmes et hypercholestérolémie ;</li><li>des antécédents familiaux de maladie rénale héréditaire ;</li><li>une hypertension résistante, ou une baisse du DFGe de plus de 30 % après l’instauration d’un bloqueur du système rénine–angiotensine.</li></ul><p data-evidence="N18-C0959" id="N18-C0959">Le seuil d’âge se lit dans un tableau, car la filtration diminue physiologiquement avec l’âge :</p><table class="t"><thead><tr><th>Âge</th><th>DFGe jugé trop bas</th><th>Conséquence</th></tr></thead><tbody><tr><td>Moins de 40 ans</td><td>&lt; 75 mL/min/1,73 m²</td><td>Avis néphrologique</td></tr><tr><td>40 à 65 ans</td><td>&lt; 60 mL/min/1,73 m²</td><td>Avis néphrologique</td></tr><tr><td>Plus de 65 ans</td><td>&lt; 45 mL/min/1,73 m²</td><td>Avis néphrologique</td></tr></tbody></table><p data-evidence="N18-C0960" id="N18-C0960">Exemple fictif : une femme diabétique de 35 ans a un DFGe de 70 mL/min/1,73 m² ; cette valeur, banale à 70 ans, est trop basse pour son âge et justifie un avis. Ces drapeaux complètent les critères généraux de la fiche SSN 2025 (DFGe &lt; 30, ACR durablement &gt; 30 mg/mmol, cause inconnue, progression, hématurie glomérulaire), sans les remplacer.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template><template data-pop="n18-acidose-seuils" data-title="Bicarbonate : seuils suisses et internationaux"><p data-evidence="N18-C0961" id="N18-C0961">Deux textes suisses fixent des repères différents pour l’acidose métabolique de la maladie rénale chronique. Le tableau les place côte à côte ; il distingue une définition, un seuil d’intervention et une cible.</p><table class="t"><thead><tr><th>Bicarbonate sérique</th><th>Texte et population</th><th>Signification</th></tr></thead><tbody><tr><td>&lt; 18 mmol/L</td><td>Fiche SSN du 17.03.2025 et KDIGO 2024, adultes avec maladie rénale chronique</td><td>Seuil à partir duquel un traitement par bicarbonate de sodium est envisagé</td></tr><tr><td>&lt; 22 mmol/L, fonction pulmonaire normale</td><td>Consensus SSED/SSN, diabète de type 2 (mai 2024)</td><td>Définition de l’acidose métabolique ; autres causes à exclure ; bicarbonate dosé si DFGe &lt; 60 ou hyperkaliémie inexpliquée</td></tr><tr><td>22 à 26 mmol/L</td><td>Consensus SSED/SSN, diabète de type 2</td><td>Cible du traitement par bicarbonate de sodium, deux à trois prises par jour</td></tr><tr><td>Au-dessus de la limite supérieure de la normale du laboratoire</td><td>KDIGO 2024</td><td>Surcorrection à éviter, avec surveillance de la pression, du potassium et du volume</td></tr></tbody></table><p data-evidence="N18-C0962" id="N18-C0962">Résolution retenue par le cours : la fiche SSN de mars 2025, plus récente et applicable à tous les adultes, fonde le seuil d’intervention de 18 mmol/L. Chez la personne diabétique de type 2 suivie selon le consensus SSED/SSN, un bicarbonate entre 18 et 21 mmol/L justifie de rechercher une autre cause d’acidose et de discuter un traitement visant 22 à 26 mmol/L, en tenant compte de la charge sodée. Le texte en vigueur de chaque source est accessible par les liens ci-dessous.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
