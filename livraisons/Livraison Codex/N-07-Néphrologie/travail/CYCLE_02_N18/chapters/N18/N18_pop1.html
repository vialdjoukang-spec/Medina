<template data-pop="n18-filtration" data-title="Filtration, réabsorption, sécrétion et excrétion"><p data-evidence="N18-C0365" id="N18-C0365">Filtrer signifie transférer eau et petites molécules du plasma vers l’espace urinaire initial à travers la barrière glomérulaire. Réabsorber signifie récupérer une substance depuis la lumière tubulaire vers le sang; sécréter signifie ajouter une substance à cette lumière depuis le compartiment sanguin ou la cellule. L’excrétion est ce qui quitte finalement le corps dans l’urine.</p><p data-evidence="N18-C0366" id="N18-C0366">Le bilan est : excrété = filtré − réabsorbé + sécrété, avec toutes les quantités rapportées au même temps. Le rein peut produire encore de l’urine malgré une filtration très réduite, car le volume final dépend aussi des transports et des apports. À l’inverse, une baisse récente de diurèse est un signe clinique à évaluer, sans constituer à elle seule une mesure de filtration chronique.</p><p data-evidence="N18-C0367" id="N18-C0367">Cette distinction guide les examens : <button class="w" data-k="n18-creatinine">créatinine</button> et <button class="w" data-k="n18-cystatine">cystatine</button> estiment la filtration, l’urine décrit aussi les pertes et lésions, tandis que poids et examen contribuent à apprécier le volume.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-dfg" data-title="DFG et DFGe — ce que dit le débit"><p data-evidence="N18-C0368" id="N18-C0368">DFG signifie débit de filtration glomérulaire; le « e » de <button class="w" data-k="n18-dfg">DFGe</button> signifie estimé. Le résultat usuel en mL/min/1,73 m² est rapporté à une surface corporelle standard. Une équation utilise un marqueur, souvent la <button class="w" data-k="n18-creatinine">créatinine</button>, avec d’autres variables; le nombre comporte donc une incertitude et dépend de la version de l’équation.</p><p data-evidence="N18-C0369" id="N18-C0369">Le tableau reprend KDIGO 2024 pour l’adulte, après confirmation de chronicité. Le <button class="w" data-k="n18-dfg">DFGe</button> est indexé sur une surface corporelle de 1,73 m²; il ne s’agit pas d’une clairance médicamenteuse automatiquement interchangeable.</p><table><thead><tr><th>Catégorie</th><th><button class="w" data-k="n18-dfg">DFGe</button>, mL/min/1,73 m²</th><th>Portée</th></tr></thead><tbody><tr><td data-evidence="N18-C0370" id="N18-C0370">G1</td><td data-evidence="N18-C0371" id="N18-C0371">≥ 90</td><td data-evidence="N18-C0372" id="N18-C0372">Filtration normale ou élevée; un autre marqueur est nécessaire pour parler de maladie chronique.</td></tr><tr><td data-evidence="N18-C0373" id="N18-C0373">G2</td><td data-evidence="N18-C0374" id="N18-C0374">60–89</td><td data-evidence="N18-C0375" id="N18-C0375">Filtration légèrement diminuée; même exigence de marqueur.</td></tr><tr><td data-evidence="N18-C0376" id="N18-C0376">G3a</td><td data-evidence="N18-C0377" id="N18-C0377">45–59</td><td data-evidence="N18-C0378" id="N18-C0378">Diminution légère à modérée.</td></tr><tr><td data-evidence="N18-C0379" id="N18-C0379">G3b</td><td data-evidence="N18-C0380" id="N18-C0380">30–44</td><td data-evidence="N18-C0381" id="N18-C0381">Diminution modérée à sévère.</td></tr><tr><td data-evidence="N18-C0382" id="N18-C0382">G4</td><td data-evidence="N18-C0383" id="N18-C0383">15–29</td><td data-evidence="N18-C0384" id="N18-C0384">Diminution sévère; suivi spécialisé habituellement nécessaire.</td></tr><tr><td data-evidence="N18-C0385" id="N18-C0385">G5</td><td data-evidence="N18-C0386" id="N18-C0386">&lt; 15</td><td data-evidence="N18-C0387" id="N18-C0387">Insuffisance rénale (« kidney failure » dans KDIGO) ; évaluation du parcours, pas dialyse automatique.</td></tr></tbody></table><p data-evidence="N18-C0388" id="N18-C0388">Les valeurs frontières appartiennent à une seule ligne : 30 est G3b et 15 est G4. Le risque reste continu malgré ces catégories pratiques.</p><p data-evidence="N18-C0389" id="N18-C0389">La masse musculaire et un état aigu peuvent rendre l’estimation trompeuse; une mesure plus précise peut être nécessaire.</p><p data-evidence="N18-C0390" id="N18-C0390">Une FI peut demander une autre grandeur, notamment une clairance en mL/min. Le changement d’unité ou la désindexation ne rendent pas toutes les méthodes équivalentes.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-acr" data-title="ACR — mesurer une fuite d’albumine"><p data-evidence="N18-C0391" id="N18-C0391"><button class="w" data-k="n18-acr">ACR</button> vient de l’anglais albumin-to-creatinine ratio; le français emploie aussi rapport albumine/<button class="w" data-k="n18-creatinine">créatinine</button>. Le laboratoire dose l’albumine et la <button class="w" data-k="n18-creatinine">créatinine</button> dans le même échantillon urinaire. Diviser mg/L par mmol/L donne mg/mmol et réduit l’effet de dilution. Le prélèvement matinal est préféré pour confirmer une anomalie.</p><p data-evidence="N18-C0392" id="N18-C0392">Le rapport reste influencé par variabilité biologique, production de <button class="w" data-k="n18-creatinine">créatinine</button> et contexte; infection, menstruation ou exercice peuvent modifier la lecture. Un <button class="w" data-k="n18-acr">ACR</button> anormal isolé doit être confirmé et ne date pas la maladie.</p><p data-evidence="N18-C0393" id="N18-C0393">L’albuminurie et la filtration répondent à deux questions distinctes. Un <button class="w" data-k="n18-acr">ACR</button> élevé peut signaler un risque avec filtration conservée; un <button class="w" data-k="n18-acr">ACR</button> faible n’annule pas une baisse chronique du <button class="w" data-k="n18-dfg">DFGe</button>. Les seuils conventionnels en mg/g sont arrondis et ne doivent pas être mélangés aux mg/mmol.</p><p data-evidence="N18-C1810" id="N18-C1810">Les catégories d’albuminurie de l’adulte sont A1 (&lt; 3 mg/mmol), A2 (3–30) et A3 (&gt; 30) selon KDIGO 2024. Le premier tableau du consensus SSED/SSN écrit A2 3–29 et A3 ≥ 30 : seule la valeur de 30 change de catégorie, et la <button class="w" data-k="n18-a3-borne">frontière A2/A3</button> expose le choix retenu. Un ACR doit doubler pour dépasser la variabilité du laboratoire.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="n18-chronologie" data-title="Chronologie — quelles données rendent la chronicité crédible?"><p data-evidence="N18-C0408" id="N18-C0408">Noter dates, valeurs, unités et contexte permet de distinguer persistance et succession d’épisodes aigus. Les anciennes créatinines, albuminuries, analyses urinaires et images sont recherchées activement. Une maladie chronique repose sur une anomalie présente au moins trois mois ou sur des preuves suffisantes d’ancienneté, comme certaines lésions histologiques ou morphologiques confrontées à l’histoire.</p><p data-evidence="N18-C0409" id="N18-C0409">Si aucune antériorité n’existe, le dossier garde une conclusion provisoire et prévoit les contrôles. L’intervalle dépend d’abord de la gravité : une dégradation rapide, une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> ou une surcharge n’attend pas trois mois. Une personne ayant déjà une maladie chronique peut avoir simultanément un épisode aigu réversible.</p><p data-evidence="N18-C0410" id="N18-C0410">Pour le cas fictif, deux valeurs comparables séparées de quatre mois soutiennent la chronicité; elles n’excluent pas une nouvelle variation depuis le dernier prélèvement. La date du prochain contrôle fait partie de la conclusion.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-trajectoire" data-title="Trajectoire — lire les changements de fonction"><p data-evidence="N18-C0411" id="N18-C0411">Une trajectoire est une série de mesures datées, interprétées avec les événements et les traitements. Deux résultats proches peuvent varier biologiquement ou analytiquement; une pente courte n’annonce pas une date certaine de dialyse. Un changement de laboratoire ou d’équation peut aussi créer une rupture apparente.</p><p data-evidence="N18-C0412" id="N18-C0412">KDIGO 2024 propose d’évaluer une variation de <button class="w" data-k="n18-dfg">DFGe</button> &gt; 20 % entre contrôles, une baisse &gt; 30 % après un traitement hémodynamique et un doublement de l’<button class="w" data-k="n18-acr">ACR</button>. Ce sont des repères d’investigation, pas des diagnostics automatiques de toxicité. On recherche volume, pression, interactions, obstruction ou cause active selon le tableau.</p><p data-evidence="N18-C0413" id="N18-C0413">La comparaison finale utilise les valeurs obtenues dans un état suffisamment stable. Elle distingue la baisse initiale attendue de certains traitements et la progression persistante. Le suivi gagne en valeur lorsque chaque résultat peut être relié à une décision possible.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-medicaments" data-title="Interrogatoire médicamenteux et risque rénal"><p data-evidence="N18-C0414" id="N18-C0414">Demander « quels médicaments prenez-vous? » ne suffit pas toujours. On fait préciser nom commercial, dosage, fréquence, prise effective et date de début, puis on interroge anti-inflammatoires sans ordonnance, plantes, compléments et produits récents. Une photographie ou la liste des boîtes peut aider à identifier le produit exact.</p><p data-evidence="N18-C0415" id="N18-C0415">Les risques peuvent venir d’une toxicité directe, d’une modification de perfusion, de l’équilibre hydrosodé, du potassium ou de l’accumulation lorsque l’élimination change. Leur importance dépend du patient et des associations. Un traitement utile peut nécessiter un contrôle ou une interruption temporaire; cela ne signifie pas qu’il est interdit à toute personne atteinte de maladie rénale.</p><p data-evidence="N18-C0416" id="N18-C0416">La sortie d’hôpital et la maladie intercurrente sont des moments de réconciliation : on documente ce qui est poursuivi, suspendu et repris, par qui et quand. L’absence de consigne de reprise peut faire perdre durablement un bénéfice.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>.</p></template>
<template data-pop="n18-volume" data-title="Évaluer le volume extracellulaire"><p data-evidence="N18-C0417" id="N18-C0417">Le volume extracellulaire correspond au liquide situé hors des cellules, notamment plasma et interstitium. L’examen confronte poids et variation, pression, fréquence cardiaque, œdèmes, <button class="w" data-k="n18-volume">dyspnée</button> et signes pulmonaires ou veineux selon le contexte. Aucun signe isolé ne donne une mesure exacte du volume circulant efficace.</p><p data-evidence="N18-C0418" id="N18-C0418">Des œdèmes peuvent coexister avec une perfusion rénale insuffisante, notamment dans certaines maladies cardiaques ou hypoalbuminémiques. À l’inverse, une hypotension n’est pas toujours une preuve de manque d’eau. L’histoire des apports, pertes, diurétiques et événements récents permet d’interpréter l’examen.</p><p data-evidence="N18-C0419" id="N18-C0419">La décision de diurétique ou d’apport de liquide vise un mécanisme précis et doit être réévaluée. Poids, symptômes, pression, électrolytes et fonction rénale servent à juger la réponse. La présence d’une maladie chronique ne dispense pas de cette appréciation à chaque épisode aigu.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>.</p></template>
<template data-pop="n18-oedeme" data-title="Œdème — signification et limites du signe"><p data-evidence="N18-C0420" id="N18-C0420">Un œdème est une accumulation de liquide interstitiel. On recherche localisation, symétrie, évolution et godet, puis on l’associe à poids, <button class="w" data-k="n18-volume">dyspnée</button>, pression et contexte. Une atteinte rénale avec rétention sodée peut y contribuer, mais une maladie cardiaque, veineuse ou une baisse de pression oncotique peuvent donner un aspect similaire.</p><p data-evidence="N18-C0421" id="N18-C0421">L’œdème ne mesure ni le <button class="w" data-k="n18-dfg">DFGe</button> ni le stade de la maladie. Une apparition rapide avec gêne respiratoire change l’urgence. Une prise pondérale aide à suivre le bilan, sans être un test causal unique. L’examen des autres territoires et la chronologie des traitements sont nécessaires.</p><p data-evidence="N18-C0422" id="N18-C0422">Si un diurétique est retenu, l’objectif est la correction de la surcharge avec une dose adaptée et des contrôles. L’augmentation des urines ne démontre pas une amélioration de la filtration. La cause sous-jacente reste à traiter.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>.</p></template>
<template data-pop="n18-orthostase" data-title="Hypotension orthostatique et tolérance tensionnelle"><p data-evidence="N18-C0423" id="N18-C0423">Des vertiges, un malaise ou une chute lors du passage debout font rechercher une intolérance orthostatique. On compare la pression dans des positions et des conditions documentées, avec les symptômes et le pouls. La mesure doit être reproductible et tenir compte des médicaments, de la fragilité et des pertes récentes.</p><p data-evidence="N18-C0424" id="N18-C0424">La fiche suisse propose généralement une pression systolique 120–129 mmHg individualisée, tandis que KDIGO évoque &lt; 120 dans des conditions standardisées chez des adultes sélectionnés et tolérants. Ces chiffres ne sont pas interchangeables avec une mesure rapide non standardisée. Une personne symptomatique, fragile ou à risque de chute peut nécessiter un objectif moins intensif.</p><p data-evidence="N18-C0425" id="N18-C0425">Le traitement cherche un bénéfice rénal et cardiovasculaire sans compromettre la sécurité quotidienne. On réévalue donc dose, volume, associations et méthode de mesure avant d’intensifier mécaniquement sur une valeur isolée.</p><h3>Quand alléger l’objectif</h3><p data-evidence="N18-C1736" id="N18-C1736">KDIGO conseille un traitement moins intensif chez la personne fragile, à risque élevé de chute ou de fracture, à espérance de vie très limitée ou présentant une hypotension orthostatique symptomatique. Le consensus SSED/SSN applique la même logique en retenant 140/90 mmHg chez la personne âgée et fragile. Exemple fictif : une personne de 84 ans qui chute deux fois après l’augmentation de son traitement voit son objectif réévalué avant tout ajout.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="n18-hematurie" data-title="Hématurie et sédiment — orienter sans conclure seul"><p data-evidence="N18-C0426" id="N18-C0426">L’<button class="w" data-k="n18-hematurie">hématurie</button> signifie présence de globules rouges dans les urines. Son origine peut être glomérulaire ou située ailleurs dans les voies urinaires. La microscopie recherche morphologie des hématies et cylindres; leur interprétation dépend de la qualité et de la fraîcheur du prélèvement ainsi que de l’expertise disponible.</p><p data-evidence="N18-C0427" id="N18-C0427">Une <button class="w" data-k="n18-hematurie">hématurie</button> glomérulaire associée à une <button class="w" data-k="n18-proteinurie">protéinurie</button> et à une dégradation de filtration oriente vers une maladie parenchymateuse et peut nécessiter une évaluation rapide. Une infection symptomatique, une lithiase ou un autre contexte impose une démarche différente. Le sédiment ne remplace ni l’imagerie ni les explorations spécialisées nécessaires.</p><p data-evidence="N18-C0428" id="N18-C0428">La SSN retient l’<button class="w" data-k="n18-hematurie">hématurie</button> glomérulaire parmi les critères de recours. Le dossier précise le résultat réel, sa date, les symptômes et la trajectoire plutôt qu’un simple mot « sang » issu d’une bandelette.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-echographie" data-title="Échographie rénale — ce qu’elle peut montrer"><p data-evidence="N18-C0429" id="N18-C0429">L’échographie décrit dimensions, contours, cortex, médullaire, sinus et cavités; elle recherche notamment asymétrie, dilatation et kystes. Elle est utile pour certaines causes structurelles et pour des indices de chronicité. Son résultat dépend de l’opérateur, de la visibilité et de la question posée.</p><p data-evidence="N18-C0430" id="N18-C0430">Des reins petits, un cortex aminci et une échogénicité augmentée peuvent soutenir une atteinte chronique, mais leur spécificité est limitée. Des reins de taille conservée n’excluent pas une maladie chronique. Chez l’adulte, la longueur habituelle est de 10 à 12 cm et l’épaisseur corticale de 7 à 10 mm ; les longueurs affichées sur la figure 3 (13,36 cm pour le rein normal, 9,09 cm pour le rein malade) appartiennent à ces patients publiés et rappellent que la taille varie avec la stature.</p><p data-evidence="N18-C0431" id="N18-C0431">La filtration séparée de chaque rein n’est pas calculée à partir de sa longueur. Si cette fonction séparée peut modifier une décision, une exploration adaptée est discutée. L’imagerie s’intègre aux marqueurs urinaires, sanguins et à l’histoire.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-biopsie" data-title="Biopsie rénale — question, bénéfice et limites"><p data-evidence="N18-C0432" id="N18-C0432">Une <button class="w" data-k="n18-biopsie">biopsie</button> prélève du tissu pour caractériser certaines lésions. La question est de savoir si son résultat peut modifier traitement, pronostic ou information. Une glomérulopathie suspectée, une présentation atypique ou une cause incertaine peuvent la motiver; un stade G isolé ne suffit pas à l’imposer.</p><p data-evidence="N18-C0433" id="N18-C0433">Le spécialiste évalue risque, faisabilité, taille et aspect des reins, contexte clinique et préférence du patient. Les techniques anatomopathologiques répondent à des questions complémentaires. Une <button class="w" data-k="n18-biopsie">biopsie</button> montre un échantillon : une lésion focale peut être manquée et une <button class="w" data-k="n18-s04-fenetre-2">fibrose</button> ne révèle pas nécessairement l’étiologie initiale.</p><p data-evidence="N18-C0434" id="N18-C0434">La décision doit donc préciser l’hypothèse, le résultat susceptible de changer la conduite et ce qui serait fait si le prélèvement n’était pas contributif. L’absence de <button class="w" data-k="n18-biopsie">biopsie</button> ne signifie pas absence de recherche causale; l’imagerie, les analyses et parfois la génétique peuvent être plus adaptées.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-recours" data-title="Avis néphrologique — critères et transmission"><p data-evidence="N18-C0435" id="N18-C0435">La SSN 2025 retient notamment <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30, <button class="w" data-k="n18-acr">ACR</button> persistant &gt; 30 mg/mmol, cause inconnue, progression, <button class="w" data-k="n18-hematurie">hématurie</button> glomérulaire, <button class="w" data-k="n18-resistance">hypertension résistante</button>, anomalies persistantes du potassium, maladie héréditaire et calculs récurrents. Un épisode aigu ou une chute abrupte persistante demande une évaluation dont le délai dépend de la gravité.</p><p data-evidence="N18-C0436" id="N18-C0436">Le dossier joint anciennes et nouvelles valeurs, unités, équation, contexte, analyse urinaire, imagerie disponible, pression, symptômes et liste exacte des traitements. La demande formule une question : cause, complication, protection, adaptation ou préparation d’un parcours avancé. Cette précision évite de confondre une consultation programmée et une urgence.</p><p data-evidence="N18-C0437" id="N18-C0437">Les seuils de risque <button class="w" data-k="n18-calcul-kfre">KFRE</button> peuvent compléter l’orientation selon KDIGO; ils n’effacent pas les critères suisses ni une indication clinique urgente. L’avis peut aussi répondre à une incertitude qui ne se résume pas à un nombre.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-conservateur" data-title="Soins conservateurs complets"><p data-evidence="N18-C0438" id="N18-C0438">Le parcours conservateur organise des soins actifs sans suppléance rénale. Il prend en charge symptômes, volume, complications, nutrition et besoins psychologiques, sociaux et spirituels pertinents. Il inclut une anticipation des événements et une continuité entre les professionnels.</p><p data-evidence="N18-C0439" id="N18-C0439">Il peut correspondre au choix informé d’une personne ou à un projet où la charge des interventions est jugée peu compatible avec ses priorités. La discussion compare bénéfices attendus, contraintes, incertitudes et possibilités locales. L’âge seul ne remplace pas cette évaluation.</p><p data-evidence="N18-C0440" id="N18-C0440">La décision est révisable et documentée. Un plan prévoit qui contacter, comment traiter les symptômes et quelle conduite suivre lors d’une aggravation. Présenter cette option tôt permet un choix mieux préparé; ce n’est pas attendre une urgence pour annoncer qu’aucun soin n’existe.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-ozempic" data-title="Ozempic — sémaglutide et indication rénale du diabète de type 2"><p data-evidence="N18-C0441" id="N18-C0441">Ozempic DualDose/FixDose est un agoniste du récepteur du GLP-1 en stylo injectable sous-cutané. La FI suisse consultée inclut le ralentissement de la maladie rénale chronique chez l’adulte avec diabète de type 2. Cette indication ne s’étend pas au diabète de type 1 ni au traitement d’une acidocétose.</p><p data-evidence="N18-C0442" id="N18-C0442">Le traitement commence à 0,25 mg une fois par semaine pendant quatre semaines, puis 0,5 mg une fois par semaine. Pour l’indication rénale, la dose d’entretien est 1 mg par semaine après au moins quatre semaines à 0,5 mg. Le schéma glycémique pouvant atteindre 2 mg répond à une autre finalité; la dose étudiée dans FLOW pour le parcours rénal était 1 mg. L’injection est sous-cutanée dans abdomen, cuisse ou bras, jamais intraveineuse ou intramusculaire. La FI ne demande pas d’ajustement rénal ou hépatique; cela n’élimine pas la surveillance clinique.</p><p data-evidence="N18-C0443" id="N18-C0443"><button class="w" data-k="n18-symptomes">Nausées</button>, vomissements et diarrhée peuvent provoquer une déshydratation et détériorer la fonction. Une suspicion de pancréatite exige une interruption et une évaluation; une confirmation interdit la reprise selon la FI. Les associations à insuline ou sulfonylurée demandent une évaluation du risque hypoglycémique; une amélioration glycémique rapide peut aggraver transitoirement une rétinopathie. L’équipe d’anesthésie doit connaître le traitement en raison du ralentissement de vidange gastrique et du risque d’aspiration. Le produit ne devrait pas être utilisé pendant grossesse ou allaitement; il est interrompu au moins deux mois avant une grossesse planifiée.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic DualDose/FixDose (Juillet 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-norvasc" data-title="Norvasc — amlodipine et pression artérielle"><p data-evidence="N18-C0444" id="N18-C0444">Norvasc est un anticalcique dihydropyridinique employé notamment pour l’hypertension. Son rôle est le contrôle tensionnel lorsqu’il est indiqué; il ne remplace pas automatiquement un bloqueur du système rénine–angiotensine choisi pour une maladie albuminurique. La dose adulte usuelle débute à 5 mg oral une fois par jour et peut atteindre 10 mg/jour selon réponse. La FI ne demande pas d’adaptation pour l’insuffisance rénale; le produit n’est pas dialysable.</p><p data-evidence="N18-C0445" id="N18-C0445">L’insuffisance hépatique prolonge l’exposition et impose de la prudence sans schéma universel fourni dans cette FI. Une dose initiale plus faible peut être nécessaire chez la personne âgée. Hypotension sévère, choc, obstruction de la voie d’éjection gauche et insuffisance cardiaque instable après infarctus sont des contre-indications importantes. Pression, symptômes et œdèmes sont suivis : un œdème lié au médicament ne démontre pas une progression rénale. Le traitement se réévalue avec les autres antihypertenseurs et le projet tensionnel individuel.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" target="_blank" rel="noopener">Information professionnelle suisse Norvasc (Avril 2023.)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-aldactone" data-title="Aldactone — spironolactone et hypertension résistante"><p data-evidence="N18-C0446" id="N18-C0446">Aldactone bloque le récepteur minéralocorticoïde et épargne le potassium. La SSN 2025 envisage un antagoniste stéroïdien en <button class="w" data-k="n18-resistance">hypertension résistante</button> si <button class="w" data-k="n18-dfg">DFGe</button> ≥ 45, sans association à un antagoniste non stéroïdien. Le consensus suisse spécifique au diabète propose de ne pas dépasser 25 mg/jour de spironolactone lorsqu’elle est associée à un bloqueur du système rénine–angiotensine. Cette limite de contexte rénal prévaut dans ce parcours sur les doses initiales de 50–100 mg/jour décrites par la FI dans l’hypertension essentielle générale.</p><p data-evidence="N18-C0447" id="N18-C0447">La FI contre-indique le produit en insuffisance rénale aiguë, clairance &lt; 30 mL/min, anurie, <button class="w" data-k="n18-hyperkal">hyperkaliémie</button>, hyponatrémie, maladie d’Addison et association à l’éplérénone. Les apports de potassium, substituts de sel potassiques, autres épargneurs et plusieurs médicaments augmentent le risque d’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button>. La décision spécialisée vérifie potassium, fonction, volume et pression avant puis après introduction; la fréquence dépend du risque. Gynécomastie et <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> font partie des effets à connaître.</p><p data-evidence="N18-C0448" id="N18-C0448">La grossesse ne permet l’emploi qu’en nécessité absolue selon la FI; l’allaitement n’est pas recommandé avec ce traitement. Le résultat tensionnel et la tolérance déterminent la poursuite. Une pression encore élevée ne justifie pas une augmentation aveugle avant vérification de la mesure, de l’observance et des causes secondaires.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="n18-eliquis" data-title="Eliquis — apixaban dans la fibrillation auriculaire non valvulaire"><p data-evidence="N18-C0449" id="N18-C0449">Eliquis, inhibiteur du facteur Xa, existe notamment en comprimés 2,5 et 5 mg. La SSN privilégie la classe des anticoagulants oraux directs en G1–G4 avec fibrillation auriculaire non valvulaire lorsqu’une anticoagulation est indiquée. La décision tient compte des risques thromboembolique et hémorragique; la maladie rénale seule ne suffit pas à prescrire.</p><p data-evidence="N18-C0450" id="N18-C0450">La FI suisse indique 5 mg oral deux fois par jour dans cette indication. La dose devient 2,5 mg deux fois par jour si au moins deux critères sont présents : âge ≥ 80 ans, poids ≤ 60 kg, <button class="w" data-k="n18-creatinine">créatinine</button> ≥ 133 µmol/L. La rubrique suisse consultée formule cette réduction selon ces critères, indépendamment de la seule fonction rénale; elle ne doit pas être remplacée silencieusement par un algorithme étranger. L’apixaban n’est pas recommandé si clairance &lt; 15 mL/min ou chez le dialysé. Les schémas de thrombose veineuse sont différents et ne sont pas transposés ici.</p><p data-evidence="N18-C0451" id="N18-C0451">Un saignement significatif actif, une maladie hépatique avec coagulopathie ou une insuffisance hépatique sévère sont contre-indiqués. Les associations antithrombotiques et certaines interactions augmentent le risque hémorragique. L’équipe suit saignements, hémogramme, fonction rénale et changements de traitement, puis planifie les interruptions de procédure avec leur reprise. Grossesse et allaitement nécessitent une alternative ou une décision spécialisée conformément à la FI. La durée dépend de l’indication et de la balance bénéfice–risque, réévaluée dans le temps.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-lipides" data-title="Ezetrol et Repatha — compléter une stratégie lipidique"><p data-evidence="N18-C0452" id="N18-C0452">La SSN envisage l’ézétimibe ou un inhibiteur PCSK9 si risque cardiovasculaire et profil lipidique le justifient. Ezetrol réduit l’absorption intestinale du cholestérol; la FI indique 10 mg oral une fois par jour, sans adaptation rénale habituelle. L’insuffisance hépatique modérée ou sévère ne permet pas l’emploi recommandé. Les restrictions de la statine associée restent applicables, notamment grossesse, allaitement et atteinte hépatique évolutive. Les symptômes musculaires et la fonction hépatique sont surveillés selon l’association.</p><p data-evidence="N18-C0453" id="N18-C0453">Repatha est un anticorps dirigé contre PCSK9. Dans la réduction du risque cardiovasculaire adulte décrite ici, la FI donne 140 mg sous-cutané toutes les deux semaines ou 420 mg une fois par mois, deux schémas alternatifs. Aucun ajustement rénal n’est requis. L’insuffisance hépatique modérée exige une surveillance de la réponse; l’atteinte sévère a été peu étudiée. Le produit peut provoquer une hypersensibilité et le capuchon de certaines présentations contient du caoutchouc naturel. Le nom commercial et le lot assurent la traçabilité.</p><p data-evidence="N18-C0454" id="N18-C0454">Ces traitements ne sont pas ajoutés automatiquement parce que G3 est présent. Le besoin de réduction supplémentaire, la tolérance du traitement de base, les contre-indications et les conditions de prise en charge suisse déterminent le choix. La prescription se poursuit au long cours seulement tant que le bénéfice attendu la justifie; la réponse lipidique est recontrôlée.</p><h3>Concilier intensité de la statine et FI</h3><p data-evidence="N18-C1735" id="N18-C1735">Le consensus SSED/SSN demande une statine de haute intensité lorsque le DFGe dépasse 30, des doses plus faibles au-dessous, avec un ajustement conforme au Compendium. Pour Crestor, la FI fixe ce cadre : dose initiale de 5 mg en cas d’insuffisance rénale légère à modérée, dose de 40 mg contre-indiquée si la clairance est inférieure à 60 mL/min, produit contre-indiqué au-dessous de 30 mL/min. Une statine de haute intensité chez une personne en G3 se choisit donc dans les limites de la FI du produit, et une autre statine est nécessaire si la clairance passe sous 30.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680561950025" target="_blank" rel="noopener">Information professionnelle suisse Ezetrol (Mars 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680656220019" target="_blank" rel="noopener">Information professionnelle suisse Repatha (Juin 2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>.</p></template>
<template data-pop="n18-veltassa" data-title="Veltassa — patiromer et hyperkaliémie chronique"><p data-evidence="N18-C0455" id="N18-C0455">Veltassa est une poudre pour suspension orale contenant du patiromer, qui lie le potassium dans le tube digestif. Il est indiqué dans l’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button> de l’adulte. Son délai d’action interdit de remplacer par ce produit un traitement d’urgence d’une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> menaçante.</p><p data-evidence="N18-C0456" id="N18-C0456">La FI recommande une dose initiale d’au moins 8,4 g une fois par jour. La dose quotidienne est ajustée par paliers de 8,4 g à intervalles d’une semaine, jusqu’à 25,2 g/jour, selon kaliémie et cible individualisée. La poudre est mélangée, jamais avalée sèche ni chauffée : environ 40 mL d’eau puis 40 mL supplémentaires, avec rinçage du verre pour prendre toute la dose. La teneur en potassium d’un autre liquide ou aliment utilisé doit être prise en compte.</p><p data-evidence="N18-C0457" id="N18-C0457">Un intervalle de trois heures avec les autres médicaments oraux est généralement requis; les exceptions sont celles de la FI. Le produit peut diminuer le magnésium : la magnésémie est surveillée durant le premier mois et au-delà si elle baisse. Les troubles digestifs sévères et certains antécédents digestifs limitaient l’inclusion dans les études. L’expérience en dialyse est limitée et la sécurité pédiatrique n’est pas établie. Le potassium peut remonter après arrêt; le suivi doit anticiper cette réascension, surtout si le traitement protecteur hyperkaliémiant continue.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-fer-criteres" data-title="Fer et anémie — seuils de décision et cibles distinctes"><p data-evidence="N18-C0458" id="N18-C0458">La ferritine renseigne sur les réserves mais augmente aussi avec l’inflammation. La saturation de la transferrine décrit la disponibilité du fer transporté. KDIGO 2026 distingue les populations suivantes pour envisager l’introduction de fer; ces seuils ne sont pas des objectifs universels à atteindre.</p><table class="t"><thead><tr><th>Situation</th><th>Critères d’introduction proposés</th><th>Portée</th></tr></thead><tbody><tr><td data-evidence="N18-C0459" id="N18-C0459">Hémodialyse</td><td data-evidence="N18-C0460" id="N18-C0460">Ferritine ≤500 ng/mL et saturation ≤30 %</td><td data-evidence="N18-C0461" id="N18-C0461">Le fer est discuté dans le parcours d’<button class="w" data-k="n18-fer-criteres">anémie</button> de la personne dialysée.</td></tr><tr><td data-evidence="N18-C0462" id="N18-C0462">Sans hémodialyse ou dialyse péritonéale</td><td data-evidence="N18-C0463" id="N18-C0463">Ferritine &lt;100 ng/mL et saturation &lt;40 %, ou ferritine 100 à &lt;300 et saturation &lt;25 %</td><td data-evidence="N18-C0464" id="N18-C0464">Le choix oral/intraveineux tient compte de gravité, effet, tolérance et préférence.</td></tr><tr><td data-evidence="N18-C0465" id="N18-C0465">Situation de suspension du fer de routine</td><td data-evidence="N18-C0466" id="N18-C0466">Ferritine &gt;700 ng/mL ou saturation ≥40 %</td><td data-evidence="N18-C0467" id="N18-C0467">Le traitement est réévalué pour limiter un excès.</td></tr><tr><td data-evidence="N18-C1738" id="N18-C1738">Diabète de type 2 (consensus SSED/SSN 2024)</td><td data-evidence="N18-C1739" id="N18-C1739">Anémie avec ferritine &lt; 500 ng/mL et/ou saturation ≤ 30 % ; pas pendant une infection systémique active</td><td data-evidence="N18-C1740" id="N18-C1740">Cible d’hémoglobine 10–11,5 g/dL ; érythropoïétine initiée par le néphrologue.</td></tr></tbody></table><p data-evidence="N18-C0468" id="N18-C0468">Les repères SSN 2025 ferritine 300–500 et saturation&gt;30 % sont ainsi contextualisés par le texte spécialisé plus récent. Chez l’adulte sous agent stimulant l’érythropoïèse, KDIGO 2026 recommande Hb&lt;115 g/L. La FI Aranesp impose également ses limites; le nombre 15 g/dL de la formule de Ganzoni calcule un déficit et n’est pas cette cible thérapeutique.</p><h3>Choisir entre deux seuils</h3><p data-evidence="N18-C1741" id="N18-C1741">Hors dialyse, les seuils du consensus SSED/SSN et ceux de KDIGO 2026 divergent. Exemple fictif : ferritine de 350 ng/mL et saturation de 20 % chez une personne non dialysée. Le consensus suisse admet le fer ; KDIGO 2026 ne le propose pas, puisque la ferritine dépasse 300 ng/mL. Selon la règle de ce cours, la source primaire applicable la plus récente l’emporte : KDIGO 2026, consacré à l’anémie, fixe les critères chez la personne non dialysée, et la décision se discute avec le néphrologue. Le seuil suisse reste utile comme limite au-delà de laquelle le fer n’est pas indiqué chez le diabétique.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="n18-calcul-acr" data-title="Calcul de l’ACR et conversion des unités"><p data-evidence="N18-C0469" id="N18-C0469"><button class="w" data-k="n18-acr">ACR</button> = albumine urinaire en mg/L ÷ <button class="w" data-k="n18-creatinine">créatinine</button> urinaire en mmol/L; les litres se simplifient et le résultat est en mg/mmol. Exemple fictif : albumine 120 mg/L et <button class="w" data-k="n18-creatinine">créatinine</button> 8 mmol/L donnent 120/8 = 15 mg/mmol, catégorie A2. Le rapport réduit l’effet de dilution de l’urine, sans supprimer toute variabilité biologique ni l’effet d’une production inhabituelle de <button class="w" data-k="n18-creatinine">créatinine</button>.</p><p data-evidence="N18-C0470" id="N18-C0470">Pour convertir une valeur mesurée en mg/mmol vers mg/g, on utilise la masse molaire de la <button class="w" data-k="n18-creatinine">créatinine</button> : 1 mmol correspond à environ 0,113 g, donc 15/0,113 ≈ 133 mg/g. On ne remplace pas pour autant les seuils conventionnels A1/A2/A3 par des frontières recalculées différentes de celles du référentiel.</p><p data-evidence="N18-C0471" id="N18-C0471">Les deux concentrations viennent du même échantillon. Le rapport atténue l’effet de dilution mais dépend encore de la <button class="w" data-k="n18-creatinine">créatinine</button> urinaire et de la variabilité. La conversion utilise 1 mmol de <button class="w" data-k="n18-creatinine">créatinine</button>≈0,113g, facteur indiqué dans les conversions KDIGO.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-calcul-egfr" data-title="Calcul CKD-EPI2021 — exemple complet"><p data-evidence="N18-C0472" id="N18-C0472">Le laboratoire doit préciser l’équation utilisée. Pour rendre le calcul reproductible, l’exemple ci-dessous utilise la version <button class="w" data-k="n18-creatinine">créatinine</button> CKD-EPI 2021 exposée par le service danois DEKS en mai 2025, sans coefficient ethnique. D’autres équations validées, dont les équations européennes, existent; ce choix pédagogique ne prétend pas imposer une équation unique à tous les laboratoires suisses. Les versions ne se mélangent pas dans une même formule.</p><p data-evidence="N18-C0473" id="N18-C0473">Dans la présentation DEKS en unités SI : <button class="w" data-k="n18-dfg">DFGe</button> = 142 × min(C/k,1)<sup>α</sup> × max(C/k,1)<sup>−1,2</sup> × 0,9938<sup>âge</sup> × F. C est la <button class="w" data-k="n18-creatinine">créatinine</button> en µmol/L; k vaut 62 pour une femme et 80 pour un homme; α vaut −0,241 ou −0,302 respectivement; F vaut 1,012 pour une femme et 1 pour un homme. L’âge est en années; le résultat est en mL/min/1,73 m². min prend la plus petite valeur et max la plus grande.</p><p data-evidence="N18-C0474" id="N18-C0474">Exemple fictif d’un homme de 60 ans, <button class="w" data-k="n18-creatinine">créatinine</button> 150 µmol/L stable : C/k = 150/80 = 1,875; min = 1 et max = 1,875. Ainsi 142 × 1 × 1,875<sup>−1,2</sup> × 0,9938<sup>60</sup> = 45,99, arrondi à 46 mL/min/1,73 m². C’est G3a si la chronicité est établie. Les constantes SI arrondies du document DEKS expliquent de petites différences avec une formule utilisant d’abord une conversion exacte en mg/dL.</p><p data-evidence="N18-C0475" id="N18-C0475">Le résultat est rapporté à une surface standard de 1,73 m² pour comparer les personnes. Pour une surface corporelle connue de 2,0 m², un <button class="w" data-k="n18-dfg">DFGe</button> indexé de 46 donne 46 × 2,0/1,73 = 53,2 mL/min après désindexation. La décision posologique dépend cependant du paramètre exigé par la FI; le calcul ne devient pas une clairance de Cockcroft–Gault. L’équation adulte ne s’applique pas automatiquement à l’enfant, à la grossesse ou à une situation aiguë instable. Les limites doivent accompagner le résultat.</p><p class="src">Sources : <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-calcul-kfre" data-title="Calcul KFRE à cinq ans — variables, formule et limites"><p data-evidence="N18-C0476" id="N18-C0476">La <button class="w" data-k="n18-calcul-kfre">KFRE</button> à quatre variables utilise âge, sexe, <button class="w" data-k="n18-dfg">DFGe</button> et <button class="w" data-k="n18-acr">ACR</button> pour estimer le risque de suppléance rénale. Pour rendre un exemple traçable, on retient la formule à cinq ans calibrée hors Amérique du Nord reproduite dans le tableau 1 de Schulz et collaborateurs, étude européenne de 2022 : risque = 1 − 0,9365<sup>exp(z)</sup>, avec z = −0,2201 × (âge/10 − 7,036) + 0,2467 × (homme − 0,5642) − 0,5567 × (<button class="w" data-k="n18-dfg">DFGe</button>/5 − 7,222) + 0,4510 × (ln <button class="w" data-k="n18-acr">ACR</button> − 5,137).</p><p data-evidence="N18-C0477" id="N18-C0477">L’âge est en années; « homme » vaut 1 pour un homme et 0 pour une femme; <button class="w" data-k="n18-dfg">DFGe</button> est en mL/min/1,73 m²; <button class="w" data-k="n18-acr">ACR</button> est impérativement en mg/g. ln est le logarithme naturel et exp(z) la fonction exponentielle. Exemple fictif : 60 ans, homme, <button class="w" data-k="n18-dfg">DFGe</button> 40, <button class="w" data-k="n18-acr">ACR</button> 300 mg/g donnent z ≈ 0,1580, exp(z) ≈ 1,1712, puis risque ≈ 0,07396, soit 7,4 % à cinq ans. Ce calcul distinct du cas initial utilise 300 mg/g, pas 300 mg/mmol.</p><p data-evidence="N18-C0478" id="N18-C0478">KDIGO recommande une équation extérieurement validée chez les adultes G3–G5; un modèle développé dans ces catégories peut être inadapté à G1–G2. La calibration non nord-américaine n’est pas une preuve de validation nationale suisse. Le résultat dépend des mesures, de la population, de la concurrence du décès et de l’horizon choisi. Un risque à cinq ans de 3–5 % peut contribuer à l’orientation selon KDIGO; les critères SSN restent applicables. Le seuil à deux ans de 40 % pour la préparation ne se compare pas au résultat à cinq ans.</p><p data-evidence="N18-C1737" id="N18-C1737">KDIGO utilise aussi l’horizon de deux ans : un risque supérieur à 10 % sert à fixer le moment des soins multidisciplinaires, et un risque supérieur à 40 % celui de la préparation à la suppléance. Ces deux seuils exigent une équation calculée à deux ans.</p><p class="src">Sources : <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-calcul-clairance" data-title="Calcul d’une clairance — concentration et débit"><p data-evidence="N18-C0479" id="N18-C0479">Une concentration décrit une quantité par volume, par exemple mmol/L. Un débit volumique décrit un volume par temps, par exemple mL/min. Une quantité excrétée par temps est le produit de concentration urinaire et débit urinaire. Le débit de filtration décrit un volume de plasma filtré par temps; il diffère du volume final d’urine puisque le tubule récupère une grande part de l’eau. Cette distinction évite de confondre polyurie et bonne filtration.</p><p data-evidence="N18-C0480" id="N18-C0480">La clairance d’une substance x se calcule Cx = Ux × V/Px : Ux est sa concentration urinaire, Px sa concentration plasmatique dans la même unité, et V le débit urinaire. Exemple fictif : Ux = 10 mmol/L, Px = 0,1 mmol/L et V = 1 mL/min donnent Cx = 10/0,1 × 1 = 100 mL/min. Les unités de concentration se simplifient; il reste un débit. La clairance représente un volume virtuel de plasma épuré par minute, pas un volume de substance recueilli.</p><p data-evidence="N18-C0481" id="N18-C0481">Une clairance de <button class="w" data-k="n18-creatinine">créatinine</button> inclut une sécrétion tubulaire et dépend d’un recueil fiable. Elle ne devient pas une mesure de référence de la filtration par le seul fait d’avoir une formule.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-calcul-nutrition" data-title="Calcul des protéines, du sodium et du bicarbonate"><p data-evidence="N18-C0482" id="N18-C0482">Une quantité par kilogramme et par jour doit être multipliée par le poids retenu dans le projet nutritionnel. Le repère de 0,8 g/kg/jour donne 0,8×70=56g de protéines par jour pour un adulte de 70 kg; ce n’est pas 56 g de viande, car un aliment ne contient pas seulement des protéines. Le repère ne s’applique pas automatiquement à l’enfant en croissance ni à une personne dénutrie ou instable.</p><p data-evidence="N18-C0483" id="N18-C0483">Le sodium et le sel ne sont pas la même masse. KDIGO rapproche moins de 2 g de sodium d’environ 5 g de chlorure de sodium par jour. Les apports médicamenteux s’ajoutent aux apports alimentaires : quatre capsules de Néphrotrans apportent 4×137=548 mg de sodium, et 2 g de bicarbonate. Ce calcul mesure un apport; les contre-indications du produit, pression et volume conditionnent son emploi.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>.</p></template>
<template data-pop="n18-calcul-ganzoni" data-title="Calcul de Ganzoni — déficit total et dose fractionnée"><p data-evidence="N18-C0484" id="N18-C0484">Venofer est une solution de fer saccharose à 20 mg/mL; une ampoule ou un flacon de 5 mL apporte 100 mg de fer. Il est indiqué pour une carence martiale confirmée lorsque le fer oral est insuffisamment efficace ou impossible. La ferritine et la saturation de la transferrine se lisent avec l’hémoglobine et le contexte; <button class="w" data-k="n18-fer-criteres">anémie</button> rénale ne signifie pas automatiquement carence.</p><p data-evidence="N18-C0485" id="N18-C0485">La FI décrit chez l’adulte 100–200 mg une à trois fois par semaine, selon un déficit total calculé et une administration fractionnée. En perfusion, diluer uniquement dans NaCl stérile 0,9 % : 100 mg dans au maximum 100 mL, pendant au moins 15 minutes; 200 mg dans au maximum 200 mL, pendant au moins 30 minutes. Les doses plus importantes ont d’autres durées et limites : jusqu’à 500 mg chez une personne de plus de 70 kg, ou 7 mg/kg si poids ≤ 70 kg, au maximum une fois par semaine et pendant au moins 3,5 heures. La voie est strictement intraveineuse, jamais intramusculaire ou sous-cutanée.</p><p data-evidence="N18-C0486" id="N18-C0486">Le déficit de Ganzoni est : poids en kg × (hémoglobine cible − mesurée, en g/dL) × 2,4 + réserves de fer en mg. Pour poids ≥ 35 kg, la FI utilise 15 g/dL et 500 mg de réserves. Exemple fictif : 70 kg et Hb 10 g/dL donnent 70 × 5 × 2,4 + 500 = 1 340 mg de déficit total, à fractionner. Le nombre 15 de cette formule n’est pas la cible thérapeutique d’hémoglobine sous darbépoétine, qui suit un autre raisonnement.</p><p data-evidence="N18-C0487" id="N18-C0487">Hypersensibilité grave à un fer parentéral, surcharge martiale, <button class="w" data-k="n18-fer-criteres">anémie</button> non martiale et premier trimestre de grossesse sont des contre-indications. Personnel entraîné et moyens de réanimation doivent être immédiatement disponibles; surveiller pendant l’administration et au moins 30 minutes après. Éviter l’extravasation, qui peut provoquer une coloration prolongée et des lésions. Grossesse après le premier trimestre et allaitement nécessitent une évaluation spécifique. Le traitement est arrêté ou révisé selon réponse, bilan martial et tolérance.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>.</p></template>
<template data-pop="n18-aspirine" data-title="Aspirine Cardio — antiagrégation et restriction rénale"><p data-evidence="N18-C0488" id="N18-C0488">Aspirine Cardio 100/300 contient de l’acide acétylsalicylique en comprimés gastro-résistants. La SSN propose une antiagrégation en prévention secondaire après événement cardiovasculaire avéré. La FI de ce produit décrit plusieurs indications et plusieurs doses; pour les indications cardiovasculaires sans pontage ni angioplastie, elle recommande 100 mg oral une fois par jour. Les autres contextes, notamment l’urgence coronaire, suivent des schémas spécifiques et ne sont pas déduits de cette dose.</p><p data-evidence="N18-C0489" id="N18-C0489">Le comprimé d’entretien est avalé entier avec du liquide, au moins une demi-heure avant le repas. Une clairance de <button class="w" data-k="n18-creatinine">créatinine</button>&lt;30 mL/min contre-indique ce produit, de même qu’un saignement digestif ou ulcère actif, certaines maladies inflammatoires intestinales, une atteinte hépatique sévère et des antécédents allergiques pertinents. L’association au méthotrexate ≥15 mg/semaine et le troisième trimestre de grossesse sont également contre-indiqués. Les autres antithrombotiques augmentent le risque de saignement.</p><p data-evidence="N18-C0490" id="N18-C0490">La prescription évalue donc indication, fonction rénale, hémorragie, interactions et durée du parcours cardiovasculaire. Le cours ne transforme pas la recommandation suisse de prévention secondaire en indication automatique de ce produit à tous les stades rénaux. Une autre stratégie peut nécessiter un avis spécialisé.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Information professionnelle suisse Aspirine Cardio 100/300 (Mars 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-calcul-cockcroft" data-title="Clairance de Cockcroft–Gault — variables et limites"><p data-evidence="N18-C0491" id="N18-C0491">La FI de Ramipril Zentiva présente une estimation de clairance de <button class="w" data-k="n18-creatinine">créatinine</button> chez l’adulte : poids en kg×(140−âge en années)/(72×<button class="w" data-k="n18-creatinine">créatinine</button> en mg/dL), avec multiplication par 0,85 pour la femme dans cette formule. Le résultat est en mL/min. La conversion KDIGO indique 1 mg/dL de <button class="w" data-k="n18-creatinine">créatinine</button> = 88,4 µmol/L; on divise donc une <button class="w" data-k="n18-creatinine">créatinine</button> en µmol/L par 88,4 avant ce calcul.</p><p data-evidence="N18-C0492" id="N18-C0492">Exemple fictif d’un homme de 60 ans et 70 kg avec <button class="w" data-k="n18-creatinine">créatinine</button> stable 150 µmol/L : 150/88,4 ≈ 1,697 mg/dL, puis 70 × 80/(72 × 1,697) ≈ 45,8 mL/min. Le poids retenu et la masse musculaire peuvent modifier la pertinence; une situation aiguë instable limite l’estimation. Ce nombre n’est pas automatiquement le <button class="w" data-k="n18-dfg">DFGe</button> indexé sur 1,73 m².</p><p data-evidence="N18-C0493" id="N18-C0493">La FI utilise un seuil rénal formulé en mL/min/1,73 m² puis donne cette formule en mL/min. Le cours conserve cette ambiguïté et demande une clarification spécialisée lorsque le choix dépend de ce seuil. Une formule correctement calculée ne résout pas une discordance d’indexation dans le texte de prescription.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-conversions" data-title="Conversions — conserver la grandeur et son unité"><p data-evidence="N18-C0494" id="N18-C0494">La table de conversion KDIGO 2024 donne des facteurs entre unités conventionnelles et SI. Pour la <button class="w" data-k="n18-creatinine">créatinine</button>, mg/dL × 88,4 donne µmol/L. Pour le calcium, mg/dL × 0,2495 donne mmol/L. Ainsi le repère graphique de 10 mg/dL de calcium correspond à 2,495 mmol/L, arrondi à2,5; cela ne crée ni une norme individuelle ni une cible de traitement.</p><p data-evidence="N18-C0495" id="N18-C0495">Pour l’<button class="w" data-k="n18-acr">ACR</button>, mg/g×0,113 donne mg/mmol; dans l’autre sens, on divise par 0,113. Un <button class="w" data-k="n18-acr">ACR</button> de 15 mg/mmol donne donc environ 132,7 mg/g. Les frontières conventionnelles A1/A2/A3 restent celles du référentiel avec leurs arrondis. Une conversion transforme l’unité d’une même grandeur; elle ne transforme pas une clairance en une autre méthode ni un seuil diagnostique en cible thérapeutique.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-symptomes" data-title="Fatigue, prurit, nausées et symptômes d’atteinte avancée"><p data-evidence="N18-C0496" id="N18-C0496">La <button class="w" data-k="n18-symptomes">fatigue</button> décrit une baisse ressentie d’énergie; le <button class="w" data-k="n18-symptomes">prurit</button> une sensation conduisant à se gratter; les <button class="w" data-k="n18-symptomes">nausées</button> une sensation d’envie de vomir. Ces symptômes peuvent accompagner une maladie rénale avancée, mais leur cause n’est pas spécifique. Le médecin précise début, évolution, retentissement, médicaments et symptômes associés.</p><p data-evidence="N18-C0497" id="N18-C0497">La <button class="w" data-k="n18-symptomes">fatigue</button> peut notamment être liée à une <button class="w" data-k="n18-fer-criteres">anémie</button>, à une maladie cardiaque ou à d’autres causes. Une diminution de l’appétit et une perte nutritionnelle persistante modifient la prise en charge. Des troubles cognitifs nouveaux, une <button class="w" data-k="n18-volume">dyspnée</button> importante ou des vomissements empêchant l’hydratation nécessitent une réévaluation rapide. La symptomatologie peut participer à la décision de suppléance si elle est attribuable à l’insuffisance rénale et résistante aux mesures appropriées.</p><p data-evidence="N18-C0498" id="N18-C0498">Le suivi n’attend donc pas seulement un seuil de <button class="w" data-k="n18-dfg">DFGe</button>. Il compare les symptômes au point de départ et recherche des explications traitables. Une absence de plainte n’exclut pas une maladie rénale chronique.</p><p class="src">Sources : <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-hyperkal" data-title="Hyperkaliémie — mécanisme, vérification et action"><p data-evidence="N18-C0499" id="N18-C0499">L’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button> est une concentration sanguine de potassium supérieure à l’intervalle applicable. L’interprétation suit le compte rendu du laboratoire et le contexte; la page HUG donne 3,6–4,6 mmol/L comme repère public illustratif, sans norme universelle détaillée. Une anomalie préanalytique peut fausser le résultat; la vérification ne doit pas retarder une prise en charge urgente si le tableau est préoccupant.</p><p data-evidence="N18-C0500" id="N18-C0500">Le risque associe capacité d’excrétion rénale, transports tubulaires, médicaments, apports et état métabolique. Une baisse de filtration favorise ce risque sans prédire à elle seule la kaliémie. Les bloqueurs du système rénine–angiotensine, antagonistes minéralocorticoïdes et triméthoprime demandent une vigilance particulière. La surveillance précède et suit leur adaptation.</p><p data-evidence="N18-C0501" id="N18-C0501">La prise en charge cherche les causes corrigibles, adapte l’alimentation et peut employer un liant digestif dans une situation appropriée. Un produit à action retardée comme le patiromer ne remplace pas le traitement d’une urgence. Les seuils d’interruption de Kerendia appartiennent à sa FI et ne constituent pas une classification universelle de toutes les hyperkaliémies.</p><h3>Vérifier une pseudohyperkaliémie</h3><p data-evidence="N18-C1727" id="N18-C1727">KDIGO décrit des hyperkaliémies fausses, dues à la sortie de potassium des cellules pendant ou après le prélèvement : garrot serré, main serrée ou exercée au moment de la ponction, hémolyse par agitation ou stockage inadapté. Une thrombocytose ou une hyperleucocytose peut élever le potassium sérique ; on dose alors le potassium plasmatique.</p><h3>Graduer l’urgence</h3><table class="t"><thead><tr><th>Potassium</th><th>Patient malade ou atteinte rénale aiguë</th><th>Résultat inattendu chez un patient stable</th></tr></thead><tbody><tr><td data-evidence="N18-C1728" id="N18-C1728">6,0–6,4 mmol/L</td><td data-evidence="N18-C1729" id="N18-C1729">Évaluation et traitement à l’hôpital</td><td data-evidence="N18-C1730" id="N18-C1730">Nouveau dosage dans les 24 heures</td></tr><tr><td data-evidence="N18-C1731" id="N18-C1731">≥ 6,5 mmol/L</td><td data-evidence="N18-C1732" id="N18-C1732">Action immédiate avec ECG et surveillance</td><td data-evidence="N18-C1733" id="N18-C1733">Action immédiate avec ECG et surveillance</td></tr></tbody></table><h3>L’ordre des mesures au-delà de 5,5 mmol/L</h3><p data-evidence="N18-C1734" id="N18-C1734">KDIGO propose trois lignes. La première corrige les facteurs réversibles : anti-inflammatoires, triméthoprime, apports alimentaires. La deuxième utilise un diurétique adapté, la correction du bicarbonate et un chélateur du potassium. La troisième, en dernier recours, réduit ou arrête le bloqueur du système rénine–angiotensine ou l’antagoniste minéralocorticoïde, avec un projet de reprise.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>.</p></template>
<template data-pop="n18-resistance" data-title="Hypertension résistante — confirmer avant d’ajouter"><p data-evidence="N18-C0502" id="N18-C0502">Le consensus suisse diabète et rein décrit une pression supérieure à 140/90 mmHg malgré une trithérapie comprenant un diurétique, un bloqueur du système rénine–angiotensine et un anticalcique. Ce repère de résistance ne remplace pas l’objectif individuel. Une mesure hors cabinet ou ambulatoire aide à confirmer la situation.</p><p data-evidence="N18-C0503" id="N18-C0503">Avant d’ajouter un produit, l’équipe vérifie observance, doses réellement prises, apports sodés, médicaments interférents et causes secondaires, notamment un syndrome d’apnées du sommeil selon le contexte. Une hypotension à certains moments de la journée peut coexister avec des valeurs élevées en consultation.</p><p data-evidence="N18-C0504" id="N18-C0504">La SSN 2025 retient l’<button class="w" data-k="n18-resistance">hypertension résistante</button> comme motif de recours néphrologique. Une spironolactone peut être envisagée dans des conditions rénales et potassiques précises, sans association à la finérénone; son risque d’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button> justifie une décision et un contrôle documentés.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>.</p></template>
<template data-pop="n18-proteinurie" data-title="Protéinurie et albuminurie — ne pas confondre les protéines"><p data-evidence="N18-C0505" id="N18-C0505">La <button class="w" data-k="n18-proteinurie">protéinurie</button> mesure l’élimination urinaire de l’ensemble des protéines détectées; l’albuminurie se concentre sur l’albumine. L’<button class="w" data-k="n18-acr">ACR</button> est donc une mesure particulière, pas toujours un substitut à toutes les questions de <button class="w" data-k="n18-proteinurie">protéinurie</button>. Une quantité importante de protéines avec relativement peu d’albumine peut orienter vers des protéines non albuminiques.</p><p data-evidence="N18-C0506" id="N18-C0506">Le document HUG propose alors une recherche ciblée, par exemple de chaînes légères selon le contexte. L’histoire, le sédiment, le bilan sanguin et parfois des examens spécialisés complètent l’orientation. Le rapport albumine/<button class="w" data-k="n18-creatinine">créatinine</button> réduit l’effet de dilution d’un échantillon, mais ne supprime pas la variabilité ni l’effet de la production de <button class="w" data-k="n18-creatinine">créatinine</button>.</p><p data-evidence="N18-C0507" id="N18-C0507">La décision dépend de la persistance et de l’association aux autres anomalies. Un résultat urinaire isolé ne démontre ni la chronicité ni une cause histologique précise.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a01-fenetre-1" data-title="Filtration : bases"><h3>Les ordres de grandeur d’un rein normal</h3><p data-evidence="N18-C0963" id="N18-C0963">Pour juger une filtration diminuée, il faut connaître la valeur normale et ce qu’elle représente. Au repos, les reins reçoivent environ 25 % du débit cardiaque, et chaque rein contient environ 1,3 million de néphrons. Le tableau rassemble les repères physiologiques publiés par OpenStax ; ce sont des moyennes d’adultes, non des seuils diagnostiques.</p><table class="t"><thead><tr><th>Grandeur</th><th>Valeur de référence</th><th>Conséquence clinique</th></tr></thead><tbody><tr><td data-evidence="N18-C0964" id="N18-C0964">Débit sanguin rénal</td><td data-evidence="N18-C0965" id="N18-C0965">Environ 25 % du débit cardiaque au repos</td><td data-evidence="N18-C0966" id="N18-C0966">Une baisse de perfusion réduit rapidement la filtration.</td></tr><tr><td data-evidence="N18-C0967" id="N18-C0967">Néphrons</td><td data-evidence="N18-C0968" id="N18-C0968">Environ 1,3 million par rein</td><td data-evidence="N18-C0969" id="N18-C0969">Une perte partielle peut rester silencieuse tant que les néphrons restants compensent.</td></tr><tr><td data-evidence="N18-C0970" id="N18-C0970">Filtration, homme</td><td data-evidence="N18-C0971" id="N18-C0971">125 mL/min (intervalle 90–140)</td><td data-evidence="N18-C0972" id="N18-C0972">Un <button class="w" data-k="n18-dfg">DFGe</button> de 60 correspond déjà à une perte importante par rapport à cette moyenne.</td></tr><tr><td data-evidence="N18-C0973" id="N18-C0973">Filtration, femme</td><td data-evidence="N18-C0974" id="N18-C0974">105 mL/min (intervalle 80–125)</td><td data-evidence="N18-C0975" id="N18-C0975">La différence entre sexes explique une partie des constantes des équations.</td></tr><tr><td data-evidence="N18-C0976" id="N18-C0976">Filtrat quotidien</td><td data-evidence="N18-C0977" id="N18-C0977">Environ 180 L (homme), 150 L (femme)</td><td data-evidence="N18-C0978" id="N18-C0978">La réabsorption tubulaire en récupère la plus grande partie : le volume d’urine ne mesure pas la filtration.</td></tr></tbody></table><h3>Le déclin physiologique avec l’âge</h3><p data-evidence="N18-C0979" id="N18-C0979">Le document des Hôpitaux universitaires de Genève décrit un déclin naturel d’environ 0,75 à 1 mL/min/1,73 m² par an après 40–50 ans, très variable et indépendant de toute maladie rénale. Il qualifie de modéré un déclin de 2 à 3 mL/min/1,73 m² par an et de rapide un déclin de 5. Exemple fictif : un DFGe qui passe de 90 à 86 en cinq ans perd 0,8 par an et reste compatible avec le vieillissement ; un DFGe qui passe de 55 à 45 en deux ans perd 5 par an et constitue un déclin rapide.</p><h3>Ce que l’âge n’autorise pas</h3><p data-evidence="N18-C0980" id="N18-C0980">La définition KDIGO applique le même seuil fonctionnel de 60 mL/min/1,73 m² à tout adulte. Le déclin physiologique explique une partie des valeurs basses de la personne âgée, mais il ne supprime ni la catégorie G ni le risque associé. Un DFGe de 50 persistant à 80 ans reste une catégorie G3a, interprétée avec la cause, l’albuminurie et la trajectoire.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a01-fenetre-2" data-title="Chronologie : données nécessaires"><h3>Six manières de prouver trois mois d’ancienneté</h3><p data-evidence="N18-C0981" id="N18-C0981">KDIGO énumère six sources capables d’établir qu’une anomalie rénale dure depuis au moins trois mois. Le tableau indique où chercher chacune et la limite qui empêche de la surinterpréter.</p><table class="t"><thead><tr><th>Preuve</th><th>Où la chercher</th><th>Limite</th></tr></thead><tbody><tr><td data-evidence="N18-C0982" id="N18-C0982">DFG mesurés ou estimés antérieurs</td><td data-evidence="N18-C0983" id="N18-C0983">Laboratoires, lettres hospitalières, médecin précédent</td><td data-evidence="N18-C0984" id="N18-C0984">Une valeur prise pendant un épisode aigu ne décrit pas l’état de base.</td></tr><tr><td data-evidence="N18-C0985" id="N18-C0985">Albuminurie, protéinurie ou sédiment antérieurs</td><td data-evidence="N18-C0986" id="N18-C0986">Comptes rendus urinaires datés</td><td data-evidence="N18-C0987" id="N18-C0987">Infection, menstruation ou effort récent peuvent fausser un résultat isolé.</td></tr><tr><td data-evidence="N18-C0988" id="N18-C0988">Imagerie : reins petits, cortex aminci</td><td data-evidence="N18-C0989" id="N18-C0989">Échographie, scanner</td><td data-evidence="N18-C0990" id="N18-C0990">Une petite stature s’accompagne de petits reins normaux.</td></tr><tr><td data-evidence="N18-C0991" id="N18-C0991">Histologie : fibrose, atrophie</td><td data-evidence="N18-C0992" id="N18-C0992">Biopsie antérieure</td><td data-evidence="N18-C0993" id="N18-C0993">Elle est rarement disponible en médecine de premier recours.</td></tr><tr><td data-evidence="N18-C0994" id="N18-C0994">Anamnèse d’une maladie connue pour léser le rein</td><td data-evidence="N18-C0995" id="N18-C0995">Diabète ancien, hypertension, maladie héréditaire</td><td data-evidence="N18-C0996" id="N18-C0996">Elle rend la chronicité plausible sans la démontrer seule.</td></tr><tr><td data-evidence="N18-C0997" id="N18-
