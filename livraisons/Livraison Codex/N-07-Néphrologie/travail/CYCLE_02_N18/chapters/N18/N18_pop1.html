<template data-pop="n18-e02-fenetre-1" data-title="Rapport albumine/créatinine : calcul et interprétation"><h3>L’ordre de préférence des tests</h3><p data-evidence="N18-C1490" id="N18-C1490">KDIGO classe les tests initiaux de l’albuminurie par ordre de préférence. Le premier choix est l’ACR au laboratoire, puis la bandelette lisant albumine et ACR par lecteur automatique. Si l’on mesure les protéines, le rapport protéines/créatinine précède les bandelettes de protéines. Dans tous les cas, le premier jet du milieu de la première miction du matin est préféré. Une bandelette positive se confirme par une mesure quantitative, et un ACR d’au moins 3 mg/mmol sur une urine prise au hasard se confirme sur une urine du matin.</p><h3>Ce que le dénominateur introduit</h3><p data-evidence="N18-C1491" id="N18-C1491">L’ACR divise l’albumine par la créatinine urinaire, qui dépend du sexe, du poids et des apports. Le tableau de KDIGO sur la variation biologique en tire des conséquences pratiques.</p><table class="t"><thead><tr><th>Facteur</th><th>Effet sur l’ACR</th></tr></thead><tbody><tr><td data-evidence="N18-C1492" id="N18-C1492">Hématurie, menstruation, effort, infection urinaire symptomatique</td><td data-evidence="N18-C1493" id="N18-C1493">Hausse</td></tr><tr><td data-evidence="N18-C1494" id="N18-C1494">Sexe féminin, faible poids, régime pauvre en protéines, atteinte rénale aiguë</td><td data-evidence="N18-C1495" id="N18-C1495">Hausse, car la créatinine urinaire est plus basse</td></tr><tr><td data-evidence="N18-C1496" id="N18-C1496">Sexe masculin, poids élevé, régime riche en protéines</td><td data-evidence="N18-C1497" id="N18-C1497">Baisse, car la créatinine urinaire est plus haute</td></tr><tr><td data-evidence="N18-C1498" id="N18-C1498">Protéines autres que l’albumine</td><td data-evidence="N18-C1499" id="N18-C1499">Non détectées par les bandelettes à albumine</td></tr></tbody></table><h3>Même perte d’albumine, deux catégories</h3><p data-evidence="N18-C1500" id="N18-C1500">Exemple fictif : deux personnes perdent chacune 30 mg d’albumine par jour. La première, une femme de faible poids, excrète 6 mmol de créatinine par jour ; son ACR vaut 30 / 6 = 5 mg/mmol, catégorie A2. La seconde, un homme musclé, excrète 15 mmol par jour ; son ACR vaut 30 / 15 = 2 mg/mmol, catégorie A1. La différence vient du dénominateur, pas du rein. Le consensus SSED/SSN complète ce dépistage par une bandelette suivie d’un sédiment lorsque le DFGe est inférieur à 60 ou l’ACR supérieur à 3 mg/mmol.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="n18-e02-fenetre-2" data-title="Morphologie rénale : normal, maladie chronique et obstacle"><h3>Le rein normal comme référence</h3><p data-evidence="N18-C0925" id="N18-C0925">Un rein adulte normal mesure habituellement 10 à 12 cm de long, le droit souvent un peu plus que le gauche. Son cortex mesure 7 à 10 mm depuis la base d’une pyramide et son parenchyme 15 à 20 mm. Le sinus central est hyperéchogène ; le parenchyme est plus sombre, avec des pyramides un peu moins échogènes que le cortex. Après six mois de vie, le cortex est moins échogène que le foie ou la rate à la même profondeur, ou d’égale échogénicité.</p><h3>Signes de maladie chronique</h3><p data-evidence="N18-C0926" id="N18-C0926">Glomérulosclérose, atrophie tubulaire, fibrose interstitielle et inflammation augmentent toutes l’échogénicité corticale. La taille diminue et le cortex s’amincit surtout lorsque la maladie progresse ; au stade terminal, le rein devient petit et homogène, sans distinction entre parenchyme et sinus. Une pyélonéphrite chronique donne plutôt un petit rein à amincissement cortical focal. Ces signes soutiennent l’ancienneté de l’atteinte, ce que KDIGO 2024 retient parmi les preuves de chronicité, mais ils ne désignent pas la cause.</p><h3>Ce que l’échographie recherche aussi</h3><p data-evidence="N18-C0927" id="N18-C0927">Une hydronéphrose apparaît comme un espace anéchogène, liquidien et interconnecté dans le sinus : elle oriente vers un obstacle, dont la lithiase est la cause la plus fréquente chez l’adulte. Un kyste simple est anéchogène, à paroi fine, avec renforcement postérieur ; des kystes multiples et bilatéraux font discuter une polykystose dans le bon contexte familial. Un calcul de plus de 5 à 7 mm dans le rein est hyperéchogène avec cône d’ombre postérieur.</p><h3>Limites</h3><p data-evidence="N18-C0928" id="N18-C0928">La taille rénale suit la stature : une personne de petite taille peut avoir de petits reins normaux. L’échographie ne mesure pas la filtration, ni globale ni séparée, et elle ne remplace pas une biopsie lorsqu’une question histologique demeure. Elle dépend enfin de l’opérateur et de la visibilité.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-e03-fenetre-1" data-title="Bilan des complications : références et discordances"><h3>Quels examens, à quel rythme</h3><p data-evidence="N18-C1501" id="N18-C1501">Les complications se recherchent avec une fréquence fixée par la catégorie et par les traitements. Le tableau rassemble les rythmes publiés par les Hôpitaux universitaires de Genève et par le consensus SSED/SSN.</p><table class="t"><thead><tr><th>Examen</th><th>Rythme</th><th>Source</th></tr></thead><tbody><tr><td data-evidence="N18-C1502" id="N18-C1502">Urée, créatinine, potassium, sodium, CO2 total, hémoglobine ; albumine et créatinine urinaires</td><td data-evidence="N18-C1503" id="N18-C1503">À chaque contrôle fixé par la matrice</td><td data-evidence="N18-C1504" id="N18-C1504">HUG</td></tr><tr><td data-evidence="N18-C1505" id="N18-C1505">Formule sanguine, calcium, phosphate, vitamine D, parathormone, ferritine, saturation de la transferrine ; protéines et sédiment urinaires</td><td data-evidence="N18-C1506" id="N18-C1506">Une fois par an, à adapter au stade</td><td data-evidence="N18-C1507" id="N18-C1507">HUG</td></tr><tr><td data-evidence="N18-C1508" id="N18-C1508">Potassium</td><td data-evidence="N18-C1509" id="N18-C1509">À chaque bilan, pendant une maladie aiguë, une semaine après début ou augmentation d’un bloqueur du système rénine–angiotensine, quatre semaines après la finérénone</td><td data-evidence="N18-C1510" id="N18-C1510">SSED/SSN</td></tr><tr><td data-evidence="N18-C1511" id="N18-C1511">Bicarbonate</td><td data-evidence="N18-C1512" id="N18-C1512">Si DFGe &lt; 60 ou hyperkaliémie inexpliquée</td><td data-evidence="N18-C1513" id="N18-C1513">SSED/SSN</td></tr><tr><td data-evidence="N18-C1514" id="N18-C1514">Phosphate, calcium, 25-hydroxyvitamine D</td><td data-evidence="N18-C1515" id="N18-C1515">Lors du bilan de la maladie diabétique</td><td data-evidence="N18-C1516" id="N18-C1516">SSED/SSN</td></tr><tr><td data-evidence="N18-C1517" id="N18-C1517">Hémoglobine</td><td data-evidence="N18-C1518" id="N18-C1518">Une fois par an en G3, deux fois en G4, quatre fois en G5</td><td data-evidence="N18-C1519" id="N18-C1519">HUG</td></tr></tbody></table><h3>Une discordance d’unités à connaître</h3><p data-evidence="N18-C1520" id="N18-C1520">Le document HUG fixe une cible de CO2 total entre 23 et 25 mmol/L, alors que le consensus SSED/SSN parle de bicarbonate et vise 22 à 26 mmol/L. On compare donc un résultat à la référence exprimée dans la même grandeur que celle du compte rendu. Les seuils d’intervention sont comparés dans la <button class="w" data-k="n18-acidose-seuils">fenêtre sur le bicarbonate</button>.</p><h3>Pourquoi vérifier un potassium élevé</h3><p data-evidence="N18-C1521" id="N18-C1521">KDIGO décrit des pseudohyperkaliémies : le potassium sort des cellules pendant ou après le prélèvement. Un résultat élevé inattendu chez une personne sans signe de gravité se vérifie donc rapidement, sans retarder le traitement d’une hyperkaliémie menaçante.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-e03-fenetre-2" data-title="Risque pronostique : variables, calcul et horizon"><h3>Un horizon, une décision</h3><p data-evidence="N18-C1522" id="N18-C1522">Une équation de risque répond à une question datée : quelle probabilité d’insuffisance rénale nécessitant une suppléance dans deux ou dans cinq ans ? KDIGO associe chaque horizon à une décision. Un résultat à cinq ans ne se compare pas à un seuil à deux ans.</p><table class="t"><thead><tr><th>Horizon</th><th>Seuil</th><th>Décision KDIGO</th></tr></thead><tbody><tr><td data-evidence="N18-C1523" id="N18-C1523">5 ans</td><td data-evidence="N18-C1524" id="N18-C1524">3–5 %</td><td data-evidence="N18-C1525" id="N18-C1525">Orientation néphrologique, en plus des critères de DFGe et d’ACR</td></tr><tr><td data-evidence="N18-C1526" id="N18-C1526">2 ans</td><td data-evidence="N18-C1527" id="N18-C1527">Plus de 10 %</td><td data-evidence="N18-C1528" id="N18-C1528">Moment des soins multidisciplinaires</td></tr><tr><td data-evidence="N18-C1529" id="N18-C1529">2 ans</td><td data-evidence="N18-C1530" id="N18-C1530">Plus de 40 %</td><td data-evidence="N18-C1531" id="N18-C1531">Information sur les modalités, préparation de l’accès, orientation vers la greffe</td></tr></tbody></table><h3>Lire le résultat de l’exemple</h3><p data-evidence="N18-C1532" id="N18-C1532">L’exemple de calcul du cours donne 7,4 % à cinq ans pour un homme de 60 ans avec DFGe de 40 et ACR de 300 mg/g. Ce résultat dépasse le seuil d’orientation de 3–5 % ; il ne renseigne pas sur le risque à deux ans, qui exige la version de l’équation correspondant à cet horizon.</p><h3>Le domaine de validité</h3><p data-evidence="N18-C1533" id="N18-C1533">KDIGO recommande une équation validée de manière externe chez l’adulte en catégorie G3–G5 (recommandation 1A) et signale qu’elle peut être invalide en G1–G2. Pour la néphropathie à immunoglobulines A et la polykystose rénale autosomique dominante, il demande des équations propres à ces maladies. Pour le risque cardiovasculaire, il demande des modèles développés chez des personnes atteintes de maladie rénale ou intégrant DFGe et albuminurie ; pour discuter des objectifs de soins, des modèles de mortalité spécifiques. Une probabilité de suppléance ne dit rien du risque de décès qui la précède.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>.</p></template>
<template data-pop="n18-s01-fenetre-1" data-title="Néphron : segments et fonctions"><h3>Ce que chaque segment récupère</h3><p data-evidence="N18-C1534" id="N18-C1534">Le néphron traite le filtrat segment par segment. Le tableau reprend les fractions publiées par OpenStax pour quelques substances ; elles expliquent où agissent les médicaments du cours.</p><table class="t"><thead><tr><th>Segment</th><th>Réabsorption ou sécrétion</th><th>Exemple de médicament concerné</th></tr></thead><tbody><tr><td data-evidence="N18-C1535" id="N18-C1535">Tubule contourné proximal</td><td data-evidence="N18-C1536" id="N18-C1536">Sodium 65 %, eau 67 %, glucose et acides aminés presque 100 %, bicarbonate 80–90 %, potassium 65 %, phosphate 85 % ; sécrétion de créatinine et de médicaments</td><td data-evidence="N18-C1537" id="N18-C1537">Dapagliflozine : moindre réabsorption du glucose et du sodium (FI Forxiga)</td></tr><tr><td data-evidence="N18-C1538" id="N18-C1538">Anse de Henlé</td><td data-evidence="N18-C1539" id="N18-C1539">Eau 15 % dans la branche descendante ; sodium 25 % et potassium 20 % dans la branche large ascendante</td><td data-evidence="N18-C1540" id="N18-C1540">Furosémide : cotransporteur sodium–potassium–deux chlorures de la membrane luminale (FI Lasix)</td></tr><tr><td data-evidence="N18-C1541" id="N18-C1541">Tubule contourné distal</td><td data-evidence="N18-C1542" id="N18-C1542">Sodium 5 % ; calcium sous l’action de la parathormone</td><td data-evidence="N18-C1543" id="N18-C1543">—</td></tr><tr><td data-evidence="N18-C1544" id="N18-C1544">Tube collecteur</td><td data-evidence="N18-C1545" id="N18-C1545">Sodium 5 % sous aldostérone ; eau variable sous hormone antidiurétique ; sécrétion de potassium sous aldostérone</td><td data-evidence="N18-C1546" id="N18-C1546">Bloqueurs de l’aldostérone : moindre sécrétion de potassium</td></tr></tbody></table><h3>Deux populations de néphrons</h3><p data-evidence="N18-C1547" id="N18-C1547">Environ 15 % des néphrons, dits juxtamédullaires, possèdent une longue anse qui plonge profondément dans la médullaire. Les autres, dits corticaux, ont une anse qui pénètre peu ou pas dans la médullaire.</p><h3>Le contrôle local de la filtration</h3><p data-evidence="N18-C1548" id="N18-C1548">La macula densa, partie du tubule distal accolée à l’artériole afférente, perçoit la composition du liquide tubulaire. Elle libère de l’ATP ou de l’adénosine qui contractent ou relâchent l’artériole afférente, et elle règle la libération de rénine. Ce dispositif explique un effet de la dapagliflozine décrit par sa FI : l’afflux accru de sodium vers le tubule distal amplifie probablement ce rétrocontrôle tubulo-glomérulaire et diminue la pression intraglomérulaire.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>.</p></template>
<template data-pop="n18-s01-fenetre-2" data-title="Lésion histologique : description et portée"><h3>La barrière normale</h3><p data-evidence="N18-C1549" id="N18-C1549">OpenStax décrit trois couches entre le sang glomérulaire et l’espace de Bowman : un endothélium percé de fenêtres, une membrane basale commune et les prolongements des podocytes, dont les pédicelles s’imbriquent en ménageant des fentes de filtration. Une lésion de l’une de ces couches laisse passer l’albumine.</p><h3>Les lésions communes de la maladie chronique</h3><p data-evidence="N18-C1550" id="N18-C1550">Le document des Hôpitaux universitaires de Genève décrit un aspect histologique commun aux maladies rénales chroniques évoluées. Le tableau relie chaque lésion à son compartiment et à sa traduction clinique ou morphologique.</p><table class="t"><thead><tr><th>Lésion</th><th>Compartiment</th><th>Traduction</th></tr></thead><tbody><tr><td data-evidence="N18-C1551" id="N18-C1551">Glomérulosclérose</td><td data-evidence="N18-C1552" id="N18-C1552">Glomérule</td><td data-evidence="N18-C1553" id="N18-C1553">Perte de néphrons filtrants ; albuminurie possible</td></tr><tr><td data-evidence="N18-C1554" id="N18-C1554">Artériosclérose</td><td data-evidence="N18-C1555" id="N18-C1555">Vaisseaux</td><td data-evidence="N18-C1556" id="N18-C1556">Associée aux facteurs hémodynamiques de progression</td></tr><tr><td data-evidence="N18-C1557" id="N18-C1557">Fibrose interstitielle</td><td data-evidence="N18-C1558" id="N18-C1558">Tissu entre les tubules</td><td data-evidence="N18-C1559" id="N18-C1559">Échogénicité corticale accrue ; preuve d’ancienneté</td></tr><tr><td data-evidence="N18-C1560" id="N18-C1560">Atrophie tubulaire</td><td data-evidence="N18-C1561" id="N18-C1561">Tubules</td><td data-evidence="N18-C1562" id="N18-C1562">Échogénicité accrue ; preuve d’ancienneté</td></tr></tbody></table><p data-evidence="N18-C1563" id="N18-C1563">Hansen et collaborateurs expliquent que glomérulosclérose, atrophie tubulaire, fibrose interstitielle et inflammation augmentent l’échogénicité du cortex : l’échographie voit indirectement ce que la biopsie voit directement.</p><h3>Les techniques d’examen</h3><p data-evidence="N18-C1564" id="N18-C1564">KDIGO précise qu’une biopsie s’examine en microscopie optique, en immunofluorescence et en microscopie électronique, parfois avec des analyses moléculaires. L’immunofluorescence recherche des dépôts d’immunoglobulines ou de complément ; la microscopie électronique précise la membrane basale et les podocytes. KDIGO accepte la fibrose et l’atrophie comme preuve de chronicité, sans attendre trois mois.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-s02-fenetre-1" data-title="Filtration : grandeurs et unités"><h3>Les trois pressions de Starling</h3><p data-evidence="N18-C1565" id="N18-C1565">La filtration glomérulaire résulte de trois pressions. La pression hydrostatique du sang glomérulaire pousse le plasma vers l’espace de Bowman ; la pression hydrostatique de la capsule et la pression oncotique des protéines plasmatiques s’y opposent. OpenStax donne les valeurs moyennes : pression nette = 55 − (15 + 30) = 10 mmHg.</p><table class="t"><thead><tr><th>Pression</th><th>Valeur moyenne</th><th>Sens</th></tr></thead><tbody><tr><td data-evidence="N18-C1566" id="N18-C1566">Hydrostatique du sang glomérulaire</td><td data-evidence="N18-C1567" id="N18-C1567">55 mmHg</td><td data-evidence="N18-C1568" id="N18-C1568">Favorise la filtration</td></tr><tr><td data-evidence="N18-C1569" id="N18-C1569">Hydrostatique de la capsule</td><td data-evidence="N18-C1570" id="N18-C1570">15 mmHg</td><td data-evidence="N18-C1571" id="N18-C1571">S’oppose à la filtration</td></tr><tr><td data-evidence="N18-C1572" id="N18-C1572">Oncotique du sang</td><td data-evidence="N18-C1573" id="N18-C1573">30 mmHg</td><td data-evidence="N18-C1574" id="N18-C1574">S’oppose à la filtration</td></tr><tr><td data-evidence="N18-C1575" id="N18-C1575">Pression nette de filtration</td><td data-evidence="N18-C1576" id="N18-C1576">10 mmHg</td><td data-evidence="N18-C1577" id="N18-C1577">Résultat</td></tr></tbody></table><h3>Pourquoi une petite variation compte</h3><p data-evidence="N18-C1578" id="N18-C1578">La pression nette ne vaut que 10 mmHg : une variation modeste de l’une des trois pressions change fortement la filtration. Le calcul le montre : si la pression dans la capsule passait de 15 à 25 mmHg, la pression nette deviendrait 55 − (25 + 30) = 0. OpenStax indique aussi que la filtration reste assurée tant que la pression artérielle moyenne dépasse environ 60 mmHg.</p><h3>Fraction filtrée et marqueur de référence</h3><p data-evidence="N18-C1579" id="N18-C1579">À chaque passage, 10 à 20 % du plasma glomérulaire est filtré. L’inuline sert de marqueur de référence de la filtration, mais sa mesure est lourde ; la pratique utilise donc la <button class="w" data-k="n18-creatinine">créatinine</button>, molécule produite par les muscles, non réabsorbée et faiblement sécrétée. Cette faible sécrétion explique qu’une clairance de créatinine ne coïncide pas exactement avec le DFG.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-s02-fenetre-2" data-title="Transport tubulaire : bases"><h3>La capacité maximale de transport</h3><p data-evidence="N18-C1580" id="N18-C1580">Le glucose filtré est réabsorbé presque entièrement dans le tubule proximal, par un transport actif secondaire couplé au sodium. Lorsque la glycémie dépasse la capacité des transporteurs, appelée transport maximal, le glucose apparaît dans l’urine. La FI de Forxiga précise que le transporteur SGLT2 est exprimé sélectivement dans le rein ; son inhibition réduit la réabsorption du glucose et du sodium dans le tubule proximal, ce qui augmente l’excrétion urinaire de glucose ; selon la FI, cette excrétion persiste jusqu’à trois jours après l’arrêt.</p><h3>Le potassium, un ion surtout sécrété en aval</h3><p data-evidence="N18-C1581" id="N18-C1581">Le tubule proximal réabsorbe environ 65 % du potassium filtré et la branche large ascendante 20 %. L’ajustement fin se fait plus loin : le tube collecteur sécrète le potassium sous l’action de l’aldostérone. KDIGO relie à ce mécanisme plusieurs causes médicamenteuses d’hyperkaliémie.</p><table class="t"><thead><tr><th>Médicament</th><th>Mécanisme d’hyperkaliémie décrit par KDIGO</th></tr></thead><tbody><tr><td data-evidence="N18-C1582" id="N18-C1582">Anti-inflammatoires non stéroïdiens</td><td data-evidence="N18-C1583" id="N18-C1583">Inhibition des prostaglandines, donc de la libération de rénine</td></tr><tr><td data-evidence="N18-C1584" id="N18-C1584">Ciclosporine, tacrolimus</td><td data-evidence="N18-C1585" id="N18-C1585">Inhibition de la pompe sodium–potassium nécessaire à la sécrétion de potassium</td></tr><tr><td data-evidence="N18-C1586" id="N18-C1586">Finérénone</td><td data-evidence="N18-C1587" id="N18-C1587">Blocage de la réabsorption de sodium médiée par le récepteur minéralocorticoïde</td></tr><tr><td data-evidence="N18-C1588" id="N18-C1588">Triméthoprime, pentamidine</td><td data-evidence="N18-C1589" id="N18-C1589">Blocage du canal sodium apical du tube collecteur, qui réduit le gradient de sécrétion du potassium</td></tr></tbody></table><h3>Conséquence pratique</h3><p data-evidence="N18-C1590" id="N18-C1590">Lorsqu’un patient associe plusieurs de ces mécanismes, par exemple un bloqueur du système rénine–angiotensine, la finérénone et du triméthoprime, les effets s’additionnent sur le même segment. Le contrôle du potassium suit alors chaque ajout.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-s03-fenetre-1" data-title="Équilibre acido-basique : bases et calculs"><h3>Trois systèmes, trois vitesses</h3><p data-evidence="N18-C1591" id="N18-C1591">L’organisme défend son pH par trois systèmes qui n’agissent pas à la même vitesse. OpenStax décrit des tampons chimiques qui s’ajustent en quelques secondes, une ventilation qui modifie l’élimination du dioxyde de carbone, et un rein qui excrète les protons et conserve le bicarbonate en quelques heures à quelques jours. Une acidose d’origine rénale s’installe donc lentement et se corrige lentement.</p><h3>Le rapport qui fixe le pH</h3><p data-evidence="N18-C1592" id="N18-C1592">Lorsque le pH sanguin est normal, le bicarbonate et l’acide carbonique se trouvent dans un rapport de 20 pour 1. C’est ce rapport, et non la valeur isolée du bicarbonate, qui détermine le pH : une baisse du bicarbonate compensée par une baisse du dioxyde de carbone peut laisser le pH presque normal.</p><h3>Ce que fait le rein</h3><table class="t"><thead><tr><th>Segment</th><th>Rôle acido-basique</th></tr></thead><tbody><tr><td data-evidence="N18-C1593" id="N18-C1593">Tubule proximal</td><td data-evidence="N18-C1594" id="N18-C1594">Réabsorption de 80 à 90 % du bicarbonate filtré, couplée au sodium</td></tr><tr><td data-evidence="N18-C1595" id="N18-C1595">Anse de Henlé</td><td data-evidence="N18-C1596" id="N18-C1596">Réabsorption couplée au sodium et échange avec le chlore dans la branche ascendante</td></tr><tr><td data-evidence="N18-C1597" id="N18-C1597">Tubule distal et tube collecteur</td><td data-evidence="N18-C1598" id="N18-C1598">Sécrétion active de protons ; sécrétion d’ammonium par diffusion</td></tr></tbody></table><h3>Les causes non rénales à exclure</h3><p data-evidence="N18-C1599" id="N18-C1599">OpenStax cite deux causes de baisse du bicarbonate sans lien avec la filtration : la perte digestive au cours d’une diarrhée et l’inhibition de l’anhydrase carbonique par certains diurétiques. Le consensus SSED/SSN demande d’exclure les autres causes d’acidose avant de l’attribuer au rein ; les seuils d’intervention sont discutés dans la <button class="w" data-k="n18-acidose-seuils">fenêtre sur le bicarbonate</button>.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-s03-fenetre-2" data-title="Métabolisme minéral : molécules et rétrocontrôles"><h3>La boucle normale du calcium</h3><p data-evidence="N18-C1600" id="N18-C1600">Les cellules parathyroïdiennes portent des récepteurs du calcium. Lorsque le calcium ne s’y fixe plus, elles libèrent la parathormone. Celle-ci stimule la résorption osseuse par les ostéoclastes, la réabsorption rénale du calcium et la synthèse de vitamine D active, qui augmente l’absorption intestinale du calcium. Quand la calcémie redevient normale, le calcium se fixe à nouveau sur les récepteurs et la sécrétion s’arrête.</p><h3>Le rôle propre du rein</h3><table class="t"><thead><tr><th>Fonction rénale</th><th>Molécule</th><th>Effet</th></tr></thead><tbody><tr><td data-evidence="N18-C1601" id="N18-C1601">Hydroxylation du calcidiol</td><td data-evidence="N18-C1602" id="N18-C1602">Calcitriol (1,25-dihydroxycholécalciférol)</td><td data-evidence="N18-C1603" id="N18-C1603">Absorption intestinale du calcium</td></tr><tr><td data-evidence="N18-C1604" id="N18-C1604">Réabsorption du phosphate</td><td data-evidence="N18-C1605" id="N18-C1605">85 % dans le tubule proximal</td><td data-evidence="N18-C1606" id="N18-C1606">Inhibée par la parathormone : la parathormone augmente l’excrétion du phosphate</td></tr><tr><td data-evidence="N18-C1607" id="N18-C1607">Réabsorption du calcium</td><td data-evidence="N18-C1608" id="N18-C1608">Tubule distal</td><td data-evidence="N18-C1609" id="N18-C1609">Stimulée par la parathormone</td></tr></tbody></table><h3>Pourquoi la maladie rénale dérègle la boucle</h3><p data-evidence="N18-C1610" id="N18-C1610">Dès que la masse rénale diminue, deux fonctions de cette boucle baissent ensemble : la production de calcitriol et l’excrétion du phosphate. Le phosphate tend à s’accumuler et le calcium à baisser, ce qui stimule la parathormone de façon prolongée ; les conséquences cliniques et les repères de suivi sont décrits dans la <button class="w" data-k="n18-a08-fenetre-1">fenêtre sur les troubles minéraux</button>.</p><h3>Les unités</h3><p data-evidence="N18-C1611" id="N18-C1611">KDIGO donne le facteur de conversion du calcium : 1 mg/dL correspond à 0,2495 mmol/L. Une calcémie de 9 mg/dL vaut donc 2,25 mmol/L.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-s04-fenetre-1" data-title="Érythropoïèse : régulation et limites"><h3>L’hormone et son stimulus</h3><p data-evidence="N18-C1612" id="N18-C1612">L’érythropoïétine est une protéine de 193 acides aminés qui stimule la formation des globules rouges dans la moelle. Le rein produit 85 % de l’érythropoïétine circulante, le foie le reste. OpenStax décrit son stimulus : un apport d’oxygène insuffisant aux tissus.</p><table class="t"><thead><tr><th>Situation</th><th>Réponse rénale</th></tr></thead><tbody><tr><td data-evidence="N18-C1613" id="N18-C1613">Séjour en altitude, pression partielle d’oxygène plus basse</td><td data-evidence="N18-C1614" id="N18-C1614">Production accrue d’érythropoïétine</td></tr><tr><td data-evidence="N18-C1615" id="N18-C1615">Début d’un entraînement aérobie</td><td data-evidence="N18-C1616" id="N18-C1616">Production accrue</td></tr><tr><td data-evidence="N18-C1617" id="N18-C1617">Saignement important ou prolongé</td><td data-evidence="N18-C1618" id="N18-C1618">Production accrue</td></tr><tr><td data-evidence="N18-C1619" id="N18-C1619">Insuffisance rénale</td><td data-evidence="N18-C1620" id="N18-C1620">Production insuffisante, d’où une anémie</td></tr></tbody></table><h3>Pourquoi l’érythropoïétine ne suffit pas toujours</h3><p data-evidence="N18-C1621" id="N18-C1621">Le document des Hôpitaux universitaires de Genève ajoute trois mécanismes au déficit hormonal : inhibition de l’érythropoïèse par les toxines urémiques, durée de vie raccourcie des globules rouges et perte de l’homéostasie du fer. Une moelle stimulée sans fer disponible ne produit pas davantage de globules rouges.</p><h3>Les limites d’un agent stimulant</h3><p data-evidence="N18-C1622" id="N18-C1622">La FI d’Aranesp contre-indique le produit en cas d’hypertension artérielle mal contrôlée et rapporte des érythroblastopénies dues à des anticorps anti-érythropoïétine ; le traitement est alors interrompu. KDIGO 2026 fixe la cible d’hémoglobine sous agent stimulant chez l’adulte au-dessous de 115 g/L : l’objectif n’est pas une hémoglobine normale.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>.</p></template>
<template data-pop="n18-s04-fenetre-2" data-title="Progression tissulaire : mécanismes démontrés"><h3>Ce qu’est la fibrose</h3><p data-evidence="N18-C1623" id="N18-C1623">La fibrose est la cicatrice du tissu rénal. Le document des Hôpitaux universitaires de Genève explique qu’après une lésion initiale, les néphrons s’adaptent de façon « mal adaptative » et produisent une cicatrice. Faute de pouvoir former de nouveaux néphrons, les néphrons restants s’hypertrophient, ce qui entretient un cercle vicieux. KDIGO accepte la fibrose comme preuve d’ancienneté ; Hansen et collaborateurs montrent qu’elle augmente l’échogénicité du cortex.</p><h3>Des mécanismes aux traitements</h3><p data-evidence="N18-C1624" id="N18-C1624">Le document HUG énumère les mécanismes de progression communs à la plupart des causes. Le tableau associe chacun à l’intervention qui le cible.</p><table class="t"><thead><tr><th>Mécanisme</th><th>Intervention</th><th>Source de l’intervention</th></tr></thead><tbody><tr><td data-evidence="N18-C1625" id="N18-C1625">Hypertension artérielle et hypertension glomérulaire</td><td data-evidence="N18-C1626" id="N18-C1626">Contrôle tensionnel ; inhibiteur SGLT2, qui diminue probablement la pression intraglomérulaire</td><td data-evidence="N18-C1627" id="N18-C1627">KDIGO ; FI Forxiga</td></tr><tr><td data-evidence="N18-C1628" id="N18-C1628">Système rénine–angiotensine–aldostérone</td><td data-evidence="N18-C1629" id="N18-C1629">Inhibiteur de l’enzyme de conversion ou sartan ; antagoniste minéralocorticoïde non stéroïdien</td><td data-evidence="N18-C1630" id="N18-C1630">KDIGO</td></tr><tr><td data-evidence="N18-C1631" id="N18-C1631">Facteurs de croissance, dont le TGF-β</td><td data-evidence="N18-C1632" id="N18-C1632">Aucun traitement ciblé cité par ces sources</td><td data-evidence="N18-C1633" id="N18-C1633">—</td></tr><tr><td data-evidence="N18-C1634" id="N18-C1634">Perte de podocytes et protéinurie</td><td data-evidence="N18-C1635" id="N18-C1635">Réduction de l’albuminurie ; cible HUG inférieure à 0,5 g/24 h</td><td data-evidence="N18-C1636" id="N18-C1636">HUG</td></tr><tr><td data-evidence="N18-C1637" id="N18-C1637">Dyslipidémie</td><td data-evidence="N18-C1638" id="N18-C1638">Statine, seule ou avec ézétimibe</td><td data-evidence="N18-C1639" id="N18-C1639">KDIGO ; HUG</td></tr><tr><td data-evidence="N18-C1640" id="N18-C1640">Facteurs propres à la maladie</td><td data-evidence="N18-C1641" id="N18-C1641">Traitement de la cause</td><td data-evidence="N18-C1642" id="N18-C1642">KDIGO</td></tr></tbody></table><h3>Ce que le tableau ne dit pas</h3><p data-evidence="N18-C1643" id="N18-C1643">Un mécanisme démontré ne garantit pas qu’un traitement qui le cible ralentit la maladie : seule une étude clinique l’établit. Les classes du tableau ont été évaluées dans des essais, avec des populations précises ; le TGF-β reste un mécanisme sans traitement validé dans ces recommandations.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="n18-p01-fenetre-1" data-title="Monographie suisse : produit et forme"><h3>Les rubriques d’une information professionnelle</h3><p data-evidence="N18-C1644" id="N18-C1644">L’information professionnelle suisse suit un plan fixe. Le tableau indique la question que chaque rubrique résout chez une personne atteinte de maladie rénale chronique.</p><table class="t"><thead><tr><th>Rubrique</th><th>Question résolue</th></tr></thead><tbody><tr><td data-evidence="N18-C1645" id="N18-C1645">Composition ; Forme pharmaceutique et quantité de principe actif par unité</td><td data-evidence="N18-C1646" id="N18-C1646">Quel dosage existe, et la forme peut-elle être coupée ou adaptée ?</td></tr><tr><td data-evidence="N18-C1647" id="N18-C1647">Indications/Possibilités d’emploi</td><td data-evidence="N18-C1648" id="N18-C1648">Le produit est-il autorisé pour cette situation ?</td></tr><tr><td data-evidence="N18-C1649" id="N18-C1649">Posologie/Mode d’emploi, Instructions posologiques particulières</td><td data-evidence="N18-C1650" id="N18-C1650">Quelle dose selon la fonction rénale, hépatique, le poids et l’âge ?</td></tr><tr><td data-evidence="N18-C1651" id="N18-C1651">Contre-indications</td><td data-evidence="N18-C1652" id="N18-C1652">Quelle situation interdit le produit ?</td></tr><tr><td data-evidence="N18-C1653" id="N18-C1653">Mises en garde et précautions ; Interactions</td><td data-evidence="N18-C1654" id="N18-C1654">Quels contrôles et quelles associations ?</td></tr><tr><td data-evidence="N18-C1655" id="N18-C1655">Grossesse, allaitement</td><td data-evidence="N18-C1656" id="N18-C1656">Quelle conduite chez une femme en âge de procréer ?</td></tr><tr><td data-evidence="N18-C1657" id="N18-C1657">Pharmacocinétique</td><td data-evidence="N18-C1658" id="N18-C1658">Comment l’insuffisance rénale modifie-t-elle l’exposition ?</td></tr><tr><td data-evidence="N18-C1659" id="N18-C1659">Numéro d’autorisation ; Présentation ; Mise à jour de l’information</td><td data-evidence="N18-C1660" id="N18-C1660">Quel produit exact, quel emballage, quelle version ?</td></tr></tbody></table><h3>Un exemple lu ligne à ligne</h3><p data-evidence="N18-C1661" id="N18-C1661">La FI de Kerendia porte le numéro d’autorisation 68130 de Swissmedic et une mise à jour de novembre 2025. Sa rubrique Présentation distingue les comprimés de 10 et 20 mg, inscrits sur la liste des spécialités, et le comprimé de 40 mg, qui ne l’est pas et sert l’indication d’insuffisance cardiaque. La SSN renvoie à cette liste pour les conditions de prise en charge des coûts. La rubrique Pharmacocinétique indique qu’une insuffisance rénale modérée ou sévère augmente l’exposition à la finérénone de 34 à 36 %.</p><h3>Pourquoi dater la lecture</h3><p data-evidence="N18-C1662" id="N18-C1662">Une FI change : indications ajoutées, seuils modifiés, nouvelles interactions. Le cours cite donc la date de mise à jour de chaque produit, et une prescription réelle se fonde sur la version en vigueur le jour de la décision.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-p01-fenetre-2" data-title="Adaptation : formule ou tableau FI"><h3>Chaque produit a son paramètre</h3><p data-evidence="N18-C1663" id="N18-C1663">Les FI suisses n’emploient pas toutes la même mesure de la fonction rénale. Le tableau rassemble le paramètre et les seuils des produits du cours.</p><table class="t"><thead><tr><th>Produit</th><th>Paramètre de la FI</th><th>Seuils</th></tr></thead><tbody><tr><td data-evidence="N18-C1664" id="N18-C1664">Kerendia</td><td data-evidence="N18-C1665" id="N18-C1665">DFGe, mL/min/1,73 m²</td><td data-evidence="N18-C1666" id="N18-C1666">≥ 60 : 20 mg ; 25 à &lt; 60 : 10 mg ; &lt; 25 : pas d’instauration</td></tr><tr><td data-evidence="N18-C1667" id="N18-C1667">Forxiga</td><td data-evidence="N18-C1668" id="N18-C1668">DFGe, mL/min/1,73 m²</td><td data-evidence="N18-C1669" id="N18-C1669">&lt; 25 : pas d’instauration</td></tr><tr><td data-evidence="N18-C1670" id="N18-C1670">Ramipril Zentiva</td><td data-evidence="N18-C1671" id="N18-C1671">Clairance de la créatinine</td><td data-evidence="N18-C1672" id="N18-C1672">20–50 : 1,25 mg au départ, 5 mg au maximum</td></tr><tr><td data-evidence="N18-C1673" id="N18-C1673">Crestor</td><td data-evidence="N18-C1674" id="N18-C1674">Clairance de la créatinine, mL/min</td><td data-evidence="N18-C1675" id="N18-C1675">&lt; 60 : pas de 40 mg ; &lt; 30 : contre-indiqué</td></tr><tr><td data-evidence="N18-C1676" id="N18-C1676">Eliquis</td><td data-evidence="N18-C1677" id="N18-C1677">Clairance, et créatinine sérique</td><td data-evidence="N18-C1678" id="N18-C1678">&lt; 15 : non recommandé ; créatinine ≥ 133 µmol/L : critère de réduction</td></tr><tr><td data-evidence="N18-C1679" id="N18-C1679">Aspirine Cardio</td><td data-evidence="N18-C1680" id="N18-C1680">Clairance de la créatinine, mL/min</td><td data-evidence="N18-C1681" id="N18-C1681">&lt; 30 : contre-indiqué</td></tr></tbody></table><h3>Une même personne, deux conclusions</h3><p data-evidence="N18-C1682" id="N18-C1682">Exemple fictif : femme de 82 ans, 52 kg, créatinine stable de 110 µmol/L. L’équation CKD-EPI 2021 donne un DFGe de 43 mL/min/1,73 m². La formule de Cockcroft–Gault de la FI de Ramipril Zentiva donne : 110 / 88,4 = 1,244 mg/dL ; 52 × (140 − 82) / (72 × 1,244) = 33,7 ; × 0,85 = 28,6 mL/min.</p><p data-evidence="N18-C1683" id="N18-C1683">Pour Kerendia, le DFGe de 43 conduit à une dose initiale de 10 mg. Pour Crestor et Aspirine Cardio, la clairance de 28,6 mL/min se situe sous 30 et correspond à une contre-indication. Le faible poids et l’âge expliquent l’écart entre les deux méthodes ; chaque FI s’applique avec son propre paramètre.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Information professionnelle suisse Aspirine Cardio 100/300 (Mars 2026)</a>; <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>.</p></template>
<template data-pop="n18-p02-fenetre-1" data-title="Interaction : mécanisme et conduite"><h3>Les associations qui changent la sécurité</h3><p data-evidence="N18-C1684" id="N18-C1684">Les interactions utiles en néphrologie suivent quelques mécanismes. Le tableau associe chacune à son mécanisme et à la conduite fixée par la source.</p><table class="t"><thead><tr><th>Association</th><th>Mécanisme</th><th>Conduite</th></tr></thead><tbody><tr><td data-evidence="N18-C1685" id="N18-C1685">Ramipril et aliskiren, chez le diabétique ou si clairance &lt; 60</td><td data-evidence="N18-C1686" id="N18-C1686">Double blocage du système rénine–angiotensine</td><td data-evidence="N18-C1687" id="N18-C1687">Contre-indiqué (FI Ramipril Zentiva)</td></tr><tr><td data-evidence="N18-C1688" id="N18-C1688">Ramipril et sacubitril/valsartan</td><td data-evidence="N18-C1689" id="N18-C1689">Risque accru d’angio-œdème</td><td data-evidence="N18-C1690" id="N18-C1690">Contre-indiqué ; ramipril au plus tôt 36 h après la dernière dose</td></tr><tr><td data-evidence="N18-C1691" id="N18-C1691">Inhibiteur de l’enzyme de conversion, sartan et inhibiteur de la rénine</td><td data-evidence="N18-C1692" id="N18-C1692">Double ou triple blocage</td><td data-evidence="N18-C1693" id="N18-C1693">À éviter (KDIGO 1B ; SSED/SSN)</td></tr><tr><td data-evidence="N18-C1694" id="N18-C1694">Kerendia et inhibiteur puissant du CYP3A4</td><td data-evidence="N18-C1695" id="N18-C1695">Exposition très augmentée</td><td data-evidence="N18-C1696" id="N18-C1696">Contre-indiqué</td></tr><tr><td data-evidence="N18-C1697" id="N18-C1697">Kerendia et inhibiteur modéré du CYP3A4</td><td data-evidence="N18-C1698" id="N18-C1698">Exposition multipliée jusqu’à 3,48</td><td data-evidence="N18-C1699" id="N18-C1699">Instauration à 10 mg, potassium surveillé</td></tr><tr><td data-evidence="N18-C1700" id="N18-C1700">Spironolactone et bloqueur du système rénine–angiotensine</td><td data-evidence="N18-C1701" id="N18-C1701">Hyperkaliémie</td><td data-evidence="N18-C1702" id="N18-C1702">Spironolactone ≤ 25 mg/j (SSED/SSN)</td></tr><tr><td data-evidence="N18-C1703" id="N18-C1703">Veltassa et autres médicaments oraux</td><td data-evidence="N18-C1704" id="N18-C1704">Liaison possible dans le tube digestif</td><td data-evidence="N18-C1705" id="N18-C1705">Intervalle de 3 heures</td></tr><tr><td data-evidence="N18-C1706" id="N18-C1706">Crestor et ciclosporine</td><td data-evidence="N18-C1707" id="N18-C1707">Exposition augmentée à la rosuvastatine</td><td data-evidence="N18-C1708" id="N18-C1708">Contre-indiqué</td></tr></tbody></table><h3>Un réflexe à chaque ajout</h3><p data-evidence="N18-C1709" id="N18-C1709">Chaque nouveau médicament se confronte à la liste existante : mécanisme de l’hyperkaliémie, voie d’élimination, enzyme de métabolisme. La FI de Kerendia demande de contrôler le potassium à l’instauration ou au changement de dose d’un inhibiteur du CYP3A4, même lorsque Kerendia lui-même n’a pas changé.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-p02-fenetre-2" data-title="Surveillance : variation attendue et alerte"><h3>Distinguer l’effet attendu de l’alerte</h3><p data-evidence="N18-C1710" id="N18-C1710">Plusieurs traitements protecteurs modifient les examens de façon prévisible. Le tableau sépare la variation attendue, qui ne justifie pas l’arrêt, du seuil qui impose une action.</p><table class="t"><thead><tr><th>Produit</th><th>Variation attendue</th><th>Seuil d’alerte et conduite</th></tr></thead><tbody><tr><td data-evidence="N18-C1711" id="N18-C1711">Kerendia</td><td data-evidence="N18-C1712" id="N18-C1712">Baisse moyenne du DFG de 2–3 mL/min/1,73 m² en quatre semaines, puis stabilisation ; potassium moyen + 0,2 mmol/L</td><td data-evidence="N18-C1713" id="N18-C1713">Potassium &gt; 5,5 mmol/L : interruption ; reprise à 10 mg si ≤ 5,0</td></tr><tr><td data-evidence="N18-C1714" id="N18-C1714">Inhibiteur de l’enzyme de conversion ou sartan</td><td data-evidence="N18-C1715" id="N18-C1715">Hausse de créatinine ≤ 30 % en quatre semaines</td><td data-evidence="N18-C1716" id="N18-C1716">Hausse &gt; 30 % : recherche de cause, adaptation</td></tr><tr><td data-evidence="N18-C1717" id="N18-C1717">Inhibiteur SGLT2</td><td data-evidence="N18-C1718" id="N18-C1718">Baisse réversible du DFGe à l’instauration</td><td data-evidence="N18-C1719" id="N18-C1719">Pas d’arrêt pour cette seule baisse (KDIGO)</td></tr><tr><td data-evidence="N18-C1720" id="N18-C1720">Aranesp</td><td data-evidence="N18-C1721" id="N18-C1721">Hausse progressive de l’hémoglobine</td><td data-evidence="N18-C1722" id="N18-C1722">Hausse &gt; 2 g/dL en 4 semaines : dose réduite d’environ 25 % ; éviter &gt; 12 g/dL</td></tr><tr><td data-evidence="N18-C1723" id="N18-C1723">Veltassa</td><td data-evidence="N18-C1724" id="N18-C1724">Baisse moyenne du magnésium ≤ 0,118 mg/dL la première semaine</td><td data-evidence="N18-C1725" id="N18-C1725">Magnésium &lt; 1,4 mg/dL chez 7,1 % des patients : surveillance du magnésium</td></tr></tbody></table><h3>Pourquoi cette distinction protège</h3><p data-evidence="N18-C1726" id="N18-C1726">KDIGO observe que l’arrêt définitif d’un inhibiteur du système rénine–angiotensine est la réaction la plus fréquente après un effet indésirable, alors que cet arrêt s’associe à davantage d’événements cardiovasculaires et de décès. Une variation attendue lue comme une alerte prive donc le patient d’un traitement utile ; une alerte lue comme une variation attendue l’expose à un risque.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>.</p></template>
<template data-pop="n18-drapeaux" data-title="Drapeaux rouges — consensus suisse diabète et rein"><p data-evidence="N18-C0958" id="N18-C0958">Chez une personne diabétique de type 2, le consensus de la Société suisse d’endocrinologie et de diabétologie et de la Société suisse de néphrologie (publication initiale mai 2024) énumère les signes qui doivent faire adresser au néphrologue, parce qu’ils ne cadrent pas avec une maladie rénale associée au diabète d’évolution habituelle :</p><ul><li>une hématurie persistante ou un sédiment actif ;</li><li>une baisse rapide et soutenue du DFGe, de plus de 5 mL/min par an ;</li><li>une augmentation rapide de l’albuminurie, ou une albuminurie de catégorie A3 ;</li><li>un DFGe trop bas pour l’âge (tableau ci-dessous) ;</li><li>un syndrome néphrotique : protéinurie de rang néphrotique, hypoalbuminémie, œdèmes et hypercholestérolémie ;</li><li>des antécédents familiaux de maladie rénale héréditaire ;</li><li>une hypertension résistante, ou une baisse du DFGe de plus de 30 % après l’instauration d’un bloqueur du système rénine–angiotensine.</li></ul><p data-evidence="N18-C0959" id="N18-C0959">Le seuil d’âge se lit dans un tableau, car la filtration diminue physiologiquement avec l’âge :</p><table class="t"><thead><tr><th>Âge</th><th>DFGe jugé trop bas</th><th>Conséquence</th></tr></thead><tbody><tr><td>Moins de 40 ans</td><td>&lt; 75 mL/min/1,73 m²</td><td>Avis néphrologique</td></tr><tr><td>40 à 65 ans</td><td>&lt; 60 mL/min/1,73 m²</td><td>Avis néphrologique</td></tr><tr><td>Plus de 65 ans</td><td>&lt; 45 mL/min/1,73 m²</td><td>Avis néphrologique</td></tr></tbody></table><p data-evidence="N18-C0960" id="N18-C0960">Exemple fictif : une femme diabétique de 35 ans a un DFGe de 70 mL/min/1,73 m² ; cette valeur, banale à 70 ans, est trop basse pour son âge et justifie un avis. Ces drapeaux complètent les critères généraux de la fiche SSN 2025 (DFGe &lt; 30, ACR durablement &gt; 30 mg/mmol, cause inconnue, progression, hématurie glomérulaire), sans les remplacer.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template><template data-pop="n18-acidose-seuils" data-title="Bicarbonate : seuils suisses et internationaux"><p data-evidence="N18-C0961" id="N18-C0961">Deux textes suisses fixent des repères différents pour l’acidose métabolique de la maladie rénale chronique. Le tableau les place côte à côte ; il distingue une définition, un seuil d’intervention et une cible.</p><table class="t"><thead><tr><th>Bicarbonate sérique</th><th>Texte et population</th><th>Signification</th></tr></thead><tbody><tr><td>&lt; 18 mmol/L</td><td>Fiche SSN du 17.03.2025 et KDIGO 2024, adultes avec maladie rénale chronique</td><td>Seuil à partir duquel un traitement par bicarbonate de sodium est envisagé</td></tr><tr><td>&lt; 22 mmol/L, fonction pulmonaire normale</td><td>Consensus SSED/SSN, diabète de type 2 (mai 2024)</td><td>Définition de l’acidose métabolique ; autres causes à exclure ; bicarbonate dosé si DFGe &lt; 60 ou hyperkaliémie inexpliquée</td></tr><tr><td>22 à 26 mmol/L</td><td>Consensus SSED/SSN, diabète de type 2</td><td>Cible du traitement par bicarbonate de sodium, deux à trois prises par jour</td></tr><tr><td>Au-dessus de la limite supérieure de la normale du laboratoire</td><td>KDIGO 2024</td><td>Surcorrection à éviter, avec surveillance de la pression, du potassium et du volume</td></tr></tbody></table><p data-evidence="N18-C0962" id="N18-C0962">Résolution retenue par le cours : la fiche SSN de mars 2025, plus récente et applicable à tous les adultes, fonde le seuil d’intervention de 18 mmol/L. Chez la personne diabétique de type 2 suivie selon le consensus SSED/SSN, un bicarbonate entre 18 et 21 mmol/L justifie de rechercher une autre cause d’acidose et de discuter un traitement visant 22 à 26 mmol/L, en tenant compte de la charge sodée. Le texte en vigueur de chaque source est accessible par les liens ci-dessous.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-creatinine" data-title="Créatinine — ce que mesure le marqueur"><h3>Origine et élimination</h3><p data-evidence="N18-C1400" id="N18-C1400">La créatinine provient du métabolisme musculaire. Elle est filtrée librement, n’est pas réabsorbée et n’est que faiblement sécrétée par le tubule. Sa concentration sanguine dépend donc de trois éléments : la quantité produite, la filtration et la part éliminée par d’autres voies. Elle n’est pas le débit lui-même : une équation la convertit en DFGe.</p><h3>Ce qui modifie la créatinine sans changer la filtration</h3><p data-evidence="N18-C1401" id="N18-C1401">KDIGO nomme ces facteurs les déterminants non liés au DFG : production par l’alimentation et la masse musculaire, sécrétion tubulaire, élimination extrarénale. Le tableau donne leur effet sur l’estimation.</p><table class="t"><thead><tr><th>Facteur</th><th>Effet sur la créatinine</th><th>Effet sur le DFGe calculé</th></tr></thead><tbody><tr><td data-evidence="N18-C1402" id="N18-C1402">Masse musculaire élevée, culturisme, compléments de créatine</td><td data-evidence="N18-C1403" id="N18-C1403">Hausse</td><td data-evidence="N18-C1404" id="N18-C1404">Sous-estimation</td></tr><tr><td data-evidence="N18-C1405" id="N18-C1405">Amputation, paraplégie, dénutrition, trouble alimentaire</td><td data-evidence="N18-C1406" id="N18-C1406">Baisse</td><td data-evidence="N18-C1407" id="N18-C1407">Surestimation</td></tr><tr><td data-evidence="N18-C1408" id="N18-C1408">Repas de viande ou de poisson cuit</td><td data-evidence="N18-C1409" id="N18-C1409">Hausse transitoire, environ 20 µmol/L</td><td data-evidence="N18-C1410" id="N18-C1410">Sous-estimation, environ 20 mL/min/1,73 m²</td></tr><tr><td data-evidence="N18-C1411" id="N18-C1411">Médicament réduisant la sécrétion tubulaire</td><td data-evidence="N18-C1412" id="N18-C1412">Hausse</td><td data-evidence="N18-C1413" id="N18-C1413">Sous-estimation</td></tr><tr><td data-evidence="N18-C1414" id="N18-C1414">Antibiotique à large spectre réduisant l’élimination extrarénale</td><td data-evidence="N18-C1415" id="N18-C1415">Hausse</td><td data-evidence="N18-C1416" id="N18-C1416">Sous-estimation</td></tr></tbody></table><h3>La méthode de dosage</h3><p data-evidence="N18-C1417" id="N18-C1417">La méthode colorimétrique de Jaffe réagit aussi avec des substances qui ne sont pas de la créatinine, comme le glucose et l’acétoacétate ; chez l’adulte, elles représentent environ 20 % de ce qui est mesuré aux concentrations physiologiques. KDIGO préfère la méthode enzymatique et demande de séparer le sérum des globules rouges dans les 12 heures avec la méthode de Jaffe. La créatinine se rend en µmol/L arrondie à l’unité ; 1 mg/dL correspond à 88,4 µmol/L.</p><h3>Valeurs et usages</h3><p data-evidence="N18-C1418" id="N18-C1418">La page publique des Hôpitaux universitaires de Genève cite 62–106 µmol/L comme repère illustratif ; l’intervalle du laboratoire qui a réalisé le dosage reste la référence. Certaines FI utilisent la créatinine elle-même : celle d’Eliquis réduit la dose lorsque la créatinine atteint 133 µmol/L ou plus, associée à l’âge ou au poids.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>.</p></template>
<template data-pop="n18-cystatine" data-title="Cystatine C — un second marqueur"><h3>Pourquoi un second marqueur</h3><p data-evidence="N18-C1419" id="N18-C1419">La cystatine C est un autre marqueur endogène de filtration, dont les déterminants non liés au DFG diffèrent de ceux de la créatinine. KDIGO cite l’adiposité élevée, le tabagisme, l’hypothyroïdie et l’hyperthyroïdie, l’excès de glucocorticoïdes et l’inflammation chronique, signalée par la résistance à l’insuline, une CRP élevée ou une albumine basse. Comme les erreurs des deux marqueurs ne coïncident pas, leur combinaison converge vers une meilleure estimation.</p><h3>Quand la demander</h3><p data-evidence="N18-C1420" id="N18-C1420">Le tableau reprend les situations de KDIGO où la créatinine seule est peu fiable.</p><table class="t"><thead><tr><th>Situation</th><th>Raison</th><th>Estimation conseillée</th></tr></thead><tbody><tr><td data-evidence="N18-C1421" id="N18-C1421">Trouble alimentaire, amputation, paraplégie</td><td data-evidence="N18-C1422" id="N18-C1422">Masse musculaire anormale</td><td data-evidence="N18-C1423" id="N18-C1423">Cystatine C seule si aucune autre maladie</td></tr><tr><td data-evidence="N18-C1424" id="N18-C1424">Obésité de classe III</td><td data-evidence="N18-C1425" id="N18-C1425">Les deux marqueurs sont touchés</td><td data-evidence="N18-C1426" id="N18-C1426">Créatinine–cystatine C</td></tr><tr><td data-evidence="N18-C1427" id="N18-C1427">Dénutrition, cancer, insuffisance cardiaque, cirrhose</td><td data-evidence="N18-C1428" id="N18-C1428">Maladie chronique agissant sur les deux marqueurs</td><td data-evidence="N18-C1429" id="N18-C1429">Créatinine–cystatine C ; DFG mesuré pour une décision thérapeutique</td></tr><tr><td data-evidence="N18-C1430" id="N18-C1430">Médicament réduisant la sécrétion de créatinine</td><td data-evidence="N18-C1431" id="N18-C1431">Seule la créatinine est touchée</td><td data-evidence="N18-C1432" id="N18-C1432">Cystatine C ou DFG mesuré</td></tr></tbody></table><h3>Interpréter une discordance</h3><p data-evidence="N18-C1433" id="N18-C1433">KDIGO rapporte que 25 à 30 % des personnes ont un écart d’au moins 15 mL/min/1,73 m² ou de 20 % entre les deux estimations. Lorsque les deux concordent, leur exactitude est élevée et semblable. Lorsqu’elles divergent, l’estimation combinée est la plus exacte. Un âge élevé, le sexe féminin, un IMC élevé, une perte de poids et un tabagisme actif s’associent à une estimation par créatinine plus haute que par cystatine C.</p><h3>Dosage et place suisse</h3><p data-evidence="N18-C1434" id="N18-C1434">La cystatine C se rend en mg/L arrondie au centième ; la créatinine se dose sur le même échantillon pour calculer l’estimation combinée. Le consensus SSED/SSN admet la cystatine C à la place de la créatinine pour le dépistage annuel du diabétique. KDIGO met en garde : la cystatine C n’est pas plus exacte dans toutes les situations.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="n18-a3-borne" data-title="Frontière A2/A3 : 30 mg/mmol selon les textes"><h3>Un désaccord d’écriture sur une seule valeur</h3><p data-evidence="N18-C1435" id="N18-C1435">Un ACR d’exactement 30 mg/mmol ne reçoit pas la même catégorie dans tous les textes. Le tableau cite chaque formulation avec sa date ; les liens donnent accès au texte actuellement en vigueur.</p><table class="t"><thead><tr><th>Texte</th><th>Formulation de la borne</th><th>Classement de 30 mg/mmol</th></tr></thead><tbody><tr><td data-evidence="N18-C1436" id="N18-C1436">KDIGO 2024, tableau 3</td><td data-evidence="N18-C1437" id="N18-C1437">A2 : 3–30 ; A3 : plus de 30</td><td data-evidence="N18-C1438" id="N18-C1438">A2</td></tr><tr><td data-evidence="N18-C1439" id="N18-C1439">KDIGO 2024, figure 48 (orientation)</td><td data-evidence="N18-C1440" id="N18-C1440">30 mg/mmol ou plus, associé à une hématurie</td><td data-evidence="N18-C1441" id="N18-C1441">Critère atteint si une hématurie est associée</td></tr><tr><td data-evidence="N18-C1442" id="N18-C1442">SSED/SSN 2024, premier tableau</td><td data-evidence="N18-C1443" id="N18-C1443">A2 : 3–29 ; A3 : 30 ou plus</td><td data-evidence="N18-C1444" id="N18-C1444">A3</td></tr><tr><td data-evidence="N18-C1445" id="N18-C1445">SSED/SSN 2024, tableau du risque cardiovasculaire</td><td data-evidence="N18-C1446" id="N18-C1446">A2 : 3–30 ; A3 : plus de 30</td><td data-evidence="N18-C1447" id="N18-C1447">A2</td></tr><tr><td data-evidence="N18-C1448" id="N18-C1448">SSN 2025, critère d’orientation</td><td data-evidence="N18-C1449" id="N18-C1449">ACR systématiquement supérieur à 30 mg/mmol</td><td data-evidence="N18-C1450" id="N18-C1450">Critère non atteint</td></tr><tr><td data-evidence="N18-C1451" id="N18-C1451">HUG 2017, tableau 3</td><td data-evidence="N18-C1452" id="N18-C1452">Modérée : 3–30 ; sévère : plus de 30</td><td data-evidence="N18-C1453" id="N18-C1453">Albuminurie modérée</td></tr></tbody></table><h3>La règle retenue dans ce cours</h3><p data-evidence="N18-C1454" id="N18-C1454">La classification de référence est le tableau 3 de KDIGO 2024, que la fiche SSN 2025 reprend expressément ; une valeur de 30 mg/mmol y appartient à A2. Le consensus SSED/SSN emploie deux écritures différentes dans le même document : son premier tableau ne peut donc pas trancher seul. Le cours enseigne la borne KDIGO et signale la variante suisse.</p><h3>Pourquoi la conséquence pratique reste limitée</h3><p data-evidence="N18-C1455" id="N18-C1455">Une décision ne repose jamais sur une valeur frontière unique. KDIGO considère qu’un ACR doit doubler pour dépasser la variabilité du laboratoire : 30 et 31 mg/mmol ne se distinguent pas biologiquement. Devant 30 mg/mmol, on confirme sur une urine du matin, on vérifie les facteurs de variation et on regarde la persistance ; un ACR durablement au-dessus de 30 motive l’avis selon la SSN.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
