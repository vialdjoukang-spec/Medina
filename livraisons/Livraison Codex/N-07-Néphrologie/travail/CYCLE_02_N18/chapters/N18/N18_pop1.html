" data-k="n18-e01-fenetre-1">créatinine</button> comme le simple « stade habituel ».</p><h3>Réévaluer sans retarder une prise en charge nécessaire</h3><p data-evidence="N18-C0530" id="N18-C0530">On recherche les données antérieures immédiatement, puis on répète les examens dans un délai adapté à la gravité et, si nécessaire, au-delà de trois mois pour démontrer la chronicité. Une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button>, une surcharge ou une suspicion de glomérulonéphrite rapidement progressive ne peut attendre cette échéance. Exercice : un <button class="w" data-k="n18-dfg">DFGe</button> de 42 obtenu aujourd’hui sans antériorité autorise « filtration réduite à explorer », mais pas encore l’affirmation d’une maladie chronique sur ce seul résultat.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a03-fenetre-1" data-title="Filtration et albuminurie : axes distincts"><h3>Décrire la cause, la filtration et l’albuminurie</h3><p data-evidence="N18-C0531" id="N18-C0531">La classification clinique associe la cause, la catégorie de filtration G et la catégorie d’albuminurie A. La cause explique ce qui lèse le rein; G décrit la capacité globale de filtration estimée; A renseigne sur une fuite d’albumine et contribue au pronostic. Écrire les trois axes évite de confondre sévérité fonctionnelle et mécanisme de maladie.</p><h3>Ajouter une information urinaire indépendante</h3><p data-evidence="N18-C0532" id="N18-C0532">L’<button class="w" data-k="n18-acr">ACR</button> rapporte l’albumine à la <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> du même échantillon. Il renseigne sur une fuite urinaire et complète la filtration.</p><p data-evidence="N18-C0533" id="N18-C0533">Les catégories suivantes décrivent l’albuminurie chez l’adulte. Les seuils conventionnels sont ceux de KDIGO 2024; le prélèvement et la persistance restent à vérifier.</p><table class="t"><thead><tr><th>Catégorie</th><th><button class="w" data-k="n18-acr">ACR</button> mg/mmol</th><th>Convention mg/g</th><th>Conséquence</th></tr></thead><tbody><tr><td data-evidence="N18-C0534" id="N18-C0534">A1</td><td data-evidence="N18-C0535" id="N18-C0535">&lt;3</td><td data-evidence="N18-C0536" id="N18-C0536">&lt;30</td><td data-evidence="N18-C0537" id="N18-C0537">L’albuminurie est faible; elle n’exclut pas une autre preuve de maladie.</td></tr><tr><td data-evidence="N18-C0538" id="N18-C0538">A2</td><td data-evidence="N18-C0539" id="N18-C0539">3–30</td><td data-evidence="N18-C0540" id="N18-C0540">30–300</td><td data-evidence="N18-C0541" id="N18-C0541">La hausse modérée persistante constitue un marqueur de lésion.</td></tr><tr><td data-evidence="N18-C0542" id="N18-C0542">A3</td><td data-evidence="N18-C0543" id="N18-C0543">&gt;30</td><td data-evidence="N18-C0544" id="N18-C0544">&gt;300</td><td data-evidence="N18-C0545" id="N18-C0545">La hausse importante augmente le risque et participe au recours suisse.</td></tr></tbody></table><p data-evidence="N18-C0546" id="N18-C0546">Les valeurs en mg/g sont des bornes conventionnelles arrondies, pas une conversion arithmétique exacte. Un adulte à 15 mg/mmol est A2; un seul résultat ne démontre pas la chronicité.</p><p data-evidence="N18-C0547" id="N18-C0547">Une filtration conservée avec A3 peut signaler un risque élevé; un <button class="w" data-k="n18-dfg">DFGe</button> bas persistant reste une maladie chronique avec A1.</p><h3>Classer puis poser une décision proportionnée</h3><p data-evidence="N18-C0548" id="N18-C0548">M. L. a une filtration de 40, donc G3b, et un <button class="w" data-k="n18-acr">ACR</button> de 35, donc A3. La classe combinée justifie une recherche causale, une protection et un avis selon les critères suisses; elle n’autorise pas un pronostic chiffré sans modèle adapté. Exercice : un adulte G1 A1 avec une anomalie structurelle chronique peut avoir une maladie rénale; un adulte G1 A1 sans aucun marqueur n’en a pas sur ces seules données. La présence du marqueur change la conclusion.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a03-fenetre-2" data-title="Matrice de risque : lecture et limites"><h3>Interpréter une matrice sans lui attribuer un pourcentage</h3><p data-evidence="N18-C0549" id="N18-C0549">La matrice croise G et A pour comparer les risques de progression et d’événements associés. Les couleurs expriment des niveaux relatifs, sans horizon chiffré unique ni probabilité personnelle. L’âge, la cause, les comorbidités et la trajectoire restent nécessaires. Le vert n’exclut pas une lésion structurelle; en G1–G2 A1 sans autre marqueur, il n’y a pas de maladie rénale chronique définie par ces seules valeurs.</p><p data-evidence="N18-C0550" id="N18-C0550">La figure publiée ci-dessous ajoute des fréquences indicatives de contrôle et des mentions d’orientation. « Treat » signifie prise en charge, « Refer » avis spécialisé; les chiffres 1, 2, 3 et 4+ correspondent au nombre indicatif de contrôles annuels, non à un stade ou à un risque en pour-cent. L’astérisque renvoie à la possibilité de discuter le besoin d’un avis formel lorsque l’anomalie est isolée et stable, selon l’organisation locale. Ces éléments proviennent de la figure adaptée de KDIGO dans l’article; les critères suisses de recours sont développés en A06 et priment pour ce cours.</p><p data-evidence="N18-C0551" id="N18-C0551">Les couleurs de la matrice publiée représentent une gradation qualitative. Elles n’ont pas de bornes de probabilité individuelle inventées.</p><table class="t"><thead><tr><th>Couleur</th><th>Niveau relatif</th><th>Lecture</th></tr></thead><tbody><tr><td data-evidence="N18-C0552" id="N18-C0552">Vert</td><td data-evidence="N18-C0553" id="N18-C0553">Faible</td><td data-evidence="N18-C0554" id="N18-C0554">La présence d’une maladie dépend encore des autres marqueurs.</td></tr><tr><td data-evidence="N18-C0555" id="N18-C0555">Jaune</td><td data-evidence="N18-C0556" id="N18-C0556">Modérément accru</td><td data-evidence="N18-C0557" id="N18-C0557">Le suivi prend en compte cause et trajectoire.</td></tr><tr><td data-evidence="N18-C0558" id="N18-C0558">Orange</td><td data-evidence="N18-C0559" id="N18-C0559">Élevé</td><td data-evidence="N18-C0560" id="N18-C0560">La protection et les complications demandent davantage d’attention.</td></tr><tr><td data-evidence="N18-C0561" id="N18-C0561">Rouge</td><td data-evidence="N18-C0562" id="N18-C0562">Très élevé</td><td data-evidence="N18-C0563" id="N18-C0563">Une évaluation spécialisée et un suivi adapté sont discutés selon les critères cliniques.</td></tr></tbody></table><p data-evidence="N18-C0564" id="N18-C0564">Ces niveaux comparent des catégories G/A. Ils ne donnent ni une date de dialyse ni un pourcentage à cinq ans; une équation appropriée répond à cette autre question.</p><h3>Lire les catégories avec leurs unités</h3><p data-evidence="N18-C0565" id="N18-C0565">Le tableau reprend KDIGO 2024 pour l’adulte, après confirmation de chronicité. Le <button class="w" data-k="n18-dfg">DFGe</button> est indexé sur une surface corporelle de 1,73 m²; il ne s’agit pas d’une clairance médicamenteuse automatiquement interchangeable.</p><table><thead><tr><th>Catégorie</th><th><button class="w" data-k="n18-dfg">DFGe</button>, mL/min/1,73 m²</th><th>Portée</th></tr></thead><tbody><tr><td data-evidence="N18-C0566" id="N18-C0566">G1</td><td data-evidence="N18-C0567" id="N18-C0567">≥ 90</td><td data-evidence="N18-C0568" id="N18-C0568">Filtration normale ou élevée; un autre marqueur est nécessaire pour parler de maladie chronique.</td></tr><tr><td data-evidence="N18-C0569" id="N18-C0569">G2</td><td data-evidence="N18-C0570" id="N18-C0570">60–89</td><td data-evidence="N18-C0571" id="N18-C0571">Filtration légèrement diminuée; même exigence de marqueur.</td></tr><tr><td data-evidence="N18-C0572" id="N18-C0572">G3a</td><td data-evidence="N18-C0573" id="N18-C0573">45–59</td><td data-evidence="N18-C0574" id="N18-C0574">Diminution légère à modérée.</td></tr><tr><td data-evidence="N18-C0575" id="N18-C0575">G3b</td><td data-evidence="N18-C0576" id="N18-C0576">30–44</td><td data-evidence="N18-C0577" id="N18-C0577">Diminution modérée à sévère.</td></tr><tr><td data-evidence="N18-C0578" id="N18-C0578">G4</td><td data-evidence="N18-C0579" id="N18-C0579">15–29</td><td data-evidence="N18-C0580" id="N18-C0580">Diminution sévère; suivi spécialisé habituellement nécessaire.</td></tr><tr><td data-evidence="N18-C0581" id="N18-C0581">G5</td><td data-evidence="N18-C0582" id="N18-C0582">&lt; 15</td><td data-evidence="N18-C0583" id="N18-C0583">Insuffisance rénale (« kidney failure » dans KDIGO) ; évaluation du parcours, pas dialyse automatique.</td></tr></tbody></table><p data-evidence="N18-C0584" id="N18-C0584">Les valeurs frontières appartiennent à une seule ligne : 30 est G3b et 15 est G4. Le risque reste continu malgré ces catégories pratiques.</p><h3>Classer puis poser une décision proportionnée</h3><p data-evidence="N18-C0585" id="N18-C0585">M. L. a une filtration de 40, donc G3b, et un <button class="w" data-k="n18-acr">ACR</button> de 35, donc A3. La classe combinée justifie une recherche causale, une protection et un avis selon les critères suisses; elle n’autorise pas un pronostic chiffré sans modèle adapté. Exercice : un adulte G1 A1 avec une anomalie structurelle chronique peut avoir une maladie rénale; un adulte G1 A1 sans aucun marqueur n’en a pas sur ces seules données. La présence du marqueur change la conclusion.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a04-fenetre-1" data-title="Progression : trajectoires et biais"><h3>Lire une trajectoire plutôt que prolonger une droite</h3><p data-evidence="N18-C0586" id="N18-C0586">La <button class="w" data-k="n18-trajectoire">trajectoire</button> combine plusieurs mesures datées, les changements de traitement et les épisodes intercurrents. Une diminution initiale après un médicament hémodynamique n’a pas la même signification qu’une baisse persistante inexpliquée. KDIGO propose d’évaluer une variation de <button class="w" data-k="n18-dfg">DFGe</button> supérieure à 20 % entre contrôles; après l’introduction d’un traitement hémodynamique, une baisse supérieure à 30 % mérite une évaluation. Ces seuils déclenchent une recherche, sans nommer automatiquement la cause.</p><h3>Le recrutement modifie les chiffres observés</h3><p data-evidence="N18-C0587" id="N18-C0587">Une population dépistée pour diabète ou hypertension, une consultation de médecine générale et un service de néphrologie ne contiennent pas les mêmes profils. La SSN recommande un dépistage ciblé sur les facteurs de risque. Les patients adressés au néphrologue sont sélectionnés notamment pour sévérité, progression ou incertitude causale; leur risque ne se transfère pas automatiquement à l’ensemble des adultes. Toute proportion doit donc être accompagnée de son dénominateur et de la méthode de sélection.</p><h3>Relier le mécanisme au choix du traitement</h3><p data-evidence="N18-C0588" id="N18-C0588">Une obstruction appelle une évaluation urologique; une maladie immunologique peut demander une preuve et un traitement spécialisé; une maladie héréditaire conduit à une information familiale adaptée. La protection commune s’ajoute à ces interventions, elle ne les remplace pas. Exercice : comparer une chute brutale de 55 à 35 après diarrhée et une baisse de 55 à 50 sur plusieurs années; la première impose d’abord une recherche aiguë, sans extrapoler la même pente future aux deux personnes.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a04-fenetre-2" data-title="Recherche causale : examens orientés"><h3>Orienter la recherche parmi plusieurs groupes de causes</h3><p data-evidence="N18-C0589" id="N18-C0589">Les atteintes glomérulaires se discutent devant albuminurie et <button class="w" data-k="n18-hematurie">hématurie</button>; les maladies vasculaires devant le contexte cardiovasculaire et tensionnel; les atteintes tubulo-interstitielles devant certaines expositions, anomalies tubulaires ou infections; les anomalies obstructives et structurelles à partir de l’histoire et de l’imagerie. Les maladies héréditaires nécessitent une histoire familiale et parfois une exploration génétique. Ces indices orientent une hypothèse; aucun n’attribue à lui seul une cause certaine.</p><h3>Séparer facteur associé et effet démontré d’une intervention</h3><p data-evidence="N18-C0590" id="N18-C0590">Une albuminurie plus importante, une pression mal contrôlée ou une filtration plus basse signalent un risque accru. La protection repose cependant sur des interventions étudiées dans des populations définies : maîtrise tensionnelle, inhibition du système rénine–angiotensine selon l’indication, inhibiteurs SGLT2 dans les groupes concernés, et prise en charge de la cause. L’existence d’un facteur de risque ne justifie pas l’ensemble des médicaments disponibles chez chaque patient.</p><h3>Relier le mécanisme au choix du traitement</h3><p data-evidence="N18-C0591" id="N18-C0591">Une obstruction appelle une évaluation urologique; une maladie immunologique peut demander une preuve et un traitement spécialisé; une maladie héréditaire conduit à une information familiale adaptée. La protection commune s’ajoute à ces interventions, elle ne les remplace pas. Exercice : comparer une chute brutale de 55 à 35 après diarrhée et une baisse de 55 à 50 sur plusieurs années; la première impose d’abord une recherche aiguë, sans extrapoler la même pente future aux deux personnes.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a05-fenetre-1" data-title="Examen de volume : technique et limites"><h3>Mesurer avec une méthode reproductible</h3><p data-evidence="N18-C0592" id="N18-C0592">On mesure la pression avec un dispositif et un brassard adaptés, au repos, et on recherche une <button class="w" data-k="n18-orthostase">intolérance orthostatique</button> si symptômes ou fragilité. Poids, évolution pondérale et examen du <button class="w" data-k="n18-volume">volume extracellulaire</button> aident à interpréter œdèmes, <button class="w" data-k="n18-volume">dyspnée</button> ou déshydratation. L’auscultation pulmonaire, l’examen cardiovasculaire, cutané et urinaire se choisissent selon les hypothèses. Une cible tensionnelle n’a de sens qu’avec la méthode de mesure qui lui correspond.</p><h3>Interroger les symptômes et leurs explications concurrentes</h3><p data-evidence="N18-C0593" id="N18-C0593"><button class="w" data-k="n18-symptomes">Fatigue</button>, diminution de l’appétit, <button class="w" data-k="n18-symptomes">nausées</button>, <button class="w" data-k="n18-symptomes">prurit</button>, crampes ou <button class="w" data-k="n18-symptomes">nycturie</button> peuvent accompagner une atteinte avancée mais restent peu spécifiques. Une <button class="w" data-k="n18-volume">dyspnée</button> peut traduire surcharge, <button class="w" data-k="n18-fer-criteres">anémie</button> ou maladie cardiaque; elle exige son propre examen. L’<button class="w" data-k="n18-oedeme">œdème</button> ne prouve pas une cause rénale. On documente début, évolution, retentissement, traitements associés et signes nouveaux pour éviter de tout regrouper sous le diagnostic chronique.</p><h3>Identifier les motifs d’évaluation urgente</h3><p data-evidence="N18-C0594" id="N18-C0594">Une <button class="w" data-k="n18-volume">dyspnée</button> importante avec surcharge, une altération neurologique, une suspicion de péricardite urémique, une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> préoccupante, une oligurie nouvelle ou une dégradation rapide demandent une évaluation urgente. Une <button class="w" data-k="n18-hematurie">hématurie</button> associée à une baisse rapide de fonction et à des signes systémiques peut annoncer une atteinte glomérulaire grave. La décision dépend du tableau et des ressources; elle ne doit pas attendre le prochain contrôle programmé pour la maladie chronique.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>.</p></template>
<template data-pop="n18-a05-fenetre-2" data-title="Traitements et néphrotoxicité : interrogatoire"><h3>Faire une liste de produits réellement pris</h3><p data-evidence="N18-C0595" id="N18-C0595">Le <button class="w" data-k="n18-medicaments">bilan médicamenteux</button> inclut ordonnances, anti-inflammatoires achetés sans ordonnance, compléments, plantes, produits de contraste récents et adaptations prises pendant une maladie aiguë. Pour chaque produit : nom exact, dose, fréquence, date de début, motif et dernière prise. On recherche aussi les associations qui favorisent déshydratation, <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> ou interaction. Un patient peut considérer un complément comme un aliment et ne pas le citer spontanément.</p><h3>Reconstituer l’histoire rénale et générale</h3><p data-evidence="N18-C0596" id="N18-C0596">L’entretien recherche dates des premières anomalies, épisodes aigus, diabète, hypertension, maladies cardiovasculaires, maladies systémiques, troubles urinaires et antécédents de calculs. Les antécédents familiaux de maladie rénale ou de dialyse, une prématurité et une prééclampsie antérieure peuvent orienter le risque. L’exposition professionnelle et environnementale fait partie de la recherche causale. On demande le déroulement précis, plutôt que d’attribuer toute atteinte au facteur de risque le plus visible.</p><p data-evidence="N18-C0597" id="N18-C0597">La fiche suisse cite explicitement aussi le virus de l’immunodéficience humaine, le lupus et les vascularites comme maladies systémiques à risque. L’interrogatoire recherche une irradiation abdominale ou une chimiothérapie néphrotoxique antérieure. Chez l’adulte diabétique, le dépistage est au moins annuel; pour les autres facteurs persistants, sa fréquence est individualisée, même si le premier bilan ne démontre pas de maladie.</p><h3>Conserver un point de comparaison utile</h3><p data-evidence="N18-C0598" id="N18-C0598">Le dossier de suivi rassemble la pression et sa méthode, le poids, les symptômes, les médicaments, le <button class="w" data-k="n18-dfg">DFGe</button> avec équation, l’<button class="w" data-k="n18-acr">ACR</button> avec unités et les événements depuis la dernière visite. Il précise aussi le responsable du prochain contrôle et les signes motivant un contact anticipé. Exercice : préparer l’entretien de M. L. en séparant les questions de cause, de tolérance médicamenteuse et de complication; cette séparation rend la transmission plus précise.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a06-fenetre-1" data-title="Recours néphrologique : critères"><h3>Adresser selon les critères suisses et distinguer l’urgence</h3><p data-evidence="N18-C0599" id="N18-C0599">La SSN 2025 recommande un avis notamment pour <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30, <button class="w" data-k="n18-acr">ACR</button> persistant &gt; 30 mg/mmol, cause inconnue, progression, <button class="w" data-k="n18-hematurie">hématurie</button> glomérulaire, <button class="w" data-k="n18-resistance">hypertension résistante</button>, anomalie persistante du potassium, maladie héréditaire ou calculs récurrents. Une insuffisance aiguë ou une baisse abrupte persistante demande une orientation adaptée à sa gravité. Le <button class="w" data-k="n18-recours">dossier d’orientation</button> contient la chronologie, les analyses, l’imagerie, les traitements et la question adressée.</p><p data-evidence="N18-C0600" id="N18-C0600">La figure suivante est un algorithme publié de coordination des soins primaires en Australie; son dépistage, sa confirmation et son retour vers le suivi illustrent une organisation, sans constituer une directive suisse. Les branches cliniques appliquées ici sont celles de la SSN ci-dessus et de la démarche étiologique précédente. Le schéma ne contient pas à lui seul toutes les indications de <button class="w" data-k="n18-biopsie">biopsie</button> et d’imagerie exposées dans le texte.</p><h3>Choisir chaque examen pour une question</h3><p data-evidence="N18-C0601" id="N18-C0601">Le bilan doit répondre à quatre questions : quelle cause, quelle gravité actuelle, quelle complication et quelle évolution? La <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> et l’<button class="w" data-k="n18-acr">ACR</button> participent à plusieurs réponses, mais ne remplacent ni l’examen ni l’imagerie ciblée. Une exploration supplémentaire n’est utile que si son résultat peut modifier le diagnostic, la surveillance, le traitement ou l’information du patient.</p><h3>Réviser une hypothèse quand les faits ne concordent pas</h3><p data-evidence="N18-C0602" id="N18-C0602">Si le patient supposé avoir une atteinte diabétique présente un sédiment actif, une progression rapide ou une asymétrie marquée, l’hypothèse doit être réexaminée. Une cause peut rester indéterminée après une exploration proportionnée; cette incertitude est documentée sans bloquer la protection. Pour M. L., l’<button class="w" data-k="n18-acr">ACR</button> A3 persistant motive déjà un avis selon la SSN, même si sa filtration reste au-dessus de 30.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a06-fenetre-2" data-title="Biopsie : question et limites"><h3>Discuter <button class="w" data-k="n18-biopsie">biopsie</button> et génétique à partir d’un bénéfice attendu</h3><p data-evidence="N18-C0603" id="N18-C0603">Une <button class="w" data-k="n18-biopsie">biopsie rénale</button> se discute lorsque l’identification de la lésion peut guider le traitement ou le pronostic, après évaluation du risque et de l’acceptabilité. Un examen génétique peut être pertinent devant une histoire familiale, un phénotype évocateur ou une cause inexpliquée. Le patient doit connaître les limites de rendement et les conséquences possibles pour lui et sa famille. Ni la <button class="w" data-k="n18-biopsie">biopsie</button> ni le test génétique ne sont automatiques pour toute catégorie G3.</p><h3>Associer les indices biologiques et urinaires</h3><p data-evidence="N18-C0604" id="N18-C0604">On confronte albuminurie, <button class="w" data-k="n18-proteinurie">protéinurie</button> et sédiment urinaire. Une <button class="w" data-k="n18-proteinurie">protéinurie</button> dont l’albumine n’explique qu’une faible part peut faire rechercher d’autres protéines, dont des chaînes légères selon le contexte. Une <button class="w" data-k="n18-hematurie">hématurie glomérulaire</button> associée à une <button class="w" data-k="n18-proteinurie">protéinurie</button> oriente autrement qu’une infection symptomatique. Immunologie, électrophorèse ou sérologies sont demandées selon les indices cliniques; elles ne forment pas un panel obligatoire identique pour tous.</p><h3>Interroger la morphologie</h3><p data-evidence="N18-C0605" id="N18-C0605">L’<button class="w" data-k="n18-echographie">échographie</button> recherche notamment taille et asymétrie, aspect cortical, dilatation des cavités, kystes et autres anomalies structurelles. Un petit rein avec cortex aminci soutient une atteinte chronique; l’échogénicité est peu spécifique et dépend de comparaisons et de la technique. L’examen ne mesure pas directement la filtration séparée de chaque rein et ne remplace pas une histologie lorsqu’une question histologique précise demeure.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="n18-a07-fenetre-1" data-title="Protection rénale : indication et preuve"><h3>Sélectionner les traitements protecteurs</h3><p data-evidence="N18-C0606" id="N18-C0606">L’inhibition du système rénine–angiotensine est particulièrement importante dans les maladies albuminuriques, selon pression, diabète et tolérance. Les inhibiteurs SGLT2 ont une place dans plusieurs populations, y compris certaines sans diabète; ils ne s’appliquent pas indistinctement à toute maladie rénale. La SSN réserve la finérénone, antagoniste minéralocorticoïde non stéroïdien, au diabète de type 2 déjà traité par un inhibiteur du système rénine–angiotensine à la dose maximale tolérée, avec <button class="w" data-k="n18-dfg">DFGe</button> ≥ 25 mL/min/1,73 m², potassium ≤ 5 mmol/L et <button class="w" data-k="n18-acr">ACR</button> ≥ 3 mg/mmol. Le chapitre pharmacologique expose les doses et limites des produits suisses exacts.</p><p data-evidence="N18-C0607" id="N18-C0607">Le repère SSN/KDIGO d’introduction d’un inhibiteur SGLT2 dès un <button class="w" data-k="n18-dfg">DFGe</button> de 20 ne doit pas être confondu avec la FI de Forxiga : ce produit ne recommande pas une initiation au-dessous de 25. Cette différence est conservée explicitement, sans rendre une recommandation de classe équivalente à une autorisation du produit.</p><p data-evidence="N18-C0608" id="N18-C0608">La SSN propose un inhibiteur SGLT2 pour un <button class="w" data-k="n18-dfg">DFGe</button> de 20–45, ou au-dessus de 45 avec <button class="w" data-k="n18-acr">ACR</button> &gt; 20 mg/mmol, diabète ou insuffisance cardiaque. Elle envisage un agoniste du récepteur GLP-1 lorsque cela convient au diabète de type 2; la FI récente d’<button class="w" data-k="n18-ozempic">Ozempic</button> comporte désormais une indication de ralentissement de la maladie rénale dans cette population. Les conditions de remboursement relèvent de la liste suisse des spécialités et ne sont pas déduites de l’autorisation.</p><h3>Respecter la cause et les populations étudiées</h3><p data-evidence="N18-C0609" id="N18-C0609">Une maladie immunologique active, une polykystose, une transplantation ou un diabète de type 1 impose une analyse spécifique. La FI de Forxiga ne recommande pas son emploi dans plusieurs de ces contextes et exclut le traitement du diabète de type 1 en raison notamment du risque d’acidocétose. La protection commune ne remplace pas le traitement d’une obstruction ou d’une glomérulonéphrite. Une indication retenue dans un essai ne se transpose pas par analogie à une population exclue.</p><h3>Prévoir le contrôle avant d’écrire l’ordonnance</h3><p data-evidence="N18-C0610" id="N18-C0610">Avant une inhibition du système rénine–angiotensine, on documente pression, <button class="w" data-k="n18-e01-fenetre-1">créatinine</button>, potassium et état de volume; KDIGO recommande généralement un contrôle dans les deux à quatre semaines après initiation ou augmentation, ajusté au risque. La finérénone exige un contrôle à quatre semaines et des décisions selon la kaliémie. Une surveillance plus précoce peut être nécessaire en cas de fragilité ou d’intercurrence. Le contrôle a un responsable, une date et une conduite prévue en cas d’anomalie.</p><p data-evidence="N18-C0611" id="N18-C0611">La recommandation suisse spécifique au diabète précise un contrôle à une semaine en G3 ou plus ou après antécédent d’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button>. Pour M. L., diabétique G3b, ce délai plus précoce est retenu après introduction ou augmentation d’un bloqueur du système rénine–angiotensine. Le repère général KDIGO de deux à quatre semaines ne doit pas retarder ce contrôle ciblé.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic DualDose/FixDose (Juillet 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial2023)</a>.</p></template>
<template data-pop="n18-a07-fenetre-2" data-title="Nutrition : objectifs et limites"><h3>Adapter activité et alimentation</h3><p data-evidence="N18-C0612" id="N18-C0612">La SSN conseille une activité physique d’environ 150 minutes par semaine, adaptée à la capacité et à la fragilité, l’arrêt du tabac et une réduction du sel à moins de 5 g par jour. Pour l’adulte G3–G5, KDIGO propose généralement environ 0,8 g de protéines/kg/jour; un adulte de 70 kg correspond ainsi à environ 56 g/jour. Cette cible n’est pas un régime automatique chez l’enfant en croissance, une personne dénutrie, sarcopénique ou métaboliquement instable. Un accompagnement nutritionnel évite de transformer la protection en restriction dangereuse.</p><p data-evidence="N18-C0613" id="N18-C0613">La fiche suisse privilégie une alimentation riche en produits végétaux, notamment fruits et légumes. Une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> impose toutefois des conseils individualisés sur les aliments et additifs concernés, sans interdire indistinctement tous les végétaux. Le calcul de sodium et de protéines est détaillé dans une <button class="w" data-k="n18-calcul-nutrition">fenêtre de quantités alimentaires</button>.</p><h3>Définir le bénéfice recherché avec le patient</h3><p data-evidence="N18-C0614" id="N18-C0614">Ralentir la perte de filtration, prévenir les événements cardiovasculaires, limiter les hospitalisations et préserver la vie quotidienne sont des objectifs complémentaires. Le choix dépend de la cause, du risque absolu, de la tolérance et des préférences. Une baisse d’albuminurie peut renseigner sur la réponse, mais ne résume pas à elle seule le bénéfice clinique. Les mesures sont hiérarchisées avec le patient pour rendre le programme réalisable.</p><h3>Réagir à une variation sans interrompre mécaniquement</h3><p data-evidence="N18-C0615" id="N18-C0615">Une augmentation de <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> supérieure à 30 % dans les quatre semaines suivant une inhibition du système rénine–angiotensine doit faire rechercher hypovolémie, interaction ou autre cause. Une <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> peut souvent être corrigée avant d’abandonner un traitement utile; hypotension symptomatique ou <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> non contrôlée peuvent imposer sa réduction ou son arrêt. Une baisse initiale réversible de <button class="w" data-k="n18-dfg">DFGe</button> sous inhibiteur SGLT2 est attendue chez certains patients et n’impose pas à elle seule l’arrêt. Le contexte clinique et la FI déterminent la décision.</p><p data-evidence="N18-C0616" id="N18-C0616">Si la pression reste au-dessus de l’objectif individualisé, la SSN propose notamment un anticalcique dihydropyridinique, tel que <button class="w" data-k="n18-norvasc">Norvasc</button>, et/ou un diurétique. Une hypertension réellement résistante conduit à vérifier mesure, observance et causes secondaires. Un antagoniste minéralocorticoïde stéroïdien peut être envisagé selon la SSN si <button class="w" data-k="n18-dfg">DFGe</button> ≥ 45, avec surveillance; il ne s’associe pas à la finérénone. La fenêtre <button class="w" data-k="n18-aldactone">Aldactone</button> distingue ce cadre clinique des doses plus élevées de la FI pour d’autres situations.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial2023)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" target="_blank" rel="noopener">Information professionnelle suisse Norvasc (Avril 2023.)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>.</p></template>
<template data-pop="n18-a08-fenetre-1" data-title="Troubles minéraux : mécanismes et mesures"><h3>Comprendre le trouble minéral et osseux</h3><p data-evidence="N18-C0617" id="N18-C0617">La rétention phosphatée, les modifications de vitamine D active et la réponse parathyroïdienne perturbent progressivement les relations entre rein, intestin, os et vaisseaux. Le bilan s’appuie sur calcium, phosphate, parathormone et contexte vitaminique, lus dans le temps. Un résultat isolé ne suffit pas à imposer un traitement identique à tous. La SSN propose d’optimiser le statut en vitamine D et de réserver une supplémentation calcique à une indication évaluée; les décisions spécialisées tiennent compte du risque d’excès et de calcification.</p><h3>Identifier une acidose avant de traiter un nombre</h3><p data-evidence="N18-C0618" id="N18-C0618">La diminution de l’excrétion nette d’acide peut provoquer une baisse des bicarbonates. Une valeur basse doit être confrontée au gaz du sang, au contexte respiratoire et aux autres causes d’acidose. La SSN 2025 et KDIGO 2024 évoquent une intervention lorsque l’acidose a des implications cliniques, notamment avec bicarbonates &lt; 18 mmol/L chez l’adulte. Le sodium apporté par un alcalinisant peut aggraver pression ou surcharge; la correction est surveillée. La FI de Néphrotrans comporte des restrictions qui empêchent son emploi automatique chez toute personne soumise à une restriction sodée. Le seuil diffère dans le consensus suisse consacré au diabète de type 2 ; la <button class="w" data-k="n18-acidose-seuils">fenêtre sur les seuils de bicarbonate</button> expose cette divergence et sa résolution.</p><h3>Passer du mécanisme à une décision documentée</h3><p data-evidence="N18-C0619" id="N18-C0619">Exemple fictif : une personne G4 présente <button class="w" data-k="n18-symptomes">fatigue</button>, hémoglobine basse et ferritine basse. On établit le bilan de carence et recherche une perte sanguine avant d’attribuer toute l’<button class="w" data-k="n18-fer-criteres">anémie</button> au manque d’érythropoïétine. Si elle a aussi des œdèmes, la voie d’administration, les apports sodés et la surveillance changent. La bonne décision relie un mécanisme plausible, une mesure vérifiée et une indication, puis organise le contrôle de son effet.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>.</p></template>
<template data-pop="n18-a08-fenetre-2" data-title="Anémie rénale : portée et renvois"><h3>Rechercher plusieurs causes d’<button class="w" data-k="n18-fer-criteres">anémie</button></h3><p data-evidence="N18-C0620" id="N18-C0620">Une production insuffisante d’érythropoïétine participe à l’<button class="w" data-k="n18-fer-criteres">anémie</button> rénale, mais carence en fer, inflammation, pertes sanguines, déficit vitaminique ou autre hémopathie restent à rechercher. Le bilan associe hémogramme et indices, réticulocytes, ferritine et saturation de la transferrine, puis examens orientés. KDIGO 2026 actualise la stratégie : chez l’adulte traité par agent stimulant l’érythropoïèse, la cible d’hémoglobine reste inférieure à 115 g/L. Les seuils de fer diffèrent selon dialyse et situation. Le chapitre D64 développe le diagnostic différentiel; ici, l’<button class="w" data-k="n18-fer-criteres">anémie</button> ne se déduit pas du seul <button class="w" data-k="n18-dfg">DFGe</button>.</p><p data-evidence="N18-C0621" id="N18-C0621">La fiche SSN 2025 présente ferritine 300–500 ng/mL, saturation de la transferrine &gt; 30 % et hémoglobine 100–115 g/L comme repères, avec recherche de carences en vitamine B12 et folates. L’actualisation KDIGO 2026 distingue les situations de dialyse : ces repères suisses ne deviennent pas un objectif martial universel à atteindre par perfusions. La <button class="w" data-k="n18-fer-criteres">fenêtre sur le fer et l’anémie</button> expose les seuils et leur rôle exact.</p><h3>Relier eau, sodium et potassium à leur élimination</h3><p data-evidence="N18-C0622" id="N18-C0622">Une excrétion sodée insuffisante favorise une expansion du volume extracellulaire, une hypertension et des œdèmes; le bilan confronte symptômes, poids, pression et examen. L’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button> résulte d’une combinaison de filtration et sécrétion réduites, médicaments, apports et contexte métabolique. Une kaliémie élevée doit être vérifiée pour une éventuelle erreur préanalytique lorsque la situation le permet, mais une forme menaçante exige une prise en charge immédiate. Le seul stade G ne prédit ni l’état de volume ni la valeur du potassium.</p><p data-evidence="N18-C0623" id="N18-C0623">La SSN demande de surveiller le potassium avant et après l’introduction ou l’augmentation d’un bloqueur du système rénine–angiotensine, d’un antagoniste minéralocorticoïde et lors d’un traitement par triméthoprime–sulfaméthoxazole. Si l’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button> persiste, des conseils nutritionnels et un liant digestif du potassium peuvent aider à conserver une protection utile. <button class="w" data-k="n18-veltassa">Veltassa</button> est un exemple suisse pour l’adulte; son action retardée exclut son emploi comme remplacement d’un traitement d’urgence.</p><h3>Passer du mécanisme à une décision documentée</h3><p data-evidence="N18-C0624" id="N18-C0624">Exemple fictif : une personne G4 présente <button class="w" data-k="n18-symptomes">fatigue</button>, hémoglobine basse et ferritine basse. On établit le bilan de carence et recherche une perte sanguine avant d’attribuer toute l’<button class="w" data-k="n18-fer-criteres">anémie</button> au manque d’érythropoïétine. Si elle a aussi des œdèmes, la voie d’administration, les apports sodés et la surveillance changent. La bonne décision relie un mécanisme plausible, une mesure vérifiée et une indication, puis organise le contrôle de son effet.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>.</p></template>
<template data-pop="n18-a09-fenetre-1" data-title="Suppléance : décision clinique et limites"><h3>Anticiper avant une urgence</h3><p data-evidence="N18-C0625" id="N18-C0625">KDIGO propose d’envisager la préparation à une transplantation préemptive ou à un accès de dialyse lorsque le <button class="w" data-k="n18-dfg">DFGe</button> est inférieur à 15–20 ou que le risque d’insuffisance rénale nécessitant une suppléance dépasse 40 % à deux ans avec une équation appropriée. Le seuil de risque sert à organiser information, évaluation et parcours; il ne signifie pas commencer la dialyse. Les délais locaux, les comorbidités et les souhaits du patient nécessitent une coordination anticipée.</p><h3>Comparer les modalités avec leurs contraintes concrètes</h3><p data-evidence="N18-C0626" id="N18-C0626">La transplantation, lorsqu’elle est possible, nécessite une évaluation spécialisée et une préparation; l’hémodialyse exige un accès vasculaire et une organisation des séances; la dialyse péritonéale nécessite un cathéter et des conditions permettant des échanges à domicile. Le choix tient compte des capacités, du soutien disponible, des risques et du quotidien souhaité. Ces descriptions introduisent la discussion; elles ne remplacent pas l’éducation préthérapeutique spécialisée ni l’évaluation de chaque option.</p><h3>Reconnaître les indications urgentes de réévaluation</h3><p data-evidence="N18-C0627" id="N18-C0627">La décision de dialyse repose sur un ensemble de symptômes, signes, anomalies biologiques, préférences et qualité de vie. Une surcharge ou une hypertension non contrôlable, une anomalie acido-basique ou électrolytique résistante, des signes neurologiques urémiques, une péricardite ou une dégradation nutritionnelle progressive peuvent imposer la suppléance. KDIGO indique que le début survient souvent, mais pas toujours, avec une filtration de 5–10. Ce constat ne devient pas un seuil universel à attendre.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a09-fenetre-2" data-title="Parcours conservateur : objectifs"><h3>Présenter les soins conservateurs complets</h3><p data-evidence="N18-C0628" id="N18-C0628">Les <button class="w" data-k="n18-conservateur">soins conservateurs</button> comprennent traitement des symptômes, gestion des complications, soutien psychologique et social, anticipation et soins de fin de vie lorsque nécessaire. Ils constituent une option active pour une personne qui ne choisit pas une suppléance ou dont la situation conduit à privilégier ce parcours. Le bénéfice attendu et la charge des interventions se discutent individuellement; l’absence de dialyse ne signifie pas l’absence de suivi.</p><h3>Construire un choix partagé révisable</h3><p data-evidence="N18-C0629" id="N18-C0629">Le patient reçoit une information compréhensible sur ce que chaque option peut apporter et imposer. On explore ses priorités, sa compréhension, son entourage et les contraintes pratiques, avec infirmiers, diététiciens, néphrologues et autres professionnels utiles. La décision est documentée et peut être réévaluée. Exercice : expliquer à une personne G5 stable pourquoi préparer une option maintenant ne l’oblige pas à commencer immédiatement un traitement de suppléance.</p><h3>Évaluer les besoins dans les formes avancées</h3><p data-evidence="N18-C0630" id="N18-C0630">La catégorie G5 correspond à un <button class="w" data-k="n18-dfg">DFGe</button> &lt; 15 mL/min/1,73 m²; dans le catalogue de la leçon, elle rejoint le stade décrit par N18.5. Les besoins dépendent cependant de <button class="w" data-k="n18-symptomes">fatigue</button>, appétit, <button class="w" data-k="n18-symptomes">prurit</button>, cognition, état nutritionnel, volume, électrolytes et projet de vie. Une personne peu symptomatique et stable n’a pas la même urgence qu’une personne présentant une surcharge réfractaire. La description du stade ouvre une évaluation, elle ne décide pas seule de la suppléance.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-a10-fenetre-1" data-title="Atteinte unilatérale : fonction et morphologie"><h3>Analyser une atteinte unilatérale chronique</h3><p data-evidence="N18-C0631" id="N18-C0631">Le passage consacré à N18.80 porte sur l’atteinte unilatérale chronique prévue dans le catalogue historique. Un rein peut être petit, cicatriciel ou porteur d’une anomalie structurelle, tandis que l’autre assure une part importante de la fonction globale. Il faut distinguer anatomie, fonction séparée et débit total. L’échographie décrit la morphologie; une exploration fonctionnelle séparée n’est demandée que si elle répond à une question susceptible de changer la prise en charge.</p><h3>Comprendre une filtration globale conservée</h3><p data-evidence="N18-C0632" id="N18-C0632">Le <button class="w" data-k="n18-dfg">DFGe</button> à partir d’un marqueur sanguin estime la somme de la filtration des deux reins. Il ne quantifie pas directement la contribution de chacun. Une valeur G1 ou G2 n’annule donc pas une anomalie structurelle chronique pertinente; inversement, le libellé d’atteinte unilatérale ne prouve pas une insuffisance globale. Cette distinction empêche d’appliquer un stade sévère sur la seule apparence d’un rein.</p><h3>Chercher une cause locale et son retentissement</h3><p data-evidence="N18-C0633" id="N18-C0633">L’histoire recherche anomalie congénitale, obstruction, calculs, infections, intervention ou affection vasculaire selon le contexte. L’imagerie compare dimensions, parenchyme et cavités. Pression, <button class="w" data-k="n18-acr">ACR</button>, analyse urinaire et filtration globale recherchent un retentissement. Une exploration supplémentaire est décidée pour une question précise, par exemple une obstruction ou une discordance anatomique, sans demander systématiquement une <button class="w" data-k="n18-biopsie">biopsie</button> du rein lésé.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-a10-fenetre-2" data-title="Stade non précisé : données manquantes"><h3>Ne pas inventer un stade manquant</h3><p data-evidence="N18-C0634" id="N18-C0634">Lorsque la chronicité est connue mais que la fonction actuelle n’est pas documentée, une désignation non précisée comme N18.9 ne doit pas être transformée en G3 ou G5 par supposition. Il faut récupérer les résultats, l’équation, les dates et les marqueurs urinaires. N18.89, autre forme précisée du catalogue, conserve la précision clinique connue sans fabriquer une mesure absente. Le diagnostic et la qualité des données restent deux éléments distincts.</p><h3>Décrire ce qui est connu et ce qui reste indéterminé</h3><p data-evidence="N18-C0635" id="N18-C0635">Le catalogue prévoit des « autres formes » sous N18.8 et distingue notamment N18.80, N18.89 et N18.9. Ces libellés ne remplacent pas le dossier clinique : on décrit la lésion, son ancienneté, la filtration globale et la cause connue ou suspectée. Une forme précisée possède une caractérisation supplémentaire; une forme non précisée traduit une information incomplète. Elle ne signifie pas nécessairement une maladie plus légère.</p><h3>Organiser une surveillance proportionnée</h3><p data-evidence="N18-C0636" id="N18-C0636">Un cas fictif présente un petit rein droit connu depuis plusieurs années, un <button class="w" data-k="n18-dfg">DFGe</button> de 95 et un <button class="w" data-k="n18-acr">ACR</button> de 1 mg/mmol. On décrit l’anomalie structurelle chronique avec fonction globale conservée, puis on recherche sa cause et on suit pression, filtration et albuminurie. La fréquence dépend de stabilité, cause et risque. Une baisse rapide, une <button class="w" data-k="n18-resistance">hypertension résistante</button>, une albuminurie persistante importante ou une cause indéterminée peut justifier un avis selon la SSN.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="n18-a11-fenetre-1" data-title="Maladie intercurrente : conduite documentée"><h3>Anticiper maladie intercurrente et procédure</h3><p data-evidence="N18-C0637" id="N18-C0637">Vomissements, diarrhée, baisse des apports, fièvre ou chirurgie peuvent modifier volume et tolérance. Une consigne d’interruption temporaire doit nommer le produit, la circonstance, le contact et les conditions de reprise; une liste générale sans reprise favorise des arrêts prolongés injustifiés. Pour Forxiga, la FI demande une interruption au moins trois jours avant une chirurgie majeure ou une procédure avec jeûne prolongé, puis une reprise lorsque l’état clinique est stable et l’alimentation reprise. Les autres adaptations sont individualisées.</p><p data-evidence="N18-C0638" id="N18-C0638">Les produits de contraste iodés intraveineux sont réservés à une indication claire selon la SSN. Le risque rénal se confronte au bénéfice diagnostique, au contexte aigu et à la possibilité d’adapter la procédure. La maladie chronique n’est donc ni une autorisation automatique ni une interdiction absolue de l’examen.</p><h3>Donner des signes de réévaluation compréhensibles</h3><p data-evidence="N18-C0639" id="N18-C0639">Le patient sait contacter l’équipe si apparaissent <button class="w" data-k="n18-volume">dyspnée</button>, œdèmes qui augmentent rapidement, baisse importante des urines, malaise, vomissements persistants ou incapacité à s’hydrater. Il reçoit une liste à jour de ses traitements et l’information de signaler sa maladie avant une nouvelle prescription ou une procédure. Les signes sont expliqués avec une conduite concrète, compatible avec la gravité; une urgence respiratoire ou neurologique appelle une prise en charge immédiate.</p><h3>Rendre le programme du cas fil rouge vérifiable</h3><p data-evidence="N18-C0640" id="N18-C0640">Pour M. L., le suivi prévoit recherche causale et avis pour A3 persistant, choix protecteurs après vérification des indications, contrôle de pression, potassium et fonction après les adaptations, puis calendrier longitudinal. Il sait que le diabète rend une cause plausible sans la prouver et que le stade ne prédit pas une date de dialyse. Le rendez-vous suivant sert à relire résultats, tolérance et préférences, pas simplement à renouveler l’ordonnance.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-a11-fenetre-2" data-title="Adaptation médicamenteuse : paramètre pertinent"><h3>Utiliser le paramètre exigé par la FI</h3><p data-evidence="N18-C0641" id="N18-C0641">Une FI peut demander un <button class="w" data-k="n18-dfg">DFGe</button> indexé, une filtration non indexée ou une clairance de <button class="w" data-k="n18-e01-fenetre-1">créatinine</button>. Leurs nombres ne sont pas automatiquement interchangeables, notamment aux extrêmes de corpulence. La désindexation est : <button class="w" data-k="n18-dfg">DFGe</button> indexé × surface corporelle/1,73, donnant des mL/min; elle ne transforme pas une estimation en mesure réelle. La FI de Ramipril Zentiva utilise une clairance et présente Cockcroft–Gault; une ambiguïté d’unités dans son texte doit être résolue avec le pharmacien ou le spécialiste plutôt que masquée.</p><p data-evidence="N18-C0642" id="N18-C0642">La <button class="w" data-k="n18-calcul-cockcroft">formule de Cockcroft–Gault</button> est détaillée avec un exemple et ses limites. Les <button class="w" data-k="n18-conversions">conversions d’unités</button> sont expliquées séparément.</p><h3>Fixer une fréquence à partir du risque et d’une action possible</h3><p data-evidence="N18-C0643" id="N18-C0643">KDIGO recommande au minimum une évaluation annuelle de filtration et albuminurie chez les personnes ayant une maladie rénale chronique, avec des contrôles plus fréquents si le risque est élevé ou si le résultat peut modifier le traitement. Après une nouvelle prescription, le calendrier de tolérance peut être beaucoup plus rapproché. Le suivi évalue aussi symptômes, pression, poids, complications et concordance des médicaments. La fréquence ne se déduit pas seulement de l’habitude du service.</p><h3>Adapter l’interprétation à l’âge et à la grossesse</h3><p data-evidence="N18-C0644" id="N18-C0644">Chez l’enfant, les équations, les valeurs attendues, la croissance et les objectifs nutritionnels diffèrent; l’équation adulte exposée ici n’est pas appliquée automatiquement. Pendant une grossesse, l’interprétation rénale et les médicaments exigent une équipe adaptée; les inhibiteurs de l’enzyme de conversion comme Ramipril Zentiva sont contre-indiqués. Chez une personne âgée fragile, masse musculaire, chutes, hypotension et nutrition peuvent modifier les objectifs. L’âge seul ne supprime ni la maladie ni la nécessité d’un choix partagé.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a12-fenetre-1" data-title="Critères formels : preuve de chronicité"><h3>Retenir les critères formels dans leur ordre</h3><p data-evidence="N18-C0645" id="N18-C0645">Le premier critère est une anomalie de structure ou de fonction rénale ayant une implication sanitaire; le second est sa persistance pendant au moins trois mois ou une preuve suffisante de chronicité. Un <button class="w" data-k="n18-dfg">DFGe</button> &lt; 60 persistant répond au critère fonctionnel. Avec <button class="w" data-k="n18-dfg">DFGe</button> ≥ 60, il faut un autre marqueur pertinent. La cause est ensuite recherchée; elle ne doit pas être inférée du seul seuil de filtration.</p><h3>Exprimer quatre conclusions séparées</h3><p data-evidence="N18-C0646" id="N18-C0646">Pour le cas initial : la maladie chronique est étayée par des anomalies répétées à quatre mois; la cause reste à confirmer; la classe actuelle est G3b A3; le risque doit être apprécié avec clinique, trajectoire et éventuellement une équation validée. Une conclusion complète contient ces quatre niveaux. Un risque calculé ne change pas rétroactivement la preuve de cause et ne remplace pas l’examen.</p><h3>Conclure le cas sans dépasser les preuves</h3><p data-evidence="N18-C0647" id="N18-C0647">M. L. présente une maladie rénale chronique G3b A3 documentée. Une cause diabétique est envisagée et confrontée au sédiment, à l’histoire et à l’imagerie. L’<button class="w" data-k="n18-acr">ACR</button> persistant &gt; 30 mg/mmol motive un avis selon la SSN 2025. Les mesures protectrices et les contrôles sont choisis après vérification des indications et FI; aucune dialyse n’est indiquée par le seul nombre 40. L’exercice final consiste à justifier chacune de ces phrases par sa donnée, sa source et ce qui pourrait la faire réviser.</p><div class="alert" data-evidence="N18-C0648" id="N18-C0648"><strong>Critères formels.</strong> Une anomalie rénale pertinente et une chronicité démontrée sont nécessaires. Une valeur isolée ne suffit pas; une urgence se traite avant d’attendre la confirmation temporelle.</div><div class="key" data-evidence="N18-C0649" id="N18-C0649"><strong>Paramètres clés.</strong> Dates, <button class="w" data-k="n18-dfg">DFGe</button> avec équation et unités, <button class="w" data-k="n18-acr">ACR</button>, cause, pression, potassium, symptômes et trajectoire forment le noyau du suivi.</div><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-a12-fenetre-2" data-title="Pareto de classification et suivi"><h3>Identifier les paramètres qui changent une décision</h3><p data-evidence="N18-C0650" id="N18-C0650">Dates et contexte changent la conclusion de chronicité. <button class="w" data-k="n18-dfg">DFGe</button> et <button class="w" data-k="n18-acr">ACR</button> changent la classification et le suivi. Pression, potassium, état de volume et symptômes modifient la sécurité et les traitements. Sédiment, imagerie et histoire familiale peuvent changer l’hypothèse causale. Une valeur ne s’interprète correctement qu’avec unité, méthode ou équation, intervalle de référence pertinent et comparaison antérieure.</p><h3>Vérifier les unités avant de comparer</h3><p data-evidence="N18-C0651" id="N18-C0651">Le tableau rassemble les repères qui structurent ce chapitre. Les limites sont celles de KDIGO 2024 et de la fiche suisse 2025.</p><table><thead><tr><th>Paramètre</th><th>Repère</th><th>Interprétation</th></tr></thead><tbody><tr><td data-evidence="N18-C0652" id="N18-C0652">Durée</td><td data-evidence="N18-C0653" id="N18-C0653">≥ 3 mois</td><td data-evidence="N18-C0654" id="N18-C0654">Chronicité, à prouver avec les données disponibles.</td></tr><tr><td data-evidence="N18-C0655" id="N18-C0655"><button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0656" id="N18-C0656">&lt; 60 mL/min/1,73 m²</td><td data-evidence="N18-C0657" id="N18-C0657">Critère fonctionnel si persistant.</td></tr><tr><td data-evidence="N18-C0658" id="N18-C0658"><button class="w" data-k="n18-acr">ACR</button></td><td data-evidence="N18-C0659" id="N18-C0659">≥ 3 mg/mmol</td><td data-evidence="N18-C0660" id="N18-C0660">Marqueur de lésion si persistant.</td></tr><tr><td data-evidence="N18-C0661" id="N18-C0661">Variation <button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0662" id="N18-C0662">&gt; 20 %</td><td data-evidence="N18-C0663" id="N18-C0663">Évaluer une variation excédant la variabilité attendue.</td></tr><tr><td data-evidence="N18-C0664" id="N18-C0664">Doublement <button class="w" data-k="n18-acr">ACR</button></td><td data-evidence="N18-C0665" id="N18-C0665">× 2</td><td data-evidence="N18-C0666" id="N18-C0666">Évaluer une variation significative, avec conditions de prélèvement.</td></tr></tbody></table><p data-evidence="N18-C0667" id="N18-C0667">Les seuils d’une FI répondent à une autre question : l’emploi d’un produit. Ils ne redéfinissent pas la maladie.</p><h3>Réunir les points qui préviennent les erreurs</h3><p data-evidence="N18-C0668" id="N18-C0668">La <button class="w" data-k="n18-pareto">synthèse Pareto</button> rassemble les points indispensables de chaque partie. Les plus protecteurs sont : confirmer le temps, croiser G et A, chercher la cause, reconnaître une atteinte aiguë surajoutée, vérifier le produit exact et anticiper le parcours avancé. Les exceptions — enfant, grossesse, fragilité, état aigu et populations exclues des essais — doivent rester visibles au moment d’utiliser une formule ou un traitement.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-e01-fenetre-1" data-title="Estimation : variables, formule et calcul pas à pas"><h3>Ce que mesurent les marqueurs sanguins</h3><p data-evidence="N18-C0669" id="N18-C0669">La <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> provient du métabolisme musculaire; sa concentration dépend de sa production, de sa distribution et de son élimination. La <button class="w" data-k="n18-e01-fenetre-1">cystatine</button> C est un autre marqueur endogène de filtration. Aucune des deux concentrations n’est le débit lui-même : une équation les associe à des variables pour estimer le débit. KDIGO recommande une estimation initiale par <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> puis, si disponible et pertinente, une estimation combinant <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> et <button class="w" data-k="n18-e01-fenetre-1">cystatine</button> pour améliorer la précision.</p><h3>Repérer les déterminants qui ne sont pas la filtration</h3><p data-evidence="N18-C0670" id="N18-C0670">Une faible masse musculaire peut rendre la <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> trompeusement basse; alimentation, exercice et médicaments modifiant la sécrétion tubulaire peuvent aussi intervenir. La <button class="w" data-k="n18-e01-fenetre-1">cystatine</button> n’est pas indépendante de tous les facteurs non rénaux; inflammation, certains traitements et autres états cliniques peuvent modifier son interprétation. Lorsque les deux estimations divergent, on recherche ces déterminants au lieu de choisir arbitrairement le chiffre qui rassure. Une variation rapide de <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> remet en cause l’hypothèse d’équilibre nécessaire aux estimations usuelles.</p><h3>Distinguer estimation, clairance et mesure de référence</h3><p data-evidence="N18-C0671" id="N18-C0671">Quand une décision exige une précision supérieure, une mesure de filtration avec un marqueur exogène, par exemple l’iohexol dans un protocole validé, peut être indiquée. C’est une méthode de référence pour la question de filtration, parfois appelée « gold standard »; elle n’est pas le test de référence de toutes les maladies rénales. Une clairance urinaire de <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> dépend d’un recueil complet et inclut une sécrétion tubulaire, ce qui limite son exactitude comme mesure du seul filtrat glomérulaire.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>.</p></template>
<template data-pop="n18-e01-fenetre-2" data-title="Indexation : surface corporelle et limites"><h3>Nommer l’équation et sa version</h3><p data-evidence="N18-C0672" id="N18-C0672">Le laboratoire doit préciser l’équation utilisée. Pour rendre le calcul reproductible, l’exemple ci-dessous utilise la version <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> CKD-EPI 2021 exposée par le service danois DEKS en mai 2025, sans coefficient ethnique. D’autres équations validées, dont les équations européennes, existent; ce choix pédagogique ne prétend pas imposer une équation unique à tous les laboratoires suisses. Les versions ne se mélangent pas dans une même formule.</p><h3>Refaire le calcul pas à pas</h3><p data-evidence="N18-C0673" id="N18-C0673">Dans la présentation DEKS en unités SI : <button class="w" data-k="n18-dfg">DFGe</button> = 142 × min(C/k,1)<sup>α</sup> × max(C/k,1)<sup>−1,2</sup> × 0,9938<sup>âge</sup> × F. C est la <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> en µmol/L; k vaut 62 pour une femme et 80 pour un homme; α vaut −0,241 ou −0,302 respectivement; F vaut 1,012 pour une femme et 1 pour un homme. L’âge est en années; le résultat est en mL/min/1,73 m². min prend la plus petite valeur et max la plus grande.</p><p data-evidence="N18-C0674" id="N18-C0674">Exemple fictif d’un homme de 60 ans, <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> 150 µmol/L stable : C/k = 150/80 = 1,875; min = 1 et max = 1,875. Ainsi 142 × 1 × 1,875<sup>−1,2</sup> × 0,9938<sup>60</sup> = 45,99, arrondi à 46 mL/min/1,73 m². C’est G3a si la chronicité est établie. Les constantes SI arrondies du document DEKS expliquent de petites différences avec une formule utilisant d’abord une conversion exacte en mg/dL.</p><p data-evidence="N18-C0675" id="N18-C0675"><button class="w" data-k="n18-calcul-egfr">Calcul CKD-EPI 2021 détaillé</button> permet de revoir les grandeurs et les limites de l’exemple.</p><h3>Interpréter l’indexation et les limites</h3><p data-evidence="N18-C0676" id="N18-C0676">Le résultat est rapporté à une surface standard de 1,73 m² pour comparer les personnes. Pour une surface corporelle connue de 2,0 m², un <button class="w" data-k="n18-dfg">DFGe</button> indexé de 46 donne 46 × 2,0/1,73 = 53,2 mL/min après désindexation. La décision posologique dépend cependant du paramètre exigé par la FI; le calcul ne devient pas une clairance de Cockcroft–Gault. L’équation adulte ne s’applique pas automatiquement à l’enfant, à la grossesse ou à une situation aiguë instable. Les limites doivent accompagner le résultat.</p><p class="src">Sources : <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-e02-fenetre-1" data-title="Rapport albumine/créatinine : calcul et interprétation"><h3>Choisir le prélèvement selon la question</h3><p data-evidence="N18-C0677" id="N18-C0677">Pour rechercher une albuminurie, l’<button class="w" data-k="n18-acr">ACR</button> sur un échantillon urinaire est privilégié, idéalement la première urine du matin. Une analyse du sédiment répond à la question de cellules et de cylindres; une culture répond à une suspicion infectieuse. Une <button class="w" data-k="n18-proteinurie">protéinurie</button> totale peut compléter l’albumine si l’on suspecte des protéines non albuminiques. Ces examens ont des objets différents et ne sont pas des synonymes.</p><h3>Réduire les erreurs avant l’analyse</h3><p data-evidence="N18-C0678" id="N18-C0678">On indique au laboratoire les conditions de recueil et le contexte : infection symptomatique, menstruation, exercice récent ou maladie intercurrente. Un résultat augmenté sur un prélèvement aléatoire demande généralement confirmation par un prélèvement matinal. Un recueil de 24 heures peut être utile dans certaines questions, mais son exactitude dépend de la totalité des urines recueillies et de la durée. Une valeur précise en apparence peut provenir d’un recueil incomplet.</p><h3>Calculer le rapport albumine/<button class="w" data-k="n18-e01-fenetre-1">créatinine</button></h3><p data-evidence="N18-C0679" id="N18-C0679"><button class="w" data-k="n18-acr">ACR</button> = albumine urinaire en mg/L ÷ <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> urinaire en mmol/L; les litres se simplifient et le résultat est en mg/mmol. Exemple fictif : albumine 120 mg/L et <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> 8 mmol/L donnent 120/8 = 15 mg/mmol, catégorie A2. Le rapport réduit l’effet de dilution de l’urine, sans supprimer toute variabilité biologique ni l’effet d’une production inhabituelle de <button class="w" data-k="n18-e01-fenetre-1">créatinine</button>.</p><p data-evidence="N18-C0680" id="N18-C0680">Pour convertir une valeur mesurée en mg/mmol vers mg/g, on utilise la masse molaire de la <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> : 1 mmol correspond à environ 0,113 g, donc 15/0,113 ≈ 133 mg/g. On ne remplace pas pour autant les seuils conventionnels A1/A2/A3 par des frontières recalculées différentes de celles du référentiel.</p><p data-evidence="N18-C0681" id="N18-C0681"><button class="w" data-k="n18-calcul-acr">Calcul ACR et conversion</button> permet de revoir les grandeurs et les limites de l’exemple.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="n18-e02-fenetre-2" data-title="Morphologie rénale : normal, maladie chronique et obstacle"><h3>Le rein normal comme référence</h3><p data-evidence="N18-C0925" id="N18-C0925">Un rein adulte normal mesure habituellement 10 à 12 cm de long, le droit souvent un peu plus que le gauche. Son cortex mesure 7 à 10 mm depuis la base d’une pyramide et son parenchyme 15 à 20 mm. Le sinus central est hyperéchogène ; le parenchyme est plus sombre, avec des pyramides un peu moins échogènes que le cortex. Après six mois de vie, le cortex est moins échogène que le foie ou la rate à la même profondeur, ou d’égale échogénicité.</p><h3>Signes de maladie chronique</h3><p data-evidence="N18-C0926" id="N18-C0926">Glomérulosclérose, atrophie tubulaire, fibrose interstitielle et inflammation augmentent toutes l’échogénicité corticale. La taille diminue et le cortex s’amincit surtout lorsque la maladie progresse ; au stade terminal, le rein devient petit et homogène, sans distinction entre parenchyme et sinus. Une pyélonéphrite chronique donne plutôt un petit rein à amincissement cortical focal. Ces signes soutiennent l’ancienneté de l’atteinte, ce que KDIGO 2024 retient parmi les preuves de chronicité, mais ils ne désignent pas la cause.</p><h3>Ce que l’échographie recherche aussi</h3><p data-evidence="N18-C0927" id="N18-C0927">Une hydronéphrose apparaît comme un espace anéchogène, liquidien et interconnecté dans le sinus : elle oriente vers un obstacle, dont la lithiase est la cause la plus fréquente chez l’adulte. Un kyste simple est anéchogène, à paroi fine, avec renforcement postérieur ; des kystes multiples et bilatéraux font discuter une polykystose dans le bon contexte familial. Un calcul de plus de 5 à 7 mm dans le rein est hyperéchogène avec cône d’ombre postérieur.</p><h3>Limites</h3><p data-evidence="N18-C0928" id="N18-C0928">La taille rénale suit la stature : une personne de petite taille peut avoir de petits reins normaux. L’échographie ne mesure pas la filtration, ni globale ni séparée, et elle ne remplace pas une biopsie lorsqu’une question histologique demeure. Elle dépend enfin de l’opérateur et de la visibilité.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
