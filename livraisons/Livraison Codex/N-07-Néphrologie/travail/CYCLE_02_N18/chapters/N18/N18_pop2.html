<template data-pop="n18-ramipril" data-title="Ramipril Zentiva — inhibiteur de l’enzyme de conversion"><p data-evidence="N18-C0308" id="N18-C0308">Ramipril est transformé en ramiprilate, qui inhibe l’enzyme de conversion. La réduction d’angiotensine II modifie pression et hémodynamique glomérulaire. Les comprimés suisses contiennent 1,25, 2,5, 5 ou 10 mg; le sillon du comprimé 1,25 mg est décoratif et ne permet pas de le diviser. L’indication rénale de cette FI concerne une néphropathie glomérulaire avec <button class="w" data-k="n18-proteinurie">protéinurie</button> &gt;3 g/jour; elle ne se confond pas avec toutes les indications de classe décrites par KDIGO.</p><p data-evidence="N18-C0309" id="N18-C0309">Dans l’indication néphropathie, débuter selon la FI à 1,25 mg oral une fois par jour, augmenter selon tolérance en doublant à intervalles de deux à trois semaines, maximum 5 mg/jour. Pour l’hypertension, l’algorithme usuel est différent, avec dose initiale 2,5 mg et maximum 10 mg/jour. En perturbation rénale modérée, la FI décrit une clairance 20–50 mL/min/1,73 m² : début 1,25 et maximum 5 mg/jour. Elle propose ensuite Cockcroft–Gault en mL/min; cette différence d’indexation est conservée comme limite à clarifier pour une prescription proche d’un seuil. Les données de ce passage ne permettent pas d’inventer une dose universelle au-dessous de 20.</p><p data-evidence="N18-C0310" id="N18-C0310">En insuffisance hépatique, introduction sous surveillance stricte et maximum 2,5 mg/jour. Rechercher hypovolémie, pression basse, sténose des artères rénales, antécédent d’angio-œdème et grossesse. Le produit est contre-indiqué pendant la grossesse, avec certaines sténoses rénales et après angio-œdème pertinent. Sacubitril/valsartan nécessite un intervalle minimal de 36 heures dans les deux sens. L’association avec aliskirène est contre-indiquée chez le diabétique ou si clairance &lt; 60; l’association avec un antagoniste des récepteurs de l’angiotensine est contre-indiquée dans la néphropathie diabétique.</p><p data-evidence="N18-C0311" id="N18-C0311">Pression, <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> et potassium sont vérifiés avant puis après introduction ou augmentation; KDIGO propose généralement deux à quatre semaines, plus tôt si risque. Toux, hypotension, <button class="w" data-k="n18-hyperkal">hyperkaliémie</button> et angio-œdème sont des effets à connaître. Une hausse de <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> &gt; 30 % en quatre semaines appelle une recherche de cause. La durée est souvent prolongée si bénéfice et tolérance, avec réévaluation clinique; elle n’est pas fixée par une cure arbitraire.</p><p data-evidence="N18-C0312" id="N18-C0312">Chez une personne diabétique G3 ou plus ou avec antécédent d’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button>, le consensus suisse demande un contrôle à une semaine. Ce contrôle ciblé complète le calendrier général KDIGO de deux à quatre semaines.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial2023)</a>.</p></template>
<template data-pop="n18-forxiga" data-title="Forxiga — dapagliflozine dans la maladie rénale chronique"><p data-evidence="N18-C0313" id="N18-C0313">Forxiga est un inhibiteur du cotransporteur sodium–glucose de type 2; les comprimés existent à 5 et 10 mg. Dans la néphropathie chronique, la dose suisse est 10 mg oral une fois par jour, en complément du traitement approprié, notamment inhibiteur de l’enzyme de conversion ou antagoniste de l’angiotensine à la dose maximale tolérée selon la FI. Il n’y a pas de titration rénale au-delà de 10 mg dans cette indication.</p><p data-evidence="N18-C0314" id="N18-C0314">L’initiation n’est pas recommandée si <button class="w" data-k="n18-dfg">DFGe</button> &lt; 25 mL/min/1,73 m². Un traitement déjà établi peut être poursuivi à 10 mg au-dessous de ce seuil, mais doit être interrompu avant dialyse ou transplantation selon la rubrique posologique suisse. En insuffisance hépatique sévère, la FI propose initialement 5 mg, puis 10 mg si bien toléré. L’usage pédiatrique dans cette indication n’est pas établi. Le diabète de type 1, la polykystose, certaines maladies rénales immunosupprimées, la dialyse et la transplantation ne sont pas des extrapolations admises du parcours présenté. La FI signale l’absence d’expérience chez les patients sans diabète et sans albuminurie.</p><p data-evidence="N18-C0315" id="N18-C0315">Avant la prescription, le médecin évalue le volume, la fonction rénale et les médicaments associés. Le produit peut favoriser déplétion volémique et infections génitales. Une acidocétose peut se manifester par <button class="w" data-k="n18-symptomes">nausées</button>, douleurs abdominales, malaise ou respiration anormale sans hyperglycémie majeure; elle nécessite une évaluation et l’arrêt selon la situation. L’association avec insuline ou sécrétagogue peut nécessiter une adaptation pour éviter l’hypoglycémie, sans suppression inappropriée de l’insuline.</p><p data-evidence="N18-C0316" id="N18-C0316">Le traitement est interrompu si possible au moins trois jours avant une chirurgie majeure ou une procédure avec jeûne prolongé. La reprise attend un état stable et une alimentation reprise, après évaluation des risques. Le traitement est arrêté dès qu’une grossesse est constatée; il n’est pas employé pendant l’allaitement. Les bénéfices de <button class="w" data-k="n18-forxiga">DAPA-CKD</button> et ses exclusions sont détaillés en P01 : le mécanisme, l’essai et la FI répondent à trois questions complémentaires.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-kerendia" data-title="Kerendia — finérénone, algorithme rénal du diabète de type 2"><p data-evidence="N18-C0317" id="N18-C0317">La finérénone bloque le récepteur minéralocorticoïde sans structure stéroïdienne. La FI suisse récente comporte des comprimés à 10, 20 et 40 mg et plusieurs indications. Ici, l’algorithme concerne la néphropathie chronique avec diabète de type 2; sa dose maximale est 20 mg une fois par jour. La dose de 40 mg d’un parcours d’insuffisance cardiaque n’est pas transposée au parcours rénal.</p><p data-evidence="N18-C0318" id="N18-C0318">La dose initiale dépend du <button class="w" data-k="n18-dfg">DFGe</button> et de la kaliémie; le tableau se limite à l’indication rénale du diabète de type 2.</p><table class="t"><thead><tr><th>Paramètre</th><th>Critère</th><th>Action</th></tr></thead><tbody><tr><td data-evidence="N18-C0319" id="N18-C0319"><button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0320" id="N18-C0320">≥60 mL/min/1,73 m²</td><td data-evidence="N18-C0321" id="N18-C0321">La dose initiale est 20 mg une fois par jour.</td></tr><tr><td data-evidence="N18-C0322" id="N18-C0322"><button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0323" id="N18-C0323">25 à &lt;60</td><td data-evidence="N18-C0324" id="N18-C0324">La dose initiale est 10 mg une fois par jour.</td></tr><tr><td data-evidence="N18-C0325" id="N18-C0325"><button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0326" id="N18-C0326">&lt;25</td><td data-evidence="N18-C0327" id="N18-C0327">Le traitement n’est pas initié.</td></tr><tr><td data-evidence="N18-C0328" id="N18-C0328">Potassium avant initiation</td><td data-evidence="N18-C0329" id="N18-C0329">≤4,8 mmol/L</td><td data-evidence="N18-C0330" id="N18-C0330">L’initiation correspond au cadre recommandé.</td></tr><tr><td data-evidence="N18-C0331" id="N18-C0331">Potassium avant initiation</td><td data-evidence="N18-C0332" id="N18-C0332">&gt;4,8 à 5,0</td><td data-evidence="N18-C0333" id="N18-C0333">Une initiation peut être discutée avec contrôles supplémentaires.</td></tr><tr><td data-evidence="N18-C0334" id="N18-C0334">Potassium avant initiation</td><td data-evidence="N18-C0335" id="N18-C0335">&gt;5,0</td><td data-evidence="N18-C0336" id="N18-C0336">Le traitement n’est pas initié.</td></tr></tbody></table><p data-evidence="N18-C0337" id="N18-C0337">Le potassium et le <button class="w" data-k="n18-dfg">DFGe</button> sont recontrôlés après quatre semaines, après reprise et après modification. L’algorithme d’entretien suivant évite de confondre seuil d’initiation et seuil d’interruption.</p><table class="t"><thead><tr><th>Potassium</th><th>Décision dans le parcours rénal</th></tr></thead><tbody><tr><td data-evidence="N18-C0338" id="N18-C0338">≤4,8 mmol/L</td><td data-evidence="N18-C0339" id="N18-C0339">Le passage de 10 à 20 mg se discute si le <button class="w" data-k="n18-dfg">DFGe</button> n’a pas baissé de plus de 30 %.</td></tr><tr><td data-evidence="N18-C0340" id="N18-C0340">&gt;4,8 à 5,5</td><td data-evidence="N18-C0341" id="N18-C0341">La dose est maintenue.</td></tr><tr><td data-evidence="N18-C0342" id="N18-C0342">&gt;5,5</td><td data-evidence="N18-C0343" id="N18-C0343">Le produit est suspendu; une reprise à 10 mg se discute lorsque potassium≤5,0.</td></tr></tbody></table><p data-evidence="N18-C0344" id="N18-C0344">La surveillance ultérieure dépend du risque et des maladies intercurrentes. Aucun de ces seuils n’autorise à ignorer une situation clinique urgente.</p><p data-evidence="N18-C0345" id="N18-C0345">Les inhibiteurs puissants du CYP3A4 et la maladie d’Addison sont des contre-indications. Éviter les autres antagonistes minéralocorticoïdes ou diurétiques épargneurs de potassium; les produits potassiques et le triméthoprime demandent une vigilance accrue. Éviter pamplemousse et inducteurs puissants ou modérés du CYP3A4 selon la FI. L’insuffisance hépatique sévère ne permet pas l’emploi recommandé; en atteinte modérée, renforcer la surveillance du potassium. Une contraception efficace est requise si grossesse possible; grossesse et allaitement nécessitent la décision spécifique décrite par la FI. Le principal risque de suivi est l’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button>.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-lasix" data-title="Lasix comprimés 40 mg — traiter une surcharge"><p data-evidence="N18-C0346" id="N18-C0346">Le furosémide est un diurétique de l’anse. Lasix comprimés 40 mg est indiqué notamment pour des œdèmes d’origine rénale; dans un syndrome néphrotique, le traitement de la cause reste prioritaire. La diurèse produite ne prouve pas une restauration du nombre de néphrons et ne remplace pas un traitement protecteur indiqué.</p><p data-evidence="N18-C0347" id="N18-C0347">La FI propose chez l’adulte un début à un demi, un ou deux comprimés par jour, soit 20–80 mg/jour, puis un entretien usuel de 20–40 mg/jour, par voie orale à jeun. La dose est ajustée au besoin clinique et à la réponse. Le plafond général de 1 500 mg/jour mentionné par la FI concerne des circonstances spécialisées et des présentations/parcours particuliers; ce n’est ni une dose de départ ni une invitation à une escalade ambulatoire sans contrôle. La réduction de filtration peut modifier la réponse; la seule catégorie G ne fournit pas une dose suffisante.</p><p data-evidence="N18-C0348" id="N18-C0348">Rechercher hypovolémie, déshydratation, hypotension, hypokaliémie ou hyponatrémie sévères, anurie et obstacle à l’écoulement. Anurie, coma/précoma hépatique et allaitement font partie des contre-indications. Suivre poids, symptômes, pression, volume, <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> et électrolytes. Les pertes digestives ou une baisse des apports justifient une réévaluation. Les associations avec médicaments néphrotoxiques ou ototoxiques et certains produits modifiant le potassium nécessitent une vérification.</p><p data-evidence="N18-C0349" id="N18-C0349">La FI comporte un conseil général d’apport potassique face au risque d’hypokaliémie; chez une personne atteinte de maladie rénale pouvant être hyperkaliémique, il ne se transforme pas en supplémentation systématique. La kaliémie et les traitements associés déterminent le choix. La durée dépend de la surcharge et de sa cause, avec recherche de la dose minimale efficace.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-crestor" data-title="Crestor — rosuvastatine et risque cardiovasculaire"><p data-evidence="N18-C0350" id="N18-C0350">La rosuvastatine inhibe la synthèse hépatique de cholestérol et intervient dans une stratégie de réduction du risque cardiovasculaire. Les formes suisses et l’indication choisie doivent être vérifiées; le parcours rénal n’autorise pas une dose identique chez tous. La fiche SSN recommande une stratégie hypolipémiante notamment chez les patients non dialysés avec <button class="w" data-k="n18-dfg">DFGe</button> &lt; 60, mais le produit doit être admissible.</p><p data-evidence="N18-C0351" id="N18-C0351">En insuffisance rénale légère à modérée, la dose initiale recommandée de Crestor est 5 mg oral une fois par jour. La dose de 40 mg est contre-indiquée si clairance &lt; 60 mL/min; Crestor lui-même est contre-indiqué si clairance &lt; 30 mL/min. Les augmentations dépendent du risque, du résultat lipidique, des interactions et de la tolérance; la FI complète doit être suivie avant toute escalade. Un autre produit peut être nécessaire lorsque Crestor est contre-indiqué, sans extrapoler sa dose à une autre statine.</p><p data-evidence="N18-C0352" id="N18-C0352">Affection hépatique évolutive, myopathie, ciclosporine, grossesse et allaitement sont des contre-indications importantes. Des interactions peuvent augmenter l’exposition et le risque musculaire; demander douleur, faiblesse ou urines inhabituelles selon le contexte et explorer si nécessaire. La fonction hépatique et la tolérance sont évaluées conformément à la FI. La prévention se poursuit généralement au long cours tant que le bénéfice attendu et la tolérance la justifient; elle ne traite pas directement une baisse aiguë de filtration.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-nephrotrans" data-title="Néphrotrans — bicarbonate de sodium et charge sodée"><p data-evidence="N18-C0353" id="N18-C0353">Néphrotrans contient 500 mg de bicarbonate de sodium par capsule molle gastro-résistante, avec 137 mg de sodium. Il est destiné à l’acidose métabolique et à sa prévention de récidive dans l’insuffisance rénale chronique chez l’adulte. L’usage chez l’enfant et l’adolescent n’est pas établi. La décision repose sur l’équilibre acido-basique vérifié, pas sur le stade G seul.</p><p data-evidence="N18-C0354" id="N18-C0354">La FI décrit une dose moyenne de quatre à neuf capsules par jour, soit 2–4,5 g de bicarbonate, réparties aux repas et avalées sans les croquer. Elle mentionne dix capsules comme dose quotidienne maximale dans son évaluation de sodium. La dose est individualisée et réévaluée; une acidose sévère symptomatique n’est pas un simple problème de capsules ambulatoires. Le repère de bicarbonate &lt; 18 mmol/L de SSN/KDIGO sert à envisager une intervention, sans constituer une dose de ce produit.</p><p data-evidence="N18-C0355" id="N18-C0355">Alcalose, hypokaliémie, hypernatrémie et régime pauvre en sel sont explicitement contre-indiqués, de même que certaines hypersensibilités notamment soja/arachide. Cette restriction rend nécessaire une réévaluation lorsque le patient suit la réduction sodée habituellement proposée en maladie rénale. On ne peut pas effacer la contradiction en ajoutant seulement « surveiller ». Le choix d’une autre stratégie ou formulation relève d’une décision documentée.</p><p data-evidence="N18-C0356" id="N18-C0356">Au début, contrôler pH ou bicarbonate et électrolytes au moins toutes les une à deux semaines, puis régulièrement. Suivre aussi pression et surcharge. Une alcalinisation excessive conduit à réduire la dose. L’augmentation du pH digestif ou urinaire peut modifier d’autres médicaments. Pendant grossesse et allaitement, les données sont limitées et la charge sodée exige une évaluation spécifique. La durée peut être prolongée si indiquée, mais jamais sans surveillance.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-venofer" data-title="Venofer — fer saccharose intraveineux"><p data-evidence="N18-C0357" id="N18-C0357">Venofer est une solution de fer saccharose à 20 mg/mL; une ampoule ou un flacon de 5 mL apporte 100 mg de fer. Il est indiqué pour une carence martiale confirmée lorsque le fer oral est insuffisamment efficace ou impossible. La ferritine et la saturation de la transferrine se lisent avec l’hémoglobine et le contexte; <button class="w" data-k="n18-fer-criteres">anémie</button> rénale ne signifie pas automatiquement carence.</p><p data-evidence="N18-C0358" id="N18-C0358">La FI décrit chez l’adulte 100–200 mg une à trois fois par semaine, selon un déficit total calculé et une administration fractionnée. En perfusion, diluer uniquement dans NaCl stérile 0,9 % : 100 mg dans au maximum 100 mL, pendant au moins 15 minutes; 200 mg dans au maximum 200 mL, pendant au moins 30 minutes. Les doses plus importantes ont d’autres durées et limites : jusqu’à 500 mg chez une personne de plus de 70 kg, ou 7 mg/kg si poids ≤ 70 kg, au maximum une fois par semaine et pendant au moins 3,5 heures. La voie est strictement intraveineuse, jamais intramusculaire ou sous-cutanée.</p><p data-evidence="N18-C0359" id="N18-C0359">Le déficit de Ganzoni est : poids en kg × (hémoglobine cible − mesurée, en g/dL) × 2,4 + réserves de fer en mg. Pour poids ≥ 35 kg, la FI utilise 15 g/dL et 500 mg de réserves. Exemple fictif : 70 kg et Hb 10 g/dL donnent 70 × 5 × 2,4 + 500 = 1 340 mg de déficit total, à fractionner. Le nombre 15 de cette formule n’est pas la cible thérapeutique d’hémoglobine sous darbépoétine, qui suit un autre raisonnement.</p><p data-evidence="N18-C0360" id="N18-C0360">Hypersensibilité grave à un fer parentéral, surcharge martiale, <button class="w" data-k="n18-fer-criteres">anémie</button> non martiale et premier trimestre de grossesse sont des contre-indications. Personnel entraîné et moyens de réanimation doivent être immédiatement disponibles; surveiller pendant l’administration et au moins 30 minutes après. Éviter l’extravasation, qui peut provoquer une coloration prolongée et des lésions. Grossesse après le premier trimestre et allaitement nécessitent une évaluation spécifique. Le traitement est arrêté ou révisé selon réponse, bilan martial et tolérance.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>.</p></template>
<template data-pop="n18-aranesp" data-title="Aranesp — darbépoétine alfa et anémie symptomatique"><p data-evidence="N18-C0361" id="N18-C0361">Aranesp stimule l’érythropoïèse et est indiqué dans l’<button class="w" data-k="n18-fer-criteres">anémie</button> symptomatique liée à l’insuffisance rénale chronique chez l’adulte et l’enfant dès un an, sous conduite expérimentée. Il existe plusieurs seringues préremplies, de 10 à 500 µg, avec concentrations et volumes différents : la dose en µg doit être vérifiée sur la présentation. Corriger ou rechercher carence en fer et autres causes avant et pendant le traitement.</p><p data-evidence="N18-C0362" id="N18-C0362">Chez l’adulte, la phase correctrice peut débuter à 0,45 µg/kg une fois par semaine, par voie intraveineuse chez le dialysé avec accès habituel ou sous-cutanée chez le non-dialysé. Chez le non-dialysé, la FI autorise aussi 0,75 µg/kg sous-cutané toutes les deux semaines ou 1,5 µg/kg une fois par mois. Ce sont des schémas alternatifs, non cumulatifs. La dose minimale efficace est recherchée; si réponse insuffisante, vérifier d’abord les causes.</p><p data-evidence="N18-C0363" id="N18-C0363">La FI décrit une cible de 100–120 g/L et demande d’éviter le maintien au-dessus de 120. KDIGO 2026 recommande chez l’adulte sous agent stimulant une cible inférieure à 115 g/L : le cours retient cette limite de recommandation plus basse et individualise le bénéfice attendu. Une hausse &gt; 20 g/L sur quatre semaines conduit selon la FI à réduire d’environ 25 %; ne pas augmenter plus souvent que toutes les quatre semaines en phase correctrice. Contrôler Hb chaque semaine ou toutes les deux semaines jusqu’à stabilité et après les adaptations.</p><p data-evidence="N18-C0364" id="N18-C0364">L’hypertension mal contrôlée est contre-indiquée. Surveiller pression, potassium, fer, vitesse d’augmentation de l’Hb et événements thromboemboliques; des cibles élevées augmentent les risques cardiovasculaires et de thrombose. Grossesse : seulement si nécessité absolue; allaitement : décision individualisée entre interruption du traitement et de l’allaitement. La durée dépend de l’<button class="w" data-k="n18-fer-criteres">anémie</button> et de la réponse; la baisse de filtration seule ne justifie pas l’introduction.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>.</p></template>
<template data-pop="pareto-n18-a01" data-title="Loi de Pareto — Cas initial et objectifs"><p data-evidence="N18-C0773" id="N18-C0773">Le cas est fictif. Confirmer les dates, classer G et A, chercher la cause et organiser le suivi; le diabète ne prouve pas à lui seul une origine diabétique.</p><p data-evidence="N18-C0774" id="N18-C0774"><strong>Piège à éviter.</strong> Première conclusion et données manquantes: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-a02" data-title="Loi de Pareto — Définition et démonstration de chronicité"><p data-evidence="N18-C0775" id="N18-C0775">Une anomalie rénale pertinente doit être chronique : au moins trois mois ou preuve suffisante d’ancienneté. Une urgence ne peut attendre cette démonstration temporelle.</p><p data-evidence="N18-C0776" id="N18-C0776"><strong>Piège à éviter.</strong> Réévaluer sans retarder une prise en charge nécessaire: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-a03" data-title="Loi de Pareto — Classification et gradation du risque"><p data-evidence="N18-C0777" id="N18-C0777">Cause, G et A sont trois axes. G1–G2 sans autre marqueur ne suffisent pas; G3a/G3b restent des subdivisions cliniques du stade 3. La matrice ne donne pas un pourcentage individuel.</p><p data-evidence="N18-C0778" id="N18-C0778"><strong>Piège à éviter.</strong> Classer puis poser une décision proportionnée: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="pareto-n18-a04" data-title="Loi de Pareto — Épidémiologie, causes et facteurs de progression"><p data-evidence="N18-C0779" id="N18-C0779">Un adulte sur dix est une estimation suisse de prévalence, pas une incidence annuelle. Recrutement, cause, trajectoire et interventions étudiées déterminent la portée des chiffres.</p><p data-evidence="N18-C0780" id="N18-C0780"><strong>Piège à éviter.</strong> Relier le mécanisme au choix du traitement: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="pareto-n18-a05" data-title="Loi de Pareto — Anamnèse et examen clinique"><p data-evidence="N18-C0781" id="N18-C0781">Interroger expositions et produits réellement pris. Mesurer avec méthode, rechercher volume et gravité, puis conserver des données comparables pour le suivi.</p><p data-evidence="N18-C0782" id="N18-C0782"><strong>Piège à éviter.</strong> Conserver un point de comparaison utile: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>.</p></template>
<template data-pop="pareto-n18-a06" data-title="Loi de Pareto — Diagnostic étiologique et orientation"><p data-evidence="N18-C0783" id="N18-C0783">Chaque examen répond à une question. Les critères SSN de recours incluent <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30, <button class="w" data-k="n18-acr">ACR</button> persistant &gt; 30 mg/mmol et cause inconnue; l’urgence dépend du tableau.</p><p data-evidence="N18-C0784" id="N18-C0784"><strong>Piège à éviter.</strong> Réviser une hypothèse quand les faits ne concordent pas: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="pareto-n18-a07" data-title="Loi de Pareto — Interventions pour ralentir la progression"><p data-evidence="N18-C0785" id="N18-C0785">Protection, cause et tolérance se discutent ensemble. L’indication de classe ne remplace pas la FI : pour Forxiga, ne pas initier sous 25 malgré le repère de classe à 20.</p><p data-evidence="N18-C0786" id="N18-C0786"><strong>Piège à éviter.</strong> Réagir à une variation sans interrompre mécaniquement: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic DualDose/FixDose (Juillet 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial2023)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" target="_blank" rel="noopener">Information professionnelle suisse Norvasc (Avril 2023.)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>.</p></template>
<template data-pop="pareto-n18-a08" data-title="Loi de Pareto — Complications métaboliques et cardiovasculaires"><p data-evidence="N18-C0787" id="N18-C0787">Une complication possède un mécanisme et un bilan propres. <button class="w" data-k="n18-fer-criteres">Anémie</button> ne signifie pas automatiquement manque d’érythropoïétine; potassium, acidose et troubles minéraux exigent une lecture contextualisée.</p><p data-evidence="N18-C0788" id="N18-C0788"><strong>Piège à éviter.</strong> Passer du mécanisme à une décision documentée: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561950025" target="_blank" rel="noopener">Information professionnelle suisse Ezetrol (Mars 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680656220019" target="_blank" rel="noopener">Information professionnelle suisse Repatha (Juin 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Information professionnelle suisse Aspirine Cardio 100/300 (Mars 2026)</a>.</p></template>
<template data-pop="pareto-n18-a09" data-title="Loi de Pareto — Formes avancées et choix de parcours"><p data-evidence="N18-C0789" id="N18-C0789">Préparer tôt les options et le choix partagé. G5 ne déclenche pas seul une dialyse; symptômes et complications résistantes peuvent l’imposer. Les soins conservateurs sont actifs.</p><p data-evidence="N18-C0790" id="N18-C0790"><strong>Piège à éviter.</strong> Reconnaître les indications urgentes de réévaluation: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="pareto-n18-a10" data-title="Loi de Pareto — Autres formes et atteinte unilatérale"><p data-evidence="N18-C0791" id="N18-C0791">Anatomie d’un rein, fonction séparée et filtration globale sont distinctes. Une lésion unilatérale peut coexister avec G1; un stade manquant ne doit pas être inventé.</p><p data-evidence="N18-C0792" id="N18-C0792"><strong>Piège à éviter.</strong> Organiser une surveillance proportionnée: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="pareto-n18-a11" data-title="Loi de Pareto — Suivi et situations particulières"><p data-evidence="N18-C0793" id="N18-C0793">Au moins un contrôle annuel de G et A, plus selon risque et traitement. En maladie aiguë, toute suspension doit prévoir sa réévaluation et sa reprise. Respecter le paramètre de la FI.</p><p data-evidence="N18-C0794" id="N18-C0794"><strong>Piège à éviter.</strong> Rendre le programme du cas fil rouge vérifiable: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-a12" data-title="Loi de Pareto — Critères formels et paramètres clés"><p data-evidence="N18-C0795" id="N18-C0795">Terminer par la preuve de maladie et de chronicité, puis les paramètres qui changent la décision. Maladie, cause, stade et risque restent quatre conclusions différentes.</p><p data-evidence="N18-C0796" id="N18-C0796"><strong>Piège à éviter.</strong> Conclure le cas sans dépasser les preuves: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="pareto-n18-e01" data-title="Loi de Pareto — Créatinine, cystatine et estimation de filtration"><p data-evidence="N18-C0797" id="N18-C0797">Nommer marqueur, équation, version et unités. Une estimation stable n’est pas une mesure; masse musculaire, état aigu et indexation limitent son interprétation.</p><p data-evidence="N18-C0798" id="N18-C0798"><strong>Piège à éviter.</strong> Interpréter l’indexation et les limites: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>.</p></template>
<template data-pop="pareto-n18-e02" data-title="Loi de Pareto — Albuminurie, urines et morphologie"><p data-evidence="N18-C0799" id="N18-C0799"><button class="w" data-k="n18-acr">ACR</button> = albumine mg/L divisée par <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> mmol/L. Confirmer le prélèvement; l’imagerie décrit une structure et ne prouve pas à elle seule une cause histologique.</p><p data-evidence="N18-C0800" id="N18-C0800"><strong>Piège à éviter.</strong> Intégrer des examens qui peuvent sembler discordants: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="pareto-n18-e03" data-title="Loi de Pareto — Complications, risque et synthèse du bilan"><p data-evidence="N18-C0801" id="N18-C0801">Un score exige sa population, ses variables et son horizon. <button class="w" data-k="n18-acr">ACR</button> en mg/g pour la <button class="w" data-k="n18-calcul-kfre">KFRE</button> présentée; ne jamais confondre risques à deux et cinq ans.</p><p data-evidence="N18-C0802" id="N18-C0802"><strong>Piège à éviter.</strong> Trois questions pour tester le raisonnement: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>.</p></template>
<template data-pop="pareto-n18-s01" data-title="Loi de Pareto — Anatomie et histologie du rein"><p data-evidence="N18-C0803" id="N18-C0803">Le sang et le filtrat suivent deux parcours distincts. La barrière glomérulaire et les transports expliquent les examens; une image histologique isolée ne décrit pas tout le rein.</p><p data-evidence="N18-C0804" id="N18-C0804"><strong>Piège à éviter.</strong> Garder les limites de l’échantillon: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-s02" data-title="Loi de Pareto — Physiologie de filtration et transports"><p data-evidence="N18-C0805" id="N18-C0805">Concentration, débit et quantité par temps sont différents. Excrété = filtré − réabsorbé + sécrété; une diurèse augmentée ne prouve pas une meilleure filtration.</p><p data-evidence="N18-C0806" id="N18-C0806"><strong>Piège à éviter.</strong> Rattacher la physiologie aux choix cliniques: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>.</p></template>
<template data-pop="pareto-n18-s03" data-title="Loi de Pareto — Biochimie, équilibre acido-basique et minéral"><p data-evidence="N18-C0807" id="N18-C0807">Poumon, tampons et rein coopèrent dans l’équilibre acido-basique. Les boucles minérales se lisent ensemble; corriger un paramètre peut apporter sodium ou calcium à surveiller.</p><p data-evidence="N18-C0808" id="N18-C0808"><strong>Piège à éviter.</strong> Calculer un apport sans le confondre avec un bénéfice: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>.</p></template>
<template data-pop="pareto-n18-s04" data-title="Loi de Pareto — Fonctions endocrines et progression tissulaire"><p data-evidence="N18-C0809" id="N18-C0809">Érythropoïétine, vitamine D active et rénine relient rein et autres organes. <button class="w" data-k="n18-s04-fenetre-2">Fibrose</button> et adaptation expliquent une progression, sans remplacer l’identification de la cause.</p><p data-evidence="N18-C0810" id="N18-C0810"><strong>Piège à éviter.</strong> Faire trois corrélations utiles: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>.</p></template>
<template data-pop="pareto-n18-p01" data-title="Loi de Pareto — Traitements protecteurs et des complications"><p data-evidence="N18-C0811" id="N18-C0811">Pour chaque médicament : produit, indication, population, dose, adaptation et contrôle. Distinguer résultats d’essai, recommandation, autorisation et remboursement.</p><p data-evidence="N18-C0812" id="N18-C0812"><strong>Piège à éviter.</strong> Lire le bénéfice avec les exclusions de l’essai: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic DualDose/FixDose (Juillet 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" target="_blank" rel="noopener">Information professionnelle suisse Norvasc (Avril 2023.)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Information professionnelle suisse Aspirine Cardio 100/300 (Mars 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561950025" target="_blank" rel="noopener">Information professionnelle suisse Ezetrol (Mars 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680656220019" target="_blank" rel="noopener">Information professionnelle suisse Repatha (Juin 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="pareto-n18-p02" data-title="Loi de Pareto — Interactions, néphrotoxicité et surveillance"><p data-evidence="N18-C0813" id="N18-C0813">Repérer interactions et effets préoccupants; prévoir qui lira le contrôle. Une interruption temporaire sans règle de reprise peut supprimer durablement un bénéfice.</p><p data-evidence="N18-C0814" id="N18-C0814"><strong>Piège à éviter.</strong> Terminer par une décision argumentée et révisable: relire les données et les limites avant de transformer une description en décision.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-pareto" data-title="Pareto transversal — les quatre onglets"><h3>Cas initial et objectifs</h3><p data-evidence="N18-C0815" id="N18-C0815">Le cas est fictif. Confirmer les dates, classer G et A, chercher la cause et organiser le suivi; le diabète ne prouve pas à lui seul une origine diabétique.</p><h3>Définition et démonstration de chronicité</h3><p data-evidence="N18-C0816" id="N18-C0816">Une anomalie rénale pertinente doit être chronique : au moins trois mois ou preuve suffisante d’ancienneté. Une urgence ne peut attendre cette démonstration temporelle.</p><h3>Classification et gradation du risque</h3><p data-evidence="N18-C0817" id="N18-C0817">Cause, G et A sont trois axes. G1–G2 sans autre marqueur ne suffisent pas; G3a/G3b restent des subdivisions cliniques du stade 3. La matrice ne donne pas un pourcentage individuel.</p><h3>Épidémiologie, causes et facteurs de progression</h3><p data-evidence="N18-C0818" id="N18-C0818">Un adulte sur dix est une estimation suisse de prévalence, pas une incidence annuelle. Recrutement, cause, trajectoire et interventions étudiées déterminent la portée des chiffres.</p><h3>Anamnèse et examen clinique</h3><p data-evidence="N18-C0819" id="N18-C0819">Interroger expositions et produits réellement pris. Mesurer avec méthode, rechercher volume et gravité, puis conserver des données comparables pour le suivi.</p><h3>Diagnostic étiologique et orientation</h3><p data-evidence="N18-C0820" id="N18-C0820">Chaque examen répond à une question. Les critères SSN de recours incluent <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30, <button class="w" data-k="n18-acr">ACR</button> persistant &gt; 30 mg/mmol et cause inconnue; l’urgence dépend du tableau.</p><h3>Interventions pour ralentir la progression</h3><p data-evidence="N18-C0821" id="N18-C0821">Protection, cause et tolérance se discutent ensemble. L’indication de classe ne remplace pas la FI : pour Forxiga, ne pas initier sous 25 malgré le repère de classe à 20.</p><h3>Complications métaboliques et cardiovasculaires</h3><p data-evidence="N18-C0822" id="N18-C0822">Une complication possède un mécanisme et un bilan propres. <button class="w" data-k="n18-fer-criteres">Anémie</button> ne signifie pas automatiquement manque d’érythropoïétine; potassium, acidose et troubles minéraux exigent une lecture contextualisée.</p><h3>Formes avancées et choix de parcours</h3><p data-evidence="N18-C0823" id="N18-C0823">Préparer tôt les options et le choix partagé. G5 ne déclenche pas seul une dialyse; symptômes et complications résistantes peuvent l’imposer. Les soins conservateurs sont actifs.</p><h3>Autres formes et atteinte unilatérale</h3><p data-evidence="N18-C0824" id="N18-C0824">Anatomie d’un rein, fonction séparée et filtration globale sont distinctes. Une lésion unilatérale peut coexister avec G1; un stade manquant ne doit pas être inventé.</p><h3>Suivi et situations particulières</h3><p data-evidence="N18-C0825" id="N18-C0825">Au moins un contrôle annuel de G et A, plus selon risque et traitement. En maladie aiguë, toute suspension doit prévoir sa réévaluation et sa reprise. Respecter le paramètre de la FI.</p><h3>Critères formels et paramètres clés</h3><p data-evidence="N18-C0826" id="N18-C0826">Terminer par la preuve de maladie et de chronicité, puis les paramètres qui changent la décision. Maladie, cause, stade et risque restent quatre conclusions différentes.</p><h3><button class="w" data-k="n18-e01-fenetre-1">Créatinine</button>, <button class="w" data-k="n18-e01-fenetre-1">cystatine</button> et estimation de filtration</h3><p data-evidence="N18-C0827" id="N18-C0827">Nommer marqueur, équation, version et unités. Une estimation stable n’est pas une mesure; masse musculaire, état aigu et indexation limitent son interprétation.</p><h3>Albuminurie, urines et morphologie</h3><p data-evidence="N18-C0828" id="N18-C0828"><button class="w" data-k="n18-acr">ACR</button> = albumine mg/L divisée par <button class="w" data-k="n18-e01-fenetre-1">créatinine</button> mmol/L. Confirmer le prélèvement; l’imagerie décrit une structure et ne prouve pas à elle seule une cause histologique.</p><h3>Complications, risque et synthèse du bilan</h3><p data-evidence="N18-C0829" id="N18-C0829">Un score exige sa population, ses variables et son horizon. <button class="w" data-k="n18-acr">ACR</button> en mg/g pour la <button class="w" data-k="n18-calcul-kfre">KFRE</button> présentée; ne jamais confondre risques à deux et cinq ans.</p><h3>Anatomie et histologie du rein</h3><p data-evidence="N18-C0830" id="N18-C0830">Le sang et le filtrat suivent deux parcours distincts. La barrière glomérulaire et les transports expliquent les examens; une image histologique isolée ne décrit pas tout le rein.</p><h3>Physiologie de filtration et transports</h3><p data-evidence="N18-C0831" id="N18-C0831">Concentration, débit et quantité par temps sont différents. Excrété = filtré − réabsorbé + sécrété; une diurèse augmentée ne prouve pas une meilleure filtration.</p><h3>Biochimie, équilibre acido-basique et minéral</h3><p data-evidence="N18-C0832" id="N18-C0832">Poumon, tampons et rein coopèrent dans l’équilibre acido-basique. Les boucles minérales se lisent ensemble; corriger un paramètre peut apporter sodium ou calcium à surveiller.</p><h3>Fonctions endocrines et progression tissulaire</h3><p data-evidence="N18-C0833" id="N18-C0833">Érythropoïétine, vitamine D active et rénine relient rein et autres organes. <button class="w" data-k="n18-s04-fenetre-2">Fibrose</button> et adaptation expliquent une progression, sans remplacer l’identification de la cause.</p><h3>Traitements protecteurs et des complications</h3><p data-evidence="N18-C0834" id="N18-C0834">Pour chaque médicament : produit, indication, population, dose, adaptation et contrôle. Distinguer résultats d’essai, recommandation, autorisation et remboursement.</p><h3>Interactions, néphrotoxicité et surveillance</h3><p data-evidence="N18-C0835" id="N18-C0835">Repérer interactions et effets préoccupants; prévoir qui lira le contrôle. Une interruption temporaire sans règle de reprise peut supprimer durablement un bénéfice.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" ta
