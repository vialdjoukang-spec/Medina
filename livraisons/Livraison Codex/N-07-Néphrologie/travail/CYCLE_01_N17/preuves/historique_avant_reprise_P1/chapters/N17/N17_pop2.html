<template data-pop="n17-hyperk" data-title="Hyperkaliémie urgente">
<div class="lab">Reconnaissance</div><p data-evidence="N17-C0092">Selon UKKA 2023, une kaliémie ≥ 6,5 mmol/L est sévère. Un électrocardiogramme urgent est recommandé dès 6,0 mmol/L. Un tracé sans anomalie ne dispense pas du traitement d’une hyperkaliémie sévère.</p>
<div class="lab">Surveillance</div><p data-evidence="N17-C0093">Le monitorage est continu si la kaliémie atteint 6,5 mmol/L, si le tracé montre une toxicité, ou si la kaliémie vaut 6,0–6,4 mmol/L chez un patient mal en point ou exposé à une hausse rapide.</p>
<div class="lab">Stratégie</div><p data-evidence="N17-C0094">Le calcium protège le cœur lorsqu’il existe des anomalies électriques. L’insuline et le glucose déplacent le potassium vers les cellules. L’équipe organise ensuite son élimination et recherche la cause. Le déplacement seul expose au rebond.</p>
<div class="lab">Produits</div><p data-evidence="N17-C0095">Le schéma insulinique relève ici d’une recommandation clinique européenne et d’un usage hors indication diabète. Les concentrations, le volume de glucose et les contre-indications du produit réellement disponible doivent être contrôlés.</p>
</template>
<template data-pop="n17-acidose" data-title="Acidose métabolique">
<div class="lab">Lien rénal</div><p data-evidence="N17-C0096">Une IRA sévère peut s’accompagner d’acidose métabolique. Le gaz du sang et les bicarbonates évaluent sa gravité, avec la respiration, le potassium et l’état circulatoire.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0097">Une acidose réfractaire aux mesures médicales, menaçant le patient, justifie une discussion immédiate pour suppléance. KDIGO ne fixe pas un pH universel qui rendrait toute autre information inutile.</p>
<div class="lab">Bicarbonate</div><p data-evidence="N17-C0098">Le bicarbonate ne traite pas automatiquement toute hyperkaliémie. Il peut se discuter pour une acidose métabolique après examen de la charge sodée, du volume et de ses contre-indications.</p>
</template>
<template data-pop="n17-uremie" data-title="Complications urémiques">
<div class="lab">Reconnaissance</div><p data-evidence="N17-C0099">Une encéphalopathie ou une péricardite peuvent accompagner une insuffisance rénale sévère. Elles imposent une évaluation urgente et la recherche d’autres causes.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0100">Des complications urémiques qui ne répondent pas aux moyens médicaux justifient une orientation immédiate vers la suppléance. L’urée ou la créatinine isolées ne remplacent pas l’appréciation du patient.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0101">Une confusion n’est pas automatiquement une encéphalopathie urémique. Une infection, un médicament accumulé ou un autre trouble métabolique restent possibles.</p>
</template>
<template data-pop="n17-suppleance" data-title="Suppléance rénale">
<div class="lab">Indications</div><p data-evidence="N17-C0102">L’équipe discute immédiatement la suppléance si persistent une hyperkaliémie, une acidose, une surcharge, un œdème pulmonaire ou une complication urémique malgré les mesures médicales appropriées. Une menace vitale impose une réponse urgente.</p>
<div class="lab">Choix</div><p data-evidence="N17-C0103">La technique dépend de la stabilité circulatoire, des besoins d’épuration et des ressources. KDIGO suggère une technique continue plutôt qu’une hémodialyse intermittente classique lorsque l’hémodynamique est instable.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0104">La décision porte sur l’ensemble du patient et les tendances. Un stade 3 ou une valeur unique de créatinine ne suffisent pas à fixer automatiquement l’heure d’une dialyse.</p>
<div class="lab">Suivi</div><p data-evidence="N17-C0105">La suppléance remplace temporairement certaines fonctions ; elle ne constitue pas la preuve d’une récupération rénale. Le médecin suit la diurèse et l’évolution entre les séances.</p>
</template>
<template data-pop="n17-nephro" data-title="Orientation néphrologique">
<div class="lab">Parcours suisse</div><p data-evidence="N17-C0106">Le bundle HUG prévoit un contact si le stade 2 est atteint ou si l’IRA ne s’améliore pas. Le parcours tient aussi compte des complications et de l’incertitude étiologique.</p>
<div class="lab">Urgence</div><p data-evidence="N17-C0107">Une complication menaçante impose un avis immédiat, sans attendre le classement complet. NICE recommande une discussion dans les 24 heures notamment pour un stade 3, une cause inconnue, une réponse insuffisante, un rein transplanté ou une maladie rénale chronique avancée.</p>
<div class="lab">Cause spécialisée</div><p data-evidence="N17-C0108">Une suspicion de glomérulonéphrite, de vascularite, de néphrite interstitielle ou de myélome conduit à un avis rapide. Le diagnostic causal détermine les traitements spécialisés.</p>
</template>
<template data-pop="n17-contraste" data-title="Produit de contraste iodé">
<div class="lab">Évaluation</div><p data-evidence="N17-C0109">NICE 2024 décrit un petit surcroît de risque lorsque le débit estimé stable est inférieur à 30 mL/min/1,73 m². Une IRA après injection nécessite pourtant un bilan causal ; la succession temporelle ne prouve pas la causalité.</p>
<div class="lab">Urgence</div><p data-evidence="N17-C0110">Un examen avec contraste ne doit pas être retardé dans une urgence dont le retard aurait des conséquences importantes. Le risque rénal se confronte au bénéfice attendu.</p>
<div class="lab">Prévention</div><p data-evidence="N17-C0111">L’hydratation orale est encouragée chez les patients à risque. Chez certains patients hospitalisés particulièrement vulnérables, NICE propose de considérer une expansion intraveineuse par NaCl 0,9 % ou bicarbonate isotonique. La surcharge interdit une prescription indifférenciée.</p>
<div class="lab">Portée</div><p data-evidence="N17-C0112">Le repère de débit concerne une fonction relativement stable. Pendant une IRA évolutive, le calcul automatique ne devient pas une mesure exacte de filtration.</p>
</template>
<template data-pop="n17-suivi" data-title="Suivi après l’épisode aigu">
<div class="lab">Hospitalisation</div><p data-evidence="N17-C0113">La créatinine, la diurèse, les électrolytes et l’état volémique se suivent selon la gravité. NICE indique qu’un dosage quotidien de créatinine est habituel à l’hôpital ; une urgence potassique exige des contrôles bien plus rapprochés.</p>
<div class="lab">Après la sortie</div><p data-evidence="N17-C0114">Le médecin remet un plan de médicaments, précise les contrôles et vérifie la récupération. KDIGO propose une évaluation à trois mois pour rechercher une résolution, une maladie rénale chronique nouvelle ou son aggravation.</p>
<div class="lab">Arbitrage</div><p data-evidence="N17-C0115">La position ERBP 2012 propose un contrôle dès deux mois après la sortie. Ce contrôle plus précoce peut compléter l’évaluation KDIGO ; une aggravation clinique exige un suivi avant ces échéances.</p>
<div class="lab">Prévention</div><p data-evidence="N17-C0116">Le patient connaît les risques liés à la déshydratation et aux antalgiques sans ordonnance. Il dispose d’une consigne personnalisée pour demander une aide en cas de maladie intercurrente.</p>
</template>
<template data-pop="n17-nacl" data-title="NaCl 0,9 % Sintetica">
<div class="lab">Produit et mécanisme</div><p data-evidence="N17-C0117">La solution de perfusion 0,9 % est isotonique et contient 154 mmol/L de sodium et autant de chlorure. Elle remplace un déficit extracellulaire ; la présentation 0,45 % est hypotonique et n’est pas interchangeable.</p>
<div class="lab">Place et dose</div><p data-evidence="N17-C0118">L’information professionnelle adapte le volume à l’âge, au poids et à l’état clinique. Elle décrit 1000 mL/jour en routine et une limite usuelle de 2000 mL/jour, avec des schémas différents dans les situations extrêmes. Ces volumes ne sont pas une cible obligatoire dans l’IRA. La dose efficace est celle qui corrige le déficit avec réévaluation.</p>
<div class="lab">Contre-indications et surveillance</div><p data-evidence="N17-C0119">La FI contre-indique la solution 0,9 % dans l’hypervolémie, l’hypernatrémie, l’hyperchlorémie et la déshydratation hypertonique. L’insuffisance rénale, cardiaque ou hépatique impose une prudence renforcée. Le bilan hydrique, les électrolytes et l’équilibre acido-basique sont contrôlés.</p>
<div class="lab">Grossesse et interactions</div><p data-evidence="N17-C0120">La FI demande une prudence pendant la grossesse et ne fournit pas de données cliniques. Les corticoïdes peuvent renforcer la rétention sodée. La compatibilité de tout médicament ajouté doit être vérifiée.</p>
<div class="lab">Source</div><p data-evidence="N17-C0121">La FI suisse de NaCl 0,9 %/0,45 % Sintetica porte les autorisations 52041 pour la perfusion et 56540 pour l’injection. Sa mise à jour affichée est juillet 2014 ; le texte a été consulté le 11 octobre 2026. Un retrait de lots ne constitue pas un retrait global de l’autorisation.</p>
</template>
<template data-pop="n17-lasix" data-title="Furosémide — Lasix injectable">
<div class="lab">Produit et mécanisme</div><p data-evidence="N17-C0122">Lasix injectable contient 20 mg de furosémide par ampoule de 2 mL. Le médicament agit sur le cotransport sodium–potassium–chlorure de la branche ascendante de l’anse, après transport vers la lumière tubulaire. La natriurèse entraîne une déplétion.</p>
<div class="lab">Place et preuves</div><p data-evidence="N17-C0123">KDIGO recommande de ne pas utiliser les diurétiques pour prévenir l’IRA et suggère de ne pas les employer pour la traiter, sauf pour la surcharge. Les essais repris par la recommandation n’établissent pas de bénéfice sur la récupération ou le recours à la suppléance. Une diurèse provoquée n’équivaut donc pas à une guérison.</p>
<div class="lab">Dose adulte</div><p data-evidence="N17-C0124">La FI décrit une dose initiale de 20–40 mg par voie intraveineuse chez l’adulte et à partir de 15 ans. Une réponse insuffisante permet des augmentations de 20 mg à intervalles de deux heures selon cette FI. La réponse clinique détermine la dose utile ; il n’existe pas de dose cible de récupération rénale.</p>
<div class="lab">Vitesse et limites</div><p data-evidence="N17-C0125">L’injection ne dépasse pas 4 mg/minute. En insuffisance rénale sévère avec créatinine &gt; 5 mg/dL, la FI demande au plus 2,5 mg/minute. Son plafond parentéral adulte de 1500 mg/jour est un maximum réglementaire dans des situations sélectionnées, pas une cible usuelle d’IRA.</p>
<div class="lab">Contre-indications et effets</div><p data-evidence="N17-C0126">L’anurie, une hypovolémie, une déshydratation, une hypokaliémie ou hyponatrémie sévères, un précoma ou coma hépatique et l’allaitement sont contre-indiqués. La perte d’eau et d’électrolytes peut aggraver l’IRA. Les administrations rapides exposent à l’ototoxicité.</p>
<div class="lab">Interactions et surveillance</div><p data-evidence="N17-C0127">Les aminoglycosides renforcent les risques ototoxiques ou néphrotoxiques. Le lithium peut s’accumuler. Le médecin suit la pression, le poids, la diurèse, la créatinine, le sodium, le potassium et le magnésium, puis réévalue la réponse avant d’augmenter.</p>
<div class="lab">Grossesse et fonction hépatique</div><p data-evidence="N17-C0128">La FI réserve la grossesse à une nécessité absolue, sur une durée brève et avec surveillance fœtale. Une atteinte hépatique augmente la vulnérabilité aux troubles hydro-électrolytiques ; le précoma ou coma hépatique interdit l’emploi. Il n’existe pas ici de dose hépatique standard à transposer.</p>
<div class="lab">Source</div><p data-evidence="N17-C0129">La FI Lasix injectable, Swissmedic 30630, mise à jour en mars 2025, a été lue le 11 octobre 2026. Le produit et la voie sont précisés ; la prescription ne se déduit pas d’une FI orale.</p>
</template>
<template data-pop="n17-noradrenaline" data-title="Noradrénaline — Noradrenalin Sintetica">
<div class="lab">Produit et mécanisme</div><p data-evidence="N17-C0130">Le concentré contient 1 mg/mL de noradrénaline-base. La stimulation alpha-adrénergique augmente la résistance vasculaire et la pression. Une vasoconstriction excessive peut réduire les perfusions viscérales ; ce médicament n’est pas un traitement vasodilatateur rénal.</p>
<div class="lab">Place</div><p data-evidence="N17-C0131">Un choc vasoplégique malgré un volume circulant approprié peut justifier un vasopresseur associé aux mesures de soutien. La FI interdit de traiter une hypovolémie par noradrénaline seule. En urgence, le remplissage approprié peut accompagner le vasopresseur.</p>
<div class="lab">Dose adulte</div><p data-evidence="N17-C0132">La FI propose une initiation à 8–12 µg/minute, ou une alternative à 0,5–1 µg/minute avec titration croissante. L’entretien moyen est de 2–4 µg/minute ; le texte décrit jusqu’à 30 µg/minute dans le choc réfractaire. Ces repères sont ajustés à la réponse et ne constituent pas un objectif de protection rénale.</p>
<div class="lab">Administration</div><p data-evidence="N17-C0133">Le concentré est dilué dans un véhicule compatible et administré par pompe par des professionnels entraînés. La FI ne fixe pas dans le passage consulté un volume unique de dilution. Le médecin vérifie la concentration en base, la préparation locale, la pression, le rythme et le point d’injection ; il évite un arrêt brutal.</p>
<div class="lab">Interactions et effets</div><p data-evidence="N17-C0134">Les inhibiteurs de la monoamine oxydase et certains antidépresseurs peuvent augmenter l’effet vasopresseur. La FI signale aussi, par extrapolation, un risque avec le linézolide ; cette association demande une surveillance médicale étroite. Les anesthésiques halogénés majorent le risque rythmique. Une extravasation peut provoquer une nécrose locale ; une ischémie ou une arythmie impose une réévaluation immédiate.</p>
<div class="lab">Populations particulières</div><p data-evidence="N17-C0135">La FI ne recommande pas l’usage chez l’enfant. Elle réserve la grossesse à une nécessité clinique, compte tenu du passage placentaire. Les données d’allaitement sont insuffisantes. Elle ne fournit pas de formule d’adaptation rénale ou hépatique ; la titration dépend de la réponse circulatoire.</p>
<div class="lab">Source</div><p data-evidence="N17-C0136">La FI de Noradrenalin Sintetica, Swissmedic 60955, mise à jour en octobre 2020, a été consultée le 11 octobre 2026. Les doses sont exprimées en noradrénaline-base, pas en poids de tartrate.</p>
</template>
<template data-pop="n17-insuline" data-title="Insuline soluble — Actrapid HM">
<div class="lab">Produit exact</div><p data-evidence="N17-C0137">Actrapid HM est une solution limpide d’insuline humaine à 100 unités/mL. La FI autorise sa voie intraveineuse. La même notice décrit Insulatard HM, une suspension retard ; cette suspension ne doit jamais être administrée par voie intraveineuse.</p>
<div class="lab">Mécanisme et place</div><p data-evidence="N17-C0138">L’insuline augmente l’entrée cellulaire du potassium, notamment via la Na⁺/K⁺-ATPase. L’effet redistribue le potassium et n’en assure pas l’élimination. L’indication suisse de la FI est le diabète ; le traitement de l’hyperkaliémie relève d’un usage hors indication.</p>
<div class="lab">Schéma clinique adulte</div><p data-evidence="N17-C0139">UKKA 2023 recommande 10 unités d’insuline soluble associées à 25 g de glucose par perfusion intraveineuse pour une kaliémie ≥ 6,5 mmol/L. Elle suggère le même schéma à 6,0–6,4 mmol/L. Le débit, la concentration et le volume de glucose se valident dans le protocole hospitalier avec le produit exact ; la dose quotidienne du diabète ne remplace pas ce schéma.</p>
<div class="lab">Surveillance</div><p data-evidence="N17-C0140">La glycémie est contrôlée à 0, 30, 60, 90, 120, 180, 240, 300 et 360 minutes. Une administration répétée ou un risque élevé peuvent justifier une surveillance plus longue. Le potassium est réévalué pour documenter la réponse et le rebond.</p>
<div class="lab">Risque rénal et hépatique</div><p data-evidence="N17-C0141">Les besoins d’insuline peuvent diminuer lors d’une insuffisance rénale ou hépatique. L’hypoglycémie est donc un risque majeur. Une dose standard européenne ne dispense pas d’une décision clinique individualisée et d’un dispositif de correction de l’hypoglycémie.</p>
<div class="lab">Compatibilité et interactions</div><p data-evidence="N17-C0142">La FI décrit la compatibilité d’Actrapid HM avec certaines solutions de NaCl et de glucose dans des poches adaptées. Une recette contenant du chlorure de potassium ne doit pas être transposée au traitement d’une hyperkaliémie. Les bêtabloquants peuvent masquer l’hypoglycémie ; l’alcool peut renforcer son risque.</p>
<div class="lab">Grossesse et allaitement</div><p data-evidence="N17-C0143">La FI permet l’insuline pour le diabète pendant la grossesse et l’allaitement, avec adaptation des besoins. Cette autorisation ne devient pas une validation spécifique du schéma d’hyperkaliémie ; l’urgence maternelle se traite avec les spécialistes.</p>
<div class="lab">Source</div><p data-evidence="N17-C0144">La FI des Insulines Humaines Monocomposées Novo Nordisk, mise à jour en avril 2026, distingue Actrapid HM, Swissmedic 44610, d’Insulatard HM, Swissmedic 45495. Elle a été lue le 11 octobre 2026.</p>
</template>
<template data-pop="n17-glucose" data-title="Glucose 10 % Fresenius">
<div class="lab">Produit et concentration</div><p data-evidence="N17-C0145">La FI commune Glucose 5 %, 10 % Fresenius décrit 100 g/L de glucose anhydre pour la concentration 10 %. Ainsi, 25 g correspondent à 250 mL ; ce volume est un calcul, pas une posologie autorisée spécifique de l’hyperkaliémie.</p>
<div class="lab">Rôle clinique</div><p data-evidence="N17-C0146">Le glucose accompagne l’insuline pour réduire le risque d’hypoglycémie. UKKA propose, si la glycémie initiale est &lt; 7 mmol/L, un apport supplémentaire de glucose 10 % à 50 mL/heure pendant cinq heures. Le volume total exige une décision particulière chez un patient oligo-anurique ou congestif.</p>
<div class="lab">Autorisation et dose</div><p data-evidence="N17-C0147">La FI suisse autorise un apport parentéral, une solution vectrice et une réhydratation. Elle décrit pour le 10 % une perfusion continue de 2,5 mL/kg/heure et un maximum quotidien de 1,5–6 g/kg. Ces doses nutritionnelles ne sont pas un protocole d’urgence. Le schéma clinique doit documenter tout écart de posologie et son bénéfice-risque.</p>
<div class="lab">Contre-indications</div><p data-evidence="N17-C0148">L’hyperhydratation, le diabète décompensé, l’hyperglycémie, certains troubles postopératoires du métabolisme du glucose et l’hypokaliémie sans apport parallèle sont contre-indiqués. Une lactacidose exige de la prudence. La FI ne comporte pas la contre-indication absolue d’anurie présente dans d’autres produits glucosés.</p>
<div class="lab">Surveillance et interactions</div><p data-evidence="N17-C0149">Le médecin contrôle la glycémie, le volume administré et les électrolytes. Une perfusion trop rapide peut provoquer une irritation veineuse ou un trouble hyperosmolaire. La solution ne passe pas par le même dispositif que le sang. Les diurétiques peuvent diminuer la tolérance au glucose.</p>
<div class="lab">Grossesse et source</div><p data-evidence="N17-C0150">La FI permet l’usage correct pendant la grossesse et l’allaitement. Elle porte Swissmedic 42423 et la mise à jour octobre 2019 ; la présentation 10 % comporte le code de conditionnement 7680424234323. Le texte exact a été lu le 11 octobre 2026.</p>
</template>
<template data-pop="n17-calcium" data-title="Calcium intraveineux et cardioprotection">
<div class="lab">Principe clinique</div><p data-evidence="N17-C0151">Le calcium antagonise la toxicité électrique du potassium. Il peut améliorer rapidement les anomalies du tracé, mais ne diminue pas la kaliémie. La redistribution et l’élimination du potassium doivent être conduites simultanément.</p>
<div class="lab">Produit et calcium total</div><p data-evidence="N17-C0152">Calciumgluconat B. Braun 10 % Injektionslösung est une spécialité allemande importée en milieu hospitalier suisse, en Mini-Plasco connect de 10 mL. Une ampoule apporte au total 2,25 mmol de calcium. La FI distingue 940 mg de calcium gluconate, apportant 2,10 mmol, et le calcium-D-saccharate tétrahydraté, apportant encore 0,15 mmol. Le libellé hospitalier « 1 g/10 mL » désigne le sel de la préparation ; il ne signifie pas 1 g de calcium élémentaire.</p>
<div class="lab">Indication et contexte suisse</div><p data-evidence="N17-C0153">La FI allemande, datée de juillet 2014 et actuellement servie par Fachinfo-Service, autorise le traitement de l’hypocalcémie aiguë symptomatique. L’hyperkaliémie est donc hors indication de cette FI. Les monographies HUG et PHEL documentent localement la cardioprotection lors de troubles cardiaques liés à l’hyperkaliémie. PHEL décrit le remplacement d’anciens produits suisses par cette spécialité allemande importée ; aucun numéro d’autorisation Swissmedic ne lui est attribué.</p>
<div class="lab">Administration et surveillance</div><p data-evidence="N17-C0154">Pour l’hypocalcémie symptomatique de l’adulte, la FI décrit une dose initiale de 10 mL, soit 2,25 mmol, renouvelable selon le calcium sanguin et l’état clinique. Cette dose ne devient pas une dose d’hyperkaliémie par simple transposition. La FI limite l’injection intraveineuse à 2 mL/minute, soit 0,45 mmol/minute ; HUG reprend cette limite et décrit une injection lente en 5–10 minutes. Le patient est allongé, avec surveillance cardiaque et contrôle du site d’injection. Une vitesse excessive expose notamment à bradycardie, hypotension et arythmies.</p>
<div class="lab">Insuffisance rénale, grossesse et allaitement</div><p data-evidence="N17-C0155">La FI exige une indication soigneusement pesée en cas d’insuffisance rénale, avec suivi du calcium et du phosphate. Le terrain cardiaque, la sarcoïdose et une néphrocalcinose appellent également la prudence. Pendant la grossesse, le traitement exige une nécessité clinique et une surveillance évitant l’hypercalcémie maternelle ; le calcium traverse le placenta. Pendant l’allaitement, la décision de poursuivre le traitement ou l’allaitement pèse les bénéfices pour la mère et l’enfant. La FI ne fournit pas de dose hyperkaliémique adaptée à ces populations.</p>
<div class="lab">Schéma hyperkaliémique : limite non arbitrée</div><p data-evidence="N17-C0501">UKKA 2023 recommande chez l’adulte avec toxicité électrique 30 mL de gluconate à 10 % en dix minutes. Le débit correspondant de 3 mL/minute est une donnée britannique ; UKKA explique expressément son écart avec les 2 mL/minute de l’hypocalcémie. La monographie HUG garde cependant un maximum de 2 mL/minute. Les documents suisses consultés ne fournissent pas un schéma du produit exact qui arbitre cette différence. Cette fenêtre ne propose donc pas de dose-débit hyperkaliémique à appliquer. La situation exige une réponse hospitalière urgente, le protocole validé et l’appui de la pharmacie ; l’incertitude documentaire ne justifie pas une attente sans prise en charge.</p>
<div class="lab">Contre-indications</div><p data-evidence="N17-C0502">La FI contre-indique notamment l’hypercalcémie, l’hypercalciurie, l’hypersensibilité et l’intoxication par glycosides cardiaques. Sous traitement par glycosides, son exception concerne une hypocalcémie immédiatement menaçante sans solution plus sûre ; elle ne constitue pas une autorisation générale dans l’hyperkaliémie. Ces restrictions doivent être confrontées au produit et au contexte de l’urgence.</p>
<div class="lab">Ceftriaxone et âge</div><p data-evidence="N17-C0503">Chez les nouveau-nés de 28 jours ou moins, y compris prématurés, la ceftriaxone est contre-indiquée s’ils reçoivent ou doivent recevoir du calcium intraveineux. À tout âge, les produits ne se mélangent pas et ne s’administrent pas simultanément, même par des lignes séparées. Au-delà de 28 jours, l’administration séquentielle n’est envisagée que selon les conditions de la FI, avec système déconnecté ou soigneusement rincé au NaCl physiologique ; la FI déconseille cette séquence en cas d’hypovolémie.</p>
<div class="lab">Voie, dilution et extravasation</div><p data-evidence="N17-C0504">Pour la cardioprotection hyperkaliémique décrite ici, la voie est intraveineuse. Chez les moins de 18 ans, la FI décrit uniquement une injection lente ou une perfusion intraveineuse après dilution, sans injection intramusculaire. Les doses adultes d’hyperkaliémie ne s’étendent pas à la pédiatrie. L’extravasation peut provoquer une nécrose. La FI prévoit pour la perfusion une dilution avec NaCl 0,9 % ou glucose 5 % ; le mélange n’est jamais déduit de la seule présence d’un soluté dans la ligne. Une dilution pédiatrique et sa vitesse nécessitent leur protocole propre.</p>
<div class="lab">Compatibilités et interactions</div><p data-evidence="N17-C0505">La FI signale notamment des incompatibilités avec bicarbonate, phosphate, citrate, oxalate et ceftriaxone. Les glycosides cardiaques peuvent voir leur toxicité majorée ; les thiazidiques favorisent une hypercalcémie. HUG indique une compatibilité locale avec glucose 10 %, tandis que la dilution décrite dans la FI reste NaCl 0,9 % ou glucose 5 %. La compatibilité d’une association et la prescription d’une dilution sont deux décisions distinctes, confirmées pour les préparations exactes.</p>
<div class="lab">Données physicochimiques et réserve</div><p data-evidence="N17-C0506">HUG indique un pH de 6,9, compris dans la plage de 5,5–7,5 de la FI. En revanche, HUG affiche une osmolarité de 280 mOsm/L, contre une osmolarité théorique de 660 mOsm/L dans la FI. Le document HUG ne précise pas qu’il s’agit d’une mesure réelle ; aucune explication primaire de cet écart n’a été établie. La valeur de 280 ne permet donc pas de conclure ici à l’innocuité d’une administration périphérique. La préparation, la dilution et le site sont vérifiés avec la pharmacie hospitalière ; cette divergence reste une réserve de sécurité.</p>
<div class="lab">Sources et substitutions</div><p data-evidence="N17-C0507">Sources lues le 11 octobre 2026 : Fachinformation allemande de juillet 2014, servie par Fachinfo-Service ; PHEL.FP.217 V09 du 9 décembre 2025 ; PHELinfos 89 de mai 2025, pages 6–7 ; document calcium HUG révisé le 14 août 2026. Le catalogue allemand B. Braun confirme Mini-Plasco connect, 20 × 10 mL. Ces documents hospitaliers ne sont pas des recommandations nationales. Les solutions de chlorure/calcium dédiées à l’hémodiafiltration citratée ne se substituent pas automatiquement au gluconate de cardioprotection.</p>

<template data-pop="n17-bicarbonate" data-title="Bicarbonate de sodium Bichsel 8,4 %">
<div class="lab">Produit</div><p data-evidence="N17-C0156">La solution 8,4 % contient 1 mmol de bicarbonate et 1 mmol de sodium par mL. Elle est hyperosmolaire. L’indication porte notamment sur des acidoses métaboliques.</p>
<div class="lab">Place</div><p data-evidence="N17-C0157">UKKA ne recommande pas le bicarbonate intraveineux en routine dans l’hyperkaliémie aiguë. Une acidose métabolique peut justifier une décision spécifique. La charge sodée et le risque de surcharge importent particulièrement dans l’IRA.</p>
<div class="lab">Dose selon la FI</div><p data-evidence="N17-C0158">La FI calcule les besoins en mmol par le déficit de bases multiplié par 0,3 et par le poids en kilogrammes. Elle propose d’administrer d’abord la moitié calculée, puis de réévaluer. Elle décrit généralement 100–200 mmol durant les premières 24 heures et une vitesse maximale de 1,5 mmol/kg/heure. Aucun de ces repères ne constitue un bolus universel d’hyperkaliémie.</p>
<div class="lab">Contre-indications et effets</div><p data-evidence="N17-C0159">Les alcaloses, l’acidose respiratoire, l’hypocalcémie, l’hypernatrémie, une décompensation cardiaque et certaines pertes chlorées sont contre-indiquées. Une ventilation insuffisante peut aggraver l’accumulation de gaz carbonique. Le médecin suit le gaz du sang, le sodium, le calcium et le bilan hydrique.</p>
<div class="lab">Incompatibilités et populations</div><p data-evidence="N17-C0160">Le bicarbonate est incompatible avec des solutions contenant calcium, magnésium ou phosphate ; le mélange dans une même ligne n’est pas automatique. La grossesse exige une nécessité clinique. La FI ne fournit pas de dose hépatique standard ni de garantie générale pour l’allaitement.</p>
<div class="lab">Source</div><p data-evidence="N17-C0161">La FI suisse Bicarbonate de sodium Bichsel 8,4 %, Swissmedic 36797, mise à jour en novembre 2025, a été lue le 11 octobre 2026.</p>
</template>
