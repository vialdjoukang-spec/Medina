<template data-pop="n17-criteres" data-title="Critères KDIGO 2012">
<div class="lab">Définition</div><p data-evidence="N17-C0001">L’IRA est définie par au moins un critère : une hausse de créatinine ≥ 26,5 µmol/L en 48 heures, une valeur ≥ 1,5 fois la référence sur sept jours, ou une diurèse &lt; 0,5 mL/kg/heure durant six heures. Le critère urinaire permet de reconnaître une atteinte avant une hausse mesurable de créatinine.</p>
<div class="lab">Application</div><p data-evidence="N17-C0002">Le médecin recherche la valeur stable antérieure et sa date. Il compare ensuite les deux créatinines et les volumes urinaires horodatés. Il attribue le stade le plus élevé établi par l’un des deux axes.</p>
<div class="lab">Arbitrage de référence</div><p data-evidence="N17-C0003">La position ERBP 2012 propose une créatinine d’admission comme référence. Elle se distingue de la comparaison avec une mesure stable antérieure ; une valeur déjà altérée à l’arrivée ne devient pas une valeur normale du patient. Le bundle HUG demande une référence et sa date. Ce cours utilise une valeur stable antérieure connue et documente l’incertitude lorsqu’elle manque.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0004">Une créatinine élevée isolée ne distingue pas une maladie aiguë d’une maladie chronique. Les seuils arrondis des documents opérationnels ne remplacent pas les limites de la recommandation primaire.</p>
</template>
<template data-pop="n17-stades" data-title="Stades de gravité">
<div class="lab">Lecture</div><p data-evidence="N17-C0005">Le stade 1 correspond à 1,5–1,9 fois la créatinine de référence, ou à une hausse ≥ 26,5 µmol/L. Le stade 2 correspond à 2,0–2,9 fois la référence. Le stade 3 correspond à au moins trois fois la référence, à une créatinine ≥ 353,6 µmol/L dans une atteinte aiguë répondant d’abord à la définition, ou au début d’une suppléance rénale.</p>
<div class="lab">Diurèse</div><p data-evidence="N17-C0006">Le stade 1 comporte une diurèse &lt; 0,5 mL/kg/heure durant 6–12 heures. Le stade 2 comporte ce débit durant au moins 12 heures. Le stade 3 comporte une diurèse &lt; 0,3 mL/kg/heure durant au moins 24 heures ou une anurie durant au moins 12 heures.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0007">Une baisse de créatinine après dialyse ne signifie pas que le rein a récupéré. Le stade décrit la gravité ; il ne prescrit pas à lui seul une séance de dialyse.</p>
</template>
<template data-pop="n17-creatinine" data-title="Créatinine sérique">
<div class="lab">Origine</div><p data-evidence="N17-C0008">La créatinine provient du métabolisme de la créatine, lié notamment à la masse musculaire. Elle est filtrée par le glomérule et également sécrétée par le tubule. Sa concentration dépend de sa production, de son élimination et du volume de distribution.</p>
<div class="lab">Interprétation</div><p data-evidence="N17-C0009">Une hausse tardive peut sous-estimer une atteinte récente. Une sarcopénie, une maladie hépatique ou un sepsis peuvent réduire sa production. Un remplissage peut diluer sa concentration. Le médecin suit la tendance et la diurèse, plutôt qu’une valeur prétendument normale.</p>
<div class="lab">Fausse hausse</div><p data-evidence="N17-C0010">Le triméthoprime ou la cimétidine peuvent inhiber la sécrétion tubulaire et augmenter la créatinine sans baisse correspondante de filtration. Cette possibilité ne dispense pas de rechercher une véritable IRA.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0011">L’intervalle de référence dépend du laboratoire et de sa méthode. Les critères KDIGO portent sur une variation et sa durée ; ils ne correspondent pas à une norme universelle de créatinine.</p>
</template>
<template data-pop="n17-diurese" data-title="Diurèse et oligurie">
<div class="lab">Mesure</div><p data-evidence="N17-C0012">Le débit urinaire correspond au volume recueilli divisé par le poids et la durée en heures. Pour 70 kg et 140 mL en huit heures, le calcul donne 0,25 mL/kg/heure. Cet exemple arithmétique illustre une oligurie ; il ne provient pas d’une cohorte.</p>
<div class="lab">Technique</div><p data-evidence="N17-C0013">Le recueil exige des heures fiables et la vérification de l’absence d’obstruction du dispositif. Une sonde urinaire n’est pas justifiée uniquement pour classer un patient stable qui peut effectuer un recueil fiable.</p>
<div class="lab">Limites</div><p data-evidence="N17-C0014">Les diurétiques modifient le débit sans prouver une récupération de filtration. Le poids œdémateux et les extrêmes de corpulence peuvent fausser le dénominateur. La position européenne ERBP propose le poids idéal lorsque ces situations rendent le calcul trompeur.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0015">Le médecin compare le débit à sa durée. Une oligurie brève ne suffit pas à elle seule au stade 2. Une IRA peut aussi rester non oligurique.</p>
</template>
<template data-pop="n17-dfg" data-title="Filtration et estimation du débit">
<div class="lab">Distinction</div><p data-evidence="N17-C0016">La filtration glomérulaire est une fonction. Le débit estimé à partir de la créatinine est un calcul qui suppose une production et une concentration relativement stables.</p>
<div class="lab">Limite aiguë</div><p data-evidence="N17-C0017">Pendant une IRA évolutive, ces conditions ne sont pas réunies. Une valeur automatiquement calculée par le laboratoire peut donc surestimer ou sous-estimer la fonction actuelle.</p>
<div class="lab">Médicaments</div><p data-evidence="N17-C0018">Le médecin adapte les prescriptions aux concentrations disponibles, à l’évolution, à la diurèse et à une éventuelle suppléance. Il sollicite la pharmacie clinique pour les médicaments à marge étroite ; il ne transforme pas un débit instable en précision certaine.</p>
</template>
<template data-pop="n17-perfusion" data-title="Hypoperfusion rénale">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0019">Une perte de volume, un débit cardiaque insuffisant ou une vasodilatation peuvent diminuer la perfusion rénale. La baisse de filtration peut initialement survenir sans nécrose visible.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0020">Le médecin précise les vomissements, diarrhées, saignements, apports hydriques, pertes opératoires et traitements. Il examine simultanément la pression, les signes de perfusion et la congestion.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0021">Un déficit volémique justifie un cristalloïde isotonique et une réévaluation. Une congestion importante peut au contraire justifier une déplétion. L’oligurie seule ne choisit pas entre ces deux stratégies.</p>
</template>
<template data-pop="n17-congestion" data-title="Congestion et surcharge">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0022">Une pression veineuse élevée peut contribuer à une baisse de fonction rénale, même lorsque le volume total est excessif. Les œdèmes et la dyspnée imposent donc de rechercher une congestion avant de perfuser.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0023">Le médecin suit le poids, les entrées et sorties, les œdèmes, les signes veineux et l’auscultation pulmonaire. Il confronte ces éléments à la respiration et aux données hémodynamiques.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0024">Le furosémide peut traiter une surcharge chez un patient qui peut répondre au diurétique. Une surcharge ou un œdème pulmonaire réfractaires aux moyens médicaux imposent un avis immédiat pour suppléance. La créatinine seule ne décide pas.</p>
</template>
<template data-pop="n17-tubule" data-title="Atteinte tubulaire aiguë">
<div class="lab">Histologie</div><p data-evidence="N17-C0025">L’atteinte tubulaire aiguë peut comporter une dilatation, un épithélium aplati, une perte de bordure en brosse et des cellules détachées. Une véritable nécrose cellulaire est une lésion plus précise ; elle n’est pas obligatoire dans toute IRA.</p>
<div class="lab">Origines</div><p data-evidence="N17-C0026">Une ischémie, une exposition toxique ou des pigments peuvent léser les tubules. Des maladies glomérulaires, interstitielles ou microvasculaires peuvent également entraîner une atteinte tubulaire secondaire.</p>
<div class="lab">Examens et limites</div><p data-evidence="N17-C0027">Le sédiment peut montrer des cellules tubulaires et des cylindres granulaires. Ces éléments orientent mais ne déterminent pas seuls la cause. Une biopsie est conditionnelle lorsque son résultat modifierait une prise en charge spécialisée.</p>
</template>
<template data-pop="n17-corticale" data-title="Nécrose corticale">
<div class="lab">Définition</div><p data-evidence="N17-C0028">La nécrose corticale désigne une destruction ischémique du cortex, qui peut atteindre de nombreux tubules. Elle se distingue de lésions tubulaires aiguës moins destructrices.</p>
<div class="lab">Contexte</div><p data-evidence="N17-C0029">Une atteinte microvasculaire sévère peut s’accompagner d’ischémie et de lésions tubulaires. Une IRA sévère persistante, particulièrement dans un contexte obstétrical ou microangiopathique, nécessite une évaluation spécialisée.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0030">Le stade biologique ne prouve pas une nécrose corticale. La qualification anatomopathologique exige une argumentation spécifique ; le médecin ne déduit pas une lésion irréversible d’une créatinine élevée.</p>
</template>
<template data-pop="n17-obstruction" data-title="Obstruction urinaire">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0031">Un obstacle élève la pression en amont et réduit la filtration. Une obstruction bilatérale, ou celle d’un rein fonctionnel unique, peut compromettre la fonction rénale globale.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0032">Le médecin recherche une rétention vésicale, un calcul, des troubles mictionnels, une hématurie et un cancer pelvien. Une échographie examine les voies excrétrices et la vessie.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0033">Une dilatation peut manquer au début, en cas de déshydratation ou de fibrose rétropéritonéale. Une échographie non dilatée ne clôt donc pas une forte suspicion.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0034">Une obstruction infectée, bilatérale ou touchant un rein unique impose un avis urologique immédiat. La dérivation est choisie selon le siège : drainage vésical, sonde urétérale ou néphrostomie.</p>
</template>
<template data-pop="n17-papillaire" data-title="Nécrose papillaire et obstacle">
<div class="lab">Présentation</div><p data-evidence="N17-C0035">Une nécrose papillaire aiguë peut former un obstacle intraluminal urétéral. Elle appartient au diagnostic différentiel d’une obstruction ; un calcul n’est pas l’unique cause possible.</p>
<div class="lab">Démarche</div><p data-evidence="N17-C0036">Le médecin étudie le siège de l’obstacle et le retentissement sur le ou les reins fonctionnels. Les signes infectieux et les complications de l’IRA déterminent l’urgence urologique.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0037">Le mécanisme obstructif décrit ici ne démontre pas à lui seul une nécrose médullaire diffuse. Une lésion papillaire, une nécrose corticale et une atteinte tubulaire ne sont pas des diagnostics interchangeables.</p>
</template>
<template data-pop="n17-glomerule" data-title="Atteinte glomérulaire">
<div class="lab">Indices</div><p data-evidence="N17-C0038">Une hématurie et une protéinurie sans infection urinaire évidente font évoquer une néphrite. Des hématies dysmorphiques ou des cylindres érythrocytaires renforcent cette orientation.</p>
<div class="lab">Urgence</div><p data-evidence="N17-C0039">Une progression rapide, un sédiment actif ou une cause immunologique possible imposent une discussion néphrologique précoce. Le spécialiste choisit les sérologies et la biopsie selon l’hypothèse.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0040">Une bandelette positive pour le sang peut aussi signaler une myoglobine ou une hémoglobine. Le sédiment et le contexte évitent de confondre une pigmentation avec une hématurie glomérulaire.</p>
</template>
<template data-pop="n17-interstitielle" data-title="Néphrite interstitielle">
<div class="lab">Origine</div><p data-evidence="N17-C0041">Des médicaments et des infections peuvent provoquer une inflammation interstitielle accompagnée d’IRA. Les inhibiteurs de la pompe à protons et certains antibiotiques font partie des expositions à rechercher.</p>
<div class="lab">Indices</div><p data-evidence="N17-C0042">Une leucocyturie, des cylindres leucocytaires ou une éosinophilie peuvent orienter. Ils ne suffisent pas à confirmer la maladie ni à l’écarter lorsqu’ils manquent.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0043">Le médecin précise le début de chaque exposition, revoit le médicament suspect et contacte le néphrologue. Une biopsie peut être utile lorsque le diagnostic modifierait le traitement ; une corticothérapie n’est pas automatique.</p>
</template>
<template data-pop="n17-microangiopathie" data-title="Microangiopathie thrombotique">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0044">Une lésion endothéliale et des thrombi microvasculaires peuvent provoquer une ischémie rénale. L’atteinte tubulaire peut être secondaire à ces lésions vasculaires.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0045">Une thrombopénie, des schizocytes, une hausse de lactate déshydrogénase et une baisse d’haptoglobine orientent vers une hémolyse microangiopathique. Leur absence isolée n’exclut pas toutes les formes rénales.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0046">L’IRA associée à cette suspicion relève d’une discussion urgente avec néphrologie et hématologie. Le contexte obstétrical, les médicaments et les maladies sous-jacentes orientent le bilan.</p>
</template>
<template data-pop="n17-rhabdo" data-title="Rhabdomyolyse">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0047">Une destruction musculaire libère de la myoglobine. Filtrée, celle-ci peut contribuer à des cylindres, à une toxicité liée à l’hème et à une diminution de perfusion. L’hypovolémie et l’ischémie aggravent le risque.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0048">Le médecin demande les efforts intenses, traumatismes, immobilisations et expositions toxiques. Il dose la créatine kinase selon le contexte. Une bandelette positive pour le sang avec peu d’hématies évoque un pigment.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0049">La triade de douleurs musculaires, faiblesse et urines foncées peut manquer. Un résultat tardif de créatine kinase se confronte à la chronologie ; il ne suffit pas à exclure une atteinte antérieure.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0050">Le bilan cherche aussi les complications potassiques et l’état volémique. Le remplissage se réévalue ; une oligo-anurie ou une congestion empêchent une perfusion indifférenciée.</p>
</template>
<template data-pop="n17-cristaux" data-title="Cristaux et cylindres protéiques">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0051">Des cristaux ou des protéines peuvent s’accumuler dans les tubules et contribuer à leur obstruction ou à une inflammation. La présence de cristaux dans une urine ne démontre pas nécessairement une lésion rénale.</p>
<div class="lab">Contextes</div><p data-evidence="N17-C0052">Les expositions, une lyse tumorale, une maladie lithiasique et une suspicion de myélome orientent la recherche. Dans le myélome, des chaînes légères peuvent former des cylindres et léser les tubules.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0053">Le médecin choisit les examens à partir du contexte, puis demande un avis spécialisé. L’identification de la cause importe davantage qu’une simple désignation de « nécrose tubulaire ».</p>
</template>
<template data-pop="n17-sepsis" data-title="Sepsis et risque rénal">
<div class="lab">Contexte</div><p data-evidence="N17-C0054">Le sepsis expose à l’IRA, par plusieurs mécanismes circulatoires, microvasculaires et inflammatoires. Une pression apparemment corrigée ne prouve pas une récupération rénale.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0055">Le médecin cherche le foyer, suit la perfusion, la diurèse et la créatinine, et revoit les traitements éliminés par le rein.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0056">La prise en charge traite l’infection et soutient l’hémodynamique. Le choix et la posologie de l’anti-infectieux suivent le foyer et son information professionnelle, avec l’aide de la pharmacie lorsque la fonction rénale évolue.</p>
</template>
<template data-pop="n17-atcd" data-title="Antécédents qui modifient le risque">
<div class="lab">Questions</div><p data-evidence="N17-C0057">Le médecin recherche une maladie rénale chronique, une IRA antérieure, un diabète, une insuffisance cardiaque, une maladie hépatique ou une transplantation. Il demande aussi les comptes rendus et les créatinines antérieures.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0058">Ces antécédents augmentent le risque ou modifient l’interprétation. Une créatinine chronique élevée n’empêche pas une IRA surajoutée ; une maladie rénale stable ne doit pas expliquer sans examen toute nouvelle hausse.</p>
<div class="lab">Orientation</div><p data-evidence="N17-C0059">Un rein transplanté, une maladie rénale chronique avancée ou une cause incertaine justifient une discussion spécialisée rapide.</p>
</template>
<template data-pop="n17-medicaments" data-title="Revue des médicaments">
<div class="lab">Recueil</div><p data-evidence="N17-C0060">Le médecin demande les traitements prescrits, les changements récents, les produits sans ordonnance et les préparations de phytothérapie. Il relève les dernières doses, pas seulement les noms.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0061">Il distingue une toxicité directe, un effet hémodynamique et une accumulation secondaire à l’IRA. Il suspend un produit néphrotoxique si le bénéfice-risque le permet, puis adapte les médicaments éliminés par le rein.</p>
<div class="lab">Réévaluation</div><p data-evidence="N17-C0062">Une interruption temporaire a une raison et un plan de reprise. Les bloqueurs du système rénine–angiotensine se discutent particulièrement lors de vomissements, diarrhées ou sepsis ; leur arrêt définitif n’est pas une règle de l’IRA.</p>
</template>
<template data-pop="n17-ains" data-title="Anti-inflammatoires non stéroïdiens">
<div class="lab">Risque</div><p data-evidence="N17-C0063">Les anti-inflammatoires non stéroïdiens font partie des médicaments qui peuvent provoquer ou aggraver une IRA. Une hypovolémie, une maladie rénale ou une association avec d’autres traitements augmentent la vulnérabilité.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0064">Le médecin demande explicitement les antalgiques sans ordonnance. Le patient peut ne pas considérer un produit acheté librement comme un traitement.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0065">L’exposition est revue pendant l’IRA. Une alternative dépend de l’indication et du patient ; ce chapitre ne propose pas une substitution médicamenteuse universelle.</p>
</template>
<template data-pop="n17-symptomes" data-title="Symptômes et formes silencieuses">
<div class="lab">Caractérisation</div><p data-evidence="N17-C0066">Le médecin précise la baisse des urines, les pertes digestives, les apports, la dyspnée, les douleurs lombaires, la fièvre et les troubles mictionnels. Il situe chaque symptôme dans le temps.</p>
<div class="lab">Interprétation</div><p data-evidence="N17-C0067">La maladie causale peut dominer le tableau. L’IRA peut rester non oligurique, ou être révélée uniquement par la créatinine. Une diurèse conservée n’exclut donc pas la maladie.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0068">Une douleur avec fièvre et obstacle possible évoque une infection obstructive. Une dyspnée avec congestion ou une confusion dans une IRA sévère impose une recherche urgente de complication.</p>
</template>
<template data-pop="n17-vitals" data-title="Signes vitaux et perfusion">
<div class="lab">Examen</div><p data-evidence="N17-C0069">Le médecin évalue l’état de conscience, la pression, le pouls, la respiration et l’oxygénation. Il recherche ensuite des indices de perte de volume ou de congestion et suit leur évolution.</p>
<div class="lab">Valeur</div><p data-evidence="N17-C0070">Une hypotension ou des signes d’hypoperfusion orientent vers un mécanisme circulatoire. Une hypertension avec œdèmes et sédiment actif peut orienter vers une maladie glomérulaire.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0071">Une seule pression artérielle ne décrit pas la perfusion rénale ni le volume circulant. Le choix entre remplissage, déplétion et vasopresseur exige une confrontation clinique.</p>
</template>
<template data-pop="n17-poids" data-title="Poids et bilan hydrique">
<div class="lab">Mesure</div><p data-evidence="N17-C0072">Le poids récent, les apports, les pertes et les volumes urinaires permettent d’évaluer l’évolution. Les HUG demandent une appréciation de la volémie et du poids dans leur bundle IRA.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0073">Un bilan incomplet oublie facilement des apports médicamenteux ou des pertes. Le poids peut être excessif à cause d’œdèmes et fausser le calcul du débit urinaire par kilogramme.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0074">Une prise de poids avec congestion peut conduire à limiter les apports et à dépléter. Une perte hydrique documentée peut justifier un remplissage, suivi d’une réévaluation clinique.</p>
</template>
<template data-pop="n17-sediment" data-title="Sédiment urinaire">
<div class="lab">Technique</div><p data-evidence="N17-C0075">La microscopie urinaire complète la bandelette. L’expérience de l’opérateur et le contexte de prélèvement influencent l’interprétation.</p>
<div class="lab">Lecture</div><p data-evidence="N17-C0076">Les cellules tubulaires et cylindres granulaires orientent vers une atteinte tubulaire. Les hématies dysmorphiques et cylindres érythrocytaires orientent vers le glomérule. Les cylindres leucocytaires peuvent accompagner une atteinte interstitielle ou une pyélonéphrite.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0077">Les cylindres hyalins peuvent apparaître sans maladie organique spécifique. Une bactériurie peut correspondre à une infection ou à une colonisation ; elle s’interprète avec les symptômes.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0078">Un sédiment actif ou une aggravation rapide justifient l’avis néphrologique. Le sédiment oriente la cause ; il ne remplace pas les critères de gravité de l’IRA.</p>
</template>
<template data-pop="n17-bandelette" data-title="Bandelette urinaire">
<div class="lab">Question</div><p data-evidence="N17-C0079">La bandelette recherche le sang, les protéines, les leucocytes, les nitrites et le glucose. Elle appartient au bilan initial recommandé.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0080">Le résultat « sang » peut refléter des hématies ou un pigment. Une protéinurie qualitative doit être complétée lorsque le contexte nécessite une quantification.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0081">Une hématurie et une protéinurie sans explication infectieuse conduisent à envisager une néphrite. Le sédiment et les rapports protéine/créatinine et albumine/créatinine affinent l’orientation dans la démarche suisse des HUG.</p>
</template>
<template data-pop="n17-ultrason" data-title="Échographie rénale et vésicale">
<div class="lab">Référence</div><p data-evidence="N17-C0082">L’échographie est l’examen initial de référence pour rechercher un obstacle des voies urinaires. Elle ne constitue pas un examen universel de confirmation de toutes les causes d’IRA.</p>
<div class="lab">Délais</div><p data-evidence="N17-C0083">NICE recommande un examen dans les six heures si une pyonéphrose est suspectée, et dans les 24 heures si la cause est inconnue ou si le patient risque une obstruction. Le bundle HUG inclut un ultrason dans son parcours hospitalier.</p>
<div class="lab">Limites</div><p data-evidence="N17-C0084">Une obstruction précoce, une déshydratation ou une fibrose rétropéritonéale peuvent limiter la dilatation. Le clinicien poursuit l’exploration si la suspicion reste forte.</p>
<div class="lab">Arbitrage</div><p data-evidence="N17-C0085">NICE ne demande pas d’échographie systématique lorsque la cause est déjà identifiée. La pratique HUG est une mesure institutionnelle plus large ; les deux périmètres sont indiqués et ne deviennent pas une contradiction masquée.</p>
</template>
<template data-pop="n17-biopsie" data-title="Biopsie rénale">
<div class="lab">Statut</div><p data-evidence="N17-C0086">La biopsie est l’examen de référence pour caractériser certaines lésions parenchymateuses. Elle est conditionnelle ; elle n’est pas le « gold standard » obligatoire de toute IRA.</p>
<div class="lab">Indications</div><p data-evidence="N17-C0087">Un sédiment actif, une maladie inflammatoire possible, une cause incertaine ou une évolution défavorable peuvent conduire le néphrologue à la proposer. Son résultat doit pouvoir modifier la conduite.</p>
<div class="lab">Interprétation</div><p data-evidence="N17-C0088">La biopsie distingue notamment les lésions glomérulaires, interstitielles, vasculaires et tubulaires. Une lésion tubulaire aiguë ne démontre pas à elle seule la cause, ni l’absence d’une atteinte associée.</p>
</template>
<template data-pop="n17-fen" data-title="Indices urinaires et fraction excrétée du sodium">
<div class="lab">Principe</div><p data-evidence="N17-C0089">La natriurèse et la fraction excrétée du sodium décrivent une réponse tubulaire dans un contexte précis. Elles ne constituent pas des critères KDIGO.</p>
<div class="lab">Limites</div><p data-evidence="N17-C0090">Les diurétiques, le sepsis, la congestion, la maladie rénale chronique et les apports modifient les résultats. Les anciennes études portaient sur de petits groupes sélectionnés, souvent oliguriques.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0091">Un résultat compatible avec une conservation du sodium ne prouve pas l’absence de lésion tubulaire. Le médecin privilégie la chronologie, l’hémodynamique, le sédiment et la recherche d’obstruction.</p>
</template>
