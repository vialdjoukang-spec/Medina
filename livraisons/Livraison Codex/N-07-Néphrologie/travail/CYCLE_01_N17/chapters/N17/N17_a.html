<p data-evidence="N17-C0162">Dans cette <b>vignette fictive</b>, un homme de 70 kg arrive après des pertes digestives. Sa créatinine passe de 80 à 210 µmol/L en 48 heures. Sa diurèse est de 0,35 mL/kg/heure depuis 14 heures ; sa kaliémie atteint 6,8 mmol/L. Ces valeurs pédagogiques permettent de discuter la gravité, la cause et la complication urgente.</p>
<p data-evidence="N17-C0163">La kaliémie impose une évaluation urgente avant la fin du bilan causal. La créatinine et la diurèse établissent chacune un stade 2. Les pertes rendent une hypovolémie plausible, mais ne prouvent pas qu’un remplissage est encore approprié. Le médecin examine aussi la congestion et la possibilité d’obstruction.</p>
<div class="key" data-evidence="N17-C0164"><b>À retenir.</b> L’urgence métabolique, la gravité rénale et la cause se recherchent ensemble. Les critères définissent le syndrome ; ils ne suffisent pas à choisir le traitement.</div>
</section>

<section class="ilot" id="n17-1"><h2><span class="n">1</span>Définition et stades</h2>
<p data-evidence="N17-C0165">L’insuffisance rénale aiguë, ou IRA, est une baisse récente de fonction rénale. Elle recouvre des causes circulatoires, parenchymateuses et obstructives. Les <button class="w" data-k="n17-criteres">critères KDIGO (seuils officiels et durée)</button> permettent son identification, même si le patient ne se plaint pas de symptômes rénaux.</p>
<p data-evidence="N17-C0166">Un seul des critères suivants suffit : la créatinine augmente d’au moins <b>26,5 µmol/L en 48 heures</b>, elle atteint <b>1,5 fois la référence dans les sept jours</b>, ou la diurèse devient <b>inférieure à 0,5 mL/kg/heure pendant six heures</b>. Ces seuils sont ceux de la recommandation KDIGO 2012 effectivement lue.</p>
<p data-evidence="N17-C0521">Les <button class="w" data-k="n17-normalite">intervalles suisses du laboratoire (population, prélèvement et unités)</button> situent une concentration. Les critères d’IRA comparent surtout cette concentration à la référence personnelle et à sa date : un résultat dans l’intervalle du laboratoire peut déjà avoir augmenté significativement.</p>

<p data-evidence="N17-C0167">Les <button class="w" data-k="n17-stades">trois stades (créatinine et diurèse)</button> décrivent une gravité croissante. Le médecin retient le plus sévère établi par la créatinine ou les urines. Il utilise une valeur stable antérieure connue, sa date et une chronologie fiable.</p>
<table class="t"><thead><tr><th>Stade</th><th>Critère de créatinine</th><th>Critère de diurèse</th></tr></thead><tbody><tr><td data-evidence="N17-C0168">1</td><td data-evidence="N17-C0169">1,5–1,9 fois la référence, ou hausse ≥ 26,5 µmol/L</td><td data-evidence="N17-C0170">&lt; 0,5 mL/kg/heure durant 6–12 heures</td></tr><tr><td data-evidence="N17-C0171">2</td><td data-evidence="N17-C0172">2,0–2,9 fois la référence</td><td data-evidence="N17-C0173">&lt; 0,5 mL/kg/heure pendant ≥ 12 heures</td></tr><tr><td data-evidence="N17-C0174">3</td><td data-evidence="N17-C0175">≥ 3 fois la référence, ou ≥ 353,6 µmol/L dans une IRA établie, ou début de suppléance</td><td data-evidence="N17-C0176">&lt; 0,3 mL/kg/heure pendant ≥ 24 heures, ou anurie pendant ≥ 12 heures</td></tr></tbody></table>
<p data-evidence="N17-C0177"><button class="w" data-k="n17-calcul-creatinine">210 ÷ 80 = 2,625 (calcul du rapport et de la hausse)</button> établit un stade 2 par la créatinine. Si la même personne devient anurique pendant douze heures, le stade devient 3. Le seuil absolu de 353,6 µmol/L suppose d’abord une IRA établie ; il ne transforme pas une maladie chronique stable en IRA.</p>
<div class="trap" data-evidence="N17-C0178"><span class="k">Version et arbitrage</span> Le bundle HUG 2022 emploie quelques limites arrondies dans son schéma pratique. Pour classer précisément un patient, le tableau ci-dessus conserve les bornes de la recommandation primaire KDIGO. La page officielle KDIGO indique que le projet 2026, après consultation publique, est en préparation pour publication. Ce cours conserve la recommandation finale 2012 ; il ne présente pas les nouveautés du projet comme adoptées.</div>
<div class="key" data-evidence="N17-C0179"><b>À retenir.</b> La variation et sa durée définissent l’IRA. Le stade le plus élevé guide la vigilance, tandis que la menace vitale et l’étiologie décident des gestes.</div>
<button class="pareto-btn ui" data-k="pareto-n17-definition">▲ Loi de Pareto — Définition et stades</button>
</section>

<section class="ilot" id="n17-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p data-evidence="N17-C0183">L’IRA est fréquente à l’hôpital et s’associe à une mortalité accrue. La revue suisse de 2017 rapporte jusqu’à <b>7 % des patients hospitalisés</b>, d’après les études qu’elle cite. Ce chiffre ancien décrit une population hospitalière ; il n’est pas une incidence nationale suisse actuelle.</p>
<p data-evidence="N17-C0184">La sévérité, la durée, la maladie causale et les comorbidités influencent l’évolution. Même une atteinte peu sévère et réversible s’associe à un risque ultérieur de maladie rénale chronique. Une association pronostique ne signifie pas que chaque patient évoluera vers la dialyse.</p>
<div class="trap" data-evidence="N17-C0185"><span class="k">Population des chiffres</span> La recherche dans les liens publics de la Société suisse de néphrologie, le bundle HUG et les revues suisses retenues n’a pas fourni de taux national contemporain consolidé. Cette lacune de la recherche est explicitée ; aucun pourcentage suisse n’est déduit d’un taux étranger.</div>
<div class="key" data-evidence="N17-C0186"><b>À retenir.</b> Une récupération apparente ne supprime pas le besoin de suivi. L’évaluation à distance recherche une maladie chronique nouvelle ou aggravée.</div>
</section>

<section class="ilot" id="n17-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-evidence="N17-C0187">Le rein normal filtre le plasma puis ajuste la composition du filtrat dans les tubules. La perfusion, l’intégrité du parenchyme et la libre évacuation des urines sont nécessaires. Une perturbation de l’un de ces éléments peut réduire la filtration ; plusieurs mécanismes peuvent coexister.</p>
<h3>3.1 Perfusion insuffisante ou congestion</h3>
<p data-evidence="N17-C0188">Une <button class="w" data-k="n17-perfusion">hypoperfusion (volume circulant et débit)</button> peut réduire la filtration sans nécrose obligatoire. À l’inverse, une <button class="w" data-k="n17-congestion">congestion veineuse (surcharge et choix de déplétion)</button> peut altérer la fonction malgré un volume total excessif. Ces deux situations expliquent pourquoi l’oligurie ne justifie pas toujours une perfusion.</p>
<div class="key" data-evidence="N17-C0189"><b>À retenir.</b> Le volume circulant et la congestion sont évalués avant toute modification d’apports. Une hypothèse circulatoire reste compatible avec une atteinte parenchymateuse associée.</div>
<h3>3.2 Lésions du parenchyme</h3>
<p data-evidence="N17-C0190">Une <button class="w" data-k="n17-tubule">atteinte tubulaire aiguë (lésions et distinction avec nécrose)</button> peut résulter d’ischémie, de toxiques, de pigments ou d’une autre maladie rénale. La perte de cellules et la désorganisation tubulaire perturbent le fonctionnement. Les lésions histologiques ne correspondent pas toujours à la gravité biologique.</p>
<div class="key" data-evidence="N17-C0191"><b>À retenir.</b> Le terme clinique IRA ne prouve pas une nécrose tubulaire. Un sédiment actif impose une recherche glomérulaire ou interstitielle au-delà du tubule.</div>
<h3>3.3 Pression en amont d’un obstacle</h3>
<p data-evidence="N17-C0192">Une <button class="w" data-k="n17-obstruction">obstruction urinaire (mécanisme et drainage)</button> augmente la pression en amont. Cette pression s’oppose à la filtration et peut provoquer une IRA sur deux reins obstrués ou sur un rein fonctionnel unique. Une dérivation traite alors un mécanisme que le remplissage ne corrige pas.</p>
<p data-evidence="N17-C0193">Les trois mécanismes convergent vers une baisse de fonction, puis vers la rétention d’eau ou de solutés. Le schéma distingue les décisions causales sans attribuer un médicament identique à toutes les IRA.</p>
<figure data-evidence="N17-C0194"><svg viewBox="0 0 380 282" role="img" aria-label="Figure 1 — Trois conditions de la fonction rénale" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="356" height="44" rx="5"/><path d="M190 56v14m-4-5l4 5 4-5"/><rect x="12" y="70" width="356" height="44" rx="5"/><path d="M190 114v14m-4-5l4 5 4-5"/><rect x="12" y="128" width="356" height="44" rx="5"/><path d="M190 172v14m-4-5l4 5 4-5"/><rect x="12" y="186" width="356" height="44" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="39">Perfusion • parenchyme • évacuation</text><text x="190" y="97">Hypoperfusion • lésion • obstacle</text><text x="190" y="155">Baisse de fonction ± baisse des urines</text><text x="190" y="213">Complications : potassium, acidose, volume</text></g></svg><figcaption>Figure 1 — Trois conditions de la fonction rénale. Ce schéma qualitatif n’est pas une échelle de gravité.</figcaption></figure>
<p data-evidence="N17-C0195">La lecture débute par le mécanisme, puis par ses conséquences. Un patient obstrué et infecté relève d’un drainage urgent ; un patient congestif peut relever d’une déplétion. Leurs créatinines peuvent pourtant être comparables.</p>
<div class="key" data-evidence="N17-C0196"><b>À retenir.</b> Le traitement causal dépend du mécanisme. Les complications déterminent l’urgence commune, quelle que soit l’origine de l’IRA.</div>
<button class="pareto-btn ui" data-k="pareto-n17-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="n17-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p data-evidence="N17-C0200">Le médecin recherche les causes réversibles et celles dont le retard menace le rein ou le patient. Une classification prérénale, intrarénale et postrénale organise cette recherche. Elle n’impose pas des catégories exclusives chez un malade qui cumule plusieurs agressions.</p>
<table class="t"><thead><tr><th>Mécanisme dominant</th><th>Indices recherchés</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td data-evidence="N17-C0201">Circulatoire</td><td data-evidence="N17-C0202">Pertes digestives, saignement, faible débit cardiaque, sepsis ou congestion</td><td data-evidence="N17-C0203">Le médecin corrige l’état circulatoire selon le volume et la perfusion.</td></tr><tr><td data-evidence="N17-C0204">Tubulaire</td><td data-evidence="N17-C0205">Ischémie, toxiques, <button class="w" data-k="n17-rhabdo">rhabdomyolyse (pigments et bilan)</button> ou <button class="w" data-k="n17-cristaux">cristaux et cylindres protéiques (contexte et limites)</button></td><td data-evidence="N17-C0206">Il traite la cause et surveille les complications.</td></tr><tr><td data-evidence="N17-C0207">Glomérulaire ou interstitiel</td><td data-evidence="N17-C0208"><button class="w" data-k="n17-glomerule">Hématurie et protéinurie (atteinte glomérulaire)</button> ; <button class="w" data-k="n17-interstitielle">exposition médicamenteuse et leucocyturie (néphrite interstitielle)</button></td><td data-evidence="N17-C0209">Un sédiment actif ou une progression rapide imposent l’avis spécialisé.</td></tr><tr><td data-evidence="N17-C0210">Vasculaire</td><td data-evidence="N17-C0211"><button class="w" data-k="n17-microangiopathie">Microangiopathie thrombotique (indices d’hémolyse)</button> ou atteinte ischémique sévère</td><td data-evidence="N17-C0212">Une discussion néphrologique et, selon le contexte, hématologique est urgente.</td></tr><tr><td data-evidence="N17-C0213">Obstructif</td><td data-evidence="N17-C0214">Rétention, calcul, tumeur, obstacle bilatéral ou rein unique</td><td data-evidence="N17-C0215">Le médecin recherche l’obstacle et organise une dérivation si indiquée.</td></tr></tbody></table>
<p data-evidence="N17-C0216">Les causes intrarénales se distinguent par leurs indices. Une protéinurie et des cylindres érythrocytaires orientent différemment de cellules tubulaires avec débris granulaires. Dans les deux cas, l’évolution et les complications restent déterminantes.</p>
<h3>4.1 Lésions destructrices à distinguer</h3>
<p data-evidence="N17-C0217">La <button class="w" data-k="n17-corticale">nécrose corticale (atteinte ischémique sévère)</button> se distingue d’une atteinte tubulaire sans nécrose étendue. Une <button class="w" data-k="n17-papillaire">nécrose papillaire (obstacle intraluminal possible)</button> peut au contraire contribuer à un obstacle. Ces termes anatomiques ne se déduisent pas d’un stade KDIGO.</p>
<div class="key" data-evidence="N17-C0218"><b>À retenir.</b> Le diagnostic doit nommer la lésion démontrée et son mécanisme. Le classement biologique ne remplace pas une caractérisation anatomopathologique ou urologique.</div>
<h3>4.2 Terrain vulnérable</h3>
<p data-evidence="N17-C0219">Une maladie rénale chronique, une IRA antérieure, un diabète, une maladie hépatique ou une insuffisance cardiaque augmentent le risque. L’âge ≥ 65 ans figure parmi les facteurs de la recommandation britannique 148 ; il ne constitue pas un seuil autonome de diagnostic. Le <button class="w" data-k="n17-sepsis">sepsis (mécanismes multiples et surveillance)</button> et les médicaments complètent cette évaluation.</p>
<div class="key" data-evidence="N17-C0220"><b>À retenir.</b> Le terrain accroît la vigilance et la fréquence des contrôles. Il ne dispense pas de rechercher une cause nouvelle et réversible.</div>
<button class="pareto-btn ui" data-k="pareto-n17-causes">▲ Loi de Pareto — Causes et risque</button>
</section>

<section class="ilot" id="n17-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-evidence="N17-C0224">La chronologie relie les pertes, les expositions et les premières anomalies. Le médecin recherche une créatinine antérieure documentée, puis précise ce qui a changé avant l’épisode. Les <button class="w" data-k="n17-atcd">antécédents rénaux et généraux (risque et interprétation)</button> et la <button class="w" data-k="n17-medicaments">revue des médicaments (toxicité, hémodynamique ou accumulation)</button> participent au diagnostic causal.</p>
<p data-evidence="N17-C0225">Les <button class="w" data-k="n17-symptomes">symptômes (formes oligurique et silencieuse)</button> n’ont pas une fréquence universelle : ils dépendent de la cause et du recrutement. Le médecin précise d’abord les urines et les pertes, puis la respiration, les signes infectieux, les douleurs et les troubles mictionnels.</p>
<div class="two"><div class="card"><h4>Forme symptomatique</h4><p data-evidence="N17-C0226">Le patient rapporte des pertes et une baisse des urines. L’examen cherche une hypovolémie, mais vérifie également une congestion, un obstacle et des complications.</p>
</div><div class="card"><h4>Forme non oligurique</h4><p data-evidence="N17-C0227">La créatinine augmente malgré une diurèse conservée. Une exposition toxique ou une maladie parenchymateuse reste possible ; le débit urinaire seul n’exclut pas l’IRA.</p>
</div></div><div class="trap" data-evidence="N17-C0228"><span class="k">Piège</span> Une explication séduisante, comme une injection récente de contraste, peut faire négliger d’autres causes. Le médecin complète le bilan et distingue relation temporelle et causalité.</div>
<div class="key" data-evidence="N17-C0229"><b>À retenir.</b> La valeur antérieure, les dates, les pertes et les dernières doses rendent le raisonnement vérifiable. La maladie causale peut masquer les manifestations proprement rénales.</div>
</section>

<section class="ilot" id="n17-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-evidence="N17-C0230">L’examen commence par l’état général et les <button class="w" data-k="n17-vitals">signes vitaux (perfusion et gravité)</button>. Le médecin apprécie la conscience, la pression, le pouls, la respiration et l’oxygénation. Il mesure le <button class="w" data-k="n17-poids">poids et le bilan hydrique (évolution et pièges)</button> avant de choisir une correction du volume.</p>
<div class="two"><div class="card"><h4>Perfusion et volume</h4><p data-evidence="N17-C0231">L’hypotension et les pertes documentées orientent vers un déficit circulant. Les œdèmes, les signes veineux et les anomalies pulmonaires orientent vers une congestion. Une pression isolée ne résume pas ces deux dimensions.</p>
<p data-evidence="N17-C0629">Pour rendre les signes vérifiables, ouvrir les gestes de <button class="w" data-k="n17-jugulaire">l’examen jugulaire</button>, de <button class="w" data-k="n17-oedeme">la recherche du godet</button> et de <button class="w" data-k="n17-poumon">l’examen pulmonaire</button>. Chaque résultat est confronté à la perfusion et au bilan hydrique.</p>

</div><div class="card"><h4>Signes étiologiques</h4><p data-evidence="N17-C0232">Le médecin examine l’abdomen et recherche une rétention, des signes infectieux et des signes de maladie systémique. Une hématurie avec protéinurie, un purpura ou une hypertension peuvent orienter vers une cause parenchymateuse.</p>
<p data-evidence="N17-C0630">La <button class="w" data-k="n17-vessie">recherche d’une rétention vésicale</button> précise le geste, sa valeur et la raison de confirmer par l’échographie lorsque l’obstacle reste possible.</p>

</div></div><p data-evidence="N17-C0233">La <button class="w" data-k="n17-diurese">diurèse (recueil, calcul et durée)</button> complète l’examen et sa surveillance. Le médecin vérifie un recueil réellement bas avant de lui attribuer un mécanisme. Il documente la réponse à chaque intervention, sans confondre reprise d’urines et récupération certaine de filtration.</p>
<div class="key" data-evidence="N17-C0234"><b>À retenir.</b> La décision de perfuser ou de dépléter repose sur la confrontation de perfusion, congestion et bilan hydrique. Le diagnostic causal se poursuit même si la pression est corrigée.</div>
<button class="pareto-btn ui" data-k="pareto-n17-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
