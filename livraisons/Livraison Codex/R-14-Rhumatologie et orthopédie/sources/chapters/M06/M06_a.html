<section class="ilot" id="m06-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 46 ans, fumeuse, décrit depuis deux mois des douleurs des deux poignets et des doigts, avec une raideur matinale de plus d’une heure. Elle a du mal à ouvrir un bocal. La question qui structure le chapitre est la suivante : <b>s’agit-il d’une polyarthrite rhumatoïde débutante, comment la confirmer rapidement, et quel traitement instaurer dans la « fenêtre d’opportunité » pour éviter les destructions articulaires ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître une arthrite inflammatoire, appliquer les critères de classification ACR/EULAR 2010, interpréter facteur rhumatoïde et anticorps anti-peptides citrullinés, mesurer l’activité (DAS28), débuter le méthotrexate avec sa surveillance, conduire la stratégie « traiter jusqu’à la cible » et reconnaître les atteintes extra-articulaires graves.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="m06-synov">synovite (inflammation de la membrane synoviale)</button> et la <button class="w" data-k="m06-inflam">différence entre douleur inflammatoire et mécanique</button>.</div>
</section>
<section class="ilot" id="m06-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La polyarthrite rhumatoïde est un <b>rhumatisme inflammatoire chronique auto-immun</b>, caractérisé par une synovite <b>symétrique</b> des petites et grandes articulations périphériques, qui détruit le cartilage et l’os en l’absence de traitement, et par des atteintes extra-articulaires. On distingue la forme <b>séropositive</b> (facteur rhumatoïde et/ou anticorps anti-peptides citrullinés ; M05) et la forme <b>séronégative</b> (M06.0). La forme séropositive a un pronostic plus sévère.</p>
<p>Les critères ACR/EULAR 2010 sont des critères de <b>classification</b>, conçus pour identifier tôt les patients à risque d’évolution érosive ; ils s’appliquent à un patient avec au moins une synovite clinique non mieux expliquée par une autre maladie (détail au § 12). Exemple : une patiente avec six petites articulations gonflées (3 points), des anticorps anti-peptides citrullinés à plus de trois fois la normale (3 points), une CRP élevée (1 point) et des symptômes depuis huit semaines (1 point) atteint 8 sur 10 : la classification est acquise.</p>
</section>
<section class="ilot" id="m06-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Prévalence d’environ <b>0,5 à 1 %</b> de la population adulte en Europe, <b>deux à trois fois plus fréquente chez la femme</b>, pic de début entre 40 et 60 ans. En Suisse, le registre SCQM (Swiss Clinical Quality Management in Rheumatic Diseases) suit plusieurs milliers de patients et documente l’efficacité et la sécurité des traitements en pratique réelle. Sans traitement, des érosions apparaissent chez la majorité des patients séropositifs dans les deux premières années ; la mortalité est augmentée, surtout par les maladies cardiovasculaires (risque multiplié par environ 1,5). Le traitement précoce et ciblé a transformé ce pronostic : la rémission est aujourd’hui un objectif réaliste pour une grande partie des patients.</p>
</section>
<section class="ilot" id="m06-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Rupture de tolérance</b> : chez un sujet génétiquement prédisposé (allèles HLA-DRB1 portant l’<button class="w" data-k="m06-epitope">épitope partagé</button>), un facteur d’environnement (surtout le <b>tabac</b>) favorise, dans le poumon et les muqueuses, la <button class="w" data-k="m06-citrul">citrullination de protéines</button>. Des anticorps anti-peptides citrullinés apparaissent <b>des années avant</b> les arthrites (phase préclinique).</p>
<p><b>Synovite</b> : la membrane synoviale est envahie par des lymphocytes T et B, des macrophages et des plasmocytes. Les cytokines (TNF-α, IL-6, IL-1) entretiennent l’inflammation et la prolifération des synoviocytes fibroblastiques. La synoviale s’épaissit en un tissu agressif, le <b>pannus</b>.</p>
<p><b>Destruction</b> : le pannus et les métalloprotéases détruisent le cartilage (pincement articulaire) ; le RANKL active les ostéoclastes qui creusent des <b>érosions</b> à la jonction cartilage-os. La perte d’os périarticulaire donne l’ostéopénie en bande. Les tendons et ligaments inflammés se rompent ou se distendent : déformations.</p>

<div class="key"><b>Corrélation physiopathologie → traitement et examens.</b> Chaque cytokine est une cible (anti-TNF, anti-récepteur de l’IL-6) ; les lymphocytes B (rituximab) et la costimulation des lymphocytes T (abatacept) aussi ; les inhibiteurs de JAK bloquent la signalisation commune de plusieurs cytokines. L’IL-6 explique la CRP élevée, l’anémie inflammatoire et la fatigue. Les érosions étant irréversibles, la fenêtre des trois premiers mois compte.</div>
</section>
<section class="ilot" id="m06-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<p><b>Génétiques</b> : HLA-DRB1 (épitope partagé), PTPN22 ; héritabilité d’environ 50 à 60 % chez les jumeaux. <b>Environnement</b> : <b>tabac</b> (principal facteur modifiable, surtout pour la forme à anticorps anti-peptides citrullinés, avec interaction multiplicative avec l’épitope partagé), silice, maladie parodontale (<i>Porphyromonas gingivalis</i> produit une enzyme citrullinante), obésité. <b>Sexe féminin</b> ; le post-partum est une période de début fréquente.</p>
</section>
<section class="ilot" id="m06-5"><h2><span class="n">5</span>Anamnèse</h2>
<p><b>Douleurs inflammatoires</b> : réveils nocturnes en seconde partie de nuit, <b>raideur matinale prolongée (&gt; 30 à 60 minutes)</b>, amélioration par le mouvement. Topographie typique : <b>poignets, métacarpophalangiennes, interphalangiennes proximales, métatarsophalangiennes</b>, de manière <b>symétrique</b> ; les interphalangiennes distales sont épargnées. Signes généraux : fatigue marquée, fébricule, amaigrissement. Rechercher : tabac, antécédents familiaux, psoriasis (personnel ou familial), éruption, sécheresse oculo-buccale, symptômes digestifs, infections récentes (parvovirus B19, hépatites), voyage, grossesse.</p>
<div class="two"><div class="card"><h4>Début typique</h4><p>Polyarthrite bilatérale et symétrique des mains et des pieds, progressive sur des semaines.</p></div>
<div class="card"><h4>Débuts atypiques</h4><p>Monoarthrite d’une grosse articulation ; forme rhizomélique du sujet âgé ressemblant à une pseudo-polyarthrite rhizomélique ; rhumatisme palindromique (poussées de quelques heures à jours, sans séquelle) ; ténosynovite isolée avec syndrome du canal carpien.</p></div></div>
</section>
<section class="ilot" id="m06-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Compter les <b>articulations gonflées et douloureuses</b> (28 articulations du DAS28). La synovite se palpe comme une tuméfaction élastique, chaude, douloureuse ; le <button class="w" data-k="m06-squeeze">test de compression des métacarpophalangiennes ou des métatarsophalangiennes</button> est positif. Au stade évolué : déviation cubitale des doigts, <b>doigts en col de cygne</b> et <b>en boutonnière</b>, pouce en Z, avant-pied plat triangulaire, <b>nodules rhumatoïdes</b> aux faces d’extension (coudes). Rechercher les atteintes extra-articulaires (îlot 8) : poumons (crépitants), yeux, peau, nerfs, cœur.</p>
