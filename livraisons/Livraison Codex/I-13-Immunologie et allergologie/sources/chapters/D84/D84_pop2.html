<template data-pop="d84-d-ig" data-title="Immunoglobulines polyvalentes">
<div class="lab">Mécanisme</div><p>IgG humaines issues de milliers de donneurs : remplacent les anticorps manquants (opsonisation, neutralisation).</p>
<div class="lab">Posologie</div><p>Intraveineuse : 0,4–0,6 g/kg toutes les 3 à 4 semaines. Sous-cutanée : dose mensuelle équivalente fractionnée chaque semaine ou toutes les deux semaines, à domicile, avec des concentrations résiduelles plus stables et moins d’effets systémiques.</p>
<div class="lab">Objectif</div><p>Suppression des infections ; IgG résiduelle souvent ≥ 7–8 g/L, plus haute avec bronchectasies.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, frissons, méningite aseptique, thromboses, insuffisance rénale aiguë, hémolyse ; réactions locales en sous-cutané.</p></template>
<template data-pop="d84-d-proph" data-title="Prophylaxies anti-infectieuses">
<p><b>Cotrimoxazole</b> : <i>Pneumocystis</i> (déficits T, déficit combiné sévère, syndrome hyper-IgM) et prophylaxie antibactérienne de la granulomatose septique chronique. <b>Itraconazole</b> : prévention d’<i>Aspergillus</i> dans la granulomatose septique chronique ; surveiller interactions et fonction hépatique. <b>Azithromycine</b> : bronchectasies avec exacerbations fréquentes (ECG, QT). <b>Asplénie</b> : amoxicilline en réserve ou continue selon l’âge et le risque, vaccinations complètes.</p></template>
<template data-pop="d84-d-aoh" data-title="Traitements de l’angio-œdème héréditaire">
<div class="lab">Crise</div><p>Concentré d’inhibiteur de la C1 estérase intraveineux (20 UI/kg pour le produit plasmatique concerné) ou icatibant 30 mg sous-cutané (antagoniste du récepteur B2 de la bradykinine). Traiter <b>toute</b> crise laryngée et le plus tôt possible chaque crise.</p>
<div class="lab">Prophylaxie avant geste</div><p>Concentré d’inhibiteur de la C1 estérase 1 à 6 heures avant un soin dentaire ou une intervention.</p>
<div class="lab">Prophylaxie au long cours</div><p>Lanadélumab (anticorps anti-kallicréine plasmatique, sous-cutané toutes les 2 à 4 semaines), bérotralstat (inhibiteur oral de la kallicréine), concentré d’inhibiteur de la C1 estérase sous-cutané ; danazol, androgène, en recul pour ses effets indésirables.</p></template>
<template data-pop="pareto-d84-clin" data-title="Pareto — Notions, mécanismes et clinique">
<p class="ratio" data-cover="d84-0,d84-1,d84-2,d84-3,d84-4,d84-5,d84-6"></p>
<ul><li>Déficit = infections trop fréquentes, graves, longues ou à germes inhabituels, souvent avec auto-immunité, granulomes, lymphoprolifération, lymphome.</li>
<li>Le germe désigne le compartiment : encapsulées = anticorps ; opportunistes = T ; staphylocoque et <i>Aspergillus</i> = phagocytes ; <i>Neisseria</i> = complément terminal.</li>
<li>Chez l’adulte, <b>causes secondaires d’abord</b> : anti-CD20, antiépileptiques, clozapine, myélome, leucémie lymphoïde chronique, pertes protéiques, VIH, asplénie.</li>
<li>Déficit en IgA : le plus fréquent ; déficit immunitaire commun variable : le plus fréquent symptomatique de l’adulte.</li>
<li>Protection maternelle jusqu’à 6 mois : défauts d’anticorps après 6 mois, défauts T dès les premières semaines.</li>
<li>Examen : absence de tissu lymphoïde (agammaglobulinémie) ; signes syndromiques (Wiskott-Aldrich, 22q11.2).</li></ul></template>
<template data-pop="pareto-d84-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="d84-7"></p>
<ul><li>Première ligne : formule sanguine, IgG-IgA-IgM selon l’âge, électrophorèse et immunofixation, albumine, protéinurie, VIH.</li>
<li>Fonction : réponses vaccinales (tétanos, polysaccharides pneumococciques).</li>
<li>Puis phénotypage lymphocytaire, complément (CH50, AH50, C4, inhibiteur de C1), dihydrorhodamine, génétique.</li>
<li>Prélever avant immunoglobulines ou transfusion.</li></ul></template>
<template data-pop="pareto-d84-tt" data-title="Pareto — Tableaux, urgences et traitement">
<p class="ratio" data-cover="d84-8,d84-9,d84-10"></p>
<ul><li>Déficit immunitaire commun variable : adulte jeune, IgG et IgA basses, réponse vaccinale nulle, B mémoire commutés bas, auto-immunité et lymphome.</li>
<li>Bruton : garçon, B &lt; 2 %, BTK. IgA &lt; 0,07 g/L isolé après 4 ans : déficit sélectif, pas de substitution ; sérologie cœliaque en IgG.</li>
<li>Déficit combiné sévère : nourrisson, lymphopénie, opportunistes ; pas de vaccin vivant, sang irradié, greffe rapide ; dépistage TREC.</li>
<li>Granulomatose septique chronique : NADPH oxydase, germes à catalase, dihydrorhodamine.</li>
<li>C5–C9 : méningococcies récidivantes. Angio-œdème sans urticaire : bradykinine ; crise = inhibiteur de C1 ou icatibant ; adrénaline inefficace.</li>
<li>Immunoglobulines 0,4–0,6 g/kg/mois ; vaccins vivants contre-indiqués ; prophylaxies selon le compartiment.</li></ul></template>
<template data-pop="pareto-d84-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="d84-11,d84-12,d84-13"></p>
<ul><li>Suivi : infections, IgG résiduelles, spirométrie, tomodensitométrie, dépistage des lymphomes ; conseil génétique.</li>
<li>Grossesse : immunoglobulines souvent augmentées ; angio-œdème : inhibiteur de C1.</li>
<li>Critères ESID du déficit immunitaire commun variable : manifestation + IgG et IgA basses (deux dosages) + réponse vaccinale insuffisante ou B mémoire commutés &lt; 70 % + causes secondaires exclues + âge &gt; 4 ans + pas de déficit T profond.</li>
<li>Angio-œdème héréditaire : C4 bas + inhibiteur de C1 bas en taux (type 1) ou en fonction (type 2), confirmé deux fois.</li></ul></template>
<template data-pop="pareto-d84-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="d84-e-1,d84-e-2,d84-e-3"></p>
<ul><li>Repères adulte : IgG ≈ 7–16 g/L, IgA ≈ 0,7–4, IgM ≈ 0,4–2,3 g/L ; normes de l’âge chez l’enfant.</li>
<li>Tétanos protecteur ≥ 0,1 UI/mL ; pneumocoque ≥ 1,3 µg/mL pour ≥ 70 % des sérotypes.</li>
<li>Nadir physiologique des IgG vers 3–6 mois.</li>
<li>Lymphopénie &lt; 3 000/µL chez le nourrisson : alerte. B &lt; 2 % : agammaglobulinémie.</li>
<li>CH50 et AH50 nuls : C3 ou voie terminale ; CH50 seul : voie classique ; C1q bas : angio-œdème acquis.</li>
<li>Dihydrorhodamine négative : granulomatose septique chronique.</li></ul></template>
<template data-pop="pareto-d84-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="d84-p-1,d84-p-2"></p>
<ul><li>Immunoglobulines intraveineuses ou sous-cutanées : thromboses, rein, méningite aseptique ; perfuser lentement.</li>
<li>Cotrimoxazole contre <i>Pneumocystis</i> ; itraconazole dans la granulomatose septique chronique (CYP3A4).</li>
<li>Angio-œdème : inhibiteur de C1, icatibant, lanadélumab, bérotralstat ; éviter œstrogènes et inhibiteurs de l’enzyme de conversion.</li>
<li>Vaccins vivants contre-indiqués dans les déficits humoraux et combinés significatifs.</li></ul></template>
