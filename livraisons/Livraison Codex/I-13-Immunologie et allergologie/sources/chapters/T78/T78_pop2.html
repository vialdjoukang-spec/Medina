<template data-pop="t78-d-adre" data-title="Adrénaline (épinéphrine)">
<div class="lab">Mécanisme</div><p>Agoniste alpha et bêta. Alpha-1 : vasoconstriction, réduction de l’œdème et de la fuite capillaire. Bêta-1 : contractilité et fréquence cardiaques. Bêta-2 : bronchodilatation, inhibition de la libération des médiateurs mastocytaires.</p>
<div class="lab">Posologie</div><p>0,01 mg/kg intramusculaire (1 mg/mL), maximum 0,5 mg chez l’adulte, face antérolatérale de la cuisse, à travers les vêtements si besoin ; répéter à 5 minutes. Forme nasale 2 mg à partir de 30 kg (autorisée dans l’Union européenne et aux États-Unis).</p>
<div class="lab">Effets indésirables</div><p>Pâleur, tremblement, palpitations, anxiété, céphalées : transitoires. Arythmies, poussée hypertensive et ischémie surtout avec la voie intraveineuse en bolus ou les surdosages.</p>
<div class="lab">Auto-injecteur</div><p>Retirer le capuchon de sécurité, appliquer fermement sur la cuisse, maintenir quelques secondes selon le modèle, masser ; appeler le 144 ; seconde injection après 5 à 15 minutes si les symptômes persistent. Deux dispositifs à porter sur soi, à l’abri de la chaleur ; vérifier la date de péremption.</p></template>
<template data-pop="t78-d-gluc" data-title="Glucagon dans l’anaphylaxie">
<p>Hormone pancréatique qui active son propre récepteur couplé à Gs dans le myocarde : augmentation de l’AMPc, effet inotrope et chronotrope <b>indépendant des récepteurs bêta</b>. Indication : anaphylaxie réfractaire chez un patient sous bêtabloquant. Adulte 1–2 mg intraveineux en 5 minutes, puis 5–15 µg/min ; enfant 20–30 µg/kg (maximum 1 mg). Effets : nausées, vomissements (position latérale, protection des voies aériennes), hyperglycémie.</p></template>
<template data-pop="t78-d-antih" data-title="Antihistaminiques H1">
<p>Agonistes inverses du récepteur H1. <b>Deuxième génération</b> (cétirizine, lévocétirizine, fexofénadine, bilastine, desloratadine) : peu sédatifs, première ligne de l’urticaire et de la rhinite. <b>Première génération</b> (clémastine, dimétindène) : sédatifs, anticholinergiques. Dans l’anaphylaxie : effet uniquement sur le prurit, l’urticaire, la rhinorrhée ; début d’action en 30 à 60 minutes ; aucune action sur le bronchospasme et l’hypotension.</p></template>
<template data-pop="t78-d-ita" data-title="Immunothérapie allergénique">
<div class="lab">Principe</div><p>Administration répétée de l’allergène à doses croissantes puis d’entretien, induisant une tolérance : lymphocytes T régulateurs, IgG4 bloquantes, baisse de la réactivité mastocytaire.</p>
<div class="lab">Venins</div><p>Voie sous-cutanée ; phase d’induction (protocoles accélérés en jours ou en semaines, en milieu hospitalier) puis entretien de 100 µg toutes les 4 à 8 semaines pendant 3 à 5 ans ou plus. Protection ≈ 95 % (guêpe), 80–85 % (abeille). Test de piqûre sous surveillance pour vérifier l’efficacité dans certains centres.</p>
<div class="lab">Autres</div><p>Pollens et acariens (sous-cutanée ou sublinguale) : réduisent symptômes et médicaments de la rhinite et de l’asthme allergique ; aliments (orale) en centre spécialisé.</p>
<div class="lab">Risques</div><p>Réactions systémiques (surveillance 30 minutes après injection) ; prudence avec les bêtabloquants ; asthme non contrôlé = contre-indication.</p></template>
<template data-pop="pareto-t78-clin" data-title="Pareto — Définitions, mécanismes et clinique"><p class="ratio" data-cover="t78-0,t78-1,t78-2,t78-3,t78-4,t78-5,t78-6"></p><ul>
<li>Anaphylaxie = hypersensibilité systémique grave, rapide, potentiellement mortelle (voies aériennes, respiration, circulation) ; allergique (IgE) ou non (MRGPRX2, complément, cyclo-oxygénase 1).</li>
<li>Tue par obstruction haute, bronchospasme, collapsus ; seule l’adrénaline agit sur les trois ; retard à l’adrénaline = principal facteur de décès.</li>
<li>Grades de Ring et Messmer I à IV ; la peau peut manquer (10–20 %).</li>
<li>Enfant : aliments ; adulte : venins, médicaments (bêtalactamines, anti-inflammatoires, curares, chlorhexidine), aliments.</li>
<li>Cofacteurs : effort, anti-inflammatoires, alcool, infection ; gravité : asthme, cardiopathie, mastocytose, bêtabloquants, inhibiteurs de l’enzyme de conversion, adolescence.</li>
<li>Choc distributif et hypovolémique ; jamais debout ; biphasique ≈ 5 %, surtout &lt; 12 h.</li>
<li>Examen ABCDE ; fréquence normale ou basse n’exclut pas le choc (bêtabloquant, réflexe vagal).</li></ul></template>
<template data-pop="pareto-t78-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="t78-7"></p><ul>
<li>Diagnostic clinique, critères WAO 2020 : (1) peau-muqueuses + respiratoire, circulatoire ou digestif sévère ; (2) hypotension, bronchospasme ou larynx après allergène connu, même sans peau.</li>
<li>L’adrénaline n’attend pas les critères.</li>
<li>Différentiels : autres chocs, asthme, angio-œdème bradykinique (pas d’urticaire, résistant à l’adrénaline), malaise vagal (bradycardie), panique, flush non allergique, scombroïde.</li></ul></template>
<template data-pop="pareto-t78-urg" data-title="Pareto — Traitement en urgence"><p class="ratio" data-cover="t78-8"></p><ul>
<li>Appeler, arrêter l’exposition, <b>adrénaline intramusculaire 0,01 mg/kg (max. 0,5 mg) dans la cuisse</b>, répéter à 5 min.</li>
<li>Position : allongé jambes surélevées si hypotension ; assis si détresse respiratoire ; latéral gauche si enceinte.</li>
<li>Oxygène, remplissage 500–1 000 mL (enfant 10–20 mL/kg), salbutamol, adrénaline nébulisée si stridor.</li>
<li>Antihistaminiques après stabilisation, pour la peau ; corticostéroïdes sans bénéfice aigu.</li>
<li>Réfractaire après deux doses : adrénaline intraveineuse continue, soins intensifs ; glucagon si bêtabloquant.</li></ul></template>
<template data-pop="pareto-t78-crit" data-title="Pareto — Suivi, allergies et critères"><p class="ratio" data-cover="t78-9,t78-10,t78-11,t78-12,t78-13,t78-14"></p><ul>
<li>Observation ≥ 6 h (12–24 h si sévère) ; deux auto-injecteurs démontrés, plan écrit, éviction, revue des bêtabloquants et inhibiteurs de l’enzyme de conversion, allergologue (tests à 4–6 semaines).</li>
<li>Aliments : IgE vs non IgE ; PR-10 (labiles, oral) vs LTP et Ara h 2 (stables, systémiques) ; alpha-gal retardé ; introduction précoce de l’arachide (LEAP) entre 4 et 6 mois.</li>
<li>Venins : tryptase de base ; immunothérapie 3–5 ans, efficace à 95 % (guêpe), 80–85 % (abeille).</li>
<li>Médicaments : &gt; 90 % des « allergiques à la pénicilline » la tolèrent ; PEN-FAST et provocation ; réactions croisées selon les chaînes latérales ; DRESS et nécrolyse = pas de réintroduction ; HLA-B*15:02 et carbamazépine.</li>
<li>Critères WAO 2020 ; tryptase aiguë &gt; 1,2 × base + 2.</li></ul></template>
<template data-pop="pareto-t78-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="t78-e-1,t78-e-2,t78-e-3,t78-e-4,t78-e-5"></p><ul>
<li>Pendant la crise, seul prélèvement utile : tryptase (30 min–2 h), base à &gt; 24 h ; seuil 1,2 × base + 2 ; base &gt; 11,4 : mastocytose ou alpha-tryptasémie.</li>
<li>Tests cutanés à 4–6 semaines : prick (papule ≥ 3 mm), intradermoréactions ; arrêter les antihistaminiques.</li>
<li>IgE spécifiques = sensibilisation ; composants : Ara h 2, Pru p 3, Tri a 19, Gal d 1, Ves v 5, Api m 1, alpha-gal.</li>
<li>Test de provocation = référence ; contre-indiqué après DRESS ou nécrolyse ; test d’activation des basophiles en centre.</li></ul></template>
<template data-pop="pareto-t78-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="t78-p-1,t78-p-2,t78-p-3"></p><ul>
<li>Adrénaline : aucune contre-indication absolue ; 1 mg/mL en intramusculaire ; bolus intraveineux seulement en arrêt ; auto-injecteurs 0,15 / 0,3 mg, toujours deux.</li>
<li>Glucagon 1–2 mg intraveineux puis 5–15 µg/min sous bêtabloquant.</li>
<li>Antihistaminiques de deuxième génération pour la peau ; première génération sédatifs.</li>
<li>Bêtabloquants et inhibiteurs de l’enzyme de conversion aggravent ; chlorhexidine allergène méconnu ; la prémédication ne protège pas d’une allergie IgE.</li></ul></template>
