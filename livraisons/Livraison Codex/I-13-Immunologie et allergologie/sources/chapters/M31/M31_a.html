<section class="ilot" id="m31-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 74 ans se plaint depuis trois semaines de céphalées temporales droites inhabituelles, d’une douleur de la mâchoire qui l’oblige à s’interrompre en mâchant, et de douleurs des épaules au réveil. Ce matin, elle a vu « un rideau noir » pendant quelques minutes devant l’œil droit. La CRP est à 86 mg/L. La question qui structure le chapitre est double : <b>face à ce tableau, combien de temps peut-on attendre avant de traiter ?</b> — aucune heure, car la cécité définitive menace — et, plus largement, <b>comment reconnaître une vascularite, en déterminer le type selon la taille des vaisseaux atteints, la prouver et la traiter sans nuire par les corticostéroïdes ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait classer les vascularites selon la nomenclature de Chapel Hill, reconnaître les signes d’appel (fièvre prolongée, purpura vasculaire, mononévrite multiple, glomérulonéphrite, hémorragie alvéolaire, claudication de la mâchoire), débuter sans délai le traitement de l’artérite à cellules géantes, interpréter les ANCA, identifier un syndrome pneumo-rénal, reconnaître une maladie de Kawasaki chez l’enfant, et conduire les traitements d’induction et d’entretien.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="m31-paroi">paroi artérielle et la taille des vaisseaux</button>, les <button class="w" data-k="m31-anca">ANCA (anticorps anti-cytoplasme des polynucléaires neutrophiles)</button> et le <button class="w" data-k="m31-purpura">purpura vasculaire (infiltré, déclive)</button>.</div>
</section>

<section class="ilot" id="m31-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Une vascularite est une <b>inflammation de la paroi des vaisseaux</b>, qui peut aboutir à leur rétrécissement, leur occlusion (ischémie, infarctus), leur rupture (hémorragie, anévrisme) ou à une fuite (œdème, purpura). Elle est <b>primitive</b> (maladie autonome) ou <b>secondaire</b> (infection, médicament, cancer, connectivite comme le lupus ou la polyarthrite rhumatoïde).</p>
<p>La <b>nomenclature de Chapel Hill 2012</b> classe les vascularites selon le calibre des vaisseaux <b>principalement</b> atteints ; ce calibre explique la clinique.</p>
<table class="t"><tr><th>Calibre</th><th>Vascularites</th><th>Signes typiques</th></tr>
<tr><td><b>Gros vaisseaux</b> (aorte et ses branches)</td><td>Artérite à cellules géantes (maladie de Horton), artérite de Takayasu</td><td>Claudication (mâchoire, membres), abolition des pouls, souffles, asymétrie tensionnelle, anévrisme aortique</td></tr>
<tr><td><b>Vaisseaux de moyen calibre</b> (artères viscérales)</td><td>Périartérite noueuse, maladie de Kawasaki</td><td>Infarctus viscéraux, mononévrite multiple, nodules sous-cutanés, micro-anévrismes, anévrismes coronaires</td></tr>
<tr><td><b>Petits vaisseaux, associés aux ANCA</b></td><td>Granulomatose avec polyangéite, polyangéite microscopique, granulomatose éosinophilique avec polyangéite</td><td>Glomérulonéphrite, hémorragie alvéolaire, atteinte oto-rhino-laryngée, purpura, mononévrite</td></tr>
<tr><td><b>Petits vaisseaux, à complexes immuns</b></td><td>Vascularite à IgA (purpura rhumatoïde), cryoglobulinémique, anti-membrane basale glomérulaire, urticarienne hypocomplémentémique</td><td>Purpura palpable, arthralgies, douleurs abdominales, néphrite</td></tr>
<tr><td><b>Calibre variable</b></td><td>Maladie de Behçet, syndrome de Cogan</td><td>Aphtes buccaux et génitaux, uvéite, thromboses veineuses</td></tr>
<tr><td>Secondaires ou d’un seul organe</td><td>Vascularites du lupus, de l’hépatite B (périartérite) ou C (cryoglobulinémie), médicamenteuses (propylthiouracile, hydralazine, cocaïne coupée au lévamisole), vascularite cutanée isolée, vascularite primitive du système nerveux central</td><td>Selon la cause</td></tr></table>
<div class="trap"><span class="k">Piège</span>Le calibre désigne les vaisseaux <b>principalement</b> atteints, non exclusivement : une vascularite des gros vaisseaux peut toucher des artères de moyen calibre (l’artère ophtalmique dans l’artérite à cellules géantes), et une vascularite à ANCA peut toucher des artères moyennes. La classification oriente ; elle n’enferme pas.</div>
<h3>1.1 Classification et diagnostic</h3>
<p>Les critères de l’American College of Rheumatology et de l’EULAR (ACR/EULAR 2022) sont des critères de <b>classification</b>, destinés aux études : ils s’appliquent <b>après</b> qu’une vascularite a été diagnostiquée et que ses imitateurs ont été exclus. Le diagnostic, lui, repose sur l’ensemble clinique, biologique, histologique et radiologique. Leur connaissance reste utile, car ils résument les éléments les plus discriminants (§ 13).</p>
<h3>1.2 Codage CIM-10-GM</h3>
<p>M30.0 : périartérite noueuse. M30.1 : polyartérite avec atteinte pulmonaire (granulomatose éosinophilique avec polyangéite). M30.3 : syndrome lympho-cutanéo-muqueux (maladie de Kawasaki). M31.0 : angéite d’hypersensibilité (dont anti-membrane basale). M31.3 : granulomatose avec polyangéite. M31.4 : syndrome de la crosse aortique (Takayasu). M31.5 : artérite à cellules géantes avec pseudo-polyarthrite rhizomélique. M31.6 : autres artérites à cellules géantes. M31.7 : polyangéite microscopique. Renvois : D69.0 (purpura rhumatoïde, vascularite à IgA), M35.2 (maladie de Behçet), M35.3 (pseudo-polyarthrite rhizomélique isolée).</p>
</section>

<section class="ilot" id="m31-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<table class="t"><tr><th>Vascularite</th><th>Terrain</th><th>Incidence approximative en Europe</th></tr>
<tr><td>Artérite à cellules géantes</td><td>Toujours après 50 ans, pic vers 70–80 ans, femmes deux à trois fois plus, Europe du Nord</td><td>10 à 30 pour 100 000 personnes de plus de 50 ans par an — la vascularite la plus fréquente de l’adulte</td></tr>
<tr><td>Pseudo-polyarthrite rhizomélique</td><td>Après 50 ans</td><td>2 à 3 fois plus fréquente que l’artérite ; 15 à 20 % des patients ont une artérite associée</td></tr>
<tr><td>Vascularites à ANCA (ensemble)</td><td>50–70 ans</td><td>10 à 20 par million par an</td></tr>
<tr><td>Takayasu</td><td>Femme de moins de 40 ans, plus fréquente en Asie</td><td>1 à 2 par million par an</td></tr>
<tr><td>Maladie de Kawasaki</td><td>Enfant de moins de 5 ans</td><td>≈ 10 à 20 pour 100 000 enfants de moins de 5 ans en Europe (beaucoup plus au Japon)</td></tr>
<tr><td>Vascularite à IgA</td><td>Enfant de 3 à 10 ans surtout</td><td>≈ 10 à 20 pour 100 000 enfants par an — la vascularite la plus fréquente de l’enfant</td></tr></table>
<p><b>Pronostic.</b> Avant les immunosuppresseurs, les vascularites à ANCA généralisées étaient mortelles dans l’année chez plus de 80 % des patients ; la survie à 5 ans dépasse aujourd’hui 75 à 80 %. La première cause de décès pendant la première année est désormais l’<b>infection</b> (liée au traitement), avant l’activité de la maladie. L’artérite à cellules géantes n’augmente pas nettement la mortalité, mais expose à la cécité (15 à 20 % des patients non traités), aux anévrismes aortiques et à la toxicité cumulative des corticostéroïdes. La maladie de Kawasaki non traitée entraîne des anévrismes coronaires chez environ 25 % des enfants ; le traitement par immunoglobulines réduit ce risque à environ 5 %.</p>
</section>

<section class="ilot" id="m31-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les mécanismes diffèrent selon le groupe, ce qui explique des traitements différents.</p>
<div class="two">
<div class="card"><h4>Vascularites des gros vaisseaux : immunité cellulaire granulomateuse</h4><p>Des cellules dendritiques de l’adventice, activées, recrutent des lymphocytes T CD4 (voies Th1, avec l’interféron gamma, et Th17) et des macrophages. Ces derniers forment des <b>granulomes</b> avec des <b>cellules géantes</b> multinucléées dans la média, détruisent la limitante élastique interne et produisent des facteurs de croissance qui épaississent l’intima : la lumière se rétrécit, d’où l’ischémie. L’<b>IL-6</b>, très élevée, explique la fièvre, l’altération de l’état général et la CRP élevée : c’est la cible du tocilizumab.</p></div>
<div class="card"><h4>Vascularites à ANCA : neutrophiles activés par des auto-anticorps</h4><p>Une infection ou une autre agression « amorce » les neutrophiles, qui exposent à leur surface la protéinase 3 (PR3) ou la myéloperoxydase (MPO). Les ANCA s’y fixent et activent brutalement ces neutrophiles, qui adhèrent à l’endothélium des capillaires et le détruisent (nécrose fibrinoïde). La voie alterne du complément amplifie le phénomène par le fragment C5a, qui attire et active d’autres neutrophiles : C5aR1 était la cible de l’avacopan ; son autorisation européenne a été révoquée en 2026 (<button class="w" data-k="m31-d-avaco">actualisation</button>). Les lymphocytes B producteurs d’ANCA sont la cible du rituximab.</p></div>
<div class="card"><h4>Vascularites à complexes immuns</h4><p>Des complexes antigène-anticorps (IgA dans le purpura rhumatoïde, cryoglobulines dans l’hépatite C) se déposent dans la paroi des petits vaisseaux, activent le complément et attirent les neutrophiles : leucocytoclasie et purpura. La biopsie montre des <b>dépôts</b> en immunofluorescence, à l’inverse des vascularites à ANCA, dites « pauci-immunes ».</p></div>
<div class="card"><h4>Périartérite noueuse et maladie de Kawasaki</h4><p>Nécrose segmentaire des artères de moyen calibre, micro-anévrismes, thromboses ; souvent associée à l’hépatite B dans les formes anciennes. Chez l’enfant jeune, un déficit en adénosine désaminase 2 (DADA2) peut en mimer la présentation. La maladie de Kawasaki résulte d’une réponse inflammatoire intense, probablement déclenchée par un agent infectieux, chez un enfant prédisposé.</p></div></div>

<div class="key"><b>Corrélation physiopathologie → clinique et traitement.</b> Rétrécissement des grosses artères : claudication et abolition des pouls. Nécrose des capillaires glomérulaires et alvéolaires : hématurie et hémoptysie. Complexes immuns dans les capillaires cutanés : purpura palpable des jambes. L’IL-6 des vascularites des gros vaisseaux justifie le tocilizumab ; les lymphocytes B producteurs d’ANCA justifient le rituximab. Le rôle biologique du complément ne suffit pas à établir le bénéfice clinique d’un médicament.</div>
</section>

<section class="ilot" id="m31-4"><h2><span class="n">4</span>Reconnaître une vascularite</h2>
<p>Une vascularite se présente rarement par un signe unique. Elle associe habituellement un <b>syndrome inflammatoire</b> (fièvre prolongée, amaigrissement, fatigue, CRP élevée) et une <b>atteinte d’organes</b> dont la combinaison est évocatrice.</p>
<table class="t"><tr><th>Signe d’appel</th><th>Vascularite évoquée</th></tr>
<tr><td>Céphalées récentes après 50 ans, claudication de la mâchoire, troubles visuels</td><td>Artérite à cellules géantes</td></tr>
<tr><td>Douleurs inflammatoires des épaules et des hanches après 50 ans</td><td>Pseudo-polyarthrite rhizomélique (± artérite)</td></tr>
<tr><td>Asymétrie tensionnelle &gt; 10 mmHg, pouls absent, claudication d’un bras, souffle sous-clavier chez une femme jeune</td><td>Takayasu</td></tr>
<tr><td><button class="w" data-k="m31-purpura">Purpura infiltré, déclive</button></td><td>Petits vaisseaux : vascularite à IgA, cryoglobulinémie, vascularites à ANCA</td></tr>
<tr><td><button class="w" data-k="m31-mono">Mononévrite multiple</button> (steppage brutal, main tombante)</td><td>Périartérite noueuse, vascularites à ANCA, cryoglobulinémie</td></tr>
<tr><td>Hématurie avec cylindres, protéinurie, créatinine qui monte</td><td><button class="w" data-k="m31-gnrp">Glomérulonéphrite rapidement progressive</button> : ANCA, anti-membrane basale, IgA</td></tr>
<tr><td>Hémoptysie, anémie, infiltrats alvéolaires bilatéraux</td><td>Hémorragie alvéolaire : syndrome pneumo-rénal</td></tr>
<tr><td>Rhinite croûteuse, épistaxis, sinusite rebelle, otite séreuse, nez en selle</td><td>Granulomatose avec polyangéite</td></tr>
<tr><td>Asthme tardif, éosinophilie, polypose</td><td>Granulomatose éosinophilique avec polyangéite</td></tr>
<tr><td>Fièvre ≥ 5 jours chez un enfant de moins de 5 ans, conjonctivite, chéilite, éruption</td><td>Maladie de Kawasaki</td></tr>
<tr><td>Aphtes buccaux récidivants, aphtes génitaux, uvéite</td><td>Maladie de Behçet</td></tr></table>
<div class="alert"><b>Avant de conclure à une vascularite primitive, éliminer ses imitateurs</b> : <b>endocardite infectieuse</b> (hémocultures, échocardiographie : fièvre, purpura, glomérulonéphrite, emboles), embols de cholestérol (après cathétérisme, livedo, orteils violacés, éosinophilie), myxome de l’oreillette, syndrome des antiphospholipides, infections (hépatites B et C, VIH, syphilis), cocaïne coupée au lévamisole (purpura nécrotique des oreilles), lymphome intravasculaire, dysplasie fibromusculaire et syndromes génétiques (Ehlers-Danlos vasculaire) pour les atteintes artérielles.</div>
</section>
