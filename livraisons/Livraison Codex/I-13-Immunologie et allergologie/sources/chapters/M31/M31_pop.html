<template data-pop="m31-paroi" data-title="Paroi artérielle et calibre"><p>Trois tuniques : intima, média, adventice. <b>Gros</b> : aorte et branches principales (sous-clavières, carotides, temporales). <b>Moyens</b> : artères viscérales principales et leurs branches (rénales, mésentériques, coronaires). <b>Petits</b> : artérioles, capillaires, veinules, y compris glomérulaires et alvéolaires. Le calibre atteint prédit la sémiologie.</p></template>
<template data-pop="m31-anca" data-title="ANCA"><p>Anticorps dirigés contre des enzymes des granules des neutrophiles : protéinase 3 (PR3) et myéloperoxydase (MPO). Recherche recommandée par immunoessai spécifique. Anti-PR3 : granulomatose avec polyangéite ; anti-MPO : polyangéite microscopique, granulomatose éosinophilique. Faux positifs : endocardite, infections chroniques, maladies inflammatoires intestinales, médicaments. Positivité sans signe clinique : pas de traitement.</p></template>
<template data-pop="m31-purpura" data-title="Purpura vasculaire"><p>Taches rouges ou violacées qui <b>ne s’effacent pas à la vitropression</b> (sang extravasé), <b>infiltrées</b> (palpables), <b>déclives</b> (jambes, fesses), parfois nécrotiques. Traduit une vascularite des petits vaisseaux cutanés. À distinguer du purpura <b>plan</b> thrombopénique (pétéchies non infiltrées, muqueuses). Un purpura fébrile extensif impose d’éliminer un purpura fulminans méningococcique : antibiotique immédiat.</p></template>
<template data-pop="m31-mono" data-title="Mononévrite multiple"><p>Atteinte successive, asymétrique, de troncs nerveux distincts (fibulaire commun : pied tombant ; radial : main tombante ; ulnaire), brutale et douloureuse, par ischémie des <i>vasa nervorum</i>. L’électroneuromyogramme montre une atteinte axonale multifocale ; la biopsie neuromusculaire peut prouver la vascularite. Évocatrice de périartérite noueuse, de vascularites à ANCA et de cryoglobulinémie.</p></template>
<template data-pop="m31-gnrp" data-title="Glomérulonéphrite rapidement progressive"><p>Perte de plus de 50 % de la fonction rénale en quelques semaines, avec hématurie glomérulaire et cylindres hématiques, protéinurie ; histologiquement, prolifération extracapillaire en croissants. Trois mécanismes : pauci-immune (ANCA), anti-membrane basale (dépôts linéaires), complexes immuns (IgA, lupus, post-infectieuse). Urgence néphrologique : biopsie et traitement en quelques jours.</p></template>
<template data-pop="m31-bvas" data-title="Score BVAS"><p>Birmingham Vasculitis Activity Score : relevé pondéré des manifestations actives par organe (général, peau, muqueuses et yeux, oto-rhino-laryngé, thorax, cœur, abdomen, rein, système nerveux) au cours des 4 dernières semaines. BVAS = 0 : rémission. Utilisé dans les essais et le suivi.</p></template>
<template data-pop="m31-echo" data-title="Échographie de l’artérite à cellules géantes"><p><b>Signe du halo</b> : épaississement hypoéchogène homogène de la paroi, en coupe transversale et longitudinale. <b>Signe de compression</b> : la paroi reste visible lors de la compression de l’artère par la sonde. Explorer temporales (branches frontales et pariétales) et axillaires. Les signes régressent en quelques jours à semaines sous corticostéroïdes. Examen dépendant de l’opérateur : filières rapides en centre.</p></template>
<template data-pop="m31-d-toci" data-title="Tocilizumab"><div class="lab">Mécanisme</div><p>Anticorps anti-récepteur de l’IL-6 (soluble et membranaire).</p><div class="lab">Preuve</div><p>GiACTA (2017) : dans l’artérite à cellules géantes, rémission soutenue à 52 semaines ≈ 56 % sous tocilizumab hebdomadaire contre ≈ 14 % sous décroissance de 26 semaines de prednisone seule ; dose cumulée de corticostéroïdes réduite d’environ moitié.</p><div class="lab">Surveillance</div><p>Neutrophiles, transaminases, lipides ; CRP non utilisable ; prudence en cas de diverticulite.</p></template>
<template data-pop="m31-d-ritux" data-title="Rituximab dans les vascularites"><p>Anti-CD20 : déplétion des lymphocytes B. RAVE (2010) : non inférieur au cyclophosphamide pour l’induction, supérieur dans les rechutes. MAINRITSAN (2014) : entretien par 500 mg tous les 6 mois, moins de rechutes que l’azathioprine. Surveillance : IgG, neutrophiles, hépatite B, vaccinations.</p></template>
<template data-pop="m31-d-cyclo" data-title="Cyclophosphamide"><p>Agent alkylant. Voie intraveineuse en bolus (moins toxique que la voie orale). Doses réduites après 60 ans et en insuffisance rénale. Mesna et hydratation ; contraception et préservation de la fertilité ; surveillance de la formule sanguine 10 à 14 jours après chaque bolus ; dose cumulée limitée (risque de cancer de la vessie et d’hémopathies).</p></template>
<template data-pop="m31-d-avaco" data-title="Avacopan — actualisation européenne 2026"><p>L’avacopan bloque C5aR1. Son mécanisme biologique ne démontre pas son bénéfice clinique. Après réexamen, l’Agence européenne des médicaments juge les données d’ADVOCATE incorrectes et trompeuses, impropres à établir l’efficacité ; des atteintes hépatiques graves, parfois mortelles, ont également été signalées.</p><p>La décision européenne de révocation du 4 août 2026 s’applique dans l’Union européenne. Aucun nouveau traitement ne doit y être initié ; les patients déjà traités nécessitent une alternative et un suivi hépatique spécialisés. Cette décision ne précise pas le statut hors Union européenne.</p><p><a href="https://www.ema.europa.eu/en/medicines/human/referrals/tavneos" target="_blank" rel="noopener">Agence européenne des médicaments — Tavneos, décision et mesures de suivi, 2026</a></p></template>
<template data-pop="m31-d-kawa" data-title="Traitement de la maladie de Kawasaki"><p>Immunoglobulines intraveineuses 2 g/kg en une perfusion, idéalement avant le 10e jour, et aspirine. Non-réponse (fièvre persistante plus de 36 heures) : seconde dose d’immunoglobulines, corticostéroïdes ou infliximab. Corticostéroïdes d’emblée chez les enfants à haut risque (anomalies coronaires initiales, nourrisson). Échocardiographie au diagnostic, à 2 et 6 semaines ; suivi prolongé si anévrismes (anticoagulation pour les anévrismes géants).</p></template>
<template data-pop="pareto-m31-clin" data-title="Pareto — Classification et grands tableaux"><p class="ratio" data-cover="m31-0,m31-1,m31-2,m31-3,m31-4,m31-5,m31-6,m31-7,m31-8,m31-9"></p><ul>
<li>Chapel Hill 2012 : gros (artérite à cellules géantes, Takayasu), moyens (périartérite, Kawasaki), petits à ANCA (granulomatose avec polyangéite, polyangéite microscopique, éosinophilique), petits à complexes immuns (IgA, cryoglobulinémie, anti-membrane basale), variables (Behçet).</li>
<li>Signes d’appel : inflammation + purpura infiltré, mononévrite multiple, glomérulonéphrite, hémorragie alvéolaire, claudication, pouls absents ; éliminer l’endocardite.</li>
<li>Artérite à cellules géantes : &gt; 50 ans, céphalée, claudication de la mâchoire, hyperesthésie du cuir chevelu, CRP élevée ; risque de cécité ; traiter d’abord, biopsie ou échographie ensuite.</li>
<li>Takayasu : femme &lt; 40 ans, asymétrie tensionnelle &gt; 10 mmHg, pouls absent.</li>
<li>Anti-PR3 : granulomatose avec polyangéite (oto-rhino-laryngé, nodules excavés, rein) ; anti-MPO : polyangéite microscopique ; éosinophilique : asthme, éosinophiles, cœur.</li>
<li>Périartérite : pas de glomérulonéphrite ni d’ANCA, hépatite B, micro-anévrismes. Kawasaki : fièvre ≥ 5 jours + 4/5, coronaires.</li>
<li>IgA : purpura, arthralgies, abdomen, néphrite ; urines 6–12 mois. Cryoglobulinémie : hépatite C, C4 bas.</li></ul></template>
<template data-pop="pareto-m31-tt" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="m31-10,m31-11"></p><ul>
<li>Urgences : symptôme visuel (méthylprednisolone 250–1 000 mg × 3 jours), syndrome pneumo-rénal, ischémie mésentérique, myocardite éosinophilique, infection.</li>
<li>Artérite à cellules géantes : prednisone 40–60 mg, 15–20 mg à 2–3 mois, ≤ 5 mg à 1 an ; tocilizumab (GiACTA) ; méthotrexate ; aspirine non systématique.</li>
<li>Pseudo-polyarthrite : prednisone 12,5–25 mg.</li>
<li>ANCA : induction corticostéroïdes (schéma réduit PEXIVAS) + rituximab ou cyclophosphamide ; échanges plasmatiques si créatinine &gt; 300 µmol/L ; entretien rituximab 24–48 mois ; cotrimoxazole.</li>
<li>Kawasaki : immunoglobulines 2 g/kg + aspirine.</li></ul></template>
<template data-pop="pareto-m31-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="m31-12,m31-13"></p><ul>
<li>Suivi : activité, toxicité, infections ; ANCA ne guident pas seuls ; CRP ininterprétable sous tocilizumab.</li>
<li>Artérite à cellules géantes (ACR/EULAR 2022) : ≥ 50 ans, score ≥ 6 (biopsie ou halo +5, vitesse de sédimentation ≥ 50 ou CRP ≥ 10 +3, perte visuelle +3…).</li>
<li>Granulomatose avec polyangéite ≥ 5 ; polyangéite microscopique ≥ 5 ; éosinophilique ≥ 6.</li>
<li>Kawasaki : fièvre ≥ 5 jours + 4 des 5 critères. IgA : purpura obligatoire + 1 critère.</li></ul></template>
<template data-pop="pareto-m31-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="m31-e-1,m31-e-2,m31-e-3,m31-e-4"></p><ul>
<li>Urines chez tout suspect ; ANCA par immunoessai anti-PR3 et anti-MPO ; complément normal dans les vascularites à ANCA.</li>
<li>Cryoglobulines prélevées à 37 °C ; sérologies VHB, VHC ; hémocultures et échocardiographie si fièvre.</li>
<li>Échographie : halo et compression ; tomographie par émission de positons pour l’aorte ; angiographie : micro-anévrismes.</li>
<li>Histologie : cellules géantes (segmentaire) ; nécrose pauci-immune (ANCA) ; dépôts d’IgA ; dépôts linéaires d’IgG (anti-membrane basale).</li></ul></template>
<template data-pop="pareto-m31-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="m31-p-1,m31-p-2,m31-p-3"></p><ul>
<li>Corticostéroïdes pour tous, réduction rapide ; tocilizumab (gros vaisseaux), rituximab (ANCA), cyclophosphamide (formes graves), mépolizumab (éosinophilique).</li>
<li>Rituximab induction 375 mg/m² × 4 ou 1 g × 2 ; entretien 500 mg / 6 mois.</li>
<li>Risques : infections (cotrimoxazole, hépatite B, tuberculose), hypogammaglobulinémie, cystite et infertilité (cyclophosphamide), surveillance hépatique après exposition à l’avacopan, CRP masquée (tocilizumab).</li>
<li>Vascularites médicamenteuses : propylthiouracile, hydralazine, minocycline, cocaïne-lévamisole.</li></ul></template>
