<template data-pop="i26-espace-mort" data-title="Espace mort et retentissement droit"><p>Une unité ventilée mais peu perfusée contribue à l’espace mort. Le manque de sang ne supprime pas l’arrivée d’air. L’obstruction peut parallèlement augmenter la résistance du réseau pulmonaire.</p><p>Le ventricule droit supporte alors une charge accrue. Sa défaillance peut réduire le remplissage gauche et le débit systémique. Une saturation peu altérée ne suffit donc pas à écarter une gravité circulatoire.</p><div class="key"><b>À retenir.</b> Les échanges gazeux et la tolérance hémodynamique doivent être évalués ensemble.</div></template>
