<template data-pop="j44-pa-rv" data-title="Rapport de vraisemblance">
<div class="lab">Définition</div><p>Le rapport de vraisemblance positif d’un signe compare deux probabilités : celle de trouver le signe chez un malade et celle de le trouver chez un non-malade. Il se calcule en divisant la sensibilité par le complément de la spécificité, soit sensibilité ÷ (1 − spécificité). Un rapport de 1 signifie que le signe ne distingue pas les malades des non-malades.</p>
<div class="lab">Mode d’emploi</div><p>Le rapport ne multiplie pas la probabilité, mais la cote de la maladie, c’est-à-dire le rapport entre la probabilité d’être malade et celle de ne pas l’être. Le médecin convertit la probabilité avant l’examen en cote, la multiplie par le rapport, puis reconvertit le résultat en probabilité.</p>
<div class="lab">Exemple chiffré</div><p>Dans l’étude du signe de Hoover (Chest, 2002), 37 % des patients avaient une obstruction : la cote de départ vaut 0,37 ÷ 0,63, soit 0,59. Le signe a une sensibilité de 58 % et une spécificité de 86 % ; son rapport vaut 0,58 ÷ 0,14, soit environ 4,1, et l’étude rapporte 4,16. Un signe présent porte la cote à 0,59 × 4,16, soit 2,4, ce qui correspond à une probabilité d’environ 71 %.</p>
<div class="lab">Piège</div><p>Les rapports de plusieurs signes ne se multiplient simplement que si les signes sont indépendants, ce qui est rarement le cas. C’est pourquoi l’étude de JAMA (2000) a calculé un rapport global de 220 pour quatre éléments réunis, par un modèle qui tient compte de leurs liens.</p>
<div class="lab">Conséquence pratique</div><p>Plus un rapport s’éloigne de 1, plus il change la décision. Chez Monsieur B., l’anamnèse rend l’obstruction très probable, mais seule la spirométrie la démontre.</p></template>
<template data-pop="j44-pa-bchron" data-title="Bronchite chronique">
<div class="lab">Définition</div><p>La définition classique, rappelée par GOLD 2026, exige une toux et une expectoration pendant au moins trois mois par an, deux années de suite, en l’absence d’une autre cause. GOLD souligne que cette dernière condition est souvent oubliée : une toux productive due à des bronchectasies ou à un reflux n’est pas une bronchite chronique.</p>
<div class="lab">Fréquence</div><p>Selon GOLD 2026, la bronchite chronique touche 27 à 35 % des patients atteints de BPCO dans les grandes études d’observation. Elle est plus fréquente chez l’homme, chez le sujet plus jeune, chez le grand fumeur, en cas d’obstruction sévère, en milieu rural et en cas d’exposition professionnelle. De 4 à 22 % des bronchites chroniques s’observent chez des personnes n’ayant jamais fumé.</p>
<div class="lab">Mécanisme</div><p>Le mucus produit dans les grosses bronches provoque la toux et l’expectoration. Le même mucus, lorsqu’il obstrue les petites bronches, provoque surtout de la dyspnée.</p>
<div class="lab">Portée</div><p>Avant 50 ans, une bronchite chronique sans obstruction signale un risque futur de BPCO et de mortalité. Plus l’hypersécrétion dure, plus le VEMS baisse. Chez des fumeurs de 36 à 43 ans, la production de mucus est revenue au niveau des non-fumeurs après l’arrêt du tabac.</p>
<div class="lab">Conséquence pratique</div><p>La bronchite chronique n’est pas une BPCO sans spirométrie. Elle sert en revanche de critère au roflumilast et au dupilumab, et elle motive fortement l’arrêt du tabac.</p></template>
<template data-pop="j44-pa-activite" data-title="Activité de la maladie selon GOLD 2026">
<div class="lab">Définition</div><p>GOLD 2026 appelle activité de la maladie l’ensemble des processus biologiques qui produisent les lésions de la BPCO et qu’un traitement peut freiner. Sans traitement efficace, cette activité conduit à la progression et à des lésions définitives.</p>
<div class="lab">Indicateurs</div><p>Trois indicateurs cliniques mesurent l’activité : les exacerbations, l’aggravation chronique des symptômes et la progression, c’est-à-dire un déclin du VEMS plus rapide que la perte liée à l’âge ou une progression radiologique de l’emphysème. Parmi les biomarqueurs, seuls les éosinophiles sanguins sont validés : ils repèrent l’inflammation de type 2. GOLD souligne que d’autres biomarqueurs restent à valider.</p>
<div class="lab">Objectif</div><p>L’objectif du traitement devient une faible activité : aucune exacerbation, aucune aggravation des symptômes et aucune perte accélérée de la fonction pendant une période donnée. GOLD vise ainsi à prévenir toute exacerbation, à court comme à long terme.</p>
<div class="lab">Moyens</div><p>Les médicaments anti-inflammatoires réduisent l’activité. Certaines mesures non médicamenteuses la réduisent aussi : l’arrêt du tabac, la réhabilitation et la réduction de volume chez le patient emphysémateux distendu.</p>
<div class="lab">Conséquence pratique</div><p>Une seule exacerbation modérée ou sévère signale une maladie active. Elle justifie de revoir le traitement, même si le patient se dit peu gêné.</p></template>
<template data-pop="j44-pa-precopd" data-title="Pré-BPCO, PRISm et BPCO du sujet jeune">
<div class="lab">Pré-BPCO</div><p>GOLD 2026 appelle pré-BPCO la situation d’une personne, de tout âge, qui présente des symptômes respiratoires ou des anomalies de structure ou de fonction détectables, sans obstruction à la spirométrie. Les anomalies en cause sont par exemple un emphysème, un VEMS bas, un piégeage, une distension, une diffusion abaissée ou un déclin rapide du VEMS. Ces personnes peuvent développer une obstruction persistante, mais toutes ne le font pas.</p>
<div class="lab">PRISm</div><p>La PRISm désigne un rapport VEMS/CVF conservé, ≥ 0,70 après bronchodilatateur, avec un VEMS inférieur à 80 % de la valeur de référence. Selon GOLD 2026, sa prévalence varie de 7,1 à 11 % dans les études en population. Elle est plus fréquente chez les fumeurs et les anciens fumeurs, et elle s’associe à un indice de masse corporelle haut ou bas, au sexe féminin et à la multimorbidité. Elle augmente le risque de symptômes, de maladie cardiopulmonaire, d’hospitalisation et de décès toutes causes et cardiovasculaire. Environ 20 à 30 % des personnes concernées évoluent vers une obstruction.</p>
<div class="lab">BPCO du sujet jeune</div><p>GOLD 2026 propose d’appeler ainsi une BPCO chez un patient de 20 à 50 ans, puisque la fonction respiratoire culmine vers 20 à 25 ans. Ces patients n’ont parfois jamais atteint une fonction normale. Une BPCO jeune n’est pas forcément légère, et elle est souvent ni diagnostiquée ni traitée.</p>
<div class="lab">Termes à éviter</div><p>GOLD réserve le terme « précoce » aux premiers mécanismes biologiques étudiés en recherche. Le terme « légère » ne décrit que la sévérité spirométrique, et non l’ancienneté de la maladie.</p>
<div class="lab">Conséquence pratique</div><p>GOLD considère ces personnes comme des patients qui méritent des soins, même si le meilleur traitement n’est pas encore connu au-delà de l’arrêt du tabac. Le médecin supprime les expositions, traite les facteurs de risque et répète la spirométrie.</p></template>
<template data-pop="j44-pa-etiotypes" data-title="Étiotypes de la BPCO (GOLD 2026)">
<div class="lab">Principe</div><p>La BPCO a longtemps été considérée comme une maladie unique causée par le tabac. GOLD 2026 propose une classification par causes, appelées étiotypes, pour étudier séparément les BPCO qui ne sont pas liées au tabac.</p>
<div class="lab">Les étiotypes</div><p>La forme génétique comprend le déficit en alpha-1 antitrypsine et d’autres variants de moindre effet. La forme liée à un développement pulmonaire anormal découle d’événements précoces, comme la prématurité et le petit poids de naissance. La forme environnementale liée au tabac inclut le tabagisme actif, passif ou pendant la vie fœtale, le vapotage et le cannabis. La forme environnementale liée à la biomasse et à la pollution inclut la pollution domestique et ambiante, les fumées d’incendie et les expositions professionnelles. La forme post-infectieuse fait suite aux infections de l’enfance, à la tuberculose ou au VIH. La BPCO associée à l’asthme concerne surtout l’asthme de l’enfance. Reste enfin la BPCO de cause inconnue.</p>
<div class="lab">Portée</div><p>Selon GOLD, cette classification change encore peu la pratique. Elle rappelle surtout que les traitements actuels ont été étudiés presque uniquement chez des fumeurs.</p>
<div class="lab">Conséquence pratique</div><p>Devant une BPCO, le médecin recherche toutes les causes possibles, même chez un fumeur, car plusieurs étiotypes peuvent coexister.</p></template>
<template data-pop="j44-pa-sapaldia" data-title="Cohorte suisse SAPALDIA">
<div class="lab">Méthode</div><p>L’étude publiée en 2010 dans l’European Respiratory Journal a mesuré la fonction respiratoire et les symptômes de 6 126 adultes de la cohorte suisse sur la pollution de l’air et les maladies pulmonaires (SAPALDIA). L’obstruction y était définie par un rapport VEMS/CVF inférieur à la limite inférieure de la normale, et sa sévérité graduée selon GOLD.</p>
<div class="lab">Résultats</div><p>La prévalence de l’obstruction allait de 2,5 % entre 30 et 39 ans à 8,0 % à partir de 70 ans. En analyse multivariée, l’âge de 70 ans et plus (rapport de cotes 2,8), le tabagisme (1,8) et l’asthme (6,7) étaient associés à l’obstruction. Les personnes n’ayant jamais fumé représentaient 29,3 % des sujets obstrués ; elles étaient plus jeunes, plus souvent des hommes et plus souvent asthmatiques.</p>
<div class="lab">Portée</div><p>Les auteurs concluent que la prévalence suisse est comparable à celle des autres pays développés, mais que la part des non-fumeurs y est plus élevée qu’ailleurs. Les obstructions des non-fumeurs entraînaient les mêmes symptômes et la même altération de la qualité de vie.</p>
<div class="lab">Limites</div><p>La définition par la limite inférieure de la normale donne des chiffres plus bas que le seuil fixe de 0,70. Ces résultats mesurent l’obstruction, non le diagnostic médical.</p></template>
<template data-pop="j44-pa-marche6" data-title="Test de marche de 6 minutes">
<div class="lab">Principe</div><p>Le patient marche le plus loin possible pendant six minutes, à son propre rythme, dans un couloir plat. La distance mesure la capacité d’effort fonctionnelle, proche des activités de la vie quotidienne.</p>
<div class="lab">Technique</div><p>Selon GOLD 2026, la longueur du parcours influence nettement la distance : les équations de référence établies pour un couloir de 30 mètres ne s’appliquent pas à un parcours plus court. Le médecin mesure aussi la saturation et la dyspnée pendant et après le test.</p>
<div class="lab">Valeur</div><p>La distance prédit la survie et sert à évaluer l’effet de la réhabilitation. Dans l’indice BODE, une distance de 350 m ou plus vaut 0 point, de 250 à 349 m 1 point, de 150 à 249 m 2 points, et de 149 m ou moins 3 points. Le test révèle aussi une désaturation d’effort que la mesure au repos ignore.</p>
<div class="lab">Piège</div><p>Certains patients déclarent peu de symptômes malgré une obstruction sévère, parce qu’ils ont réduit leurs efforts. Le test de marche montre alors une limitation que l’interrogatoire n’avait pas révélée.</p>
<div class="lab">Conséquence pratique</div><p>Le test sert au pronostic, à l’indication de la réhabilitation et à l’évaluation avant un voyage en avion.</p></template>
<template data-pop="j44-pa-old" data-title="Oxygénothérapie de longue durée">
<div class="lab">Indications (GOLD 2026)</div><p>L’oxygène de longue durée est indiqué en état stable, après confirmation à deux reprises sur une période de trois semaines, si la PaO₂ est ≤ 55 mmHg (7,3 kPa) ou la SaO₂ ≤ 88 %. Il l’est aussi si la PaO₂ se situe entre 55 et 60 mmHg (7,3 à 8,0 kPa), ou la SaO₂ à 88 %, avec une complication. Cette complication est une hypertension pulmonaire, des œdèmes évoquant une insuffisance cardiaque congestive ou une polyglobulie (hématocrite supérieur à 55 %).</p>
<div class="lab">Mécanisme</div><p>L’oxygène lève la vasoconstriction hypoxique permanente et freine le stimulus de l’érythropoïétine. Il ralentit ainsi l’hypertension pulmonaire, la défaillance du cœur droit et la polyglobulie.</p>
<div class="lab">Preuves</div><p>Selon GOLD 2026, deux essais du début des années 1980 ont montré un bénéfice de survie chez des patients très hypoxémiques. Dans NOTT, les patients sous oxygène continu recevaient en réalité au moins 19 heures par jour, contre au plus 13 heures dans le groupe nocturne. L’essai du Medical Research Council comparait au moins 15 heures par jour à l’absence d’oxygène. L’essai LOTT (2016) n’a montré aucun bénéfice dans la désaturation modérée.</p>
<div class="lab">Durée</div><p>La durée dépasse 15 heures par jour. Chez l’hypoxémique sévère, 24 heures par jour n’ont pas fait mieux que 15 heures sur l’hospitalisation ou le décès à un an.</p>
<div class="lab">Piège</div><p>Une mesure faite juste après une exacerbation surestime le besoin. Le tabagisme actif expose à des brûlures et à des incendies.</p></template>
<template data-pop="j44-pa-vnidom" data-title="Ventilation non invasive à domicile">
<div class="lab">Principe</div><p>Une ventilation nocturne au masque met au repos les muscles respiratoires et abaisse la PaCO₂. Elle vise les patients dont l’hypercapnie persiste après la phase aiguë.</p>
<div class="lab">Essai HOT-HMV</div><p>Dans cet essai de 116 patients (JAMA, 2017), la PaCO₂ restait supérieure à 53 mmHg 2 à 4 semaines après la résolution d’une acidose. L’ajout de la VNI à l’oxygène a prolongé le délai jusqu’à réadmission ou décès : médiane de 4,3 contre 1,4 mois, rapport de risques 0,49. Les décès, 16 contre 19, ne différaient pas significativement.</p>
<div class="lab">Essai allemand et autrichien</div><p>Un essai a inclus 195 patients stables de grade 4, avec une PaCO₂ ≥ 7 kPa (51,9 mmHg) et un pH supérieur à 7,35 (Lancet Respiratory Medicine, 2014). La VNI y était réglée pour abaisser la PaCO₂ d’au moins 20 % ou au-dessous de 6,5 kPa. La mortalité à un an a baissé de 33 à 12 % (rapport de risques 0,24, intervalle de confiance à 95 % : 0,11 à 0,49). Une irritation cutanée du visage est survenue chez 14 % des patients.</p>
<div class="lab">Recommandation</div><p>Selon GOLD 2026, les essais qui ont montré un effet sur la mortalité recrutaient des patients très hypercapniques et employaient des pressions inspiratoires élevées. GOLD retient la VNI au long cours chez des patients sélectionnés après une hospitalisation récente, surtout si la PaCO₂ diurne reste supérieure à 53 mmHg (niveau de preuve B).</p>
<div class="lab">Conséquence pratique</div><p>Le médecin contrôle la gazométrie 2 à 4 semaines après une exacerbation acidosique, recherche une apnée du sommeil et adresse le patient hypercapnique à un centre spécialisé.</p></template>
<template data-pop="j44-pa-reduc" data-title="Réduction de volume et transplantation">
<div class="lab">Principe</div><p>Dans l’emphysème sévère, les zones les plus détruites se distendent et compriment le poumon encore fonctionnel. Les réduire améliore la rétraction élastique, la mécanique thoracique, le travail des muscles respiratoires et la fonction cardiaque.</p>
<div class="lab">Valves endobronchiques</div><p>Les valves unidirectionnelles laissent sortir l’air du lobe traité sans le laisser entrer : le lobe s’affaisse. Selon GOLD 2026, elles améliorent le VEMS, la distance de marche et l’état de santé chez les patients sans ventilation collatérale, c’est-à-dire aux scissures intactes. Elles conviennent surtout à un VEMS de 15 à 45 % avec une distension marquée. Un pneumothorax survient chez 26,6 % des patients traités, dans 76 % des cas dans les 72 heures.</p>
<div class="lab">Chirurgie</div><p>Dans le grand essai américain de chirurgie de réduction de volume, l’intervention a prolongé la survie dans l’emphysème des lobes supérieurs avec une faible capacité d’effort après réhabilitation. Elle a augmenté la mortalité quand le VEMS était ≤ 20 % avec un emphysème homogène ou une diffusion ≤ 20 %. Une bulle géante, qui occupe plus d’un tiers d’un hémithorax, peut être réséquée.</p>
<div class="lab">Transplantation</div><p>Faute d’essai randomisé, le bénéfice est estimé sur des données d’observation : selon GOLD 2026, 40 % des patients transplantés pour une BPCO en retirent un bénéfice de survie attendu à deux ans.</p>
<div class="lab">Conséquence pratique</div><p>La sélection repose sur la tomodensitométrie, la pléthysmographie et une équipe multidisciplinaire. Le médecin adresse le patient très distendu malgré un traitement optimal.</p></template>
<template data-pop="j44-pa-petitesva" data-title="Petites voies aériennes">
<div class="lab">Définition</div><p>Les petites voies aériennes sont les bronchioles de moins de 2 mm de diamètre. Elles n’ont pas de cartilage et restent ouvertes grâce aux attaches alvéolaires et à la rétraction élastique.</p>
<div class="lab">Zone silencieuse</div><p>Leur nombre est considérable et leur section totale immense : chez le sujet sain, elles contribuent peu à la résistance totale. Une atteinte étendue peut donc exister sans VEMS abaissé ni symptôme.</p>
<div class="lab">Lésions</div><p>Sur 159 pièces opératoires, la progression de la maladie s’accompagnait d’un épaississement de la paroi, d’exsudats muqueux dans la lumière et d’une infiltration inflammatoire croissante (New England Journal of Medicine, 2004). Sur des poumons explantés de grade 4, le nombre de bronchioles terminales était réduit de 72 à 89 %, et leur section totale de 81 à 99,7 % (New England Journal of Medicine, 2011). Cette perte précédait la destruction emphysémateuse.</p>
<div class="lab">Mesure</div><p>La spirométrie détecte tard l’atteinte des petites voies aériennes. Selon GOLD 2026, la comparaison de scanners en inspiration et en expiration repère le piégeage non emphysémateux, et une anomalie des petites voies aériennes peut exister sans obstruction mesurable.</p>
<div class="lab">Conséquence pratique</div><p>Une spirométrie normale chez un fumeur symptomatique n’exclut pas une atteinte débutante. L’arrêt du tabac reste la mesure qui protège ces bronchioles.</p></template>
<template data-pop="j44-pa-mucus" data-title="Mucus et bouchons muqueux">
<div class="lab">Mécanisme</div><p>La fumée et l’inflammation multiplient les cellules à mucus et hypertrophient les glandes bronchiques. Le mucus devient abondant et visqueux, et la clairance mucociliaire ralentit.</p>
<div class="lab">Selon le siège</div><p>Selon GOLD 2026, le mucus des grosses bronches provoque la toux et l’expectoration. Le mucus des petites bronches les obstrue : il provoque surtout de la dyspnée, avec peu de toux.</p>
<div class="lab">Bouchons au scanner</div><p>Les bouchons muqueux visibles en tomodensitométrie sont associés à une obstruction plus sévère, à une saturation plus basse, à une moindre tolérance à l’effort, à plus d’exacerbations et à une mortalité accrue. Ils s’associent aussi à des éosinophiles élevés, ce qui suggère un lien avec l’inflammation de type 2. Leur cotation systématique n’est pas encore réalisée en routine.</p>
<div class="lab">Piège</div><p>Des bouchons peuvent exister sans toux ni expectoration. L’absence de bronchite chronique ne garantit donc pas l’absence de mucus.</p>
<div class="lab">Conséquence pratique</div><p>L’arrêt du tabac réduit l’hypersécrétion. Les techniques de désencombrement et certains mucolytiques aident les patients qui évacuent mal leurs sécrétions.</p></template>
<template data-pop="j44-pa-vq" data-title="Inégalités ventilation-perfusion">
<div class="lab">Le poumon normal</div><p>Chez le sujet sain, chaque région reçoit une ventilation adaptée à son débit sanguin. Si une alvéole manque d’oxygène, son artériole se contracte et détourne le sang vers les zones bien ventilées.</p>
<div class="lab">Dans la BPCO</div><p>Les bronches obstruées créent des zones perfusées mais mal ventilées : le sang y passe sans s’oxygéner, ce qui produit l’hypoxémie. L’emphysème crée des zones ventilées mais mal perfusées : cette ventilation est gaspillée et ne sert pas à éliminer le dioxyde de carbone. Selon GOLD 2026, ces inégalités sont le mécanisme principal des troubles des échanges gazeux.</p>
<div class="lab">Hypercapnie</div><p>La PaCO₂ monte lorsque la ventilation utile ne suffit plus. La ventilation gaspillée, la respiration rapide et superficielle et la fatigue musculaire y conduisent. Plus rarement, les sédatifs et les hypnotiques réduisent la commande respiratoire.</p>
<div class="lab">Effet de l’oxygène</div><p>Chez l’hypercapnique, un excès d’oxygène lève la vasoconstriction hypoxique : le sang revient vers des zones mal ventilées, et la ventilation gaspillée augmente. L’oxygène réduit aussi le transport du dioxyde de carbone par l’hémoglobine (effet Haldane). La PaCO₂ monte, d’où la cible de 88 à 92 %.</p>
<div class="lab">Compensation</div><p>Lorsque l’hypercapnie s’installe lentement, le rein retient des bicarbonates et le pH se normalise. Des bicarbonates élevés signalent donc une hypercapnie ancienne.</p></template>
<template data-pop="j44-pa-htp" data-title="Hypertension pulmonaire et cœur pulmonaire chronique">
<div class="lab">Définition</div><p>Selon GOLD 2026, l’hypertension pulmonaire se définit par une pression artérielle pulmonaire moyenne supérieure à 20 mmHg au cathétérisme cardiaque droit. Les recommandations européennes de cardiologie et de pneumologie de 2022 définissent l’hypertension pulmonaire sévère associée à la BPCO par des résistances vasculaires pulmonaires supérieures à 5 unités Wood.</p>
<div class="lab">Fréquence et mécanisme</div><p>Une élévation légère concerne 25 à 30 % des patients, et une forme sévère environ 5 %. La vasoconstriction hypoxique, la perte du lit capillaire et le remodelage artériel en sont les causes. Le ventricule droit s’hypertrophie, puis il défaille : c’est le cœur pulmonaire chronique.</p>
<div class="lab">Phénotype vasculaire</div><p>Certains patients ont une hypertension pulmonaire sévère avec une obstruction seulement légère à modérée, peu ou pas d’hypercapnie, une diffusion très basse (inférieure à 45 %) et une limitation d’effort d’origine circulatoire. GOLD parle alors de phénotype vasculaire.</p>
<div class="lab">Diagnostic</div><p>L’échocardiographie est le meilleur outil non invasif. Un NT-proBNP élevé et un rapport élevé entre le diamètre de l’artère pulmonaire et celui de l’aorte au scanner orientent aussi. Une maladie thromboembolique chronique, traitable, doit être recherchée.</p>
<div class="lab">Conduite</div><p>Le patient est adressé à un centre spécialisé pour un cathétérisme droit. L’oxygène de longue durée est indiqué en cas d’hypoxémie. Les traitements de l’hypertension artérielle pulmonaire ne sont pas recommandés dans les formes non sévères.</p></template>
<template data-pop="j44-pa-systemique" data-title="Dysfonction musculaire et atteinte systémique">
<div class="lab">Mécanisme</div><p>Selon GOLD 2026, la dysfonction des muscles squelettiques associe une sarcopénie, c’est-à-dire une perte de fibres, et un fonctionnement anormal des fibres restantes. L’inactivité, une alimentation insuffisante, l’inflammation systémique et l’hypoxie y contribuent.</p>
<div class="lab">Conséquences</div><p>Les muscles fatigués limitent l’effort indépendamment du poumon, et un faible indice de masse corporelle, surtout avec une masse maigre basse, s’associe à une évolution défavorable. GOLD décrit aussi une perte tissulaire multiple, qui associe emphysème, maigreur, ostéoporose et sarcopénie ; elle s’accompagne de plus d’exacerbations, d’hospitalisations et de décès.</p>
<div class="lab">Réversibilité</div><p>La dysfonction musculaire est une cause modifiable d’intolérance à l’effort : la réhabilitation l’améliore. Chez le patient dénutri, une supplémentation nutritionnelle augmente le poids, la force des muscles respiratoires et la qualité de vie.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin pèse le patient à chaque visite, recherche une fonte musculaire et propose la réhabilitation et un soutien nutritionnel.</p></template>
<template data-pop="j44-pa-daat" data-title="Déficit en alpha-1 antitrypsine : dépistage et conduite">
<div class="lab">Patients à tester</div><p>GOLD 2026 recommande de rechercher le déficit chez tout patient atteint de BPCO. Le tableau classique est celui d’un patient jeune, de moins de 45 ans, avec un emphysème panlobulaire des bases. Des diagnostics tardifs concernent pourtant des patients plus âgés, porteurs d’un emphysème centrolobulaire des sommets.</p>
<div class="lab">Fréquence</div><p>Selon GOLD 2026, une revue de 20 études européennes a trouvé le génotype PiZZ chez 0,12 % des patients atteints de BPCO (0,08 à 0,24 %). Le déficit est rare, mais ses conséquences familiales et thérapeutiques justifient le dépistage systématique.</p>
<div class="lab">Interprétation</div><p>Une concentration inférieure à 20 % de la normale évoque fortement un déficit homozygote. Le diagnostic se confirme par le phénotype ou le génotype. Les porteurs PiMZ n’ont pas de risque accru s’ils ne fument pas ; s’ils fument, leur fonction est plus basse que celle de leurs frères et sœurs de génotype normal.</p>
<div class="lab">Conduite</div><p>Les apparentés sont testés, et le patient comme sa famille sont adressés à un centre spécialisé. L’arrêt du tabac est impératif. Un traitement substitutif intraveineux se discute chez le patient PiZZ qui ne fume pas, avec un VEMS de 35 à 60 % ; il n’est pas indiqué chez le porteur PiMZ.</p>
<div class="lab">Piège</div><p>L’alpha-1 antitrypsine augmente pendant une inflammation : une valeur normale mesurée pendant une infection peut masquer un déficit modéré.</p></template>
<template data-pop="j44-pa-larynx" data-title="Hauteur laryngée">
<div class="lab">Définition</div><p>La hauteur laryngée, ou longueur de trachée extrathoracique, est la distance entre le sommet du cartilage thyroïde et la fourchette sternale. Elle s’exprime en centimètres.</p>
<div class="lab">Mécanisme</div><p>Dans la distension, le sternum et les clavicules remontent avec le thorax. La contraction forte d’un diaphragme aplati tire aussi la trachée vers le bas. Les deux mécanismes rapprochent le larynx du sternum.</p>
<div class="lab">Valeur</div><p>Dans une étude de 309 patients (JAMA, 2000), une hauteur laryngée maximale de 4 cm ou moins avait un rapport de vraisemblance de 2,8 pour une obstruction, et elle restait significative en analyse multivariée. Associée à plus de 40 paquets-années, à un antécédent déclaré de maladie obstructive et à un âge d’au moins 45 ans, elle faisait partie d’un modèle au rapport global de 220.</p>
<div class="lab">Piège</div><p>La mesure exige un repérage précis des deux repères osseux et cartilagineux. Un signe isolé ne pose jamais le diagnostic.</p>
<div class="lab">Conséquence pratique</div><p>Une hauteur laryngée courte chez un fumeur renforce l’indication de la spirométrie.</p></template>
<template data-pop="j44-pa-bd" data-title="Test de bronchodilatation et qualité de la spirométrie">
<div class="lab">Doses et délais</div><p>Selon GOLD 2026, le test utilise 400 µg d’un bêta-2 agoniste de courte durée, 160 µg d’un antimuscarinique de courte durée, ou les deux. Le VEMS se mesure 10 à 15 minutes après le bêta-2 agoniste, ou 30 à 45 minutes après l’antimuscarinique ou l’association.</p>
<div class="lab">But</div><p>Dans la BPCO, le test sert à mesurer la part persistante de l’obstruction. Selon GOLD 2026, la réponse au bronchodilatateur ne distingue ni l’asthme de la BPCO, ni leur association.</p>
<div class="lab">Qualité</div><p>La pause entre l’inspiration et l’expiration dure moins d’une seconde. L’enregistrement se prolonge jusqu’à un plateau de volume, ce qui peut demander plus de 15 secondes dans une maladie sévère. Le VEMS et la CVF retenus sont les plus grandes valeurs de trois courbes techniquement satisfaisantes, qui ne diffèrent pas de plus de 5 % ou de 150 mL. Le rapport se calcule sur la courbe dont la somme du VEMS et de la CVF est la plus grande.</p>
<div class="lab">Piège</div><p>Un effort insuffisant sous-estime les valeurs et fausse le diagnostic. Pour une spirométrie de suivi, le patient n’interrompt pas son traitement bronchodilatateur.</p>
<div class="lab">Conséquence pratique</div><p>Un rapport VEMS/CVF inférieur à 0,70 après bronchodilatateur confirme une obstruction qui ne se corrige pas complètement.</p></template>
<template data-pop="j44-pa-icdiff" data-title="Insuffisance cardiaque ou BPCO">
<div class="lab">Pourquoi la confusion</div><p>Les deux maladies partagent le tabac, l’âge et la dyspnée d’effort. Selon GOLD 2026, une insuffisance cardiaque touche 20 à 30 % des patients atteints de BPCO, avec une incidence annuelle de 3 à 4 %, et elle est souvent méconnue. Les formes à fraction d’éjection réduite et préservée ont une fréquence voisine, environ 10 % chacune.</p>
<div class="lab">Arguments cliniques</div><p>L’orthopnée, la dyspnée nocturne, les crépitants et une prise de poids rapide orientent vers le cœur. Selon la figure 2.3 de GOLD 2026, la radiographie de l’insuffisance cardiaque montre un cœur dilaté et un œdème pulmonaire, et les épreuves fonctionnelles une restriction des volumes plutôt qu’une obstruction.</p>
<div class="lab">Examens</div><p>Les peptides natriurétiques se dosent en cas de suspicion, puis l’échocardiographie confirme si le résultat est anormal. Chez le patient BPCO, leur valeur prédictive négative est bonne (0,80 à 0,98), en état stable comme en exacerbation ; leur valeur prédictive positive est plus faible que dans la population générale.</p>
<div class="lab">Piège</div><p>Les deux maladies coexistent souvent : découvrir l’une n’exclut pas l’autre. Une congestion pulmonaire peut aussi modifier les débits : c’est une raison supplémentaire de mesurer la spirométrie en état stable.</p>
<div class="lab">Conséquence pratique</div><p>L’insuffisance cardiaque se traite selon les recommandations cardiologiques, bêtabloquant β1-sélectif compris.</p></template>
<template data-pop="j44-pa-rome" data-title="Classification de Rome des exacerbations">
<div class="lab">Principe</div><p>Proposée en 2021 et adoptée par GOLD 2026, la classification de Rome mesure la sévérité d’une exacerbation au lit du patient, avec des variables simples, au lieu de la déduire après coup du traitement reçu.</p>
<div class="lab">Variables</div><p>Elle utilise la dyspnée sur une échelle visuelle de 0 à 10, la fréquence respiratoire, la fréquence cardiaque, la saturation au repos et la CRP. L’exacerbation est légère si la dyspnée est inférieure à 5 et la fréquence respiratoire inférieure à 24/min. Elle exige aussi une fréquence cardiaque inférieure à 95/min, une saturation ≥ 92 % avec une baisse ≤ 3 % et une CRP inférieure à 10 mg/L. Elle devient modérée si trois de ces cinq critères dépassent leur seuil. Elle est sévère si, en plus, les gaz du sang montrent une PaO₂ ≤ 60 mmHg et/ou une PaCO₂ supérieure à 45 mmHg avec un pH inférieur à 7,35.</p>
<div class="lab">À l’hôpital</div><p>GOLD 2026 distingue aussi l’absence d’insuffisance respiratoire, l’insuffisance respiratoire et l’insuffisance ventilatoire. Cette dernière associe une altération aiguë de l’état mental et une hypoxémie non corrigée par un masque de Venturi, ou qui nécessite une fraction inspirée en oxygène supérieure à 40 %. Elle comporte aussi une PaCO₂ supérieure à 60 mmHg ou augmentée par rapport à la valeur de base, et une acidose (pH ≤ 7,25).</p>
<div class="lab">Valeur</div><p>Dans les études citées par GOLD, la classification de Rome range 15 à 30 % des patients hospitalisés dans la forme légère, environ 50 % dans la forme modérée et près de 10 % dans la forme sévère. Sa sévérité est corrélée au recours aux soins intensifs et à la mortalité. Une validation prospective reste attendue.</p></template>
<template data-pop="j44-pa-cortico" data-title="Corticothérapie systémique de l’exacerbation">
<div class="lab">Dose et durée</div><p>GOLD 2026 recommande l’équivalent de 40 mg de prednisone par jour pendant 5 jours dans une exacerbation modérée ou sévère (niveau de preuve A). La voie orale est aussi efficace que la voie intraveineuse. Le budésonide nébulisé peut être une alternative chez certains patients.</p>
<div class="lab">Bénéfices</div><p>Le corticostéroïde raccourcit la récupération, améliore le VEMS et l’oxygénation, et réduit la rechute précoce, l’échec du traitement et la durée d’hospitalisation.</p>
<div class="lab">Essai REDUCE</div><p>Cet essai suisse de 2013 a inclus 314 patients dans cinq hôpitaux universitaires. Cinq jours de prednisone n’ont pas été inférieurs à quatorze jours sur le délai avant nouvelle exacerbation à 180 jours, avec une dose cumulée de 379 contre 793 mg.</p>
<div class="lab">Risques</div><p>Selon GOLD 2026, même une cure courte est associée à un risque accru de pneumonie, de sepsis et de décès. Des cures plus longues sont associées, dans une étude d’observation, à davantage de pneumonies et de décès. La glycémie se déséquilibre chez le diabétique, et les cures répétées favorisent l’ostéoporose.</p>
<div class="lab">Éosinophiles</div><p>L’efficacité paraît plus grande quand les éosinophiles sont élevés. Un essai en soins primaires suggère qu’on peut éviter la prednisone chez certains patients aux éosinophiles bas, mais GOLD attend des études chez l’hospitalisé avant d’en faire un critère.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin prescrit 40 mg pendant 5 jours et réserve la corticothérapie aux exacerbations significatives. Aucun corticostéroïde oral ne se donne en traitement de fond.</p></template>
<template data-pop="j44-pa-atb" data-title="Antibiothérapie de l’exacerbation">
<div class="lab">Indications (GOLD 2026)</div><p>L’antibiotique est indiqué en présence d’au moins deux symptômes parmi l’aggravation de la dyspnée, la fièvre, l’augmentation du volume et l’augmentation de la purulence de l’expectoration, à condition que la purulence en fasse partie. Il l’est aussi après une culture positive lors d’une exacerbation antérieure, et chez tout patient qui nécessite une ventilation invasive ou non invasive (niveau de preuve A).</p>
<div class="lab">Fondement</div><p>L’essai historique d’Anthonisen (1987) définissait l’exacerbation par l’aggravation de la dyspnée, du volume et de la purulence de l’expectoration. Sur 362 exacerbations chez 173 patients, le succès atteignait 68 % sous antibiotique contre 55 % sous placebo, et la détérioration 10 % contre 19 %. Selon GOLD 2026, la purulence a une sensibilité de 94,4 % et une spécificité de 52 % pour une charge bactérienne élevée.</p>
<div class="lab">Selon la gravité</div><p>Une revue Cochrane montre un bénéfice net en soins intensifs, sur la mortalité et l’échec du traitement. En ambulatoire, l’ajout de doxycycline à un corticostéroïde oral n’a pas prolongé le délai avant l’exacerbation suivante. Un dosage rapide de la CRP au cabinet a réduit les prescriptions sans nuire aux patients. GOLD ne recommande pas les protocoles fondés sur la procalcitonine.</p>
<div class="lab">Choix et durée</div><p>Le traitement empirique repose sur une aminopénicilline avec acide clavulanique, un macrolide, une tétracycline ou, chez certains patients, une quinolone, selon les résistances locales. La durée recommandée est de 5 jours (niveau de preuve B). Une culture de l’expectoration se fait chez l’exacerbateur fréquent, en cas d’obstruction sévère ou de ventilation, à la recherche de <i>Pseudomonas</i> ou de germes résistants.</p></template>
<template data-pop="j44-pa-o2" data-title="Oxygène contrôlé en exacerbation">
<div class="lab">Cible</div><p>La cible de saturation est de 88 à 92 % chez le patient BPCO en exacerbation. Elle est celle de la British Thoracic Society (2016 et 2017) et de GOLD jusqu’à l’édition 2025.</p>
<div class="lab">Pourquoi</div><p>Un excès d’oxygène aggrave les inégalités ventilation-perfusion, en levant la vasoconstriction hypoxique, et réduit le transport du dioxyde de carbone par l’hémoglobine (effet Haldane). La PaCO₂ monte, le pH baisse et la conscience peut s’altérer.</p>
<div class="lab">Surveillance</div><p>Le médecin contrôle les gaz du sang 30 à 60 minutes après le début de l’oxygène ou après toute modification du débit. Selon GOLD 2026, la gazométrie artérielle reste l’examen de référence dans les formes graves ; une gazométrie veineuse ou une capnographie transcutanée peuvent aider dans les formes moins graves.</p>
<div class="lab">Pièges</div><p>L’oxymètre est moins précis chez les personnes à peau foncée. Un nébuliseur alimenté à l’oxygène délivre un débit élevé : chez l’hypercapnique, il se branche sur l’air, et l’oxygène continue par lunettes.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin titre l’oxygène, contrôle la gazométrie et ne corrige jamais une saturation basse en augmentant le débit sans mesurer la PaCO₂.</p></template>
<template data-pop="j44-pa-onhd" data-title="Oxygénothérapie nasale à haut débit">
<div class="lab">Principe</div><p>Des lunettes spéciales délivrent un mélange d’air et d’oxygène chauffé et humidifié, de 10 à 60 L/min. Selon GOLD 2026, des études d’observation montrent une baisse de la fréquence et de l’effort respiratoires, une réduction de l’hypercapnie et une meilleure synchronie entre le thorax et l’abdomen.</p>
<div class="lab">Place</div><p>GOLD 2026 en fait le premier support de l’insuffisance respiratoire aiguë hypoxémique. En cas d’hypercapnie, ou si elle échoue, la VNI est préférée, sauf contre-indication absolue. Les recommandations de l’European Respiratory Society préfèrent aussi la VNI dans l’insuffisance respiratoire hypercapnique et après l’extubation d’un patient à haut risque.</p>
<div class="lab">Preuves</div><p>Dans un essai multicentrique, le haut débit n’était pas inférieur à la VNI pour abaisser la PaCO₂, mais environ 30 % des patients sont passés à la VNI à 6 heures faute d’amélioration. À domicile, le haut débit ajouté à l’oxygène de longue durée a réduit les exacerbations chez des patients sélectionnés, sans effet sur la mortalité.</p>
<div class="lab">Conséquence pratique</div><p>Le haut débit convient au patient hypoxémique sans acidose ; l’acidose hypercapnique appelle la VNI.</p></template>
<template data-pop="j44-pa-tabac" data-title="Accompagnement de l’arrêt du tabac">
<div class="lab">Importance de l’arrêt</div><p>L’arrêt du tabac est la seule mesure qui supprime la cause et qui allonge la survie. Selon GOLD 2026, il est plus difficile chez le fumeur atteint de BPCO, dont la dépendance est plus forte, le sentiment d’efficacité personnelle plus faible et la dépression plus fréquente.</p>
<div class="lab">Méthode en cinq étapes</div><p>GOLD 2026 propose une intervention brève en cinq temps. Le médecin demande le statut tabagique à chaque visite et conseille fermement l’arrêt. Il évalue la motivation à arrêter dans les 30 jours, puis il aide par un plan d’arrêt, un conseil pratique et un médicament. Il organise enfin le suivi en consultation ou par téléphone.</p>
<div class="lab">Dépendance</div><p>Une cigarette dans les 30 minutes après le réveil, une consommation nocturne ou 20 cigarettes par jour ou plus signalent une forte dépendance. Un score de Fagerström de 7 à 10 ou un indice de sévérité du tabagisme de 5 à 6 la signalent aussi. Le traitement s’adapte à ce niveau.</p>
<div class="lab">Efficacité</div><p>Même un conseil de trois minutes augmente le taux d’arrêt. Dans une étude citée par GOLD, l’abstinence continue à un an atteignait 1,4 % avec les soins habituels et 2,6 % avec un conseil minimal. Elle atteignait 6 % avec un conseil intensif et 12,3 % avec un conseil intensif et un médicament. Des taux d’arrêt à long terme de 14 à 27 % sont rapportés lorsque les moyens nécessaires sont engagés.</p>
<div class="lab">Piège</div><p>La rechute est fréquente et traduit la nature chronique de la dépendance ; elle ne constitue pas un échec du patient ni du médecin. Selon GOLD 2026, aucune donnée ne soutient l’efficacité et la sécurité de la cigarette électronique comme aide au sevrage.</p></template>
<template data-pop="j44-pa-vaccins" data-title="Vaccinations dans la BPCO en Suisse">
<div class="lab">Rôle des vaccins</div><p>Les infections respiratoires déclenchent la majorité des exacerbations. Selon GOLD 2026, les vaccins contre la grippe, les pneumocoques et le virus respiratoire syncytial réduisent l’incidence des infections respiratoires basses, et les vaccins contre la COVID-19 sont très efficaces contre l’infection.</p>
<div class="lab">Plan suisse 2026</div><p>Le Plan de vaccination suisse 2026 retient pour la BPCO la vaccination annuelle contre la grippe. Il retient aussi les vaccinations contre la COVID-19, les pneumocoques et le zona selon le stade de la maladie.</p>
<div class="lab">Virus respiratoire syncytial</div><p>La recommandation 2026 de l’Office fédéral de la santé publique prévoit une dose pour toute personne dès 75 ans. Elle la prévoit aussi de 65 à 74 ans en cas de BPCO GOLD 2 et de 18 à 64 ans en cas de BPCO GOLD 3. Dans ces deux tranches d’âge, la dose est recommandée dès GOLD 1 si les exacerbations sont fréquentes.</p>
<div class="lab">Coqueluche</div><p>GOLD 2026 rapporte que les comités de vaccination recommandent le vaccin combiné contre la coqueluche, le tétanos et la diphtérie chez la personne atteinte de BPCO non vaccinée à l’adolescence. Le Plan suisse prévoit un rappel à 25 ans. Quel que soit l’âge, il prévoit aussi un rappel lors de contacts réguliers avec des nourrissons de moins de 6 mois, si la dernière dose remonte à 10 ans ou plus.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin vérifie le carnet de vaccination à chaque automne et après chaque hospitalisation.</p></template>
<template data-pop="j44-pa-plan" data-title="Plan d’action écrit">
<div class="lab">Contenu</div><p>Le plan d’action décrit les signes qui annoncent une exacerbation : dyspnée inhabituelle, expectoration plus abondante ou purulente, fièvre. Il indique les premières mesures, le moment où consulter et les coordonnées utiles.</p>
<div class="lab">Pourquoi</div><p>Selon GOLD 2026, beaucoup d’exacerbations ne sont jamais signalées au médecin, alors qu’elles altèrent l’état de santé. Le patient doit donc apprendre à reconnaître un épisode et à savoir quand demander de l’aide.</p>
<div class="lab">Preuves</div><p>Une revue Cochrane citée par GOLD 2026 a montré qu’un plan d’action associé à une éducation brève et à un soutien continu réduit le recours aux soins hospitaliers. Il augmente aussi le traitement des exacerbations par corticostéroïde et antibiotique.</p>
<div class="lab">Piège</div><p>Un plan remis sans explication ni suivi ne suffit pas. Le médecin le relit avec le patient et le met à jour après chaque exacerbation.</p></template>
<template data-pop="j44-pa-inhal" data-title="Dispositifs d’inhalation">
<div class="lab">Les types</div><p>Selon GOLD 2026, plus de 20 dispositifs existent : nébuliseurs, aérosols-doseurs avec ou sans chambre d’inhalation, aérosols déclenchés par l’inspiration, brumisateurs et inhalateurs de poudre sèche. Ils diffèrent par le nombre d’étapes, la force nécessaire, le temps d’administration et la manœuvre inspiratoire.</p>
<div class="lab">Dépôt</div><p>Les particules de plus de 5 µm se déposent dans l’oropharynx. Les particules fines, de 2 à 5 µm, et extrafines, de moins de 2 µm, atteignent les voies aériennes inférieures ; les plus fines se déposent plus loin.</p>
<div class="lab">Manœuvre</div><p>L’aérosol-doseur et le brumisateur demandent une inspiration lente et profonde. L’inhalateur de poudre demande une inspiration forte, car le débit du patient désagrège la poudre. En cas de doute sur ce débit, le médecin le vérifie ou choisit un autre dispositif.</p>
<div class="lab">Erreurs</div><p>Plus des deux tiers des patients commettent au moins une erreur : débit, durée, coordination, préparation de la dose, expiration préalable ou apnée finale. La notice ne suffit pas ; la démonstration par le patient lui-même, contrôlée par le soignant, paraît la plus efficace. Une chambre d’inhalation de 150 à 250 mL est aussi efficace qu’une chambre plus grande.</p>
<div class="lab">Conséquence pratique</div><p>Le dispositif se choisit avec le patient et ne se change pas sans raison clinique ni nouvelle instruction.</p></template>
<template data-pop="j44-pa-pallia" data-title="Soins palliatifs dans la BPCO">
<div class="lab">Définition</div><p>Selon GOLD 2026, les soins palliatifs visent à prévenir et soulager la souffrance et à préserver la meilleure qualité de vie du patient et de sa famille, quel que soit le stade. Ils ne se limitent pas à la fin de vie.</p>
<div class="lab">Dyspnée réfractaire</div><p>Les bronchodilatateurs, l’éducation aux techniques respiratoires et la réhabilitation restent la base. Les opioïdes, la stimulation électrique neuromusculaire, les vibrations de la paroi thoracique et un ventilateur dirigé vers le visage peuvent soulager. La réponse aux opioïdes est individuelle. Un essai randomisé a testé la morphine à libération prolongée, à 8 ou 16 mg par jour pendant une semaine, chez des patients au degré 3 ou 4 de l’échelle mMRC ; elle n’a pas amélioré la dyspnée. L’oxygène peut soulager certains patients non hypoxémiques. Aucun bénéfice des benzodiazépines n’est démontré.</p>
<div class="lab">Anxiété et dépression</div><p>La réhabilitation peut réduire l’anxiété. La thérapie cognitivo-comportementale et les interventions corps-esprit réduisent l’anxiété et la dépression. L’efficacité des antidépresseurs reste incertaine dans cette population.</p>
<div class="lab">Fin de vie</div><p>La prédiction de la survie à six mois est peu fiable. GOLD recommande de parler tôt de la réanimation, des directives anticipées et du lieu de décès souhaité ; une hospitalisation en offre souvent l’occasion. Une bonne anticipation réduit l’anxiété et évite des traitements invasifs non souhaités.</p></template>
<template data-pop="j44-pa-coeur" data-title="BPCO et maladies cardiovasculaires">
<div class="lab">Pourquoi l’association</div><p>Selon GOLD 2026, la BPCO et les maladies cardiovasculaires partagent l’âge et le tabac. La BPCO y ajoute ses propres mécanismes : inflammation systémique, hypoxémie, distension qui réduit le retour veineux et inactivité. L’insuffisance cardiaque aggrave à son tour la BPCO par l’œdème et l’hypertension pulmonaire.</p>
<div class="lab">Fréquences</div><p>L’hypertension artérielle touche près de 50 % des patients, l’insuffisance cardiaque 20 à 30 % et la maladie coronarienne 10 à 20 %. La fibrillation auriculaire est fréquente ; associée à la BPCO, elle double au moins la mortalité par rapport à la fibrillation seule.</p>
<div class="lab">Dépistage</div><p>GOLD recommande un électrocardiogramme au diagnostic et lors d’un changement inexpliqué des symptômes. Les scores habituels de risque cardiovasculaire sous-estiment probablement le risque de ces patients. Pendant et jusqu’à un an après une exacerbation, le risque d’infarctus, d’arythmie et d’accident vasculaire cérébral augmente.</p>
<div class="lab">Traitement</div><p>Chaque maladie cardiovasculaire se traite selon ses recommandations. Un bêtabloquant β1-sélectif indiqué pour une raison cardiaque n’est jamais refusé au patient BPCO ; il ne se prescrit pas pour prévenir les exacerbations. Les BALA, les antimuscariniques et les CSI ont un profil de sécurité acceptable ; les BACA et la théophylline demandent de la prudence en cas de fibrillation auriculaire.</p></template>
<template data-pop="j44-pa-cancer" data-title="Cancer bronchique et dépistage">
<div class="lab">Pourquoi</div><p>Selon GOLD 2026, le cancer bronchique est la première cause de décès par cancer dans le monde, avec environ 1,6 million de décès par an. La BPCO et le cancer partagent le tabac, mais aussi l’inflammation chronique, des modifications épigénétiques et une réparation anormale. Le lien avec l’emphysème est plus fort que le lien avec la sévérité de l’obstruction.</p>
<div class="lab">Critères de dépistage</div><p>GOLD 2026 recommande une tomodensitométrie annuelle à faible dose chez les patients ayant un passé tabagique, comme dans la population générale. Il cite les critères américains de 2021 : âge de 50 à 80 ans, au moins 20 paquets-années, tabagisme actuel ou arrêt depuis moins de 15 ans. Le dépistage s’arrête après 15 ans d’abstinence ou si l’espérance de vie ou l’aptitude à une chirurgie curative deviennent limitées. L’American Cancer Society propose de ne plus tenir compte du délai depuis l’arrêt.</p>
<div class="lab">Limites</div><p>Le dépistage n’est pas recommandé dans la BPCO du non-fumeur, faute de preuves. Il expose à des surdiagnostics et à des examens inutiles pour des anomalies bénignes : il se pratique dans un programme organisé.</p>
<div class="lab">Conséquence pratique</div><p>Un programme de dépistage favorise aussi l’arrêt du tabac. En Suisse, le médecin vérifie l’offre et la prise en charge en vigueur avant de le proposer.</p></template>
