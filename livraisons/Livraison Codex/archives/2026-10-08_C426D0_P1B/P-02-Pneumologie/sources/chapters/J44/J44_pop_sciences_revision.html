<template data-pop="j44-distension-mecanisme" data-title="Distension dynamique et réserve inspiratoire"><p>Une expiration limitée demande davantage de temps. Pendant l’effort, la respiration devient plus rapide et ce temps peut manquer. Le volume de fin d’expiration augmente.</p><p>La capacité inspiratoire diminue lorsque ce volume se rapproche de la capacité pulmonaire totale. Le patient rencontre une limite mécanique pour augmenter son volume courant. Une amélioration du débit ou une demande ventilatoire plus faible peut réduire ce mécanisme.</p><div class="key"><b>À retenir.</b> Un poumon plus rempli n’offre pas nécessairement davantage de ventilation utile.</div></template><template data-pop="j44-genetique-contexte" data-title="Alpha-1 antitrypsine : test et conseil familial"><p>Le dosage mesure une quantité circulante ; le génotype renseigne une cause et les propriétés attendues. L’inflammation peut augmenter la concentration et doit être considérée.</p><p>L’évaluation familiale précise l’expression et la prévention. Le tabac influence fortement le risque pulmonaire. Les variants ne présentent pas tous le même risque hépatique ; un traitement pulmonaire ne corrige pas nécessairement une rétention dans le foie.</p><div class="key"><b>À retenir.</b> Le résultat doit être traduit en surveillance et en prévention spécifiques aux organes exposés.</div></template><template data-pop="pareto-j44-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="j44-sa,j44-sh,j44-sp,j44-sb,j44-sg"></p><p>Les petites voies remodelées augmentent la résistance. La destruction alvéolaire réduit la rétraction et la surface d’échange. Ces lésions peuvent coexister. À l’effort, un temps expiratoire insuffisant augmente le volume de fonctionnement et réduit la réserve inspiratoire. La saturation ne mesure pas l’élimination du dioxyde de carbone. Les profils inflammatoires se lisent avec les exacerbations et les traitements. Un déficit en alpha-1 antitrypsine peut associer protection pulmonaire insuffisante et atteinte hépatique selon le variant.</p></template>
