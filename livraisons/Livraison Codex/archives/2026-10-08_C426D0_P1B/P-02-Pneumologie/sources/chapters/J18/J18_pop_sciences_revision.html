<template data-pop="j18-ventilation-perfusion" data-title="Shunt et espace mort : ce qui manque"><p>Une région avec sang mais sans ventilation contribue à un shunt. Une région avec ventilation mais sans perfusion suffisante contribue à l’espace mort. Ces deux mécanismes rendent la ventilation moins efficace pour l’oxygénation globale.</p><p>Dans une pneumonie consolidée, le manque principal peut être l’air. Dans une embolie, il peut être le sang. Le patient possède souvent plusieurs régions différentes ; la réponse à l’oxygène dépend de cette répartition.</p><div class="key"><b>À retenir.</b> Vous identifiez d’abord ce qui manque, puis vous interprétez les gaz et la tolérance.</div></template>
