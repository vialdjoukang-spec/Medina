
<!-- ===== FENÊTRES PARETO I44 ===== -->
<template data-pop="pareto-i44-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i44-1,i44-2"></p>
<ul><li>Bradycardie &lt; 50/min (ESC 2021) : seul compte le lien avec les symptômes ou le risque de pause.</li><li>Deux mécanismes : influx non produit (dysfonction sinusale) ou non conduit (bloc).</li><li>Maladie de l’oreillette = dysfonction sinusale + tachyarythmie auriculaire (pause à l’arrêt de l’accès).</li><li>BAV : 1er degré (PR &gt; 200 ms) ; Mobitz I (PR croissant) ; Mobitz II (PR fixe, P bloquée soudaine) ; 2:1 (non classable) ; haut degré (≥ 2 P consécutives bloquées) ; complet (dissociation).</li><li>Dissociation ≠ bloc complet.</li><li>Bloc de branche : QRS ≥ 120 ms ; hémibloc : axe dévié, QRS fin ; « trifasciculaire » souvent abusif.</li><li>Suisse 2023 : 6 054 primo-implantations, âge moyen 78,6 ans ; BAV complet 31 %, dysfonction sinusale 16 %.</li><li>Maladie du sujet âgé (fibrose) ; bloc de branche droit isolé bénin, bloc de branche gauche plus souvent lié à une cardiopathie, à rechercher.</li><li>Pronostic : fixé par le siège et la cardiopathie ; BAV complet non appareillé grave (insuffisance cardiaque à bas débit, asystolie) ; dysfonction sinusale : stimulation sans effet démontré sur la survie (elle traite les symptômes).</li></ul></template>

<template data-pop="pareto-i44-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i44-3"></p>
<ul><li>Chaîne : sinus → oreillette → nœud (lent, décrémentiel, vagal) → His-Purkinje (rapide, sodique, peu innervé) → ventricules.</li><li>Nodal : fonctionnel, réversible, atropine et effort l’améliorent ; échappement jonctionnel QRS fin 40–60/min, fiable.</li><li>Infranodal : lésionnel, évolutif ; échappement ventriculaire QRS large 20–40/min, instable → stimulation même sans symptôme.</li><li>Pause post-tachycardie (suppression par surcharge) = syncope de la maladie de l’oreillette.</li><li>Syncope après 6–8 s d’asystolie ; débit = fréquence × volume d’éjection.</li><li>Perte de synchronie → ondes a en canon, syndrome du stimulateur.</li></ul></template>

<template data-pop="pareto-i44-etio" data-title="Pareto — Étiologies et causes réversibles">
<p class="ratio" data-cover="i44-4"></p>
<ul><li>Toujours chercher une cause réversible (MILTHA) : médicaments, ischémie, Lyme, thyroïde, hyperkaliémie et hypothermie, apnées et athlète. Pas de stimulation si cause transitoire corrigeable (classe III).</li><li>Première cause chez le sujet âgé : fibrose dégénérative (Lev-Lenègre, calcifications valvulaires).</li><li>Infarctus inférieur → nodal transitoire ; antérieur → infranodal grave.</li><li>Iatrogène : valve aortique percutanée, chirurgie valvulaire, ablation.</li><li>BAV sous bradycardisant : souvent maladie sous-jacente ; si persiste ou récidive après élimination → stimulation.</li><li>BAV avant 60 ans : sarcoïdose (IRM, TEP), <i>LMNA</i> ; test génétique si maladie progressive avant 50 ans (IIa).</li><li>Syndrome BRASH : hyperkaliémie + bradycardisant + insuffisance rénale.</li></ul></template>

<template data-pop="pareto-i44-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i44-5,i44-6"></p>
<ul><li>Objectif : prouver le lien symptômes–bradycardie et trouver une cause.</li><li>Liste complète des médicaments, collyres et anticholinestérasiques compris ; piqûre de tique ; histoire familiale.</li><li>Symptômes : fatigue d’effort, présyncope, syncope brutale sans prodrome (Stokes-Adams), palpitations puis malaise, chutes du sujet âgé.</li><li>Examen : pouls sur une minute, confirmé par l’électrocardiogramme ; ondes a en canon et premier bruit variable = dissociation ; pression différentielle élargie.</li><li>Massage sinocarotidien au-delà de 40 ans ; test d’orthostatisme.</li><li>Bigéminisme : pouls deux fois plus lent que la fréquence électrique.</li></ul></template>

<template data-pop="pareto-i44-ecg" data-title="Pareto — Lecture de l’électrocardiogramme">
<p class="ratio" data-cover="i44-7"></p>
<ul><li>Six étapes : fréquence → P → relation P-QRS → largeur du QRS → pauses → synthèse (mécanisme, siège, gravité).</li><li>Arrêt sinusal : pause non multiple du PP ; bloc sino-auriculaire de type II : pause = 2 × PP.</li><li>Mobitz I : PR croissant, PR court après la pause, RR qui raccourcissent. Mobitz II : PR fixe, QRS souvent large.</li><li>2:1 : raisonner sur PR, QRS, épreuves.</li><li>Complet : P régulières plus rapides, PR aléatoire ; échappement fin (nodal) ou large (infranodal). Fibrillation lente et régulière = bloc complet.</li><li>P prématurée bloquée ≠ Mobitz II (l’intervalle PP tranche).</li><li>Bloc de branche droit : rsR′ V1–V2, S large DI et V6. Bloc de branche gauche : R crochetées DI, aVL, V5–V6, sans q. Hémibloc antérieur : axe −45° à −90°. Postérieur : +90° à +180°, diagnostic d’élimination. Alternant : stimulation (I).</li></ul></template>

<template data-pop="pareto-i44-siege" data-title="Pareto — Siège du bloc et épreuves">
<p class="ratio" data-cover="i44-8"></p>
<ul><li>Nodal : Mobitz I, QRS fin, PR long, amélioré par atropine et effort, aggravé par manœuvre vagale.</li><li>Infranodal : Mobitz II, bloc de branche, PR normal, aggravé à l’effort (2:1 → 3:1), atropine inefficace.</li><li>Bloc qui s’aggrave à l’effort = infranodal = stimulation.</li><li>Exploration électrophysiologique : HV normal 35–55 ms ; syncope + bloc bifasciculaire + HV ≥ 70 ms ou bloc induit → stimulation (I).</li></ul></template>

<template data-pop="pareto-i44-urg" data-title="Pareto — Bradycardie instable">
<p class="ratio" data-cover="i44-9"></p>
<ul><li>Signes menaçants (ERC 2025) : choc, syncope, ischémie, insuffisance cardiaque sévère. Risque d’asystolie : asystolie récente, Mobitz II, BAV complet à QRS larges, pause &gt; 3 s.</li><li>ABCDE, monitorage, électrocardiogramme, kaliémie, médicaments.</li><li>Atropine 500 µg toutes les 3 à 5 min, jusqu’à 3 mg (AHA : 1 mg).</li><li>Échec ou risque d’asystolie : isoprénaline 5 µg/min ou adrénaline 2–10 µg/min ; alternatives : aminophylline, dopamine, glucagon, glycopyrrolate.</li><li>Stimulation transcutanée (pont) ; endocavitaire si réfractaire (classe I).</li><li>Hyperkaliémie : calcium d’abord. Bêtabloquant/inhibiteur calcique : glucagon, calcium, insuline. Digoxine : Fab. Transplanté : pas d’atropine. Hypothermie : réchauffer.</li><li>Pas d’atropine répétée dans un bloc à QRS larges.</li></ul></template>

<template data-pop="pareto-i44-sync" data-title="Pareto — Syncope bradycardique">
<p class="ratio" data-cover="i44-10"></p>
<ul><li>Évaluation initiale : anamnèse, pression couché-debout, électrocardiogramme ; stratification (ESC 2018).</li><li>Syncope arythmique hautement probable : bradycardie &lt; 40/min ou pauses &gt; 3 s en éveil, Mobitz II, BAV complet, bloc alternant.</li><li>Durée d’enregistrement adaptée à la fréquence des épisodes ; moniteur implantable (classe I) pour les syncopes récidivantes inexpliquées.</li><li>Syncope + bloc bifasciculaire : exploration électrophysiologique (IIa), moniteur implantable si normale.</li><li>Syncope réflexe : stimulation double chambre (I) si &gt; 40 ans, syncopes sévères récidivantes imprévisibles et asystolie documentée (&gt; 3 s symptomatique, &gt; 6 s asymptomatique, sinus carotidien cardio-inhibiteur, asystolie au test d’inclinaison).</li><li>Pause nocturne du sujet jeune asymptomatique : souvent physiologique.</li></ul></template>

<template data-pop="pareto-i44-indic" data-title="Pareto — Indications de la stimulation">
<p class="ratio" data-cover="i44-11"></p>
<ul><li>Dysfonction sinusale : symptômes clairement liés (I) ; bradycardie-tachycardie (I) ou ablation de la fibrillation (IIa) ; incompétence chronotrope symptomatique : asservissement (IIa) ; asymptomatique (III).</li><li>BAV complet, haut degré, Mobitz II, 2:1 infranodal : I, même sans symptôme (rythme sinusal ou fibrillation).</li><li>Mobitz I symptomatique ou infrahisien : IIa. PR &gt; 300 ms avec symptômes : IIa. Cause réversible : III.</li><li>Syncope + bifasciculaire + HV ≥ 70 ms ou bloc induit : I ; bloc alternant : I ; stimulation empirique chez le sujet âgé fragile : IIb ; bloc asymptomatique : III.</li><li>Délais : infarctus ≥ 5 jours ; chirurgie ≥ 5 jours ; valve percutanée 24–48 h (bloc de branche gauche nouveau &gt; 150 ms ou PR &gt; 240 ms : surveillance ambulatoire ou exploration, IIa) ; Lyme : après antibiotique.</li><li>Dystrophie myotonique : tout BAV de 2e–3e degré ou HV ≥ 70 ms (I). <i>LMNA</i> : défibrillateur si risque à 5 ans ≥ 10 % (IIa) ; sarcoïdose : défibrillateur (IIa), resynchronisation avec défibrillateur si FEVG &lt; 50 % (IIa).</li></ul></template>

<template data-pop="pareto-i44-stim" data-title="Pareto — Stimulation cardiaque">
<p class="ratio" data-cover="i44-12"></p>
<ul><li>Code NBG : cavité stimulée, détectée, réponse, asservissement.</li><li>Dysfonction sinusale : DDD(R) en premier choix (syndrome du stimulateur évité) + réduction de la stimulation ventriculaire inutile (I). BAV sinusal : DDD (IIa). Fibrillation permanente : VVIR.</li><li>Stimulation ventriculaire droite fréquente (&gt; 20 %, seuil observationnel) → risque de cardiomyopathie induite.</li><li>FEVG &lt; 40 % (ESC 2021) + BAV de haut degré : resynchronisation plutôt que stimulation droite (I, BLOCK HF).</li><li>Système de conduction : IIb en 2021 ; consensus 2025 : branche gauche préférée, appropriée si fraction d’éjection conservée ou 41–50 % avec ≥ 20 % de stimulation, alternative à la resynchronisation si ≤ 40 %.</li><li>Sans sonde : IIa si pas d’accès veineux ou risque d’infection élevé ; IIb en alternative.</li><li>Complications : hématome, pneumothorax, déplacement, tamponnade, infection (extraction complète), dysfonctionnements (perte de capture, défaut de détection, surdétection, réentrée électronique).</li><li>Antibioprophylaxie dans l’heure (I) ; pas de relais par héparine.</li></ul></template>

<template data-pop="pareto-i44-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i44-13,i44-14"></p>
<ul><li>Contrôles : avant la sortie, à quelques semaines, puis 6–12 mois ou télésurveillance ; pile 8–12 ans.</li><li>Conduite (SSC/SSML 2024) : stimulateur groupe 1 après 1 semaine, groupe 2 après 4 semaines (3 mois si syncope) ; Mobitz II et BAV complet acquis : après stimulateur ; syncope inexpliquée : groupe 1 après 3 mois, groupe 2 inapte jusqu’au diagnostic.</li><li>Informer et documenter ; article 15d de la loi sur la circulation routière.</li><li>IRM : système compatible (I) ; non compatible sans sonde épicardique, abandonnée ou endommagée (IIa) ; sonde abandonnée (IIb).</li><li>Grossesse : BAV congénital souvent toléré ; implantation sans fluoroscopie ; anti-Ro : surveillance fœtale, hydroxychloroquine.</li><li>Sujet âgé : l’âge seul ne contre-indique pas ; décision partagée.</li><li>Insuffisance rénale : BRASH ; stimulateur sans sonde en hémodialyse.</li><li>Athlète : Mobitz I nocturne normal, Mobitz II jamais.</li></ul></template>

<template data-pop="pareto-i44-ecgex" data-title="Pareto — Électrocardiogramme (examens)">
<p class="ratio" data-cover="i44-e-2"></p>
<ul><li>PR 120–200 ms ; QRS &lt; 110 ms (110–119 : incomplet ; ≥ 120 : complet) ; axe −30° à +90°.</li><li>&lt; 40/min ou pause &gt; 3 s en éveil : critère de syncope arythmique si symptômes.</li><li>Pause &gt; 6 s asymptomatique : critère de stimulation dans la syncope réflexe.</li><li>Pièges : extrasystole auriculaire bloquée, fibrillation régularisée (bloc complet), hyperkaliémie (kaliémie immédiate).</li></ul></template>

<template data-pop="pareto-i44-bio" data-title="Pareto — Biologie">
<p class="ratio" data-cover="i44-e-4"></p>
<ul><li>Kaliémie toujours ; créatinine ; TSH ; digoxinémie (0,5–0,9 ng/mL) si traitement ; troponine si ischémie ; sérologie de Lyme si exposition.</li><li>Configurations : hyperkaliémie/BRASH ; digitalique (cupules, fibrillation régularisée) ; hypothyroïdie (microvoltage, QT long) ; Lyme (BAV fluctuant).</li></ul></template>

<template data-pop="pareto-i44-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i44-e-1,i44-e-3,i44-e-5,i44-e-6"></p>
<ul><li>Références : électrocardiogramme (diagnostic), moniteur implantable (syncope rare), exploration électrophysiologique (siège).</li><li>Échocardiographie devant une bradycardie symptomatique (I) ; IRM, tomodensitométrie ou TEP pour la caractérisation tissulaire, surtout avant 60 ans (IIa).</li><li>Durée d’enregistrement selon la fréquence des symptômes : Holter (quotidiens), enregistreur (hebdomadaires), moniteur implantable (rares).</li><li>Épreuve d’effort : incompétence chronotrope (&lt; 85 % de 220 − âge, index &lt; 0,8) ; bloc qui s’aggrave = infranodal ; syncope d’effort (I).</li><li>Massage sinocarotidien positif : asystolie &gt; 3 s et/ou chute systolique &gt; 50 mmHg.</li><li>Exploration : AH 50–120 ms, HV 35–55 ms, seuil décisionnel HV ≥ 70 ms.</li><li>Stimulateur : seuil ventriculaire &lt; 1 volt, R &gt; 5 millivolts, impédance 300–1 200 ohms stable ; chute = isolant, hausse = fracture.</li></ul></template>

<template data-pop="pareto-i44-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i44-sa,i44-sh,i44-sp,i44-sb,i44-sg"></p>
<ul><li>Nœud sinusal : artère de la coronaire droite (≈ 60 %) ; nœud auriculoventriculaire : artère dominante (droite ≈ 80–90 %) → infarctus inférieur = bloc nodal. Branches : septales de l’interventriculaire antérieure → infarctus antérieur = bloc infranodal. Fascicule postérieur doublement vascularisé.</li><li>His sous le septum membraneux, près de l’anneau aortique → blocs après valve percutanée, chirurgie aortique, abcès.</li><li>Cellules nodales : peu de connexines, conduction lente ; Purkinje : nombreuses connexines, conduction rapide. Inflammation réversible, fibrose irréversible.</li><li>Potentiel nodal : phase 4 par If (HCN4), phase 0 calcique. Vague : muscarinique de type 2 ; sympathique : β1-AMPc. Fréquence intrinsèque ≈ 118 − 0,57 × âge.</li><li>Mobitz I = récupération progressive ; Mobitz II = tout ou rien. Atropine et isoprénaline améliorent peu la conduction du His-Purkinje ; l’isoprénaline accélère toutefois l’échappement ventriculaire ; les bloqueurs sodiques peuvent démasquer un bloc.</li><li>Stimulation : courbe intensité-durée (rhéobase, chronaxie ≈ 0,3–0,5 ms), marge × 2 ; loi d’Ohm ; seuil ↑ par hyperkaliémie, classe I.</li><li>Génétique : <i>SCN5A</i>, <i>LMNA</i>, <i>TRPM4</i>, <i>NKX2-5</i>, <i>TBX5</i>, <i>DMPK</i> ; transmission dominante, dépistage des apparentés. Anticorps anti-Ro maternels → BAV congénital ; hydroxychloroquine.</li></ul></template>

<template data-pop="pareto-i44-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i44-p-1,i44-p-2,i44-p-3,i44-p-4,i44-p-5"></p>
<ul><li>Médicaments = pont ; la stimulation traite le bloc lésionnel.</li><li>Atropine (sinus, nœud) 500 µg → 3 mg ; isoprénaline 5 µg/min ; adrénaline 2–10 µg/min ; dopamine 5–20 µg/kg/min ; aminophylline 100–200 mg (infarctus inférieur, transplanté) ; glucagon 50–150 µg/kg (bêtabloquant).</li><li>Calcium : chlorure 10 % 10 mL ou gluconate 10 % 30 mL ; insuline 10 unités + 25 g de glucose.</li><li>Fab antidigoxine : flacons ≈ digoxinémie × poids / 100.</li><li>Interactions : bêtabloquant + vérapamil/diltiazem ; amiodarone + digoxine (dose ÷ 2) ; ivabradine + vérapamil/diltiazem (contre-indiquée) ; macrolides ; IEC/ARM/triméthoprime + insuffisance rénale.</li><li>Collyres bêtabloquants, anticholinestérasiques, lithium, fingolimod : à rechercher.</li><li>Appareillé : les bradycardisants redeviennent utilisables.</li><li>Implantation : céfazoline dans l’heure (I), pas d’antibiotique prolongé (PADIT), enveloppe envisageable lors d’une réintervention (IIb, WRAP-IT) ; pas de relais par héparine (BRUISE CONTROL).</li></ul></template>
