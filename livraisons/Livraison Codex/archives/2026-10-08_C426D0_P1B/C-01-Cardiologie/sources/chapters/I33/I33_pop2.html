
<!-- ===== FENÊTRES : clinique et décisions ===== -->
<template data-pop="i33-atcd-valve" data-title="Antécédents cardiaques et niveau de risque">
<div class="lab">Comment le rechercher</div><p>« Avez-vous une maladie des valves, une valve artificielle, une opération ou une intervention par cathéter sur le cœur ? Un stimulateur ? Une malformation cardiaque de naissance ? Une endocardite ? » Demander la carte de prophylaxie et les comptes rendus opératoires.</p>
<div class="lab">Haut risque</div><p>Antécédent d’EI ; prothèse chirurgicale ou percutanée ; matériel de réparation valvulaire ; cardiopathie congénitale cyanogène ou palliée ; six mois après une réparation par matériel ; assistance ventriculaire. Réparation percutanée mitrale ou tricuspide : prophylaxie à envisager (ESC 2023, IIa) ; en Suisse, pendant 6 mois après la réparation (point de vue 2025).</p>
<div class="lab">Risque intermédiaire</div><p>Valvulopathie rhumatismale ou dégénérative, bicuspidie aortique, prolapsus mitral avec fuite, cardiomyopathie hypertrophique, DECI.</p>
<div class="lab">Pourquoi</div><p>Le terrain augmente la probabilité d’EI devant une fièvre, constitue un critère mineur de Duke et décide de la prophylaxie.</p>
<div class="lab">Mécanisme du risque</div><p>Une EI exige une surface colonisable, une bactériémie et une défense insuffisante de l’hôte (ESC 2023). Une prothèse, un anneau ou une sonde n’ont pas d’endothélium : les protéines du sang, fibrinogène et fibronectine, les recouvrent et offrent des sites de fixation aux adhésines bactériennes. Une valve malade crée des jets qui lèsent l’endothélium. Une cardiopathie cyanogène associe des jets à haute vitesse et, souvent, du matériel prothétique (conduits, shunts). Après une EI, la valve reste cicatricielle, et les facteurs de la première infection persistent souvent : prothèse, injection de drogues, staphylocoque.</p>
<div class="lab">Ordre de grandeur</div><p>Dans la cohorte de Thornhill et al., l’incidence de l’EI atteignait 280 cas pour 100 000 personnes par an chez les sujets à risque intermédiaire et 497 chez les sujets à haut risque. L’EI sur prothèse a une mortalité hospitalière deux fois plus élevée que l’EI sur valve native : ce pronostic, plus que la seule fréquence, justifie la prophylaxie chez le porteur de prothèse.</p>
<div class="lab">Source complémentaire</div><p>Delgado et al., ESC 2023, sections 2, 3.1 et 3.2 ; Thornhill et al., Quantifying infective endocarditis risk in patients with predisposing cardiac conditions, European Heart Journal 2018;39:586–595.</p>
</template>

<template data-pop="i33-atcd-porte" data-title="Porte d’entrée : questions ciblées">
<div class="lab">Bouche</div><p>Soins dentaires récents, douleurs dentaires, gencives qui saignent, abcès.</p>
<div class="lab">Peau et accès vasculaires</div><p>Plaies, ulcères, cathéter veineux, voie d’hémodialyse, injection de drogues, piercing ou tatouage récent.</p>
<div class="lab">Tube digestif et voies urinaires</div><p>Troubles du transit, rectorragies, anémie (<i>S. gallolyticus</i>, entérocoque) ; infection urinaire, geste urologique (entérocoque).</p>
<div class="lab">Soins</div><p>Hospitalisation, chirurgie, endoscopie, implantation de dispositif dans les derniers mois.</p>
<div class="lab">Pourquoi</div><p>La porte d’entrée oriente le traitement probabiliste et doit être traitée pour éviter une réinfection.</p></template>

<template data-pop="i33-atcd-atb" data-title="Antibiothérapie récente">
<div class="lab">Question</div><p>« Avez-vous pris des antibiotiques ces dernières semaines ? Lesquels, combien de temps, et la fièvre a-t-elle cédé puis repris ? »</p>
<div class="lab">Conséquence</div><p>Une antibiothérapie brève peut négativer les hémocultures pendant des jours à des semaines, sans guérir l’EI, car elle tue les bactéries circulantes et inhibe leur croissance dans le flacon, alors que la végétation avasculaire en garde une réserve. C’est la première cause d’EI à hémocultures négatives.</p>
<div class="lab">Conduite</div><p>Chez un patient stable, interrompre l’antibiotique et répéter les hémocultures ; prévenir le laboratoire.</p></template>

<template data-pop="i33-s-fievre" data-title="Fièvre">
<div class="lab">Caractériser</div><p>Ancienneté, courbe (continue, vespérale), frissons, sueurs nocturnes, réponse à un antibiotique antérieur.</p>
<div class="lab">Physiopathologie</div><p>La bactériémie continue libère des composants bactériens qui stimulent la production de cytokines pyrogènes (interleukine 1, interleukine 6, facteur de nécrose tumorale) ; celles-ci élèvent le point de consigne hypothalamique.</p>
<div class="lab">Valeur</div><p>Présente chez 77,7 % des patients du registre européen de l’ESC ; les séries plus anciennes citaient environ 90 %. Critère mineur de Duke au-delà de 38 °C. Peut manquer chez le sujet âgé, l’insuffisant rénal, l’immunodéprimé et sous antipyrétique.</p>
<div class="lab">Sous traitement</div><p>La fièvre cède habituellement en 5 à 10 jours. Au-delà de 7 jours, chercher un foyer non contrôlé, une embolie, une infection de cathéter ou une fièvre médicamenteuse.</p></template>

<template data-pop="i33-s-dyspnee" data-title="Dyspnée dans l’endocardite">
<div class="lab">Mécanismes</div><p>Fuite aortique ou mitrale aiguë (œdème pulmonaire) ; embolies pulmonaires septiques (cœur droit) ; anémie ; sepsis.</p>
<div class="lab">Caractériser</div><p>Rapidité d’installation, orthopnée, toux, douleur pleurale, hémoptysie.</p>
<div class="lab">Valeur</div><p>Une dyspnée d’apparition rapide chez un patient atteint d’EI gauche impose une échocardiographie immédiate : c’est l’indication chirurgicale la plus fréquente.</p></template>

<template data-pop="i33-s-lombalgie" data-title="Lombalgie et spondylodiscite">
<div class="lab">Mécanisme</div><p>Embolie septique dans le disque et les plateaux vertébraux, bien vascularisés chez l’adulte à leur périphérie.</p>
<div class="lab">Clinique</div><p>Douleur rachidienne inflammatoire, nocturne, raideur, douleur à la percussion des épineuses ; parfois déficit neurologique par épidurite.</p>
<div class="lab">Diagnostic</div><p>IRM rachidienne. Critère mineur de Duke (complication ostéoarticulaire septique hématogène).</p>
<div class="lab">Piège</div><p>Une spondylodiscite à streptocoque, entérocoque ou <i>S. aureus</i> impose de chercher une EI par échocardiographie.</p></template>

<template data-pop="i33-s-neuro" data-title="Symptômes neurologiques">
<div class="lab">Formes</div><p>Déficit focal brutal (AVC ischémique embolique), céphalées intenses (hémorragie, anévrisme infectieux), confusion ou encéphalopathie (micro-embolies, sepsis), syndrome méningé (méningite), crise convulsive.</p>
<div class="lab">Valeur</div><p>Parfois inauguraux. Toute fièvre associée à un AVC impose des hémocultures avant de décider d’une thrombolyse.</p>
<div class="lab">Conduite</div><p>Imagerie cérébrale immédiate (scanner, IRM, angiographie si hémorragie). Voir la fiche de conduite à tenir neurologique.</p></template>

<template data-pop="i33-v-sepsis" data-title="Signes vitaux et repérage du sepsis">
<div class="lab">Mesures</div><p>Température, pression artérielle, fréquence cardiaque, fréquence respiratoire, saturation, état de conscience, diurèse.</p>
<div class="lab">Signes de gravité</div><p>Fréquence respiratoire ≥ 22/min, pression artérielle systolique ≤ 100 mmHg et altération de la conscience (score qSOFA, outil de repérage) ; hypotension persistante et lactate &gt; 2 mmol/L malgré le remplissage : choc septique.</p>
<div class="lab">Pièges</div><p>Une pression différentielle élargie évoque une fuite aortique chronique, car le reflux abaisse la pression diastolique et le volume d’éjection accru élève la systolique ; une pression différentielle pincée avec tachycardie évoque une fuite aiguë mal tolérée ou un bas débit.</p>
<div class="lab">Conséquence</div><p>Un sepsis impose des hémocultures puis un traitement probabiliste dans l’heure, sans attendre l’échocardiographie.</p></template>

<template data-pop="i33-e-souffle" data-title="Souffle nouveau ou modifié">
<div class="lab">Technique</div><p>Auscultation des quatre foyers, patient en décubitus puis en décubitus latéral gauche (mitral) et assis penché en avant, en expiration (aortique). Comparer avec les données antérieures.</p>
<div class="lab">Sémiologie</div><p>Souffle diastolique aortique (perforation de sigmoïde), souffle holosystolique apexien (fuite mitrale), souffle systolique xiphoïdien augmenté à l’inspiration (fuite tricuspide), souffle continu (fistule).</p>
<div class="lab">Valeur</div><p>Présent chez 64,5 % des patients du registre européen de l’ESC. Un souffle <b>nouveau</b> a plus de valeur qu’un souffle connu, car il traduit une lésion récente (perforation, rupture de cordage), alors qu’un souffle ancien peut relever de la valvulopathie préexistante.</p>
<div class="lab">Pièges</div><p>Souffle absent au début d’une EI aiguë, dans l’EI tricuspide et sur dispositif. Une fuite aortique aiguë sévère produit un souffle court et doux, sous-estimé.</p></template>

<template data-pop="i33-e-ic" data-title="Insuffisance cardiaque aiguë dans l’endocardite">
<div class="lab">Signes</div><p>Polypnée, orthopnée, crépitants bilatéraux, tachycardie, galop, désaturation ; dans les formes graves, marbrures et hypotension.</p>
<div class="lab">Mécanisme</div><p>Fuite valvulaire aiguë, fistule, obstruction d’une prothèse par une végétation, embolie coronaire, myocardite.</p>
<div class="lab">Conséquence</div><p>Échocardiographie immédiate et avis chirurgical : première indication de la chirurgie en urgence.</p></template>

<template data-pop="i33-e-pouls" data-title="Troubles de conduction et abcès">
<div class="lab">Technique</div><p>Pouls lent ou irrégulier ; ECG quotidien pendant la phase active d’une EI aortique ; lecture de l’intervalle PR, comparée au tracé d’admission.</p>
<div class="lab">Signification</div><p>Allongement du PR, bloc auriculoventriculaire du deuxième ou du troisième degré, bloc de branche nouveau : extension de l’infection au tissu de conduction, typiquement par un abcès de l’anneau aortique ou septal.</p>
<div class="lab">Conduite</div><p>ETO ou scanner ; surveillance continue du rythme ; stimulation temporaire si nécessaire ; indication chirurgicale urgente (ESC 2023).</p></template>

<template data-pop="i33-e-splinter" data-title="Hémorragies sous-unguéales en flammèches">
<div class="lab">Aspect</div><p>Fines lignes rouge brun, longitudinales, sous l’ongle, plutôt dans sa partie proximale.</p>
<div class="lab">Mécanisme</div><p>Microembolies ou vascularite des capillaires du lit unguéal.</p>
<div class="lab">Valeur</div><p>Peu spécifiques : fréquentes après un traumatisme (travailleur manuel), dans le psoriasis et chez le sujet âgé. Plus évocatrices si multiples, proximales et récentes.</p></template>

<template data-pop="i33-janeway" data-title="Lésions de Janeway">
<div class="lab">Aspect</div><p>Macules ou petites plaques érythémateuses ou hémorragiques, indolores, sur les paumes et les plantes, en particulier les éminences thénar et hypothénar.</p>
<div class="lab">Mécanisme</div><p>Microembolies septiques avec microabcès du derme ; des bactéries peuvent y être retrouvées.</p>
<div class="lab">Valeur</div><p>Rares mais évocatrices, surtout dans les formes aiguës à <i>S. aureus</i> ; critère mineur de Duke (phénomène vasculaire).</p>
<div class="lab">Distinction</div><p>Indolores, contrairement aux nodosités d’Osler.</p></template>

<template data-pop="i33-osler" data-title="Nodosités d’Osler">
<div class="lab">Aspect</div><p>Petits nodules rouge violacé, <b>douloureux</b>, de quelques millimètres, sur la pulpe des doigts et des orteils ou les éminences ; ils disparaissent en quelques heures à quelques jours.</p>
<div class="lab">Mécanisme</div><p>Probablement microembolies et vascularite à complexes immuns.</p>
<div class="lab">Valeur</div><p>Rares, plutôt dans les formes subaiguës ; critère mineur de Duke (phénomène immunologique). Leur absence n’exclut rien.</p></template>

<template data-pop="i33-roth" data-title="Taches de Roth">
<div class="lab">Technique</div><p>Examen du fond d’œil, idéalement après dilatation pupillaire, par ophtalmoscopie.</p>
<div class="lab">Aspect</div><p>Hémorragies rétiniennes ovales à centre blanc ou pâle, près de la papille.</p>
<div class="lab">Valeur</div><p>Critère mineur de Duke (phénomène immunologique). Peu spécifiques : présentes aussi dans les leucémies, l’anémie sévère, le diabète et l’hypertension.</p>
<div class="lab">Mécanisme</div><p>Un capillaire rétinien se rompt et laisse une hémorragie dont le centre reste pâle. La cause de la rupture est discutée : vascularite à complexes immuns, d’où leur classement parmi les phénomènes immunologiques de Duke, ou microembolie septique. Leur présence dans des affections non infectieuses, comme la leucémie ou l’anémie sévère, montre qu’une fragilité capillaire suffit à les produire : c’est la raison de leur faible spécificité.</p>
<div class="lab">Source complémentaire</div><p>Delgado et al., ESC 2023, sections 5.1 et 5.5.</p>
</template>

<template data-pop="i33-e-conj" data-title="Pétéchies conjonctivales et muqueuses">
<div class="lab">Technique</div><p>Éverser la paupière inférieure ; examiner le palais et la muqueuse buccale.</p>
<div class="lab">Mécanisme</div><p>Microembolies ou lésions capillaires.</p>
<div class="lab">Valeur</div><p>Les hémorragies conjonctivales sont un critère mineur de Duke (phénomène vasculaire). Peu spécifiques : thrombopénie, efforts de toux ou de vomissement.</p></template>

<template data-pop="i33-e-neuro" data-title="Examen neurologique dans l’endocardite">
<div class="lab">Contenu</div><p>Conscience, orientation, langage, champ visuel, motricité et sensibilité des quatre membres, réflexes, syndrome méningé ; répété chaque jour.</p>
<div class="lab">Pourquoi</div><p>Un déficit, même discret ou transitoire, modifie le délai de la chirurgie et impose une imagerie. L’examen de référence d’admission sert à détecter une aggravation.</p></template>

<template data-pop="i33-e-rate" data-title="Splénomégalie et atteinte splénique">
<div class="lab">Technique</div><p>Palpation en décubitus dorsal puis latéral droit, en inspiration profonde ; percussion de l’espace de Traube.</p>
<div class="lab">Mécanisme</div><p>Hyperplasie réactionnelle dans les formes prolongées ; infarctus ou abcès par embolie.</p>
<div class="lab">Valeur</div><p>Peu fréquente aujourd’hui. Une douleur de l’hypochondre gauche ou une fièvre persistante font chercher un infarctus ou un abcès splénique par imagerie.</p></template>

<template data-pop="i33-e-porte" data-title="Examen de la porte d’entrée">
<div class="lab">Bouche</div><p>Caries, abcès, parodontite, mobilité dentaire ; bilan dentaire et panoramique dentaire pendant l’hospitalisation.</p>
<div class="lab">Peau</div><p>Plaies, ulcères, intertrigo, points d’injection, abcès, cellulite.</p>
<div class="lab">Matériel</div><p>Cathéters (rougeur, pus, tunnel), fistule de dialyse, loge du dispositif électronique (rougeur, douleur, fluctuation, extériorisation).</p>
<div class="lab">Pourquoi</div><p>Une porte d’entrée non traitée expose à la réinfection et, pour un cathéter, à la persistance de la bactériémie.</p></template>

<template data-pop="i33-mnemo-fromjane" data-title="« FROM JANE » — signes de l’endocardite">
<p><b>F</b> — Fièvre ;<br><b>R</b> — taches de Roth ;<br><b>O</b> — nodosités d’Osler ;<br><b>M</b> — souffle (<i>Murmur</i>) nouveau ;<br><b>J</b> — lésions de Janeway ;<br><b>A</b> — Anémie ;<br><b>N</b> — hémorragies du lit unguéal (<i>Nail</i>) ;<br><b>E</b> — Embolies.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique d’origine anglophone, non critère officiel. Il regroupe les signes à chercher ; il ne remplace ni les hémocultures ni les critères de Duke, et la plupart de ces signes manquent au début.</p></template>

<template data-pop="i33-equipe" data-title="Équipe endocardite">
<div class="lab">Composition (ESC 2023)</div><p>Au minimum cardiologues, spécialistes d’imagerie, chirurgiens cardiaques, infectiologues et microbiologistes ; selon le cas, neurologues, neuroradiologues, spécialistes des dispositifs électroniques, médecine nucléaire, addictologie, néphrologie, anesthésie et soins intensifs, gériatrie.</p>
<div class="lab">Rôle</div><p>Confirmer le diagnostic, choisir l’antibiothérapie, poser et dater l’indication chirurgicale, organiser le relais oral ou ambulatoire et le suivi.</p>
<div class="lab">Recommandation</div><p>EI compliquée : prise en charge dans un centre disposant d’une chirurgie cardiaque et d’une équipe endocardite ; EI non compliquée : possible dans l’hôpital d’origine, avec concertation régulière avec ce centre.</p>
<div class="lab">Justification</div><p>Ce modèle a été associé à une baisse de la mortalité dans des études observationnelles.</p></template>

<template data-pop="i33-neuro-cat" data-title="Complications neurologiques : conduite à tenir">
<div class="lab">AVC ischémique</div><p>Pas de thrombolyse (risque hémorragique par artérite septique). La thrombectomie mécanique peut être envisagée dans un centre expérimenté (ESC 2023, IIb).</p>
<div class="lab">Chirurgie après AVC ischémique</div><p>Si une indication opératoire existe (insuffisance cardiaque, infection non contrôlée, abcès, risque embolique élevé persistant), la chirurgie n’est pas retardée, à condition que le patient ne soit pas dans le coma et qu’une hémorragie ait été exclue par l’imagerie (ESC 2023). Un accident ischémique transitoire ou une embolie silencieuse ne retardent pas la chirurgie.</p>
<div class="lab">Hémorragie intracrânienne</div><p>Arrêt de toute anticoagulation (classe I). Chirurgie en général différée d’au moins un mois ; plus tôt si le pronostic neurologique paraît bon et si l’indication cardiaque est pressante, après discussion en équipe.</p>
<div class="lab">Anévrisme infectieux</div><p>Angiographie ; traitement endovasculaire ou neurochirurgical selon la taille et la rupture.</p>
<div class="lab">Abcès cérébral, méningite</div><p>Antibiothérapie à doses méningées ; avis neurochirurgical.</p>
<div class="lab">Mécanisme</div><p>L’embole septique occlut une artère cérébrale et infecte sa paroi. Cette artérite fragilise le vaisseau : elle favorise la transformation hémorragique de l’infarctus et la formation d’anévrismes infectieux. Un thrombolytique dissout la fibrine qui colmate ces lésions : il expose à l’hémorragie, d’où sa contre-indication (ESC 2023, classe III). Les antithrombotiques n’apportent pas de bénéfice.</p>
<div class="lab">Pourquoi ne pas retarder la chirurgie après un AVC ischémique</div><p>La circulation extracorporelle exige une héparinisation complète, qui peut faire saigner un infarctus récent. Ce risque de transformation hémorragique postopératoire est estimé à 2 à 7 % ; il est en général inférieur au risque d’une nouvelle embolie sous antibiotiques. Des microsaignements isolés à l’IRM ne retardent pas l’intervention (ESC 2023).</p>
<div class="lab">Pourquoi différer après une hémorragie</div><p>L’héparinisation complète de la circulation extracorporelle peut agrandir un hématome. Une chirurgie plus précoce se discute lorsque l’hémorragie est petite, de moins de 30 mL, ou que le déficit neurologique est modéré, car le risque d’aggravation est alors plus faible (ESC 2023, figure 11).</p>
<div class="lab">Source complémentaire</div><p>Delgado et al., ESC 2023, sections 9.1, 9.1.1 et 10.4, figure 11.</p>
</template>

<template data-pop="i33-chir" data-title="Indications chirurgicales (ESC 2023)">
<div class="lab">Trois familles</div><p><b>Insuffisance cardiaque</b> (la plus fréquente) ; <b>infection non contrôlée</b> (locale, germe difficile, bactériémie persistante) ; <b>prévention des embolies</b> (végétation ≥ 10 mm).</p>
<div class="lab">Trois délais</div><p>Urgence absolue : &lt; 24 heures (œdème pulmonaire réfractaire, choc cardiogénique). Urgence : 3 à 5 jours. Non urgente : pendant la même hospitalisation.</p>
<div class="lab">Classes</div><p>Classe I : insuffisance cardiaque ; infection localement non contrôlée ; champignons ou germes multirésistants ; végétation ≥ 10 mm après au moins une embolie, ou avec une autre indication. Classe IIa : hémocultures persistantes malgré un traitement adapté et le contrôle des foyers ; EI sur prothèse à <i>S. aureus</i> ou à bacille à Gram négatif hors HACEK. Classe IIb : végétation ≥ 10 mm isolée, risque opératoire faible.</p>
<div class="lab">Cœur droit</div><p>Insuffisance tricuspide sévère mal tolérée, végétation &gt; 20 mm persistante après embolies pulmonaires, atteinte gauche associée, germe difficile.</p>
<div class="lab">Bilan préopératoire</div><p>Évaluation coronaire (scanner coronaire de préférence en cas de végétation aortique), imagerie cérébrale, soins dentaires si possible.</p>
<div class="lab">Aide pédagogique</div><p>« Cœur, infection, embolie » dans cet ordre de fréquence : moyen mnémotechnique, non critère officiel.</p>
<div class="lab">Pourquoi ces trois familles</div><p>L’antibiotique tue les bactéries, mais ne répare pas les lésions. Un feuillet perforé ou un cordage rompu ne cicatrisent pas : la chirurgie est le seul traitement de l’insuffisance cardiaque de l’EI associé à une meilleure survie, avec un bénéfice plus net en classe NYHA III–IV. Un abcès est une cavité non vascularisée que l’antibiotique atteint mal : l’opérer améliore la survie à un an de 15 à 20 % dans les séries publiées. Une grosse végétation reste emboligène pendant les premiers jours : la retirer prévient l’embolie, comme l’a montré l’essai randomisé de Kang et al. (ESC 2023).</p>
<div class="lab">Limites</div><p>Hormis cet essai, les données sont observationnelles et exposées au biais de survie : les patients opérés sont ceux qui vivent assez longtemps et sont jugés opérables. L’ESC 2023 estime le bénéfice de survie à un an jusqu’à 20 %. Les patients non opérés malgré une indication ont le pire pronostic ; la décision de ne pas opérer revient à l’équipe endocardite.</p>
<div class="lab">Source complémentaire</div><p>Delgado et al., ESC 2023, sections 8.1 à 8.4.3 ; Kang et al., New England Journal of Medicine 2012;366:2466–2473.</p>
</template>

<template data-pop="i33-prophy" data-title="Antibioprophylaxie : repères">
<div class="lab">Principe</div><p>Réservée aux patients à haut risque et aux soins dentaires qui manipulent la gencive ou la région périapicale ou perforent la muqueuse orale ; dose unique avant le geste.</p>
<div class="lab">Gestes sans prophylaxie</div><p>Anesthésie locale dans un tissu non infecté, soin superficiel de carie, retrait de points, radiographie dentaire, pose d’appareil orthodontique amovible ; en Suisse, bronchoscopie, gastroscopie, coloscopie, cystoscopie, accouchement, ETO.</p>
<div class="lab">Différences Suisse – ESC</div><p>Clindamycine conservée sur la carte suisse de 2021 pour l’allergie immédiate, déconseillée par l’ESC 2023 ; gestes non dentaires : pas de prophylaxie selon les experts suisses, IIb selon l’ESC ; transplanté cardiaque : décision au cas par cas en Suisse ; réparation percutanée mitrale ou tricuspide : IIa selon l’ESC, 6 mois selon le point de vue suisse de 2025. Amygdalectomie chez le patient à haut risque : prophylaxie proposée par la majorité du groupe suisse, à titre d’avis d’experts.</p>
<div class="lab">Outils</div><p>Carte de prophylaxie et dépliant d’information de la Fondation suisse de cardiologie, remis au patient.</p></template>

<template data-pop="i33-readapt" data-title="Rééducation et suivi après endocardite">
<div class="lab">Calendrier</div><p>Suivi partagé entre cardiologue, infectiologue, médecin de famille et dentiste (ESC 2023) : ETT de référence en fin de traitement, répétée si l’état clinique change ; une ou plusieurs réévaluations cliniques pendant la première année, puis une par an selon le risque individuel. Le rythme à 1, 3, 6 et 12 mois est un repère courant, non fixé par l’ESC 2023. La CRP et les leucocytes sont contrôlés peu après la fin du traitement ; des hémocultures sont encouragées dans la semaine qui suit l’arrêt, car les germes virulents exposent à une rechute précoce. Toute fièvre ultérieure impose des hémocultures avant un antibiotique.</p>
<div class="lab">Réadaptation</div><p>Après une chirurgie ou une hospitalisation prolongée, la réadaptation cardiaque ambulatoire ou stationnaire améliore la capacité d’effort ; l’ESC 2023 propose de l’envisager chez les patients stables (classe IIa), en lien avec l’équipe endocardite.</p>
<div class="lab">Risques à surveiller</div><p>Rechute (surtout dans les 6 premiers mois), aggravation d’une fuite résiduelle, dysfonction de prothèse, conséquences neurologiques, anxiété et dépression après une hospitalisation longue.</p>
<div class="lab">Prévention</div><p>Contrôles dentaires réguliers, soins de la peau, carte de prophylaxie si le patient est devenu à haut risque ; traitement de l’addiction chez l’UDIV.</p>
<div class="lab">Retour au travail et conduite</div><p>Selon la récupération fonctionnelle et neurologique ; après un AVC ou une chirurgie cardiaque, l’aptitude à la conduite suit les directives de la Société suisse de cardiologie et les règles propres à l’AVC.</p></template>

<template data-pop="i33-grossesse" data-title="Grossesse et antibiotiques de l’endocardite">
<div class="lab">Utilisables</div><p>Pénicillines, céphalosporines (céfazoline, ceftriaxone), vancomycine : longue expérience, pas de fœtotoxicité établie.</p>
<div class="lab">Selon le bénéfice</div><p>Aminosides (gentamicine) : ototoxicité fœtale décrite, surtout avec la streptomycine et la kanamycine ; durée la plus courte possible et dosages. Rifampicine : utilisable si indispensable ; en fin de grossesse, risque hémorragique du nouveau-né par déficit en vitamine K, prévenu par la vitamine K. Daptomycine et linézolide : données limitées, réservés à l’absence d’alternative.</p>
<div class="lab">À éviter</div><p>Tétracyclines, dont la doxycycline, à partir du deuxième trimestre (coloration dentaire, atteinte osseuse du fœtus) ; fluoroquinolones en première intention.</p>
<div class="lab">Toujours</div><p>Choix avec l’infectiologue et l’obstétricien ; consulter les données actualisées de pharmacovigilance.</p></template>

<template data-pop="i33-opat" data-title="Antibiothérapie parentérale ambulatoire">
<div class="lab">Principe</div><p>Poursuite du traitement intraveineux hors de l’hôpital, à domicile ou en hôpital de jour, par cathéter veineux adapté.</p>
<div class="lab">Critères (ESC 2023)</div><p>Après la phase critique : au moins 10 jours de traitement intraveineux, et au moins 7 jours après une chirurgie, car les abcès, l’insuffisance cardiaque et les embolies se concentrent dans cette période (ESC 2023) ; patient stable, apyrétique, hémocultures négativées ; pas de complication cardiaque ou neurologique évolutive ni d’indication chirurgicale en suspens ; ETO récente rassurante ; entourage et équipe de suivi disponibles.</p>
<div class="lab">Molécules adaptées</div><p>Celles qui s’administrent une fois par jour ou en perfusion continue : ceftriaxone, daptomycine, pompe portable pour les pénicillines.</p>
<div class="lab">Contre-indications relatives</div><p>Injection de drogues active (usage détourné du cathéter), isolement social, mauvaise adhésion.</p></template>

<template data-pop="i33-choixvalve" data-title="Choix de la prothèse dans l’endocardite">
<div class="lab">Principe</div><p>L’infection active ne modifie pas en elle-même le choix entre prothèse mécanique et biologique ; ce choix suit les critères habituels.</p>
<div class="lab">Critères</div><p>Âge et espérance de vie ; contre-indication ou risque de l’anticoagulation (hémorragie cérébrale récente, AVC étendu) ; souhait du patient ; projet de grossesse ; adhésion prévisible (UDIV).</p>
<div class="lab">Racine aortique détruite</div><p>Débridement complet, puis remplacement de la racine par tube valvé ou homogreffe. L’homogreffe n’a pas démontré de réduction de la réinfection par rapport aux prothèses ; elle reste une option dans les destructions étendues, selon l’expérience du centre.</p>
<div class="lab">Mitrale</div><p>Réparation préférée lorsqu’elle est possible.</p></template>
