
<!-- ===== FENÊTRES : monographies ===== -->
<template data-pop="i25-d-bb" data-title="Bêtabloquants anti-angineux">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs β1 : baisse de la fréquence, de la contractilité et de la pression artérielle à l’effort ; allongement de la diastole, donc de la perfusion sous-endocardique. Le seuil ischémique est repoussé.</p>
<div class="lab">Molécules</div><p>Bisoprolol, métoprolol succinate, aténolol, carvédilol ; préférer les β1-sélectifs.</p>
<div class="lab">Preuves</div><p>Réduction de l’angor et des épisodes ischémiques ; réduction de la mortalité dans l’insuffisance cardiaque à FEVG réduite (&lt; 50 % selon l’ESC 2026). Après infarctus : bénéfice à FEVG 40–49 % (méta-analyse 2025) ; données divergentes à FEVG ≥ 50 % (REDUCE-AMI, REBOOT, BETAMI-DANBLOCK). Dans le SCC sans infarctus ni insuffisance cardiaque, pas de bénéfice démontré sur la mortalité.</p>
<div class="lab">Posologie</div><p>Bisoprolol 2,5 à 10 mg/jour ; métoprolol succinate 47,5 à 190 mg/jour. Cible : fréquence de repos 55 à 60/min.</p>
<div class="lab">Effets indésirables</div><p>Fatigue, bradycardie, extrémités froides, dysfonction érectile, bronchospasme (surtout non sélectifs), masquage des signes d’hypoglycémie.</p>
<div class="lab">Contre-indications</div><p>Bradycardie symptomatique, bloc auriculoventriculaire de haut degré sans stimulateur, asthme sévère (précaution pour les β1-sélectifs), angor vasospastique pur, ischémie critique des membres.</p>
<div class="lab">Surveillance</div><p>Fréquence, pression, tolérance. Ne pas arrêter brutalement : risque de rebond ischémique.</p></template>

<template data-pop="i25-d-icc" data-title="Inhibiteurs calciques dans l’angor">
<div class="lab">Mécanisme</div><p>Blocage des canaux calciques de type L. <b>Dihydropyridines</b> (amlodipine, nifédipine à libération prolongée, félodipine) : vasodilatation artérielle et coronaire, baisse de la postcharge, sans effet sur la conduction. <b>Non dihydropyridiniques</b> (vérapamil, diltiazem) : en plus, baisse de la fréquence et de la contractilité.</p>
<div class="lab">Place</div><p>Première ligne, comme les bêtabloquants (classe I) ; traitement de choix de l’angor vasospastique (classe I). Dihydropyridine en association à un bêtabloquant.</p>
<div class="lab">Posologie</div><p>Amlodipine 5–10 mg/jour ; nifédipine à libération prolongée 30–90 mg/jour ; diltiazem à libération prolongée 180–360 mg/jour ; vérapamil à libération prolongée 120–240 mg/jour → 480 mg/jour.</p>
<div class="lab">Effets indésirables</div><p>Dihydropyridines : œdèmes des chevilles, céphalées, bouffées de chaleur. Vérapamil : constipation, bradycardie. Diltiazem : bradycardie, œdèmes.</p>
<div class="lab">Contre-indications</div><p>Vérapamil et diltiazem : FEVG réduite, bradycardie, bloc auriculoventriculaire, association à un bêtabloquant ou à l’ivabradine. Nifédipine à libération immédiate : à proscrire.</p>
<div class="lab">Surveillance</div><p>Fréquence et ECG sous non-dihydropyridiniques ; interactions par inhibition du CYP3A4 (vérapamil, diltiazem).</p></template>

<template data-pop="i25-d-nlp" data-title="Dérivés nitrés de longue durée d’action">
<div class="lab">Molécules</div><p>Isosorbide mononitrate, isosorbide dinitrate, trinitrine transdermique.</p>
<div class="lab">Mécanisme</div><p>Donneurs de monoxyde d’azote : vasodilatation veineuse (baisse de la précharge et de la tension pariétale) et vasodilatation coronaire épicardique, indépendante de l’endothélium.</p>
<div class="lab">Tolérance</div><p>L’efficacité disparaît en quelques jours si la concentration est permanente. Il faut ménager un intervalle libre de 10 à 12 heures, en général la nuit : prises asymétriques (matin et début d’après-midi) ou forme à libération prolongée le matin ; patch retiré la nuit.</p>
<div class="lab">Place</div><p>Deuxième ligne (classe IIa, ESC 2024) ; utile dans l’angor à composante vasospastique. Pas d’effet démontré sur la survie.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Céphalées, hypotension orthostatique, tachycardie réflexe. Contre-indiqués avec les inhibiteurs de la phosphodiestérase de type 5 et le riociguat ; prudence dans le rétrécissement aortique serré et la cardiomyopathie hypertrophique obstructive.</p></template>

<template data-pop="i25-d-rano" data-title="Ranolazine">
<div class="lab">Mécanisme</div><p>Inhibition du courant sodique tardif : moins de surcharge sodique puis calcique dans le cardiomyocyte ischémique, meilleure relaxation diastolique. Aucun effet sur la fréquence ni la pression artérielle.</p>
<div class="lab">Preuves</div><p>Essais CARISA et ERICA : réduction de la fréquence des crises et amélioration de la durée d’effort en association. MERLIN-TIMI 36 (après un SCA) : pas de réduction des événements majeurs, moins d’ischémie récidivante.</p>
<div class="lab">Place</div><p>Deuxième ligne (classe IIa, ESC 2024), en particulier si la pression ou la fréquence sont basses ; baisse modeste de l’HbA1c chez le diabétique.</p>
<div class="lab">Posologie</div><p>375 mg × 2/jour, puis 500 mg puis 750 mg × 2/jour selon la tolérance.</p>
<div class="lab">Effets indésirables</div><p>Vertiges, nausées, constipation ; allongement modéré de l’intervalle QTc.</p>
<div class="lab">Contre-indications</div><p>Clairance de la créatinine &lt; 30 mL/min ; insuffisance hépatique modérée à sévère ; inhibiteurs puissants du CYP3A4 ; association à certains antiarythmiques de classe Ia ou III (sauf amiodarone).</p>
<div class="lab">Surveillance</div><p>ECG (QTc), fonction rénale ; taux de digoxine ; dose de simvastatine limitée ; metformine plafonnée.</p>
<div class="lab">Statut en Suisse</div><p>Autorisée depuis 2010 (Ranexa, comprimés à libération prolongée).</p></template>

<template data-pop="i25-d-iva" data-title="Ivabradine dans l’angor">
<div class="lab">Mécanisme</div><p>Blocage du courant If du nœud sinusal : baisse de la fréquence cardiaque sans effet inotrope ni tensionnel. Inefficace en fibrillation auriculaire.</p>
<div class="lab">Preuves</div><p>Effet anti-angineux démontré seule ou avec un bêtabloquant. BEAUTIFUL (2008, FEVG &lt; 40 %) : pas de réduction du critère principal. SIGNIFY (2014, FEVG conservée, sans insuffisance cardiaque) : pas de bénéfice, hausse des événements chez les patients ayant un angor limitant.</p>
<div class="lab">Place (ESC 2024)</div><p>Deuxième ligne chez le patient à FEVG &lt; 40 % dont l’angor est insuffisamment contrôlé (classe IIa) ; non recommandée en ajout si FEVG &gt; 40 % sans insuffisance cardiaque (classe III).</p>
<div class="lab">Posologie</div><p>5 mg × 2/jour (2,5 mg × 2/jour après 75 ans), puis 7,5 mg × 2/jour ; ne pas descendre sous 50/min de fréquence de repos.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Phosphènes, bradycardie, fibrillation auriculaire. Contre-indiquée avec le vérapamil, le diltiazem et les inhibiteurs puissants du CYP3A4, et pendant la grossesse.</p></template>

<template data-pop="i25-d-tmz" data-title="Trimétazidine">
<div class="lab">Mécanisme</div><p>Inhibition de la 3-cétoacyl-coenzyme A thiolase à longue chaîne, dernière enzyme de la bêta-oxydation : le cardiomyocyte oxyde davantage de glucose, ce qui produit plus d’ATP par molécule d’oxygène.</p>
<div class="lab">Preuves</div><p>Effet anti-angineux modeste en association. L’essai ATPCI (2020), après angioplastie, n’a pas réduit les événements ni la récidive d’angor.</p>
<div class="lab">Place</div><p>Deuxième ligne (classe IIb, ESC 2024) ; aucun effet hémodynamique.</p>
<div class="lab">Posologie</div><p>35 mg × 2/jour (libération modifiée) ; 35 mg/jour si la clairance de la créatinine est entre 30 et 60 mL/min.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Syndromes parkinsoniens, tremblements, troubles de la marche (restrictions de l’Agence européenne des médicaments en 2012) ; contre-indiquée dans la maladie de Parkinson et si la clairance est &lt; 30 mL/min.</p>
<div class="lab">Surveillance</div><p>Examen neurologique ; arrêt définitif en cas de trouble du mouvement.</p>
<div class="lab">Statut en Suisse</div><p>Aucun médicament à base de trimétazidine n’est commercialisé en Suisse. La molécule figure dans les recommandations européennes ; le patient peut en avoir reçu à l’étranger.</p></template>

<template data-pop="i25-d-nico" data-title="Nicorandil">
<div class="lab">Mécanisme</div><p>Double action : ouverture des canaux potassiques sensibles à l’ATP (vasodilatation artériolaire) et effet dérivé nitré (vasodilatation veineuse et épicardique).</p>
<div class="lab">Preuves</div><p>Essai IONA (2002) : réduction d’un critère composite incluant les hospitalisations pour douleur thoracique.</p>
<div class="lab">Place</div><p>Deuxième ligne (classe IIb, ESC 2024).</p>
<div class="lab">Posologie</div><p>5 à 10 mg × 2/jour, jusqu’à 20 mg × 2/jour.</p>
<div class="lab">Effets indésirables</div><p>Céphalées ; ulcérations buccales, anales, digestives et cutanées, parfois tardives, qui imposent l’arrêt.</p>
<div class="lab">Contre-indications</div><p>Inhibiteurs de la phosphodiestérase de type 5, riociguat, hypotension, choc.</p>
<div class="lab">Statut en Suisse</div><p>Autorisé depuis 1993 ; disponible sous forme de génériques en comprimés, l’original n’étant plus distribué.</p></template>

<template data-pop="i25-d-clopi" data-title="Clopidogrel dans le syndrome coronarien chronique">
<div class="lab">Mécanisme</div><p>Promédicament activé par le foie (dont le CYP2C19) ; blocage irréversible du récepteur plaquettaire P2Y12 de l’ADP.</p>
<div class="lab">Preuves</div><p>CAPRIE (1996) : légère supériorité sur l’acide acétylsalicylique chez des patients vasculaires. HOST-EXAM (2021) : après la double antiagrégation suivant une angioplastie, le clopidogrel en monothérapie a réduit un critère composite ischémique et hémorragique par rapport à l’acide acétylsalicylique.</p>
<div class="lab">Place (ESC 2024)</div><p>Inhibiteur du P2Y12 de la double antiagrégation après angioplastie élective (6 mois en standard) ; alternative à l’acide acétylsalicylique en monothérapie au long cours (classe I).</p>
<div class="lab">Posologie</div><p>75 mg/jour ; charge de 600 mg avant une angioplastie élective.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Hémorragies, éruption, rarement purpura thrombotique thrombocytopénique. Hémorragie active.</p>
<div class="lab">Interactions et surveillance</div><p>Oméprazole et ésoméprazole réduisent son activation (préférer le pantoprazole). Arrêt 5 jours avant une chirurgie à risque hémorragique, après avis cardiologique.</p></template>

<template data-pop="i25-d-riva" data-title="Rivaroxaban à dose vasculaire">
<div class="lab">Mécanisme</div><p>Inhibiteur direct du facteur Xa ; à 2,5 mg × 2/jour, la dose est quatre fois plus faible que la dose anticoagulante de la fibrillation auriculaire.</p>
<div class="lab">Preuve</div><p>Essai COMPASS (2017), maladie coronaire ou artériopathie périphérique stables : rivaroxaban 2,5 mg × 2/jour + acide acétylsalicylique a réduit les décès cardiovasculaires, les AVC et les infarctus, au prix d’une hausse des hémorragies majeures, sans hausse des hémorragies mortelles ou intracrâniennes.</p>
<div class="lab">Place (ESC 2024)</div><p>En ajout à l’acide acétylsalicylique chez le patient à risque ischémique élevé (IIa) ou modéré (IIb), sans risque hémorragique élevé.</p>
<div class="lab">Contre-indications</div><p>Risque hémorragique élevé, antécédent d’AVC hémorragique ou lacunaire, insuffisance rénale sévère, insuffisance cardiaque sévère avec FEVG &lt; 30 % (critères d’exclusion de COMPASS), association à un inhibiteur du P2Y12.</p>
<div class="lab">Surveillance</div><p>Hémoglobine, fonction rénale ; interactions avec les inhibiteurs et inducteurs puissants du CYP3A4 et de la glycoprotéine P.</p></template>

<template data-pop="i25-d-statine" data-title="Statines dans le syndrome coronarien chronique">
<div class="lab">Mécanisme</div><p>Inhibition de l’HMG-CoA réductase ; hausse des récepteurs du LDL hépatiques ; baisse du LDL d’environ 50 % à haute intensité ; stabilisation des plaques et effet anti-inflammatoire.</p>
<div class="lab">Preuves</div><p>4S (1994, simvastatine chez le coronarien) : réduction de la mortalité totale. Méta-analyses des essais de statines : chaque baisse de 1 mmol/L du LDL réduit d’environ un cinquième les événements vasculaires majeurs. TNT (2005) : l’atorvastatine 80 mg a réduit les événements davantage que 10 mg chez le coronarien stable.</p>
<div class="lab">Posologie</div><p>Atorvastatine 40–80 mg/jour ou rosuvastatine 20–40 mg/jour, quel que soit le LDL de départ. Rosuvastatine contre-indiquée si la clairance est &lt; 30 mL/min ; 40 mg contre-indiqués si la clairance est &lt; 60 mL/min (information professionnelle).</p>
<div class="lab">Effets indésirables</div><p>Symptômes musculaires (souvent non imputables dans les essais en aveugle), myopathie rare, rhabdomyolyse exceptionnelle ; élévation des transaminases ; léger risque de diabète, dépassé par le bénéfice.</p>
<div class="lab">Contre-indications</div><p>Hépatopathie active, grossesse et allaitement. Interactions : clarithromycine, ciclosporine, gemfibrozil ; simvastatine limitée avec amlodipine, diltiazem, vérapamil, ranolazine.</p>
<div class="lab">Surveillance</div><p>Bilan lipidique et transaminases à 4–6 semaines ; créatine kinase seulement en cas de symptômes.</p></template>

<template data-pop="i25-d-cardiomet" data-title="iSGLT2 et agonistes du GLP-1 en prévention cardiovasculaire">
<div class="lab">Diabète de type 2 avec SCC</div><p>Un iSGLT2 et un agoniste du récepteur du GLP-1 réduisent les événements cardiovasculaires, indépendamment de l’HbA1c (classe I, ESC 2024). Essais : EMPA-REG OUTCOME (empagliflozine), LEADER (liraglutide), SUSTAIN-6 (sémaglutide).</p>
<div class="lab">Obésité sans diabète</div><p>Sémaglutide 2,4 mg par semaine chez le patient ayant une maladie cardiovasculaire et un indice de masse corporelle ≥ 27 kg/m² : réduction de 20 % des événements cardiovasculaires majeurs dans l’essai SELECT (2023) ; classe IIa (ESC 2024).</p>
<div class="lab">Mécanismes</div><p>Agonistes du GLP-1 : perte de poids, baisse de la pression et de la glycémie, effets anti-inflammatoires et anti-athérogènes probables. iSGLT2 : natriurèse, effets rénaux et hémodynamiques.</p>
<div class="lab">Posologie du sémaglutide</div><p>0,25 mg par semaine, augmentée toutes les 4 semaines jusqu’à 2,4 mg.</p>
<div class="lab">Effets indésirables</div><p>Agonistes du GLP-1 : nausées, vomissements, lithiase biliaire, pancréatite rare. iSGLT2 : infections génitales, acidocétose euglycémique rare.</p>
<div class="lab">Contre-indications</div><p>Agonistes du GLP-1 : antécédent personnel ou familial de carcinome médullaire de la thyroïde ou de néoplasie endocrinienne multiple de type 2, grossesse. iSGLT2 : diabète de type 1, grossesse.</p>
<div class="lab">Surveillance</div><p>Poids, tolérance digestive, fonction rénale, glycémie en cas d’association à l’insuline ou aux sulfonylurées. Remboursement suisse selon les limitations de la liste des spécialités.</p></template>
