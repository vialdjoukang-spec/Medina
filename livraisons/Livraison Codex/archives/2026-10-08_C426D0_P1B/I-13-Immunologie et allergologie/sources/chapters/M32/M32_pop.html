<template data-pop="m32-ana" data-title="Anticorps antinucléaires"><p>Dépistés par immunofluorescence indirecte sur cellules HEp-2 ; résultat en titre et en aspect (homogène, moucheté, nucléolaire, centromère). Titre ≥ 1:80 : critère d’entrée du lupus. Très sensibles, peu spécifiques : présents à faible titre chez 5 à 15 % des sujets sains. Toujours préciser la spécificité (anti-ADN double brin, anti-ENA).</p></template>
<template data-pop="m32-compl" data-title="Complément dans le lupus"><p>La poussée active la voie classique : C3 et C4 baissent, CH50 baisse. Leur remontée accompagne la rémission. Un C4 bas permanent peut refléter un déficit génétique partiel, qui est aussi un facteur de risque de lupus.</p></template>
<template data-pop="m32-peau" data-title="Lupus cutané"><p><b>Aigu</b> : érythème malaire en ailes de papillon épargnant les sillons nasogéniens, photosensible, corrélé à l’activité. <b>Subaigu</b> : lésions annulaires ou psoriasiformes des zones exposées, anti-SSA. <b>Discoïde</b> : plaques atrophiques cicatricielles, alopécie définitive. Photoprotection et hydroxychloroquine pour toutes les formes.</p></template>
<template data-pop="m32-nephr" data-title="Néphrite lupique"><p>Glomérulonéphrite à complexes immuns ; classification ISN/RPS (I à VI). Dépistage à chaque visite : pression artérielle, bandelette, rapport protéines/créatinine, sédiment. Biopsie si protéinurie ≥ 0,5 g par 24 heures, hématurie glomérulaire ou baisse de la filtration. Induction : mycophénolate ou cyclophosphamide à faible dose, ± bélimumab ou inhibiteur de la calcineurine ; bloqueur du système rénine-angiotensine.</p></template>
<template data-pop="m32-np" data-title="Lupus neuropsychiatrique"><p>L’ACR décrit 19 syndromes centraux et périphériques. Mécanismes : vasculopathie, thromboses liées aux anticorps antiphospholipides, auto-anticorps neuronaux, inflammation. Démarche : exclure infection, troubles métaboliques, effets des médicaments (corticostéroïdes) ; IRM, ponction lombaire, électroencéphalogramme ; traitement immunosuppresseur (inflammatoire) ou anticoagulant (thrombotique), symptomatique (antipsychotique, antiépileptique).</p></template>
<template data-pop="m32-ac" data-title="Auto-anticorps spécifiques"><p><b>Anti-ADN double brin</b> : spécifiques, suivent l’activité et la néphrite. <b>Anti-Sm</b> : très spécifiques. <b>Anti-SSA/SSB</b> : Sjögren, lupus subaigu, lupus néonatal. <b>Anti-RNP</b> : connectivite mixte. <b>Anti-histones</b> : lupus induit. <b>Antiphospholipides</b> : thromboses, pertes fœtales.</p></template>
<template data-pop="m32-sledai" data-title="Scores SLEDAI-2K et SLICC"><p><b>SLEDAI-2K</b> : 24 items pondérés sur les 30 derniers jours (convulsions, psychose, vascularite, arthrite, protéinurie, anti-ADN, complément…) ; 0 : inactif ; ≥ 6 : activité modérée à élevée. <b>Indice de dommage SLICC</b> : lésions irréversibles depuis le début de la maladie (persistantes ≥ 6 mois).</p></template>
<template data-pop="m32-d-hcq" data-title="Hydroxychloroquine"><p>Inhibe la signalisation des récepteurs Toll endosomaux et la présentation antigénique. Bénéfices : moins de poussées, de thromboses, de dommages, de mortalité ; protection du fœtus (bloc cardiaque). Dose ≤ 5 mg/kg de poids réel par jour. Effets : troubles digestifs, rétinopathie (dépistage par tomographie en cohérence optique et champ visuel), QT, rares cardiomyopathies. Concentrations sanguines utiles pour vérifier l’adhésion.</p></template>
<template data-pop="m32-d-bio" data-title="Biothérapies du lupus"><p><b>Bélimumab</b> : anticorps anti-BLyS (facteur de survie des lymphocytes B) ; réduit poussées et corticostéroïdes, efficace dans la néphrite (BLISS-LN). <b>Anifrolumab</b> : anti-récepteur de l’interféron de type I (TULIP) ; efficace sur la peau et l’activité globale ; zona. <b>Rituximab</b> : anti-CD20, formes réfractaires hors indication officielle.</p></template>
<template data-pop="pareto-m32-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="m32-0,m32-1,m32-2,m32-3,m32-4,m32-5"></p><ul><li>Auto-immunité anti-noyau, complexes immuns, complément consommé, interféron de type I.</li><li>Femme jeune (9:1) ; mortalité précoce : activité et infections ; tardive : cardiovasculaire.</li><li>Déclencheurs : soleil, œstrogènes, arrêt de l’hydroxychloroquine, médicaments inducteurs (hydralazine, procaïnamide, isoniazide, chlorpromazine, carbamazépine, anti-TNF).</li><li>Clinique : fatigue, arthrite non érosive, érythème malaire, aphtes, lymphopénie, sérites, néphrite, atteinte neuropsychiatrique.</li><li>Psychose : lupus, corticostéroïdes ou infection.</li></ul></template>
<template data-pop="pareto-m32-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="m32-6"></p><ul><li>Anticorps antinucléaires HEp-2 ≥ 1:80 (entrée), puis anti-ADN double brin, anti-Sm, SSA/SSB, RNP, antiphospholipides.</li><li>C3, C4, formule, Coombs, créatinine, rapport protéines/créatinine, sédiment.</li><li>Différentiels : infections, polyarthrite, autres connectivites, lupus induit.</li></ul></template>
<template data-pop="pareto-m32-tt" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="m32-7,m32-8"></p><ul><li>Urgences : néphrite proliférative, neurolupus, cytopénies, syndrome catastrophique des antiphospholipides, infections (CRP élevée), tamponnade.</li><li>Hydroxychloroquine pour toutes ; photoprotection ; corticostéroïdes ≤ 5 mg/jour en entretien.</li><li>Méthotrexate, azathioprine, mycophénolate ; bélimumab, anifrolumab ; rituximab.</li><li>Néphrite III–IV : mycophénolate ou Euro-Lupus ± bélimumab ou inhibiteur de la calcineurine ; bloqueur rénine-angiotensine.</li></ul></template>
<template data-pop="pareto-m32-crit" data-title="Pareto — Suivi, grossesse et critères"><p class="ratio" data-cover="m32-9,m32-10,m32-11"></p><ul><li>Suivi : SLEDAI-2K, urines, complément, anti-ADN ; rétine, os, cœur, col utérin.</li><li>Grossesse : maladie inactive 6 mois, hydroxychloroquine, azathioprine, aspirine ; anti-SSA : échocardiographie fœtale 16–26 semaines ; pas d’œstrogènes si antiphospholipides.</li><li>EULAR/ACR 2019 : anticorps antinucléaires ≥ 1:80 + ≥ 10 points dont un clinique.</li></ul></template>
<template data-pop="pareto-m32-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="m32-e-1,m32-e-2"></p><ul><li>Anticorps antinucléaires : sensibles, peu spécifiques ; anti-ADN double brin et anti-Sm : spécifiques.</li><li>Complément bas = activité ; CRP élevée = infection ou sérite.</li><li>Protéinurie &gt; 0,5 g/g, cylindres : biopsie, classes ISN/RPS.</li><li>Antiphospholipides persistants à 12 semaines.</li></ul></template>
<template data-pop="pareto-m32-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="m32-p-1,m32-p-2"></p><ul><li>Hydroxychloroquine ≤ 5 mg/kg/jour, jamais arrêtée pendant la grossesse ; rétine, QT.</li><li>Tératogènes : mycophénolate, méthotrexate, cyclophosphamide ; azathioprine compatible (TPMT, allopurinol).</li><li>Syndrome des antiphospholipides : antivitamine K, pas d’anticoagulant oral direct si triple positivité.</li></ul></template>
