<div class="chap-body">
<section class="ilot" id="m32-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 27 ans présente depuis deux mois des douleurs des poignets et des doigts, une fatigue intense, une éruption du visage apparue après un séjour au soleil et des aphtes indolores du palais. La formule sanguine montre 2 800 leucocytes/µL et 110 000 plaquettes/µL. La question du chapitre : <b>s’agit-il d’un lupus érythémateux systémique, comment le prouver, quels organes sont menacés et comment protéger le rein, le cerveau et les grossesses futures ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître les manifestations cutanées, articulaires, hématologiques, séreuses, rénales et neuropsychiatriques, interpréter les auto-anticorps et le complément, appliquer les critères EULAR/ACR 2019, dépister la néphrite lupique, prescrire l’hydroxychloroquine et conduire une grossesse lupique.</p>
<div class="key"><b>Prérequis.</b> Les <button class="w" data-k="m32-ana">anticorps antinucléaires (dépistage)</button> et le <button class="w" data-k="m32-compl">complément comme marqueur d’activité</button>.</div>
</section>
<section class="ilot" id="m32-1"><h2><span class="n">1</span>Définition et formes</h2>
<p>Le lupus érythémateux systémique est une <b>maladie auto-immune systémique</b>, évoluant par poussées, caractérisée par la production d’<b>auto-anticorps dirigés contre des constituants du noyau</b> et par des lésions d’organes dues aux complexes immuns, au complément et à l’inflammation. Il peut toucher tous les organes ; sa présentation est donc très variable d’une patiente à l’autre.</p>
<div class="two"><div class="card"><h4>Lupus cutané isolé</h4><p>Lupus discoïde (lésions cicatricielles, alopécie définitive), lupus subaigu (annulaire, photosensible, anticorps anti-SSA) : une minorité évolue vers une forme systémique.</p></div>
<div class="card"><h4>Lupus induit par les médicaments</h4><p>Hydralazine, procaïnamide, isoniazide, minocycline, anti-TNF, et en psychiatrie chlorpromazine et carbamazépine : arthralgies, sérites, anticorps anti-histones ; atteintes rénale et neurologique rares ; régression à l’arrêt du médicament.</p></div></div>
</section>
<section class="ilot" id="m32-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Prévalence d’environ 20 à 150 pour 100 000 selon les populations ; <b>neuf femmes pour un homme</b> ; début typique entre 15 et 45 ans. Plus fréquent et plus sévère chez les personnes d’ascendance africaine, asiatique et hispanique. La survie à dix ans dépasse aujourd’hui 90 % dans les pays à haut revenu. La mortalité suit une courbe bimodale : précocement, activité de la maladie (rein, système nerveux) et infections ; tardivement, <b>maladies cardiovasculaires</b> (athérosclérose accélérée) et séquelles des corticostéroïdes.</p>
</section>
<section class="ilot" id="m32-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Terrain génétique</b> : déficits en C1q, C2, C4 (clairance des débris), variants de la voie de l’interféron. <b>Défaut d’élimination des cellules apoptotiques</b> : les antigènes nucléaires restent exposés. <b>Signature interféron de type I</b> : les cellules dendritiques plasmacytoïdes produisent de l’interféron alpha, qui active lymphocytes B et T. <b>Auto-anticorps et complexes immuns</b> : ils se déposent dans le rein, la peau, les séreuses, activent le complément (d’où C3 et C4 bas) et attirent les neutrophiles. <b>Cytopénies</b> : destruction périphérique par anticorps.</p>
<div class="key"><b>Corrélation physiopathologie → examens et traitement.</b> Les complexes immuns expliquent la consommation du complément et les dépôts rénaux ; l’interféron explique la cible de l’anifrolumab ; l’activation des lymphocytes B explique le bélimumab et le rituximab ; l’exposition aux ultraviolets, qui augmente l’apoptose des kératinocytes, explique la photosensibilité et la nécessité de la photoprotection.</div>
</section>
<section class="ilot" id="m32-4"><h2><span class="n">4</span>Facteurs déclenchants</h2>
<p>Exposition solaire, œstrogènes (contraception œstroprogestative chez les patientes à risque, grossesse, post-partum), infections virales (virus d’Epstein-Barr), tabac, médicaments inducteurs, arrêt de l’hydroxychloroquine (principale cause évitable de poussée).</p>
</section>
<section class="ilot" id="m32-5"><h2><span class="n">5</span>Manifestations cliniques</h2>
<table class="t"><tr><th>Domaine</th><th>Manifestations</th><th>Fréquence approximative</th></tr>
<tr><td>Général</td><td>Fatigue, fièvre (exclure d’abord une infection), amaigrissement</td><td>≈ 80 %</td></tr>
<tr><td>Articulaire</td><td>Polyarthrite ou arthralgies inflammatoires, <b>non érosives</b> ; déformations réductibles (Jaccoud)</td><td>≈ 80–90 %</td></tr>
<tr><td>Cutanéo-muqueux</td><td><button class="w" data-k="m32-peau">Éruption malaire « en vespertilio »</button>, photosensibilité, ulcérations buccales indolores, alopécie non cicatricielle, lupus discoïde, vascularite, Raynaud</td><td>≈ 70–80 %</td></tr>
<tr><td>Hématologique</td><td>Leucopénie et <b>lymphopénie</b>, thrombopénie, anémie hémolytique auto-immune</td><td>≈ 50–60 %</td></tr>
<tr><td>Séreuses</td><td>Pleurésie, péricardite</td><td>≈ 30–50 %</td></tr>
<tr><td>Rénal</td><td><button class="w" data-k="m32-nephr">Néphrite lupique</button> : protéinurie, hématurie, cylindres, hypertension, insuffisance rénale</td><td>≈ 30–50 %, souvent dans les 5 premières années</td></tr>
<tr><td>Neuropsychiatrique</td><td><button class="w" data-k="m32-np">Lupus neuropsychiatrique</button> : céphalées, crises épileptiques, psychose, état confusionnel, accident vasculaire cérébral, troubles cognitifs, neuropathies</td><td>Très variable selon la définition</td></tr>
<tr><td>Autres</td><td>Syndrome des antiphospholipides associé (thromboses, pertes fœtales), myocardite, endocardite de Libman-Sacks, pneumopathie, adénopathies, syndrome sec</td><td>—</td></tr></table>
<div class="trap"><span class="k">Piège</span>Une <b>psychose</b> chez une patiente lupique peut être due au lupus, aux corticostéroïdes (surtout à partir de 40 mg par jour de prednisone, dans les premières semaines) ou à une infection du système nerveux central. La chronologie, l’imagerie, la ponction lombaire et l’activité sérologique orientent ; le traitement diffère radicalement.</div>
<button class="pareto-btn ui" data-k="pareto-m32-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button>
</section>
<section class="ilot" id="m32-6"><h2><span class="n">6</span>Démarche diagnostique</h2>
<p><b>Étape 1</b> : anticorps antinucléaires par immunofluorescence indirecte sur cellules HEp-2. Un titre ≥ 1:80 est la porte d’entrée des critères ; négatifs, ils rendent le lupus très improbable. <b>Étape 2</b> : spécificité — <button class="w" data-k="m32-ac">anti-ADN double brin, anti-Sm, anti-SSA, anti-SSB, anti-RNP</button>, anticorps antiphospholipides. <b>Étape 3</b> : complément C3 et C4, formule sanguine, test de Coombs, créatinine, <b>rapport protéines/créatinine urinaire</b> et sédiment urinaire (hématies déformées, cylindres). <b>Étape 4</b> : bilan d’organe selon la clinique (échocardiographie, radiographie thoracique, IRM cérébrale, biopsie rénale si protéinurie ≥ 0,5 g par 24 heures ou sédiment actif).</p>
<table class="t"><tr><th>Diagnostic différentiel</th><th>Argument</th></tr>
<tr><td>Infections (parvovirus B19, virus d’Epstein-Barr, VIH, endocardite)</td><td>Sérologies, hémocultures ; anticorps antinucléaires transitoires possibles</td></tr>
<tr><td>Polyarthrite rhumatoïde</td><td>Érosions, anticorps anti-peptides citrullinés</td></tr>
<tr><td>Autres connectivites</td><td>Sclérodermie (anti-centromère, anti-Scl-70), Sjögren (anti-SSA/SSB isolés), dermatomyosite, connectivite mixte (anti-RNP isolés à titre élevé)</td></tr>
<tr><td>Lupus induit</td><td>Médicament, anti-histones, anti-ADN double brin habituellement absents</td></tr>
<tr><td>Hémopathies, vascularites</td><td>Frottis, ANCA</td></tr></table>
<button class="pareto-btn ui" data-k="pareto-m32-diag">▲ Loi de Pareto — Démarche diagnostique</button>
</section>
