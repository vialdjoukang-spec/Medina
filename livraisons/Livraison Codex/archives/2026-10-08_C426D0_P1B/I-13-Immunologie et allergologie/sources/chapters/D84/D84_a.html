<section class="ilot" id="d84-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 34 ans a eu quatre pneumonies en trois ans, deux sinusites traitées chaque hiver et une diarrhée chronique à <i>Giardia</i>. Elle a aussi une thrombopénie auto-immune. La question qui structure le chapitre est la suivante : <b>ces infections sont-elles le signe d’un déficit immunitaire, quel compartiment de l’immunité est touché, comment le prouver, et quel traitement réduira infections et complications ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître les signes d’alerte, relier le type de germe au compartiment déficitaire, exclure d’abord un déficit secondaire, demander le bilan de première ligne, reconnaître les tableaux majeurs (déficit immunitaire commun variable, agammaglobulinémie, déficit en IgA, déficit combiné sévère, granulomatose septique chronique, déficits du complément, angio-œdème héréditaire) et poser l’indication d’une substitution en immunoglobulines.</p>
<div class="key"><b>Prérequis.</b> Les <button class="w" data-k="d84-comp">quatre compartiments de l’immunité (anticorps, lymphocytes T, phagocytes, complément)</button> et la <button class="w" data-k="d84-germes">règle « type de germe → compartiment »</button>. Ils sont développés dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="d84-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Un déficit immunitaire est une altération quantitative ou fonctionnelle d’un ou de plusieurs composants du système immunitaire, qui expose à des infections <b>anormalement fréquentes, graves, prolongées, récidivantes ou dues à des germes inhabituels</b>, et souvent à l’auto-immunité, à l’inflammation, à la lymphoprolifération et aux cancers.</p>
<p>On distingue les déficits <b>primaires</b>, désormais appelés <button class="w" data-k="d84-iei">erreurs innées de l’immunité</button> (d’origine génétique, plus de 500 gènes dans la classification de l’International Union of Immunological Societies, IUIS, 2024), et les déficits <b>secondaires</b> (médicaments, hémopathies, pertes protéiques, infection par le VIH, asplénie), <b>bien plus fréquents</b> chez l’adulte.</p>
<h3>1.1 Classification IUIS simplifiée, selon le compartiment</h3>
<table class="t"><tr><th>Groupe</th><th>Exemples</th><th>Germes typiques</th></tr>
<tr><td><b>Déficits de l’immunité humorale</b> (anticorps) — environ la moitié des déficits primaires</td><td>Déficit immunitaire commun variable, agammaglobulinémie liée à l’X, déficit sélectif en IgA, déficit en sous-classes d’IgG, défaut de réponse aux polysaccharides</td><td>Bactéries encapsulées (pneumocoque, <i>Haemophilus</i>), entérovirus, <i>Giardia</i></td></tr>
<tr><td><b>Déficits combinés</b> (lymphocytes T et B)</td><td>Déficit immunitaire combiné sévère, syndrome hyper-IgM, syndrome de Wiskott-Aldrich, microdélétion 22q11.2</td><td>Opportunistes : <i>Pneumocystis</i>, <i>Candida</i>, virus (cytomégalovirus), mycobactéries, BCG</td></tr>
<tr><td><b>Déficits des phagocytes</b></td><td>Granulomatose septique chronique, neutropénies congénitales, déficit d’adhésion leucocytaire</td><td>Staphylocoque doré, <i>Aspergillus</i>, <i>Serratia</i>, <i>Burkholderia</i>, <i>Nocardia</i></td></tr>
<tr><td><b>Déficits du complément</b></td><td>Voie terminale C5 à C9, C3, voie classique (C1q, C2, C4), déficit en inhibiteur de la C1 estérase</td><td><i>Neisseria</i> (méningocoque) ; bactéries encapsulées ; lupus ; angio-œdème</td></tr>
<tr><td><b>Dysrégulation immunitaire, défauts de l’immunité innée</b></td><td>Lymphohistiocytose hémophagocytaire familiale, IPEX, défauts de la voie interféron gamma, syndromes auto-inflammatoires</td><td>Selon le défaut ; mycobactéries dans les défauts de l’axe IL-12–interféron gamma</td></tr></table>
<h3>1.2 Codage CIM-10-GM</h3>
<p>D80 : déficits à prédominance humorale (D80.0 hypogammaglobulinémie héréditaire, D80.2 déficit sélectif en IgA). D81 : déficits combinés (D81.9 déficit combiné sans précision). D82 : déficits associés à d’autres anomalies majeures (D82.0 Wiskott-Aldrich, D82.1 syndrome de DiGeorge). D83 : déficit immunitaire commun variable. D84 : autres déficits, dont <b>D84.1 anomalies du complément, incluant le déficit en inhibiteur de la C1 estérase</b>.</p>
</section>

<section class="ilot" id="d84-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les erreurs innées de l’immunité, prises ensemble, touchent environ <b>1 personne sur 1 000 à 5 000</b> selon les registres, et le diagnostic est souvent retardé de plusieurs années. Le <b>déficit sélectif en IgA</b> est le plus fréquent (environ 1 sur 300 à 1 sur 700 chez les Européens), majoritairement asymptomatique. Le <b>déficit immunitaire commun variable</b> est le déficit primaire symptomatique le plus fréquent de l’adulte (environ 1 sur 25 000), avec un pic diagnostique entre 20 et 40 ans. En Suisse, le déficit combiné sévère est recherché à la naissance par le <button class="w" data-k="d84-trec">dépistage néonatal des TREC</button>.</p>
<p>Le pronostic dépend du compartiment et de la précocité du diagnostic : les déficits humoraux substitués ont une espérance de vie proche de la normale en l’absence de complications non infectieuses ; celles-ci (auto-immunité, granulomatose, lymphome, bronchectasies) déterminent le pronostic du déficit immunitaire commun variable. Le déficit combiné sévère est mortel dans la première année sans greffe de cellules souches hématopoïétiques ; greffé avant 3,5 mois et sans infection, la survie dépasse 90 %.</p>
</section>

<section class="ilot" id="d84-3"><h2><span class="n">3</span>Physiopathologie : quel compartiment, quels germes</h2>
<p>Chaque compartiment défend contre une famille de pathogènes. Cette correspondance est l’outil diagnostique le plus utile : <b>le germe désigne le compartiment</b>.</p>
<figure><svg viewBox="0 0 640 210" role="img" aria-label="Compartiments immunitaires et germes" font-family="Inter,sans-serif" font-size="11"><g fill="none" stroke="#222" stroke-width="1.2"><rect x="10" y="20" width="146" height="170" rx="8"/><rect x="170" y="20" width="146" height="170" rx="8"/><rect x="330" y="20" width="146" height="170" rx="8"/><rect x="490" y="20" width="140" height="170" rx="8"/><path d="M10 62h146M170 62h146M330 62h146M490 62h140"/></g>

<text x="243" y="38" font-weight="700">Lymphocytes T</text><text x="243" y="54">immunité cellulaire</text><text x="243" y="86">Virus (herpès,</text><text x="243" y="100">cytomégalovirus),</text><text x="243" y="114"><tspan font-style="italic">Pneumocystis</tspan>, <tspan font-style="italic">Candida</tspan>,</text><text x="243" y="128">mycobactéries</text><text x="243" y="150">Début précoce,</text><text x="243" y="164">retard de croissance</text>

<p>Au-delà des infections, un déficit immunitaire est souvent une <b>maladie de la régulation</b> : un système immunitaire incomplet perd aussi ses mécanismes de tolérance. D’où l’association fréquente à l’<b>auto-immunité</b> (cytopénies auto-immunes, thyroïdite), aux <b>granulomes</b>, à la <b>lymphoprolifération</b> (adénopathies, splénomégalie) et aux <b>lymphomes</b>.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Un défaut d’anticorps se manifeste rarement avant 4 à 6 mois, car les IgG maternelles transmises par le placenta protègent le nourrisson : voir la <button class="w" data-k="d84-nadir">courbe des IgG du nourrisson</button>. Un défaut des lymphocytes T se manifeste dès les premières semaines.</div>
</section>

<section class="ilot" id="d84-4"><h2><span class="n">4</span>Déficits secondaires : à exclure d’abord</h2>
<table class="t"><tr><th>Cause</th><th>Mécanisme et indice</th></tr>
<tr><td><b>Médicaments</b></td><td>Rituximab et autres anti-CD20 (hypogammaglobulinémie parfois durable), corticostéroïdes, immunosuppresseurs, chimiothérapies, antiépileptiques (phénytoïne, carbamazépine, lamotrigine : baisse des IgA ou IgG), clozapine (neutropénie)</td></tr>
<tr><td><b>Hémopathies</b></td><td>Leucémie lymphoïde chronique, myélome (IgG polyclonales basses avec pic monoclonal) : électrophorèse et immunofixation des protéines</td></tr>
<tr><td><b>Pertes protéiques</b></td><td>Syndrome néphrotique (protéinurie), entéropathie exsudative, brûlures étendues : IgG et albumine basses ensemble</td></tr>
<tr><td><b>Infection par le VIH</b></td><td>Lymphocytes T CD4 bas ; sérologie systématique</td></tr>
<tr><td><b>Asplénie</b></td><td>Splénectomie, drépanocytose : infections fulminantes à germes encapsulés ; corps de Howell-Jolly au frottis</td></tr>
<tr><td><b>Autres</b></td><td>Dénutrition, diabète mal équilibré, cirrhose, insuffisance rénale chronique, âge avancé</td></tr></table>
<div class="trap"><span class="k">Piège</span>Chez un adulte, une hypogammaglobulinémie découverte récemment est <b>secondaire jusqu’à preuve du contraire</b>. L’électrophorèse des protéines avec immunofixation, la protéinurie et la liste des médicaments précèdent toute hypothèse génétique.</div>
</section>

<section class="ilot" id="d84-5"><h2><span class="n">5</span>Anamnèse et signes d’alerte</h2>
<p>L’anamnèse cherche le <b>profil infectieux</b> : nombre, localisation, sévérité, germes, réponse aux antibiotiques. Une infection banale mais <b>trop fréquente</b> (sinusites, pneumonies), <b>trop grave</b> (méningite, sepsis), <b>trop longue</b> (antibiotiques inefficaces, voie intraveineuse nécessaire) ou <b>due à un germe inhabituel</b> doit faire évoquer un déficit.</p>
<div class="two">
<div class="card"><h4>Signes d’alerte chez l’adulte (inspirés de l’ESID)</h4><p>Au moins deux pneumonies en un an ou quatre otites ou sinusites par an ; infection sévère ou récidivante nécessitant des antibiotiques intraveineux ; infection à germe opportuniste ; diarrhée chronique avec amaigrissement ; auto-immunité ou granulomatose inexpliquée ; bronchectasies sans cause ; antécédent familial de déficit immunitaire.</p></div>
<div class="card"><h4>Signes d’alerte chez l’enfant</h4><p>Infections répétées de la sphère oto-rhino-laryngée et pulmonaire ; retard de croissance ; candidose buccale persistante après un an ; abcès profonds récidivants ; complication d’un vaccin vivant (BCG, rotavirus) ; chute retardée du cordon ombilical ; antécédent familial ou consanguinité.</p></div></div>
<p>Rechercher aussi : médicaments (îlot 4), transfusions et réactions transfusionnelles (anaphylaxie chez le déficitaire en IgA ayant des anticorps anti-IgA), vaccinations reçues et leur tolérance, consanguinité, décès précoces dans la famille, <b>épisodes d’œdème sans urticaire</b> (angio-œdème héréditaire).</p>
</section>

<section class="ilot" id="d84-6"><h2><span class="n">6</span>Examen clinique</h2>
<div class="two">
<div class="card"><h4>État général et croissance</h4><p>Poids, taille et courbe de croissance chez l’enfant ; indice de masse corporelle chez l’adulte (malabsorption).</p></div>
<div class="card"><h4>Tissu lymphoïde</h4><p><b>Absence d’amygdales et de ganglions</b> : agammaglobulinémie ou déficit combiné. <b>Adénopathies et splénomégalie</b> : déficit immunitaire commun variable, dysrégulation, lymphome.</p></div>
<div class="card"><h4>Signes d’infections chroniques</h4><p>Râles fixes et hippocratisme (bronchectasies), tympans cicatriciels, candidose buccale, abcès, gingivite, verrues étendues.</p></div>
<div class="card"><h4>Signes associés orientants</h4><p>Eczéma et pétéchies (Wiskott-Aldrich) ; faciès, cardiopathie conotroncale et hypocalcémie (22q11.2) ; télangiectasies oculaires et ataxie (ataxie-télangiectasie) ; eczéma, abcès froids et fractures (syndrome hyper-IgE) ; albinisme partiel (Chédiak-Higashi).</p></div></div>
