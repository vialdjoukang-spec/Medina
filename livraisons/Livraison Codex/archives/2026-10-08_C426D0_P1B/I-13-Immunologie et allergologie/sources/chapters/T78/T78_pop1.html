<template data-pop="t78-hs" data-title="Hypersensibilité : allergique ou non">
<div class="lab">Définition</div><p>Symptômes reproductibles déclenchés par une exposition à une dose tolérée par les sujets normaux (nomenclature EAACI/WAO).</p>
<div class="lab">Allergique</div><p>Mécanisme immunologique spécifique : IgE (immédiate), lymphocytes T (retardée), plus rarement IgG ou complexes immuns.</p>
<div class="lab">Non allergique</div><p>Activation directe des mastocytes (MRGPRX2, complément), inhibition enzymatique (cyclo-oxygénase 1), pharmacologique. Pas de sensibilisation préalable ; première exposition possible ; tests cutanés souvent négatifs.</p>
<div class="lab">Conséquence</div><p>Le mécanisme détermine les tests, le risque croisé et les possibilités de réintroduction.</p></template>
<template data-pop="t78-masto" data-title="Le mastocyte et ses médiateurs">
<p>Cellule tissulaire d’origine médullaire, concentrée autour des vaisseaux, sous les épithéliums de la peau, des voies respiratoires et du tube digestif. Porte le récepteur FcεRI (IgE) et, pour certains, MRGPRX2. Médiateurs préformés : histamine, tryptase, chymase, héparine ; néoformés : leucotriènes cystéinylés, PGD₂, facteur d’activation plaquettaire ; cytokines. La tryptase est son marqueur biologique spécifique.</p></template>
<template data-pop="t78-sensib" data-title="Sensibilisation n’est pas allergie">
<p>La <b>sensibilisation</b> est la présence d’IgE spécifiques (test cutané ou sanguin positif). L’<b>allergie</b> exige des symptômes reproductibles à l’exposition. Exemple : 8 % des enfants sont sensibilisés à l’arachide, mais seulement 1 à 2 % y sont allergiques. Un test positif sans anamnèse évocatrice ne justifie pas d’éviction ; le test de provocation tranche en cas de doute.</p></template>
<template data-pop="t78-mrg" data-title="Récepteur MRGPRX2">
<p>Récepteur couplé aux protéines G (récepteur apparenté à Mas, couplé aux protéines G) exprimé par les mastocytes du tissu conjonctif (peau). Activé directement par des molécules cationiques : opiacés (morphine, codéine), vancomycine, fluoroquinolones, curares (rocuronium, atracurium), icatibant. Réactions dose-dépendantes, non allergiques, souvent limitées à la peau (flush, urticaire, prurit) mais parfois systémiques. Le ralentissement de la perfusion en réduit l’intensité.</p></template>
<template data-pop="t78-mastocyt" data-title="Mastocytose et troubles de l’activation mastocytaire">
<div class="lab">Mastocytose systémique (OMS)</div><p>Critère majeur : infiltrats denses de mastocytes (≥ 15 cellules en amas) dans la moelle ou un organe extracutané. Critères mineurs : &gt; 25 % de mastocytes fusiformes ou atypiques ; mutation KIT D816V ; expression de CD25 et/ou CD2 et/ou CD30 ; tryptase de base &gt; 20 µg/L. Diagnostic : critère majeur et un mineur, ou trois mineurs.</p>
<div class="lab">Clinique</div><p>Urticaire pigmentaire (signe de Darier), flushs, troubles digestifs, ostéoporose ; anaphylaxies sévères, souvent sans urticaire, surtout aux venins.</p>
<div class="lab">Syndrome d’activation mastocytaire</div><p>Épisodes récurrents multisystémiques, élévation de la tryptase selon la formule 20 % + 2, réponse aux médicaments anti-médiateurs.</p></template>
<template data-pop="t78-hypot" data-title="Seuils d’hypotension (WAO)">
<p><b>Adulte</b> : systolique &lt; 90 mmHg ou baisse &gt; 30 % par rapport à la valeur habituelle. <b>Enfant</b> : 1 mois à 1 an &lt; 70 mmHg ; 1 à 10 ans &lt; 70 + (2 × âge) mmHg ; 11 à 17 ans &lt; 90 mmHg ; ou baisse &gt; 30 %. Chez le nourrisson, tachycardie et hypotonie précèdent souvent l’hypotension.</p></template>
<template data-pop="t78-tryp" data-title="Tryptase : quand et comment">
<p>Prélever <b>30 minutes à 2 heures</b> après le début (jusqu’à 4 heures), sans retarder le traitement ; doser la <b>tryptase de base</b> au moins 24 heures après la résolution. Activation significative si aiguë &gt; 1,2 × base + 2 µg/L. Base &gt; 11,4 µg/L : mastocytose ou alpha-tryptasémie héréditaire ; &gt; 20 µg/L : critère mineur de mastocytose. Une tryptase normale n’exclut pas l’anaphylaxie, surtout alimentaire.</p></template>
<template data-pop="t78-crd" data-title="Diagnostic moléculaire (composants)">
<p>Dosage des IgE contre des protéines purifiées ou recombinantes d’une source allergénique. Distingue les <b>protéines stables</b> à risque systémique (albumines 2S comme Ara h 2, protéines de transfert lipidique comme Pru p 3, ovomucoïde) des <b>protéines labiles</b> à risque surtout buccal (PR-10 homologues de Bet v 1, profilines), identifie les réactions croisées (venins d’abeille et de guêpe) et oriente l’immunothérapie.</p></template>
<template data-pop="t78-penfast" data-title="Score PEN-FAST">
<p>Allergie à la pénicilline rapportée (point de départ du score). <b>F</b> (five) : réaction survenue il y a 5 ans ou moins = 2 points. <b>A/S</b> : anaphylaxie ou angio-œdème, ou réaction cutanée sévère = 2 points. <b>T</b> : traitement nécessaire de la réaction = 1 point. Score &lt; 3 : risque faible (valeur prédictive négative ≈ 96 %) : provocation orale directe possible ; score élevé : bilan allergologique complet. Aide à la décision, validée chez l’adulte.</p></template>
<template data-pop="t78-hla" data-title="HLA et toxidermies graves">
<p><b>HLA-B*15:02</b> : syndrome de Stevens-Johnson et nécrolyse à la carbamazépine et à la phénytoïne chez les patients originaires d’Asie du Sud-Est (dépistage recommandé avant prescription dans ces populations). <b>HLA-A*31:01</b> : DRESS et exanthèmes à la carbamazépine, y compris chez les Européens. <b>HLA-B*57:01</b> : hypersensibilité à l’abacavir (dépistage obligatoire). <b>HLA-B*58:01</b> : toxidermies graves à l’allopurinol. En psychiatrie, la lamotrigine impose une titration lente (risque dose- et vitesse-dépendant), surtout avec le valproate.</p></template>
