<template data-pop="m06-synov" data-title="Synovite"><p>Inflammation de la membrane synoviale : tuméfaction élastique, chaleur, douleur, épanchement. Cliniquement, un gonflement articulaire palpable distingue l’arthrite de la simple arthralgie. L’échographie Doppler la confirme et détecte les formes infracliniques.</p></template>
<template data-pop="m06-inflam" data-title="Douleur inflammatoire ou mécanique"><p><b>Inflammatoire</b> : réveils nocturnes, raideur matinale prolongée (&gt; 30 minutes), amélioration par le mouvement, signes locaux, CRP élevée. <b>Mécanique</b> : douleur à l’effort, calmée par le repos, raideur de dérouillage brève (&lt; 15 minutes).</p></template>
<template data-pop="m06-epitope" data-title="Épitope partagé"><p>Séquence d’acides aminés (positions 70 à 74) commune à plusieurs allèles HLA-DRB1 (DR4, DR1…), qui favorise la présentation des peptides citrullinés ; associé au risque et à la sévérité de la polyarthrite séropositive.</p></template>
<template data-pop="m06-citrul" data-title="Citrullination"><p>Transformation post-traductionnelle de l’arginine en citrulline par les peptidyl-arginine désiminases, activées par le tabac et l’inflammation. Les protéines citrullinées (fibrine, vimentine) deviennent des auto-antigènes ; les anticorps qui les ciblent sont les anticorps anti-peptides citrullinés.</p></template>
<template data-pop="m06-squeeze" data-title="Test de compression"><p>Compression latérale des quatre métacarpophalangiennes ou métatarsophalangiennes entre le pouce et les doigts de l’examinateur. Douleur = argument pour une synovite de ces articulations.</p></template>
<template data-pop="m06-sero" data-title="Facteur rhumatoïde et anticorps anti-peptides citrullinés"><p><b>Anticorps anti-peptides citrullinés</b> : très spécifiques (≈ 95 %), présents tôt, pronostiques. <b>Facteur rhumatoïde</b> : moins spécifique (Sjögren, hépatite C, infections chroniques, sujet âgé). La double positivité à titre élevé prédit les érosions. Environ 20 à 30 % des patients sont séronégatifs.</p></template>
<template data-pop="m06-das" data-title="Scores d’activité"><p><b>DAS28</b> : 28 articulations douloureuses et gonflées, CRP ou vitesse de sédimentation, évaluation globale du patient. Rémission &lt; 2,6 ; faible ≤ 3,2 ; modérée ≤ 5,1 ; élevée &gt; 5,1. <b>CDAI</b> (sans biologie) : rémission ≤ 2,8. <b>SDAI</b> : rémission ≤ 3,3. Le DAS28-CRP peut surestimer la rémission sous tocilizumab.</p></template>
<template data-pop="m06-d-mtx" data-title="Méthotrexate"><div class="lab">Mécanisme</div><p>À faible dose : libération d’adénosine anti-inflammatoire et inhibition d’enzymes de la voie des folates.</p><div class="lab">Posologie</div><p>15 mg une fois par semaine, augmenté jusqu’à 20–25 mg ; voie sous-cutanée si intolérance digestive ou réponse insuffisante ; acide folique 5–10 mg une fois par semaine.</p><div class="lab">Effets indésirables</div><p>Nausées, mucite, cytopénies, hépatotoxicité, pneumopathie d’hypersensibilité, tératogénicité.</p><div class="lab">Contre-indications</div><p>Grossesse et projet de grossesse, débit de filtration glomérulaire &lt; 30 mL/min, hépatopathie, alcoolisme, cytopénies.</p></template>
<template data-pop="m06-d-autres" data-title="Léflunomide, sulfasalazine, hydroxychloroquine"><p><b>Léflunomide</b> : inhibe la synthèse des pyrimidines ; diarrhée, hypertension, hépatotoxicité, tératogène (élimination par colestyramine). <b>Sulfasalazine</b> : compatible avec la grossesse ; troubles digestifs, cytopénies, oligospermie réversible. <b>Hydroxychloroquine</b> : effet modeste, en association ; rétinopathie dose-dépendante.</p></template>
<template data-pop="m06-d-bio" data-title="Biothérapies de la polyarthrite rhumatoïde"><p><b>Anti-TNF</b> : efficaces, surtout associés au méthotrexate ; risque d’infections, tuberculose ; contre-indiqués dans l’insuffisance cardiaque sévère et les maladies démyélinisantes. <b>Tocilizumab, sarilumab</b> (anti-récepteur de l’IL-6) : efficaces en monothérapie ; dyslipidémie, perforations digestives, CRP artificiellement normale. <b>Abatacept</b> : bon profil infectieux. <b>Rituximab</b> : séropositifs, antécédent de lymphome ; hypogammaglobulinémie. En Suisse : prescription selon la limitation de la liste des spécialités.</p></template>
<template data-pop="m06-d-jak" data-title="Inhibiteurs de JAK"><p>Petites molécules orales bloquant les kinases Janus. Efficacité comparable aux biothérapies. Risques : zona (vaccin recombinant avant), infections, thromboses veineuses, événements cardiovasculaires majeurs et cancers augmentés par rapport aux anti-TNF chez les patients à risque (ORAL Surveillance) : réserver, chez les plus de 65 ans, les fumeurs et les patients à risque, aux situations sans alternative.</p></template>
<template data-pop="pareto-m06-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="m06-0,m06-1,m06-2,m06-3,m06-4,m06-5,m06-6"></p><ul><li>Rhumatisme auto-immun : synovite symétrique des petites articulations, destruction ostéocartilagineuse, atteintes extra-articulaires.</li><li>Femme 40–60 ans ; tabac + HLA-DRB1 épitope partagé → citrullination → anticorps anti-peptides citrullinés années avant.</li><li>Pannus, TNF-α, IL-6, RANKL → érosions ; fenêtre thérapeutique précoce.</li><li>Raideur matinale &gt; 30–60 min, poignets, métacarpophalangiennes, interphalangiennes proximales, métatarsophalangiennes ; interphalangiennes distales épargnées.</li><li>Déformations tardives : cubitus, col de cygne, boutonnière ; nodules.</li></ul></template>
<template data-pop="pareto-m06-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="m06-7"></p><ul><li>Adresser en moins de 6 semaines toute arthrite inexpliquée.</li><li>CRP, vitesse de sédimentation, facteur rhumatoïde, anticorps anti-peptides citrullinés, anticorps antinucléaires, radiographies mains-pieds, échographie.</li><li>Différentiels : septique, viral (parvovirus, hépatites), lupus, psoriasique, cristaux, pseudo-polyarthrite rhizomélique, arthrose, hémochromatose.</li></ul></template>
<template data-pop="pareto-m06-tt" data-title="Pareto — Atteintes et traitement"><p class="ratio" data-cover="m06-8,m06-9"></p><ul><li>Urgences : rachis cervical, infection sous immunosuppresseurs, sclérite, vascularite, pneumopathie au méthotrexate.</li><li>Poumon interstitiel, athérosclérose, Felty, Sjögren, ostéoporose.</li><li>Traiter dès le diagnostic ; cible rémission ; amélioration à 3 mois, cible à 6 mois.</li><li>Méthotrexate hebdomadaire + acide folique ; corticostéroïdes courts ; échec + mauvais pronostic → biothérapie ou inhibiteur de JAK (prudence ORAL Surveillance).</li><li>Avant : tuberculose, hépatites, VIH, vaccins ; pas de vaccin vivant.</li></ul></template>
<template data-pop="pareto-m06-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="m06-10,m06-11,m06-12"></p><ul><li>DAS28 &lt; 2,6 rémission ; rémission booléenne 2022.</li><li>Désescalade prudente en rémission prolongée.</li><li>Grossesse : arrêter méthotrexate et léflunomide ; hydroxychloroquine, sulfasalazine, azathioprine, anti-TNF possibles.</li><li>ACR/EULAR 2010 : synovite + score ≥ 6/10 (articulations 0–5, sérologie 0–3, phase aiguë 0–1, durée ≥ 6 semaines 1).</li></ul></template>
<template data-pop="pareto-m06-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="m06-e-1,m06-e-2"></p><ul><li>Anticorps anti-peptides citrullinés : spécificité ≈ 95 % ; facteur rhumatoïde moins spécifique.</li><li>Liquide inflammatoire stérile sans cristaux.</li><li>Radiographie : ostéopénie en bande, pincement symétrique, érosions marginales (5e métatarsophalangienne) ; échographie Doppler ; IRM : œdème osseux.</li><li>Bilan préthérapeutique complet.</li></ul></template>
<template data-pop="pareto-m06-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="m06-p-1,m06-p-2"></p><ul><li>Méthotrexate 15 → 25 mg <b>par semaine</b>, acide folique ; surveillance sanguine, hépatique, rénale.</li><li>Méthotrexate + cotrimoxazole : toxicité médullaire ; erreur quotidienne mortelle.</li><li>Léflunomide tératogène ; hydroxychloroquine : rétine.</li><li>Biothérapies, inhibiteurs de JAK : infections, tuberculose, zona, thromboses.</li></ul></template>
