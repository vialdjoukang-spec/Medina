<template data-pop="i73-raynaud" data-title="Raynaud : reconnaître une crise"><p>La crise apparaît dans un territoire digital, souvent au froid, avec un changement net de couleur. La diminution du débit provoque la pâleur ; la désaturation du sang résiduel provoque la cyanose. Le retour sanguin peut provoquer une rougeur. Une photographie prise pendant la crise apporte un élément clinique utile lorsque l’examen est normal entre les épisodes.</p><p>Le médecin précise le déclencheur, la durée, la douleur, la symétrie et la récupération complète. Une simple sensation de mains froides ne suffit pas. Une couleur permanente ou une plaie impose une autre analyse.</p><div class="key"><b>À retenir.</b> La réversibilité distingue la crise fonctionnelle d’une hypoperfusion persistante ; elle ne suffit pas à exclure toute cause secondaire.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-primaire" data-title="Raynaud primaire : un ensemble cohérent"><p>Le qualificatif primaire signifie qu’aucune cause secondaire n’est identifiée. Le consensus exige un tableau clinique de Raynaud, une capillaroscopie normale, l’absence de signe secondaire à l’examen et l’absence de connectivite connue. Une sérologie négative ou un titre faible d’anticorps antinucléaires doit rester compatible avec le contexte.</p><p>Un ulcère, une gangrène ou une atteinte sclérodermique contredit l’hypothèse d’une simple forme primaire. Une crise bilatérale débutant jeune soutient cette hypothèse sans remplacer les critères. Une modification du tableau justifie une réévaluation.</p><div class="key"><b>À retenir.</b> Le diagnostic repose sur plusieurs dimensions ; aucun résultat isolé ne certifie une forme primaire.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-secondaire" data-title="Raynaud secondaire : spasme et substrat causal"><p>Une cause secondaire peut modifier la paroi, la lumière, le système de régulation ou la viscosité sanguine. Dans la sclérodermie, la perte capillaire et l’atteinte vasculaire réduisent la capacité à assurer un débit suffisant. Une crise ajoute une vasoconstriction à cette réserve déjà diminuée.</p><p>Le médecin recherche une maladie systémique, une obstruction, une exposition ou un médicament. Un pouce atteint, une asymétrie ou un début tardif peut renforcer la suspicion, sans être un critère diagnostique absolu. Une lésion digitale et une capillaroscopie pathologique ont davantage de conséquences pratiques.</p><div class="key"><b>À retenir.</b> La recherche causale guide la spécialité et le traitement ; elle ne se réduit pas au choix d’un vasodilatateur.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://iris.uniroma1.it/retrieve/e3835325-2581-15e8-e053-a505fe0a3de9/Smith_Standardisation_2020.pdf" target="_blank" rel="noopener">Standardisation capillaroscopique, Smith et al., 2020</a>.</p></template>
<template data-pop="i73-couleurs" data-title="Trois couleurs, trois états de perfusion"><p>La pâleur traduit une baisse importante de l’arrivée de sang dans la peau. La cyanose traduit l’augmentation de la fraction d’hémoglobine désaturée dans un débit réduit. La rougeur accompagne la reperfusion et une vasodilatation locale. Toutes les phases ne sont pas forcément observées.</p><p>Une douleur ou une paresthésie peut accompagner l’hypoperfusion. Sa persistance après réchauffement fait rechercher une atteinte structurelle. Une cyanose symétrique durable, sans alternance, évoque davantage une acrocyanose. Le médecin interprète la couleur avec la température, la durée et l’intégrité du tissu.</p><div class="key"><b>À retenir.</b> Une couleur décrit un état sanguin local ; elle ne nomme pas la maladie causale.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-connectivite" data-title="Signes systémiques : relier les organes"><p>Des doigts gonflés ou une sclérodactylie orientent vers une atteinte cutanée. Une dysphagie ou un reflux peut accompagner une atteinte digestive. Une dyspnée peut traduire une atteinte pulmonaire, vasculaire ou cardiaque. L’association avec un Raynaud et une microangiopathie fait rechercher une connectivite.</p><p>Chaque symptôme garde ses diagnostics différentiels. Un reflux isolé est fréquent et non spécifique ; une dyspnée nouvelle ne doit pas être attribuée au Raynaud. Une auto-immunité démontrée oriente le bilan sans remplacer l’examen organique. Le médecin hiérarchise les examens selon l’organe menacé.</p><div class="key"><b>À retenir.</b> La cohérence multisystémique augmente la probabilité ; un symptôme isolé ne prouve pas la cause.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39874231/" target="_blank" rel="noopener">Recommandations EULAR, mise à jour 2023, publication 2025</a>.</p></template>
<template data-pop="i73-tabac" data-title="Expositions : retrait et mécanisme"><p>Le tabac expose à des produits qui altèrent les vaisseaux et favorisent des réponses vasculaires défavorables. Dans la thromboangéite oblitérante, la poursuite de l’exposition est particulièrement problématique. La réduction seule peut laisser persister un stimulus suffisant ; le sevrage vise donc un arrêt complet des produits du tabac.</p><p>Une prise de cannabis, de cocaïne ou une exposition professionnelle se documente séparément. La nicotine contribue à la vasoconstriction, mais la maladie de Buerger ne se résume pas à cet effet. La stratégie de sevrage demande un accompagnement spécialisé et une discussion de chaque substitution. La causalité d’une exposition ne se déduit pas uniquement de sa présence.</p><div class="key"><b>À retenir.</b> Le médecin retire les expositions modifiables tout en explorant les autres causes d’ischémie.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.internationaljournalofcardiology.com/article/S0167-5273%2898%2900175-2/abstract" target="_blank" rel="noopener">Critères diagnostiques de Buerger, Shionoya, 1998</a>.</p></template>
<template data-pop="i73-medicaments" data-title="Vasoconstriction iatrogène : raisonner sur la chronologie"><p>Un sympathomimétique peut augmenter le tonus vasoconstricteur. Un bêtabloquant peut modifier l’équilibre vasculaire périphérique ; cet effet dépend de la molécule et du terrain. Certains traitements anticancéreux peuvent provoquer une atteinte vasculaire. Le médecin compare le début des symptômes à l’introduction ou à l’augmentation du médicament.</p><p>La présence d’un médicament suspect ne dispense pas de rechercher une connectivite ou une obstruction. L’arrêt ne se décide pas sans analyser son indication et le risque de retrait. Une substitution ou une adaptation peut réduire les symptômes sans compromettre le traitement causal d’une autre maladie.</p><div class="key"><b>À retenir.</b> La revue médicamenteuse est une intervention causale possible ; elle repose sur une balance clinique explicite.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-pouls" data-title="Pouls : technique et limites anatomiques"><p>Le médecin palpe les pouls accessibles, compare leur amplitude et leur symétrie, puis confronte le résultat à la pression et à la peau. Un pouls faible ou absent peut refléter une obstruction, une compression ou un faible débit général. L’échographie clarifie une anomalie significative.</p><p>Un pouls radial conservé prouve une pulsation dans cette artère proximale. Il ne prouve pas la perméabilité de toutes les artères digitales. Un doigt bleu douloureux peut résulter d’une embolie distale malgré ce pouls. La sensibilité et la force recherchent une menace fonctionnelle avancée.</p><div class="key"><b>À retenir.</b> Le niveau palpé et le territoire symptomatique doivent correspondre avant de conclure.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a>.</p></template>
<template data-pop="i73-ulcere" data-title="Ulcère digital : reconnaître le tissu menacé"><p>Un ulcère est une perte de substance cutanée. Une hypoperfusion persistante empêche les tissus de maintenir leur intégrité et de cicatriser. Une pulpe douloureuse, froide et lésée peut donc signaler une ischémie. Une infection ou une calcification peuvent cependant provoquer ou compliquer une plaie.</p><p>Le médecin décrit le site, la profondeur, la douleur, les signes infectieux et les tissus voisins. Une cicatrice pulpaire déprimée évoque une lésion antérieure. Il traite la douleur et recherche la perfusion insuffisante, sans attribuer toute ulcération à une sclérodermie. Une aggravation impose une réévaluation rapide.</p><div class="key"><b>À retenir.</b> La plaie demande simultanément une stratégie de perfusion et une analyse locale de cicatrisation.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39874231/" target="_blank" rel="noopener">Recommandations EULAR, mise à jour 2023, publication 2025</a>.</p></template>
<template data-pop="i73-recoloration" data-title="Recoloration : perfusion et conditions de mesure"><p>La compression cutanée expulse temporairement le sang du territoire observé. Le temps de retour de la couleur renseigne sur la perfusion cutanée après relâchement. La température, la pression appliquée et la durée de compression influencent la mesure.</p><p>Un retour rapide sur une peau réchauffée est rassurant pour ce territoire au moment de la mesure. Il n’exclut pas une crise intermittente ni une obstruction limitée à un autre doigt. Un retour lent avec douleur et froideur persistantes renforce la suspicion d’hypoperfusion. Aucun seuil unique ne suffit à qualifier tout acrosyndrome.</p><div class="key"><b>À retenir.</b> Le médecin documente les conditions et interprète la mesure avec la clinique.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a>.</p></template>
<template data-pop="i73-sclerodactylie" data-title="Doigts gonflés et sclérodactylie"><p>Des doigts gonflés peuvent précéder une fibrose cutanée. La sclérodactylie correspond à un épaississement et à une tension de la peau des doigts, avec diminution de sa souplesse. Ces constatations orientent vers une sclérodermie lorsque le contexte comporte Raynaud, auto-immunité et anomalies capillaires.</p><p>Le médecin examine la mobilité et la possibilité de plisser la peau. Il recherche aussi des lésions pulpaires et une atteinte proximale. Une limitation articulaire ou un œdème isolé possède d’autres causes. Le signe clinique ne remplace donc pas une classification complète de maladie systémique.</p><div class="key"><b>À retenir.</b> Le signe cutané donne une raison précise d’approfondir la recherche causale.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://iris.uniroma1.it/retrieve/e3835325-2581-15e8-e053-a505fe0a3de9/Smith_Standardisation_2020.pdf" target="_blank" rel="noopener">Standardisation capillaroscopique, Smith et al., 2020</a>.</p></template>
<template data-pop="i73-purpura" data-title="Diascopie : sang intravasculaire ou extravasé"><p>Une pression transparente sur la peau peut faire blanchir un vaisseau dilaté contenant du sang. Une télangiectasie relève de ce mécanisme. Un purpura correspond à du sang extravasé ; il ne disparaît pas de la même manière sous pression.</p><p>La palpabilité, la distribution, le nombre de plaquettes et les signes systémiques orientent ensuite la cause. Un purpura palpable avec atteinte rénale peut justifier une recherche de vascularite. Des lésions labiales blanchissantes avec épistaxis familiales orientent vers Rendu-Osler. La diascopie aide à classer une lésion, sans identifier seule son étiologie.</p><div class="key"><b>À retenir.</b> Une apparence rouge commune ne signifie pas un mécanisme commun.</div><p class="src">Sources : <a data-reference-source="1" href="https://hhtguidelines.org/diagnosis/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, diagnostic</a>.</p></template>
<template data-pop="i73-capillaroscopie" data-title="Capillaroscopie : structure visible et limite diagnostique"><p>La vidéocapillaroscopie standardisée examine les anses périunguéales. Un milieu transparent améliore la visibilité. L’examinateur documente la qualité, plusieurs doigts, le calibre, la densité, les hémorragies et l’organisation. La comparaison avec une technique standardisée évite d’appeler pathologique un artefact.</p><p>Un motif sclérodermique associe des anomalies cohérentes ; une microhémorragie après traumatisme est moins spécifique. La méthode est une référence pour la morphologie, pas un test universel de perméabilité artérielle. Le CHUV décrit cette technique comme un examen morphologique orientant les acrosyndromes.</p><div class="key"><b>À retenir.</b> Le résultat doit préciser la question résolue et ce qu’il ne permet pas d’exclure.</div><p class="src">Sources : <a data-reference-source="1" href="https://iris.uniroma1.it/retrieve/e3835325-2581-15e8-e053-a505fe0a3de9/Smith_Standardisation_2020.pdf" target="_blank" rel="noopener">Standardisation capillaroscopique, Smith et al., 2020</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fr/angiologie/ang-home/patients-et-famille/examens/capillaroscopie" target="_blank" rel="noopener">CHUV, technique de capillaroscopie</a>.</p></template>
<template data-pop="i73-anticorps" data-title="Anticorps antinucléaires : probabilité et limites"><p>Le laboratoire recherche des autoanticorps reconnaissant des structures cellulaires. Leur positivité peut accompagner une connectivite, mais certains titres faibles existent sans maladie systémique. La méthode, le titre et le motif influencent donc la portée clinique.</p><p>Le médecin ne transforme pas un test positif en diagnostic automatique. Il recherche une cohérence avec la peau, les symptômes systémiques et la capillaroscopie. Des spécificités ciblées peuvent ensuite être demandées. Une sérologie négative ne prouve pas l’absence de toute maladie vasculaire secondaire, puisque les obstructions et les expositions ne reposent pas forcément sur une auto-immunité.</p><div class="key"><b>À retenir.</b> La biologie contribue à une probabilité. La conclusion demeure clinicobiologique.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-acrocyanose" data-title="Acrocyanose : permanence plutôt que succession de crises"><p>Une acrocyanose associe une coloration bleutée durable et des extrémités froides, souvent symétriques et peu douloureuses. Un débit cutané ralenti favorise la désaturation locale. La permanence de la couleur la distingue d’une succession franche de phases d’un Raynaud.</p><p>La symétrie et l’absence de lésion rendent une forme bénigne plus plausible. Une apparition asymétrique, une douleur marquée ou une nécrose impose une recherche de cause secondaire. Une cyanose généralisée demande aussi une analyse de l’oxygénation et de l’hémoglobine. La réponse au réchauffement ne remplace pas cette distinction.</p><div class="key"><b>À retenir.</b> Un diagnostic d’acrocyanose ne doit pas banaliser une douleur ou une destruction tissulaire.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-erythromelalgie" data-title="Érythromélalgie : chaleur, douleur et rougeur"><p>La chaleur ou l’exercice déclenche une douleur brûlante avec rougeur et augmentation de température. Certaines formes familiales impliquent un gain de fonction du canal neuronal codé par SCN9A. D’autres formes sont secondaires, notamment à une maladie myéloproliférative ; la numération sanguine peut alors modifier la conduite.</p><p>La protection contre la chaleur et un refroidissement prudent peuvent aider. Une immersion prolongée dans la glace expose à des lésions, à une macération et à une infection. Les traitements neurologiques ou hématologiques sont choisis selon le mécanisme. L’aspirine ne possède pas la même place dans toutes les formes.</p><div class="key"><b>À retenir.</b> Une brûlure rouge au chaud conduit à un raisonnement différent d’un doigt blanc au froid.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/sites/books/NBK1163/" target="_blank" rel="noopener">GeneReviews, syndromes douloureux liés à SCN9A</a>.</p></template>
<template data-pop="i73-engelures" data-title="Engelures : inflammation prolongée"><p>Des engelures sont des lésions inflammatoires apparaissant après exposition au froid, souvent avec prurit, douleur et tuméfaction. Elles persistent au-delà d’une crise vasomotrice brève. Leur temporalité et leur aspect distinguent le tableau d’un Raynaud classique.</p><p>Le médecin cherche une exposition froide et humide, examine la peau et documente la persistance. Une répétition hors contexte climatique, une ulcération ou des signes systémiques font rechercher une cause secondaire. La prévention repose sur la protection thermique et le maintien d’une peau sèche. Une infection ou une ischémie persistante exige une prise en charge distincte.</p><div class="key"><b>À retenir.</b> La durée de la lésion indique un processus inflammatoire ou structurel, plutôt qu’un simple changement transitoire de débit.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-buerger" data-title="Buerger : critères et exclusions"><p>La maladie de Buerger associe des lésions inflammatoires occlusives artérielles et veineuses, fréquemment distales. Les cinq critères de Shionoya combinent tabagisme, début avant 50 ans, occlusions infrapoplitées, atteinte des membres supérieurs ou thrombophlébite migratrice, et absence de facteurs athéromateux autres que le tabac.</p><p>Ces critères organisent la démarche. Le médecin exclut une origine embolique, un diabète, une athérosclérose et une maladie systémique selon le contexte. Des collatérales tortueuses soutiennent une occlusion chronique, sans être pathognomoniques. L’arrêt complet du tabac est central ; il accompagne l’évaluation de viabilité et les soins locaux.</p><div class="key"><b>À retenir.</b> Le terrain jeune et fumeur ne suffit pas ; le diagnostic exige une distribution et des exclusions cohérentes.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.internationaljournalofcardiology.com/article/S0167-5273%2898%2900175-2/abstract" target="_blank" rel="noopener">Critères diagnostiques de Buerger, Shionoya, 1998</a>.</p></template>
<template data-pop="i73-fmd" data-title="Dysplasie fibromusculaire : ce qui établit le diagnostic"><p>Une lésion focale ou multifocale caractéristique établit une atteinte artérielle non athéromateuse et non inflammatoire. Une tortuosité, une dissection ou un anévrisme isolé ne constitue pas une preuve suffisante. L’imagerie cherche la morphologie et les autres territoires atteints.</p><p>Le consensus 2019 recommande une exploration au moins une fois du cerveau au pelvis. Il considère une antiagrégation raisonnable dans certaines situations, mais cette proposition ne repose pas sur un essai randomisé établissant un bénéfice chez tous les patients. Le médecin individualise l’aspirine selon événements antérieurs, lésions et risque de saignement. Une compression externe ne relève pas du même diagnostic.</p><div class="key"><b>À retenir.</b> La décision thérapeutique reste attachée à la lésion et au risque individuel.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.eshonline.org/esh-content/uploads/2019/07/1.-First-international-consensus-on-the-diagnosis-and-management-of-FMD-.pdf" target="_blank" rel="noopener">Consensus international dysplasie fibromusculaire, 2019</a>.</p></template>
<template data-pop="i73-compression" data-title="Piège poplité : une manœuvre positive ne suffit pas"><p>Les rapports entre une artère et les muscles ou tendons peuvent entraîner une compression lors d’un mouvement. Une douleur reproductible à l’effort, une modification du débit et une anatomie compatible renforcent la suspicion. L’échographie dynamique doit documenter les positions et les symptômes.</p><p>Une occlusion dans une position extrême peut aussi apparaître chez un sujet sain. La position du patient modifie les résultats ; une observation isolée expose donc à un surdiagnostic. L’imagerie anatomique et l’évaluation spécialisée précèdent une décompression. Un déficit persistant ou une thrombose impose une prise en charge plus urgente.</p><div class="key"><b>À retenir.</b> Le diagnostic associe concordance clinique, anomalie dynamique pertinente et mécanisme anatomique.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36828257/" target="_blank" rel="noopener">Publication méthodologique sur l’échographie du piège poplité, 2023</a>.</p></template>
<template data-pop="i73-hht" data-title="Rendu-Osler : saigner et court-circuiter le filtre pulmonaire"><p>Les télangiectasies peuvent saigner et provoquer une carence en fer. Les malformations artérioveineuses pulmonaires créent un shunt qui laisse passer des emboles ou des bactéries vers la circulation systémique. Une complication neurologique peut donc survenir sans dyspnée préalable.</p><p>Le bilan associe diagnostic clinique ou génétique, numération et bilan martial, puis dépistage vasculaire spécialisé. L’humidification nasale limite la sécheresse favorisant les épistaxis. Un saignement persistant peut relever d’un antifibrinolytique, d’un traitement local ou d’une thérapie systémique spécialisée. Le traitement des shunts et celui des saignements répondent à des objectifs distincts. Les HUG disposent d’une consultation de maladies vasculaires rares.</p><div class="key"><b>À retenir.</b> La maladie mérite un suivi multidisciplinaire même lorsque le symptôme visible semble limité au nez.</div><p class="src">Sources : <a data-reference-source="1" href="https://hhtguidelines.org/diagnosis/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, diagnostic</a> ; <a data-reference-source="1" href="https://hhtguidelines.org/avm/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, malformations pulmonaires</a> ; <a data-reference-source="1" href="https://hhtguidelines.org/epistaxis/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, épistaxis, 2020</a> ; <a data-reference-source="1" href="https://www.hug.ch/angiologie-et-hemostase/malformations-vasculaires" target="_blank" rel="noopener">HUG, maladies vasculaires rares et consultation spécialisée</a>.</p></template>
<template data-pop="i73-curacao" data-title="Curaçao : quatre critères, une limite pédiatrique"><p>Le médecin recherche quatre critères : épistaxis spontanées répétées ; télangiectasies caractéristiques, notamment lèvres, bouche, doigts ou nez ; lésions viscérales ; parent du premier degré atteint. Au moins trois critères donnent un diagnostic clinique certain. Deux le rendent possible ; zéro ou un le rendent peu probable.</p><p>L’expression clinique augmente avec l’âge. Un enfant d’une famille atteinte peut manquer de signes visibles malgré une maladie présente. Le test ciblé du variant familial peut donc être plus informatif que la seule absence d’épistaxis. Un variant de signification incertaine ne doit pas être confondu avec une mutation causale démontrée.</p><div class="key"><b>À retenir.</b> Un score clinique faible ne suffit pas à exclure la maladie chez un apparenté jeune à risque.</div><p class="src">Sources : <a data-reference-source="1" href="https://hhtguidelines.org/diagnosis/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, diagnostic</a>.</p></template>
<template data-pop="i73-grossesse" data-title="Grossesse : risque vasculaire et exposition médicamenteuse"><p>La grossesse modifie le volume circulant et les contraintes vasculaires. Une maladie de Rendu-Osler demande une planification spécialisée centrée sur les malformations connues et le dépistage nécessaire. La préparation réduit le risque de découvrir un shunt seulement lors d’une complication.</p><p>L’information suisse contre-indique l’iloprost pendant grossesse et allaitement. Le bosentan présente un risque fœtal et exige une prévention de grossesse adaptée. Les traitements ne sont donc pas reconduits sans réévaluation. Un symptôme sévère chez une femme enceinte demande une analyse conjointe de la perfusion maternelle et des risques fœtaux.</p><div class="key"><b>À retenir.</b> La stratégie s’organise avant une escalade ; une grossesse ne justifie pas de laisser une ischémie sans évaluation.</div><p class="src">Sources : <a data-reference-source="1" href="https://compendium.ch/fr/product/94928-ilomedin-inf-konz-20-mcg-ml-i-v" target="_blank" rel="noopener">Information suisse Ilomedin, consultée le 08.10.2026</a> ; <a data-reference-source="1" href="https://compendium.ch/fr/product/1355258-bosentan-mepha-cpr-pell-62-5-mg" target="_blank" rel="noopener">Information suisse Bosentan Mepha, consultée le 08.10.2026</a> ; <a data-reference-source="1" href="https://hhtguidelines.org/avm/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, malformations pulmonaires</a>.</p></template>
<template data-pop="i73-doppler" data-title="Échographie Doppler : flux et distribution"><p>L’échographie montre la paroi et la lumière des vaisseaux accessibles. Le Doppler mesure une direction et des caractéristiques de flux. L’opérateur confronte un rétrécissement à ses conséquences hémodynamiques plutôt qu’à son seul aspect.</p><p>Une obstruction digitale fine peut être difficile à détecter. Un examen proximal rassurant n’exclut donc pas toute lésion distale. Une compression nécessite une étude dynamique adaptée ; une position extrême peut créer une anomalie chez un sujet sain. Une angiographie complémentaire répond à une question anatomique ou thérapeutique précise.</p><div class="key"><b>À retenir.</b> L’examen est utile lorsque le territoire étudié correspond à la question clinique.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36828257/" target="_blank" rel="noopener">Publication méthodologique sur l’échographie du piège poplité, 2023</a>.</p></template>
<template data-pop="i73-biologie" data-title="Numération et rein : trois questions distinctes"><p>La numération mesure les cellules circulantes. Une anémie réduit le contenu artériel en oxygène ; une thrombocytose peut orienter une maladie myéloproliférative ; une thrombopénie peut expliquer des saignements ou un purpura. Ces anomalies ne produisent pas toutes un Raynaud.</p><p>La créatinine renseigne sur la filtration et contribue au choix du contraste. L’analyse urinaire peut révéler une atteinte glomérulaire même si la filtration est encore conservée. Un bilan martial explore des pertes répétées ; une ferritine peut rester élevée sous inflammation malgré une disponibilité limitée du fer. Le médecin relie chaque résultat à une décision causale.</p><div class="key"><b>À retenir.</b> Sodium et potassium ne classent pas le Raynaud ; leur dosage exige une indication rénale, médicamenteuse ou aiguë propre.</div><p class="src">Sources : <a data-reference-source="1" href="https://hhtguidelines.org/anemia/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, anémie, 2020</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a>.</p></template>
<template data-pop="i73-shunt" data-title="Contraste échographique : dépister une malformation pulmonaire"><p>Des microbulles injectées dans la circulation veineuse arrivent dans le cœur droit. Un réseau capillaire pulmonaire normal filtre leur passage. Leur apparition dans le cœur gauche peut révéler un passage anormal ; le délai et la technique aident à distinguer les mécanismes.</p><p>Dans Rendu-Osler possible ou confirmé, l’échocardiographie de contraste est recommandée en dépistage pulmonaire. Le scanner précise ensuite une malformation traitable. Une malformation documentée conduit à discuter embolisation, prévention de bactériémie liée à certains gestes et évitement des bulles d’air lors d’un accès veineux. Le suivi recherche une reperfusion ou une croissance.</p><div class="key"><b>À retenir.</b> Le test dépiste un passage ; l’imagerie anatomique et l’équipe spécialisée déterminent son traitement.</div><p class="src">Sources : <a data-reference-source="1" href="https://hhtguidelines.org/avm/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, malformations pulmonaires</a>.</p></template>
<template data-pop="i73-nifedipine" data-title="Nifédipine : réduire le tonus artériel"><p>La nifédipine bloque des canaux calciques du muscle lisse et diminue la contraction artérielle. Cette action réduit le spasme mais ne restaure pas une lumière thrombosée. Les schémas à libération prolongée étudiés dans les synthèses EULAR comprennent 30–60 mg/jour ; ils ne définissent pas une dose maximale universelle.</p><p>Le prescripteur confirme la formulation disponible et son information professionnelle actuelle. L’efficacité se mesure sur fréquence, durée et retentissement des crises. Céphalées, rougeur, hypotension et œdèmes peuvent limiter l’escalade. Une forme immédiate ne s’emploie pas comme raccourci pour une ischémie aiguë non explorée.</p><div class="key"><b>À retenir.</b> La dose optimale apporte un bénéfice mesurable dans la tolérance du patient.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.sciencedirect.com/science/article/abs/pii/S0003496724198500" target="_blank" rel="noopener">Recommandations EULAR 2017, schémas étudiés</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39874231/" target="_blank" rel="noopener">Recommandations EULAR, mise à jour 2023, publication 2025</a>.</p></template>
<template data-pop="i73-sildenafil" data-title="Sildénafil : bénéfice plausible, essai nuancé"><p>Le sildénafil freine la phosphodiestérase de type 5 et prolonge une signalisation de relâchement vasculaire. SEDUCE a étudié 20 mg trois fois par jour pendant 12 semaines dans des ulcères sclérodermiques. Le critère principal de délai de cicatrisation n’a pas été significativement amélioré ; des critères secondaires étaient favorables.</p><p>L’emploi pour Raynaud ou ulcères exige une décision spécialisée et une vérification du statut réglementaire. L’association aux nitrés ou au riociguat est contre-indiquée par l’information européenne. Des interactions métaboliques peuvent modifier l’exposition. Une hypotension ou un terrain hépatique sévère impose une réévaluation ; les conseils de l’hypertension pulmonaire ne sont pas importés automatiquement au Raynaud.</p><div class="key"><b>À retenir.</b> Une option recommandée peut conserver une preuve nuancée ; le patient reçoit un objectif et une surveillance explicites.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/25995322/" target="_blank" rel="noopener">Essai SEDUCE, Hachulla et al., 2016</a> ; <a data-reference-source="1" href="https://www.ema.europa.eu/en/documents/product-information/revatio-epar-product-information_en.pdf" target="_blank" rel="noopener">Information réglementaire européenne Revatio, septembre 2025</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39874231/" target="_blank" rel="noopener">Recommandations EULAR, mise à jour 2023, publication 2025</a>.</p></template>
<template data-pop="i73-iloprost" data-title="Iloprost : perfusion spécialisée"><p>L’iloprost est une prostacycline de synthèse. Sa vasodilatation et ses effets plaquettaires peuvent aider une ischémie sévère sélectionnée. L’information suisse indique 0,5–2 ng/kg/min après dilution, pendant 6 heures par jour. Pour le Raynaud, 3–5 jours peuvent suffire ; la durée dépend de l’indication et de l’évolution.</p><p>La dose débute dans la plage basse et s’adapte à la pression, à la fréquence cardiaque et à la tolérance. Le protocole précise dilution et débit de pompe. Les contre-indications cardiovasculaires, hémorragiques, grossesse et allaitement sont vérifiées avant perfusion. Le traitement ne remplace ni sevrage tabagique dans Buerger ni prise en charge d’une obstruction accessible.</p><div class="key"><b>À retenir.</b> La sécurité repose sur une préparation vérifiée et une surveillance continue adaptée.</div><p class="src">Sources : <a data-reference-source="1" href="https://compendium.ch/fr/product/94928-ilomedin-inf-konz-20-mcg-ml-i-v" target="_blank" rel="noopener">Information suisse Ilomedin, consultée le 08.10.2026</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/1689791/" target="_blank" rel="noopener">Essai iloprost contre aspirine, Fiessinger et Schäfer, 1990</a>.</p></template>
<template data-pop="i73-bosentan" data-title="Bosentan : prévenir de nouveaux ulcères"><p>Le bosentan bloque des récepteurs de l’endothéline, médiateur vasoconstricteur. Son indication suisse comprend la réduction de nouveaux ulcères digitaux dans la sclérodermie avec ulcères évolutifs. Le schéma adulte commence à 62,5 mg deux fois par jour pendant 4 semaines, puis passe à 125 mg deux fois par jour selon tolérance.</p><p>Cette indication ne prouve pas une cicatrisation accélérée de la plaie actuelle. La fonction hépatique, l’hémoglobine et le risque de grossesse sont surveillés selon la monographie complète. Les interactions peuvent réduire l’efficacité d’une contraception hormonale ; le dispositif de prévention doit être fiable. Un ictère ou une aggravation clinique appelle une réévaluation rapide.</p><div class="key"><b>À retenir.</b> L’objectif est la prévention de lésions nouvelles ; le soin de l’ulcère présent reste distinct.</div><p class="src">Sources : <a data-reference-source="1" href="https://compendium.ch/fr/product/1355258-bosentan-mepha-cpr-pell-62-5-mg" target="_blank" rel="noopener">Information suisse Bosentan Mepha, consultée le 08.10.2026</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39874231/" target="_blank" rel="noopener">Recommandations EULAR, mise à jour 2023, publication 2025</a>.</p></template>
<template data-pop="pareto-i73-definitions" data-title="Pareto — definitions"><p class="ratio" data-cover="i73-0,i73-1,i73-2"></p><ul><li>Le Raynaud est paroxystique et réversible ; une lésion ou une douleur permanente impose une recherche structurelle.</li><li>La forme primaire associe une clinique compatible, une capillaroscopie normale et l’absence de cause secondaire identifiée.</li><li>Les codes décrivent des regroupements ; l’étiologie précise détermine le pronostic.</li></ul></template>
<template data-pop="pareto-i73-mecanismes" data-title="Pareto — mecanismes"><p class="ratio" data-cover="i73-3"></p><ul><li>La contraction artériolaire réduit le débit ; elle produit une pâleur puis une cyanose par désaturation.</li><li>La reperfusion peut provoquer la phase rouge.</li><li>Une raréfaction capillaire ou une sténose fixe limite la réserve même après réchauffement.</li></ul></template>
<template data-pop="pareto-i73-clinique" data-title="Pareto — clinique"><p class="ratio" data-cover="i73-4,i73-5"></p><ul><li>Le médecin documente durée, déclencheur, symétrie, récupération et lésion.</li><li>Il recherche les signes systémiques et les expositions, puis révise les médicaments.</li><li>Des pouls proximaux présents n’excluent pas une ischémie digitale.</li></ul></template>
<template data-pop="pareto-i73-entites" data-title="Pareto — entites"><p class="ratio" data-cover="i73-6,i73-7,i73-8,i73-9,i73-10"></p><ul><li>Le Raynaud primaire reste un diagnostic clinicobiologique et morphologique cohérent.</li><li>L’acrocyanose est durable ; l’érythromélalgie est chaude et douloureuse ; les engelures sont inflammatoires prolongées.</li><li>Buerger exige un terrain, une distribution et des exclusions ; le sevrage complet est central.</li><li>La dysplasie fibromusculaire exige une morphologie compatible ; la compression exige une concordance clinique et anatomique.</li><li>Curaçao ou une mutation causale établit Rendu-Osler ; les shunts peuvent être silencieux.</li></ul></template>
<template data-pop="pareto-i73-examens" data-title="Pareto — examens"><p class="ratio" data-cover="i73-e-1,i73-e-2,i73-e-3,i73-e-4,i73-e-5"></p><ul><li>La capillaroscopie est la référence morphologique périunguéale, sans test unique universel du Raynaud.</li><li>Les anticorps se lisent avec clinique et architecture ; un faible titre ne prouve pas une connectivite.</li><li>La numération explore anémie, plaquettes et causes secondaires ; le rein guide le contraste et la recherche systémique.</li><li>L’imagerie artérielle cible une obstruction ou une compression ; l’échographie de contraste dépiste le shunt pulmonaire.</li><li>Chaque résultat doit modifier une décision définie avant la prescription.</li></ul></template>
<template data-pop="pareto-i73-s-anat" data-title="Pareto — s-anat"><p class="ratio" data-cover="i73-s-anat-body"></p><ul><li>Les pouls proximaux et la perfusion pulpaire explorent des niveaux distincts.</li><li>Les capillaires assurent les échanges ; une communication artérioveineuse les court-circuite.</li></ul></template>
<template data-pop="pareto-i73-s-histo" data-title="Pareto — s-histo"><p class="ratio" data-cover="i73-s-histo-body"></p><ul><li>Le muscle artériolaire règle le calibre ; l’endothélium capillaire constitue une interface d’échanges.</li><li>Une capillaroscopie anormale renseigne sur une lésion structurelle, sans remplacer une étude artérielle.</li></ul></template>
<template data-pop="pareto-i73-s-phys" data-title="Pareto — s-phys"><p class="ratio" data-cover="i73-s-phys-body"></p><ul><li>La pression et la résistance déterminent le débit ; une réduction du rayon augmente la résistance.</li><li>Le froid peut provoquer un spasme réversible ; un obstacle fixe exige une autre stratégie.</li><li>Une hypotension limite l’escalade vasodilatatrice.</li></ul></template>
<template data-pop="pareto-i73-s-bio" data-title="Pareto — s-bio"><p class="ratio" data-cover="i73-s-bio-body"></p><ul><li>La nifédipine réduit une entrée calcique ; le sildénafil freine la dégradation d’un messager cyclique.</li><li>L’iloprost et le bosentan ciblent d’autres voies, sans supprimer tous les risques de combinaison.</li><li>Les nitrés et le sildénafil peuvent provoquer une hypotension dangereuse.</li></ul></template>
<template data-pop="pareto-i73-s-gen" data-title="Pareto — s-gen"><p class="ratio" data-cover="i73-s-gen-body"></p><ul><li>Un gain de fonction neuronal peut provoquer une érythromélalgie.</li><li>Une anomalie de signalisation endothéliale peut provoquer les malformations de Rendu-Osler.</li><li>Un variant familial causal guide le dépistage ; un résultat incertain ne confirme pas la maladie.</li></ul></template>
<template data-pop="pareto-i73-synthese" data-title="Pareto — synthese"><p class="ratio" data-cover="i73-13,i73-14"></p><ul><li>Le suivi compare symptômes, fonction, peau et tolérance dans des conditions climatiques cohérentes.</li><li>L’apparition d’une lésion ou d’un signe systémique déclenche une nouvelle démarche.</li><li>La grossesse, le rein et le foie changent les choix médicamenteux et d’imagerie.</li><li>Les critères diagnostiques restent propres à chaque maladie ; aucun score universel ne les remplace.</li></ul></template>
<template data-pop="pareto-i73-pharma" data-title="Pareto — pharma"><p class="ratio" data-cover="i73-p-1,i73-p-2,i73-p-3,i73-p-4"></p><ul><li>La cible précède la dose : spasme, ischémie sévère ou nouveaux ulcères.</li><li>Les doses étudiées ne deviennent pas automatiquement des indications suisses.</li><li>Iloprost et bosentan ont des schémas suisses explicitement attribués.</li><li>SEDUCE n’a pas atteint son critère principal ; les résultats secondaires ne doivent pas le masquer.</li><li>Le sildénafil ne s’associe ni aux nitrés ni au riociguat ; pression, foie, sang et grossesse guident la surveillance.</li></ul></template>
<template data-pop="pareto-i73-traitement" data-title="Pareto — traitement"><p class="ratio" data-cover="i73-11,i73-12"></p><ul><li>Une douleur permanente, un déficit ou une nécrose exige une évaluation urgente.</li><li>La protection thermique et le retrait des expositions précèdent une escalade dans les formes non menacées.</li><li>La nifédipine est une première option ; sildénafil et iloprost répondent à des indications spécialisées.</li><li>Le bosentan prévient de nouveaux ulcères ; il ne remplace pas le soin de la plaie actuelle.</li><li>Une obstruction, une infection, une compression ou un shunt reçoit son traitement propre.</li></ul></template>
<template data-pop="i73-hht-traitement" data-title="Rendu-Osler : trois objectifs thérapeutiques"><p>Le traitement des épistaxis commence par l’humidification nasale, qui réduit la sécheresse et les traumatismes de la muqueuse. Une persistance peut justifier un acide tranexamique oral selon la balance thrombose-saignement. Une expertise en oto-rhino-laryngologie discute des traitements locaux ablatifs ; leurs effets peuvent être temporaires. Une forme réfractaire peut relever d’un traitement antiangiogénique systémique ou d’une chirurgie spécialisée.</p><p>La carence martiale se traite et sa cause se contrôle. Le fer oral constitue une option initiale ; une inefficacité, une intolérance ou une anémie sévère peut conduire au fer par perfusion. Une transfusion dépend de l’état clinique et des besoins, pas d’un seuil unique applicable à tous.</p><p>Les malformations pulmonaires accessibles sont discutées pour embolisation. Des malformations documentées imposent une attention aux bulles d’air lors d’un accès veineux et une prophylaxie antibiotique pour certains gestes avec risque de bactériémie. Une indication indépendante d’anticoagulation reste possible : Rendu-Osler n’est pas une contre-indication absolue. La décision individualise la gravité des saignements et évite autant que possible les associations antithrombotiques.</p><div class="key"><b>À retenir.</b> Le saignement, le déficit en fer et le shunt sont trois mécanismes ; aucun traitement unique ne les corrige tous.</div><p class="src">Sources : <a data-reference-source="1" href="https://hhtguidelines.org/epistaxis/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, épistaxis, 2020</a> ; <a data-reference-source="1" href="https://hhtguidelines.org/anemia/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, anémie, 2020</a> ; <a data-reference-source="1" href="https://hhtguidelines.org/avm/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, malformations pulmonaires</a>.</p></template>
<template data-pop="i73-pomalidomide" data-title="Pomalidomide : preuve récente et usage spécialisé"><p>L’essai randomisé de 2024 comparait pomalidomide et placebo pendant 24 semaines chez 144 patients avec Rendu-Osler. La différence de variation du score de gravité des épistaxis était de −0,94 point, avec intervalle de confiance à 95 % de −1,57 à −0,31. Le résultat concerne une réduction du saignement nasal ; il ne démontre pas la disparition de toutes les malformations.</p><p>Une neutropénie, une constipation et des éruptions étaient plus fréquentes. L’information professionnelle suisse d’Imnovid concerne le myélome et ne fournit pas d’indication Rendu-Osler. Un emploi dans cette maladie relève donc d’une discussion spécialisée hors indication. La grossesse est contre-indiquée et un programme de prévention doit être respecté ; les interactions métaboliques et la numération nécessitent une surveillance.</p><div class="key"><b>À retenir.</b> Une preuve clinique récente ne transforme pas automatiquement un médicament en prescription ambulatoire standard.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/39292928/" target="_blank" rel="noopener">Essai randomisé pomalidomide et épistaxis, 2024</a> ; <a data-reference-source="1" href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=61249&amp;lang=FR&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener">Information professionnelle suisse Imnovid, consultée le 08.10.2026</a>.</p></template>
<template data-pop="i73-memo" data-title="Réversibilité, lésion, symétrie : aide de raisonnement"><p>Cette aide pédagogique n’est pas un critère officiel. Le médecin commence par la réversibilité : une crise qui persiste après réchauffement demande une recherche structurelle. Il examine ensuite la lésion : un ulcère, une nécrose ou un déficit neurologique augmente l’urgence. Il analyse enfin la symétrie : une atteinte très asymétrique oriente vers une cause artérielle locale.</p><p>Une crise réversible et symétrique reste secondaire si la capillaroscopie est anormale ou si des signes systémiques apparaissent. L’aide ne remplace donc ni les critères de Raynaud primaire ni un examen complet.</p><div class="key"><b>À retenir.</b> Le médecin reconnaît d’abord la menace, puis choisit les critères propres à la maladie suspectée.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a>.</p></template>
