<template id="ch-I73"><div class="chap"><div class="chap-head"><div class="code">I73 — Autres maladies vasculaires périphériques · I77 — Autres maladies des artères et artérioles · I78 — Maladies des capillaires · renvoi I79 — Maladies vasculaires au cours de maladies classées ailleurs · CIM-10-GM 2024 · Vaisseaux et microcirculation</div><h1>I73 — Autres maladies vasculaires périphériques</h1><span class="status">Adulte · rédaction du 08.10.2026 · référentiels explicitement datés · contrôle indépendant restant requis</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie vasculaire</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#i73-0">Question clinique</a></li><li><a href="#i73-1">Définition et périmètre</a></li><li><a href="#i73-2">Fréquence et trajectoire</a></li><li><a href="#i73-3">Mécanismes</a></li><li><a href="#i73-4">Anamnèse</a></li><li><a href="#i73-5">Examen clinique</a></li><li><a href="#i73-6">Démarche diagnostique</a></li><li><a href="#i73-7">Acrosyndromes</a></li><li><a href="#i73-8">Thromboangéite oblitérante</a></li><li><a href="#i73-9">Artériopathies non athéromateuses</a></li><li><a href="#i73-10">Maladies des capillaires</a></li><li><a href="#i73-11">Urgences</a></li><li><a href="#i73-12">Prise en charge</a></li><li><a href="#i73-13">Suivi et situations particulières</a></li><li><a href="#i73-14">Critères formels</a></li></ol></nav><div class="chap-body"><section class="ilot" id="i73-0"><h2><span class="n">0</span>Un doigt change de couleur : quelle décision ?</h2><p>Une femme de 25 ans décrit des doigts blancs puis bleus au froid. Un homme fumeur présente une douleur permanente avec un ulcère. La couleur seule ne distingue pas un vasospasme réversible d’une destruction tissulaire. Le médecin établit la temporalité, recherche une menace ischémique et identifie une maladie causale.</p><p>Les objectifs cliniques sont concrets : reconnaître un phénomène de Raynaud, distinguer sa forme primaire d’une forme secondaire, choisir les examens qui changent la conduite et traiter sans masquer une obstruction. Les acrosyndromes, la thromboangéite oblitérante et certaines artériopathies non athéromateuses demandent des raisonnements distincts.</p><div class="key"><b>À retenir.</b> Une douleur persistante, une lésion ou un déficit neurologique impose une évaluation urgente. Une crise entièrement réversible permet une exploration ambulatoire si aucun signe de gravité ne l’accompagne.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a>.</p></section>
<section class="ilot" id="i73-1"><h2><span class="n">1</span>Définition et périmètre diagnostique</h2><p>Un <button class="w" data-k="i73-raynaud">phénomène de Raynaud (identifier une crise vasospastique)</button> correspond à des changements de couleur digitaux paroxystiques liés à une diminution réversible du débit. Le froid constitue le déclencheur principal ; une émotion peut aussi augmenter le tonus sympathique. Le consensus international 2014 retient une histoire compatible et au moins deux phases, comportant une pâleur et une cyanose. Une phase rouge de reperfusion est fréquente, sans être indispensable.</p><p>La <button class="w" data-k="i73-primaire">forme primaire (critères et limites)</button> est fonctionnelle : aucun processus causal secondaire n’est identifié et l’architecture capillaire demeure normale. La <button class="w" data-k="i73-secondaire">forme secondaire (vasculopathie et recherche causale)</button> associe le vasospasme à une maladie, une exposition ou un médicament. Une sclérodermie systémique peut associer une raréfaction capillaire et des lésions artérielles ; elle réduit la réserve de perfusion avant même la crise.</p><p>Les regroupements suivants répondent à des mécanismes différents. Le code principal ne remplace pas le diagnostic précis.</p><table class="t"><tr><th>Code et intitulé</th><th>Enseignement spécifique</th></tr><tr><td>I73 — Autres maladies vasculaires périphériques</td><td>Le phénomène de Raynaud et la thromboangéite oblitérante occupent le premier plan. L’acrocyanose et l’érythromélalgie orientent les diagnostics différentiels.</td></tr><tr><td>I77 — Autres maladies des artères et artérioles</td><td>La dysplasie fibromusculaire et les compressions artérielles sont distinguées des plaques athéromateuses.</td></tr><tr><td>I78 — Maladies des capillaires</td><td>La télangiectasie hémorragique héréditaire explique des saignements et des shunts. Les purpuras nécessitent un diagnostic causal distinct.</td></tr><tr><td>I79 — Maladies des artères, artérioles et capillaires au cours de maladies classées ailleurs</td><td>Le médecin documente la maladie causale. Les vascularites systémiques relèvent de M31 — Vascularites systémiques et les complications diabétiques du chapitre correspondant.</td></tr></table><p>Un ulcère digital n’est pas un code étiologique. Il peut résulter d’une vasculopathie sclérodermique, d’une embolie ou d’une occlusion distale. L’athérosclérose et l’ischémie aiguë relèvent de I70 — Athérosclérose périphérique ; les anévrismes de I71 — Anévrismes et dissections artérielles ; les thromboses veineuses de I80 — Thrombose veineuse profonde.</p><div class="key"><b>À retenir.</b> Le syndrome décrit le phénomène observé. L’étiologie détermine le pronostic et les traitements spécifiques.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://www.internationaljournalofcardiology.com/article/S0167-5273%2898%2900175-2/abstract" target="_blank" rel="noopener">Critères diagnostiques de Buerger, Shionoya, 1998</a> ; <a data-reference-source="1" href="https://www.eshonline.org/esh-content/uploads/2019/07/1.-First-international-consensus-on-the-diagnosis-and-management-of-FMD-.pdf" target="_blank" rel="noopener">Consensus international dysplasie fibromusculaire, 2019</a> ; <a data-reference-source="1" href="https://hhtguidelines.org/diagnosis/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, diagnostic</a>.</p></section>
<section class="ilot" id="i73-2"><h2><span class="n">2</span>Fréquence et trajectoire clinique</h2><p>La fréquence publiée du phénomène de Raynaud varie avec le climat et la définition retenue. Une estimation importée ne décrit donc pas automatiquement la population suisse. Aucune prévalence nationale consolidée n’est retenue ici. Une maladie de Buerger ou une dysplasie fibromusculaire ne se déduit pas de la fréquence du symptôme Raynaud.</p><p>La distinction pronostique utile oppose une anomalie fonctionnelle réversible à une atteinte structurelle ou systémique. Un Raynaud primaire ne doit pas provoquer de gangrène. Une apparition de lésions ou de signes systémiques oblige à reconsidérer cette attribution, même après plusieurs années d’évolution.</p><p>La positivité d’anticorps et une microangiopathie augmentent la suspicion de connectivite parce qu’elles explorent deux dimensions différentes : l’auto-immunité et la structure vasculaire. Aucun résultat isolé ne permet de prédire avec certitude l’évolution individuelle.</p><div class="key"><b>À retenir.</b> Le suivi recherche un changement de phénotype. Il ne répète pas automatiquement tous les examens chez une personne stable.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://iris.uniroma1.it/retrieve/e3835325-2581-15e8-e053-a505fe0a3de9/Smith_Standardisation_2020.pdf" target="_blank" rel="noopener">Standardisation capillaroscopique, Smith et al., 2020</a>.</p><button class="pareto-btn ui" data-k="pareto-i73-definitions">▲ Loi de Pareto — Définition et trajectoire</button></section>
<section class="ilot" id="i73-3"><h2><span class="n">3</span>Du fonctionnement normal à la crise</h2><p>La peau module son débit pour préserver la température centrale. Les artérioles et les anastomoses artérioveineuses répondent au système sympathique. La contraction du muscle lisse diminue le rayon vasculaire et augmente la résistance. Les capillaires deviennent moins perfusés ; ils ne se contractent pas comme une artériole musculaire.</p><p>Pendant une crise, la <button class="w" data-k="i73-couleurs">pâleur, la cyanose et la rougeur (mécanisme de chaque phase)</button> correspondent respectivement à un apport sanguin réduit, à la désaturation du sang stagnant puis à la reperfusion. Une paresthésie accompagne l’ischémie transitoire des structures nerveuses. La séquence peut rester incomplète et les photographies prises par le patient aident à documenter une crise absente lors de l’examen.</p><p>Le froid amplifie la réactivité adrénergique des vaisseaux cutanés. Des expériences cellulaires décrivent la mobilisation de récepteurs alpha-2C vers la membrane ; ce mécanisme ne constitue pas un biomarqueur clinique. Dans une vasculopathie secondaire, une sténose ou une raréfaction capillaire s’ajoute au spasme. Le débit ne revient alors pas forcément à une valeur suffisante après réchauffement.</p><div class="key"><b>À retenir.</b> Le réchauffement corrige un stimulus fonctionnel. Il ne recanalise pas une artère thrombosée et ne recrée pas des capillaires disparus.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2494767/" target="_blank" rel="noopener">Chotani et al., signalisation des récepteurs cutanés, recherche expérimentale</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://iris.uniroma1.it/retrieve/e3835325-2581-15e8-e053-a505fe0a3de9/Smith_Standardisation_2020.pdf" target="_blank" rel="noopener">Standardisation capillaroscopique, Smith et al., 2020</a>.</p><button class="pareto-btn ui" data-k="pareto-i73-mecanismes">▲ Loi de Pareto — Mécanismes vasculaires</button></section>
<section class="ilot" id="i73-4"><h2><span class="n">4</span>Anamnèse : identifier le phénotype et sa cause</h2><p>Le médecin demande l’âge de début, les doigts concernés, la symétrie, la durée et le déclencheur. Il précise le retour complet à la normale entre les crises. Une douleur de repos persistante ou une lésion indique que l’apport tissulaire reste insuffisant ; elle change immédiatement le niveau de prise en charge.</p><p>La recherche de <button class="w" data-k="i73-connectivite">signes de connectivite (signification et interrogation)</button> porte sur des doigts gonflés, une peau épaissie, un reflux, une dysphagie, une dyspnée, une faiblesse musculaire et des douleurs articulaires. L’association de ces signes oriente vers une atteinte systémique ; aucun symptôme digestif isolé n’est spécifique de sclérodermie.</p><p>Le médecin documente le <button class="w" data-k="i73-tabac">tabac, la nicotine et les autres expositions (effets et limites)</button>, le cannabis, la cocaïne, les vibrations professionnelles et les traumatismes répétés de la paume. Les vibrations et les traumatismes peuvent léser les vaisseaux. La cocaïne augmente le tonus vasoconstricteur. Une exposition ne suffit cependant pas à attribuer toutes les lésions au même mécanisme.</p><p>La revue <button class="w" data-k="i73-medicaments">des médicaments (vasoconstriction iatrogène)</button> inclut les bêtabloquants, les sympathomimétiques et certains traitements oncologiques. Le médecin vérifie la chronologie. Il compare ensuite le risque du médicament avec sa nécessité, car un arrêt brutal peut aggraver une maladie cardiaque.</p><div class="key"><b>À retenir.</b> Une crise symétrique déclenchée par le froid peut être primaire. La symétrie ne neutralise pas un ulcère, une microangiopathie ou un signe systémique.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://www.internationaljournalofcardiology.com/article/S0167-5273%2898%2900175-2/abstract" target="_blank" rel="noopener">Critères diagnostiques de Buerger, Shionoya, 1998</a>.</p></section>
<section class="ilot" id="i73-5"><h2><span class="n">5</span>Examen clinique : perfusion et atteinte systémique</h2><p>L’examen commence par l’état général, la température, la fréquence cardiaque et la pression artérielle. Une hypotension réduit la pression de perfusion et limite la tolérance des vasodilatateurs. Un état fébrile avec un doigt douloureux peut indiquer une infection associée. La comparaison des deux bras et des pouls aide à repérer une atteinte artérielle proximale.</p><p>Les constatations suivantes s’interprètent après acclimatation dans une pièce suffisamment chaude. Le froid ambiant peut produire une vasoconstriction normale.</p><table class="t"><tr><th>Constatation</th><th>Mécanisme et conséquence</th></tr><tr><td><button class="w" data-k="i73-pouls">Pouls et asymétrie (technique et limites)</button></td><td>Un pouls absent évoque une atteinte artérielle significative. Un pouls présent ne garantit pas la perfusion des artères digitales.</td></tr><tr><td><button class="w" data-k="i73-ulcere">Ulcère et cicatrice pulpaire (ischémie ou autre cause)</button></td><td>Une perte de substance ou une cicatrice déprimée indique une atteinte tissulaire. Une calcification qui s’extrude peut aussi provoquer une plaie.</td></tr><tr><td><button class="w" data-k="i73-recoloration">Recoloration cutanée (comment la mesurer)</button></td><td>Un retour lent après compression traduit une perfusion cutanée réduite, mais dépend aussi de la température et de la technique.</td></tr><tr><td><button class="w" data-k="i73-sclerodactylie">Sclérodactylie et doigts gonflés (recherche de sclérodermie)</button></td><td>L’épaississement et la tension cutanée suggèrent une fibrose ; le gonflement peut précéder cette fibrose.</td></tr><tr><td><button class="w" data-k="i73-purpura">Purpura et télangiectasie (diascopie et conséquence)</button></td><td>Le purpura ne blanchit pas sous pression parce que le sang est extravasé. Une télangiectasie correspond à un vaisseau dilaté contenant du sang.</td></tr></table><p>Le médecin regarde les ongles, la pulpe, la peau et les muqueuses. Il palpe les pouls et vérifie la sensibilité puis la force. Une asymétrie doit être expliquée ; une saturation normale mesurée sur un autre doigt ne suffit pas à rassurer.</p><div class="key"><b>À retenir.</b> Le territoire distal peut être menacé malgré des pouls radiaux présents. La décision repose sur la perfusion tissulaire, la douleur et l’intégrité neurologique.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://hhtguidelines.org/diagnosis/" target="_blank" rel="noopener">Recommandations internationales Rendu-Osler, diagnostic</a>.</p><button class="pareto-btn ui" data-k="pareto-i73-clinique">▲ Loi de Pareto — Anamnèse et examen</button></section>
<section class="ilot" id="i73-6"><h2><span class="n">6</span>Diagnostic : primaire, secondaire ou urgence</h2><p>Le diagnostic de Raynaud est clinique. La <button class="w" data-k="i73-capillaroscopie">capillaroscopie périunguéale (référence pour la microcirculation)</button> recherche une anomalie structurelle ; elle ne mesure pas directement toutes les artères digitales. Les <button class="w" data-k="i73-anticorps">anticorps antinucléaires (probabilité et spécificité)</button> orientent l’exploration d’une maladie auto-immune. Ces examens complètent le diagnostic, sans constituer un test unique universel.</p><p>La démarche commence par la gravité. Une ischémie persistante mène à une évaluation vasculaire urgente. Une histoire de crise réversible mène à l’examen cutané, à la capillaroscopie et à une biologie ciblée selon le contexte. Une capillaroscopie anormale ou des signes systémiques justifient un avis de rhumatologie. Une atteinte asymétrique ou des pouls anormaux justifient une exploration artérielle.</p><div class="trap"><span class="k">Piège</span>Un titre faible d’anticorps antinucléaires peut exister sans connectivite. À l’inverse, une seule sérologie négative n’élimine pas toute maladie secondaire. L’interprétation combine la clinique, la méthode du laboratoire et la structure capillaire.</div><div class="key"><b>À retenir.</b> Aucun « gold standard » unique ne confirme tout Raynaud. La référence pour l’étude morphologique périunguéale est la vidéocapillaroscopie standardisée.</div><p class="src">Sources : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://iris.uniroma1.it/retrieve/e3835325-2581-15e8-e053-a505fe0a3de9/Smith_Standardisation_2020.pdf" target="_blank" rel="noopener">Standardisation capillaroscopique, Smith et al., 2020</a>.</p></section>
<section class="ilot" id="i73-7"><h2><span class="n">7</span>Acrosyndromes : distinguer les mécanismes</h2><p>La temporalité, la douleur et la température séparent les principaux acrosyndromes. Cette distinction évite de prescrire le même vasodilatateur à toute extrémité colorée.</p><table class="t"><tr><th>Phénotype</th><th>Orientation clinique et limite</th></tr><tr><td><button class="w" data-k="i73-acrocyanose">Acrocyanose (cyanose persistante)</button></td><td>La coloration bleutée est persistante, souvent symétrique, froide et peu douloureuse. Une forme douloureuse, asymétrique ou nécrotique impose une recherche secondaire.</td></tr><tr><td><button class="w" data-k="i73-erythromelalgie">Érythromélalgie (douleur, rougeur et chaleur)</button></td><td>La chaleur ou l’exercice provoquent une brûlure avec rougeur et chaleur locale. Une origine neuropathique ou une maladie myéloproliférative change le traitement.</td></tr><tr><td><button class="w" data-k="i73-engelures">Engelures (inflammation retardée après froid)</button></td><td>Les lésions inflammatoires prurigineuses ou douloureuses persistent après l’exposition. Elles ne reproduisent pas la succession brève des phases d’un Raynaud.</td></tr><tr><td>Embolie digitale</td><td>Un doigt bleu douloureux d’apparition soudaine, surtout asymétrique, fait rechercher une obstruction et une source embolique. Les pouls proximaux peuvent rester présents.</td></tr></table><p>Un patient qui trempe continuellement ses pieds dans la glace pour soulager une érythromélalgie risque une macération et des lésions thermiques. Le refroidissement doit rester modéré. Une numération sanguine recherche une anomalie hématologique si le contexte évoque une forme secondaire.</p><div class="key"><b>À retenir.</b> La couleur est un résultat observable. Le déclencheur et la durée permettent de remonter au mécanisme.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/sites/books/NBK1163/" target="_blank" rel="noopener">GeneReviews, syndromes douloureux liés à SCN9A</a> ; <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/24491823/" target="_blank" rel="noopener">Consensus international Raynaud, Maverakis et al., 2014</a> ; <a data-reference-source="1" href="https://www.esvs.org/wp-content/uploads/2020/02/Acute-Limb-Ischaemia-Feb-2020.pdf" target="_blank" rel="noopener">Recommandations ESVS, ischémie aiguë, 2020</a>.</p></section>
<section class="ilot" id="i73-8"><h2><span class="n">8</span>Thromboangéite oblitérante : ne pas confondre avec le Raynaud</h2><p>La <button class="w" data-k="i73-buerger">thromboangéite oblitérante de Buerger (diagnostic clinique et exclusions)</button> est une maladie inflammatoire occlusive des artères et des veines, généralement distales. La thrombose réduit durablement le débit ; la douleur de repos et les ulcères ne correspondent plus à un simple spasme. Le tabac entretient fortement la maladie, sans que tous les mécanismes de cette dépendance soient établis.</p><p>Les critères de Shionoya associent cinq éléments : une histoire de tabagisme, un début avant 50 ans, des occlusions infrapoplitées, une atteinte des membres supérieurs ou une thrombophlébite migratrice, et l’absence de facteurs athéromateux autres que le tabac. Ils structurent la suspicion ; ils ne constituent pas une preuve anatomopathologique universelle.</p><p>Le médecin exclut notamment une source embolique, une athérosclérose, un diabète, une connectivite et une thrombophilie selon le contexte. L’imagerie peut montrer des occlusions segmentaires distales et des collatérales tortueuses. Ces collatérales ne sont pas spécifiques et n’autorisent pas, seules, un diagnostic de Buerger.</p><p>L’arrêt complet des produits du tabac représente la mesure déterminante. Une simple réduction de consommation ne supprime pas l’exposition. Le soutien du sevrage associe accompagnement et choix pharmacologique spécialisé, car la place de la nicotine de substitution dans cette maladie ne se résume pas au traitement habituel du tabagisme.</p><div class="key"><b>À retenir.</b> Un patient jeune fumeur avec ischémie distale demande un diagnostic d’exclusion documenté. L’âge et le tabac ne suffisent pas.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.internationaljournalofcardiology.com/article/S0167-5273%2898%2900175-2/abstract" target="_blank" rel="noopener">Critères diagnostiques de Buerger, Shionoya, 1998</a> ; <a data-reference-source="1" href="https://compendium.ch/fr/product/94928-ilomedin-inf-konz-20-mcg-ml-i-v" target="_blank" rel="noopener">Information suisse Ilomedin, consultée le 08.10.2026</a>.</p></section>
