<template data-pop="i95-perfusion" data-title="Pression basse, débit et transport d’oxygène"><p>La pression soutient un gradient de perfusion ; le débit apporte réellement le sang aux organes. Une personne peut tolérer une pression habituellement basse si le débit et les réserves locales suffisent. Inversement, un choc peut commencer avant une hypotension marquée.</p><p>La délivrance d’oxygène dépend du débit cardiaque et du contenu artériel en oxygène. Une anémie réduit ce contenu ; une baisse du débit réduit la quantité de sang livrée. Une saturation pulsée normale n’évalue pas à elle seule ces deux composantes.</p><div class="key"><b>Conséquence.</b> Le médecin évalue conscience, respiration, perfusion périphérique et diurèse. Une pression isolée ne distingue pas une variante constitutionnelle d’une urgence.</div><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/9438742/" target="_blank" rel="noopener">Weiskopf et al., réponse à l’anémie aiguë, 1998</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations européennes sur la syncope, 2018</a>.</p></template>
<template data-pop="i95-seuils" data-title="Seuils : une variation, une temporalité et un référentiel"><p>Le consensus autonomique définit la forme classique par une baisse soutenue ≥ 20 mmHg systolique ou ≥ 10 mmHg diastolique dans les trois minutes. Une valeur couchée puis debout permet de calculer cette variation.</p><p>Les recommandations européennes sur la syncope ajoutent une baisse soutenue vers une pression systolique &lt; 90 mmHg. Ainsi, 95 à 88 mmHg n’atteint pas une variation de 20 mmHg, mais peut répondre à ce critère absolu supplémentaire. La reproduction du symptôme renforce l’imputabilité.</p><p>La forme initiale dépasse 40 mmHg systoliques ou 20 mmHg diastoliques dans les quinze secondes et récupère rapidement. La forme retardée apparaît après trois minutes. Le seuil ne suffit donc pas : le délai et la durée font partie du diagnostic.</p><div class="key"><b>Limite.</b> Une hypertension couchée peut conduire à utiliser un seuil systolique de variation de 30 mmHg dans certains consensus. Le médecin donne les valeurs brutes et le référentiel, plutôt qu’une conclusion sans contexte.</div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8184725/" target="_blank" rel="noopener">Consensus autonomique, 2021</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations européennes, section 4.2.2.1, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29766366/" target="_blank" rel="noopener">Consensus hypertension couchée, 2018</a>.</p></template>
<template data-pop="i95-chutes" data-title="Chute : rechercher une perte de perfusion sans présumer sa cause"><p>Une baisse du débit cérébral peut provoquer une présyncope, une syncope ou une instabilité. Un patient âgé peut ne pas décrire l’obscurcissement visuel, avoir oublié l’événement ou présenter une perception atténuée des symptômes.</p><p>Le médecin demande le témoignage, la posture et le délai. Il recherche aussi une cause mécanique, sensorielle, neurologique ou médicamenteuse sédative. Une baisse orthostatique mesurée ne prouve pas que toute chute provienne d’elle.</p><div class="key"><b>Conséquence.</b> La prévention combine traitement de la cause documentée, adaptation de l’environnement et évaluation de la marche. Elle ne se limite pas à augmenter la pression.</div><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/38205630/" target="_blank" rel="noopener">Déclaration cardiovasculaire, 2024</a>.</p></template>
<template data-pop="i95-baroreflexe" data-title="Baroréflexe : pourquoi le lever augmente normalement le tonus vasculaire"><p>Les récepteurs carotidiens et aortiques détectent l’étirement artériel. Le lever diminue temporairement le retour veineux, le volume éjecté et l’étirement. Le signal afférent aux centres bulbaires diminue.</p><p>La réponse normale accroît la commande sympathique et réduit le frein vagal. Les artérioles se contractent, les veines réduisent leur capacité et la fréquence peut augmenter. Ces réponses soutiennent les résistances et le retour veineux.</p><div class="key"><b>Limite.</b> Une réserve réduite, une neuropathie ou un médicament peut limiter un maillon. Une faible accélération du pouls sous bêtabloquant ne démontre pas une dénervation.</div><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/1191448/" target="_blank" rel="noopener">Localisation des lésions autonomiques, 1975</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29405350/" target="_blank" rel="noopener">Réponse cardiaque dans les synucléinopathies, 2018</a>.</p></template>
<template data-pop="i95-hypovolemie" data-title="Hypovolémie : moins de remplissage malgré une compensation active"><p>Une perte d’eau et de sodium réduit le volume extracellulaire ; une hémorragie enlève aussi des cellules et de l’hémoglobine. Le retour veineux et le remplissage diminuent, ce qui réduit le volume éjecté. Le lever ajoute une redistribution veineuse à ce volume déjà insuffisant.</p><p>Une accélération cardiaque peut soutenir la compensation. Elle ne garantit pas un débit suffisant. Le médecin recherche pertes, prises diurétiques, variation de poids, saignement et signes de congestion avant de choisir une correction.</p><div class="key"><b>Limite.</b> Une natrémie normale n’exclut pas une perte proche de l’isotonicité. Une insuffisance cardiaque peut associer congestion et faible perfusion ; un remplissage empirique peut alors nuire.</div><p class="src">Source : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Causes de syncope orthostatique, recommandations européennes, 2018</a>.</p></template>
<template data-pop="i95-neurogene" data-title="Hypotension neurogène : une réponse sympathique insuffisante"><p>Une maladie centrale ou une neuropathie périphérique peut réduire la commande ou la transmission sympathique. La libération de noradrénaline devient insuffisante au lever ; les résistances et la capacitance veineuse ne s’adaptent plus correctement.</p><p>Une baisse reproductible importante avec peu d’accélération cardiaque peut orienter. Des troubles urinaires, sudoraux ou digestifs et un syndrome parkinsonien renforcent la cohérence, sans être spécifiques. Une hypovolémie ou un médicament peut s’y ajouter.</p><div class="key"><b>Conséquence.</b> Le médecin documente le profil postural, les autres fonctions autonomiques et l’hypertension couchée. Un avis spécialisé précise le mécanisme lorsque la cause reste incertaine.</div><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/29405350/" target="_blank" rel="noopener">Kaufmann et collaborateurs, profil cardiaque des synucléinopathies, 2018</a>.</p></template>
<template data-pop="i95-iatrogenie" data-title="Iatrogénie : quatre leviers différents"><p>Les diurétiques peuvent diminuer le volume disponible. Les nitrés et les bloqueurs alpha diminuent le tonus vasculaire ; les nitrés réduisent notamment le retour veineux. Les bêtabloquants limitent une accélération cardiaque compensatrice.</p><p>Certains antipsychotiques, antidépresseurs tricycliques et autres psychotropes bloquent les récepteurs alpha ou perturbent la réponse autonome. Les médicaments sédatifs peuvent ajouter un risque de chute sans provoquer nécessairement une baisse de pression. Le mécanisme dépend donc de la molécule et de la dose.</p><p>Le médecin relie l’introduction, la dose, l’heure de prise et l’événement. Il vérifie l’indication et les bénéfices avant une adaptation, puis répète la mesure. La relation temporelle suggère une cause ; elle n’exclut pas une maladie concomitante.</p><div class="key"><b>À retenir.</b> La déprescription est raisonnée et surveillée. Elle ne consiste pas à arrêter tous les traitements cardiovasculaires.</div><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/38205630/" target="_blank" rel="noopener">Déclaration cardiovasculaire sur l’orthostatisme et les traitements, 2024</a>.</p></template>
<template data-pop="i95-surrenale" data-title="Insuffisance surrénalienne : pertes sodées et réactivité vasculaire"><p>Dans une insuffisance surrénalienne primaire, le déficit minéralocorticoïde peut provoquer une perte rénale de sodium et une réduction du volume. Le déficit de cortisol diminue la réponse adéquate au stress et la réactivité vasculaire. Une hypotension peut donc associer plusieurs mécanismes.</p><p>Une hyponatrémie, une hyperkaliémie, des symptômes digestifs ou une hyperpigmentation orientent selon le contexte. Une insuffisance secondaire ou induite par glucocorticoïdes conserve habituellement mieux la fonction minéralocorticoïde ; l’absence d’hyperkaliémie ne l’exclut pas.</p><div class="alert"><b>Crise possible.</b> Un patient instable avec suspicion de crise surrénalienne reçoit le traitement urgent de cette crise. Le dosage hormonal ne doit pas retarder la prise en charge.</div><div class="key"><b>Limite.</b> La fludrocortisone seule ne remplace pas le traitement glucocorticoïde d’une crise.</div><p class="src">Sources : <a href="https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency" target="_blank" rel="noopener">Endocrine Society, insuffisance primaire, 2016</a> ; <a href="https://www.endocrine.org/clinical-practice-guidelines/glucocorticoid-induced-adrenal-insufficiency" target="_blank" rel="noopener">Recommandation conjointe sur l’insuffisance induite, 2024</a>.</p></template>
<template data-pop="i95-symptomes" data-title="Symptômes : territoire perfusé et chronologie"><p>Un obscurcissement visuel, une faiblesse ou une sensation de perte de connaissance peuvent accompagner une baisse de perfusion au lever. Une douleur cervicoscapulaire peut correspondre à une perfusion musculaire insuffisante lors de la station debout dans certains syndromes autonomiques.</p><p>Le médecin précise le délai, la durée et la disparition en position assise ou couchée. Une plainte persistante indépendamment de la posture demande d’autres explications. Une douleur thoracique ou un déficit neurologique ne doit pas être attribué automatiquement à l’orthostatisme.</p><div class="key"><b>Conséquence.</b> L’association temporelle et la reproduction sous mesure sont plus instructives qu’un seul mot comme « vertige ».</div><p class="src">Source : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8184725/" target="_blank" rel="noopener">Consensus sur les symptômes et leur reproduction, 2021</a>.</p></template>
<template data-pop="i95-mesure" data-title="Test debout : mesurer correctement et prévenir la chute"><p>Le patient reste couché au moins cinq minutes. Le médecin mesure pression et pouls, puis supervise le lever. Il note les valeurs vers une minute et trois minutes avec les symptômes et leur horaire.</p><p>Le brassard est adapté au bras ; le bras reste à hauteur du cœur. Un bras pendant ajoute un gradient hydrostatique qui surestime la pression locale. Le médecin évite mouvements et conversation pendant la mesure et documente les traitements, le repas et l’heure.</p><p>Une douleur, une faiblesse majeure ou une présyncope conduit à arrêter l’épreuve et recoucher le patient. Un brassard intermittent ne saisit pas une chute initiale de quelques secondes ; un enregistrement continu est alors plus adapté.</p><div class="key"><b>Limite.</b> Une mesure assise puis debout ou un test court négatif peut manquer le phénomène. Le médecin rapproche le protocole du scénario réel.</div><p class="src">Source : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8184725/" target="_blank" rel="noopener">Consensus d’exploration, 2021</a>.</p></template>
<template data-pop="i95-rapport" data-title="Rapport fréquence/pression : calcul valide et facteurs confondants"><p>Le médecin divise l’augmentation du pouls par la baisse systolique, en utilisant l’amplitude positive de la baisse. Exemple : 66 à 74/min et 150 à 110 mmHg donnent 8/40, soit 0,20 battement/min par mmHg.</p><p>Un rapport inférieur à 0,5 suggère une composante neurogène dans les populations étudiées. La réponse cardiaque faible accompagne une compensation autonome déficiente. Un rapport plus élevé favorise des facteurs non neurogènes, sans exclure une association de mécanismes.</p><div class="trap"><span class="k">Piège</span> Le seuil ne s’applique pas mécaniquement en fibrillation atriale, sous médicament chronotrope ou avec stimulation imposée. Une différence systolique proche de zéro rend aussi le quotient peu informatif.</div><div class="key"><b>Conséquence.</b> Ce rapport oriente une exploration ; il ne diagnostique pas seul Parkinson ni une autre maladie précise.</div><p class="src">Source primaire : <a href="https://pubmed.ncbi.nlm.nih.gov/29405350/" target="_blank" rel="noopener">Kaufmann et collaborateurs, 2018</a>.</p></template>
<template data-pop="i95-differentiels" data-title="Orthostatisme, syncope réflexe et tachycardie posturale"><p>L’hypotension orthostatique décrit une réponse de pression au lever. La syncope réflexe associe une vasodépression, une cardio-inhibition ou les deux ; elle apparaît souvent après une contrainte prolongée et peut être précédée de nausées, sueurs et pâleur.</p><p>La tachycardie posturale décrit un autre syndrome : une accélération excessive et soutenue au lever, dans un contexte d’intolérance chronique, sans hypotension orthostatique répondant aux critères. Une tachycardie après diarrhée ne suffit pas à retenir ce syndrome.</p><div class="key"><b>Limite.</b> Les mécanismes peuvent coexister. La table basculante peut révéler une susceptibilité hypotensive sans prouver qu’elle explique tous les événements.</div><p class="src">Sources : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations sur la syncope, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8184725/" target="_blank" rel="noopener">Consensus autonomique, 2021</a>.</p></template>
<template data-pop="i95-choc" data-title="Choc : une défaillance de perfusion à expliquer immédiatement"><p>Le choc correspond à une défaillance circulatoire avec apport ou utilisation d’oxygène insuffisant pour les tissus. Le mécanisme peut être hypovolémique, cardiogénique, obstructif ou distributif. La pression seule ne tranche pas entre ces causes.</p><p>Le médecin relie les pertes, la congestion, l’infection, les symptômes thoraciques, les constantes et la perfusion. Une peau froide peut refléter une vasoconstriction compensatrice ; une peau chaude peut accompagner une vasodilatation distributive. Aucun signe isolé ne suffit.</p><div class="key"><b>Conséquence.</b> La prise en charge urgente cible la cause et surveille la réponse. Un remplissage excessif peut aggraver un œdème pulmonaire ; un presseur oral n’est pas une réanimation du choc.</div><p class="src">Lien clinique : <a href="https://vialdjoukang-spec.github.io/Medina/fragments/MEDINA_T1_agents-therapeutique.html#/entry/A41" target="_blank" rel="noopener">A41 — Sepsis</a> ; <a href="#/entry/I50">I50 — Insuffisance cardiaque</a> ; <a href="https://vialdjoukang-spec.github.io/Medina/fragments/MEDINA_S02_respiratoire.html#/entry/I26" target="_blank" rel="noopener">I26 — Embolie pulmonaire</a>.</p></template>
<template data-pop="i95-manoeuvres" data-title="Contractions et compression : réduire le stockage veineux"><p>Les contractions des jambes, des fessiers et de l’abdomen compriment les veines et favorisent le retour au cœur. Le patient peut croiser les jambes et contracter ses muscles si son équilibre le permet. Un patient fragile s’assied ou s’allonge plutôt que de risquer une chute pendant la manœuvre.</p><p>La compression abdominale agit sur un territoire splanchnique de capacitance. Un petit essai contrôlé chez des patients parkinsoniens soutient un effet sur la réponse orthostatique. La tolérance, la capacité à enfiler le dispositif et l’état vasculaire déterminent son intérêt réel.</p><div class="key"><b>Limite.</b> Ces moyens réduisent une contrainte de distribution ; ils ne remplacent pas le traitement d’une perte sanguine ou d’une maladie cardiaque aiguë.</div><p class="src">Source primaire : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6178725/" target="_blank" rel="noopener">Fanciulli et al., essai de compression abdominale, 2016</a>.</p></template>
<template data-pop="i95-eau" data-title="Eau : hydratation durable et réponse presseuse transitoire"><p>L’hydratation corrige une perte et soutient le volume. Dans certains syndromes autonomiques, boire rapidement environ 500 mL d’eau peut aussi produire une réponse presseuse transitoire. Celle-ci comporte une activation vasoconstrictrice ; son mécanisme ne se réduit pas au volume absorbé.</p><p>Ce moyen peut être planifié avant une activité debout chez un patient approprié. Une insuffisance cardiaque, une restriction hydrique, un trouble de déglutition ou une mauvaise tolérance limitent sa pertinence. La réponse varie ; le médecin vérifie l’effet réel.</p><div class="key"><b>Limite.</b> Une réponse presseuse ne démontre pas une correction de la cause. Une prise d’eau n’est pas le traitement d’un choc et ne justifie pas une surcharge quotidienne.</div><p class="src">Sources primaires : <a href="https://pubmed.ncbi.nlm.nih.gov/10662747/" target="_blank" rel="noopener">Jordan et al., réponse presseuse à l’eau, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11222121/" target="_blank" rel="noopener">Scott et al., activation vasoconstrictrice, 2001</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11904109/" target="_blank" rel="noopener">Shannon et al., syndromes orthostatiques, 2002</a>.</p></template>
<template data-pop="i95-supine" data-title="Hypertension couchée : le versant opposé du trouble autonome"><p>Dans une défaillance autonome neurogène, le consensus définit l’hypertension couchée par une pression ≥ 140 mmHg systolique ou ≥ 90 mmHg diastolique après au moins cinq minutes de décubitus. Cette définition concerne ce contexte ; elle ne remplace pas les critères généraux de diagnostic d’hypertension.</p><p>La pression couchée peut augmenter la perte nocturne de sodium et d’eau. Le volume disponible au lever matinal diminue alors. Un presseur peut améliorer le lever tout en aggravant ce phénomène nocturne.</p><div class="key"><b>Conséquence.</b> Le médecin documente les deux postures et, si indiqué, le profil sur vingt-quatre heures. Il évite une prise presseuse proche du coucher. Une stratégie nocturne doit aussi considérer les levers pour uriner et le risque de chute.</div><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/29766366/" target="_blank" rel="noopener">Consensus autonomique sur l’hypertension couchée, 2018</a>.</p></template>
<template data-pop="i95-tilt" data-title="Table basculante : ce qu’elle reproduit et ce qu’elle ne prouve pas"><p>La table incline le patient avec une contrainte posturale standardisée. L’équipe enregistre pression continue et rythme, en assurant la sécurité. L’examen peut documenter une baisse retardée, une susceptibilité réflexe ou d’autres mécanismes lorsque l’évaluation initiale ne suffit pas.</p><p>Le patient reconnaît le symptôme reproduit comme habituel. La concordance entre symptôme et profil circulatoire soutient l’interprétation. Une forme initiale nécessite plutôt un lever actif continu, car la contraction musculaire et les premières secondes ne sont pas identiques lors d’une inclinaison passive.</p><div class="key"><b>Limite.</b> Un test positif ne démontre pas la cause de chaque syncope et n’exclut pas une arythmie. Un résultat négatif ne clôt pas une histoire évocatrice si le scénario réel n’a pas été reproduit.</div><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/33740206/" target="_blank" rel="noopener">Consensus, 2021</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations européennes, 2018</a>.</p></template>
<template data-pop="i95-autonomique" data-title="Valsalva : relier les phases au mécanisme autonome"><p>Le patient effectue une expiration forcée selon un protocole contrôlé. L’augmentation de pression thoracique réduit temporairement le retour veineux. La réponse normale associe une compensation cardiaque et une récupération vasculaire ; après relâchement, le retour se rétablit et la réponse change encore.</p><p>Le profil de pression et de fréquence renseigne les composantes sympathique et parasympathique. Une récupération vasculaire insuffisante peut soutenir une défaillance autonomique. Une mauvaise exécution, des médicaments ou une maladie cardiaque compliquent l’analyse.</p><div class="key"><b>Conséquence.</b> L’examen est interprété avec normes, contexte et autres tests. Il ne localise pas seul une maladie neurologique.</div><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/33740206/" target="_blank" rel="noopener">Consensus d’exploration autonomique, 2021</a>.</p></template>
<template data-pop="i95-anemie" data-title="Anémie : contenu en oxygène, débit et hémorragie"><p>L’hémoglobine transporte l’essentiel de l’oxygène sanguin. Une baisse de sa concentration réduit le contenu artériel en oxygène, même si la saturation reste normale. Une accélération cardiaque et une augmentation du débit peuvent compenser partiellement ; une réserve cardiaque limitée réduit cette compensation.</p><p>Une hémorragie ajoute une perte de volume. La réduction du retour veineux diminue alors le débit, tandis que la perte d’hémoglobine réduit le transport. L’hémoglobine peut rester initialement proche de sa valeur habituelle avant redistribution ou perfusion liquidienne.</p><div class="key"><b>Limite.</b> Une anémie isolée ne provoque pas nécessairement une hypotension. Les expériences chez des volontaires jeunes ne définissent pas un seuil de sécurité pour un patient âgé ou coronarien.</div><p class="src">Sources primaires : <a href="https://pubmed.ncbi.nlm.nih.gov/9438742/" target="_blank" rel="noopener">Weiskopf et al., 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10773059/" target="_blank" rel="noopener">Énergie et fréquence sous anémie isovolémique, 2000</a>.</p></template>
<template data-pop="i95-sodium" data-title="Sodium : concentration relative, pas mesure de la volémie"><p>La natrémie renseigne l’équilibre entre l’eau et les solutés corporels échangeables. Une perte d’eau et de sodium dans des proportions proches peut réduire le volume sans modifier beaucoup cette concentration.</p><p>Une hyponatrémie peut accompagner une hypovolémie, une rétention d’eau ou une maladie endocrine ; ces mécanismes ne se traitent pas de la même façon. Le médecin associe les pertes, l’examen, la fonction rénale et, si indiqué, les examens urinaires. Une augmentation du sel ne découle pas automatiquement d’un sodium bas.</p><div class="key"><b>Conséquence.</b> Le dosage sert au diagnostic causal et à la sécurité hydrorénale. Il ne confirme ni n’exclut à lui seul une hypotension orthostatique.</div><p class="src">Référence endocrine : <a href="https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency" target="_blank" rel="noopener">Endocrine Society, 2016</a>. Référence du médicament : <a href="https://compendium.ch/fr/product/24995-florinef-cpr-0-1-mg" target="_blank" rel="noopener">Florinef, indications suisses de perte de sel</a>.</p></template>
<template data-pop="i95-potassium" data-title="Potassium : potentiel de membrane et sécurité du traitement"><p>Le gradient du potassium contribue au potentiel de repos des cellules excitables. Une hypokaliémie ou une hyperkaliémie peut perturber la conduction et favoriser une arythmie. Le risque dépend aussi de la vitesse du changement, des médicaments et de la cardiopathie.</p><p>Un diurétique ou la fludrocortisone peut favoriser une perte rénale de potassium. Une insuffisance rénale ou un déficit minéralocorticoïde peut favoriser une accumulation. Le médecin relie le résultat à ces mécanismes, et demande un électrocardiogramme si la gravité ou les symptômes le justifient.</p><div class="key"><b>Limite.</b> Le potassium normal n’exclut pas l’orthostatisme. Une supplémentation aveugle peut provoquer une hyperkaliémie ; elle suit le résultat et la fonction rénale.</div><p class="src">Sources : <a href="https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=eff2eae8-94ce-46ca-a027-6b1d08e7b96b&amp;type=display" target="_blank" rel="noopener">Fludrocortisone, information réglementaire</a> ; <a href="https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency" target="_blank" rel="noopener">Insuffisance surrénalienne, 2016</a>.</p></template>
<template data-pop="i95-creatinine" data-title="Créatinine : filtration, cinétique et limites thérapeutiques"><p>La créatinine contribue à l’estimation de la filtration rénale. Une perfusion rénale réduite peut faire diminuer la filtration, mais le changement de concentration n’est pas immédiat. La masse musculaire et les variations de production limitent aussi son interprétation.</p><p>Une atteinte rénale peut restreindre l’apport hydrosodé ou l’emploi de médicaments. La midodrine est contre-indiquée dans l’insuffisance rénale sévère selon les données suisses consultées. Le médecin compare la valeur à l’état antérieur et vérifie la diurèse et le contexte.</p><div class="key"><b>Limite.</b> Un chiffre initial normal n’exclut pas une perte aiguë de perfusion ; une hausse ne prouve pas à elle seule une déshydratation.</div><p class="src">Référence réglementaire : <a href="https://compendium.ch/fr/product/1708" target="_blank" rel="noopener">Gutron, contre-indications rénales</a>.</p></template>
<template data-pop="i95-glycemie" data-title="Glycémie : un malaise métabolique peut imiter l’orthostatisme"><p>Les neurones dépendent d’un apport énergétique continu. Une hypoglycémie peut provoquer sueurs, tremblements, faiblesse, confusion ou perte de connaissance. Le mécanisme n’est pas nécessairement une baisse posturale de pression.</p><p>Le médecin mesure rapidement la glycémie dans un tableau compatible, notamment sous traitement hypoglycémiant ou avec conscience altérée. Une glycémie normale pendant un épisode n’établit pas l’orthostatisme ; elle écarte seulement cette explication à cet instant.</p><div class="key"><b>Conséquence.</b> Une hypoglycémie documentée appelle sa correction et la recherche de sa cause. Elle n’est pas traitée par un presseur.</div><p class="src">Lien endocrine : <a href="https://www.endocrine.org/clinical-practice-guidelines/primary-adrenal-insufficiency" target="_blank" rel="noopener">Hypoglycémie parmi les signes d’insuffisance surrénalienne, 2016</a>.</p></template>
<template data-pop="i95-ecg" data-title="Rythme et structure : pourquoi une baisse orthostatique ne suffit pas"><p>Une arythmie peut diminuer brusquement le débit cardiaque. Un trouble de conduction ou un signe de maladie électrique sur l’électrocardiogramme modifie donc le risque d’une syncope. Un enregistrement bref normal n’exclut pas une arythmie intermittente.</p><p>Une échocardiographie répond à une suspicion structurale : obstruction valvulaire, dysfonction ventriculaire ou atteinte péricardique selon le tableau. Elle n’est pas un examen de confirmation de l’orthostatisme simple.</p><div class="key"><b>Conséquence.</b> Une syncope à l’effort, couchée ou précédée de palpitations garde sa démarche cardiaque même si une baisse au lever est aussi mesurée.</div><p class="src">Source : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations sur la syncope, 2018</a>.</p></template>
<template data-pop="i95-midodrine" data-title="Midodrine : activation, bénéfice debout et risque couché"><p>La midodrine est un précurseur de la desglymidodrine, agoniste alpha-1. L’activation contracte le muscle vasculaire, augmente les résistances et réduit la capacitance veineuse. La réponse ne restaure pas l’innervation autonome.</p><p>Les schémas Gutron adultes différencient forme fonctionnelle, iatrogène et sévère. Dans une forme sévère, l’information décrit 2,5 mg trois fois par jour au départ, avec titration individuelle et maximum 30 mg par jour. La première dose précède le lever de 30 à 45 minutes ; la dernière précède le coucher d’au moins quatre heures.</p><p>Le médecin suit symptômes et capacité debout, pression dans plusieurs postures, pouls et miction. Au début du traitement, Gutron demande un contrôle de pression assise et couchée au moins deux fois par semaine. Une hausse excessive couchée impose l’arrêt et une réévaluation. Hypertension, cardiopathie organique sévère, arythmies, insuffisance rénale sévère et rétention urinaire font notamment partie des contre-indications suisses. La liste exacte du produit reste déterminante.</p><div class="key"><b>Preuve et limite.</b> L’essai randomisé de 1997 étudie 171 participants et 10 mg trois fois par jour. Il soutient un bénéfice hémodynamique et symptomatique ; il ne justifie pas cette dose d’emblée ni une promesse de réduction de mortalité.</div><p class="src">Sources : <a href="https://compendium.ch/fr/product/1708" target="_blank" rel="noopener">Gutron, données suisses</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9091692/" target="_blank" rel="noopener">Low et al., essai randomisé, 1997</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27372462/" target="_blank" rel="noopener">Essai de table basculante, 2016</a>.</p></template>
<template data-pop="i95-fludrocortisone" data-title="Fludrocortisone : une rétention rénale avec risques propres"><p>La fludrocortisone agit sur les récepteurs minéralocorticoïdes. La réabsorption rénale de sodium augmente ; l’eau accompagne ce stock et le volume extracellulaire augmente. L’excrétion de potassium peut aussi augmenter.</p><p>La littérature orthostatique décrit généralement 0,1 mg par jour, avec adaptation jusqu’à 0,2 mg par jour. Ce schéma n’est pas une posologie suisse approuvée pour l’orthostatisme. Florinef décrit des indications surrénaliennes et de perte de sel ; l’emploi orthostatique est donc hors indication dans les données consultées.</p><p>Le médecin surveille poids, œdèmes, dyspnée, pression couchée et debout, potassium et fonction rénale. La déclaration cardiovasculaire de 2024 considère cet emploi contre-indiqué en présence d’insuffisance cardiaque. Une hypertension couchée impose aussi une réserve majeure. Cette recommandation clinique se distingue de l’autorisation suisse. Les pertes potassiques peuvent augmenter le risque d’arythmie et de toxicité de la digoxine.</p><div class="key"><b>Preuve et limite.</b> L’essai parkinsonien de 2017 est petit et ne démontre pas un bénéfice symptomatique universel. Une cohorte observe plus d’hospitalisations que sous midodrine ; son caractère observationnel ne prouve pas une causalité individuelle.</div><p class="src">Sources : <a href="https://compendium.ch/fr/product/24995-florinef-cpr-0-1-mg" target="_blank" rel="noopener">Florinef, indications suisses</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5693784/" target="_blank" rel="noopener">Dose orthostatique publiée, 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28224720/" target="_blank" rel="noopener">Schreglmann et al., essai, 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38205630/" target="_blank" rel="noopener">Déclaration cardiovasculaire, 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29025750/" target="_blank" rel="noopener">Grijalva et al., cohorte, 2017</a>.</p></template>
<template data-pop="i95-alternatives" data-title="Options spécialisées : cibles distinctes et statut à vérifier"><p>La droxidopa est un précurseur de noradrénaline. Un essai randomisé court soutient un bénéfice dans l’hypotension neurogène ; l’hypertension reste un risque. La pyridostigmine freine la dégradation de l’acétylcholine et peut renforcer la transmission autonome ; la réponse dépend de la réserve disponible.</p><p>L’acarbose ralentit la dégradation de glucides digestifs. Elle peut atténuer la chute postprandiale dans certains syndromes autonomiques, au prix d’effets digestifs. L’essai ciblé ne transforme pas cet emploi en traitement général de l’orthostatisme.</p><div class="key"><b>Limite réglementaire.</b> Les publications citées établissent des données d’étude, pas une indication suisse. Aucune posologie de routine ni autorisation suisse pour l’orthostatisme n’est attribuée ici à ces agents.</div><p class="src">Sources primaires : <a href="https://pubmed.ncbi.nlm.nih.gov/24944260/" target="_blank" rel="noopener">Droxidopa, essai de 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28224720/" target="_blank" rel="noopener">Pyridostigmine contre fludrocortisone, 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17515447/" target="_blank" rel="noopener">Acarbose en défaillance autonome, 2007</a>.</p></template>
<template data-pop="pareto-i95-clin" data-title="Pareto — Définition, mécanismes et clinique"><p class="ratio" data-cover="i95-0,i95-1,i95-2,i95-3,i95-4,i95-5,i95-6"></p><ul><li>Une pression basse exige une analyse de tolérance et de perfusion ; elle ne définit pas seule un choc.</li><li>Le lever réduit le retour veineux ; baroréflexe, tonus vasculaire et muscles compensent normalement.</li><li>La forme classique baisse durablement de 20 mmHg systoliques ou 10 mmHg diastoliques en trois minutes. Le référentiel européen ajoute la baisse soutenue vers moins de 90 mmHg systoliques.</li><li>La forme initiale dépasse 40 ou 20 mmHg dans les quinze secondes ; la forme retardée survient après trois minutes.</li><li>Volume, médicaments et atteinte autonome peuvent se combiner. Déclencheur, délai, récupération et contexte orientent les examens.</li><li>La sécurité, la perfusion et le volume sont évalués avant une épreuve debout ou un apport hydrosodé.</li></ul></template>
<template data-pop="pareto-i95-diag" data-title="Pareto — Diagnostic et alternatives"><p class="ratio" data-cover="i95-7"></p><ul><li>Les valeurs et le délai documentent le phénomène ; la reproduction du symptôme soutient son imputabilité.</li><li>Un rapport fréquence/baisse systolique inférieur à 0,5 suggère une composante neurogène seulement si rythme et médicaments permettent l’interprétation.</li><li>Syncope à l’effort, couchée, avec palpitations ou défaillance aiguë impose une démarche adaptée même si l’orthostatisme est positif.</li><li>Une mesure négative courte n’exclut pas les formes initiale et retardée.</li></ul></template>
<template data-pop="pareto-i95-traitement" data-title="Pareto — Urgence et traitement"><p class="ratio" data-cover="i95-8,i95-9,i95-10"></p><ul><li>Une hypoperfusion aiguë est traitée selon sa cause ; le patient instable ne subit pas d’épreuve debout.</li><li>Le médecin corrige les pertes et les prescriptions pertinentes, puis adapte lever, muscles, compression et hydratation.</li><li>Une augmentation hydrosodée dépend de la congestion, de la pression et du rein.</li><li>La midodrine soutient le tonus ; la fludrocortisone retient du sodium et son emploi orthostatique est hors indication suisse.</li><li>Le bénéfice fonctionnel et la sécurité couchée déterminent la poursuite du traitement.</li></ul></template>
<template data-pop="pareto-i95-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i95-11,i95-12,i95-13"></p><ul><li>Le journal relie posture, symptômes, repas et médicaments.</li><li>L’hypertension couchée peut aggraver les pertes nocturnes et les symptômes matinaux ; elle limite le traitement presseur.</li><li>Une personne âgée nécessite une analyse des chutes et de l’autonomie ; la grossesse et les maladies cardiorénales imposent des choix spécifiques.</li><li>Le compte rendu donne les chiffres, les délais, les symptômes reproduits, la cause et le référentiel.</li></ul></template>
<template data-pop="pareto-i95-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="i95-e-1,i95-e-2,i95-e-3,i95-e-4,i95-e-5"></p><ul><li>La mesure couchée puis debout est la référence clinique classique ; la forme initiale demande une mesure continue au lever actif.</li><li>La table basculante est conditionnelle et n’exclut pas une arythmie ; il n’existe pas de gold standard universel de l’hypotension.</li><li>Bras au niveau du cœur, brassard adapté, délais et contexte assurent l’interprétation.</li><li>Hémogramme, sodium, potassium, créatinine et glycémie répondent chacun à une question distincte.</li><li>Le rythme et la structure cardiaque sont explorés si le scénario le justifie ; un bilan ne remplace pas la mesure posturale.</li></ul></template>
<template data-pop="pareto-i95-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="i95-s-anat-1,i95-s-histo-1,i95-s-physio-1,i95-s-biochimie-1,i95-s-neuro-1"></p><ul><li>Les veines des jambes et de l’abdomen redistribuent le sang au lever ; muscles et compression favorisent le retour.</li><li>Un muscle vasculaire peut rester pharmacologiquement réactif malgré une dénervation.</li><li>Débit et résistances déterminent la pression ; contenu en oxygène et débit déterminent la délivrance.</li><li>La natrémie n’est pas la volémie ; le potassium participe à l’excitabilité.</li><li>Le baroréflexe associe récepteur, intégration bulbaire et réponses autonome et vasculaire.</li></ul></template>
<template data-pop="pareto-i95-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i95-p-1,i95-p-2,i95-p-3,i95-p-4"></p><ul><li>Le médecin corrige d’abord une cause ; le presseur traite une gêne persistante documentée.</li><li>Gutron distingue les formes fonctionnelle, iatrogène et sévère. La forme sévère débute à 2,5 mg trois fois par jour ; le maximum indiqué est 30 mg par jour.</li><li>La dernière prise précède le coucher d’au moins quatre heures. L’hypertension et les principales contre-indications suisses déterminent l’éligibilité.</li><li>La fludrocortisone augmente le volume et peut provoquer surcharge, hypertension et hypokaliémie ; son usage orthostatique est hors indication suisse.</li><li>Les alternatives spécialisées ne reçoivent pas de dose ou d’autorisation suisse supposée.</li><li>Le suivi associe fonction, pression couchée et debout, pouls, miction et paramètres hydrorénaux selon l’agent.</li></ul></template>

<template data-pop="i95-mnemo" data-title="Posture, temps, pouls, cause et sécurité"><p>Ce repère est une aide pédagogique, non un critère officiel.</p><ul><li>La posture relie le symptôme au coucher, au lever ou à la station debout.</li><li>Le temps distingue les premières secondes, les trois premières minutes et une baisse retardée.</li><li>Le pouls aide à interpréter la compensation, avec les limites du rythme et des médicaments.</li><li>La cause recherche pertes, prescriptions, maladie autonome et alternatives graves.</li><li>La sécurité vérifie la perfusion, le risque de chute et la pression couchée avant une intervention.</li></ul><div class="key"><b>Limite.</b> Le repère organise la démarche ; seuls le protocole et les critères du référentiel établissent le phénomène hémodynamique.</div></template>
