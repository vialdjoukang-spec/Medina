<div class="chap-head"><div class="code">I95 — Hypotension · CIM-10-GM 2024 · Cardiologie et régulation circulatoire</div><h1>Hypotension</h1><span class="status">Adulte · orthostatisme, médicaments et perfusion · 08.10.2026 · référentiels vérifiés : syncope 2018, consensus autonomique 2021, déclaration cardiovasculaire 2024</span></div>

<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#i95-0">Pression, symptômes et perfusion</a></li><li><a href="#i95-1">Définitions et temporalités</a></li><li><a href="#i95-2">Terrain et conséquences</a></li><li><a href="#i95-3">Du lever à la compensation</a></li><li><a href="#i95-4">Causes et médicaments</a></li><li><a href="#i95-5">Anamnèse orientée</a></li><li><a href="#i95-6">Examen clinique et sécurité</a></li><li><a href="#i95-7">Diagnostic et alternatives</a></li><li><a href="#i95-8">Urgence circulatoire</a></li><li><a href="#i95-9">Traitement non médicamenteux</a></li><li><a href="#i95-10">Choix du traitement</a></li><li><a href="#i95-11">Suivi et hypertension couchée</a></li><li><a href="#i95-12">Situations particulières et cas</a></li><li><a href="#i95-13">Critères formels du diagnostic</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="i95-0"><h2><span class="n">0</span>Pression, symptômes et perfusion</h2><p>Une femme asymptomatique a une pression de 96/62 mmHg depuis plusieurs années. Un homme confus présente 96/62 mmHg après une hémorragie. Le chiffre est identique ; la perfusion et la trajectoire diffèrent. <button class="w" data-k="i95-perfusion">Une pression basse ne définit pas seule un choc (pression, débit et oxygène)</button>. Le médecin recherche d’abord une défaillance aiguë, puis un lien reproductible avec la posture ou un autre déclencheur.</p><p>Le raisonnement associe la pression habituelle, les symptômes, la fonction des organes et les circonstances. Il distingue une hypotension constitutionnelle tolérée d’une hypoperfusion, mesure correctement l’orthostatisme et recherche une cause réversible avant un médicament presseur.</p><div class="key"><b>À retenir.</b> Le traitement vise une perfusion et une autonomie suffisantes. Il ne vise pas à normaliser arbitrairement un chiffre isolé.</div></section>
<section class="ilot" id="i95-1"><h2><span class="n">1</span>Définitions et temporalités</h2><p>La pression artérielle résulte du débit cardiaque et des résistances vasculaires. Une valeur systolique inférieure à 90 mmHg constitue un repère clinique fréquent, sans définition universelle de maladie constitutionnelle. L’<button class="w" data-k="i95-seuils">hypotension orthostatique (seuils, délai et limites)</button> décrit au contraire une variation liée au lever, même lorsque la pression debout demeure supérieure à 90 mmHg.</p><p>Le délai détermine la technique de mesure. Un brassard intermittent peut documenter une baisse persistante, mais manquer une chute de quelques secondes.</p><table class="t"><tr><th>Forme</th><th>Critère hémodynamique</th><th>Conséquence technique</th></tr><tr><td>Classique</td><td>La baisse est soutenue : systolique ≥ 20 mmHg ou diastolique ≥ 10 mmHg dans les trois minutes après le lever.</td><td>La mesure couchée puis debout documente la baisse. Le symptôme associé renforce son imputabilité.</td></tr><tr><td>Initiale</td><td>La baisse transitoire dépasse 40 mmHg systoliques ou 20 mmHg diastoliques dans les quinze premières secondes.</td><td>Le lever actif avec mesure continue battement par battement est nécessaire pour objectiver ce bref événement.</td></tr><tr><td>Retardée</td><td>La baisse soutenue répond aux seuils classiques, mais survient après trois minutes debout.</td><td>Le médecin prolonge l’épreuve ou demande une exploration spécialisée.</td></tr><tr><td>Postprandiale</td><td>Une baisse systolique ≥ 20 mmHg dans les deux heures après le repas est un repère utilisé ; les protocoles ne sont pas uniformes.</td><td>Le médecin compare des mesures avant et après un repas habituel, avec horaires et symptômes.</td></tr></table><p>La pression de 150 à 125 mmHg remplit le critère systolique classique ; la pression de 95 à 88 mmHg ne remplit pas ce seuil de variation. Le référentiel européen de syncope ajoute toutefois une baisse soutenue vers une pression systolique inférieure à 90 mmHg. Ce second patient peut donc répondre à ce critère supplémentaire ; la concordance symptomatique reste déterminante. Un seuil décrit un phénomène ; il ne remplace pas son analyse clinique. En présence d’hypertension couchée, certains consensus retiennent une baisse systolique ≥ 30 mmHg ; le contexte et le protocole doivent être indiqués.</p><div class="trap"><span class="k">Piège</span> Une récupération lente dans les deux ou trois premières minutes n’est pas une hypotension retardée. Cette dernière commence après trois minutes.</div><div class="key"><b>À retenir.</b> Le compte rendu donne les valeurs, les délais et les symptômes, plutôt qu’une étiquette sans mesure.</div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8184725/" target="_blank" rel="noopener">Consensus des sociétés autonomiques, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29766366/" target="_blank" rel="noopener">Consensus hypertension couchée, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17515447/" target="_blank" rel="noopener">Shibao et al., hypotension postprandiale, 2007</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations européennes, critère absolu, 2018</a>.</p></section>
<section class="ilot" id="i95-2"><h2><span class="n">2</span>Terrain et conséquences</h2><p>L’âge, la fragilité, le diabète, les maladies neurodégénératives et la polymédication rendent la compensation du lever plus vulnérable. Le vieillissement réduit la réserve baroréflexe ; une neuropathie peut diminuer la libération sympathique de noradrénaline. Une infection ou une perte liquidienne ajoute alors une contrainte à une régulation déjà limitée.</p><p>La fréquence dépend fortement de la population et du protocole : une mesure assise ne détecte pas les mêmes cas qu’une mesure couchée. Aucun pourcentage spécifique à la population suisse n’est retenu ici. Les études associent l’orthostatisme aux chutes et aux événements cardiovasculaires ; elles ne prouvent pas que toute cette association soit causale. <button class="w" data-k="i95-chutes">Une chute peut révéler une hypoperfusion sans plainte de vertige (mécanisme et prudence)</button>.</p><div class="key"><b>À retenir.</b> L’absence de plainte ne dispense pas d’une mesure chez un patient qui tombe ou communique difficilement. La cause et la sécurité comptent davantage qu’une prévalence générale.</div><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/38205630/" target="_blank" rel="noopener">Déclaration de l’American Heart Association, 2024</a>.</p></section>
<section class="ilot" id="i95-3"><h2><span class="n">3</span>Du lever à la compensation</h2><p>Au repos couché, la gravité impose peu de gradient entre le cœur et les membres inférieurs. Au lever, une partie du sang se redistribue vers les veines des jambes et de l’abdomen. Le retour veineux, le remplissage ventriculaire et le volume éjecté diminuent temporairement. Le <button class="w" data-k="i95-baroreflexe">baroréflexe (récepteur, intégration et réponse)</button> augmente normalement le tonus sympathique et réduit le frein vagal.</p><p>La vasoconstriction artériolaire soutient les résistances ; la constriction veineuse et les contractions musculaires améliorent le retour au cœur. La fréquence cardiaque augmente selon la réserve du patient. Une hypovolémie diminue le volume disponible ; une défaillance autonomique empêche la réponse adaptée ; un médicament peut agir sur l’un ou plusieurs de ces leviers.</p><div class="two"><div class="card"><h4>Réponse préservée, volume insuffisant</h4><p>Après une diarrhée, le pouls peut accélérer fortement au lever. Le système sympathique réagit, mais ne compense pas suffisamment la baisse du remplissage.</p></div><div class="card"><h4>Réponse autonomique défaillante</h4><p>Dans une synucléinopathie, la pression peut chuter fortement avec une faible accélération du pouls. La vasoconstriction réflexe et parfois la réponse chronotrope sont insuffisantes.</p></div></div><div class="key"><b>À retenir.</b> La fréquence aide à comprendre la cause, sous réserve d’un rythme interprétable et de médicaments qui ne la bloquent pas.</div><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/29405350/" target="_blank" rel="noopener">Kaufmann et collaborateurs, réponse cardiaque, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/1191448/" target="_blank" rel="noopener">Ibrahim, localisation des lésions autonomiques, 1975</a>.</p></section>
<section class="ilot" id="i95-4"><h2><span class="n">4</span>Causes et médicaments</h2><p>Le médecin cherche les facteurs réversibles et les maladies qui rendent le lever dangereux. Plusieurs mécanismes coexistent souvent chez une personne âgée. Une hypotension après ajout d’un médicament n’exclut pas une hémorragie concomitante.</p><table class="t"><tr><th>Mécanisme</th><th>Exemples et recherche clinique</th><th>Pourquoi la pression baisse</th></tr><tr><td>Volume circulant réduit</td><td><button class="w" data-k="i95-hypovolemie">Diarrhée, vomissements, pertes sanguines ou diurétiques (volume et réserve)</button></td><td>Le cœur reçoit moins de sang ; le volume éjecté diminue avant même une défaillance myocardique.</td></tr><tr><td>Défaillance autonomique</td><td><button class="w" data-k="i95-neurogene">Parkinson, atrophie multisystématisée, neuropathie diabétique ou amyloïde (indices et orientation)</button></td><td>La libération sympathique et la vasoconstriction réflexe deviennent insuffisantes.</td></tr><tr><td>Effet médicamenteux</td><td><button class="w" data-k="i95-iatrogenie">Vasodilatateurs, bloqueurs alpha, médicaments chronotropes et psychotropes (mécanismes distincts)</button></td><td>La réduction du volume, des résistances ou de la réponse cardiaque compromet la compensation.</td></tr><tr><td>Défaillance aiguë</td><td>Une hémorragie, un sepsis, une embolie pulmonaire, une tamponnade ou une défaillance cardiaque nécessitent leur démarche urgente.</td><td>Le débit efficace ou les résistances ne suffisent plus à perfuser les tissus.</td></tr><tr><td>Cause endocrine</td><td><button class="w" data-k="i95-surrenale">Insuffisance surrénalienne (volume, cortisol et urgence)</button></td><td>Le déficit hormonal peut associer perte sodée, baisse du volume et réponse vasculaire insuffisante.</td></tr></table><p>Le médecin réconcilie les prescriptions, les prises réelles, les médicaments sans ordonnance et les modifications récentes. Il identifie l’indication de chaque traitement avant de réduire sa dose. Une cardiopathie ne justifie pas l’arrêt automatique de médicaments pronostiques.</p><div class="key"><b>À retenir.</b> La liste des causes conduit à une action : corriger une perte, adapter une prescription ou rechercher une maladie autonomique.</div></section>
<section class="ilot" id="i95-5"><h2><span class="n">5</span>Anamnèse orientée</h2><p>Le médecin fait préciser la posture, le délai et la récupération. Un obscurcissement visuel dès le lever qui disparaît en quelques secondes suggère une forme initiale. Un malaise après plusieurs minutes debout suggère une autre temporalité. <button class="w" data-k="i95-symptomes">Troubles visuels, faiblesse, douleur cervicale et présyncope (hypoperfusion et limites)</button> sont décrits avec leur lien au lever.</p><p>Une aggravation matinale, après un repas, sous chaleur ou après alcool révèle une contrainte sur le volume ou le tonus vasculaire. Le médecin recherche une syncope à l’effort, des palpitations préalables, une douleur thoracique et des antécédents familiaux de mort subite. Ces éléments orientent vers une cause cardiaque potentiellement grave, même si une baisse orthostatique est mesurée.</p><p>Le patient ou un témoin décrit une chute, une perte de connaissance, sa durée et la récupération. Une confusion prolongée ou un déficit focal n’est pas expliqué par une présyncope simple. Une constipation, une dysfonction urinaire, un trouble sudoral ou un syndrome parkinsonien orientent vers une atteinte autonomique ; chacun reste non spécifique.</p><div class="key"><b>À retenir.</b> Le scénario doit relier un déclencheur, un délai et une manifestation. La concordance sera recherchée pendant la mesure.</div></section>
<section class="ilot" id="i95-6"><h2><span class="n">6</span>Examen clinique et sécurité</h2><p>Le médecin évalue d’abord l’état mental, la respiration, la température, le pouls, la pression et la perfusion périphérique. Des marbrures, une peau froide ou une oligurie suggèrent une perfusion insuffisante, sans désigner seuls sa cause. Une peau chaude n’exclut pas un choc distributif. L’épreuve debout attend la stabilisation si le patient risque une syncope ou présente une défaillance aiguë.</p><p>La recherche d’une congestion jugulaire, de crépitants ou d’œdèmes précède une proposition d’augmentation hydrosodée. Ces signes peuvent révéler un excès de volume malgré une pression basse. Une pâleur ou un saignement conduit à rechercher une anémie ou une hémorragie. L’examen neurologique recherche les signes moteurs et sensitifs qui étayent une maladie sous-jacente.</p><p>Chez un patient stable, le <button class="w" data-k="i95-mesure">test debout (protocole reproductible et prévention des chutes)</button> associe pression, fréquence et symptômes. Le médecin aide le patient à se lever ; il stoppe l’épreuve et le recouche en cas de malaise important.</p><div class="trap"><span class="k">Erreur fréquente</span> Une sécheresse buccale ne prouve pas une hypovolémie : des médicaments anticholinergiques peuvent l’expliquer. La conclusion combine les pertes, le poids, l’examen et les examens ciblés.</div><div class="key"><b>À retenir.</b> La sécurité et l’évaluation du volume précèdent l’orthostatisme et son traitement.</div><button class="pareto-btn ui" data-k="pareto-i95-clin">▲ Loi de Pareto — Définition, mécanismes et clinique</button></section>
