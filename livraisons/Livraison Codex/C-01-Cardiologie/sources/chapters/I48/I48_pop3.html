<p>Le bénéfice est démontré surtout sur les récidives, la charge arythmique et les symptômes, beaucoup moins sur les événements graves. La pression artérielle fait exception : une baisse de 5 mmHg de la systolique réduit de 9 % les événements cardiovasculaires majeurs, en FA comme en rythme sinusal (ESC 2024, section 5.1). Des données d’observation évoquent un point de non-retour au-delà duquel la perte de poids n’apporte plus de bénéfice (section 5.4). Le traitement commence donc dès le diagnostic.</p>
<div class="lab">Ce qui change la décision</div><p>La prise en charge des facteurs de risque fait partie intégrante du traitement de toute FA, quelle que soit la stratégie de fréquence ou de rythme (ESC 2024, tableau de recommandations 5, classe I, niveau B). Elle ne remplace pas l’anticoagulation. Le traitement antihypertenseur vise une systolique de 120 à 129 mmHg chez la plupart des adultes (classe I, niveau B) ; une cible inférieure à 140 mmHg est acceptable en cas de mauvaise tolérance, de fragilité ou à partir de 85 ans. La perte de poids vise au moins 10 % du poids corporel (classe I, niveau B). L’alcool est limité à 3 verres standard, soit 30 g, par semaine (classe I, niveau B). Un programme d’exercice adapté est recommandé dans la FA paroxystique ou persistante (classe I, niveau B), et un contrôle glycémique efficace chez le diabétique (classe I, niveau C). Le traitement des apnées peut seulement être envisagé (classe IIb, niveau B), car les petits essais randomisés sont discordants (section 5.5).</p>
<div class="lab">Source</div><p>ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414), sections 5.1, 5.3 à 5.7 et tableau de recommandations 5. Burstein et al., <i>J Am Coll Cardiol</i> 2008;51:802-9. Hatem et al., <i>Cardiovasc Res</i> 2014;102:205-13. Voskoboinik et coll., <i>Heart Rhythm</i> 2019;16:251-9. Nalliah et coll., <i>JACC Clin Electrophysiol</i> 2022;8:869-77. Pathak et coll., <i>J Am Coll Cardiol</i> 2015;65:2159-69. Voskoboinik et coll., <i>N Engl J Med</i> 2020;382:20-8.</p>
</template>
<template data-pop="i48-rs-embolie" data-title="Pourquoi le retour en rythme sinusal ne supprime pas le risque embolique">
<div class="lab">Physiologie normale</div><p>En rythme sinusal, la systole auriculaire chasse à chaque battement le sang de l’auricule gauche, où il ne se renouvelle pas autrement. Chez des patients en FA intermittente examinés en ETO alors qu’ils étaient en rythme sinusal, la vitesse de vidange de l’auricule atteignait en moyenne 61 cm/s, contre 33 cm/s chez les patients en FA (Goldman et coll., 1999). Le retour en rythme sinusal améliore donc la vidange, mais il ne corrige pas le reste.</p>
<div class="lab">Mécanisme</div><p>La sidération des premières semaines relève de l’anticoagulation de courte durée prescrite après toute cardioversion. Au-delà, plusieurs raisons maintiennent le risque.</p>
<p><b>Le terrain persiste.</b> L’âge, l’hypertension, le diabète, l’insuffisance cardiaque et la maladie vasculaire ne sont modifiés ni par le choc électrique ni par l’ablation. Dans la même cohorte, l’âge, la pression systolique, la cardiopathie ischémique et la surface de l’oreillette gauche prédisaient une vidange inférieure à 20 cm/s. Les facteurs cliniques restaient associés au thrombus indépendamment de cette vitesse (Goldman et coll., 1999).</p>
<p><b>L’oreillette reste malade.</b> La cardiomyopathie auriculaire associe un remodelage inflammatoire et prothrombotique, une activation neurohormonale et une fibrose (ESC 2024, tableau 6). Une oreillette fibrosée se contracte moins bien même lorsque son activation est sinusale, et sa paroi remaniée favorise la coagulation. Cette entité reste toutefois imparfaitement définie.</p>
<p><b>La FA revient, souvent sans symptômes.</b> Des accès silencieux surviennent même chez les patients symptomatiques, et les symptômes ne sont pas liés au risque d’AVC (ESC 2024, section 3.3). La disparition des palpitations ne prouve donc pas l’absence de FA.</p>
<p><b>Le lien temporel est faible, ce qui reste débattu.</b> Chez 2 580 porteurs de stimulateur ou de défibrillateur surveillés en continu, 51 ont présenté un AVC ou une embolie ; 4 seulement avaient une FA enregistrée dans les 30 jours précédents (Brambatti et coll., 2014). Selon une hypothèse non démontrée, la FA serait surtout le marqueur d’une oreillette thrombogène, qui le reste entre les accès.</p>
<div class="lab">Conséquence clinique</div><p>Le risque dépend du patient et non du tracé du jour. Un patient revenu en rythme sinusal se trouve au mieux dans la situation d’une FA paroxystique, et le type temporel ne doit pas servir à décider de l’anticoagulation (ESC 2024, tableau de recommandations 6, classe III, niveau B). Arrêter l’anticoagulant sur un ECG sinusal prive le patient de protection alors que son terrain n’a pas changé.</p>
<div class="lab">Ce qui change la décision</div><p>Après une cardioversion, l’anticoagulation est poursuivie au long cours chez tout patient porteur d’un facteur de risque thromboembolique, que le rythme sinusal soit obtenu ou non (ESC 2024, tableau de recommandations 15, classe I, niveau B). Après une ablation, elle est poursuivie au moins deux mois chez tous, puis selon le score CHA₂DS₂-VA et non selon le succès perçu de l’intervention (section 7.2.6, tableau de recommandations 20, classe I, niveau C). Le risque est réévalué à intervalles réguliers, car le score augmente avec l’âge et les comorbidités (tableau de recommandations 6, classe I, niveau B).</p>
<p><b>Point débattu.</b> Deux essais randomisés publiés en 2025 ont inclus des patients sans récidive documentée au moins un an après l’ablation. Dans le premier, chez 840 patients coréens, l’arrêt de l’anticoagulant a réduit le critère associant AVC, embolie et hémorragie majeure (0,3 % contre 2,2 % à deux ans), surtout par moins d’hémorragies ; les AVC ischémiques ne différaient pas significativement (Kim et coll., 2025). Dans le second, chez 1 284 patients, le rivaroxaban à 15 mg n’a pas réduit significativement les AVC, les embolies et les infarctus cérébraux silencieux par rapport à l’aspirine, et il a provoqué plus d’hémorragies majeures (Verma et coll., 2026). Les événements ont été trop rares pour démontrer que l’arrêt est sûr, et ces essais ne modifient pas la recommandation de 2024. Un arrêt hors recommandation relève d’une décision spécialisée et partagée, jamais d’un ECG normal.</p>
<div class="lab">Source</div><p>ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414) : tableau 6, section 3.3, tableaux de recommandations 6, 15 et 20, sections 7.2.1 et 7.2.6. Goldman et coll., <i>J Am Soc Echocardiogr</i> 1999;12:1080-7. Brambatti et coll., <i>Circulation</i> 2014;129:2094-9. Kim et coll., <i>JAMA</i> 2025;334:1246-54. Verma et coll., <i>N Engl J Med</i> 2026;394:323-32.</p>

<template data-pop="i48-troponine" data-title="Troponine et segment ST en FA rapide : ischémie de demande ou syndrome coronarien">
<div class="lab">Physiologie normale</div><p>Le sous-endocarde du ventricule gauche est comprimé pendant la systole : il est perfusé surtout en diastole. Quand la fréquence augmente, la diastole raccourcit davantage que la systole. À 72/min, la systole occupe environ 40 % du cycle ; à une fréquence triple, elle en occupe environ 65 %. Dans le même temps, la consommation d’oxygène du myocarde augmente avec la fréquence.</p>
<div class="lab">Mécanisme</div><p>En FA rapide, l’apport sous-endocardique baisse alors que la demande augmente, et les cycles les plus courts écourtent encore la diastole. Il en résulte une ischémie sous-endocardique fonctionnelle, sans occlusion coronaire. Elle se traduit par un sous-décalage diffus du segment ST et peut libérer de la troponine. La quatrième définition universelle classe cette situation en lésion myocardique ou, si les critères d’infarctus sont réunis, en infarctus de type 2, par déséquilibre entre apport et demande. L’ESC 2024 note que la FA déclenche fréquemment des infarctus de type 2 (section 9.2). Une coronaropathie ou une hypertrophie ventriculaire abaissent le seuil de cette ischémie.</p>
<div class="lab">Conséquence clinique</div><p>Une ischémie de demande régresse quand la fréquence baisse : le sous-décalage disparaît et la troponine reste modeste. Une valeur élevée mais stable sur des dosages répétés traduit plutôt une lésion myocardique chronique, liée à une cardiopathie sous-jacente. Une hausse ou une baisse significative signe une lésion aiguë, mais ne sépare pas à elle seule l’infarctus de type 2 de l’infarctus de type 1, dû à la rupture ou à l’érosion d’une plaque athéroscléreuse compliquée d’un thrombus. Plusieurs signes orientent vers un type 1 : des anomalies du segment ST limitées à un territoire, un sus-décalage, une douleur qui persiste après ralentissement, une hausse importante de la troponine ou un trouble segmentaire de la contraction.</p>
<div class="lab">Ce qui change la décision</div><p>Le médecin ralentit d’abord la fréquence, puis répète l’ECG et la troponine selon l’algorithme de son laboratoire. Si les signes persistent après ralentissement, si la cinétique est franche ou si un trouble segmentaire apparaît, il recherche une coronaropathie par scanner coronaire, imagerie d’ischémie ou coronarographie (ESC 2024, tableau 8). Un syndrome coronarien aigu suit alors les recommandations ESC 2023. Une coronaropathie avérée exclut la flécaïnide et la propafénone (ESC 2024, tableau de recommandations 18). Après une angioplastie coronaire, l’anticoagulant s’associe temporairement à un antiplaquettaire (ESC 2024, section 9.2).</p>
<div class="lab">Source</div><p>Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chap. 9 et 21 ; Thygesen et al., quatrième définition universelle de l’infarctus, Eur Heart J 2019;40:237-69 ; Byrne et al., ESC 2023 sur les syndromes coronariens aigus, Eur Heart J 2023;44:3720-826 ; ESC 2024 (Van Gelder et al., Eur Heart J 2024;45:3314-414), tableau 8, section 9.2, tableau de recommandations 18.</p></template>
