
<!-- ===== FENÊTRES I48 : thérapeutique et examens ===== -->
<template data-pop="i48-cha" data-title="Score CHA₂DS₂-VA (ESC 2024)">
<div class="lab">Items</div><p><b>C</b> insuffisance cardiaque ou FEVG ≤ 40 % (1) : les pressions de remplissage élevées dilatent l’oreillette gauche, et le bas débit ralentit le flux dans l’auricule. <b>H</b> hypertension (1) : l’hypertrophie ventriculaire gauche élève la pression de remplissage, ce qui dilate et fibrose l’oreillette. <b>A</b>₂ âge ≥ 75 ans (2) : l’âge augmente le risque d’AVC de façon continue et indépendante, avec la fibrose auriculaire et l’athérome ; deux points sont attribués à partir de 75 ans par simplicité. <b>D</b> diabète (1) : il altère l’endothélium et favorise un état procoagulant. <b>S</b>₂ AVC, accident ischémique transitoire ou embolie antérieurs (2) : le patient a déjà produit une embolie, et son risque de récidive est très élevé, d’où deux points. <b>V</b> maladie vasculaire (1) : l’athérome coronaire ou périphérique témoigne d’une atteinte vasculaire diffuse, et une plaque aortique complexe est elle-même une source d’embolie. <b>A</b> âge 65–74 ans (1). Maximum : 8 points.</p>
<div class="lab">Décision</div><p>≥ 2 : anticoagulation recommandée (classe I). 1 : à envisager (classe IIa). 0 : pas d’anticoagulation au long cours.</p>
<div class="lab">Pourquoi le sexe a été retiré</div><p>Dans le score CHA₂DS₂-VASc, le sexe féminin ajoutait un point. Ce point ne modifiait le risque qu’en présence d’autres facteurs, surtout après 65 ans ; seul, il n’avait pas de valeur. Son retrait simplifie la décision : une femme et un homme ayant le même profil reçoivent la même recommandation.</p>
<div class="lab">Exemples</div><p>Homme de 68 ans hypertendu : 2 points, anticoagulation recommandée. Femme de 60 ans sans autre facteur : 0 point (CHA₂DS₂-VASc aurait donné 1). Homme de 80 ans diabétique : 3 points.</p>
<div class="lab">Limites</div><p>Le score est dynamique : le recalculer à chaque consultation. Il ne s’applique pas à la prothèse mécanique ni au rétrécissement mitral modéré à sévère, ni à la cardiomyopathie hypertrophique et à l’amylose, où l’anticoagulation est indiquée d’emblée, quel que soit le score (classe I). Dans la cardiomyopathie hypertrophique, le ventricule rigide élève la pression de remplissage, qui dilate et fibrose l’oreillette gauche ; le risque embolique observé dépasse celui que prédit le score, même chez le sujet jeune. Dans l’amylose, les dépôts infiltrent la paroi auriculaire, qui se contracte mal, parfois même en rythme sinusal ; des thrombi de l’auricule se forment donc même lorsque le score est bas.</p>
<div class="lab">Pourquoi ces items</div><p>Le risque embolique dépend surtout du terrain, qui altère la paroi de l’oreillette gauche même en rythme sinusal : fibrose, dilatation, endocarde moins antithrombotique et auricule qui se vide mal. Chaque item décrit l’une de ces atteintes. L’hypertension rigidifie le ventricule gauche ; sa pression de remplissage se transmet à l’oreillette, qui se dilate et se fibrose. En ETO, les patients hypertendus avaient plus souvent une vidange lente de l’auricule et un thrombus (Zabalgoitia et coll., 1998). Le diabète favorise la fibrose auriculaire, la dysfonction endothéliale et un état procoagulant. L’insuffisance cardiaque élève les pressions de remplissage quelle que soit la FEVG, et le bas débit ralentit le flux. L’âge accroît la fibrose et diminue la vidange de l’auricule ; son effet est continu, et les seuils de 65 et 75 ans ont été choisis pour la pratique (ESC 2024, tableau 10). La maladie vasculaire signale une athérosclérose diffuse, et la plaque aortique complexe est aussi une source d’embole. Un antécédent d’AVC ou d’embolie prouve que le mécanisme s’est déjà produit ; le risque de récidive très élevé justifie deux points. Ces facteurs causent aussi des AVC non cardioemboliques, par athérosclérose des grosses artères ou maladie des petites artères. Une partie du risque persiste donc malgré l’anticoagulation.</p>
<div class="lab">Pourquoi le seuil passe entre 1 et 2 points</div><p>Sans anticoagulant, le risque annuel d’AVC croît avec le score (Friberg et coll., 2012). Un antivitamine K réduit les AVC de 64 % (ESC 2024, section 6.2.2). Cette réduction relative étant à peu près constante, le bénéfice absolu dépend du risque de départ, alors que le risque d’hémorragie majeure ajouté ne diminue pas dans la même proportion. La plupart des scores placent le seuil de prescription entre 0,6 et 1,0 % d’événements thromboemboliques par an (section 6.1.1). À 2 points, le risque dépasse nettement ce seuil, et le bénéfice l’emporte chez la plupart des patients. À 1 point, le risque s’en approche et varie selon l’item : un point dû à l’âge correspond à un risque qui croît chaque année, contrairement à un diabète isolé à 50 ans. La décision est alors partagée et tient compte du risque hémorragique et des préférences du patient. À 0 point, l’hémorragie ajoutée dépasserait le bénéfice. L’ESC 2024 rappelle que le seuil individuel ne peut pas être déduit des études de population : il dépend de l’interaction des facteurs de risque et du risque que le patient accepte (section 6.1.1).</p>
<div class="lab">Source complémentaire</div><p>ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414), sections 6.1.1 et 6.2.2, tableau 10, tableau de recommandations 6. Friberg et al., <i>Eur Heart J</i> 2012;33:1500-10. Zabalgoitia et coll., <i>J Am Coll Cardiol</i> 1998;31:1622-6.</p>
</template>

<template data-pop="i48-hasbled" data-title="Risque hémorragique : facteurs modifiables et score HAS-BLED">
<div class="lab">Facteurs modifiables (à corriger chez tous)</div><p><b>Hypertension non contrôlée</b> : elle lèse les petites artères perforantes du cerveau, dont la rupture produit sous anticoagulant un hématome plus volumineux. <b>Antiplaquettaire ou AINS associé</b> : l’antiplaquettaire empêche la formation du clou plaquettaire alors que l’anticoagulant freine la formation de thrombine, si bien que les deux temps de l’hémostase sont atteints ; l’AINS lèse en outre la muqueuse gastrique et peut réduire la fonction rénale, donc accumuler l’AOD. <b>Consommation excessive d’alcool</b> : elle expose aux chutes, aux lésions gastriques, à l’atteinte hépatique et à la thrombopénie, et elle déstabilise l’INR ; l’ESC 2024 conseille de la limiter à 3 verres standard par semaine au plus. <b>INR instable sous antivitamine K</b> : les périodes au-dessus de la cible individuelle augmentent le risque de saignement. <b>Dose d’AOD inadaptée</b> : une dose trop forte pour la clairance, l’âge ou le poids accumule le médicament. <b>Anémie</b> : elle révèle souvent une lésion qui saigne déjà, digestive surtout, que l’anticoagulant aggravera, d’où la recherche d’une carence en fer et de sa source ; elle réduit aussi la tolérance d’une nouvelle perte de sang. <b>Observance irrégulière</b> : une prise doublée après un oubli crée un pic de concentration, et les oublis exposent à l’AVC.</p>
<div class="lab">Facteurs non modifiables</div><p>Âge, antécédent d’hémorragie majeure, insuffisance rénale ou hépatique sévère, thrombopénie, cancer, antécédent d’AVC.</p>
<div class="lab">Score HAS-BLED (classique)</div><p><b>H</b> hypertension non contrôlée (pression systolique &gt; 160 mmHg) ; <b>A</b> fonction rénale ou hépatique anormale (1 point chacune) ; <b>S</b> AVC ; <b>B</b> saignement antérieur ou prédisposition ; <b>L</b> INR labile ; <b>E</b> âge &gt; 65 ans ; <b>D</b> médicaments (antiplaquettaire, AINS) ou alcool (1 point chacun). Score ≥ 3 : risque élevé, suivi rapproché.</p>
<div class="lab">Position ESC 2024</div><p>Aucun score n’est spécifiquement recommandé ; l’accent porte sur la correction des facteurs modifiables (classe I). Les scores ne doivent pas servir à refuser l’anticoagulation (classe III), pour deux raisons. Leur pouvoir prédictif est modeste. Surtout, plusieurs de leurs items (âge, hypertension, antécédent d’AVC) augmentent aussi le risque d’AVC : le patient le plus exposé au saignement est souvent celui que l’anticoagulation protège le plus, et son risque d’AVC sans traitement dépasse le plus souvent son risque d’hémorragie majeure.</p>
<div class="lab">Mécanisme commun</div><p>L’anticoagulant ne crée pas de lésion : il empêche la fibrine de consolider le clou plaquettaire qui colmate une brèche. Le risque dépend donc d’une lésion qui saigne, d’un second défaut de l’hémostase et d’une exposition excessive au médicament, recherchés à l’instauration puis à chaque suivi (ESC 2024, figure 10, classe I).</p>
<div class="lab">Lésion et anémie</div><p>Un antécédent hémorragique signale souvent une lésion persistante, ulcère, angiodysplasie ou tumeur, qui resaigne sous anticoagulant. Le médecin en cherche la source et la traite ; un AOD peut ensuite souvent être repris sans danger (ESC 2024, section 6.7.1). Une anémie, que la pâleur suggère sans la prouver, traduit souvent un saignement occulte, surtout digestif, et réduit la tolérance d’une nouvelle hémorragie. Le bilan comprend une numération et une ferritine. Le toucher rectal cherche un méléna, sang digéré d’origine haute, du sang rouge d’origine basse ou une masse. Un résultat positif conduit à une endoscopie, sans renoncer définitivement à l’anticoagulation, car le risque d’AVC sans traitement dépasse souvent le risque hémorragique (section 6.7.1). Un toucher rectal normal n’exclut pas un saignement occulte.</p>
<div class="lab">Second défaut de l’hémostase</div><p>Des ecchymoses spontanées ou disproportionnées traduisent un défaut du colmatage des petits vaisseaux : thrombopénie, plaquettes inefficaces sous antiplaquettaire, AINS ou urémie, ou trouble hépatique de la coagulation. Elles imposent une numération plaquettaire et un bilan de coagulation, rénal et hépatique. La cirrhose abaisse la synthèse des facteurs de coagulation, l’hypersplénisme séquestre les plaquettes, et l’hypertension portale crée des varices qui saignent gravement sous anticoagulant. Les stigmates d’hépatopathie alcoolique conduisent donc au score de Child-Pugh et, si une hypertension portale est suspectée, à une gastroscopie ; les AOD sont contre-indiqués en classe C, le rivaroxaban dès la classe B (Steffel et coll., 2021). L’antiplaquettaire ajoute un défaut de l’hémostase primaire : il n’est pas ajouté pour prévenir l’embolie, ni poursuivi au-delà de 12 mois en cas de maladie coronaire stable (classe III). Les AINS suppriment en outre les prostaglandines qui protègent la muqueuse gastrique ; une autre analgésie est proposée.</p>
<div class="lab">Exposition excessive</div><p>Le rein élimine environ 80 % du dabigatran : quand la clairance baisse, la concentration s’élève à dose égale. La dose se fixe donc sur la clairance de Cockcroft-Gault et les critères du tableau 11 ; une dose réduite sans critère expose à l’AVC (classe III). Sous antivitamine K pour prévenir l’AVC lié à la FA, la cible habituelle de l’INR est de 2,0 à 3,0 (classe I), avec un temps dans cette zone supérieur à 70 % (classe IIa). Une prothèse mécanique exige une cible individualisée selon la valve et le terrain. Si le temps dans la zone reste inférieur à 70 %, le passage à un AOD est recommandé seulement chez le patient éligible (classe I) ; une prothèse mécanique ou un rétrécissement mitral modéré à sévère l’excluent. L’excès d’alcool fait saigner par une mauvaise observance, des interactions, une atteinte hépatique et des varices ; il est limité à 3 verres standard par semaine (section 5.7, classe I).</p>
<div class="lab">Hypertension non contrôlée</div><p>L’hypertension chronique fragilise par lipohyalinose les petites artères perforantes du cerveau, dont la rupture produit une hémorragie intracérébrale profonde. Sous anticoagulant, l’hématome s’étend davantage. Le seuil de 160 mmHg du score HAS-BLED repère un risque ; la cible du traitement est une systolique de 120 à 129 mmHg chez la plupart des adultes (section 5.1).</p>
<div class="lab">Facteurs non modifiables</div><p>Ils imposent des revues plus fréquentes et une équipe pluridisciplinaire, non l’abandon du traitement. Les contre-indications absolues, rares, sont la tumeur intracrânienne primitive et l’hémorragie liée à une angiopathie amyloïde ; une fermeture de l’auricule peut alors être envisagée (classe IIb).</p>
<div class="lab">Source complémentaire</div><p>ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414), sections 5.1, 5.7 et 6.7.1, figure 10, tableau 11, tableau de recommandations 12. Steffel et coll., guide pratique EHRA 2021, <i>Europace</i> 2021;23:1612-76. Qureshi et coll., <i>Lancet</i> 2009;373:1632-44.</p>
</template>

<template data-pop="i48-mitral" data-title="FA « valvulaire » : définition actuelle">
<p>Le terme « FA non valvulaire » est source de confusion : un patient avec une insuffisance mitrale, un rétrécissement aortique ou une bioprothèse relève des AOD.</p>
<div class="lab">Antivitamine K obligatoire</div><p><b>Prothèse valvulaire mécanique</b> et <b>rétrécissement mitral modéré à sévère</b>, le plus souvent rhumatismal. Les AOD y sont contre-indiqués. Sur une prothèse mécanique, la surface artificielle active en continu la voie de contact de la coagulation ; l’antivitamine K abaisse plusieurs facteurs de la cascade, alors que le dabigatran freine moins bien cette génération de thrombine. L’essai RE-ALIGN, arrêté précocement, a montré plus de thromboses et d’hémorragies sous dabigatran que sous antivitamine K. Dans la cardiopathie rhumatismale, l’essai INVICTUS a montré plus d’événements cardiovasculaires et de décès sous rivaroxaban que sous antivitamine K, sans moins d’hémorragies majeures ; le mécanisme de cet excès n’est pas établi.</p>
<div class="lab">AOD possibles</div><p>Autres valvulopathies natives, bioprothèses après les trois premiers mois, réparation valvulaire, TAVI.</p>
<div class="lab">Pourquoi</div><p><b>Rétrécissement mitral.</b> Normalement, la valve mitrale s’ouvre sur 4 à 6 cm², et l’oreillette gauche se vide en diastole sans gradient notable. Quand l’orifice se rétrécit, le sang ne passe qu’au prix d’un gradient qui élève en permanence la pression auriculaire. L’oreillette se dilate et le sang y stagne, même en rythme sinusal ; la FA rend cette stase maximale. Dans la cohorte de Framingham, la FA multipliait l’incidence des AVC par 17 en cas de cardiopathie rhumatismale, contre un peu plus de 5 sans elle (Wolf et coll., 1978). Ce risque tient à la valve et non au terrain : les patients d’INVICTUS avaient en moyenne 50 ans. L’anticoagulation est donc indiquée sans calcul du score CHA₂DS₂-VA.</p>
<p><b>Prothèse mécanique.</b> La surface artificielle active la voie de contact, facteur XII puis facteur XI, et la production de thrombine qui en résulte est continue ; in vitro, elle disparaissait dans un plasma privé de facteur XII ou XI (Jaffer et coll., 2015). Le facteur tissulaire exposé par les tissus lésés s’y ajoute après l’implantation. Un antivitamine K abaisse en amont quatre facteurs, II, VII, IX et X. Un AOD inhibe une seule enzyme à dose fixe, avec un creux de concentration avant chaque prise : dans la même étude, le dabigatran réduisait peu la thrombine induite par la valve, contrairement au plasma de patients sous antivitamine K. Cette explication reste une hypothèse chez l’homme. Dans le rétrécissement mitral, aucun mécanisme connu n’explique l’infériorité du rivaroxaban.</p>
<div class="lab">Preuves</div><p>L’essai RE-ALIGN comparait le dabigatran à la warfarine chez des porteurs de prothèse mécanique. Il a été arrêté après 252 inclusions, avec 5 % d’AVC sous dabigatran contre aucun sous warfarine et davantage d’hémorragies majeures (Eikelboom et coll., 2013). Un essai de l’apixaban après prothèse aortique mécanique a aussi été arrêté pour excès d’événements thromboemboliques (ESC 2024, section 6.2.1). Les essais des AOD avaient exclu les rétrécissements mitraux modérés à sévères. INVICTUS a randomisé 4 531 patients en FA avec cardiopathie rhumatismale, dont 82 % avaient une surface mitrale ≤ 2 cm². L’antivitamine K a réduit les événements cardiovasculaires et les décès par rapport au rivaroxaban, sans plus d’hémorragies (Connolly et coll., 2022). L’excès de décès sous rivaroxaban n’était pas seulement embolique, et son mécanisme n’est pas élucidé.</p>
<div class="lab">Seuil de surface</div><p>L’ESC 2024 sur la FA exclut les AOD en cas de rétrécissement mitral modéré à sévère, sans définir ici une surface. Le seuil de 1,5 cm² caractérise un rétrécissement mitral cliniquement sévère ; il ne fixe pas à lui seul l’éligibilité aux AOD. L’ESC/EACTS 2025 sur les valvulopathies ne recommande pas les AOD chez les patients en FA avec rétrécissement mitral rhumatismal et surface ≤ 2,0 cm² (section 6.2, tableau de recommandations 2, classe III, niveau B). Ces patients relèvent d’un antivitamine K, y compris entre 1,5 et 2,0 cm². L’étiologie et la sévérité sont confirmées avec le cardiologue.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414), section 6.2.1, tableau de recommandations 7. Praz et coll., recommandations ESC/EACTS 2025 sur les valvulopathies, doi:10.1093/eurheartj/ehaf194, sections 6.2 et 10.2.2, tableau de recommandations 2. Vahanian et coll., <i>Eur Heart J</i> 2022;43:561-632. Wolf et coll., <i>Neurology</i> 1978;28:973-7. Jaffer et coll., <i>J Am Heart Assoc</i> 2015;4:e002322. Eikelboom et coll., <i>N Engl J Med</i> 2013;369:1206-14. Connolly et coll., <i>N Engl J Med</i> 2022;387:978-88.</p>
</template>

<template data-pop="i48-cg" data-title="Clairance de la créatinine selon Cockcroft-Gault">
<div class="lab">Formule (créatinine en µmol/L)</div><p>Clairance (mL/min) = (140 − âge) × poids (kg) × k / créatinine, avec k ≈ 1,23 chez l’homme et ≈ 1,04 chez la femme. Forme équivalente : (140 − âge) × poids / (0,815 × créatinine), multipliée par 0,85 chez la femme.</p>
<div class="lab">Exemple</div><p>Femme de 84 ans, 52 kg, créatinine 105 µmol/L : (140 − 84) × 52 × 1,04 / 105 ≈ 29 mL/min. Son DFG estimé par CKD-EPI est d’environ 45 mL/min/1,73 m². La dose d’AOD se décide sur 29 mL/min.</p>
<div class="lab">Pourquoi cette formule</div><p>Elle a servi à définir les critères d’inclusion et de dose dans les essais des AOD et dans leur information professionnelle. Elle intègre le poids réel, déterminant chez le sujet âgé de faible poids.</p>
<div class="lab">Limites</div><p>Elle surestime la fonction rénale chez l’obèse : elle multiplie par le poids total en supposant que la masse musculaire, source de la créatinine, lui est proportionnelle, alors que le tissu adipeux en produit peu. Près d’un seuil de dose, on utilise alors un poids ajusté ou une clairance mesurée. Elle la surestime aussi quand la créatinine monte (insuffisance rénale aiguë), car la créatinine met plusieurs jours à atteindre son nouvel équilibre. Elle est imprécise chez le sujet très dénutri, dont la faible masse musculaire abaisse la créatinine.</p>
<div class="lab">Mécanisme de l’écart avec le DFG estimé</div><p>La créatinine provient de la créatine musculaire, à un débit proportionnel à la masse musculaire. À l’état stable, la créatininémie égale ce débit de production divisé par la clairance. Une femme âgée et maigre produit peu de créatinine : sa créatininémie reste proche de la norme alors que sa filtration a nettement baissé. La formule CKD-EPI tient compte de l’âge et du sexe, mais ignore le poids et rapporte le résultat à une surface corporelle standard de 1,73 m². Cockcroft-Gault multiplie par le poids réel et donne une clairance absolue, en mL/min : c’est le débit qui élimine réellement le médicament.</p>
<div class="lab">Lecture de l’exemple</div><p>Si la patiente mesure 1,58 m, sa surface corporelle vaut environ 1,5 m². Son DFG absolu n’est alors que de 45 × 1,5 / 1,73 ≈ 39 mL/min. Le terme (140 − âge) de Cockcroft-Gault abaisse encore l’estimation au grand âge, jusqu’à 29 mL/min. Aucune des deux valeurs n’est une filtration mesurée, mais les seuils de dose des AOD ont été établis avec Cockcroft-Gault.</p>
<div class="lab">Ce qui change la décision</div><p>Avec 45 mL/min/1,73 m², le dabigatran 110 mg × 2/jour paraîtrait permis. Avec 29 mL/min, il est contre-indiqué : éliminé à environ 80 % par le rein, il s’accumulerait et exposerait à l’hémorragie. Le médecin calcule donc la clairance avec le poids du jour et la recalcule quand le poids ou la créatinine change.</p>
<div class="lab">Source complémentaire</div><p>Cockcroft et Gault, Nephron 1976;16:31-41. Inker et al. (CKD-EPI 2021), N Engl J Med 2021;385:1737-1749. Steffel et al., guide EHRA, Europace 2021;23:1612-1676. ESC 2024, section 6.2.1 et tableau 11. Guyton & Hall, Textbook of Medical Physiology, 14e éd. (physiologie rénale).</p>
</template>

<template data-pop="i48-mnemo-abc" data-title="« ABC » de la dose réduite de l’apixaban">
<p><b>A</b> — Âge ≥ 80 ans.<br><b>B</b> — <i>Body weight</i> : poids ≤ 60 kg.<br><b>C</b> — Créatinine ≥ 133 µmol/L.</p>
<div class="lab">Règle</div><p>Deux critères sur trois : 2,5 mg × 2/jour. Un seul critère : dose pleine, 5 mg × 2/jour. Chaque critère augmente modérément l’exposition à l’apixaban : l’âge réduit sa clairance, le faible poids son volume de distribution, et une créatinine élevée traduit une élimination rénale diminuée (environ 27 % de la dose). Deux critères réunis élèvent nettement la concentration ; c’est la règle testée dans l’essai pivot ARISTOTLE. Un seul critère ne justifie pas de réduction, et une réduction injustifiée augmente le risque d’AVC sans diminuer celui d’hémorragie. Indépendamment de ces critères, une clairance de 15 à 29 mL/min justifie aussi 2,5 mg × 2/jour.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Les critères officiels sont ceux de l’information professionnelle et de l’EHRA.</p>
<div class="lab">Pourquoi deux critères sur trois</div><p>L’apixaban est éliminé pour environ 27 % par le rein ; le reste dépend surtout du métabolisme hépatique par le CYP3A4 et de l’excrétion biliaire et intestinale. Chaque critère augmente modestement sa concentration : le grand âge et la créatinine élevée réduisent l’élimination rénale, le faible poids réduit le volume de distribution. Le protocole d’ARISTOTLE a réservé la demi-dose aux patients qui cumulaient deux critères ; c’est cette règle, et elle seule, que le bénéfice de l’essai contre la warfarine valide.</p>
<div class="lab">Ce qui change la décision</div><p>Réduire la dose pour un seul critère sous-dose le patient : le risque d’AVC augmente sans baisse des hémorragies. L’ESC 2024 déconseille toute réduction hors des critères propres à chaque AOD (classe III, niveau B). Une femme de 82 ans, 70 kg, créatinine 90 µmol/L, n’a qu’un critère ; sa clairance de Cockcroft-Gault vaut environ 47 mL/min ; elle reçoit 5 mg × 2/jour.</p>
<div class="lab">Source complémentaire</div><p>Granger et al. (ARISTOTLE), N Engl J Med 2011;365:981-992. Steffel et al., guide EHRA, Europace 2021;23:1612-1676. ESC 2024, section 6.2.1, tableau de recommandations 7 et tableau 11.</p>
</template>

<template data-pop="i48-laao" data-title="Fermeture de l’auricule gauche">
<div class="lab">Principe</div><p>Exclure l’auricule gauche de la circulation, soit par un dispositif implanté par voie veineuse et transseptale, soit chirurgicalement (suture, agrafage, clip) lors d’une chirurgie cardiaque.</p>
<div class="lab">Indications (ESC 2024)</div><p><b>Chirurgicale</b>, en complément de l’anticoagulation, chez un patient en FA opéré du cœur : classe I (essai LAAOS III, réduction d’environ un tiers des AVC et embolies). <b>Percutanée</b>, si l’anticoagulation au long cours est contre-indiquée : classe IIb.</p>
<div class="lab">Données récentes</div><p>CHAMPION-AF (2026, 3 000 patients éligibles aux AOD) : à trois ans, le critère composite décès cardiovasculaire, AVC ou embolie systémique atteint 5,7 % dans le groupe dispositif contre 4,8 % sous anticoagulant ; la non-infériorité est établie. Les saignements non procéduraux atteignent 10,9 % contre 19,0 %. Ces estimations ne démontrent pas une supériorité sur les AVC isolés ; appliquer les indications du référentiel pertinent. Le dispositif exclut l’auricule, tandis que l’AOD freine la coagulation dans l’ensemble de la circulation. Dans une revue de séries de FA non rhumatismale, environ un thrombus auriculaire gauche sur dix se situait hors de l’auricule ; ce résultat anatomique n’est pas une incidence d’AVC. Ni la fermeture ni l’AOD ne préviennent tous les AVC d’autres mécanismes. Le thrombus sur dispositif et la fuite péridispositif peuvent aussi contribuer au risque résiduel ; leur part dans CHAMPION-AF n’est pas établie.</p>
<div class="lab">Après implantation</div><p>Traitement antithrombotique transitoire (anticoagulant ou antiplaquettaires) selon le dispositif et le risque : la surface du dispositif reste thrombogène jusqu’à son recouvrement par l’endothélium, en quelques semaines à quelques mois ; le traitement est ensuite allégé, car son risque hémorragique est celui que la fermeture cherchait à éviter. Puis contrôle par imagerie : un thrombus sur le dispositif, observé chez 1,7 à 7,2 % des patients, augmente le risque d’AVC ischémique et conduit à reprendre une anticoagulation ; une fuite péridispositif laisse l’auricule partiellement ouverte.</p>
<div class="lab">Complications</div><p>Épanchement péricardique et tamponnade, embolisation du dispositif, thrombus sur le dispositif.</p>
<div class="lab">Ce que la fermeture ne supprime pas</div><p>Dans la FA sans valvulopathie rhumatismale, 91 % des thrombi de l’oreillette gauche siègent dans l’auricule ou en naissent. Un anticoagulant agit sur la coagulation partout ; la fermeture n’exclut que l’auricule. Restent donc possibles les thrombi du corps de l’oreillette, les petites fuites autour du dispositif (0 à 5 mm, chez environ 25 % des patients), les thrombi formés sur le dispositif (1,7 à 7,2 %, associés à davantage d’AVC ischémiques) et, comme sous anticoagulant, les AVC sans lien avec la FA, par athérome ou maladie des petites artères (ESC 2024, sections 6.4 et 6.5).</p>
<div class="lab">Conséquences dans les essais</div><p>Ces mécanismes décrivent des risques résiduels ; leur contribution aux événements de CHAMPION-AF n’est pas établie. Un essai de non-infériorité sur un critère composite ne démontre pas une supériorité sur les AVC isolés. Dans LAAOS III, 77 % des patients ont gardé leur anticoagulant, et la fermeture chirurgicale ajoutée a réduit les AVC ischémiques et embolies de 7,0 % à 4,8 % (rapport de risques 0,67). L’essai prouve donc un complément à l’anticoagulation, non un remplacement (ESC 2024, section 6.6).</p>
<div class="lab">Pourquoi la classe IIb</div><p>Après une fermeture percutanée, le traitement antithrombotique nécessaire expose à un risque hémorragique qui peut approcher celui d’un AOD. Les essais randomisés initiaux l’ont comparée à la warfarine, qui n’est plus le traitement de référence. L’ESC 2024 la réserve donc aux patients dont l’anticoagulation au long cours est contre-indiquée (classe IIb, niveau C ; tableau de recommandations 10).</p>
<div class="lab">Source complémentaire</div><p>Blackshear et Odell, Ann Thorac Surg 1996;61:755-9 ; ESC 2024, sections 6.4 à 6.6, tableaux de recommandations 10 et 11 ; Doshi et coll., CHAMPION-AF, N Engl Med 2026;394:2083-94, doi:10.1056/nejmoa2517213.</p>
</template>

<template data-pop="i48-elan" data-title="Essai ELAN : moment de l’anticoagulation après un AVC">
<div class="lab">Question</div><p>Quand débuter un AOD après un AVC ischémique lié à une FA ? La crainte d’une transformation hémorragique conduisait à attendre longtemps.</p>
<div class="lab">Plan</div><p>Essai international dirigé depuis Berne (Fischer et coll., <i>New England Journal of Medicine</i>, 2023) : début précoce ou tardif selon la taille de l’infarctus à l’imagerie.</p>
<div class="lab">Schéma précoce</div><p>Infarctus mineur ou modéré : dans les 48 heures ; infarctus étendu : au 6e ou 7e jour. Le délai dépend de la taille parce que, plus l’infarctus est étendu, plus la barrière hématoencéphalique et les petits vaisseaux du tissu nécrosé sont lésés, et plus une anticoagulation précoce expose à une transformation hémorragique. À l’inverse, le risque de récidive embolique est maximal dans les premiers jours : devant un petit infarctus, il l’emporte et justifie de ne pas attendre.</p>
<div class="lab">Résultat</div><p>Le début précoce n’a pas augmenté les hémorragies symptomatiques ; les récidives ischémiques tendaient à être moins fréquentes.</p></template>

<template data-pop="i48-navab" data-title="Ablation du nœud auriculoventriculaire et stimulation">
<div class="lab">Principe</div><p>Interrompre définitivement la conduction auriculoventriculaire par radiofréquence, après avoir implanté un stimulateur. La fréquence ventriculaire devient régulière et entièrement contrôlée.</p>
<div class="lab">Mode de stimulation</div><p>Stimulation biventriculaire (resynchronisation) ou stimulation du système de conduction (faisceau de His, branche gauche), pour éviter l’asynchronisme d’une stimulation ventriculaire droite isolée : depuis le ventricule droit, l’influx se propage lentement de cellule à cellule au lieu d’emprunter le réseau de Purkinje, si bien que la paroi latérale du ventricule gauche se contracte en retard, comme dans un bloc de branche gauche. Chez un patient stimulé en permanence, cet asynchronisme peut abaisser la FEVG et favoriser l’insuffisance cardiaque.</p>
<div class="lab">Indications (ESC 2024)</div><p>FA permanente très symptomatique malgré le traitement médical, surtout avec hospitalisation pour insuffisance cardiaque : à envisager (classe IIa).</p>
<div class="lab">Conséquences</div><p>Le patient devient dépendant du stimulateur. L’anticoagulation reste indiquée selon le score : l’oreillette fibrille toujours.</p></template>

<template data-pop="i48-24h" data-title="Règle des 48 heures et règle des 24 heures">
<div class="lab">Histoire</div><p>Les recommandations antérieures, dont l’ESC 2020, admettaient une cardioversion sans anticoagulation préalable ni ETO si la FA durait depuis moins de 48 heures. Ce seuil reposait sur des séries anciennes suggérant qu’un thrombus se formait rarement avant deux jours.</p>
<div class="lab">Données nouvelles</div><p>Des registres de cardioversion ont montré une augmentation des complications thromboemboliques dès 12 à 24 heures, surtout chez les patients à score élevé et non anticoagulés.</p>
<div class="lab">ESC 2024</div><p>Une cardioversion précoce n’est pas recommandée sans anticoagulation appropriée ou sans ETO si la FA dure depuis plus de 24 heures (classe III, niveau C). Le seuil passe donc à 24 heures. Même en dessous, l’anticoagulation est débutée le plus tôt possible.</p>
<div class="lab">Application</div><p>Durée certaine ≤ 24 heures : anticoaguler puis cardiovertir, ou attendre une conversion spontanée. Durée &gt; 24 heures ou inconnue : trois semaines d’anticoagulation ou ETO. Après cardioversion : au moins quatre semaines habituellement ; exception possible selon le texte ESC 2024 seulement sans facteur de risque thromboembolique et si le rythme sinusal est rétabli dans les 24 heures du début certain.</p>
<div class="lab">Pour l’examen</div><p>Connaître les deux seuils : les questions anciennes utilisent 48 heures ; l’ESC 2024 retient 24 heures.</p>
<div class="lab">Mécanismes</div><p><b>Formation du thrombus.</b> Dès le début d’un accès, l’oreillette ne se contracte plus, et le sang stagne dans l’auricule, cul-de-sac trabéculé. Un thrombus peut s’y former en quelques heures à quelques jours, d’autant plus vite que le terrain est défavorable ; le délai chez un patient donné reste inconnu. Dans une série finlandaise de cardioversions sans anticoagulation, les complications étaient plus fréquentes au-delà de 12 heures (Nuotio et coll., 2014). Une durée inconnue ne permet donc pas d’exclure un thrombus, et l’ESC 2024 la traite comme une durée supérieure à 24 heures (section 7.2.1).</p>
<p><b>Trois semaines avant.</b> L’anticoagulant ne dissout pas le thrombus. Il empêche son extension et la formation d’un nouveau thrombus, pendant que la fibrinolyse endogène réduit un thrombus récent et que le reste s’organise contre la paroi. Ce délai est empirique : il vient de séries anciennes et n’a jamais été comparé à une autre durée dans un essai. L’ETO est l’alternative, car elle vérifie directement l’absence de thrombus ; dans un essai de 1 222 patients, elle n’entraînait pas plus d’embolies que trois semaines d’anticoagulation (Klein et coll., 2001). Si un thrombus est vu, l’anticoagulation est poursuivie au moins quatre semaines, puis une nouvelle ETO est réalisée (tableau de recommandations 15, classe IIa, niveau C).</p>
<p><b>Sidération et quatre semaines après.</b> Après le retour en rythme sinusal, la contraction de l’oreillette et de l’auricule peut rester déprimée. Dans une cohorte de 60 patients, la fonction auriculaire mesurée par Doppler transmitral récupérait en 24 heures après une FA de deux semaines au plus, mais en un mois environ après une FA de plus de six semaines (Manning et coll., 1994). Ces observations ne garantissent pas la récupération de l’auricule chez un patient donné. La stase peut persister, et un thrombus formé pendant la FA ou la sidération peut être expulsé quand la contraction revient. Dans une analyse de séries publiées, 98 % des événements emboliques recensés survenaient dans les dix jours suivant la cardioversion (Berger et Schweitzer, 1998). La stratégie habituelle poursuit donc l’anticoagulation au moins quatre semaines, même si l’ETO était normale. Le tableau de recommandations 15 présente cette règle générale (classe I, niveau B). Le texte de la section 7.2.1 et la figure 12 permettent toutefois une exception chez le patient sans facteur de risque thromboembolique, si le rythme sinusal est rétabli dans les 24 heures du début certain de la FA. Cette option reste une décision individualisée.</p>
<p><b>Conversion non préparée.</b> L’amiodarone intraveineuse donnée pour ralentir allonge aussi la période réfractaire auriculaire et peut convertir la FA, avec un effet retardé, dans les 24 heures (section 7.2.3). Cette conversion survient sans les précautions précédentes et comporte le même risque embolique. Le début de l’accès est donc daté avant tout médicament capable de convertir, à partir de l’heure des symptômes, du dernier ECG en rythme sinusal et des enregistrements d’un dispositif.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414), sections 7.2.1 et 7.2.3, figure 12, tableau de recommandations 15. Nuotio et coll., <i>JAMA</i> 2014;312:647-9. Klein et coll., <i>N Engl J Med</i> 2001;344:1411-20. Manning et coll., <i>J Am Coll Cardiol</i> 1994;23:1535-40. Berger et al., <i>Am J Cardiol</i> 1998;82:1545-7.</p>
</template>

<template data-pop="i48-eto" data-title="Échocardiographie transœsophagienne (ETO)">
<div class="lab">Question clinique</div><p>Y a-t-il un thrombus dans l’oreillette ou l’auricule gauche ?</p>
<div class="lab">Principe</div><p>Sonde d’échographie introduite dans l’œsophage, au contact de l’oreillette gauche : résolution très supérieure à la voie transthoracique pour les structures postérieures.</p>
<div class="lab">Résultats</div><p>Thrombus : masse échogène, distincte des trabéculations, visible sur plusieurs incidences. Contraste spontané dense (« fumée ») et vitesse de vidange de l’auricule basse (&lt; 20 cm/s environ) : risque élevé. Normal : auricule vide, vitesses de vidange élevées.</p>
<div class="lab">Indications</div><p>Cardioversion précoce d’une FA de plus de 24 heures ; bilan avant ablation ou fermeture de l’auricule ; endocardite ; valvulopathie mitrale.</p>
<div class="lab">Limites et risques</div><p>Sédation, contre-indications œsophagiennes (varices, sténose) ; faux positifs par les muscles pectinés. Une ETO normale exclut un thrombus visible au moment de l’examen, mais ne prévient pas sa formation ultérieure. Après la cardioversion, la contraction de l’oreillette et de l’auricule peut rester sidérée pendant des jours à quelques semaines. L’anticoagulation est donc habituellement poursuivie au moins quatre semaines après le choc. L’exception ESC 2024 reste possible seulement sans facteur de risque thromboembolique et si le rythme sinusal est rétabli dans les 24 heures du début certain de la FA ; une ETO normale ne constitue pas, à elle seule, cette exception (section 7.2.1, figure 12).</p></template>

<template data-pop="i48-cv" data-title="Cardioversion électrique">
<div class="lab">Technique</div><p>Patient à jeun, sous sédation courte avec monitorage ; choc biphasique <b>synchronisé</b> sur l’onde R, pour éviter de délivrer l’énergie pendant la période vulnérable de l’onde T. Des essais récents suggèrent qu’une énergie élevée d’emblée réussit plus souvent qu’une escalade progressive ; les réglages dépendent de l’appareil. Position antéropostérieure ou antérolatérale des palettes.</p>
<div class="lab">Préalables</div><p>Anticoagulation selon la règle des 24 heures ; kaliémie normale, car l’hypokaliémie rend la repolarisation ventriculaire hétérogène et facilite une arythmie ventriculaire après le choc ; absence d’intoxication digitalique, car la digoxine en excès inhibe la pompe sodium-potassium, surcharge la cellule en calcium et crée des post-dépolarisations tardives, que le choc peut transformer en tachycardie ou en fibrillation ventriculaire (une digoxinémie thérapeutique sans signe toxique ne contre-indique pas le choc) ; ECG après le choc.</p>
<div class="lab">Complications</div><p>Brûlures cutanées, bradycardie ou pause post-conversion (dysfonction sinusale démasquée), embolie en l’absence d’anticoagulation, fibrillation ventriculaire si le choc n’est pas synchronisé.</p>
<div class="lab">Porteur de stimulateur</div><p>Palettes à distance du boîtier, de préférence en position antéropostérieure : le courant concentré sur le boîtier peut réinitialiser ou déprogrammer le générateur, et le courant conduit par la sonde peut léser l’interface entre l’électrode et le myocarde, ce qui élève le seuil de stimulation. Contrôle du dispositif après le choc, pour vérifier la programmation et les seuils, car une perte de capture serait grave chez un patient dépendant du stimulateur.</p>
<div class="lab">Échec ou récidive</div><p>Un prétraitement par amiodarone, flécaïnide ou propafénone augmente le succès et réduit les récidives précoces. Juste après un choc efficace, l’oreillette garde la période réfractaire courte due au remodelage électrique ; des extrasystoles, venues surtout des veines pulmonaires, peuvent alors réinitier la FA en quelques minutes à quelques jours. L’amiodarone allonge la période réfractaire, et les antiarythmiques de classe Ic réduisent ces extrasystoles ; la FA se réinstalle donc moins facilement. Le prétraitement dure 3 à 4 jours ; pour l’amiodarone, les données portent sur 1 à 6 semaines.</p>
<div class="lab">Pourquoi le choc réussit plus souvent</div><p>La FA ne persiste que si une masse suffisante de myocarde auriculaire reste excitable pour entretenir des ondelettes de réentrée. Le choc dépolarise en même temps presque tout ce myocarde. Chaque ondelette rencontre alors un tissu réfractaire et s’éteint ; le nœud sinusal, dont la dépolarisation spontanée est la plus rapide, reprend la commande. Le résultat se juge en quelques secondes.</p>
<div class="lab">Pourquoi le médicament réussit moins souvent</div><p>Un antiarythmique doit modifier les propriétés du tissu jusqu’à ce que les circuits ne puissent plus tourner. La classe III allonge la période réfractaire, donc la longueur d’onde. La classe Ic ralentit la conduction, ce qui raccourcit au contraire la longueur d’onde ; son efficacité passe par un autre mécanisme, encore discuté et établi surtout dans des modèles expérimentaux, qui élargit le centre des rotors et réduit les ondelettes secondaires. Dans une oreillette dilatée et fibrosée, avec une FA ancienne, ces effets ne suffisent souvent pas. Le délai et le succès varient : vernakalant, environ 50 % en 10 minutes ; flécaïnide intraveineuse, 52 à 95 % en 6 heures au plus ; amiodarone, 44 % après 8 à 12 heures ou davantage (ESC 2024, tableau 13). Ces taux surestiment l’effet propre du médicament, car une FA récente revient spontanément en rythme sinusal dans 55 à 66 % des cas en 24 heures et dans 69 % en 48 heures (section 7.2.3). Dans un essai randomisé aux urgences, 52 % des patients ont converti après la seule perfusion de procaïnamide, et 92 % avec la stratégie par choc seul.</p>
<div class="lab">Décision</div><p>Le choc s’impose quand la conversion doit être rapide et sûre. La voie médicamenteuse, qui ne demande ni jeûne ni sédation (ESC 2024, section 7.2.3), convient au patient sans cardiopathie significative dont la FA est récente.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024, sections 7.2.2 et 7.2.3, tableau 13 ; Kneller et al., Circ Res 2005;96:e35-47 ; Stiell et al., Lancet 2020;395:339-49 ; Zipes et Jalife, Cardiac Electrophysiology: From Cell to Bedside, 7e éd., 2018.</p>
</template>

<template data-pop="i48-pip" data-title="Stratégie de la « pilule de poche »">
<div class="lab">Principe</div><p>Le patient prend lui-même, au début d’un accès, une dose unique orale de flécaïnide (200 mg si &lt; 70 kg, 300 mg si ≥ 70 kg) ou de propafénone (450 mg si &lt; 70 kg, 600 mg si ≥ 70 kg), associée à un freinateur.</p>
<div class="lab">Conditions (ESC 2024, classe IIa)</div><p>Accès peu fréquents ; absence de cardiopathie structurelle significative ; premier essai réalisé sous surveillance hospitalière pour vérifier l’efficacité et la sécurité : la classe Ic ralentit la conduction et diminue la contractilité, et l’essai recherche une hypotension, un élargissement marqué du QRS, une pause à la conversion ou un flutter conduit en 1:1. Une dysfonction sinusale, un trouble de conduction auriculoventriculaire et un syndrome de Brugada sont exclus au préalable. La cardiopathie structurelle est exclue parce que, sur un myocarde cicatriciel ou ischémique, le ralentissement de conduction favorise des réentrées ventriculaires : dans l’essai CAST, la flécaïnide a augmenté la mortalité après infarctus.</p>
<div class="lab">Consignes</div><p>Attendre la conversion au repos ; consulter si l’accès persiste après quelques heures, si des symptômes graves apparaissent ou si l’accès dure plus de 24 heures, en tenant compte de l’anticoagulation.</p>
<div class="lab">Ce que l’essai surveillé recherche</div><p>Avant l’essai, le médecin exclut une dysfonction sinusale, un trouble de conduction auriculoventriculaire et un syndrome de Brugada (ESC 2024, section 7.2.3). La première prise se fait ensuite sous ECG continu, parce que les complications surviennent dès la première dose et seraient dangereuses au domicile. Une pause prolongée au moment de la conversion révèle une <button class="w" data-k="i48-brady-tachy">dysfonction sinusale</button> que la FA masquait. Un <button class="w" data-k="i48-ic-flutter">flutter conduit en 1:1</button>, à QRS larges, apparaît quand la classe Ic ralentit l’activité auriculaire : c’est la raison du freinateur associé. Un élargissement du QRS de plus de 25 % ou un bloc de branche signale un blocage sodique excessif (ESC 2024, tableau 13). Une hypotension traduit l’effet inotrope négatif, renforcé par l’effet bêtabloquant de la propafénone. Dans la série d’Alboni, 22 % des 268 patients testés à l’hôpital ont été écartés de la stratégie pour échec ou effet indésirable.</p>
<div class="lab">Ce qui change la décision</div><p>La stratégie n’est prescrite que si l’essai a converti la FA sans pause, sans hypotension et sans élargissement excessif du QRS.</p>
<div class="lab">Source</div><p>ESC 2024 sur la FA (Van Gelder et al.), section 7.2.3, tableau 13, tableau de recommandations 17 ; Alboni et al., N Engl J Med 2004;351:2384-91.</p>
</template>

<template data-pop="i48-ablation" data-title="Ablation par cathéter de la FA">
<div class="lab">Principe</div><p>Isolation électrique circonférentielle des veines pulmonaires, par voie veineuse fémorale et ponction transseptale. Des lésions supplémentaires (paroi postérieure, lignes) peuvent être ajoutées dans certaines formes persistantes, sans bénéfice systématique démontré.</p>
<div class="lab">Énergies</div><p><b>Radiofréquence</b> (chaleur), point par point ; <b>cryoballon</b> (froid) ; <b>champ électrique pulsé</b> (électroporation), plus récent, dont la relative sélectivité tissulaire réduit le risque de lésion de l’œsophage et du nerf phrénique.</p>
<div class="lab">Indications (ESC 2024)</div><p>FA paroxystique : première ligne (I) ou après échec d’un antiarythmique (I). Persistante : après échec (I), première ligne (IIb). FEVG ≤ 40 % : cardiomyopathie rythmique probable (I), patients sélectionnés (IIa). Nouvelle ablation en cas de récidive : à envisager.</p>
<div class="lab">Complications</div><p>Tamponnade ; AVC ; complications vasculaires ; paralysie phrénique ; sténose des veines pulmonaires ; <b>fistule atrio-œsophagienne</b>, rare et grave : fièvre, douleur thoracique, signes neurologiques ou hémorragie digestive 1 à 4 semaines après ; diagnostic par scanner, et non par endoscopie, qui peut provoquer une embolie gazeuse.</p>
<div class="lab">Après ablation</div><p>Anticoagulation au moins 2 mois chez tous, quel que soit le score (classe I), car les lésions fraîches laissent un endocarde inflammatoire et thrombogène jusqu’à leur cicatrisation, et la contraction auriculaire peut rester diminuée ; puis selon le score CHA₂DS₂-VA et non selon le succès apparent (classe I), car des accès asymptomatiques peuvent persister. Une période de récidives précoces des premières semaines ne signe pas l’échec : l’inflammation des lésions fraîches déclenche des accès transitoires, qui cessent souvent à la cicatrisation ; le résultat se juge après 3 mois.</p></template>

<template data-pop="i48-cti" data-title="Ablation de l’isthme cavotricuspide">
<div class="lab">Geste</div><p>Ligne de radiofréquence de l’anneau tricuspide à la veine cave inférieure, jusqu’à obtenir un bloc de conduction bidirectionnel de l’isthme, vérifié par stimulation.</p>
<div class="lab">Résultats</div><p>Succès supérieur à 90 % pour le flutter typique, faible taux de complications. Plus efficace que les antiarythmiques.</p>
<div class="lab">Indications</div><p>Flutter typique récidivant (ESC 2019 sur les tachycardies supraventriculaires : classe I) ; à discuter dès le premier épisode symptomatique. Flutter apparu sous antiarythmique de classe Ic donné pour une FA.</p>
<div class="lab">Suite</div><p>Une FA apparaît chez une proportion importante des patients dans les années suivantes : poursuivre la surveillance et décider de l’anticoagulation selon le score, pas selon le succès de l’ablation.</p></template>

<template data-pop="i48-poaf" data-title="FA postopératoire">
<div class="lab">Épidémiologie</div><p>Fréquente après chirurgie cardiaque (de l’ordre d’un patient sur trois), plus rare après chirurgie non cardiaque, surtout thoracique. Pic entre le 2e et le 4e jour.</p>
<div class="lab">Mécanismes</div><p>Inflammation péricardique, décharge adrénergique, déséquilibres hydroélectrolytiques, ischémie auriculaire, substrat préexistant.</p>
<div class="lab">Prévention (ESC 2024)</div><p>Amiodarone périopératoire si une prophylaxie médicamenteuse est souhaitée après chirurgie cardiaque (classe I) ; péricardiotomie postérieure gauche lors de la chirurgie cardiaque (classe IIa) : l’incision draine vers la plèvre gauche le sang et l’épanchement qui s’accumulent derrière l’oreillette gauche, et dont l’inflammation déclenche la FA ; une méta-analyse montre une réduction nette de la FA postopératoire (rapport de cotes 0,44). Pas de bêtabloquant débuté en routine pour prévenir la FA avant une chirurgie non cardiaque (classe III) : dans cette situation, il réduit les infarctus postopératoires mais augmente la mortalité et les AVC, vraisemblablement par hypotension et bradycardie périopératoires. Un bêtabloquant déjà pris est en revanche poursuivi, car son arrêt augmente le risque de FA postopératoire.</p>
<div class="lab">Traitement</div><p>Corriger les facteurs déclenchants (potassium, magnésium, hypoxie, douleur) : l’hypokaliémie et l’hypomagnésémie, fréquentes après circulation extracorporelle ou sous diurétiques, favorisent les extrasystoles déclenchantes ; l’hypoxie et la douleur libèrent des catécholamines, qui raccourcissent la période réfractaire auriculaire et augmentent l’automatisme ; contrôle de la fréquence ; cardioversion si mal tolérée.</p>
<div class="lab">Anticoagulation</div><p>La FA postopératoire annonce un risque ultérieur de FA et d’AVC. Anticoagulation au long cours à envisager chez les patients à risque élevé, après chirurgie cardiaque et non cardiaque (classe IIa, niveau B), en pesant le risque hémorragique postopératoire.</p></template>

<template data-pop="i48-grossesse" data-title="FA et flutter pendant la grossesse">
<div class="lab">Contexte</div><p>Rare, souvent révélatrice d’une cardiopathie (valvulopathie mitrale, cardiopathie congénitale) ou d’une hyperthyroïdie. La grossesse augmente le débit et la volémie, et la tolérance d’une FA rapide peut être mauvaise.</p>
<div class="lab">Urgence</div><p>Cardioversion électrique en cas d’instabilité (classe I, ESC 2025 sur la grossesse) : peu d’énergie atteint le fœtus ; monitorage fœtal selon le terme.</p>
<div class="lab">Fréquence et rythme</div><p>Bêtabloquant β1-sélectif (métoprolol, bisoprolol) en première ligne ; digoxine possible. Flécaïnide en association au bêtabloquant pour le contrôle du rythme au long cours, en l’absence de cardiopathie structurelle (classe IIa). Amiodarone à éviter (toxicité thyroïdienne et neurologique fœtale).</p>
<div class="lab">Anticoagulation</div><p>Héparine de bas poids moléculaire à dose thérapeutique si FA persistante ou permanente à risque élevé (classe I) : cette grosse molécule chargée ne traverse pas le placenta, si bien que le fœtus n’est pas anticoagulé. Antivitamines K selon le terme et la dose, en milieu spécialisé : ces petites molécules traversent le placenta. Au premier trimestre, elles exposent à la fausse couche et à une embryopathie, plus fréquente quand la dose est élevée ; à partir de la 36e semaine, elles anticoagulent le fœtus, avec un risque d’hémorragie intracrânienne fœtale lors d’un accouchement imprévu. Elles sont donc évitées pendant ces deux périodes. AOD non recommandés (absence de données de sécurité).</p></template>

<template data-pop="i48-thyr" data-title="FA et hyperthyroïdie, y compris sous amiodarone">
<div class="lab">Hyperthyroïdie</div><p>Maladie de Basedow, goitre multinodulaire toxique, adénome toxique, thyroïdite, surcharge en lévothyroxine. Traitement : bêtabloquant (le propranolol inhibe aussi la conversion de T4 en T3), antithyroïdiens de synthèse, puis traitement définitif. Anticoagulation selon le score CHA₂DS₂-VA. Cardioversion différée jusqu’à l’euthyroïdie ; de nombreux patients reviennent spontanément en rythme sinusal.</p>
<div class="lab">Thyrotoxicose induite par l’amiodarone</div><p><b>Type 1</b> : l’iode libéré par l’amiodarone (environ 37 % de sa masse) alimente une synthèse hormonale excessive dans une thyroïde déjà anormale (nodules autonomes, Basedow latent). La glande hyperactive est hypervascularisée au Doppler. Les antithyroïdiens de synthèse bloquent cette synthèse et constituent le traitement. <b>Type 2</b> : l’amiodarone lèse directement les follicules d’une thyroïde saine ; cette thyroïdite destructrice libère l’hormone déjà stockée, sans synthèse accrue, et la vascularisation est basse. Les antithyroïdiens y sont inutiles ; les corticoïdes réduisent l’inflammation destructrice. Formes mixtes fréquentes, où les deux traitements sont associés ; avis endocrinologique.</p>
<div class="lab">Hypothyroïdie sous amiodarone</div><p>Plus fréquente dans les régions riches en iode ; substitution possible sans arrêter l’amiodarone si celle-ci est indispensable.</p>
<div class="lab">Mécanisme</div><p>La T3 règle l’expression des canaux ioniques et des récepteurs adrénergiques du cardiomyocyte. En excès, elle augmente les courants potassiques de repolarisation : la période réfractaire auriculaire et la longueur d’onde raccourcissent. Elle accroît l’activité des veines pulmonaires, sources des extrasystoles initiatrices, sensibilise le cœur aux catécholamines et élève le débit et la volémie, qui étirent l’oreillette. Ces mécanismes sont établis surtout chez l’animal (Klein et Danzi 2007). Le risque suit un gradient, même à l’intérieur des valeurs normales de TSH et de T4 libre (ESC 2024, section 9.10). Dans cinq cohortes poolées (8 711 participants), l’hyperthyroïdie infraclinique (TSH &lt; 0,45 mU/L, T4 libre normale) multipliait le risque de FA par 1,68, davantage si la TSH était &lt; 0,10 mU/L (Collet 2012).</p>
<div class="lab">Conséquences et décision</div><p>La digoxine et les inhibiteurs calciques freinent le nœud mais laissent agir la cause adrénergique, et l’hyperthyroïdie accroît la clairance de la digoxine. Le bêtabloquant s’oppose directement à l’hypersensibilité adrénergique. Tant que la T3 entretient le substrat, la cardioversion échoue souvent ou la FA récidive. Après le retour à l’euthyroïdie, 101 patients sur 163 sont revenus spontanément en rythme sinusal, les trois quarts dans les trois semaines, et aucun après quatre mois d’euthyroïdie ; les auteurs proposaient de cardioverser une FA persistante vers la seizième semaine (Nakazawa 1982). Le risque d’AVC est plus élevé en hyperthyroïdie et diminue avec son traitement (ESC 2024, section 9.10).</p>
<div class="lab">Excès d’iode : amiodarone et produit de contraste</div><p>L’apport d’iode est d’environ 150 µg par jour. Face à un excès brutal, une thyroïde saine bloque transitoirement sa synthèse (effet Wolff-Chaikoff), puis s’en échappe en quelques jours. Un nodule autonome ou une maladie de Basedow latente n’ont pas ce frein : l’iode alimente une synthèse excessive. L’amiodarone contient environ 37 % d’iode en masse et libère chaque jour plusieurs milligrammes d’iodure ; stockée dans les graisses, elle garde une demi-vie de plusieurs semaines, et la surcharge persiste des mois après l’arrêt. L’échec de l’échappement, surtout sur une thyroïdite auto-immune, explique l’hypothyroïdie. Une dysfonction thyroïdienne touche 15 à 20 % des patients traités (ESC 2024, section 9.10). Un produit de contraste iodé apporte en une injection des grammes d’iode ; l’exposition s’associe à un risque presque doublé d’hyperthyroïdie incidente (Rhee 2012).</p><p>La TSH et la T4 libre se dosent donc avant l’amiodarone, puis pendant et après le traitement (Bartalena 2018). Une récidive sous amiodarone, ou une FA apparue quelques semaines après un examen injecté, fait doser la TSH. En cas d’hyperthyroïdie, l’amiodarone n’est employée qu’à défaut d’autre option (ESC 2024, tableau 13).</p>
<div class="lab">Source complémentaire</div><p>Van Gelder et al., ESC 2024 sur la FA, Eur Heart J 2024;45:3314-414, section 9.10 et tableau 13. Klein et al., Circulation 2007;116:1725-35. Collet et al., Arch Intern Med 2012;172:799-809. Nakazawa et al., Am J Med 1982;72:903-6. Bartalena et al., Eur Thyroid J 2018;7:55-66. Rhee et al., Arch Intern Med 2012;172:153-9. Information professionnelle Cordarone, compendium.ch.</p>
</template>

<template data-pop="i48-holter" data-title="Holter ECG">
<div class="lab">Principe</div><p>Enregistrement ECG continu ambulatoire, de 24 heures à 7 jours, sur deux à douze dérivations.</p>
<div class="lab">Questions</div><p>Documenter une FA paroxystique ; mesurer la charge arythmique ; vérifier le contrôle de fréquence (fréquence moyenne, maximale à l’effort, pauses) ; corréler symptômes et rythme grâce au journal du patient.</p>
<div class="lab">Interprétation</div><p>Pauses &gt; 3 secondes à l’arrêt des accès : dysfonction sinusale. Pendant l’accès, l’activation auriculaire rapide freine le nœud sinusal (suppression par surcharge) ; un nœud sain reprend en moins de 1,5 seconde environ, un nœud malade beaucoup plus tard, d’où la pause, parfois avec lipothymie ou syncope (syndrome tachycardie-bradycardie). Les freinateurs et les antiarythmiques allongent ces pauses : avant de les augmenter, il faut discuter un stimulateur ou une ablation de la FA, qui supprime les pauses de fin d’accès. Fréquence moyenne élevée : contrôle insuffisant. Symptômes sans arythmie : autre cause.</p>
<div class="lab">Limite</div><p>Rendement faible si les accès sont rares : préférer un enregistrement plus long.</p></template>

<template data-pop="i48-ct" data-title="Scanner cardiaque avant ablation ou fermeture de l’auricule">
<div class="lab">Apports</div><p>Anatomie des veines pulmonaires (nombre, abouchements, variantes), forme et dimensions de l’auricule, rapports avec l’œsophage ; fusion avec la cartographie électroanatomique.</p>
<div class="lab">Thrombus</div><p>Avec une acquisition tardive, un défaut de remplissage persistant évoque un thrombus ; un défaut qui disparaît sur les images tardives correspond à une stase. Alternative à l’ETO dans des centres entraînés.</p>
<div class="lab">Précautions</div><p>Produit de contraste iodé : fonction rénale, allergie, risque thyroïdien (hyperthyroïdie latente) ; irradiation.</p></template>

<template data-pop="i48-tsh" data-title="TSH et T4 libre dans la FA">
<div class="lab">Pourquoi</div><p>L’hyperthyroïdie est une cause curable de FA : par la T3, elle raccourcit la période réfractaire auriculaire, augmente l’automatisme auriculaire et accroît la sensibilité du cœur aux catécholamines ; elle peut être la seule manifestation chez le sujet âgé.</p>
<div class="lab">Interprétation</div><p>TSH basse et T4 libre élevée : hyperthyroïdie. TSH basse et T4 libre normale : hyperthyroïdie infraclinique (vérifier la T3 libre), également associée à la FA. TSH élevée : hypothyroïdie (souvent sous amiodarone).</p>
<div class="lab">Pièges</div><p>Maladie aiguë sévère, corticoïdes et dopamine abaissent la TSH sans hyperthyroïdie. Sous amiodarone, la T4 libre peut être modérément élevée avec une TSH normale : pas de thyrotoxicose. L’amiodarone inhibe la désiodase de type 1, qui convertit la T4 en T3 dans les tissus : la T4 s’accumule et la T3 diminue un peu, si bien que l’effet hormonal et la TSH restent normaux. Une thyrotoxicose suppose une TSH basse, avec une T4 libre et le plus souvent une T3 libre élevées.</p></template>

<template data-pop="i48-inr" data-title="INR sous antivitamine K">
<div class="lab">Principe</div><p>Rapport normalisé du temps de prothrombine, qui corrige les différences entre réactifs. Il explore notamment les facteurs vitamine K-dépendants II, VII et X.</p>
<div class="lab">Cibles</div><p>Pour la prévention de l’AVC lié à la FA sans prothèse mécanique, l’INR cible est de 2,0 à 3,0. Avec une prothèse mécanique, la cible et la zone thérapeutique dépendent du type et de la position de la valve, ainsi que du risque thrombotique ; une zone unique de 2,5 à 3,5 ne convient pas à toutes les valves (ESC/EACTS 2025, tableau 10).</p>
<div class="lab">Qualité</div><p>Sous un INR de 2, la protection contre l’AVC diminue nettement ; au-dessus de 3, les hémorragies, intracrâniennes surtout, augmentent. D’où l’objectif de temps passé dans la zone thérapeutique : &gt; 70 % (classe IIa). En dessous, l’ESC recommande d’améliorer l’équilibre ou de passer à un AOD si possible.</p>
<div class="lab">Conduite devant un INR excessif</div><p>Le médecin compare d’abord l’INR à la cible individuelle, recherche un saignement et une interaction, puis adapte la dose et le délai du contrôle. Un INR de 3,2 peut être thérapeutique pour une prothèse mécanique : il ne justifie pas automatiquement de sauter une prise. Sans saignement, un INR de 4,5 à 10 conduit généralement à suspendre temporairement l’antivitamine K ; la vitamine K orale n’est pas systématique. Au-delà de 10, elle est indiquée à faible dose avec contrôles rapprochés, selon le protocole local et le risque thrombotique (ESC/EACTS 2025, section 14.3.1.2). Un saignement grave impose la vitamine K intraveineuse et un concentré de complexe prothrombinique, car leurs délais d’action se complètent. Le concentré apporte d’emblée les facteurs II, VII, IX et X fonctionnels et corrige l’INR en quelques minutes ; l’antivitamine K peut cependant persister plus longtemps. La vitamine K permet au foie de synthétiser de nouveaux facteurs fonctionnels et évite la remontée de l’INR.</p>
<div class="lab">Autotest</div><p>L’automesure par appareil capillaire, avec formation, améliore la stabilité chez des patients sélectionnés.</p>
<div class="lab">Pourquoi la zone 2,0–3,0</div><p>Sous 2,0, la protection chute : dans une étude cas-témoins, le risque d’AVC était doublé à un INR de 1,7 et multiplié par 3,3 à 1,5, par rapport à 2,0. Au-dessus de la zone, le risque d’hémorragie intracrânienne croît avec l’INR ; celui d’hématome sous-dural s’élève nettement au-delà d’environ 4. La zone 2,0–3,0 est le meilleur compromis entre ces deux risques. Un INR instable expose tour à tour à l’un et à l’autre.</p>
<div class="lab">Pourquoi le seuil de 70 %</div><p>Le temps passé dans la zone cible mesure cette stabilité. Quand il est bas, l’écart en faveur des AOD se creuse. Dans RE-LY, les avantages du dabigatran sur les hémorragies majeures (dose de 150 mg), sur l’ensemble des événements cardiovasculaires et, en tendance, sur la mortalité étaient plus marqués dans les centres où l’INR était mal contrôlé. La réduction des hémorragies intracrâniennes restait, elle, constante.</p>
<div class="lab">Décision</div><p>Le médecin cherche d’abord une cause corrigible : observance, interaction, alimentation, alcool. Si le temps en zone cible reste inférieur à 70 %, l’ESC 2024 recommande de passer à un AOD chez le patient éligible (classe I, niveau B), sauf prothèse mécanique ou rétrécissement mitral modéré à sévère.</p>
<div class="lab">Source complémentaire</div><p>Hylek et al., N Engl J Med 1996;335:540-6 ; Hylek et Singer, Ann Intern Med 1994;120:897-902 ; Wallentin et al., Lancet 2010;376:975-83 ; ESC 2024, section 6.2.2 et tableau de recommandations 7 ; Praz et coll., recommandations ESC/EACTS 2025 sur les valvulopathies, doi:10.1093/eurheartj/ehaf194, tableau 10 et section 14.3.1.2.</p>
</template>

<template data-pop="i48-antixa" data-title="Dosage spécifique des AOD">
<div class="lab">Méthodes</div><p>Inhibiteurs anti-Xa (apixaban, rivaroxaban, édoxaban) : activité anti-Xa calibrée pour la molécule, en ng/mL. Dabigatran : temps de thrombine dilué ou temps d’écarine calibrés.</p>
<div class="lab">Indications</div><p>Hémorragie grave, chirurgie urgente, thrombolyse envisagée, suspicion de surdosage (insuffisance rénale aiguë, interaction), poids extrême.</p>
<div class="lab">Interprétation</div><p>Pas de « valeur normale » : on compare la concentration aux concentrations observées dans les essais, en tenant compte de l’heure de la dernière prise. Une concentration basse (par exemple inférieure à 30–50 ng/mL, seuils de consensus) rend une chirurgie ou une thrombolyse plus sûre.</p>
<div class="lab">Piège</div><p>L’activité anti-Xa calibrée pour l’héparine ne donne pas une concentration d’AOD exploitable, mais une activité anti-Xa nulle exclut un taux significatif d’anti-Xa.</p></template>

<template data-pop="i48-periop" data-title="Interruption des AOD avant un geste (EHRA 2021)">
<div class="lab">Inhibiteurs anti-Xa (apixaban, rivaroxaban, édoxaban)</div><p>Clairance ≥ 30 mL/min : dernière prise ≥ 24 heures avant un geste à risque hémorragique faible, ≥ 48 heures avant un geste à risque élevé. Clairance 15–29 mL/min : ≥ 36 heures (faible) et ≥ 48 heures (élevé).</p>
<div class="lab">Dabigatran</div><p>Clairance ≥ 80 : ≥ 24 h (faible) et ≥ 48 h (élevé). 50–79 : ≥ 36 h et ≥ 72 h. 30–49 : ≥ 48 h et ≥ 96 h. Ces délais s’allongent davantage que ceux des inhibiteurs anti-Xa parce que le dabigatran est éliminé à environ 80 % par le rein : sa demi-vie passe d’environ 13 heures quand la clairance est ≥ 80 mL/min à environ 18 heures entre 30 et 50 mL/min. Le délai couvre plusieurs demi-vies, davantage avant un geste à risque élevé, pour que l’effet résiduel soit négligeable au moment du geste.</p>
<div class="lab">Gestes mineurs</div><p>Extraction dentaire simple, cataracte, endoscopie sans biopsie : souvent réalisables sans interruption, ou en sautant une prise, selon l’équipe.</p>
<div class="lab">Reprise</div><p>6 à 8 heures après un geste à risque faible si l’hémostase est acquise ; 48 à 72 heures après un geste à risque élevé, car l’AOD atteint son effet maximal 2 à 4 heures après la prise, alors que l’antivitamine K agit en plusieurs jours : une reprise précoce anticoagulerait pleinement un site opératoire dont l’hémostase est encore fragile.</p>
<div class="lab">Pas de relais</div><p>Aucun relais par héparine n’est nécessaire pour les AOD : leur effet disparaît et réapparaît rapidement.</p>
<div class="lab">Pourquoi le relais nuit</div><p>Un AOD atteint son pic 1 à 4 heures après la prise, et sa demi-vie dépasse rarement 17 heures avec une fonction rénale normale. L’interruption sans anticoagulant dure donc peu, et son risque embolique est faible. Une héparine ajoutée chevaucherait l’effet résiduel de l’AOD avant le geste, puis celui de sa reprise, au moment où l’hémostase chirurgicale est la plus fragile. Elle ajoute des hémorragies sans prévenir d’embolie.</p>
<div class="lab">Preuves</div><p>Sous antivitamine K, un essai randomisé contre placebo chez 1 884 patients en FA a comparé le relais par héparine de bas poids moléculaire à l’absence de relais. Le relais n’a pas réduit les thromboembolies artérielles (0,3 % contre 0,4 %) et a augmenté les hémorragies majeures (3,2 % contre 1,3 %). Sous AOD, une interruption standardisée sans relais chez 3 007 patients a donné, à 30 jours, moins de 2 % d’hémorragies majeures et moins de 1 % de thromboembolies artérielles. Sous antivitamine K, l’ESC 2024 demande de réduire au minimum la durée des relais par héparine (figure 10).</p>
<div class="lab">Source complémentaire</div><p>Douketis et al., N Engl J Med 2015;373:823-33 ; Douketis et al., JAMA Intern Med 2019;179:1469-78 ; Steffel et al., guide pratique EHRA 2021, Europace 2021;23:1612-76 (tableau 4 et chapitre sur les gestes programmés) ; ESC 2024, figure 10.</p>
</template>

<template data-pop="i48-antidote" data-title="Hémorragie sous anticoagulant : réversion">
<div class="lab">Mesures générales</div><p>Arrêt de l’anticoagulant ; compression ou geste hémostatique ; remplissage, transfusion ; heure de la dernière prise et fonction rénale ; charbon activé si prise très récente.</p>
<div class="lab">Dabigatran</div><p>Idarucizumab, fragment d’anticorps monoclonal : 5 g par voie intraveineuse (deux fois 2,5 g). Hémodialyse possible : le dabigatran est peu lié aux protéines plasmatiques (environ 35 %), et la dialyse en retire une part importante, alors que l’apixaban et le rivaroxaban, très liés, ne sont pas dialysables. L’idarucizumab fixe le dabigatran avec une affinité environ 350 fois supérieure à celle de la thrombine et le neutralise en quelques minutes ; la dialyse garde sa place si l’antidote manque, ou en cas d’insuffisance rénale aiguë, où le dabigatran accumulé dans les tissus peut revenir dans le sang après l’antidote.</p>
<div class="lab">Apixaban, rivaroxaban</div><p>Andexanet alfa, protéine leurre du facteur Xa : bolus puis perfusion, dose selon la molécule, la dose et l’heure de prise. À défaut, concentré de complexe prothrombinique à 50 UI/kg. ANNEXA-I (2024, hémorragie intracérébrale) : meilleure hémostase qu’avec les soins usuels, au prix de davantage d’événements thrombotiques, dont des AVC ischémiques. L’andexanet supprime brutalement l’anticoagulation chez des patients dont la FA justifiait ce traitement ; il fixe aussi l’inhibiteur de la voie du facteur tissulaire, frein naturel de la coagulation, ce qui pourrait créer un état procoagulant transitoire. La part de chaque mécanisme n’est pas établie. L’andexanet est donc réservé aux hémorragies menaçantes. Disponibilité et indications autorisées : vérifier compendium.ch et la liste hospitalière.</p>
<div class="lab">Édoxaban</div><p>Concentré de complexe prothrombinique ; l’andexanet alfa n’est pas autorisé pour cette molécule dans toutes les juridictions.</p>
<div class="lab">Antivitamines K</div><p>Vitamine K intraveineuse (5 à 10 mg) et concentré de complexe prothrombinique dosé selon l’INR et le poids.</p>
<div class="lab">Après</div><p>Chercher la cause ; la reprise de l’anticoagulation est la règle dans la majorité des cas, souvent après quelques jours à semaines selon le site du saignement.</p>
<div class="lab">Pourquoi l’arrêt suffit souvent</div><p>L’effet d’un AOD suit sa concentration. Avec une fonction rénale normale, sa demi-vie va d’environ 5 à 17 heures selon la molécule et l’âge ; deux demi-vies plus tard, il reste environ un quart de la concentration. Dans une hémorragie mineure, l’ESC 2024 conseille donc de différer une ou deux prises pendant le traitement de la cause (section 6.7.2, figure 11). Quand la clairance baisse, la demi-vie s’allonge, surtout celle du dabigatran : environ 13 heures au-delà de 80 mL/min, environ 27 heures sous 30 mL/min. Sous antivitamine K, la correction spontanée est plus lente, car le foie doit resynthétiser les facteurs II, VII, IX et X ; l’ESC attend un INR inférieur à 2 avant la reprise.</p>
<div class="lab">Pourquoi l’antidote est réservé</div><p>Un antidote rétablit la coagulation en quelques minutes chez un patient qui garde la raison de son anticoagulation. L’ESC 2024 le réserve aux hémorragies qui menacent la vie ou atteignent un site critique (classe IIa). Dans ANNEXA-I, le gain d’hémostase sous andexanet (67 % contre 53 %) s’est accompagné d’un quasi-doublement des événements thrombotiques (10,3 % contre 5,6 %).</p>
<div class="lab">Décision</div><p>Le médecin relève l’heure de la dernière prise, calcule la clairance et demande, si possible, un <button class="w" data-k="i48-antixa">dosage spécifique</button>. Ces données estiment l’effet résiduel : une concentration déjà basse rend l’antidote peu utile.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024, section 6.7.2, tableau de recommandations 13 et figure 11 ; Steffel et al., guide pratique EHRA 2021, Europace 2021;23:1612-76 (tableau 4) ; information professionnelle européenne de Pradaxa (Agence européenne des médicaments) ; Connolly et al., N Engl J Med 2024;390:1745-55.</p>
</template>

<template data-pop="i48-irm" data-title="IRM cardiaque dans la fibrillation auriculaire">
<div class="lab">Question clinique</div><p>Existe-t-il une cardiomyopathie sous-jacente qui modifie le pronostic ou le traitement ?</p>
<div class="lab">Apports</div><p>Volumes et FEVG de référence ; rehaussement tardif au gadolinium : cicatrice d’infarctus, myocardite, sarcoïdose, cardiomyopathie non ischémique ; T1 natif et volume extracellulaire élevés dans l’amylose.</p>
<div class="lab">Oreillette</div><p>La quantification de la fibrose auriculaire par rehaussement tardif est un outil de recherche, non validé pour décider d’une ablation.</p>
<div class="lab">Limites en FA</div><p>L’irrégularité du rythme dégrade la synchronisation ECG et la qualité des images ; un contrôle préalable de la fréquence aide. Certains dispositifs implantés imposent des précautions.</p></template>
<template data-pop="i48-bilan" data-title="Bilan initial de la FA : ce que chaque examen change">
<div class="lab">Hémogramme</div><p>Le contenu artériel en oxygène est proportionnel à l’hémoglobine. Quand elle baisse, une activation sympathique élève le débit cardiaque pour maintenir l’apport d’oxygène. En FA, ce tonus accélère la conduction du nœud auriculoventriculaire : la fréquence ventriculaire monte et résiste aux freinateurs ; la diastole raccourcit, ce qui réduit le remplissage et la perfusion coronaire. Sous anticoagulant, l’anémie est aussi un facteur hémorragique modifiable : elle peut révéler un saignement digestif occulte. Une thrombopénie ajoute un défaut d’hémostase primaire. Leur cause est recherchée avant l’anticoagulation ; elles justifient rarement d’y renoncer.</p>
<div class="lab">Créatinine et clairance</div><p>Le dabigatran est éliminé à environ 80 % par le rein, l’apixaban à environ 27 % ; le sotalol et la digoxine le sont surtout par le rein. Quand la filtration baisse, ils s’accumulent : hémorragie sous AOD, torsades de pointes sous sotalol, toxicité digitalique sous digoxine. La clairance de <button class="w" data-k="i48-cg">Cockcroft-Gault</button> fixe donc le choix et la dose : le dabigatran est contre-indiqué sous 30 mL/min, aucun AOD n’est recommandé sous 15 mL/min, et chaque molécule a ses critères de réduction.</p>
<div class="lab">Potassium et magnésium</div><p>Une hypokaliémie allonge la repolarisation ventriculaire et augmente la fixation de la digoxine sur la pompe sodium-potassium ; une hypomagnésémie entretient la fuite rénale de potassium. Ces troubles, souvent dus à un diurétique, sont donc corrigés avant un antiarythmique de classe III, la digoxine ou une cardioversion, car la toxicité digitalique expose à des arythmies ventriculaires après le choc (<button class="w" data-k="i48-k-torsades">mécanisme des torsades</button>). Le ionogramme repère aussi une hyponatrémie due à un diurétique.</p>
<div class="lab">TSH</div><p>Dans les modèles expérimentaux, l’excès d’hormone thyroïdienne raccourcit la période réfractaire auriculaire et augmente l’automatisme : il déclenche et entretient la FA. Une TSH basse fait traiter la thyrotoxicose et différer la cardioversion jusqu’à l’euthyroïdie, car la FA tend à récidiver tant que l’excès persiste. La TSH initiale sert de référence avant l’amiodarone, qui dérègle la thyroïde chez 15 à 20 % des patients traités.</p>
<div class="lab">Tests hépatiques</div><p>Le foie synthétise les facteurs de la coagulation et métabolise en partie les inhibiteurs du facteur Xa. Une cirrhose abaisse ces facteurs et souvent les plaquettes, et l’AOD peut s’accumuler. En classe C de Child-Pugh, aucun AOD n’est recommandé ; le rivaroxaban est contre-indiqué dès la classe B. Les tests servent aussi de référence avant l’amiodarone et la dronédarone, hépatotoxiques.</p>
<div class="lab">Glycémie ou HbA1c</div><p>Le diabète augmente le risque thromboembolique et ajoute le point « D » du score CHA₂DS₂-VA. Un homme de 70 ans diabétique passe ainsi de 1 à 2 points : l’anticoagulation devient recommandée. Un équilibre glycémique efficace est aussi recommandé pour réduire les récidives et la progression de la FA (pilier « C » d’AF-CARE).</p>
<div class="lab">Coagulation de base</div><p>Un INR spontanément allongé évoque notamment une hépatopathie ou un déficit en vitamine K ; il doit être interprété avec le contexte clinique. Un temps de céphaline activée allongé sans explication appelle un bilan adapté : anticoagulant circulant, déficit en facteur ou anticoagulant lupique sont des possibilités. Un résultat isolé ne diagnostique pas un syndrome des antiphospholipides. L’essai de Pengo et coll. (2018) a comparé le rivaroxaban à la warfarine chez 120 patients avec syndrome des antiphospholipides thrombotique, triple positivité et thrombose antérieure ; il a trouvé davantage de thromboses artérielles sous rivaroxaban. Cette preuve concerne cette population à haut risque, pas une simple positivité biologique ni la FA ordinaire ; le choix de l’anticoagulant dans un syndrome confirmé relève d’une évaluation spécialisée.</p>
<div class="lab">Échocardiographie transthoracique</div><p>Un rétrécissement mitral modéré à sévère ou une prothèse mécanique impose un antivitamine K. Une FEVG ≤ 40 % compte pour le point « C » du score. Elle exclut le vérapamil et le diltiazem, inotropes négatifs qui aggravent la défaillance. Elle exclut aussi la flécaïnide et la propafénone, qui ralentissent la conduction dans un myocarde malade et favorisent des tachycardies ventriculaires par réentrée ; l’amiodarone reste alors le seul antiarythmique recommandé. Une hypertrophie ventriculaire gauche sévère exclut aussi ces deux molécules. Une oreillette gauche dilatée traduit un substrat étiré et fibreux : le rythme sinusal se maintient moins souvent.</p>
<div class="lab">Source</div><p>ESC 2024 (Van Gelder et al., Eur Heart J 2024;45:3314-3414) : section 3.4, tableau 8, figures 5, 6, 10 et 13, tableaux 11 et 12, sections 5.3, 6.2.1 et 9.10, tableaux de recommandations 3, 5, 7 et 18. Steffel et al., guide EHRA, Europace 2021;23:1612-1676. Roden, N Engl J Med 2004;350:1013-1022. Huang et Kuo, J Am Soc Nephrol 2007;18:2649-2652. Pengo et al., Blood 2018;132:1365-1371. Echt et al., N Engl J Med 1991;324:781-788. Guyton & Hall, 14e éd.</p></template>
<template data-pop="i48-remod-inverse" data-title="Remodelage inverse : ce que corrige chaque mesure">
<div class="lab">Physiologie normale</div><p>Une oreillette gauche saine se remplit à basse pression, car le ventricule gauche se relâche normalement. Sa paroi n’est pas étirée, son interstitium contient peu de collagène, et l’influx s’y propage vite et de façon homogène.</p>
<div class="lab">Mécanisme</div><p>Les facteurs de risque entretiennent le remodelage par quatre stimulus : l’étirement de la paroi, l’angiotensine II, l’inflammation et la toxicité directe sur les myocytes. L’étirement et l’angiotensine II activent les fibroblastes, qui déposent du collagène entre les myocytes (Burstein et Nattel, 2008). Chaque mesure retire un de ces stimulus. Tant que la fibrose n’est pas fixée, l’oreillette peut en partie se réduire et mieux conduire ; une fibrose ancienne régresse peu.</p>
<p><b>Pression artérielle.</b> L’hypertension rigidifie le ventricule gauche, élève sa pression de remplissage et dilate l’oreillette. La baisse tensionnelle réduit cet étirement. Les inhibiteurs de l’enzyme de conversion et les antagonistes des récepteurs de l’angiotensine bloquent en plus le signal fibrosant de l’angiotensine II. Des données comparatives limitées suggèrent qu’ils préviennent mieux les récidives (ESC 2024, section 5.1).</p>
<p><b>Poids.</b> La graisse épicardique, au contact direct du myocarde auriculaire, libère des médiateurs inflammatoires et fibrosants ; ce rôle repose surtout sur des données expérimentales (Hatem et Sanders, 2014). L’obésité élève aussi la pression de remplissage et favorise les apnées.</p>
<p><b>Alcool.</b> L’éthanol et l’acétaldéhyde sont toxiques pour les myocytes. Chez des buveurs réguliers modérés, l’oreillette gauche conduit plus lentement que chez des non-buveurs (Voskoboinik et coll., 2019).</p>
<p><b>Apnées du sommeil.</b> La ventilation en pression positive continue supprime l’étirement nocturne, l’hypoxémie et les décharges autonomes ; dans un petit essai randomisé, elle a amélioré la conduction auriculaire (Nalliah et coll., 2022).</p>
<div class="lab">Conséquence clinique</div><p>Le bénéfice suit l’intensité de la correction. Dans une cohorte australienne, une perte de poids d’au moins 10 % multipliait par six la probabilité de survie sans arythmie, et une fluctuation de plus de 5 % doublait le risque de récidive (Pathak et coll., 2015) ; une perte de 3 % ou moins restait sans effet (ESC 2024, section 5.4). Dans un essai randomisé de 140 buveurs réguliers, la consommation est passée de 16,8 à 2,1 verres standard par semaine, et la FA a récidivé chez 53 % des patients contre 73 % (Voskoboinik et coll., 2020). Dans des cohortes, une FA persistante est même redevenue paroxystique ou a disparu (ESC 2024, section 5.4).</p>
