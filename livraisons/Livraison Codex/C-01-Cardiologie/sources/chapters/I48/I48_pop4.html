<template data-pop="i48-aod" data-title="Anticoagulants oraux directs (AOD)">
<div class="lab">Molécules et mécanisme</div><p>Inhibiteurs directs et réversibles d’une enzyme de la coagulation : facteur Xa (apixaban, rivaroxaban, édoxaban) ou thrombine (dabigatran, promédicament du dabigatran étexilate).</p>
<div class="lab">Preuves</div><p>Quatre essais contre la warfarine (RE-LY, ROCKET AF, ARISTOTLE, ENGAGE AF-TIMI 48) : efficacité au moins équivalente sur l’AVC et l’embolie, réduction d’environ moitié des hémorragies intracrâniennes, réduction modeste de la mortalité dans la méta-analyse. Certains augmentent les hémorragies digestives (dabigatran 150 mg, rivaroxaban, édoxaban 60 mg), alors que l’apixaban ne les a pas augmentées dans ARISTOTLE. Le mécanisme reste discuté : le dabigatran étexilate n’est absorbé qu’à environ 6,5 %, et la fraction restante, activée dans la lumière intestinale, pourrait agir directement sur une lésion muqueuse ; pour le rivaroxaban et l’édoxaban en une prise par jour, le pic de concentration plus élevé est évoqué. Chez un patient exposé au saignement digestif, ces données font préférer l’apixaban et rechercher puis traiter la lésion responsable.</p>
<div class="lab">Place (ESC 2024)</div><p>Premier choix de l’anticoagulation de la FA (classe I, niveau A), sauf prothèse mécanique et rétrécissement mitral modéré à sévère.</p>
<div class="lab">Posologie</div><p>Doses standard et réduites selon des critères fixes (îlot 10 et onglet Pharmacologie). Pas de réduction « par prudence » : le sous-dosage augmente les AVC.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies ; dyspepsie (dabigatran) ; rares réactions cutanées ou hépatiques.</p>
<div class="lab">Contre-indications</div><p>Hémorragie active, lésion à haut risque hémorragique, prothèse mécanique, rétrécissement mitral modéré à sévère, grossesse et allaitement, insuffisance hépatique sévère, clairance &lt; 15 mL/min (&lt; 30 pour le dabigatran), syndrome des antiphospholipides à haut risque.</p>
<div class="lab">Surveillance</div><p>Observance, car la demi-vie d’environ 12 heures fait disparaître l’effet en un jour d’oubli, sans la marge qu’offre la longue demi-vie d’un antivitamine K ; fonction rénale au moins annuellement, plus souvent si la clairance est basse ou chez le sujet âgé (tous les « clairance ÷ 10 » mois sous 60 mL/min), car une baisse de la clairance, par déshydratation ou sous anti-inflammatoire non stéroïdien, fait monter la concentration, surtout celle du dabigatran, et peut imposer la dose réduite ; hémogramme, car une baisse de l’hémoglobine révèle un saignement occulte, surtout digestif, avant qu’il devienne visible ; interactions à chaque nouvelle prescription, car un inhibiteur de la glycoprotéine P ou du CYP3A4 augmente la concentration de l’AOD (risque de saignement) et un inducteur, comme la rifampicine ou la carbamazépine, la diminue (risque d’AVC).</p>
<div class="lab">Rein et choix de la molécule</div><p>Le rein élimine sous forme inchangée environ 27 % de l’apixaban absorbé, 35 % du rivaroxaban, 50 % de l’édoxaban et 80 % du dabigatran. Quand la clairance baisse, une molécule s’accumule d’autant plus que cette fraction est grande. L’accumulation reste silencieuse jusqu’à l’hémorragie. C’est pourquoi le dabigatran est contre-indiqué sous 30 mL/min, alors que les trois inhibiteurs du facteur Xa restent autorisés en Europe à dose réduite entre 15 et 29 mL/min (ESC 2024, section 6.2.1 et tableau 11). Le guide EHRA 2021 demande une créatinine au moins annuelle et, sous 60 mL/min, un contrôle tous les « clairance ÷ 10 » mois : à 40 mL/min, tous les quatre mois. La même accumulation allonge l’<button class="w" data-k="i48-periop">interruption avant un geste</button>.</p>
<div class="lab">Tube digestif</div><p>L’excès d’hémorragies digestives sous certains AOD n’a pas d’explication démontrée. Une hypothèse invoque l’effet local de la fraction non absorbée sur une lésion de la muqueuse : la biodisponibilité du dabigatran n’est que de 3 à 7 %. Après une hémorragie digestive, le choix se porte donc plutôt sur une molécule qui n’a pas augmenté ce risque dans son essai, comme l’apixaban.</p>
<div class="lab">Une ou deux prises</div><p>Une prise unique donne un pic plus haut et un creux plus bas que deux prises de même total ; un oubli laisse alors une période plus longue à concentration basse. L’ESC 2024 note pourtant qu’aucune donnée cohérente ne montre une différence d’observance ou d’efficacité entre les deux schémas (section 6.4). Le choix suit donc le profil du patient : molécule peu éliminée par le rein si la clairance est basse, schéma discuté avec le patient, interactions vérifiées à chaque coprescription (ESC 2024, figure 9).</p>
<div class="lab">Pourquoi ces contre-indications</div><p>Un AOD inhibe une seule enzyme à dose fixe, sans ajustement biologique ; son bénéfice n’est établi que dans les populations des essais. Sous 15 mL/min, les données manquent et l’accumulation expose à l’hémorragie. Dans la cirrhose, le métabolisme hépatique du rivaroxaban et de l’apixaban baisse, et la maladie crée sa propre coagulopathie. Au stade Child-Pugh C, aucun AOD n’est recommandé ; au stade B, le rivaroxaban est contre-indiqué et les autres s’emploient avec prudence (informations professionnelles européennes). Pendant la grossesse, l’ESC 2024 préfère les héparines, qui ne traversent pas le placenta ; une exposition accidentelle n’impose pas d’interrompre la grossesse (section 9.8). Pendant l’allaitement, les données humaines manquent ; chez l’animal, le rivaroxaban, l’apixaban et l’édoxaban passent dans le lait. Dans le syndrome des antiphospholipides avec triple positivité, un essai randomisé a été arrêté : 7 patients sur 59 (12 %) ont présenté sous rivaroxaban un événement thromboembolique artériel, 4 AVC ischémiques et 3 infarctus, contre aucun sous warfarine. Le mécanisme de cet échec reste inconnu ; ces patients reçoivent un antivitamine K.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024 (Van Gelder et al., Eur Heart J 2024;45:3314-414), sections 6.2.1, 6.4 et 9.8, tableau 11, figure 9 ; Steffel et al., guide pratique EHRA 2021, Europace 2021;23:1612-76 (tableaux 3 et 4) ; informations professionnelles européennes (Agence européenne des médicaments) de Pradaxa, Eliquis, Xarelto et Lixiana ; Pengo et al., Blood 2018;132:1365-71.</p>
</template>

<template data-pop="i48-avk" data-title="Antivitamines K">
<div class="lab">Molécules et demi-vies</div><p>Phenprocoumone (demi-vie de plusieurs jours, environ 110 à 160 heures selon les sources : l’INR varie peu d’une prise à l’autre, mais un surdosage persiste plusieurs jours et l’arrêt avant un geste doit être anticipé) et acénocoumarol (demi-vie d’environ 8 à 11 heures : l’INR fluctue davantage d’un jour à l’autre, mais l’effet disparaît plus vite à l’arrêt). La commercialisation et la disponibilité de chaque molécule se vérifient dans l’information professionnelle suisse et la liste locale.</p>
<div class="lab">Mécanisme</div><p>Inhibition de la vitamine K époxyde réductase : baisse des facteurs II, VII, IX et X fonctionnels, et des protéines C et S.</p>
<div class="lab">Indications préférentielles</div><p>Prothèse valvulaire mécanique, rétrécissement mitral modéré à sévère, contre-indication aux AOD ; sujet âgé stable et polymédiqué déjà bien équilibré : le maintien peut être envisagé (classe IIb, ESC 2024), car dans l’essai FRAIL-AF, chez des patients fragiles de 75 ans ou plus, le passage de l’antivitamine K à un AOD a augmenté les hémorragies majeures ou cliniquement pertinentes (17,8 contre 10,5 pour 100 patients-années, surtout des saignements non majeurs), et l’essai a été arrêté pour futilité ; la cause de cet excès n’est pas établie.</p>
<div class="lab">Initiation</div><p>Dose adaptée selon l’INR et contrôles rapprochés au début. Le chevauchement avec une héparine n’est pas systématique lors d’une initiation pour FA isolée : il dépend de l’indication thrombotique et du contexte, par exemple une thrombose aiguë nécessitant un effet immédiat. L’INR ne reflète pas encore l’ensemble de l’effet au début : le facteur VII, de demi-vie courte (environ 6 heures), baisse le premier et élève l’INR dès le deuxième jour, alors que la prothrombine, de demi-vie longue (environ 60 à 72 heures), reste longtemps fonctionnelle. Dans le traitement d’une thrombose aiguë par un antivitamine K, le chevauchement dure au moins cinq jours et jusqu’à un INR dans la cible pendant au moins 24 heures ; ce schéma ne s’applique pas automatiquement à la FA isolée.</p>
<div class="lab">Interactions</div><p>Nombreuses : amiodarone, antibiotiques (cotrimoxazole, macrolides, fluoroquinolones), antifongiques azolés, paracétamol à forte dose régulière ; alimentation riche en vitamine K ; alcool.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies ; nécrose cutanée rare en début de traitement : la protéine C, anticoagulante et dépendante de la vitamine K, a une demi-vie d’environ 8 heures et chute avant la prothrombine, surtout en cas de déficit constitutionnel ; l’état transitoirement procoagulant qui en résulte thrombose les veinules du tissu adipeux (seins, cuisses, abdomen). Ce mécanisme rare appelle une initiation prudente et un avis spécialisé en cas de déficit en protéines C ou S ; il ne justifie pas un chevauchement systématique par héparine en FA isolée. Tératogénicité : les antivitamines K traversent le placenta ; l’embryopathie (hypoplasie nasale, épiphyses ponctuées), maximale entre la 6e et la 12e semaine, est attribuée au défaut de carboxylation des protéines osseuses de l’embryon. L’ESC 2024 les proscrit au premier trimestre et dès la 36e semaine, car un accouchement imprévu exposerait le fœtus à une hémorragie intracrânienne ; elle préfère les héparines, qui ne traversent pas le placenta.</p>
<div class="lab">Pourquoi tant d’interactions</div><p>L’effet d’un antivitamine K dépend de deux grandeurs : sa concentration, fixée par le métabolisme hépatique, et la vitamine K disponible pour le foie. L’acénocoumarol est hydroxylé surtout par le CYP2C9. La phenprocoumone emprunte aussi le CYP3A4 et une excrétion inchangée : elle dépend moins du CYP2C9. Un inhibiteur de ces enzymes fait monter la concentration et l’INR ; un inducteur les fait baisser.</p>
<div class="lab">Inhibiteurs</div><p>L’amiodarone, le cotrimoxazole, le métronidazole et les antifongiques azolés comme le fluconazole inhibent le CYP2C9. L’antivitamine K s’accumule et l’INR monte en quelques jours, plus lentement avec l’<button class="w" data-k="i48-interactions">amiodarone</button>. L’ESC 2024, qui raisonne sur la warfarine, conseille de réduire la dose et d’éviter si possible le fluconazole (figure 9).</p>
<div class="lab">Antibiotiques et infection</div><p>Les macrolides inhibent le CYP3A4 ; le mécanisme des fluoroquinolones est moins clair. L’infection et la fièvre augmentent aussi par elles-mêmes la sensibilité au traitement. La baisse de la vitamine K produite par la flore intestinale est une contribution discutée. Sous macrolide ou fluoroquinolone, l’ESC 2024 demande une surveillance étroite de l’INR.</p>
<div class="lab">Paracétamol</div><p>Une prise régulière de paracétamol à forte dose fait monter l’INR. In vitro, son métabolite toxique, la N-acétyl-p-benzoquinone imine, inhibe la carboxylase vitamine K-dépendante et, à plus forte concentration, la vitamine K époxyde réductase. Ce mécanisme reste une hypothèse chez le patient.</p>
<div class="lab">Inducteurs</div><p>La rifampicine et la carbamazépine induisent les enzymes hépatiques : l’INR baisse et la dose doit augmenter. À l’arrêt de l’inducteur, l’induction s’efface progressivement ; sans réduction de dose, l’INR monte.</p>
<div class="lab">Vitamine K alimentaire et alcool</div><p>La vitamine K des légumes verts peut être réduite par une voie insensible aux antivitamines K. Elle rétablit alors la carboxylation des facteurs, et l’INR baisse. Le conseil est donc un apport régulier, non une exclusion. Une prise aiguë importante d’alcool inhibe le métabolisme et fait monter l’INR ; une consommation chronique l’induit, fait baisser l’INR et lèse le foie.</p>
<div class="lab">Conduite</div><p>Tout début ou arrêt d’un médicament, d’un antibiotique ou d’une habitude alimentaire impose un contrôle de l’INR dans les jours qui suivent.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/25472735/" target="_blank" rel="noopener">Kim et al., J Thromb Haemost 2015;13:182–190</a>, doi:10.1111/jth.12810 (initiation de warfarine en FA non valvulaire ; cohorte observationnelle, non essai randomisé) ; Ufer, Clin Pharmacokinet 2005;44:1227-46 ; Holbrook et al., Arch Intern Med 2005;165:1095-106 ; Thijssen et al., Thromb Haemost 2004;92:797-802 ; ESC 2024, figure 9.</p>
</template>

<template data-pop="i48-d-frein" data-title="Bêtabloquants et inhibiteurs calciques dans la FA">
<div class="lab">Bêtabloquants</div><p>Ralentissent le nœud auriculoventriculaire en bloquant les récepteurs β1 ; efficaces au repos et à l’effort. Première ligne quelle que soit la FEVG. Particulièrement utiles si une angine de poitrine ou un infarctus récent s’ajoute à la FA, selon la tolérance, car la baisse de la fréquence et de la contractilité réduit la consommation d’oxygène du myocarde et allonge la diastole, pendant laquelle le ventricule gauche est perfusé ; recommandés aussi en cas d’ICFEr, pour le traitement de cette maladie, même si la réduction de mortalité démontrée en rythme sinusal n’est pas établie en FA (ESC 2024, § 7.1.3). Précautions : asthme sévère, car le blocage des récepteurs β2 bronchiques favorise le bronchospasme (préférer un β1-sélectif) ; bradycardie et bloc auriculoventriculaire, car le bêtabloquant ralentit encore le nœud sinusal et la conduction ; insuffisance cardiaque décompensée avec bas débit, car le débit y dépend de la stimulation sympathique, que le bêtabloquant supprime. Le sotalol a en plus une activité de classe III.</p>
<div class="lab">Vérapamil et diltiazem</div><p>Bloquent les canaux calciques de type L du nœud. Efficaces, bien tolérés sur le plan respiratoire, car ils ne bloquent pas les récepteurs β2 bronchiques. Réservés à une FEVG &gt; 40 % (ESC 2024, tableau 12), car le blocage des canaux calciques de type L du myocarde ventriculaire réduit la contractilité et peut décompenser une insuffisance cardiaque à fraction d’éjection réduite. Interactions : le vérapamil inhibe la glycoprotéine P, ce qui augmente la concentration du dabigatran (dose réduite) et de la digoxine (risque de toxicité digitalique) ; vérapamil et diltiazem inhibent le CYP3A4, ce qui élève la concentration de la simvastatine (risque de rhabdomyolyse, dose à limiter) ; à l’inverse, les inhibiteurs du CYP3A4 élèvent la concentration du vérapamil et du diltiazem, avec un risque de bradycardie et d’hypotension.</p>
<div class="lab">Preuves</div><p>L’essai RACE II a comparé une cible de fréquence souple (&lt; 110/min au repos) à une cible stricte (&lt; 80/min) : pas de différence sur les événements. L’ESC 2024 retient la cible souple comme point de départ.</p>
<div class="lab">Surveillance</div><p>Fréquence au repos et à l’effort (Holter, test d’effort), pression artérielle, tolérance ; chercher des pauses chez le sujet âgé, car une maladie du nœud sinusal est fréquente à cet âge : la dose qui freine une FA rapide devient excessive quand la FA s’arrête ou se ralentit, et la reprise sinusale peut tarder plusieurs secondes (pause de conversion du syndrome bradycardie-tachycardie). Des pauses symptomatiques conduisent à un Holter, puis à une stimulation cardiaque qui permet de poursuivre le freinateur, ou à une ablation de la FA, qui supprime les pauses de fin d’accès (ESC 2024, § 7.2.5).</p>
<div class="lab">Mécanisme commun</div><p>Dans le nœud auriculoventriculaire, la dépolarisation dépend du courant calcique de type L, qui récupère lentement de son inactivation : plus les influx auriculaires sont rapprochés, plus ils sont ralentis ou bloqués. Tout médicament qui réduit ce courant renforce ce filtrage, sans modifier la FA elle-même. Le bêtabloquant supprime la stimulation β1, donc l’adénosine monophosphate cyclique qui active le canal calcique ; son effet, proportionnel au tonus sympathique, est maximal à l’effort. Le vérapamil et le diltiazem bloquent directement le canal, d’autant plus que la fréquence est élevée. Ils bloquent aussi le canal du myocarde ventriculaire et des artérioles : ils diminuent la contractilité et la pression artérielle. Les dihydropyridines, comme l’amlodipine, agissent surtout sur les artérioles et ne ralentissent pas le nœud.</p>
<div class="lab">Ce que change chaque critère</div><p><b>FEVG ≤ 40 %.</b> L’effet inotrope négatif du vérapamil et du diltiazem retire une réserve contractile déjà réduite : ils sont contre-indiqués (ESC 2024, tableau 12). Le traitement repose sur un bêtabloquant et/ou la digoxine (classe I, niveau B). Le bénéfice pronostique des bêtabloquants démontré en rythme sinusal pourrait ne pas exister en FA (ESC 2024, section 7.1.3) : ils y sont choisis pour la fréquence et les symptômes.</p><p><b>Instabilité ou FEVG très altérée.</b> Une instabilité causée par la FA relève de la cardioversion électrique. Pour ralentir en urgence, l’amiodarone intraveineuse, la digoxine, l’esmolol ou le landiolol peuvent être envisagés (classe IIb, niveau B). L’esmolol et le landiolol, hydrolysés par les estérases du sang, cessent d’agir quelques minutes après l’arrêt de la perfusion si la pression baisse. Schémas : esmolol 500 µg/kg en 1 minute, puis 50 à 300 µg/kg/min ; landiolol 100 µg/kg en 1 minute, puis 10 à 40 µg/kg/min (ESC 2024, tableau 12).</p><p><b>Asthme.</b> Le blocage des récepteurs β2 bronchiques supprime un tonus bronchodilatateur : les bêtabloquants non sélectifs sont à éviter, et la sélectivité β1 diminue aux doses élevées. Le vérapamil et le diltiazem épargnent les bronches et conviennent si la FEVG est &gt; 40 %.</p><p><b>Patient actif.</b> La digoxine seule ne contrôle pas la fréquence d’effort. Dans un essai croisé de 60 patients, le vérapamil et le diltiazem ont moins réduit la capacité d’effort que les bêtabloquants (ESC 2024, section 7.1.3).</p><p><b>Urgence.</b> Un bêtabloquant intraveineux, ou le diltiazem ou le vérapamil si la FEVG est &gt; 40 %, est préféré à la digoxine, car son action est plus rapide et proportionnelle à la dose (ESC 2024, section 7.1.2). Le contexte hémodynamique prime : les bêtabloquants usuels sont contre-indiqués en cas d’insuffisance cardiaque aiguë (tableau 12). Un sepsis, une surcharge hydrique ou un choc cardiogénique se traitent avant ou en parallèle du contrôle de fréquence ; une tachycardie peut soutenir le débit, mais la FA peut aussi aggraver l’instabilité. Les options pour une FEVG très altérée relèvent d’une surveillance spécialisée ; l’amiodarone intraveineuse peut provoquer une hypotension, une bradycardie ou un bloc.</p><p><b>Association.</b> Le bêtabloquant et le vérapamil ou le diltiazem réduisent le même courant calcique nodal ; leurs effets s’additionnent jusqu’au bloc auriculoventriculaire. Cette association relève des soins spécialisés, avec un ECG de 24 heures régulier (ESC 2024, section 7.1.1).</p>
<div class="lab">Source complémentaire</div><p>Van Gelder et al., ESC 2024 sur la FA, Eur Heart J 2024;45:3314-414 : sections 7.1.1 à 7.1.3, tableau 12, tableau de recommandations 14. Brunton et al., Goodman &amp; Gilman’s The Pharmacological Basis of Therapeutics, 14e éd., 2023. Hall et al., Guyton and Hall Textbook of Medical Physiology, 14e éd., 2021, chapitre 10. Ulimoen et al., Eur Heart J 2014;35:517-24.</p>
</template>

<template data-pop="i48-d-flec" data-title="Flécaïnide et propafénone (classe Ic)">
<div class="lab">Mécanisme</div><p>Blocage du canal sodique rapide avec dissociation lente : ralentissement de la conduction auriculaire et ventriculaire, accentué à fréquence élevée (dépendance à l’usage). La propafénone a aussi une activité β-bloquante.</p>
<div class="lab">Preuves</div><p>Efficaces pour la cardioversion pharmacologique de la FA récente et pour le maintien du rythme sur cœur sain. L’essai CAST (1989) a montré une surmortalité sous flécaïnide et encaïnide après infarctus : d’où la contre-indication dans la coronaropathie.</p>
<div class="lab">Posologie</div><p>Flécaïnide 50–150 mg × 2/jour ; propafénone 150–300 mg × 3/jour ; en « pilule de poche » : flécaïnide 200–300 mg, propafénone 450–600 mg.</p>
<div class="lab">Effets indésirables</div><p>Flutter 1:1, élargissement du QRS, tachycardie ventriculaire proarythmique ; troubles visuels, vertiges ; goût métallique (propafénone).</p>
<div class="lab">Contre-indications</div><p>Coronaropathie, fonction systolique ventriculaire gauche altérée pour le maintien du rythme (y compris une FEVG entre 41 et 49 %), hypertrophie ventriculaire importante, trouble de conduction sévère sans stimulateur, syndrome de Brugada. Pour la cardioversion, les tableaux 13 et 17 de l’ESC 2024 écartent notamment la cardiopathie structurelle sévère et l’insuffisance cardiaque à FEVG réduite.</p>
<div class="lab">Surveillance</div><p>ECG après initiation et après chaque augmentation ; ECG d’effort ; QRS élargi de plus de 25 % : réduire. <button class="w" data-k="i48-ic-flutter">Toujours associer un freinateur</button>.</p>
<div class="lab">Pourquoi un cœur sain</div><p>Le blocage sodique ralentit la conduction et peut favoriser un bloc local. Une cicatrice d’infarctus, une ischémie ou une fibrose rendent la conduction hétérogène : un ralentissement supplémentaire peut permettre à un influx de contourner une zone encore réfractaire, puis d’y revenir et d’entretenir une réentrée ventriculaire. Ce mécanisme est une explication proposée de la proarythmie ; CAST a établi la surmortalité après infarctus, sans en démontrer le mécanisme. L’absence de cardiopathie significative réduit le risque sans le supprimer, notamment à fréquence élevée ou en cas de surdosage. La classe Ic diminue aussi la contractilité, ce qui peut aggraver une insuffisance cardiaque.</p>
<div class="lab">Raison de chaque contre-indication</div><p>La coronaropathie expose à l’ischémie et aux séquelles d’infarctus ; une fonction systolique altérée réduit la réserve contractile. Une FEVG entre 41 et 49 % signale une altération de fonction, sans démontrer à elle seule une cicatrice ou une fibrose. Pour l’entretien du rythme, l’ESC 2024 exclut la classe Ic en cas de fonction systolique altérée, sans seuil chiffré, et place l’insuffisance cardiaque stable à FEVG 41–49 % avec l’amiodarone ou la dronédarone (figure 5). Cette proposition conserve les groupes de la recommandation FA 2024 ; la définition ICFEr de 2026 ne modifie pas ses seuils. La dronédarone reste soumise à un résumé des caractéristiques plus restrictif, détaillé dans sa monographie. Dans l’hypertrophie importante, la conduction et la repolarisation deviennent hétérogènes et le sous-endocarde s’expose à l’ischémie ; cette contre-indication repose sur ce raisonnement et sur un consensus, car les données directes sont limitées. Dans le syndrome de Brugada, le courant sodique de l’épicarde du ventricule droit est déjà fonctionnellement réduit, parfois du fait d’un variant pathogène de SCN5A. Le bloquer davantage démasque l’aspect de type 1, principe du test pharmacologique, et peut déclencher une fibrillation ventriculaire ; le mécanisme cellulaire du syndrome reste débattu. Un trouble de conduction sévère sans stimulateur expose à un bloc de haut degré (ESC 2024, section 7.2.4, classe III). La flécaïnide est en partie éliminée par le rein : l’ESC 2024 l’écarte si la clairance est inférieure à 35 mL/min/1,73 m² (tableau 13).</p>
<div class="lab">Pourquoi l’ECG d’effort</div><p>Le QRS mesure l’intensité du blocage sodique ventriculaire. Ce blocage s’accumule quand la fréquence augmente (<button class="w" data-k="i48-ic-flutter">dépendance à l’usage</button>) : le QRS s’élargit surtout à l’effort, et l’ECG de repos sous-estime le blocage.</p>
<div class="lab">Ce qui change la décision</div><p>Avant toute classe Ic, le médecin obtient un ECG, une ETT et, si une coronaropathie est suspectée, un examen d’ischémie ou une imagerie coronaire (ESC 2024, tableau 8). Sur un cœur malade, l’amiodarone reste utilisable si la FEVG est ≤ 40 %, car son effet sur la mortalité est neutre dans l’insuffisance cardiaque (Bardy et al., 2005). La dronédarone, elle, n’est pas proposée dans ce groupe par l’ESC 2024 ; son résumé des caractéristiques publié par Sanofi exclut aussi tout antécédent ou présence d’insuffisance cardiaque ou de dysfonction systolique, même avec une FEVG au-dessus de 40 %.</p>
<div class="lab">Source</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/1900101/" target="_blank" rel="noopener">Echt et al., CAST, N Engl J Med 1991;324:781–788</a> (doi:10.1056/nejm199103213241201, résultat de mortalité ; mécanisme non établi) ; Bardy et al., N Engl J Med 2005;352:225-37 ; Zeppenfeld et al., ESC 2022 sur les arythmies ventriculaires, Eur Heart J 2022;43:3997-4126 ; ESC 2024 sur la FA (Van Gelder et al.), section 7.2.4, figure 5, tableaux 8 et 13, tableau de recommandations 18.</p>
</template>

<template data-pop="i48-d-amio" data-title="Amiodarone">
<div class="lab">Mécanisme</div><p>Antiarythmique à effets multiples : blocage potassique (classe III, effet principal), sodique, calcique et β-adrénergique. Pharmacocinétique très particulière : forte liposolubilité, d’où un volume de distribution très élevé (de l’ordre de 60 L/kg) ; une dose de charge accélère l’obtention de concentrations tissulaires efficaces ; demi-vie de plusieurs semaines (environ 60 jours en moyenne), si bien que l’effet, la toxicité et les interactions persistent des mois après l’arrêt ; 37 % d’iode en masse, soit une libération de plusieurs milligrammes d’iode par jour, des dizaines de fois l’apport quotidien recommandé, à l’origine des dysthyroïdies.</p>
<div class="lab">Place</div><p>Antiarythmique très efficace pour maintenir le rythme sinusal, recommandé par l’ESC 2024 si la FEVG est ≤ 40 % (classe I), car son effet inotrope négatif est faible et il n’a pas augmenté la mortalité dans l’insuffisance cardiaque (SCD-HeFT), alors que la classe Ic après infarctus (CAST) et la dronédarone dans l’insuffisance cardiaque sévère (ANDROMEDA) l’ont augmentée. Cardioversion pharmacologique en cas de cardiopathie significative. Dernier recours pour le contrôle de la fréquence, car ses effets indésirables extracardiaques, liés à la dose cumulée, s’accumulent avec la durée du traitement (ESC 2024, § 7.1.3), et parce qu’il peut rétablir le rythme sinusal chez un patient non anticoagulé, avec un risque d’embolie.</p>
<div class="lab">Posologie</div><p>Intraveineux : 300 mg en 30–60 minutes, puis 900–1 200 mg sur 24 heures, par une veine de gros calibre (phlébite). Oral : 200 mg × 3/jour pendant 4 semaines, puis 200 mg/jour ou moins (ESC 2024, tableau 12).</p>
<div class="lab">Effets indésirables</div><p>Thyroïde (hypothyroïdie, car la surcharge iodée bloque l’organification de l’iode sans que la glande échappe à ce blocage, surtout en cas de thyroïdite auto-immune ; hyperthyroïdie de type 1, par excès d’iode sur une thyroïde déjà nodulaire ou basedowienne, ou de type 2, par thyroïdite destructrice due à une toxicité directe, deux mécanismes qui se traitent différemment) ; poumon (pneumopathie interstitielle, dose-dépendante, attribuée à une toxicité directe sur les cellules alvéolaires et à l’accumulation de phospholipides dans les macrophages ; elle peut être mortelle si elle est reconnue tard) ; foie (cytolyse) ; peau (photosensibilité, coloration gris-bleu) ; œil (dépôts cornéens, rare neuropathie optique) ; neuropathie périphérique ; bradycardie ; hypotension et bloc auriculoventriculaire, notamment par voie intraveineuse ; allongement du QT, torsades rares.</p>
<div class="lab">Interactions</div><p>Augmente les concentrations de la digoxine et du dabigatran, par inhibition de la glycoprotéine P (réduire de moitié la dose de digoxine et doser la digoxinémie ; surveiller le saignement sous dabigatran), des antivitamines K, par inhibition du CYP2C9 (réduire la dose et rapprocher les contrôles de l’INR), et de la simvastatine, par inhibition du CYP3A4 (risque de rhabdomyolyse : dose limitée ou autre statine). Ces interactions persistent des mois après l’arrêt, du fait de la demi-vie très longue. Association aux médicaments allongeant le QT à éviter, car les blocages potassiques s’additionnent et favorisent les torsades de pointes.</p>
<div class="lab">Surveillance</div><p>TSH et tests hépatiques avant puis tous les six mois ; radiographie thoracique et épreuves fonctionnelles respiratoires de référence, car ces toxicités débutent souvent sans symptôme et seule une valeur initiale permet d’attribuer une anomalie ultérieure à l’amiodarone : un infiltrat nouveau ou une baisse de la capacité de diffusion du monoxyde de carbone évoque une pneumopathie, une élévation nette des transaminases conduit à réduire la dose ou à arrêter, une TSH anormale oriente vers le type de dysthyroïdie ; ECG ; examen ophtalmologique en cas de troubles visuels. Réévaluer régulièrement la nécessité du traitement.</p>
<div class="lab">Pourquoi une dose de charge</div><p>L’amiodarone se dissout dans les graisses et se fixe massivement dans les tissus : son volume de distribution atteint plusieurs milliers de litres. L’état d’équilibre complet peut demander plusieurs mois, mais les effets thérapeutiques commencent avant cet équilibre et diffèrent entre une administration aiguë et un traitement prolongé. La charge accélère l’obtention de concentrations tissulaires efficaces ; la dose d’entretien basse limite ensuite la toxicité, qui dépend de la dose cumulée (ESC 2024, section 7.1.3). Pendant la charge, la dose quotidienne est répartie en plusieurs prises au cours des repas, parce que les nausées augmentent avec la dose prise en une fois et que les aliments améliorent une absorption lente et incomplète. Le stockage tissulaire explique aussi que l’effet et la toxicité persistent des mois après l’arrêt. Les effets initiaux intraveineux sont surtout nodaux ; les effets sur la réfractarité et la repolarisation sont plus marqués après traitement prolongé, avec une contribution du métabolite actif dont le rôle précis reste incertain. L’ESC 2024 simplifie le schéma oral : 200 mg trois fois par jour pendant 4 semaines, puis 200 mg par jour ou moins (tableaux 12 et 13).</p>
<div class="lab">Pourquoi ces toxicités</div><p>La thyroïde reçoit une charge massive en iode, à laquelle s’ajoute un effet toxique direct : 15 à 20 % des patients traités développent une <button class="w" data-k="i48-thyr">hypothyroïdie ou une hyperthyroïdie</button> (ESC 2024, section 9.10). Dans le poumon et le foie, la molécule, amphiphile, s’accumule dans les lysosomes et y bloque la dégradation des phospholipides (phospholipidose) ; une toxicité cellulaire directe et une réaction immunitaire sont aussi proposées. Ces atteintes augmentent avec la dose cumulée. Le blocage potassique allonge nettement le QT, mais les torsades restent rares : moins de 1 % dans une revue de 2 878 patients (Hohnloser et al., 1994). L’explication proposée, non démontrée, est un allongement homogène de la repolarisation dans toute l’épaisseur de la paroi, sans la dispersion qui permet la réentrée (Drew et al., 2010).</p>
<div class="lab">Ce qui change la décision</div><p>Le bilan initial de la thyroïde, du foie et du poumon sert de référence : une anomalie préexistante serait aggravée et rendrait une complication ultérieure difficile à reconnaître. En cas d’hyperthyroïdie, l’ESC 2024 n’admet l’amiodarone qu’en l’absence d’autre option, en raison du risque de thyrotoxicose (tableau 13). Elle relève aussi un signal de surmortalité sous amiodarone au long cours (section 7.2.4). Comme la toxicité s’accumule, une longue espérance de vie pèse contre un traitement prolongé et fait discuter l’ablation.</p>
<div class="lab">Source</div><p>ESC 2024 sur la FA (Van Gelder et al.), sections 7.1.3, 7.2.4 et 9.10, tableaux 12 et 13 ; Hohnloser et al., Ann Intern Med 1994;121:529-35 ; Drew et al., Circulation 2010;121:1047-60 ; Bartalena et al., Eur Thyroid J 2018;7:55-66 ; Goldschlager et al., Heart Rhythm 2007;4:1250-9 ; Goodman &amp; Gilman’s The Pharmacological Basis of Therapeutics, 14e éd., chapitre sur les antiarythmiques ; information professionnelle Cordarone (compendium.ch) ; <a href="https://www.medicines.org.uk/emc/product/3940/smpc" target="_blank" rel="noopener">résumé des caractéristiques de l’amiodarone intraveineuse, sections 4.4, 4.8 et 5.2</a> ; <a href="https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=364ab45e-b525-f310-e063-6394a90a4421" target="_blank" rel="noopener">notice officielle américaine, sections 12.1–12.3</a> (pharmacologie ; indications et posologies américaines non transposées).</p>
</template>

<template data-pop="i48-d-drone" data-title="Dronédarone">
<div class="lab">Mécanisme</div><p>Dérivé de l’amiodarone sans iode, à demi-vie plus courte : effets multicanaux, moins de toxicité thyroïdienne et pulmonaire.</p>
<div class="lab">Preuves</div><p>ATHENA : réduction des hospitalisations cardiovasculaires et des décès chez des patients en FA paroxystique ou persistante. PALLAS : surmortalité et excès d’AVC et d’insuffisance cardiaque dans la FA permanente. ANDROMEDA : surmortalité dans l’insuffisance cardiaque sévère récemment décompensée.</p>
<div class="lab">Posologie</div><p>400 mg × 2/jour, aux repas.</p>
<div class="lab">Contre-indications</div><p>FA permanente ; antécédent ou présence d’insuffisance cardiaque ou de dysfonction systolique ventriculaire gauche selon le résumé des caractéristiques de Multaq ; clairance &lt; 30 mL/min ; hépatopathie, toxicité hépatique ou pulmonaire antérieure sous amiodarone ; inhibiteurs puissants du CYP3A4, car la dronédarone est métabolisée par cette enzyme et sa concentration s’élèverait fortement, avec un risque de bradycardie et d’allongement du QT ; dabigatran, car la dronédarone inhibe la glycoprotéine P, qui limite l’absorption intestinale et favorise l’élimination rénale du dabigatran, dont la concentration augmente alors avec le risque hémorragique ; QT long. L’information professionnelle est plus restrictive que l’ESC 2024 (antécédent d’insuffisance cardiaque ou de dysfonction systolique) : se référer à compendium.ch.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques (cas d’atteinte hépatique sévère), créatinine (hausse modérée par inhibition de la sécrétion tubulaire, sans baisse réelle de la filtration), ECG, digoxinémie si association.</p>
<div class="lab">Pourquoi ces contre-indications</div><p><b>Insuffisance cardiaque sévère.</b> Dans ANDROMEDA, 627 patients hospitalisés pour une insuffisance cardiaque avec dysfonction systolique sévère ont été inclus. Après une médiane de 2 mois, la mortalité atteignait 8,1 % sous dronédarone contre 3,8 % sous placebo, surtout par aggravation de l’insuffisance cardiaque (Køber et al., 2008). Deux explications sont proposées et restent débattues : un effet inotrope négatif, et l’arrêt à tort d’un inhibiteur de l’enzyme de conversion devant la hausse de créatinine propre à la dronédarone.</p><p><b>FA permanente.</b> Quand aucun retour en rythme sinusal n’est plus recherché, un antiarythmique ne peut plus apporter de bénéfice. PALLAS a été arrêté après l’inclusion de 3 236 patients, pour un excès d’hospitalisations pour insuffisance cardiaque (43 contre 24), d’AVC (23 contre 10) et de décès cardiovasculaires (21 contre 10) (Connolly et al., 2011). Le mécanisme n’est pas établi. L’ESC 2024 proscrit donc la dronédarone pour le contrôle de la fréquence (section 7.1.1).</p><p><b>Dabigatran.</b> La dronédarone inhibe puissamment la glycoprotéine P, qui limite normalement l’absorption intestinale du dabigatran. L’exposition au dabigatran augmente alors nettement, d’où la contre-indication (<button class="w" data-k="i48-interactions">interactions par la glycoprotéine P</button>). Avec l’édoxaban, l’ESC 2024 prévoit une dose réduite à 30 mg par jour (tableau 11).</p>
<div class="lab">Ce qui change la décision</div><p>La dronédarone se réserve à la FA paroxystique ou persistante, quand le maintien du rythme sinusal reste l’objectif, sous supervision spécialisée et selon l’information professionnelle applicable. Si la FA devient permanente sous traitement, le médecin l’arrête. L’ESC 2024 l’admet dans l’insuffisance cardiaque stable à FEVG 41–49 % ou préservée (tableau de recommandations 18, classe I). Le résumé des caractéristiques de Multaq publié par Sanofi la contre-indique pourtant en cas d’antécédent ou de présence d’insuffisance cardiaque ou de dysfonction systolique : ce libellé réglementaire est plus restrictif que le groupe clinique ESC. La nomenclature ICFEr de 2026 ne permet pas de transposer mécaniquement cette recommandation à tous les patients à FEVG &lt; 50 %. Pour une prescription en Suisse, vérifier l’information professionnelle locale.</p>
<div class="lab">Source</div><p>Køber et al., N Engl J Med 2008;358:2678-87 ; Connolly et al., N Engl J Med 2011;365:2268-76 ; ESC 2024 sur la FA (Van Gelder et al.), section 7.1.1, tableau 11, tableau de recommandations 18 ; <a href="https://www.medicines.org.uk/emc/product/497/smpc" target="_blank" rel="noopener">résumé des caractéristiques de Multaq, Sanofi, sections 4.1 et 4.3–4.4</a> (version britannique) ; résumé des caractéristiques de Pradaxa (Agence européenne des médicaments) ; informations professionnelles suisses (compendium.ch).</p>
</template>

<template data-pop="i48-d-sotalol" data-title="Sotalol">
<div class="lab">Mécanisme</div><p>Bêtabloquant non sélectif doté d’une activité de classe III (blocage potassique), qui domine aux doses élevées.</p>
<div class="lab">Place</div><p>Maintien du rythme sinusal chez des patients sélectionnés, avec prudence (ESC 2024) en raison du risque proarythmique. Il n’est pas efficace pour la cardioversion.</p>
<div class="lab">Posologie</div><p>80–160 mg × 2/jour ; espacer les prises si la clairance est réduite (élimination rénale).</p>
<div class="lab">Effets indésirables</div><p>Allongement du QT et torsades de pointes, dose-dépendants, favorisés par l’hypokaliémie, l’insuffisance rénale, la bradycardie et le sexe féminin ; bradycardie ; bronchospasme.</p>
<div class="lab">Surveillance</div><p>Initiation sous surveillance ECG ; QTc &gt; 500 ms : arrêt ou réduction ; potassium, magnésium, créatinine.</p>
<div class="lab">Dépendance d’usage inverse</div><p>La repolarisation ventriculaire dépend surtout du courant potassique rectifiant retardé rapide ; elle se raccourcit normalement quand la fréquence augmente. Le sotalol bloque ce courant, mais l’allongement qu’il produit est maximal aux fréquences lentes et faible aux fréquences rapides (Hondeghem et Snyders, 1990). Pendant la FA, la fréquence auriculaire très élevée efface presque son effet sur la période réfractaire de l’oreillette : il convertit donc rarement la FA, et l’ESC 2024 ne le retient pas pour la cardioversion (tableau 13). Après le retour en rythme sinusal lent, ou lors d’une pause, le QT s’allonge au contraire fortement. C’est là que surviennent les torsades de pointes, d’autant que le blocage β ralentit le rythme sinusal.</p>
<div class="lab">Pourquoi ces facteurs de risque</div><p>L’hypokaliémie réduit le même courant potassique et potentialise son blocage (<button class="w" data-k="i48-k-torsades">potassium et repolarisation</button>). Le sotalol est éliminé inchangé par le rein : en insuffisance rénale, une dose ordinaire s’accumule. Chez la femme, le QT de base est plus long, et le risque de torsades médicamenteuses à l’hôpital est environ deux fois plus élevé. Un QTc initial élevé laisse peu de marge avant 500 ms. Avec les antiarythmiques qui bloquent ce courant, dont le sotalol, l’incidence des torsades atteint 1 à 10 % (Drew et al., 2010). Le blocage β2 bronchique explique la contre-indication dans l’asthme. Si la FEVG est ≤ 40 %, l’effet inotrope négatif s’ajoute à un risque proarythmique accru.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2024 relève un signal de surmortalité sous sotalol. Elle ne l’envisage qu’en classe IIb, chez un patient à FEVG normale ou coronarien, avec une surveillance étroite du QT, de la kaliémie et de la fonction rénale (section 7.2.4, tableau de recommandations 18). La surveillance ECG d’initiation se poursuit jusqu’à l’état d’équilibre, atteint en deux à trois jours avec un rein normal, parce que l’allongement du QT suit la concentration.</p>
<div class="lab">Source</div><p>Hondeghem, Snyders, Circulation 1990;81:686-90 ; Drew et al., Circulation 2010;121:1047-60 ; ESC 2024 sur la FA (Van Gelder et al.), section 7.2.4, tableau 13, tableau de recommandations 18 ; information professionnelle Sotalex (compendium.ch).</p>
</template>

<template data-pop="i48-d-vernak" data-title="Vernakalant">
<div class="lab">Mécanisme</div><p>Blocage préférentiel de courants potassiques propres à l’oreillette et du courant sodique, avec une dépendance à la fréquence : action surtout auriculaire.</p>
<div class="lab">Place</div><p>Cardioversion pharmacologique rapide d’une FA récente (classe I, ESC 2024), avec une conversion souvent obtenue en une dizaine de minutes.</p>
<div class="lab">Posologie</div><p>3 mg/kg en 10 minutes ; deuxième perfusion de 2 mg/kg après 15 minutes si la FA persiste.</p>
<div class="lab">Contre-indications</div><p>Pression systolique &lt; 100 mmHg, syndrome coronarien de moins de 30 jours, insuffisance cardiaque NYHA III–IV, rétrécissement aortique sévère, QT long. Le principal effet grave du vernakalant est une hypotension, plus fréquente chez l’insuffisant cardiaque ; elle est mal tolérée par un patient déjà hypotendu, par un ventricule défaillant ou en cas de rétrécissement aortique serré, qui empêche d’augmenter le débit pour compenser. Le syndrome coronarien récent et le QT long exposent à l’arythmie ventriculaire, car le vernakalant peut allonger le QT, élargir le QRS et provoquer des salves de tachycardie ventriculaire (ESC 2024, tableau 13).</p>
<div class="lab">Effets indésirables</div><p>Dysgueusie, éternuements, paresthésies ; hypotension ; bradycardie. Surveillance tensionnelle et ECG pendant au moins deux heures.</p>
<div class="lab">Disponibilité</div><p>Selon l’information professionnelle suisse (compendium.ch) et la liste hospitalière.</p>
<div class="lab">Raison des contre-indications</div><p>Le vernakalant peut provoquer une hypotension artérielle, un allongement du QT, un élargissement du QRS et une tachycardie ventriculaire non soutenue (ESC 2024, tableau 13). Chaque contre-indication désigne un terrain où l’un de ces effets devient dangereux. Une pression systolique inférieure à 100 mmHg ne laisse aucune réserve devant l’hypotension. Dans le rétrécissement aortique sévère, l’obstacle fixe le débit : une baisse des résistances ne peut pas être compensée, et la perfusion coronaire d’un ventricule hypertrophié chute. Dans l’insuffisance cardiaque, les essais ont relevé, dans les deux heures, plus d’hypotensions (13,4 % contre 4,7 % sous placebo) et plus d’arythmies ventriculaires, surtout des tachycardies ventriculaires non soutenues (6,4 % contre 1,6 %) (résumé européen des caractéristiques du produit). Un syndrome coronarien de moins d’un mois laisse un myocarde ischémique électriquement instable ; la contre-indication repose sur ce risque présumé de proarythmie. Un QT déjà long expose aux torsades si la repolarisation s’allonge encore.</p>
<div class="lab">Harmonisation des seuils</div><p>L’ESC 2024 formule la limite cardiaque de deux façons : « insuffisance cardiaque NYHA III ou IV » dans le tableau 13, « insuffisance cardiaque à fraction d’éjection réduite » dans le tableau de recommandations 17. Le résumé européen des caractéristiques du produit contre-indique les classes NYHA III et IV, déconseille le produit si la FEVG est ≤ 35 % et demande la prudence en classes I et II. Il contre-indique aussi un QT non corrigé supérieur à 440 ms, une bradycardie sévère, une dysfonction sinusale ou un bloc auriculoventriculaire du deuxième ou du troisième degré sans stimulateur, et tout antiarythmique intraveineux de classe I ou III dans les 4 heures avant ou après la perfusion. En pratique, le vernakalant est écarté si la FEVG est ≤ 40 % ou si la classe NYHA est III ou IV. Une kaliémie inférieure à 3,5 mmol/L est corrigée avant la perfusion.</p>
<div class="lab">Source</div><p>ESC 2024 sur la FA (Van Gelder et al.), tableau 13 et tableau de recommandations 17 ; résumé des caractéristiques du produit Brinavess (Agence européenne des médicaments), sections 4.3 et 4.4 ; information professionnelle suisse (compendium.ch).</p>
</template>

<template data-pop="pareto-i48-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i48-1,i48-2"></p>
<ul><li>FA : activation auriculaire désorganisée → RR irrégulièrement irréguliers, pas d’onde P. Le diagnostic repose sur un tracé ECG relu, à 12 dérivations ou à une ou plusieurs dérivations. Un ECG standard suffit si la FA occupe tout le tracé ; en ambulatoire, la durée minimale dépend du contexte et le repère de 30 secondes est un consensus.</li><li>Flutter : macroréentrée organisée ≈ 300/min ; typique = isthme cavotricuspide.</li><li>Types : première détection, paroxystique (≤ 7 j), persistante (&gt; 7 j), persistante de longue durée (≥ 12 mois), permanente (décision).</li><li>Type temporel ≠ critère d’anticoagulation.</li><li>Infraclinique = épisodes asymptomatiques détectés par un dispositif de surveillance continue, sans FA clinique documentée ; bénéfice de l’anticoagulation bien moindre.</li><li>Risque de FA au cours de la vie : 1 sur 3 à 5 après 55 ans ; Suisse (CoLaus) 0,9 %, 3,1 % après 80 ans, sous-estimé.</li><li>Complications : AVC (× 5), insuffisance cardiaque, déclin cognitif, mortalité.</li></ul></template>

<template data-pop="pareto-i48-physio" data-title="Pareto — Physiopathologie et étiologies">
<p class="ratio" data-cover="i48-3,i48-4"></p>
<ul><li>Déclencheurs (veines pulmonaires) + substrat (dilatation, fibrose) ; la FA remodèle l’oreillette → progression.</li><li>Longueur d’onde = vitesse × période réfractaire ; courte → FA.</li><li>Nœud auriculoventriculaire : filtre décrémentiel ; voie accessoire = pas de filtre → FA pré-excitée dangereuse.</li><li>Débit ↓ : perte de la systole auriculaire (grave si ventricule rigide), tachycardie ; cardiomyopathie rythmique réversible.</li><li>Thrombus dans l’auricule gauche (Virchow) ; sidération post-cardioversion → anticoagulation habituellement ≥ 4 semaines. L’ESC 2024 prévoit une exception possible sans facteur de risque thromboembolique si le rythme sinusal est rétabli dans les 24 heures suivant le début certain de la FA.</li><li>Flutter typique : anneau tricuspide, isthme, 2:1 → 150/min.</li><li>Causes : âge, hypertension, obésité, apnées, alcool, diabète, insuffisance cardiaque, valvulopathie mitrale, thyroïde, chirurgie, sepsis, sport d’endurance, ibrutinib.</li></ul></template>

<template data-pop="pareto-i48-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i48-5,i48-6"></p>
<ul><li>Dater le début (seuil de 24 h) ; calculer CHA₂DS₂-VA ; chercher les facteurs hémorragiques et les causes.</li><li>Un tiers asymptomatique ; syncope = pause, pré-excitation ou bradycardie.</li><li>Pouls irrégulier, déficit de pouls : compter à l’apex ; B1 variable ; pas d’onde a ni de B4.</li><li>Pression artérielle : mesures répétées.</li><li>Rechercher insuffisance cardiaque, rétrécissement mitral, hyperthyroïdie, embolie.</li></ul></template>

<template data-pop="pareto-i48-diag" data-title="Pareto — Diagnostic et dépistage">
<p class="ratio" data-cover="i48-7"></p>
<ul><li>FA : pas d’onde P, ondes f, RR irréguliers.</li><li>Flutter typique antihoraire : F en dents de scie négatives en II, III et aVF, positives V1 ; horaire : inverse ; atypique : autre circuit (cicatrices, oreillette gauche).</li><li>Tachycardie régulière à 150/min = flutter 2:1 jusqu’à preuve du contraire ; adénosine démasque.</li><li>Différentiels graves : FA pré-excitée, tachycardie ventriculaire.</li><li>Évaluation de routine du rythme ≥ 65 ans (I) ; dépistage populationnel prolongé ≥ 75 ans ou ≥ 65 ans avec facteurs (IIa). Alerte de montre → ECG.</li><li>Infraclinique : NOAH-AFNET 6 négatif, ARTESiA positif au prix des saignements → AOD envisageable si risque élevé (IIb).</li></ul></template>

<template data-pop="pareto-i48-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="i48-8"></p>
<ul><li>Instable (choc, œdème pulmonaire, ischémie, syncope) → cardioversion électrique synchronisée immédiate ; héparine sans retarder.</li><li>FA pré-excitée : QRS larges variables, irréguliers, &gt; 250/min → pas d’adénosine, bêtabloquant, vérapamil, diltiazem, digoxine ni amiodarone intraveineuse ; cardioversion ; puis ablation de la voie accessoire.</li><li>FA secondaire (sepsis, hypovolémie) : traiter la cause.</li><li>Complications : embolie (cérébrale, membre, mésentère), insuffisance cardiaque, pause post-conversion, hémorragie, flutter 1:1 sous classe Ic.</li></ul></template>

<template data-pop="pareto-i48-care" data-title="Pareto — Parcours et facteurs de risque">
<p class="ratio" data-cover="i48-9"></p>
<ul><li>AF-CARE : Comorbidités, Anticoagulation (éviter l’AVC), Réduire les symptômes (fréquence et rythme), Évaluer et réévaluer.</li><li>Perte de poids ≥ 10 % (I) ; alcool ≤ 3 verres standard/semaine (I) ; hypertension, diabète, insuffisance cardiaque (iSGLT2) (I) ; exercice (I) ; apnées : évaluation objective (IIb).</li><li>Chaque mesure cible le substrat.</li></ul></template>

<template data-pop="pareto-i48-anticoag" data-title="Pareto — Prévention thromboembolique">
<p class="ratio" data-cover="i48-10"></p>
<ul><li>CHA₂DS₂-VA (sans sexe) : ≥ 2 → anticoaguler (I) ; 1 → envisager (IIa). Cardiomyopathie hypertrophique et amylose : d’emblée.</li><li>Facteurs hémorragiques modifiables à corriger (I) ; score ≠ motif de refus (III). Chute ≠ contre-indication.</li><li>AOD &gt; antivitamine K (I A) ; antivitamine K si prothèse mécanique ou rétrécissement mitral modéré à sévère.</li><li>Doses : apixaban 2,5 × 2 si 2 critères sur 3 (≥ 80 ans, ≤ 60 kg, créatinine ≥ 133) ou clairance 15–29 ; rivaroxaban 15 si 15–49 ; édoxaban 30 si 15–50, ≤ 60 kg ou inhibiteur puissant de la glycoprotéine P ; dabigatran 110 × 2 si ≥ 80 ans ou vérapamil, contre-indiqué &lt; 30. Clairance de Cockcroft-Gault.</li><li>Pas d’antiplaquettaire à la place ou en plus sans indication coronaire ; après syndrome coronarien : trithérapie ≤ 1 semaine, puis AOD + clopidogrel ≤ 12 mois (6 mois si angioplastie programmée), puis AOD seul.</li><li>Fermeture de l’auricule : chirurgicale I (LAAOS III), percutanée IIb si contre-indication ; CHAMPION-AF 2026 : non-infériorité sur le critère composite décès cardiovasculaire, AVC ou embolie systémique et moins de saignements non procéduraux ; ces résultats ne prouvent pas une supériorité sur les AVC isolés.</li><li>AVC sous AOD : pas d’antiplaquettaire ajouté ; ELAN : reprise précoce sûre.</li></ul></template>

<template data-pop="pareto-i48-rate" data-title="Pareto — Contrôle de la fréquence">
<p class="ratio" data-cover="i48-11"></p>
<ul><li>Cible initiale &lt; 110/min au repos (RACE II), plus basse si symptômes.</li><li>FEVG &gt; 40 % : bêtabloquant, vérapamil/diltiazem ou digoxine. FEVG ≤ 40 % : bêtabloquant et/ou digoxine ; pas de vérapamil ni diltiazem.</li><li>Association si besoin ; amiodarone en dernier recours ; échec → ablation du nœud et stimulation (IIa).</li><li>FA rapide secondaire : traiter la cause.</li></ul></template>

<template data-pop="pareto-i48-rythme" data-title="Pareto — Contrôle du rythme">
<p class="ratio" data-cover="i48-12"></p>
<ul><li>Indiqué pour les symptômes (I) ; précoce chez des patients sélectionnés (IIa, EAST-AFNET 4).</li><li>Règle des 24 h (ESC 2024, ancien 48 h) : &gt; 24 h ou inconnue → 3 semaines d’anticoagulant ou ETO ; après : ≥ 4 semaines habituellement. Exception possible sans facteur de risque thromboembolique et retour sinusal dans les 24 h du début certain ; au long cours, décider selon le risque. L’attente d’une conversion spontanée reste une alternative (IIa).</li><li>Cardioversion médicamenteuse : cœur sain → flécaïnide, propafénone, vernakalant ; cardiopathie → amiodarone. Pilule de poche (IIa).</li><li>Maintien : cœur sain → Ic (+ freinateur), dronédarone ; coronaropathie/hypertrophie → amiodarone ou dronédarone selon l’information professionnelle ; fonction systolique altérée, y compris FEVG 41–49 % → pas de classe Ic ; FEVG ≤ 40 % → amiodarone selon ESC 2024.</li><li>Ablation : paroxystique en première ligne (I) ; persistante après échec (I) ; FEVG ≤ 40 % (I si cardiomyopathie rythmique, IIa sinon). Anticoagulation ininterrompue, ≥ 2 mois après, puis selon score.</li><li>Flutter typique : ablation de l’isthme (succès &gt; 90 %) ; même anticoagulation que la FA.</li></ul></template>

<template data-pop="pareto-i48-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i48-13,i48-14"></p>
<ul><li>Bilan initial : ECG, échocardiographie, hémogramme, créatinine, ionogramme, TSH, foie, glycémie.</li><li>Réévaluation à 6 mois puis au moins annuelle ; créatinine tous les « clairance ÷ 10 » mois si &lt; 60 ; INR : temps en zone &gt; 70 % ; amiodarone : TSH et foie tous les 6 mois.</li><li>Postopératoire : anticoagulation au long cours à envisager si risque élevé (IIa).</li><li>Grossesse : cardioversion si instable ; β1-sélectif ; héparine de bas poids moléculaire ; pas d’AOD ; pas d’amiodarone.</li><li>Hyperthyroïdie : bêtabloquant, traiter la thyroïde, anticoaguler selon score, cardioversion après euthyroïdie.</li><li>Rein : Cockcroft-Gault ; &lt; 15 mL/min ou dialyse : pas d’AOD recommandé. Foie : Child-Pugh C = pas d’AOD ; rivaroxaban dès B.</li><li>Sujet âgé : l’âge et les chutes ne contre-indiquent pas.</li></ul></template>

<template data-pop="pareto-i48-ecg" data-title="Pareto — Électrocardiogramme">
<p class="ratio" data-cover="i48-e-2"></p>
<ul><li>La référence du diagnostic est un tracé ECG interprété par un médecin. Un ECG standard de 10 secondes documente la FA si elle occupe tout le tracé. Le repère ambulatoire de 30 secondes n’est pas un seuil universel. Le tableau 31 de l’ESC 2024 ne précise pas de durée ; après une alerte de dépistage, le § 10.2 mentionne néanmoins un tracé à une dérivation ou continu de plus de 30 secondes, ou un ECG à 12 dérivations.</li><li>FA : 350–600/min, ondes f, RR irréguliers ; flutter : 250–350/min, dents de scie, RR réguliers si conduction fixe.</li><li>Ashman = aberrance, pas extrasystole. FA lente et régulière = bloc complet (digoxine ?).</li><li>Associations : TSH basse (thyrotoxicose) ; digoxinémie ↑ et K⁺ ↓ (toxicité) ; K⁺ &lt; 3,5 → corriger avant antiarythmique.</li></ul></template>

<template data-pop="pareto-i48-imag" data-title="Pareto — Enregistrements et imagerie">
<p class="ratio" data-cover="i48-e-3,i48-e-4"></p>
<ul><li>Durée d’enregistrement adaptée à la fréquence des symptômes ; après AVC sans cause : ≥ 72 h de monitorage, puis moniteur implantable.</li><li>Épisodes détectés par dispositif : vérifier l’électrogramme.</li><li>ETT chez presque tous : valvulopathie (rétrécissement mitral → antivitamine K), FEVG (choix des médicaments), oreillette gauche (&gt; 34 mL/m² = dilatée). FEVG à remesurer après contrôle de fréquence.</li><li>ETO = référence du thrombus de l’auricule ; vitesse de vidange &lt; 20 cm/s = risque.</li><li>Scanner : anatomie avant ablation ou fermeture.</li></ul></template>

<template data-pop="pareto-i48-exam" data-title="Pareto — Biologie et synthèse des examens">
<p class="ratio" data-cover="i48-e-1,i48-e-5"></p>
<ul><li>Chez tous : TSH, créatinine + clairance de Cockcroft-Gault, hémogramme, ionogramme et magnésium, foie, glycémie ou HbA1c, coagulation de base.</li><li>Dose des AOD : Cockcroft-Gault en mL/min, pas CKD-EPI.</li><li>INR 2–3, temps en zone &gt; 70 %.</li><li>INR et temps de céphaline normaux n’excluent pas un AOD ; dosage spécifique si urgence.</li><li>NT-proBNP : seuils plus élevés en FA.</li></ul>
<div class="lab">Ce que chaque examen décide</div><p>Dans le <button class="w" data-k="i48-bilan">bilan initial</button>, la TSH dépiste une thyrotoxicose curable ; la cardioversion attend alors l’euthyroïdie. La clairance de Cockcroft-Gault fixe la dose des AOD, du sotalol et de la digoxine, éliminés par le rein. L’hémogramme révèle une anémie, qui accélère la fréquence et peut signaler un saignement occulte avant l’anticoagulation. Un potassium et un magnésium normaux préviennent les torsades sous sotalol ou amiodarone et la toxicité de la digoxine. Les tests hépatiques contribuent à la classe de Child-Pugh, qui limite les AOD, et servent de référence avant l’amiodarone. La glycémie ou l’HbA1c dépiste un diabète, qui ajoute le point « D » du CHA₂DS₂-VA. La coagulation de base dépiste une coagulopathie ou un anticoagulant lupique avant le choix de la molécule.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024, section 3.4 et tableau 8. Steffel et al., guide EHRA, Europace 2021;23:1612-1676.</p>
</template>

<template data-pop="pareto-i48-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i48-sa,i48-sh,i48-sp,i48-sb,i48-sg"></p>
<ul><li>Manchons des veines pulmonaires = déclencheurs → isolation. Auricule gauche = site du thrombus → ETO, fermeture. Isthme cavotricuspide = passage obligé du flutter → ablation. Œsophage et nerf phrénique = complications de l’ablation.</li><li>Fibrose et perte des connexines 40/43 → conduction lente → réentrée ; peptide natriurétique auriculaire → polyurie.</li><li>Réentrée : obstacle, bloc unidirectionnel, conduction lente ; longueur d’onde = vitesse × réfractaire. Classe III allonge ; Ic ralentit → flutter 1:1.</li><li>Nœud : décrémentiel + conduction cachée → RR irréguliers.</li><li>Facteur Xa (apixaban, rivaroxaban, édoxaban), thrombine (dabigatran), vitamine K époxyde réductase (antivitamines K) ; glycoprotéine P et CYP3A4 → interactions.</li><li>Génétique : <i>PITX2</i> (4q25), <i>TTN</i> dans la FA précoce ; <i>VKORC1</i>, <i>CYP2C9</i> → sensibilité aux antivitamines K.</li></ul></template>

<template data-pop="pareto-i48-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i48-p-1,i48-p-2,i48-p-3,i48-p-4,i48-p-5"></p>
<ul><li>Trois objectifs distincts : anticoagulant (AVC), freinateur (fréquence), antiarythmique (rythme).</li><li>AOD : apixaban 5 × 2, rivaroxaban 20 × 1 au repas, édoxaban 60 × 1, dabigatran 150 × 2 ; oubli : rattraper ≤ 6 h (2 prises) ou ≤ 12 h (1 prise) ; pas de relais par héparine.</li><li>Antidotes : idarucizumab (dabigatran), andexanet alfa (apixaban, rivaroxaban), concentré de complexe prothrombinique ; antivitamine K : vitamine K + concentré.</li><li>Pas d’AOD : prothèse mécanique, rétrécissement mitral modéré à sévère, grossesse.</li><li>Phase aiguë : métoprolol 2,5–5 mg, diltiazem 0,25 mg/kg (FEVG &gt; 40 %), digoxine 0,5 mg intraveineux lent sur 5–10 minutes (schéma usuel ESC 2024 ; charge totale 0,75–1,5 mg/24 h, dose initiale comprise ; adaptation à l’âge, au poids maigre et à la fonction rénale), amiodarone 300 mg (attention à la cardioversion non protégée).</li><li>Ic : pas de coronaropathie ni, pour maintenir le rythme, de fonction systolique ventriculaire gauche altérée, y compris une FEVG entre 41 et 49 % ; avec un freinateur (classe IIa). CAST a établi la surmortalité après infarctus. Dronédarone : pas en FA permanente ni NYHA III–IV. Sotalol : il bloque le courant potassique et allonge le QT, d’autant plus en cas d’hypokaliémie ou d’insuffisance rénale, car il s’élimine par le rein. Amiodarone : son iode, 37 % de sa masse, dérègle la thyroïde, et son accumulation tissulaire atteint le poumon et le foie.</li><li>Interactions : les inhibiteurs de la glycoprotéine P ou du CYP3A4 (azolés, dronédarone, amiodarone, vérapamil) élèvent la concentration des AOD et de la digoxine, d’où la contre-indication de l’association dronédarone et dabigatran ; les inducteurs (rifampicine, millepertuis) l’abaissent. L’amiodarone inhibe aussi le CYP2C9 et élève l’INR sous antivitamine K. Les médicaments qui allongent le QT additionnent leurs effets.</li></ul></template>

<template data-pop="i48-d-dig" data-title="Digoxine dans la fibrillation auriculaire">
<div class="lab">Mécanisme</div><p>Inhibition de la Na⁺/K⁺-ATPase : effet inotrope positif modeste, et surtout augmentation du tonus vagal, qui ralentit la conduction dans le nœud auriculoventriculaire.</p>
<div class="lab">Place (ESC 2024)</div><p>Freinateur de première ligne quelle que soit la FEVG, seul ou associé à un bêtabloquant. Particulièrement utile en cas de FEVG altérée ou de pression artérielle basse. Moins efficace à l’effort, quand le tonus vagal s’efface.</p>
<div class="lab">Preuves</div><p>RATE-AF : chez des sujets âgés en FA permanente avec symptômes d’insuffisance cardiaque, qualité de vie comparable au bisoprolol à six mois, avec moins d’effets indésirables.</p>
<div class="lab">Posologie</div><p>Charge intraveineuse totale de 0,75 à 1,5 mg sur 24 heures, dose initiale usuelle de 0,5 mg intraveineux lent comprise, adaptée au patient, en doses fractionnées ; charge réduite en cas d’insuffisance rénale ou de faible poids ; entretien oral 0,0625 à 0,25 mg/jour selon l’âge, le poids et la fonction rénale. Concentration cible basse (&lt; 1,2 ng/mL selon l’ESC 2020 ; 0,5 à 0,9 ng/mL dans l’insuffisance cardiaque), car le ralentissement est déjà obtenu à ces valeurs, alors que des concentrations plus élevées s’associent à davantage d’effets indésirables et, dans l’analyse de l’essai DIG, à une mortalité plus élevée. Le prélèvement se fait au moins 6 heures après la prise, car pendant la phase de distribution la concentration sérique est élevée sans refléter la concentration dans le myocarde ; un prélèvement précoce ferait conclure à tort à un surdosage.</p>
<div class="lab">Digitoxine</div><p>Digitoxine : glycoside à élimination surtout hépatique, utilisable en insuffisance rénale ; demi-vie d’environ 7 jours ; l’essai DIGIT-HF (2025) l’a évaluée dans l’ICFEr : chez 1 212 patients sous traitement recommandé, elle a réduit le critère composite décès de toute cause ou première hospitalisation pour aggravation de l’insuffisance cardiaque (39,5 % contre 44,1 % sous placebo, suivi médian de 36 mois ; rapport de risques 0,82), sans effet significatif sur chaque composante prise isolément. Ce résultat porte sur l’insuffisance cardiaque, avec ou sans FA, et non sur le contrôle de la fréquence.</p>
<div class="lab">Toxicité</div><p>Favorisée par l’insuffisance rénale, l’hypokaliémie, l’hypomagnésémie, l’âge et les interactions (amiodarone, vérapamil, dronédarone, clarithromycine). Signes : nausées, troubles visuels, confusion ; arythmies (extrasystoles ventriculaires bigéminées, tachycardie atriale avec bloc, FA lente et régulière par bloc complet). Antidote : fragments d’anticorps antidigoxine.</p>
<div class="lab">Contre-indications</div><p>FA pré-excitée, car la digoxine ralentit le nœud auriculoventriculaire et peut raccourcir la période réfractaire de la voie accessoire : davantage d’influx passent par cette voie, la fréquence ventriculaire s’accélère et peut dégénérer en fibrillation ventriculaire ; bloc auriculoventriculaire de haut degré non appareillé, car l’effet vagal sur le nœud peut aggraver le bloc jusqu’à l’asystolie ; cardiomyopathie hypertrophique obstructive, car l’effet inotrope positif augmente l’obstruction de la chambre de chasse du ventricule gauche.</p>
<div class="lab">De la pompe à l’effet</div><p>La Na⁺/K⁺-ATPase maintient un sodium intracellulaire bas, et l’échangeur sodium-calcium utilise ce gradient pour expulser le calcium. Quand la digoxine bloque la pompe, le sodium s’accumule, l’échangeur expulse moins de calcium, et la contraction se renforce. Le ralentissement du nœud auriculoventriculaire passe surtout par le tonus vagal. Il s’efface donc aussi dans le sepsis ou après une chirurgie, quand le tonus adrénergique domine. L’action est en outre plus lente que celle des bêtabloquants ou des inhibiteurs calciques : la digoxine seule ne suffit pas quand il faut ralentir vite (ESC 2024, section 7.1.2).</p>
<div class="lab">Pourquoi une charge fractionnée et une concentration basse</div><p>Avec un rein normal, la demi-vie est d’environ 36 à 48 heures, et la molécule se fixe largement dans le muscle squelettique. Sans charge, l’équilibre n’est atteint qu’après environ cinq demi-vies, soit 7 à 10 jours. La charge raccourcit ce délai ; elle est fractionnée parce que l’index thérapeutique est étroit, et chaque dose partielle permet de juger la fréquence et la tolérance avant la suivante. Le bénéfice ne croît pas avec la concentration, alors que la toxicité augmente. Dans une analyse a posteriori de l’essai du Digitalis Investigation Group, chez des hommes en insuffisance cardiaque à FEVG ≤ 45 %, la mortalité brute passait de 29,9 % entre 0,5 et 0,8 ng/mL à 48,0 % à partir de 1,2 ng/mL (Rathore et al., 2003). L’ESC 2024 note que les doses basses pourraient s’associer à un meilleur pronostic (section 7.1.3). Le prélèvement attend la fin de la distribution tissulaire, sans quoi la concentration surestime l’imprégnation.</p>
<div class="lab">Pourquoi ces facteurs de toxicité</div><p>La digoxine est surtout éliminée par le rein : elle s’accumule en insuffisance rénale et chez le sujet âgé, dont la clairance et la masse musculaire sont réduites. Le potassium extracellulaire et la digoxine se disputent la fixation sur la pompe : une hypokaliémie augmente la fixation et la toxicité. Le magnésium est un cofacteur de la pompe, et son déficit potentialise l’inhibition. L’amiodarone, le vérapamil, la dronédarone et la clarithromycine inhibent la glycoprotéine P, qui élimine la digoxine par le rein et l’intestin ; avec la dronédarone, l’exposition à la digoxine augmente d’environ 2,5 fois.</p>
<div class="lab">Signature ECG de l’intoxication</div><p>En excès, la surcharge calcique déclenche des post-dépolarisations tardives, d’où les extrasystoles ventriculaires bigéminées et la tachycardie atriale. En même temps, l’effet vagal et direct sur le nœud provoque des blocs. La coexistence d’une hyperexcitabilité et d’un bloc signe l’intoxication : tachycardie atriale avec bloc, ou FA lente et régulière parce qu’un bloc auriculoventriculaire complet laisse commander un rythme jonctionnel, d’échappement ou accéléré.</p>
<div class="lab">Ce qui change la décision</div><p>Le médecin maintient une kaliémie et une magnésémie normales, réduit les doses chez le sujet âgé ou insuffisant rénal, et dose la digoxinémie en cas de doute ou d’interaction. En cas d’intoxication, il arrête la digoxine et les autres freinateurs. Il corrige une hypokaliémie avec prudence, car un apport rapide de potassium peut aggraver un bloc auriculoventriculaire. Dans une intoxication aiguë, une hyperkaliémie traduit au contraire une inhibition massive de la pompe et constitue un signe de gravité. Les fragments d’anticorps antidigoxine sont indiqués en cas d’arythmie ventriculaire, de bloc mal toléré ou d’hyperkaliémie marquée, selon les seuils de l’information professionnelle.</p>
<div class="lab">Source</div><p>ESC 2024 sur la FA (Van Gelder et al.), sections 7.1.2 et 7.1.3, tableau 12 ; Rathore et al., JAMA 2003;289:871-8 ; Ziff, Kotecha, Trends Cardiovasc Med 2016;26:585-95 ; Goodman &amp; Gilman’s The Pharmacological Basis of Therapeutics, 14e éd., chapitre sur les glycosides cardiaques ; résumé des caractéristiques du produit Multaq (Agence européenne des médicaments), interaction avec la digoxine ; informations professionnelles de la digoxine et des fragments d’anticorps antidigoxine (compendium.ch).</p>

<div class="lab">Administration intraveineuse</div><p>La dose initiale usuelle est de 0,5 mg selon le tableau 12 ESC 2024. Elle est réduite selon l’âge, le poids maigre et la fonction rénale. Le <a href="https://www.hug.ch/pharmacie/recommandations/document/adulte_admin_medic_inj" target="_blank" rel="noopener">guide adulte de la pharmacie des HUG, révision du 16 juillet 2026</a>, décrit une injection lente sur 5–10 minutes ou une perfusion sur 30–60 minutes. Ce guide hospitalier ne remplace pas l’information professionnelle de la préparation utilisée.</p>
</template>
<template data-pop="i48-interactions" data-title="Interactions des anticoagulants et des antiarythmiques : glycoprotéine P et cytochromes">
<div class="lab">Physiologie normale</div><p>La glycoprotéine P est une pompe d’efflux de la membrane apicale de l’entérocyte et du tubule rénal. Dans l’intestin, elle renvoie dans la lumière une partie du médicament absorbé ; dans le rein, elle le sécrète dans l’urine. Le CYP3A4 de l’intestin et du foie oxyde de nombreux médicaments en métabolites inactifs. Tous les AOD sont des substrats de la glycoprotéine P. Le dabigatran, absorbé à 3 à 7 % et éliminé à environ 80 % par le rein, et l’édoxaban dépendent surtout d’elle. L’apixaban et le rivaroxaban sont en outre métabolisés par le CYP3A4 (Steffel 2021). L’acénocoumarol est oxydé surtout par le CYP2C9, la phenprocoumone en partie. La digoxine s’élimine inchangée par le rein, en partie par sécrétion tubulaire via la glycoprotéine P.</p>
<div class="lab">Mécanisme</div><p><b>Inhibiteurs.</b> Le kétoconazole, l’itraconazole, le voriconazole, le posaconazole, la clarithromycine, les inhibiteurs de protéase du VIH, la ciclosporine, la dronédarone, le vérapamil et certains inhibiteurs de tyrosine kinase bloquent la pompe, le CYP3A4 ou les deux. L’AOD est mieux absorbé et moins éliminé : sa concentration monte. Le kétoconazole multiplie ainsi par environ 2,6 l’exposition au rivaroxaban ; la dronédarone multiplie par environ 2,4 celle du dabigatran et l’augmente d’environ 85 % pour l’édoxaban (informations professionnelles Xarelto, Pradaxa, Lixiana).</p><p><b>Inducteurs.</b> La rifampicine, la carbamazépine, la phénytoïne, le phénobarbital, le millepertuis, l’apalutamide et l’enzalutamide activent le récepteur pregnane X, un récepteur nucléaire qui augmente la synthèse du CYP3A4 et de la glycoprotéine P. L’effet exige de nouvelles protéines : il s’installe en environ une semaine et se dissipe en environ deux semaines après l’arrêt (Niemi 2003). La rifampicine réduit d’environ deux tiers l’exposition au dabigatran (information professionnelle Pradaxa).</p><p><b>Anti-inflammatoires non stéroïdiens.</b> Ils ne changent pas la concentration de l’AOD. Ils inhibent l’agrégation plaquettaire et les prostaglandines protectrices de la muqueuse gastrique : l’ulcère saigne sur une coagulation déjà freinée.</p><p><b>Amiodarone.</b> Elle inhibe la glycoprotéine P intestinale et rénale : la digoxinémie augmente fortement, et le ralentissement nodal des deux médicaments s’additionne. Elle inhibe aussi le CYP2C9 : l’antivitamine K s’accumule. Sa demi-vie d’élimination de 20 à 100 jours explique que ces interactions se renforcent pendant des semaines et persistent des mois après l’arrêt (information professionnelle Cordarone). Sous warfarine, l’interaction culminait vers la septième semaine, avec une baisse moyenne maximale de 44 % de la dose (Sanoski et Bauman 2002) ; ces données sont transposées aux antivitamines K utilisées en Suisse par la voie commune du CYP2C9.</p>
<div class="lab">Conséquence clinique</div><p>Un inhibiteur expose à l’hémorragie, surtout si une insuffisance rénale freine déjà l’élimination. Un inducteur abaisse la concentration sous une dose apparemment correcte ; aucun examen de routine ne le signale, et le patient s’expose à un AVC. Sous amiodarone, l’intoxication digitalique ou l’INR excessif surviennent de façon retardée, souvent après la sortie.</p>
<div class="lab">Ce qui change la décision</div><p><b>Inhibiteurs et inducteurs.</b> L’ESC 2024 indique, pour chaque AOD, les associations à éviter et celles qui imposent une baisse de dose (figure 9). La carbamazépine, la phénytoïne et la rifampicine sont à éviter avec les quatre AOD. Le kétoconazole et l’itraconazole sont à éviter avec l’apixaban, le dabigatran et le rivaroxaban ; avec l’édoxaban, ils imposent d’éviter l’association ou de réduire la dose. Le dabigatran se prescrit à 110 mg deux fois par jour avec le vérapamil ; l’édoxaban se réduit à 30 mg par jour avec la ciclosporine, la dronédarone, l’érythromycine ou le kétoconazole (ESC 2024, tableau 11). Le dabigatran est contre-indiqué avec la dronédarone (information professionnelle Pradaxa), et le rivaroxaban y est à éviter. Si un inducteur est indispensable, une antivitamine K garde l’avantage d’un effet mesurable : l’inducteur accélère aussi son élimination, mais l’INR permet d’ajuster la dose, à l’introduction comme à l’arrêt de l’inducteur.</p><p><b>Amiodarone.</b> La digoxine est réduite de moitié à l’introduction, puis la digoxinémie, la fréquence et l’ECG sont contrôlés. La dose d’antivitamine K est réduite et l’INR contrôlé chaque semaine pendant l’introduction, puis encore plusieurs mois après l’arrêt.</p><p><b>Cancer.</b> De nombreux protocoles contiennent des inhibiteurs ou des inducteurs, et la thrombopénie et la mucite aggravent le saignement. Chaque protocole se vérifie donc avec la pharmacie ou un outil d’interactions. Si l’interaction est forte, l’AOD est changé ou remplacé temporairement par une héparine de bas poids moléculaire, décision prise avec l’oncologue (ESC 2024, section 9.12 ; Lyon 2022). Les interactions se revoient à chaque nouvelle prescription, plantes et produits en vente libre compris.</p>
<div class="lab">Source</div><p>Van Gelder et al., ESC 2024 sur la FA, Eur Heart J 2024;45:3314-414 : figure 9, tableau 11, section 9.12. Steffel et al., guide pratique EHRA 2021 sur les AOD, Europace 2021;23:1612-76. Lyon et al., ESC 2022 de cardio-oncologie, Eur Heart J 2022;43:4229-361. Niemi et al., Clin Pharmacokinet 2003;42:819-50. Sanoski et al., Chest 2002;121:19-23. Informations professionnelles Xarelto, Pradaxa, Lixiana et Cordarone, compendium.ch.</p></template>
<template data-pop="i48-k-torsades" data-title="Potassium, magnésium, repolarisation et surveillance ECG sous antiarythmique">
<div class="lab">Physiologie normale</div><p>La kaliémie normale se situe entre 3,5 et 5,0 mmol/L. Le gradient de potassium fixe le potentiel de repos des cellules myocardiques. La repolarisation ventriculaire dépend surtout du courant potassique rectifiant retardé rapide, dont la conductance augmente avec le potassium extracellulaire. Sur l’ECG, le QRS mesure la durée de la dépolarisation ventriculaire, et le QT la durée totale jusqu’à la fin de la repolarisation.</p>
<div class="lab">Ce que mesure l’ECG sous antiarythmique</div><p>Le blocage sodique de la classe Ic ralentit la dépolarisation : il élargit le QRS. Le blocage potassique du sotalol, de l’amiodarone et de la dronédarone ralentit la repolarisation : il allonge le QT. Une repolarisation prolongée laisse apparaître des post-dépolarisations précoces, qui déclenchent les torsades de pointes ; l’hétérogénéité de la repolarisation entre les couches de la paroi ventriculaire leur sert de substrat. Au-delà d’un QTc de 500 ms, le risque de torsades est multiplié par deux à trois, d’après les données du syndrome du QT long congénital (Drew et al., 2010).</p>
<div class="lab">Mécanisme des troubles ioniques</div><p><b>Hypokaliémie.</b> Paradoxalement, un potassium extracellulaire bas réduit le courant potassique rectifiant retardé rapide. La repolarisation s’allonge, le QT s’allonge et des ondes U apparaissent. Les antiarythmiques de classe III bloquent ce même courant : les deux effets s’additionnent, et une bradycardie ou une pause les accentue. Avec la digoxine, un potassium bas augmente la fixation du médicament sur la pompe et sa <button class="w" data-k="i48-d-dig">toxicité</button>.</p><p><b>Hypomagnésémie.</b> Le magnésium intracellulaire freine normalement les canaux potassiques sécréteurs du néphron distal. Son déficit lève ce frein et entretient une fuite rénale de potassium : l’hypokaliémie résiste alors à la supplémentation tant que le magnésium n’est pas corrigé (Huang et Kuo, 2007).</p><p><b>Hyperkaliémie.</b> Elle dépolarise partiellement les cellules, inactive une partie des canaux sodiques et ralentit la conduction. Associée à un freinateur, elle favorise une bradycardie et un bloc.</p>
<div class="lab">Conséquence clinique</div><p>Les torsades surviennent surtout quand plusieurs facteurs se cumulent : antiarythmique bloquant le courant potassique, hypokaliémie ou hypomagnésémie souvent dues à un diurétique, bradycardie, sexe féminin, insuffisance rénale ou second médicament allongeant le QT. Elles débutent typiquement après une séquence cycle court, cycle long, cycle court. Le plus souvent, elles cessent seules, mais elles peuvent dégénérer en fibrillation ventriculaire.</p>
<div class="lab">Ce qui change la décision</div><p>Avant un antiarythmique, une cardioversion ou la digoxine, le médecin vérifie que le potassium et le magnésium sont normaux, puis les recontrôle sous diurétique. Sous traitement, il compare le QRS et le QTc à l’ECG de référence. Un QTc supérieur à 500 ms, ou allongé d’au moins 60 ms, impose de réduire ou d’arrêter le médicament et de corriger les électrolytes. En cas de torsades, il administre 2 g de sulfate de magnésium par voie intraveineuse, quelle que soit la magnésémie ; le mécanisme de cet effet reste inconnu. Il peut amener le potassium entre 4,5 et 5,0 mmol/L, une pratique peu documentée. Une torsade qui ne cesse pas ou dégénère impose un choc électrique immédiat. Les pauses qui déclenchent les torsades se préviennent si besoin par une stimulation temporaire à plus de 70/min.</p>
<div class="lab">Source</div><p>Drew et al., Prevention of torsade de pointes in hospital settings, Circulation 2010;121:1047-60 ; Roden, N Engl J Med 2004;350:1013-22 ; Huang, Kuo, J Am Soc Nephrol 2007;18:2649-52 ; ESC 2024 sur la FA (Van Gelder et al.), tableau 13 ; Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chapitres sur le potentiel de membrane et l’ECG.</p></template>
