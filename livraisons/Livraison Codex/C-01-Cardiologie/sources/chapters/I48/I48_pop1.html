<template data-pop="i48-reentree" data-title="Réentrée et longueur d’onde">
<div class="lab">Définition</div><p>Une réentrée est un influx qui, au lieu de s’éteindre après avoir activé le myocarde, revient réactiver un tissu redevenu excitable. Elle entretient une tachycardie tant que le circuit existe.</p>
<div class="lab">Trois conditions</div><p>Un obstacle, anatomique (anneau valvulaire, cicatrice) ou fonctionnel (zone réfractaire) ; un bloc unidirectionnel, indispensable parce que, si l’influx descendait les deux voies du circuit, les deux fronts se rencontreraient et s’annuleraient, alors qu’une voie bloquée dans un seul sens laisse l’influx y remonter à contre-courant ; une conduction assez lente pour que le tissu en amont ait récupéré son excitabilité au retour de l’influx.</p>
<div class="lab">Longueur d’onde</div><p>Longueur d’onde = vitesse de conduction × période réfractaire. Exemple : une conduction de 0,5 m/s et une période réfractaire de 0,15 s donnent 7,5 cm. Si le circuit disponible est plus long, la réentrée peut tourner. Une période réfractaire courte (alcool, tonus vagal, remodelage) ou une conduction lente (fibrose) raccourcissent la longueur d’onde et favorisent la FA. L’acétylcholine libérée par le vague ouvre des canaux potassiques auriculaires : le potentiel d’action se raccourcit, et inégalement, car l’innervation vagale est hétérogène. Plus la longueur d’onde est courte, plus l’oreillette loge d’ondelettes simultanées, et moins il est probable qu’elles s’éteignent toutes ensemble. Pour l’alcool, le mécanisme reste débattu.</p>
<div class="lab">Macroréentrée et FA</div><p><b>Flutter</b> : un seul grand circuit stable autour d’un obstacle anatomique. <b>FA</b> : de multiples ondelettes et, selon une hypothèse encore débattue, des rotors instables, qui changent sans cesse de trajet. La différence se lit sur l’ECG : le circuit fixe du flutter produit des ondes F régulières et une réponse ventriculaire souvent régulière, alors que les fronts changeants de la FA atteignent le nœud de façon désordonnée et donnent des RR irréguliers.</p>
<div class="lab">Corrélation thérapeutique</div><p>Les antiarythmiques de classe III bloquent des courants potassiques de repolarisation : le potentiel d’action s’allonge, donc la période réfractaire et la longueur d’onde. Lorsque la longueur d’onde dépasse la longueur du circuit disponible, le front qui revient trouve un tissu encore réfractaire et s’éteint. Le même allongement de la repolarisation ventriculaire allonge le QT et expose aux torsades de pointes, d’où la surveillance ECG à l’instauration. L’ablation coupe un passage obligé (isthme cavotricuspide) ou isole les foyers déclencheurs. Le circuit du flutter typique emprunte toujours l’isthme : une ligne de bloc à cet endroit l’interrompt durablement, avec un succès supérieur à 90 %. La FA n’a pas de passage obligé : l’ablation vise surtout ses déclencheurs veineux pulmonaires, d’où des résultats moins complets, surtout quand le substrat auriculaire est avancé.</p>
<div class="lab">Classe III : pourquoi la FA s’éteint</div><p>Selon l’hypothèse des ondelettes multiples de Moe, la FA persiste tant qu’un nombre suffisant d’ondelettes coexiste ; chez le chien, Allessie et al. ont estimé ce seuil à quatre à six. Chaque ondelette occupe au moins une longueur d’onde de tissu. Si la période réfractaire passe de 0,15 à 0,20 s avec une conduction inchangée de 0,5 m/s, la longueur d’onde passe de 7,5 à 10 cm. Moins d’ondelettes tiennent alors dans l’oreillette. Sous le seuil critique, elles s’éteignent ensemble, et aucune ne réamorce l’arythmie.</p>
<div class="lab">Classe Ic : un paradoxe apparent</div><p>La flécaïnide et la propafénone bloquent le courant sodique rapide et ralentissent la conduction. D’après la formule, elles devraient raccourcir la longueur d’onde et favoriser la FA. Pourtant, la flécaïnide orale rétablit le rythme sinusal d’une FA récente dans 50 à 60 % des cas à 3 heures (ESC 2024, tableau 13). La formule simple n’explique donc pas leur action.</p>
<div class="lab">Blocage dépendant de l’usage</div><p>La classe Ic se fixe sur le canal sodique ouvert ou inactivé, puis s’en détache lentement pendant la diastole. Aux fréquences très rapides de la FA, la diastole est trop courte pour libérer les canaux : le blocage s’accumule d’un battement à l’autre. Moins de canaux restent disponibles, et l’excitabilité baisse. La cellule reste en outre inexcitable après sa repolarisation complète, tant que ses canaux restent bloqués : c’est la réfractarité post-repolarisation. Chez le chien, la flécaïnide allonge ainsi la période réfractaire d’autant plus que la fréquence est rapide, ce qui augmente la longueur d’onde pendant la FA (Wang, Page et Nattel, 1992).</p>
<div class="lab">Effet sur les rotors : un mécanisme débattu</div><p>Un rotor est une onde spirale qui tourne autour d’un cœur de tissu non activé. Dans le modèle mathématique de Kneller et al., la baisse d’excitabilité élargit ce cœur ; le rotor devient instable, dérive et s’éteint sur un obstacle, orifice veineux ou anneau valvulaire. Ce mécanisme repose surtout sur la modélisation et l’expérimentation animale. Il n’a pas été démontré par cartographie chez l’homme, et le rôle des rotors dans la FA humaine reste lui-même discuté.</p>
<div class="lab">Conséquence pratique</div><p>En ralentissant la conduction, la classe Ic peut aussi organiser la FA en un flutter lent, que le nœud auriculoventriculaire conduit alors en 1:1 (voir « Flutter 1:1 induit par les antiarythmiques de classe Ic »). L’ESC 2024 recommande donc d’envisager un bêtabloquant, du diltiazem ou du vérapamil chez tout patient traité par flécaïnide ou propafénone (tableau de recommandations 18, classe IIa, niveau C).</p>
<div class="lab">Source complémentaire</div><p>ESC 2024, tableau 13 et tableau de recommandations 18. Moe. Arch Int Pharmacodyn Ther 1962;140:183-8. Allessie et al. In : Zipes et al. (dir.). Cardiac Electrophysiology and Arrhythmias. Grune &amp; Stratton, 1985:265-75. Wang et al. Circ Res 1992;71:271-87. Kneller et al. Circ Res 2005;96:e35-47. Comtois et al. Europace 2005;7 Suppl 2:10-20. Zipes et al. Cardiac Electrophysiology: From Cell to Bedside, 8e éd., chapitre sur les antiarythmiques.</p>
</template>

<template data-pop="i48-noeudav" data-title="Conduction décrémentielle et conduction cachée">
<div class="lab">Conduction décrémentielle</div><p>Plus les influx arrivent tôt au nœud auriculoventriculaire, plus leur conduction est lente. Les cellules nodales dépendent de courants calciques, qui récupèrent lentement. Cette propriété protège les ventricules des fréquences auriculaires élevées.</p>
<div class="lab">Conduction cachée</div><p>Un influx auriculaire peut pénétrer partiellement le nœud, s’y éteindre et le laisser réfractaire. Il n’apparaît pas sur l’ECG, mais il retarde ou bloque l’influx suivant. Ce phénomène, répété au hasard, crée l’irrégularité des intervalles RR.</p>
<div class="lab">Modulation</div><p>Le sympathique accélère la conduction nodale, le tonus vagal la ralentit. D’où une fréquence plus rapide à l’effort, dans la fièvre, l’hyperthyroïdie ou l’anémie : ces situations augmentent les besoins en oxygène ou abaissent le contenu artériel en oxygène, et le débit cardiaque se compense par une activation sympathique, que les hormones thyroïdiennes potentialisent. D’où aussi la faible efficacité de la digoxine à l’effort : elle ralentit le nœud surtout en renforçant le tonus vagal, qui s’efface à l’effort. Devant une fréquence mal contrôlée, on traite d’abord la cause, puis on préfère ou on associe un bêtabloquant.</p>
<div class="lab">Voie accessoire</div><p>Faite de myocarde ordinaire, elle ne décrémente pas dans la grande majorité des cas : sa dépolarisation repose sur des canaux sodiques rapides, qui redeviennent disponibles dès la fin de la repolarisation, alors que les courants calciques du nœud récupèrent lentement. Privée de ce filtre, elle peut conduire plus de 250 influx par minute vers les ventricules. C’est le mécanisme de la <button class="w" data-k="i48-preexc">FA pré-excitée</button>.</p>
<div class="lab">Irrégularité</div><p>En rythme sinusal, chaque onde P atteint le nœud au même moment du cycle et le trouve dans le même état de récupération : les RR sont réguliers. En FA, 350 à 600 ondes f par minute arrivent au nœud à des instants aléatoires. Chacune, conduite ou bloquée, y laisse une réfractarité dont la durée dépend de son instant d’arrivée. Le délai avant le QRS suivant dépend donc de toute la séquence d’ondes f qui le précède, séquence qui ne se répète jamais : le rythme est irrégulièrement irrégulier.</p>
<div class="lab">RR réguliers en FA : un signal d’alarme</div><p>Une conduction aléatoire ne peut pas produire un rythme ventriculaire régulier. Des RR devenus réguliers signifient que les oreillettes ne commandent plus les ventricules ; ils ne prouvent pas un bon contrôle de la fréquence. La première cause est un bloc auriculoventriculaire complet : un foyer d’échappement prend le relais à sa fréquence propre, de 40 à 60/min s’il est jonctionnel, de 15 à 40/min s’il est ventriculaire. Le premier suspect est l’intoxication digitalique. La digoxine renforce l’effet vagal jusqu’au bloc et, par la surcharge calcique qu’elle provoque, accroît l’automatisme jonctionnel. Un surdosage en bêtabloquant ou en inhibiteur calcique peut y contribuer. La seconde cause est une organisation en flutter, dont les ondes régulières sont conduites selon un rapport fixe. Le médecin cherche alors des ondes de flutter sur l’ECG à 12 dérivations, dose la digoxinémie et la kaliémie sous digitalique, et revoit les freinateurs au lieu de les augmenter.</p>
<div class="lab">Situations qui accélèrent</div><p>La fréquence ventriculaire dépend du nombre d’ondes f que le nœud laisse passer, donc de sa période réfractaire. À l’effort et dans la fièvre, la noradrénaline stimule les récepteurs β1 nodaux. L’adénosine monophosphate cyclique s’élève et augmente le courant calcique de type L, dont dépend le potentiel d’action nodal : la conduction s’accélère et la récupération devient plus précoce. Le retrait vagal diminue en même temps l’acétylcholine, qui ouvre des canaux potassiques, hyperpolarise les cellules nodales et prolonge leur réfractarité. Dans l’anémie, la baisse du contenu artériel en oxygène impose une hausse du débit cardiaque, à laquelle participe une activation sympathique. Dans l’hyperthyroïdie, la T3 augmente l’expression des récepteurs β1 cardiaques, donc la sensibilité aux catécholamines (Klein et Danzi, 2007). Les doses habituelles de freinateurs ne suffisent alors plus.</p>
<div class="lab">Ce qui change la décision</div><p>Dans le sepsis, l’hypovolémie ou l’anémie, la tachycardie soutient un débit dont l’organisme a besoin. Augmenter seulement les freinateurs expose alors à l’hypotension et laisse la cause en place. L’ESC 2024 demande de rechercher et de traiter la cause avant le contrôle aigu de la fréquence, ou en même temps ; elle cite le sepsis, la surcharge volémique et le choc cardiogénique (section 7.1.2). Le même raisonnement s’applique à l’anémie et à la thyrotoxicose. Une fréquence qui s’emballe chez un patient jusque-là bien contrôlé fait d’abord chercher ces causes.</p>
<div class="lab">Source complémentaire</div><p>Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chap. 10 (fréquences propres du nœud auriculoventriculaire et des fibres de Purkinje, régulation sympathique et vagale). Zipes et al. Cardiac Electrophysiology: From Cell to Bedside, 8e éd., chapitre sur le nœud auriculoventriculaire. Klein et al. Thyroid disease and the heart. Circulation 2007;116:1725-35. ESC 2024, section 7.1.2.</p>
</template>

<template data-pop="i48-virchow" data-title="Triade de Virchow dans l’auricule gauche">
<div class="lab">Stase</div><p>L’oreillette fibrillante ne se vide plus ; dans l’auricule, cul-de-sac trabéculé, la vitesse du sang chute. À l’ETO, cela se traduit par une vitesse de vidange basse et un contraste spontané en « fumée ». Ce contraste correspond à des hématies qui s’agrègent en rouleaux sous l’effet du fibrinogène lorsque le flux est lent ; il précède souvent le thrombus. Une vitesse de vidange de l’auricule inférieure à 20 cm/s environ signale une stase marquée et un risque accru de thrombus et d’embolie.</p>
<div class="lab">Lésion endothéliale</div><p>L’endocarde auriculaire normal empêche la coagulation : il produit du monoxyde d’azote, qui inhibe l’adhésion plaquettaire, et exprime la thrombomoduline, qui active la protéine C. Dans l’oreillette dilatée et fibrosée, l’étirement, l’inflammation et le flux lent réduisent ces défenses et augmentent l’expression du facteur tissulaire et du facteur de von Willebrand, qui amorcent la coagulation et fixent les plaquettes.</p>
<div class="lab">Hypercoagulabilité</div><p>En FA, le facteur de von Willebrand, le fibrinogène et les marqueurs d’activation plaquettaire et inflammatoire s’élèvent : ils traduisent la lésion endothéliale, l’inflammation auriculaire et l’activation de la coagulation par la stase. Ces dosages n’ont pas d’usage clinique courant. Le thrombus formé en flux lent est surtout fait de fibrine et d’hématies : c’est pourquoi l’anticoagulation le prévient, alors qu’un antiplaquettaire seul n’est pas recommandé pour prévenir l’AVC (classe III).</p>
<div class="lab">Conséquences</div><p>Thrombus de l’auricule, embolie cérébrale ou systémique. Le risque dépend <button class="w" data-k="i48-cha">surtout du terrain</button> (âge, hypertension, diabète, insuffisance cardiaque, antécédent embolique), ce qui explique la logique du score CHA₂DS₂-VA.</p>
<div class="lab">L’auricule</div><p>L’auricule gauche est un diverticule étroit, souvent multilobé, tapissé de muscles pectinés qui délimitent des récessus profonds. En rythme sinusal, sa contraction active chasse le sang de ces récessus à chaque cycle. En FA, le corps de l’oreillette reste traversé par le flux qui va des veines pulmonaires à la valve mitrale, mais l’auricule, sans sortie, n’est plus vidangé : la stase y est maximale. À l’ETO, une vitesse de vidange inférieure ou égale à 20 cm/s s’associait à un risque thromboembolique accru, indépendamment du contraste spontané et du thrombus (Zabalgoitia et coll., 1998). Dans une revue de 23 études, 91 % des thrombi de l’oreillette gauche siégeaient dans l’auricule ou en partaient en cas de FA non rhumatismale, contre 57 % en cas de FA rhumatismale (Blackshear et Odell, 1996). Dans le rétrécissement mitral, en effet, l’obstacle ralentit le flux dans toute l’oreillette, et le thrombus peut se former ailleurs.</p>
<div class="lab">Conséquence pour la fermeture</div><p>Fermer l’auricule supprime le site principal de formation des thrombi, mais pas tous. Environ un thrombus sur dix naît ailleurs dans l’oreillette. Une partie des embolies vient d’une autre source, comme une plaque aortique complexe. Le dispositif percutané peut lui-même porter un thrombus, dans 1,7 à 7,2 % des cas (ESC 2024, section 6.5). La fermeture chirurgicale est donc recommandée en complément de l’anticoagulation, et non à sa place (ESC 2024, section 6.6).</p>
<div class="lab">Source complémentaire</div><p>Blackshear et al., <i>Ann Thorac Surg</i> 1996;61:755-9. Zabalgoitia et coll., <i>J Am Coll Cardiol</i> 1998;31:1622-6. ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414), sections 6.5 et 6.6.</p>
</template>

<template data-pop="i48-vp" data-title="Manchons myocardiques des veines pulmonaires">
<p>Extensions du myocarde de l’oreillette gauche dans la paroi des veines pulmonaires, sur 1 à 3 cm.</p>
<div class="lab">Propriétés</div><p>Orientation des fibres hétérogène, période réfractaire courte, <button class="w" data-k="i48-vp">activité automatique et déclenchée</button>. Elles produisent des salves d’extrasystoles qui déclenchent la FA.</p>
<div class="lab">Découverte</div><p>Haïssaguerre et coll., <i>New England Journal of Medicine</i>, 1998 : la majorité des foyers de FA paroxystique siègent dans les veines pulmonaires.</p>
<div class="lab">Application</div><p>L’isolation électrique circonférentielle de chaque veine pulmonaire empêche ces foyers d’atteindre l’oreillette : c’est le geste de base de toute ablation de FA.</p>
<div class="lab">Du foyer à la FA</div><p>En diastole normale, la pompe calcique du réticulum sarcoplasmique recapte le calcium, et les récepteurs à la ryanodine restent fermés. Une fréquence élevée, les catécholamines ou l’étirement surchargent le réticulum : ces récepteurs laissent alors fuir du calcium en diastole. L’échangeur sodium-calcium l’expulse en faisant entrer trois ions sodium pour un ion calcium, soit une charge positive nette par cycle. Ce courant entrant crée une post-dépolarisation tardive qui, au seuil, déclenche une extrasystole. Chaque extrasystole recharge la cellule en calcium, et les extrasystoles s’enchaînent en salves (Nattel et Dobrev, 2016). La période réfractaire des manchons est courte : chez des patients en FA paroxystique, elle mesurait 185 ms contre 253 ms dans l’oreillette gauche (Jaïs et coll., 2002). Le foyer peut donc décharger très vite sans se bloquer lui-même. Ses faisceaux changent brusquement de direction, ce qui ralentit la conduction et crée des blocs locaux propices à une microréentrée. Une extrasystole à couplage court atteint enfin une oreillette encore partiellement réfractaire : le front se fragmente en ondelettes, qui persistent si la longueur d’onde est courte et l’oreillette grande. Le poids relatif de l’automatisme, de l’activité déclenchée et de la microréentrée reste débattu ; les trois coexistent probablement.</p>
<div class="lab">Pourquoi isoler plutôt que freiner</div><p>L’isolation crée autour de chaque ostium une cicatrice transmurale. Quel que soit le mécanisme local, les salves du foyer n’atteignent plus l’oreillette tant que la cicatrice reste continue. Un antiarythmique ne supprime pas le foyer : il diminue l’excitabilité de tout le myocarde, de façon réversible, dépendante de la dose et au prix d’une toxicité. Il ne réduit les récidives que de 20 à 50 % (ESC 2024, section 7.2.4). Dans un essai randomisé de 303 patients en FA paroxystique jamais traitée, une arythmie auriculaire récidivait à un an chez 42,9 % des patients après cryoablation, contre 67,8 % sous antiarythmique, avec autant d’événements graves (Andrade et coll., 2021). L’ESC 2024 place donc l’ablation en première ligne dans la FA paroxystique (classe I, niveau A). Les récidives après ablation tiennent surtout à une reconnexion, quand le tissu d’une lacune de la cicatrice n’était que sidéré par l’œdème (Ouyang et coll., 2005). Elles tiennent aussi à un substrat situé hors des veines, plus fréquent dans la FA persistante, où la stratégie optimale n’est pas établie (ESC 2024, section 7.2.5).</p>
<div class="lab">Source complémentaire</div><p>Jaïs et coll., <i>Circulation</i> 2002;106:2479-85. Nattel et al., <i>Nat Rev Cardiol</i> 2016;13:575-90. Andrade et coll., <i>N Engl Med</i> 2021;384:305-15. Ouyang et coll., <i>Circulation</i> 2005;111:127-35. ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414), sections 7.2.4 et 7.2.5, tableau de recommandations 19.</p>
</template>

<template data-pop="i48-remod" data-title="Remodelage auriculaire : « la FA engendre la FA »">
<div class="lab">Remodelage électrique (heures à jours)</div><p>La fréquence auriculaire très élevée surcharge les myocytes en calcium. En réponse, le courant calcique de type L diminue, ce qui protège la cellule d’une surcharge calcique, et certains courants potassiques augmentent : le plateau du potentiel d’action et la période réfractaire se raccourcissent. La longueur d’onde diminue, davantage d’ondelettes trouvent place dans l’oreillette, et chaque accès se prolonge plus facilement. Démontré chez la chèvre par Wijffels et Allessie en 1995 : une FA entretenue par stimulation raccourcissait la période réfractaire auriculaire dès les premières 24 heures, et les accès induits, d’abord brefs, devenaient soutenus en quelques semaines. Plus la FA dure, plus elle se maintient facilement.</p>
<div class="lab">Remodelage structural (semaines à mois)</div><p>L’oreillette se dilate, ce qui offre plus de surface aux ondelettes. Le collagène interstitiel sépare les faisceaux de myocytes et les jonctions communicantes (connexines) se raréfient : l’influx passe d’une cellule à l’autre plus lentement et en zigzag, avec des blocs locaux qui fragmentent le front et favorisent la réentrée. Ce remodelage est en grande partie irréversible, car le collagène déposé et les myocytes perdus ne se reconstituent pas ; il crée un substrat situé hors des veines pulmonaires.</p>
<div class="lab">Conséquences cliniques</div><p>Progression de la forme paroxystique vers la forme persistante ; efficacité moindre de la cardioversion, des antiarythmiques et de l’ablation dans les formes anciennes, parce que la fibrose entretient la FA hors des veines pulmonaires, là où l’isolation n’agit pas ; argument pour un contrôle du rythme précoce. Dans l’essai EAST-AFNET 4 (2 789 patients à risque cardiovasculaire, FA diagnostiquée depuis un an au plus), un contrôle du rythme précoce, surtout médicamenteux, a réduit le critère composite de décès cardiovasculaire, d’AVC et d’hospitalisation pour insuffisance cardiaque ou syndrome coronarien aigu : 3,9 contre 5,0 événements pour 100 patients-années. L’ESC 2024 en tire une classe IIa pour un contrôle du rythme dans les 12 mois suivant le diagnostic chez des patients sélectionnés.</p>
<div class="lab">Fibrose : pourquoi la conduction ralentit et se fragmente</div><p>Dans l’oreillette saine, les myocytes sont reliés bout à bout et latéralement par des jonctions communicantes, formées de connexines 40 et 43. Le front d’onde progresse ainsi de façon rapide et homogène. Dans la fibrose, des cloisons de collagène, qui ne conduisent pas, séparent de petits groupes de fibres. L’influx doit les contourner par les rares ponts cellulaires restants : il suit un trajet en zigzag. Spach et Dolber ont décrit ce trajet dans le muscle auriculaire humain âgé ; la vitesse de conduction transversale effective y tombe au-dessous de 0,08 m/s. Une réentrée devient alors possible dans une très petite région, faite de cellules électriquement normales. Là où un faisceau étroit débouche sur une masse plus large, son courant ne suffit pas toujours à dépolariser le tissu d’aval : l’influx passe dans un sens et s’arrête dans l’autre. Ces blocs unidirectionnels brisent le front d’onde en ondelettes.</p>
<div class="lab">De la conduction lente au maintien de la FA</div><p>La conduction lente raccourcit la longueur d’onde, comme le raccourcissement de la période réfractaire dû au remodelage électrique. Leurs effets s’additionnent : davantage d’ondelettes tiennent dans l’oreillette, les blocs leur fournissent des obstacles, et leur extinction simultanée devient improbable. La FA se maintient.</p>
<div class="lab">Hypothèse débattue : le couplage fibroblaste-myocyte</div><p>Le fibroblaste a un potentiel de repos moins négatif que le myocyte. S’il lui est couplé par des jonctions communicantes, il pourrait le dépolariser partiellement, inactiver une partie de ses canaux sodiques et ralentir encore la conduction. Ce couplage est démontré en culture et dans des modèles expérimentaux ; son rôle dans l’oreillette humaine n’est pas établi (Burstein et Nattel, 2008).</p>
<div class="lab">Réversibilité : électrique d’abord, structural ensuite</div><p>Le remodelage électrique repose sur l’expression des canaux ioniques ; chez la chèvre, il régresse en quelques jours après le retour en rythme sinusal (Wijffels et al., 1995). La fibrose remplace le tissu conducteur par une matrice stable et régresse peu. Sa part augmente avec la durée de l’arythmie et le poids des facteurs de risque (Nattel et Harada, 2014). Les antiarythmiques agissent sur les canaux et l’ablation isole surtout les veines pulmonaires : aucun ne supprime une fibrose constituée. Le délai d’un an n’est pas une frontière biologique, mais le critère d’inclusion de l’essai EAST-AFNET 4.</p>
<div class="lab">EAST-AFNET 4 et décision</div><p>L’essai a inclus 2 789 patients, diagnostiqués depuis 36 jours en médiane, âgés de plus de 75 ans ou porteurs d’une affection cardiovasculaire. Plus de 50 % étaient en rythme sinusal et 30 % asymptomatiques à l’inclusion ; 80 % du bras précoce ont reçu un antiarythmique (ESC 2024, section 7.2.1). Le bénéfice s’est payé d’événements graves liés au traitement du rythme plus fréquents, 4,9 % contre 1,4 % (Kirchhof et al., 2020). L’explication proposée, un rythme sinusal maintenu avant que la fibrose ne s’installe, reste une hypothèse : l’essai ne mesurait pas la fibrose. L’ESC 2024 recommande d’envisager un contrôle du rythme dans les 12 mois suivant le diagnostic chez des patients sélectionnés à risque thromboembolique (tableau de recommandations 15, classe IIa, niveau B). Le traitement des facteurs de risque vise la même cible (voir « Remodelage inverse »).</p>
<div class="lab">Source complémentaire</div><p>Spach et al. Circ Res 1986;58:356-71. Burstein et al. J Am Coll Cardiol 2008;51:802-9. Nattel et al. J Am Coll Cardiol 2014;63:2335-45. Wijffels et al. Circulation 1995;92:1954-68. Kirchhof et al. (EAST-AFNET 4). N Engl Med 2020;383:1305-16. ESC 2024, section 7.2.1 et tableau de recommandations 15.</p>
</template>

<template data-pop="i48-kick" data-title="Contribution auriculaire au remplissage">
<div class="lab">Physiologie</div><p>Le remplissage ventriculaire gauche se fait surtout en protodiastole, passivement. En fin de diastole, la contraction auriculaire ajoute un volume supplémentaire (onde A du flux mitral), qui représente classiquement de l’ordre de 15 à 30 % du remplissage selon l’âge et la compliance ventriculaire.</p>
<div class="lab">Quand elle compte le plus</div><p>Ventricule rigide : hypertrophie, sujet âgé, rétrécissement aortique, cardiomyopathie hypertrophique, amylose. La relaxation lente réduit le remplissage passif, et la systole auriculaire devient indispensable.</p>
<div class="lab">Corrélation clinique</div><p>Un patient avec une cardiomyopathie hypertrophique ou un rétrécissement aortique serré peut décompenser brutalement à l’installation d’une FA. La perte de la systole auriculaire s’ajoute au raccourcissement de la diastole par la tachycardie : le remplissage, le volume d’éjection et la pression artérielle chutent, et la pression auriculaire monte jusqu’à l’œdème pulmonaire. L’hypotension et la diastole courte réduisent aussi la perfusion sous-endocardique du ventricule hypertrophié, d’où une ischémie. Ralentir la fréquence allonge la diastole mais ne rend pas la contraction auriculaire : chez ce patient, le retour rapide en rythme sinusal est souvent prioritaire.</p>
<div class="lab">Fréquence, irrégularité et débit</div><p>Quand la fréquence augmente, la diastole se raccourcit beaucoup plus que la systole. Selon Guyton &amp; Hall, la systole occupe environ 40 % du cycle à 72/min et 65 % au triple de cette fréquence : la diastole passe d’environ 0,50 à 0,10 seconde. Le volume télédiastolique baisse, donc le volume d’éjection selon la loi de Frank-Starling ; au-delà d’une fréquence critique, le débit chute. La diastole courte réduit aussi la perfusion du sous-endocarde, comprimé pendant la systole, alors que la tachycardie augmente la consommation d’oxygène. L’irrégularité ajoute une perte propre, car le remplissage est rapide en début de diastole puis plafonne : un cycle court fait perdre beaucoup de volume, un cycle long en ajoute peu. Clark et al. l’ont mesuré chez 16 patients après ablation du nœud auriculoventriculaire. À la même fréquence moyenne de 102/min, une stimulation reproduisant la séquence irrégulière de leur FA abaissait le débit de 5,2 à 4,4 L/min et élevait la pression capillaire pulmonaire bloquée de 14 à 17 mmHg, par rapport à une stimulation régulière.</p>
<div class="lab">De la diastole courte à la congestion</div><p>Pour remplir le ventricule malgré une diastole courte et sans contraction auriculaire, la pression de l’oreillette gauche doit monter. Aucune valve ne la sépare des capillaires pulmonaires, dont la pression vaut normalement environ 7 mmHg. Un œdème notable apparaît quand cette pression dépasse la pression oncotique du plasma, d’environ 28 mmHg (Guyton &amp; Hall). Le liquide gagne l’interstitium, ce qui raidit le poumon et cause la dyspnée, puis les alvéoles. En décubitus, le retour du sang des membres inférieurs élève encore cette pression : c’est l’orthopnée. À l’inverse, une fréquence trop basse sous freinateur empêche l’accélération qui porte une grande part de la hausse du débit à l’effort : le patient se plaint de fatigue.</p>
<div class="lab">Ventricule rigide : mécanisme de la décompensation</div><p>La relation pression-volume d’un ventricule hypertrophié est raide : une petite perte de remplissage coûte beaucoup de volume d’éjection, et tout remplissage supplémentaire exige une forte hausse de la pression auriculaire. Dans le rétrécissement aortique serré, l’orifice fixe empêche en outre de compenser par une baisse des résistances. La pression artérielle chute, avec un risque de syncope ; la perfusion coronaire baisse alors que le myocarde hypertrophié consomme davantage d’oxygène ; l’œdème pulmonaire s’installe.</p>
<div class="lab">Ce qui change la décision</div><p>Ralentir allonge la diastole, améliore le remplissage, abaisse la pression auriculaire et rétablit la perfusion coronaire : les symptômes s’atténuent. L’ESC 2024 retient une cible initiale de fréquence de repos inférieure à 110/min, plus stricte si les symptômes persistent (tableau de recommandations 14, classe IIa, niveau B). Le ralentissement ne rend ni la contraction auriculaire ni la régularité des cycles : si les symptômes persistent, ou si un ventricule rigide reste congestif, le retour en rythme sinusal se discute. Une instabilité hémodynamique aiguë ou qui s’aggrave impose une cardioversion électrique (tableau de recommandations 15, classe I, niveau C). Le rétrécissement aortique serré décompensé en est la situation type ; après stabilisation, l’indication valvulaire est réévaluée, car un rétrécissement serré symptomatique relève d’une intervention (recommandations européennes 2021 sur les valvulopathies, classe I).</p>
<div class="lab">Source complémentaire</div><p>Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chap. 9 (cycle cardiaque, loi de Frank-Starling), chap. 21 (circulation coronaire) et chap. 39 (œdème pulmonaire). Clark et al. J Am Coll Cardiol 1997;30:1039-45. ESC 2024, sections 7.1.1 et 7.2.1, tableaux de recommandations 14 et 15. Vahanian et al. Eur Heart 2022;43:561-632.</p>
</template>

<template data-pop="i48-types" data-title="Types temporels et trajectoire de la FA">
<div class="lab">Classification ESC 2024</div><p>Première détection ; paroxystique (≤ 7 jours : arrêt spontané ou après intervention ; la plupart des accès spontanément résolutifs durent moins de 48 heures) ; persistante (&gt; 7 jours : accès qui ne cessent pas spontanément ; ce seuil vient surtout des essais thérapeutiques) ; persistante de longue durée (≥ 12 mois, si contrôle du rythme envisagé) ; permanente (décision partagée entre le patient et le médecin de ne plus tenter le rythme sinusal). « Permanente » désigne donc une stratégie et non une propriété du rythme : si l’on décide de tenter à nouveau le rythme sinusal, la FA est reclassée en persistante de longue durée.</p>
<div class="lab">Trajectoire</div><p>La FA est une maladie évolutive. Une part des patients progresse chaque année d’une forme paroxystique à une forme persistante : environ 15 % en un an dans l’Euro Heart Survey. La progression est d’autant plus fréquente que les facteurs de risque sont nombreux et non traités, car l’hypertension, l’obésité, l’alcool et les apnées entretiennent la dilatation, la fibrose et l’inflammation de l’oreillette, auxquelles chaque accès ajoute son propre remodelage. À l’inverse, la perte de poids et l’abstinence alcoolique peuvent faire régresser la charge arythmique, en réduisant la pression et la taille de l’oreillette, la graisse épicardique et l’inflammation.</p>
<div class="lab">Charge arythmique</div><p>Pourcentage du temps passé en FA, mesuré par un enregistrement prolongé ou un dispositif. Elle précise ce que le type temporel résume grossièrement. Le risque thromboembolique augmente avec elle : dans une cohorte californienne de patients en FA paroxystique non anticoagulés, le tiers dont la charge atteignait au moins 11,4 % avait un risque environ trois fois plus élevé que les deux autres tiers. Elle sert aussi à juger un traitement du rythme : après ablation, elle est mesurée comme critère de jugement, au-delà de la simple présence ou absence de récidive.</p>
<div class="lab">Piège</div><p>Le type temporel guide le contrôle du rythme ; il ne guide pas l’anticoagulation. Une FA paroxystique chez un patient à score élevé justifie l’anticoagulation au même titre qu’une FA permanente. Le risque est porté surtout par le terrain : dans une méta-analyse de près de 100 000 patients, la FA non paroxystique n’augmentait le risque thromboembolique que d’environ 1,4 fois par rapport à la forme paroxystique. Les accès sont en outre souvent asymptomatiques et imprévisibles ; l’ESC 2024 tient la FA pour un facteur de risque majeur, qu’elle soit paroxystique, persistante ou permanente.</p></template>

<template data-pop="i48-infraclin" data-title="FA infraclinique détectée par un dispositif">
<div class="lab">Définitions</div><p><b>Épisodes auriculaires rapides</b> : tachyarythmies auriculaires enregistrées par un dispositif implanté (selon l’ESC 2024 : fréquence auriculaire d’au moins 170/min, durant généralement plus de 5 minutes ; chaque épisode est inspecté visuellement, car certains sont des artéfacts). <b>FA infraclinique détectée par un dispositif</b> (terme ESC 2024) : ces épisodes, vérifiés sur l’électrogramme, sans FA documentée sur un ECG de surface.</p>
<div class="lab">Risque</div><p>Le risque d’AVC est réel mais plus faible que dans la FA clinique : de l’ordre de 1 % par an dans les essais récents, moins que ce qu’on attendrait d’une FA clinique à profil de risque comparable. La raison probable est une charge faible : les épisodes duraient en médiane 1,5 à 2,8 heures dans ces essais. Les épisodes longs, au-delà de 24 heures, s’en rapprochent, et une partie des patients développe ensuite une FA clinique, à raison de 6 à 9 % par an.</p>
<div class="lab">Essais</div><p><b>NOAH-AFNET 6</b> (édoxaban contre placebo, 2 536 patients) : interrompu pour futilité et pour raison de sécurité ; pas de réduction du critère décès cardiovasculaire, AVC ou embolie, davantage de décès ou d’hémorragies majeures. <b>ARTESiA</b> (apixaban contre acide acétylsalicylique, 4 012 patients) : AVC ou embolie systémique 0,78 contre 1,24 % par an ; hémorragies majeures 1,71 contre 0,94 % par an. Le bénéfice absolu est faible parce que le risque de base est bas : environ cinq AVC ou embolies évités pour mille patients traités pendant un an, contre environ huit hémorragies majeures supplémentaires.</p>
<div class="lab">Conduite (ESC 2024)</div><p>Un AOD peut être envisagé chez les patients à risque thromboembolique élevé, en excluant ceux à haut risque hémorragique (classe IIb, niveau B). Surveiller l’apparition d’une FA clinique, par l’interrogation régulière du dispositif et un ECG devant des symptômes. Une FA documentée sur un ECG relève des essais qui ont prouvé le bénéfice de l’anticoagulation : elle fait basculer vers les règles habituelles, avec une anticoagulation recommandée dès un score CHA₂DS₂-VA de 2. Traiter les facteurs de risque dans tous les cas : ils entretiennent le substrat qui fait passer à une FA clinique, et ils augmentent par eux-mêmes le risque d’AVC et d’insuffisance cardiaque.</p>
<div class="lab">Pourquoi le risque est plus faible : la charge arythmique</div><p>Le thrombus auriculaire naît de la stase pendant l’arythmie ; le risque croît donc avec le temps passé en FA, appelé charge arythmique. Cette charge était faible dans les deux essais : les épisodes duraient en médiane 1,5 heure dans ARTESiA et 2,8 heures dans NOAH-AFNET 6. Le taux de thromboembolie y était d’environ 1 % par patient-année, inférieur à celui attendu dans une FA clinique de score CHA₂DS₂-VASc égal à 4 (ESC 2024, section 6.2.3). La charge à partir de laquelle le risque d’AVC devient réel reste inconnue (ESC 2024, section 10.3).</p>
<div class="lab">Marqueur ou cause ? Une question débattue</div><p>Si les épisodes brefs causaient directement l’embolie, l’AVC surviendrait pendant un épisode ou peu après. Brambatti et al. ont vérifié cette chronologie chez 2 580 porteurs de stimulateur ou de défibrillateur, âgés d’au moins 65 ans et hypertendus. Sur 51 patients victimes d’un AVC ou d’une embolie systémique, 26 avaient eu des épisodes de plus de 6 minutes. Seuls 4 en avaient eu dans les 30 jours précédents, et un seul était en arythmie au moment de l’événement. Ces épisodes pourraient donc signaler une cardiomyopathie auriculaire, thrombogène même en rythme sinusal, plutôt que provoquer l’embolie. D’autres mécanismes d’AVC, athérome ou maladie des petites artères cérébrales, coexistent aussi chez ces patients âgés. Cette interprétation reste débattue.</p>
<div class="lab">Pourquoi le bénéfice net est faible</div><p>Le bénéfice absolu d’un anticoagulant est proportionnel au risque embolique de départ. Dans ARTESiA, l’apixaban a réduit les AVC et embolies systémiques de 1,24 % à 0,78 % par patient-année par rapport à l’acide acétylsalicylique : environ un événement évité pour 200 patients traités pendant un an. Le risque hémorragique, lui, ne dépend pas de la charge, car l’anticoagulant agit chaque jour, que l’oreillette fibrille ou non. Les hémorragies majeures sont passées de 0,94 % à 1,71 % par patient-année, un excès du même ordre que le gain. Dans NOAH-AFNET 6, l’incidence des AVC restait d’environ 1 % par patient-année dans les deux groupes, et l’édoxaban a augmenté le critère « décès ou hémorragie majeure » de 4,5 % à 5,9 % par patient-année.</p>
<div class="lab">Ce qui change la décision</div><p>Le gain ne l’emporte que si le risque thromboembolique est élevé et si aucun facteur hémorragique majeur ne l’annule. La surveillance compte autant que le choix initial, car ces patients développent une FA clinique à raison de 6 à 9 % par an (ESC 2024, section 6.2.3). Dès qu’un ECG la documente, le patient rejoint la population des grands essais d’anticoagulation, où le bénéfice est établi.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024, sections 6.2.3 et 10.3. Healey et al. Apixaban for stroke prevention in subclinical atrial fibrillation (ARTESiA). N Engl Med 2024;390:107-17. Kirchhof et al. Anticoagulation with edoxaban in patients with atrial high-rate episodes (NOAH-AFNET 6). N Engl Med 2023;389:1167-79. Brambatti et al. Temporal relationship between subclinical atrial fibrillation and embolic events. Circulation 2014;129:2094-9.</p>
</template>

<template data-pop="i48-ehra" data-title="Score EHRA modifié des symptômes">
<p><b>1</b> — Aucun symptôme.<br><b>2a</b> — Symptômes légers : activité quotidienne normale, patient non gêné.<br><b>2b</b> — Symptômes modérés : activité quotidienne normale, patient gêné.<br><b>3</b> — Symptômes sévères : activité quotidienne altérée.<br><b>4</b> — Symptômes invalidants : activité quotidienne impossible.</p>
<div class="lab">Usage</div><p>Documenter le retentissement avant et après un contrôle du rythme. Un score 2b ou plus plaide pour une stratégie de rythme, parce que son bénéfice principal démontré est la réduction des symptômes et l’amélioration de la qualité de vie : un patient qui n’est pas gêné en tire peu et s’expose quand même aux effets indésirables des antiarythmiques et aux complications de l’ablation. Exception : une FA récente chez un patient à risque cardiovasculaire peut justifier un contrôle précoce du rythme même peu symptomatique, d’après l’essai EAST-AFNET 4. L’ESC 2024 encourage aussi les questionnaires de qualité de vie.</p>
<div class="lab">Limite</div><p>Évaluation subjective ; la fatigue attribuée à la FA peut avoir une autre cause : anémie, qui réduit le transport d’oxygène ; dépression ; bêtabloquant, qui limite l’accélération de la fréquence à l’effort. Dans une FA persistante, en cas de doute, une cardioversion électrique à visée diagnostique est à envisager (classe IIa) : si les symptômes disparaissent en rythme sinusal, ils relevaient de la FA.</p></template>

<template data-pop="i48-colaus" data-title="Étude CoLaus et données suisses">
<div class="lab">Plan</div><p>Cohorte populationnelle lausannoise. Analyse de la FA : 4 616 participants de 45 à 86 ans, examinés de 2014 à 2017 avec un ECG à 12 dérivations.</p>
<div class="lab">Résultats</div><p>Prévalence de la FA 0,9 % ; 1,1 % en incluant le flutter ; 3,1 % après 80 ans (4,7 % avec le flutter), car le substrat auriculaire s’accumule avec l’âge : fibrose, dilatation et exposition prolongée à l’hypertension. Le risque de FA au cours de la vie atteint ainsi environ un sur trois chez les sujets âgés, ce qui justifie de vérifier le rythme lors de toute consultation dès 65 ans (classe I). Nette prédominance masculine parmi les cas. Elle tient probablement en partie à la taille corporelle : des oreillettes plus grandes offrent davantage de surface aux circuits de réentrée, et la grande taille figure parmi les facteurs associés à la FA.</p>
<div class="lab">Limite</div><p>Un ECG unique ne détecte pas la FA paroxystique en dehors des accès : la prévalence réelle est plus élevée.</p>
<div class="lab">Swiss-AF</div><p>Cohorte nationale prospective de 2 415 patients en FA recrutés dans 14 centres suisses (recrutement de 2014 à 2017), centrée sur les lésions cérébrales, la cognition et la qualité de vie. Chez 1 737 patients examinés par IRM cérébrale, dont 90 % étaient anticoagulés, 22 % avaient de grands infarctus corticaux ou sous-corticaux ; parmi les patients sans antécédent d’AVC, 15 % avaient un tel infarctus resté silencieux. Ces lésions s’associaient à de moins bons scores cognitifs : la FA peut altérer la cognition sans AVC clinique. Leur mécanisme, embolique ou lié à la baisse du débit cérébral, reste discuté.</p></template>

<template data-pop="i48-pirates" data-title="PIRATES : causes de FA à passer en revue">
<p><b>P</b> — Pulmonaire : embolie pulmonaire, BPCO, pneumonie, hypertension pulmonaire. Ces affections dilatent l’oreillette droite par surcharge de pression ; l’hypoxémie, les catécholamines et les bêta-2-mimétiques favorisent les extrasystoles déclenchantes. Devant une FA récente avec dyspnée inexpliquée, on recherche une embolie pulmonaire.<br><b>I</b> — Ischémie myocardique : la FA survient surtout lors d’un infarctus étendu, avec dysfonction ventriculaire gauche ou atteinte du ventricule droit, parce que la pression auriculaire s’élève ; l’ischémie auriculaire directe est rare. Une FA isolée n’est presque jamais d’origine coronaire, et une élévation modérée de la troponine pendant un accès rapide traduit souvent un déséquilibre entre apport et besoin en oxygène plutôt qu’une occlusion coronaire.<br><b>R</b> — Rhumatismale : valvulopathie mitrale, et plus largement toute valvulopathie. Le rétrécissement mitral impose à l’oreillette gauche une surcharge en pression, l’insuffisance mitrale une surcharge en volume : l’oreillette se dilate et se fibrose. D’où l’échocardiographie systématique ; un rétrécissement mitral modéré à sévère impose l’antivitamine K.<br><b>A</b> — Anémie, âge avancé, dilatation auriculaire de toute cause. L’anémie impose une augmentation du débit cardiaque et du tonus sympathique, qui favorise les accès et accélère la réponse ventriculaire ; l’âge et la dilatation agissent par la fibrose et l’augmentation de la surface auriculaire. L’hémogramme fait partie du bilan initial, aussi parce qu’une anémie augmente le risque hémorragique sous anticoagulant.<br><b>T</b> — <button class="w" data-k="i48-thyr">Thyroïde : hyperthyroïdie</button>.<br><b>E</b> — Éthanol : alcool aigu ou chronique. Le mécanisme reste discuté : l’excès aigu associe probablement une décharge adrénergique, des variations du tonus vagal et des troubles électrolytiques ; la consommation chronique dilate et fibrose l’oreillette. L’effet est en partie réversible : chez des buveurs réguliers, l’abstinence a réduit les récidives à six mois de 73 % à 53 %. L’ESC 2024 recommande au plus 3 verres standard par semaine (classe I).<br><b>S</b> — Sepsis, apnées du sommeil (<i>Sleep apnoea</i>), chirurgie (<i>Surgery</i>). Le sepsis et la chirurgie déclenchent la FA par l’inflammation, les catécholamines endogènes ou administrées et les déplacements de volume et d’électrolytes ; l’incidence de la FA augmente avec le degré d’inflammation. Après un sepsis, la FA récidive chez un tiers à la moitié des patients et semble porter le même risque thromboembolique qu’une FA primitive : l’anticoagulation se décide selon les règles habituelles.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique anglo-saxon, non critère officiel. Il ne remplace pas la recherche structurée des facteurs de risque du pilier « C » : <button class="w" data-k="i48-substrat">hypertension, obésité, diabète et sédentarité</button>, qui sont les plus fréquents.</p></template>

<template data-pop="i48-saos" data-title="Apnées obstructives du sommeil et FA">
<div class="lab">Mécanismes</div><p>Pendant l’apnée, le patient inspire contre un pharynx fermé : la pression intrathoracique chute fortement, ce qui étire la paroi auriculaire et active des canaux ioniques sensibles à l’étirement. L’hypoxémie et l’hypercapnie modifient la réfractarité et ralentissent la conduction auriculaire, d’après des données surtout expérimentales. La décharge vagale de l’apnée raccourcit la période réfractaire, puis la décharge sympathique du réveil déclenche des extrasystoles ; répétées chaque nuit, ces agressions dilatent et fibrosent l’oreillette.</p>
<div class="lab">Dépistage</div><p>Le ronflement traduit la vibration d’un pharynx rétréci, et les pauses respiratoires constatées par l’entourage sa fermeture complète. Les micro-éveils qui terminent chaque apnée fragmentent le sommeil, d’où la somnolence diurne. L’obésité et un tour de cou élevé rétrécissent le pharynx par des dépôts graisseux, et les décharges sympathiques nocturnes répétées entretiennent une hypertension résistante. Les questionnaires sont peu fiables chez les patients en FA, car la somnolence diurne, sur laquelle ils reposent en grande partie, prédit mal les apnées modérées à sévères ; utilisés seuls, ils sont déconseillés (classe III) ; l’ESC 2024 préfère une évaluation objective (polygraphie ventilatoire ou polysomnographie) lorsque l’on recherche des apnées.</p>
<div class="lab">Traitement</div><p>La ventilation en pression positive continue maintient le pharynx ouvert pendant le sommeil : elle supprime les efforts inspiratoires contre voies fermées, donc l’étirement auriculaire, les désaturations et les décharges autonomes. La réduction pondérale diminue les dépôts graisseux qui rétrécissent le pharynx et réduit ainsi le nombre d’apnées. L’effet sur les récidives de FA est suggéré par des études observationnelles, mais les essais randomisés sont peu nombreux : d’où une classe IIb dans l’ESC 2024.</p>
<div class="lab">De l’apnée à l’accès de FA</div><p>Pendant une apnée obstructive, le patient inspire contre un pharynx fermé. La pression intrathoracique devient très négative : la pression transmurale des oreillettes augmente et leur paroi s’étire. L’hypoxémie et l’alternance de décharges vagales pendant l’apnée et sympathiques au réveil raccourcissent la période réfractaire auriculaire, ce qui favorise les réentrées. Répétées chaque nuit pendant des années, ces agressions aboutissent à un remodelage structurel et à une conduction auriculaire ralentie.</p>
<div class="lab">Quand la rechercher</div><p>Il peut être raisonnable de rechercher des apnées lorsqu’un contrôle du rythme est envisagé, car des apnées non traitées s’associent, dans des études observationnelles, à davantage de récidives après cardioversion ou ablation (ESC 2024, section 5.5). La somnolence diurne prédit mal les apnées modérées à sévères. C’est pourquoi l’ESC 2024 déconseille le dépistage par questionnaire seul (tableau de recommandations 5, classe III, niveau B).</p>
<div class="lab">Ce que le résultat change</div><p>Les petits essais randomisés divergent : l’un a montré une régression du remodelage auriculaire sous ventilation en pression positive continue, d’autres n’ont pas amélioré le résultat de l’ablation ou de la cardioversion. Le traitement des apnées s’intègre donc à la prise en charge globale des facteurs de risque, sans garantie d’effet sur la FA. Il ne modifie ni l’indication de l’anticoagulation, fondée sur le risque thromboembolique, ni celle du contrôle du rythme.</p>
<div class="lab">Source complémentaire</div><p>Linz et al., revue sur les apnées obstructives et la FA, JAMA Cardiol 2018;3:532-40 ; ESC 2024 (Van Gelder et al., Eur Heart 2024;45:3314-414), section 5.5 et tableau de recommandations 5.</p>
</template>

<template data-pop="i48-poids" data-title="Perte de poids et FA">
<div class="lab">Données</div><p>Des études australiennes (programmes structurés de réduction pondérale et de gestion des facteurs de risque) ont montré qu’une perte de poids d’au moins 10 % s’accompagnait d’une forte réduction de la charge de FA et des récidives, y compris après ablation : dans une cohorte australienne de 355 patients obèses suivis cinq ans, la survie sans arythmie était six fois plus probable qu’avec une perte moindre. La perte de poids réduit la pression et la taille de l’oreillette, la graisse épicardique, la pression artérielle, l’inflammation et les apnées. Une perte de poids fluctuante atténuait le bénéfice : une fluctuation de plus de 5 % doublait le risque de récidive. Le mécanisme est mal établi ; la reprise de poids ramène probablement la surcharge de pression, la graisse épicardique et l’inflammation. L’objectif est donc une perte durable, sans reprise.</p>
<div class="lab">Recommandation (ESC 2024)</div><p>Perte de poids recommandée chez le patient en surpoids ou obèse, avec une cible d’au moins 10 % du poids corporel (classe I, niveau B).</p>
<div class="lab">Moyens</div><p>Programme diététique et d’activité physique encadré ; traitements médicamenteux de l’obésité, en particulier les agonistes du récepteur du peptide apparenté au glucagon de type 1 comme le sémaglutide, qui permettent une perte d’environ 15 % en un peu plus d’un an et atteignent donc la cible de 10 % ; chirurgie bariatrique, que l’ESC 2024 permet d’envisager avec les mesures d’hygiène de vie lorsque l’indice de masse corporelle atteint 40 kg/m² (ou 35 kg/m² avec complications) et qu’un contrôle du rythme est prévu (classe IIb). Leurs effets propres sur la FA restent peu étudiés ; leur prescription suit les indications et les limitations de remboursement propres à l’obésité.</p>
<div class="lab">Exemple</div><p>Patient de 110 kg : l’objectif est au moins 99 kg. Le suivi du poids fait partie de chaque consultation de FA.</p></template>

<template data-pop="i48-tachycm" data-title="Cardiomyopathie rythmique induite par la FA">
<div class="lab">Définition</div><p>Dysfonction ventriculaire gauche causée, entièrement ou en partie, par une fréquence ventriculaire rapide et prolongée, ou par l’irrégularité du rythme.</p>
<div class="lab">Mécanismes</div><p>Une fréquence élevée et prolongée augmente la consommation d’oxygène du myocarde tout en raccourcissant la diastole, pendant laquelle le sous-endocarde est perfusé : il en résulte un déficit énergétique et une ischémie sous-endocardique relative. Le réticulum sarcoplasmique capte et libère moins bien le calcium, et la force de contraction baisse. L’irrégularité ajoute des cycles courts à faible volume d’éjection, et la perte de la systole auriculaire réduit le remplissage. Ces anomalies touchent la fonction des cellules plus que leur nombre, ce qui explique leur réversibilité.</p>
<div class="lab">Diagnostic</div><p>Rétrospectif : la FEVG remonte nettement, souvent en quelques semaines à quelques mois, après contrôle de la fréquence ou restauration du rythme sinusal. Une IRM sans cicatrice ni fibrose ventriculaire rend l’hypothèse plus probable : un rehaussement tardif signe une fibrose ou une cicatrice, donc une maladie propre du myocarde qui récupère mal. Dans l’essai randomisé de Prabhu et coll. (2017), la FEVG s’est normalisée après ablation chez 73 % des patients sans rehaussement tardif, contre 29 % de ceux qui en avaient.</p>
<div class="lab">Conséquences</div><p>L’ablation de la FA est recommandée lorsque cette cardiomyopathie est très probable (classe I, ESC 2024), car le seul ralentissement laisse persister l’irrégularité et la perte de la systole auriculaire, qui suffisent à déprimer le ventricule. Dans le même essai, chez des patients en FA persistante avec une FEVG ≤ 45 % inexpliquée et une fréquence déjà contrôlée, la FEVG a gagné 18 points après ablation contre 4,4 points sous contrôle de la fréquence. Ne pas poser d’indication de défibrillateur avant d’avoir contrôlé l’arythmie et réévalué la FEVG : l’indication de prévention primaire suppose une FEVG ≤ 35 % persistant après au moins trois mois de traitement optimal, et la FEVG peut encore remonter. Une récidive de la FA peut faire rechuter rapidement la FEVG, car des anomalies ultrastructurales persistent malgré la normalisation de la fonction ; le rythme se surveille donc au long cours.</p>
<div class="lab">Pourquoi la dysfonction est réversible</div><p>La tachycardie épuise l’énergie des cardiomyocytes et perturbe leur cycle du calcium, mais elle tue peu de cellules et crée peu de fibrose. Les cellules restent viables : quand la fréquence redevient normale, leur contraction se rétablit. Un infarctus laisse au contraire une cicatrice qui ne se contracte plus. La cardiomyopathie rythmique doit être évoquée quand la fréquence moyenne dépasse 100/min. Le retour en rythme sinusal ajoute au ralentissement la contraction auriculaire et la régularité des cycles. Des anomalies structurelles discrètes peuvent persister après récupération, ce qui expliquerait les rechutes rapides.</p>
<div class="lab">Médicaments en attendant</div><p>Le vérapamil et le diltiazem dépriment la contraction : ils sont contre-indiqués si la FEVG est ≤ 40 % (ESC 2024, tableau 12). La flécaïnide et la propafénone sont exclues en cas de fonction systolique altérée, car elles favorisent les arythmies ventriculaires sur un ventricule malade (tableau de recommandations 18). La fréquence se contrôle donc par un bêtabloquant, la digoxine ou leur association (tableau de recommandations 14, classe I, niveau B), et le rythme par l’amiodarone ou la cardioversion. Une cible plus stricte que la cible souple (moins de 110/min) peut se justifier quand cette cardiomyopathie est suspectée (section 7.1.1).</p>
<div class="lab">Preuves de l’ablation</div><p>Chez des patients à FEVG ≤ 35 % porteurs d’un défibrillateur, l’ablation a réduit le critère combiné décès ou hospitalisation pour insuffisance cardiaque, de 44,6 % à 28,5 % en un suivi médian de 38 mois. Dans l’insuffisance cardiaque terminale, elle a réduit le critère combiné décès, assistance ventriculaire gauche ou transplantation urgente, de 30 % à 8 % en 18 mois. Ces essais fondent la classe IIa, niveau B, chez des patients sélectionnés à FEVG réduite (tableau de recommandations 19). Le seuil de FEVG qui indique un défibrillateur en prévention primaire suppose une dysfonction fixe ; une FEVG qui remonte retire cette indication.</p>
<div class="lab">Source complémentaire</div><p>Huizar et al., J Am Coll Cardiol 2019;73:2328-44 ; Marrouche et al., N Engl Med 2018;378:417-27 ; Sohns et al., N Engl Med 2023;389:1380-9 ; ESC 2024 (Van Gelder et al., Eur Heart 2024;45:3314-414), section 7.1.1, tableau 12, tableaux de recommandations 14, 18 et 19.</p>
</template>
<template data-pop="i48-cardiopathies" data-title="Cardiopathies qui favorisent la FA">
<div class="lab">Physiologie normale et mécanisme commun</div><p>Pendant la diastole, la valve mitrale ouverte transmet la pression de remplissage ventriculaire à l’oreillette gauche, dont la paroi mince se laisse étirer. Les cardiopathies étirent, enflamment ou infiltrent l’oreillette. L’étirement aigu raccourcit la période réfractaire auriculaire ; dans le cœur isolé de lapin, ce raccourcissement suffit à rendre la FA inductible, de façon réversible (Ravelli et Allessie 1997). L’étirement prolongé active l’angiotensine II et l’aldostérone, qui entretiennent une fibrose interstitielle. Cette fibrose ralentit et fragmente la conduction et crée le substrat des réentrées. L’ESC 2024 nomme ce résultat cardiomyopathie auriculaire (tableau 6).</p>
<div class="lab">Insuffisance cardiaque, quelle que soit la FEVG</div><p>Que la FEVG soit réduite ou préservée, la pression de remplissage élevée se transmet à l’oreillette, qui s’étire puis se fibrose ; l’activation neurohormonale ajoute fibrose et extrasystoles. La FA aggrave en retour l’insuffisance cardiaque : dans la cohorte de Framingham, 57 % des patients ayant une insuffisance cardiaque nouvelle avaient une FA (ESC 2024, section 5.2).</p>
<div class="lab">Valvulopathies mitrales</div><p>Dans le rétrécissement mitral, l’oreillette doit créer un gradient pour vider son sang à travers un orifice étroit : sa pression monte, elle se dilate et se fibrose. En FA, le sang stagne en amont de l’obstacle et le thrombus est fréquent. Un rétrécissement modéré à sévère impose donc une antivitamine K ; les AOD y sont à éviter, car un essai chez 4 531 patients avec cardiopathie rhumatismale a montré plus d’événements sous rivaroxaban (ESC 2024, section 6.2). L’insuffisance mitrale impose une surcharge de volume à l’oreillette ; elle relève d’un AOD selon le score CHA₂DS₂-VA.</p>
<div class="lab">Cardiopathie ischémique</div><p>Elle favorise la FA surtout indirectement : la dysfonction ventriculaire et l’insuffisance mitrale ischémique élèvent la pression auriculaire. Le rôle d’une ischémie auriculaire directe reste discuté. Une FA rapide peut à l’inverse élever modestement la troponine sans syndrome coronarien, car elle raccourcit la diastole, temps de perfusion du myocarde.</p>
<div class="lab">Cardiomyopathie hypertrophique et amylose cardiaque</div><p>Le ventricule hypertrophié se relâche mal ; l’obstruction de la chambre de chasse et l’insuffisance mitrale par mouvement systolique antérieur élèvent encore la pression auriculaire. Dans l’amylose, les fibrilles infiltrent aussi les parois auriculaires : l’oreillette peut perdre sa contraction même en rythme sinusal. Des thrombi intracardiaques existaient dans un tiers des cœurs amyloïdes à l’autopsie (Feng 2007). Dans ces deux ventricules rigides, la perte de la contraction auriculaire est mal tolérée. L’anticoagulation y est recommandée quel que soit le score CHA₂DS₂-VA (ESC 2024, tableau de recommandations 6, classe I, niveau B). Le thrombus persiste parfois malgré une anticoagulation efficace : une imagerie doit être envisagée avant une ablation (section 7.2.6).</p>
<div class="lab">Communication interauriculaire et péricardite</div><p>Le shunt gauche-droite impose pendant des décennies une surcharge de volume à l’oreillette droite, d’où le flutter autant que la FA. La fermeture avant la quatrième décennie diminue ce risque (ESC 2024, section 9.9). L’épicarde enflammé est accolé au myocarde auriculaire mince : l’inflammation diffuse à la paroi et favorise l’automatisme anormal et les réentrées. La péricardite et la myocardite figurent parmi les déclencheurs aigus (ESC 2024, tableau 14).</p>
<div class="lab">Ce qui change la décision</div><p>Toute FA nouvelle justifie une ETT, car ces cardiopathies changent l’anticoagulation et le choix de l’antiarythmique. Une dysfonction systolique ventriculaire gauche ou une maladie coronarienne excluent la flécaïnide et la propafénone (ESC 2024, tableau de recommandations 18). Plus l’oreillette est dilatée et fibrosée, moins le rythme sinusal se maintient : la cardiopathie se traite avec la FA.</p>
<div class="lab">Source</div><p>Van Gelder et al., ESC 2024 sur la FA, Eur Heart 2024;45:3314-414 : tableau 6, sections 5.2, 6.2, 7.2.6, 9.9, tableau 14, tableaux de recommandations 6 et 18. Arbelo et al., ESC 2023 sur les cardiomyopathies, Eur Heart 2023;44:3503-626. Ravelli et al., Circulation 1997;96:1686-95. Feng et al., Circulation 2007;116:2420-6. Braunwald’s Heart Disease, 12e éd.</p></template>
<template data-pop="i48-causes-aigues" data-title="FA déclenchée par une cause aiguë ou une substance">
<div class="lab">Physiologie normale</div><p>Une FA exige un déclencheur, le plus souvent des extrasystoles nées dans les veines pulmonaires, et un substrat qui entretient des réentrées, d’autant plus que la période réfractaire est courte et la conduction lente. La stimulation β1 augmente l’adénosine monophosphate cyclique et le calcium intracellulaire ; l’excès de calcium produit des post-dépolarisations, donc des extrasystoles.</p>
<div class="lab">Mécanisme</div><p><b>Chirurgie, cardiaque surtout.</b> L’inflammation péricardique, la décharge adrénergique et les variations volémiques s’additionnent. La FA touche 30 à 50 % des opérés du cœur (ESC 2024, section 9.6).</p><p><b>Sepsis et pneumonie.</b> Les cytokines altèrent le couplage électrique et la gestion du calcium ; les catécholamines endogènes ou perfusées et l’hypoxémie s’y ajoutent. La FA touche 9 à 20 % des patients en sepsis, et son incidence suit le degré d’inflammation (ESC 2024, section 9.5).</p><p><b>Embolie pulmonaire.</b> La surcharge de pression du ventricule droit dilate l’oreillette droite ; l’étirement raccourcit sa période réfractaire.</p><p><b>Hyperthyroïdie.</b> La T3 en excès raccourcit la période réfractaire auriculaire et sensibilise le cœur aux catécholamines ; le détail figure sous « FA et hyperthyroïdie, y compris sous amiodarone ».</p><p><b>Intoxication alcoolique aiguë.</b> L’éthanol et l’acétaldéhyde ralentissent la conduction auriculaire ; un déséquilibre vagal et adrénergique raccourcit la période réfractaire et multiplie les extrasystoles (Voskoboinik 2016).</p><p><b>Hypokaliémie.</b> Une kaliémie basse réduit paradoxalement le courant potassique qui stabilise le potentiel de repos et ceux de la repolarisation : celle-ci s’allonge et devient hétérogène. L’inhibition de la pompe sodium-potassium surcharge la cellule en calcium : l’automatisme et l’activité déclenchée augmentent (Weiss 2017). Le même mécanisme expose aux torsades de pointes sous un médicament qui allonge le QT.</p><p><b>Myocardite.</b> L’œdème, l’infiltrat puis la fibrose du myocarde auriculaire fragmentent la conduction.</p><p><b>Substances.</b> Les sympathomimétiques stimulent les récepteurs adrénergiques ; la cocaïne bloque la recapture de la noradrénaline et les amphétamines en provoquent la libération. La théophylline bloque les récepteurs de l’adénosine et inhibe les phosphodiestérases : l’adénosine monophosphate cyclique s’accumule comme sous stimulation β1. Une corticothérapie d’au moins 7,5 mg d’équivalent prednisone par jour s’associait à une FA nouvelle avec un rapport de cotes de 6,07 dans la cohorte de Rotterdam (van der Hooft 2006) ; le mécanisme, peut-être hydroélectrolytique, reste débattu.</p><p><b>Ibrutinib.</b> La FA ne vient pas de sa cible. Chez la souris, l’ibrutinib provoque une FA, une inflammation et une fibrose auriculaires, même sans tyrosine kinase de Bruton ; l’acalabrutinib, plus sélectif, ne le fait pas. La cause est l’inhibition hors cible de la C-terminal Src kinase des cardiomyocytes (Xiao 2020). L’ibrutinib altère aussi l’agrégation plaquettaire induite par le collagène et l’adhésion au facteur de von Willebrand (Levade 2014).</p>
<div class="lab">Conséquence clinique</div><p>Le rythme sinusal revient spontanément chez jusqu’à 83 % des patients dans les 48 heures qui suivent le traitement de la cause (ESC 2024, section 9.1). Ce retour n’est pas une guérison. La FA déclenchée par un sepsis récidive chez un tiers à la moitié des patients, et la FA déclenchée semble porter le même risque thromboembolique que la FA primaire (ESC 2024, section 9.5).</p>
<div class="lab">Ce qui change la décision</div><p>Le premier geste traite le sepsis, l’hypoxémie, la kaliémie, la volémie ou l’hyperthyroïdie, et arrête la substance en cause. Une anticoagulation au long cours doit être envisagée chez les patients à risque thromboembolique élevé, une fois la cause corrigée (ESC 2024, tableau de recommandations 25, classe IIa, niveau C). Aucun essai randomisé n’a étudié cette population. Sous ibrutinib, le risque plaquettaire, la thrombopénie de l’hémopathie et d’éventuelles interactions pharmacocinétiques s’ajoutent à l’anticoagulant : le choix se fait avec l’hématologue, au besoin en changeant d’inhibiteur (Lyon 2022).</p>
<div class="lab">Source</div><p>Van Gelder et al., ESC 2024 sur la FA, Eur Heart 2024;45:3314-414 : sections 9.1, 9.5 et 9.6, tableau 14, tableau de recommandations 25. Voskoboinik et al., J Am Coll Cardiol 2016;68:2567-76. Weiss et al., Circ Arrhythm Electrophysiol 2017;10:e004667. van der Hooft et al., Arch Intern Med 2006;166:1016-20. Xiao et al., Circulation 2020;142:2443-55. Levade et al., Blood 2014;124:3991-5. Lyon et al., ESC 2022 de cardio-oncologie, Eur Heart 2022;43:4229-361.</p></template>
<template data-pop="i48-substrat" data-title="Cardiomyopathie auriculaire : comment les facteurs de risque créent le substrat">
<div class="lab">Physiologie normale</div><p>Dans l’oreillette saine, des myocytes alignés sont reliés par des jonctions communicantes, dans un interstitium pauvre en collagène : l’influx s’y propage vite et de façon homogène. Une réentrée ne s’entretient que si le circuit disponible dépasse la longueur d’onde. Trois changements la rendent possible : une conduction ralentie, une période réfractaire raccourcie ou une oreillette agrandie. L’oreillette gauche, ouverte sur le ventricule pendant la diastole, subit en outre sa pression de remplissage.</p>
<div class="lab">Définition</div><p>L’ESC 2024 définit la cardiomyopathie auriculaire comme une combinaison d’anomalies structurelles, électriques ou fonctionnelles des oreillettes qui a un retentissement clinique : progression ou récidive de la FA, efficacité limitée des traitements, insuffisance cardiaque (tableau 6). Elle comprend un remodelage inflammatoire et prothrombotique, une activation neurohormonale et une fibrose. Les facteurs de risque agissent surtout en construisant ce substrat, souvent pendant des années. Le concept reste en cours de validation (ESC 2024, section 12).</p>
<div class="lab">Âge</div><p>L’âge est le premier facteur associé à la FA incidente (ESC 2024, tableau 16). Avec les décennies, l’oreillette perd des myocytes, s’enrichit en collagène, et ses jonctions communicantes se raréfient (Goette et al., 2016). La conduction devient lente et hétérogène. Les taux de FA standardisés sur l’âge restent stables : la hausse du nombre de patients tient surtout à la croissance et au vieillissement de la population (ESC 2024, section 10.1).</p>
<div class="lab">Hypertension artérielle</div><p>La post-charge élevée hypertrophie et rigidifie le ventricule gauche. Sa pression de remplissage monte et se transmet à l’oreillette, qui s’étire puis se dilate. L’étirement active l’angiotensine II et le facteur de croissance transformant β, qui transforment les fibroblastes en myofibroblastes et font déposer du collagène entre les faisceaux musculaires (Nattel et Harada, 2014). La randomisation mendélienne, fondée sur des variants génétiques qui reproduisent le facteur étudié, désigne la pression systolique comme une cause, et non un simple marqueur (ESC 2024, section 10.4).</p>
<div class="lab">Obésité</div><p>La graisse épicardique touche le myocarde auriculaire sans fascia interposé. Elle sécrète des médiateurs inflammatoires et profibrosants, dont l’activine A, et ses adipocytes infiltrent le myocarde, où ils créent des blocs de conduction locaux (Hatem et Sanders, 2014). La surcharge volumique distend l’oreillette, et les apnées du sommeil associées l’étirent à chaque effort inspiratoire. La randomisation mendélienne désigne aussi l’indice de masse corporelle comme cause (ESC 2024, section 10.4).</p>
<div class="lab">Diabète</div><p>L’hyperglycémie chronique forme des produits de glycation avancée, qui pontent le collagène et entretiennent l’inflammation, et elle accroît le stress oxydatif. La fibrose qui en résulte ralentit la conduction. La neuropathie autonome rend la période réfractaire plus hétérogène (Lau et al., 2017). La perte de la signalisation de l’insuline a aussi été associée à des modifications électriques qui favorisent la FA (ESC 2024, section 9.10).</p>
<div class="lab">Alcool, même en quantité modérée</div><p>L’éthanol et l’acétaldéhyde sont toxiques pour le myocyte auriculaire. L’alcool raccourcit la période réfractaire et perturbe l’équilibre vagal et adrénergique, ce qui favorise les extrasystoles déclenchantes. La consommation chronique dilate et fibrose l’oreillette (Voskoboinik et al., 2016). Le risque augmente dès les faibles doses : dans une cohorte européenne de 107 845 personnes, une boisson de 12 g d’éthanol par jour l’augmentait de 16 % (Csengeri et al., 2021).</p>
<div class="lab">Activité physique : trop peu ou beaucoup trop</div><p>La sédentarité agit surtout en aggravant le surpoids, l’hypertension et le diabète ; une meilleure capacité cardiorespiratoire s’associe à une charge de FA plus faible (ESC 2024, section 5.6). À l’opposé, l’endurance intensive pratiquée pendant des années dilate les oreillettes par surcharge volumique répétée. Elle renforce le tonus vagal, et l’acétylcholine raccourcit inégalement la période réfractaire auriculaire ; une fibrose a été évoquée, surtout chez l’animal. Une méta-analyse d’études observationnelles trouve un risque de FA multiplié par 2,5 chez l’athlète (ESC 2024, section 10.5.6). La relation entre activité et FA serait donc en U ; ces mécanismes restent débattus.</p>
<div class="lab">Tabac et maladie rénale chronique</div><p>Le tabac entretient une inflammation et un stress oxydatif ; la nicotine favorise la fibrose et active le sympathique. Ces mécanismes viennent en partie de travaux expérimentaux, mais l’association avec la FA incidente est établie (ESC 2024, tableau 16). La maladie rénale chronique retient l’eau et le sel, ce qui distend l’oreillette. Elle s’accompagne d’une hypertension et d’une activation du système rénine-angiotensine-aldostérone ; l’angiotensine II et l’aldostérone stimulent directement la fibrose. L’insuffisance cardiaque emprunte la même voie, par une pression de remplissage élevée et une activation neurohormonale (voir « Cardiopathies qui favorisent la FA »).</p>
<div class="lab">Conséquence clinique</div><p>Quel que soit le point de départ, le résultat est une oreillette dilatée, dont la fibrose ralentit et fragmente la conduction : les réentrées peuvent s’y entretenir, et la FA aggrave ensuite ce remodelage (voir « Remodelage auriculaire »). Les facteurs interagissent et se cumulent souvent chez un même patient (ESC 2024, section 10.4). L’endocarde altéré, l’état prothrombotique et le flux ralenti dans l’oreillette dilatée favorisent aussi le thrombus. C’est pourquoi l’âge, l’hypertension, le diabète et l’insuffisance cardiaque comptent dans le score CHA₂DS₂-VA.</p>
<div class="lab">Ce qui change la décision</div><p>La prévention agit sur ce substrat avant la première crise. L’ESC 2024 recommande en prévention primaire une pression artérielle optimale, un indice de masse corporelle de 20 à 25 kg/m², 150 à 300 minutes d’activité physique modérée par semaine et l’absence d’excès d’alcool (tableau de recommandations 32, classe I, niveau B). Dans un essai sur l’hypertension, une baisse de 10 mmHg de la pression systolique s’est associée à 17 % de FA incidente en moins (section 10.5.1). Une fois la FA installée, le traitement des mêmes facteurs vise à faire régresser le substrat (voir « Remodelage inverse »).</p>
