
<!-- ===== FENÊTRES I00 : anamnèse et examen ===== -->
<template data-pop="i00-atcd-angine" data-title="Angine ou infection cutanée récente">
<div class="lab">Questions</div><p>Mal de gorge, fièvre, douleur à la déglutition dans les deux à quatre semaines (un à six mois pour la chorée) ; antibiotique pris, lequel, combien de jours ; plaies infectées, impétigo, gale ; cas dans la fratrie ou la collectivité.</p>
<div class="lab">Valeur</div><p>Environ un tiers des patients ne se souviennent d’aucune angine. Une réponse négative ne réduit guère la probabilité.</p>
<div class="lab">Piège</div><p>Une angine traitée trois jours seulement n’a pas été traitée au sens de la prévention du rhumatisme.</p></template>

<template data-pop="i00-atcd-origine" data-title="Pays de naissance, parcours et conditions de vie">
<div class="lab">Questions</div><p>Pays de naissance et pays où le patient a vécu pendant l’enfance ; durée depuis l’arrivée ; conditions du parcours migratoire (camps, hébergement collectif) ; logement actuel.</p>
<div class="lab">Conséquence</div><p>Détermine la population de référence des critères de Jones : un enfant venu d’une région endémique relève des critères du risque modéré ou élevé, même en Suisse.</p>
<div class="lab">Communication</div><p>Recourir à un interprète professionnel plutôt qu’à un enfant de la famille : la prophylaxie de plusieurs années repose sur une compréhension complète.</p></template>

<template data-pop="i00-atcd-medic" data-title="Traitements déjà pris">
<div class="lab">Anti-inflammatoires</div><p>Ibuprofène ou acide acétylsalicylique pris avant la consultation : ils ont pu interrompre la migration de l’arthrite et abaisser la fièvre, ce qui fait perdre des critères. Dans une population à risque, la monoarthrite compte alors comme critère majeur.</p>
<div class="lab">Antibiotiques</div><p>Ils peuvent négativer la culture de gorge et, chez un porteur de valvulopathie, les hémocultures.</p>
<div class="lab">Autres</div><p>Contraception œstroprogestative, neuroleptiques, antiépileptiques : causes de chorée à éliminer.</p></template>

<template data-pop="i00-s-arthrite" data-title="Arthrite rhumatismale : caractérisation">
<div class="lab">Articulations</div><p>Grosses articulations : genoux, chevilles, coudes, poignets ; rarement petites articulations et rachis.</p>
<div class="lab">Migration</div><p>Chaque articulation s’enflamme pendant quelques jours puis s’apaise tandis qu’une autre s’enflamme ; plusieurs peuvent se chevaucher. La poussée articulaire dure en règle moins de quatre semaines.</p>
<div class="lab">Douleur</div><p>Disproportionnée aux signes visibles ; le contact du drap est insupportable.</p>
<div class="lab">Test thérapeutique</div><p>Réponse franche aux anti-inflammatoires en 24 à 72 heures ; son absence doit remettre en cause le diagnostic.</p>
<div class="lab">Physiopathologie</div><p>Synovite exsudative à complexes immuns, sans pannus : guérison sans séquelle.</p></template>

<template data-pop="i00-s-fievre" data-title="Fièvre dans le rhumatisme">
<div class="lab">Caractères</div><p>Souvent ≥ 38,5 °C au début de la poussée avec arthrite ou cardite ; décroît en une à deux semaines, plus vite sous anti-inflammatoire.</p>
<div class="lab">Absence</div><p>Habituelle dans la chorée isolée et dans la cardite indolente, qui surviennent à distance de l’angine.</p>
<div class="lab">Seuils</div><p>Critère mineur à ≥ 38,5 °C (bas risque) ou ≥ 38,0 °C (risque modéré ou élevé).</p>
<div class="lab">Piège</div><p>Une fièvre qui persiste au-delà de 72 heures sous anti-inflammatoire bien dosé fait reconsidérer le diagnostic : endocardite, arthrite septique, leucémie, maladie systémique.</p></template>

<template data-pop="i00-s-cardite" data-title="Symptômes de la cardite">
<div class="lab">Souvent absents</div><p>La cardite légère ou modérée est asymptomatique ; elle se découvre à l’auscultation ou à l’échocardiographie.</p>
<div class="lab">Quand ils existent</div><p>Dyspnée d’effort puis de repos, orthopnée, toux, fatigue, douleurs abdominales (foie cardiaque), douleur thoracique de type péricardique, palpitations.</p>
<div class="lab">Physiopathologie</div><p>La dyspnée traduit une fuite mitrale ou aortique importante qui élève la pression dans l’oreillette gauche et les veines pulmonaires. La douleur thoracique traduit une péricardite.</p>
<div class="lab">Chez l’enfant</div><p>Refus de jouer, sueurs pendant les repas, perte d’appétit ; la tachycardie de sommeil est un signe objectif précieux.</p></template>

<template data-pop="i00-s-choree" data-title="Chorée : ce que rapportent l’enfant et l’entourage">
<div class="lab">Plaintes</div><p>Maladresse, objets qui tombent, écriture illisible, difficulté à s’habiller ou à manger, grimaces, parole hachée.</p>
<div class="lab">Comportement</div><p>Pleurs faciles, irritabilité, anxiété, rituels ou pensées envahissantes, baisse des résultats scolaires.</p>
<div class="lab">Évolution</div><p>Installation sur une à quatre semaines ; mouvements aggravés par le stress, absents pendant le sommeil.</p>
<div class="lab">Piège</div><p>Souvent interprétée comme une agitation psychologique ou des tics ; l’examen neurologique et l’échocardiographie tranchent.</p></template>

<template data-pop="i00-v-fc" data-title="Fréquence cardiaque dans le rhumatisme">
<div class="lab">Tachycardie disproportionnée</div><p>Chaque degré de fièvre accélère la fréquence d’environ 10/min chez l’enfant. Une tachycardie nettement supérieure à cet effet oriente vers une cardite.</p>
<div class="lab">Tachycardie de sommeil</div><p>La persistance d’une tachycardie pendant le sommeil, alors que la fièvre et la douleur sont contrôlées, est un signe classique de cardite active ou d’insuffisance cardiaque.</p>
<div class="lab">Bradycardie ou irrégularité</div><p>Évoque un trouble de conduction : ECG.</p></template>

<template data-pop="i00-e-arthrite" data-title="Examen de l’arthrite rhumatismale">
<div class="lab">Technique</div><p>Inspection (tuméfaction, rougeur), palpation (chaleur, épanchement, choc rotulien), mobilisation douce ; noter chaque jour les articulations atteintes sur un schéma pour objectiver la migration.</p>
<div class="lab">Arthrite ou arthralgie</div><p>Arthrite : signes objectifs (tuméfaction, chaleur, limitation). Arthralgie : douleur seule. La distinction change le critère (majeur ou mineur).</p>
<div class="lab">Signes d’alarme</div><p>Articulation unique, très tuméfiée, fixe, fièvre élevée, état septique : ponction avant tout antibiotique.</p>
<div class="lab">Diagnostic différentiel</div><p>Arthrite septique, arthrite réactionnelle post-streptococcique, arthrite juvénile idiopathique, maladie de Lyme, lupus, drépanocytose, leucémie.</p></template>

<template data-pop="i00-e-souffle-im" data-title="Souffle d’insuffisance mitrale de la cardite">
<div class="lab">Technique</div><p>Patient en décubitus latéral gauche, membrane du stéthoscope à la pointe, puis vers l’aisselle ; ausculter chaque jour pendant la poussée.</p>
<div class="lab">Caractères</div><p>Holosystolique, en jet de vapeur, commençant avec le premier bruit et le masquant, irradiant vers l’aisselle ; intensité indépendante de la respiration.</p>
<div class="lab">Valeur</div><p>Souffle nouveau dans un contexte compatible : cardite clinique, critère majeur.</p>
<div class="lab">Piège</div><p>Souffle fonctionnel de la fièvre : protosystolique, doux, bord sternal gauche, variable avec la position. Seule l’échocardiographie tranche.</p></template>

<template data-pop="i00-e-carey" data-title="Roulement de Carey Coombs">
<div class="lab">Caractères</div><p>Roulement mésodiastolique bref, de basse fréquence, à la pointe, sans claquement d’ouverture ni renforcement présystolique.</p>
<div class="lab">Mécanisme</div><p>Débit diastolique augmenté à travers une valve mitrale inflammatoire, lié à la fuite mitrale ; il ne s’agit pas d’un rétrécissement organique.</p>
<div class="lab">Technique</div><p>Cloche du stéthoscope posée légèrement à la pointe, patient en décubitus latéral gauche, en fin d’expiration.</p>
<div class="lab">Évolution</div><p>Disparaît habituellement quand la valvulite s’apaise. Un roulement persistant avec claquement d’ouverture, des années plus tard, traduit un rétrécissement mitral constitué.</p></template>

<template data-pop="i00-e-souffle-ia" data-title="Souffle d’insuffisance aortique de la cardite">
<div class="lab">Caractères</div><p>Souffle protodiastolique, doux, aspiratif, décroissant, au bord sternal gauche.</p>
<div class="lab">Technique</div><p>Patient assis penché en avant, en expiration forcée bloquée, membrane du stéthoscope au troisième espace intercostal gauche.</p>
<div class="lab">Valeur</div><p>Toujours pathologique ; associé le plus souvent à une fuite mitrale dans la cardite.</p>
<div class="lab">Piège</div><p>Discret et facilement manqué chez l’enfant tachycarde ; l’échocardiographie le recherche systématiquement.</p></template>

<template data-pop="i00-e-choree" data-title="Signes cliniques de la chorée de Sydenham">
<div class="lab">Traite de la laitière</div><p>Le patient serre les doigts de l’examinateur : la pression se relâche et se renforce de façon irrégulière.</p>
<div class="lab">Signe du pronateur</div><p>Bras levés au-dessus de la tête : les avant-bras se mettent en pronation, paumes vers l’extérieur.</p>
<div class="lab">Main en cuillère</div><p>Bras tendus devant soi : flexion du poignet et hyperextension des doigts.</p>
<div class="lab">Langue</div><p>Le patient ne peut maintenir la langue tirée : elle rentre et sort par saccades.</p>
<div class="lab">Autres</div><p>Hypotonie, réflexes rotuliens pendulaires, dysarthrie, écriture dégradée ; mouvements absents pendant le sommeil.</p>
<div class="lab">Forme grave</div><p>Chorée paralytique : hypotonie si marquée que le patient semble paralysé.</p></template>

<template data-pop="i00-e-erytheme" data-title="Érythème marginé">
<div class="lab">Aspect</div><p>Macules rosées qui s’étendent en anneaux à centre clair et à bord net, confluents en guirlandes ; non prurigineux, non douloureux.</p>
<div class="lab">Siège</div><p>Tronc et racine des membres ; jamais le visage.</p>
<div class="lab">Évolution</div><p>Fugace : apparaît et disparaît en quelques heures, accentué par la chaleur (bain chaud).</p>
<div class="lab">Fréquence</div><p>Moins de 5 % des poussées ; associé à la cardite.</p>
<div class="lab">Piège</div><p>Presque invisible sur une peau foncée ; examiner le patient déshabillé, sous bon éclairage, à plusieurs reprises.</p></template>

<template data-pop="i00-e-nodules" data-title="Nodules sous-cutanés">
<div class="lab">Aspect</div><p>Nodules fermes, indolores, mobiles, de 0,5 à 2 cm, sans inflammation de la peau.</p>
<div class="lab">Siège</div><p>Faces d’extension : coudes, genoux, poignets, occiput, apophyses épineuses.</p>
<div class="lab">Délai et durée</div><p>Apparaissent quelques semaines après le début de la poussée ; persistent une à deux semaines.</p>
<div class="lab">Valeur</div><p>Rares (moins de 5 %) ; fortement associés à une cardite sévère : leur présence impose une échocardiographie attentive.</p></template>
