<template data-pop="i00-d-bpg" data-title="Pénicilline G benzathine">
<div class="lab">Mécanisme</div><p>Sel de benzylpénicilline très peu soluble. Déposé dans le muscle, il se dissout lentement et libère une concentration sanguine faible mais prolongée, suffisante contre le streptocoque du groupe A pendant environ trois à quatre semaines. La pénicilline inhibe les protéines de liaison à la pénicilline et la synthèse de la paroi.</p>
<div class="lab">Preuves</div><p>Réduction des récidives de rhumatisme par rapport à la pénicilline orale (revues Cochrane) ; réduction de la progression des atteintes latentes (essai GOAL, 2022). OMS 2024 : premier choix de la prophylaxie, recommandation forte.</p>
<div class="lab">Posologie</div><p>1,2 million d’UI en injection intramusculaire profonde si ≥ 30 kg ; 600 000 UI si &lt; 30 kg (27 kg selon l’AHA 2009). Angine : dose unique. Prophylaxie : toutes les 4 semaines ; toutes les 3 semaines en cas de risque élevé ou de récidive malgré une bonne observance.</p>
<div class="lab">Administration</div><p>Quadrant supéro-externe de la fesse ou face antérolatérale de la cuisse ; aiguille assez longue ; aspiration préalable ; injection lente ; produit à température ambiante ; anesthésique local comme diluant selon le produit (OMS 2024).</p>
<div class="lab">Effets indésirables</div><p>Douleur au point d’injection ; allergie, rare mais potentiellement anaphylactique ; réaction vasovagale ; injection intravasculaire accidentelle : syndrome de Nicolau (nécrose ischémique cutanée et musculaire), ischémie d’un membre ; réaction neuropsychique aiguë (syndrome de Hoigné), surtout décrite avec les préparations contenant de la procaïne.</p>
<div class="lab">Contre-indication</div><p>Allergie immédiate documentée aux pénicillines.</p>
<div class="lab">Surveillance</div><p>Observation de 15 à 30 minutes après l’injection ; adrénaline disponible ; suivi des dates d’injection.</p></template>

<template data-pop="i00-d-penv" data-title="Pénicilline V (phénoxyméthylpénicilline)">
<div class="lab">Mécanisme</div><p>Pénicilline stable en milieu acide, absorbée par voie orale ; bactéricide temps-dépendant.</p>
<div class="lab">Preuves et place</div><p>Traitement de référence de l’angine streptococcique pendant 10 jours, validé pour la prévention du rhumatisme ; prophylaxie orale acceptable si l’injection est impossible (OMS 2024, recommandation conditionnelle), moins efficace que l’injection.</p>
<div class="lab">Posologie</div><p>Angine : enfant 250 mg 2 à 3 fois/jour ; adolescent et adulte 250 mg 4 fois/jour ou 500 mg 2 fois/jour, 10 jours (IDSA 2012). Prophylaxie : 250 mg 2 fois/jour (AHA 2009). Les spécialités suisses sont exprimées en unités internationales : 250 mg correspondent à environ 400 000 UI, 500 mg à environ 800 000 UI.</p>
<div class="lab">Effets indésirables</div><p>Troubles digestifs, exanthème, allergie.</p>
<div class="lab">Limite</div><p>Plusieurs prises par jour pendant des années : observance souvent insuffisante.</p></template>

<template data-pop="i00-d-amox" data-title="Amoxicilline dans l’angine streptococcique">
<div class="lab">Mécanisme</div><p>Aminopénicilline ; même cible que la pénicilline, meilleure absorption orale et goût plus acceptable en suspension.</p>
<div class="lab">Place</div><p>Alternative de première intention à la pénicilline V, en particulier chez l’enfant ; une prise quotidienne possible.</p>
<div class="lab">Posologie</div><p>50 mg/kg une fois par jour (maximum 1 000 mg) ou 25 mg/kg deux fois par jour (maximum 500 mg par prise), 10 jours (IDSA 2012).</p>
<div class="lab">Effets indésirables</div><p>Diarrhée, exanthème ; exanthème maculopapuleux quasi constant en cas de mononucléose infectieuse, qui n’est pas une allergie vraie mais fait éviter la molécule dans ce contexte.</p>
<div class="lab">Piège</div><p>Une angine avec grosse fatigue, adénopathies diffuses et splénomégalie évoque une mononucléose : test avant l’amoxicilline.</p></template>

<template data-pop="i00-d-macro" data-title="Alternatives en cas d’allergie aux pénicillines">
<div class="lab">Allergie non immédiate (exanthème tardif bénin)</div><p>Céphalosporine de première génération : céfalexine 20 mg/kg 2 fois/jour (maximum 500 mg par prise) ou céfadroxil 30 mg/kg 1 fois/jour (maximum 1 g), 10 jours.</p>
<div class="lab">Allergie immédiate (urticaire, angiœdème, anaphylaxie)</div><p>Clarithromycine 7,5 mg/kg 2 fois/jour (maximum 250 mg par prise), 10 jours ; azithromycine 12 mg/kg 1 fois/jour (maximum 500 mg), 5 jours ; clindamycine 7 mg/kg 3 fois/jour (maximum 300 mg par prise), 10 jours (IDSA 2012).</p>
<div class="lab">Prophylaxie</div><p>Érythromycine 250 mg 2 fois/jour (AHA 2009).</p>
<div class="lab">Mises en garde</div><p>Résistance aux macrolides variable selon les régions ; allongement du QT et interactions par le cytochrome CYP3A4 (clarithromycine, érythromycine) ; diarrhée à <i>Clostridioides difficile</i> sous clindamycine.</p>
<div class="lab">Réflexe</div><p>Une grande partie des allergies déclarées ne sont pas confirmées : un bilan d’allergologie peut rendre la pénicilline G benzathine accessible pour des années.</p></template>

<template data-pop="i00-d-asa" data-title="Acide acétylsalicylique à dose anti-inflammatoire">
<div class="lab">Mécanisme</div><p>Inhibition irréversible des cyclo-oxygénases 1 et 2 ; effet anti-inflammatoire à forte dose seulement.</p>
<div class="lab">Preuves et place</div><p>Traitement historique de l’arthrite rhumatismale, à l’effet spectaculaire ; aucun effet démontré sur la cardite séquellaire. Souvent remplacé aujourd’hui par le naproxène.</p>
<div class="lab">Posologie</div><p>50–60 mg/kg/jour en 4 à 5 prises, jusqu’à 80–100 mg/kg/jour si nécessaire (maximum 4 g/jour) ; revenir à 50–60 mg/kg/jour dès l’amélioration ; poursuivre jusqu’à normalisation de la CRP puis décroître (recommandations australiennes 2020).</p>
<div class="lab">Effets indésirables</div><p>Salicylisme (acouphènes, nausées, vertiges, polypnée) ; ulcère gastrique, hémorragie ; syndrome de Reye chez l’enfant en cas de grippe ou de varicelle.</p>
<div class="lab">Contre-indications</div><p>Ulcère évolutif, trouble de l’hémostase, anticoagulation, grossesse après 20 semaines à dose anti-inflammatoire, grippe ou varicelle en cours.</p>
<div class="lab">Surveillance</div><p>Symptômes de salicylisme, salicylémie si disponible, vaccination antigrippale.</p></template>

<template data-pop="i00-d-naprox" data-title="Naproxène dans le rhumatisme articulaire aigu">
<div class="lab">Mécanisme</div><p>Anti-inflammatoire non stéroïdien inhibiteur réversible des cyclo-oxygénases, à demi-vie longue (environ 12 à 17 heures), ce qui permet deux prises par jour.</p>
<div class="lab">Preuves et place</div><p>Efficacité comparable à l’acide acétylsalicylique sur l’arthrite dans de petits essais pédiatriques ; mieux toléré, sans syndrome de Reye ; anti-inflammatoire de premier choix des recommandations australiennes 2020.</p>
<div class="lab">Posologie</div><p>Enfant : 10–20 mg/kg/jour en 2 prises (maximum 1 000 mg/jour). Adulte : 250–500 mg 2 fois/jour. Jusqu’à disparition des symptômes et normalisation de la CRP, puis décroissance.</p>
<div class="lab">Effets indésirables</div><p>Douleurs gastriques, ulcère, rétention sodée, altération de la fonction rénale ; pseudoporphyrie cutanée chez l’enfant à peau claire.</p>
<div class="lab">Contre-indications</div><p>Ulcère évolutif, insuffisance rénale sévère, insuffisance cardiaque décompensée, grossesse après 20 semaines.</p>
<div class="lab">Surveillance</div><p>Créatinine en cas d’insuffisance cardiaque ou de diurétique ; protection gastrique si facteurs de risque.</p></template>

<template data-pop="i00-d-cortico" data-title="Corticoïdes dans le rhumatisme articulaire aigu">
<div class="lab">Mécanisme</div><p>Inhibition de la transcription des cytokines inflammatoires et de l’activation lymphocytaire.</p>
<div class="lab">Preuves</div><p>Les essais anciens et les méta-analyses n’ont pas montré de réduction de la cardiopathie séquellaire par rapport à l’acide acétylsalicylique ou au placebo. L’OMS 2024 ne formule pas de recommandation.</p>
<div class="lab">Place</div><p>Cardite sévère avec insuffisance cardiaque, pour accélérer la résolution de l’inflammation ; chorée sévère ou réfractaire.</p>
<div class="lab">Posologie</div><p>Prednisone ou prednisolone 1–2 mg/kg/jour en une prise (maximum 80 mg/jour), 1 à 3 semaines, puis décroissance sur plusieurs semaines (recommandations australiennes 2020). Relais anti-inflammatoire non stéroïdien pendant la décroissance pour limiter le rebond.</p>
<div class="lab">Effets indésirables</div><p>Hyperglycémie, hypertension, rétention sodée, troubles de l’humeur, infections ; strongyloïdose disséminée chez le patient venu d’une région tropicale.</p>
<div class="lab">Précautions</div><p>Exclure une leucémie avant de débuter ; ivermectine préventive selon l’origine.</p></template>

<template data-pop="i00-d-valpro" data-title="Acide valproïque dans la chorée">
<div class="lab">Mécanisme</div><p>Augmentation de la transmission par l’acide gamma-aminobutyrique (GABA), blocage des canaux sodiques et calciques de type T : réduction de l’excitabilité neuronale.</p>
<div class="lab">Preuves et place</div><p>Séries de cas et petits essais ; souvent considéré comme le plus efficace des antichoréiques. Chez la fille pubère et la femme en âge de procréer, restriction de Swissmedic : seulement si les alternatives sont inefficaces, avec une contraception efficace.</p>
<div class="lab">Posologie</div><p>15–30 mg/kg/jour en 2 à 3 prises, titration progressive (recommandations australiennes 2020) ; arrêt progressif après plusieurs semaines sans mouvement.</p>
<div class="lab">Effets indésirables</div><p>Hépatotoxicité, pancréatite, thrombopénie, hyperammoniémie, prise de poids, tremblement ; tératogénicité et troubles du développement de l’enfant exposé in utero.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques, hémogramme, test de grossesse, ammoniémie si somnolence.</p></template>

<template data-pop="i00-d-carba" data-title="Carbamazépine dans la chorée">
<div class="lab">Mécanisme</div><p>Blocage des canaux sodiques voltage-dépendants : réduction des décharges neuronales répétitives.</p>
<div class="lab">Preuves et place</div><p>Séries de cas et petits essais comparatifs ; alternative à l’acide valproïque, préférée chez la fille pubère.</p>
<div class="lab">Posologie</div><p>7–20 mg/kg/jour en 2 à 3 prises, titration progressive (recommandations australiennes 2020).</p>
<div class="lab">Effets indésirables</div><p>Somnolence, vertiges, hyponatrémie, leucopénie, hépatite ; réactions cutanées graves (syndrome de Stevens et Johnson), plus fréquentes chez les porteurs de l’allèle HLA-B*15:02.</p>
<div class="lab">Interactions</div><p>Inducteur enzymatique : baisse d’efficacité de la contraception hormonale et des antivitamines K ; sa concentration augmente avec la clarithromycine et l’érythromycine.</p>
<div class="lab">Surveillance</div><p>Hémogramme, natrémie, tests hépatiques ; arrêt immédiat en cas d’éruption.</p></template>

<template data-pop="i00-d-ic" data-title="Traitement de l’insuffisance cardiaque de la cardite">
<div class="lab">Principe</div><p>L’insuffisance cardiaque de la cardite résulte d’une surcharge de volume par fuite valvulaire, non d’une défaillance contractile primitive.</p>
<div class="lab">Diurétique de l’anse</div><p>Furosémide : enfant 0,5–1 mg/kg par dose, 1 à 3 fois/jour ; adulte 20–40 mg par dose, adaptés à la réponse. Surveiller kaliémie et créatinine.</p>
<div class="lab">Inhibiteur de l’enzyme de conversion</div><p>Réduit la postcharge et donc la fraction régurgitée dans la fuite mitrale ou aortique importante. Début à faible dose, titration selon la pression artérielle et la créatinine ; doses adultes : chapitre I50 ; doses pédiatriques selon le protocole de cardiologie pédiatrique.</p>
<div class="lab">Autres mesures</div><p>Restriction sodée, oxygène si hypoxémie, activité limitée. Digoxine avec prudence (myocarde inflammatoire sensible).</p>
<div class="lab">Échec</div><p>Fuite massive réfractaire (rupture de cordage) : chirurgie en centre expert.</p></template>
