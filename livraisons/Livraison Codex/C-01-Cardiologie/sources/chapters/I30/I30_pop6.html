
<!-- ===== FENÊTRES I30 : Pareto ===== -->
<template data-pop="pareto-i30-def" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="i30-1,i30-2"></p>
<ul><li>Trois problèmes : inflammation (péricardite, I30), liquide (épanchement I31.3, tamponnade I31.4), cicatrice rigide (constriction I31.1). I32 = péricardite d’une maladie classée ailleurs.</li><li>ESC 2025 (29.08.2025) : syndrome inflammatoire myopéricardique, spectre péricardite → myopéricardite → myocardite.</li><li>Aiguë ; incessante (&gt; 4–6 semaines sans rémission) ; récidivante (après 4–6 semaines libres) ; chronique (&gt; 3 mois).</li><li>Incidence ≈ 27,7/100 000/an (Italie) ; homme de 16 à 65 ans ; ≈ 5 % des douleurs thoraciques non ischémiques aux urgences.</li><li>Europe : idiopathique ou virale ; monde : tuberculose.</li><li>Récidive 15–30 % sans colchicine. Constriction : &lt; 1 % (virale), 2–5 % (immunitaire, néoplasique), 20–30 % (bactérienne).</li></ul></template>

<template data-pop="pareto-i30-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i30-3"></p>
<ul><li>Inflammation : inflammasome → interleukine 1 → fibrine → douleur (nerfs phréniques) et frottement ; boucle auto-inflammatoire = récidives (cible de la colchicine et des anti-interleukine 1).</li><li>Tamponnade : courbe pression-volume en J ; la vitesse compte plus que le volume (150–200 mL rapide peut tuer ; 1–2 L lent toléré) ; retirer 50–100 mL soulage.</li><li>Pouls paradoxal = interdépendance ventriculaire dans un sac plein.</li><li>Constriction : remplissage rapide puis arrêt brutal (dip-plateau, vibrance) ; dissociation des pressions intrathoraciques et intracardiaques ; absente dans la restriction.</li></ul></template>

<template data-pop="pareto-i30-etio" data-title="Pareto — Étiologies">
<p class="ratio" data-cover="i30-4"></p>
<ul><li>Virale ou idiopathique : majorité en Europe ; pas de bilan exhaustif si faible risque.</li><li>Bactériennes : tuberculose (première cause mondiale), purulente (sepsis, drainage).</li><li>Non infectieuses : maladies systémiques et auto-inflammatoires, néoplasies (poumon, sein, lymphome, mélanome), urémie, hypothyroïdie, post-lésionnelles (infarctus, chirurgie, gestes), radiothérapie, médicaments et vaccins à ARN messager.</li><li>L’étiologie change le traitement, le risque de constriction et le choix de l’anti-inflammatoire (aspirine après infarctus).</li></ul></template>

<template data-pop="pareto-i30-clin" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i30-5,i30-6"></p>
<ul><li>Douleur (&gt; 85 %) : aiguë, rétrosternale, aggravée par l’inspiration et le décubitus, soulagée penché en avant, irradiant au trapèze.</li><li>Antécédents : infection récente, tuberculose et exposition, cancer et radiothérapie, infarctus ou chirurgie, dialyse, maladie systémique, médicaments.</li><li>Fièvre &gt; 38 °C = haut risque ; signes généraux = cause spécifique.</li><li>Frottement : spécifique, ≤ un tiers des cas, fugace.</li><li>Tamponnade : tachycardie, turgescence, pouls paradoxal &gt; 10 mmHg, descente y absente ; triade de Beck surtout aiguë.</li><li>Constriction : ascite avant œdèmes, Kussmaul, vibrance, descente y profonde ; ne pas confondre avec une cirrhose.</li></ul></template>

<template data-pop="pareto-i30-diag" data-title="Pareto — Diagnostic de la péricardite aiguë">
<p class="ratio" data-cover="i30-7"></p>
<ul><li>ESC 2025 (tableau 4) : présentation compatible + ≥ 2 critères (frottement, ECG, protéine C réactive, épanchement, IRM) = certain ; 1 = possible ; 0 = peu probable. ACC 2025 : 1 critère suffit. ESC 2015 : 2 critères sur 4.</li><li>ECG (≈ 60 %) : stade I sus-décalage ST concave diffus + PR sous-décalé (sus-décalé en aVR) → II normalisation → III T inversées → IV normal.</li><li>Bilan : ECG, radiographie, protéine C réactive, hémogramme, troponine, créatinine, échocardiographie.</li><li>Différentiels par gravité : infarctus (miroir, convexe, onde Q), dissection, embolie, pneumothorax.</li></ul></template>

<template data-pop="pareto-i30-tt" data-title="Pareto — Gravité et traitement de la péricardite aiguë">
<p class="ratio" data-cover="i30-8,i30-9"></p>
<ul><li>Urgences : tamponnade (drainage), dissection (chirurgie, pas de ponction), purulente (drainage + antibiotiques), infarctus.</li><li>Haut risque (hospitaliser) : majeurs FASTE (fièvre &gt; 38 °C, absence de réponse à 1 semaine, subaiguë, tamponnade, épanchement &gt; 20 mm) ; mineurs (myopéricardite, immunodépression, traumatisme, anticoagulant).</li><li>Faible risque : ambulatoire, contrôle à 1 semaine.</li><li>Première ligne (I, A) : aspirine 750–1 000 mg/8 h ou ibuprofène 600 mg/8 h, 1–2 semaines puis décroissance + colchicine 0,5 mg × 1 (&lt; 70 kg) ou × 2 (≥ 70 kg) pendant 3 mois ; protection gastrique.</li><li>Décroissance après disparition de la douleur et normalisation de la protéine C réactive ; colchicine arrêtée en dernier.</li><li>Corticoïdes : deuxième ligne, 0,2–0,5 mg/kg/jour, avec colchicine. Sport : restriction initiale d’un mois.</li></ul></template>

<template data-pop="pareto-i30-rec" data-title="Pareto — Péricardite récidivante">
<p class="ratio" data-cover="i30-10"></p>
<ul><li>Récidive = mêmes critères objectifs après ≥ 4–6 semaines libres ; douleur isolée ≠ récidive.</li><li>Escalade : AINS ou aspirine + colchicine ≥ 6 mois → corticoïde faible dose + colchicine (décroissance très lente sous 15 mg) → anti-interleukine 1 (IIa, C si réfractaire et corticodépendant ; I, A si protéine C réactive élevée) → immunosuppresseurs → péricardectomie.</li><li>Anakinra : hors indication en Suisse ; rilonacept : non autorisé en Europe.</li><li>Chercher : traitement trop court, corticoïde initial, tuberculose, maladie systémique, fièvre méditerranéenne familiale.</li></ul></template>

<template data-pop="pareto-i30-epanch" data-title="Pareto — Épanchement et tamponnade">
<p class="ratio" data-cover="i30-11,i30-12"></p>
<ul><li>Taille en fin de diastole : &lt; 10 mm faible ; 10–20 mm modéré ; &gt; 20 mm abondant. La taille ne dit pas le retentissement.</li><li>Démarche : tamponnade ? → inflammation ? (traiter comme une péricardite) → maladie connue (60 %) ? → bilan orienté.</li><li>Ponction : tamponnade, suspicion bactérienne ou néoplasique, épanchement abondant symptomatique résistant.</li><li>Épanchement abondant idiopathique &gt; 3 mois : drainage à envisager ; récidive → fenêtre.</li><li>Tamponnade = diagnostic clinique ; pressions diastoliques égalisées ; descente y absente. Échocardiographie : collapsus oreillette droite et ventricule droit, veine cave pléthorique, variation mitrale &gt; 25 %.</li><li>Pas de diurétique, pas de vasodilatateur, éviter la ventilation en pression positive ; drainage échoguidé ; chirurgical si dissection, rupture, caillots, pus cloisonné.</li><li>Pièges : tamponnade à basse pression (hypovolémie) ; syndrome de décompression après drainage massif.</li></ul></template>

<template data-pop="pareto-i30-constr" data-title="Pareto — Constriction">
<p class="ratio" data-cover="i30-13"></p>
<ul><li>Causes : idiopathique ou virale, chirurgie cardiaque, radiothérapie ; tuberculose dans le monde.</li><li>Signes : insuffisance cardiaque droite, ascite, Kussmaul, vibrance, descente y rapide.</li><li>Échocardiographie (Mayo) : bascule septale + e′ septale ≥ 9 cm/s ou reflux sus-hépatique expiratoire ≥ 0,79 ; annulus reversus ; variation mitrale ≥ 25 %.</li><li>Scanner : calcifications ; épaisseur normale ≤ 2 mm, épaissie &gt; 3 mm, ≥ 4 mm évocatrice. IRM : inflammation (constriction transitoire). Épaisseur normale dans ≈ 18 % des cas.</li><li>Cathétérisme : discordance systolique (référence) ; égalisation ≤ 5 mmHg, dip-plateau.</li><li>Restriction : peptide élevé, e′ basse, oreillettes dilatées, concordance.</li><li>Traitement : anti-inflammatoire 2–3 mois si inflammation ; antituberculeux ; sinon péricardectomie en centre expert (+ insuffisance tricuspide sévère).</li></ul></template>

<template data-pop="pareto-i30-formes" data-title="Pareto — Formes étiologiques">
<p class="ratio" data-cover="i30-14"></p>
<ul><li>Tuberculeuse : adénosine désaminase ≥ 40 U/L, interféron gamma, amplification génique ; 6 mois d’antituberculeux ; corticoïdes si VIH négatif (IIb) ; péricardectomie si échec à 4–8 semaines.</li><li>Purulente : drainage urgent, antibiotiques intraveineux, fibrinolyse intrapéricardique.</li><li>Néoplasique : cytologie, drainage prolongé, cytostatique intrapéricardique, fenêtre.</li><li>Urémique : dialyse intensifiée ; ECG souvent atypique.</li><li>Post-lésionnelle : 2 critères sur 5 ; aspirine après infarctus ; colchicine préventive après chirurgie.</li><li>Dissection de type A : chirurgie ; pas de ponction percutanée (sauf drainage minimal contrôlé).</li></ul></template>

<template data-pop="pareto-i30-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i30-15,i30-16"></p>
<ul><li>Protéine C réactive : durée de la dose d’attaque, décroissance, récidive.</li><li>Contrôle à 1 semaine, fin de l’AINS, fin de la colchicine ; suivi prolongé des formes récidivantes en centre expérimenté.</li><li>Grossesse : AINS jusqu’à 20 semaines ; ensuite aspirine ≤ 100 mg ou prednisone faible ; colchicine envisageable (ESC 2025, IIb), mais contre-indiquée par l’information professionnelle suisse (hors indication) ; concertation préconceptionnelle (I).</li><li>Dialyse : intensifier ; colchicine contre-indiquée si DFG &lt; 30 mL/min (information professionnelle suisse).</li><li>Sujet âgé : colchicine demi-dose, interactions ; enfant : pas de corticoïde.</li><li>Après infarctus : aspirine + colchicine ; pas d’autre AINS ni de corticoïde.</li></ul></template>

<template data-pop="pareto-i30-bio" data-title="Pareto — Biologie et liquide péricardique">
<p class="ratio" data-cover="i30-e-2,i30-e-3"></p>
<ul><li>Protéine C réactive : critère diagnostique, guide du traitement, marqueur de récidive.</li><li>Troponine : myopéricardite (haut risque).</li><li>Bilan orienté : TSH, créatinine, anticorps antinucléaires, test de libération d’interféron gamma, VIH, hémocultures.</li><li>Liquide : polynucléaires + glucose bas = purulent ; lymphocytes + adénosine désaminase ≥ 40 U/L = tuberculose ; cytologie = néoplasie ; triglycérides = chylopéricarde.</li><li>Critères de Light inutiles pour le péricarde.</li></ul></template>

<template data-pop="pareto-i30-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i30-e-1,i30-e-2,i30-e-3,i30-e-4,i30-e-5,i30-e-6,i30-e-7"></p>
<ul><li>Références : échocardiographie (première ligne), IRM (inflammation), cathétérisme simultané (hémodynamique de la constriction), biopsie (étiologie).</li><li>ECG : sus-décalage concave diffus sans miroir, PR sous-décalé ; ST/T en V6 &gt; 0,25 ; microvoltage et alternance = épanchement abondant ; urémie = ECG souvent normal.</li><li>Épanchement : &lt; 10 / 10–20 / &gt; 20 mm. Tamponnade : collapsus oreillette droite (&gt; un tiers du cycle) et ventricule droit, veine cave &gt; 21 mm non compliante, mitrale &gt; 25 %, tricuspide &gt; 40 %.</li><li>Constriction : critères Mayo ; scanner (calcifications ; épaisseur ≥ 4 mm évocatrice) ; IRM (rehaussement = forme transitoire).</li><li>Constriction vs restriction : discordance vs concordance ; peptide bas vs élevé ; e′ élevée vs basse ; pression pulmonaire &lt; 55 vs &gt; 55 mmHg.</li></ul></template>

<template data-pop="pareto-i30-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i30-sa,i30-sh,i30-sp,i30-si,i30-sg"></p>
<ul><li>Anatomie : fibreux + séreux (pariétal, viscéral) ; sinus transverse et oblique ; nerf phrénique (racines cervicales 3 à 5) → douleur au trapèze, hoquet ; aorte ascendante intrapéricardique (dissection → hémopéricarde) ; voie sous-xiphoïdienne.</li><li>Histologie : mésothélium (liquide, phospholipides) ; collagène ondulé → courbe en J ; fibrine → fibrose → calcification = constriction.</li><li>Physiologie : pression intrapéricardique ≈ pression pleurale ; tamponnade = y absent ; constriction = y profond, Kussmaul ; peptide natriurétique bas (pas d’étirement).</li><li>Immunologie : inflammasome → interleukine 1α/1β → récepteur ; colchicine (amont), anakinra (récepteur), rilonacept (piège). Tuberculose : lymphocytes, interféron gamma, granulomes → constriction.</li><li>Génétique : <i>MEFV</i> (fièvre méditerranéenne familiale, récessive), <i>TNFRSF1A</i> (dominante) ; variant auto-inflammatoire chez 5 à 15 % des récidivants ; analyse génétique à discuter (ESC 2025).</li></ul></template>

<template data-pop="pareto-i30-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i30-p-1,i30-p-2,i30-p-3,i30-p-4,i30-p-5,i30-p-6"></p>
<ul><li>Aspirine 750–1 000 mg/8 h (−250 à 500 mg toutes les 1–2 semaines) ; ibuprofène 600 mg/8 h (−200 à 400 mg) ; indométacine 25–50 mg/8 h.</li><li>Colchicine 0,5 mg × 1 (&lt; 70 kg) ou × 2 (≥ 70 kg) ; en Suisse, Colctab autorisé dans la péricardite, contre-indiqué si DFG &lt; 30, pendant la grossesse et l’allaitement (information professionnelle) ; 3 mois (premier épisode), ≥ 6 mois (récidive) ; demi-dose chez l’âgé.</li><li>Prednisone 0,2–0,5 mg/kg/jour ; décroissance plus lente sous 15 mg.</li><li>Anakinra 100 mg/jour sous-cutané ; rilonacept 320 puis 160 mg/semaine.</li><li>Interactions colchicine : clarithromycine, azolés, ciclosporine, vérapamil, diltiazem, inhibiteurs de protéase, statines.</li><li>À éviter : corticoïde initial, anticoagulant sans indication, AINS après infarctus (sauf aspirine), diurétiques et vasodilatateurs dans la tamponnade.</li></ul></template>
