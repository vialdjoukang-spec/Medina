
<!-- ===== FENÊTRES I35 : Pareto ===== -->
<template data-pop="pareto-i35-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i35-0,i35-1,i35-2"></p>
<ul><li>RA : obstacle valvulaire à l’éjection ; IA : fuite diastolique, par atteinte des cuspides ou de la racine ; IA aiguë = urgence chirurgicale.</li>
<li>RA sévère : Vmax ≥ 4 m/s, gradient moyen ≥ 40 mmHg, SVA &lt; 1 cm² (indexée &lt; 0,6 cm²/m²). Sclérose : Vmax ≤ 2,5 m/s, pas d’intervention.</li>
<li>Décision = sévérité + symptômes + retentissement ventriculaire gauche (stades ACC/AHA A à D).</li>
<li>Codage : I35.0 RA, I35.1 IA, I35.2 mixte ; I06 si rhumatismal ; Q23.1 bicuspidie ; endocardite en I33.</li>
<li>RA calcifié : première valvulopathie opérée en Europe ; RA sévère ≈ 3,4 % après 75 ans.</li>
<li>Bicuspidie : 0,5–2 % de la population, homme 3:1, calcification une à deux décennies plus tôt, car deux cuspides inégales subissent une contrainte mécanique plus forte.</li>
<li>Rhumatismal : rare en Suisse, migrants, atteinte mitrale associée. Pas de prévalence suisse publiée.</li></ul></template>

<template data-pop="pareto-i35-physra" data-title="Pareto — Physiopathologie du rétrécissement aortique">
<p class="ratio" data-cover="i35-3"></p>
<ul><li>Calcification active : initiation proche de l’athérosclérose (LDL, Lp(a), inflammation), puis propagation ostéogénique indépendante des lipides → statines inefficaces sur la valve.</li>
<li>Progression moyenne : Vmax +0,3 m/s/an, gradient +7 mmHg/an, SVA −0,1 cm²/an ; plus rapide si calcification marquée (la cuspide rigide subit plus de contrainte et calcifie davantage), âge, insuffisance rénale (excès de phosphate).</li>
<li>Surcharge de pression → hypertrophie concentrique (Laplace) → rigidité, ischémie sous-endocardique, fibrose.</li>
<li>Symptômes : dyspnée (rigidité puis baisse de FEVG), angor sans sténose coronaire, syncope d’effort (débit fixe, réflexe ventriculaire, arythmie).</li>
<li>Survie historique après symptôme : 5 ans (angor), 3 ans (syncope), 2 ans (insuffisance cardiaque).</li>
<li>Bas débit, bas gradient : classique (FEVG &lt; 50 %) ou paradoxal (FEVG ≥ 50 %, petit ventricule).</li>
<li>Syndrome de Heyde : destruction des grands multimères du facteur von Willebrand → saignements d’angiodysplasies, corrigés par le remplacement.</li></ul></template>

<template data-pop="pareto-i35-physia" data-title="Pareto — Physiopathologie de l’insuffisance aortique">
<p class="ratio" data-cover="i35-4"></p>
<ul><li>IA chronique : double surcharge (volume et pression) → dilatation et hypertrophie excentrique, compliance élevée, longue phase asymptomatique.</li>
<li>Pression pulsée large (systolique ↑ par le grand volume éjecté, diastolique ↓ par le reflux vers le ventricule) → signes périphériques.</li>
<li>Perfusion coronaire diastolique basse → angor nocturne ; bradycardie = diastole longue = plus de fuite → éviter les bêtabloquants.</li>
<li>Fibrose silencieuse → opérer sur seuils (diamètre, volume, FEVG), sans attendre les symptômes.</li>
<li>IA aiguë : ventricule normal non compliant → pression télédiastolique brutale, fermeture mitrale prématurée, œdème pulmonaire, choc ; pression pulsée normale et souffle bref : gravité sous-estimée.</li></ul></template>

<template data-pop="pareto-i35-etio" data-title="Pareto — Étiologies, bicuspidie et aortopathie">
<p class="ratio" data-cover="i35-5,i35-6"></p>
<ul><li>RA : calcifié (âgé), bicuspide (50–70 ans), rhumatismal (commissures fusionnées, mitrale atteinte), post-radique. Distinguer sous-valvulaire, supravalvulaire, cardiomyopathie hypertrophique obstructive.</li>
<li>IA : cuspides (bicuspidie, endocardite, rhumatisme, dégénérescence, radiothérapie, médicaments) ou racine (âge et hypertension, bicuspidie, Marfan et apparentés, aortites, spondylarthrite, dissection).</li>
<li>IA aiguë : endocardite, dissection de type A, traumatisme, iatrogène.</li>
<li>Racine dilatée chez le jeune : chercher Marfan ou Loeys-Dietz (seuils plus bas, dépistage familial).</li>
<li>Bicuspidie : raphé, fusion droite-gauche la plus fréquente (Sievers) ; évolution vers RA ou IA ; aortopathie chez environ la moitié.</li>
<li>Phénotype tubulaire (fréquent, avec RA) ; phénotype racine (homme jeune, IA, risque plus élevé).</li>
<li>Associations : coarctation, Turner ; dépistage échocardiographique des apparentés.</li>
<li>Imager toute l’aorte thoracique ; aorte remplacée dès 45 mm si la valve est opérée et le risque faible, car le geste ajouté évite une réintervention sur l’aorte.</li></ul></template>

<template data-pop="pareto-i35-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i35-7,i35-8"></p>
<ul><li>Question centrale : le patient est-il vraiment asymptomatique ? Chercher la réduction insidieuse de l’activité ; en cas de doute, épreuve d’effort.</li>
<li>Antécédents : souffle depuis l’enfance, rhumatisme, endocardite, radiothérapie, histoire familiale aortique, saignements digestifs.</li>
<li>Symptômes : dyspnée (fréquente), angor, syncope d’effort (grave), palpitations (IA), douleur brutale (dissection).</li>
<li>RA : souffle mésosystolique éjectionnel rude au foyer aortique irradiant aux carotides ; sévérité = pic tardif, B2 aboli, pouls parvus et tardus ; intensité trompeuse à bas débit ; Gallavardin à l’apex.</li>
<li>Bicuspidie jeune : clic protosystolique.</li>
<li>IA : souffle protodiastolique decrescendo, patient penché en avant ; durée = sévérité (sauf IA aiguë) ; bord droit = racine ; Austin Flint = IA sévère ; signes périphériques = pression pulsée large.</li>
<li>Manœuvres : Valsalva augmente seulement le souffle de la cardiomyopathie hypertrophique obstructive : la baisse du retour veineux rétrécit la cavité et aggrave l’obstruction dynamique, alors qu’elle diminue le débit à travers un obstacle valvulaire fixe.</li></ul></template>

<template data-pop="pareto-i35-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i35-9"></p>
<ul><li>Échocardiographie transthoracique = examen clé : Vmax (Doppler continu, plusieurs fenêtres), gradient moyen (Bernoulli 4V²), SVA (continuité).</li>
<li>Discordance (SVA &lt; 1 cm², gradient &lt; 40 mmHg) : 1) erreur de mesure (CCVG) ; 2) VESi ≤ 35 mL/m² ? ; 3) FEVG &lt; 50 % → dobutamine, puis score calcique ; FEVG ≥ 50 % → score calcique.</li>
<li>Pseudo-RA sévère : SVA &gt; 1 cm² sous dobutamine → pas de remplacement isolé.</li>
<li>IA : approche intégrée (vena contracta, demi-pression, reflux holodiastolique, surface régurgitante, volume régurgité) + dimensions et FEVG + aorte à quatre niveaux.</li>
<li>Épreuve d’effort chez l’asymptomatique (un tiers révèle des symptômes) ; contre-indiquée chez le symptomatique (risque de syncope et de mort subite, indication déjà posée).</li>
<li>Peptides &gt; 3 fois la normale = marqueur de risque ; scanner = calcium, planification TAVI, aorte, coronaires ; évaluation coronaire avant intervention.</li>
<li>Maladie mixte : Vmax et gradient intègrent les deux lésions, car le volume régurgité repasse la valve en systole ; décider selon la lésion dominante ; mixte modérée avec Vmax ≥ 4 m/s = RA sévère.</li>
<li>Différentiels graves d’abord : cardiomyopathie hypertrophique obstructive, dissection, endocardite.</li></ul></template>

<template data-pop="pareto-i35-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="i35-10"></p>
<ul><li>Quatre urgences : IA aiguë, dissection de type A, RA décompensé, endocardite destructrice.</li>
<li>IA aiguë : chirurgie urgente ; nitroprussiate + dobutamine en attendant ; ballon de contrepulsion (pression diastolique ↑) et bêtabloquants (diastole plus longue) contre-indiqués, car ils augmentent la fuite.</li>
<li>Dissection A : douleur déchirante, IA, asymétrie des pouls ; scanner en urgence ; chirurgie ; mortalité croissante avec le retard.</li>
<li>RA décompensé : précharge dépendante → diurétique prudent, pas de vasodilatateur sans surveillance, noradrénaline si hypotension ; TAVI, ou valvuloplastie au ballonnet en pont.</li>
<li>Mort subite rare chez l’asymptomatique (≤ 1 %/an), plus fréquente après les symptômes.</li>
<li>Blocs de conduction (voisinage du faisceau de His) ; fibrillation auriculaire mal tolérée dans le RA, car le ventricule rigide perd la contraction auriculaire qui assurait une part de son remplissage.</li></ul></template>

<template data-pop="pareto-i35-indic" data-title="Pareto — Indications d’intervention">
<p class="ratio" data-cover="i35-11"></p>
<ul><li>Aucun médicament ne traite la valve ; décision en Heart Team.</li>
<li>RA — classe I : symptômes (haut gradient ; bas débit à FEVG réduite confirmé) ; FEVG &lt; 50 % ; symptômes à l’effort ; chirurgie cardiaque concomitante. Paradoxal symptomatique confirmé : IIa.</li>
<li>RA asymptomatique, haut gradient, FEVG ≥ 50 %, faible risque : IIa, niveau A (nouveau 2025), alternative à la surveillance active.</li>
<li>Marqueurs 2025 (FEVG &gt; 55 %, effort normal) : gradient moyen ≥ 60 mmHg ou Vmax &gt; 5 m/s, progression ≥ 0,3 m/s par an sur valve très calcifiée, peptides &gt; 3× confirmés : IIa, B. RA modéré lors d’une autre chirurgie cardiaque : IIa.</li>
<li>Essais RECOVERY, AVATAR, EARLY TAVR, EVOLVED : moins d’événements composites et d’hospitalisations, pas de baisse démontrée de la mortalité.</li>
<li>IA — classe I : symptômes ; FEVG ≤ 50 %, DTSVG &gt; 50 mm ou &gt; 25 mm/m² ; chirurgie concomitante. IIb : FEVG ≤ 55 %, DTSVG &gt; 22 mm/m², volume télésystolique &gt; 45 mL/m². Réparation IIa ; TAVI inopérable IIb.</li>
<li>Aorte (ESC 2024) : 55 mm (tricuspide, bicuspide) ; 50 mm (Marfan, phénotype racine) ; 45 mm si la valve est opérée.</li></ul></template>

<template data-pop="pareto-i35-choix" data-title="Pareto — Technique, prothèse, antithrombotiques">
<p class="ratio" data-cover="i35-12"></p>
<ul><li>ESC/EACTS 2025 : TAVI si ≥ 70 ans, valve tricuspide, anatomie favorable (I, A) ; chirurgie si &lt; 70 ans à faible risque (I) ; bicuspidie à haut risque : TAVI IIb. ACC/AHA 2020 : chirurgie &lt; 65 ans, partage 65–80 ans, TAVI &gt; 80 ans.</li>
<li>Pour la chirurgie : jeune, bicuspidie, aorte, coronaires complexes, autre valve, anatomie défavorable. Pour le TAVI : âge, risque, fragilité, aorte porcelaine, radiothérapie, sternotomie antérieure.</li>
<li>Gestion sur toute la vie : valve-in-valve plus facile après bioprothèse chirurgicale qu’après TAVI (après TAVI, les cuspides refoulées par une seconde valve peuvent obstruer les coronaires) ; l’espérance de vie comparée à la durabilité de la prothèse prédit la réintervention.</li>
<li>Prothèse : mécanique &lt; 60 ans, biologique &gt; 65 ans ; bioprothèse si projet de grossesse ou anticoagulation impossible ; Ross chez l’adulte jeune en centre expert ; éviter le désaccord patient-prothèse.</li>
<li>Antithrombotiques : TAVI → aspirine seule 12 mois (I, A), puis au long cours à envisager (IIa, C) ; anticoagulé → anticoagulant seul ; bioprothèse chirurgicale → aspirine ou antivitamine K 3 mois, puis aspirine au long cours à envisager (IIb) ; mécanique → antivitamine K à vie, INR selon prothèse et facteurs de risque ; AOD interdits sur prothèse mécanique.</li>
<li>Thrombose infraclinique après TAVI : pas de dépistage ni d’anticoagulation systématique. Bloc de branche droit préexistant = risque de stimulateur, car la prothèse comprime la branche gauche, dernière voie de conduction.</li></ul></template>

<template data-pop="pareto-i35-suivi" data-title="Pareto — Suivi, pronostic et prévention">
<p class="ratio" data-cover="i35-13"></p>
<ul><li>Surveillance active : patient éduqué ; RA sévère asymptomatique au moins tous les 6 mois (clinique, échocardiographie, peptides) ; RA modéré calcifié chaque année ; RA léger tous les 2–3 ans.</li>
<li>IA sévère asymptomatique : 3–6 mois près des seuils, sinon annuel ; aorte ≥ 45 mm : imagerie annuelle par la même technique.</li>
<li>Après intervention : échocardiographie de référence, puis annuelle ; gradient +10 mmHg → thrombose, dégénérescence, endocardite. VARC-3 : modérée si +10 mmHg (≥ 20 mmHg) ou fuite modérée, sévère si +20 mmHg (≥ 30 mmHg) ou fuite sévère ; thrombose → antivitamine K ≥ 3 mois ; dégénérescence → valve-in-valve ou réintervention.</li>
<li>Prophylaxie de l’endocardite : prothèses (chirurgicales et TAVI) seulement, soins dentaires à risque ; valve native non (chapitre I33).</li>
<li>Rhumatisme : pénicilline G benzathine ; facteurs de risque ; pas de sport de compétition si RA sévère (débit fixe) ou aorte dilatée (pics de pression sur la paroi).</li>
<li>Pronostic : RA symptomatique non traité ≈ 50 % de décès à 1 an (PARTNER cohorte B) ; après remplacement précoce, survie proche de la population.</li></ul></template>

<template data-pop="pareto-i35-part" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i35-14"></p>
<ul><li>Grossesse : RA sévère mal toléré (débit ↑ à travers un orifice fixe), IA bien tolérée (résistances ↓ et tachycardie réduisent la fuite) ; RA sévère symptomatique = mWHO IV → intervenir avant ; bioprothèse si projet de grossesse (I) ; prothèse mécanique = haut risque ; arrêt des IEC et ARA II ; voie basse conseillée dans la plupart des cas.</li>
<li>Âgé fragile : l’âge seul ne contre-indique pas ; futilité → soins palliatifs.</li>
<li>Dialyse : calcification accélérée ; bioprothèse ou TAVI souvent préférés ; limiter le contraste.</li>
<li>Chirurgie non cardiaque : RA sévère symptomatique → remplacement avant une chirurgie à risque intermédiaire ou élevé ; éviter hypotension et tachycardie ; antivitamine K poursuivie pour les gestes mineurs.</li>
<li>Amylose ATTR chez 8 à 16 % des candidats âgés au TAVI : bas voltage, canal carpien, épargne apicale → scintigraphie ; le TAVI reste indiqué.</li>
<li>Saignement digestif + RA → Heyde → le remplacement valvulaire traite.</li>
<li>Démarche type : vérifier la mesure → débit → score calcique → symptômes à l’effort → Heart Team → coronaires → antithrombotique selon le rythme.</li></ul></template>

<template data-pop="pareto-i35-echo" data-title="Pareto — Échocardiographie du rétrécissement aortique">
<p class="ratio" data-cover="i35-e-1,i35-e-2"></p>
<ul><li>Échocardiographie transthoracique = référence de première ligne ; score calcique = référence des discordances ; IRM = référence des volumes ; cathétérisme = exception.</li>
<li>Grades : léger 2,6–2,9 m/s, &lt; 20 mmHg, &gt; 1,5 cm² ; modéré 3,0–3,9 m/s, 20–39 mmHg, 1,0–1,5 cm² ; sévère ≥ 4 m/s, ≥ 40 mmHg, &lt; 1 cm², indexée &lt; 0,6, rapport des vitesses &lt; 0,25.</li>
<li>Normales : Vmax 1,0–1,7 m/s ; CCVG 18–25 mm.</li>
<li>Bas débit : VESi ≤ 35 mL/m² (ou débit transvalvulaire &lt; 200 mL/s).</li>
<li>Pièges : diamètre de la CCVG élevé au carré ; jet mitral confondu ; hypertension ; obésité (ne pas indexer si indice de masse corporelle &gt; 30) ; récupération de pression si aorte &lt; 30 mm ; fibrillation auriculaire (moyenner 5 cycles).</li></ul></template>

<template data-pop="pareto-i35-discord" data-title="Pareto — Discordance">
<p class="ratio" data-cover="i35-e-3"></p>
<ul><li>Dobutamine (FEVG réduite) : paliers de 5 jusqu’à 20 µg/kg/min ; réserve si volume d’éjection +20 % ; vrai RA sévère si gradient ≥ 40 mmHg avec SVA ≤ 1 cm² ; pseudo si SVA &gt; 1 cm² ; surface projetée &lt; 1 cm² = sévère.</li>
<li>Score calcique (ESC 2021) : très probable homme ≥ 3 000, femme ≥ 1 600 ; probable ≥ 2 000 / ≥ 1 200 ; peu probable &lt; 1 600 / &lt; 800 unités Agatston. Non valable pour le rhumatismal ou le jeune bicuspide, où la fibrose plus que le calcium rigidifie les cuspides.</li>
<li>Quatre configurations : haut gradient ; bas débit classique ; bas débit paradoxal ; débit normal bas gradient (souvent modéré).</li>
<li>Paradoxal : faisceau d’arguments (âge &gt; 70 ans, symptômes, hypertrophie, gradient 30–40 mmHg, SVA ≤ 0,8 cm², calcium élevé).</li></ul></template>

<template data-pop="pareto-i35-iaex" data-title="Pareto — Insuffisance aortique et aorte">
<p class="ratio" data-cover="i35-e-4"></p>
<ul><li>IA sévère : vena contracta &gt; 6 mm ; jet ≥ 65 % de la CCVG ; demi-pression &lt; 200 ms ; reflux holodiastolique &gt; 20 cm/s (aorte descendante) ou abdominal ; surface régurgitante ≥ 30 mm² ; volume ≥ 60 mL ; fraction ≥ 50 %.</li>
<li>IA légère : vena contracta &lt; 3 mm, demi-pression &gt; 500 ms, surface &lt; 10 mm², volume &lt; 30 mL.</li>
<li>IRM : fraction régurgitée ≥ 30–35 % = sévère.</li>
<li>La demi-pression dépend des conditions de charge ; conclure sur un faisceau.</li>
<li>Seuils ventriculaires : DTSVG &gt; 50 mm ou &gt; 25 (22) mm/m², volume télésystolique &gt; 45 mL/m², FEVG ≤ 50 (55) % ; indexer chez les petits gabarits ; une FEVG de 55 % est déjà anormale dans l’IA sévère, car la précharge augmentée gonfle la FEVG.</li>
<li>Aorte : quatre niveaux ; anneau en milieu de systole, autres niveaux en fin de diastole ; suivi par la même technique, car tomodensitométrie et échocardiographie diffèrent de quelques millimètres.</li></ul></template>

<template data-pop="pareto-i35-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i35-e-5,i35-e-6"></p>
<ul><li>ECG : hypertrophie (Sokolow-Lyon &gt; 35 mm), surcharge ; blocs = extension de la calcification ; bloc de branche droit = risque de stimulateur après TAVI.</li>
<li>Radiographie : RA à silhouette normale, dilatation poststénotique ; IA à cardiomégalie ; aorte porcelaine → TAVI.</li>
<li>Biologie : peptides (&gt; 3× = risque), hémogramme et ferritine (Heyde), multimères du facteur von Willebrand, DFG, Lp(a) une fois (taux surtout génétique, stable), INR.</li>
<li>Effort anormal : symptômes, chute soutenue de la pression systolique &gt; 20 mmHg (moins spécifique : hausse &lt; 20 mmHg), arythmie ventriculaire.</li>
<li>Scanner de planification : anneau ovale (taille de prothèse), ostia, accès fémoral, coronaires. Coroscanner recommandé si la probabilité de maladie coronaire est ≤ 50 % (I, B, 2025) ; coronarographie omise si le scanner de planification suffit (IIa, B).</li>
<li>Cathétérisme et Gorlin : discordance persistante seulement.</li></ul></template>

<template data-pop="pareto-i35-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i35-sa,i35-sh,i35-sp,i35-sb,i35-sg"></p>
<ul><li>Racine : cuspides en couronne, anneau virtuel, sinus, jonction sinotubulaire. His sous le septum membraneux (entre coronaire droite et non coronaire) → blocs ; ostia bas → obstruction coronaire au TAVI ; continuité mitro-aortique → extension des abcès.</li>
<li>Cuspide : fibrosa (aortique, collagène), spongiosa, ventricularis (élastine) ; calcification côté aortique (flux oscillant).</li>
<li>Rhumatismal = fusion commissurale ; calcifié = commissures libres (ballonnet inefficace durablement) ; aortopathie = dégénérescence de la média qui persiste après remplacement valvulaire.</li>
<li>Continuité : SVA = surface CCVG × ITV CCVG / ITV valve. Bernoulli : gradient = 4V². Gradient ∝ débit² → bas débit = bas gradient.</li>
<li>Régurgitation ∝ orifice, gradient diastolique, durée de la diastole.</li>
<li>Calcification : Lp(a), autotaxine, NF-κB → Runx2, BMP2 → hydroxyapatite ; RANKL/OPG ; MGP dépendante de la vitamine K.</li>
<li>Heyde : ADAMTS13 clive les multimères dépliés par le cisaillement.</li>
<li>Génétique : <i>NOTCH1</i> (bicuspidie), Turner, <i>FBN1</i> → TGF-β → losartan, Loeys-Dietz, <i>COL3A1</i>, <i>LPA</i>.</li></ul></template>

<template data-pop="pareto-i35-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i35-p-1,i35-p-2,i35-p-3,i35-p-4,i35-p-5"></p>
<ul><li>Aucun médicament ne traite la valve ; les vasodilatateurs ne retardent pas la chirurgie de l’IA (Evangelista 2005) ; les statines ne freinent pas le RA.</li>
<li>Antithrombotiques : aspirine 75–100 mg/jour pendant 12 mois après TAVI, puis au long cours à envisager ; antivitamine K à vie sur prothèse mécanique (phenprocoumone, acénocoumarol) ; AOD seulement pour la fibrillation auriculaire sur bioprothèse ou TAVI, car la prothèse mécanique active la voie du facteur XII et produit plus de thrombine que les AOD n’en neutralisent.</li>
<li>Urgences : nitroprussiate 0,3 → 5 µg/kg/min (IA aiguë, bas débit sous surveillance), dobutamine 2–20 µg/kg/min, noradrénaline 0,2–1,0 µg/kg/min (hypotension du RA).</li>
<li>Aortopathie : bêtabloquant ou losartan jusqu’à 100 mg/jour à dose maximale tolérée (Marfan).</li>
<li>Grossesse sur prothèse mécanique : faible dose d’antivitamine K (phenprocoumone ≤ 3 mg, acénocoumarol ≤ 2 mg) ou énoxaparine ajustée à l’anti-Xa 0,8–1,2 U/mL.</li>
<li>Dangers : AOD sur prothèse mécanique ; interactions de l’antivitamine K (amiodarone, antibiotiques, azolés) ; nitrés et inhibiteurs de la phosphodiestérase 5 dans le RA sévère ; bêtabloquant dans l’IA aiguë ; IEC, ARA II et antivitamine K pendant la grossesse ; fluoroquinolones dans l’anévrisme aortique.</li>
<li>Prévention : pénicilline G benzathine 1,2 million d’unités toutes les 3–4 semaines ; amoxicilline 2 g avant soin dentaire à risque sur prothèse.</li></ul></template>
