
<!-- ===== FENÊTRES I35 : notions et physiopathologie ===== -->
<template data-pop="i35-bernoulli" data-title="Équation de Bernoulli simplifiée">
<div class="lab">Formule</div><p>Gradient de pression (mmHg) = 4 × V² (V en m/s). Elle convertit une vitesse mesurée au Doppler continu en différence de pression à travers l’orifice.</p>
<div class="lab">Exemple</div><p>Vmax 4 m/s : gradient maximal instantané 4 × 16 = 64 mmHg. Vmax 5 m/s : 100 mmHg. Doubler la vitesse multiplie le gradient par quatre.</p>
<div class="lab">Gradient maximal et gradient moyen</div><p>Le gradient maximal correspond au pic de vitesse ; le gradient moyen est la moyenne des gradients instantanés sur toute l’éjection. Les seuils de décision utilisent le gradient moyen (≥ 40 mmHg pour le RA sévère).</p>
<div class="lab">Limites</div><p>La forme simplifiée néglige la vitesse sous-valvulaire ; si celle-ci dépasse 1,5 m/s (hyperdébit, obstacle sous-valvulaire), utiliser 4 × (Vmax² − V CCVG²). Un mauvais alignement du faisceau Doppler sous-estime la vitesse, jamais ne la surestime.</p>
<div class="lab">Piège</div><p>Le gradient « pic à pic » du cathétérisme (différence entre pic ventriculaire et pic aortique, qui ne sont pas simultanés) est inférieur au gradient maximal instantané du Doppler : les deux ne se comparent pas.</p></template>

<template data-pop="i35-continuite" data-title="Équation de continuité">
<div class="lab">Principe</div><p>Le débit qui traverse la chambre de chasse du ventricule gauche (CCVG) traverse ensuite l’orifice aortique. Débit = surface × intégrale temps-vitesse (ITV).</p>
<div class="lab">Formule</div><p>SVA = [π × (diamètre CCVG / 2)²] × ITV CCVG / ITV transvalvulaire.</p>
<div class="lab">Exemple chiffré</div><p>Diamètre de la CCVG 2,0 cm : surface 3,14 cm². ITV CCVG 20 cm ; ITV valve 100 cm. Volume d’éjection = 3,14 × 20 ≈ 63 mL. SVA = 3,14 × 20 / 100 ≈ 0,63 cm² : RA sévère.</p>
<div class="lab">Source d’erreur principale</div><p>Le diamètre de la CCVG, élevé au carré. Mesure en mésosystole, en coupe parasternale grand axe zoomée, au ras de l’insertion des cuspides. En cas de doute, le rapport des vitesses (ITV CCVG / ITV valve, sévère si &lt; 0,25) s’affranchit du diamètre.</p></template>

<template data-pop="i35-calcif" data-title="Calcification valvulaire aortique : processus actif">
<div class="lab">Phase d’initiation</div><p>Lésion endothéliale du côté aortique, pénétration du cholestérol LDL et de la Lp(a), oxydation des lipides, inflammation (macrophages, lymphocytes T). Elle ressemble à l’athérosclérose.</p>
<div class="lab">Phase de propagation</div><p>Différenciation ostéogénique des cellules interstitielles valvulaires, microcalcifications qui fusionnent en nodules ; la rigidité accroît la contrainte mécanique, qui entretient la calcification. Le processus devient indépendant des lipides.</p>
<div class="lab">Facteurs de risque</div><p>Âge, sexe masculin, hypertension, tabac, cholestérol LDL, Lp(a) élevée, diabète, syndrome métabolique, insuffisance rénale chronique, bicuspidie.</p>
<div class="lab">Différence entre sexes</div><p>À sévérité égale, la femme a moins de calcium et plus de fibrose valvulaire : les seuils de score calcique sont plus bas chez elle.</p>
<div class="lab">Conséquence thérapeutique</div><p>Les statines, efficaces sur l’athérosclérose, n’ont pas ralenti le RA établi. Aucun traitement médical n’est validé pour freiner la calcification.</p></template>

<template data-pop="i35-lpa" data-title="Lipoprotéine(a) et rétrécissement aortique">
<div class="lab">Structure</div><p>Particule proche du LDL, à laquelle est liée l’apolipoprotéine(a). Son taux est déterminé à plus de 90 % par le gène <i>LPA</i> et varie peu au cours de la vie.</p>
<div class="lab">Lien avec la valve</div><p>La Lp(a) transporte des phospholipides oxydés et l’autotaxine, qui activent l’inflammation et la différenciation ostéogénique des cellules valvulaires. Des taux élevés sont associés à l’apparition et à la progression plus rapide du RA calcifié.</p>
<div class="lab">Mesure</div><p>Un dosage dans la vie adulte suffit. Seuil de risque usuel : &gt; 50 mg/dL (environ 105 à 125 nmol/L selon la méthode ; déclaration de consensus de l’EAS 2022).</p>
<div class="lab">Traitement</div><p>Aucun traitement n’a démontré de ralentissement du RA. Des molécules qui abaissent fortement la Lp(a) (oligonucléotides antisens, petits ARN interférents) sont évaluées pour les événements cardiovasculaires ; leur effet sur la valve reste à établir.</p></template>

<template data-pop="i35-hvg" data-title="Hypertrophie concentrique du rétrécissement aortique">
<div class="lab">Mécanisme</div><p>La surcharge de pression augmente la contrainte pariétale systolique. Selon la loi de Laplace (contrainte = (pression × rayon) / (2 × épaisseur)), l’épaississement de la paroi normalise la contrainte.</p>
<div class="lab">Mesure</div><p>Épaisseur relative de paroi (2 × paroi postérieure / diamètre télédiastolique) &gt; 0,42 avec une masse augmentée : hypertrophie concentrique.</p>
<div class="lab">Conséquences délétères</div><p>Rigidité (dysfonction diastolique, dyspnée d’effort), ischémie sous-endocardique, fibrose d’abord diffuse et réversible, puis fibrose de remplacement irréversible, visible à l’IRM (rehaussement tardif au gadolinium).</p>
<div class="lab">Après remplacement valvulaire</div><p>La masse ventriculaire régresse en partie au cours de la première année ; la fibrose de remplacement ne régresse pas et pèse sur le pronostic. C’est l’hypothèse testée par l’essai EVOLVED.</p></template>

<template data-pop="i35-ischemie" data-title="Angor du rétrécissement aortique">
<div class="lab">Mécanisme</div><p>Besoins en oxygène augmentés (masse, pression systolique, durée d’éjection prolongée) ; apports réduits : réserve coronaire diminuée, compression du sous-endocarde par une pression télédiastolique élevée, diastole raccourcie à l’effort, raréfaction capillaire relative.</p>
<div class="lab">Conséquence</div><p>L’angor survient même avec des coronaires angiographiquement normales. Il n’établit donc pas la présence d’une maladie coronaire.</p>
<div class="lab">Maladie coronaire associée</div><p>Fréquente chez le sujet âgé, car les facteurs de risque sont communs. Elle est recherchée avant toute intervention (coroscanner ou coronarographie).</p>
<div class="lab">Piège</div><p>Les tests d’ischémie non invasifs sont peu fiables dans le RA sévère (sous-décalage du segment ST fréquent sans sténose coronaire) et l’effort maximal y est contre-indiqué chez le symptomatique.</p></template>

<template data-pop="i35-syncope" data-title="Syncope d’effort du rétrécissement aortique">
<div class="lab">Caractéristiques</div><p>Perte de connaissance brève pendant ou juste après un effort, parfois précédée de vertige ou de vision trouble ; récupération rapide. Une présyncope d’effort a la même valeur.</p>
<div class="lab">Mécanismes</div><p>(1) Débit fixe : la vasodilatation musculaire d’effort n’est pas compensée par une hausse du débit. (2) Réflexe inapproprié : l’étirement des mécanorécepteurs ventriculaires par des pressions très élevées provoque une vasodilatation et une bradycardie réflexes. (3) Arythmies : bloc auriculoventriculaire, tachycardie ventriculaire.</p>
<div class="lab">Valeur</div><p>C’est un symptôme de RA sévère qui impose l’intervention. Elle a aussi un pronostic péjoratif (survie médiane d’environ trois ans sans traitement dans les séries historiques).</p>
<div class="lab">Diagnostic différentiel</div><p>Syncope réflexe, hypotension orthostatique sous traitement, bloc de conduction indépendant, cardiomyopathie hypertrophique obstructive. Une syncope de repos oriente vers une arythmie.</p></template>

<template data-pop="i35-lflg-class" data-title="Rétrécissement aortique à bas débit et bas gradient, FEVG réduite">
<div class="lab">Définition</div><p>SVA &lt; 1 cm², gradient moyen &lt; 40 mmHg, FEVG &lt; 50 %, VESi ≤ 35 mL/m².</p>
<div class="lab">Question</div><p>Deux situations donnent cette image : un RA sévère qui a épuisé le ventricule (vrai RA sévère), ou une cardiomyopathie qui ouvre mal une valve modérément atteinte (pseudo-RA sévère).</p>
<div class="lab">Démarche</div><p>Échocardiographie à faible dose de dobutamine ; si la réserve contractile manque, score calcique en tomodensitométrie.</p>
<div class="lab">Conduite</div><p>Vrai RA sévère : intervention recommandée (classe I). Le TAVI est souvent préféré chez ces patients à risque opératoire élevé. Pseudo-RA sévère : traitement de l’insuffisance cardiaque, surveillance de la valve.</p>
<div class="lab">Pronostic</div><p>Sans réserve contractile, la mortalité opératoire est plus élevée, mais le remplacement améliore la survie par rapport au traitement médical lorsque le RA est sévère.</p></template>

<template data-pop="i35-lflg-parad" data-title="Rétrécissement aortique à bas débit paradoxal (FEVG préservée)">
<div class="lab">Définition</div><p>SVA &lt; 1 cm², gradient moyen &lt; 40 mmHg, FEVG ≥ 50 %, VESi ≤ 35 mL/m².</p>
<div class="lab">Mécanismes du bas débit</div><p>Petit ventricule hypertrophié à faible volume télédiastolique ; fonction longitudinale altérée malgré une FEVG normale ; postcharge élevée (hypertension, rigidité artérielle) ; fibrillation auriculaire ; insuffisance mitrale ou tricuspide associée.</p>
<div class="lab">Terrain</div><p>Sujet âgé, souvent femme, hypertendu.</p>
<div class="lab">Diagnostic</div><p>Exclure les erreurs de mesure ; contrôler la pression artérielle ; score calcique en tomodensitométrie ; faisceau d’arguments de l’ESC 2021 (âge, symptômes, hypertrophie, gradient 30–40 mmHg, SVA ≤ 0,8 cm², bas débit confirmé).</p>
<div class="lab">Conduite</div><p>Intervention à envisager chez le symptomatique lorsque la sévérité est confirmée (classe IIa, niveau B, ESC/EACTS 2025, reconduit).</p></template>

<template data-pop="i35-mnemo-532" data-title="Repère 5-3-2 (aide pédagogique, non critère officiel)">
<p>Dans la série historique de Ross et Braunwald (1968), la survie médiane après l’apparition du symptôme était d’environ :</p>
<ul><li><b>5 ans</b> après l’angor ;</li><li><b>3 ans</b> après la syncope ;</li><li><b>2 ans</b> après l’insuffisance cardiaque.</li></ul>
<div class="lab">Portée</div><p>Ces chiffres datent d’une époque sans échocardiographie ni traitement moderne. Leur message reste valable : dès qu’un symptôme apparaît, le pronostic change et l’intervention s’impose. Aide pédagogique, non critère officiel.</p></template>

<template data-pop="i35-heyde" data-title="Syndrome de Heyde">
<div class="lab">Définition</div><p>Association d’un RA, de saignements digestifs sur angiodysplasies et d’un déficit acquis en facteur von Willebrand de type 2A.</p>
<div class="lab">Mécanisme</div><p>Le flux très rapide à travers la valve déplie les grands multimères du facteur von Willebrand, qui sont clivés par la protéase ADAMTS13. Or ces grands multimères sont indispensables à l’hémostase dans les capillaires à haut cisaillement des angiodysplasies.</p>
<div class="lab">Diagnostic</div><p>Anémie ferriprive, endoscopie (capsule si nécessaire), analyse des multimères du facteur von Willebrand, rapport activité/antigène abaissé.</p>
<div class="lab">Traitement</div><p>Le remplacement valvulaire (chirurgie ou TAVI) corrige le déficit et réduit nettement les récidives. Traitement endoscopique des lésions ; fer.</p>
<div class="lab">Piège</div><p>Traiter seulement l’anémie sans rechercher le RA, ou contre-indiquer l’intervention à cause des saignements alors qu’elle les traite.</p></template>

<template data-pop="i35-ia-chron" data-title="Insuffisance aortique chronique : hypertrophie excentrique">
<div class="lab">Adaptation</div><p>Le ventricule se dilate par ajout de sarcomères en série et devient plus compliant : il accueille un grand volume télédiastolique sans élévation de la pression de remplissage. Le volume d’éjection total augmente et maintient le débit utile.</p>
<div class="lab">Double surcharge</div><p>Surcharge de volume (volume régurgité) et de pression (pression systolique élevée, rayon augmenté) : la paroi s’épaissit aussi.</p>
<div class="lab">Décompensation</div><p>La fibrose interstitielle progresse, la contractilité baisse, le volume télésystolique augmente, puis la FEVG diminue et la pression de remplissage s’élève. Le diamètre et le volume télésystoliques sont les meilleurs marqueurs précoces.</p>
<div class="lab">Conséquence pratique</div><p>Opérer sur des seuils de dimension et de FEVG avant les symptômes, car la dysfonction installée ne régresse pas toujours après la chirurgie.</p></template>

<template data-pop="i35-ia-aigue" data-title="Insuffisance aortique aiguë">
<div class="lab">Causes</div><p>Endocardite infectieuse, dissection aortique de type A, traumatisme thoracique, complication d’une intervention, dysfonction aiguë de prothèse.</p>
<div class="lab">Hémodynamique</div><p>Ventricule de taille normale, peu compliant : la pression télédiastolique monte brutalement, la valve mitrale se ferme prématurément, la pression capillaire pulmonaire s’élève ; le débit utile chute.</p>
<div class="lab">Clinique</div><p>Œdème pulmonaire, tachycardie, hypotension, choc. Souffle diastolique bref et doux, pression pulsée normale, pas de signes périphériques : la gravité est sous-estimée.</p>
<div class="lab">Échocardiographie</div><p>Fuite importante, temps de demi-décroissance de pression très court, fermeture mitrale prématurée, reflux holodiastolique ; recherche de végétation ou de flap de dissection ; échocardiographie transœsophagienne.</p>
<div class="lab">Traitement</div><p>Chirurgie en urgence. En attendant : nitroprussiate de sodium, dobutamine, surveillance invasive. Contre-indiqués : ballon de contrepulsion intra-aortique ; bêtabloquants, sauf prudemment dans la dissection.</p></template>

<template data-pop="i35-stades" data-title="Stades ACC/AHA 2020 des valvulopathies aortiques">
<table class="t"><tr><th>Stade</th><th>Rétrécissement aortique</th><th>Insuffisance aortique</th></tr>
<tr><td>A — à risque</td><td>Bicuspidie, sclérose aortique</td><td>Bicuspidie, aorte dilatée, antécédent de rhumatisme ou d’endocardite</td></tr>
<tr><td>B — progressif</td><td>RA léger à modéré</td><td>IA légère à modérée</td></tr>
<tr><td>C — sévère asymptomatique</td><td>Sous-stade 1 : FEVG normale ; sous-stade 2 : FEVG &lt; 50 %</td><td>Sous-stade 1 : FEVG ≥ 55 %, DTSVG ≤ 50 mm ; sous-stade 2 : FEVG ≤ 55 % ou DTSVG &gt; 50 mm (ou &gt; 25 mm/m²)</td></tr>
<tr><td>D — sévère symptomatique</td><td>Sous-stade 1 : haut gradient ; sous-stade 2 : bas débit, FEVG réduite ; sous-stade 3 : bas débit paradoxal</td><td>Symptômes, quelle que soit la FEVG</td></tr></table>
<div class="lab">Usage</div><p>Classification américaine ; l’ESC utilise des critères équivalents sans ces lettres. Utile pour lire la littérature et structurer la décision.</p></template>

<template data-pop="i35-grades" data-title="Grades de sévérité du rétrécissement aortique">
<table class="t"><tr><th>Grade</th><th>Vmax</th><th>Gradient moyen</th><th>SVA</th></tr>
<tr><td>Sclérose</td><td>≤ 2,5 m/s</td><td>—</td><td>—</td></tr>
<tr><td>Léger</td><td>2,6–2,9 m/s</td><td>&lt; 20 mmHg</td><td>&gt; 1,5 cm²</td></tr>
<tr><td>Modéré</td><td>3,0–3,9 m/s</td><td>20–39 mmHg</td><td>1,0–1,5 cm²</td></tr>
<tr><td>Sévère</td><td>≥ 4,0 m/s</td><td>≥ 40 mmHg</td><td>&lt; 1,0 cm² (indexée &lt; 0,6 cm²/m²)</td></tr></table>
<div class="lab">Règle</div><p>Si les trois critères concordent, la sévérité est établie. S’ils divergent, rechercher d’abord une erreur de mesure, puis évaluer le débit (VESi). Source : ASE/EACVI 2017, ESC/EACTS 2021 et 2025.</p></template>

<template data-pop="i35-iaquant" data-title="Quantification de l’insuffisance aortique">
<div class="lab">Critères d’IA sévère</div><p>Vena contracta &gt; 6 mm ; largeur du jet ≥ 65 % de la CCVG ; temps de demi-décroissance de pression &lt; 200 ms ; reflux holodiastolique dans l’aorte descendante (vitesse télédiastolique &gt; 20 cm/s) ou abdominale ; surface de l’orifice régurgitant effective ≥ 30 mm² ; volume régurgité ≥ 60 mL ; fraction régurgitée ≥ 50 %.</p>
<div class="lab">Retentissement</div><p>Dilatation ventriculaire gauche ; diamètre et volume télésystoliques ; FEVG.</p>
<div class="lab">Règle</div><p>Conclure sur un faisceau concordant (EACVI). En cas de discordance, l’IRM mesure le volume et la fraction régurgités par contraste de phase.</p>
<div class="lab">Piège</div><p>Le temps de demi-décroissance de pression raccourcit aussi quand la pression télédiastolique est élevée (IA aiguë, dysfonction diastolique) et s’allonge sous vasodilatateur : il dépend des conditions de charge.</p></template>

<template data-pop="i35-sievers" data-title="Classification de la valve bicuspide">
<div class="lab">Sievers (2007)</div><p>Type 0 : deux cuspides sans raphé (bicuspidie « vraie »). Type 1 : un raphé ; la fusion coronaire droite–coronaire gauche est la plus fréquente, puis droite–non coronaire, rarement gauche–non coronaire. Type 2 : deux raphés (forme proche de la valve unicuspide).</p>
<div class="lab">Consensus international 2021</div><p>Trois catégories : bicuspidie fusionnée (la plus fréquente), bicuspidie à deux sinus, bicuspidie à fusion partielle (forme fruste).</p>
<div class="lab">Intérêt</div><p>La fusion droite–non coronaire s’associe davantage à une dilatation de l’aorte tubulaire et à une évolution vers la sténose ; l’orientation guide la réparation et la faisabilité du TAVI.</p></template>

<template data-pop="i35-aortopathie" data-title="Aortopathie de la bicuspidie">
<div class="lab">Fréquence</div><p>Environ la moitié des porteurs d’une bicuspidie ont une aorte ascendante dilatée.</p>
<div class="lab">Mécanismes</div><p>Fragilité génétique de la média (dégénérescence des lames élastiques) et flux systolique excentrique qui frappe la paroi convexe de l’aorte ascendante.</p>
<div class="lab">Phénotypes</div><p>Tubulaire (le plus fréquent, souvent avec RA) ; racine (sinus de Valsalva, souvent avec IA chez l’homme jeune, risque plus élevé).</p>
<div class="lab">Facteurs de risque de dissection</div><p>Phénotype racine, histoire familiale de dissection, coarctation, croissance rapide, hypertension non contrôlée, diamètre élevé.</p>
<div class="lab">Suivi</div><p>Imagerie de toute l’aorte thoracique au diagnostic ; contrôle au moins annuel si ≥ 45 mm ou croissance rapide. La dilatation peut continuer après un remplacement valvulaire isolé.</p></template>

<template data-pop="i35-marfan" data-title="Syndrome de Marfan et aortopathies héréditaires">
<div class="lab">Syndrome de Marfan</div><p>Maladie autosomique dominante du gène <i>FBN1</i>. Critères de Gand révisés (2010) : dilatation de la racine (score Z ≥ 2) associée à une ectopie du cristallin ou à un variant causal de <i>FBN1</i> suffit au diagnostic. Signes : grande taille, arachnodactylie, déformations thoraciques, myopie, pneumothorax.</p>
<div class="lab">Aorte</div><p>Dilatation de la racine, IA secondaire. Chirurgie à 50 mm ; plus tôt (45 mm) avec facteurs de risque. Traitement par bêtabloquant ou ARA II à dose maximale tolérée.</p>
<div class="lab">Syndrome de Loeys-Dietz</div><p>Gènes de la voie du TGF-β ; tortuosité artérielle, luette bifide, hypertélorisme ; dissections à de petits diamètres ; seuils selon le gène.</p>
<div class="lab">Syndrome d’Ehlers-Danlos vasculaire</div><p>Gène <i>COL3A1</i> ; ruptures artérielles et digestives ; fragilité tissulaire majeure.</p>
<div class="lab">Toujours</div><p>Conseil génétique, dépistage des apparentés, conseil préconceptionnel.</p></template>

<template data-pop="i35-rhumat" data-title="Rhumatisme articulaire aigu et valve aortique">
<div class="lab">Mécanisme</div><p>Après une pharyngite à streptocoque du groupe A, des anticorps dirigés contre la protéine M reconnaissent par mimétisme moléculaire des protéines valvulaires. L’inflammation répétée fibrose et rétracte les valves.</p>
<div class="lab">Diagnostic de la poussée</div><p>Critères de Jones révisés (2015) : cardite, polyarthrite, chorée, érythème marginé, nodules sous-cutanés ; preuve d’infection streptococcique récente.</p>
<div class="lab">Lésions aortiques</div><p>Fusion commissurale, rétraction des bords libres : sténose, fuite ou association. La valve mitrale est presque toujours atteinte.</p>
<div class="lab">En Suisse</div><p>Rare dans la population née en Suisse ; à évoquer chez les personnes ayant grandi en Afrique, en Asie du Sud, en Asie occidentale ou en Océanie.</p>
<div class="lab">Prévention secondaire</div><p>Pénicilline G benzathine toutes les 3 à 4 semaines ; durée d’au moins 10 ans après la dernière poussée, prolongée jusqu’à l’âge de 40 ans ou plus en cas d’atteinte valvulaire (OMS, AHA).</p></template>

<template data-pop="i35-seuils-aorte" data-title="Seuils de chirurgie de l’aorte ascendante (ESC 2024)">
<table class="t"><tr><th>Situation</th><th>Seuil</th></tr>
<tr><td>Valve tricuspide</td><td>≥ 55 mm (I) ; ≥ 52 mm si risque faible (IIa)</td></tr>
<tr><td>Bicuspidie</td><td>≥ 55 mm ; ≥ 50 mm dans le phénotype racine (I)</td></tr>
<tr><td>Chirurgie valvulaire aortique concomitante</td><td>≥ 45 mm si risque faible ; ≥ 50 mm sinon</td></tr>
<tr><td>Syndrome de Marfan</td><td>≥ 50 mm ; ≥ 45 mm avec facteurs de risque</td></tr></table>
<div class="lab">Repère « 55-50-45 » (aide pédagogique, non critère officiel)</div><p>55 mm : aorte isolée ; 50 mm : terrain fragile (Marfan, phénotype racine) ; 45 mm : si l’on opère déjà la valve.</p>
<div class="lab">Facteurs qui abaissent le seuil</div><p>Histoire familiale de dissection, croissance rapide confirmée, coarctation, hypertension non contrôlée, projet de grossesse, petite taille (valeurs indexées).</p></template>
