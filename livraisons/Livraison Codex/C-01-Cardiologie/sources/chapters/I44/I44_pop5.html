
<!-- ===== FENÊTRES I44 : monographies ===== -->
<template data-pop="i44-d-atro" data-title="Atropine">
<div class="lab">Mécanisme</div><p>Antagoniste compétitif des récepteurs muscariniques : lève le frein vagal sur le nœud sinusal et le nœud auriculoventriculaire. Aucun effet direct sur le système His-Purkinje.</p>
<div class="lab">Preuves</div><p>Efficacité documentée dans les bradycardies sinusales et les blocs nodaux, notamment de l’infarctus inférieur ; efficacité faible ou nulle dans les blocs infranodaux. Pas d’essai de morbi-mortalité ; recommandation de première ligne de l’ERC 2025.</p>
<div class="lab">Posologie</div><p>ERC 2025 : 500 µg par voie intraveineuse, à répéter toutes les 3 à 5 minutes, jusqu’à 3 mg au total. L’algorithme américain de l’AHA 2025 retient 1 mg toutes les 3 à 5 minutes, jusqu’à 3 mg : les deux référentiels coexistent. Une dose de 3 mg réalise un blocage vagal complet.</p>
<div class="lab">Effets indésirables</div><p>Tachycardie et hausse de la consommation d’oxygène (prudence dans l’ischémie), sécheresse buccale, rétention urinaire, mydriase, confusion ou agitation chez le sujet âgé.</p>
<div class="lab">Contre-indications et pièges</div><p>Glaucome à angle fermé ; cœur transplanté (inefficace, risque de bloc paradoxal) ; bloc infranodal (inefficace, peut aggraver le rapport de conduction en accélérant le sinus). Des doses inférieures à 0,5 mg ont été associées à une bradycardie paradoxale. Le mécanisme reste débattu : effet vagal central, ou blocage préférentiel des récepteurs muscariniques présynaptiques qui freinent normalement la libération d’acétylcholine.</p>
<div class="lab">Surveillance</div><p>Fréquence, rapport de conduction, signes d’ischémie.</p></template>

<template data-pop="i44-d-iso" data-title="Isoprénaline">
<div class="lab">Mécanisme</div><p>Agoniste β1 et β2 pur : accélère l’automatisme sinusal, jonctionnel et ventriculaire, améliore la conduction nodale ; vasodilatation par β2.</p>
<div class="lab">Place</div><p>Bradycardie instable après échec de l’atropine, bloc infranodal (accélère l’échappement), cœur transplanté ; pont vers la stimulation. Également utilisée dans les torsades de pointes dépendantes des pauses et dans l’orage rythmique du syndrome de Brugada.</p>
<div class="lab">Posologie</div><p>5 µg/min en perfusion intraveineuse, ajustée à la fréquence et à la pression (ERC 2025).</p>
<div class="lab">Effets indésirables</div><p>Ischémie myocardique, extrasystoles et tachycardies ventriculaires, hypotension par vasodilatation, hypokaliémie.</p>
<div class="lab">Contre-indications</div><p>Syndrome coronarien aigu et hypotension marquée (préférer l’adrénaline), car la vasodilatation β2 abaisse la pression de perfusion coronaire au moment où la tachycardie accroît la consommation d’oxygène ; intoxication digitalique, car la toxicité associe déjà un automatisme accru que la stimulation β renforcerait.</p>
<div class="lab">Remarque</div><p>Molécule absente de certains services ; l’adrénaline en perfusion est l’alternative habituelle.</p></template>

<template data-pop="i44-d-adre" data-title="Adrénaline en perfusion">
<div class="lab">Mécanisme</div><p>Agoniste α et β : chronotrope et inotrope positif (β1), vasoconstricteur (α1) à dose croissante.</p>
<div class="lab">Place</div><p>Bradycardie avec hypotension ou choc, après échec de l’atropine ; syndrome BRASH ; intoxications.</p>
<div class="lab">Posologie</div><p>2 à 10 µg/min en perfusion intraveineuse, titrée sur la fréquence et la pression (ERC 2025, AHA 2025).</p>
<div class="lab">Effets indésirables</div><p>Tachyarythmies, ischémie, hyperglycémie, hyperlactatémie, nécrose en cas d’extravasation.</p>
<div class="lab">Surveillance</div><p>Monitorage continu, pression artérielle invasive si la perfusion se prolonge, voie veineuse centrale dès que possible.</p></template>

<template data-pop="i44-d-dopa" data-title="Dopamine">
<div class="lab">Mécanisme</div><p>Agoniste dopaminergique, β1 puis α selon la dose.</p>
<div class="lab">Posologie</div><p>5 à 20 µg/kg/min en perfusion, titrée (algorithme AHA 2025).</p>
<div class="lab">Place</div><p>Alternative à l’adrénaline ; moins utilisée en Europe en raison d’un risque arythmique plus élevé, observé dans les états de choc : chez 1 679 patients, elle a provoqué deux fois plus d’arythmies que la noradrénaline (24,1 % contre 12,4 %), sans différence significative de mortalité. Dans la bradycardie instable résistante à l’atropine, un essai préhospitalier de faisabilité n’a pas montré de différence de survie entre dopamine et stimulation transcutanée (70 % contre 69 %).</p>
<div class="lab">Effets indésirables</div><p>Tachyarythmies, ischémie, nécrose cutanée en cas d’extravasation.</p></template>

<template data-pop="i44-d-theo" data-title="Aminophylline et théophylline">
<div class="lab">Mécanisme</div><p>Antagonisme des récepteurs de l’adénosine. L’adénosine, libérée par l’ischémie ou l’hypoxie, ralentit le sinus et bloque le nœud ; ce blocage résiste à l’atropine.</p>
<div class="lab">Place</div><p>BAV de l’infarctus inférieur résistant à l’atropine ; bradycardie du cœur transplanté ; bradycardie des lésions médullaires cervicales hautes. Alternative citée par l’ERC 2025, qui la recommande aussi chez le transplanté.</p>
<div class="lab">Posologie</div><p>Aminophylline 100 à 200 mg par voie intraveineuse lente (ERC 2025, même dose qu’en 2021).</p>
<div class="lab">Effets indésirables</div><p>Nausées, tremblements, tachyarythmies, convulsions ; marge thérapeutique étroite.</p>
<div class="lab">Interactions</div><p>Concentration augmentée par la ciprofloxacine, la clarithromycine, la fluvoxamine (inhibition du CYP1A2).</p>
<div class="lab">Cœur transplanté</div><p>Le greffon est dénervé : il n’a plus de tonus vagal sur lequel l’atropine pourrait agir. Son sinus et son nœud répondent en outre trois à six fois plus à l’adénosine que ceux d’un cœur innervé ; un antagoniste de l’adénosine vise donc le frein qui persiste.</p>
<div class="lab">Lésion médullaire cervicale haute</div><p>La lésion interrompt la commande sympathique du cœur, alors que le vague reste intact : bradycardies et asystolies en résultent. La théophylline y repose sur des séries de cas ; dans la plus grande, 17 patients sur 26 ont répondu, avec moins d’épisodes ou l’arrêt des vasopresseurs.</p>
<div class="lab">Limite</div><p>Elle ne remplace pas la stimulation d’une maladie du sinus symptomatique : dans un essai randomisé de 107 patients, les syncopes et l’insuffisance cardiaque ont été moins fréquentes sous stimulateur que sous théophylline orale ou sans traitement (ESC 2021).</p>
<div class="lab">Source complémentaire</div><p>Ellenbogen et al., Electrophysiological effects of adenosine in the transplanted human heart: evidence of supersensitivity, Circulation 1990;81:821–828 ; Perrine et al., Theophylline for spinal cord injury associated bradycardia, J Pharm Pract 2023;36:579–583 ; Glikson et al., 2021 ESC Guidelines on cardiac pacing, Eur Heart J 2021;42:3427–3520 (section 5.1.1.1).</p>
</template>

<template data-pop="i44-d-glucagon" data-title="Glucagon">
<div class="lab">Mécanisme</div><p>Active l’adénylate cyclase par son propre récepteur, sans passer par le récepteur β : l’AMPc augmente malgré le blocage β, avec des effets chronotrope et inotrope positifs.</p>
<div class="lab">Place</div><p>Intoxication aux bêtabloquants surtout, aux inhibiteurs calciques en appoint. Alternative citée par l’ERC 2025.</p>
<div class="lab">Posologie</div><p>50 à 150 µg/kg (soit environ 3,5 à 10 mg chez un adulte de 70 kg) en bolus intraveineux lent, puis perfusion horaire de la dose efficace ; dose à valider avec Tox Info Suisse (145).</p>
<div class="lab">Effets indésirables</div><p>Vomissements (protéger les voies aériennes), hyperglycémie, hypokaliémie.</p>
<div class="lab">Contrainte pratique</div><p>Les doses nécessaires dépassent souvent le stock d’un service : prévenir la pharmacie hospitalière tôt.</p></template>

<template data-pop="i44-d-calcium" data-title="Sels de calcium intraveineux">
<div class="lab">Mécanisme</div><p>Hyperkaliémie : le calcium extracellulaire élève le seuil de dépolarisation et restaure l’excitabilité, sans baisser la kaliémie. Intoxication aux inhibiteurs calciques : augmente le calcium disponible pour l’entrée résiduelle par les canaux.</p>
<div class="lab">Posologie</div><p>Chlorure de calcium 10 %, 10 mL, ou gluconate de calcium 10 %, 30 mL, par voie intraveineuse (ERC), répétable selon l’électrocardiogramme. Effet en quelques minutes, durée de 30 à 60 minutes.</p>
<div class="lab">Précautions</div><p>Le chlorure est irritant et nécrosant en cas d’extravasation : grosse veine ou voie centrale. Sous digoxine, la prudence classique persiste, bien que le risque soit aujourd’hui considéré comme faible. Ne pas mélanger au bicarbonate (précipitation).</p></template>

<template data-pop="i44-d-fab" data-title="Fragments d’anticorps antidigoxine">
<div class="lab">Mécanisme</div><p>Fragments Fab d’anticorps ovins qui fixent la digoxine libre ; le complexe inactif est éliminé par le rein.</p>
<div class="lab">Indications</div><p>Arythmie ventriculaire menaçante, bradycardie ou BAV avec instabilité, hyperkaliémie importante dans l’intoxication aiguë, ingestion massive, digoxinémie très élevée avec signes de toxicité.</p>
<div class="lab">Posologie</div><p>Un flacon de 40 mg neutralise environ 0,5 mg de digoxine. Nombre de flacons ≈ digoxinémie (ng/mL) × poids (kg) / 100 ; en l’absence de dosage, dose empirique selon Tox Info Suisse.</p>
<div class="lab">Suivi</div><p>Effet en 30 à 60 minutes ; hypokaliémie possible lorsque le potassium réintègre les cellules ; après administration, la digoxinémie totale n’est plus interprétable ; rebond possible en insuffisance rénale ; réapparition de la fibrillation auriculaire rapide ou de l’insuffisance cardiaque que la digoxine contrôlait.</p>
<div class="lab">D’où vient la formule</div><p>La digoxine se distribue largement dans les tissus : son volume de distribution à l’équilibre est d’environ 5 L/kg. La charge corporelle en milligrammes vaut donc digoxinémie (ng/mL) × 5 × poids (kg) / 1 000. Un flacon fixe environ 0,5 mg : diviser la charge par 0,5 donne digoxinémie × poids / 100. Ce volume est une moyenne de population ; on arrondit au flacon supérieur et l’on répète la dose si la toxicité persiste ou réapparaît après quelques heures.</p>
<div class="lab">Source complémentaire</div><p>Information professionnelle américaine des fragments d’anticorps antidigoxine ovins (2026), rubriques posologie et pharmacologie.</p>
</template>

<template data-pop="i44-d-antibio" data-title="Antibioprophylaxie de l’implantation">
<div class="lab">Recommandation (ESC 2021)</div><p>Antibioprophylaxie dans l’heure qui précède l’incision : classe I.</p>
<div class="lab">Molécule</div><p>Céfazoline 2 g par voie intraveineuse (dose augmentée chez l’obèse selon les protocoles). Allergie aux bêtalactamines ou colonisation à staphylocoque résistant à la méticilline : vancomycine, dont la perfusion commence 90 à 120 minutes avant l’incision.</p>
<div class="lab">Après l’intervention</div><p>Pas d’antibiothérapie prolongée : l’essai PADIT n’a pas montré de bénéfice.</p>
<div class="lab">Enveloppe antibactérienne</div><p>Enveloppe résorbable qui libère des antibiotiques autour du boîtier : réduction des infections majeures dans l’essai WRAP-IT, mené chez des patients à risque (remplacement de boîtier, révision, mise à niveau, première resynchronisation avec défibrillateur). L’ESC 2021 indique qu’elle peut être envisagée lors d’une réintervention sur un dispositif (classe IIb, niveau B).</p>
<div class="lab">Autres mesures</div><p>Antisepsie cutanée à la chlorhexidine alcoolique ; pas de rasage au rasoir ; éviter la stimulation temporaire préalable lorsque c’est possible.</p></template>

<template data-pop="i44-d-anticoag" data-title="Anticoagulants autour de l’implantation">
<div class="lab">Antivitamine K</div><p>Essai BRUISE CONTROL (2013) : la poursuite de la warfarine, avec un INR dans la zone thérapeutique, a réduit les hématomes cliniquement significatifs (3,5 % contre 16 %) par rapport à l’arrêt avec relais par héparine. Le relais par héparine est donc à éviter : l’héparine reprise à dose curative peu après l’intervention agit sur une loge dont l’hémostase n’est pas consolidée, et l’ESC 2021 rapporte un risque d’hématome multiplié par 4,6 ; elle ne le recommande pas (classe III).</p>
<div class="lab">Anticoagulant oral direct</div><p>Essai BRUISE CONTROL-2 (2018) : poursuite ou brève interruption donnent un taux d’hématome identique et faible (environ 2 %). En pratique, interruption courte ou poursuite selon l’équipe, sans relais.</p>
<div class="lab">Antiplaquettaires</div><p>Aspirine seule : poursuite. Double antiagrégation : risque d’hématome accru ; différer l’implantation si elle n’est pas urgente, sans interrompre un traitement indispensable après une angioplastie récente.</p>
<div class="lab">Surveillance</div><p>Contrôle de la loge dans les 24 à 48 heures ; pas de ponction d’un hématome.</p></template>
<template data-pop="i44-bilan-bio" data-title="Bilan biologique d’une bradycardie : ce que chaque dosage change">
<div class="lab">Principe</div><p>L’ESC 2021 recommande des dosages ciblés lorsque le contexte suggère une cause réversible (classe I) : fonction thyroïdienne, sérologie de Lyme, digoxinémie, potassium, calcium et pH. Une cause transitoire corrigée dispense de stimulation définitive (classe III).</p>
<div class="lab">Potassium</div><p>Le potentiel de repos des myocytes dépend surtout du gradient de potassium entre la cellule et le milieu extracellulaire. Une <button class="w" data-k="i44-hyperk">hyperkaliémie</button> dépolarise ce potentiel et ralentit la conduction dans le nœud et le His-Purkinje, d’où BAV et QRS larges. Le tracé est un témoin insensible ; on dose donc la kaliémie devant toute bradycardie inexpliquée, et un tracé modifié impose le calcium sans attendre.</p>
<div class="lab">Créatinine</div><p>Le rein élimine le potassium et plusieurs bradycardisants, dont la digoxine. Une insuffisance rénale aiguë transforme un traitement toléré en surdosage et entretient l’hyperkaliémie : c’est le cercle du <button class="w" data-k="i44-brash">syndrome BRASH</button>. La créatinine fait aussi partie du bilan qui précède toute implantation.</p>
<div class="lab">TSH et T4 libre</div><p>Une TSH élevée avec une T4 libre basse désigne une cause réversible : la substitution corrige la bradycardie et évite une stimulation inutile.</p>
<div class="lab">Digoxinémie</div><p>Elle se prélève au moins 6 heures après la dernière prise, car la digoxine met 6 à 8 heures à s’équilibrer entre le sérum et les tissus ; un prélèvement précoce surestime la charge tissulaire. Elle s’interprète avec la kaliémie et la fonction rénale, car une hypokaliémie rend toxique une concentration habituelle.</p>
<div class="lab">Calcium et pH</div><p>Une hypercalcémie figure parmi les causes réversibles de bradycardie (ESC 2021), car l’excès de calcium extracellulaire élève le seuil d’excitation et freine l’automatisme ; devant un BAV du sujet jeune, elle oriente aussi vers une sarcoïdose, dont les granulomes produisent du calcitriol. Une acidose, surtout minérale, fait sortir le potassium des cellules et aggrave une hyperkaliémie (Adrogué et Madias, 1981). Le gaz du sang veineux donne en quelques minutes le pH, le potassium et le lactate, témoin d’une hypoperfusion.</p>
<div class="lab">Troponine</div><p>Elle se dose dès que le contexte évoque une ischémie, car un BAV ischémique impose d’abord la revascularisation, et la décision de stimulation définitive attend au moins 5 jours, le temps que le bloc régresse le plus souvent.</p>
<div class="lab">Sérologie de Lyme</div><p>Chez un sujet jeune exposé aux tiques, un BAV peut traduire une cardite de Lyme ; l’antibiothérapie le fait régresser et rend le plus souvent la stimulation définitive inutile.</p>
<div class="lab">Créatine kinase</div><p>Une élévation oriente vers une myopathie (dystrophie myotonique, laminopathie). Dans ces maladies, le trouble de conduction progresse de façon imprévisible : l’ESC 2021 y abaisse le seuil de stimulation et, dans les laminopathies, préfère un défibrillateur.</p>
<div class="lab">Source</div><p>Glikson et al., 2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy, Eur Heart J 2021;42:3427–3520 (sections 4.3.4, 5.1, 8.1, 8.6.2 et 8.6.3) ; Adrogué et Madias, Changes in plasma potassium concentration during acute acid-base disturbances, Am J Med 1981;71:456–467 ; information professionnelle américaine des fragments d’anticorps antidigoxine ovins (équilibre sérum-tissus de la digoxine).</p>
</template>
<template data-pop="i44-d-insuline" data-title="Insuline à haute dose dans les intoxications bradycardisantes">
<div class="lab">Physiologie normale</div><p>Au repos, le myocarde tire surtout son énergie des acides gras ; en situation de stress, il dépend davantage du glucose, dont l’entrée dans le myocyte dépend de l’insuline. La sécrétion d’insuline par la cellule β du pancréas exige l’entrée de calcium par des canaux de type L.</p>
<div class="lab">Mécanisme</div><p>Les inhibiteurs calciques bloquent aussi ces canaux pancréatiques : l’insuline baisse, les tissus deviennent résistants à son action, et la glycémie monte au moment où le myocarde manque de substrat. Chez des patients intoxiqués au vérapamil ou au diltiazem, l’élévation de la glycémie suivait la gravité de l’intoxication. L’insuline à haute dose agit par trois effets : inotrope positif, entrée du glucose dans les myocytes et vasodilatation de la microcirculation.</p>
<div class="lab">Conséquence clinique</div><p>Le bénéfice porte sur la contractilité et la pression artérielle, là où les catécholamines accélèrent le cœur mais augmentent les résistances vasculaires et la consommation d’oxygène. Chez l’animal, l’insuline à haute dose a fait mieux que le calcium, le glucagon et l’adrénaline sur la survie ; chez l’homme, les données se limitent à des séries de cas, dans les intoxications aux inhibiteurs calciques comme aux bêtabloquants.</p>
<div class="lab">Ce qui change la décision</div><p>Le consensus d’experts de 2017 place l’insuline à haute dose parmi les traitements de première ligne de l’intoxication aux inhibiteurs calciques, avec un niveau de preuve très faible : bolus de 1 unité/kg, puis 1 unité/kg/h, augmentée jusqu’à 10 unités/kg/h en cas de dysfonction myocardique. Le glucose maintient l’euglycémie, souvent jusqu’à 24 heures après l’arrêt. La kaliémie baisse par transfert du potassium dans les cellules, sans perte du stock : elle se surveille de près. La stimulation n’est utile que si la contractilité est conservée, car elle accélère le cœur sans corriger la défaillance myocardique.</p>
<div class="lab">Source</div><p>Experts consensus recommendations for the management of calcium channel blocker poisoning in adults, Crit Care Med 2017;45:e306–e315 ; Engebretsen et al., High-dose insulin therapy in beta-blocker and calcium channel-blocker poisoning, Clin Toxicol 2011;49:277–283 ; Levine et al., Assessment of hyperglycemia after calcium channel blocker overdoses involving diltiazem or verapamil, Crit Care Med 2007;35:2071–2075.</p>
</template>
<template data-pop="i44-digitox" data-title="Intoxication digitalique : mécanisme, signes et décision">
<div class="lab">Physiologie normale</div><p>La pompe sodium-potassium expulse le sodium du myocyte et y fait entrer le potassium. Le gradient de sodium qu’elle entretient permet à l’échangeur sodium-calcium d’expulser le calcium à chaque battement.</p>
<div class="lab">Mécanisme</div><p>La digoxine se fixe sur la pompe et l’inhibe. Le sodium intracellulaire s’élève, l’échangeur expulse moins de calcium et le calcium cellulaire augmente : c’est l’effet inotrope. La digoxine renforce aussi le tonus vagal sur le sinus et le nœud. En excès, la surcharge calcique déclenche des post-dépolarisations retardées, alors que l’effet vagal et l’effet direct ralentissent la conduction nodale. La toxicité associe donc un automatisme accru et une conduction retardée.</p>
<div class="lab">Conséquence clinique</div><p>Ce double effet explique les tracés évocateurs : tachycardie atriale avec bloc, tachycardie jonctionnelle, extrasystoles ventriculaires fréquentes, tachycardie ventriculaire bidirectionnelle, bradycardie et BAV.</p>
<div class="lab">Rôle du potassium</div><p>Le potassium et la digoxine se disputent le même site de la pompe : une hypokaliémie favorise la fixation de la digoxine et rend toxique une digoxinémie habituelle. À l’inverse, une intoxication aiguë massive bloque assez de pompes pour que le potassium ne rentre plus dans les cellules : l’hyperkaliémie mesure alors la gravité. Elle était liée à la mortalité avant l’ère des fragments d’anticorps, et une kaliémie supérieure à 5,5 mmol/L avec une toxicité évolutive en est une indication.</p>
<div class="lab">Ce qui change la décision</div><p>Les fragments d’anticorps sont le traitement de première intention d’une toxicité menaçante. La stimulation endocavitaire est évitée : dans une série de 92 intoxications par la digoxine ou la digitoxine, elle a provoqué des accidents chez 36 % des patients stimulés, mortels chez 13 %, alors que les fragments n’ont causé aucun accident grave. On corrige l’hypokaliémie et l’hypomagnésémie, puis l’on cherche le facteur déclenchant : insuffisance rénale, déshydratation, interaction avec l’amiodarone ou un macrolide.</p>
<div class="lab">Source</div><p>Smith, Digitalis: mechanisms of action and clinical use, N Engl J Med 1988;318:358–365 ; Ma et al., Electrocardiographic manifestations: digitalis toxicity, J Emerg Med 2001;20:145–152 ; Bismuth et al., Hyperkalemia in acute digitalis poisoning: prognostic significance and therapeutic implications, Clin Toxicol 1973;6:153–162 ; Taboulet et al., Acute digitalis intoxication: is pacing still appropriate?, J Toxicol Clin Toxicol 1993;31:261–273 ; information professionnelle américaine des fragments d’anticorps antidigoxine ovins (2026).</p>
</template>
