<section class="ilot" id="i71-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 68 ans, hypertendu, fumeur de 40 paquets-années, arrive aux urgences pour une douleur thoracique <b>brutale, déchirante</b>, maximale d’emblée, irradiant entre les omoplates puis vers les lombes. Sa pression artérielle est de 178/96 mmHg au bras droit et de 142/80 mmHg au bras gauche. L’électrocardiogramme ne montre pas de sus-décalage. La question qui structure le chapitre est la suivante : <b>s’agit-il d’une dissection aortique, comment la confirmer en quelques minutes, pourquoi ne faut-il surtout pas lui donner un traitement anticoagulant de syndrome coronarien, et quelle décision — chirurgie immédiate ou traitement médical — dépend de la localisation de la déchirure ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait distinguer anévrisme, dissection, hématome intramural et ulcère pénétrant ; dépister l’anévrisme de l’aorte abdominale chez les bonnes personnes ; appliquer les seuils de surveillance et d’intervention de l’ESC 2024 ; reconnaître un syndrome aortique aigu et sa classification de Stanford ; conduire la baisse tensionnelle et de la fréquence cardiaque ; et reconnaître les formes génétiques qui imposent un dépistage familial.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i71-paroi">paroi aortique et ses trois tuniques</button>, la <button class="w" data-k="i71-laplace">loi de Laplace (tension pariétale)</button> et les <button class="w" data-k="i71-diam">diamètres aortiques normaux</button>.</div>
</section>
<section class="ilot" id="i71-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Un <b>anévrisme</b> est une dilatation <b>permanente et localisée</b> d’une artère, d’au moins <b>50 %</b> de son diamètre normal attendu, touchant les trois tuniques. Pour l’aorte abdominale, on retient en pratique un diamètre ≥ 30 mm. Un <b>faux anévrisme</b> (pseudo-anévrisme) est une rupture de la paroi contenue par les tissus voisins, sans les trois tuniques (après ponction artérielle, traumatisme, infection). Une <b>ectasie</b> est une dilatation inférieure à 50 %.</p>
<p>La <b>dissection</b> est une déchirure de l’intima qui laisse le sang pénétrer dans la média et la cliver en créant un <b>faux chenal</b> parallèle au vrai. Elle appartient au <b>syndrome aortique aigu</b>, qui regroupe aussi l’<b>hématome intramural</b> (saignement dans la média sans porte d’entrée intimale visible) et l’<b>ulcère aortique pénétrant</b> (ulcération d’une plaque athéroscléreuse creusant la média).</p>
<div class="two">
<div class="card"><h4>Forme de l’anévrisme</h4><p><b>Fusiforme</b> : dilatation circonférentielle, la plus fréquente. <b>Sacciforme</b> : poche latérale, rupture plus précoce ; l’ESC 2024 propose d’intervenir sur un anévrisme sacciforme de l’aorte abdominale dès 45 mm.</p></div>
<div class="card"><h4>Classification de Stanford des dissections</h4><p><b>Type A</b> : l’aorte ascendante est atteinte, quelle que soit la porte d’entrée → <b>chirurgie en urgence</b>. <b>Type B</b> : l’aorte ascendante est épargnée → traitement médical, ou endoprothèse en cas de complication. La classification de DeBakey (I, II, III) décrit l’extension ; la classification TEM (type, porte d’entrée, malperfusion) la complète.</p></div></div>
<p><b>Temporalité des dissections</b> : hyperaiguë (&lt; 24 heures), aiguë (1 à 14 jours), subaiguë (15 à 90 jours), chronique (&gt; 90 jours).</p>
<p><b>Codage CIM-10-GM</b> : I71.0 dissection de l’aorte ; I71.1 et I71.2 anévrisme de l’aorte thoracique rompu et non rompu ; I71.3 et I71.4 abdominal rompu et non rompu ; I71.5 et I71.6 thoraco-abdominal ; I72 autres anévrismes et dissections (carotide, membres supérieurs, rénale, iliaque, membres inférieurs dont poplité, vertébrale).</p>
</section>
<section class="ilot" id="i71-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’anévrisme de l’aorte abdominale touche environ <b>1 à 2 %</b> des hommes de plus de 65 ans dans les cohortes européennes récentes (4 à 8 % dans les études anciennes, avant la baisse du tabagisme), quatre à six fois moins de femmes. Il cause environ 170 000 décès par an dans le monde. Le <b>risque de rupture</b> croît avec le diamètre : très faible sous 50 mm, environ 1 % par an à 50–55 mm, plusieurs pourcents par an au-delà de 60 mm, jusqu’à plus de 20 % par an au-delà de 70 mm. La rupture est mortelle dans <b>80 à 90 %</b> des cas au total, la moitié des patients décédant avant l’hôpital.</p>
<p>La dissection aortique aiguë a une incidence de <b>3 à 6 pour 100 000 personnes par an</b>, pic entre 60 et 70 ans, deux tiers d’hommes. Sans chirurgie, la mortalité du type A augmente d’environ <b>1 à 2 % par heure</b> dans les premières 48 heures (registre international IRAD) ; opérée, elle reste de 15 à 20 %. Le type B non compliqué a une mortalité hospitalière d’environ 10 %.</p>
</section>
<section class="ilot" id="i71-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Anévrisme de l’aorte abdominale</b> : maladie dégénérative inflammatoire de la paroi, et non simple conséquence de l’athérosclérose. Macrophages et lymphocytes infiltrent la média et l’adventice ; les métalloprotéases matricielles (surtout MMP-9) détruisent l’élastine ; les cellules musculaires lisses meurent par apoptose. La paroi perd sa résistance, se dilate, et la dilatation augmente la tension pariétale (<button class="w" data-k="i71-laplace">loi de Laplace</button>), qui accélère la dilatation : un cercle vicieux.</p>
<p><b>Anévrisme de l’aorte thoracique ascendante</b> : surtout lié à une <b>dégénérescence de la média</b> (perte de fibres élastiques, accumulation de protéoglycanes), fréquente dans les maladies héréditaires (Marfan, Loeys-Dietz) et la bicuspidie aortique, ou à l’hypertension. <b>Dissection</b> : une média fragilisée, soumise à une contrainte hémodynamique (hypertension, pic tensionnel lors d’un effort violent, cocaïne), se déchire. Le sang progresse dans le faux chenal, surtout vers l’aval, et peut occlure les branches (malperfusion), rompre dans le péricarde (tamponnade) ou vers l’extérieur, désinsérer la valve aortique (insuffisance aortique) ou comprimer les coronaires.</p>

<div class="key"><b>Corrélation physiopathologie → clinique et traitement.</b> La loi de Laplace explique pourquoi le risque de rupture croît plus vite que le diamètre et pourquoi le contrôle tensionnel est central. Dans la dissection, la baisse de la <b>pente de montée de la pression</b> (dP/dt) par bêtabloquant réduit la propagation du faux chenal : on baisse d’abord la fréquence cardiaque, puis la pression.</div>
</section>
<section class="ilot" id="i71-4"><h2><span class="n">4</span>Facteurs de risque et causes</h2>
<table class="t"><tr><th>Atteinte</th><th>Facteurs et causes</th></tr>
<tr><td>Anévrisme de l’aorte abdominale</td><td><b>Tabac</b> (principal facteur modifiable, multiplie le risque par 3 à 5 et accélère la croissance), âge &gt; 65 ans, sexe masculin, antécédent familial au premier degré (risque × 2), athérosclérose, hypertension. Le <b>diabète est protecteur</b> (croissance plus lente), fait paradoxal bien établi.</td></tr>
<tr><td>Aorte thoracique ascendante</td><td>Hypertension ; <b>bicuspidie aortique</b> ; maladies héréditaires : <button class="w" data-k="i71-gen">syndrome de Marfan, Loeys-Dietz, Ehlers-Danlos vasculaire, anévrismes familiaux</button> ; syndrome de Turner ; aortites (artérite à cellules géantes, Takayasu, syphilis) ; grossesse chez les patientes à risque.</td></tr>
<tr><td>Dissection aiguë</td><td>Hypertension (≈ 70 %), anévrisme préexistant, maladies héréditaires (patients jeunes), bicuspidie, <b>cocaïne et amphétamines</b>, effort violent (haltérophilie), iatrogénie (chirurgie cardiaque, cathétérisme), grossesse au troisième trimestre et post-partum, fluoroquinolones (signal épidémiologique d’augmentation modeste du risque).</td></tr></table>
</section>
<section class="ilot" id="i71-5"><h2><span class="n">5</span>Anévrisme de l’aorte abdominale</h2>
<h3>5.1 Clinique</h3>
<p>Le plus souvent <b>asymptomatique</b>, découvert par hasard (échographie, tomodensitométrie) ou par dépistage. À la palpation, une masse pulsatile et <b>expansive</b> (les doigts posés de part et d’autre s’écartent) peut être perçue chez le sujet mince, avec une faible sensibilité. Signes d’alarme : douleur abdominale ou lombaire nouvelle chez un patient porteur d’anévrisme (fissuration imminente), ischémie aiguë d’un orteil (embolie à partir du thrombus mural : « orteil bleu »).</p>
<h3>5.2 Dépistage (ESC 2024)</h3>
<p>Échographie abdominale unique chez : les <b>hommes de 65 ans ou plus ayant fumé</b> ; <b>tous les hommes de 75 ans ou plus</b> ; les <b>femmes de 75 ans ou plus fumeuses et/ou hypertendues</b> ; les <b>apparentés au premier degré de 50 ans ou plus</b> d’un patient porteur d’anévrisme (sauf cause acquise évidente) ; les patients atteints d’artériopathie des membres inférieurs. Le dépistage des hommes de 65 ans réduit la mortalité liée à l’anévrisme d’environ 40 à 50 % (essai MASS). La Suisse n’a pas de programme national organisé ; le dépistage est opportuniste.</p>
<h3>5.3 Surveillance et seuils d’intervention</h3>
<table class="t"><tr><th>Diamètre (échographie)</th><th>Surveillance (ESC 2024)</th></tr>
<tr><td>25–29 mm (ectasie)</td><td>Contrôle à 5 ans environ</td></tr>
<tr><td>30–39 mm</td><td>Tous les 3 ans</td></tr>
<tr><td>40–49 mm (40–44 mm chez la femme)</td><td>Chaque année</td></tr>
<tr><td>≥ 50 mm chez l’homme (≥ 45 mm chez la femme)</td><td>Tous les 3 à 6 mois ; imagerie en coupes et avis vasculaire</td></tr></table>
<div class="alert"><b>Indications de réparation</b> : diamètre ≥ <b>55 mm chez l’homme</b>, ≥ <b>50 mm chez la femme</b> ; croissance rapide (≥ 10 mm par an ou ≥ 5 mm en 6 mois) ; anévrisme <b>symptomatique</b> ou <b>rompu</b> à tout diamètre ; anévrisme sacciforme ≥ 45 mm (à considérer). Les essais UKSAT et ADAM n’ont montré aucun bénéfice à réparer un anévrisme asymptomatique plus petit.</div>
<p><b>Techniques</b> : chirurgie ouverte (prothèse) ou <b>endoprothèse</b> par voie fémorale (EVAR). Les essais EVAR-1, DREAM et OVER : mortalité précoce plus faible avec l’endoprothèse (≈ 1–2 % contre 3–5 %), avantage qui disparaît à moyen terme ; réinterventions plus fréquentes après endoprothèse (endofuites) : <b>surveillance à vie</b> de l’endoprothèse par imagerie. Le choix dépend de l’anatomie (collet), de l’âge et des comorbidités, en décision partagée.</p>
</section>
<section class="ilot" id="i71-6"><h2><span class="n">6</span>Anévrisme de l’aorte thoracique</h2>
<p>Souvent asymptomatique, découvert à l’échocardiographie (racine, aorte ascendante) ou à la tomodensitométrie. Symptômes par compression (raucité par atteinte du nerf laryngé récurrent gauche, dysphagie, toux) ou <b>insuffisance aortique</b> par dilatation de l’anneau. Les diamètres se mesurent de manière standardisée (de bord interne à bord interne en fin de diastole à la tomodensitométrie synchronisée à l’électrocardiogramme ; méthode précisée dans le compte rendu), avec indexation à la taille ou à la surface corporelle.</p>
<table class="t"><tr><th>Situation</th><th>Seuil d’intervention (ESC 2024)</th></tr>
<tr><td>Aorte ascendante, cas général (valve tricuspide)</td><td><b>≥ 55 mm</b> (classe I) ; racine aortique &gt; 52 mm à considérer chez le patient à faible risque opératoire en centre expert</td></tr>
<tr><td>Syndrome de Marfan</td><td>≥ 50 mm ; ≥ 45 mm en présence de facteurs de risque (antécédent familial de dissection, croissance rapide, désir de grossesse)</td></tr>
<tr><td>Loeys-Dietz, Ehlers-Danlos vasculaire, autres formes héréditaires</td><td>Seuils plus bas, selon le gène (souvent 40–45 mm)</td></tr>
<tr><td>Bicuspidie aortique</td><td>≥ 55 mm, ou ≥ 50 mm avec facteurs de risque ; ≥ 45 mm si chirurgie valvulaire programmée</td></tr>
<tr><td>Aorte thoracique descendante</td><td>≥ 55 mm, par endoprothèse (TEVAR) si l’anatomie le permet ; plus tôt chez la femme, en cas de maladie héréditaire ou de croissance rapide</td></tr></table>
</section>
<section class="ilot" id="i71-7"><h2><span class="n">7</span>Syndrome aortique aigu : dissection et apparentés</h2>
<h3>7.1 Clinique</h3>
<p>Douleur <b>brutale</b>, <b>maximale d’emblée</b> (à la différence de la douleur coronarienne croissante), décrite comme déchirante ou lancinante, thoracique antérieure (type A) ou interscapulaire et lombaire (type B), parfois <b>migratrice</b> en suivant la progression de la dissection. Signes associés, qui traduisent l’extension :</p>
<table class="t"><tr><th>Signe</th><th>Mécanisme</th></tr>
<tr><td><b>Asymétrie tensionnelle &gt; 20 mmHg</b> entre les bras, déficit d’un pouls</td><td>Atteinte des troncs supra-aortiques</td></tr>
<tr><td>Souffle diastolique d’insuffisance aortique</td><td>Désinsertion de la valve (type A)</td></tr>
<tr><td>Hypotension, tamponnade (turgescence jugulaire, pouls paradoxal)</td><td>Rupture dans le péricarde : première cause de décès du type A</td></tr>
<tr><td>Déficit neurologique (hémiplégie, syncope), paraplégie</td><td>Carotides ; artères médullaires</td></tr>
<tr><td>Syndrome coronarien (surtout inférieur)</td><td>Extension à l’ostium coronaire droit</td></tr>
<tr><td>Douleur abdominale, élévation des lactates, oligurie, ischémie de membre</td><td>Malperfusion mésentérique, rénale, iliaque</td></tr></table>
<div class="trap"><span class="k">Piège</span>Environ 5 à 10 % des dissections sont <b>indolores</b> (syncope, accident vasculaire cérébral, insuffisance cardiaque). Et une dissection de type A peut donner un sus-décalage du segment ST inférieur : administrer une double antiagrégation, une héparine ou une thrombolyse pour un « infarctus » qui est une dissection peut être mortel. Devant une douleur thoracique avec asymétrie tensionnelle, élargissement médiastinal ou souffle d’insuffisance aortique, <b>exclure la dissection avant toute anticoagulation</b>.</div>
<h3>7.2 Probabilité clinique : score ADD-RS</h3>
<p>Le <button class="w" data-k="i71-addrs">score de risque de dissection aortique (ADD-RS)</button> compte un point par catégorie présente : terrain à risque, caractéristiques de la douleur, signes d’examen. Score 0–1 et <b>D-dimères &lt; 500 ng/mL</b> : dissection très improbable (valeur prédictive négative ≈ 99,7 % dans l’étude ADvISED) ; score ≥ 2 : imagerie directement.</p>
<h3>7.3 Stratégie</h3>
<p><b>Type A</b> (aorte ascendante) : <b>chirurgie cardiaque en urgence</b> (remplacement de l’aorte ascendante ± crosse, gestion de la valve). <b>Type B non compliqué</b> : traitement médical en soins intensifs (baisse de la fréquence et de la pression), puis discussion d’une endoprothèse préventive en phase subaiguë si critères de risque. <b>Type B compliqué</b> (rupture, malperfusion, douleur ou hypertension réfractaires, expansion rapide) : <b>endoprothèse thoracique (TEVAR)</b> en urgence. L’hématome intramural et l’ulcère pénétrant se traitent comme une dissection de même localisation.</p>
<div class="quiz ui"><p>Le patient de l’îlot 0 : angioscanner montrant un flap intimal de l’aorte ascendante à l’aorte abdominale. Décision ?</p><button data-ok="1">Type A de Stanford : chirurgie cardiaque en urgence ; en attendant, bêtabloquant intraveineux puis vasodilatateur, antalgie</button><button data-ok="0">Type B : traitement médical seul</button><button data-ok="0">Héparine et double antiagrégation</button><p class="fb" hidden>L’aorte ascendante est atteinte : type A, quelle que soit l’extension distale. La mortalité croît d’environ 1 à 2 % par heure sans chirurgie. Les antithrombotiques sont contre-indiqués.</p></div>
