<section class="ilot" id="i34-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Trois patients consultent la même semaine. Un homme de 58 ans, sportif, se sait porteur d’un souffle depuis vingt ans ; il ne se plaint de rien, mais son échocardiographie montre un feuillet mitral postérieur qui bascule dans l’oreillette. Une femme de 34 ans, arrivée d’Érythrée il y a deux ans, enceinte de 24 semaines, s’essouffle en montant un étage et crache un peu de sang. Une femme de 81 ans, en fibrillation auriculaire depuis dix ans, a le ventre gonflé et les jambes œdématiées malgré le furosémide.</p>
<p>Ces trois situations posent la même question, qui structure tout le chapitre : <b>quelle valve est atteinte, par quel mécanisme, quelle est la sévérité réelle de l’atteinte, quel en est le retentissement sur les cavités cardiaques, et à quel moment une intervention améliore-t-elle le pronostic ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître à l’auscultation les grandes valvulopathies des cœurs gauche et droit. Il sait distinguer une insuffisance mitrale primaire, maladie de la valve, d’une insuffisance mitrale secondaire, maladie du ventricule ou de l’oreillette. Il sait lire un compte rendu d’échocardiographie quantitative, poser une indication opératoire selon les recommandations ESC/EACTS 2025, justifier le choix entre réparation, remplacement et technique percutanée, prescrire l’anticoagulation adaptée et accompagner une grossesse sur rétrécissement mitral.</p>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="i34-sa-app">anatomie de l’appareil mitral (anneau, feuillets, cordages, piliers)</button>, la <button class="w" data-k="i34-gorlin">relation entre débit, gradient et surface valvulaire (équation de Gorlin)</button> et le <button class="w" data-k="i34-pisa">principe de conservation du débit (méthode PISA)</button>. Ces notions sont développées dans les onglets Sciences fondamentales et Examens complémentaires.</div>
</section>

<section class="ilot" id="i34-1"><h2><span class="n">1</span>Définitions, codage et classifications</h2>
<p>Une <b>valvulopathie</b> est une anomalie de structure ou de fonction d’une valve cardiaque. Elle se traduit par deux types de dysfonction, parfois associés. La <b>fuite</b> (insuffisance, régurgitation) laisse refluer le sang dans la cavité d’amont pendant la phase où la valve devrait être fermée. Le <b>rétrécissement</b> (sténose) gêne le passage du sang pendant la phase où la valve devrait être ouverte. La combinaison des deux sur une même valve s’appelle une maladie mitrale (ou tricuspide) mixte.</p>
<h3>1.1 Codage CIM-10-GM</h3>

<tr><td>I05</td><td>Maladies rhumatismales de la valve mitrale</td><td>I05.0 rétrécissement ; I05.1 insuffisance ; I05.2 rétrécissement avec insuffisance</td></tr>

<tr><td>I08</td><td>Maladies de plusieurs valves</td><td>I08.0 mitrale et aortique ; I08.1 mitrale et tricuspide ; I08.3 les trois</td></tr>
<tr><td>I09</td><td>Autres cardiopathies rhumatismales</td><td>Séquelles non valvulaires (péricarde, myocarde)</td></tr>
<tr><td>I34</td><td>Atteintes non rhumatismales de la valve mitrale</td><td>I34.0 insuffisance ; I34.1 prolapsus ; I34.2 rétrécissement non rhumatismal</td></tr>

<div class="trap"><span class="k">Piège</span>La CIM-10 classe par défaut un rétrécissement mitral comme rhumatismal (I05.0), même si la cause n’est pas précisée. Le rétrécissement mitral dégénératif du sujet âgé, par calcification de l’anneau, se code I34.2. Ce détail de codage reflète une réalité clinique : le rétrécissement mitral est rhumatismal dans la grande majorité des cas dans le monde.</div>
<h3>1.2 Insuffisance mitrale primaire et secondaire</h3>
<p>La distinction la plus importante du chapitre oppose deux maladies qui produisent le même souffle. Dans l’<b>insuffisance mitrale primaire</b>, ou organique, la valve elle-même est malade : feuillet qui prolabe, cordage rompu, feuillet perforé ou rétracté. Corriger la valve guérit la maladie. Dans l’<b>insuffisance mitrale secondaire</b>, ou fonctionnelle, la valve est normale ; c’est son environnement qui la rend incontinente. L’ESC/EACTS 2025 distingue deux formes secondaires :</p>
<ul><li><b>ventriculaire</b> : le ventricule gauche dilaté ou déformé (infarctus, cardiomyopathie dilatée) écarte les piliers et tire les feuillets vers l’apex ;</li>
<li><b>atriale</b> : l’oreillette gauche dilatée (fibrillation auriculaire ancienne, insuffisance cardiaque à fraction d’éjection préservée) élargit et aplatit l’anneau, alors que le ventricule reste de taille et de fonction normales.</li></ul>
<p>Dans la forme ventriculaire, corriger la fuite ne traite pas la maladie du muscle. C’est pourquoi le bénéfice d’une intervention y est plus incertain et dépend d’une sélection rigoureuse.</p>
<h3>1.3 Classification fonctionnelle de Carpentier</h3>
<p>La <button class="w" data-k="i34-carpentier">classification de Carpentier (mouvement des feuillets)</button> décrit le mécanisme de toute fuite mitrale ou tricuspide par le mouvement des feuillets. Elle guide directement la technique de réparation.</p>

<h3>1.4 Gradation de la sévérité</h3>
<p>Les fuites se gradent en légère, modérée ou sévère. Pour la valve tricuspide, l’ESC/EACTS 2025 a adopté une gradation en <b>cinq grades</b> : légère, modérée, sévère, massive et torrentielle. Cette extension répond à un problème pratique : les fuites tricuspides adressées aux techniques percutanées dépassent souvent largement le seuil « sévère », et une réduction d’un grade peut être cliniquement utile sans ramener la fuite à un grade léger. La surface mitrale normale est de 4 à 6 cm². Le rétrécissement mitral est dit <b>cliniquement significatif</b> lorsque la surface valvulaire est ≤ 1,5 cm² ; il est très serré au-dessous de 1,0 cm². Sous ce seuil, le gradient nécessaire pour maintenir le débit élève la pression de l’oreillette gauche dès l’effort, d’où la dyspnée. L’ESC/EACTS 2025 parle de rétrécissement « cliniquement sévère » lorsque cette surface s’accompagne de symptômes, d’un risque thromboembolique élevé ou d’un risque de décompensation : la surface seule ne pose pas l’indication.</p>
<div class="trap"><span class="k">Piège</span>Le terme « modérée à sévère » (grade 3 sur 4) est utilisé dans les essais américains sur la réparation percutanée. Il n’est pas une catégorie de l’ESC. Lire un essai sans connaître sa gradation mène à des comparaisons fausses.</div>
</section>

<section class="ilot" id="i34-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Dans les pays à haut revenu, l’insuffisance mitrale est, avec le rétrécissement aortique, la valvulopathie la plus fréquente de l’adulte. Sa prévalence croît avec l’âge. Dans l’étude de population américaine de Nkomo (Lancet, 2006), une insuffisance mitrale au moins modérée touchait 1,7 % de la population adulte et environ 9 % des personnes de 75 ans et plus. Le <button class="w" data-k="i34-mvp">prolapsus valvulaire mitral (définition échographique stricte)</button> touche 2 à 3 % de la population générale (cohorte de Framingham, 1999) ; seule une minorité de ces patients développe une fuite sévère.</p>
<p>L’insuffisance tricuspide significative est devenue une préoccupation de santé publique avec le vieillissement. Dans le comté d’Olmsted (Minnesota), une fuite tricuspide au moins modérée touchait environ 0,55 % des adultes et environ 4 % des personnes de 75 ans et plus (Topilsky, 2019). Elle est surtout secondaire, liée à la fibrillation auriculaire et aux cardiopathies gauches.</p>
<p>Le rétrécissement mitral a presque disparu comme maladie autochtone en Europe occidentale, car le <button class="w" data-k="i34-raa">rhumatisme articulaire aigu (séquelle d’angine streptococcique)</button> y est devenu exceptionnel. Il reste la valvulopathie de l’adulte jeune dans les pays à revenu faible ou intermédiaire. Le <i>Global Burden of Disease</i> estimait en 2019 à environ 40 millions le nombre de personnes vivant avec une cardiopathie rhumatismale. En Europe, on le rencontre donc surtout chez des personnes migrantes et chez des femmes découvertes pendant une grossesse. Chez le sujet âgé, un rétrécissement mitral dégénératif, par calcification de l’anneau, apparaît avec l’âge avancé et l’insuffisance rénale chronique. Les troubles du métabolisme phosphocalcique de l’insuffisance rénale et l’athérosclérose favorisent la calcification de l’anneau fibreux, qui gagne ensuite la base des feuillets et rétrécit l’orifice.</p>
<p>Les atteintes de la valve pulmonaire de l’adulte sont rares et presque toujours congénitales ou secondaires à la chirurgie d’une cardiopathie congénitale, notamment la tétralogie de Fallot.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de registre suisse publié de la prévalence des valvulopathies mitrales et tricuspides. Les chiffres ci-dessus proviennent de cohortes américaines et européennes. La part croissante des patients migrants justifie de penser à l’origine rhumatismale chez tout adulte jeune venu d’une région d’endémie.</div>

<section class="ilot" id="i34-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Chaque valvulopathie se comprend par une chaîne : <b>lésion valvulaire → surcharge de volume ou de pression d’une cavité → adaptation de cette cavité → épuisement de l’adaptation → symptômes et complications.</b> Le moment optimal d’une intervention se situe juste avant l’épuisement, souvent chez un patient encore asymptomatique.</p>
<h3>3.1 Insuffisance mitrale chronique : une surcharge de volume</h3>
<p>À chaque systole, le ventricule gauche éjecte une partie de son volume vers l’aorte et une autre vers l’oreillette gauche, à basse pression. Le volume régurgité revient au ventricule à la diastole suivante. Le ventricule reçoit donc plus de sang qu’il n’en délivre utilement : c’est une <b>surcharge de volume</b>. Il s’adapte par une <button class="w" data-k="i34-hypexc">hypertrophie excentrique (dilatation avec parois d’épaisseur normale)</button> qui augmente son volume d’éjection total selon la <button class="w" data-k="frank">loi de Frank-Starling (précharge et volume d’éjection)</button>. L’oreillette gauche se dilate et devient plus compliante ; elle absorbe le volume régurgité sans élévation majeure de pression. Le patient reste longtemps asymptomatique.</p>
<p>Cette phase compensée est trompeuse. Le ventricule éjecte une partie de son volume dans une cavité à basse pression, ce qui réduit sa postcharge. La fraction d’éjection est donc surestimée : une <button class="w" data-k="i34-fevgim">FEVG à 60 % dans l’insuffisance mitrale sévère (dysfonction débutante masquée)</button> traduit déjà une altération de la contractilité. Si l’on attend que la FEVG baisse franchement ou que le patient s’essouffle, une partie de la dysfonction devient irréversible et la survie après chirurgie est moins bonne.</p>
<div class="key"><b>Corrélation physiologie → indication opératoire.</b> Parce que la FEVG surestime la fonction réelle dans l’insuffisance mitrale, les seuils opératoires sont plus exigeants qu’ailleurs : FEVG ≤ 60 % (et non &lt; 50 %) et diamètre télésystolique ≥ 40 mm. Le diamètre télésystolique mesure la taille du ventricule après éjection. Il dépend moins de la postcharge que la FEVG et reflète donc mieux la contractilité réelle : un ventricule qui ne se vide plus jusqu’à un petit volume est un ventricule qui s’affaiblit.</div>
<h3>3.2 Insuffisance mitrale aiguë : une surcharge sans adaptation</h3>
<p>Lorsqu’un cordage ou un pilier se rompt brutalement, ni l’oreillette ni le ventricule n’ont eu le temps de se dilater. Le volume régurgité se jette dans une petite oreillette peu compliante : la pression auriculaire monte d’un coup, avec une <button class="w" data-k="i34-ondev">onde v géante (pression de l’oreillette gauche)</button>, et l’œdème pulmonaire survient en quelques heures. Le débit antérograde chute, d’où l’hypotension. Le souffle est souvent court et doux, parfois absent, car les pressions ventriculaire et auriculaire s’égalisent en fin de systole.</p>
<h3>3.3 Insuffisance mitrale secondaire</h3>
<p>Dans la forme <b>ventriculaire</b>, le ventricule dilaté ou l’infarctus inférolatéral déplace les piliers vers l’apex et vers l’extérieur. Les cordages, de longueur fixe, retiennent les feuillets sous le plan de l’anneau : c’est le mécanisme de <button class="w" data-k="i34-tenting">restriction systolique par traction (tenting, type IIIb)</button>. La fuite est <b>dynamique</b>, car elle résulte d’un équilibre entre la force de fermeture, produite par la pression systolique du ventricule, et la traction des piliers déplacés. L’effort et la congestion modifient la géométrie du ventricule et accroissent la traction ; la dyssynchronie retarde la contraction d’un pilier et affaiblit la fermeture. Le traitement de l’insuffisance cardiaque réduit le volume du ventricule, donc la fuite. Le rapport entre la fuite et la taille du ventricule conditionne le bénéfice d’une correction : c’est la notion de fuite <button class="w" data-k="i34-propor">proportionnée ou disproportionnée (fuite rapportée au volume du ventricule)</button>.</p>
<p>Dans la forme <b>atriale</b>, l’anneau se dilate avec l’oreillette et perd sa forme en selle. Les feuillets, normaux et de mouvement normal (type I), ne couvrent plus la surface de l’orifice. La fibrillation auriculaire en est la cause principale, car elle dilate l’oreillette et l’anneau. Le rétablissement du rythme sinusal peut réduire l’oreillette, donc l’anneau et la fuite ; les données qui le montrent restent limitées.</p>
<h3>3.4 Rétrécissement mitral : un obstacle au remplissage</h3>
<p>Dans le rétrécissement rhumatismal, les commissures fusionnent, les feuillets s’épaississent et les cordages se rétractent. L’orifice prend une forme en entonnoir. Pour faire passer le même débit à travers un orifice plus petit, il faut un <button class="w" data-k="i34-gorlin">gradient de pression plus élevé (équation de Gorlin)</button> entre l’oreillette et le ventricule. Ce gradient dépend du carré du débit et de la durée de la diastole.</p>
<p>Il en découle trois conséquences cliniques. Premièrement, la <b>tachycardie</b> raccourcit surtout la diastole : le gradient et la pression auriculaire montent, ce qui explique l’œdème pulmonaire lors d’une fibrillation auriculaire rapide, d’un effort, d’une fièvre ou d’une grossesse. Deuxièmement, la pression auriculaire élevée se transmet aux veines et aux capillaires pulmonaires, puis entraîne une <button class="w" data-k="i34-htp">hypertension pulmonaire post-capillaire puis combinée (composante précapillaire réactive)</button> qui finit par épuiser le ventricule droit et dilater l’anneau tricuspide. Troisièmement, l’oreillette gauche dilatée et le flux lent favorisent la fibrillation auriculaire et la formation de <b>thrombus</b>, surtout dans l’auricule : le rétrécissement mitral est la valvulopathie la plus emboligène.</p>
<p>Le ventricule gauche, protégé derrière l’obstacle, est de taille normale ou petite. Un ventricule gauche dilaté chez un patient avec un rétrécissement mitral oriente vers une fuite associée (mitrale ou aortique).</p>
<h3>3.5 Insuffisance tricuspide : la valve du ventricule droit</h3>
<p>La valve tricuspide dépend encore plus de son environnement que la valve mitrale. Son anneau, peu fibreux, se dilate facilement, surtout le long de la paroi libre du ventricule droit. Deux mécanismes secondaires coexistent souvent. La <b>forme atriale</b> associe dilatation de l’oreillette droite et de l’anneau, en fibrillation auriculaire ancienne, avec un ventricule droit longtemps préservé. La <b>forme ventriculaire</b> associe dilatation et déformation du ventricule droit sous l’effet d’une hypertension pulmonaire ou d’une cardiomyopathie ; les feuillets sont tirés vers l’apex.</p>
<p>La fuite réduit le débit antérograde et élève la pression veineuse systémique : foie congestif, ascite, œdèmes, <button class="w" data-k="i34-congestion-renale">insuffisance rénale par congestion veineuse</button>. La dilatation de l’anneau augmente la fuite, et la surcharge de volume qui en résulte dilate davantage l’anneau et le ventricule droit : <b>la fuite tricuspide progresse d’elle-même</b>. Enfin, une sonde de stimulateur ou de défibrillateur traversant la valve peut gêner un feuillet et créer une fuite propre.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> Toute fuite secondaire se traite d’abord par sa cause : traitement fondamental de l’insuffisance cardiaque et resynchronisation pour la forme ventriculaire mitrale, contrôle du rythme pour les formes atriales, traitement de l’hypertension pulmonaire pour la fuite tricuspide ventriculaire. L’intervention sur la valve vient ensuite, si la fuite persiste.</div>

<section class="ilot" id="i34-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<div class="two">
<div class="card"><h4>Insuffisance mitrale primaire</h4><p><b>Dégénérative</b>, de loin la plus fréquente en Europe : deux formes, la <button class="w" data-k="i34-barlow">maladie de Barlow et la déficience fibroélastique (deux phénotypes du prolapsus)</button>. <b>Endocardite</b> : perforation, rupture de cordage. <b>Rhumatismale</b> : restriction (type IIIa). <b>Médicamenteuse</b> : <button class="w" data-k="i34-medic">agonistes sérotoninergiques 5-HT2B (benfluorex, dérivés de l’ergot)</button>. <b>Radique</b> : après irradiation médiastinale. <b>Ischémique aiguë</b> : rupture de pilier. <b>Congénitale</b> : fente mitrale. Maladie héréditaire du tissu conjonctif : syndrome de Marfan, où le déficit en fibrilline 1 rend les feuillets myxoïdes et redondants.</p></div>
<div class="card"><h4>Insuffisance mitrale secondaire</h4><p><b>Ventriculaire</b> : cardiopathie ischémique, surtout après infarctus inférolatéral, car la paroi qui porte le pilier postéromédial se dilate et l’écarte de l’anneau ; cardiomyopathie dilatée ; bloc de branche gauche, qui désynchronise la contraction de la paroi et des piliers. <b>Atriale</b> : fibrillation auriculaire ancienne, insuffisance cardiaque à fraction d’éjection préservée, sujet âgé. Une cardiomyopathie hypertrophique obstructive peut aussi causer une fuite par <b>mouvement systolique antérieur</b> du feuillet antérieur : entraîné vers la chambre de chasse pendant la systole, ce feuillet ne s’affronte plus au feuillet postérieur, et le jet se dirige en arrière ; un jet central ou antérieur doit faire chercher une anomalie propre de la valve.</p></div>
<div class="card"><h4>Rétrécissement mitral</h4><p><b>Rhumatismal</b> : la cause dominante ; souvent vingt à quarante ans après la crise rhumatismale, qui est souvent passée inaperçue. <b>Dégénératif</b> : calcification de l’anneau étendue aux feuillets, chez le sujet âgé, l’insuffisant rénal chronique et après irradiation. Causes rares : congénitale (valve en parachute), carcinoïde, lupus, médicamenteuse. Association à une communication interauriculaire : <button class="w" data-k="i34-lutemb">syndrome de Lutembacher (rétrécissement mitral masqué par le shunt)</button> ; le shunt gauche-droite décharge l’oreillette gauche et masque le rétrécissement, mais surcharge le cœur droit. À distinguer d’un obstacle non valvulaire : <button class="w" data-k="i34-myxome">myxome de l’oreillette gauche (obstacle intermittent, variable avec la position)</button>.</p></div>
<div class="card"><h4>Insuffisance tricuspide</h4><p><b>Secondaire</b> (environ 90 % des cas) : cardiopathies gauches avec hypertension pulmonaire post-capillaire, hypertension pulmonaire précapillaire, fibrillation auriculaire, atteinte du ventricule droit. <b>Liée à une sonde</b> de stimulateur ou de défibrillateur. <b>Primaire</b> : endocardite (usage de drogues par voie intraveineuse, car les particules contaminées injectées atteignent d’abord la valve tricuspide), <button class="w" data-k="i34-carcinoide">cardiopathie carcinoïde (plaques fibreuses du cœur droit)</button>, rhumatisme, prolapsus myxoïde, <button class="w" data-k="i34-ebstein">maladie d’Ebstein (feuillet septal déplacé vers l’apex)</button>, traumatisme thoracique, biopsie endomyocardique répétée chez le transplanté, car le bioptome traverse la valve à chaque prélèvement et peut léser feuillets et cordages.</p></div>
<div class="card"><h4>Valve pulmonaire</h4><p><b>Rétrécissement</b> : congénital (valve en dôme, ou valve dysplasique du <button class="w" data-k="i34-noonan">syndrome de Noonan (valve pulmonaire dysplasique)</button>), carcinoïde. <b>Insuffisance</b> : après réparation d’une tétralogie de Fallot ou valvulotomie pulmonaire, hypertension pulmonaire (dilatation de l’anneau), endocardite, carcinoïde.</p></div>
<div class="card"><h4>Polyvalvulopathies</h4><p>Rhumatisme (mitrale et aortique, puis tricuspide), cardiopathie carcinoïde (tricuspide et pulmonaire), irradiation médiastinale (aortique et mitrale), valvulopathies médicamenteuses, endocardite étendue, association d’une valvulopathie gauche et d’une fuite tricuspide secondaire.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à une insuffisance tricuspide « primitive » ou « idiopathique » sans avoir cherché une hypertension pulmonaire, une valvulopathie gauche, une fibrillation auriculaire ou une sonde de stimulateur. Une fuite tricuspide sévère isolée est d’abord le signe d’une autre maladie ; son traitement sans la cause échoue.</div>
<button class="pareto-btn ui" data-k="pareto-i34-etio">▲ Loi de Pareto — Étiologies</button>
</section>

<section class="ilot" id="i34-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse d’une valvulopathie cherche trois éléments : la cause (terrain, antécédents), le retentissement (symptômes, tolérance à l’effort) et les complications (embolie, arythmie, décompensation).</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i34-atcd-raa">Angines à répétition, rhumatisme articulaire aigu, origine géographique</button></li><li><button class="w" data-k="i34-atcd-medic">Médicaments et drogues valvulotoxiques (benfluorex, ergot, ecstasy)</button></li><li><button class="w" data-k="i34-atcd-radio">Irradiation médiastinale (lymphome, cancer du sein)</button></li><li>Infarctus, cardiomyopathie, insuffisance cardiaque</li></ul>
<ul><li>Fibrillation auriculaire, accident vasculaire cérébral, embolie périphérique</li><li>Endocardite, usage de drogues par voie intraveineuse</li><li>Stimulateur cardiaque ou défibrillateur (sonde tricuspide)</li><li><button class="w" data-k="i34-atcd-fam">Histoire familiale de prolapsus mitral ou de mort subite</button></li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i34-s-dysp">Dyspnée d’effort (mécanisme selon la valvulopathie)</button></li><li><button class="w" data-k="i34-s-fatig">Fatigue et baisse de la tolérance à l’effort (bas débit)</button></li><li><button class="w" data-k="i34-s-palp">Palpitations (fibrillation auriculaire, extrasystoles du prolapsus)</button></li><li>Orthopnée, dyspnée paroxystique nocturne, œdème pulmonaire</li></ul>
<ul><li><button class="w" data-k="i34-s-oed">Œdèmes, ascite, pesanteur de l’hypochondre droit (congestion droite)</button></li><li><button class="w" data-k="i34-s-hemopt">Hémoptysie (rétrécissement mitral)</button></li><li><button class="w" data-k="i34-s-emb">Embolie artérielle révélatrice</button></li><li><button class="w" data-k="i34-s-ortner">Dysphonie ou dysphagie (compression par l’oreillette gauche)</button></li></ul></div>
<p>Le symptôme a une valeur décisionnelle majeure : dans l’insuffisance mitrale primaire sévère, l’apparition d’une dyspnée, même discrète, suffit à poser l’indication opératoire. Beaucoup de patients réduisent spontanément leur activité et se déclarent « asymptomatiques ». Il faut donc les interroger sur ce qu’ils ne font plus, et non sur ce qu’ils ressentent, et recourir à une épreuve d’effort en cas de doute.</p>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique : prolapsus</h4><p>Homme de 58 ans, souffle connu, asymptomatique. Rupture de cordage du segment moyen du feuillet postérieur ; fuite sévère, FEVG 64 %, diamètre télésystolique 38 mm, <button class="w" data-k="i34-marqueurs-imp">oreillette gauche à 62 mL/m²</button>. Candidat à une réparation précoce dans un centre expert : son ventricule reste dans les limites, mais l’oreillette dilatée (≥ 60 mL/m²) suffit, chez un patient à faible risque, à une indication de classe IIa, si la réparation est probablement durable.</p></div>
<div class="card"><h4>Forme atypique : rétrécissement mitral révélé par la grossesse</h4><p>Femme de 34 ans, originaire d’une région d’endémie rhumatismale, jamais auscultée. Dyspnée et hémoptysie au deuxième trimestre, lorsque le débit cardiaque et la fréquence augmentent. Surface mitrale 1,1 cm².</p></div>
<div class="card"><h4>Forme trompeuse : insuffisance tricuspide « digestive »</h4><p>Femme de 81 ans en fibrillation auriculaire permanente, adressée pour ascite et cholestase. Aucun souffle audible, foie pulsatile, jugulaires turgescentes à onde v. Fuite tricuspide torrentielle d’origine atriale.</p></div>
<div class="card"><h4>Forme aiguë : rupture de pilier</h4><p>Homme de 67 ans, cinq jours après un infarctus inférieur tardivement pris en charge. Œdème pulmonaire brutal et hypotension, souffle bref ou absent, FEVG normale ou hyperkinétique. Urgence chirurgicale.</p></div></div>
</section>

<section class="ilot" id="i34-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux → anthropométrie → auscultation et signes ciblés. Il répond à trois questions : quelle valve, quelle sévérité probable, et quel retentissement (congestion gauche, congestion droite, bas débit) ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Dyspnée, cyanose périphérique, <button class="w" data-k="i34-e-facies">faciès mitral (érythrose des pommettes)</button>, ictère discret de congestion hépatique, cachexie cardiaque. <button class="w" data-k="i34-e-pouls">Pouls (régularité, amplitude, fréquence)</button>, pression artérielle, fréquence respiratoire, saturation, température (endocardite). Poids, taille et surface corporelle : les seuils échographiques sont indexés à la surface corporelle.</p>
<h3>6.2 Auscultation et signes ciblés</h3>
<p>L’auscultation se fait dans un endroit calme, en décubitus dorsal puis en décubitus latéral gauche pour la pointe, et en inspiration profonde pour les foyers droits. La membrane capte les sons aigus (souffles de fuite) ; la cloche, appliquée sans pression, capte les sons graves (roulements, galops).</p>
<div class="two">
<div><b>Insuffisance mitrale</b><ul><li><button class="w" data-k="i34-e-shs">Souffle holosystolique apexien irradiant vers l’aisselle</button></li><li><button class="w" data-k="i34-e-click">Clic mésosystolique et souffle télésystolique du prolapsus (manœuvres dynamiques)</button></li><li><button class="w" data-k="e-b3">Troisième bruit B3 (galop protodiastolique)</button></li><li><button class="w" data-k="i34-e-choc">Choc de pointe dévié et étalé (dilatation du ventricule gauche)</button></li></ul></div>
<div><b>Rétrécissement mitral</b><ul><li><button class="w" data-k="i34-e-b1">Éclat de B1 (feuillets encore souples)</button></li><li><button class="w" data-k="i34-e-cla">Claquement d’ouverture mitral (intervalle B2–claquement)</button></li><li><button class="w" data-k="i34-e-roul">Roulement diastolique et renforcement présystolique</button></li><li><button class="w" data-k="i34-e-b2p">Éclat de la composante pulmonaire de B2 (hypertension pulmonaire)</button></li></ul></div>
<div><b>Insuffisance tricuspide</b><ul><li><button class="w" data-k="i34-e-carvallo">Souffle xiphoïdien augmenté à l’inspiration (signe de Carvallo)</button></li><li><button class="w" data-k="i34-e-ondev">Onde v jugulaire et reflux hépato-jugulaire</button></li><li><button class="w" data-k="i34-e-foie">Foie pulsatile (expansion systolique)</button></li><li>Ascite, œdèmes déclives, <button class="w" data-k="e-jugulaire">turgescence jugulaire (technique de mesure)</button></li></ul></div>
<div><b>Valve pulmonaire</b><ul><li><button class="w" data-k="i34-e-ps">Souffle éjectionnel du foyer pulmonaire avec clic protosystolique (rétrécissement)</button></li><li><button class="w" data-k="i34-e-gs">Souffle diastolique de Graham Steell (insuffisance pulmonaire sur hypertension pulmonaire)</button></li><li>Dédoublement large de B2</li><li>Soulèvement parasternal gauche (ventricule droit)</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>L’intensité d’un souffle de fuite ne mesure pas sa sévérité. Une insuffisance mitrale aiguë massive ou une fuite tricuspide torrentielle peuvent être presque silencieuses, car les pressions s’égalisent entre les deux cavités. À l’inverse, un petit prolapsus peut produire un souffle intense. La gradation repose sur l’échocardiographie.</div>
<div class="trap"><span class="k">Erreur fréquente</span>Rattacher une dyspnée à la BPCO chez une femme migrante, sans ausculter en décubitus latéral gauche avec la cloche. Le roulement du rétrécissement mitral est grave, bref et localisé à la pointe : on ne l’entend que si on le cherche.</div>
<button class="pareto-btn ui" data-k="pareto-i34-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i34-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>Le diagnostic d’une valvulopathie répond successivement à quatre questions : <b>quelle lésion, par quel mécanisme, quelle sévérité, quel retentissement ?</b> L’<button class="w" data-k="echo">échocardiographie transthoracique</button> répond aux quatre dans la majorité des cas ; c’est l’examen de référence de première ligne.</p>
<h3>7.1 Étape 1 — Échocardiographie transthoracique</h3>
<p>Elle identifie la valve atteinte et le mécanisme selon Carpentier. Elle quantifie la sévérité par une <b>approche intégrée</b> : aucun paramètre isolé ne suffit, on confronte des critères qualitatifs, semi-quantitatifs (vena contracta, flux veineux) et quantitatifs (<button class="w" data-k="i34-pisa">surface de l’orifice régurgitant et volume régurgité par la méthode PISA</button>). Pour le rétrécissement mitral, elle mesure la surface par <button class="w" data-k="i34-planim">planimétrie (mesure de référence de la surface mitrale)</button> et par le <button class="w" data-k="i34-pht">temps de demi-pression (surface = 220 / PHT)</button>, ainsi que le gradient moyen. Elle évalue enfin le retentissement : dimensions et fonction des ventricules, volume de l’oreillette gauche, pression artérielle pulmonaire systolique estimée, fonction ventriculaire droite.</p>
<h3>7.2 Étape 2 — Examens de deuxième ligne</h3>
<ul><li><b>Échocardiographie transœsophagienne, en trois dimensions</b> : anatomie précise des lésions avant réparation chirurgicale ou percutanée ; recherche d’un thrombus de l’oreillette gauche avant commissurotomie ; endocardite. Voir la fiche <button class="w" data-k="i48-eto">ETO (thrombus de l’auricule)</button>.</li>
<li><b>Échocardiographie d’effort</b> : discordance entre symptômes et sévérité au repos ; fuite secondaire dynamique ; rétrécissement mitral peu serré mais symptomatique (élévation du gradient et de la pression pulmonaire).</li>
<li><b>IRM cardiaque</b> : quantification de la fraction régurgitée lorsque l’échocardiographie est discordante ; volumes ventriculaires droits ; fibrose des piliers dans le prolapsus arythmogène.</li>
<li><b>Cathétérisme cardiaque</b> : lorsque l’imagerie non invasive est discordante ; mesure des résistances vasculaires pulmonaires avant intervention tricuspide ; coronarographie préopératoire.</li>
<li><b>Tomodensitométrie cardiaque</b> : étendue de la calcification annulaire mitrale, planification des techniques percutanées, coronaires. Le coroscanner est recommandé pour exclure une coronaropathie avant l’intervention lorsque sa probabilité prétest est faible ou modérée (≤ 50 %, classe I), car sa valeur prédictive négative y est élevée ; au-delà, la coronarographie invasive est préférée (classe I).</li></ul>
<h3>7.3 Diagnostics différentiels</h3>
<table class="t"><tr><th>Signe</th><th>Différentiels, du plus grave au plus bénin</th></tr>
<tr><td>Souffle holosystolique nouveau après infarctus</td><td>Rupture septale (communication interventriculaire), rupture de pilier, insuffisance mitrale ischémique</td></tr>
<tr><td>Souffle holosystolique apexien</td><td>Insuffisance mitrale ; insuffisance tricuspide volumineuse transmise à gauche ; communication interventriculaire (bord gauche du sternum, frémissement)</td></tr>
<tr><td>Souffle systolique éjectionnel</td><td>Rétrécissement aortique ; cardiomyopathie hypertrophique obstructive ; rétrécissement pulmonaire ; souffle fonctionnel de débit (anémie, grossesse, fièvre)</td></tr>
<tr><td>Roulement diastolique apexien</td><td>Rétrécissement mitral ; myxome de l’oreillette gauche ; roulement d’Austin Flint de l’insuffisance aortique ; roulement de débit d’une fuite mitrale sévère</td></tr>
<tr><td>Congestion droite isolée</td><td>Hypertension pulmonaire précapillaire, péricardite constrictive, cardiomyopathie restrictive, insuffisance tricuspide primaire, cirrhose (à distinguer du foie cardiaque)</td></tr></table>

<p>Les décisions d’intervention sont prises par une <button class="w" data-k="i25-heartteam">équipe cardiaque pluridisciplinaire (Heart Team)</button>, idéalement dans un centre valvulaire de référence. Celle-ci intègre la sévérité, le mécanisme, le risque opératoire (EuroSCORE II, score STS), la fragilité, l’espérance de vie et le souhait du patient informé.</p>

<section class="ilot" id="i34-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><b>Gravité d’abord.</b> Œdème pulmonaire brutal avec hypotension chez un patient sans cardiopathie connue ou quelques jours après un infarctus : penser à une <b>insuffisance mitrale aiguë</b> (rupture de pilier ou de cordage, endocardite). Œdème pulmonaire chez une femme jeune enceinte ou en fibrillation auriculaire rapide : penser à un <b>rétrécissement mitral</b>. Déficit neurologique ou ischémie aiguë d’un membre chez un patient en fibrillation auriculaire avec valvulopathie mitrale : <b>embolie</b>. Dans ces trois cas, l’échocardiographie se fait immédiatement, au lit du patient.</div>
<h3>8.1 Insuffisance mitrale aiguë sévère</h3>
<p>Le patient présente un œdème pulmonaire, souvent un choc, avec un ventricule gauche de taille normale et hyperkinétique à l’échocardiographie. Le traitement vise à diminuer la postcharge pour favoriser l’éjection antérograde et réduire le volume régurgité : dérivés nitrés ou <button class="w" data-k="i34-d-nitro">vasodilatateurs intraveineux (nitroglycérine, nitroprussiate)</button> si la pression artérielle le permet, diurétiques, ventilation non invasive. En cas d’hypotension, on recourt aux inotropes et à une assistance circulatoire temporaire, dont le ballon de contre-pulsion intra-aortique : il se dégonfle juste avant la systole, abaisse la pression aortique contre laquelle le ventricule éjecte et favorise ainsi le débit antérograde aux dépens de la fuite. La <button class="w" data-k="i21-pilier">rupture de pilier après infarctus (pilier postéromédial)</button> relève d’une chirurgie urgente, le plus souvent un remplacement valvulaire, car le muscle nécrosé se prête mal à une réparation durable ; une rupture de cordage dégénérative se répare souvent, ou se traite par TEER chez le patient à haut risque. Voir aussi la fiche <button class="w" data-k="i21-choc">choc cardiogénique (définition, stades)</button>.</p>
<h3>8.2 Œdème pulmonaire sur rétrécissement mitral</h3>
<p>Le facteur déclenchant est presque toujours une tachycardie : fibrillation auriculaire rapide, grossesse, fièvre, anémie, effort. Le traitement ralentit le cœur pour allonger la diastole : bêtabloquant intraveineux ou oral, digoxine en complément, cardioversion électrique immédiate, sous héparine, si l’instabilité hémodynamique l’impose ; si la situation permet d’attendre, cardioversion après exclusion d’un thrombus par ETO ou après trois semaines d’anticoagulation efficace, car la reprise d’une contraction auriculaire peut expulser un thrombus déjà formé dans l’auricule. Le maintien du rythme sinusal a toutefois peu de chances de réussir tant que le rétrécissement serré n’est pas levé. On y associe un diurétique et l’anticoagulation. Un œdème réfractaire justifie une commissurotomie mitrale percutanée en urgence dans un centre expérimenté.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Traiter un œdème pulmonaire sur rétrécissement mitral par un inotrope positif ou un vasodilatateur artériel puissant. L’obstacle est fixe : ni l’un ni l’autre n’augmente le débit à travers la valve, et l’inotrope accélère le cœur. Le traitement efficace est la réduction de la fréquence cardiaque.</div>
<h3>8.3 Complications au long cours</h3>
<div class="two">
<div class="card"><h4>Fibrillation auriculaire</h4><p>Complication la plus fréquente des valvulopathies mitrales et de la fuite tricuspide. Elle aggrave les symptômes (perte de la contraction auriculaire, tachycardie) et le risque embolique. Anticoagulation : <button class="w" data-k="i48-mitral">antivitamine K obligatoire dans le rétrécissement mitral rhumatismal (AOD contre-indiqués)</button>.</p></div>
<div class="card"><h4>Embolies systémiques</h4><p>Surtout dans le rétrécissement mitral, même en rythme sinusal lorsque l’oreillette est très dilatée ou siège d’un contraste spontané dense. Elles peuvent révéler la valvulopathie.</p></div>
<div class="card"><h4>Hypertension pulmonaire et insuffisance ventriculaire droite</h4><p>Marqueur de stade avancé dans les valvulopathies mitrales ; une pression artérielle pulmonaire systolique au repos &gt; 50 mmHg entre dans les critères opératoires. Ce seuil est retenu parce qu’il est associé à une mortalité plus élevée après correction, indépendamment de la fonction ventriculaire gauche : il témoigne d’une exposition prolongée de la circulation pulmonaire à des pressions élevées, et le remodelage vasculaire qui en résulte peut ne pas régresser entièrement.</p></div>
<div class="card"><h4>Endocardite infectieuse</h4><p>Risque accru sur valve native pathologique, car le flux turbulent lèse l’endothélium et offre aux bactéries une surface d’adhésion ; risque plus élevé encore après prothèse ou réparation avec anneau prothétique, matériel étranger que les bactéries colonisent. Voir le chapitre I33 et la fiche <button class="w" data-k="i33-prophy">antibioprophylaxie (patients et gestes concernés)</button>.</p></div>
<div class="card"><h4>Mort subite du prolapsus</h4><p>Rare, mais réelle dans le <button class="w" data-k="i34-mvpa">prolapsus arythmogène (disjonction de l’anneau, fibrose des piliers)</button>. Elle touche surtout des femmes jeunes à prolapsus bivalvulaire.</p></div>
<div class="card"><h4>Insuffisance cardiaque terminale</h4><p>Dysfonction ventriculaire gauche irréversible dans l’insuffisance mitrale opérée trop tard ; dysfonction ventriculaire droite et insuffisance hépatique et rénale dans la fuite tricuspide négligée.</p></div></div>
