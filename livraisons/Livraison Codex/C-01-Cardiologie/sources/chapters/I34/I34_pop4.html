
<!-- ===== FENÊTRES I34 : monographies, grossesse, aides pédagogiques ===== -->
<template data-pop="i34-d-bb" data-title="Bêtabloquants dans le rétrécissement mitral">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs β1 : baisse de la fréquence cardiaque, surtout à l’effort. La diastole s’allonge ; le gradient transmitral et la pression de l’oreillette gauche baissent pour un même débit.</p>
<div class="lab">Molécules</div><p>Métoprolol succinate (25–200 mg/jour), bisoprolol (1,25–10 mg/jour) : β1-sélectifs, utilisables pendant la grossesse (métoprolol préféré). Aténolol à éviter pendant la grossesse (retard de croissance fœtale).</p>
<div class="lab">Preuves</div><p>Amélioration de la tolérance à l’effort et des symptômes dans de petits essais ; aucun effet sur l’histoire naturelle de la sténose.</p>
<div class="lab">Alternatives</div><p>Vérapamil ou diltiazem si bêtabloquant contre-indiqué et FEVG conservée ; digoxine en complément en fibrillation auriculaire. L’ivabradine a été étudiée en rythme sinusal dans de petits essais, hors indication officielle.</p>
<div class="lab">Effets indésirables et précautions</div><p>Bradycardie, bloc auriculoventriculaire, fatigue, bronchospasme (asthme sévère), masquage des hypoglycémies ; chez la femme enceinte, surveillance de la croissance fœtale et de la glycémie néonatale.</p></template>

<template data-pop="i34-d-nitro" data-title="Vasodilatateurs intraveineux de l’insuffisance mitrale aiguë">
<div class="lab">Mécanisme</div><p>La nitroglycérine dilate surtout les veines (baisse de la précharge et de la congestion) et, à dose plus élevée, les artères. Le nitroprussiate de sodium dilate artères et veines : il réduit la postcharge, augmente la part du volume éjectée vers l’aorte et réduit le volume régurgité.</p>
<div class="lab">Posologie indicative</div><p>Nitroglycérine : débuter à 10–20 µg/min, augmenter par paliers selon la pression artérielle. Nitroprussiate : 0,3 µg/kg/min, titré jusqu’à 5 µg/kg/min au maximum, en soins intensifs, sous pression artérielle invasive.</p>
<div class="lab">Condition</div><p>Pression artérielle systolique suffisante (en pratique &gt; 90–100 mmHg). En cas d’hypotension : inotrope, ballon de contre-pulsion intra-aortique ou autre assistance circulatoire.</p>
<div class="lab">Effets indésirables</div><p>Hypotension, céphalées ; nitroprussiate : toxicité du cyanure et du thiocyanate en perfusion prolongée ou en insuffisance rénale.</p>
<div class="lab">Place</div><p>Traitement d’attente : la rupture de pilier ou de cordage avec œdème pulmonaire relève de la chirurgie.</p></template>

<template data-pop="i34-d-benz" data-title="Benzathine-benzylpénicilline">
<div class="lab">Mécanisme</div><p>Sel de pénicilline G très peu soluble : après injection intramusculaire, libération lente et concentrations faibles mais prolongées, suffisantes contre le streptocoque du groupe A pendant trois à quatre semaines.</p>
<div class="lab">Indications</div><p>Prévention secondaire du rhumatisme articulaire aigu ; traitement de l’angine streptococcique en dose unique ; syphilis.</p>
<div class="lab">Posologie</div><p>Adulte et enfant de plus de 30 kg : 1,2 million d’unités par voie intramusculaire profonde, toutes les quatre semaines (toutes les trois semaines en cas de risque élevé de récidive). Enfant de moins de 30 kg : 600 000 unités.</p>
<div class="lab">Effets indésirables</div><p>Douleur au point d’injection (atténuée par une injection lente et, selon le produit, un anesthésique local) ; réaction allergique, rare mais grave ; injection intravasculaire accidentelle (syndrome de Hoigné, syndrome de Nicolau).</p>
<div class="lab">Contre-indication</div><p>Allergie à la pénicilline : macrolide oral.</p>
<div class="lab">Disponibilité</div><p>Les ruptures d’approvisionnement sont fréquentes au niveau mondial ; en Suisse, la disponibilité se vérifie sur compendium.ch, et la pharmacie hospitalière peut organiser une importation.</p></template>

<template data-pop="i34-d-hbpm" data-title="Héparines : relais périopératoire et grossesse">
<div class="lab">Molécules</div><p>Héparine de bas poids moléculaire (énoxaparine, daltéparine, nadroparine) par voie sous-cutanée ; héparine non fractionnée par voie intraveineuse, réversible rapidement, adaptée à l’insuffisance rénale sévère et à la période périopératoire immédiate.</p>
<div class="lab">Relais d’un antivitamine K avant chirurgie</div><p>Indiqué chez les porteurs de prothèse mécanique mitrale ou à haut risque thromboembolique : arrêt de l’antivitamine K, héparine à dose thérapeutique quand l’INR passe sous la cible, dernière dose d’héparine de bas poids moléculaire 24 heures avant l’intervention. Non nécessaire dans la plupart des fibrillations auriculaires sans prothèse.</p>
<div class="lab">Grossesse avec prothèse mécanique</div><p>Héparine de bas poids moléculaire à dose adaptée au poids, deux fois par jour, avec dosage de l’activité anti-Xa (pic et, selon les recommandations, résiduel) et ajustement hebdomadaire, soit pendant toute la grossesse, soit entre la 6e et la 12e semaine avec antivitamine K le reste du temps, selon la dose d’antivitamine K nécessaire et le choix informé de la patiente (ESC sur la grossesse).</p>
<div class="lab">Effets indésirables</div><p>Hémorragies ; thrombopénie induite par l’héparine (surtout héparine non fractionnée) ; ostéoporose en traitement prolongé.</p></template>

<template data-pop="i34-grossesse" data-title="Grossesse et rétrécissement mitral">
<div class="lab">Pourquoi c’est dangereux</div><p>Le volume sanguin augmente de 40 à 50 %, la fréquence cardiaque de 10 à 20/min, le débit cardiaque de 30 à 50 %. Le gradient transmitral augmente fortement, surtout à partir du deuxième trimestre. Risques : œdème pulmonaire, fibrillation auriculaire, thrombose, retard de croissance et prématurité.</p>
<div class="lab">Avant la grossesse</div><p>Toute femme avec un rétrécissement mitral rhumatismal significatif doit être évaluée avant de concevoir. Une intervention, habituellement une commissurotomie percutanée, est recommandée si la surface est &lt; 1,0 cm² et doit être envisagée si elle est &lt; 1,5 cm² (ESC 2018, classification OMS modifiée reprise en 2025 : sténose modérée à haut risque, sténose serrée à risque très élevé).</p>
<div class="lab">Pendant la grossesse</div><p>Suivi cardiologique et obstétrical conjoint ; pour une sténose modérée ou serrée, contrôle clinique et échocardiographique mensuel ou bimestriel selon la tolérance. Bêtabloquant β1-sélectif (métoprolol) dès les symptômes ou si la pression pulmonaire systolique dépasse 50 mmHg. Diurétique si la congestion persiste, à dose prudente (perfusion placentaire). Anticoagulation en cas de fibrillation auriculaire, de thrombus de l’oreillette gauche ou d’embolie. Commissurotomie percutanée à envisager si les symptômes (NYHA III–IV) ou une pression pulmonaire systolique &gt; 50 mmHg persistent malgré le traitement, de préférence après la 20e semaine, dans un centre expert, avec protection abdominale.</p>
<div class="lab">Accouchement</div><p>Voie basse le plus souvent, sous analgésie péridurale, avec raccourcissement de la phase d’expulsion. Césarienne pour indication obstétricale, ou en cas de sténose serrée restant en classe NYHA III–IV ou avec hypertension pulmonaire malgré le traitement, lorsqu’une commissurotomie n’est pas possible.</p>
<div class="lab">Post-partum</div><p>Période à risque : le retour du sang placentaire augmente brutalement la précharge dans les heures qui suivent l’accouchement. Surveillance hémodynamique rapprochée pendant au moins 24 à 48 heures.</p>
<div class="lab">Anticoagulants</div><p>Antivitamines K : embryopathie surtout entre la 6e et la 12e semaine, risque dose-dépendant ; héparine de bas poids moléculaire avec surveillance anti-Xa pendant cette période chez les patientes concernées. AOD non recommandés. Allaitement compatible avec les antivitamines K et les héparines.</p>
<div class="lab">Attribution</div><p>Seuils et classes : ESC 2018 sur la grossesse ; l’ESC 2025 sur la grossesse reprend la classification OMS modifiée.</p></template>

<template data-pop="i34-mimetisme" data-title="Mimétisme moléculaire">
<div class="lab">Définition</div><p>Réaction croisée d’anticorps ou de lymphocytes T dirigés contre un antigène microbien avec une protéine de l’hôte de structure proche.</p>
<div class="lab">Dans le rhumatisme</div><p>La protéine M du streptocoque du groupe A, en hélice enroulée, ressemble à la myosine cardiaque et à des protéines valvulaires (laminine, vimentine). Les anticorps se fixent sur l’endothélium valvulaire ; les lymphocytes T infiltrent le feuillet et entretiennent l’inflammation.</p>
<div class="lab">Autres exemples</div><p>Chorée de Sydenham (antigènes des noyaux gris centraux) ; syndrome de Guillain et Barré après <i>Campylobacter jejuni</i>.</p>
<div class="lab">Corrélation</div><p>Chaque nouvelle infection streptococcique relance la réaction : c’est la justification de la prévention secondaire prolongée.</p></template>

<template data-pop="i34-mnemo-60" data-title="« 60 – 40 – 50 – 55 » : opérer la fuite mitrale primaire">
<p><b>60</b> — FEVG ≤ 60 % ; volume de l’oreillette gauche ≥ 60 mL/m².<br><b>40</b> — diamètre télésystolique ≥ 40 mm (ou ≥ 20 mm/m²).<br><b>50</b> — pression artérielle pulmonaire systolique au repos &gt; 50 mmHg.<br><b>55</b> — diamètre de l’oreillette gauche ≥ 55 mm.</p>
<div class="lab">Lecture</div><p>Les deux premiers chiffres (FEVG ≤ 60 %, diamètre ≥ 40 mm) suffisent chacun à poser une indication de classe I chez le patient asymptomatique. Les critères auriculaires et pulmonaires, avec la fibrillation auriculaire et la fuite tricuspide au moins modérée, s’additionnent : trois critères, classe I ; moins de trois, classe IIa si la réparation durable est probable. Tout symptôme suffit à opérer.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel ; les recommandations ESC/EACTS 2025 font foi.</p></template>

<template data-pop="i34-mnemo-mesc" data-title="« MESC » : les quatre items du score de Wilkins">
<p><b>M</b> — Mobilité des feuillets ;<br><b>E</b> — Épaississement des feuillets ;<br><b>S</b> — appareil Sous-valvulaire ;<br><b>C</b> — Calcification.</p>
<div class="lab">Lecture</div><p>Chaque item est coté de 1 à 4 ; un total ≤ 8 est favorable à la commissurotomie percutanée.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Il ne rappelle pas les contre-indications de la commissurotomie (thrombus, fuite mitrale plus que légère, calcification bicommissurale), qu’il faut vérifier séparément.</p></template>
