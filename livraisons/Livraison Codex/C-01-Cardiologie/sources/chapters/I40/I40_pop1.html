
<!-- ===== FENÊTRES I40 : notions fondamentales ===== -->
<template data-pop="i40-phases" data-title="Les trois phases de la myocardite virale">
<div class="lab">Phase 1 — virale (premiers jours)</div><p>Entrée du virus dans le cardiomyocyte ou l’endothélium, réplication, lyse cellulaire directe. Réponse innée : interférons de type I, cellules tueuses naturelles, macrophages. La troponine s’élève.</p>
<div class="lab">Phase 2 — immunitaire (semaines 1 à 4)</div><p>Infiltrat de lymphocytes T ; destruction des cellules infectées, mais aussi de cardiomyocytes sains par mimétisme moléculaire et exposition d’antigènes cachés. Si le virus disparaît et que l’inflammation persiste : myocardite post-virale.</p>
<div class="lab">Phase 3 — guérison ou remodelage (mois)</div><p>Extinction de l’inflammation et récupération chez la majorité ; chez une minorité, fibrose, dilatation et cardiomyopathie inflammatoire puis dilatée.</p>
<div class="lab">Conséquence thérapeutique</div><p>Immunosuppression contre-indiquée tant que le virus se réplique ; discutable en phase 2 ou 3 lorsque la biopsie ne montre pas de virus. Les phases se chevauchent : ce découpage est un modèle, non un calendrier strict.</p></template>

<template data-pop="i40-mimetisme" data-title="Mimétisme moléculaire">
<div class="lab">Définition</div><p>Similitude de structure entre un antigène d’un agent infectieux et une protéine de l’hôte. Les lymphocytes T et les anticorps dirigés contre l’agent reconnaissent aussi la protéine de l’hôte.</p>
<div class="lab">Dans la myocardite</div><p>Des épitopes de protéines des virus Coxsackie B ressemblent à la chaîne lourde alpha de la myosine cardiaque. La nécrose libère en outre de la myosine, normalement intracellulaire et non présentée au système immunitaire : c’est la révélation d’antigènes cachés.</p>
<div class="lab">Exemple voisin</div><p>Le rhumatisme articulaire aigu repose sur le même principe : réaction croisée entre la protéine M du streptocoque et la myosine cardiaque.</p>
<div class="lab">Corrélation clinique</div><p>Des auto-anticorps anti-myosine et anti-récepteur β1 sont retrouvés chez une partie des patients. Ils sont associés à une évolution plus fréquente vers la dysfonction chronique.</p></template>

<template data-pop="i40-oedeme" data-title="Lésion myocytaire aiguë : nécrose, œdème, troponine">
<div class="lab">Nécrose</div><p>La rupture de la membrane du cardiomyocyte libère la troponine, protéine du sarcomère. Dans la myocardite, la nécrose est diffuse et répartie en foyers, d’où un pic de troponine souvent plus bas et plus prolongé que dans l’infarctus.</p>
<div class="lab">Œdème</div><p>L’inflammation augmente la perméabilité capillaire : l’eau s’accumule dans l’interstitium. L’IRM le montre en T2 (l’eau allonge le temps de relaxation T2). L’œdème épaissit transitoirement les parois et réduit leur compliance.</p>
<div class="lab">Réversibilité</div><p>L’œdème régresse en quelques semaines ; la nécrose est remplacée par de la fibrose, visible comme un rehaussement tardif persistant. La fonction peut se normaliser si la nécrose était limitée : une part de la dysfonction aiguë est due à l’œdème et aux cytokines, non à la mort cellulaire.</p></template>

<template data-pop="i40-car" data-title="Récepteur CAR">
<div class="lab">Définition</div><p>Coxsackievirus and adenovirus receptor : protéine transmembranaire des jonctions intercellulaires, utilisée par les virus Coxsackie B et les adénovirus pour entrer dans la cellule.</p>
<div class="lab">Répartition</div><p>Très exprimé dans le cœur de l’enfant et dans les disques intercalaires, exprimé davantage dans le myocarde enflammé ou dilaté.</p>
<div class="lab">Corrélation</div><p>Ce tropisme explique la fréquence des myocardites à entérovirus chez l’enfant et le jeune adulte. Des souris dépourvues de récepteur CAR cardiaque sont protégées de la myocardite à Coxsackie dans les modèles expérimentaux.</p></template>

<template data-pop="i40-cmi" data-title="Cardiomyopathie inflammatoire">
<div class="lab">Définition (ESC 2025)</div><p>Myocardite chronique associée à une dysfonction ventriculaire et à un remodelage hypokinétique, avec ou sans dilatation, avec ou sans substrat arythmogène.</p>
<div class="lab">Diagnostic</div><p>Il exige la biopsie : inflammation selon les critères immunohistochimiques, recherche de génome viral. L’IRM peut montrer un œdème persistant, mais elle ne distingue pas un virus actif d’une auto-immunité.</p>
<div class="lab">Traitement</div><p>Traitement de l’insuffisance cardiaque ; immunosuppression guidée par la biopsie, à envisager (classe IIa, niveau B, ESC 2025) si le virus est absent et la dysfonction persiste. L’essai TIMIC (2009) a montré une amélioration de la FEVG sous prednisone et azathioprine pendant 6 mois dans cette population sélectionnée.</p>
<div class="lab">Codage</div><p>La forme chronique dilatée se code avec les cardiomyopathies (chapitre I42).</p></template>

<template data-pop="i40-mnemo-bach" data-title="« BACH » : drapeaux rouges d’une forme spécifique">
<p><b>B</b> — Bloc auriculoventriculaire de haut degré ;<br><b>A</b> — Arythmie ventriculaire soutenue ou réfractaire ;<br><b>C</b> — Choc, ou insuffisance cardiaque rapidement progressive malgré un traitement bien conduit ;<br><b>H</b> — Histoire auto-immune ou Hyperéosinophilie.</p>
<div class="lab">Conduite</div><p>Un seul de ces signaux fait discuter la biopsie endomyocardique en centre expert, à la recherche d’une myocardite à cellules géantes, à éosinophiles, d’une sarcoïdose ou d’une myocardite de l’immunothérapie.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Il regroupe les situations à haut risque où l’ESC 2025 recommande ou propose la biopsie.</p>
<div class="lab">Indication de l’ESC 2025</div><p>La biopsie est recommandée (classe I, niveau C) devant une insuffisance cardiaque inexpliquée de moins de deux semaines, avec un ventricule gauche normal ou dilaté, associée à une arythmie ventriculaire nouvelle, à un bloc auriculoventriculaire du deuxième ou du troisième degré, ou à l’absence de réponse au traitement habituel en une à deux semaines. Le résultat doit être rendu en trois jours au plus, idéalement en huit heures.</p>
<div class="lab">Pourquoi ces signaux</div><p>Le bloc et l’arythmie ventriculaire soutenue traduisent une destruction du tissu de conduction et du myocarde que la myocardite lymphocytaire non compliquée produit rarement. L’absence de réponse au traitement de l’insuffisance cardiaque signale une agression immunitaire active, que ce traitement n’atteint pas. Une maladie auto-immune ou une éosinophilie oriente vers l’effecteur en cause.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 6.5 et 9.3, tableau de recommandations 16.</p>
</template>

<template data-pop="i40-genet" data-title="Génétique de la myocardite : quand faire l’analyse">
<div class="lab">ESC 2025</div><p>L’histoire familiale fait partie de l’anamnèse de tout patient ; l’ESC 2025 recommande de l’étendre à un arbre généalogique dans les formes récidivantes (classe I, niveau C). Analyse génétique à envisager (classe IIa, niveau B) si : histoire familiale de cardiomyopathie ou de mort subite ; arythmie ventriculaire sévère ; rehaussement tardif en anneau ou septal ; dysfonction persistante ; myocardite récidivante ; troponine élevée de façon prolongée.</p>
<div class="lab">Gènes en cause</div><p><i>DSP</i> et autres gènes desmosomaux, <i>FLNC</i> : épisodes pseudo-myocarditiques, risque rythmique élevé. Variants tronquants de <i>TTN</i> : évolution vers la dysfonction.</p>
<div class="lab">Comparaison</div><p>Le consensus américain de l’ACC (2024) propose une indication plus large. L’ESC 2025 cible les patients où le rendement est le plus élevé.</p>
<div class="lab">En Suisse</div><p>Consentement éclairé et conseil génétique selon la loi fédérale sur l’analyse génétique humaine.</p>
<div class="lab">Mécanisme</div><p>Les desmosomes ancrent les cardiomyocytes les uns aux autres et résistent aux forces de la contraction. Un variant de <i>DSP</i> (desmoplakine) fragilise cet ancrage ; selon l’hypothèse actuelle, des cardiomyocytes meurent sous la contrainte et leurs débris entretiennent l’inflammation. L’ESC 2025 souligne qu’on ignore encore si l’inflammation déclenche la cardiomyopathie ou en fait partie.</p>
<div class="lab">Gènes selon la gravité</div><p>Les variants desmosomaux dominent dans les myocardites non compliquées (64 %), les variants sarcomériques dans les myocardites compliquées (58 % chez l’adulte, 71 % chez l’enfant). Chez l’enfant atteint d’une forme compliquée, un variant pathogène est retrouvé dans 45 % des cas.</p>
<div class="lab">Ce qui change la décision</div><p>Un variant pathogène modifie la conduite. Le seuil d’implantation d’un défibrillateur en prévention primaire est plus bas dans une cardiomyopathie arythmogène, alors qu’on diffère ce choix pendant une myocardite aiguë. Les apparentés au premier degré reçoivent un conseil génétique et un dépistage clinique et génétique en cascade.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 4.3.5 et 5.3, tableau de recommandations 2.</p>
</template>

<template data-pop="i40-risque" data-title="Stratification du risque de la myocardite (ESC 2025)">
<div class="lab">Faible risque</div><p>Douleur thoracique, FEVG conservée, pas d’insuffisance cardiaque, pas d’arythmie ventriculaire ni de bloc de haut degré, troponine qui baisse. Hospitalisation avec monitorage, proposée par l’ESC 2025 (classe IIa, niveau C) ; elle est recommandée (classe I, niveau C) dès le risque intermédiaire.</p>
<div class="lab">Risque intermédiaire</div><p>FEVG modérément réduite, arythmies non soutenues, troponine persistante ou symptômes qui ne régressent pas. Hospitalisation en soins continus.</p>
<div class="lab">Haut risque</div><p>Insuffisance cardiaque aiguë, choc cardiogénique, arythmie ventriculaire soutenue, bloc auriculoventriculaire de haut degré, absence de réponse au traitement. Soins intensifs en centre expert ; biopsie endomyocardique recommandée dans l’insuffisance cardiaque aiguë et le choc (classe I, niveau C), élargie à des patients sélectionnés dans les autres situations.</p>
<div class="lab">Facteur pronostique le plus puissant</div><p>La dysfonction biventriculaire prédit le plus fortement le décès ou la transplantation (ESC 2025).</p>
<div class="lab">Seuils d’imagerie (tableau 7)</div><p>Le haut risque comprend une FEVG nouvellement inférieure à 40 % ou un rehaussement tardif étendu, ainsi qu’une syncope ou un arrêt cardiaque. Le risque intermédiaire comprend une FEVG de 41 à 49 %, des troubles de la cinétique, ou une FEVG conservée avec un rehaussement d’au moins deux segments. Le faible risque associe une FEVG d’au moins 50 % et un rehaussement absent ou limité à moins de deux segments.</p>
<div class="lab">Pourquoi ces critères</div><p>La FEVG mesure la part du myocarde qui ne se contracte plus. Le rehaussement tardif mesure la nécrose et la fibrose, qui serviront de substrat aux réentrées ventriculaires même après la guérison. Une syncope fait craindre un arrêt circulatoire transitoire par arythmie ou par bloc. Le patient non compliqué peut sortir lorsque la troponine tend à se normaliser.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, tableau 7, tableau de recommandations 1 et section 7.1.2.</p>
</template>

<template data-pop="i40-fulm-prono" data-title="Pronostic de la myocardite fulminante">
<div class="lab">Ancienne notion</div><p>Une série américaine publiée en 2000 dans le <i>New England Journal of Medicine</i> avait suggéré que les patients survivant à une myocardite fulminante avaient un meilleur pronostic à long terme que ceux avec une forme non fulminante.</p>
<div class="lab">Données récentes</div><p>Dans le registre multicentrique d’Ammirati et coll. (<i>JACC</i> 2019), chez des patients avec dysfonction ventriculaire, décès ou transplantation à 60 jours : environ 28 % dans la forme fulminante, contre environ 2 % dans la forme non fulminante. L’écart persiste à long terme. La myocardite à cellules géantes a le pronostic le plus sombre.</p>
<div class="lab">Message</div><p>La forme fulminante reste la plus grave. Une récupération complète est possible, mais elle n’est pas la règle : la prise en charge doit être agressive et précoce.</p>
<div class="lab">Facteurs associés au décès ou à la transplantation</div><p>L’ESC 2025 retient la myocardite à cellules géantes, un QRS supérieur à 120 ms sur l’ECG initial et le besoin d’une assistance circulatoire plus puissante qu’un ballon de contre-pulsion. Le besoin d’une assistance lourde mesure la profondeur du choc. Un diagnostic tardif et une intervention retardée aggravent aussi l’évolution : ce sont les seuls facteurs que l’équipe peut corriger.</p>
<div class="lab">Dans la forme lymphocytaire seule</div><p>Chez l’adulte atteint de myocardite lymphocytaire, l’écart persiste : décès cardiaque ou transplantation à 60 jours chez 19,5 % des formes fulminantes, contre 0 % des formes non fulminantes avec dysfonction. La gravité tient donc à la présentation elle-même, et pas seulement au type histologique.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, section 7.1 ; Ammirati et al., Journal of the American College of Cardiology 2019.</p>
</template>

<template data-pop="i40-ecmo" data-title="Assistance circulatoire mécanique temporaire">
<div class="lab">Objectif</div><p>Maintenir la perfusion des organes pendant que le myocarde récupère (pont vers la récupération), ou jusqu’à une décision de transplantation ou d’assistance durable (pont vers la décision).</p>
<div class="lab">Dispositifs</div><p><b>ECMO veino-artérielle</b> : pompe et oxygénateur ; supplée les deux ventricules et les poumons ; augmente la postcharge du ventricule gauche, qui doit parfois être déchargé. <b>Impella</b> : pompe microaxiale transvalvulaire aortique qui décharge le ventricule gauche. <b>Ballon de contre-pulsion intra-aortique</b> : assistance modeste.</p>
<div class="lab">Choix</div><p>L’ECMO veino-artérielle est privilégiée dans le choc avancé (stades SCAI D–E) ou biventriculaire (ESC 2025). La décharge du ventricule gauche par un Impella sous ECMO est fréquente dans les centres experts.</p>
<div class="lab">Moment</div><p>Avant la défaillance multiviscérale, au stade SCAI C à D. Une biopsie peut être faite au moment de l’implantation.</p>
<div class="lab">Complications</div><p>Hémorragie, ischémie de membre, hémolyse, infection, accident vasculaire cérébral.</p>
<div class="lab">Pourquoi décharger le ventricule gauche</div><p>L’ECMO veino-artérielle réinjecte le sang dans l’aorte à contre-courant et élève la pression contre laquelle le ventricule gauche doit éjecter. Un ventricule défaillant peut ne plus ouvrir la valve aortique : il se distend, la pression capillaire pulmonaire monte et le sang stagne, ce qui expose au thrombus. Une technique de décharge vide alors le ventricule.</p>
<div class="lab">Données de l’ESC 2025</div><p>L’ECMO veino-artérielle est utilisée dans 75 à 85 % des myocardites assistées. La survie hospitalière atteint 61 à 72 % dans les séries multicentriques, car le myocarde récupère souvent ; la forme fulminante à cellules géantes fait exception, sans survie libre de transplantation. Le ballon de contre-pulsion peut servir d’assistance de première intention, à condition de passer à un dispositif plus puissant si la perfusion des organes ne s’améliore pas en une heure au plus. Une équipe de choc décide de l’escalade (classe I, niveau C) ; l’assistance temporaire est à envisager dans le choc (classe IIa, niveau C).</p>
<div class="lab">Biopsie sous assistance</div><p>Les complications de la biopsie atteignent 26 % chez les patients assistés. L’ESC 2025 la recommande néanmoins le plus tôt possible, car son résultat oriente l’immunosuppression.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 5.9.1, 6.3.1.1 et 6.3.1.2, tableau de recommandations 11 ; Torre et al., Journal of Personalized Medicine 2025.</p>
</template>

<template data-pop="i40-wcd" data-title="Défibrillateur portable">
<div class="lab">Principe</div><p>Gilet porté en continu, muni d’électrodes qui détectent une tachycardie ou une fibrillation ventriculaire et délivrent un choc. Le patient peut suspendre le choc s’il est conscient (fausse alarme).</p>
<div class="lab">Place (ESC 2025)</div><p>À envisager (classe IIa, niveau C) pendant 3 à 6 mois, comme pont vers la récupération, chez un patient qui a présenté une arythmie ventriculaire soutenue pendant la phase aiguë.</p>
<div class="lab">Limites</div><p>Efficacité dépendante du port réel (plus de 20 heures par jour) ; inconfort ; pas de stimulation antibradycardique.</p>
<div class="lab">Après la phase aiguë</div><p>Défibrillateur implantable recommandé (classe I) après une tachycardie ventriculaire mal tolérée en phase de myocardite inactive ; à envisager (classe IIa) si elle est bien tolérée.</p>
<div class="lab">Pourquoi un pont</div><p>Pendant la phase active, les arythmies naissent de l’inflammation et peuvent disparaître avec elle ; un défibrillateur implanté alors exposerait à vie aux complications d’un appareil peut-être inutile. La récidive des arythmies soutenues reste pourtant fréquente. Le gilet couvre ce risque pendant les 3 à 6 mois nécessaires pour réévaluer la cicatrice et la fonction.</p>
<div class="lab">Prévention primaire après la phase aiguë</div><p>Après 3 à 6 mois, un défibrillateur implantable peut être envisagé (classe IIb, niveau C) si des facteurs de risque persistent : tachycardie ventriculaire non soutenue, rehaussement tardif étendu, syncope inexpliquée, stimulation ventriculaire programmée positive ou FEVG inférieure à 50 %.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 6.5.1 et 7.1.2, tableau de recommandations 14.</p>
</template>
<template data-pop="i40-arythmies" data-title="Arythmies ventriculaires de la myocardite : inflammation active et cicatrice">
<div class="lab">Physiologie normale</div><p>L’onde d’activation parcourt normalement tout le myocarde ventriculaire en moins de 120 ms, durée du QRS, grâce au réseau de Purkinje et aux jonctions communicantes des disques intercalaires. Les cellules se repolarisent ensuite de façon coordonnée, ce qui empêche une réexcitation prématurée.</p>
<div class="lab">Mécanisme en phase active</div><p>Pendant l’inflammation, l’œdème, la nécrose et les cytokines perturbent la conduction et rendent la repolarisation hétérogène. Des foyers déclenchés et des réentrées instables apparaissent. Les arythmies de cette phase sont surtout polymorphes et irrégulières, et elles peuvent disparaître quand l’inflammation s’éteint.</p>
<div class="lab">Mécanisme après la guérison</div><p>La fibrose remplace la nécrose en plaques. Entre les plaques persistent des faisceaux de cardiomyocytes qui conduisent lentement : une onde peut y tourner en boucle et réexciter le myocarde, ce qui définit la réentrée. Les arythmies de cette phase sont surtout monomorphes et régulières, et elles peuvent survenir des années après l’épisode. L’ablation par cathéter réussit donc mieux après la phase inflammatoire.</p>
<div class="lab">Conséquence clinique</div><p>Une fibrose myocardique était présente chez 95 % des patients morts subitement, contre 41 % des autres. Chez des patients à FEVG conservée, un rehaussement tardif de la paroi moyenne du septum antérieur était le meilleur facteur prédictif indépendant de mort subite, avec un risque multiplié par 4,6. Après une arythmie grave, un rehaussement d’au moins deux segments et l’absence d’œdème sur l’IRM initiale multipliaient le risque de récidive par 4,5 et 2,6. Après une arythmie ventriculaire soutenue de la phase aiguë, la récidive atteint 28 à 60 %.</p>
<div class="lab">Ce qui change la décision</div><p>En phase active, le traitement vise l’inflammation, les électrolytes et les catécholamines ; le défibrillateur implantable n’est qu’envisageable (classe IIb, niveau C), car le risque peut disparaître. Après la phase active, une tachycardie ventriculaire mal tolérée impose le défibrillateur (classe I, niveau C) et une tachycardie bien tolérée le fait envisager (classe IIa, niveau C). L’IRM de contrôle dans les 6 mois distingue l’inflammation persistante de la cicatrice et guide cette stratification.</p>
<div class="lab">Source</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 4.3.3, 4.3.4, 6.5 et 7.1, tableau de recommandations 14.</p></template>
