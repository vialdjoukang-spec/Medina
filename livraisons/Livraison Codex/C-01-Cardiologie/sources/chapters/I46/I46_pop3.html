
<!-- ===== FENÊTRES I46 : examens ===== -->
<template data-pop="i46-ecg-fv" data-title="Fibrillation ventriculaire à l’ECG">
<div class="lab">Aspect</div><p>Oscillations irrégulières, de forme, d’amplitude et de fréquence variables (environ 150 à 500/min), sans QRS, segment ST ni onde T identifiables.</p>
<div class="lab">Grandes et petites mailles</div><p>FV à grandes mailles (amplitude supérieure à environ 3 mm) : arrêt récent, meilleure réponse au choc. FV à petites mailles : arrêt prolongé, réponse moindre ; elle peut ressembler à une asystolie.</p>
<div class="lab">Pièges</div><p>Artéfacts de mouvement, de compressions ou de frissons, électrode décollée : tracé pseudo-fibrillatoire chez un patient qui a un pouls. Toujours regarder le patient.</p>
<div class="lab">Analyse du signal</div><p>Des outils d’analyse de la forme d’onde (amplitude-fréquence) sont étudiés pour choisir le moment du choc ; ils ne sont pas recommandés en routine.</p></template>

<template data-pop="i46-ecg-asys" data-title="Asystolie : confirmer avant de conclure">
<div class="lab">Vérifications</div><p>Connexion des électrodes et des câbles ; gain de l’amplitude ; au moins deux dérivations ou changement de dérivation ; éviter la sélection « électrodes » sans électrodes posées.</p>
<div class="lab">Ondes P sans QRS</div><p>Asystolie ventriculaire avec activité auriculaire : bloc auriculoventriculaire complet sans échappement. La stimulation (transcutanée ou endocavitaire) peut être efficace, contrairement à l’asystolie vraie.</p>
<div class="lab">Pronostic</div><p>Rythme de plus mauvais pronostic, sauf cause réversible (hypoxie, hyperkaliémie, hypothermie, intoxication).</p></template>

<template data-pop="i46-ecg-post" data-title="ECG après le retour de la circulation">
<div class="lab">Ce qu’on cherche</div><p>Sus-décalage du ST et équivalents d’occlusion (infarctus postérieur, bloc de branche gauche avec ischémie, aspect de de Winter) ; signes d’hyperkaliémie ; QT long ; aspect de Brugada ; pré-excitation ; hypertrophie ventriculaire ; onde epsilon et ondes T négatives en V1–V3 (cardiomyopathie arythmogène).</p>
<div class="lab">Délai</div><p>Un tracé enregistré dans les premières minutes après le RACS montre souvent des sus-décalages dus à l’ischémie globale, aux chocs et à l’adrénaline. Un tracé répété après environ 8 minutes réduit les faux positifs.</p>
<div class="lab">Pièges</div><p>Un sous-décalage diffus avec sus-décalage en aVR est fréquent après un arrêt et n’est pas spécifique d’une lésion du tronc commun. L’hypothermie donne des ondes J (onde d’Osborn) et un QT long.</p></template>

<template data-pop="i46-capno" data-title="Capnographie pendant et après la réanimation">
<div class="lab">Principe</div><p>Mesure infrarouge du CO₂ dans les gaz expirés, affichée en courbe (capnogramme) et en valeur de fin d’expiration (EtCO₂). Le CO₂ expiré dépend de sa production, du débit sanguin pulmonaire et de la ventilation.</p>
<div class="lab">Quatre usages (ERC 2025)</div><p>1. Confirmer la position trachéale de la sonde. 2. Surveiller la fréquence de ventilation. 3. Évaluer la qualité des compressions. 4. Détecter un RACS sans interrompre les compressions.</p>
<div class="lab">Pronostic</div><p>Une EtCO₂ basse et persistante après 20 minutes de réanimation avancée est associée à un faible taux de RACS, mais aucun seuil isolé ne doit décider de l’arrêt de la réanimation.</p>
<div class="lab">Après le RACS</div><p>L’EtCO₂ sous-estime la PaCO₂ lorsque l’espace mort augmente (bas débit, embolie) : vérifier la cible de normocapnie par la gazométrie.</p></template>

<template data-pop="i46-gds" data-title="Gazométrie pendant et après l’arrêt">
<div class="lab">Pendant l’arrêt</div><p>Sert à identifier une cause (potassium, hémoglobine, glycémie, calcium ionisé) plutôt qu’à guider le pH. Un prélèvement artériel donne une image faussement rassurante de l’oxygénation et de l’acidose tissulaire ; le prélèvement veineux reflète mieux les tissus.</p>
<div class="lab">Après le RACS</div><p>Cibles : PaO₂ 75–100 mmHg, PaCO₂ 35–45 mmHg ; pH et lactate en amélioration progressive. La gazométrie guide le réglage du ventilateur.</p>
<div class="lab">Effet de la température</div><p>La solubilité des gaz augmente au froid ; les analyseurs mesurent à 37 °C. Chez un patient hypotherme, la stratégie « alpha-stat » (valeurs non corrigées) est habituellement utilisée.</p>
<div class="lab">Piège</div><p>Chez un patient à peau foncée, l’oxymètre de pouls peut surestimer la saturation : l’ERC-ESICM 2025 recommande de contrôler par la gazométrie.</p></template>

<template data-pop="i46-lactate" data-title="Lactate après un arrêt cardiaque">
<div class="lab">Valeur normale</div><p>&lt; 2 mmol/L.</p>
<div class="lab">Signification</div><p>Presque toujours très élevé au RACS (souvent 5 à 15 mmol/L) : reflet de la durée et de la profondeur de l’hypoperfusion. Une valeur initiale élevée est associée à une mortalité plus élevée, mais ne suffit pas à décider.</p>
<div class="lab">Cinétique</div><p>Une décroissance rapide dans les 6 à 12 heures témoigne d’une reperfusion efficace ; une stagnation doit faire rechercher un bas débit persistant, une ischémie mésentérique, une convulsion, une intoxication (metformine, cyanure) ou une insuffisance hépatique.</p></template>

<template data-pop="i46-echo-arret" data-title="Échographie ciblée pendant la réanimation">
<div class="lab">Technique</div><p>Sonde prête avant la pause ; vue sous-xiphoïdienne ; enregistrement d’une boucle de quelques secondes pendant la vérification du rythme ; analyse pendant la reprise des compressions. La pause ne doit pas dépasser 10 secondes.</p>
<div class="lab">Apports</div><p>Tamponnade, hypovolémie, pneumothorax (absence de glissement pleural), activité cardiaque organisée (pseudo-AESP), guidage d’une péricardiocentèse.</p>
<div class="lab">Limites</div><p>Allongement fréquent des pauses dans les études ; faible spécificité de la dilatation du ventricule droit ; pas de valeur pronostique suffisante pour arrêter une réanimation sur la seule absence de mouvement cardiaque.</p>
<div class="lab">Échocardiographie transœsophagienne</div><p>Utilisée par certaines équipes pendant la réanimation : visualisation sans interruption, contrôle de la position des compressions sur le ventricule gauche.</p>
<div class="lab">Statut</div><p>Réservée par l’ERC 2025 aux opérateurs expérimentés.</p></template>

<template data-pop="i46-tdm" data-title="Tomodensitométrie de la tête au bassin après le RACS">
<div class="lab">Indication (ERC-ESICM 2025)</div><p>Arrêt dont la cause n’est pas clairement coronaire : examen de la tête au bassin incluant une angiographie pulmonaire, plutôt qu’une imagerie sélective.</p>
<div class="lab">Ce qu’elle montre</div><p>Hémorragie sous-arachnoïdienne ou intracérébrale, embolie pulmonaire, dissection aortique, pneumonie d’inhalation, pneumothorax ; complications de la réanimation (fractures costales, lésions hépatiques ou spléniques, hémopéricarde).</p>
<div class="lab">Précautions</div><p>Transport d’un patient instable ; charge en produit de contraste chez un patient à la fonction rénale fragile, acceptée compte tenu de l’enjeu diagnostique.</p>
<div class="lab">Technique et contrôle</div><p>Acquisition à double phase (artérielle et veineuse). Si le patient reste inconscient et que la première tomodensitométrie cérébrale ne montrait pas de lésion anoxique, la répéter vers 72 à 96 heures pour le pronostic (ERC-ESICM 2025).</p></template>

<template data-pop="i46-nse" data-title="Énolase neuronale spécifique (NSE)">
<div class="lab">Nature</div><p>Isoenzyme glycolytique (gamma-gamma) des neurones et des cellules neuroendocrines, libérée dans le sang lors de la lyse neuronale.</p>
<div class="lab">Seuil</div><p>&gt; 60 µg/L à 48 et/ou 72 heures : critère défavorable de l’algorithme ERC-ESICM 2025. Une élévation entre 24 et 48 ou 72 heures renforce la valeur.</p>
<div class="lab">Faux positifs</div><p>Hémolyse (la NSE est présente dans les érythrocytes : doser l’indice d’hémolyse), ECMO, tumeurs neuroendocrines ou pulmonaires à petites cellules.</p>
<div class="lab">Limites</div><p>Différences entre méthodes de dosage ; valeur isolée jamais suffisante.</p></template>

<template data-pop="i46-pess" data-title="Potentiels évoqués somesthésiques (PESS)">
<div class="lab">Principe</div><p>Stimulation électrique du nerf médian au poignet ; enregistrement des réponses au plexus brachial (N9), à la moelle cervicale (N13) et au cortex somesthésique primaire (N20, environ 20 ms après la stimulation).</p>
<div class="lab">Interprétation</div><p>Abolition bilatérale de la N20 avec N9 et N13 présentes (voie périphérique intacte), à 24 heures ou plus : lésion corticale étendue, critère défavorable très spécifique.</p>
<div class="lab">Limites</div><p>Artéfacts musculaires (une curarisation brève améliore l’enregistrement) ; présence de la N20 sans valeur prédictive d’un bon pronostic ; peu influencés par la sédation.</p></template>

<template data-pop="i46-eeg" data-title="EEG après un arrêt cardiaque">
<div class="lab">Tracés hautement malins</div><p>Activité de fond supprimée (amplitude &lt; 10 µV) sans décharges, supprimée avec décharges périodiques continues, ou bouffées-suppression : critère défavorable après 24 heures.</p>
<div class="lab">Tracés favorables</div><p>Activité de fond continue, de voltage normal, réactive aux stimulations.</p>
<div class="lab">Crises</div><p>Les crises électriques et l’état de mal non convulsif sont fréquents ; l’essai TELSTAR (2022) n’a pas montré de bénéfice d’un traitement agressif des décharges rythmiques et périodiques.</p>
<div class="lab">Confusion</div><p>La sédation (propofol, midazolam) atténue l’activité de fond ; interpréter après réduction de la sédation.</p></template>

<template data-pop="i46-imgcer" data-title="Imagerie cérébrale après un arrêt cardiaque">
<div class="lab">Tomodensitométrie</div><p>Signes de lésion anoxique diffuse : œdème généralisé, effacement des sillons, perte de la différenciation substance grise-substance blanche (rapport des densités grise/blanche abaissé), aspect de « pseudo-hémorragie sous-arachnoïdienne ». Meilleure valeur entre 24 et 72 heures ; une tomodensitométrie précoce normale n’a pas de valeur pronostique.</p>
<div class="lab">IRM</div><p>Restriction de diffusion étendue du cortex et des noyaux gris, entre 2 et 7 jours. Plus sensible que la tomodensitométrie, mais difficile chez un patient instable.</p>
<div class="lab">Statut</div><p>Critère défavorable de l’algorithme si les lésions sont diffuses et étendues ; les seuils quantitatifs ne sont pas standardisés.</p></template>
