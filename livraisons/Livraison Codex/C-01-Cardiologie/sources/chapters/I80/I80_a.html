<section class="ilot" id="i80-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 34 ans, sous contraception œstroprogestative, revient d’un vol de 11 heures. Depuis trois jours, son mollet gauche est douloureux et gonflé : la circonférence dépasse de 3,5 cm celle du côté droit. Elle n’a ni dyspnée ni douleur thoracique. La question qui structure le chapitre est la suivante : <b>a-t-elle une thrombose veineuse profonde, comment le prouver sans examens inutiles, quel anticoagulant prescrire, pendant combien de temps, et que faire de sa contraception ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait estimer la probabilité clinique (score de Wells), interpréter les D-dimères (y compris ajustés à l’âge), demander la bonne échographie, choisir et doser un anticoagulant oral direct ou une héparine, décider de la durée selon le caractère provoqué ou non, traiter une thrombose superficielle, reconnaître une phlegmatia et une thrombose splanchnique, et prévenir la maladie thromboembolique chez les patients à risque.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i80-virchow">triade de Virchow</button>, la <button class="w" data-k="i80-coag">cascade de la coagulation et ses inhibiteurs</button> et le lien avec l’<button class="w" data-k="i80-ep">embolie pulmonaire (renvoi au système Poumon)</button>.</div>
</section>
<section class="ilot" id="i80-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>La <b>thrombose veineuse profonde</b> est l’obstruction partielle ou totale d’une veine du réseau profond par un thrombus. Avec l’embolie pulmonaire, elle forme la <b>maladie thromboembolique veineuse</b> : une même maladie, dont l’embolie est la complication immédiate la plus grave. Environ 50 % des patients avec thrombose proximale ont une embolie pulmonaire asymptomatique à l’imagerie, et 70 % des patients avec embolie pulmonaire ont une thrombose des membres inférieurs.</p>
<div class="two">
<div class="card"><h4>Proximale</h4><p>Veine poplitée ou plus haut (fémorale, iliaque, veine cave). Risque embolique élevé : <b>traitement anticoagulant toujours</b>.</p></div>
<div class="card"><h4>Distale (sous-poplitée)</h4><p>Veines tibiales, fibulaires, musculaires du mollet (soléaires, gastrocnémiennes). Risque plus faible ; environ 15 à 25 % s’étendent vers le haut sans traitement : traitement de 3 mois ou surveillance échographique selon le risque.</p></div></div>
<p><b>Selon le contexte</b> : <b>provoquée</b> par un facteur transitoire majeur (chirurgie, immobilisation prolongée), mineur (voyage, contraception, grossesse, traumatisme mineur) ou persistant (cancer actif, maladie inflammatoire) ; <b>non provoquée</b> (sans facteur identifié). Cette distinction décide de la durée du traitement.</p>
<p><b>Codage CIM-10-GM</b> : I80 thrombose, phlébite et thrombophlébite (I80.0 superficielle des membres inférieurs, I80.1 veine fémorale, I80.2 autres veines profondes des membres inférieurs, I80.3 membres inférieurs sans précision) ; I81 thrombose de la veine porte ; I82 autres embolies et thromboses veineuses (I82.0 syndrome de Budd-Chiari, I82.2 veine cave, I82.8 autres dont membres supérieurs).</p>
</section>
<section class="ilot" id="i80-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’incidence de la maladie thromboembolique veineuse est d’environ <b>1 à 2 pour 1 000 personnes par an</b> dans la population européenne, augmentant fortement avec l’âge (plus de 5 pour 1 000 après 80 ans). C’est la troisième maladie cardiovasculaire après l’infarctus et l’accident vasculaire cérébral. <b>Pronostic</b> : récidive d’environ 30 % à 10 ans après une thrombose non provoquée arrêtée, 3 % par an après une thrombose provoquée par un facteur majeur ; <b>syndrome post-thrombotique</b> chez 20 à 50 % des patients après une thrombose proximale ; mortalité liée surtout à l’embolie pulmonaire, au cancer associé et aux hémorragies du traitement.</p>
</section>
<section class="ilot" id="i80-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La <button class="w" data-k="i80-virchow">triade de Virchow</button> décrit trois conditions : <b>stase</b> (immobilité, compression, insuffisance cardiaque), <b>lésion de la paroi</b> (chirurgie, traumatisme, cathéter) et <b>hypercoagulabilité</b> (cancer, œstrogènes, grossesse, thrombophilie, inflammation). Le thrombus naît le plus souvent dans les <b>poches valvulaires</b> des veines du mollet, zones de flux ralenti et d’hypoxie locale où l’endothélium exprime des molécules d’adhésion. Il est riche en fibrine et en globules rouges (« thrombus rouge »), à l’inverse du thrombus artériel riche en plaquettes : c’est pourquoi on le traite par anticoagulants et non par antiagrégants. Il s’étend vers le haut, peut se fragmenter (embolie), puis s’organise ; la destruction des valvules pendant la recanalisation provoque le reflux veineux chronique du syndrome post-thrombotique.</p>

<section class="ilot" id="i80-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<table class="t"><tr><th>Force</th><th>Facteurs</th></tr>
<tr><td><b>Majeurs, transitoires</b></td><td>Chirurgie avec anesthésie générale &gt; 30 minutes (surtout orthopédie : prothèse de hanche ou de genou, fracture du col), hospitalisation ou alitement ≥ 3 jours pour maladie aiguë, traumatisme majeur, lésion médullaire</td></tr>
<tr><td><b>Persistants</b></td><td><b>Cancer actif</b> (pancréas, estomac, poumon, cerveau, ovaire, hémopathies) et chimiothérapie, maladies inflammatoires intestinales, syndrome néphrotique, syndrome des antiphospholipides, insuffisance cardiaque, antécédent de thrombose</td></tr>
<tr><td><b>Mineurs</b></td><td>Œstrogènes (contraception combinée : risque × 3 à 6, pic la première année ; traitement hormonal oral de la ménopause), grossesse et post-partum (risque × 5 à 20, maximal en post-partum), voyage de plus de 4 heures, obésité, immobilisation d’un membre par plâtre, âge, varices</td></tr>
<tr><td><b>Thrombophilies</b></td><td>Facteur V Leiden (≈ 5 % des Suisses hétérozygotes), mutation G20210A de la prothrombine, déficits en antithrombine, protéine C, protéine S, syndrome des antiphospholipides</td></tr>
<tr><td><b>Médicaments</b></td><td>Œstrogènes, tamoxifène, raloxifène, thalidomide et lénalidomide, érythropoïétine, testostérone, corticostéroïdes, et en psychiatrie les <b>antipsychotiques</b> (surtout clozapine, olanzapine, antipsychotiques de faible puissance) : risque relatif d’environ 1,5 à 2</td></tr></table>
<div class="trap"><span class="k">Piège</span>Un patient agité sous contention physique prolongée et sous antipsychotique cumule immobilité et facteur médicamenteux : des décès par embolie pulmonaire ont été rapportés. Évaluer et prescrire une thromboprophylaxie selon le risque dès la contention.</div>
</section>
<section class="ilot" id="i80-5"><h2><span class="n">5</span>Clinique</h2>
<p>Les signes sont <b>peu sensibles et peu spécifiques</b> : c’est leur combinaison avec le contexte qui compte. Douleur du mollet ou de la cuisse, spontanée ou à la palpation le long du trajet veineux ; <b>œdème unilatéral</b> prenant le godet ; différence de circonférence du mollet <b>&gt; 3 cm</b> (mesurée 10 cm sous la tubérosité tibiale) ; chaleur ; dilatation des veines superficielles collatérales non variqueuses ; fébricule. Le signe de Homans (douleur à la dorsiflexion du pied) est abandonné : ni sensible ni spécifique. La thrombose est souvent <b>asymptomatique</b>, surtout après chirurgie.</p>
<p>Rechercher systématiquement les signes d’<b>embolie pulmonaire</b> (dyspnée, douleur thoracique, tachycardie, désaturation, syncope) et ceux d’un <b>cancer</b> occulte (amaigrissement, anémie, symptômes digestifs), sans bilan extensif systématique.</p>
<p><b>Diagnostics différentiels</b> : rupture de kyste poplité (de Baker), hématome ou déchirure musculaire, érysipèle ou cellulite, lymphœdème, insuffisance veineuse chronique, syndrome des loges, œdème médicamenteux (inhibiteurs calciques) ou d’insuffisance cardiaque (souvent bilatéral).</p>
</section>
<section class="ilot" id="i80-6"><h2><span class="n">6</span>Démarche diagnostique</h2>
<p>La démarche est <b>séquentielle</b> et commence toujours par la <b>probabilité clinique</b> :</p>
<ol>
<li><b>Score de Wells</b> (<button class="w" data-k="i80-wells">fiche du score</button>) : probabilité faible (≤ 1 point) ou élevée (≥ 2 points).</li>
<li><b>Probabilité faible</b> : <b>D-dimères</b> ; négatifs (&lt; 500 µg/L, ou <b>&lt; âge × 10 µg/L</b> après 50 ans), la thrombose est exclue, sans échographie. Positifs : échographie.</li>
<li><b>Probabilité élevée</b> : <b>échographie de compression</b> d’emblée (les D-dimères n’excluent pas dans ce groupe).</li>
<li>Échographie normale limitée aux veines proximales avec probabilité élevée ou D-dimères positifs : répéter à 5–7 jours, ou pratiquer une échographie complète du membre.</li></ol>

<div class="trap"><span class="k">Erreur fréquente</span>Doser les D-dimères chez un patient à probabilité élevée, hospitalisé, opéré récemment, enceinte ou atteint de cancer : ils sont presque toujours positifs et n’apportent rien. Leur seule force est d’<b>exclure</b> chez le patient à faible probabilité.</div>
<div class="quiz ui"><p>Homme de 72 ans, probabilité clinique faible (Wells 0), D-dimères à 620 µg/L. Conduite ?</p><button data-ok="1">D-dimères inférieurs au seuil ajusté à l’âge (720 µg/L) : thrombose exclue sans échographie</button><button data-ok="0">Échographie obligatoire car D-dimères &gt; 500</button><button data-ok="0">Anticoagulation d’emblée</button><p class="fb" hidden>Après 50 ans, le seuil vaut âge × 10 µg/L : 72 × 10 = 720 µg/L. Cette règle (étude ADJUST-PE pour l’embolie) augmente le nombre de patients exclus sans perte de sécurité.</p></div>
