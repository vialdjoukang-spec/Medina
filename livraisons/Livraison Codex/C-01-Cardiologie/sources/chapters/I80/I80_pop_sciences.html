<template data-pop="i80-pompe" data-title="Pompe du mollet et hypertension veineuse"><p>La contraction du mollet comprime les veines profondes. Les valvules orientent le sang vers le cœur. Pendant le relâchement, le réseau se remplit. La répétition de ce cycle aide le retour contre la gravité.</p><p>Une obstruction empêche la sortie ; une insuffisance valvulaire permet le reflux. Après une thrombose, les deux peuvent persister. L’œdème et la gêne peuvent donc durer même lorsque l’épisode aigu est traité.</p><div class="key"><b>À retenir.</b> La mobilisation et la compression, lorsqu’elles sont indiquées, répondent à la physiologie veineuse. Elles ne remplacent pas l’évaluation d’une thrombose aiguë.</div></template>
<template data-pop="i80-fibrinolyse" data-title="Anticoagulation, fibrinolyse et D-dimères"><p>La thrombine transforme le fibrinogène en fibrine. Le réseau stabilisé peut ensuite être dégradé par la plasmine. Cette dégradation libère notamment des D-dimères.</p><p>L’anticoagulant freine surtout la génération de thrombine et l’extension. Il ne dissout pas immédiatement tout le caillot. Les mécanismes physiologiques assurent une partie du remodelage. Une thrombolyse stimule la dissolution et expose à un risque hémorragique important.</p><div class="trap"><b>Piège.</b> Des D-dimères élevés peuvent accompagner de nombreuses situations. Ils n’identifient ni la veine atteinte ni l’indication d’une thrombolyse.</div></template>
<template data-pop="i80-test-thrombophilie" data-title="Thrombophilie : utilité et limites du bilan"><p>Le médecin définit d’abord la décision que le test pourrait modifier. La phase aiguë et les anticoagulants peuvent perturber des dosages fonctionnels. Un résultat bas nécessite parfois un contrôle à distance dans des conditions adaptées.</p><p>Une hétérozygotie du facteur V Leiden ou de la prothrombine n’impose pas seule une anticoagulation indéfinie. L’épisode clinique, les facteurs persistants et le risque de saignement restent déterminants. Un variant somatique JAK2 répond à une autre question que la transmission d’une thrombophilie familiale.</p><div class="key"><b>À retenir.</b> Le bilan doit apporter une information utile. Un panel large sans conséquence définie peut produire une interprétation trompeuse.</div></template>
<template data-pop="pareto-i80-sciences" data-title="Pareto — Sciences fondamentales veineuses"><p class="ratio" data-cover="i80-sa,i80-sp,i80-sc,i80-sg"></p><p>La veine fémorale appartient au réseau profond. Les jonctions saphènes relient les réseaux et doivent être décrites. Une veine normale se comprime ; l’incompressibilité constitue un signe majeur de thrombose.</p><p>La pompe du mollet et les valvules favorisent le retour. L’immobilité augmente la stase. La triade de Virchow relie stase, activation pariétale et hypercoagulabilité.</p><p>Xa et Va produisent la thrombine, qui produit la fibrine. Les anticoagulants freinent cette génération et l’extension du thrombus. La plasmine dégrade la fibrine ; les D-dimères ne sont pas spécifiques.</p><p>Une thrombophilie modifie une probabilité. Le contexte clinique et le moment du dosage déterminent l’interprétation. Une hétérozygotie isolée ne décide pas automatiquement la durée de traitement.</p></template>
