
<!-- ===== FENÊTRES : clinique ===== -->
<template data-pop="atcd-coro" data-title="Antécédent de cardiopathie ischémique">
<div class="lab">Comment le rechercher</div><p>« Avez-vous déjà eu un infarctus, un stent, un pontage ? » Demander les comptes rendus : localisation, FEVG de sortie, revascularisation complète ou non.</p>
<div class="lab">Pourquoi</div><p>C’est la première cause d’ICFEr. Il oriente vers une coronarographie, conditionne l’indication d’un défibrillateur en prévention primaire et impose le traitement de prévention secondaire.</p></template>

<template data-pop="atcd-cardiotox" data-title="Antécédent de traitement cardiotoxique">
<div class="lab">Molécules</div><p><b>Anthracyclines</b> (doxorubicine) : toxicité dose-dépendante, cumulative et souvent irréversible, pouvant apparaître des années plus tard. <b>Trastuzumab</b> : dysfonction souvent réversible à l’arrêt. <b>Inhibiteurs de points de contrôle immunitaire</b> : myocardite précoce, rare mais grave. <b>Radiothérapie thoracique</b> : atteintes valvulaires, coronaires et péricardiques tardives.</p>
<div class="lab">Question</div><p>« Avez-vous reçu une chimiothérapie ou une radiothérapie ? Laquelle, quand, à quelle dose ? »</p></template>

<template data-pop="s-dyspnee" data-title="Dyspnée d’effort">
<div class="lab">Caractériser</div><p>Seuil d’effort (étages, distance), évolution dans le temps, classe NYHA, symptômes associés (douleur thoracique, palpitations, toux), réversibilité au repos.</p>
<div class="lab">Physiopathologie</div><p>À l’effort, la fréquence et le retour veineux augmentent. Le ventricule insuffisant ne peut ni augmenter son débit ni absorber ce retour sans élever la pression capillaire pulmonaire. La congestion interstitielle stimule les récepteurs J et réduit la compliance pulmonaire.</p>
<div class="lab">Diagnostic différentiel</div><p>BPCO, asthme, anémie, déconditionnement, obésité, embolie pulmonaire chronique, hypertension pulmonaire. Peu spécifique : c’est l’association aux autres éléments qui oriente.</p></template>

<template data-pop="s-orthopnee" data-title="Orthopnée">
<div class="lab">Caractériser</div><p>« Combien d’oreillers utilisez-vous ? Dormez-vous assis ? Depuis quand ? » Un nombre croissant d’oreillers est un bon marqueur d’aggravation.</p>
<div class="lab">Physiopathologie</div><p>En décubitus, le sang des membres inférieurs et de l’abdomen revient vers le thorax. Le ventricule gauche, sur la partie plate de sa courbe de Frank-Starling, ne peut éjecter ce volume : la pression capillaire pulmonaire s’élève.</p>
<div class="lab">Valeur</div><p>Plus spécifique de l’insuffisance cardiaque que la dyspnée d’effort ; se retrouve aussi en cas d’ascite volumineuse, d’obésité ou de paralysie diaphragmatique.</p></template>

<template data-pop="s-dpn" data-title="Dyspnée paroxystique nocturne">
<p>Réveil brutal par une sensation d’étouffement, une à trois heures après le coucher, soulagé en position assise ou debout après quelques minutes, parfois accompagné de toux ou de sifflements (« asthme cardiaque »).</p>
<div class="lab">Physiopathologie</div><p>Réabsorption progressive des œdèmes des membres inférieurs en décubitus, avec une augmentation lente du volume intravasculaire ; baisse nocturne du tonus adrénergique ; dépression nocturne du centre respiratoire.</p>
<div class="lab">Piège</div><p>Les sifflements peuvent faire poser à tort un diagnostic d’asthme ou de BPCO.</p></template>

<template data-pop="s-bendo" data-title="Bendopnée">
<p>Dyspnée apparaissant dans les 30 secondes qui suivent la flexion du tronc en avant, par exemple pour lacer ses chaussures.</p>
<div class="lab">Mécanisme</div><p>La compression abdominale augmente le retour veineux et la pression de remplissage chez un patient déjà congestif.</p>
<div class="lab">Valeur</div><p>Associée à des pressions de remplissage élevées ; simple à rechercher à la consultation.</p></template>

<template data-pop="v-ta" data-title="Pression artérielle dans l’insuffisance cardiaque">
<div class="lab">Technique</div><p>Mesure après cinq minutes de repos, aux deux bras à la première consultation, puis en orthostatisme (hypotension orthostatique sous traitement).</p>
<div class="lab">Interprétation</div><p>Une PAS basse est un marqueur de mauvais pronostic. Elle limite la titration, mais une hypotension asymptomatique n’impose pas seule de réduire la TMF. Une PAS &gt; 110 mmHg permet d’envisager un vasodilatateur en décompensation selon le profil. Une PAS &lt; 90 mmHg avec hypoperfusion fait rechercher un choc ; une pression conservée ne l’exclut pas.</p>
<div class="lab">Pression différentielle</div><p>Pincée (&lt; 25 % de la PAS) : suggère un bas débit.</p></template>

<template data-pop="poidssec" data-title="Poids sec">
<p>Poids du patient en l’absence de congestion clinique, établi à la sortie d’hospitalisation ou lors d’un état stable.</p>
<div class="lab">Usage</div><p>Référence pour l’autosurveillance quotidienne : pesée le matin, à jeun, après la miction. Une prise de plus de 2 kg en trois jours fait suspecter une rétention débutante. Le patient contacte l’équipe et suit son plan écrit ; une adaptation du diurétique dépend des symptômes, de la congestion et de la tolérance.</p></template>

<template data-pop="e-crepitants" data-title="Crépitants pulmonaires">
<div class="lab">Technique</div><p>Auscultation des bases, en commençant par la partie la plus déclive, patient assis ; faire tousser pour distinguer les râles d’encombrement, qui se modifient.</p>
<div class="lab">Sémiologie</div><p>Bruits fins, inspiratoires, bilatéraux, prédominant aux bases, montant vers les sommets avec la gravité (classification de Killip dans l’infarctus).</p>
<div class="lab">Pièges</div><p>Absents chez de nombreux insuffisants cardiaques chroniques congestifs ; présents aussi dans la fibrose pulmonaire (crépitants « velcro ») et la pneumonie (souvent unilatéraux).</p></template>

<template data-pop="e-b3" data-title="Troisième bruit (B3)">
<div class="lab">Technique</div><p>Patient en décubitus latéral gauche ; stéthoscope en cloche à la pointe ; bruit sourd, grave, juste après B2 (rythme en « Ken-tuc-ky »).</p>
<div class="lab">Mécanisme</div><p>Décélération brutale du remplissage rapide dans un ventricule dilaté ou soumis à des pressions de remplissage élevées.</p>
<div class="lab">Valeur</div><p>Très spécifique d’une dysfonction ventriculaire chez l’adulte de plus de 40 ans, mais peu sensible. Physiologique chez l’enfant, l’athlète jeune et la femme enceinte.</p></template>

<template data-pop="e-jugulaire" data-title="Turgescence jugulaire et reflux hépato-jugulaire">
<div class="lab">Technique</div><p>Patient à 45°, tête légèrement tournée à gauche, lumière tangentielle. Observer la veine jugulaire interne droite (pulsatile, non palpable, variant avec la respiration). Mesurer la hauteur verticale de la colonne au-dessus de l’angle sternal.</p>
<div class="lab">Interprétation</div><p>Plus de 3 à 4 cm au-dessus de l’angle sternal : pression veineuse centrale élevée (en ajoutant environ 5 cm, distance entre l’angle et l’oreillette droite).</p>
<div class="lab">Reflux hépato-jugulaire</div><p>Pression ferme et continue sur l’hypochondre droit ou le centre de l’abdomen pendant 10 à 15 secondes. Une ascension soutenue d’au moins 3 cm est positive et témoigne d’un ventricule droit incapable d’absorber le retour veineux.</p>
<div class="lab">Valeur</div><p>C’est le signe clinique le plus fiable de congestion, et il guide la décongestion.</p></template>

<template data-pop="e-alternant" data-title="Pouls alternant">
<p>Alternance régulière d’un pouls fort et d’un pouls faible en rythme sinusal. Il se mesure au mieux au tensiomètre, en dégonflant lentement le brassard : seuls les battements forts sont d’abord audibles.</p>
<div class="lab">Signification</div><p>Dysfonction ventriculaire gauche sévère : alternance du remplissage et de la disponibilité du calcium intracellulaire d’un battement à l’autre.</p></template>

<template data-pop="champ" data-title="CHAMP — causes aiguës de décompensation à éliminer">
<p><b>C</b> — syndrome <b>C</b>oronarien aigu (ECG, troponine) ;<br><b>H</b> — urgence <b>H</b>ypertensive ;<br><b>A</b> — <b>A</b>rythmie (fibrillation auriculaire rapide, tachycardie ventriculaire, bradycardie sévère) ;<br><b>M</b> — cause <b>M</b>écanique (rupture septale ou de pilier, insuffisance valvulaire aiguë, dissection) ;<br><b>P</b> — embolie <b>P</b>ulmonaire.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique ESC, non critère officiel. Chaque cause a un traitement spécifique urgent. À compléter par les causes fréquentes : infection, non-observance, écart sodé, AINS, anémie, insuffisance rénale, dysthyroïdie.</p></template>

<template data-pop="tachycm" data-title="Cardiomyopathie rythmique">
<p>Dysfonction ventriculaire gauche causée par une fréquence cardiaque rapide et prolongée (fibrillation ou flutter auriculaire, tachycardie atriale, extrasystoles ventriculaires très fréquentes).</p>
<div class="lab">Diagnostic</div><p>Il est rétrospectif : la FEVG se normalise en quelques semaines à quelques mois après le contrôle de la fréquence ou du rythme.</p>
<div class="lab">Conséquence</div><p>Devant toute ICFEr avec une tachyarythmie, contrôler la fréquence et réévaluer la FEVG avant de poser une indication de défibrillateur.</p></template>

<template data-pop="amylose" data-title="Amylose cardiaque">
<div class="lab">Deux formes principales</div><p><b>ATTR</b> : transthyrétine, sauvage (sujet âgé, souvent homme) ou héréditaire ; évolution lente ; traitements : stabilisateurs de la transthyrétine (tafamidis, acoramidis) ou silenceur de l’ARN (vutrisiran, essai HELIOS-B) ; statut Swissmedic et remboursement selon compendium.ch. <b>AL</b> : chaînes légères d’immunoglobuline, liée à une dyscrasie plasmocytaire ; évolution rapide ; urgence hématologique (chimiothérapie de type daratumumab-CyBorD).</p>
<div class="lab">Drapeaux rouges</div><p>Parois épaisses et bas voltage ECG ; canal carpien bilatéral ; sténose lombaire ; rupture du tendon du biceps ; hypertension qui disparaît ; troponine chroniquement élevée ; intolérance aux traitements vasodilatateurs.</p>
<div class="lab">Diagnostic non invasif de l’ATTR</div><p>Scintigraphie osseuse (DPD, PYP ou HMDP) avec fixation cardiaque de grade 2 ou 3 selon Perugini, et absence de protéine monoclonale (immunofixation sérique et urinaire, chaînes légères libres). Si une protéine monoclonale est présente, une biopsie est nécessaire.</p>
<div class="lab">Gold standard</div><p>Biopsie (endomyocardique ou extracardiaque) avec coloration au rouge Congo et typage de la protéine.</p></template>

<template data-pop="ppcm" data-title="Cardiomyopathie du péripartum">
<p>Dysfonction systolique (FEVG &lt; 45 %) survenant vers la fin de la grossesse ou dans les mois qui suivent l’accouchement, sans autre cause identifiable.</p>
<div class="lab">Mécanisme proposé</div><p>Un fragment de 16 kDa de la prolactine, produit dans un contexte de stress oxydatif, est antiangiogénique et cardiotoxique. C’est le rationnel de la bromocriptine, envisagée en milieu spécialisé avec une anticoagulation.</p>
<div class="lab">Particularités</div><p>IEC, ARA II, ARNI, ARM, iSGLT2 et ivabradine sont contre-indiqués pendant la grossesse ; l’énalapril et le captopril sont possibles pendant l’allaitement. Le risque de récidive lors d’une grossesse ultérieure est élevé si la FEVG ne s’est pas normalisée.</p></template>
