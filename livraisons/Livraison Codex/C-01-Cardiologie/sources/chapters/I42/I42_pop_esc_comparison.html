<div class="lab">Deux questions cliniques</div><p>Le référentiel ESC 2023 sur les cardiomyopathies précise le diagnostic étiologique, l’analyse génétique, le dépistage familial et la stratification du risque. Le référentiel ESC 2026 sur l’insuffisance cardiaque porte sur le syndrome d’insuffisance cardiaque. La définition d’un syndrome et l’étiologie du muscle cardiaque ne sont pas interchangeables.</p>
<div class="lab">Classification de la fraction d’éjection</div><p>La classification antérieure distinguait une fraction d’éjection ≤ 40 %, de 41 à 49 %, et ≥ 50 %. L’ESC 2026 regroupe les fractions d’éjection &lt; 50 % dans l’insuffisance cardiaque à fraction d’éjection réduite, et conserve le groupe ≥ 50 % pour la fraction d’éjection préservée. Le changement de nomenclature ne modifie pas automatiquement les seuils propres au défibrillateur, à un examen d’imagerie ou à un médicament.</p>
<div class="lab">Classes de recommandation</div><p>Une classe de recommandation doit être vérifiée dans le tableau du référentiel et pour la situation clinique exacte. L’utilité de l’analyse génétique ou de la tomographie par émission de positons ne suffit pas à attribuer une nouvelle classe ESC 2026. Le conseil génétique et l’interprétation du résultat restent liés au contexte familial et au phénotype.</p>
<div class="lab">Sources</div><p><a href="https://doi.org/10.1093/eurheartj/ehad194" target="_blank" rel="noopener">ESC 2023 — Cardiomyopathies</a> ; <a href="https://www.escardio.org/news/press/press-releases/major-changes-made-to-the-esc-guidelines-on-heart-failure/" target="_blank" rel="noopener">ESC 2026 — Modifications officielles de l’insuffisance cardiaque</a>.</p>
