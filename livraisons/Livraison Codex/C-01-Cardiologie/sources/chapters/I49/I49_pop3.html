
<!-- ===== FENÊTRES I49 : fibrillation ventriculaire, échappements, POTS, sport, grossesse ===== -->
<template data-pop="i49-fv-ecg" data-title="ECG de la FV et du flutter ventriculaire">
<div class="lab">Fibrillation ventriculaire</div><p>Ondulations irrégulières, sans QRS ni onde T identifiables, de fréquence supérieure à 300/min environ, de forme et d’amplitude variables. <b>À grandes mailles</b> au début ; <b>à petites mailles</b> quand l’arrêt se prolonge et que les réserves énergétiques du myocarde s’épuisent.</p>
<div class="lab">Flutter ventriculaire</div><p>Ondulation sinusoïdale régulière, monomorphe, d’environ 300/min (souvent entre 250 et 350/min), sans ligne isoélectrique et sans distinction entre QRS et onde T. Instable : il dégénère en FV.</p>
<div class="lab">Pièges</div><p><b>Artefacts</b> (tremblement, frissons, mouvement, électrode décollée) : regarder le patient, qui peut être conscient. <b>FV à petites mailles et asystolie</b> : vérifier les connexions, augmenter le gain, regarder deux dérivations ; en cas de doute, poursuivre les compressions et réanalyser. <b>TV rapide monomorphe</b> au-delà de 250/min : proche du flutter ventriculaire ; la conduite dépend du pouls.</p></template>

<template data-pop="i49-fv-meca" data-title="Mécanismes de la FV : déclencheur, substrat, modulateur">
<div class="lab">Déclencheur</div><p>Une ESV, souvent précoce, ou une TV qui dégénère ; parfois un choc thoracique pendant la période vulnérable.</p>
<div class="lab">Substrat</div><p>Ischémie aiguë (dispersion de la réfractarité, conduction lente) ; cicatrice ; hypertrophie ; fibrose ; canalopathie ; QT long.</p>
<div class="lab">Modulateurs</div><p>Catécholamines, hypokaliémie, hypomagnésémie, acidose, médicaments proarythmiques, hypothermie.</p>
<div class="lab">Entretien</div><p>Multiples ondes de réentrée qui se fragmentent et se recombinent sans cesse, et rotors (tourbillons d’activation) instables ; le réseau de Purkinje participe à l’entretien dans les premières minutes.</p>
<div class="lab">Corrélation thérapeutique</div><p>La défibrillation dépolarise en même temps une masse critique de myocarde et éteint toutes les ondes. Plus la FV dure, plus le myocarde s’épuise et moins le choc est efficace : les compressions prolongent la fenêtre dans laquelle le choc peut réussir.</p></template>

<template data-pop="i49-commotio" data-title="Commotio cordis">
<div class="lab">Définition</div><p>FV provoquée par un choc thoracique non pénétrant, sans lésion structurelle du cœur : balle, palet, coup de poing ou de pied sur la région précordiale.</p>
<div class="lab">Mécanisme</div><p>Le choc survient dans une fenêtre étroite avant le sommet de l’onde T (période vulnérable) ; l’étirement brutal active des canaux mécanosensibles et produit une dépolarisation qui déclenche la FV.</p>
<div class="lab">Terrain</div><p>Surtout l’adolescent et l’adulte jeune de sexe masculin, dont la paroi thoracique est souple ; sports de balle et arts martiaux.</p>
<div class="lab">Pronostic et prévention</div><p>La survie dépend de la rapidité des compressions et de la défibrillation. Des défibrillateurs automatisés externes accessibles sur les terrains de sport sont la mesure la plus efficace.</p></template>

<template data-pop="i49-erc" data-title="Réanimation d’une FV ou d’une TV sans pouls (ERC 2025)">
<div class="lab">Réanimation de base</div><p>Reconnaître l’arrêt (inconscience, respiration absente ou anormale) ; alerter (144) ; compressions de 5 à 6 cm à 100–120/min, 30 compressions pour 2 insufflations ; défibrillateur automatisé externe dès qu’il est disponible.</p>
<div class="lab">Défibrillation</div><p>Choc biphasique d’au moins 150 J pour le premier choc (130–150 J pour les ondes biphasiques pulsées) ; augmenter l’énergie des chocs suivants si l’appareil le permet. Un choc unique, puis reprise immédiate des compressions pendant 2 minutes, sans contrôle du pouls. Pauses avant et après le choc aussi brèves que possible.</p>
<div class="lab">Chocs successifs</div><p>Jusqu’à trois chocs d’emblée si l’arrêt survient devant témoin, sous monitorage, avec un défibrillateur immédiatement disponible (salle de cathétérisme, soins intensifs).</p>
<div class="lab">Médicaments</div><p>Adrénaline 1 mg par voie intraveineuse ou intraosseuse après le 3e choc, puis toutes les 3 à 5 minutes. Amiodarone 300 mg après le 3e choc, puis 150 mg après le 5e. Lidocaïne 100 mg, puis 50 mg, si l’amiodarone n’est pas disponible ou par choix local.</p>
<div class="lab">FV réfractaire</div><p>Vérifier la position des électrodes ; changer de vecteur (position antéropostérieure) ; traiter les causes réversibles : hypoxie, hypovolémie, hypo- ou hyperkaliémie et autres troubles métaboliques, hypothermie ; thrombose coronaire ou pulmonaire, tamponnade, pneumothorax sous tension, toxiques. Réanimation extracorporelle chez des patients sélectionnés, dans les centres qui la pratiquent.</p>
<div class="lab">Voies aériennes</div><p>Ventilation au masque puis voie aérienne avancée par un opérateur entraîné, sans interrompre les compressions ; capnographie.</p></template>

<template data-pop="i49-rosc" data-title="Soins après réanimation et bilan étiologique">
<div class="lab">Premières heures</div><p>ECG à 12 dérivations ; coronarographie urgente si sus-décalage du segment ST ; à discuter selon la probabilité d’occlusion coronaire sinon. Oxygène titré pour une SpO₂ de 94 à 98 % ; normocapnie ; pression artérielle moyenne supérieure à 65 mmHg environ ; glycémie contrôlée ; prévention active de la fièvre (température supérieure à 37,7 °C) pendant au moins 72 heures chez le patient qui reste comateux (recommandations ERC-ESICM 2025).</p>
<div class="lab">Bilan étiologique</div><p>Ionogramme, troponine, échocardiographie, IRM cardiaque ; recherche toxicologique ; ECG répétés (QT, Brugada, repolarisation précoce) ; test aux bloqueurs sodiques et épreuve d’effort chez le jeune sans cause ; génétique selon l’orientation.</p>
<div class="lab">Pronostic neurologique</div><p>Évaluation multimodale, en règle au plus tôt 72 heures après le retour de la circulation, pour ne pas limiter les soins trop tôt.</p>
<div class="lab">Prévention secondaire</div><p>Défibrillateur si aucune cause aiguë réversible n’est identifiée (classe I, ESC 2022) ; information et réanimation apprises par les proches.</p></template>

<template data-pop="i49-riva" data-title="Rythme idioventriculaire accéléré">
<div class="lab">ECG</div><p>Rythme ventriculaire régulier à QRS larges, entre environ 50 et 110/min, qui démarre et s’arrête progressivement, en compétition avec le sinus ; complexes de fusion et de capture fréquents à la transition.</p>
<div class="lab">Mécanisme</div><p>Automatisme anormal d’un foyer ventriculaire, qui prend le commandement quand sa fréquence dépasse celle du sinus.</p>
<div class="lab">Contextes</div><p>Reperfusion après un infarctus (angioplastie ou fibrinolyse), intoxication digitalique, cocaïne, cardiomyopathies, myocardite ; parfois chez le sujet sain ou l’athlète.</p>
<div class="lab">Conduite</div><p>Bénin et transitoire : surveillance. Aucun antiarythmique, qui pourrait supprimer un rythme utile. Si la perte de la systole auriculaire est mal tolérée, accélérer le sinus (atropine) suffit souvent.</p></template>

<template data-pop="i49-rja" data-title="Rythme jonctionnel accéléré">
<div class="lab">ECG</div><p>QRS fins réguliers, environ 60 à 100/min (au-delà, on parle de tachycardie jonctionnelle), avec des ondes P rétrogrades ou dissociées.</p>
<div class="lab">Causes</div><p>Intoxication digitalique (en fibrillation auriculaire : rythme ventriculaire qui devient régulier), chirurgie cardiaque récente, infarctus inférieur, myocardite, hypokaliémie, catécholamines, isoprénaline.</p>
<div class="lab">Conduite</div><p>Traiter la cause : digoxinémie, potassium, arrêt du médicament. Une fibrillation auriculaire qui se régularise sous digoxine est une intoxication jusqu’à preuve du contraire.</p></template>

<template data-pop="i49-pots-crit" data-title="Critères du syndrome de tachycardie orthostatique posturale">
<div class="lab">Critères (HRS 2015)</div><p>1. Augmentation soutenue de la fréquence cardiaque d’au moins 30/min dans les 10 minutes suivant le passage debout ou l’inclinaison (au moins 40/min entre 12 et 19 ans). 2. Absence d’hypotension orthostatique (baisse de la pression systolique de moins de 20 mmHg). 3. Symptômes fréquents d’intolérance orthostatique, aggravés debout et améliorés couché.</p>
<div class="lab">Chronicité</div><p>Au moins 3 mois selon la réunion de consensus des NIH (2019, publiée en 2021).</p>
<div class="lab">Exclusions</div><p>Autre cause de tachycardie orthostatique : déshydratation aiguë, saignement, alitement prolongé, médicament, hyperthyroïdie, anémie, phéochromocytome, insuffisance surrénalienne.</p>
<div class="lab">Remarque</div><p>Beaucoup de patients dépassent 120/min debout, mais aucun seuil absolu de fréquence n’est exigé. Le seuil de 30/min seul manque de spécificité chez l’adolescent, d’où le seuil de 40/min.</p></template>

<template data-pop="i49-pots-phys" data-title="Phénotypes du POTS">
<div class="lab">Neuropathique</div><p>Neuropathie des petites fibres sympathiques des membres inférieurs : vasoconstriction insuffisante, accumulation veineuse dans les jambes (acrocyanose debout), sudation distale réduite. Les tests de sudation et la biopsie cutanée peuvent la documenter.</p>
<div class="lab">Hyperadrénergique</div><p>Noradrénaline plasmatique debout élevée (≥ 600 pg/mL), hausse de la pression systolique debout (≥ 10 mmHg), tremblement, anxiété, sueurs, migraine. Rarement génétique (défaut du transporteur de la noradrénaline).</p>
<div class="lab">Hypovolémique</div><p>Volume plasmatique réduit, avec un système rénine-aldostérone paradoxalement peu activé ; répond bien à l’expansion volémique.</p>
<div class="lab">Déconditionnement</div><p>Ventricule gauche petit, volume d’éjection bas ; présent chez beaucoup de patients, cause ou conséquence de l’inactivité.</p>
<div class="lab">Portée</div><p>Ces phénotypes se chevauchent et ne sont pas des entités distinctes ; ils orientent le choix des traitements d’appoint.</p></template>

<template data-pop="i49-pots-covid" data-title="POTS après une infection virale ou un COVID-19">
<div class="lab">Constat</div><p>Un POTS apparaît chez une partie des patients après une infection virale, en particulier après un COVID-19, dans le cadre d’un syndrome persistant après le COVID-19 (déclaration de l’American Autonomic Society, 2021). Des cas ont aussi été rapportés après une vaccination, bien plus rarement qu’après l’infection.</p>
<div class="lab">Hypothèses</div><p>Déconditionnement après la maladie, hypovolémie, réaction auto-immune contre des récepteurs adrénergiques ou muscariniques, neuropathie des petites fibres. Aucune n’est démontrée comme cause unique.</p>
<div class="lab">Conduite</div><p>Même démarche que pour tout POTS. Si un malaise post-effort (aggravation retardée et prolongée après un effort) est présent, l’entraînement se fait par paliers très progressifs, en respectant les limites du patient.</p></template>

<template data-pop="i49-pots-dd" data-title="Diagnostic différentiel du POTS">
<table class="t"><tr><th>Diagnostic</th><th>Élément distinctif</th></tr>
<tr><td>Tachycardie sinusale inappropriée</td><td>Fréquence de repos &gt; 100/min et moyenne sur 24 heures &gt; 90/min, même couché</td></tr>
<tr><td>Hypotension orthostatique</td><td>Chute de la pression ≥ 20/10 mmHg ; accélération faible si neurogène</td></tr>
<tr><td>Syncope réflexe</td><td>Épisodes avec prodromes et perte de connaissance, fréquence normale entre les épisodes</td></tr>
<tr><td>Hypovolémie aiguë, saignement, déshydratation</td><td>Contexte récent, anomalies biologiques ; corrigée par la réhydratation</td></tr>
<tr><td>Déconditionnement après alitement</td><td>Histoire d’immobilisation ; s’améliore avec la reprise progressive</td></tr>
<tr><td>Anémie, hyperthyroïdie</td><td>Hémogramme, TSH</td></tr>
<tr><td>Phéochromocytome</td><td>Poussées hypertensives, céphalées, sueurs ; métanéphrines</td></tr>
<tr><td>Médicaments</td><td>Inhibiteurs de la recapture de la sérotonine et de la noradrénaline, tricycliques, stimulants, vasodilatateurs, diurétiques</td></tr>
<tr><td>Trouble anxieux, trouble panique</td><td>Symptômes non liés à la position ; peut coexister</td></tr>
<tr><td>Trouble des conduites alimentaires</td><td>Amaigrissement, bradycardie de repos, hypovolémie</td></tr>
<tr><td>Tachycardie paroxystique (réentrée)</td><td>Début et fin brutaux, indépendants de la position</td></tr></table></template>

<template data-pop="i49-pots-tt" data-title="Mesures non médicamenteuses du POTS">
<div class="lab">Comprendre</div><p>Expliquer que la tachycardie compense un retour veineux insuffisant et que l’entraînement progressif est le traitement le plus efficace à long terme.</p>
<div class="lab">Volume</div><p>2 à 3 L de liquides par jour ; 10 à 12 g de sel par jour, par l’alimentation ou en comprimés, sauf hypertension, insuffisance cardiaque ou rénale. Boire environ 500 mL d’eau rapidement avant le lever ou avant une activité debout : l’effet presseur de l’eau dure environ une heure.</p>
<div class="lab">Retour veineux</div><p>Bas de compression remontant jusqu’à la taille ou ceinture abdominale ; manœuvres de contre-pression (croiser les jambes, contracter les fessiers, s’accroupir) dès les premiers symptômes ; surélever la tête du lit.</p>
<div class="lab">Entraînement</div><p>Programme de trois mois ou plus, débuté en position couchée ou assise (rameur, vélo couché, natation), 3 à 4 séances par semaine, puis intégration progressive d’exercices debout. Les symptômes peuvent s’aggraver les premières semaines : prévenir le patient pour éviter l’abandon.</p>
<div class="lab">Vie quotidienne</div><p>Repas fractionnés et moins riches en glucides rapides ; éviter la chaleur, l’alcool, la station debout immobile ; lever en deux temps ; sommeil régulier ; aménagements scolaires ou professionnels temporaires.</p></template>

<template data-pop="i49-sport" data-title="Sport et extrasystoles">
<div class="lab">Athlète : quand chercher plus loin</div><p>Deux ESV ou plus sur un ECG de repos de 10 secondes (critères internationaux de 2017) : Holter, échocardiographie et épreuve d’effort. IRM si la morphologie n’est pas celle d’une chambre de chasse ou d’un fascicule, si les ESV augmentent ou se compliquent à l’effort, ou si elles sont très nombreuses : dans une série d’athlètes, 2 000 ESV ou plus par 24 heures s’associaient à une anomalie cardiaque dans environ 30 % des cas (Biffi et coll., 2002).</p>
<div class="lab">Autorisation (ESC 2020)</div><p>ESV de morphologie habituelle (chambres de chasse, fascicules), sans cardiopathie, sans complexité à l’effort : tous les sports, y compris la compétition. ESV avec cardiopathie : selon la cardiopathie.</p>
<div class="lab">Situations particulières</div><p>Cardiomyopathie induite : pas de compétition tant que la FEVG n’a pas récupéré, attitude habituelle en l’absence de recommandation spécifique. Après ablation : reprise après contrôle rythmologique. POTS : l’activité physique progressive est un traitement. Survivant d’une FV porteur d’un défibrillateur : voir la <button class="w" data-k="i47-sport">fiche sport et tachycardies (chapitre I47)</button>.</p>
<div class="lab">Principe</div><p>Décision partagée et documentée ; réévaluation périodique chez l’athlète de compétition.</p></template>

<template data-pop="i49-grossesse" data-title="Grossesse : extrasystoles, POTS et réanimation">
<div class="lab">Extrasystoles</div><p>Fréquentes et en général bénignes. Échocardiographie si elles sont nombreuses, symptomatiques ou accompagnées d’un signe d’alerte. Traitement seulement si la gêne est importante : bêtabloquant β1-sélectif (métoprolol, bisoprolol), à la dose la plus faible ; éviter l’aténolol (retard de croissance) (ESC 2025, maladies cardiovasculaires et grossesse). Surveillance de la croissance fœtale sous bêtabloquant et du nouveau-né (bradycardie, hypoglycémie).</p>
<div class="lab">Ablation</div><p>Reportée après l’accouchement, sauf arythmie réfractaire et mal tolérée ; elle se fait alors sans rayons X, par cartographie électroanatomique, dans un centre expérimenté.</p>
<div class="lab">POTS</div><p>Évolution variable : amélioration fréquente au cours de la grossesse avec l’expansion volémique, aggravation chez d’autres, surtout au premier trimestre (nausées, vomissements). Les mesures non médicamenteuses restent la base ; les données sur la midodrine et la fludrocortisone sont limitées.</p>
<div class="lab">Arrêt cardiaque (ERC 2025)</div><p>Mêmes énergies de défibrillation et mêmes médicaments ; déplacement manuel de l’utérus vers la gauche à partir d’environ 20 semaines ; si la circulation ne revient pas dans les 4 minutes, césarienne de réanimation pour une naissance dans les 5 minutes, qui améliore aussi la réanimation maternelle.</p></template>
