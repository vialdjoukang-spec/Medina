
<!-- ===== FENÊTRES I49 : définitions, épidémiologie, physiopathologie, anamnèse, examen ===== -->
<template data-pop="i49-termino" data-title="Vocabulaire des extrasystoles">
<div class="lab">Répétition</div><p><b>Isolée</b> : une extrasystole entourée de battements sinusaux. <b>Bigéminisme</b> : une extrasystole après chaque battement sinusal. <b>Trigéminisme</b> : une extrasystole tous les trois battements (deux sinusaux, une extrasystole). <b>Doublet</b> (couplet) : deux extrasystoles consécutives. <b>Salve</b> : trois ou plus ; pour les ESV, c’est déjà une tachycardie ventriculaire non soutenue.</p>
<div class="lab">Forme</div><p><b>Monomorphes</b> : une seule morphologie, donc un seul foyer. <b>Polymorphes</b> (ou multiformes) : plusieurs morphologies, donc plusieurs foyers ou plusieurs sorties d’un circuit ; plus souvent associées à une cardiopathie.</p>
<div class="lab">Moment</div><p><b>Interpolée</b> : ESV glissée entre deux battements sinusaux sans pause, possible quand la fréquence sinusale est lente. <b>R sur T</b> : ESV dont le QRS tombe sur l’onde T précédente, pendant la période vulnérable.</p>
<div class="lab">Charge</div><p>Nombre d’extrasystoles divisé par le nombre total de battements sur la durée d’enregistrement, en pour cent. Exemple : 25 000 ESV sur 100 000 battements = 25 %.</p>
<div class="lab">Classification de Lown</div><p>Classement historique (1971) des ESV après infarctus selon leur nombre et leur complexité. Il n’a plus de valeur décisionnelle : c’est le substrat, et non le grade, qui fait le pronostic.</p></template>

<template data-pop="i49-parasyst" data-title="Parasystolie">
<div class="lab">Mécanisme</div><p>Un foyer ectopique automatique est entouré d’une zone de <b>bloc d’entrée</b> : les dépolarisations sinusales ne l’atteignent pas et ne le remettent pas à zéro. Il décharge à son propre rythme, et ses influx sortent chaque fois que le myocarde environnant est excitable.</p>
<div class="lab">Critères ECG</div><p>1. Intervalles de couplage variables (plus de 80 ms de variation environ). 2. Intervalles entre ectopiques qui sont des multiples d’un même cycle de base. 3. Complexes de fusion, quand le foyer et le sinus activent le ventricule en même temps.</p>
<div class="lab">Portée clinique</div><p>Le plus souvent bénigne ; parfois observée sur cardiopathie ou avec la digoxine. Sa reconnaissance évite de prendre une variation du couplage pour un signe de gravité.</p></template>

<template data-pop="i49-epi" data-title="Épidémiologie des extrasystoles">
<div class="lab">ECG standard</div><p>Sur un ECG de 10 secondes, des ESV sont vues chez environ 1 % des adultes sans cardiopathie connue, davantage après 60 ans.</p>
<div class="lab">Holter</div><p>Sur 24 à 48 heures, des ESV sont trouvées chez une majorité d’adultes, le plus souvent en petit nombre. Des ESA sont présentes chez presque tous les sujets âgés.</p>
<div class="lab">Facteurs associés</div><p>Âge, sexe masculin, taille et masse corporelle, hypertension, cardiopathie ischémique, insuffisance cardiaque, hypokaliémie, sédentarité.</p>
<div class="lab">Palpitations</div><p>Motif fréquent de consultation en médecine de premier recours et deuxième motif d’avis cardiologique après la douleur thoracique. Dans les séries citées par l’EHRA (2011), environ 40 % des palpitations ont une cause rythmique et environ 30 % une cause psychique, le reste se partageant entre causes systémiques, médicamenteuses et structurelles, avec environ 16 % sans cause trouvée.</p></template>

<template data-pop="i49-prono" data-title="Données pronostiques des cohortes">
<div class="lab">Cohortes de population</div><p>Dans l’étude ARIC, la présence d’ESV sur un ECG de 2 minutes s’associait à un risque accru de mort subite et de décès cardiovasculaire. Dans la Cardiovascular Health Study, une fréquence plus élevée d’ESV au Holter s’associait à une baisse de la FEVG sur cinq ans, à l’insuffisance cardiaque et à la mortalité.</p>
<div class="lab">Interprétation</div><p>Ces associations ne prouvent pas que les ESV tuent. Elles traduisent souvent une cardiopathie infraclinique (ischémie, hypertrophie, fibrose). Une partie du risque peut cependant être causale, par le mécanisme de la cardiomyopathie induite.</p>
<div class="lab">Conséquence pratique</div><p>Des ESV fréquentes justifient de chercher une cardiopathie et de surveiller la FEVG, même chez un patient asymptomatique ; elles ne justifient pas, en soi, un antiarythmique.</p></template>

<template data-pop="i49-essa" data-title="Activité ectopique supraventriculaire excessive">
<div class="lab">Définition</div><p>Au moins 30 ESA par heure en moyenne, ou salve d’au moins 20 battements supraventriculaires, sur un Holter (Copenhagen Holter Study, Binici et coll., 2010).</p>
<div class="lab">Signification</div><p>Marqueur d’une cardiomyopathie auriculaire : risque accru de fibrillation auriculaire, d’accident vasculaire cérébral et de décès.</p>
<div class="lab">Conduite</div><p>Rechercher une fibrillation auriculaire par un monitorage plus long, contrôler la pression artérielle, le poids, les apnées du sommeil et l’alcool. Une anticoagulation n’est pas indiquée sur la seule activité ectopique ; elle se décide si une fibrillation auriculaire est documentée (chapitre I48).</p></template>

<template data-pop="i49-pause" data-title="Pause compensatrice">
<div class="lab">Définition</div><p>Intervalle entre le battement sinusal qui précède l’extrasystole et celui qui la suit, égal à deux cycles sinusaux (2 × RR).</p>
<div class="lab">Mesure</div><p>Mesurer un RR sinusal de base, puis l’intervalle qui encadre l’extrasystole ; comparer. Utiliser un compas ou un papier, sur plusieurs cycles, car l’arythmie sinusale respiratoire fausse la mesure.</p>
<div class="lab">Règle</div><p>ESV : pause compensatrice, car le nœud sinusal n’est pas remis à zéro. ESA : pause non compensatrice (moins de 2 × RR), car l’ESA pénètre et réinitialise le nœud sinusal.</p>
<div class="lab">Exceptions</div><p>ESV interpolée : aucune pause. ESV à conduction rétrograde jusqu’aux oreillettes : pause non compensatrice. ESA très précoce qui ne pénètre pas le nœud sinusal : pause parfois compensatrice. La pause oriente ; la morphologie et l’onde P tranchent.</p></template>

<template data-pop="i49-potent" data-title="Potentialisation post-extrasystolique">
<div class="lab">Observation</div><p>Le battement qui suit une extrasystole est plus puissant que les battements sinusaux habituels.</p>
<div class="lab">Mécanismes</div><p>1. Remplissage prolongé pendant la pause : volume télédiastolique accru (loi de Frank-Starling). 2. Surcharge calcique du réticulum sarcoplasmique pendant l’intervalle long : plus de calcium libéré au battement suivant. 3. Postcharge plus basse, car la pression aortique a baissé pendant la pause.</p>
<div class="lab">Corrélations cliniques</div><p>Sensation de « coup » dans la poitrine ou la gorge ; onde de pouls plus ample après le « trou » ; au cathétérisme, augmentation du gradient dans la cardiomyopathie hypertrophique obstructive (signe de Brockenbrough-Braunwald-Morrow) ; en échocardiographie de stress, la contractilité post-extrasystolique révèle un myocarde viable.</p></template>

<template data-pop="i49-cmie-meca" data-title="Mécanismes de la cardiomyopathie induite par les extrasystoles">
<div class="lab">Asynchronisme</div><p>Chaque ESV active le ventricule comme un bloc de branche : contraction segmentaire décalée, travail inefficace, insuffisance mitrale fonctionnelle.</p>
<div class="lab">Calcium et énergie</div><p>Anomalies du cycle du calcium intracellulaire, consommation d’oxygène accrue pour un travail utile réduit.</p>
<div class="lab">Hémodynamique</div><p>Battements extrasystoliques peu éjectants, variabilité du remplissage, activation neurohormonale.</p>
<div class="lab">Absence de fibrose initiale</div><p>Les modèles animaux d’ESV fréquentes provoquent une dysfonction réversible en quelques semaines, sans fibrose de remplacement notable. C’est la base de la réversibilité clinique.</p>
<div class="lab">Limite</div><p>Le poids relatif de ces mécanismes chez l’homme reste discuté ; l’association « charge élevée, dysfonction, récupération après suppression » reste l’argument principal.</p></template>

<template data-pop="i49-vulnerable" data-title="Période vulnérable et phénomène R sur T">
<div class="lab">Définition</div><p>Fenêtre de quelques dizaines de millisecondes proche du sommet de l’onde T, pendant laquelle les ventricules sont en partie repolarisés et en partie encore réfractaires.</p>
<div class="lab">Mécanisme</div><p>Un stimulus qui tombe dans cette fenêtre se propage seulement dans les zones excitables, se bloque devant les zones réfractaires et peut former des circuits de réentrée fonctionnels, donc une FV.</p>
<div class="lab">Facteurs qui l’élargissent</div><p>Ischémie aiguë, QT long, hypokaliémie, hypomagnésémie, catécholamines, cicatrice.</p>
<div class="lab">Applications</div><p>Synchronisation des chocs de cardioversion sur l’onde R ; mécanisme de la commotio cordis ; risque des ESV très précoces dans l’infarctus aigu.</p></template>

<template data-pop="i49-pvm" data-title="Prolapsus valvulaire mitral arythmogène">
<div class="lab">Profil</div><p>Femme jeune ou d’âge moyen, prolapsus des deux feuillets (valve de Barlow), disjonction de l’anneau mitral (l’insertion du feuillet postérieur est décalée vers l’oreillette), ESV fréquentes et complexes.</p>
<div class="lab">Signes d’alerte</div><p>Ondes T négatives dans les dérivations inférieures ; ESV à retard droit ou polymorphes (origine des piliers ou de l’anneau) ; TVNS ; syncope ; rehaussement tardif des muscles papillaires ou de la paroi inféro-latérale basale à l’IRM ; signe de « Pickelhaube » au Doppler tissulaire de l’anneau latéral.</p>
<div class="lab">Conduite</div><p>IRM cardiaque et Holter ; avis rythmologique. Défibrillateur en cas de FV ou de TV soutenue ; les indications en prévention primaire relèvent d’un consensus d’experts (EHRA 2022) et d’une décision individuelle. La réparation valvulaire ne supprime pas toujours le risque rythmique.</p></template>

<template data-pop="i49-declench" data-title="Facteurs favorisants des extrasystoles">
<div class="lab">Café</div><p>Pas d’association dans les cohortes pour la consommation habituelle. Essai CRAVE (2023) : un peu plus d’ESV les jours avec café, aucun effet sur les ESA. Réduire si le patient observe un lien.</p>
<div class="lab">Alcool</div><p>Favorise ESA, ESV et fibrillation auriculaire, surtout après une consommation aiguë importante (syndrome décrit en anglais sous le nom de <i>holiday heart syndrome</i>).</p>
<div class="lab">Sommeil et stress</div><p>Manque de sommeil, stress, déshydratation : augmentation du tonus adrénergique.</p>
<div class="lab">Substances et médicaments</div><p>Cocaïne, amphétamines, méthylphénidate ; décongestionnants (pseudoéphédrine) ; bêta-2 agonistes à forte dose ; hormones thyroïdiennes en excès ; théophylline ; certains antidépresseurs et antipsychotiques (tachycardie, QT) ; boissons énergisantes.</p>
<div class="lab">Situations</div><p>Hypokaliémie, hypomagnésémie, fièvre, anémie, hypoxémie, apnées du sommeil, digestion (réflexe vagal favorisant certaines ESA).</p></template>

<template data-pop="i49-palp-types" data-title="Types de palpitations selon l’EHRA (2011)">
<table class="t"><tr><th>Type</th><th>Description du patient</th><th>Début et rythme</th><th>Cause habituelle</th></tr>
<tr><td>Extrasystolique</td><td>« Le cœur saute un battement », « il s’arrête puis repart avec un coup »</td><td>Brutal, au repos ; rythme irrégulier entrecoupé de battements normaux</td><td>ESA, ESV</td></tr>
<tr><td>Tachycardique</td><td>« Le cœur bat très vite », « ailes qui battent » dans la poitrine</td><td>Brutal ; rapide, régulier ou irrégulier ; parfois à l’effort</td><td>Tachycardies supraventriculaires ou ventriculaires, fibrillation auriculaire</td></tr>
<tr><td>Anxieuse</td><td>Battements perçus au cours d’une angoisse, avec fourmillements, gorge serrée</td><td>Progressif ; régulier, peu rapide</td><td>Tachycardie sinusale d’anxiété</td></tr>
<tr><td>Pulsatile</td><td>Battements forts, réguliers, à fréquence normale</td><td>Progressif, persistant</td><td>Débit élevé (anémie, fièvre, hyperthyroïdie), insuffisance aortique, bradycardie</td></tr></table>
<div class="lab">Limite</div><p>Classification descriptive : une arythmie peut provoquer de l’anxiété, et l’anxiété peut accompagner une arythmie. Le type oriente les examens ; il ne remplace pas l’ECG pendant le symptôme.</p></template>

<template data-pop="i49-atcd-subst" data-title="Médicaments et substances à rechercher">
<div class="lab">Qui accélèrent ou déclenchent</div><p>Sympathomimétiques (décongestionnants, bêta-2 agonistes), hormones thyroïdiennes, stimulants (méthylphénidate, amphétamines, cocaïne, modafinil), théophylline, boissons énergisantes, compléments « minceur ».</p>
<div class="lab">Qui allongent le QT</div><p>Antiarythmiques (sotalol, amiodarone), macrolides, fluoroquinolones, antipsychotiques, citalopram et escitalopram, méthadone, ondansétron, dompéridone.</p>
<div class="lab">Qui abaissent le potassium ou le magnésium</div><p>Diurétiques de l’anse et thiazidiques, laxatifs, inhibiteurs de la pompe à protons au long cours (magnésium).</p>
<div class="lab">Qui aggravent l’intolérance orthostatique</div><p>Vasodilatateurs, diurétiques, alpha-bloquants, inhibiteurs de la recapture de la noradrénaline, tricycliques, opioïdes.</p>
<div class="lab">Question pratique</div><p>Demander aussi l’automédication et les produits achetés en ligne ; les patients les citent rarement spontanément.</p></template>

<template data-pop="i49-atcd-psy" data-title="Anxiété, panique et arythmies">
<div class="lab">Chevauchement</div><p>Les palpitations sont un critère du trouble panique, et une tachycardie paroxystique provoque souvent de l’angoisse. Dans des séries de patients porteurs d’une tachycardie supraventriculaire, une majorité remplissait les critères du trouble panique avant le diagnostic rythmologique, qui avait été retardé de plusieurs années.</p>
<div class="lab">Indices d’une arythmie</div><p>Début et fin brutaux, fréquence très élevée (au-delà de 150/min), arrêt par une manœuvre vagale, polyurie après la crise, syncope, palpitations à l’effort.</p>
<div class="lab">Démarche</div><p>ECG pendant le symptôme avant d’attribuer les palpitations à l’anxiété. Un trouble anxieux ne protège pas d’une arythmie et peut coexister avec elle.</p>
<div class="lab">Psychotropes</div><p>Clozapine (tachycardie, myocardite), tricycliques et inhibiteurs de la recapture de la sérotonine et de la noradrénaline (tachycardie), stimulants ; antipsychotiques et citalopram (QT). ECG avant et après l’introduction si facteurs de risque.</p></template>

<template data-pop="i49-s-rate" data-title="Sensation de « raté » suivi d’un coup">
<div class="lab">Description</div><p>« Le cœur s’arrête un instant puis repart avec un grand coup », « un coup dans la gorge », « le cœur se retourne ».</p>
<div class="lab">Mécanisme</div><p>L’extrasystole, trop précoce, n’est pas perçue ; la pause l’est (« arrêt ») ; le battement potentialisé qui suit l’est aussi (« coup »).</p>
<div class="lab">Circonstances typiques</div><p>Au repos, le soir au coucher, en décubitus latéral gauche (le cœur est plus proche de la paroi), après un repas ; diminution fréquente à l’effort.</p>
<div class="lab">Valeur</div><p>Très évocateur d’extrasystoles, sans indiquer leur siège. La gêne n’est pas proportionnelle au nombre : certains patients sentent chaque extrasystole, d’autres aucune malgré une charge de 30 %.</p></template>

<template data-pop="i49-s-effort" data-title="Palpitations à l’effort ou à la récupération">
<div class="lab">Signification</div><p>Les palpitations d’effort sont un signe d’alerte. Elles évoquent une ischémie, une cardiomyopathie (arythmogène, hypertrophique), une TVPC, une myocardite, une fibrillation auriculaire adrénergique ou une tachycardie de la chambre de chasse.</p>
<div class="lab">Questions</div><p>À quel niveau d’effort ? Avec douleur, dyspnée ou malaise ? Arrêt de l’effort nécessaire ? Durée après l’arrêt ? Même sensation lors d’une émotion forte ?</p>
<div class="lab">Conduite</div><p>ECG, échocardiographie et épreuve d’effort ; suspension du sport intense jusqu’au bilan si syncope, douleur ou salves.</p></template>

<template data-pop="i49-s-syncope" data-title="Palpitations suivies d’une syncope">
<div class="lab">Deux mécanismes opposés</div><p>1. Tachycardie rapide mal tolérée (TV, fibrillation auriculaire pré-excitée, tachycardie supraventriculaire très rapide au début de l’accès). 2. Pause à l’arrêt d’un accès de fibrillation auriculaire chez un patient atteint de maladie du sinus.</p>
<div class="lab">Syncope sans palpitation</div><p>N’exclut pas une arythmie : le patient peut perdre connaissance avant de percevoir quoi que ce soit.</p>
<div class="lab">Conduite</div><p>Hospitalisation ou bilan rapide si cardiopathie, ECG anormal, syncope d’effort ou en décubitus, mort subite familiale (critères de haut risque de l’ESC 2018) ; monitorage ; échocardiographie ; moniteur implantable si les épisodes sont rares.</p></template>

<template data-pop="i49-s-ortho" data-title="Palpitations en station debout">
<div class="lab">Description</div><p>Accélération progressive quelques secondes à minutes après le lever, avec vertiges, vision trouble, faiblesse, fatigue, difficultés de concentration (« brouillard mental »), tremblement ; soulagement en s’asseyant ou en se couchant.</p>
<div class="lab">Aggravation</div><p>Chaleur (douche chaude), repas copieux, station debout immobile (file d’attente), matin, menstruations, déshydratation, après une maladie ou un alitement.</p>
<div class="lab">Orientation</div><p>POTS si la fréquence augmente d’au moins 30/min sans hypotension ; hypotension orthostatique si la pression chute ; syncope réflexe si les symptômes aboutissent à une perte de connaissance avec prodromes.</p></template>

<template data-pop="i49-standing" data-title="Test d’orthostatisme actif de 10 minutes">
<div class="lab">Préparation</div><p>Au calme, de préférence le matin, loin d’un repas ; suspendre si possible les médicaments qui modifient la fréquence ; pas d’excès de boisson juste avant.</p>
<div class="lab">Déroulement</div><p>Décubitus 5 minutes : fréquence et pression de référence. Lever sans aide, station debout immobile, dos au mur, sans croiser les jambes ni contracter les mollets. Mesures à 1, 3, 5 et 10 minutes ; noter les symptômes et la couleur des jambes.</p>
<div class="lab">Lecture</div><p>Gain de fréquence soutenu ≥ 30/min (≥ 40/min de 12 à 19 ans) sans baisse de la pression systolique ≥ 20 mmHg : réponse compatible avec un POTS. Baisse ≥ 20/10 mmHg dans les 3 minutes : hypotension orthostatique.</p>
<div class="lab">Pièges</div><p>Un seul test peut être faussement négatif (bonne hydratation, moment de la journée) : le répéter si la clinique est forte. Une fréquence de repos déjà &gt; 100/min oriente vers une tachycardie sinusale inappropriée ou une cause secondaire.</p></template>

<template data-pop="i49-e-pouls" data-title="Pouls irrégulier et déficit de pouls">
<div class="lab">Technique</div><p>Palper le pouls radial en auscultant simultanément le cœur pendant une minute ; ou compter le pouls pendant qu’un collègue compte à l’auscultation.</p>
<div class="lab">Déficit de pouls</div><p>Différence entre la fréquence cardiaque auscultée et la fréquence du pouls : les battements précoces remplissent peu le ventricule et ne génèrent pas d’onde perceptible.</p>
<div class="lab">Lecture</div><p>Irrégularités isolées sur un rythme régulier : extrasystoles. Irrégularité complète : fibrillation auriculaire. Pouls lent régulier avec un bigéminisme à l’ECG : déficit de pouls.</p>
<div class="lab">Piège</div><p>Saturomètres et tensiomètres automatiques comptent le pouls, non l’activité électrique : ils affichent une fausse bradycardie en bigéminisme ou une fausse fibrillation en présence d’extrasystoles. Toute anomalie impose un ECG.</p></template>

<template data-pop="i49-e-auscult" data-title="Auscultation d’un patient qui a des extrasystoles">
<div class="lab">Clic méso-systolique</div><p>Bruit sec en milieu de systole, suivi ou non d’un souffle télésystolique : prolapsus mitral. Il se rapproche du premier bruit en position debout (le ventricule se vide, le prolapsus survient plus tôt).</p>
<div class="lab">Souffle éjectionnel qui augmente debout ou au Valsalva</div><p>Cardiomyopathie hypertrophique obstructive.</p>
<div class="lab">Galop</div><p>Troisième bruit : dysfonction ventriculaire, à rechercher en cas de charge élevée.</p>
<div class="lab">Irrégularités</div><p>Un battement prématuré suivi d’une pause, avec un premier bruit d’intensité variable. Le premier bruit du battement extrasystolique est souvent plus faible (remplissage court), celui du battement suivant plus fort.</p></template>

<template data-pop="i49-e-hypermob" data-title="Hypermobilité articulaire (score de Beighton)">
<div class="lab">Score sur 9 points</div><p>Dorsiflexion passive du cinquième doigt au-delà de 90° (1 point par côté) ; pouce ramené passivement contre l’avant-bras (1 par côté) ; hyperextension du coude au-delà de 10° (1 par côté) ; hyperextension du genou au-delà de 10° (1 par côté) ; paumes à plat sur le sol, genoux tendus (1).</p>
<div class="lab">Seuils</div><p>Un score ≥ 5 chez l’adulte (≥ 6 avant la puberté, ≥ 4 après 50 ans) définit une hypermobilité généralisée, l’un des critères du syndrome d’Ehlers-Danlos hypermobile (critères internationaux de 2017).</p>
<div class="lab">Lien avec le POTS</div><p>Association fréquente : la laxité du tissu conjonctif des parois veineuses favoriserait l’accumulation de sang dans les membres inférieurs debout. Ce lien reste une hypothèse.</p></template>
