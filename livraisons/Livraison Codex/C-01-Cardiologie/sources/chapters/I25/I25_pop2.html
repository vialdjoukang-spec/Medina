
<!-- ===== FENÊTRES : anamnèse et examen clinique ===== -->
<template data-pop="i25-atcd-frcv" data-title="Facteurs de risque comptés par le modèle ESC 2024">
<div class="lab">Les cinq facteurs</div><p>1. Antécédent familial de maladie coronaire précoce (parent du premier degré : homme avant 55 ans, femme avant 65 ans). 2. Tabagisme actuel ou ancien. 3. Dyslipidémie. 4. Hypertension artérielle. 5. Diabète.</p>
<div class="lab">Comment les compter</div><p>Le modèle retient trois groupes : 0–1, 2–3 et 4–5 facteurs. Un facteur traité compte comme présent.</p>
<div class="lab">Questions utiles</div><p>« Un parent, un frère ou une sœur a-t-il eu un infarctus, un stent ou un pontage ? À quel âge ? Avez-vous fumé, combien et jusqu’à quand ? Prenez-vous un traitement pour la tension, le cholestérol ou le sucre ? »</p>
<div class="lab">Piège</div><p>Un tabagisme arrêté compte : le modèle retient « actuel ou ancien ».</p></template>

<template data-pop="i25-atcd-radio" data-title="Coronaropathie après traitement anticancéreux">
<div class="lab">Radiothérapie thoracique</div><p>Lymphome de Hodgkin, cancer du sein gauche, cancer de l’œsophage ou du poumon. Les lésions touchent surtout les ostia du tronc commun et de la coronaire droite et l’interventriculaire antérieure proximale ; elles apparaissent souvent 10 à 20 ans après l’irradiation, parfois chez un sujet jeune. Valvulopathie et péricardite constrictive peuvent s’y associer.</p>
<div class="lab">Chimiothérapies</div><p>Fluoropyrimidines (5-fluorouracile, capécitabine) : vasospasme. Inhibiteurs du VEGF et de certaines tyrosine kinases : ischémie, thrombose artérielle. Cisplatine : thrombose artérielle.</p>
<div class="lab">Conduite</div><p>Chercher activement la maladie coronaire chez un survivant de cancer irradié qui décrit une dyspnée ou un angor, même jeune.</p></template>

<template data-pop="i25-atcd-subst" data-title="Substances et médicaments vasoconstricteurs">
<div class="lab">Cocaïne</div><p>Vasospasme, agrégation plaquettaire, athérosclérose accélérée, dissection. Un bêtabloquant n’est pas donné à la phase aiguë d’une douleur thoracique sous cocaïne.</p>
<div class="lab">Amphétamines et dérivés</div><p>Vasospasme, cardiomyopathie.</p>
<div class="lab">Triptans et dérivés de l’ergot de seigle</div><p>Vasoconstriction coronaire ; contre-indiqués en cas de maladie coronaire ou d’angor vasospastique.</p>
<div class="lab">Question</div><p>Demander explicitement, sans jugement, la consommation de substances, car le patient la mentionne rarement spontanément.</p></template>

<template data-pop="i25-s-angor" data-title="Caractériser une douleur thoracique d’effort">
<div class="lab">Sept questions</div><p>1. Où ? Rétrosternale, large, montrée avec la main à plat. 2. Comment ? Oppression, serrement, poids, brûlure. 3. Irradiation ? Cou, mâchoire, épaule, bras gauche ou les deux bras, dos, épigastre. 4. Déclenchement ? Effort, émotion, froid, repas copieux. 5. Durée ? 2 à 10 minutes. 6. Soulagement ? Arrêt de l’effort, trinitrine en moins de 5 minutes. 7. Évolution ? Stable depuis des semaines, ou aggravation récente.</p>
<div class="lab">Physiopathologie</div><p>Les afférences sympathiques cardiaques entrent dans la moelle entre le septième segment cervical et le quatrième segment thoracique, où convergent des afférences cutanées du thorax et du bras : la douleur est projetée dans ces territoires.</p>
<div class="lab">Signes qui orientent ailleurs</div><p>Douleur de quelques secondes ou de plusieurs heures, en coup d’aiguille, localisée à un point, reproduite par la palpation, la respiration ou les mouvements du tronc.</p>
<div class="lab">Piège</div><p>Le soulagement par la trinitrine n’est pas spécifique : elle soulage aussi le spasme œsophagien.</p></template>

<template data-pop="i25-s-repos" data-title="Angor de repos, nocturne ou matinal">
<div class="lab">Évoque</div><p>Un vasospasme épicardique, lorsque la douleur est récurrente, survient souvent aux mêmes heures (entre minuit et le petit matin), dure 5 à 15 minutes et répond à la trinitrine, avec un effort bien toléré dans la journée.</p>
<div class="lab">Mais d’abord</div><p>Un angor de repos d’apparition récente ou prolongé est un syndrome coronarien aigu jusqu’à preuve du contraire (chapitre I21).</p>
<div class="lab">Documenter</div><p>ECG pendant la crise ; Holter ECG ou enregistreur d’événements à la recherche d’un sus-décalage transitoire du ST ; test à l’acétylcholine.</p></template>

<template data-pop="i25-s-prolong" data-title="Angor prolongé après l’effort">
<div class="lab">Description</div><p>Angor d’effort qui persiste plusieurs minutes après l’arrêt, répond mal ou lentement à la trinitrine, s’accompagne souvent de dyspnée et de fatigue.</p>
<div class="lab">Évoque</div><p>Une dysfonction microvasculaire, surtout chez une femme hypertendue ou diabétique dont le coroscanner ou la coronarographie ne montre pas de sténose.</p>
<div class="lab">Physiopathologie</div><p>Les artérioles ne se dilatent pas assez à l’effort et récupèrent lentement leur tonus ; la trinitrine agit surtout sur les grosses artères.</p></template>

<template data-pop="i25-v-ta" data-title="Pression artérielle chez le coronarien">
<div class="lab">Technique</div><p>Mesure aux deux bras lors de la première consultation, puis au bras où la valeur est la plus élevée.</p>
<div class="lab">Asymétrie</div><p>Une différence de plus de 15 mmHg entre les bras évoque une sténose de l’artère sous-clavière. Chez un patient ponté avec l’artère mammaire interne gauche, une sténose sous-clavière gauche en amont du greffon peut provoquer un angor par détournement du flux coronaire vers le bras.</p>
<div class="lab">Cible</div><p>Pression systolique de 120 à 129 mmHg si elle est tolérée (ESC 2024 sur l’hypertension) ; plus prudente chez le sujet âgé et fragile.</p>
<div class="lab">Piège</div><p>Une pression diastolique très basse, surtout sous traitement chez le sujet âgé, réduit la pression de perfusion coronaire.</p></template>

<template data-pop="i25-e-ra" data-title="Rétrécissement aortique et angor">
<div class="lab">Signe</div><p>Souffle éjectionnel mésosystolique au foyer aortique, irradiant vers les carotides ; abolition du deuxième bruit et pouls carotidien lent et retardé dans les formes serrées.</p>
<div class="lab">Mécanisme de l’angor</div><p>Hypertrophie (besoins accrus), pression télédiastolique élevée et temps diastolique réduit (apports diminués), compression des petits vaisseaux ; la coronaropathie est associée chez environ la moitié des patients âgés.</p>
<div class="lab">Conséquence</div><p>Angor + rétrécissement aortique serré = indication d’intervention valvulaire. L’épreuve d’effort est contre-indiquée chez le patient symptomatique. La coronarographie ou le coroscanner font partie du bilan préopératoire.</p></template>

<template data-pop="i25-e-pouls" data-title="Pouls périphériques et index de pression systolique">
<div class="lab">Examen</div><p>Palpation des pouls fémoraux, poplités, tibiaux postérieurs et pédieux ; auscultation des carotides, de l’abdomen et des fémorales.</p>
<div class="lab">Index de pression systolique</div><p>Rapport entre la pression systolique à la cheville et la pression brachiale. ≤ 0,90 : artériopathie des membres inférieurs. &gt; 1,40 : artères incompressibles (diabète, insuffisance rénale), mesure non interprétable.</p>
<div class="lab">Pourquoi</div><p>L’athérosclérose est une maladie diffuse : une artériopathie périphérique augmente la probabilité de maladie coronaire et le risque ischémique, ce qui peut justifier une intensification antithrombotique.</p></template>

<template data-pop="i25-e-xantho" data-title="Signes cutanés et oculaires de dyslipidémie">
<div class="lab">Xanthomes tendineux</div><p>Épaississements nodulaires des tendons d’Achille et des extenseurs des doigts ; très évocateurs d’hypercholestérolémie familiale.</p>
<div class="lab">Arc cornéen</div><p>Anneau blanc-gris en périphérie de la cornée ; significatif avant 45 ans.</p>
<div class="lab">Xanthélasma</div><p>Plaques jaunes des paupières ; peu spécifiques, près de la moitié des patients ont un bilan lipidique normal.</p>
<div class="lab">Conséquence</div><p>Évoquer une hypercholestérolémie familiale, doser le LDL-cholestérol et proposer un dépistage familial.</p></template>

<template data-pop="i25-atcd-vasc" data-title="Athérosclérose polyvasculaire">
<div class="lab">Question</div><p>« Avez-vous des douleurs dans les mollets à la marche qui cèdent à l’arrêt ? Avez-vous eu un AVC, un accident ischémique transitoire, une opération des carotides ou des artères des jambes ? »</p>
<div class="lab">Pourquoi</div><p>L’athérosclérose touche rarement un seul territoire. Une artériopathie des membres inférieurs ou une maladie cérébrovasculaire augmente la probabilité de maladie coronaire (ajustement de la probabilité ESC 2024) et le risque ischémique, ce qui peut justifier un second antithrombotique (COMPASS).</p>
<div class="lab">Piège</div><p>Un patient limité par la claudication ne fait pas assez d’effort pour déclencher un angor : l’absence d’angor ne rassure pas. Préférer une imagerie de stress pharmacologique.</p></template>

<template data-pop="i25-atcd-irc" data-title="Insuffisance rénale et maladies inflammatoires chroniques">
<div class="lab">Insuffisance rénale chronique</div><p>Risque coronaire très élevé, athérosclérose calcifiée, symptômes souvent atypiques. L’ESC/ERA 2026 demande un DFG et un rapport albumine/créatinine urinaire chez tout patient cardiovasculaire (classe I).</p>
<div class="lab">Maladies inflammatoires</div><p>Polyarthrite rhumatoïde, lupus, psoriasis, spondylarthrite, maladies inflammatoires de l’intestin, infection par le VIH : l’inflammation chronique accélère l’athérosclérose ; ce sont des modificateurs de risque (ESC/EAS 2025).</p>
<div class="lab">Piège</div><p>Les AINS et les corticoïdes pris pour ces maladies augmentent eux-mêmes le risque cardiovasculaire et hémorragique sous antithrombotiques.</p></template>

<template data-pop="i25-atcd-preg" data-title="Facteurs de risque propres à la femme">
<div class="lab">Question</div><p>« Avez-vous eu une prééclampsie, une hypertension ou un diabète pendant une grossesse, un accouchement prématuré ? À quel âge avez-vous été ménopausée ? »</p>
<div class="lab">Valeur</div><p>La prééclampsie environ double le risque ultérieur de maladie coronaire ; une ménopause avant 40 ans augmente aussi le risque. Ce sont des modificateurs de risque reconnus par l’ESC.</p>
<div class="lab">Piège</div><p>Ces antécédents ne figurent pas parmi les cinq facteurs du modèle RF-CL : il faut les intégrer dans le jugement clinique et la prévention.</p></template>

<template data-pop="i25-atcd-pde5" data-title="Inhibiteurs de la phosphodiestérase de type 5">
<div class="lab">Question</div><p>Demander explicitement : « Prenez-vous un médicament pour l’érection ou pour la prostate, même occasionnellement ? » Sildénafil, tadalafil (aussi prescrit dans l’hypertrophie bénigne de la prostate et l’hypertension pulmonaire), vardénafil.</p>
<div class="lab">Conséquence</div><p>Contre-indication absolue des dérivés nitrés et du nicorandil : 24 heures après le sildénafil ou le vardénafil, 48 heures après le tadalafil. Elle concerne aussi la trinitrine de préparation du coroscanner et la trinitrine d’urgence.</p>
<div class="lab">Piège</div><p>Le patient ne le mentionne pas spontanément ; le tadalafil quotidien à faible dose rend les nitrés contre-indiqués en permanence.</p></template>

<template data-pop="i25-e-cmho" data-title="Souffle de cardiomyopathie hypertrophique obstructive">
<div class="lab">Technique</div><p>Souffle mésosystolique au bord gauche du sternum et à la pointe ; l’ausculter au repos, puis pendant la manœuvre de Valsalva et au passage de l’accroupissement à la position debout.</p>
<div class="lab">Valeur</div><p>Le souffle augmente quand la précharge baisse (Valsalva, lever) et diminue à l’accroupissement ou au lever de jambes, à l’inverse du rétrécissement aortique. Il évoque une obstruction dynamique de la chambre de chasse, cause d’angor sur coronaires saines ; l’échocardiographie confirme.</p>
<div class="lab">Piège</div><p>Les dérivés nitrés et les dihydropyridines aggravent l’obstruction : chez ce patient, l’angor se traite par bêtabloquant ou vérapamil.</p></template>

<template data-pop="i25-e-im" data-title="Insuffisance mitrale ischémique">
<div class="lab">Technique</div><p>Souffle holosystolique à la pointe, irradiant vers l’aisselle ; décubitus latéral gauche, membrane du stéthoscope.</p>
<div class="lab">Mécanisme et valeur</div><p>Chronique : le remodelage du ventricule après infarctus (surtout inférieur ou postérieur) déplace le pilier et tire sur les cordages ; c’est une insuffisance mitrale secondaire, de mauvais pronostic. Transitoire : l’ischémie du pilier pendant une crise fait apparaître un souffle qui disparaît ensuite.</p>
<div class="lab">Piège</div><p>L’intensité du souffle ne reflète pas la sévérité ; une insuffisance mitrale secondaire sévère peut être peu audible. L’échocardiographie la quantifie ; elle entre dans la décision de pontage et de réparation mitrale.</p></template>

<template data-pop="i25-e-b4" data-title="Quatrième bruit (B4)">
<div class="lab">Technique</div><p>Décubitus latéral gauche, cloche à la pointe ; bruit sourd, grave, juste avant B1.</p>
<div class="lab">Mémorisation</div><p>Aide pédagogique, non critère officiel : le rythme B4-B1-B2 s’entend comme les trois syllabes « Ten-nes-see », accent sur la dernière.</p>
<div class="lab">Mécanisme</div><p>Contraction auriculaire contre un ventricule rigide. L’ischémie altère d’abord la relaxation (cascade ischémique) : un B4 peut apparaître pendant la crise et disparaître ensuite.</p>
<div class="lab">Valeur</div><p>Fréquent aussi dans l’hypertrophie hypertensive et chez le sujet âgé ; absent en fibrillation auriculaire (pas de contraction auriculaire).</p>
<div class="lab">Piège</div><p>Un B4 permanent n’est pas spécifique de l’ischémie ; c’est son apparition pendant la douleur qui a de la valeur.</p></template>

<template data-pop="i25-e-choc" data-title="Choc de pointe dévié ou étalé">
<div class="lab">Technique</div><p>Palpation en décubitus dorsal puis latéral gauche ; normalement au cinquième espace intercostal sur la ligne médioclaviculaire, d’un diamètre inférieur à 2,5 cm, bref.</p>
<div class="lab">Valeur</div><p>Dévié en bas et en dehors : dilatation du ventricule gauche (cardiomyopathie ischémique). Étalé, soutenu, ou double impulsion paradoxale en systole : zone dyskinétique ou anévrisme antéro-apical.</p>
<div class="lab">Piège</div><p>Souvent impalpable chez l’obèse ou l’emphysémateux ; son absence n’exclut rien.</p></template>

<template data-pop="i25-e-frank" data-title="Signe de Frank (pli diagonal du lobe de l’oreille)">
<div class="lab">Technique</div><p>Pli oblique qui traverse le lobe de l’oreille, du tragus vers le bord postérieur, en général bilatéral.</p>
<div class="lab">Valeur</div><p>Associé statistiquement à la maladie coronaire dans des études observationnelles ; il ne modifie pas la probabilité de façon utile et ne fait partie d’aucun modèle recommandé.</p>
<div class="lab">Piège</div><p>Fréquent avec l’âge ; ne jamais s’en servir pour affirmer ni exclure une coronaropathie.</p></template>

<template data-pop="i25-s-fatigue" data-title="Fatigue et baisse de la tolérance à l’effort">
<div class="lab">Caractérisation</div><p>Depuis quand, pour quel effort (étages, distance), d’installation progressive ou récente, associée à une dyspnée ou à une gêne thoracique, reproductible au même niveau d’effort.</p>
<div class="lab">Valeur</div><p>Une fatigue d’effort nouvelle, reproductible et qui cède au repos peut être un équivalent angineux, surtout chez la femme, le diabétique et le sujet âgé. Une baisse récente de la tolérance à l’effort chez un coronarien connu signale une progression de la maladie ou une dysfonction ventriculaire.</p>
<div class="lab">Piège</div><p>La fatigue a de nombreuses autres causes : anémie, hypothyroïdie, dépression, bêtabloquant à dose excessive (incompétence chronotrope), déconditionnement. Les chercher avant de conclure à une ischémie.</p></template>

<template data-pop="i25-s-palp" data-title="Palpitations et lipothymie d’effort">
<div class="lab">Caractérisation</div><p>Début et fin brusques ou progressifs, régularité, fréquence estimée, circonstances (effort, repos), malaise ou perte de connaissance associés.</p>
<div class="lab">Valeur</div><p>Chez le coronarien, des palpitations d’effort évoquent une arythmie ventriculaire ischémique ou une fibrillation auriculaire. Une lipothymie ou une syncope à l’effort est un signe d’alarme : arythmie ventriculaire, ischémie étendue avec chute du débit, ou rétrécissement aortique serré.</p>
<div class="lab">Piège</div><p>Une syncope d’effort ne s’explore pas par une épreuve d’effort en ambulatoire avant d’avoir exclu un rétrécissement aortique (échocardiographie) et une arythmie grave : avis cardiologique rapide.</p></template>

<template data-pop="i25-e-thyro" data-title="Signes de thyrotoxicose">
<div class="lab">Technique</div><p>Fréquence au repos, rythme (fibrillation auriculaire), tremblement fin des extrémités bras tendus, peau chaude et moite, palpation du goitre en déglutition, signes oculaires.</p>
<div class="lab">Valeur</div><p>La thyrotoxicose augmente la fréquence, la contractilité et la consommation d’oxygène : elle provoque un angor sur coronaires saines ou démasque une maladie coronaire. Confirmation par la TSH et la T4 libre.</p>
<div class="lab">Piège</div><p>Chez le sujet âgé, la thyrotoxicose est souvent pauci-symptomatique (forme apathique) ; l’amiodarone peut la provoquer. Un bêtabloquant masque la tachycardie.</p></template>

<template data-pop="i25-e-anemie" data-title="Pâleur conjonctivale et anémie">
<div class="lab">Technique</div><p>Abaisser la paupière inférieure à la lumière du jour : comparer la couleur du bord antérieur de la conjonctive palpébrale (rouge vif) à celle de sa partie postérieure.</p>
<div class="lab">Valeur</div><p>Une pâleur marquée du bord antérieur est un signe plutôt spécifique d’anémie, peu sensible ; elle devient perceptible surtout lorsque l’hémoglobine est nettement abaissée (de l’ordre de 90 à 100 g/L ou moins). L’anémie réduit le contenu artériel en oxygène et abaisse le seuil ischémique ; elle augmente aussi le risque hémorragique sous antithrombotiques.</p>
<div class="lab">Piège</div><p>Une conjonctive normale n’exclut pas une anémie : l’hémogramme est systématique. Chez un coronarien sous antiplaquettaires, chercher une perte digestive.</p></template>

<template data-pop="i25-e-souffles" data-title="Souffles carotidiens et fémoraux">
<div class="lab">Technique</div><p>Membrane du stéthoscope sur le trajet carotidien, de l’angle de la mandibule à la base du cou, patient en apnée brève ; puis au pli inguinal sur l’artère fémorale.</p>
<div class="lab">Valeur</div><p>Un souffle signale un flux turbulent, le plus souvent sur une plaque athéroscléreuse : il témoigne d’une athérosclérose polyvasculaire et augmente la probabilité de maladie coronaire. Un souffle carotidien justifie un échodoppler.</p>
<div class="lab">Piège</div><p>L’intensité ne reflète pas le degré de sténose ; une sténose très serrée ou une occlusion peut être silencieuse. Un souffle cardiaque éjectionnel (rétrécissement aortique) peut irradier aux carotides.</p></template>
