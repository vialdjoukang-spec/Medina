<section class="ilot" id="i25-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 61 ans, hypertendue et ancienne fumeuse, décrit depuis deux mois une oppression rétrosternale qui survient lorsqu’elle monte la rue qui mène à son domicile. La gêne cède en trois minutes lorsqu’elle s’arrête. Elle n’a jamais eu de douleur au repos. La question qui structure ce chapitre est la suivante : <b>cette patiente a-t-elle une maladie coronaire, avec quelle probabilité, quel premier examen choisir, et quel traitement soulagera ses symptômes et réduira son risque d’infarctus et de décès ?</b></p>
<p>Cette question en contient deux, que le chapitre sépare constamment. La première concerne les <b>symptômes</b> : l’angor limite la vie quotidienne et se traite par des médicaments anti-angineux, parfois par une revascularisation. La seconde concerne le <b>pronostic</b> : la maladie athéroscléreuse expose à l’infarctus et au décès, et ce risque se réduit surtout par la prévention médicamenteuse (antithrombotiques, hypolipémiants) et l’hygiène de vie. Un même geste peut servir l’un sans servir l’autre : l’angioplastie d’une sténose stable soulage l’angor mais, chez la plupart des patients, ne réduit ni la mortalité ni l’infarctus.</p>
<p>À la fin de ce chapitre, le médecin assistant sait estimer la probabilité pré-test selon le modèle de l’ESC 2024 ; choisir entre coroscanner, imagerie de stress et coronarographie ; interpréter une FFR et une iFR ; construire un traitement anti-angineux par lignes ; prescrire la prévention antithrombotique, hypolipémiante et anti-inflammatoire ; poser les indications de revascularisation et discuter le choix entre angioplastie et pontage selon le score SYNTAX ; reconnaître une ANOCA ou une INOCA et connaître le test à l’acétylcholine ; prendre en charge la cardiomyopathie ischémique et l’anévrisme ventriculaire ; organiser le suivi et la réadaptation.</p>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="i21-mvo2">bilan en oxygène du myocarde (apports et besoins)</button>, la <button class="w" data-k="i25-cfr">réserve coronaire (capacité d’augmenter le débit)</button> et la <button class="w" data-k="i25-endoth">fonction endothéliale (monoxyde d’azote et vasomotricité)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales. Le syndrome coronarien aigu est traité dans le chapitre I21.</div>
</section>

<section class="ilot" id="i25-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<h3>1.1 Le syndrome coronarien chronique</h3>
<p>L’ESC a remplacé en 2019 le terme « maladie coronaire stable » par celui de <b>syndrome coronarien chronique (SCC)</b>. Le mot « stable » était trompeur : une maladie athéroscléreuse évolue en permanence, même lorsque les symptômes ne changent pas. L’ESC 2024 définit le SCC comme un ensemble de présentations cliniques dues à des anomalies <b>structurelles ou fonctionnelles</b> des artères coronaires épicardiques ou de la microcirculation. Ces anomalies créent un déséquilibre transitoire et réversible entre les besoins en oxygène du myocarde et l’apport sanguin, à l’effort, lors d’une émotion ou d’un stress, parfois spontanément.</p>
<p>La définition 2024 élargit donc le champ au-delà de la sténose épicardique. Un patient peut avoir un angor typique avec des coronaires angiographiquement normales : son ischémie provient alors de la <button class="w" data-k="i25-cmd">dysfonction microvasculaire coronaire (petits vaisseaux invisibles à l’angiographie)</button> ou d’un <button class="w" data-k="i25-vsa">vasospasme épicardique (angor vasospastique)</button>.</p>
<h3>1.2 Présentations cliniques regroupées sous le terme de SCC</h3>
<div class="two">
<div class="card"><h4>Suspicion de maladie coronaire</h4><p>Angor ou dyspnée d’effort stables, sans maladie coronaire connue. C’est la situation diagnostique principale de ce chapitre.</p></div>
<div class="card"><h4>Après un syndrome coronarien aigu ou une revascularisation</h4><p>Patient stabilisé après un infarctus, une angioplastie ou un pontage. La première année est une phase à risque plus élevé ; ensuite, le risque dépend des facteurs résiduels.</p></div>
<div class="card"><h4>Dysfonction ventriculaire gauche d’origine ischémique</h4><p>Insuffisance cardiaque ou FEVG réduite dont la cause est coronaire : cardiomyopathie ischémique (I25.5).</p></div>
<div class="card"><h4>Angor sans sténose obstructive</h4><p>Vasospasme ou dysfonction microvasculaire : ANOCA et INOCA (îlot 12).</p></div>
<div class="card"><h4>Maladie coronaire découverte chez un asymptomatique</h4><p>Calcifications au scanner thoracique, plaques au coroscanner de dépistage, ischémie silencieuse (I25.6).</p></div>
<div class="card"><h4>Anévrisme ventriculaire et séquelles d’infarctus</h4><p>Infarctus ancien (I25.2) et anévrisme du ventricule (I25.3), avec leurs complications propres.</p></div></div>
<p class="src">Présentations décrites par l’ESC 2019 et reprises dans l’esprit de l’ESC 2024, qui insiste sur le continuum entre les formes.</p>
<h3>1.3 L’angor : définition clinique</h3>
<p>L’<b>angor</b> (angine de poitrine) est le symptôme de l’ischémie myocardique. On le décrit selon trois caractéristiques : (1) une gêne constrictive rétrosternale ou dans le cou, la mâchoire, l’épaule ou le bras ; (2) déclenchée par l’effort physique ou l’émotion ; (3) soulagée en quelques minutes par le repos ou la trinitrine. L’angor est dit <b>typique</b> si les trois caractéristiques sont présentes, <b>atypique</b> si deux le sont, et la douleur est dite <b>non angineuse</b> si une seule ou aucune ne l’est. Cette classification est une donnée d’entrée du <button class="w" data-k="i25-rfcl">modèle de probabilité pondérée par les facteurs de risque (ESC 2024)</button>.</p>
<p>La gravité fonctionnelle se gradue selon la <button class="w" data-k="i25-ccs">classification canadienne de l’angor (classes I à IV)</button>. Elle est l’équivalent, pour l’angor, de la classification NYHA pour la dyspnée.</p>
<div class="trap"><span class="k">Piège</span>L’ESC 2024 rappelle que la dichotomie typique / atypique a une valeur prédictive limitée, en particulier chez la femme, le diabétique et le sujet âgé. Une dyspnée d’effort isolée peut être un <button class="w" data-k="i25-equiv">équivalent angineux (dyspnée, fatigue, gêne épigastrique)</button> : le modèle de l’ESC l’intègre comme une catégorie de symptôme à part entière.</div>

<h3>1.5 ANOCA et INOCA</h3>
<p>Deux termes récents désignent les patients qui ont des symptômes ou une ischémie sans sténose coronaire obstructive. L’<b>ANOCA</b> désigne l’angor sans sténose obstructive. L’<b>INOCA</b> désigne l’ischémie objectivée sans sténose obstructive. Le terme « sans sténose obstructive » signifie en pratique une sténose épicardique inférieure à 50 % ou une FFR supérieure à 0,80. Ces patients ne sont pas des « patients sans maladie » : ils ont une maladie coronaire fonctionnelle, dont il faut identifier l’<button class="w" data-k="i25-endotypes">endotype (mécanisme dominant de l’ischémie)</button>.</p>
</section>

<section class="ilot" id="i25-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>En Suisse, l’Office fédéral de la statistique a recensé en 2024 environ 72 000 décès, dont environ 20 000 dus aux maladies cardiovasculaires, soit 26 %. Les maladies cardiovasculaires restent la première cause de décès chez la femme (29 % des décès féminins), tandis que le cancer est la première cause chez l’homme. En Europe, la cardiopathie ischémique est la première cause de décès cardiovasculaire.</p>
<p>La prévalence de l’angor augmente avec l’âge. Elle est plus élevée chez l’homme jusqu’à la ménopause, puis l’écart se réduit. La mortalité coronaire ajustée sur l’âge a nettement diminué depuis les années 1980 en Europe occidentale, grâce à la prévention et au traitement de l’infarctus ; mais le nombre absolu de patients porteurs d’une maladie coronaire chronique augmente, car davantage de patients survivent à l’infarctus et la population vieillit.</p>
<p>La proportion de patients sans sténose obstructive est élevée. Dans les grandes séries de coronarographies réalisées pour angor, près de la moitié des patients, davantage chez la femme, n’ont pas de sténose obstructive. Beaucoup d’entre eux ont une ANOCA ou une INOCA. Leur pronostic n’est pas bénin : la dysfonction microvasculaire s’associe à un excès d’événements cardiovasculaires et à une qualité de vie altérée.</p>
<p>Le pronostic du SCC est globalement favorable, mais très hétérogène. Il dépend de quatre déterminants : la <b>fonction ventriculaire gauche</b> (le plus puissant), l’<b>étendue anatomique</b> de la maladie (tronc commun, atteinte tritronculaire, artère interventriculaire antérieure proximale), l’<b>étendue de l’ischémie</b> et le <b>contexte clinique</b> (âge, diabète, insuffisance rénale, artériopathie périphérique).</p>
<div class="trap"><span class="k">Lacune documentaire</span>La prévalence de l’angor et du SCC en Suisse n’est pas publiée de façon consolidée par l’Office fédéral de la statistique. La part des cardiopathies ischémiques parmi les décès cardiovasculaires suisses n’est pas publiée séparément dans le communiqué OFS 2024 ; les chiffres sont ceux de l’OFS 2024 et de l’ESC.</div>

<section class="ilot" id="i25-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie explique à la fois les symptômes, le choix des examens et le mode d’action de chaque traitement. Le raisonnement suit une chaîne : <b>équilibre apports-besoins → limitation des apports (sténose, microcirculation, spasme) → ischémie à l’effort → séquence des anomalies (perfusion, fonction, ECG, douleur) → conséquences chroniques (sidération répétée, hibernation, fibrose).</b></p>
<h3>3.1 Le point de départ : un myocarde qui extrait déjà presque tout l’oxygène</h3>
<p>Au repos, le myocarde extrait environ 70 à 75 % de l’oxygène du sang coronaire. Il ne peut donc pas répondre à une hausse des besoins en extrayant davantage : il doit augmenter le débit. C’est la notion centrale du <button class="w" data-k="i21-mvo2">bilan en oxygène du myocarde (apports et besoins)</button>. Les besoins dépendent de trois déterminants : la fréquence cardiaque, la contractilité et la tension pariétale. Les apports dépendent de la pression de perfusion diastolique, de la durée de la diastole et des résistances coronaires.</p>
<div class="key"><b>Corrélation physiologie → thérapeutique.</b> Chaque anti-angineux agit sur un terme de ce bilan. Les bêtabloquants réduisent la fréquence et la contractilité, et allongent la diastole, qui est le moment où le ventricule gauche est perfusé. Les inhibiteurs calciques dihydropyridiniques réduisent la postcharge et dilatent les coronaires. Les dérivés nitrés réduisent la précharge, donc le rayon et la tension pariétale. L’ivabradine réduit la seule fréquence. La ranolazine et la trimétazidine agissent sur le métabolisme du cardiomyocyte ischémique.</div>
<h3>3.2 La sténose épicardique limite la réserve, pas le débit de repos</h3>
<p>Lorsqu’une sténose se constitue, les artérioles d’aval se dilatent pour maintenir le débit de repos : c’est l’<button class="w" data-k="i25-autoreg">autorégulation coronaire (maintien du débit par vasodilatation d’aval)</button>. Le débit de repos reste donc normal jusqu’à une sténose d’environ 85 à 90 % du diamètre. En revanche, les artérioles ont consommé une partie de leur capacité de dilatation. À l’effort, elles ne peuvent plus augmenter le débit autant que nécessaire : la <button class="w" data-k="i25-cfr">réserve coronaire (rapport débit maximal / débit de repos)</button> diminue dès qu’une sténose dépasse environ 50 % du diamètre. C’est la base de l’angor d’effort : le patient est asymptomatique au repos, et devient ischémique au-delà d’un seuil d’effort reproductible.</p>

<p>Le pourcentage de sténose visuel ne prédit qu’imparfaitement son effet hémodynamique. La perte de charge à travers une sténose dépend de sa longueur, de la surface de la lumière résiduelle (le rayon intervient à la puissance quatre selon la <button class="w" data-k="i25-poiseuille">loi de Poiseuille et pertes de charge (physique de la sténose)</button>), du débit, et du territoire myocardique d’aval. C’est pourquoi une sténose « à 70 % » peut être hémodynamiquement significative ou non : la <button class="w" data-k="i25-ffr">réserve coronaire fractionnelle (FFR, mesure invasive)</button> tranche.</p>
<h3>3.3 La séquence de l’ischémie</h3>
<p>Lorsque l’apport devient insuffisant, les anomalies apparaissent dans un ordre constant, décrit sous le nom de <button class="w" data-k="i25-cascade">cascade ischémique (ordre d’apparition des anomalies)</button> : hétérogénéité de perfusion, puis anomalies métaboliques, puis dysfonction diastolique, puis dysfonction systolique segmentaire, puis modifications de l’ECG, enfin douleur. La douleur est donc la dernière manifestation. Cette séquence a deux conséquences pratiques : l’imagerie de perfusion et l’échocardiographie de stress détectent l’ischémie plus tôt et plus souvent que l’ECG d’effort, et une ischémie peut exister sans douleur (ischémie silencieuse, fréquente chez le diabétique).</p>

<h3>3.4 Trois mécanismes d’ischémie, souvent associés</h3>
<div class="two">
<div class="card"><h4>Sténose épicardique fixe</h4><p>Plaque athéroscléreuse stable, à chape fibreuse épaisse. Seuil ischémique reproductible : l’angor survient pour le même effort. Traitement : anti-angineux, prévention, revascularisation si indiquée.</p></div>
<div class="card"><h4>Dysfonction microvasculaire</h4><p>Les artérioles de moins de 500 µm, invisibles à l’angiographie, se dilatent mal (réserve réduite, résistances élevées) ou se contractent anormalement (spasme microvasculaire). Angor d’effort prolongé, souvent mal soulagé par la trinitrine.</p></div>
<div class="card"><h4>Vasospasme épicardique</h4><p>Constriction transitoire intense d’une artère épicardique, sur une artère saine ou athéromateuse. Angor de repos, nocturne ou matinal, avec sus-décalage transitoire du ST. Traitement : inhibiteurs calciques.</p></div>
<div class="card"><h4>Seuil ischémique variable</h4><p>Chez un même patient, sténose et tonus vasomoteur s’additionnent : l’angor survient pour un effort moindre le matin, au froid, après un repas ou lors d’une émotion. Cette variabilité traduit la composante dynamique du tonus coronaire.</p></div></div>
<h3>3.5 De l’ischémie répétée à la cardiomyopathie</h3>
<p>Des épisodes d’ischémie brefs et répétés provoquent une <button class="w" data-k="i21-sideration">sidération et une hibernation myocardiques (dysfonction réversible)</button>. Le myocarde hiberné réduit sa contraction pour survivre avec un apport réduit ; il reste viable et peut récupérer après revascularisation. À l’inverse, la nécrose d’un infarctus laisse une cicatrice fibreuse qui ne récupère pas. Une maladie coronaire étendue peut ainsi aboutir à une <b>cardiomyopathie ischémique</b>, par addition de cicatrices, de myocarde hiberné et de <button class="w" data-k="remodel">remodelage ventriculaire (dilatation, fibrose, sphéricisation)</button>.</p>
<h3>3.6 Pourquoi la revascularisation ne prévient pas toujours l’infarctus</h3>
<p>La plupart des infarctus naissent d’une <button class="w" data-k="i21-plaque">plaque vulnérable (rupture ou érosion)</button> qui n’était pas nécessairement la sténose la plus serrée. Les plaques responsables d’infarctus sont souvent des plaques peu sténosantes, riches en lipides, à chape fine. Dilater une sténose serrée stable soulage l’ischémie qu’elle cause, mais ne traite pas les dizaines d’autres plaques de l’arbre coronaire. La prévention des événements repose donc sur un traitement <b>systémique</b> : abaisser le LDL-cholestérol stabilise l’ensemble des plaques, les antiplaquettaires limitent la thrombose, la colchicine réduit l’inflammation de la paroi.</p>
<div class="key"><b>Corrélation anatomie → pronostic → décision.</b> Ce raisonnement explique le résultat de l’essai ISCHEMIA (2020) : chez des patients ayant une ischémie modérée à sévère, une stratégie invasive initiale n’a pas réduit les décès cardiovasculaires ni les infarctus par rapport à un traitement médical optimal, mais a mieux soulagé l’angor. Il explique aussi les exceptions : quand le territoire menacé est très étendu (tronc commun, atteinte tritronculaire, fonction ventriculaire réduite), la revascularisation, en particulier le pontage, améliore la survie.</div>
<button class="pareto-btn ui" data-k="pareto-i25-physio">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="i25-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>L’athérosclérose coronaire est de loin la première cause de SCC. Mais un angor n’est pas toujours athéroscléreux, et une maladie coronaire n’est pas toujours symptomatique. Le raisonnement étiologique distingue les causes coronaires et les causes qui provoquent une ischémie sur des coronaires saines.</p>
<div class="two">
<div class="card"><h4>Causes coronaires athéroscléreuses</h4><p>Plaques épicardiques stables ; resténose ou progression après angioplastie ; dégénérescence des greffons veineux après pontage (les greffons veineux s’occluent progressivement au fil des années, alors que l’artère mammaire interne reste perméable dans la grande majorité des cas).</p></div>
<div class="card"><h4>Causes coronaires non athéroscléreuses</h4><p>Vasospasme ; dysfonction microvasculaire ; <button class="w" data-k="i25-pont">pont myocardique (trajet intramyocardique d’une artère)</button> ; anomalies congénitales d’origine ou de trajet ; vascularites (maladie de Kawasaki, artérite de Takayasu) ; coronaropathie radique après radiothérapie thoracique ; séquelles de dissection coronaire spontanée.</p></div>
<div class="card"><h4>Ischémie par hausse des besoins</h4><p>Rétrécissement aortique serré ; cardiomyopathie hypertrophique ; hypertrophie ventriculaire gauche hypertensive ; tachyarythmie ; thyrotoxicose.</p></div>
<div class="card"><h4>Ischémie par baisse des apports</h4><p>Anémie sévère ; hypoxémie ; hypotension ; hyperviscosité. Ces facteurs démasquent une maladie coronaire latente ou provoquent une ischémie sur des coronaires saines.</p></div></div>
<h3>4.1 Facteurs de risque de l’athérosclérose</h3>
<p>Les facteurs utilisés par le modèle de l’ESC 2024 sont au nombre de cinq : <b>antécédent familial de maladie coronaire précoce, tabagisme actuel ou ancien, dyslipidémie, hypertension artérielle et diabète.</b> Le modèle compte simplement leur nombre (0–1, 2–3, 4–5). S’y ajoutent l’âge et le sexe masculin, qui entrent directement dans le calcul.</p>
<p>D’autres facteurs modifient le risque : obésité et sédentarité, insuffisance rénale chronique, <button class="w" data-k="i21-lpa">lipoprotéine(a) élevée (facteur génétique)</button>, <button class="w" data-k="i21-hf">hypercholestérolémie familiale (LDL très élevé dès l’enfance)</button>, maladies inflammatoires chroniques (polyarthrite rhumatoïde, psoriasis, lupus), infection par le VIH, antécédent de prééclampsie ou de diabète gestationnel, ménopause précoce, stress psychosocial et dépression, pollution atmosphérique.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer un angor d’effort à une coronaropathie sans ausculter le patient. Un souffle éjectionnel aortique évoque un rétrécissement aortique serré, qui provoque un angor sur des coronaires saines et contre-indique l’épreuve d’effort maximale s’il est symptomatique. L’échocardiographie de repos fait partie du bilan initial pour cette raison.</div>
<button class="pareto-btn ui" data-k="pareto-i25-etio">▲ Loi de Pareto — Étiologies et facteurs de risque</button>
</section>

<section class="ilot" id="i25-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse est l’examen le plus rentable du SCC : elle classe le symptôme, estime la probabilité de maladie coronaire, détecte l’instabilité et recherche une cause non coronaire. Elle suit l’ordre : terrain et antécédents, puis symptômes par ordre de fréquence, puis histoire de la maladie.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i21-atcd-coro">Coronaropathie connue (infarctus, stents, pontages)</button></li><li><button class="w" data-k="i25-atcd-frcv">Facteurs de risque comptés par le modèle ESC (cinq)</button></li><li><button class="w" data-k="i25-atcd-vasc">Artériopathie des membres inférieurs, sténose carotidienne, AVC (athérosclérose polyvasculaire)</button></li><li><button class="w" data-k="i25-atcd-irc">Insuffisance rénale chronique, maladie inflammatoire chronique (risque accru)</button></li></ul>
<ul><li><button class="w" data-k="i25-atcd-radio">Radiothérapie thoracique ou chimiothérapie (coronaropathie radique, spasme)</button></li><li><button class="w" data-k="i25-atcd-subst">Cocaïne, amphétamines, triptans (vasospasme)</button></li><li><button class="w" data-k="i25-atcd-preg">Prééclampsie, ménopause précoce (risque propre à la femme)</button></li><li><button class="w" data-k="i25-atcd-pde5">Inhibiteurs de la phosphodiestérase de type 5 (interaction avec les nitrés)</button>, anticoagulants</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i25-s-angor">Angor d’effort (sept questions de caractérisation)</button></li><li><button class="w" data-k="i25-equiv">Dyspnée d’effort et autres équivalents angineux</button></li><li><button class="w" data-k="i25-s-fatigue">Fatigue, baisse de la tolérance à l’effort (équivalent ou autre cause)</button></li></ul>
<ul><li><button class="w" data-k="i25-s-repos">Angor de repos, nocturne ou matinal (vasospasme)</button></li><li><button class="w" data-k="i25-s-prolong">Angor prolongé après l’effort (dysfonction microvasculaire)</button></li><li><button class="w" data-k="i25-s-palp">Palpitations, lipothymie d’effort (arythmie, sténose sévère)</button></li></ul></div>
<p>La caractérisation de la douleur passe par sept questions : localisation, caractère, irradiation, facteur déclenchant, durée, facteur soulageant, évolution dans le temps. Une douleur de quelques secondes, en coup d’aiguille, localisée du bout du doigt, déclenchée par la palpation ou la respiration, n’est pas angineuse. Une douleur de 2 à 10 minutes, constrictive, rétrosternale, déclenchée par l’effort et soulagée par le repos l’est.</p>
<div class="alert"><b>Rechercher l’instabilité à chaque consultation.</b> Un angor de repos de plus de 20 minutes, un angor d’apparition récente sévère ou un angor « crescendo » (plus fréquent, plus long, pour des efforts moindres) définissent un syndrome coronarien aigu. Le patient relève alors de l’algorithme du chapitre I21 et non du bilan ambulatoire.</div>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 64 ans, diabétique, fumeur. Oppression rétrosternale irradiant au bras gauche après 200 m de marche en montée, cédant en 3 minutes à l’arrêt, reproductible depuis quatre mois. Angor typique, classe canadienne II.</p></div>
<div class="card"><h4>Forme dyspnéique</h4><p>Femme de 76 ans, diabétique. Seule plainte : essoufflement en montant un étage, sans douleur. Échocardiographie normale au repos. La dyspnée est ici un équivalent angineux possible, intégré comme tel dans le modèle ESC.</p></div>
<div class="card"><h4>Forme vasospastique</h4><p>Femme de 48 ans, fumeuse, migraineuse. Douleurs thoraciques vers 5 heures du matin, de 10 minutes, cédant à la trinitrine ; effort bien toléré l’après-midi. Enregistrement ECG : sus-décalage transitoire du ST pendant une crise.</p></div>
<div class="card"><h4>Forme microvasculaire</h4><p>Femme de 57 ans, hypertendue. Angor d’effort persistant plusieurs minutes après l’arrêt, peu sensible à la trinitrine. Coroscanner sans sténose. Réserve coronaire abaissée à la TEP : dysfonction microvasculaire.</p></div></div>
</section>

<section class="ilot" id="i25-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique d’un patient suspect de SCC est souvent normal. Son rôle est triple : dépister une cause non coronaire d’angor, évaluer le terrain athéroscléreux et rechercher une insuffisance cardiaque. Il suit l’ordre : état général → signes vitaux → anthropométrie → signes ciblés.</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Aspect général, pâleur (anémie), signes de thyrotoxicose. <button class="w" data-k="i25-v-ta">Pression artérielle aux deux bras (hypertension, asymétrie)</button>, fréquence cardiaque de repos (cible des anti-angineux bradycardisants), rythme, saturation. Poids, taille, indice de masse corporelle, <button class="w" data-k="i10-e-taille">tour de taille (obésité abdominale)</button>.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Cause non coronaire d’angor</b><ul><li><button class="w" data-k="i25-e-ra">Souffle de rétrécissement aortique (angor sur coronaires saines)</button></li><li><button class="w" data-k="i25-e-cmho">Souffle de cardiomyopathie hypertrophique obstructive (manœuvres dynamiques)</button></li><li><button class="w" data-k="i25-e-thyro">Tachycardie, goitre, tremblement (thyrotoxicose)</button></li><li><button class="w" data-k="i25-e-anemie">Pâleur conjonctivale (anémie, seuil clinique)</button></li></ul></div>
<div><b>Terrain athéroscléreux</b><ul><li><button class="w" data-k="i25-e-pouls">Pouls périphériques et index de pression systolique</button></li><li><button class="w" data-k="i25-e-souffles">Souffles carotidiens et fémoraux (athérosclérose polyvasculaire)</button></li><li><button class="w" data-k="i25-e-xantho">Xanthomes, xanthélasma, arc cornéen (dyslipidémie)</button></li><li><button class="w" data-k="i25-e-frank">Pli diagonal du lobe de l’oreille (signe de Frank, valeur faible)</button></li></ul></div>
<div><b>Retentissement ventriculaire</b><ul><li><button class="w" data-k="e-crepitants">Crépitants pulmonaires (technique et valeur)</button>, <button class="w" data-k="e-b3">troisième bruit B3 (galop protodiastolique)</button>, <button class="w" data-k="e-jugulaire">turgescence jugulaire et reflux hépato-jugulaire (mesure)</button></li><li><button class="w" data-k="i25-e-im">Souffle d’insuffisance mitrale ischémique (mécanisme, valeur)</button></li><li><button class="w" data-k="i25-e-choc">Choc de pointe dévié ou étalé (dilatation, anévrisme)</button></li></ul></div>
<div><b>Pendant une crise</b><ul><li><button class="w" data-k="i25-e-b4">Quatrième bruit B4 (rigidité ventriculaire transitoire)</button></li><li>Souffle d’insuffisance mitrale transitoire, par dysfonction ischémique du pilier (<button class="w" data-k="i25-e-im">insuffisance mitrale ischémique</button>)</li><li>Tachycardie, hypertension ou hypotension</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>La douleur reproduite par la palpation de la paroi thoracique n’exclut pas une maladie coronaire : les deux coexistent souvent. Elle diminue la probabilité mais ne dispense pas du raisonnement probabiliste.</div>
<button class="pareto-btn ui" data-k="pareto-i25-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i25-7"><h2><span class="n">7</span>Démarche diagnostique et probabilité pré-test</h2>
<p>L’ESC 2024 propose une démarche en quatre étapes. Leur ordre a une logique : on exclut d’abord l’urgence, puis on caractérise le patient, puis on estime une probabilité, et seulement ensuite on choisit un examen.</p>
<h3>7.1 Étape 1 — Évaluation clinique initiale</h3>
<p>Elle exclut un syndrome coronarien aigu (instabilité, ECG, troponine si doute), évalue les symptômes et cherche un diagnostic concurrent : reflux gastro-œsophagien, douleur pariétale, embolie pulmonaire, péricardite, anxiété. Elle s’appuie sur l’ECG de repos, la biologie de base et l’échocardiographie transthoracique de repos, recommandée chez tout patient suspect de maladie coronaire.</p>
<h3>7.2 Étape 2 — Estimer la probabilité clinique</h3>
<p>Le <button class="w" data-k="i25-rfcl">modèle de probabilité pondérée par les facteurs de risque (RF-CL)</button> est recommandé par l’ESC 2024 (classe I) pour estimer la probabilité d’une maladie coronaire épicardique obstructive. Il combine le sexe, l’âge, le type de symptôme (angor typique, atypique, douleur non angineuse, dyspnée) et le nombre de facteurs de risque. Il remplace l’ancienne table de probabilité pré-test de 2019, qui surestimait la probabilité chez la plupart des patients.</p>
<p>La probabilité obtenue est ensuite <b>ajustée</b> selon des éléments qui l’augmentent : anomalies de l’ECG de repos (ondes Q, anomalies du ST ou de l’onde T), dysfonction ventriculaire gauche évocatrice d’une cause ischémique, ECG d’effort anormal, artériopathie périphérique, calcifications coronaires sur un scanner antérieur. Le <button class="w" data-k="i25-cac">score calcique coronaire (Agatston)</button> peut reclasser le patient : le modèle combiné (CACS-CL) classe davantage de patients en probabilité très basse.</p>
<table class="t"><tr><th>Probabilité (ESC 2024)</th><th>Catégorie</th><th>Conduite</th></tr>
<tr><td>≤ 5 %</td><td>Très basse</td><td>Différer les examens ; chercher une autre cause ; réévaluer si les symptômes persistent</td></tr>
<tr><td>&gt; 5–15 %</td><td>Basse</td><td>Coroscanner (score calcique possible pour reclasser)</td></tr>
<tr><td>&gt; 15–50 %</td><td>Modérée</td><td>Coroscanner <b>ou</b> imagerie fonctionnelle de stress</td></tr>
<tr><td>&gt; 50–85 %</td><td>Élevée</td><td>Imagerie fonctionnelle de stress de préférence</td></tr>
<tr><td>&gt; 85 %</td><td>Très élevée</td><td>Coronarographie invasive avec évaluation fonctionnelle, surtout si symptômes sévères ou signes de haut risque</td></tr></table>
<p class="src">Seuils : ESC 2024, 2024 ESC Guidelines for the management of chronic coronary syndromes. Coroscanner recommandé pour une probabilité &gt; 5–50 % (classe I) ; imagerie fonctionnelle recommandée pour &gt; 15–85 % (classe I) ; coronarographie invasive en première intention pour une probabilité très élevée, des symptômes sévères réfractaires ou un angor typique à faible niveau d’effort.</p>
<h3>7.3 Étape 3 — Choisir le premier examen</h3>
<p>Le choix obéit à un principe simple : <b>un examen anatomique exclut mieux, un examen fonctionnel confirme mieux.</b> Le <button class="w" data-k="i25-ccta">coroscanner (angioscanner coronaire)</button> a une valeur prédictive négative très élevée : un coroscanner sans plaque rend la maladie coronaire obstructive très improbable. Il est donc préféré lorsque la probabilité est basse ou modérée. Les <button class="w" data-k="i25-stressimg">examens d’imagerie de stress (échocardiographie, scintigraphie, TEP, IRM)</button> démontrent une ischémie et en mesurent l’étendue ; ils sont préférés lorsque la probabilité est plus élevée, car la question devient « cette maladie probable cause-t-elle une ischémie, et de quelle étendue ? ».</p>
<p>Le choix tient aussi compte du patient et de l’expertise locale. Le coroscanner est moins fiable en cas de calcifications coronaires étendues, de fréquence cardiaque élevée ou irrégulière, d’obésité importante et d’insuffisance rénale sévère. L’imagerie de stress est préférable chez le patient qui a déjà une maladie coronaire connue ou des stents. La <button class="w" data-k="i25-ffrct">FFR dérivée du coroscanner (FFR-CT)</button> ajoute une information fonctionnelle à une sténose intermédiaire vue au scanner. L’<button class="w" data-k="i25-ecgeffort">ECG d’effort (valeur diagnostique limitée)</button> n’est plus un examen diagnostique de première intention ; il garde une place pour évaluer la tolérance à l’effort, les symptômes, les arythmies et le pronostic, ou lorsque l’imagerie n’est pas disponible.</p>
<h3>7.4 Étape 4 — Stratifier le risque et décider</h3>
<p>Chaque examen donne aussi une information pronostique. Certains résultats définissent un <button class="w" data-k="i25-hautrisque">risque élevé d’événements (critères par examen)</button> : sténose du tronc commun, atteinte tritronculaire, ischémie étendue. Ils conduisent à une coronarographie invasive avec évaluation fonctionnelle, en vue d’une revascularisation pronostique. En l’absence de ces critères, le traitement médical optimal est la stratégie initiale, et la coronarographie se discute si les symptômes persistent.</p>

<h3>7.5 Diagnostics différentiels hiérarchisés par gravité</h3>
<table class="t"><tr><th>Gravité</th><th>Diagnostic</th><th>Élément distinctif</th></tr>
<tr><td>Menace vitale immédiate</td><td>Syndrome coronarien aigu, dissection aortique, embolie pulmonaire, tamponnade</td><td>Douleur de repos prolongée, instabilité, ECG et troponine</td></tr>
<tr><td>Grave, non immédiat</td><td>Rétrécissement aortique serré, cardiomyopathie hypertrophique, hypertension pulmonaire</td><td>Souffle, échocardiographie</td></tr>
<tr><td>Fréquent et bénin</td><td>Reflux gastro-œsophagien, spasme œsophagien, douleur musculo-squelettique, anxiété et trouble panique</td><td>Relation avec les repas, la posture, la palpation ; absence de lien avec l’effort</td></tr>
<tr><td>À ne pas oublier</td><td>Péricardite, pneumopathie, zona débutant, lithiase biliaire</td><td>Douleur positionnelle ou respiratoire, fièvre, éruption</td></tr></table>
<div class="trap"><span class="k">Erreur fréquente</span>Demander une épreuve d’effort à un patient dont la probabilité est très basse. Le résultat sera souvent faussement positif et entraînera une cascade d’examens inutiles. Lorsque la probabilité est ≤ 5 %, l’ESC 2024 propose de différer les examens et de réévaluer.</div>
<h3>7.6 Ischémie silencieuse (I25.6)</h3>
<p>L’<b>ischémie silencieuse</b> est une ischémie objectivée (sous-décalage du ST au Holter ou à l’effort, défaut de perfusion, trouble de la cinétique induit) sans angor ni équivalent angineux. Elle s’explique par la cascade ischémique : l’épisode s’arrête avant le stade de la douleur, ou la perception de la douleur est altérée. Elle est fréquente chez le diabétique (neuropathie autonome), le sujet âgé, l’insuffisant rénal, après un infarctus et après une transplantation cardiaque (cœur dénervé).</p>
<div class="two">
<div class="card"><h4>Dépistage</h4><p>Le dépistage systématique de l’ischémie chez le diabétique asymptomatique n’est pas recommandé : les essais DIAD (2009) et FACTOR-64 (2014) n’ont pas montré de réduction des événements. L’effort porte sur la prévention (LDL, pression, iSGLT2 ou agoniste du GLP-1). Un score calcique ou un coroscanner peut affiner le risque chez un patient à très haut risque, et une épreuve d’effort se justifie avant une reprise sportive intense.</p></div>
<div class="card"><h4>Conduite à tenir</h4><p>Une ischémie silencieuse démontrée se prend en charge comme un angor : même prévention, même stratification du risque. Une ischémie étendue ou des critères anatomiques de haut risque conduisent à la coronarographie. Chez le diabétique, une dyspnée d’effort nouvelle ou une baisse de la tolérance à l’effort doivent être considérées comme des équivalents angineux possibles.</p></div></div>

</section>
