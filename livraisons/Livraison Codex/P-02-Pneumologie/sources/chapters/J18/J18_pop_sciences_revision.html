<template data-pop="j18-ventilation-perfusion" data-title="Rapport bas, shunt et espace mort : les distinguer"><p>Une unité normalement ventilée et perfusée échange les gaz. Si sa ventilation diminue davantage que sa perfusion, son rapport devient bas. Le sang en sort moins oxygéné, mais l’oxygène inhalé peut encore atteindre cette unité.</p><p>Un shunt vrai exige une ventilation nulle malgré une perfusion persistante. Le sang ne se réoxygène pas dans cette unité. Son mélange avec le sang oxygéné des autres régions abaisse l’oxygénation artérielle.</p><p>L’espace mort alvéolaire correspond à une unité ventilée sans perfusion. Une perfusion seulement réduite produit un rapport élevé, plutôt qu’un espace mort pur. Une pneumonie peut associer des unités à rapport bas et des unités en shunt ; la saturation seule ne les distingue pas.</p><div class="key"><b>À retenir.</b> Le médecin distingue une diminution d’un débit de son absence complète. Cette distinction explique la réponse variable à l’oxygène.</div><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/1952203/" target="_blank" rel="noopener">Gea et collaborateurs, 1991</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9022598/" target="_blank" rel="noopener">Wagner et collaborateurs, 2022</a>.</p></template>
