<section class="ilot" id="i26-0"><h2><span class="n">0</span>Question clinique, cas fil rouge et objectifs</h2>
<p>L’embolie pulmonaire se reconnaît difficilement, car ses signes appartiennent aussi à de nombreuses autres maladies. Le raisonnement doit distinguer deux questions : quelle est la probabilité du diagnostic, et la circulation est-elle menacée ?</p>
<div class="key"><b>Cas fil rouge.</b> Une femme de 68 ans a reçu une prothèse totale du genou droit il y a douze jours, sous anesthésie générale de 95 minutes. Depuis ce matin, elle présente une dyspnée nouvelle et une douleur basithoracique gauche. Elle respire 26 fois par minute ; sa pression artérielle systolique est de 118 mmHg. La question immédiate est double : l’embolie est-elle probable, et menace-t-elle la circulation ?</div>
<p>Ces deux questions ne se confondent pas. La première relève du diagnostic : elle se résout par une probabilité clinique, un dosage sanguin ou une image. La seconde relève de la gravité : elle se résout par la pression artérielle, la perfusion des organes et l’état du ventricule droit. Un patient peut avoir une embolie certaine et peu grave, ou une embolie encore incertaine mais déjà menaçante. Le cours sépare donc ces deux raisonnements, puis il les réunit au moment de décider.</p>
<p>Deux pièges guettent le médecin dès l’accueil. Une saturation normale n’écarte pas l’embolie : jusqu’à 40 % des patients atteints ont une saturation artérielle en oxygène normale (ESC/ERS 2019). Une radiographie thoracique normale ne l’écarte pas davantage, car cet examen ne montre pas le caillot. Le raisonnement s’appuie donc sur la probabilité clinique et sur des examens validés, jamais sur la normalité d’un examen d’orientation.</p>
<p>À la fin de ce cours, le lecteur sait accomplir six tâches.</p>
<ul><li>Il reconnaît les présentations typiques et atypiques, et il estime une probabilité clinique avec une règle validée.</li><li>Il choisit la stratégie diagnostique selon la stabilité hémodynamique, la probabilité et le terrain.</li><li>Il distingue la certitude du diagnostic et la gravité, puis il classe le risque de décès précoce.</li><li>Il choisit l’anticoagulant, l’éventuelle reperfusion et le lieu de soins, et il justifie chaque choix.</li><li>Il fixe la durée du traitement, il organise le suivi et il prévient la récidive.</li><li>Il adapte la conduite à la grossesse, au cancer, au grand âge et aux insuffisances rénale et hépatique.</li></ul>
<p>Trois prérequis facilitent la lecture. Le premier est la <button class="w" data-k="i26-circ">circulation pulmonaire normale (pressions, résistances et réserve)</button>. Le deuxième est l’équilibre entre <button class="w" data-k="i26-hemostase">hémostase et fibrinolyse (formation et dissolution du caillot)</button>. Le troisième est la notion de <button class="w" data-k="i26-bayes">probabilité avant et après un test (raisonnement diagnostique)</button>. Elle explique pourquoi un même examen n’a pas la même valeur chez tous les patients.</p>
<div class="key"><b>À retenir.</b> Devant une suspicion d’embolie, le médecin se pose deux questions distinctes : la maladie est-elle probable, et la circulation est-elle menacée ? Une saturation ou une radiographie normale ne répond à aucune des deux.</div></section>
<section class="ilot" id="i26-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>La classification anatomique localise le caillot ; la classification pronostique évalue le risque de décès. Les distinguer permet de séparer le diagnostic de l’évaluation de la gravité (section 0).</p>
<h3>1.1 Définition</h3>
<p>L’embolie pulmonaire aiguë est l’obstruction brutale d’une artère pulmonaire ou de l’une de ses branches par un thrombus. Ce thrombus naît le plus souvent dans les veines profondes des membres inférieurs. Il migre ensuite par la veine cave inférieure, l’oreillette droite et le ventricule droit. La thrombose veineuse profonde et l’embolie pulmonaire sont donc deux expressions d’une seule maladie, la maladie thromboembolique veineuse (ESC/ERS 2019). Cette unité a une conséquence pratique : une thrombose prouvée dans une veine proximale de la jambe suffit à traiter un patient suspect d’embolie.</p>
<p>La CIM-10-GM 2024 code la maladie sous I26. Le code I26.0 désigne l’embolie avec mention de cœur pulmonaire aigu. Ses termes d’inclusion comprennent les formes dites massives ou fulminantes. Le code I26.9 désigne l’embolie sans mention de cœur pulmonaire aigu. D’autres matériaux que le caillot peuvent emboliser, comme la graisse, le liquide amniotique ou l’air. Ce cours traite l’embolie thrombotique ; il n’aborde l’embolie amniotique que dans la grossesse, à la section 11.</p>
<div class="key"><b>À retenir.</b> L’embolie pulmonaire est l’obstruction d’une artère pulmonaire par un caillot veineux migré. Elle forme avec la thrombose veineuse profonde une seule maladie, ce qui autorise à traiter sur la preuve d’une thrombose proximale.</div>
<h3>1.2 Classification anatomique</h3>
<p>La classification anatomique décrit le niveau le plus proximal atteint par le caillot : tronc de l’artère pulmonaire, artère principale, lobaire, segmentaire ou sous-segmentaire. Elle a d’abord une valeur diagnostique. Un défaut de remplissage segmentaire ou plus proximal sur l’angiographie tomodensitométrique confirme l’embolie chez un patient à probabilité clinique intermédiaire ou élevée (ESC/ERS 2019, classe I, niveau B). Un défaut sous-segmentaire isolé peut correspondre à un faux positif. L’ESC/ERS 2019 conseille alors de revoir l’image avec le radiologue ou de demander un second avis. Un autre examen d’imagerie peut être envisagé pour confirmer l’embolie (classe IIb, niveau C).</p>
<p>Le siège du caillot influence aussi les symptômes, sans fixer le pronostic. Dans la cohorte PIOPED II, une dyspnée ou une tachypnée existait chez 92 % des patients dont l’embolie atteignait une artère principale ou lobaire. Cette proportion tombait à 65 % lorsque l’artère la plus proximale atteinte était segmentaire. Un caillot proximal bien toléré reste pourtant moins dangereux qu’un caillot plus petit chez un patient dont le ventricule droit défaille. C’est pourquoi la gravité se mesure par l’hémodynamique et non par le siège.</p>
<div class="trap"><span class="k">Piège</span>Le terme « embolie massive » est ambigu : il désigne tantôt un gros caillot, tantôt un état de choc. La classification de l’ESC/ERS 2019 ne l’emploie pas. Elle décrit l’état hémodynamique, la perfusion des organes, le ventricule droit et les biomarqueurs. Le médecin documente donc ces paramètres plutôt que la seule taille du caillot.</div>
<div class="key"><b>À retenir.</b> Le siège segmentaire ou plus proximal sert à confirmer le diagnostic ; un défaut sous-segmentaire isolé se discute. Le siège ne mesure pas la gravité.</div>
<h3>1.3 Classification pronostique de l’ESC/ERS 2019</h3>
<p>L’ESC/ERS 2019 classe le risque de décès précoce, c’est-à-dire hospitalier ou à 30 jours, en deux temps. Le premier temps recherche une instabilité hémodynamique : sa présence définit le <button class="w" data-k="i26-hautrisque">haut risque (définition exacte)</button>. Le second temps concerne les patients stables. Il combine trois indicateurs, qui répondent chacun à une question différente. Le score clinique résume la sévérité de l’épisode et les comorbidités. L’imagerie montre si le ventricule droit est surchargé. La troponine cardiaque révèle si le myocarde souffre.</p>
<p>Le tableau suivant, adapté du tableau 8 de l’ESC/ERS 2019, montre comment ces indicateurs se combinent. La première colonne donne la classe de risque. Les quatre colonnes suivantes indiquent si chaque indicateur est présent (+) ou absent (−) ; le signe (+) entre parenthèses signifie que l’indicateur est souvent présent mais n’est pas nécessaire au classement. La dernière colonne résume la conséquence que la section 9 développe.</p>
<table class="t"><tr><th>Classe de risque</th><th>Instabilité hémodynamique</th><th>Score clinique élevé (PESI classe III à V ou sPESI ≥ 1)</th><th>Dysfonction du ventricule droit (échocardiographie ou scanner)</th><th>Troponine cardiaque élevée</th><th>Conséquence principale</th></tr><tr><td>Haut</td><td>+</td><td>(+)</td><td>+</td><td>(+)</td><td>Reperfusion urgente et soins critiques.</td></tr><tr><td>Intermédiaire haut</td><td>−</td><td>+</td><td>+</td><td>+</td><td>Hospitalisation, surveillance rapprochée, reperfusion de sauvetage si dégradation.</td></tr><tr><td>Intermédiaire bas</td><td>−</td><td>+</td><td colspan="2">Un seul des deux indicateurs positif, ou aucun</td><td>Hospitalisation et anticoagulation seule.</td></tr><tr><td>Faible</td><td>−</td><td>−</td><td colspan="2">Évaluation facultative ; si elle est faite, elle est négative</td><td>Sortie précoce envisageable si le domicile le permet.</td></tr></table>
<p>Le lecteur regarde d’abord la deuxième colonne : une instabilité classe le patient au haut risque, sans attendre le score ni la troponine. Chez le patient stable, il compte ensuite les indicateurs positifs. Le piège fréquent concerne le patient dont le score clinique est bas, mais dont le ventricule droit est dilaté ou dont la troponine est élevée. L’ESC/ERS 2019 le classe au risque intermédiaire, et non au risque faible. Avec un seul de ces deux signes, il relève du risque intermédiaire bas. La patiente du cas illustrera cette règle à la section 8.</p>
<div class="key"><b>À retenir.</b> L’instabilité hémodynamique suffit à définir le haut risque. Chez le patient stable, la combinaison d’un score clinique, du ventricule droit et de la troponine sépare les risques intermédiaire haut, intermédiaire bas et faible.</div>
<h3>1.4 Catégories cliniques de l’AHA/ACC 2026</h3>
<p>Les recommandations américaines publiées le 19.02.2026 proposent une autre grille : les <button class="w" data-k="i26-categories">catégories cliniques A à E (sous-groupes et modificateur respiratoire)</button>. La catégorie A regroupe les embolies infracliniques, découvertes fortuitement. La catégorie E regroupe les défaillances cardiorespiratoires avec choc ou arrêt cardiaque. Les catégories B à D décrivent les situations intermédiaires, selon le score de sévérité, le ventricule droit, les biomarqueurs et l’hypoperfusion. Les deux cadres ne se superposent pas mot pour mot : ce cours utilise l’ESC/ERS 2019 comme référence principale et signale les décisions propres à l’AHA/ACC 2026.</p>
<h3>1.5 Classification selon le facteur déclenchant</h3>
<p>Une troisième classification décrit la circonstance de survenue. L’ESC/ERS 2019 renonce aux termes « provoquée », « non provoquée » et « idiopathique ». Elle distingue le facteur transitoire ou réversible majeur, le facteur transitoire mineur ou persistant non cancéreux, l’absence de facteur identifiable, les épisodes récidivants ou le syndrome des antiphospholipides, et le cancer actif. Cette <button class="w" data-k="i26-provocation">qualification du facteur déclenchant (catégories et risque de récidive)</button> ne change pas le traitement initial. Elle décide de sa durée, à la section 10.</p>
<div class="key"><b>À retenir.</b> L’embolie pulmonaire est l’expression thoracique de la maladie thromboembolique veineuse. Le siège du caillot sert au diagnostic. La gravité se classe selon l’hémodynamique, le score clinique, le ventricule droit et la troponine. Le facteur déclenchant décide de la durée du traitement.</div></section>
<section class="ilot" id="i26-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La fréquence de l’embolie pulmonaire, sa mortalité et ses séquelles justifient une vigilance clinique. La maladie peut tuer avant le diagnostic ; le surdiagnostic impose aussi une confirmation rigoureuse. Les données suisses sont mises en perspective avec les données européennes.</p>
<h3>2.1 Fréquence en Europe et en Suisse</h3>
<p>En Europe, la maladie thromboembolique veineuse est le troisième syndrome cardiovasculaire aigu, après l’infarctus du myocarde et l’accident vasculaire cérébral (ESC/ERS 2019). Les études épidémiologiques rapportent une incidence annuelle de l’embolie pulmonaire de 39 à 115 pour 100 000 habitants, et de la thrombose veineuse profonde de 53 à 162 pour 100 000. Le risque augmente fortement avec l’âge : la maladie thromboembolique est presque huit fois plus fréquente après 80 ans qu’entre 40 et 49 ans. Le vieillissement de la population fait donc croître le nombre de cas.</p>
<p>En Suisse, l’étude nationale de Wolf et collaborateurs, publiée en 2025, a analysé 180 600 hospitalisations pour embolie pulmonaire de personnes d’au moins 15 ans, entre 2003 et 2022. Ce total cumule vingt ans : il ne constitue pas une incidence annuelle. L’incidence standardisée sur l’âge est passée de 0,87 à 1,19 pour 1 000 habitants, soit de 87 à 119 pour 100 000. Le chiffre suisse de 2022 dépasse légèrement la borne haute de la fourchette européenne. Les méthodes de recueil diffèrent, et la comparaison reste indicative. L’âge médian au diagnostic a augmenté pendant la même période.</p>
<p>Cette étude a une lacune qu’il faut nommer. Elle ne compte que les patients hospitalisés : les embolies traitées entièrement en ambulatoire lui échappent. Comme la sortie précoce progresse (section 9), les chiffres hospitaliers représentent un minimum de l’incidence réelle.</p>
<div class="key"><b>À retenir.</b> L’incidence de l’embolie hospitalisée a augmenté en Suisse de 87 à 119 pour 100 000 habitants entre 2003 et 2022. Elle croît avec l’âge, et les cas traités en ambulatoire ne sont pas comptés.</div>
<h3>2.2 Mortalité : une baisse réelle, un risque persistant</h3>
<p>La même étude suisse montre une baisse de la mortalité. Le taux de mortalité par embolie est passé de 18,7 à 13 décès pour 100 000 habitants entre 2003 et 2022. La létalité hospitalière est la proportion de patients hospitalisés qui meurent à l’hôpital. Elle a diminué de 9,8 à 7,9 pour 100 entre 2003 et 2019, puis elle a augmenté pendant la pandémie de COVID-19. La durée médiane de séjour est passée de 11 à 8 jours. La baisse de la létalité et de la mortalité concernait en particulier les patients présentant des signes de haut risque.</p>
<p>Ces progrès ne doivent pas masquer les décès qui surviennent avant tout diagnostic. Un modèle épidémiologique cité par l’ESC/ERS 2019 portait sur six pays européens totalisant 454,4 millions d’habitants. Il a estimé à plus de 370 000 les décès liés à la maladie thromboembolique en 2004. Parmi ces patients, 34 % sont morts subitement ou dans les heures suivant l’accident aigu, avant qu’un traitement puisse agir. Chez 59 % des autres, l’embolie n’a été reconnue qu’après le décès, et seuls 7 % des patients décédés précocement avaient reçu un diagnostic correct de leur vivant. Ces chiffres expliquent l’exigence du cours : penser à l’embolie, puis la confirmer vite.</p>
<p>À l’inverse, le recours facile au scanner expose au surdiagnostic. Dans des études diagnostiques nord-américaines récentes, seuls 5 % des patients explorés avaient finalement une embolie, contre environ 50 % au début des années 1980 (ESC/ERS 2019). Une partie des embolies sous-segmentaires diagnostiquées aujourd’hui pourrait correspondre à des faux positifs. Ce surdiagnostic gonfle le nombre de cas et fait baisser artificiellement la létalité. Il expose aussi des patients à un anticoagulant inutile.</p>
<div class="key"><b>À retenir.</b> La mortalité de l’embolie baisse en Suisse, surtout dans les formes à haut risque, mais une grande partie des décès survient avant le diagnostic. Le surdiagnostic existe aussi : il justifie des stratégies diagnostiques validées.</div>
<h3>2.3 Pronostic à court et à long terme</h3>
<p>Le pronostic précoce dépend de la classe de risque ; le pronostic tardif dépend de la récidive et des séquelles. Le tableau suivant rassemble les chiffres pronostiques utilisés dans ce cours. La première colonne nomme l’événement ; la deuxième donne sa fréquence ; la troisième précise la population et l’horizon de temps ; la dernière cite la source.</p>
<table class="t"><tr><th>Événement</th><th>Fréquence</th><th>Population et horizon</th><th>Source</th></tr><tr><td>Décès à 30 jours avec un sPESI nul</td><td>1,0 % (intervalle de confiance à 95 % : 0,0 à 2,1 %)</td><td>Embolie aiguë, 30 jours</td><td>ESC/ERS 2019, tableau 7</td></tr><tr><td>Décès à 30 jours avec un sPESI d’au moins 1 point</td><td>10,9 % (8,5 à 13,2 %)</td><td>Embolie aiguë, 30 jours</td><td>ESC/ERS 2019, tableau 7</td></tr><tr><td>Décès à 30 jours selon la classe PESI</td><td>0 à 1,6 % en classe I ; 10,0 à 24,5 % en classe V</td><td>Embolie aiguë, 30 jours</td><td>ESC/ERS 2019, tableau 7</td></tr><tr><td>Récidive après l’arrêt du traitement</td><td>2,5 % par an après un facteur transitoire ; 4,5 % par an sans facteur connu</td><td>Après une première embolie</td><td>ESC/ERS 2019, § 8.1</td></tr><tr><td>Hypertension pulmonaire thromboembolique chronique</td><td>0,79 % à deux ans ; 3,7 pour 1 000 années-patients</td><td>508 patients dépistés dans 11 centres suisses, 2009 à 2016</td><td>Coquoz et collaborateurs, 2018</td></tr><tr><td>Capacité aérobie maximale réduite</td><td>47 %</td><td>100 patients canadiens suivis un an</td><td>ESC/ERS 2019, § 10.1</td></tr></table>
<p>Le lecteur retient d’abord le contraste des deux premières lignes. Un sPESI nul prédit une mortalité à 30 jours d’environ 1 %. Un sPESI positif prédit une mortalité dix fois plus élevée. Il note ensuite que la récidive après l’arrêt est presque deux fois plus fréquente en l’absence de facteur déclenchant. Cet écart fonde la décision de durée de la section 10. Après une embolie, la récidive prend plus souvent la forme d’une nouvelle embolie, et sa létalité est deux fois plus élevée qu’après une thrombose veineuse isolée (ESC/ERS 2019). L’erreur fréquente consiste à confondre la limitation fonctionnelle, fréquente et souvent liée au déconditionnement, avec l’hypertension pulmonaire thromboembolique chronique, rare mais grave.</p>
<p>La littérature rapporte pour cette hypertension une incidence cumulée de 0,1 à 9,1 % dans les deux ans. Selon l’ESC/ERS 2019, cette fourchette large s’explique par des biais de recrutement, la pauvreté des premiers symptômes et la difficulté de distinguer une maladie chronique préexistante. Le dépistage prospectif suisse, qui suivait les patients à 6, 12 et 24 mois, donne la valeur la plus fiable pour notre pays : 0,79 % à deux ans. Chez la patiente du cas, un sPESI nul annoncerait un risque de décès faible. Ce score ne suffit pas à lui seul à apprécier la gravité (section 8).</p>
<div class="key"><b>À retenir.</b> Le sPESI sépare une mortalité à 30 jours d’environ 1 % d’une mortalité d’environ 11 %. À long terme, la récidive dépend du facteur déclenchant, l’hypertension pulmonaire thromboembolique chronique reste rare (0,79 % à deux ans en Suisse) et la limitation fonctionnelle est fréquente.</div></section>
<section class="ilot" id="i26-3"><h2><span class="n">3</span>Physiopathologie : du caillot à la défaillance du ventricule droit</h2>
<p>Les conséquences du caillot se lisent à trois niveaux : le ventricule droit, les échanges gazeux et la plèvre. Relier chaque signe et chaque biomarqueur à ces mécanismes permet de comprendre la dyspnée, les anomalies des examens et le risque vital.</p>
<h3>3.1 Le normal : un circuit à basse pression</h3>
<p>La circulation pulmonaire reçoit la totalité du débit du ventricule droit, qui égale celui du ventricule gauche. Elle le transporte sous une pression faible. Chez le sujet sain au repos, la pression artérielle pulmonaire moyenne vaut 14,0 ± 3,3 mmHg et dépasse rarement 20 mmHg. Ces valeurs proviennent d’une revue de 47 études publiée en 2009 par Kovacs et collaborateurs. Cette pression basse traduit une résistance vasculaire faible. Le lit pulmonaire dispose en outre d’une réserve. Des capillaires peu perfusés au repos s’ouvrent et se distendent quand le débit augmente. Ce recrutement limite la hausse de pression.</p>
<p>Le ventricule droit est adapté à ce circuit. Sa paroi est fine, car il travaille contre une faible résistance. Il supporte bien une augmentation de volume, mais mal une augmentation brutale de pression. Selon l’ESC/ERS 2019, un ventricule droit qui n’a pas été préparé par une hypertension pulmonaire ancienne ne peut pas générer une pression artérielle pulmonaire moyenne supérieure à 40 mmHg. Cette limite explique la gravité de l’embolie étendue.</p>
<div class="key"><b>À retenir.</b> Le poumon normal est un circuit à basse pression et à grande réserve, servi par un ventricule droit à paroi fine. Une petite obstruction est absorbée par la réserve ; une obstruction étendue dépasse la capacité du ventricule droit.</div>
<h3>3.2 Du thrombus veineux à l’obstruction artérielle</h3>
<p>Le caillot se forme d’abord dans une veine, là où se combinent stase sanguine, activation de la coagulation et lésion de la paroi. Ce <button class="w" data-k="i26-thrombus">thrombus veineux (formation et migration)</button> se fragmente ou se détache, puis il gagne l’artère pulmonaire. Dans une étude par phlébographie citée par l’ESC/ERS 2019, une thrombose veineuse profonde existait chez 70 % des patients porteurs d’une embolie prouvée. L’échographie de compression, souvent limitée à quatre points (plis de l’aine et creux poplités), n’en retrouve que chez 30 à 50 % des patients. Une échographie normale des jambes n’exclut donc pas l’embolie.</p>
<p>L’obstruction mécanique n’agit pas seule. Les plaquettes du caillot libèrent du TXA₂ et de la sérotonine, qui contractent les artères pulmonaires encore perméables. L’hypoxie alvéolaire des zones atteintes ajoute une vasoconstriction. Selon l’ESC/ERS 2019, la pression artérielle pulmonaire s’élève lorsque plus de 30 à 50 % de la section totale du lit artériel est obstruée. Les <button class="w" data-k="i26-circ">résistances vasculaires pulmonaires (valeurs normales et réserve)</button> augmentent alors, et la postcharge du ventricule droit avec elles.</p>
<div class="key"><b>À retenir.</b> L’embolie associe une obstruction mécanique et une vasoconstriction chimique. La pression pulmonaire ne monte qu’au-delà de 30 à 50 % d’obstruction du lit artériel : c’est pourquoi de petites embolies restent sans effet hémodynamique.</div>
<h3>3.3 Surcharge du ventricule droit et boucle d’aggravation</h3>
<p>La hausse brutale de la postcharge dilate le ventricule droit. Le mécanisme de Frank-Starling augmente d’abord sa force de contraction, et l’activation neurohormonale accélère le cœur et contracte les vaisseaux systémiques. Ces compensations maintiennent un temps la pression artérielle. Elles restent pourtant limitées, pour la raison vue en 3.1.</p>
<p>La dilatation déclenche ensuite une <button class="w" data-k="i26-defvd">défaillance ventriculaire droite aiguë (mécanismes enchaînés)</button>. La contraction du ventricule droit se prolonge jusqu’au début de la diastole du ventricule gauche. Le septum interventriculaire bombe alors vers la gauche et gêne le remplissage du ventricule gauche. Un bloc de branche droit peut aggraver cette désynchronisation. Le débit cardiaque baisse, puis la pression artérielle systémique. Or la perfusion coronaire du ventricule droit dépend de cette pression, alors que ses besoins en oxygène augmentent avec la tension de sa paroi. L’ischémie qui en résulte diminue encore sa contractilité, et la boucle se referme.</p>
<p>La figure 1 résume ce mécanisme. Le panneau 1 montre le circuit normal. Le panneau 2 suit la boucle d’aggravation dans le sens des flèches, de l’obstruction jusqu’au choc obstructif. Le lecteur y repère l’étape où agit chaque traitement de la section 9. La reperfusion lève l’obstruction. Le vasopresseur restaure la pression qui perfuse les coronaires. Un remplissage excessif aggrave au contraire la dilatation.</p>

<p>Deux conséquences cliniques découlent de cette boucle. D’abord, une hypotension persistante signale un mécanisme déjà engagé : elle impose une réponse immédiate. Ensuite, la dégradation peut être secondaire. L’ESC/ERS 2019 décrit des déstabilisations 24 à 48 heures après l’embolie, attribuées à une réaction inflammatoire du myocarde droit ou à une récidive précoce. Un patient stable à l’admission, mais dont le ventricule droit souffre, doit donc être surveillé.</p>
<div class="key"><b>À retenir.</b> La défaillance aiguë du ventricule droit est la première cause de décès de l’embolie grave (ESC/ERS 2019). Elle s’auto-entretient : la baisse du débit réduit la perfusion coronaire du ventricule droit, qui se contracte alors encore moins bien. Une dégradation peut survenir secondairement, dans les 24 à 48 heures.</div>
<h3>3.4 Échanges gazeux : hypoxémie, hypocapnie et saturation parfois normale</h3>
<p>Selon l’ESC/ERS 2019, l’insuffisance respiratoire de l’embolie résulte surtout du trouble hémodynamique. Trois mécanismes s’additionnent. Le premier est un <button class="w" data-k="i26-espace">déséquilibre entre ventilation et perfusion (espace mort et mécanisme)</button>. Les zones obstruées restent ventilées mais peu perfusées. Le sang détourné surcharge les capillaires restés perméables, où il s’oxygène mal. Le deuxième est la baisse du débit cardiaque, qui abaisse la saturation du sang veineux mêlé. Le troisième est un <button class="w" data-k="i26-shunt">shunt par foramen ovale perméable (hypoxémie réfractaire, embolie paradoxale)</button>, détecté chez environ un tiers des patients.</p>
<p>Le patient hyperventile, ce qui abaisse la PaCO₂ : l’hypocapnie est fréquente. PIOPED II a analysé 48 patients sans maladie cardiopulmonaire préalable qui avaient un gaz du sang en air ambiant. Parmi eux, 63 % avaient une PaCO₂ inférieure ou égale à 35 mmHg, et 40 % un pH supérieur à 7,45. L’hypoxémie, elle, manquait souvent : 38 % de ces patients avaient une PaO₂ d’au moins 80 mmHg. L’ESC/ERS 2019 rapporte de même une saturation artérielle normale chez jusqu’à 40 % des patients et un gradient alvéolo-artériel normal chez 20 %. Une oxygénation normale n’écarte donc pas l’embolie.</p>
<div class="key"><b>À retenir.</b> L’hypoxémie vient surtout du déséquilibre ventilation-perfusion et de la baisse du débit. Un shunt par foramen ovale perméable peut la rendre réfractaire. L’hypocapnie est fréquente, mais une saturation ou une PaO₂ normale n’exclut pas l’embolie.</div>
<h3>3.5 Infarctus pulmonaire, plèvre et biomarqueurs</h3>
<p>Les petits emboles distaux ont un faible effet hémodynamique, mais ils peuvent provoquer une hémorragie alvéolaire. Il en résulte une hémoptysie, une irritation pleurale douloureuse et un épanchement le plus souvent minime : c’est l’<button class="w" data-k="i26-infarctus">infarctus pulmonaire (mécanisme et signes)</button>. Son effet sur les échanges gazeux reste modeste, sauf chez le patient qui avait déjà une maladie cardiorespiratoire (ESC/ERS 2019). Le tissu pulmonaire reçoit l’oxygène par trois voies, les artères pulmonaires, les artères bronchiques et l’air alvéolaire. Cette triple alimentation explique qu’une obstruction artérielle n’entraîne pas toujours d’infarctus.</p>
<p>Les biomarqueurs traduisent ces mécanismes. La troponine cardiaque s’élève quand le ventricule droit souffre d’ischémie ; les peptides natriurétiques s’élèvent quand sa paroi est étirée. Les D-dimères, produits de la dégradation de la fibrine, témoignent d’une coagulation et d’une fibrinolyse simultanées. Aucun de ces marqueurs ne localise le caillot. La <button class="w" data-k="i26-tropo">troponine, les peptides natriurétiques et le lactate (valeur pronostique)</button> mesurent la gravité. Les D-dimères servent, eux, à exclure la maladie. Les sections 7 et 8 exploitent cette différence.</p>
<div class="key"><b>À retenir.</b> Le ventricule droit décide du pronostic ; les échanges gazeux et la plèvre expliquent les symptômes. Une troponine élevée dans une embolie confirmée traduit une souffrance du ventricule droit et sert au pronostic : elle ne prouve ni l’embolie ni un infarctus coronaire.</div>

<section class="ilot" id="i26-4"><h2><span class="n">4</span>Facteurs de risque, circonstances et terrain</h2>
<p>Les circonstances favorisant la thrombose veineuse orientent la probabilité clinique à l’accueil (section 7) et la durée du traitement (section 10). Leur recherche complète les mécanismes de formation et de migration du caillot (section 3).</p>
<h3>4.1 Pourquoi un facteur de risque augmente la probabilité</h3>
<p>Selon l’ESC/ERS 2019, la maladie thromboembolique résulte de l’interaction entre des facteurs liés au patient, souvent permanents, et des facteurs liés à la situation, souvent temporaires. Chaque facteur agit sur au moins un élément de la triade décrite en 3.2 : la stase, l’hypercoagulabilité ou la lésion de la paroi veineuse. La probabilité clinique augmente avec le nombre de facteurs présents. Pourtant, aucun facteur n’est retrouvé chez 40 % des patients atteints : leur absence n’écarte jamais le diagnostic.</p>
<h3>4.2 Hiérarchie des facteurs selon leur force</h3>
<p>Le tableau suivant, adapté du tableau 3 de l’ESC/ERS 2019, classe les facteurs selon la force de leur association avec la maladie. Cette force s’exprime par le rapport de cotes : un rapport de 10 signifie que la maladie est environ dix fois plus fréquente en présence du facteur. La première colonne donne la catégorie et son rapport de cotes ; la deuxième énumère les facteurs ; la troisième indique le mécanisme dominant, qui aide à les mémoriser.</p>
<table class="t"><tr><th>Catégorie</th><th>Facteurs (ESC/ERS 2019, tableau 3)</th><th>Mécanisme dominant</th></tr><tr><td>Forts : rapport de cotes supérieur à 10</td><td>Fracture d’un membre inférieur ; prothèse de hanche ou de genou ; traumatisme majeur ; lésion de la moelle épinière ; hospitalisation pour insuffisance cardiaque, fibrillation ou flutter auriculaire dans les 3 mois ; infarctus du myocarde dans les 3 mois ; antécédent de maladie thromboembolique veineuse.</td><td>Lésion veineuse et immobilisation après chirurgie ou traumatisme ; stase liée à la défaillance cardiaque ou à la paralysie ; terrain thrombogène révélé par un premier épisode.</td></tr><tr><td>Modérés : rapport de cotes de 2 à 9</td><td>Arthroscopie du genou ; maladie auto-immune ; transfusion sanguine ; cathéter veineux central, cathéters et sondes intraveineux ; chimiothérapie ; insuffisance cardiaque congestive ou insuffisance respiratoire ; agents stimulant l’érythropoïèse ; traitement hormonal substitutif, selon la formulation ; fécondation in vitro ; contraception orale ; post-partum ; infection, en particulier pneumonie, infection urinaire et infection par le VIH ; maladie inflammatoire de l’intestin ; cancer, avec un risque maximal en cas de métastases ; accident vasculaire cérébral avec paralysie ; thrombose veineuse superficielle ; thrombophilie.</td><td>Hypercoagulabilité due aux hormones, au cancer ou à l’inflammation ; lésion de la paroi par un corps étranger ; stase due à la paralysie.</td></tr><tr><td>Faibles : rapport de cotes inférieur à 2</td><td>Alitement de plus de 3 jours ; diabète ; hypertension artérielle ; immobilité en position assise, par exemple lors d’un long voyage en voiture ou en avion ; âge croissant ; chirurgie laparoscopique ; obésité ; grossesse ; varices.</td><td>Stase modérée ou association indirecte.</td></tr></table>
<p>Le lecteur regarde d’abord la première ligne : un seul facteur fort suffit à rendre l’embolie plausible devant une dyspnée inexpliquée. L’erreur fréquente consiste à négliger les causes médicales. Une hospitalisation récente pour insuffisance cardiaque ou pour fibrillation auriculaire compte parmi les facteurs forts, au même titre qu’une fracture. À l’inverse, l’accumulation de facteurs faibles, comme l’âge, l’obésité et un voyage, justifie la suspicion sans la rendre forte. La patiente du cas porte un facteur fort, la prothèse du genou posée il y a douze jours.</p>
<div class="key"><b>À retenir.</b> Les facteurs forts sont la chirurgie orthopédique majeure, les fractures et traumatismes majeurs, la lésion médullaire, l’infarctus ou l’hospitalisation cardiaque récents et l’antécédent de thrombose. Leur absence n’exclut rien, car 40 % des patients n’ont aucun facteur identifiable.</div>
<h3>4.3 Précisions utiles sur quelques facteurs</h3>
<p>Le <button class="w" data-k="i26-a-cancer">cancer (localisations à haut risque et conséquences)</button> est un facteur bien établi. Selon l’ESC/ERS 2019, les cancers du pancréas, les hémopathies malignes et les cancers du poumon, de l’estomac et du cerveau exposent au risque le plus élevé. Le cancer augmente aussi fortement la mortalité toutes causes après un épisode thromboembolique.</p>
<p>Les <button class="w" data-k="i26-a-oes">œstrogènes, la grossesse et le post-partum (risque et alternatives)</button> dominent chez la femme jeune. La contraception orale combinée associe un œstrogène et un progestatif. Elle multiplie le risque par deux à six environ. Elle constitue le facteur le plus fréquent chez la femme en âge de procréer. Les pilules de troisième génération, contenant par exemple du désogestrel ou du gestodène, exposent davantage que celles de deuxième génération, qui contiennent du lévonorgestrel. Les dispositifs intra-utérins libérant un progestatif et certaines pilules progestatives seules n’augmentent pas significativement le risque (ESC/ERS 2019).</p>
<p>L’infection est un déclencheur fréquent, et la transfusion sanguine comme les agents stimulant l’érythropoïèse augmentent le risque. Une <button class="w" data-k="i26-a-thrombo">thrombophilie ou une histoire familiale (qui tester et pourquoi)</button> ne se recherche pas chez tous les patients. Le bilan se discute surtout avant 50 ans et en l’absence de facteur identifiable. Des antécédents familiaux marqués renforcent l’indication. Les facteurs de risque cardiovasculaire, comme le tabagisme, l’obésité, l’hypercholestérolémie, l’hypertension et le diabète, sont partagés avec la maladie artérielle. Enfin, une <button class="w" data-k="i26-a-cardio">maladie cardiaque récente (insuffisance cardiaque, fibrillation auriculaire, infarctus)</button> augmente le risque d’embolie, et un épisode thromboembolique augmente en retour le risque ultérieur d’infarctus et d’accident vasculaire cérébral.</p>
<div class="key"><b>À retenir.</b> Le cancer, les œstrogènes combinés, la grossesse et le post-partum, l’infection et la thrombophilie sont des facteurs modérés. Chez une femme qui a fait une thrombose, un dispositif intra-utérin au progestatif ou certaines pilules progestatives seules n’augmentent pas significativement le risque.</div>
<h3>4.4 De la circonstance à la durée du traitement</h3>
<p>Le facteur déclenchant n’est pas seulement un indice diagnostique : il prédit le risque de récidive après l’arrêt du traitement. Le médecin note donc sa force, sa date et sa disparition. Il le classe ensuite en <button class="w" data-k="i26-provocation">facteur transitoire majeur, mineur ou persistant (définitions et risque de récidive)</button>. L’ESC/ERS 2019 cite trois exemples de facteur transitoire majeur. Le premier est une chirurgie sous anesthésie générale de plus de 30 minutes. Le deuxième est un alitement hospitalier d’au moins trois jours pour une maladie aiguë. Le troisième est un traumatisme avec fracture. La patiente du cas en relève, car sa prothèse a été posée sous anesthésie générale de 95 minutes.</p>
<p>Une embolie sans facteur apparent fait craindre un cancer occulte, car une partie de ces patients développe un cancer dans l’année. Pourtant, deux grands essais randomisés n’ont pas montré qu’un scanner abdominal systématique ou une tomographie par émission de positons détectait davantage de cancers qu’un bilan limité (ESC/ERS 2019). La recherche se limite donc à un interrogatoire attentif, à un examen clinique complet et à une biologie de base. Une radiographie thoracique s’y ajoute si aucun scanner thoracique n’a été fait. Les dépistages recommandés pour l’âge complètent ce bilan.</p>
<div class="key"><b>À retenir.</b> Le facteur déclenchant se qualifie dès l’admission, car il décidera de la durée du traitement. Une embolie sans facteur apparent justifie un bilan de cancer limité, pas un scanner systématique.</div></section>
<section class="ilot" id="i26-5"><h2><span class="n">5</span>Anamnèse ciblée</h2>
<p>L’anamnèse poursuit trois buts : estimer la probabilité d’embolie, détecter un diagnostic concurrent dangereux et préparer la sécurité du traitement. Les facteurs de risque (section 4) et les mécanismes des symptômes (section 3) guident les questions.</p>
<h3>5.1 Antécédents et terrain</h3>
<p>Le médecin interroge d’abord le terrain thrombotique, car chaque réponse positive augmente la probabilité et entre dans les règles de prédiction de la section 7. Il interroge ensuite le terrain hémorragique et les médicaments, car l’anticoagulation commencera souvent avant la confirmation du diagnostic. Les deux cartes suivantes séparent ces deux objectifs.</p>
<div class="two"><div class="card"><h4>Terrain thrombotique et probabilité</h4><ul><li>La <button class="w" data-k="i26-a-chir">chirurgie et l’immobilisation récentes (questions et points des scores)</button> comptent dans le score de Wells et dans le score de Genève.</li><li>Un <button class="w" data-k="i26-a-cancer">cancer actif (questions et conséquences)</button> augmente la probabilité et modifie le choix de l’anticoagulant.</li><li>Un <button class="w" data-k="i26-a-vte">antécédent de thrombose ou d’embolie (documentation)</button> figure dans tous les scores et pèse sur la durée du traitement.</li><li>La <button class="w" data-k="i26-a-oes">prise d’œstrogènes, une grossesse ou un post-partum (questions)</button> orientent le diagnostic et le choix du traitement.</li><li>Une <button class="w" data-k="i26-a-cardio">maladie cardiaque récente (hospitalisation, infarctus, arythmie)</button> constitue un facteur fort souvent oublié.</li><li>Une <button class="w" data-k="i26-a-thrombo">thrombophilie ou une histoire familiale (questions)</button> se recherche surtout chez le patient jeune sans facteur apparent.</li></ul></div><div class="card"><h4>Sécurité de l’anticoagulation</h4><ul><li>Le <button class="w" data-k="i26-a-bleed">risque hémorragique (facteurs à interroger)</button> se documente avant la première dose.</li><li>Les <button class="w" data-k="i26-a-medic">médicaments en cours (anticoagulant, antiagrégant, interactions)</button> peuvent changer la molécule ou la dose.</li><li>Une maladie rénale ou hépatique connue oriente le choix de la molécule, précisé à la section 11.</li><li>Une allergie au produit de contraste iodé ou une insuffisance rénale sévère orientent vers la scintigraphie plutôt que vers le scanner.</li><li>Les conditions de vie et les souhaits du patient décident de la faisabilité d’un traitement à domicile.</li></ul></div></div>
<div class="key"><b>À retenir.</b> L’interrogatoire recherche en même temps les éléments qui augmentent la probabilité et ceux qui menacent la sécurité du traitement. Une prophylaxie en cours ou récente ne dispense d’aucune de ces questions.</div>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p>Les symptômes de l’embolie ne sont pas spécifiques : chacun se rencontre aussi dans d’autres maladies. Leur fréquence guide pourtant l’interrogatoire. Le tableau suivant utilise la cohorte américaine PIOPED II, qui décrivait des patients à embolie prouvée sans maladie cardiopulmonaire préalable (Stein et collaborateurs, 2007). La première colonne nomme le symptôme ; la deuxième donne sa fréquence ; la troisième rappelle son mécanisme ; la quatrième dit ce que le symptôme change pour la suite.</p>
<table class="t"><tr><th>Symptôme</th><th>Fréquence dans PIOPED II</th><th>Mécanisme</th><th>Ce que le symptôme change</th></tr><tr><td><button class="w" data-k="i26-s-dysp">Dyspnée (début, intensité, orthopnée)</button></td><td>73 % : au repos 55 %, à l’effort seulement 16 % ; orthopnée 28 %</td><td>Déséquilibre ventilation-perfusion, hyperventilation et baisse du débit (section 3).</td><td>C’est le symptôme le plus fréquent ; son absence rend l’embolie moins probable sans l’exclure.</td></tr><tr><td><button class="w" data-k="i26-s-pain">Douleur thoracique (pleurale ou non)</button></td><td>Douleur pleurale 44 % ; douleur non pleurale 19 %</td><td>Irritation pleurale par des emboles distaux ; ischémie probable du ventricule droit dans les formes centrales.</td><td>Elle oriente vers une embolie périphérique et impose d’écarter les autres douleurs graves.</td></tr><tr><td><button class="w" data-k="i26-s-leg">Douleur ou gonflement du mollet ou de la cuisse</button></td><td>Douleur 44 % ; gonflement 41 %</td><td>Thrombose veineuse profonde, source de l’embole.</td><td>Elle entre dans les scores et justifie l’échographie de compression.</td></tr><tr><td><button class="w" data-k="i26-s-toux">Toux et sibilants</button></td><td>Toux 34 %, le plus souvent sèche ; sibilants 21 %</td><td>Symptômes non spécifiques.</td><td>Ils ne doivent pas faire retenir trop vite un asthme ou une bronchite.</td></tr><tr><td><button class="w" data-k="i26-s-hemo">Hémoptysie</button></td><td>Moins fréquente que la douleur pleurale ; toujours de faible abondance</td><td>Hémorragie alvéolaire d’un infarctus pulmonaire.</td><td>Elle entre dans les scores ; une hémoptysie abondante fait chercher une autre cause.</td></tr><tr><td><button class="w" data-k="i26-s-syn">Syncope ou collapsus circulatoire</button></td><td>Collapsus, défini par une perte de connaissance ou une pression systolique ≤ 80 mmHg : 8 %</td><td>Chute brutale du débit par défaillance du ventricule droit.</td><td>C’est un signe de gravité, qui impose la recherche immédiate d’une instabilité.</td></tr></table>
<p>Le lecteur retient d’abord que la dyspnée domine, mais qu’elle manque chez plus d’un patient sur quatre. Il retient ensuite une combinaison. Dans PIOPED II, une dyspnée ou une tachypnée existait chez 84 % des patients, et une dyspnée, une tachypnée ou une douleur pleurale chez 92 %. En ajoutant les signes de thrombose veineuse, 98 % des patients présentaient au moins l’un de ces éléments. La tachypnée, qui est un signe d’examen, est détaillée à la section 6. L’erreur fréquente consiste à écarter l’embolie parce qu’un symptôme « classique » manque. Le mode de début aide aussi. Parmi les patients dyspnéiques, la dyspnée s’était installée en quelques secondes ou minutes chez 72 %. Elle s’était installée sur plusieurs jours chez 17 %.</p>
<div class="key"><b>À retenir.</b> Dyspnée, douleur pleurale et symptômes de jambe sont les symptômes les plus fréquents. Presque tous les patients présentent au moins une dyspnée, une tachypnée, une douleur pleurale ou un signe de thrombose veineuse, mais aucun de ces éléments n’est spécifique.</div>
<h3>5.3 Formes typiques et atypiques</h3>
<p>PIOPED II décrit trois présentations typiques chez les patients sans maladie cardiopulmonaire préalable. L’hémoptysie ou la douleur pleurale concernaient 41 % d’entre eux. La dyspnée isolée en concernait 36 %, et le collapsus circulatoire 8 %. Les autres patients (14 %) avaient une présentation différente. Les cartes suivantes opposent ces formes typiques aux formes trompeuses, que le médecin doit connaître pour ne pas les manquer.</p>
<div class="two"><div class="card"><h4>Formes typiques</h4><p>La forme pleurale associe une douleur thoracique latéralisée, aggravée par l’inspiration, parfois une hémoptysie de faible abondance. Elle traduit des emboles distaux. La forme dyspnéique associe une dyspnée brutale, une tachypnée et une tachycardie, souvent avec une auscultation pauvre. Selon PIOPED II, elle correspond à des embolies plus étendues que la forme pleurale. La forme circulatoire associe une syncope, une hypotension ou un choc ; elle traduit une défaillance du ventricule droit. Un facteur de risque récent et une jambe gonflée complètent souvent le tableau.</p></div><div class="card"><h4>Formes atypiques ou trompeuses</h4><p>Chez le sujet âgé sans maladie cardiopulmonaire, la dyspnée et la tachypnée sont moins fréquentes (PIOPED II). Chez le patient insuffisant cardiaque ou pulmonaire, l’aggravation de la dyspnée habituelle peut être le seul symptôme (ESC/ERS 2019). Une embolie centrale peut donner une douleur de type angineux, probablement par ischémie du ventricule droit, et imiter un syndrome coronarien aigu. Une syncope isolée, une fibrillation auriculaire nouvelle ou une embolie découverte fortuitement sur un scanner fait pour une autre raison sont d’autres présentations. Une fièvre supérieure à 38,5 °C est rare (1 % dans PIOPED II) : elle oriente vers une autre cause sans exclure une embolie associée.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Le médecin attribue une dyspnée à une pneumonie parce que le patient tousse et que la radiographie est anormale. Or une pneumonie et une embolie peuvent coexister, et l’infection est elle-même un facteur de risque de thrombose. Le médecin recherche donc une discordance : une dyspnée plus marquée que ne l’expliquent l’examen et l’image, chez un patient qui porte des facteurs de risque.</div>
<p>La patiente du cas précise son histoire. La dyspnée a débuté brutalement ce matin, au repos. La douleur basithoracique gauche augmente à l’inspiration profonde et à la toux, qui est sèche. Son mollet droit est gonflé et douloureux depuis deux jours ; elle l’attribuait à l’opération. Elle a reçu une prophylaxie médicamenteuse après l’intervention, arrêtée il y a quatre jours. Elle n’a ni antécédent de thrombose, ni cancer, ni traitement hormonal. Elle est traitée pour une hypertension artérielle et ne prend ni anticoagulant ni antiagrégant. Elle n’a jamais présenté de saignement anormal et vit avec son mari.</p>
<div class="key"><b>À retenir.</b> La patiente présente une forme typique : dyspnée brutale, douleur pleurale et jambe gonflée, dans les suites d’une chirurgie orthopédique majeure. Les formes atypiques concernent surtout le sujet âgé, le patient déjà insuffisant cardiaque ou respiratoire et la syncope isolée.</div></section>
<section class="ilot" id="i26-6"><h2><span class="n">6</span>Examen clinique : la gravité avant la certitude</h2>
<p>L’examen commence par l’état général et les constantes vitales, puis précise l’anthropométrie et les signes ciblés. La gravité se mesure d’abord : un patient instable ne peut pas attendre la confirmation du diagnostic. Les autres observations alimentent les scores de probabilité (section 7) et de pronostic (section 8).</p>
<h3>6.1 État général</h3>
<p>Le médecin évalue d’abord l’<button class="w" data-k="i26-x-etat">état général, la conscience et la température (signification)</button>. Il observe la conscience, la capacité à parler en phrases complètes, la coloration et la perfusion de la peau. Une confusion, des marbrures ou une peau froide et moite traduisent une hypoperfusion des organes. Ces signes entrent dans la définition du choc obstructif de l’ESC/ERS 2019. Une altération de l’état mental ajoute 60 points au score PESI. C’est l’item le plus lourd après l’âge, qui est compté en années.</p>
<div class="key"><b>À retenir.</b> Une confusion, des marbrures ou une peau froide signalent une hypoperfusion : elles font passer la gravité avant toute question diagnostique.</div>
<h3>6.2 Constantes vitales</h3>
<p>Les constantes vitales portent les seuils qui changent la décision. Le tableau suivant les rassemble. La première colonne nomme la constante ; la deuxième donne le seuil ; la troisième indique le score ou la recommandation qui l’utilise ; la quatrième explique pourquoi ce seuil compte.</p>
<table class="t"><tr><th>Constante</th><th>Seuil</th><th>Utilisé par</th><th>Pourquoi ce seuil compte</th></tr><tr><td><button class="w" data-k="i26-x-bp">Pression artérielle systolique (mesure et perfusion)</button></td><td>&lt; 90 mmHg persistante, ou chute ≥ 40 mmHg pendant plus de 15 minutes</td><td>Haut risque selon l’ESC/ERS 2019</td><td>Elle signale un débit cardiaque qui s’effondre.</td></tr><tr><td>Pression artérielle systolique</td><td>&lt; 100 mmHg</td><td>sPESI et PESI</td><td>Elle marque un risque de décès précoce accru.</td></tr><tr><td><button class="w" data-k="i26-x-heart">Fréquence cardiaque (rythme et jugulaires)</button></td><td>75 à 94/min (3 points) ; ≥ 95/min (5 points)</td><td>Score de Genève révisé</td><td>La tachycardie compense la baisse du volume d’éjection ; elle augmente la probabilité.</td></tr><tr><td>Fréquence cardiaque</td><td>&gt; 100/min (1,5 point) ; la règle PERC exige &lt; 100/min</td><td>Score de Wells ; règle PERC</td><td>Au-delà de ce seuil, l’embolie ne peut plus être écartée par la règle PERC.</td></tr><tr><td>Fréquence cardiaque</td><td>≥ 110/min</td><td>sPESI et PESI</td><td>Ce seuil marque un risque de décès précoce accru.</td></tr><tr><td><button class="w" data-k="i26-x-oxy">Fréquence respiratoire (mesure)</button></td><td>≥ 20/min ; &gt; 30/min</td><td>Définition de la tachypnée dans PIOPED II ; PESI</td><td>L’hyperventilation reflète le trouble des échanges ; au-delà de 30/min, elle signe la gravité.</td></tr><tr><td>Saturation artérielle en oxygène</td><td>&lt; 90 % ; &gt; 94 %</td><td>sPESI, PESI et indication de l’oxygène (ESC/ERS 2019) ; règle PERC</td><td>Sous 90 %, l’hypoxémie est significative ; au-dessus de 94 %, la saturation compte parmi les critères d’exclusion de la règle PERC.</td></tr><tr><td>Température</td><td>&lt; 36 °C</td><td>PESI</td><td>L’hypothermie est un signe de gravité ; une fièvre supérieure à 38,5 °C est rare dans l’embolie.</td></tr></table>
<p>Le lecteur lit d’abord la première ligne, qui décide de la branche de l’algorithme. Le piège vient ensuite de la multiplicité des seuils de fréquence cardiaque. Le score de Genève révisé utilise 95/min. Le score de Wells et la règle PERC utilisent 100/min. Le sPESI utilise 110/min. Chaque seuil appartient à son score, et le médecin ne les mélange pas. La patiente du cas a une fréquence cardiaque régulière de 104/min et une fréquence respiratoire de 26/min. Sa saturation vaut 91 % en air ambiant, sa pression 118/74 mmHg et sa température 37,6 °C. Elle n’atteint aucun seuil de haut risque. Sa tachycardie dépasse le seuil du score de Wells mais pas celui du sPESI. Sa saturation reste au-dessus de 90 %, et l’oxygène n’est donc pas indiqué selon l’ESC/ERS 2019.</p>
<div class="key"><b>À retenir.</b> Une pression systolique inférieure à 90 mmHg persistante définit l’instabilité ; les autres seuils appartiennent chacun à un score précis. La patiente du cas est tachycarde et tachypnéique, mais stable.</div>
<h3>6.3 Anthropométrie</h3>
<p>Le <button class="w" data-k="i26-x-poids">poids (doses et obésité)</button> se mesure dès que l’état du patient le permet, car plusieurs doses en dépendent. L’énoxaparine curative se dose à 1 mg/kg. L’héparine non fractionnée débute par un bolus de 80 UI/kg. L’altéplase est plafonnée à 1,5 mg/kg sous 65 kg. L’édoxaban passe à 30 mg à 60 kg ou moins. La taille permet de calculer l’indice de masse corporelle, utile au choix de l’anticoagulant en cas d’obésité sévère. Aucune mesure ne retarde pourtant un geste vital. Chez le patient en choc, le médecin utilise un poids estimé, puis il le corrige dès que possible. La patiente du cas pèse 72 kg pour 1,64 m, soit un indice de masse corporelle de 26,8 kg/m².</p>
<h3>6.4 Signes ciblés</h3>
<p>Les signes ciblés cherchent trois choses : la surcharge du cœur droit, la source veineuse et les diagnostics concurrents. Aucun n’est spécifique ; leur valeur vient de leur combinaison et de leur cohérence avec l’histoire. Les deux cartes suivantes les regroupent, avec leur fréquence dans PIOPED II.</p>
<div class="two"><div class="card"><h4>Cœur, poumons et plèvre</h4><ul><li>Les <button class="w" data-k="i26-x-heart">jugulaires turgescentes (technique et interprétation)</button> étaient présentes chez 14 % des patients.</li><li>L’<button class="w" data-k="i26-x-coeur">auscultation cardiaque et les signes du cœur droit (technique et valeur)</button> retrouvaient un éclat de la composante pulmonaire du deuxième bruit chez 15 % des patients. Un soulèvement du ventricule droit était perçu chez 4 %.</li><li>L’<button class="w" data-k="i26-x-lung">auscultation pulmonaire (interprétation)</button> était anormale chez 29 % : crépitants chez 18 %, diminution du murmure vésiculaire chez 17 %.</li></ul></div><div class="card"><h4>Jambes et diagnostics concurrents</h4><ul><li>L’<button class="w" data-k="i26-x-leg">examen des membres inférieurs (technique et piège)</button> montrait des signes de thrombose veineuse chez 47 % des patients.</li><li>Une asymétrie des pouls ou de la pression entre les deux bras fait évoquer une dissection aortique.</li><li>Un tympanisme et un silence auscultatoire d’un seul côté font évoquer un pneumothorax.</li><li>Des jugulaires turgescentes avec des bruits du cœur assourdis font évoquer une tamponnade.</li></ul></div></div>
<p>Chez l’ensemble des patients de PIOPED II, l’association d’un gonflement du mollet et d’une douleur à la palpation des veines profondes existait chez 32 %. Cette association correspond à la définition minimale des « signes cliniques de thrombose veineuse profonde » du score de Wells, qui vaut 3 points. La patiente du cas est consciente et parle en phrases complètes. Ses jugulaires ne sont pas turgescentes en position demi-assise, et les bruits du cœur sont réguliers, sans souffle. Quelques crépitants fins s’entendent à la base gauche. Le mollet droit mesure 3 cm de plus que le gauche, la palpation des veines profondes y est douloureuse, et la cicatrice du genou est propre. La pression est identique aux deux bras.</p>
<div class="trap"><span class="k">Piège</span>Après une chirurgie du genou, la jambe opérée gonfle souvent sans thrombose. Ce gonflement attendu ne doit ni faire écarter une thrombose veineuse, ni la faire affirmer : seule l’échographie de compression tranche.</div>
<div class="alert"><b>Priorité.</b> Certains signes imposent une surveillance continue et une échocardiographie immédiate. Il s’agit d’une pression systolique inférieure à 90 mmHg qui persiste, ou d’une chute d’au moins 40 mmHg durant plus de 15 minutes. Il s’agit aussi de signes d’hypoperfusion, d’une syncope ou d’une hypoxémie sévère. Le médecin appelle alors l’équipe de soins critiques. Un score de probabilité faible ne remplace jamais ces observations, car il estime la probabilité du diagnostic et non la gravité.</div>
<div class="key"><b>À retenir.</b> L’examen commence par la perfusion et les constantes, qui décident de l’urgence. Il se poursuit par les signes du cœur droit, des poumons et des jambes, qui nourrissent les scores. La patiente du cas est stable, tachycarde, tachypnéique et porteuse de signes de thrombose veineuse à droite.</div>
