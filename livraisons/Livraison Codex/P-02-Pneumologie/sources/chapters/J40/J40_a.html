<h1>Bronchite</h1><span class="status">Adulte · formes aiguës et chroniques · rédaction du 07.10.2026 · référentiels NICE NG120 et GOLD 2026</span></div>

<section class="ilot" id="j40-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un adulte consulte pour une toux apparue après un rhume. Les crachats sont devenus verts. Un autre décrit une toux productive depuis plusieurs hivers. <b>La durée, la gravité et la fonction respiratoire orientent davantage que la couleur des sécrétions.</b> La première décision consiste à reconnaître une atteinte bronchique compatible avec une évolution simple, puis à rechercher ce qui impose un autre diagnostic ou une prise en charge urgente.</p><p>Le cours rassemble les formes aiguës et chroniques dans une même démarche. Le lecteur sait distinguer une bronchite d’une pneumonie, documenter un syndrome bronchitique chronique, rechercher une obstruction, choisir les examens utiles et expliquer pourquoi un médicament apporte un bénéfice — ou n’a pas d’indication.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j40-bronche-alveole">Bronche et alvéole (localiser l’atteinte)</button> ; <button class="w" data-justification="1" data-k="j40-chronique-bpco">bronchite chronique et BPCO (distinguer les diagnostics)</button>.</div></section>
<section class="ilot" id="j40-1"><h2><span class="n">1</span>Une bronchite, plusieurs temporalités</h2><p>La <b>bronchite aiguë</b> associe une toux récente à une inflammation des voies aériennes conductrices, souvent au décours d’une infection virale. Une expectoration, une gêne rétrosternale ou des ronchi peuvent l’accompagner. Ces signes ne démontrent ni infection bactérienne ni atteinte alvéolaire. La <b>bronchite chronique</b> est un syndrome de toux productive durable, classiquement présent la plupart des jours pendant au moins trois mois par an, deux années consécutives, après exclusion d’autres causes.</p><table class="t"><tr><th>Code et nom de la leçon</th><th>Aspect développé dans ce cours</th></tr><tr><td><b>J20 — Bronchite aiguë</b></td><td>Épisode récent ; orientation étiologique et exclusion d’une pneumonie. Les sous-codes dépendent de l’agent documenté, jamais de la seule couleur des crachats.</td></tr><tr><td><b>J40 — Bronchite, non précisée comme aiguë ou chronique</b></td><td>Nature temporelle insuffisamment documentée. Clarifier la durée avant de retenir une forme aiguë ou chronique.</td></tr><tr><td><b>J41 — Bronchite chronique simple et mucopurulente</b></td><td>J41.0 — Bronchite chronique simple : expectoration muqueuse ; J41.1 — Bronchite chronique mucopurulente : expectoration muqueuse et purulente ; J41.8 — Bronchite chronique simple et mucopurulente : association des descriptions.</td></tr><tr><td><b>J42 — Bronchite chronique sans précision</b></td><td>Chronicité identifiée, variante non précisée. Compléter l’histoire clinique et rechercher une obstruction ou une autre cause.</td></tr></table><p>Ces libellés appartiennent au catalogue CIM-10-GM employé par cette plateforme. Le regroupement pédagogique ne prouve pas la complétude de la CIM-11. <button class="w" data-justification="1" data-k="j40-chronique-bpco">Une bronchite chronique peut exister sans BPCO (pourquoi la spirométrie compte)</button> ; inversement, une BPCO peut exister sans expectoration chronique.</p><p class="src">Références : <a href="https://meshb.nlm.nih.gov/record/ui?dcmsLinks=true&amp;ui=D029481" target="_blank" rel="noopener">NLM, descripteur Bronchitis, Chronic</a> ; <a href="https://goldcopd.org/wp-content/uploads/2026/01/GOLD-Pocket-Guide-2026-v1.1-20Nov2025_WMV2.pdf" target="_blank" rel="noopener">GOLD 2026, diagnostic</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7052787/" target="_blank" rel="noopener">Oelsner et al., cohorte 2020</a>.</p></section>
<section class="ilot" id="j40-2"><h2><span class="n">2</span>Évolution et risque</h2><p>La bronchite aiguë simple est généralement autolimitée. Une toux peut persister trois à quatre semaines : la disparition du virus et le retour à une sensibilité bronchique normale ne sont pas simultanés. <button class="w" data-justification="1" data-k="j40-toux-postinfectieuse">Une toux résiduelle ne signifie pas un échec antibiotique (mécanisme et limites)</button>. Une aggravation, une dyspnée nouvelle ou une altération importante de l’état général impose une réévaluation sans attendre ce délai.</p><p>La bronchite chronique sans obstruction mérite un suivi : elle peut s’accompagner d’événements respiratoires et d’une dégradation fonctionnelle. Le risque individuel dépend des expositions, des comorbidités et de l’évolution mesurée. Aucun chiffre de prévalence suisse spécifique n’est retenu ici sans source et définition correspondantes.</p><div class="key"><b>À retenir.</b> Une durée encore compatible avec la convalescence rassure seulement si la trajectoire clinique et l’examen le permettent.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/chapter/recommendations" target="_blank" rel="noopener">NICE NG120, évolution et réévaluation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7052787/" target="_blank" rel="noopener">Oelsner et al., cohorte 2020</a>.</p></section>
<section class="ilot" id="j40-3"><h2><span class="n">3</span>Du stimulus bronchique à la toux</h2><p>L’épithélium bronchique constitue une barrière et transporte les sécrétions vers le pharynx. Un virus ou un irritant lèse cette interface ; les médiateurs inflammatoires sensibilisent les afférences de la toux. Le mucus, les débris et l’œdème stimulent ensuite le réflexe. <button class="w" data-justification="1" data-k="j40-toux">La toux expulse les sécrétions (arc réflexe et coût mécanique)</button>, tandis qu’une muqueuse sensibilisée peut continuer à déclencher une toux sèche après l’épisode initial.</p><p>Une exposition répétée à la fumée favorise l’inflammation, l’hypersécrétion et l’altération de la clairance. <button class="w" data-justification="1" data-k="j40-mucus">Un mucus trop concentré est plus difficile à transporter (mucines, eau et cils)</button>. Cette rétention entretient les symptômes. Un rétrécissement bronchique ou une atteinte des petites voies aériennes peut s’y ajouter, mais l’expectoration seule ne démontre pas une obstruction persistante.</p><p><button class="w" data-justification="1" data-k="j40-crachats-verts">Des crachats verts reflètent surtout une réponse neutrophilique (pourquoi ils ne suffisent pas à prescrire)</button>. Une inflammation virale peut aussi recruter des neutrophiles. La couleur doit être interprétée avec le terrain, la gravité et le diagnostic envisagé.</p><div class="key"><b>Conséquence thérapeutique.</b> Un bronchodilatateur agit sur le muscle bronchique ; un antibiotique sur une bactérie sensible. Aucun des deux ne répare automatiquement une muqueuse lésée par un virus.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5706541/" target="_blank" rel="noopener">Kesimer et al., mucines bronchiques, 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19242860/" target="_blank" rel="noopener">Altiner et al., expectoration colorée, 2009</a>.</p></section>
<section class="ilot" id="j40-4"><h2><span class="n">4</span>Expositions et vulnérabilité</h2><p>Rechercher le tabac actif et passif, les poussières ou fumées professionnelles et les irritants domestiques. <button class="w" data-justification="1" data-k="j40-tabac">L’arrêt du tabac réduit une agression bronchique répétée (effet attendu et limites)</button>. Une exposition continue entretient la production de mucus et freine la récupération de la barrière ; elle favorise aussi des maladies que le terme « bronchite » ne doit pas masquer.</p><p>Une maladie cardiorespiratoire, une immunodépression ou une grande fragilité réduisent les réserves ou modifient la réponse à l’infection. <button class="w" data-justification="1" data-k="j40-terrain">Ces terrains abaissent le seuil de réévaluation (pourquoi une présentation modeste peut être trompeuse)</button>. La grossesse et l’âge pédiatrique nécessitent une évaluation et des choix médicamenteux propres ; les posologies de ce cours concernent l’adulte.</p><div class="key"><b>À retenir.</b> Le terrain modifie le risque et la stratégie d’examens ; il ne transforme pas à lui seul une infection virale en infection bactérienne.</div></section>
<section class="ilot" id="j40-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>Préciser le début, la durée, les épisodes antérieurs et l’existence d’une expectoration entre les infections. Demander ce qui a changé : dyspnée, fièvre persistante, douleur thoracique, tolérance de l’effort et autonomie. Une rhinorrhée initiale oriente vers une infection respiratoire ; elle n’exclut pas une complication secondaire.</p><p>Des quintes avec vomissement post-tussif ou un contact compatible font rechercher une <button class="w" data-justification="1" data-k="j40-coqueluche">coqueluche (pourquoi le traitement et la prévention diffèrent)</button>. Une toux nocturne variable avec sifflements suggère un asthme ; des expectorations abondantes répétées orientent vers des bronchiectasies. Interroger sur l’hémoptysie, la perte de poids et les sueurs nocturnes : ces éléments élargissent le diagnostic vers un cancer ou une tuberculose selon le contexte.</p><p>Recenser les médicaments. <button class="w" data-justification="1" data-k="j40-toux-medicamenteuse">Un inhibiteur de l’enzyme de conversion peut provoquer une toux (bradykinine et démarche)</button>. Le lien temporel aide, mais une cause médicamenteuse supposée ne dispense pas d’évaluer les signes d’alarme.</p><div class="key"><b>À retenir.</b> Le récit doit établir une temporalité et une trajectoire, puis identifier les symptômes qui changent la décision.</div></section>
<section class="ilot" id="j40-6"><h2><span class="n">6</span>Examiner pour décider</h2><p>Mesurer la température, la fréquence respiratoire, la fréquence cardiaque et, si les symptômes ou le terrain le justifient, la saturation pulsée. Évaluer l’effort respiratoire, la capacité à parler et l’état mental. <button class="w" data-justification="1" data-k="j40-constantes">Tachypnée et tachycardie signalent une demande accrue ou une réserve réduite (mécanismes et limites)</button>. Elles ne désignent pas, à elles seules, un agent infectieux.</p><p>Auscultation : des <button class="w" data-justification="1" data-k="j40-ronchi">ronchi qui changent après la toux (sécrétions dans les bronches)</button> sont compatibles avec une bronchite ; des <button class="w" data-justification="1" data-k="j40-sifflement">sifflements (rétrécissement et diagnostics possibles)</button> demandent une recherche d’obstruction. Un foyer de crépitants, une diminution localisée du murmure ou des signes de condensation renforcent la suspicion de pneumonie ou d’une autre atteinte localisée.</p><p>Chez l’adulte par ailleurs sain, l’absence de température ≥ 38 °C, de fréquence cardiaque ≥ 100/min, de fréquence respiratoire ≥ 24/min et d’anomalie pulmonaire focale rend la pneumonie moins probable. <button class="w" data-justification="1" data-k="j40-pneumonie">Ce repère ne constitue pas une exclusion absolue (terrain et imagerie)</button>, notamment chez la personne âgée ou immunodéprimée.</p><p class="src">Références : <a href="https://www.cdc.gov/antibiotic-use/hcp/clinical-care/adult-outpatient.html" target="_blank" rel="noopener">CDC, soins ambulatoires de l’adulte</a>.</p><button class="pareto-btn ui" data-k="pareto-j40-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
