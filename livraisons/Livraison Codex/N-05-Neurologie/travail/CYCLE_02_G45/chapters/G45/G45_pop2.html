<template data-pop="g45-energie" data-title="Énergie cellulaire : bases"><p>L’adénosine triphosphate fournit de l’énergie aux transports cellulaires, dont la pompe sodium-potassium. Ces transports maintiennent des différences de concentration qui rendent possibles la transmission et la recapture de neurotransmetteurs. Les astrocytes participent notamment à l’élimination du glutamate extracellulaire.</p><p>Une disponibilité énergétique insuffisante perturbe les gradients, la membrane et les transports. Le glutamate peut alors s’accumuler et participer à une entrée excessive de calcium et à des lésions. Le retour de la fonction ne prouve toutefois pas que toute cellule était intacte ou que la cause vasculaire a disparu. Les modèles cellulaires expliquent une vulnérabilité ; ils ne valident pas, à eux seuls, un médicament protecteur chez l’humain.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7884476/" target="_blank" rel="noopener" data-reference-source="1">Disruption of Glutamate Transport and Homeostasis by Acute Metabolic Stress (2021), Introduction ; transport du glutamate ; pompe sodium-potassium ; réponse au stress énergétique</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a>.</p></template>
<template data-pop="g45-plaquette" data-title="Plaquette et coagulation : cibles distinctes"><p>La figure distingue des signaux plaquettaires : ADP signifie adénosine diphosphate ; ATP, adénosine triphosphate ; cAMP, adénosine monophosphate cyclique ; Ca2+ désigne l’ion calcium ; vWF, le facteur von Willebrand. P2Y12 est le nom du récepteur purinergique visé par le clopidogrel activé. La voie aspirin–PTGS1 correspond à l’effet de l’aspirine sur la cyclo-oxygénase.</p><p>Les autres symboles de la carte sont des noms de protéines ou de métabolites, et non des instructions de prescription : PLA2 désigne une phospholipase A2, AA l’acide arachidonique, TXA2 le thromboxane A2 et ses récepteurs, tandis que les PG désignent des prostaglandines. La coagulation aboutit à la formation de fibrine par un réseau de facteurs distinct ; l’apixaban inhibe le facteur Xa. Bloquer deux étapes différentes peut accroître un risque hémorragique et exige une preuve clinique d’utilité.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://rest.genenames.org/fetch/symbol/PTGS1" target="_blank" rel="noopener" data-reference-source="1">HGNC — nomenclature PTGS1 (Entrée consultée le 14 octobre 2026), Champ name, alias_name et symbol</a> ; <a href="https://rest.genenames.org/fetch/symbol/VWF" target="_blank" rel="noopener" data-reference-source="1">HGNC — nomenclature VWF (Entrée consultée le 14 octobre 2026), Champ name, alias_name et symbol</a> ; <a href="https://rest.genenames.org/fetch/symbol/PLA2G4A" target="_blank" rel="noopener" data-reference-source="1">HGNC — nomenclature PLA2G4A (Entrée consultée le 14 octobre 2026), Champ name, alias_name et symbol</a> ; <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:17489" target="_blank" rel="noopener" data-reference-source="1">EMBL-EBI ChEBI — 3′,5′-cyclic AMP (Entrée consultée le 14 octobre 2026), Nom et synonymes</a>.</p></template>
<template data-pop="g45-reseaux" data-title="Réseaux mnésiques : bases"><p>Le montage sépare deux systèmes. Les voies visuelles expliquent la latéralité d’une perte de champ ; les connexions hippocampiques aident à comprendre un trouble de formation des souvenirs. Leur voisinage dans une même figure ne démontre pas un mécanisme commun.</p><p>Dans le panneau hippocampique, les termes allemands désignent notamment cortex entorhinal, fibres moussues, collatérales de Schaffer, noyaux septaux et corps mamillaires. CA1 et CA3 sont des noms de régions de la corne d’Ammon ; la recommandation sur l’amnésie globale souligne la détection possible de foyers CA1. Une telle lésion ponctuelle doit être interprétée avec le tableau clinique ; d’autres lésions ou des signes atypiques modifient l’évaluation.</p><p>Correspondances littérales du panneau droit : Moosfasern = fibres moussues ; Schaffer-Kollaterale = collatérale de Schaffer ; Septumkerne = noyaux septaux ; Corpora mamillaria = corps mamillaires ; Gyrus Cinguli = gyrus cingulaire ; Entorhinaler Cortex = cortex entorhinal ; Gyrus Dentatus = gyrus denté. Les étiquettes désignent des structures et connexions ; elles ne codent pas un degré de gravité.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="g45-genetique" data-title="Pertinence génétique : indications et limites"><p>Le bilan bernois réserve l’exploration des causes monogéniques à un contexte évocateur : histoire familiale, âge, manifestations associées ou distribution atypique des lésions. Il ne propose pas un test génétique de routine pour chaque épisode focal bref. Un résultat génétique requiert une interprétation spécialisée.</p><p>La pharmacogénétique pose une autre question. Le clopidogrel nécessite une activation métabolique impliquant le CYP2C19 ; certaines variations peuvent réduire la réponse pharmacologique. Sa fiche suisse décrit cette variabilité sans fournir une dose supérieure universellement validée pour prévenir les récidives. Un effet mesuré sur les plaquettes ne prouve pas automatiquement un bénéfice clinique d’une adaptation empirique.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-monographies" data-title="Monographies : mécanisme, essais et FI"><p>Choisir un produit signifie vérifier à la fois la cause à traiter et son information suisse. Les antiagrégants répondent à certaines ischémies non cardioemboliques ; l’apixaban prévient l’embolie dans la fibrillation auriculaire non valvulaire ; l’atorvastatine cible notamment le risque athérosclérotique et lipidique.</p><p>Chaque monographie détaille forme, mécanisme, essais, dose, adaptations et sécurité. Les liens ci-dessous permettent de confronter la décision à la fiche exacte.</p><p><button class="w" data-k="g45-aspirine">Aspirine Cardio : fiche suisse et divergence de dose</button> · <button class="w" data-k="g45-plavix">Plavix : monothérapie et bithérapie précoce hors indication spécifique</button> · <button class="w" data-k="g45-eliquis">Eliquis : indication, dose et adaptations suisses</button> · <button class="w" data-k="g45-sortis">Sortis : efficacité, dose et sécurité musculaire</button></p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-doses" data-title="Doses et durée : tableau du produit exact"><p>Les doses suivantes concernent l’adulte et les produits suisses vérifiés. La prescription précise la stratégie et la durée, au lieu d’assimiler toute dose recommandée à une dose autorisée pour l’AIT.</p><table class="t"><thead><tr><th>Produit et voie orale</th><th>Fiche suisse</th><th>Place clinique et limite</th></tr></thead><tbody><tr><td>Aspirine Cardio, 100 ou 300 mg gastro-résistant</td><td>Après épisode transitoire : 300 mg par jour ou 100 mg trois fois par jour ; comprimé entier au moins 30 minutes avant le repas.</td><td>Berne 2026 : 100 mg par jour en prévention. L’écart de dose est explicite ; la forme gastro-résistante ne devient pas un produit injectable de charge.</td></tr><tr><td>Plavix, 75 ou 300 mg</td><td>75 mg une fois par jour dans ses indications ; début après AVC entre sept jours et six mois dans la population autorisée.</td><td>Berne : charge de clopidogrel de 600 mg puis 75 mg par jour avec aspirine durant trois semaines pour l’AIT à haut risque sélectionné ; usage précoce sans indication AIT spécifique dans la FI lue.</td></tr><tr><td>Eliquis, 2,5 ou 5 mg</td><td>Fibrillation auriculaire non valvulaire : 5 mg deux fois par jour ; 2,5 mg deux fois par jour si au moins deux critères définis.</td><td>Pas de charge de traitement veineux à transposer à cette indication ; durée selon persistance de l’indication et réévaluation.</td></tr><tr><td>Sortis, 10–80 mg</td><td>Début usuel 10 mg par jour, maximum 80 mg ; adaptation après au moins quatre semaines.</td><td>Berne utilise une stratégie intensive, notamment 80 mg, dans le contexte athérosclérotique approprié ; durée préventive réévaluée.</td></tr></tbody></table><p>Le tableau ne fixe pas une dose cible universelle d’anticoagulant ou d’antiagrégant. La monographie complète contient les exclusions et la surveillance qui conditionnent l’emploi.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-interactions" data-title="Interactions dangereuses : mécanisme et conduite"><div class="alert"><p>Associer automatiquement aspirine, clopidogrel et apixaban après un épisode transitoire augmente les effets sur l’hémostase sans fournir une justification étiologique. Toute association exige une indication, une durée et une surveillance explicites.</p></div><p>Avec Plavix, le prescripteur évite les inhibiteurs puissants du CYP2C19, dont oméprazole et ésoméprazole ; sa fiche cite le pantoprazole si un inhibiteur de pompe à protons est nécessaire. Avec Aspirine Cardio, il vérifie les anti-inflammatoires et le méthotrexate ; au moins 15 mg par semaine de méthotrexate constituent une contre-indication d’association dans sa fiche.</p><p>Avec Eliquis, les inhibiteurs puissants du CYP3A4 et de la glycoprotéine P appellent la prudence et une surveillance selon la fiche suisse. Avec Sortis, l’acide fusidique systémique ne doit pas être associé ; la ciclosporine limite la dose d’atorvastatine à 10 mg par jour. Une décision de remplacement se fait avec le prescripteur, après vérification du produit ajouté.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-surveillance" data-title="Surveillance : paramètres et rythme"><p>Le suivi des antithrombotiques recherche saignement, anémie, nouveaux médicaments et changement de fonction rénale ou hépatique. La numération est contrôlée en présence de signes cliniques de saignement ou d’anomalie hématologique ; la fréquence des autres bilans dépend du terrain et de la fiche, sans calendrier identique imposé à tous.</p><p>Pour Sortis, les fonctions hépatiques sont vérifiées avant traitement puis régulièrement. Une élévation persistante supérieure à trois fois la limite supérieure normale demande réduction ou interruption ; la limite du laboratoire accompagne le résultat. Une douleur ou faiblesse musculaire conduit à un examen et à la mesure appropriée des enzymes musculaires, plutôt qu’à une attente du prochain contrôle programmé. Les modifications lipidiques sont jugées après un délai adapté, avec ajustements espacés d’au moins quatre semaines selon la FI.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-aspirine" data-title="Aspirine Cardio : monographie suisse"><h3>Produit, mécanisme et place</h3><p>Aspirine Cardio de Bayer, autorisation suisse 51795, contient 100 ou 300 mg d’acide acétylsalicylique par comprimé gastro-résistant. La FI de mars 2026 décrit une inhibition irréversible de la cyclo-oxygénase plaquettaire, réduisant la synthèse du thromboxane. La prévention après accident transitoire est une indication de cette fiche. Les données d’efficacité et la durée sont lues dans ce cadre, sans en déduire une indication pour une amnésie globale transitoire typique.</p><h3>Dose, forme et divergence documentée</h3><p>La FI indique 300 mg par jour ou 100 mg trois fois par jour après un épisode transitoire. Berne 2026 utilise 100 mg par jour en prévention : cet écart entre produit et protocole doit être documenté dans le choix clinique. Le comprimé gastro-résistant est avalé entier au moins 30 minutes avant le repas, sans être coupé, mâché ou écrasé. Une dose de charge intraveineuse d’un protocole aigu ne se réalise pas avec cette forme ; aucun produit injectable n’est prescrit par cette monographie.</p><h3>Exclusions et situations particulières</h3><p>La fiche exclut notamment saignement actif, ulcère digestif actif, diathèse hémorragique, hypersensibilité ou réaction respiratoire aux salicylés, insuffisance rénale sévère avec clairance inférieure à 30 mL/min, insuffisance hépatique sévère et troisième trimestre de grossesse. L’association au méthotrexate à au moins 15 mg par semaine est contre-indiquée. La grossesse plus précoce et l’allaitement demandent une décision propre à la dose et à la durée, conformément à la FI.</p><h3>Interactions et surveillance</h3><p>Les anticoagulants et autres antiagrégants augmentent le risque de saignement. L’ibuprofène et le naproxène peuvent gêner l’effet plaquettaire et accroître le risque digestif. Le suivi recherche saignement, intolérance digestive, réactions allergiques et nouvelles associations, avec bilan adapté aux signes et au terrain. L’âge seul n’autorise pas à ignorer la fonction rénale ou les antécédents hémorragiques.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-plavix" data-title="Plavix : monographie suisse et usage précoce"><h3>Produit et mécanisme</h3><p>Plavix de Sanofi, autorisation suisse 54509, existe en comprimés pelliculés de clopidogrel à 75 ou 300 mg. La FI de septembre 2022 décrit un promédicament dont le métabolite actif inhibe le récepteur plaquettaire P2Y12 ; le CYP2C19 participe à son activation. Une diminution pharmacologique de réponse ne définit pas une dose supérieure cliniquement validée pour tous.</p><h3>Essais, population et statut</h3><p>CAPRIE (1996) a comparé 75 mg de clopidogrel à 325 mg d’aspirine chez 19 185 patients avec infarctus myocardique récent, AVC ischémique entre une semaine et six mois ou artériopathie périphérique symptomatique. Le bénéfice global porte sur un critère vasculaire composite ; les sous-groupes ne permettent pas toutes les conclusions séparées. CHANCE (2013) et POINT (2018), analysés dans la recommandation ESO 2021, concernent une stratégie précoce après événement mineur ou transitoire à haut risque. Ils ne sont pas une autorisation suisse spécifique de bithérapie immédiate après AIT.</p><h3>Dose et durée selon la stratégie</h3><p>La dose usuelle autorisée dans les indications vasculaires est 75 mg par jour. La FI ne recommande pas le début dans les sept premiers jours après AVC ischémique, faute de données dans son cadre. À l’inverse, le protocole bernois 2026 utilise, pour l’AIT à haut risque sans sténose symptomatique, sélectionné dans les 24 heures, une charge de clopidogrel de 600 mg puis 75 mg par jour avec aspirine pendant trois semaines. Cette utilisation précoce hors indication AIT spécifique requiert une décision spécialisée et une justification, puis une monothérapie. Il ne faut pas prolonger mécaniquement l’association.</p><h3>Sécurité et adaptations</h3><p>Une hémorragie active ou une insuffisance hépatique sévère sont des contre-indications. L’insuffisance rénale appelle la prudence ; l’âge ne suffit pas à modifier la dose, et l’emploi pédiatrique n’est pas établi. Les inhibiteurs du CYP2C19, notamment oméprazole et ésoméprazole, réduisent l’activation : la FI recommande de les éviter et cite le pantoprazole si une protection gastrique est nécessaire. Toute suspicion de saignement conduit à un bilan approprié ; thrombopénie, hémolyse et signes neurologiques ou rénaux imposent une évaluation urgente. Pendant la grossesse, l’indication doit être indispensable ; il ne faut pas allaiter pendant le traitement.</p><p>Les personnes devant bénéficier d’une revascularisation carotidienne n’étaient pas incluses dans les populations principales de CHANCE et POINT analysées par l’ESO. Les sténoses symptomatiques et les gestes vasculaires suivent donc une stratégie spécialisée, sans appliquer automatiquement la durée générale de trois semaines.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-eliquis" data-title="Eliquis : monographie suisse"><h3>Produit et indication</h3><p>Eliquis de Bristol-Myers Squibb, autorisation suisse 61549, contient 2,5 ou 5 mg d’apixaban par comprimé filmé. La FI d’août 2026 décrit une inhibition directe du facteur Xa et autorise la prévention de l’AVC et de l’embolie systémique chez l’adulte avec fibrillation auriculaire non valvulaire. Cette indication ne s’étend pas automatiquement à une ischémie de mécanisme indéterminé ou à une valve artificielle.</p><h3>Preuve clinique</h3><p>ARISTOTLE (2011) a comparé apixaban et warfarine chez 18 201 patients avec fibrillation auriculaire. La FI rapporte un taux annuel du critère AVC ou embolie systémique de 1,27 % contre 1,60 %, avec rapport des risques instantanés de 0,79 et intervalle à 95 % de 0,66–0,95. Le bénéfice composite comprend notamment moins d’événements hémorragiques ; il ne faut pas présenter toute composante isolée comme également diminuée. Cette preuve ne valide pas l’anticoagulation de toute plainte neurologique transitoire.</p><h3>Dose suisse et adaptations</h3><p>Pour cette indication, la dose est 5 mg deux fois par jour. Elle devient 2,5 mg deux fois par jour si au moins deux critères sont présents : âge ≥80 ans, poids ≤60 kg, créatinine sérique ≥133 µmol/L. La FI suisse ne remplace pas cette règle par une réduction automatique pour la seule clairance de 15–29 mL/min. En dessous de 15 mL/min ou en dialyse, l’utilisation n’est pas recommandée. Une insuffisance hépatique légère ou modérée appelle la prudence sans adaptation automatique ; Child-Pugh C ou maladie hépatique avec coagulopathie et risque hémorragique significatif constituent des contre-indications.</p><h3>Surveillance et interactions</h3><p>Une hémorragie active exclut le traitement. Les fonctions rénale et hépatique, le poids, l’observance et les nouveaux médicaments sont réévalués selon le contexte. Les inhibiteurs puissants du CYP3A4 et de la glycoprotéine P appellent prudence et surveillance clinique dans la FI suisse ; les inducteurs puissants peuvent réduire l’exposition. Une association à d’autres antithrombotiques ne se fait pas par défaut. La grossesse n’est pas une situation d’emploi recommandée ; la décision entre allaitement et traitement suit la FI. La durée dépend de l’indication persistante et de la réévaluation, sans charge de traitement veineux à transposer.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-sortis" data-title="Sortis : monographie suisse"><h3>Produit, mécanisme et place</h3><p>Sortis de Viatris, autorisation suisse 54085, contient 10, 20, 40 ou 80 mg d’atorvastatine par comprimé pelliculé. La FI d’avril 2025 décrit une inhibition compétitive de la HMG-CoA-réductase, qui diminue la synthèse hépatique du cholestérol et augmente les récepteurs captant les lipoprotéines de basse densité. La stratégie bernoise intensive s’inscrit notamment dans l’athérosclérose symptomatique ; elle n’est pas automatiquement nécessaire pour toute cause, telle qu’une dissection isolée.</p><h3>Essai et limites</h3><p>SPARCL (2006) a comparé 80 mg par jour au placebo chez 4 731 personnes ayant présenté un AVC ou un AIT dans les six mois, sans maladie coronaire connue. La FI rapporte une diminution du critère d’AVC mortel ou non et expose une augmentation des AVC hémorragiques dans une analyse post hoc. Le traitement doit donc être interprété dans sa population et son rapport bénéfice-risque. Le chapitre Propriétés/Effets décrivant un essai ne remplace pas la rubrique Indications du produit.</p><h3>Dose et adaptations</h3><p>La dose initiale usuelle est 10 mg une fois par jour, jusqu’à 80 mg au maximum. Les ajustements sont espacés d’au moins quatre semaines. La prise peut avoir lieu avec ou sans repas ; l’insuffisance rénale n’impose pas d’adaptation automatique. Le schéma bernois peut retenir d’emblée une stratégie intensive appropriée, notamment 80 mg. Sortis n’est pas autorisé chez l’enfant et l’adolescent dans la fiche consultée.</p><h3>Sécurité et suivi</h3><p>Maladie hépatique active, élévation persistante inexpliquée des transaminases, myopathie, grossesse et allaitement figurent parmi les exclusions. La fonction hépatique est contrôlée avant traitement puis régulièrement ; une élévation persistante supérieure à trois fois la limite supérieure normale entraîne réduction ou arrêt. Des douleurs ou une faiblesse musculaires appellent une évaluation et des enzymes musculaires selon le contexte. L’acide fusidique systémique ne doit pas être associé. La ciclosporine limite la dose à 10 mg par jour ; d’autres inhibiteurs métaboliques nécessitent une vérification de la FI. La réponse lipidique, la tolérance et l’indication déterminent la poursuite.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-calcul-lipides" data-title="Cible lipidique : calcul depuis les données"><p>Dans l’athérosclérose symptomatique, le protocole bernois recherche notamment un cholestérol porté par les lipoprotéines de basse densité inférieur à 1,4 mmol/L et une baisse d’au moins 50 % par rapport au départ. Ce sont des cibles de prévention, pas les limites de référence d’une population saine.</p><p>Exemple fictif : une concentration initiale de 3,0 mmol/L devient 1,3 mmol/L. La baisse absolue vaut 3,0 − 1,3 = 1,7 mmol/L. La baisse relative vaut (1,7 ÷ 3,0) × 100 = 56,7 %. Les deux objectifs sont donc atteints dans cet exemple. Si le résultat était 1,6 mmol/L, la baisse serait 46,7 % et aucun des deux objectifs ne serait atteint. Cette arithmétique ne décide pas à elle seule de la tolérance ou de la prochaine prescription.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-laboratoire" data-title="Paramètres biologiques : références suisses et calcul de limite"><p>Une valeur de laboratoire se lit avec le prélèvement, la méthode, les unités et la population. Le tableau CHUV daté du 9 juin 2026 conserve un état des intervalles au 16 octobre 2024. Il précise que seul le compte rendu individuel fait foi.</p><table class="t"><thead><tr><th>Paramètre</th><th>Population et matériel</th><th>Intervalle publié</th><th>Condition et portée</th></tr></thead><tbody><tr><td>Glucose veineux</td><td>Plus de 12 ans ; plasma</td><td>3,7–5,6 mmol/L</td><td>La méthode enzymatique est précisée. Le jeûne n’est pas spécifié dans cette table ; il faut le documenter. Cet intervalle n’est pas utilisé comme seuil diagnostique de diabète.</td></tr><tr><td>Glucose artériel ou capillaire</td><td>Plus de 12 ans ; plasma</td><td>3,6–5,8 mmol/L</td><td>Ces lignes ne sont pas une plage universelle de tout lecteur au point de soins.</td></tr><tr><td>Créatinine</td><td>Plus de 15 ans ; plasma</td><td>Femmes : 44–80 µmol/L ; hommes : 62–106 µmol/L</td><td>Le document utilise une méthode de Jaffé cinétique compensée. La concentration n’est pas la clairance ; le seuil posologique d’Eliquis répond à une autre question.</td></tr><tr><td>Alanine aminotransférase</td><td>Plus de 21 ans ; plasma</td><td>Femmes : 9–36 U/L ; hommes : 11–60 U/L</td><td>La méthode du tableau est réalisée à 37 °C avec pyridoxal phosphate. La limite réelle figurant sur le résultat sert au suivi du médicament.</td></tr></tbody></table><p>Un résultat de créatinine de 133 µmol/L ne constitue donc pas une définition universelle d’insuffisance rénale : c’est notamment un critère parmi trois de l’adaptation suisse d’Eliquis. Le médecin vérifie aussi l’évolution et le contexte.</p><p>Pour interpréter « trois fois la limite supérieure », il faut d’abord relever cette limite. Exemple fictif : un laboratoire indique 36 U/L ; trois fois cette valeur font 3 × 36 = 108 U/L. Un résultat de 120 U/L représente 120 ÷ 36 = 3,33 fois la limite. La FI Sortis lie la conduite à une élévation persistante et au contexte clinique ; un calcul isolé ne remplace pas cette appréciation. Si la limite était 60 U/L, le même résultat serait seulement deux fois la limite.</p><p class="src">Sources : <a href="https://www.chuv.ch/fileadmin/sites/dl/documents/DMLP-CCL-LCC-RE-33-0069-V3.pdf" target="_blank" rel="noopener" data-reference-source="1">CHUV — Analyses, intervalles de référence (Document version 2, 09.06.2026 ; état des valeurs au 16.10.2024 ; impression 07.09.2026), p. 1 : alanine aminotransférase ; p. 3 : créatinine ; p. 4 : glucose</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-a01" data-title="Loi de Pareto — Question clinique et priorités"><p class="ratio" data-cover="g45-a01"></p><ul><li>Un déficit focal soudain reste urgent après récupération.</li><li>Le témoin, la fonction perdue et les heures fiables structurent le bilan.</li></ul><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="pareto-g45-a02" data-title="Loi de Pareto — Définition et cadre diagnostique"><p class="ratio" data-cover="g45-a02"></p><ul><li>La récupération clinique et la lésion tissulaire sont deux dimensions différentes.</li><li>Nommer la définition employée évite de mal appliquer les résultats des études.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-a03" data-title="Loi de Pareto — Épidémiologie et risque ultérieur"><p class="ratio" data-cover="g45-a03"></p><ul><li>Un risque exige un événement, un dénominateur et un horizon temporel.</li><li>Une cohorte avant/après ne prédit pas la probabilité individuelle.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-a04" data-title="Loi de Pareto — Territoires vasculaires et tableaux focaux"><p class="ratio" data-cover="g45-a04"></p><ul><li>Les associations de signes orientent le territoire.</li><li>Les symptômes positifs ou négatifs sont des indices, jamais une preuve isolée.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="pareto-g45-a05" data-title="Loi de Pareto — Amaurose fugace et plainte visuelle"><p class="ratio" data-cover="g45-a05"></p><ul><li>La distinction entre œil et champ visuel guide la localisation.</li><li>La perte persistante et les signes d’artérite nécessitent une évaluation urgente.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a>.</p></template>
<template data-pop="pareto-g45-a06" data-title="Loi de Pareto — Amnésie globale transitoire"><p class="ratio" data-cover="g45-a06"></p><ul><li>Une amnésie typique isole principalement la mémoire avec vigilance et identité conservées.</li><li>Les signes atypiques imposent un bilan urgent ; aucune prophylaxie antithrombotique propre n’est démontrée.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10631054/" target="_blank" rel="noopener" data-reference-source="1">Correction de la recommandation Transient Global Amnesia (2023), Correction du nom d’une auteure</a>.</p></template>
<template data-pop="pareto-g45-a07" data-title="Loi de Pareto — Étiologies et diagnostics différentiels"><p class="ratio" data-cover="g45-a07"></p><ul><li>Les causes dangereuses et traitables sont recherchées en priorité.</li><li>Une cause incertaine appelle une documentation et une réévaluation, pas un traitement étiologique inventé.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-a08" data-title="Loi de Pareto — Anamnèse et examen clinique"><p class="ratio" data-cover="g45-a08"></p><ul><li>Le langage, l’articulation, la force, la vision et la coordination sont décrits séparément.</li><li>Dernière normalité, découverte, début observé et récupération ne sont pas interchangeables.</li></ul><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="pareto-g45-a09" data-title="Loi de Pareto — Parcours diagnostique et situations urgentes"><p class="ratio" data-cover="g45-a09"></p><ul><li>Le score ne décide pas seul de l’orientation.</li><li>Lésion, sténose symptomatique, arythmie et conditions réelles de suivi modifient la décision.</li></ul><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="pareto-g45-a10" data-title="Loi de Pareto — Prévention et prise en charge étiologique"><p class="ratio" data-cover="g45-a10"></p><ul><li>La prévention dépend du mécanisme, du délai et du risque hémorragique.</li><li>Les recommandations et les doses autorisées du produit suisse doivent être confrontées explicitement.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-a11" data-title="Loi de Pareto — Suivi et situations particulières"><p class="ratio" data-cover="g45-a11"></p><ul><li>Un calendrier de suivi ne retarde jamais l’évaluation d’une récidive.</li><li>Le terrain et les nouveaux résultats peuvent modifier la stratégie.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-a12" data-title="Loi de Pareto — Critères formels et paramètres clés"><p class="ratio" data-cover="g45-a12"></p><ul><li>Les critères diagnostiques ne sont pas des scores thérapeutiques.</li><li>La conclusion conserve les faits, le cadre utilisé et les incertitudes.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-e01" data-title="Loi de Pareto — Imagerie cérébrale et vasculaire"><p class="ratio" data-cover="g45-e01"></p><ul><li>L’imagerie cérébrale et vasculaire répond à des questions complémentaires.</li><li>Une diffusion négative ne ferme pas le diagnostic d’ischémie transitoire.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-e02" data-title="Loi de Pareto — Explorations cardiaques et étiologiques"><p class="ratio" data-cover="g45-e02"></p><ul><li>Le premier tracé peut manquer une arythmie intermittente.</li><li>Un examen se choisit pour une question et s’interprète dans sa population.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://www.chuv.ch/fileadmin/sites/dl/documents/DMLP-CCL-LCC-RE-33-0069-V3.pdf" target="_blank" rel="noopener" data-reference-source="1">CHUV — Analyses, intervalles de référence (Document version 2, 09.06.2026 ; état des valeurs au 16.10.2024 ; impression 07.09.2026), p. 1 : alanine aminotransférase ; p. 3 : créatinine ; p. 4 : glucose</a>.</p></template>
<template data-pop="pareto-g45-e03" data-title="Loi de Pareto — Synthèse d’interprétation et erreurs"><p class="ratio" data-cover="g45-e03"></p><ul><li>Un résultat négatif possède une portée limitée.</li><li>La concordance anatomique et temporelle précède l’attribution causale.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="pareto-g45-s01" data-title="Loi de Pareto — Anatomie et histologie vasculaires"><p class="ratio" data-cover="g45-s01"></p><ul><li>Paroi, lumière et anastomoses expliquent des mécanismes distincts.</li><li>L’anatomie schématique ne mesure pas la suppléance du patient.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://histology.leeds.ac.uk/home/circulatory/circ_common_str/" target="_blank" rel="noopener" data-reference-source="1">University of Leeds — The Histology Guide, Common structure (Page non datée, consultée le 13 octobre 2026), Tunica intima, media et adventitia</a>.</p></template>
<template data-pop="pareto-g45-s02" data-title="Loi de Pareto — Physiologie de perfusion"><p class="ratio" data-cover="g45-s02"></p><ul><li>Débit, pression et résistance sont des grandeurs différentes.</li><li>Les modèles d’autorégulation n’établissent pas des cibles tensionnelles individuelles.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7884476/" target="_blank" rel="noopener" data-reference-source="1">Disruption of Glutamate Transport and Homeostasis by Acute Metabolic Stress (2021), Introduction ; transport du glutamate ; pompe sodium-potassium ; réponse au stress énergétique</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="pareto-g45-s03" data-title="Loi de Pareto — Biochimie et thrombose"><p class="ratio" data-cover="g45-s03"></p><ul><li>Le manque d’énergie perturbe les gradients et la transmission.</li><li>Plaquettes et coagulation offrent des cibles différentes dont l’association exige une preuve.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7884476/" target="_blank" rel="noopener" data-reference-source="1">Disruption of Glutamate Transport and Homeostasis by Acute Metabolic Stress (2021), Introduction ; transport du glutamate ; pompe sodium-potassium ; réponse au stress énergétique</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-s04" data-title="Loi de Pareto — Réseaux neurologiques et syndromes apparentés"><p class="ratio" data-cover="g45-s04"></p><ul><li>Les réseaux visuels et mnésiques doivent être distingués.</li><li>Une plausibilité génétique ou mécanistique n’est pas une indication systématique.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-p01" data-title="Loi de Pareto — Classes thérapeutiques et produits suisses"><p class="ratio" data-cover="g45-p01"></p><ul><li>La prescription vérifie produit, forme, indication, dose et durée.</li><li>Les divergences entre fiche suisse et protocole sont documentées, notamment pour la bithérapie précoce.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
