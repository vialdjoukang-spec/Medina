<template data-pop="g45-focal" data-title="Déficit focal : définition et exemples"><p>Un déficit focal est une perte de fonction que l’on peut rattacher à une région ou à un réseau neurologique. Une faiblesse d’un côté, une perte d’une moitié du champ visuel ou un trouble du langage en sont des exemples. Une fatigue diffuse isolée ne permet pas la même localisation.</p><p>La précision vient de l’action devenue impossible : lever un bras, nommer un objet, voir une moitié de la scène. La soudaineté et la concordance anatomique rendent une origine vasculaire plausible, mais ne la démontrent pas seules. Après récupération, le témoin peut décrire la fonction perdue que l’examen ne retrouve plus.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-parcours" data-title="Parcours suisse : organisation et limites"><p>En Suisse, un déficit focal soudain persistant ou récidivant appelle le 144. La disparition des symptômes ne supprime pas l’urgence de l’évaluation. Le réseau organise ensuite l’accès à une unité ou à un centre neurovasculaire ; ses contraintes géographiques influencent le transport.</p><p>À Berne, le protocole d’août 2026 distingue un épisode datant de 0–48 heures ou fluctuant, à évaluer immédiatement, un épisode de 2–7 jours, à adresser aux urgences dans les 12 heures, et un épisode de plus de 7 jours, à évaluer par le médecin dans les 24 heures. Ces catégories institutionnelles ne retardent jamais un déficit nouveau ou un signe d’alarme. Une consultation rapide exige aussi l’accès effectif aux examens et un suivi organisé.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-definition" data-title="Définition tissulaire et limites de l’imagerie"><p>La définition tissulaire bernoise décrit une dysfonction focale transitoire sans lésion ischémique correspondante sur la diffusion. Si une lésion concordante existe, la récupération clinique n’efface pas l’infarctus. L’ancienne limite de 24 heures décrit le temps clinique, sans renseigner à elle seule sur le tissu.</p><p>L’imagerie possède néanmoins des limites de délai, de résolution et de localisation. Le médecin ne déduit donc pas d’une diffusion négative que le récit était nécessairement non vasculaire. Il rapproche symptômes, territoire, séquences et délai avant de conclure. Cette nuance évite de confondre une définition avec un test parfait.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-contentieux" data-title="Contentieux entre définitions : passages et arbitrage"><p>Le référentiel bernois de 2026 privilégie une définition tissulaire. La recommandation européenne de 2021 conserve pour ses questions une définition clinique pragmatique : symptômes focaux cérébraux ou oculaires durant moins de 24 heures, présumés ischémiques. Elle motive ce choix par l’accès inégal à l’imagerie et par les populations des études.</p><p>Ces textes répondent donc à des besoins différents. Dans le dossier individuel, écrire « déficit résolu en vingt minutes ; diffusion positive concordante » décrit les deux dimensions sans les opposer artificiellement. Pour appliquer un résultat d’essai, il faut reprendre la population effectivement incluse. Aucune de ces définitions n’autorise à attendre 24 heures avant l’orientation.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-risque" data-title="Incidence et risque absolu : dénominateurs"><p>Le risque absolu est la proportion de personnes qui présentent l’événement pendant une période définie. Dans EXPRESS, cohorte avant/après citée par l’ESO, 32 événements sur 310 patients représentent 32 ÷ 310 × 100 = 10,32 % à 90 jours ; 6 sur 281 représentent 2,14 %.</p><p>La différence observée vaut 10,32 − 2,14 = 8,18 points de pourcentage. La réduction relative brute vaut 8,18 ÷ 10,32 = 0,793, soit environ 79 %. Les deux groupes correspondent à des phases d’organisation différentes, sans répartition aléatoire ; ces calculs décrivent une association observée. Ils ne fournissent ni l’incidence suisse de l’AIT ni la probabilité personnelle de la patiente fictive.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-intervalle" data-title="Intervalles de confiance : lecture raisonnée"><p>Un intervalle de confiance exprime la précision d’une estimation sous les hypothèses de la méthode statistique. L’ESO rapporte pour EXPRESS un rapport de risques instantanés ajusté de 0,20, avec intervalle à 95 % de 0,08 à 0,49. Ce rapport compare l’évolution des événements au cours du suivi ; il ne se confond pas avec la simple division des proportions.</p><p>L’intervalle ne signifie pas que 95 % des patients auront un risque compris entre 8 % et 49 %. Il accompagne l’estimation comparative de l’étude. Une valeur favorable et un intervalle étroit ne corrigent pas automatiquement les limites d’un schéma avant/après. Le lecteur nomme toujours l’événement, le temps, les groupes et le type d’estimation avant de commenter le chiffre.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-territoire" data-title="Localisation antérieure et postérieure"><p>Une faiblesse droite associée à une aphasie suggère un réseau hémisphérique gauche dominant, souvent dans la circulation antérieure. Une diplopie avec dysarthrie et ataxie oriente davantage vers des structures du tronc cérébral ou du cervelet. L’association de signes localise mieux qu’un symptôme isolé.</p><p>Le schéma cortical utilise le jaune pour le territoire antérieur, le rouge pour le moyen et le bleu pour le postérieur. Ses limites sont essentielles : la vue latérale ne montre pas tous les territoires profonds, la dominance varie et les anastomoses modifient les conséquences d’une occlusion. Une perte de connaissance isolée ne suffit pas à conclure à une ischémie vertébrobasilaire.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a>.</p></template>
<template data-pop="g45-positif" data-title="Symptômes négatifs et positifs : limites de la distinction"><p>Un symptôme négatif correspond à une fonction manquante, comme la perte visuelle ou la faiblesse. Un symptôme positif ajoute un phénomène, comme des scintillements, des fourmillements ou des secousses. L’ischémie produit souvent un déficit soudain ; l’aura migraineuse peut associer phénomènes positifs, progression graduelle et déficit secondaire.</p><p>Cette distinction est probabiliste. Une aura peut comporter une perte de champ, et une présentation vasculaire peut être inhabituelle. L’ordre d’apparition, la durée de chaque phénomène et la similitude avec les épisodes antérieurs complètent l’interrogatoire. Une manifestation nouvelle ou discordante requiert une réévaluation, même chez une personne migraineuse connue.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-monoculaire" data-title="Monoculaire ou binoculaire : interrogatoire"><p>La question « un œil ou les deux ? » peut être trompeuse : perdre la moitié gauche de la scène dans les deux yeux est parfois décrit comme une perte de l’œil gauche. Si l’épisode est en cours, la comparaison en couvrant successivement chaque œil aide à préciser cette différence. Après récupération, on demande ce qui restait visible et si le patient a réellement testé chaque œil.</p><p>Sur la figure, optic nerve désigne le nerf optique, optic chiasma le chiasma, lateral geniculate nucleus le corps géniculé latéral et primary visual cortex le cortex visuel primaire. Le trajet explique la différence entre atteinte monoculaire avant le chiasma et perte homonyme rétrochiasmatique. Il ne remplace pas l’examen ophtalmologique.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-fond" data-title="Fond d’œil : signes et limites"><p>L’examen ophtalmologique apprécie notamment l’acuité, le champ visuel et le fond d’œil. Dans une occlusion artérielle rétinienne, un embol visible ou un aspect rétinien ischémique peut orienter fortement ; l’absence de ce signe après un épisode bref n’exclut pas une ischémie transitoire.</p><p>Des éclairs, des corps flottants puis un voile font aussi envisager un décollement rétinien. Une baisse de vision avec douleur et désaturation des couleurs évoque d’autres mécanismes, dont une atteinte du nerf optique. Une céphalée récente avec douleur à la mastication fait rechercher une artérite à cellules géantes. La persistance de la perte visuelle justifie une évaluation urgente, sans attendre l’évolution spontanée.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="g45-memoire" data-title="Mémoire et amnésie : bases"><p>La mémoire antérograde permet d’enregistrer de nouvelles informations ; la mémoire rétrograde concerne des informations antérieures à l’événement. Dans l’amnésie globale transitoire typique, l’incapacité à retenir une réponse explique les questions répétées. L’identité personnelle et la vigilance sont conservées.</p><p>Un patient qui ne trouve pas un mot peut présenter une aphasie plutôt qu’un trouble d’enregistrement. Un patient somnolent ne correspond pas au tableau typique de mémoire isolée. Le témoin et l’examen recherchent donc langage, attention, vigilance et autres fonctions. La recommandation conjointe publiée en 2023 décrit la participation des régions temporales médiales, sans établir un mécanisme causal unique pour chaque épisode.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-amnesie-criteres" data-title="Amnésie transitoire : critères différentiels"><p>La recommandation publiée en 2023 décrit un début aigu, une amnésie antérograde marquée, des questions répétées, une identité et une vigilance préservées, l’absence d’autre déficit cognitif majeur ou focal, et une récupération avant 24 heures. Le tableau dure habituellement de 1 à 24 heures ; des épisodes plus courts existent, ce qui interdit d’utiliser une heure comme exclusion mécanique.</p><p>Une fièvre, une somnolence, une céphalée inhabituelle, un déficit focal ou une récupération incomplète exigent une recherche urgente d’autre cause. Des récidives brèves et fréquentes orientent vers une amnésie épileptique ; un électroencéphalogramme normal ne l’élimine pas. La validité formelle annoncée de cette recommandation s’arrêtait fin 2025 : le cours attribue ces critères à cette version effectivement lue.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-imitateurs" data-title="Imitateurs : tableau discriminant"><p>Le tableau compare des éléments d’orientation. Aucun de ces éléments isolés ne dispense du bilan d’un premier déficit suspect.</p><table class="t"><thead><tr><th>Hypothèse</th><th>Éléments utiles</th><th>Limite</th></tr></thead><tbody><tr><td>Ischémie</td><td>Déficit focal soudain et territoire cohérent.</td><td>Une imagerie négative ne l’exclut pas.</td></tr><tr><td>Aura migraineuse</td><td>Progression graduelle, symptômes positifs puis parfois négatifs ; durée visuelle usuelle de 5–60 minutes.</td><td>Une migraine connue ne protège pas de l’ischémie.</td></tr><tr><td>Crise épileptique</td><td>Phénomène bref stéréotypé, secousses ou trouble de contact selon le réseau.</td><td>Un enregistrement intercritique normal n’exclut pas la cause.</td></tr><tr><td>Trouble métabolique</td><td>Glycémie anormale et contexte compatible.</td><td>Une anomalie peut coexister avec une lésion vasculaire.</td></tr></tbody></table><p>La priorité est d’identifier un diagnostic qui change la prise en charge immédiate, puis de vérifier la concordance de l’ensemble.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-incertaine" data-title="Étiologie incertaine : conduite et réévaluation"><p>Une cause reste incertaine lorsque le bilan n’a pas identifié de mécanisme suffisamment convaincant, ou lorsque plusieurs possibilités coexistent. Ce constat doit être distingué d’un bilan incomplet : une absence de fibrillation au premier tracé n’équivaut pas à une surveillance prolongée négative.</p><p>Le dossier conserve alors le syndrome, les examens réalisés, les questions encore ouvertes et la stratégie de réévaluation. Une plaque incidente n’est pas rendue responsable par défaut, et un anticoagulant n’est pas prescrit à toute suspicion embolique sans indication. La révision du diagnostic devient nécessaire si des symptômes récidivent, si le rythme documente une arythmie ou si une nouvelle donnée contredit la première hypothèse.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-examen" data-title="Examen neurologique focal : technique"><p>Le médecin compare les deux côtés lors du maintien des bras et des jambes, distingue faiblesse et douleur limitante, puis apprécie sensibilité et coordination. Il teste la dénomination, la compréhension et l’articulation séparément : l’aphasie concerne le langage, tandis que la dysarthrie concerne son exécution articulatoire.</p><p>Le champ visuel est évalué œil par œil et par confrontation, en tenant compte de la compréhension et de l’attention. Une extinction à la stimulation simultanée peut traduire un trouble attentionnel. Les signes retrouvés sont datés et comparés à l’état antérieur. Un examen normal après l’épisode n’efface pas un déficit observé auparavant ; la traçabilité du témoin complète l’observation clinique.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-temps" data-title="Anamnèse temporelle : exemple commenté"><p>Exemple fictif : une personne est vue normale à 08 h 00, retrouvée avec une faiblesse à 09 h 00, puis normale à 09 h 20. Le début réel est inconnu entre 08 h 00 et 09 h 00 ; la découverte date de 09 h 00. Écrire « début à 09 h 00 » transformerait une découverte en observation.</p><p>Si un témoin voit au contraire le déficit apparaître à 09 h 10 puis disparaître à 09 h 30, la durée observée est 20 minutes. Les deux situations ne possèdent pas la même certitude temporelle. Il faut aussi relever les récidives et les intervalles de récupération, sans additionner des épisodes distincts pour créer artificiellement une durée continue.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-score" data-title="Score de risque : variables, calcul, population et limites"><p>Le score ABCD2 additionne cinq domaines, de zéro à sept points. Il s’agit d’un outil pronostique, pas d’un critère diagnostique ni d’une autorisation de sortie.</p><table class="t"><thead><tr><th>Domaine</th><th>Attribution</th></tr></thead><tbody><tr><td>Âge</td><td>Au moins 60 ans : 1 point.</td></tr><tr><td>Pression initiale</td><td>Systolique au moins 140 ou diastolique au moins 90 mmHg : 1 point au total.</td></tr><tr><td>Clinique</td><td>Faiblesse unilatérale : 2 ; sinon trouble de parole sans faiblesse : 1.</td></tr><tr><td>Durée</td><td>Au moins 60 minutes : 2 ; de 10 à 59 minutes : 1 ; moins de 10 : 0.</td></tr><tr><td>Diabète</td><td>Présent : 1 point.</td></tr></tbody></table><p>Les alternatives d’un même domaine ne s’additionnent pas. Un score d’au moins 4 sélectionne certaines populations de bithérapie précoce ; le seuil strictement supérieur à 5 du parcours bernois concerne une branche d’hospitalisation. Leur objectif diffère. Une sténose symptomatique, une lésion ou une arythmie peuvent imposer l’hospitalisation indépendamment du total.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-orientation" data-title="Orientation : critères et exclusions"><p>Dans le parcours bernois, un score supérieur à 5, une sténose symptomatique, une lésion de diffusion, un déficit de perfusion, une anomalie biologique majeure ou une fibrillation nouvellement découverte constituent des arguments d’admission. La surveillance initiale est d’au moins 24 heures dans la branche hospitalière.</p><p>Une prise en charge ambulatoire structurée suppose l’accès rapide au même bilan pertinent, une stabilité clinique et un suivi réel. L’ESO ne démontre pas la supériorité universelle d’un lieu d’évaluation ; elle insiste sur la rapidité et déconseille l’emploi isolé d’un score. Les critères ne s’appliquent pas comme une liste permettant d’ignorer une nouvelle aggravation, une dissection ou une infection suspectée.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-antithrombotique" data-title="Choix antithrombotique : justification et limites"><p>Pour un accident transitoire non cardioembolique à haut risque, la recommandation européenne de 2021 soutient une double antiagrégation précoce courte chez les patients sélectionnés ; elle n’étend pas cette proposition aux diagnostics incertains ou à faible risque. L’imagerie et le risque de saignement participent à la sélection.</p><p>Dans sa branche sans sténose symptomatique, le protocole bernois 2026 retient trois semaines d’aspirine et de clopidogrel, puis une monothérapie, dans sa population à risque et délai appropriés. Une fibrillation auriculaire peut conduire à une anticoagulation selon son indication propre. Une association prolongée ou triple nécessite une autre justification explicite, telle qu’une situation interventionnelle particulière. Les doses et le statut suisse exact sont développés dans les monographies ; une recommandation ne modifie pas silencieusement l’autorisation d’un produit.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-carotide" data-title="Intervention vasculaire : critères et décision spécialisée"><p>Une sténose devient pertinente lorsque son côté, son territoire et ses caractéristiques concordent avec l’épisode. Le protocole bernois décrit notamment les sténoses d’au moins 50 % avec lésions typiques sans meilleure cause, ou les plaques rompues avec thrombus apposé, dans l’analyse d’imputabilité.</p><p>Ce repère n’est pas une prescription opératoire universelle. Le degré de sténose, la méthode de mesure, les symptômes, le délai, le terrain et le risque du geste sont discutés dans une équipe spécialisée. L’ESO recommande une confirmation vasculaire appropriée lorsque l’échographie suggère une sténose significative. Le bénéfice attendu et les complications du geste doivent être expliqués au patient avant le choix entre traitements.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-suivi" data-title="Suivi : calendrier justifié"><p>Le réseau bernois propose un contact téléphonique à 10–14 jours, une consultation à trois mois avec réévaluation et imagerie selon son parcours, puis un contrôle du risque à douze mois. Ces rendez-vous ne constituent pas un délai autorisé devant une récidive : un nouveau déficit déclenche immédiatement la filière d’urgence.</p><p>Le suivi vérifie le mécanisme finalement retenu, les résultats différés du rythme, la durée prévue de chaque médicament et ses effets indésirables. Il réévalue pression, lipides, tabagisme, activité et difficultés fonctionnelles. La conduite automobile requiert une appréciation individualisée ; les délais du tableau bernois sont présentés comme recommandations non contraignantes et ne sont pas une autorisation administrative.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-exceptions" data-title="Grossesse et comorbidités : exceptions"><p>La grossesse peut changer les examens et les traitements, sans diminuer l’urgence d’un déficit neurologique. La vérification porte sur la question clinique, la modalité d’imagerie et la fiche du produit effectivement envisagé. Les doses d’un adulte standard ne sont pas automatiquement adaptées à l’enfant.</p><p>Chez une personne âgée, il faut mesurer le poids et vérifier les organes d’élimination au lieu de diminuer toutes les doses par principe. Les seuils d’Eliquis sont propres à la prévention embolique de la fibrillation auriculaire non valvulaire ; ceux d’Aspirine Cardio ou de Sortis répondent à d’autres risques. La polymédication appelle une revue des interactions et une explication de ce qui doit conduire à consulter.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-criteres" data-title="Critères formels : texte applicable"><p>Le diagnostic repose sur un syndrome focal transitoire compatible et l’exclusion raisonnée des autres causes. La version bernoise 2026 précise l’absence de lésion correspondante en diffusion pour l’AIT tissulaire. La version européenne 2021 utilise une définition clinique de moins de 24 heures pour ses recommandations ; il faut nommer ce cadre lorsqu’on applique ses résultats.</p><p>Les critères d’amnésie globale transitoire forment un autre ensemble : mémoire principalement atteinte, identité et vigilance préservées, absence d’autre déficit focal et récupération complète. Un score ABCD2 n’établit aucun de ces diagnostics. Il mesure certains facteurs de risque après une suspicion d’épisode ischémique et ne contient pas toutes les causes dangereuses.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-synthese" data-title="Pareto du raisonnement neurologique"><p>Le raisonnement commence par une description datée de la fonction perdue. Il recherche ensuite une concordance anatomique et les signes imposant l’urgence, puis utilise l’imagerie et le bilan causal pour préciser le mécanisme. La prévention découle de ce mécanisme et du risque, avec vérification du produit suisse.</p><p>Dans la vignette initiale, une faiblesse droite et une aphasie observées pendant vingt minutes restent préoccupantes après récupération. Une diffusion négative ne met pas fin à l’évaluation ; une fibrillation découverte peut changer la stratégie ; une plainte amnésique isolée typique appelle un autre raisonnement. Une synthèse utile conserve ces distinctions au lieu de remplacer le diagnostic par un score ou par un seul examen.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-diffusion" data-title="Diffusion : principe et limites"><p>La diffusion en résonance magnétique renseigne sur le mouvement de l’eau dans les tissus. Une lésion aiguë peut apparaître brillante sur la séquence de diffusion et sombre sur la carte du coefficient apparent de diffusion. La concordance des deux évite de confondre une restriction avec d’autres causes d’hypersignal.</p><p>Dans la synthèse ESO, la proportion de diffusion positive parmi les AIT cliniquement probables est de 34,3 %, avec intervalle à 95 % de 30,5–38,4 %, dans des études fortement hétérogènes. Ce chiffre ne représente pas une sensibilité universelle. Une petite lésion, un territoire postérieur, le délai et la technique influencent la détection. En amnésie globale typique, les petits foyers hippocampiques sont davantage détectés à 24–72 heures, sans que ce délai autorise à différer une imagerie urgente devant une présentation atypique.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-vasculaire" data-title="Imagerie vasculaire : lecture et pièges"><p>L’angiographie par résonance magnétique et l’angiographie tomodensitométrique décrivent les artères et recherchent occlusion, sténose ou signes de dissection. L’échographie fournit d’autres informations, dont les vitesses, mais dépend de l’accès au vaisseau et de l’opérateur. La question clinique détermine la combinaison utile.</p><p>Une sténose doit être décrite avec son siège, son degré et la méthode utilisée. L’ESO recommande une confirmation par une autre modalité adaptée lorsqu’une échographie identifie une sténose d’au moins 50 % dans une situation où le résultat change la prise en charge. La présence d’une anomalie ne prouve pas son imputabilité : le territoire des symptômes et celui de la lésion doivent concorder.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-rythme" data-title="Surveillance du rythme : population et durée"><p>Un électrocardiogramme court peut montrer une fibrillation présente au moment du tracé. Il peut manquer une arythmie intermittente. Le bilan bernois standard mentionne au moins 72 heures d’enregistrement dans son parcours, tandis que le schéma spécifique de l’accident transitoire organise notamment trois périodes de sept jours de Holter.</p><p>Ces durées ne sont pas deux prescriptions à additionner automatiquement pour tout patient. Elles décrivent des modalités du réseau selon l’étape et le bilan déjà réalisé. Le spécialiste précise le dispositif, l’objectif, la durée et qui interprétera le résultat. Un enregistrement négatif réduit certaines possibilités observables pendant cette période ; il n’établit pas à lui seul l’absence définitive de fibrillation.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-performance" data-title="Performance diagnostique : sensibilité et spécificité"><p>La sensibilité est la proportion de résultats positifs parmi les personnes effectivement atteintes dans l’étude. La spécificité est la proportion de résultats négatifs parmi les personnes non atteintes. Ces deux fractions nécessitent une définition de référence de la maladie et une population étudiée ; elles ne sont pas les probabilités finales d’un patient particulier.</p><p>La valeur prédictive d’un résultat dépend aussi de la fréquence de la maladie dans la population examinée et du contexte clinique. L’ESO explique qu’un diagnostic d’AIT sans étalon parfait rend certaines évaluations délicates. Le pourcentage de lésions visibles parmi les cas cliniques ne doit donc pas être renommé « sensibilité » sans vérifier la méthode. Aucun chiffre universel n’est attribué ici au premier tracé cardiaque ou à toute IRM.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-negatif" data-title="Résultat négatif : limites"><p>Un résultat négatif répond à une question limitée. Une tomodensitométrie sans hémorragie visible ne démontre pas que tout symptôme était ischémique ; une diffusion sans lésion ne démontre pas que tout symptôme était bénin. Un tracé sans fibrillation documente le rythme enregistré pendant cette durée.</p><p>Le raisonnement consiste à préciser quelle hypothèse le résultat affaiblit, laquelle il ne teste pas et si un complément est justifié. La cohérence entre récit, territoire et délai reste déterminante. L’incertitude résiduelle doit être visible dans la conclusion, notamment lorsque l’examen est très précoce, le phénomène intermittent ou la lésion attendue petite.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-calcul-score" data-title="Calcul d’un score : exemple intégral"><p>Exemple fictif complet : une personne de 68 ans a une pression initiale de 152/86 mmHg, une faiblesse unilatérale avec aphasie pendant 20 minutes, sans diabète connu. Les variables sont relevées avant le calcul.</p><p>L’âge apporte 1 point. La systolique franchit 140 mmHg : la pression apporte 1 point malgré une diastolique inférieure à 90. La faiblesse apporte 2 points ; l’aphasie n’ajoute pas un troisième point dans le même domaine. La durée de 20 minutes apporte 1 point. L’absence de diabète apporte 0. Ainsi, 1 + 1 + 2 + 1 + 0 = 5 points sur 7.</p><p>Le résultat franchit 4, seuil de certaines populations thérapeutiques étudiées, mais n’est pas supérieur à 5. Il ne suffit pourtant pas pour autoriser une sortie : l’imagerie, les artères, le rythme et les conditions de suivi restent nécessaires. Une valeur inconnue n’est pas remplacée silencieusement par zéro.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-polygone" data-title="Polygone artériel et variantes"><p>Une anastomose relie des voies artérielles. Sur le polygone publié en français, les communicantes antérieure et postérieures relient des segments des circulations carotidienne et vertébrobasilaire. Les symboles A1/A2 et P1/P2 identifient des segments des artères cérébrales antérieures et postérieures.</p><p>Une connexion visible sur le dessin ne garantit pas une suppléance suffisante chez le patient. Son calibre, les variantes, la pression et les autres artères influencent le débit disponible. Le rôle clinique de l’anatomie est donc de formuler une hypothèse de territoire et de suppléance, que les examens du patient viennent préciser. Le schéma n’est pas une angiographie individuelle.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a>.</p></template>
<template data-pop="g45-paroi" data-title="Paroi artérielle : normal et lésion"><p>La couche interne, ou intima, comprend l’endothélium et son support. La couche moyenne, ou média, comporte notamment des cellules musculaires lisses et des éléments élastiques. Le tissu externe, ou adventice, soutient le vaisseau. Leur composition varie avec la taille et le type de vaisseau.</p><p>Dans le dessin publié de plaque, normal artery signifie artère normale, artery wall paroi artérielle et narrowed artery artère rétrécie. L’athérosclérose y réduit la lumière ; une plaque compliquée peut aussi produire un embol. Le dessin enseigne cette relation anatomique sans mesurer une sténose et sans se présenter comme une coupe histologique. Les fonctions endothéliales et musculaires nécessitent une explication physiologique distincte.</p><p class="src">Sources : <a href="https://histology.leeds.ac.uk/home/circulatory/circ_common_str/" target="_blank" rel="noopener" data-reference-source="1">University of Leeds — The Histology Guide, Common structure (Page non datée, consultée le 13 octobre 2026), Tunica intima, media et adventitia</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-perfusion" data-title="Perfusion : grandeurs et unités"><p>Le débit est un volume par unité de temps. Le débit rapporté à une masse cérébrale peut être exprimé en mL/100 g/min. La pression est une force rapportée à une surface, exprimée ici en mmHg. La résistance résume l’opposition à l’écoulement dans un modèle.</p><p>La relation simplifiée est débit = gradient de pression ÷ résistance. Le numérateur est une différence de pression entre amont et aval, pas n’importe quelle pression isolée. Si la résistance augmente et que le gradient ne compense pas, le débit diminue dans ce modèle. Il n’est pas possible de convertir une pression brachiale unique en débit cérébral individuel sans autres informations. Le modèle explique un mécanisme ; il ne fournit pas un seuil thérapeutique de l’AIT.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a>.</p></template>
<template data-pop="g45-autoregulation" data-title="Autorégulation : modèle et limites"><p>L’autorégulation décrit les réponses qui limitent certaines variations de débit lorsque la pression change. La réponse dépend notamment de la vitesse du changement, du tonus musculaire, de l’endothélium et d’autres régulateurs. Les gaz sanguins et l’activité neuronale interviennent simultanément.</p><p>La figure historique montre une région où le débit varie relativement peu malgré des pressions différentes. Les valeurs des axes ne sont pas des seuils validés pour chaque personne et ne deviennent pas des cibles de pression pendant une ischémie. La revue de 2021 discute précisément les limites du plateau classique. Elle ne justifie pas de renoncer systématiquement au traitement d’une hypertension chronique au motif d’une autorégulation supposée décalée.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
