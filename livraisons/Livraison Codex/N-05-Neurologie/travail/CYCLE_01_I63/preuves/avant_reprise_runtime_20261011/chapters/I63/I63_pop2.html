<template data-pop="pareto-i63-path" data-title="Loi de Pareto — Pathologie et prise en charge"><p class="ratio" data-cover="i63-0,i63-1,i63-2,i63-3,i63-4,i63-5,i63-6,i63-7,i63-8,i63-9,i63-10,i63-11,i63-12"></p><ul><li>Un déficit focal aigu impose le 144, l’heure du dernier état normal, la glycémie et l’imagerie urgente ; une régression complète reste urgente.</li><li>L’imagerie distingue hémorragie, infarctus, artère occluse et tissu hypoperfusé. Le NIHSS mesure le déficit, sans remplacer son caractère invalidant.</li><li>La thrombolyse conforme aux produits enseignés concerne la fenêtre ≤4,5 heures ; la thrombectomie et les sélections tardives sont discutées au centre spécialisé. Une thrombolyse indiquée ne retarde pas le geste.</li><li>Les produits et les recommandations sont distingués lorsque les seuils, doses ou indications divergent. Après thrombolyse artérielle, la prévention cérébrale antiagrégante ou anticoagulante attend 24 heures et l’imagerie de contrôle ; l’exception FI d’héparine sous-cutanée pour une autre indication relève du spécialiste.</li><li>Toute aggravation fait rechercher hémorragie, nouvelle ischémie, œdème ou autre cause ; un grand infarctus ou une atteinte cérébelleuse peut nécessiter un avis neurochirurgical.</li><li>La cause détermine antiagrégant, anticoagulation pour fibrillation atriale ou traitement artériel spécialisé. Une bithérapie courte ne devient pas un traitement permanent.</li><li>L’infarctus veineux nécessite une imagerie veineuse et une anticoagulation spécialisée ; une hémorragie de congestion peut modifier l’interprétation habituelle du saignement.</li><li>Les objectifs tensionnels et lipidiques au long cours, l’arrêt du tabac et la réadaptation complètent la prévention ; le rein, le foie et les situations particulières modifient le choix des produits.</li></ul><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 10–21, 24, 32, 34–43 et 51</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Definition, Diagnosis et Anticoagulation in the acute phase</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), AVC : indication, sécurité et surveillance</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), AVC : indication, sécurité et surveillance</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1</a> ; <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Résumé et recommandations</a>.</p></template>
<template data-pop="pareto-i63-exam" data-title="Loi de Pareto — Examens complémentaires"><p class="ratio" data-cover="i63-e-1,i63-e-2,i63-e-3,i63-e-4,i63-e-5"></p><ul><li>L’imagerie cérébrale urgente recherche sang et lésion ; l’angiographie identifie l’occlusion ; la perfusion ou diffusion/FLAIR répond à une sélection spécifique.</li><li>Le mismatch tardif de thrombolyse décrit dans l’Europe 2021 concerne une population et une méthode précises, sans autorisation FI automatique.</li><li>Glycémie, plaquettes, coagulation et fonction rénale répondent à la sécurité ; un INR normal n’exclut pas un anticoagulant oral direct.</li><li>Le bilan causal associe artères et cœur ; une surveillance rythmique prolongée et les examens rares se sélectionnent sur des indices.</li><li>L’évaluation de déglutition guide la sécurité orale ; le temps de découverte et un faible score ne doivent pas fausser les décisions.</li></ul><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 10–14 et 19–23</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1, 4.1 et 9.1</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Pharmacodynamique</a> ; <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11</a>.</p></template>
<template data-pop="pareto-i63-science" data-title="Loi de Pareto — Sciences fondamentales"><p class="ratio" data-cover="i63-s-anat-1,i63-s-phys-1,i63-s-histo-1,i63-s-bioch-1,i63-s-gen-1"></p><ul><li>La carte vasculaire et les réseaux fonctionnels orientent les signes ; l’imagerie vérifie la localisation et l’artère.</li><li>Le déficit de perfusion compromet l’énergie et les gradients ioniques ; la dépolarisation et l’œdème n’autorisent pas une horloge individuelle de nécrose.</li><li>La pression aiguë doit préserver la perfusion sans accroître les complications ; les objectifs changent selon la reperfusion.</li><li>Thrombolyse, antiagrégation, inhibition du facteur Xa et réduction du cholestérol ciblent des mécanismes distincts.</li><li>Les profils familiaux, systémiques ou radiologiques motivent une recherche génétique ciblée, après le bilan usuel.</li></ul><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20–21, 50 et 53–57</a> ; <a href="https://doi.org/10.1002/ana.25147" target="_blank" rel="noopener" data-reference-source="1">Dreier et coll. — Terminal spreading depolarization and electrical silence in death of human cerebral cortex (2018 ; DOI 10.1002/ana.25147), Introduction, discussion et limites</a> ; <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-i63-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="i63-p-1,i63-p-2,i63-p-3,i63-p-4,i63-p-5"></p><ul><li>Actilyse : 0,9 mg/kg, maximum 90 mg, 10 % en bolus puis 60 minutes de perfusion. Metalyse 5000 U : paliers FI adultes, 15 à 25 mg, un bolus ; 60–<70 kg reçoit 17,5 mg.</li><li>La fenêtre FI est ≤4,5 heures ; les divergences de seuils et les utilisations tardives sont identifiées comme décisions spécialisées hors cadre du produit.</li><li>Après thrombolyse artérielle, la prévention cérébrale antithrombotique attend 24 heures et l’imagerie de contrôle ; la FI conserve une exception d’héparine sous-cutanée pour une autre indication, sans anticoagulation thérapeutique de routine. L’angiœdème et l’hémorragie nécessitent une prise en charge urgente.</li><li>La bithérapie antiagrégante européenne concerne une population limitée et 21 jours ; son utilisation précoce diffère de la FI Plavix. La dose bernoise d’aspirine diffère du schéma AIT Aspirine Cardio.</li><li>Eliquis pour fibrillation atriale : 5 mg deux fois/jour, 2,5 mg si au moins deux critères FI ; sa dose et son début après infarctus sont distincts.</li><li>Clexane dans l’infarctus veineux relève du protocole spécialisé ; cause du saignement, rein, plaquettes et divergence clinique/FI sont vérifiés avant le traitement.</li><li>La statine est adaptée à l’athérosclérose et au risque ; les interactions, le foie, le rein et la grossesse sont vérifiés produit par produit.</li></ul><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane, énoxaparine en seringues préremplies (Février 2026), Indications, posologie, sécurité et interactions</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 32 et 34–40</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Anticoagulation in the acute phase</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1</a>.</p></template>
<template data-pop="i63-actilyse" data-title="Actilyse : information professionnelle suisse"><p><b>Produit et place.</b> Actilyse, altéplase 10/20/50 mg, autorisation suisse 48313, FI juin 2025, est indiqué pour l’AVC ischémique chez l’adulte et l’adolescent dès 16 ans, dans les 4,5 heures du dernier état sans symptômes, après exclusion de l’hémorragie. Les présentations d’altéplase destinées à d’autres usages ne sont pas substituées.</p><p><b>Mécanisme et preuve.</b> L’altéplase active le plasminogène en plasmine en présence de fibrine et favorise la dissolution du thrombus. Les recommandations suisses et européennes concluent à une diminution du handicap dans les populations sélectionnées ; le bénéfice diminue avec le délai. Le bénéfice ne signifie pas absence de risque d’hémorragie ni de garantie de récupération individuelle.</p><p><b>Dose.</b> La dose totale est 0,9 mg/kg, maximum 90 mg, avec 10 % en bolus et le reste en perfusion sur 60 minutes. Pour 70 kg : 63 mg au total, 6,3 mg puis 56,7 mg. Le poids réel et la concentration préparée selon FI sont vérifiés ; une formule de dose ne dispense pas de la préparation aseptique du produit exact.</p><p><b>Contre-indications.</b> La FI décrit notamment saignement important actif/récent, suspicion ou antécédent pertinent d’hémorragie intracrânienne, certaines lésions ou interventions intracrâniennes, trauma ou chirurgie récents, hypertension non contrôlée, diathèse hémorragique, endocardite, maladie hépatique sévère et autres lésions exposant au saignement. Pour l’AVC, elle contre-indique notamment INR >1,3 sous anticoagulation efficace, plaquettes &lt;100 ×10⁹/L, un AVC sévère selon ses critères, un exemple de gravité NIHSS >25, ainsi que certains déficits mineurs ou rapidement améliorés. La FI cite un trauma crânien sévère dans les trois mois, une chirurgie importante ou un trauma dans les dix jours, et l’héparine dans les 48 heures avec temps de céphaline activée prolongé. Ces critères temporels restent ceux du produit. La liste complète de la FI est vérifiée par le prescripteur ; cette fenêtre ne la remplace pas.</p><p><b>Divergences.</b> La recommandation européenne soutient le traitement d’un AVC mineur invalidant et certaines sélections tardives ; le protocole bernois utilise un seuil INR >1,7. Ces positions ne sont pas le libellé FI. Un recours hors cadre du produit nécessite une décision spécialisée attribuée et documentée.</p><p><b>Surveillance.</b> La pression est &lt;185/110 mmHg avant et &lt;180/105 mmHg ensuite pendant 24 heures. La neurologie, la respiration et le saignement sont suivis ; les antiagrégants et l’héparine intraveineuse sont évités pendant les premières 24 heures. La FI distingue une héparine sous-cutanée limitée rendue nécessaire par une autre indication, décision spécialisée qui ne signifie pas anticoagulation thérapeutique de routine. Une dégradation impose imagerie et avis urgent ; la perfusion encore active est arrêtée si une complication hémorragique l’exige.</p><p><b>Effets et populations.</b> Une hémorragie intracrânienne ou extracrânienne et un angiœdème peuvent survenir ; les inhibiteurs de l’enzyme de conversion augmentent le risque d’angiœdème. L’âge avancé, les antécédents et la grossesse/allaitement demandent une évaluation individualisée des données limitées. La FI ne fournit pas une réduction rénale improvisée ; une atteinte hépatique sévère peut contre-indiquer le traitement.</p><p><b>Essai décrit dans la FI.</b> L’étude européenne ECASS-III (2008) a randomisé 821 patients dans la fenêtre de 3–4,5 heures, après la sélection de l’étude. Le résultat Rankin 0–1 à 90 jours a été observé chez 52,4 % sous altéplase contre 45,2 % sous placebo ; les hémorragies symptomatiques selon la définition ECASS-III étaient de 2,4 % contre 0,2 %. La population sélectionnée, le moment de mesure et la définition du saignement sont nécessaires à l’interprétation.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Propriétés/Effets, efficacité clinique AVC, paragraphe ECASS-III</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), Bibliographie, référence 78 : année 2008</a>.</p><div class="key"><b>À retenir.</b> Avant administration, la FI complète, l’imagerie et les contre-indications sont contrôlées avec le spécialiste.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indications AVC ; Posologie AVC ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), p. 1–3 : bénéfice et délai</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 9.1 et 3.1 : écarts clinique/FI</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 11 : INR &gt;1,7</a>.</p></template>
<template data-pop="i63-metalyse" data-title="Metalyse 5000 U : ténectéplase AVC"><p><b>Produit.</b> Metalyse 5000 U, 25 mg, autorisation 69958, FI mai 2025, est le produit AVC présenté. Il est indiqué dès 18 ans, dans les 4,5 heures après la dernière heure sans déficit et après exclusion d’hémorragie. La présentation de l’infarctus myocardique n’est pas utilisée comme équivalent.</p><p><b>Mécanisme.</b> La ténectéplase est un activateur tissulaire du plasminogène modifié, avec spécificité pour la fibrine et propriétés permettant un bolus. Elle favorise la formation de plasmine dans le thrombus ; sa durée d’action et son risque de saignement excluent une dose supplémentaire improvisée.</p><p><b>Preuves réellement lues dans la FI.</b> La FI décrit l’essai AcT (2022) : 802 patients du groupe ténectéplase et 765 du groupe altéplase, avec résultat Rankin 0–1 à 90–120 jours chez 36,9 % contre 34,8 % et analyse de non-infériorité selon la marge prédéfinie de cinq points. Elle décrit aussi une étude de 101 patients par groupe avec occlusion de gros vaisseau avant thrombectomie, montrant une reperfusion précoce selon le critère étudié chez 22 % contre 10 %. Ce sont des populations et critères distincts ; les chiffres ne promettent pas une supériorité uniforme sur la mortalité.</p><p><b>Dose produit.</b> La reconstitution FI donne 5 mg/mL. Un bolus sur 5–10 secondes reçoit 15 mg si &lt;60 kg, 17,5 mg si 60–&lt;70 kg, 20 mg si 70–&lt;80 kg, 22,5 mg si 80–&lt;90 kg et 25 mg si ≥90 kg. La dose d’étude nominale 0,25 mg/kg n’est pas substituée aux paliers FI. La valeur bernoise 17 mg pour 3,5 mL est une incohérence identifiée ; la FI donne 17,5 mg.</p><p><b>Sécurité.</b> Hémorragie, hypertension non contrôlée, diathèse ou lésions à risque, anticoagulation efficace avec INR >1,3, maladies hépatiques sévères, endocardite et autres contre-indications sont recherchées dans la FI complète. La thrombopénie &lt;100 ×10⁹/L est décrite comme un risque nécessitant appréciation, à distinguer de la formulation Actilyse. La glycémie &lt;2,8 ou >22,2 mmol/L est corrigée avant traitement.</p><p><b>Surveillance et effets.</b> Les objectifs tensionnels sont &lt;185/110 avant et &lt;180/105 après pendant 24 h. Hémorragie et angiœdème imposent une prise en charge urgente ; les inhibiteurs de l’enzyme de conversion peuvent accroître l’angiœdème. Un bolus déjà administré ne peut pas être « arrêté » comme une perfusion. Les antiagrégants et l’héparine intraveineuse sont évités pendant 24 heures ; la FI conserve une exception d’héparine sous-cutanée limitée pour une autre indication. Cette exception nécessite le spécialiste et ne justifie pas une anticoagulation thérapeutique de routine. Les décisions de prévention cérébrale ensuite utilisent l’imagerie de contrôle.</p><p><b>Grossesse/allaitement.</b> Les données sont limitées ; l’usage est réservé à une nécessité claire après évaluation du risque. La FI prévoit de jeter le lait pendant les 24 premières heures après traitement. Ce cadre ne permet pas une recommandation générale pour toute femme enceinte.</p><div class="key"><b>À retenir.</b> Le prescripteur vérifie l’indication, la présentation 5000 U, le palier de poids et la FI complète.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indications ; Posologie/tableau ; Contre-indications ; Mises en garde ; Grossesse/allaitement ; Propriétés/Effets et efficacité clinique AcT/EXTEND-IA TNK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Expedited recommendation on tenecteplase (2023), Recommandations et bibliographie, référence 21 : dose nominale, sous-populations et année AcT 2022</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 12 : incohérence de dose</a>.</p></template>
<template data-pop="i63-aspirine" data-title="Aspirine Cardio : cadre suisse et utilisation clinique"><p><b>Produit.</b> Aspirine Cardio 100/300 mg, autorisation 51795, FI mars 2026, est une préparation gastro-résistante. La FI prescrit 300 mg/jour pour la prophylaxie des AIT, sous forme de 100 mg trois fois/jour ou 300 mg une fois/jour. Le régime bernois de prévention secondaire à 100 mg/jour est une recommandation clinique distincte ; la FI ne le décrit pas comme indication générique de l’infarctus cérébral.</p><p><b>Mécanisme et preuve.</b> L’acide acétylsalicylique inhibe irréversiblement la production de thromboxane par inhibition de cyclooxygénase plaquettaire. La prévention non cardioembolique et la bithérapie courte sont enseignées selon les recommandations cliniques, avec population, durée et risque hémorragique précisés. Ce produit n’est pas un thrombolytique.</p><p><b>Administration.</b> Le comprimé est avalé avec de l’eau, au moins 30 minutes avant le repas, sans être coupé, mâché ou écrasé. La formulation gastro-résistante n’est pas transformée en charge rapide par broyage. Aucune dose injectable d’un autre produit n’est déduite de cette FI.</p><p><b>Contre-indications et précautions.</b> La FI contre-indique notamment hypersensibilité aux salicylés/anti-inflammatoires avec certains antécédents bronchospastiques, diathèse hémorragique, ulcère ou saignement digestif pertinent, atteintes rénales ou hépatiques sévères, insuffisance cardiaque sévère, méthotrexate ≥15 mg/semaine et troisième trimestre de grossesse. Une clairance &lt;30 mL/min appartient au cadre d’insuffisance rénale sévère de cette FI.</p><p><b>Interactions et suivi.</b> Anticoagulants, clopidogrel, anti-inflammatoires et certains antidépresseurs augmentent le saignement. Ibuprofène, naproxène ou métamizole peuvent perturber l’effet antiagrégant ; le traitement concomitant est revu. Le médecin recherche saignement digestif ou autre, réaction allergique et détérioration rénale selon le contexte.</p><p><b>Grossesse/allaitement.</b> Aux premier et deuxième trimestres, l’usage nécessite une indication claire et une dose/durée minimales ; le troisième trimestre est contre-indiqué dans le produit présenté. L’allaitement nécessite une appréciation individuelle, avec restrictions pour une prise régulière élevée selon FI. Une indication obstétricale d’une autre dose ne s’invente pas à partir de la prophylaxie des AIT.</p><div class="key"><b>À retenir.</b> La dose clinique, la dose autorisée pour l’AIT et la forme galénique doivent être distinguées.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Indications ; Posologie/AIT et administration ; Contre-indications ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34 : aspirine 100 mg/jour</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1 et preuve</a>.</p></template>
<template data-pop="i63-plavix" data-title="Plavix : clopidogrel et emploi précoce"><p><b>Produit et indication.</b> Plavix 75/300 mg, autorisation 54509, FI septembre 2022, indique 75 mg une fois/jour pour la prévention des événements athérothrombotiques après AVC récent entre sept jours et six mois. La FI déconseille l’emploi pendant les sept premiers jours suivant l’AVC. Une utilisation aiguë selon le référentiel européen ou bernois constitue un cadre clinique distinct, à documenter.</p><p><b>Mécanisme.</b> Le clopidogrel nécessite une bioactivation enzymatique, notamment par CYP2C19. Le métabolite actif inhibe irréversiblement la voie ADP–P2Y12, empêchant une partie de l’activation plaquettaire. La variabilité de bioactivation et les interactions peuvent modifier l’efficacité ; aucune adaptation empirique de dose selon une hypothèse génétique n’est enseignée.</p><p><b>Preuve et schémas précoces.</b> La recommandation européenne soutient 21 jours de bithérapie dans la population mineure non cardioembolique sélectionnée et suggère une charge de 300 mg si le patient n’est pas déjà traité. Le protocole bernois utilise 600 mg puis 75 mg/jour. Les doses de charge de syndromes coronariens de la FI ne sont pas présentées comme une autorisation AVC précoce.</p><p><b>Risques et contre-indications.</b> Le saignement actif, l’insuffisance hépatique sévère et l’hypersensibilité sont des contre-indications. La prudence s’applique au risque de saignement et aux atteintes rénales selon le contexte. Un purpura thrombotique thrombocytopénique ou une hémophilie acquise sont des effets rares graves décrits dans la FI ; une anomalie hématologique/coagulation inhabituelle nécessite une évaluation urgente.</p><p><b>Interactions.</b> L’oméprazole et l’ésoméprazole sont évités avec le clopidogrel selon FI ; tous les protecteurs gastriques ne produisent pas la même interaction. Les anticoagulants, anti-inflammatoires et autres médicaments exposant au saignement demandent une revue. Les inducteurs enzymatiques pertinents peuvent également augmenter l’activation et le risque.</p><p><b>Grossesse/allaitement et suivi.</b> L’usage pendant la grossesse est réservé à une nécessité ; l’allaitement n’est pas recommandé pendant le traitement selon la FI. Le patient reçoit une date de passage en monothérapie lorsqu’un schéma court est retenu ; saignement, tolérance et adhésion sont contrôlés.</p><p><b>Essai décrit dans la FI.</b> CAPRIE (1996) a comparé clopidogrel 75 mg/jour et aspirine 325 mg/jour chez 19 185 patients avec infarctus myocardique récent, AVC récent ou artériopathie périphérique. Le critère composite vasculaire était réduit dans l’ensemble de la population ; le sous-groupe inclus pour AVC ne montrait pas une différence statistiquement démontrée. Ce résultat ne valide pas une charge dans les sept premiers jours après AVC.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Propriétés/Effets, efficacité clinique, CAPRIE et analyses de sous-groupes</a> ; <a href="https://europepmc.org/article/MED/8918275" target="_blank" rel="noopener" data-reference-source="1">CAPRIE Steering Committee — A randomised, blinded trial of clopidogrel versus aspirin, notice bibliographique Europe PMC (1996), Notice du rapport, pubYear et première publication</a>.</p><div class="key"><b>À retenir.</b> Le 75 mg quotidien autorisé et la charge aiguë hors cadre FI sont deux informations différentes.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Indications AVC ; Posologie ; Mises en garde/J7 ; Contre-indications ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1 et dose de charge</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34 : charge et durée</a>.</p></template>
<template data-pop="i63-eliquis" data-title="Eliquis : apixaban pour fibrillation atriale"><p><b>Produit et place.</b> Eliquis 2,5/5 mg, autorisation 61549, FI août 2026, prévient AVC et embolie systémique dans la fibrillation atriale non valvulaire selon les conditions du produit. Il inhibe directement le facteur Xa sans cofacteur antithrombine, diminuant la génération de thrombine. Il n’est pas un traitement de reperfusion de l’occlusion cérébrale.</p><p><b>Dose.</b> La dose de fibrillation atriale est 5 mg deux fois/jour ; 2,5 mg deux fois/jour si au moins deux critères sont présents : âge ≥80 ans, poids ≤60 kg, créatinine ≥133 µmol/L. La FI suisse ne prescrit pas automatiquement une réduction au seul motif d’une clairance 15–29 mL/min. Une clairance &lt;15 mL/min ou la dialyse ne relève pas d’une utilisation recommandée. La dose initiale plus élevée de certaines thromboses veineuses n’est pas celle de la fibrillation atriale.</p><p><b>Début après infarctus.</b> Le moment de début dépend de l’étendue, du risque hémorragique et de l’imagerie. Les délais précoces ou au sixième jour décrits dans le protocole bernois concernent des patients sélectionnés ; ils ne font pas partie d’une règle universelle autorisant tout traitement. Une embolie de source indéterminée n’est pas une indication empirique d’apixaban.</p><p><b>Contre-indications et populations.</b> Saignement actif, hypersensibilité et maladie hépatique sévère ou avec coagulopathie pertinente contre-indiquent le produit. La FI ne recommande pas son emploi pour valves artificielles ni dans certains syndromes antiphospholipides. La grossesse n’est pas recommandée ; en allaitement, il faut choisir l’interruption du traitement ou de l’allaitement selon le rapport bénéfice/risque.</p><p><b>Interactions.</b> Les inhibiteurs puissants de CYP3A4 et P-glycoprotéine, notamment certains azolés et ritonavir, peuvent augmenter l’exposition ; la FI suisse demande prudence et surveillance adaptée. Les inducteurs puissants, notamment rifampicine, carbamazépine, phénytoïne, phénobarbital ou millepertuis, peuvent réduire l’exposition. Les associations avec antiagrégants ou anti-inflammatoires augmentent le saignement ; aucun ajout systématique d’aspirine n’est justifié par le seul antécédent d’AVC.</p><p><b>Surveillance et administration.</b> Hémogramme, fonction rénale/hépatique et signes de saignement sont contrôlés selon le contexte. L’INR n’est pas une cible d’efficacité et sa normalité n’exclut pas l’effet. Un dosage anti-Xa calibré peut aider dans certaines urgences. La FI permet un comprimé écrasé selon ses modalités, avec eau ou glucose à 5 % et administration immédiate ; une administration par sonde respecte la préparation décrite, distincte des comprimés gastro-résistants.</p><p><b>Essai décrit dans la FI.</b> ARISTOTLE (2011) a comparé l’apixaban à la warfarine chez 18 201 patients avec fibrillation atriale. Le taux annuel d’AVC ou embolie systémique était de 1,27 % contre 1,60 %. La supériorité du critère composite était surtout liée à la réduction des événements hémorragiques ; les taux concernant les seuls événements ischémiques et embolies systémiques étaient comparables selon la FI. Cette preuve de prévention ne détermine pas à elle seule le jour de début après un infarctus aigu.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Propriétés/Effets, efficacité clinique, ARISTOTLE et tableau 2</a> ; <a href="https://europepmc.org/article/MED/21870978" target="_blank" rel="noopener" data-reference-source="1">Granger et coll. — Apixaban versus warfarin in patients with atrial fibrillation, notice bibliographique Europe PMC (2011), Notice du rapport, pubYear et première publication</a>.</p><div class="key"><b>À retenir.</b> La classe, l’indication, la dose et le début après infarctus sont quatre décisions séparées.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Indications ; Posologie FA et insuffisances ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Pharmacodynamique et administration</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34–35 : début et associations</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Embolie de source indéterminée</a>.</p></template>
<template data-pop="i63-sortis" data-title="Sortis : atorvastatine et prévention"><p><b>Produit.</b> Sortis 10/20/40/80 mg, autorisation 54085, FI avril 2025, traite les dyslipidémies selon le cadre indiqué et prévient certains premiers événements cardiovasculaires chez les sujets à haut risque. La stratégie de prévention secondaire après AVC athéroscléreux est attribuée aux recommandations cliniques ; elle n’est pas présentée comme une formulation générique de la FI.</p><p><b>Mécanisme.</b> L’inhibition compétitive de l’HMG-CoA réductase diminue la synthèse hépatique de cholestérol et augmente les récepteurs LDL, ce qui augmente la captation des particules LDL. La diminution lipidique contribue à la prévention athéroscléreuse ; elle ne dissout pas l’occlusion aiguë.</p><p><b>Dose.</b> La dose initiale habituelle FI est 10 mg une fois/jour, adaptée individuellement, avec titration à intervalles d’au moins quatre semaines et maximum 80 mg/jour. Le protocole bernois cite 80 mg/jour dans certaines stratégies de forte intensité. La cible générale européenne après AVC est LDL &lt;1,8 mmol/L ; le protocole bernois vise &lt;1,4 mmol/L et une baisse ≥50 % dans l’athérosclérose symptomatique très à risque. Aucune adaptation rénale n’est requise par la FI.</p><p><b>Contre-indications et surveillance.</b> Maladie hépatique active, transaminases persistantes >3 fois la limite supérieure de la normale, cholestase, myopathie, grossesse/allaitement et association glécaprévir/pibrentasvir sont contre-indiquées. Le médecin contrôle le foie et recherche douleurs ou faiblesse musculaires ; une élévation significative des créatines kinases ou suspicion de myopathie motive l’interruption selon FI. Le signal hémorragique post hoc de certaines sous-populations de l’étude SPARCL appelle une appréciation individualisée.</p><p><b>Interactions.</b> Macrolides, azolés, ciclosporine et certains traitements antiviraux peuvent augmenter l’exposition et le risque musculaire ; la FI prévoit des doses limites ou une surveillance selon association. La ciclosporine impose de ne pas dépasser 10 mg/jour ; le létermovir seul limite à 20 mg/jour. L’acide fusidique systémique nécessite l’interruption de la statine selon FI, avec reprise possible sept jours après la dernière dose d’acide fusidique. Une consommation excessive de jus de pamplemousse peut augmenter l’exposition ; l’absence de symptômes n’annule pas une interaction.</p><p><b>Essai décrit dans la FI.</b> L’étude SPARCL (2006) de réduction intensive du cholestérol après AVC a comparé atorvastatine 80 mg/jour et placebo chez 4 731 patients ayant eu un AVC ou AIT dans les six mois, sans cardiopathie coronarienne connue. La FI rapporte une réduction du critère AVC mortel ou non, avec un signal hémorragique dans les analyses post hoc. La mortalité toutes causes rapportée par la FI était de 9,1 % sous atorvastatine contre 8,9 % sous placebo ; le bilan individuel tient compte de cette distinction.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Propriétés/Effets, étude Stroke Prevention by Aggressive Reduction in Cholesterol Levels</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Bibliographie, référence 66 : année 2006</a>.</p><div class="key"><b>À retenir.</b> Le bénéfice préventif exige une indication et une intensité tolérable ; les interactions et le foie peuvent imposer une autre stratégie.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Indications ; Posologie ; Contre-indications ; Effets musculaires ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 40 : statine forte intensité et objectifs</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Objectif LDL général</a>.</p></template>
<template data-pop="i63-clexane" data-title="Clexane : énoxaparine et infarctus veineux"><p><b>Produit et cadre.</b> Clexane en seringues préremplies contient de l’énoxaparine sodique ; autorisation 49456, FI suisse février 2026. Les seringues 20–100 mg ont des volumes correspondant à 100 mg/mL, mais certaines présentations plus dosées ont une concentration différente. Clexane multi comporte de l’alcool benzylique et n’est pas confondu avec une seringue préremplie. Les héparines de bas poids moléculaire ne sont pas interchangeables par simple équivalence de volume.</p><p><b>Mécanisme et preuve.</b> L’énoxaparine renforce l’inhibition de la coagulation par l’antithrombine, avec une activité contre le facteur Xa supérieure à celle contre la thrombine. Le traitement limite la propagation et la récidive thrombotique ; il n’est pas présenté comme une thrombolyse artérielle. Le protocole bernois décrit l’énoxaparine dans la thrombose veineuse cérébrale ; le consensus européen préfère souvent cette classe, tout en soulignant la faible certitude de sa comparaison avec l’héparine non fractionnée. Les essais de thrombose des membres inférieurs ou de syndrome coronarien décrits dans la FI ne constituent pas une preuve spécifique d’infarctus veineux cérébral.</p><p><b>Dose attribuée.</b> Le protocole bernois propose 1 mg/kg par voie sous-cutanée deux fois par jour pour cette thrombose. La FI décrit le même régime dans la thrombose veineuse profonde des indications autorisées ; le choix pour la circulation cérébrale reste une décision clinique spécialisée. La FI prévoit 1 mg/kg une fois par jour pour le régime thérapeutique en insuffisance rénale sévère, clairance &lt;30 mL/min. Le consensus conseille d’envisager une autre héparine dans cette situation ; la correction du tableau FI n’est donc pas une autorisation de prescrire ce schéma cérébral sans avis. Il n’y a ni bolus myocardique ni voie intramusculaire dans le régime présenté.</p><div class="alert"><b>Écart clinique/FI à documenter.</b> La FI comporte des contre-indications générales d’AVC, avec son exception pour embolies systémiques, ainsi que d’hémorragie active importante et d’AVC hémorragique récent ; elle n’énonce pas une indication spécifique d’infarctus veineux cérébral. Le protocole bernois et le consensus recommandent au contraire une anticoagulation lorsqu’une hémorragie est due à la congestion veineuse. Ce désaccord ne se résout pas en supprimant la FI : neurologue et spécialiste de l’hémostase attribuent le mécanisme, évaluent les risques et documentent le recours au cadre clinique distinct.</div><p><b>Sécurité et surveillance.</b> Hypersensibilité, endocardite bactérienne aiguë et antécédent de thrombopénie immunitaire induite par héparine dans les 100 jours ou anticorps circulants contre-indiquent le produit. Une numération plaquettaire est faite avant puis régulièrement ; une baisse significative confirmée de 30–50 % impose l’arrêt et un relais spécialisé non héparinique selon FI. Saignement, hémogramme, rein et interventions prévues sont revus. Le temps de céphaline activée ne mesure pas de manière fiable l’activité de l’énoxaparine ; une surveillance adaptée n’est pas remplacée par un temps de céphaline activée normal. Les autres médicaments affectant l’hémostase augmentent le risque et les gestes neuraxiaux imposent des délais propres au produit.</p><p><b>Grossesse, allaitement et foie.</b> Le consensus privilégie la classe des héparines de bas poids moléculaire dans la thrombose veineuse cérébrale de grossesse ou du postpartum, avec gestion multidisciplinaire. La FI réserve l’usage à un besoin clinique réel et décrit des précautions obstétricales ; elle ne recommande pas l’allaitement par précaution avec données limitées. Le consensus considère cette classe compatible avec l’allaitement ; cette position clinique est distinguée de la restriction suisse du produit. L’insuffisance hépatique appelle la prudence ; le flacon multidose et son conservateur ajoutent des précautions propres.</p><div class="key"><b>À retenir.</b> Dans la thrombose veineuse cérébrale, produit, poids, rein, plaquettes, cause du saignement et statut clinique/FI sont contrôlés avant la décision. Cette fenêtre ne prescrit pas l’énoxaparine à tout infarctus.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane, énoxaparine en seringues préremplies (Février 2026), Composition ; Forme pharmaceutique ; Indications ; Posologie et insuffisance rénale ; Contre-indications ; Précautions/TIH, tests de laboratoire et gestes neuraxiaux ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 32 : énoxaparine thérapeutique et hémorragie de congestion</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Anticoagulation in the acute phase : choix, faible certitude et rein ; Contraception and Pregnancy issues : grossesse et allaitement</a>.</p></template>
