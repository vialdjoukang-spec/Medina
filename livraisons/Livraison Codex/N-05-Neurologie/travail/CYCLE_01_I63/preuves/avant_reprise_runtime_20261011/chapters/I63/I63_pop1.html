<template data-pop="i63-ait" data-title="Accident ischémique transitoire : définition et urgence"><p>Un AIT tissulaire correspond à un déficit neurologique focal transitoire sans lésion ischémique en diffusion dans le référentiel bernois 2026. Une lésion concordante en diffusion documente un infarctus malgré la récupération. La définition historique « moins de 24 heures » ne tranche pas ce point tissulaire.</p><p>La récupération n’exclut ni récidive précoce ni mécanisme traitable. La filière suisse prévoit une évaluation urgente, avec imagerie, recherche d’occlusion ou sténose et bilan cardiaque selon contexte. Un score pronostique ne remplace pas cette évaluation.</p><div class="key"><b>À retenir.</b> Un déficit résolu reste une urgence ; le classement dépend de la lésion et du contexte.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 19 : définitions AIT</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : urgence si symptômes transitoires</a>.</p></template>
<template data-pop="i63-heure" data-title="Dernière heure sans déficit"><p>Le témoin précise la dernière fois où la personne avait son état neurologique habituel. L’heure de découverte est consignée séparément. Chez une personne vue normale au coucher puis symptomatique au réveil, le début est inconnu ; le réveil n’est pas un début observé.</p><p>Ce raisonnement détermine le cadre temporel. Les FI des produits de thrombolyse utilisent le dernier moment sans symptômes ; la sélection par imagerie en début inconnu est une décision spécialisée distincte de la fenêtre autorisée.</p><div class="key"><b>À retenir.</b> Un horaire inventé à partir de l’heure de découverte peut exposer à une thrombolyse hors cadre sans justification.</div><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : onset et last seen well</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indication AVC et fenêtre</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indication AVC et fenêtre</a>.</p></template>
<template data-pop="i63-penombre" data-title="Noyau, pénombre et collatérales"><p>Le noyau estimé correspond au volume que la méthode classe comme fortement lésé ; la région hypoperfusée peut être plus vaste. La différence et le rapport de volumes servent à sélectionner certaines populations. Ces valeurs sont des estimations d’imagerie et ne constituent pas une mesure histologique directe de chaque cellule.</p><p>Le débit résiduel, les collatérales et les conditions locales influencent la viabilité. Les critères tardifs d’altéplase européens 2021 associent noyau &lt;70 mL, rapport >1,2 et différence >10 mL, avec méthode précisée et thrombectomie non prévue. Une sélection différente peut être utilisée pour un geste endovasculaire.</p><div class="key"><b>À retenir.</b> La même durée d’évolution n’implique pas le même tissu restant viable.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1 et note des critères</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), Critères tardifs d’imagerie</a> ; <a href="https://doi.org/10.1002/ana.25147" target="_blank" rel="noopener" data-reference-source="1">Dreier et coll. — Terminal spreading depolarization and electrical silence in death of human cerebral cortex (2018 ; DOI 10.1002/ana.25147), Discussion « Terminal SD » : perfusion et réversibilité</a>.</p></template>
<template data-pop="i63-etiologie" data-title="Attribution étiologique de l’infarctus"><p>L’attribution repose sur la distribution des lésions, l’imagerie artérielle, le rythme et l’évaluation cardiaque. Les catégories artérielle, cardioembolique, petites artères, autre cause et indéterminée structurent le bilan. Plusieurs causes plausibles peuvent empêcher une attribution unique.</p><p>Une lésion de plusieurs territoires fait rechercher notamment une source cardiaque, aortique ou systémique. Une petite lésion profonde ne suffit pas à exclure une embolie. Les investigations spécialisées sont guidées par l’âge, les signes et l’histoire ; le résultat doit pouvoir modifier le traitement.</p><div class="key"><b>À retenir.</b> La preuve de la cause est distincte de la preuve de l’infarctus.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20–23 : TOAST/ASCOD et workup</a>.</p></template>
<template data-pop="i63-aphasie" data-title="Aphasie, dysarthrie et examen du langage"><p>L’aphasie est un trouble du langage ; la dysarthrie concerne l’articulation. Le NIHSS distingue les deux domaines : le langage se teste par la description d’une scène, la dénomination, la lecture et la compréhension au cours de l’examen ; l’articulation se juge sur la production de mots.</p><p>Le déficit du bras, la vision, la compréhension et le niveau de conscience peuvent perturber la performance ; ils doivent être pris en compte. Une aphasie empêchant les activités habituelles peut être invalidante malgré un faible score total. L’examen recherche les fonctions associées et la concordance anatomique.</p><div class="key"><b>À retenir.</b> Une parole difficile ne prouve pas une aphasie ; une aphasie peu cotée n’est pas automatiquement sans handicap.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 53 et 62–63 : systèmes fonctionnels, NIHSS langage et dysarthrie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 9.1 : déficit invalidant</a>.</p></template>
<template data-pop="i63-ataxie" data-title="Ataxie : coordination et marche"><p>Le NIHSS examine l’incoordination par les épreuves doigt–nez et talon–genou ; la faiblesse ou un trouble de compréhension peut empêcher l’interprétation. Une ataxie est jugée au-delà de ce que la seule faiblesse explique. Le test n’est pas converti automatiquement en atteinte cérébelleuse lorsque le membre est paralysé.</p><p>Un vertige soudain accompagné d’une impossibilité de marcher ou de signes visuels, moteurs ou du tronc cérébral peut correspondre à un AVC postérieur. L’examen se déroule en sécurité et l’imagerie vasculaire est sélectionnée sans conclure à une cause vestibulaire bénigne sur un score global faible.</p><div class="key"><b>À retenir.</b> La coordination et la sécurité de marche apportent des informations que le déficit du bras ne résume pas.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 62–63 : item ataxie</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : vertige/incapacité de marche et posterior stroke</a>.</p></template>
<template data-pop="i63-negligence" data-title="Négligence et extinction"><p>L’évaluation NIHSS recherche une extinction lors de stimulations simultanées et une inattention dans plusieurs modalités. Une asymétrie peut concerner l’espace, la perception du corps ou l’attention. Elle est confrontée à la vision, à la sensibilité et à la compréhension ; une cécité d’un côté n’est pas automatiquement une extinction.</p><p>Le comportement peut faire sous-estimer le déficit par la personne elle-même. L’examen moteur et les observations des proches complètent donc la parole du patient. La localisation reste vérifiée par l’imagerie.</p><div class="key"><b>À retenir.</b> La négligence est un trouble d’attention observé ; elle ne se réduit pas à une faiblesse ou une perte du champ visuel.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 62–63 : item extinction/inattention et p. 53 : fonctions</a>.</p></template>
<template data-pop="i63-nihss" data-title="NIHSS : score clinique et limites"><p>Le NIHSS comporte onze domaines, avec sous-items : vigilance, questions d’orientation et commandes, regard, champ visuel, face, motricité des deux bras et des deux jambes, ataxie, sensibilité, langage, dysarthrie et extinction/inattention. Les points maximaux additionnés donnent 42 ; le score est répété selon la situation.</p><p>Le tableau détaille quelques tests du NIHSS et leur limite pratique ; la grille complète reste nécessaire pour la cotation.</p><table class="t"><thead><tr><th>Domaine</th><th>Test décrit par le référentiel</th><th>Limite pratique</th></tr></thead><tbody><tr><td>Motricité des bras</td><td>Le maintien est observé pendant 10 secondes, chaque côté séparément.</td><td>La chute, l’effort contre la pesanteur et l’absence de mouvement sont distingués.</td></tr><tr><td>Motricité des jambes</td><td>Le maintien est observé pendant 5 secondes, chaque côté séparément.</td><td>La douleur ou une restriction mécanique sont documentées.</td></tr><tr><td>Langage et articulation</td><td>Compréhension, dénomination/lecture et articulation sont distinguées.</td><td>Un seul total ne décrit pas le handicap.</td></tr><tr><td>Ataxie et extinction</td><td>Coordination et attention sont évaluées selon les instructions de l’item.</td><td>Faiblesse, vision et compréhension changent l’interprétation.</td></tr></tbody></table><p>Le score exige une formation et l’utilisation des consignes complètes. Cette fenêtre explique sa structure ; elle ne remplace pas la fiche de cotation. Les déficits postérieurs et certains handicaps invalidants peuvent être insuffisamment représentés par le total. Un faible score n’exclut pas une prise en charge urgente.</p><div class="key"><b>À retenir.</b> La répétabilité du score sert au suivi ; la décision complète intègre déficit invalidant, territoire et imagerie.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 62–63 : grille NIHSS intégralement lue ; p. 10 : déficit invalidant</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 9.1</a>.</p></template>
<template data-pop="i63-rankin" data-title="Rankin modifiée : autonomie"><p>L’échelle de Rankin modifiée distingue l’absence de symptômes (0), des symptômes sans handicap significatif (1), un handicap léger avec autonomie pour les affaires courantes (2), un handicap modéré nécessitant de l’aide mais marche sans assistance (3), un handicap empêchant la marche sans aide et les soins corporels sans assistance (4), un handicap sévère avec alitement, incontinence et soins permanents (5), et le décès (6).</p><p>Elle mesure l’autonomie globale ; elle ne remplace ni l’examen neurologique détaillé ni l’évaluation cognitive. L’état antérieur est consigné pour interpréter l’évolution. Dans les études, le moment de mesure et la dichotomisation choisie influencent la lecture d’un résultat.</p><div class="key"><b>À retenir.</b> Un résultat de traitement doit préciser l’échelle, le seuil et le moment de suivi.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 61 : Modified Rankin Scale</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Efficacité clinique : AcT, mRS 0–1 à 90–120 jours</a>.</p></template>
<template data-pop="i63-pression" data-title="Pression artérielle : objectifs distincts"><p>Le tableau compare les objectifs aigus et chroniques. Le résultat de la reperfusion et les autres urgences déterminent quelle ligne s’applique.</p><table class="t"><thead><tr><th>Contexte</th><th>Repère actuel vérifié</th><th>Limite</th></tr></thead><tbody><tr><td>Avant thrombolyse</td><td>&lt;185/110 mmHg.</td><td>FI et mise à jour européenne publiée en 2026.</td></tr><tr><td>Après thrombolyse</td><td>&lt;180/105 mmHg, premières 24 h.</td><td>La baisse excessive est évitée.</td></tr><tr><td>Pendant/après thrombectomie</td><td>&lt;180/105 mmHg et pas de chute excessive.</td><td>Après succès, pas d’abaissement actif sous 140 mmHg pendant les 24 h.</td></tr><tr><td>Sans reperfusion</td><td>Pas de baisse systématique si &lt;220/110 mmHg pendant 24 h ; si >220/120 mmHg, consensus pour baisse prudente &lt;15 %.</td><td>Autres urgences ou comorbidités peuvent modifier la conduite ; le traitement n’est pas automatique entre les seuils.</td></tr><tr><td>Prévention au long cours</td><td>Généralement &lt;130/80 mmHg.</td><td>Adaptation à la fragilité, tolérance et perfusion.</td></tr></tbody></table><p>L’actualisation européenne déconseille également la poursuite systématique de tous les anciens antihypertenseurs en phase aiguë. Une dysphagie empêche la poursuite orale jusqu’à sécurisation de la voie. Le protocole et le contexte clinique guident les modifications.</p><div class="key"><b>À retenir.</b> Un objectif chronique ne se copie pas pendant l’ischémie aiguë.</div><p class="src">Références : <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11, PICO 2–6 et consensus</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Précautions tensionnelles</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Précautions tensionnelles</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Objectif tensionnel au long cours</a>.</p></template>
<template data-pop="i63-imagerie" data-title="Lire l’imagerie de l’AVC"><p>La lecture distingue le sang, la lésion, l’occlusion et la perfusion. Le scanner ou la résonance est sélectionné sans retard selon la filière ; l’angiographie examine les artères, et la perfusion ou diffusion/FLAIR répond à la sélection tardive ou au début inconnu.</p><p>Une lésion en diffusion compatible avec le syndrome soutient l’infarctus. Une discordance diffusion/FLAIR peut sélectionner certains patients, sans dater exactement la lésion. L’estimation du noyau et du mismatch utilise les critères et le logiciel du protocole ; un seuil isolé provenant d’un essai ne suffit pas à décider de tous les traitements.</p><div class="key"><b>À retenir.</b> Le médecin demande une réponse explicite à chacune des questions, puis la relie au déficit et au traitement possible.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 7–10 et 19</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1 et 4.1</a>.</p></template>
<template data-pop="i63-deglutition" data-title="Déglutition : sécurité de la voie orale"><p>Une dysphagie, une vigilance réduite, une atteinte faciale ou certaines anomalies neurologiques justifient une évaluation clinique structurée dans le protocole bernois. L’endoscopie fonctionnelle est envisagée notamment en cas de suspicion persistante ou d’atteinte du tronc cérébral.</p><p>L’équipe adapte aliments, liquides, nutrition et médicaments au résultat. Une forme orale ne doit pas être écrasée sans vérification de sa FI : Aspirine Cardio gastro-résistant ne doit pas l’être ; Eliquis peut être écrasé et administré selon les modalités précises de sa FI, y compris par sonde dans certains contextes.</p><div class="key"><b>À retenir.</b> La décision de voie dépend à la fois de la déglutition et de la préparation pharmaceutique.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 14 : GUSS, FEES et nutrition</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Mode d’administration gastro-résistant</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Mode d’administration, écrasement et sonde</a>.</p></template>
<template data-pop="i63-fibrillation" data-title="Rythme et source cardiaque"><p>Une fibrillation atriale documentée peut expliquer une embolie et modifier la prévention. Le protocole bernois associe électrocardiogramme à douze dérivations, au moins 72 heures de surveillance continue et sélection d’un enregistrement plus long selon le risque. Une mesure ponctuelle normale ne suffit pas à exclure un trouble intermittent.</p><p>L’évaluation cardiaque est choisie selon le profil et la distribution des lésions. L’anticoagulation pour fibrillation atriale non valvulaire est distincte du traitement d’une valve mécanique, d’une sténose mitrale rhumatismale ou d’une embolie de source indéterminée. L’apixaban ne doit pas être prescrit simplement parce que la distribution paraît embolique.</p><div class="key"><b>À retenir.</b> La preuve rythmique et l’imagerie causalement cohérente guident le traitement.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 21–23 et 34–35</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Pas d’anticoagulant direct pour embolie de source indéterminée</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Indications FA et valves artificielles</a>.</p></template>
<template data-pop="i63-carotide" data-title="Sténose carotidienne symptomatique"><p>Une sténose est attribuée à l’infarctus lorsqu’elle concorde avec le territoire et qu’une autre cause n’explique pas mieux l’événement. Le protocole bernois décrit la discussion des sténoses symptomatiques à partir de 50 %, avec choix entre traitement médical et geste selon degré, anatomie, risque et situation.</p><p>La décision de revascularisation se prend précocement avec les spécialistes ; le protocole mentionne une réalisation dans les jours suivant l’événement chez les patients retenus. Cela ne signifie pas que toute sténose de 50 % impose une opération. Le traitement lipidique et les facteurs de risque restent nécessaires.</p><div class="key"><b>À retenir.</b> La concordance territoriale et la sélection du patient précèdent la décision de geste.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 24 : symptomatic stenosis, seuil et board ; p. 40 : lipides</a>.</p></template>
<template data-pop="i63-dissection" data-title="Dissection cervicale"><p>Une douleur cervicale, un traumatisme, un syndrome de Horner ou une atteinte artérielle chez un sujet jeune font rechercher une dissection. L’imagerie vasculaire précise l’artère et la lésion ; le diagnostic n’est pas établi par la seule douleur.</p><p>Le protocole bernois discute antiagrégant ou anticoagulation selon le cas et distingue la dissection intracrânienne, où le risque d’hémorragie sous-arachnoïdienne rend l’anticoagulation relativement contre-indiquée. Les décisions spécialisées, les produits et les utilisations hors cadre FI sont documentés individuellement.</p><div class="key"><b>À retenir.</b> La localisation de la dissection modifie le risque ; une stratégie cervicale ne s’applique pas automatiquement à une lésion intracrânienne.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20 et 25 : indices et conduite</a>.</p></template>
<template data-pop="i63-oedeme" data-title="Infarctus malin et décompression"><p>Un grand infarctus peut entraîner un œdème avec effet de masse, altération de vigilance et compression. Le protocole bernois situe la période critique souvent entre 24 et 96 heures et recommande une discussion précoce de craniectomie, parfois dans les 24–48 heures, avant une détérioration majeure.</p><p>La taille, l’âge, le handicap antérieur et le résultat fonctionnel attendu sont discutés individuellement. Chez le patient plus âgé, l’objectif et la dépendance potentielle doivent être explicités. Un infarctus cérébelleux avec hydrocéphalie ou compression du tronc peut nécessiter une décompression urgente avec prise en charge neurochirurgicale.</p><div class="key"><b>À retenir.</b> L’avis précoce vise à anticiper une dégradation ; il ne justifie pas une intervention sur un seuil isolé sans discussion.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 17 : malin MCA et cerebellar infarctions</a>.</p></template>
<template data-pop="i63-reperfusion" data-title="Reperfusion : choisir et attribuer le cadre"><p>La thrombolyse pharmacologique et la thrombectomie endovasculaire visent la restauration du flux. Lorsque les deux sont indiquées, la thrombolyse ne doit pas être différée pendant l’organisation du geste, ni servir de motif pour attendre une amélioration avant le transfert.</p><p>Le cadre FI des produits présentés est de 4,5 heures ; les sélections tardives ou au réveil décrites dans les recommandations cliniques reposent sur une imagerie et des populations spécifiques, et peuvent être hors indication. La thrombectomie peut être retenue en délai tardif sélectionné, avec une décision propre au territoire et au centre.</p><p>L’occlusion basilaire possède un référentiel européen actualisé en 2024 : la gravité et l’extension tissulaire influencent le bénéfice attendu, qui ne se transpose pas uniformément aux NIHSS &lt;10. Un symptôme postérieur reste urgent même si le score paraît faible.</p><div class="key"><b>À retenir.</b> La sélection documente heure, déficit, artère, tissu, produit et contre-indications.</div><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), p. 1–6 : bridging et sélection</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1 et 4.1</a> ; <a href="https://doi.org/10.1177/23969873241257223" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation / ESMINT — Guideline on acute management of basilar artery occlusion (2024), Résumé et recommandations selon gravité</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indications</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indications</a>.</p></template>
<template data-pop="i63-bitherapie" data-title="Bithérapie courte : preuves et population"><p>La recommandation européenne 2021 est forte pour aspirine–clopidogrel 21 jours, puis monothérapie, chez les adultes avec AVC non cardioembolique NIHSS ≤3 ou AIT à haut risque dans les 24 heures, après imagerie. Les essais ne fondent pas un traitement automatique des AIT incertains, des patients à indication d’anticoagulation ou à risque hémorragique reconnu.</p><p>La synthèse de trois essais rapporte une réduction absolue de 2,6 points de pourcentage du risque d’AVC ischémique à 90 jours pour les comparaisons pertinentes, avec les bénéfices surtout au cours des 21 premiers jours. Ce résultat se rapporte à cette population ; il ne prouve pas une réduction équivalente chez tout infarctus sévère ou cardioembolique.</p><p>La charge suggérée de clopidogrel est 300 mg en Europe, tandis que le protocole bernois utilise 600 mg et certains critères élargis. Plavix FI ne recommande pas l’emploi dans les sept premiers jours après AVC : la pratique précoce est attribuée à la recommandation clinique hors cadre FI et requiert une décision spécialisée.</p><div class="key"><b>À retenir.</b> La population, la durée et le statut réglementaire font partie du régime, autant que les doses.</div><p class="src">Références : <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), PICO 1, Recommendation 1, exclusions, charge et bénéfice 21 jours</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34 : régime et critères</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Indications AVC et mise en garde J7</a>.</p></template>
<template data-pop="i63-terrain" data-title="Terrain vasculaire et antécédents"><p>L’hypertension, le diabète, le tabagisme, la dyslipidémie, l’activité physique et les antécédents vasculaires orientent l’évaluation du risque. L’interrogatoire précise les diagnostics réellement posés, les traitements, l’adhésion et les résultats antérieurs ; il ne transforme pas une mesure isolée en histoire médicale confirmée.</p><p>Après l’urgence, le suivi relie la pression et les lipides aux objectifs de prévention, recherche le tabac et les obstacles au traitement, puis adapte la réadaptation. Les objectifs dépendent de la tolérance et du mécanisme de l’infarctus ; le contrôle du terrain ne dispense pas de rechercher une cause cardiaque ou artérielle.</p><div class="key"><b>À retenir.</b> Le terrain contribue au risque ; le mécanisme de l’événement actuel reste à documenter.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20–21 et 38–43 : causes, facteurs, objectifs et suivi</a>.</p></template>
<template data-pop="i63-energie" data-title="Énergie, gradients ioniques et dépolarisation"><p>Le fonctionnement cellulaire dépend du maintien des gradients ioniques. Les mouvements passifs de sodium et calcium vers la cellule et de potassium vers l’extérieur nécessitent une restauration par les pompes alimentées en ATP. L’étude de Dreier décrit l’échec de cette restauration lors de l’ischémie sévère et la dépolarisation massive qui peut suivre.</p><p>La dépolarisation s’associe à des perturbations ioniques, une élévation de glutamate extracellulaire et un œdème cytotoxique. Son début n’identifie pas à lui seul le point d’irréversibilité. Le silence électrique est également ambigu : il peut précéder cette dépolarisation dans les observations étudiées.</p><p>Les données humaines concernent neuf patients en situation de lésions cérébrales graves et d’arrêt terminal de circulation. Elles ne donnent pas la fenêtre individuelle d’un infarctus focal ; les décisions de reperfusion reposent sur les recommandations cliniques et l’imagerie.</p><div class="key"><b>À retenir.</b> Une explication biologique de l’urgence ne remplace pas les critères cliniques de traitement.</div><p class="src">Références : <a href="https://doi.org/10.1002/ana.25147" target="_blank" rel="noopener" data-reference-source="1">Dreier et coll. — Terminal spreading depolarization and electrical silence in death of human cerebral cortex (2018 ; DOI 10.1002/ana.25147), Introduction, discussion « Terminal SD », limitations et conclusion</a>.</p></template>
<template data-pop="i63-veineux" data-title="Infarctus veineux non pyogène : diagnostic et traitement distincts"><p>Une thrombose d’une veine cérébrale ou d’un sinus dural empêche le drainage veineux. Elle peut entraîner une lésion cérébrale, un œdème de congestion ou une hémorragie ; l’infarctus veineux non pyogène est une variante de cette leçon. Toutes les thromboses veineuses n’entraînent pas un infarctus. Une infection associée impose en outre la recherche et le traitement de son foyer ; ce contexte septique ne se résume pas au parcours non pyogène.</p><p>Le consensus publié en 2024 par Weimar et collègues, élaboré avec la participation de la Société suisse de neurologie, compare scanner et résonance avec angiographie veineuse pour la thrombose des sinus. La résonance est meilleure pour certaines veines corticales et préférée chez les sujets jeunes ou pendant la grossesse selon ce référentiel. Un examen artériel seul ne répond donc pas à la question veineuse. Les D-dimères ne sont pas recommandés comme moyen général d’exclure la thrombose ; l’exception d’une céphalée isolée à très faible probabilité relève d’une sélection précise, qui n’est pas celle d’un infarctus constitué.</p><p>Le bilan recherche les facteurs pertinents : hormones œstrogéniques, grossesse ou postpartum, infection, thrombophilie et maladie systémique selon le profil. Le bilan de thrombophilie n’est pas un dépistage automatique de tous les patients ; son résultat doit pouvoir changer la durée ou le type de traitement. Le protocole bernois 2026 et ce consensus décrivent une anticoagulation thérapeutique initiale, même lorsqu’une hémorragie est attribuée à la congestion veineuse. Cette position clinique doit être distinguée des contre-indications générales de la FI Clexane, expliquées dans la fenêtre du produit.</p><p>Les héparines de bas poids moléculaire sont préférées dans de nombreux cas selon le consensus, mais une procédure imminente ou une insuffisance rénale sévère peut modifier la classe retenue. Une anticoagulation orale directe n’est pas proposée comme remplacement automatique dès la phase aiguë : la stabilisation clinique précède le relais. Le régime apixaban de fibrillation atriale enseigné ailleurs ne définit pas celui de cette thrombose.</p><p>Une aggravation malgré anticoagulation adéquate motive un avis neurointerventionnel. Le geste endovasculaire est réservé à certains cas ; l’essai évoqué par le consensus n’a pas démontré de bénéfice uniforme. Une lésion expansive avec menace d’engagement justifie une discussion de décompression urgente. La durée d’anticoagulation dépend du risque de récidive : le protocole bernois décrit généralement 3–6 mois, tandis que le consensus distingue une phase de 3–12 mois et une poursuite si le risque persiste. Une recanalisation incomplète isolée ne justifie pas à elle seule une prolongation indéfinie.</p><div class="key"><b>À retenir.</b> Distinguer le sang par congestion veineuse, l’infarctus artériel et l’hémorragie spontanée change l’examen demandé et le traitement. L’attribution exige l’imagerie et le spécialiste.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 32 : Cerebral venous and sinus thrombosis, anticoagulation, gestes et durée</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Definition ; Preliminary note ; Diagnosis ; Anticoagulation in the acute phase ; Thrombectomy und Thrombolysis ; Intracranial pressure therapy ; Anticoagulation in the maintenance phase</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane, énoxaparine en seringues préremplies (Février 2026), Contre-indications ; Mises en garde et précautions ; Posologie, insuffisance rénale</a>.</p></template>
