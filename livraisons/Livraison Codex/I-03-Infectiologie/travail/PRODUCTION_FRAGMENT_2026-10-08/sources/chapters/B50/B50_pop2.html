<template data-pop="b50-sc-sporozoite" data-title="Sporozoïte : la forme inoculée par le moustique">
  <div class="lab">Entrée</div><p>Une femelle <i>Anopheles</i> infectée inocule des sporozoïtes pendant son repas sanguin. Ceux-ci gagnent le foie et infectent des hépatocytes. Le moustique transmet donc une forme différente de celle qui provoquera plus tard les accès fébriles dans le sang.</p>
  <div class="lab">Conséquence diagnostique</div><p>Les examens sanguins usuels recherchent les formes sanguines ou leurs antigènes, et non le sporozoïte inoculé. Une exposition récente sans parasitémie détectable n’est pas en elle-même un paludisme confirmé. La date et le lieu du séjour guident l’évaluation d’une fièvre ultérieure.</p>
  <p class="refs"><a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Paludisme », transmission et cycle</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, glossaire p. PDF 265</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-hepatique" data-title="Phase hépatique : multiplication avant les symptômes sanguins">
  <div class="lab">Cycle</div><p>Dans l’hépatocyte, le sporozoïte donne un schizonte qui libère des mérozoïtes vers la circulation. Les symptômes usuels apparaissent surtout lorsque les parasites se multiplient ensuite dans les érythrocytes. Une goutte épaisse ne visualise pas directement cette phase hépatique.</p>
  <div class="lab">Distinction entre espèces</div><p><i>P. falciparum</i> ne forme pas les hypnozoïtes hépatiques dormants décrits chez <i>P. vivax</i> et <i>P. ovale</i>. Une nouvelle parasitémie à <i>P. falciparum</i> après traitement demande donc d’examiner notamment recrudescence ou nouvelle infection, sans invoquer une rechute par hypnozoïte. La chronologie et les examens restent nécessaires pour les départager.</p>
  <p class="refs"><a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tableau clinique », phase hépatique</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, glossaire p. PDF 265</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-erythrocyte" data-title="Cycle érythrocytaire : les formes sanguines causent la maladie">
  <div class="lab">Multiplication</div><p>Les mérozoïtes envahissent les globules rouges. Ils deviennent des formes annulaires, puis trophozoïtes et schizontes. La rupture d’un globule rouge parasité libère de nouveaux mérozoïtes qui infectent d’autres cellules. Une partie des parasites se différencie en gamétocytes, repris par un moustique lors d’un autre repas sanguin.</p>
  <div class="lab">Lien avec le prélèvement</div><p>La microscopie sanguine recherche ces formes et permet d’estimer la parasitémie circulante. Chez <i>P. falciparum</i>, les formes mûres peuvent adhérer à la microcirculation et devenir peu représentées sur le frottis périphérique. La valeur du prélèvement doit donc être lue avec l’état clinique.</p>
  <p class="refs"><a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, glossaire p. PDF 265</a> ; <a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0020204" target="_blank" rel="noopener" data-reference-source="1">Dondorp et coll., PLoS Medicine 2005, texte intégral</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-cycle-fievre" data-title="Accès fébrile : rupture sanguine et réponse de l’hôte">
  <div class="lab">Mécanisme</div><p>La multiplication érythrocytaire produit des schizontes dont la rupture libère mérozoïtes et matériel parasitaire. La réponse inflammatoire de l’hôte contribue alors aux frissons et à la fièvre. Le rythme peut devenir périodique quand des cycles se synchronisent, mais <i>P. falciparum</i> donne souvent une fièvre irrégulière, surtout au début.</p>
  <div class="lab">Limite pratique</div><p>Un accès « tous les deux jours » n’est pas requis pour suspecter le paludisme. La fièvre et les frissons ne distinguent pas non plus le paludisme d’une infection bactérienne ou virale. L’exposition et un test parasitologique conduisent à la décision ; le tableau clinique seul n’identifie pas l’espèce.</p>
  <p class="refs"><a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tableau clinique », fièvre et frissons</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, glossaire p. PDF 265</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-pfemp1" data-title="PfEMP1 : une protéine d’adhésion sur le globule rouge parasité">
  <div class="lab">Surface transformée</div><p><i>P. falciparum</i> expose des variantes de la protéine 1 de membrane érythrocytaire, PfEMP1, à la surface du globule rouge infecté. Certaines se fixent à des récepteurs de l’endothélium. Cette interaction retient des cellules parasitées dans de petits vaisseaux au lieu de les laisser circuler librement.</p>
  <div class="lab">Portée de la preuve</div><p>Une étude expérimentale en cellules endothéliales humaines décrit l’adhésion de lignées exprimant différentes variantes PfEMP1. Elle ne calcule pas le risque clinique individuel et ne permet pas de déduire le récepteur d’un frottis de routine.</p>
  <p class="refs"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8831842/" target="_blank" rel="noopener" data-reference-source="1">Étude expérimentale PfEMP1, texte intégral, 2022</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §III p. 6 imprimée</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-sequestration" data-title="Séquestration : la parasitémie périphérique ne voit pas tout">
  <div class="lab">Mécanisme</div><p>Des érythrocytes infectés mûrs adhèrent aux petits vaisseaux et s’y accumulent. Le frottis sanguin mesure surtout les parasites encore circulants ; il sous-estime donc parfois la biomasse totale de <i>P. falciparum</i>. L’adhésion peut perturber le débit local et l’endothélium, mais n’est pas le seul mécanisme de la gravité.</p>
  <div class="lab">Interprétation</div><p>Dans une cohorte historique de 337 adultes hospitalisés en Asie, une estimation de la biomasse totale à partir de la protéine plasmatique riche en histidine 2 de <i>P. falciparum</i>, PfHRP2, était plus élevée dans les formes graves que dans les formes non graves. Ce modèle ne transforme pas un test rapide HRP2 courant en mesure individuelle de biomasse. Une parasitémie circulante faible ne permet pas d’écarter des signes de gravité.</p>
  <p class="refs"><a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0020204" target="_blank" rel="noopener" data-reference-source="1">Dondorp et coll., PLoS Medicine 2005, texte intégral, 337 adultes</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §III p. 6 imprimée</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-anemie" data-title="Anémie : perte de globules rouges parasités et non parasités">
  <div class="lab">Mécanisme</div><p>La rupture des globules rouges infectés réduit directement leur nombre. La rate élimine aussi des cellules infectées et non infectées dont les propriétés ont changé pendant l’inflammation. La production médullaire peut ne pas compenser assez vite ces pertes. Ces voies expliquent pourquoi l’anémie ne se déduit pas d’une parasitémie ponctuelle.</p>
  <div class="lab">Conséquence</div><p>La baisse de l’hémoglobine diminue le transport d’oxygène. Son interprétation dépend de l’âge, du terrain, de la rapidité de chute et des autres causes possibles. Le médecin confronte la numération et les signes de perfusion ; il n’attribue pas automatiquement toute anémie au paludisme.</p>
  <p class="refs"><a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, §5.2.2 p. PDF 215</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-acidose" data-title="Acidose : défaut d’apport d’oxygène et lactate à interpréter">
  <div class="lab">Chaîne causale</div><p>La séquestration peut obstruer la microcirculation ; l’anémie réduit le transport d’oxygène. Des tissus moins bien perfusés peuvent produire davantage de lactate. L’acidose du paludisme grave résulte de plusieurs processus ; un lactate élevé ne mesure pas à lui seul l’adhésion parasitaire.</p>
  <div class="lab">Preuve et décision</div><p>Le guide suisse relie séquestration et dysfonction microcirculatoire à l’hypoperfusion et à l’acidose. L’hypovolémie, les convulsions ou une infection associée peuvent aussi contribuer au lactate. Une valeur élevée demande un bilan immédiat plutôt qu’une attribution unique.</p>
  <p class="refs"><a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §III p. 6 imprimée</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, §5.2.2 p. PDF 212–213</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-cerebral" data-title="Atteinte cérébrale : séquestration et dysfonction neurovasculaire">
  <div class="lab">Mécanisme possible</div><p>Des globules rouges parasités séquestrés peuvent perturber les petits vaisseaux cérébraux. L’activation endothéliale, l’inflammation et une altération de la barrière vasculaire peuvent s’ajouter au défaut local de perfusion. Ces mécanismes restent des contributions possibles, et non une preuve clinique tirée du frottis périphérique.</p>
  <div class="lab">Portée clinique</div><p>Une confusion, des convulsions ou une baisse de vigilance exigent une évaluation urgente et la recherche d’autres causes, y compris hypoglycémie et infection associée. Le mécanisme de séquestration n’autorise pas à attribuer automatiquement tout trouble neurologique à un paludisme confirmé. La gravité se juge sur le patient et les critères applicables.</p>
  <p class="refs"><a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §I p. 1 et §III p. 6 imprimées</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, §5.2.2 p. PDF 212–213</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-goutte" data-title="Goutte épaisse et frottis mince : deux lectures complémentaires">
  <div class="lab">Ce que montre chaque préparation</div><p>La goutte épaisse concentre le sang et facilite la détection de parasites à faible densité. Le frottis mince conserve la morphologie des globules rouges ; il aide à identifier l’espèce et à estimer la proportion de cellules parasitées. La qualité de la coloration et l’expérience du microscopiste influencent les deux lectures.</p>
  <div class="lab">Limite d’un premier résultat</div><p>Un prélèvement négatif peut manquer une parasitémie initialement très faible. Dans une suspicion persistante, le calendrier de répétition dépend de la gravité et du protocole local ; la recommandation suisse demande des contrôles sériés lorsque la suspicion reste élevée malgré une première lecture négative. La microscopie ne remplace pas l’évaluation clinique urgente.</p>
  <p class="refs"><a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §V p. 8 imprimée</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-trod" data-title="Test rapide : antigène parasitaire et piège du HRP2 persistant">
  <div class="lab">Mesure</div><p>Un test rapide immunochromatographique détecte un antigène, notamment PfHRP2 pour <i>P. falciparum</i> ou une lactate déshydrogénase parasitaire selon le dispositif. Il apporte rapidement un argument parasitologique lorsque la microscopie fiable n’est pas immédiatement accessible. Sa performance dépend de la cible, de la densité parasitaire et du produit utilisé.</p>
  <div class="lab">Après traitement ou résultat négatif</div><p>PfHRP2 peut rester détectable plus d’un mois après un traitement efficace ; un test positif ne démontre alors pas à lui seul une infection sanguine viable. Certaines souches dépourvues de la cible HRP2 peuvent aussi échapper aux tests correspondants. Devant une suspicion clinique forte, le médecin confronte le résultat à la microscopie et au contexte, sans retarder les soins d’une forme grave.</p>
  <p class="refs"><a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §V p. 8 imprimée</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-pcr" data-title="PCR : confirmation d’espèce, sans délai acceptable pour une urgence grave">
  <div class="lab">Apport</div><p>La réaction de polymérisation en chaîne, PCR, détecte des acides nucléiques de <i>Plasmodium</i> et peut confirmer l’espèce lorsque la morphologie est incertaine. Une méthode adaptée peut détecter de faibles densités ou une infection mixte. Sa sensibilité analytique n’implique pas que le résultat arrive assez vite pour guider les premières décisions d’une maladie grave.</p>
  <div class="lab">Place pratique</div><p>La recommandation suisse ne conseille pas de s’appuyer sur une PCR isolée pour la prise en charge immédiate. La microscopie associée au test rapide apporte l’évaluation initiale, avec soins urgents si la gravité l’exige. Un résultat PCR ultérieur complète l’identification sans dater la contamination ni mesurer directement les parasites séquestrés.</p>
  <p class="refs"><a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §V p. 8 imprimée</a>. Consultées le 8 octobre 2026.</p>
</template>
<template data-pop="b50-sc-pareto" data-title="Pareto — Sciences fondamentales de B50, paludisme à Plasmodium falciparum">
  <p>Le cycle explique la fièvre, tandis que la séquestration explique pourquoi le sang prélevé ne montre pas toujours toute la gravité.</p>
  <ul><li>Le moustique inocule des sporozoïtes ; le foie libère ensuite des mérozoïtes. Le sang ne devient le siège des symptômes qu’après l’entrée dans les érythrocytes.</li><li>La multiplication et la rupture des érythrocytes participent à la fièvre et à l’anémie. Un rythme fébrile régulier n’est pas nécessaire au diagnostic.</li><li>PfEMP1 peut fixer des cellules parasitées à l’endothélium. Les formes mûres séquestrées échappent en partie au comptage périphérique.</li><li>Microcirculation perturbée et transport d’oxygène réduit contribuent à l’acidose ; la conscience altérée demande aussi de rechercher d’autres causes.</li><li>La goutte épaisse détecte, le frottis mince précise l’espèce et la parasitémie, le test rapide détecte un antigène et la PCR peut confirmer l’espèce plus tard.</li><li>Un test HRP2 positif après traitement peut refléter un antigène persistant ; un test négatif isolé ne règle pas une forte suspicion clinique.</li></ul>
  <div class="key"><b>Application.</b> Le médecin relie chaque résultat au moment du cycle qu’il mesure. Il évalue la gravité et répète ou complète les tests selon la situation clinique.</div>
  <p class="refs"><a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §I, §III et §V</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, p. PDF 212–215 et 265</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8831842/" target="_blank" rel="noopener" data-reference-source="1">Étude PfEMP1 2022, texte intégral</a>. Consultées le 8 octobre 2026.</p>
</template>
