<template data-pop="b50-ph-gravite" data-title="La voie du traitement dépend d'un triage répété"><div class="lab">Pourquoi le triage précède le médicament</div><p>Une parasitémie de 0,8 % et la capacité de prendre un comprimé rendent une forme non compliquée plausible chez l'adulte du cas. Le clinicien doit cependant vérifier conscience, respiration, circulation, glycémie, fonction rénale, acidose, hémoglobine et vomissements. Un seul critère grave suffit à demander le parcours hospitalier parentéral.</p><div class="lab">Portée</div><p>La recommandation SSTTM/Swiss TPH du 1er septembre 2026 distingue traitement oral ambulatoire et traitement parentéral hospitalier. Le code B50.9 ou un chiffre initial isolé ne dispense pas de rechercher une défaillance qui peut apparaître ensuite.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, recommandations du 1er septembre 2026, section I, p. 2</a>, lues le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-seuil" data-title="Parasitémie ≥ 2 % : seuil pragmatique suisse de gravité"><div class="lab">Règle suisse</div><p>Swiss TPH 2026 retient une parasitémie <b>≥ 2 %</b> comme critère de forme grave pour les praticiens ayant une expérience limitée du paludisme. Le seuil guide l'orientation hospitalière avec artésunate IV. Il ne constitue pas un seuil de sécurité en dessous duquel les défaillances deviennent impossibles.</p><div class="lab">Exception spécialisée</div><p>Des cliniciens expérimentés peuvent discuter une association orale à base d’artémisinine pour une hyperparasitémie isolée <b>&lt; 4 %</b> chez une personne fiable et plausiblement partiellement immune, avec observation après au moins deux doses. Cette exception ne s'étend pas automatiquement au voyageur non immun ni à une autre complication. Les CDC américains emploient un seuil différent, qui ne remplace pas le seuil suisse dans ce cours.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section I, critère et commentaire sur l'hyperparasitémie</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-bascule" data-title="Bascule vers la forme grave, même avec une faible parasitémie"><div class="lab">Signes qui changent le parcours</div><p>Conscience altérée ou convulsions, détresse respiratoire, choc, acidose, hypoglycémie, anémie sévère, insuffisance rénale aiguë ou vomissements empêchant l'oral sont des critères graves dans la recommandation suisse. Une parasitémie atteignant 2 % en constitue un autre pour le triage général.</p><div class="lab">Conséquence</div><p>L'équipe hospitalise, vérifie sans délai glycémie et fonctions d'organes, puis débute un antipaludique parentéral avec avis expert. Elle n'attend pas l'échec d'un cycle Riamet oral. Le cas de base à 0,8 % sans défaillance demeure une autre situation.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section I, tableau des critères de gravité</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-al" data-title="Artéméther et luméfantrine : deux temps de l'éradication"><div class="lab">Complémentarité</div><p>L'artéméther, transformé en dihydroartémisinine, agit rapidement sur les formes sanguines asexuées. La luméfantrine persiste plus longtemps et contribue à éliminer les parasites encore présents après cette première réduction. La combinaison cherche à prévenir une recrudescence, sans remplacer un traitement parentéral dans une forme grave.</p><div class="lab">Patient du cas</div><p>Swiss TPH 2026 la retient en première ligne pour le <i>P. falciparum</i> non compliqué. La FI suisse Riamet n° 54594 confirme l'indication non compliquée, mais son schéma reste à trois jours ; la prolongation de 2026 est détaillée séparément.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section II et commentaire 1</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI Riamet n° 54594, Propriétés/Effets, décembre 2019</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-mecanisme" data-title="Exposition à la luméfantrine : pourquoi un échec tardif est possible"><div class="lab">Chaîne causale</div><p>Le nombre de parasites diminue rapidement sous l'artéméther, mais il peut rester des formes sanguines viables. La luméfantrine doit rester suffisamment présente pour supprimer ces formes. Swiss TPH explique que sa concentration au septième jour, liée à l'exposition totale, prédit la capacité d'éviter une nouvelle multiplication.</p><div class="lab">Limite de la preuve</div><p>Des séries rétrospectives de voyageurs non immuns sous schéma de trois jours ont observé des échecs tardifs ; elles ne prouvent pas que chaque patient échouera. Une alimentation insuffisante, des vomissements, certaines interactions et parfois un poids élevé peuvent réduire l'exposition. Swiss TPH recommande cinq jours en 2026 pour réduire ce risque, hors posologie de la FI Riamet de 2019.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section II, commentaire 1, p. 3</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-schema" data-title="Swiss TPH 2026 : dix prises de quatre comprimés"><div class="lab">Posologie clinique recommandée</div><p>Pour l'adulte de 70 kg, la SSTTM/Swiss TPH du 1er septembre 2026 indique quatre comprimés artéméther/luméfantrine 20/120 mg à chaque prise. Les prises surviennent à H0, H8, H24, H36, H48, H60, H72, H84, H96 et H108 : <b>10 prises, 5 jours, 40 comprimés</b>. H0 correspond au moment réel de la première dose.</p><div class="lab">Portée</div><p>Les quatre prises à H72–H108 sont ajoutées aux six prises de la FI suisse Riamet. Il faut garantir les 40 comprimés avant d'engager ce schéma ; un blister du produit contient 24 comprimés. Le prescripteur documente la recommandation récente, le statut hors posologie FI et l'adhésion possible.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, tableau de traitement du <i>P. falciparum</i>, p. 3</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI Riamet n° 54594, décembre 2019</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-firiamet" data-title="FI suisse Riamet : six prises, trois jours"><div class="lab">Texte professionnel intégral</div><p>La FI Swissmedicinfo Riamet n° <b>54594</b>, mise à jour en <b>décembre 2019</b>, indique pour un adulte ≥ 35 kg quatre comprimés de 20/120 mg à H0, H8, puis matin et soir pendant les deux jours suivants : H24, H36, H48 et H60. Le total est <b>24 comprimés en six prises sur trois jours</b>. Elle décrit un emballage de 24 comprimés.</p><div class="lab">Indication et limite</div><p>Le produit traite une infection à <i>P. falciparum</i> non compliquée ; il n'est pas indiqué comme prophylaxie ni pour un paludisme grave. La date du site Compendium en septembre 2026 ne doit pas être prise pour celle de la FI, qui est décembre 2019.</p><div class="src">Source primaire : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Riamet n° 54594, sections Indications, Posologie, Présentation et Mise à jour, décembre 2019</a>, texte intégral lu le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-recrudescence" data-title="Échec tardif sous trois jours : données et justification de cinq jours"><div class="lab">Signal clinique</div><p>Swiss TPH 2026 cite des études rétrospectives suédoises et tchèques chez des voyageurs non immuns, avec échecs tardifs observés sous le schéma artéméther/luméfantrine de trois jours. Une faible exposition à la luméfantrine est proposée comme explication plausible ; d'autres facteurs, dont vomissements et observance, peuvent intervenir.</p><div class="lab">Décision suisse</div><p>Le document recommande pragmatiquement d'ajouter quatre prises à H72, H84, H96 et H108. La prolongation vise la concentration résiduelle et le risque de recrudescence ; elle reste hors de la posologie décrite dans la FI suisse Riamet de décembre 2019.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section II, commentaire 1 et références 11–20</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-divergence" data-title="Cinq jours Swiss TPH versus trois jours FI Riamet"><div class="lab">Deux textes, même tranche de poids</div><p>La <b>FI Riamet n° 54594, décembre 2019</b>, indique six prises de quatre comprimés à H0–H60, soit 24 comprimés. La <b>SSTTM/Swiss TPH, 1er septembre 2026</b>, recommande dix prises de quatre comprimés à H0–H108, soit 40 comprimés. La recommandation ajoute 16 comprimés, répartis en quatre prises sur deux jours supplémentaires.</p><div class="lab">Statut et conduite</div><p>Le schéma de cinq jours est <b>hors posologie de la FI suisse Riamet</b>, qui reste accessible. Swiss TPH justifie sa recommandation par les échecs tardifs chez des voyageurs non immuns et le besoin d'exposition suffisante à la luméfantrine. Le prescripteur documente cette différence, vérifie les contre-indications, les comprimés disponibles et les règles applicables à sa prescription. Ce cours ne décide pas à lui seul d'un statut juridique individuel.</p><div class="src">Sources primaires : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, tableau et commentaire 1</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI Riamet n° 54594, décembre 2019, Posologie</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-repas" data-title="Un repas gras augmente l'absorption de Riamet"><div class="lab">Mécanisme</div><p>La luméfantrine est lipophile. Sa biodisponibilité à jeun est très faible selon la FI Riamet ; la prise avec un aliment ou une boisson contenant des lipides, par exemple du lait, améliore son absorption. La FI décrit aussi une meilleure absorption de l'artéméther avec la nourriture.</p><div class="lab">Conséquence</div><p>Le médecin vérifie que le malade peut manger et garder ses prises. Selon la FI, une dose vomie dans l'heure est répétée. Des vomissements qui empêchent durablement la voie orale constituent en revanche un critère de gravité dans le triage Swiss TPH et demandent un parcours hospitalier.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI Riamet n° 54594, décembre 2019, Posologie et Pharmacocinétique</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH 2026, sections I–II</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-qtc" data-title="Riamet : QTc, électrolytes et CYP3A4"><div class="lab">Risque de rythme</div><p>La FI Riamet contre-indique certaines situations d'allongement QTc, de cardiopathie ou d'antécédents familiaux concernés, des troubles électrolytiques connus comme hypokaliémie ou hypomagnésémie et des médicaments qui allongent QTc. Le médecin vérifie la liste des traitements et les données nécessaires selon la situation clinique.</p><div class="lab">Exposition insuffisante</div><p>Rifampicine, carbamazépine, phénytoïne et millepertuis sont des inducteurs puissants du CYP3A4 contre-indiqués avec Riamet : ils accélèrent le métabolisme et réduisent l'exposition à l'artéméther et à la luméfantrine. La FI signale aussi d'autres interactions qui ne se déduisent pas d'une simple liste de classes.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI Riamet n° 54594, décembre 2019, Contre-indications et Interactions</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-malarone" data-title="Malarone : alternative suisse pour une forme non compliquée"><div class="lab">Texte suisse actuel lu</div><p>La FI Swissmedicinfo Malarone n° <b>54150</b>, mise à jour en <b>décembre 2025</b>, indique atovaquone/proguanil 250/100 mg. Pour traiter un paludisme non compliqué chez l'adulte <b>> 40 kg</b>, elle donne quatre comprimés une fois par jour pendant trois jours, soit douze comprimés. Ce schéma n'est pas celui de Riamet et ne se prolonge pas sur la seule base de sa comparaison.</p><div class="lab">Choix</div><p>Swiss TPH 2026 le classe comme alternative au premier choix A/L ou dihydroartémisinine/pipéraquine. Le médecin vérifie fonction rénale, traitement antérieur, interactions, alimentation, origine de l'infection et produit réellement disponible. Malarone ne remplace pas l'artésunate IV d'une forme grave.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54150" target="_blank" rel="noopener" data-reference-source="1">FI Malarone n° 54150, décembre 2025, Posologie</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section II</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-artesunate" data-title="Artésunate IV : première ligne de la forme grave"><div class="lab">Schéma hospitalier suisse</div><p>Swiss TPH 2026 recommande artésunate <b>2,4 mg/kg IV à H0, H12 et H24, puis toutes les 24 heures</b> chez l'adulte et l'enfant > 20 kg. Pour 70 kg, la dose théorique est 168 mg. L'administration se fait à l'hôpital, avec prise en charge des défaillances et surveillance parasitologique.</p><div class="lab">Limite du dossier</div><p>La dose provient d'une recommandation clinique suisse, pas d'une FI suisse du produit IV utilisé. Aucune FI professionnelle suisse d'artésunate IV n'a été confirmée ici. Le spécialiste vérifie le produit, sa préparation, son stock et le protocole local avant administration ; l'urgence du paludisme grave impose une organisation immédiate.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, section III, p. 5</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-relais" data-title="Après l'artésunate IV : le traitement oral doit être complet"><div class="lab">Conditions de transition</div><p>Swiss TPH 2026 attend stabilité clinique, capacité de prendre l'oral et parasitémie <b>&lt; 1 %</b>. Le patient doit avoir reçu au moins 24 heures de traitement IV. Le cycle oral complet commence 8 à 12 heures après la dernière dose d'artésunate IV, selon le schéma et le produit de relais retenus.</p><div class="lab">Raison</div><p>L'artésunate réduit rapidement la masse parasitaire, mais des formes sanguines peuvent subsister. Une combinaison orale complète élimine ces résidus et limite la recrudescence. Le choix du relais tient compte de la région d'acquisition, des résistances et des interactions ; quelques comprimés restants d'une boîte ne constituent pas un cycle complet.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section III, traitement de la forme grave et relais</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-limiteiv" data-title="Artésunate IV : la disponibilité locale doit être vérifiée"><div class="lab">Preuve acquise</div><p>La SSTTM/Swiss TPH 2026 recommande l'artésunate IV et donne son schéma pour le paludisme grave. Ce document ne constitue pas la notice de la spécialité que détient un hôpital donné.</p><div class="lab">Preuve encore absente</div><p>Le dossier documentaire n'a identifié ni une FI professionnelle suisse actuelle d'artésunate IV ni le flacon, le diluant ou le stock d'un établissement précis. Aucune modalité de reconstitution n'est donc publiée ici comme universelle. L'équipe confirme ces éléments en urgence avec la pharmacie et un spécialiste en médecine tropicale. Swiss TPH décrit un circuit de conseil professionnel, mais il ne prouve pas une disponibilité immédiate partout.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section III</a> ; <a href="https://travelmedicine.swisstph.ch/en/for-healthcare-professionals" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH, accès professionnel et conseil</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-surveillance" data-title="La microscopie suit les parasites asexués jusqu'à négativation"><div class="lab">Mesure</div><p>Swiss TPH 2026 recommande numération sanguine et quantification microscopique de la parasitémie <b>toutes les 24 heures jusqu'à négativation</b> dans la forme non compliquée. Le médecin confronte ces résultats à l'état clinique et aux anomalies biologiques, notamment les plaquettes.</p><div class="lab">Interprétation</div><p>Le nombre de parasites peut fluctuer au début et même augmenter transitoirement les premières 24 à 36 heures selon le cycle parasitaire et l'heure du prélèvement. Les gamétocytes résiduels ne représentent pas seuls un échec. Un test rapide HRP2 ou une PCR peut rester positif plus d'un mois après guérison et ne remplace pas la microscopie de suivi.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section II.6 et section V</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-hemolyse" data-title="Hémolyse retardée après artésunate : J7, J14, J21, J28"><div class="lab">Mécanisme</div><p>Après artésunate, la rate peut retirer les parasites d'érythrocytes infectés sans détruire immédiatement ces cellules. Les globules rouges « nettoyés » retournent au sang, mais leur durée de vie est réduite à environ 7–21 jours selon Swiss TPH. Leur élimination groupée peut créer une hémolyse retardée et une anémie après la disparition initiale des parasites.</p><div class="lab">Suivi</div><p>Swiss TPH 2026 recommande de contrôler l'hémolyse à <b>J7, J14, J21 et J28</b> après artésunate IV. Le risque croît avec la parasitémie initiale ; certaines personnes nécessitent une intervention transfusionnelle. L'équipe suit l'hémoglobine et les paramètres d'hémolyse selon son protocole. Après traitement oral d'une forme non compliquée, un contrôle analogue se discute surtout en cas de prédisposition à l'anémie, sans le présenter comme la même obligation.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, section III.2, Post-Artesunate Delayed Haemolysis</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b50-ph-rechute" data-title="Fièvre après traitement : rechercher une recrudescence"><div class="lab">Question clinique</div><p>Une nouvelle fièvre après amélioration peut accompagner la multiplication de parasites sanguins qui n'ont pas été éliminés. Elle peut aussi avoir une autre cause. Une exposition insuffisante au traitement, des vomissements, une interaction, une résistance ou une nouvelle infection sont évalués selon le temps et le lieu.</p><div class="lab">Preuve utile</div><p>La microscopie recherche et quantifie les formes sanguines asexuées ; elle est associée à une réévaluation clinique urgente. Un TDR HRP2 ou une PCR positifs isolés peuvent refléter une persistance de signal après guérison et ne prouvent pas une recrudescence. La décision de retraitement dépend des résultats et d'un avis spécialisé.</p><div class="src">Source : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, sections II.6, IV et V</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="pareto-b50-ph" data-title="Loi de Pareto — Pharmacologie du paludisme à P. falciparum"><ol><li>Le clinicien confirme une forme non compliquée avant un antipaludique oral ; un signe grave ou une parasitémie ≥ 2 % selon le triage suisse commande le parcours hospitalier.</li><li>Chez l'adulte de 70 kg, Swiss TPH 2026 recommande A/L 20/120 mg, quatre comprimés à chacune des dix prises H0–H108 : cinq jours, 40 comprimés.</li><li>La FI Riamet n° 54594, décembre 2019, indique six prises H0–H60 : trois jours, 24 comprimés. La cure de cinq jours est hors posologie de cette FI et exige une décision documentée.</li><li>Le patient prend Riamet avec des lipides ; le médecin vérifie vomissements, QTc, électrolytes et interactions qui réduisent l'exposition.</li><li>Une forme grave reçoit artésunate IV à l'hôpital selon Swiss TPH, puis un cycle oral complet. Le produit IV réel et sa préparation doivent être vérifiés localement.</li><li>La microscopie suit les parasites asexués ; après artésunate IV, l'équipe contrôle l'hémolyse retardée à J7, J14, J21 et J28.</li></ol><div class="key">Les deux régimes A/L cités ont des sources, dates et statuts distincts. Le choix tient à la gravité et au produit effectivement administré.</div></template>
