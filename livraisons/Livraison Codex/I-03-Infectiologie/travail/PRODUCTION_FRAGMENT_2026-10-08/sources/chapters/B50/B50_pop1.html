<template data-pop="b50-examens" data-title="Loi de Pareto — Examens du paludisme à Plasmodium falciparum">
<div class="lab">Décisions utiles immédiatement</div><p>Une fièvre après exposition possible conduit à une microscopie urgente du sang. La goutte épaisse détecte, le frottis mince aide à nommer l’espèce et à chiffrer la parasitémie. Le clinicien recherche simultanément les critères de gravité cliniques et biologiques. Après traitement, la microscopie quotidienne suit les formes asexuées jusqu’à négativation.</p>
<div class="lab">Le cas</div><p>Le frottis documente <em>P. falciparum</em> à 0,8 %, sous le seuil de triage suisse de 2 %. L’absence de défaillance indiquée dans le scénario doit être confirmée par la clinique et les résultats d’organe ; aucune valeur de laboratoire manquante n’est supposée normale. « Pareto » désigne une priorité pédagogique, sans proportion chiffrée inventée.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale et Centre national de référence, recommandations du 1er septembre 2026, p. 1 et 4–5</a> ; <a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, diagnostic, 17 août 2026</a>. Consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-parcours" data-title="Diagnostic du paludisme : confirmer, quantifier, rechercher une complication">
<div class="lab">Trois tâches en parallèle</div><p>Le laboratoire examine rapidement une goutte épaisse et un frottis mince. L’équipe identifie l’espèce et la proportion de globules rouges infectés, puis cherche à l’examen et par la biologie tout critère de paludisme grave. Le résultat initial doit être accessible en quelques heures, car un retard de diagnostic permet la progression d’un paludisme à <em>P. falciparum</em>.</p>
<div class="lab">Évolution</div><p>Une fois le traitement commencé, la recommandation suisse demande une numération sanguine et une parasitémie microscopique toutes les 24 heures jusqu’à négativation. Le test antigénique ou moléculaire ne mesure pas cette clairance de la même façon. Le patient du cas a déjà une espèce et un titre parasitaire mesurés ; les paramètres d’organe restent à lire.</p>
<p class="refs"><a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, Paludisme, urgence devant la fièvre après voyage</a> ; <a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">recommandation suisse 2026, triage et suivi</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-microscopie" data-title="Microscopie sanguine : méthode de référence en urgence">
<div class="lab">Ce qu’elle révèle</div><p>Une coloration du sang étalé permet d’observer le parasite. La goutte épaisse est plus sensible pour la détection parce qu’elle examine davantage de sang ; le frottis mince conserve les contours des globules rouges et les caractères morphologiques utiles à l’espèce et au calcul de parasitémie. Les deux préparations sont complémentaires.</p>
<div class="lab">Limite de fiabilité</div><p>Une lecture dépend de la qualité de l’échantillon, de la coloration et de l’expérience du microscopiste. Une première préparation négative rend le diagnostic moins probable, mais ne suffit pas à exclure une faible parasitémie chez une personne exposée et très suspecte. À l’inverse, le frottis positif de ce cas documente directement l’infection sanguine.</p>
<p class="refs"><a href="https://www.swisstph.ch/en/expertise/diagnostic-centre/methods-and-materials" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH, méthodes et matériel, goutte épaisse et frottis</a> ; <a href="https://www.cdc.gov/malaria/hcp/diagnosis-testing/malaria-diagnostic-tests.html" target="_blank" rel="noopener" data-reference-source="1">CDC, <em>Malaria Diagnostic Tests</em>, 24 avril 2024</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-goutte" data-title="Goutte épaisse : détecter une faible densité parasitaire">
<div class="lab">Pourquoi elle est sensible</div><p>Le préparateur dépose une quantité de sang plus épaisse sur la lame. La coloration détruit les contours des globules rouges et concentre les parasites visibles dans une zone limitée. Le microscopiste peut ainsi examiner un volume sanguin supérieur à celui d’un frottis mince.</p>
<div class="lab">Ce qu’elle ne remplace pas</div><p>La perte des contours cellulaires complique la reconnaissance fine de l’espèce et ne donne pas directement le pourcentage de globules rouges infectés. Un frottis mince est donc nécessaire pour cette quantification. Le rendement d’une goutte négative dépend aussi de la compétence de lecture et de la densité réelle au moment du prélèvement.</p>
<p class="refs"><a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, <em>Evaluation and Diagnosis of Malaria</em>, 17 août 2026, « Thick and thin blood smears »</a> ; <a href="https://www.swisstph.ch/en/expertise/diagnostic-centre/methods-and-materials" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH, méthodes microscopiques</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-frottis" data-title="Frottis mince : espèce, pourcentage et suivi">
<div class="lab">Ce que conserve la lame</div><p>Le sang étalé finement laisse voir les globules rouges et leurs parasites. Les formes parasitaires et l’aspect de la cellule aident un microscopiste expérimenté à distinguer <em>P. falciparum</em> d’autres espèces. Le nombre de cellules infectées rapporté aux cellules examinées fournit la parasitémie en pourcentage.</p>
<div class="lab">Limites</div><p>Une faible densité peut être manquée plus facilement qu’à la goutte épaisse. Les infections mixtes ou une morphologie atypique justifient parfois une confirmation moléculaire. Dans le cas, l’espèce et 0,8 % sont rapportés par frottis ; aucune précision sur une infection mixte n’est fournie.</p>
<p class="refs"><a href="https://www.cdc.gov/malaria/hcp/diagnosis-testing/malaria-diagnostic-tests.html" target="_blank" rel="noopener" data-reference-source="1">CDC, <em>Malaria Diagnostic Tests</em>, 24 avril 2024, microscopie</a> ; <a href="https://www.cdc.gov/dpdx/malaria/" target="_blank" rel="noopener" data-reference-source="1">CDC DPDx, morphologie des espèces</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-espece" data-title="Identifier Plasmodium falciparum sans perdre une infection mixte">
<div class="lab">Pourquoi l’espèce importe</div><p><em>P. falciparum</em> est l’espèce la plus associée aux évolutions rapides et graves dans le paludisme importé. Ses formes en anneau peuvent être visibles au frottis périphérique, tandis que des formes mûres peuvent se séquestrer dans les petits vaisseaux. La reconnaissance morphologique guide rapidement le triage et le traitement.</p>
<div class="lab">Incertitude possible</div><p>Une faible densité ou une infection associant plusieurs espèces peut rendre la lecture initiale difficile. Une amplification moléculaire peut préciser l’espèce lorsqu’un doute persiste, sans différer une décision urgente. L’espèce <em>P. falciparum</em> est déjà rapportée dans le cas ; le dossier n’établit pas d’autre espèce.</p>
<p class="refs"><a href="https://www.cdc.gov/dpdx/malaria/" target="_blank" rel="noopener" data-reference-source="1">CDC DPDx, Malaria, caractères morphologiques et formes en anneau</a> ; <a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, diagnostic et rôle des tests moléculaires, 17 août 2026</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-parasitemie" data-title="Parasitémie : part des globules rouges circulants infectés">
<div class="lab">Calcul utile</div><p>Le microscopiste rapporte le nombre de globules rouges contenant une forme asexuée au nombre de globules rouges examinés. Une cellule qui contient plusieurs parasites est comptée comme une seule cellule infectée. Le chiffre 0,8 % correspond à huit globules rouges infectés pour mille examinés, sous réserve de la qualité de l’échantillon et du comptage.</p>
<div class="lab">Ce que le chiffre ne montre pas</div><p>Les gamétocytes ne sont pas comptés dans la parasitémie clinique. Des globules rouges infectés mûrs par <em>P. falciparum</em> peuvent adhérer à la microcirculation et ne pas être représentés dans le frottis périphérique. La mesure soutient le triage et le suivi, mais une faible valeur ne réfute pas une complication clinique.</p>
<p class="refs"><a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, <em>Evaluation and Diagnosis of Malaria</em>, 17 août 2026, calcul et gamétocytes</a> ; <a href="https://www.cdc.gov/malaria/hcp/clinical-features/" target="_blank" rel="noopener" data-reference-source="1">CDC, séquestration dans le paludisme à <em>P. falciparum</em></a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-seuil" data-title="Seuil suisse de 2 % : trier, puis vérifier les autres critères">
<div class="lab">Règle suisse datée</div><p>La recommandation suisse du 1er septembre 2026 classe une parasitémie à <em>P. falciparum</em> d’au moins 2 % parmi les critères de traitement comme paludisme grave. Elle fonde ce seuil de prudence sur des données de paludisme importé. Une exception surveillée existe pour certains patients sélectionnés avec hyperparasitémie isolée, sous responsabilité d’une équipe expérimentée ; elle ne modifie pas le parcours ordinaire d’un clinicien moins expérimenté.</p>
<div class="lab">Pourquoi 0,8 % ne suffit pas à rassurer</div><p>Le seuil est un critère parmi d’autres. Une hypoglycémie, une altération de conscience ou une insuffisance rénale fait basculer le triage même en dessous de 2 %. Le CDC américain utilise 5 % dans sa définition, mais ce seuil reflète son contexte et n’efface pas la recommandation applicable en Suisse.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale et Centre national de référence, recommandations du 1er septembre 2026, p. 1</a> ; <a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, définition américaine, 17 août 2026</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-tdr" data-title="Test rapide antigénique : réponse précoce, sans parasitémie">
<div class="lab">Rôle</div><p>Un test de diagnostic rapide détecte un antigène du parasite dans le sang. Il peut fournir une première réponse avant qu’une microscopie expérimentée soit disponible et permettre de commencer la prise en charge. Le résultat ne montre ni les parasites dans les globules rouges ni leur pourcentage.</p>
<div class="lab">Deux limites opposées</div><p>Une faible densité parasitaire ou une délétion des gènes HRP2/HRP3 chez certains <em>P. falciparum</em> peuvent donner un résultat négatif malgré l’infection pour les tests dépendants de ces cibles. Inversement, l’antigène peut rester détectable plusieurs semaines après un traitement efficace. Le CDC 2026 demande donc une microscopie concurrente ou de confirmation, que le test rapide soit positif ou négatif. La performance dépend du kit utilisé en Suisse ; les caractéristiques du seul kit autorisé aux États-Unis ne sont pas transférées automatiquement.</p>
<p class="refs"><a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, <em>Evaluation and Diagnosis of Malaria</em>, 17 août 2026, limites des tests rapides</a> ; <a href="https://www.swisstph.ch/en/expertise/diagnostic-centre/methods-and-materials" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH, tests rapides parmi les méthodes du centre</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-pcr" data-title="Amplification moléculaire : préciser l’espèce, sans retarder l’urgence">
<div class="lab">Ce qu’elle détecte</div><p>Une amplification des acides nucléiques du parasite peut identifier une espèce et révéler une infection mixte que la morphologie distingue difficilement. Certaines plateformes donnent un résultat rapide, tandis que d’autres nécessitent un envoi qui retarde le compte rendu.</p>
<div class="lab">Limite pour le triage et le suivi</div><p>Une positivité moléculaire ne donne pas le pourcentage de globules rouges infectés et peut persister après le traitement. Le frottis doit donc accompagner un résultat moléculaire positif pour mesurer la parasitémie et suivre les formes asexuées. Chez le patient du cas, l’espèce et le taux sont déjà connus par microscopie ; une amplification supplémentaire répondrait à une question d’espèce non résolue, pas à la mesure de gravité.</p>
<p class="refs"><a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, diagnostic moléculaire, 17 août 2026</a> ; <a href="https://www.swisstph.ch/en/expertise/diagnostic-centre/methods-and-materials" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH, amplification moléculaire parmi les méthodes du centre</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-gravite" data-title="Paludisme grave : un seul critère suffit au triage suisse">
<div class="lab">Critères qui changent la voie</div><p>La recommandation suisse 2026 retient notamment incapacité à se tenir assis, debout ou à marcher sans aide, conscience altérée, convulsions, détresse respiratoire, choc, insuffisance rénale, acidose, hypoglycémie, anémie sévère, saignement spontané, vomissements répétés empêchant la prise orale et parasitémie d’au moins 2 %. Une bilirubine élevée est interprétée avec une densité parasitaire élevée selon le tableau, et non comme seul chiffre isolé.</p>
<div class="lab">Application</div><p>Le patient du cas a 0,8 % et aucune défaillance signalée. Les glycémie, fonction rénale, hémoglobine, respiration, conscience et capacité de prise orale doivent être vérifiées avant de maintenir une classification non compliquée. Un critère apparu ensuite modifie immédiatement le traitement et le lieu de soin.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale et Centre national de référence, recommandations 2026, tableau de triage p. 1</a>, consulté le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-glucose" data-title="Glycémie : détecter une hypoglycémie grave">
<div class="lab">Seuil et mécanisme</div><p>La recommandation suisse 2026 retient une glycémie inférieure à 2,2 mmol/L comme critère de paludisme grave. Le glucose est indispensable au fonctionnement cérébral ; une chute peut contribuer à la confusion, aux convulsions ou au coma et doit être corrigée immédiatement selon l’état réel du patient.</p>
<div class="lab">Lecture répétée</div><p>Une conscience altérée ne doit pas être attribuée au parasite cérébral sans mesurer le glucose. Dans une forme grave traitée par quinine, la recommandation suisse prévoit une surveillance renforcée, car ce médicament peut favoriser une hypoglycémie par hyperinsulinisme. Aucune glycémie ni exposition à la quinine n’est rapportée dans le cas.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale, recommandations 2026, critères p. 1 et suivi des formes graves p. 7</a>, consulté le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-rein" data-title="Fonction rénale : créatinine et diurèse répondent à deux questions">
<div class="lab">Seuils suisses</div><p>Le tableau suisse 2026 retient une diurèse inférieure à 0,4 mL/kg/h, une créatinine supérieure à 265 µmol/L ou une urée supérieure à 20 mmol/L comme indices d’insuffisance rénale grave. Chez un adulte de 70 kg, 0,4 mL/kg/h correspond à 28 mL/h ; ce calcul ne représente pas sa diurèse réelle.</p>
<div class="lab">Pourquoi les suivre</div><p>La créatinine reflète l’élimination rénale avec un décalage possible ; la diurèse renseigne plus immédiatement la production d’urine et la perfusion. Les deux se lisent avec l’état circulatoire et l’hydratation, sans attribuer toute anomalie au seul parasite. Aucun résultat rénal n’est fourni pour le patient du cas.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale, recommandations 2026, tableau de gravité p. 1</a>, consulté le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-acidose" data-title="Acidose et lactate : vérifier la perfusion et le métabolisme">
<div class="lab">Seuils du triage</div><p>La recommandation suisse 2026 retient notamment un pH artériel inférieur à 7,3, un bicarbonate inférieur à 15 mmol/L ou un lactate d’au moins 5 mmol/L comme critère d’acidose grave. Le lactate peut augmenter lorsque l’utilisation et l’apport d’oxygène deviennent inadéquats, avec des contributions possibles de l’inflammation et du métabolisme parasitaire.</p>
<div class="lab">Limite de lecture</div><p>Un lactate isolé ne démontre pas le mécanisme précis de l’acidose. Le prélèvement, la perfusion, les gaz du sang et l’évolution clinique sont nécessaires. Dans une forme grave, la recommandation suisse demande une surveillance rapprochée des gaz sanguins jusqu’à stabilisation. Aucune valeur n’est fournie pour le patient du cas.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale, recommandations 2026, critères p. 1 et suivi p. 7</a>, consulté le 8 octobre 2026. L’attribution causale d’un lactate demande l’évaluation du patient.</p>
</template>
<template data-pop="b50-e-hemoglobine" data-title="Hémoglobine : mesurer la conséquence sur l’oxygénation">
<div class="lab">Seuil adulte</div><p>Une hémoglobine inférieure à 7 g/dL chez l’adulte est un critère d’anémie sévère dans la recommandation suisse 2026. L’hémoglobine transporte l’oxygène ; une baisse importante réduit la capacité de transport et peut aggraver une défaillance d’organe.</p>
<div class="lab">Causes et limite</div><p>Le paludisme détruit des globules rouges infectés ; l’élimination de cellules non infectées et une production médullaire insuffisante peuvent contribuer à l’anémie. Une valeur d’hémoglobine ne mesure ni l’espèce ni la parasitémie. Elle doit être confrontée à une valeur antérieure éventuelle, aux signes de saignement et au contexte. Aucun taux n’est fourni pour le patient du cas.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale, recommandations 2026, tableau de gravité p. 1</a> ; <a href="https://www.cdc.gov/malaria/hcp/clinical-features/" target="_blank" rel="noopener" data-reference-source="1">CDC, manifestations hématologiques du paludisme</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-suivi" data-title="Suivi microscopique quotidien : disparition des formes asexuées">
<div class="lab">Rythme suisse</div><p>La recommandation suisse du 1er septembre 2026 demande une numération sanguine et une parasitémie par microscopie toutes les 24 heures jusqu’à négativation, que le tableau initial soit non compliqué ou grave. L’équipe suit aussi l’amélioration clinique et la normalisation des résultats anormaux ; les plaquettes sont un repère biologique utile, sans être une mesure directe des parasites.</p>
<div class="lab">Premier jour et piège</div><p>La parasitémie peut monter transitoirement pendant les 24 à 36 premières heures, selon le moment du prélèvement dans le cycle érythrocytaire. Cette hausse isolée ne prouve pas une résistance ; une aggravation clinique ou une nouvelle défaillance ne doit toutefois jamais être banalisée. Les gamétocytes persistants ne sont pas comptés comme formes asexuées actives pour ce suivi.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale et Centre national de référence, recommandations 2026, suivi p. 4 et 7</a>, consulté le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-gametocytes" data-title="Gamétocytes : transmission possible, lecture différente de la clairance">
<div class="lab">Place dans le cycle</div><p>Certains parasites sanguins deviennent des gamétocytes, formes sexuelles ingérées par un moustique. Les formes asexuées qui se multiplient dans les globules rouges sont celles que le suivi de la maladie clinique cherche à faire disparaître.</p>
<div class="lab">Conséquence au frottis</div><p>La recommandation suisse 2026 signale que des gamétocytes peuvent rester visibles après guérison. Leur présence n’est pas incluse dans la parasitémie des formes asexuées et ne signifie pas automatiquement que le traitement de l’épisode a échoué. Le laboratoire doit distinguer ces formes dans son compte rendu.</p>
<p class="refs"><a href="https://travelmedicine.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Société suisse de médecine tropicale, recommandations 2026, suivi p. 4 et 7</a> ; <a href="https://www.cdc.gov/dpdx/malaria/" target="_blank" rel="noopener" data-reference-source="1">CDC DPDx, cycle et gamétocytes</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b50-e-laboratoire" data-title="Accès au diagnostic suisse : résultat immédiat avant confirmation de référence">
<div class="lab">Le rôle du centre national</div><p>Le Centre national de référence pour le paludisme de Swiss TPH confirme des diagnostics et conseille les laboratoires et équipes soignantes. Sa page de service diagnostique précise toutefois que les analyses sur place sont accessibles en semaine aux heures publiées ; le laboratoire est fermé les soirs, fins de semaine et jours fériés. Une autre page générale évoque une aide d’urgence continue, mais ne doit pas être lue comme la promesse d’une microscopie sur place en permanence.</p>
<div class="lab">Conséquence pour un patient fébrile</div><p>L’équipe obtient une première analyse dans un établissement capable de rendre un résultat urgent en quelques heures et de traiter le paludisme. Un envoi de référence peut ensuite affiner l’espèce ou contrôler la qualité sans retarder cette prise en charge. Le patient du cas a déjà un frottis rapporté positif.</p>
<p class="refs"><a href="https://www.swisstph.ch/en/expertise/diagnostic-centre/emergency-services" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH, <em>Emergency Services</em>, horaires diagnostiques</a> ; <a href="https://www.swisstph.ch/en/expertise/diagnostic-centre/national-reference-centre-for-malaria-nzma" target="_blank" rel="noopener" data-reference-source="1">Swiss TPH, rôle du Centre national de référence</a> ; <a href="https://www.cdc.gov/malaria/hcp/clinical-guidance/evaluation-and-diagnosis.html" target="_blank" rel="noopener" data-reference-source="1">CDC, diagnostic en quelques heures, 17 août 2026</a>. Pages consultées le 8 octobre 2026.</p>
</template>
