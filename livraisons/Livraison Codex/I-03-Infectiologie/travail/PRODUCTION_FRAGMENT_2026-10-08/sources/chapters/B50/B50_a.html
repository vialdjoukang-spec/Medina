<div class="chap-head"><div class="code">B50 · Paludisme à Plasmodium falciparum · I-03-Infectiologie</div><h1>Paludisme à Plasmodium falciparum</h1><span class="status">Version de travail · Sources consultées le 8 octobre 2026 : SSTTM/Swiss TPH, 1er septembre 2026 ; OFSP ; OMS, 10 septembre 2026 ; informations professionnelles suisses Riamet, décembre 2019, et Malarone, décembre 2025. Une parasitémie basse ne dispense pas de rechercher une défaillance.</span></div>

<section class="ilot" id="b50-pa-0"><h2><span class="n">0</span>Une infection confirmée, une gravité encore à établir</h2>
<p>Une personne adulte non enceinte de 70 kg présente une fièvre après un voyage. Le frottis identifie <em>Plasmodium falciparum</em> et mesure une parasitémie de <b>0,8 %</b>. Le délai depuis le retour, les résultats biologiques, l’état des organes et la capacité à garder un médicament oral ne sont pas fournis.</p>
<p>Le médecin recherche sans délai les <button class="w" data-k="b50-pa-gravite">critères de gravité (organes et aptitude à l’oral)</button>, puis vérifie l’itinéraire, les médicaments déjà pris et l’accès aux contrôles. Le pourcentage mesuré reste inférieur au seuil suisse de triage de 2 %, mais ne suffit pas à conclure à une forme non compliquée. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1 imprimée : triage</a>.</p>
<div class="key"><b>À retenir.</b> L’espèce et la parasitémie sont connues. Le parcours dépend encore de l’examen clinique, de la biologie et des conditions de traitement.</div></section>

<section class="ilot" id="b50-pa-1"><h2><span class="n">1</span>Maladie et histoire naturelle</h2>
<p>Un anophèle infecté inocule des sporozoïtes. Le parasite traverse d’abord une phase hépatique, puis libère des mérozoïtes qui envahissent les globules rouges. La maladie ressentie correspond surtout à cette phase sanguine, dont la multiplication asexuée se répète sur environ 48 heures chez <em>P. falciparum</em>. Cette durée biologique n’impose pas une fièvre périodique reconnaissable chez chaque patient.</p>
<p>Une partie des parasites se différencie en <button class="w" data-k="b50-pa-cycle">gamétocytes (transmission au moustique, sans multiplication asexuée humaine)</button>. Ils peuvent persister après la disparition des formes sanguines asexuées. <em>P. falciparum</em> ne possède pas les hypnozoïtes hépatiques responsables des rechutes de <em>P. vivax</em> et <em>P. ovale</em>. Une nouvelle fièvre après traitement appelle donc la recherche d’une recrudescence sanguine ou d’une autre cause. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tableau clinique », consulté le 8 octobre 2026</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS, WHO guidelines for malaria, 10 septembre 2026, glossaire p. PDF 265</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §II.6 p. 5 et §IV p. 7 imprimées</a>.</p>
<div class="key"><b>À retenir.</b> Le cycle sanguin explique les symptômes et fonde la surveillance des formes asexuées. La persistance de gamétocytes ne démontre pas, seule, un échec du traitement.</div></section>

<section class="ilot" id="b50-pa-2"><h2><span class="n">2</span>Épidémiologie et exposition</h2>
<p>La transmission dépend d’une exposition à des anophèles dans une zone où circule le parasite. L’OFSP rappelle que ces moustiques piquent surtout le soir et la nuit et qu’une fièvre pendant ou après un séjour à risque demande une évaluation médicale urgente. Le diagnostic ne peut être écarté parce qu’une moustiquaire ou une prophylaxie a été utilisée.</p>
<p>Le médecin reconstruit la <button class="w" data-k="b50-pa-exposition">chronologie du voyage (régions, dates et exposition)</button>. La région d’acquisition influe sur les résistances et sur le traitement choisi. Aucun pays, délai d’incubation individuel ni date de piqûre ne sont connus dans le cas. Le Guide OFSP 2026 indique qu’environ 300 cas de paludisme sont déclarés en Suisse après des séjours en zone endémique, toutes espèces confondues ; ce chiffre n’est ni un décompte de falciparum ni une mesure propre à l’année 2026. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, « Paludisme », p. 88</a>. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Paludisme », transmission et urgence, consulté le 8 octobre 2026</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §I p. 1 et §II p. 2 imprimées</a>.</p>
<div class="key"><b>À retenir.</b> L’itinéraire relie l’exposition au risque et au choix du médicament. La fièvre après voyage demeure urgente même lorsque la protection paraissait correcte.</div></section>

<section class="ilot" id="b50-pa-3"><h2><span class="n">3</span>Mécanismes de la fièvre et des défaillances</h2>
<p>Les globules rouges transportent l’oxygène dans la microcirculation. Après la phase hépatique, les mérozoïtes envahissent ces cellules. Les formes asexuées s’y multiplient ; la rupture des schizontes libère de nouveaux parasites et contribue à la <button class="w" data-k="b50-pa-fievre">fièvre et aux frissons (réponse inflammatoire)</button>. L’élimination d’hématies infectées et non infectées réduit la capacité de transport de l’oxygène et peut produire une <button class="w" data-k="b50-pa-hematologie">anémie (perte de globules rouges)</button>. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tableau clinique », symptômes et destruction des globules rouges</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, p. PDF 215 : anémie des formes graves</a>.</p>
<p>Les hématies infectées par <em>P. falciparum</em> peuvent adhérer à l’endothélium. Leur <button class="w" data-k="b50-pa-sequestration">séquestration (circulation périphérique et organes)</button> perturbe les petits vaisseaux. Le frottis compte les formes circulantes et ne représente pas toute la biomasse séquestrée. Cette perturbation, associée selon le cas à l’hypovolémie, peut diminuer la perfusion des tissus et contribuer à l’acidose. La lésion endothéliale favorise aussi l’œdème pulmonaire, notamment si les apports liquidiens sont excessifs. Ces mécanismes sont contributifs ; une défaillance demande un bilan et ne se déduit pas d’un pourcentage sanguin. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §III, commentaires p. 6 imprimée : séquestration, acidose et œdème</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, §5.2.2 p. PDF 212–215 : défaillances graves</a>.</p>
<div class="trap"><span class="k">Piège</span>Une parasitémie de 0,8 % décrit le prélèvement périphérique. Elle ne donne ni un risque individuel de 0,8 %, ni une garantie d’intégrité cérébrale ou rénale.</div>
<div class="key"><b>À retenir.</b> La multiplication asexuée produit les symptômes ; la microcirculation et l’atteinte d’organe gouvernent la gravité. Le frottis doit être interprété avec l’examen du patient.</div></section>

<section class="ilot" id="b50-pa-4"><h2><span class="n">4</span>Présentations cliniques et susceptibilité</h2>
<p>La fièvre, les frissons, les céphalées, les douleurs musculaires et le malaise sont peu spécifiques. Des vomissements ou une diarrhée peuvent les accompagner. La périodicité de la fièvre n’est pas nécessaire au diagnostic. Une confusion, une convulsion, une dyspnée, une prostration ou une diminution des urines fait rechercher une complication immédiate plutôt qu’une simple intensification des symptômes ordinaires. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tableau clinique », manifestations du paludisme</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §I p. 1 imprimée : complications</a>.</p>
<p>Une <button class="w" data-k="b50-pa-immunite">immunité partielle (exposition antérieure et limites du triage)</button> peut exister après des séjours en zone d’endémie, puis diminuer. Elle n’est pas quantifiable de manière fiable au lit du malade. L’origine d’une personne ou le seul mot « voyage » ne la prouvent pas. Une <button class="w" data-k="b50-pa-prophylaxie">prophylaxie antérieure (prises et échec possible)</button> n’écarte pas l’infection et modifie parfois le choix thérapeutique. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §I p. 1 et §II p. 2 imprimées</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS 2026, immunité selon la transmission, p. PDF 35</a>.</p>
<div class="key"><b>À retenir.</b> La présentation initiale peut sembler banale. Les signes d’organe et la possibilité de prendre un traitement doivent être recherchés activement.</div></section>

<section class="ilot" id="b50-pa-5"><h2><span class="n">5</span>Anamnèse orientée vers la décision</h2>
<p>Le médecin précise les lieux et dates du voyage, la protection contre les piqûres, la prophylaxie et ses prises réellement effectuées. Il demande le début et l’évolution de la fièvre, les traitements déjà reçus et les médicaments associés. La destination manque dans le cas ; elle doit être obtenue avant d’attribuer un profil de résistance régional.</p>
<div class="two"><div class="card"><h3>Symptômes et voie orale</h3><p>Le médecin recherche les <button class="w" data-k="b50-pa-digestif">vomissements répétés (absorption du traitement oral)</button>, la diarrhée et la capacité à manger. Il demande si la faiblesse empêche de s’asseoir, de se lever ou de marcher sans aide.</p></div><div class="card"><h3>Organes et entourage</h3><p>Un proche peut décrire une <button class="w" data-k="b50-pa-neuro">modification de conscience (atteinte cérébrale ou autre cause)</button>. Le médecin interroge sur les convulsions, la <button class="w" data-k="b50-pa-respiration">dyspnée (hypoxie ou œdème)</button> et la <button class="w" data-k="b50-pa-rein">diminution des urines (atteinte rénale)</button>.</p></div></div>
<p>Aucun de ces éléments n’est ajouté comme fait acquis au patient du cas. Une réponse négative rapportée ne remplace pas les constantes, la biologie ni la réévaluation si l’état change. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §I p. 1 et §III p. 5–6 imprimées</a> ; <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tableau clinique », consulté le 8 octobre 2026</a>.</p>
<div class="key"><b>À retenir.</b> L’anamnèse éclaire l’exposition, la voie de traitement et les complications. Elle garde les inconnues du cas visibles jusqu’à leur vérification.</div></section>

<section class="ilot" id="b50-pa-6"><h2><span class="n">6</span>Examen clinique : du patient observable aux organes</h2>
<p>L’examen commence par l’état général et la capacité à s’asseoir, se lever ou marcher sans aide. Le médecin mesure température, fréquence cardiaque, pression artérielle, fréquence respiratoire et oxygénation. Le poids de 70 kg est connu ; aucune autre mesure normale n’est présumée. Il examine ensuite les organes dont l’atteinte imposerait le parcours grave.</p>
<div class="two"><div class="card"><h3>Neurologie, respiration et perfusion</h3><p>Le médecin évalue la <button class="w" data-k="b50-pa-neuro">conscience (score et causes réversibles)</button> et recherche des convulsions. Il inspecte le travail respiratoire et mesure l’oxygénation. Il examine la <button class="w" data-k="b50-pa-perfusion">perfusion périphérique (choc même sans hypotension)</button>, notamment la recoloration cutanée et la température des extrémités.</p></div><div class="card"><h3>Rein, sang et prise orale</h3><p>Le médecin quantifie la <button class="w" data-k="b50-pa-rein">diurèse (mesure et seuil adulte)</button>. Il recherche pâleur, ictère ou saignement, puis les confronte au bilan sanguin. Il vérifie les <button class="w" data-k="b50-pa-digestif">vomissements répétés (obstacle à l’oral)</button> et l’aptitude à prendre le traitement.</p></div></div>
<p>Une pâleur ne chiffre pas l’anémie ; l’absence d’ictère ne prouve pas une bilirubine normale. Le bilan associe notamment glycémie, fonction rénale, hémoglobine, plaquettes et, selon la situation, marqueurs d’acidose. Chez un patient confus, la <button class="w" data-k="b50-pa-glycemie">glycémie immédiate (hypoglycémie et atteinte neurologique)</button> cherche une cause corrigible sans différer le traitement du paludisme grave. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse 2026, p. 1 et 6 imprimées : critères et complications</a>.</p>
<div class="key"><b>À retenir.</b> La gravité se recherche par l’observation, les constantes et la biologie. Une seule anomalie majeure peut suffire à changer le parcours.</div></section>

<section class="ilot" id="b50-pa-7"><h2><span class="n">7</span>Diagnostic parasitologique et causes associées</h2>
<p>La <button class="w" data-k="b50-pa-microscopie">microscopie (goutte épaisse, frottis mince et parasitémie)</button> confirme l’infection. La goutte épaisse est sensible pour la détection ; le frottis mince aide à identifier l’espèce et à quantifier les hématies parasitées. Un laboratoire expérimenté améliore la fiabilité de la lecture. Dans le cas, l’espèce <em>P. falciparum</em> et les 0,8 % sont déjà documentés.</p>
<p>Avant la confirmation, un premier examen négatif n’aurait pas suffi si la suspicion clinique demeurait forte. Les répétitions se décident selon la probabilité et l’absence d’une autre explication ; la règle historique de trois tests n’est pas automatique pour tout patient. Un test rapide ou moléculaire peut compléter la microscopie, mais ne remplace pas l’examen morphologique et le comptage. Si la microscopie a été omise en aigu, la recommandation suisse demande de l’obtenir au plus tôt, de préférence dans les 12 heures. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §V p. 8 imprimée : diagnostic et limites des tests</a>.</p>
<p>Après confirmation, une altération nouvelle peut aussi correspondre à un <button class="w" data-k="b50-pa-differentiels">autre processus urgent (sepsis ou cause neurologique associée)</button>. Le choc justifie notamment la recherche d’une infection bactérienne ; une confusion exige une glycémie et un examen neurologique. Le traitement du paludisme ne doit pas attendre ces diagnostics associés. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH 2026, §III p. 6 imprimée : complications et sepsis</a>.</p>
<div class="quiz ui"><p>Le frottis montre 0,8 % de parasitémie. Que permet ce seul chiffre ?</p><button data-ok="0">Il exclut toute défaillance d’organe.</button><button data-ok="1">Il situe le prélèvement sous le seuil suisse de 2 %, mais la recherche des autres critères reste nécessaire.</button><button data-ok="0">Il prouve que tout paludisme à falciparum est déjà compliqué.</button><p class="fb" hidden>Un critère d’organe peut rendre l’infection grave malgré une parasitémie inférieure à 2 %. La décision dépend du patient entier.</p></div>
<button class="pareto-btn ui" data-k="pareto-b50-pa-comprendre">▲ Loi de Pareto — Infection, exposition et recherche de gravité</button>
<div class="key"><b>À retenir.</b> Le parasite est identifié. La gravité, les causes associées et la possibilité d’un traitement oral restent à établir.</div></section>
