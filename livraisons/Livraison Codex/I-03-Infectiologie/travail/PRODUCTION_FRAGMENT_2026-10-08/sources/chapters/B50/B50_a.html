<section class="ilot" id="b50-pa-0"><h2><span class="n">0</span>Question clinique : 0,8 % suffit-il à choisir un traitement oral ?</h2>
<p>Une personne adulte non enceinte de 70 kg présente une fièvre dix jours après un voyage. Le frottis identifie <em>Plasmodium falciparum</em> et une parasitémie de <b>0,8 %</b>. Aucune atteinte d’organe n’est rapportée et la prise orale est possible. Ces données permettent d’envisager une forme non compliquée, mais seulement après une <button class="w" data-k="b50-pa-gravite">recherche active de gravité (organes et capacité à prendre le traitement)</button>. Aucune glycémie, créatinine ou concentration d’hémoglobine normale n’est inventée pour ce cas.</p>
<p>Le médecin confirme l’évaluation clinique, obtient les paramètres biologiques utiles et organise un traitement sans retard évitable. Il vérifie aussi la destination, une éventuelle prophylaxie, les médicaments associés et l’accès aux contrôles. Le délai de dix jours après le voyage ne représente ni une durée de symptômes documentée, ni une date certaine de contamination. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse du 1er septembre 2026, p. 1 et 5 imprimées : triage et surveillance</a>.</p>
<div class="key"><b>À retenir.</b> Le frottis confirme une infection qui demande un traitement. Les 0,8 % ne dispensent pas de vérifier les organes et les conditions d’un parcours oral.</div></section>

<section class="ilot" id="b50-pa-1"><h2><span class="n">1</span>Définition : une infection à falciparum, trois sous-codes</h2>
<p>Le paludisme à <em>P. falciparum</em> est une infection parasitaire dont les manifestations cliniques proviennent des formes sanguines. La rubrique B50 de la Classification internationale des maladies, version CIM-10-GM 2024, inclut aussi une infection mixte comportant cette espèce. Le <button class="w" data-k="b50-pa-codage">codage B50.0, B50.8 ou B50.9 (complication documentée)</button> décrit le dossier ; il ne décide pas de l’urgence.</p>
<table class="t"><tr><th>Code</th><th>Libellé du cours</th><th>Lecture clinique</th></tr><tr><td>B50.0</td><td>Paludisme à falciparum avec complications cérébrales.</td><td>Le dossier établit une complication cérébrale.</td></tr><tr><td>B50.8</td><td>Autres formes sévères et compliquées de paludisme à falciparum.</td><td>Le dossier décrit une autre forme grave ou complication.</td></tr><tr><td>B50.9</td><td>Paludisme à falciparum, sans précision.</td><td>Le libellé ne garantit pas l’absence de gravité.</td></tr></table>
<p>Pour le cas, B50.9 peut accompagner un diagnostic encore sans complication caractérisée. La mention clinique « non compliqué après évaluation » doit être écrite séparément. Une complication cérébrale ultérieure ferait discuter B50.0 ; une autre défaillance grave, B50.8. Une mono-infection par une autre espèce ne relève pas de B50. Aucune équivalence automatique avec la CIM-11 n’est attribuée. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-b50-b64.htm#B50" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, B50.- : inclusions et sous-codes</a>.</p>
<div class="key"><b>À retenir.</b> L’espèce détermine le périmètre B50. La complication documentée détermine son sous-code ; la gravité se juge indépendamment.</div></section>

<section class="ilot" id="b50-pa-2"><h2><span class="n">2</span>Exposition : la fièvre après un voyage garde son urgence</h2>
<p>Le risque dépend des lieux réellement visités, de la saison, des activités et de la protection contre les moustiques. L’Office fédéral de la santé publique décrit une transmission par des anophèles qui piquent surtout le soir et la nuit. Il considère toute fièvre pendant ou après un séjour en zone d’endémie comme une urgence médicale. La <button class="w" data-k="b50-pa-exposition">chronologie du voyage (lieux, protection et délai)</button> reste utile même lorsque le frottis est déjà positif.</p>
<p>Les Centers for Disease Control and Prevention décrivent, pour le paludisme en général, une incubation souvent comprise entre 7 et 30 jours. Le délai est variable et une prophylaxie peut modifier la présentation. Le début de fièvre dix jours après le voyage est donc compatible avec une exposition, sans dater la piqûre. La consultation ne doit pas attendre une succession régulière de poussées fébriles. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la santé publique, Paludisme, page consultée le 8 octobre 2026</a> ; <a href="https://www.cdc.gov/malaria/hcp/clinical-features/index.html" target="_blank" rel="noopener" data-reference-source="1">Centers for Disease Control and Prevention, Clinical Features, 20 mars 2024</a>.</p>
<p>La page suisse renvoie à un tableau de déclarations actualisé chaque semaine. Aucun total annuel suisse récent n’est établi ici à partir d’une extraction complète ; une incidence suisse chiffrée ne serait donc pas justifiée. Pour le triage des cas importés, la recommandation suisse cite une cohorte rétrospective suédoise de 2 793 cas, suivis entre 1995 et 2015. Elle relie une parasitémie supérieure à 2 % et une prise en charge orale à un risque de progression ; ce résultat observationnel n’est ni une fréquence nationale suisse ni une preuve d’innocuité à 0,8 %. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse 2026, p. 1 imprimée, fondement du seuil et référence 2</a>.</p>
<div class="key"><b>À retenir.</b> La destination et la chronologie orientent le risque et le choix thérapeutique. Elles ne permettent jamais de différer le bilan d’une fièvre compatible.</div></section>

<section class="ilot" id="b50-pa-3"><h2><span class="n">3</span>Du parasite sanguin à la fièvre et aux défaillances</h2>
<p>Les globules rouges transportent normalement l’oxygène et circulent dans les petits vaisseaux. Après une phase hépatique, les parasites se multiplient dans ces cellules. La <button class="w" data-k="b50-pa-cycle">multiplication sanguine (formes asexuées et gamétocytes)</button> conduit à la rupture de cellules infectées. Les produits libérés stimulent une réponse inflammatoire qui contribue à la <button class="w" data-k="b50-pa-fievre">fièvre et aux frissons (réponse inflammatoire)</button>. La destruction et l’élimination des globules rouges peuvent provoquer une <button class="w" data-k="b50-pa-hematologie">anémie (perte de capacité de transport de l’oxygène)</button>.</p>
<p>Avec <em>P. falciparum</em>, des cellules infectées adhèrent à l’endothélium et se soustraient à la circulation libre. Cette <button class="w" data-k="b50-pa-sequestration">séquestration (microcirculation et atteinte d’organe)</button> participe aux complications, notamment cérébrales. Le frottis quantifie le sang périphérique ; il ne représente pas à lui seul toutes les cellules séquestrées. Une défaillance reste donc possible avec une valeur inférieure au seuil de 2 %. <a href="https://www.cdc.gov/malaria/hcp/clinical-features/index.html" target="_blank" rel="noopener" data-reference-source="1">Centers for Disease Control and Prevention, Clinical Features, 20 mars 2024 : formes sanguines, inflammation et séquestration</a>.</p>
<div class="trap"><span class="k">Piège</span>Une parasitémie de 0,8 % signifie une proportion de globules rouges parasités dans le prélèvement. Elle ne signifie ni « 0,8 % de risque » ni une garantie d’intégrité cérébrale ou rénale.</div>
<div class="key"><b>À retenir.</b> Le parasite sanguin provoque les symptômes ; la séquestration explique pourquoi le pourcentage périphérique ne suffit pas à mesurer la gravité.</div></section>

<section class="ilot" id="b50-pa-4"><h2><span class="n">4</span>Facteurs de risque : protection antérieure et immunité ne se présument pas</h2>
<p>Une exposition aux anophèles reste possible malgré une protection imparfaite ou une chimioprophylaxie. Le médecin vérifie le produit utilisé, les prises réellement effectuées et les vomissements éventuels. La <button class="w" data-k="b50-pa-prophylaxie">prophylaxie antérieure (échec et choix du traitement)</button> n’exclut pas le diagnostic ; elle peut aussi modifier le choix d’un antipaludique ou sa surveillance.</p>
<p>Une résidence passée en zone d’endémie peut s’accompagner d’une immunité partielle. Elle ne garantit pas la protection après une longue absence. La recommandation suisse souligne que cette <button class="w" data-k="b50-pa-immunite">immunité partielle (limites du triage)</button> n’est pas quantifiable de façon fiable. Elle ne sera pas attribuée au patient sur son apparence ou sur le seul mot « voyage ». La grossesse et le jeune âge exigent des parcours spécifiques ; le cas présent est adulte et non enceinte. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse 2026, p. 1–2 imprimées : immunité et prophylaxie antérieure</a> ; <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la santé publique, populations vulnérables</a>.</p>
<div class="key"><b>À retenir.</b> La protection antérieure, l’exposition et les médicaments se documentent. Aucune immunité partielle ne justifie spontanément un assouplissement du triage.</div></section>

<section class="ilot" id="b50-pa-5"><h2><span class="n">5</span>Anamnèse : symptômes ordinaires, signes qui changent l’urgence</h2>
<p>La fièvre, les frissons, les céphalées, les douleurs musculaires et le malaise sont des présentations fréquentes et peu spécifiques. Des nausées, vomissements ou diarrhées peuvent les accompagner. Leur fréquence relative n’est pas chiffrée dans les références retenues. Le médecin précise leur début et leur évolution, puis cherche les signes d’organe et la capacité à conserver un médicament oral.</p>
<div class="two"><div class="card"><h3>Présentation sans signe d’organe rapporté</h3><p>Le médecin décrit la fièvre et les frissons, sans exiger une périodicité. Il vérifie la prise alimentaire et les <button class="w" data-k="b50-pa-digestif">symptômes digestifs (tolérance du traitement oral)</button>. Une fatigue seule ne suffit pas à qualifier une prostration.</p></div><div class="card"><h3>Présentation qui impose une recherche urgente de défaillance</h3><p>Un proche peut signaler une confusion ou une convulsion. Le médecin demande une <button class="w" data-k="b50-pa-neuro">modification de conscience (atteinte cérébrale et glycémie)</button>, une <button class="w" data-k="b50-pa-respiration">dyspnée (hypoxie ou complication respiratoire)</button> et une <button class="w" data-k="b50-pa-rein">diminution des urines (fonction rénale)</button>.</p></div></div>
<p>Dans le cas, aucun de ces symptômes additionnels n’est attribué par défaut. Le médecin les recherche activement et obtient, si nécessaire, l’histoire d’un proche. Une fièvre d’allure banale ne remplace pas ce dépistage, car les défaillances peuvent apparaître rapidement. <a href="https://www.cdc.gov/malaria/hcp/clinical-features/index.html" target="_blank" rel="noopener" data-reference-source="1">Centers for Disease Control and Prevention, Clinical Features, 2024, présentation clinique</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse 2026, p. 1 imprimée : signes de gravité</a>.</p>
<div class="key"><b>À retenir.</b> L’anamnèse cherche d’abord les faits qui changent la voie de traitement. Une confusion, une dyspnée ou une impossibilité de prendre l’oral ne sont pas de simples symptômes accessoires.</div></section>

<section class="ilot" id="b50-pa-6"><h2><span class="n">6</span>Examen clinique : du patient observable aux organes</h2>
<p>L’examen commence par l’état général et la capacité à s’asseoir, se lever ou marcher sans aide. Le médecin mesure température, fréquence cardiaque, pression artérielle, fréquence respiratoire et oxygénation. Le poids de 70 kg est connu ; aucune autre mesure normale n’est présumée. Il examine ensuite les organes dont l’atteinte imposerait le parcours grave.</p>
<div class="two"><div class="card"><h3>Neurologie, respiration et perfusion</h3><p>Le médecin évalue la <button class="w" data-k="b50-pa-neuro">conscience (score et causes réversibles)</button> et recherche des convulsions. Il inspecte le travail respiratoire et mesure l’oxygénation. Il examine la <button class="w" data-k="b50-pa-perfusion">perfusion périphérique (choc même sans hypotension)</button>, notamment la recoloration cutanée et la température des extrémités.</p></div><div class="card"><h3>Rein, sang et prise orale</h3><p>Le médecin quantifie la <button class="w" data-k="b50-pa-rein">diurèse (mesure et seuil adulte)</button>. Il recherche pâleur, ictère ou saignement, puis les confronte au bilan sanguin. Il vérifie les <button class="w" data-k="b50-pa-digestif">vomissements répétés (obstacle à l’oral)</button> et l’aptitude à prendre le traitement.</p></div></div>
<p>Une pâleur ne chiffre pas l’anémie ; l’absence d’ictère ne prouve pas une bilirubine normale. Le bilan associe notamment glycémie, fonction rénale, hémoglobine, plaquettes et, selon la situation, marqueurs d’acidose. Chez un patient confus, la <button class="w" data-k="b50-pa-glycemie">glycémie immédiate (hypoglycémie et atteinte neurologique)</button> cherche une cause corrigible sans différer le traitement du paludisme grave. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse 2026, p. 1 et 6 imprimées : critères et complications</a>.</p>
<div class="key"><b>À retenir.</b> La gravité se recherche par l’observation, les constantes et la biologie. Une seule anomalie majeure peut suffire à changer le parcours.</div></section>

<section class="ilot" id="b50-pa-7"><h2><span class="n">7</span>Diagnostic : la preuve parasitaire ne clôt pas toutes les questions</h2>
<p>La <button class="w" data-k="b50-pa-microscopie">microscopie (goutte épaisse, frottis et parasitémie)</button> établit la présence des parasites, précise l’espèce et quantifie le prélèvement. La goutte épaisse augmente la sensibilité de détection ; le frottis mince aide à identifier l’espèce. Dans le cas, <em>P. falciparum</em> et 0,8 % sont déjà documentés. L’onglet Examens détaille les tests rapides, moléculaires et leurs limites.</p>
<p>Avant cette confirmation, un seul test négatif n’aurait pas toujours suffi si la suspicion persistait. Après confirmation, la priorité reste la gravité et le traitement. Une nouvelle altération peut aussi correspondre à un <button class="w" data-k="b50-pa-differentiels">autre processus urgent (sepsis ou cause neurologique associée)</button>. Le choc hypotensif doit notamment faire rechercher un sepsis bactérien associé. Une conscience altérée demande une glycémie et une évaluation neurologique, sans attribuer toute anomalie automatiquement au parasite. <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse 2026, p. 6 et 8 imprimées : sepsis associé et diagnostic</a>.</p>
<div class="quiz ui"><p>Le frottis du cas montre 0,8 % de parasitémie. Quelle conclusion autorise ce seul chiffre ?</p><button data-ok="0">Toute défaillance d’organe est exclue parce que la valeur est inférieure à 2 %.</button><button data-ok="1">Le seuil suisse d’hyperparasitémie n’est pas atteint ; les autres critères de gravité restent à rechercher.</button><button data-ok="0">La forme grave est certaine parce que tous les paludismes à falciparum sont graves.</button><p class="fb" hidden>Le seuil de 2 % est un critère de triage, parmi d’autres. Une atteinte cérébrale, respiratoire ou métabolique peut rendre la maladie grave avec une valeur plus basse. L’espèce impose la vigilance, sans rendre toutes ses infections compliquées.</p></div>
<button class="pareto-btn ui" data-k="pareto-b50-pa-comprendre">▲ Loi de Pareto — Infection, exposition et recherche de gravité</button>
<div class="key"><b>À retenir.</b> La preuve parasitaire confirme le diagnostic. Elle doit être suivie de la lecture des organes, des médicaments et des conditions de suivi.</div></section>
