<template data-pop="pareto-a15-p" data-title="Pareto — traitement et sécurité"><p class="ratio" data-cover="a15-p-1,a15-p-2,a15-p-3,a15-p-4"></p><ul><li>Le schéma national de la tuberculose sensible est 2HRZE/4HR ; son application dépend de la confirmation, de la résistance et du patient.</li><li>Rimstar, Rimactazid et Myambutol ont chacun une FI suisse exacte ; la dose en comprimés exige le poids et l'adéquation de l'association fixe.</li><li>Le guide national et les FI suisses divergent pendant la grossesse ; une équipe spécialisée doit choisir le produit après examen des textes.</li><li>Suivre foie, vision, interactions, observance et cultures selon la phase ; ne pas redémarrer une association fixe après toxicité sans réévaluation.</li></ul><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 7</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56768" target="_blank" rel="noopener" data-reference-source="1">FI Rimstar n°56768, 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56769" target="_blank" rel="noopener" data-reference-source="1">FI Rimactazid n°56769, 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33153" target="_blank" rel="noopener" data-reference-source="1">FI Myambutol n°33153, 2024</a>.</div></template>
<template data-pop="a15-p-detail" data-title="Tuberculose respiratoire — guide suisse et produits exacts"><div class="lab">Conditions de la matrice</div><p>Le guide national décrit la tuberculose sensible. La vignette n'a encore ni confirmation microbiologique ni résultat de résistance, et son poids n'est pas connu. Les lignes ci-dessous expliquent les produits possibles après diagnostic ; elles ne calculent aucune ordonnance pour cette personne.</p><table class="t"><thead><tr><th>Étape</th><th>Guide suisse 2024</th><th>FI du produit suisse réellement lue</th></tr></thead><tbody><tr><td>Phase initiale</td><td>Isoniazide, rifampicine, pyrazinamide et éthambutol chaque jour pendant deux mois. Tableau 7-1 : repères adultes respectifs 5, 10, 25 et 15 mg/kg/j, avec plages propres.</td><td>Rimstar n°56768, FI avril 2026 : chaque comprimé apporte respectivement 75, 150, 400 et 275 mg. Le produit convient à partir de 8 ans et 30 kg si ce rapport fixe est adapté. La FI donne 2 comprimés/j pour 30–37 kg, 3 pour 38–54 kg, 4 pour 55–70 kg et 5 dès 71 kg.</td></tr><tr><td>Continuation</td><td>Isoniazide et rifampicine chaque jour pendant quatre mois ; durée totale standard six mois.</td><td>Rimactazid 150/75 n°56769, FI avril 2026 : rifampicine 150 mg et isoniazide 75 mg par comprimé. La FI reprend les mêmes classes pondérales et quatre mois pour la phase de continuation. Elle vise l'adulte après la phase intensive.</td></tr><tr><td>Éthambutol isolé</td><td>Repère adulte du schéma standard : 15 mg/kg/j.</td><td>Myambutol n°33153, FI août 2024 : jusqu'à 25 mg/kg/j en phase initiale, 15 mg/kg/j en phase de stabilisation, toujours en association. La borne haute FI ne devient pas la dose standard de tous les patients. La FI demande un examen de l'acuité, du champ visuel et des couleurs avant traitement puis toutes les quatre semaines.</td></tr><tr><td>Grossesse et allaitement</td><td>Le chapitre 7.3 recommande le schéma standard pendant grossesse et allaitement.</td><td>Les FI Rimstar et Myambutol contre-indiquent le produit pendant grossesse ; la FI Rimactazid ne l'admet qu'en nécessité absolue. Pendant l'allaitement, les FI Rimstar et Rimactazid demandent son arrêt si le produit est indispensable ; la FI Myambutol demande l'arrêt avant et pendant le traitement. Une équipe spécialisée doit discuter ces conflits pour les produits réellement choisis.</td></tr></tbody></table><p>La FI Rimstar précise qu'à partir de 71 kg, cinq comprimés dépassent les plafonds usuels de 600 mg/j de rifampicine et 300 mg/j d'isoniazide. Elle admet cette classe sous surveillance particulière parce que les limites en mg/kg restent respectées selon son texte. Elle n'autorise pas à arrondir sans pesée, ni à maintenir une combinaison fixe en insuffisance d'organe ou en résistance quand ses composants ne conviennent plus.</p><div class="lab">Limites de la conduite</div><p>Le guide suisse demande les prélèvements, la recherche de résistance, le statut VIH, les fonctions hépatique et rénale et les médicaments associés avant traitement. Une résistance à la rifampicine déclenche confirmation et avis spécialisé ; les schémas résistants cités dans le manuel ne sont pas détaillés ici, faute de FI exactes consultées pour leurs produits. Les FI de spécialités individuelles d'isoniazide, rifampicine et pyrazinamide restent à vérifier avant toute substitution.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse/OFSP, Tuberculose en Suisse, v1.2024, ch. 7.1–7.3, tableau 7-1, p. 36–40</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56768" target="_blank" rel="noopener" data-reference-source="1">FI Rimstar n°56768, « Posologie », « Contre-indications », « Grossesse », avril 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56769" target="_blank" rel="noopener" data-reference-source="1">FI Rimactazid n°56769, mêmes rubriques, avril 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33153" target="_blank" rel="noopener" data-reference-source="1">FI Myambutol n°33153, « Posologie » et « Grossesse », août 2024</a>. Textes consultés le 8 octobre 2026.</div></template>
