<template data-pop="pareto-a15-e" data-title="Pareto — examens de la tuberculose respiratoire"><p class="ratio" data-cover="a15-e-0,a15-e-1,a15-e-2,a15-e-4"></p><ul><li>Symptômes et imagerie orientent vers une suspicion ; les prélèvements respiratoires sont nécessaires à la recherche de la maladie et de la résistance.</li><li>Frottis, amplification et culture répondent à des questions différentes. Un frottis acido-résistant ne nomme pas l'espèce ; la culture soutient l'étude de sensibilité.</li><li>IGRA et test cutané évaluent l'infection immunologique sans confirmer une tuberculose active.</li><li>La nomenclature A15 et les critères de surveillance OFSP n'emploient pas nécessairement la même notion de confirmation.</li></ul><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 6</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, déclaration 2026, fiche 58</a>.</div></template>
<template data-pop="a15-e-prelevement" data-title="Prélèvements : adapter le site et la méthode"><div class="lab">Suspicion pulmonaire</div><p>Le guide suisse décrit une première expectoration sur place pour amplification directe, puis un second prélèvement de qualité appropriée. L’expectoration induite ou des prélèvements bronchiques peuvent être envisagés si la personne ne produit pas d’expectoration spontanée ou si la question persiste. La vignette ne précise ni l’expectoration ni les prélèvements déjà faits.</p><div class="lab">Autre site</div><p>Un ganglion intrathoracique, une plèvre ou une autre lésion nécessite un échantillon du site pertinent. Une biopsie destinée aussi à la microbiologie ne doit pas être mise uniquement dans le formol ; le laboratoire doit être associé à l’organisation du prélèvement.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, Tuberculose en Suisse, V1.2024, chap. 6.1–6.2, pp. 31–32</a>, consulté le 08.10.2026.</div></template>

<template data-pop="a15-e-methodes" data-title="Trois méthodes, trois informations"><div class="lab">Microscopie</div><p>Un frottis positif montre des bacilles acido-résistants et suggère une charge bacillaire élevée ; il n’identifie pas seul le complexe tuberculeux.</p><div class="lab">Amplification et culture</div><p>L’amplification identifie rapidement des acides nucléiques du complexe et peut rechercher certaines mutations de résistance. La culture est généralement plus sensible et permet des épreuves phénotypiques de sensibilité. Les méthodes se complètent ; aucun de leurs résultats n’est connu dans le cas.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse 2024, chap. 6.3.1–6.3.3, pp. 32–34</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel de laboratoire, mars 2026, chap. 4–7</a>. Consultés le 08.10.2026.</div></template>

<template data-pop="a15-e-amplification" data-title="Amplification : ADN détecté, activité à contextualiser"><div class="lab">Atout</div><p>L’amplification directe peut détecter rapidement le complexe tuberculeux dans un échantillon respiratoire et certaines résistances. Le guide suisse indique qu’elle est plus sensible que la microscopie pour l’identification du complexe.</p><div class="lab">Limites</div><p>Les acides nucléiques détectés ne prouvent pas la viabilité des bacilles ; un test peut rester positif après traitement. Une négativité directe ne règle pas toute suspicion radioclinique : le guide décrit d’autres prélèvements et diagnostics selon le contexte. Elle ne remplace ni la culture de sensibilité ni le suivi microbiologique approprié.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse 2024, chap. 6.2–6.3.3, pp. 31–34</a>, consulté le 08.10.2026.</div></template>

<template data-pop="a15-e-igra" data-title="IGRA et test cutané : réponse immunitaire, pas maladie active"><p>Le guide OFSP–Ligue pulmonaire précise qu’un IGRA ou un test cutané positif traduit une réponse immunitaire à une infection antérieure, sans établir une tuberculose actuellement active ni des bacilles viables. Un résultat négatif n’exclut pas non plus la maladie. Chez la personne symptomatique du cas, imagerie et prélèvements répondent à la question d’activité ; aucun IGRA n’est fourni.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse 2024, chap. 6.1, p. 31</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide déclaration 2026, p. 116 : infection tuberculeuse non déclarée sur ce seul résultat</a>. Consultés le 08.10.2026.</div></template>

<template data-pop="a15-e-site" data-title="Localisation : une opacité ne suffit pas"><p>Le catalogue distingue tuberculose pulmonaire, ganglions intrathoraciques, voies aériennes, plèvre et autres organes respiratoires lorsque la preuve requise est obtenue. Le guide suisse adapte le prélèvement au site. Une opacité non détaillée n’autorise pas à déclarer une pleurésie, une adénopathie ou une atteinte laryngée chez la personne fictive.</p><div class="src"><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A15" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, A15</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse 2024, chap. 6.1–6.2</a>. Consultés le 08.10.2026. Le millésime BfArM 2024 correspond au catalogue historique MEDINA, pas à une certification de codage suisse 2026.</div></template>

<template data-pop="a15-e-codage" data-title="Forme confirmée et forme non confirmée : deux rubriques"><p>Dans le catalogue CIM-10-GM 2024 historique de MEDINA, A15 concerne la tuberculose des organes respiratoires confirmée bactériologiquement, par biologie moléculaire ou histologiquement ; A16 concerne la tuberculose respiratoire sans cette confirmation. Le choix dépend de la localisation et de la preuve effectivement obtenue. Les symptômes et l’opacité de la vignette ne suffisent pas à attribuer A15 ; ils ne fixent pas non plus d’emblée un code individuel A16. La classification de cas de surveillance OFSP suit ses propres critères et ne remplace pas les règles de codage du millésime suisse applicable.</p><div class="src"><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A15" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, A15–A16</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide déclaration 2026, définition de cas pp. 116–117</a>. Consultés le 08.10.2026.</div></template>

<template data-pop="a15-e-declaration" data-title="Tuberculose : deux déclarants et deux délais"><div class="lab">Médecin</div><p>La fiche OFSP 2026 prévoit une déclaration au médecin cantonal dans la semaine lorsque ses critères sont remplis, notamment début d’un traitement par au moins trois antituberculeux ou mise en évidence du complexe tuberculeux. Un simple IGRA ou test cutané positif d’infection tuberculeuse n’est pas une déclaration de maladie.</p><div class="lab">Laboratoire</div><p>Les résultats positifs de culture, d’analyse de séquences/amplification ou de microscopie sont déclarés à l’OFSP dans les 24 heures. La fiche demande également les résultats de résistance indiqués et l’envoi des isolats avec le résultat de résistance à la rifampicine au centre national. La vignette ne rapporte aucun résultat de laboratoire.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, fiche 58 « Tuberculose », pp. 116–117</a>, consulté le 08.10.2026.</div></template>
<template data-pop="a15-s-detail" data-title="De l'air partagé à l'alvéole">
  <div class="lab">Entrée respiratoire</div><p>Une personne atteinte de tuberculose pulmonaire peut émettre, en toussant ou en parlant, des particules contenant des bacilles vivants. Les plus petites peuvent rester longtemps dans l'air et atteindre les alvéoles d'une autre personne. Les macrophages alvéolaires les phagocytent, mais <i>M. tuberculosis</i> peut résister à leur destruction.</p>
  <div class="lab">Après l'entrée</div><p>Le devenir dépend de la réponse immunitaire : élimination, persistance contenue ou maladie. Une lésion thoracique peut concerner le parenchyme, les voies aériennes, la plèvre ou les ganglions intrathoraciques. Ces territoires ne sont pas interchangeables pour choisir un prélèvement.</p>
  <div class="lab">Pour la vignette</div><p>L'opacité pulmonaire est rapportée sans description anatomique détaillée. Elle ne prouve ni cavité, ni bacilles dans l'air expiré, ni autre localisation thoracique.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§3.1–3.4, pp. 14–16 ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener noreferrer">OFS, CIM-10-GM française 2024</a>, catégorie de tuberculose respiratoire confirmée, pp. 7–9/PDF 17–19. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a15-sc-anat" data-title="Le site suspect guide le prélèvement">
  <div class="lab">Site et preuve</div><p>Une opacité parenchymateuse suscite une recherche sur expectoration si elle est obtenable. Une lésion ganglionnaire, pleurale ou bronchique peut demander un matériel provenant de ce site. Le guide suisse distingue ces prélèvements parce que la quantité de bacilles et les autres causes d'image varient selon le tissu.</p>
  <div class="lab">Limite de l'image</div><p>La radiologie peut orienter la suspicion et localiser un prélèvement. Elle ne suffit pas à distinguer tuberculose active, maladie inactive, séquelle ou autre affection. Le cas ne fournit que le mot « opacité ».</p>
  <p class="src">Source : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §3.4, pp. 15–16, et §§6.1–6.2, pp. 31–32, lus le 08.10.2026.</p>
</template>
<template data-pop="a15-sc-histo" data-title="Granulome compatible, agent encore à établir">
  <div class="lab">Organisation tissulaire</div><p>Un granulome comporte notamment des macrophages épithélioïdes, parfois des cellules géantes, et des lymphocytes. Des cellules T produisent l'interféron gamma qui active les macrophages ; le facteur de nécrose tumorale participe au maintien de l'assemblage. Le centre peut présenter une nécrose.</p>
  <div class="lab">Spécificité limitée</div><p>Une nécrose granulomateuse peut aussi être liée à une infection fongique ou à une mycobactérie non tuberculeuse. Une tuberculose peut, à l'inverse, donner une réaction sans nécrose typique. L'histologie se confronte aux examens directs du tissu et à l'ensemble clinique ; aucune biopsie n'est connue dans la vignette.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, §3.1.1, pp. 26–27/PDF 27–28 ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9488688/fullTextXML" target="_blank" rel="noopener noreferrer">ERS, <i>Differential diagnosis of granulomatous lung disease</i>, 2017</a>, « Definition of granuloma », « Tuberculosis », « Fungal granuloma ». Textes intégraux lus le 08.10.2026.</p>
</template>
<template data-pop="a15-sc-physio" data-title="Trois étapes distinctes de la transmission">
  <div class="lab">Émission</div><p>Une maladie pulmonaire ou des voies aériennes non traitée peut libérer des bacilles dans l'air. Toux, expectoration et forte charge bacillaire augmentent le potentiel de transmission. Un frottis positif d'expectoration sert de marqueur de forte charge et de contagiosité relative ; il ne mesure pas les infections causées.</p>
  <div class="lab">Exposition</div><p>Le renouvellement de l'air et le temps passé dans un espace partagé modifient la dose potentiellement inhalée. Les petites particules peuvent rester en suspension même à distance de la source. Le guide suisse ne définit donc pas une distance universellement sûre en intérieur.</p>
  <div class="lab">Après inhalation</div><p>L'exposition ne conduit pas toujours à une infection ; une infection ne conduit pas toujours à une maladie. Une personne qui présente seulement une réponse immunologique sans maladie ne transmet pas la tuberculose. Aucune mesure de charge bacillaire ou d'exposition n'est disponible pour le cas.</p>
  <p class="src">Source : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§3.1–3.2, pp. 14–15, et §6.3.1, pp. 32–33, lus le 08.10.2026.</p>
</template>
<template data-pop="a15-sc-micro" data-title="Frottis, amplification et culture">
  <div class="lab">Frottis</div><p>La paroi lipidique des mycobactéries retient la coloration acido-alcoolo-résistante. Le frottis détecte des bacilles lorsqu'ils sont assez nombreux, mais cette propriété appartient aussi à des mycobactéries non tuberculeuses. Un frottis positif est donc présomptif.</p>
  <div class="lab">Amplification</div><p>Un test moléculaire ciblé peut identifier rapidement des acides nucléiques du complexe tuberculeux. Une faible quantité de bacilles ou un prélèvement inadéquat peut donner un résultat négatif malgré une maladie. Un résultat positif ne démontre pas que tous les bacilles détectés sont vivants, surtout après traitement.</p>
  <div class="lab">Culture</div><p>La culture isole des mycobactéries viables et permet des épreuves phénotypiques de sensibilité. Elle est généralement plus sensible que l'amplification directe, mais la croissance lente retarde le résultat final. Les trois méthodes se complètent selon le site et la question clinique.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§6.3.1–6.3.3, pp. 32–35 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, chap. 4–6, dont §4.1 sur la paroi et la coloration. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a15-sc-immuno" data-title="Une réponse immunitaire n'est pas une preuve d'activité">
  <div class="lab">Contrôle cellulaire</div><p>Les lymphocytes T sensibilisés produisent de l'interféron gamma, qui active les macrophages. Le facteur de nécrose tumorale contribue à organiser le granulome. Une atteinte des cellules CD4 ou de ces voies de signalisation peut réduire ce contrôle et favoriser l'évolution vers une maladie.</p>
  <div class="lab">Mesure indirecte</div><p>Le test cutané mesure une réaction à la tuberculine. Le test de libération d'interféron gamma mesure la réponse des cellules sanguines à une stimulation antigénique. Ils peuvent rester positifs après élimination des bacilles et ne distinguent pas infection persistante et maladie active. Un résultat négatif n'écarte pas à lui seul une maladie chez une personne symptomatique.</p>
  <div class="lab">Pour la vignette</div><p>Les tests et l'état immunitaire sont inconnus. La toux et l'opacité appellent l'étude de la maladie respiratoire par des prélèvements adaptés, sans inventer un test immunologique positif.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, glossaire p. 5 et §§3.2, 4.1–4.3, 6.1, pp. 14, 18–21, 31 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, §3.1.1, pp. 26–27/PDF 27–28. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a15-sc-gene" data-title="Une mutation cherchée ne couvre pas tous les médicaments">
  <div class="lab">Deux exemples</div><p>Des mutations dans la région examinée du gène <i>rpoB</i> sont associées à la résistance à la rifampicine. Des mutations de <i>katG</i> ou du promoteur <i>inhA</i> sont associées à la résistance à l'isoniazide. Le test Xpert MTB/RIF Ultra du guide suisse examine une région de <i>rpoB</i> ; il ne renseigne pas, seul, <i>katG</i> ou <i>inhA</i>.</p>
  <div class="lab">Portée du résultat</div><p>Un test ciblé ne cherche que les mutations inscrites dans son protocole. Des variants non couverts, une population bacillaire mixte ou une limite technique peuvent expliquer une discordance avec la sensibilité phénotypique. La culture et l'étude de sensibilité restent utiles ; l'absence de mutation détectée n'autorise pas à annoncer une sensibilité globale.</p>
  <div class="lab">Chaîne de transmission</div><p>Le séquençage peut rapprocher des isolats. Cette proximité soutient une enquête épidémiologique, mais elle n'établit pas seule qui aurait infecté qui. Aucun isolat n'a encore été obtenu dans la vignette.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§6.3.2–6.3.3, pp. 33–35 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, chap. 6 et 8, §10.3, pp. 60–72, 88–93, 107–108. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="pareto-a15-s" data-title="Sciences fondamentales : les repères qui expliquent le cas">
  <p>L'air partagé transporte des particules infectieuses jusque dans les alvéoles, où les macrophages rencontrent les bacilles. La réponse lymphocytaire peut contenir l'infection dans un granulome ; la morphologie de celui-ci ne suffit pas à identifier l'agent. La toux et l'opacité de la vignette justifient une recherche directe, sans confirmer encore une tuberculose.</p>
  <p>Le frottis voit des bacilles acido-alcoolo-résistants, l'amplification identifie des séquences ciblées et la culture isole des bactéries viables pour l'étude de sensibilité. Les tests immunologiques mesurent la mémoire de l'hôte ; les tests génétiques de résistance n'examinent que leurs cibles. Aucun de ces résultats n'est rapporté chez l'adulte fictif.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§3.1–3.4, 4.1–4.3 et 6.3 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, §§3.1.1 et chap. 4–8. Passages lus le 08.10.2026.</p>
</template>
