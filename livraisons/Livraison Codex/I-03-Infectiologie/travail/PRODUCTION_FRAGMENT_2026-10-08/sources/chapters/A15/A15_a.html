<section class="ilot" id="a15-0"><h2><span class="n">0</span>Une toux durable et une opacité thoracique : que sait-on ?</h2>
<p><b>Vignette fictive.</b> Un adulte présente une toux persistante, une perte de poids et une opacité pulmonaire décrite à l'imagerie. Le dossier ne précise ni durée chiffrée, ni aspect de l'opacité, ni constantes, ni exposition, ni comorbidité. Aucun prélèvement, résultat microbiologique, sensibilité ou traitement n'est connu. Une <button class="w" data-k="a15-pa-suspicion">tuberculose respiratoire est à envisager (suspicion, sans preuve encore)</button> parmi d'autres causes.</p>
<p>Le guide suisse rappelle qu'aucun symptôme ou cliché thoracique n'est à lui seul spécifique. La première question est donc double : <b>la personne présente-t-elle une maladie tuberculeuse, et peut-elle transmettre des bacilles par l'air ?</b> La <button class="w" data-k="a15-pa-confirmation">distinction entre maladie confirmée et maladie retenue sans confirmation (preuve et limite)</button> se décide après prélèvements adaptés et examen du tableau clinique ; elle ne se déduit pas du titre du chapitre.</p>
<div class="key"><b>Fil clinique.</b> Évaluer symptômes et gravité, rechercher une éventuelle contagiosité respiratoire et obtenir les échantillons pertinents. Les faits manquants de la <button class="w" data-k="a15-pa-detail">vignette fictive (liste et conséquences)</button> restent à documenter avant de qualifier la maladie et sa sensibilité.</div>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, <i>Tuberculose en Suisse</i>, V1.2024, ch. 3.3–3.4, pp. 15–16 ; ch. 6.1, p. 31 ; ch. 7.5, pp. 42–44</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A15" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, catégories respiratoires confirmée et non confirmée, nomenclature uniquement</a>.</div></section>

<section class="ilot" id="a15-1"><h2><span class="n">1</span>De l'infection silencieuse à la maladie des organes respiratoires</h2>
<p>La tuberculose est une maladie due à des bactéries du <button class="w" data-k="a15-pa-complexe">complexe <i>Mycobacterium tuberculosis</i> (agent et espèces)</button>. L'inhalation d'aérosols peut mener à une réponse immunitaire sans maladie, ou à une atteinte clinique et/ou radiologique, parfois après une longue période. Une <button class="w" data-k="a15-pa-infection">infection tuberculeuse sans maladie (réponse immunologique non contagieuse)</button> ne se confond pas avec la tuberculose qui exige une recherche de maladie active et, selon le site, de transmissibilité.</p>
<p>Le poumon et les voies aériennes forment le cœur clinique du cours. Les ganglions intrathoraciques et la plèvre sont aussi des localisations respiratoires dans la nomenclature du catalogue, mais la <button class="w" data-k="a15-pa-sites">pleurésie et les adénopathies thoraciques (site, preuve, contagiosité à distinguer)</button> ne se lisent pas comme une cavité pulmonaire bacillifère. Le guide suisse parle souvent de « forme extrapulmonaire » pour la plèvre au sens clinique ; cette différence de vocabulaire ne change ni l'examen nécessaire ni le sous-type anatomique du catalogue.</p>
<div class="trap"><span class="k">Piège</span> Une opacité radiologique, un test immunologique positif ou une suspicion forte ne sont pas en eux-mêmes une preuve bactériologique, moléculaire ou histologique. Le résultat d'un test et son prélèvement doivent toujours être rapportés au tableau clinique.</div>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.1–3.4, pp. 14–16 ; ch. 4.1, p. 18 ; ch. 6.1, p. 31</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A15" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, sous-types anatomiques et confirmation</a>.</div></section>

<section class="ilot" id="a15-2"><h2><span class="n">2</span>En Suisse, une maladie rare qui exige de rester attentif</h2>
<p>Le guide suisse V1.2024 rapporte <button class="w" data-k="a15-pa-epidemio">365 cas signalés en 2022, soit 4,16 pour 100 000 habitants (donnée datée, toutes formes)</button>. L'OFSP indique dans sa fiche de surveillance 2026 un ordre de grandeur de 300 à 500 cas déclarés chaque année en Suisse. Ces données ne mesurent pas uniquement les formes respiratoires confirmées ; elles ne doivent pas être transportées telles quelles à cette seule catégorie.</p>
<p>La probabilité préalable dépend de l'exposition et du contexte médical. Le guide suisse décrit notamment un risque accru de progression chez les jeunes enfants, les personnes avec VIH ou immunosuppression, ainsi que dans certaines affections chroniques. Le <button class="w" data-k="a15-pa-risque">pays d'origine ou de séjour, le contact antérieur et l'immunité (indices d'anamnèse, pas diagnostic)</button> aident à poser les bonnes questions ; aucune de ces informations n'est fournie pour l'adulte du cas fictif.</p>
<p>La tuberculose reste un enjeu européen, notamment pour les formes résistantes, mais les proportions régionales ne décrivent pas automatiquement la situation suisse ou le risque personnel de la vignette. La source européenne de surveillance 2026 analyse des <strong>données de 2024</strong> et sert ici à contextualiser, non à fixer une conduite suisse.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 2.1 p. 9 et ch. 3.2 p. 14</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration 2026, fiche 58 « Tuberculose », p. 117</a> ; <a href="https://www.ecdc.europa.eu/en/publications-data/tuberculosis-surveillance-and-monitoring-europe-2026-2024-data" target="_blank" rel="noopener" data-reference-source="1">ECDC–OMS Europe, surveillance 2026, données 2024, résumé exécutif</a>.</div></section>

<section class="ilot" id="a15-3"><h2><span class="n">3</span>Un bacille inhalé, une réponse immunitaire, plusieurs issues</h2>
<p>La transmission humaine habituelle se fait par des <button class="w" data-k="a15-pa-aerosols">aérosols contenant des bacilles vivants (air partagé et risque)</button> émis surtout par des personnes atteintes de tuberculose pulmonaire ou des voies aériennes. Le risque augmente avec la toux, une charge bacillaire respiratoire importante, une cavitation et l'exposition dans un espace clos peu ventilé. Une distance fixe dans la même pièce ne garantit donc pas l'absence d'exposition.</p>
<p>Après inhalation, les bacilles peuvent persister dans les macrophages et susciter des <button class="w" data-k="a15-pa-granulome">granulomes (contenance immunitaire et progression possible)</button>. La plupart des personnes infectées ne développent pas de maladie ; une minorité progresse, parfois sans symptômes marqués au départ. L'immunodépression augmente ce risque, mais la vignette ne la documente pas.</p>
<p>Une <button class="w" data-k="a15-pa-charge">microscopie respiratoire positive (indice de charge, sans identification d'espèce)</button> peut signaler un risque de transmission plus élevé et guider l'enquête d'entourage, mais il faut confirmer le complexe bactérien par les méthodes appropriées. La culture et les tests de résistance servent à caractériser la maladie et la réponse au traitement ; une PCR positive ne mesure pas à elle seule la viabilité après traitement.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.1–3.2, pp. 14–15 ; ch. 5.1, pp. 25–26 ; ch. 6.3, pp. 32–34 ; ch. 7.4, p. 42</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel laboratoire 2026, ch. 4 §4.1 et ch. 5–6</a>.</div></section>

<section class="ilot" id="a15-4"><h2><span class="n">4</span>Des signes discrets au poumon, des parcours distincts selon le site</h2>
<div class="two"><div class="card"><b>Parenchyme et voies aériennes.</b><p>La tuberculose pulmonaire peut progresser lentement avec <button class="w" data-k="a15-pa-symptomes">toux, expectorations peu abondantes et signes généraux (présentation variable)</button>. Les images peuvent montrer infiltrats asymétriques, micronodules ou cavités, sans être spécifiques. Une atteinte laryngée, trachéale ou bronchique demande aussi de caractériser son site et les prélèvements. Une forme respiratoire peut être peu symptomatique : l'intensité de la toux seule ne mesure pas la charge bacillaire.</p></div><div class="card"><b>Ganglions intrathoraciques et plèvre.</b><p>Une <button class="w" data-k="a15-pa-plevre">atteinte pleurale ou ganglionnaire intrathoracique (voie diagnostique propre)</button> peut accompagner ou non l'atteinte pulmonaire. Le guide suisse décrit la plèvre parmi les sites extrapulmonaires au sens clinique, alors que le catalogue la range avec les organes respiratoires. Un prélèvement de plèvre ou de ganglion peut être nécessaire selon l'image et la présentation ; aucun site de ce type n'est attribué à la vignette.</p></div></div>
<p>La nomenclature comprend également, parmi les autres sites respiratoires confirmés, le médiastin, les fosses nasales, les sinus et le nasopharynx. Ces localisations demandent de préciser le siège et d’obtenir un prélèvement adapté ; leur présence ne se déduit pas de l’opacité de la vignette. <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener" data-reference-source="1">OFS, CIM-10-GM 2024 française, A15.8, p. 8</a>.</p>
<p>Chez les personnes immunodéprimées, très jeunes ou âgées, les formes disséminées et les tableaux neurologiques sont plus à redouter. Ils changent le parcours et ne peuvent pas être résumés à une opacité pulmonaire. La distinction entre présentation anatomique, preuve microbiologique et capacité de transmission reste essentielle à chaque embranchement.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.3–3.4, pp. 15–16 ; ch. 6.1–6.2, pp. 31–32</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A15" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, nomenclature des sites respiratoires confirmés</a>.</div></section>

<section class="ilot" id="a15-5"><h2><span class="n">5</span>Une anamnèse qui relie la toux, l'exposition et le risque de résistance</h2>
<p>Préciser début, durée et évolution de la toux, les expectorations, la perte pondérale et d'autres symptômes généraux tels que fièvre, fatigue ou sueurs nocturnes. Rechercher <button class="w" data-k="a15-pa-exposition">les expositions prolongées dans l'air partagé (contact et lieu)</button>, les lieux de vie, les séjours dans des régions d'incidence élevée et d'éventuels diagnostics antérieurs. Ces questions servent à estimer la probabilité et à organiser, si nécessaire, la prévention autour d'un cas infectieux ; elles ne valent pas confirmation.</p>
<p>Demander un <button class="w" data-k="a15-pa-traitement-ancien">traitement antituberculeux antérieur (risque de résistance et continuité des soins)</button>, puis documenter VIH, autres immunosuppressions, diabète, maladie rénale ou hépatique, grossesse si pertinente et médicaments pris régulièrement. Ces données changent l'évaluation, la tolérance et les interactions thérapeutiques. Dans la vignette, elles sont toutes inconnues ; le cours n'attribue ni souche résistante ni immunodépression.</p>
<p>Le contexte d'exposition doit être abordé sans confondre pays d'origine et maladie. Selon le guide suisse, la suspicion repose sur l'ensemble épidémiologie, symptômes, examen et radiologie. Une anamnèse ouverte aide aussi à chercher d'autres causes de toux et d'opacité.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.2–3.3, pp. 14–15 ; ch. 5.1 pp. 25–27 ; ch. 7.1–7.2 pp. 36–39</a>.</div></section>

<section class="ilot" id="a15-6"><h2><span class="n">6</span>Examiner la personne avant d'interpréter la radiographie</h2>
<p>Documenter les <button class="w" data-k="a15-pa-constantes">constantes et l'état général (éléments absents de la vignette)</button>, l'effort respiratoire, l'auscultation pulmonaire et les signes cliniques suggérant une atteinte d'un autre site. Rechercher des adénopathies accessibles et, selon les symptômes, une atteinte pleurale ou d'autres organes. Aucun signe clinique n'est pathognomonique ; un examen peu parlant ne suffit pas à écarter une maladie lentement évolutive ou subclinique.</p>
<p>Relire l'opacité avec sa localisation, sa chronologie et d'éventuelles images antérieures : les infiltrats et cavités peuvent être évocateurs, mais l'image seule ne tranche pas entre activité, lésion ancienne et autre diagnostic. Une <button class="w" data-k="a15-pa-imagerie">radiographie ou TDM évocatrice (orientation, non confirmation)</button> conduit aux prélèvements adaptés, plutôt qu'à un étiquetage immédiat.</p>
<div class="alert"><b>Point de sécurité.</b> Dès qu'une tuberculose pulmonaire infectieuse est cliniquement suspectée, le guide suisse attribue au clinicien la responsabilité de décider des mesures d'isolement adaptées. Il faut apprécier symptômes, contexte et examens ; la vignette ne fournit pas encore les données pour affirmer ou exclure sa contagiosité. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 7.5.1, pp. 42–43</a>.</div>
