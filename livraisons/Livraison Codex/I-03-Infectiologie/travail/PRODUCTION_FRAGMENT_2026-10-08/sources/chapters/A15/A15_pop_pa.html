<template data-pop="pareto-a15-pa" data-title="Pareto — tuberculose respiratoire"><p class="ratio" data-cover="a15-7,a15-8,a15-9,a15-13"></p><ul><li>Une toux, une perte de poids et une opacité font suspecter une maladie respiratoire ; elles ne la confirment pas.</li><li>Évaluer immédiatement la gravité et le risque de transmission, puis prélever des échantillons adaptés ; la culture et la résistance guideront le traitement.</li><li>Une réponse immunitaire IGRA ou cutanée ne prouve pas la maladie active. Une PCR négative isolée ne l'exclut pas si la suspicion reste forte.</li><li>Le traitement d'une tuberculose sensible, la surveillance et la recherche des contacts suivent le guide national suisse et la situation réellement documentée.</li></ul><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3, 6–9</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, déclaration 2026, fiche 58</a>.</div></template>
<template data-pop="a15-pa-suspicion" data-title="Suspecter sans annoncer une tuberculose confirmée"><div class="lab">Le diagnostic reste ouvert</div><p>Une toux qui persiste, une perte de poids et une opacité pulmonaire rendent la tuberculose plausible. Le guide suisse précise qu'aucun symptôme ni aspect radiologique n'est pathognomonique : l'image ne sépare pas à elle seule une maladie active d'une séquelle ou d'une autre cause. L'exposition, l'examen clinique, des images antérieures et des prélèvements appropriés sont à obtenir.</p><p>La suspicion peut déjà justifier des précautions contre la transmission aérienne si une tuberculose pulmonaire infectieuse est envisagée ; la confirmation et la sensibilité ne doivent pas être inventées à ce stade.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire suisse, <i>Tuberculose en Suisse</i>, V1.2024, ch. 3.3–3.4 pp. 15–16 ; ch. 7.5.1 pp. 42–43</a>.</div></template>
<template data-pop="a15-pa-confirmation" data-title="Confirmation de la maladie respiratoire"><div class="lab">Preuve, site et usage des définitions</div><p>La nomenclature historique du catalogue distingue une tuberculose respiratoire confirmée bactériologiquement, moléculairement ou histologiquement d'une maladie respiratoire retenue sans cette confirmation. Une image ou un IGRA positif ne fournit pas cette preuve. Si la suspicion persiste malgré un premier résultat négatif, l'évaluation clinique et les prélèvements complémentaires restent nécessaires ; l'échec d'un test n'établit pas automatiquement une tuberculose non confirmée.</p><p>La surveillance OFSP utilise ses propres « cas confirmés/probables » : sa fiche 2026 place une PCR isolée ou la mise en évidence histologique de granulomes tuberculeux parmi les critères de laboratoire d'un cas probable, alors que la nomenclature du catalogue comprend des modalités de confirmation moléculaire ou histologique. La classification finale OFSP dépend aussi des critères cliniques et du traitement. Ne pas convertir l'un en l'autre automatiquement.</p><div class="src"><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A15" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, catégories respiratoires confirmée et non confirmée, nomenclature</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de déclaration 2026, fiche 58, « Définition de cas », p. 117</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 6.1–6.3 pp. 31–34</a>.</div></template>
<template data-pop="a15-pa-detail" data-title="Vignette fictive — faits connus et questions à compléter"><div class="lab">Aucune preuve microbiologique donnée</div><p>Connus : personne adulte, toux persistante, perte de poids, opacité pulmonaire décrite. Inconnus : durée chiffrée, aspect et ancienneté de l'image, constantes et examen, contact éventuel, autres symptômes, état immunitaire, traitement antérieur, prélèvements et sensibilité. Rien ne permet encore de qualifier une souche ou un degré de contagiosité.</p><p>La suite consiste à caractériser la maladie possible et les diagnostics différentiels, organiser les précautions respiratoires si le risque infectieux le justifie, puis recueillir des échantillons adaptés. Une décision thérapeutique dépend des résultats et de l'état réel de la personne.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.3–3.4 pp. 15–16 ; ch. 6.1–6.3 pp. 31–34 ; ch. 7.1 et 7.5 pp. 36, 42–44</a>.</div></template>
<template data-pop="a15-pa-complexe" data-title="Complexe Mycobacterium tuberculosis"><div class="lab">Identifier l'agent et la sensibilité</div><p>Le guide suisse présente la tuberculose comme due aux bactéries du complexe <i>M. tuberculosis</i>, qui comprend notamment <i>M. tuberculosis</i>, <i>M. bovis</i>, <i>M. africanum</i> et <i>M. canettii</i>. Les espèces n'ont pas toutes le même profil thérapeutique : le manuel relève, par exemple, la résistance naturelle de <i>M. bovis</i> au pyrazinamide. La vignette ne contient aucune identification d'espèce.</p><p>Un frottis acido-résistant positif ne nomme pas à lui seul le complexe ; l'identification moléculaire ou la culture et les tests de sensibilité complètent le raisonnement. Il serait donc abusif de déduire une souche sensible d'une image ou d'un seul frottis.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.1 p. 14, ch. 6.3 pp. 32–34, ch. 7.1 p. 38</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel laboratoire 2026, ch. 4 §4.1 et ch. 5–7</a>.</div></template>
<template data-pop="a15-pa-infection" data-title="Infection tuberculeuse sans maladie"><div class="lab">Une réponse immunitaire n'est pas une tuberculose active</div><p>Après une exposition, un test cutané ou un IGRA peut refléter une réponse immunitaire persistante en l'absence de manifestations cliniques, radiologiques ou microbiologiques de maladie. Le guide suisse appelle cet état « infection par <i>M. tuberculosis</i> » ; ces personnes ne sont pas malades ni contagieuses du seul fait de cette réponse. Une minorité progressera vers une maladie, avec un risque variable selon le temps et l'hôte.</p><p>Pour l'adulte qui tousse et a une opacité, un test immunologique positif ne suffit pas à confirmer l'origine de l'opacité ; un résultat négatif ne permet pas non plus d'exclure une tuberculose active si la suspicion est forte. Le guide OFSP 2026 exclut la déclaration du seul diagnostic ou traitement de cette infection immunologique.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.2 p. 14, ch. 4 pp. 18–24, ch. 6.1 p. 31</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de déclaration 2026, fiche 58 p. 116</a>.</div></template>
<template data-pop="a15-pa-sites" data-title="Poumon, ganglions thoraciques et plèvre"><div class="lab">Le site anatomique change la question clinique</div><p>La nomenclature suisse OFS de 2024 inclut, parmi les organes respiratoires confirmés, le poumon, le larynx/la trachée/les bronches, les ganglions intrathoraciques et la pleurésie. Elle inclut aussi d’autres sites respiratoires, notamment médiastin, nez, sinus et nasopharynx. Le guide clinique suisse désigne souvent la plèvre comme site « extrapulmonaire » pour son parcours diagnostique. Les deux formulations répondent à des objectifs différents ; ni l'une ni l'autre ne prouve une atteinte cavitaire du poumon.</p><p>Un tableau pleural ou ganglionnaire peut nécessiter des prélèvements du site concerné. Sa contagiosité doit être évaluée en recherchant une atteinte pulmonaire ou aérienne concomitante, les symptômes et les résultats respiratoires, plutôt que présumée à partir du classement administratif.</p><div class="src"><a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener" data-reference-source="1">OFS, CIM-10-GM 2024 française, A15, pp. 7–9</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.3–3.4 pp. 15–16 ; ch. 6.2 pp. 31–32</a>.</div></template>
<template data-pop="a15-pa-epidemio" data-title="Fréquence de la tuberculose en Suisse"><div class="lab">Toujours dater et nommer le dénominateur</div><p>Le manuel OFSP–Ligue pulmonaire V1.2024 indique **365 cas signalés en 2022**, soit **4,16 cas pour 100 000 habitants**. La fiche OFSP de déclaration 2026 résume la charge courante comme **300 à 500 cas déclarés chaque année en Suisse**. Le premier chiffre correspond à 2022 ; le second est une fourchette générale. Tous deux concernent la tuberculose en ensemble, pas uniquement les formes respiratoires confirmées.</p><p>La surveillance européenne ECDC–OMS 2026 rapporte les données de 2024 pour des régions plus larges et des définitions de surveillance propres. Elle contextualise la maladie et la résistance, sans fournir un risque individuel pour la personne fictive.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 2.1 p. 9</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de déclaration 2026, fiche 58 p. 117, « Charge de morbidité »</a> ; <a href="https://www.ecdc.europa.eu/en/publications-data/tuberculosis-surveillance-and-monitoring-europe-2026-2024-data" target="_blank" rel="noopener" data-reference-source="1">ECDC–OMS Europe, rapport 2026, données 2024</a>.</div></template>
<template data-pop="a15-pa-risque" data-title="Facteurs de progression et probabilité préalable"><div class="lab">Des indices à rechercher, jamais des étiquettes</div><p>Le guide suisse rapporte un risque de progression plus élevé après infection récente, chez les très jeunes enfants et chez les personnes avec VIH ou autre immunosuppression. Il cite aussi silicose, insuffisance rénale chronique, diabète, tabagisme et malnutrition. L'exposition antérieure, la durée des symptômes et l'incidence du lieu de séjour influencent la probabilité avant les tests.</p><p>Ces facteurs ne déterminent pas à eux seuls le diagnostic, ni la contagiosité. Il faut poser les questions avec précision et sans inférer l'histoire d'une personne à partir de sa nationalité. Aucun de ces facteurs n'est encore fourni dans la vignette.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.2–3.3 pp. 14–15 ; ch. 2.1 p. 9</a>.</div></template>
<template data-pop="a15-pa-aerosols" data-title="Transmission par aérosols et air partagé"><div class="lab">Une précaution fondée sur le risque respiratoire</div><p>Une personne ayant une tuberculose pulmonaire ou des voies aériennes non traitée peut émettre des particules contenant des bacilles vivants, notamment en toussant ou parlant. Les petites particules peuvent rester en suspension ; dans une pièce close peu ventilée, une distance fixe n'établit pas une zone sûre. Le risque croît avec durée de l'air partagé et concentration de bacilles.</p><p>Le guide suisse lie l'infectiosité notamment à la toux, aux expectorations bacillifères et aux cavités pulmonaires. Dans la vignette, la toux est connue mais ni charge bacillaire ni cavité ne sont établies. Le clinicien évalue les précautions respiratoires dès la suspicion pertinente, avant d'avoir une culture définitive.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.1 pp. 14–15, ch. 5.1 p. 25, ch. 7.5 pp. 42–44</a>.</div></template>
<template data-pop="a15-pa-granulome" data-title="Réponse immunitaire et granulome"><div class="lab">Une infection peut rester contenue ou devenir maladie</div><p>Après inhalation, les bacilles atteignent les alvéoles et sont phagocytés par les macrophages. Le guide suisse décrit leur persistance possible, la réponse inflammatoire et la formation de granulomes. Une personne peut éliminer l'agent ou garder une réponse immunitaire sans maladie ; une minorité développe une atteinte clinique et/ou radiologique. Le risque est particulièrement élevé dans les deux années suivant l'infection et lorsque l'immunité est altérée.</p><p>Cette histoire naturelle ne permet pas de dater l'infection d'une personne à partir d'un IGRA ni de conclure qu'un granulome histologique isolé est automatiquement dû au complexe tuberculeux. Le diagnostic relie site, contexte et microbiologie.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.1–3.2 p. 14</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel laboratoire 2026, ch. 3.1–3.1.1 pp. 25–26</a>.</div></template>
<template data-pop="a15-pa-charge" data-title="Ce que suggère un frottis respiratoire positif"><div class="lab">Indice d'infectiosité, preuve incomplète de l'espèce</div><p>La microscopie repère des bacilles acido-résistants lorsque la charge est suffisante. Le guide suisse utilise le frottis respiratoire pour évaluer l'infectiosité et organiser l'enquête d'entourage ; le risque de transmission est en général plus fort qu'en cas de culture ou PCR seule positives. Mais le frottis ne distingue pas à lui seul le complexe tuberculeux des mycobactéries non tuberculeuses, et un frottis négatif n'exclut pas une maladie paucibacillaire.</p><p>Une amplification moléculaire, la culture et les tests de sensibilité complètent l'interprétation. Aucun frottis n'est disponible pour la personne fictive.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 5.1 pp. 25–26 ; ch. 6.3 pp. 32–34</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel laboratoire 2026, ch. 4 §4.1</a>.</div></template>
<template data-pop="a15-pa-symptomes" data-title="Présentation clinique pulmonaire"><div class="lab">La discrétion des signes n'exclut pas la maladie</div><p>Le guide suisse décrit une maladie souvent lente, avec toux et expectorations parfois modestes, fièvre, malaise, fatigue, sueurs nocturnes, baisse d'appétit ou perte de poids. Les signes peuvent manquer ou être atypiques, notamment chez les personnes âgées ; une tuberculose subclinique est également possible. Aucun symptôme n'est pathognomonique.</p><p>Dans la vignette, seules toux persistante et perte de poids sont connues. Il faut encore interroger les autres symptômes, examiner et établir un diagnostic différentiel de l'opacité. L'image évocatrice n'est pas une preuve d'activité ou de sensibilité.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.2–3.4 pp. 14–16</a>.</div></template>
<template data-pop="a15-pa-plevre" data-title="Pleurésie et adénopathies intrathoraciques"><div class="lab">Le site oriente le prélèvement</div><p>Le catalogue des organes respiratoires confirmés contient une rubrique de pleurésie et une rubrique de ganglions intrathoraciques. Dans le langage clinique du guide suisse, la plèvre est souvent abordée avec les localisations extrapulmonaires. Une image médiastinale, hilaire ou pleurale peut mener à un prélèvement de ce site et parfois à une histologie ; elle ne prouve pas une cavité pulmonaire contagieuse.</p><p>Évaluer séparément une éventuelle atteinte pulmonaire concomitante et ses résultats respiratoires. Ni pleurésie ni adénopathie ne sont décrites dans la vignette.</p><div class="src"><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A15" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, rubriques pleurale et ganglionnaire intrathoracique, nomenclature</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.3–3.4 pp. 15–16 ; ch. 6.2 pp. 31–32</a>.</div></template>
<template data-pop="a15-pa-exposition" data-title="Air partagé, durée et enquête d'entourage"><div class="lab">L'histoire des contacts précise la probabilité</div><p>La transmission dépend de la concentration de bacilles dans l'air et de la durée d'exposition. Le guide suisse propose une enquête d'entourage sous la responsabilité du service cantonal pour les cas pulmonaires infectieux, graduée selon frottis positif, proximité, temps d'air partagé et vulnérabilité des contacts. Chez les enfants et les personnes immunodéprimées exposés, l'évaluation doit être rapide.</p><p>Pour la personne qui consulte, demander contacts rapprochés, lieux clos partagés et dates, sans présumer qu'un pays d'origine ou un cadre de vie prouve la maladie. Les mesures autour de contacts se décident avec le médecin cantonal et les équipes spécialisées si le cas est confirmé ou jugé infectieux.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.1 pp. 14–15 ; ch. 5.1–5.2 pp. 25–29 ; ch. 8.1 p. 46</a>.</div></template>
<template data-pop="a15-pa-traitement-ancien" data-title="Pourquoi documenter un traitement antérieur ?"><div class="lab">Résistance et schéma à réévaluer</div><p>Le guide suisse place le traitement antituberculeux antérieur, surtout incomplet ou sans effet, parmi les facteurs de risque de résistance. Avant de choisir un schéma, il demande de recueillir les échantillons, d'évaluer le risque de résistance en particulier à la rifampicine, de vérifier VIH, fonction hépatique et rénale et liste de médicaments réguliers. Une résistance suspectée ou prouvée exige des tests adaptés et un spécialiste.</p><p>La vignette ne renseigne ni antécédent de traitement ni résultat de résistance. Aucun schéma particulier ne peut en être déduit ; l'interrogatoire vise à obtenir ces faits.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 7.1–7.2 pp. 36–39</a>.</div></template>
<template data-pop="a15-pa-constantes" data-title="Examen initial de la personne"><div class="lab">Ne pas écrire « normal » avant de mesurer</div><p>Le dossier fictif ne donne ni température ni constantes, ni état respiratoire, ni auscultation. Il faut documenter l'état général, l'effort respiratoire, les signes thoraciques et, selon symptômes, les manifestations d'autres sites. La tuberculose peut être paucisymptomatique ou avoir une présentation non spécifique ; un examen sans signe pathognomonique n'écarte pas une maladie compatible.</p><p>L'examen sert également à juger la gravité et le lieu d'évaluation, pendant que l'imagerie et les prélèvements précisent le diagnostic. Les précautions respiratoires dépendent de la suspicion d'une forme infectieuse et du contexte, pas d'une constante supposée normale.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.3–3.4 pp. 15–16 ; ch. 6.1 p. 31 ; ch. 7.5 pp. 42–44</a>.</div></template>
<template data-pop="a15-pa-imagerie" data-title="Imagerie thoracique : orienter, puis prouver"><div class="lab">Une opacité n'est pas un test de confirmation</div><p>Le guide suisse décrit comme évocateurs certains infiltrats asymétriques des champs supérieurs, des cavités ou des micronodules, et souligne l'utilité possible de la tomodensitométrie pour de petites lésions. Il précise toutefois qu'aucune image n'est spécifique : les clichés ne suffisent pas à distinguer maladie active, inactive ou guérie. Une comparaison avec les images antérieures et des examens respiratoires sont nécessaires selon la situation.</p><p>Dans la vignette, l'opacité n'est pas caractérisée ; ni cavitation ni atteinte pleurale ne sont établies. Le prélèvement adapté au site et l'interprétation clinique sont les étapes suivantes.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide V1.2024, ch. 3.4 pp. 15–16 et ch. 6.1–6.2 pp. 31–32</a>.</div></template>
