<template data-pop="b24-galt" data-title="GALT : le compartiment intestinal du tissu lymphoïde">
  <p data-science-source="mehandru">Une remontée des CD4 sanguins ne démontre pas la restauration du GALT. Les biopsies de Mehandru concernent l’infection précoce ; elles ne définissent pas une indication chez M. L.</p>
  <p class="src"><a data-reference-source="1" href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0030484" target="_blank" rel="noopener">Mehandru et coll., 2006, texte primaire</a> ; <a data-reference-source="1" href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0030546" target="_blank" rel="noopener">correction bibliographique, 26.12.2006</a>. Consultés le 08.10.2026.</p>
</template>

<template data-pop="b24-follicule" data-title="Follicule : organisation, activation et perte de fonction">
  <p data-science-source="levesque">L’activation n’assure pas une coopération cellulaire efficace. L’histologie distingue prolifération, apoptose et désorganisation, sans déterminer seule la cause d’une adénopathie.</p>
  <p class="src"><a data-reference-source="1" href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1000107" target="_blank" rel="noopener">Levesque et coll., PLOS Medicine, 07.07.2009, étude primaire</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-fibrose" data-title="Réseau réticulaire et interleukine 7 : survie des cellules T">
  <p data-science-source="zeng">Les cellules réticulaires fibroblastiques fournissent un réseau de soutien et de l’interleukine 7, signal de survie. Le collagène peut limiter ce contact. La boucle de perte stromale décrite associe données humaines et simiennes ; elle n’établit pas l’efficacité clinique d’un antifibrotique.</p>
  <p class="src"><a data-reference-source="1" href="https://www.jci.org/articles/view/45157/pdf" target="_blank" rel="noopener">Zeng et coll., JCI 2011, résumé primaire accessible</a>, consulté le 08.10.2026 ; le fichier PDF complet n’a pas été lu.</p>
</template>

<template data-pop="b24-cd4-fonction" data-title="CD4 normal : aider la reconnaissance et la signalisation T">
  <p data-science-source="yin">Le récepteur T reconnaît le peptide ; CD4 se lie à la molécule de classe II qui le présente. Son association à Lck renforce la signalisation. Le VIH exploite cette molécule pour entrer, sans que sa fonction normale consiste à reconnaître le virus.</p>
  <p data-science-source="yin">La structure expérimentale utilise un CD4 modifié pour stabiliser la liaison ; elle ne mesure pas l’efficacité immunitaire d’un patient.</p>
  <p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325661/" target="_blank" rel="noopener">Yin et coll., PNAS, 19.03.2012, texte primaire</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-cd4-mesure" data-title="CD4 : compte absolu, pourcentage et repère de laboratoire">
  <p>Les <b>86 cellules/µL</b> de M. L. sont un compte absolu. Son pourcentage n’est pas fourni : ne pas l’inventer. Les conditions de mesure et l’exemple de référence suisse adulte figurent dans les Examens.</p>
  <div class="key">Ce résultat décrit la situation initiale de M. L. ; aucune valeur de suivi n’est fournie.</div>
  <p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325661/" target="_blank" rel="noopener">Yin et coll., PNAS 2012, fonction du corécepteur CD4</a>, consulté le 08.10.2026. Pour les références de laboratoire, lire la fenêtre « CD4 : mesure cellulaire et référence suisse datée » des Examens.</p>
</template>

<template data-pop="b24-entree" data-title="Entrée : CD4, CCR5, CXCR4 et fusion par gp41">
  <p data-science-source="shaik">gp120 engage CD4 puis un corécepteur compatible ; gp41 permet la fusion. Les virus R5 utilisent CCR5, les virus X4 CXCR4 ; certains utilisent les deux. Une valeur basse de CD4 ne révèle pas ce tropisme et n’établit pas l’activité d’un blocage de CCR5.</p>
  <p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6391877/" target="_blank" rel="noopener">Shaik et coll., Nature, en ligne 12.12.2018, numéro 2019, texte primaire</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-cycle" data-title="Cycle du VIH-1 : suivre la cible plutôt que mémoriser une liste">
  <p data-science-source="centazzo">L’ARN devient ADN proviral, puis permet de nouveaux ARN et protéines. Bloquer ces réactions ne démontre pas la disparition des cellules infectées.</p>
  <p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10053624/" target="_blank" rel="noopener">Centazzo et coll., Viruses, 09.03.2023, revue du cycle</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7357238/" target="_blank" rel="noopener">Passos et coll., 2020, intégration</a>. Consultés le 08.10.2026.</p>
</template>

<template data-pop="b24-rt" data-title="Transcriptase inverse : fabriquer l’ADN et distinguer les inhibiteurs">
  <p data-science-source="kellinger">L’enzyme ajoute des nucléotides à la chaîne d’ADN. Les analogues nucléos(t)idiques doivent disposer d’une forme intracellulaire active ; leur incorporation peut interrompre l’allongement. Les inhibiteurs non nucléosidiques utilisent un autre site. Les mesures enzymatiques de Kellinger éclairent la discrimination des substrats, sans prédire seules une réponse clinique.</p>
  <p class="src"><a data-reference-source="1" href="https://www.pnas.org/doi/full/10.1073/pnas.0913946107" target="_blank" rel="noopener">Kellinger et Johnson, PNAS, 12.04.2010, étude cinétique primaire</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-integrase" data-title="Intégrase : empêcher une insertion, sans exciser le provirus">
  <p data-science-source="passos">L’intasome associe l’intégrase aux extrémités de l’ADN viral. L’inhibiteur du transfert de brin bloque leur jonction à l’ADN cellulaire. Il ne coupe pas un provirus déjà inséré : son activité antivirale et l’élimination du réservoir sont des objectifs différents.</p>
  <p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7357238/" target="_blank" rel="noopener">Passos et coll., Science 2020, structures d’intasomes et essais biochimiques</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-protease" data-title="Protéase : faire mûrir une particule déjà assemblée">
  <p data-science-source="centazzo">La découpe des précurseurs Gag et Gag-Pol permet une maturation normale. Bloquer la protéase interrompt cette étape, sans désinfecter directement la cellule porteuse d’un provirus silencieux.</p>
  <p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10053624/" target="_blank" rel="noopener">Centazzo et coll., Viruses, 09.03.2023, revue virologique</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-reservoir" data-title="Latence et clonalité : pourquoi le contrôle ne démontre pas une guérison">
  <p data-science-source="mcmyn">L’ADN viral peut persister dans une cellule et ses descendantes malgré un traitement prolongé. Sa détection ne prouve pas sa compétence ; un prélèvement négatif ne démontre pas son absence partout.</p>
  <p class="src"><a data-reference-source="1" href="https://www.jci.org/articles/view/171554" target="_blank" rel="noopener">McMyn et coll., JCI, 18.07.2023, texte primaire</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-pyroptose" data-title="Pyroptose : relier mort cellulaire et inflammation, avec la limite du modèle">
  <p data-science-source="doitsh">La pyroptose libère des contenus cellulaires et des médiateurs inflammatoires. Doitsh l’étudie surtout dans des cultures de tissus lymphoïdes humains. Le chiffre majoritaire de ce modèle ne signifie pas que la même proportion explique la perte totale des CD4 d’un patient.</p>
  <p class="src"><a data-reference-source="1" href="https://stacks.cdc.gov/view/cdc/29985/cdc_29985_DS1.pdf" target="_blank" rel="noopener">Doitsh et coll., Nature, 23.01.2014, manuscrit auteur public</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-translocation" data-title="Translocation microbienne : inflammation et diagnostic de fièvre restent distincts">
  <p data-science-source="brenchley">Des produits microbiens traversant une barrière altérée peuvent stimuler les monocytes et entretenir l’activation. Le lipopolysaccharide étudié est un indice de ce mécanisme ; il ne désigne pas le foyer d’une fièvre et n’exclut pas une infection opportuniste.</p>
  <p class="src"><a data-reference-source="1" href="https://link.springer.com/article/10.1186/1742-4690-3-S1-S98" target="_blank" rel="noopener">Brenchley, Retrovirology, 21.12.2006, résumé primaire d’une communication</a>, consulté le 08.10.2026 ; le texte intégral de l’article Nature Medicine correspondant n’a pas été lu.</p>
</template>

<template data-pop="b24-iris-mecanisme" data-title="IRIS : réponse restaurée face à des antigènes persistants">
  <p data-science-source="boulware">La restauration d’une réponse peut amplifier l’inflammation contre une infection ou ses antigènes. L’étude de Boulware concerne la méningite cryptococcique : ses profils de cytokines ne constituent pas une signature diagnostique universelle, et sa fréquence d’IRIS ne s’applique pas au fil clinique de M. L.</p>
  <p class="src"><a data-reference-source="1" href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1000384" target="_blank" rel="noopener">Boulware et coll., PLOS Medicine, 21.12.2010, cohorte primaire</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-iris-differentiel" data-title="Avant de conclure à un IRIS : infection, traitement et toxicité">
  <p data-science-source="eacs-iris">La définition EACS de l’IRIS exige de distinguer une aggravation paradoxale ou un démasquage d’une évolution attendue de l’infection opportuniste, traitée ou non, et d’une toxicité médicamenteuse. Des signes inflammatoires objectivables et la gravité guident l’évaluation. En règle générale, l’EACS poursuit le traitement spécifique et l’ART pendant l’IRIS ; les situations graves demandent une décision spécialisée.</p>
  <p class="src"><a data-reference-source="1" href="https://eacs.sanfordguide.com/e9ccb1296ed04c91be59234de5789ccb" target="_blank" rel="noopener">EACS, « Immune Reconstitution Inflammatory Syndrome », 06.10.2025, définition et traitement général</a>, consultée le 08.10.2026. Les formes cryptococcique, tuberculeuse et neurologique ont des dispositions propres ; aucune n’est diagnostiquée chez M. L.</p>
</template>

<template data-pop="b24-barriere" data-title="Barrière génétique : mutations, coût biologique et exposition réelle">
  <p data-science-source="mesplede">Une mutation résistante peut altérer l’enzyme et réduire la capacité de réplication. D’autres changements peuvent modifier ce compromis. L’expérience de Mesplède illustre un coût de certaines associations de mutations ; elle ne permet pas d’annoncer une impossibilité de résistance au dolutégravir.</p>
  <p class="src"><a data-reference-source="1" href="https://link.springer.com/article/10.1186/1742-4690-10-22" target="_blank" rel="noopener">Mesplède et coll., Retrovirology, 22.02.2013, étude primaire expérimentale</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-genotype-phenotype" data-title="Génotype et phénotype : prédire une sensibilité ou la mesurer">
  <p data-science-source="eacs-failure">Le génotype lit les substitutions détectables dans les régions virales analysées ; un essai phénotypique mesure la sensibilité d’un virus au médicament dans ses conditions expérimentales. Selon l’EACS, le clinicien revoit tous les génotypes antérieurs : des mutations archivées peuvent ne plus apparaître dans le prélèvement actuel. Il vérifie aussi observance et interactions avant d’attribuer un échec à une mutation.</p>
  <p class="src"><a data-reference-source="1" href="https://eacs.sanfordguide.com/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener">EACS, « Virological Failure », 09.10.2025, mesures générales et génotypes historiques</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/1742-4690-10-22" target="_blank" rel="noopener">Mesplède et coll., Retrovirology, 22.02.2013, essai primaire de sensibilité</a>. Consultés le 08.10.2026 ; l’essai expérimental ne prédit pas seul la réponse de M. L.</p>
</template>

<template data-pop="b24-vih2" data-title="VIH-2 : ne pas transposer automatiquement les outils du VIH-1">
  <p data-science-source="ren">La transcriptase inverse du VIH-2 diffère notamment dans la poche des inhibiteurs non nucléosidiques. Cette différence explique une résistance intrinsèque à cette classe ; « même enzyme cible » ne signifie pas « même sensibilité ».</p>
  <p data-science-source="eacs-hiv2 ofsp-hiv">L’EACS demande une quantification d’ARN et un génotypage propres au VIH-2 dans des laboratoires spécialisés ; un ARN VIH-2 indétectable peut aussi survenir sans ART. La directive OFSP indique qu’un algorithme courant peut ne détecter que le VIH-1 lors d’une infection mixte. Si celle-ci est suspectée, le Centre national de référence pour les rétrovirus peut préciser les deux types par anticorps ou détection d’acides nucléiques.</p>
  <p class="src"><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/12386343/" target="_blank" rel="noopener">Ren et coll., PNAS 2002, résumé primaire réellement lu</a> ; <a data-reference-source="1" href="https://eacs.sanfordguide.com/0afde39c61e6482ab566f3aa9fc09fcd" target="_blank" rel="noopener">EACS, « HIV-2 », 18.11.2025, diagnostic et suivi spécifiques</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener">OFSP, directive de dépistage du VIH, v4 du 10.07.2026, section 4, infection mixte et CNR</a>. Consultés le 08.10.2026.</p>
</template>

<template data-pop="b24-pareto-sciences" data-title="Pareto — Sciences fondamentales du VIH de l’adulte">
  <p>Pour raisonner au lit du patient, relier la mesure au mécanisme qu’elle renseigne.</p>
  <ul><li>Les CD4 absolus et leur pourcentage sont distincts ; lire leurs repères dans les Examens.</li><li data-science-source="mehandru">Le sang ne mesure pas directement la restauration du tissu lymphoïde intestinal.</li><li data-science-source="mcmyn eacs-failure">Une suppression plasmatique ne démontre pas l’élimination du réservoir ; elle ne justifie pas un arrêt autonome.</li><li data-science-source="eacs-iris">Une aggravation après traitement demande d’exclure les autres causes avant de retenir un IRIS.</li><li data-science-source="eacs-failure">Les résistances s’interprètent avec les résultats antérieurs.</li><li data-science-source="eacs-hiv2 ofsp-hiv">Le VIH-2 exige des outils adaptés ; les conclusions du VIH-1 ne se transposent pas automatiquement.</li></ul>
  <div class="key">Chez M. L., garder ensemble les symptômes, les 86 CD4/µL et les 180 000 copies/mL. Aucun de ces éléments ne remplace les deux autres.</div>
  <p class="src">Références : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325661/" target="_blank" rel="noopener">Yin 2012</a> ; <a data-reference-source="1" href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0030484" target="_blank" rel="noopener">Mehandru 2006</a> ; <a data-reference-source="1" href="https://www.jci.org/articles/view/171554" target="_blank" rel="noopener">McMyn 2023</a> ; <a data-reference-source="1" href="https://eacs.sanfordguide.com/e9ccb1296ed04c91be59234de5789ccb" target="_blank" rel="noopener">EACS IRIS 2025</a> ; <a data-reference-source="1" href="https://eacs.sanfordguide.com/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener">EACS échec virologique 2025</a> ; <a data-reference-source="1" href="https://eacs.sanfordguide.com/0afde39c61e6482ab566f3aa9fc09fcd" target="_blank" rel="noopener">EACS VIH-2 2025</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener">OFSP dépistage VIH v4, 2026</a>. Consultées le 08.10.2026.</p>
</template>
