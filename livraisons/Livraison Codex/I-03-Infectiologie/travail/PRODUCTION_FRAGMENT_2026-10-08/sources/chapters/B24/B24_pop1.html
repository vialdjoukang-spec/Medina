<template data-pop="b24-pa-vih" data-title="VIH : infection persistante et contrôle thérapeutique"><div class="lab">Sens clinique</div><p>Le VIH attaque les globules blancs et affaiblit le système immunitaire ; le sida désigne le stade le plus avancé de l’infection. Il n’existe pas de traitement curatif, mais l’accès à la prévention, au diagnostic, au traitement et aux soins des infections opportunistes fait de l’infection une maladie chronique contrôlable, compatible avec une vie longue.</p><div class="lab">Application à M. L.</div><p>La confirmation du VIH-1 établit l’infection. La candidose et les 86 CD4/µL imposent d’examiner les complications et les besoins de prévention ; ils ne désignent ni la cause de chaque symptôme ni la date de la contamination.</p><div class="lab">Source</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-primo" data-title="Primo-infection : définition et stades selon EACS 13"><div class="lab">Définition</div><p>Exposition à haut risque dans les 6 semaines précédentes et virus détectable dans le plasma (antigène p24 ou ARN), ou anticorps en cours d’apparition (négatifs ou indéterminés devenant positifs), avec ou sans symptômes. En cas de séroconversion complète, un test négatif dans les 6 derniers mois est requis.</p><div class="lab">Classification</div><p>Infection aiguë : virus détecté sans anticorps. Infection récente : anticorps présents, jusqu’à 6 mois après l’infection. L’ARN apparaît vers le 11<sup>e</sup> jour, environ 7 jours avant l’antigène p24 et 12 jours avant les anticorps ; chez une personne sous PrEP, ces stades peuvent être retardés.</p><div class="lab">Conduite</div><p>Le traitement est recommandé dans tous les cas, avant le résultat du génotype, par ténofovir avec emtricitabine ou lamivudine et un inhibiteur de l’intégrase de deuxième génération ; une bithérapie n’est pas recommandée avant le génotype. Une fois commencé, le traitement doit être poursuivi.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/resolveuid/b74f67fa130d469c92a201f82894fa25" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary HIV Infection</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-tardif" data-title="Présentation tardive : la définition européenne"><div class="lab">Deux définitions consensuelles</div><p>Présentation tardive : premier recours aux soins avec des CD4 &lt;350/µL, ou événement définissant le sida quel que soit le chiffre de CD4. Présentation avec maladie avancée : CD4 &lt;200/µL, ou événement définissant le sida quel que soit le chiffre de CD4. Le groupe de travail européen souhaitait que toutes les agences nationales utilisent ces définitions pour comparer les données.</p><div class="lab">Pourquoi cela compte</div><p>Selon ce consensus, près d’un tiers des personnes infectées en Europe n’entraient dans les soins qu’à un stade tardif. M. L., avec 86 CD4/µL, appartient aux deux catégories.</p><div class="lab">Source</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/20561080/" target="_blank" rel="noopener" data-reference-source="1">Antinori et coll., European Late Presenter Consensus Working Group, HIV Medicine 2011, résumé lu le 8 octobre 2026</a>.</p></template>

<template data-pop="b24-pa-epidemio" data-title="Cascade de soins suisse 2024"><div class="lab">Les chiffres</div><p>Environ 17 690 personnes vivaient avec le VIH en Suisse en 2024 selon l’estimation de l’OFSP ; 16 410 étaient diagnostiquées (93 %), 16 060 traitées (98 % des diagnostiquées) et 15 480 avaient une charge virale inférieure à 50 copies/mL (96 % des traitées). La première proportion repose sur une modélisation fondée sur une estimation de 2018 ; les suivantes proviennent surtout de la Swiss HIV Cohort Study.</p><div class="lab">Lecture</div><p>Un taux de diagnostic de 93 % signifie qu’environ 7 % des infections restent méconnues. L’OFSP attribue la baisse des cas au dépistage ciblé, au traitement précoce, au suivi régulier et à la PrEP. Un nombre national bas ne dispense pas de proposer un test devant une indication clinique.</p><div class="lab">Source</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025, figure 1, état au 17 février 2025</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-shcs" data-title="Swiss HIV Cohort Study"><div class="lab">Une cohorte nationale</div><p>Fondée en 1988, la Swiss HIV Cohort Study est une étude de cohorte prospective et longitudinale nationale qui inclut des personnes vivant avec le VIH en Suisse. Elle réunit tous les hôpitaux universitaires, de grands hôpitaux cantonaux et leurs laboratoires, des hôpitaux plus petits et des médecins installés. La cohorte suisse mère-enfant (MoCHiV), consacrée à la prévention de la transmission verticale, y est intégrée.</p><div class="lab">Utilité pour le clinicien</div><p>Ses données alimentent la cascade de soins de l’OFSP ; l’OFSP lui attribue une part du recul des nouveaux cas grâce à un traitement conforme aux connaissances récentes et à une observance élevée.</p><div class="lab">Sources</div><p><a href="https://www.shcs.ch/" target="_blank" rel="noopener" data-reference-source="1">Swiss HIV Cohort Study, site officiel</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-sciences" data-title="Physiopathologie : où trouver les mécanismes"><div class="lab">Dans l’onglet Sciences</div><p>Entrée du virus par CD4 et CCR5 ou CXCR4 ; transcription inverse, intégration et maturation, qui expliquent les cibles des médicaments ; déplétion précoce des CD4 du tissu lymphoïde intestinal ; mort cellulaire par pyroptose ; translocation microbienne et activation chronique ; réservoir latent qui explique l’absence de guérison ; mécanisme de l’IRIS ; barrière génétique et résistance ; particularités du VIH-2. Chaque mécanisme y est rattaché à son étude primaire.</p></template>

<template data-pop="b24-pa-transmission" data-title="Transmission : liquide infectant et facteurs de risque"><div class="lab">Voies</div><p>Le VIH se transmet par l’échange de liquides biologiques d’une personne infectée : sang, lait maternel, sperme et sécrétions vaginales, ainsi que de la mère à l’enfant pendant la grossesse et l’accouchement. Le contact quotidien ordinaire, comme les baisers, les accolades, la poignée de main ou le partage d’objets, de nourriture ou d’eau, ne le transmet pas.</p><div class="lab">Facteurs de risque selon l’OMS</div><p>Rapports anaux ou vaginaux sans préservatif ; autre infection sexuellement transmissible, par exemple syphilis, herpès, chlamydia, gonorrhée ou vaginose bactérienne ; usage nocif d’alcool ou de drogues en contexte sexuel ; partage d’aiguilles, de seringues ou de matériel d’injection ; injections, transfusions ou greffes non sûres ; actes médicaux non stériles ; piqûres accidentelles, y compris chez les soignants.</p><div class="lab">Source</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, 27 juillet 2026</a>, consulté le 8 octobre 2026. Pour les piqûres d’aiguille, la Suisse renvoie à la publication Suva 2865.f, que la directive OFSP cite.</p></template>

<template data-pop="b24-pa-anamnese" data-title="Anamnèse de la première consultation selon EACS 13"><div class="lab">Contenu</div><p>Antécédents médicaux, y compris psychiatriques ; antécédents familiaux, notamment cardiovasculaires ; médicaments à chaque visite ; PrEP antérieure ; vaccinations ; alcool, substances et tabac ; emploi, situation sociale, violences et abus ; partenaires et enfants ; histoire sexuelle, rapports protégés, statut des partenaires et information de ceux-ci ; projet de grossesse.</p><div class="lab">Comment la mener</div><p>Les questions portent sur les pratiques et les expositions, pas sur l’identité. Une réponse « pas de risque » peut refléter une compréhension différente des mots et mérite une clarification respectueuse. Chez M. L., aucune voie de contamination n’est fournie : les questions servent au choix des prélèvements, à la prévention et au suivi.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment of Initial &amp; Subsequent Visits</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-prep-pep" data-title="PrEP, PEP et traitement : trois objectifs différents"><div class="lab">Définitions</div><p>La PrEP est prise avant des expositions par une personne sans VIH ; la PEP est prise après une exposition ; le traitement vise le contrôle durable d’une infection confirmée.</p><div class="lab">Pourquoi demander l’historique</div><p>Les stades de la primo-infection peuvent être retardés sous PrEP. Une infection survenue sous PrEP peut porter des mutations de résistance : EACS 13 impose alors un traitement triple à haute barrière, avec darunavir potentialisé après une PrEP par cabotégravir injectable. Le nom du produit, ses dates et la dernière prise comptent ; le patient peut ne pas nommer ce médicament « traitement VIH ».</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/resolveuid/b74f67fa130d469c92a201f82894fa25" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary HIV Infection</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initial Regimens</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-candidose" data-title="Candidose orale : diagnostic et conséquences"><div class="lab">Diagnostic selon EACS 13</div><p>La candidose oropharyngée se reconnaît à son aspect clinique typique. L’œsophagite est présumée devant une dysphagie récente associée à une candidose oropharyngée ; elle est certaine si l’endoscopie, la biopsie ou la cytologie d’un prélèvement de muqueuse la démontrent.</p><div class="lab">Conséquences</div><p>Chez une personne non traitée, une candidose orale suffit à indiquer la prophylaxie de la pneumocystose et de la toxoplasmose. Elle ne retarde pas le traitement antirétroviral au-delà de 2 semaines après le début de l’antifongique. Les azolés exposent à des interactions avec les antirétroviraux.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/resolveuid/e8b771ed7eee45459b78ef1371ef1802" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Candidiasis</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/1caa81786ee74bf2887fc8bce8636e1d" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary Prophylaxis of OIs</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-diagnostic-suisse" data-title="Diagnostic suisse : laboratoire et médecin"><div class="lab">Responsabilités distinctes</div><p>Tout laboratoire de microbiologie autorisé par Swissmedic peut confirmer le VIH. Le laboratoire effectue les analyses, les évalue et pose le diagnostic sur un seul envoi. Le médecin prend en charge la personne, vérifie rapidement la présence du virus sur un second échantillon, en général par une charge virale détectable, et réalise un test de résistance ; si la vérification échoue, il contacte le laboratoire ou le Centre national de référence pour les rétrovirus.</p><div class="lab">Champ</div><p>La directive s’applique aux personnes de plus de 18 mois ; elle ne couvre ni les piqûres d’aiguille ni le diagnostic périnatal, pour lequel s’appliquent les recommandations de la CFSS de 2018.</p><div class="lab">Source</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Dépistage du VIH : directive 2025, version 4 du 10 juillet 2026</a>, §§ 2.1–2.6, lue le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-fenetre-test" data-title="Fenêtre diagnostique : un résultat dépend de sa date et de sa technique"><div class="lab">Pourquoi un test précoce peut être négatif</div><p>Les marqueurs n’apparaissent pas simultanément : l’ARN vers le 11<sup>e</sup> jour, l’antigène p24 environ une semaine plus tard, les anticorps encore après. La fenêtre sérologique d’un test de quatrième génération est de 6 semaines. La plupart des tests rapides recherchent les anticorps, formés en général dans les 28 jours. La PrEP peut retarder ces étapes.</p><div class="lab">Décision</div><p>Le médecin transmet au laboratoire la date d’exposition, les symptômes et les antirétroviraux reçus. Une primo-infection suspectée appelle un test automatisé et un test moléculaire en parallèle ; répéter un autotest ne suffit pas.</p><div class="lab">Sources</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/b74f67fa130d469c92a201f82894fa25" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary HIV Infection</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, 27 juillet 2026</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-differentiel" data-title="VIH confirmé : chaque syndrome garde son diagnostic"><div class="lab">Raisonnement</div><p>Une infection par le VIH modifie les probabilités ; elle ne transforme pas toute lésion en infection opportuniste. Une atteinte buccale, pulmonaire ou cérébrale exige la concordance entre symptômes, examen, prélèvements et imagerie, et plusieurs maladies peuvent coexister.</p><div class="lab">Exemple</div><p>Selon EACS 13, le diagnostic présomptif de toxoplasmose cérébrale exige des symptômes, des IgG sériques, des lésions focales typiques et une réponse au traitement empirique ; la PCR du liquide céphalorachidien est très spécifique (95 à 100 %) mais peu sensible (50 %). M. L. n’a pas d’atteinte neurologique : cet exemple prépare une urgence éventuelle, il n’ajoute pas une lésion à son cas.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/resolveuid/89a4ed1dfa8e4ebd9c4a8647411c785e" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Toxoplasma gondii Encephalitis</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-iris" data-title="Syndrome inflammatoire de reconstitution immunitaire"><div class="lab">Définition selon EACS 13</div><p>Aggravation paradoxale ou apparition de symptômes et de signes pendant la reconstitution immunitaire induite par le traitement, avec des signes inflammatoires à l’examen, en imagerie ou en histologie, après exclusion de l’évolution attendue de l’infection et d’une toxicité médicamenteuse.</p><div class="lab">Prévention</div><p>Méningite cryptococcique : traitement fongicide optimal et traitement antirétroviral différé de 4 à 6 semaines ; dépistage de l’antigène cryptococcique sous 100 CD4/µL et ponction lombaire si positif, pour ne pas démasquer une méningite. Tuberculose sans atteinte neurologique : prednisone préventive à envisager si les CD4 sont &lt;100/µL et que le traitement antirétroviral commence dans les 30 jours.</p><div class="lab">Traitement</div><p>La plupart des IRIS se résolvent en quelques semaines sans arrêter le traitement antirétroviral ; des corticoïdes peuvent être utilisés dans les formes menaçantes.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/resolveuid/e9ccb1296ed04c91be59234de5789ccb" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, IRIS</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-start" data-title="Démarrage rapide : prélèvements en parallèle et schéma adapté"><div class="lab">Principe</div><p>Commencer le traitement le jour du diagnostic est faisable et acceptable pour la plupart des personnes nouvellement diagnostiquées. Le choix d’un début immédiat ou après le bilan dépend du contexte, de l’urgence médicale et du risque de perte de suivi ; les obstacles structurels qui retardent le traitement doivent être levés. La disposition du patient doit être évaluée pour qu’il ne se sente pas contraint, sauf urgence clinique.</p><div class="lab">Application à M. L.</div><p>Fonction rénale, hépatite B, résistance, PrEP antérieure et médicaments associés sont inconnus. Le schéma doit donc rester valable quel que soit leur résultat : un inhibiteur de l’intégrase de deuxième génération avec ténofovir et emtricitabine. Une consultation de contrôle relit ces résultats rapidement.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/resolveuid/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initiation of ART</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-alliance" data-title="Adhésion : vérifier compréhension et accès réel"><div class="lab">Construire le plan avec le patient</div><p>EACS 13 demande d’évaluer à chaque visite la disposition à commencer, reprendre ou maintenir le traitement, ainsi que l’emploi, la situation sociale, les violences et l’usage de substances. Le médecin fait reformuler les consignes et prévoit un interlocuteur en cas de difficulté. Un oubli ne s’interprète pas sans en chercher la cause.</p><div class="lab">Application</div><p>M. L. doit savoir que la disparition de la fièvre n’autorise pas l’arrêt : EACS rappelle qu’un traitement commencé doit être poursuivi et que l’interruption n’est pas recommandée. L’accès aux médicaments est vérifié avant le retour à domicile.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-suivi" data-title="Suivi : deux trajectoires et la santé globale"><div class="lab">Deux trajectoires</div><p>Le contrôle de l’ARN et la restauration des CD4 ne progressent pas ensemble ; une prophylaxie garde ses propres critères d’arrêt.</p><div class="lab">Contenu du suivi selon EACS 13</div><p>ARN et CD4 tous les 3 à 12 mois ; formule sanguine, débit de filtration et tests hépatiques tous les 3 à 12 mois ; protéinurie, lipides, glycémie, tension artérielle et risque cardiovasculaire une fois par an ; sérologie de la syphilis et dépistage des infections sexuellement transmissibles tous les 3 à 12 mois selon l’exposition ; dépistage des cancers du col tous les 1 à 3 ans chez la femme de plus de 21 ans et examen anal tous les 1 à 2 ans chez l’homme ayant des rapports avec des hommes de plus de 35 ans.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment of Initial &amp; Subsequent Visits</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-ii" data-title="Indétectable = intransmissible : de la Swiss Statement à PARTNER2"><div class="lab">La position suisse</div><p>En 2008, Vernazza, Hirschel, Bernasconi et Flepp ont publié dans le Bulletin des médecins suisses que les personnes séropositives ne souffrant d’aucune autre infection sexuellement transmissible et suivant un traitement antirétroviral efficace ne transmettent pas le VIH par voie sexuelle. L’OFSP rappelle que de grandes études l’ont confirmé dix ans plus tard. L’information professionnelle suisse de Biktarvy® écrit aussi qu’il n’existe aucun risque de transmission sexuelle lorsque le succès virologique est atteint et maintenu.</p><div class="lab">La preuve européenne</div><p>PARTNER2, étude prospective menée dans 75 centres de 14 pays européens, a suivi 782 couples d’hommes dont le partenaire séropositif avait un ARN &lt;200 copies/mL : pendant 1593 années-couple et 76 088 rapports anaux sans préservatif, aucune transmission liée au partenaire n’a été observée. Une revue systématique de 2023 (7762 couples, 25 pays) décrit un risque presque nul sous 1000 copies/mL.</p><div class="lab">Limites</div><p>Le principe ne s’applique ni dès la première dose ni aux autres infections sexuellement transmissibles. Pour l’allaitement, EACS 13 décrit un risque très faible mais non nul.</p><div class="lab">Sources</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4, référence 2</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31056293/" target="_blank" rel="noopener" data-reference-source="1">Rodger et coll., Lancet 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37490935/" target="_blank" rel="noopener" data-reference-source="1">Broyles et coll., Lancet 2023</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-exposition" data-title="Prophylaxie post-exposition : position suisse et EACS"><div class="lab">Recommandation suisse, CFSS (24 novembre 2014)</div><p>Une exposition sexuelle au VIH est une urgence : les chances de succès diminuent dès 6 à 8 heures et la PEP n’est plus indiquée après 48 heures. Elle est recommandée après un rapport anal ou vaginal non protégé avec un partenaire séropositif virémique, ou de statut inconnu appartenant à un groupe où la probabilité d’une infection non traitée dépasse 10 %, et après un viol ; elle est à discuter après une fellation réceptive avec éjaculation. Elle est inutile si le partenaire est sous traitement avec un ARN &lt;50 copies/mL depuis 6 mois. Durée : 4 semaines ; test VIH 3 mois après l’exposition ; coûts pris en charge par l’assurance obligatoire.</p><div class="lab">EACS 13 (2025)</div><p>Début idéalement dans les 4 heures et au plus tard à 72 heures ; schéma préféré bictégravir/emtricitabine/ténofovir alafénamide ; sérologies VIH, hépatites B et C dans les 48 heures ; réévaluation par un expert à 48–72 heures ; sérologie VIH à la fin de la PEP et 6 à 8 semaines plus tard ; PrEP à discuter si les expositions se répètent.</p><div class="lab">Conduite retenue pour l’examen fédéral</div><p>Le document suisse, plus ancien, figure parmi les documents de référence de l’OFSP liés à l’article 12b de l’OPAS ; il fixe la limite à 48 heures. EACS, plus récent, admet 72 heures et préfère un autre schéma. En pratique, la PEP commence le plus tôt possible, et toute situation au-delà de 48 heures se discute avec un centre spécialisé.</p><div class="lab">Sources</div><p><a href="https://www.bag.admin.ch/dam/de/sd-web/7YK-vGCup8F2/art.12b-hiv-postexpositionsprophylaxe-empfehlungen-des-bag-vom-24.11.2014.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 48 du 24 novembre 2014, recommandations de la CFSS (texte allemand lu)</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/62d4c8f05a2144dfa5975f2250012b68" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Post-exposure Prophylaxis</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-prep" data-title="PrEP en Suisse : SwissPrEPared et assurance obligatoire"><div class="lab">Cadre suisse</div><p>La CFSS recommande la PrEP depuis janvier 2016. Depuis avril 2019, elle est mise en œuvre dans le programme SwissPrEPared ; l’assurance obligatoire des soins la prend en charge depuis juillet 2024, pendant une phase d’évaluation prévue jusqu’au 31 décembre 2026, seulement si l’ordonnance provient d’un centre SwissPrEPared. Les recommandations actuelles du programme ont été approuvées par la CFIST en 2025.</p><div class="lab">Indications remboursées (document de référence OPAS, 11 mars 2024)</div><p>Hommes et femmes transgenres ayant des rapports avec des hommes, et hommes ayant des rapports avec des hommes, avec au moins un critère : rapports anaux sans préservatif systématique, infection sexuellement transmissible dans les 12 derniers mois, consommation de drogues en contexte sexuel, partenaire séropositif virémique ou mal observant, PEP dans les 12 derniers mois. Personnes hétérosexuelles : partenaire séropositif virémique ou rapports non protégés avec un groupe à prévalence élevée.</p><div class="lab">Modalités</div><p>Ténofovir disoproxil 245 mg et emtricitabine 200 mg, quotidienne ou à la demande ; test de quatrième génération au départ, complété par une PCR ou un nouveau test à 4 semaines en cas d’exposition dans les 6 semaines précédentes ; contrôle à 4 semaines, puis tous les 3 mois. L’information professionnelle du générique Mepha ne recommande pas le schéma à la demande et contre-indique la PrEP sous une clairance de 60 mL/min ; cette différence est à connaître.</p><div class="lab">Sources</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/TQYjlazHSzjP/fr_BAG_Bulletin_51-25_PrEP.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 51/2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/keFF8kxAp5lz/refdoc-art.12b-hiv-prep.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, document de référence PrEP, art. 12b OPAS, 11 mars 2024</a> ; Information professionnelle suisse Emtricitabin-Tenofovir-Mepha, Swissmedic (AIPS). Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-declaration" data-title="Déclaration obligatoire du VIH en Suisse"><div class="lab">Qui déclare, à qui, quand</div><p>Tout nouveau diagnostic de VIH doit être déclaré, selon la loi sur les épidémies et ses ordonnances. Le laboratoire qui effectue la première analyse déclare l’interprétation globale (VIH, VIH-1 ou VIH-2) au médecin cantonal du canton de résidence et à l’OFSP dans la semaine suivant le diagnostic ; en pratique, le délai entre le test réactif et la déclaration ne doit pas dépasser deux jours ouvrables. Le médecin déclare les résultats cliniques au médecin cantonal dans un délai d’une semaine.</p><div class="lab">Situation particulière</div><p>Une personne qui s’installe en Suisse avec un diagnostic posé à l’étranger est aussi soumise à la déclaration ; le médecin doit vérifier le diagnostic.</p><div class="lab">Source</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4, §§ 2.2, 2.4, 2.6 et 5</a>, consultée le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-grossesse" data-title="Grossesse : références suisse et européenne"><div class="lab">Suisse</div><p>La directive OFSP de dépistage exclut le diagnostic périnatal et renvoie aux recommandations de la Commission fédérale pour la santé sexuelle concernant la prise en charge des mères infectées par le VIH et de leur enfant (bulletin OFSP 50/2018). La cohorte suisse mère-enfant est intégrée à la Swiss HIV Cohort Study. Le texte de 2018 n’a pas été relu pour ce cours ; ses recommandations détaillées restent une lacune nommée.</p><div class="lab">EACS 13</div><p>Schémas initiaux : bictégravir/emtricitabine/ténofovir alafénamide, dolutégravir avec deux INTI, darunavir/ritonavir 600/100 mg deux fois par jour. ARN à chaque trimestre et à 36 semaines si la femme est durablement supprimée ; tous les deux mois sinon. Césarienne programmée à 38 semaines si l’ARN dépasse 400 copies/mL à 34–36 semaines ; entre 50 et 400 copies/mL, décision au cas par cas. Allaitement possible par décision partagée chez une mère observante, supprimée et suivie.</p><div class="lab">Sources</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4, § 2 et référence 4</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12757896/" target="_blank" rel="noopener" data-reference-source="1">Ambrosioni et coll., HIV Medicine 2025</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-vaccins" data-title="Vaccins : sécurité et réponse immunitaire"><div class="lab">Plan de vaccination suisse 2026</div><p>Rougeole, oreillons, rubéole et varicelle : contre-indiqués en cas d’infection avancée par le VIH et de sida, c’est-à-dire sous 200 CD4/µL dès 6 ans. Pneumocoque : vaccin conjugué dès le diagnostic ; si les CD4 sont &lt;200/µL, vaccination au diagnostic puis répétée après la reconstitution immunitaire, définie chez l’adulte par des CD4 ≥200/µL. Zona : vaccin adjuvanté Shingrix® recommandé dès 18 ans si les CD4 sont &lt;200/µL ou &lt;15 %, et dès 50 ans chez toute personne séropositive.</p><div class="lab">EACS 13</div><p>Vacciner de préférence après suppression virale et CD4 ≥200/µL ; refaire les vaccins administrés sous 200 CD4/µL ; éviter les schémas accélérés ; contrôler les titres si la vaccination a eu lieu sous 200 CD4/µL. Grippe chaque année. Hépatite B : revacciner jusqu’à des anti-HBs suffisants.</p><div class="lab">Sources</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Plan de vaccination suisse 2026</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/6bef0c68f5774644942e80d2e3d10bc4" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Immunisation</a>. Consultés le 8 octobre 2026.</p></template>

<template data-pop="pareto-b24-bases" data-title="Loi de Pareto — Définir, comprendre et diagnostiquer"><p class="ratio" data-cover="b24-pa-1,b24-pa-2,b24-pa-3,b24-pa-4,b24-pa-5,b24-pa-6,b24-pa-7"></p><ul><li>Maladie avancée : CD4 &lt;200/µL ou événement définissant le sida ; présentation tardive : CD4 &lt;350/µL.</li><li>Suisse 2024 : 318 cas, 3,5/100 000 ; cascade 93 – 98 – 96 %.</li><li>Le traitement bloque de nouvelles infections cellulaires mais ne retire pas le provirus : pas de guérison.</li><li>Transmission par sang, sperme, sécrétions vaginales, lait ; jamais par le contact ordinaire.</li><li>Anamnèse : PrEP antérieure, médicaments et phytothérapie, voyages, disposition à commencer.</li><li>Candidose orale : diagnostic clinique ; dysphagie récente = œsophagite présumée.</li><li>Diagnostic suisse : deux étapes, deux techniques, second échantillon ; fenêtre de 6 semaines ; primo-infection : test moléculaire en parallèle.</li></ul></template>

<template data-pop="pareto-b24-pec" data-title="Loi de Pareto — Les décisions qui changent l’évolution"><p class="ratio" data-cover="b24-pa-8,b24-pa-9"></p><ul><li>Défaillance d’abord ; chaque urgence a son calendrier.</li><li>Pneumocystose hypoxémique : corticoïdes dans les 72 heures ; cryptococcose : corticoïdes contre-indiqués, ponctions répétées.</li><li>IRIS : diagnostic d’exclusion ; antigène cryptococcique sous 100 CD4/µL.</li><li>Traitement pour tous ; avant le génotype, inhibiteur de l’intégrase de deuxième génération.</li><li>Dans les 2 semaines après le traitement d’une infection opportuniste ; 4 à 6 semaines pour la méningite cryptococcique.</li><li>Prophylaxie si CD4 &lt;200/µL, &lt;14 % ou candidose orale.</li></ul></template>
