<template data-pop="b24-pa-vih" data-title="VIH : infection persistante et contrôle thérapeutique"><div class="lab">Sens clinique</div><p>VIH désigne le virus de l’immunodéficience humaine. L’infection peut être silencieuse ; le sida désigne sa forme avancée selon des critères définis. Les antirétroviraux permettent un contrôle durable, mais l’absence d’ARN détectable dans le plasma ne prouve pas l’élimination de tous les réservoirs infectés.</p><div class="lab">Application à M. L.</div><p>La confirmation VIH-1 établit l’infection. La candidose et les CD4 à 86/µL indiquent qu’il faut examiner ses complications et ses besoins de prévention. Ils ne désignent pas la cause de chaque symptôme ni la date de contamination.</p><div class="lab">Référence consultée le 8 octobre 2026</div><p><a href="https://www.cdc.gov/hiv/about/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, About HIV, 14 janvier 2025</a> : histoire naturelle et bénéfice du contrôle ; les seuils immunologiques du cours suivent le tableau CDC 2014 exprimé en cellules/µL.</p></template>

<template data-pop="b24-pa-stades" data-title="CDC 2014 : stades de surveillance, pas prescription"><div class="lab">Critères et limites</div><p>Le nombre absolu de CD4 est prioritaire ; le pourcentage n’est utilisé que si ce nombre manque. Une affection définissante conduit au stade 3, sauf priorité du stade 0 documentant une infection récente.</p><div class="lab">Question du cas</div><p>L’histoire des tests de M. L. doit être récupérée : l’ARN à 180 000 copies/mL ne date pas la contamination. Un changement de libellé ne supprimerait pas ses besoins actuels de soins.</p><div class="lab">Source</div><p><a href="https://www.cdc.gov/mmwr/preview/mmwrhtml/rr6303a1.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, 11 avril 2014, section 4 et tableau</a>, consultés le 8 octobre 2026 : surveillance américaine, pas protocole thérapeutique suisse.</p></template>

<template data-pop="b24-pa-stades-oms" data-title="OMS : stade clinique et maladie VIH avancée"><div class="lab">Deux usages</div><p>Le stade clinique classe les événements observés. Une candidose orale <em>persistante</em> est classée au stade OMS 3 ; une candidose œsophagienne au stade 4. La présence d’une candidose orale non datée ne permet pas d’ajouter arbitrairement le qualificatif « persistante » au cas de M. L.</p><p>La maladie VIH avancée chez l’adulte est définie par des CD4 &lt;200/µL ou un événement de stade OMS 3 ou 4. Elle sert à déclencher une prise en charge renforcée, sans remplacer la confirmation de chaque infection.</p><div class="lab">Références et dates</div><p><a href="https://www.ncbi.nlm.nih.gov/sites/books/NBK374293/" target="_blank" rel="noopener" data-reference-source="1">OMS, annexe 10 des recommandations 2016, classification adaptée de 2007</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, fiche du 27 juillet 2026</a>. Textes consultés le 8 octobre 2026 ; le millésime 2016 de la table n’est pas présenté comme une nouvelle classification 2026.</p></template>

<template data-pop="b24-pa-codage" data-title="B24 : catégorie sans précision et titre éditorial"><div class="lab">Classification lue</div><p>Le BfArM distingue B20 pour les maladies infectieuses ou parasitaires dues au VIH, B21 pour les tumeurs malignes, B22 pour certaines autres maladies précisées, B23 pour d’autres états et B24 pour la maladie VIH sans précision. Des codes supplémentaires décrivent les manifestations. Le bloc exclut notamment l’infection asymptomatique codée Z21, l’exposition Z20.6 et certaines situations obstétricales.</p><div class="lab">Portée du cours</div><p>Le catalogue français porte « Immunodéficience humaine virale [VIH], sans précision ». Le titre clinique adulte couvre des décisions plus larges ; il ne rend pas B24 adapté à chaque manifestation documentée. Les règles de codage utilisées en Suisse doivent être appliquées à la version nationale pertinente. Le code CIM-11 MMS 1C62.1 n’est pas déduit automatiquement de ce titre ni du cas.</p><div class="lab">Source primaire consultée le 8 octobre 2026</div><p><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-b20-b24.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, B20–B24</a> : source allemande de classification, pas protocole suisse de facturation.</p></template>

<template data-pop="b24-pa-epidemio" data-title="Épidémiologie : année des données et dénominateur"><div class="lab">Lire le chiffre</div><p>Le nombre mondial de personnes vivant avec le VIH est une estimation de prévalence ; les acquisitions pendant une année sont une estimation d’incidence. Les nouveaux diagnostics déclarés à l’OFSP dépendent aussi du dépistage et peuvent concerner une infection ancienne. Ils ne constituent pas un décompte direct des contaminations survenues pendant cette même année.</p><div class="lab">Conséquence clinique</div><p>Un nombre national bas ne dispense pas de proposer un test devant une indication clinique. Inversement, les caractéristiques d’un groupe de surveillance ne permettent pas d’attribuer une voie de contamination à M. L.</p><div class="lab">Sources</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, fiche du 27 juillet 2026, estimations mondiales 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025, pages 19–25, données 2024 arrêtées au 17 février 2025</a>. Consultation le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-transmission" data-title="Transmission : liquide infectant et porte d’entrée"><div class="lab">Mécanisme</div><p>Le sang, le sperme, les sécrétions génitales ou rectales et le lait maternel peuvent transmettre le virus lorsqu’ils atteignent une muqueuse, une lésion ou la circulation. Une muqueuse lésée facilite l’accès aux cellules cibles. L’inoculum dépend notamment de la réplication virale ; il n’est pas mesuré par l’identité sociale du partenaire.</p><div class="lab">Ce qui ne justifie pas une crainte</div><p>Le contact d’une peau intacte, les toilettes partagées, les repas et les gestes sociaux ordinaires ne constituent pas ces voies. Le patient peut donc recevoir des soins et partager la vie quotidienne sans séparation imposée par le VIH seul.</p><div class="lab">Source et limite</div><p><a href="https://www.cdc.gov/hiv/causes/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, How HIV Spreads, 25 novembre 2024</a>, lu le 8 octobre 2026 : mécanismes et voies. La transmission sexuelle sous suppression maintenue a sa preuve propre dans la fenêtre I = I.</p></template>

<template data-pop="b24-pa-anamnese" data-title="Anamnèse sexuelle : question ouverte, exposition précise"><div class="lab">Comment demander</div><p>Le médecin demande quels partenaires, quelles pratiques, quelles protections et quels sites d’exposition sont concernés ; il laisse le patient décrire sa situation. Il distingue l’identité, les pratiques et le risque effectif. Une réponse « pas de risque » peut refléter une compréhension différente du mot et nécessite une clarification respectueuse.</p><div class="lab">Application</div><p>Chez M. L., aucune voie de contamination n’a été fournie. Une histoire de fièvre, d’amaigrissement, de voyages ou de contact tuberculeux complète cette discussion. Les questions servent au choix des prélèvements, à la prévention et au suivi, sans transformer une hypothèse en fait du dossier.</p><div class="lab">Référence</div><p><a href="https://www.cdc.gov/std/treatment-guidelines/hiv.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, STI Treatment Guidelines 2021, VIH : dépistage, conseil et orientation</a>, consulté le 8 octobre 2026. Les règles administratives américaines de consentement ne sont pas transposées.</p></template>

<template data-pop="b24-pa-prep-pep" data-title="PrEP, PEP et traitement du VIH : objectifs différents"><div class="lab">Définitions</div><p>La PrEP est une prophylaxie avant des expositions chez une personne sans VIH. La PEP est une prophylaxie après une exposition. Le traitement d’une infection confirmée vise le contrôle durable d’un virus déjà présent ; il ne se confond pas avec l’un de ces dispositifs de prévention.</p><div class="lab">Pourquoi demander l’historique</div><p>Une prise antérieure d’antirétroviraux peut influer sur la détection de l’infection et le choix thérapeutique. Le nom du produit, ses dates et sa dernière administration comptent, surtout pour une formulation prolongée. Le patient peut ne pas appeler ce médicament un « traitement VIH ».</p><div class="lab">Sources consultées le 8 octobre 2026</div><p><a href="https://www.cdc.gov/hiv/prevention/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, Preventing HIV, 26 septembre 2024</a> ; <a href="https://www.cdc.gov/hivpartners/php/hiv-testing/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, HIV Testing, page actuelle : effet des antirétroviraux sur la fenêtre diagnostique</a>. Les schémas et autorisations suisses sont examinés en pharmacologie.</p></template>

<template data-pop="b24-pa-candidose" data-title="Candidose orale : ne pas présumer une atteinte œsophagienne"><div class="lab">Reconnaître et préciser</div><p>Des plaques crémeuses blanchâtres qui se détachent soutiennent une candidose oropharyngée ; la leucoplasie orale chevelue ne se détache habituellement pas. Une dysphagie, une odynophagie ou une douleur rétrosternale fait rechercher une atteinte œsophagienne. La bouche ne suffit pas à en démontrer ou exclure l’existence.</p><div class="lab">Calendrier du traitement VIH</div><p>La candidose muqueuse n’impose pas d’attendre la fin de l’antifongique pour commencer les antirétroviraux. Il faut toutefois vérifier interactions et absorption. Dans le cas fourni, aucune odynophagie n’a été documentée : elle doit être demandée.</p><div class="lab">Source</div><p><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/candidiasis?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, Candidiasis, mise à jour 16 septembre 2024, revue 16 mars 2026</a>, lu le 8 octobre 2026 : manifestations, diagnostic et calendrier antirétroviral. L’infectiologue précise l’indication antifongique et le schéma adapté au site atteint et aux traitements associés.</p></template>

<template data-pop="b24-pa-diagnostic-suisse" data-title="Diagnostic suisse : résultat de laboratoire et vérification médicale"><div class="lab">Responsabilités distinctes</div><p>Le diagnostic initial et sa confirmation peuvent être réalisés sur le premier envoi par le laboratoire autorisé. La vérification médicale sur un second échantillon est une étape distincte du bilan de prise en charge ; elle ne signifie pas que le laboratoire aurait dû attendre ce second prélèvement pour rendre le diagnostic initial.</p><div class="lab">Source et périmètre</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Dépistage du VIH : directive 2025, version 4 du 10 juillet 2026</a>, §§2.2–2.6, lue le 8 octobre 2026. La directive concerne les personnes de plus de 18 mois ; elle ne couvre pas les piqûres d’aiguille ni le diagnostic périnatal. L’onglet examens détaille l’algorithme et ses situations particulières.</p></template>

<template data-pop="b24-pa-fenetre-test" data-title="Fenêtre diagnostique : un résultat dépend de sa date et de sa technique"><div class="lab">Pourquoi un test précoce peut être négatif</div><p>Les marqueurs ne deviennent pas détectables simultanément. Le test de quatrième génération recherche antigène p24 et anticorps ; un autotest d’anticorps peut se positiver plus tard. Les antirétroviraux utilisés en prévention peuvent aussi retarder la détection. Un résultat négatif n’exclut donc pas toute infection après une exposition trop récente.</p><div class="lab">Décision</div><p>Le médecin communique date d’exposition, symptômes et antirétroviraux au laboratoire. Une suspicion clinique de primo-infection appelle une investigation adaptée ; il ne suffit pas de répéter le même autotest le lendemain.</p><div class="lab">Référence</div><p><a href="https://www.cdc.gov/hivpartners/php/hiv-testing/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, HIV Testing, sections Types of tests et Window period</a>, lues le 8 octobre 2026. Les délais et la procédure suisses sont précisés en examens à partir de l’OFSP.</p></template>

<template data-pop="b24-pa-differentiel" data-title="VIH confirmé : chaque syndrome garde son diagnostic"><div class="lab">Raisonnement</div><p>Une infection VIH confirmée modifie les probabilités, mais ne transforme pas toutes les lésions en infections opportunistes. Une anomalie buccale, pulmonaire ou cérébrale nécessite sa concordance entre symptômes, examen, prélèvements et imagerie. Une co-infection, un cancer ou une maladie indépendante peuvent être présents en même temps.</p><div class="lab">Exemple</div><p>Une atteinte cérébrale en anneau peut évoquer une toxoplasmose ; l’image seule ne prouve pas ce diagnostic et le lymphome fait partie des alternatives. M. L. n’a initialement pas d’atteinte neurologique : cet exemple prépare une éventuelle urgence, il n’ajoute pas une lésion à son cas.</p><div class="lab">Source consultée le 8 octobre 2026</div><p><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/toxoplasmosis" target="_blank" rel="noopener" data-reference-source="1">NIH, Toxoplasmosis, mise à jour 9 septembre 2025, revue 23 juin 2026</a> : diagnostic et différentiels cérébraux.</p></template>

<template data-pop="b24-pa-urgences" data-title="Urgences : les symptômes peuvent être incomplets"><div class="lab">Respiration et système nerveux central</div><p>Une pneumocystose peut donner une dyspnée progressive avec un examen peu contributif au repos. La cryptococcose neuroméningée peut évoluer sans raideur méningée franche. Une baisse d’oxygénation, une céphalée persistante ou un trouble de conscience justifient donc une évaluation même si le tableau « classique » est incomplet.</p><div class="lab">Action</div><p>Le patient instable est stabilisé et les prélèvements s’organisent en parallèle. L’immunodépression élargit les hypothèses ; elle ne supprime pas les causes bactériennes ou non infectieuses habituelles. Le calendrier de traitement VIH dépend ensuite de la complication réellement établie.</p><div class="lab">Sources</div><p><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/pneumocystis" target="_blank" rel="noopener" data-reference-source="1">NIH, Pneumocystis, 27 mai 2026, manifestations</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/cryptococcosis" target="_blank" rel="noopener" data-reference-source="1">NIH, Cryptococcosis, revue 16 mars 2026</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-toxoplasme" data-title="Toxoplasme : exposition ancienne et risque de réactivation"><div class="lab">Mécanisme et limite du résultat</div><p>Chez l’adulte immunodéprimé, la maladie cérébrale survient souvent par réactivation de kystes d’une infection antérieure. Une IgG positive indique cette exposition, pas une encéphalite active. Le NIH recommande une prophylaxie chez une personne IgG positive avec CD4 &lt;100/µL (AII).</p><div class="lab">Application au cas</div><p>La sérologie de M. L. n’a pas été fournie : elle doit être demandée, sans écrire qu’il a une toxoplasmose ou une sérologie positive. La protection choisie peut couvrir plusieurs agents ; une alternative doit être appréciée pour chacun d’eux.</p><div class="lab">Source</div><p><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/toxoplasmosis" target="_blank" rel="noopener" data-reference-source="1">NIH, Toxoplasmosis, mise à jour 9 septembre 2025, revue 23 juin 2026</a>, prévention et mécanisme, lus le 8 octobre 2026. Les doses et alternatives sont traitées en pharmacologie.</p></template>

<template data-pop="b24-pa-cryptocoque" data-title="Antigène cryptococcique : rechercher une maladie avant les symptômes"><div class="lab">Sens du dépistage</div><p>L’antigène sanguin peut précéder les symptômes. Le NIH recommande sa recherche chez les personnes nouvellement diagnostiquées avec CD4 ≤200/µL, particulièrement ≤50/µL (AII). Un résultat positif appelle une évaluation d’infection, notamment neuroméningée ; la recherche de l’antigène n’est pas équivalente à donner un antifongique préventif à toute personne avec CD4 bas.</p><div class="lab">Limite clinique</div><p>Le contexte épidémiologique et le protocole applicable en Suisse sont appréciés avec l’infectiologue. M. L. n’a pas de résultat antigénique fourni ; l’absence initiale de symptômes neurologiques n’en constitue pas un résultat négatif.</p><div class="lab">Source</div><p><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/cryptococcosis" target="_blank" rel="noopener" data-reference-source="1">NIH, Cryptococcosis, mise à jour 29 octobre 2024, revue 16 mars 2026, Preventing Disease</a>, lue le 8 octobre 2026 : recommandation américaine à apprécier selon le contexte.</p></template>

<template data-pop="b24-pa-iris" data-title="Restauration immunitaire : inflammation révélant ou aggravant une infection"><div class="lab">Mécanisme</div><p>Le contrôle du VIH peut restaurer une réponse inflammatoire contre un agent déjà présent. Une infection peut alors être révélée, ou une infection traitée s’aggraver sur le plan inflammatoire. Ce mécanisme, appelé IRIS, ne permet pas d’attribuer automatiquement toute dégradation au traitement VIH : infection non contrôlée, toxicité et autre diagnostic restent à examiner.</p><div class="lab">Pourquoi le calendrier compte</div><p>Dans un espace clos comme le système nerveux central, une inflammation supplémentaire peut être dangereuse. Une cryptococcose neuroméningée impose donc un calendrier antirétroviral spécifique décidé avec l’équipe spécialisée. Cette exception ne justifie pas de différer tous les traitements VIH en présence d’une candidose orale.</p><div class="lab">Source consultée le 8 octobre 2026</div><p><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/initiation-antiretroviral-therapy?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, Initiation of ART, 25 septembre 2025, infections opportunistes</a>. Les calendriers propres aux agents sont détaillés dans les recommandations correspondantes.</p></template>

<template data-pop="b24-pa-start" data-title="Démarrage rapide : prélèvements en parallèle et schéma adapté"><div class="lab">Principe</div><p>Le traitement est préparé dès le diagnostic et commence dès que possible. Les analyses initiales sont prélevées ; certains résultats peuvent être en attente lors de la première prescription, à condition que le choix tienne compte de cette incertitude et que les résultats soient revus rapidement.</p><div class="lab">Application à M. L.</div><p>La confirmation VIH-1, l’ARN et les CD4 sont connus. Fonction rénale, hépatites, résistance, exposition antérieure aux antirétroviraux et médicaments associés ne le sont pas dans l’énoncé. Il faut les rechercher ; aucune bithérapie ni absence d’hépatite B n’est présumée. Une consultation de contrôle doit être prévue avant que ces résultats restent sans lecteur.</p><div class="lab">Source</div><p><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/baseline-evaluation" target="_blank" rel="noopener" data-reference-source="1">NIH, Baseline Evaluation, 24 septembre 2026</a>, lu le 8 octobre 2026 : démarrage et bilan, population adulte/adolescente, cadre américain.</p></template>

<template data-pop="b24-pa-alliance" data-title="Adhésion : vérifier compréhension et accès réel"><div class="lab">Construire le plan avec le patient</div><p>Le médecin demande ce qui pourrait rendre les prises difficiles : horaire, effet indésirable, coût, peur d’une révélation du diagnostic ou absence de logement stable. Il fait reformuler les consignes, choisit avec le patient une organisation réalisable et prévoit un interlocuteur en cas de difficulté. Un oubli ne doit pas être interprété sans rechercher sa cause.</p><div class="lab">Application</div><p>M. L. doit savoir que l’amélioration de la fièvre ne constitue pas une consigne d’arrêt. La possibilité de poursuivre et d’obtenir les médicaments est vérifiée avant son retour à domicile ; elle n’est pas supposée à partir de son âge.</p><div class="lab">Source</div><p><a href="https://www.cdc.gov/hivnexus/hcp/clinical-care/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, Clinical Care of HIV, 16 avril 2026, obstacles à l’adhésion et maintien dans les soins</a>, lu le 8 octobre 2026. L’organisation concrète dépend du système de soins suisse.</p></template>

<template data-pop="b24-pa-suivi" data-title="Suivi : comparer deux trajectoires et rester dans les soins"><div class="lab">Deux trajectoires</div><p>Le contrôle de l’ARN et la restauration des CD4 ne progressent pas nécessairement ensemble. Une prophylaxie garde donc ses critères propres de poursuite ou d’arrêt.</p><div class="lab">Une consultation utile</div><p>Pour M. L., le prochain rendez-vous doit aussi examiner poids, fièvre et tolérance : une persistance des symptômes impose de rouvrir la recherche de cause, même si l’ARN diminue.</p><div class="lab">Référence</div><p><a href="https://www.idsociety.org/practice-guideline/primary-care-management-of-people-with-hiv/" target="_blank" rel="noopener" data-reference-source="1">HIVMA/IDSA, Primary Care Guidance 2024</a>, consultation du 8 octobre 2026 ; suivi global, sans importation automatique des calendriers américains.</p></template>

<template data-pop="b24-pa-ii" data-title="I = I : transmission sexuelle et suppression maintenue"><div class="lab">Ce que montre la preuve</div><p>Les études de couples n’ont pas observé de transmission sexuelle liée au partenaire sous suppression virale maintenue. I = I concerne le VIH transmis sexuellement, sous traitement efficace ; il ne signifie ni guérison ni protection contre les autres IST. L’indétectabilité analytique dépend du test et n’est pas le seuil de prévention sexuelle.</p><div class="lab">Démarrage et interruption</div><p>Le message ne s’applique pas dès la première dose. La suppression doit être documentée et maintenue ; une interruption expose au rebond. Pour M. L., la prévention transitoire reste nécessaire avec 180 000 copies/mL.</p><div class="lab">Références consultées le 8 octobre 2026</div><p><a href="https://www.cdc.gov/hivpartners/php/hiv-treatment/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, Treatment as Prevention, 24 octobre 2024</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/arv-therapy-as-prevention" target="_blank" rel="noopener" data-reference-source="1">NIH, 25 septembre 2025, recommandations de prévention sexuelle</a>. Ces preuves ne sont pas extrapolées à un risque nul pour l’allaitement ou le partage de seringues.</p></template>

<template data-pop="b24-pa-exposition" data-title="Exposition récente : accès urgent à une évaluation PEP"><div class="lab">Décision urgente</div><p>Une personne sans infection VIH connue qui rapporte une exposition potentielle doit être évaluée rapidement. La recommandation CDC actuelle vise un début de PEP idéalement dans les 24 heures, au plus tard dans les 72 heures si elle est indiquée ; les prélèvements ne doivent pas retarder la première dose indispensable. Le protocole local détermine le schéma et le suivi.</p><div class="lab">Relation avec le cas</div><p>Cette démarche concerne un partenaire exposé, pas le traitement de M. L. dont l’infection est confirmée. Son diagnostic permet d’organiser prévention et conseil, sans imposer à un partenaire d’attendre son prochain rendez-vous.</p><div class="lab">Source</div><p><a href="https://www.cdc.gov/hivnexus/hcp/pep/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, Clinical Guidance for PEP, page du 7 octobre 2026, renvoyant aux recommandations nPEP 2025</a>, lue le 8 octobre 2026 : cadre américain, pas prescription suisse automatique.</p></template>

<template data-pop="b24-pa-vaccins" data-title="Vaccins : sécurité et réponse immunitaire sont deux questions"><div class="lab">Mécanisme</div><p>Un vaccin vivant atténué peut devenir dangereux lorsque l’immunité contrôle mal sa réplication. Un vaccin non vivant peut être sûr tout en produisant une réponse insuffisante pendant une immunodépression. Le choix, le calendrier et une éventuelle vérification de réponse dépendent donc du vaccin et de l’état immunitaire.</p><div class="lab">Application</div><p>Chez M. L., les CD4 à 86/µL empêchent de traiter les vaccinations comme une simple mise à jour indifférenciée. Le médecin consulte les recommandations suisses propres au produit et au terrain et prépare les vaccinations utiles avec l’infectiologue.</p><div class="lab">Référence</div><p><a href="https://www.cdc.gov/vaccines/hcp/imz-best-practices/altered-immunocompetence.html" target="_blank" rel="noopener" data-reference-source="1">CDC, Altered Immunocompetence, 26 juin 2024</a>, lue le 8 octobre 2026 : principes de sécurité et de réponse, sans importation du calendrier ou des produits américains.</p></template>

<template data-pop="b24-pa-sources" data-title="Références : une version propre à chaque texte"><div class="lab">Dates réellement vérifiées</div><p>L’OFSP est cité selon la directive 2025 version 4 du 10 juillet 2026 ; la fiche OMS selon sa publication du 27 juillet 2026. Le NIH Baseline Evaluation porte le 24 septembre 2026, mais Initiation of ART et Treatment as Prevention portent encore le 25 septembre 2025. Le millésime global d’un ensemble de recommandations ne redonne pas artificiellement une date à chaque section.</p><div class="lab">Accès européen et portée</div><p>La page officielle EACS confirme la version 13.0, édition 2025, et oriente vers son site interactif. Elle fournit le cadre européen du chapitre ; les assertions détaillées de ce panneau renvoient aux textes directement lus qui les soutiennent. Leur application doit tenir compte de la population, des co-infections et du système de soins suisse.</p><div class="lab">Accès aux textes consultés le 8 octobre 2026</div><p><a href="https://www.eacsociety.org/guidelines/eacs-guidelines/" target="_blank" rel="noopener" data-reference-source="1">EACS, page officielle des Guidelines 13.0</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/baseline-evaluation" target="_blank" rel="noopener" data-reference-source="1">NIH, bilan initial</a> ; <a href="https://www.who.int/publications/i/item/9789240118164" target="_blank" rel="noopener" data-reference-source="1">OMS, maladie VIH avancée, 18 décembre 2025</a>.</p></template>

<template data-pop="b24-pa-pareto-definitions" data-title="Pareto clinique : trois questions différentes"><div class="lab">Organiser les décisions</div><p>La confirmation établit l’infection. Les CD4 et les atteintes d’organe décrivent la gravité et les besoins de prévention. Le codage représente la situation documentée dans une classification. Confondre ces trois questions peut produire une bonne étiquette sans une bonne décision.</p><div class="lab">Application à M. L.</div><p>Le VIH-1 est confirmé ; les CD4 à 86/µL justifient une prise en charge renforcée ; la fièvre garde sa recherche de cause. B24 est le repère du cours, sans équivalence automatique avec une catégorie CIM-11 ou toute complication clinique. Cette synthèse pédagogique ne prétend pas quantifier une proportion de cas ou de bénéfices.</p><div class="lab">Appui</div><p><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-b20-b24.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, catégories B20–B24, 2024</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, définition maladie avancée, 27 juillet 2026</a>, lus le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-pareto-care" data-title="Pareto clinique : priorités de la première prise en charge"><div class="lab">Les décisions initiales</div><p>Chercher une menace immédiate et la cause des symptômes. Distinguer traitement d’une infection et prophylaxie. Prélever le bilan sans laisser l’attente des résultats devenir une absence de soins. Choisir le calendrier antirétroviral selon les complications et un schéma compatible avec ce qui est encore inconnu. Vérifier accès au traitement et au prochain rendez-vous.</p><div class="lab">Limite</div><p>Ces priorités organisent le travail ; elles ne remplacent pas les indications particulières. Chez M. L., elles ne créent ni pneumocystose, ni toxoplasmose, ni hépatite B dans l’énoncé. Le résultat d’un examen doit être connu avant d’être utilisé comme fait clinique.</p><div class="lab">Appui consulté le 8 octobre 2026</div><p><a href="https://www.cdc.gov/hivnexus/hcp/clinical-care/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, Clinical Care, 16 avril 2026</a> : soins continus et accompagnement. Synthèse pédagogique du raisonnement du cas, sans pourcentage d’effet attribué.</p></template>
