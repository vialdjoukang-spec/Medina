<template data-pop="b24-pa-vih" data-title="VIH : infection persistante et contrôle thérapeutique"><div class="lab">Sens clinique</div><p>Le VIH cible notamment les cellules immunitaires CD4. Sans traitement, le déficit immunitaire peut favoriser tuberculose, autres infections et cancers. Les antirétroviraux contrôlent la réplication, mais ne constituent pas une guérison.</p><div class="lab">Application à M. L.</div><p>La confirmation VIH-1 établit l’infection ; 86 CD4/µL et la candidose orale motivent l’évaluation de ses complications. Aucun de ces faits ne date la contamination ni ne nomme la cause de la fièvre.</p><div class="lab">Source</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, signes, symptômes et traitement, 27 juillet 2026</a>, consultée le 8 octobre 2026.</p></template>


<template data-pop="b24-pa-stades-oms" data-title="OMS : stade clinique et maladie VIH avancée"><div class="lab">Deux usages</div><p>Le stade clinique classe les événements observés. Une candidose orale <em>persistante</em> est classée au stade OMS 3 ; une candidose œsophagienne au stade 4. La présence d’une candidose orale non datée ne permet pas d’ajouter arbitrairement le qualificatif « persistante » au cas de M. L.</p><p>La maladie VIH avancée chez l’adulte est définie par des CD4 &lt;200/µL ou un événement de stade OMS 3 ou 4. Elle sert à déclencher une prise en charge renforcée, sans remplacer la confirmation de chaque infection.</p><div class="lab">Références et dates</div><p><a href="https://www.ncbi.nlm.nih.gov/sites/books/NBK374293/" target="_blank" rel="noopener" data-reference-source="1">OMS, annexe 10 des recommandations 2016, classification adaptée de 2007</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, fiche du 27 juillet 2026</a>. Textes consultés le 8 octobre 2026 ; le millésime 2016 de la table n’est pas présenté comme une nouvelle classification 2026.</p></template>


<template data-pop="b24-pa-epidemio" data-title="Épidémiologie : année des données et dénominateur"><div class="lab">Lire le chiffre</div><p>Le nombre mondial de personnes vivant avec le VIH est une estimation de prévalence ; les acquisitions pendant une année sont une estimation d’incidence. Les nouveaux diagnostics déclarés à l’OFSP dépendent aussi du dépistage et peuvent concerner une infection ancienne. Ils ne constituent pas un décompte direct des contaminations survenues pendant cette même année.</p><div class="lab">Conséquence clinique</div><p>Un nombre national bas ne dispense pas de proposer un test devant une indication clinique. Inversement, les caractéristiques d’un groupe de surveillance ne permettent pas d’attribuer une voie de contamination à M. L.</p><div class="lab">Sources</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, fiche du 27 juillet 2026, estimations mondiales 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025, pages 19–25, données 2024 arrêtées au 17 février 2025</a>. Consultation le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-transmission" data-title="Transmission : liquide infectant et porte d’entrée"><div class="lab">Mécanisme</div><p>Le VIH se transmet par certains liquides biologiques, dont le sang, les sécrétions sexuelles et le lait maternel, lorsqu’ils atteignent une voie d’entrée. Les contacts sociaux ordinaires, les repas partagés et les embrassades ne transmettent pas le VIH.</p><div class="lab">Application</div><p>Le résultat d’ARN de M. L. ne révèle ni sa voie de contamination ni l’identité d’un partenaire. Ses contacts doivent pouvoir accéder à une prévention et à un dépistage adaptés, sans jugement sur l’identité.</p><div class="lab">Source</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, transmission, 27 juillet 2026</a>, consultée le 8 octobre 2026. La suppression virale et la transmission sexuelle sont précisées dans la fenêtre I = I.</p></template>

<template data-pop="b24-pa-anamnese" data-title="Anamnèse sexuelle : question ouverte, exposition précise"><div class="lab">Questions utiles</div><p>Les antécédents médicaux et thérapeutiques, une éventuelle PrEP, les médicaments actuels, les pratiques et sites d’exposition, les voyages et les contacts tuberculeux guident les examens et le choix thérapeutique. Les questions sur les partenaires sont ouvertes et respectent la confidentialité.</p><div class="lab">Application</div><p>Chez M. L., aucune voie d’acquisition n’est fournie. Le médecin recherche aussi les conditions concrètes du suivi : logement, moyens d’obtenir les médicaments, santé mentale et interlocuteur de confiance. Ces facteurs aident à construire un traitement possible au quotidien.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a>, rubriques History, Psychosocial et Sexual and reproductive health, consultées le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-prep-pep" data-title="PrEP, PEP et traitement du VIH : objectifs différents"><div class="lab">Trois objectifs distincts</div><p>La PrEP prévient l’acquisition avant une exposition ; la PEP répond à une exposition récente ; le traitement antirétroviral contrôle une infection VIH établie. L’historique précis de médicaments préventifs, y compris les formes prolongées, importe lors du bilan initial et du choix thérapeutique.</p><div class="lab">Pour M. L. et ses partenaires</div><p>M. L. a une infection confirmée : il relève du traitement VIH. Un partenaire récemment exposé relève d’une évaluation urgente de PEP, avec indication individualisée et sans attendre la consultation de suivi de M. L.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, antécédent de PrEP, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/62d4c8f05a2144dfa5975f2250012b68" target="_blank" rel="noopener" data-reference-source="1">EACS, Post-exposure Prophylaxis, 3 octobre 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Dépistage du VIH, directive 2025 v4, 10 juillet 2026</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-candidose" data-title="Candidose orale : ne pas présumer une atteinte œsophagienne"><div class="lab">Reconnaître, sans extrapoler</div><p>L’EACS retient l’aspect clinique typique pour la candidose oropharyngée. Une dysphagie récente associée à cette candidose peut faire suspecter une œsophagite ; une atteinte œsophagienne certaine demande des éléments propres au site. Il faut donc demander à M. L. douleur ou gêne à la déglutition, sans les inventer.</p><div class="lab">Traitement VIH</div><p>La candidose orale ne figure pas parmi les infections pour lesquelles l’EACS recommande de différer les antirétroviraux. Le traitement de la muqueuse et le démarrage VIH peuvent être organisés ensemble, après vérification des interactions des antifongiques.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/candidiasis" target="_blank" rel="noopener" data-reference-source="1">EACS, Candidiasis, diagnostic et traitements, 3 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS, OI Overview &amp; When to Start ART, 6 octobre 2025</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-diagnostic-suisse" data-title="Diagnostic suisse : résultat de laboratoire et vérification médicale"><div class="lab">Responsabilités distinctes</div><p>Le diagnostic initial et sa confirmation peuvent être réalisés sur le premier envoi par le laboratoire autorisé. La vérification médicale sur un second échantillon est une étape distincte du bilan de prise en charge ; elle ne signifie pas que le laboratoire aurait dû attendre ce second prélèvement pour rendre le diagnostic initial.</p><div class="lab">Source et périmètre</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Dépistage du VIH : directive 2025, version 4 du 10 juillet 2026</a>, §§2.2–2.6, lue le 8 octobre 2026. La directive concerne les personnes de plus de 18 mois ; elle ne couvre pas les piqûres d’aiguille ni le diagnostic périnatal. L’onglet examens détaille l’algorithme et ses situations particulières.</p></template>

<template data-pop="b24-pa-fenetre-test" data-title="Fenêtre diagnostique : un résultat dépend de sa date et de sa technique"><div class="lab">Interpréter le résultat dans son contexte</div><p>La directive OFSP distingue les techniques de dépistage, la confirmation du laboratoire et les situations de suspicion précoce. Un résultat négatif après une exposition récente dépend du délai et du type de test ; un antécédent de PrEP ou de PEP doit être recueilli et communiqué lors de l’évaluation.</p><div class="lab">Décision</div><p>Le médecin transmet date d’exposition, symptômes et antirétroviraux pris. Si une primo-infection est suspectée, la directive prévoit le test moléculaire en parallèle d’un test automatisé d’au moins quatrième génération. Un autotest isolé ne clôt pas cette évaluation.</p><div class="lab">Source</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Dépistage du VIH : directive 2025 version 4, §§2.2–2.6, 10 juillet 2026</a>, consultée le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-differentiel" data-title="VIH confirmé : chaque syndrome garde son diagnostic"><div class="lab">Attribuer chaque lésion à ses propres preuves</div><p>Une infection VIH confirmée modifie les probabilités, mais n’établit pas la cause d’une fièvre, d’une image cérébrale ou d’une lésion buccale. Une toxoplasmose cérébrale et un lymphome peuvent notamment entrer en discussion devant une lésion focale ; l’EACS demande de réunir clinique, imagerie et résultats microbiologiques avant de conclure.</p><div class="lab">Cas pédagogique</div><p>M. L. ne présente initialement pas de signe neurologique. L’exemple cérébral décrit une conduite en cas de nouveau signe, sans lui attribuer une lésion imaginaire.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/89a4ed1dfa8e4ebd9c4a8647411c785e" target="_blank" rel="noopener" data-reference-source="1">EACS, Toxoplasma gondii Encephalitis, diagnostic et différentiel, 1er octobre 2025</a>, consultée le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-urgences" data-title="Urgences : les symptômes peuvent être incomplets"><div class="lab">Respiration et système nerveux central</div><p>Une pneumocystose peut évoluer progressivement ; une méningite cryptococcique appelle l’évaluation neurologique, la recherche d’antigène et, si elle est sûre, une ponction lombaire avec pression d’ouverture. Une nouvelle dyspnée, une hypoxémie, une céphalée persistante ou une confusion demandent une évaluation urgente.</p><div class="lab">Action</div><p>Stabiliser d’abord une défaillance, puis prélever et traiter selon le syndrome et sa gravité. L’immunodépression ne supprime pas les diagnostics bactérien ou non infectieux. Le calendrier des antirétroviraux dépend ensuite de l’infection réellement retenue.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-pneumocystis-jirovecii-pneumonia-pcp" target="_blank" rel="noopener" data-reference-source="1">EACS, Pneumocystis jirovecii Pneumonia, 1er octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/cryptococcosis" target="_blank" rel="noopener" data-reference-source="1">EACS, Cryptococcosis, 1er octobre 2025</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-toxoplasme" data-title="Toxoplasme : exposition ancienne et risque de réactivation"><div class="lab">Mécanisme et limite du résultat</div><p>Chez une personne immunodéprimée, une toxoplasmose cérébrale peut résulter de la réactivation d’une infection antérieure. Les IgG indiquent une exposition, pas une encéphalite active. L’EACS associe l’indication spécifique de prévention toxoplasmique à une sérologie IgG positive et à une immunodépression avancée ; ses schémas de TMP/SMX pour la prévention PJP peuvent couvrir aussi le toxoplasme.</p><div class="lab">Application au cas</div><p>Les IgG de M. L. ne sont pas fournies : elles doivent être demandées. Avec 86 CD4/µL, l’indication de prévention PJP est déjà présente selon l’EACS ; un résultat IgG positif préciserait la double protection à assurer.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, Primary Prophylaxis of OIs, 3 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/89a4ed1dfa8e4ebd9c4a8647411c785e" target="_blank" rel="noopener" data-reference-source="1">EACS, Toxoplasma gondii Encephalitis, 1er octobre 2025</a>, consultées le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-cryptocoque" data-title="Antigène cryptococcique : rechercher une maladie avant les symptômes"><div class="lab">Sens du dépistage</div><p>L’antigène sanguin peut être détecté avant les symptômes. L’EACS recommande de rechercher l’antigène cryptococcique sérique chez les personnes vivant avec le VIH dont les CD4 sont &lt;100/µL. Un résultat positif impose une évaluation de maladie, notamment neuroméningée ; le dépistage ne signifie pas qu’un antifongique préventif est donné à toute personne avec des CD4 bas.</p><div class="lab">Application à M. L.</div><p>Avec 86 CD4/µL, M. L. remplit le seuil EACS. Aucun résultat d’antigène n’est fourni et l’absence initiale de symptôme neurologique ne prouve pas un résultat négatif.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, Primary Prophylaxis of OIs, version du 3 octobre 2025, Cryptococcus</a>, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-iris" data-title="Restauration immunitaire : inflammation révélant ou aggravant une infection"><div class="lab">Restauration immunitaire</div><p>Après le contrôle du VIH, une réponse inflammatoire contre une infection présente peut révéler ou aggraver un tableau. Une aggravation ne doit pas être attribuée automatiquement à ce mécanisme : infection active, toxicité et autre maladie restent à rechercher.</p><div class="lab">Pourquoi le calendrier compte</div><p>L’EACS recommande de différer les antirétroviraux de 4 à 6 semaines après le début du traitement d’une méningite cryptococcique confirmée ; l’inflammation intracrânienne et l’état clinique imposent un suivi spécialisé. Cette exception ne s’applique pas à la seule candidose orale de M. L.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS, OI Overview &amp; When to Start ART, 6 octobre 2025</a>, tableau du calendrier en cas d’infection opportuniste, consulté le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-start" data-title="Démarrage rapide : prélèvements en parallèle et schéma adapté"><div class="lab">Principe EACS</div><p>Le traitement VIH est recommandé à tout adulte, idéalement dès le diagnostic. Un faible nombre de CD4 rend le début urgent. Le génotype est demandé, mais son attente ne retarde pas à elle seule le traitement : l’association initiale doit être choisie avec une barrière à la résistance adaptée.</p><div class="lab">Application à M. L.</div><p>Le VIH-1, l’ARN et les CD4 sont connus. Fonction rénale, hépatites, génotype, exposition antérieure aux antirétroviraux et médicaments associés ne sont pas donnés : ils sont recherchés et leurs résultats sont revus rapidement. Aucune bithérapie ni absence d’hépatite B n’est présumée.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS, Initiation of ART: No Prior ART Exposure, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-alliance" data-title="Adhésion : vérifier compréhension et accès réel"><div class="lab">Décision et continuité</div><p>L’EACS demande une décision partagée qui laisse au patient la possibilité d’exprimer ses préférences et obstacles, sans pression inutile. Logement, coût, prises possibles, effets indésirables et confidentialité peuvent modifier le plan concret. Ils se discutent avec M. L. sans supposer que son âge garantit l’accès.</p><div class="lab">Application</div><p>Avant le retour à domicile, vérifier où le traitement sera obtenu, qui recontacte le patient, et comment réagir à une difficulté de prise. La régression de la fièvre ne serait pas une consigne d’arrêt du traitement VIH.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, psychosocial, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS, Initiation of ART, décision partagée, 6 octobre 2025</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-suivi" data-title="Suivi : comparer deux trajectoires et rester dans les soins"><div class="lab">Deux trajectoires</div><p>L’ARN sous traitement et la reconstitution CD4 ne suivent pas nécessairement le même rythme. L’EACS prévoit le suivi des deux et donne à chaque prophylaxie ses critères propres d’arrêt.</p><div class="lab">Une consultation utile</div><p>Pour M. L., le rendez-vous revoit aussi la fièvre, le poids et la tolérance. Si l’ARN reste détectable, l’EACS demande notamment de vérifier prises, interactions, antécédents et résistance avant de modifier le traitement. Une diminution de l’ARN ne suffit pas à expliquer une fièvre persistante.</p><div class="lab">Sources</div><p><a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS, Virological Failure, 9 octobre 2025</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-ii" data-title="I = I : transmission sexuelle et suppression maintenue"><div class="lab">Portée clinique</div><p>L’OMS indique qu’une personne sous traitement antirétroviral avec charge virale indétectable ne transmet pas le VIH par voie sexuelle. Cette affirmation concerne une suppression documentée et maintenue ; elle ne signifie ni guérison ni protection contre les autres IST.</p><div class="lab">Démarrage et interruption</div><p>Le message ne s’applique pas dès la première dose. La suppression doit être démontrée et suivie ; une interruption du traitement peut faire réapparaître une virémie. Pour M. L., dont l’ARN est de 180 000 copies/mL, une prévention adaptée reste nécessaire pendant la mise en place du traitement.</p><div class="lab">Source consultée le 8 octobre 2026</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026, traitement et prévention sexuelle</a>. La portée sexuelle n’est pas extrapolée à l’allaitement ou au partage de matériel d’injection.</p></template>

<template data-pop="b24-pa-exposition" data-title="Exposition récente : accès urgent à une évaluation PEP"><div class="lab">Accès urgent à une évaluation</div><p>L’EACS recommande, si la PEP est indiquée après évaluation de l’exposition, de la commencer <b>idéalement avant 4 heures</b> et <b>au plus tard à 72 heures</b>. La personne exposée doit donc être orientée sans attendre la prochaine consultation ; l’indication tient compte du type d’exposition et du statut virologique de la source.</p><div class="lab">Relation avec M. L.</div><p>Cette prévention concerne un partenaire exposé sans infection VIH déjà établie, non le traitement de M. L. Le résultat de M. L. est actuellement détectable ; aucune suppression ne peut être supposée. Le schéma et les contrôles sont fixés par une équipe compétente selon le contexte local.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/62d4c8f05a2144dfa5975f2250012b68" target="_blank" rel="noopener" data-reference-source="1">EACS, Post-exposure Prophylaxis (PEP), 3 octobre 2025</a>, section « Management », consultée le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-vaccins" data-title="Vaccins : sécurité et réponse immunitaire sont deux questions"><div class="lab">Immunodépression et type de vaccin</div><p>L’EACS précise que plusieurs vaccins vivants atténués usuels, dont ROR et varicelle, sont contre-indiqués lorsque les CD4 sont &lt;200/µL. Elle distingue des produits particuliers, comme le vaccin non réplicatif contre le mpox : la règle doit donc être lue vaccin par vaccin. Une réplication virale non contrôlée et des CD4 bas peuvent aussi réduire la réponse à un vaccin.</p><div class="lab">Application</div><p>Avec 86 CD4/µL, M. L. nécessite une vérification individuelle des indications, du moment et des produits disponibles en Suisse. Le médecin relève les antécédents vaccinaux et organise avec l’équipe VIH les vaccinations compatibles avec son état.</p><div class="lab">Source</div><p><a href="https://eacs.sanfordguide.com/6bef0c68f5774644942e80d2e3d10bc4" target="_blank" rel="noopener" data-reference-source="1">EACS, Immunisation in Persons with HIV, 6 octobre 2025</a>, consultée le 8 octobre 2026 ; le calendrier et les autorisations suisses doivent être vérifiés pour chaque produit.</p></template>

<template data-pop="b24-pa-sources" data-title="Références : une version propre à chaque texte"><div class="lab">Textes et versions</div><p>Le diagnostic suit la directive OFSP 2025 version 4 du 10 juillet 2026 ; les données mondiales et I = I renvoient à la fiche OMS du 27 juillet 2026. Les conduites européennes suivent les pages EACS 13.0 consultées le 8 octobre 2026, dont les mises à jour propres vont du 1er au 9 octobre 2025. La classification clinique OMS sert au bilan de la maladie avancée.</p><div class="lab">Lire selon le contexte</div><p>Un seuil de prophylaxie, une classification et un calendrier de traitement répondent à des questions différentes. Les pages EACS guident la décision clinique mais le choix du produit et les règles locales de soins se vérifient en Suisse.</p><div class="lab">Accès aux références</div><p><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive de dépistage 2025 v4</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026</a> ; <a href="https://www.eacsociety.org/guidelines/eacs-guidelines/" target="_blank" rel="noopener" data-reference-source="1">EACS, Guidelines 13.0, édition 2025</a>, consultés le 8 octobre 2026.</p></template>

<template data-pop="b24-pa-pareto-definitions" data-title="Pareto clinique : trois questions liées"><div class="lab">Ordonner le bilan</div><p>La confirmation établit l’infection VIH. Les CD4 renseignent sur l’immunodépression et le besoin de protection. Les symptômes et l’examen servent à reconnaître une complication à traiter aujourd’hui ; aucun de ces éléments ne remplace les deux autres.</p><div class="lab">Application à M. L.</div><p>Le VIH-1 est confirmé ; 86 CD4/µL signalent une maladie avancée et des mesures de prévention ; la fièvre et la candidose demandent un diagnostic clinique propre. Cette synthèse n’attribue pas une autre infection opportuniste au cas.</p><div class="lab">Appui</div><p><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026, maladie avancée</a> ; <a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, Primary Prophylaxis of OIs, 3 octobre 2025</a>.</p></template>

<template data-pop="b24-pa-pareto-care" data-title="Pareto clinique : priorités de la première prise en charge"><div class="lab">Priorités initiales</div><p>Chercher une menace immédiate et la cause des symptômes ; distinguer une infection à traiter d’une prophylaxie ; prélever le bilan sans différer le projet antirétroviral ; choisir un calendrier sûr selon les infections réellement établies ; vérifier l’accès au prochain rendez-vous.</p><div class="lab">Limite du cas</div><p>Ces priorités ne créent ni pneumocystose, ni toxoplasmose, ni hépatite B chez M. L. Les résultats attendus restent inconnus jusqu’à leur réception. La synthèse est pédagogique et n’attribue aucun pourcentage de bénéfice.</p><div class="lab">Appui</div><p><a href="https://eacs.sanfordguide.com/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS, Initiation of ART, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS, OI Overview &amp; When to Start ART, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a>, consultés le 8 octobre 2026.</p></template>
