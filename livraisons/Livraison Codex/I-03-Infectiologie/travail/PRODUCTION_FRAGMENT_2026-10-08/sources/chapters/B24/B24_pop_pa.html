<template data-pop="b24-ph-mecanismes" data-title="Antirétroviraux : la cible explique la combinaison">
<div class="lab">Transcription inverse</div><p>L’emtricitabine et la lamivudine deviennent des triphosphates, le ténofovir un diphosphate ; leur incorporation interrompt l’allongement de l’ADN viral. Le ténofovir alafénamide (TAF) et le ténofovir disoproxil (TDF) sont deux prodrogues du même métabolite actif ; on ne les additionne pas. Les INNTI inhibent l’enzyme sans servir de faux substrat ; la doravirine (Pifeltro®) se prend à 100 mg une fois par jour, avec ou sans nourriture, et elle est contre-indiquée avec les inducteurs puissants du CYP3A comme la rifampicine ou la carbamazépine.</p>
<div class="lab">Intégration, maturation et classes de recours</div><p>Les INSTI bloquent le transfert de brin de l’ADN viral ; les IP empêchent la maturation des virions. En cas de multirésistance, EACS 13 prévoit des molécules à mécanisme nouveau, comme le lénacapavir, le maraviroc ou le fostemsavir, pour constituer un schéma de deux à trois médicaments actifs ; un test de tropisme précède le maraviroc. Ces molécules ne sont pas des traitements initiaux.</p>
<div class="src">Sources : <a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Virological Failure</a> ; Informations professionnelles suisses Descovy®, Dovato® et Pifeltro®, Swissmedic (AIPS), consultées le 08.10.2026.</div></template>

<template data-pop="b24-ph-biktarvy" data-title="Biktarvy® : bictégravir, emtricitabine, ténofovir alafénamide">
<div class="lab">Information professionnelle suisse (juillet 2026)</div><p>Indication : adulte naïf de traitement, ou relais chez un patient supprimé depuis au moins 6 mois sans échec ni mutation contre les inhibiteurs de l’intégrase, l’emtricitabine ou le ténofovir. Dose : 1 comprimé de 50/200/25 mg une fois par jour, avec ou sans repas. Oubli constaté dans les 18 heures : prendre la dose ; au-delà, l’omettre. Vomissement dans l’heure : reprendre un comprimé.</p>
<div class="lab">Rein, foie et contre-indications</div><p>Pas d’ajustement si clairance ≥30 mL/min ; arrêt si elle chute sous 30 ; à éviter entre 15 et 30 mL/min, ou sous 15 sans hémodialyse chronique ; sous hémodialyse chronique, prise après la séance. Non recommandé en Child-Pugh C. Contre-indiqué avec la rifampicine et le millepertuis, inducteurs puissants du CYP3A et de l’UGT1A1 ; carbamazépine et rifabutine non recommandées. L’arrêt chez une personne porteuse de l’hépatite B peut provoquer une exacerbation sévère.</p>
<div class="src">Information professionnelle suisse Biktarvy®, Swissmedic (AIPS), autorisation 66834, version de juillet 2026, consultée le 08.10.2026.</div></template>

<template data-pop="b24-ph-dovato" data-title="Dovato® : dolutégravir et lamivudine">
<div class="lab">Information professionnelle suisse (août 2025)</div><p>Indication : adulte et adolescent d’au moins 40 kg, naïf de traitement ou supprimé depuis au moins 6 mois sans échec ni mutation. Dose : 1 comprimé de 50/300 mg une fois par jour, avec ou sans repas. Non recommandé sous une clairance de 30 mL/min ; entre 30 et 49 mL/min, l’exposition à la lamivudine est 1,6 à 3,3 fois plus élevée et la toxicité hématologique doit être surveillée.</p>
<div class="lab">Interactions propres</div><p>Contre-indiqué avec la fampridine et les autres substrats à marge étroite du transporteur OCT2, et avec les fortes doses de triméthoprime-sulfaméthoxazole du traitement de la pneumocystose ; la dose de prophylaxie n’est pas visée. Antiacides à base de cations : Dovato® 2 heures avant ou 6 heures après. Rifampicine : ajouter Tivicay® 50 mg environ 12 heures après Dovato®.</p>
<div class="lab">Condition européenne</div><p>EACS 13 exige un antigène HBs négatif et un ARN &lt;500 000 copies/mL, et déconseille ce schéma après un échec suspecté de PrEP.</p>
<div class="src">Information professionnelle suisse Dovato®, Swissmedic (AIPS), autorisation 67313, août 2025, consultée le 08.10.2026 ; <a href="https://eacs.sanfordguide.com/resolveuid/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initial Regimens</a>.</div></template>

<template data-pop="b24-ph-dtg" data-title="Tivicay® : dolutégravir">
<div class="lab">Information professionnelle suisse (août 2025)</div><p>Adulte sans résistance aux inhibiteurs de l’intégrase : comprimé pelliculé de 50 mg une fois par jour, avec ou sans repas. Résistance confirmée ou suspectée, ou association avec la rifampicine, la carbamazépine ou l’éfavirenz : 50 mg deux fois par jour ; avec la rifampicine, l’association doit être évitée en cas de résistance à l’intégrase. Les comprimés dispersibles ne sont pas interchangeables : chez l’adulte, 30 mg dispersibles correspondent à 50 mg pelliculés.</p>
<p>Pas d’ajustement rénal, données limitées en dialyse ; aucune donnée en Child-Pugh C. Calcium et fer : Tivicay® 2 heures avant ou 6 heures après.</p>
<div class="src">Information professionnelle suisse Tivicay®, Swissmedic (AIPS), autorisations 63052 et 67861, août 2025, consultée le 08.10.2026.</div></template>

<template data-pop="b24-ph-socle" data-title="Socle nucléosidique : présentations suisses et rein">
<div class="lab">Descovy® : emtricitabine et ténofovir alafénamide</div><p>1 comprimé une fois par jour avec un repas : 200/25 mg avec le dolutégravir, la névirapine ou le raltégravir ; 200/10 mg avec le darunavir/ritonavir, le lopinavir/ritonavir ou l’atazanavir potentialisé ; EACS explique cette dose réduite par l’inhibition de la glycoprotéine P par ces potentialisateurs. Arrêt si la clairance chute sous 30 mL/min. Rifampicine, rifabutine et rifapentine abaissent le ténofovir alafénamide.</p>
<div class="lab">Générique Mepha d’emtricitabine et ténofovir disoproxil</div><p>Emtricitabine 200 mg et ténofovir disoproxil 245 mg (291,22 mg de phosphate), 1 comprimé par jour avec un repas. Traitement du VIH : toutes les 48 heures si la clairance est entre 30 et 49 mL/min, contre-indiqué sous 30 mL/min et en dialyse ; en PrEP, à ne pas utiliser sous 60 mL/min.</p>
<div class="lab">Choix entre les deux prodrogues</div><p>EACS 13 privilégie le ténofovir alafénamide en cas de maladie rénale ou de risque rénal, de médicaments néphrotoxiques, d’ostéoporose ou de fracture de fragilité ; sans potentialisateur, les deux ont un risque rénal et osseux à court terme très faible.</p>
<div class="src">Informations professionnelles suisses Descovy® (65921, juillet 2026) et Emtricitabin-Tenofovir-Mepha (66181, août 2024), Swissmedic (AIPS), consultées le 08.10.2026 ; <a href="https://eacs.sanfordguide.com/resolveuid/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initial Regimens, guidance II</a>.</div></template>

<template data-pop="b24-ph-dar" data-title="Darunavir potentialisé : robustesse et interactions">
<div class="lab">Place selon EACS 13</div><p>Alternative en traitement initial, à prendre au repas ; schéma préféré lorsqu’une infection survient sous PrEP par cabotégravir, en attendant le génotype. Les schémas potentialisés exposent davantage aux interactions.</p>
<div class="lab">Information professionnelle suisse Prezista® (janvier 2023)</div><p>Toujours avec le cobicistat ou le ritonavir. Patient naïf : 800 mg une fois par jour avec cobicistat 150 mg ou ritonavir 100 mg, au cours d’un repas. Patient prétraité sans mutation de résistance au darunavir, ARN &lt;100 000 copies/mL et CD4 ≥100/µL : même schéma ; dans les autres cas, 600 mg avec ritonavir 100 mg deux fois par jour. Contre-indications : clairance &lt;30 mL/min, Child-Pugh C, rifampicine, millepertuis et médicaments à marge étroite éliminés par le CYP3A4. Darunavir/cobicistat : ne pas instaurer pendant la grossesse ; rifabutine non recommandée, sinon 150 mg trois fois par semaine.</p>
<div class="lab">Symtuza® (juillet 2026)</div><p>Darunavir 800 mg, cobicistat 150 mg, emtricitabine 200 mg et ténofovir alafénamide 10 mg : 1 comprimé par jour au repas ; pas d’instauration sous 30 mL/min ; arrêt si la filtration chute sous 30.</p>
<div class="src">Informations professionnelles suisses Prezista® (57655, janvier 2023) et Symtuza® (66779, juillet 2026), Swissmedic (AIPS), consultées le 08.10.2026 ; <a href="https://eacs.sanfordguide.com/resolveuid/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initial Regimens</a>.</div></template>

<template data-pop="b24-ph-interactions" data-title="Interactions : la conduite dépend du produit">
<div class="lab">Cations polyvalents</div><p>Biktarvy®, hors grossesse : au moins 2 heures avant un antiacide à base de magnésium ou d’aluminium, à jeun, jamais simultanément ni dans les 2 heures suivantes ; avec le calcium ou le fer, 2 heures avant à jeun ou simultanément au cours d’un repas. Pendant la grossesse, le délai après ces produits passe à 6 heures. Tivicay® et Dovato® : 2 heures avant ou 6 heures après.</p>
<div class="lab">Inducteurs et transporteurs</div><p>Rifampicine : contre-indiquée avec Biktarvy® et le darunavir potentialisé ; dolutégravir à 50 mg deux fois par jour. Metformine : exposition augmentée de 79 % avec le dolutégravir, dose à réévaluer ; 39 % avec Biktarvy®, sans ajustement. Fampridine et dofétilide : contre-indiqués avec le dolutégravir. Rilpivirine : contre-indiquée avec les inhibiteurs de la pompe à protons, la rifampicine, la carbamazépine et le millepertuis ; avec la rifabutine, 50 mg par jour au repas.</p>
<div class="lab">Fluconazole</div><p>Le fluconazole augmente de 76 % l’aire sous la courbe de la rifabutine : association à utiliser avec précaution.</p>
<div class="src">Informations professionnelles suisses Biktarvy®, Tivicay®, Dovato®, Prezista®, Edurant® et Diflucan®, Swissmedic (AIPS), consultées le 08.10.2026. EACS 13 renvoie aussi au site d’interactions de l’Université de Liverpool.</div></template>

<template data-pop="b24-ph-vhb" data-title="VIH et hépatite B : maintenir une couverture active">
<div class="lab">EACS 13</div><p>Antigène HBs positif : traitement contenant du ténofovir, sauf intolérance ; l’arrêt du ténofovir est à éviter en raison du risque de réactivation grave et de décompensation. Lamivudine ou emtricitabine seules contre l’hépatite B : non recommandé, car une résistance peut apparaître. Entécavir : seulement si le ténofovir est strictement contre-indiqué, sans exposition antérieure à la lamivudine et avec un traitement antirétroviral pleinement actif. Avant une simplification sans ténofovir, le statut doit être recontrôlé.</p>
<p>Exposition ancienne isolée (anti-HBc positif, antigène HBs négatif) : un schéma dont la lamivudine ou l’emtricitabine est le seul agent actif est jugé sûr ; un schéma sans aucun agent actif impose une surveillance des transaminases, de l’antigène HBs et de l’ADN viral. Surveillance de la co-infection : tests hépatiques tous les 3 mois la première année, puis tous les 6 à 12 mois.</p>
<div class="src"><a href="https://eacs.sanfordguide.com/resolveuid/a5d3cadd036f49c9bfa7abf59f7a4c62" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Treatment and Monitoring of Persons with HBV/HIV Co-infection</a>, consulté le 08.10.2026.</div></template>

<template data-pop="b24-ph-pjp" data-title="Pneumocystose et toxoplasmose : prophylaxie primaire">
<div class="lab">Début et arrêt selon EACS 13</div><p>Sans traitement antirétroviral ou avec une charge virale détectable : CD4 &lt;200/µL, pourcentage &lt;14 % ou candidose orale. Sous traitement avec une charge indétectable : CD4 &lt;100/µL ou immunosuppression associée, par exemple prednisone &gt;20 mg par jour pendant plus de 2 semaines. Arrêt : CD4 &gt;100/µL et ARN indétectable depuis plus de 3 mois.</p>
<div class="lab">Schémas</div><p>Préféré, quelle que soit la sérologie toxoplasmique : triméthoprime-sulfaméthoxazole 80/400 mg ou 160/800 mg par jour, ou 160/800 mg trois fois par semaine ; une désensibilisation peut être tentée en cas d’allergie non sévère. Sérologie négative : dapsone 100 mg par jour, atovaquone 1500 mg par jour au repas ou pentamidine inhalée 300 mg par mois. Sérologie positive : dapsone 200 mg, pyriméthamine 75 mg et acide folinique 25 à 30 mg par semaine, ou atovaquone avec ou sans pyriméthamine. La dapsone exige la recherche d’un déficit en glucose-6-phosphate déshydrogénase.</p>
<div class="src"><a href="https://eacs.sanfordguide.com/resolveuid/1caa81786ee74bf2887fc8bce8636e1d" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary Prophylaxis of OIs</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/45a849d6c5e74e9aa848caad3d5aeed4" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, PcP</a>. Consultés le 08.10.2026.</div></template>

<template data-pop="b24-ph-mac" data-title="Mycobactéries non tuberculeuses : l’efficacité du traitement change l’indication">
<div class="lab">EACS 13</div><p>La prophylaxie n’est pas recommandée si le traitement antirétroviral commence. Elle peut s’envisager chez une personne ayant moins de 50 CD4/µL qui reste sans traitement ou virémique faute d’option suppressive, après exclusion d’une infection disséminée : azithromycine 1200 à 1250 mg par semaine, clarithromycine 500 mg deux fois par jour ou rifabutine 300 mg par jour, en vérifiant les interactions et en excluant une tuberculose avant la rifabutine. À 86 CD4/µL avec un traitement imminent, M. L. n’a pas d’indication.</p>
<div class="src"><a href="https://eacs.sanfordguide.com/resolveuid/1caa81786ee74bf2887fc8bce8636e1d" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary Prophylaxis of OIs</a>, consulté le 08.10.2026.</div></template>

<template data-pop="b24-ph-tmpsmx" data-title="Bactrim® forte : prévention, rein et toxicité">
<div class="lab">Information professionnelle suisse (mars 2023)</div><p>1 comprimé contient triméthoprime 160 mg et sulfaméthoxazole 800 mg. Prévention de la pneumocystose chez l’adulte et l’adolescent : 1 comprimé trois fois par semaine. Clairance &gt;30 mL/min : posologie habituelle ; 15 à 30 : moitié de la posologie ; &lt;15 : contre-indiqué. Hémodialyse : dose initiale standard, puis demi-dose après chaque séance, avec surveillance des concentrations.</p>
<p>Surveiller la créatinine, la kaliémie et l’hémogramme : l’hyperkaliémie est très fréquente aux fortes doses. Le méthotrexate est déconseillé, car l’association expose à une pancytopénie ; la phénytoïne aussi. La forme orale de 80/400 mg ne figure pas dans le corpus AIPS consulté.</p>
<div class="src">Information professionnelle suisse Bactrim® forte, Swissmedic (AIPS), autorisation 48306, mars 2023, consultée le 08.10.2026.</div></template>

<template data-pop="b24-ph-tmpsmx-ecart" data-title="Notice suisse et EACS : rythme de la prophylaxie">
<div class="lab">Deux sources, deux rythmes</div><p>L’information professionnelle suisse de Bactrim® forte (mars 2023) fixe la prévention de la pneumocystose à 1 comprimé de 160/800 mg trois fois par semaine. EACS 13.0 (2025), plus récent, admet trois schémas équivalents : 80/400 mg par jour, 160/800 mg par jour ou 160/800 mg trois fois par semaine, et précise que ces schémas protègent aussi contre la toxoplasmose.</p>
<div class="lab">Conduite retenue pour l’examen fédéral</div><p>La posologie autorisée en Suisse est celle de la notice : 1 comprimé forte trois fois par semaine. Ce rythme figure aussi parmi les options d’EACS. Un schéma quotidien relève de la décision du spécialiste, hors du libellé de la notice.</p>
<div class="src">Information professionnelle suisse Bactrim® forte, Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://eacs.sanfordguide.com/resolveuid/1caa81786ee74bf2887fc8bce8636e1d" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary Prophylaxis of OIs</a>.</div></template>

<template data-pop="b24-ph-candidose" data-title="Candidose oropharyngée : notice suisse et EACS">
<div class="lab">Information professionnelle suisse de Diflucan® (juillet 2026)</div><p>Candidose oropharyngée : 200 à 400 mg le premier jour, puis 100 à 200 mg une fois par jour pendant 7 à 21 jours, jusqu’à la rémission ; traitement plus long possible chez le patient fortement immunodéprimé. Candidose œsophagienne : même dose de charge, puis 100 à 200 mg par jour pendant 14 à 30 jours.</p>
<div class="lab">EACS 13</div><p>Candidose oropharyngée : fluconazole 150 à 200 mg par jour pendant 5 à 7 jours, ou nystatine ou amphotéricine B orale pendant 7 à 14 jours. Œsophagite : 400 mg pendant 3 jours, ou 400 mg puis 200 mg pendant 10 à 14 jours. La posologie autorisée en Suisse est celle de la notice ; EACS raccourcit la durée.</p>
<div class="lab">Calendrier antirétroviral</div><p>Une candidose ne retarde pas le traitement antirétroviral au-delà de 2 semaines après le début de l’antifongique.</p>
<div class="src">Information professionnelle suisse Diflucan® gélules, Swissmedic (AIPS), autorisation 49503, consultée le 08.10.2026 ; <a href="https://eacs.sanfordguide.com/resolveuid/e8b771ed7eee45459b78ef1371ef1802" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Candidiasis</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, When to Start ART</a>.</div></template>

<template data-pop="b24-ph-prep-echec" data-title="Infection acquise sous PrEP : protéger la barrière génétique">
<div class="lab">EACS 13</div><p>Sous PrEP orale par ténofovir disoproxil et emtricitabine : remplacer la PrEP, sans interruption, par un traitement triple dont le troisième agent a une haute barrière génétique, de préférence le dolutégravir ou le bictégravir, sinon le darunavir potentialisé. Sous cabotégravir injectable : commencer immédiatement un traitement triple avec darunavir potentialisé, à ajuster au génotype. Dans les deux cas, éviter une bithérapie tant que le génotype ne l’autorise pas.</p>
<div class="src"><a href="https://eacs.sanfordguide.com/resolveuid/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initial Regimens, considérations</a>, consulté le 08.10.2026.</div></template>

<template data-pop="b24-ph-demarrage" data-title="M. L. : démarrage rapide sans inventer le bilan">
<div class="lab">Données disponibles</div><p>34 ans ; VIH-1 confirmé, ARN 180 000 copies/mL, CD4 86/µL ; fièvre, amaigrissement, candidose orale ; pas de dyspnée ni de signe neurologique rapportés. Clairance rénale, hépatite B, IgG anti-<i>Toxoplasma</i>, antigène cryptococcique, génotype et historique de PrEP sont inconnus.</p>
<div class="lab">Décision conditionnelle</div><p>Prélever le bilan, rechercher une méningite cryptococcique ou une tuberculose qui changerait le calendrier, commencer la prophylaxie et le fluconazole, puis le traitement antirétroviral dans les 2 semaines. Avant le génotype, EACS 13 recommande un inhibiteur de l’intégrase de deuxième génération : par exemple Biktarvy® 1 comprimé par jour, si la clairance est ≥30 mL/min et en l’absence de rifampicine. Le schéma est ajusté dès le retour des résultats.</p>
<div class="src"><a href="https://eacs.sanfordguide.com/resolveuid/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initiation of ART</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, When to Start ART</a> ; Information professionnelle suisse Biktarvy®, Swissmedic (AIPS), consultée le 08.10.2026. Application pédagogique au cas.</div></template>

<template data-pop="pareto-b24-ph" data-title="Loi de Pareto — Pharmacologie du VIH">
<p class="ratio" data-cover="b24-p-1,b24-p-2,b24-p-3,b24-p-4,b24-p-5,b24-p-6"></p><ul><li>Traiter toute personne vivant avec le VIH ; avant le génotype, choisir un inhibiteur de l’intégrase de deuxième génération.</li><li>Dolutégravir/lamivudine exige un antigène HBs négatif et un ARN &lt;500 000 copies/mL ; la rilpivirine exige CD4 &gt;200/µL et ARN &lt;100 000 copies/mL.</li><li>Biktarvy® et Dovato® : 1 comprimé par jour ; à éviter ou non recommandés sous 30 mL/min.</li><li>Rifampicine : contre-indiquée avec Biktarvy® et le darunavir ; dolutégravir deux fois par jour.</li><li>Cations : Tivicay® et Dovato® 2 heures avant ou 6 heures après.</li><li>Antigène HBs positif : ténofovir obligatoire, jamais interrompu.</li><li>CD4 &lt;200/µL ou candidose orale : triméthoprime-sulfaméthoxazole ; notice suisse 1 comprimé forte trois fois par semaine.</li><li>Pas de prophylaxie des mycobactéries si le traitement commence.</li></ul></template>
