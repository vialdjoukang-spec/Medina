<template data-pop="b24-ph-mecanismes" data-title="Antirétroviraux : la cible explique la combinaison">
<div class="lab">Transcription, intégration et maturation</div><p data-source="swiss-mepha">FTC devient triphosphate, le ténofovir diphosphate ; leur incorporation inhibe l’allongement de l’ADN viral.</p><p data-source="swiss-dovato">3TC agit aussi après phosphorylation et provoque une terminaison de chaîne.</p><p data-source="nih-nrti">TAF et TDF fournissent le même métabolite actif, avec des expositions différentes.</p><p data-source="nih-cycle">Les INNTI inhibent la transcriptase inverse sans servir de faux substrat.</p>
<div class="lab">Autres étapes du cycle</div><p data-source="nih-cycle">Les INSTI bloquent le transfert de brin de l’ADN viral ; les IP empêchent la maturation protéique. Maraviroc agit sur l’entrée via CCR5, enfuvirtide sur la fusion et fostemsavir sur l’attachement. Le lénacapavir perturbe la capside. Ces cibles ne constituent pas une liste de traitements initiaux interchangeables.</p>
<p data-source="eacs-failure">Un test de tropisme est nécessaire avant un antagoniste CCR5.</p><p data-source="eacs-failure">En multirésistance, demander un avis spécialisé.</p>
<div class="src">Sources consultées le 8 octobre 2026 : <a href="https://hivinfo.nih.gov/understanding-hiv/fact-sheets/hiv-life-cycle" target="_blank" rel="noopener" data-reference-source="1">NIH, cycle VIH, revu le 9 avril 2025</a>, pour les mécanismes seulement ; <a href="https://eacs.sanfordguide.com/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS, « Virological Failure », 9 octobre 2025</a>, test de tropisme si maraviroc envisagé et avis multidisciplinaire en multirésistance ; <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=66181&amp;lang=FR&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI suisse Mepha, août 2024</a> ; <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=67313&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI suisse Dovato, août 2025</a>.</div></template>

<template data-pop="b24-ph-biktarvy" data-title="Biktarvy : association fixe BIC/FTC/TAF">
<div class="lab">Information professionnelle suisse</div><p data-source="swiss-biktarvy">BIC 50/FTC 200/TAF 25 mg : un comprimé quotidien, avec ou sans repas. La FI consultée vise l’adulte dès 18 ans ; les modalités américaines pédiatriques ne s’y transposent pas.</p>
<div class="lab">Rein et limites</div><p data-source="swiss-biktarvy">Pas d’ajustement à clairance ≥30 mL/min ; données limitées entre 30 et 60. Éviter à 15–&lt;30, ou &lt;15 hors hémodialyse chronique. Si la clairance baisse sous 30, la FI demande l’arrêt. L’exception adulte sous hémodialyse chronique prévoit une prise après séance et exige une appréciation spécialisée. Insuffisance hépatique Child-Pugh C : non recommandé.</p>
<p data-source="swiss-biktarvy">Rifampicine et millepertuis sont contre-indiqués. Rechercher interactions avec cations et signes de toxicité rénale ; une interruption chez une personne coinfectée VHB expose à une exacerbation.</p>
<div class="src">Source primaire : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=66834&amp;lang=FR&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, Biktarvy, autorisation 66834, juillet 2026</a>, FI française lue. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-dovato" data-title="Dovato : DTG/3TC après sélection du dossier">
<div class="lab">Dose et adaptation</div><p data-source="swiss-dovato">DTG 50/3TC 300 mg : un comprimé quotidien, avec ou sans repas. Association fixe non recommandée à clairance &lt;30 mL/min ; à 30–49, l’exposition à 3TC augmente : surveiller anémie/neutropénie. Si une réduction de 3TC s’impose, employer des composants séparés. DTG seul n’exige pas la même adaptation rénale.</p>
<div class="lab">Interactions à ne pas confondre</div><p data-source="swiss-dovato">La FI contre-indique le co-trimoxazole aux fortes doses du traitement PJP. Cela ne signifie pas que toute prophylaxie TMP/SMX est interdite. Les cations imposent un espacement. Avec rifampicine, la FI prévoit DTG 50 mg supplémentaire environ 12 heures après Dovato ; deux comprimés Dovato ne sont pas la solution.</p>
<div class="src">Source primaire : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=67313&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, Dovato, autorisation 67313, août 2025</a>, FI allemande lue. Sélection initiale : <a href="https://eacs.sanfordguide.com/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS, « Initial Regimens: ART-naïve Adults », 6 novembre 2025</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-dtg" data-title="Dolutégravir : choisir aussi les deux INTI">
<div class="lab">Tivicay adulte : forme exacte</div><p data-source="swiss-tivicay">Sans résistance INSTI : comprimé pelliculé 50 mg une fois/jour, avec ou sans repas. Sans résistance, avec rifampicine : 50 mg deux fois/jour ; si résistance INSTI, cette association doit être évitée. Les comprimés dispersibles ont une autre biodisponibilité : 30 mg dispersible adulte n’est pas 30 mg pelliculé. Ne pas échanger les formes à dose égale.</p>
<p data-source="swiss-tivicay">Pas d’ajustement de DTG pour l’insuffisance rénale ; données de dialyse limitées. Les restrictions du socle s’appliquent séparément. Surveiller la metformine, dont l’exposition augmente, et espacer les cations.</p>
<div class="lab">Le schéma complet</div><p data-source="eacs-regimens">TAF/FTC, TDF/FTC ou TDF/3TC accompagnent DTG selon le dossier. Une monothérapie DTG ne remplace pas ces schémas initiaux.</p>
<div class="src">Sources : <a href="https://compendium.ch/de/product/1476570-tivicay-disp-tabl-5-mg" target="_blank" rel="noopener" data-reference-source="1">Tivicay, texte professionnel suisse indexé, août 2025, autorisations 63052/67861</a> : sections posologie, rein, interactions et version réellement lues ; accès direct AIPS indisponible. <a href="https://eacs.sanfordguide.com/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS, « Initial Regimens: ART-naïve Adults », 6 novembre 2025</a> : DTG avec deux INTI. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-socle" data-title="TAF/TDF avec FTC/3TC : présentation et rein">
<div class="lab">Exemple suisse réellement vérifié</div><p data-source="swiss-mepha">Emtricitabin-Tenofovir-Mepha : FTC 200 mg + ténofovir disoproxil 245 mg (phosphate 291,22 mg), un comprimé quotidien avec repas. VIH traité : clairance 30–49, une prise toutes les 48 heures, recommandation fondée sur modélisation avec surveillance rapprochée ; &lt;30 ou dialyse, contre-indiqué. La restriction &lt;60 concerne sa PrEP et ne remplace pas ce tableau VIH.</p>
<p data-source="swiss-mepha eacs-regimens">Sa FI décrit l’association initiale à un INNTI ou un IP. L’EACS 2025 recommande aussi DTG avec deux INTI pour des patients sélectionnés ; cette recommandation clinique n’étend pas à elle seule le libellé de la FI Mepha. Si un autre socle ou une association fixe à TAF est retenu, ses doses, interactions et limites rénales sont vérifiées dans sa propre FI suisse avant prescription.</p>
<div class="src">Sources consultées le 8 octobre 2026 : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=66181&amp;lang=FR&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI suisse Emtricitabin-Tenofovir-Mepha n° 66181, août 2024, Posologie et fonction rénale</a> ; <a href="https://eacs.sanfordguide.com/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS, « Initial Regimens: ART-naïve Adults », 6 novembre 2025, tableau des schémas initiaux</a>.</div></template>

<template data-pop="b24-ph-dar" data-title="Darunavir potentialisé : robustesse et interactions">
<div class="lab">Place dans le traitement initial</div><p data-source="eacs-pi">Le darunavir potentialisé a une place particulière après infection VIH survenue sous PrEP par cabotégravir prolongé : l’EACS recommande une trithérapie comprenant DRV potentialisé en attendant le génotype, intégrase comprise. Les interactions et le statut VIH antérieur doivent être évalués. Pendant la grossesse, l’EACS propose DRV/r 600/100 mg deux fois par jour si un IP est retenu. La FI suisse Prezista précise que DRV/c ne doit pas être instauré pendant la grossesse et demande un changement si une grossesse survient sous cette association.</p>
<div class="lab">FI suisse Prezista n°57655, posologie adulte</div><p data-source="swiss-prezista">Chez l’adulte naïf, Prezista 800 mg avec ritonavir 100 mg ou cobicistat 150 mg une fois par jour au cours d’un repas. Chez le prétraité, cette cadence n’est indiquée que si aucune mutation associée à la résistance au darunavir, ARN VIH-1 &lt;100 000 copies/mL <b>et</b> CD4 ≥100/µL. Dans les autres situations prétraitées, la FI décrit 600 mg avec ritonavir 100 mg deux fois par jour. Le statut naïf ou prétraité et le génotype restent à établir chez M. L.</p>
<div class="alert">La FI suisse Symtuza n°66779 limite l’association fixe à l’adulte naïf ou contrôlé virologiquement depuis au moins six mois sans échec sous darunavir ni mutation pertinente. M. L. a une virémie à 180 000 copies/mL ; il ne satisfait pas la branche de relais contrôlé. La fonction rénale, les interactions et les autres conditions se vérifient dans la FI du produit réellement envisagé.</div>
<div class="src">Sources consultées le 8 octobre 2026 : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57655" target="_blank" rel="noopener" data-reference-source="1">FI Prezista n°57655, janvier 2023, indications et posologie</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66779" target="_blank" rel="noopener" data-reference-source="1">FI Symtuza n°66779, juillet 2026, indications et posologie</a> ; <a href="https://eacs.sanfordguide.com/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS, Initial Regimens: ART-naïve Adults, 6 novembre 2025</a> ; <a href="https://eacs.sanfordguide.com/1cc2030e4d4f4f039f101fa4239e52ec" target="_blank" rel="noopener" data-reference-source="1">EACS, ART in Pregnancy, 18 novembre 2025</a>.</div>
</template>

<template data-pop="b24-ph-interactions" data-title="Interactions : la conduite dépend du produit">
<div class="lab">Cations : horaires de la FI suisse</div><p data-source="swiss-biktarvy">Biktarvy, hors grossesse : Mg/Al, prendre au moins deux heures avant, éviter simultanéité et les deux heures suivant l’antiacide. Ca/fer/zinc : deux heures avant à jeun, ou simultanément avec nourriture. En grossesse, les prises après cations demandent six heures : vérifier la FI dédiée.</p>
<p data-source="swiss-tivicay">Tivicay : deux heures avant ou six heures après Mg/Al, calcium ou fer dans la FI suisse lue. Ne pas importer ici l’exception alimentaire d’un autre produit.</p>
<div class="lab">Induction et transporteurs</div><p data-source="swiss-dovato">DTG et metformine nécessitent une réévaluation de la dose antidiabétique. Les substrats OCT2 à marge étroite, notamment dofétilide/fampridine, sont contre-indiqués avec Dovato.</p>
<p data-source="swiss-prezista-interactions">Rifampicine est contre-indiquée avec DRV/r et DRV/c. La FI Prezista ne recommande pas rifabutine avec DRV/c, mais prévoit adaptation et surveillance si l’association s’avère nécessaire. Avec DRV/r, elle demande aussi une vérification spécifique. Les règles des rifamycines ne sont pas identiques.</p>
<p data-source="eacs-regimens">L’EACS ne retient pas la rilpivirine orale avec un médicament augmentant le pH gastrique, notamment un inhibiteur de la pompe à protons ; elle exige un repas. Si un anti-H2 ou un antiacide est en cause, les modalités du produit exact sont vérifiées dans sa FI avant tout choix. La chélation des INSTI et l’effet du pH sur la rilpivirine sont des mécanismes distincts.</p>
<div class="src">Sources consultées le 8 octobre 2026 : FI suisses Biktarvy, juillet 2026, Tivicay et Dovato, août 2025, reliées dans leurs fenêtres ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57655" target="_blank" rel="noopener" data-reference-source="1">FI suisse Prezista n° 57655, janvier 2023, interactions rifampicine et rifabutine</a> ; <a href="https://eacs.sanfordguide.com/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS, « Initial Regimens: ART-naïve Adults », 6 novembre 2025</a>, ligne rilpivirine : repas et absence de médicaments augmentant le pH gastrique.</div></template>

<template data-pop="b24-ph-vhb" data-title="VIH/VHB : maintenir une couverture active">
<div class="lab">Avant le choix et lors d’un changement</div><p data-source="eacs-hbv">Un statut VHB inconnu n’est pas un résultat négatif. Chez une personne HBsAg positive, préserver la couverture VHB active lors de tout changement d’ART. L’EACS ne retient l’entécavir que si TDF et TAF sont strictement contre-indiqués, sans exposition préalable à 3TC, et toujours avec un traitement VIH pleinement actif. Un schéma DTG/3TC ou injectable ne doit pas interrompre silencieusement TDF/TAF ; FTC ou 3TC seules contre VHB favorisent une résistance.</p>
<div class="key">Le contrôle du VIH et le contrôle du VHB sont deux objectifs à préserver simultanément.</div>
<div class="src"><a href="https://eacs.sanfordguide.com/a5d3cadd036f49c9bfa7abf59f7a4c62" target="_blank" rel="noopener" data-reference-source="1">EACS, Treatment and Monitoring of Persons with HBV/HIV Co-infection, 1er octobre 2025</a>, consulté le 8 octobre 2026.</div>
</template>

<template data-pop="b24-ph-pjp" data-title="PJP : prophylaxie primaire et conditions d’arrêt">
<div class="lab">Indication et réévaluation</div><p data-source="eacs-pjp">Selon l’EACS, une prévention PJP est indiquée hors traitement VIH ou avec ARN détectable si CD4 &lt;200/µL, pourcentage de CD4 &lt;14 % ou candidose orale récidivante ; sous traitement avec ARN indétectable, elle est indiquée si CD4 &lt;100/µL ou en présence d’une immunosuppression supplémentaire. L’EACS propose TMP/SMX 80/400 mg quotidien, 160/800 mg quotidien ou 160/800 mg trois fois par semaine. L’arrêt requiert CD4 &gt;100/µL <b>et</b> ARN indétectable depuis plus de trois mois ; réévaluer si les conditions d’indication réapparaissent. Une infection suspectée exige un traitement spécifique.</p>
<div class="src">Sources consultées le 8 octobre 2026 : <a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, Primary Prophylaxis of OIs, 3 octobre 2025, PJP</a> ; <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=48306&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI suisse Bactrim forte n°48306, mars 2023, prévention PJP à 160/800 mg trois fois/semaine</a>.</div></template>

<template data-pop="b24-ph-toxo" data-title="Toxoplasmose : la sérologie conditionne la prévention">
<div class="lab">Prévention primaire</div><p data-source="eacs-toxo">L’indication spécifique de prévention toxoplasmique dépend d’IgG positives et d’une immunodépression avancée. Les trois schémas de TMP/SMX retenus par l’EACS pour la prévention PJP — 80/400 mg quotidien, 160/800 mg quotidien ou 160/800 mg trois fois/semaine — sont également actifs contre le toxoplasme. À CD4 86/µL, la prévention PJP de M. L. ne doit pas attendre ses IgG ; si elles sont positives, vérifier que le produit et le schéma choisis assurent les deux protections. L’arrêt de la prévention combinée requiert CD4 &gt;100/µL et ARN indétectable plus de trois mois selon l’EACS. Un antécédent d’encéphalite nécessiterait une prévention secondaire distincte.</p>
<div class="src"><a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, Primary Prophylaxis of OIs, 3 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/89a4ed1dfa8e4ebd9c4a8647411c785e" target="_blank" rel="noopener" data-reference-source="1">EACS, Toxoplasma gondii Encephalitis, 1er octobre 2025</a> ; <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=48306&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI suisse Bactrim forte n°48306, mars 2023, posologie PJP</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-mac" data-title="MAC : l’efficacité de l’ART change l’indication">
<div class="lab">Indication EACS selon ART, virémie et CD4</div><p data-source="eacs-oi">L’EACS ne recommande pas de prophylaxie primaire du MAC si un ART est commencé. Elle peut être envisagée à CD4 &lt;50/µL chez une personne qui reste hors ART ou demeure virémique sous ART sans option de contrôle virologique. Avant toute prophylaxie, exclure une maladie MAC disséminée. À CD4 86/µL, M. L. n’a pas d’indication préventive MAC, quel que soit le résultat encore inconnu de son bilan de résistance ; son ART et sa fièvre demandent une évaluation propre.</p>
<div class="src">Source lue le 8 octobre 2026 : <a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, « Primary Prophylaxis of OIs », mise à jour du 3 octobre 2025, ligne CD4 &lt;50/µL « Non-Tuberculous Mycobacteria » incluant MAC</a>. Aucune dose empirique MAC n’est proposée pour ce cas.</div></template>

<template data-pop="b24-ph-tmpsmx" data-title="TMP/SMX : indication préventive, rein et toxicité">
<div class="lab">Bactrim forte : information suisse</div><p data-source="swiss-bactrim">Un comprimé contient TMP 160 mg + SMX 800 mg. La FI prévoit un comprimé trois fois/semaine en prévention PJP. Clairance &gt;30 mL/min : dose usuelle ; 15–30 : moitié de la dose ; &lt;15 : contre-indiqué. Dialyse : régime spécifique, non extrapolé ici. Surveiller créatinine, potassium et hémogramme ; rechercher interactions, notamment méthotrexate et médicaments hyperkaliémiants. Une éruption sévère ou une cytopénie change la conduite. Une ancienne allergie doit être caractérisée.</p>
<div class="lab">Limite de la comparaison</div><p>Le schéma quotidien est aussi admis par EACS 2025, mais la FI suisse du produit précis indique trois prises hebdomadaires pour la prévention PJP. La décision pour une personne également IgG Toxoplasma positive exige d’évaluer cette seconde indication avec l’infectiologue et de vérifier la prescription du produit exact. Les doses préventives ne traitent pas une PJP. Une autre forme orale suisse de TMP/SMX à 80/400 mg n’a pas été vérifiée dans cette recherche ; une ampoule intraveineuse de même quantité n’est pas un comprimé.</p>
<div class="src">Source primaire : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=48306&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, Bactrim forte 48306, mars 2023</a>, FI allemande intégrale lue. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-demarrage" data-title="M. L. : démarrage rapide sans inventer le bilan">
<div class="lab">Données disponibles</div><p>34 ans ; VIH-1 confirmé, ARN 180 000 copies/mL, CD4 86/µL ; fièvre, amaigrissement, candidose orale ; absence rapportée de dyspnée et de signes neurologiques. La clairance rénale, les sérologies VHB, les IgG Toxoplasma, le génotype et l’historique PrEP/PEP sont inconnus.</p>
<div class="lab">Décision conditionnelle</div><p data-source="eacs-initiation eacs-oi-art">Prélever le bilan, rechercher une infection concomitante qui changerait le calendrier, organiser l’adhérence et un approvisionnement continu. L’EACS recommande de ne pas retarder l’ART dans l’attente du génotype : un schéma initial à forte barrière de résistance peut être adapté après résultat. Une méningite cryptococcique ou tuberculeuse demanderait un calendrier particulier ; la candidose orale seule n’est pas une raison de différer l’ART.</p>
<p>BIC/TAF/FTC ou DTG avec deux INTI constituent des options à confronter au rein, aux interactions et aux expositions antérieures. Le cas ne permet pas de choisir définitivement un produit et une dose comme si tous les contrôles étaient déjà normaux.</p>
<div class="src">Sources lues le 8 octobre 2026 : <a href="https://eacs.sanfordguide.com/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS, « Initiation of ART: No Prior ART Exposure », 6 octobre 2025</a>, génotype sans report du traitement ; <a href="https://eacs.sanfordguide.com/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS, « Initial Regimens: ART-naïve Adults », 6 novembre 2025</a>, schémas initiaux ; <a href="https://eacs.sanfordguide.com/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS, « Opportunistic Infections and Other Co-infections — When to start ART », 6 octobre 2025</a>, exceptions de calendrier.</div></template>

<template data-pop="pareto-b24-ph" data-title="Loi de Pareto — Pharmacologie VIH">
<div class="ratio" data-cover="b24-p-1,b24-p-2,b24-p-3,b24-p-4,b24-p-5,b24-p-6">Les décisions qui organisent l’essentiel du raisonnement</div><ul><li>Viser une suppression durable avec plusieurs médicaments actifs et un accès continu.</li><li>Au démarrage rapide, tenir compte du rein, du VHB, des interactions et de la PrEP antérieure ; ne pas inventer le génotype.</li><li>Une association fixe impose les limites de chacun de ses composants.</li><li>Préserver la couverture VHB lors d’un changement d’ART.</li><li>À CD4 86 : prévenir PJP ; toxoplasmose si IgG positives ; pas de prévention MAC automatique.</li><li>Une réponse insuffisante conduit à vérifier exposition, prise et résistances avant de modifier le régime.</li></ul><div class="key">Synthèse de tout le panneau : elle ne remplace ni les conditions des fenêtres ni la distinction entre recommandations internationales et FI suisses.</div></template>
