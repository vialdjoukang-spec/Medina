<template data-pop="b24-ph-mecanismes" data-title="Antirétroviraux : la cible explique la combinaison">
<div class="lab">Transcription, intégration et maturation</div><p data-source="swiss-mepha">FTC devient triphosphate, le ténofovir diphosphate ; leur incorporation inhibe l’allongement de l’ADN viral.</p><p data-source="swiss-dovato">3TC agit aussi après phosphorylation et provoque une terminaison de chaîne.</p><p data-source="nih-nrti">TAF et TDF fournissent le même métabolite actif, avec des expositions différentes.</p><p data-source="nih-cycle">Les INNTI inhibent la transcriptase inverse sans servir de faux substrat.</p>
<div class="lab">Autres étapes du cycle</div><p data-source="nih-cycle">Les INSTI bloquent le transfert de brin de l’ADN viral ; les IP empêchent la maturation protéique. Maraviroc agit sur l’entrée via CCR5, enfuvirtide sur la fusion et fostemsavir sur l’attachement. Le lénacapavir perturbe la capside. Ces cibles ne constituent pas une liste de traitements initiaux interchangeables.</p>
<p data-source="nih-tropism">Un test de tropisme est nécessaire avant un antagoniste CCR5.</p><p data-source="nih-failure">En multirésistance, demander un avis spécialisé.</p>
<div class="src">Sources : <a href="https://hivinfo.nih.gov/understanding-hiv/fact-sheets/hiv-life-cycle" target="_blank" rel="noopener" data-reference-source="1">NIH, cycle VIH, revu le 9 avril 2025</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-nucleoside-reverse-transcriptase-inhibitor" target="_blank" rel="noopener" data-reference-source="1">NIH, INTI, 24 septembre 2026</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/co-receptor-tropism-assays" target="_blank" rel="noopener" data-reference-source="1">NIH, Co-Receptor Tropism Assays, 25 octobre 2018</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/virologic-failure?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, Virologic Failure, 12 septembre 2024</a> ; <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=66181&amp;lang=FR&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI Mepha, août 2024</a> ; <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=67313&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI Dovato, août 2025</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-biktarvy" data-title="Biktarvy : association fixe BIC/FTC/TAF">
<div class="lab">Information professionnelle suisse</div><p data-source="swiss-biktarvy">BIC 50/FTC 200/TAF 25 mg : un comprimé quotidien, avec ou sans repas. La FI consultée vise l’adulte dès 18 ans ; les modalités américaines pédiatriques ne s’y transposent pas.</p>
<div class="lab">Rein et limites</div><p data-source="swiss-biktarvy">Pas d’ajustement à clairance ≥30 mL/min ; données limitées entre 30 et 60. Éviter à 15–&lt;30, ou &lt;15 hors hémodialyse chronique. Si la clairance baisse sous 30, la FI demande l’arrêt. L’exception adulte sous hémodialyse chronique prévoit une prise après séance et exige une appréciation spécialisée. Insuffisance hépatique Child-Pugh C : non recommandé.</p>
<p data-source="swiss-biktarvy">Rifampicine et millepertuis sont contre-indiqués. Rechercher interactions avec cations et signes de toxicité rénale ; une interruption chez une personne coinfectée VHB expose à une exacerbation.</p>
<div class="src">Source primaire : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=66834&amp;lang=FR&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, Biktarvy, autorisation 66834, juillet 2026</a>, FI française lue. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-dovato" data-title="Dovato : DTG/3TC après sélection du dossier">
<div class="lab">Dose et adaptation</div><p data-source="swiss-dovato">DTG 50/3TC 300 mg : un comprimé quotidien, avec ou sans repas. Association fixe non recommandée à clairance &lt;30 mL/min ; à 30–49, l’exposition à 3TC augmente : surveiller anémie/neutropénie. Si une réduction de 3TC s’impose, employer des composants séparés. DTG seul n’exige pas la même adaptation rénale.</p>
<div class="lab">Interactions à ne pas confondre</div><p data-source="swiss-dovato">La FI contre-indique le co-trimoxazole aux fortes doses du traitement PJP. Cela ne signifie pas que toute prophylaxie TMP/SMX est interdite. Les cations imposent un espacement. Avec rifampicine, la FI prévoit DTG 50 mg supplémentaire environ 12 heures après Dovato ; deux comprimés Dovato ne sont pas la solution.</p>
<div class="src">Source primaire : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=67313&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, Dovato, autorisation 67313, août 2025</a>, FI allemande lue. Sélection initiale : NIH septembre 2026 et EACS 13, expliqués dans le cours. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-dtg" data-title="Dolutégravir : choisir aussi les deux INTI">
<div class="lab">Tivicay adulte : forme exacte</div><p data-source="swiss-tivicay">Sans résistance INSTI : comprimé pelliculé 50 mg une fois/jour, avec ou sans repas. Sans résistance, avec rifampicine : 50 mg deux fois/jour ; si résistance INSTI, cette association doit être évitée. Les comprimés dispersibles ont une autre biodisponibilité : 30 mg dispersible adulte n’est pas 30 mg pelliculé. Ne pas échanger les formes à dose égale.</p>
<p data-source="swiss-tivicay">Pas d’ajustement de DTG pour l’insuffisance rénale ; données de dialyse limitées. Les restrictions du socle s’appliquent séparément. Surveiller la metformine, dont l’exposition augmente, et espacer les cations.</p>
<div class="lab">Le schéma complet</div><p data-source="nih-nrti">TAF/FTC, TDF/FTC ou TDF/3TC accompagnent DTG selon le dossier. Une monothérapie DTG ne remplace pas ces schémas initiaux.</p>
<div class="src">Sources : <a href="https://compendium.ch/de/product/1476570-tivicay-disp-tabl-5-mg" target="_blank" rel="noopener" data-reference-source="1">Tivicay, texte professionnel suisse indexé, août 2025, autorisations 63052/67861</a> : sections posologie, rein, interactions et version réellement lues ; accès direct AIPS indisponible. <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-nucleoside-reverse-transcriptase-inhibitor" target="_blank" rel="noopener" data-reference-source="1">NIH, INTI, 24 septembre 2026</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-socle" data-title="TAF/TDF avec FTC/3TC : présentation et rein">
<div class="lab">Exemple suisse réellement vérifié</div><p data-source="swiss-mepha">Emtricitabin-Tenofovir-Mepha : FTC 200 mg + ténofovir disoproxil 245 mg (phosphate 291,22 mg), un comprimé quotidien avec repas. VIH traité : clairance 30–49, une prise toutes les 48 heures, recommandation fondée sur modélisation avec surveillance rapprochée ; &lt;30 ou dialyse, contre-indiqué. La restriction &lt;60 concerne sa PrEP et ne remplace pas ce tableau VIH.</p>
<p data-source="swiss-mepha">Sa FI décrit l’association initiale à un INNTI ou un IP. Le choix DTG + deux INTI recommandé par NIH/EACS ne prouve pas que cette FI suisse autorise explicitement toute association moderne à DTG.</p>
<div class="lab">Repères américains, à identifier comme tels</div><p data-source="nih-drug-table">NIH : TAF/FTC 25/200 mg, TDF/FTC 300/200 mg ou TDF/3TC 300/300 mg, une fois/jour à fonction rénale adaptée. Les 300 mg américains de TDF ne se substituent pas sans vérifier le sel aux 245 mg de ténofovir disoproxil suisse. Avec DRV/c/TAF/FTC, TAF est à 10 mg dans l’association.</p>
<div class="src">Sources : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=66181&amp;lang=FR&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">FI suisse Mepha 66181, août 2024, version interne 13.1</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/drug-characteristics-tables" target="_blank" rel="noopener" data-reference-source="1">NIH, annexe A, tableaux 1–2, revus le 24 septembre 2026</a>. Consultation : 8 octobre 2026. FI suisse Descovy actuelle non lue intégralement : ces doses TAF/FTC ne sont pas une affirmation de posologie autorisée suisse.</div></template>

<template data-pop="b24-ph-dar" data-title="Darunavir potentialisé : robustesse et interactions">
<div class="lab">Place dans le traitement initial</div><p data-source="nih-pi">La barrière de résistance élevée rend DRV potentialisé utile dans certains dossiers ; il est privilégié avant génotype d’intégrase après PrEP CAB-LA. Il expose à plus d’interactions liées au potentialisateur, et sa robustesse ne compense pas une prise impossible. DRV/c n’est pas recommandé pour l’initiation pendant la grossesse, en raison d’expositions réduites ; le régime non enceinte ne se transpose pas automatiquement.</p>
<div class="lab">Doses américaines réellement lues</div><p data-source="nih-pi-table">Chez l’adulte naïf ou sans mutation DRV : DRV 800 mg + RTV 100 mg une fois/jour avec repas. Chez un patient prétraité avec mutation DRV : 600/100 mg deux fois/jour avec repas, selon historique. DRV non potentialisé n’est pas recommandé. Rash, toxicité hépatique, troubles digestifs et lipidiques participent à la surveillance.</p>
<p data-source="nih-drug-table">NIH décrit aussi l’association fixe DRV 800/COBI 150/FTC 200/TAF 10 mg : un comprimé quotidien avec repas.</p>
<p data-source="nih-renal">Les restrictions rénales suivent les composants : DRV/c avec TDF n’est pas recommandé si clairance &lt;70 ; l’association fixe avec TAF/FTC n’est pas recommandée à 15–29 ou &lt;15 hors hémodialyse chronique. Child-Pugh C : non recommandé.</p>
<div class="alert">Les FI suisses actuelles de Prezista/Symtuza n’ont pas été accessibles intégralement. Les valeurs ci-dessus sont attribuées au référentiel américain et nécessitent vérification du produit suisse avant utilisation.</div>
<div class="src">Sources : <a href="https://clinicalinfo.hiv.gov/es/node/11204?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, IP initial, 24 septembre 2026</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/drug-characteristics-tables-pi-full" target="_blank" rel="noopener" data-reference-source="1">annexe A, tableau 5, mis à jour le 25 septembre 2025, revu le 24 septembre 2026</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/drug-characteristics-tables" target="_blank" rel="noopener" data-reference-source="1">annexe A, tableau 1, 24 septembre 2026</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/drug-characteristics-tables-renal-hepatic-insufficiency-full" target="_blank" rel="noopener" data-reference-source="1">tableau rénal/hépatique en ligne, sans date affichée sur cette vue</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-interactions" data-title="Interactions : la conduite dépend du produit">
<div class="lab">Cations : horaires de la FI suisse</div><p data-source="swiss-biktarvy">Biktarvy, hors grossesse : Mg/Al, prendre au moins deux heures avant, éviter simultanéité et les deux heures suivant l’antiacide. Ca/fer/zinc : deux heures avant à jeun, ou simultanément avec nourriture. En grossesse, les prises après cations demandent six heures : vérifier la FI dédiée.</p>
<p data-source="swiss-tivicay">Tivicay : deux heures avant ou six heures après Mg/Al, calcium ou fer dans la FI suisse lue. Ne pas importer ici l’exception alimentaire d’un autre produit.</p>
<div class="lab">Induction et transporteurs</div><p data-source="swiss-dovato">DTG et metformine nécessitent une réévaluation de la dose antidiabétique. Les substrats OCT2 à marge étroite, notamment dofétilide/fampridine, sont contre-indiqués avec Dovato.</p>
<p data-source="nih-pi-interactions">Rifampicine est contre-indiquée avec DRV/r et DRV/c. Rifabutine avec DRV/r demande adaptation et surveillance ; avec DRV/c, ne pas associer. Les règles des rifamycines ne sont pas identiques.</p>
<p data-source="nih-nnrti">Pour rilpivirine orale, l’inhibition de pompe à protons est contre-indiquée ; les anti-H2 et antiacides ont leurs propres espacements. La chélation des INSTI et l’effet du pH sur RPV sont des mécanismes distincts.</p>
<div class="src">Sources : FI Biktarvy juillet 2026, Tivicay et Dovato août 2025, reliées dans leurs fenêtres ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/drug-interactions-protease-inhibitors?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, interactions des IP, lignes rifampicine/rifabutine lues dans le texte indexé</a> (date précise de révision non accessible) ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-non-nucleoside-reverse-transcriptase-inhibitor" target="_blank" rel="noopener" data-reference-source="1">NIH, INNTI, 24 septembre 2026</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-vhb" data-title="VIH/VHB : maintenir une couverture active">
<div class="lab">Avant le choix et lors d’un changement</div><p data-source="nih-hbv">Un statut VHB inconnu n’est pas un résultat négatif. Chez une personne HBsAg positive, un ART sans ténofovir exige une autre couverture VHB active. L’entécavir s’ajoute à un ART pleinement suppressif : il ne constitue pas seul un traitement du VIH. Une substitution vers DTG/3TC ou un schéma injectable ne doit pas retirer silencieusement le traitement VHB. Une résistance VHB antérieure à 3TC/entécavir modifie le choix et justifie expertise.</p>
<div class="key">Le contrôle du VIH et le contrôle du VHB sont deux objectifs à préserver simultanément.</div>
<div class="src">Source : <a href="https://clinicalinfo.hiv.gov/es/node/9321?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, coinfection VHB/VIH, mis à jour et revu le 24 septembre 2026</a>. Texte anglais réellement lu dans une interface de navigation espagnole. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-pjp" data-title="PJP : prophylaxie primaire et conditions d’arrêt">
<div class="lab">Indication et réévaluation</div><p data-source="nih-pjp">Sans ART ou au début, prophylaxie si CD4 &lt;200. Sous ART : &lt;100 quel que soit l’ARN, ou 100–200 avec virémie persistante. NIH préfère aussi TMP/SMX 80/400 mg quotidien pour PJP seule. Arrêter normalement après CD4 ≥200 pendant ≥3 mois sous ART ; un arrêt à 100–200 peut être envisagé si ARN indétectable 3–6 mois. Reprendre à &lt;100, ou 100–200 avec ARN durablement détectable. Une infection suspectée nécessite un traitement spécifique.</p>
<div class="src">Source : <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/pneumocystis?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, Pneumocystis, actualisé et revu le 27 mai 2026</a>, prévention primaire. Consultation : 8 octobre 2026. Dose du schéma préféré et distinction de la FI suisse dans le cours.</div></template>

<template data-pop="b24-ph-toxo" data-title="Toxoplasmose : la sérologie conditionne la prévention">
<div class="lab">Prévention primaire</div><p data-source="nih-toxo">À CD4 &lt;100, l’indication dépend d’IgG positives. TMP/SMX 160/800 mg quotidien est préféré ; trois fois/semaine est alternatif. Arrêt habituel : CD4 &gt;200 durant &gt;3 mois et suppression virologique soutenue ; possibilité à 100–200 avec ARN indétectable 3–6 mois. Reprise si &lt;100, ou 100–200 avec ARN détectable. Un antécédent d’encéphalite implique une prévention secondaire différente ; ne pas appliquer ces règles primaires à son entretien.</p>
<div class="src">Source : <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/toxoplasmosis?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, toxoplasmose, actualisé le 9 septembre 2025, revu le 23 juin 2026</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-mac" data-title="MAC : l’efficacité de l’ART change l’indication">
<div class="lab">Pas de prophylaxie automatique devant tout CD4 bas</div><p data-source="nih-mac">La prophylaxie primaire n’est pas recommandée si un ART efficace débute immédiatement, quel que soit CD4. L’indication sélectionnée concerne CD4 &lt;50 avec absence d’ART, virémie persistante ou aucun régime pleinement suppressif disponible. Avant prophylaxie, rechercher un MAC actif ; si une hémoculture est demandée, attendre son résultat pour éviter une monothérapie génératrice de résistance. Une prophylaxie primaire antérieure peut être arrêtée sous ART pleinement suppressif. À CD4 86, ce cas n’a pas d’indication préventive MAC.</p>
<div class="src">Source : <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/disseminated?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, MAC disséminé, actualisé et revu le 27 mai 2026</a>. Consultation : 8 octobre 2026. Aucune dose empirique MAC n’est proposée pour ce cas.</div></template>

<template data-pop="b24-ph-tmpsmx" data-title="TMP/SMX : indication préventive, rein et toxicité">
<div class="lab">Bactrim forte : information suisse</div><p data-source="swiss-bactrim">Un comprimé contient TMP 160 mg + SMX 800 mg. La FI prévoit un comprimé trois fois/semaine en prévention PJP. Clairance &gt;30 mL/min : dose usuelle ; 15–30 : moitié de la dose ; &lt;15 : contre-indiqué. Dialyse : régime spécifique, non extrapolé ici. Surveiller créatinine, potassium et hémogramme ; rechercher interactions, notamment méthotrexate et médicaments hyperkaliémiants. Une éruption sévère ou une cytopénie change la conduite. Une ancienne allergie doit être caractérisée.</p>
<div class="lab">Limite de la comparaison</div><p>Le schéma quotidien du cours vient des recommandations VIH NIH. Les doses préventives ne traitent pas une PJP. Une autre forme orale suisse de TMP/SMX à 80/400 mg n’a pas été vérifiée dans cette recherche ; une ampoule intraveineuse de même quantité n’est pas un comprimé.</p>
<div class="src">Source primaire : <a href="https://www.swissmedicinfo-pro.ch/showText.aspx?authNr=48306&amp;lang=DE&amp;supportMultipleResults=1&amp;textType=FI" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, Bactrim forte 48306, mars 2023</a>, FI allemande intégrale lue. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b24-ph-demarrage" data-title="M. L. : démarrage rapide sans inventer le bilan">
<div class="lab">Données disponibles</div><p>34 ans ; VIH-1 confirmé, ARN 180 000 copies/mL, CD4 86/µL ; fièvre, amaigrissement, candidose orale ; absence rapportée de dyspnée et de signes neurologiques. La clairance rénale, les sérologies VHB, les IgG Toxoplasma, le génotype et l’historique PrEP/PEP sont inconnus.</p>
<div class="lab">Décision conditionnelle</div><p data-source="nih-initiation">Prélever le bilan, rechercher une infection concomitante qui changerait le calendrier, organiser l’adhérence et un approvisionnement continu. Un ART adapté peut commencer avant le retour du génotype, puis être ajusté ; la présence de candidose orale seule n’est pas une raison d’attendre la restauration immunitaire.</p>
<p>BIC/TAF/FTC ou DTG avec deux INTI constituent des options à confronter au rein, aux interactions et aux expositions antérieures. Le cas ne permet pas de choisir définitivement un produit et une dose comme si tous les contrôles étaient déjà normaux.</p>
<div class="src">Source : <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/initiation-antiretroviral-therapy" target="_blank" rel="noopener" data-reference-source="1">NIH, initiation ART, 25 septembre 2025</a>. Choix des schémas : <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-initial-combination-regimens?view=full" target="_blank" rel="noopener" data-reference-source="1">NIH, 24 septembre 2026</a>. Application pédagogique au cas, consultation : 8 octobre 2026.</div></template>

<template data-pop="pareto-b24-ph" data-title="Loi de Pareto — Pharmacologie VIH">
<div class="ratio" data-cover="b24-p-1,b24-p-2,b24-p-3,b24-p-4,b24-p-5,b24-p-6">Les décisions qui organisent l’essentiel du raisonnement</div><ul><li>Viser une suppression durable avec plusieurs médicaments actifs et un accès continu.</li><li>Au démarrage rapide, tenir compte du rein, du VHB, des interactions et de la PrEP antérieure ; ne pas inventer le génotype.</li><li>Une association fixe impose les limites de chacun de ses composants.</li><li>Préserver la couverture VHB lors d’un changement d’ART.</li><li>À CD4 86 : prévenir PJP ; toxoplasmose si IgG positives ; pas de prévention MAC automatique.</li><li>Une réponse insuffisante conduit à vérifier exposition, prise et résistances avant de modifier le régime.</li></ul><div class="key">Synthèse de tout le panneau : elle ne remplace ni les conditions des fenêtres ni la distinction entre recommandations internationales et FI suisses.</div></template>
