<template data-pop="b24-examens" data-title="Loi de Pareto — Examens du VIH : les décisions essentielles">
<div class="lab">Repère clinique</div><p>Confirmer le diagnostic, quantifier l’ARN, compter les CD4, puis rechercher les résistances, co-infections et atteintes d’organes qui modifient la prise en charge. Une batterie identique ne convient pas à toutes les personnes : les symptômes et les expositions déterminent les investigations complémentaires.</p>
<div class="lab">M. L.</div><p>Ses 180 000 copies/mL décrivent une réplication ; ses 86 CD4/µL décrivent un déficit immunitaire. Sa fièvre reste une question clinique à explorer. Les examens manquants ne sont pas supposés normaux.</p>
<p class="refs"><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/baseline-evaluation" target="_blank" rel="noopener">NIH, Baseline Evaluation, mise à jour et revue du 24 septembre 2026</a>. Section effectivement lue le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-diagnostic-ch" data-title="Confirmation du VIH : cadre suisse actuellement applicable">
<div class="lab">Référence applicable</div><p>La version 4 du 10 juillet 2026 conserve « directive 2025 » dans son titre. L’enchaînement diagnostique est présenté dans l’onglet.</p>
<div class="lab">Portée</div><p>La directive concerne les personnes de plus de 18 mois ; elle ne régit pas le diagnostic périnatal ni les accidents de piqûre d’aiguille.</p>
<p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener">OFSP, version 4, 10.07.2026, sections 2.2–2.4 et 2.6</a>. Lecture du 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-diagnostic-cdc" data-title="Algorithme CDC : différenciation sérologique et test moléculaire">
<div class="lab">Trois fonctions</div><p>Le premier test repère une réactivité antigène/anticorps. Le test complémentaire différencie les anticorps dirigés contre le VIH-1 et le VIH-2. Si cette différenciation est négative ou indéterminée, le test d’acide nucléique aide à distinguer une infection récente d’une réactivité non confirmée.</p>
<div class="lab">Méthode validée</div><p>L’actualisation CDC/APHL de 2023 maintient cette succession et demande une indication diagnostique validée pour le test moléculaire. Selon le dispositif, celui-ci recherche le VIH-1 ou les deux types ; une méthode limitée au VIH-1 ne suffit pas à écarter un VIH-2 suspecté.</p>
<div class="lab">Limite</div><p>Ce parcours américain explique la logique des tests ; la directive suisse admet aussi une confirmation moléculaire à la deuxième étape. Ne pas fusionner les deux ordres en un algorithme obligatoire unique.</p>
<p class="refs"><a href="https://stacks.cdc.gov/view/cdc/129018" target="_blank" rel="noopener">CDC/APHL, Technical Update for HIV Nucleic Acid Tests Approved for Diagnostic Purposes, 2023</a>. Résumé technique primaire lu le 8 octobre 2026 ; document rattaché à l’algorithme de 2014 et au guide de 2018.</p>
</template>
<template data-pop="b24-e-fenetre" data-title="Fenêtre diagnostique : résultat négatif et délai">
<div class="lab">Ce qui change</div><p>Les marqueurs ne deviennent pas détectables au même moment : ARN, antigène puis anticorps. Les plages de délai indiquées dans l’onglet concernent des catégories de tests et ne garantissent pas qu’un résultat négatif exclut l’infection à leur premier jour.</p>
<div class="lab">Lecture pratique</div><p>Vérifier la dernière exposition, le dispositif et la matrice. Une nouvelle exposition ouvre un nouveau délai. Ne pas attribuer les performances d’un test automatisé sur sang veineux à un test salivaire ou à un test capillaire.</p>
<p class="refs"><a href="https://www.cdc.gov/hiv/testing/index.html" target="_blank" rel="noopener">CDC, Getting Tested for HIV, révision du 15 septembre 2026</a>. Types de tests et fenêtres lus le 8 octobre 2026. Le cadre suisse de six semaines est celui de la directive OFSP liée dans la fenêtre de confirmation.</p>
</template>
<template data-pop="b24-e-prep" data-title="Prophylaxie pré-exposition : ambiguïtés diagnostiques">
<div class="lab">Pourquoi le contexte compte</div><p>Les antirétroviraux préventifs peuvent modifier la détection d’une infection. Une prise récente, notamment d’un produit injectable de longue durée, doit être connue. Un résultat isolé faiblement détectable ne doit pas être interprété comme un échec thérapeutique d’un VIH déjà confirmé.</p>
<div class="lab">Résultat ambigu</div><p>Les CDC proposent un nouveau prélèvement après 5–7 jours avec test antigène/anticorps et ARN du VIH-1 ; si l’ambiguïté persiste, un avis spécialisé et des analyses complémentaires sont nécessaires. La conduite de la prophylaxie pendant cette période relève de cette évaluation ; le patient ne doit pas décider seul de son interruption.</p>
<p class="refs"><a href="https://www.cdc.gov/hivnexus/hcp/prep/index.html" target="_blank" rel="noopener">CDC, Clinical Guidance for PrEP, 30 avril 2026, sections HIV testing et ambiguous HIV test results</a>. Sections réellement lues le 8 octobre 2026 ; contexte américain, à coordonner avec le laboratoire suisse.</p>
</template>
<template data-pop="b24-e-arn" data-title="ARN du VIH-1 : matrice, unité et limites analytiques">
<div class="lab">Prélèvement et méthode</div><p>La fiche actuelle du catalogue CHUV décrit une virémie par amplification avec transcription inverse à partir du plasma EDTA. Les modalités de séparation, de volume et d’acheminement sont celles du laboratoire ; un tube destiné à la numération cellulaire n’est pas automatiquement le bon échantillon décanté pour l’ARN.</p>
<div class="lab">Lire les limites</div><p>La limite de détection indique jusqu’où un signal peut être reconnu ; la limite de quantification indique jusqu’où une concentration peut être rendue avec les performances validées. La mention « détecté non quantifiable » est donc cohérente. Le seuil clinique de 200 copies/mL n’est pas l’une de ces limites techniques.</p>
<div class="lab">Calcul</div><p>En logarithmes décimaux, soustraire les valeurs revient à comparer un rapport : 5,26 − 3,26 = 2 signifie une division par 100. Ce repère arithmétique aide à suivre une évolution ; il n’établit pas la suppression.</p>
<p class="refs"><a href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00436/hiv-1" target="_blank" rel="noopener">CHUV, catalogue des analyses, HIV-1 : virémie par PCR quantitative, fiche DLA_INV_01_00436</a>. Matrice et méthode lues le 8 octobre 2026 ; la fiche HTML ne montre pas de date de version exploitable. Les limites du compte rendu utilisé restent prioritaires.</p>
</template>
<template data-pop="b24-e-cd4" data-title="CD4 : mesure cellulaire et référence suisse datée">
<div class="lab">Nombre et pourcentage</div><p>La cytométrie identifie une population cellulaire par des marqueurs. Le nombre absolu et sa proportion répondent à deux questions de mesure différentes. Dans un exemple arithmétique hypothétique, 1 000 lymphocytes/µL dont 10 % de CD4 donneraient 100 CD4/µL ; ce pourcentage n’a pas été mesuré chez M. L.</p>
<div class="lab">Exemple de laboratoire</div><p>ZetLab indique chez les adultes, sur sang total EDTA, 300–1 140 CD4/µL et 33–63 %. La fiche porte une dernière modification au 20 mars 2026. Ce repère local ne s’applique pas d’emblée à l’enfant, ni à tout laboratoire.</p>
<div class="lab">Seuil de décision</div><p>Être dans un intervalle de référence et franchir un seuil de prévention sont des notions distinctes. La valeur du cas, 86/µL, reste profondément abaissée ; sa prise en charge ne dépend pas du choix arbitraire d’une borne normale universelle.</p>
<p class="refs"><a href="https://www.zetlab.ch/z-lex-analysen/details/natural-killer-cells-1?print=1" target="_blank" rel="noopener">ZetLab, Immunphänotypisierung Lymphozyten, modification du 20.03.2026</a> ; <a href="https://lvz.analytica.ch/analysis/T-Zellen_(CD4CD8)" target="_blank" rel="noopener">Analytica, T-Zellen (CD4/CD8), méthode et prélèvement</a>. Fiches réellement lues le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-resistance" data-title="Génotype de résistance : ce que le résultat explore">
<div class="lab">Principe</div><p>Le séquençage recherche des mutations dans les gènes étudiés ; une cible absente n’est pas démontrée sensible.</p>
<div class="lab">Limites</div><p>Peu d’ARN peut faire échouer le test, notamment sous 500–1 000 copies/mL selon la méthode. Un génotype sur ADN proviral peut manquer des mutations archivées : l’histoire des traitements et les anciens génotypes restent indispensables.</p>
<p class="refs"><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/drug-resistance-testing" target="_blank" rel="noopener">NIH, Drug-Resistance Testing, mise à jour et revue du 12 septembre 2024</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/baseline-evaluation" target="_blank" rel="noopener">NIH, Baseline Evaluation, 24 septembre 2026</a>, pour les indications d’exploration de l’intégrase. Sections lues le 8 octobre 2026 ; dates propres aux sections, pas date uniforme du site.</p>
</template>
<template data-pop="b24-e-hepatites" data-title="Hépatites B et C : exposition, immunité et infection active">
<div class="lab">Hépatite B</div><p>Demander les trois marqueurs : antigène HBs, anticorps anti-HBs et anticorps anti-HBc totaux. L’anti-HBc traduit une exposition au virus ; il n’est pas produit par la vaccination seule. L’antigène HBs oriente vers une infection actuelle et appelle une évaluation complémentaire, dont l’ADN viral selon le contexte. Un anti-HBc isolé ne doit pas être simplifié en « protégé par la vaccination ».</p>
<div class="lab">Hépatite C</div><p>Un anticorps anti-VHC réactif peut correspondre à une infection passée ou actuelle ; l’ARN distingue l’infection active. Une sérologie négative peut être insuffisante après exposition récente ou immunodépression profonde : rechercher l’ARN si indiqué.</p>
<div class="lab">Choix thérapeutique</div><p>Le résultat d’hépatite B doit être pris en compte avant un schéma antirétroviral qui ne la couvre pas. L’onglet Pharmacologie précise cette condition.</p>
<p class="refs"><a href="https://www.cdc.gov/hepatitis-b/hcp/diagnosis-testing/index.html" target="_blank" rel="noopener">CDC, diagnostic de l’hépatite B, 14 août 2026, triple panel</a> ; <a href="https://www.cdc.gov/hepatitis-c/hcp/diagnosis-testing/index.html" target="_blank" rel="noopener">CDC, diagnostic de l’hépatite C, 31 janvier 2025</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/tests-initial-assessment-follow-up" target="_blank" rel="noopener">NIH, Laboratory Testing, 24 septembre 2026</a>. Sections lues le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-tb" data-title="Tuberculose : test immunologique et maladie active">
<div class="lab">Ce que mesure le test</div><p>Le test de libération d’interféron gamma mesure une réponse à des antigènes mycobactériens. Positif, il indique une infection à explorer ; il ne sépare pas seul une infection latente d’une tuberculose active.</p>
<div class="lab">Ce qu’un résultat négatif laisse ouvert</div><p>Le déficit immunitaire peut empêcher une réponse mesurable ; un test négatif n’exclut donc pas la tuberculose, particulièrement devant fièvre, amaigrissement ou signes respiratoires. Un test indéterminé n’est pas un test négatif.</p>
<div class="lab">M. L.</div><p>Son contexte exige une recherche clinique de maladie active, avec imagerie thoracique et prélèvements bactériologiques selon les signes et les localisations. Le test immunologique ne doit pas servir de préalable bloquant à ces investigations.</p>
<p class="refs"><a href="https://www.cdc.gov/tb/hcp/testing-diagnosis/interferon-gamma-release-assay.html" target="_blank" rel="noopener">CDC, Interferon Gamma Release Assay, 9 mai 2024, interprétation et faux négatifs</a> ; <a href="https://www.idsociety.org/practice-guideline/primary-care-management-of-people-with-hiv/" target="_blank" rel="noopener">HIVMA/IDSA, Primary Care Guidance, 2024</a>. Sections réellement lues le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-ist" data-title="Autres infections sexuellement transmissibles : sites de prélèvement">
<div class="lab">Choix des sites</div><p>La recherche de chlamydia et de gonocoque par amplification est adaptée aux sites exposés : génital, rectal et, selon l’agent, pharyngé. Un prélèvement urinaire négatif ne renseigne pas à lui seul tous ces sites. La syphilis nécessite sa sérologie interprétée avec l’histoire et les éventuels traitements antérieurs.</p>
<div class="lab">Fréquence</div><p>Chez une personne vivant avec le VIH et sexuellement active, les CDC proposent le dépistage à l’entrée en soins puis au moins annuel ; il peut être rapproché à 3–6 mois dans les situations de risque accru. Le calendrier dépend des pratiques et expositions, sans présumer celles de M. L.</p>
<p class="refs"><a href="https://www.cdc.gov/std/treatment-guidelines/screening-recommendations.htm" target="_blank" rel="noopener">CDC, STI Treatment Guidelines 2021, Screening Recommendations</a>. Rubriques chlamydia, gonorrhée et syphilis effectivement lues le 8 octobre 2026 ; ces repères américains ne remplacent pas les modalités locales suisses.</p>
</template>
<template data-pop="b24-e-securite" data-title="Bilan d’organes et HLA : préparer une prescription sûre">
<div class="lab">État de référence</div><p>La formule sanguine peut révéler une cytopénie. Créatinine, estimation rénale, analyse d’urine, transaminases et bilirubine recherchent une atteinte antérieure au traitement. Une anomalie n’est donc pas automatiquement attribuable au médicament prescrit ensuite.</p>
<div class="lab">Unités et décision</div><p>Lire les unités et intervalles du laboratoire. L’estimation rénale utile au choix d’un médicament doit correspondre à celle de son information professionnelle. Un résultat de laboratoire dans la référence ne dispense pas de rechercher les facteurs de risque ou interactions.</p>
<div class="lab">Test conditionnel</div><p>HLA-B*57:01 est recherché si l’abacavir est envisagé, pour éviter une hypersensibilité grave chez les porteurs. Ce n’est ni un test de confirmation du VIH ni un génotype de résistance virale.</p>
<p class="refs"><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/baseline-evaluation" target="_blank" rel="noopener">NIH, Baseline Evaluation, 24 septembre 2026</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/tests-initial-assessment-follow-up" target="_blank" rel="noopener">NIH, Laboratory Testing, 24 septembre 2026</a>. Sections lues le 8 octobre 2026. Les choix et adaptations de médicaments figurent dans la Pharmacologie.</p>
</template>
<template data-pop="b24-e-oi" data-title="À 86 CD4/µL : bilan opportuniste orienté">
<div class="lab">Risques à identifier</div><p>La recommandation HIVMA/IDSA 2024 indique les IgG anti-toxoplasme chez les personnes asymptomatiques à moins de 200 CD4/µL, et l’antigène cryptococcique sanguin à moins de 100 CD4/µL ou en présence de symptômes. Ces tests répondent à des questions distinctes de la charge virale du VIH.</p>
<div class="lab">Limites</div><p>L’IgG traduit une exposition passée, pas une encéphalite prouvée. Un antigène cryptococcique positif nécessite une évaluation spécialisée d’une infection invasive et de son éventuelle localisation neurologique. Les prélèvements respiratoires, l’imagerie neurologique et les autres investigations sont sélectionnés à partir des signes ; ils ne découlent pas automatiquement du seul nombre de CD4.</p>
<div class="lab">Application</div><p>Chez M. L., la fièvre et l’amaigrissement rendent nécessaire une recherche de complication et de foyer. L’absence initiale de dyspnée ou de symptôme neurologique ne transforme pas le bilan en simple surveillance annuelle.</p>
<p class="refs"><a href="https://www.idsociety.org/practice-guideline/primary-care-management-of-people-with-hiv/" target="_blank" rel="noopener">HIVMA/IDSA, Primary Care Guidance, 2024, recommandations de dépistage des co-infections</a>. Énoncés toxoplasme et antigène cryptococcique réellement lus le 8 octobre 2026. Les indications de prévention et les traitements spécifiques sont détaillés dans la Pharmacologie.</p>
</template>
<template data-pop="b24-e-suivi" data-title="Suivi : calendrier biologique et état clinique">
<div class="lab">Intervalles conditionnels</div><p>Le tableau de l’onglet reprend le suivi adulte recommandé par la section NIH du 25 septembre 2025. L’espacement de l’ARN suppose une suppression depuis plus d’un an, une stabilité clinique et immunologique et une observance fiable. L’espacement des CD4 est envisagé après 1–2 ans de suppression selon la valeur atteinte.</p>
<div class="lab">Lecture commune</div><p>Les contrôles biologiques ne définissent pas la fréquence de toutes les consultations. Une toxicité suspectée, un symptôme nouveau ou une difficulté de prise du traitement peuvent imposer une évaluation avant l’échéance prévue.</p>
<p class="refs"><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/plasma-hiv-1-rna-cd4-monitoring" target="_blank" rel="noopener">NIH, Plasma HIV-1 RNA and CD4 Count Monitoring, mise à jour et revue du 25 septembre 2025</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/tests-initial-assessment-follow-up" target="_blank" rel="noopener">NIH, Laboratory Testing, 24 septembre 2026</a>. Sections lues le 8 octobre 2026 ; calendrier adapté au patient.
</p>
</template>
<template data-pop="b24-e-echec" data-title="Virémie détectable : blip, persistance et échec">
<div class="lab">Contexte indispensable</div><p>Après suppression, une détection isolée suivie d’un retour à la suppression définit un blip. Un rebond ≥200 copies/mL doit être confirmé ; il se distingue d’une virémie faible persistante.</p>
<div class="lab">Réponse initiale</div><p>Avant suppression documentée, deux valeurs ≥200 après 24 semaines définissent une réponse incomplète dans le cadre NIH. Un résultat préoccupant s’explore déjà avant ce délai.</p>
<div class="lab">Investigation</div><p>Vérifier prise réelle, interactions, tolérance et résistance. Ne pas interrompre le traitement pour « refaire un test propre ».</p>
<p class="refs"><a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/virologic-failure?view=full" target="_blank" rel="noopener">NIH, Virologic Failure, mise à jour et revue du 12 septembre 2024</a>. Définitions et principes d’investigation réellement lus le 8 octobre 2026 ; cette section ancienne reste celle actuellement affichée.</p>
</template>
<template data-pop="b24-e-populations" data-title="Pédiatrie et grossesse : limites du bilan adulte">
<div class="lab">Enfant exposé en période périnatale</div><p>Avant 18 mois, les anticorps transférés par la mère peuvent rendre la sérologie positive sans démontrer une infection de l’enfant. La recommandation NIH du 25 juin 2026 utilise des tests virologiques ; la confirmation d’un résultat positif se fait rapidement sur un prélèvement distinct. Les antirétroviraux maternels ou reçus par l’enfant peuvent aussi modifier les performances diagnostiques.</p>
<div class="lab">Limite de transposition</div><p>Le suivi dépend de l’âge et d’une éventuelle exposition persistante, notamment par l’allaitement. Le calendrier adulte stable et sa référence de CD4 ne peuvent pas être copiés chez le nourrisson. Une grossesse exige une prise en charge conjointe avec l’équipe obstétricale et les recommandations périnatales appropriées.</p>
<p class="refs"><a href="https://clinicalinfo.hiv.gov/en/guidelines/perinatal/management-infants-diagnosis-hiv-infection-children" target="_blank" rel="noopener">NIH, Diagnosis of HIV Infection in Infants and Children, mise à jour et revue du 25 juin 2026</a>. Recommandations et limites des tests réellement lues le 8 octobre 2026. La directive suisse diagnostique citée dans cet onglet exclut explicitement le diagnostic périnatal de son périmètre.</p>
</template>
