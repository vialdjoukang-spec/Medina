<template data-pop="b24-examens" data-title="Loi de Pareto — Examens du VIH : les décisions essentielles">
<div class="lab">Repère clinique</div><p>Confirmer le diagnostic, quantifier l’ARN, compter les CD4, puis rechercher les résistances, co-infections et atteintes d’organes qui modifient la prise en charge. Une batterie identique ne convient pas à toutes les personnes : les symptômes et les expositions déterminent les investigations complémentaires.</p>
<div class="lab">M. L.</div><p>Ses 180 000 copies/mL décrivent une réplication ; ses 86 CD4/µL décrivent un déficit immunitaire. Sa fièvre reste une question clinique à explorer. Les examens manquants ne sont pas supposés normaux.</p>
<p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive VIH, version 4 du 10 juillet 2026, section 2.2</a> ; <a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a>. Consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-diagnostic-ch" data-title="Confirmation du VIH : cadre suisse actuellement applicable">
<div class="lab">Référence applicable</div><p>La version 4 du 10 juillet 2026 conserve « directive 2025 » dans son titre. L’enchaînement diagnostique est présenté dans l’onglet.</p>
<div class="lab">Portée</div><p>La directive concerne les personnes de plus de 18 mois ; elle ne régit pas le diagnostic périnatal ni les accidents de piqûre d’aiguille.</p>
<p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener">OFSP, version 4, 10.07.2026, sections 2.2–2.4 et 2.6</a>. Lecture du 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-diagnostic-cdc" data-title="Algorithme CDC : différenciation sérologique et test moléculaire">
<div class="lab">Trois fonctions</div><p>Le premier test repère une réactivité antigène/anticorps. Le test complémentaire différencie les anticorps dirigés contre le VIH-1 et le VIH-2. Si cette différenciation est négative ou indéterminée, le test d’acide nucléique aide à distinguer une infection récente d’une réactivité non confirmée.</p>
<div class="lab">Méthode validée</div><p>L’actualisation CDC/APHL de 2023 maintient cette succession et demande une indication diagnostique validée pour le test moléculaire. Selon le dispositif, celui-ci recherche le VIH-1 ou les deux types ; une méthode limitée au VIH-1 ne suffit pas à écarter un VIH-2 suspecté.</p>
<div class="lab">Limite</div><p>Ce parcours américain explique la logique des tests ; la directive suisse admet aussi une confirmation moléculaire à la deuxième étape. Ne pas fusionner les deux ordres en un algorithme obligatoire unique.</p>
<p class="refs"><a href="https://stacks.cdc.gov/view/cdc/129018" target="_blank" rel="noopener">CDC/APHL, Technical Update for HIV Nucleic Acid Tests Approved for Diagnostic Purposes, 2023</a>. Résumé technique primaire lu le 8 octobre 2026 ; document rattaché à l’algorithme de 2014 et au guide de 2018.</p>
</template>
<template data-pop="b24-e-fenetre" data-title="Fenêtre diagnostique : résultat négatif et délai">
<div class="lab">Repère suisse</div><p>La directive OFSP indique une fenêtre sérologique de six semaines pour le test de quatrième génération au moins qu’elle prescrit chez les personnes de plus de 18 mois. Un résultat négatif avant la fin de cette fenêtre doit être confronté à la date de la dernière exposition ; une nouvelle exposition change cette date.</p>
<div class="lab">Si la primo-infection est suspectée</div><p>En présence de symptômes compatibles, l’OFSP demande un test automatisé de quatrième génération au moins et un test moléculaire réalisés en parallèle. Un test rapide négatif ne clôt pas cette question. La matrice et la méthode du laboratoire doivent être connues ; le délai OFSP ne se transfère pas automatiquement à un autotest.</p>
<p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Dépistage du VIH : directive 2025, version 4 du 10 juillet 2026, sections 2.4 et 2.6 A</a>. Consultée le 8 octobre 2026 ; le diagnostic périnatal est hors de son champ.</p>
</template>
<template data-pop="b24-e-prep" data-title="Prophylaxie pré-exposition : ambiguïtés diagnostiques">
<div class="lab">Contexte à transmettre</div><p>Une prophylaxie pré- ou post-exposition récente doit être signalée au laboratoire et à l’équipe VIH ; elle peut compliquer la lecture de résultats discordants. Un signal faiblement détectable ne suffit ni à confirmer une primo-infection ni à conclure à l’échec du traitement d’une infection déjà établie.</p>
<div class="lab">Décision suisse si le résultat reste douteux</div><p>La directive OFSP prévoit une seconde technique de confirmation sur le premier échantillon, puis un nouvel échantillon si le statut demeure douteux ; le Centre national de référence pour les rétrovirus intervient si l’ambiguïté persiste. En cas de suspicion clinique de primo-infection, le test automatisé de quatrième génération et le test moléculaire sont réalisés en parallèle. La poursuite ou l’adaptation de la prophylaxie se décide avec l’équipe qui la prescrit, sans délai universel de re-test tiré d’une recommandation américaine.</p>
<p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Dépistage du VIH : directive 2025, version 4 du 10 juillet 2026, sections 2.4 et 2.6</a>, pour la décision diagnostique suisse ; <a href="https://www.cdc.gov/hivnexus/hcp/prep/index.html" target="_blank" rel="noopener" data-reference-source="1">CDC, Clinical Guidance for PrEP, 30 avril 2026, HIV testing</a>, pour le seul effet possible de la PrEP sur la détection. La directive OFSP ne donne pas ici de calendrier spécifique sous PrEP ; la prise en charge requiert le contexte clinique et le laboratoire.</p>
</template>
<template data-pop="b24-e-arn" data-title="ARN du VIH-1 : matrice, unité et limites analytiques">
<div class="lab">Prélèvement et méthode</div><p>La fiche actuelle du catalogue CHUV décrit une virémie par amplification avec transcription inverse à partir du plasma EDTA. Les modalités de séparation, de volume et d’acheminement sont celles du laboratoire ; un tube destiné à la numération cellulaire n’est pas automatiquement le bon échantillon décanté pour l’ARN.</p>
<div class="lab">Lire les limites</div><p>La limite de détection indique jusqu’où un signal peut être reconnu ; la limite de quantification indique jusqu’où une concentration peut être rendue avec les performances validées. La mention « détecté non quantifiable » est donc cohérente. Le seuil clinique de 200 copies/mL n’est pas l’une de ces limites techniques.</p>
<div class="lab">Calcul</div><p>En logarithmes décimaux, soustraire les valeurs revient à comparer un rapport : 5,26 − 3,26 = 2 signifie une division par 100. Ce repère arithmétique aide à suivre une évolution ; il n’établit pas la suppression.</p>
<p class="refs"><a href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00436/hiv-1" target="_blank" rel="noopener">CHUV, catalogue des analyses, HIV-1 : virémie par PCR quantitative, fiche DLA_INV_01_00436</a>. Matrice et méthode lues le 8 octobre 2026 ; la fiche HTML ne montre pas de date de version exploitable. Les limites du compte rendu utilisé restent prioritaires.</p>
</template>
<template data-pop="b24-e-cd4" data-title="CD4 : mesure cellulaire et référence suisse datée">
<div class="lab">Nombre et pourcentage</div><p>La cytométrie identifie une population cellulaire par des marqueurs. Le nombre absolu et sa proportion répondent à deux questions de mesure différentes. Dans un exemple arithmétique hypothétique, 1 000 lymphocytes/µL dont 10 % de CD4 donneraient 100 CD4/µL ; ce pourcentage n’a pas été mesuré chez M. L.</p>
<div class="lab">Exemple de laboratoire</div><p>ZetLab indique chez les adultes, sur sang total EDTA, 300–1 140 CD4/µL et 33–63 %. La fiche porte une dernière modification au 20 mars 2026. Ce repère local ne s’applique pas d’emblée à l’enfant, ni à tout laboratoire.</p>
<div class="lab">Seuil de décision</div><p>Être dans un intervalle de référence et franchir un seuil de prévention sont des notions distinctes. La valeur du cas, 86/µL, reste profondément abaissée ; sa prise en charge ne dépend pas du choix arbitraire d’une borne normale universelle.</p>
<p class="refs"><a href="https://www.zetlab.ch/z-lex-analysen/details/natural-killer-cells-1?print=1" target="_blank" rel="noopener">ZetLab, Immunphänotypisierung Lymphozyten, modification du 20.03.2026</a> ; <a href="https://lvz.analytica.ch/analysis/T-Zellen_(CD4CD8)" target="_blank" rel="noopener">Analytica, T-Zellen (CD4/CD8), méthode et prélèvement</a>. Fiches réellement lues le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-resistance" data-title="Génotype de résistance : ce que le résultat explore">
<div class="lab">Question clinique</div><p>Le génotype recherche les mutations dans les gènes effectivement analysés ; il s’interprète avec les traitements et les génotypes antérieurs. La directive OFSP demande un test de résistance dans les investigations médicales de base après un nouveau diagnostic.</p>
<div class="lab">Si la charge virale reste détectable</div><p>En situation d’échec, l’EACS préfère le test de résistance sous le traitement en cause : il est habituellement accessible lorsque l’ARN dépasse environ 200 à 500 copies/mL, et parfois en laboratoire spécialisé à des valeurs inférieures. Une absence de mutation détectée ne remplace pas l’histoire cumulative ; le résultat et l’observance guident ensemble le choix spécialisé.</p>
<p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive VIH, version 4 du 10 juillet 2026, section 2.2</a> ; <a href="https://eacs.sanfordguide.com/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS, Virological Failure, General measures, 9 octobre 2025</a>. Consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-hepatites" data-title="Hépatites B et C : exposition, immunité et infection active">
<div class="lab">Hépatite B</div><p>À l’entrée en soins, documenter l’antigène HBs, les anticorps anti-HBs et anti-HBc pour distinguer infection, exposition et protection vaccinale. L’EACS demande une recherche d’ADN du VHB si anti-HBc est positif avec antigène HBs négatif, particulièrement si les transaminases sont élevées ; un anti-HBc isolé ne prouve pas une protection. Si l’antigène HBs est positif, rechercher aussi le virus de l’hépatite D.</p>
<div class="lab">Hépatite C</div><p>L’EACS demande une sérologie anti-VHC au diagnostic VIH, puis un contrôle annuel selon sa table. Un anticorps positif appelle un ARN du VHC pour établir l’infection actuelle ; si une infection récente est suspectée malgré une sérologie négative, rechercher l’ARN. L’intensité ultérieure du dépistage dépend des expositions documentées.</p>
<div class="lab">Conséquence thérapeutique</div><p>Une co-infection VHB/VIH doit être prise en compte avant de choisir un traitement antirétroviral ; l’EACS recommande un schéma couvrant le VHB, sous réserve de l’histoire et de la tolérance. Les produits et doses en Suisse sont vérifiés dans leurs informations professionnelles.</p>
<p class="refs"><a href="https://eacs.sanfordguide.com/e11aa7e10304495b8dff845f448e3497" target="_blank" rel="noopener" data-reference-source="1">EACS, Clinical Management and Treatment of Viral Hepatitis Co-infections, Screening at Baseline et General Recommendations, 8 octobre 2025</a>. Consulté le 8 octobre 2026 ; ne remplace pas les informations professionnelles suisses.</p>
</template>
<template data-pop="b24-e-tb" data-title="Tuberculose : test immunologique et maladie active">
<div class="lab">Deux questions distinctes</div><p>L’EACS distingue l’infection tuberculeuse, recherchée notamment par test cutané ou test de libération d’interféron gamma selon l’exposition, de la tuberculose maladie, qui appelle une évaluation des symptômes et l’identification du bacille par microscopie, amplification ou culture si le prélèvement est possible. Le test immunologique ne recherche pas directement le bacille d’une maladie active.</p>
<div class="lab">M. L.</div><p>Chez cet adulte fébrile et amaigri, un résultat immunologique négatif ne résout pas, à lui seul, la question d’une tuberculose active. L’équipe adapte l’examen, l’imagerie et les prélèvements au tableau clinique. Aucun algorithme suisse spécifique au VIH n’est établi ici par une source locale directement lue ; cette réserve impose une vérification avant de détailler une conduite nationale.</p>
<p class="refs"><a href="https://eacs.sanfordguide.com/resolveuid/dfb1ffd00f7b4fd393bb13ee86b90d1e" target="_blank" rel="noopener" data-reference-source="1">EACS, Tuberculosis, Diagnosis of tuberculosis disease, 1er octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, rubrique TB, 6 octobre 2025</a>. Consultés le 8 octobre 2026 ; l’EACS renvoie aussi aux recommandations nationales.</p>
</template>
<template data-pop="b24-e-ist" data-title="Autres infections sexuellement transmissibles : sites de prélèvement">
<div class="lab">À l’entrée en soins</div><p>L’EACS propose un dépistage des IST à toute personne sexuellement active au diagnostic VIH, devant des symptômes d’IST et pendant une grossesse. Les tests et les sites dépendent des pratiques et expositions : gonocoque aux sites génital, rectal et pharyngé concernés ; chlamydia notamment aux sites génital et rectal. Un prélèvement urinaire négatif ne décrit pas les autres sites. La syphilis demande une sérologie interprétée avec les antécédents.</p>
<div class="lab">Fréquence ultérieure</div><p>Chez une personne asymptomatique, l’EACS propose de considérer un dépistage annuel selon les recommandations et moyens locaux ; une exposition accrue, notamment plusieurs partenaires ou des partenaires occasionnels, justifie de le rapprocher. Aucun rythme de 3 à 6 mois n’est imposé à M. L. sans son histoire sexuelle. Les protocoles suisses et les prélèvements du laboratoire concerné règlent le détail.</p>
<p class="refs"><a href="https://eacs.sanfordguide.com/f1aca743144240a5a3ff397e666f4e02" target="_blank" rel="noopener" data-reference-source="1">EACS, STI Screening and Treatment, introduction et rubriques gonorrhée, chlamydia et syphilis, 16 octobre 2025</a>. Consulté le 8 octobre 2026 ; la page renvoie elle-même aux directives locales et nationales.</p>
</template>
<template data-pop="b24-e-securite" data-title="Bilan d’organes et HLA : préparer une prescription sûre">
<div class="lab">État de référence</div><p>La numération, la fonction rénale, les urines, les enzymes hépatiques, la glycémie et les lipides donnent un état de départ avant les antirétroviraux et recherchent des problèmes associés. L’EACS en précise les contrôles lors des visites initiales et ultérieures.</p>
<div class="lab">Unités et décision</div><p>Lire les unités et intervalles du laboratoire. L’estimation rénale utilisée pour un médicament doit correspondre à l’information professionnelle de ce produit en Suisse ; ce tableau général ne fixe aucune dose.</p>
<div class="lab">Test conditionnel</div><p>Le typage HLA-B*57:01 est demandé avant un éventuel abacavir, comme l’indique l’EACS. Ce n’est ni un test confirmant le VIH ni un génotype de résistance virale.</p>
<p class="refs"><a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, rubriques Immunology et Comorbidities, 6 octobre 2025</a>. Consulté le 8 octobre 2026 ; toute prescription précise requiert la fiche suisse du produit.</p>
</template>
<template data-pop="b24-e-oi" data-title="À 86 CD4/µL : bilan opportuniste orienté">
<div class="lab">Risques à identifier</div><p>L’EACS inclut la sérologie toxoplasmique dans l’évaluation initiale et indique la recherche d’antigène cryptococcique si les CD4 sont inférieurs à 100/µL. Ces tests répondent à des questions différentes de la charge virale VIH. Les 86 CD4/µL de M. L. motivent une évaluation rapide, sans attribuer un résultat qu’il n’a pas encore reçu.</p>
<div class="lab">Limites</div><p>Une IgG anti-toxoplasme indique une exposition passée, pas une encéphalite prouvée. Si l’antigène cryptococcique est positif, les symptômes et une évaluation spécialisée déterminent les investigations supplémentaires. Les prélèvements respiratoires et l’imagerie neurologique dépendent des signes et ne découlent pas automatiquement du seul nombre de CD4.</p>
<div class="lab">Application</div><p>La fièvre et l’amaigrissement de M. L. imposent de rechercher un foyer et des complications ; l’absence initiale de dyspnée ou de symptôme neurologique ne transforme pas ce bilan en simple surveillance de routine.</p>
<p class="refs"><a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, rubrique Co-infections – Others, 6 octobre 2025</a>. Consulté le 8 octobre 2026 ; les examens d’un syndrome actuel restent orientés par le tableau clinique.</p>
</template>
<template data-pop="b24-e-suivi" data-title="Suivi : calendrier biologique et état clinique">
<div class="lab">Intervalles conditionnels</div><p>Le tableau EACS des visites initiales et ultérieures place l’ARN plasmatique et CD4/CD8 dans une plage de contrôle de 3 à 12 mois. Il précise une possibilité annuelle pour les CD4/CD8 si l’état est stable ; cela ne transforme pas une personne nouvellement diagnostiquée avec 86 CD4/µL en patient au suivi allégé.</p>
<div class="lab">Au début et devant une alerte</div><p>La date du premier contrôle après la mise en route réelle du traitement s’individualise avec l’équipe VIH. Une valeur d’ARN détectable, un symptôme nouveau, une difficulté de prise ou une toxicité suspectée appellent une réévaluation avant l’échéance habituelle ; le cadre EACS d’échec guide alors l’interprétation.</p>
<p class="refs"><a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS, Virological Failure, 9 octobre 2025</a>. Consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-echec" data-title="Virémie détectable : persistance et échec">
<div class="lab">Définitions EACS</div><p>Après suppression antérieure, un rebond exige un ARN confirmé &gt;50 copies/mL. Chez une personne commençant son premier traitement, une suppression incomplète correspond à un ARN &gt;50 copies/mL à six mois. Lorsque l’ARN de départ dépasse 100 000 copies/mL, la suppression peut prendre plus de six mois ; les 180 000 copies/mL de M. L. sont un point initial, pas encore un échec.</p>
<div class="lab">Actions selon le résultat</div><p>Pour un ARN &gt;50 et &lt;200 copies/mL, l’EACS recommande de vérifier l’observance et de répéter l’ARN dans 1 à 2 mois. Si l’ARN est confirmé &gt;200 copies/mL, elle demande une recherche de résistance, préférablement sous le traitement en cause, et une réévaluation du schéma avec l’équipe VIH. L’histoire thérapeutique, les interactions entre médicaments ou avec les aliments et la tolérance sont également revues.</p>
<div class="lab">Limite</div><p>Une mesure isolée à 72 copies/mL suivie d’une suppression ne remplit pas la définition du rebond confirmé. Le traitement n’est pas interrompu pour obtenir un nouveau test ; l’EACS déconseille l’interruption. Un résultat exactement à une borne se discute avec le laboratoire et l’équipe VIH au lieu d’être forcé dans une catégorie écrite en inégalités strictes.</p>
<p class="refs"><a href="https://eacs.sanfordguide.com/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS, Virological Failure, Definition, General measures et Management, 9 octobre 2025</a>. Consulté le 8 octobre 2026.</p>
</template>
<template data-pop="b24-e-populations" data-title="Pédiatrie et grossesse : limites du bilan adulte">
<div class="lab">Champ suisse</div><p>La directive OFSP de dépistage, version 4 du 10 juillet 2026, s’applique aux personnes de plus de 18 mois et exclut explicitement le diagnostic périnatal ; elle renvoie aux recommandations suisses de 2018, qui ne sont pas remplacées par le tableau de l’adulte.</p>
<div class="lab">Tests du nourrisson selon l’EACS</div><p>Pour un nourrisson exposé non allaité, l’EACS décrit des tests VIH fondés sur la PCR à la naissance, deux semaines après l’arrêt de la prophylaxie postnatale et à trois mois ; un risque élevé peut justifier un test supplémentaire dans les deux premières semaines. La sérologie vers deux ans sert à confirmer la disparition des anticorps maternels. Sous allaitement, l’EACS prévoit des PCR répétées pendant l’exposition et à quatre puis huit semaines après son arrêt. Ces calendriers dépendent du risque et des pratiques nationales.</p>
<div class="lab">Limite clinique</div><p>Une sérologie positive chez le nourrisson ne démontre pas à elle seule son infection. Le bilan de grossesse et le suivi de l’enfant sont coordonnés avec des spécialistes périnataux ; les intervalles de l’adulte stable et ses valeurs de référence CD4 ne sont pas transposés au nourrisson.</p>
<p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive VIH, version 4 du 10 juillet 2026, section 2 et référence 4</a> ; <a href="https://eacs.sanfordguide.com/10e56e0514754ea5b85e5863e37295c1" target="_blank" rel="noopener" data-reference-source="1">EACS, Postnatal Prophylaxis and Infant Feeding, 3 octobre 2025</a>. Consultés le 8 octobre 2026 ; la recommandation suisse périnatale de 2018 citée par l’OFSP reste à confronter directement avant d’adopter un calendrier suisse précis.</p>
</template>
