<section class="ilot" id="b24-pa-0"><h2><span class="n">0</span>Question clinique</h2>
<p>M. L., 34 ans, consulte pour fièvre, amaigrissement et candidose orale. L’infection par le VIH-1 est confirmée ; l’ARN plasmatique est de <b>180 000 copies/mL</b> et les lymphocytes CD4 de <b>86/µL</b>. Il ne présente initialement ni dyspnée ni manifestation du système nerveux central. Ces données décrivent une réplication virale importante et une immunodépression profonde ; elles ne donnent ni la date de contamination ni la cause de sa fièvre.</p>
<p>La question est double : quelle complication faut-il rechercher et traiter aujourd’hui, et comment commencer rapidement un traitement du VIH qui restera efficace ? L’examen cherche d’abord une menace respiratoire, neurologique ou circulatoire. La confirmation virologique permet ensuite d’organiser le traitement, tandis que le chiffre de CD4 détermine les protections contre certaines infections. L’absence de symptômes dans un organe n’autorise pas à considérer toutes les infections opportunistes exclues.</p>
<div class="key"><b>Objectifs.</b> Confirmer ce que chaque résultat signifie, identifier une urgence, rechercher une éventuelle maladie opportuniste, choisir un calendrier de traitement sûr et construire avec le patient un suivi durable.</div>
</section>

<section class="ilot" id="b24-pa-1"><h2><span class="n">1</span>Définir l’infection et reconnaître la maladie avancée</h2>
<h3>1.1 Une infection persistante, un déficit immunitaire variable</h3>
<p>Le <button class="w" data-k="b24-pa-vih">virus de l’immunodéficience humaine</button> altère notamment les fonctions des lymphocytes T CD4. La diminution de cette aide immunitaire favorise des infections et certains cancers. Le traitement antirétroviral bloque la réplication et permet une restauration immunitaire ; il ne supprime pas tous les réservoirs infectés. Une absence de symptômes ou un ARN indétectable sous traitement ne signifient donc pas une guérison. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026</a>.</p>
<p>Il faut distinguer l’infection récente, l’infection chronique et la maladie avancée. Fièvre, pharyngite, éruption ou adénopathies peuvent accompagner une primo-infection, mais ces manifestations sont peu spécifiques. La maladie chronique peut rester longtemps silencieuse tout en entretenant la réplication. Chez M. L., la candidose et les CD4 bas justifient un bilan de maladie avancée ; ils ne permettent pas, isolément, de dater l’infection.</p>
<h3>1.2 Une maladie avancée appelle un bilan sans attendre</h3>
<p>La <button class="w" data-k="b24-pa-stades-oms">maladie VIH avancée selon l’OMS</button> est définie chez l’adulte par des CD4 &lt;200/µL ou par un événement clinique de stade OMS 3 ou 4. À 86 CD4/µL, M. L. répond au critère immunologique : rechercher les infections opportunistes, évaluer la cause de la fièvre et organiser rapidement le traitement. Le nombre de CD4 ne révèle ni la date de l’infection ni la cause de chaque symptôme. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026, maladie avancée</a>.</p>
<p>La classification clinique OMS distingue une candidose orale <em>persistante</em> (stade 3) d’une candidose œsophagienne (stade 4). M. L. présente une candidose orale, sans durée ni signe œsophagien fournis : interroger sur odynophagie et dysphagie, examiner et traiter le site confirmé, sans lui attribuer un stade clinique sur une donnée absente. <a href="https://www.ncbi.nlm.nih.gov/sites/books/NBK374293/" target="_blank" rel="noopener" data-reference-source="1">OMS, annexe 10, classification clinique publiée en 2016</a>.</p>
<div class="quiz ui"><p>À 86 CD4/µL, avec une candidose orale dont la durée est inconnue, que peut-on conclure pour M. L. ?</p><button data-ok="1">Il répond au critère immunologique OMS de maladie VIH avancée ; la candidose orale ne suffit pas à lui attribuer un stade clinique.</button><button data-ok="0">La candidose orale suffit toujours à établir le stade clinique OMS 3, quelle que soit sa durée.</button><button data-ok="0">La charge virale à 180 000 copies/mL date l’infection et remplace l’évaluation clinique.</button><p class="fb" hidden>Le seuil CD4 OMS est franchi. La classification clinique d’une candidose orale demande le qualificatif « persistante », absent du cas ; la charge virale ne date pas la contamination.</p></div>
<button class="pareto-btn ui" data-k="b24-pa-pareto-definitions">▲ Loi de Pareto — Infection, immunodépression et complication</button>
</section>

<section class="ilot" id="b24-pa-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>La fiche OMS du <b>27 juillet 2026</b> estime à <b>41,0 millions</b> le nombre de personnes vivant avec le VIH à la fin de <b>2025</b>, avec <b>1,2 million</b> d’acquisitions et <b>570 000</b> décès liés au VIH pendant cette année. Ce sont des estimations mondiales, pas le risque individuel d’un patient suisse. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, données 2025</a>.</p>
<p>Pour la Suisse et le Liechtenstein, le bulletin OFSP 44/2025 rapporte <b>318 nouveaux cas déclarés en 2024</b>, soit <b>3,5 pour 100 000 personnes</b>, selon les données arrêtées au 17 février 2025. La date du diagnostic n’est pas nécessairement la date de l’infection. Les <button class="w" data-k="b24-pa-epidemio">dénominateurs et délais de déclaration</button> limitent les comparaisons. <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, 27 octobre 2025, pages imprimées 19–25</a>.</p>
</section>

<section class="ilot" id="b24-pa-3"><h2><span class="n">3</span>Transmission : exposition, inoculum et porte d’entrée</h2>
<p>La transmission nécessite un liquide contenant le virus et une porte d’entrée : muqueuse, tissu lésé ou inoculation sanguine. Les voies principales sont sexuelles et liées au partage de matériel d’injection ; une transmission pendant la grossesse, l’accouchement ou l’allaitement est également possible. Une virémie élevée et une infection sexuellement transmissible associée peuvent augmenter le risque. Les <button class="w" data-k="b24-pa-transmission">voies de transmission</button> expliquent pourquoi le contact social ordinaire ne transmet pas le VIH. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, transmission, 27 juillet 2026</a>.</p>
<p>Pour M. L., l’ARN à 180 000 copies/mL ne permet pas de promettre une absence de transmission sexuelle. La discussion porte sur les partenaires, la prévention immédiate et l’accès au dépistage, sans déduire une voie de contamination de son apparence ou de son identité. Les mesures standard de prévention des expositions sanguines restent applicables dans les soins ; le VIH seul ne justifie pas un isolement respiratoire.</p>
</section>

<section class="ilot" id="b24-pa-4"><h2><span class="n">4</span>Anamnèse : reconstruire l’histoire sans retarder les soins</h2>
<p>Le médecin date la fièvre, mesure la perte de poids à partir de poids antérieurs et recherche diarrhée, toux, sueurs nocturnes, douleur à la déglutition, céphalée, trouble visuel ou déficit focal. Il demande les tests VIH précédents et récupère les documents. L’hypothèse d’une première prise en charge ne dispense pas de rechercher un ancien traitement, une <button class="w" data-k="b24-pa-prep-pep">PrEP ou une prophylaxie post-exposition</button> : ces antécédents orientent les examens initiaux, le choix du schéma et la recherche éventuelle de résistance.</p>
<p>La <button class="w" data-k="b24-pa-anamnese">discussion des expositions et de l’accès aux soins</button> explore les pratiques sexuelles, les protections, l’injection, les voyages et les contacts tuberculeux avec des questions ouvertes. Le relevé des médicaments inclut automédication, compléments et traitements antérieurs ; une interaction ne dépend pas du fait que le produit ait été prescrit. Le patient précise qui peut être informé et comment être recontacté. Santé mentale, logement, couverture des soins et possibilité de prendre régulièrement un traitement influencent directement sa continuité. <a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a>.</p>
</section>

<section class="ilot" id="b24-pa-5"><h2><span class="n">5</span>Examen clinique : chercher la défaillance et le foyer</h2>
<p>L’examen commence par les constantes, l’état mental, la perfusion, la respiration et l’état d’hydratation. Il documente ensuite le poids, la bouche, la peau, les adénopathies, l’auscultation thoracique, l’abdomen et l’examen neurologique. Les territoires génital et anal sont examinés selon les symptômes et avec l’accord du patient. Une adénopathie focale, asymétrique ou rapidement progressive nécessite un bilan spécifique ; l’infection VIH ne suffit pas à en expliquer la cause. <a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a>.</p>
<p>La <button class="w" data-k="b24-pa-candidose">candidose orale</button> se reconnaît souvent à ses plaques blanchâtres détachables. L’interrogatoire cherche une dysphagie ou une odynophagie pour ne pas méconnaître une atteinte œsophagienne. Chez M. L., une auscultation rassurante ne remplace pas l’évaluation respiratoire si une toux ou une intolérance à l’effort apparaît. Une plainte visuelle nouvelle exige un examen spécialisé rapide, sans attribuer d’emblée le symptôme au VIH.</p>
</section>

<section class="ilot" id="b24-pa-6"><h2><span class="n">6</span>Diagnostic et différentiels</h2>
<h3>6.1 Confirmer l’infection, puis caractériser le terrain</h3>
<p>En Suisse, le laboratoire applique la <button class="w" data-k="b24-pa-diagnostic-suisse">directive OFSP 2025, version 4 du 10 juillet 2026</button>. Le diagnostic repose sur au moins deux techniques ; après le diagnostic initial, le médecin vérifie rapidement la présence du virus sur un second échantillon et organise la recherche de résistance. Une suspicion de primo-infection symptomatique appelle un test moléculaire en parallèle du test automatisé d’au moins quatrième génération. <a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, §§2.2–2.6</a>.</p>
<p>Un <button class="w" data-k="b24-pa-fenetre-test">test négatif après une exposition récente</button> s’interprète selon la technique et le délai. Le médecin communique l’histoire d’exposition et les prises antérieures de PrEP ou PEP au laboratoire pour guider l’évaluation ; il ne conclut pas à partir d’un autotest isolé. Une discordance VIH-1/VIH-2 ou entre sérologie et ARN demande un avis de référence, car le type viral change le suivi et les options thérapeutiques.</p>
<p>Chez M. L., la confirmation VIH-1 est donnée. L’ARN sert de référence pour la réponse future et les CD4 à l’évaluation du risque opportuniste. Le bilan initial examine aussi la sécurité du traitement, les hépatites, les infections sexuellement transmissibles et les expositions pertinentes ; les modalités analytiques figurent dans l’onglet « Examens complémentaires ».</p>
<h3>6.2 Ne pas faire du VIH l’explication de tous les symptômes</h3>
<div class="table-wrap"><table><thead><tr><th>Présentation</th><th>Alternatives à examiner</th><th>Question discriminante</th></tr></thead><tbody><tr><td>Syndrome fébrile récent</td><td>Primo-infection VIH, autre infection virale, syphilis, infection bactérienne.</td><td>Quelle chronologie et quels résultats de confirmation ?</td></tr><tr><td>Fièvre et amaigrissement</td><td>Tuberculose, infection opportuniste, lymphome ; autres causes selon le contexte.</td><td>Quel foyer et quel prélèvement peuvent établir la cause ?</td></tr><tr><td>Lésion blanche buccale</td><td>Candidose, leucoplasie orale chevelue, autre lésion persistante.</td><td>La plaque se détache-t-elle et existe-t-il une douleur à la déglutition ?</td></tr><tr><td>Atteinte neurologique focale</td><td>Toxoplasmose, lymphome, tuberculose, autre infection ou lésion vasculaire.</td><td>Quel syndrome et quelle imagerie, avant une ponction éventuellement dangereuse ?</td></tr></tbody></table></div>
<p>La <button class="w" data-k="b24-pa-differentiel">concordance clinique</button> est déterminante : un test VIH positif établit l’infection, mais pas la cause d’une masse, d’une pneumonie ou d’une diarrhée. Plusieurs maladies peuvent coexister. Chez M. L., la candidose orale est un diagnostic associé ; la cause de la fièvre reste à rechercher.</p>
<div class="quiz ui"><p>Quel raisonnement est correct pour M. L., dont les CD4 sont à 86/µL ?</p><button data-ok="1">Les CD4 indiquent une immunodépression profonde ; la fièvre exige encore une recherche de cause et la candidose orale ne prouve pas une atteinte œsophagienne.</button><button data-ok="0">La candidose orale prouve à elle seule une maladie œsophagienne définissant le sida.</button><button data-ok="0">L’absence de dyspnée exclut toutes les infections opportunistes.</button><p class="fb" hidden>La profondeur du déficit immunitaire oriente les risques et la prévention. Chaque atteinte d’organe garde ses critères diagnostiques. Les CD4 bas, une candidose buccale et une fièvre ne constituent pas un diagnostic unique de toutes les manifestations.</p></div>
</section>

<section class="ilot" id="b24-pa-7"><h2><span class="n">7</span>Urgences : raisonner par organe</h2>
<div class="alert"><b>Une défaillance se traite immédiatement.</b> Hypoxémie, détresse respiratoire, hypotension avec hypoperfusion, trouble de conscience, convulsion ou déficit neurologique nouveau imposent une évaluation urgente. La stabilisation est prioritaire. Le bilan VIH peut être mené en parallèle, à condition de ne pas retarder les soins d’urgence.</div>
<div class="table-wrap"><table><thead><tr><th>Signal</th><th>Hypothèses prioritaires</th><th>Action clinique</th></tr></thead><tbody><tr><td>Dyspnée progressive, toux sèche, hypoxémie</td><td>Pneumocystose ; pneumonie bactérienne, tuberculose ou autre cause associée.</td><td>Évaluer l’oxygénation et prélever ; une suspicion forte de forme grave n’attend pas la preuve définitive pour être traitée.</td></tr><tr><td>Céphalée progressive, confusion</td><td>Cryptococcose ou autre infection neuroméningée.</td><td>Examiner ; organiser les prélèvements et la mesure de pression du liquide céphalorachidien lorsque la ponction est sûre.</td></tr><tr><td>Déficit focal ou convulsion</td><td>Toxoplasmose, lymphome, autre lésion intracrânienne.</td><td>Imagerie cérébrale urgente ; évaluer la sécurité de toute ponction.</td></tr><tr><td>Douleur à la déglutition, apports impossibles</td><td>Atteinte œsophagienne infectieuse, dont candidose.</td><td>Évaluer hydratation, absorption des traitements et besoin d’investigation.</td></tr></tbody></table></div>
<p>La fenêtre <button class="w" data-k="b24-pa-urgences">signaux d’alarme et limites des symptômes</button> explique pourquoi une faible inflammation n’exclut pas une infection grave. Le risque lié à l’<button class="w" data-k="b24-pa-iris">inflammation de restauration immunitaire</button> rend certaines infections neuroméningées particulièrement importantes pour le calendrier antirétroviral. M. L. n’a pas ces signes au départ ; ce constat guide l’évaluation actuelle, sans transformer leur éventuelle apparition ultérieure en détail secondaire.</p>
</section>

<section class="ilot" id="b24-pa-8"><h2><span class="n">8</span>Infections opportunistes : diagnostic et prophylaxie sont distincts</h2>
<p>Selon l’EACS, la prophylaxie de pneumocystose est indiquée lorsque les <b>CD4 sont &lt;200/µL</b> chez une personne sans traitement antirétroviral ou dont la charge virale reste détectable. M. L. a 86 CD4/µL et 180 000 copies/mL : cette prévention est à organiser. L’indication préventive ne constitue pas un diagnostic de pneumocystose et ne justifie pas une dose curative sans arguments cliniques. <a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, Primary Prophylaxis of OIs, 3 octobre 2025</a>.</p>
<p>La prévention de toxoplasmose dépend des <button class="w" data-k="b24-pa-toxoplasme">IgG anti-Toxoplasma et du déficit immunitaire</button>. L’EACS recommande une recherche de l’<button class="w" data-k="b24-pa-cryptocoque">antigène cryptococcique sérique</button> dès <b>CD4 &lt;100/µL</b> : elle concerne donc M. L. malgré l’absence initiale de signe neurologique. Un résultat positif exige une évaluation de maladie active avant toute décision de traitement préemptif. <a href="https://eacs.sanfordguide.com/en/eacs-hiv/eacs-section4/ois/eacs-primary-prophylaxis-of-ois-according-to-stage-of-immunodeficiency" target="_blank" rel="noopener" data-reference-source="1">EACS, Primary Prophylaxis of OIs, Cryptococcus, 3 octobre 2025</a>. Tuberculose et autres infections sont recherchées selon les symptômes, l’histoire et les recommandations du centre. Les doses, contre-indications et critères d’arrêt des prophylaxies figurent dans l’onglet pharmacologique.</p>
<p>Le paquet de soins de la maladie avancée associe recherche et traitement des infections, prévention, traitement antirétroviral approprié et soutien au maintien dans les soins. Il répond à plusieurs causes de mortalité ; réduire la prise en charge à la première prescription laisse persister des risques évitables. <a href="https://www.who.int/publications/i/item/9789240118164" target="_blank" rel="noopener" data-reference-source="1">OMS, recommandations maladie VIH avancée, 18 décembre 2025</a>.</p>
</section>

<section class="ilot" id="b24-pa-9"><h2><span class="n">9</span>Prise en charge initiale : traiter tôt, avec un calendrier sûr</h2>
<p>L’EACS recommande le traitement antirétroviral à tout adulte vivant avec le VIH, quel que soit le nombre de CD4, idéalement dès le diagnostic. Un déficit immunitaire aussi profond rend le démarrage particulièrement urgent ; une infection opportuniste avérée peut néanmoins imposer un calendrier propre. Le génotype est prélevé mais son résultat ne doit pas retarder à lui seul l’initiation ; le schéma initial tient compte de cette incertitude. <a href="https://eacs.sanfordguide.com/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS, Initiation of ART: No Prior ART Exposure, 6 octobre 2025</a> ; <a href="https://eacs.sanfordguide.com/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS, OI Overview &amp; When to Start ART, 6 octobre 2025</a>.</p>
<p>Le <button class="w" data-k="b24-pa-start">démarrage rapide</button> exige néanmoins un schéma compatible avec les informations encore manquantes, les médicaments associés et une éventuelle co-infection. Un génotype ou une sérologie d’hépatite B en attente ne justifie pas de laisser le patient sans projet de soins ; ils interdisent en revanche de supposer une sensibilité ou une absence de co-infection. Une association de deux molécules n’est pas interchangeable avec tout schéma initial. Les indications précises et les différences entre recommandations sont exposées en pharmacologie.</p>
<p>Une candidose orale isolée ne figure pas parmi les exceptions de délai de l’EACS : le traitement antirétroviral peut être engagé pendant sa prise en charge. En cas de méningite cryptococcique confirmée, l’EACS recommande en revanche de différer le début des antirétroviraux de 4 à 6 semaines après le début du traitement de cette infection, avec décision spécialisée. <a href="https://eacs.sanfordguide.com/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS, OI Overview &amp; When to Start ART, 6 octobre 2025</a>. Pour M. L., le plan est de traiter la candidose, rechercher la cause de la fièvre, organiser les protections justifiées par les CD4 et préparer rapidement le traitement VIH, avec l’infectiologue. Aucun diagnostic opportuniste supplémentaire n’est présumé.</p>
<p>Avant la sortie, le patient doit savoir quels médicaments prendre, pourquoi les poursuivre, quel symptôme impose un retour et qui contacter. Le <button class="w" data-k="b24-pa-alliance">soutien à l’adhésion</button> anticipe les difficultés concrètes ; une consigne comprise et un accès réel aux médicaments sont des conditions du contrôle virologique.</p>
<button class="pareto-btn ui" data-k="b24-pa-pareto-care">▲ Loi de Pareto — Les décisions qui changent l’évolution initiale</button>
</section>

<section class="ilot" id="b24-pa-10"><h2><span class="n">10</span>Suivi : réponse virologique et santé globale</h2>
<p>Le suivi vérifie la tolérance, l’accès au traitement, la prise réelle et l’évolution de l’ARN. Une charge virale persistante appelle une analyse de l’adhésion, des interactions et de la résistance avant de changer le traitement. Le calendrier biologique se trouve dans l’onglet examens. La restauration des CD4 peut être plus lente que la suppression de l’ARN ; l’amélioration virologique n’autorise donc pas à arrêter automatiquement une prophylaxie.</p>
<p>Le médecin réévalue les symptômes, la nutrition, la santé mentale et sexuelle, les addictions et les risques cardiovasculaires. Il organise vaccinations et dépistages selon l’âge, les organes présents, les expositions et les recommandations applicables. La <button class="w" data-k="b24-pa-suivi">coordination du suivi</button> permet de distinguer effets du VIH, effets médicamenteux et maladies ordinaires. <a href="https://eacs.sanfordguide.com/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS, Assessment of Initial &amp; Subsequent Visits, 6 octobre 2025</a>.</p>
</section>

<section class="ilot" id="b24-pa-11"><h2><span class="n">11</span>Prévention et « Indétectable = Intransmissible »</h2>
<p>Une personne sous traitement antirétroviral avec une charge virale <b>indétectable et maintenue</b> ne transmet pas le VIH par voie sexuelle selon l’OMS. La mesure doit être documentée et suivie ; le résultat initial de M. L. ne remplit pas cette condition. Le principe <button class="w" data-k="b24-pa-ii">I = I : portée et conditions</button> repose sur un traitement efficace et sur une suppression virale maintenue. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026</a>.</p>
<p>Au démarrage, la suppression n’est pas immédiate. La prévention sexuelle reste nécessaire jusqu’à ce qu’une charge virale indétectable et maintenue soit documentée. Cette période doit être suivie avec l’équipe VIH. Avec 180 000 copies/mL, M. L. doit encore disposer d’une prévention adaptée ; la prescription initiale n’a pas immédiatement cet effet. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026</a>.</p>
<p>I = I ne protège pas contre les autres infections sexuellement transmissibles et ne se transpose pas en garantie de risque nul pour l’allaitement ou le partage de matériel d’injection. Les partenaires peuvent bénéficier de dépistage, de PrEP ou d’une <button class="w" data-k="b24-pa-exposition">évaluation post-exposition urgente</button> selon la situation. Les préservatifs et le matériel d’injection stérile restent des moyens de prévention utiles. Une exposition récente ne doit pas attendre la prochaine consultation de M. L. pour être évaluée.</p>
<div class="quiz ui"><p>Une personne sous traitement a une charge virale indétectable et maintenue. Quel message de prévention sexuelle correspond à cette situation ?</p><button data-ok="1">Une charge virale indétectable et maintenue sous traitement empêche la transmission sexuelle du VIH ; elle ne prévient pas les autres IST.</button><button data-ok="0">Le traitement empêche immédiatement la transmission sexuelle dès la première dose.</button><button data-ok="0">Ce résultat permet aussi de garantir un risque nul pour l’allaitement et le partage de seringues.</button><p class="fb" hidden>Selon l’OMS, la charge virale indétectable et maintenue sous traitement empêche la transmission sexuelle du VIH. Cela n’étend pas la protection aux autres IST et n’est pas acquis dès la première dose.</p></div>
</section>

<section class="ilot" id="b24-pa-12"><h2><span class="n">12</span>Populations particulières et limites d’application</h2>
<p>La grossesse, le projet parental et l’allaitement nécessitent un plan spécialisé associant contrôle maternel, choix thérapeutique et prévention pédiatrique. Le message I = I sexuel n’est pas une consigne d’alimentation du nourrisson. Le VIH-2 et une infection mixte exigent une interprétation virologique et thérapeutique propre. Chez une personne arrivant d’un autre système de soins, les documents et l’historique de résistance comptent davantage qu’une hypothèse de « patient naïf ».</p>
<p>Une insuffisance rénale ou hépatique, des co-infections, une polymédication, une fragilité ou une difficulté d’accès aux soins modifient la prescription et la surveillance. La <button class="w" data-k="b24-pa-vaccins">vaccination en immunodépression</button> dépend de la sécurité du vaccin et de la capacité de réponse. Les modalités suisses doivent être vérifiées pour chaque vaccin ; un calendrier américain n’est pas transposé automatiquement.</p>
<p>Ce cours concerne l’adulte et prend pour exemple une infection VIH-1 confirmée. La classification clinique ne remplace pas la recherche de la complication effectivement présente. Les recommandations OMS répondent aussi à des contextes d’accès aux soins différents de la Suisse ; la <button class="w" data-k="b24-pa-sources">date et le périmètre des références</button> permettent d’en apprécier l’applicabilité. Les soins pédiatriques et périnatals nécessitent leurs recommandations propres.</p>
<div class="key"><b>Pour M. L.</b> Les priorités sont la recherche d’une cause à la fièvre, l’évaluation de la candidose et des signes de gravité, la prévention justifiée par les CD4, le traitement VIH rapide avec un calendrier sûr et un accès durable au suivi. Le chiffre de charge virale, le nombre de CD4 et le code du catalogue répondent à trois questions différentes.</div>
</section>
