<section class="ilot" id="b24-pa-0"><h2><span class="n">0</span>Question clinique</h2>
<p>M. L., 34 ans, consulte pour fièvre, amaigrissement et candidose orale. L’infection par le VIH-1 est confirmée ; l’ARN plasmatique est de <b>180 000 copies/mL</b> et les lymphocytes CD4 de <b>86/µL</b>. Il ne présente initialement ni dyspnée ni manifestation du système nerveux central. Ces données décrivent une réplication virale importante et une immunodépression profonde ; elles ne donnent ni la date de la contamination ni la cause de la fièvre.</p>
<p>La question est double. Quelle complication faut-il rechercher et traiter aujourd’hui, et comment commencer rapidement un traitement du VIH qui restera efficace ? L’examen cherche d’abord une menace respiratoire, neurologique ou circulatoire. La confirmation virologique organise ensuite le traitement, tandis que le chiffre de CD4 fixe les protections contre certaines infections opportunistes. L’absence de symptôme dans un organe n’exclut pas une infection de cet organe.</p>
<div class="key"><b>Objectifs.</b> Comprendre ce que mesure chaque résultat, reconnaître une urgence, rechercher une maladie opportuniste, choisir un traitement antirétroviral sûr selon les recommandations européennes et les informations professionnelles suisses, puis organiser avec le patient un suivi durable, la prévention auprès des partenaires et la déclaration obligatoire.</div>
</section>

<section class="ilot" id="b24-pa-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Le <button class="w" data-k="b24-pa-vih">virus de l’immunodéficience humaine</button> infecte les lymphocytes T qui portent la molécule CD4 et les détruit progressivement. La perte de cette aide immunitaire expose à des infections dites opportunistes et à certains cancers, en particulier des lymphomes et le sarcome de Kaposi. Sans traitement, l’infection évolue souvent pendant des années vers le sida, son stade le plus avancé. Il n’existe pas de traitement curatif ; le traitement antirétroviral rend l’infection chronique contrôlable. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, HIV and AIDS, 27 juillet 2026</a>.</p>
<p>Quatre classifications répondent à quatre questions différentes. La première date l’infection ; la deuxième, la stadification clinique de l’OMS, décrit l’atteinte de l’organisme ; la troisième mesure le retard au diagnostic ; la quatrième déclenche des soins renforcés.</p>
<table class="t"><tr><th>Classification</th><th>Critère</th><th>Usage clinique</th></tr>
<tr><td><button class="w" data-k="b24-pa-primo">Primo-infection, EACS 13</button></td><td>Exposition à risque dans les 6 semaines précédentes, virus détectable (antigène p24 ou ARN) ou anticorps en cours d’apparition. Infection aiguë : virus sans anticorps. Infection récente : anticorps présents, jusqu’à 6 mois après l’infection.</td><td>Traitement recommandé dans tous les cas, sans attendre le génotype.</td></tr>
<tr><td><button class="w" data-k="b24-pa-stades-oms">Stades cliniques de l’OMS</button></td><td>Stade 1 : aucun symptôme ou adénopathies généralisées persistantes. Stade 2 : atteintes mineures, comme un amaigrissement &lt;10 % ou un zona. Stade 3 : amaigrissement &gt;10 %, fièvre ou diarrhée inexpliquées depuis plus d’un mois, candidose orale persistante, tuberculose pulmonaire. Stade 4 : affections définissant le sida, comme la pneumocystose, la candidose œsophagienne ou la toxoplasmose cérébrale.</td><td>Évalue l’atteinte clinique au diagnostic et pendant le suivi ; relié à la survie sans traitement.</td></tr>
<tr><td><button class="w" data-k="b24-pa-tardif">Présentation tardive, consensus européen 2011</button></td><td>CD4 &lt;350/µL au premier recours aux soins, ou événement définissant le sida quel que soit le chiffre de CD4.</td><td>Mesure le retard au diagnostic.</td></tr>
<tr><td>Maladie avancée</td><td>Consensus européen : CD4 &lt;200/µL ou événement définissant le sida. OMS : CD4 &lt;200/µL ou événement de stade clinique 3 ou 4.</td><td>Recherche systématique des infections opportunistes et prophylaxies.</td></tr></table>
<p>Ce tableau montre que M. L. remplit deux définitions à la fois : avec 86 CD4/µL, il présente une maladie avancée et, par conséquent, une présentation tardive. Ses tests antérieurs doivent pourtant être récupérés. Un test négatif dans les six mois précédents ferait aussi discuter une infection récente, qui ne changerait pas l’urgence du traitement. Sur le plan clinique, une candidose orale persistante, ou une fièvre restée sans explication pendant plus d’un mois, le placerait au stade 3 de l’OMS. Une dysphagie révélant une candidose œsophagienne le ferait passer au stade 4, qui définit le sida. <a href="https://iris.who.int/handle/10665/43699" target="_blank" rel="noopener" data-reference-source="1">OMS, définitions de cas et stadification clinique et immunologique révisée, 2007</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/b74f67fa130d469c92a201f82894fa25" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary HIV Infection</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20561080/" target="_blank" rel="noopener" data-reference-source="1">Antinori et coll., HIV Medicine 2011, consensus européen</a>.</p>
<p>Le cas suppose un VIH-1. Le <button class="w" data-k="b24-vih2">VIH-2</button>, présent surtout en Afrique de l’Ouest, est naturellement résistant aux inhibiteurs non nucléosidiques et sa charge virale est souvent indétectable sans traitement ; il impose des tests et des schémas propres. <a href="https://eacs.sanfordguide.com/resolveuid/0afde39c61e6482ab566f3aa9fc09fcd" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, HIV-2</a>.</p>
<div class="key"><b>À retenir.</b> La confirmation virologique établit l’infection ; le chiffre de CD4 et le stade clinique de l’OMS en mesurent la gravité. Chez M. L., 86 CD4/µL signifient maladie avancée, quel que soit le stade clinique ; chaque infection opportuniste garde toutefois ses propres critères diagnostiques.</div>
</section>

<section class="ilot" id="b24-pa-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’OMS estime à <b>41,0 millions</b> le nombre de personnes vivant avec le VIH à la fin de <b>2025</b>, avec <b>1,2 million</b> d’infections nouvelles et <b>570 000</b> décès liés au VIH pendant cette année. En 2025, 88 % des personnes vivant avec le VIH connaissaient leur statut, 89 % d’entre elles recevaient un traitement et 95 % des personnes traitées avaient une charge virale supprimée. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, 27 juillet 2026</a>.</p>
<p>En Suisse et au Liechtenstein, l’OFSP a enregistré <b>318 cas en 2024</b>, soit <b>3,5 pour 100 000 personnes</b>, 10,9 % de moins qu’en 2023 et 25,7 % de moins qu’en 2019 ; on comptait environ 1300 déclarations par an dans les années 1990. La <button class="w" data-k="b24-pa-epidemio">cascade de soins suisse 2024</button> est l’une des meilleures publiées : 93 % des personnes vivant avec le VIH sont diagnostiquées, 98 % des personnes diagnostiquées sont traitées, 99 % des personnes traitées ont une charge virale inférieure à 200 copies/mL et 96 % inférieure à 50 copies/mL. Les deux dernières proportions proviennent surtout de la <button class="w" data-k="b24-pa-shcs">Swiss HIV Cohort Study</button>. <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025, données arrêtées au 17 février 2025</a>.</p>
<p>La date du diagnostic n’est pas la date de l’infection : un cas déclaré en 2024 peut avoir été acquis des années plus tôt. En 2024, 59 des 318 cas suisses (18,6 %) étaient des diagnostics tardifs, c’est-à-dire posés au stade de sida ou suivis d’un sida dans les trois mois ; cette proportion atteignait 39,6 % chez les hommes contaminés par voie hétérosexuelle, contre 13,9 % chez les hommes ayant des rapports avec des hommes, mieux dépistés. À l’inverse, 11,3 % des cas étaient diagnostiqués au stade de primo-infection. <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025, tableau 6</a>.</p>
<p>Le pronostic individuel dépend surtout du déficit immunitaire au diagnostic, des maladies opportunistes et de la continuité du traitement. L’OMS relie ses stades cliniques à la survie et à la progression de la maladie en l’absence de traitement : un diagnostic tardif, comme celui de M. L., expose d’abord au risque des infections opportunistes des premiers mois. <a href="https://iris.who.int/handle/10665/43699" target="_blank" rel="noopener" data-reference-source="1">OMS, définitions de cas et stadification clinique et immunologique révisée, 2007</a>.</p>
</section>

<section class="ilot" id="b24-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Normalement, les lymphocytes T CD4 coordonnent la réponse adaptative : ils aident les lymphocytes B à produire des anticorps et les lymphocytes T cytotoxiques à éliminer les cellules infectées. Le VIH utilise la molécule CD4 et un corécepteur, CCR5 ou CXCR4, pour entrer dans ces cellules. Son ARN est transcrit en ADN, qui s’intègre dans le génome cellulaire et y persiste sous forme de provirus.</p>
<p>La réplication continue détruit les CD4, d’abord dans le tissu lymphoïde intestinal, puis dans le sang. L’activation immunitaire chronique et l’altération des tissus lymphoïdes aggravent cette déplétion. Lorsque les CD4 descendent sous 200/µL, des micro-organismes habituellement contrôlés, comme <i>Pneumocystis jirovecii</i>, <i>Toxoplasma gondii</i> ou <i>Cryptococcus neoformans</i>, provoquent des maladies graves ; c’est pourquoi les seuils de prophylaxie se fondent sur ce chiffre. L’onglet <button class="w" data-k="b24-pa-sciences">Sciences fondamentales (mécanismes détaillés et sources primaires)</button> développe chaque étape.</p>
<p>Le traitement antirétroviral bloque de nouvelles infections cellulaires ; il ne retire pas les provirus déjà intégrés. Une charge virale indétectable signifie donc un contrôle, pas une guérison, et l’arrêt du traitement provoque un rebond viral. <a href="https://eacs.sanfordguide.com/resolveuid/b74f67fa130d469c92a201f82894fa25" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary HIV Infection : « une fois commencé, le traitement doit être poursuivi »</a>.</p>
</section>

<section class="ilot" id="b24-pa-4"><h2><span class="n">4</span>Transmission et facteurs de risque</h2>
<p>Le virus se transmet par le sang, le sperme, les sécrétions vaginales et le lait maternel, ainsi que de la mère à l’enfant pendant la grossesse et l’accouchement. Il ne se transmet ni par les baisers, ni par les accolades, ni par le partage de la nourriture ou d’objets personnels. Les principaux <button class="w" data-k="b24-pa-transmission">facteurs de risque</button> sont les rapports anaux ou vaginaux sans préservatif, une autre infection sexuellement transmissible, la consommation d’alcool ou de drogues en contexte sexuel, le partage du matériel d’injection et les actes médicaux non stériles. <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, 27 juillet 2026</a>.</p>
<p>En Suisse, la prévalence du VIH atteint environ 8 % chez les hommes ayant des rapports sexuels avec des hommes, groupe dont les réseaux sexuels sont denses ; 12 % des hommes hétérosexuels diagnostiqués rapportent une contamination lors de relations sexuelles tarifées. <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025</a>. Ces chiffres orientent le dépistage d’une population ; ils ne permettent jamais de déduire la voie de contamination de M. L. à partir de son apparence ou de son identité.</p>
<p>La charge virale de la source détermine l’essentiel du risque sexuel. Avec 180 000 copies/mL, M. L. peut transmettre le virus ; une personne traitée dont la charge virale reste supprimée ne le transmet pas par voie sexuelle (îlot 10). Dans les soins, les précautions standard contre les expositions au sang suffisent ; le VIH seul ne justifie aucun isolement.</p>
</section>

<section class="ilot" id="b24-pa-5"><h2><span class="n">5</span>Anamnèse : reconstruire l’histoire sans retarder les soins</h2>
<p>Le médecin date la fièvre, mesure la perte de poids à partir de poids antérieurs et recherche diarrhée, toux, sueurs, douleur à la déglutition, céphalée, trouble visuel ou déficit focal. Il demande les tests VIH antérieurs et en récupère les documents : la date du dernier test négatif distingue une infection récente d’une infection ancienne.</p>
<p>L’<button class="w" data-k="b24-pa-anamnese">anamnèse de la première consultation</button> suit le bilan initial d’EACS 13 : antécédents médicaux et psychiatriques, antécédents familiaux cardiovasculaires, médicaments en cours, <button class="w" data-k="b24-pa-prep-pep">prise antérieure de PrEP ou de PEP</button>, vaccinations, alcool, tabac et substances, situation sociale et violences, histoire sexuelle, statut et information des partenaires, projet de grossesse. Une PrEP antérieure peut retarder les marqueurs diagnostiques et sélectionner des résistances ; elle modifie donc le choix du traitement. <a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment of Initial &amp; Subsequent Visits</a>.</p>
<p>Le relevé des médicaments inclut l’automédication, les compléments et la phytothérapie : le millepertuis, par exemple, est contre-indiqué avec le bictégravir (information professionnelle suisse de Biktarvy®). Les voyages et le pays d’origine orientent vers une tuberculose, un VIH-2 ou des infections tropicales. L’évaluation de la disposition du patient à commencer le traitement fait partie de l’anamnèse : EACS 13 la juge essentielle pour que le patient exprime sa préférence sans se sentir contraint, sauf urgence clinique.</p>
</section>

<section class="ilot" id="b24-pa-6"><h2><span class="n">6</span>Examen clinique : chercher la défaillance et le foyer</h2>
<p>L’examen commence par les constantes, l’état de conscience, la perfusion, la saturation en oxygène et l’hydratation. Il documente ensuite le poids et l’indice de masse corporelle, la bouche, la peau, les aires ganglionnaires, l’auscultation, l’abdomen, le fond d’œil en cas de plainte visuelle et l’examen neurologique. Les régions génitale et anale sont examinées selon les symptômes et avec l’accord du patient. Selon l’OMS, l’immunodépression progressive s’accompagne d’adénopathies, d’amaigrissement, de fièvre, de diarrhée et de toux ; aucun de ces signes n’indique à lui seul sa cause.</p>
<div class="two"><div class="card"><h4>Candidose orale</h4><p>Le diagnostic de la <button class="w" data-k="b24-pa-candidose">candidose oropharyngée</button> repose sur l’aspect clinique typique. Une dysphagie récente associée à cette candidose suffit à un diagnostic présomptif d’œsophagite candidosique ; le diagnostic de certitude exige l’endoscopie, la biopsie ou la cytologie. <a href="https://eacs.sanfordguide.com/resolveuid/e8b771ed7eee45459b78ef1371ef1802" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Candidiasis</a>.</p></div><div class="card"><h4>Signes de gravité</h4><p>Une désaturation à l’effort, une confusion, une raideur méningée, un déficit focal ou une hypotension imposent une évaluation urgente (îlot 8). Chez M. L., une auscultation normale au repos n’exclut pas une pneumocystose, dont la définition EACS repose sur la dyspnée ou la désaturation à l’effort.</p></div></div>
<p>Chez M. L., la candidose orale est un fait d’examen ; la question à poser est celle de la déglutition. Une odynophagie ou une dysphagie récente ferait retenir une œsophagite présumée et changerait le traitement antifongique.</p>
</section>

<section class="ilot" id="b24-pa-7"><h2><span class="n">7</span>Diagnostic et différentiels</h2>
<h3>7.1 Confirmer l’infection selon la directive suisse</h3>
<p>En Suisse, le laboratoire applique la <button class="w" data-k="b24-pa-diagnostic-suisse">directive OFSP sur le dépistage du VIH, version 4 du 10 juillet 2026</button>. Le diagnostic repose sur la positivité d’au moins deux étapes, avec deux techniques différentes. Le dépistage utilise un test de quatrième génération au moins, qui détecte les anticorps et l’antigène p24 du VIH-1 ; sa fenêtre sérologique est de <b>6 semaines</b>. Un test réactif est confirmé sur le même échantillon, par une technique sérologique ou moléculaire. Le médecin vérifie ensuite rapidement la présence du virus sur un second échantillon, en général par une charge virale détectable, et demande un test de résistance. <a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4, §§ 2.2–2.6</a>.</p>
<p>Trois situations dérogent à cette séquence. Devant une primo-infection symptomatique suspectée, le laboratoire réalise un test automatisé de quatrième génération et un test moléculaire en parallèle ; un test rapide ne doit pas être utilisé. Après un autotest réactif, le laboratoire refait un dépistage automatisé. Chez une personne arrivant de l’étranger avec un diagnostic connu, une charge virale détectable suffit à vérifier l’infection. Un <button class="w" data-k="b24-pa-fenetre-test">test négatif après une exposition récente</button> s’interprète selon sa technique, son délai et une éventuelle prise d’antirétroviraux.</p>
<h3>7.2 Ne pas faire du VIH l’explication de tous les symptômes</h3>
<p>Un test VIH positif établit l’infection ; il n’établit pas la cause d’une fièvre, d’une pneumonie ou d’une lésion cérébrale. Le tableau suivant relie chaque présentation à ses hypothèses principales et au critère qui les départage.</p>
<table class="t"><tr><th>Présentation</th><th>Hypothèses à examiner</th><th>Critère discriminant</th></tr>
<tr><td>Fièvre et amaigrissement</td><td>Tuberculose, autre infection opportuniste, lymphome</td><td>Identification microbiologique ou histologique d’un foyer</td></tr>
<tr><td>Toux et dyspnée d’effort</td><td>Pneumocystose, pneumonie bactérienne, COVID-19</td><td>Désaturation à l’effort, imagerie, lavage bronchoalvéolaire</td></tr>
<tr><td>Lésion cérébrale focale</td><td>Toxoplasmose ou autre cause</td><td>Lésions typiques, IgG anti-<i>Toxoplasma</i>, réponse au traitement empirique</td></tr>
<tr><td>Céphalée progressive</td><td>Cryptococcose neuroméningée</td><td>Antigène cryptococcique, ponction lombaire avec pression d’ouverture</td></tr></table>
<p>Ce tableau reprend les critères d’EACS 13. La pneumocystose présumée exige une toux, une dyspnée ou une désaturation d’effort, des CD4 &lt;200/µL, une imagerie compatible, l’absence d’argument pour une pneumonie bactérienne et une réponse au traitement ; la pneumonie à SARS-CoV-2 doit entrer dans le différentiel. La toxoplasmose cérébrale présumée exige des symptômes, des IgG sériques, des lésions focales typiques et une réponse au traitement empirique ; sans réponse, une autre cause doit être recherchée. <a href="https://eacs.sanfordguide.com/resolveuid/45a849d6c5e74e9aa848caad3d5aeed4" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, PcP</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/89a4ed1dfa8e4ebd9c4a8647411c785e" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Toxoplasma gondii Encephalitis</a>. Plusieurs maladies peuvent coexister : la <button class="w" data-k="b24-pa-differentiel">concordance clinique</button> se vérifie pour chacune.</p>
<div class="quiz ui"><p>Quel raisonnement est correct pour M. L., dont les CD4 sont à 86/µL ?</p><button data-ok="1">Les CD4 indiquent une immunodépression profonde ; la fièvre exige encore une recherche de cause, et la candidose orale ne devient une œsophagite présumée qu’en présence d’une dysphagie récente.</button><button data-ok="0">La candidose orale prouve à elle seule une atteinte œsophagienne.</button><button data-ok="0">L’absence de dyspnée au repos exclut une pneumocystose.</button><p class="fb" hidden>EACS 13 définit l’œsophagite présumée par une dysphagie récente associée à une candidose oropharyngée. La pneumocystose se manifeste d’abord par une dyspnée ou une désaturation d’effort. Le chiffre de CD4 oriente les risques ; il ne remplace aucun diagnostic d’organe.</p></div>
<button class="pareto-btn ui" data-k="pareto-b24-bases">▲ Loi de Pareto — Définir, comprendre et diagnostiquer</button>
</section>

<section class="ilot" id="b24-pa-8"><h2><span class="n">8</span>Urgences et complications : raisonner par organe</h2>
<div class="alert"><b>Une défaillance se traite immédiatement.</b> Hypoxémie, détresse respiratoire, hypotension avec hypoperfusion, trouble de conscience, convulsion ou déficit neurologique nouveau imposent une évaluation urgente. La stabilisation est prioritaire ; le bilan du VIH se poursuit en parallèle sans retarder les soins.</div>
<table class="t"><tr><th>Signal</th><th>Hypothèse prioritaire</th><th>Conduite selon EACS 13</th></tr>
<tr><td>Dyspnée d’effort, toux sèche, désaturation</td><td>Pneumocystose</td><td>Expectoration induite ou lavage bronchoalvéolaire ; triméthoprime-sulfaméthoxazole à dose curative pendant au moins 21 jours ; prednisone si PaO₂ &lt;10 kPa (70 mmHg)</td></tr>
<tr><td>Céphalée, confusion, fièvre</td><td>Cryptococcose neuroméningée</td><td>Ponctions lombaires répétées jusqu’à une pression d’ouverture &lt;20 cm d’eau ; corticoïdes contre-indiqués ; traitement antirétroviral différé de 4 à 6 semaines</td></tr>
<tr><td>Déficit focal, convulsion</td><td>Toxoplasmose cérébrale</td><td>Imagerie cérébrale, IgG sériques, traitement empirique de 6 semaines</td></tr>
<tr><td>Odynophagie, apports impossibles</td><td>Œsophagite candidosique</td><td>Fluconazole par voie orale ; endoscopie pour le diagnostic de certitude</td></tr></table>
<p>Ce tableau montre que chaque urgence a son propre calendrier antirétroviral. Dans la pneumocystose hypoxémique, EACS 13 ne retient un bénéfice des corticoïdes que s’ils commencent dans les 72 heures ; dans la cryptococcose, ils sont au contraire contre-indiqués, où la pression intracrânienne se traite par ponctions répétées. <a href="https://eacs.sanfordguide.com/resolveuid/45a849d6c5e74e9aa848caad3d5aeed4" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, PcP</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/b345db315dde48bb8015e82fa0aedfbd" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Cryptococcosis</a>.</p>
<p>Le <button class="w" data-k="b24-pa-iris">syndrome inflammatoire de reconstitution immunitaire</button> est la complication propre au début du traitement : la restauration immunitaire aggrave une infection connue ou révèle une infection méconnue. EACS 13 le définit après exclusion de l’évolution attendue de l’infection et d’une toxicité médicamenteuse. Il explique pourquoi la cryptococcose neuroméningée retarde le traitement antirétroviral et pourquoi EACS demande de rechercher l’antigène cryptococcique chez toute personne nouvellement diagnostiquée avec moins de 100 CD4/µL. <a href="https://eacs.sanfordguide.com/resolveuid/e9ccb1296ed04c91be59234de5789ccb" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, IRIS</a>. M. L. n’a pas ces signes au départ ; leur apparition ultérieure imposerait une réévaluation immédiate.</p>
</section>

<section class="ilot" id="b24-pa-9"><h2><span class="n">9</span>Prise en charge initiale : traiter tôt, avec un calendrier sûr</h2>
<h3>9.1 Objectifs</h3>
<p>Le traitement antirétroviral est recommandé à toute personne vivant avec le VIH, quel que soit le chiffre de CD4, pour réduire la morbidité et la mortalité et pour prévenir la transmission. L’urgence est plus grande lors d’une primo-infection, d’une grossesse ou de CD4 bas. Le but virologique est un ARN &lt;50 copies/mL ; EACS 13 qualifie d’incomplète une suppression qui n’y parvient pas à 6 mois. <a href="https://eacs.sanfordguide.com/resolveuid/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initiation of ART</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Virological Failure</a>.</p>
<h3>9.2 Moyens et choix justifiés</h3>
<p>Le génotype de résistance est recommandé avant le traitement, idéalement au diagnostic, mais son attente ne doit pas retarder le début. Si le traitement commence avant son résultat, EACS 13 recommande un schéma à haute barrière génétique, de préférence un inhibiteur de l’intégrase de deuxième génération, sinon un inhibiteur de protéase potentialisé. Un <button class="w" data-k="b24-pa-start">démarrage le jour même</button> est faisable pour la plupart des personnes nouvellement diagnostiquées ; il dépend du contexte médical et du risque de perte de suivi. La pharmacologie détaille les schémas et leurs doses suisses.</p>
<h3>9.3 Calendrier en présence d’une infection opportuniste</h3>
<p>EACS 13 recommande de commencer le traitement antirétroviral dès que possible, dans les 2 semaines suivant le début du traitement de l’infection opportuniste. La méningite cryptococcique fait exception : le traitement antirétroviral y est différé de 4 à 6 semaines, car ce délai réduit le risque d’IRIS paradoxal. La tuberculose suit la règle générale, un début dans les 2 semaines quel que soit le chiffre de CD4, et tout particulièrement sous 50 CD4/µL ; seule la méningite tuberculeuse obéit à un calendrier propre : début dans les 2 semaines sous 50 CD4/µL, dans les 4 semaines dans les autres cas. <a href="https://eacs.sanfordguide.com/resolveuid/98f6da3e8a7547d28ad88f30032980de" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, OI Overview &amp; When to Start ART</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/eed2eec2875a4e3f89f597d4fd5dca88" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, ART in TB/HIV Co-infection</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/e9ccb1296ed04c91be59234de5789ccb" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, IRIS</a>. Une candidose oropharyngée seule relève donc de la règle générale.</p>
<h3>9.4 Prophylaxies et surveillance</h3>
<p>Chez une personne non traitée, EACS 13 indique une prophylaxie de la pneumocystose et de la toxoplasmose dès que les CD4 sont &lt;200/µL, que leur pourcentage est &lt;14 % ou qu’une candidose orale est présente. M. L. remplit deux de ces critères. L’antigène cryptococcique sérique est recherché parce que ses CD4 sont &lt;100/µL. Une prophylaxie contre les mycobactéries non tuberculeuses n’est pas recommandée si le traitement antirétroviral commence. <a href="https://eacs.sanfordguide.com/resolveuid/1caa81786ee74bf2887fc8bce8636e1d" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary Prophylaxis of OIs</a>.</p>
<p>Pour M. L., le plan est le suivant : traiter la candidose, rechercher la cause de la fièvre, commencer la prophylaxie par triméthoprime-sulfaméthoxazole, rechercher l’antigène cryptococcique et la tuberculose, puis commencer le traitement antirétroviral dans les deux semaines, avec l’infectiologue. Avant la sortie, le patient sait quels médicaments prendre, pourquoi les poursuivre, quel symptôme impose un retour et qui contacter. Le <button class="w" data-k="b24-pa-alliance">soutien à l’adhésion</button> anticipe les obstacles concrets.</p>

<section class="ilot" id="b24-pa-10"><h2><span class="n">10</span>Suivi, prévention et déclaration</h2>
<h3>10.1 Suivi</h3>
<p>Le suivi répond à deux questions : le virus est-il supprimé, et l’immunité se reconstitue-t-elle ? EACS 13 fixe un intervalle de 3 à 12 mois pour l’ARN plasmatique, les CD4, la formule sanguine, la fonction rénale et les tests hépatiques ; les CD4 se contentent d’un contrôle annuel chez une personne stable. EACS ne date pas le premier contrôle après le début du traitement. L’algorithme de l’OMS, conçu pour détecter tôt un échec, exige un résultat au plus tard 6 mois après le début, puis à 12 mois et chaque année ensuite. <a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a> ; <a href="https://www.who.int/publications/i/item/9789240055179" target="_blank" rel="noopener" data-reference-source="1">OMS, rôle de la suppression virale, note d’orientation du 22 juillet 2023, annexe 1</a>.</p>
<p>La <button class="w" data-k="b24-pa-seuils">charge virale s’interprète par seuils</button>. Sous 50 copies/mL, la suppression est atteinte selon EACS 13 ; au-dessus de 50 copies/mL six mois après le début, elle est incomplète. Un délai plus long est admis si la charge initiale dépassait 100 000 copies/mL, ce qui est le cas de M. L. Entre 50 et 200 copies/mL, la virémie faible impose de renforcer l’observance et de recontrôler 1 à 2 mois plus tard ; au-delà de 200 copies/mL confirmées, l’échec est évalué avec un génotype. <a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Virological Failure</a>.</p>
<p>Chez M. L., les consultations des premières semaines sont d’abord dictées par l’infection opportuniste, la tolérance de la prophylaxie et le risque d’IRIS (îlot 8). Le <button class="w" data-k="b24-pa-suivi">suivi global</button> comprend aussi le risque cardiovasculaire, la santé mentale et sexuelle, les dépistages des cancers et les vaccinations.</p>
<h3>10.2 « Indétectable = intransmissible »</h3>
<p>La Suisse a été pionnière : en 2008, Vernazza et coll. ont publié dans le Bulletin des médecins suisses la <button class="w" data-k="b24-pa-ii">Swiss Statement</button>, selon laquelle une personne séropositive sous traitement antirétroviral efficace et sans autre infection sexuellement transmissible ne transmet pas le VIH par voie sexuelle. L’étude européenne PARTNER2 l’a confirmé : chez 782 couples d’hommes dont le partenaire séropositif avait un ARN &lt;200 copies/mL, aucune transmission liée au partenaire n’a été observée pendant 1593 années-couple. <a href="https://www.bag.admin.ch/dam/fr/sd-web/v95PQhoWf2w0/fr_BAG_Bulletin_44-25_STI_bf.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, bulletin 44/2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31056293/" target="_blank" rel="noopener" data-reference-source="1">Rodger et coll., Lancet 2019</a>.</p>
<p>Ce principe ne s’applique pas dès la première dose. Avec 180 000 copies/mL, M. L. doit utiliser un autre moyen de prévention jusqu’à la suppression documentée. Il ne protège pas contre les autres infections sexuellement transmissibles.</p>
<h3>10.3 Prophylaxies des partenaires</h3>
<p>Un partenaire exposé récemment relève d’une <button class="w" data-k="b24-pa-exposition">prophylaxie post-exposition urgente</button>. Selon la Commission fédérale pour la santé sexuelle, son efficacité diminue dès 6 à 8 heures et elle n’est plus indiquée après 48 heures ; EACS 13 admet un début jusqu’à 72 heures. Un partenaire à risque durable peut recevoir une <button class="w" data-k="b24-pa-prep">PrEP dans le programme SwissPrEPared</button>, remboursée par l’assurance obligatoire des soins depuis juillet 2024 ; 6968 personnes en bénéficiaient en 2024.</p>
<h3>10.4 Déclaration obligatoire</h3>
<p>Tout nouveau diagnostic de VIH est soumis à <button class="w" data-k="b24-pa-declaration">déclaration</button>, y compris chez une personne arrivant en Suisse avec un diagnostic posé à l’étranger. Le laboratoire déclare son résultat à l’OFSP et au médecin cantonal dans la semaine ; le médecin déclare les résultats cliniques au médecin cantonal dans un délai d’une semaine. <a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4, § 5</a>.</p>
<div class="quiz ui"><p>Une personne traitée depuis longtemps maintient un ARN VIH à 80 copies/mL. Quel message est exact ?</p><button data-ok="1">Une suppression maintenue sous 200 copies/mL sous traitement empêche la transmission sexuelle du VIH ; elle ne prévient pas les autres infections sexuellement transmissibles.</button><button data-ok="0">Toute valeur détectable prouve un risque de transmission sexuelle du VIH.</button><button data-ok="0">Ce résultat garantit aussi un risque nul pour l’allaitement et le partage de seringues.</button><p class="fb" hidden>PARTNER2 a retenu un ARN &lt;200 copies/mL comme critère de suppression ; aucune transmission liée au partenaire n’a été observée. Une revue systématique de 2023 décrit un risque presque nul sous 1000 copies/mL. Ces preuves concernent la transmission sexuelle ; EACS 13 décrit pour l’allaitement un risque très faible mais non nul.</p></div>
</section>

<section class="ilot" id="b24-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<div class="two"><div class="card"><h4>Grossesse et allaitement</h4><p>EACS 13 recommande chez la femme enceinte naïve bictégravir/emtricitabine/ténofovir alafénamide, dolutégravir avec deux inhibiteurs nucléosidiques ou darunavir/ritonavir 600/100 mg deux fois par jour. L’allaitement peut être envisagé par décision partagée si la mère est observante, supprimée et suivie, car son risque est très faible mais non nul. En Suisse, la prise en charge mère-enfant suit les <button class="w" data-k="b24-pa-grossesse">recommandations de la CFSS 2018</button>.</p></div><div class="card"><h4>VIH-2 et infection mixte</h4><p>Le VIH-2 est naturellement résistant à tous les inhibiteurs non nucléosidiques, à l’atazanavir et au fostemsavir. EACS 13 recommande en première ligne bictégravir/emtricitabine/ténofovir alafénamide, ou dolutégravir avec ténofovir et lamivudine ou emtricitabine. Sa charge virale exige une technique spécialisée.</p></div></div>
<div class="two"><div class="card"><h4>Insuffisance rénale ou hépatique</h4><p>Les informations professionnelles suisses fixent les limites : Biktarvy® est à éviter sous une clairance de 30 mL/min hors hémodialyse chronique, Dovato® n’est pas recommandé sous 30 mL/min, Biktarvy® n’est pas recommandé en insuffisance hépatique sévère et aucune donnée n’existe pour le dolutégravir dans cette situation (pharmacologie).</p></div><div class="card"><h4>Personne venant de l’étranger</h4><p>La directive OFSP impose de vérifier le diagnostic et de le déclarer. Les résultats de résistance et l’historique des traitements comptent davantage que l’hypothèse d’un patient naïf.</p></div></div>
<p>Pour la vaccination, le <button class="w" data-k="b24-pa-vaccins">Plan de vaccination suisse 2026</button> contre-indique les vaccins vivants contre la rougeole, les oreillons, la rubéole et la varicelle en dessous de 200 CD4/µL chez l’adulte ; il recommande le vaccin conjugué contre le pneumocoque dès le diagnostic, et de répéter la vaccination après la reconstitution immunitaire lorsque les CD4 étaient &lt;200/µL. <a href="https://eacs.sanfordguide.com/resolveuid/1cc2030e4d4f4f039f101fa4239e52ec" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Pregnancy and HIV</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Plan de vaccination suisse 2026</a>.</p>
<div class="key"><b>Cas récapitulatif.</b> M. L., 34 ans, 86 CD4/µL, 180 000 copies/mL, candidose orale et fièvre : maladie avancée ; candidose traitée par fluconazole ; prophylaxie par triméthoprime-sulfaméthoxazole ; antigène cryptococcique, recherche de tuberculose, sérologies des hépatites et génotype prélevés ; traitement antirétroviral à haute barrière, par exemple bictégravir/emtricitabine/ténofovir alafénamide, commencé dans les deux semaines ; déclaration au médecin cantonal dans la semaine ; prévention transitoire des partenaires ; vaccins vivants différés.</div>
</section>

<section class="ilot" id="b24-pa-12"><h2><span class="n">12</span>Critères formels du diagnostic et paramètres clés</h2>
<div class="alert"><b>Critères formels, directive OFSP 2025, version 4 (10 juillet 2026).</b> L’infection par le VIH est diagnostiquée chez une personne de plus de 18 mois par la positivité d’au moins <b>deux étapes</b> utilisant <b>deux techniques différentes</b> : un dépistage de quatrième génération au moins (anticorps et antigène p24), puis une confirmation sérologique ou moléculaire sur le même échantillon. Le médecin vérifie ensuite la présence du virus sur un <b>second échantillon</b>, en général par une charge virale détectable. Une discordance persistante est soumise au Centre national de référence pour les rétrovirus. La <b>maladie avancée</b> se définit par des CD4 &lt;200/µL ou un événement définissant le sida (consensus européen ; OMS : stade clinique 3 ou 4). Le <b>sida</b> correspond, selon l’OMS, à une affection de stade clinique 4.</div>
<div class="key"><b>Paramètres clés.</b> Fenêtre sérologique du test de quatrième génération : 6 semaines. Prophylaxie de la pneumocystose et de la toxoplasmose : CD4 &lt;200/µL, &lt;14 % ou candidose orale ; arrêt si CD4 &gt;100/µL et ARN indétectable depuis plus de 3 mois. Antigène cryptococcique : CD4 &lt;100/µL. Pas de prophylaxie des mycobactéries non tuberculeuses si le traitement commence. Traitement antirétroviral dans les 2 semaines après le début du traitement d’une infection opportuniste ou d’une tuberculose ; 4 à 6 semaines en cas de méningite cryptococcique. Objectif : ARN &lt;50 copies/mL à 6 mois ; virémie faible entre 50 et 200 copies/mL ; échec si &gt;200 copies/mL confirmées (EACS) ; non-suppression OMS si &gt;1000 copies/mL. Contrôle de l’ARN tous les 3 à 12 mois ; OMS : à 6 et 12 mois puis chaque année. Transmission sexuelle : ARN &lt;200 copies/mL. Stades OMS : stade 3 si candidose orale persistante ou fièvre inexpliquée de plus d’un mois ; stade 4 si candidose œsophagienne. Vaccins vivants : contre-indiqués sous 200 CD4/µL. Déclaration : dans la semaine. Piège : un test négatif dans la fenêtre ou sous PrEP n’exclut pas l’infection.</div>
