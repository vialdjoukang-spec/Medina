<template data-pop="a54-pa-uretrite" data-title="Urétrite : les symptômes ne désignent pas l’agent">
<div class="lab">Ce que montre le cas</div><p>Brûlure en urinant et écoulement traduisent une inflammation urétrale possible. Une exposition cinq jours auparavant se situe dans l’intervalle d’incubation de un à sept jours indiqué par la SSI pour la gonococcie, mais la chronologie ne prouve ni la source ni l’agent. La SSI souligne la ressemblance clinique des urétrites gonococciques et à chlamydia.</p>
<div class="lab">Ce qui manque</div><p>Il faut préciser l’aspect de l’écoulement, rechercher les signes de complication, obtenir une amplification d’acides nucléiques et si possible une culture avant antibiotique. Pour une urétrite masculine, la SSI du 13 juin 2024 recommande d’attendre la bactérie identifiée si l’état le permet ; les symptômes sévères justifient un traitement empirique après prélèvements couvrant gonocoque et chlamydia. Le tableau de M. N. ne précise ni la purulence ni la sévérité.</p>
<div class="src">Sources primaires : <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », traitement, validée le 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », clinique et diagnostic, validée le 8 mai 2024</a>, lues le 8 octobre 2026.</div></template>

<template data-pop="a54-pa-codage" data-title="A54 : neuf sous-codes dans la CIM-10-GM 2024">
<div class="lab">Lire le site et la forme</div><p>A54.0 et A54.1 distinguent l’infection urogénitale basse sans ou avec abcès périurétral ou des glandes urétrales. A54.2 couvre la pelvipéritonite et d’autres organes urogénitaux ; A54.3 l’œil ; A54.4† le système musculosquelettique ; A54.5 le pharynx ; A54.6 l’anus et le rectum ; A54.8 les autres formes, dont certaines formes invasives ; A54.9 la forme sans précision. Le signe † de A54.4 signale la convention étiologie–manifestation : le code complémentaire * dépend de la manifestation documentée.</p>
<div class="lab">Appliquer au dossier</div><p>Le catalogue classe une maladie établie ; il ne transforme pas une hypothèse en diagnostic. M. N. a des signes d’urétrite, mais aucun résultat gonococcique. Si le diagnostic et le site sont ensuite établis, le sous-code suit la localisation réelle. A54.6 est nécessaire lorsque l’atteinte anorectale est documentée.</p>
<div class="src">Source primaire : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A54" target="_blank" rel="noopener" data-reference-source="1">BfArM, ICD-10-GM 2024, bloc A50–A64, A54.0 à A54.9</a>, lu le 8 octobre 2026. Cette classification allemande ne fixe pas seule le codage de facturation suisse.</div></template>

<template data-pop="a54-pa-cim11" data-title="CIM-11 : hiérarchie candidate, sans conversion automatique">
<div class="lab">Catégories OMS consultées</div><p>La version MMS française 2026-01 regroupe l’infection gonococcique dans le bloc 1A7. Elle distingue 1A70 pour le système génito-urinaire, 1A71 pour la pelvipéritonite, 1A72 pour les autres sites, 1A73 pour la dissémination et 1A7Z pour une infection sans précision. Sous 1A72, le rectum, l’anus, le pharynx et l’œil disposent de subdivisions propres.</p>
<div class="lab">Limite de correspondance</div><p>La hiérarchie CIM-11 ne reproduit pas nécessairement les subdivisions ni les conventions dagger/astérisque de la CIM-10-GM. Une table de correspondance validée et les consignes locales sont nécessaires pour classer tous les cas ; ce cours n’affirme aucune équivalence automatique.</p>
<div class="src">Source primaire : <a href="https://icd.who.int/browse/2026-01/mms/fr#609214049" target="_blank" rel="noopener" data-reference-source="1">OMS, CIM-11 MMS française 2026-01, bloc « Infection gonococcique »</a>, consultée le 8 octobre 2026.</div></template>

<template data-pop="a54-pa-pareto-codage" data-title="Loi de Pareto — Le code suit le diagnostic documenté">
<div class="ratio" data-cover="a54-pa-0,a54-pa-1">Les distinctions de départ</div><ul><li>Une dysurie et un écoulement définissent une piste d’urétrite, pas la présence prouvée du gonocoque.</li><li>La CIM-10-GM 2024 comporte neuf subdivisions A54, dont A54.6 pour l’anus et le rectum.</li><li>Le site et les complications orientent le sous-code ; A54.9 n’efface pas un site déjà connu.</li><li>La CIM-11 possède une autre hiérarchie ; aucune correspondance automatique n’est démontrée ici.</li></ul><div class="key">Avant le résultat, M. N. reste un cas suspect et non « A54.0 confirmé ».</div></template>

<template data-pop="a54-pa-silencieuses" data-title="Pharynx et rectum : l’absence de douleur n’exclut pas l’infection">
<div class="lab">Pourquoi examiner les expositions</div><p>Selon la directive SSI, plus de 90 % des infections pharyngées et rectales peuvent être asymptomatiques. Une bactérie présente à ces sites peut donc persister sans motif spontané de consultation. Interroger la pratique sexuelle et prélever les sites réellement exposés augmente la chance de trouver une infection qui aurait échappé au seul test urinaire.</p>
<div class="lab">Application mesurée</div><p>Chez M. N., le rapport oral ouvre la question du site pharyngé selon les pratiques exactes ; aucune exposition rectale n’a été fournie. Le site de prélèvement ne doit pas être déduit de l’identité, du genre ou d’un autre résultat positif. Un test urinaire négatif n’exclut pas à lui seul une infection pharyngée.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », aspects généraux, clinique et diagnostic, validation du 8 mai 2024</a>.</div></template>

<template data-pop="a54-pa-coinfection" data-title="Chlamydia et gonocoque : deux diagnostics à tester">
<div class="lab">Cause du piège</div><p><i>C. trachomatis</i> et <i>N. gonorrhoeae</i> peuvent produire une urétrite ressemblante ; une coinfection est possible. La seule couleur d’un écoulement ou le délai depuis un rapport ne sépare pas sûrement les deux. Une PCR combinée ou des tests adaptés aux deux agents répondent à cette question selon le laboratoire.</p>
<div class="lab">Conséquence thérapeutique</div><p>Un résultat positif pour l’un ne démontre pas que l’autre est présent ou absent. Le choix antibiotique doit tenir compte des résultats, du tableau et de la directive applicable. Les sérologies VIH et syphilis et la vérification de la protection VHB répondent à d’autres risques et ne sont pas remplacées par le test urétral.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, étiologie, clinique, diagnostic et aspects généraux</a>.</div></template>

<template data-pop="a54-pa-complications" data-title="Complications : le site change la conduite">
<div class="lab">Extension locale</div><p>L’infection peut rester muqueuse ou atteindre l’épididyme, d’autres organes urogénitaux et, chez certaines patientes, le pelvis. Une maladie inflammatoire pelvienne peut laisser des séquelles de fertilité ; l’épididymite réclame un examen scrotal et une stratégie distincte d’une urétrite simple. Ces atteintes ne sont pas déduites d’une simple dysurie.</p>
<div class="lab">Œil et nouveau-né</div><p>Une atteinte oculaire gonococcique est une forme à part : la gravité visuelle potentielle accélère la consultation et le prélèvement. L’ophtalmie du nouveau-né relève d’une évaluation pédiatrique et périnatale, non du schéma d’un adulte atteint d’urétrite.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A54" target="_blank" rel="noopener" data-reference-source="1">BfArM 2024, A54.2–A54.3</a>.</div></template>

<template data-pop="a54-pa-dgi" data-title="Gonococcie disséminée : peau, tendons et articulations">
<div class="lab">Mécanisme et signes</div><p>La diffusion sanguine du gonocoque peut atteindre peau, gaines tendineuses et articulations. La SSI décrit des pustules parfois nécrotiques aux extrémités, des ténosynovites et une mono- ou polyarthrite, dont une arthrite purulente. Une fièvre avec douleur articulaire, gonflement ou lésion cutanée demande une évaluation urgente ; méningite et endocardite sont des formes plus rares et sévères.</p>
<div class="lab">Preuve et limite</div><p>Selon la SSI, une culture positive du sang, du liquide synovial ou d’une biopsie cutanée peut confirmer la dissémination. Une culture muqueuse positive associée à des signes typiques soutient un diagnostic probable ; elle ne suffit pas à elle seule. M. N. n’a pas de douleur articulaire signalée, mais la question doit être posée.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, section « Gonococcémie disséminée », critères diagnostiques</a>.</div></template>

<template data-pop="a54-pa-pareto-gravite" data-title="Loi de Pareto — Reconnaître une autre urgence qu’une urétrite">
<div class="ratio" data-cover="a54-pa-2,a54-pa-3,a54-pa-4">Les éléments qui modifient le parcours</div><ul><li>Pharynx et rectum peuvent être infectés sans symptômes : tester les sites exposés.</li><li>Douleur scrotale ou pelvienne suggère une extension et impose un examen ciblé.</li><li>Fièvre, lésions cutanées ou articulation douloureuse font rechercher une dissémination.</li><li>Œil purulent ou atteinte néonatale demandent une prise en charge spécifique rapide.</li></ul><div class="key">La non-mention d’un signe dans le cas n’est pas un résultat d’examen négatif.</div></template>

<template data-pop="a54-pa-triage" data-title="Triage : symptômes à demander et actions à déclencher">
<div class="lab">Questionner et examiner</div><p>Fièvre, altération de l’état général, douleur testiculaire ou pelvienne, articulation chaude ou douloureuse, pustules et symptômes oculaires orientent vers une forme compliquée. L’histoire et l’examen confirment où se situe le problème ; ils n’identifient pas à eux seuls le gonocoque.</p>
<div class="lab">Décision</div><p>Une articulation possiblement septique, une atteinte oculaire marquée ou un état fébrile avec suspicion de dissémination exige une évaluation urgente, des prélèvements appropriés et souvent un avis spécialisé. Une urétrite isolée stable peut suivre le circuit ambulatoire de prélèvements et résultat. Aucune constante ni aucun examen de M. N. ne sont fournis ici.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique, diagnostic et gonococcémie disséminée</a>.</div></template>

<template data-pop="a54-pa-pcr" data-title="Amplification d’acides nucléiques : confirmer par site">
<div class="lab">Ce que mesure le test</div><p>La méthode d’amplification, souvent nommée PCR, détecte les acides nucléiques du gonocoque ; selon la SSI, elle est plus sensible que la culture sur les sites utilisés. Chez un homme avec urétrite, le premier jet d’urine est approprié ; volume et délai depuis la dernière miction suivent la procédure du laboratoire et la directive d’urétrite masculine. Des écouvillons pharyngés ou rectaux sont ajoutés selon les expositions.</p>
<div class="lab">Ce qu’elle ne dit pas</div><p>Le résultat appartient au site prélevé. Une amplification positive ne fournit généralement pas la sensibilité aux antibiotiques et, peu après un traitement, peut demander une interprétation du délai. L’amplification ne remplace donc pas toujours une culture réalisable.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, gonococcie, 8 mai 2024, diagnostic et transport</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, urétrite masculine, 13 juin 2024, prélèvements</a>.</div></template>

<template data-pop="a54-pa-culture" data-title="Culture : préserver la preuve de sensibilité">
<div class="lab">Pourquoi la faire avant l’antibiotique</div><p>La culture récupère la bactérie vivante et permet l’antibiogramme ; une PCR seule ne dit pas si une souche résiste à une molécule. Le prélèvement de l’écoulement pathologique est idéalement pris avant traitement. La SSI demande un transport rapide vers le laboratoire avec le milieu convenu : le gonocoque fragile peut ne plus pousser si le prélèvement est mal conservé.</p>
<div class="lab">Interpréter l’échec de culture</div><p>Une culture négative après antibiotique ou problème de transport n’écarte pas automatiquement une infection détectée par amplification. Si les symptômes persistent plus de deux jours après traitement, la SSI recommande un nouveau prélèvement pour culture et recherche de résistance.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic, transport et suivi thérapeutique</a>.</div></template>

<template data-pop="a54-pa-resistance" data-title="Résistance suisse : données de population, pas antibiogramme individuel">
<div class="lab">Données datées</div><p>Le Bulletin OFSP 44/2025 rapporte les données ANRESIS pour l’année 2024 : résistance aux quinolones de 70 % et à l’azithromycine de 21 %. Il signale aussi des résistances aux céphalosporines orales et renvoie à la SSI pour l’usage de la ceftriaxone à dose élevée. Ces chiffres décrivent les souches surveillées en Suisse et au Liechtenstein en 2024, avec les limites propres à une surveillance, et non un résultat de M. N. en 2026.</p>
<div class="lab">Effet sur la décision</div><p>Une fluoroquinolone n’est pas choisie empiriquement sur la seule présomption de gonococcie. La culture et la sensibilité de l’isolat deviennent particulièrement utiles en cas de traitement alternatif, de réponse insuffisante ou de suspicion d’échec.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, « La gonorrhée en Suisse et au Liechtenstein en 2024 », rubrique « Résistance aux antibiotiques »</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et traitement</a>.</div></template>

<template data-pop="a54-pa-ceftriaxone" data-title="Ceftriaxone : indication clinique suisse et vérification du produit">
<div class="lab">Recommandation pour le gonocoque identifié</div><p>Pour l’urétrite et les infections gonococciques vaginales, anales ou oropharyngées non compliquées, la directive SSI validée le 8 mai 2024 indique ceftriaxone 1 g en une injection intramusculaire ; la voie intraveineuse est possible. La cible est une infection gonococcique muqueuse de l’adulte. Une forme disséminée, une atteinte oculaire et un autre terrain peuvent exiger un autre schéma et un avis spécialisé.</p>
<div class="lab">Différence avec l’urétrite non attribuée</div><p>Pour une urétrite masculine sévère sans agent encore identifié, la directive SSI validée le 13 juin 2024 prévoit après prélèvements une couverture empirique du gonocoque <em>et</em> de la chlamydia, puis une adaptation au résultat. Si l’état permet d’attendre, elle préfère cibler l’antibiotique selon la bactérie retrouvée. M. N. n’a pas encore de signe de sévérité décrit.</p>
<div class="lab">Sécurité du produit</div><p>Vérifier allergie, indication, préparation et information professionnelle suisse du produit réellement administré. La monographie Ceftriaxon Labatec affiche une dose de gonococcie différente de la directive clinique SSI ; celle-ci guide ici l’indication clinique suisse, tandis que les modalités de reconstitution et de sécurité suivent le produit. L’onglet pharmacologie explique l’écart et ses dates.</p>
<div class="src">Sources cliniques : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, gonococcie, 8 mai 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, urétrite masculine, 13 juin 2024</a>. Source de produit à vérifier lors de l’administration : <a href="https://compendium.ch/fr/product/1146879-ceftriaxon-labatec-subst-seche-1-g" target="_blank" rel="noopener" data-reference-source="1">Compendium, Ceftriaxon Labatec, information professionnelle suisse</a>.</div></template>

<template data-pop="a54-pa-autres-antibiotiques" data-title="Alternatives : allergie certifiée ou sensibilité démontrée">
<div class="lab">Limites d’une substitution</div><p>La SSI réserve l’association gentamicine–azithromycine à une allergie sévère et certifiée aux céphalosporines ; elle mentionne d’autres alternatives sous conditions d’administration ou d’antibiogramme. En particulier, la ciprofloxacine n’est une option que si la souche est sensible. Les effets indésirables, les résistances et la disponibilité du produit requièrent un choix individualisé, idéalement avec avis infectiologique.</p>
<div class="lab">Pourquoi le cas ne suffit pas</div><p>M. N. n’a ni allergie documentée ni souche isolée. Lui attribuer une alternative maintenant créerait un traitement arbitraire. Les 70 % de résistance aux quinolones rapportés en 2024 par l’OFSP renforcent l’importance d’un antibiogramme avant une fluoroquinolone.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, section « Allergie aux céphalosporines »</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, résistance 2024</a>.</div></template>

<template data-pop="a54-pa-pareto-decision" data-title="Loi de Pareto — Prélever, classer, traiter, contrôler">
<div class="ratio" data-cover="a54-pa-5,a54-pa-6,a54-pa-7">Quatre étapes qui évitent les erreurs fréquentes</div><ol><li>Prendre PCR et culture avant l’antibiotique quand cela est possible.</li><li>Classer le site, la gravité et une éventuelle dissémination avant de choisir le schéma.</li><li>Pour une forme muqueuse adulte, appliquer la directive suisse, en vérifiant allergie et produit ; ne pas supposer la sensibilité aux quinolones.</li><li>Contrôler la réponse et effectuer le contrôle microbiologique recommandé à sept jours.</li></ol><div class="key">Dans le cas de M. N., le caractère purulent de l’écoulement et les résultats manquent encore.</div></template>

<template data-pop="a54-pa-controle" data-title="Suivi : distinguer persistance, nouvelle exposition et autre cause">
<div class="lab">Deux repères de la SSI</div><p>La SSI recommande un contrôle microbiologique sept jours après le traitement. Des symptômes qui persistent au-delà de deux jours conduisent à un nouveau prélèvement urétral ou urinaire pour culture, afin de rechercher une résistance. La persistance appelle aussi une réévaluation de l’observance, d’une nouvelle exposition et d’une coinfection.</p>
<div class="lab">Interprétation</div><p>Le type de test, le site et le délai sont notés pour comparer le contrôle au prélèvement initial. Si une culture reste positive ou si les symptômes persistent, une résistance, une nouvelle exposition et une autre cause sont examinées. Le suivi d’une arthrite ou d’une atteinte oculaire est distinct.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, traitement et contrôle de la réponse</a>.</div></template>

<template data-pop="a54-pa-partenaires" data-title="Partenaires : casser la transmission et éviter la réinfection">
<div class="lab">Deux textes primaires suisses</div><p>La directive SSI « Gonococcie », validée le 8 mai 2024, demande de contacter les partenaires sexuels des <b>deux derniers mois</b> et de s’abstenir de rapports, y compris oraux, pendant une semaine après le début du traitement. La directive SSI « Urétrite chez l’homme », validée le <b>13 juin 2024</b>, indique explicitement <b>trois derniers mois pour le gonocoque</b>, avec tests et traitement des partenaires de préférence simultanés ; elle demande d’éviter les rapports avec des partenaires non traités.</p>
<div class="lab">Choix pour M. N.</div><p>M. N. est un homme consultant pour urétrite. Pour ce contexte, la seconde directive est plus récente et explicitement applicable : trois mois sont retenus si l’infection gonococcique est établie. Cela ne transforme pas trois mois en règle universelle pour toute gonococcie. Une notification confidentielle et sans jugement aide les personnes exposées ; le récit ne désigne pas une source prouvée. L’OMS 2024 encadre les services aux partenaires sans trancher ce délai suisse.</p>
<div class="src">Textes actuellement accessibles : <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », partenaires, 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », partenaires, 8 mai 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240090767" target="_blank" rel="noopener" data-reference-source="1">OMS, recommandations IST et services aux partenaires, 17 juillet 2024</a>.</div></template>

<template data-pop="a54-pa-declaration" data-title="Déclaration suisse : qui envoie le complément clinique ?">
<div class="lab">Deux formulations SSI</div><p>La directive « Gonococcie » validée le 8 mai 2024 rappelle de ne pas oublier l’annonce complémentaire au médecin cantonal, mais indique aussi qu’après un résultat de laboratoire positif le médecin cantonal enverrait automatiquement la déclaration complémentaire. La directive « Urétrite chez l’homme » validée le 13 juin 2024, plus récente et directement applicable à M. N., sépare explicitement les responsabilités : le laboratoire déclare le gonocoque à l’OFSP ; le praticien qui a prescrit le test envoie le <b>formulaire clinique complémentaire au médecin cantonal</b>.</p>
<div class="lab">Action pour M. N.</div><p>Si un test gonococcique est positif, le praticien vérifie l’annonce du laboratoire, remplit et transmet le formulaire clinique complémentaire au médecin cantonal, en corrélant les données cliniques avec la déclaration anonymisée du laboratoire. Il ne suppose pas que l’envoi est automatique. Les données agrégées alimentent la surveillance ; le Bulletin OFSP 44/2025 décrit l’année 2024 et ne donne ni le statut infectieux ni l’antibiogramme de M. N.</p>
<div class="src">Textes primaires consultés : <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », « Notification à l’OFSP », validée le 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », « Diagnostic », validée le 8 mai 2024</a>. Surveillance : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025</a>.</div></template>

<template data-pop="a54-pa-sources" data-title="Sources A54 : version, rôle et limites">
<div class="lab">Rôles et dates</div><p>Le BfArM donne les neuf sous-codes de la CIM-10-GM 2024 ; il ne règle pas seul la facturation suisse. La SSI « Gonococcie », version consultée 24610, a été révisée en 2021, validée le 8 mai 2024 et affichée valable jusqu’au 15 décembre 2026. La SSI « Urétrite chez l’homme », version consultée 24921, a été validée le 13 juin 2024 ; elle règle la décision syndromique et le délai des partenaires dans le cas masculin. L’OFSP 44/2025 publie des données épidémiologiques et de résistance de 2024. L’OMS 2024 fournit un cadre international de traitement et de services aux partenaires, sans trancher les écarts entre directives suisses.</p>
<div class="lab">Ce qui reste ouvert</div><p>La classification CIM-11 MMS française 2026-01 donne des catégories candidates sans matrice d’équivalence validée. Les modalités du produit injectable nécessitent l’information professionnelle suisse actuelle.</p>
