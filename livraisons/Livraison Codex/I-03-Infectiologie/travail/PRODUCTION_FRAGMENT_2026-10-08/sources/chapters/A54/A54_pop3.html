<template data-pop="a54-ph-taan" data-title="TAAN/PCR : détection d'un site, sans antibiogramme"><div class="lab">Ce que mesure le test</div><p>Un test d'amplification des acides nucléiques (TAAN, souvent appelé PCR) cherche du matériel génétique de <i>Neisseria gonorrhoeae</i> dans un prélèvement. Il doit correspondre au site exposé : un résultat urinaire ne documente pas à lui seul le pharynx ou le rectum. La sensibilité du test et l'interprétation dépendent du prélèvement.</p><div class="lab">Limite pharmacologique</div><p>Le TAAN ne fournit pas l'antibiogramme d'une souche viable. Avant antibiothérapie, associer une culture quand c'est possible permet d'étudier la sensibilité, particulièrement utile si la réponse clinique est mauvaise.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », sections Diagnostic et Traitement, validée le 8 mai 2024</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-culture" data-title="Culture gonococcique : pourquoi la prélever avant l'antibiotique"><div class="lab">Utilité</div><p>La culture met en croissance un gonocoque viable et permet l'identification puis l'antibiogramme. Après antibiothérapie, la viabilité peut chuter même si des acides nucléiques persistent ; la fenêtre de culture utile est alors plus étroite.</p><div class="lab">Application</div><p>La SSI recommande de la joindre, idéalement avant traitement, aux tests moléculaires des sites exposés. Une culture négative n'efface pas automatiquement un TAAN positif si prélèvement, délai ou transport diffèrent. Chez M. N., aucun de ces résultats n'est fourni.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », Diagnostic, validée le 8 mai 2024</a>, consultée le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-sites" data-title="Sites exposés : une recherche anatomique ciblée"><div class="lab">Pourquoi plusieurs prélèvements</div><p>Une infection urétrale peut être symptomatique, alors que l'atteinte pharyngée ou rectale reste souvent silencieuse. Le médecin interroge les pratiques, examine les symptômes et prélève les sites exposés ; une urine seule laisse des localisations non explorées.</p><div class="lab">Conséquence pour le traitement</div><p>Identifier le site permet de choisir le suivi et de rechercher une persistance là où la bactérie se trouvait. La dose muqueuse SSI concerne notamment urètre, vagin, anus et oropharynx, mais l'atteinte profonde ou oculaire appelle un autre raisonnement.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », Clinique, Diagnostic et Traitement, validée le 8 mai 2024</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-dose" data-title="Ceftriaxone 1 g : recommandation clinique suisse et portée"><div class="lab">Recommandation retenue</div><p>La directive SSI « Gonococcie », révisée en 2021 et validée/renouvelée le 8 mai 2024, indique ceftriaxone <b>1 g en une injection IM</b> pour les infections urétrales, vaginales, anales et oropharyngées ; elle mentionne également une voie IV. La directive européenne IUSTI 2020 recommande 1 g IM associé à l'azithromycine 2 g quand la sensibilité est inconnue ; la monothérapie suisse, plus récente, s'applique en Suisse. L'OFSP 2025 renvoie aux doses élevées SSI dans le contexte suisse de résistance.</p><div class="lab">Limites</div><p>La dose unique ne s'applique pas par défaut à une infection disséminée, oculaire, néonatale ou génitale haute. Elle ne dispense ni du prélèvement des sites, ni de la vérification du produit, de ses contre-indications et de la stratégie de suivi. La FI du produit Labatec comporte une dose différente dans sa rubrique blennorragie, détaillée dans la fenêtre « notice suisse ».</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », validée le 8 mai 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, résistance aux antibiotiques</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-complexes" data-title="Une dose unique n'est pas un traitement universel"><div class="lab">Frontière clinique</div><p>La gonococcémie peut disséminer vers peau, gaines tendineuses et articulations ; une forme endocardique ou méningée est plus rare. Une infection oculaire menace la cornée ; l'infection du nouveau-né a ses propres risques et restrictions de ceftriaxone. La SSI sépare la gonococcémie du schéma des muqueuses et prévoit un traitement prolongé.</p><div class="lab">Décision</div><p>Fièvre, signes articulaires, oculaires ou génitaux hauts imposent une évaluation du foyer et de la gravité. Aucun de ces signes n'est rapporté chez M. N., mais leur absence n'est pas confirmée par un examen complet. Les doses et durées de ces tableaux ne se déduisent pas de la ligne « urètre ».</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », Clinique et Traitement, validée le 8 mai 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">FI Ceftriaxon Labatec n° 59876, juin 2025, Contre-indications</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-mecanisme" data-title="Ceftriaxone : paroi et temps d'exposition"><div class="lab">Mécanisme</div><p>La ceftriaxone, bêta-lactamine, se lie aux protéines qui assurent la réticulation du peptidoglycane. Une paroi en croissance devient instable et la bactérie sensible meurt. L'effet des bêta-lactamines dépend de la durée pendant laquelle la concentration libre reste au-dessus de la concentration minimale inhibitrice (CMI) ; la dose et la diffusion au foyer influent donc sur la réponse.</p><div class="lab">Limite</div><p>Des gonocoques peuvent modifier leurs protéines cibles ou accumuler d'autres mécanismes de moindre sensibilité. La détection moléculaire ne mesure ni la CMI ni la viabilité. Une culture avec antibiogramme est nécessaire pour étayer la sensibilité d'un isolat et analyser un échec.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">FI Ceftriaxon Labatec, juin 2025, Propriétés/Effets et résistances</a> ; <a href="https://www.ecdc.europa.eu/en/news-events/drug-resistant-gonorrhoea-rise-europe-ecdc-warns" target="_blank" rel="noopener" data-reference-source="1">ECDC, évaluation du 16 juillet 2026</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-divergence" data-title="Deux doses dans deux textes suisses : SSI et information produit"><div class="lab">Recommandation clinique spécifique</div><p>La SSI « Gonococcie », validée en mai 2024, indique 1 g IM pour une infection muqueuse urétrale, vaginale, anale ou oropharyngée. L'OFSP, dans son Bulletin 44/2025, renvoie aux doses élevées SSI face aux résistances ; la directive européenne IUSTI 2020 retient également 1 g IM.</p><div class="lab">Information du produit effectivement lue</div><p>La FI complète Ceftriaxon Labatec® i.v./i.m., autorisation Swissmedic n° 59876, mise à jour en <b>juin 2025</b>, dit dans « Posologie/Mode d'emploi — Blennorragie » : injection unique de <b>0,25 g IM</b>. Son indication inclut la blennorragie et demande le respect des recommandations officielles d'emploi des antibiotiques. Le 250 mg figure bien dans le texte intégral, pas seulement dans un résumé Compendium.</p><div class="lab">Arbitrage pour ce cours</div><p>Le schéma de 1 g SSI est exposé comme recommandation clinique suisse pour les formes muqueuses simples, avec culture et suivi. Le texte Labatec demeure accessible pour que le prescripteur confronte recommandation et spécialité choisie. Cette divergence ne suffit pas à établir ici une qualification juridique de prescription ; elle requiert une appréciation professionnelle documentée.</p><div class="src">Textes primaires : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », validée le 8 mai 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Ceftriaxon Labatec n° 59876, juin 2025, texte intégral</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 44/2025</a>. Lus le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-preparation" data-title="Préparation du flacon Labatec 1 g : IM et IV ne se confondent pas"><div class="lab">Instruction de la FI Labatec</div><p>Pour l'IM, le flacon de 1 g se dissout dans <b>3,5 mL de lidocaïne à 1 %</b>. La FI recommande de ne pas dépasser 1 g au même site. La directive SSI mentionne éventuellement 4 mL de lidocaïne à 1 % ; la prescription et la préparation suivent la monographie du produit réellement délivré, sans généraliser l'un ou l'autre volume.</p><div class="lab">Interdiction de voie</div><p><b>La solution avec lidocaïne ne doit jamais être injectée IV.</b> Pour le 1 g IV du produit Labatec, la FI décrit 10 mL d'eau pour préparations injectables et une injection sur deux à quatre minutes. Elle interdit de reconstituer ou diluer avec une solution contenant du calcium, en raison du risque de précipitation. Les restrictions chez le nouveau-né sont spécifiques.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">FI Ceftriaxon Labatec, juin 2025, Remarques concernant la manipulation</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », validée le 8 mai 2024</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-allergie" data-title="Hypersensibilité : interroger avant l'injection"><div class="lab">Risque propre à la ceftriaxone</div><p>La FI Labatec contre-indique le produit en cas d'hypersensibilité connue à la ceftriaxone ou à une autre céphalosporine et avertit d'un risque accru avec un antécédent de réaction aux pénicillines ou autres bêta-lactamines. Les réactions graves peuvent imposer l'arrêt immédiat et des soins d'urgence. Le nom « allergie à la pénicilline » dans un dossier ne décrit pas à lui seul la nature, la gravité ni la date de la réaction ; ces éléments sont recueillis avant de choisir une alternative.</p><div class="lab">Lidocaïne</div><p>Si le solvant IM contient de la lidocaïne, ses contre-indications sont vérifiées séparément. Une allergie à la ceftriaxone et une contre-indication à la lidocaïne ne sont pas le même problème et n'appellent pas automatiquement la même décision.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">FI Ceftriaxon Labatec n° 59876, juin 2025, Contre-indications et Mises en garde</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-grossesse" data-title="Grossesse : option clinique et précautions du produit"><div class="lab">Portée des textes</div><p>La directive européenne IUSTI 2020 recommande pendant la grossesse ceftriaxone 1 g IM, associée ou non à l'azithromycine 2 g, et proscrit fluoroquinolones et tétracyclines. L'information professionnelle suisse de Rocephin® contre-indique l'injection IM préparée avec lidocaïne pendant la grossesse, surtout au premier trimestre, et impose alors une préparation sans lidocaïne. La FI suisse Labatec de juin 2025 précise que la ceftriaxone traverse le placenta et recommande de ne l'utiliser, particulièrement durant les trois premiers mois, que lorsqu'elle est formellement indiquée.</p><div class="lab">Décision</div><p>Ces formulations ne dispensent pas de confirmer le diagnostic, l'âge gestationnel, l'allergie, la situation maternelle et le suivi. Le schéma de l'adulte enceinte n'est pas celui du nouveau-né. La grossesse n'est pas pertinente pour le cas de M. N., mais change les conditions d'une prescription générale.</p><div class="src">Sources : <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, grossesse</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">FI Ceftriaxon Labatec, juin 2025, Grossesse</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-dgi" data-title="Gonococcémie disséminée : traitement prolongé"><div class="lab">Mécanisme clinique</div><p>Le gonocoque peut franchir une muqueuse et se disséminer par le sang. Il atteint surtout articulations, gaines tendineuses et peau ; une endocardite ou une méningite reste possible. La présence de fièvre, arthrite, ténosynovite ou lésions cutanées change l'évaluation et les prélèvements.</p><div class="lab">Conséquence thérapeutique</div><p>La SSI décrit séparément cette forme et une antibiothérapie prolongée. Une seule injection conçue pour une atteinte muqueuse non compliquée ne peut pas être présumée curative. Le site et la sensibilité doivent guider la durée et l'avis spécialisé.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », Clinique et Traitement de la gonococcémie disséminée, validée le 8 mai 2024</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-oeil" data-title="Atteinte oculaire et nouveau-né : périmètre distinct"><div class="lab">Pourquoi l'urgence diffère</div><p>Une conjonctivite gonococcique peut menacer la cornée et nécessite une évaluation oculaire rapide. Chez le nouveau-né, la FI Labatec ajoute des contre-indications et précautions, dont prématurité, hyperbilirubinémie et association à des solutions intraveineuses contenant du calcium. Les doses, voies et indications des adultes ne se transfèrent donc pas.</p><div class="lab">Application</div><p>Un symptôme oculaire ou une exposition néonatale exige une conduite spécifique, sans attendre que le protocole d'urétrite fasse effet. M. N. ne présente pas de signe oculaire connu dans le cas résumé.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », Clinique, validée le 8 mai 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">FI Ceftriaxon Labatec, juin 2025, contre-indications néonatales</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-alternatives" data-title="Alternatives antibiotiques : culture et contexte d'abord"><div class="lab">Pourquoi éviter un remplacement empirique</div><p>L'OFSP rapporte pour les isolats surveillés en Suisse une résistance aux quinolones de 70 % en 2024 et à l'azithromycine de 21 %. Ces taux ne prouvent pas que la souche de M. N. résiste, mais rendent un choix empirique de ces classes incertain. Une autre céphalosporine, un autre antibiotique ou une association ne se substituent pas automatiquement à la ceftriaxone d'une directive.</p><div class="lab">Conduite</div><p>Si ceftriaxone est impossible ou si un échec est suspecté, la culture, l'antibiogramme, le site et l'avis spécialisé déterminent l'alternative. La FI du produit effectivement choisi doit être lue avant d'en donner la dose ; ce cours ne transforme pas les options de recours en prescriptions interchangeables. La SSI réserve aux allergies sévères et certifiées la gentamicine 240 mg IM avec l'azithromycine 2 g, et la ciprofloxacine 500 mg aux souches sensibles. Les informations professionnelles suisses concordent pour la gentamicine (Gentamicine AApot®, 240 à 280 mg IM en dose unique, août 2024) et la ciprofloxacine (Ciproxine®, 500 mg en dose unique si la résistance est exclue, août 2025). Celle de Zithromax® (mars 2023) n'inclut pas le gonocoque dans les indications : l'azithromycine 2 g est hors indication suisse. Aucune information professionnelle suisse de céfixime ne figure dans l'AIPS du 08.10.2026.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, données ANRESIS 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », validée le 8 mai 2024</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-resistance" data-title="Résistance suisse : 2024, pas l'antibiogramme du patient"><div class="lab">Chiffres datés</div><p>L'OFSP rapporte dans le Bulletin 44/2025, à partir d'ANRESIS, une résistance des gonocoques aux quinolones de <b>70 % en 2024</b> et à l'azithromycine de <b>21 %</b>. Le bulletin évoque aussi une hausse de résistance aux céphalosporines orales et décrit la ceftriaxone comme l'antibiotique de première ligne, avec renvoi aux doses élevées SSI.</p><div class="lab">Interprétation</div><p>Ce sont des mesures de surveillance, datées de 2024. Elles ne sont ni des taux 2026 ni des probabilités individuelles exactes. L'antibiogramme d'un isolat de M. N. reste inconnu ; il faut le demander quand la culture est possible, en particulier avant de conclure à un échec résistant.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025, « La gonorrhée en Suisse et au Liechtenstein en 2024 », section Résistance aux antibiotiques</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-chlamydia" data-title="Co-infection : la ceftriaxone ne clôt pas le bilan IST"><div class="lab">Diagnostic indépendant</div><p>La présence d'un gonocoque n'établit pas celle d'une chlamydiose ; l'absence d'un résultat chlamydia ne la nie pas non plus. Les prélèvements et tests des sites exposés recherchent cette co-infection lorsque le contexte le justifie. La SSI demande également une recherche des autres IST et une vérification de la protection contre l'hépatite B.</p><div class="lab">Conséquence thérapeutique</div><p>La ceftriaxone ciblant la gonococcie ne remplace pas l'évaluation d'un autre agent pathogène. Un antibiotique additionnel n'est pas déduit automatiquement d'une urétrite présumée ; sa nécessité, sa dose et ses contre-indications sont évaluées sur le résultat et le référentiel propre.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », validation 8 mai 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Urétrite chez l'homme », validation 13 juin 2024</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-partenaires" data-title="Partenaires : arbitrer deux fenêtres temporelles SSI"><div class="lab">Cas de M. N. : urétrite masculine</div><p>La page SSI « Urétrite chez l'homme », validée le <b>13 juin 2024</b>, mentionne les partenaires des <b>trois derniers mois</b> pour le gonocoque. Elle correspond à la présentation masculine urétrale suspectée chez M. N. et est la plus récente des deux directives SSI examinées pour cette situation ; ce cours retient donc trois mois pour la recherche de ses partenaires.</p><div class="lab">Directive générale de gonococcie</div><p>La page SSI « Gonococcie », validée le <b>8 mai 2024</b>, demande information, dépistage et traitement des partenaires des <b>deux derniers mois</b>, ainsi que recherche des autres IST, vérification de la protection contre le VHB et déclaration complémentaire au médecin cantonal. Cette recommandation générale reste accessible et l'écart n'est pas présenté comme résolu par la SSI. Les contacts sont abordés avec respect de la confidentialité et du cadre local.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Urétrite chez l'homme », validée le 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », Traitement des partenaires, validée le 8 mai 2024</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-controle" data-title="Contrôle microbiologique : calendrier SSI et calendrier européen"><div class="lab">Consigne suisse</div><p>La SSI « Gonococcie » recommande un contrôle microbiologique <b>sept jours après le traitement</b>. Elle demande une nouvelle culture si les symptômes persistent au-delà de deux jours. Le site initial et le traitement reçu doivent guider les prélèvements de contrôle.</p><div class="lab">Directive européenne</div><p>La directive IUSTI 2020 recommande un contrôle de guérison dans tous les cas : culture trois à sept jours après la fin du traitement si les symptômes persistent, complétée par une PCR une semaine plus tard si la culture est négative ; PCR deux semaines après le traitement chez une personne asymptomatique. La directive suisse, plus récente, s'applique en Suisse : contrôle à J7.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », Traitement, validée le 8 mai 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, suivi et contrôle de guérison</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-ph-echec" data-title="Persistance : réinfection ou échec, pas une seule explication"><div class="lab">Première distinction</div><p>Une nouvelle exposition à un partenaire infecté peut redonner un test positif après un traitement actif. Un site extragénital non recherché, un prélèvement au mauvais moment ou une infection persistante peuvent aussi expliquer le résultat. Les symptômes seuls ne déterminent pas le mécanisme.</p><div class="lab">Preuve utile</div><p>La SSI demande une nouvelle culture si les symptômes persistent au-delà de deux jours. La culture avec antibiogramme, le calendrier des tests, les expositions et les sites servent à rechercher une résistance ; un TAAN isolé ne la prouve pas. La directive européenne IUSTI 2020 rappelle qu'un contrôle positif peut traduire un échec, une réinfection ou, avec la PCR, de l'acide nucléique résiduel.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Gonococcie », validée le 8 mai 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, contrôle de guérison et échecs</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="pareto-a54-ph" data-title="Loi de Pareto — Pharmacologie de l'infection gonococcique"><ol><li>Prélève les sites exposés : le TAAN détecte, la culture fournit l'isolat nécessaire à l'antibiogramme.</li><li>Pour une forme muqueuse simple de l'adulte, la SSI recommande ceftriaxone 1 g IM ; la FI complète Labatec de juin 2025 affiche 0,25 g IM pour la blennorragie. La divergence est réelle et documentée.</li><li>Le flacon Labatec 1 g se prépare pour l'IM selon sa FI avec 3,5 mL de lidocaïne à 1 % ; une solution à la lidocaïne n'est jamais injectée IV. Le produit choisi commande sa préparation.</li><li>Une atteinte disséminée, oculaire, néonatale ou génitale haute nécessite une évaluation et un traitement spécifiques, pas l'injection unique muqueuse.</li><li>Les résistances suisses 70 % aux quinolones et 21 % à l'azithromycine portent sur 2024 ; elles ne sont pas l'antibiogramme de M. N.</li><li>La SSI prévoit un contrôle microbiologique à J7 et une nouvelle culture si les symptômes persistent plus de deux jours ; pour les partenaires de M. N., la page « Urétrite chez l'homme » retient trois mois, contre deux mois dans « Gonococcie ».</li></ol><div class="key">Ces règles s'appliquent dans leur périmètre clinique et documentaire. La source, la date et la notice du médicament réellement délivré restent accessibles dans les fenêtres de ce cours.</div></template>
