<template data-pop="a54-examens" data-title="Loi de Pareto — Examens de l’infection gonococcique">
<div class="lab">Priorités qui changent la décision</div><p>Chez M. N., l’histoire des pratiques sexuelles détermine les sites à prélever. Une PCR détecte le gonocoque au site testé ; une culture préthérapeutique, si elle pousse, rend possible l’antibiogramme. La recherche de co-infections, les signes de complication et le contrôle après traitement complètent le parcours. « Pareto » indique ici une priorité pédagogique, sans pourcentage de rendement inventé.</p>
<div class="lab">Résultats inconnus</div><p>Aucun résultat PCR, culture, sérologie ou antibiogramme n’est fourni. Le rapport oral justifie une discussion du site pharyngé ; le site rectal dépend d’une exposition à préciser. Une date et une personne chargée de relire les résultats doivent être définies.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, sections Diagnostic et Traitement, révisées en 2021, validées le 8 mai 2024</a>, lues le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-anamnese" data-title="Anamnèse sexuelle : le site d’exposition commande le site du test">
<div class="lab">Pourquoi poser les questions</div><p>Le gonocoque infecte plusieurs muqueuses. Une urine peut documenter une infection urétrale, mais ne teste pas le pharynx ou le rectum. La SSI relève que les atteintes pharyngées et rectales sont asymptomatiques dans plus de 90 % des cas ; l’absence de douleur n’est donc pas un critère d’exclusion fiable.</p>
<div class="lab">Application à M. N.</div><p>Le rapport oral rapporté conduit à discuter un écouvillon pharyngé. Les pratiques rectales, la date et le nombre de contacts sont à demander sans les supposer. L’entretien protège aussi la confidentialité et prépare le dépistage ainsi que l’information des partenaires.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, « Important », « Diagnostic » et « Traitement des partenaires »</a>, page validée le 8 mai 2024, lue le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-urines" data-title="Premières urines : prélèvement urétral ciblé">
<div class="lab">Méthode indiquée par la SSI</div><p>Pour l’urétrite masculine, la SSI propose la première fraction d’urines, 5 à 10 mL, pour la PCR. Le premier jet emporte du matériel provenant de l’urètre et sert ainsi la question de l’infection urétrale. Le matériel et les consignes exactes suivent celles du laboratoire qui effectue l’analyse.</p>
<div class="lab">Limite</div><p>Cette urine ne teste pas les autres sites. Un écoulement visible peut être écouvillonné pour une culture avant traitement ; la recherche de sensibilité nécessite un isolat viable. Aucun prélèvement ni résultat de M. N. n’est encore rapporté.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, « Méthodes des prélèvements et de transport »</a>, validée le 8 mai 2024, lue le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-rectum" data-title="Prélèvement rectal : quand le proposer">
<div class="lab">Site à ne pas perdre</div><p>Une exposition anale rapportée motive un prélèvement rectal même sans symptôme, car plus de 90 % des infections rectales sont asymptomatiques selon la SSI. La directive européenne recommande le test rectal et pharyngé de routine chez les HSH, de l’envisager chez les femmes partenaires d’une personne atteinte, et de le guider ailleurs par l’anamnèse, le risque et les symptômes. La PCR est nettement plus sensible que la culture à ce site.</p>
<div class="lab">Limite du cas</div><p>M. N. n’a pas rapporté d’exposition rectale. Le clinicien pose la question et décide du site après la réponse.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, validée le 8 mai 2024</a>, « Important » et « Méthodes des prélèvements » ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, tests, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-transport" data-title="Culture : le transport conditionne le rendement">
<div class="lab">Pourquoi l’envoyer vite</div><p>La culture a besoin d’un gonocoque encore viable. La SSI demande un transport immédiat au laboratoire et mentionne un milieu spécial. Le laboratoire précise les écouvillons compatibles avec ses techniques ; une PCR et une culture ne doivent pas être présumées possibles sur n’importe quel même tube.</p>
<div class="lab">Interprétation</div><p>Un prélèvement mal transporté peut donner une culture négative malgré une PCR positive. Les conditions préanalytiques, le site et un antibiotique déjà administré doivent être communiqués avant d’interpréter cette discordance comme une absence de bactérie. L’antibiogramme n’existe que si un isolat utilisable a été obtenu.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, « Méthodes des prélèvements et de transport »</a>, validée le 8 mai 2024, lue le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-naat" data-title="PCR/TAAN : détecter l’agent sans mesurer la résistance">
<div class="lab">Mécanisme et intérêt</div><p>Un test d’amplification des acides nucléiques recherche une séquence génétique du gonocoque dans l’échantillon. Selon la SSI, il est plus sensible que la culture à tous les sites ; selon la directive européenne, sa sensibilité dépasse 95 % chez les personnes symptomatiques comme asymptomatiques. Sa valeur prédictive positive doit dépasser 90 % ; sinon, un résultat positif est confirmé par un second test visant une autre séquence, surtout au pharynx où d’autres <i>Neisseria</i> commensales peuvent croiser.</p>
<div class="lab">Ce qu’un résultat ne dit pas</div><p>Une PCR positive concerne le site prélevé ; elle ne mesure pas la sensibilité de la souche. Après traitement, elle peut rester positive à cause d’acide nucléique résiduel de gonocoques non viables : un contrôle positif précoce s’interprète donc avec le contexte et, si possible, une culture.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, validée le 8 mai 2024</a>, « Procédure diagnostique » ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, tests et contrôle de guérison, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-culture" data-title="Culture préthérapeutique : obtenir un isolat vivant">
<div class="lab">Pourquoi la demander</div><p>La culture permet de faire pousser et d’identifier le gonocoque, puis d’évaluer la sensibilité de l’isolat aux antibiotiques. La SSI recommande idéalement la culture d’un écoulement pathologique avant le traitement. Devant une présentation typique, elle prévoit de traiter immédiatement après les prélèvements, sans attendre le résultat.</p>
<div class="lab">Rendement et portée</div><p>La culture est moins sensible que la PCR selon la SSI et dépend du transport rapide, de la qualité du prélèvement ainsi que d’une éventuelle antibiothérapie. Une culture négative ne contredit donc pas mécaniquement une PCR positive du même site. Aucun isolat n’est actuellement connu chez M. N.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, « Procédure diagnostique » et « Méthodes des prélèvements »</a>, validée le 8 mai 2024, lue le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-antibiogramme" data-title="Antibiogramme : sensibilité mesurée sur l’isolat">
<div class="lab">Ce qui est mesuré</div><p>Le laboratoire examine la sensibilité d’un gonocoque isolé en culture à des antibiotiques selon une méthode et des seuils de lecture définis. Cette mesure concerne l’isolat obtenu ; elle ne se déduit pas du symptôme ni de la positivité d’une PCR de routine.</p>
<div class="lab">Pourquoi la donnée compte</div><p>La SSI insiste sur la culture avec antibiogramme face à l’évolution des résistances. L’OFSP rapportait pour la Suisse en 2024 des résistances aux quinolones de 70 % et à l’azithromycine de 21 %, publiées dans son Bulletin 44/2025. Ce sont des données de surveillance, non l’antibiogramme de M. N. Une décision individuelle tient compte de la recommandation applicable et du résultat s’il est disponible.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, « Important » et « Diagnostic »</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, « La gonorrhée en Suisse et au Liechtenstein en 2024 », p. 35–36</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-chlamydia" data-title="Chlamydia : co-infection ou autre cause d’urétrite">
<div class="lab">Pourquoi la rechercher</div><p><em>Chlamydia trachomatis</em> peut coexister avec le gonocoque et donner une urétrite ressemblante. La SSI demande de rechercher les autres infections sexuellement transmissibles. Une PCR gonococcique positive ne prouve donc pas qu’aucun autre agent n’est présent.</p>
<div class="lab">Conséquence</div><p>La recherche de chlamydia sur les sites pertinents permet de documenter une co-infection et d’adapter la prise en charge. Le résultat de M. N. est inconnu ; le traitement de chlamydia n’est pas déduit d’un diagnostic présumé de gonococcie dans ce bilan d’examens.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, « Étiologie/Épidémiologie » et « Diagnostic »</a>, validée le 8 mai 2024, lue le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-vih-syphilis" data-title="VIH et syphilis : dépistage associé, calendrier à interpréter">
<div class="lab">Parcours suisse</div><p>La SSI recommande des tests sérologiques de dépistage du VIH et de la syphilis chez une personne évaluée pour une gonococcie. Elle demande aussi de vérifier la protection vaccinale contre le VHB. Ces examens concernent des risques associés à l’exposition, pas un effet causal de la bactérie gonococcique.</p>
<div class="lab">Limite temporelle</div><p>Un test prélevé très tôt après un contact ne clôt pas nécessairement le dépistage d’une infection récemment acquise. La date de l’exposition, les tests antérieurs et la méthode de laboratoire déterminent si un contrôle ultérieur est nécessaire. Aucun statut VIH, syphilis ou VHB n’est connu chez M. N.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, « Important » et « Diagnostic »</a>, validée le 8 mai 2024, lue le 8 octobre 2026. Le délai de répétition dépend du test utilisé ; aucun intervalle universel n’est imposé ici.</p>
</template>
<template data-pop="a54-e-dgi" data-title="Dissémination : une question clinique et microbiologique différente">
<div class="lab">Quand la soupçonner</div><p>La gonococcémie disséminée donne pustules cutanées, ténosynovite et arthrite ; une endocardite ou une méningite sont plus rares. La SSI parle de forme confirmée quand une culture du sang, du liquide synovial ou d’une biopsie cutanée est positive ; une culture anogénitale ou pharyngée positive avec des signes typiques définit une forme probable.</p>
<div class="lab">Conséquence pratique</div><p>La directive européenne recommande une hospitalisation pour le traitement initial, avec culture gonococcique et antibiogramme. M. N. n’a aucun signe de dissémination établi ; l’interrogatoire et l’examen les recherchent.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, validée le 8 mai 2024</a>, « Gonococcémie disséminée » et « Critères diagnostiques » ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, infection disséminée, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-oculaire" data-title="Atteinte oculaire : une localisation à traiter sans délai">
<div class="lab">Pourquoi la séparer</div><p>La directive européenne recommande de tester toute conjonctivite purulente du nouveau-né ou de l’adulte. Elle traite la conjonctivite gonococcique par irrigation fréquente au sérum physiologique stérile et antibiothérapie, et souligne le manque de données cliniques récentes pour cette forme.</p>
<div class="lab">Limite du cas</div><p>Aucun symptôme oculaire n’est rapporté chez M. N. Le médecin demande néanmoins douleur, rougeur, sécrétion ou baisse de vision. Le bilan et le traitement de l’œil ne se déduisent pas d’une PCR urinaire.</p>
<p class="refs"><a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, indications du test et conjonctivite gonococcique ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, validée le 8 mai 2024</a>, « Clinique », lus le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-j7" data-title="Contrôle de guérison : J7 suisse et calendrier européen">
<div class="lab">Recommandation suisse</div><p>La SSI recommande un contrôle microbiologique sept jours après le traitement, en plus de vérifier la réponse clinique. La disparition des symptômes seule ne démontre pas que toutes les localisations sont guéries.</p>
<div class="lab">Comparaison européenne</div><p>La directive IUSTI 2020 recommande aussi un contrôle dans tous les cas : culture trois à sept jours après le traitement si des symptômes persistent, PCR deux semaines après le traitement chez une personne asymptomatique. Elle rappelle qu’une PCR positive peut traduire un échec, une réinfection ou de l’acide nucléique résiduel.</p>
<div class="lab">Arbitrage</div><p>La directive suisse de 2024 est la plus récente et s’applique en Suisse : rendez-vous à J7. Une PCR positive à ce stade est relue avec le laboratoire et confirmée par culture avant de conclure à une résistance.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, validée le 8 mai 2024</a>, « Traitement » ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, suivi et contrôle de guérison, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a54-e-persistance" data-title="Symptômes persistants : culture, résistance et réinfection">
<div class="lab">Réévaluer dès le délai indiqué</div><p>La SSI demande d’avertir la personne qu’une persistance des symptômes au-delà de deux jours après le traitement appelle un nouveau prélèvement urétral ou urinaire pour culture et recherche de résistance, puis un avis spécialisé.</p>
<div class="lab">Éviter la conclusion trop rapide</div><p>La directive « Urétrite chez l’homme » demande de penser d’abord à une réinfection (anamnèse sexuelle, partenaire non traité) avant de retenir une vraie résistance. La directive européenne recommande, devant des symptômes après un traitement recommandé, une culture avec antibiogramme et le signalement des échecs confirmés.</p>
<p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gonococcie, validée le 8 mai 2024</a>, « Traitement » et « Traitement des partenaires » ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », récurrence et persistance</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, tests et échecs thérapeutiques, lus le 8 octobre 2026.</p>
</template>
