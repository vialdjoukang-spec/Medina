<section class="ilot" id="a54-pa-0"><h2><span class="n">0</span>Question clinique : une hypothèse à vérifier</h2>
<p>M. N., 27 ans, consulte pour une dysurie et un écoulement urétral après des rapports vaginaux et oraux sans préservatif cinq jours plus tôt. Une urétrite est possible ; la chronologie est compatible avec l’incubation de <i>Neisseria gonorrhoeae</i>, mais ne permet pas d’identifier l’agent. La couleur et le caractère purulent de l’écoulement ne sont pas précisés. Aucun test, aucune culture ni sensibilité aux antibiotiques ne sont disponibles. Fièvre, douleur testiculaire et douleur articulaire n’ont pas été signalées : elles doivent être recherchées et ne sont pas tenues pour absentes.</p>
<p>La première décision consiste à apprécier la gravité, examiner les sites exposés, prélever pour amplification d’acides nucléiques et, si possible avant l’antibiotique, pour culture avec antibiogramme. Le médecin recherche aussi les autres IST. Les <button class="w" data-k="a54-pa-uretrite">urétrites gonococcique et à chlamydia</button> peuvent se ressembler cliniquement ; seul un résultat adapté établira la cause. Pour une urétrite masculine dont l’état permet d’attendre, la directive SSI la plus récente recommande de traiter selon la bactérie identifiée ; si les symptômes sont sévères, un traitement empirique couvrant les deux agents débute après les prélèvements, puis est ajusté. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », traitement, validée le 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », 8 mai 2024</a>.</p>
<div class="key"><b>À retenir.</b> Les symptômes et l’exposition conduisent au bilan ; ils ne prouvent ni A54 ni une sensibilité antibiotique. La gravité et le résultat microbiologique font changer la décision.</div></section>

<section class="ilot" id="a54-pa-1"><h2><span class="n">1</span>Définition et codage : préciser le site documenté</h2>
<p>La gonococcie est l’infection par <i>N. gonorrhoeae</i>. La <button class="w" data-k="a54-pa-codage">CIM-10-GM 2024</button> classe sous A54 les formes urogénitales basses et hautes, oculaires, musculosquelettiques, pharyngées, anorectales et autres. Le tableau reprend les <b>neuf</b> subdivisions de cette version ; leurs intitulés indiquent le site ou la manifestation, sans remplacer la preuve clinique. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A54" target="_blank" rel="noopener" data-reference-source="1">BfArM, ICD-10-GM 2024, A54</a>.</p>
<div class="table-wrap"><table><thead><tr><th>Code</th><th>Localisation ou forme classée</th><th>Point à établir</th></tr></thead><tbody>
<tr><td>A54.0</td><td>Tractus urogénital inférieur, sans abcès périurétral ni des glandes urétrales</td><td>Gonocoque et site inférieur documentés.</td></tr>
<tr><td>A54.1</td><td>Tractus urogénital inférieur avec un tel abcès</td><td>Abcès documenté ; la glande de Bartholin est incluse.</td></tr>
<tr><td>A54.2</td><td>Pelvipéritonite et autres organes urogénitaux</td><td>Atteinte haute ou organe associé établi.</td></tr>
<tr><td>A54.3</td><td>Œil, y compris ophtalmie du nouveau-né</td><td>Atteinte oculaire spécifique établie.</td></tr>
<tr><td>A54.4†</td><td>Système musculosquelettique</td><td>Atteinte ostéoarticulaire ; signe † et code de manifestation * selon le catalogue.</td></tr>
<tr><td>A54.5</td><td>Pharynx</td><td>Infection pharyngée documentée.</td></tr>
<tr><td>A54.6</td><td>Anus et rectum</td><td>Infection anorectale documentée.</td></tr>
<tr><td>A54.8</td><td>Autres infections gonococciques, dont certaines formes invasives</td><td>Manifestation précisée, sans forcer un autre sous-code.</td></tr>
<tr><td>A54.9</td><td>Infection gonococcique sans précision</td><td>Agent établi, site non précisé.</td></tr>
</tbody></table></div>
<p>Les catégories candidates de la <button class="w" data-k="a54-pa-cim11">CIM-11</button> distinguent notamment infection génito-urinaire (1A70), pelvipéritonite (1A71), autres sites (1A72), dissémination (1A73) et infection sans précision (1A7Z). Il n’existe pas ici de conversion automatique code pour code. Chez M. N., aucun code A54 confirmé ne découle de la seule histoire ; le site urétral suspecté ne justifie pas encore A54.0. <a href="https://icd.who.int/browse/2026-01/mms/fr#609214049" target="_blank" rel="noopener" data-reference-source="1">OMS, CIM-11 MMS, version 2026-01, bloc « Infection gonococcique »</a>.</p>
<button class="pareto-btn ui" data-k="a54-pa-pareto-codage">▲ Loi de Pareto — Le code suit la preuve</button>
</section>

<section class="ilot" id="a54-pa-2"><h2><span class="n">2</span>Transmission et sites : interroger sans présumer</h2>
<p>Le gonocoque se transmet lors de contacts sexuels exposant des muqueuses génitales, rectales ou pharyngées. La localisation du prélèvement suit les pratiques et les sites exposés, pas l’identité présumée du patient. Un rapport oral peut exposer le pharynx ; un rapport vaginal expose les sites génitaux ; une exposition rectale doit être demandée sans la supposer. La SSI précise que les infections <button class="w" data-k="a54-pa-silencieuses">pharyngées et rectales sont souvent asymptomatiques</button>, de sorte qu’une absence de douleur locale ne les exclut pas. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, étiologie, clinique et diagnostic</a>.</p>
<p>Un résultat positif sur un site ne prouve pas l’infection d’un autre site. Une <button class="w" data-k="a54-pa-coinfection">coinfection à <i>Chlamydia trachomatis</i></button> est possible et l’urétrite peut lui ressembler. Les informations recueillies servent à proposer des tests anatomiquement adaptés et une discussion sans jugement sur la protection, les partenaires et les autres IST. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique et diagnostic</a>.</p></section>

<section class="ilot" id="a54-pa-3"><h2><span class="n">3</span>Manifestations : séparer mucosite et maladie invasive</h2>
<p>Une urétrite gonococcique peut provoquer brûlures mictionnelles et écoulement purulent. Une cervicite peut rester discrète ; une proctite ou une pharyngite peut aussi ne donner aucun symptôme. L’infection peut monter vers l’épididyme ou les organes pelviens et causer inflammation, douleur et, pour la maladie inflammatoire pelvienne, risque ultérieur d’infertilité. Une douleur testiculaire ou pelvienne change donc le niveau d’évaluation. La <button class="w" data-k="a54-pa-complications">localisation et la complication</button> doivent être vérifiées avant de choisir le cadre thérapeutique. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique</a>.</p>
<p>La <button class="w" data-k="a54-pa-dgi">gonococcie disséminée</button> peut associer fièvre, lésions cutanées, ténosynovite ou arthrite ; une articulation chaude et douloureuse impose une évaluation urgente. Méningite et endocardite sont rares mais graves. L’atteinte oculaire, en particulier une conjonctivite purulente, requiert une prise en charge rapide pour protéger la vision ; les formes néonatales suivent un parcours distinct. Aucun de ces tableaux n’est documenté chez M. N. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique, gonococcémie disséminée</a>.</p>
<button class="pareto-btn ui" data-k="a54-pa-pareto-gravite">▲ Loi de Pareto — Les signes qui changent l’urgence</button></section>

<section class="ilot" id="a54-pa-4"><h2><span class="n">4</span>Évaluation initiale : chercher le site et la gravité</h2>
<p>Le clinicien précise le début des symptômes, l’aspect de l’écoulement, les sites et dates des expositions, les partenaires à informer, les traitements déjà pris, les allergies et une éventuelle grossesse chez la personne examinée. Il demande fièvre, douleur scrotale ou pelvienne, douleur ou gonflement articulaire, lésions cutanées et symptômes oculaires ; il mesure les constantes si l’état le justifie. L’examen porte sur l’urètre et les autres sites indiqués par l’histoire et les symptômes, dans le respect du consentement. <button class="w" data-k="a54-pa-triage">Triage des signes de gravité</button> explique les conséquences. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique et diagnostic</a>.</p>
<p>Chez M. N., les rapports et symptômes justifient un prélèvement urinaire de premier jet et la discussion d’un prélèvement pharyngé selon le détail du rapport oral. La fièvre et les douleurs testiculaire ou articulaire doivent encore être demandées ; leur non-mention ne vaut pas examen normal. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, méthodes de prélèvement et clinique</a>.</p></section>

<section class="ilot" id="a54-pa-5"><h2><span class="n">5</span>Confirmer l’agent et documenter sa sensibilité</h2>
<p>La <button class="w" data-k="a54-pa-pcr">PCR ou amplification d’acides nucléiques</button> est sensible et recherche le gonocoque sur les sites exposés, mais ne donne généralement pas à elle seule un antibiogramme. La SSI recommande, dans l’idéal, une <button class="w" data-k="a54-pa-culture">culture avant l’antibiotique</button> de l’écoulement pathologique pour identifier le germe et mesurer sa sensibilité. Le transport rapide et le milieu adapté conditionnent la viabilité : une culture négative après mauvais transport ou antibiotique n’invalide pas automatiquement une PCR positive. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et prélèvements</a>.</p>
<p>Le bilan recherche aussi <i>C. trachomatis</i>, le VIH, la syphilis et le statut VHB selon la recommandation suisse. Un résultat positif demande une interprétation par site, un examen des partenaires et les obligations de déclaration en Suisse ; il ne permet toujours pas d’inférer la sensibilité aux quinolones. <button class="w" data-k="a54-pa-resistance">Pourquoi conserver la culture</button> situe les résistances suisses de 2024. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et aspects généraux</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, gonorrhée en 2024</a>.</p></section>

<section class="ilot" id="a54-pa-6"><h2><span class="n">6</span>Décider du traitement selon le tableau confirmé ou très évocateur</h2>
<p>Pour une gonococcie muqueuse non compliquée <b>identifiée</b> chez l’adulte, la directive SSI « Gonococcie » recommande la <button class="w" data-k="a54-pa-ceftriaxone">ceftriaxone 1 g intramusculaire</button>, avec voie intraveineuse possible. Pour l’<b>urétrite encore non attribuée</b> de M. N., la directive SSI « Urétrite chez l’homme », validée plus tard, conseille d’attendre les résultats si l’état le permet ; si les symptômes sont sévères, elle prévoit après prélèvements un traitement empirique couvrant <i>N. gonorrhoeae</i> et <i>C. trachomatis</i>, puis son adaptation. L’écoulement non qualifié du cas ne permet pas de conclure à cette sévérité. Le traitement d’une forme disséminée, oculaire ou pelvienne ne se déduit pas du schéma muqueux. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, urétrite masculine, 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, gonococcie, 8 mai 2024</a>.</p>
<p>La sensibilité locale importe : l’OFSP rapporte pour <b>2024</b> une résistance aux quinolones de <b>70 %</b> et à l’azithromycine de <b>21 %</b> dans les données suisses ANRESIS. Ces chiffres ne sont ni une mesure de 2026 ni l’antibiogramme du patient. Une <button class="w" data-k="a54-pa-autres-antibiotiques">alternative en cas d’allergie sévère ou de sensibilité connue</button> exige des conditions précises et un avis approprié ; la fluoroquinolone empirique serait particulièrement mal fondée. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, p. « Résistance aux antibiotiques »</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, alternatives</a>.</p>
<button class="pareto-btn ui" data-k="a54-pa-pareto-decision">▲ Loi de Pareto — Prélever, classer, traiter</button></section>

<section class="ilot" id="a54-pa-7"><h2><span class="n">7</span>Contrôler la réponse et reconnaître un échec</h2>
<p>La SSI recommande un <button class="w" data-k="a54-pa-controle">contrôle microbiologique sept jours après le traitement</button>. Si les symptômes persistent plus de deux jours, un nouveau prélèvement urétral ou urinaire pour culture et recherche de résistance est demandé ; l’adhésion, une nouvelle exposition et une autre infection sont également réévaluées. Le contrôle ne remplace pas le prélèvement initial quand celui-ci était possible. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, traitement et suivi</a>.</p>
<p>Les formes compliquées ou disséminées réclament un suivi adapté au foyer et à la réponse, avec avis spécialisé. Une arthrite purulente ou une conjonctivite sévère ne relève pas d’une simple observation à domicile après la dose du schéma muqueux. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, gonococcémie disséminée et clinique</a>.</p></section>

<section class="ilot" id="a54-pa-8"><h2><span class="n">8</span>Partenaires, prévention et santé publique</h2>
<p>Pour l’urétrite masculine de M. N., la directive SSI du 13 juin 2024 prévoit l’<button class="w" data-k="a54-pa-partenaires">information, le dépistage et la prise en charge des partenaires des trois mois précédents</button> si un gonocoque est identifié ; elle recommande d’éviter les relations avec des partenaires non traités. La directive « Gonococcie » du 8 mai 2024 retient deux mois et une semaine sans rapports après le début du traitement, y compris oraux. La fenêtre explique cet écart de périmètre et de date. La notification doit être confidentielle et praticable ; l’OMS 2024 traite les services aux partenaires comme une intervention de santé publique, sans permettre d’identifier la source à partir du seul récit d’un cas. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, urétrite masculine, 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, gonococcie, 8 mai 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240090767" target="_blank" rel="noopener" data-reference-source="1">OMS, services aux partenaires, 17 juillet 2024</a>.</p>
<p>Discuter préservatifs selon les pratiques, dépistage ultérieur selon le risque, recherche des autres IST et protection vaccinale VHB réduit les transmissions évitables. La vaccination VHB ne protège pas du gonocoque et une guérison de gonococcie ne confère pas une protection fiable contre une nouvelle exposition. En cas de gonocoque confirmé chez M. N., le laboratoire annonce le résultat à l’OFSP et le praticien ayant prescrit le test envoie le formulaire clinique complémentaire au médecin cantonal. La <button class="w" data-k="a54-pa-declaration">déclaration en Suisse</button> explique pourquoi ce devoir du praticien est retenu malgré une formulation différente dans l’autre directive SSI. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », « Notification à l’OFSP », 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », « Diagnostic », 8 mai 2024</a>.</p></section>

<section class="ilot" id="a54-pa-9"><h2><span class="n">9</span>Limites des sources et décision pour M. N.</h2>
<p>Le catalogue BfArM est la version CIM-10-GM employée pour ce cours, non une règle de facturation suisse ni une table de conversion en CIM-11. La directive SSI « Gonococcie » a été révisée en 2021 puis validée le <b>8 mai 2024</b> ; la directive « Urétrite chez l’homme » a été validée le <b>13 juin 2024</b>. Les chiffres OFSP publiés en 2025 décrivent l’année <b>2024</b>. Avant prescription, le produit réellement disponible, sa préparation, ses contre-indications et l’information professionnelle suisse sont vérifiés séparément. La fenêtre <button class="w" data-k="a54-pa-sources">périmètre des sources</button> distingue ces rôles.</p>
<div class="key"><b>Pour M. N.</b> Vérifier les signes de gravité et l’aspect de l’écoulement ; prélever l’urine de premier jet et les sites exposés pertinents pour PCR, plus une culture avant antibiotique si possible ; rechercher chlamydia et les autres IST indiquées. Si l’état le permet, attendre les résultats pour cibler le traitement. Si les symptômes sont sévères, traiter après prélèvements selon le schéma empirique SSI couvrant gonocoque et chlamydia, puis adapter. Aucun sous-code A54 ni antibiogramme ne sont encore acquis.</div></section>
