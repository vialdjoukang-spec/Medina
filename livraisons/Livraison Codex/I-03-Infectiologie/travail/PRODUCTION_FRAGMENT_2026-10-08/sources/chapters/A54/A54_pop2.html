<template data-pop="a54-sc-diplocoque" data-title="Gonocoque : forme microscopique et site d’infection">
  <div class="lab">Identité</div><p><i>Neisseria gonorrhoeae</i> est une bactérie Gram négatif dont les cellules sont souvent observées par paires, d’où le mot « diplocoque ». Dans un écoulement urétral purulent, la microscopie peut montrer des diplocoques intracellulaires, mais sa performance varie avec le site, le prélèvement et l’expérience de lecture.</p>
  <div class="lab">Conséquence et limite</div><p>Une morphologie compatible oriente rapidement l’enquête ; elle ne donne ni la sensibilité aux antibiotiques ni le résultat des sites non prélevés. Chez M. N., aucun examen microscopique n’a été réalisé ou fourni.</p>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, Gonococcie, clinique et diagnostic, validée le 08.05.2024</a>, consultée le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-culture" data-title="Culture avant traitement : obtenir un isolat vivant">
  <div class="lab">Question biologique</div><p>Une culture qui pousse permet d’identifier le gonocoque vivant puis de mesurer sa sensibilité aux antibiotiques sur cet isolat. Le prélèvement est idéalement réalisé avant l’antibiotique : celui-ci peut réduire la croissance en culture. Le transport rapide et le milieu du laboratoire comptent pour ce microorganisme exigeant.</p>
  <div class="lab">Limite</div><p>Une culture négative n’exclut pas seule l’infection si le prélèvement, le transport ou un traitement préalable ont réduit sa sensibilité. Le TAAN est plus sensible pour détecter une infection, mais il ne fournit pas l’antibiogramme phénotypique. Une culture urétrale ne renseigne pas le pharynx.</p>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, Gonococcie, méthodes de prélèvement et transport</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener">ECDC 2026, culture et surveillance de la résistance</a>. Consultés le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-pili" data-title="Pili de type IV : l’adhésion initiale varie selon la surface">
  <div class="lab">Mécanisme</div><p>Les pili de type IV sont des filaments de surface qui participent à l’attachement du gonocoque et à la formation de groupes bactériens. Dans un modèle d’épithélium cornéen humain, des dérivés d’une même souche différant par leurs pili se fixaient différemment aux cellules. L’expérience démontre un rôle de ces structures dans ce modèle, pas un taux de transmission chez M. N.</p>
  <div class="lab">Conséquence</div><p>L’attachement rend possible une interaction prolongée avec l’épithélium ; il n’établit pas à lui seul une infection durable. Le choix du prélèvement clinique reste fondé sur les sites exposés et les recommandations, pas sur la visualisation des pili.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/42138646/" target="_blank" rel="noopener">étude primaire sur modèle cornéen, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, diagnostic par site</a>. Résumés et directive consultés le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-opa" data-title="Opa : interaction variable avec les récepteurs de l’hôte">
  <div class="lab">Interface</div><p>Certaines protéines Opa de la membrane gonococcique interagissent avec des CEACAM humains. Leur expression peut varier : deux isolats proches ne présentent pas nécessairement la même surface ni la même interaction épithéliale.</p>
  <div class="lab">Ce que montrent les études</div><p>Dans cinq paires d’isolats recueillis au site génital et dans le sang de patients avec gonococcémie, les isolats sanguins recrutaient moins les CEACAM dans le modèle et traversaient plus facilement une monocouche épithéliale. À l’inverse, certaines protéines Opa liées à CEACAM3 accroissaient la capture et la destruction par des neutrophiles humains en laboratoire : « Opa » ne signifie pas toujours avantage pour la bactérie. Ces expériences ne prévoient pas le risque de dissémination de M. N.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/35215160/" target="_blank" rel="noopener">étude primaire d’isolats appariés, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35343795/" target="_blank" rel="noopener">étude primaire Opa–CEACAM et neutrophiles, 2022</a>. Résumés détaillés consultés le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-variation" data-title="Variation de PilE et d’Opa : pourquoi l’exposition passée ne suffit pas">
  <div class="lab">Deux voies</div><p>La variation antigénique de la piline PilE change la séquence d’une structure reconnue par l’immunité, notamment par recombinaison entre régions génétiques. La variation de phase peut activer ou éteindre l’expression de protéines Opa. Ces mécanismes donnent des profils de surface différents au cours des générations bactériennes.</p>
  <div class="lab">Portée clinique</div><p>Cette plasticité contribue à l’échappement immunitaire ; elle n’est ni la seule cause des réinfections ni une preuve que toute réponse anticorps est inefficace. Une nouvelle exposition, des partenaires non traités et les sites infectés restent déterminants. Aucun génotype de M. N. n’est connu.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/32078293/" target="_blank" rel="noopener">étude primaire de la variation de PilE, 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35343795/" target="_blank" rel="noopener">étude primaire de l’expression variable d’Opa, 2022</a>. Résumés consultés le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-neutrophiles" data-title="Neutrophiles : défense et écoulement purulent">
  <div class="lab">Réponse</div><p>Les signaux de l’épithélium stimulé par le gonocoque attirent des neutrophiles dans la muqueuse. Ces cellules contribuent à contenir l’infection ; leur accumulation, avec des cellules lésées et du mucus, participe à l’écoulement purulent. Le mécanisme relie l’infection possible au symptôme, sans lui être spécifique.</p>
  <div class="lab">Limite diagnostique</div><p>Une urétrite à chlamydia ou une autre cause peut produire inflammation et symptômes proches. À l’inverse, les sites pharyngé et rectal peuvent porter le gonocoque sans douleur ni écoulement. Chez M. N., l’agent doit encore être identifié.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/15489357/" target="_blank" rel="noopener">synthèse mécanistique des études sur épithélium et recrutement neutrophile, 2004</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, clinique et diagnostic</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-reinfection" data-title="Nouvelle positivité : distinguer réinfection, persistance et prélèvement">
  <div class="lab">Questions successives</div><p>Après un traitement, une nouvelle positivité peut suivre une nouvelle exposition à un partenaire non traité, un échec microbiologique ou un test moléculaire réalisé trop tôt, dont la détection ne prouve pas toujours la présence de bactéries viables. Les symptômes, la chronologie, les partenaires, le site et la méthode doivent être revus.</p>
  <div class="lab">Action utile</div><p>La SSI demande une nouvelle culture pour rechercher une résistance si les symptômes persistent plus de deux jours et recommande un contrôle microbiologique à sept jours. La culture et l’antibiogramme documentent un échec suspect ; le seul aspect clinique ne départage pas ces causes. Aucun traitement ni résultat de suivi n’existe encore pour M. N.</p>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, Gonococcie, traitement, contrôle et partenaires, validée le 08.05.2024</a> ; <a href="https://www.ncbi.nlm.nih.gov/books/NBK605896/" target="_blank" rel="noopener">OMS 2024, prise en compte des échecs et réinfections</a>. Consultées le 08.10.2026. Le calendrier précis du contrôle dépend de la recommandation applicable et de l’interprétation du laboratoire.</p>
</template>
<template data-pop="a54-sc-dgi" data-title="Gonococcémie disséminée : un autre compartiment, un autre bilan">
  <div class="lab">Mécanisme et signes</div><p>Une partie des infections franchit la barrière muqueuse et se dissémine par le sang. Dermatite, ténosynovite et arthrite forment un tableau évocateur ; une arthrite purulente, plus rarement une endocardite ou une méningite, exige une évaluation urgente. Le sang et le liquide articulaire sont d’autres compartiments que l’urètre.</p>
  <div class="lab">Preuve et limite</div><p>Selon la SSI, une culture d’un site normalement stérile peut confirmer la dissémination. Des cultures négatives n’éliminent pas toutes les formes ; contexte, signes et prélèvements muqueux sont interprétés ensemble. Un TAAN urinaire positif ne démontre pas le passage dans le sang, et l’écoulement seul de M. N. ne démontre aucune DGI.</p>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, Gonococcie, clinique et critères de DGI</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35215160/" target="_blank" rel="noopener">étude primaire d’isolats locaux et sanguins, 2022</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-gyra" data-title="gyrA : marqueur fréquent de résistance aux quinolones">
  <div class="lab">Cible</div><p>La gyrase aide à gérer la torsion de l’ADN pendant sa réplication. Les fluoroquinolones bloquent cette fonction ; certaines substitutions de GyrA réduisent leur liaison et favorisent la résistance. D’autres déterminants, notamment de topoisomérase IV, peuvent s’ajouter.</p>
  <div class="lab">Interprétation</div><p>Un test moléculaire dédié peut rechercher une mutation définie, mais sa performance dépend des variants retenus et de la population. Une étude d’évaluation de 2026 a relevé un faux négatif de marqueur de ciprofloxacine lié à une substitution GyrA non ciblée par l’essai. Aucun test de résistance de M. N. n’est disponible.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/41786583/" target="_blank" rel="noopener">évaluation primaire d’un test moléculaire et de cultures appariées, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27638945/" target="_blank" rel="noopener">étude génomique de 1 102 isolats, 2016</a>. Résumés consultés le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-23s" data-title="ARN ribosomique 23S : une des voies de résistance à l’azithromycine">
  <div class="lab">Cible</div><p>L’azithromycine interfère avec la traduction bactérienne sur la sous-unité 50S. Certaines substitutions de l’ARNr 23S changent l’interaction avec le médicament. L’efflux, la perméabilité et d’autres variants peuvent également modifier la sensibilité.</p>
  <div class="lab">Limite d’un seul marqueur</div><p>Une étude diagnostique rétrospective a trouvé des cas où un marqueur 23S était détecté alors que l’isolat restait sensible selon la concentration inhibitrice mesurée. Une vaste analyse génomique de 2026 décrit aussi des interactions entre plusieurs déterminants. Un marqueur isolé n’est donc pas un antibiogramme complet.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/41786583/" target="_blank" rel="noopener">étude primaire de test moléculaire et phénotype, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41828482/" target="_blank" rel="noopener">étude génomique de 14 727 isolats, 2026</a>. Résumés consultés le 08.10.2026 ; échantillons et performances ne sont pas ceux de M. N.</p>
</template>
<template data-pop="a54-sc-pena" data-title="penA mosaïque : PBP2 et sensibilité aux céphalosporines">
  <div class="lab">Cible</div><p><i>penA</i> code une protéine de liaison aux pénicillines, PBP2, ciblée par les céphalosporines. Certaines séquences mosaïques de <i>penA</i>, issues de recombinaisons, changent cette cible et diminuent la sensibilité. D’autres déterminants bactériens modulent le phénotype.</p>
  <div class="lab">Portée</div><p>L’ECDC a identifié en 2026 des variants mosaïques <i>penA</i> parmi les souches européennes résistantes à la ceftriaxone. Une étude historique américaine associait fortement un allèle mosaïque à la diminution de sensibilité, mais relevait aussi des voies alternatives. La présence ou l’absence d’un seul variant ne suffit pas à certifier la sensibilité d’un isolat suisse inconnu.</p>
  <p class="refs"><a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener">ECDC, évaluation du 16.07.2026, caractérisation moléculaire</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27638945/" target="_blank" rel="noopener">étude primaire génomique et phénotypique, 2016</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-taan" data-title="TAAN : détecter l’acide nucléique, sans antibiogramme complet">
  <div class="lab">Résultat</div><p>Le test d’amplification des acides nucléiques, ou TAAN/PCR, recherche une cible génétique gonococcique dans le prélèvement. Il est sensible, notamment quand la culture perd en rendement, et son résultat concerne le site échantillonné. Une cible détectée ne mesure pas la viabilité bactérienne après traitement.</p>
  <div class="lab">Ce qu’il manque</div><p>Le TAAN diagnostique ordinaire ne fournit pas la concentration minimale inhibitrice d’un isolat. Certains essais spécifiques recherchent des variants de résistance, avec des limites propres à leurs marqueurs. Culture et antibiogramme restent nécessaires pour caractériser un échec ou contribuer à la surveillance ; un TAAN urinaire ne teste pas le pharynx.</p>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, diagnostic, culture et PCR</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41786583/" target="_blank" rel="noopener">évaluation primaire d’un essai moléculaire ciblé, 2026</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener">ECDC, surveillance 2026</a>. Consultés le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-ofsp-annee" data-title="OFSP : des résistances suisses mesurées en 2024, publiées en 2025">
  <div class="lab">Donnée datée</div><p>Le Bulletin OFSP 44/2025 rapporte les données ANRESIS de 2024 : 70 % de résistance aux quinolones et 21 % à l’azithromycine parmi les données citées pour <i>N. gonorrhoeae</i>. L’OFSP signale aussi une résistance croissante aux céphalosporines orales et recommande de se référer à la SSI pour la ceftriaxone.</p>
  <div class="lab">Limite</div><p>Le bulletin ne mesure pas la résistance suisse de 2026 et ne constitue pas l’antibiogramme de M. N. Les données européennes ECDC de 2026 décrivent d’autres pays et un autre dispositif de surveillance. Leur alerte motive la vigilance sans transposer numériquement leurs taux à la Suisse.</p>
  <p class="refs"><a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener">OFSP, Bulletin 44/2025, « La gonorrhée en Suisse et au Liechtenstein en 2024 », p. 35–36</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener">ECDC, évaluation du 16.07.2026</a>. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a54-sc-pareto" data-title="Pareto — Sciences fondamentales de A54, infection gonococcique">
  <p>Quelques relations causales organisent le bilan et évitent de confondre site, symptôme et résistance.</p>
  <ul><li>Le gonocoque atteint une muqueuse exposée : urine, pharynx, rectum et col utérin répondent à des prélèvements distincts.</li><li>Pili et Opa favorisent l’interaction avec l’épithélium ; leur variation contribue à l’échappement immunitaire et aux réinfections possibles.</li><li>Les neutrophiles participent au pus, mais un écoulement ne nomme ni l’agent ni sa sensibilité.</li><li>Une atteinte ascendante ou disséminée change les sites à explorer et les décisions ; elle ne se déduit pas d’un résultat urinaire isolé.</li><li>Le TAAN détecte l’acide nucléique ; la culture fournit l’isolat nécessaire à un antibiogramme phénotypique.</li><li>Les pourcentages OFSP concernent la Suisse de 2024, publiée en 2025, et ne décrivent ni 2026 ni M. N.</li></ul>
  <div class="key"><b>Application.</b> Chez M. N., seuls les symptômes urétraux et les rapports vaginaux et oraux sont connus. Il faut encore établir l’agent, les sites infectés et, si la culture est obtenue, la sensibilité de l’isolat.</div>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener">SSI, Gonococcie, validée le 08.05.2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener">OFSP, Bulletin 44/2025</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener">ECDC, évaluation du 16.07.2026</a>. Consultés le 08.10.2026.</p>
</template>
