<template data-pop="a41-perfusion" data-title="Perfusion tissulaire : débit, transport et extraction de l’oxygène"><div class="lab">Définition</div><p>La perfusion assure l’apport d’oxygène et de nutriments aux tissus. Elle dépend du débit sanguin, de son homogénéité microvasculaire et de la capacité des cellules à extraire l’oxygène. La pression artérielle est un indicateur utile, sans refléter à elle seule la perfusion des organes.</p><div class="lab">Mécanisme normal</div><p>Le sang transporte l’oxygène surtout lié à l’hémoglobine. La quantité d’oxygène livrée chaque minute dépend donc du débit cardiaque, de la concentration d’hémoglobine et de sa saturation. Au repos, les tissus n’extraient qu’une partie de l’oxygène reçu ; lorsque l’apport baisse, ils en extraient davantage. Quand cette réserve est épuisée, la cellule produit son énergie sans oxygène, et le lactate s’élève.</p><div class="lab">Ce que le sepsis change</div><p>Dans le sepsis, trois anomalies s’additionnent. La pression de perfusion baisse par vasoplégie. Le débit devient hétérogène d’un capillaire à l’autre. Les mitochondries utilisent moins bien l’oxygène qui leur parvient. Un organe peut donc manquer d’oxygène alors que le débit cardiaque est normal ou élevé.</p><div class="lab">Mesure au lit</div><p>Aucun instrument simple ne mesure directement la perfusion d’un organe. Le médecin l’apprécie par des signes indirects : la conscience, la diurèse, le temps de recoloration capillaire, les marbrures, la température des extrémités et l’évolution du lactate.</p><div class="lab">Piège</div><p>Une pression moyenne revenue à 65 mmHg ne prouve pas une perfusion suffisante. Si la confusion et l’oligurie persistent, le médecin réévalue le débit, la volémie, l’oxygénation et les diagnostics concurrents.</p><div class="lab">Conséquence pratique</div><p>Le traitement du choc vise la perfusion, et non un chiffre de pression isolé. Chaque réévaluation combine plusieurs signes, parce qu’aucun ne suffit seul.</p></template>
<template data-pop="a41-lactate" data-title="Lactate : production, clairance, limites"><div class="lab">Définition</div><p>Le lactate est produit lors de la glycolyse, à partir du pyruvate, par la lactate déshydrogénase. Il est éliminé en partie par le foie. Chez l’adulte sans pathologie, le lactate plasmatique usuel se situe entre 0,5 et 1,5 mmol/L, et l’hyperlactatémie commence au-delà de 2,0 mmol/L (Centre hospitalier universitaire vaudois, 2022).</p><div class="lab">Mécanisme de l’élévation</div><p>Une concentration élevée peut témoigner d’une hypoperfusion, mais aussi d’une stimulation adrénergique ou d’une diminution de clairance ; aucune valeur seule ne diagnostique le sepsis. Selon le groupe de travail Sepsis-3, quatre mécanismes contribuent : un apport tissulaire d’oxygène insuffisant, une respiration mitochondriale altérée, une glycolyse aérobie accélérée et une élimination hépatique réduite. L’adrénaline, sécrétée ou administrée, accélère la glycolyse et peut donc élever le lactate sans hypoperfusion.</p><div class="lab">Valeur</div><p>Le lactate est un marqueur de gravité. Dans les données de Sepsis-3, un lactate supérieur à 2 mmol/L associé à une hypotension nécessitant un vasopresseur s’accompagnait d’une mortalité hospitalière ajustée de 42,3 %. Dans les critères de choc Sepsis-3, un lactate supérieur à 2 mmol/L doit être associé à un besoin de vasopresseur pour maintenir la pression moyenne à 65 mmHg ou plus, malgré un remplissage adéquat.</p><div class="lab">Mode d’emploi</div><p>La Surviving Sepsis Campaign 2026 suggère de mesurer le lactate en cas de sepsis possible, probable ou certain (recommandation conditionnelle, certitude faible). Elle suggère ensuite des mesures répétées en cas de sepsis avec lactate élevé ou de choc septique, pour guider la réanimation. Cette recommandation est conditionnelle, avec une certitude faible. Dans le suivi, le médecin regarde la tendance plutôt qu’une valeur isolée.</p><div class="lab">Piège</div><p>Le médecin évite une poursuite automatique des fluides jusqu’à normalisation : la recommandation demande d’individualiser les apports après le premier remplissage, selon la décroissance du lactate. Un lactate élevé sous adrénaline ou chez un patient cirrhotique ne signifie pas forcément une hypoperfusion.</p><div class="lab">Conséquence pratique</div><p>Un lactate élevé déclenche une recherche d’hypoperfusion et une nouvelle mesure. Il ne remplace ni l’examen clinique ni la recherche du foyer.</p><div class="lab" data-reference-scope="a41-lactate">Textes de référence et périmètre</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-8" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, énoncé 8 : mesure du lactate</a></li><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-51" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, énoncé 51 et remarque : suivi et individualisation des fluides</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4968574/" target="_blank" rel="noopener" data-reference-source="1">Sepsis-3, Singer et coll., 2016 : définition et SOFA d’origine</a></li></ul></template>
<template data-pop="a41-sofa" data-title="Score SOFA : six fonctions"><div class="lab">Définition</div><p>Le score SOFA quantifie six fonctions : respiration (oxygénation), coagulation (plaquettes), foie (bilirubine), circulation (pression et vasopresseurs), système nerveux central (état de conscience) et rein (créatinine ou diurèse). Chaque fonction reçoit de 0 à 4 points, pour un total de 0 à 24. Une augmentation aiguë d’au moins deux points attribuable à une infection représente opérationnellement la défaillance de Sepsis-3 ; le score de base est présumé nul en l’absence de dysfonction d’organe préexistante connue.</p><div class="lab">Mode d’emploi</div><p>Les seuils du score d’origine permettent de quantifier chaque fonction et de comparer l’état actuel à l’état antérieur. Le médecin retient, pour chaque organe, le niveau le plus élevé atteint. Une valeur meilleure que le seuil de 1 point vaut 0 point.</p><table class="t"><tr><th>Fonction</th><th>1 point</th><th>2 points</th><th>3 points</th><th>4 points</th></tr><tr><td>Respiration : PaO₂/FiO₂</td><td>Moins de 400 mmHg (53,3 kPa)</td><td>Moins de 300 mmHg (40 kPa)</td><td>Moins de 200 mmHg (26,7 kPa) avec assistance respiratoire</td><td>Moins de 100 mmHg (13,3 kPa) avec assistance respiratoire</td></tr><tr><td>Coagulation : plaquettes</td><td>Moins de 150 × 10⁹/L</td><td>Moins de 100 × 10⁹/L</td><td>Moins de 50 × 10⁹/L</td><td>Moins de 20 × 10⁹/L</td></tr><tr><td>Foie : bilirubine</td><td>20 à 32 µmol/L</td><td>33 à 101 µmol/L</td><td>102 à 204 µmol/L</td><td>Plus de 204 µmol/L</td></tr><tr><td>Circulation (doses en µg/kg/min pendant au moins une heure)</td><td>Pression artérielle moyenne inférieure à 70 mmHg</td><td>Dopamine inférieure à 5, ou dobutamine à toute dose</td><td>Dopamine de 5,1 à 15, ou adrénaline ou noradrénaline d’au plus 0,1</td><td>Dopamine supérieure à 15, ou adrénaline ou noradrénaline supérieure à 0,1</td></tr><tr><td>Système nerveux central : score de Glasgow</td><td>13 ou 14</td><td>10 à 12</td><td>6 à 9</td><td>Moins de 6</td></tr><tr><td>Rein : créatinine ou diurèse</td><td>110 à 170 µmol/L</td><td>171 à 299 µmol/L</td><td>300 à 440 µmol/L, ou diurèse inférieure à 500 mL par jour</td><td>Plus de 440 µmol/L, ou diurèse inférieure à 200 mL par jour</td></tr></table><p>Le médecin lit d’abord la ligne de l’organe qu’il suspecte, puis additionne les six lignes. L’erreur fréquente consiste à oublier la ligne circulatoire lorsque le patient reçoit déjà un vasopresseur : une noradrénaline supérieure à 0,1 µg/kg/min rapporte d’emblée 4 points. Mme R. totalise 7 points à l’arrivée, détaillés à la section 7.</p><div class="lab">Valeur et limites</div><p>Chez les patients hospitalisés pour une infection présumée, un score d’au moins 2 points s’associe à une mortalité hospitalière d’environ 10 %. Hors des soins intensifs, la hausse du score prédit le décès hospitalier avec une aire sous la courbe de 0,79 ; en soins intensifs, le score atteint 0,74. Il exige des analyses de laboratoire et dépend des traitements, comme les vasopresseurs ou la sédation. Une version révisée, le SOFA-2, a été publiée en 2025 pour l’adulte de soins intensifs ; la définition Sepsis-3 repose sur le score d’origine.</p><div class="lab">Piège</div><p>Le médecin compare chaque valeur aux paramètres antérieurs, notamment chez une personne atteinte d’insuffisance rénale chronique : seule la hausse aiguë compte. L’absence de certains résultats ne justifie pas d’attendre avant de traiter une hypoperfusion menaçante.</p><div class="lab">Conséquence pratique</div><p>Le score SOFA confirme et documente la défaillance ; il ne décide pas du moment du traitement. Le groupe de travail Sepsis-3 précise qu’il sert à caractériser le patient septique, et non à conduire son traitement.</p><div class="lab" data-reference-scope="a41-sofa">Textes de référence et périmètre</div><ul><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4968574/" target="_blank" rel="noopener" data-reference-source="1">Sepsis-3, Singer et coll., 2016 : définition et SOFA d’origine</a></li></ul></template>
<template data-pop="a41-sepsis3" data-title="Sepsis-3 : définition consensuelle"><div class="lab">Définition</div><p>Le consensus international publié en 2016 par Singer et ses collaborateurs définit le sepsis par une dysfonction d’organe menaçant la vie, causée par une réponse dérégulée de l’hôte à une infection. Une augmentation aiguë du score SOFA d’au moins 2 points en est le critère opérationnel clinique. Le groupe de travail, réuni par la Society of Critical Care Medicine et la Société européenne de médecine intensive, comptait 19 experts, et 31 sociétés savantes ont soutenu le texte.</p><div class="lab">Critères</div><p>Le choc septique exige en plus un vasopresseur pour maintenir une pression moyenne d’au moins 65 mmHg et un lactate supérieur à 2 mmol/L malgré un remplissage adéquat, en l’absence d’hypovolémie. La nouvelle défaillance est la distinction décisive avec une infection non compliquée. Le terme « sepsis sévère » disparaît, parce que tout sepsis comporte déjà une défaillance.</p><div class="lab">Pourquoi ce changement</div><p>Les critères inflammatoires des définitions de 1991 et de 2001 manquaient de spécificité et de sensibilité. Dans les unités de soins intensifs australiennes et néo-zélandaises, un patient sur huit admis pour une infection avec défaillance nouvelle ne remplissait pas deux critères. La nouvelle définition place donc la défaillance d’organe, et non l’inflammation, au centre du diagnostic.</p><div class="lab">Limites</div><p>Aucun critère ne mesure directement la réponse dérégulée : le score SOFA en donne une approximation. Le groupe de travail reconnaît l’absence d’examen de référence du syndrome. Il a exclu l’enfant, qui dispose depuis 2024 des critères Phoenix.</p><div class="lab">Conséquence pratique</div><p>Le médecin qui soupçonne une infection cherche une défaillance nouvelle ; le médecin qui trouve une défaillance inexpliquée cherche une infection. Ces critères classent le patient sans jamais retarder son traitement.</p><div class="lab" data-reference-scope="a41-sepsis3">Textes de référence et périmètre</div><ul><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4968574/" target="_blank" rel="noopener" data-reference-source="1">Sepsis-3, Singer et coll., 2016 : définition et SOFA d’origine</a></li></ul></template>
<template data-pop="a41-ssc" data-title="Surviving Sepsis Campaign 2026"><div class="lab">Présentation</div><p>Les recommandations internationales pour l’adulte ont été publiées le 23 mars 2026 par la Surviving Sepsis Campaign, initiative conjointe de la Société européenne de médecine intensive et de la Society of Critical Care Medicine, dans <i>Intensive Care Medicine</i> (<a href="https://doi.org/10.1007/s00134-026-08361-1" target="_blank" rel="noopener">doi 10.1007/s00134-026-08361-1</a>) et <i>Critical Care Medicine</i>. La Société européenne de médecine intensive en est cosignataire : le texte est donc recevable comme recommandation européenne. Elles comptent 129 énoncés, dont 46 nouveaux par rapport à l’édition de 2021. Le panel réunissait 69 membres de 23 pays.</p><div class="lab">Contenu</div><p>Les recommandations couvrent la reconnaissance, les prélèvements, l’antibiothérapie selon la probabilité, la réanimation, le contrôle du foyer, le soutien d’organe et les soins après la sortie. Elles portent sur l’hôpital, sur la phase préhospitalière immédiate et sur la période qui suit la sortie.</p><div class="lab">Lire la force d’un énoncé</div><p>Chaque énoncé porte une force et un degré de certitude. Une recommandation forte (« nous recommandons ») s’applique à presque tous les patients ; une recommandation conditionnelle (« nous suggérons ») dépend du patient et du contexte. Le degré de certitude, de très faible à élevé, mesure la confiance dans les preuves. Un principe de bonne pratique énonce une conduite évidente, qui ne fait pas l’objet d’une gradation.</p><div class="lab">Énoncés essentiels</div><p>Les recommandations suggèrent au moins 30 mL/kg de cristalloïde au cours des trois premières heures en cas d’hypoperfusion ou de choc, avec réévaluation, plutôt qu’une perfusion irréfléchie. Elles recommandent la noradrénaline en première intention et demandent d’évaluer rapidement les causes non infectieuses.</p><div class="lab">Piège</div><p>Une suggestion n’est pas une obligation, et une recommandation forte peut reposer sur une certitude très faible, comme le délai d’une heure pour l’antibiotique. Le médecin lit donc à la fois la force et la certitude.</p><div class="lab">Conséquence pratique</div><p>Le cours cite la force et la certitude de chaque énoncé qui change une décision. Il signale aussi les divergences avec l’information professionnelle suisse d’un médicament, comme pour l’hydrocortisone.</p><div class="lab" data-reference-scope="a41-ssc">Textes de référence et périmètre</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : texte actuel des 129 énoncés</a></li><li><a href="https://doi.org/10.1007/s00134-026-08410-9" target="_blank" rel="noopener" data-reference-source="1">Rectificatif du 5 mai 2026 : noms d’auteurs, sans changement clinique décrit</a></li></ul></template>
<template data-pop="a41-swiss-report" data-title="Swiss Sepsis Report 2025"><div class="lab">Présentation</div><p>Le Swiss Sepsis Report 2025, version 25.1 de septembre 2025, est la première analyse nationale du sepsis en Suisse. Il porte sur toutes les sorties des hôpitaux de soins aigus de 2019 à 2023, reliées aux données de mortalité de l’Office fédéral de la statistique. Il émane du Swiss Sepsis Program, lancé en 2023 et piloté par l’Hôpital universitaire pédiatrique de Zurich, l’Hôpital de l’Île à Berne et le Centre hospitalier universitaire vaudois.</p><div class="lab">Résultats principaux</div><p>Le rapport dénombre environ 20 000 hospitalisations explicitement codées sepsis par année, dont 500 à 600 concernent des enfants. Il compte environ 4 000 décès en milieu hospitalier dans ces séjours chaque année. En 2023, la mortalité intrahospitalière atteignait 18,9 % au total, 32,6 % en cas de choc septique et 22,3 % après 65 ans. Cette année-là, 40,7 % des séjours comportaient une admission en soins intensifs.</p><div class="lab">Méthode et limites</div><p>Une analyse qui combine un code d’infection et un code de défaillance d’organe estime davantage de cas, jusqu’à quatre fois plus : le chiffre varie fortement selon le codage et la définition. Ces nombres sont des statistiques de séjours, et un patient transféré peut compter deux fois. Ils ne prouvent pas la part des décès directement causés par le sepsis chez chaque patient, car la mortalité rapportée est toutes causes.</p><div class="lab">Piège</div><p>La mortalité toutes causes pendant le séjour ne mesure pas la mortalité attribuable. Le rapport ne distingue pas non plus les sepsis acquis dans la communauté de ceux acquis à l’hôpital.</p><div class="lab">Conséquence pratique</div><p>Le rapport situe le sepsis au niveau de l’infarctus et de l’accident vasculaire cérébral par le nombre de cas. Il appelle à une meilleure détection, à un codage harmonisé, à l’amélioration de la qualité dans les hôpitaux et au suivi des survivants.</p></template>
<template data-pop="a41-endo" data-title="Endothélium et vasoplégie"><div class="lab">Normal</div><p>L’endothélium est une couche unique de cellules qui tapisse l’intérieur des vaisseaux. Il règle le tonus des artérioles, empêche la coagulation au contact du sang et retient le plasma. Le glycocalyx, réseau de glycoprotéines à sa surface, participe à cette étanchéité.</p><div class="lab">Mécanisme dans le sepsis</div><p>La réponse inflammatoire perturbe l’endothélium vasculaire, son glycocalyx et les interactions entre plaquettes et leucocytes. Vasodilatation, fuite capillaire et dérèglement microcirculatoire coexistent. La NO synthase inductible produit un excès de monoxyde d’azote, qui relâche le muscle lisse artériolaire, et les vaisseaux répondent moins aux catécholamines.</p><div class="lab">Conséquences</div><p>La baisse de la résistance vasculaire et le déplacement du liquide hors des vaisseaux contribuent à l’hypotension. Le plasma perdu forme des œdèmes et réduit le volume circulant. La noradrénaline resserre les artérioles et les veines. La réduction de la capacité veineuse peut mobiliser du sang vers le cœur et augmenter la précharge. Le remplissage corrige les pertes de volume et une part de l’hypovolémie relative. Un excès de soluté aggrave toutefois les œdèmes lorsque la fuite capillaire persiste.</p><div class="lab">Mesure clinique</div><p>Le médecin évalue cette atteinte par la pression, le temps de recoloration capillaire, l’état de conscience, la diurèse et la tolérance des fluides.</p><div class="lab">Piège</div><p>Des extrémités chaudes au début du choc n’excluent pas une hypoperfusion des organes. La vasodilatation peut réchauffer la peau alors que la microcirculation des viscères reste altérée.</p><div class="lab">Source et limite du mécanisme</div><p>Hamzaoui et ses collaborateurs ont étudié 105 patients en choc septique hypotendu après remplissage en 2010. L’augmentation de précharge sous noradrénaline s’explique notamment par une diminution de la capacité veineuse. Cette étude observationnelle ne prouve ni un bénéfice de survie ni un effet identique chez tous les patients. La noradrénaline ne remplace pas un remplissage encore nécessaire.</p></template>
<template data-pop="a41-atcd-immune" data-title="Interroger l’immunosuppression"><div class="lab">Questions</div><p>Le médecin demande le médicament précis, sa dose et sa dernière administration : corticostéroïdes prolongés, cytotoxiques, traitements biologiques, transplantation, neutropénie connue. Il précise aussi une infection par le VIH et une asplénie si elles sont pertinentes.</p><div class="lab">Pourquoi</div><p>Ces informations modifient les agents possibles, la présentation fébrile et l’urgence des prélèvements. Chaque traitement touche une défense particulière : les cytotoxiques réduisent les polynucléaires, les corticoïdes atténuent l’inflammation et la fièvre, et les immunosuppresseurs de la transplantation affaiblissent l’immunité cellulaire.</p><div class="lab">Conséquence pratique</div><p>Un patient neutropénique fébrile reçoit un antibiotique immédiat. Une corticothérapie actuelle ou récente fait vérifier le risque d’insuffisance surrénalienne. Si ce risque n’a pas été écarté, une couverture de stress s’adapte à la gravité et au traitement déjà reçu. Une immunodépression profonde fait discuter au cas par cas un antifongique empirique.</p><div class="lab">Piège</div><p>Une prophylaxie anti-infectieuse antérieure et les vaccinations donnent un contexte, sans exclure une infection invasive.</p><div class="lab" data-reference-scope="a41-atcd-immune">Textes de référence et périmètre</div><ul><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener" data-reference-source="1">ESE/Endocrine Society, 2024 : couverture de stress, recommandation R3.1 et tableau 8</a></li></ul></template>
<template data-pop="a41-atcd-device" data-title="Dispositifs et interventions"><div class="lab">Questions</div><p>Le médecin demande la date et le type d’intervention, la présence d’un cathéter vasculaire ou urinaire, d’une prothèse, d’un drain, d’une chirurgie ou d’une injection récente. Il inspecte le point d’entrée et demande les cultures anciennes.</p><div class="lab">Pourquoi</div><p>Un dispositif ouvre une porte d’entrée et se couvre d’un biofilm, couche de bactéries adhérentes que les antibiotiques atteignent mal. Les cultures anciennes révèlent parfois un germe résistant déjà présent.</p><div class="lab">Décision</div><p>Le retrait d’un dispositif ne se décide pas sur la seule fièvre. Le médecin pèse la probabilité que le dispositif soit la source et la sécurité du geste.</p><div class="lab">Piège</div><p>Un point d’entrée d’aspect normal n’exclut pas une infection de cathéter. Des frissons lors de l’utilisation du cathéter orientent au contraire vers lui.</p></template>
<template data-pop="a41-atcd-organ" data-title="Comparer la fonction antérieure"><div class="lab">Principe</div><p>Le médecin compare la créatinine, les besoins en oxygène, la cognition habituelle, la pression et la bilirubine aux valeurs antérieures. Un patient présentant une maladie rénale chronique peut avoir un score SOFA rénal initial élevé : seule l’augmentation aiguë attribuable à l’infection compte pour la définition opérationnelle.</p><div class="lab">Sources</div><p>Les valeurs antérieures se trouvent dans le dossier, chez le médecin traitant ou auprès des proches. Sans valeur connue et sans défaillance préexistante connue, le score de base est présumé nul.</p><div class="lab">Exemple</div><p>Chez Mme R., une créatinine de 78 µmol/L trois mois plus tôt prouve que la valeur de 186 µmol/L traduit une atteinte aiguë. Chez un patient dont la créatinine habituelle est de 180 µmol/L, la même valeur ne compterait pas.</p><div class="lab">Conséquence pratique</div><p>Une défaillance ancienne ne suffit pas à poser un sepsis, et une défaillance nouvelle ne doit pas être prise pour ancienne. La comparaison évite ces deux erreurs.</p></template>
<template data-pop="a41-sympt-conf" data-title="Confusion : établir la nouveauté"><div class="lab">Établir la nouveauté</div><p>Le médecin précise avec un proche le dernier état normal, le début et la fluctuation. Il évalue l’orientation, l’attention, la glycémie, les médicaments sédatifs, l’oxygénation et la perfusion.</p><div class="lab">Mécanisme</div><p>Le sepsis altère le cerveau par l’inflammation, l’hypoperfusion et des troubles des neurotransmetteurs, sans infection du cerveau lui-même. Cette encéphalopathie septique se traduit par une confusion fluctuante, une somnolence ou une agitation.</p><div class="lab">Valeur</div><p>Une altération de l’état mental est l’un des trois critères du qSOFA, et un score de Glasgow de 13 ou 14 rapporte 1 point au score SOFA. Une confusion nouvelle en contexte infectieux est une alerte de défaillance à explorer.</p><div class="lab">Piège</div><p>Une confusion isolée ne désigne pas son étiologie. Une hypoglycémie, une hypoxémie, un médicament ou une méningite peuvent la causer ou l’aggraver ; le médecin mesure donc la glycémie capillaire dès l’arrivée.</p><div class="lab">Conséquence pratique</div><p>Une confusion nouvelle peut témoigner d’une dysfonction cérébrale, mais sa cause doit être évaluée. Elle ne suffit pas à définir seule un sepsis. Elle impose un bilan de perfusion et la recherche d’une atteinte neurologique propre, comme une méningite.</p></template>
<template data-pop="a41-sympt-dysp" data-title="Dyspnée : physiologie et gravité"><div class="lab">Questions</div><p>Le médecin fait décrire le début, la progression, une douleur thoracique, l’expectoration, le besoin actuel en oxygène et les antécédents respiratoires.</p><div class="lab">Mécanisme</div><p>La dyspnée du sepsis a trois causes possibles. Une pneumonie ou une fuite capillaire pulmonaire réduit l’oxygénation. Une acidose métabolique pousse à hyperventiler pour éliminer le dioxyde de carbone. La fièvre et la douleur augmentent aussi la ventilation.</p><div class="lab">Examen</div><p>Le médecin compte la fréquence respiratoire au repos et observe le tirage et la saturation. Une hyperventilation peut accompagner une acidose, une hypoxémie ou une douleur.</p><div class="lab">Piège</div><p>La saturation sous oxygène ne renseigne pas sur la valeur sans soutien. Le médecin note donc la saturation avec le débit d’oxygène, ou calcule le rapport PaO₂/FiO₂ à partir d’une gazométrie.</p><div class="lab">Conséquence pratique</div><p>Une fréquence respiratoire de 22 par minute ou plus est un critère du qSOFA, et une hypoxémie entre dans le score SOFA. Une dyspnée qui s’aggrave après les solutés fait craindre une surcharge.</p></template>
<template data-pop="a41-sign-perfusion" data-title="Perfusion cutanée : recoloration capillaire et marbrures"><div class="lab">Temps de recoloration capillaire : technique</div><p>Le médecin applique une pression ferme sur la face palmaire de la dernière phalange de l’index droit avec une lame de verre de microscope. Il augmente la pression jusqu’au blanchiment de la peau, puis la maintient 10 secondes. Il chronomètre ensuite le retour de la couleur normale. Un temps supérieur à 3 secondes est anormal. Cette technique standardisée est celle des essais ANDROMEDA-SHOCK.</p><div class="lab">Marbrures : score</div><p>Le score de marbrures cote de 0 à 5 l’étendue des marbrures sur les jambes. Le score 0 signifie aucune marbrure ; le score 1, une petite zone de la taille d’une pièce au centre du genou ; le score 2, une zone qui ne dépasse pas le bord supérieur de la rotule. Le score 3 ne dépasse pas le milieu de la cuisse, le score 4 ne dépasse pas le pli de l’aine, et le score 5 le dépasse. L’accord entre deux observateurs était excellent dans l’étude d’origine (kappa de 0,87).</p><div class="lab">Valeur</div><p>Dans une cohorte de 60 patients en choc septique, un score de marbrures de 2 ou 3 six heures après la réanimation initiale s’associait à un rapport de cotes de décès à 14 jours de 16, et un score de 4 ou 5 à un rapport de 74, par rapport à un score de 0 ou 1. La pression artérielle moyenne n’avait pas cette valeur pronostique. Les patients dont le score diminuait pendant la réanimation avaient un meilleur pronostic.</p><div class="lab">Essais</div><p>Dans l’essai ANDROMEDA-SHOCK (2019 ; 424 patients), une réanimation visant à normaliser le temps de recoloration capillaire, comparée à une réanimation guidée par le lactate, n’a pas réduit significativement la mortalité à 28 jours (34,9 % contre 43,4 %) ; elle a réduit les défaillances d’organe à 72 heures. Dans l’essai ANDROMEDA-SHOCK-2 (2025 ; 1 467 patients analysés), une réanimation personnalisée guidée par ce temps a été supérieure aux soins usuels sur un critère hiérarchique, surtout par une durée plus courte des suppléances vitales. La mortalité à 28 jours était de 26,5 % contre 26,6 % ; un bénéfice sur le critère hiérarchique ne démontre donc pas une réduction de la mortalité seule. La Surviving Sepsis Campaign 2026 suggère d’utiliser le temps de recoloration capillaire en complément d’autres mesures de perfusion (recommandation conditionnelle, certitude faible).</p><div class="lab">Piège</div><p>Une mesure isolée dépend du contexte : la température ambiante et le site choisi modifient la lecture. La tendance et l’état des autres organes importent davantage qu’une valeur unique.</p><div class="lab">Conséquence pratique</div><p>Un temps de recoloration allongé ou des marbrures qui s’étendent malgré une pression corrigée signalent une perfusion insuffisante. Le médecin réévalue alors le remplissage, la fonction cardiaque et le foyer.</p></template>
<template data-pop="a41-sign-rr" data-title="Fréquence respiratoire : mesurer"><div class="lab">Technique</div><p>Le médecin compte les mouvements respiratoires pendant une minute entière, lorsque le patient est au repos. Il observe le thorax sans l’annoncer au patient, car l’attention portée à la respiration la modifie.</p><div class="lab">Repères</div><p>Dans le National Early Warning Score 2, une fréquence de 12 à 20 par minute ne rapporte aucun point. Une fréquence de 21 à 24 rapporte 2 points, et une fréquence de 25 ou plus en rapporte 3, comme une fréquence de 8 ou moins. Une fréquence de 22 par minute ou plus appartient aux critères du qSOFA, et une fréquence supérieure à 20 aux critères de réponse inflammatoire.</p><div class="lab">Valeur et limites</div><p>Une fréquence élevée n’identifie pas seule un sepsis : une hypoxémie, une acidose ou une douleur peuvent aussi accélérer la respiration. Elle traduit pourtant un travail respiratoire que le patient ne pourra pas soutenir longtemps.</p><div class="lab">Piège</div><p>Une fréquence estimée d’un coup d’œil, ou comptée sur quelques secondes puis multipliée, est imprécise. Le comptage sur une minute évite cette erreur.</p><div class="lab">Conséquence pratique</div><p>Une fréquence respiratoire de 22 par minute ou plus chez un patient infecté impose de chercher une défaillance d’organe et de répéter la mesure.</p></template>
<template data-pop="a41-sign-focal" data-title="Examen du foyer"><div class="lab">Technique</div><p>Le médecin examine le thorax et l’effort respiratoire, l’abdomen avec les signes péritonéaux, les régions lombaires, la peau entière, y compris sous les dispositifs, les sites chirurgicaux et, selon la présentation, les méninges et les articulations. Il déshabille complètement le patient et le tourne pour voir le dos et le sacrum.</p><div class="lab">Signes à rechercher</div><p>Un ébranlement lombaire douloureux oriente vers une pyélonéphrite. Une défense abdominale oriente vers une péritonite, et une douleur de l’hypocondre droit vers les voies biliaires. Une raideur de nuque oriente vers une méningite, et une articulation chaude et gonflée vers une arthrite septique. Une escarre sacrée, une plaie ou un point de cathéter inflammatoire peuvent constituer la porte d’entrée.</p><div class="lab">Piège</div><p>Un obstacle, une collection ou une infection nécrosante imposent un geste rapide, que l’antibiotique ne remplace pas. La peau cachée sous un pansement ou une contention peut dissimuler le foyer.</p><div class="lab">Conséquence pratique</div><p>Chaque foyer trouvé oriente le prélèvement et l’imagerie. La Surviving Sepsis Campaign 2026 suggère un contrôle précoce, idéalement dans les six heures, pour un foyer qui exige ce geste. La recommandation est conditionnelle, avec une certitude très faible. Une obstruction urinaire infectée avec sepsis ou une infection nécrosante exige un geste urgent, sans attendre ce délai.</p><div class="lab" data-reference-scope="a41-sign-focal">Textes de référence et périmètre</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-24" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, énoncé 24 : contrôle du foyer</a></li><li><a href="https://uroweb.org/guidelines/urolithiasis/chapter/guidelines" target="_blank" rel="noopener" data-reference-source="1">EAU, Urolithiasis, §3.4.2 : texte actuel consulté le 8 octobre 2026, obstruction infectée</a></li></ul></template>
<template data-pop="a41-qsofa" data-title="qSOFA : usage et limite"><div class="lab">Définition</div><p>Le qSOFA est un score clinique rapide en trois critères : fréquence respiratoire ≥ 22/min, pression systolique ≤ 100 mmHg et modification de l’état mental. Deux ou trois éléments identifient un risque accru chez une personne infectée, mais un résultat négatif ne permet pas d’exclure une défaillance d’organe.</p><div class="lab">Origine</div><p>Le groupe de travail Sepsis-3 l’a dérivé des dossiers électroniques de 148 907 patients suspects d’infection. Hors des soins intensifs, sa capacité à prédire le décès hospitalier atteignait une aire sous la courbe de 0,81, proche de celle du score SOFA complet. En soins intensifs, elle tombait à 0,66, contre 0,74 pour le score SOFA.</p><div class="lab">Limite</div><p>Le qSOFA a été construit pour prédire l’évolution, et non pour dépister. Dans l’étude d’origine, seuls 24 % des patients infectés avaient un qSOFA de 2 ou 3, mais ils regroupaient 70 % des évolutions défavorables. Il est plus spécifique mais moins sensible que la présence de deux critères de réponse inflammatoire sur quatre.</p><div class="lab">Recommandation</div><p>La Surviving Sepsis Campaign 2026 recommande (recommandation forte, certitude modérée) d’utiliser à l’hôpital un score d’alerte précoce à plusieurs constantes (National Early Warning Score, première ou deuxième version, ou Modified Early Warning Score) ou les critères de réponse inflammatoire systémique plutôt que le score qSOFA comme outil unique de dépistage du sepsis.</p><div class="lab">Conséquence pratique</div><p>Un qSOFA positif impose de chercher une défaillance d’organe et d’intensifier la surveillance. Un qSOFA négatif ne dispense ni de cette recherche ni du traitement.</p></template>
<template data-pop="a41-cultures" data-title="Hémocultures sans retard dangereux"><div class="lab">Pourquoi</div><p>Les hémocultures identifient l’agent et sa sensibilité, ce qui permet ensuite de réduire le spectre. Une antibiothérapie déjà commencée réduit leur rendement. Dans l’étude diagnostique de Cheng et ses collaborateurs en 2019, 325 adultes sélectionnés ont été prélevés avant puis après l’antibiotique. Les cultures étaient positives chez 31,4 % avant et 19,4 % après, avec un délai médian de 70 minutes. Cette étude ne garantit pas le rendement chez chaque patient, mais justifie un prélèvement préalable sans retard dangereux.</p><div class="lab">Technique</div><p>Chez l’adulte, le médecin prélève rapidement au moins deux paires avant l’antibiotique lorsque cela ne retarde pas une dose indispensable. Une paire associe un flacon aérobie et un flacon anaérobie. Hors suspicion d’infection de cathéter, les paires proviennent de ponctions veineuses périphériques distinctes. Le médecin respecte l’antisepsie et note les sites et l’heure.</p><p>Le volume de sang compte : un flacon insuffisamment rempli diminue les chances de retrouver un faible inoculum. Pour les flacons adultes décrits au CHUV, le volume est de 8 à 10 mL par flacon. Le médecin suit le volume indiqué par le fabricant et ne dépasse pas 10 mL pour ces flacons. Cette consigne ne se transpose pas aux flacons pédiatriques.</p><p>Deux paires ne garantissent pas une culture positive. Dans l’étude rétrospective de Lee et ses collaborateurs en 2007, les deux premières cultures détectaient 89,7 % de 629 épisodes monomicrobiens sélectionnés. Les trois premières en détectaient 98,2 %. Le prélèvement supplémentaire dépend du contexte, notamment d’une suspicion d’endocardite, et ne doit pas retarder l’antibiotique.</p><div class="lab">Si le cathéter est suspect</div><p>Le médecin organise des prélèvements couplés sur le cathéter et en périphérie, avant l’antibiotique si cela reste sûr. Les prélèvements sont simultanés, de même volume et identifiés par leur site et leur heure. La croissance du même agent dans le prélèvement de cathéter au moins deux heures avant la périphérie soutient une origine liée au cathéter. Les volumes et les conditions comparables sont nécessaires pour interpréter ce délai.</p><div class="lab">Recommandation</div><p>La Surviving Sepsis Campaign 2026 recommande de prélever les hémocultures le plus tôt possible, idéalement avant l’antibiotique, en cas de sepsis possible, probable ou certain (recommandation forte, certitude faible).</p><div class="lab">Interprétation et pièges</div><p>Chez une personne instable, l’organisation des cultures ne doit pas repousser la première dose indispensable. Selon Sepsis-3, une culture n’est positive que dans 30 à 40 % des sepsis : une culture négative n’exclut pas le sepsis. Une culture positive peut refléter une contamination, en particulier par un staphylocoque à coagulase négative dans un seul flacon. Le médecin interprète ensuite la concordance avec le foyer et la possibilité d’une contamination.</p><div class="lab">Conséquence pratique</div><p>Le résultat conduit à la désescalade dès que l’agent et sa sensibilité sont connus. Une bactériémie à <i>Staphylococcus aureus</i> fait en outre rechercher une endocardite.</p><div class="lab">Sources et limites</div><p>La recommandation de calendrier vient de la Surviving Sepsis Campaign 2026. La fiche CHUV « Hémoculture chez l’adulte », version 13 du 5 octobre 2026, décrit les flacons et leurs volumes. Les résultats de Lee (2007) et de Cheng (2019) viennent de populations sélectionnées et ne sont pas des sensibilités garanties. La recommandation sur les prélèvements couplés vient de l’Infectious Diseases Society of America, version 2009.</p><div class="lab" data-reference-scope="a41-cultures">Textes de référence et périmètre</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-7" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, énoncé 7 : calendrier des hémocultures</a></li><li><a href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_01510/hemoculture-chez-ladulte" target="_blank" rel="noopener" data-reference-source="1">CHUV, Hémoculture chez l’adulte, version 13 du 5 octobre 2026 : flacons et volumes</a></li><li><a href="https://doi.org/10.1016/s0140-6736(98)11134-0" target="_blank" rel="noopener" data-reference-source="1">Blot et coll., <i>Lancet</i> 1999 : prélèvements couplés et délai différentiel de deux heures, résumé primaire</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/17881544/" target="_blank" rel="noopener" data-reference-source="1">Lee et coll., 2007 : étude du rendement, résumé primaire</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/31525774/" target="_blank" rel="noopener" data-reference-source="1">Cheng et coll., 2019 : effet des antibiotiques sur le rendement, résumé primaire</a></li></ul></template>
<template data-pop="a41-source" data-title="Contrôle anatomique du foyer"><div class="lab">Définition</div><p>Le contrôle du foyer regroupe les gestes qui suppriment physiquement la source de l’infection. Le drainage d’un abcès ou de voies urinaires obstruées, le retrait d’un cathéter infecté et la chirurgie d’une infection nécrosante en sont des exemples distincts.</p><div class="lab">Pourquoi</div><p>Un foyer clos, sous pression ou nécrosé contient une forte charge microbienne que l’antibiotique atteint mal. Tant qu’il persiste, il entretient la bactériémie et la réponse dérégulée.</p><div class="lab">Recommandation</div><p>La Surviving Sepsis Campaign 2026 suggère un contrôle précoce, idéalement dans les six heures suivant le diagnostic du sepsis ou du choc septique qui exige ce geste (recommandation conditionnelle, certitude très faible). Le médecin le concilie avec la stabilisation et la sécurité technique. La recommandation pose aussi en principe que tout patient septique est rapidement évalué à la recherche d’un foyer qui exige un contrôle urgent.</p><div class="lab">Exemple</div><p>Chez Mme R., un calcul bloque l’uretère droit. L’urologue pose une sonde urétérale double J à la quatrième heure et draine une urine purulente ; la noradrénaline commence ensuite à diminuer.</p><div class="lab">Piège</div><p>Un spectre élargi ne traite pas un obstacle. Un choc qui persiste malgré un antibiotique adapté doit faire rechercher un foyer non contrôlé.</p><div class="lab" data-reference-scope="a41-source">Textes de référence et périmètre</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-24" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, énoncé 24 : contrôle du foyer</a></li><li><a href="https://uroweb.org/guidelines/urolithiasis/chapter/guidelines" target="_blank" rel="noopener" data-reference-source="1">EAU, Urolithiasis, §3.4.2 : texte actuel consulté le 8 octobre 2026, obstruction infectée</a></li></ul></template>
<template data-pop="a41-pkpd" data-title="Pharmacodynamie des bêta-lactamines"><div class="lab">Mécanisme</div><p>Les bêta-lactamines inhibent des protéines liant la pénicilline, nécessaires à la synthèse de la paroi bactérienne. Leur effet dépend du temps pendant lequel la concentration libre reste au-dessus de la concentration minimale inhibitrice, et non du pic de concentration.</p><div class="lab">Ce que le sepsis change</div><p>Dans le sepsis, le volume de distribution augmente par la fuite capillaire et le remplissage. Une dose standard donne donc des concentrations plus basses. Chez certains patients, l’élimination rénale s’accélère au début, ce qui raccourcit encore le temps passé au-dessus de la concentration minimale inhibitrice.</p><div class="lab">Recommandation</div><p>Après une dose de charge initiale, la Surviving Sepsis Campaign 2026 recommande (recommandation forte, certitude modérée) une perfusion d’entretien prolongée plutôt qu’un bolus. Elle suggère un dosage sanguin de l’antibiotique au cas par cas (recommandation conditionnelle, certitude très faible). La recommandation forte repose sur une méta-analyse de 18 essais et de 9 108 participants, qui inclut l’essai BLING III.</p><div class="lab">Limites et mode d’emploi</div><p>L’adaptation rénale, la sensibilité de l’agent et le protocole de préparation de la pharmacie restent déterminants. L’information professionnelle suisse de la pipéracilline/tazobactam prévoit une perfusion de 30 minutes, dont la perfusion prolongée s’écarte ; la pharmacie hospitalière en fixe les modalités.</p><div class="lab">Conséquence pratique</div><p>La dose de charge s’administre sans réduction, même en insuffisance rénale, parce qu’elle dépend du volume de distribution. L’entretien s’adapte ensuite à l’élimination.</p></template>

<template data-pop="a41-codage-sirs" data-title="R65 : nomenclature complémentaire et diagnostic clinique"><p>Dans la CIM-10-GM 2024, R65.0! décrit une réponse inflammatoire systémique infectieuse sans complication d’organe, et R65.1! avec complication d’organe. Le signe « ! » indique un code complémentaire : la maladie causale se code d’abord, et les complications d’organe sont précisées séparément. Ces libellés de nomenclature ne remplacent pas la définition clinique du sepsis par une défaillance d’organe attribuable à l’infection. Leur application à un séjour suisse suit le manuel de codage national de l’année concernée ; aucune attribution automatique n’est faite à partir de la seule présence de fièvre ou d’un SOFA élevé.</p><div class="src">Source de nomenclature : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r50-r69.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, rubrique R65</a>, consultée le 8 octobre 2026. Les règles de facturation hospitalière suisses ne sont pas déduites de cette seule page.</div></template>
