<template data-pop="a53-sc-spirochete" data-title="Treponema pallidum : un spirochète, pas un résultat sérologique">
  <div class="lab">Agent et entrée</div><p><i>Treponema pallidum</i> sous-espèce <i>pallidum</i> est une bactérie spiralée responsable de la syphilis vénérienne. Le contact direct avec une lésion infectieuse permet son passage par une muqueuse ou une peau lésée. Un chancre peut siéger hors de la région génitale et passer inaperçu.</p>
  <div class="lab">Limite du cas</div><p>TPPA et RPR mesurent des anticorps produits par l’hôte, pas le tréponème lui-même. Leur positivité ne montre ni le point d’entrée ni la présence actuelle d’une lésion transmissible. Aucun site d’exposition n’a été fourni pour cette personne.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, clinique ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 2–3, histoire naturelle. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-endoflagelles" data-title="Spirochète : une morphologie, sans stade individuel">
  <div class="lab">Agent</div><p><i>T. pallidum</i> est décrit comme un spirochète. Les recommandations cliniques européennes décrivent ensuite l’évolution par lésions et manifestations, plutôt que par un examen de sa motilité chez chaque patient.</p>
  <div class="lab">Portée</div><p>Cette morphologie n’indique ni le site d’entrée, ni la date d’acquisition, ni un organe atteint. Aucun prélèvement direct du tréponème n’est disponible dans le cas.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 2–3, agent et stades ; <a data-reference-source="1" href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener">BASHH, directive syphilis 2024</a>, p. 3–4, formes acquises. Consultées le 08.10.2026. Le mécanisme des endoflagelles n’est pas utilisé pour la conduite de ce cas.</p>
</template>
<template data-pop="a53-sc-membrane" data-title="Réponse sérologique : aucun repérage anatomique">
  <div class="lab">Ce que mesurent les tests</div><p>Le TPPA et le RPR examinent des réponses anticorps de l’hôte. Ils ne visualisent pas une membrane bactérienne et ne démontrent pas la présence de tréponèmes viables dans un organe.</p>
  <div class="lab">Limite</div><p>La positivité sérologique conduit à recueillir l’histoire et à examiner la personne ; elle ne permet pas de déduire un mécanisme d’échappement immunitaire individuel. Les détails de la membrane externe ne fondent aucune décision dans ce cas.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4, tests sérologiques ; <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, « Diagnostic ». Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-dissemination" data-title="Dissémination : pourquoi les organes éloignés comptent">
  <div class="lab">Évolution clinique</div><p>La syphilis est une infection systémique. Une phase secondaire peut produire des lésions cutanées ou muqueuses à distance du chancre ; une phase latente peut ensuite être sans symptôme. Des atteintes neurologiques, oculaires ou auditives sont possibles et doivent être recherchées selon les signes.</p>
  <div class="lab">Conséquence et limite</div><p>Une atteinte d’organe se recherche par symptômes et examen adaptés. Le seul TPPA réactif avec RPR 1:8 ne localise pas le tréponème et ne reconstitue aucune étape passée. Le schéma de diffusion explique une possibilité, sans attribuer un organe malade à la personne du cas.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 2–3, stades cliniques ; <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, clinique ; <a data-reference-source="1" href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener">BASHH, directive syphilis 2024</a>, p. 3–4, histoire naturelle. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-lesion" data-title="Lésion cicatrisée : trois questions distinctes">
  <div class="lab">Trois événements</div><p>La disparition d’un chancre ou d’une éruption décrit la peau ou la muqueuse à un moment. Cette cicatrisation ne démontre pas l’élimination du tréponème. Une syphilis diagnostiquée nécessite un traitement adapté au stade ; les anticorps produits par l’hôte peuvent demeurer détectables même après une cure efficace.</p>
  <div class="lab">Application</div><p>L’absence de lésion visible doit être confirmée par l’examen ; elle ne date pas l’infection. Un traitement antérieur documenté et ses titres de suivi changeraient l’interprétation du RPR 1:8. Ces données manquent ici.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, formes cliniques et latence ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4, persistance des anticorps après traitement. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-immunite" data-title="Réponse immunitaire et mémoire sérologique">
  <div class="lab">Observation clinique et sérologique</div><p>Une lésion peut cicatriser sans traitement. Les tests tréponémiques restent positifs chez la majorité des personnes après une cure adéquate ; un test non tréponémique peut aussi demeurer réactif. Ces résultats ne montrent pas directement une bactérie vivante.</p>
  <div class="lab">Conséquence et limite</div><p>La cicatrisation n’établit pas une guérison et la persistance d’anticorps ne démontre pas une infection active après traitement. Pour le RPR 1:8, les anciens soins et titres manquent.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, clinique et diagnostic ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4 et 10–11, tests et réponse après traitement. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-tprk" data-title="Persistance : distinguer mécanisme et preuve clinique">
  <div class="lab">Ce qui est établi pour le cas</div><p>Une personne sans symptôme actuel peut avoir eu une infection non traitée ou un traitement passé avec persistance d’anticorps. La sérologie isolée ne sépare pas ces possibilités.</p>
  <div class="lab">Décision</div><p>Les recommandations SSI et IUSTI fondent la conduite sur l’examen, la chronologie, les titres comparables et la preuve d’une cure adéquate. Aucun résultat de mécanisme moléculaire, dont TprK, n’est disponible pour cette personne.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, diagnostic ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4 et 10–11, interprétation sérologique. Consultées le 08.10.2026. Aucun mécanisme moléculaire n’est inféré du RPR 1:8.</p>
</template>
<template data-pop="a53-sc-latence" data-title="Latence : sérologie réactive, pas de signe de maladie manifeste">
  <div class="lab">Définition clinique</div><p>La latence suppose une sérologie compatible et l’absence, à l’anamnèse et à l’examen, de signes de syphilis primaire, secondaire ou tertiaire. Les muqueuses orales, génitales et périanales doivent notamment être examinées avant de conclure à cette absence.</p>
  <div class="lab">Ce qu’elle ne dit pas</div><p>« Latente » ne signifie ni « récemment acquise » ni « déjà guérie ». Une personne peut ne plus présenter de lésion sexuelle transmissible visible ; en grossesse, une transmission au fœtus reste possible. Dans le cas, l’examen complet et l’histoire thérapeutique ne sont pas encore documentés.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, formes latentes ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 2–3, définition clinique de la latence. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-placenta" data-title="Transmission fœtale : la latence maternelle ne supprime pas le risque">
  <div class="lab">Transmission documentée</div><p>Une syphilis maternelle non traitée peut être transmise au fœtus, même si aucune lésion maternelle visible n’est décrite. La sérologie, l’histoire thérapeutique et le stade maternel doivent être établis sans attendre une manifestation fœtale.</p>
  <div class="lab">Manifestations et limite</div><p>La directive britannique BASHH décrit notamment anémie, hépatosplénomégalie, ascite, hydrops et placentomégalie parmi les signes fœtaux possibles. Ils n’établissent pas un risque individuel à partir d’un RPR 1:8. Le cas ne documente ni grossesse ni atteinte fœtale.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 8, grossesse ; <a data-reference-source="1" href="https://doi.org/10.1177/09564624241280387" target="_blank" rel="noopener">BASHH, syphilis pendant la grossesse et chez l’enfant, 2024</a>, p. 4–5, manifestations fœtales. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-precoce" data-title="Latence précoce : la preuve porte sur le temps, pas sur le titre">
  <div class="lab">Indices recevables</div><p>Pour établir une acquisition dans l’année, l’IUSTI/EDF retient notamment une sérologie négative documentée dans cette période, une hausse du titre d’au moins quatre fois ou une preuve sans équivoque liée à des manifestations cliniques ou à l’histoire des partenaires. Un rapport récent isolé ne suffit pas à dater une infection déjà possible auparavant.</p>
  <div class="lab">Cas présent</div><p>Le RPR à 1:8 ne date pas l’infection. Sans résultat antérieur, éléments cliniques datés ou preuve de traitement, la latence précoce ne peut être retenue sur ce seul titre. L’enquête et l’examen sont nécessaires.</p>
  <p class="src"><a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–3, définition de la syphilis latente précoce</a>, consulté le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-tppa" data-title="TPPA : mémoire immunitaire tréponémique">
  <div class="lab">Ce qui est détecté</div><p>Le TPPA recherche des anticorps contre des antigènes tréponémiques par agglutination de particules. Chez la majorité des personnes infectées, il demeure réactif pendant des années, souvent à vie, même après un traitement adéquat. Son titre éventuel ne sert pas à mesurer la réponse à la cure.</p>
  <div class="lab">Limite</div><p>Un TPPA réactif ne sépare pas infection actuelle et infection anciennement traitée. L’IUSTI précise que les tests sérologiques ne distinguent pas à eux seuls la syphilis vénérienne du pian, une autre tréponématose. Le contexte clinique et géographique, le RPR et les anciens résultats complètent la lecture du cas.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4, « Serological tests for syphilis », limites du TPPA et des tests tréponémiques. Consultée le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-lipides" data-title="Antigènes lipoïdiques du RPR : réponse de l’hôte, sans comptage bactérien">
  <div class="lab">Composition du réactif</div><p>Les antigènes des tests RPR et VDRL comprennent cardiolipine, lécithine et cholestérol. Ces tests mesurent une réponse anticorps non tréponémique ; leur titre ne compte pas des bactéries vivantes.</p>
  <div class="lab">Conséquence pratique</div><p>D’autres affections peuvent aussi produire une réactivité à ces antigènes. Le TPPA, l’examen clinique et les titres successifs rendent le RPR interprétable. Chez cette personne, la seule dilution 1:8 ne mesure ni ancienneté, ni viabilité, ni réponse à une cure inconnue.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4, tests non tréponémiques ; <a data-reference-source="1" href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener">BASHH, directive syphilis 2024</a>, p. 4–5, composition cardiolipine–lécithine–cholestérol. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-rpr" data-title="RPR 1:8 : une dilution d’anticorps, pas une horloge">
  <div class="lab">Principe</div><p>Le RPR détecte par floculation des anticorps réagissant à des antigènes lipidiques. Le titre 1:8 est la plus grande dilution encore réactive dans cet essai. Il n’est ni une concentration de tréponèmes ni une mesure directe de viabilité.</p>
  <div class="lab">Interprétation</div><p>La valeur devient utile lorsqu’elle est comparée à un titre antérieur ou à un titre de référence après traitement, obtenu avec la même méthode. Un chiffre isolé ne date pas la contamination et ne distingue pas d’emblée une infection non traitée d’une réponse persistante après cure. Des conditions non syphilitiques peuvent aussi rendre un test non tréponémique réactif.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4, tests non tréponémiques et titres ; <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, « Diagnostic ». Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-serofast" data-title="RPR persistant après traitement : possibilité documentée, pas conclusion du cas">
  <div class="lab">Limite individuelle</div><p>Le RPR 1:8 de cette personne ne peut pas être qualifié de « serofast » : ni un traitement adéquat antérieur ni une trajectoire de titres ne sont documentés. Une nouvelle exposition doit aussi être recherchée.</p>
  <div class="lab">Observation générale</div><p>Après un traitement adéquat, un test non tréponémique peut demeurer réactif. L’IUSTI décrit une persistance sérologique après cure documentée et demande une interprétation selon le stade, le titre initial et l’évolution. Aucun seuil isolé ne classe la personne du cas.</p>
  <p class="src"><a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 4 et 10–11, suivi et persistance après traitement</a>, consulté le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-quatrefois" data-title="Variation par quatre : comparaison de deux résultats">
  <div class="lab">Calcul</div><p>Deux dilutions successives équivalent à un facteur quatre : 1:8 → 1:32 est une hausse par quatre ; 1:8 → 1:2 est une baisse par quatre. Une seule valeur ne montre aucun changement, même si elle est élevée ou basse.</p>
  <div class="lab">Conditions</div><p>Le clinicien compare des RPR obtenus par la même méthode, idéalement dans le même laboratoire et avec une chronologie fiable. Les titres RPR et VDRL ne sont pas directement interchangeables. Une hausse peut demander d’examiner réinfection, échec ou variation de mesure selon sa durée et le contexte clinique ; elle ne désigne pas seule une cause.</p>
  <p class="src"><a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 10–11, variation par quatre et suivi par même méthode et laboratoire ; <a data-reference-source="1" href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener">BASHH, directive syphilis 2024</a>, rubrique « Follow-up », 2024. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-ecart-source" data-title="RPR positif : décision clinique et activité biologique ne sont pas synonymes">
  <div class="lab">Deux portées</div><p>La SSI, validée le 13 juin 2024, place « VDRL ou RPR » sous « Test dit d’activité », puis présente la branche « positif ► Diagnostic de syphilis active ► thérapie ». L’IUSTI/EDF précise qu’un test non tréponémique peut rester réactif après traitement adéquat. Ce raccourci SSI ne démontre donc pas, chez une personne déjà traitée, la persistance d’un tréponème vivant.</p>
  <div class="lab">Application prudente</div><p>La SSI est le cadre clinique suisse ; la persistance sérologique documentée empêche cependant de transformer son raccourci en preuve microbiologique. Le clinicien recherche rapidement les anciens résultats, la preuve d’une cure adéquate, les expositions et les signes. Si aucune cure adéquate n’est documentée après cette enquête, l’IUSTI finale de 2020 recommande une prise en charge par précaution selon le stade retenu. Il n’attend pas la preuve impossible d’une absence absolue de traitement passé. La fenêtre n’attribue ni guérison ni date d’infection à cette personne.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, « Diagnostic », « Test dit d’activité » ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 3–4, persistance des tests et conduite si cure adéquate non documentée, recommandation (1, D). Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-neurosyphilis" data-title="Atteinte neurologique : possible à différents stades">
  <div class="lab">Pourquoi elle reste à examiner</div><p>La SSI et l’IUSTI décrivent une atteinte neurologique possible avant les formes tardives. Des anomalies du liquide céphalorachidien peuvent être observées au début sans syndrome neurologique clinique ; elles ne justifient pas, à elles seules, un diagnostic chez chaque personne séropositive.</p>
  <div class="lab">Limite du titre sérique</div><p>La présence de tréponèmes ou d’anomalies du liquide tôt dans l’infection ne signifie pas que toute personne séropositive a une neurosyphilis clinique. Symptômes, examen neurologique et tests adaptés guident l’évaluation. Le RPR sérique 1:8 ne localise pas l’infection.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, « Suivi et diagnostic/exclusion de la neurosyphilis » ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 5–7, atteinte neurologique et liquide ; <a data-reference-source="1" href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener">BASHH, directive syphilis 2024</a>, p. 3–4 et 7–8. Consultées le 08.10.2026. Aucune probabilité individuelle n’est calculable pour ce cas.</p>
</template>
<template data-pop="a53-sc-formes-neuro" data-title="Atteintes neuro-oculaires : du trajet possible au syndrome observé">
  <div class="lab">Syndromes possibles</div><p>Les textes européens distinguent des anomalies du liquide sans syndrome, des formes méningées ou méningovasculaires, et des formes neurologiques tardives telles que tabès et paralysie générale. Ces catégories ne décrivent pas une évolution inévitable chez chaque personne infectée.</p>
  <div class="lab">Œil et décision</div><p>La syphilis oculaire peut se manifester notamment par une uvéite ou une atteinte rétinienne. Un symptôme visuel avec sérologie réactive justifie un examen ophtalmologique rapide ; une plainte auditive appelle une évaluation adaptée. Le RPR 1:8 n’identifie aucune structure atteinte.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, clinique et neurosyphilis ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 5–7, atteintes neurologiques et oculaires ; <a data-reference-source="1" href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener">BASHH, directive syphilis 2024</a>, p. 3–4 et 7–8, syndromes et examen spécialisé. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-lcr" data-title="Liquide céphalorachidien : tests et signes examinés ensemble">
  <div class="lab">Quand l’étudier</div><p>La SSI définit les situations qui conduisent à discuter une ponction lombaire, notamment des signes neurologiques ou psychiatriques et certains contextes de co-infection par le VIH. L’IUSTI et la BASHH ne préconisent pas une ponction systématique en l’absence de signe. Une plainte oculaire ou auditive demande un examen spécialisé ; l’utilité d’une ponction isolée dépend de cet examen. Le RPR 1:8 seul n’est pas une indication.</p>
  <div class="lab">Interprétation du VDRL du liquide</div><p>Selon l’IUSTI, un VDRL réactif dans un liquide non contaminé soutient fortement le diagnostic surtout dans les formes tardives ; le sens d’un résultat positif précoce est moins net et le test manque de sensibilité. Un résultat négatif isolé n’exclut donc pas une atteinte si les signes concordent. Cellularité et protéines complètent l’évaluation.</p>
  <div class="lab">Panel suisse et interprétation</div><p>Si une ponction est indiquée, la SSI demande de mesurer la cellularité, les protéines et le TPPA dans le liquide, avec des tests syphilitiques du sérum prélevé au même moment. La comparaison liquide/sérum par le diagramme de Reiber aide à interpréter si une réactivité du liquide dépasse ce qu’explique le passage d’anticorps sériques. Un TPPA positif dans le liquide, pris isolément, ne démontre donc pas une synthèse intrathécale ni une neurosyphilis. La SSI associe son interprétation aux résultats sériques et à une comparaison liquide/sérum ou à des anomalies inflammatoires du liquide.</p>
  <p class="src"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, « Syphilis », validée le 13.06.2024</a>, « Suivi et diagnostic/exclusion de la neurosyphilis », sérum concomitant et diagramme de Reiber ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020</a>, p. 5–7, tests du liquide et limites du VDRL ; <a data-reference-source="1" href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener">BASHH, directive syphilis 2024</a>, p. 7–8, indication de ponction. Consultées le 08.10.2026.</p>

<template data-pop="a53-sc-pareto" data-title="Pareto — Sciences fondamentales de A53, syphilis autres et sans précision">
  <p>Quelques distinctions suffisent pour éviter les principales erreurs de lecture du cas.</p>
  <ul><li>Le spirochète peut produire des manifestations locales puis systémiques ; la sérologie ne reconstitue pas ce trajet.</li><li>Une lésion qui cicatrise, une infection guérie et des anticorps persistants sont trois faits différents.</li><li>« Latente » exige l’absence de signes après examen ; « précoce » exige une preuve de chronologie, jamais un titre isolé.</li><li>Une latence maternelle non traitée peut encore exposer le fœtus ; aucune grossesse n’est connue dans le cas.</li><li>Le TPPA peut rester réactif après traitement. Le RPR 1:8 n’est ni une charge bactérienne ni une preuve d’infection récente.</li><li>Une variation RPR utile suppose deux titres comparables ; une différence par quatre représente deux dilutions.</li><li>Les signes neurologiques, oculaires ou auditifs orientent l’évaluation des organes ; le seul titre sérique ne les localise pas.</li></ul>
  <div class="key"><b>Application.</b> La personne est asymptomatique avec TPPA réactif et RPR 1:8 ; date d’acquisition, résultats antérieurs et traitement passé sont inconnus. Aucun stade ni état post-thérapeutique ne peut être déduit de ces seuls éléments. Si l’enquête rapide ne documente pas de cure adéquate, une prise en charge par précaution suit le stade retenu.</div>
