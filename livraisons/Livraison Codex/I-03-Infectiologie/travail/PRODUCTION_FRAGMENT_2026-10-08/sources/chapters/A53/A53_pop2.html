<template data-pop="a53-sc-spirochete" data-title="Treponema pallidum : un spirochète, pas un résultat sérologique">
  <div class="lab">Agent et entrée</div><p><i>Treponema pallidum</i> sous-espèce <i>pallidum</i> est une bactérie spiralée responsable de la syphilis vénérienne. Le contact direct avec une lésion infectieuse permet son passage par une muqueuse ou une peau lésée. Un chancre peut siéger hors de la région génitale et passer inaperçu.</p>
  <div class="lab">Limite du cas</div><p>TPPA et RPR mesurent des anticorps produits par l’hôte, pas le tréponème lui-même. Leur positivité ne montre ni le point d’entrée ni la présence actuelle d’une lésion transmissible. Aucun site d’exposition n’a été fourni pour cette personne.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire 2024, agent et évolution</a> ; <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, clinique, validée le 13.06.2024</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-endoflagelles" data-title="Motilité du spirochète : ce que montrent les endoflagelles">
  <div class="lab">Structure et mouvement</div><p><i>T. pallidum</i> possède des flagelles dans l’espace situé entre son corps et sa membrane externe. Leur rotation entraîne le mouvement hélicoïdal décrit par le CDC. Après une entrée muqueuse ou par microabrasion, le tréponème se multiplie localement et se diffuse rapidement.</p>
  <div class="lab">Portée</div><p>La motilité fournit une propriété biologique compatible avec son déplacement dans les tissus. Elle ne prouve ni le site d’entrée, ni la date, ni l’organe atteint chez cette personne. Aucun prélèvement direct de l’agent n’est disponible dans le cas.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire, 08.02.2024, « Immunobiology », endoflagelles et dissémination</a>. Texte intégral consulté le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-membrane" data-title="Membrane externe : faible exposition antigénique, sans invisibilité totale">
  <div class="lab">Architecture</div><p>Le CDC décrit une membrane externe fragile, dépourvue de lipopolysaccharide et pauvre en protéines qui la traversent. Elle expose ainsi moins de motifs reconnus par l’immunité innée que la surface de nombreuses autres bactéries. Ce trait contribue à l’absence de clairance immédiate et permet la diffusion précoce.</p>
  <div class="lab">Limite</div><p>Cette faible exposition ne signifie pas que l’hôte ne réagit pas. Des cellules dendritiques captent le tréponème et stimulent ensuite des réponses cellulaires et humorales. L’hypothèse d’une inhibition supplémentaire par un phospholipide tréponémique reste formulée au conditionnel dans la source et n’est pas nécessaire pour interpréter le RPR 1:8.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire, 08.02.2024, « Immunobiology », membrane et réponse innée</a>. Texte intégral consulté le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-dissemination" data-title="Dissémination : pourquoi les organes éloignés comptent">
  <div class="lab">Mécanisme</div><p>Après l’entrée locale, le tréponème peut gagner rapidement la circulation lymphatique et sanguine. Cette diffusion peut commencer avant que le chancre soit remarqué. Elle rend possibles des lésions cutanées ou muqueuses éloignées du foyer initial et parfois une atteinte neurologique, oculaire ou auditive.</p>
  <div class="lab">Conséquence et limite</div><p>Une atteinte d’organe se recherche par symptômes et examen adaptés. Le seul TPPA réactif avec RPR 1:8 ne localise pas le tréponème et ne reconstitue aucune étape passée. Le schéma de diffusion explique une possibilité, sans attribuer un organe malade à la personne du cas.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, laboratoire 2024, « Immunobiology », diffusion rapide</a> ; <a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, directives syphilis 2021, introduction et manifestations systémiques</a>. Textes intégraux consultés le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-lesion" data-title="Lésion cicatrisée : trois questions distinctes">
  <div class="lab">Trois événements</div><p>La disparition d’un chancre ou d’une éruption décrit la peau ou la muqueuse à un moment. Cette cicatrisation ne démontre pas l’élimination du tréponème. Une syphilis diagnostiquée nécessite un traitement adapté au stade ; les anticorps produits par l’hôte peuvent demeurer détectables même après une cure efficace.</p>
  <div class="lab">Application</div><p>L’absence de lésion visible doit être confirmée par l’examen ; elle ne date pas l’infection. Un traitement antérieur documenté et ses titres de suivi changeraient l’interprétation du RPR 1:8. Ces données manquent ici.</p>
  <p class="refs"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, formes cliniques et latence, validée le 13.06.2024</a> ; <a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, laboratoire 2024, persistance des anticorps</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-immunite" data-title="Réponse immunitaire : reconnaissance réelle, clairance incertaine">
  <div class="lab">De l’inné à l’adaptatif</div><p>Après la pénétration, des cellules dendritiques phagocytent des tréponèmes et gagnent les ganglions de drainage. Elles présentent des antigènes aux lymphocytes B et T ; une réponse inflammatoire et des anticorps apparaissent. Le CDC décrit ce chemin malgré la faible densité d’antigènes de la membrane externe.</p>
  <div class="lab">Conséquence et limite</div><p>La cicatrisation d’une lésion ne garantit pas que la réponse a éliminé une infection non traitée. À l’inverse, la persistance d’anticorps après une cure ne démontre pas une bactérie vivante. Les deux tests du cas mesurent des réponses de l’hôte, sans mesurer directement la clairance microbiologique.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire, 08.02.2024, « Immunobiology » et « Serologic Response After Treatment »</a> ; <a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, directives cliniques 2021, évolution des stades</a>. Textes intégraux consultés le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-tprk" data-title="TprK : variation antigénique et portée d’un modèle animal">
  <div class="lab">Mécanisme expérimental</div><p>La protéine tréponémique TprK porte sept régions variables reconnues par des anticorps. Des conversions de séquence, alimentées par des segments donneurs silencieux, peuvent en modifier les épitopes. Des données structurales et de modélisation suggèrent que ces boucles sont exposées à la surface. Dans une étude chez le lapin, la suppression de la plupart des segments donneurs limitait cette variation ; la souche formait des lésions atténuées et présentait une charge bactérienne plus faible sous réponse immunitaire.</p>
  <div class="lab">Portée clinique</div><p>L’expérience soutient un rôle de la variation dans la persistance ; elle ne permet ni de diagnostiquer un variant chez cette personne ni d’expliquer son titre RPR. La stratégie de soins repose sur le stade et l’histoire documentés, pas sur un test TprK courant.</p>
  <p class="refs"><a data-reference-source="1" href="https://journals.plos.org/plospathogens/article?id=10.1371/journal.ppat.1011259" target="_blank" rel="noopener">Romeis et coll., <i>PLoS Pathogens</i>, 20.03.2023, « Abstract », résultats et « Discussion »</a>. Article intégral consulté le 08.10.2026. Le modèle lapin ne démontre ni le mécanisme exact de la latence humaine ni une variante chez la personne du cas.</p>
</template>
<template data-pop="a53-sc-latence" data-title="Latence : sérologie réactive, pas de signe de maladie manifeste">
  <div class="lab">Définition clinique</div><p>La latence suppose une sérologie compatible et l’absence, à l’anamnèse et à l’examen, de signes de syphilis primaire, secondaire ou tertiaire. Les muqueuses orales, génitales et périanales doivent notamment être examinées avant de conclure à cette absence.</p>
  <div class="lab">Ce qu’elle ne dit pas</div><p>« Latente » ne signifie ni « récemment acquise » ni « déjà guérie ». Une personne peut ne plus présenter de lésion sexuelle transmissible visible ; en grossesse, une transmission au fœtus reste possible. Dans le cas, l’examen complet et l’histoire thérapeutique ne sont pas encore documentés.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener">CDC, Latent Syphilis, directives 2021</a> ; <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, formes latentes, validée le 13.06.2024</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-placenta" data-title="Transmission fœtale : la latence maternelle ne supprime pas le risque">
  <div class="lab">Trajet documenté</div><p>Une infection maternelle peut atteindre le placenta et être transmise au fœtus, même lorsque la mère ne présente plus de lésion sexuellement transmissible visible. Dans son texte intégral, Romeis et coll. décrivent la capacité du tréponème à coloniser et traverser le placenta. Le CDC précise que le risque fœtal demeure substantiel lors d’une latence tardive avec un faible titre maternel.</p>
  <div class="lab">Manifestations et limite</div><p>Le CDC cite l’hépatomégalie, l’anémie, l’ascite, l’anasarque fœtale et l’épaississement placentaire comme signes échographiques possibles. Ces observations ne définissent pas un mécanisme cellulaire unique et ne permettent pas de calculer un risque individuel à partir d’un RPR 1:8. Le cas ne documente ni grossesse ni infection fœtale.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener">CDC, Latent Syphilis, 2021, « Treatment » et transmission verticale</a> ; <a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/syphilis-pregnancy.htm" target="_blank" rel="noopener">CDC, Syphilis During Pregnancy, 2021, « Diagnostic Considerations » et « Treatment »</a> ; <a data-reference-source="1" href="https://journals.plos.org/plospathogens/article?id=10.1371/journal.ppat.1011259" target="_blank" rel="noopener">Romeis et coll., 2023, « Introduction »</a>. Textes intégraux consultés le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-precoce" data-title="Latence précoce : la preuve porte sur le temps, pas sur le titre">
  <div class="lab">Indices recevables</div><p>Pour situer l’acquisition dans les douze derniers mois, le CDC retient notamment une séroconversion documentée, une hausse soutenue d’au moins quatre fois après traitement antérieur, des symptômes datés, un partenaire avec syphilis récente documentée ou la certitude que toute exposition possible se limite à cette période.</p>
  <div class="lab">Cas présent</div><p>Un RPR à 1:8 peut être rencontré à plusieurs stades et parfois après traitement. Sans résultat ancien, date d’exposition fiable ou preuve de traitement, ce chiffre ne démontre pas une latence précoce. Le choix du cadre clinique dépend de l’enquête et de l’examen.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener">CDC, Latent Syphilis, critères d’infection dans l’année, directives 2021</a>, consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-tppa" data-title="TPPA : mémoire immunitaire tréponémique">
  <div class="lab">Ce qui est détecté</div><p>Le TPPA recherche des anticorps contre des antigènes tréponémiques par agglutination de particules. Chez la majorité des personnes infectées, il demeure réactif pendant des années, souvent à vie, même après un traitement adéquat. Son titre éventuel ne sert pas à mesurer la réponse à la cure.</p>
  <div class="lab">Limite</div><p>Un TPPA réactif ne sépare pas infection actuelle et infection anciennement traitée. La sérologie ne distingue pas à elle seule syphilis vénérienne et pian, une autre tréponématose ; le contexte clinique et géographique compte. Le RPR, l’histoire et l’examen complètent la lecture du cas.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire 2024, « Treponemal Tests »</a> ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive finale 2020, p. PDF 3, « Serological tests for syphilis »</a> ; <a data-reference-source="1" href="https://journals.plos.org/plosntds/article?id=10.1371/journal.pntd.0010173" target="_blank" rel="noopener">sérosurveillance primaire du pian en Équateur, <i>PLoS NTD</i>, 25.05.2022, « Discussion »</a>. Textes intégraux consultés le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-lipides" data-title="Antigènes lipoïdiques du RPR : réponse de l’hôte, sans comptage bactérien">
  <div class="lab">Origine des antigènes</div><p>Le mélange antigénique des tests RPR et VDRL comprend cardiolipine, phosphatidylcholine et cholestérol. Le CDC décrit ces lipides dans les membranes de l’hôte ainsi que dans celles du tréponème. Les anticorps qu’ils suscitent reflètent donc une réaction immunitaire et tissulaire, sans identifier une quantité de bactéries vivantes.</p>
  <div class="lab">Conséquence pratique</div><p>D’autres affections peuvent aussi produire une réactivité à ces antigènes. Le TPPA, l’examen clinique et les titres successifs rendent le RPR interprétable. Chez cette personne, la seule dilution 1:8 ne mesure ni ancienneté, ni viabilité, ni réponse à une cure inconnue.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire, 08.02.2024, « Immunobiology », « Nontreponemal Test » et « Nontreponemal (Lipoidal Antigen) Tests »</a>. Texte intégral consulté le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-rpr" data-title="RPR 1:8 : une dilution d’anticorps, pas une horloge">
  <div class="lab">Principe</div><p>Le RPR détecte par floculation des anticorps réagissant à des antigènes lipidiques. Le titre 1:8 est la plus grande dilution encore réactive dans cet essai. Il n’est ni une concentration de tréponèmes ni une mesure directe de viabilité.</p>
  <div class="lab">Interprétation</div><p>La valeur devient utile lorsqu’elle est comparée à un titre antérieur ou à un titre de référence après traitement, obtenu avec la même méthode. Un chiffre isolé ne date pas la contamination et ne distingue pas d’emblée une infection non traitée d’une réponse persistante après cure. Des conditions non syphilitiques peuvent aussi rendre un test non tréponémique réactif.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire 2024, floculation, titres et réactions biologiques</a>, consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-serofast" data-title="RPR persistant après traitement : possibilité documentée, pas conclusion du cas">
  <div class="lab">Observation</div><p>Après un traitement adéquat, le RPR diminue souvent, mais peut rester réactif durablement : cet état est parfois appelé « serofast ». Les recommandations de laboratoire CDC 2024 précisent que ces titres sont fréquemment faibles, souvent au plus 1:8, avec des valeurs plus hautes possibles.</p>
  <div class="lab">Limite individuelle</div><p>Le RPR 1:8 de cette personne pourrait appartenir à cette trajectoire si un ancien traitement correct était prouvé ; il pourrait aussi avoir une autre explication. Le mot « serofast » ne doit pas être appliqué sans connaître la cure et l’évolution des titres. Un résultat persistant n’autorise pas non plus à ignorer une nouvelle exposition.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, Laboratory Recommendations for Syphilis Testing, 08.02.2024, réponse sérologique après traitement</a>, consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-quatrefois" data-title="Variation par quatre : comparaison de deux résultats">
  <div class="lab">Calcul</div><p>Deux dilutions successives équivalent à un facteur quatre : 1:8 → 1:32 est une hausse par quatre ; 1:8 → 1:2 est une baisse par quatre. Une seule valeur ne montre aucun changement, même si elle est élevée ou basse.</p>
  <div class="lab">Conditions</div><p>Le clinicien compare des RPR obtenus par la même méthode, idéalement dans le même laboratoire et avec une chronologie fiable. Les titres RPR et VDRL ne sont pas directement interchangeables. Une hausse peut demander d’examiner réinfection, échec ou variation de mesure selon sa durée et le contexte clinique ; elle ne désigne pas seule une cause.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, directives syphilis 2021, changement significatif de deux dilutions</a> ; <a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, laboratoire 2024, comparabilité des méthodes</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-ecart-source" data-title="RPR positif : décision clinique et activité biologique ne sont pas synonymes">
  <div class="lab">Deux textes, deux portées</div><p>La directive SSI « Syphilis », validée le 13 juin 2024, place sous « Test dit d’activité » puis « VDRL ou RPR » l’algorithme « positif ► Diagnostic de syphilis active ► thérapie ». Ce texte donne une conduite clinique dans son algorithme. Les recommandations CDC de laboratoire du 8 février 2024 décrivent un RPR qui peut rester réactif après un traitement adéquat, parfois autour de 1:8.</p>
  <div class="lab">Application prudente</div><p>La SSI est le cadre clinique suisse ; la persistance sérologique documentée empêche cependant de transformer son raccourci en preuve microbiologique. Le clinicien recherche rapidement les anciens résultats, la preuve d’une cure adéquate, les expositions et les signes. Si aucune cure adéquate n’est documentée après cette enquête, l’IUSTI finale de 2020 recommande une prise en charge par précaution selon le stade retenu. Il n’attend pas la preuve impossible d’une absence absolue de traitement passé. La fenêtre n’attribue ni guérison ni date d’infection à cette personne.</p>
  <p class="refs"><a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, rubrique « Diagnostic », « Test dit d’activité », version 27576 validée le 13.06.2024</a> ; <a data-reference-source="1" href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire, 08.02.2024, « Serologic Response After Treatment »</a> ; <a data-reference-source="1" href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener">IUSTI/EDF, directive européenne finale 2020, p. PDF 3, « Serological tests for syphilis », recommandation (1, D)</a>. Textes intégraux consultés le 08.10.2026 ; le projet IUSTI de juin 2026 n’est pas une directive adoptée.</p>
</template>
<template data-pop="a53-sc-neurosyphilis" data-title="Atteinte neurologique : possible à différents stades">
  <div class="lab">Pourquoi elle est possible</div><p>La diffusion systémique peut atteindre le système nerveux central tôt dans l’infection. Le CDC observe que des anomalies du liquide céphalorachidien sont fréquentes dans la syphilis précoce, même sans signe neurologique. Il précise aussi qu’une atteinte neurologique clinique n’est pas réservée au stade tardif.</p>
  <div class="lab">Limite du titre sérique</div><p>La présence de tréponèmes ou d’anomalies du liquide tôt dans l’infection ne signifie pas que toute personne séropositive a une neurosyphilis clinique. Symptômes, examen neurologique et tests adaptés guident l’évaluation. Le RPR sérique 1:8 ne localise pas l’infection.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, Syphilis, 2021, « Cerebrospinal Fluid Evaluation »</a> ; <a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener">CDC, Neurosyphilis, Ocular Syphilis, and Otosyphilis, 2021, « Treatment »</a>. Textes intégraux consultés le 08.10.2026 ; ils ne fournissent pas une probabilité individuelle d’atteinte neurologique pour ce cas.</p>
</template>
<template data-pop="a53-sc-formes-neuro" data-title="Atteintes neuro-oculaires : du trajet possible au syndrome observé">
  <div class="lab">Invasion et maladie</div><p>Une diffusion précoce peut atteindre le système nerveux sans produire de syndrome neurologique. Le CDC distingue ensuite des manifestations cliniques précoces, notamment méningite, atteinte des nerfs crâniens et forme méningovasculaire pouvant causer un accident vasculaire. Des formes tardives comprennent tabès dorsal et paralysie générale. Ces catégories ne décrivent pas une évolution inévitable chez chaque personne infectée.</p>
  <div class="lab">Œil et décision</div><p>La syphilis oculaire peut toucher les segments antérieur ou postérieur de l’œil, notamment sous forme d’uvéite, d’atteinte du nerf optique ou de vascularite rétinienne. Elle peut causer une perte visuelle permanente. Un symptôme visuel avec sérologie réactive justifie un examen oculaire complet ; le RPR 1:8 n’identifie pas la structure touchée.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, Syphilis, directives 2021, introduction et « Cerebrospinal Fluid Evaluation »</a> ; <a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener">CDC, Neurosyphilis, Ocular Syphilis, and Otosyphilis, 2021, « Treatment »</a>. Textes intégraux consultés le 08.10.2026 ; aucun mécanisme cellulaire rétinien propre à cette personne n’est inféré.</p>
</template>
<template data-pop="a53-sc-lcr" data-title="Liquide céphalorachidien : tests et signes examinés ensemble">
  <div class="lab">Quand l’étudier</div><p>Une atteinte neurologique suspectée à l’examen peut justifier une ponction lombaire. Des symptômes oculaires avec sérologie réactive demandent d’abord un examen oculaire complet ; selon l’examen neurologique et oculaire, le liquide peut ou non être nécessaire avant traitement. Un simple titre sérique 1:8 ne constitue pas à lui seul une indication.</p>
  <div class="lab">Ce que dit le VDRL du LCR</div><p>Un VDRL réactif dans un prélèvement non contaminé par le sang est très spécifique en contexte évocateur, mais le test est peu sensible. Un résultat négatif ne suffit donc pas à exclure la maladie si des signes neurologiques concordants persistent. La cellularité, les protéines et le contexte apportent d’autres informations sans former, seuls, un test parfait.</p>
  <p class="refs"><a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, directives syphilis 2021, évaluation du LCR</a> ; <a data-reference-source="1" href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener">CDC, directives neuro-oculaires 2021</a>. Consultées le 08.10.2026.</p>

  <p>Quelques distinctions suffisent pour éviter les principales erreurs de lecture du cas.</p>
  <ul><li>Le spirochète pénètre par une muqueuse ou une peau lésée, puis peut diffuser rapidement ; la sérologie ne reconstitue pas ce trajet.</li><li>Une réponse immunitaire se développe, mais une lésion qui cicatrise, un tréponème éliminé et des anticorps persistants sont trois faits différents.</li><li>« Latente » exige l’absence de signes après examen ; « précoce » exige une preuve de chronologie, jamais un titre isolé.</li><li>Une latence peut encore exposer un fœtus en cas de grossesse ; aucun statut de grossesse n’est connu dans ce cas.</li><li>Le TPPA peut rester réactif après traitement. Le RPR 1:8 n’est ni une charge bactérienne ni une preuve d’infection récente.</li><li>Une variation RPR utile suppose deux titres comparables, avec la même méthode ; une différence par quatre représente deux dilutions.</li><li>Des signes neurologiques ou oculaires, plutôt que le seul titre sérique, orientent l’évaluation des organes.</li></ul>
  <div class="key"><b>Application.</b> La personne est asymptomatique avec TPPA réactif et RPR 1:8 ; date d’acquisition, résultats antérieurs et traitement passé sont inconnus. Aucun stade ni état post-thérapeutique ne peut être déduit de ces seuls éléments. Si l’enquête rapide ne documente pas de cure adéquate, une prise en charge par précaution suit le stade retenu.</div>
