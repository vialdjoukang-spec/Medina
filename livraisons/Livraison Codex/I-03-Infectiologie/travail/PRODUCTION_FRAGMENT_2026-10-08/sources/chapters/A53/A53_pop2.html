<template data-pop="a53-e-tt" data-title="Tests tréponémiques : fiche d’interprétation">
<div class="lab">Tests</div><p>TPHA et TPPA, tests d’agglutination manuels et peu coûteux, largement employés en Europe ; EIA, ELISA et CLIA, automatisés, adaptés au dépistage de masse, mais de spécificité parfois insuffisante ; FTA-abs, en voie d’abandon car long, coûteux et difficile à lire. Le projet européen de 2026 signale des difficultés d’accès au TPPA en Europe, certains laboratoires recourant au TPHA, un peu moins performant.</p>
<div class="lab">Valeur normale et seuil</div><p>Normal : négatif. Le résultat est qualitatif ; sa quantification n’est pas utile, sauf peut-être dans la syphilis congénitale.</p>
<div class="lab">Interprétation</div><p>Positif : infection actuelle ou passée, traitée ou non. Négatif : absence d’infection, sauf syphilis très récente, dans les 5 à 15 premiers jours du chancre. Un faux négatif persistant est exceptionnel et fait suspecter une erreur technique ou d’échantillon ; des faux négatifs sont décrits sous rituximab.</p>
<div class="lab">Erreur fréquente</div><p>Suivre la réponse au traitement par le TPPA, qui reste positif à vie.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, tests tréponémiques</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, tests tréponémiques et faux négatifs</a>.</div>
</template>
<template data-pop="a53-e-titre" data-title="Lire un titre non tréponémique">
<p>Le laboratoire dilue le sérum de deux en deux : 1:1, 1:2, 1:4, 1:8, 1:16, 1:32, 1:64. Le titre est la plus forte dilution encore réactive. Passer de 1:64 à 1:16 représente deux dilutions, soit un facteur quatre : c’est le seuil d’une variation significative. Passer de 1:8 à 1:4 représente une seule dilution, dans la marge de variation du test.</p>
<p>Le projet européen de 2026 note qu’un titre égal ou supérieur à 1:8 sert souvent de seuil pratique pour suspecter une syphilis active non traitée, surtout sans résultat antérieur, mais qu’une hausse d’un facteur quatre est l’indicateur sérologique le plus spécifique d’une infection active ou d’une réinfection. Sans antécédent documenté, un titre bas, inférieur ou égal à 1:4, reste compatible avec une infection active et se traite.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, suivi</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, anticorps lipoïdiques</a>.</div>
</template>
<template data-pop="a53-e-prozone" data-title="Phénomène de prozone">
<p>Dans une syphilis précoce riche en anticorps, l’excès d’anticorps empêche la formation du réseau antigène-anticorps visible dans le sérum non dilué : le test non tréponémique paraît négatif alors que l’infection est active. Diluer le sérum rétablit les proportions et révèle la réaction. La directive européenne demande donc de diluer au moins jusqu’à 1:8, mieux 1:16, chaque fois que le test tréponémique est positif, surtout si l’index du test automatisé est élevé (1, B).</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, faux négatifs</a>.</div>
</template>
<template data-pop="a53-e-fauxpos" data-title="Faux positifs biologiques des tests non tréponémiques">
<p>Ils concernent 0,2 à 0,8 % des tests. Les formes <b>aiguës</b>, de moins de six mois, suivent une vaccination, un infarctus récent, une infection fébrile comme le paludisme, une hépatite, la varicelle ou la rougeole, ou accompagnent la grossesse. Les formes <b>chroniques</b>, de six mois ou plus, s’observent chez les usagers de drogues injectables, dans les maladies auto-immunes, l’infection par le VIH, la lèpre, les cancers, les hépatopathies chroniques et l’âge avancé. Le titre est le plus souvent inférieur ou égal à 1:4. Tout test non tréponémique positif se recontrôle sur un second prélèvement avec un test tréponémique.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, faux positifs</a>.</div>
</template>
