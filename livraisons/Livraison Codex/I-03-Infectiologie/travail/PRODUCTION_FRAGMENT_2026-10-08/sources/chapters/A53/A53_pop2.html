<template data-pop="a53-sc-spirochete" data-title="Treponema pallidum : un spirochète, pas un résultat sérologique">
  <div class="lab">Agent et entrée</div><p><i>Treponema pallidum</i> sous-espèce <i>pallidum</i> est une bactérie spiralée responsable de la syphilis vénérienne. Le contact direct avec une lésion infectieuse permet son passage par une muqueuse ou une peau lésée. Un chancre peut siéger hors de la région génitale et passer inaperçu.</p>
  <div class="lab">Limite du cas</div><p>TPPA et RPR mesurent des anticorps produits par l’hôte, pas le tréponème lui-même. Leur positivité ne montre ni le point d’entrée ni la présence actuelle d’une lésion transmissible. Aucun site d’exposition n’a été fourni pour cette personne.</p>
  <p class="refs"><a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire 2024, agent et évolution</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, clinique, validée le 13.06.2024</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-dissemination" data-title="Dissémination : pourquoi les organes éloignés comptent">
  <div class="lab">Mécanisme</div><p>Après l’entrée locale, le tréponème peut gagner la circulation lymphatique et sanguine. Cette diffusion rend possibles des lésions cutanées ou muqueuses éloignées du foyer initial et parfois une atteinte neurologique, oculaire ou auditive.</p>
  <div class="lab">Conséquence et limite</div><p>Une atteinte d’organe se recherche par symptômes et examen adaptés. Le seul TPPA réactif avec RPR 1:8 ne localise pas le tréponème et ne reconstitue aucune étape passée. Le schéma de diffusion explique une possibilité, sans attribuer un organe malade à la personne du cas.</p>
  <p class="refs"><a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, directives syphilis 2021, manifestations systémiques</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/3056164/" target="_blank" rel="noopener">Lukehart et coll., étude primaire de présence précoce dans le LCR, 1988</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-lesion" data-title="Lésion cicatrisée : trois questions distinctes">
  <div class="lab">Trois événements</div><p>La disparition d’un chancre ou d’une éruption décrit la peau ou la muqueuse à un moment. L’élimination du tréponème dépend d’un traitement approprié et ne se déduit pas de cette cicatrisation. Les anticorps produits par l’hôte peuvent demeurer détectables même après une cure efficace.</p>
  <div class="lab">Application</div><p>L’absence de lésion visible doit être confirmée par l’examen ; elle ne date pas l’infection. Un traitement antérieur documenté et ses titres de suivi changeraient l’interprétation du RPR 1:8. Ces données manquent ici.</p>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, formes cliniques et latence, validée le 13.06.2024</a> ; <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, laboratoire 2024, persistance des anticorps</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-tprk" data-title="TprK : variation antigénique et portée d’un modèle animal">
  <div class="lab">Mécanisme expérimental</div><p>La protéine tréponémique TprK porte des régions variables reconnues par des anticorps. Des conversions de séquence peuvent en modifier les épitopes. Dans une étude chez le lapin, une souche dont cette variation était fortement limitée formait des lésions atténuées et présentait une charge bactérienne plus faible sous réponse immunitaire.</p>
  <div class="lab">Portée clinique</div><p>L’expérience soutient un rôle de la variation dans la persistance ; elle ne permet ni de diagnostiquer un variant chez cette personne ni d’expliquer son titre RPR. La stratégie de soins repose sur le stade et l’histoire documentés, pas sur un test TprK courant.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/36940224/" target="_blank" rel="noopener">étude primaire, souche à variation TprK réduite dans le modèle lapin, 2023</a>, résumé détaillé consulté le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-latence" data-title="Latence : sérologie réactive, pas de signe de maladie manifeste">
  <div class="lab">Définition clinique</div><p>La latence suppose une sérologie compatible et l’absence, à l’anamnèse et à l’examen, de signes de syphilis primaire, secondaire ou tertiaire. Les muqueuses orales, génitales et périanales doivent notamment être examinées avant de conclure à cette absence.</p>
  <div class="lab">Ce qu’elle ne dit pas</div><p>« Latente » ne signifie ni « récemment acquise » ni « déjà guérie ». Une personne peut ne plus présenter de lésion sexuelle transmissible visible ; en grossesse, une transmission au fœtus reste possible. Dans le cas, l’examen complet et l’histoire thérapeutique ne sont pas encore documentés.</p>
  <p class="refs"><a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener">CDC, Latent Syphilis, directives 2021</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, formes latentes, validée le 13.06.2024</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-precoce" data-title="Latence précoce : la preuve porte sur le temps, pas sur le titre">
  <div class="lab">Indices recevables</div><p>Pour situer l’acquisition dans les douze derniers mois, le CDC retient notamment une séroconversion documentée, une hausse soutenue d’au moins quatre fois après traitement antérieur, des symptômes datés, un partenaire avec syphilis récente documentée ou la certitude que toute exposition possible se limite à cette période.</p>
  <div class="lab">Cas présent</div><p>Un RPR à 1:8 peut être rencontré à plusieurs stades et parfois après traitement. Sans résultat ancien, date d’exposition fiable ou preuve de traitement, ce chiffre ne démontre pas une latence précoce. Le choix du cadre clinique dépend de l’enquête et de l’examen.</p>
  <p class="refs"><a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener">CDC, Latent Syphilis, critères d’infection dans l’année, directives 2021</a>, consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-tppa" data-title="TPPA : mémoire immunitaire tréponémique">
  <div class="lab">Ce qui est détecté</div><p>Le TPPA recherche des anticorps contre des antigènes tréponémiques par agglutination de particules. Chez la majorité des personnes infectées, il demeure réactif pendant des années, souvent à vie, même après un traitement adéquat. Son titre éventuel ne sert pas à mesurer la réponse à la cure.</p>
  <div class="lab">Limite</div><p>Un TPPA réactif ne sépare pas infection actuelle et infection anciennement traitée. Aucun test sérologique tréponémique ne distingue à lui seul les sous-espèces responsables de tréponématoses non vénériennes ; le contexte compte. Le RPR, l’histoire et l’examen complètent la lecture du cas.</p>
  <p class="refs"><a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire 2024, tests tréponémiques et leurs limites</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, diagnostic, validée le 13.06.2024</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-rpr" data-title="RPR 1:8 : une dilution d’anticorps, pas une horloge">
  <div class="lab">Principe</div><p>Le RPR détecte par floculation des anticorps réagissant à des antigènes lipidiques. Le titre 1:8 est la plus grande dilution encore réactive dans cet essai. Il n’est ni une concentration de tréponèmes ni une mesure directe de viabilité.</p>
  <div class="lab">Interprétation</div><p>La valeur devient utile lorsqu’elle est comparée à un titre antérieur ou à un titre de référence après traitement, obtenu avec la même méthode. Un chiffre isolé ne date pas la contamination et ne distingue pas d’emblée une infection non traitée d’une réponse persistante après cure. Des conditions non syphilitiques peuvent aussi rendre un test non tréponémique réactif.</p>
  <p class="refs"><a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire 2024, floculation, titres et réactions biologiques</a>, consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-serofast" data-title="RPR persistant après traitement : possibilité documentée, pas conclusion du cas">
  <div class="lab">Observation</div><p>Après un traitement adéquat, le RPR diminue souvent, mais peut rester réactif durablement : cet état est parfois appelé « serofast ». Les recommandations de laboratoire CDC 2024 précisent que ces titres sont fréquemment faibles, souvent au plus 1:8, avec des valeurs plus hautes possibles.</p>
  <div class="lab">Limite individuelle</div><p>Le RPR 1:8 de cette personne pourrait appartenir à cette trajectoire si un ancien traitement correct était prouvé ; il pourrait aussi avoir une autre explication. Le mot « serofast » ne doit pas être appliqué sans connaître la cure et l’évolution des titres. Un résultat persistant n’autorise pas non plus à ignorer une nouvelle exposition.</p>
  <p class="refs"><a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, Laboratory Recommendations for Syphilis Testing, 08.02.2024, réponse sérologique après traitement</a>, consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-quatrefois" data-title="Variation par quatre : comparaison de deux résultats">
  <div class="lab">Calcul</div><p>Deux dilutions successives équivalent à un facteur quatre : 1:8 → 1:32 est une hausse par quatre ; 1:8 → 1:2 est une baisse par quatre. Une seule valeur ne montre aucun changement, même si elle est élevée ou basse.</p>
  <div class="lab">Conditions</div><p>Le clinicien compare des RPR obtenus par la même méthode, idéalement dans le même laboratoire et avec une chronologie fiable. Les titres RPR et VDRL ne sont pas directement interchangeables. Une hausse peut demander d’examiner réinfection, échec ou variation de mesure selon sa durée et le contexte clinique ; elle ne désigne pas seule une cause.</p>
  <p class="refs"><a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, directives syphilis 2021, changement significatif de deux dilutions</a> ; <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, laboratoire 2024, comparabilité des méthodes</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-ecart-source" data-title="RPR positif : décision clinique et activité biologique ne sont pas synonymes">
  <div class="lab">Deux textes, deux portées</div><p>La directive SSI « Syphilis », validée le 13 juin 2024, écrit dans son algorithme « RPR/VDRL positif ► syphilis active ► thérapie ». Cette consigne pratique vise à ne pas laisser une syphilis vraisemblablement non traitée sans soins. Les recommandations CDC de laboratoire du 8 février 2024 décrivent un RPR qui peut rester réactif après un traitement adéquat, parfois autour de 1:8.</p>
  <div class="lab">Application prudente</div><p>La SSI est le cadre clinique suisse ; la persistance sérologique documentée empêche cependant de transformer son raccourci en preuve microbiologique. Comme l’ancien traitement, les titres et l’exposition de cette personne sont inconnus, le clinicien recherche ces faits et procède à une évaluation clinique avant de qualifier le stade. La fenêtre n’affirme ni guérison ni infection active pour ce cas.</p>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, diagnostic, version 27576 validée le 13.06.2024</a> ; <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, recommandations de laboratoire, 08.02.2024, « serofast »</a>. Textes consultés le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-neurosyphilis" data-title="Atteinte neurologique : possible à différents stades">
  <div class="lab">Pourquoi elle est possible</div><p>La diffusion systémique peut atteindre le système nerveux central. Une étude historique a isolé des tréponèmes du liquide céphalorachidien de personnes avec syphilis primaire ou secondaire non traitée ; les recommandations CDC rappellent que l’atteinte neurologique clinique n’est pas réservée au stade tardif.</p>
  <div class="lab">Limite du titre sérique</div><p>La présence de tréponèmes ou d’anomalies du liquide tôt dans l’infection ne signifie pas que toute personne séropositive a une neurosyphilis clinique. Symptômes, examen neurologique et tests adaptés guident l’évaluation. Le RPR sérique 1:8 ne localise pas l’infection.</p>
  <p class="refs"><a href="https://pubmed.ncbi.nlm.nih.gov/3056164/" target="_blank" rel="noopener">Lukehart et coll., étude primaire sur 58 personnes non traitées, 1988</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener">CDC, directives neuro-oculaires 2021</a>. Consultées le 08.10.2026 ; l’étude historique ne fournit pas une probabilité individuelle actuelle.</p>
</template>
<template data-pop="a53-sc-lcr" data-title="Liquide céphalorachidien : tests et signes examinés ensemble">
  <div class="lab">Quand l’étudier</div><p>Une atteinte neurologique suspectée à l’examen peut justifier une ponction lombaire. Des symptômes oculaires avec sérologie réactive demandent d’abord un examen oculaire complet ; selon l’examen neurologique et oculaire, le liquide peut ou non être nécessaire avant traitement. Un simple titre sérique 1:8 ne constitue pas à lui seul une indication.</p>
  <div class="lab">Ce que dit le VDRL du LCR</div><p>Un VDRL réactif dans un prélèvement non contaminé par le sang est très spécifique en contexte évocateur, mais le test est peu sensible. Un résultat négatif ne suffit donc pas à exclure la maladie si des signes neurologiques concordants persistent. La cellularité, les protéines et le contexte apportent d’autres informations sans former, seuls, un test parfait.</p>
  <p class="refs"><a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener">CDC, directives syphilis 2021, évaluation du LCR</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener">CDC, directives neuro-oculaires 2021</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a53-sc-pareto" data-title="Pareto — Sciences fondamentales de A53, syphilis autres et sans précision">
  <p>Quelques distinctions suffisent pour éviter les principales erreurs de lecture du cas.</p>
  <ul><li>Une entrée locale peut être oubliée ; la syphilis peut ensuite diffuser, mais la sérologie ne reconstitue pas ce trajet.</li><li>Une lésion qui cicatrise, un tréponème éliminé et des anticorps qui persistent sont trois faits différents.</li><li>« Latente » exige l’absence de signes après examen ; « précoce » exige une preuve de chronologie, jamais un titre isolé.</li><li>Le TPPA peut rester réactif après traitement. Le RPR 1:8 n’est ni une charge bactérienne ni une preuve d’infection récente.</li><li>Une variation RPR utile suppose deux titres comparables, avec la même méthode ; une différence par quatre représente deux dilutions.</li><li>Des signes neurologiques ou oculaires, plutôt que le seul titre sérique, orientent l’évaluation des organes.</li></ul>
  <div class="key"><b>Application.</b> La personne est asymptomatique avec TPPA réactif et RPR 1:8 ; date d’acquisition, résultats antérieurs et traitement passé sont inconnus. Aucun stade ni état post-thérapeutique ne peut être déduit de ces seuls éléments.</div>
  <p class="refs"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener">SSI, Syphilis, validée le 13.06.2024</a> ; <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7301a1.htm" target="_blank" rel="noopener">CDC, laboratoire 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener">CDC, latence 2021</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener">CDC, neuro-oculaire 2021</a>. Consultées le 08.10.2026.</p>
</template>
