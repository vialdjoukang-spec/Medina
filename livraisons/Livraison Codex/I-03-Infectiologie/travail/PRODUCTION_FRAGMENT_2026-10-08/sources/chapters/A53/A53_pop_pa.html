<template data-pop="pareto-a53-bases" data-title="Pareto — Définitions, épidémiologie et mécanismes"><p class="ratio" data-cover="a53-1,a53-2,a53-3,a53-4"></p><ul><li>Syphilis : infection systémique à <i>T. pallidum</i>, acquise ou congénitale.</li><li>Précoce = primaire, secondaire, latente de moins d’un an ; tardive = latente d’un an ou plus ou de durée inconnue, tertiaire. OMS : deux ans.</li><li>Neurosyphilis, atteinte oculaire et auditive : possibles à tous les stades.</li><li>Suisse 2024 : 1042 cas, 11,6 pour 100 000 ; 776 précoces ; 89 % d’hommes ; Zurich en tête.</li><li>Sans traitement : secondaire chez un tiers, tertiaire chez environ 10 %.</li><li>Mécanisme : surface pauvre en antigènes, dissémination précoce, inflammation périvasculaire, endartérite, latence par contrôle immunitaire.</li><li>Transmission sexuelle par lésion, surtout la première année ; transmission verticale.</li><li>Dépister : autre IST, VIH, PrEP, hépatites, hommes ayant des rapports avec des hommes, travail du sexe, grossesse.</li></ul></template>
<template data-pop="pareto-a53-diagnostic" data-title="Pareto — Clinique, diagnostic et urgences"><p class="ratio" data-cover="a53-5,a53-6,a53-7,a53-8"></p><ul><li>Chancre indolore induré, puis éruption palmo-plantaire non prurigineuse avec adénopathies.</li><li>Toute ulcération ano-génitale est syphilitique jusqu’à preuve du contraire.</li><li>Examiner muqueuses, paumes et plantes, nerfs crâniens, vision, audition, foyer aortique.</li><li>PCR sur lésion ; puis test tréponémique et RPR quantitatif ; VIH toujours.</li><li>Latence précoce : sérologie négative dans l’année, hausse de deux dilutions, ou acquisition prouvée.</li><li>Œil, oreille, système nerveux : pénicilline G intraveineuse, avis le jour même.</li><li>Insuffisance aortique ou anévrisme thoracique : sérologie.</li><li>Trente minutes d’observation après injection.</li></ul></template>
<template data-pop="pareto-a53-traitement" data-title="Pareto — Traitement, suivi et situations particulières"><p class="ratio" data-cover="a53-9,a53-10,a53-11"></p><ul><li>Précoce : benzathine-pénicilline G 2,4 MUI intramusculaire une fois.</li><li>Tardive ou durée inconnue : 2,4 MUI aux jours 1, 8 et 15.</li><li>Neurosyphilis, œil, oreille : pénicilline G 4 MUI intraveineuse toutes les 4 heures, 14 jours.</li><li>Allergie : désensibilisation ; doxycycline 2 semaines si moins d’un an, 4 semaines au-delà ; ceftriaxone selon la SSI si éruption seule.</li><li>Partenaires selon la SSI : 30 jours au stade primaire, 6 mois au stade secondaire.</li><li>Déclaration au médecin cantonal en une semaine.</li><li>Suivi RPR à 3, 6, 12 et 24 mois ; réponse = baisse de deux dilutions ; hausse de deux dilutions = réinfection probable.</li><li>Grossesse : dépistage précoce, pénicilline, traitement du partenaire ; pas de doxycycline.</li><li>VIH : même traitement ; ponction lombaire selon la SSI si CD4 &lt; 200/µL ou RPR &gt; 1:32 au stade secondaire.</li></ul></template>
<template data-pop="pareto-a53-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="a53-e-1,a53-e-2,a53-e-3,a53-e-4,a53-e-5,a53-e-6,a53-e-7,a53-e-8"></p><ul><li>PCR : référence de la preuve directe sur lésion ; négative ne rassure pas.</li><li>Test tréponémique : infection actuelle ou passée, positif à vie, jamais pour le suivi.</li><li>RPR : titre d’activité, dilué jusqu’à 1:8–1:16 contre la prozone ; faux positifs surtout ≤ 1:4.</li><li>Discordance : répéter ; TPPA positif et RPR négatif sans traitement : second test tréponémique.</li><li>Liquide céphalo-rachidien : VDRL positif affirme, test tréponémique négatif exclut ; fond d’œil avant ponction.</li><li>Variation significative : deux dilutions, même test, même laboratoire.</li></ul></template>
<template data-pop="pareto-a53-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="a53-s-1,a53-s-2,a53-s-3,a53-s-4"></p><ul><li>Spirochète à flagelles périplasmiques, non cultivable en routine, temps de génération de 30 à 33 heures.</li><li>Membrane externe sans lipopolysaccharide, pauvre en protéines : furtivité.</li><li>Anticorps anti-lipidiques : activité ; anticorps anti-tréponémiques : mémoire.</li><li>Infiltrat périvasculaire plasmocytaire et endartérite oblitérante à tous les stades.</li><li>Seuil tréponémicide 0,018 mg/L ; dépôt de 2,4 MUI efficace environ 21 jours ; passage insuffisant dans le liquide céphalo-rachidien.</li></ul></template>
<template data-pop="pareto-a53-pharmaco" data-title="Pareto — Pharmacologie de la syphilis"><p class="ratio" data-cover="a53-p-1,a53-p-2,a53-p-3,a53-p-4,a53-p-5,a53-p-6"></p><ul><li>Extencilline® 2,4 MUI : 5 mL d’eau, intramusculaire profonde, aspiration, un site.</li><li>Contre-indications : allergie aux pénicillines, au soja ou à l’arachide ; anaphylaxie à une bêta-lactamine ; neurosyphilis.</li><li>Pénicilline G : neurotoxique à forte dose, surtout en insuffisance rénale ; charge sodée.</li><li>Doxycycline : 2 ou 4 semaines ; à distance des cations ; pas en grossesse ni avec une pénicilline.</li><li>Ceftriaxone : hors indication suisse ; jamais après anaphylaxie aux pénicillines.</li><li>Azithromycine : exclue.</li><li>Jarisch-Herxheimer : 2 à 12 heures, transitoire ; paracétamol sans dépasser 4 g par jour.</li></ul></template>
