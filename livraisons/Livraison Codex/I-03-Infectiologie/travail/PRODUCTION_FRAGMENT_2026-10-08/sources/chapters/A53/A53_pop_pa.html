<template data-pop="a53-pa-anciens" data-title="Anciens résultats : l’élément qui manque au cas">
<div class="lab">Comparer des faits</div><p>Un test tréponémique négatif puis positif à des dates certaines peut montrer une séroconversion. Deux titres RPR mesurés avec la même méthode peuvent montrer une augmentation ou une baisse. Le compte rendu d’une cure antérieure précise médicament, dose, nombre d’administrations et dates ; une déclaration verbale seule peut être insuffisante si les pièces sont accessibles.</p>
<div class="lab">Conséquence</div><p>Sans ces éléments, TPPA positif et RPR 1:8 ne séparent pas une infection non traitée d’une sérofixation après traitement. Le médecin contacte rapidement les anciens lieux de soins et examine le dossier avant de choisir le stade et le schéma. L’absence de pièce ne prouve pas une absence de traitement. Toutefois, selon l’IUSTI/EDF 2020, si aucun traitement antérieur adéquat ne peut être documenté après cette recherche, une sérologie positive appelle un traitement par précaution ; l’enquête ne doit pas se prolonger sans décision.</p>
<div class="src">Sources : <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, recommandation finale 2020, p. 3, « Serological tests for syphilis », recommandation 1,D</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Diagnostic »</a>.</div></template>

<template data-pop="a53-pa-codage" data-title="A53.0 ou A53.9 : précision du stade, pas intensité du RPR">
<div class="lab">Texte officiel</div><p>Le BfArM CIM-10-GM 2024 nomme A53.0 « Latente Syphilis, nicht als früh oder spät bezeichnet » : syphilis latente sans qualification précoce ou tardive. A53.9 est « Syphilis, nicht näher bezeichnet » : syphilis sans précision. A53.0 inclut une réaction sérologique positive ; cette inclusion de classement n’affirme pas qu’un titre persistant après traitement nécessite une cure.</p>
<div class="lab">Application</div><p>Une latence clinique documentée dont la durée est inconnue oriente vers A53.0. Si le stade ne peut pas être caractérisé, A53.9 exprime cette limite. Chez l’adulte TPPA positif du cas, ni la latence à traiter ni un ancien traitement ne sont encore établis.</p>
<div class="src">Sources : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A53" target="_blank" rel="noopener" data-reference-source="1">BfArM, ICD-10-GM 2024, A53.0 et A53.9</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, persistance des tests après traitement</a>.</div></template>

<template data-pop="a53-pa-cim11" data-title="CIM-11 : d’autres catégories, aucune conversion automatique">
<p>La CIM-11 MMS française 2026-01 distingue notamment la syphilis précoce, la syphilis tardive, la latence sans précision précoce ou tardive (1A63) et la syphilis sans précision (1A6Z). Ces libellés aident à chercher une destination éventuelle, mais ils ne prouvent pas qu’A53.0 corresponde toujours à 1A63 ni qu’A53.9 se convertisse automatiquement en 1A6Z. Les règles de codage et le dossier individuel restent nécessaires.</p>
<div class="src">Source : <a href="https://icd.who.int/browse/2026-01/mms/fr#455894495" target="_blank" rel="noopener" data-reference-source="1">OMS, CIM-11 MMS française 2026-01, bloc syphilis</a>, consultée le 8 octobre 2026.</div></template>

<template data-pop="a53-pa-tppa" data-title="TPPA : exposition tréponémique, pas horloge de l’infection">
<div class="lab">Ce qu’il mesure</div><p>Le TPPA détecte une réponse dirigée contre <i>T. pallidum</i>. Après une syphilis traitée, les tests tréponémiques restent réactifs chez beaucoup de personnes pendant des années. Un TPPA positif ne donne donc ni une date d’acquisition ni, seul, une indication de retraitement.</p>
<div class="lab">Lecture avec le RPR</div><p>Le résultat tréponémique est confronté au RPR quantitatif, à la clinique, aux tests passés et au traitement documenté. Une discordance ou une histoire impossible à reconstituer justifie une discussion avec le laboratoire et un suivi adapté.</p>
<div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, tests tréponémiques</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », diagnostic, 13 juin 2024</a>.</div></template>

<template data-pop="a53-pa-rpr" data-title="RPR 1:8 : valeur quantitative à comparer">
<div class="lab">Signification</div><p>Le RPR est un test non tréponémique exprimé par la dernière dilution encore réactive. Un résultat 1:8 signifie qu’une réactivité est observée jusqu’à la dilution 1 pour 8 dans ce protocole. Le titre peut diminuer après un traitement efficace, remonter lors d’une réinfection ou persister après guérison. Un résultat isolé 1:8 ne qualifie pas cette persistance de « faible ».</p>
<div class="lab">Limite</div><p>Un seul 1:8 ne précise pas la date d’acquisition ni la réponse à une ancienne cure. Le médecin compare des titres quantitatifs obtenus par la même méthode ; TPPA et RPR n’ont pas la même fonction. La SSI nomme RPR « test d’activité », mais le CDC rappelle la persistance possible du titre après traitement.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et suivi</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, tests non tréponémiques</a>.</div></template>

<template data-pop="a53-pa-serofast" data-title="Sérofixation : une réactivité qui peut persister après traitement">
<p>Une réactivité non tréponémique peut persister après une cure efficace. Pour parler de sérofixation, le médecin documente la cure, la trajectoire du même test et l’absence de nouveaux signes ou d’exposition. Dans son suivi après traitement de la syphilis précoce, l’IUSTI/EDF 2020 décrit le « serofast » avec des titres persistants ≤1:4 après un à deux ans ; devant un titre ≥1:8 qui persiste, il suggère une réévaluation et envisage parfois le LCR, avec une preuve faible (2,D). Le <b>1:8 isolé du cas n’établit ni sérofixation ni indication de ponction</b>.</p>
<div class="src">Sources : <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 11, suivi sérologique, recommandations 2,D</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Suivi »</a>.</div></template>

<template data-pop="a53-pa-quatrefois" data-title="Facteur quatre : deux dilutions, toujours avec une valeur de départ">
<p>Une variation d’un facteur quatre correspond à deux étapes de dilution par deux. Une baisse de 1:8 à 1:2 ou une hausse de 1:2 à 1:8 répond à cette définition. La comparaison demande la même méthode et un intervalle pertinent ; un titre actuel 1:8 sans ancienne valeur ne représente ni une hausse ni une baisse.</p>
<div class="src">Source : <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, changement sérologique cliniquement significatif</a>.</div></template>

<template data-pop="a53-pa-pareto-serologie" data-title="Loi de Pareto — Sérologie et stade">
<div class="ratio" data-cover="a53-pa-0,a53-pa-7">Quatre faits changent la décision</div><ol><li>Le TPPA peut rester positif après une cure efficace.</li><li>Un RPR 1:8 est une mesure actuelle, sans date ni trajectoire.</li><li>La cure antérieure adéquate doit être documentée pour écarter le traitement de précaution.</li><li>Le stade clinique et l’atteinte d’organe définissent le schéma.</li></ol><div class="key">La sérologie déclenche une évaluation rapide, puis une décision.</div><div class="src"><a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–4</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et traitement</a>.</div></template>

<template data-pop="a53-pa-recente" data-title="Latence précoce : les éléments qui permettent de la dater">
<div class="lab">Critères CDC</div><p>Au cours des douze mois précédents, une séroconversion documentée, une hausse durable d’au moins quatre fois du titre chez une personne déjà traitée, des signes indiscutables de syphilis primaire ou secondaire, ou un partenaire documenté à un stade précoce peuvent établir une latence précoce. Si l’unique exposition possible se situe dans cette période, elle peut aussi l’étayer.</p>
<div class="lab">Piège du cas</div><p>La date du dernier test négatif est inconnue et aucun élément de cette liste n’est fourni. Un rapport récent, même vrai, n’exclut pas une infection antérieure. Le CDC dit expressément que le titre non tréponémique, même élevé, ne classe pas à lui seul une latence comme précoce.</p>
<div class="src">Source : <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, « Latent Syphilis », 2021, définition de la latence précoce</a>.</div></template>

<template data-pop="a53-pa-alarme" data-title="Neuro, œil et oreille : signes qui changent le parcours">
<p>Un déficit moteur ou sensitif, une atteinte cognitive, une paralysie d’un nerf crânien, des signes méningés ou un syndrome évoquant un AVC appellent une évaluation neurologique. Une baisse de vision ou une douleur oculaire avec sérologie réactive nécessite un examen ophtalmologique rapide ; une baisse d’audition ou des acouphènes réclament une évaluation ORL. Les atteintes oculaire et auditive peuvent exister sans anomalie neurologique générale. Leur traitement spécialisé diffère de celui d’une latence simple.</p>
<div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, neurosyphilis, syphilis oculaire et otique, 2021</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique et neurosyphilis</a>.</div></template>

<template data-pop="a53-pa-pl" data-title="Ponction lombaire : textes en tension, portée du cas limitée">
<div class="lab">SSI, 13 juin 2024</div><p>Dans la rubrique de neurosyphilis associée à une syphilis secondaire, la SSI cite des signes neurologiques ou psychiatriques, un VIH avec CD4 inférieur à 200/µL, ou un VIH avec RPR/VDRL supérieur à 1:32 parmi les motifs de ponction. Sa formulation ne permet pas de transposer directement ces seuils à cet adulte sans stade établi, sans statut VIH connu et avec RPR 1:8.</p>
<div class="lab">Europe et États-Unis</div><p>L’IUSTI/EDF final 2020 (p. 5) indique le LCR en présence d’atteinte neurologique, oculaire ou auditive clinique, mais décrit la ponction comme controversée devant certaines atteintes oculaires déjà destinées à la pénicilline IV (p. 6). Le CDC 2021 n’exige pas toujours le LCR avant le traitement d’une atteinte oculaire ou auditive isolée confirmée. Le CDC constate également une association entre anomalies du LCR, VIH, faibles CD4 et titres élevés, mais ne trouve pas de meilleur résultat clinique lorsque la ponction et le traitement de neurosyphilis reposent sur les seuls paramètres biologiques en l’absence de signe neurologique. Une manifestation neurologique conduit en revanche à un examen du LCR ; une atteinte oculaire ou auditive possède un parcours spécifique. Si les textes deviennent tous deux pertinents, l’équipe motive la décision avec un spécialiste.</p>
<div class="src">Textes : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », suivi et neurosyphilis, 13 juin 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, directive finale 2020, p. 5–6, bilan neurologique et oculaire</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-hiv.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, syphilis et VIH, 2021</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, atteintes neurologiques, oculaires et auditives, 2021</a>.</div></template>

<template data-pop="a53-pa-stades" data-title="Trois questions avant de nommer le stade">
<ol><li>Une cure adéquate antérieure peut-elle être documentée ? Si elle ne peut pas l’être après recherche rapide, l’IUSTI/EDF conseille un traitement par précaution.</li><li>Un test, un syndrome ou une exposition documentée situe-t-il l’acquisition dans les douze derniers mois ?</li><li>Une manifestation primaire, secondaire, neurologique, oculaire, auditive ou tertiaire change-t-elle le parcours ?</li></ol><p>Si l’examen soutient une latence mais que sa durée n’est pas démontrée, l’IUSTI/EDF traite cette durée comme inconnue. Cela ne prouve pas que l’infection remonte biologiquement à plus d’un an. La CIM-10-GM et l’OFSP répondent à des questions de classement différentes.</p>
<div class="src">Sources : <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 2–3, latence et traitement de précaution</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et traitement</a>.</div></template>

<template data-pop="a53-pa-ofsp-classe" data-title="OFSP 2026 : définition de surveillance, pas règle de datation clinique">
<p>Le Guide OFSP 2026 distingue la latence précoce selon l’histoire clinique et la date documentée. Pour la surveillance, il inclut dans la latence tardive certaines durées inconnues avec titre non tréponémique au moins égal à 1:32. Il conserve aussi les « stades inconnus ». Cette règle administrative n’établit ni la date réelle ni un schéma thérapeutique. Le 1:8 du cas n’atteint pas le seuil 1:32, mais cela n’en fait pas une latence précoce.</p>
<div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, rubrique « Syphilis », définitions de cas, p. 110–111</a>.</div></template>

<template data-pop="a53-pa-traitement" data-title="Latence de durée inconnue : traitement conditionnel">
<div class="lab">Quand ce schéma s’applique</div><p>Après vérification rapide de la sérologie, des documents thérapeutiques et de l’examen, l’IUSTI/EDF recommande un traitement par précaution si aucune cure adéquate antérieure n’est documentée. Si aucune acquisition dans l’année n’est démontrée, si l’examen soutient une latence et si aucune atteinte neurologique, oculaire ou auditive ne demande un autre schéma, l’IUSTI/EDF recommande la benzathine pénicilline G <b>2,4 MUI IM aux jours 1, 8 et 15</b>. La SSI 2024 recommande le même schéma pour la latence tardive, mais ne nomme pas explicitement la durée inconnue. Une cure adéquate antérieure prouvée avec trajectoire compatible change l’indication.</p>
<div class="lab">Produit suisse</div><p>La benzathine pénicilline retard est strictement intramusculaire et ne traite pas une neurosyphilis. La préparation et le volume dépendent de la présentation réellement délivrée : l’Extencilline suisse commercialisée en 2026 ne reprend pas automatiquement les volumes de l’ancienne page SSI. L’information professionnelle et l’éventuel lot sont contrôlés dans l’onglet pharmacologie avant injection.</p>
<div class="src">Sources : <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 2–3 et 7, tableau 1 et traitement par précaution</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », traitement, 13 juin 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Extencilline n° 69765, voie et préparation, consultée le 8 octobre 2026</a>.</div></template>

<template data-pop="a53-pa-allergie" data-title="Allergie et grossesse : deux vérifications avant de substituer">
<p>Une allergie déclarée est caractérisée par le produit, la réaction et sa gravité. La SSI 2024 propose doxycycline 100 mg deux fois par jour pendant <b>14 jours</b> en cas d’anaphylaxie dans une rubrique englobant la syphilis latente. Pour une latence tardive ou de durée inconnue, l’IUSTI/EDF final 2020 propose <b>200 mg/j durant 21 à 28 jours</b>, et le CDC 2021 <b>100 mg deux fois par jour durant 28 jours</b> ; les alternatives ont une base de preuve plus faible que la pénicilline. Ces durées ne se mélangent pas dans une ordonnance. En cas de grossesse avec allergie vraie, l’IUSTI/EDF recommande une désensibilisation puis la pénicilline pour prévenir la syphilis congénitale. Le choix est spécialisé et adapté au produit effectivement disponible.</p>
<div class="src">Sources en tension : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », allergie, 13 juin 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 2, 7–8, durée inconnue et grossesse</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, « Penicillin Allergy »</a>.</div></template>

<template data-pop="a53-pa-jarisch" data-title="Jarisch–Herxheimer : réaction inflammatoire après traitement">
<p>Une fièvre et des symptômes généraux peuvent débuter dans les heures qui suivent le traitement d’une syphilis. La réaction de Jarisch–Herxheimer survient après le traitement et s’accompagne d’une réponse inflammatoire transitoire. Elle n’est pas, en elle-même, une allergie immédiate à la pénicilline. Sa fréquence et sa gravité dépendent du stade ; une grossesse rend sa surveillance particulièrement importante. Une détresse respiratoire, un collapsus ou une réaction cutanée généralisée impose toutefois une évaluation d’urgence pour une autre cause, notamment une hypersensibilité.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, traitement et réaction de Jarisch–Herxheimer</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, réaction après traitement</a>.</div></template>

<template data-pop="a53-pa-pareto-decision" data-title="Loi de Pareto — Avant une cure de latence inconnue">
<div class="ratio" data-cover="a53-pa-5,a53-pa-6,a53-pa-7,a53-pa-8,a53-pa-9">Trois vérifications décisives</div><ol><li>L’équipe recherche rapidement une cure adéquate documentée ; à défaut, elle traite par précaution après évaluation.</li><li>Elle cherche une preuve d’acquisition dans l’année, sans employer le RPR 1:8 comme horloge.</li><li>Elle recherche grossesse et signes neurologiques, oculaires ou auditifs avant le choix du schéma.</li></ol><div class="key">La latence de durée inconnue sans atteinte d’organe reçoit le schéma de trois semaines si aucune cure adéquate n’est documentée.</div><div class="src"><a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–3 et 7</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, traitement</a>.</div></template>

<template data-pop="a53-pa-suivi" data-title="Suivi quantitatif : calendriers et limites">
<p>La SSI 2024 propose des contrôles RPR ou VDRL à 3, 6, 12 et 24 mois après traitement. Le CDC 2021 recommande 6, 12 et 24 mois pour une latence. La cadence suisse peut inclure une mesure plus précoce ; l’interprétation garde le titre initial, le stade, une nouvelle exposition et les symptômes. Le TPPA ne remplace pas le RPR pour suivre la réponse, car il peut rester positif après guérison.</p>
<p>Le CDC indique que la conduite devant une baisse de moins de quatre fois à 24 mois peut rester incertaine, surtout avec un titre initial inférieur à 1:8. Le 1:8 du cas n’entre pas dans « inférieur à 1:8 » et n’a aucune trajectoire connue. L’IUSTI/EDF 2020 réserve la catégorie « serofast » de son algorithme à une persistance ≤1:4 après traitement documenté. Une nouvelle cure ne se décide pas sur un contrôle isolé, mais l’absence de cure adéquate documentée appelle la règle de traitement de précaution.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, suivi</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, suivi de la latence</a>.</div></template>

<template data-pop="a53-pa-discordance-rpr" data-title="Baisse du RPR : calcul exact et phrase SSI ambiguë">
<div class="lab">Le calcul</div><p>Chaque dilution divise le titre par deux. Deux étapes correspondent à une baisse d’un facteur quatre : 1:8 devient 1:2. Quatre étapes correspondent à une baisse d’un facteur seize. Le CDC 2021 définit une variation cliniquement significative par le facteur quatre, soit deux dilutions.</p>
<div class="lab">Le texte suisse</div><p>La SSI, page validée le 13 juin 2024, écrit qu’après six mois le RPR/VDRL devrait être négatif ou diminuer de « 4 titrations, soit 1/16 ». Cette phrase ne correspond pas au facteur quatre du CDC si « titration » désigne une étape de dilution par deux. De plus, le délai de réponse d’une latence peut être plus long, notamment selon le titre initial. Le suivi utilise la trajectoire et le contexte clinique ; il ne fait pas de cette phrase un verdict automatique d’échec.</p>
<div class="src">Textes : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », suivi, 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, « Syphilis », 2021, définition d’une variation significative</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, latence, 2021, interprétation à 24 mois</a>.</div></template>

<template data-pop="a53-pa-partenaires" data-title="Partenaires : ne pas importer la fenêtre d’un autre stade">
<p>La SSI propose de contacter les partenaires sexuels des 30 derniers jours pour une syphilis primaire et des six derniers mois pour une syphilis secondaire, avec tests et prise en charge adaptés. Ces périodes supposent que le stade soit établi. Pour une latence de durée inconnue, aucune de ces deux fenêtres ne peut être appliquée mécaniquement ; le clinicien reconstitue les expositions, discute tests et notification avec la personne et suit le circuit local. Une grossesse éventuelle accélère la prévention de la transmission fœtale.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », information et traitement des partenaires, 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, transmission verticale et latence</a>.</div></template>

<template data-pop="a53-pa-declaration" data-title="OFSP 2026 : déclaration du cas, d’un contrôle ou d’une cicatrice">
<div class="lab">Circuit et délai</div><p>Le Guide OFSP 2026 donne au médecin et au laboratoire chacun une semaine lorsque les critères correspondants sont remplis. Le médecin adresse son formulaire au médecin cantonal ; le laboratoire annonce ses résultats spécifiques positifs à l’OFSP. Un RPR isolé non confirmé par un test spécifique ne suffit pas à l’annonce de laboratoire.</p>
<div class="lab">Application au cas</div><p>Le TPPA positif est un résultat spécifique ; le laboratoire et le médecin vérifient leurs obligations de déclaration dans la semaine, même si l’histoire thérapeutique reste à retrouver. Le stade est documenté comme indéterminé au lieu d’inventer une primo-infection. Le guide prévoit que, lors d’un contrôle d’évolution ou d’une cicatrice sérologique établis, seule la partie « patient » du formulaire clinique est remplie avec la case correspondante. Une déclaration de contrôle d’évolution suppose une déclaration antérieure documentée pour le même cas.</p>
<div class="src">Source primaire : <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, « Syphilis », p. 109–111, tableau et critères détaillés</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="a53-pa-epidemiologie" data-title="OFSP 2024 : des cas déclarés, pas une prévalence individuelle">
<div class="lab">Numérateur et territoire</div><p>Le Bulletin OFSP 44/2025 recense 1042 cas de syphilis déclarés en 2024 en Suisse et au Liechtenstein, dont 776 classés précoces selon l’évaluation clinique du médecin. L’incidence déclarée de tous les cas atteint 11,6 pour 100 000 personnes. Ces nombres concernent l’ensemble des stades et deux territoires : ils ne mesurent pas spécifiquement la catégorie A53.</p>
<div class="lab">Limite de tendance</div><p>Depuis 2018, la statistique suisse retient les déclarations cliniques signalant le début d’un traitement pour un nouvel épisode non encore déclaré. La définition a changé ; l’OFSP refuse une comparaison directe des séries antérieures et postérieures à 2018. Le volume de dépistage influence aussi le nombre de cas repérés. Ces chiffres n’attribuent donc ni comportement ni stade à l’adulte du cas.</p>
<div class="src">Source primaire : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44 du 27 octobre 2025, « La syphilis en Suisse et au Liechtenstein en 2024 », p. 37–38, définition de cas et situation actuelle</a>.</div></template>

<template data-pop="a53-pa-primaire" data-title="Syphilis primaire : chancre et limite de la sérologie précoce">
<p>Le chancre apparaît au site d’inoculation, notamment génital ou oral. Il est souvent indolore et induré, mais l’IUSTI/EDF décrit aussi des lésions atypiques, multiples ou douloureuses. Une adénopathie régionale peut manquer ; une lésion disparue ne prouve pas que l’infection a disparu. Au début, la sérologie peut encore être négative : la SSI recommande une PCR de la lésion lorsqu’elle est accessible et que la technique est disponible.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique » et « Points importants »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 2–3, « Primary syphilis » et « Laboratory »</a>.</div></template>

<template data-pop="a53-pa-secondaire" data-title="Syphilis secondaire : la dissémination explique les signes multiples">
<p>Après la phase locale, la diffusion du tréponème peut produire une éruption cutanée parfois non prurigineuse, des lésions muqueuses, des adénopathies et des symptômes généraux. La SSI décrit aussi des atteintes d’organes. L’examen recherche donc la peau et les muqueuses, puis interroge l’œil, l’audition et le système nerveux. Aucun de ces signes n’est donné pour l’adulte TPPA positif et RPR 1:8 ; le titre ne les remplace pas.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique », syphilis secondaire</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 2–3, « Secondary syphilis »</a>.</div></template>

<template data-pop="a53-pa-presentations" data-title="Manifestations atypiques : ce qu’un signe absent ne permet pas d’exclure">
<p>Le chancre primaire est souvent discret, parfois non douloureux, mais il peut aussi être atypique. L’éruption secondaire peut varier et coexister avec des lésions muqueuses ou des signes généraux. Une atteinte neurologique, oculaire ou auditive est possible à plusieurs stades. L’absence d’une plainte ne suffit donc pas à qualifier une syphilis de latente ; cette catégorie suppose un examen clinique adapté et l’absence de signe actuel retenu.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 2–3, « Clinical manifestations »</a>.</div></template>

<template data-pop="a53-pa-examen" data-title="Examen ciblé : le site atteint décide du prélèvement et du stade">
<p>La peau, les paumes, les plantes et les muqueuses accessibles sont examinées avec le consentement de la personne. Une ulcération compatible peut motiver une recherche directe de <i>T. pallidum</i> par PCR, particulièrement si la sérologie est encore négative au début. Une éruption ou une lésion muqueuse actuelle fait discuter une syphilis secondaire plutôt qu’une simple latence. Un symptôme visuel ou auditif impose son examen spécialisé ; il ne se résume pas à une prise de sang.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique », « Diagnostic » et « Neurosyphilis »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 3 et 5–6, examens direct, neurologique, oculaire et auditif</a>.</div></template>
