<section class="ilot" id="a53-pa-0"><h2><span class="n">0</span>Question clinique : deux tests positifs, une histoire manquante</h2>
<p>Un adulte sans symptôme rapporté présente un TPPA positif et un RPR quantitatif à <b>1:8</b>. La date du dernier test négatif est inconnue. Aucune preuve d’un ancien traitement n’est disponible. Ces résultats témoignent d’une réaction tréponémique et non tréponémique, mais ne disent pas si l’infection est récente, ancienne non traitée, ou si un titre persiste après traitement. Le patient ne reçoit donc pas un stade ni une nouvelle cure sur la seule lecture des deux nombres. <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, « Syphilis », 2021, interprétation sérologique</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », diagnostic, validée le 13 juin 2024</a>.</p>
<p>Le médecin recherche les <button class="w" data-k="a53-pa-anciens">anciens résultats et traitements</button>, puis un chancre passé, une éruption, une exposition datable et un partenaire atteint. Il demande des symptômes neurologiques, visuels ou auditifs, et vérifie une grossesse éventuelle ainsi que le statut VIH. Un examen des muqueuses et de la peau cherche une maladie qui ne serait pas réellement latente. <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, « Latent Syphilis », 2021, évaluation avant stadification</a>.</p>
<div class="key"><b>À retenir.</b> Un RPR 1:8 sert de valeur de départ pour une comparaison ultérieure. Il ne donne ni la date de l’infection ni la preuve d’un échec thérapeutique.</div></section>

<section class="ilot" id="a53-pa-1"><h2><span class="n">1</span>Définition et codage : A53.0 n’est pas A53.9</h2>
<p>La CIM-10-GM 2024 du BfArM donne deux sous-codes directs à A53. Le <button class="w" data-k="a53-pa-codage">choix de code</button> dépend de ce que le dossier établit après anamnèse et examen. Le libellé administratif « réaction sérologique positive » inclus dans A53.0 ne transforme pas toute séropositivité, notamment après traitement, en infection active à traiter. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A53" target="_blank" rel="noopener" data-reference-source="1">BfArM, ICD-10-GM 2024, A53.0 et A53.9</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, persistance sérologique</a>.</p>
<div class="table-wrap"><table><thead><tr><th>Code CIM-10-GM</th><th>Libellé français du cours</th><th>Condition de lecture</th></tr></thead><tbody><tr><td>A53.0</td><td>Syphilis latente, sans précision de durée précoce ou tardive.</td><td>La latence est établie ; sa durée ne l’est pas.</td></tr><tr><td>A53.9</td><td>Syphilis, sans précision.</td><td>Le stade lui-même reste non caractérisé.</td></tr></tbody></table></div>
<p>Si le patient est bien sans manifestation et qu’une infection non traitée ou insuffisamment traitée est établie sans date fiable, A53.0 décrit une latence de durée inconnue. Si le stade demeure impossible à caractériser, A53.9 garde son sens. Une syphilis primaire, secondaire, tardive caractérisée ou congénitale relève d’autres rubriques A51, A52 ou A50. La <button class="w" data-k="a53-pa-cim11">CIM-11</button> possède une autre hiérarchie ; aucune équivalence automatique n’est déduite. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A53" target="_blank" rel="noopener" data-reference-source="1">BfArM 2024, A50–A53</a> ; <a href="https://icd.who.int/browse/2026-01/mms/fr#455894495" target="_blank" rel="noopener" data-reference-source="1">OMS, CIM-11 MMS française 2026-01, bloc syphilis</a>.</p>
<div class="key"><b>À retenir.</b> A53.0 précise la latence tout en laissant sa durée inconnue. A53.9 laisse aussi le stade indéfini. Le code suit le dossier, et non l’inverse.</div></section>

<section class="ilot" id="a53-pa-2"><h2><span class="n">2</span>Lire le TPPA et le RPR sans leur faire dater l’infection</h2>
<p>Le <button class="w" data-k="a53-pa-tppa">TPPA</button> est un test tréponémique qui peut rester positif longtemps après un traitement réussi. Le <button class="w" data-k="a53-pa-rpr">RPR quantitatif</button> mesure une réaction non tréponémique dont la valeur peut changer avec l’infection et le traitement. Un titre bas peut persister, phénomène dit <button class="w" data-k="a53-pa-serofast">sérofixation</button>. La SSI appelle le RPR « test d’activité » ; cette simplification doit être lue avec l’histoire, car TPPA positif et RPR 1:8 ne distinguent pas à eux seuls une infection active non traitée d’une réponse sérologique persistante. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, tests tréponémiques et non tréponémiques</a>.</p>
<p>Le médecin compare les anciens titres mesurés avec la même méthode et vérifie la date, le laboratoire et les traitements. Une augmentation durable d’un <button class="w" data-k="a53-pa-quatrefois">facteur quatre</button> par rapport au titre antérieur peut changer l’interprétation ; un seul 1:8 sans valeur de comparaison ne le peut pas. L’onglet « Examens complémentaires » détaille le parcours de confirmation et les limites préanalytiques. <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, comparaison des titres</a>.</p>
<button class="pareto-btn ui" data-k="a53-pa-pareto-serologie">▲ Loi de Pareto — Ce que 1:8 ne peut pas conclure</button>
<div class="key"><b>À retenir.</b> Les deux tests appellent une enquête clinique et documentaire. Le titre 1:8 devient utile lorsque sa valeur antérieure ou sa trajectoire future est connue.</div></section>

<section class="ilot" id="a53-pa-3"><h2><span class="n">3</span>Reconstruire la chronologie et examiner les sites accessibles</h2>
<p>Le clinicien demande les dates de tests tréponémiques et RPR antérieurs, leurs valeurs exactes, les comptes rendus de traitement et la survenue d’un chancre, d’une éruption ou d’une lésion muqueuse. Il recherche les partenaires diagnostiqués et l’intervalle de toutes les expositions plausibles. Une <button class="w" data-k="a53-pa-recente">latence précoce</button> exige une preuve compatible avec une acquisition dans l’année précédente ; le titre RPR seul ne suffit jamais. Sans ces éléments, la durée reste inconnue même si le patient se souvient d’un contact récent. <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, latence, 2021, critères de datation</a>.</p>
<p>L’examen inspecte les surfaces muqueuses accessibles, notamment bouche, organes génitaux et région périanale, et recherche une éruption touchant les paumes ou les plantes. Un chancre peut avoir guéri spontanément ; son absence actuelle n’exclut donc pas une phase passée. Une lésion ou un syndrome compatible actuellement ferait revoir l’étiquette « latente ». L’absence de symptôme <em>rapporté</em> dans le cas n’équivaut pas encore à un examen négatif documenté. <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, examen avant diagnostic de latence</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique</a>.</p>
<div class="key"><b>À retenir.</b> Une date fiable repose sur un résultat, un syndrome ou une exposition compatible documentés. L’examen confirme qu’aucune manifestation actuelle n’impose un autre parcours.</div></section>

<section class="ilot" id="a53-pa-4"><h2><span class="n">4</span>Neuro, œil et audition : ne pas traiter une atteinte d’organe comme une simple latence</h2>
<p>Le médecin demande céphalées inhabituelles, trouble cognitif, déficit moteur ou sensitif, baisse de vision, douleur ou rougeur oculaire, baisse d’audition et acouphènes. Il recherche les signes neurologiques à l’examen. Une atteinte du système nerveux, de l’œil ou de l’oreille peut survenir à différents stades et change l’évaluation ainsi que le traitement ; une benzathine pénicilline retard intramusculaire destinée à la latence ne remplace pas le schéma de neurosyphilis. Les <button class="w" data-k="a53-pa-alarme">symptômes d’alarme</button> conduisent à un avis ciblé rapide. <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, neurosyphilis, syphilis oculaire et otique, 2021</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, neurosyphilis</a>.</p>
<p>Une <button class="w" data-k="a53-pa-pl">ponction lombaire</button> n’est pas automatique devant RPR 1:8 et absence de signe neurologique. La SSI 2024 cite des seuils VIH/CD4 et RPR dans une section concernant la syphilis secondaire ; le CDC 2021 ne constate pas de bénéfice à une ponction fondée sur ces seuls paramètres VIH sans manifestation neurologique. Cette divergence demande un avis spécialisé si elle devient pertinente. Elle ne s’applique pas mécaniquement au patient asymptomatique non encore stadifié. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, indications de PL</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-hiv.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, syphilis et VIH</a>.</p>
<div class="key"><b>À retenir.</b> Un symptôme neurologique, visuel ou auditif ouvre un bilan spécifique. Le titre RPR seul ne décide pas d’une ponction.</div></section>

<section class="ilot" id="a53-pa-5"><h2><span class="n">5</span>Attribuer la latence et séparer clinique, codage et surveillance</h2>
<p>Le CDC classe une latence comme précoce lorsque des éléments précis démontrent l’acquisition au cours des douze derniers mois. En l’absence de ces éléments, la personne asymptomatique est évaluée comme latente tardive ou de durée inconnue pour la décision thérapeutique. Cette règle ne signifie pas qu’une infection de durée inconnue est biologiquement âgée de plus d’un an. Le <button class="w" data-k="a53-pa-stades">tableau des décisions par stade</button> garde les trois questions distinctes : infection encore à traiter, durée démontrée, atteinte d’organe. <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, classification de la latence</a>.</p>
<p>Le <button class="w" data-k="a53-pa-ofsp-classe">Guide OFSP 2026</button> emploie, pour la surveillance, une catégorie de latence tardive incluant certaines durées inconnues lorsque le titre non tréponémique atteint au moins 1:32. Cette règle administrative ne date pas une infection et ne crée pas une indication de traitement à partir d’un chiffre. Le 1:8 du cas est inférieur à ce seuil, sans démontrer une acquisition récente. La CIM-10-GM A53.0 conserve la notion de latence dont la durée n’est pas précisée. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, « Syphilis », p. 110–111</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A53" target="_blank" rel="noopener" data-reference-source="1">BfArM A53.0</a>.</p>
<div class="key"><b>À retenir.</b> Le stade clinique guide le soin, le code décrit le dossier, et la définition OFSP organise la surveillance. Aucun de ces trois usages n’autorise à dater ce cas à partir de 1:8.</div></section>

<section class="ilot" id="a53-pa-6"><h2><span class="n">6</span>Traiter seulement après avoir établi ce qui reste à traiter</h2>
<p>Si un ancien traitement adéquat est prouvé et si l’histoire ainsi que les titres restent compatibles avec une sérofixation, le résultat actuel ne suffit pas à prescrire une nouvelle cure. Si une <b>syphilis latente non traitée ou insuffisamment traitée de durée inconnue</b> est établie, le CDC recommande <button class="w" data-k="a53-pa-traitement">benzathine pénicilline G 2,4 millions d’unités par voie intramusculaire chaque semaine pendant trois semaines</button>. La SSI recommande également trois doses hebdomadaires pour la syphilis latente tardive ; sa page ne nomme pas explicitement la durée inconnue. Les modalités exactes du produit suisse et son stock sont vérifiés avant administration. <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, latence tardive ou de durée inconnue</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, traitement</a>.</p>
<p>Une infection documentée comme précoce suit un autre schéma ; elle ne peut pas être déduite du titre 1:8. Une grossesse, une <button class="w" data-k="a53-pa-allergie">allergie aux pénicillines</button>, une atteinte neurologique, oculaire ou auditive changent la conduite et imposent une évaluation adaptée. La SSI 2024 et le CDC 2021 divergent sur la durée d’une alternative orale dans la latence de durée inconnue ; elle n’est donc pas substituée automatiquement. Une <button class="w" data-k="a53-pa-jarisch">réaction de Jarisch–Herxheimer</button> peut suivre le traitement et doit être expliquée. <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, alternatives et grossesse</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, allergie et réaction</a>.</p>
<button class="pareto-btn ui" data-k="a53-pa-pareto-decision">▲ Loi de Pareto — Trois conditions avant la cure</button>
<div class="key"><b>À retenir.</b> Le schéma de durée inconnue n’est choisi que si une infection à traiter est établie. Un ancien traitement, une grossesse et une atteinte d’organe peuvent modifier cette décision.</div></section>

<section class="ilot" id="a53-pa-7"><h2><span class="n">7</span>Mesurer la réponse avec le même type de titre</h2>
<p>Si un traitement est entrepris, le RPR quantitatif avant la première dose sert de référence. La SSI propose des contrôles à <b>3, 6, 12 et 24 mois</b> ; le CDC précise <b>6, 12 et 24 mois</b> pour la latence. La comparaison utilise le même type de test, idéalement le même laboratoire, car le TPPA reste souvent positif et n’est pas un marqueur de réponse. Le <button class="w" data-k="a53-pa-suivi">calendrier et ses limites</button> distingue les deux textes. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, suivi</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, suivi de la latence</a>.</p>
<p>Une variation significative de RPR est un <button class="w" data-k="a53-pa-discordance-rpr">facteur quatre, soit deux dilutions</button>, par exemple 1:8 vers 1:2. La SSI écrit « quatre titrations, soit 1/16 » à six mois : cette formulation correspond mathématiquement à un facteur seize si « titration » signifie dilution par deux, et ne doit pas devenir un seuil mécanique d’échec. Le délai de baisse varie ; une réponse insuffisante, un titre qui remonte ou de nouveaux signes conduisent à reprendre l’histoire, le risque de réinfection, le VIH et l’examen neurologique. <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, définition du changement sérologique</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, texte du suivi</a>.</p>
<div class="key"><b>À retenir.</b> La trajectoire du RPR, les symptômes et les expositions guident le suivi. Un seul contrôle ou un calcul ambigu n’autorise pas à annoncer un échec.</div></section>

<section class="ilot" id="a53-pa-8"><h2><span class="n">8</span>Partenaires, VIH, grossesse et déclaration suisse</h2>
<p>Le médecin propose un test VIH et recherche d’autres IST selon les expositions. Il vérifie une grossesse éventuelle, car une syphilis latente peut atteindre le fœtus même lorsque l’adulte ne présente aucun symptôme. Le <button class="w" data-k="a53-pa-partenaires">rappel des partenaires</button> dépend du stade et des contacts réellement documentés : la SSI donne 30 jours pour une syphilis primaire et six mois pour une syphilis secondaire. Ces fenêtres ne se transposent pas automatiquement à une latence de durée inconnue. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et partenaires</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, grossesse et VIH</a>.</p>
<p>Le <button class="w" data-k="a53-pa-declaration">Guide OFSP 2026</button> fixe un délai d’une semaine pour le médecin et le laboratoire lorsque leurs critères de déclaration sont remplis. Le TPPA positif du cas est un résultat spécifique : l’équipe vérifie sans attendre les annonces dues et documente le stade comme encore indéterminé tant que l’histoire manque. Un RPR isolé non confirmé ne serait pas déclaré par le laboratoire. Si une cicatrice sérologique ou un contrôle est ensuite établi, le formulaire clinique suit ces rubriques plutôt que de créer une première infection fictive. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, « Syphilis », p. 109–111</a>.</p>
<div class="key"><b>À retenir.</b> Les partenaires et la déclaration suivent les faits établis. La grossesse et le VIH sont recherchés parce qu’ils modifient les risques et le parcours.</div></section>

<section class="ilot" id="a53-pa-9"><h2><span class="n">9</span>Décision provisoire pour cet adulte</h2>
<p>Les données disponibles ne prouvent ni une primo-infection récente ni une syphilis encore à traiter. Le clinicien obtient les anciens tests, titres et traitements, examine la peau et les muqueuses, recherche symptômes neurologiques, oculaires et auditifs, puis documente VIH et grossesse selon le patient. Si une latence non déjà traitée est finalement retenue sans date fiable, A53.0 et le schéma de durée inconnue deviennent pertinents ; si un traitement adéquat antérieur et une sérofixation sont démontrés, la décision est différente. Si un signe d’organe apparaît, son parcours spécialisé prime. <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, latence et décision</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, atteintes d’organe</a>.</p>
<div class="key"><b>Pour le cas.</b> TPPA positif et RPR 1:8 constituent un point de départ documenté. La datation, l’existence d’un traitement antérieur et le besoin d’une nouvelle cure restent ouverts.</div></section>
</div></div>
