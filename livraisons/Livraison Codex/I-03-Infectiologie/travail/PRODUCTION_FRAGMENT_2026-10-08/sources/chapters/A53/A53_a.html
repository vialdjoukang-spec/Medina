<section class="ilot" id="a53-pa-0"><h2><span class="n">0</span>Question clinique : que disent vraiment deux tests positifs ?</h2>
<p>Un adulte sans symptôme rapporté présente un TPPA positif et un RPR quantitatif à <b>1:8</b>. La date du dernier test négatif est inconnue et aucun ancien traitement n’est documenté. Les deux résultats soutiennent une sérologie syphilitique réactive. Ils ne datent pas l’acquisition et ne démontrent ni guérison antérieure ni échec d’une cure. Le <button class="w" data-k="a53-pa-rpr">titre 1:8</button> est une mesure ponctuelle, sans trajectoire. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », diagnostic, 13.06.2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, directive finale 2020, p. 3–4, « Laboratory »</a>.</p>
<p>Le médecin recherche rapidement les <button class="w" data-k="a53-pa-anciens">preuves d’une cure adéquate et les anciens titres</button>, puis examine la personne. Selon l’IUSTI/EDF 2020, une sérologie positive appelle une prise en charge <b>par précaution si aucun traitement antérieur adéquat n’est documenté</b>. L’enquête permet de choisir le stade et le schéma ; elle ne doit pas devenir une attente indéfinie d’une preuve impossible d’absence de traitement. Une cure adéquate antérieure documentée conduit au contraire à interpréter le titre avec l’évolution et les expositions. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF, finale 2020, p. 3, « Serological tests for syphilis », recommandation 1,D</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Diagnostic » et « Traitement »</a>.</p>
<div class="key"><b>À retenir.</b> Le résultat appelle une enquête courte et un examen. Sans cure adéquate documentée après cette évaluation, le risque d’une infection non traitée commande une décision thérapeutique de précaution, adaptée au stade clinique.</div></section>

<section class="ilot" id="a53-pa-1"><h2><span class="n">1</span>Définition : une infection systémique dont les stades se recouvrent</h2>
<p>La syphilis est une infection due à <em>Treponema pallidum</em> subspecies <em>pallidum</em>. Son évolution acquise associe une phase primaire locale, une phase secondaire disséminée, puis une latence sans manifestation clinique. Certaines atteintes tardives touchent le système cardiovasculaire ou d’autres organes. Une atteinte neurologique, oculaire ou auditive peut survenir à différents stades : « tardive » n’est donc pas synonyme de « neurologique ». <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 1–3, « Introduction » et « Clinical manifestations »</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique »</a>.</p>
<p>Le tableau distingue les manifestations qui changent immédiatement le bilan. Il ne permet pas de dater une infection sur un signe isolé : les phases peuvent se chevaucher et une lésion passée peut avoir disparu. <button class="w" data-k="a53-pa-stades">La chronologie documentée</button> est nécessaire pour qualifier la latence de précoce. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2, « Clinical manifestations »</a>.</p>
<div class="table-wrap"><table class="t"><thead><tr><th>Situation clinique</th><th>Ce qui la caractérise</th><th>Ce que cela change</th></tr></thead><tbody><tr><td>Primaire</td><td>Un chancre, parfois oral ou génital, peut être discret ou atypique.</td><td>Une sérologie très précoce peut encore être négative ; une lésion accessible permet une PCR.</td></tr><tr><td>Secondaire</td><td>Une dissémination peut produire éruption, lésions muqueuses et signes généraux.</td><td>L’examen recherche aussi les atteintes neurologiques, oculaires et auditives.</td></tr><tr><td>Latente</td><td>Les tests sont réactifs sans manifestation clinique actuelle après examen.</td><td>La preuve de la date d’acquisition sépare la latence précoce de la durée inconnue.</td></tr><tr><td>Tertiaire</td><td>Une atteinte cardiovasculaire ou gommeuse peut apparaître tardivement.</td><td>Le bilan recherche aussi une atteinte neurologique avant le choix du schéma.</td></tr><tr><td>Neuro, œil ou audition</td><td>Une atteinte de ces organes peut survenir à différents stades.</td><td>Un examen spécialisé et un schéma antibiotique distinct sont nécessaires.</td></tr></tbody></table></div>
<p>Chez l’adulte du cas, « asymptomatique » n’est qu’une donnée rapportée : seul l’examen peut étayer la latence. Sa durée reste inconnue faute de date fiable. Le <button class="w" data-k="a53-pa-recente">titre RPR 1:8 ne définit pas la latence précoce</button>. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2, critères de latence</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique »</a>.</p>
<div class="key"><b>À retenir.</b> Les stades sont des descriptions cliniques et chronologiques. Une atteinte d’organe peut traverser ces stades et demande une décision distincte.</div></section>

<section class="ilot" id="a53-pa-2"><h2><span class="n">2</span>Épidémiologie : lire les données suisses avec leur définition</h2>
<p>L’OFSP a recensé <b>1042 cas déclarés inclus dans la surveillance</b> de syphilis en <b>Suisse et au Liechtenstein</b> pour 2024, soit <b>11,6 pour 100 000 personnes</b>. Parmi eux, <b>776</b> étaient classés « précoces » d’après l’estimation clinique du médecin. Cette série de surveillance comprend les épisodes pour lesquels un nouveau traitement a été annoncé ; elle n’est ni la prévalence de toutes les sérologies positives ni un risque individuel applicable à cet adulte. <button class="w" data-k="a53-pa-epidemiologie">La définition de la série</button> importe autant que son chiffre. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27.10.2025, « La syphilis en Suisse et au Liechtenstein en 2024 », p. 37–38</a>.</p>
<p>Les diagnostics déclarés concernaient principalement des hommes ayant des rapports sexuels avec des hommes. L’OFSP indique aussi que le volume des tests et les changements de définition modifient la lecture des tendances. L’anamnèse de chaque personne reste individuelle : aucune orientation sexuelle, exposition ou date d’acquisition n’est fournie pour le cas. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, p. 37–41, « Situation actuelle » et « Répartition par voie d’infection »</a>.</p>
<div class="key"><b>À retenir.</b> Les chiffres décrivent des épisodes déclarés en Suisse et au Liechtenstein. Ils justifient une vigilance clinique sans attribuer de comportement au patient.</div></section>

<section class="ilot" id="a53-pa-3"><h2><span class="n">3</span>Transmission et mécanismes : du contact à la dissémination</h2>
<p>Le tréponème se transmet surtout par contact sexuel avec des lésions infectieuses. Il traverse la peau ou une muqueuse exposée, puis peut se disséminer par voie sanguine. Ce passage explique la succession possible d’un <button class="w" data-k="a53-pa-primaire">chancre local</button> et d’une <button class="w" data-k="a53-pa-secondaire">maladie secondaire multisystémique</button>. Une personne enceinte infectée peut transmettre l’agent au fœtus, même sans signe maternel de latence. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 1–2, « Introduction » et « Clinical manifestations » ; p. 8, « Pregnancy »</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique »</a>.</p>
<p>Le <button class="w" data-k="a53-pa-tppa">TPPA</button> détecte une réponse spécifique qui persiste souvent après guérison. Le RPR mesure une réponse non tréponémique dont la trajectoire aide au suivi. Cette différence biologique explique pourquoi une double réactivité actuelle ne suffit ni à dater l’infection ni à établir que le tréponème persiste malgré une ancienne cure. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 3–4, « Laboratory »</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Diagnostic »</a>.</p>
<div class="key"><b>À retenir.</b> La dissémination relie les manifestations locales et systémiques. Les deux familles de tests décrivent une réponse immunitaire, qui doit être confrontée à la clinique.</div></section>

<section class="ilot" id="a53-pa-4"><h2><span class="n">4</span>Présentations : l’absence de plainte ne suffit pas à conclure</h2>
<p>Le chancre primaire est souvent indolore et peut passer inaperçu, notamment sur une muqueuse peu visible. La syphilis secondaire peut provoquer une éruption non prurigineuse, des lésions muqueuses, une adénopathie ou des signes généraux. Une latence n’a, par définition, pas de manifestation clinique actuelle ; elle reste une conclusion après examen, et non une simple réponse « je n’ai rien ». <button class="w" data-k="a53-pa-presentations">Les formes atypiques</button> empêchent d’utiliser un signe unique comme test d’exclusion. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–3, « Clinical manifestations »</a>.</p>
<p>Une syphilis tardive peut avoir des manifestations cardiovasculaires ou gommeuses. Une neurosyphilis, une atteinte oculaire ou une atteinte auditive peuvent cependant survenir avant cette période ; l’<button class="w" data-k="a53-pa-alarme">alerte d’organe</button> dépend des symptômes actuels, et non d’un RPR plus ou moins élevé. Chez la personne du cas, aucune de ces présentations n’est établie ni exclue par les données fournies. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–3, « Clinical manifestations » ; p. 5–6, bilan neurologique et oculaire</a>.</p>
<div class="key"><b>À retenir.</b> Une plainte absente ne remplace pas l’examen. La recherche de lésions et d’atteintes d’organe ouvre la stadification.</div></section>

<section class="ilot" id="a53-pa-5"><h2><span class="n">5</span>Anamnèse : reconstruire le temps et le soin reçu</h2>
<p>Le médecin demande les tests antérieurs datés, leur méthode, les titres RPR, les comptes rendus de traitements et toute réaction aux pénicillines. Il précise chancre ou éruption passés, partenaire diagnostiqué et période des expositions plausibles. Un test négatif certain suivi d’une séroconversion dans l’année a une valeur de datation ; un souvenir de contact récent n’exclut pas une infection plus ancienne. Une <button class="w" data-k="a53-pa-recente">latence précoce</button> demande une preuve temporelle crédible. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2, critères de latence précoce</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Diagnostic »</a>.</p>
<p>Il demande aussi symptômes neurologiques, visuels et auditifs, statut VIH, autres IST selon les pratiques et possibilité de grossesse. Ces questions changent l’urgence, les examens ou le traitement. Chez l’adulte présenté, aucun de ces résultats n’est donné. Le <button class="w" data-k="a53-pa-anciens">traitement passé doit être vérifié rapidement</button> ; s’il reste non documenté, la règle de précaution IUSTI conduit à traiter la syphilis évaluée plutôt qu’à attendre sans échéance. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 3, traitement par précaution ; p. 5, examen ; p. 8, grossesse</a>.</p>
<div class="key"><b>À retenir.</b> La date et la qualité d’une ancienne cure pèsent plus qu’un titre isolé. L’anamnèse cherche en même temps les branches qui imposent un traitement différent.</div></section>

<section class="ilot" id="a53-pa-6"><h2><span class="n">6</span>Examen : rechercher la maladie actuelle et les atteintes d’organe</h2>
<p>Le médecin inspecte la peau, les paumes, les plantes et les muqueuses accessibles, dont la bouche, les organes génitaux et la région périanale selon le contexte et le consentement. Il recherche un chancre, des lésions muqueuses, une éruption et des adénopathies. Cet examen évite de qualifier « latente » une infection dont une manifestation actuelle était simplement méconnue. <button class="w" data-k="a53-pa-examen">La topographie d’une lésion</button> guide aussi un éventuel prélèvement direct. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique » et « Diagnostic »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2 et 5, examen clinique</a>.</p>
<p>L’examen neurologique apprécie état cognitif, nerfs crâniens, motricité et sensibilité. Une plainte visuelle appelle un examen ophtalmologique rapide ; une baisse auditive ou des symptômes vestibulaires appellent une évaluation ORL. Le test sanguin 1:8 n’exclut aucune de ces atteintes. Chez cet adulte, les constatations de l’examen restent à recueillir. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 5–6, investigation neurologique, oculaire et auditive</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Suivi et diagnostic/exclusion de la neurosyphilis »</a>.</p>
<div class="key"><b>À retenir.</b> L’examen décide si une latence est plausible et si un organe exige un autre parcours. Le cas ne devient « asymptomatique examiné » qu’après cette étape.</div></section>

<section class="ilot" id="a53-pa-7"><h2><span class="n">7</span>Diagnostic et stade : rapprocher sérologie, clinique et chronologie</h2>
<p>Le <button class="w" data-k="a53-pa-tppa">test tréponémique</button> soutient l’exposition à <em>T. pallidum</em> et reste souvent réactif après traitement. Le <button class="w" data-k="a53-pa-rpr">RPR quantitatif</button> sert de référence évolutive lorsque la méthode est comparable. Devant une lésion précoce et une sérologie encore négative, la SSI propose une PCR du chancre disponible. Dans le cas donné, TPPA et RPR sont positifs : l’incertitude porte sur l’histoire et le stade, pas sur la simple présence d’un deuxième test. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Points importants » et « Diagnostic »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 3–4, « Laboratory »</a>.</p>
<p>Une latence précoce exige une acquisition crédible dans les douze derniers mois ; sans preuve et après examen négatif, la durée est inconnue pour le soin. Une <button class="w" data-k="a53-pa-serofast">persistance après traitement</button> ne peut être affirmée qu’avec la cure et les anciens titres documentés. Le RPR 1:8 n’est ni une horloge ni, seul, un « faible titre » autorisant ce diagnostic. <button class="w" data-k="a53-pa-ofsp-classe">La catégorie de surveillance OFSP</button> répond à une autre question que la stadification thérapeutique. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2 et 11, latence et suivi</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide 2026, « Syphilis », p. 109–111</a>.</p>
<p>Après le diagnostic clinique, le <button class="w" data-k="a53-pa-codage">code A53.0 ou A53.9</button> décrit le niveau de précision du dossier ; il ne prescrit pas une cure. La <button class="w" data-k="a53-pa-cim11">CIM-11</button> a sa propre hiérarchie. Chez ce patient, l’examen et l’historique manquent encore pour choisir le libellé le plus précis. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A53" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, A53</a>.</p>
<button class="pareto-btn ui" data-k="a53-pa-pareto-serologie">▲ Loi de Pareto — Sérologie et stade</button>
<div class="key"><b>À retenir.</b> Les tests confirment une réaction, l’examen distingue maladie manifeste et latence, puis l’histoire fixe la durée. Le code vient après cette décision clinique.</div></section>

<section class="ilot" id="a53-pa-8"><h2><span class="n">8</span>Signaux de gravité : l’organe atteint prime sur le titre</h2>
<p>Un déficit neurologique, des signes méningés, une atteinte cognitive nouvelle ou un syndrome vasculaire demandent un bilan urgent. Une baisse visuelle, une inflammation oculaire, une baisse auditive ou des symptômes vestibulaires conduisent à une évaluation spécialisée rapide. Une <button class="w" data-k="a53-pa-alarme">atteinte neurologique, oculaire ou auditive</button> peut survenir à différents stades et impose un traitement qui atteint ces tissus ; la benzathine pénicilline retard IM seule n’est pas le schéma de neurosyphilis. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 5–7 et tableau 1</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Traitement » et « Neurosyphilis »</a>.</p>
<p>La <button class="w" data-k="a53-pa-pl">ponction lombaire</button> dépend du tableau clinique. La SSI 2024 cite certains critères VIH et RPR dans sa section de syphilis secondaire ; l’IUSTI 2020 discute d’autres situations, tandis que le CDC 2021 limite certaines ponctions sans signe neurologique. Ces divergences ne transforment pas le seul RPR 1:8 de l’adulte non stadifié en indication de ponction. L’avis spécialisé tranche si une atteinte d’organe ou un contexte VIH devient réel. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Suivi et diagnostic/exclusion de la neurosyphilis »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 5–6</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, divergence oculaire et auditive</a>.</p>
<div class="key"><b>À retenir.</b> Les signes d’organe et la grossesse changent l’urgence. Un titre sanguin isolé ne confirme ni n’exclut ces atteintes.</div></section>

<section class="ilot" id="a53-pa-9"><h2><span class="n">9</span>Prise en charge : le stade détermine la voie et la durée</h2>
<p>La SSI 2024 recommande la benzathine pénicilline G <b>2,4 millions d’unités internationales (MUI) IM en une administration</b> pour les formes primaire, secondaire et latente précoce documentée. Pour la latence tardive et la syphilis tertiaire sans indication de traitement neurologique, elle recommande <b>2,4 MUI IM aux jours 1, 8 et 15</b>. L’IUSTI/EDF final 2020 étend explicitement ces trois doses à la <button class="w" data-k="a53-pa-traitement">latence de durée inconnue</button>. Une atteinte neurologique, oculaire ou auditive suit un traitement parentéral spécifique ; la SSI cite la pénicilline G IV pour la neurosyphilis. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Traitement »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2, tableau 1 ; p. 7, « Recommended treatment regimens »</a>.</p>
<p>Le médecin vérifie une cure adéquate passée et le stade sans retarder indéfiniment la prise en charge : l’IUSTI/EDF conseille de traiter par précaution en l’absence d’ancien traitement adéquat documenté. Pour le patient du cas, si l’examen confirme une latence, si aucune cure adéquate n’est documentée et si aucune preuve d’acquisition dans l’année n’apparaît, le schéma de durée inconnue devient la conduite de référence ; ce raisonnement ne date pas réellement l’infection. Une cure adéquate prouvée avec titres compatibles change l’indication. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–3 et 7, précaution et durée inconnue</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Diagnostic » et « Traitement »</a>.</p>
<p>La préparation et la voie de l’Extencilline suisse relèvent de son <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">information professionnelle Swissmedic n° 69765, consultée le 08.10.2026</a> : la suspension est administrée en IM profonde stricte, jamais en IV. Les volumes de reconstitution dépendent du flacon délivré et ne se déduisent pas du volume cité dans une ancienne page de recommandation. L’onglet pharmacologie détaille ce contrôle de produit. Une <button class="w" data-k="a53-pa-allergie">allergie réelle</button> ou une grossesse demande un choix distinct. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Extencilline, « Posologie » et « Mode d’administration »</a>.</p>
<button class="pareto-btn ui" data-k="a53-pa-pareto-decision">▲ Loi de Pareto — Avant le traitement</button>
<div class="key"><b>À retenir.</b> Le traitement précoce prouvé, la durée inconnue et l’atteinte d’organe n’utilisent pas le même parcours. L’absence d’ancien traitement adéquat documenté déclenche une décision de précaution après évaluation rapide.</div></section>

<section class="ilot" id="a53-pa-10"><h2><span class="n">10</span>Suivi et prévention : comparer une trajectoire, protéger les partenaires</h2>
<p>Avant une première dose indiquée, un RPR quantitatif daté sert de référence. La SSI propose des contrôles à <b>3, 6, 12 et 24 mois</b> ; on compare de préférence le même test et le même laboratoire. Une baisse de 1:8 à 1:2 correspond à un <button class="w" data-k="a53-pa-quatrefois">facteur quatre, soit deux dilutions</button>. Le TPPA peut rester positif longtemps et ne mesure pas la réponse. Le <button class="w" data-k="a53-pa-suivi">calendrier du suivi</button> dépend aussi du stade. La <button class="w" data-k="a53-pa-discordance-rpr">phrase SSI « quatre titrations, soit 1/16 »</button> est arithmétiquement ambiguë ; elle ne doit pas devenir un seuil d’échec universel à six mois. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Suivi »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 10–11, suivi sérologique</a>.</p>
<p>Un titre qui remonte durablement, de nouveaux signes ou une nouvelle exposition obligent à distinguer réinfection, réponse insuffisante et atteinte d’organe. Une persistance ne reçoit le nom de <button class="w" data-k="a53-pa-serofast">sérofixation</button> qu’après une cure adéquate et une trajectoire documentées ; <b>1:8 seul n’a pas ce statut</b>. La SSI recommande d’<button class="w" data-k="a53-pa-partenaires">informer et tester les partenaires</button> avec des fenêtres propres à la syphilis primaire et secondaire ; ces délais ne s’appliquent pas mécaniquement à une durée inconnue. Elle demande d’éviter les rapports sexuels jusqu’à la fin du traitement. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 10–11, suivi et sérofixation</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Information et traitement des partenaires »</a>.</p>
<p>La <button class="w" data-k="a53-pa-declaration">déclaration suisse</button> suit les critères distincts du médecin et du laboratoire, avec un délai d’une semaine lorsque ces critères sont remplis. Le stade n’est pas inventé pour remplir un formulaire ; une cicatrice sérologique documentée a sa rubrique. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de déclaration obligatoire 2026, « Syphilis », p. 109–111</a>.</p>
<div class="key"><b>À retenir.</b> Le suivi compare des titres datés et le contexte clinique. La prévention articule partenaires, rapports sexuels et déclaration selon le stade effectivement établi.</div></section>

<section class="ilot" id="a53-pa-11"><h2><span class="n">11</span>Situations particulières : grossesse, VIH, allergie et réaction précoce</h2>
<p>Une grossesse éventuelle est vérifiée sans délai : une infection maternelle non traitée peut atteindre le fœtus même en l’absence de symptômes. La pénicilline est le traitement de référence pendant la grossesse ; une allergie vraie nécessite une évaluation spécialisée et, selon l’IUSTI/EDF et le CDC, une désensibilisation suivie de pénicilline plutôt qu’une substitution orale non validée pour prévenir la syphilis congénitale. Ce patient n’a aucun statut de grossesse donné. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2 et 8, « Pregnancy »</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-pregnancy.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, complément « Syphilis During Pregnancy »</a>.</p>
<p>Le statut VIH est recherché, car il oriente l’évaluation et le suivi ; une co-infection n’autorise pas à dater la syphilis par le seul RPR. En cas d’allergie aux pénicillines, la SSI 2024 propose doxycycline 14 jours dans une rubrique latente générale, tandis que l’IUSTI/EDF 2020 propose <b>21 à 28 jours</b> et le CDC 2021 <b>28 jours</b> pour la latence tardive ou de durée inconnue. La <button class="w" data-k="a53-pa-allergie">divergence est expliquée en fenêtre</button> : aucune durée orale n’est substituée automatiquement pour l’adulte du cas. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Traitement » → « Allergie à la pénicilline »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2 et 7, alternatives</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, « Penicillin Allergy »</a>.</p>
<p>Une <button class="w" data-k="a53-pa-jarisch">réaction de Jarisch–Herxheimer</button> peut provoquer fièvre et signes généraux dans les heures suivant le traitement. Elle survient après le traitement et s’accompagne d’une réponse inflammatoire. Elle ne suffit pas à diagnostiquer une allergie ; des signes d’anaphylaxie demandent une évaluation urgente. En grossesse, l’équipe anticipe aussi les conséquences fœtales d’une réaction fébrile. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Traitement »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 9, « Reactions to treatment »</a>.</p>
<div class="key"><b>À retenir.</b> Grossesse, atteinte d’organe et allergie vraie modifient le choix du traitement. Une donnée non fournie dans le cas reste une question à résoudre.</div></section>

<section class="ilot" id="a53-pa-12"><h2><span class="n">12</span>Synthèse : décision conditionnelle pour l’adulte TPPA positif, RPR 1:8</h2>
<p>La sérologie est réactive, mais l’ancienneté, l’existence d’une cure adéquate, l’examen et les situations particulières sont encore inconnus. Le médecin vérifie rapidement les documents, inspecte peau et muqueuses, recherche signes neurologiques, visuels et auditifs, et clarifie VIH et grossesse lorsque pertinents. Aucun diagnostic de syphilis primaire, secondaire, neurosyphilis, réinfection ou sérofixation ne découle de 1:8 seul. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, « Clinique » et « Diagnostic »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–5</a>.</p>
<p>Si une cure adéquate antérieure est documentée, les anciens titres et expositions guident la suite. Si aucune cure adéquate ne peut être documentée après cette évaluation, l’IUSTI/EDF recommande de traiter par précaution. Si l’examen confirme une latence sans date d’acquisition dans l’année ni atteinte d’organe, les trois doses hebdomadaires de benzathine pénicilline G constituent le schéma de durée inconnue ; la grossesse ou une atteinte d’organe ouvre un autre parcours. Le <button class="w" data-k="a53-pa-codage">codage</button> vient après la caractérisation : A53.0 décrit une latence non précisée précoce ou tardive et A53.9 une syphilis sans stade précisé. <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI/EDF 2020, p. 2–3 et 7</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm#A53" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, A53</a>.</p>
<div class="key"><b>Pour ce cas.</b> Le TPPA et le RPR ouvrent une évaluation rapide, puis une décision de précaution si l’ancien traitement adéquat n’est pas documenté. Le titre 1:8 ne fournit ni date, ni diagnostic d’échec, ni autorisation d’ignorer des symptômes d’organe.</div></section>
