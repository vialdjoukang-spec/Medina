<section class="ilot" id="a53-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p><b>Cas fil rouge.</b> M. R., 34 ans, consulte à Lausanne pour une éruption non prurigineuse du tronc, des paumes et des plantes, apparue depuis dix jours, avec fébricule et fatigue. Sept semaines plus tôt, il a remarqué sur le sillon balano-préputial une petite ulcération indolore, disparue seule en trois semaines. Il a des rapports sexuels avec des hommes, sans préservatif, avec plusieurs partenaires. Le dépistage montre un TPPA positif et un RPR à 1:64. Ce cas est fictif ; il sert le raisonnement du cours.</p>
<p>La question clinique est triple. Quel stade explique ce tableau ? Quels organes faut-il examiner avant de traiter ? Quel traitement, quel suivi et quelles mesures pour les partenaires la Suisse prévoit-elle ? Le cours y répond dans l’ordre d’une monographie : définitions, mécanismes, clinique, examens, traitement, puis situations particulières. Il revient au cas dans l’îlot <a href="#a53-11">11</a>.</p>
<div class="two"><div class="card"><h4>Objectifs</h4><p>Reconnaître chaque stade à ses signes ; lire ensemble un test tréponémique et un titre non tréponémique ; dépister une atteinte neurologique, oculaire ou auditive ; prescrire le schéma suisse adapté au stade ; organiser le suivi sérologique, l’information des partenaires et la déclaration obligatoire.</p></div><div class="card"><h4>Prérequis</h4><p>Les <button class="w" data-k="a53-pre-serologie">deux familles de tests sérologiques (principe et cinétique)</button>, la <button class="w" data-k="a53-pre-penicilline">pharmacocinétique d’une pénicilline retard (fenêtre)</button> et la notion de <button class="w" data-k="a53-pre-stade">stade précoce ou tardif (définitions comparées)</button>.</p></div></div>
<div class="key"><b>À retenir.</b> La syphilis est une infection systémique dont la clinique change avec le temps. Le stade commande le traitement ; l’atteinte neurologique, oculaire ou auditive commande la voie d’administration.</div></section>

<section class="ilot" id="a53-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>La syphilis est une maladie humaine systémique due à <i>Treponema pallidum</i> sous-espèce <i>pallidum</i>. Elle est <b>acquise</b>, surtout par contact sexuel, ou <b>congénitale</b>, par transmission de la mère à l’enfant. La directive européenne IUSTI 2020 et son projet de 2026 retiennent cette double classification. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, introduction</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, introduction</a>.</p>
<p>La syphilis acquise se divise en <b>syphilis précoce</b> et <b>syphilis tardive</b>. La syphilis précoce comprend les stades primaire, secondaire et latent précoce ; la syphilis tardive comprend la latence tardive et la syphilis tertiaire, gommeuse, cardiovasculaire ou neurologique tardive. La frontière temporelle n’est pas universelle : l’ECDC et la directive européenne la placent à un an après l’infection, l’OMS à deux ans. L’<button class="w" data-k="a53-pre-stade">écart entre ces définitions (fenêtre)</button> change la durée du traitement d’une latence datée entre un et deux ans. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, définitions des stades</a>.</p>
<table class="t"><tr><th>Stade</th><th>Définition opérationnelle</th><th>Source</th></tr><tr><td>Primaire</td><td>Chancre au site d’inoculation, souvent avec une adénopathie régionale.</td><td>IUSTI 2020 ; OFSP 2026</td></tr><tr><td>Secondaire</td><td>Atteinte multisystémique après dissémination sanguine, surtout cutanéo-muqueuse.</td><td>IUSTI 2020 ; OFSP 2026</td></tr><tr><td>Latente précoce</td><td>Sérologie positive sans signe clinique, infection datée de moins d’un an.</td><td>IUSTI 2020 ; OFSP 2026</td></tr><tr><td>Latente tardive</td><td>Sérologie positive sans signe clinique, infection d’un an ou plus, ou de durée inconnue.</td><td>IUSTI 2020</td></tr><tr><td>Tertiaire</td><td>Gommes, atteinte cardiovasculaire ou neurosyphilis tardive.</td><td>IUSTI 2020 ; SSI 2024</td></tr><tr><td>Congénitale</td><td>Précoce pendant les deux premières années, tardive ensuite, stigmates compris.</td><td>IUSTI 2020</td></tr></table>
<p>Le tableau montre que seule la latence se définit par la date ; les autres stades se définissent par la clinique. Les stades peuvent se chevaucher, en particulier le primaire et le secondaire. La <b>neurosyphilis</b>, la <b>syphilis oculaire</b> et l’<b>otosyphilis</b> ne sont pas des stades : elles peuvent survenir dès la phase secondaire, où la directive européenne les nomme neurosyphilis précoce, ou bien tardivement. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, stades et neurosyphilis</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, syphilis secondaire</a>.</p>
<p>L’OFSP applique ses propres <button class="w" data-k="a53-ofsp-definition">définitions de cas pour la surveillance (fenêtre)</button>. Elles servent à compter les cas ; elles ne remplacent pas le raisonnement clinique qui choisit un traitement. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, « Syphilis », p. 109–110</a>.</p>
<div class="key"><b>À retenir.</b> Précoce signifie moins d’un an en Europe et en Suisse. Une latence dont la date est inconnue se traite comme une latence tardive.</div></section>

<section class="ilot" id="a53-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p><b>En Suisse.</b> En 2024, les médecins ont déclaré à l’OFSP 1042 cas de syphilis, nouvelles infections et réinfections, soit 11,6 cas pour 100 000 habitants. Parmi eux, 776 cas dataient de moins d’un an selon le médecin déclarant, soit 8,6 cas pour 100 000 habitants. Les hommes représentaient 89,3 % des cas de sexe connu, et les rapports sexuels entre hommes constituaient la voie d’infection de 61,1 % de l’ensemble des cas. La région de Zurich enregistrait l’incidence la plus élevée, 23,7 cas pour 100 000 habitants. Un cas de syphilis congénitale a été déclaré en 2024, et dix cas de syphilis néonatale en dix ans. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP-Bulletin 44/2025, « La syphilis en Suisse et au Liechtenstein en 2024 »</a>.</p>
<p><b>En Europe.</b> L’Espace économique européen comptait 9,9 cas de syphilis précoce pour 100 000 habitants en 2023, selon les chiffres de l’ECDC repris par l’OFSP. La hausse observée depuis 2000 touche surtout les hommes ayant des rapports sexuels avec des hommes. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP-Bulletin 44/2025, comparaison européenne</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, introduction</a>.</p>
<p><b>Évolution naturelle sans traitement.</b> Les données historiques reprises par la directive européenne indiquent qu’environ un tiers des personnes non traitées développe une syphilis secondaire et environ 10 % une syphilis tertiaire. Une revue de référence cite une fourchette historique de 15 à 40 % pour le stade tertiaire. La même directive rapporte qu’environ 60 % des personnes non traitées ne présentent aucune manifestation clinique autre que la lésion primaire, ce qui témoigne du rôle de la réponse de l’hôte. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, diagnostic clinique et remarques générales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5809176/" target="_blank" rel="noopener" data-reference-source="1">Peeling et al., Nat Rev Dis Primers 2017;3:17073</a>.</p>
<p><b>Pronostic traité.</b> Avec la pénicilline, les complications tardives et les échecs thérapeutiques sont devenus rares, y compris chez les personnes vivant avec le VIH. Le risque principal se déplace vers la réinfection, plus fréquente dans les réseaux sexuels denses, et vers la syphilis congénitale lorsque le dépistage de la grossesse échoue. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, remarques générales sur le traitement</a>.</p>
<div class="key"><b>À retenir.</b> En Suisse, environ 1000 cas sont déclarés par an, dont les trois quarts au stade précoce, surtout chez des hommes ayant des rapports sexuels avec des hommes et à Zurich.</div></section>

<section class="ilot" id="a53-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Normal.</b> Un épithélium malpighien intact et une peau fortement kératinisée limitent l’entrée des bactéries. Les muqueuses génitales, anales et buccales, ainsi que la peau péri-génitale moins kératinisée, offrent une barrière plus mince, surtout lorsqu’une microabrasion se produit pendant un rapport. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5809176/" target="_blank" rel="noopener" data-reference-source="1">Peeling 2017, transmission et dissémination</a>.</p>
<p><b>Perturbation.</b> Le tréponème traverse la muqueuse ou une abrasion cutanée, adhère à la matrice extracellulaire, puis se multiplie sous l’épithélium. Il gagne rapidement la lymphe et le sang : l’infection devient systémique avant même l’apparition du chancre. Sa membrane externe porte très peu de protéines exposées et aucun lipopolysaccharide ; cette <button class="w" data-k="a53-furtivite">pauvreté antigénique de surface (furtivité)</button> retarde la reconnaissance immunitaire et permet la dissémination. Le temps de génération est long, de 30 à 33 heures, ce qui explique l’incubation de plusieurs semaines et la nécessité d’une exposition prolongée à l’antibiotique. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5809176/" target="_blank" rel="noopener" data-reference-source="1">Peeling 2017, caractéristiques moléculaires</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, remarques générales</a>.</p>
<p><b>Manifestation.</b> Les lésions ne résultent pas d’une toxine, mais de la <button class="w" data-k="a53-inflammation">réaction inflammatoire contre les tréponèmes qui se multiplient dans les tissus (fenêtre)</button>. Un infiltrat périvasculaire de lymphocytes, d’histiocytes et de plasmocytes, avec gonflement endothélial, se retrouve à tous les stades et peut évoluer vers une endartérite oblitérante. Cette lésion vasculaire explique les accidents vasculaires de la neurosyphilis méningo-vasculaire et l’aortite. Les anticorps opsonisants finissent par contrôler la majorité des bactéries : les lésions guérissent spontanément et la phase latente commence. Des foyers persistent néanmoins dans la peau, l’os, l’aorte thoracique, l’uvée postérieure et le système nerveux central ; ils préparent les lésions tertiaires. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5809176/" target="_blank" rel="noopener" data-reference-source="1">Peeling 2017, réponse immunitaire et inflammation</a>.</p>
<p>Le tréponème envahit tôt le liquide céphalo-rachidien : environ 25 % selon le projet européen de 2026, jusqu’à 40 % des syphilis précoces non traitées selon la revue de 2017. Cette invasion n’aboutit le plus souvent à aucune méningite persistante, car l’hôte élimine les bactéries ; seule une méningite persistante définit la neurosyphilis. <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, neurosyphilis</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5809176/" target="_blank" rel="noopener" data-reference-source="1">Peeling 2017</a>.</p>
<figure><svg viewBox="0 0 680 230" role="img" aria-label="Histoire naturelle de la syphilis non traitée" font-family="Inter,sans-serif" font-size="12"><rect x="0" y="0" width="680" height="230" fill="#fff"/><line x1="30" y1="120" x2="660" y2="120" stroke="#222" stroke-width="2"/><polygon points="660,115 670,120 660,125" fill="#222"/><text x="30" y="140" fill="#222">contage</text><line x1="30" y1="112" x2="30" y2="128" stroke="#222"/><line x1="110" y1="112" x2="110" y2="128" stroke="#222"/><text x="85" y="140" fill="#222">10–90 j</text><rect x="100" y="60" width="90" height="40" fill="#fff" stroke="#222"/><text x="108" y="77" fill="#222">Primaire</text><text x="108" y="93" fill="#222">chancre</text><rect x="200" y="60" width="125" height="40" fill="#fff" stroke="#222"/><text x="207" y="77" fill="#222">Secondaire</text><text x="207" y="93" fill="#222">éruption, ganglions</text><line x1="330" y1="112" x2="330" y2="128" stroke="#222"/><text x="315" y="140" fill="#222">1 an</text><rect x="210" y="160" width="120" height="34" fill="#fff" stroke="#222" stroke-dasharray="4 3"/><text x="217" y="181" fill="#222">latence précoce</text><rect x="340" y="160" width="160" height="34" fill="#fff" stroke="#222" stroke-dasharray="4 3"/><text x="347" y="181" fill="#222">latence tardive (années)</text><rect x="510" y="60" width="150" height="40" fill="#fff" stroke="#222"/><text x="517" y="77" fill="#222">Tertiaire (≈ 10 %)</text><text x="517" y="93" fill="#222">gommes, aorte, nerfs</text><text x="530" y="140" fill="#222">10–30 ans</text><rect x="100" y="12" width="420" height="30" fill="#fff" stroke="#222"/><text x="110" y="32" fill="#222">Neurosyphilis, atteinte oculaire ou auditive : possibles à tous les stades</text><text x="30" y="215" fill="#222">Échelle non proportionnelle. Contagiosité sexuelle maximale pendant la première année.</text></svg><figcaption>Figure 1 — Histoire naturelle de la syphilis non traitée. Incubation et proportions : IUSTI 2020 ; délai tertiaire : Peeling 2017 et OFSP 2026.</figcaption></figure>
<div class="key"><b>À retenir.</b> Infection systémique d’emblée, multiplication lente, lésions inflammatoires périvasculaires, guérison apparente puis latence : chaque stade traduit l’équilibre entre le tréponème et l’immunité.</div></section>

<section class="ilot" id="a53-4"><h2><span class="n">4</span>Transmission et facteurs de risque</h2>
<p>La syphilis se transmet surtout par contact sexuel, vaginal, oral ou anal, avec une lésion cutanée ou muqueuse des stades primaire ou secondaire. Elle se transmet aussi de la mère à l’enfant pendant la grossesse. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 2026, « Syphilis », transmission</a>. La contagiosité sexuelle est maximale pendant la première année ; une transmission pendant la latence ou avant les symptômes reste possible, mais peu fréquente. La transmission par don de tissu ou d’organe est décrite. <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, diagnostic clinique</a>. Une exsudation contenant une dizaine de tréponèmes suffit à transmettre l’infection. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5809176/" target="_blank" rel="noopener" data-reference-source="1">Peeling 2017</a>.</p>
<p>Le risque est accru, selon l’OFSP, chez les hommes ayant des rapports sexuels avec des hommes, chez les travailleuses et travailleurs du sexe et chez leurs clients. La directive européenne recommande en outre un dépistage chez toute personne ayant une autre IST récemment diagnostiquée, chez les personnes vivant avec le VIH ou sous PrEP, chez les personnes porteuses d’une hépatite B ou C, et devant une perte visuelle ou auditive brutale inexpliquée ou une méningite. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 2026, groupes à risque</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, recherche de cas (2, C)</a>.</p>
<p>Le préservatif réduit le risque, mais ne l’annule pas, car le chancre peut siéger hors de la zone couverte. L’OFSP le formule ainsi : des infections restent possibles malgré une utilisation régulière ; un dépistage régulier est donc recommandé aux personnes à risque. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 2026, mesures de santé publique</a>.</p>
<div class="key"><b>À retenir.</b> Toute ulcération ano-génitale est syphilitique jusqu’à preuve du contraire. Toute nouvelle IST, toute infection par le VIH et toute PrEP justifient une sérologie de la syphilis.</div>

<section class="ilot" id="a53-5"><h2><span class="n">5</span>Anamnèse</h2>
<p><b>Antécédents utiles.</b> Le médecin recherche une <button class="w" data-k="a53-anam-sexuelle">anamnèse sexuelle structurée (sites exposés, partenaires, dates)</button>, une <button class="w" data-k="a53-anam-anciens">syphilis antérieure avec ses titres et son traitement (pièces à obtenir)</button>, une infection par le VIH, une PrEP, une grossesse ou un projet de grossesse, et une <button class="w" data-k="a53-anam-allergie">allergie déclarée aux pénicillines (caractérisation)</button>. La SSI place l’anamnèse sexuelle en tête du diagnostic. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic, aspects généraux</a>.</p>
<p><b>Symptômes, du plus fréquent au plus rare.</b> Au stade secondaire, une éruption ou des lésions cutanéo-muqueuses sont présentes dans 90 % des cas ; l’éruption ne démange habituellement pas. Le chancre primaire est typiquement unique, indolore, induré, à fond propre, mais il passe souvent inaperçu chez la femme et lors d’une localisation vaginale, buccale ou anale. Fièvre, céphalées et altération de l’état général accompagnent le stade secondaire, entre quatre et huit semaines après l’infection selon la SSI. Les symptômes d’alarme sont plus rares : céphalées persistantes, paralysie d’un nerf crânien, baisse visuelle, œil rouge douloureux, surdité brusque, acouphènes ou vertiges. <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, clinique</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique</a>.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Ulcération génitale indolore et indurée, guérie seule en quelques semaines, puis éruption maculeuse ou papuleuse du tronc, des paumes et des plantes, avec adénopathies généralisées et fébricule. C’est le cas de M. R.</p></div><div class="card"><h4>Formes atypiques</h4><p>Chancres multiples, douloureux ou profonds, indiscernables d’un herpès ; chancre buccal ou anal ignoré ; éruption discrète ; découverte sérologique isolée ; uvéite, surdité ou méningite révélatrices ; démence ou trouble psychiatrique tardif. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, clinique</a>.</p></div></div>
<div class="trap"><span class="k">Piège</span>L’absence de souvenir de chancre n’exclut pas une syphilis primaire passée : la lésion est indolore et guérit sans cicatrice. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, syphilis latente</a>.</div>
<div class="key"><b>À retenir.</b> L’anamnèse date l’infection : dernier test négatif, lésion ou éruption datée, partenaire atteint. Elle recherche aussi les symptômes neurologiques, visuels et auditifs, qui changent le traitement.</div></section>

<section class="ilot" id="a53-6"><h2><span class="n">6</span>Examen clinique</h2>
<p><b>État général et paramètres vitaux.</b> La température, la fréquence cardiaque et la pression artérielle repèrent la fièvre du stade secondaire et préparent la surveillance d’une réaction de Jarisch-Herxheimer après la première injection. Le poids n’a d’intérêt posologique que chez l’enfant. <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique et traitement</a>.</p>
<div class="two"><div class="card"><h4>Peau et muqueuses</h4><p>Le médecin inspecte les organes génitaux, la région périanale, la bouche et le pharynx à la recherche d’un <button class="w" data-k="a53-ex-chancre">chancre (technique, valeur, pièges)</button>. Il recherche une <button class="w" data-k="a53-ex-eruption">éruption palmo-plantaire et des syphilides (fenêtre)</button>, des condylomes plats, un énanthème et une alopécie diffuse, critères cliniques retenus par l’OFSP pour le stade secondaire. <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 2026, définition de cas</a>.</p></div><div class="card"><h4>Ganglions, nerfs, yeux, oreilles, cœur</h4><p>Il palpe les aires ganglionnaires régionales et générales. Il réalise un <button class="w" data-k="a53-ex-neuro">examen neurologique, oculaire et otologique ciblé</button>, recommandé par la directive européenne chez toute personne à sérologie positive. Il ausculte le foyer aortique chez toute personne en latence tardive, de durée inconnue ou au stade tertiaire. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, neurosyphilis et syphilis cardiovasculaire</a>.</p></div></div>
<p>Chez une personne sans symptôme, l’examen neurologique apporte rarement une anomalie ; il reste recommandé, car une anomalie impose une ponction lombaire et un traitement intraveineux. Un fond d’œil précède toute ponction lombaire. <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, examens pour la neurosyphilis</a>.</p>
<div class="key"><b>À retenir.</b> Examiner toutes les muqueuses exposées, la peau des paumes et des plantes, les nerfs crâniens, la vision, l’audition et le foyer aortique.</div></section>
