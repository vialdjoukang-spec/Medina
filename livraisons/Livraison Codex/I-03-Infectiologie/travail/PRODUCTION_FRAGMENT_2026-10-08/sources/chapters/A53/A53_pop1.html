<template data-pop="a53-examens" data-title="Loi de Pareto — Examens de la syphilis">
<div class="lab">Les premières décisions</div><p>La personne du cas possède déjà un TPPA positif et un RPR 1:8. Le clinicien recherche rapidement les comptes rendus et traitements antérieurs, vérifie les symptômes et les sites muqueux, puis documente le RPR actuel. Si une cure est retenue, un titre quantitatif daté de son premier jour servira de référence. Le test VIH et une grossesse possible modifient la priorité des soins. « Pareto » désigne ici l’ordre des questions, sans proportion de bénéfice inventée.</p>
<div class="lab">Ce qui reste inconnu</div><p>Le dernier résultat négatif, les expositions, le traitement antérieur et les signes d’organe ne sont pas documentés. Aucun stade précoce, échec, guérison ou état « serofast » n’est attribué sur le seul titre 1:8. L’IUSTI 2020 recommande de prendre en charge par précaution une sérologie positive si aucun traitement antérieur adéquat n’est documenté après évaluation ; il ne s’agit pas d’attendre une preuve de non-traitement. La déclaration suisse suit ses propres critères.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, validée le 13 juin 2024, diagnostic et suivi</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 3, prise en charge faute de traitement adéquat documenté</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Latent Syphilis, 2021, critères temporels</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-historique" data-title="Historique : une même sérologie peut avoir plusieurs significations">
<div class="lab">Documents à rechercher</div><p>Le clinicien recueille les dates des sérologies antérieures, les titres RPR ou VDRL avec leur méthode, les diagnostics, la preuve d’un traitement adéquat et les nouvelles expositions. Une séroconversion datée ou une hausse confirmée après traitement peut documenter une infection récente ; une seule sérologie actuelle ne le peut pas.</p>
<div class="lab">Application au cas</div><p>TPPA positif et RPR 1:8 peuvent être observés après une infection non traitée ou après un traitement avec persistance du titre non tréponémique. Le dossier ne précise pas laquelle de ces situations s’applique. Une déclaration antérieure ou un souvenir de prise d’antibiotique ne remplacent pas automatiquement les éléments du médicament, de la dose et du stade alors traité. Après recherche active, l’absence de traitement adéquat documenté conduit à la prise en charge par précaution indiquée par l’IUSTI, selon le stade établi par l’évaluation.</p>
<p class="src"><a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 3, recommandation 1 D</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, 2021, tests tréponémiques et titres non tréponémiques</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Latent Syphilis, 2021, critères d’acquisition récente</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-treponemique" data-title="TPPA : marqueur immunologique, pas chronomètre">
<div class="lab">Ce que mesure le test</div><p>Le TPPA recherche des anticorps dirigés contre des antigènes tréponémiques. Une réponse positive soutient l’existence d’un contact avec <em>Treponema pallidum</em>, à interpréter avec les autres tests et l’histoire. La plupart des tests tréponémiques restent positifs longtemps après un traitement efficace.</p>
<div class="lab">Limite pour le suivi</div><p>La persistance du TPPA ne prouve ni bactérie vivante ni échec du traitement. Son titre ne sert pas à mesurer la réponse sérologique. Dans le cas, le TPPA positif ne date pas la contamination et n’indique pas si un traitement antérieur a été efficace.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Diagnostic sérologique », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, « Treponemal Tests and Reverse Sequence Algorithm », 2021</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-rpr" data-title="RPR : titre quantitatif à comparer dans le temps">
<div class="lab">Mesure</div><p>Le test non tréponémique RPR est titré par dilutions successives du sérum. « 1:8 » signifie que la réaction demeure détectée à cette dilution dans les conditions de l’essai. Ce nombre n’est ni une quantité directe de tréponèmes ni une date d’acquisition.</p>
<div class="lab">Lecture clinique</div><p>Le titre peut diminuer après traitement, persister ou remonter après une nouvelle exposition ou un échec. La variation doit être mesurée par la même méthode, idéalement dans le même laboratoire. RPR et VDRL ne sont pas directement interchangeables pour calculer un facteur de variation.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Diagnostic » et « Suivi », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, « Nontreponemal Tests », 2021</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-algorithme" data-title="Algorithme sérologique : deux tests, questions différentes">
<div class="lab">Deux séquences</div><p>La SSI propose un dépistage tréponémique, par TPPA ou anticorps spécifiques, suivi d’un RPR ou VDRL quantitatif. D’autres laboratoires commencent par un test non tréponémique ; un résultat positif requiert alors une confirmation tréponémique et un titre quantitatif. Un premier test tréponémique positif avec RPR négatif appelle l’historique, un second test tréponémique différent et, selon le laboratoire et la suspicion, un nouveau sérum. Un RPR isolément positif peut être non spécifique et ne diagnostique pas une syphilis à lui seul.</p>
<div class="lab">Cinétique et limites</div><p>Une syphilis primaire peut précéder la positivité sérologique. Devant un chancre compatible, la SSI conseille de rechercher l’agent dans la lésion par PCR selon la disponibilité du laboratoire et de renouveler la sérologie si la suspicion persiste. Un RPR négatif malgré un tableau évocateur peut faire rechercher une prozone par dilution du sérum. Ces étapes sont conditionnelles : la personne du cas n’a pas de lésion rapportée et ses deux tests sont réactifs.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Points importants » et « Diagnostic », validée le 13 juin 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 4–5, sérologie et discordances</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, p. 6, confirmation et prozone</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-discordance" data-title="Tests discordants : confirmer avant d’interpréter">
<div class="lab">Tréponémique positif, RPR négatif</div><p>La SSI demande de rechercher un traitement antérieur et propose une autre méthode tréponémique si nécessaire. L’IUSTI recommande de répéter les deux familles de tests sur un second sérum lorsque les résultats discordent chez une personne asymptomatique. Le moment de la répétition dépend d’une exposition ou d’une lésion récente et du protocole du laboratoire. Un RPR négatif sur sérum non dilué peut exceptionnellement être lié à une prozone ; en cas de forte suspicion, le laboratoire effectue des dilutions.</p>
<div class="lab">RPR positif isolé</div><p>Une réaction non tréponémique peut avoir une autre cause. Il faut confirmer par un test tréponémique et relire le contexte avant de conclure. Le couple TPPA positif/RPR 1:8 du cas n’est pas discordant ; ni prozone ni faux positif n’y sont démontrés.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », § « Diagnostic », validée le 13 juin 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 4–5, confirmation, faux négatifs et faux positifs</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, p. 6, confirmation sur autre échantillon et prozone</a>. Lues le 8 octobre 2026.</div>
</template>
<template data-pop="a53-e-direct" data-title="PCR d’une lésion : preuve directe conditionnelle">
<div class="lab">Quand prélever</div><p>Si une lésion compatible est visible, la SSI recommande la recherche de <i>T. pallidum</i> par PCR dans le chancre, particulièrement quand les anticorps sont encore indétectables. L’IUSTI privilégie une PCR de lésion réalisée par une méthode validée et contrôlée. La PCR de sang est peu sensible et n’est pas un substitut de prélèvement local.</p>
<div class="lab">Résultat négatif</div><p>Un résultat négatif ne règle pas seul une forte suspicion : qualité et site du prélèvement, examen clinique et sérologie répétée comptent. Aucune lésion ni PCR n’est fournie pour la personne TPPA+/RPR 1:8 du cas.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », § « Points importants », validée le 13 juin 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 3, « Demonstration of T. pallidum »</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, p. 5–6, diagnostic moléculaire et répétition sérologique</a>. Lues le 8 octobre 2026.</div>
</template>
<template data-pop="a53-e-differentiel" data-title="Ulcération : ne pas attribuer toute lésion à la syphilis">
<div class="lab">Question conditionnelle</div><p>Une ulcération présente au moment de l’examen peut avoir plusieurs causes, notamment une infection par le virus herpès simplex. L’IUSTI cite la PCR herpétique parmi les examens utiles lorsqu’un chancre possible est exploré. Les prélèvements dépendent de l’aspect et du site ; la syphilis et l’herpès ne s’excluent pas par la seule inspection.</p>
<div class="lab">Autre limite du test tréponémique</div><p>Les anticorps tréponémiques ne séparent pas la syphilis vénérienne des tréponématoses endémiques, telles que pian, bejel et pinta. L’épidémiologie et l’histoire orientent cette distinction. Aucune lésion ou origine géographique n’est fournie dans le cas.</p>
<div class="src">Sources : <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 3 et 5, tréponématoses et « Herpes PCR »</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, p. 5, limites des anticorps tréponémiques</a>. Lues le 8 octobre 2026.</div>
</template>
<template data-pop="a53-e-serofast" data-title="RPR persistant après traitement : interpréter la trajectoire">
<div class="lab">Pourquoi un titre peut rester positif</div><p>Après un traitement, les anticorps non tréponémiques diminuent souvent, mais peuvent rester réactifs à bas titre pendant longtemps. Le CDC décrit aussi des personnes dont le titre baisse moins que prévu. Une persistance ne suffit donc pas, à elle seule, à conclure que le tréponème se multiplie encore.</p>
<div class="lab">Piège dans le cas</div><p>Sans titre antérieur ni preuve de traitement, le RPR 1:8 ne peut être appelé « serofast ». Ce terme n’est utile qu’après documentation d’un épisode traité et de son évolution. La formule simplifiée SSI « RPR positif = syphilis active » pousse à ne pas manquer une infection non traitée ; elle doit être rapprochée de cet historique avant de diagnostiquer une réinfection.</p>
<p class="src"><a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, « Nontreponemal Tests », 2021</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Diagnostic sérologique », validée le 13 juin 2024</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-latence" data-title="Latence précoce : une preuve temporelle est nécessaire">
<div class="lab">Définition clinique</div><p>Une syphilis latente correspond à une réactivité sérologique sans signe de syphilis primaire, secondaire ou tertiaire à l’examen. Le CDC retient la latence précoce si une acquisition dans les douze mois est étayée par une séroconversion documentée, une hausse durable du titre d’au moins quatre fois après traitement, des symptômes récents caractéristiques, un partenaire avec syphilis précoce ou une exposition possible limitée à cette période.</p>
<div class="lab">Quand la durée reste inconnue</div><p>Si l’histoire ne permet pas cette datation, une syphilis latente non traitée est classée comme tardive ou de durée inconnue pour guider le traitement. Les titres sont souvent plus élevés tôt, mais aucun titre isolé ne date fiablement l’infection. L’adulte du cas n’a ni test négatif daté ni traitement antérieur établi.</p>
<p class="src"><a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Latent Syphilis, « Early Latent Syphilis », 2021</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Clinique », validée le 13 juin 2024</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-code" data-title="A53.0 et A53.9 : libellés de codage, pas diagnostic temporel automatique">
<div class="lab">Rubriques BfArM</div><p>Dans la CIM-10-GM 2024, A53.0 désigne la syphilis latente non précisée comme précoce ou tardive. A53.9 désigne la syphilis acquise ou l’infection tréponémique sans précision de forme. Une réaction sérologique positive figure parmi les inclusions d’A53.0, mais cette convention de classement ne démontre pas une infection active non traitée.</p>
<div class="lab">Application</div><p>Si l’examen confirme l’absence de signes et si une syphilis latente non traitée est retenue sans preuve de date, A53.0 peut décrire la latence dont la durée n’est pas précisée. Si le stade même demeure indéterminé, A53.9 peut être considéré. Les données manquantes du cas doivent être vérifiées avant de fixer le code ; aucun code ne prescrit seul un traitement.</p>
<p class="src"><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, ICD-10-GM 2024, A53.0 et A53.9</a>, texte allemand officiel lu le 8 octobre 2026. Les libellés français de cette fenêtre sont des traductions pédagogiques.</p>
</template>
<template data-pop="a53-e-neuro" data-title="Signes neurologiques : rechercher la clinique avant le liquide">
<div class="lab">Indices à chercher</div><p>Un déficit focal, une paralysie d’un nerf crânien, un syndrome méningé, un trouble cognitif, un trouble sensitif ou un accident vasculaire inexpliqué peuvent motiver une recherche de neurosyphilis chez une personne à sérologie réactive. L’atteinte du système nerveux peut survenir à plusieurs stades ; un titre RPR donné ne l’exclut pas.</p>
<div class="lab">Décision</div><p>Le CDC recommande une analyse du liquide céphalorachidien lorsqu’une atteinte neurologique est constatée. Un examen neurologique ciblé précède donc la décision de ponction. Aucun signe neurologique n’est documenté dans le cas ; l’expression « asymptomatique » doit être vérifiée à l’interrogatoire et à l’examen.</p>
<p class="src"><a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, « Cerebrospinal Fluid Evaluation », 2021</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Neurosyphilis, Ocular Syphilis, and Otosyphilis, 2021</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-oculaire" data-title="Atteinte oculaire : examen rapide, ponction selon les signes">
<div class="lab">Pourquoi demander les symptômes</div><p>Une baisse visuelle, une douleur oculaire ou une inflammation peuvent révéler une syphilis oculaire. Le CDC recommande un examen ophtalmologique complet, avec examen des nerfs crâniens, chez une personne symptomatique dont la sérologie est réactive. Une suspicion requiert un avis ophtalmologique rapide.</p>
<div class="lab">Quand le liquide est utile</div><p>Si une atteinte oculaire est confirmée et qu’aucun signe neurologique n’existe, la ponction lombaire n’est pas nécessaire avant le traitement selon le CDC 2021. Si l’examen révèle un déficit d’un nerf crânien, elle est indiquée. Si les symptômes visuels existent sans lésion visible, l’analyse du liquide peut aider. L’IUSTI 2020 inclut les symptômes oculaires dans ses indications, mais précise ensuite que la ponction oculaire est controversée si le traitement intraveineux serait de toute façon instauré ; elle peut aider au diagnostic différentiel ou fournir un point de comparaison. La BASHH 2024 juge la ponction rarement utile pour l’atteinte oculaire isolée. L’avis spécialisé explicite le texte retenu. Aucun symptôme oculaire n’est signalé dans le cas.</p>
<p class="src"><a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 5–6, « CSF assessment » et « Investigation for ocular syphilis »</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, atteinte oculaire</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, p. 7, ponction oculaire</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-auditif" data-title="Otosyphilis : l’audition ne se résume pas au RPR">
<div class="lab">Signes à rechercher</div><p>Une perte auditive, des acouphènes ou des vertiges peuvent accompagner une atteinte otologique syphilitique. Le clinicien demande leur début et effectue un examen neurologique ; un avis spécialisé permet de préciser le diagnostic et la conduite.</p>
<div class="lab">Ponction lombaire</div><p>Selon le CDC 2021, avec des symptômes auditifs isolés, un examen neurologique normal et une sérologie réactive, l’analyse du liquide est généralement normale et n’est pas nécessaire avant le traitement. L’IUSTI 2020 inclut au contraire les symptômes auditifs dans ses indications de liquide ; la BASHH 2024 juge la ponction rarement utile si l’atteinte est isolée. Une anomalie neurologique associée change l’évaluation. Aucun trouble auditif n’est rapporté dans le cas.</p>
<p class="src"><a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 5, « CSF assessment »</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, atteinte auditive</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, p. 7, ponction auditive</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-pl" data-title="Ponction lombaire : distinguer indication clinique et seuils discutés">
<div class="lab">Panel SSI et sérum simultané</div><p>Si une ponction est indiquée, la SSI 2024 demande <b>cellularité, protéines et TPPA du liquide céphalorachidien</b>, ainsi que la répétition simultanée des tests syphilitiques sériques. Elle mentionne le <b>diagramme de Reiber</b> pour apprécier la réponse intrathécale ; cette interprétation exige le travail du laboratoire sur le liquide et le sérum, et ne se déduit pas des deux seuls titres TPPA. L’IUSTI 2020 juge l’utilité pratique de plusieurs indices intrathécaux non démontrée. Elle inclut un test non tréponémique du liquide, de préférence VDRL, sinon RPR selon le laboratoire. Le TPPA positif du liquide isolé n’établit pas une neurosyphilis.</p>
<div class="lab">Limites des résultats</div><p>Un VDRL réactif dans un liquide non contaminé par du sang soutient fortement le diagnostic en contexte clinique compatible ; un VDRL négatif ne l’exclut pas, car sa sensibilité est limitée. La cellularité et les protéines peuvent être influencées par d’autres causes, notamment une infection VIH. Aucun résultat du liquide n’existe pour la personne du cas.</p>
<div class="lab">Deux recommandations en tension</div><p>La SSI 2024 mentionne une ponction dans la syphilis secondaire associée au VIH avec CD4 &lt; 200/µL ou RPR/VDRL &gt; 1:32, en plus des signes neurologiques ou psychiatriques. Le CDC 2021 rapporte une association entre anomalies du liquide et CD4 bas ou RPR élevé, mais indique qu’une ponction avec traitement sur ce seul fondement n’améliore pas les résultats démontrés en l’absence d’anomalie neurologique ; il réserve la ponction à un examen neurologique anormal. Une personne vivant avec le VIH et asymptomatique mérite donc une décision spécialisée explicitant cet écart. Dans le cas, VIH, stade et symptômes ciblés restent à vérifier et le RPR est 1:8 : aucune ponction n’est justifiée par ce seul chiffre.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Suivi et diagnostic/exclusion de la neurosyphilis », validée le 13 juin 2024, PL et Reiber</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 5–6, panel et limites de l’utilité des indices intrathécaux</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-hiv.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, syphilis et VIH, « Cerebrospinal Fluid Examination »</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, « Cerebrospinal Fluid Evaluation »</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-vih" data-title="VIH : dépistage et examen clinique adapté">
<div class="lab">Pourquoi le demander</div><p>La SSI demande un test VIH lorsqu’un test tréponémique est positif. Une co-infection éventuelle modifie le suivi et impose de chercher soigneusement les signes neurologiques, oculaires et auditifs. Le statut VIH de la personne du cas est inconnu ; on ne peut déduire un résultat de sa sérologie syphilitique.</p>
<div class="lab">Interprétation des tests</div><p>Le CDC indique que l’interprétation des tests tréponémiques et non tréponémiques est généralement la même chez les personnes vivant ou non avec le VIH. Des réponses sérologiques inhabituelles existent, mais elles ne permettent pas de remplacer l’histoire clinique par une ponction systématique. Le calendrier individuel dépend du stade établi et du traitement réalisé.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Diagnostic », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-hiv.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis Among Persons with HIV Infection, 2021, diagnostic et suivi</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-grossesse" data-title="Grossesse : évaluation rapide si elle est possible">
<div class="lab">Pourquoi le contexte change l’urgence</div><p>Une syphilis maternelle peut être transmise au fœtus même quand la personne enceinte n’a pas de symptôme. Le clinicien vérifie une grossesse possible et son terme afin d’organiser sans délai l’évaluation, la stadification, le traitement adapté et le suivi obstétrical. Un TPPA positif antérieur traité ne signifie pas automatiquement une nouvelle infection maternelle ; les titres et les traitements précédents restent nécessaires.</p>
<div class="lab">Limite du cas</div><p>Le cas ne précise ni le sexe biologique ni une grossesse. Aucun état n’est supposé. Si une grossesse est constatée, le traitement et le contrôle suivent la recommandation spécialisée et la situation réelle, sans transposer mécaniquement le parcours d’un adulte hors grossesse.</p>
<p class="src"><a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-pregnancy.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis During Pregnancy, 2021, diagnostic et antécédents de traitement</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Latent Syphilis, 2021, prévention de la syphilis congénitale</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-suivi" data-title="Suivi RPR : même méthode et titre de départ daté">
<div class="lab">Organiser la série</div><p>Si un traitement est décidé, un titre non tréponémique quantitatif relevé <b>le jour de la première dose</b> est le point de comparaison selon l’IUSTI et la BASHH. Le CDC demande la même méthode, RPR ou VDRL, idéalement dans le même laboratoire et avec le même fabricant, car les titres issus de deux méthodes ne sont pas directement comparables. La SSI propose des contrôles à 3, 6, 12 et 24 mois après traitement.</p>
<div class="lab">Ce qu’un contrôle peut révéler</div><p>Une hausse durable d’au moins quatre fois peut évoquer réinfection ou échec et demande l’histoire des expositions ainsi qu’un nouvel examen. Une baisse insuffisante ne reçoit pas un verdict automatique : le stade, le titre initial, le temps écoulé et une éventuelle infection VIH changent l’analyse. Dans le cas, aucun traitement n’est documenté ; 1:8 n’est encore que le titre actuel, pas une réponse.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Suivi », validée le 13 juin 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, p. 4, titre du premier jour</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, p. 6, titre du jour de traitement</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, « Nontreponemal Tests », 2021</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-x4" data-title="Deux formulations des titres : facteur quatre et « 1/16 »">
<div class="lab">Le calcul explicite</div><p>Chaque dilution binaire divise le titre par deux : 1:8 → 1:4 → 1:2. Le CDC 2021 appelle « changement cliniquement significatif » un facteur quatre, soit deux dilutions successives. Une hausse de 1:8 à 1:32 est également un facteur quatre. Ces nombres sont des exemples de calcul et ne représentent aucun résultat futur de la personne du cas.</p>
<div class="lab">L’écart avec la formule suisse</div><p>La SSI 2024 écrit qu’après six mois le RPR/VDRL « devrait être négatif ou montrer une diminution de 4 titrations, soit 1/16 ». Quatre dilutions binaires représentent un facteur seize, différent du facteur quatre défini par le CDC. Pour un titre de départ 1:8, une cible à un seizième n’est pas une dilution positive usuelle ; cette formule ne doit donc pas devenir une règle mécanique. Le délai et l’ampleur de baisse attendus dépendent du stade, du titre initial et de l’histoire. Aucun de ces textes n’autorise à annoncer un échec à six mois à partir de la formule seule.</p>
<p class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Syphilis, « Suivi et diagnostic/exclusion de la neurosyphilis », validée le 13 juin 2024, formule « 4 titrations, soit 1/16 »</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, 2021, « fourfold change … two dilutions »</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Latent Syphilis, « Follow-Up », 2021</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="a53-e-declaration" data-title="Déclaration suisse : surveillance distincte de la décision thérapeutique">
<div class="lab">Circuit et délai</div><p>Le Guide de la déclaration obligatoire 2026 de l’OFSP, rubrique « Syphilis », prévoit un délai d’une semaine pour les déclarations de laboratoire et de médecin lorsque leurs critères respectifs sont remplis. Le laboratoire déclare les résultats spécifiques positifs prévus par le guide ; un RPR/VDRL positif isolé sans confirmation spécifique n’est pas une déclaration de laboratoire suffisante. Le médecin vérifie ses critères de résultat et de traitement, puis suit le circuit cantonal.</p>
<div class="lab">Ne pas confondre les usages d’un titre</div><p>La catégorie de surveillance « syphilis latente tardive » du guide OFSP inclut certaines durées inconnues avec titre non tréponémique d’au moins 1:32. C’est une définition administrative de classement des cas déclarés. Elle ne prouve ni la date biologique de l’infection ni le schéma thérapeutique. Le RPR 1:8 de la personne du cas doit être interprété cliniquement avec ses antécédents ; la déclaration suit ses propres critères.</p>
