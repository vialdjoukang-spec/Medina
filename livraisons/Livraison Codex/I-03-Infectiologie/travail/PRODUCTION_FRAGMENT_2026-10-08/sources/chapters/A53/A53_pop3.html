<template data-pop="a53-ph-tppa" data-title="TPPA positif : mémoire immunitaire, pas datation"><div class="lab">Ce que mesure le test</div><p>Le TPPA recherche des anticorps dirigés contre <i>Treponema pallidum</i>. Chez de nombreuses personnes, il reste positif après un traitement adéquat. Sa positivité n'établit donc ni que l'infection est encore active, ni quand elle a commencé.</p><div class="lab">Application</div><p>Chez l'adulte du cas, le médecin vérifie rapidement les traitements et titres RPR antérieurs, examine les signes et précise les expositions. Un TPPA positif seul ne fixe ni le stade ni le nombre d'injections ; si aucun traitement adéquat n'est documenté après cette enquête, IUSTI Europe 2020 recommande de traiter par précaution une sérologie syphilitique positive.</p><div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, recommandations thérapeutiques 2021, Treponemal Tests</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », validée le 13 juin 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI Europe 2020, p. 3, « Serological tests for syphilis », recommandation 1,D</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-precaution" data-title="Sérologie positive sans traitement documenté : agir après enquête rapide"><div class="lab">Texte européen exact</div><p>La directive IUSTI Europe 2020 écrit : <b>« A person with positive STS should be investigated and treated as for syphilis as a precautionary measure unless previous adequate treatment for syphilis is documented (1, D). »</b> Les STS sont les tests sérologiques de la syphilis. Dans ce cas, TPPA et RPR sont positifs, mais aucun traitement adéquat antérieur n'est documenté.</p><div class="lab">Application avec limites</div><p>Le médecin vérifie sans délai les résultats, les soins antérieurs, les expositions et les signes cliniques. Si une prise en charge adéquate passée est prouvée avec une évolution compatible, le titre persistant n'impose pas seul une nouvelle cure. Si elle reste non documentée après cette enquête, IUSTI recommande de traiter par précaution, sans exiger une preuve biologique supplémentaire d'activité persistante. La même directive classe l'infection latente de durée inconnue avec la tardive et donne 2,4 MUI de benzathine pénicilline G IM aux jours 1, 8 et 15, sauf atteinte exigeant un autre traitement. Elle avertit aussi qu'un retard peut être dangereux si le patient risque de ne pas revenir. Le RPR 1:8 ne prouve pas une acquisition récente.</p><div class="src">Source primaire : <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">Janier et al., IUSTI Europe, « 2020 European guideline on the management of syphilis », p. 3 « Serological tests for syphilis » (recommandation 1,D) et p. 2 tableau 1/diagnostic clinique</a>, texte intégral lu le 8 octobre 2026. La directive européenne éclaire la conduite ; l'information suisse du produit administré reste à appliquer.</div></template>

<template data-pop="a53-ph-serofast" data-title="RPR persistant après traitement : interpréter la trajectoire"><div class="lab">Phénomène</div><p>Le titre non tréponémique peut diminuer après traitement puis rester réactif pendant longtemps. Le RPR 1:8 isolé du cas n'a aucune trajectoire connue. Le CDC décrit cette persistance sans négativation ; elle ne démontre pas, à elle seule, une infection vivante ou un échec.</p><div class="lab">Décision</div><p>Le médecin compare le RPR actuel aux titres antérieurs obtenus par la même méthode. Il tient compte du stade initial, du traitement reçu et des expositions nouvelles. Sans ces éléments, le RPR 1:8 du cas ne prouve ni sérofixation, ni réinfection. Leur recherche ne doit pas durer indéfiniment : si aucun traitement adéquat antérieur n'est documenté, une prise en charge de précaution est indiquée selon IUSTI Europe 2020. Une hausse soutenue d'au moins quatre fois oriente autrement qu'une stabilité ancienne.</p><div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Nontreponemal Tests</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Follow-Up de la syphilis latente</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI Europe 2020, p. 3, « Serological tests for syphilis »</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-recent" data-title="Syphilis latente précoce : la preuve vient du temps"><div class="lab">Critères de datation</div><p>Le CDC classe comme précoce une syphilis latente lorsque, dans l'année précédente, une séroconversion, une hausse soutenue d'au moins quatre fois du titre après traitement, des signes nets de syphilis primaire ou secondaire, ou un partenaire infecté à un stade précoce sont documentés. Une exposition possible limitée à cette année peut aussi étayer cette classification.</p><div class="lab">Limite du titre</div><p>Un RPR à 1:8 ne date pas l'infection. Sans indice temporel fiable, la latence se classe en durée inconnue plutôt que « précoce » par intuition. Si aucun traitement adéquat antérieur n'est documenté après une enquête rapide, cette incertitude de date n'empêche pas de traiter par précaution selon IUSTI Europe 2020. La SSI 2024 et le CDC 2021 définissent la latence précoce sur un an ; la directive britannique BASHH 2024 emploie deux ans, seuil qui ne reclassifie pas le cas en Suisse. L'examen recherche d'abord une lésion primaire ou secondaire silencieuse.</p><div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, définition Early Latent Syphilis</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », 13 juin 2024, tableaux des stades</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, « Latent disease »</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI Europe 2020, p. 2–3, tableau 1 et sérologie</a>. Lus le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-neuro" data-title="Atteinte neurologique, oculaire ou auditive : le dépôt IM ne suffit pas"><div class="lab">Frontière du traitement</div><p>La suspension de benzathine benzylpénicilline libère lentement de la pénicilline dans le sang mais n'assure pas le schéma de forte exposition nécessaire pour une neurosyphilis. La FI suisse Extencilline exclut explicitement la neurosyphilis et les anomalies du liquide céphalorachidien de son indication de syphilis tardive.</p><div class="lab">Conduite</div><p>Symptômes neurologiques, visuels ou auditifs imposent un examen et une décision spécialisée rapides. La SSI suisse, validée le 13 juin 2024, indique pénicilline G aqueuse <b>4 MUI IV toutes les quatre heures pendant 14 jours</b>. Le CDC 2021 donne <b>18–24 MUI par jour IV pendant 10–14 jours</b>. Ces schémas ont des sources et des durées distinctes ; aucun ne correspond à la suspension Extencilline IM. Le produit IV réel et l'avis spécialisé sont vérifiés. Aucun signe de cette catégorie n'est rapporté dans le cas, mais il doit être recherché.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI suisse Extencilline n° 69765, Indications, consultée le 8 octobre 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », « Traitement — Neurosyphilis », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Neurosyphilis, Ocular Syphilis, and Otosyphilis</a>. Textes lus le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-mecanisme" data-title="Benzathine pénicilline G : action et longue exposition"><div class="lab">Mécanisme</div><p>La pénicilline G bloque les protéines qui assemblent le peptidoglycane de la paroi bactérienne, ce qui tue un tréponème sensible en multiplication. Le sel de benzathine se libère lentement après injection IM ; cette forme retard prolonge une faible exposition systémique plutôt que de créer un pic IV.</p><div class="lab">Conséquence</div><p>Le stade détermine la durée : une injection pour une infection précoce établie, trois doses espacées d'une semaine pour une latence tardive ou de durée inconnue retenue. La FI suisse indique que l'efficacité d'une pénicilline dépend surtout du temps pendant lequel sa concentration dépasse la concentration minimale inhibitrice ; la libération lente de cette suspension sert cette exposition prolongée. La diffusion au système nerveux est insuffisante pour substituer Extencilline à la pénicilline aqueuse d'une neurosyphilis.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Propriétés/Effets et Posologie</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, traitement de la latence</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-one" data-title="Une dose IM : réservée à un stade précoce établi"><div class="lab">Schéma</div><p>La SSI suisse « Syphilis », validée le 13 juin 2024, et le CDC 2021 recommandent la benzathine pénicilline G <b>2,4 MUI IM en une administration</b> pour une syphilis primaire, secondaire ou latente précoce établie. La FI Extencilline n° 69765 indique 2,4 MUI en dose unique pour les stades primaire et secondaire.</p><div class="lab">Limite</div><p>Un TPPA positif avec RPR 1:8 ne prouve pas un stade précoce. La dose unique n'est choisie qu'après examen et datation suffisante. L'existence d'une atteinte neurologique, oculaire ou auditive change de traitement.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Early Latent Syphilis</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline, Posologie</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-three" data-title="Trois doses hebdomadaires : latence tardive ou inconnue retenue"><div class="lab">Schéma et portée des sources</div><p>Pour une <b>syphilis latente tardive</b>, la SSI 2024 et la FI suisse Extencilline décrivent <b>2,4 MUI de benzathine pénicilline G IM chaque semaine pendant trois semaines</b>, soit 7,2 MUI au total, hors atteinte neurologique et anomalie du LCR pour la FI. La directive européenne <b>IUSTI 2020</b>, tableau 1, et le <b>CDC 2021</b> appliquent explicitement ce même schéma à la syphilis latente tardive <b>ou de durée inconnue</b>. La page SSI consultée ne formule pas séparément la catégorie « durée inconnue » ; cette extension est attribuée aux deux textes qui la nomment.</p><div class="lab">Application après enquête rapide</div><p>Le cas ne fournit aucun traitement adéquat antérieur documenté. IUSTI Europe 2020 recommande d'investiguer puis de traiter par précaution les sérologies positives dans cette situation ; son tableau 1 donne trois doses hebdomadaires pour une latence tardive ou de durée inconnue. Le médecin vérifie rapidement l'histoire, les signes neurologiques, la grossesse, le VIH et la sécurité du produit ; le RPR 1:8 seul ne permet pas de choisir la dose unique ni de repousser indéfiniment le traitement.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », 13 juin 2024, syphilis tardive</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline, Posologie, syphilis latente tardive</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Late Latent Syphilis et Unknown Duration</a> ; <a href="https://iusti.org/wp-content/uploads/2020/11/2020-Syphilis-guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI Europe 2020, p. 2 tableau 1 et p. 3 « Serological tests for syphilis » (1,D)</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-intervalle" data-title="Intervalle des injections : prévenir une exposition insuffisante"><div class="lab">Règle</div><p>Les trois doses d'une syphilis latente tardive ou de durée inconnue sont prévues à une semaine d'intervalle. Le CDC 2021 indique qu'un intervalle de 7–9 jours est préférable ; 10–14 jours peut être toléré selon l'expérience clinique chez une personne non enceinte avant de recommencer la série, sans certitude forte.</p><div class="lab">Grossesse</div><p>Chez une personne enceinte traitée pour une syphilis latente, le CDC demande de recommencer la cure entière si l'écart entre deux doses dépasse neuf jours. Un rendez-vous manqué est donc évalué immédiatement ; cette règle ne transforme pas le cas asymptomatique en grossesse connue.</p><div class="src">Source : <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, passage sur les doses retardées, Latent Syphilis</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-produit" data-title="Extencilline suisse n° 69765 : identifier la spécialité"><div class="lab">Composition et indication</div><p>Extencilline, autorisation Swissmedic n° 69765, est une poudre et un solvant pour suspension IM de benzathine benzylpénicilline, en flacons de 1,2 ou 2,4 MUI. Sa FI suisse mentionne la syphilis précoce primaire/secondaire et la syphilis tardive hors neurosyphilis et anomalie du LCR. Elle ne nomme pas séparément la latence précoce, pour laquelle la SSI apporte le schéma clinique. Le texte signale que l'autorisation repose sur un médicament de comparaison néerlandais dont l'information datait de janvier 2021 ; Swissmedic a ajouté des informations de sécurité en mai 2025. La fiche Compendium signale une nouvelle commercialisation le 8 mai 2026, sans garantir le stock local.</p><div class="lab">Avant l'administration</div><p>Le professionnel vérifie le nom, la force 2,4 MUI, le lot, les excipients et la FI en vigueur. La suspension est destinée uniquement à l'IM profonde. L'avis de juillet 2026 sur certains emballages français rappelle que la notice contenue dans la boîte peut être celle du mauvais dosage.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Extencilline n° 69765, texte complet</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/en/dokumente/marktueberwachung/out-of-stock/out-of-stock-extencilline-1200000-und-2400000-ui-pulver-und-loesungsmittel-zur-herstellung-einer-injektionssuspension.pdf.download.pdf/20260806-out-of-stock-extencilline_de_fr.pdf" target="_blank" rel="noopener" data-reference-source="1">Avis diffusé sur Swissmedic, juillet 2026</a> ; <a href="https://compendium.ch/fr/product/1653651-extencilline-subst-seche-2-4-mio-ui-c-solv/mpro" target="_blank" rel="noopener" data-reference-source="1">Compendium, fiche 2,4 MUI, nouvelle commercialisation le 8 mai 2026</a>. Lus le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-reconstitution" data-title="Reconstitution : 5 mL pour Extencilline 2,4 MUI"><div class="lab">FI suisse</div><p>Le flacon Extencilline <b>2,4 MUI</b> est reconstitué avec <b>5 mL d'eau pour préparations injectables</b>, d'après sa FI suisse. La FI réserve 4 mL au flacon <b>1,2 MUI</b>. La suspension est agitée soigneusement au moins vingt secondes puis utilisée immédiatement selon les instructions du produit. Les conditions d'asepsie, la dose et la voie sont contrôlées par le professionnel.</p><div class="lab">Solvant et volume administré</div><p>Le volume de solvant ajouté n'est pas nécessairement le volume final de suspension. La FI indique de <b>ne pas administrer plus de 5 mL de suspension prête à injecter en un site unique</b>. Le professionnel mesure le volume obtenu après reconstitution et répartit la dose entre sites si ce volume dépasse cette limite, selon les instructions de la spécialité.</p><div class="lab">Pourquoi vérifier le lot</div><p>Le lot 72500106 de 2,4 MUI livré en emballage français contient par erreur une notice de 1,2 MUI affichant 4 mL. L'avis suisse de juillet 2026 demande de suivre la FI suisse et 5 mL pour 2,4 MUI. La consigne est spécifique à ces présentations ; elle ne devient pas une règle pour toutes les pénicillines retard.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Mode d'administration et Remarques concernant la manipulation</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/en/dokumente/marktueberwachung/out-of-stock/out-of-stock-extencilline-1200000-und-2400000-ui-pulver-und-loesungsmittel-zur-herstellung-einer-injektionssuspension.pdf.download.pdf/20260806-out-of-stock-extencilline_de_fr.pdf" target="_blank" rel="noopener" data-reference-source="1">Avis de lot juillet 2026, texte français, lignes sur les volumes</a>. Lus le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-lot" data-title="Lot 72500106 : la notice insérée est celle du mauvais flacon"><div class="lab">Erreur signalée</div><p>La lettre de juillet 2026 diffusée par Swissmedic indique qu'une partie des boîtes françaises Extencilline <b>2,4 MUI, lot 72500106</b>, contient par erreur la notice professionnelle de <b>1,2 MUI</b>. Celle-ci décrit 4 mL de solvant ; la reconstitution correcte du flacon 2,4 MUI est <b>5 mL</b>. Le lot 72500603 de 1,2 MUI n'est pas concerné par cette erreur.</p><div class="lab">Conduite</div><p>Le professionnel contrôle la force et le lot sur la boîte et le flacon. Il applique ensuite l'information professionnelle suisse actuelle, qui reste valable aussi pour l'emballage français. L'erreur de notice ne signifie pas que le flacon contient 1,2 MUI.</p><div class="src">Source primaire : <a href="https://www.swissmedic.ch/dam/swissmedic/en/dokumente/marktueberwachung/out-of-stock/out-of-stock-extencilline-1200000-und-2400000-ui-pulver-und-loesungsmittel-zur-herstellung-einer-injektionssuspension.pdf.download.pdf/20260806-out-of-stock-extencilline_de_fr.pdf" target="_blank" rel="noopener" data-reference-source="1">Lettre Leman SKL SA de juillet 2026 diffusée par Swissmedic, section française</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-soja" data-title="Allergie : pénicilline et excipients d'Extencilline"><div class="lab">Contre-indications de la spécialité</div><p>La FI Extencilline contre-indique le produit en cas d'hypersensibilité à la benzathine benzylpénicilline, aux autres pénicillines, aux phospholipides de soja, à l'arachide ou à ses autres excipients. La composition liste les phospholipides de soja, mais pas l'arachide : l'allergie à l'arachide est une contre-indication distincte, non la preuve d'un ingrédient arachide. Elle inclut certains antécédents de réaction immédiate sévère à d'autres bêta-lactamines. Une anaphylaxie peut survenir même à la première administration connue.</p><div class="lab">Décision clinique</div><p>Le médecin précise la réaction, sa chronologie et sa gravité. Il vérifie les excipients du produit exact. Une contre-indication réelle appelle une stratégie spécialisée, en particulier si la grossesse rend la pénicilline nécessaire. La FI conseille une observation médicale après injection, si possible au moins trente minutes pour les personnes exposées.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Composition, Contre-indications et Mises en garde</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-scar" data-title="Réactions cutanées graves : ne pas réexposer"><div class="lab">Alerte de la FI suisse</div><p>La FI Extencilline signale des réactions cutanées sévères, dont syndrome de Stevens–Johnson, nécrolyse épidermique toxique et réaction médicamenteuse avec éosinophilie et symptômes systémiques. Leur apparition impose l'arrêt immédiat de la benzathine benzylpénicilline et une prise en charge adaptée. Après un tel épisode dû à cette molécule, la FI interdit sa réadministration.</p><div class="lab">Avant et après l'injection</div><p>Le médecin documente les réactions cutanées graves antérieures, informe le patient des signes à signaler et prévoit un recours urgent. Cette vérification complète l'histoire d'anaphylaxie ; elle ne suppose aucun antécédent chez l'adulte du cas.</p><div class="src">Source primaire : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI suisse Extencilline n° 69765, « Mises en garde et précautions — réactions cutanées sévères », texte avec ajouts suisses de sécurité de mai 2025</a>, consultée le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-interactions" data-title="Interactions : méthotrexate et antivitamines K"><div class="lab">Mécanismes de la FI</div><p>La FI Extencilline indique que la benzathine benzylpénicilline peut réduire l'excrétion du <b>méthotrexate</b> et accroître sa toxicité ; elle ne recommande pas cette association. Elle indique aussi qu'un traitement concomitant par <b>anticoagulant antivitamine K</b> peut accentuer l'anticoagulation et le risque de saignement.</p><div class="lab">Conséquence pratique</div><p>Avant toute injection, le médecin revoit les traitements réels. Si un antivitamine K est pris, la FI recommande de contrôler l'INR et d'ajuster l'anticoagulant pendant et après le traitement. Si le méthotrexate est pris, le choix thérapeutique demande une évaluation spécialisée. Aucun de ces traitements n'est connu dans le cas.</p><div class="src">Source primaire : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI suisse Extencilline n° 69765, « Interactions — Méthotrexate ; Anticoagulants », texte avec ajouts suisses de sécurité de mai 2025</a>, consultée le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-renal" data-title="Fonction rénale : la FI demande une vérification individuelle"><div class="lab">Pourquoi la fonction rénale compte</div><p>La benzylpénicilline est surtout éliminée par le rein. La FI Extencilline prévoit une adaptation aux troubles rénaux et mentionne des effets neurologiques possibles avec fortes expositions, notamment lorsque la fonction rénale est réduite.</p><div class="lab">Limite du tableau du produit</div><p>Le tableau rénal de la FI exprime des proportions de « dose quotidienne normale », alors que le schéma de syphilis décrit ici comporte une ou trois doses hebdomadaires. Le cours ne convertit donc pas ce tableau en dose individuelle. Le médecin vérifie la fonction rénale et demande un avis adapté si elle est altérée ; aucune valeur rénale n'est fournie pour le cas.</p><div class="src">Source primaire : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI suisse Extencilline n° 69765, « Posologie/Mode d'emploi — Patients présentant des troubles de la fonction rénale », « Mises en garde » et « Pharmacocinétique », texte avec ajouts suisses de sécurité de mai 2025</a>, consultée le 8 octobre 2026.</div></template>


<template data-pop="a53-ph-jarisch" data-title="Jarisch–Herxheimer : réaction fébrile après traitement"><div class="lab">Signes et délai</div><p>La FI Extencilline décrit fièvre, frissons, céphalées, myalgies et autres symptômes possibles deux à douze heures après l'administration contre la syphilis. La réaction survient après le traitement et s'accompagne d'une réponse inflammatoire ; elle se résout habituellement en quelques heures. Sa pathogénie précise reste mal comprise selon BASHH 2024. Elle peut être plus préoccupante dans certaines situations, dont la grossesse.</p><div class="lab">Ne pas masquer l'allergie</div><p>Une fièvre transitoire isolée n'est pas une hypersensibilité à la pénicilline. En revanche, urticaire généralisée, gêne respiratoire ou collapsus exigent une évaluation urgente ; le nom « Jarisch–Herxheimer » ne doit pas retarder la prise en charge d'une anaphylaxie. Le médecin prévient le patient et précise un recours accessible.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Mises en garde, réaction de Jarisch–Herxheimer, ajouts suisses mai 2025</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, « The Jarisch–Herxheimer reaction »</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-grossesse" data-title="Grossesse : traiter la mère pour protéger aussi le fœtus"><div class="lab">Raison clinique</div><p>Une syphilis maternelle peut être transmise au fœtus. La pénicilline est le traitement dont l'efficacité est établie pour prévenir cette transmission. La FI Extencilline indique que la benzathine benzylpénicilline traverse le placenta et peut être utilisée pendant la grossesse si l'indication est justifiée après évaluation des bénéfices et risques.</p><div class="lab">Allergie et calendrier</div><p>Le CDC 2021 recommande désensibilisation puis pénicilline chez une personne enceinte allergique. Pour trois injections latentes, un intervalle dépassant neuf jours entre deux doses conduit selon le CDC à reprendre toute la série. Une réaction de Jarisch–Herxheimer impose aussi une attention obstétricale. Aucune grossesse n'est établie dans le cas décrit.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline, Grossesse</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Pregnancy et doses retardées</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-pregnancy.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Syphilis During Pregnancy</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-alternatives" data-title="Doxycycline : l'écart de durée change la décision"><div class="lab">Trois directives, des stades différents</div><p>La SSI suisse validée le 13 juin 2024 indique, dans sa branche « réaction anaphylactique » à la pénicilline, doxycycline <b>100 mg par voie orale deux fois par jour pendant 14 jours</b> pour une syphilis « primaire, secondaire ou latente », sans distinguer la latence tardive. Pour une latence tardive ou de durée inconnue, le CDC 2021 indique <b>100 mg deux fois par jour pendant 28 jours</b> ; BASHH 2024 donne aussi <b>28 jours</b> pour la latence tardive, avec un niveau de preuve 2D.</p><div class="lab">Portée clinique</div><p>L'écart 14/28 jours ne se résout pas avec le RPR 1:8 du cas, qui ne date pas l'infection. L'efficacité des alternatives reste moins documentée que celle de la pénicilline ; un médecin vérifie l'allergie, le stade, la grossesse, la FI suisse de la doxycycline réellement choisie et la possibilité d'un suivi sérologique, puis demande un avis spécialisé. Le CDC privilégie une évaluation d'allergie et une désensibilisation si le suivi ou l'observance ne peuvent être garantis.</p><div class="src">Sources primaires : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », « Traitement — Allergie à la pénicilline », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, « Penicillin Allergy », latence tardive et durée inconnue</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, « Recommended regimens — Late latent », grade 2D</a>. Textes lus le 8 octobre 2026 ; BASHH est une directive britannique, non une FI suisse.</div></template>

<template data-pop="a53-ph-ceftriaxone" data-title="Ceftriaxone : trois textes, trois périmètres"><div class="lab">Directives réellement consultées</div><p>La SSI « Syphilis » validée le 13 juin 2024 indique <b>ceftriaxone 1 g IM ou IV chaque jour pendant 8–10 jours</b> dans la branche d'allergie à la pénicilline limitée à une éruption cutanée, sans schéma propre à la latence tardive. Le CDC 2021 juge la ceftriaxone biologiquement plausible pour la latence, mais dit que sa dose et sa durée optimales ne sont pas établies. La directive britannique BASHH 2024 propose, pour la latence tardive, <b>2 g IM ou IV pendant 10–14 jours</b>, avec un niveau de preuve 2D.</p><div class="lab">Décision</div><p>Ces doses, durées et populations ne sont pas équivalentes. L'histoire d'allergie et le stade doivent être clarifiés avant toute alternative ; la FI suisse du produit choisi et l'avis spécialisé sont indispensables. Le RPR 1:8 sans histoire ne permet pas de sélectionner un de ces schémas.</p><div class="src">Sources primaires : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », « Traitement — Allergie à la pénicilline », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, « Penicillin Allergy », syphilis latente</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, « Recommended regimens — Late latent », grade 2D</a>. Textes lus le 8 octobre 2026 ; BASHH ne décrit pas une autorisation suisse.</div></template>

<template data-pop="a53-ph-rpr" data-title="RPR : facteur quatre CDC et formulation SSI distincte"><div class="lab">Mesure comparable</div><p>Le RPR quantitatif se suit de préférence avec la même méthode et le même laboratoire. Le CDC 2021 définit une variation cliniquement significative comme un <b>facteur quatre</b>, soit <b>deux dilutions</b> : 1:8 devient 1:2 pour une baisse ou 1:32 pour une hausse. RPR et VDRL ne se comparent pas directement par leur chiffre. Une diminution de 1:8 à 1:4 est une seule dilution.</p><div class="lab">Trois calendriers et seuils à lire dans leur contexte</div><p>La SSI « Syphilis », validée le 13 juin 2024, prévoit des contrôles à <b>3, 6, 12 et 24 mois</b> et écrit qu'après six mois le RPR/VDRL devrait être négatif ou avoir diminué de <b>« 4 titrations, soit 1/16 »</b>. Cette formulation indique un facteur seize, différent du seuil de changement significatif ×4 du CDC. Le CDC prévoit <b>6, 12 et 24 mois</b> pour la latence ; BASHH 2024 prévoit <b>3, 6 et 12 mois</b>, puis tous les six mois si indiqué jusqu'à négativation ou sérofixation. Les écarts ne se convertissent pas en verdict automatique d'échec ; le titre initial, le stade et le traitement antérieur comptent. Le 1:8 isolé du cas ne se qualifie pas de « bas » sur la seule base de ce chiffre. La trajectoire, le traitement antérieur, le stade et les expositions guident l'avis spécialisé.</p><div class="src">Sources primaires : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », « Suivi et diagnostic/exclusion de la neurosyphilis », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, « Nontreponemal Tests »</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, « Follow-Up » de la latence</a> ; <a href="https://www.bashh.org/_userfiles/pages/files/syphilis_2024.pdf" target="_blank" rel="noopener" data-reference-source="1">BASHH 2024, « Follow-up »</a>. Textes lus le 8 octobre 2026.</div></template>

<template data-pop="pareto-a53-ph" data-title="Loi de Pareto — Pharmacologie de la syphilis latente"><ol><li>TPPA+ et RPR 1:8 ne datent pas l'infection. Le médecin vérifie rapidement titres, traitements, signes et expositions ; si aucun traitement adéquat antérieur n'est documenté, IUSTI Europe recommande de traiter par précaution.</li><li>Après cette enquête, le stade détermine la dose : 2,4 MUI de benzathine pénicilline G IM une fois pour une forme précoce établie ; trois injections hebdomadaires de 2,4 MUI pour une latence tardive ou de durée inconnue sans traitement adéquat antérieur documenté.</li><li>Extencilline suisse n° 69765 est une suspension IM profonde, jamais IV. Le flacon 2,4 MUI se reconstitue avec 5 mL, y compris le lot 72500106 dont la notice française insérée par erreur indique le volume de 1,2 MUI.</li><li>Une atteinte neurologique, oculaire ou auditive exige une évaluation et un autre schéma. Le médecin vérifie grossesse, allergies, réactions cutanées graves, interactions et fonction rénale.</li><li>Le RPR se compare quantitativement avec le même test : CDC ×4 = deux dilutions. La SSI écrit « 4 titrations, soit 1/16 » à six mois ; les seuils ne sont pas identiques et un RPR peut persister après traitement sans que le 1:8 isolé du cas prouve une sérofixation.</li></ol><div class="key">La sérologie du cas ne fixe pas le stade. Après une enquête rapide, l'absence de traitement adéquat antérieur documenté conduit à un traitement de précaution selon IUSTI Europe 2020 ; le choix du stade, de la voie et du produit reste clinique.</div></template>
