<template data-pop="a53-m-bpg" data-title="Benzathine-pénicilline G : Extencilline®">
<div class="lab">Mécanisme</div><p>Fixation aux protéines de liaison des pénicillines et inhibition des transpeptidases de la paroi pendant la croissance : effet bactéricide, dépendant du temps passé au-dessus de la concentration minimale inhibitrice. Le dépôt intramusculaire libère lentement la benzylpénicilline ; pic plasmatique vers 48 heures chez l’adulte ; liaison aux protéines d’environ 55 % ; élimination surtout rénale.</p>
<div class="lab">Preuves</div><p>Les schémas reposent surtout sur des données pharmacologiques, la plausibilité biologique et l’expérience clinique ; la directive européenne reconnaît l’absence d’essais bien contrôlés sur la dose et la durée optimales. Le projet de 2026 cite des essais montrant l’absence de bénéfice de trois doses sur une seule dans la syphilis précoce.</p>
<div class="lab">Posologie suisse</div><p>Adulte et adolescent : 2,4 MUI intramusculaire en dose unique aux stades primaire et secondaire ; 2,4 MUI une fois par semaine pendant trois semaines au stade tardif latent. Enfant : 50 000 UI/kg sans dépasser 2,4 MUI. Syphilis congénitale sans atteinte neurologique : 50 000 UI/kg en dose unique. Flacon de 2,4 MUI reconstitué avec 5 mL d’eau pour préparations injectables.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux pénicillines, aux phospholipides de soja, à l’arachide ou à un excipient ; antécédent de réaction immédiate sévère à une autre bêta-lactamine. Non indiquée dans la neurosyphilis ni en cas d’anomalie du liquide céphalo-rachidien. Jamais en intraveineuse ni dans un tissu mal perfusé.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Réaction de Jarisch-Herxheimer, anaphylaxie, réactions cutanées sévères, syndrome de Kounis, syndromes de Hoigné et de Nicolau, douleur et infiltrat au point d’injection, colite pseudomembraneuse. Observation d’au moins une demi-heure. Grossesse : utilisable si l’indication est justifiée ; passage placentaire. Allaitement : passage faible dans le lait, interruption si diarrhée, candidose ou éruption chez l’enfant.</p>

<template data-pop="a53-m-peng" data-title="Pénicilline G intraveineuse : Pénicilline « Grünenthal »">
<div class="lab">Mécanisme</div><p>Même mécanisme que la forme retard, mais la voie intraveineuse à forte dose produit des concentrations élevées qui atteignent le liquide céphalo-rachidien, où la forme retard reste insuffisante.</p>
<div class="lab">Posologie</div><p>Neurosyphilis, syphilis oculaire et otosyphilis : 4 MUI intraveineuse toutes les 4 heures pendant 14 jours selon la SSI ; 18 à 24 MUI par jour pendant 10 à 14 jours selon la directive européenne. L’information professionnelle suisse autorise 20 à 60 MUI par jour en 4 à 6 doses dans les infections graves. Au-delà de 2 MUI, l’injection intraveineuse est lente, au plus 0,5 MUI par minute. Flacon de 10 MUI. Insuffisance rénale : même dose initiale, puis réduction ou espacement selon le tableau de filtration glomérulaire.</p>
<div class="lab">Contre-indications et surveillance</div><p>Hypersensibilité avérée à la pénicilline. Neurotoxicité dose-dépendante, majorée en insuffisance rénale ; neutropénie au-delà de 200 MUI cumulées ; charge sodée de 386 mg par flacon de 10 MUI ; néphrite interstitielle ; contrôle de la formule sanguine, de la fonction rénale et des électrolytes. Grossesse : utilisable.</p>
<div class="src"><a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/9e89b1a4da6e4018bdbd9eb87e8c9b0f-fr.html" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Pénicilline « Grünenthal », Swissmedic (AIPS), consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020</a>.</div>

<template data-pop="a53-m-doxy" data-title="Doxycycline : Doxycline®">
<div class="lab">Mécanisme et place</div><p>Tétracycline bactériostatique, de bonne pénétration dans le liquide céphalo-rachidien selon la directive européenne, mais évaluée seulement par des études observationnelles et rétrospectives. Alternative en cas d’allergie aux pénicillines, hors grossesse ; jamais associée à une pénicilline.</p>
<div class="lab">Posologie suisse</div><p>Syphilis primaire ou secondaire, ou latente de moins d’un an : 100 mg deux fois par jour par voie orale pendant deux semaines. Syphilis latente ou tertiaire de plus d’un an ou de durée inconnue : quatre semaines. Prise au moins une heure avant un repas et avant le coucher, avec suffisamment de liquide, en position assise ou debout. Aucune adaptation rénale.</p>
<div class="lab">Contre-indications et précautions</div><p>Hypersensibilité aux tétracyclines ; insuffisance hépatique sévère. Grossesse : pas d’administration sauf nécessité absolue. Allaitement : à éviter. Avant 12 ans : réservée aux situations graves, en raison de la coloration dentaire. Hypertension intracrânienne bénigne ; réactions cutanées sévères ; colite à <i>Clostridioides difficile</i>. Après un traitement par doxycycline d’une syphilis tardive, certains experts proposent une ponction lombaire chez la personne sans symptôme (2, D).</p>

<template data-pop="a53-m-ceftriaxone" data-title="Ceftriaxone : Rocephin®">
<div class="lab">Place</div><p>Céphalosporine à spectre étendu, de bonne pénétration dans le liquide céphalo-rachidien. La SSI la propose, 1 g par jour pendant 8 à 10 jours, en cas d’allergie limitée à une éruption. La directive européenne la propose en cas de trouble de la coagulation, 1 g par jour par voie intraveineuse pendant 10 jours, et en deuxième ligne de la neurosyphilis, 1 à 2 g par jour pendant 10 à 14 jours. La syphilis ne figure pas parmi les indications de son information professionnelle suisse : son emploi est hors indication.</p>
<div class="lab">Contre-indications et précautions</div><p>Hypersensibilité aux céphalosporines ; risque accru après une allergie aux pénicillines ; anaphylaxie aux pénicillines : contre-indication absolue selon la directive européenne. Forme intramusculaire avec lidocaïne : contre-indiquée pendant la grossesse, en cas de trouble de la conduction cardiaque ou d’allergie aux anesthésiques locaux, jamais en intraveineuse. Nouveau-né : contre-indiquée en cas d’hyperbilirubinémie ou de besoin de calcium intraveineux. Précipités biliaires de calcium-ceftriaxone. Insuffisance rénale terminale : au plus 2 g par jour.</p>

<template data-pop="a53-disponibilite" data-title="Benzathine-pénicilline en Suisse : un écart daté">
<p>La SSI, validée en juin 2024, écrit : « Benzathine-pénicilline : à commander par la pharmacie cantonale (produit importé) » et décrit une injection fessière « 2 × 5 ml ». Depuis, Extencilline® 1,2 MUI et 2,4 MUI a reçu l’autorisation Swissmedic 69765 et Compendium signale sa commercialisation en mai 2026. Le flacon suisse de 2,4 MUI se reconstitue en une suspension de 5 mL, à injecter en un seul site, la limite tolérée étant de 5 mL par site. En juillet 2026, un problème de livraison a conduit à des boîtes en emballage français, dont un lot contenait une notice erronée.</p>
<p><b>Décision retenue.</b> La dose et le schéma de la SSI restent valables ; la préparation suit l’information professionnelle suisse du produit réellement délivré. La disponibilité locale se vérifie auprès de la pharmacie, car des ruptures de benzathine-pénicilline sont fréquentes en Europe selon la directive européenne.</p>
