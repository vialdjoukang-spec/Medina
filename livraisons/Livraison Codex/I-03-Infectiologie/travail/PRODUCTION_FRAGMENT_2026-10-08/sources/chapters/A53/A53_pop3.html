<template data-pop="a53-ph-tppa" data-title="TPPA positif : mémoire immunitaire, pas datation"><div class="lab">Ce que mesure le test</div><p>Le TPPA recherche des anticorps dirigés contre <i>Treponema pallidum</i>. Chez de nombreuses personnes, il reste positif après un traitement adéquat. Sa positivité n'établit donc ni que l'infection est encore active, ni quand elle a commencé.</p><div class="lab">Application</div><p>Chez l'adulte du cas, il faut obtenir les traitements et titres RPR antérieurs, examiner les signes et préciser les expositions avant de décider d'une nouvelle antibiothérapie. Un TPPA positif ne suffit pas à prescrire trois injections.</p><div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC, Syphilis, recommandations thérapeutiques 2021, Treponemal Tests</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », validée le 13 juin 2024</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-serofast" data-title="RPR persistant après traitement : interpréter la trajectoire"><div class="lab">Phénomène</div><p>Le titre non tréponémique peut diminuer après traitement puis rester faiblement réactif pendant longtemps. Le CDC décrit cette persistance sans négativation ; elle ne démontre pas, à elle seule, une infection vivante ou un échec.</p><div class="lab">Décision</div><p>Le médecin compare le RPR actuel aux titres antérieurs obtenus par la même méthode. Il tient compte du stade initial, du traitement reçu et des expositions nouvelles. Sans ces éléments, le RPR 1:8 du cas ne prouve ni sérofixation, ni réinfection. Une hausse soutenue d'au moins quatre fois oriente autrement qu'une stabilité ancienne.</p><div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Nontreponemal Tests</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Follow-Up de la syphilis latente</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-recent" data-title="Syphilis latente précoce : la preuve vient du temps"><div class="lab">Critères de datation</div><p>Le CDC classe comme précoce une syphilis latente lorsque, dans l'année précédente, une séroconversion, une hausse soutenue d'au moins quatre fois du titre après traitement, des signes nets de syphilis primaire ou secondaire, ou un partenaire infecté à un stade précoce sont documentés. Une exposition possible limitée à cette année peut aussi étayer cette classification.</p><div class="lab">Limite du titre</div><p>Un RPR à 1:8 ne date pas l'infection. Sans indice temporel fiable et sans traitement antérieur adéquat, une infection latente retenue se classe en durée inconnue plutôt que « précoce » par intuition. L'examen recherche d'abord une lésion primaire ou secondaire silencieuse.</p><div class="src">Sources : <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, définition Early Latent Syphilis</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Syphilis », 13 juin 2024</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-neuro" data-title="Atteinte neurologique, oculaire ou auditive : le dépôt IM ne suffit pas"><div class="lab">Frontière du traitement</div><p>La suspension de benzathine benzylpénicilline libère lentement de la pénicilline dans le sang mais n'assure pas le schéma de forte exposition nécessaire pour une neurosyphilis. La FI suisse Extencilline exclut explicitement la neurosyphilis et les anomalies du liquide céphalorachidien de son indication de syphilis tardive.</p><div class="lab">Conduite</div><p>Symptômes neurologiques, visuels ou auditifs imposent un examen et une décision spécialisée rapides. Le CDC 2021 recommande pour ces atteintes chez l'adulte une pénicilline G aqueuse IV à 18–24 MUI par jour pendant 10–14 jours ; cette dose américaine n'est pas à confondre avec la suspension Extencilline IM ni à transposer sans produit et avis adaptés. Aucun signe de cette catégorie n'est rapporté dans le cas, mais il doit être recherché.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI suisse Extencilline n° 69765, Indications, consultée le 8 octobre 2026</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/neurosyphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Neurosyphilis, Ocular Syphilis, and Otosyphilis</a>.</div></template>

<template data-pop="a53-ph-mecanisme" data-title="Benzathine pénicilline G : action et longue exposition"><div class="lab">Mécanisme</div><p>La pénicilline G bloque les protéines qui assemblent le peptidoglycane de la paroi bactérienne, ce qui tue un tréponème sensible en multiplication. Le sel de benzathine se libère lentement après injection IM ; cette forme retard prolonge une faible exposition systémique plutôt que de créer un pic IV.</p><div class="lab">Conséquence</div><p>Le stade détermine la durée : une injection pour une infection précoce établie, trois doses espacées d'une semaine pour une latence tardive ou de durée inconnue retenue. La diffusion au système nerveux est insuffisante pour substituer Extencilline à la pénicilline aqueuse d'une neurosyphilis.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Propriétés/Effets et Posologie</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, traitement de la latence</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-one" data-title="Une dose IM : réservée à un stade précoce établi"><div class="lab">Schéma</div><p>La SSI suisse « Syphilis », validée le 13 juin 2024, et le CDC 2021 recommandent la benzathine pénicilline G <b>2,4 MUI IM en une administration</b> pour une syphilis primaire, secondaire ou latente précoce établie. La FI Extencilline n° 69765 indique 2,4 MUI en dose unique pour les stades primaire et secondaire.</p><div class="lab">Limite</div><p>Un TPPA positif avec RPR 1:8 ne prouve pas un stade précoce. La dose unique n'est choisie qu'après examen et datation suffisante. L'existence d'une atteinte neurologique, oculaire ou auditive change de traitement.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Early Latent Syphilis</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline, Posologie</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-three" data-title="Trois doses hebdomadaires : latence tardive ou inconnue retenue"><div class="lab">Schéma et portée des sources</div><p>Pour une <b>syphilis latente tardive</b>, la SSI 2024 et la FI suisse Extencilline décrivent <b>2,4 MUI de benzathine pénicilline G IM chaque semaine pendant trois semaines</b>, soit 7,2 MUI au total, hors atteinte neurologique et anomalie du LCR pour la FI. Le <b>CDC 2021</b> applique explicitement ce même schéma à la syphilis latente tardive <b>ou de durée inconnue</b>. La page SSI consultée ne formule pas séparément la catégorie « durée inconnue » ; le cours attribue cette extension au CDC, sans la lui prêter.</p><div class="lab">Application conditionnelle</div><p>Le cas ne fournit ni ancien traitement ni preuve que le RPR 1:8 traduit une infection non traitée. Il faut établir l'indication avant de programmer trois injections. Le statut VIH, la grossesse et les signes neurologiques sont évalués, sans modifier automatiquement le schéma de latence sur le seul RPR.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », 13 juin 2024, syphilis tardive</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline, Posologie, syphilis latente tardive</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Late Latent Syphilis et Unknown Duration</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-intervalle" data-title="Intervalle des injections : prévenir une exposition insuffisante"><div class="lab">Règle</div><p>Les trois doses d'une syphilis latente tardive ou de durée inconnue sont prévues à une semaine d'intervalle. Le CDC 2021 indique qu'un intervalle de 7–9 jours est préférable ; 10–14 jours peut être toléré selon l'expérience clinique chez une personne non enceinte avant de recommencer la série, sans certitude forte.</p><div class="lab">Grossesse</div><p>Chez une personne enceinte traitée pour une syphilis latente, le CDC demande de recommencer la cure entière si l'écart entre deux doses dépasse neuf jours. Un rendez-vous manqué est donc évalué immédiatement ; cette règle ne transforme pas le cas asymptomatique en grossesse connue.</p><div class="src">Source : <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, passage sur les doses retardées, Latent Syphilis</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-produit" data-title="Extencilline suisse n° 69765 : identifier la spécialité"><div class="lab">Composition et indication</div><p>Extencilline, autorisation Swissmedic n° 69765, est une poudre et un solvant pour suspension IM de benzathine benzylpénicilline, en flacons de 1,2 ou 2,4 MUI. Sa FI suisse mentionne la syphilis précoce primaire/secondaire et la syphilis tardive hors neurosyphilis et anomalie du LCR. Le texte signale que l'autorisation repose sur un médicament de comparaison néerlandais dont l'information datait de janvier 2021 ; Swissmedic a ajouté des informations de sécurité en mai 2025.</p><div class="lab">Avant l'administration</div><p>Le professionnel vérifie le nom, la force 2,4 MUI, le lot, les excipients et la FI en vigueur. La suspension est destinée uniquement à l'IM profonde. L'avis de juillet 2026 sur certains emballages français rappelle que la notice contenue dans la boîte peut être celle du mauvais dosage.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Extencilline n° 69765, texte complet</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/en/dokumente/marktueberwachung/out-of-stock/out-of-stock-extencilline-1200000-und-2400000-ui-pulver-und-loesungsmittel-zur-herstellung-einer-injektionssuspension.pdf.download.pdf/20260806-out-of-stock-extencilline_de_fr.pdf" target="_blank" rel="noopener" data-reference-source="1">Avis diffusé sur Swissmedic, juillet 2026</a>. Lus le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-reconstitution" data-title="Reconstitution : 5 mL pour Extencilline 2,4 MUI"><div class="lab">FI suisse</div><p>Le flacon Extencilline <b>2,4 MUI</b> est reconstitué avec <b>5 mL d'eau pour préparations injectables</b>, d'après sa FI suisse. La FI réserve 4 mL au flacon <b>1,2 MUI</b>. La suspension est agitée soigneusement au moins vingt secondes puis utilisée immédiatement selon les instructions du produit. Les conditions d'asepsie, la dose et la voie sont contrôlées par le professionnel.</p><div class="lab">Solvant et volume administré</div><p>Le volume de solvant ajouté n'est pas nécessairement le volume final de suspension. La FI indique de <b>ne pas administrer plus de 5 mL de suspension prête à injecter en un site unique</b>. Le professionnel mesure le volume obtenu après reconstitution et répartit la dose entre sites si ce volume dépasse cette limite, selon les instructions de la spécialité.</p><div class="lab">Pourquoi vérifier le lot</div><p>Le lot 72500106 de 2,4 MUI livré en emballage français contient par erreur une notice de 1,2 MUI affichant 4 mL. L'avis suisse de juillet 2026 demande de suivre la FI suisse et 5 mL pour 2,4 MUI. La consigne est spécifique à ces présentations ; elle ne devient pas une règle pour toutes les pénicillines retard.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Mode d'administration et Remarques concernant la manipulation</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/en/dokumente/marktueberwachung/out-of-stock/out-of-stock-extencilline-1200000-und-2400000-ui-pulver-und-loesungsmittel-zur-herstellung-einer-injektionssuspension.pdf.download.pdf/20260806-out-of-stock-extencilline_de_fr.pdf" target="_blank" rel="noopener" data-reference-source="1">Avis de lot juillet 2026, texte français, lignes sur les volumes</a>. Lus le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-lot" data-title="Lot 72500106 : la notice insérée est celle du mauvais flacon"><div class="lab">Erreur signalée</div><p>La lettre de juillet 2026 diffusée par Swissmedic indique qu'une partie des boîtes françaises Extencilline <b>2,4 MUI, lot 72500106</b>, contient par erreur la notice professionnelle de <b>1,2 MUI</b>. Celle-ci décrit 4 mL de solvant ; la reconstitution correcte du flacon 2,4 MUI est <b>5 mL</b>. Le lot 72500603 de 1,2 MUI n'est pas concerné par cette erreur.</p><div class="lab">Conduite</div><p>Le professionnel contrôle la force et le lot sur la boîte et le flacon. Il applique ensuite l'information professionnelle suisse actuelle, qui reste valable aussi pour l'emballage français. L'erreur de notice ne signifie pas que le flacon contient 1,2 MUI.</p><div class="src">Source primaire : <a href="https://www.swissmedic.ch/dam/swissmedic/en/dokumente/marktueberwachung/out-of-stock/out-of-stock-extencilline-1200000-und-2400000-ui-pulver-und-loesungsmittel-zur-herstellung-einer-injektionssuspension.pdf.download.pdf/20260806-out-of-stock-extencilline_de_fr.pdf" target="_blank" rel="noopener" data-reference-source="1">Lettre Leman SKL SA de juillet 2026 diffusée par Swissmedic, section française</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-soja" data-title="Allergie : pénicilline et excipients d'Extencilline"><div class="lab">Contre-indications de la spécialité</div><p>La FI Extencilline contre-indique le produit en cas d'hypersensibilité à la benzathine benzylpénicilline, aux autres pénicillines, aux phospholipides de soja, à l'arachide ou à ses autres excipients. Elle inclut certains antécédents de réaction immédiate sévère à d'autres bêta-lactamines. Une anaphylaxie peut survenir même à la première administration connue.</p><div class="lab">Décision clinique</div><p>Le médecin précise la réaction, sa chronologie et sa gravité. Il vérifie les excipients du produit exact. Une contre-indication réelle appelle une stratégie spécialisée, en particulier si la grossesse rend la pénicilline nécessaire. La FI conseille une observation médicale après injection, si possible au moins trente minutes pour les personnes exposées.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Composition, Contre-indications et Mises en garde</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-jarisch" data-title="Jarisch–Herxheimer : inflammation après destruction des tréponèmes"><div class="lab">Mécanisme et délai</div><p>La FI Extencilline décrit fièvre, frissons, céphalées, myalgies et autres symptômes possibles deux à douze heures après l'administration contre la syphilis. Cette réaction inflammatoire suit l'action bactéricide et se résout habituellement en quelques heures. Elle peut être plus préoccupante dans certaines situations, dont la grossesse.</p><div class="lab">Ne pas masquer l'allergie</div><p>Une fièvre transitoire isolée n'est pas une hypersensibilité à la pénicilline. En revanche, urticaire généralisée, gêne respiratoire ou collapsus exigent une évaluation urgente ; le nom « Jarisch–Herxheimer » ne doit pas retarder la prise en charge d'une anaphylaxie. Le médecin prévient le patient et précise un recours accessible.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline n° 69765, Mises en garde, réaction de Jarisch–Herxheimer</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-grossesse" data-title="Grossesse : traiter la mère pour protéger aussi le fœtus"><div class="lab">Raison clinique</div><p>Une syphilis maternelle peut être transmise au fœtus. La pénicilline est le traitement dont l'efficacité est établie pour prévenir cette transmission. La FI Extencilline indique que la benzathine benzylpénicilline traverse le placenta et peut être utilisée pendant la grossesse si l'indication est justifiée après évaluation des bénéfices et risques.</p><div class="lab">Allergie et calendrier</div><p>Le CDC 2021 recommande désensibilisation puis pénicilline chez une personne enceinte allergique. Pour trois injections latentes, un intervalle dépassant neuf jours entre deux doses conduit selon le CDC à reprendre toute la série. Une réaction de Jarisch–Herxheimer impose aussi une attention obstétricale. Aucune grossesse n'est établie dans le cas décrit.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69765" target="_blank" rel="noopener" data-reference-source="1">FI Extencilline, Grossesse</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Pregnancy et doses retardées</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-pregnancy.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Syphilis During Pregnancy</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-alternatives" data-title="Doxycycline : option conditionnelle, preuve et suivi limités"><div class="lab">Ce que dit le CDC</div><p>Chez une personne <b>non enceinte</b> avec allergie documentée à la pénicilline et une syphilis latente tardive ou de durée inconnue retenue, le CDC 2021 cite doxycycline 100 mg par voie orale deux fois par jour pendant 28 jours. Il souligne que l'efficacité des alternatives est moins bien documentée et qu'un suivi clinique et sérologique rapproché est nécessaire, surtout en cas de VIH.</p><div class="lab">Limites suisses</div><p>Ce schéma est extrait d'un référentiel américain et n'est pas une ordonnance suisse automatique. Le médecin vérifie la FI suisse du produit choisi, la grossesse, les interactions et la capacité de suivi. Il sollicite un avis spécialisé. Si le suivi ou l'observance ne peuvent être garantis, le CDC envisage évaluation d'allergie et désensibilisation pour administrer la pénicilline. La ceftriaxone n'a pas de schéma latent dose/durée bien établi dans cette source.</p><div class="src">Source : <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Penicillin Allergy et Pregnancy, Latent Syphilis</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="a53-ph-rpr" data-title="RPR : facteur quatre CDC et formulation SSI distincte"><div class="lab">Mesure comparable</div><p>Le RPR quantitatif se suit de préférence avec la même méthode et le même laboratoire. Le CDC 2021 définit une variation cliniquement significative comme un <b>facteur quatre</b>, soit <b>deux dilutions</b> : 1:8 devient 1:2 pour une baisse ou 1:32 pour une hausse. RPR et VDRL ne se comparent pas directement par leur chiffre. Une diminution de 1:8 à 1:4 est une seule dilution.</p><div class="lab">Tension explicite avec le texte suisse</div><p>La SSI « Syphilis », validée le 13 juin 2024, prévoit des contrôles à <b>3, 6, 12 et 24 mois</b> et écrit qu'après six mois le RPR/VDRL devrait être négatif ou avoir diminué de <b>« 4 titrations, soit 1/16 »</b>. Cette formulation indique un facteur seize, différent du seuil de changement significatif ×4 du CDC. Elle ne peut pas être convertie silencieusement en « deux dilutions » ; ni être appliquée sans nuance à un titre initial bas ou à un stade tardif. La trajectoire, le stade, l'ancien traitement et les expositions guident l'appréciation spécialisée.</p><div class="src">Sources primaires : <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI « Syphilis », section « Suivi et diagnostic/exclusion de la neurosyphilis », validée le 13 juin 2024</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Nontreponemal Tests</a> ; <a href="https://www.cdc.gov/std/treatment-guidelines/latent-syphilis.htm" target="_blank" rel="noopener" data-reference-source="1">CDC 2021, Follow-Up de la latence</a>. Lues le 8 octobre 2026.</div></template>

<template data-pop="pareto-a53-ph" data-title="Loi de Pareto — Pharmacologie de la syphilis latente"><ol><li>TPPA+ et RPR 1:8 sans historique ne prouvent ni activité ni stade. Le médecin recherche les titres et traitements antérieurs, les signes et les expositions.</li><li>Si une syphilis non traitée est retenue : 2,4 MUI de benzathine pénicilline G IM une fois pour un stade précoce établi ; trois injections hebdomadaires de 2,4 MUI pour une latence tardive ou de durée inconnue.</li><li>Extencilline suisse n° 69765 est une suspension IM profonde, jamais IV. Le flacon 2,4 MUI se reconstitue avec 5 mL, y compris le lot 72500106 dont la notice française insérée par erreur indique le volume de 1,2 MUI.</li><li>Une atteinte neurologique, oculaire ou auditive nécessite un autre schéma ; grossesse et allergie demandent une conduite spécifique.</li><li>Le RPR se compare quantitativement avec le même test : CDC ×4 = deux dilutions. La SSI écrit « 4 titrations, soit 1/16 » à six mois ; les seuils ne sont pas identiques et un faible titre initial peut persister.</li></ol><div class="key">Ces schémas sont conditionnés par l'histoire et le stade. Aucun traitement nouveau n'est déduit automatiquement de la sérologie du cas.</div></template>
