<template data-pop="a04-p-detail" data-title="Fidaxomicine et vancomycine : indications suisses vérifiées"><div class="lab">Premier épisode d’infection à C. difficile confirmée</div><p>Dans le tableau SSI du premier épisode sans facteur de risque de récidive, la fidaxomicine 200 mg par voie orale deux fois par jour pendant 10 jours est en première ligne et la vancomycine 125 mg par voie orale quatre fois par jour pendant 10 jours en deuxième ligne. Si la forme est sévère avec prise orale possible, la SSI admet l’une ou l’autre. Les informations professionnelles suisses Dificlir n°62957 et Vancocin n°47074 confirment les doses orales citées. Une vancomycine administrée par voie intraveineuse ne traite pas l’infection colique.</p><div class="lab">Limites de prescription</div><p>La récidive, l’iléus, la forme fulminante et l’impossibilité de prise orale requièrent une stratégie distincte et un avis spécialisé. Le schéma pulsé de fidaxomicine évoqué par la SSI dépasse les dix jours continus décrits dans la FI Dificlir ; il doit être distingué de la posologie autorisée. La SSI déconseille une fidaxomicine empirique en attente d’une confirmation.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Infection à C. difficile, « Traitement », 17.04.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=62957" target="_blank" rel="noopener" data-reference-source="1">FI Dificlir n°62957, 12.2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47074" target="_blank" rel="noopener" data-reference-source="1">FI Vancocin n°47074, 03.2026</a>. Consultées le 8 octobre 2026.</div></template>
<template data-pop="pareto-a04-p" data-title="Pareto — pharmacologie suisse"><p class="ratio" data-cover="a04-p-1,a04-p-2,a04-p-3"></p><ul><li>Pas d’antibiotique systématique pour la diarrhée aiguë banale ; hydrater et évaluer.</li><li>Pour une diarrhée sanglante, la proposition d’azithromycine SSI doit être confrontée à l’indication « antibiotiques contre-indiqués » de son tableau pour STEC ; il ne s’agit pas d’une contre-indication formelle de la FI azithromycine.</li><li>Pour une infection à <em>C. difficile</em> confirmée, appliquer le schéma suisse adapté à la gravité et distinguer la récidive ou la forme compliquée.</li><li>Vérifier la FI du produit, la voie, les interactions et les écarts entre directive et indication autorisée.</li></ul><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, gastro-entérite, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, CDI, 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=62957" target="_blank" rel="noopener" data-reference-source="1">FI Dificlir n°62957</a>. Consultées le 8 octobre 2026.</div></template>
