<section class="ilot" id="a04-0"><h2><span class="n">0</span>Une diarrhée sanglante après un repas : que sait-on vraiment ?</h2>
<p><b>Vignette fictive.</b> Une personne adulte de 35 ans consulte après trois jours de selles liquides avec du sang visible et des crampes abdominales. Les symptômes ont commencé après un repas comprenant de la volaille. Elle ne rapporte ni voyage ni antibiothérapie récente. Les constantes, l'état d'hydratation, la fonction rénale et les résultats des selles ne sont pas encore disponibles. Aucun agent bactérien n'est établi.</p>
<p>La première décision consiste à chercher une <button class="w" data-k="a04-pa-gravite">déshydratation ou une complication (critères qui changent le lieu de soins)</button> et à obtenir des selles pour analyse : le sang est une indication de test dans la directive suisse. L'exposition à la volaille oriente l'enquête, mais ne suffit pas à conclure à <i>Campylobacter</i>. Une diarrhée sanglante fait aussi envisager un <button class="w" data-k="a04-pa-stec">E. coli producteur de shiga-toxine (risque de syndrome hémolytique urémique)</button> et d'autres causes ; les agents n'appellent pas la même conduite.</p>
<div class="key"><b>Question du cours.</b> Comment passer de « diarrhée aiguë avec sang » à une décision clinique qui respecte la gravité, le prélèvement et l'agent réellement démontré ? <button class="w" data-k="a04-pa-detail">Lire les données et les inconnues du cas (vignette fictive)</button>.</div>
<div class="src">Sources qui motivent cette question : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validation 19.06.2026, « Diagnostic » et « Complications et hospitalisation »</a> ; <a href="https://www.bag.admin.ch/fr/campylobacteriose-fr" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Campylobactériose », transmission, page lue le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/escherichia-coli-enterohemorragique-ehec-ou-vtecstec" target="_blank" rel="noopener" data-reference-source="1">OFSP, « EHEC/STEC », tableau clinique, page lue le 08.10.2026</a>.</div></section>

<section class="ilot" id="a04-1"><h2><span class="n">1</span>Définir le syndrome avant de chercher la bactérie</h2>
<p>La SSI définit la <button class="w" data-k="a04-pa-diarrhee">diarrhée aiguë (≥ 3 selles molles ou aqueuses en 24 heures, pendant moins de 14 jours)</button>. La <button class="w" data-k="a04-pa-dysenterie">dysenterie (selles sanglantes et glaireuses, avec ou sans fièvre ou ténesme)</button> désigne une présentation, pas un germe. Fièvre, douleurs, vomissements, mucus ou sang en modifient l'évaluation, mais aucun de ces signes ne suffit seul à identifier l'étiologie.</p>
<p>Ce cours suit plusieurs infections intestinales bactériennes de l'adulte : des E. coli diarrhéogènes de mécanismes différents, l'entérite à <i>Campylobacter</i>, l'entérite à <i>Yersinia enterocolitica</i> et l'infection à <i>Clostridioides difficile</i>. Il faut aussi reconnaître des <button class="w" data-k="a04-pa-differentiels">causes voisines (autres agents et causes non infectieuses)</button> : une diarrhée aiguë n'est pas automatiquement bactérienne, et une positivité moléculaire doit être confrontée au tableau.</p>
<div class="trap"><span class="k">Piège</span> « Après un repas de volaille » et « selles sanglantes » ne prouvent ni <i>Campylobacter</i> ni STEC. Le cas fictif reste sans agent démontré à ce stade.</div>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validation 19.06.2026, « Définition » et « Diagnostic »</a>.</div></section>

<section class="ilot" id="a04-2"><h2><span class="n">2</span>Fréquence déclarée en Suisse et au Liechtenstein</h2>
<p>Pour <b>2025</b>, le rapport conjoint OSAV/OFSP compte, en Suisse <b>et au Liechtenstein</b>, <button class="w" data-k="a04-pa-epidemio">8 654 campylobactérioses confirmées par laboratoire déclarées</button> et <b>1 433 infections à STEC déclarées</b>. Le rapport porte la date « juillet 2026 » en page de titre. Ces décomptes dépendent des personnes testées et des notifications ; ils ne donnent pas le nombre de toutes les diarrhées bactériennes. Le rapport relève lui-même que la progression apparente des STEC peut être influencée par l'usage croissant des PCR multiplex.</p>
<p>Les voies d'exposition orientent l'interrogatoire : volaille insuffisamment cuite ou contamination croisée pour <i>Campylobacter</i> ; aliments ou eau contaminés, notamment produits animaux crus, mais aussi végétaux, pour STEC. Une <button class="w" data-k="a04-pa-cdi">infection à C. difficile (branche liée notamment aux antibiotiques et aux soins)</button> répond à un autre contexte. Aucune de ces expositions n'est une preuve individuelle.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/m58bIhzouDmc/rapport-suisse-sur-les-zoonoses-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">OSAV/OFSP, surveillance des zoonoses, données 2025, juillet 2026, résumé p. 3, §2 p. 4 (périmètre Suisse et Liechtenstein), §2.1 p. 4 et §2.4 p. 20</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, §8 p. 14 et §29 p. 55</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, C. difficile, validation 17.04.2026, « Facteurs de risque »</a>.</div></section>

<section class="ilot" id="a04-3"><h2><span class="n">3</span>Trois mécanismes, trois conséquences pratiques</h2>
<p><b>Contamination et infection entérique.</b> Pour <i>Campylobacter</i>, la source humaine est souvent alimentaire : une volaille contaminée peut transmettre la bactérie directement ou contaminer un aliment prêt à consommer pendant la préparation. La présentation peut associer diarrhée, douleur abdominale, fièvre et parfois sang ou mucus. Ce tableau fait enquêter, sans permettre de déduire l'agent à partir des symptômes.</p>
<p><b>Toxine et atteinte vasculaire.</b> Les E. coli producteurs de shiga-toxine peuvent causer une diarrhée devenant sanglante ; la toxine peut aussi participer au <button class="w" data-k="a04-pa-shu">syndrome hémolytique urémique (anémie hémolytique, thrombopénie, atteinte rénale)</button>. C'est pourquoi STEC est un embranchement de sécurité avant de banaliser une dysenterie : la SSI contre-indique les antibiotiques si STEC est établi, et l'OMS indique qu'ils peuvent accroître le risque de cette complication. Cette voie toxique ne décrit pas tous les E. coli diarrhéogènes.</p>
<p><b>Écosystème intestinal après soins.</b> Une antibiothérapie systémique peut perturber le microbiote et favoriser une infection à <i>C. difficile</i> ; la SSI associe le diagnostic à une clinique compatible, une preuve microbiologique et l'absence de meilleure explication. Une amplification génétique positive seule peut refléter une colonisation. Ainsi, la même plainte de diarrhée conduit à une démarche différente après antibiothérapie ou hospitalisation.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/fr/campylobacteriose-fr" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Campylobactériose », « Agent infectieux et transmission » et « Tableau clinique », consulté le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/escherichia-coli-enterohemorragique-ehec-ou-vtecstec" target="_blank" rel="noopener" data-reference-source="1">OFSP, « EHEC/STEC », « Agent infectieux » et « Tableau clinique », consulté le 08.10.2026</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/e-coli" target="_blank" rel="noopener" data-reference-source="1">OMS, fiche « E. coli », 07.02.2018, « Symptoms »</a> ; <a href="https://zenodo.org/records/18503894" target="_blank" rel="noopener" data-reference-source="1">SSI, recommandations C. difficile, version longue 4.0 du 27.01.2026, p. PDF 3–5, « Microbiological methods » et « Risk Factors »</a>.</div></section>

<section class="ilot" id="a04-4"><h2><span class="n">4</span>Classer par décision clinique, pas par ressemblance des selles</h2>
<div class="two"><div class="card"><b>Diarrhée communautaire ou alimentaire.</b><p><button class="w" data-k="a04-pa-campylobacter">Campylobacter (exposition et symptômes possibles)</button>, <button class="w" data-k="a04-pa-ecoli">E. coli diarrhéogènes (groupes à distinguer)</button> et <i>Yersinia enterocolitica</i> occupent des branches distinctes. La SSI rappelle que la plupart des épisodes de diarrhée, même bactériens, se résolvent spontanément ; le traitement ciblé dépend du germe, de l'évolution et d'une indication documentée.</p></div><div class="card"><b>Diarrhée après antibiotiques ou séjour de soins.</b><p>La piste <i>C. difficile</i> demande un <button class="w" data-k="a04-pa-test-cdi">test diagnostique interprété avec la clinique (colonisation possible)</button>. Le traitement du premier épisode, de la forme compliquée et des récidives n'est pas celui d'une gastro-entérite alimentaire banale.</p></div></div>
<p>Une diarrhée sanglante impose en parallèle d'envisager STEC et des agents hors du champ du cours, notamment <i>Shigella</i>. Les signes ne tranchent pas entre ces voies. Le contexte de voyage déplace encore le différentiel vers les E. coli entérotoxigènes et d'autres bactéries ou parasites ; la directive suisse dédiée le traite séparément. La nomenclature détaillée reste un outil de classement après identification.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Définition », « Diagnostic » et tableau de « Traitement empirique et ciblé »</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validation 19.06.2026, « Pathogènes »</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, C. difficile, « Approche diagnostique » et « Traitement »</a>.</div></section>

<section class="ilot" id="a04-5"><h2><span class="n">5</span>L'anamnèse prépare le bon test et mesure le risque</h2>
<p>Reconstituer le début et la durée, le <button class="w" data-k="a04-pa-selles">nombre et l'aspect des selles (eau, sang, mucus)</button>, la fièvre, les douleurs, les vomissements, la capacité à boire et les urines. Demander si d'autres personnes ayant partagé un repas sont malades ; rechercher aliments crus ou insuffisamment cuits, eau, animaux, voyage et dates d'exposition. Une association temporelle signale une piste, pas une causalité démontrée.</p>
<p>Rechercher les <button class="w" data-k="a04-pa-antibiotiques">antibiotiques ou une hospitalisation récents (raison de considérer C. difficile)</button>, l'immunosuppression, les comorbidités, l'âge et les médicaments qui aggravent les conséquences d'une perte d'eau. Ce sont les éléments qui rendent une analyse de selles ou un bilan sanguin utiles et qui peuvent faire changer le lieu de soins. Dans le cas fictif, seuls l'absence de voyage et d'antibiotique récent sont rapportés ; ni une immunité préservée, ni l'absence de comorbidité, ni une diurèse conservée ne sont présumées.</p>
<div class="key"><b>Question décisive.</b> Le prélèvement modifiera-t-il la conduite ? La SSI recommande une analyse microbiologique pour la diarrhée sanglante du cas, alors qu'elle évite les tests systématiques sans conséquence thérapeutique.</div>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Diagnostic », « Complications et hospitalisation »</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, C. difficile, « Facteurs de risque »</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, diarrhée du voyageur, « Pathogènes et durée d'incubation » et « Diagnostic »</a>.</div></section>

<section class="ilot" id="a04-6"><h2><span class="n">6</span>L'examen clinique décide de l'urgence avant le nom du germe</h2>
<p>Mesurer les constantes et évaluer la conscience, la perfusion, l'hydratation et la <button class="w" data-k="a04-pa-tolerance">capacité réelle à garder les liquides (voie orale possible ou non)</button>. Examiner l'abdomen pour la douleur et sa sensibilité, la distension ou des signes de complication. Documenter l'évolution des urines et la possibilité d'un suivi rapproché. Ce sont des observations à obtenir : la vignette n'apporte ni constantes normales ni résultat biologique rassurant.</p>
<p>Des vomissements empêchant l'hydratation, un <button class="w" data-k="a04-pa-choc">choc ou une déshydratation majeure (indication hospitalière)</button> changent sans attendre le lieu de soins selon la SSI. Devant diarrhée sanglante, la surveillance de l'état général et de la fonction rénale garde en vue le syndrome hémolytique urémique ; après antibiotiques, une douleur/distension avec iléus ou choc fait envisager une forme compliquée de <i>C. difficile</i>. Aucun seuil isolé de selles ne remplace cette appréciation.</p>
<div class="alert"><b>Alerte clinique.</b> Si la personne ne peut garder les liquides, paraît en état de choc ou présente une déshydratation majeure, organiser une évaluation hospitalière. Une suspicion de complication prime sur l'étiquetage bactérien.</div>
