<template data-pop="pareto-a04-pa" data-title="Pareto — quatre décisions cliniques"><p class="ratio" data-cover="a04-7,a04-8,a04-9,a04-13"></p><ul><li>Caractériser le syndrome et la gravité avant de nommer un agent.</li><li>Tester si le résultat change le traitement ou les mesures de santé publique.</li><li>Devant une dysenterie, considérer STEC avant une antibiothérapie.</li><li>Devant <em>C. difficile</em>, associer symptômes, toxines/algorithme et absence d’autre cause.</li></ul><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gastro-entérite infectieuse, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Infection à C. difficile, 2026</a>. Consultées le 8 octobre 2026.</div></template>
<template data-pop="a04-pa-detail" data-title="Vignette fictive — données et inconnues"><div class="lab">Cas pédagogique, phase initiale</div><p>La personne a 35 ans. Trois jours de selles liquides avec sang visible et crampes ont commencé après un repas comprenant de la volaille ; elle ne rapporte ni voyage ni antibiotique récent. La séquence temporelle suggère une question d'exposition, sans identifier la cause. Ne sont pas renseignés : fréquence précise des selles, constantes, hydratation, capacité à boire, diurèse, examen abdominal, fonction rénale et analyses de selles. Aucun agent, aucune évolution favorable ni décision de traitement ne sont présumés.</p><p><b>Conséquence.</b> L'indication de tester est soutenue par le sang. La gravité doit être mesurée et STEC reste dans le différentiel avant une décision antibiotique. Les autres onglets doivent reprendre exactement cette phase initiale.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19.06.2026, « Diagnostic », « Traitement empirique et ciblé » et « Complications et hospitalisation »</a>.</div></template>

<template data-pop="a04-pa-diarrhee" data-title="Diarrhée aiguë — définition et portée"><div class="lab">Définition clinique</div><p>La SSI parle de diarrhée aiguë devant au moins trois selles molles ou aqueuses en 24 heures, pendant moins de 14 jours. Une fréquence supérieure à l'habitude compte également dans son algorithme. La durée persistante commence à 14 jours selon l'algorithme et la directive, et appelle un différentiel élargi.</p><p>Cette définition décrit un syndrome, non une infection bactérienne prouvée. Si aucun test ne changerait le traitement, la SSI déconseille le prélèvement systématique dans une forme simple ; dans la vignette, le sang constitue au contraire un motif de diagnostic microbiologique.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Définition », « Diagnostic » et figure de l'algorithme</a>.</div></template>

<template data-pop="a04-pa-dysenterie" data-title="Dysenterie — un syndrome, plusieurs agents"><div class="lab">Valeur du signe</div><p>La SSI définit la dysenterie comme une gastro-entérite aiguë avec selles glaireuses et sanglantes, avec ou sans fièvre et/ou ténesme. Ce phénotype justifie une analyse de selles et fait considérer une maladie inflammatoire ou invasive, mais ne reconnaît aucun agent à lui seul.</p><p><b>Piège thérapeutique.</b> La même directive propose de l'azithromycine empirique pour une dysenterie, tandis que son tableau ciblé marque les antibiotiques « contre-indiqués » pour EHEC/STEC. La stratégie avant résultat doit donc documenter la suspicion de STEC et la gravité ; elle n'est pas une prescription automatique pour tout sang visible.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Définition », « Diagnostic » et « Traitement empirique et ciblé »</a> ; <a href="https://ssi.guidelines.ch/api/reader/get/glImage/25205/l/Table2.jpg" target="_blank" rel="noopener" data-reference-source="1">SSI, tableau des traitements spécifiques, ligne EHEC/STEC</a>.</div></template>

<template data-pop="a04-pa-gravite" data-title="Gravité — décider du lieu de soins"><div class="lab">Triage clinique</div><p>La première question n'est pas le nom de la bactérie, mais la capacité à conserver les liquides et l'existence d'un choc ou d'une déshydratation majeure. La SSI indique une hospitalisation si les vomissements empêchent de retenir les liquides, ou en présence de choc ou de déshydratation majeure. Âge avancé, comorbidités, immunosuppression, fièvre, sang et douleur abdominale pèsent aussi dans la décision.</p><p>Chez la personne de la vignette, les constantes et l'hydratation sont inconnues : ni stabilité hémodynamique ni prise en charge ambulatoire ne peuvent être affirmées.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Complications et hospitalisation »</a>.</div></template>

<template data-pop="a04-pa-stec" data-title="STEC — branche de sécurité devant le sang"><div class="lab">Agent et conduite conditionnelle</div><p>STEC signifie E. coli producteur de shiga-toxine ; l'OFSP emploie aussi EHEC ou VTEC. Ces bactéries peuvent provoquer douleurs abdominales et diarrhée devenant sanglante, puis dans une minorité de cas un syndrome hémolytique urémique. Les aliments ou l'eau contaminés et le contact animal figurent parmi les expositions possibles ; aucune exposition isolée ne confirme l'infection.</p><p>La SSI écrit dans son tableau que les antibiotiques sont contre-indiqués en cas d'EHEC/STEC. L'OMS précise qu'ils ne font pas partie du traitement et peuvent possiblement augmenter le risque de SHU. La tension avec la recommandation SSI d'azithromycine empirique pour dysenterie doit être arbitrée sur le cas, les prélèvements et la gravité. Une recherche de gènes <i>stx1/stx2</i> ou de toxines figure dans la définition de laboratoire de l'OFSP.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide 2026, §29 p. 55–56</a> ; <a href="https://ssi.guidelines.ch/api/reader/get/glImage/25205/l/Table2.jpg" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, tableau, EHEC/STEC</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/e-coli" target="_blank" rel="noopener" data-reference-source="1">OMS, « E. coli », 07.02.2018, « Symptoms »</a>.</div></template>

<template data-pop="a04-pa-shu" data-title="Syndrome hémolytique urémique — ce qu'il faut vérifier"><div class="lab">Complication possible de STEC</div><p>L'OFSP définit cliniquement le SHU par une insuffisance rénale aiguë associée à une anémie hémolytique microangiopathique ou à une thrombopénie. La fiche OMS décrit également la triade atteinte rénale, hémolyse et baisse des plaquettes. Cette complication demeure minoritaire, mais peut menacer la vie ; les enfants jeunes et les personnes âgées sont particulièrement exposés aux formes graves.</p><p>Dans une diarrhée sanglante, suivre l'état général et vérifier la diurèse, la créatinine, l'hémoglobine et les plaquettes selon l'évaluation clinique. Aucune de ces valeurs n'est fournie pour la vignette ; ne pas conclure à l'absence de SHU sur l'aspect seul des selles.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide 2026, §29 p. 56, définition clinique du SHU</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/e-coli" target="_blank" rel="noopener" data-reference-source="1">OMS, « E. coli », 07.02.2018, « Symptoms »</a>.</div></template>

<template data-pop="a04-pa-epidemio" data-title="Fréquence déclarée en Suisse et au Liechtenstein"><div class="lab">Données de 2025</div><p>Le rapport conjoint OSAV/OFSP daté juillet 2026 compte, pour 2025 en Suisse <b>et au Liechtenstein</b>, <b>8 654 campylobactérioses confirmées par laboratoire et déclarées</b> et <b>1 433 infections à STEC déclarées</b>. Le premier nombre concerne les cas confirmés identifiés par la surveillance ; le second reflète lui aussi les notifications, non toutes les infections survenues. Le rapport signale que l'usage croissant des PCR multiplex peut contribuer à la hausse apparente des STEC.</p><p>Ces nombres ne quantifient ni l'ensemble des diarrhées ni le risque individuel de la personne de la vignette. Le repas de volaille n'est pas une preuve microbiologique.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/m58bIhzouDmc/rapport-suisse-sur-les-zoonoses-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">OSAV/OFSP, surveillance des zoonoses, données 2025, juillet 2026, §2 p. 4 (périmètre Suisse et Liechtenstein), §2.1 p. 4 et §2.4 p. 20</a>.</div></template>

<template data-pop="a04-pa-cdi" data-title="C. difficile — une branche diagnostique distincte"><div class="lab">Contexte et limite</div><p>La SSI 2026 place l'antibiothérapie systémique, un séjour récent en établissement de soins, l'âge avancé et des comorbidités parmi les facteurs associés à l'infection à <i>C. difficile</i>. Son consensus suisse décrit une perturbation du microbiote après certaines expositions aux antibiotiques. Le diagnostic ne résulte pas du seul facteur de risque : il exige un tableau clinique compatible, une preuve microbiologique interprétée et l'absence d'autre explication.</p><p>L'absence d'antibiothérapie récente rapportée dans la vignette rend ce contexte moins évident sans exclure à elle seule toute infection. Une diarrhée après soins appellerait une enquête distincte et, si elle était confirmée, un traitement propre à cet agent et à la gravité.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17.04.2026, « Facteurs de risque » et « Approche diagnostique »</a> ; <a href="https://zenodo.org/records/18503894" target="_blank" rel="noopener" data-reference-source="1">SSI, consensus CDI 2026, version longue du 27.01.2026, « Risk Factors », p. PDF 4–5</a>.</div></template>

<template data-pop="a04-pa-test-cdi" data-title="Test C. difficile — distinguer infection et colonisation"><div class="lab">Interprétation conditionnelle</div><p>La SSI recommande de tester dans un tableau compatible : typiquement au moins trois selles molles Bristol 6–7 par 24 heures ; un iléus ou une colite pseudomembraneuse documentée peut modifier la présentation. L'approche de laboratoire utilise un algorithme, par exemple dépistage de l'antigène GDH puis recherche des toxines A et B. Les tests d'amplification des acides nucléiques peuvent intervenir dans l'algorithme, mais leur positivité isolée peut identifier une colonisation plutôt qu'une infection active.</p><p>Ne pas attribuer une diarrhée à <i>C. difficile</i> sur une PCR seule, surtout si une autre cause explique les symptômes. Chez la personne de la vignette, aucun test CDI n'a été effectué ou justifié par le seul repas de volaille.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI CDI 2026, « Définitions » et « Approche diagnostique »</a> ; <a href="https://zenodo.org/records/18503894" target="_blank" rel="noopener" data-reference-source="1">SSI, consensus long v4.0, 27.01.2026, « Microbiological methods », p. PDF 3–4</a>.</div></template>

<template data-pop="a04-pa-campylobacter" data-title="Campylobacter — exposition, clinique et limite"><div class="lab">Hypothèse, pas diagnostic par le repas</div><p>L'OFSP décrit la volaille insuffisamment cuite et la contamination croisée pendant la préparation comme voies fréquentes de transmission. Les symptômes possibles comprennent diarrhée, douleur abdominale, fièvre, nausée et parfois sang ou mucus. Le guide OFSP 2026 définit la confirmation de campylobactériose par culture ou détection d'acides nucléiques de <i>Campylobacter</i> pathogène dans un échantillon clinique.</p><p>La vignette partage une exposition et des symptômes compatibles, mais cela ne prouve pas cette étiologie. La SSI indique que nombre de gastro-entérites bactériennes sont spontanément résolutives : une détection doit encore être confrontée à l'évolution et à une indication de traitement.</p><div class="src"><a href="https://www.bag.admin.ch/fr/campylobacteriose-fr" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Campylobactériose », « Agent infectieux et transmission » et « Tableau clinique », consulté le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide 2026, §8 p. 14–15</a> ; <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Diagnostic » et « Traitement empirique et ciblé »</a>.</div></template>

<template data-pop="a04-pa-ecoli" data-title="E. coli diarrhéogènes — ne pas les confondre"><div class="lab">Groupes et conséquence pratique</div><p>La SSI répertorie parmi les causes bactériennes les E. coli entéropathogènes, entéroagrégatifs, entérotoxinogènes et entéroinvasifs, en particulier dans le contexte de voyage ; son tableau de traitement distingue ETEC/EPEC/EIEC de la ligne EHEC/STEC. Ce dernier groupe produit des shiga-toxines selon l'OFSP, et possède une conduite de sécurité propre.</p><p>Un simple résultat « E. coli » ou une diarrhée après alimentation ne suffit donc pas : il faut connaître le pathotype et la pertinence clinique du test. L'interdit antibiotique suisse lu pour STEC ne doit pas être projeté sur toutes les souches, et l'inverse serait tout aussi dangereux.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Définition » et tableau de « Traitement empirique et ciblé »</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, diarrhée du voyageur, validée le 19.06.2026, « Pathogènes »</a> ; <a href="https://www.bag.admin.ch/fr/escherichia-coli-enterohemorragique-ehec-ou-vtecstec" target="_blank" rel="noopener" data-reference-source="1">OFSP, « EHEC/STEC », « Agent infectieux », consulté le 08.10.2026</a>.</div></template>

<template data-pop="a04-pa-differentiels" data-title="Différentiels — garder l'enquête ouverte"><div class="lab">Même syndrome, étiologies différentes</div><p>La SSI cite aussi les virus entériques, *Salmonella*, *Shigella* et des parasites parmi les causes de gastro-entérite. Une diarrhée prolongée après voyage appelle davantage la recherche de protozoaires. Le sang et les douleurs abdominales doivent aussi conduire à reconsidérer le diagnostic si l'évolution ou les tests ne soutiennent pas l'infection attendue ; une positivité de panel peut être difficile à interpréter sans correspondance clinique.</p><p>L'objectif n'est pas de multiplier les analyses sans indication : la SSI demande que le résultat puisse modifier la conduite. Dans la vignette, le sang donne cette indication, mais ne préjuge pas du résultat.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Définition » et « Diagnostic »</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, diarrhée du voyageur 2026, « Diagnostic de la diarrhée au retour de voyage »</a>.</div></template>

<template data-pop="a04-pa-selles" data-title="Selles — les décrire sans leur attribuer un germe"><div class="lab">Anamnèse utile</div><p>Noter le nombre de selles en 24 heures, leur consistance, l'apparition et la quantité apparente de sang ou de mucus, ainsi que la durée des symptômes. La SSI utilise la fréquence et la durée pour définir la diarrhée aiguë ; elle classe la présence de sang parmi les indications d'examen microbiologique. Une fièvre persistante, des douleurs importantes ou une évolution prolongée changent également la stratégie.</p><p>Dans le cas, on sait seulement que les selles sont liquides avec sang visible depuis trois jours ; leur fréquence précise n'a pas été fournie. Ne pas inventer une perte hydrique ni un résultat de culture à partir de leur apparence.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Définition » et « Diagnostic »</a>.</div></template>

<template data-pop="a04-pa-antibiotiques" data-title="Antibiotiques récents — pourquoi la question compte"><div class="lab">Contexte de C. difficile</div><p>La SSI associe une antibiothérapie systémique et une hospitalisation récente à la recherche de <i>C. difficile</i> devant une diarrhée compatible. Son consensus long explique qu'une perturbation du microbiote est un mécanisme de risque ; il cite notamment clindamycine, fluoroquinolones, certaines céphalosporines et carbapénèmes parmi les classes plus associées à cette infection. Une prescription antérieure n'établit toutefois ni la présence de toxines ni la causalité.</p><p>Demander la molécule, la durée et la chronologie, puis utiliser l'algorithme diagnostique si la clinique le justifie. L'absence d'antibiotique récent rapportée dans la vignette ne constitue pas un test négatif.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Diagnostic »</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI CDI 2026, « Facteurs de risque »</a> ; <a href="https://zenodo.org/records/18503894" target="_blank" rel="noopener" data-reference-source="1">SSI, consensus CDI long v4.0 du 27.01.2026, « Risk Factors », p. PDF 4–5</a>.</div></template>

<template data-pop="a04-pa-tolerance" data-title="Tolérance des liquides — une décision de voie"><div class="lab">Mesurer, ne pas supposer</div><p>La SSI privilégie l'hydratation par voie orale pour une gastro-entérite non compliquée. Elle recommande une hospitalisation si les vomissements empêchent de retenir les liquides ; choc ou déshydratation majeure imposent également une prise en charge hospitalière. L'évaluation doit donc établir si la personne peut boire et garder ce qu'elle boit, et rechercher les conséquences des pertes.</p><p>Aucune capacité orale n'est donnée dans la vignette. La mention « adulte jeune » ne suffit pas à conclure que l'hydratation orale est possible ni que le risque est faible.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Traitement de soutien » et « Complications et hospitalisation »</a>.</div></template>

<template data-pop="a04-pa-choc" data-title="Choc et déshydratation majeure — seuil d'action"><div class="lab">Alerte clinique</div><p>La directive suisse classe le choc et la déshydratation majeure parmi les indications d'hospitalisation d'une gastro-entérite ; l'incapacité à retenir les liquides par vomissements en est une autre. Une diarrhée après antibiothérapie ou soins avec hypotension, iléus ou mégacôlon relève aussi de la branche « infection à C. difficile compliquée » si cette étiologie est démontrée.</p><p>Il faut relever constantes, perfusion, état de conscience, hydratation, diurèse et abdomen plutôt que déduire la stabilité du seul nombre de selles. Le cas ne fournit encore aucune de ces mesures. L'urgence prime sur le choix d'un pathogène présumé.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2026, « Complications et hospitalisation »</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI CDI 2026, « Approche diagnostique », critères de forme compliquée</a>.</div></template>
