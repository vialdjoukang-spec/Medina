<template data-pop="a04-e-detail" data-title="Selles : ce qu’un résultat peut et ne peut pas démontrer"><div class="lab">Choix du test</div><p>La SSI réserve l’examen des selles aux situations où il peut orienter la conduite ; une PCR multiplex est rapide mais ne fournit pas la sensibilité aux antibiotiques. En cas de suspicion de <em>C. difficile</em>, l’algorithme GDH puis toxines A/B aide à distinguer maladie et colonisation qu’une amplification seule peut confondre.</p><div class="lab">Branche STEC</div><p>Le guide OFSP retient pour EHEC/STEC l’isolement, les gènes <em>stx1/stx2</em> ou les shigatoxines. Une étiquette « <em>E. coli</em> » sans caractérisation ne précise pas cette branche.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Gastro-entérite infectieuse, « Diagnostic », 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Infection à C. difficile, « Examens microbiologiques », 2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide 2026, pp. 55–56</a>. Consultés le 8 octobre 2026.</div></template>
<template data-pop="pareto-a04-e" data-title="Pareto — examens complémentaires"><p class="ratio" data-cover="a04-e-0,a04-e-1,a04-e-2,a04-e-4"></p><ul><li>Indiquer les selles si leur résultat change une décision.</li><li>Identifier STEC par shigatoxines ou gènes correspondants.</li><li>Interpréter la PCR de <em>C. difficile</em> avec les symptômes et les toxines.</li><li>Réévaluer gravité et diagnostics alternatifs si les tests ne concordent pas avec le tableau.</li></ul><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, gastro-entérite, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, CDI, 2026</a>.</div></template>
<template data-pop="pareto-a04-s" data-title="Pareto — sciences fondamentales"><p class="ratio" data-cover="a04-s-3,a04-s-4,a04-s-5"></p><ul><li>Les pertes d’eau et de sels expliquent la priorité donnée à l’hydratation.</li><li>Les mécanismes de ces agents sont différents ; un résultat microbiologique précis importe.</li><li>Le syndrome hémolytique et urémique est une complication possible de STEC, sans être prédit par la seule diarrhée sanglante.</li></ul><div class="src"><a href="https://cdn.who.int/media/docs/default-source/immunization/final-etec-ppc-2021eng.pdf" target="_blank" rel="noopener" data-reference-source="1">OMS, ETEC, 2021</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/m58bIhzouDmc/rapport-suisse-sur-les-zoonoses-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–OSAV, zoonoses 2025</a>.</div></template>
<template data-pop="a04-e-panel" data-title="PCR multiplex des selles : portée du résultat"><div class="lab">Ce qu’elle apporte</div><p>La SSI indique qu’un test moléculaire multiplex peut rechercher rapidement plusieurs agents dans les selles. Devant la diarrhée sanglante de la vignette, l’examen microbiologique est indiqué ; il faut vérifier les cibles du panel demandé.</p><div class="lab">Ce qu’elle laisse ouvert</div><p>La même directive relève son coût, la difficulté de juger la pertinence clinique de certaines détections et l’absence de renseignement sur les résistances. Un résultat ne remplace ni l’examen du patient ni, lorsqu’elle est nécessaire, la culture et la caractérisation de l’isolat. Aucun résultat n’est disponible dans la vignette.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », « Diagnostic », validation du 19.06.2026</a>, consultée le 08.10.2026.</div></template>

<template data-pop="a04-e-cdi" data-title="Clostridioides difficile : l’amplification ne suffit pas"><div class="lab">Condition clinique</div><p>La SSI associe une symptomatologie compatible ou une colite pseudomembraneuse à une preuve microbiologique et à l’absence d’autre diagnostic. Le test d’amplification peut détecter une colonisation ; la recherche de GDH puis des toxines A/B et l’évaluation du patient précisent la signification du résultat.</p><div class="lab">Application à la vignette</div><p>Une antibiothérapie ou une hospitalisation récente inciterait à examiner cette hypothèse selon la SSI. Aucune antibiothérapie récente n’est rapportée dans la vignette ; un séjour de soins reste à préciser, et aucun résultat de test n’a été fourni. Le PDF SSI anglais du 27.01.2026 écrit « &gt;3 » selles molles/24 h, tandis que la page française validée le 17.04.2026 indique « ≥3 » ; le cours évite d’utiliser cette discordance comme seuil décisionnel isolé.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », « Définitions » et « Approche diagnostique », validation du 17.04.2026</a> ; <a href="https://zenodo.org/records/18503894/files/SSI_2026_CDI.pdf?download=1" target="_blank" rel="noopener" data-reference-source="1">SSI, texte étendu, v. 4.0 du 27.01.2026, pp. 2–4</a>. Consultés le 08.10.2026.</div></template>

<template data-pop="a04-e-stec" data-title="STEC : identifier le facteur de virulence"><div class="lab">Trois preuves reconnues</div><p>Pour la définition de cas EHEC/STEC, l’OFSP retient l’isolement d’un <i>E. coli</i> producteur de shigatoxines, la détection des gènes <i>stx1/stx2</i> ou la détection de shigatoxines libres. La simple identification de l’espèce <i>E. coli</i> ne distingue pas ce pathotype.</p><div class="lab">Limite clinique</div><p>Ce sont des critères de laboratoire pour la surveillance. Ils ne déduisent pas d’un résultat positif l’existence d’un syndrome hémolytique et urémique, complication à évaluer sur les données cliniques et biologiques de la personne ; celles-ci ne sont pas connues dans la vignette.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, « Infection à E. coli entérohémorragique », pp. 55–56</a>, consulté le 08.10.2026.</div></template>

<template data-pop="a04-e-declaration" data-title="Déclaration : qui signale un résultat ?"><div class="lab">EHEC/STEC</div><p>Le Guide OFSP 2026 prévoit, après résultat positif, une déclaration médicale au médecin cantonal et une déclaration du laboratoire à l’OFSP, chacune dans les 24 heures. Ces tâches de surveillance ne définissent ni la sévérité ni le traitement du patient.</p><div class="lab">Campylobacter et CDI</div><p>Pour Campylobacter, la fiche prévoit une déclaration du laboratoire à l’OFSP dans les 24 heures et aucune déclaration individuelle du médecin pour le moment. Le guide ne présente pas de fiche individuelle pour <i>C. difficile</i> ; il cite cet agent dans les flambées hospitalières exceptionnelles, à signaler par l’hôpital si les critères sont remplis. Une détection isolée n’est pas une flambée.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, pp. 7, 14–15 et 55–56</a>, consulté le 08.10.2026.</div></template>
<template data-pop="a04-sc-territoires" data-title="Le territoire oriente sans identifier l'agent">
  <div class="lab">Repères anatomiques</div><p>L'intestin grêle participe à l'absorption d'eau et de sels même pendant une diarrhée. Une douleur de fosse iliaque droite est décrite dans la yersiniose, tandis que <i>C. difficile</i> peut donner une colite. Les shigatoxines de STEC peuvent atteindre les petits vaisseaux rénaux.</p>
  <div class="lab">Portée clinique</div><p>Ces localisations orientent l'examen et la recherche de complication. Elles ne démontrent ni l'agent causal ni le segment lésé chez une personne sans résultat microbiologique.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.who.int/en/news-room/fact-sheets/detail/diarrhoeal-disease" target="_blank" rel="noopener">OMS, « Diarrhoeal disease », 07.03.2024</a>, absorption ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/en/yersiniosis" target="_blank" rel="noopener">ECDC, yersiniose</a>, symptômes ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/en/clostridioides-difficile-infections" target="_blank" rel="noopener">ECDC, infection à <i>C. difficile</i></a>, spectre ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/en/escherichia-coli-ecoli/facts" target="_blank" rel="noopener">ECDC, STEC, actualisé le 22.08.2024</a>, pathogène. Consultées le 08.10.2026.</p>
</template>

<template data-pop="a04-sc-muqueuse" data-title="La barrière muqueuse peut être lésée par des voies différentes">
  <div class="lab">Deux perturbations</div><p>L'OMS décrit l'invasion et les dommages muqueux dans les formes invasives de campylobactériose. Dans une étude expérimentale de 2022, les toxines A et B de <i>C. difficile</i> altèrent des voies du cytosquelette dans une lignée cellulaire, ce qui éclaire la perte d'intégrité épithéliale.</p>
  <div class="lab">Limite du modèle</div><p>L'étude cellulaire n'établit ni la présence des toxines ni leur effet chez la personne du cours. Une diarrhée sanglante peut avoir plusieurs mécanismes et ne vaut pas preuve d'invasion par Campylobacter.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.who.int/fr/news-room/fact-sheets/detail/campylobacter" target="_blank" rel="noopener">OMS, « Campylobacter », 01.05.2020</a>, « La maladie » et « Traitement » ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9024770/" target="_blank" rel="noopener">Étude expérimentale TcdB/RAS, 2022</a>, §1–2 et méthodes, modèle HEp-2. Consultées le 08.10.2026.</p>
</template>

<template data-pop="a04-sc-flux" data-title="Diarrhée aqueuse : mesurer les pertes, pas deviner le pathotype">
  <div class="lab">Mécanisme utile</div><p>L'OMS distingue les souches ETEC selon les gènes d'entérotoxines thermostable et thermolabile. Elle décrit une diarrhée aqueuse parfois abondante, susceptible de produire une déshydratation et un déséquilibre électrolytique. Pendant une diarrhée, de l'eau et des sels sont perdus ; leur remplacement devient la question physiologique centrale.</p>
  <div class="lab">Limite</div><p>Une diarrhée aqueuse peut avoir une autre cause bactérienne ou non bactérienne. Ni son volume ni son aspect n'identifient à eux seuls ETEC. Le document OMS sur ETEC concerne surtout les pays à revenu faible ou intermédiaire et les voyageurs.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://cdn.who.int/media/docs/default-source/immunization/final-etec-ppc-2021eng.pdf" target="_blank" rel="noopener">OMS, ETEC, 2021</a>, §3.1, p. 4/PDF 12 ; <a data-reference-source="1" href="https://www.who.int/en/news-room/fact-sheets/detail/diarrhoeal-disease" target="_blank" rel="noopener">OMS, diarrhée, 07.03.2024</a>, « Dehydration ». Consultées le 08.10.2026.</p>
</template>

<template data-pop="a04-sc-surveillance" data-title="Déclarations OFSP : données 2025, publiées en 2026">
  <div class="lab">Mesure</div><p>Le rapport OFSP–OSAV recense en Suisse et au Liechtenstein 8 654 campylobactérioses confirmées en laboratoire en 2025. Il recense aussi 1 433 détections STEC confirmées cette année-là. Le document est paru en 2026 ; il ne mesure pas l'année 2026.</p>
  <div class="lab">Interprétation</div><p>Le rapport cite l'emploi croissant de la PCR et des panels multiplex comme explication possible d'une part de l'augmentation des déclarations. Il ne chiffre pas cette part. Les cas déclarés ne comptent pas toutes les infections et ne prouvent aucune exposition chez le patient du cours.</p>
  <p class="src"><a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/m58bIhzouDmc/rapport-suisse-sur-les-zoonoses-2025.pdf" target="_blank" rel="noopener">OFSP–OSAV, *Rapport suisse sur les zoonoses 2025*, juillet 2026</a>, §2.1.1, p. 4–5, et §2.4.1, p. 20–21. Consulté le 08.10.2026.</p>
</template>

<template data-pop="a04-sc-sequelles" data-title="Après Campylobacter : une complication reste rare et distincte">
  <div class="lab">Temporalité</div><p>L'OMS rapporte l'arthrite réactionnelle et le syndrome de Guillain–Barré comme complications post-infectieuses possibles de Campylobacter. Leur apparition peut suivre l'épisode intestinal plutôt que coïncider avec la diarrhée.</p>
  <div class="lab">Ce qui n'est pas démontré</div><p>La fiche OMS ne documente pas une fréquence individuelle utilisable pour un cas sans agent confirmé. Elle ne démontre pas non plus une colonisation bactérienne de l'articulation ou du nerf. Le détail d'une réaction auto-immune par mimétisme moléculaire exigerait une source expérimentale complète supplémentaire.</p>
  <p class="src"><a data-reference-source="1" href="https://www.who.int/fr/news-room/fact-sheets/detail/campylobacter" target="_blank" rel="noopener">OMS, « Campylobacter », 01.05.2020</a>, « La maladie », complications post-infectieuses. Consultée le 08.10.2026.</p>
</template>

<template data-pop="a04-sc-stx" data-title="stx1, stx2 : des gènes de virulence, pas une prédiction individuelle">
  <div class="lab">Caractérisation</div><p>L'ECDC définit STEC par la capacité liée aux gènes <i>stx</i> de produire des shigatoxines. Il distingue <i>stx1</i> et <i>stx2</i> et indique que certaines variantes <i>stx2</i> sont plus souvent associées aux formes graves. Le sérogroupe ne suffit pas à établir la pathogénicité.</p>
  <div class="lab">Lecture du test</div><p>La PCR de selles peut trouver un gène <i>stx</i> sans isoler la souche. Le résultat ne donne alors pas nécessairement le sous-type ni la source de contamination, et il ne prédit pas le SHU d'une personne. La clinique et la caractérisation du laboratoire complètent l'interprétation.</p>
  <p class="src"><a data-reference-source="1" href="https://www.ecdc.europa.eu/en/escherichia-coli-ecoli/facts" target="_blank" rel="noopener">ECDC, fiche STEC actualisée le 22.08.2024</a>, « The pathogen » et « Diagnostics ». Consultée le 08.10.2026.</p>
</template>

<template data-pop="a04-sc-naat" data-title="PCR C. difficile : pourquoi la positivité ne suffit pas">
  <div class="lab">Signal analytique</div><p>Un test d'amplification des acides nucléiques détecte une cible moléculaire de <i>C. difficile</i>. L'ECDC précise qu'un tel test utilisé seul ne distingue pas colonisation asymptomatique et infection active. Swissnoso a observé en 2022 plusieurs algorithmes de laboratoire, combinant notamment dépistage et test de toxine.</p>
  <div class="lab">Conséquence</div><p>Le résultat doit être rapproché de la diarrhée ou de la colite et de la méthode locale. Une PCR positive isolée ne démontre pas que les toxines expliquent les symptômes du patient.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.ecdc.europa.eu/en/publications-data/laboratory-procedures-diagnosis-and-typing-human-clostridium-difficile-infection" target="_blank" rel="noopener">ECDC, rapport technique du 19.10.2018</a>, « Executive Summary » ; <a data-reference-source="1" href="https://www.swissnoso.ch/files/swissnoso/Dokumente/5_Forschung_und_Entwicklung/3_Umsetzung_StAR/231103_BAG_Bericht_final_mitQuestionnaire.pdf" target="_blank" rel="noopener">Swissnoso, StAR-2, novembre 2023</a>, résultats 2022, p. 9/19. Consultés le 08.10.2026.</p>
</template>
