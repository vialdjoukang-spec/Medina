
<template data-pop="a16-e-prelevement" data-title="À quatre ans : obtenir un échantillon pertinent"><div class="lab">Prélèvement adapté à l’âge</div><p>Le guide suisse indique que les enfants de moins de cinq ans ne produisent habituellement pas d’expectorations utilisables. Il recommande une aspiration gastrique pour amplification moléculaire, microscopie et culture, avec PCR des selles en supplément. D’autres méthodes sont choisies selon le site et l’évaluation spécialisée. La vignette n’atteste aucun prélèvement déjà réalisé.</p><div class="lab">Pourquoi la qualité compte</div><p>Le manuel ECDC souligne l’effet du type de prélèvement, de son transport et de son traitement sur le rendement. Un échantillon pauvre en bacilles peut laisser une recherche négative alors que la maladie reste à discuter.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire suisse, <i>Tuberculose en Suisse</i>, V1.2024, chap. 6.2–6.3, pp. 31–33</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel de laboratoire, 2026, §5.3.1 et 10.2</a>. Passages consultés le 8 octobre 2026.</div></template>

<template data-pop="a16-e-detail" data-title="Microscopie, amplification, culture : preuves distinctes"><div class="lab">Microscopie</div><p>Les bacilles acido-résistants visibles donnent une présomption rapide, mais le frottis ne nomme pas seul le complexe <i>M. tuberculosis</i> ; les mycobactéries non tuberculeuses restent possibles. Un frottis négatif ne tranche pas une forme à faible charge bacillaire.</p><div class="lab">Amplification et culture</div><p>L’amplification cherche des séquences du complexe et, selon l’essai, des mutations de résistance ciblées ; elle n’atteste pas toujours des bacilles viables. La culture isole l’organisme, accroît le rendement et permet des tests phénotypiques de sensibilité, mais un résultat négatif définitif demande plusieurs semaines. Aucun résultat de ces méthodes n’est donné dans le cas.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, chap. 6.3.1–6.3.3, pp. 32–34</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel de laboratoire 2026, chap. 4–7</a>. Passages consultés le 8 octobre 2026.</div></template>

<template data-pop="a16-e-statuts" data-title="Un résultat absent n’est pas un résultat négatif"><table class="t"><thead><tr><th>Terme</th><th>Ce qu’il faut transmettre</th></tr></thead><tbody><tr><td>Non documenté</td><td>On ignore si l’examen a été demandé ou réalisé : situation de la vignette.</td></tr><tr><td>Non réalisé</td><td>L’examen n’a pas eu lieu ; il n’a produit aucun résultat.</td></tr><tr><td>En attente</td><td>Le prélèvement existe, mais sa réponse n’est pas encore disponible.</td></tr><tr><td>Non concluant</td><td>Une réponse exploitable n’a pas été obtenue ; préciser la raison technique ou clinique selon le compte rendu, sans inventer un négatif.</td></tr><tr><td>Négatif</td><td>La cible n’a pas été détectée dans le prélèvement examiné par la méthode indiquée. Cette limite est importante dans les formes peu bacillaires de l’enfant.</td></tr></tbody></table><p>La culture peut rester en incubation pendant plusieurs semaines. L’IGRA négatif n’exclut pas une tuberculose maladie. Ces distinctions relèvent de l’interprétation du dossier, pas d’un résultat déjà disponible pour l’enfant fictif.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, chap. 6.1–6.3, pp. 31–34</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC 2026, chap. 3–6 et §10.2</a>. Passages consultés le 8 octobre 2026.</div></template>

<template data-pop="a16-e-igra" data-title="IGRA et test cutané : exposition, pas preuve d’activité"><p>Le test cutané et l’IGRA mesurent une réponse immunitaire à des antigènes mycobactériens. Chez l’enfant contact, le guide suisse les inclut dans l’évaluation, mais un positif ne distingue pas infection tuberculeuse sans maladie et maladie active ; un négatif n’exclut pas la maladie. Ils ne remplacent donc pas l’examen, l’imagerie et la recherche directe dans des prélèvements appropriés. Aucun résultat immunologique n’est fourni ici.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, chap. 5.1.1 et 6.1, pp. 26–27 et 31</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC 2026, chap. 3, limites d’interprétation</a>. Passages consultés le 8 octobre 2026.</div></template>

<template data-pop="a16-e-site" data-title="Ganglion visible : vérifier sa nature et son site"><p>Chez l’enfant, le guide suisse décrit les adénopathies hilaires comme une image possible de tuberculose, tout en précisant qu’aucune image n’est spécifique. La radiographie ne démontre ni bacille dans le ganglion ni absence d’une autre localisation. L’examen clinique et la relecture de l’imagerie orientent la nécessité d’un prélèvement du site concerné et les autres causes à explorer.</p><p>Dans la nomenclature OFS 2024, A16.3 désigne une <i>tuberculose</i> des ganglions intrathoraciques sans mention de confirmation. Il ne suffit donc pas de lire « adénopathies hilaires » dans une radiographie pour attribuer ce diagnostic.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, chap. 3.4 et 6.1–6.2, pp. 15–16 et 31–32</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener" data-reference-source="1">OFS, CIM-10-GM française 2024, A16.3, p. 9</a>. Passages consultés le 8 octobre 2026.</div></template>

<template data-pop="a16-e-codage" data-title="A16 suppose une maladie retenue, sans preuve directe"><p>Dans la CIM-10-GM française 2024 publiée par l’OFS, A15 désigne une tuberculose des organes respiratoires confirmée bactériologiquement, par biologie moléculaire ou histologiquement ; A16 désigne la maladie respiratoire sans cette confirmation. A16.1 décrit spécialement une tuberculose pulmonaire dont les examens bactériologique, moléculaire et histologique n’ont <b>pas été effectués</b> ; A16.2 décrit l’absence de mention de confirmation. Ni l’un ni l’autre ne signifie « les trois tests sont négatifs ».</p><p>Le cas fictif reste une suspicion : les tests sont <b>non documentés</b>, la maladie et sa localisation ne sont pas encore retenues. Les adénopathies hilaires ne donnent pas automatiquement A16.3, ni l’exposition une primo-infection codable A16.7. Le millésime 2024 sert ici au périmètre historique du catalogue ; la version et les règles de codage applicables à un dossier réel sont à vérifier séparément.</p><div class="src"><a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la statistique, <i>CIM-10-GM 2024, index systématique, version française</i>, A15–A16, pp. 7–9</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A16" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, texte allemand original, A16.0–A16.9</a>. Passages consultés le 8 octobre 2026.</div></template>

<template data-pop="a16-e-declaration" data-title="Surveillance OFSP et diagnostic : règles séparées"><div class="lab">Déclaration</div><p>La fiche OFSP 2026 prévoit une déclaration médicale au médecin cantonal dans la semaine notamment lors du début d’au moins trois antituberculeux ou de la mise en évidence du complexe tuberculeux. Le laboratoire déclare à l’OFSP dans les 24 heures ses résultats positifs de culture, d’analyse moléculaire ou de microscopie. Une infection révélée seulement par TCT/IGRA ne se déclare pas comme tuberculose maladie selon cette fiche. Aucun résultat ni traitement déclencheur n’est rapporté pour la vignette.</p><div class="lab">Définition de cas</div><p>Pour la surveillance, l’OFSP classe notamment comme « cas confirmé » une personne qui a commencé un traitement avec au moins trois antituberculeux, même sans preuve de laboratoire. À l’inverse, une amplification positive isolée est un critère de laboratoire « probable » dans cette définition. Ces mots de surveillance ne décident pas du classement A15/A16 dans la nomenclature.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, <i>Guide de la déclaration obligatoire</i> 2026, fiche 58 « Tuberculose », pp. 116–117, critères de déclaration et définition de cas</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener" data-reference-source="1">OFS, CIM-10-GM française 2024, A15–A16</a>. Passages consultés le 8 octobre 2026.</div></template>

<template data-pop="pareto-a16-e" data-title="L’essentiel des examens A16"><p class="ratio" data-cover="a16-e-0,a16-e-1,a16-e-2,a16-e-4"></p><ul><li>Chez un contact de moins de cinq ans avec fièvre et image hilaire, l’évaluation clinique et radiologique est rapide ; ces éléments n’établissent pas encore la tuberculose.</li><li>À quatre ans, aspiration gastrique pour amplification, microscopie et culture, avec PCR des selles en complément selon le guide suisse.</li><li>Un test absent, en attente, non concluant ou négatif n’a pas la même signification ; l’IGRA ne confirme ni n’exclut seul la maladie active.</li><li>A16 ne devient pertinent que si une maladie respiratoire est retenue sans confirmation directe. La définition de cas OFSP sert à la surveillance et suit ses propres critères.</li></ul><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, chap. 5–6</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener" data-reference-source="1">OFS, CIM-10-GM 2024, A15–A16</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, déclaration 2026, fiche 58</a>. Passages consultés le 8 octobre 2026.</div></template>
<template data-pop="a16-s-detail" data-title="Trajet respiratoire possible, sans preuve individuelle">
  <div class="lab">Après inhalation</div><p>Les petites particules en suspension peuvent atteindre les alvéoles. Un macrophage peut phagocyter le bacille ; la réaction locale peut ensuite s'accompagner d'une atteinte des relais lymphatiques intrathoraciques. Ce mécanisme explique pourquoi des ganglions hilaires sont un motif possible chez l'enfant.</p>
  <div class="lab">Ce que montre l'image</div><p>Une radiographie situe des ganglions augmentés de volume. Elle ne montre ni l'espèce du microbe ni la présence de bacilles vivants. Le guide suisse précise qu'aucune présentation radiologique n'est spécifique de la tuberculose et qu'une image seule ne distingue pas maladie active, inactive ou guérie.</p>
  <div class="lab">Pour cette vignette</div><p>L'exposition domestique, la fièvre et les adénopathies rendent la question tuberculeuse importante. Aucune atteinte alvéolaire, propagation lymphatique ni présence bacillaire ne sont démontrées chez cet enfant.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§3.1–3.4, pp. 14–16 ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener noreferrer">OFS, CIM-10-GM 2024</a>, catégorie respiratoire sans confirmation, pp. 8–9/PDF 18–19. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a16-sc-anat" data-title="Une adénopathie hilaire a plusieurs causes">
  <div class="lab">Localisation</div><p>Les ganglions hilaires se trouvent à l'entrée du poumon, auprès des bronches et des vaisseaux. Leur augmentation de volume chez un enfant peut s'intégrer à une tuberculose respiratoire, notamment lors d'une primo-infection. La radiographie indique leur siège sans identifier la cause du gonflement.</p>
  <div class="lab">Interprétation</div><p>Le contact avec une personne contagieuse augmente la plausibilité de l'hypothèse tuberculeuse. D'autres infections ou une autre maladie peuvent expliquer la fièvre et l'image. Le site et les prélèvements sont choisis après examen du tableau complet, sans attribuer déjà l'image à des bacilles.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§3.3–3.4, pp. 15–16, et §§6.1–6.2, pp. 31–32 ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener noreferrer">OFS, CIM-10-GM française 2024</a>, catégories des ganglions intrathoraciques et de la primo-infection respiratoire, p. 9/PDF 19. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a16-sc-histo" data-title="Ce qu'apporte une biopsie, si elle existe">
  <div class="lab">Morphologie</div><p>Un granulome rassemble surtout des macrophages activés et des lymphocytes ; des cellules géantes peuvent s'y ajouter. Une nécrose centrale peut accompagner la tuberculose, mais d'autres infections, notamment fongiques, peuvent produire un aspect proche. L'absence de nécrose n'exclut pas non plus la tuberculose.</p>
  <div class="lab">Deux destinations du prélèvement</div><p>Si une biopsie est indiquée, le tissu destiné à l'anatomopathologie est examiné au microscope. Une portion séparée, non fixée au formol, peut être envoyée en microbiologie pour amplification et culture. L'observation d'un granulome se confronte à ces résultats et au contexte.</p>
  <div class="lab">État du cas</div><p>Aucune biopsie n'est rapportée. L'adénopathie hilaire visible sur l'image n'est donc ni un granulome démontré ni une histologie négative.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §6.2, pp. 31–32 ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9488688/fullTextXML" target="_blank" rel="noopener noreferrer">ERS, <i>Differential diagnosis of granulomatous lung disease</i>, 2017</a>, « Definition of granuloma », « Tuberculosis », « Fungal granuloma » ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel 2026</a>, §3.1.1, pp. 26–27. Textes intégraux lus le 08.10.2026.</p>
</template>
<template data-pop="a16-sc-physio" data-title="Le contact n'est pas encore la maladie">
  <div class="lab">Exposition</div><p>La personne source atteinte de tuberculose pulmonaire contagieuse peut émettre des particules infectieuses en respirant, en parlant ou en toussant. Le partage de l'air au domicile donne une occasion d'inhalation. Il ne prouve pas qu'une particule a établi une infection chez l'enfant.</p>
  <div class="lab">Après exposition</div><p>La réponse de l'hôte peut éliminer les bacilles, contenir une infection ou laisser apparaître une maladie. Un test immunologique peut documenter une réponse cellulaire, sans dire si les bacilles sont encore vivants. Une maladie respiratoire nécessite son propre faisceau de preuves et l'examen des autres causes.</p>
  <div class="lab">Transmission secondaire</div><p>La contagiosité de la personne source est connue dans la vignette. Celle de l'enfant ne l'est pas. Ses ganglions radiographiques, sa fièvre et son âge ne constituent pas une mesure de bacilles émis.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§3.1–3.3, pp. 14–15, et §4.1, p. 18 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, §3.1.1, pp. 26–27. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a16-sc-micro" data-title="Un résultat négatif décrit un échantillon">
  <div class="lab">Trois méthodes</div><p>Le frottis recherche des bacilles acido-alcoolo-résistants visibles, sans identifier leur espèce. L'amplification détecte des séquences du complexe tuberculeux si elles sont présentes au-dessus du seuil du test dans l'échantillon. La culture cherche une croissance viable et permet ensuite l'étude de sensibilité, mais elle demande du temps.</p>
  <div class="lab">Prélèvement chez le jeune enfant</div><p>Un enfant de moins de 5 ans produit rarement une expectoration spontanée exploitable. Le guide suisse décrit l'aspiration gastrique pour recueillir des sécrétions respiratoires avalées et une analyse moléculaire sur selles en complément. La qualité, le site et la quantité de matériel influencent chaque résultat.</p>
  <div class="lab">Quatre états distincts</div><p>Un examen peut être non rapporté, non effectué, négatif ou non concluant. Seul un résultat négatif sur un prélèvement défini dit que la cible n'a pas été détectée par la méthode utilisée. Même plusieurs résultats négatifs demandent une lecture avec la clinique et les autres diagnostics ; ils ne posent pas automatiquement le diagnostic de tuberculose non confirmée.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§6.1–6.3, pp. 31–35 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, §4.1, p. 36, §6.3.1, p. 64, et §§10.2–10.3, pp. 104–106 ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686249/master" target="_blank" rel="noopener noreferrer">OFS, CIM-10-GM 2024</a>, distinction des sous-catégories sans confirmation, pp. 8–9. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a16-sc-immuno" data-title="Réponse positive ou négative : aucune ne tranche seule">
  <div class="lab">Ce que mesure le test</div><p>Le test cutané mesure une réaction retardée après injection d'antigènes ; le test sanguin mesure une libération d'interféron gamma après stimulation. Ces réponses proviennent de cellules de l'hôte. Elles ne montrent pas directement des bacilles vivants dans un ganglion ou dans le poumon.</p>
  <div class="lab">Résultat positif</div><p>Une réactivité positive soutient une exposition immunologique selon le test utilisé, le délai et le contexte. Elle ne prouve pas que la fièvre prolongée ou l'image hilaire représentent une maladie active. Le test cutané est aussi influencé par certains antigènes partagés avec le vaccin BCG ou d'autres mycobactéries.</p>
  <div class="lab">Résultat négatif</div><p>Un résultat négatif n'écarte pas à lui seul une maladie. Le jeune âge, une réponse encore en développement après une exposition récente ou l'immunodépression peuvent réduire la détection. Aucun test cutané ni sanguin n'est renseigné pour cet enfant.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§4.1–4.3, pp. 18–21, et §6.1, p. 31 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, §§3.1.1–3.3, pp. 26–31. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="a16-sc-gene" data-title="Sans agent détecté, aucun profil de résistance">
  <div class="lab">Cibles connues</div><p>Des tests recherchent des mutations dans <i>rpoB</i> pour la rifampicine ou dans <i>katG</i> et le promoteur <i>inhA</i> pour l'isoniazide. Le test Xpert MTB/RIF Ultra peut parfois donner un signal « trace » pour le complexe tuberculeux sans résultat interprétable sur la rifampicine, faute de signal suffisant pour cette cible.</p>
  <div class="lab">Lecture d'un résultat</div><p>Une amplification négative pour le complexe n'est pas un résultat de sensibilité aux médicaments. Même si une mutation est recherchée, un panel limité laisse d'autres régions et médicaments non évalués. Les tests phénotypiques sur culture peuvent compléter l'interprétation lorsqu'un isolat est obtenu.</p>
  <div class="lab">Pour l'enfant</div><p>Aucun résultat moléculaire ou isolat n'est rapporté. La souche de la personne source, même si elle était connue, ne devient pas automatiquement un génotype démontré chez l'enfant.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Ligue pulmonaire suisse–OFSP, guide V1.2024</a>, §§6.3.2–6.3.3, pp. 33–35 ; <a data-reference-source="1" href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener noreferrer">ECDC, manuel diagnostique, mars 2026</a>, §6.3.1, p. 64, chap. 8, pp. 88–93, et §10.3, pp. 107–108. Passages lus le 08.10.2026.</p>
</template>
<template data-pop="pareto-a16-s" data-title="Sciences fondamentales : les distinctions essentielles">
  <p>Une exposition domestique à une source contagieuse augmente la plausibilité d'une infection, mais elle ne démontre pas une maladie chez l'enfant. Ses ganglions hilaires sont un site radiologique observé, sans identification du microbe. Aucun test direct, immunologique ou histologique n'est rapporté.</p>
  <p>Un futur résultat négatif décrit un prélèvement et une méthode. Un test immunologique positif décrirait une réponse de l'hôte, pas l'activité de la maladie. Sans agent ni résultat interprétable, la résistance est inconnue. La catégorie respiratoire sans confirmation ne devient pertinente qu'après évaluation clinique de la maladie et des autres causes.</p>
