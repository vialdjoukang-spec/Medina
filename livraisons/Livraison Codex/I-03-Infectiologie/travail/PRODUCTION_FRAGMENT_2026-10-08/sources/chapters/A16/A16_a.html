<section class="ilot" id="a16-0"><h2><span class="n">0</span>Un enfant exposé, fébrile, avec des ganglions hilaires</h2>
<p><b>Vignette fictive.</b> Un enfant de 4 ans a été en contact domestique avec une personne atteinte de tuberculose pulmonaire contagieuse. Il présente une fièvre prolongée et des adénopathies hilaires décrites à la radiographie. Ni constantes, ni état général, ni symptômes respiratoires ou neurologiques, ni résultats de prélèvements ou de tests immunologiques ne sont connus. Le traitement éventuel et la sensibilité de la souche de la personne source ne sont pas renseignés. <button class="w" data-k="a16-pa-detail">Ce que le dossier donne et ce qu'il laisse ouvert (cas fictif)</button>.</p>
<p>Ce tableau appelle une <button class="w" data-k="a16-pa-suspicion">évaluation rapide de la tuberculose chez un enfant contact (suspicion, non diagnostic acquis)</button>. La fièvre, l'exposition et l'image orientent, mais aucune n'est spécifique. Il faut rechercher la maladie active, ses autres sites possibles et des explications alternatives ; l'absence de résultats fournis ne signifie pas que les examens ont été négatifs ou impossibles.</p>
<div class="key"><b>Question du cours.</b> Dans quelles circonstances une tuberculose respiratoire peut-elle être retenue cliniquement sans confirmation, et quels efforts diagnostiques et de sécurité doivent précéder cette décision ?</div>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, <i>Tuberculose en Suisse</i>, V1.2024, ch. 3.3–3.4 pp. 15–16, ch. 5.1 pp. 26–27 et ch. 6.1 p. 31</a>.</div></section>

<section class="ilot" id="a16-1"><h2><span class="n">1</span>La maladie peut être retenue sans preuve directe, jamais par simple manque de résultats</h2>
<p>La tuberculose est une maladie due au complexe <i>Mycobacterium tuberculosis</i>. Après exposition, une <button class="w" data-k="a16-pa-infection">réponse immunitaire sans maladie (infection tuberculeuse à distinguer)</button> peut exister ; elle ne suffit pas à expliquer une fièvre et une image thoracique. La maladie est une atteinte clinique et/ou radiologique compatible, évaluée avec l'histoire d'exposition, l'examen et les prélèvements selon le site.</p>
<p>Le guide suisse indique qu'une <button class="w" data-k="a16-pa-decision">décision de traiter sur clinique et imagerie malgré l'absence de confirmation (situation exceptionnelle)</button> peut être appropriée, particulièrement chez l'enfant. Elle suppose un bilan sérieux et une justification documentée. Il faut distinguer trois moments : <b>suspicion en cours d'évaluation</b>, <b>maladie retenue sans preuve directe après évaluation</b> et <b>maladie confirmée par une méthode appropriée</b>. La vignette se situe au premier moment.</p>
<p>Le poumon, les voies aériennes, les ganglions intrathoraciques et la plèvre ont des présentations et des prélèvements différents. Le guide clinique appelle parfois la <button class="w" data-k="a16-pa-plevre">plèvre « extrapulmonaire » (langage clinique versus classement respiratoire)</button> ; cette nuance ne doit ni fusionner les sites ni supposer une contagiosité pulmonaire. Aucun ganglion de la vignette n'est encore démontré tuberculeux.</p>
<div class="trap"><span class="k">Piège</span> « Aucun résultat connu dans le scénario » ne veut dire ni « tests non réalisés », ni « tests négatifs », ni « tuberculose cliniquement établie ». Ces situations appellent des décisions différentes.</div>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.2–3.3 pp. 14–15 et ch. 6.1–6.2 pp. 31–32</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A16" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, rubriques de tuberculose respiratoire avec et sans confirmation, nomenclature</a>.</div></section>

<section class="ilot" id="a16-2"><h2><span class="n">2</span>Une maladie peu fréquente en Suisse, un risque élevé chez certains contacts</h2>
<p>Le guide suisse V1.2024 rapporte <button class="w" data-k="a16-pa-epidemio">365 cas de tuberculose signalés en 2022, soit 4,16 pour 100 000 habitants (toutes formes)</button>. La fiche OFSP 2026 donne un ordre de grandeur de 300 à 500 cas déclarés par an en Suisse. Ni l'un ni l'autre n'est le nombre de maladies respiratoires non confirmées ou de cas pédiatriques ; il serait erroné de déduire une fréquence du tableau de la vignette de ces données globales.</p>
<p>Le risque de maladie après infection est plus marqué chez les jeunes enfants, particulièrement pendant les deux années suivant une infection, si elle a eu lieu. Le guide suisse place les <button class="w" data-k="a16-pa-priorite">contacts de moins de 5 ans et les contacts symptomatiques (priorité d'examen)</button> parmi les personnes à évaluer sans délai. Le contact domestique de l'enfant donne une raison concrète d'agir vite ; il ne prouve pas que ses ganglions sont tuberculeux.</p>
<p>Le même guide relève qu'il existe des <button class="w" data-k="a16-pa-clinique-seule">cas traités sur arguments cliniques ou radiologiques sans preuve directe (proportion à interpréter)</button>. Cela montre que l'incertitude diagnostique est réelle, surtout en pédiatrie ; ce n'est pas une cible de diagnostic ni une raison de renoncer à rechercher le bacille.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 2.1 p. 9, ch. 3.2 p. 14, ch. 5.1 pp. 26–27, ch. 6.1 p. 31</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, fiche 58, p. 117</a>.</div></section>

<section class="ilot" id="a16-3"><h2><span class="n">3</span>Air partagé, infection, progression : le risque de l'enfant n'est pas sa contagiosité</h2>
<p>Une personne ayant une tuberculose pulmonaire infectieuse peut diffuser des <button class="w" data-k="a16-pa-aerosols">aérosols contenant des bacilles (transmission dans l'air partagé)</button>. La concentration dans l'air, la durée d'exposition, la toux et la charge bacillaire respiratoire modifient le risque. Dans la vignette, le contact domestique avec une personne contagieuse est donné, mais ni son profil de résistance ni les circonstances exactes d'exposition ne le sont.</p>
<p>Après inhalation, les bacilles peuvent être contrôlés, persister avec une réponse immunitaire ou progresser vers la maladie. Les <button class="w" data-k="a16-pa-progression">jeunes enfants (risque de progression, sans certitude diagnostique individuelle)</button> sont plus vulnérables, notamment aux atteintes disséminées et méningées. Une réponse TCT ou IGRA, si elle était connue, ne séparerait pas à elle seule infection sans maladie et maladie active.</p>
<p>La tuberculose chez le jeune enfant est souvent <button class="w" data-k="a16-pa-paucibacillaire">paucibacillaire (confirmation plus difficile, contagiosité habituellement moindre)</button>. Ce constat explique la place du jugement clinique après recherche de preuve ; il ne permet pas de décréter que l'enfant n'est pas malade ni qu'il est automatiquement non contagieux. L'infectiosité de la personne source ne se transfère pas à l'enfant par raisonnement.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.1–3.2 pp. 14–15, ch. 5.1 pp. 25–27, ch. 6.1–6.2 pp. 31–32 et ch. 7.5.2 p. 44</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/handbook-tuberculosis-lab-diagnostics-2026.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, manuel laboratoire 2026, ch. 3–5, complément sur les tests</a>.</div></section>

<section class="ilot" id="a16-4"><h2><span class="n">4</span>Fièvre et ganglions hilaires : une présentation possible, plusieurs diagnostics</h2>
<div class="two"><div class="card"><b>Dans le scénario pédiatrique.</b><p>Le guide suisse décrit chez l'enfant une <button class="w" data-k="a16-pa-fievre">fièvre prolongée ou un ralentissement de croissance (signes à caractériser)</button>, et des <button class="w" data-k="a16-pa-hilaire">adénopathies hilaires à l'imagerie (indice, non preuve de tuberculose)</button>. La croissance, la toux, l'essoufflement et la forme des ganglions restent à documenter chez cet enfant. Une adénopathie hilaire isolée sur image ne distingue pas à elle seule tuberculose, autre infection, inflammation ou autre processus.</p></div><div class="card"><b>Autres sites du périmètre.</b><p>Le poumon, les voies aériennes, les ganglions intrathoraciques et la plèvre demandent des parcours de prélèvement différents. Une <button class="w" data-k="a16-pa-plevre">pleurésie cliniquement extrapulmonaire (branche anatomique à séparer)</button> peut coexister avec une atteinte pulmonaire, mais n'est pas décrite dans la vignette. Les formes neurologiques ou disséminées appellent une autre évaluation et ne doivent pas être déduites du seul contact.</p></div></div>
<p>Le jeune âge peut rendre la microbiologie plus difficile ; il ne rend pas l'imagerie spécifique. La présentation doit guider le site des échantillons et la recherche de diagnostics alternatifs avant toute décision de retenir une tuberculose sans confirmation.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 3.3–3.4 pp. 15–16 et ch. 6.1–6.2 pp. 31–32</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A16" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, localisations respiratoires sans preuve, nomenclature</a>.</div></section>

<section class="ilot" id="a16-5"><h2><span class="n">5</span>Questionner l'enfant et la personne source sans combler les blancs</h2>
<p>Préciser la <button class="w" data-k="a16-pa-contact">durée, la proximité et les dates du contact domestique (exposition à caractériser)</button>. Demander, sans l'inventer, le site de maladie de la personne source, ses résultats de frottis/culture et la <button class="w" data-k="a16-pa-source">sensibilité de sa souche (information utile si la maladie de l'enfant est retenue)</button>. Ces éléments aident à apprécier l'exposition et à organiser l'enquête d'entourage avec le service cantonal.</p>
<p>Reconstituer <button class="w" data-k="a16-pa-symptomes">la fièvre, les symptômes respiratoires, l'appétit et la croissance (anamnèse pédiatrique)</button>. Demander signes neurologiques ou autres plaintes d'organe, antécédents de tuberculose, VIH ou autre immunosuppression, médicaments, vaccinations et traitements déjà reçus. Aucun de ces renseignements n'est fourni pour l'enfant de la vignette, en dehors de la fièvre et du contact.</p>
<p>La discussion avec la famille doit rester précise et respectueuse : les conditions de vie décrivent une exposition potentielle, pas une faute. Le guide suisse souligne la confidentialité lors de la recherche des contacts. La priorité est de savoir si l'enfant a une maladie active ; un traitement de simple infection tuberculeuse ne peut s'y substituer avant cette évaluation.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.2–3.3 pp. 14–15, ch. 5.1–5.2 pp. 25–29, ch. 6.1–6.2 pp. 31–32 et ch. 7.1–7.3 pp. 36–40</a>.</div></section>

<section class="ilot" id="a16-6"><h2><span class="n">6</span>Examiner la gravité et l'anatomie avant de conclure</h2>
<p>Mesurer les <button class="w" data-k="a16-pa-examen">constantes, l'état respiratoire, l'état général et la croissance (aucune normalité présumée)</button> ; rechercher signes thoraciques, ganglions accessibles et anomalies d'autres organes selon les symptômes. La fièvre doit être caractérisée, et l'imagerie relue avec sa date et ses détails. Des adénopathies hilaires peuvent être compatibles avec la tuberculose de l'enfant sans l'établir.</p>
<p>La <button class="w" data-k="a16-pa-imagerie">radiographie thoracique (orientation et diagnostics alternatifs)</button> ne distingue pas à elle seule maladie active, inactivité ou autre cause. L'examen de l'enfant et de la radiographie détermine les prélèvements pédiatriques adaptés. Chez un enfant symptomatique avec image anormale, il serait inapproprié de s'arrêter à un test cutané/IGRA ou de poser d'emblée une infection sans maladie.</p>
<div class="alert"><b>Point de sécurité.</b> L'enfant contact de moins de 5 ans avec fièvre prolongée et anomalie thoracique doit être évalué rapidement. Rechercher la gravité respiratoire, l'état neurologique et une dissémination selon la clinique, sans les présumer présents. Les précautions respiratoires et la recherche de la personne source s'organisent selon l'évaluation réelle. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 5.1.1 pp. 26–27 ; ch. 3.3 p. 15 ; ch. 7.5 pp. 42–44</a>.</div>
