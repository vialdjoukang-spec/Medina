<template data-pop="pareto-a16-pa" data-title="Pareto — Pathologie et prise en charge"><p class="ratio" data-cover="a16-7,a16-8,a16-9,a16-13"></p><ul><li>Contact, fièvre et image orientent le bilan ; ils ne suffisent pas à retenir une tuberculose active.</li><li>Organiser rapidement les prélèvements pédiatriques et discuter les autres causes. Aucun résultat négatif n’est encore connu.</li><li>Une décision clinique sans confirmation reste exceptionnelle et documentée ; les critères de surveillance OFSP ont un autre objectif.</li><li>Le traitement, la prévention et la recherche des contacts dépendent de la maladie retenue, de sa gravité et de la sensibilité.</li></ul><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide suisse V1.2024, ch. 5–7</a>.</div></template>
<template data-pop="a16-pa-detail" data-title="Vignette fictive — faits connus et données manquantes"><div class="lab">Ne pas transformer un récit initial en diagnostic</div><p>Connus : enfant de quatre ans, contact domestique avec une personne atteinte de tuberculose pulmonaire contagieuse, fièvre prolongée et adénopathies hilaires décrites à la radiographie. Non documentés : constantes, état général, croissance, symptômes respiratoires/neurologiques, caractéristiques de l'image, résultats de TCT/IGRA ou de prélèvements, résistance de la souche source et traitement éventuel.</p><p>Le guide suisse recommande une évaluation rapide des enfants contacts de moins de cinq ans et de tout contact symptomatique. Les données connues justifient cette priorité ; elles ne prouvent ni tuberculose des ganglions ni infection pulmonaire ni contagiosité de l'enfant.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire suisse, <i>Tuberculose en Suisse</i>, V1.2024, ch. 3.3–3.4 pp. 15–16, ch. 5.1.1 pp. 26–27, ch. 6.1–6.2 pp. 31–32</a>.</div></template>
<template data-pop="a16-pa-suspicion" data-title="Suspicion de tuberculose chez l'enfant contact"><div class="lab">Exposition et image orientent sans confirmer</div><p>Un contact rapproché avec une personne contagieuse, une fièvre prolongée et des adénopathies hilaires rendent la tuberculose plausible. Le guide suisse rappelle cependant qu'aucun symptôme ou résultat radiologique n'est pathognomonique. Une image compatible doit conduire à l'examen clinique, à des prélèvements adaptés et à l'évaluation des autres causes.</p><p>À ce stade, les résultats ne sont pas connus ; on ne sait pas s'ils seront positifs, négatifs ou si certains prélèvements seront impossibles. Une décision clinique de retenir une maladie sans preuve ne vient qu'après une évaluation documentée.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.3–3.4 pp. 15–16, ch. 5.1 pp. 26–27 et ch. 6.1 p. 31</a>.</div></template>
<template data-pop="a16-pa-infection" data-title="Infection tuberculeuse et maladie active"><div class="lab">Un test immunologique ne sépare pas les deux</div><p>Après exposition au complexe tuberculeux, une réponse immunitaire peut persister sans maladie clinique, radiologique ou microbiologique. Le guide suisse précise que les personnes avec cette seule infection immunologique ne sont ni malades ni contagieuses. Un TCT ou IGRA positif peut l'étayer, mais ne prouve pas que la fièvre ou les ganglions ont une origine tuberculeuse ; un résultat négatif n'exclut pas une maladie compatible.</p><p>Dans le cas fictif, aucun résultat immunologique n'est donné. Surtout, l'enfant est symptomatique avec image anormale : la maladie doit être évaluée avant de traiter uniquement une infection sans maladie.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 3.2 p. 14, ch. 4.1 p. 18, ch. 6.1 p. 31</a>.</div></template>
<template data-pop="a16-pa-decision" data-title="Retenir une maladie sans preuve directe"><div class="lab">Exception clinique documentée</div><p>Le guide suisse écrit qu'il peut, dans des situations exceptionnelles et notamment chez l'enfant, être approprié de traiter sur symptômes, signes cliniques ou anomalie radiologique malgré l'absence de confirmation microbiologique. Ce passage ne dispense pas de chercher des échantillons appropriés, de vérifier l'image et les autres diagnostics, et de documenter pourquoi la maladie est retenue.</p><p>Une investigation encore en cours est une <strong>suspicion</strong>. Une preuve microbiologique ou histologique obtenue ensuite change le statut. La décision thérapeutique pédiatrique dépend du tableau réel et d'un avis spécialisé ; aucun schéma n'est attribué à l'enfant de la vignette.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 6.1 p. 31 (« Dans des situations exceptionnelles… »), ch. 6.2 pp. 31–32, ch. 7.1 et 7.3 pp. 36–40</a>.</div></template>
<template data-pop="a16-pa-plevre" data-title="Pleurésie, ganglions et poumon : séparer les sites"><div class="lab">Anatomie clinique et nomenclature ont deux découpages</div><p>Le guide clinique suisse cite la plèvre parmi les formes extrapulmonaires ; la nomenclature BfArM du catalogue l'inclut parmi les organes respiratoires. Des ganglions intrathoraciques forment une autre branche. Selon la présentation, le diagnostic peut demander une recherche d'atteinte pulmonaire associée et un prélèvement pleural ou ganglionnaire. Le site nommé par un catalogue ne prouve ni maladie active ni contagiosité.</p><p>Chez l'enfant fictif, seules des adénopathies hilaires sont <strong>décrites radiologiquement</strong> ; leur cause n'est pas connue. Aucun épanchement pleural, lésion pulmonaire ni prélèvement n'est attribué au cas.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.3–3.4 pp. 15–16 et ch. 6.1–6.2 pp. 31–32</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A16" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, entrées des organes respiratoires sans confirmation, nomenclature</a>.</div></template>
<template data-pop="a16-pa-epidemio" data-title="Fréquence suisse : toujours préciser l'année et le périmètre"><div class="lab">Toutes formes de tuberculose réunies</div><p>Le guide suisse V1.2024 rapporte 365 cas de tuberculose signalés en <strong>2022</strong>, soit 4,16 pour 100 000 habitants. Le guide de déclaration OFSP 2026 parle, plus largement, de 300 à 500 cas déclarés par an en Suisse. Ce ne sont ni des statistiques de la seule maladie respiratoire non confirmée, ni un taux pédiatrique, ni des chiffres de l'année 2026.</p><p>Ces données montrent que la tuberculose est peu fréquente en Suisse, mais l'exposition rapprochée de l'enfant fictif crée une question individuelle qui ne peut se régler par une moyenne populationnelle.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 2.1 p. 9</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de déclaration 2026, fiche 58 p. 117, « Charge de morbidité »</a>.</div></template>
<template data-pop="a16-pa-priorite" data-title="Pourquoi examiner rapidement un contact de moins de cinq ans ?"><div class="lab">Vulnérabilité et symptômes présents</div><p>Le guide suisse classe les enfants de moins de cinq ans parmi les contacts nécessitant sans délai un examen clinique et une radiographie, même lorsqu'ils n'ont pas de symptôme. Tout contact symptomatique doit aussi être évalué rapidement. Le risque de progression vers une maladie après infection est plus élevé à cet âge, et une forme grave peut évoluer sans tableau respiratoire typique.</p><p>L'enfant fictif cumule contact domestique, fièvre prolongée et image anormale. L'étape est d'évaluer une <strong>maladie possible</strong> ; un traitement préventif d'infection tuberculeuse chez un contact ne remplace pas ce bilan.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.2 p. 14, ch. 5.1.1 pp. 26–27 et tableau 5-1 p. 29</a>.</div></template>
<template data-pop="a16-pa-clinique-seule" data-title="Part de décisions cliniques sans preuve directe"><div class="lab">Une proportion du guide, pas une cible diagnostique</div><p>Au chapitre diagnostique, le guide suisse note que le traitement sur symptômes, signes ou image seuls peut être approprié dans des situations exceptionnelles, particulièrement chez les enfants, et indique entre parenthèses « environ 20 % de tous les cas de tuberculose déclarés en Suisse ». Ce nombre n'est ni le taux spécifique de cette catégorie de catalogue, ni celui des enfants, ni une donnée de 2026.</p><p>La formulation n'autorise pas une prescription automatique devant une image compatible. Elle justifie de rendre visibles l'incertitude, la recherche de preuve et la décision clinique documentée lorsqu'une confirmation demeure inaccessible.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 6.1 « Considérations chez les patients potentiellement atteints de tuberculose », p. 31</a>.</div></template>
<template data-pop="a16-pa-aerosols" data-title="Aérosols : risque reçu et risque transmis"><div class="lab">La personne source et l'enfant sont deux évaluations</div><p>Une tuberculose pulmonaire infectieuse peut émettre des particules contenant des bacilles vivants lorsqu'une personne tousse ou parle. La durée d'air partagé, la concentration en bacilles et la ventilation comptent. La vignette précise un contact domestique avec une personne contagieuse, ce qui motive l'évaluation de l'enfant.</p><p>Cette exposition ne fait pas automatiquement de l'enfant une source de transmission. Le guide indique que les jeunes enfants avec tuberculose pulmonaire sont généralement moins contagieux que les adultes, notamment en raison d'une maladie paucibacillaire et d'une toux moins efficace. Son infectiosité, s'il est malade, doit être jugée sur les constatations réelles.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.1–3.2 pp. 14–15 et ch. 7.5.2 p. 44</a>.</div></template>
<template data-pop="a16-pa-progression" data-title="Pourquoi le jeune âge change le risque"><div class="lab">Infection et maladie ne sont pas synonymes</div><p>Après inhalation du bacille, une réponse immunitaire peut contenir l'infection, ou la maladie peut survenir, parfois après une période silencieuse. Le guide suisse indique que le risque de progression est maximal dans les deux premières années et considérablement accru chez les nourrissons et jeunes enfants, ainsi que chez les personnes immunodéprimées. Les formes disséminées ou méningées concernent particulièrement les très jeunes et les personnes immunodéprimées.</p><p>Ces faits augmentent la priorité d'examen de l'enfant contact. Ils ne permettent pas de conclure à une méningite, à une dissémination ou à une tuberculose certaine dans la vignette.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 3.2–3.3 pp. 14–15 et ch. 5.1.1 pp. 26–27</a>.</div></template>
<template data-pop="a16-pa-paucibacillaire" data-title="Tuberculose pédiatrique paucibacillaire"><div class="lab">Difficulté de confirmation, jamais preuve par l'échec d'un test</div><p>Le guide suisse décrit chez les enfants d'âge préscolaire une maladie souvent paucibacillaire et une faible capacité à produire une toux efficace. Les moins de cinq ans ne fournissent généralement pas d'expectorations spontanées ; le document détaille des aspirats gastriques pour PCR, microscopie et culture, ainsi qu'un examen des selles par PCR en complément et d'autres prélèvements si indiqués.</p><p>Une microbiologie négative peut donc ne pas exclure toute maladie compatible. Il faut cependant interpréter la qualité, le nombre et le site des échantillons, l'image, l'exposition et les diagnostics différentiels avant de retenir une maladie sans confirmation. Aucun test n'a encore été rapporté pour le cas fictif.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 6.1–6.2 pp. 31–32 et ch. 7.5.2 p. 44</a>.</div></template>
<template data-pop="a16-pa-fievre" data-title="Fièvre prolongée de l'enfant : la caractériser"><div class="lab">Un signal clinique non spécifique</div><p>Le guide suisse signale que les enfants peuvent présenter une fièvre prolongée et un retard de croissance plutôt que le tableau respiratoire adulte classique. Il recommande de fonder la suspicion sur l'ensemble exposition, durée, symptômes, examen et radiographie ; aucun signe isolé n'est pathognomonique.</p><p>Dans la vignette, la fièvre est décrite comme prolongée sans durée, température ni retentissement connus. Préciser son évolution, l'appétit, le poids/la croissance, la toux, l'état général et les autres symptômes est indispensable pour évaluer aussi les causes non tuberculeuses.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 3.3 p. 15 et ch. 6.1 p. 31</a>.</div></template>
<template data-pop="a16-pa-hilaire" data-title="Adénopathies hilaires à l'imagerie"><div class="lab">Localiser et décrire avant d'attribuer une cause</div><p>Le guide suisse indique que les adénopathies hilaires et les infiltrats pulmonaires sont des manifestations radiologiques courantes de la tuberculose de l'enfant. Il précise aussitôt qu'aucune image n'est spécifique et qu'elle ne distingue pas à elle seule activité, inactivité ou lésion ancienne. Les ganglions doivent être décrits et comparés aux images précédentes si disponibles.</p><p>Le BfArM prévoit un site ganglionnaire intrathoracique dans sa nomenclature, mais une adénopathie décrite n'est pas déjà une adénopathie <strong>tuberculeuse</strong>. Dans la vignette, ni prélèvement ganglionnaire, ni preuve d'agent, ni autre cause exclue n'est documenté.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.4 pp. 15–16 et ch. 6.1–6.2 pp. 31–32</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a15-a19.htm#A16" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, rubrique des ganglions intrathoraciques non confirmés, nomenclature</a>.</div></template>
<template data-pop="a16-pa-contact" data-title="Caractériser le contact domestique"><div class="lab">Temps d'air partagé et chronologie</div><p>Le guide suisse relie le risque d'infection à la concentration de bacilles dans l'air et à la durée du partage de cet air. Pour l'enquête d'entourage, il demande d'établir les personnes exposées, les dates et l'intensité de contact, avec priorité aux enfants de moins de cinq ans et aux personnes symptomatiques. L'histoire précise le lieu et la période de l'exposition de l'enfant, sans convertir le contact en diagnostic.</p><p>L'enquête est menée sous responsabilité du service du médecin cantonal, avec souci de confidentialité. Le récit fictif ne donne pas encore la durée exacte ni les conditions de ventilation du logement.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.1 pp. 14–15, ch. 5.1 pp. 25–27 et ch. 8.1 p. 46</a>.</div></template>
<template data-pop="a16-pa-source" data-title="Pourquoi demander la sensibilité de la personne source ?"><div class="lab">Une information à rechercher, non à inventer</div><p>Si un enfant contact présente une tuberculose suspectée ou retenue sans isolement de bacille, le contexte microbiologique de la personne source aide l'équipe spécialisée à estimer le risque de résistance et à choisir une prise en charge adaptée. Le guide suisse demande d'évaluer la résistance, notamment à la rifampicine, avant traitement ; l'enquête d'entourage utilise les résultats du cas index quand ils existent.</p><p>Dans la vignette, seule la contagiosité de la personne source est donnée. Son espèce bactérienne, ses tests de sensibilité et son traitement sont inconnus. Il serait inexact de supposer une souche sensible ou d'imposer un schéma à l'enfant sur ce seul récit.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 5.1 p. 25, ch. 7.1–7.2 pp. 36–39 et ch. 8.1 p. 46</a>.</div></template>
<template data-pop="a16-pa-symptomes" data-title="Anamnèse pédiatrique ciblée"><div class="lab">Fièvre, respiration, croissance et autres organes</div><p>Le guide suisse décrit chez l'enfant une fièvre prolongée et parfois un ralentissement de croissance ; le tableau peut être peu symptomatique. Demander depuis quand la fièvre évolue, la toux et sa durée, l'appétit, le poids ou la courbe de croissance, l'énergie, et tout signe orientant vers une atteinte d'un autre organe. Les formes disséminées et méningées sont plus préoccupantes chez les très jeunes, mais aucun tel signe n'est donné dans le cas.</p><p>Rechercher aussi antécédents de traitement, VIH ou autres causes d'immunosuppression, car ils influencent l'évaluation. Ces questions ouvrent le dossier ; elles ne constituent pas des réponses déjà connues.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.2–3.3 pp. 14–15, ch. 5.1 pp. 25–27 et ch. 7.1–7.3 pp. 36–40</a>.</div></template>
<template data-pop="a16-pa-examen" data-title="Examen clinique et état général de l'enfant"><div class="lab">La normalité ne peut être supposée</div><p>La vignette n'indique ni température mesurée, ni fréquence respiratoire, ni saturation, ni poids ou courbe de croissance, ni état neurologique. Ces constatations et un examen respiratoire et général sont à obtenir pour apprécier urgence, site de maladie possible et autres diagnostics. Le guide suisse rappelle qu'une fièvre ou une image compatible ne suffit pas ; chez les petits enfants, la présentation peut être moins typique.</p><p>L'examen oriente les prélèvements et l'organisation des soins. Une absence de toux ou un examen pulmonaire peu contributif, s'ils étaient trouvés, ne clôtureraient pas seuls l'investigation.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, V1.2024, ch. 3.3–3.4 pp. 15–16, ch. 5.1 pp. 26–27 et ch. 6.1 p. 31</a>.</div></template>
<template data-pop="a16-pa-imagerie" data-title="Ce que peut et ne peut pas dire l'imagerie"><div class="lab">Un indice anatomique, non une confirmation</div><p>Le guide suisse décrit des infiltrats, des cavités ou des adénopathies selon l'âge et le site, mais souligne qu'aucune image thoracique n'est spécifique de la tuberculose. La radiographie ou la TDM ne permet pas seule de distinguer une maladie active d'une lésion inactive ou d'une autre cause. L'analyse cherche localisation, évolution et images antérieures, puis guide les prélèvements pertinents.</p><p>Chez l'enfant fictif, seules des adénopathies hilaires sont décrites ; leur taille, leur aspect et leur cause restent inconnus. Le contact domestique augmente la vigilance sans transformer l'image en preuve.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 3.4 pp. 15–16 et ch. 6.1–6.2 pp. 31–32</a>.</div></template>
