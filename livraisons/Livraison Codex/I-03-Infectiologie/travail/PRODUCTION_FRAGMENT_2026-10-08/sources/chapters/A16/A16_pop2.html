<template data-pop="pareto-a16-p" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="a16-p-0,a16-p-1,a16-p-2,a16-p-3"></p><ul><li>Une suspicion chez un enfant symptomatique ne reçoit pas automatiquement le traitement préventif du contact asymptomatique.</li><li>Le schéma de maladie sensible reste conditionnel ; poids, gravité et résistance sont encore inconnus.</li><li>Les FI individuelles précisent leurs limites d’âge et de formulation ; Rimstar/Rimactazid ne conviennent pas à ce cas de quatre ans.</li><li>Les restrictions Myambutol avant treize ans et pyrazinamide à trois–dix ans nécessitent un choix spécialisé, sans dose extrapolée.</li></ul><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP–Ligue pulmonaire, guide suisse V1.2024, ch. 5–7</a>. ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56768" target="_blank" rel="noopener" data-reference-source="1">FI Rimstar, n°56768</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56769" target="_blank" rel="noopener" data-reference-source="1">FI Rimactazid, n°56769</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33153" target="_blank" rel="noopener" data-reference-source="1">FI Myambutol, n°33153</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57699" target="_blank" rel="noopener" data-reference-source="1">FI Pyrazinamide Labatec, n°57699</a></div></template>
<template data-pop="a16-p-detail" data-title="Tuberculose pédiatrique — guide suisse et spécialités vérifiées"><div class="lab">Ce que permet la comparaison</div><p>Les posologies ci-dessous sont des repères de sources pour une <strong>tuberculose active retenue après bilan</strong>, présumée sensible. Elles ne constituent pas une ordonnance pour l’enfant de quatre ans de la vignette : son poids, la gravité, les prélèvements et la sensibilité de la personne source sont inconnus. Les informations professionnelles portent sur les présentations suisses précises dont le texte complet a été lu ; elles ne prouvent ni leur stock ni l’existence d’une forme adaptée à cet enfant.</p><table class="t"><thead><tr><th>Composant et produit suisse</th><th>Guide suisse V1.2024</th><th>FI suisse : écart et limite clinique</th></tr></thead><tbody><tr><td>Isoniazide ; Isoniaz-TB, comprimés 100/300 mg, n°69140, février 2026</td><td>Enfant de 3 mois à 16 ans et ≤25 kg : 10 mg/kg/j, plage 7–15 mg/kg/j, ch. 7.1, tableau 7-1, p. 36.</td><td>« Posologie », traitement combiné : 10 mg/kg/j, plage 10–15 mg/kg/j, maximum 300 mg/j, en une prise. La FI distingue la dose du traitement de celle de la prévention et conseille la pyridoxine. Le poids et la présentation utilisable doivent être connus avant calcul.</td></tr><tr><td>Rifampicine ; Rifampicin Labatec, gélules 150/300 mg, n°50264 dans la FI groupée, octobre 2023</td><td>Enfant ≤25 kg : 15 mg/kg/j, plage 10–20 mg/kg/j, ch. 7.1, tableau 7-1, p. 36.</td><td>« Posologie », traitement combiné : 15 mg/kg/j, plage 10–20 mg/kg/j, maximum 600 mg/j. Les gélules lues ne fournissent pas à elles seules une administration individualisée vérifiée pour cet enfant ; la galénique et les interactions doivent être évaluées.</td></tr><tr><td>Pyrazinamide ; Pyrazinamide Labatec, comprimés 400 mg, n°57699, octobre 2022</td><td>Enfant ≤25 kg : 35 mg/kg/j, plage 30–40 mg/kg/j, pendant la phase initiale, ch. 7.1, tableau 7-1, p. 36.</td><td>« Posologie » : 30–35 mg/kg/j en une prise après le repas, dans une association. Chez l’enfant de <strong>3 à 10 ans</strong>, la FI exige une <strong>indication absolue</strong> ; le produit ne convient pas avant 3 ans. La valeur du guide à 35 mg/kg/j se trouve à la borne haute de cette FI, sans permettre un calcul sans poids.</td></tr><tr><td>Éthambutol ; Myambutol, comprimés 100/400 mg, n°33153, août 2024</td><td>Enfant ≤25 kg : 20 mg/kg/j, plage 15–25 mg/kg/j, ch. 7.1, tableau 7-1, p. 36 ; quatrième médicament du schéma standard présumé sensible.</td><td>« Posologie » : <strong>non recommandé avant 13 ans</strong>, sécurité non établie. Si absolument nécessaire, la FI demande adaptation au poids, extrême prudence et contrôles réguliers. « Mises en garde » : acuité, champ et couleurs avant traitement puis toutes les quatre semaines. Ces tests sont difficiles à quatre ans ; la ligne du guide ne lève pas la réserve de la FI.</td></tr><tr><td>Associations fixes ; Rimstar n°56768 et Rimactazid n°56769, avril 2026</td><td>La phase initiale comporte quatre médicaments ; la continuation, isoniazide et rifampicine, ch. 7.1, p. 36–37.</td><td>« Posologie » : Rimstar convient dès <strong>8 ans et 30 kg</strong> lorsque son rapport fixe est approprié ; Rimactazid déconseille l’emploi avant 8 ans ou sous 30 kg. Les deux sont <strong>inapplicables à l’enfant de quatre ans</strong>. Les fractions de comprimés d’une association adulte ne créent pas une dose pédiatrique validée.</td></tr></tbody></table><p>Le régime habituel du guide est deux mois quotidiens d’isoniazide, rifampicine, pyrazinamide et éthambutol, puis quatre mois d’isoniazide et rifampicine. Son option de <strong>quatre mois</strong> n’est discutée que si une <strong>tuberculose pédiatrique non grave</strong> a été établie et si la sensibilité et les produits permettent ce choix : deux mois d’isoniazide, rifampicine, pyrazinamide avec éthambutol selon indication, puis deux mois d’isoniazide et rifampicine. La gravité, l’étendue de la maladie et la sensibilité de la source n’étant pas documentées, aucune de ces durées n’est sélectionnée pour la vignette. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Guide suisse V1.2024, ch. 7.1–7.3, p. 36–40</a>.</p><div class="lab">Décisions qui restent ouvertes</div><p>Avant toute prescription, l’équipe pédiatrique vérifie le diagnostic, la résistance éventuelle chez la personne source, le poids, les fonctions hépatique et rénale, les interactions et une présentation administrable. Une résistance à la rifampicine appelle une confirmation et un avis spécialisé selon le chapitre 7.2 du guide ; aucun schéma de remplacement n’est extrapolé. Si Myambutol est retenu malgré l’âge, ses exigences visuelles et son risque optique doivent pouvoir être pris en charge. Les comprimés ou gélules figurant dans les FI ne démontrent pas à eux seuls une forme ou une dose adaptée à quatre ans.</p><div class="src"><b>Textes primaires consultés le 8 octobre 2026.</b> <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse–OFSP, <i>Tuberculose en Suisse</i>, V1.2024, ch. 5–7, tableau 7-1, p. 26–42</a> ; Swissmedicinfo, informations professionnelles : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=69140" target="_blank" rel="noopener" data-reference-source="1">Isoniaz-TB n°69140, « Posologie » et « Mises en garde », février 2026</a>, <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=50264" target="_blank" rel="noopener" data-reference-source="1">Rifampicin Labatec n°50264, « Posologie » et « Interactions », octobre 2023</a>, <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57699" target="_blank" rel="noopener" data-reference-source="1">Pyrazinamide Labatec n°57699, « Posologie » et « Mises en garde », octobre 2022</a>, <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33153" target="_blank" rel="noopener" data-reference-source="1">Myambutol n°33153, « Posologie » et « Mises en garde », août 2024</a>, <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56768" target="_blank" rel="noopener" data-reference-source="1">Rimstar n°56768, « Posologie », avril 2026</a> et <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56769" target="_blank" rel="noopener" data-reference-source="1">Rimactazid n°56769, « Posologie », avril 2026</a>.</div></template>
