<section class="ilot" id="a69-0"><h2><span class="n">0</span>Une plaque qui s'étend après une piqûre de tique</h2>
<p><b>Vignette fictive.</b> Une personne adulte consulte après une piqûre de tique. Une plaque cutanée est apparue plusieurs jours plus tard et s'étend progressivement au-delà de 5 cm. Sa couleur, ses bords, sa localisation précise et ses dimensions successives doivent être examinés. Température, constantes, examen neurologique, cardiaque et articulaire ne sont pas encore documentés. Aucun résultat de laboratoire ni traitement administré n'est supposé.</p>
<p>Le délai et l'expansion rendent un <button class="w" data-k="a69-pa-em">érythème migrant (lésion cutanée clinique précoce de Lyme)</button> plausible. Ils le distinguent d'une <button class="w" data-k="a69-pa-reaction">petite rougeur immédiatement après piqûre (réaction locale à comparer)</button>. La question n'est pas seulement de nommer la plaque : il faut rechercher les signes neurologiques, cardiaques et articulaires qui changeraient le parcours. Une sérologie précoce ne remplace pas cet examen.</p>
<div class="key"><b>Question du cours.</b> Quel tableau clinique permet de reconnaître la borréliose de Lyme, et comment éviter de lui attribuer des lésions orales d'une autre origine ? <button class="w" data-k="a69-pa-detail">Données connues et inconnues de la vignette (cas fictif)</button>.</div>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validation 25.08.2025, FAQ « rougeur »</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, Maladie de Lyme », validation 02.05.2025, « Peau » et « Manifestations »</a>.</div></section>

<section class="ilot" id="a69-1"><h2><span class="n">1</span>Deux voies cliniques qui ne partagent pas le même diagnostic</h2>
<p>La <button class="w" data-k="a69-pa-lyme">borréliose de Lyme (infection transmise par une tique <i>Ixodes</i>)</button> peut d'abord donner un érythème migrant, puis se manifester dans les nerfs, le cœur, les articulations ou plus tard la peau. Ces manifestations n'apparaissent pas nécessairement dans un ordre fixe ; le tableau observé détermine les examens et la prise en charge. Une piqûre seule et une sérologie positive isolée ne constituent pas une maladie de Lyme active.</p>
<p>Les lésions <button class="w" data-k="a69-pa-vincent">gingivales ou pharyngées ulcéro-nécrosantes dites de Vincent (branche bucco-pharyngée)</button> relèvent d'un autre examen. Les données parodontales citées ici concernent la gencive ; l’angine de Plaut-Vincent figure dans la nomenclature, mais son diagnostic pharyngé ne se déduit ni de ces données gingivales ni de la maladie de Lyme. Le <button class="w" data-k="a69-pa-noma">noma (gangrène orofaciale rapidement progressive)</button> est encore plus grave : l'OMS le décrit comme une maladie opportuniste polymicrobienne, surtout chez des enfants confrontés à la malnutrition et à une forte précarité, et parfois chez des adultes immunodéprimés. L'étiquette historique « fusospirochétale » n'explique pas seule son mécanisme ; aucune de ces atteintes orales ne découle de la tique de la vignette.</p>
<div class="trap"><span class="k">Piège</span> La forme des bactéries au microscope ou un libellé administratif commun ne transforme pas une gangrène buccale en manifestation de Lyme. Les deux voies gardent leurs propres signes, examens et urgences.</div>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Manifestations », « Diagnostic », 02.05.2025</a> ; <a href="https://www.who.int/publications/i/item/B09724" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>Noma control: technical brief</i>, 08.07.2026, §2 p. PDF 8</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, « Noma », 15.12.2023, « Overview »</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/jcpe.12941" target="_blank" rel="noopener" data-reference-source="1">EFP, Herrera et al., lésions parodontales aiguës, 2018, §2</a></div></section>

<section class="ilot" id="a69-2"><h2><span class="n">2</span>En Suisse, distinguer estimation de maladie et exposition aux tiques</h2>
<p>L'OFSP estime qu'il survient <button class="w" data-k="a69-pa-epidemio">8 000 à 15 000 cas de maladie de Lyme par an en Suisse (estimation, non notifications)</button>. Sa FAQ ne rapporte pas un comptage annuel confirmé pour cette infection ; elle oppose ces estimations aux cas d'encéphalite à tiques, soumis à déclaration. Il serait donc inexact d'attribuer le chiffre à une année précise ou à toutes les infections classées dans ce cours.</p>
<p>En Suisse, la transmission de Lyme implique surtout <button class="w" data-k="a69-pa-tique">la tique <i>Ixodes ricinus</i> (vecteur et conduite après piqûre)</button>. La SSI indique qu'une sérologie après une piqûre asymptomatique, ou l'analyse de la tique retirée, ne guide pas utilement la prise en charge. L'absence de souvenir de piqûre n'élimine pas une présentation clinique compatible. Le noma décrit par l'OMS appartient à un autre contexte épidémiologique ; aucune fréquence suisse comparable n'a été vérifiée ici.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques-situation-en-suisse" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tiques et agents pathogènes transmis par les tiques : FAQ », « Prévalence » et « Transmission », consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », « Introduction » et FAQ, 25.08.2025</a> ; <a href="https://europepmc.org/articles/PMC12584192" target="_blank" rel="noopener" data-reference-source="1">Directive allemande cutanée, 09.10.2025, §4 « Transmission routes », complément européen</a>.</div></section>

<section class="ilot" id="a69-3"><h2><span class="n">3</span>De l'inoculation cutanée à l'atteinte d'organe : une chronologie possible</h2>
<p>Lors d'un repas sanguin, une tique infectée peut transmettre des bactéries du complexe <i>Borrelia burgdorferi</i> sensu lato. L'inflammation cutanée locale peut produire une plaque qui grandit progressivement : c'est la raison de suivre son <button class="w" data-k="a69-pa-expansion">expansion dans le temps (élément qui distingue l'érythème migrant)</button>, plutôt que de juger une seule photographie sans contexte. Les bactéries peuvent ensuite se disséminer ; les formes nerveuses, cardiaques ou articulaires sont des possibilités cliniques, pas des complications acquises chez la personne de la vignette.</p>
<p>Les anticorps deviennent parfois détectables seulement après la phase cutanée précoce et peuvent persister longtemps après résolution. Une <button class="w" data-k="a69-pa-serologie">sérologie positive (trace d'exposition, pas mesure de maladie active)</button> doit donc être interprétée avec le tableau clinique ; une négativité précoce ne réfute pas une plaque typique. C'est pourquoi la SSI diagnostique l'érythème migrant typique cliniquement, sans test sérologique initial.</p>
<p>Le mécanisme oral est distinct. L'OMS décrit le noma comme une infection opportuniste liée à une diversité de bactéries buccales et à la malnutrition, à une immunité affaiblie ou à une mauvaise santé orale. Une gingivite peut précéder une nécrose puis une gangrène, mais la proportion qui progresse d'un stade à l'autre est <b>inconnue</b>. Cette incertitude interdit d'annoncer que toute gingivite de Vincent devient un noma.</p>
<div class="src">Sources : <a href="https://europepmc.org/articles/PMC12584192" target="_blank" rel="noopener" data-reference-source="1">Directive allemande cutanée 2025, §2 « Microbiology », §4 « Transmission routes », §5 « Pathogenesis », §7.1 « Serodiagnosis »</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme 2025, « Diagnostic », rubrique « Peau »</a> ; <a href="https://www.who.int/publications/i/item/B09724" target="_blank" rel="noopener" data-reference-source="1">OMS, noma 2026, §2 p. PDF 8</a>.</div></section>

<section class="ilot" id="a69-4"><h2><span class="n">4</span>Reconnaître les formes qui changent le parcours</h2>
<div class="two"><div class="card"><b>Lyme : la peau puis, parfois, d'autres organes.</b><p>L'<button class="w" data-k="a69-pa-em">érythème migrant (plaque expansive, diagnostic clinique)</button> est une présentation cutanée précoce. Plusieurs lésions, un lymphocytome, une <button class="w" data-k="a69-pa-neuro">paralysie faciale, méningite ou radiculopathie (atteinte neurologique)</button> ou des <button class="w" data-k="a69-pa-cardite">troubles de conduction (cardite de Lyme)</button> appellent une autre évaluation. Plus tard, la SSI décrit surtout une <button class="w" data-k="a69-pa-arthrite">monoarthrite d'une grande articulation (souvent le genou)</button> ou une <button class="w" data-k="a69-pa-acrodermatite">acrodermatite chronique atrophiante (atteinte cutanée tardive)</button>. Aucun de ces signes extracutanés n'est documenté dans le cas fictif.</p></div><div class="card"><b>Bouche et pharynx : une autre voie.</b><p>Une gingivite nécrosante impose un examen bucco-dentaire local. Une angine ulcéro-nécrosante requiert un examen pharyngé distinct ; les preuves parodontales de la gingivite ne sont pas transposées à l’angine. Une atteinte rapidement destructrice de la gencive, puis du visage, fait envisager le noma et une prise en charge urgente. L'OMS en souligne le contexte de vulnérabilité et la nature polymicrobienne. Le cours n'attribue aucune lésion orale à la personne piquée par une tique.</p></div></div>
<p>Les symptômes neurologiques après tique ont aussi d'autres causes : la SSI demande de considérer notamment l'<button class="w" data-k="a69-pa-differentiels">encéphalite à tiques et les autres diagnostics différentiels (selon le syndrome)</button>. Un résultat d'anticorps isolé ne doit pas détourner de leur recherche.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme 2025, « Manifestations », « Diagnostic » et « Aspects importants »</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, « Noma », 15.12.2023, « Overview » et « Diagnosis »</a> ; <a href="https://www.who.int/publications/i/item/B09724" target="_blank" rel="noopener" data-reference-source="1">OMS, noma 2026, §2 p. PDF 8</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/jcpe.12941" target="_blank" rel="noopener" data-reference-source="1">EFP, Herrera et al., lésions parodontales aiguës, 2018, §2</a></div></section>

<section class="ilot" id="a69-5"><h2><span class="n">5</span>L'anamnèse recherche la lésion et les organes, pas un résultat de laboratoire</h2>
<p>Demander la date et le lieu de l'exposition aux tiques, la date de la plaque, son diamètre initial et son évolution, et conserver si possible une photographie datée ou marquer ses limites. Rechercher d'autres plaques, de la fièvre et des symptômes généraux ; préciser surtout <button class="w" data-k="a69-pa-neuro">douleurs radiculaires, céphalées méningées ou paralysie faciale (alerte neurologique)</button>, <button class="w" data-k="a69-pa-cardite">palpitations, malaise ou syncope (alerte cardiaque)</button> et gonflement d'une articulation. L'absence de souvenir de tique ne ferme pas le diagnostic si la clinique est typique.</p>
<p>Pour la <button class="w" data-k="a69-pa-bouche">branche bucco-pharyngée (questions et contexte propres)</button>, demander douleur, saignement, ulcération, évolution rapide, difficulté à s'alimenter, atteinte faciale, état nutritionnel et causes d'immunodépression. Ce questionnement appartient à un autre patient ou à un autre scénario clinique ; rien dans la vignette Lyme ne le rend présent. Enfin, demander traitements antérieurs documentés : une séropositivité ancienne ou une fatigue isolée ne prouve pas une rechute active.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme 2025, « Aspects importants », « Manifestations », « Syndrome post-Lyme »</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Piqûre de tique 2025, FAQ « après piqûre »</a> ; <a href="https://www.who.int/publications/i/item/B09724" target="_blank" rel="noopener" data-reference-source="1">OMS, noma 2026, §2 p. PDF 8 et « Case management » p. PDF 10</a>.</div></section>

<section class="ilot" id="a69-6"><h2><span class="n">6</span>Examiner toute la personne avant de conclure à une forme cutanée isolée</h2>
<p>Décrire la plaque : diamètre mesuré, extension par rapport à une marque ou photographie, forme, bords et délai depuis la piqûre. Chercher d'autres lésions. Une petite rougeur apparue immédiatement et non expansive évoque plutôt une réaction locale ; la plaque décrite dans la vignette exige un examen réel pour confirmer son caractère typique. Mesurer les constantes, sans en inventer la normalité.</p>
<p>Un examen neurologique ciblé vérifie la <button class="w" data-k="a69-pa-examen-neuro">motricité faciale et les signes de méningite ou radiculopathie (orientation)</button>. Interroger le pouls et les symptômes cardiaques ; si malaise, syncope ou suspicion de cardite, rechercher un <button class="w" data-k="a69-pa-cardite">trouble de conduction par électrocardiogramme (conséquence d'une atteinte cardiaque)</button>. Inspecter et mobiliser les articulations, notamment si un genou est douloureux ou gonflé. La SSI relie ces constatations à des parcours diagnostiques et thérapeutiques différents.</p>
<p>Dans un tableau oral distinct, ouvrir et examiner la bouche, les gencives, le pharynx et la face pour identifier ulcération, nécrose, œdème ou extension destructrice. Le noma peut progresser rapidement ; un tel constat commande une évaluation spécialisée urgente. Ce risque ne doit pas être déduit de la seule présence du mot « spirochète ».</p>
<div class="alert"><b>Point de sécurité.</b> Paralysie faciale, douleurs radiculaires ou signes méningés, malaise/syncope, monoarthrite, ou destruction orofaciale modifient immédiatement l'évaluation. Leur présence ou leur absence restent à établir dans la vignette.</div>
