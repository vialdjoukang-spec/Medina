<template data-pop="pareto-a69-pa" data-title="Pareto — décisions devant Lyme et une lésion orale"><p class="ratio" data-cover="a69-7,a69-8,a69-9,a69-13"></p><ul><li>Une plaque typique qui s’étend après piqûre oriente vers un érythème migrant clinique ; une sérologie précoce peut être négative.</li><li>Rechercher des signes neurologiques, cardiaques et articulaires avant de retenir une forme cutanée isolée.</li><li>Une sérologie positive isolée n’est pas une maladie active et ne suit pas la guérison.</li><li>Une lésion orale nécrosante relève d’un examen et de soins spécialisés distincts, urgents si progression rapide.</li></ul><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Borréliose de Lyme, 02.05.2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Piqûre de tique, 25.08.2025</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, Noma</a>. Consultés le 8 octobre 2026.</div></template>
<template data-pop="a69-pa-detail" data-title="Vignette fictive — ce qui est établi et ce qui reste à examiner"><div class="lab">Situation clinique, sans diagnostic fabriqué</div><p>Une personne adulte rapporte une piqûre de tique, puis une plaque apparue plusieurs jours après et s'étendant au-delà de 5 cm. Cette chronologie rend l'érythème migrant plausible. L'aspect réel, les dimensions successives, les constantes, les symptômes neurologiques, cardiaques ou articulaires et l'examen de ces organes ne sont pas encore documentés. Aucun test, traitement ou résultat normal n'est attribué à cette personne.</p><p>La suite est conditionnelle : confirmer une plaque typique à l'examen, puis chercher les signes qui orienteraient vers une atteinte disséminée. Une sérologie initiale n'est pas nécessaire pour un érythème migrant typique ; elle ne remplace pas la recherche des autres manifestations.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », FAQ « rougeur », validée le 25.08.2025</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, Maladie de Lyme », « Manifestations » et « Diagnostic », validée le 02.05.2025</a>.</div></template>
<template data-pop="a69-pa-em" data-title="Érythème migrant — reconnaissance clinique"><div class="lab">Plaque tardive et expansive</div><p>L'érythème migrant apparaît typiquement plusieurs jours après la piqûre : la SSI indique 3 à 32 jours, avec un diamètre supérieur à 5 cm. La plaque s'agrandit progressivement ; l'aspect classique en cible n'est pas obligatoire. Plusieurs lésions peuvent signaler une forme précoce disséminée. Il faut décrire la lésion et rechercher les symptômes d'autres organes avant de parler de forme cutanée isolée.</p><p>Pour une plaque typique, la SSI et sa directive « Piqûre de tique » recommandent un diagnostic clinique et une prise en charge sans attendre la sérologie, souvent encore négative. Une lésion atypique demande un autre raisonnement dermatologique ; le seuil de 5 cm n'est pas à utiliser sans chronologie ni examen.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Manifestations » et « Diagnostic : Peau », 02.05.2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », FAQ « rougeur », 25.08.2025</a>.</div></template>
<template data-pop="a69-pa-reaction" data-title="Rougeur immédiate après piqûre"><div class="lab">Comparer délai, taille et évolution</div><p>Une petite rougeur présente rapidement après la piqûre est généralement une réaction locale toxique ou allergique, selon la SSI. Elle diffère d'une plaque apparue après plusieurs jours et qui s'étend. Une photographie datée ou la mesure successive de ses bords peut aider à documenter cette évolution ; la seule couleur rouge n'établit pas Lyme.</p><p>Si la plaque grandit, dépasse plusieurs centimètres ou si des signes neurologiques, cardiaques ou articulaires surviennent, réévaluer le tableau au lieu de conserver l'étiquette de réaction locale.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », FAQ « rougeur », 25.08.2025</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Diagnostic : Peau », 02.05.2025</a>.</div></template>
<template data-pop="a69-pa-lyme" data-title="Borréliose de Lyme — voie clinique principale"><div class="lab">Une infection transmise par une tique, plusieurs organes possibles</div><p>En Europe, des borrélies du complexe <i>Borrelia burgdorferi</i> sensu lato sont transmises principalement par des tiques <i>Ixodes</i>. L'érythème migrant est la présentation cutanée précoce. La SSI décrit aussi des manifestations neurologiques, cardiaques, articulaires et cutanées tardives. Leur succession n'est pas obligatoire et la présence de la tique seule ne diagnostique pas une infection.</p><p>La voie Lyme exige une clinique compatible. Une sérologie positive isolée témoigne d'une exposition et ne prouve ni maladie actuellement active ni indication automatique d'antibiotique. Les atteintes de la bouche décrites ailleurs dans cette monographie relèvent d'un diagnostic séparé.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Aspects importants », « Manifestations », 02.05.2025</a> ; <a href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques-situation-en-suisse" target="_blank" rel="noopener" data-reference-source="1">OFSP, FAQ « Transmission » et « Borréliose », consultée le 08.10.2026</a>.</div></template>
<template data-pop="a69-pa-vincent" data-title="Atteinte bucco-pharyngée de Vincent"><div class="lab">Branche orale distincte</div><p>La nomenclature BfArM regroupe sous « autres fusospirochétoses » les gingivites, gingivostomatites et angines de Vincent. Ce libellé décrit des tableaux oraux ou pharyngés : il ne constitue pas, à lui seul, un test étiologique ni une indication de reprendre les examens ou traitements de Lyme. Les données de la directive parodontale citées pour la gingivite ne valident pas le diagnostic ou le traitement d’une angine pharyngée ; celle-ci demande une évaluation propre.</p><p>Devant une lésion ulcéro-nécrosante, préciser son siège gingival ou pharyngé, la douleur, le saignement et l’extension ; évaluer rapidement une éventuelle destruction tissulaire. Le noma constitue une affection orofaciale grave et polymicrobienne décrite par l'OMS. La proportion de gingivites nécrosantes évoluant vers lui est inconnue : la progression ne se déduit jamais du seul nom « Vincent ».</p><div class="src"><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a65-a69.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, entrée « Autres infections à spirochètes », nomenclature</a> ; <a href="https://www.who.int/publications/i/item/B09724" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>Noma control: technical brief</i>, 08.07.2026, §2, p. PDF 8</a> ; <a href="https://onlinelibrary.wiley.com/doi/10.1111/jcpe.12941" target="_blank" rel="noopener" data-reference-source="1">EFP, Herrera et al., lésions parodontales aiguës, 2018, §2</a></div></template>
<template data-pop="a69-pa-noma" data-title="Noma — maladie orofaciale destructrice"><div class="lab">Urgence d'une autre branche clinique</div><p>L'OMS décrit le noma comme une maladie opportuniste et polymicrobienne débutant dans la bouche, pouvant évoluer rapidement vers une gangrène du visage. Elle touche surtout de jeunes enfants confrontés à la malnutrition et à de fortes difficultés d'accès aux soins ; des adultes immunodéprimés peuvent aussi être concernés. Son contexte ne doit pas être projeté sur la personne adulte de la vignette, dont le motif est une plaque après tique.</p><p>Le diagnostic est clinique. Une nécrose ou un œdème rapidement progressif impose une évaluation spécialisée urgente. L'OMS associe selon stade soins locaux, antibiotiques, hydratation et nutrition, puis chirurgie ou rééducation si nécessaire. Son document ne fixe pas d'ordonnance suisse individuelle. La proportion de gingivites progressant jusqu'au noma reste inconnue.</p><div class="src"><a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, « Noma », 15.12.2023, « Overview », « Diagnosis », « Treatment »</a> ; <a href="https://www.who.int/publications/i/item/B09724" target="_blank" rel="noopener" data-reference-source="1">OMS, note technique « Noma control », 08.07.2026, §2 et « Case management » p. PDF 8 et 10</a>.</div></template>
<template data-pop="a69-pa-epidemio" data-title="Épidémiologie de Lyme en Suisse"><div class="lab">Estimation, pas registre de notifications</div><p>L'OFSP estime que 8 000 à 15 000 personnes contractent la maladie de Lyme chaque année en Suisse. La FAQ consultée ne présente pas ce nombre comme un décompte de déclarations obligatoires ni comme le résultat d'une seule année précise. Elle distingue la borréliose de l'encéphalite à tiques, pour laquelle la surveillance et la déclaration sont différentes.</p><p>Ces 8 000–15 000 ne représentent ni toutes les infections réunies dans cette monographie ni une fréquence du noma ou de la gingivite de Vincent. Aucun chiffre suisse robuste pour la branche orale n'a été vérifié.</p><div class="src"><a href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques-situation-en-suisse" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tiques et agents pathogènes transmis par les tiques : FAQ », « Prévalence » et « Borréliose », page consultée le 08.10.2026</a>.</div></template>
<template data-pop="a69-pa-tique" data-title="Vecteur et conduite après piqûre"><div class="lab"><i>Ixodes ricinus</i> en Suisse</div><p>La tique <i>Ixodes ricinus</i> transmet les borrélies en Suisse. Après retrait d'une tique chez une personne sans symptôme, la SSI ne recommande ni sérologie de Lyme, ni analyse de la tique, ni antibioprophylaxie systématique. Observer la peau : l'apparition retardée d'une plaque qui s'étend change la situation, puisqu'elle fait rechercher un érythème migrant.</p><p>Une piqûre peut passer inaperçue. Son absence dans le souvenir ne suffit donc pas à rejeter une présentation clinique compatible. La prévention comprend protection contre les tiques et retrait rapide avec une pince selon les instructions SSI.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », « Introduction » et FAQ, 25.08.2025</a> ; <a href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques-situation-en-suisse" target="_blank" rel="noopener" data-reference-source="1">OFSP, FAQ « Transmission », consultée le 08.10.2026</a>.</div></template>
<template data-pop="a69-pa-expansion" data-title="Pourquoi suivre l'expansion de la plaque ?"><div class="lab">Le temps apporte une donnée diagnostique</div><p>Un érythème migrant apparaît typiquement à distance de la morsure et s'étend progressivement ; la SSI décrit un diamètre habituellement supérieur à 5 cm. Une petite rougeur immédiate sans extension évoque plutôt une réaction locale. Mesurer le diamètre et documenter le bord de la lésion sur des dates successives est donc plus informatif qu'une photographie isolée interprétée sans chronologie.</p><p>Cette évolution aide à reconnaître une lésion typique, mais l'examen doit aussi rechercher d'autres lésions et les manifestations neurologiques, cardiaques ou articulaires. La plaque du cas fictif est rapportée comme expansive ; son aspect réel reste à vérifier.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Diagnostic : Peau », 02.05.2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », FAQ « rougeur », 25.08.2025</a>.</div></template>
<template data-pop="a69-pa-serologie" data-title="Sérologie de Lyme — interpréter selon la clinique"><div class="lab">La positivité ne mesure pas l'activité</div><p>La SSI réserve la sérologie aux manifestations compatibles, par exemple paralysie faciale, méningite, monoarthrite, lymphocytome, acrodermatite ou trouble de conduction compatible. Elle ne l'indique pas pour un érythème migrant typique, après une simple piqûre sans symptôme, pour des plaintes vagues, ni pour vérifier la guérison. À la phase cutanée très précoce, elle peut encore être négative.</p><p>Un dépistage positif doit être confirmé selon l'algorithme SSI. Les anticorps témoignent d'une exposition et peuvent persister : même un résultat confirmé ne prouve pas, sans syndrome compatible, une infection active ni l'indication d'antibiotiques. Une plainte tardive appelle d'abord une évaluation clinique et différentielle.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Aspects importants », « Diagnostic : Généralités », 02.05.2025</a> ; <a href="https://europepmc.org/articles/PMC12584192" target="_blank" rel="noopener" data-reference-source="1">Directive allemande cutanée S2k, publiée le 09.10.2025, §7.1 « Serodiagnosis »</a>.</div></template>
<template data-pop="a69-pa-neuro" data-title="Atteinte neurologique de Lyme"><div class="lab">Manifestations qui changent le bilan</div><p>La SSI décrit, parmi les formes neurologiques précoces, paralysie faciale périphérique, méningite et radiculopathie. L'interrogatoire et l'examen ciblés recherchent notamment asymétrie du visage, douleur radiculaire, céphalées et signes méningés. Ce sont des possibilités à chercher chez la personne du cas, pas des signes déjà constatés.</p><p>Si le tableau fait suspecter une neuroborréliose, l'évaluation ne se limite pas à une sérologie sanguine : la SSI décrit une pléiocytose lymphocytaire du liquide céphalo-rachidien et la production intrathécale d'anticorps spécifiques. La PCR du LCR est peu sensible. Le lieu, les examens et le traitement dépendent de la présentation neurologique réelle.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Manifestations », « Diagnostic : Neuroborreliose », « Thérapie », 02.05.2025</a> ; <a href="https://europepmc.org/articles/PMC12584707" target="_blank" rel="noopener" data-reference-source="1">Directive neurologique européenne/allemande S3, publiée le 09.10.2025, §3.10 et §4.3.5, complément</a>.</div></template>
<template data-pop="a69-pa-cardite" data-title="Cardite de Lyme — rechercher un trouble de conduction"><div class="lab">Palpitations, malaise et syncope sont des alertes</div><p>La SSI décrit des atteintes de conduction atrioventriculaire allant d'un allongement de l'intervalle PR/PQ au bloc complet. Des palpitations, un malaise ou une syncope dans un contexte clinique compatible conduisent à un examen cardiaque et à un électrocardiogramme ; un trouble de haut degré relève d'une évaluation urgente. Aucun de ces signes n'est documenté dans la vignette.</p><p>Une plaque cutanée ne suffit donc pas à choisir le schéma d'une forme isolée avant cette recherche. Les modalités du traitement d'une cardite dépendent du degré de bloc et ne se déduisent pas de la conduite d'un érythème migrant simple.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Manifestations », « Diagnostic : Cardite », « Thérapie : Cardite », 02.05.2025</a>.</div></template>
<template data-pop="a69-pa-arthrite" data-title="Arthrite de Lyme — une grande articulation gonflée"><div class="lab">Rechercher et documenter un vrai syndrome articulaire</div><p>La SSI décrit surtout une monoarthrite des grandes articulations, notamment du genou, parfois plusieurs mois après la piqûre. Une douleur seule ou une sérologie positive isolée ne remplacent pas l'examen du gonflement et la recherche d'autres causes d'arthrite. Selon le syndrome, une confirmation par sérologie et des examens articulaires peuvent être nécessaires.</p><p>La personne de la vignette n'a pas encore d'examen articulaire documenté. Une arthrite avérée demande son propre parcours diagnostique et thérapeutique ; elle ne se traite pas d'emblée comme une simple plaque cutanée.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Manifestations », « Diagnostic : Arthrite », « Thérapie », 02.05.2025</a>.</div></template>
<template data-pop="a69-pa-acrodermatite" data-title="Acrodermatite chronique atrophiante"><div class="lab">Présentation cutanée tardive distincte</div><p>La SSI décrit d'abord une lésion rouge violacé, mal délimitée, avec œdème sous-cutané, souvent sur les faces d'extension des extrémités. Plus tard, la peau devient très mince avec des vaisseaux visibles. Cette présentation se distingue par sa durée et son aspect de la plaque expansive récente du cas fictif.</p><p>La SSI place la sérologie et, selon le cas, la PCR sur biopsie cutanée dans le bilan. Le repérage précoce compte, car les lésions précoces peuvent régresser alors qu'une atrophie installée peut persister malgré l'arrêt de la progression.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Diagnostic : Peau — Acrodermatite chronique atrophiante », « Thérapie », 02.05.2025</a>.</div></template>
<template data-pop="a69-pa-differentiels" data-title="Diagnostics différentiels selon le syndrome"><div class="lab">Ne pas attribuer tout symptôme après tique à Lyme</div><p>La SSI rappelle de considérer notamment l'encéphalite à tiques (FSME), l'ehrlichiose, la babésiose, les rickettsioses et la tularémie selon le tableau. Une douleur articulaire, une paralysie faciale ou un malaise peuvent aussi relever de causes non transmises par les tiques. Le choix des examens part du syndrome et de l'examen, puis de l'exposition ; il ne découle pas d'une sérologie de Lyme positive isolée.</p><p>L'encéphalite à tiques est virale et distincte de la borréliose bactérienne ; sa prévention vaccinale n'immunise pas contre Lyme.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Aspects importants : Considérer les diagnostics différentiels », 02.05.2025</a> ; <a href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques-situation-en-suisse" target="_blank" rel="noopener" data-reference-source="1">OFSP, FAQ « Encéphalite à tiques » et « Borréliose », consultée le 08.10.2026</a>.</div></template>
<template data-pop="a69-pa-bouche" data-title="Interrogatoire de la branche bucco-pharyngée"><div class="lab">Un autre tableau, d'autres vulnérabilités</div><p>Si une personne présente réellement une lésion orale, documenter son début, sa progression, la douleur, les saignements, une ulcération ou nécrose, l'œdème facial, la capacité à boire et manger, l'état nutritionnel et d'éventuelles causes d'immunodépression. Examiner bouche, gencives, pharynx et face. Une progression destructrice rapide fait envisager le noma et impose une évaluation spécialisée urgente.</p><p>Le brief OMS situe le noma surtout dans des contextes de dénutrition et de grande vulnérabilité. Ces questions appartiennent à un scénario oral distinct ; elles ne prêtent aucune atteinte buccale à la personne piquée par une tique. La nomenclature « Vincent » ne permet pas à elle seule de prédire un noma.</p><div class="src"><a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, « Noma », 15.12.2023, « Who is at risk », « Signs and symptoms »</a> ; <a href="https://www.who.int/publications/i/item/B09724" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>Noma control: technical brief</i>, 08.07.2026, §2 et « Case management » p. PDF 8 et 10</a>.</div></template>
<template data-pop="a69-pa-examen-neuro" data-title="Examen neurologique ciblé après une plaque évocatrice"><div class="lab">Rechercher l'atteinte avant de la nommer</div><p>Vérifier la motricité faciale des deux côtés, les signes méningés et l'existence de douleurs radiculaires ou de déficits neurologiques. Une paralysie faciale, une méningite ou une radiculopathie conduisent à envisager une neuroborréliose dans un contexte compatible, tout en recherchant les autres causes. La personne du cas fictif n'a pas encore été examinée sur ces points.</p><p>Si la suspicion est réelle, la SSI décrit un bilan orienté avec sérologie et examen du liquide céphalo-rachidien, notamment pléiocytose lymphocytaire et synthèse intrathécale d'anticorps. Cette démarche est différente de celle d'un érythème migrant cutané typique isolé.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI Lyme, « Manifestations », « Diagnostic : Neuroborreliose », 02.05.2025</a>.</div></template>
