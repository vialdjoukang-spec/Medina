<template data-pop="pareto-a69-p" data-title="Pareto — prescription suisse"><p class="ratio" data-cover="a69-p-1,a69-p-2,a69-p-3"></p><ul><li>Une piqûre sans symptôme ne justifie pas l’antibioprophylaxie systématique selon la SSI.</li><li>Un érythème migrant typique appelle le schéma clinique SSI ; comparer dose et durée à la FI du produit exact.</li><li>Une atteinte neurologique ou cardiaque change la durée, parfois la voie et le lieu de soins.</li><li>Pour le noma, ne pas fabriquer de dose suisse absente des sources ; coordonner soins dentaires et hospitaliers.</li></ul><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Borréliose, « Thérapie », 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Piqûre de tique, 2025</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, Noma</a>. Consultés le 8 octobre 2026.</div></template>
<template data-pop="a69-p-detail" data-title="Borréliose de Lyme — écarts entre la SSI et les FI suisses"><div class="lab">Doxycycline : l’intersection de dix jours</div><p>La SSI validée en mai 2025 recommande 100 mg de doxycycline orale toutes les douze heures pendant 7 à 10 jours pour un érythème migrant sans cardite ni signe neurologique. La FI Doxycyclin-Mepha n°65952, révisée en février 2024, donne la même dose mais 10 à 60 jours pour les stades I et II. Dix jours satisfont donc les deux durées ; la borne SSI de sept jours ne figure pas dans la FI de cette spécialité. Le choix n’est applicable au cas qu’après examen des manifestations extracutanées et des contre-indications.</p><div class="lab">Alternatives cutanées : le produit change le schéma</div><p>La SSI donne amoxicilline 500 mg orale toutes les huit heures pendant 14 à 21 jours. La FI Amoxicilline Sandoz comprimés dispersibles n°56203, révisée en mai 2024, donne pour l’érythème migrant isolé 750 mg trois à quatre fois par jour pendant douze jours : dose et durée diffèrent. La SSI et la FI Céfuroxime Sandoz n°55987, révisée en avril 2023, concordent sur 500 mg oral toutes les douze heures pendant 14 à 21 jours pour la forme cutanée initiale ; la FI exige la prise après repas. Ces produits ne se remplacent pas par une simple équivalence milligramme pour milligramme.</p><div class="lab">Formes disséminées et voie intraveineuse</div><p>La SSI décrit 14 à 21 jours de doxycycline orale ou ceftriaxone IV pour la neuroborréliose aiguë sans atteinte parenchymateuse. Pour une atteinte parenchymateuse ou un bloc atrioventriculaire complet, elle va jusqu’à 28 jours de ceftriaxone IV. La FI Ceftriaxon Labatec n°59876, révisée en juin 2025, indique Lyme disséminée et 50 mg/kg une fois par jour, avec un maximum de 2 g, pendant quatorze jours. Elle ne documente donc pas les prolongations SSI au-delà de quatorze jours. La FI Doxycyclin-Mepha ne nomme comme manifestations neurologiques que celles passagères et limitées au visage ; le choix d’une autre forme neurologique relève de la SSI et d’une évaluation spécialisée.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Borréliose, « Thérapie », validée le 02.05.2025</a> ; FI Swissmedicinfo <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=65952" target="_blank" rel="noopener" data-reference-source="1">Doxycyclin-Mepha n°65952, février 2024, « Indications », « Posologie », « Grossesse »</a>, <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56203" target="_blank" rel="noopener" data-reference-source="1">Amoxicilline Sandoz n°56203, mai 2024, « Posologie »</a>, <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55987" target="_blank" rel="noopener" data-reference-source="1">Céfuroxime Sandoz n°55987, avril 2023, « Posologie »</a>, <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">Ceftriaxon Labatec n°59876, juin 2025, « Posologie »</a>. Textes consultés le 8 octobre 2026.</div></template>
