<template data-pop="pareto-a69-e" data-title="Pareto — examens complémentaires"><p class="ratio" data-cover="a69-e-0,a69-e-1,a69-e-2,a69-e-4"></p><ul><li>Un érythème migrant typique est clinique ; ne pas demander de sérologie initiale pour le confirmer.</li><li>La sérologie soutient une présentation compatible disséminée ou tardive ; un résultat positif seul marque une exposition.</li><li>Devant signes neurologiques ou cardiaques, choisir les examens qui caractérisent l’organe atteint.</li><li>Une lésion orale nécrosante requiert un examen bucco-dentaire distinct des tests de Lyme.</li></ul><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Borréliose, « Diagnostic », 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Piqûre de tique, 2025</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, Noma</a>.</div></template>
<template data-pop="pareto-a69-s" data-title="Pareto — sciences fondamentales"><p class="ratio" data-cover="a69-s-1,a69-s-3,a69-s-4"></p><ul><li>Une tique <em>Ixodes</em> transmet les borrélies ; la réaction immédiate au point de piqûre diffère de la plaque expansive tardive.</li><li>Une réponse anticorps retardée explique pourquoi le premier érythème migrant peut rester séronégatif.</li><li>Les complications neurologiques, cardiaques et articulaires demandent un raisonnement d’organe ; la branche orale n’est pas transmise par la même piqûre.</li></ul><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Borréliose, 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Piqûre de tique, 2025</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, Noma</a>.</div></template>
<template data-pop="a69-e-detail" data-title="Érythème migrant : la clinique précède les anticorps"><div class="lab">Chronologie utile</div><p>La SSI décrit une plaque d’érythème migrant apparaissant typiquement 3 à 32 jours après la piqûre et dépassant 5 cm. Une réaction immédiate au point de piqûre est plus souvent toxique ou allergique. Dans la vignette, le délai et la taille sont compatibles ; l’aspect complet reste à examiner.</p><div class="lab">Limite du test</div><p>La sérologie peut être encore négative avant la séroconversion. La SSI ne la recommande pas pour confirmer un érythème migrant typique. Un examen cutané et l’interrogatoire sur la progression répondent à la question immédiate ; aucun résultat n’est fourni dans le cas.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, Maladie de Lyme », « Aspects importants » et « Diagnostic », validée le 02.05.2025</a>, consultée le 08.10.2026.</div></template>

<template data-pop="a69-e-serologie" data-title="Sérologie Lyme : exposition et contexte clinique"><div class="lab">Deux étapes si elle est indiquée</div><p>La SSI recommande un ELISA de dépistage suivi d’un immunoblot si le dépistage est positif, seulement pour étayer une présentation clinique évocatrice. Elle ne recommande pas de sérologie devant l’érythème migrant typique, après une piqûre sans symptôme ou pour suivre le traitement.</p><div class="lab">Ce qu’un résultat positif ne dit pas</div><p>Un résultat isolé peut témoigner d’une exposition ancienne sans maladie active ; il ne date pas l’infection. La SSI signale une réaction croisée possible avec la syphilis. La directive DGN 2025 rejoint cette limite et rappelle qu’une réponse anticorps précoce peut manquer.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Lyme, « Aspects importants » et « Diagnostic », 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener" data-reference-source="1">DGN et sociétés partenaires, directive neuroborréliose 2025, §3.3</a>. Consultées le 08.10.2026.</div></template>

<template data-pop="a69-e-neuro" data-title="Neuroborréliose : un indice se lit avec le liquide"><div class="lab">Indication conditionnelle</div><p>Le bilan de neuroborréliose part d’un syndrome neurologique évocateur. La SSI décrit pléiocytose lymphocytaire et production intrathécale d’anticorps ; la directive DGN 2025 demande sérum et liquide céphalorachidien prélevés ensemble, cytologie, protéines et calcul d’un indice spécifique qui tient compte de la barrière hémato-LCR.</p><div class="lab">Deux limites décisives</div><p>La PCR du liquide céphalorachidien manque de sensibilité : une négativité n’exclut pas la neuroborréliose. Un indice intrathécal positif peut persister après résolution et n’est ni une preuve isolée d’activité ni un marqueur de guérison. Aucun signe neurologique n’est documenté chez la personne fictive.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Lyme, « Diagnostic », rubrique « Neuroborreliose », 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener" data-reference-source="1">DGN, directive neuroborréliose 2025, §3.2–3.6 et §3.10</a>. Consultées le 08.10.2026.</div></template>

<template data-pop="a69-e-arthrite" data-title="Arthrite de Lyme : partir de l’articulation"><div class="lab">Tableau avant test</div><p>La SSI décrit surtout une monoarthrite de grande articulation, notamment le genou. Une suspicion articulaire clinique peut motiver la sérologie ; l’érythème migrant seul ne justifie pas de prélèvement articulaire. Aucune arthrite n’est décrite dans la vignette.</p><div class="lab">Prélèvement spécialisé</div><p>La SSI indique une sensibilité plus élevée de la PCR Borrelia sur biopsie synoviale que sur liquide synovial. Ce constat de méthode ne signifie pas qu’une biopsie est systématique : l’indication dépend de la question diagnostique et du contexte clinique.</p><div class="src"><a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, Lyme, « Aspects importants » et « Diagnostic », rubrique « Arthrite », 2025</a>, consultée le 08.10.2026.</div></template>

<template data-pop="a69-e-oral" data-title="Lésion orale nécrosante : une autre démarche"><div class="lab">Maladie parodontale</div><p>La Fédération européenne de parodontologie place la confirmation diagnostique selon les définitions cliniques de 2018 avant le traitement initial des affections parodontales aiguës nécrosantes. Le communiqué et le résumé de la directive S2k 2026 ont été consultés ; ils ne suffisent pas à attribuer un test microbiologique ou un traitement exact à toutes les lésions orales.</p><div class="lab">Noma</div><p>L’OMS décrit un diagnostic clinique selon les stades de progression et l’absence de test rapide. Le noma est une atteinte gangréneuse polymicrobienne de la bouche et du visage, surtout chez des enfants vulnérables ; il n’est pas déduit de la piqûre de tique de la vignette.</p><div class="src"><a href="https://www.efp.org/news-events/news/new-efp-clinical-practice-guideline-addresses-management-of-acute-periodontal-conditions/" target="_blank" rel="noopener" data-reference-source="1">EFP, communiqué du 18.09.2026</a> et <a href="https://doi.org/10.1111/jcpe.70166" target="_blank" rel="noopener" data-reference-source="1">résumé de la directive S2k 2026</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/noma" target="_blank" rel="noopener" data-reference-source="1">OMS, « Noma », « Diagnosis »</a>. Consultés le 08.10.2026.</div></template>

<template data-pop="a69-e-surveillance" data-title="Lyme : surveillance et déclaration ne se confondent pas"><div class="lab">Guide national 2026</div><p>La borréliose n’a pas de fiche de déclaration individuelle dans le Guide OFSP 2026 consulté. Cette constatation ne préjuge pas des règles sur les observations exceptionnelles ou des dispositions cantonales pertinentes.</p><div class="lab">Sentinella</div><p>Le réseau Sentinella recueille auprès de cabinets de premier recours des données sur les consultations pour piqûre de tique et les débuts de traitement d’une borréliose. Il estime une fréquence populationnelle ; ce dispositif ne transforme pas chaque érythème migrant en notification individuelle obligatoire.</p><div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de déclaration obligatoire 2026, liste intégrale</a> ; <a href="https://www.sentinella.ch/fr/subject" target="_blank" rel="noopener" data-reference-source="1">Sentinella, « Piqûre de tique et/ou traitement d’une borréliose de Lyme »</a>. Consultés le 08.10.2026.</div></template>
<template data-pop="a69-sc-histo" data-title="Histologie : appui diagnostique selon la lésion">
  <div class="lab">Peau précoce</div><p>L'érythème migrant peut montrer un infiltrat périvasculaire lymphocytaire, parfois plasmocytaire, sans spécificité suffisante. Une biopsie sert surtout à distinguer une présentation atypique d'autres dermatoses ; elle n'est pas requise pour la plaque typique.</p>
  <div class="lab">Lésions particulières</div><p>Le lymphocytome borrélien forme un infiltrat dermique dense, parfois difficile à distinguer d'un lymphome cutané B. L'acrodermatite chronique atrophiante associe des plasmocytes périvasculaires puis une atrophie des couches cutanées. Clinique, sérologie et, si besoin, recherche directe sur biopsie sont interprétées ensemble.</p>
  <div class="lab">Autre territoire</div><p>Dans la gingivite nécrosante, l'EFP décrit un ulcère de l'épithélium et du tissu conjonctif gingival superficiel, avec inflammation aiguë et zone nécrotique. Cette description histologique de la branche orale n'est pas une lésion de Lyme et ne prouve pas un noma.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.esgbor.org/lyme-borreliosis/laboratory-diagnosis-of-lyme-borreliosis/" target="_blank" rel="noopener noreferrer">ESGBOR/ESCMID, « Histology », ©2023</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12584192/fullTextXML" target="_blank" rel="noopener noreferrer">Directive dermatologique allemande 2025</a>, §§6.1.3, 6.3, 7.3.2, 7.3.4–7.3.5 ; <a data-reference-source="1" href="https://onlinelibrary.wiley.com/doi/10.1111/jcpe.12941" target="_blank" rel="noopener noreferrer">EFP, lésions parodontales aiguës, 20.06.2018</a>, §2.3. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a69-sc-physio" data-title="Le délai de transmission est variable">
  <div class="lab">Repas sanguin</div><p>La tique <i>I. ricinus</i> se nourrit pendant plusieurs jours. Chez une tique infectée, des borrélies s'activent dans l'intestin, rejoignent les glandes salivaires et peuvent parvenir à la peau. Leur transfert prend des heures selon l'espèce et les circonstances.</p>
  <div class="lab">Lecture du temps clinique</div><p>Retirer tôt la tique diminue l'exposition, sans instituer un seuil de sécurité absolue. Une réaction immédiate limitée est différente d'une plaque qui apparaît après quelques jours et continue à grandir. La durée d'attachement n'est pas connue dans la vignette.</p>
  <div class="lab">Branche buccale indépendante</div><p>La gingivite nécrosante touche d'abord les papilles interdentaires, avec douleur, saignement et nécrose. Le noma peut s'étendre de la gencive vers les tissus de la bouche et du visage dans un contexte de vulnérabilité majeure. L'OMS précise que la fraction de patients évoluant d'une étape à la suivante n'est pas connue ; le nom historique « Vincent » n'autorise aucune progression automatique vers le noma.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.ecdc.europa.eu/en/disease-vectors/facts/tick-factsheets/ixodes-ricinus" target="_blank" rel="noopener noreferrer">ECDC, <i>I. ricinus</i>, mise à jour 31.07.2014</a>, « Feeding process » ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12584192/fullTextXML" target="_blank" rel="noopener noreferrer">Directive dermatologique allemande 2025</a>, §§4 et 6.1.1 ; <a data-reference-source="1" href="https://onlinelibrary.wiley.com/doi/10.1111/jcpe.12941" target="_blank" rel="noopener noreferrer">EFP, lésions parodontales aiguës, 20.06.2018</a>, §§2.1–2.4 ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/d692510f-4f51-42d0-8fb4-4222abd258f3/content" target="_blank" rel="noopener noreferrer">OMS, note noma du 08.07.2026</a>, §2, p. 2. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a69-sc-micro" data-title="Une tique porteuse ne signifie pas une maladie humaine">
  <div class="lab">Chaîne complète</div><p>Le portage de <i>Borrelia burgdorferi</i> sensu lato chez la tique est une condition possible de transmission, pas une preuve que la bactérie a été inoculée. Même après inoculation, la maladie n'apparaît pas chez toutes les personnes. L'estimation suisse de tiques porteuses ne devient donc pas un risque individuel de Lyme.</p>
  <div class="lab">Périmètre</div><p>En Suisse, <i>I. ricinus</i> est la principale tique et l'OFSP rapporte 5 à 30 % de tiques porteuses de borrélies, jusqu'à 50 % localement. La maladie de Lyme n'est pas à déclaration obligatoire ; ses nombres annuels sont estimés, et non décomptés exhaustivement.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/fr/borreliose-maladie-de-lyme" target="_blank" rel="noopener noreferrer">OFSP, borréliose</a>, « Répartition géographique et fréquence » ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques-situation-en-suisse" target="_blank" rel="noopener noreferrer">OFSP, FAQ tiques</a>, portage et transmission ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques" target="_blank" rel="noopener noreferrer">OFSP, surveillance, « Borréliose »</a>. Pages consultées le 08.10.2026, date de révision non affichée.</p>
</template>
<template data-pop="a69-sc-oral" data-title="Branche orale : gingivite nécrosante et noma">
  <div class="lab">Gingivite nécrosante</div><p>Le groupe des lésions parodontales nécrosantes associe classiquement douleur, saignement et ulcération des papilles interdentaires. Le consensus européen décrit une flore plurielle comprenant des spirochètes et bactéries fusiformes, avec d'autres genres oraux ; la réponse immunitaire et les facteurs de l'hôte influencent gravité et progression. « Vincent » est une dénomination historique, pas le nom d'un agent causal unique démontré.</p>
  <div class="lab">Noma</div><p>L'OMS décrit une maladie gangréneuse opportuniste et polymicrobienne, surtout chez des enfants de 2 à 6 ans en situation de dénutrition et de privation extrême. Une gingivite peut évoluer vers œdème puis gangrène, mais la proportion franchissant chaque étape est inconnue. Rien n'établit qu'une gingivite dite « de Vincent » progresse systématiquement en noma, ni que le même microbe explique toutes ces lésions.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://onlinelibrary.wiley.com/doi/10.1111/jcpe.12941" target="_blank" rel="noopener noreferrer">EFP, Herrera et al., lésions parodontales aiguës, 20.06.2018</a>, §§2.1–2.4, texte intégral ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/d692510f-4f51-42d0-8fb4-4222abd258f3/content" target="_blank" rel="noopener noreferrer">OMS, <i>Noma control: technical brief</i>, 08.07.2026</a>, §2 « The disease and its epidemiology », p. 2/PDF 8, texte intégral téléchargé et lu le 08.10.2026.</p>
</template>
<template data-pop="a69-sc-immuno" data-title="La sérologie mesure la réponse de l'hôte">
  <div class="lab">Deux moments</div><p>La reconnaissance innée des lipoprotéines borréliennes accompagne l'inflammation cutanée. Les anticorps spécifiques apparaissent plus tard ; une sérologie peut donc être négative au début d'un érythème migrant. La SSI recommande de reconnaître ce tableau typique cliniquement.</p>
  <div class="lab">Après exposition</div><p>Des anticorps peuvent persister après une infection ancienne, et une sérologie positive isolée ne démontre pas une maladie active. L'immunité naturelle n'empêche pas toujours une réinfection. La pathogenèse des symptômes persistants après un traitement adéquat demeure inconnue selon la SSI.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener noreferrer">SSI, borréliose, validation 02.05.2025</a>, « Aspects importants », « Diagnostic », « Syndrome post-Lyme » ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12584192/fullTextXML" target="_blank" rel="noopener noreferrer">Directive dermatologique allemande 2025</a>, §5 ; <a data-reference-source="1" href="https://www.esgbor.org/lyme-borreliosis/laboratory-diagnosis-of-lyme-borreliosis/" target="_blank" rel="noopener noreferrer">ESGBOR/ESCMID, « Serology », ©2023</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="a69-sc-gene" data-title="Génoespèces : associations, pas équations">
  <div class="lab">Diversité européenne</div><p>Le complexe <i>B. burgdorferi</i> sensu lato comprend plusieurs génoespèces pathogènes en Europe. La directive allemande décrit une association forte de <i>B. afzelii</i> avec l'acrodermatite, de <i>B. garinii</i> et <i>B. bavariensis</i> avec les manifestations neurologiques, et de <i>B. burgdorferi</i> sensu stricto avec les articulations.</p>
  <div class="lab">Limite d'inférence</div><p>Plusieurs génoespèces peuvent provoquer un érythème migrant ; son apparence n'identifie pas la bactérie chez ce patient. La variation d'expression des protéines de surface selon le milieu participe à l'adaptation des borrélies, sans rendre une trajectoire d'organe prévisible pour une personne.</p>
  <p class="src">Source : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12584192/fullTextXML" target="_blank" rel="noopener noreferrer">Société allemande de dermatologie, directive cutanée 2025, texte intégral</a>, §§2 « Microbiology of the pathogen » et 5 « Pathogenesis », consultée le 08.10.2026. Les associations de génoespèces sont des observations de groupe.</p>
</template>
<template data-pop="a69-s-detail" data-title="Pourquoi la plaque s'étend après plusieurs jours">
  <div class="lab">De la tique à la peau</div><p>Lors du repas sanguin d'une tique infectée, les borrélies gagnent ses glandes salivaires puis la peau de l'hôte. Leur progression locale et la réaction inflammatoire cutanée produisent une plaque qui s'élargit après un délai libre. Cette chronologie diffère de la petite rougeur qui survient immédiatement au point de piqûre.</p>
  <div class="lab">Ce que l'observation permet</div><p>Une plaque apparue plusieurs jours après la piqûre et dépassant 5 cm concorde avec un érythème migrant probable. Elle ne révèle pas la génoespèce responsable, le temps d'attachement exact ni une atteinte d'autres organes. Une dissémination ultérieure vers d'autres sites cutanés, le système nerveux, les articulations ou le cœur demeure possible, mais n'est pas établie dans le cas. La SSI indique que la sérologie précoce est souvent négative et n'est pas indiquée pour un érythème migrant typique.</p>
  <p class="src">Sources : <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener noreferrer">SSI, borréliose, validation 02.05.2025</a>, « Aspects importants », « Diagnostic / Peau » et « Manifestations » ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12584192/fullTextXML" target="_blank" rel="noopener noreferrer">Directive dermatologique allemande 2025</a>, §§4, 6.1.1, 7.3.1. Consultées le 08.10.2026.</p>
</template>
