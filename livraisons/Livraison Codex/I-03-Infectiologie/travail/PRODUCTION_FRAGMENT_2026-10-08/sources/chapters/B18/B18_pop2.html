<template data-pop="b18-sinusoide" data-title="Sinusoïde hépatique : le sang rencontre les cellules du foie">
  <div class="lab">Structure normale</div><p>Le sinusoïde est un capillaire spécialisé situé entre les travées d’hépatocytes. Son endothélium facilite les échanges avec l’espace de Disse. Les macrophages de Kupffer surveillent sa lumière ; les cellules stellaires se trouvent dans le compartiment périsinusoïdal.</p>
  <div class="lab">Conséquence</div><p>La circulation expose le foie aux antigènes et aux cellules immunitaires. Une biopsie observée en trois dimensions montre cette proximité ; elle ne prouve pas que tous les hépatocytes d’une personne porteuse du VHB soient infectés. La fonction d’échange et l’architecture fibreuse doivent être évaluées séparément.</p>
  <p class="refs"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7925637/" target="_blank" rel="noopener">Imagerie tridimensionnelle primaire de biopsies hépatiques humaines, 2021</a>, consultée le 08.10.2026.</p>
</template>
<template data-pop="b18-alt-fonction" data-title="ALT, albumine et bilirubine : trois questions différentes">
  <div class="lab">Lésion</div><p>L’alanine aminotransférase, ou ALT, est une enzyme contenue dans les hépatocytes. Son augmentation sanguine signale une libération cellulaire, sans mesurer directement le nombre de virions ni la fibrose accumulée. Une valeur varie dans le temps et d’autres maladies peuvent l’élever.</p>
  <div class="lab">Fonction et limites</div><p>L’albumine et les facteurs de coagulation reflètent notamment la synthèse hépatique ; la bilirubine renseigne aussi son transport et son excrétion. Nutrition, inflammation, hémolyse, médicaments ou anticoagulants peuvent modifier ces résultats. La fonction de Mme R. ne peut pas être déclarée normale puisque ses valeurs n’ont pas été fournies.</p>
  <p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener">EASL, Clinical Practice Guidelines VHB 2025, évaluation initiale</a>, texte intégral consulté le 08.10.2026. Les intervalles de référence dépendent du laboratoire.</p>
</template>
<template data-pop="b18-kupffer" data-title="Cellules de Kupffer et autres sentinelles du foie">
  <div class="lab">Rôle</div><p>Les cellules de Kupffer sont des macrophages résidents du foie. Elles participent à la surveillance et à l’élimination de particules dans le compartiment sinusoïdal. Les lymphocytes et plusieurs autres populations immunitaires coopèrent avec elles ; une seule population n’explique pas toute l’hépatite chronique.</p>
  <div class="lab">Portée de la preuve</div><p>L’atlas de MacParland décrit des profils de cellules provenant de cinq foies humains. Il confirme la diversité cellulaire, mais ne mesure ni la fonction des cellules de Mme R. ni son stade inflammatoire. Un biomarqueur expérimental de macrophage ne remplace pas le bilan clinique.</p>
  <p class="refs"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6197289/" target="_blank" rel="noopener">MacParland et coll., Nature Communications 2018, étude primaire unicellulaire humaine</a>, consultée le 08.10.2026.</p>
</template>
<template data-pop="b18-stellaire" data-title="Cellule stellaire : de la réparation à la matrice fibreuse">
  <div class="lab">Fonction normale</div><p>Les cellules stellaires résident dans l’espace périsinusoïdal. Elles participent à l’équilibre de la matrice. Une agression persistante peut les activer et accroître leur production de composants fibreux, dont le collagène.</p>
  <div class="lab">Ce qui change</div><p>L’accumulation de matrice modifie les échanges et l’architecture hépatique. L’infection virale est une cause possible d’agression répétée, mais alcool, maladie métabolique et autres causes peuvent coexister. L’activation cellulaire ne se déduit pas d’un seul chiffre d’ALT.</p>
  <p class="refs"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7925637/" target="_blank" rel="noopener">Imagerie primaire du microenvironnement hépatique humain, 2021</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener">EASL VHB 2025, évaluation de la fibrose</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="b18-fibrose" data-title="Fibrose : une histoire cumulée que l’ALT ponctuelle ne raconte pas">
  <div class="lab">Mécanisme</div><p>La réparation répétée dépose de la matrice extracellulaire. Lorsque le réseau fibreux devient important, il modifie l’architecture du foie et peut précéder la cirrhose. La fibrose représente une conséquence tissulaire accumulée ; une ALT prise aujourd’hui décrit plutôt une cytolyse mesurable à ce moment.</p>
  <div class="lab">Mesure et limites</div><p>L’élastographie et les indices sanguins peuvent aider à estimer le stade. L’inflammation, la technique et la population modifient leurs performances. Une discordance entre mesures demande une interprétation spécialisée, parfois d’autres examens. Chez Mme R., aucun stade ne peut être inféré des seuls deux résultats d’Ag HBs.</p>
  <p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener">EASL VHB 2025, sections évaluation de la maladie et fibrose</a>, consultées le 08.10.2026.</p>
</template>
<template data-pop="b18-chc" data-title="Carcinome hépatocellulaire : risque lié au terrain et au virus">
  <div class="lab">Voies de risque</div><p>Une cirrhose multiplie le renouvellement et les altérations tissulaires. Le VHB possède aussi des voies possibles indépendantes de la cirrhose, notamment l’intégration de fragments d’ADN viral et l’expansion clonale de cellules hépatiques. Leur présence biologique n’annonce pas un cancer individuel.</p>
  <div class="lab">Décision</div><p>La surveillance dépend du risque global, de la fibrose et du contexte personnel selon les recommandations applicables. Une ALT normale, un ADN VHB supprimé ou un Ag HBs encore positif ne suffisent seuls ni à la déclencher ni à l’écarter. Le stade et les autres facteurs de Mme R. restent inconnus.</p>
  <p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener">EASL VHB 2025, section surveillance du carcinome hépatocellulaire</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9473722/" target="_blank" rel="noopener">Grudda et coll., JCI 2022, étude de l’ADN intégré</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="b18-cccdna" data-title="cccDNA : matrice nucléaire du VHB">
  <div class="lab">Formation</div><p>L’ADN viral entrant est réparé dans le noyau en un cercle fermé, appelé cccDNA. Cette matrice produit les ARN du VHB, dont l’ARN prégénomique qui sera rétrotranscrit dans la capside. Le cccDNA est distinct de l’ADN VHB mesuré dans le plasma.</p>
  <div class="lab">Traitement et limite</div><p>Les analogues nucléos(t)idiques inhibent la synthèse de nouvel ADN viral, mais ne détruisent pas directement la matrice cccDNA existante. La suppression de l’ADN sanguin n’est donc pas une preuve de disparition du virus dans tous les hépatocytes. Une mesure de recherche du cccDNA ne fait pas partie du bilan sanguin ordinaire de Mme R.</p>
  <p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener">EASL VHB 2025, cycle viral et limites des analogues</a>, texte intégral consulté le 08.10.2026.</p>
</template>
<template data-pop="b18-integration" data-title="ADN intégré du VHB : antigène possible sans virion complet">
  <div class="lab">Sens biologique</div><p>Des fragments d’ADN VHB peuvent entrer dans le génome de l’hépatocyte. Certains conservent la capacité de produire des transcrits de l’antigène de surface. Ils ne constituent pas pour autant une matrice complète de réplication virale comme le cccDNA.</p>
  <div class="lab">Ce que la sérologie ne distingue pas</div><p>Une Ag HBs positive peut refléter plusieurs sources de production. Dans des biopsies de recherche sous traitement, Grudda et collaborateurs ont montré une contribution importante des fragments intégrés. Ce résultat collectif ne permet pas d’attribuer l’Ag HBs de Mme R. à une source donnée ni de prédire son risque tumoral personnel.</p>
  <p class="refs"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9473722/" target="_blank" rel="noopener">Grudda et coll., JCI 2022, étude primaire</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11910228/" target="_blank" rel="noopener">étude JCI 2025, évolution de la source des transcrits sous traitement</a>. Consultées le 08.10.2026.</p>
</template>
<template data-pop="b18-hbv-pol" data-title="Polymérase du VHB : la cible de la suppression de l’ADN">
  <div class="lab">Étape du cycle</div><p>La polymérase virale rétrotranscrit l’ARN prégénomique en ADN à l’intérieur de la capside. Les analogues nucléos(t)idiques actifs gênent cette synthèse. Leur effet se lit surtout sur l’ADN VHB circulant ; l’Ag HBs peut persister parce que ses sources cellulaires ne sont pas toutes supprimées.</p>
  <div class="lab">Limite clinique</div><p>Un mécanisme pharmacologique ne suffit pas à choisir un traitement. L’indication dépend notamment de la fibrose, de l’ADN, de l’ALT et du contexte ; les précautions dépendent du médicament. Ces données manquent encore pour Mme R.</p>
  <p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener">EASL VHB 2025, sections objectifs, indications et analogues nucléos(t)idiques</a>, consultées le 08.10.2026. Les prescriptions suisses sont détaillées dans l’onglet Pharmacologie.</p>
</template>
<template data-pop="b18-hcv-arn" data-title="ARN VHC : établir une infection active">
  <div class="lab">Mesure</div><p>L’amplification d’acides nucléiques recherche l’ARN du VHC dans le sang. Un résultat détectable soutient une infection active ; les anticorps anti-VHC seuls signalent une exposition et peuvent rester positifs après disparition du virus.</p>
  <div class="lab">Limites</div><p>Le laboratoire précise sa limite de détection, la matrice et ses unités. Un prélèvement trop précoce, une erreur préanalytique ou une exposition ultérieure justifient une réévaluation selon le contexte. Le VHB chronique connu de Mme R. ne permet pas de prédire son résultat VHC.</p>
  <p class="refs"><a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener">EASL, recommandations VHC 2020, diagnostic virologique</a>, consultées le 08.10.2026 ; les modalités locales du laboratoire restent applicables.</p>
</template>
<template data-pop="b18-hcv-cibles" data-title="NS3/4A, NS5A et NS5B : trois fonctions à bloquer">
  <div class="lab">Cycle du VHC</div><p>NS3/4A coupe la polyprotéine, NS5A contribue à l’organisation du complexe de réplication et NS5B copie l’ARN viral. Les antiviraux directs perturbent ces fonctions par classes différentes. Une association de classes accroît les chances de contrôler aussi des variants moins sensibles à une seule cible.</p>
  <div class="lab">Application et piège</div><p>Les noms des cibles ne suffisent ni à choisir une association ni à fixer une durée. La cirrhose, les traitements reçus, les interactions et les monographies suisses doivent être examinés. Aucun VHC actif n’a été démontré chez Mme R.</p>
  <p class="refs"><a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener">EASL, recommandations VHC 2020, antiviraux directs et bilan préalable</a>, consultées le 08.10.2026. Les schémas à jour et disponibles localement relèvent de l’onglet Pharmacologie.</p>
</template>
<template data-pop="b18-hdv" data-title="VHD : l’enveloppe HBs est nécessaire, l’ADN VHB élevé ne l’est pas">
  <div class="lab">Dépendance</div><p>Le VHD possède son propre ARN, mais emprunte les protéines de surface du VHB pour former son enveloppe. Sa réplication et la mesure de l’ADN VHB ne sont pas équivalentes. Une charge VHB basse n’exclut donc pas un VHD actif.</p>
  <div class="lab">Chaîne diagnostique</div><p>L’EASL 2023 recommande de rechercher les anticorps anti-VHD au moins une fois chez chaque personne Ag HBs positive. Un résultat positif est suivi de l’ARN VHD pour établir l’infection active. Aucun de ces deux résultats n’est connu chez Mme R.</p>
  <p class="refs"><a href="https://easlcampus.eu/sites/default/files/2024-05/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener">EASL, Clinical Practice Guidelines on hepatitis delta virus, 2023</a>, sections cycle et dépistage consultées le 08.10.2026.</p>
</template>
<template data-pop="b18-hev" data-title="VHE chronique : définition par l’ARN dans le bon contexte">
  <div class="lab">Population</div><p>Le VHE est généralement éliminé après une infection aiguë. Une réplication prolongée est décrite surtout après transplantation et dans d’autres états d’immunodépression. L’EASL 2018 rappelle une définition historique à six mois. Chez les greffés d’organe, elle permet de considérer l’infection chronique dès plus de trois mois de virémie, tout en signalant de rares clairances entre trois et six mois.</p>
  <div class="lab">Examen et limite</div><p>Une réponse anticorps faible sous immunosuppression peut rendre la sérologie insuffisante. L’ARN VHE répond directement à la question de la réplication. Aucun facteur d’immunodépression ni résultat de VHE n’est fourni pour Mme R. : son Ag HBs positif ne permet pas de conclure à un VHE.</p>
  <p class="refs"><a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener">EASL, Clinical Practice Guidelines on hepatitis E virus infection, 2018</a>, sections diagnostic et immunodépression consultées le 08.10.2026.</p>
</template>
<template data-pop="b18-pareto-sciences" data-title="Pareto — Sciences fondamentales de B18, hépatite virale chronique">
  <p>Quelques distinctions organisent la lecture de tous les examens sans remplacer le bilan individuel.</p>
  <ul><li>L’Ag HBs présent plus de six mois établit la chronicité du VHB, pas son activité ni la fibrose.</li><li>L’ADN VHB mesure la réplication circulante ; ALT, évaluation de la fibrose et fonction hépatique décrivent d’autres dimensions.</li><li>Le cccDNA nucléaire soutient la réplication ; l’ADN intégré peut entretenir la production d’Ag HBs.</li><li>Pour le VHC, un anti-VHC positif demande un ARN pour établir une infection active.</li><li>Une personne Ag HBs positive doit être évaluée pour le VHD ; l’anti-VHD positif appelle la recherche d’ARN VHD.</li><li>Le VHE chronique relève surtout d’un contexte immunodéprimé avec ARN persistant, et ne se déduit pas du VHB.</li></ul>
  <div class="key"><b>Application.</b> Chez Mme R., seules la persistance de l’Ag HBs et la chronicité du VHB sont documentées. Les autres résultats doivent être obtenus avant d’attribuer une phase, un pronostic ou un traitement.</div>
  <p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener">EASL VHB 2025</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener">EASL VHC 2020</a> ; <a href="https://easlcampus.eu/sites/default/files/2024-05/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener">EASL VHD 2023</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener">EASL VHE 2018</a>. Consultées le 08.10.2026.</p>
</template>
