<template data-pop="b18-s-sinusoide" data-title="Sinusoïde hépatique : un capillaire perméable">
<p>Les sinusoïdes sont les capillaires du foie ; leur diamètre est de 5 à 10 µm. Leur endothélium est fenêtré : des pores de 100 à 150 nm de diamètre le traversent, regroupés en cribles, et aucune membrane basale ne le double. En microscopie à super-résolution, les pores de l’endothélium humain mesurent surtout 110 à 120 nm.</p>
<p>Cette perméabilité met le plasma au contact direct des hépatocytes, à travers l’espace de Disse. Elle explique que les virus, les médicaments et les protéines plasmatiques atteignent l’hépatocyte sans franchir de barrière continue.</p>
<p>Source : <a href="https://doi.org/10.3389/fphys.2021.637136" target="_blank" rel="noopener" data-reference-source="1">Kong et coll., Frontiers in Physiology 2021</a>.</p>
</template>

<template data-pop="b18-s-metavir" data-title="Stades Metavir de la fibrose">
<p>Le score Metavir classe la fibrose histologique en cinq stades, de l’absence de fibrose jusqu’à la cirrhose (F4). Les recommandations de l’EASL utilisent trois repères :</p>
<div class="table-wrap"><table class="t"><thead><tr><th>Stade</th><th>Nom</th><th>Conséquence</th></tr></thead><tbody>
<tr><td>F2</td><td>Fibrose significative</td><td>Traitement urgent du VHC</td></tr>
<tr><td>F3</td><td>Fibrose avancée, « en pont »</td><td>Surveillance du carcinome discutée après guérison du VHC</td></tr>
<tr><td>F4</td><td>Cirrhose</td><td>Surveillance du carcinome et des varices</td></tr>
</tbody></table></div>
<p>Le stade se mesure aujourd’hui surtout par élastographie, dont chaque seuil correspond approximativement à un stade. Le tableau se lit avec une prudence : une valeur d’élastographie n’est pas une histologie, et ses seuils varient selon le virus et l’appareil.</p>
<p>Sources : <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableau 6</a>.</p>
</template>

<template data-pop="b18-s-kupffer" data-title="Cellules de Kupffer : deux populations de macrophages">
<p>Les cellules de Kupffer sont les macrophages résidents du foie ; elles siègent du côté de la lumière des sinusoïdes. L’atlas unicellulaire de MacParland et collaborateurs (8444 cellules issues de cinq foies de donneurs, 20 populations) y distingue deux populations : l’une exprime des gènes inflammatoires, l’autre des gènes de tolérance. La seconde, surtout périportale, sécrète moins de facteur de nécrose tumorale après stimulation.</p>
<p>Cet équilibre aide à comprendre pourquoi le foie tolère longtemps une infection chronique avant que l’inflammation ne s’installe. L’atlas décrit des populations ; il ne mesure ni leur fréquence réelle ni leur rôle dans une hépatite donnée.</p>
<p>Source : <a href="https://doi.org/10.1038/s41467-018-06318-7" target="_blank" rel="noopener" data-reference-source="1">MacParland et coll., Nature Communications 2018</a>.</p>
</template>

<template data-pop="b18-s-stellaire" data-title="Cellule étoilée : de la vitamine A au collagène">
<p><b>Normal.</b> Au repos, la cellule étoilée siège dans l’espace de Disse et stocke la vitamine A.</p>
<p><b>Activation.</b> Une lésion hépatique chronique, virale, alcoolique ou métabolique, la transforme en myofibroblaste prolifératif et fibrogène. Ce changement est le moteur central de la fibrose : la matrice extracellulaire s’accumule. Les macrophages, les hépatocytes, les cellules endothéliales, les lymphocytes NK et les plaquettes modulent cette activation.</p>
<p><b>Réversibilité.</b> Les cellules activées disparaissent par apoptose, sénescence ou retour à l’état quiescent. C’est le substrat de la régression de la fibrose quand la cause est supprimée.</p>
<p>Source : <a href="https://doi.org/10.1038/nrgastro.2017.38" target="_blank" rel="noopener" data-reference-source="1">Tsuchida et Friedman, 2017</a>.</p>
</template>

<template data-pop="b18-s-ntcp" data-title="NTCP : transporteur des acides biliaires et récepteur viral">
<p>Le NTCP capte les acides biliaires à la membrane de l’hépatocyte. Le VHB et le VHD s’y fixent par une région spécifique de la grande protéine d’enveloppe du VHB, ce qui fait du transporteur leur récepteur d’entrée.</p>
<p>Le bulévirtide, lipopeptide synthétique de 47 acides aminés reproduisant cette région, occupe le récepteur. Il bloque l’entrée virale et, du même coup, la captation des acides biliaires : leur concentration monte de façon transitoire, généralement sans symptôme. La dose de 2 mg ne sature pas le transporteur, ce qui est l’une des raisons de son choix.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a>.</p>
</template>

<template data-pop="b18-s-taf" data-title="Ténofovir alafénamide : un promédicament ciblé sur l’hépatocyte">
<p>Le ténofovir alafénamide pénètre dans l’hépatocyte par diffusion passive et par les transporteurs OATP. Il y est hydrolysé, surtout par la carboxylestérase 1, en ténofovir, puis phosphorylé en ténofovir diphosphate actif.</p>
<p>Cette activation intracellulaire permet une dose de 25 mg, contre 245 mg pour le ténofovir disoproxil, et réduit l’exposition du rein et de l’os au ténofovir plasmatique. L’EASL observe une moindre baisse du débit de filtration et de la densité osseuse après 96 semaines. En contrepartie, le ténofovir alafénamide élève davantage les lipides.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66190" target="_blank" rel="noopener" data-reference-source="1">Vemlidy®, février 2024</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-s-reactivation" data-title="Réactivation du VHB : définition et mécanisme">
<p><b>Définition.</b> Hausse brutale de la réplication chez une personne Ag HBs positive peu active, ou chez une personne Ag HBs négative et anti-HBc positive dont l’infection était résolue. Elle se reconnaît à la réapparition de l’ADN (au-delà de 100 UI/mL) ou de l’Ag HBs.</p>
<p><b>Mécanisme.</b> L’ADNccc persiste dans le noyau ; l’immunité le maintient silencieux. Une perte naturelle ou médicamenteuse de ce contrôle libère la réplication. L’hépatite qui suit peut être grave, voire mortelle.</p>
<p><b>Prévention.</b> Ag HBs et anti-HBc avant toute immunosuppression ; analogue (entécavir ou ténofovir) si le risque est élevé, poursuivi au moins 6 à 12 mois après la fin de l’immunosuppression, au moins 18 mois après un traitement détruisant les lymphocytes B.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableau 14</a>.</p>
</template>

<template data-pop="b18-s-ifn" data-title="Interféron pégylé : une action immunitaire et antivirale">
<p>L’interféron pégylé α stimule les lymphocytes NK, T et B. Cette activation a des effets cytolytiques et non cytolytiques. Il agit aussi directement sur plusieurs étapes du cycle : stabilité et traduction des ARN viraux, encapsidation, transcription inverse et activité transcriptionnelle de l’ADNccc, par un silence épigénétique.</p>
<p>Ce double mécanisme explique qu’un traitement de 48 semaines obtienne plus souvent qu’un analogue, à durée égale, une séroconversion HBe et une perte de l’Ag HBs. Dans l’hépatite D, il freine aussi la propagation du virus lors des divisions cellulaires, ce qui justifie son association au bulévirtide dans les essais.</p>
<p>Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a> ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2023</a>.</p>
</template>

<template data-pop="b18-s-adnccc" data-title="ADNccc : la matrice persistante du VHB">
<p>L’ADN circulaire clos de façon covalente se forme dans le noyau à partir du génome viral entrant. Il sert de modèle à tous les ARN viraux, dont l’ARN prégénomique.</p>
<p>Les analogues ne l’atteignent pas directement. Sa quantité ne baisse que modestement sous traitement prolongé, par diminution des nouvelles infections et par dilution lors des divisions cellulaires. Il persiste même après la perte de l’Ag HBs, ce qui explique la possibilité d’une réactivation et d’une réapparition de l’antigène.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-s-polymerase" data-title="Polymérase du VHB : la cible des analogues">
<p>La polymérase du VHB est une transcriptase inverse : elle recopie l’ARN prégénomique en ADN circulaire relâché. L’entécavir triphosphate, analogue de la guanosine, inhibe ses trois fonctions : amorçage, synthèse du brin négatif, synthèse du brin positif. Il n’inhibe que faiblement les polymérases humaines.</p>
<p>Le ténofovir diphosphate, analogue de l’adénosine monophosphate, s’incorpore dans l’ADN viral et arrête l’élongation de la chaîne. La barrière génétique de ces deux molécules est élevée : aucune résistance au ténofovir n’a été observée après cinq ans, 1,2 % pour l’entécavir chez le patient naïf.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Baraclude®</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66190" target="_blank" rel="noopener" data-reference-source="1">Vemlidy®</a> ; <a href="https://doi.org/10.1172/JCI161818" target="_blank" rel="noopener" data-reference-source="1">Grudda 2022</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-s-integration" data-title="ADN intégré du VHB : antigène sans virion">
<p>Des fragments d’ADN du VHB s’intègrent au génome de l’hépatocyte. Ils peuvent produire en abondance les ARN de l’Ag HBs sans former de virion complet.</p>
<p>Grudda et collaborateurs ont étudié des biopsies de 16 personnes sous analogue : quatre seulement ont vu leur Ag HBs baisser de plus de 0,5 log₁₀ ; chez les autres, l’antigène provenait surtout de l’ADN intégré. Chez une personne Ag HBe négative étudiée cellule par cellule, 50 à 63 % des cellules actives transcrivaient surtout à partir de l’ADN intégré.</p>
<p>L’intégration participe aussi à la cancérogenèse ; un traitement efficace réduit le nombre d’intégrations et l’expansion clonale des hépatocytes.</p>
<p>Sources : <a href="https://doi.org/10.1172/JCI161818" target="_blank" rel="noopener" data-reference-source="1">Grudda et coll., 2022</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-s-vhd" data-title="Cycle du VHD : un virus sans enzyme">
<p>Le virion du VHD se fixe aux protéoglycanes de surface, puis au NTCP. Son complexe ribonucléoprotéique gagne le noyau. L’ARN polymérase II de la cellule copie le génome circulaire selon un mécanisme en cercle roulant ; le ribozyme de l’ARN viral clive les copies, qui sont ensuite refermées en cercles.</p>
<p>Une adénosine désaminase cellulaire modifie une partie des copies : elle produit la grande forme de l’antigène delta, qui arrête la réplication et favorise l’assemblage. Le virion s’entoure enfin d’une enveloppe portant les trois protéines de surface du VHB.</p>
<p>Le VHD ne code aucune enzyme : les antiviraux classiques n’ont pas de cible. Il peut aussi persister en l’absence de réplication du virus B et se propager lors des divisions des hépatocytes infectés.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2023, figure 1</a>.</p>
</template>

<template data-pop="b18-s-vhc-cibles" data-title="Antiviraux directs du VHC : trois cibles">
<div class="table-wrap"><table class="t"><thead><tr><th>Cible</th><th>Fonction</th><th>Molécules</th></tr></thead><tbody>
<tr><td>Protéase NS3/4A</td><td>Clive la polyprotéine en protéines matures</td><td>Glécaprévir, voxilaprévir</td></tr>
<tr><td>NS5A</td><td>Réplication de l’ARN et assemblage</td><td>Velpatasvir, pibrentasvir</td></tr>
<tr><td>Polymérase NS5B</td><td>Copie l’ARN viral</td><td>Sofosbuvir</td></tr>
</tbody></table></div>
<p>Le sofosbuvir est un promédicament nucléotidique : son métabolite actif, analogue de l’uridine triphosphate, est incorporé dans l’ARN viral et termine la chaîne. Les associations fixes visent deux cibles à la fois ; la SASL relève des taux de guérison supérieurs à 95 % pour tous les génotypes avec le sofosbuvir et le velpatasvir.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66095" target="_blank" rel="noopener" data-reference-source="1">Epclusa®</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66472" target="_blank" rel="noopener" data-reference-source="1">Maviret®</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a>.</p>
</template>

<template data-pop="b18-s-vhe" data-title="Ribavirine et VHE : un mécanisme encore discuté">
<p>L’hypothèse principale est une déplétion du réservoir cellulaire de guanosine triphosphate, nécessaire à la réplication virale. L’acide mycophénolique, qui réduit lui aussi cette production, a un effet synergique avec la ribavirine in vitro, sans bénéfice démontré in vivo.</p>
<p>La ribavirine accroît la diversité génétique du virus ; une mutation de la polymérase a été décrite lors d’échecs, sans valeur prédictive établie. Le sofosbuvir agit sur le VHE in vitro ; son efficacité clinique reste inconnue.</p>
<p>Source : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a>.</p>
</template>

<template data-pop="b18-s-pareto" data-title="Loi de Pareto — Sciences fondamentales">
<p class="ratio" data-cover="b18-s-1,b18-s-2,b18-s-3,b18-s-4,b18-s-5"></p>
<ul>
<li>Sang : espace porte → sinusoïde → veine centrale ; bile en sens inverse. Pont fibreux entre espaces portes = F3.</li>
<li>Cellule étoilée activée → myofibroblaste → fibrose réversible si la cause disparaît.</li>
<li>Albumine, INR, bilirubine = synthèse ; ALAT = inflammation.</li>
<li>NTCP : récepteur du VHB et du VHD, transporteur des acides biliaires, cible du bulévirtide.</li>
<li>Entécavir et ténofovir disoproxil éliminés par le rein ; ténofovir alafénamide activé dans l’hépatocyte.</li>
<li>Immunosuppression → perte du contrôle de l’ADNccc → réactivation ; risque élevé si les lymphocytes B sont détruits.</li>
<li>VHB : ADNccc nucléaire et ADN intégré → contrôle sans guérison. VHC : ARN cytoplasmique → guérison.</li>
<li>VHD : ribozyme sans enzyme, enveloppe du VHB.</li>
</ul>
</template>
