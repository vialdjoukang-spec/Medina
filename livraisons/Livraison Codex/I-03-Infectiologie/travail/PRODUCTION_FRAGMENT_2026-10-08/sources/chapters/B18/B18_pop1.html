<template data-pop="b18-examens" data-title="Loi de Pareto — Examens de l’hépatite virale chronique">
<div class="lab">Les premières décisions</div><p>Chez une personne Ag HBs positive depuis plus de six mois, le bilan détermine la réplication par l’ADN VHB, l’atteinte hépatique par ALT et évaluation de la fibrose, puis les co-infections et le risque de cancer. Ces quatre questions organisent les prélèvements et l’imagerie. Le mot « Pareto » désigne ici une priorité pédagogique ; aucune proportion chiffrée de bénéfice ne lui est attribuée.</p>
<div class="lab">Mme R.</div><p>Seule la chronicité du VHB est documentée. Les résultats d’ADN, d’ALT, de fibrose, d’anti-VHD et d’anti-VHC ne sont pas encore connus. Le premier rendez-vous doit aussi fixer qui relira ces résultats et à quelle date.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, diagnostic et bilan initial</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-triple" data-title="Ag HBs, anti-HBs, anti-HBc : trois marqueurs, trois questions">
<div class="lab">Lecture du profil</div><p>L’Ag HBs marque l’infection actuelle et sa persistance pendant plus de six mois définit la chronicité. L’anti-HBc apparaît après toute rencontre avec le VHB et signe une infection passée ou actuelle ; il ne dit pas à lui seul si l’infection est en cours ou guérie. L’anti-HBs traduit une immunité naturelle ou vaccinale ; l’EASL le juge inutile au dépistage, qui repose sur l’Ag HBs et l’anti-HBc.</p>
<div class="lab">Limite pratique</div><p>Une personne Ag HBs négative et anti-HBc positive peut réactiver le virus sous immunosuppression ; l’EASL signale aussi un risque accru de carcinome hépatocellulaire en cas d’anti-HBc isolé avec maladie hépatique chronique. Chez Mme R., le statut Ag HBs est connu, mais les deux autres marqueurs ne sont pas indiqués. Aucun profil complet ne doit être imaginé.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, dépistage et tableau 5</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-hbc-igm" data-title="Anti-HBc IgM : infection récente ou poussée">
<div class="lab">Sens du marqueur</div><p>L’anti-HBc de classe IgM est présent à forte concentration dans l’hépatite B aiguë et disparaît habituellement en six mois. Des concentrations plus faibles se rencontrent aussi dans l’infection chronique et ses poussées ; seule une concentration élevée, idéalement quantifiée, oriente vers une infection aiguë.</p>
<div class="lab">Application</div><p>Les deux Ag HBs de Mme R. espacés de plus de six mois attestent une persistance. Si une hépatite aiguë survient, le médecin confronte l’IgM à ces résultats antérieurs, aux ALT et au contexte avant de parler d’une nouvelle infection.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, diagnostic (anti-HBc IgM)</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-dna" data-title="ADN VHB : virémie mesurée, décision contextualisée">
<div class="lab">Ce que mesure le laboratoire</div><p>Un test d’acide nucléique, le plus souvent une PCR en temps réel, mesure l’ADN du VHB ; l’EASL en fait l’examen de référence pronostique, avec une limite de détection de 10 à 20 UI/mL pour la plupart des tests. Le compte rendu quantitatif s’exprime en UI/mL, avec une limite de détection et de quantification propres à la méthode. Une valeur « non détectée » ne prouve pas l’éradication des formes persistantes du virus dans le foie.</p>
<div class="lab">Lecture longitudinale</div><p>La mesure aide à choisir une prise en charge et à suivre l’effet d’un traitement. Les recommandations associent ADN VHB, ALT et état du foie ; un seul résultat viral ne classe pas toute la trajectoire. Chez Mme R., aucune valeur d’ADN n’est fournie.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tableau 5</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-alt" data-title="ALT : lésion cellulaire et évolution dans le temps">
<div class="lab">Mécanisme</div><p>L’ALT passe dans le sang lorsque des hépatocytes sont lésés. Sa hausse peut accompagner une activité inflammatoire liée au VHB, mais d’autres causes hépatiques et extra-hépatiques sont possibles. Une ALT dans la référence à une date ne démontre ni absence de fibrose, ni activité virale nulle.</p>
<div class="lab">Conséquence</div><p>L’EASL fonde la phase sur des mesures répétées d’ALT et d’ADN : tous les 3 à 6 mois la première année après le diagnostic, puis tous les 6 à 12 mois. Le laboratoire fournit son unité et sa plage de référence ; les seuils de décision des recommandations ont leur propre contexte. Mme R. n’a pas de résultat d’ALT fourni.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tableau 4 et suivi</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-hbe" data-title="Ag HBe et anti-HBe : préciser la phase, sans la deviner">
<div class="lab">Interprétation</div><p>L’Ag HBe et l’anti-HBe aident à décrire l’état virologique. Le VHB peut toutefois se répliquer et provoquer une hépatite chez une personne Ag HBe négative. Le tableau EASL 2025 croise HBeAg, ADN VHB, ALT et activité hépatique pour décrire les phases.</p>
<div class="lab">Limite</div><p>Les phases évoluent et certains résultats se situent entre deux profils. Un seul dosage ne justifie pas d’écrire « portage inactif » si l’ADN, les ALT répétés et la fibrose sont inconnus. Aucun résultat HBe n’est attribué à Mme R.</p>
<p class="refs"><a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, Clinical Practice Guidelines VHB, mai 2025, tableau 4 et sections Diagnosis</a>, lues le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-fibrose" data-title="Fibrose : APRI et élastographie répondent à une question de stade">
<div class="lab">Méthodes</div><p>L’APRI combine l’AST et les plaquettes. L’élastographie transitoire mesure la rigidité du foie, qui sert d’indicateur indirect de fibrose. Ces résultats s’ajoutent à l’examen clinique, à la biologie et à l’imagerie pour repérer une maladie avancée.</p>
<div class="lab">Pièges</div><p>Une poussée d’hépatite peut rendre la rigidité artificiellement élevée ; l’obésité et la qualité technique influencent aussi la mesure. L’EASL retient en élastographie transitoire plus de 7, 8 et 11 kPa pour fibrose significative, avancée et cirrhose, avec une sensibilité et une spécificité de 69 à 89 % ; ces seuils ne valent pas automatiquement pour une autre technique. Un score ne doit pas être traduit directement en histologie certaine chez Mme R., dont la fibrose n’a pas été mesurée.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, bilan initial et tableau 6</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-echo" data-title="Échographie : morphologie, lésions et limite de l’image normale">
<div class="lab">Au bilan initial</div><p>L’échographie aide à rechercher un foie d’aspect cirrhotique, des signes d’hypertension portale ou une lésion focale. Elle prépare aussi, si elle est indiquée, une surveillance comparable dans le temps. Une lésion suspecte nécessite une caractérisation selon le parcours diagnostique du carcinome hépatocellulaire.</p>
<div class="lab">Limite</div><p>Une échographie sans anomalie évidente n’exclut pas une fibrose significative. Elle ne remplace ni l’estimation de la fibrose, ni l’évaluation de l’ADN VHB. Aucun compte rendu d’imagerie de Mme R. n’a été fourni.</p>
<p class="refs"><a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, VHB 2025, Baseline assessment et HCC surveillance</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, carcinome hépatocellulaire, février 2025, diagnostic et surveillance</a>, consultés le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-chc" data-title="Cancer du foie : indication de surveillance selon le risque réel">
<div class="lab">VHB</div><p>L’EASL 2025 recommande une échographie tous les six mois en cas de cirrhose (Child-Pugh A ou B, ou C candidat à la greffe) et chez les porteurs de l’Ag HBs sans cirrhose à risque intermédiaire ou élevé (score PAGE-B ≥ 10, antécédent familial, hépatite D, fibrose avancée) ; l’alpha-fœtoprotéine peut la compléter. Le risque individuel ne se déduit pas du seul Ag HBs de Mme R.</p>
<div class="lab">VHC après guérison : choix entre versions</div><p>L’EASL VHC 2020 préconisait une surveillance semestrielle pour la fibrose F3/F4 après réponse virologique. La recommandation spécialisée EASL CHC 2025 maintient la surveillance en cas de cirrhose si un traitement curatif reste possible ; pour la fibrose avancée sans cirrhose, elle ne recommande plus une surveillance systématique faute de preuve suffisante. Cette mise à jour de 2025 prime pour la question précise du CHC après VHC, sans supprimer les indications particulières du VHB.</p>
<div class="lab">Limites des tests</div><p>L’échographie est la méthode centrale de surveillance ; l’alpha-fœtoprotéine seule ne permet pas de conclure. Une anomalie déclenche un diagnostic, et une surveillance antérieure normale ne garantit pas l’absence de tumeur future.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tableau 11</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020, suivi après traitement</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, carcinome hépatocellulaire, 2025, surveillance</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-hdv" data-title="VHD : anti-VHD d’abord, ARN pour la virémie">
<div class="lab">Pourquoi chercher</div><p>Le VHD dépend du VHB. Une infection VHD associée peut accélérer la progression de la maladie hépatique ; un ADN VHB faible n’exclut pas le VHD. L’EASL 2023 recommande un anti-VHD au moins une fois chez toute personne Ag HBs positive, avec nouvelle recherche selon l’exposition ou une poussée inexpliquée.</p>
<div class="lab">Enchaînement</div><p>Un anti-VHD positif indique une exposition. Une amplification de l’ARN VHD documente une infection active. L’EASL 2025 rappelle qu’environ 4 à 5 % des porteurs chroniques du VHB sont co-infectés et demande de répéter le test si les facteurs de risque persistent ou si les ALAT s’élèvent sans explication. Aucun résultat de Mme R. n’est connu.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023, dépistage et diagnostic</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, co-infections</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-hcv" data-title="VHC : anticorps de contact, ARN d’infection actuelle">
<div class="lab">Deux temps</div><p>Le test anti-VHC repère un contact immunologique. Après un résultat réactif, un test d’ARN VHC détermine si une virémie persiste. L’anticorps peut rester positif après guérison spontanée ou thérapeutique ; il ne suffit donc pas à désigner une infection active.</p>
<div class="lab">Fenêtre et chronicité</div><p>Selon l’EASL, l’anti-VHC peut manquer au début de l’infection aiguë et chez une personne profondément immunodéprimée ; l’ARN se discute alors même si l’anti-VHC est négatif. Un ARN positif prouve une infection actuelle au prélèvement, sans dater à lui seul sa durée. Aucun résultat VHC n’est fourni pour Mme R.</p>
<p class="refs"><a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020, diagnostic</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-hev" data-title="VHE : test ciblé lorsque l’immunodépression change le risque">
<div class="lab">Pourquoi le contexte compte</div><p>La plupart des hépatites E guérissent, mais une infection persistante est possible chez certaines personnes immunodéprimées, notamment après transplantation. L’EASL 2018 recommande la recherche d’ARN VHE chez un patient immunodéprimé présentant des anomalies hépatiques inexpliquées. Une sérologie seule peut être peu fiable dans ce terrain.</p>
<div class="lab">Application limitée</div><p>Rien dans le cas de Mme R. n’indique une immunodépression ou une hépatite E. Le test est discuté si son histoire et son bilan le justifient ; il ne fait pas partie du bilan automatique de toute infection VHB chronique.</p>
<p class="refs"><a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018, diagnostic et infection chronique</a>, lu le 8 octobre 2026. Le guide concerne surtout les génotypes 3 et 4 et des populations immunodéprimées.</p>
</template>
<template data-pop="b18-e-svr" data-title="SVR12 : guérison virologique du VHC, risque hépatique à réévaluer">
<div class="lab">Définition</div><p>Une réponse virologique soutenue est établie lorsque l’ARN VHC est indétectable, par un test de limite inférieure à 15 UI/mL, 12 semaines (SVR12) ou 24 semaines après la fin du traitement. L’avis suisse considère le patient définitivement guéri si l’ARN reste négatif 3 à 12 mois après la fin du traitement, sans nouveau dosage sauf nouveau risque. Elle correspond à une guérison virologique de cet épisode. Le résultat ne garantit ni l’absence de réinfection future ni la disparition d’une cirrhose antérieure.</p>
<div class="lab">Suivi restant</div><p>Un patient avec cirrhose garde un risque de cancer du foie après guérison et doit être évalué pour une surveillance adaptée. La question de la fibrose avancée sans cirrhose suit la recommandation spécialisée EASL CHC 2025 exposée dans la fenêtre « cancer du foie », plutôt que l’ancienne règle générale F3 de 2020.</p>
<p class="refs"><a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020, objectifs du traitement</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL, SSG et SSI, 2021, suivi de l’ARN</a>, lus le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-bilirubine" data-title="Bilirubine : excrétion hépatique et ictère">
<div class="lab">Ce que mesure le sang</div><p>La bilirubine provient notamment de la dégradation de l’hème. Une élévation peut traduire un trouble de transformation ou d’excrétion par le foie, mais aussi une autre cause, dont une destruction accrue des globules rouges. Le laboratoire précise la fraction totale et, selon la question, la fraction conjuguée.</p>
<div class="lab">Décision et limite</div><p>Un ictère associé à une coagulopathie ou à une dégradation de l’état général impose une évaluation rapide. La bilirubine isolée ne mesure ni la réplication du VHB ni le stade de fibrose. Aucun résultat de Mme R. n’est fourni.</p>
<p class="refs"><a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, VHB 2025, bilan initial et maladie hépatique avancée</a>, consulté le 8 octobre 2026 ; le raisonnement différentiel d’une hyperbilirubinémie dépend du contexte clinique.</p>
</template>
<template data-pop="b18-e-albumine" data-title="Albumine : synthèse hépatique et autres causes de baisse">
<div class="lab">Fonction mesurée</div><p>Le foie synthétise l’albumine. Une baisse peut accompagner une maladie hépatique avancée, surtout si elle rejoint d’autres signes de perte de fonction. L’albumine varie aussi avec l’inflammation, les pertes rénales ou l’état nutritionnel.</p>
<div class="lab">Limite</div><p>Une valeur isolée ne date pas l’atteinte et ne mesure pas l’ADN VHB. Le médecin la confronte à l’INR, à la bilirubine, à l’examen clinique et aux résultats antérieurs. Aucune valeur n’est fournie pour Mme R.</p>
<p class="refs"><a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, VHB 2025, bilan initial et évaluation de la maladie avancée</a>, consulté le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-inr" data-title="INR : coagulation et capacité de synthèse">
<div class="lab">Question clinique</div><p>L’INR standardise le temps de coagulation. Lors d’une maladie hépatique sévère, une élévation peut signaler que le foie produit moins de facteurs de coagulation. Elle appelle une lecture rapide avec la clinique, la bilirubine et d’éventuels signes de décompensation.</p>
<div class="lab">Piège</div><p>Un anticoagulant de type antivitamine K, une carence en vitamine K ou d’autres circonstances peuvent aussi modifier l’INR. Il ne classe donc pas seul la gravité du VHB. Le traitement et le résultat de Mme R. ne sont pas connus.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, bilan initial</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-plaquettes" data-title="Plaquettes : numération utile à l’évaluation du foie">
<div class="lab">Pourquoi les compter</div><p>Une baisse des plaquettes peut accompagner l’hypertension portale, notamment par séquestration splénique. La numération entre également dans l’APRI, qui aide à estimer la fibrose. Le compte rendu exprime habituellement la concentration en 10⁹/L.</p>
<div class="lab">Limite</div><p>Une thrombopénie a de nombreuses autres causes, dont une atteinte médullaire ou médicamenteuse. Une numération normale n’exclut pas une fibrose significative. Aucun nombre de plaquettes de Mme R. n’est fourni.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, bilan initial et tests non invasifs</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-ast" data-title="AST : enzyme utile, mais peu spécifique">
<div class="lab">Sens du résultat</div><p>L’AST est une enzyme libérée lors de lésions cellulaires. Elle peut augmenter avec une atteinte hépatique, mais aussi avec une atteinte musculaire ; le contexte et les autres résultats comptent. L’APRI utilise l’AST rapportée à la limite supérieure indiquée par le laboratoire.</p>
<div class="lab">Limite</div><p>Une AST élevée ne quantifie pas l’ADN VHB et ne mesure pas directement la fibrose. Un résultat pendant une poussée peut modifier l’APRI sans correspondre à une progression anatomique identique. Mme R. n’a pas de valeur d’AST fournie.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tests non invasifs</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-apri" data-title="APRI : indice biologique de fibrose, pas biopsie">
<div class="lab">Composition</div><p>L’APRI compare l’AST à sa limite supérieure de référence et tient compte du nombre de plaquettes. Il offre une estimation non invasive du risque de fibrose lorsque les prélèvements sont disponibles. Il ne décrit pas directement l’architecture du foie.</p>
<div class="lab">Limites</div><p>Une poussée d’hépatite peut augmenter l’AST et rendre l’indice trompeur. Les seuils dépendent de la question et de la population décrites par la recommandation. Le médecin confronte l’APRI à l’élastographie, à la clinique et à l’histoire ; aucune valeur n’existe pour Mme R.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tests non invasifs</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-elastographie" data-title="Élastographie : rigidité du foie et faux excès">
<div class="lab">Mesure</div><p>L’élastographie transitoire estime la rigidité du tissu hépatique. Une rigidité élevée peut suggérer une fibrose plus avancée et aider à reconnaître une cirrhose. Le résultat est exprimé en kPa avec une méthode et des critères de qualité propres.</p>
<div class="lab">Piège et décision</div><p>Une hépatite aiguë ou une poussée inflammatoire peut augmenter la rigidité sans augmentation équivalente de la fibrose. L’obésité et la qualité de la mesure comptent également. Les seuils EASL (&gt; 7, &gt; 8 et &gt; 11 kPa) valent pour l’élastographie transitoire et ne se transfèrent pas automatiquement à une autre technique ; le résultat de Mme R. reste à obtenir.</p>
<p class="refs"><a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tableau 6 et surestimation pendant les poussées</a>, lu le 8 octobre 2026.</p>
</template>
<template data-pop="b18-e-nfs" data-title="Formule sanguine : cellules et plaquettes du bilan initial">
<div class="lab">Ce qu’elle apporte</div><p>La formule sanguine compte les globules rouges, les globules blancs et les plaquettes. Elle fournit la numération plaquettaire utilisée par l’APRI et peut révéler une cytopénie qui oriente vers une complication ou une autre cause. Ce bilan initial sert aussi de point de comparaison si un traitement est commencé.</p>
<div class="lab">Limite</div><p>Une formule normale n’exclut ni une fibrose ni une virémie. Une anomalie doit être expliquée avant de l’attribuer au VHB ou à un médicament. Aucune valeur n’est connue chez Mme R.</p>
