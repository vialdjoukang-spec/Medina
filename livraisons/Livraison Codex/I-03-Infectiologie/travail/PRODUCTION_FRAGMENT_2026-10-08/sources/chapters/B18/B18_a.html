<section class="ilot" id="b18-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme R., 42 ans, consulte après deux recherches d’antigène de surface du virus de l’hépatite B (Ag HBs) positives à plus de six mois d’intervalle. Cette persistance définit une infection chronique par le VHB. Elle ne dit pourtant rien de trois questions décisives : le virus se réplique-t-il beaucoup, le foie est-il enflammé, une fibrose est-elle déjà installée ? L’ADN du VHB, les ALAT, l’Ag HBe et la mesure de la fibrose ne sont pas encore connus.</p>
<p>Ce cours couvre les quatre hépatites virales qui peuvent devenir chroniques : B, D (qui exige le VHB), C et, chez la personne immunodéprimée, E. Il répond à quatre questions. Comment prouver la chronicité et mesurer l’activité ? Qui traiter, avec quel médicament et à quelle dose selon l’information professionnelle suisse ? Comment surveiller le cancer du foie ? Comment protéger l’entourage et prévenir la réactivation ?</p>
<div class="key"><b>À retenir.</b> La durée de l’infection, la réplication virale, la lésion hépatique et le risque de cancer sont quatre mesures distinctes ; la décision thérapeutique les exige toutes.</div></section>

<section class="ilot" id="b18-pa-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p><b>Hépatite B chronique.</b> L’infection chronique par le VHB se définit par la persistance de l’Ag HBs pendant six mois ou plus ; cette définition est donnée par l’OMS, les directives européennes lues ne la reformulant pas. <a href="https://iris.who.int/server/api/core/bitstreams/34470cc8-af90-4d7b-a949-ef27e5d0726f/content" target="_blank" rel="noopener" data-reference-source="1">OMS, directives hépatite B chronique, mars 2024, glossaire</a>. L’EASL décrit ensuite <button class="w" data-k="b18-pa-phases">quatre phases (Ag HBe, ADN, ALAT)</button>, que le tableau résume :</p>
<div class="table-wrap"><table class="t"><thead><tr><th>Phase EASL</th><th>ADN du VHB</th><th>ALAT</th><th>Atteinte hépatique</th></tr></thead><tbody>
<tr><td>1. Infection chronique Ag HBe positive</td><td>Élevé, souvent ≥ 10<sup>7</sup> UI/mL</td><td>Normales</td><td>Nulle ou minime</td></tr>
<tr><td>2. Hépatite chronique Ag HBe positive</td><td>10<sup>4</sup> à 10<sup>7</sup> UI/mL</td><td>Élevées</td><td>Modérée à sévère</td></tr>
<tr><td>3. Infection chronique Ag HBe négative</td><td>Habituellement &lt; 2000 UI/mL</td><td>Normales</td><td>Nulle</td></tr>
<tr><td>4. Hépatite chronique Ag HBe négative</td><td>Habituellement &gt; 2000 UI/mL</td><td>Élevées, durablement ou par poussées</td><td>Légère à sévère</td></tr>
</tbody></table></div>
<p>Le tableau se lit ligne par ligne : seule la combinaison de mesures répétées classe une personne, et l’EASL 2025 précise qu’une part notable des patients n’entre dans aucune case ; elle fonde donc l’indication de traitement sur l’ADN, les ALAT et la fibrose plutôt que sur la phase. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, J Hepatol 2025, tableau 4</a>.</p>
<p><b>Hépatite D.</b> Le <button class="w" data-k="b18-pa-vhd">VHD (dépendance au VHB)</button> n’infecte que les personnes porteuses de l’Ag HBs ; l’hépatite D chronique se prouve par l’ARN du VHD. <b>Hépatite C.</b> Par convention, l’hépatite C devient chronique après six mois d’infection sans guérison spontanée ; l’infection active se prouve par l’ARN du VHC ou l’antigène de capside. <b>Hépatite E.</b> Chez le transplanté d’organe, une virémie de plus de trois mois définit en pratique le <button class="w" data-k="b18-pa-vhe">VHE chronique (terrain immunodéprimé)</button>. <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a>.</p>
<div class="key"><b>À retenir.</b> Chronicité B : Ag HBs ≥ 6 mois. Activité B : ADN, ALAT et fibrose répétés. Hépatites C, D et E actives : ARN viral détectable.</div></section>

<section class="ilot" id="b18-pa-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>En 2024, l’OFSP a reçu <b>1219 déclarations d’hépatite B</b> (13,5 pour 100 000 personnes) et <b>1059 d’hépatite C</b> (11,8 pour 100 000). Il s’agit surtout d’infections anciennes découvertes au stade chronique ; l’hépatite B aiguë n’atteint plus que 0,2 cas pour 100 000. La hausse récente des cas d’hépatite B s’explique largement par des personnes originaires d’Ukraine et d’Afghanistan ; la voie d’infection reste inconnue dans la plupart des cas. Les <button class="w" data-k="b18-pa-epid">données suisses détaillées (OFSP 2024)</button> précisent ces chiffres. La SASL estimait en 2021 que 36 000 à 43 000 personnes vivaient avec une hépatite C chronique en Suisse, souvent sans le savoir. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, hépatites B et C en 2024</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL, SSG et SSI, traitement de l’hépatite C, janvier 2021</a>.</p>
<p><b>Pronostic.</b> L’hépatite B aiguë de l’adulte immunocompétent devient rarement chronique ; la chronicité survient surtout après une transmission de la mère à l’enfant ou une infection dans l’enfance. L’hépatite B chronique expose à la cirrhose, à l’insuffisance hépatique et au carcinome hépatocellulaire (CHC), parfois sans cirrhose. Environ 4 à 5 % des porteurs chroniques du VHB sont co-infectés par le VHD, forme la plus sévère des hépatites virales chroniques. Pour l’hépatite C, 2 à 20 % des personnes développent une cirrhose en vingt ans, et 15 à 30 % après trente ans. Environ un quart des hépatites C aiguës guérissent spontanément ; les antiviraux directs guérissent environ 95 % des hépatites C chroniques. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 2025</a>.</p>
<div class="key"><b>À retenir.</b> Suisse 2024 : 13,5 déclarations d’hépatite B et 11,8 d’hépatite C pour 100 000 ; l’hépatite C se guérit dans environ 95 % des cas, l’hépatite B se contrôle.</div></section>

<section class="ilot" id="b18-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Normal.</b> L’hépatocyte sain n’héberge aucun génome viral et le foie régénère sans cicatrice après une agression brève. <b>Perturbation.</b> Le VHB dépose dans le noyau de l’hépatocyte un ADN circulaire clos de façon covalente (ADNccc), matrice stable qui persiste même lorsque la réplication est freinée ; c’est pourquoi un analogue nucléos(t)idique supprime le virus sans l’éliminer. Le VHD utilise l’Ag HBs pour entrer dans l’hépatocyte et en sortir. Le VHC, virus à ARN, se réplique dans le cytoplasme grâce à des enzymes virales que ciblent les antiviraux directs. <b>Manifestation.</b> La réponse immunitaire contre les hépatocytes infectés entretient une inflammation (ALAT élevées) ; répétée pendant des années, elle produit une <button class="w" data-k="b18-pa-fibrose">fibrose (cicatrisation)</button>, puis une cirrhose, une hypertension portale et un terrain de cancer. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025</a> ; onglet Sciences fondamentales.</p>
<p>Deux conséquences en découlent. Une immunosuppression affaiblit le contrôle de l’ADNccc et peut provoquer une réactivation, même chez une personne Ag HBs négative mais anti-HBc positive. Une suppression virale prolongée réduit la fibrose, la décompensation et le CHC, mais n’efface ni une cirrhose installée ni tout risque de cancer.</p>
<div class="key"><b>À retenir.</b> ADNccc persistant : le VHB se contrôle, il se guérit rarement. ARN cytoplasmique : le VHC se guérit.</div></section>

<section class="ilot" id="b18-pa-4"><h2><span class="n">4</span>Transmission et facteurs de risque</h2>
<p>Le VHB se transmet par voie périnatale, sanguine et sexuelle ; une exposition minime à des liquides riches en ADN viral suffit. Le VHC se transmet principalement par le sang et exceptionnellement par voie sexuelle ; en Suisse, la consommation de drogues par voie intraveineuse ou intranasale contribue notablement à sa transmission. Le VHD se transmet surtout par voie parentérale ou sexuelle. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, dépistage</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025</a>.</p>
<p>L’EASL recommande de rechercher le VHB (Ag HBs et anti-HBc) notamment en cas d’enzymes hépatiques élevées ou de maladie du foie, de VIH ou de VHC, d’hémodialyse, d’immunosuppression prévue, de transplantation, d’origine d’une région de prévalence intermédiaire ou élevée, de contact familial ou sexuel d’une personne infectée, de partenaires multiples, d’usage de drogues injectables, de détention, et chez toutes les femmes enceintes. L’OFSP privilégie pour le VHC un dépistage ciblé sur les facteurs de risque actuels ou anciens et sur la situation clinique, plutôt qu’un dépistage de la population générale. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, hépatite C, synthèse</a>.</p>
<div class="key"><b>À retenir.</b> Dépistage VHB : Ag HBs et anti-HBc. Dépistage VHC en Suisse : ciblé sur les risques. Toute grossesse : Ag HBs.</div></section>

<section class="ilot" id="b18-pa-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’hépatite chronique reste longtemps asymptomatique ; l’anamnèse cherche donc les risques et les signes de maladie avancée plutôt qu’un symptôme typique. Le médecin précise les résultats antérieurs, un traitement antiviral passé, les <button class="w" data-k="b18-pa-famille">antécédents familiaux de CHC (risque)</button>, l’origine géographique, les expositions sanguines, sexuelles et périnatales, la consommation d’alcool, les composantes du syndrome métabolique, les médicaments et une immunosuppression prévue. La SASL demande de quantifier l’alcool et d’évaluer poids, diabète, dyslipidémie et hypertension, qui accélèrent la fibrose. <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021, bilan avant traitement</a>.</p>
<p>Les symptômes se classent du plus banal au plus grave : <button class="w" data-k="b18-pa-fatigue">fatigue</button>, <button class="w" data-k="b18-pa-prurit">prurit</button>, <button class="w" data-k="b18-pa-douleur">douleur abdominale</button>, <button class="w" data-k="b18-pa-ictere">ictère</button>, <button class="w" data-k="b18-pa-saignement">saignement digestif</button> et <button class="w" data-k="b18-pa-attention">trouble de l’attention</button>. Les trois derniers signalent une maladie avancée ou décompensée. La fenêtre <button class="w" data-k="b18-pa-histoire">anamnèse ciblée (sens de chaque question)</button> détaille la conséquence de chaque réponse.</p>
<div class="trap"><span class="k">Piège.</span> Une personne asymptomatique peut avoir une cirrhose ; l’absence de plainte ne dispense jamais de mesurer la fibrose.</div></section>

<section class="ilot" id="b18-pa-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen mesure d’abord les <button class="w" data-k="b18-pa-constantes">constantes (défaillance immédiate)</button>, puis recherche les signes de maladie avancée : <button class="w" data-k="b18-pa-ictere">ictère</button>, <button class="w" data-k="b18-pa-ascite">ascite</button>, <button class="w" data-k="b18-pa-oedemes">œdèmes</button>, <button class="w" data-k="b18-pa-attention">confusion</button> et <button class="w" data-k="b18-pa-portale">stigmates d’hypertension portale</button>. La fenêtre <button class="w" data-k="b18-pa-signes">lecture d’ensemble des signes</button> relie ces observations à la décompensation. Chez Mme R., l’examen est normal ; ce résultat n’exclut pas une fibrose avancée et ne remplace pas l’élastographie.</p>
<div class="key"><b>À retenir.</b> L’examen dépiste la décompensation ; il ne mesure pas la fibrose.</div></section>

<section class="ilot" id="b18-pa-7"><h2><span class="n">7</span>Diagnostic</h2>
<p><b>Hépatite B.</b> Chez toute personne Ag HBs positive, l’EASL 2025 recommande avec une force élevée : ADN du VHB quantitatif, Ag HBe, Ag HBs quantitatif, anti-VHD, anti-VHC et anti-VIH, puis ALAT, ASAT, bilirubine, albumine, INR et formule sanguine, une échographie abdominale au diagnostic et une estimation non invasive de la fibrose. En élastographie transitoire, l’EASL retient en pratique plus de 7 kPa pour une fibrose significative, plus de 8 kPa pour une fibrose avancée et plus de 11 kPa pour une cirrhose. Le <button class="w" data-k="b18-pa-bilan-vhb">bilan VHB (question de chaque mesure)</button> détaille ces examens. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tableaux 5 et 6</a>.</p>
<p><b>Hépatite D.</b> L’anti-VHD se recherche au moins une fois chez toute personne Ag HBs positive, puis l’ARN du VHD s’il est positif. <b>Hépatite C.</b> L’anti-VHC est le test de première ligne ; s’il est positif, l’ARN du VHC ou l’antigène de capside prouve l’infection active. <b>Hépatite E.</b> L’ARN du VHE se recherche chez une personne immunodéprimée dont les enzymes hépatiques sont anormales sans explication. <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020, diagnostic</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a>.</p>
<p><b>Diagnostics différentiels.</b> Devant des ALAT élevées, le VHB n’est pas forcément seul en cause : alcool, maladie métabolique, médicament, auto-immunité et autre virus sont recherchés, comme le détaille la fenêtre <button class="w" data-k="b18-pa-differentiel">autres causes d’atteinte hépatique</button>. La SASL demande aussi d’exclure une hémochromatose. Une ALAT durablement élevée avec un ADN faible peut relever d’une autre maladie du foie, et l’EASL rappelle cette possibilité. <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a>.</p>
<div class="key"><b>À retenir.</b> Anticorps = contact ; ADN ou ARN = infection active. L’onglet Examens détaille chaque test.</div>
<button class="pareto-btn ui" data-k="b18-pa-pareto-bases">▲ Loi de Pareto — Définir, situer et confirmer</button></section>

<section class="ilot" id="b18-pa-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><p><b>Gravité d’abord.</b> Confusion nouvelle, hémorragie digestive, ascite rapidement croissante, hypotension, ictère avec troubles de la coagulation : <button class="w" data-k="b18-pa-decompensation">décompensation hépatique (conduite)</button>, à stabiliser avant tout résultat virologique. Hausse brutale des ALAT sous chimiothérapie ou immunosuppresseur : réactivation du VHB jusqu’à preuve du contraire. Hépatite B aiguë avec altération de la fonction de synthèse : analogue nucléos(t)idique et prise en charge avec un centre de transplantation selon l’EASL 2025.</p></div>
<p>Les complications chroniques sont la cirrhose et ses décompensations (ascite, hémorragie variqueuse, encéphalopathie), le CHC et les manifestations extrahépatiques. Pour l’hépatite C, l’EASL cite la vascularite cryoglobulinémique, la néphropathie à complexes immuns et le lymphome B non hodgkinien, qui imposent un traitement urgent. Une poussée d’ALAT n’est pas toujours virale : toxicité médicamenteuse, ischémie, obstacle biliaire ou autre infection restent possibles. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, hépatite aiguë et réactivation</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020, indications</a>.</p>
<div class="key"><b>À retenir.</b> La défaillance hépatique est une urgence clinique ; la virologie avance en parallèle de la stabilisation.</div></section>

<section class="ilot" id="b18-pa-9"><h2><span class="n">9</span>Prise en charge</h2>
<p><b>Hépatite B — objectifs et indications.</b> Le traitement vise une suppression durable de l’ADN, qui prévient la progression, la décompensation et le CHC ; la perte de l’Ag HBs reste rare sous analogue (moins de 0,33 % par an). Selon l’EASL 2025, tout porteur de l’Ag HBs avec ADN détectable est candidat. Le traitement est recommandé fortement si l’ADN est ≥ 2000 UI/mL avec ALAT élevées ou fibrose significative ; en cas de cirrhose dès que l’ADN est détectable, quelles que soient les ALAT ; en cas de risque élevé de CHC, de manifestation extrahépatique ou d’immunosuppression ; et pendant la grossesse si l’ADN est ≥ 200 000 UI/mL. Une fibrose avancée (élastographie &gt; 8 kPa) permet aussi de traiter dès que l’ADN est détectable. Les <button class="w" data-k="b18-pa-indications">indications EASL 2025 (conditions et limites)</button> sont détaillées en fenêtre. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, indications thérapeutiques</a>.</p>
<p><b>Hépatite B — moyens.</b> L’EASL recommande en première ligne l’<button class="w" data-k="b18-pa-antiviraux-vhb">entécavir, le ténofovir disoproxil ou le ténofovir alafénamide (choix et arrêt)</button>, choisis selon la fonction rénale, l’os, la grossesse et les traitements antérieurs ; l’interféron pégylé est une option de durée finie chez des patients sélectionnés. Les informations professionnelles suisses fixent les doses de l’adulte : entécavir 0,5 mg par jour à jeun (1 mg en cas de résistance à la lamivudine ou de maladie décompensée), adapté si la clairance de la créatinine est inférieure à 50 mL/min ; ténofovir disoproxil 245 mg par jour au repas, toutes les 48 heures si la clairance est de 30 à 49 mL/min ; ténofovir alafénamide 25 mg par jour au repas, sans adaptation si la clairance est ≥ 15 mL/min. Le tableau complet est dans l’onglet Pharmacologie. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Baraclude®, mars 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56251" target="_blank" rel="noopener" data-reference-source="1">Viread®, juin 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66190" target="_blank" rel="noopener" data-reference-source="1">Vemlidy®, février 2024</a>, Swissmedic (AIPS), consultées le 08.10.2026.</p>
<p><b>Hépatite C.</b> La SASL, la SSG et la SSI demandent d’évaluer et de proposer un traitement à toute personne infectée ; l’EASL 2020 demande de traiter sans délai et en urgence en cas de fibrose F2 à F4, de manifestations extrahépatiques ou de risque élevé de transmission. Les schémas pangénotypiques sont le <button class="w" data-k="b18-pa-vhc-traitement">sofosbuvir/velpatasvir ou le glécaprévir/pibrentasvir (schémas et guérison)</button>. Les inhibiteurs de protéase sont contre-indiqués en cirrhose Child-Pugh B ou C. L’OFSP indique que, depuis octobre 2017, toute personne atteinte d’hépatite C chronique peut être traitée par antiviraux directs pris en charge par l’assurance obligatoire ; en 2021, la SASL précisait que la prescription remboursée restait réservée à certains spécialistes. La <button class="w" data-k="b18-pa-suisse-vhc">position suisse sur l’hépatite C (SASL et OFSP)</button> détaille ces conditions. <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 2025</a>.</p>
<p><b>Hépatites D et E.</b> Toute hépatite D chronique compensée doit être considérée pour un traitement : <button class="w" data-k="b18-pa-vhd-traitement">bulévirtide 2 mg par jour sous la peau ou interféron pégylé (choix)</button>. Le VHE chronique du transplanté se traite d’abord par réduction de l’immunosuppression, puis par <button class="w" data-k="b18-pa-vhe-traitement">ribavirine pendant 12 semaines (conditions)</button> si l’ARN persiste trois mois après sa détection. <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a>.</p>
<p><b>Surveillance et critères de modification.</b> Sous analogue, ADN et ALAT se contrôlent tous les 3 à 6 mois jusqu’à la réponse virologique, puis tous les 6 à 12 mois ; la fonction rénale est surveillée et le ténofovir disoproxil est remplacé par l’entécavir ou le ténofovir alafénamide en cas de baisse de la filtration, de tubulopathie, d’hypophosphatémie ou d’ostéoporose. Un arrêt non préparé expose à une poussée sévère.</p>
<button class="pareto-btn ui" data-k="b18-pa-pareto-vhb">▲ Loi de Pareto — Qui traiter et avec quoi</button></section>

<section class="ilot" id="b18-pa-10"><h2><span class="n">10</span>Suivi et prévention</h2>
<p><b>Suivi sans traitement.</b> Après un diagnostic de VHB chronique, l’EASL recommande ALAT et ADN tous les 3 à 6 mois la première année, puis tous les 6 à 12 mois selon la phase, l’Ag HBs chaque année et une fibrose réévaluée de façon individualisée, comme le précise la fenêtre <button class="w" data-k="b18-pa-suivi-vhb">suivi VHB (rythme)</button>. <b>Cancer du foie.</b> Le <button class="w" data-k="b18-pa-chc">dépistage du CHC (qui surveiller)</button> repose sur une échographie tous les six mois chez les personnes à risque : cirrhose, et porteurs de l’Ag HBs sans cirrhose à risque intermédiaire ou élevé (antécédent familial, hépatite D, fibrose avancée, score PAGE-B ≥ 10) ; il se poursuit malgré un traitement efficace ou une perte de l’Ag HBs. Après guérison du VHC, la surveillance reste indiquée en cas de cirrhose ; pour la fibrose avancée sans cirrhose, les deux textes européens divergent, comme l’explique la fenêtre <button class="w" data-k="b18-pa-f3-divergence">fibrose F3 après guérison (source la plus récente)</button>. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tableaux 7 et 11</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, CHC, 2025</a>.</p>
<p><b>Prévention.</b> En Suisse, la <button class="w" data-k="b18-pa-vaccination">vaccination contre l’hépatite B (plan suisse)</button> se fait de préférence chez le nourrisson depuis 2019 et reste expressément recommandée aux jeunes de 11 à 15 ans non vaccinés et aux groupes vulnérables ; la couverture atteignait 81 % à 16 ans. L’OFSP demande de vérifier le statut vaccinal à chaque dépistage du VIH ou d’une infection sexuellement transmissible. La vaccination protège aussi du VHD. Aucun vaccin n’existe contre le VHC : sa prévention repose sur le matériel stérile à usage unique, la sécurité des dons et la réduction des risques chez les consommateurs de drogues. <b>Réactivation.</b> Avant toute <button class="w" data-k="b18-pa-reactivation">immunosuppression (prophylaxie)</button>, l’Ag HBs et l’anti-HBc sont recherchés. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, hépatites B et C</a>.</p>
<button class="pareto-btn ui" data-k="b18-pa-pareto-suivi">▲ Loi de Pareto — Suivre et prévenir</button></section>

<section class="ilot" id="b18-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p><b>Grossesse.</b> L’Ag HBs est recherché chez toute femme enceinte, idéalement au premier trimestre. Un traitement par ténofovir (disoproxil ou alafénamide) est indiqué si l’ADN est ≥ 200 000 UI/mL, idéalement avant le dernier trimestre ; l’entécavir est remplacé par le ténofovir et l’allaitement reste possible sous ténofovir. Le nouveau-né reçoit le vaccin dans les 24 heures, idéalement dans les 12 heures, avec des immunoglobulines. L’information suisse de Viread® confirme plus de 1000 grossesses exposées sans signal malformatif ; celle de Baraclude® déconseille l’entécavir pendant la grossesse sauf nécessité absolue. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, grossesse</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56251" target="_blank" rel="noopener" data-reference-source="1">Viread®</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Baraclude®</a>.</p>
<p><b>Co-infection VHB-VHC.</b> Les antiviraux directs ne bloquent pas le VHB : la SASL recommande un analogue chez tout porteur de l’Ag HBs pendant le traitement de l’hépatite C et au moins 12 semaines après, et l’EASL 2025 l’impose en cas de cirrhose même avec ADN indétectable. <b>VIH.</b> Les indications et schémas de l’hépatite C suivent ceux de la mono-infection, après vérification des interactions. <b>Insuffisance rénale.</b> Le glécaprévir/pibrentasvir ne demande aucune adaptation, dialyse comprise ; le ténofovir disoproxil est remplacé par l’entécavir ou le ténofovir alafénamide si la filtration baisse. <b>Contextes spécialisés.</b> Transplantation, hémodialyse et immunosuppression relèvent de la fenêtre <button class="w" data-k="b18-pa-contextes">grossesse, VIH et transplantation (stratégies)</button>. <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66472" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Maviret®, juin 2026</a>.</p>
<p><b>Retour au cas.</b> Mme R. revient avec un Ag HBe négatif, un ADN de 15 000 UI/mL, des ALAT à deux fois la limite supérieure, une élastographie à 9 kPa, un anti-VHD et un anti-VHC négatifs et une clairance de la créatinine de 95 mL/min. Elle a une hépatite chronique Ag HBe négative avec fibrose avancée : l’indication est forte. Sans projet de grossesse ni maladie rénale ou osseuse, l’entécavir 0,5 mg ou le ténofovir sont possibles ; l’échographie semestrielle est discutée selon le score de risque, puisque la fibrose avancée sans cirrhose relève de l’évaluation individuelle. Son partenaire et ses enfants sont testés et vaccinés s’ils ne sont pas immuns.</p></section>

<section class="ilot" id="b18-pa-12"><h2><span class="n">12</span>Critères formels du diagnostic et paramètres clés</h2>
<div class="alert"><p><b>Hépatite B chronique</b> : Ag HBs persistant six mois ou plus (définition OMS). <b>Hépatite D chronique</b> : anti-VHD positif et ARN du VHD détectable chez un porteur de l’Ag HBs. <b>Hépatite C chronique</b> : ARN du VHC (ou antigène de capside) détectable au-delà de six mois d’infection ; l’anticorps seul ne suffit pas. <b>Hépatite E chronique</b> du transplanté : ARN du VHE persistant plus de trois mois. <b>Guérison du VHC</b> : ARN indétectable 12 semaines après la fin du traitement (SVR12).</p></div>
<div class="key"><p><b>Paramètres clés.</b> Seuil d’ADN du VHB : 2000 UI/mL ; grossesse : 200 000 UI/mL. Élastographie : &gt; 7 kPa fibrose significative, &gt; 8 kPa avancée, &gt; 11 kPa cirrhose. Suivi non traité : ADN et ALAT tous les 3 à 6 mois la première année. Échographie tous les 6 mois chez les personnes à risque de CHC. Entécavir 0,5 mg/jour ; ténofovir disoproxil 245 mg/jour ; ténofovir alafénamide 25 mg/jour ; sofosbuvir/velpatasvir 400/100 mg/jour pendant 12 semaines ; glécaprévir/pibrentasvir 300/120 mg/jour pendant 8 semaines chez le patient naïf compensé ; bulévirtide 2 mg/jour sous la peau.</p></div>
