<section class="ilot" id="b18-pa-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Mme R., 42 ans, consulte après deux résultats positifs de l’antigène de surface de l’hépatite B (<b>HBsAg</b>) espacés de plus de six mois. Cette persistance établit une infection chronique par le VHB. Elle ne dit pas si le foie est inflammatoire, si le virus se réplique beaucoup, ni si une fibrose est déjà installée. La valeur des ALAT, l’ADN du VHB, le statut HBeAg et la mesure de fibrose ne sont pas encore disponibles.</p>
<p>La décision utile aujourd’hui consiste à rechercher une atteinte hépatique et ses complications, à caractériser la réplication et à vérifier une infection par le VHD. Le médecin demande aussi les expositions qui augmentent le risque de transmission ou de réactivation. Il ne peut ni appeler cette patiente « porteuse inactive » ni prescrire un traitement sur la seule ancienneté de l’HBsAg. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, VHB, 2025, tableaux 4–5 et indications thérapeutiques</a>.</p>
<div class="key"><b>À retenir.</b> L’ancienneté de l’HBsAg identifie l’infection chronique. L’activité du virus, la lésion du foie et le risque futur sont trois mesures supplémentaires. Leur distinction guide aussi le code B18.</div></section>

<section class="ilot" id="b18-pa-1"><h2><span class="n">1</span>Définition et codage : une catégorie, plusieurs maladies</h2>
<p>Le catalogue <button class="w" data-k="b18-pa-codage">CIM-10-GM 2024 et ses sous-codes</button> range sous B18 les hépatites virales chroniques B, C, E et autres. Sa terminologie de codage ne remplace pas la description clinique : une personne HBsAg positive peut avoir une infection stable sans inflammation hépatique actuelle. Le dossier distingue donc la durée de l’infection, le virus identifié, les marqueurs d’activité et les lésions du foie.</p>
<p>Le tableau montre ce que chaque sous-code nomme dans la version utilisée par MEDINA. Il n’établit ni une règle de facturation suisse ni une équivalence avec la CIM-11.</p>
<div class="table-wrap"><table><thead><tr><th>Code CIM-10-GM 2024</th><th>Libellé clinique traduit</th><th>Information nécessaire</th></tr></thead><tbody><tr><td>B18.0</td><td>Hépatite B chronique avec virus delta.</td><td>Une infection VHD doit être établie.</td></tr><tr><td>B18.11 / .12</td><td>VHB sans delta, HBeAg positif : phases 1 / 2.</td><td>La phase 2 comporte une hépatite active ; une série de résultats est requise.</td></tr><tr><td>B18.13 / .14</td><td>VHB sans delta, HBeAg négatif : phases 3 / 4.</td><td>La phase 4 correspond à l’hépatite active ou réactivée.</td></tr><tr><td>B18.19</td><td>VHB sans delta, phase non précisée.</td><td>Le statut delta doit être clarifié avant d’affirmer « sans delta ».</td></tr><tr><td>B18.2</td><td>Hépatite C chronique.</td><td>L’ARN VHC établit l’infection actuelle ; les anticorps seuls ne suffisent pas.</td></tr><tr><td>B18.80 / .88 / .9</td><td>VHE chronique / autre hépatite virale chronique précisée / hépatite virale chronique non précisée.</td><td>Le virus et sa persistance doivent être documentés.</td></tr></tbody></table></div>
<p>Chez la patiente, l’HBsAg persistant oriente vers le VHB chronique. Le VHD n’est pas encore exclu et aucune phase HBeAg n’est connue. Un code de phase 1 à 4 serait donc prématuré. Les <button class="w" data-k="b18-pa-phases">quatre phases VHB</button> servent à décrire une évolution, et une ALAT normale isolée ne démontre pas l’absence durable d’activité. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-b15-b19.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, bloc B15–B19, version 2024</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableau 4</a>.</p>
<button class="pareto-btn ui" data-k="b18-pa-pareto-codage">▲ Loi de Pareto — Ce que le code ne peut pas déduire</button>
<div class="key"><b>À retenir.</b> Le VHD et la phase VHB changent le sous-code. Leur absence du dossier ne prouve pas leur négativité. Le bilan précise ensuite la maladie réelle derrière le code.</div></section>

<section class="ilot" id="b18-pa-2"><h2><span class="n">2</span>Virus, transmission et évolution</h2>
<p>Le VHB atteint le foie après exposition au sang ou à certains liquides biologiques, notamment lors de rapports sexuels ou d’une transmission périnatale. Le VHC se transmet surtout par exposition sanguine. Les modes exacts dépendent du contexte et ne peuvent pas être déduits du profil d’une personne. La vaccination protège contre le VHB et, indirectement, contre le VHD, qui a besoin de l’HBsAg pour former de nouvelles particules infectieuses. Il n’existe pas de vaccin homologué contre le VHC dans les recommandations européennes lues. <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHC 2020</a> ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHD 2023</a>.</p>
<p>Le <button class="w" data-k="b18-pa-vhd">VHD</button> peut accompagner le VHB dès l’exposition initiale ou surinfecter une personne déjà HBsAg positive. Il est associé à une progression hépatique plus rapide. Le <button class="w" data-k="b18-pa-vhe">VHE chronique</button> concerne surtout les personnes immunodéprimées, particulièrement après transplantation ; sa confirmation repose sur la persistance de l’ARN VHE. L’EASL 2018 retient au moins trois mois d’ARN détectable dans ce contexte. Une simple sérologie VHE positive ne suffit pas à le coder B18.80. <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHE 2018</a>.</p>
<p>L’inflammation chronique favorise la formation de <button class="w" data-k="b18-pa-fibrose">fibrose</button>. Une fibrose étendue peut évoluer vers la cirrhose, l’hypertension portale, l’insuffisance hépatique et le carcinome hépatocellulaire. Le VHB peut aussi s’associer à un cancer avant une cirrhose reconnue ; le risque individuel dépend de plusieurs facteurs. Supprimer la réplication réduit ce risque, mais n’efface pas une fibrose ancienne ni tout risque de cancer.</p>
<div class="key"><b>À retenir.</b> Identifier le virus précise la transmission et la prévention. Mesurer les lésions hépatiques indique l’urgence des soins et la surveillance. Une suppression virale n’annule pas les complications déjà possibles.</div></section>

<section class="ilot" id="b18-pa-3"><h2><span class="n">3</span>Anamnèse et examen clinique</h2>
<p>Une hépatite chronique peut rester longtemps asymptomatique. Le médecin demande l’ancienneté des tests, les résultats précédents, un éventuel traitement antiviral et des <button class="w" data-k="b18-pa-famille">antécédents familiaux de cirrhose ou de cancer du foie</button>. Il recherche <button class="w" data-k="b18-pa-fatigue">fatigue</button>, <button class="w" data-k="b18-pa-prurit">prurit</button>, <button class="w" data-k="b18-pa-ictere">ictère</button>, <button class="w" data-k="b18-pa-douleur">douleur abdominale</button>, <button class="w" data-k="b18-pa-saignement">saignement digestif</button> ou <button class="w" data-k="b18-pa-attention">modification de l’attention</button>. Ces symptômes ne prouvent pas tous une défaillance hépatique, mais les derniers peuvent en signaler une. La fenêtre <button class="w" data-k="b18-pa-histoire">anamnèse ciblée</button> précise le sens de chaque question.</p>
<p>Le médecin explore les expositions sanguines, sexuelles et périnatales sans supposer une source particulière. Il vérifie l’alcool, les médicaments, les compléments et les produits susceptibles d’aggraver le foie. Le diabète, l’adiposité et une autre maladie hépatique peuvent contribuer à la fibrose indépendamment du virus. Une immunosuppression prévue ou en cours change le risque de réactivation du VHB, même lorsque l’HBsAg actuel est négatif. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation et réactivation</a>.</p>
<p>L’examen mesure les <button class="w" data-k="b18-pa-constantes">constantes</button> et recherche <button class="w" data-k="b18-pa-ictere">ictère</button>, <button class="w" data-k="b18-pa-ascite">ascite</button>, <button class="w" data-k="b18-pa-oedemes">œdèmes</button>, <button class="w" data-k="b18-pa-attention">confusion</button> et <button class="w" data-k="b18-pa-portale">stigmates d’hypertension portale</button>. La fenêtre <button class="w" data-k="b18-pa-signes">lecture d’ensemble des signes</button> relie ces observations. Leur absence n’exclut pas une fibrose avancée. Chez la patiente du cas, aucun symptôme ni signe n’a été fourni : il faut les demander et les examiner au lieu de les supposer normaux.</p>
<div class="key"><b>À retenir.</b> L’histoire cherche l’exposition, les comorbidités et le risque de réactivation. L’examen recherche une décompensation. Une consultation calme ne remplace pas le bilan de fibrose.</div></section>

<section class="ilot" id="b18-pa-4"><h2><span class="n">4</span>Bilan initial : caractériser le virus et le foie</h2>
<p>Chez toute personne HBsAg positive, l’EASL 2025 recommande de caractériser la réplication, la phase et les lésions hépatiques. Le médecin demande <button class="w" data-k="b18-pa-bilan-vhb">ADN VHB, ALAT, HBeAg et bilan de fonction hépatique</button>. Il recherche le VHD par anticorps anti-VHD, puis l’ARN VHD si les anticorps sont positifs. Le VHC et le VIH sont également recherchés selon cette évaluation. Une échographie au diagnostic et une méthode non invasive de fibrose complètent le bilan. Les examens et leur interprétation détaillée figurent dans l’onglet « Examens complémentaires ». <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, tableaux 5–6</a>.</p>
<p>Une ALAT élevée indique une atteinte des hépatocytes, mais ne prouve pas que le VHB en soit la seule cause. Une ALAT normale n’exclut ni fibrose ni risque de cancer. Un ADN VHB mesurable indique une réplication ; son niveau prend sens avec l’ALAT, la fibrose et les facteurs de risque. Les tests répétés aident à identifier une phase stable ou un changement de phase. Pour la patiente, aucune de ces valeurs ne peut être inventée.</p>
<p>Le diagnostic différentiel comprend les <button class="w" data-k="b18-pa-differentiel">autres causes d’atteinte hépatique</button> : alcool, maladie métabolique, médicament, auto-immunité ou autre infection. Plusieurs causes peuvent agir ensemble. Une sérologie anti-VHC positive après guérison ne démontre pas une infection active ; l’ARN VHC distingue exposition passée et virémie actuelle. Chez une personne immunodéprimée avec enzymes inexpliquées, la recherche d’ARN VHE prend une valeur particulière. <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHC 2020, diagnostic</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHE 2018, diagnostic</a>.</p>
<div class="quiz ui"><p>Chez la patiente HBsAg positive depuis plus de six mois, quelle conclusion est déjà fondée ?</p><button data-ok="1">Le VHB est chronique ; l’activité, la fibrose et le statut VHD restent à établir.</button><button data-ok="0">Une ALAT normale et l’absence de fibrose sont acquises.</button><button data-ok="0">Le sous-code B18.13 est établi sans autre examen.</button><p class="fb" hidden>L’HBsAg persistant définit la durée. Le bilan virologique, hépatique et VHD détermine ensuite l’activité, le risque et le codage.</p></div>
<div class="key"><b>À retenir.</b> Le bilan initial répond à des questions différentes : quel virus, quelle réplication, quelle lésion, quelle autre cause ? Les décisions thérapeutiques suivent cette caractérisation.</div></section>

<section class="ilot" id="b18-pa-5"><h2><span class="n">5</span>Urgences : reconnaître la défaillance hépatique</h2>
<div class="alert"><b>Évaluation urgente.</b> Une confusion nouvelle, un saignement digestif, une ascite rapidement aggravée, une hypotension ou un ictère accompagné d’un trouble de la coagulation appellent une évaluation immédiate. Ils peuvent révéler une décompensation ou une autre maladie grave. Le résultat de l’ADN viral ne doit pas retarder la stabilisation.</div>
<p>Chez une personne avec cirrhose connue, la <button class="w" data-k="b18-pa-decompensation">décompensation</button> peut associer ascite, hémorragie variqueuse ou encéphalopathie. Une forte hausse des transaminases sous immunosuppression peut annoncer une réactivation VHB. Une poussée inflammatoire n’est pourtant pas automatiquement due au VHB : toxicité médicamenteuse, ischémie, obstruction biliaire et autres infections restent possibles. Le spécialiste confronte la chronologie, la fonction hépatique et la virologie. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, réactivation et maladie avancée</a>.</p>
<p>La patiente du cas ne présente aucun signe rapporté. Cela ne permet pas de conclure qu’elle n’en a pas. Si le bilan révèle une cirrhose décompensée ou une forte altération de la fonction hépatique, l’organisation des soins change immédiatement, indépendamment de l’étiquette de phase.</p>
<div class="key"><b>À retenir.</b> Une défaillance hépatique est une urgence clinique. Le traitement du virus et le bilan étiologique avancent en parallèle de la stabilisation.</div></section>

<section class="ilot" id="b18-pa-6"><h2><span class="n">6</span>VHB : traiter selon le risque et les résultats</h2>
<p>La décision de traiter le VHB ne dépend pas d’un seul seuil. L’EASL 2025 considère comme candidates les personnes HBsAg positives dont l’ADN est détectable. Elle recommande en particulier un antiviral en cas d’hépatite chronique avec ADN VHB d’au moins <b>2 000 UI/mL</b> et ALAT élevée ou fibrose significative. Elle recommande aussi le traitement d’une personne cirrhotique dès que l’ADN VHB est détectable, quelle que soit l’ALAT. D’autres situations, comme un haut risque de cancer ou une immunosuppression, modifient la décision. <button class="w" data-k="b18-pa-indications">Indications EASL et leurs limites</button> détaille les conditions. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, section « Treatment indications »</a>.</p>
<p>Une infection HBeAg négative avec ADN durablement inférieur à 2 000 UI/mL, ALAT constamment normale et absence de fibrose significative peut relever d’une surveillance sans traitement immédiat. Ces qualificatifs exigent plusieurs observations. La patiente n’a encore aucun résultat permettant de la placer dans ce groupe. Le calendrier de la première année sert précisément à éviter de figer une phase à partir d’un prélèvement isolé. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, tableau 7</a>.</p>
<p>Lorsque l’indication est retenue, les analogues nucléos(t)idiques à forte barrière de résistance, notamment <button class="w" data-k="b18-pa-antiviraux-vhb">entécavir et ténofovir</button>, suppriment durablement la réplication chez de nombreux patients. Ils réduisent les complications, mais la disparition de l’HBsAg reste rare et l’arrêt peut provoquer une rechute. La fonction rénale, les antécédents de résistance, une grossesse éventuelle et les produits disponibles en Suisse orientent le choix. Les doses et adaptations exigent la vérification de l’information professionnelle suisse dans l’onglet « Pharmacologie ». <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, options et arrêt</a>.</p>
<button class="pareto-btn ui" data-k="b18-pa-pareto-vhb">▲ Loi de Pareto — Décider sans inventer les résultats</button>
<div class="key"><b>À retenir.</b> Une cirrhose avec ADN VHB détectable change fortement la décision. Une faible virémie isolée n’équivaut pas à une absence de risque. Le choix du produit nécessite le dossier complet.</div></section>

<section class="ilot" id="b18-pa-7"><h2><span class="n">7</span>VHC, VHD et VHE : trois décisions distinctes</h2>
<p>Pour le <button class="w" data-k="b18-pa-vhc-traitement">VHC avec ARN détectable</button>, l’EASL 2020 recommande un traitement antiviral direct de l’infection chronique, en tenant compte de l’espérance de vie et du contexte. L’objectif est une réponse virologique soutenue, habituellement évaluée par l’ARN à douze semaines après la fin du traitement. Cette réponse correspond à la guérison virologique de l’épisode traité ; elle ne protège pas d’une nouvelle infection. La cirrhose décompensée, les interactions et un traitement antérieur modifient le schéma. <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, recommandations VHC, 2020, sections « Treatment goals » et « Indications »</a>.</p>
<p>Pour le <button class="w" data-k="b18-pa-vhd-traitement">VHD actif</button>, l’ARN VHD confirme la réplication. L’EASL 2023 propose une évaluation thérapeutique pour chaque hépatite D chronique et distingue le foie compensé du foie décompensé. Le bulévirtide est une option dans la maladie compensée, sous conditions d’autorisation et d’accès suisses à vérifier ; l’interféron pégylé exige une sélection stricte et ne convient pas à une cirrhose décompensée. La suppression du VHB par un analogue ne garantit pas celle du VHD. <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHD 2023, diagnostic et traitement</a>.</p>
<p>Pour un <button class="w" data-k="b18-pa-vhe-traitement">VHE persistant chez une personne immunodéprimée</button>, l’EASL 2018 recommande d’abord de discuter une réduction possible de l’immunosuppression dans le cadre de la greffe ou de la maladie traitée. Une ribavirine peut ensuite être envisagée dans des situations sélectionnées, avec des limites importantes, notamment grossesse, anémie et fonction rénale. Cette recommandation ancienne et les autorisations suisses doivent être revérifiées avant prescription. Rien dans le cas de la patiente ne suggère à ce stade un VHE chronique. <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHE 2018, infection chronique</a>.</p>
<div class="key"><b>À retenir.</b> Le VHC peut être guéri virologiquement, mais une réinfection reste possible. Le VHD nécessite son ARN et une stratégie propre. Le VHE chronique concerne surtout un terrain immunodéprimé.</div></section>

<section class="ilot" id="b18-pa-8"><h2><span class="n">8</span>Prévention : protéger les contacts et anticiper la réactivation</h2>
<p>La prévention du VHB associe <button class="w" data-k="b18-pa-vaccination">vaccination des personnes susceptibles</button>, accès au dépistage pour les partenaires et les contacts, et mesures adaptées aux expositions sanguines ou sexuelles. Le statut immunitaire se vérifie avant de conclure qu’un contact est protégé. La vaccination VHB prévient aussi l’acquisition du VHD chez une personne non infectée par le VHB. Elle ne traite pas un VHB déjà chronique. Pour le VHC, la prévention repose surtout sur l’absence de partage de matériel d’injection et la réduction des expositions sanguines ; le traitement de l’infection n’empêche pas une réinfection. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, prévention</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHC 2020, réinfection</a>.</p>
<p>Une <button class="w" data-k="b18-pa-reactivation">immunosuppression</button> peut réactiver un VHB silencieux parce qu’elle affaiblit le contrôle immunitaire du virus persistant dans le foie. Le risque concerne les personnes HBsAg positives et, selon le traitement immunosuppresseur, certaines personnes HBsAg négatives mais anti-HBc positives. Le plan dépend du statut sérologique, du médicament immunosuppresseur et de la durée : prophylaxie antivirale ou surveillance étroite. Une chimiothérapie ne devrait pas commencer avec un statut VHB interprété à moitié. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, prophylaxie de réactivation</a>.</p>
<div class="key"><b>À retenir.</b> La prévention protège les personnes exposées et évite une réactivation liée aux soins. Le traitement antiviral d’un patient ne remplace ni la vaccination des contacts susceptibles ni la prévention des expositions.</div></section>

<section class="ilot" id="b18-pa-9"><h2><span class="n">9</span>Suivi : réplication, fibrose et cancer du foie</h2>
<p>Chez une personne avec VHB chronique nouvellement diagnostiqué et encore non traitée, l’EASL 2025 recommande de répéter ALAT et ADN VHB tous les <b>trois à six mois pendant la première année</b>. Le rythme devient ensuite individuel selon la phase et les risques. Un seul prélèvement normal ne suffit pas à constater une stabilité. Sous antiviral, le suivi vérifie suppression virologique, tolérance, prise réelle et fonction rénale selon le produit. Un arrêt éventuel d’analogue est une décision spécialisée assortie d’une surveillance, car une poussée après retrait peut être dangereuse. <button class="w" data-k="b18-pa-suivi-vhb">Cadence et limites du suivi VHB</button> détaille ces points. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, tableau 7 et arrêt des analogues</a>.</p>
<p>Le <button class="w" data-k="b18-pa-chc">dépistage du carcinome hépatocellulaire</button> dépend du risque, en particulier d’une cirrhose, d’une fibrose avancée, d’un VHD chronique ou de certains profils sans cirrhose. Pour une personne à risque retenue dans un programme, l’EASL 2025 recommande une échographie abdominale tous les <b>six mois</b>. L’AFP peut compléter l’imagerie ; elle ne la remplace pas. Une échographie techniquement mauvaise peut imposer une autre modalité. Un traitement antiviral efficace ou la perte de l’HBsAg ne supprime pas automatiquement cette surveillance chez une personne qui reste à risque. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, surveillance du CHC, tableau 11</a>.</p>
<p>Après guérison virologique du VHC, une personne cirrhotique garde un risque de cancer et relève d’une surveillance si un traitement à visée curative reste possible. Pour une fibrose avancée <em>sans</em> cirrhose, l’EASL VHC 2020 proposait encore la surveillance ; la recommandation spécifique EASL CHC de <b>février 2025</b> ne la recommande plus systématiquement, faute de preuve suffisante d’un bénéfice. Le <button class="w" data-k="b18-pa-f3-divergence">changement de recommandation après guérison VHC</button> impose de vérifier la réalité d’une cirrhose et de discuter le risque individuel. Une nouvelle exposition demande un nouveau test ARN VHC ; les anticorps restent souvent positifs après guérison. Le suivi traite également alcool, maladie métabolique et autres causes de lésion hépatique. <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL CHC 2025, p. 320–321</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHC 2020, recommandation antérieure</a>.</p>
<div class="quiz ui"><p>Après suppression durable du VHB sous traitement, une patiente cirrhotique peut-elle abandonner l’échographie de surveillance ?</p><button data-ok="1">Non. La suppression réduit le risque, mais la cirrhose justifie encore une surveillance du cancer si un traitement curatif reste envisageable.</button><button data-ok="0">Oui. Un ADN VHB indétectable annule immédiatement tout risque de cancer.</button><button data-ok="0">Oui, si les ALAT sont normales lors d’une visite.</button><p class="fb" hidden>La cicatrice hépatique et les autres facteurs de risque persistent souvent malgré le contrôle viral. Le programme d’échographie suit le risque global, pas seulement le dernier ADN.</p></div>
<button class="pareto-btn ui" data-k="b18-pa-pareto-suivi">▲ Loi de Pareto — Le suivi qui prévient les complications</button>
<div class="key"><b>À retenir.</b> Le suivi VHB montre les changements de phase et la réponse au traitement. La surveillance du cancer dépend du risque résiduel. Après guérison VHC, une cirrhose éligible reste surveillée ; une fibrose avancée sans cirrhose demande une appréciation individualisée selon l’EASL CHC 2025.</div></section>

<section class="ilot" id="b18-pa-10"><h2><span class="n">10</span>Populations particulières et limites d’application</h2>
<p>Une grossesse, un projet de grossesse ou une naissance exposée au VHB nécessitent une évaluation périnatale et un choix médicamenteux adaptés. Une coinfection VIH/VHB impose de conserver une activité contre les deux virus dans tout changement de traitement. Une greffe, une hémodialyse ou un traitement immunosuppresseur modifient les tests, les risques et les médicaments possibles. La fenêtre <button class="w" data-k="b18-pa-contextes">contextes particuliers</button> indique les décisions qui demandent une équipe spécialisée. <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, populations particulières</a>.</p>
<p>Les recommandations citées sont européennes et datées ; les informations professionnelles et les conditions d’accès suisses doivent être vérifiées avant toute prescription. L’EASL VHC 2020 et l’EASL VHE 2018 ne constituent pas une preuve d’actualité de chaque médicament en 2026. La classification BfArM 2024 correspond au catalogue local de ce cours, mais ne démontre ni la règle de facturation en Suisse ni une correspondance automatique avec la CIM-11. <button class="w" data-k="b18-pa-sources">Périmètre des sources et limites</button> explicite ce cadre.</p>
<div class="key"><b>Pour la patiente.</b> Le VHB chronique est établi. Le médecin complète ALAT, ADN VHB, HBeAg, anti-VHD avec ARN si positif, fonction hépatique, fibrose et échographie. Il examine les signes de gravité, les risques de transmission et une éventuelle immunosuppression. La décision thérapeutique et le sous-code précis attendent ces données.</div></section>
