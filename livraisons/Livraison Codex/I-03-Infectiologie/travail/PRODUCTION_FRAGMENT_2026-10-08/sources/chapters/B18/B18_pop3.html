<template data-pop="b18-ph-hbsag" data-title="Ag HBs persistant : ce que prouve la chronicité"><div class="lab">Définition</div><p>Deux détections de l'antigène de surface du VHB séparées de plus de six mois indiquent une infection chronique. L'antigène signale la présence du virus ; il ne mesure pas la réplication. L'ADN VHB, les ALAT et la fibrose renseignent l'activité et le retentissement qui orientent un traitement.</p><div class="lab">Application</div><p>La chronicité est établie chez Mme R., mais sa charge virale et sa réserve hépatique restent inconnues. Aucun analogue ne peut être choisi à partir de l'Ag HBs seul.</p><div class="src">Source : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, définition et algorithme thérapeutique</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-ccc" data-title="cccDNA : pourquoi la suppression du VHB n'est pas une guérison"><div class="lab">Mécanisme</div><p>Dans le noyau de l'hépatocyte, l'ADN circulaire fermé covalent du VHB persiste comme matrice de transcription. Les analogues inhibent la synthèse de nouveaux génomes, mais ne détruisent pas directement ce réservoir. L'ADN sanguin peut donc devenir indétectable alors que le risque de reprise demeure à l'arrêt.</p><div class="lab">Conséquence</div><p>La perte de l'Ag HBs est un objectif plus exigeant que la suppression de l'ADN VHB. La décision d'arrêt suit des critères et une surveillance spécialisée ; une suppression isolée ne suffit pas.</p><div class="src">Source : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, objectifs et interruption des analogues</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-aad" data-title="AAD du VHC : trois cibles utiles"><div class="lab">Mécanismes</div><p>Les inhibiteurs de NS5B interrompent la copie de l'ARN VHC. Les inhibiteurs de NS5A perturbent l'assemblage du complexe de réplication. Les inhibiteurs de protéase NS3/4A bloquent la maturation de protéines virales. Une combinaison adaptée réduit le risque d'échappement et permet une réponse virologique soutenue.</p><div class="lab">Limite</div><p>Ces classes ciblent le VHC, pas le VHB. Un inhibiteur de protéase n'est pas approprié dans une cirrhose décompensée, et les co-médications peuvent imposer une autre combinaison.</p><div class="src">Source : <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI, avis VHC janvier 2021, sections « Practical use » et « Special patient populations »</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-etv" data-title="Entécavir : efficacité et résistance préalable"><div class="lab">Action</div><p>L'entécavir est un analogue nucléosidique à forte barrière de résistance chez une personne jamais exposée à la lamivudine. Il diminue l'ADN VHB par inhibition de la polymérase virale.</p><div class="lab">Choix</div><p>Une résistance antérieure à la lamivudine accroît fortement le risque d'échec sous entécavir. La fonction rénale influe sur sa dose, qui doit être vérifiée dans l'information suisse du produit. EASL 2025 ne le recommande pas pendant la grossesse.</p><div class="src">Sources : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, analogues et résistance</a> ; <a href="https://www.who.int/publications/i/item/9789240090903" target="_blank" rel="noopener" data-reference-source="1">OMS VHB 2024, première ligne</a>. Lecture intégrale le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-tdf" data-title="TDF : efficacité durable et risque tubulaire"><div class="lab">Action</div><p>Le ténofovir disoproxil fournit un inhibiteur de la polymérase VHB. L'EASL 2025 le retient en première ligne, avec une résistance cliniquement significative très rare lorsque l'exposition est suffisante.</p><div class="lab">Surveillance</div><p>Le rein élimine le médicament. Une baisse de filtration, une perte urinaire de phosphate ou de protéines et une fragilité osseuse peuvent conduire à TAF ou à une autre stratégie. La dose et les seuils du produit exact se lisent dans sa notice suisse ; ils ne se déduisent pas de la seule classe.</p><div class="src">Sources : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, efficacité et surveillance rénale</a> ; <a href="https://www.who.int/publications/i/item/9789240090903" target="_blank" rel="noopener" data-reference-source="1">OMS VHB 2024</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-taf" data-title="TAF : moins d'exposition rénale et osseuse, avec limites"><div class="lab">Comparaison</div><p>Le ténofovir alafénamide apporte le même métabolite antiviral actif que TDF avec une distribution différente. Dans les études citées par EASL 2025, la baisse de filtration et de densité minérale osseuse était moindre sous TAF, tandis que la suppression de l'ADN VHB était comparable.</p><div class="lab">Limites</div><p>Le choix tient aussi compte de l'accès au produit, des lipides, de la grossesse et d'une insuffisance rénale très avancée. EASL signale davantage d'élévation lipidique sous TAF que sous TDF. La notice suisse actuelle fixe les restrictions exactes.</p><div class="src">Source : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, comparaison TAF/TDF</a>, consultée le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-peg" data-title="Interféron pégylé pour le VHB : une option sélectionnée"><div class="lab">Intérêt</div><p>Le traitement module la réponse antivirale de l'hôte et a une durée définie, à la différence de nombreux traitements par analogue. Une perte durable de l'Ag HBs demeure rare et ne peut être promise avant le traitement.</p><div class="lab">Limites</div><p>Le médecin doit considérer la tolérance, les cytopénies, l'état psychiatrique, les maladies auto-immunes et la compensation hépatique. Une cirrhose décompensée contre-indique l'interféron. La sélection ne découle pas du seul Ag HBs positif.</p><div class="src">Source : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, comparaison des analogues et du PEG-IFNα</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-rein" data-title="Rein et analogues VHB : ce qu'il faut mesurer"><div class="lab">Pourquoi la créatinine seule ne suffit pas</div><p>Le TDF peut toucher le tubule proximal avant qu'une baisse nette de filtration ne soit visible. Une protéinurie et une perte de phosphate orientent vers cette atteinte. EASL 2025 conseille une évaluation rénale avant le début, puis une surveillance régulière ; sous TDF, phosphate sanguin et urinaire ainsi que protéines urinaires sont particulièrement utiles.</p><div class="lab">Conduite</div><p>Une tubulopathie, une hypophosphatémie ou une dégradation de filtration justifie de réévaluer le TDF. Le remplacement dépend des résistances et de la notice suisse du nouveau produit.</p><div class="src">Source : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, sécurité rénale des analogues</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-arret" data-title="Arrêt d'un analogue VHB : éviter la poussée de reprise"><div class="lab">Mécanisme</div><p>Le cccDNA reste présent sous ADN VHB sanguin indétectable. Lorsque l'inhibition pharmacologique cesse, la réplication peut reprendre et provoquer une élévation des ALAT, parfois grave en cas de cirrhose.</p><div class="lab">Limite pratique</div><p>L'EASL 2025 décrit des possibilités d'arrêt chez des patients sélectionnés, sous surveillance virologique et biologique rapprochée. Cette stratégie exige des critères, une capacité de suivi et une conduite de reprise. Rien dans le dossier de Mme R. ne permet de la programmer.</p><div class="src">Source : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, interruption des analogues</a>, consultée le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-sofvel" data-title="Sofosbuvir/velpatasvir : polymérase et NS5A"><div class="lab">Association</div><p>Le sofosbuvir inhibe la polymérase NS5B du VHC, tandis que le velpatasvir agit sur NS5A. Leur association est pangénotypique dans l'avis suisse SASL/SSG/SSI de 2021.</p><div class="lab">Conditions</div><p>Une décompensation hépatique, un traitement antérieur et des interactions peuvent modifier le schéma. L'amiodarone associée au sofosbuvir expose à une bradycardie sévère ; l'augmentation du pH gastrique diminue l'absorption du velpatasvir. La dose et l'horaire propres au produit se vérifient dans la notice suisse actuelle.</p><div class="src">Source : <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI VHC janvier 2021, section velpatasvir/sofosbuvir</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-glepib" data-title="Glécaprévir/pibrentasvir : protéase et NS5A"><div class="lab">Association</div><p>Le glécaprévir inhibe la protéase NS3/4A et le pibrentasvir inhibe NS5A. L'association agit sur plusieurs génotypes du VHC ; son emploi dépend du stade de cirrhose et des traitements précédents.</p><div class="lab">Contre-indication clinique</div><p>Un inhibiteur de protéase s'accumule lorsque la fonction hépatique est décompensée. L'avis suisse 2021 contre-indique cette association en Child-Pugh B/C et après une décompensation. Il relève aussi une interaction avec la contraception contenant de l'éthinylestradiol. La notice suisse actuelle doit préciser la conduite avant prescription.</p><div class="src">Source : <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI VHC janvier 2021, section glécaprévir/pibrentasvir</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-decomp" data-title="Cirrhose décompensée : elle interdit les inhibiteurs de protéase VHC"><div class="lab">Définition pratique</div><p>Ascite, hémorragie variqueuse, encéphalopathie ou ictère d'insuffisance hépatique suggèrent une décompensation. Le score Child-Pugh complète l'évaluation ; une histoire de décompensation reste pertinente même si l'état paraît actuellement stabilisé.</p><div class="lab">Conséquence thérapeutique</div><p>Les régimes VHC contenant glécaprévir, grazoprévir ou voxilaprévir sont contre-indiqués chez les patients Child-Pugh B/C ou après décompensation dans l'avis suisse 2021. Un centre expérimenté choisit l'option et évalue la transplantation.</p><div class="src">Source : <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI VHC janvier 2021, « Patients with decompensated cirrhosis »</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-svr" data-title="SVR12 : une preuve virologique, pas un test d'anticorps"><div class="lab">Mesure</div><p>Une absence d'ARN VHC douze semaines après la fin d'un traitement AAD définit la réponse virologique soutenue à douze semaines. Cette mesure juge l'effet antiviral après l'arrêt, lorsque le médicament ne masque plus seulement la réplication.</p><div class="lab">Limites</div><p>Les anticorps anti-VHC peuvent persister et ne servent pas à vérifier la guérison. Une nouvelle exposition peut causer une réinfection ; l'ARN est alors l'examen utile. Une cirrhose antérieure peut nécessiter un suivi du risque de cancer malgré SVR12.</p><div class="src">Source : <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI VHC janvier 2021, surveillance de l'ARN et suivi après SVR</a>, lu le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-hdvrna" data-title="ARN VHD : condition de traitement d'une hépatite delta active"><div class="lab">Séquence diagnostique</div><p>Le VHD ne se propage que chez une personne porteuse de l'Ag HBs. Un anti-VHD positif signale une exposition, tandis qu'un ARN VHD détectable établit une réplication actuelle. L'ARN conditionne l'indication suisse du bulévirtide.</p><div class="lab">Application</div><p>Seul l'Ag HBs de Mme R. est connu. Il faut demander le dépistage VHD puis l'ARN si l'anticorps est positif ; aucune réplication VHD ne peut être présumée.</p><div class="src">Sources : <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHD 2023</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=EN&amp;authNr=68338" target="_blank" rel="noopener" data-reference-source="1">FI Hepcludex juillet 2026</a>. Lecture le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-blv" data-title="Hepcludex : indication et dose suisse à jour"><div class="lab">Indication actuelle</div><p>La FI suisse Hepcludex n° 68338, mise à jour en juillet 2026, vise l'hépatite delta chronique avec ARN VHD positif et foie compensé. Elle inclut les adultes et certains enfants dès trois ans et 10 kg ; le présent cours expose seulement l'adulte.</p><div class="lab">Dose adulte et mécanisme</div><p>La dose nominale recommandée pour l'adulte est de 2 mg sous la peau une fois par jour. La FI précise qu'environ 1,7 mg sont effectivement administrés après la perte dans le dispositif ; ce n'est pas une seconde dose à prescrire. Le bulévirtide bloque NTCP et l'entrée virale. La durée optimale n'est pas établie par EASL 2023.</p><div class="src">Source primaire : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=EN&amp;authNr=68338" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Hepcludex 68338, juillet 2026, texte intégral allemand</a> ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHD 2023</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-blv-suivi" data-title="Bulévirtide : réponse, tolérance et interactions"><div class="lab">Ce qui se mesure</div><p>Le médecin suit l'ARN VHD, les ALAT et la fonction du foie pour distinguer réponse virologique, amélioration biologique et progression clinique. Une baisse de l'ARN sous traitement n'est pas une preuve d'éradication après son arrêt.</p><div class="lab">Précautions de la FI</div><p>La FI suisse de juillet 2026 rapporte surtout céphalées, réaction d'injection, prurit et augmentation des sels biliaires. Elle déconseille certains inhibiteurs de NTCP, notamment ciclosporine, irbésartan, ézétimibe, ritonavir et sulfasalazine. La liste complète et les substrats OATP demandent une vérification du traitement réel.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=EN&amp;authNr=68338" target="_blank" rel="noopener" data-reference-source="1">Swissmedicinfo, FI Hepcludex 68338, juillet 2026, sections interactions et effets indésirables</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-peg-hdv" data-title="Interféron pégylé dans le VHD : bénéfice et sélection"><div class="lab">Option</div><p>L'EASL 2023 recommande de considérer l'interféron pégylé chez les patients ayant une hépatite delta et un foie compensé. Son effet associe inhibition virale et modulation immunitaire ; la réponse peut persister après la durée finie de traitement chez certains patients.</p><div class="lab">Limites</div><p>La réponse durable n'est pas garantie et une rechute tardive du VHD est possible. Les effets indésirables, les contre-indications et une cirrhose décompensée limitent son emploi. La combinaison avec le bulévirtide demande une appréciation individualisée.</p><div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHD 2023, approche thérapeutique</a>, lue le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-reactivation" data-title="AAD contre VHC : anticiper la reprise du VHB"><div class="lab">Mécanisme et dépistage</div><p>Les AAD ciblent le VHC. Ils ne suppressent pas le VHB présent dans les hépatocytes ; l'équilibre viral et immunitaire peut changer pendant la cure. La réactivation peut se manifester par une hausse de l'ADN VHB et des ALAT, parfois par une hépatite sévère. L'avis suisse 2021 prévoit Ag HBs, anti-HBc et anti-HBs avant les AAD.</p><div class="lab">Règle européenne de 2025</div><p>Chez une personne Ag HBs positive avec cirrhose, EASL recommande fortement un analogue du VHB pendant les AAD, même si l'ADN VHB est indétectable. Sans cirrhose et sans indication autonome VHB, la prophylaxie peut être proposée, mais la recommandation est faible. Le médecin apprécie le risque et la fiabilité d'une surveillance. Si un analogue préventif est débuté, EASL préconise au moins douze semaines après la fin des AAD et une stratégie d'arrêt surveillée. Une indication propre du VHB peut conduire à le poursuivre davantage.</p><div class="lab">Différence avec l'avis suisse de 2021</div><p>Le texte SASL/SSG/SSI 2021 recommandait un analogue à tous les Ag HBs positifs pendant les AAD et au moins douze semaines après, puis une surveillance mensuelle à l'arrêt. La recommandation EASL 2025 plus récente nuance cette conduite selon la cirrhose et l'indication propre du VHB. Le choix pour Mme R. attend les résultats VHC, ADN VHB et fibrose.</p><div class="src">Sources : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, pages 38–39, co-infection VHB/VHC</a> ; <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI VHC janvier 2021, bilan préthérapeutique</a>. Textes intégraux lus le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-interactions" data-title="Interactions antivirales : contrôler le produit exact"><div class="lab">VHC</div><p>Le sofosbuvir associé à l'amiodarone peut provoquer une bradycardie sévère. Un inhibiteur de la pompe à protons réduit l'absorption du velpatasvir ; l'horaire et la dose admissibles dépendent de la notice du produit. Glécaprévir/pibrentasvir présente notamment des interactions avec la contraception contenant de l'éthinylestradiol.</p><div class="lab">VHD</div><p>La FI Hepcludex déconseille plusieurs inhibiteurs de NTCP et appelle à la prudence avec des substrats OATP. Une même patiente peut recevoir antiviraux, immunosuppresseurs et médicaments usuels : le pharmacien et le prescripteur vérifient chaque association avant la prise.</p><div class="src">Sources : <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI VHC janvier 2021</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=EN&amp;authNr=68338" target="_blank" rel="noopener" data-reference-source="1">FI Hepcludex juillet 2026</a>. Textes lus le 8 octobre 2026 ; les notices des autres produits doivent être revérifiées.</div></template>

<template data-pop="b18-ph-hcc" data-title="Suppression virale et cancer du foie : deux résultats distincts"><div class="lab">Risque résiduel</div><p>La suppression de l'ADN VHB réduit la lésion inflammatoire et les complications, mais elle n'efface pas une cirrhose ou tous les facteurs de carcinogenèse. De même, la SVR12 après VHC n'annule pas forcément le risque si une cirrhose existait avant la cure.</p><div class="lab">Conséquence</div><p>Le médecin décide la surveillance du carcinome hépatocellulaire selon le virus, la cirrhose et les facteurs de risque. Les critères VHB et les critères post-VHC ne se confondent pas ; l'onglet Pathologie précise leur application.</p><div class="src">Sources : <a href="https://www.hepb.org/assets/Uploads/EASL-guidelines-May-2025.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, surveillance CHC</a> ; <a href="https://sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL/SSG/SSI VHC 2021, suivi après SVR</a>. Textes lus le 8 octobre 2026.</div></template>

<template data-pop="b18-ph-hev" data-title="VHE chronique chez un greffé : protéger le foie et la greffe"><div class="lab">Séquence de 2018</div><p>La recommandation EASL 2018 décrit le VHE chronique surtout chez les personnes immunodéprimées, notamment après greffe d'organe. Si la réplication persiste, une réduction prudente de l'immunosuppression peut permettre une clairance, mais le risque de rejet impose une décision conjointe avec l'équipe de transplantation.</p><div class="lab">Traitement spécialisé et limites</div><p>Si la réduction est impossible ou insuffisante, EASL 2018 discute la ribavirine. L'anémie et la fonction rénale limitent son emploi ; aucune dose n'est donnée ici faute de notice suisse actuelle vérifiée. L'avis date de 2018 et ne s'applique pas à Mme R., dont ni la greffe ni l'ARN VHE ne sont documentés.</p><div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, recommandations VHE 2018, figure 2 et section « Treatment of chronic HEV infection in solid organ transplant recipients »</a>, texte intégral lu le 8 octobre 2026.</div></template>

<template data-pop="pareto-b18-ph" data-title="Loi de Pareto — Pharmacologie de l'hépatite virale chronique"><div class="ratio" data-cover="b18-p-1,b18-p-2,b18-p-3,b18-p-4,b18-p-5,b18-p-6">Les décisions qui organisent l'essentiel du raisonnement</div><ul><li>Une infection VHB chronique prouvée ne suffit pas à choisir un antiviral : ADN VHB, ALAT, fibrose, rein et contexte personnel sont nécessaires.</li><li>Entécavir, TDF et TAF suppriment la réplication du VHB sans garantir sa guérison ; l'arrêt n'est jamais banal.</li><li>Un VHC avec ARN positif se traite par AAD adaptés au foie et aux interactions ; SVR12 vérifie la réponse après la cure.</li><li>Un VHD avec ARN positif et foie compensé peut relever du bulévirtide ; sa notice suisse juillet 2026 fixe indication et dose adulte.</li><li>Avant un AAD du VHC, les marqueurs VHB et la stratégie de prévention d'une réactivation doivent être connus.</li><li>Une réponse virologique ne supprime pas automatiquement la surveillance du foie lorsque le risque de cancer persiste.</li></ul><div class="key">Cette synthèse ne remplace ni l'évaluation individuelle, ni les notices suisses, ni les limites datées des recommandations citées.</div></template>
