

<template data-pop="b18-pa-phases" data-title="Phases VHB : une trajectoire, pas une ALAT isolée">
<div class="lab">Quatre profils utiles</div><p>L’EASL 2025 décrit une infection HBeAg positive à ALAT habituellement normale (phase 1), puis une hépatite HBeAg positive avec inflammation (phase 2). Après perte de HBeAg, une infection à réplication généralement faible et ALAT normale correspond à la phase 3 ; une hépatite HBeAg négative avec activité virale et inflammatoire correspond à la phase 4. Les valeurs « habituelles » ne sont pas des frontières absolues.</p>
<div class="lab">Piège clinique</div><p>Une ALAT peut fluctuer, et d’autres maladies du foie peuvent l’élever. L’ADN VHB, HBeAg, la fibrose et les mesures répétées évitent de confondre absence momentanée d’inflammation et phase stable. L’EASL conseille de répéter ALAT et ADN VHB tous les trois à six mois la première année après le diagnostic.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, Clinical Practice Guidelines VHB, 2025, tableaux 4 et 7</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-pareto-bases" data-title="Loi de Pareto — Définir, situer et confirmer">
<p class="ratio" data-cover="b18-pa-0,b18-pa-1,b18-pa-2,b18-pa-3,b18-pa-4,b18-pa-5,b18-pa-6,b18-pa-7"></p><ul><li>VHB chronique : Ag HBs ≥ 6 mois ; activité jugée sur ADN, ALAT et fibrose répétés ; quatre phases EASL selon l’Ag HBe.</li><li>VHD : seulement chez le porteur de l’Ag HBs ; anti-VHD au moins une fois, puis ARN.</li><li>VHC : anti-VHC puis ARN ; VHE chronique du greffé : ARN &gt; 3 mois.</li><li>Suisse 2024 : 13,5 déclarations d’hépatite B et 11,8 d’hépatite C pour 100 000.</li><li>ADNccc persistant : le VHB se contrôle ; le VHC se guérit dans environ 95 % des cas.</li><li>Élastographie : &gt; 7, &gt; 8 et &gt; 11 kPa pour fibrose significative, avancée et cirrhose.</li></ul></template>

<template data-pop="b18-pa-vhd" data-title="VHD : dépendance au VHB et surinfection">
<div class="lab">Pourquoi le VHD suit le VHB</div><p>Le virus delta utilise l’enveloppe portant HBsAg pour former des particules infectieuses. Il ne peut donc pas produire une infection transmissible indépendante du VHB. Une coinfection simultanée et une surinfection d’une personne déjà HBsAg positive n’ont pas la même chronologie clinique.</p>
<div class="lab">Ce que les tests établissent</div><p>L’EASL 2023 recommande des anticorps anti-VHD au moins une fois chez toute personne HBsAg positive. Un résultat positif prouve l’exposition et conduit à l’ARN VHD, qui identifie l’infection active. Une forte atteinte hépatique avec ADN VHB faible n’exclut pas le VHD. Le risque de progression du foie peut être élevé ; l’évaluation de fibrose reste nécessaire.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite delta, 2023, dépistage et diagnostic</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-vhe" data-title="VHE chronique : penser au terrain immunodéprimé">
<div class="lab">Définition et terrain</div><p>L’EASL 2018 rappelle que l’infection chronique par le VHE a d’abord été définie par une réplication persistante six mois ; chez le transplanté d’organe, la guérison spontanée ne survient en pratique que dans les trois premiers mois, de sorte qu’une virémie de plus de trois mois permet de parler d’infection chronique et d’envisager un traitement. Cette évolution n’a été décrite qu’avec les génotypes 3 et 4, surtout sous immunosuppression.</p><div class="lab">Piège diagnostique</div><p>La réponse en anticorps peut être faible sous immunosuppression. L’ARN du VHE dans le sang ou les selles établit l’infection et suit sa persistance ; une sérologie seule ou une ALAT élevée ne suffisent pas.</p><div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a>, infection chronique et diagnostic, lue le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-fibrose" data-title="Fibrose : cicatrisation et perte de réserve hépatique">
<div class="lab">Mécanisme et conséquence</div><p>Une inflammation répétée active la réparation du tissu hépatique et dépose de la matrice fibreuse. Lorsque cette cicatrice remanie l’architecture, la circulation portale et les fonctions de synthèse peuvent se détériorer. La cirrhose expose aussi au cancer du foie, même lorsque le virus devient supprimé.</p>
<div class="lab">Comment l’évaluer</div><p>L’élastographie et des scores sanguins estiment la fibrose sans biopsie systématique ; l’échographie recherche morphologie, tumeur et signes portaux. Une forte inflammation peut augmenter transitoirement la rigidité mesurée et faire surestimer la fibrose. Le résultat doit être lu avec la clinique et les analyses, puis vérifié si discordant.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation non invasive de la maladie hépatique</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-histoire" data-title="Anamnèse : ce que chaque question change">
<div class="lab">Durée et exposition</div><p>Les anciens résultats distinguent infection récemment détectée et ancienne infection déjà connue ; ils montrent aussi les changements de phase. Les antécédents familiaux de cancer du foie modifient le risque individuel. Les expositions sanguines, sexuelles et périnatales orientent la prévention et le dépistage des contacts sans permettre de juger une personne.</p>
<div class="lab">Facteurs qui changent la conduite</div><p>L’alcool et une maladie métabolique peuvent ajouter des lésions à celles du virus. Les traitements antérieurs peuvent sélectionner des résistances. Les médicaments actuels, compléments et immunosuppresseurs changent les interactions ou le risque de réactivation. Une grossesse éventuelle modifie la stratégie périnatale.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation initiale et situations spéciales</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-signes" data-title="Examen : reconnaître une cirrhose qui se complique">
<div class="lab">Signes à chercher</div><p>L’ictère reflète une accumulation de bilirubine et peut signaler une atteinte de l’excrétion hépatique. L’ascite peut traduire une hypertension portale et une baisse de réserve fonctionnelle. Confusion ou ralentissement peuvent évoquer une encéphalopathie ; un saignement digestif peut provenir de varices. Chaque signe possède aussi d’autres causes, qui doivent rester dans le diagnostic différentiel.</p>
<div class="lab">Limite de l’examen</div><p>Une fibrose avancée peut être présente sans signe visible. Le médecin mesure les constantes, recherche une défaillance et complète par analyses, élastographie et échographie.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation hépatique et complications</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-bilan-vhb" data-title="Bilan VHB : chaque mesure répond à une question">
<div class="lab">Virus et inflammation</div><p>L’ADN VHB quantifié mesure la réplication ; HBeAg et anti-HBe aident à décrire l’évolution. Une ALAT élevée indique une lésion des hépatocytes, mais n’en désigne pas seule la cause. Les mesures répétées montrent les fluctuations et permettent de classer la phase plus sûrement qu’une visite unique.</p>
<div class="lab">Fonction, fibrose et autres virus</div><p>La bilirubine, l’albumine et l’INR renseignent la fonction hépatique ; la numération, l’échographie et une méthode non invasive évaluent les complications et la fibrose. L’EASL 2025 recommande de rechercher anti-VHD, anti-VHC et VIH dans l’évaluation d’une personne HBsAg positive. Si anti-VHD est positif, l’ARN VHD établit la réplication. Le choix et la séquence des examens doivent suivre le contexte clinique.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, tableau 5 et évaluation du foie</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-differentiel" data-title="ALAT élevée : ne pas attribuer toute lésion au virus">
<div class="lab">Causes concomitantes</div><p>Une atteinte métabolique, l’alcool, un médicament, une maladie auto-immune ou une autre infection peuvent élever l’ALAT. Plusieurs mécanismes peuvent coexister avec un VHB chronique. La concordance entre chronologie, ADN VHB, HBeAg et lésion hépatique renforce ou affaiblit l’attribution au virus.</p>
<div class="lab">Deux confusions fréquentes</div><p>Une ALAT normale ne prouve pas l’absence de fibrose. Un anti-VHC positif ne démontre pas une virémie VHC actuelle : l’ARN VHC est nécessaire, car les anticorps peuvent rester positifs après guérison. Sous immunosuppression avec anomalies inexpliquées, l’ARN VHE peut être plus informatif que la sérologie.</p>
<div class="src">Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHC 2020</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHE 2018</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b18-pa-decompensation" data-title="Décompensation : la gravité prime sur la virologie">
<div class="lab">Pourquoi ces signes sont urgents</div><p>Une cirrhose peut entraîner une pression portale élevée, une production insuffisante d’albumine et de facteurs de coagulation, puis ascite, saignement ou encéphalopathie. Une infection, un médicament, une hémorragie ou une réactivation virale peuvent précipiter une décompensation. L’équipe évalue conscience, circulation, coagulation, fonction rénale et cause déclenchante sans attendre une classification virologique complète.</p>
<div class="lab">Limite</div><p>Un ictère isolé ou une confusion isolée ne prouve pas que le VHB est responsable. Le diagnostic différentiel demeure ouvert pendant la stabilisation. Une cirrhose décompensée appelle une équipe hépatologique et une évaluation de transplantation selon la situation.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, maladie avancée et réactivation</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-indications" data-title="VHB : indications EASL 2025 et conditions">
<div class="lab">Situations fortement étayées</div><p>Dans l’hépatite B chronique HBeAg positive ou négative, l’EASL recommande un traitement lorsque l’ADN VHB atteint au moins 2 000 UI/mL avec ALAT au-dessus de la normale ou fibrose significative. En présence de cirrhose, un ADN détectable suffit à recommander le traitement, quel que soit le niveau d’ALAT. La décision tient aussi compte d’une maladie avancée, d’un haut risque de cancer, de manifestations extra-hépatiques et d’une immunosuppression.</p>
<div class="lab">Ce que le seuil ne dit pas</div><p>Les 2 000 UI/mL ne constituent pas une limite universelle entre « malade » et « indemne ». Une infection Ag HBe négative, avec un ADN durablement bas, une ALAT constamment normale et sans fibrose, peut être surveillée ; cette stabilité se démontre par des mesures répétées.</p>
<div class="src">Source primaire : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, Clinical Practice Guidelines VHB, 2025, section « Treatment indications »</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-antiviraux-vhb" data-title="Analogues VHB : doses suisses, choix et arrêt">
<div class="lab">Bénéfice et limite biologique</div><p>L’entécavir et le ténofovir inhibent la réplication du VHB avec une forte barrière de résistance. La suppression de l’ADN réduit les lésions et les complications, mais l’ADNccc persiste dans les hépatocytes : la perte de l’Ag HBs reste rare. Un arrêt sans sélection ni surveillance peut déclencher une rechute et une hépatite sévère.</p><div class="lab">Doses de l’adulte selon l’information professionnelle suisse</div><p>Entécavir (Baraclude®) : 0,5 mg une fois par jour à jeun ; 1 mg en cas de résistance à la lamivudine ou de maladie décompensée ; adaptation dès une clairance &lt; 50 mL/min ; arrêt déconseillé en cas de cirrhose. Ténofovir disoproxil (Viread®) : 245 mg une fois par jour au repas ; toutes les 48 heures si clairance 30 à 49 mL/min ; contre-indiqué chez le dialysé. Ténofovir alafénamide (Vemlidy®) : 25 mg une fois par jour au repas ; aucune adaptation si clairance ≥ 15 mL/min ou sous hémodialyse ; non recommandé en Child-Pugh B ou C.</p><div class="lab">Choix</div><p>L’EASL demande de tenir compte du rein, de l’os, de la grossesse et des traitements antérieurs, et de remplacer le ténofovir disoproxil par l’entécavir ou le ténofovir alafénamide en cas de baisse de la filtration, de tubulopathie, d’hypophosphatémie ou d’ostéoporose.</p><div class="src">Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025</a>, options thérapeutiques et arrêt ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Baraclude®, Swissmedic (AIPS), mars 2026, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56251" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Viread®, Swissmedic (AIPS), juin 2024, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66190" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Vemlidy®, Swissmedic (AIPS), février 2024, consultée le 08.10.2026</a>.</div></template>

<template data-pop="b18-pa-pareto-vhb" data-title="Loi de Pareto — Qui traiter et avec quoi">
<p class="ratio" data-cover="b18-pa-8,b18-pa-9"></p><ul><li>Urgences : décompensation à stabiliser d’abord ; hausse des ALAT sous immunosuppression = réactivation jusqu’à preuve du contraire.</li><li>VHB : traiter si ADN ≥ 2000 UI/mL avec ALAT élevées ou fibrose significative, si cirrhose avec ADN détectable, si grossesse avec ADN ≥ 200 000 UI/mL.</li><li>Première ligne : entécavir 0,5 mg/jour, ténofovir disoproxil 245 mg/jour ou alafénamide 25 mg/jour, choisis selon rein, os et grossesse.</li><li>VHC : traiter toute infection ; sofosbuvir/velpatasvir 12 semaines ou glécaprévir/pibrentasvir 8 semaines ; inhibiteurs de protéase contre-indiqués en Child-Pugh B ou C.</li><li>VHD compensé : bulévirtide 2 mg/jour sous la peau ou interféron pégylé ; VHE du greffé : réduire l’immunosuppression, puis ribavirine.</li></ul></template>

<template data-pop="b18-pa-vhc-traitement" data-title="VHC : guérir l’épisode actif et prévenir la réinfection">
<div class="lab">Cible du traitement</div><p>Un ARN VHC détectable prouve une infection actuelle. Les antiviraux directs visent une réponse virologique soutenue, mesurée par ARN indétectable douze semaines après la fin du traitement. Selon l’EASL 2020, les personnes avec VHC chronique doivent en général être traitées sans délai ; une espérance de vie très limitée par une autre maladie est une exception. Le choix dépend notamment de la cirrhose, d’un traitement antérieur et des interactions.</p>
<div class="lab">Après la réponse</div><p>Les anticorps anti-VHC restent souvent positifs. Ils ne protègent pas d’une nouvelle infection ; en cas de nouvelle exposition, l’ARN est le test pertinent. Une cirrhose peut encore justifier la surveillance du cancer. La question de la fibrose F3 sans cirrhose est expliquée dans la fenêtre dédiée aux recommandations de 2025.</p>
<div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, traitement du VHC, mise à jour finale 2020</a>, consulté le 8 octobre 2026. Les produits et accès suisses de 2026 doivent être vérifiés.</div></template>

<template data-pop="b18-pa-vhd-traitement" data-title="VHD : traiter selon réplication et état du foie">
<div class="lab">Ce que recommande l’EASL 2023</div><p>Toute personne atteinte d’hépatite D chronique avec maladie hépatique compensée, cirrhotique ou non, doit être considérée pour un traitement par bulévirtide ou par interféron pégylé, ce dernier de préférence pendant 48 semaines. La dose et la durée optimales du bulévirtide n’étaient pas définies ; un traitement prolongé à 2 mg par jour pouvait être envisagé. L’association des deux peut se discuter en l’absence de contre-indication à l’interféron.</p><div class="lab">Information professionnelle suisse</div><p>Hepcludex® (bulévirtide) est indiqué en Suisse chez l’adulte et l’enfant de 3 ans ou plus pesant au moins 10 kg, avec maladie hépatique compensée et ARN du VHD positif ; la dose de l’adulte est de 2 mg une fois par jour par injection sous-cutanée, et le VHB sous-jacent est traité simultanément selon les directives. Sa sécurité n’a pas été étudiée en Child-Pugh B ou C ni si la clairance est inférieure à 60 mL/min.</p><div class="lab">Erreur à éviter</div><p>Supprimer l’ADN du VHB par un analogue ne fait pas disparaître l’ARN du VHD : les deux virus sont suivis.</p><div class="src">Sources : <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a>, traitement ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=68338" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Hepcludex®, Swissmedic (AIPS), juillet 2026, consultée le 08.10.2026</a>.</div></template>

<template data-pop="b18-pa-vhe-traitement" data-title="VHE chronique : immunosuppression et ribavirine">
<div class="lab">Recommandation EASL 2018</div><p>Chez le transplanté d’organe, l’EASL recommande de réduire l’immunosuppression dès le diagnostic d’hépatite E chronique si cela est possible. Si la réplication persiste trois mois après la détection de l’ARN, elle recommande une monothérapie par ribavirine pendant 12 semaines, puis un contrôle de l’ARN dans le sang et les selles ; si les deux sont indétectables, l’arrêt est suggéré.</p><div class="lab">Limites</div><p>La ribavirine expose à l’anémie et demande une surveillance de la fonction rénale ; la grossesse la contre-indique. Aucune information professionnelle suisse de ribavirine ne figure dans le corpus AIPS du 08.10.2026 : sa disponibilité et sa dose se règlent avec le centre de transplantation.</p><div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a>, traitement de l’infection chronique.</div></template>

<template data-pop="b18-pa-vaccination" data-title="Prévention VHB et VHD : vaccination suisse et immunité">
<div class="lab">Recommandation suisse</div><p>Selon l’OFSP, la vaccination contre l’hépatite B se fait de préférence chez le nourrisson depuis 2019 ; elle reste expressément recommandée à tous les jeunes de 11 à 15 ans non vaccinés et aux groupes particulièrement vulnérables. La couverture atteignait 81 % à 16 ans, mais elle est nettement plus basse chez les adultes sexuellement actifs. L’OFSP demande de vérifier le statut vaccinal à chaque dépistage du VIH ou d’une infection sexuellement transmissible et de commencer ou compléter immédiatement la vaccination.</p><div class="lab">Entourage et limites</div><p>L’EASL recommande de dépister les membres du foyer et les partenaires sexuels d’une personne infectée. Le vaccin protège une personne susceptible du VHB et, par conséquent, du VHD, qui exige l’Ag HBs ; il ne traite pas une infection chronique. Aucun vaccin n’existe contre le VHC.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a>, hépatite B, synthèse ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025</a>, dépistage ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a>.</div></template>

<template data-pop="b18-pa-reactivation" data-title="Réactivation du VHB sous immunosuppression">
<div class="lab">Mécanisme</div><p>Le VHB persiste dans le foie sous forme d’ADNccc, même après une infection guérie (Ag HBs négatif, anti-HBc positif). Une immunosuppression relâche le contrôle immunitaire et permet une reprise de la réplication, puis une hépatite parfois sévère.</p><div class="lab">Conduite selon l’EASL 2025</div><p>Avant toute immunosuppression, l’Ag HBs et l’anti-HBc sont recherchés ; une personne Ag HBs négative et anti-HBc positive est testée pour l’ADN. Un porteur de l’Ag HBs à risque élevé ou modéré de réactivation reçoit un entécavir ou un ténofovir prophylactique ; à risque faible, une surveillance de l’ADN au moins tous les 3 mois suffit si elle est faisable. La prophylaxie se poursuit au moins 6 à 12 mois après la fin de l’immunosuppression, et au moins 18 mois après une thérapie qui détruit les lymphocytes B. Le niveau de risque dépend du médicament et de la maladie traitée.</p><div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025</a>, section sur la prophylaxie de la réactivation, tableau 14.</div></template>

<template data-pop="b18-pa-suivi-vhb" data-title="Suivi VHB : rythme initial et adaptation">
<div class="lab">Première année sans traitement</div><p>L’EASL 2025 recommande de mesurer ALAT et ADN VHB tous les trois à six mois après un diagnostic nouveau, jusqu’à clarification de la phase ou début du traitement. Ensuite, les intervalles dépendent de la phase, de la fibrose et du risque. L’HBsAg est revu annuellement dans ses tableaux. Une ALAT normale unique ne justifie pas d’espacer d’emblée le suivi.</p>
<div class="lab">Pendant et après un traitement</div><p>Le médecin vérifie la baisse de l’ADN, l’adhésion, les interactions et la tolérance du produit. L’arrêt d’un analogue peut exposer à une reprise virologique et à une hépatite ; l’EASL demande une sélection spécialisée et une surveillance rapprochée. Les intervalles du tableau 7 concernent les personnes <em>non traitées</em> : ils ne se transposent pas tels quels à une cirrhose ou à un arrêt de médicament.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, tableau 7 et section sur l’arrêt des analogues</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-chc" data-title="Surveillance du cancer du foie : qui et pourquoi">
<div class="lab">Sélection selon le risque</div><p>Une cirrhose liée au VHB justifie en général la surveillance tant qu’un traitement à visée curative du cancer reste possible. L’EASL VHB 2025 inclut aussi certaines personnes HBsAg positives sans cirrhose, lorsque leur risque est intermédiaire ou élevé, par exemple avec hépatite D chronique, antécédent familial de carcinome, fibrose avancée ou score PAGE-B d’au moins 10. L’ADN devenu indétectable ne supprime pas automatiquement ce risque.</p>
<div class="lab">Modalité et limite</div><p>Pour les personnes retenues, l’EASL recommande une échographie abdominale tous les six mois par un opérateur expérimenté. L’AFP peut compléter l’imagerie, avec un risque de résultats faussement positifs ; elle ne remplace pas l’échographie. Si l’examen voit mal le foie, une imagerie adaptée peut être nécessaire. Les recommandations après guérison VHC sans cirrhose sont distinctes.</p>
<div class="src">Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, tableau 11</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL CHC 2025, sélection et échographie</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b18-pa-f3-divergence" data-title="Après guérison VHC : pourquoi la règle F3 a changé">
<div class="lab">Deux textes européens, deux dates</div><p>L’EASL VHC 2020 recommandait la surveillance du cancer après réponse virologique soutenue chez les personnes avec fibrose F3 ou cirrhose F4. L’EASL CHC de février 2025 juge que, pour une fibrose avancée <em>sans cirrhose</em>, le bénéfice de la surveillance systématique n’est pas suffisamment démontré. Cette recommandation spécifique plus récente prime pour cette décision ; elle n’affirme pas que le risque individuel est nul.</p>
<div class="lab">Conduite clinique</div><p>Le médecin vérifie d’abord si une cirrhose a été correctement exclue, y compris avant la guérison VHC. Une cirrhose reste surveillée si la personne peut bénéficier d’un traitement curatif du cancer. Pour une F3 sans cirrhose, il discute les autres facteurs de risque et les recommandations locales, sans annoncer une échographie semestrielle obligatoire à tous. La règle VHB 2025 pour certains patients sans cirrhose répond à un autre virus et à d’autres données.</p>
<div class="src">Sources primaires : <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, prise en charge du CHC, février 2025, p. 320–321</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHC 2020, recommandation antérieure</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b18-pa-pareto-suivi" data-title="Loi de Pareto — Suivre et prévenir">
<p class="ratio" data-cover="b18-pa-10,b18-pa-11"></p><ul><li>VHB non traité : ADN et ALAT tous les 3 à 6 mois la première année, puis tous les 6 à 12 mois ; Ag HBs chaque année.</li><li>Échographie tous les 6 mois en cas de cirrhose ou de risque intermédiaire ou élevé, maintenue malgré la suppression virale.</li><li>Après guérison du VHC : surveillance si cirrhose ; pas de surveillance systématique de la fibrose F3 selon l’EASL CHC 2025.</li><li>Vaccination VHB du nourrisson en Suisse, rattrapage de 11 à 15 ans, vérification à chaque dépistage d’infection sexuellement transmissible.</li><li>Grossesse : ténofovir si ADN ≥ 200 000 UI/mL ; vaccin du nouveau-né dans les 24 heures.</li><li>Co-infection VHB-VHC : analogue pendant les antiviraux directs et au moins 12 semaines après.</li></ul></template>

<template data-pop="b18-pa-contextes" data-title="Grossesse, VIH et transplantation : stratégies distinctes">
<div class="lab">Périnatalité et coinfection</div><p>Une grossesse avec VHB appelle une évaluation de la charge virale maternelle, de la prévention néonatale et du produit antiviral adapté. Un traitement contre le VIH chez une personne coinfectée VIH/VHB doit conserver une activité contre les deux virus ; retirer silencieusement la couverture VHB peut provoquer une poussée.</p>
<div class="lab">Soins qui modifient le risque</div><p>Une greffe ou une chimiothérapie peut modifier la réponse immunitaire et réactiver le VHB. Une atteinte rénale ou une dialyse influe sur le choix et la surveillance du produit. Chez un greffé immunodéprimé avec bilan hépatique inexpliqué, le VHE chronique doit entrer dans la recherche.</p>
<div class="src">Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, populations particulières et réactivation</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHE 2018, transplantation</a>. Consultation : 8 octobre 2026.</div></template>

<template data-pop="b18-pa-sources" data-title="Sources B18 : dates, territoire et hiérarchie">
<div class="lab">Ordre suivi</div><p>Sources suisses d’abord : OFSP, Bulletin 44/2025 (épidémiologie 2024, vaccination, prise en charge des antiviraux directs) ; SASL, SSG et SSI, avis d’experts sur le traitement de l’hépatite C, janvier 2021 ; informations professionnelles suisses approuvées par Swissmedic (AIPS du 08.10.2026). Puis sources européennes : EASL hépatite B 2025 (et 2017 pour l’historique des phases), hépatite C 2020, hépatite D 2023, hépatite E 2018, carcinome hépatocellulaire 2025. L’OMS 2024 n’est citée que pour la définition de la chronicité du VHB, qu’aucun texte suisse ou européen lu ne reformule.</p><div class="lab">Limites</div><p>Aucune recommandation de la SASL sur l’hépatite B n’a été trouvée ; l’EASL 2025 sert de référence. L’avis suisse sur l’hépatite C date de 2021 : ses conditions de remboursement doivent être relues dans la liste des spécialités au moment de prescrire. Aucune information professionnelle suisse de ribavirine ne figure dans l’AIPS du 08.10.2026.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL, SSG et SSI, traitement de l’hépatite C, janvier 2021</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020</a> ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, carcinome hépatocellulaire, février 2025</a>.</div></template>

<template data-pop="b18-pa-famille" data-title="Antécédents familiaux : risque à caractériser">
<p>Un cancer du foie chez un apparenté peut augmenter le risque individuel de carcinome hépatocellulaire chez une personne HBsAg positive. Le médecin précise le lien de parenté, l’âge au diagnostic et la présence éventuelle de VHB familial. Une cirrhose familiale peut aussi signaler une autre maladie hépatique partagée ; elle n’établit pas à elle seule une cause génétique. Le risque de cancer se combine à la fibrose, au VHD et aux autres données avant de choisir la surveillance.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, tableau 11 et évaluation du risque de CHC</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-fatigue" data-title="Fatigue : réelle, mais peu spécifique">
<p>La fatigue peut accompagner une maladie hépatique chronique et altérer la vie quotidienne. Elle ne mesure pas, à elle seule, l’intensité de la réplication VHB, la fibrose ou la fonction de synthèse du foie. Le médecin précise son début, son évolution et son retentissement. Il recherche aussi sommeil insuffisant, anémie, maladie thyroïdienne, état psychique, médicaments ou autre cause selon le contexte.</p>
<div class="src">Cadre clinique : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation initiale et qualité de vie</a>, consulté le 8 octobre 2026. La liste différentielle sert au raisonnement clinique, pas au diagnostic du cas.</div></template>

<template data-pop="b18-pa-prurit" data-title="Prurit : chercher une cholestase et d’autres causes">
<p>Un prurit peut accompagner une atteinte hépatobiliaire lorsque l’excrétion de la bile est perturbée. Son mécanisme est multifactoriel ; il ne prouve pas une hépatite virale active. Le médecin demande l’intensité, l’horaire, les lésions cutanées, l’ictère et les médicaments. La bilirubine, les phosphatases alcalines et la GGT orientent vers une cholestase, tandis qu’une maladie cutanée ou rénale peut expliquer un prurit sans origine hépatique. Une plainte nouvelle impose donc une attribution raisonnée.</p>
<div class="src">Source de l’évaluation hépatique : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, bilan biochimique et maladies concomitantes</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-ictere" data-title="Ictère : bilirubine et fonction hépatobiliaire">
<p>L’ictère colore la peau et les conjonctives lorsque la bilirubine augmente. Une atteinte des hépatocytes peut perturber son traitement et son excrétion, mais une obstruction biliaire ou une destruction accrue des globules rouges sont d’autres mécanismes possibles. Le médecin vérifie la bilirubine, les enzymes, la coagulation et les signes de défaillance. Un ictère nouveau avec confusion, hypotension ou INR altéré nécessite une évaluation urgente. L’absence d’ictère ne permet pas d’exclure une fibrose avancée.</p>
<div class="src">Source de l’évaluation : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, bilan hépatique et maladie avancée</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-douleur" data-title="Douleur abdominale : localiser et vérifier la cause">
<p>Une douleur abdominale peut accompagner une complication hépatobiliaire, mais elle est peu spécifique. Le médecin précise le siège, la durée, la fièvre, les vomissements, le transit et l’existence d’une ascite. Une douleur intense ou rapidement progressive peut relever d’une autre urgence abdominale. Ni sa présence ni son absence ne mesurent l’ADN VHB ou la fibrose. L’examen et, selon la situation, l’échographie orientent la cause avant d’attribuer la plainte au virus.</p>
<div class="src">Cadre de l’examen et de l’échographie : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation initiale</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-saignement" data-title="Saignement digestif : urgence et causes possibles">
<p>Une hématémèse ou des selles noires peuvent révéler une hémorragie digestive. Chez une personne cirrhotique, l’hypertension portale peut produire des varices qui saignent abondamment. Un ulcère ou une autre lésion digestive restent possibles ; l’origine ne se déduit pas de l’HBsAg. Le médecin évalue immédiatement circulation, conscience et hémoglobine, puis organise la prise en charge urgente.</p>
<div class="src">Contexte de cirrhose et d’hypertension portale : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation des complications portales</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-attention" data-title="Attention ou confusion : chercher une encéphalopathie et ses imitateurs">
<p>Une modification de l’attention, du comportement ou de la vigilance peut traduire une encéphalopathie en cas de maladie hépatique avancée. L’altération de la détoxification, une infection, un saignement ou certains médicaments peuvent y contribuer. Hypoglycémie, AVC et autres causes neurologiques restent dans le diagnostic différentiel. Le médecin vérifie les constantes et la glycémie, apprécie la gravité et recherche le facteur déclenchant. Une confusion nouvelle exige une évaluation urgente.</p>
<div class="src">Source pour la maladie avancée : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, cirrhose et décompensation</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-constantes" data-title="Constantes : repérer une défaillance immédiate">
<p>La pression artérielle et le pouls aident à reconnaître une hypoperfusion ou une hémorragie ; la fréquence respiratoire, la saturation, la température et l’état mental orientent vers une infection ou une défaillance d’organe. Ces mesures n’établissent pas la phase du VHB. Elles déterminent toutefois si le bilan chronique peut se poursuivre en consultation ou si une prise en charge urgente est nécessaire.</p>
<div class="src">Cadre clinique : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation initiale et maladie avancée</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-ascite" data-title="Ascite : pression portale, fonction et autre cause">
<p>L’ascite est une accumulation de liquide dans la cavité abdominale. Une cirrhose peut l’entraîner par hypertension portale et rétention de sodium et d’eau. Elle peut annoncer une décompensation, mais une maladie cardiaque, rénale ou une autre cause abdominale peut aussi produire du liquide. L’examen et l’échographie confirment sa présence ; une apparition rapide, une douleur ou une fièvre changent l’urgence de l’évaluation.</p>
<div class="src">Source de la stratification hépatique : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, cirrhose et hypertension portale</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-oedemes" data-title="Œdèmes : évaluer leur origine">
<p>Des œdèmes des jambes peuvent accompagner une cirrhose avec rétention hydrosodée ou baisse de l’albumine. Ils ne sont pourtant pas propres à la maladie du foie : insuffisance cardiaque, atteinte rénale, médicament ou problème veineux peuvent aussi intervenir. Le médecin précise leur répartition et leur évolution, mesure poids et pression artérielle, puis interprète albumine et fonction rénale avec l’examen. L’absence d’œdèmes ne prouve pas l’absence de fibrose.</p>
<div class="src">Source de l’évaluation hépatique et rénale : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, maladie avancée et bilan initial</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-portale" data-title="Hypertension portale : rechercher ses conséquences">
<p>La fibrose avancée peut augmenter la résistance à l’écoulement du sang à travers le foie. La pression monte dans le système porte et favorise notamment ascite, dilatation de veines digestives et parfois augmentation de la taille de la rate avec baisse des plaquettes. Aucun signe isolé ne mesure directement cette pression. L’échographie, les plaquettes et la rigidité hépatique aident à estimer le risque et à décider si une endoscopie est utile. Une hémorragie digestive impose une évaluation urgente.</p>
<div class="src">Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL VHB 2025, évaluation de la fibrose et de l’hypertension portale, discussion des critères Baveno</a>, consulté le 8 octobre 2026.</div></template>

<template data-pop="b18-pa-epid" data-title="Hépatites B et C en Suisse en 2024 : chiffres et limites">
<div class="lab">Hépatite B</div><p>1219 cas déclarés (13,5 pour 100 000), en hausse de 7,1 % par rapport à 2023 ; 60,4 % chez des hommes ; âge médian de 44 ans à la première déclaration. La plupart sont d’anciennes infections découvertes au stade chronique, contractées surtout dans des pays de prévalence moyenne ou forte. L’hépatite B aiguë est à son minimum historique de 0,2 pour 100 000 depuis 2022. Une déclaration médicale n’existait que pour 77,9 % des cas.</p><div class="lab">Hépatite C</div><p>1059 cas déclarés (11,8 pour 100 000), dont une partie déjà guérie ; l’hépatite C aiguë est passée de 0,2 à 0,3 pour 100 000 en 2024. La transmission est surtout sanguine, exceptionnellement sexuelle. Environ un quart des infections aiguës guérissent spontanément.</p><div class="lab">Lecture</div><p>Ces chiffres sont des déclarations, non des prévalences : ils reflètent les dépistages réalisés et une documentation clinique incomplète.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a>, « L’hépatite B » et « L’hépatite C en Suisse et au Liechtenstein en 2024 ».</div></template>

<template data-pop="b18-pa-suisse-vhc" data-title="Hépatite C en Suisse : position SASL, SSG et SSI et accès au traitement">
<div class="lab">Position suisse</div><p>L’avis d’experts suisse de janvier 2021 demande d’évaluer et de proposer un traitement à toute personne infectée. Avant traitement, il exige les marqueurs du VHB (Ag HBs, anti-HBc, anti-HBs), le VIH, l’alcool, le syndrome métabolique, le stade de fibrose, et en cas de cirrhose le score de Child-Pugh et l’hypertension portale. Il recommande de déterminer génotype et charge virale, et de rechercher les sous-types peu sensibles chez des patients originaires de certaines régions d’Afrique et d’Asie. Les schémas retenus sont le sofosbuvir/velpatasvir 12 semaines et le glécaprévir/pibrentasvir 8 semaines chez le patient naïf ; l’ARN se contrôle 12 semaines après la fin du traitement.</p><div class="lab">Accès</div><p>L’OFSP indique que, depuis octobre 2017, toutes les personnes chroniquement infectées peuvent être traitées par antiviraux directs pris en charge par l’assurance obligatoire, avec environ 95 % de guérison. L’avis suisse de 2021 précisait que la prescription remboursée restait limitée aux gastroentérologues, infectiologues et à certains autres spécialistes nommés ; la limitation en vigueur se lit dans la liste des spécialités au moment de prescrire.</p><div class="lab">Écart avec l’EASL</div><p>L’EASL 2020 et l’avis suisse concordent sur le principe de traiter tous les patients. Pour la surveillance du CHC après guérison, l’avis suisse renvoyait en 2021 à la règle EASL de l’époque (fibrose F3 ou élastographie ≥ 10 kPa) ; la directive européenne CHC de 2025, plus récente, ne recommande plus cette surveillance sans cirrhose.</p><div class="src">Sources : <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL, SSG et SSI, traitement de l’hépatite C, janvier 2021</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a>, hépatite C, synthèse ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-02/EASL_CPG_Management_HCC.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, carcinome hépatocellulaire, février 2025</a>.</div></template>
