<section class="ilot" id="a41-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Le sepsis impose trois exigences simultanées : le reconnaître, le traiter dès la première heure et expliquer chacun de ses signes par un mécanisme. Une même patiente, Mme R., accompagne toutes les étapes ; chaque notion nouvelle s’applique aussitôt à son cas. Son histoire pose la question clinique initiale.</p>
<h3>0.1 La patiente</h3>
<p>La patiente présentée ici sert de cas clinique à tout le cours. Son histoire contient déjà plusieurs pièges du sepsis.</p>
<p>Mme R., 71 ans, pèse 60 kg pour 1,62 m. Elle prend depuis deux ans 7,5 mg de prednisone par jour pour une pseudopolyarthrite rhizomélique : il s’agit d’une <button class="w" data-k="a41-cortico">corticothérapie au long cours (immunité et axe surrénalien)</button>. Elle a eu une colique néphrétique droite il y a trois ans. Sa créatinine valait 78 µmol/L lors d’un contrôle trois mois plus tôt.</p>
<p>Depuis trois jours, elle a des brûlures mictionnelles. Depuis la veille, elle souffre de la fosse lombaire droite. Le soir, elle a eu des frissons violents, avec des tremblements de tout le corps malgré deux couvertures. Ce matin, sa fille la trouve somnolente et confuse ; elle a très peu uriné depuis la veille.</p>
<p>Aux urgences, sa pression artérielle est de 82/46 mmHg, et le moniteur affiche une pression artérielle moyenne de 58 mmHg. Sa fréquence cardiaque est de 118 par minute et sa fréquence respiratoire de 28 par minute. Sa SpO₂ est de 93 % à l’air ambiant. Sa température n’atteint que 37,6 °C.</p>
<p>La question clinique est double. Cette infection urinaire s’accompagne-t-elle d’une nouvelle défaillance d’organe, c’est-à-dire d’un sepsis, voire d’un choc septique ? Comment traiter immédiatement tout en cherchant le foyer qu’un geste pourrait supprimer ?</p>
<div class="key"><b>À retenir.</b> Une infection urinaire, une confusion nouvelle, une hypotension et une respiration rapide chez une patiente âgée sous corticoïdes forment un tableau d’urgence. L’absence de fièvre franche ne rassure pas, car la prednisone et l’âge peuvent l’atténuer.</div>
<h3>0.2 Objectifs du cours</h3>
<p>Les objectifs suivants disent ce que le lecteur saura faire à la fin du cours. Ils suivent l’ordre des îlots.</p>
<p>Le lecteur saura distinguer une infection, un sepsis et un choc septique selon les critères Sepsis-3. Il saura repérer une défaillance d’organe nouvelle au lit du malade, avant tout résultat de laboratoire. Il saura organiser la première heure : hémocultures, lactate, antibiotique, remplissage et vasopresseur. Il saura faire contrôler un foyer dans les six heures lorsqu’un geste est nécessaire. Il saura enfin réévaluer le traitement, prévenir les complications et préparer la sortie.</p>
<div class="key"><b>À retenir.</b> La prise en charge du sepsis va de la définition à la décision : reconnaître, traiter, contrôler le foyer, réévaluer et prévenir. Les médicaments et gestes spécialisés s’inscrivent dans la prise en charge hospitalière et les protocoles locaux.</div>
<h3>0.3 Quatre notions préalables</h3>
<p>Quatre notions reviennent dans chaque îlot. Le lecteur qui les maîtrise comprend tout le reste du cours.</p>
<p>La première est la <button class="w" data-k="a41-perfusion">perfusion tissulaire (débit, transport et extraction de l’oxygène)</button> : un organe souffre lorsque l’oxygène qu’il reçoit ne couvre plus ses besoins. La deuxième est la <button class="w" data-k="a41-pam">pression artérielle moyenne (mesure et signification)</button>, qui pousse le sang dans les organes. La troisième est le <button class="w" data-k="a41-lactate">lactate (production, élimination et limites)</button>, dont l’élévation signale une souffrance cellulaire sans en désigner la cause. La quatrième est le <button class="w" data-k="a41-sofa">score SOFA (six fonctions d’organe, de 0 à 4 points chacune)</button>, qui mesure la défaillance et fonde la définition du sepsis.</p>
<div class="key"><b>À retenir.</b> Mme R. associe une infection urinaire probable à plusieurs défaillances visibles au lit : confusion, hypotension, polypnée et oligurie. Le cours enseigne à les mesurer, à les traiter et à en supprimer la cause. L’îlot suivant définit précisément le sepsis et ce qui le distingue d’une infection simple.</div>
</section>
<section class="ilot" id="a41-1"><h2><span class="n">1</span>Définition, gravité et périmètre de codage</h2>
<p>Le sepsis et le choc septique se définissent selon le consensus international de 2016, appelé Sepsis-3. Ces définitions commandent tout le raisonnement, du dépistage jusqu’aux critères formels du diagnostic. Les anciennes définitions ont été abandonnées pour des raisons précises, et la catégorie A41 possède un périmètre de codage propre.</p>
<h3>1.1 Pourquoi une nouvelle définition en 2016</h3>
<p>Les définitions de 1991 et de 2001 reposaient sur l’inflammation. Leurs défauts expliquent la définition actuelle.</p>
<p>Ces anciennes définitions appelaient « sepsis » une infection accompagnée d’au moins deux <button class="w" data-k="a41-sirs">critères de réponse inflammatoire systémique (définition et limites)</button> : fièvre ou hypothermie, tachycardie, polypnée, leucocytose ou leucopénie. Elles décrivaient ensuite une progression obligatoire vers le « sepsis sévère », puis vers le choc. Le groupe de travail de 2016 a relevé trois défauts. Les critères inflammatoires se rencontrent chez de nombreux malades hospitalisés dont l’évolution reste simple : ils manquent de spécificité. À l’inverse, dans les unités de soins intensifs australiennes et néo-zélandaises, un patient sur huit admis pour une infection avec défaillance d’organe nouvelle ne remplissait pas deux critères. Enfin, la maladie ne suit pas une progression obligatoire d’un stade à l’autre.</p>
<p>Le consensus <button class="w" data-k="a41-sepsis3">Sepsis-3 (définition et critères de 2016)</button> définit donc le sepsis comme une <b>défaillance d’organe menaçant la vie, causée par une réponse dérégulée de l’hôte à une infection</b>. Deux idées portent cette définition. La gravité vient de l’organe atteint, et non de l’intensité de l’inflammation. Les lésions viennent de la réponse de l’hôte, et pas seulement du microbe. Pour le public, le groupe de travail reprend une formule simple : le sepsis survient lorsque la réponse de l’organisme à une infection lèse ses propres tissus et organes.</p>
<div class="key"><b>À retenir.</b> Le sepsis se définit par une défaillance d’organe due à une infection, et non par des signes inflammatoires. Une fièvre et une tachycardie ne suffisent pas ; une défaillance nouvelle suffit.</div>
<h3>1.2 Le critère opérationnel : une hausse du score SOFA d’au moins 2 points</h3>
<p>Une définition conceptuelle ne suffit pas au lit du malade : il faut un critère mesurable. Sepsis-3 a choisi le score SOFA.</p>
<p>Selon Sepsis-3, une augmentation aiguë d’au moins <b>2 points</b> du <button class="w" data-k="a41-sofa">score SOFA (six défaillances d’organe)</button>, attribuable à l’infection, représente opérationnellement l’atteinte d’organe. Le score cote de 0 à 4 points six fonctions : respiration, coagulation, foie, circulation, système nerveux central et rein. Le score de base est présumé nul lorsque le patient n’a aucune dysfonction d’organe connue avant l’infection.</p>
<p>Ce seuil n’a rien d’arbitraire. Chez les patients hospitalisés pour une infection présumée, un score d’au moins 2 points s’associe à une mortalité hospitalière d’environ 10 %. Ce chiffre dépasse la mortalité globale de 8,1 % de l’infarctus du myocarde avec sus-décalage du segment ST, que chacun considère comme une urgence vitale. Selon le risque de base du patient, un score d’au moins 2 points multiplie par 2 à 25 le risque de décès, par rapport à un score inférieur à 2.</p>
<p>La hausse doit être <em>aiguë</em> et <em>attribuable à l’infection</em>. Une insuffisance rénale chronique connue ne compte pas : seul l’écart avec l’état antérieur compte. L’infection peut être présumée à la présentation, car la décision thérapeutique précède souvent la confirmation microbiologique. Selon le groupe de travail, une culture n’est d’ailleurs positive que dans 30 à 40 % des sepsis.</p>
<p>Une version révisée du score, le SOFA-2, a été publiée en décembre 2025 à partir des données de 3,34 millions de séjours en soins intensifs. Elle conserve les six organes, met à jour les traitements de suppléance pris en compte et modifie certains seuils. La définition Sepsis-3 s’appuie sur le score d’origine, que ce cours applique.</p>
<div class="key"><b>À retenir.</b> Le sepsis se reconnaît à une hausse aiguë du score SOFA d’au moins 2 points, attribuable à l’infection, par rapport à l’état antérieur ; sans défaillance connue, le score de base vaut zéro. Ce seuil correspond à une mortalité hospitalière d’environ 10 %.</div>
<h3>1.3 Le choc septique : un sous-groupe défini par deux critères</h3>
<p>Parmi les sepsis, certains patients ont un risque de décès beaucoup plus élevé. Sepsis-3 les identifie par deux critères associés.</p>
<p>Le <b>choc septique</b> est le sous-ensemble des sepsis dont les anomalies circulatoires, cellulaires et métaboliques sont assez profondes pour augmenter nettement la mortalité. Il associe deux critères : un vasopresseur est nécessaire pour maintenir la pression artérielle moyenne au moins à <b>65 mmHg</b>, <em>et</em> le lactate sanguin dépasse <b>2 mmol/L</b>. Ces deux critères persistent <em>malgré une réanimation volémique adéquate et en l’absence d’hypovolémie</em>. Avec ces critères, la mortalité hospitalière dépasse 40 %.</p>
<p>Pourquoi Sepsis-3 exige-t-il les deux critères ? Le groupe de travail a analysé le registre international de la Surviving Sepsis Campaign, qui réunissait 28 150 patients infectés. La mortalité hospitalière ajustée atteignait 42,3 % lorsque l’hypotension résistante au remplissage et un lactate supérieur à 2 mmol/L coexistaient. Elle était de 25,7 % avec l’hyperlactatémie seule, et de 30,1 % avec l’hypotension sous vasopresseur et un lactate d’au plus 2 mmol/L. L’association des deux anomalies désigne donc un groupe distinct, plus grave.</p>
<p>Il faut distinguer ce critère formel d’une hypotension infectieuse qui exige déjà un traitement sans attendre le résultat du lactate. Le groupe de travail le précise : le choc septique est une catégorie épidémiologique, et la prise en charge d’une hypotension ou d’un lactate élevé ne doit pas en dépendre. Là où le lactate ne peut pas être mesuré, un diagnostic de travail repose sur l’hypotension et sur des signes d’hypoperfusion, comme un temps de recoloration capillaire allongé.</p>
<p>Le tableau suivant résume les trois niveaux de gravité. La première colonne nomme la situation, la deuxième donne le critère Sepsis-3, la troisième la mortalité hospitalière rapportée par le groupe de travail, et la quatrième ce que la situation change pour le médecin.</p>
<table class="t"><tr><th>Situation</th><th>Critère Sepsis-3</th><th>Mortalité hospitalière</th><th>Conséquence pratique</th></tr><tr><td>Infection sans sepsis</td><td>Infection présumée ou prouvée ; hausse du score SOFA inférieure à 2 points</td><td>Non fixée par Sepsis-3</td><td>Traitement de l’infection, surveillance et réévaluation, car une défaillance peut apparaître plus tard</td></tr><tr><td>Sepsis</td><td>Infection et hausse aiguë du score SOFA d’au moins 2 points</td><td>Environ 10 %</td><td>Urgence : antibiotique dans l’heure si le sepsis est probable, recherche du foyer, surveillance rapprochée</td></tr><tr><td>Choc septique</td><td>Sepsis, vasopresseur pour une pression artérielle moyenne d’au moins 65 mmHg et lactate supérieur à 2 mmol/L malgré un remplissage adéquat</td><td>Plus de 40 %</td><td>Réanimation immédiate, vasopresseur, avis de soins intensifs et contrôle du foyer</td></tr></table>
<p>Le tableau se lit de haut en bas, dans l’ordre d’une gravité croissante. L’erreur fréquente consiste à réserver l’urgence au choc septique, alors qu’un sepsis sans choc s’accompagne déjà d’une mortalité d’environ 10 %. Mme R. illustre la lecture : sa confusion et son hypotension suffisent à dépasser 2 points, donc à poser un sepsis. Seule l’évolution après le remplissage dira si elle remplit les critères du choc.</p>
<div class="key"><b>À retenir.</b> Le choc septique exige un vasopresseur pour une pression artérielle moyenne d’au moins 65 mmHg <em>et</em> un lactate supérieur à 2 mmol/L, malgré un remplissage adéquat ; sa mortalité hospitalière dépasse 40 %. Cette classification ne retarde jamais le traitement d’une hypotension.</div>
<h3>1.4 Ce que le sepsis n’est pas</h3>
<p>Plusieurs confusions persistent et faussent le raisonnement. Les corriger évite des erreurs de diagnostic dans les deux sens.</p>
<p>Une <button class="w" data-k="a41-bacteriemie">bactériémie (bactéries dans le sang : sens et limites)</button> isolée n’est pas synonyme de sepsis, car elle peut rester sans défaillance d’organe. Inversement, des hémocultures négatives n’excluent pas le sepsis. La fièvre et la tachycardie traduisent une inflammation, et non une défaillance : elles ne constituent pas le diagnostic. Le terme « sepsis sévère » est redondant selon Sepsis-3, puisque tout sepsis comporte déjà une défaillance d’organe.</p>
<div class="trap"><span class="k">Piège</span>Le score rapide <button class="w" data-k="a41-qsofa">qSOFA (trois critères cliniques : usage et limite)</button> peut signaler un risque, mais il n’est pas un critère diagnostique. La Surviving Sepsis Campaign 2026 recommande de ne pas l’employer comme <b>unique</b> outil de dépistage à l’hôpital. Elle lui préfère un score d’alerte à plusieurs constantes ou les critères de réponse inflammatoire (recommandation forte, certitude modérée).</div>
<div class="key"><b>À retenir.</b> Ni la bactériémie, ni la fièvre, ni un qSOFA positif ne définissent le sepsis ; seule une défaillance d’organe nouvelle le définit. Des cultures négatives ne l’excluent pas.</div>
<h3>1.5 Recommandation de référence et périmètre de codage</h3>
<p>Le cours applique une recommandation internationale et un code de classification précis. Cette sous-partie les présente l’un après l’autre.</p>
<p>La recommandation de prise en charge est celle de la <button class="w" data-k="a41-ssc">Surviving Sepsis Campaign 2026 (adultes hospitalisés)</button>. Elle compte 129 énoncés, dont 46 nouveaux, et donne pour chacun une force et un degré de certitude. Le cours cite cette force chaque fois qu’elle change la décision.</p>
<p>La catégorie <b>A41</b> désigne dans la CIM-10-GM 2024 les « autres sepsis » et les sepsis d’agent non précisé. Le cours traite <em>cliniquement</em> le syndrome général ; son périmètre de codage se limite à la catégorie A41, et sa seule existence ne permet pas de revendiquer un autre code. La catégorie <b>A40</b> (sepsis à streptocoques) et le code complémentaire <b>R57.2</b> (choc septique, ajouté au code du sepsis lorsque le choc est documenté) ne sont pas développés dans ce cours. Le syndrome de choc toxique, y compris d’origine streptococcique, n’appartient pas à A40 : la classification le range dans la catégorie A48 (autres maladies bactériennes, non classées ailleurs), avec un code complémentaire désignant l’agent. Les codes <b>R57.0</b> (choc cardiogénique) et <b>R57.1</b> (choc hypovolémique) relèvent d’autres cours. Les sepsis à agent spécifique ou associés à la grossesse, au nouveau-né et aux actes relèvent de règles propres.</p>
<p>Le médecin ne code qu’après avoir documenté la cause, selon les règles suisses en vigueur. Ce codage n’est pas une formalité : les statistiques nationales de l’îlot suivant reposent sur lui, et un sepsis non documenté disparaît des chiffres.</p>
<div class="quiz ui"><p>Un patient atteint de pneumonie a une pression artérielle moyenne de 70 mmHg sans vasopresseur, un lactate de 3,8 mmol/L et une hausse aiguë du score SOFA de 3 points. Quel est son diagnostic selon Sepsis-3 ?</p><button data-ok="0">Il s’agit d’un choc septique, puisque le lactate dépasse 2 mmol/L.</button><button data-ok="1">Il s’agit d’un sepsis sans choc septique, qui reste à haut risque.</button><button data-ok="0">Il s’agit d’une infection sans sepsis, puisque la pression reste normale.</button><p class="fb" hidden>La hausse de 3 points du score SOFA définit un sepsis. Le choc septique exige en plus un vasopresseur pour maintenir la pression artérielle moyenne à 65 mmHg ou plus, ce qui n’est pas le cas ici. Le patient reste grave : dans les données de Sepsis-3, l’hyperlactatémie seule s’accompagnait d’une mortalité hospitalière ajustée de 25,7 %.</p></div>
<div class="key"><b>À retenir.</b> Le sepsis est une infection accompagnée d’une nouvelle défaillance d’organe, mesurée par une hausse aiguë du score SOFA d’au moins 2 points ; sa mortalité hospitalière avoisine 10 %. Le choc septique ajoute un vasopresseur pour une pression artérielle moyenne d’au moins 65 mmHg et un lactate supérieur à 2 mmol/L malgré un remplissage adéquat ; sa mortalité dépasse 40 %. Le cours traite le syndrome sous la catégorie A41 de la CIM-10-GM 2024. L’îlot suivant mesure le poids de ces situations en Suisse.</div>
</section>
<section class="ilot" id="a41-2"><h2><span class="n">2</span>Épidémiologie et pronostic en Suisse</h2>
<p>Le sepsis est fréquent et grave, dans le monde comme en Suisse. Sa fréquence explique pourquoi les hôpitaux organisent un dépistage systématique ; sa gravité, pourquoi le suivi après la sortie fait partie du traitement. Ces chiffres reposent sur les codes de diagnostic et en partagent les limites.</p>
<h3>2.1 Le fardeau mondial</h3>
<p>Les estimations mondiales situent l’ampleur du problème. Elles proviennent de l’étude de la charge mondiale de morbidité, publiée en 2020.</p>
<p>Pour l’année 2017, cette étude estime à 48,9 millions le nombre de cas de sepsis dans le monde et à 11,0 millions le nombre de décès liés au sepsis. Ces décès représentaient 19,7 % de tous les décès, soit environ un décès sur cinq. De 1990 à 2017, l’incidence standardisée sur l’âge a diminué de 37,0 % et la mortalité de 52,8 %. La charge la plus lourde se concentre en Afrique subsaharienne, en Océanie et dans le sud, l’est et le sud-est de l’Asie.</p>
<div class="key"><b>À retenir.</b> Le sepsis était lié à environ un décès sur cinq dans le monde en 2017. Sa mortalité baisse depuis 1990, mais la maladie reste une cause majeure de décès.</div>
<h3>2.2 Les données suisses</h3>
<p>La Suisse dispose depuis 2025 d’une analyse nationale. Elle couvre toutes les hospitalisations en soins aigus de 2019 à 2023.</p>
<p>Le <button class="w" data-k="a41-swiss-report">Swiss Sepsis Report 2025 (données hospitalières 2019–2023)</button> dénombre chaque année environ <b>20 000 séjours hospitaliers explicitement codés sepsis</b> en Suisse, comprenant 500 à 600 séjours d’enfants, et près de <b>4 000 décès intrahospitaliers</b> chez les patients concernés. Il s’agit de séjours et de décès durant une hospitalisation avec code sepsis, et non d’une mesure directe de toutes les infections ni d’une mortalité attribuable prouvée au sepsis.</p>
<p>Le tableau suivant détaille l’année 2023, la plus récente du rapport. La première colonne nomme l’indicateur, la deuxième donne sa valeur et la troisième dit ce que le clinicien en retient.</p>
<table class="t"><tr><th>Indicateur (Suisse, 2023)</th><th>Valeur</th><th>Ce que le clinicien en retient</th></tr><tr><td>Séjours explicitement codés sepsis</td><td>21 001, soit 1,6 % des séjours de soins aigus</td><td>Le sepsis est aussi fréquent que l’infarctus du myocarde (environ 19 000 cas par an) ou l’accident vasculaire cérébral (environ 22 000).</td></tr><tr><td>Séjours avec choc septique</td><td>6 098, soit 29,3 %</td><td>Près de trois séjours sur dix comportent un choc.</td></tr><tr><td>Patients de 65 ans et plus</td><td>14 733 séjours, soit 70,2 %</td><td>Le sepsis touche surtout le sujet âgé.</td></tr><tr><td>Admission en soins intensifs</td><td>8 542 séjours, soit 40,7 %</td><td>Deux patients sur cinq passent par les soins intensifs.</td></tr><tr><td>Durée médiane de séjour</td><td>9 jours, contre 3 jours hors sepsis</td><td>Le séjour est trois fois plus long.</td></tr><tr><td>Mortalité intrahospitalière, tous séjours</td><td>18,9 % (3 971 décès)</td><td>Environ un patient sur cinq meurt pendant le séjour.</td></tr><tr><td>Mortalité intrahospitalière, choc septique</td><td>32,6 % (1 991 décès sur 6 098 séjours)</td><td>Le choc porte la mortalité à près d’un patient sur trois.</td></tr><tr><td>Mortalité intrahospitalière, 65 ans et plus</td><td>22,3 % (3 289 décès sur 14 733 séjours)</td><td>L’âge et les comorbidités aggravent le pronostic.</td></tr><tr><td>Mortalité intrahospitalière, enfants</td><td>5,3 % hors nouveau-nés (19 décès sur 358 séjours) ; 11,6 % chez les nouveau-nés (28 décès sur 241 séjours)</td><td>Le nouveau-né reste l’âge pédiatrique le plus exposé.</td></tr><tr><td>Coûts hospitaliers directs</td><td>1,07 milliard de francs suisses ; 51 018 francs par séjour en moyenne</td><td>Le sepsis représente plus de 6 % des coûts hospitaliers pour 1,6 % des séjours.</td></tr></table>
<p>Le tableau se lit en deux temps. Les premières lignes disent qui est touché : surtout des personnes âgées, en choc dans près de trois séjours sur dix. Les lignes suivantes disent ce que la maladie coûte en vies, en lits et en francs. L’erreur fréquente consiste à lire 18,9 % comme la part des décès causés par le sepsis, alors qu’il s’agit d’une mortalité toutes causes pendant le séjour. Mme R. appartient aux deux groupes les plus exposés : les 65 ans et plus (22,3 %) et, probablement, le choc septique (32,6 %).</p>
<div class="key"><b>À retenir.</b> En Suisse, environ 20 000 séjours sont codés sepsis chaque année, dont 70 % après 65 ans. La mortalité intrahospitalière atteignait 18,9 % en 2023, et 32,6 % en cas de choc.</div>
<h3>2.3 Ce que les chiffres ne disent pas</h3>
<p>Un chiffre ne vaut que par sa méthode. Le rapport suisse précise lui-même ses limites.</p>
<p>Le rapport repose sur les codes de sortie. Lorsqu’un médecin ne documente pas le sepsis, le séjour est codé sous le nom du foyer, par exemple une pneumonie. Un repérage plus large par infection accompagnée de défaillance d’organe trouve de 72 000 à 90 000 séjours par an. Ce nombre peut atteindre quatre fois celui du codage explicite : l’écart dépend des définitions et de la qualité des données. Le rapport compte des séjours et non des personnes, si bien qu’un patient transféré entre deux hôpitaux compte deux fois. Il ne distingue pas non plus les sepsis acquis dans la communauté de ceux acquis à l’hôpital.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Le lecteur qui transforme « 20 000 séjours codés » en « 20 000 nouveaux cas prouvés » ou « 4 000 décès causés exclusivement par le sepsis » efface les limites méthodologiques du rapport.</div>
<div class="key"><b>À retenir.</b> Les chiffres suisses sous-estiment probablement le sepsis, puisque le codage explicite en ignore une partie. Ils décrivent des séjours et une mortalité toutes causes, et non une mortalité attribuable.</div>
<h3>2.4 Le pronostic au-delà de l’hôpital</h3>
<p>Le risque ne s’arrête pas à la sortie. Cette sous-partie décrit ce qui attend les survivants.</p>
<p>En Suisse, près de 30 % des patients de 65 ans et plus sont décédés dans l’année qui suit l’admission, soit davantage que pendant le séjour lui-même. Une revue publiée en 2018 dans le <i>JAMA</i> résume le devenir des survivants à l’échelle mondiale. La moitié récupère, un tiers meurt dans l’année et un sixième garde des limitations sévères. Environ 40 % sont réhospitalisés dans les 90 jours, notamment pour une infection (11,9 %) ou une décompensation cardiaque (5,5 %). Ces séquelles forment le <button class="w" data-k="a41-postsepsis">syndrome post-sepsis (séquelles physiques, cognitives et psychiques)</button>.</p>
<p>Chez chaque survivant, le médecin recherche donc des limitations cognitives, physiques et psychiques et organise une transition de soins individualisée. L’îlot 10 détaille ce suivi.</p>
<div class="key"><b>À retenir.</b> Le sepsis était lié à environ un décès sur cinq dans le monde en 2017. En Suisse, environ 20 000 séjours sont codés sepsis chaque année, surtout après 65 ans, avec une mortalité intrahospitalière de 18,9 % en 2023 et de 32,6 % en cas de choc ; le codage explicite sous-estime la réalité. Le risque persiste après la sortie : près de 30 % des patients de 65 ans et plus sont décédés dans l’année. L’îlot suivant explique comment une infection devient une défaillance d’organe.</div>
<button class="pareto-btn ui" data-k="pareto-a41-def">▲ Loi de Pareto — Définitions, codage et épidémiologie</button></section>
<section class="ilot" id="a41-3"><h2><span class="n">3</span>Physiopathologie : de l’infection à la défaillance</h2>
<p>Une infection d’abord contenue peut devenir une défaillance de plusieurs organes. Ce mécanisme explique chaque signe clinique et chaque traitement : le remplissage, la noradrénaline et le contrôle du foyer corrigent chacun une étape différente. Ces étapes se suivent ici dans l’ordre, du normal au pathologique, puis s’appliquent à Mme R.</p>
<h3>3.1 La réponse normale : reconnaître, contenir, résoudre</h3>
<p>Le sepsis se comprend à partir de la réponse normale à l’infection. Cette réponse est locale, proportionnée et limitée dans le temps.</p>
<p>À l’état normal, l’endothélium règle le tonus vasculaire et la perméabilité capillaire ; les macrophages reconnaissent les agents infectieux et déclenchent une réponse immunitaire localisée. Ils portent pour cela des récepteurs de reconnaissance, comme les TLR, qui détectent des structures microbiennes conservées. Le lipopolysaccharide des bactéries à Gram négatif en est l’exemple classique. Ces récepteurs détectent aussi des molécules libérées par les cellules lésées. Leur activation déclenche la production locale de cytokines, comme le TNF-α, l’IL-1 et l’IL-6.</p>
<p>Ces cytokines produisent une inflammation utile. Les artérioles se dilatent, les capillaires deviennent plus perméables, et les polynucléaires neutrophiles quittent le sang pour gagner le foyer. La coagulation s’active localement et retient les microbes dans des microthrombi. Une fois les microbes éliminés, des médiateurs anti-inflammatoires, comme l’IL-10, arrêtent la réponse.</p>
<div class="key"><b>À retenir.</b> La réponse normale reconnaît le microbe, le contient au foyer par l’inflammation et la coagulation locales, puis s’arrête. Le sepsis commence lorsque ces mécanismes agissent au-delà du foyer.</div>
<h3>3.2 Le dérèglement : une réponse devenue systémique</h3>
<p>Dans le sepsis, les mêmes mécanismes agissent dans tout l’organisme. Cette sous-partie explique pourquoi ils deviennent nuisibles.</p>
<p>Une forte charge microbienne, un germe virulent ou un hôte fragile font passer les médiateurs dans la circulation générale. Une infection invasive ou une réponse de l’hôte mal régulée active alors fortement les cellules immunitaires, l’endothélium et la coagulation. Les mécanismes utiles à l’échelle d’un abcès agissent dans tous les organes à la fois. En même temps, une immunodépression s’installe : de nombreux lymphocytes meurent par apoptose, et les monocytes produisent moins de cytokines. Le patient subit donc à la fois des lésions inflammatoires et un risque accru d’infections secondaires.</p>
<div class="key"><b>À retenir.</b> Le sepsis associe une inflammation systémique et une immunodépression. Cette double anomalie explique à la fois les défaillances précoces et les surinfections tardives.</div>
<h3>3.3 La vasoplégie et la fuite capillaire</h3>
<p>L’hypotension est le signe le plus menaçant du sepsis. Elle résulte de trois anomalies vasculaires et parfois d’une atteinte du cœur.</p>
<p>Dans le sepsis apparaissent une <button class="w" data-k="a41-endo">vasoplégie et une fuite endothéliale (hypotension et œdèmes)</button>. La NO synthase inductible, ou iNOS, produit de grandes quantités de monoxyde d’azote (NO), qui relâche le muscle lisse des artérioles. Les vaisseaux répondent moins aux catécholamines, et la sécrétion de vasopressine devient insuffisante pour le degré d’hypotension. Les résistances vasculaires chutent : la pression artérielle baisse.</p>
<p>Le glycocalyx, couche qui tapisse la surface de l’endothélium et retient le plasma, se dégrade, et les jonctions entre cellules endothéliales s’ouvrent. Le plasma passe dans les tissus : des œdèmes apparaissent et le volume circulant diminue. Les veines se dilatent et retiennent davantage de sang, ce qui réduit le retour veineux au cœur. L’hypovolémie du sepsis est donc à la fois absolue, par fuite et par pertes, et relative, par dilatation veineuse. Cette double origine explique pourquoi le remplissage aide au début, mais aggrave les œdèmes lorsqu’il est poursuivi sans nécessité.</p>
<p>Le cœur participe aussi. Une <button class="w" data-k="a41-cardiomyo">cardiomyopathie septique (dysfonction réversible des ventricules)</button> réduit la contractilité chez une partie des patients. La tachycardie compense d’abord la baisse des résistances et maintient le débit cardiaque. Le profil hémodynamique habituel associe donc un débit normal ou élevé, des résistances basses et, au début, des extrémités parfois chaudes.</p>
<div class="key"><b>À retenir.</b> L’hypotension septique naît de la vasoplégie, de la fuite capillaire et de la baisse du retour veineux, parfois d’une atteinte cardiaque. Le remplissage corrige la part hypovolémique ; la noradrénaline corrige la vasoplégie.</div>
<h3>3.4 La microcirculation et la cellule</h3>
<p>Une pression normale ne garantit pas une perfusion normale. L’explication se trouve dans les capillaires et dans les mitochondries.</p>
<p>La <button class="w" data-k="a41-perfusion">perfusion tissulaire (débit, transport et extraction de l’oxygène)</button> dépend du débit dans chaque capillaire, et pas seulement de la pression dans les grosses artères. Dans le sepsis, certains capillaires se ferment tandis que d’autres restent perfusés : le débit devient hétérogène. Des microthrombi obstruent une partie des capillaires. Les mitochondries utilisent moins bien l’oxygène qui leur parvient. Un organe peut donc souffrir alors que la pression artérielle a été corrigée.</p>
<p>Le <button class="w" data-k="a41-lactate">lactate (mécanismes et limites)</button> traduit ce déséquilibre, mais pas seulement lui. Selon le groupe de travail Sepsis-3, plusieurs mécanismes l’élèvent : un apport tissulaire d’oxygène insuffisant, une respiration mitochondriale altérée, une glycolyse aérobie accélérée et une élimination hépatique réduite. Une élévation du lactate suggère un déséquilibre physiologique, mais peut aussi refléter une stimulation adrénergique ou une réduction de la clairance hépatique. Le lactate seul n’identifie ni l’agent ni le mécanisme de choc.</p>
<div class="key"><b>À retenir.</b> Le sepsis altère le débit capillaire et l’usage cellulaire de l’oxygène : un organe peut souffrir malgré une pression corrigée. Le lactate est un marqueur de gravité, et non un test diagnostique du sepsis.</div>
<h3>3.5 La coagulation</h3>
<p>L’inflammation et la coagulation agissent l’une sur l’autre. Leur interaction explique la baisse des plaquettes, qui fait partie du score SOFA.</p>
<p>L’inflammation active la coagulation par le facteur tissulaire exprimé sur les monocytes et l’endothélium. Les anticoagulants naturels, comme l’antithrombine et la protéine C, sont consommés, et la fibrinolyse est inhibée. Des microthrombi se forment dans les petits vaisseaux et consomment les plaquettes. La baisse des plaquettes est le signe le plus accessible de cette atteinte. La forme extrême est la <button class="w" data-k="a41-civd">coagulation intravasculaire disséminée (thromboses et saignements)</button>.</p>
<div class="key"><b>À retenir.</b> Le sepsis active la coagulation et consomme les plaquettes et les anticoagulants naturels. Une thrombopénie nouvelle chez un patient infecté est une défaillance d’organe.</div>
<h3>3.6 Des mécanismes aux signes, organe par organe</h3>
<p>Chaque mécanisme se traduit par un signe que le médecin peut voir. Le tableau et la figure de cette sous-partie relient les deux.</p>
<p>Le tableau suivant relie chaque organe à son mécanisme dominant, au signe clinique qu’il produit et à la variable du score SOFA qui le mesure. Il se lit ligne par ligne, de la cause au signe. La dernière colonne montre que chaque signe du lit du malade a son équivalent chiffré.</p>
<table class="t"><tr><th>Organe</th><th>Mécanisme dominant</th><th>Signe clinique</th><th>Variable du score SOFA</th></tr><tr><td>Cerveau</td><td>Inflammation cérébrale, hypoperfusion, troubles des neurotransmetteurs</td><td>Confusion, somnolence, agitation</td><td>Score de Glasgow</td></tr><tr><td>Poumon</td><td>Fuite capillaire alvéolaire et inflammation</td><td>Polypnée, hypoxémie ; au maximum, syndrome de détresse respiratoire aiguë</td><td>Rapport PaO₂/FiO₂</td></tr><tr><td>Cœur et vaisseaux</td><td>Vasoplégie, fuite capillaire, cardiomyopathie septique</td><td>Hypotension, tachycardie, marbrures, recoloration capillaire lente</td><td>Pression artérielle moyenne et dose de vasopresseur</td></tr><tr><td>Rein</td><td>Baisse de perfusion, inflammation, microthrombi</td><td>Oligurie</td><td>Créatinine ou diurèse</td></tr><tr><td>Foie</td><td>Cholestase inflammatoire, hypoperfusion</td><td>Ictère, d’apparition tardive</td><td>Bilirubine</td></tr><tr><td>Coagulation</td><td>Consommation dans les microthrombi</td><td>Pétéchies, saignements, ischémies</td><td>Plaquettes</td></tr></table>
<p>La lecture utile commence par la troisième colonne, car ces signes sont visibles avant tout résultat. La confusion, la polypnée, l’hypotension et l’oligurie apparaissent tôt ; l’ictère apparaît tard. L’erreur fréquente consiste à attendre la bilirubine ou les plaquettes pour parler de défaillance. Chez Mme R., quatre signes de la troisième colonne sont présents dès l’arrivée : confusion, polypnée, hypotension et oligurie.</p>
<p>La figure 1 résume la chaîne en trois rangées. La rangée du haut montre la réponse normale, celle du milieu le sepsis, et celle du bas le traitement qui correspond à chaque étape.</p>

ation</text><text x="376" y="165">altérée</text><text x="526" y="147">Défaillance</text><text x="526" y="165">d’organe</text></g><g fill="#222" font-family="Georgia,serif" text-anchor="middle" font-size="12"><text x="75" y="260">Antibiotique,</text><text x="75" y="276">contrôle du foyer</text><text x="228" y="260">Hydrocortisone</text><text x="228" y="276">si choc septique</text><text x="376" y="260">Remplissage,</text><text x="376" y="276">noradrénaline</text><text x="526" y="260">Suppléance</text><text x="526" y="276">des organes</text></g></svg><figcaption>Figure 1 — En haut, réponse normale : l’infection reste localisée, la réponse immunitaire est régulée, l’endothélium conserve tonus et perméabilité, les organes restent perfusés. Au milieu, enchaînement clinique schématique du sepsis ; une seule anomalie biologique ne suffit pas à diagnostiquer le syndrome. En bas, traitement qui correspond à chaque étape : aucun traitement ne corrige directement la réponse dérégulée, que l’hydrocortisone, suggérée dans le choc septique, module seulement.</figcaption></figure>
<p>La figure se lit de gauche à droite, puis de haut en bas. Chaque case du milieu s’oppose à la case normale placée au-dessus d’elle : la réponse régulée devient dérégulée, et l’endothélium stable devient une microcirculation altérée. La rangée du bas montre qu’aucun traitement ne corrige toute la chaîne. L’antibiotique et le contrôle du foyer agissent sur la première case, le remplissage et la noradrénaline sur la troisième.</p>
<div class="key"><b>Corrélation mécanisme → traitement.</b> Le remplissage corrige une composante d’hypovolémie relative ; la noradrénaline restaure le tonus vasculaire ; le contrôle du foyer supprime une source persistante d’inflammation. Aucune de ces mesures ne remplace les autres. L’excès de solutés après la phase initiale accentue parfois l’œdème pulmonaire et tissulaire.</div>
<h3>3.7 Application à Mme R.</h3>
<p>Les mécanismes décrits expliquent chacun des signes de Mme R. Cette sous-partie les relie un à un.</p>
<p>L’échographie montrera plus loin qu’un calcul obstrue l’uretère droit. En amont de l’obstacle, les bactéries se multiplient dans une urine sous pression et passent dans le sang. La vasoplégie explique sa pression artérielle moyenne de 58 mmHg. La fuite capillaire et la baisse du retour veineux expliquent qu’elle réponde d’abord au remplissage. La confusion traduit l’atteinte cérébrale, la polypnée l’acidose et l’atteinte pulmonaire, l’oligurie l’atteinte rénale. La prednisone a atténué la fièvre, sans empêcher la défaillance.</p>
<div class="key"><b>À retenir.</b> Le sepsis naît d’une réponse de l’hôte qui dépasse le foyer : vasoplégie par excès de monoxyde d’azote, fuite capillaire, débit microcirculatoire hétérogène, microthrombi et atteinte mitochondriale. Ces mécanismes expliquent l’hypotension, les marbrures, la confusion, l’oligurie et l’élévation du lactate. Chaque traitement corrige une étape : l’antibiotique et le contrôle du foyer suppriment la cause, le remplissage et la noradrénaline restaurent la perfusion. L’îlot suivant décrit les foyers, les agents et les terrains qui déclenchent cette chaîne.</div>
</section>
<section class="ilot" id="a41-4"><h2><span class="n">4</span>Sources, agents et facteurs de risque</h2>
<p>Trois questions orientent les prélèvements, le choix de l’antibiotique et la recherche d’un foyer à drainer : d’où vient l’infection, quel agent la cause et quel terrain la favorise. Leurs réponses complètent le mécanisme de la défaillance, car la charge microbienne et la fragilité de l’hôte déterminent l’intensité de la réponse dérégulée.</p>
<h3>4.1 Les foyers</h3>
<p>Le foyer est la première information utile, car il désigne à la fois l’agent probable et le geste éventuel. Sa fréquence dépend du lieu de soins étudié.</p>
<p>Le foyer guide les prélèvements, l’antibiothérapie et le contrôle anatomique : poumon, voies urinaires, abdomen et voies biliaires, peau ou tissus mous, cathéter ou dispositif, système nerveux central. Dans l’étude européenne SOAP, menée en 2002 dans 198 unités de soins intensifs de 24 pays, le foyer était pulmonaire dans 68 % des sepsis et abdominal dans 22 %. Dans les bactériémies, la hiérarchie change. Dans l’essai BALANCE (2025 ; 3 608 patients hospitalisés, dont 55 % en soins intensifs), l’origine était urinaire dans 42,2 % des cas, abdominale dans 18,8 % et pulmonaire dans 13,0 %. La présence d’un foyer ne dispense pas de vérifier les autres si l’évolution est discordante.</p>
<div class="key"><b>À retenir.</b> Le poumon domine chez les patients septiques de soins intensifs, les voies urinaires dans les bactériémies. Un premier foyer trouvé n’exclut pas un second.</div>
<h3>4.2 Les agents</h3>
<p>L’agent se déduit du foyer avant d’être prouvé par la culture. Cette sous-partie donne les agents habituels de chaque foyer.</p>
<p>Les bactéries causent la majorité des sepsis ; les virus, les champignons et les parasites en causent une part moindre. En Suisse, le Swiss Sepsis Report note que les codes d’infection virale ont presque doublé chez l’adulte entre 2019 et 2021, surtout en raison du SARS-CoV-2. Dans l’étude SOAP, une culture était positive chez 60 % des patients septiques. Les agents les plus fréquents étaient <i>Staphylococcus aureus</i> (30 %, dont 14 % résistants à la méticilline), les <i>Pseudomonas</i> (14 %) et <i>Escherichia coli</i> (13 %).</p>
<p>Le tableau suivant associe chaque foyer à ses agents habituels, à l’indice clinique qui l’évoque et au geste qu’il peut imposer. La deuxième colonne oriente l’antibiotique ; la quatrième rappelle qu’un foyer se draine parfois.</p>
<table class="t"><tr><th>Foyer</th><th>Agents habituels</th><th>Indice clinique</th><th>Geste possible</th></tr><tr><td>Voies urinaires</td><td><i>Escherichia coli</i> et autres entérobactéries ; entérocoques</td><td>Brûlures mictionnelles, douleur lombaire, sonde urinaire</td><td>Dérivation des urines en cas d’obstacle</td></tr><tr><td>Poumon</td><td><i>Streptococcus pneumoniae</i>, <i>Haemophilus influenzae</i>, <i>Staphylococcus aureus</i>, <i>Legionella</i>, virus respiratoires</td><td>Toux, expectoration, crépitants, hypoxémie</td><td>Drainage d’un empyème</td></tr><tr><td>Abdomen et voies biliaires</td><td>Entérobactéries, anaérobies, entérocoques</td><td>Douleur abdominale, défense, ictère</td><td>Chirurgie d’une perforation, drainage d’un abcès ou des voies biliaires</td></tr><tr><td>Peau et tissus mous</td><td><i>Streptococcus pyogenes</i>, <i>Staphylococcus aureus</i> ; flore mixte dans les infections nécrosantes</td><td>Érythème, douleur disproportionnée, bulles, crépitation</td><td>Exploration chirurgicale immédiate d’une infection nécrosante</td></tr><tr><td>Cathéter ou dispositif</td><td>Staphylocoques à coagulase négative, <i>Staphylococcus aureus</i>, bacilles à Gram négatif, <i>Candida</i></td><td>Inflammation du point d’insertion, frissons lors de l’utilisation du cathéter</td><td>Retrait raisonné du dispositif</td></tr><tr><td>Système nerveux central</td><td><i>Streptococcus pneumoniae</i>, <i>Neisseria meningitidis</i> ; <i>Listeria monocytogenes</i> chez le sujet âgé ou immunodéprimé</td><td>Céphalées, raideur de nuque, purpura, trouble de conscience</td><td>Drainage d’un abcès ou d’un empyème</td></tr></table>
<p>Le tableau se lit à partir de l’indice clinique, que le médecin trouve en premier. L’erreur fréquente consiste à s’arrêter au premier foyer trouvé : une infection urinaire banale n’explique ni un purpura ni une raideur de nuque. Pour Mme R., la ligne des voies urinaires s’applique : brûlures, douleur lombaire et antécédent de calcul, qui fait craindre un obstacle.</p>
<div class="key"><b>À retenir.</b> Chaque foyer oriente vers ses agents habituels, qui guident l’antibiotique avant la culture. Les entérobactéries, <i>Escherichia coli</i> au premier rang, dominent le foyer urinaire.</div>
<h3>4.3 Le terrain</h3>
<p>Le même agent ne produit pas le même sepsis chez tous les patients. Le terrain détermine le risque, la présentation et la gravité.</p>
<p>L’âge vient au premier rang : en Suisse, 70,2 % des séjours codés sepsis concernent des personnes de 65 ans et plus. Chez elles, environ 20 % des séjours comportent au moins deux maladies chroniques, comme un cancer, un diabète, une maladie pulmonaire ou rénale chronique. Dans un audit mondial de 10 069 patients de soins intensifs réalisé en 2012, l’âge, le cancer, l’insuffisance cardiaque de classe III ou IV de la New York Heart Association et la cirrhose étaient associés de façon indépendante au décès hospitalier des patients septiques.</p>
<p>Le tableau suivant explique pourquoi chaque terrain compte. La première colonne nomme le facteur, la deuxième donne son mécanisme, et la troisième dit ce qu’il change pour le médecin.</p>
<table class="t"><tr><th>Facteur</th><th>Mécanisme</th><th>Conséquence pratique</th></tr><tr><td>Âge avancé</td><td>Immunité moins efficace, comorbidités, fièvre atténuée</td><td>Présentation atypique ; seuil de suspicion plus bas</td></tr><tr><td>Corticothérapie au long cours</td><td>Réponse inflammatoire atténuée ; axe corticotrope freiné</td><td>Fièvre parfois absente ; <button class="w" data-k="a41-cortico">dose de stress d’hydrocortisone (recommandation de 2024)</button></td></tr><tr><td>Chimiothérapie, neutropénie</td><td>Manque de polynucléaires</td><td>Signes locaux discrets ; antibiotique sans délai</td></tr><tr><td>Asplénie</td><td>Élimination défaillante des bactéries encapsulées</td><td><button class="w" data-k="a41-asplenie">infection fulminante possible (asplénie)</button></td></tr><tr><td>Diabète</td><td>Fonction des polynucléaires altérée</td><td>Infections urinaires et cutanées plus graves</td></tr><tr><td>Cirrhose</td><td>Immunité altérée, élimination hépatique du lactate réduite</td><td>Lactate plus difficile à interpréter</td></tr><tr><td>Dispositif invasif, chirurgie récente</td><td>Porte d’entrée cutanée ou muqueuse</td><td><button class="w" data-k="a41-atcd-device">point d’entrée à inspecter (dispositifs et interventions)</button></td></tr><tr><td>Hospitalisation ou antibiothérapie récentes</td><td>Sélection de germes résistants</td><td><button class="w" data-k="a41-bmr">risque de germes multirésistants (critères 2026)</button></td></tr><tr><td>Grossesse et post-partum</td><td>Adaptation physiologique, foyers propres</td><td>Collaboration obstétricale, décrite à l’îlot 11</td></tr></table>
<p>Le médecin lit d’abord la troisième colonne, qui transforme un antécédent en décision. L’erreur fréquente consiste à noter l’antécédent sans en tirer la conséquence : une corticothérapie inscrite au dossier doit déclencher la dose de stress d’hydrocortisone. Mme R. cumule deux lignes du tableau : l’âge et la corticothérapie au long cours.</p>
<div class="key"><b>À retenir.</b> L’âge, les comorbidités, l’immunodépression, l’asplénie et les dispositifs augmentent le risque et la gravité du sepsis. Chaque terrain entraîne une décision précise, comme la dose de stress d’hydrocortisone sous corticothérapie.</div>
<h3>4.4 Le risque de résistance et le spectre empirique</h3>
<p>Le terrain oriente aussi le spectre de l’antibiotique. Le médecin doit y éviter deux erreurs opposées.</p>
<p>Un spectre trop large pour tous exposerait inutilement à la toxicité et à la sélection de résistances. Un spectre trop étroit exposerait au traitement inactif d’un germe résistant. La Surviving Sepsis Campaign 2026 règle ce dilemme par les facteurs de risque individuels, détaillés dans la fenêtre <button class="w" data-k="a41-bmr">germes multirésistants, anaérobies et champignons (critères 2026)</button>. L’antibiothérapie récente et une colonisation connue modifient la probabilité de résistance.</p>
<div class="trap"><span class="k">Piège</span>La couverture de bactéries multirésistantes et d’anaérobies n’est pas universelle : la Surviving Sepsis Campaign 2026 suggère de couvrir un agent multirésistant seulement en cas de risque élevé (colonisation ou infection antérieure par cet agent, antibiothérapie à large spectre prolongée, hospitalisation prolongée dans une unité où il est fréquent) et d’inclure une couverture anaérobie seulement en présence de facteurs de risque (foyer intra-abdominal ou gynéco-obstétrical profond, infection nécrosante des tissus mous, foyer de la tête et du cou, abcès ou empyème du système nerveux central). Elle suggère aussi de ne pas prescrire d’antifongique empirique en routine.</div>
<div class="key"><b>À retenir.</b> Le spectre empirique suit les facteurs de risque du patient, et non une règle universelle. Sans facteur de risque, la couverture des germes multirésistants, des anaérobies et des champignons n’est pas suggérée.</div>
<h3>4.5 Les foyers qui imposent un geste</h3>
<p>Certains foyers ne guérissent pas par l’antibiotique seul. L’antibiotique pénètre mal une cavité close ou un tissu nécrosé, et le foyer entretient la charge microbienne.</p>
<p>Une obstruction urinaire infectée peut nécessiter un drainage ; un abcès, une évacuation ; un cathéter infecté, un retrait raisonné ; une infection nécrosante, une exploration chirurgicale immédiate. La Surviving Sepsis Campaign 2026 en fait un principe de bonne pratique : tout patient septique est rapidement évalué à la recherche d’un foyer qui exige un contrôle urgent. Elle suggère un contrôle précoce du foyer, idéalement dans les six heures suivant le diagnostic du sepsis ou du choc septique qui impose ce geste.</p>
<p>Chez Mme R., aucun facteur de risque de germe multirésistant n’est présent : ni hospitalisation, ni antibiotique au cours de l’année écoulée, ni colonisation connue. Le foyer urinaire n’impose pas de couverture anaérobie. L’antécédent de calcul fait en revanche craindre un obstacle, donc un foyer à drainer.</p>
<div class="key"><b>À retenir.</b> Le foyer le plus fréquent est pulmonaire en soins intensifs et urinaire dans les bactériémies ; chaque foyer a ses agents habituels et parfois un geste obligatoire, idéalement dans les six heures. L’âge, les comorbidités, l’immunodépression et les dispositifs augmentent le risque et la gravité. Le spectre de l’antibiotique suit les facteurs de risque individuels de résistance, d’anaérobies et de champignons. L’îlot suivant montre comment l’anamnèse recueille ces informations.</div>
<button class="pareto-btn ui" data-k="pareto-a41-physio">▲ Loi de Pareto — Physiopathologie, foyers et terrain</button></section>
<section class="ilot" id="a41-5"><h2><span class="n">5</span>Anamnèse orientée vers le foyer et la nouvelle défaillance</h2>
<p>L’anamnèse poursuit quatre buts en quelques minutes : établir l’infection et son foyer, dater une défaillance nouvelle, repérer ce qui modifie l’antibiotique et connaître les volontés du patient. Elle se mène en même temps que les premiers soins, jamais avant eux. Elle recueille les éléments de terrain décrits à l’îlot précédent.</p>
<h3>5.1 Antécédents pertinents et médicaments</h3>
<p>Les antécédents changent l’agent probable, la présentation et le traitement. Le médecin les interroge dans un ordre qui va de l’immunité aux volontés du patient.</p>
<div class="two"><div class="card"><h4>Immunité, portes d’entrée et antécédents infectieux</h4><p>Le médecin demande d’abord les traitements qui affaiblissent l’immunité : leur nom, leur dose et la date de la dernière prise. C’est l’objet de la fenêtre <button class="w" data-k="a41-atcd-immune">immunosuppression (traitements, durée, neutropénie)</button>. Une corticothérapie au long cours impose en plus une <button class="w" data-k="a41-cortico">dose de stress d’hydrocortisone (insuffisance surrénalienne induite)</button>. Il recherche ensuite un <button class="w" data-k="a41-atcd-device">dispositif ou une intervention récente (porte d’entrée)</button>, une <button class="w" data-k="a41-asplenie">asplénie (infections fulminantes)</button>, une infection ou une colonisation antérieure documentée et les antibiotiques récents.</p></div><div class="card"><h4>Fonctions d’organe, allergies et expositions</h4><p>Le médecin compare chaque fonction à son état antérieur, grâce à la <button class="w" data-k="a41-atcd-organ">fonction rénale, hépatique et cardiaque antérieure (comparaison)</button>. Seule cette comparaison permet de dire qu’une défaillance est nouvelle. Il caractérise toute <button class="w" data-k="a41-allergie">allergie médicamenteuse (substance, délai, manifestation, gravité)</button>, car une allergie mal décrite peut priver le patient du meilleur antibiotique. Il note les vaccinations, une splénectomie et les voyages récents selon le contexte.</p></div></div>
<p>Le médecin s’informe enfin des <button class="w" data-k="a41-directives">objectifs de soins et directives anticipées (discussion précoce)</button>. Chez une personne très âgée ou gravement malade, ils déterminent le niveau de soins que le patient accepte. La Surviving Sepsis Campaign 2026 demande d’en discuter avec le patient ou ses proches, et suggère de le faire tôt, dans les 72 heures (recommandation conditionnelle, certitude faible).</p>
<div class="key"><b>À retenir.</b> Les antécédents utiles sont l’immunodépression, la corticothérapie, les dispositifs, l’asplénie, les infections et antibiotiques antérieurs, les fonctions d’organe de base, les allergies caractérisées et les volontés du patient.</div>
<h3>5.2 Symptômes de la maladie actuelle</h3>
<p>Les symptômes servent deux questions distinctes. Les uns désignent le foyer ; les autres révèlent une défaillance.</p>
<p>Le médecin fait décrire le début des symptômes, la source plausible et leur chronologie. Il interroge ensuite, système par système, les voies respiratoires, les voies urinaires, l’appareil digestif, la peau et les dispositifs. Le tableau des foyers de l’îlot 4 donne les indices propres à chacun.</p>
<p>Il recherche ensuite, de façon explicite, les symptômes de défaillance. Une <button class="w" data-k="a41-sympt-conf">confusion nouvelle (début et état antérieur)</button> traduit une atteinte cérébrale. Une <button class="w" data-k="a41-sympt-dysp">dyspnée (hypoxémie et travail respiratoire)</button> traduit une atteinte pulmonaire ou une acidose. Une <button class="w" data-k="a41-oligurie">oligurie (définition et mesure)</button> traduit une atteinte rénale. Une faiblesse intense, une chute, un malaise ou des marbrures remarquées par l’entourage complètent le tableau.</p>
<p>Les <button class="w" data-k="a41-frissons">frissons (degré et valeur pour la bactériémie)</button> ont une valeur graduée. Dans une étude de 526 patients fébriles aux urgences, des frissons avec tremblement de tout le corps sous une couverture épaisse s’associaient à un risque relatif de bactériémie de 12,1 par rapport à l’absence de frissons. L’absence de tout frisson rendait la bactériémie moins probable, sans l’exclure. Frissons et fièvre peuvent pourtant manquer chez une personne âgée ou immunodéprimée : la <button class="w" data-k="a41-fievre">fièvre ou l’hypothermie (mesure et interprétation)</button> ne conditionne pas la recherche du sepsis.</p>
<div class="key"><b>À retenir.</b> Le médecin date chaque symptôme et recherche les signes de défaillance : confusion, dyspnée, oligurie, faiblesse. Des frissons avec tremblement de tout le corps orientent vers une bactériémie ; l’absence de fièvre n’exclut rien.</div>
<h3>5.3 Formes typiques et atypiques</h3>
<p>Le sepsis se présente sous des formes très différentes selon le foyer et le terrain. Les cartes suivantes décrivent les plus instructives.</p>
<div class="two"><div class="card"><h4>Présentation typique</h4><p>Des brûlures mictionnelles et des frissons précèdent une hypotension, une confusion et une augmentation aiguë de la créatinine. Ce tableau oriente vers une infection urinaire haute, dont le médecin recherche aussitôt un obstacle éventuel.</p></div><div class="card"><h4>Présentation trompeuse du sujet âgé</h4><p>Une chute et une confusion surviennent sans fièvre chez une personne âgée, et aucun foyer n’est évident à l’arrivée. La recherche clinique et les prélèvements n’attendent pas une température élevée.</p></div><div class="card"><h4>Défaillance isolée révélatrice</h4><p>Une insuffisance rénale aiguë, une thrombopénie ou une confusion inexpliquée peuvent révéler un sepsis sans foyer apparent. Le groupe de travail Sepsis-3 le rappelle : toute défaillance d’organe inexpliquée doit faire évoquer une infection.</p></div><div class="card"><h4>Patient neutropénique</h4><p>Sans polynucléaires, le patient ne forme ni pus ni infiltrat visible. La fièvre peut être le seul signe d’une infection grave, et elle impose un antibiotique immédiat.</p></div><div class="card"><h4>Patient splénectomisé</h4><p>Une infection à pneumocoque ou à méningocoque peut évoluer en quelques heures vers un purpura extensif et un choc. Le médecin administre l’antibiotique avant tout examen.</p></div><div class="card"><h4>Infection nécrosante des tissus mous</h4><p>Une douleur disproportionnée par rapport à l’aspect de la peau, une progression rapide et des bulles signalent une <button class="w" data-k="a41-fasciite">infection nécrosante (signes et urgence chirurgicale)</button>. L’imagerie ne doit pas retarder l’exploration chirurgicale lorsque la suspicion est forte.</p></div><div class="card"><h4>Choc toxique</h4><p>Une fièvre, une éruption érythémateuse diffuse et un choc rapide évoquent une toxine staphylococcique ou streptococcique. Une plaie, une chirurgie ou un tampon vaginal en sont des portes d’entrée possibles, et le codage relève de la catégorie A48.</p></div><div class="card"><h4>Présentation de Mme R.</h4><p>Mme R. réunit les deux premières formes. Son foyer urinaire est évident, mais la confusion domine, et la prednisone atténue la fièvre.</p></div></div>
<div class="key"><b>À retenir.</b> La forme typique associe un foyer évident et une défaillance ; les formes atypiques se révèlent par une défaillance isolée, une chute, l’absence de fièvre ou une évolution fulminante. Le seuil de suspicion s’abaisse chez le sujet âgé, l’immunodéprimé et le splénectomisé.</div>
<h3>5.4 L’anamnèse de Mme R.</h3>
<p>Les réponses de la fille de Mme R. complètent le tableau. Elles transforment plusieurs signes en défaillances nouvelles.</p>
<p>La fille précise que sa mère était autonome et parfaitement orientée la veille : la confusion est donc nouvelle et compte comme une défaillance. Mme R. n’a été ni hospitalisée ni traitée par antibiotique au cours de l’année écoulée, et elle n’a pas d’allergie connue. Elle prend de la prednisone chaque jour depuis deux ans, ce qui impose une dose de stress d’hydrocortisone. Elle n’a jamais reçu de vaccin contre le pneumocoque. Elle a exprimé le souhait d’être réanimée si une chance raisonnable de guérison existe.</p>
<div class="key"><b>À retenir.</b> L’anamnèse date chaque symptôme et compare chaque fonction à l’état antérieur : c’est ainsi qu’une confusion ou une oligurie devient une défaillance nouvelle. Elle recherche l’immunodépression, la corticothérapie, les dispositifs, les antibiotiques récents, les allergies caractérisées et les volontés du patient. La fièvre peut manquer, surtout chez la personne âgée ou sous corticoïdes. L’îlot suivant apprend à mesurer ces défaillances à l’examen clinique.</div>
</section>
<section class="ilot" id="a41-6"><h2><span class="n">6</span>Examen clinique : perfusion, organes, foyer</h2>
<p>L’examen clinique répond à trois questions dans un ordre fixe : le patient est-il en danger immédiat, quels organes défaillent, où se trouve le foyer ? Il suit la séquence état général, signes vitaux, anthropométrie, puis signes ciblés. L’objectif est de reconnaître la défaillance, puis de trouver le foyer en parallèle du traitement. L’examen se répète, car l’état d’un patient septique peut changer en quelques heures.</p>
<h3>6.1 État général et conscience</h3>
<p>Le premier regard précède tout instrument. Il permet de reconnaître un patient en danger avant toute mesure.</p>
<p>Le médecin observe d’abord la conscience, l’agitation ou la somnolence, la couleur de la peau, la sueur et l’effort respiratoire. Il cote la conscience par le <button class="w" data-k="a41-glasgow">score de Glasgow (yeux, parole, motricité)</button>, qui entre dans le score SOFA. Il recherche une confusion par une question d’orientation et une épreuve simple d’attention. Il compare enfin le résultat à l’état habituel décrit par l’entourage.</p>
<div class="key"><b>À retenir.</b> Un score de Glasgow inférieur à 15 correspond à l’altération mentale du qSOFA ; un score de 13 ou 14 rapporte 1 point au score SOFA.</div>
<h3>6.2 Signes vitaux</h3>
<p>Les signes vitaux se mesurent dès l’arrivée, puis à intervalles rapprochés. Chacun possède un seuil qui change la décision.</p>
<p>Le tableau suivant rassemble ces seuils. La première colonne nomme le paramètre. La deuxième donne la plage qui ne rapporte aucun point dans le <button class="w" data-k="a41-news2">National Early Warning Score 2 (score d’alerte précoce)</button> ; elle sert ici de repère de normalité. La troisième donne le seuil des critères de réponse inflammatoire ou du qSOFA. La quatrième explique ce que signifie un écart.</p>
<table class="t"><tr><th>Paramètre</th><th>Plage à 0 point (score d’alerte)</th><th>Seuil des critères de réponse inflammatoire ou du qSOFA</th><th>Signification d’un écart</th></tr><tr><td>Fréquence respiratoire</td><td>12 à 20 par minute</td><td>Plus de 20 par minute (réponse inflammatoire) ; 22 par minute ou plus (qSOFA)</td><td>Premier signe de gravité ; compensation d’une acidose ou atteinte pulmonaire</td></tr><tr><td>SpO₂ à l’air ambiant</td><td>96 % ou plus</td><td>Aucun seuil propre</td><td>Hypoxémie de pneumonie ou d’œdème ; mesure moins fiable en état de choc</td></tr><tr><td>Pression artérielle systolique</td><td>111 à 219 mmHg</td><td>100 mmHg ou moins (qSOFA)</td><td>Défaillance circulatoire ; la pression moyenne guide le traitement</td></tr><tr><td>Fréquence cardiaque</td><td>51 à 90 par minute</td><td>Plus de 90 par minute (réponse inflammatoire)</td><td>Compensation de la vasoplégie ; tachycardie parfois absente sous bêtabloquant</td></tr><tr><td>Conscience</td><td>Éveil et orientation normaux</td><td>Altération mentale (qSOFA)</td><td>Défaillance cérébrale si elle est nouvelle</td></tr><tr><td>Température</td><td>36,1 à 38,0 °C</td><td>Plus de 38 °C ou moins de 36 °C (réponse inflammatoire)</td><td>Fièvre présente ou absente ; 35,0 °C ou moins rapporte 3 points au score d’alerte</td></tr></table>
<p>Le médecin lit d’abord la dernière colonne, qui dit pourquoi l’écart compte. L’erreur fréquente consiste à estimer la fréquence respiratoire d’un coup d’œil ; elle se compte sur une minute entière, comme l’explique la fenêtre <button class="w" data-k="a41-sign-rr">fréquence respiratoire (comptage complet)</button>. La <button class="w" data-k="a41-spo2">SpO₂ (principe et limites de l’oxymétrie)</button> perd sa fiabilité en état de choc, ce qui justifie une gazométrie artérielle. Chez Mme R., cinq paramètres sortent de la deuxième colonne : fréquence respiratoire, SpO₂, pression systolique, fréquence cardiaque et conscience. Son score d’alerte atteint 13 points, bien au-delà du seuil de 7 qui impose une réponse d’urgence.</p>
<p>La <button class="w" data-k="a41-pam">pression artérielle moyenne (mesure et signification)</button> guide le traitement du choc, car elle représente la pression qui perfuse les organes. Les tensiomètres automatiques la mesurent directement. Chez Mme R., elle vaut 58 mmHg, sous la cible initiale de 65 mmHg ; après 65 ans, une plage de 60 à 65 mmHg est suggérée.</p>
<div class="key"><b>À retenir.</b> La fréquence respiratoire se compte sur une minute, la pression artérielle moyenne guide le traitement, et la SpO₂ se vérifie par une gazométrie en cas de choc. Un score d’alerte de 7 points ou plus impose une réponse d’urgence.</div>
<h3>6.3 Anthropométrie</h3>
<p>Le poids sert à calculer le remplissage et les doses. Une erreur de poids se répercute sur tout le traitement.</p>
<p>Le médecin note le poids réel, mesuré ou rapporté, et la taille. La Surviving Sepsis Campaign 2026 calcule le remplissage initial sur le poids réel, ou sur le poids ajusté ou idéal lorsque l’indice de masse corporelle dépasse 30 kg/m². Chez Mme R., qui pèse 60 kg pour 1,62 m, l’indice vaut 22,9 kg/m² : le poids réel s’applique, et 30 mL/kg représentent 1 800 mL. Le médecin documente aussi le bilan hydrique et la diurèse, qui guideront la suite du remplissage.</p>
<div class="key"><b>À retenir.</b> Le volume de remplissage se calcule sur le poids réel, sauf si l’indice de masse corporelle dépasse 30 kg/m². Pour Mme R., 30 mL/kg représentent 1 800 mL.</div>
<h3>6.4 Signes de perfusion périphérique</h3>
<p>La peau et la diurèse renseignent sur la perfusion avant tout examen de laboratoire. Leur technique est simple, mais elle doit être rigoureuse.</p>
<p>La Surviving Sepsis Campaign 2021 rappelle que la température des extrémités, les marbrures et le temps de recoloration capillaire sont des signes validés et reproductibles de perfusion tissulaire. La fenêtre <button class="w" data-k="a41-sign-perfusion">recoloration capillaire et marbrures (technique, valeurs, essais)</button> en détaille la technique et les preuves.</p>
<p>Le temps de recoloration capillaire se mesure en appuyant fermement sur la pulpe de l’index avec une lame de verre, jusqu’au blanchiment, puis en maintenant la pression 10 secondes. Le médecin chronomètre ensuite le retour de la couleur normale ; au-delà de 3 secondes, le temps est anormal. Le score de marbrures cote de 0 à 5 l’étendue des marbrures, du centre du genou jusqu’au-delà du pli de l’aine. Dans une cohorte de 60 patients en choc septique, un score de 2 ou 3 six heures après la réanimation initiale s’associait à un rapport de cotes de décès à 14 jours de 16. Un score de 4 ou 5 s’associait à un rapport de 74, par rapport à un score de 0 ou 1.</p>
<p>La diurèse complète l’évaluation. Une <button class="w" data-k="a41-oligurie">oligurie (définition et mesure)</button> inférieure à 0,5 mL/kg/h pendant 6 heures suffit à définir une atteinte rénale aiguë selon KDIGO. Une sonde vésicale permet de la mesurer heure par heure lorsque le choc est installé.</p>
<p>La Surviving Sepsis Campaign 2026 définit le choc instable par l’examen physique. Elle cite une pression artérielle très basse, une peau marbrée, un teint cendré, une cyanose ou une désaturation, une tachycardie et une altération de l’état mental. Ce diagnostic clinique autorise à débuter le vasopresseur en même temps que le remplissage, au cas par cas.</p>
<div class="key"><b>À retenir.</b> Un temps de recoloration capillaire supérieur à 3 secondes, des marbrures étendues, des extrémités froides et une diurèse inférieure à 0,5 mL/kg/h signalent une hypoperfusion. Le choc instable se reconnaît à l’examen et autorise un vasopresseur immédiat.</div>
<h3>6.5 Signes ciblés : les organes et le foyer</h3>
<p>L’examen se termine par une inspection complète, de la tête aux pieds. Il cherche à la fois les défaillances d’organe et le foyer.</p>
<div class="two"><div class="card"><h4>Signes de défaillance d’organe</h4><p>La confusion et la somnolence traduisent l’atteinte cérébrale ; la fenêtre <button class="w" data-k="a41-sympt-conf">confusion (état antérieur et glycémie)</button> en décrit l’évaluation. La polypnée, le tirage et le recours aux muscles respiratoires accessoires traduisent l’atteinte pulmonaire, décrite dans la fenêtre <button class="w" data-k="a41-sympt-dysp">dyspnée (apparition, saturation, effort respiratoire)</button>. Le médecin ausculte les poumons avant et après chaque apport de soluté, car des crépitants nouveaux signalent un œdème pulmonaire. Des pétéchies ou un saignement aux points de ponction évoquent une <button class="w" data-k="a41-civd">coagulation intravasculaire disséminée (thromboses et saignements)</button>. Un ictère apparaît plus tardivement.</p></div><div class="card"><h4>Recherche du foyer</h4><p>L’<button class="w" data-k="a41-sign-focal">inspection ciblée (foyer et drainage)</button> examine le thorax, l’abdomen, les fosses lombaires, la peau entière, y compris sous les pansements et les dispositifs, les sites opératoires, les méninges, les articulations et le périnée. Une douleur localisée au thorax, au flanc, à l’abdomen, à la tête ou à un membre oriente la recherche. Une douleur disproportionnée, une crépitation ou des bulles imposent d’évoquer une <button class="w" data-k="a41-fasciite">infection nécrosante (signes et urgence chirurgicale)</button>. Un purpura qui s’étend impose l’antibiotique avant tout autre geste.</p></div></div>
<div class="key"><b>À retenir.</b> Chaque organe a son signe : confusion, polypnée, hypotension, oligurie, pétéchies, ictère. Le foyer se cherche sur tout le corps, sous les pansements et autour des dispositifs.</div>
<h3>6.6 L’examen de Mme R.</h3>
<p>L’examen de Mme R. applique cette séquence. Il confirme plusieurs défaillances et oriente vers un foyer précis.</p>
<p>Mme R. est somnolente et désorientée dans le temps ; elle ouvre les yeux spontanément et obéit aux ordres : son score de Glasgow vaut 14. Ses extrémités sont froides. Le temps de recoloration capillaire atteint 5 secondes, et des marbrures s’étendent jusqu’au bord supérieur de la rotule, soit un score de 2. La fosse lombaire droite est douloureuse à l’ébranlement, et il n’y a pas de globe vésical. Les poumons sont clairs, la nuque est souple et la peau ne montre aucune lésion.</p>
<div class="alert"><b>L’évaluation initiale est urgente.</b> Une hypotension soutenue, un trouble de conscience, une hypoxémie, des marbrures extensives, un travail respiratoire majeur ou une oligurie imposent l’appel de l’équipe de réanimation. Le médecin traite alors le choc et sa cause en même temps, sans attendre la fin des examens.</div>
<div class="quiz ui"><p>Après 1 500 mL de cristalloïde, un patient septique a une pression artérielle moyenne de 66 mmHg, mais un temps de recoloration capillaire de 4 secondes et des extrémités froides. Comment le médecin interprète-t-il cet examen ?</p><button data-ok="1">La perfusion reste insuffisante malgré une pression à la cible ; le médecin réévalue le débit, la réponse au remplissage et le foyer.</button><button data-ok="0">La pression est à la cible : la perfusion des organes est donc assurée.</button><button data-ok="0">Le temps de recoloration capillaire n’a pas de valeur chez l’adulte en choc.</button><p class="fb" hidden>Un temps supérieur à 3 secondes est anormal selon la technique standardisée des essais ANDROMEDA-SHOCK. Une pression artérielle moyenne corrigée n’assure pas la perfusion de chaque tissu. La Surviving Sepsis Campaign 2026 suggère d’utiliser le temps de recoloration capillaire pour guider la réanimation, en complément d’autres mesures de perfusion.</p></div>
<div class="key"><b>À retenir.</b> L’examen mesure la gravité avant de chercher le foyer : conscience, fréquence respiratoire comptée sur une minute, pression artérielle moyenne, fréquence cardiaque, SpO₂, température, diurèse et signes cutanés de perfusion. Un temps de recoloration capillaire supérieur à 3 secondes et des marbrures étendues signalent une hypoperfusion, même lorsque la pression paraît acceptable. L’examen se termine par une inspection complète, à la recherche du foyer. L’îlot suivant transforme ces données en diagnostic.</div>
