<template data-pop="a41-pct" data-title="Procalcitonine : production, cinétique et aide à l’arrêt antibiotique">
<p>La procalcitonine, ou PCT, est le précurseur de la calcitonine. Une inflammation systémique peut stimuler sa production au-delà du tissu thyroïdien. Müller décrit cette expression dans plusieurs tissus d’un modèle de péritonite chez le hamster ; ce modèle ne localise pas toute la production chez l’adulte septique.</p>
<p>Dans l’expérience humaine de Dandona après endotoxine, l’augmentation devient détectable à quatre heures, atteint un pic à six heures et reste élevée entre huit et vingt-quatre heures. Cette expérience ne donne pas une horloge universelle pour une infection spontanée. Un prélèvement précoce ou une infection localisée peut s’accompagner d’une valeur basse.</p>
<p>La fiche HUG 3940 du 28 juillet 2026 indique une valeur usuelle inférieure à 0,5 µg/L pour sa méthode. Cette borne ne confirme ni n’exclut le sepsis. Une inflammation non bactérienne peut aussi produire une hausse ; l’évaluation recherche le contexte, le foyer et les défaillances plutôt qu’un diagnostic fondé sur un seul chiffre.</p>
<p>Après chirurgie cardiaque sous circulation extracorporelle, Delannoy observe une hausse de PCT et ne trouve pas de séparation significative des pics entre sepsis et réponse inflammatoire classée non septique. Cette cohorte ne comprend que 32 adultes, dont 11 classés non septiques ; elle utilise une définition ancienne et une appréciation rétrospective par deux experts. Aucun pic chiffré n’est repris ici.</p><p>Wu compare 361 patients ayant une maladie rénale chronique à 119 témoins et observe une PCT plus élevée chez les premiers. La majorité présente une maladie avancée. L’exclusion de l’infection reposait sur des hémocultures négatives, qui n’écartent pas toute infection. Cette étude ne fournit pas un seuil rénal universel pour décider l’antibiotique.</p><p>La Surviving Sepsis Campaign 2026 suggère l’évaluation clinique seule plutôt que l’ajout de PCT pour commencer l’antibiotique : recommandation conditionnelle, certitude très faible. Elle suggère la PCT avec l’évaluation clinique pour aider à l’arrêt lorsque le foyer est contrôlé et que la durée optimale reste incertaine : recommandation conditionnelle, certitude faible.</p>
<p>Dans l’essai ouvert de Jong chez des adultes de soins intensifs, l’avis d’arrêt était non contraignant lorsque la PCT diminuait d’au moins 80 % du pic ou atteignait au plus 0,5 µg/L. Cette règle complète une évaluation ; elle ne justifie pas l’arrêt si le foyer persiste ou si le patient s’aggrave.</p>
<div class="card"><b>Exemple.</b> Une PCT de 0,2 µg/L au début d’une infection possible avec nouvelle confusion n’exclut pas le sepsis. Une baisse de 5 à 0,8 µg/L dépasse 80 %, mais ne suffit pas à interrompre le traitement d’un foyer non contrôlé.</div>
<div class="key"><b>À retenir.</b> La PCT accompagne une décision clinique. L’aide à l’arrêt conserve les conditions de contrôle du foyer et d’incertitude de durée.</div>
<p><b>Sources.</b> <a href="https://rpa.hug.ch/lvert/rpa/inf/fiches/FICHE_3940_.html" target="_blank" rel="noopener">HUG 3940, 28.07.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/7989463/" target="_blank" rel="noopener">Dandona 1994, résumé primaire humain</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11232031/" target="_blank" rel="noopener">Müller 2001, résumé primaire animal</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2811936/" target="_blank" rel="noopener">Delannoy 2009, texte primaire postopératoire</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7031592/" target="_blank" rel="noopener">Wu 2019/2020, texte primaire et limites rénales</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26947523/" target="_blank" rel="noopener">de Jong 2016, résumé de l’essai</a> ; <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-22" target="_blank" rel="noopener">Surviving Sepsis Campaign 2026, début</a> et <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-40" target="_blank" rel="noopener">arrêt</a>.</p>

<template data-pop="a41-crp" data-title="Protéine C réactive : synthèse, cinétique et limites diagnostiques">
<p>La protéine C réactive, ou CRP, est une protéine de phase aiguë principalement produite par les hépatocytes. L’interleukine 6 stimule cette synthèse. Une concentration élevée indique une réponse inflammatoire ; elle ne désigne pas un microorganisme ou un foyer.</p>
<p>La revue de Pepys et Hirschfield décrit une hausse vers six heures et un pic vers quarante-huit heures après un stimulus unique. Vigushin mesure une demi-vie plasmatique d’environ dix-neuf heures : les différences de concentration reflètent surtout la synthèse. Une inflammation prolongée ou répétée ne suit pas nécessairement une courbe unique.</p>
<p>La fiche HUG 3877 du 1er juillet 2026 donne une valeur usuelle inférieure à 10,0 mg/L pour sa méthode immunoturbidimétrique. Une CRP précoce peut rester basse malgré une infection. Une CRP haute peut accompagner une inflammation non infectieuse. La valeur usuelle de laboratoire ne définit pas le sepsis.</p>
<p>Dans la cohorte postopératoire de Delannoy, la CRP augmente aussi chez des patients sans réponse inflammatoire systémique et ne distingue pas les deux groupes inflammatoires. Cet exemple borne la non-spécificité après chirurgie cardiaque ; il ne fournit pas une fréquence de faux positifs pour tout contexte.</p><div class="card"><b>Exemple.</b> Une CRP de 80 mg/L dépasse la borne HUG citée mais ne précise pas la cause. Une valeur de 4 mg/L dans les premières heures n’écarte pas une infection si la clinique et les défaillances l’évoquent.</div>
<div class="key"><b>À retenir.</b> La CRP renseigne une réponse inflammatoire avec un décalage temporel. Elle ne confirme ni n’exclut, isolément, le sepsis.</div>
<p><b>Sources.</b> <a href="https://rpa.hug.ch/lvert/rpa/inf/fiches/FICHE_3877_.html" target="_blank" rel="noopener">HUG 3877, 01.07.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2811936/" target="_blank" rel="noopener">Delannoy 2009, contexte postopératoire</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8473487/" target="_blank" rel="noopener">Vigushin 1993, résumé primaire humain</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC161431/" target="_blank" rel="noopener">Pepys et Hirschfield 2003, revue et cinétique</a>.</p>
</template>

<template data-pop="a41-gaz-read" data-title="Gazométrie : trouble primaire, compensation et oxygénation">
<p>La gazométrie artérielle mesure le pH, la pression partielle artérielle en dioxyde de carbone, ou PaCO₂, et la pression partielle artérielle en oxygène, ou PaO₂. L’analyseur calcule le bicarbonate à partir de ses mesures. Ce résultat diffère d’un dosage enzymatique du bicarbonate sur plasma. La température et la fraction inspirée d’oxygène, ou FiO₂, accompagnent la lecture.</p>
<p>Les fiches Viollier de sang artériel, consultées le 8 octobre 2026 sans date éditoriale affichée, donnent un pH de 7,35–7,45, une PaCO₂ de 32–45 mmHg chez les femmes ou de 35–48 chez les hommes, et une PaO₂ de 83–108 mmHg. Leur bicarbonate standard est 21–29 mmol/L ; cette plage ne se substitue pas au bicarbonate actuel calculé. Medics publie un trou anionique de 8–16 mmol/L sur sérum/plasma, avec la formule sans potassium ; ce n’est pas une plage d’analyseur artériel. La FiO₂, la matrice et les intervalles du compte rendu doivent accompagner l’interprétation.</p><p>La lecture commence par le pH et les intervalles du laboratoire. Une baisse de bicarbonate oriente vers une composante métabolique acide ; une hausse de PaCO₂ vers une composante respiratoire acide. Le pH peut rester proche de 7,40 lorsque deux troubles opposés se combinent. Il faut ensuite comparer la compensation observée à celle attendue.</p>
<p>Pour une acidose métabolique, la règle de Winter donne une PaCO₂ attendue d’environ 1,5 × bicarbonate + 8 ± 2 mmHg, avec le bicarbonate en mmol/L. Une PaCO₂ plus basse évoque une alcalose respiratoire associée ; une valeur plus haute évoque une acidose respiratoire associée. Cette relation ne s’applique pas à tout trouble acido-basique.</p>
<p>Sans potassium, le trou anionique vaut sodium − chlorure − bicarbonate. Il dépend de la méthode et de l’albumine. La formule de correction de Jung ajoute environ 0,25 × (40 − albumine en g/L). Le seuil de 12 mmol/L employé dans cette recommandation n’est pas une norme universelle.</p>
<div class="card"><b>Exemple distinct du fil clinique.</b> Avec bicarbonate 12 mmol/L, la PaCO₂ attendue vaut 26 ± 2 mmHg. Une PaCO₂ à 20 mmHg suggère une alcalose respiratoire associée, même si le pH est proche de 7,40. Avec sodium 140, chlorure 106 et bicarbonate 12 mmol/L, le trou anionique vaut 22 mmol/L. Une albumine à 20 g/L conduit à un trou corrigé de 27 mmol/L. Ces nombres illustrent la méthode et ne remplacent pas les mesures d’un patient.</div>
<p>Une PaO₂ de 80 mmHg avec FiO₂ 0,40 donne un rapport PaO₂/FiO₂ de 200 mmHg. Un gaz veineux ne remplace pas la PaO₂ artérielle. La Surviving Sepsis Campaign 2026 suggère l’oxymétrie ou le gaz artériel avec le contexte clinique, avec une certitude très faible. Elle souligne la moindre précision du rapport SpO₂/FiO₂ en choc, chez les personnes à peau foncée et pour des saturations inférieures à 90 % ou supérieures à 97 %.</p>
<p>La fiche CHUV V16 du 16 juillet 2024 demande d’éliminer l’air, de mélanger et d’acheminer immédiatement la seringue. Elle indique une stabilité inférieure à quinze minutes, au maximum trente minutes, sans refroidissement et sans pneumatique. Cette procédure ne remplace pas celle d’un tube de lactate plasmatique.</p>
<div class="key"><b>À retenir.</b> Le pH, la PaCO₂, le bicarbonate, le trou anionique et le lactate se lisent ensemble. Intervalles et procédures restent attachés à la matrice et à l’analyseur.</div>
<p><b>Sources.</b> <a href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00717/gazometrie-arterielle" target="_blank" rel="noopener">CHUV, technique et préanalytique, V16 du 16.07.2024</a> ; <a href="https://www.viollier.ch/de/analysis/14136" target="_blank" rel="noopener">Viollier, pH artériel</a> ; <a href="https://www.viollier.ch/de/analysis/14146" target="_blank" rel="noopener">PaCO₂ artérielle</a> ; <a href="https://www.viollier.ch/de/analysis/14156" target="_blank" rel="noopener">PaO₂ artérielle</a> ; <a href="https://www.viollier.ch/de/analysis/14157" target="_blank" rel="noopener">bicarbonate standard</a> ; <a href="https://www.medics.ch/analysenverzeichnis/anionl" target="_blank" rel="noopener">Medics, trou anionique sur sérum/plasma</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6695455/" target="_blank" rel="noopener">Jung et coll. 2019, recommandations d’experts</a> ; <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-65" target="_blank" rel="noopener">Surviving Sepsis Campaign 2026, oxygénation</a>.</p>

<template data-pop="a41-science-reading" data-title="Pression, lactate et mitochondries : expliquer une discordance">
<p>La pression dépend du débit et des résistances. L’apport d’oxygène dépend aussi de l’hémoglobine et de la saturation. Une pression corrigée n’établit pas que la perfusion de chaque organe est restaurée. L’équipe suit la conscience, la diurèse, la peau, la respiration et les données cardiaques.</p>
<p>Le lactate résulte d’une production et d’une utilisation. La stimulation bêta-adrénergique peut accélérer la glycolyse même en présence d’oxygène. Le foie et les reins participent à son utilisation ; chez certains patients, le poumon peut aussi en produire. Une baisse de concentration en série ne mesure pas directement la clairance métabolique.</p>
<p>La pyruvate déshydrogénase oriente le pyruvate vers l’oxydation mitochondriale. Garcia-Alvarez rapporte des mesures humaines avec activité et flux oxydatif augmentés, tandis que certains modèles animaux présentent une inhibition plus tardive, notamment après vingt-quatre heures. Ces divergences interdisent de présenter l’inhibition comme obligatoire dans tout sepsis.</p>
<p>Brealey étudie des biopsies musculaires de vingt-huit patients septiques et neuf témoins. Une diminution d’ATP et de l’activité mitochondriale est associée à la gravité et au devenir dans cette population. Cette association ne démontre pas une cause unique du lactate ou une incapacité uniforme de toutes les mitochondries.</p>
<div class="card"><b>Exemple.</b> Après le vasopresseur, la pression remonte et les extrémités s’améliorent, mais le lactate reste élevé. Si la respiration se dégrade après le liquide, un nouveau bolus automatique peut ajouter une mauvaise tolérance. L’équipe recherche une perfusion encore insuffisante, une stimulation adrénergique, une élimination modifiée ou un foyer persistant.</div>
<p>La Surviving Sepsis Campaign 2026 suggère des mesures successives de lactate : recommandation conditionnelle, certitude faible. Elle demande d’individualiser le liquide et de ne pas poursuivre le remplissage jusqu’à sa normalisation.</p>
<div class="key"><b>À retenir.</b> La pression, le transport d’oxygène et le lactate renseignent des étapes différentes. Leur interprétation repose sur les organes, la réponse, la tolérance et le contrôle du foyer.</div>
<p><b>Sources.</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4421917/" target="_blank" rel="noopener">Garcia-Alvarez et coll. 2014, revue et divergence humain/modèles</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12133657/" target="_blank" rel="noopener">Brealey 2002, résumé primaire</a> ; <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-51" target="_blank" rel="noopener">Surviving Sepsis Campaign 2026, suivi du lactate</a>.</p>
</template>
