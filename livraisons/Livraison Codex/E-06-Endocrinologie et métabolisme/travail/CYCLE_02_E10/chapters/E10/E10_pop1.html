<template data-pop="e10-a01-fenetre-1" data-title="Glycémie : mesure et conditions"><div id="e10-a01-fenetre-1"><p>La valeur doit être accompagnée du type de prélèvement : plasma veineux au laboratoire, sang capillaire au lecteur ou glucose interstitiel au capteur. Ajouter l’heure, la relation au repas, les symptômes et le traitement déjà administré. Un lecteur permet de reconnaître rapidement une situation dangereuse ; la confirmation diagnostique repose sur une méthode de laboratoire lorsque la situation le permet.</p><p>Exemple fictif : 24 mmol/L au lecteur chez une personne qui vomit appelle un bilan et une orientation immédiats. Une seconde mesure ne doit pas retarder ce recours. À l’inverse, un résultat modérément élevé sans symptôme demande une confirmation organisée et l’analyse des conditions du prélèvement.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a01-fenetre-2" data-title="Insuline : rôle et actions"><div id="e10-a01-fenetre-2"><p>L’insuline agit comme un signal coordonnant plusieurs organes. Dans le muscle et le tissu adipeux, elle favorise l’entrée du glucose par mobilisation de transporteurs. Dans le foie, elle freine la production de glucose ; dans le tissu adipeux, elle freine la libération d’acides gras. Le manque du signal augmente donc à la fois le glucose sanguin et les substrats disponibles pour fabriquer des cétones.</p><p>Cette explication motive deux fonctions du traitement : une couverture basale entre les repas et une couverture prandiale des apports alimentaires. La première demeure nécessaire même en l’absence de repas.</p><p class="src">Sources : <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a01" data-title="Loi de Pareto — Cas initial et objectifs"><div id="pareto-e10-a01"><p class="ratio" data-cover="e10-a01"></p><ul><li>Séparer diagnostic, type et gravité. Chez une personne qui vomit et respire profondément, rechercher la cétose et l’acidose sans attendre les examens de classification.</li></ul><p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-a02-fenetre-1" data-title="Classification : arguments et incertitude"><div id="e10-a02-fenetre-1"><p>La classification repose sur un faisceau d’arguments. Une cétose indique une carence métabolique importante, mais elle n’est pas à elle seule un test d’auto-immunité. Les anticorps sont plus informatifs près du diagnostic. Si leur recherche est négative et que l’incertitude persiste, <button class="w" data-k="e10-gl-3">NICE</button> propose un peptide C non à jeun avec glycémie simultanée ; son pouvoir discriminant augmente avec le temps depuis le début.</p><p>Le raisonnement reste révisable : garder la sécurité de l’insulinothérapie nécessaire tout en réexaminant l’étiologie. Un résultat négatif isolé ne suffit pas à retirer un traitement indispensable.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-a02-fenetre-2" data-title="Fréquence suisse : dénominateurs"><div id="e10-a02-fenetre-2"><p>Numérateur MonAM : personnes déclarant un diagnostic de diabète ou un traitement. Dénominateur : population résidant en ménage privé en Suisse, âgée d’au moins 15 ans, estimée à partir de l’enquête de 2022. Résultat : 6,2 %, tous types confondus.</p><p>Les enfants de moins de 15 ans et les personnes vivant en institution ne sont pas couverts par cette définition. L’enquête ne distingue pas de façon fiable les types déclarés. Il serait donc incorrect d’étiqueter 6,2 % « fréquence du type 1 », de compter les utilisateurs d’insuline comme des types 1, ou de présenter cette observation comme une incidence annuelle.</p><p class="src">Sources : <a href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">OFSP / Obsan — Diabète (âge : 15+) — mise à jour 17 mars 2025, enquête 2022</a>.</p></div></template>
<template data-pop="pareto-e10-a02" data-title="Loi de Pareto — Définition, classification et fréquence"><div id="pareto-e10-a02"><p class="ratio" data-cover="e10-a02"></p><ul><li>Le phénotype oriente, les examens précisent, l’évolution peut faire réviser. Ne pas transformer une statistique suisse tous diabètes en fréquence du type 1.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">OFSP / Obsan — Diabète (âge : 15+) — mise à jour 17 mars 2025, enquête 2022</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="e10-a03-fenetre-1" data-title="Déficit insulinique : chaîne causale"><div id="e10-a03-fenetre-1"><p>Le tissu adipeux stocke les acides gras sous forme de triglycérides. Lorsque le frein insulinique manque, leur hydrolyse libère acides gras et glycérol. Le foie oxyde les acides gras dans ses mitochondries ; l’<button class="w" data-k="e10-gl-33">acétyl-CoA</button> produit peut alimenter la cétogenèse. L’acétoacétate et le β-hydroxybutyrate circulent ensuite vers les autres tissus.</p><p>Une cétose nutritionnelle et une acidocétose ne sont pas synonymes : il faut considérer la disponibilité de l’insuline, la production de cétones, l’hydratation et le pH. Chez une personne de type 1 malade, des cétones élevées ne doivent pas être banalisées parce que la glycémie paraît peu élevée.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-a03-fenetre-2" data-title="Symptômes : mécanisme et limites"><div id="e10-a03-fenetre-2"><p>La polyurie signifie un volume urinaire excessif ; elle ne signifie pas seulement uriner souvent. Le glucose urinaire augmente la quantité de particules dans le tubule, ce qui limite la récupération de l’eau et explique la soif compensatrice. Une nycturie récente peut ainsi révéler une hyperglycémie.</p><p>Vomissements, douleurs abdominales et respiration profonde peuvent orienter vers une acidocétose, mais une affection abdominale peut aussi la déclencher. La persistance d’une douleur malgré la correction métabolique oblige à réexaminer cette hypothèse. Les symptômes guident les examens ; ils ne remplacent ni la cétonémie ni la gazométrie.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Tran et al. — Review of Evidence for Adult DKA Management Protocols — 2017</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="pareto-e10-a03" data-title="Loi de Pareto — Mécanismes et symptômes"><div id="pareto-e10-a03"><p class="ratio" data-cover="e10-a03"></p><ul><li>Relier chaque symptôme à un flux : glucose urinaire et perte d’eau ; lipolyse et cétones ; acidose et ventilation. Puis mesurer la perturbation au lieu de la supposer.</li></ul><p class="src">Sources : <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Tran et al. — Review of Evidence for Adult DKA Management Protocols — 2017</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-a04-fenetre-1" data-title="Seuil diagnostique et intervalle normal"><div id="e10-a04-fenetre-1"><p>Un intervalle de référence décrit une population et une méthode de laboratoire. Un seuil diagnostique est une limite choisie pour classer une maladie. Une cible thérapeutique est un objectif adapté à une personne déjà malade. Ces trois nombres peuvent donc être différents sans contradiction.</p><p>Exemple : 5,5 mmol/L est la borne supérieure affichée par le catalogue Viollier cité ; 7,0 mmol/L est un seuil diagnostique à jeun ; la plage de temps dans la cible d’un capteur chez de nombreux adultes traités s’étend de 3,9 à 10,0 mmol/L. L’heure du prélèvement, les repas, le dispositif et le risque d’hypoglycémie donnent à chaque chiffre son sens.</p><p class="src">Sources : <a href="https://www.viollier.ch/fr/analysis/7380" target="_blank" rel="noopener">Viollier — catalogue glucose — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a04-fenetre-2" data-title="Classification biologique : portée des examens"><div id="e10-a04-fenetre-2"><p>Les autoanticorps témoignent d’une réponse immunitaire dirigée contre des antigènes des cellules β. Le peptide C est libéré lors de la maturation de la proinsuline ; contrairement à l’insuline injectée, il renseigne sur la sécrétion endogène. Une glycémie simultanée permet de savoir si cette sécrétion est appropriée au stimulus.</p><p>Une sécrétion mesurable au début n’exclut pas un type 1. À l’inverse, un peptide C bas pendant une crise ne suffit pas à reconstruire toute l’étiologie. La fonction rénale et la méthode influencent le résultat. L’équipe spécialisée choisit le moment et interprète les mesures en cas de diagnostic incertain.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="pareto-e10-a04" data-title="Loi de Pareto — Anamnèse, examen et diagnostic"><div id="pareto-e10-a04"><p class="ratio" data-cover="e10-a04"></p><ul><li>Mesurer avec le bon prélèvement, confirmer lorsque nécessaire et traiter l’urgence sans attendre la classification immunologique.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://www.viollier.ch/fr/analysis/7380" target="_blank" rel="noopener">Viollier — catalogue glucose — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="e10-a05-fenetre-1" data-title="Rapport insuline et glucides : bases, unités et limites"><div id="e10-a05-fenetre-1"><p>Un rapport glucides/insuline exprimé en g/U décrit combien de grammes sont couverts par une unité pour un repas et une situation donnés. L’opération est donc une division : grammes du repas ÷ grammes par unité. Si le rapport est exprimé dans l’autre sens, en U/g, l’opération devient une multiplication. Il faut lire les unités avant de calculer.</p><p>Avec le rapport fictif prescrit de 10 g/U, 45 g donnent 4,5 U. La dose effectivement administrable dépend du dispositif et du plan convenu. La <button class="w" data-k="e10-gl-2">SSED</button> décrit l’utilisation du comptage des glucides et des bolus ; elle ne fait pas de cet exemple une dose initiale universelle. Les repas riches en graisse, l’exercice et l’insuline active imposent une interprétation supplémentaire.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a05-fenetre-2" data-title="Facteur de correction : exemple sourcé"><div id="e10-a05-fenetre-2"><p>Le facteur de correction décrit la baisse de glycémie attendue pour une unité dans les conditions où il a été établi. Exemple fictif prescrit : 2 mmol/L/U. L’écart entre 12 mmol/L mesurés et 6 mmol/L visés vaut 6 mmol/L ; 6 mmol/L ÷ 2 mmol/L/U = 3 U.</p><p>Cette opération ne recommande pas d’injecter immédiatement 3 U. Une dose récente peut encore agir ; le capteur peut montrer une baisse ; une activité est peut-être prévue. Ajouter sans tenir compte de ces éléments expose à une accumulation de doses. L’équipe définit les paramètres et leur réévaluation. Aucune règle empirique de type 500 ou 1800 n’est présentée ici comme validée pour tous.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a05" data-title="Loi de Pareto — Stratégie d’insuline et éducation initiale"><div id="pareto-e10-a05"><p class="ratio" data-cover="e10-a05"></p><ul><li>Comprendre la fonction basale et la fonction prandiale, puis apprendre à adapter des paramètres prescrits. L’arithmétique ne remplace pas le contexte clinique.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-a06-fenetre-1" data-title="Acidocétose : critères et mécanismes"><div id="e10-a06-fenetre-1"><p>La cétose correspond à l’augmentation des corps cétoniques ; l’acidose correspond à leur retentissement, à apprécier avec le pH et les bicarbonates. Pour le <button class="w" data-k="e10-gl-4">JBDS</button> 2023 adulte, les trois composantes diagnostiques sont glucose > 11 mmol/L ou diabète connu, cétones > 3 mmol/L ou urine ≥ 2+, et pH veineux < 7,3 et/ou bicarbonates < 15 mmol/L.</p><p>Le tableau <button class="w" data-k="e10-gl-30">RMS</button> 2019 utilise d’autres limites, notamment glucose ≥ 14 mmol/L et bicarbonates ≤ 18 mmol/L. Il s’agit de versions et de cadres différents, pas de nombres à combiner. Une glycémie inférieure à 14 ne permet donc pas d’exclure la crise. En pédiatrie, appliquer le protocole de l’équipe pédiatrique, pas les débits adultes.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p></div></template>
<template data-pop="e10-a06-fenetre-2" data-title="Trouble de conscience : démarche discriminante"><div id="e10-a06-fenetre-2"><p>La première discrimination est rapide : une glycémie basse peut expliquer immédiatement le trouble de conscience et exige un secours adapté. Si elle est élevée, mesurer cétones et pH, puis apprécier l’osmolalité, la perfusion et la fonction rénale. Ni une glycémie élevée ni un diabète connu n’excluent un AVC, un sepsis ou une intoxication.</p><p>L’état hyperosmolaire a souvent une installation plus lente et exige une correction osmotique prudente. Les données <button class="w" data-k="e10-gl-4">JBDS</button> concernent l’adulte hospitalisé ; elles ne fournissent pas une recette unique pour un tableau mixte ou un enfant. La surveillance neurologique répétée permet de repérer une détérioration qui ne s’explique pas par la seule évolution du glucose.</p><p class="src">Sources : <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a>.</p></div></template>
<template data-pop="pareto-e10-a06" data-title="Loi de Pareto — Décompensations et états avec coma"><div id="pareto-e10-a06"><p class="ratio" data-cover="e10-a06"></p><ul><li>Urgence clinique d’abord ; glucose, cétones et pH ensuite. Poursuivre le traitement de la cétose même lorsque le glucose baisse, avec apport glucosé et surveillance du potassium adaptés.</li></ul><p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a07-fenetre-1" data-title="Hypoglycémie : gradation et conduite"><div id="e10-a07-fenetre-1"><p>Deux axes sont nécessaires. L’axe biologique distingue < 3,9 et < 3,0 mmol/L dans les rapports de capteur. L’axe fonctionnel demande si la personne peut encore se traiter : une aide extérieure nécessaire définit le niveau 3. Le seuil hospitalier HUG < 4 mmol/L privilégie une action simple et précoce.</p><p>Le protocole <button class="w" data-k="e10-gl-29">HUG</button> adulte lu utilise 15 g par voie orale, ou 30 g sous 2,5 mmol/L, puis une mesure à 20–30 minutes. Ne pas fusionner ce délai avec celui d’un autre protocole. En cas de trouble de conscience ou de déglutition, aucun aliment ni liquide par la bouche ; secours prescrit et appel urgent. Chez l’enfant, suivre le plan pédiatrique.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-a07-fenetre-2" data-title="Glucagon : produit, usage et limites"><div id="e10-a07-fenetre-2"><p>Baqsimi 3 mg poudre nasale est un récipient unidose de glucagon. L’information professionnelle suisse indique une dose intranasale unique de 3 mg chez l’adulte et l’enfant dès 1 an ayant un diabète et une hypoglycémie sévère. L’absorption est passive ; la personne n’a pas besoin d’inhaler. Le produit doit être accessible et son emploi appris par l’entourage.</p><p>Il est contre-indiqué en cas de phéochromocytome et d’hypersensibilité. Des réserves insuffisantes de glycogène limitent l’efficacité. Après réponse, des glucides oraux sont nécessaires dès que la déglutition est sûre. La <button class="w" data-k="e10-gl-5">FI</button> ne dispense pas d’un appel au 144 devant une altération de conscience et ne justifie pas une répétition de dose inventée.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="pareto-e10-a07" data-title="Loi de Pareto — Hypoglycémies et incidents de traitement"><div id="pareto-e10-a07"><p class="ratio" data-cover="e10-a07"></p><ul><li>Traiter selon l’état clinique et la capacité d’avaler. Après un secours efficace, rechercher la cause et prévenir la récidive, surtout si une insuline prolongée agit encore.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a>.</p></div></template>
<template data-pop="e10-a08-fenetre-1" data-title="Temps dans la cible : définition, dénominateur et limites"><div id="e10-a08-fenetre-1"><p>Le temps dans la cible est une proportion : durée mesurée dans la plage choisie divisée par la durée effectivement renseignée, multipliée par 100. La plage standard <button class="w" data-k="e10-gl-2">SSED</button> adulte est 3,9–10 mmol/L ; la grossesse utilise une autre plage. Des valeurs sans horodatage régulier ou de longues lacunes empêchent une interprétation naïve par simple comptage.</p><p>Exemple fictif : sur 20 heures exploitables, 14 sont dans la plage, soit 14/20 × 100 = 70 %. Ce résultat ne démontre pas que 70 % des 24 heures étaient dans la plage : les quatre heures manquantes peuvent contenir des événements. Toujours rapporter aussi les hypoglycémies, la couverture et le contexte.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a08-fenetre-2" data-title="Panne de pompe : plan de secours sourcé"><div id="e10-a08-fenetre-2"><p>La pompe utilise une insuline rapide pour assurer la couverture de fond. Une interruption prolongée peut donc provoquer une carence, une hyperglycémie puis une cétose. Vérifier le glucose par la méthode de secours si nécessaire, mesurer les cétones selon le plan et inspecter le circuit. Vomissements, respiration anormale ou altération de l’état général imposent un recours urgent.</p><p>La <button class="w" data-k="e10-gl-5">FI</button> suisse de NovoRapid demande de disposer d’une méthode alternative d’administration. Le diabétologue précise à l’avance les produits, doses et horaires en cas d’arrêt de pompe, ainsi que le chevauchement lors de sa reprise. Une dose basale improvisée puis un redémarrage sans tenir compte de sa durée d’action exposent à une hypoglycémie.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a08" data-title="Loi de Pareto — Capteurs, pompes et automatisation"><div id="pareto-e10-a08"><p class="ratio" data-cover="e10-a08"></p><ul><li>Lire d’abord la qualité des données et les hypoglycémies. Toute technologie exige une solution de mesure et d’insuline de secours réellement maîtrisée.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a09-fenetre-1" data-title="Dépistage : question, examen et intervalle"><div id="e10-a09-fenetre-1"><p>Le dépistage cherche une atteinte encore silencieuse. Pour le rein, rapport albumine/créatinine et filtration estimée sont complémentaires ; pour l’œil, il faut un examen rétinien ; pour le pied, inspection, pouls et sensibilité. Les critères suisses de qualité retiennent un contrôle annuel rénal et des pieds, ainsi qu’un examen ophtalmologique dans les deux ans.</p><p>Une fréquence de dépistage ne s’applique pas à une complication déjà active : une plaie peut nécessiter des contrôles hebdomadaires, une baisse visuelle brutale un avis urgent. La question clinique commande donc l’intervalle. Documenter le dernier résultat, le prochain rendez-vous et l’intervenant responsable.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="e10-a09-fenetre-2" data-title="Complication rénale : articulation avec N18"><div id="e10-a09-fenetre-2"><p>Une baisse de filtration et une albuminurie ne sont pas synonymes. La première estime la capacité d’épuration ; la seconde renseigne sur une fuite anormale d’albumine. Leur combinaison aide à apprécier le risque, mais une mesure isolée pendant déshydratation ou maladie aiguë ne suffit pas à qualifier une maladie chronique.</p><p>Le chapitre N18 expose la confirmation de chronicité, les catégories de filtration et d’albuminurie et leurs conséquences. Dans E10, retenir déjà deux conséquences : dépister régulièrement et réévaluer l’insuline lorsque la fonction rénale change, car les besoins peuvent diminuer et le risque d’hypoglycémie augmenter. Une présentation atypique appelle un avis néphrologique.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a09" data-title="Loi de Pareto — Complications d’organe"><div id="pareto-e10-a09"><p class="ratio" data-cover="e10-a09"></p><ul><li>Un dépistage utile relie un organe, un examen et une décision. Une atteinte active impose un rythme propre, plus rapide que le suivi de routine.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a10-fenetre-1" data-title="Pied diabétique : examen et orientation"><div id="e10-a10-fenetre-1"><p>Inspecter les deux pieds, entre les orteils, sous la plante et au niveau des appuis ; décrire la plaie puis chercher infection, profondeur et perfusion. Le guide suisse classe comme complexe une lésion qui dépasse une situation superficielle sans infection, artériopathie, neuropathie ni déformation. Les antécédents de plaie ou d’amputation augmentent également le besoin d’expertise.</p><p>Gangrène, cellulite, signes systémiques, ischémie aiguë et Charcot aigu relèvent d’une filière urgente. L’absence de douleur ne réduit pas cette gravité si la sensibilité est perdue. Dans les plaies suivies, le guide prévoit une réévaluation régulière et une escalade si la cicatrisation n’évolue pas ; les décisions de décharge, infection et vascularisation sont coordonnées.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="e10-a10-fenetre-2" data-title="Tableau multicompliqué : hiérarchisation"><div id="e10-a10-fenetre-2"><p>Exemple fictif : une personne ayant neuropathie et insuffisance rénale présente une nouvelle zone noire sur un orteil. La priorité est l’évaluation urgente du pied et de l’état général, puis la coordination des contraintes rénales et glycémiques. Attendre le prochain contrôle annuel serait inadapté.</p><p>La hiérarchisation répond à quatre questions : un organe ou la vie sont-ils menacés maintenant ? Quel examen manque pour préciser le mécanisme ? Quelles adaptations interfèrent avec les autres traitements ? Qui assure le suivi et l’accès effectif aux soins ? La réponse reste clinique ; compter le nombre de complications ne suffit pas.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="pareto-e10-a10" data-title="Loi de Pareto — Autres complications et tableaux multiples"><div id="pareto-e10-a10"><p class="ratio" data-cover="e10-a10"></p><ul><li>Décrire précisément chaque atteinte et hiérarchiser les menaces. Gangrène, ischémie aiguë, infection systémique ou Charcot aigu appellent une filière urgente.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a11-fenetre-1" data-title="Jour de maladie : règles et limites"><div id="e10-a11-fenetre-1"><p>La maladie peut accroître les besoins d’insuline même si la personne mange moins. Il faut distinguer la couverture basale, toujours à organiser, des doses de repas et corrections qui suivent le plan prescrit. Prévoir lecteur, cétonémètre ou autre méthode définie, boissons, secours et numéro de contact.</p><p>Vomissements persistants, incapacité à boire, cétones croissantes, respiration anormale ou trouble de conscience imposent une évaluation urgente. La carte <button class="w" data-k="e10-gl-2">SSED</button> de suspension temporaire de certains médicaments ne constitue pas une règle d’arrêt de l’insuline. En cas d’hypoglycémie sévère, la dose suivante nécessite au contraire une décision médicale spécifique : aucune formule générale ne remplace cette réévaluation.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-a11-fenetre-2" data-title="Projet de grossesse : parcours"><div id="e10-a11-fenetre-2"><p>Préparer la conception permet de revoir équilibre glycémique, rétine, rein, traitements et matériel avec une équipe spécialisée. La <button class="w" data-k="e10-gl-2">SSED</button> 2025 recommande un conseil sur le capteur et l’automatisation ; le système exact doit avoir des réglages et un accompagnement adaptés. Une performance démontrée avec un système ne vaut pas pour tous.</p><p>La plage de capteur retenue pendant la grossesse est 3,5–7,8 mmol/L ; elle diffère de la plage usuelle adulte. Le glucose moyen estimant l’<button class="w" data-k="e10-gl-1">HbA1c</button> ne remplace pas les mesures de grossesse. Après naissance, anticiper la diminution des besoins et vérifier chaque <button class="w" data-k="e10-gl-5">FI</button> pour l’allaitement : les recommandations de NovoRapid et de Tresiba ne sont pas interchangeables.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a>.</p></div></template>
<template data-pop="pareto-e10-a11" data-title="Loi de Pareto — Vie quotidienne et situations particulières"><div id="pareto-e10-a11"><p class="ratio" data-cover="e10-a11"></p><ul><li>Anticiper les situations qui changent les besoins. Vérifier séparément grossesse, allaitement, fonctions d’organe, autonomie et exigences suisses de conduite.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-a12-fenetre-1" data-title="Critères diagnostiques officiels"><div id="e10-a12-fenetre-1"><p>Pour diagnostiquer le diabète, la <button class="w" data-k="e10-gl-2">SSED</button> retient les limites plasmatiques de 7,0 mmol/L à jeun et 11,1 mmol/L à deux heures d’une charge de 75 g, ou 11,1 mmol/L de façon aléatoire avec symptômes. Le document original utilise le signe ≥. Une extraction informatique qui affiche seulement > ne doit pas changer la règle.</p><p>Ces critères ne déterminent pas le type. Chez une personne avec suspicion de type 1 aigu, chercher la gravité et ne pas attendre l’<button class="w" data-k="e10-gl-1">HbA1c</button>. Pour diagnostiquer l’acidocétose adulte, utiliser les trois composantes <button class="w" data-k="e10-gl-4">JBDS</button> présentées en A06 ; pour l’auto-immunité, interpréter les anticorps dans le contexte clinique.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-a12-fenetre-2" data-title="Pareto du traitement et du suivi"><div id="e10-a12-fenetre-2"><p>Quatre compétences dominent : reconnaître une urgence ; comprendre le rôle basal et prandial de l’insuline ; savoir traiter une hypoglycémie et appliquer un plan de maladie/panne ; maintenir le dépistage coordonné du rein, de l’œil et des pieds. La technologie facilite ces compétences, elle ne les remplace pas.</p><p>Une revue utile relie les données au vécu : hypoglycémies, horaires des excursions, repas, exercice, erreurs, fatigue des alarmes et accès aux soins. La décision se prend avec la personne et se réévalue. Un résultat numérique isolé n’autorise pas à déduire une dose, une aptitude à conduire ou l’absence de complication.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a>.</p></div></template>
<template data-pop="pareto-e10-a12" data-title="Loi de Pareto — Critères formels, suivi et synthèse"><div id="pareto-e10-a12"><p class="ratio" data-cover="e10-a12"></p><ul><li>Critères : diagnostiquer l’hyperglycémie, puis qualifier le type et la crise. Paramètres clés : conscience, hydratation, cétones, pH et potassium à l’aigu ; hypoglycémies, capteur et organes au suivi.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a>.</p></div></template>
