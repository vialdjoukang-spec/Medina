<template data-pop="e10-e01-fenetre-1" data-title="Hémoglobine glyquée : mesure et limites"><div id="e10-e01-fenetre-1"><p>L’<button class="w" data-k="e10-gl-1">HbA1c</button> est la fraction d’hémoglobine ayant subi une glycation. Sa valeur dépend de l’exposition au glucose, mais aussi de la durée de vie et des caractéristiques des globules rouges. Elle offre donc une information longitudinale, sans montrer la succession des épisodes ni identifier les hypoglycémies.</p><p>Selon la prise de position <button class="w" data-k="e10-gl-2">SSED</button>, hémoglobinopathie, renouvellement érythrocytaire accru, transfusion et insuffisances rénale/hépatique sévères peuvent empêcher une interprétation diagnostique habituelle. Le déficit en fer peut augmenter artificiellement la valeur. Si le résultat contredit les symptômes ou les mesures, chercher la discordance au lieu de conclure que le patient mesure mal. Le type 1 aigu se raisonne sur le glucose et la gravité.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a>.</p></div></template>
<template data-pop="e10-e01-fenetre-2" data-title="Peptide C et autoanticorps : utilité et limites"><div id="e10-e01-fenetre-2"><p>La proinsuline est transformée en insuline et peptide C ; ce dernier reflète donc la sécrétion interne. La concentration doit être rapportée à la glycémie présente et aux conditions de prélèvement. Un taux dans l’intervalle du laboratoire peut être inapproprié devant une hyperglycémie majeure ; il ne constitue pas une preuve d’absence de type 1.</p><p>Les anticorps anti-GAD, anti-IA-2 ou anti-ZnT8 explorent l’auto-immunité et non la quantité d’insuline nécessaire au repas. <button class="w" data-k="e10-gl-3">NICE</button> ne recommande pas le peptide C systématique pour confirmer un type 1 adulte typique ; il devient utile quand la classification reste incertaine. Les seuils de positivité des anticorps dépendent des méthodes et du laboratoire.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="pareto-e10-e01" data-title="Loi de Pareto — Mesures glycémiques et classification"><div id="pareto-e10-e01"><p class="ratio" data-cover="e10-e01"></p><ul><li>Avant de prescrire, préciser la question : hyperglycémie, ancienneté de l’exposition, auto-immunité ou sécrétion résiduelle. Une <button class="w" data-k="e10-gl-1">HbA1c</button> seule ne sécurise pas un tableau aigu.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.viollier.ch/fr/analysis/26518" target="_blank" rel="noopener">Viollier — catalogue cpeptide — catalogue consulté le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="e10-e02-fenetre-1" data-title="Trou anionique : formule, unités, exemple et limites"><div id="e10-e02-fenetre-1"><p>Le plasma reste électriquement neutre. Le « trou » apparaît seulement parce que le calcul ne compte qu’une partie des ions. Dans la convention <button class="w" data-k="e10-gl-4">JBDS</button>, on additionne sodium et potassium, puis on soustrait chlorure et bicarbonates. Les ions non comptés dans cette convention contribuent au résidu ; celui-ci doit être interprété avec le contexte et la méthode.</p><p>Exemple fictif entièrement refaisable : (138 + 4,5) − (100 + 12) = 30,5 mmol/L. Sans potassium, le même prélèvement donnerait 26 mmol/L. Ne pas comparer le second résultat au seuil JBDS > 16 défini avec potassium. Un trou augmenté indique des anions non comptés, pas nécessairement une acidocétose ; cétones, lactate et contexte orientent l’étiologie.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-e02-fenetre-2" data-title="Osmolalité : mesure, estimation et interprétation"><div id="e10-e02-fenetre-2"><p>L’osmolalité mesure le nombre de particules par kilogramme d’eau. Le laboratoire peut la mesurer ; le calcul <button class="w" data-k="e10-gl-4">JBDS</button> l’estime par 2 × Na + glucose + urée, en mmol/L. Le facteur 2 tient compte approximativement des anions associés au sodium. L’urée contribue à l’osmolalité totale mais pas de la même manière à la tonicité : c’est pourquoi l’estimation efficace l’exclut.</p><p>Exemple fictif : Na 145, glucose 30, urée 10 donnent 330 <button class="w" data-k="e10-gl-28">mOsm</button>/kg au total et 320 sans urée. Le seuil ≥ 320 du JBDS décrit l’état hyperosmolaire avec son contexte clinique ; il n’est pas l’intervalle normal suisse de l’osmolalité mesurée, 280–300. Les deux concepts doivent rester explicitement nommés.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a>.</p></div></template>
<template data-pop="pareto-e10-e02" data-title="Loi de Pareto — Biologie des décompensations"><div id="pareto-e10-e02"><p class="ratio" data-cover="e10-e02"></p><ul><li>Mesurer cétones et retentissement acido-basique séparément. Toute estimation doit afficher sa formule, ses unités et sa convention, surtout pour le trou anionique et l’osmolalité.</li></ul><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.viollier.ch/fr/analysis/7090" target="_blank" rel="noopener">Viollier — catalogue Na — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.viollier.ch/fr/analysis/7100" target="_blank" rel="noopener">Viollier — catalogue K — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.viollier.ch/fr/analysis/18362" target="_blank" rel="noopener">Viollier — catalogue osmolalite — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.viollier.ch/fr/analysis/10236" target="_blank" rel="noopener">Viollier — catalogue bicarbonate — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.lasource.ch/espace-medecins/laboratoires/catalogue-danalyses/gazometrie" target="_blank" rel="noopener">Clinique de La Source — gazométrie — catalogue consulté le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-e03-fenetre-1" data-title="Rapport de capteur : données manquantes et biais"><div id="e10-e03-fenetre-1"><p>Une donnée absente n’est ni normale ni pathologique : elle est inconnue. Si le capteur est surtout retiré pendant l’exercice ou la nuit, les lacunes peuvent modifier le profil observé. La durée de port doit donc être explicitement rapportée et confrontée au vécu.</p><p>Exemple fictif : 280 heures disponibles sur 336 donnent 83,3 % de couverture. Un temps dans la plage de 75 % est calculé sur ces 280 heures, soit 210 heures connues. Il ne décrit pas automatiquement l’ensemble des 336 heures. Lire les hypoglycémies avant de décider d’augmenter l’insuline pour une hausse moyenne.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-e03-fenetre-2" data-title="Albuminurie : unités et contexte"><div id="e10-e03-fenetre-2"><p>Le rapport albumine/créatinine rapporte une concentration d’albumine urinaire à celle de créatinine dans le même échantillon. Cette normalisation limite l’effet de la dilution des urines. En Suisse, le compte rendu peut utiliser mg/mmol ; ne pas confondre ce rapport avec une concentration d’albumine en mg/L.</p><p>Un résultat augmenté appelle une confirmation et une interprétation clinique, particulièrement s’il a été obtenu pendant maladie aiguë. <button class="w" data-k="e10-gl-3">NICE</button> privilégie un échantillon matinal pour le suivi du type 1 ; le référentiel suisse de qualité demande une recherche annuelle. La classification complète et la chronicité sont développées dans N18, après contextualisation locale de ces deux dimensions.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a>.</p></div></template>
<template data-pop="pareto-e10-e03" data-title="Loi de Pareto — Suivi biologique et rapports de dispositifs"><div id="pareto-e10-e03"><p class="ratio" data-cover="e10-e03"></p><ul><li>Un suivi interprétable indique période, couverture et dénominateur. Croiser les résultats avec les hypoglycémies vécues et le dépistage des organes.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-s01-fenetre-1" data-title="Îlots : cellules et fonctions"><div id="e10-s01-fenetre-1"><p>Une cellule β produit l’insuline, signal favorisant l’utilisation et le stockage des nutriments. Une cellule α produit le glucagon, qui participe à la mobilisation hépatique du glucose. Une cellule δ produit la somatostatine, impliquée dans la modulation des sécrétions voisines. Les acini entourant les îlots produisent des enzymes digestives.</p><p>La différence essentielle est la destination : les hormones gagnent le sang ; les enzymes exocrines gagnent les canaux puis le duodénum. Cette organisation explique les deux fonctions d’un même organe. Le dessin est pédagogique et ne permet pas d’inférer des proportions cellulaires individuelles.</p><p class="src">Sources : <a href="https://med.libretexts.org/Bookshelves/Anatomy_and_Physiology/Anatomy_and_Physiology_1e_%28OpenStax%29/Unit_3%3A_Regulation_Integration_and_Control/17%3A_The_Endocrine_System/17.09%3A_The_Endocrine_Pancreas" target="_blank" rel="noopener">OpenStax via LibreTexts — The Endocrine Pancreas — version archivée indiquée 13 mai 2022</a>.</p></div></template>
<template data-pop="e10-s01-fenetre-2" data-title="Histologie : normal et modifications"><div id="e10-s01-fenetre-2"><p>L’histologie normale montre des îlots endocrines au sein du tissu exocrine. Dans le type 1, les recherches tissulaires décrivent une atteinte des cellules β et des infiltrats immunitaires variables. Les lésions ne sont ni uniformes ni résumées par un unique cliché.</p><p>Les recommandations cliniques adultes ne demandent pas une biopsie pancréatique pour classer couramment un diabète. Elles utilisent histoire, phénotype, anticorps et peptide C conditionnel. Il faut donc distinguer une observation de recherche qui explique la maladie d’un examen indiqué chez une personne donnée.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="pareto-e10-s01" data-title="Loi de Pareto — Anatomie et histologie pancréatiques"><div id="pareto-e10-s01"><p class="ratio" data-cover="e10-s01"></p><ul><li>Le pancréas associe une sortie exocrine vers l’intestin et une sortie endocrine vers le sang. Les tests sanguins explorent des fonctions et des marqueurs, pas directement l’histologie.</li></ul><p class="src">Sources : <a href="https://med.libretexts.org/Bookshelves/Anatomy_and_Physiology/Anatomy_and_Physiology_1e_%28OpenStax%29/Unit_3%3A_Regulation_Integration_and_Control/17%3A_The_Endocrine_System/17.09%3A_The_Endocrine_Pancreas" target="_blank" rel="noopener">OpenStax via LibreTexts — The Endocrine Pancreas — version archivée indiquée 13 mai 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="e10-s02-fenetre-1" data-title="Sécrétion : étapes et molécules"><div id="e10-s02-fenetre-1"><p>Dérouler le couplage dans l’ordre : glucose → glucose-6-phosphate par la glucokinase → production d’<button class="w" data-k="e10-gl-12">ATP</button> → augmentation du rapport ATP/<button class="w" data-k="e10-gl-13">ADP</button> → fermeture des canaux <button class="w" data-k="e10-gl-32">KATP</button> → dépolarisation → ouverture des canaux calciques → exocytose des granules. ATP et ADP sont des molécules liées au transfert d’énergie ; le calcium est ici un signal de libération.</p><p>Le canal KATP relie donc l’état énergétique à l’état électrique. Le schéma décrit une chaîne utile à la compréhension, pas un test clinique de routine de chacun de ses maillons. Les différences de transporteurs entre modèles cellulaires ne doivent pas être transformées en une règle simpliste « un tissu, un transporteur ».</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-s02-fenetre-2" data-title="Contre-régulation : bases"><div id="e10-s02-fenetre-2"><p>La contre-régulation rassemble les mécanismes qui s’opposent à une baisse du glucose. Le glucagon favorise la mise à disposition hépatique de glucose ; d’autres hormones de stress participent à la réponse métabolique. En carence insulinique, cette mobilisation peut aggraver l’hyperglycémie au lieu de corriger un manque.</p><p>Chez une personne sous insuline, la prévention d’une hypoglycémie ne repose pas sur la seule contre-régulation : doses, repas, activité, perception et secours comptent. Des hypoglycémies répétées peuvent altérer les signes d’alerte. C’est pourquoi <button class="w" data-k="e10-gl-3">NICE</button> demande une évaluation de la perception et une éducation adaptée plutôt qu’une confiance automatique dans les symptômes.</p><p class="src">Sources : <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Tran et al. — Review of Evidence for Adult DKA Management Protocols — 2017</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="pareto-e10-s02" data-title="Loi de Pareto — Physiologie de l’insuline"><div id="pareto-e10-s02"><p class="ratio" data-cover="e10-s02"></p><ul><li>Expliquer successivement métabolisme, membrane, calcium et sécrétion ; distinguer ensuite les effets selon l’organe. Le modèle justifie les fonctions du traitement, pas une dose universelle.</li></ul><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a> ; <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Tran et al. — Review of Evidence for Adult DKA Management Protocols — 2017</a>.</p></div></template>
<template data-pop="e10-s03-fenetre-1" data-title="Voies métaboliques : lecture étape par étape"><div id="e10-s03-fenetre-1"><p>Lire la figure du foie vers les tissus : les acides gras entrent dans la β-oxydation, qui produit l’<button class="w" data-k="e10-gl-33">acétyl-CoA</button>. La cétogenèse hépatique transforme une partie de ce substrat en acétoacétate et β-hydroxybutyrate ; ces molécules sont exportées. Les autres tissus peuvent les transformer à nouveau en acétyl-CoA pour le cycle oxydatif.</p><p><button class="w" data-k="e10-gl-18">HMG-CoA</button> désigne l’hydroxy-méthyl-glutaryl-coenzyme A ; <button class="w" data-k="e10-gl-19">SCOT</button> est la <button class="w" data-k="e10-gl-34">succinyl-CoA</button>:3-oxoacide <button class="w" data-k="e10-gl-35">CoA-transférase</button>, nécessaire à une étape de cétolyse extra-hépatique. Il faut distinguer ce flux physiologique d’une accumulation pathologique avec acidose. Le dessin décrit des voies ; les mesures sanguines précisent leur retentissement chez le patient.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-s03-fenetre-2" data-title="Rapport biochimique : bases et exemple"><div id="e10-s03-fenetre-2"><p>Un rapport compare deux grandeurs. Si elles ont les mêmes unités, celles-ci s’annulent : <button class="w" data-k="e10-gl-12">ATP</button> 4 unités arbitraires / <button class="w" data-k="e10-gl-13">ADP</button> 1 unité donne un rapport de 4. Cet exemple fictif explique une notion ; il n’est pas une référence physiologique ni un test clinique recommandé.</p><p>Une conversion compare deux façons d’exprimer la même concentration. Pour le glucose, 180 mg/dL correspondent approximativement à 10 mmol/L dans les sources citées : le facteur arrondi est 18. Ainsi, 90 mg/dL ≈ 5 mmol/L. Cette conversion ne doit jamais être appliquée au sodium, au peptide C ou à l’<button class="w" data-k="e10-gl-1">HbA1c</button>, dont les unités et masses de référence sont différentes.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="pareto-e10-s03" data-title="Loi de Pareto — Biochimie du glucose et des corps cétoniques"><div id="pareto-e10-s03"><p class="ratio" data-cover="e10-s03"></p><ul><li>Suivre les substrats et les compartiments avant d’interpréter les concentrations. La baisse du glucose n’équivaut pas à la résolution de la production cétonique.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-s04-fenetre-1" data-title="Autoanticorps : marqueur et portée"><div id="e10-s04-fenetre-1"><p>Un autoanticorps est un marqueur de reconnaissance immunitaire. Les anticorps anti-GAD, anti-IA-2 et anti-ZnT8 ciblent des protéines différentes des cellules β. Leur recherche apporte une information étiologique ; les seuils de positivité sont ceux de la méthode de laboratoire.</p><p>Un test positif ne mesure pas la masse β restante et ne donne pas une dose. Un test négatif unique n’exclut pas formellement un type 1 ; <button class="w" data-k="e10-gl-3">NICE</button> recommande deux marqueurs différents pour limiter les faux négatifs. Le peptide C peut ensuite aider dans les situations incertaines. Les mécanismes expérimentaux ne justifient pas une immunothérapie ajoutée sans indication et preuve propres.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-s04-fenetre-2" data-title="Prédisposition génétique : risque et limites"><div id="e10-s04-fenetre-2"><p>Les molécules <button class="w" data-k="e10-gl-20">HLA</button> présentent des fragments antigéniques aux lymphocytes T. Des variants génétiques modifient la susceptibilité à l’auto-immunité, en interaction avec d’autres facteurs. Un risque relatif de population ne se transforme pas directement en probabilité individuelle sans connaître fréquence de base, population et autres caractéristiques.</p><p>Dans une famille, le conseil doit expliquer ce que le test changera concrètement : confirmation, surveillance ou orientation. Aucun variant n’autorise à conclure à une maladie certaine ou à sa date d’apparition. Les sources lues ne suffisent pas à promettre un dépistage suisse universel ; un parcours spécialisé vérifie indication, information et accès.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="pareto-e10-s04" data-title="Loi de Pareto — Immunologie et génétique pertinentes"><div id="pareto-e10-s04"><p class="ratio" data-cover="e10-s04"></p><ul><li>Séparer mécanisme immunitaire, marqueur mesuré et décision clinique. Une prédisposition ou un anticorps n’est ni une dose d’insuline ni un calendrier individuel.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-p01-fenetre-1" data-title="Insuline du produit exact : FI intégrale"><div id="e10-p01-fenetre-1"><p><b>NovoRapid, insuline aspart 100 U/mL.</b> Indication : diabète nécessitant l’insuline. Fonction : rapide/prandiale, ou perfusion sous-cutanée avec système compatible. Dose individualisée ; injection habituellement immédiatement avant le repas, éventuellement juste après. La voie <button class="w" data-k="e10-gl-25">IV</button> est réservée au professionnel avec surveillance glucose/potassium selon la <button class="w" data-k="e10-gl-5">FI</button> ; elle ne justifie pas d’utiliser un stylo comme réservoir improvisé. Contre-indication : hypersensibilité. Risques principaux : hypoglycémie, réactions locales, lipodystrophie/amyloïdose et erreurs de produit. Rotation des sites et contrôle du dispositif sont essentiels.</p><p><b>Tresiba, insuline dégludec.</b> Formes : Penfill 100, FlexTouch 100 ou 200 U/mL. Dans le type 1 dès 1 an : basale sous-cutanée quotidienne avec insuline de repas, dose individuelle. Aucune voie IV/<button class="w" data-k="e10-gl-26">IM</button>/pompe, aucun mélange ni dilution. Contre-indication : hypersensibilité. Risques : hypoglycémie prolongée, réactions locales et erreurs de concentration. Rein, foie et grand âge demandent surveillance renforcée ; grossesse envisageable si indication clinique ; allaitement déconseillé par la FI suisse.</p><p>Les liens de référence ouvrent les informations professionnelles intégrales, approuvées par Swissmedic et republiées par AmiKo. La présente fenêtre est une synthèse clinique et ne remplace pas leurs instructions détaillées de manipulation et de conservation.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a>.</p></div></template>
<template data-pop="e10-p01-fenetre-2" data-title="Calcul de dose : variables et conditions"><div id="e10-p01-fenetre-2"><p>Variables nécessaires : grammes de glucides, rapport g/U, glucose actuel en mmol/L, objectif prescrit dans la même unité, facteur de correction en mmol/L/U, dose encore active et activité prévue. La première dose arithmétique vaut glucides/rapport ; la correction vaut écart glycémique/facteur.</p><p>Exemple fictif : 48 g/12 g par U = 4 U ; (11−8) mmol/L /3 mmol/L par U = 1 U ; somme 5 U. Cette somme n’est administrable qu’après l’analyse du contexte et des possibilités du dispositif. L’arrondi doit suivre le plan appris. Les paramètres évoluent ; la formule ne fournit pas elle-même leurs valeurs et ne remplace pas un avis en cas de maladie ou de cétones.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="pareto-e10-p01" data-title="Loi de Pareto — Insulines et schémas individualisés"><div id="pareto-e10-p01"><p class="ratio" data-cover="e10-p01"></p><ul><li>Nommer produit, concentration, dispositif, voie et fonction. Les doses sont individuelles ; les 10 unités initiales de Tresiba dans le type 2 ne sont pas une règle pour le type 1.</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED — retraits de présentations d’insuline — 2026</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-p02-fenetre-1" data-title="Produit de secours : FI et mode d’emploi"><div id="e10-p02-fenetre-1"><p><b>Baqsimi 3 mg, glucagon nasal unidose.</b> Indication suisse : hypoglycémie sévère chez une personne diabétique adulte ou enfant dès 1 an. Dose unique de 3 mg dans une narine ; absorption passive, sans inhalation. L’aidant doit avoir appris la manipulation du dispositif. En cas d’altération de conscience, appeler le 144 et ne rien donner par la bouche tant que la déglutition n’est pas sûre.</p><p>Contre-indications : hypersensibilité, phéochromocytome. Prudence en cas d’insulinome ; inefficacité possible si les réserves de glycogène sont insuffisantes. La <button class="w" data-k="e10-gl-5">FI</button> demande des glucides oraux après réponse. Conservation sous 30 °C dans le tube protecteur fermé, selon la notice. Ne pas tester ni amorcer le dispositif : il ne contient qu’une dose. Aucun ajustement rénal/hépatique n’est prévu, mais absence d’études formelles ; grossesse/allaitement possibles selon FI. Le produit ne remplace ni la surveillance ni la recherche de la cause.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-p02-fenetre-2" data-title="Erreur de concentration : vérification"><div id="e10-p02-fenetre-2"><p>Une concentration est un nombre d’unités par volume. Avec 100 U/mL, 12 U représentent 0,12 mL ; avec 200 U/mL, elles représentent 0,06 mL. Le stylo réalise cette différence de volume lui-même. Son compteur reste réglé sur <b>12 unités</b> dans les deux cas ; il ne faut ni doubler ni diviser le nombre prescrit.</p><p>FlexTouch 100 permet des paliers de 1 U et FlexTouch 200 des paliers de 2 U, selon la <button class="w" data-k="e10-gl-5">FI</button> Tresiba. Une dose incompatible avec les paliers demande une prescription et un dispositif adaptés, pas une extraction à la seringue. Vérifier produit, concentration, unités, voie, palier et identité de l’utilisateur avant d’injecter.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a>.</p></div></template>
<template data-pop="pareto-e10-p02" data-title="Loi de Pareto — Sécurité, interactions et secours"><div id="pareto-e10-p02"><p class="ratio" data-cover="e10-p02"></p><ul><li>Une erreur de produit ou de concentration peut dépasser l’effet d’un calcul exact. Vérifier le dispositif et les unités, puis anticiper la durée du risque et le secours.</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-gl-1" data-title="HbA1c — Hémoglobine glyquée A1c"><div id="e10-gl-1"><p>Fraction glyquée de l’hémoglobine : elle renseigne sur une exposition prolongée au glucose, mais dépend aussi des globules rouges. Le type 1 aigu ne se diagnostique pas sur cette valeur seule.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a>.</p></div></template>
<template data-pop="e10-gl-2" data-title="SSED — Société suisse d’endocrinologie et de diabétologie"><div id="e10-gl-2"><p>Société savante suisse, SGED en allemand ; ses textes nationaux sont prioritaires dans ce cours.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-gl-3" data-title="NICE — National Institute for Health and Care Excellence"><div id="e10-gl-3"><p>Organisme britannique d’évaluation et de recommandations ; NG17 concerne le diabète de type 1 de l’adulte.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-gl-4" data-title="JBDS — Joint British Diabetes Societies"><div id="e10-gl-4"><p>Sociétés britanniques de diabétologie ; les protocoles hospitaliers adultes de 2023 sont identifiés séparément des textes suisses.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-gl-5" data-title="FI — Information professionnelle"><div id="e10-gl-5"><p>Texte approuvé pour un médicament suisse précis : indication, forme, dose, voies et populations ne doivent pas être déduites d’une autre présentation.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-gl-6" data-title="CGM — Continuous glucose monitoring — mesure continue du glucose"><div id="e10-gl-6"><p>Le capteur mesure le glucose interstitiel ; il fournit des tendances et des durées dans différentes plages, avec des limites de données et de délai.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-gl-7" data-title="AID — Automated insulin delivery — administration automatisée d’insuline"><div id="e10-gl-7"><p>Association capteur, algorithme et pompe ; elle nécessite apprentissage, compatibilité et plan de secours.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-gl-8" data-title="TIR — Time in range — temps dans la plage cible"><div id="e10-gl-8"><p>Proportion du temps mesuré dans la plage choisie ; la plage et la population doivent être indiquées.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-gl-9" data-title="TBR — Time below range — temps sous la plage"><div id="e10-gl-9"><p>Mesure de l’exposition aux concentrations basses ; elle complète le temps dans la cible.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-gl-10" data-title="AGP — Ambulatory glucose profile — profil glycémique ambulatoire"><div id="e10-gl-10"><p>Présentation standardisée des données du capteur. Un simple tracé de 24 heures n’est pas à lui seul un rapport AGP complet.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-gl-11" data-title="LADA — Latent autoimmune diabetes in adults"><div id="e10-gl-11"><p>Présentation auto-immune lente de l’adulte ; ni l’âge ni le surpoids n’excluent un mécanisme auto-immun.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-gl-12" data-title="ATP — Adénosine triphosphate"><div id="e10-gl-12"><p>Molécule du métabolisme énergétique. Dans la cellule β, le rapport ATP/ADP participe au couplage glucose–sécrétion.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-13" data-title="ADP — Adénosine diphosphate"><div id="e10-gl-13"><p>Molécule comparée à l’ATP dans le rapport énergétique ; un rapport de concentrations dans la même unité est sans dimension.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-14" data-title="GLUT4 — Transporteur du glucose de type 4"><div id="e10-gl-14"><p>Le signal insulinique favorise sa présence à la membrane du muscle et du tissu adipeux.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-15" data-title="IRS — Insulin receptor substrate — substrat du récepteur de l’insuline"><div id="e10-gl-15"><p>Relais intracellulaire du signal du récepteur vers les voies métaboliques.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-16" data-title="PI3K — Phosphatidylinositol 3-kinase"><div id="e10-gl-16"><p>Enzyme de la cascade de signalisation insulinique conduisant notamment à l’activation d’Akt.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-17" data-title="Akt — Kinase Akt"><div id="e10-gl-17"><p>Nom de protéine, et non mot à développer lettre par lettre ; elle relaie des effets métaboliques de l’insuline.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-18" data-title="HMG-CoA — Hydroxy-méthyl-glutaryl-coenzyme A"><div id="e10-gl-18"><p>Intermédiaire nommé dans la voie de cétogenèse hépatique ; le contexte mitochondrial doit être conservé.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-gl-19" data-title="SCOT — Succinyl-CoA:3-oxoacide CoA-transférase"><div id="e10-gl-19"><p>Enzyme nécessaire à une étape de l’utilisation des corps cétoniques par les tissus extra-hépatiques.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-gl-20" data-title="HLA — Human leukocyte antigen — antigènes leucocytaires humains"><div id="e10-gl-20"><p>Molécules de présentation antigénique ; certains variants sont associés à une susceptibilité, sans constituer un diagnostic individuel.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a>.</p></div></template>
<template data-pop="e10-gl-21" data-title="NOD — Non-obese diabetic — souris diabétique non obèse"><div id="e10-gl-21"><p>Modèle expérimental d’auto-immunité ; ses observations ne doivent pas être assimilées sans vérification aux effets cliniques humains.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a>.</p></div></template>
<template data-pop="e10-gl-22" data-title="GAD — Glutamate décarboxylase"><div id="e10-gl-22"><p>Antigène de la cellule β ; les anticorps dirigés contre cette enzyme peuvent soutenir une étiologie auto-immune.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="e10-gl-23" data-title="IA-2 — Insulinoma-associated antigen 2"><div id="e10-gl-23"><p>Antigène associé aux granules des cellules β ; cible d’autoanticorps.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="e10-gl-24" data-title="ZnT8 — Transporteur du zinc de type 8"><div id="e10-gl-24"><p>Protéine des granules β, cible d’autoanticorps ; sa représentation dans une figure n’est pas un dosage sanguin.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="e10-gl-25" data-title="IV — Intraveineux"><div id="e10-gl-25"><p>Voie d’administration dans une veine, autorisée uniquement pour les produits et préparations correspondants ; surveillance professionnelle.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-gl-26" data-title="IM — Intramusculaire"><div id="e10-gl-26"><p>Voie d’administration dans un muscle ; elle est notamment exclue pour Tresiba.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a>.</p></div></template>
<template data-pop="e10-gl-27" data-title="TA — Trou anionique"><div id="e10-gl-27"><p>Résidu calculé entre cations et anions mesurés ; la formule avec potassium et celle sans potassium ne se comparent pas à la même référence.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-gl-28" data-title="mOsm — Milliosmole"><div id="e10-gl-28"><p>Unité de quantité osmotique ; l’osmolalité s’exprime ici en mOsm/kg et doit être distinguée d’une concentration de glucose.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a>.</p></div></template>
<template data-pop="e10-gl-29" data-title="HUG — Hôpitaux universitaires de Genève"><div id="e10-gl-29"><p>Institution suisse dont le protocole d’hypoglycémie hospitalière est cité avec sa population et sa version.</p><p class="src">Sources : <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-gl-30" data-title="RMS — Revue Médicale Suisse"><div id="e10-gl-30"><p>Publication suisse ; la fiche de crises hyperglycémiques de 2019 sert ici à préciser l’orientation locale.</p><p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p></div></template>
<template data-pop="e10-gl-31" data-title="SGRM — Schweizerische Gesellschaft für Rechtsmedizin — Société suisse de médecine légale"><div id="e10-gl-31"><p>Cosignataire des recommandations suisses sur diabète et conduite ; les catégories de permis et le risque d’hypoglycémie déterminent l’évaluation.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a>.</p></div></template>
<template data-pop="e10-gl-32" data-title="KATP — Canal potassique sensible à l’ATP"><div id="e10-gl-32"><p>Canal qui relie état énergétique et potentiel de membrane dans le couplage de la sécrétion d’insuline. Sa fermeture favorise la dépolarisation.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-33" data-title="acétyl-CoA — Acétyl-coenzyme A"><div id="e10-gl-33"><p>Intermédiaire issu notamment de la β-oxydation ; dans le foie, il peut alimenter la production de corps cétoniques.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-gl-34" data-title="succinyl-CoA — Succinyl-coenzyme A"><div id="e10-gl-34"><p>Composé participant à la réaction catalysée par SCOT dans la cétolyse extra-hépatique.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-gl-35" data-title="CoA-transférase — Coenzyme A-transférase"><div id="e10-gl-35"><p>Famille d’enzymes transférant un groupement coenzyme A ; SCOT désigne ici l’enzyme de la cétolyse extra-hépatique.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-gl-36" data-title="MAPK — Mitogen-activated protein kinase — kinase activée par les mitogènes"><div id="e10-gl-36"><p>Branche de signalisation liée notamment à l’expression des gènes et aux effets mitogènes de l’insuline ; distincte de PI3K–Akt.</p><p class="src">Sources : <a href="https://www.mdpi.com/1422-0067/20/6/1351" target="_blank" rel="noopener">Kostov — Effects of magnesium deficiency on insulin resistance — 18 mars 2019</a>.</p></div></template>
<template data-pop="e10-gl-37" data-title="DKA — Diabetic ketoacidosis — acidocétose diabétique"><div id="e10-gl-37"><p>Sigle anglais présent dans les sources : associer glucose ou diabète connu, cétones et acidose selon la version du référentiel, sans traduire le sigle en un nouveau critère.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-gl-38" data-title="HCO₃ — Bicarbonate"><div id="e10-gl-38"><p>Notation chimique du bicarbonate ; HCO₃⁻ porte une charge négative. Le bicarbonate sérique et celui de gazométrie doivent garder leur méthode et leur unité.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
