<template data-pop="pareto-e11-pharm" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e11-p-1,e11-p-2,e11-p-3,e11-p-4"></p><ul><li><button class="w" data-justification="1" data-k="e11-d-metformine">Glucophage®</button> se prend par voie orale : le début est 500 à 1000 mg/jour, progression selon tolérance ; maximum 3000 mg/jour si rein adapté, 1000 entre <button class="w" data-k="e11-gl-16">DFG</button> 30 et 59 ; contre-indication &lt; 30.</li><li><button class="w" data-justification="1" data-k="e11-d-isglt2">Jardiance®/Forxiga®</button> se prennent par voie orale à 10 mg une fois/jour pour cœur/rein ; pas d’initiation sous <button class="w" data-k="e11-gl-16">DFG</button> 20/25 respectivement. Les règles pour le seul contrôle glycémique et pour la dialyse diffèrent.</li><li><button class="w" data-justification="1" data-k="e11-d-aglp1">Ozempic®</button> s’administre par voie sous-cutanée une fois par semaine : 0,25 puis 0,5, 1, éventuellement 2 mg, après au moins quatre semaines à chaque palier ; Rybelsus® N a son schéma oral propre.</li><li><button class="w" data-justification="1" data-k="e11-d-tirzepatide">Mounjaro®</button> s’administre par voie sous-cutanée une fois par semaine : 2,5 mg quatre semaines, puis 5 ; +2,5 mg après au moins quatre semaines, maximum 15 mg.</li><li><button class="w" data-justification="1" data-k="e11-d-insulines">Les basales sous-cutanées</button> ont des schémas distincts : Tresiba® commence à 10 unités une fois/jour au départ ; Toujeo® 0,2 unité/kg une fois/jour, ajustements espacés de trois à quatre jours ; aucune titration universelle tous les deux jours.</li><li>L’association à insuline/sulfonylurée demande une réévaluation du risque d’hypoglycémie. L’association <button class="w" data-k="e11-gl-13">GLP-1</button> + <button class="w" data-k="e11-proxy-dpp4">DPP-4</button> est évitée ; insuline + sulfonylurée n’est pas une contre-indication formelle générale mais expose davantage aux hypoglycémies.</li><li><button class="w" data-justification="1" data-k="e11-d-finerenone">Kerendia®</button> se prend par voie orale pour la néphropathie de type 2 : 10/20 mg une fois/jour selon <button class="w" data-k="e11-gl-16">DFG</button> ; potassium ≤ 4,8 au départ, possibilité entre 4,8 et 5 avec contrôle rapproché ; contrôle à quatre semaines.</li></ul></template>

<template data-pop="pareto-e11-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="e11-s-histo-body,e11-s-phys-body,e11-s-bioc-body,e11-s-rein-body"></p><ul><li>La cellule β convertit le glucose métabolisé en un signal <button class="w" data-k="e11-gl-2">ATP</button>/<button class="w" data-k="e11-gl-1">ADP</button> qui ferme les canaux potassiques. La dépolarisation et l’entrée de calcium déclenchent l’exocytose ; l’excès de nutriments altère ce couplage.</li><li><button class="w" data-justification="1" data-k="e11-incretine">Les incrétines</button> <button class="w" data-k="e11-proxy-gip">GIP</button> et <button class="w" data-k="e11-gl-13">GLP-1</button> amplifient la réponse au glucose oral ; <button class="w" data-k="e11-proxy-dpp4">DPP-4</button> les dégrade. Le <button class="w" data-k="e11-gl-13">GLP-1</button> pharmacologique reste actif dans le type 2.</li><li><button class="w" data-justification="1" data-k="e11-insulinoresistance">Le signal insulinique</button> suit la voie récepteur → IRS-1/IRS-2 → PI3K → AKT ; il conduit GLUT4 vers la membrane musculaire ou adipocytaire et freine FOXO1 dans le foie.</li><li>Le stress oxydant et la <button class="w" data-justification="1" data-k="e11-mecanismes-complications">glycation</button> relient hyperglycémie à lésions vasculaires ; les anomalies de durée de vie des hématies peuvent fausser l’HbA1c.</li><li><button class="w" data-justification="1" data-k="e11-d-isglt2">SGLT2</button> réabsorbe le glucose et le sodium au tubule proximal ; son inhibition entraîne une glycosurie et probablement un rétrocontrôle tubulo-glomérulaire protecteur, avec des effets glycémiques et rénaux distincts.</li><li>Les figures sont des schémas de mécanisme ; les valeurs d’étude de glycosurie/<button class="w" data-k="e11-gl-16">DFG</button> ne sont pas des cibles de prescription.</li></ul></template>

<template data-pop="e11-d-eviter" data-title="Pioglitazone et saxagliptine : restrictions et risque cardiaque"><p>La recommandation clinique peut déconseiller un produit sans que la <button class="w" data-k="e11-gl-23">FI</button> classe toutes les situations dans les contre-indications formelles. La SSED évite ces produits chez l’insuffisant cardiaque ; leurs <button class="w" data-k="e11-gl-23">FI</button> précisent des restrictions différentes.</p><p><b>Actos® : pioglitazone, <button class="w" data-k="e11-gl-23">FI</button> mai 2021.</b> La dose orale initiale est 15 ou 30 mg une fois par jour, avec ou sans repas ; l’augmentation progressive peut atteindre 45 mg/jour. Le diabète de type 2 constitue une indication de deuxième choix, après évaluation des alternatives. Aucune adaptation rénale n’est prévue au-dessus d’une clairance de 4 mL/min ; les données de dialyse manquent. En insuffisance hépatique légère, le début est 15 mg ; les formes modérées/sévères sont contre-indiquées. Les autres contre-indications comprennent hypersensibilité, type 1, acidocétose, insuffisance cardiaque NYHA III/IV, grossesse/allaitement, cancer vésical ou antécédent et hématurie inexpliquée. La rétention hydrique, la prise pondérale et les fractures imposent une évaluation attentive ; le bénéfice se réévalue après trois à six mois. Le traitement au-delà de deux ans demande une nouvelle appréciation du bénéfice–risque vésical. Les données hépatiques du consensus ne créent pas une autorisation suisse spécifique de traitement de la stéatohépatite.</p><p><b>Onglyza® : saxagliptine, <button class="w" data-k="e11-gl-23">FI</button> septembre 2023.</b> La <button class="w" data-k="e11-gl-23">FI</button> prévoit par voie orale 2,5 ou 5 mg une fois par jour ; sous <button class="w" data-k="e11-gl-16">DFG</button> 45 mL/min/1,73 m², la dose est 2,5 mg. La forme terminale nécessitant hémodialyse et l’insuffisance hépatique sévère ne sont pas recommandées ; la forme hépatique modérée demande de la prudence. L’hypersensibilité est une contre-indication. Le signal d’hospitalisation pour insuffisance cardiaque demande une prudence particulière, sans devenir une contre-indication suisse formelle pour tout patient cardiaque. Une pancréatite suspectée impose l’arrêt. La grossesse n’autorise l’usage qu’en cas de nécessité absolue ; l’allaitement demande de la prudence. Ce cours privilégie les autres options selon la SSED ; il ne propose pas la saxagliptine comme protection cardiaque.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680553780012" target="_blank" rel="noopener">Information professionnelle suisse Actos® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680593900012" target="_blank" rel="noopener">Information professionnelle suisse Onglyza® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, insuffisance cardiaque</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint 2026, traitements</a>.</p></template>
<template data-pop="e11-normalite" data-title="Référence biologique, seuil diagnostique et cible"><p>Un intervalle de référence décrit les résultats d’une population du laboratoire avec sa méthode. Un seuil diagnostique classe une maladie ou un risque ; une cible fixe le résultat souhaité sous traitement. Ils ne sont pas interchangeables. Le tableau donne des références suisses effectivement consultées ; le compte rendu du laboratoire du patient prime pour sa méthode et son prélèvement.</p><table class="t"><tr><th>Paramètre / prélèvement</th><th>Référence du catalogue suisse</th><th>Contexte et limite</th></tr><tr><td>Glucose plasmatique fluoré à jeun, mmol/L</td><td>Viollier : 3,3–5,5 chez les 16–99 ans ; 3,5–5,5 chez les 0–15 ans</td><td>Jeûne ≥ 8 h ; méthode hexokinase. Ce cours traite l’adulte hors grossesse. Le diagnostic du diabète à jeun ≥ 7,0 est un autre repère.</td></tr><tr><td>Sodium sérique, mmol/L</td><td>Viollier : 136–145</td><td>Électrode sélective ; pas de tranche d’âge précisée dans cette fiche. Hyperglycémie et déplacements d’eau modifient son interprétation.</td></tr><tr><td>Potassium (<button class="w" data-k="e11-gl-5">K⁺</button>) sérique, mmol/L</td><td>Viollier : 3,5–5,1</td><td>Électrode sélective ; centrifugation 20–45 min après prélèvement. Une valeur sérique satisfaisante n’exclut pas le déficit corporel d’une crise.</td></tr><tr><td>Bicarbonates sériques, mmol/L</td><td>Viollier : 20–31</td><td>Dosage enzymatique, tube centrifugé non ouvert. La valeur calculée en gazométrie dépend du prélèvement et du système : ne pas lui appliquer silencieusement cet intervalle.</td></tr><tr><td>Osmolalité sérique mesurée, mOsm/kg</td><td>Viollier : 280–300</td><td>Abaissement du point de congélation. L’approximation calculée incluant l’urée et la tonicité efficace ont une signification différente.</td></tr><tr><td>Lactate plasmatique fluoré, mmol/L</td><td>Viollier : 0,5–2,2</td><td>Séparer le plasma ; l’étamsylate peut donner un résultat faussement bas. Le lactate &gt; 5 de l’acidose lactique est un seuil d’alerte, pas la limite haute de référence.</td></tr><tr><td>Peptide C sérique à jeun, nmol/L</td><td>Viollier : 0,27–1,27, soit 270–1270 pmol/L</td><td>Chimiluminescence, centrifugation immédiate puis réfrigération. Interpréter avec glycémie, état clinique et fonction rénale ; le profil SSED &gt; 200 et &lt; 600 pmol/L décrit une insulinodéficience relative, pas cet intervalle de référence.</td></tr><tr><td>Urée sérique, mmol/L</td><td>Viollier : 2,1–7,1 (19–60 ans) ; 2,9–8,2 (≥ 61 ans)</td><td>Dosage enzymatique ; sa contribution à l’osmolalité totale ne représente pas une contribution durable à la tonicité.</td></tr><tr><td>Créatinine sérique, µmol/L</td><td>Viollier : femme 40–80 (15–49 ans), 42–89 (≥ 50) ; homme 50–98 puis 51–109</td><td>Dosage enzymatique ; éviter viande, poisson et créatine dans les 12 h précédentes. Le <button class="w" data-k="e11-gl-16">DFG</button> estimé contextualise la valeur ; il n’est pas la créatinine.</td></tr><tr><td><button class="w" data-k="e11-gl-7">pH</button> gazométrique de l’adulte, sans unité</td><td>La Source : 7,35–7,45</td><td>Le catalogue ne précise pas la voie de prélèvement sur cette page ; vérifier le compte rendu artériel/veineux. Le seuil veineux &lt; 7,3 du consensus crise est explicitement diagnostique.</td></tr><tr><td>HbA1c, <button class="w" data-k="e11-gl-16">DFG</button>, albumine/créatinine, lipides, pression</td><td>Seuils et cibles contextualisés dans leurs fenêtres</td><td>Pas d’intervalle universel inventé : HbA1c &lt; 5,7 % est sous le prédiabète SSED ; <button class="w" data-k="e11-mrc">G1</button> ≥ 90 et <button class="w" data-k="e11-gl-20">A1</button> &lt; 3 sont catégories ; <button class="w" data-k="e11-proxy-ldl">LDL</button> thérapeutique dépend du risque ; grossesse et vieillissement changent les objectifs.</td></tr></table><p>Une valeur hors intervalle mérite une interprétation ; une valeur dedans n’exclut pas toute maladie. Les seuils de finérénone (4,8 ; 5 ; 5,5 mmol/L de potassium) sont des décisions propres à la <button class="w" data-k="e11-gl-23">FI</button> et ne remplacent pas le repère sérique 3,5–5,1.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7380" target="_blank" rel="noopener">Viollier glucose à jeun, consultation 11.10.2026</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7100" target="_blank" rel="noopener">Viollier potassium</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7090" target="_blank" rel="noopener">Viollier sodium</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/10236" target="_blank" rel="noopener">Viollier bicarbonates</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/18362" target="_blank" rel="noopener">Viollier osmolalité</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/10276" target="_blank" rel="noopener">Viollier lactate</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/26518" target="_blank" rel="noopener">Viollier peptide C</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7180" target="_blank" rel="noopener">Viollier urée</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7190" target="_blank" rel="noopener">Viollier créatinine</a>.</p><p class="src">Référence : <a href="https://www.lasource.ch/espace-medecins/laboratoires/catalogue-danalyses/gazometrie" target="_blank" rel="noopener">La Source, gazométrie de l’adulte</a>.</p></template><template data-pop="e11-osmolalite" data-title="Osmolalité totale et tonicité : bases et calcul"><p>L’eau se distribue selon les particules dissoutes. Les osmoles efficaces entretiennent un déplacement d’eau entre les compartiments : le sodium avec ses anions et le glucose dominent cette approximation. L’urée traverse les membranes et apporte peu de gradient durable ; elle augmente le total sans augmenter autant la tonicité. La tonicité est donc l’osmolalité efficace.</p><p>Le laboratoire mesure l’osmolalité en milliosmoles par kilogramme d’eau, mOsm/kg. Une osmolarité est rapportée au litre de solution. Le calcul de chevet ci-dessous donne une approximation, appelée osmolalité calculée par le JBDS ; ce n’est pas une mesure directe ni une conversion physique exacte.</p><table class="t"><tr><th>Calcul, concentrations toutes en mmol/L</th><th>Raison</th></tr><tr><td>Totale ≈ 2 × sodium + glucose + urée</td><td>Le facteur 2 représente approximativement les anions accompagnant le sodium ; chaque soluté ajouté apporte des particules.</td></tr><tr><td>Efficace ≈ 2 × sodium + glucose</td><td>L’urée est exclue de la tonicité.</td></tr></table><p><b>Exemple fictif :</b> sodium 145 mmol/L, glucose 36 mmol/L, urée 12 mmol/L. Étape 1 : 2 × 145 = 290. Étape 2 : efficace = 290 + 36 = 326 mOsm/kg. Étape 3 : totale = 326 + 12 = 338 mOsm/kg. Les deux repères hyperosmolaires du consensus sont dépassés, mais le diagnostic exige encore les autres critères. Aucun de ces nombres n’est une norme.</p><p>Pour suivre une baisse, prendre deux résultats calculés par la même formule et leurs heures : de 338 à 326 en deux heures, (338 − 326)/2 = 6 mOsm/kg/heure. Ce débit pédagogique se situe dans la cible hospitalière 3–8 ; la décision exige les mesures et la situation clinique réelles. Ne pas introduire de sodium « corrigé » dans cette formule sans protocole spécifique, ni mélanger <button class="w" data-k="e11-unite-mgdl">mg/dL</button> et mmol/L. Une discordance mesure/calcul nécessite une évaluation des autres osmoles et de la méthode ; aucun seuil de trou osmolaire n’est inventé ici.</p><p><button class="w" data-k="e11-normalite">Références suisses des paramètres</button> ; <button class="w" data-k="e11-shh">Diagnostic et traitement hospitalier</button>.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS 2023, Osmolality, sodium and glucose</a>.</p><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus 2024, figure 2 et traitement état hyperosmolaire</a>.</p></template><template data-pop="e11-calcul-dose" data-title="Calculer une dose par poids, sans confondre unités"><p>Une dose en unité/kg multiplie une quantité pharmacologique par le poids en kilogrammes ; « par jour » et « par heure » désignent des fréquences différentes. Une unité d’insuline exprime une activité, pas une masse en mg. Le débit en mL/heure dépend ensuite de la concentration de la préparation.</p><table class="t"><tr><th>Situation sourcée</th><th>Exemple fictif, poids 80 kg</th></tr><tr><td>Toujeo® : début 0,2 unité/kg/jour, sous-cutané chez le type 2</td><td>0,2 × 80 = 16 unités par jour. Le stylo indique les unités ; ne pas convertir la dose affichée ni retirer le produit du stylo à la seringue.</td></tr><tr><td>État hyperosmolaire : branche 0,05 unité/kg/heure</td><td>0,05 × 80 = 4 unités/heure. À concentration hospitalière fictive de 1 unité/mL, 4/1 = 4 mL/heure.</td></tr><tr><td>Branche 0,1 unité/kg/heure</td><td>0,1 × 80 = 8 unités/heure ; même préparation fictive : 8 mL/heure.</td></tr></table><p>Les unités du kg s’annulent dans le premier produit ; celles des unités s’annulent dans la division débit/concentration. La concentration fictive ne constitue pas une instruction de préparation : produit, compatibilité, dilution, pompe et surveillance sont validés par le protocole hospitalier et la <button class="w" data-k="e11-gl-23">FI</button>. Toujeo® ne s’administre jamais en intraveineux. NovoRapid® permet cette voie sous contrôle professionnel. Le potassium et la réhydratation peuvent imposer de différer l’insuline.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680654530011" target="_blank" rel="noopener">Toujeo®, FI suisse, dose initiale et dispositif</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">NovoRapid®, FI suisse, voie IV</a>.</p><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus 2024, débit selon les critères biologiques</a>.</p></template><template data-pop="e11-calcul-acr" data-title="Rapport albumine/créatinine urinaire"><p>Une concentration d’albumine urinaire dépend de la dilution de l’urine. Le rapport à la créatinine du même échantillon réduit cette influence ; il ne mesure pas directement une perte quotidienne ni ne remplace la confirmation de persistance.</p><p>Albumine (mg/L) ÷ créatinine urinaire (mmol/L) = rapport en mg/mmol : le litre s’annule. <b>Exemple fictif :</b> albumine 60 mg/L et créatinine 10 mmol/L donnent 60/10 = 6 mg/mmol, catégorie <button class="w" data-k="e11-gl-21">A2</button>. Si le rapport est exactement 30 mg/mmol, il appartient à <button class="w" data-k="e11-gl-22">A3</button> ; <button class="w" data-k="e11-gl-21">A2</button> est de 3 à &lt; 30. La créatinine sérique en µmol/L ne peut pas servir de dénominateur.</p><p>Le catalogue suisse Viollier décrit un prélèvement ponctuel de seconde urine matinale. La SSED–néphrologie demande au moins un dépistage annuel et une confirmation de stade ; une anomalie persistant au moins trois mois fait discuter la maladie chronique. Interpréter les anomalies transitoires avec le contexte et le sédiment, et demander un avis si elles progressent.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED–Société suisse de néphrologie, brochure mai 2024, Screening / grille maladie rénale chronique</a>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/16119" target="_blank" rel="noopener">Viollier, albumine urinaire et rapport sur même prélèvement</a>.</p></template><template data-pop="e11-calcul-hba1c" data-title="Deux unités d’HbA1c : une conversion calibrée"><p>L’HbA1c est l’hémoglobine ayant subi une glycation ; sa valeur dépend de la mesure et de la durée de vie des globules rouges. Le résultat peut être donné en pourcentage du système <button class="w" data-k="e11-gl-ngsp">NGSP</button> ou en mmol/mol du système <button class="w" data-k="e11-gl-ifcc">IFCC</button>. Les deux calibrations diffèrent : multiplier un pourcentage par dix ne suffit pas.</p><p>Équation publiée par <button class="w" data-k="e11-gl-ngsp">NGSP</button> : % = 0,09148 × valeur <button class="w" data-k="e11-gl-ifcc">IFCC</button> en mmol/mol + 2,152. Inverse publiée, arrondie : mmol/mol = 10,93 × % − 23,50. <b>Exemple pédagogique :</b> 48 mmol/mol donne 0,09148 × 48 + 2,152 = 6,543 %, affiché environ 6,5 %. Inversement 7,0 % donne 10,93 × 7 − 23,50 = 53,01, soit 53 mmol/mol.</p><p>Il s’agit d’une conversion métrologique, pas d’une nouvelle cible. Les arrondis expliquent de petits écarts à la frontière. La SSED exige une HbA1c standardisée et distingue diagnostic ≥ 6,5 %, prédiabète 5,7–6,4 % et cible thérapeutique individualisée ; une hémolyse ou une carence en fer peut invalider l’interprétation malgré un calcul exact.</p><p class="src">Référence : <a href="https://ngsp.org/ifccngsp.asp" target="_blank" rel="noopener">NGSP, équation de correspondance IFCC–NGSP, donnée métrologique internationale</a>.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">Position diagnostique suisse SSED 2011</a>.</p></template><template data-pop="e11-calcul-tir" data-title="Temps dans la cible : calcul et limites"><p>Le temps dans la cible exprime la proportion de données du capteur entre 3,9 et 10,0 mmol/L chez l’adulte hors grossesse : ce sont les bornes d’une cible de surveillance, pas l’intervalle biologique à jeun. La SSED 2023 vise au moins 70 % chez de nombreux patients, avec individualisation.</p><p>Temps dans l’intervalle ÷ temps enregistré valide × 100. <b>Exemple fictif :</b> 17 heures dans la cible sur 24 heures enregistrées donnent 17/24 × 100 = 70,8 %. Avec des mesures régulièrement espacées, on peut utiliser le nombre de mesures dans la cible divisé par le nombre de mesures valides. Des données absentes ou des durées irrégulières faussent le quotient ; préciser la période et la complétude. Une même proportion peut masquer des hypoglycémies : elle s’interprète avec le temps sous et au-dessus de la cible.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, targets and time in range</a>.</p><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint 2026, monitoring</a>.</p></template><template data-pop="e11-calcul-risque" data-title="Différence absolue, réduction relative et rapport de risques"><p>Le bénéfice d’un essai dépend de sa population, de son critère et de sa durée. Une différence absolue compare des fréquences ; une réduction relative les rapporte à la fréquence du groupe témoin. Un rapport instantané de risques (hazard ratio) provient de l’analyse du délai jusqu’à l’événement : il ne se calcule pas simplement en divisant deux pourcentages cumulés.</p><p>EMPA-REG OUTCOME : critère cardiovasculaire majeur chez 10,5 % sous empagliflozine et 12,1 % sous placebo, 7020 patients avec type 2 à haut risque cardiovasculaire, suivi médian 3,1 ans. Étape 1 : réduction absolue = 12,1 − 10,5 = 1,6 point de pourcentage. Étape 2 : réduction relative brute = 1,6/12,1 × 100 = 13,2 %. Le rapport instantané publié est 0,86 : 1 − 0,86 = 0,14, soit 14 % de réduction relative du risque instantané selon le modèle, sans identité obligatoire avec 13,2 %.</p><p>Inverse de la différence de proportions : 1/0,016 = 62,5, environ 63 patients. C’est une approximation pédagogique du nombre à traiter sur cet horizon, sans intervalle de confiance ni correction temporelle. Elle ne doit pas devenir une promesse individuelle ou être transposée aux patients à bas risque. Le résumé primaire ne montre pas de réduction significative isolée de l’infarctus ou de l’AVC.</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/26378978/" target="_blank" rel="noopener">EMPA-REG OUTCOME 2015, résumé primaire, résultats et suivi</a>.</p><p><b>Application au cholestérol <button class="w" data-k="e11-proxy-ldl">LDL</button>.</b> La brochure suisse rénale demande, chez les patients concernés, une baisse d’au moins 50 % en plus de la cible absolue. Dans un exemple fictif, 3,0 vers 1,5 mmol/L donne une baisse de 1,5 mmol/L, soit 100 × (3,0 − 1,5) / 3,0 = 50 %. Le pourcentage ne remplace pas la cible en mmol/L. La valeur initiale, l’observance et le contexte de risque doivent être connus.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED–Société suisse de néphrologie 2024, prise en charge lipidique</a>.</p></template><template data-pop="e11-calcul-poids" data-title="IMC et pourcentage de perte de poids"><p>L’indice de masse corporelle rapporte la masse à la taille au carré : poids en kg ÷ (taille en m × taille en m), résultat en kg/m². Il ne mesure pas directement la graisse ni la masse musculaire ; la fragilité et la dénutrition peuvent coexister avec un IMC élevé.</p><p><b>Exemple fictif :</b> 100 kg et 1,75 m donnent 100/(1,75 × 1,75) = 32,7 kg/m². Une perte de 15 kg depuis 100 kg représente (100 − 85)/100 × 100 = 15 %. Le poids initial constitue le dénominateur ; 15 kg n’équivaut pas à 15 % chez toute personne.</p><p>Ces calculs permettent d’appliquer les repères pondéraux de la SSED et des études de rémission. Dans DiRECT, les participants étaient sélectionnés et le programme encadré ; une forte perte pondérale ne garantit pas une rémission ni ne justifie une restriction non supervisée. Les seuils d’orientation vers la chirurgie varient entre SSED, <button class="w" data-k="e11-gl-14">ESC</button> et consensus conjoint ; ils sont explicités dans la fenêtre thérapeutique. La prise en charge et le remboursement ne découlent pas du calcul seul.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, weight and surgery</a>.</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/29221645/" target="_blank" rel="noopener">DiRECT, résumé primaire 2018</a>.</p></template><template data-pop="e11-calcul-ips" data-title="Indice cheville/bras et évolution d’une plaie"><p>L’indice de pression systolique cheville/bras compare des pressions artérielles en mmHg : pression systolique à la cheville divisée par la plus haute pression brachiale droite/gauche. Pour chaque jambe, l’IWGDF utilise la plus basse des pressions des artères dorsale du pied et tibiale postérieure. Les mmHg s’annulent ; le résultat est sans unité.</p><p><b>Exemple fictif :</b> pressions de cheville 100 et 90 mmHg, pressions brachiales 120 et 110 : 90/120 = 0,75. L’artériopathie est moins probable si indice 0,9–1,3, Doppler biphasique/triphasique et indice orteil/bras ≥ 0,70, sans exclusion certaine. La calcification peut rendre les artères peu compressibles ; un indice isolé ne rassure pas, particulièrement s’il est élevé. Mesure Doppler standardisée après repos couché, avec brassards adaptés.</p><p>Le guide suisse cite indice &lt; 0,5 ou pression d’orteil &lt; 30 mmHg comme signaux d’ischémie critique ; le complément IWGDF 2023 cite &lt; 0,4 ou pression de cheville &lt; 50 pour discuter une urgence vasculaire. Le guide suisse prime ici pour l’orientation, et les bornes distinctes restent nommées.</p><p>La réduction de surface d’une plaie vaut (surface initiale − actuelle)/initiale × 100. Exemple fictif : 4 à 2,4 cm² donne 1,6/4 × 100 = 40 %. Le guide suisse considère &lt; 50 % en quatre semaines comme amélioration insuffisante motivant le plus haut niveau. Mesurer les surfaces par une méthode reproductible ; longueur × largeur n’est qu’une approximation si la plaie est irrégulière.</p><p class="src">Référence : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, Appendix 2 et perfusion</a>.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, Red flags</a>.</p></template><template data-pop="e11-cout" data-title="Choix clinique, coût et accès en Suisse"><p>La SSED 2023 distingue le faible coût de la metformine et du gliclazide du coût plus élevé des traitements modernes. Un médicament moins cher peut exposer davantage à l’hypoglycémie ; un bénéfice cardio-rénal peut éviter des complications. La décision compare bénéfice, risque, préférences et accès, sans assimiler prix et valeur clinique.</p><p>Les modèles économiques cités par la SSED proviennent notamment de pays étrangers ; ils ne prouvent pas à eux seuls un coût actuel ni un remboursement en Suisse. Les anciennes limites d’IMC et doses figurant dans les tableaux 2023–2024 sont historiques. L’indication et la dose suivent la <button class="w" data-k="e11-gl-23">FI</button> actuelle du produit ; sa prise en charge financière exige de vérifier la liste des spécialités et ses limitations à la date de prescription. Ce cours ne certifie pas une vérification actuelle de chaque limitation OFSP.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, Costs of diabetes treatment</a>.</p></template><template data-pop="e11-ratios-physio" data-title="Rapports énergétiques et hormonaux : sens et limites"><p>Dans la cellule β, le métabolisme du glucose augmente la disponibilité d’<button class="w" data-k="e11-gl-2">ATP</button> par rapport à l’<button class="w" data-k="e11-gl-1">ADP</button>. Le rapport <button class="w" data-k="e11-gl-2">ATP</button>/<button class="w" data-k="e11-gl-1">ADP</button> compare leurs quantités ou concentrations mesurées dans le même compartiment, aux mêmes unités ; c’est un rapport sans unité. Sa hausse ferme les canaux potassiques sensibles à l’<button class="w" data-k="e11-gl-2">ATP</button>, puis la dépolarisation permet l’entrée de calcium et la libération des granules.</p><p><b>Exemple arithmétique fictif, sans valeur normale :</b> <button class="w" data-k="e11-gl-2">ATP</button> 4 et <button class="w" data-k="e11-gl-1">ADP</button> 1 dans les mêmes unités donnent 4 ; <button class="w" data-k="e11-gl-2">ATP</button> 4 et <button class="w" data-k="e11-gl-1">ADP</button> 2 donnent 2. Le résultat dépend du dénominateur et du compartiment. Ce cours ne donne ni dosage de routine ni seuil clinique de ce rapport.</p><p>Le rapport insuline/glucagon du texte exprime la prédominance relative des deux signaux : à jeun le glucagon soutient la production hépatique ; après repas l’insuline freine cette production et favorise l’utilisation périphérique. Une division de dosages exigerait la même base molaire et des prélèvements comparables ; les unités commerciales ne s’annulent pas automatiquement. Le cours ne propose pas de quotient numérique diagnostique ni d’intervalle normal. Les traitements et la glycémie influencent les deux hormones.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia 2020, Liver, pancreatic beta-cell dysfunction</a>.</p></template><template data-pop="e11-gl-1" data-title="Adénosine diphosphate"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Adénosine</td></tr><tr><td>D</td><td>Di-</td></tr><tr><td>P</td><td>Phosphate</td></tr></table><p><b>Adénosine diphosphate.</b> Molécule énergétique de la cellule ; elle est ici le dénominateur du rapport <button class="w" data-k="e11-gl-2">ATP</button>/<button class="w" data-k="e11-gl-1">ADP</button>, dans le couplage glucose–sécrétion de la cellule β.</p><p><button class="w" data-k="e11-ratios-physio">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-2" data-title="Adénosine triphosphate"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Adénosine</td></tr><tr><td>T</td><td>Tri-</td></tr><tr><td>P</td><td>Phosphate</td></tr></table><p><b>Adénosine triphosphate.</b> Molécule énergétique ; la hausse du rapport <button class="w" data-k="e11-gl-2">ATP</button>/<button class="w" data-k="e11-gl-1">ADP</button> ferme les canaux potassiques sensibles à l’<button class="w" data-k="e11-gl-2">ATP</button> dans la cellule β. Ce contexte est distinct des définitions du muscle cardiaque.</p><p><button class="w" data-k="e11-ratios-physio">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-3" data-title="Adénosine monophosphate cyclique"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Adénosine</td></tr><tr><td>M</td><td>Mono-</td></tr><tr><td>P</td><td>Phosphate</td></tr><tr><td>c</td><td>cyclique</td></tr></table><p><b>Adénosine monophosphate cyclique.</b> Second messager : le récepteur du <button class="w" data-k="e11-gl-13">GLP-1</button> augmente ce signal et amplifie la sécrétion d’insuline dépendante du glucose. Ce n’est pas une valeur sanguine de surveillance.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680652360016" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-4" data-title="Ion calcium"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>Ca</td><td>Symbole chimique du calcium</td></tr><tr><td>²⁺</td><td>Charge positive de deux unités</td></tr></table><p><b>Ion calcium.</b> L’entrée de calcium dans la cellule β après dépolarisation déclenche l’exocytose. Il s’agit d’un mécanisme intracellulaire, pas d’une cible de calcémie.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-5" data-title="Ion potassium"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>K</td><td>Symbole chimique du potassium</td></tr><tr><td>⁺</td><td>Charge positive</td></tr></table><p><b>Ion potassium.</b> Les canaux potassiques participent à la sécrétion d’insuline ; le potassium sérique surveillé en crise est un autre compartiment. Référence Viollier 3,5–5,1 mmol/L ; l’insuline peut abaisser la concentration sérique.</p><p><button class="w" data-k="e11-normalite">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7100" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-6" data-title="Ion sodium"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>Na</td><td>Symbole chimique du sodium</td></tr><tr><td>⁺</td><td>Charge positive</td></tr></table><p><b>Ion sodium.</b> Soluté dominant de l’approximation de l’osmolalité avec ses anions ; référence sérique Viollier 136–145 mmol/L. Le contexte d’hyperglycémie impose de raisonner avec les déplacements d’eau.</p><p><button class="w" data-k="e11-osmolalite">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7090" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-7" data-title="Potentiel hydrogène et acidité"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td><button class="w" data-k="e11-gl-7">pH</button></td><td>Notation de l’acidité, pas un sigle clinique développé lettre par lettre</td></tr></table><p><b>Mesure logarithmique de l’acidité.</b> Sans unité ; une baisse traduit une augmentation de l’acidité. En crise, le consensus utilise le <button class="w" data-k="e11-gl-7">pH</button> veineux : acidose si &lt; 7,3. Le repère gazométrique adulte La Source est 7,35–7,45, sans voie explicitée dans la fiche ; respecter le prélèvement.</p><p><button class="w" data-k="e11-normalite">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://www.lasource.ch/espace-medecins/laboratoires/catalogue-danalyses/gazometrie" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-8" data-title="Facteur de nécrose tumorale"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>T</td><td>Tumor (tumeur)</td></tr><tr><td>N</td><td>Necrosis (nécrose)</td></tr><tr><td>F</td><td>Factor (facteur)</td></tr></table><p><b>Facteur de nécrose tumorale.</b> Dans ce cours, cytokine inflammatoire du tissu adipeux, notamment <button class="w" data-k="e11-gl-8">TNF</button>-α ; l’inflammation contribue à affaiblir le signal insulinique. Aucun dosage ni cible n’est enseigné.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-9" data-title="Interleukine six"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>IL</td><td>Interleukine</td></tr><tr><td>6</td><td>numéro de l’interleukine</td></tr></table><p><b>Interleukine 6.</b> Cytokine de l’inflammation métabolique, décrite avec <button class="w" data-k="e11-gl-8">TNF</button>-α et IL-1 dans la physiopathologie de l’insulinorésistance ; ce n’est pas une indication de dosage de routine.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-10" data-title="Enzyme de métabolisme médicamenteux"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>CYP</td><td>Cytochrome <button class="w" data-k="e11-gl-10">P450</button></td></tr><tr><td>3</td><td>famille 3</td></tr><tr><td>A</td><td>sous-famille A</td></tr><tr><td>4</td><td>membre 4</td></tr></table><p><b>Enzyme <button class="w" data-k="e11-gl-10">CYP3A4</button> du métabolisme médicamenteux.</b> La finérénone est métabolisée principalement par cette enzyme. Les inhibiteurs puissants sont contre-indiqués avec Kerendia® ; les inhibiteurs modérés/faibles motivent une surveillance accrue du potassium.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-11" data-title="Classification de sévérité hépatique"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td><button class="w" data-k="e11-gl-11">Child-Pugh</button></td><td>Noms propres ; aucun développement en lettres</td></tr></table><p><b>Classification de sévérité de l’atteinte hépatique.</b> La <button class="w" data-k="e11-gl-23">FI</button> de finérénone distingue A légère, B modérée et C sévère : pas d’adaptation initiale A/B, surveillance potassique supplémentaire en B, traitement à éviter en C. Le cours ne calcule pas ce score ni ne transforme ces catégories en norme biologique.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p><p>Les catégories hépatiques se lisent ainsi pour cette information professionnelle, sans calcul de score dans ce cours.</p><table class="t"><tr><th><button class="w" data-k="e11-gl-11">Child-Pugh</button></th><th>Atteinte hépatique</th><th>Finérénone : conséquence</th></tr><tr><td>A</td><td>Légère</td><td>Pas d’adaptation initiale</td></tr><tr><td>B</td><td>Modérée</td><td>Pas d’adaptation initiale ; surveillance potassique supplémentaire</td></tr><tr><td>C</td><td>Sévère</td><td>Traitement à éviter</td></tr></table></template><template data-pop="e11-gl-12" data-title="Index de pression systolique"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>I</td><td>Indice</td></tr><tr><td>P</td><td>de Pression</td></tr><tr><td>S</td><td>Systolique</td></tr></table><p><b>Indice de pression systolique cheville/bras.</b> Rapport des pressions systoliques de cheville et de bras, sans unité ; il explore la perfusion artérielle du membre, dans le contexte de pied diabétique. La calcification peut fausser son interprétation.</p><p><button class="w" data-k="e11-calcul-ips">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-13" data-title="Peptide apparenté au glucagon"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>G</td><td>Glucagon</td></tr><tr><td>L</td><td>Like (semblable)</td></tr><tr><td>P</td><td>Peptide</td></tr><tr><td>1</td><td>type 1</td></tr></table><p><b>Peptide de type glucagon 1.</b> Incrétine qui amplifie la sécrétion d’insuline selon la glycémie et freine le glucagon. Ses agonistes ont des indications propres aux produits ; aucune classe <button class="w" data-k="e11-gl-14">ESC</button> 2026 non sourcée n’est ajoutée ici.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680652360016" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-14" data-title="Société européenne de cardiologie"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>E</td><td>European (européenne)</td></tr><tr><td>S</td><td>Society (société)</td></tr><tr><td>C</td><td>of Cardiology (de cardiologie)</td></tr></table><p><b>Société européenne de cardiologie.</b> Le cours utilise sa recommandation diabète–maladies cardiovasculaires 2023, notamment SCORE2-Diabetes et les objectifs de prévention, complément explicite aux recommandations suisses.</p><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-15" data-title="Anti-inflammatoires non stéroïdiens"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Anti-</td></tr><tr><td>I</td><td>Inflammatoires</td></tr><tr><td>N</td><td>Non</td></tr><tr><td>S</td><td>Stéroïdiens</td></tr></table><p><b>Anti-inflammatoires non stéroïdiens.</b> Ils peuvent dégrader la fonction rénale et augmenter indirectement le risque d’acidose lactique sous metformine ; le contexte est rénal et métabolique.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-16" data-title="Débit de filtration glomérulaire"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>D</td><td>Débit</td></tr><tr><td>F</td><td>de Filtration</td></tr><tr><td>G</td><td>Glomérulaire</td></tr></table><p><b>Débit de filtration glomérulaire.</b> Paramètre de fonction rénale exprimé ici en mL/min/1,73 m², généralement estimé à partir de la créatinine. Une baisse persistante au moins trois mois contribue à définir la maladie chronique. <button class="w" data-k="e11-mrc">G1</button> ≥ 90 n’exclut pas une maladie rénale si autre marqueur.</p><p><button class="w" data-k="e11-mrc">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-17" data-title="Auto-antigène des îlots pancréatiques"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td><button class="w" data-k="e11-gl-17">IA</button></td><td>Insulinoma-associated (associé à l’insulinome)</td></tr><tr><td>2</td><td>antigène de type 2</td></tr></table><p><b>Antigène associé à l’insulinome 2.</b> Ici, cible d’auto-anticorps du diabète auto-immun, associée à anti-<button class="w" data-k="e11-gl-24">GAD</button> et anti-<button class="w" data-k="e11-proxy-znt8">ZnT8</button> ; ce n’est pas un stade de cancer pulmonaire.</p><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-18" data-title="Permis suisse : usage privé et professionnel"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td><button class="w" data-k="e11-gl-18">C1</button></td><td>Code de sous-catégorie de permis, pas un sigle anatomique</td></tr></table><p><b>Permis <button class="w" data-k="e11-gl-18">C1</button> dans la directive diabète et conduite.</b> La directive suisse distingue <button class="w" data-k="e11-gl-18">C1</button> pour usage privé dans le groupe médical 1 et <button class="w" data-k="e11-gl-18">C1</button> professionnel dans le groupe 2 ; l’examen du permis exact est indispensable.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-19" data-title="Permis suisse de transport de personnes"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td><button class="w" data-k="e11-gl-19">D1</button></td><td>Code de sous-catégorie de permis, pas un sigle cardiologique</td></tr></table><p><b>Permis <button class="w" data-k="e11-gl-19">D1</button> dans la directive diabète et conduite.</b> Catégorie de transport de personnes du groupe médical 2. Sous traitement exposant à l’hypoglycémie, l’aptitude est en principe exclue ; éventuelle dérogation par médecin de niveau 4 selon conditions strictes.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-20" data-title="Albuminurie : première catégorie"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Albuminurie</td></tr><tr><td>1</td><td>catégorie 1</td></tr></table><p><b>Albuminurie <button class="w" data-k="e11-gl-20">A1</button>.</b> Rapport albumine/créatinine urinaire &lt; 3 mg/mmol dans la grille maladie rénale chronique suisse ; ce contexte concerne le rein, pas le permis moto <button class="w" data-k="e11-gl-20">A1</button>.</p><p><button class="w" data-k="e11-calcul-acr">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-21" data-title="Albuminurie : deuxième catégorie"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Albuminurie</td></tr><tr><td>2</td><td>catégorie 2</td></tr></table><p><b>Albuminurie <button class="w" data-k="e11-gl-21">A2</button>.</b> Rapport albumine/créatinine urinaire ≥ 3 et &lt; 30 mg/mmol ; exactement 30 relève de <button class="w" data-k="e11-gl-22">A3</button>. La chronicité exige confirmation dans le temps.</p><p><button class="w" data-k="e11-calcul-acr">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-22" data-title="Albuminurie : troisième catégorie"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Albuminurie</td></tr><tr><td>3</td><td>catégorie 3</td></tr></table><p><b>Albuminurie <button class="w" data-k="e11-gl-22">A3</button>.</b> Rapport albumine/créatinine urinaire ≥ 30 mg/mmol ; exactement 30 appartient ici, et non à <button class="w" data-k="e11-gl-21">A2</button>.</p><p><button class="w" data-k="e11-calcul-acr">Bases, paramètres et limites</button>.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-23" data-title="Information professionnelle du médicament"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>F</td><td>Fach (professionnel)</td></tr><tr><td>I</td><td>Information (information)</td></tr></table><p><b>Information professionnelle suisse du produit.</b> Texte AIPS de référence pour indication, dose, voies et sécurité du produit exact ; l’outil Swissmedic/AmiKo sert à le consulter. Autorisation, disponibilité et remboursement sont trois questions distinctes.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-24" data-title="Décarboxylase de l’acide glutamique"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>GA</td><td>Glutamic Acid (acide glutamique)</td></tr><tr><td>D</td><td>Decarboxylase (décarboxylase)</td></tr></table><p><b>Décarboxylase de l’acide glutamique.</b> Les auto-anticorps anti-<button class="w" data-k="e11-gl-24">GAD</button> étayent un diabète auto-immun ; leur demande dépend du contexte clinique et ne doit pas retarder le traitement d’une carence insulinique.</p><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-25" data-title="Épreuve orale avec charge de glucose"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>HG</td><td>Hyperglycémie</td></tr><tr><td>P</td><td>Provoquée</td></tr><tr><td>O</td><td>par voie Orale</td></tr></table><p><b>Hyperglycémie provoquée par voie orale.</b> Test standardisé avec charge orale de 75 g après au moins huit heures de jeûne et glycémie plasmatique à deux heures ; diagnostic si ≥ 11,1 mmol/L sous les conditions de confirmation.</p><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-26" data-title="Société suisse de médecine légale"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>S</td><td>Schweizerische (suisse)</td></tr><tr><td>G</td><td>Gesellschaft (société)</td></tr><tr><td><button class="w" data-k="e11-gl-26">RM</button></td><td>für Rechtsmedizin (de médecine légale)</td></tr></table><p><b>Société suisse de médecine légale.</b> Sa section de médecine du trafic a cosigné la directive suisse diabète–conduite 2025 avec la SSED.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-gl-27" data-title="Essai de prévention cardiovasculaire chez le diabétique"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>A</td><td>Action to</td></tr><tr><td>C</td><td>Control</td></tr><tr><td>COR</td><td>Cardiovascular Risk</td></tr><tr><td>D</td><td>in Diabetes</td></tr></table><p><b>Essai Action to Control Cardiovascular Risk in Diabetes.</b> Essai primaire de 2008 chez 10 251 patients de type 2 à haut risque ; la stratégie ciblant HbA1c &lt; 6,0 % a augmenté la mortalité. Ce constat n’est pas généralisé à toute cible basse dans toute population.</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/18539917/" target="_blank" rel="noopener">Source du contexte E11, consultée le 11.10.2026</a>.</p></template><template data-pop="e11-rein2025" data-title="Recommandation rénale suisse 2025 : ce qui complète E11"><p>Le guide de la Société suisse de néphrologie du 17.03.2025 complète le consensus diabète–rein. Il demande créatinine et/ou cystatine C pour le <button class="w" data-k="e11-gl-16">DFG</button> estimé et rapport albumine/créatinine ; dépistage au moins annuel dans le diabète. Sa figure diagnostique retient <button class="w" data-k="e11-gl-16">DFG</button> &lt; 60 ou rapport ≥ 3 mg/mmol présents ≥ trois mois, ou autres preuves de chronicité. Une valeur isolée n’établit pas une maladie chronique.</p><p>La prévention rénale combine mode de vie, éviction des néphrotoxiques, adaptation médicamenteuse, contrôle de pression, inhibition rénine–angiotensine, SGLT2 et, selon indication, <button class="w" data-k="e11-gl-13">GLP-1</button>/finérénone. Les recommandations de classe se confrontent à la <button class="w" data-k="e11-gl-23">FI</button> du produit exact.</p><table class="t"><tr><th>Point</th><th>Guide suisse 2025 et application</th></tr><tr><td>Pression artérielle dans la maladie rénale</td><td>Cible systolique 120–129 mmHg, individualisée selon fragilité, comorbidité, hypotension orthostatique et méthode de mesure. Le guide nomme la proposition <button class="w" data-k="e11-proxy-kdigo">KDIGO</button> &lt; 120 avec mesure standardisée ; pas de cible universelle reconnue.</td></tr><tr><td>SGLT2, différence des éditions</td><td>Version française : <button class="w" data-k="e11-gl-16">DFG</button> 20–45, puis &gt; 45 avec rapport &gt; 20 ou diabète/IC ; Version allemande : 20–45, puis ≥ 45 avec ces indications. À la frontière 45, ne pas fabriquer une exclusion : indication et <button class="w" data-k="e11-gl-23">FI</button> exacte Jardiance®/Forxiga® guident la prescription.</td></tr><tr><td>Finérénone, différence des éditions</td><td>Version française : <button class="w" data-k="e11-gl-16">DFG</button> ≥ 25 ; Version allemande : &gt; 25. Les deux citent K ≤ 5 et albuminurie ≥ 3 sous blocage rénine–angiotensine maximal toléré. La <button class="w" data-k="e11-gl-23">FI</button> Kerendia® autorise initiation à <button class="w" data-k="e11-gl-16">DFG</button> 25 et distingue K ≤ 4,8, 4,8–5 avec surveillance supplémentaire, &gt; 5 ne pas initier.</td></tr><tr><td>Statines, différence des éditions</td><td>La version française met l’accent sur non-dialysé <button class="w" data-k="e11-gl-16">DFG</button> &lt; 60 ; la version allemande sur âge ≥ 50 ou 18–49 avec diabète/risque/antécédent. Ces résumés ne constituent pas une contre-indication au-dessus de 60. Appliquer la prévention diabétique et le risque réel, vérifier le produit et demander avis si discordance.</td></tr></table><p>Les deux versions proposent une alimentation à dominante végétale, sel &lt; 5 g/jour et activité 150 minutes/semaine adaptés à la capacité. Le repère protéique 0,8 g/kg/jour concerne la maladie rénale et exige une évaluation nutritionnelle ; exemple purement arithmétique : 70 kg × 0,8 = 56 g/jour. Il ne s’applique pas automatiquement à une personne fragile, dénutrie ou dialysée, ni à tous les diabétiques.</p><p>Le guide oriente au néphrologue si <button class="w" data-k="e11-gl-16">DFG</button> &lt; 30, cause inconnue, albuminurie importante persistante, hématurie glomérulaire, dégradation aiguë ou progressive, hypertension résistante, anomalie potassique persistante, hérédité ou lithiases répétées. L’anémie rénale, les troubles minéraux et l’acidose chronique nécessitent un bilan et une prise en charge rénale spécialisés ; ce résumé ne donne pas de schéma de prescription pour ces complications.</p><p class="src">Référence : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie, guide français 17.03.2025, figures 1–4</a>.</p><p class="src">Référence : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_DEUTSCH_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie, même guide allemand, divergences de formulation comparées</a>.</p></template><template data-pop="e11-technologies" data-title="Capteurs et pompes dans le type 2 : place et sécurité"><p>La recommandation technologique suisse de février 2025 reconnaît le bénéfice du capteur dans le type 2 sous injections multiples et sous insuline basale. Il rend visibles les fluctuations masquées par une moyenne et soutient l’éducation ; ce bénéfice n’impose pas un dispositif identique à chacun.</p><p>Les cibles de capteur usuelles de l’adulte hors grossesse sont présentées comme objectifs individualisables, pas comme normes biologiques.</p><table class="t"><tr><th>Mesure</th><th>Repère du texte suisse 2025</th></tr><tr><td>Temps 3,9–10,0 mmol/L</td><td>&gt; 70 %</td></tr><tr><td>Temps sous 3,9 mmol/L</td><td>&lt; 4 %</td></tr><tr><td>Temps sous 3,0 mmol/L</td><td>Limiter à environ 1–2 % ou moins selon les consensus cités ; prévention prioritaire.</td></tr><tr><td>Temps au-dessus de 10,0 mmol/L</td><td>&lt; 25 %</td></tr><tr><td>Temps au-dessus de 13,9 mmol/L</td><td>≤ 5 %</td></tr></table><p><button class="w" data-k="e11-calcul-tir">Bases et exemple du calcul</button>. Les mêmes pourcentages s’appliquent au temps enregistré valide, avec bornes et période explicitées. Grossesse et fragilité exigent d’autres objectifs ; ne pas transporter les chiffres de la grossesse au type 2 hors grossesse.</p><p>Une pompe peut se discuter si contrôle insuffisant malgré injections optimisées, contraintes d’injections ou qualité de vie ; l’aide des proches peut permettre son usage malgré certaines limitations physiques ou cognitives. Le texte cite les troubles psychiatriques ou neurocognitifs sévères comme contre-indication, mais demande une évaluation individuelle. Dispositif et réservoir dépendent des besoins d’insuline et de l’autonomie.</p><p>La formation doit apprendre alarmes, tendances, injection, repas, hypoglycémie, panne et secours ; l’équipe multidisciplinaire assure le suivi. Les réglages de pompe et facteurs de correction ne se déduisent pas d’une règle arithmétique non vérifiée. Le texte signale certaines pratiques de réglage sans protocole fondé sur preuve ; ce cours ne les présente pas comme prescriptions. Autorisation, accès, suivi spécialisé et financement par LiMA sont vérifiés séparément à la date réelle ; les montants 2025 ne sont pas certifiés actuels.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED 25.02.2025, métriques p.19–20, type 2 p.31–32, enseignement p.37–38</a>.</p></template><template data-pop="e11-gl-ngsp" data-title="Standardisation internationale de l’hémoglobine glyquée"><table class="t"><tr><th>Lettre</th><th>Développement historique</th></tr><tr><td>N</td><td>National (national)</td></tr><tr><td>G</td><td>Glycohemoglobin (hémoglobine glyquée)</td></tr><tr><td>S</td><td>Standardization (standardisation)</td></tr><tr><td>P</td><td>Program (programme)</td></tr></table><p>Le nom initial de 1996 était National Glycohemoglobin Standardization Program ; le nom officiel actuel est le sigle <button class="w" data-k="e11-gl-ngsp">NGSP</button>, devenu international. Le système rapporte l’HbA1c en pourcentage, traçable aux méthodes des essais DCCT et UKPDS et à la référence <button class="w" data-k="e11-gl-ifcc">IFCC</button>. Cette source décrit la métrologie ; elle ne fournit pas une recommandation américaine de traitement pour ce cours.</p><p><button class="w" data-k="e11-calcul-hba1c">Conversion, exemple et limites</button>.</p><p class="src">Référence : <a href="https://ngsp.org/bground.asp" target="_blank" rel="noopener">NGSP, Background, What Does NGSP Stand For?</a>.</p></template><template data-pop="e11-gl-ifcc" data-title="Référence métrologique de l’hémoglobine glyquée"><table class="t"><tr><th>Élément</th><th>Développement</th></tr><tr><td>I</td><td>International (internationale)</td></tr><tr><td>F</td><td>Federation (fédération)</td></tr><tr><td>C</td><td>of Clinical (de chimie clinique)</td></tr><tr><td>C</td><td>Chemistry (chimie)</td></tr></table><p>La fédération internationale de chimie clinique a établi une méthode de référence et un réseau de laboratoires pour l’HbA1c, exprimée ici en mmol/mol. L’équation de correspondance avec le système <button class="w" data-k="e11-gl-ngsp">NGSP</button> repose sur une calibration ; les unités ne se convertissent pas par un simple facteur dix.</p><p><button class="w" data-k="e11-calcul-hba1c">Conversion et interprétation</button>.</p><p class="src">Référence : <a href="https://ngsp.org/ifcc.asp" target="_blank" rel="noopener">NGSP, IFCC Standardization Overview</a>.</p></template><template data-pop="e11-calcul-qualite" data-title="Score suisse de patientèle : calcul sur 100 points"><p>La grille SSED 2017 évalue la qualité de suivi d’une patientèle ; elle n’est pas un score de gravité d’un patient. Chaque critère rapporte ses points si sa fréquence et sa proportion sont atteintes. Les proportions se calculent nombre de patients répondant au critère / nombre de patients concernés × 100, avec dénominateur explicitement défini.</p><table class="t"><tr><th>Critère</th><th>Condition de la grille</th><th>Points</th></tr><tr><td>Contrôles</td><td>≥ trois par an chez ≥ 80 %</td><td>10</td></tr><tr><td>Poids/activité ; tabac</td><td>Évaluation annuelle et conseils ou objectif atteint chez ≥ 80 % pour chacun</td><td>5 + 5</td></tr><tr><td>HbA1c</td><td>≥ deux dosages/an ; moyenne annuelle &lt; 9 % chez ≥ 85 %, &lt; 8 chez ≥ 60 %, &lt; 7 chez ≥ 40 %</td><td>12 + 8 + 5</td></tr><tr><td>Pression</td><td>≥ deux mesures/an, assis après cinq minutes de repos ; moyenne &lt; 140/90 chez ≥ 65 %</td><td>15</td></tr><tr><td><button class="w" data-k="e11-proxy-ldl">LDL</button> avant 75 ans</td><td>≥ un dosage/an ; moyenne &lt; 2,6 mmol/L chez ≥ 63 %</td><td>10</td></tr><tr><td>Rein</td><td>Créatinine et albuminurie annuelles chez ≥ 80 %</td><td>10</td></tr><tr><td>Yeux</td><td>Examen ophtalmologique datant de moins de deux ans chez ≥ 80 %</td><td>10</td></tr><tr><td>Pieds</td><td>Pouls avec monofilament ou vibration, annuellement chez ≥ 80 %</td><td>10</td></tr></table><p>Somme maximale : 10 + 10 + 25 + 15 + 10 + 10 + 10 + 10 = 100 ; objectif ≥ 70. Exemple fictif : 80 patients sur 100 ont au moins trois contrôles, soit 80/100 × 100 = 80 %, et ce critère apporte 10 points. Une patientèle validant tous les critères sauf pression (15 points) et yeux (10) obtient 100 − 15 − 10 = 75 points. Cela ne prouve pas que chaque patient soit correctement traité.</p><p>Les seuils de cette grille historique décrivent des indicateurs de qualité ; ils ne remplacent pas les cibles individuelles actuelles. Le dénominateur <button class="w" data-k="e11-proxy-ldl">LDL</button> concerne les moins de 75 ans, pas toute la patientèle. Un nombre de visites, un pourcentage et un nombre de points sont trois unités de raisonnement distinctes.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED, critères de bon disease management, révision août 2017</a>.</p></template><template data-pop="e11-score2-methode" data-title="Comprendre le calcul SCORE2-Diabetes"><p>Le modèle estime la probabilité d’un premier événement cardiovasculaire fatal ou non fatal (infarctus ou AVC) à dix ans. Il combine des facteurs de risque dans une équation statistique calibrée pour quatre régions européennes ; ce n’est pas la division de deux concentrations. L’<button class="w" data-k="e11-gl-14">ESC</button> le décrit pour le type 2 sans maladie athéroscléreuse avérée ni atteinte sévère d’organe, validé de 40 à 69 ans ; hors population validée, on évalue le risque individuellement.</p><p>Les données citées par l’<button class="w" data-k="e11-gl-14">ESC</button> sont réunies avant le calcul. Les unités doivent être vérifiées dans l’interface choisie ; une saisie d’HbA1c en % à la place de mmol/mol, ou de cholestérol en <button class="w" data-k="e11-unite-mgdl">mg/dL</button> à la place de mmol/L, change les données.</p><table class="t"><tr><th>Donnée</th><th>Sens / unité à vérifier</th></tr><tr><td>Âge actuel et âge au diagnostic</td><td>Années ; ils ne représentent pas la même information</td></tr><tr><td>Tabagisme</td><td>Statut actuel selon l’outil, sans unité</td></tr><tr><td>Pression systolique</td><td>mmHg, mesure clinique interprétée</td></tr><tr><td>Cholestérol total et HDL</td><td>Concentrations, mmol/L ou <button class="w" data-k="e11-unite-mgdl">mg/dL</button> selon l’interface ; pas le rapport <button class="w" data-k="e11-proxy-ldl">LDL</button>/HDL</td></tr><tr><td>HbA1c</td><td>% ou mmol/mol standardisés ; conversion disponible ci-dessous</td></tr><tr><td><button class="w" data-k="e11-gl-16">DFG</button> estimé</td><td>mL/min/1,73 m² ; pas créatinine isolée</td></tr><tr><td>Région de calibration</td><td>Choix approprié du modèle européen, distinct de la catégorie obtenue</td></tr></table><p><b>Étapes.</b> Vérifier d’abord que la population est appropriée ; réunir les données contemporaines ; utiliser l’algorithme SCORE2-Diabetes de l’application de calcul du risque cardiovasculaire de l’<button class="w" data-k="e11-gl-14">ESC</button> citée dans la recommandation ; vérifier chaque unité et le pays/région ; lire le pourcentage à dix ans ; appliquer ensuite la grille de risque et discuter la prévention avec le patient. Les coefficients ne sont pas reconstruits de mémoire dans ce cours.</p><p><b>Exemple pédagogique fictif d’interprétation.</b> Si l’outil validé affiche 12 %, le résultat signifie environ 12 premiers événements sur 100 personnes comparables à dix ans selon ce modèle ; 12 se situe entre 10 et 20 %, donc dans la catégorie élevée. Ce chiffre est supposé pour enseigner l’interprétation : il n’est pas présenté comme le calcul réel d’un dossier ni comme la prédiction certaine pour une personne.</p><p><b>Limites.</b> Le modèle et sa calibration ne remplacent ni la recherche d’atteinte d’organe ni le jugement clinique. Une maladie athéroscléreuse ou une atteinte sévère impose déjà un très haut risque ; les frontières servent aux décisions partagées. Les références de laboratoire, seuils diagnostiques et cibles ne sont pas les entrées normalisées du modèle.</p><p><button class="w" data-k="e11-calcul-hba1c">Conversion métrologique HbA1c</button> ; <button class="w" data-k="e11-gl-16">DFG</button> ; <button class="w" data-k="e11-score2d">Grille et conséquences de risque</button>.</p><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, sections4.1.1–4.1.2, tableaux7 et figure3</a>.</p></template><template data-pop="e11-unite-mgdl" data-title="Milligrammes par décilitre : conversion selon la substance"><p>Une concentration en milligrammes par décilitre exprime une <b>masse dans un volume</b>. Une concentration en millimoles par litre exprime une <b>quantité de molécules dans un volume</b>. La même masse ne représente pas le même nombre de molécules pour le glucose, l’urée ou le cholestérol : leur masse molaire diffère.</p><p>Les préfixes du Système international d’unités signifient : milli = un millième et déci = un dixième. Un décilitre est donc 0,1 litre, soit 100 millilitres. À concentration identique, multiplier par dix passe des milligrammes par décilitre aux milligrammes par litre ; cette première conversion dépend seulement du volume.</p><p>Pour passer ensuite à des millimoles par litre, il faut connaître <b>la masse molaire de la substance précise</b>. La valeur numérique d’une masse molaire en grammes par mole est la même en milligrammes par millimole. Le nombre de millimoles s’obtient en divisant la masse en milligrammes par la masse d’une millimole.</p><table class="t"><tr><th>Étape</th><th>Calcul et unités</th></tr><tr><td>Masse par litre</td><td>10 × concentration en milligrammes par décilitre = concentration en milligrammes par litre</td></tr><tr><td>Quantité de matière par litre</td><td>Concentration en milligrammes par litre ÷ masse molaire en milligrammes par millimole = concentration en millimoles par litre</td></tr><tr><td>Conversion inverse</td><td>Concentration en millimoles par litre × masse molaire en milligrammes par millimole ÷ 10 = concentration en milligrammes par décilitre</td></tr></table><p><b>Exemple fictif de substance.</b> Supposons une substance de masse molaire 100 grammes par mole et une concentration de 20 milligrammes par décilitre. Étape 1 : 20 × 10 = 200 milligrammes par litre. Étape 2 : 200 ÷ 100 = 2 millimoles par litre. Contrôle inverse : 2 × 100 ÷ 10 = 20 milligrammes par décilitre. Le nombre 100 est choisi pour ce calcul pédagogique ; il n’est pas attribué au glucose ni au cholestérol.</p><p>Les correspondances cliniques arrondies ci-dessous sont celles des primaires citées. Elles enseignent que la conversion dépend de la substance ; elles ne fournissent pas une nouvelle cible et ne permettent pas de déduire un coefficient exact de deux seuils déjà arrondis.</p><table class="t"><tr><th>Substance / contexte</th><th>Correspondance publiée</th><th>Portée</th></tr><tr><td>Glucose, consensus des crises 2024</td><td>250 milligrammes par décilitre ≈ 13,9 millimoles par litre</td><td>Repère cité dans le traitement de l’acidocétose ; cette équivalence n’est pas une valeur normale</td></tr><tr><td>Cholestérol <button class="w" data-k="e11-proxy-ldl">LDL</button>, recommandations européennes 2023</td><td>100 milligrammes par décilitre ≈ 2,6 millimoles par litre</td><td>Correspondance de la cible du risque modéré, pas une conversion applicable au glucose</td></tr></table><p><b>Limites.</b> Vérifier la substance, le prélèvement, l’unité affichée et le facteur validé du laboratoire ou de l’outil avant toute saisie. Il faut convertir chaque substance séparément avant une somme osmolaire ; ne pas utiliser un coefficient du glucose pour le sodium, l’urée ou le cholestérol. Les formules d’osmolalité de ce cours exigent des concentrations en millimoles par litre. L’HbA1c demande sa conversion métrologique propre, et non cette conversion masse–quantité.</p><p><button class="w" data-k="e11-osmolalite">Formules et limites d’osmolalité</button> ; <button class="w" data-k="e11-calcul-hba1c">Conversion spécifique de l’HbA1c</button>.</p><p class="src">Références : <a href="https://www.bipm.org/documents/20126/41483022/SI-Brochure-9.pdf" target="_blank" rel="noopener">Bureau international des poids et mesures, brochure du Système international, 9e édition, V4.01 juin2026, chapitres2.3.3 et3, tableaux7 et8</a> ; <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus international des crises 2024, traitement liquidien</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">Recommandations européennes 2023, synthèse des cibles lipidiques</a>.</p></template><template data-pop="e11-proxy-znt8" data-title="Transporteur du zinc et auto-anticorps"><table class="t"><tr><th>Élément</th><th>Développement lexical</th></tr><tr><td>Zn</td><td>Zinc</td></tr><tr><td>T</td><td>Transporteur</td></tr><tr><td>8</td><td>de type 8</td></tr></table><p><b>Transporteur du zinc de type 8.</b> Le terme est expliqué ici dans le contexte du diabète ; les décisions, populations, chiffres et limites sont développés dans la fenêtre ci-dessous.</p><p><button class="w" data-k="e11-cpeptide">Définition clinique, bases, décisions et sources applicables</button>.</p><p class="src">Référence clinique du contexte : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&vol_id=4162&id=41558" target="_blank" rel="noopener">Marx et al. — ESC2023 d
