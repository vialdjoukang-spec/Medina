<template data-pop="e11-cibles" data-title="Cibles glycémiques : quatre textes comparés"><p>Les textes convergent autour de 7 %, avec des nuances.</p><table class="t"><tr><th>Source</th><th>Cible générale</th><th>Cible stricte</th><th>Cible souple</th></tr><tr><td>SSED 2023</td><td>7,0 %</td><td>6,5 % : sujet jeune, diabète récent, sans hypoglycémie</td><td>7 à 8 % selon la situation ; éviter l’hyperglycémie symptomatique</td></tr><tr><td>ESC 2023</td><td>&lt; 7 % (classe I)</td><td>Personnalisée</td><td>Personnalisée</td></tr><tr><td>ADA/EASD 2026</td><td>6,5 à 7 % (48 à 53 mmol/mol)</td><td>≤ 6,5 % sans médicament hypoglycémiant ou si début avant 40 ans</td><td>Fragilité, espérance de vie limitée</td></tr></table><p>Le temps passé entre 3,9 et 10 mmol/L doit dépasser 70 % chez le patient équipé d’un capteur. Une cible stricte exige un bénéfice supérieur au risque, notamment hypoglycémique. Dans ACCORD, chez 10 251 patients à haut risque cardiovasculaire, une stratégie visant moins de 6,0 % a augmenté la mortalité ; ce résultat ne doit pas être attribué à une molécule isolée ni transposé à toute cible basse.</p><div class="key"><b>Arbitrage.</b> Le texte suisse en vigueur est la SSED 2023 ; la source primaire la plus récente, le consensus ADA/EASD 2026, complète les cibles individualisées ; la fragilité et une espérance de vie limitée autorisent un objectif plus souple. En fin de vie, le confort et la prévention des hypoglycémies priment.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023 (texte en vigueur)</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18539917/" target="_blank" rel="noopener">ACCORD 2008</a>.</p></template>
<template data-pop="e11-mode-de-vie" data-title="Mode de vie : alimentation, activité, tabac"><p>Aucune répartition unique des glucides, protéines et lipides n’est optimale ; l’alimentation se personnalise et doit rester durable. Le régime méditerranéen améliore la glycémie et le risque cardiovasculaire, même sans perte de poids importante, et se privilégie en cas de maladie athéroscléreuse. Une perte de 5 % du poids apporte déjà un bénéfice métabolique ; une intervention intensive vise 10 % ou plus et peut conduire à la rémission. Les compléments alimentaires ne sont pas recommandés (ADA/EASD 2026).</p><div class="key"><b>Activité et tabac.</b> Le consensus conjoint ADA/EASD 2026 propose 150 minutes d’activité aérobie par semaine, réparties sur au moins trois jours, et deux à trois séances de renforcement, adaptées aux capacités. L’ESC recommande un programme d’exercice structuré adapté aux comorbidités et un accompagnement de l’arrêt du tabac, avec prise en charge adaptée au patient.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023</a>.</p></template>
<template data-pop="e11-steno2" data-title="Essai Steno-2 : le traitement multifactoriel"><p>Cent soixante diabétiques de type 2 avec microalbuminurie ont reçu pendant 7,8 ans un traitement intensif de la glycémie, de la pression artérielle et des lipides, avec bloqueur du système rénine-angiotensine et aspirine, ou un traitement conventionnel. Après 13,3 ans, 24 patients du groupe intensif étaient décédés contre 40 (rapport de risque 0,54) ; les événements cardiovasculaires étaient réduits de 59 %.</p><div class="key"><b>Conséquence.</b> Traiter ensemble tous les facteurs de risque sauve des vies ; la glycémie n’en est qu’un.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/18256393/" target="_blank" rel="noopener">Gaede et al., Steno-2, 2008</a>.</p></template>
<template data-pop="e11-ta" data-title="Pression artérielle du diabétique"><p>L’ESC 2023 traite toute pression ≥ 140/90 mmHg et vise une systolique de 130 mmHg, ou moins si elle est tolérée, sans descendre sous 120 ; après 65 ans, de 130 à 139 mmHg. La SSED 2023 retient 130/70 à 79 mmHg et la même cible après 65 ans. Le consensus conjoint ADA/EASD 2026 vise &lt; 130/80, voire &lt; 120 mmHg de systolique à haut risque.</p><div class="key"><b>Médicaments.</b> La SSED associe tôt un inhibiteur de l’enzyme de conversion et un antagoniste calcique ; un antagoniste des récepteurs de l’angiotensine II remplace l’inhibiteur s’il est mal toléré. La recommandation suisse 2024 sur la néphropathie place un bloqueur du système rénine–angiotensine dans le traitement de l’hypertension albuminurique, avec contrôle de la créatinine et du potassium ; une baisse importante du DFG ou une hyperkaliémie exige une réévaluation. L’association des deux bloqueurs est déconseillée (ESC). Arbitrage : la cible suisse en vigueur est celle de la SSED, alignée sur l’ESC.</div><p class="src">Références : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023 (texte en vigueur)</a>.</p></template>
<template data-pop="e11-ldl" data-title="Cholestérol LDL : cibles selon le risque"><p>L’ESC 2023 fixe le cholestérol LDL sous 1,4 mmol/L à risque très élevé, sous 1,8 mmol/L à risque élevé et sous 2,6 mmol/L à risque modéré (classe I). La SSED commence par une statine puissante, à intensité adaptée au risque, ajoute l’ézétimibe puis, si nécessaire, un inhibiteur de la PCSK9.</p><div class="key"><b>Nuances.</b> Chez le sujet âgé, le bénéfice, la fragilité et les préférences guident la décision. En dialyse, la statine n’est pas instaurée (SSED et Société suisse de néphrologie).</div><p class="src">Références : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, figure 10</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p><p><b>Produit complémentaire.</b> Ezetrol® (ézétimibe, FI mars 2024) se prend par voie orale à 10 mg une fois par jour, indépendamment des repas. Aucune adaptation rénale ou hépatique légère n’est requise ; il n’est pas recommandé en insuffisance hépatique modérée/sévère. L’hypersensibilité est une contre-indication. Avec une statine, grossesse/allaitement et maladie hépatique active sont des contre-indications ; la monothérapie demande une prudence particulière pendant grossesse/allaitement. Le médecin contrôle le foie selon la statine associée et recherche une myopathie devant douleurs/faiblesse. La FI ne permet pas de déduire la dose ni les restrictions de la statine elle-même.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680561950025" target="_blank" rel="noopener">Information professionnelle suisse Ezetrol® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-contentieux-algo" data-title="Contentieux : la place de la metformine"><p><b>SSED 2023.</b> L’algorithme suisse propose metformine et inhibiteur du SGLT2 ou agoniste du GLP-1 dès l’étape initiale, puis leur trithérapie avant l’insuline si la sécrétion est suffisante. Il recommande d’abord l’insuline en cas de carence.</p><p><b>Consensus conjoint ADA/EASD 2026.</b> La protection d’organe guide d’emblée le choix chez le patient avec maladie cardiovasculaire, rénale ou insuffisance cardiaque, avec ou sans metformine. L’indépendance vis-à-vis de la metformine vient notamment d’analyses de sous-groupes ; elle ne prouve pas que tous les produits sont interchangeables.</p><div class="key"><b>Arbitrage suisse.</b> L’algorithme SSED 2023 reste le document suisse spécialisé recensé pour le traitement général. Le consensus européen co-signé de 2026 complète les nouveautés : prescrire la classe dont le bénéfice est démontré pour l’organe et le produit autorisé, sans attendre une HbA1c au-dessus de la cible ; ajouter ou garder la metformine si elle est adaptée et tolérée. L’autorisation Swissmedic et la Liste des spécialités répondent respectivement à l’utilisation du produit et à son financement ; une recommandation clinique ne garantit pas le remboursement.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, algorithme</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, choix et protection d’organe</a>.</p></template>
<template data-pop="e11-insuline-debut" data-title="Débuter l’insuline"><p>L’insuline se discute d’emblée lors d’un déficit insulinique, d’un amaigrissement, d’une hyperglycémie majeure ou d’une suspicion de type 1. Une cétose impose d’abord de rechercher une acidocétose ; une basale ambulatoire ne suffit pas à traiter une urgence métabolique.</p><p>Chez l’adulte de type 2 stable, la FI suisse propose <b>Tresiba® 10 unités sous-cutanées une fois par jour</b>, puis ajustement individuel sur la glycémie à jeun. Pour <b>Toujeo® 300 U/mL</b>, la dose de début est <b>0,2 unité/kg sous-cutanée une fois par jour</b>, avec ajustements espacés de <b>3 à 4 jours</b>. Il n’existe pas de titration unique valable pour toutes les basales : la cible et le rythme doivent tenir compte des hypoglycémies, du DFG et de l’alimentation.</p><div class="key"><b>Choix et suivi.</b> La SSED privilégie les analogues basaux ultralents pour réduire le risque hypoglycémique. La recommandation suisse sur les retraits d’insuline, état août 2025, organise les alternatives ; elle ne dispense pas de vérifier la disponibilité actuelle. Une glycémie à jeun déjà à la cible avec HbA1c élevée fait chercher les excursions postprandiales plutôt que d’augmenter indéfiniment la basale. Enseigner la technique, la surveillance, la conduite et le traitement de l’hypoglycémie ; réévaluer les sécrétagogues.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, insulinothérapie</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED, alternatives aux insulines, état août 2025</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Information professionnelle suisse Tresiba® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680654530011" target="_blank" rel="noopener">Information professionnelle suisse Toujeo SoloStar® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-insuline-escalade" data-title="Intensifier l’insuline"><p>Après optimisation de la basale, vérifier les glycémies postprandiales, l’observance et la technique. La SSED 2023 propose notamment la coformulation Ryzodeg® (70 % dégludec, 30 % asparte) ou le schéma basal–bolus. Le choix dépend de la régularité des repas, des capacités de surveillance et du risque d’hypoglycémie.</p><p>La FI de Ryzodeg® indique une administration sous-cutanée une ou deux fois par jour au moment des repas principaux ; sa dose initiale totale chez l’adulte de type 2 est de 10 unités par jour, puis adaptation individuelle. Dans le schéma basal–bolus, la dose et le nombre des bolus prandiaux s’adaptent aux repas. NovoRapid® est une insuline rapide sous-cutanée généralement donnée immédiatement avant le repas ; sa dose n’est pas un forfait universel.</p><div class="key"><b>Sécurité.</b> Un capteur, une formation pratique et un plan de secours limitent les risques. Les préparations ne sont pas interchangeables sans surveillance ; les insulines basales et Ryzodeg® ne s’utilisent pas par voie intraveineuse. La coformulation est moins flexible lorsque les besoins basaux et prandiaux évoluent différemment.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, intensification</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED 2025, technologies</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680626270013" target="_blank" rel="noopener">Information professionnelle suisse Ryzodeg® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Information professionnelle suisse NovoRapid® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-su" data-title="Contentieux : les sulfonylurées"><p>La SSED ne recommande plus les sulfonylurées en raison des hypoglycémies, de la prise de poids et d’une mortalité observationnelle plus élevée que les traitements modernes ; seul le gliclazide, de demi-vie courte et sans métabolite actif, reste admis dans des cas choisis, comme les MODY 1 et 3. Le consensus ADA/EASD 2026 souligne au contraire leur efficacité, leur faible coût et l’absence de surmortalité dans les revues systématiques, tout en rappelant leur effet peu durable.</p><div class="key"><b>Arbitrage.</b> Le consensus le plus récent ne contredit pas la SSED sur le risque d’hypoglycémie ; en contexte suisse, le texte en vigueur de la SSED s’applique : gliclazide seulement, à titre exceptionnel, éviter l’association à l’insuline autant que possible ; la FI de Diamicron® permet certains traitements combinés sous surveillance, il ne s’agit donc pas d’une contre-indication formelle.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023 (texte en vigueur)</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-bariatrique" data-title="Chirurgie métabolique"><p>La SSED la juge efficace dans le diabète difficile à équilibrer avec une HbA1c supérieure à 8 % et un IMC supérieur à 30 kg/m². L’ESC la propose aux patients à risque élevé ou très élevé dont l’IMC atteint 35 kg/m² quand le mode de vie et les médicaments ont échoué. Le consensus conjoint ADA/EASD 2026 propose de la considérer dès 30 kg/m² et demande de l’envisager à partir de 35 ; il ne prescrit pas une intervention automatique. La sélection relève d’une évaluation spécialisée.</p><div class="key"><b>Données.</b> Dans l’étude ARMMS-T2D, 37,5 % de rémissions à trois ans après chirurgie contre 2,6 % sous traitement médical, et 18 % contre 6 % à sept ans ; anémie, fractures et troubles digestifs sont plus fréquents après chirurgie.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-qualite" data-title="Critères de qualité de la SSED"><p>La SSED évalue la prise en charge d’une patientèle diabétique sur 100 points : au moins trois visites par an chez 80 % des patients ; conseils sur le poids et le tabac ; HbA1c mesurée au moins deux fois par an, inférieure à 9 % chez 85 %, à 8 % chez 60 % et à 7 % chez 40 % des patients ; pression inférieure à 140/90 mmHg chez 65 % ; LDL inférieur à 2,6 mmol/L chez 63 % des moins de 75 ans ; créatinine et albuminurie, fond d’œil tous les deux ans et examen des pieds chez 80 %.</p><div class="key"><b>Objectif.</b> Atteindre au moins 70 points ; un mauvais respect de ces standards s’associe à davantage d’hospitalisations.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, tableau 2</a>.</p></template>
<template data-pop="e11-sick-days" data-title="Règles des jours de maladie"><p>Fièvre, diarrhée, vomissements ou impossibilité de manger rendent certains médicaments dangereux. La SSED les résume ainsi : la <b>metformine</b> s’interrompt en cas de déshydratation, d’insuffisance rénale aiguë ou d’hypoxémie ; l’<b>inhibiteur du SGLT2</b> en cas de déshydratation ou de jeûne prolongé ; le <b>gliclazide</b> en cas de jeûne ou d’insuffisance rénale aiguë ; l’<b>insuline</b> se réévalue selon la glycémie et les repas ; ne jamais interrompre toute insuline chez un patient insulinodéficient sans encadrement médical.</p><div class="key"><b>Mise en pratique.</b> La SSED fournit une carte de poche des règles des jours de maladie, à remettre au patient avec explication.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, tableau 3</a>.</p></template>
<template data-pop="e11-age" data-title="Le diabétique âgé"><p>Le sujet âgé cumule fragilité, troubles cognitifs, chutes, polymédication et dénutrition, même s’il est obèse. Les classes protectrices gardent leur intérêt : les inhibiteurs du SGLT2 préviennent l’insuffisance cardiaque, fréquente après 65 ans, mais augmentent la nycturie de l’homme porteur d’une hypertrophie prostatique. Chez le patient dénutri, l’agoniste du GLP-1 aggrave l’inappétence ; la linagliptine, sans adaptation rénale, convient mieux. La metformine est arrêtée sous 30 ; entre 30 et 59 mL/min/1,73 m², la FI Glucophage® impose au plus 1000 mg par jour, indépendamment de la présence de nausées.</p><div class="key"><b>Cibles.</b> Sans insuline ni sulfonylurée : HbA1c 6,5 à 7,0 % de 65 à 80 ans, inférieure à 7,5 à 8,0 % au-delà ; sous ces médicaments, la prévention des hypoglycémies prime, avec cible individualisée (SSED 2023 et consensus 2026). Le bénéfice attendu, la tolérance, la sécurité et l’espérance de vie guident le choix et peuvent conduire à simplifier le traitement (ADA/EASD 2026).</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-grossesse" data-title="Grossesse, allaitement et contraception"><p>Le sémaglutide ne doit pas être utilisé pendant la grossesse ni l’allaitement, et une contraception est recommandée pendant le traitement. Le tirzépatide réduit l’exposition aux contraceptifs oraux : la patiente passe à une méthode non orale ou ajoute une méthode barrière pendant quatre semaines après le début et après chaque palier. La metformine peut être envisagée pendant la grossesse si elle est cliniquement indiquée, avec une surveillance de la croissance fœtale.</p><div class="key"><b>Conduite.</b> La grossesse exige une prise en charge spécialisée et un choix de produit conforme à sa FI ; la SSED liste les insulines testées chez la femme enceinte et rappelle dans sa directive de conduite 2025, dès la vingtième semaine, une cible à jeun inférieure à 5,3 mmol/L et une cible de 8,0 mmol/L une heure après le repas. Le consensus ADA/EASD 2026 exige un conseil contraceptif explicite avant toute classe non autorisée pendant la grossesse.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Ozempic®, Mounjaro® et Glucophage®</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED, document d’alternatives aux insulines, état août 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED 2026</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED–SGRM 2025, grossesse et aptitude à la conduite</a>.</p></template>
<template data-pop="e11-conduite" data-title="Diabète et conduite automobile en Suisse"><p>La directive suisse SSED–SGRM 2025 classe le risque hypoglycémique iatrogène selon le traitement et les antécédents. Sans insuline ni sulfonylurée/glinide, les classes metformine, GLP-1/GIP, DPP-4 et SGLT2 sont dans la catégorie sans risque médicamenteux significatif pour cette grille. Les basales ultralentes et le gliclazide/glinides relèvent du risque faible ; glargine 100, Ryzodeg® et basal–bolus avec capteur du risque moyen ; basal–bolus sans capteur et sulfonylurées prolongées du risque élevé. Une hypoglycémie sévère dans l’année ou une mauvaise perception des hypoglycémies donne un risque très élevé.</p><p><b>Groupe médical 1.</b> L’HbA1c &gt; 10 % et les complications affectant la conduite compromettent l’aptitude. Sous traitement à risque moyen sans capteur, mesurer avant le trajet et au moins toutes les deux heures pendant un long trajet. Sous 4 mmol/L : arrêter, prendre des glucides rapides et attendre au moins 45 minutes avant de repartir ; entre 4 et 5, prendre 10 à 20 g de glucides. Sous risque élevé sans capteur, la glycémie doit être ≥ 5 mmol/L. Les règles précises varient avec le capteur et la catégorie de risque.</p><p><b>Groupe médical 2 : conduite professionnelle.</b> Les catégories C/C1, transport professionnel de personnes et D/D1 ont des exigences plus strictes : pas d’aptitude si HbA1c &gt; 8,5 %, évaluation spécialisée et de médecine du trafic selon la situation. Sous traitement exposant à l’hypoglycémie, D/D1 sont en principe exclus ; une dérogation est examinée par un médecin de niveau 4 sous conditions strictes.</p><div class="key"><b>Application.</b> Vérifier le permis exact, les hypoglycémies, les complications visuelles/neurologiques et l’usage du capteur. Le médecin doit expliquer les règles ; il a le droit, sans obligation générale, de signaler à l’autorité cantonale une aptitude douteuse. L’absence de médicament hypoglycémiant ne garantit pas à elle seule l’aptitude professionnelle.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, édition août 2025, sections 8 à 10 et tableaux 1 à 3</a>.</p></template>
<template data-pop="e11-perop" data-title="Chirurgie, endoscopie et produits de contraste"><p>La metformine s’arrête 48 heures avant une intervention sous anesthésie générale ou locorégionale et reprend au plus tôt 48 heures après, si le patient mange et que la fonction rénale est stable ; elle s’arrête aussi 48 heures avant un produit de contraste iodé si le DFG est inférieur à 60. Les agonistes du GLP-1 retardent la vidange gastrique : des inhalations sous anesthésie ont été rapportées malgré un jeûne correct. L’insuline basale ne s’arrête pas ; la glargine se réduit à 75 à 80 % la veille, et les insulines ultralentes s’adaptent 2 à 4 jours avant (SSED 2026).</p><div class="key"><b>Contentieux.</b> La SSED suspend l’inhibiteur du SGLT2 deux jours avant une chirurgie ou une endoscopie ; l’information professionnelle de l’empagliflozine demande au moins trois jours avant une chirurgie majeure. Pour un médicament donné, l’information professionnelle suisse fait foi.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles Glucophage®, Jardiance® et Ozempic® (texte en vigueur)</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED 2026</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680553460037" target="_blank" rel="noopener">Information professionnelle suisse Lantus® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680654530011" target="_blank" rel="noopener">Information professionnelle suisse Toujeo SoloStar® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Information professionnelle suisse Tresiba® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-cortico" data-title="Glucocorticoïdes et hôpital"><p>Sous glucocorticoïdes, la SSED contrôle la glycémie après le repas de midi ou deux heures après un repas, au moins une fois par jour chez le diabétique hospitalisé. Au-delà de 10 mmol/L deux fois en 24 heures, le traitement s’adapte ou l’insuline débute. La SSED propose une dose initiale d’insuline basale sous-cutanée par jour, proportionnée à l’équivalent prednisone : 0,1 unité/kg/jour pour 10 mg/jour, 0,2 pour 20, 0,3 pour 30, 0,4 pour 40 mg/jour ou plus ; ce repère hospitalier exige une adaptation au produit, aux glycémies et à la diminution du glucocorticoïde.</p><div class="key"><b>Hôpital.</b> Cible de 5,6 à 10,0 mmol/L hors soins intensifs, de 7,8 à 10 mmol/L sous insuline intraveineuse en soins intensifs ; l’insuline de correction seule n’est pas recommandée.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED, retrait de plusieurs insulines et alternatives, état août 2025</a>.</p></template>
<template data-pop="e11-d-metformine" data-title="Metformine (Glucophage® et génériques)"><p><b>Produit exact.</b> Glucophage® comprimés 500, 850 ou 1000 mg ; FI suisse, octobre 2025. La metformine réduit surtout la production hépatique de glucose ; une partie de ses effets passe par l’AMPK. Elle n’est pas un sécrétagogue.</p><p><b>Voie, fréquence et progression.</b> Par voie orale, pendant ou après les repas : début 500 à 1000 mg par jour, puis +500 mg tous les cinq à sept jours selon la tolérance. L’entretien est habituellement de 1500 à 2000 mg par jour, en deux ou trois prises ; maximum 3000 mg par jour à fonction rénale adaptée.</p><p><b>Rein et foie.</b> Entre 30 et 59 mL/min/1,73 m² de DFG : début 500 ou 850 mg par jour, maximum 1000 mg par jour répartis en deux prises. Contre-indication sous 30. Contrôle rénal au moins annuel, tous les trois à six mois entre 45 et 59, et au moins trimestriel entre 30 et 44. L’insuffisance hépatique, l’alcoolisme ou l’intoxication alcoolique aiguë, l’acidose métabolique, les états exposant à une insuffisance rénale aiguë et les maladies aiguës provoquant une hypoxie sont des contre-indications.</p><p><b>Interruptions et surveillance.</b> Suspendre lors de déshydratation, d’insuffisance rénale aiguë ou d’hypoxie. Arrêt 48 heures avant chirurgie sous anesthésie générale/locorégionale ; reprise au moins 48 heures après, lorsque l’alimentation et la fonction rénale sont satisfaisantes. Avant contraste iodé intravasculaire, interruption 48 heures avant si le DFG est &lt; 60 ; reprise après contrôle rénal au moins 48 heures après. Troubles digestifs fréquents, déficit en B12 au long cours ; l’acidose lactique impose une prise en charge urgente. Les AINS, diurétiques et autres médicaments altérant le rein augmentent indirectement ce risque.</p><p><b>Grossesse et allaitement.</b> La FI permet de considérer la metformine si elle est cliniquement nécessaire pendant la grossesse, avec surveillance de la croissance fœtale ; cela n’en fait pas un choix automatique. Pour l’allaitement, mettre en balance son bénéfice et celui du traitement avec le médecin.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-d-isglt2" data-title="Inhibiteurs du SGLT2 (empagliflozine, dapagliflozine)"><p><b>Mécanisme.</b> Les inhibiteurs du SGLT2 réduisent la réabsorption rénale du glucose et du sodium ; leur effet glycémique dépend de la filtration. La protection cardio-rénale se démontre pour un produit et une population, sans être attribuée automatiquement à toute molécule de la classe.</p><table class="t"><tr><th>Produit et FI</th><th>Voie orale, dose, rein et foie</th></tr><tr><td>Jardiance® : empagliflozine, juillet 2025</td><td>10 mg une fois par jour, maximum 25 mg pour renforcer le contrôle glycémique. Insuffisance cardiaque ou néphropathie : 10 mg par jour. Ne pas initier si DFG &lt; 20 ; effet glycémique réduit sous 45 et probablement absent sous 30. Insuffisance hépatique sévère : non recommandé, données limitées.</td></tr><tr><td>Forxiga® : dapagliflozine, août 2026</td><td>Diabète et DFG ≥ 60 : 5 mg une fois par jour, puis 10 mg si besoin ; DFG 45 à &lt; 60 : 10 mg d’emblée. Pour le contrôle glycémique, non recommandé sous 45. Insuffisance cardiaque ou néphropathie : 10 mg par jour. Ne pas initier la néphropathie sous 25 ; si le DFG baisse ensuite sous 25, poursuivre 10 mg, puis arrêter avant dialyse/transplantation. Insuffisance hépatique sévère : début 5 mg, augmentation à 10 si tolérée ; pas d’adaptation dans les formes légères/modérées.</td></tr></table><p><b>Contre-indications et précautions.</b> Hypersensibilité ; vérifier aussi les intolérances héréditaires aux excipients décrites par la FI. Risques de mycose génitale, déplétion volémique et aggravation d’une déshydratation, surtout chez le sujet âgé ou sous diurétique. En cas de douleur périnéale avec fièvre ou malaise, rechercher une gangrène de Fournier et arrêter le produit. Nausées, dyspnée ou douleur abdominale font rechercher une acidocétose même avec glycémie peu élevée. Contrôler le rein et la volémie ; réduire éventuellement l’insuline ou le sécrétagogue associé.</p><div class="alert"><b>Maladie, jeûne et chirurgie.</b> Suspendre lors de jeûne prolongé, maladie aiguë avec déshydratation ou suspicion d’acidocétose. Jardiance® et Forxiga® : interruption au moins trois jours avant chirurgie majeure ou acte avec jeûne prolongé, selon leurs FI. Reprendre lorsque l’état clinique est stable et l’alimentation rétablie. La recommandation SSED 2023, plus ancienne, mentionne deux jours : pour ces produits, appliquer l’intervalle de leur FI suisse.</div><p><b>Grossesse/allaitement.</b> Jardiance® n’est pas utilisé pendant la grossesse sauf nécessité absolue ; interrompre l’allaitement sous traitement. Forxiga® est arrêté dès constatation d’une grossesse et n’est pas utilisé pendant l’allaitement.</p><p><b>Donnée clinique.</b> EMPA-REG OUTCOME a inclus 7020 patients avec type 2 à haut risque cardiovasculaire : événements majeurs 10,5 % contre 12,1 %, mortalité cardiovasculaire 3,7 % contre 5,9 % sur une observation médiane de 3,1 ans. Il n’y avait pas de différence significative isolée pour infarctus ou AVC ; ces résultats ne constituent pas un traitement d’un événement cérébral aigu.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680632270014" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26378978/" target="_blank" rel="noopener">EMPA-REG OUTCOME 2015, résumé consulté</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-d-aglp1" data-title="Agonistes du récepteur du GLP-1 (sémaglutide, dulaglutide)"><p><b>Mécanisme.</b> Les agonistes du GLP-1 augmentent la sécrétion d’insuline et freinent le glucagon selon la glycémie ; ils réduisent l’appétit et ralentissent la vidange gastrique. Leurs indications, doses et résultats d’essais sont propres à chaque produit.</p><table class="t"><tr><th>Produit exact</th><th>Administration adulte et dose maximale</th></tr><tr><td>Ozempic® : sémaglutide, FI juillet 2026</td><td>Sous-cutané, abdomen/cuisse/bras, une fois par semaine : 0,25 mg pendant quatre semaines, puis 0,5 mg ; après au moins quatre semaines à chaque palier, 1 mg puis 2 mg si nécessaire. Maximum 2 mg/semaine. Pour la néphropathie diabétique, entretien 1 mg/semaine. Pas de voie IV ou IM.</td></tr><tr><td>Rybelsus® N : sémaglutide oral, FI août 2026</td><td>1,5 mg une fois par jour pendant un mois, puis 4 mg ; après au moins un mois, 9 mg si nécessaire. Maximum 9 mg/jour. Avaler entier à jeun avec au plus 120 mL d’eau ; attendre au moins 30 minutes avant aliment, boisson ou autre médicament oral. Les doses N 1,5/4/9 mg correspondent à l’exposition des anciennes 3/7/14 mg ; elles ne se substituent pas milligramme pour milligramme.</td></tr><tr><td>Trulicity® : dulaglutide, FI juillet 2026</td><td>Sous-cutané une fois par semaine : début 0,75 mg ; 1,5 mg si nécessaire, puis 3 et 4,5 mg après au moins quatre semaines à chaque palier. Maximum adulte 4,5 mg/semaine. Pas de voie IV ou IM.</td></tr></table><p><b>Rein et foie.</b> Aucune adaptation de dose pour ces trois produits ; cela ne s’étend pas à tous les agonistes du GLP-1. L’expérience du dulaglutide est limitée sous 15 mL/min/1,73 m². Les vomissements et diarrhées peuvent provoquer une insuffisance rénale par déshydratation malgré l’absence d’adaptation pharmacocinétique.</p><p><b>Contre-indication et alertes.</b> Hypersensibilité au produit. Pancréatite suspectée : arrêt et évaluation ; pancréatite confirmée : ne pas réintroduire. Éviter les formes sévères de gastroparésie selon le produit ; informer l’anesthésiste avant une procédure en raison du risque d’aspiration. Réduire si nécessaire l’insuline/sulfonylurée associée. La rétinopathie préexistante exige une surveillance ; sous Ozempic®, une baisse visuelle soudaine fait aussi rechercher une neuropathie optique ischémique.</p><div class="key"><b>Tension entre consensus et FI suisse.</b> Le consensus conjoint 2026 qualifie d’interdiction l’antécédent de cancer médullaire thyroïdien ou de néoplasie endocrinienne multiple de type 2. Les FI suisses d’Ozempic® et de Mounjaro® décrivent un manque de données et une appréciation approfondie du bénéfice–risque. Enseigner cette prudence spécialisée plutôt que la transformer silencieusement en contre-indication suisse formelle.</div><p><b>Grossesse/allaitement.</b> Ne pas utiliser le sémaglutide pendant grossesse ou allaitement ; arrêt au moins deux mois avant projet de grossesse, contraception pendant le traitement. Le dulaglutide n’est pas recommandé pendant la grossesse et n’est pas utilisé pendant l’allaitement.</p><p><b>Résultats et limites.</b> FLOW : 3533 adultes avec type 2 et maladie rénale chronique, sémaglutide sous-cutané 1 mg/semaine ; réduction relative de 24 % du critère composite rénal incluant le décès cardiovasculaire, sur un suivi médian de 3,4 ans. SOUL : 9650 adultes à haut risque, ancienne formulation orale jusqu’à 14 mg ; événements cardiovasculaires majeurs 12,0 % contre 13,8 %. Ces doses d’essai et populations ne remplacent pas la posologie actuelle de Rybelsus® N.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680698650010" target="_blank" rel="noopener">Information professionnelle suisse Rybelsus N® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680652360016" target="_blank" rel="noopener">Information professionnelle suisse Trulicity® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, agonistes du GLP-1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38785209/" target="_blank" rel="noopener">FLOW 2024, résumé consulté</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40162642/" target="_blank" rel="noopener">SOUL 2025, résumé consulté</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680687260015" target="_blank" rel="noopener">Information professionnelle suisse Mounjaro® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-d-tirzepatide" data-title="Tirzépatide (Mounjaro®)"><p><b>Produit et mécanisme.</b> Mounjaro®, FI suisse juillet 2026 : agoniste des récepteurs du GIP et du GLP-1. L’indication diabétique adulte est distincte de l’indication de contrôle pondéral et de ses conditions de financement. La FI ne comporte pas d’indication cardiovasculaire spécifique à déduire d’un essai.</p><p><b>Dose adulte.</b> Sous-cutané dans l’abdomen, la cuisse ou le bras, une fois par semaine : 2,5 mg pendant quatre semaines, puis 5 mg ; augmenter si nécessaire par paliers de 2,5 mg espacés d’au moins quatre semaines ; maximum 15 mg/semaine. Une dose oubliée se rattrape dans les quatre jours ; sinon omettre. Respecter au moins 72 heures entre deux administrations. Pas d’adaptation rénale, y compris au stade terminal, ni hépatique ; surveiller les conséquences d’une déshydratation.</p><p><b>Contre-indication et précautions.</b> Hypersensibilité. Pancréatite suspectée : arrêter et évaluer ; si confirmée, ne pas réintroduire. Nausées, vomissements, constipation et diarrhées appellent une titration prudente ; les maladies gastro-intestinales sévères, dont la gastroparésie, nécessitent une prudence particulière. Surveiller la nutrition, la rétinopathie et les symptômes psychiques selon les antécédents. Réduire éventuellement l’insuline ou le sécrétagogue associé. Les antécédents personnels/familiaux de cancer médullaire thyroïdien ou de néoplasie endocrinienne multiple de type 2 demandent une évaluation approfondie du bénéfice–risque dans la FI suisse, sans être présentés comme une contre-indication formelle suisse.</p><div class="alert"><b>Contraception.</b> La diminution de l’exposition aux contraceptifs oraux impose une méthode non orale ou une méthode barrière supplémentaire pendant quatre semaines après le début et après chaque augmentation de dose.</div><p><b>Grossesse et allaitement.</b> Ne pas utiliser pendant la grossesse. Pour l’allaitement, choisir avec le médecin entre interruption du traitement et interruption de l’allaitement selon le bénéfice. Le consensus conjoint 2026 rapporte SURPASS-CVOT : non-infériorité au dulaglutide, rapport de risque 0,92 ; ce résultat n’établit pas une supériorité cardiovasculaire et ne crée pas une indication suisse.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680687260015" target="_blank" rel="noopener">Information professionnelle suisse Mounjaro® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, tirzépatide et SURPASS-CVOT</a>.</p></template>
<template data-pop="e11-d-idpp4" data-title="Inhibiteurs de la DPP-4 (sitagliptine, linagliptine)"><p><b>Mécanisme et place.</b> Les inhibiteurs de la DPP-4 prolongent les incrétines endogènes. Ils sont neutres sur le poids, ont un faible risque hypoglycémique sans insuline ou sécrétagogue, et peuvent convenir au patient fragile dénutri. Leur neutralité cardiovasculaire ne vaut pas protection d’organe démontrée.</p><table class="t"><tr><th>Produit et FI suisse</th><th>Dose orale, rein, foie</th></tr><tr><td>Januvia® : sitagliptine, avril 2024</td><td>100 mg une fois par jour, avec ou sans repas ; DFG 30 à &lt; 45 : 50 mg ; sous 30 et en dialyse : 25 mg. Pas d’adaptation hépatique légère/modérée ; forme sévère non étudiée, prudence.</td></tr><tr><td>Trajenta® : linagliptine, novembre 2023</td><td>5 mg une fois par jour, avec ou sans repas ; pas d’adaptation rénale. Les données pharmacocinétiques suggèrent l’absence d’adaptation hépatique, mais l’expérience clinique en insuffisance hépatique est limitée.</td></tr></table><p><b>Contre-indication et surveillance.</b> Hypersensibilité. Rechercher une pancréatite devant une douleur abdominale persistante ; arrêter si suspectée. Réactions cutanées sévères, pemphigoïde bulleuse et rhabdomyolyse ont été rapportées. Avec l’insuline ou une sulfonylurée, une réduction de leur dose peut être nécessaire. Sous linagliptine, les inducteurs forts comme rifampicine, carbamazépine ou phénytoïne diminuent l’exposition : envisager un autre traitement. La fonction rénale doit être connue pour doser la sitagliptine.</p><p><b>Grossesse/allaitement et associations.</b> Éviter pendant la grossesse ; ne pas utiliser pendant l’allaitement selon les FI. Ne pas associer à un agoniste du GLP-1 ou au tirzépatide : cette combinaison n’ajoute pas un bénéfice pertinent et complique le traitement.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578630019" target="_blank" rel="noopener">Information professionnelle suisse Januvia® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680618930017" target="_blank" rel="noopener">Information professionnelle suisse Trajenta® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, sujet âgé et associations</a>.</p></template>
<template data-pop="e11-d-insulines" data-title="Insulines du diabète de type 2"><p><b>Mécanisme et règle commune.</b> L’insuline remplace la sécrétion déficiente, augmente l’utilisation périphérique du glucose et freine la production hépatique et la lipolyse. La dose se personnalise ; il n’existe pas de dose maximale clinique universelle. Les limites des stylos sont des limites par injection et ne remplacent pas la prescription quotidienne.</p><table class="t"><tr><th>Produit exact et rôle</th><th>Schéma adulte et particularités</th></tr><tr><td>Tresiba® dégludec 100/200 U/mL ; FI décembre 2024</td><td>Basale sous-cutanée une fois/jour ; début type 2 : 10 unités/jour. Intervalle minimal de huit heures si horaire exceptionnellement déplacé. Stylo 100 : 1 à 80 unités/injection ; 200 : 2 à 160 par paliers de deux. Le compteur indique les unités sans conversion de concentration.</td></tr><tr><td>Toujeo® SoloStar glargine 300 U/mL ; FI juillet 2021</td><td>Basale sous-cutanée une fois/jour ; début type 2 : 0,2 unité/kg/jour ; ajustements espacés de trois à quatre jours. Stylo : 1 à 80 unités/injection. Glargine 100 et 300 ne sont pas bioéquivalentes ; transition sous surveillance.</td></tr><tr><td>Lantus® glargine 100 U/mL ; FI septembre 2022</td><td>Basale sous-cutanée une fois/jour à heure fixe ; dose et cible individualisées. Le stylo SoloStar délivre 1 à 80 unités/injection. Pas de mélange ni dilution.</td></tr><tr><td>Ryzodeg® 100 U/mL ; FI novembre 2020</td><td>70 % dégludec, 30 % asparte ; sous-cutané une ou deux fois/jour aux repas principaux. Début type 2 : dose totale 10 unités/jour. Stylo : 1 à 80 unités/injection.</td></tr><tr><td>NovoRapid® asparte ; FI avril 2026</td><td>Insuline prandiale rapide sous-cutanée généralement immédiatement avant repas ; posologie individuelle. Voie IV possible uniquement par un professionnel, avec suivi du glucose et du potassium ; utiliser la présentation et le protocole hospitalier appropriés.</td></tr><tr><td>Huminsulin® Basal NPH 100 U/mL ; FI septembre 2021</td><td>Insuline intermédiaire en suspension à remettre en homogénéité selon sa notice ; dose individuelle, habituellement deux injections sous-cutanées. Jamais IV. Elle reste une option dans des situations particulières ; la SSED préfère les analogues ultralents pour la basale courante du type 2.</td></tr></table><p><b>Rein, foie, contre-indications et précautions.</b> Une insuffisance rénale ou hépatique peut diminuer les besoins : intensifier le contrôle et ajuster individuellement, sans tableau de réduction automatique. Hypersensibilité au produit ; Huminsulin® comporte notamment les contre-indications hypoglycémie et insulinome. Risques communs : hypoglycémie, prise de poids, lipodystrophie et amyloïdose cutanée aux sites. Faire tourner les sites, vérifier le produit et la concentration avant chaque injection, enseigner le secours et la conduite. Les basales et Ryzodeg® ne doivent pas être injectés IV ; ils ne traitent pas seuls une acidocétose.</p><div class="key"><b>Grossesse/allaitement : ne pas généraliser.</b> Tresiba® peut être envisagé pendant la grossesse si indiqué, mais sa FI recommande de ne pas l’utiliser pendant l’allaitement. Lantus® et Toujeo® peuvent être envisagés pendant la grossesse ; ajuster l’insuline et l’alimentation pendant l’allaitement. Ryzodeg® n’est pas utilisé pendant la grossesse ni l’allaitement. NovoRapid® et Huminsulin® nécessitent surveillance et adaptation aux besoins. Le document SSED d’alternatives, état août 2025, est plus permissif sur l’allaitement que certaines FI : la prescription du produit exact suit sa FI et un avis spécialisé.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Information professionnelle suisse Tresiba® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680654530011" target="_blank" rel="noopener">Information professionnelle suisse Toujeo SoloStar® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680553460037" target="_blank" rel="noopener">Information professionnelle suisse Lantus® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680626270013" target="_blank" rel="noopener">Information professionnelle suisse Ryzodeg® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Information professionnelle suisse NovoRapid® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517500397" target="_blank" rel="noopener">Information professionnelle suisse Huminsulin Basal NPH® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, insulines</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED, alternatives, état août 2025</a>.</p></template>
<template data-pop="e11-d-gliclazide" data-title="Gliclazide à libération modifiée (Diamicron®)"><p><b>Produit et mécanisme.</b> Diamicron® MR 60 mg, FI février 2025 : sulfonylurée qui stimule la sécrétion d’insuline. La SSED 2023 réserve cette classe à des cas choisis, notamment en raison des hypoglycémies et de la prise de poids.</p><p><b>Dose adulte.</b> Par voie orale au petit déjeuner : 30 mg, soit un demi-comprimé de 60 mg ; augmenter selon la glycémie à 60, 90 puis 120 mg par jour. Espacer les paliers d’au moins deux semaines. Maximum 120 mg/jour. Une prise oubliée ne se double pas le lendemain ; une alimentation régulière est indispensable.</p><p><b>Rein et foie.</b> Pas d’adaptation automatique dans les insuffisances rénales légères/modérées, mais contrôle attentif ; insuffisance rénale ou hépatique sévère : contre-indication. La grossesse et l’allaitement, le diabète de type 1 ou l’acidocétose/coma diabétique, les hypersensibilités pertinentes, le miconazole et certaines insuffisances endocriniennes graves sont également contre-indiqués par la FI.</p><div class="alert"><b>Hypoglycémie prolongée.</b> Une amélioration après du sucre peut être suivie d’une récidive ; une forme sévère exige une prise en charge hospitalière et une surveillance prolongée. Les repas sautés, l’alcool, l’insuffisance rénale et des associations médicamenteuses augmentent le risque ; les bêtabloquants peuvent en masquer les signes. La SSED demande d’éviter autant que possible l’association à l’insuline ; la FI permet certaines associations sous contrôle médical, ce n’est pas une interdiction formelle universelle.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680552340064" target="_blank" rel="noopener">Information professionnelle suisse Diamicron MR 60® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, sulfonylurées</a>.</p></template>
<template data-pop="e11-d-finerenone" data-title="Finérénone (Kerendia®)"><p><b>Produit et indication.</b> Kerendia®, FI novembre 2025 : antagoniste non stéroïdien du récepteur des minéralocorticoïdes. Dans ce cours, le schéma concerne la néphropathie chronique du type 2, notamment albuminurique malgré blocage du système rénine–angiotensine ; il ne traite pas la glycémie. La FI contient aussi une indication d’insuffisance cardiaque avec fraction d’éjection ≥ 40 %, dont le schéma peut différer.</p><p><b>Schéma rénal adulte par voie orale.</b> Début 20 mg une fois par jour si DFG ≥ 60, 10 mg si DFG 25 à &lt; 60 ; ne pas initier sous 25. Cible et maximum pour cette indication : 20 mg/jour. Avant le début, potassium ≤ 4,8 mmol/L ; entre &gt; 4,8 et 5,0, initiation envisageable avec contrôle supplémentaire rapproché ; au-dessus de 5,0, ne pas initier. Recontrôler potassium et DFG à quatre semaines après début, reprise ou changement de dose, puis périodiquement. Potassium &gt; 5,5 : suspendre ; reprendre 10 mg lorsque ≤ 5,0. L’augmentation 10 vers 20 mg dépend du potassium et de l’absence de chute du DFG &gt; 30 %.</p><p><b>Foie et contre-indications.</b> Insuffisance hépatique sévère Child-Pugh C : éviter ; A/B : pas d’ajustement initial, contrôle potassique supplémentaire si B. Contre-indications : hypersensibilité, maladie d’Addison et inhibiteur puissant du CYP3A4, notamment clarithromycine, itraconazole ou ritonavir. Sous inhibiteur modéré du CYP3A4, début 10 mg et surveillance renforcée ; éviter inducteurs puissants/modérés et pamplemousse. Ne pas associer en routine à un autre antagoniste minéralocorticoïde ou à un diurétique d’épargne potassique. Potassium ajouté et triméthoprime demandent une vigilance particulière.</p><p><b>Grossesse/allaitement.</b> Contraception efficace. Ne pas utiliser pendant la grossesse sauf nécessité clinique après évaluation du bénéfice–risque ; choisir entre interruption de l’allaitement et interruption du traitement. Le principal risque de surveillance est l’hyperkaliémie.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED et Société suisse de néphrologie 2024, protection rénale</a>.</p></template>
<template data-pop="pareto-e11-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="e11-0,e11-1,e11-2,e11-3,e11-4,e11-5,e11-6"></p><ul><li>Le type 2 associe <button class="w" data-justification="1" data-k="e11-insulinoresistance">insulinorésistance</button> et déficit relatif de l’insuline ; il constitue environ 90 % des diabètes de l’adulte.</li><li>Amaigrissement, cétose ou minceur font rechercher une carence insulinique et un <button class="w" data-justification="1" data-k="e11-type1-lada">autre type de diabète</button>.</li><li>En Suisse, 6,2 % des personnes de 15 ans et plus déclarent un diabète en 2022 ; ce chiffre ne distingue pas les types et ne mesure pas les cas ignorés.</li><li>Foie producteur de glucose, muscle insulinorésistant, cellule β défaillante et <button class="w" data-justification="1" data-k="e11-incretine">effet incrétine réduit</button> entretiennent l’hyperglycémie.</li><li>Une perte pondérale importante peut conduire à la <button class="w" data-justification="1" data-k="e11-remission">rémission</button> ; elle ne dispense pas du suivi.</li><li><button class="w" data-justification="1" data-k="e11-depistage">Dépistage</button> dès 35 ans dans le consensus conjoint 2026, plus tôt en cas de surpoids/obésité avec facteur de risque ; l’ESC dépiste tout patient cardiovasculaire.</li><li>Examen : poids, pression artérielle, signes d’insuffisance cardiaque, pouls et <button class="w" data-justification="1" data-k="e11-pied">sensibilité des pieds</button>.</li></ul></template>
<template data-pop="pareto-e11-diag" data-title="Pareto — Diagnostic et urgences"><p class="ratio" data-cover="e11-7,e11-8"></p><ul><li>Le diabète se diagnostique lorsque l’un des seuils est atteint : <button class="w" data-justification="1" data-k="e11-hba1c">HbA1c</button> ≥ 6,5 %, glycémie à jeun ≥ 7,0 mmol/L, glycémie à deux heures après 75 g ≥ 11,1 mmol/L ou aléatoire ≥ 11,1 mmol/L avec symptômes.</li><li>Sans symptômes, deux résultats concordants au laboratoire ; si discordants, répéter le test anormal. Tenir compte des limites de l’HbA1c.</li><li><button class="w" data-justification="1" data-k="e11-cpeptide">Auto-anticorps et peptide C</button> précisent un type incertain, sans retarder le traitement d’une carence.</li><li><button class="w" data-justification="1" data-k="e11-hypo">Hypoglycémie</button> est cliniquement significative à &lt; 3,0 mmol/L ; sévère si aide d’un tiers, quelle que soit la valeur.</li><li><button class="w" data-justification="1" data-k="e11-shh">État hyperosmolaire</button> : les quatre critères réunis — glycémie ≥ 33,3 mmol/L ; osmolalité efficace &gt; 300 ou totale &gt; 320 ; β-hydroxybutyrate &lt; 3 ou cétonurie &lt; 2+ ; pH ≥ 7,3 et bicarbonates ≥ 15.</li><li><button class="w" data-justification="1" data-k="e11-acd-isglt2">Acidocétose</button> : diabète connu ou glucose ≥ 11,1 ; β-hydroxybutyrate ≥ 3 ou cétonurie ≥ 2+ ; pH &lt; 7,3 et/ou bicarbonates &lt; 18. Une glycémie basse ne l’exclut pas. Urgence hospitalière.</li></ul></template>
<template data-pop="pareto-e11-ttt" data-title="Pareto — Complications et traitement"><p class="ratio" data-cover="e11-9,e11-10"></p><ul><li>Le dépistage au moins annuel comporte <button class="w" data-justification="1" data-k="e11-mrc">créatinine/DFG et albuminurie</button>, pieds, facteurs de risque ; <button class="w" data-justification="1" data-k="e11-retino">ophtalmologie</button> au diagnostic, puis intervalle adapté, souvent deux ans si examen normal.</li><li>Une albuminurie persistante exige la confirmation de sa chronicité et de son origine. Le risque et l’indication du produit guident la protection cardio-rénale.</li><li><button class="w" data-justification="1" data-k="e11-cibles">Cible d’HbA1c</button> autour de 7 %, plus stricte si jeune sans hypoglycémie ; plus souple selon fragilité, espérance de vie et risque iatrogène.</li><li>Traitement multifactoriel : tabac, pression artérielle, LDL, poids et activité.</li><li>Choisir les <button class="w" data-justification="1" data-k="e11-contentieux-algo">classes protectrices</button> à bénéfice démontré pour le cœur et le rein selon le profil, indépendamment de la seule HbA1c.</li><li>SSED 2023 : metformine combinée d’emblée à une classe protectrice, puis trithérapie ; <button class="w" data-justification="1" data-k="e11-insuline-debut">insuline</button> si échec ou carence. Une cétose exige d’abord de rechercher une acidocétose.</li><li>Sulfonylurées non recommandées en première intention par la SSED ; <button class="w" data-justification="1" data-k="e11-d-gliclazide">gliclazide</button> réservé à certaines situations avec vigilance hypoglycémique.</li></ul></template>
<template data-pop="pareto-e11-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="e11-11,e11-12,e11-13"></p><ul><li><button class="w" data-justification="1" data-k="e11-qualite">Repères suisses de suivi</button> : trois visites et deux HbA1c annuelles dans la grille de qualité de patientèle ; adapter le suivi individuel.</li><li><button class="w" data-justification="1" data-k="e11-sick-days">Jours de maladie</button> : plan écrit, hydratation, surveillance, arrêt temporaire des produits à risque selon la situation ; ne pas supprimer seul l’insuline nécessaire.</li><li>Chez le sujet âgé, autonomie, nutrition, cognition et hypoglycémies guident la cible et le traitement.</li><li><button class="w" data-justification="1" data-k="e11-d-metformine">Glucophage®</button> contre-indiqué si DFG &lt; 30 ; <button class="w" data-justification="1" data-k="e11-d-isglt2">inhibiteurs du SGLT2</button> : seuils d’initiation/poursuite propres au produit et à l’indication.</li><li><button class="w" data-justification="1" data-k="e11-grossesse">Grossesse/allaitement</button> : restrictions de la FI exacte ; sémaglutide exclu, arrêt deux mois avant projet. Tirzépatide : contraception supplémentaire après début et chaque augmentation.</li><li><button class="w" data-justification="1" data-k="e11-conduite">Conduite</button> : risque iatrogène, complications et catégorie de permis ; HbA1c &gt; 10 % pour groupe 1 ou &gt; 8,5 % pour groupe 2 compromet l’aptitude.</li><li><button class="w" data-justification="1" data-k="e11-perop">Périopératoire</button> : metformine 48 heures avant anesthésie générale/locorégionale ; Jardiance®/Forxiga® au moins trois jours avant intervention majeure selon leurs FI.</li></ul></template>
<template data-pop="pareto-e11-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e11-e-1,e11-e-2,e11-e-3"></p><ul><li>La référence diagnostique est la glycémie plasmatique veineuse de laboratoire ; <button class="w" data-justification="1" data-k="e11-hgpo">HGPO</button> si nécessaire.</li><li>Le bilan initial comporte glycémie, HbA1c, créatinine/DFG, albuminurie et lipides.</li><li>Albuminurie : A1 &lt; 3, A2 de 3 à &lt; 30, A3 ≥ 30 mg/mmol ; <button class="w" data-justification="1" data-k="e11-mrc">chronicité</button> au moins trois mois et confirmation du stade.</li><li><button class="w" data-justification="1" data-k="e11-ic-depistage">NT-proBNP</button> chez le diabétique asymptomatique : &lt; 125 ng/L rend l’insuffisance cardiaque peu probable, 125 à 299 zone grise, ≥ 300 indique une évaluation spécialisée ; interpréter selon contexte.</li><li><button class="w" data-justification="1" data-k="e11-cetones">β-hydroxybutyrate</button> ≥ 3 mmol/L ne suffit pas seul à diagnostiquer une acidocétose ; examiner pH/bicarbonates et diabète/hyperglycémie.</li><li>Osmolalité efficace = 2 × Na⁺ + glucose ; totale = 2 × Na⁺ + glucose + urée, en mmol/L.</li><li>Glycémie élevée avec HbA1c normale : évoquer <button class="w" data-justification="1" data-k="e11-stress">hyperglycémie de stress</button>, diabète récent ou limite de l’HbA1c ; confirmer à distance.</li></ul></template>
<template data-pop="pareto-e11-pharm" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e11-p-1,e11-p-2,e11-p-3,e11-p-4"></p><ul><li><button class="w" data-justification="1" data-k="e11-d-metformine">Glucophage®</button> se prend par voie orale : le début est 500 à 1000 mg/jour, progression selon tolérance ; maximum 3000 mg/jour si rein adapté, 1000 entre DFG 30 et 59 ; contre-indication &lt; 30.</li><li><button class="w" data-justification="1" data-k="e11-d-isglt2">Jardiance®/Forxiga®</button> se prennent par voie orale à 10 mg une fois/jour pour cœur/rein ; pas d’initiation sous DFG 20/25 respectivement. Les règles pour le seul contrôle glycémique et pour la dialyse diffèrent.</li><li><button class="w" data-justification="1" data-k="e11-d-aglp1">Ozempic®</button> s’administre par voie sous-cutanée une fois par semaine : 0,25 puis 0,5, 1, éventuellement 2 mg, après au moins quatre semaines à chaque palier ; Rybelsus® N a son schéma oral propre.</li><li><button class="w" data-justification="1" data-k="e11-d-tirzepatide">Mounjaro®</button> s’administre par voie sous-cutanée une fois par semaine : 2,5 mg quatre semaines, puis 5 ; +2,5 mg après au moins quatre semaines, maximum 15 mg.</li><li><button class="w" data-justification="1" data-k="e11-d-insulines">Basales sous-cutanées</button> ont des schémas distincts : Tresiba® commence à 10 unités une fois/jour au départ ; Toujeo® 0,2 unité/kg une fois/jour, ajustements espacés de trois à quatre jours ; aucune titration universelle tous les deux jours.</li><li>L’association à insuline/sulfonylurée demande une réévaluation du risque d’hypoglycémie. L’association GLP-1 + DPP-4 est évitée ; insuline + sulfonylurée n’est pas une contre-indication formelle générale mais expose davantage aux hypoglycémies.</li><li><button class="w" data-justification="1" data-k="e11-d-finerenone">Kerendia®</button> se prend par voie orale pour la néphropathie de type 2 : 10/20 mg une fois/jour selon DFG ; potassium ≤ 4,8 au départ, possibilité entre 4,8 et 5 avec contrôle rapproché ; contrôle à quatre semaines.</li></ul></template>

<template data-pop="pareto-e11-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="e11-s-histo-body,e11-s-phys-body,e11-s-bioc-body,e11-s-rein-body"></p><ul><li>La cellule β convertit le glucose métabolisé en un signal ATP/ADP qui ferme les canaux potassiques. La dépolarisation et l’entrée de calcium déclenchent l’exocytose ; l’excès de nutriments altère ce couplage.</li><li><button class="w" data-justification="1" data-k="e11-incretine">Incrétines</button> : GIP/GLP-1 amplifient la réponse au glucose oral ; DPP-4 les dégrade. Le GLP-1 pharmacologique reste actif dans le type 2.</li><li><button class="w" data-justification="1" data-k="e11-insulinoresistance">Signal insulinique</button> : récepteur → IRS-1/IRS-2 → PI3K → AKT ; GLUT4 vers la membrane musculaire/adipocytaire, FOXO1 freiné dans le foie.</li><li>Stress oxydant et <button class="w" data-justification="1" data-k="e11-mecanismes-complications">glycation</button> relient hyperglycémie à lésions vasculaires ; anomalies de durée de vie des hématies peuvent fausser l’HbA1c.</li><li><button class="w" data-justification="1" data-k="e11-d-isglt2">SGLT2</button> : glucose et sodium réabsorbés au tubule proximal ; inhibition entraîne glycosurie et probablement rétrocontrôle tubulo-glomérulaire protecteur, avec effets glycémiques et rénaux distincts.</li><li>Les figures sont des schémas de mécanisme ; les valeurs d’étude de glycosurie/DFG ne sont pas des cibles de prescription.</li></ul></template>

<template data-pop="e11-d-eviter" data-title="Pioglitazone et saxagliptine : restrictions et risque cardiaque"><p>La recommandation clinique peut déconseiller un produit sans que la FI classe toutes les situations dans les contre-indications formelles. La SSED évite ces produits chez l’insuffisant cardiaque ; leurs FI précisent des restrictions différentes.</p><p><b>Actos® : pioglitazone, FI mai 2021.</b> La dose orale initiale est 15 ou 30 mg une fois par jour, avec ou sans repas ; l’augmentation progressive peut atteindre 45 mg/jour. Le diabète de type 2 constitue une indication de deuxième choix, après évaluation des alternatives. Aucune adaptation rénale n’est prévue au-dessus d’une clairance de 4 mL/min ; les données de dialyse manquent. En insuffisance hépatique légère, le début est 15 mg ; les formes modérées/sévères sont contre-indiquées. Les autres contre-indications comprennent hypersensibilité, type 1, acidocétose, insuffisance cardiaque NYHA III/IV, grossesse/allaitement, cancer vésical ou antécédent et hématurie macroscopique inexpliquée. La rétention hydrique, la prise pondérale et les fractures imposent une évaluation attentive ; le bénéfice se réévalue après trois à six mois. Le traitement au-delà de deux ans demande une nouvelle appréciation du bénéfice–risque vésical. Les données hépatiques du consensus ne créent pas une autorisation suisse spécifique de traitement de la stéatohépatite.</p><p><b>Onglyza® : saxagliptine, FI septembre 2023.</b> La FI prévoit par voie orale 2,5 ou 5 mg une fois par jour ; sous DFG 45 mL/min/1,73 m², la dose est 2,5 mg. La forme terminale nécessitant hémodialyse et l’insuffisance hépatique sévère ne sont pas recommandées ; la forme hépatique modérée demande de la prudence. L’hypersensibilité est une contre-indication. Le signal d’hospitalisation pour insuffisance cardiaque demande une prudence particulière, sans devenir une contre-indication suisse formelle pour tout patient cardiaque. Une pancréatite suspectée impose l’arrêt. La grossesse n’autorise l’usage qu’en cas de nécessité absolue ; l’allaitement demande de la prudence. Ce cours privilégie les autres options selon la SSED ; il ne propose pas la saxagliptine comme protection cardiaque.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680553780012" target="_blank" rel="noopener">Information professionnelle suisse Actos® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680593900012" target="_blank" rel="noopener">Information professionnelle suisse Onglyza® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, insuffisance cardiaque</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint 2026, traitements</a>.</p></template>
