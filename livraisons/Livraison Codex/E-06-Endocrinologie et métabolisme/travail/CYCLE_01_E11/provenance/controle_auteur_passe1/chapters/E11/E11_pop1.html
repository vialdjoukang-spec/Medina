<template data-pop="e11-score2d" data-title="Catégories de risque cardiovasculaire du diabétique (ESC 2023)"><p>Le risque est <b>très élevé</b> en cas de maladie athéroscléreuse avérée, d’atteinte sévère d’organe cible ou de SCORE2-Diabetes ≥ 20 % à dix ans ; <b>élevé</b> de 10 à moins de 20 % ; <b>modéré</b> de 5 à moins de 10 % ; <b>faible</b> sous 5 %. L’atteinte sévère d’organe comprend un DFG &lt; 45 mL/min/1,73 m², un DFG de 45 à 59 avec albuminurie A2, une albuminurie A3 ou une atteinte microvasculaire de trois territoires. SCORE2-Diabetes a été validé de 40 à 69 ans chez les patients sans maladie athéroscléreuse établie ni atteinte sévère d’organe cible ; il intègre l’âge au diagnostic, l’HbA1c et le DFG.</p><div class="key"><b>Conséquence.</b> La catégorie fixe la cible de cholestérol LDL et l’intensité de la prévention ; la recommandation suisse de 2023 souligne le risque souvent élevé ; le score européen de 2023 distingue néanmoins quatre catégories et évite de classer tout patient de la même façon.</div><p class="src">Références : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, tableau 7</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-insulinoresistance" data-title="Insulinorésistance"><p>L’insulinorésistance est une réponse diminuée des cellules à l’insuline. Le muscle squelettique en est le principal site extrapancréatique : il capte moins de glucose parce que le transporteur GLUT4 migre mal vers la membrane. Le tissu adipeux résistant libère des acides gras libres, et le foie, qui ne freine plus sa production de glucose, entretient l’hyperglycémie à jeun. L’obésité viscérale et l’inactivité physique en sont les causes principales.</p><div class="key"><b>Limite.</b> Une insulinémie normale ne prouve pas une sécrétion suffisante : face à une résistance extrême, même une insuline « normale » ne maintient plus la glycémie (SSED 2023).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-type1-lada" data-title="Diabète de type 1 et LADA chez l’adulte"><p>Le diabète de type 1 résulte d’une destruction auto-immune des cellules β, avec un déficit absolu en insuline ; il représente 5 à 10 % des diabètes (ESC 2023). Il peut débuter à tout âge. Chez l’adulte, sa forme lente, dite LADA, correspond à un diabète auto-immun d’évolution lente à l’âge adulte (ESC 2023). Une évolution brève, des symptômes osmotiques et un amaigrissement le suggèrent ; les anticorps anti-GAD, anti-IA2 ou anti-ZnT8 le confirment, mais ils manquent chez 5 à 10 % des patients.</p><div class="key"><b>Conséquence.</b> Le traitement est l’insuline. Une « lune de miel » de plus de cinq ans doit faire reconsidérer le type de diabète.</div><p class="src">Références : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2</a>.</p></template>
<template data-pop="e11-mody" data-title="Diabète monogénique (MODY)"><p>Le MODY est un diabète monogénique. Une hyperglycémie chez un sujet jeune, avec sécrétion d’insuline conservée, sans auto-anticorps et avec des cas sur plusieurs générations doit conduire à un avis spécialisé ; aucun seuil isolé de peptide C ne prouve un MODY.</p><p>La SSED 2023 distingue les MODY 1 et 3, qui peuvent répondre aux sulfonylurées, du MODY 2 lié à la glucokinase, dont la conduite diffère. Le résultat génétique et le contexte, notamment une grossesse, guident la conduite ; il ne faut pas transposer le traitement courant du type 2 à toute forme monogénique.</p><div class="key"><b>Conséquence.</b> Demander un avis diabétologique et génétique lorsque l’histoire familiale et le phénotype le suggèrent. Un tableau de carence insulinique exige un traitement immédiat, sans attendre la classification définitive.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, déficit insulinique et diabètes monogéniques</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2</a>.</p></template>
<template data-pop="e11-sousgroupes" data-title="Sous-groupes du diabète de l’adulte"><p>Une analyse de 8980 diabétiques suédois nouvellement diagnostiqués a défini cinq groupes à partir de six variables : anticorps anti-GAD, âge au diagnostic, IMC, HbA1c, fonction β et insulinorésistance. Le groupe le plus insulinorésistant avait davantage de néphropathie, le groupe insulinodéficient davantage de rétinopathie. La SSED en résume les proportions : environ 6 % de types 1 méconnus, 18 % de déficits insuliniques sans anticorps, 15 % d’insulinorésistances sévères, 20 % de diabètes liés à l’obésité et 40 % liés à l’âge.</p><div class="key"><b>Limite.</b> Cette classification guide la réflexion ; elle n’est pas un critère diagnostique officiel.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29503172/" target="_blank" rel="noopener">Ahlqvist et al., 2018</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-masld" data-title="Stéatose hépatique associée à une dysfonction métabolique"><p>La MASLD associe une stéatose hépatique à au moins un facteur de risque cardiométabolique, après exclusion d’une consommation importante d’alcool et des autres causes. Elle touche plus de 70 % des diabétiques de type 2 ; le consensus 2026 rapporte aussi une stéatohépatite chez plus de la moitié ; ce chiffre de population ne prédit pas une évolution individuelle. Le stade de fibrose, surtout à partir du stade 2, détermine la mortalité hépatique, cardiovasculaire et globale.</p><div class="key"><b>Conséquence.</b> La perte de poids est le traitement de base ; les agonistes du GLP-1 et la pioglitazone ont des preuves histologiques, alors que les inhibiteurs du SGLT2 ne se choisissent pas pour le foie (ADA/EASD 2026).</div><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-glucolipotox" data-title="Glucolipotoxicité"><p>Dans l’obésité, l’excès d’acides gras saturés et l’hyperglycémie lèsent la cellule β. Ils provoquent un stress du réticulum endoplasmique, activent une réponse aux protéines mal repliées qui peut conduire à l’apoptose et génèrent un stress oxydant. La synthèse accrue de proinsuline et de polypeptide amyloïde des îlots aggrave le mauvais repliement ; l’interleukine 1β attire des macrophages dans l’îlot.</p><div class="key"><b>Conséquence.</b> L’hyperglycémie aggrave la cellule β qui la provoque. C’est pourquoi, après la correction d’une hyperglycémie majeure par l’insuline, celle-ci peut parfois être arrêtée chez un diabétique de type 2 (SSED 2023).</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a>.</p></template>
<template data-pop="e11-incretine" data-title="Effet incrétine"><p>Le glucose pris par la bouche déclenche une sécrétion d’insuline deux à trois fois plus forte que le même glucose perfusé. Le GIP, des cellules K de l’intestin proximal, et le GLP-1, des cellules L de l’intestin distal, en sont responsables. Dans le diabète de type 2, cet effet est diminué ou absent, surtout parce que la cellule β répond mal au GIP ; le GLP-1 donné à dose pharmacologique garde ses effets insulinotrope et glucagonostatique.</p><div class="key"><b>Conséquence.</b> Ce constat fonde les agonistes du GLP-1 et les inhibiteurs de la DPP-4.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/29364588/" target="_blank" rel="noopener">Nauck et Meier, 2018</a>.</p></template>
<template data-pop="e11-remission" data-title="Rémission du diabète de type 2 (essai DiRECT)"><p>Le consensus international co-signé par l’EASD en 2021 définit la rémission par une HbA1c &lt; 6,5 % mesurée <b>au moins trois mois après l’arrêt des médicaments hypoglycémiants</b>. Une glycémie contrôlée sous traitement ne suffit pas à prouver une rémission indépendante des médicaments. Le dépistage des complications et un contrôle glycémique au moins annuel se poursuivent.</p><p>Dans DiRECT, 149 patients par groupe entraient dans l’analyse : diabète depuis moins de six ans, âge de 20 à 65 ans, IMC de 27 à 45 kg/m², sans insuline. Le programme, encadré en premier recours, comportait 825 à 853 kcal par jour pendant trois à cinq mois, puis réintroduction alimentaire et maintien pondéral. À un an, 46 % étaient en rémission contre 4 %. L’essai utilisait alors un arrêt des antidiabétiques de deux mois : <b>ce critère historique ne remplace pas la définition actuelle de trois mois</b>.</p><div class="key"><b>Limites.</b> L’effet dépend de la perte de poids et de son maintien. Le consensus 2026 rapporte une rémission à cinq ans chez 13 % du sous-groupe recevant un soutien prolongé, soit 7 % du groupe intervention initial ; ces dénominateurs ne sont pas interchangeables. Une restriction énergétique intensive nécessite une surveillance clinique et une adaptation des médicaments.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-021-05542-z" target="_blank" rel="noopener">Riddle et al., consensus de rémission 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29221645/" target="_blank" rel="noopener">Lean et al., DiRECT 2018, résumé consulté</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, rémission</a>.</p></template>
<template data-pop="e11-mecanismes-complications" data-title="Voies biochimiques des complications"><p>L’hyperglycémie chronique accroît la production mitochondriale d’espèces réactives de l’oxygène. Ce stress oxydant active cinq voies : la voie des polyols, la formation de produits de glycation avancée, l’expression de leur récepteur, l’activation de la protéine kinase C et la voie des hexosamines. Il en résulte une angiogenèse défectueuse, une inflammation et des modifications épigénétiques durables.</p><div class="key"><b>Conséquence.</b> Ces modifications durables expliquent qu’une hyperglycémie ancienne continue de nuire après sa correction, d’où l’intérêt d’un contrôle précoce.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a>.</p></template>
<template data-pop="e11-memoire" data-title="Mémoire métabolique : l’effet héritage de l’UKPDS"><p>Dans l’UKPDS, 3867 patients nouvellement diagnostiqués ont reçu un traitement intensif ou conventionnel ; l’HbA1c a été de 7,0 contre 7,9 % pendant dix ans, avec 25 % de complications microvasculaires en moins. Après l’essai, l’écart d’HbA1c a disparu en un an, mais le bénéfice a persisté et s’est étendu : vingt-quatre ans plus tard, la mortalité restait réduite de 10 % avec sulfonylurée ou insuline et de 20 % avec metformine, et l’infarctus de 17 et 31 %.</p><div class="key"><b>Conséquence.</b> Le contrôle glycémique précoce rapporte des décennies plus tard. La directive suisse de conduite 2025 utilise aussi la notion d’exposition cumulée en « HbA1c-années ». Ce repère ne permet ni de prévoir les complications individuelles ni de remplacer leur dépistage.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9742976/" target="_blank" rel="noopener">UKPDS 33, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38772405/" target="_blank" rel="noopener">Adler et al., UKPDS 91, 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED–SGRM, directive de conduite, 2025</a>.</p></template>
<template data-pop="e11-hypercortisolisme" data-title="Hypercortisolisme et diabète résistant"><p>Un diabète insuffisamment contrôlé malgré plusieurs traitements peut justifier une recherche ciblée d’hypercortisolisme. Le consensus conjoint ADA/EASD 2026 rapporte une fréquence proche d’un quart dans une population <b>sélectionnée</b> de patients mal contrôlés ; ce chiffre ne décrit pas tous les diabétiques de type 2.</p><p>L’âge, un IMC relativement bas et certaines caractéristiques de la maladie ou de ses traitements étaient associés à la probabilité d’un test positif. Ces associations ne prouvent pas que les médicaments causent l’hypercortisolisme. Le bilan se discute avec un spécialiste lorsque la présentation clinique l’évoque ; il n’est pas un examen systématique de tout diabète.</p><div class="key"><b>Contexte suisse.</b> Le traitement antagoniste étudié dans ce sous-groupe et cité par le consensus ne constitue pas une autorisation de prescription suisse ; la conduite reste l’évaluation étiologique spécialisée.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, hypercortisolisme</a>.</p></template>
<template data-pop="e11-depistage" data-title="Dépistage du diabète de type 2"><p>Le dépistage recherche une maladie encore silencieuse par glycémie plasmatique à jeun ou HbA1c standardisée. Le consensus conjoint ADA/EASD 2026 propose un dépistage dès 35 ans, et à tout âge en cas de surpoids ou d’obésité avec un facteur de risque ; l’histoire familiale, cardiométabolique et obstétricale contribue à l’évaluation du risque. Si le résultat est normal, programmer le contrôle selon le risque et le résultat, en le rapprochant si le poids, les médicaments ou les antécédents évoluent.</p><div class="key"><b>Contexte suisse.</b> La prise de position SSED 2011 permet l’HbA1c standardisée pour le diagnostic et le dépistage. Les recommandations suisses de traitement 2023 ne fixent pas à elles seules un calendrier national exhaustif : le calendrier européen co-signé complète ce point. L’ESC 2023 demande le dépistage du diabète chez tout patient atteint d’une maladie cardiovasculaire.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, dépistage</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, diagnostic</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011</a>.</p></template>
<template data-pop="e11-symptomes-osmotiques" data-title="Polyurie, polydipsie et amaigrissement"><p>Quand la glycémie dépasse la capacité de réabsorption du tubule, le glucose filtré passe dans l’urine et entraîne l’eau et le sodium : c’est la diurèse osmotique. La polyurie provoque la soif ; la perte urinaire de glucose et le catabolisme dû au manque d’insuline font maigrir. Ces symptômes classiques permettent le diagnostic sur une seule glycémie aléatoire ≥ 11,1 mmol/L.</p><div class="key"><b>Conséquence.</b> Un amaigrissement ou une cétose signalent une carence insulinique : l’insuline se discute d’emblée (SSED 2023).</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">consensus 2024 sur les crises hyperglycémiques</a>.</p></template>
<template data-pop="e11-vision" data-title="Vision floue et variations glycémiques"><p>Une vision floue fait partie des manifestations possibles d’une hyperglycémie. Il faut distinguer un symptôme fluctuant d’une baisse visuelle persistante ou brutale, qui exige un examen ophtalmologique plutôt qu’une simple attribution à la glycémie.</p><div class="alert"><b>Urgence.</b> Une perte soudaine de vision sous sémaglutide demande une évaluation immédiate ; la FI suisse mentionne la neuropathie optique ischémique antérieure non artéritique. Le dépistage de la rétinopathie continue même en l’absence de plainte.</div><p class="src">Références : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, manifestations et diagnostic</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-ic-depistage" data-title="Insuffisance cardiaque : dépistage chez le diabétique"><p>La SSED et la Société suisse de cardiologie recommandent de rechercher à chaque rencontre la dyspnée d’effort, l’orthopnée, la dyspnée nocturne, une baisse de la tolérance à l’effort, la fatigue et les œdèmes. Chez le patient <b>symptomatique hors contexte aigu</b>, un NT-proBNP ≥ 125 ng/L ou un BNP ≥ 35 ng/L conduit à compléter le bilan, notamment par échocardiographie.</p><table class="t"><tr><th>Patient asymptomatique de 60 ans ou plus</th><th>Orientation suisse 2024</th></tr><tr><td>NT-proBNP &lt; 125 ng/L ; BNP &lt; 35 ng/L</td><td>Insuffisance cardiaque peu probable ; poursuivre le suivi annuel.</td></tr><tr><td>NT-proBNP 125 à 299 ; BNP 35 à 89 ng/L</td><td>Zone intermédiaire : réévaluer symptômes et facteurs de risque ; cardiologue ou nouveau dosage à six mois selon le contexte.</td></tr><tr><td>NT-proBNP ≥ 300 ; BNP ≥ 90 ng/L</td><td>Insuffisance cardiaque subclinique probable ; adresser au cardiologue.</td></tr></table><div class="key"><b>Limites et niveau de preuve.</b> Le dépistage annuel dès 60 ans et ces seuils asymptomatiques relèvent du consensus suisse d’experts, distinct du diagnostic symptomatique. Avant 60 ans, le dosage peut se discuter en cas de facteurs de risque associés. La fibrillation atriale et la maladie rénale augmentent les peptides ; l’obésité les abaisse. Le remboursement se vérifie séparément et ne se déduit pas d’une recommandation clinique.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/smw-2024-4000.pdf" target="_blank" rel="noopener">Paul et al., recommandations suisses 2024, algorithme et discussion</a>.</p></template>
<template data-pop="e11-neuropathie" data-title="Neuropathie diabétique"><p>La neuropathie périphérique peut réduire la perception de la douleur et de la pression. Une plaie ou une ischémie peut alors progresser sans douleur : son absence ne rassure pas. Le monofilament et le diapason recherchent la perte de sensibilité de protection et vibratoire ; l’inspection, les pouls et les antécédents complètent la stratification.</p><p>Une atteinte neurologique ne doit pas être attribuée automatiquement au diabète. Sous metformine, vérifier notamment une carence en vitamine B12 en cas de neuropathie ou d’anémie ; un déficit atypique ou rapidement progressif justifie une évaluation spécialisée. Le traitement symptomatique de la douleur relève d’une prescription individualisée et du chapitre neurologique dédié.</p><div class="key"><b>Priorité.</b> Le pied neuropathique nécessite prévention des traumatismes, surveillance, chaussage adapté et décharge d’une plaie. Un pied chaud, gonflé et déformé peut être un pied de Charcot aigu : circuit urgent interprofessionnel selon la grille suisse.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, stratification et urgence</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, dépistage neurologique</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, artériopathie et neuropathie</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-monofilament" data-title="Test au monofilament"><p>Le monofilament de 10 g explore la sensibilité de protection. La grille suisse QualiCCare 2023 utilise quatre réponses perçues sur quatre dans ses critères du pied sans neuropathie ; ce score ne se confond pas avec les répétitions du protocole IWGDF.</p><p><b>Technique IWGDF 2023, annexe 1.</b> Montrer d’abord la sensation sur la main du patient ; il ne regarde pas les sites testés. Tester trois sites sur chaque pied. Poser le filament perpendiculairement jusqu’à sa courbure ; l’ensemble approche–contact–retrait prend environ deux secondes. Éviter ulcère, callosité, cicatrice et nécrose ; ne pas faire glisser le filament.</p><p>Répéter deux contacts au même site en les alternant avec au moins une application simulée, soit trois questions. La sensation est conservée si au moins deux réponses sur trois sont correctes ; elle est absente si au moins deux sont incorrectes.</p><div class="key"><b>Conséquence.</b> Une perte de protection fait craindre une plaie non perçue : adapter chaussage, inspection et suivi. L’examen se combine à la vibration et à l’évaluation vasculaire. Employer un filament en bon état et le protocole complet choisi, sans additionner les scores de méthodes différentes.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, page 3</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandations pratiques, annexe 1, page 26</a>.</p></template>
<template data-pop="e11-vibration" data-title="Sensibilité vibratoire au diapason gradué"><p>La sensibilité vibratoire complète le monofilament. La directive suisse de conduite décrit un examen au gros orteil ; la grille QualiCCare 2023 utilise une valeur supérieure à 4/8 pour sa condition d’absence de neuropathie au diapason gradué.</p><p><b>Autre protocole : IWGDF 2023.</b> Avec un diapason de 128 Hz, montrer d’abord la vibration au poignet. Le patient ne regarde pas l’application. Poser le diapason perpendiculairement sur une partie osseuse dorsale de la phalange distale du gros orteil. Faire deux applications vibrantes et une simulée ; la perception est conservée si au moins deux réponses sur trois sont correctes. Si elle est absente à l’orteil, répéter plus proximalement.</p><div class="key"><b>Interprétation.</b> Le score gradué sur huit et le test qualitatif avec applications simulées sont deux méthodes : conserver la méthode et sa règle d’interprétation. Intégrer monofilament, peau, déformations, pouls et antécédent d’ulcère avant de classer le risque.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, page 3</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, annexe 1, pages 27–28</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM 2025, suivi neurologique</a>.</p></template>
<template data-pop="e11-pied" data-title="Pied diabétique : stratification suisse"><p>Le guide suisse classe le pied en trois niveaux. <b>Risque faible</b> : plaie superficielle, sans infection, sans artériopathie (deux pouls pédieux perçus, IPS ≥ 0,9), sans neuropathie ni déformation ; soins standard et contrôle à une semaine. <b>Risque moyen</b> : plaie profonde, infection, artériopathie, neuropathie ou ulcère antérieur ; réseau spécialisé. <b>Urgence</b> : cellulite, gangrène, infection systémique, ischémie aiguë ou pied de Charcot aigu ; équipe interprofessionnelle du pied.</p><div class="key"><b>Signaux d’alarme.</b> Une ischémie critique (IPS &lt; 0,5, pression d’orteil &lt; 30 mmHg) ou une plaie réduite de moins de 50 % en quatre semaines imposent le niveau le plus élevé. L’organisation de la podologie et sa prise en charge financière se vérifient selon le besoin et les règles suisses applicables.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023</a>.</p></template>
<template data-pop="e11-hba1c" data-title="HbA1c : principe, avantages et pièges"><p>L’HbA1c est l’hémoglobine glyquée ; elle reflète la glycémie moyenne des semaines précédentes. La SSED l’a adoptée pour le diagnostic en 2011 si la méthode est standardisée selon le DCCT et l’UKPDS. Elle varie peu (environ 2 % contre 12 à 15 % pour la glycémie à jeun), ne dépend ni de l’heure ni du stress et prédit mieux les complications.</p><div class="key"><b>Pièges.</b> Elle n’est pas adaptée comme critère diagnostique dans certaines situations, notamment en cas d’hémoglobinopathie, d’hémolyse, de transfusion, d’insuffisance rénale ou hépatique sévère, de diabète gestationnel ou de suspicion de type 1. La carence en fer l’élève faussement ; les fortes doses de vitamines C et E la perturbent ; après 70 ans, elle s’élève d’environ 0,4 %.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011, tableaux 1 et 2</a>.</p></template>
<template data-pop="e11-hgpo" data-title="Hyperglycémie provoquée par voie orale"><p>Après un jeûne de 8 heures, le patient boit 75 g de glucose ; la glycémie plasmatique est mesurée à deux heures. Une valeur ≥ 11,1 mmol/L signe un diabète, une valeur de 7,8 à 11,0 mmol/L une intolérance au glucose. Pendant le test, le patient reste au repos et ne mange pas.</p><div class="key"><b>Contentieux.</b> L’ESC 2023 la retient dans les cas douteux, notamment lorsque glycémie et HbA1c ne concordent pas. Après une hyperglycémie de stress, recontrôler à distance ; la valeur mesurée pendant la maladie aiguë ne suffit pas à classer une dysglycémie chronique.</div><p class="src">Références : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023</a>.</p></template>
<template data-pop="e11-prediabete" data-title="Prédiabète : des seuils discutés"><p>Le prédiabète désigne une glycémie au-dessus de la normale mais sous le seuil du diabète. Pour l’HbA1c, l’OMS retient 6,0 à 6,4 % (42 à 47 mmol/mol) et l’American Diabetes Association 5,7 à 6,4 % (39 à 47 mmol/mol) ; la glycémie à jeun anormale commence à 6,1 mmol/L pour l’OMS et à 5,6 mmol/L pour l’American Diabetes Association.</p><div class="key"><b>Arbitrage.</b> La SSED a adopté en 2011 les seuils larges (HbA1c 5,7 à 6,4 %, glycémie 5,6 à 6,9 mmol/L) ; c’est le texte suisse en vigueur. La priorité est le mode de vie et la surveillance du risque ; la décision médicamenteuse ne découle pas du seul terme « prédiabète ». Les seuils différents classent des populations différentes et doivent être explicités.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011 (texte en vigueur)</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, tableau 6</a>.</p></template>
<template data-pop="e11-cpeptide" data-title="Auto-anticorps et peptide C"><p>Les auto-anticorps anti-GAD, anti-IA2 et anti-ZnT8 étayent un diabète auto-immun ; leur absence ne l’exclut pas. Le peptide C, libéré avec l’insuline endogène lors du clivage de la proinsuline, explore la sécrétion résiduelle.</p><p>La SSED 2023 cite un peptide C de 200 à 600 pmol/L, avec anticorps négatifs et sans histoire familiale forte, comme profil de déficit insulinique. Cette plage sert à orienter et non à diagnostiquer à elle seule un type ; la glycémie lors du prélèvement et la situation clinique comptent. La SSED propose une réévaluation trois ans plus tard si la classification reste incertaine.</p><div class="alert"><b>Priorité.</b> Une cétose, un amaigrissement ou une décompensation aiguë imposent de rechercher l’acidose et de traiter la carence insulinique ; le résultat des anticorps ne doit pas retarder l’insuline. La génétique d’un éventuel MODY se discute avec le spécialiste.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, recommandation sur le déficit insulinique</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2</a> ; <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, diagnostic</a>.</p></template>
<template data-pop="e11-stress" data-title="Hyperglycémie de stress"><p>Une hyperglycémie apparaît souvent à l’hôpital, au cours d’un syndrome coronarien aigu ou d’une insuffisance cardiaque, sans diabète préexistant. Une glycémie élevée avec une HbA1c normale la suggère. Elle s’associe à un pronostic hospitalier défavorable.</p><div class="key"><b>Conduite.</b> L’ESC propose une HGPO quelques semaines après la sortie pour écarter un diabète ou une intolérance au glucose.</div><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2.4</a>.</p></template>
<template data-pop="e11-hypo" data-title="Hypoglycémie : niveaux et conséquences"><p>Dans une prise de position conjointe de l’American Diabetes Association et de l’EASD, l’International Hypoglycaemia Study Group distingue trois niveaux : une valeur d’alerte à 3,9 mmol/L, une hypoglycémie cliniquement significative &lt; 3,0 mmol/L et une hypoglycémie sévère, définie par la nécessité de l’aide d’un tiers. Les seuils des symptômes s’abaissent chez le patient qui fait des hypoglycémies répétées : il perd ses signes d’alerte.</p><div class="key"><b>Conséquences.</b> Les hypoglycémies sévères sont associées à des événements cardiovasculaires et à une mortalité accrue dans des populations à risque ; ces associations ne prouvent pas une causalité unique (prise de position conjointe 2017). Dans ACCORD, viser une HbA1c inférieure à 6,0 % a augmenté la mortalité (257 contre 203 décès) avec davantage d’hypoglycémies sévères.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6518070/" target="_blank" rel="noopener">International Hypoglycaemia Study Group, 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED, document d’alternatives aux insulines, état août 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18539917/" target="_blank" rel="noopener">ACCORD, 2008</a>.</p></template>
<template data-pop="e11-glucagon" data-title="Glucagon par voie nasale"><p><b>Baqsimi®, FI mars 2026.</b> Glucagon nasal pour l’hypoglycémie sévère chez le diabétique dès un an : <b>dose unique de 3 mg dans une narine</b>. L’absorption est passive, sans inspiration requise. Le dispositif est unidose ; la FI ne fournit pas de schéma répété universel. Prévenir les secours, surveiller le patient et ne rien faire avaler tant qu’il ne peut pas déglutir en sécurité.</p><p>Quand il a récupéré et peut avaler, donner des glucides par voie orale pour reconstituer les réserves hépatiques et prévenir la récidive. Le glucagon agit peu si le glycogène est épuisé, notamment après jeûne prolongé ou abus chronique d’alcool ; une prise en charge avec glucose par les professionnels peut être nécessaire.</p><p><b>Restrictions.</b> Contre-indications : hypersensibilité et phéochromocytome ; prudence en cas d’insulinome. Pas d’adaptation de dose rénale/hépatique, mais pas d’étude formelle de ces situations. La FI permet l’usage pendant grossesse et allaitement. Les proches doivent connaître le dispositif avant l’urgence.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Information professionnelle suisse Baqsimi® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-shh" data-title="État hyperglycémique hyperosmolaire"><p>L’état hyperglycémique hyperosmolaire conserve assez d’insuline pour limiter la cétogenèse, mais pas assez pour empêcher l’hyperglycémie. La glycosurie entraîne une diurèse osmotique ; la déshydratation réduit la filtration et amplifie l’hyperglycémie.</p><div class="alert"><b>Critères du consensus conjoint 2024 : les quatre doivent être réunis.</b> Glycémie ≥ 33,3 mmol/L ; osmolalité efficace &gt; 300 mOsm/kg ou totale &gt; 320 mOsm/kg ; β-hydroxybutyrate &lt; 3,0 mmol/L ou cétonurie &lt; 2+ ; pH ≥ 7,3 et bicarbonates ≥ 15 mmol/L. L’osmolalité efficace se calcule par 2 × Na⁺ + glucose ; la totale ajoute l’urée, toutes les concentrations en mmol/L.</div><p>Le traitement relève de l’hôpital : réhydratation par cristalloïde isotone, recherche du facteur déclenchant, surveillance glycémique, rénale, potassique et neurologique. Le consensus 2024 propose l’insuline intraveineuse à 0,05 unité/kg/heure dans la forme isolée sans acidose ; une forme mixte avec acidocétose demande 0,1 unité/kg/heure. La FI de NovoRapid® autorise la voie intraveineuse uniquement sous contrôle professionnel, avec surveillance du glucose et du potassium. Le protocole JBDS 2023 attend la fin de la baisse glycémique sous réhydratation dans la forme isolée ; cette attente ne s’applique pas à une acidocétose associée.</p><div class="key"><b>Sécurité.</b> La baisse de l’osmolalité doit rester de 3 à 8 mOsm/kg/heure. Le remplissage est plus prudent chez le sujet âgé ou insuffisant cardiaque/rénal. Si le potassium est &lt; 3,5 mmol/L, le consensus 2024 demande de corriger d’abord l’hypokaliémie et de différer l’insuline jusqu’à &gt; 3,5 ; appliquer le protocole hospitalier avec surveillance rapprochée. La mortalité varie fortement selon la population et les causes associées : aucun pourcentage unique n’est applicable à tous les patients.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, figure 2 et traitement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS 2023, traitement</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Information professionnelle suisse NovoRapid® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-acd-isglt2" data-title="Acidocétose sous inhibiteur du SGLT2"><p>L’acidocétose associe trois éléments : diabète connu ou glycémie ≥ 11,1 mmol/L ; β-hydroxybutyrate ≥ 3,0 mmol/L ou cétonurie ≥ 2+ ; pH &lt; 7,3 et/ou bicarbonates &lt; 18 mmol/L. Environ 10 % des cas sont euglycémiques, avec une glycémie &lt; 11,1 mmol/L ; un inhibiteur du SGLT2 en est un facteur de risque.</p><p>Devant nausées, vomissements, douleur abdominale, dyspnée ou grande fatigue sous ce traitement, mesurer les cétones et le gaz du sang quelle que soit la glycémie. Arrêter le produit et organiser une évaluation hospitalière immédiate. La cétose seule ne suffit pas à poser une acidocétose : il faut rechercher l’acidose.</p><div class="alert"><b>Conduite hospitalière.</b> Liquides, insuline, correction et surveillance des électrolytes, puis traitement de la cause. Si le potassium est &lt; 3,5 mmol/L, il doit être corrigé avant l’insuline ; des apports de glucose permettent de poursuivre l’insuline lorsque la glycémie est déjà basse. La reprise ultérieure d’un inhibiteur du SGLT2 n’est pas automatique : vérifier le facteur déclenchant et le bénéfice–risque.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, diagnostic et traitement</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680632270014" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-acidose-lactique" data-title="Acidose lactique sous metformine"><p>L’acidose lactique est très rare, de 3 à 5 cas pour 100 000 années-patients. Elle survient presque toujours lors d’une insuffisance rénale aiguë ou d’une hypoxie : déshydratation, sepsis, choc, insuffisance cardiaque décompensée, infarctus récent, intoxication alcoolique. Elle associe dyspnée acidosique, douleurs abdominales, crampes, hypothermie puis coma ; le pH est inférieur à 7,35 et les lactates dépassent 5 mmol/L.</p><div class="key"><b>Conduite.</b> Hospitalisation immédiate ; l’hémodialyse élimine le lactate et la metformine.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (10.2025)</a>.</p></template>
<template data-pop="e11-fournier" data-title="Gangrène de Fournier"><p>La fasciite nécrosante du périnée est une infection rare et grave rapportée chez des hommes et des femmes sous inhibiteur du SGLT2. Douleur, sensibilité, érythème ou tuméfaction génitale ou périnéale, avec fièvre ou malaise, imposent un examen immédiat.</p><div class="key"><b>Conduite.</b> Arrêt du médicament, antibiotiques à large spectre et débridement chirurgical si nécessaire.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (07.2025)</a>.</p></template>
<template data-pop="e11-mrc" data-title="Maladie rénale diabétique"><p>Le dépistage comprend au moins chaque année créatinine/DFG estimé et rapport albumine/créatinine urinaire. Une anomalie persistante pendant au moins trois mois établit la chronicité : DFG &lt; 60 mL/min/1,73 m² ou albuminurie au moins de catégorie A2 (≥ 3 mg/mmol). Classer ensemble la cause, le DFG et l’albuminurie ; répéter un résultat inhabituel.</p><p>En cas d’hypertension albuminurique, la recommandation suisse utilise un bloqueur du système rénine–angiotensine avec contrôle de la créatinine et du potassium. Ajouter un inhibiteur du SGLT2 adapté à son indication et à sa FI ; les seuils d’initiation sont propres au produit, et Forxiga® s’arrête avant dialyse ou transplantation. Une finérénone peut se discuter si l’albuminurie persiste, DFG ≥ 25 et potassium compatible ; sa dose et ses contrôles suivent la FI Kerendia®.</p><p><b>Résultats d’essais.</b> FLOW : réduction relative de 24 % d’un critère composite d’événements rénaux majeurs incluant le décès cardiovasculaire, chez 3533 patients, sémaglutide 1 mg/semaine. FIDELIO-DKD : réduction relative de 18 % du critère rénal composite sous finérénone, chez des patients albuminuriques déjà sous blocage rénine–angiotensine maximal toléré ; ces critères ne sont pas identiques.</p><div class="key"><b>Adresser au néphrologue.</b> Hématurie persistante, sédiment actif, chute rapide et durable du DFG, albuminurie A3 en progression, syndrome néphrotique ou histoire familiale suggérant une autre cause. La grille suisse cite notamment une baisse &gt; 5 mL/min/an ; le contexte décide de l’urgence et du suivi.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED et Société suisse de néphrologie 2024, dépistage et signaux d’alarme</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38785209/" target="_blank" rel="noopener">FLOW 2024, résumé consulté</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33264825/" target="_blank" rel="noopener">FIDELIO-DKD 2020, résumé consulté</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680632270014" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-retino" data-title="Rétinopathie diabétique"><p>L’ophtalmologue recherche une rétinopathie au diagnostic et organise ensuite la surveillance selon le résultat et le risque. La grille suisse de qualité 2017 prévoit un examen au moins tous les deux ans ; un patient déjà atteint nécessite un calendrier spécialisé plus rapproché. Toute baisse visuelle aiguë impose une évaluation urgente.</p><p>Une amélioration glycémique rapide peut aggraver transitoirement une rétinopathie préexistante. Dans SUSTAIN-6, la FI suisse d’Ozempic® rapporte des complications rétiniennes chez 3,0 % contre 1,8 % sous placebo ; plus de 80 % des cas concernés avaient une rétinopathie initiale. Il faut en informer le patient et surveiller les patients à risque, particulièrement sous insuline.</p><div class="alert"><b>Autre signal oculaire.</b> La FI 07.2026 d’Ozempic® mentionne la neuropathie optique ischémique antérieure non artéritique : une perte soudaine de vision exige un examen ophtalmologique urgent ; le traitement s’arrête si ce diagnostic est confirmé.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED 2017, suivi ophtalmologique</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-b12" data-title="Vitamine B12 sous metformine"><p>La metformine au long cours diminue l’absorption de la vitamine B12 ; le risque de carence augmente avec la dose et la durée. L’information professionnelle suisse recommande un dosage régulier, par exemple annuel, surtout en cas d’anémie ou de neuropathie.</p><div class="key"><b>Piège.</b> La FI de Glucophage® demande de rechercher un déficit en B12 devant anémie ou neuropathie ; le diagnostic de neuropathie diabétique ne dispense pas de ce contrôle.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (10.2025)</a>.</p></template>
<template data-pop="e11-cetones" data-title="Corps cétoniques, gaz veineux et osmolalité"><p>Le dosage direct du β-hydroxybutyrate sanguin est préférable à la bandelette urinaire, qui mesure surtout l’acétoacétate et peut sous-estimer la cétose au début puis la surestimer pendant la guérison. Un seuil ≥ 3,0 mmol/L a une sensibilité et une spécificité supérieures à 90 % pour l’acidocétose dans le consensus 2024, mais s’interprète avec le diabète et l’acidose.</p><table class="t"><tr><th>Gravité de l’acidocétose</th><th>Acidose et cétones (consensus 2024, tableau 2)</th></tr><tr><td>Légère</td><td>pH &gt; 7,25 à &lt; 7,30 ou bicarbonates 15 à 18 ; β-hydroxybutyrate 3 à 6 mmol/L.</td></tr><tr><td>Modérée</td><td>pH 7,0 à 7,25 ou bicarbonates 10 à &lt; 15 ; β-hydroxybutyrate 3 à 6.</td></tr><tr><td>Sévère</td><td>pH &lt; 7,0 ou bicarbonates &lt; 10 ; β-hydroxybutyrate &gt; 6 ; altération marquée de la conscience.</td></tr></table><div class="key"><b>Interprétation.</b> L’état mental et la situation clinique déterminent aussi le niveau de soins ; toutes les variables d’une colonne n’ont pas à être réunies. Pour l’état hyperosmolaire, calculer l’osmolalité efficace 2 × Na⁺ + glucose (&gt; 300), ou la totale en ajoutant l’urée (&gt; 320), en mOsm/kg.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, figure 2 et tableau 2</a>.</p></template>
