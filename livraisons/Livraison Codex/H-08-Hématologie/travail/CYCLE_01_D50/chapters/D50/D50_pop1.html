<template data-pop="d50-anemie-def" data-title="Seuils d’anémie de l’OMS 2024"><p class="lab">Définition</p><p>L’OMS définit l’anémie par une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> inférieure au 5<sup>e</sup> percentile de populations saines : 95 % des sujets sains ont une valeur plus élevée. Chez l’adulte de 15 à 65 ans, le seuil est de 130 g/L chez l’homme et de 120 g/L chez la femme non enceinte. Pendant la grossesse, il est de 110 g/L au premier et au troisième trimestre, et de 105 g/L au deuxième. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> baisse alors transitoirement d’environ 5 g/L. Les catégories ci-dessous classent la gravité biologique selon la population.</p><table class="t"><tr><th>Population</th><th>Légère</th><th>Modérée</th><th>Sévère</th></tr><tr><td>Homme</td><td>110–129</td><td>80–109</td><td>&lt; 80</td></tr><tr><td>Femme non enceinte</td><td>110–119</td><td>80–109</td><td>&lt; 80</td></tr><tr><td>Grossesse, 2<sup>e</sup> trimestre</td><td>95–104</td><td>70–94</td><td>&lt; 70</td></tr></table><p>La catégorie dépend de la population : une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de 90 g/L correspond à une anémie modérée dans les trois lignes. La gravité biologique ne remplace pas l’évaluation clinique ; la même <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> peut être tolérée différemment selon la vitesse de sa baisse.</p><p class="lab">Corrections</p><p>L’altitude de résidence élève l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> : le seuil augmente de 4 g/L entre 500 et 999 m, de 8 g/L entre 1000 et 1499 m, de 11 g/L entre 1500 et 1999 m. Une correction pour le tabagisme existe aussi.</p><div class="key"><b>Limite.</b> Le seuil masculin de 130 g/L a été conservé malgré des données suggérant 135 g/L ; la gravité se juge sur la clinique autant que sur le chiffre.</div><p class="src">Référence : <a href="https://iris.who.int/handle/10665/376196" target="_blank" rel="noopener">OMS 2024, tableaux 2 à 4</a>.</p></template>
<template data-pop="d50-ferritine" data-title="Ferritine : ce qu’un seuil permet de conclure"><h3>Mesure et seuils sans inflammation</h3><p>La ferritine est le marqueur isolé le plus utile des réserves. La BSG 2021 décrit une ferritine &lt; 15 µg/L comme indiquant des réserves absentes, avec une spécificité de 99 %, et &lt; 30 µg/L comme généralement compatible avec des réserves basses. Onkopedia avec SGH/SSH 2025 retient également le repère de 30 µg/L pour les réserves insuffisantes. Il ne faut pas extrapoler à tout adulte la probabilité de 90 % donnée par gynécologie suisse pour les femmes enceintes.</p><h3>Inflammation et limites</h3><p>La ferritine augmente avec inflammation, infection, atteinte hépatique et cancer. L’OMS 2020 propose conditionnellement &lt; 70 µg/L pour indiquer une carence chez l’adulte inflammatoire, avec faible certitude ; le seuil &lt; 100 µg/L du Delphi suisse concerne les <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> avec inflammation. Une ferritine &gt; 150 µg/L rend la carence absolue peu probable dans le cadre général de la BSG, mais n’exclut pas à elle seule la carence en oncologie ou en maladie hépatique.</p><p>Dans les premières semaines après une perfusion ou après un accouchement, la valeur peut être élevée sans refléter les réserves initiales. Le Delphi 2019 propose le contrôle huit à douze semaines après la voie intraveineuse ; l’information professionnelle Ferinject® juge une mesure avant quatre semaines prématurée. La ferritine se lit avec CRP, TSAT et contexte.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS, ferritine 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a>.</p></template>
<template data-pop="d50-tsat" data-title="Saturation de la transferrine : méthode et interprétation"><h3>Définition et valeur normale</h3><p>La TSAT est le rapport du fer sérique à la capacité totale de fixation de la transferrine, en pour cent. Une molécule de transferrine fixe au plus deux ions de fer ; à 50 % de saturation, elle porte en moyenne un ion. Onkopedia 2025 donne un intervalle usuel de 16 à 45 % : il doit être confronté à celui du laboratoire, et ne se réduit pas au seuil thérapeutique de 20 %.</p><h3>Interprétation</h3><p>Une valeur basse soutient une restriction de disponibilité du fer. Le Delphi suisse 2019 utilise &lt; 20 % dans plusieurs contextes ; Onkopedia 2025 décrit ≤ 15 % pour une érythropoïèse carencée. Cette différence dépend de la question clinique : aucune valeur unique ne distingue seule des réserves vides d’une séquestration inflammatoire.</p><p>Le fer sérique varie selon l’heure et baisse sous inflammation. La transferrine, protéine négative de phase aiguë, peut également baisser et modifier le rapport. Une mesure peu après la prise orale est trompeuse : l’information professionnelle Feraccru® observe un pic de TSAT une heure et demie à trois heures après l’administration. La réponse clinique et le reste du bilan déterminent l’interprétation.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">information professionnelle suisse Feraccru®, août 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et al., Br J Haematol 2025, avis d’experts</a>.</p></template>
<template data-pop="d50-seuil" data-title="Seuils de ferritine : populations et divergences"><h3>Un seuil répond à une question précise</h3><p>Le seuil diagnostique varie avec la population et l’inflammation. La comparaison sépare la mesure des réserves de la décision de traiter.</p><table class="t"><tr><th>Référence et population</th><th>Seuil</th><th>Portée</th></tr><tr><td>OMS 2020, adulte apparemment sain</td><td>&lt; 15 µg/L</td><td>Déplétion des réserves ; seuil très spécifique</td></tr><tr><td>Onkopedia avec SGH/SSH, avril 2025, adulte sans inflammation</td><td>&lt; 30 µg/L</td><td>Réserves insuffisantes ; consensus diagnostique croissant</td></tr><tr><td>Delphi suisse 2019, carence sans anémie et sans inflammation</td><td>&lt; 30 µg/L ; ou 30–50 µg/L avec TSAT &lt; 20 %</td><td>Accord critique ; ne constitue pas un seuil universel de prescription</td></tr><tr><td>gynécologie suisse 2022, grossesse</td><td>&lt; 30 µg/L</td><td>Traitement proposé même sans anémie, compte tenu des besoins gestationnels</td></tr><tr><td>OMS 2020, adulte avec inflammation</td><td>&lt; 70 µg/L</td><td>Peut indiquer une carence ; recommandation conditionnelle de faible certitude</td></tr><tr><td>Delphi suisse 2019, <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> avec inflammation</td><td>&lt; 100 µg/L</td><td>Critère spécialisé ; ne s’applique pas à toute CRP élevée</td></tr></table><p>Une ferritine de 25 µg/L chez un adulte sans inflammation indique des réserves insuffisantes selon Onkopedia. Elle ne signifie pas, à elle seule, anémie ni indication intraveineuse. Le seuil de 100 µg/L appartient ici aux <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> inflammatoires ; il ne s’étend pas à toute CRP élevée.</p><h3>Divergence thérapeutique suisse</h3><p>Pour la simple déplétion sans anémie, le Delphi 2019 admet un traitement oral si elle est symptomatique. Onkopedia 2025 réserve le traitement du seul stade de réserves basses à certaines situations, et traite les stades avec restriction érythropoïétique. mediX 08/2025 ne propose pas de substitution générale au-delà de 15 µg/L sans anémie ni inflammation ; il est également plus restrictif pendant la grossesse.</p><p>Dans ce cours, la source spécialisée gynécologique gouverne la grossesse, et la distinction des stades d’Onkopedia organise le diagnostic hématologique. Pour une fatigue isolée sans anémie, la décision reste individualisée : les divergences sont expliquées au patient et une perfusion ne découle pas d’un chiffre seul. L’OFSP 2020 trouve un bénéfice moyen sur certains scores de fatigue, sans relation démontrée entre ferritine initiale et amplitude de ce bénéfice dans son analyse individuelle. Il ne faut pas transformer cette observation en promesse personnelle.</p><div class="trap"><span class="k">Erreur fréquente</span> L’erreur consiste à appliquer le seuil obstétrical de 30 µg/L à tout adulte, puis à en déduire une indication de perfusion. Le diagnostic de réserves basses, le diagnostic d’anémie et le choix du traitement sont trois décisions distinctes.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a> ; <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020, page du 14.01.2025</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS, ferritine 2020</a>.</p></template>
<template data-pop="d50-stades" data-title="Stades de la carence : réserves et érythropoïèse"><h3>Progression décrite par Onkopedia 2025</h3><ol><li><b>Déplétion des réserves.</b> La ferritine diminue ; <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et indices globulaires restent normaux. Il n’existe pas encore de restriction érythropoïétique démontrée.</li><li><b>Érythropoïèse carencée.</b> L’approvisionnement médullaire devient insuffisant ; contenu réticulocytaire en <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> bas, hématies hypochromes et marqueurs d’incorporation perturbés peuvent apparaître avant la baisse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>.</li><li><b>Anémie ferriprive.</b> L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> passe sous le seuil applicable ; hypochromie et microcytose sont fréquentes, mais peuvent manquer au début ou dans une carence mixte.</li></ol><p>Les marqueurs de restriction, notamment protoporphyrine de zinc et récepteur soluble, ne doivent pas être décrits comme forcément élevés dans une simple déplétion isolée. Les seuils précis dépendent de la méthode analytique.</p><p>Le guide Onkopedia traite les stades avec restriction érythropoïétique. Pour le seul stade de réserves basses, la décision dépend de situations particulières ; les positions suisses sur la fatigue sans anémie divergent, comme l’explique la <button class="w" data-k="d50-seuil">comparaison des seuils et indications</button>.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a>.</p></template>
<template data-pop="d50-fonctionnelle" data-title="Carence absolue et carence fonctionnelle"><p class="lab">Définitions</p><p>Dans la carence absolue, les réserves sont insuffisantes pour les besoins. Dans la carence fonctionnelle, les réserves des macrophages paraissent normales, mais le fer n’est pas livré à la moelle, car l’hepcidine, élevée par l’inflammation et l’interleukine 6, bloque la ferroportine.</p><p class="lab">Où la rencontrer</p><p>La restriction fonctionnelle accompagne l’insuffisance rénale chronique, notamment sous agents stimulant l’érythropoïèse. Elle accompagne aussi la polyarthrite rhumatoïde, les <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button>, le cancer et l’insuffisance cardiaque.</p><p class="lab">Comment la reconnaître</p><p>La ferritine reste normale ou élevée, alors que la TSAT est inférieure à 20 %. Le contenu réticulocytaire en hémoglobine est bas selon le seuil de l’automate. Une très bonne réponse au fer oral oriente au contraire vers une carence absolue.</p><div class="key"><b>Piège.</b> Les deux formes coexistent souvent : une inflammation n’exclut pas un saignement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, carence fonctionnelle</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-bilan" data-title="Le bilan quotidien du fer"><p class="lab">Chiffres normaux</p><p>Le corps contient environ 4 g de fer chez l’homme et 2,5 g chez la femme. Les pertes atteignent environ 1 mg par jour chez l’homme par desquamation intestinale, et 2 mg chez la femme réglée. L’alimentation apporte 10 à 14 mg par jour, dont 0,5 à 2 mg sont absorbés, soit 5 à 15 %. Le repère nutritionnel de 14 mg cité par Clénin 2017 est général ; il ne remplace pas les recommandations propres à l’âge, au sexe et à la grossesse.</p><p class="lab">Capacité d’adaptation</p><p>En cas de pertes ou de besoins accrus, l’absorption peut augmenter fortement, jusqu’à quadrupler dans les estimations de Clénin 2017, et la biodisponibilité monter jusqu’à 35 % en cas de carence, à condition que l’alimentation apporte assez de fer. Une anémie ferriprive ne peut toutefois pas être corrigée par l’alimentation seule.</p><div class="key"><b>Exemple.</b> Une perte de 10 mL de sang par jour, invisible dans les selles, représente environ 5 mg de fer, soit plusieurs fois l’absorption quotidienne habituelle de 0,5 à 2 mg.</div><p class="src">Référence : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a>.</p></template>
<template data-pop="d50-hepcidine" data-title="L’hepcidine"><p class="lab">Rôle</p><p>Peptide produit par l’hépatocyte, l’hepcidine provoque l’internalisation de la ferroportine, seul exportateur cellulaire du fer. Elle bloque ainsi l’absorption intestinale et la libération du fer par les macrophages.</p><p class="lab">Régulation</p><p>Elle augmente quand le fer abonde, en cas d’inflammation et après un effort intense ; elle baisse quand les réserves s’épuisent et quand l’érythropoïèse s’accélère, par l’intermédiaire de l’érythroferrone.</p><p class="lab">Application au traitement</p><p>La BSG rapporte chez des femmes sélectionnées avec des réserves basses qu’une dose d’au moins 60 mg élève l’hepcidine pendant 24 heures et réduit de 35 à 45 % l’absorption fractionnelle de la dose du lendemain. L’étude zurichoise Karczewski 2024, menée chez quinze femmes sélectionnées avec ferritine ≤ 30 µg/L et <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ≥ 117 g/L, mesure aussi une augmentation dose-dépendante sept heures après la prise. Il s’agit d’un marqueur physiologique, pas d’une démonstration de supériorité clinique d’un schéma.</p><div class="key"><b>Conséquence.</b> Les prises rapprochées peuvent réduire la fraction absorbée de la dose suivante ; une prise unique ou un jour sur deux exploite mieux la capacité d’absorption.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, passage clinique cité</a> ; <a href="https://doi.org/10.57187/s.3635" target="_blank" rel="noopener">Karczewski et al., Swiss Med Wkly 2024</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-tissus" data-title="Conséquences tissulaires de la carence"><p class="lab">Mécanisme</p><p>Le fer est indispensable à la myoglobine, aux cytochromes de la chaîne respiratoire, à la phosphorylation oxydative, à la synthèse de neurotransmetteurs et à la myélinisation. Chez l’animal, la carence sans anémie diminue déjà le nombre de mitochondries et l’activité des enzymes respiratoires ; l’anémie, elle, atteint surtout le transport de l’oxygène.</p><p class="lab">Manifestations</p><p>Le patient peut présenter une fatigue, une baisse de capacité d’effort, des troubles de l’attention ou de la mémoire. Les autres manifestations comprennent jambes sans repos, chute de cheveux, céphalées et ongles cassants. Une koilonychie, une chéilite ou une glossite atrophique peuvent s’y associer.</p><div class="key"><b>Limite.</b> Ces symptômes sont peu spécifiques ; une amélioration sous traitement est un argument, mais ne prouve pas à elle seule que la carence expliquait tous les symptômes, compte tenu des autres causes et de l’effet placebo.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-digestif" data-title="Saignement digestif occulte"><p class="lab">Fréquence</p><p>Chez l’homme et la femme ménopausée, environ un tiers des explorations découvrent une lésion significative ; un cancer est trouvé dans 8 à 10 % des cas, une double lésion haute et basse dans 1 à 10 %.</p><p class="lab">Lésions</p><p>Les pertes peuvent provenir d’un adénocarcinome colique ou œso-gastrique, d’un ulcère peptique, de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ou d’angioectasies. Ces dernières sont fréquentes chez le sujet âgé. Une entéropathie aux AINS, une tumeur du grêle ou une parasitose constituent d’autres causes, les deux dernières étant plus rares.</p><div class="key"><b>Piège.</b> L’anémie ferriprive peut être la première manifestation d’un cancer digestif, sans aucun symptôme abdominal ; un test de sang occulte négatif ne l’exclut pas.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, tableau 1 et section imagerie</a>.</p></template>
<template data-pop="d50-menorragies" data-title="Ménorragies"><p class="lab">Poids épidémiologique</p><p>Les pertes menstruelles sont la cause la plus fréquente de carence chez la femme non ménopausée. Dans une étude de femmes jeunes souffrant de ménorragies, plus de la moitié avaient des réserves basses, mais seulement 25 % étaient anémiques.</p><p class="lab">Conduite</p><p>Le médecin quantifie les règles et recherche une cause gynécologique lorsque le saignement est anormal. L’information professionnelle rapporte un bénéfice du fer intraveineux dans un essai de patientes ayant une anémie liée à une hémorragie utérine ; il ne s’agit pas d’une supériorité universelle dans toute ménorragie : le carboxymaltose a obtenu une hausse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de plus de 20 g/L chez 82 % des patientes après une hémorragie utérine grave, contre 61,8 % sous fer oral.</p><div class="key"><b>Piège.</b> Une carence disproportionnée aux pertes, récidivante ou associée à un signe d’alerte justifie une exploration digestive même chez la femme jeune.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Information professionnelle suisse Ferinject®</a>.</p></template>
<template data-pop="d50-osler" data-title="Télangiectasie hémorragique héréditaire (maladie de Rendu et Osler)"><p>La télangiectasie hémorragique héréditaire est une maladie vasculaire qui expose à des épistaxis répétées et à des pertes sanguines chroniques. L’inspection des lèvres, de la langue, de la muqueuse buccale et des doigts peut orienter vers le diagnostic ; une télangiectasie isolée ne suffit pas à le confirmer.</p><p class="lab">Conséquences pour le traitement</p><p>Les pertes chroniques épuisent les réserves et peuvent nécessiter un fer intraveineux répété. L’information professionnelle suisse du carboxymaltose cite cette maladie parmi les facteurs de risque d’ostéomalacie hypophosphatémique en cas de doses élevées répétées : le phosphate sérique doit alors être surveillé.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025</a>.</p></template>
<template data-pop="d50-coeliaque" data-title="Maladie cœliaque et carence martiale"><p class="lab">Fréquence</p><p>La maladie cœliaque est trouvée chez 3 à 5 % des patients explorés pour une anémie ferriprive inexpliquée ; elle réduit l’absorption intestinale du fer.</p><p class="lab">Dépistage</p><p>Le test initial est l’anticorps IgA anti-transglutaminase tissulaire, avec un dosage simultané des IgA totales pour écarter un déficit en IgA ; le patient doit consommer du gluten. Le groupe européen de 2025 range la carence martiale chronique et l’anémie inexpliquée parmi les indications de dépistage.</p><p class="lab">Limites</p><p>La sensibilité de la sérologie baisse avec l’âge, jusqu’à 74 % chez les patients cœliaques révélés par une anémie ferriprive. Chez le sujet âgé, des biopsies duodénales au cours de la gastroscopie sont donc préférables.</p><div class="key"><b>Conséquence.</b> Une anémie qui ne répond pas au fer oral chez un adulte jeune fait rechercher une maladie cœliaque.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12704582/" target="_blank" rel="noopener">Société européenne d’étude de la maladie cœliaque, recommandations 2025, partie 1</a>.</p></template>
<template data-pop="d50-gastrite" data-title="Gastrite atrophique, Helicobacter pylori et inhibiteurs de la pompe à protons"><p class="lab">Mécanisme commun</p><p>L’acidité gastrique favorise l’absorption du fer alimentaire. Toute achlorhydrie, qu’elle provienne d’une gastrite atrophique, d’une gastrectomie ou d’un traitement prolongé par inhibiteur de la pompe à protons, la réduit.</p><p class="lab">Données</p><p>La gastrite atrophique est plus fréquente chez les patients sans autre cause d’anémie ferriprive. L’association avec Helicobacter pylori est faible et pourrait passer par l’ulcère ou l’atrophie ; dans une méta-analyse, l’éradication n’améliore pas la réponse au fer.</p><div class="key"><b>Conséquence.</b> Les biopsies gastriques systématiques restent discutées ; une gastrite atrophique, cause irréversible, peut justifier un traitement martial au long cours.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-bariatrique" data-title="Chirurgie gastrique et bariatrique"><p class="lab">Mécanisme</p><p>Après une dérivation gastrique de Roux en Y, la sécrétion acide diminue et l’intestin grêle proximal est court-circuité. La BSG décrit une anémie ferriprive chez environ un quart des patients deux ans après une dérivation de Roux en Y. Une réponse orale insuffisante peut conduire à choisir le fer intraveineux ; la chirurgie n’explique pas automatiquement toute nouvelle anémie.</p><p class="lab">Donnée suisse</p><p>Dans une série rétrospective monocentrique à Lausanne de 77 patients opérés avec des dosages avant et après la perfusion, 63,6 % ont développé une hypophosphatémie inférieure à 0,8 mmol/L après une perfusion de carboxymaltose ; la dose de 500 mg était associée, dans le modèle ajusté, à une baisse moyenne du phosphate supérieure de 0,26 mmol/L à celle associée à 250 mg (p = 0,020). La sélection des dossiers et des mesures limite l’extrapolation de cette fréquence ; cette série ne fournit pas une probabilité individuelle pour tous les patients opérés.</p><div class="key"><b>Piège.</b> Une carence nouvelle chez un opéré ne dispense pas de chercher une autre cause, notamment digestive.</div><p class="src">Références : <a href="https://doi.org/10.57187/s.3771" target="_blank" rel="noopener">Pereira Portela et al., Swiss Med Wkly 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-sport" data-title="Carence martiale du sportif d’endurance"><p class="lab">Mécanismes</p><p>Les besoins augmentent avec l’entraînement intensif ; l’effort intense provoque en outre des pics d’hepcidine qui bloquent l’absorption. Un apport énergétique insuffisant et une alimentation végétarienne s’y ajoutent souvent.</p><p class="lab">Preuves</p><p>Les essais chez des sportifs sans anémie sont hétérogènes. Ils ne démontrent pas une amélioration fiable de la performance chez les athlètes aux réserves normales ; certains observent un bénéfice dans des groupes carencés.</p><div class="key"><b>Conduite.</b> Le seuil de ferritine retenu est de 30 µg/L. Le traitement associe conseils diététiques et fer oral ; un apport intermittent peut répondre à des baisses répétées des réserves. Une recherche de performance ne constitue pas une indication de fer intraveineux.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017, tableau 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-irida" data-title="Anémie ferriprive réfractaire au fer"><p>L’anémie réfractaire par carence en fer est une maladie héréditaire rare due à des variants pathogènes de TMPRSS6. Ce gène code la matriptase-2 ; son atteinte maintient l’hepcidine élevée malgré la carence.</p><p class="lab">Reconnaître</p><p>Le patient présente une anémie hypochrome microcytaire avec TSAT très basse, souvent inférieure à 10 %, sans inflammation. La ferritine reste relativement conservée. La réponse au fer oral est nulle ou partielle, et la réponse intraveineuse incomplète. Un rapport TSAT/hepcidine bas peut aider, selon une méthode standardisée et un intervalle adapté à l’âge. Le diagnostic associe profil clinique et analyse génétique, après exclusion des causes acquises.</p><p class="lab">Traiter</p><p>La réponse au fer intraveineux est souvent plus reproductible mais partielle ; aucune recommandation internationale fondée sur des essais n’existe, et la conduite repose sur des avis d’experts.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et al., Br J Haematol 2025</a>.</p></template>
<template data-pop="d50-fatigue" data-title="Fatigue et carence martiale"><p class="lab">Valeur du symptôme</p><p>La fatigue peut motiver la consultation chez un patient carencé, avec ou sans anémie. Elle est banale et a de nombreuses causes : la ferritine en éclaire une seule.</p><p class="lab">Ce que montrent les essais</p><p>L’évaluation de l’OFSP 2020 trouve un bénéfice moyen sur le score continu de fatigue chez des femmes sélectionnées, avec possibilité d’un effet placebo. Elle ne trouve pas d’amélioration statistiquement démontrée du critère binaire d’amélioration globale de la fatigue. Ces résultats ne se transposent pas à toute fatigue ni ne justifient une perfusion d’emblée.</p><div class="key"><b>Conséquence.</b> Les symptômes de la carence se retrouvent dans de nombreuses affections : le médecin recherche les autres causes de fatigue et juge l’effet du fer sur l’évolution des symptômes et de la ferritine.</div><p class="src">Références : <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-jambes" data-title="Syndrome des jambes sans repos"><p>La BSG et le consensus suisse citent le syndrome des jambes sans repos parmi les manifestations de la carence martiale.</p><p class="lab">Seuils particuliers</p><p>Le consensus suisse retient, chez le sujet âgé atteint de ce syndrome, une carence définie par une ferritine inférieure à 50 µg/L ou une TSAT inférieure à 16 % ; le carboxymaltose y améliore significativement les symptômes. Ce seuil reste attribué au Delphi 2019 ; la prise en charge neurologique spécialisée peut utiliser d’autres critères, qui ne sont pas une cible universelle du présent cours.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a> ; <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation 2020</a>.</p></template>
<template data-pop="d50-pica" data-title="Pica et pagophagie"><p>Le pica est l’envie de consommer des substances non alimentaires ; la pagophagie, le besoin de croquer de la glace. La BSG les cite parmi les manifestations relativement propres à la carence martiale, avec la chéilite angulaire et la glossite.</p><div class="key"><b>Conséquence.</b> Ces symptômes, rarement signalés spontanément, se recherchent à l’interrogatoire.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, anamnèse et examen</a>.</p></template>
<template data-pop="d50-phaneres" data-title="Signes des phanères et des muqueuses"><p class="lab">Signes</p><p>La koilonychie correspond à des ongles concaves en cuillère ; les ongles peuvent aussi être cassants. La chéilite angulaire fissure les commissures labiales. La glossite atrophique rend la langue lisse et dépapillée. Des sclérotiques bleues ou une chute de cheveux peuvent s’y associer. Le syndrome de Plummer et Vinson associe une dysphagie à la carence.</p><div class="key"><b>Valeur.</b> Ces signes sont tardifs et inconstants : leur absence n’exclut rien, leur présence oriente fortement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-inflammation" data-title="Restriction martiale sous inflammation"><h3>Mécanisme</h3><p>Les cytokines inflammatoires, notamment l’interleukine 6, augmentent l’hepcidine. La ferroportine est internalisée ; l’export intestinal et macrophagique diminue. Le fer peut alors être stocké mais insuffisamment disponible pour la moelle. D’autres effets inflammatoires réduisent la production et la réponse à l’érythropoïétine.</p><h3>Bilan et décision</h3><p>La ferritine peut être normale ou élevée, la TSAT basse et le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> normal ou modérément abaissé. Un contenu réticulocytaire en <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> bas soutient la restriction ; son seuil dépend de la méthode et de l’automate. Une ferritine &lt; 70 µg/L sous inflammation peut indiquer une carence selon l’OMS 2020, avec une recommandation conditionnelle de faible certitude ; elle ne prouve pas seule l’épuisement absolu des réserves.</p><p>La maladie causale se traite en parallèle. La place du fer dépend de la maladie chronique, des pertes, du stade et de l’information professionnelle exacte ; aucun seuil universel de 100 µg/L n’impose une perfusion. Carence absolue et inflammation peuvent coexister : une perte digestive reste recherchée lorsqu’elle est plausible.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS, ferritine 2020</a>.</p></template>
<template data-pop="d50-thalassemie" data-title="Thalassémie mineure"><p class="lab">Reconnaître</p><p>La microcytose est disproportionnée au degré d’anémie, souvent légère ; ferritine et TSAT sont normales. L’origine et les antécédents familiaux orientent.</p><p class="lab">Confirmer</p><p>Gynécologie suisse demande une électrophorèse ou une chromatographie si le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> est inférieur à 80 fl ou la TCMH inférieure à 27 pg sans carence. L’antécédent familial et l’origine constituent d’autres indications. Une alpha-thalassémie peut donner une électrophorèse normale. Le pourcentage d’hématies hypochromes s’élève même avec des réserves normales.</p><div class="key"><b>Piège.</b> Thalassémie et carence coexistent : la ferritine se dose aussi chez le porteur connu. Une microcytose avec bilan martial normal ne justifie ni fer ni endoscopie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-epreuve" data-title="Épreuve thérapeutique par le fer oral"><p class="lab">Principe</p><p>Lorsque le bilan martial est ambigu, un traitement oral de deux à quatre semaines sert de test : une hausse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’au moins 10 g/L en deux semaines de prise quotidienne est fortement évocatrice d’une carence absolue selon la BSG 2021.</p><p class="lab">Limites</p><p>Ce repère concerne l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’un patient anémique sous prise quotidienne. Le test dépend de l’adhésion ; il ne renseigne pas sur la cause. Une absence de réponse n’exclut pas une carence en cas de malabsorption, d’inflammation ou de saignement persistant.</p><div class="key"><b>Conséquence.</b> L’épreuve ne retarde jamais l’exploration d’un patient à risque de cancer digestif.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 5</a>.</p></template>
<template data-pop="d50-qui-explorer" data-title="Qui explorer, et comment"><p class="lab">Chez tous</p><p>Le bilan initial associe une anamnèse détaillée, une analyse d’urine et une sérologie cœliaque.</p><p class="lab">Homme et femme ménopausée</p><p>La gastroscopie et la coloscopie sont les examens de première intention. La coloscopie virtuelle par tomodensitométrie constitue une alternative si la coloscopie est inadaptée.</p><p class="lab">Femme non ménopausée</p><p>L’endoscopie est indiquée après 50 ans, en l’absence de règles, devant un signe d’alerte ou une carence récidivante ou disproportionnée. Elle l’est également si deux apparentés du premier degré ont un cancer colorectal, ou si un apparenté l’a développé avant 50 ans.</p><p class="lab">Homme jeune</p><p>L’homme jeune suit le même algorithme d’exploration que le sujet âgé.</p><p class="lab">Sujet âgé fragile</p><p>Le médecin discute le bénéfice et le risque avec le patient et sa famille.</p><p class="lab">Carence sans anémie</p><p>La carence sans anémie ne justifie pas une exploration invasive systématique. Le seuil d’exploration est plus bas chez l’homme, la femme ménopausée ou en présence de symptômes digestifs.</p><div class="key"><b>Aide à la décision.</b> L’âge, le sexe, l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> prédisent le risque de cancer ; plus l’anémie est profonde et microcytaire, plus l’exploration est urgente.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandations 6 à 11, 22, 24 à 29</a>.</p></template>
<template data-pop="d50-endoscopie" data-title="Gastroscopie et coloscopie"><p class="lab">Technique</p><p>Les deux examens se font si possible au cours de la même séance, ce qui simplifie la décision lorsque la gastroscopie montre une lésion de signification incertaine. La gastroscopie comporte des biopsies duodénales chez le sujet âgé, chez qui la sérologie cœliaque est moins sensible.</p><p class="lab">Règle</p><p>La coloscopie n’est différée que si la gastroscopie découvre un cancer, car une double lésion est possible. Le fer oral est suspendu avant la préparation colique ; il n’a pas à l’être avant une gastroscopie ou une coloscopie virtuelle.</p><p class="lab">Alternatives</p><p>La coloscopie virtuelle par tomodensitométrie peut convenir au patient fragile, mais détecte moins bien les lésions vasculaires. La tomodensitométrie sans préparation se réserve au patient très fragile, car elle manque certains cancers.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, imagerie du tube digestif</a>.</p></template>
<template data-pop="d50-capsule" data-title="Capsule endoscopique de l’intestin grêle"><p class="lab">Indication</p><p>La capsule s’indique devant une anémie ferriprive dont les endoscopies haute et basse adéquates sont négatives, avec réponse insuffisante ou récidive. La BSG 2021 en fait l’examen préféré pour le grêle dans cette situation.</p><p class="lab">Rendement</p><p>Le rendement atteint environ deux tiers dans les séries d’anémie ferriprive. Les lésions vues sont surtout des angioectasies, une maladie de Crohn et une entéropathie aux AINS. Jusqu’à 28 % des lésions trouvées étaient en fait accessibles à la gastroscopie, sans justifier une seconde gastroscopie systématique.</p><p class="lab">Après la capsule</p><p>L’entéroscopie assistée confirme et traite ; après une capsule négative de bonne qualité, l’exploration ne reprend que si l’anémie persiste.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, passage clinique cité</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-fit" data-title="Test immunochimique fécal : mise à jour 2025"><h3>Question et fonctionnement</h3><p>Le test détecte l’hémoglobine humaine dans les selles. Il estime le risque de lésion colorectale et aide à organiser l’exploration ; il ne localise pas la cause et n’exclut pas une lésion digestive haute.</p><h3>Ce qui a changé</h3><p>La BSG 2021 jugeait les preuves insuffisantes pour son tri systématique dans l’anémie ferriprive. La clarification BSG/ACPGBI 2025 recommande désormais le test et la sérologie cœliaque avant l’adressage digestif. Elle retient pragmatiquement 10 µg d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> par gramme de selles, bien que les études utilisent des seuils de 4 à 10.</p><p>Au-dessus du seuil, la filière britannique organise une exploration haute et basse urgente pour suspicion de cancer. Au-dessous, sans signe d’alerte, une évaluation spécialisée détermine les examens et leur délai selon l’âge, l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et les comorbidités. Un résultat négatif ne clôt donc pas le bilan ; les faux négatifs persistent.</p><h3>Application suisse</h3><p>Il s’agit d’une organisation britannique, pas d’un délai réglementaire suisse. Onkopedia avec SGH/SSH 2025 souligne aussi qu’un test de sang occulte négatif n’exclut pas la cause digestive. La décision d’endoscopie conserve son fondement clinique chez l’homme et la femme ménopausée. Un test non retourné ne justifie pas l’abandon d’un bilan indiqué.</p><p class="src">Références : <a href="https://www.bsg.org.uk/clinical-resource/role-of-fit-in-the-investigation-of-ida" target="_blank" rel="noopener">BSG/ACPGBI, tri par test immunochimique fécal, 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-second" data-title="Marqueurs de seconde ligne : méthode et limites"><p>Ces marqueurs renseignent sur l’érythropoïèse et complètent la ferritine lorsque l’inflammation la rend difficile à lire. Ils ne remplacent pas l’identification de la cause.</p><table class="t"><tr><th>Marqueur</th><th>Repère documenté</th><th>Interprétation et limite</th></tr><tr><td>Contenu réticulocytaire en <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></td><td>Clénin 2017 : 28–35 pg pour les méthodes décrites ; Onkopedia 2025 : seuils de 25 à 28 pg, compromis à 26 pg</td><td>Un taux bas soutient une restriction martiale récente ; seuil dépendant de l’automate, également abaissé dans la thalassémie. Réagit en 48–72 heures selon Clénin</td></tr><tr><td>Hématies hypochromes</td><td>Onkopedia 2025 : habituellement &lt; 2,5 % ; &gt; 10 % soutient fortement une carence d’approvisionnement</td><td>Population de cellules plus anciennes : réponse plus lente. Les seuils varient selon la méthode</td></tr><tr><td>Récepteur soluble de la transferrine</td><td>Intervalle propre au laboratoire</td><td>Augmente dans la restriction érythropoïétique mais aussi dans l’hémolyse et la thalassémie ; pas un dosage direct des réserves</td></tr><tr><td>Indice du récepteur soluble / logarithme de la ferritine</td><td>Valeur dépendante du dosage</td><td>Peut aider à reconnaître une carence absolue associée à une inflammation ; seuil non universel</td></tr><tr><td>Protoporphyrine de zinc</td><td>Onkopedia 2025, méthode Aviv : normal ≤ 40 µmol/mol d’hème</td><td>Hausse quand le zinc remplace le fer lors de la synthèse de l’hème ; seuils dépendants de la méthode et d’autres causes d’érythropoïèse perturbée</td></tr></table><p>La méthode doit être identifiée avant l’interprétation du résultat. Une valeur de contenu réticulocytaire à 28 pg ne se compare pas indistinctement aux seuils d’autres automates. Un résultat bas indique une restriction récente, mais la thalassémie peut aussi l’abaisser.</p><div class="trap"><span class="k">Piège</span> Un nombre de 28 pg ou une valeur de protoporphyrine sans nom de méthode ne constitue pas un critère interchangeable entre laboratoires.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-reponse" data-title="Réponse attendue au fer"><p class="lab">Chiffres</p><p>Sous fer oral, une réponse satisfaisante augmente l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’au moins 10 g/L en deux semaines ou de 20 g/L en quatre semaines. Le consensus suisse donne environ 1 g/L par jour et 20 à 30 g/L en trois semaines. La BSG rapporte 72,8 % de réponses satisfaisantes dans une analyse groupée d’essais, définies par une hausse de plus de 10 g/L en deux semaines ; les pertes persistantes et une maladie digestive réduisent les taux de normalisation. Une hausse inférieure à 10 g/L à deux semaines prédit l’échec avec une sensibilité de 90 % et une spécificité de 79 %.</p><p class="lab">Causes d’échec</p><p>L’échec peut résulter d’une mauvaise adhésion, d’une prise au repas ou d’une malabsorption liée à la maladie cœliaque, une gastrite atrophique ou une chirurgie. Le médecin recherche aussi saignement persistant, inflammation et carence associée en vitamine B12 ou en folates. Une hémolyse, une maladie médullaire ou un diagnostic erroné, comme une thalassémie, constituent d’autres explications.</p><div class="key"><b>Conduite.</b> Le médecin vérifie l’adhésion et recherche la cause d’échec. Il passe à la voie intraveineuse si l’anémie le justifie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-alterne" data-title="Fer un jour sur deux : justification et statut"><h3>Mécanisme</h3><p>Une prise de sel ferreux élève l’hepcidine pendant environ 24 heures. Les études de femmes carencées mais autrement en bonne santé, synthétisées par la BSG 2021, montrent qu’une dose de 60 mg réduit l’absorption de la dose suivante de 35 à 45 %. Une augmentation de la fraction absorbée ne prouve cependant pas, à elle seule, une correction clinique plus rapide.</p><h3>Choix clinique</h3><p>La BSG 2021 propose la prise un jour sur deux en cas d’intolérance ; Onkopedia 2025 la propose aussi comme adaptation de la tolérance. Le suivi mesure l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et les symptômes, car la meilleure fréquence dépend du déficit, du saignement et de l’observance.</p><h3>Autorisation suisse</h3><p>Les informations professionnelles lues de Tardyferon®, ferro sanol® et Ferrum Hausmann® décrivent une prise quotidienne. Le rythme alterné enseigné ici est donc un choix clinique hors fréquence approuvée pour ces produits. Sa justification et les modalités de contrôle sont discutées avec le patient ; il ne doit pas être présenté comme leur posologie autorisée.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">information professionnelle suisse Tardyferon®, juillet 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">information professionnelle suisse ferro sanol®, avril 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">information professionnelle suisse Ferrum Hausmann®, mai 2021</a>.</p></template>
<template data-pop="d50-faible-dose" data-title="Fer oral à faible dose"><p class="lab">Données</p><p>Chez des sujets âgés anémiques, 15 mg de fer par jour ont été aussi efficaces que 50 ou 150 mg, avec moins d’effets indésirables. Clénin 2017 discute 28 à 50 mg par jour dans la carence sans anémie chez la personne jeune en bonne santé ; ces doses issues de sa revue ne constituent pas l’information professionnelle de chaque produit. Une étude zurichoise ouverte, à un seul bras, chez 36 femmes sans anémie, a fait passer la ferritine de 18 à 33 µg/L avec 6 mg deux fois par jour pendant huit semaines ; une seule a rapporté des effets digestifs. L’étude utilisait une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’inclusion ≥ 117 g/L, donc un seuil différent du seuil OMS 2024 de 120 g/L chez la femme ; ses résultats ne doivent pas être présentés comme une preuve contrôlée dans toute carence sans anémie. Le schéma expérimental ne remplace pas les doses autorisées des préparations du cours.</p><div class="key"><b>Limite.</b> Ces données sont peu nombreuses et l’étude zurichoise n’a pas de groupe témoin ; les doses faibles se réservent à l’intolérance, au sujet âgé et à la carence sans anémie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.57187/smw.2023.40079" target="_blank" rel="noopener">Simic et al., Swiss Med Wkly 2023</a>.</p></template>
<template data-pop="d50-vitc" data-title="Contentieux : faut-il ajouter de la vitamine C ?"><p>L’effet alimentaire de la vitamine C ne prouve pas que son ajout médicamenteux améliore un traitement martial. Les références suivantes répondent à ces deux questions différentes.</p><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>Clénin 2017</td><td>La vitamine C des aliments favorise l’absorption du fer non héminique ; un jus d’agrumes au repas est conseillé</td></tr><tr><td>BSG 2021</td><td>Un grand essai randomisé montre que la vitamine C ajoutée au fer oral n’améliore ni la réponse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>, ni la reconstitution des réserves, ni la tolérance : non recommandée</td></tr><tr><td>Gynécologie suisse 2022</td><td>Pas d’influence significative sur la hausse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></td></tr></table><p>Le conseil d’associer des aliments riches en vitamine C concerne l’absorption et la prévention. Pour un patient sous fer oral, les données thérapeutiques plus récentes ne justifient pas un complément systématique.</p><p class="lab">Arbitrage</p><p>Les deux sources les plus récentes, dont la recommandation suisse de 2022, s’accordent : le complément de vitamine C n’est pas utile au traitement. Le conseil diététique sur les aliments riches en vitamine C reste pertinent pour la prévention.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, supplément de vitamine C</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 2022</a>.</p></template>
<template data-pop="d50-ganzoni" data-title="Formule de Ganzoni et schéma simplifié"><p class="lab">Formule</p><p>Le déficit total se calcule ainsi : déficit (mg) = poids (kg) × (<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> cible − <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> mesurée) (g/dL) × 2,4 + réserves (mg). Le facteur 2,4 combine la teneur en fer de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> (0,34 %), le volume sanguin (70 mL/kg) et la conversion d’unités. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> cible est de 15 g/dL ; les réserves représentent 500 mg à partir de 35 kg. Le poids idéal s’emploie chez l’obèse, le poids d’avant la grossesse chez la femme enceinte.</p><p class="lab">Exemple</p><p>Pour une femme de 60 kg dont l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> est de 9 g/dL, le déficit calculé est de 60 × 6 × 2,4 + 500 = 1364 mg. L’arrondi prescrit donne 1300 mg.</p><p class="lab">Schéma simplifié du carboxymaltose</p><p>Ferinject® permet aussi une estimation simplifiée du besoin total selon poids et <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>. Ce schéma représente une autre méthode autorisée ; les limites par administration restent applicables.</p><table class="t"><tr><th><button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></th><th>35 à moins de 70 kg</th><th>70 kg et plus</th></tr><tr><td>&lt; 10 g/dL</td><td>1500 mg</td><td>2000 mg</td></tr><tr><td>10 à moins de 14 g/dL</td><td>1000 mg</td><td>1500 mg</td></tr><tr><td>≥ 14 g/dL</td><td>500 mg</td><td>500 mg</td></tr></table><p>Pour l’exemple pédagogique de 60 kg avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> à 9 g/dL, ce schéma donne 1500 mg, contre 1300 mg après Ganzoni et arrondi. Ces méthodes autorisées ne donnent pas toujours le même total. Le besoin de 1500 mg ne permet pas de dépasser la limite de 1000 mg par semaine de Ferinject®.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025, tableaux 1 et 2</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">MonoFer®, juin 2026</a>.</p></template>
<template data-pop="d50-hypersensibilite" data-title="Réactions d’hypersensibilité au fer intraveineux"><p class="lab">Nature</p><p>Des réactions immédiates de type anaphylactique, potentiellement mortelles, peuvent survenir même après des perfusions bien tolérées. Elles peuvent provoquer hypotension, tachycardie, bronchospasme, œdème laryngé ou urticaire. Elles peuvent évoluer vers un syndrome de Kounis, spasme coronaire allergique pouvant causer un infarctus. Pendant la grossesse, une bradycardie fœtale peut accompagner une réaction maternelle.</p><p class="lab">Facteurs de risque</p><p>Le risque augmente en cas d’allergies connues, d’asthme sévère, d’eczéma, d’atopie, de lupus ou de polyarthrite rhumatoïde.</p><p class="lab">Conduite</p><p>La perfusion est arrêtée immédiatement. En cas d’anaphylaxie, l’adrénaline est le traitement prioritaire selon l’information professionnelle et le protocole d’urgence ; la surveillance de trente minutes reste obligatoire. L’information professionnelle de Ferinject® mentionne ensuite des antihistaminiques ou corticostéroïdes, dont l’effet est plus tardif. Onkopedia 2025 déconseille l’emploi systématique des antihistaminiques H1, qui peuvent aggraver ou brouiller les réactions ; il distingue le traitement d’une urticaire symptomatique. Ces adjuvants ne remplacent ni ne retardent l’adrénaline.</p><p class="lab">Contentieux entre molécules</p><p>Certaines études trouvent plus de réactions légères ou modérées avec le dérisomaltose qu’avec le carboxymaltose (environ 10 % contre 2,5 %), d’autres aucune différence ; les réactions graves restent rares avec les deux.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">MonoFer®</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p><p class="src">Complément : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH, avril 2025, 4.2.3 réactions immédiates</a>.</p></template>
<template data-pop="d50-hypophos" data-title="Hypophosphatémie après fer intraveineux"><h3>Du mécanisme au symptôme</h3><p>Le carboxymaltose peut augmenter fortement le FGF23 intact. Ce facteur diminue la réabsorption rénale du phosphate et l’activation de la vitamine D. La baisse de calcitriol puis la réponse de parathormone peuvent prolonger la perte de phosphate. Une fatigue aggravée, des myalgies ou des douleurs osseuses après perfusion demandent donc une évaluation, et ne signifient pas nécessairement une carence persistante.</p><h3>Fréquence et portée des chiffres</h3><p>La méta-analyse européenne de 42 essais publiée en 2021 trouve des taux groupés d’hypophosphatémie de 47 % après carboxymaltose et 4 % après dérisomaltose. Jusqu’à 45 % des patients restaient hypophosphatémiques à la fin d’études allant jusqu’à trois mois. Les seuils, populations et contrôles étaient hétérogènes ; ces chiffres ne sont pas une probabilité personnelle constante.</p><h3>Risques et surveillance selon l’information professionnelle suisse</h3><p>Ferinject® cite fortes doses répétées, carence en vitamine D, malabsorption, <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button>, hyperparathyroïdie, télangiectasie hémorragique héréditaire et ostéoporose parmi les facteurs pertinents. La méta-analyse ajoute déficit martial sévère et fonction rénale préservée. Le médecin contrôle le phosphate chez les patients recevant plusieurs doses élevées ou un traitement prolongé, et chez ceux présentant des facteurs de risque. Si l’hypophosphatémie persiste, il réévalue le traitement par carboxymaltose.</p><p>Une ostéomalacie et des fractures sont rapportées. La qualification généralement bénigne de l’avis gynécologique 2022 ne prévaut pas sur l’information professionnelle Ferinject® de juin 2025, qui décrit ces complications et impose la surveillance ciblée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8247006/" target="_blank" rel="noopener">Schaefer et al., méta-analyse 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a>.</p></template>
<template data-pop="d50-transfusion" data-title="Transfusion dans l’anémie ferriprive"><p class="lab">Indication</p><p>La transfusion est rarement nécessaire, car l’anémie lente est bien tolérée et le fer intraveineux relève l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> en une semaine. Elle se réserve à l’anémie sévère symptomatique ou à l’instabilité circulatoire.</p><p class="lab">Cible</p><p>La BSG juge raisonnable une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de 70 à 90 g/L, ou de 80 à 100 g/L en cas de maladie coronarienne instable. Après un accouchement, gynécologie suisse situe le seuil critique vers 60 à 65 g/L, en décision individuelle.</p><div class="key"><b>Piège.</b> Un concentré érythrocytaire apporte environ 200 mg de fer : le traitement martial doit suivre.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 19</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p></template>
<template data-pop="d50-essais" data-title="Carence sans anémie : preuves et incertitudes"><h3>Ce que l’évaluation suisse montre</h3><p>L’évaluation de l’OFSP 2020 examine notamment quatre essais de femmes présentant fatigue et carence sans anémie. Le fer améliore en moyenne le score continu de fatigue et certains sous-scores de qualité de vie. L’amélioration globale de la fatigue mesurée comme réponse binaire et la qualité de vie générale ne sont pas statistiquement améliorées dans cette synthèse.</p><p>L’analyse individuelle porte sur 657 des 718 femmes disponibles. Elle ne démontre pas de relation entre ferritine initiale et ampleur du bénéfice sur la fatigue, ni un avantage du groupe situé sous 30 µg/L sur celui situé au-dessus. Ces données ne démontrent pas non plus qu’une perfusion soit supérieure à une prise orale : aucun essai direct comparant les deux voies dans ces populations n’a été identifié.</p><h3>Décision clinique</h3><p>Le résultat s’applique à des femmes sélectionnées avec fatigue ; il ne prouve pas un bénéfice pour tout homme, toute chute de cheveux ou tout trouble cognitif. La BSG admet une discussion de traitement symptomatique, tandis que les références suisses divergent. Un essai oral éventuel demande un objectif clinique mesurable et un suivi, après recherche des autres causes ; la perfusion demande une indication distincte.</p><p class="src">Références : <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020, page du 14.01.2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a>.</p></template>
<template data-pop="d50-surtraitement" data-title="Prévenir un traitement excessif"><p>Le Delphi suisse 2019 reconnaît un risque de traitement excessif de la carence sans anémie dans le système de santé suisse. L’OFSP a évalué spécifiquement ces indications : le bénéfice dépend de la population et du critère évalué, et l’absence de comparaison directe entre voies ne permet pas de conclure à la supériorité d’une perfusion.</p><p>Le médecin documente la carence, distingue réserve basse et érythropoïèse limitée, recherche les pertes et les autres causes de fatigue, puis choisit la voie et un objectif de réponse. Une ferritine normale sans inflammation et une fatigue isolée ne suffisent pas à justifier un fer intraveineux.</p><div class="trap"><span class="k">Erreur fréquente</span> L’erreur consiste à confondre l’autorisation d’une préparation avec la preuve que toute fatigue justifie ce traitement. L’efficacité observée dans une population sélectionnée ne constitue pas une indication universelle.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020, page du 14.01.2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a>.</p></template>
<template data-pop="d50-recidive" data-title="Anémie persistante ou récidivante"><p class="lab">Définitions</p><p>Persistante : la carence demeure malgré un traitement adapté. Récidivante : elle disparaît, puis revient. Elle récidive chez 12 à 25 % des patients après des endoscopies négatives et une bonne réponse.</p><p class="lab">Démarche</p><p>Le médecin réévalue l’adhésion et la malabsorption. Il refait les endoscopies si elles sont anciennes ; la BSG propose un délai de deux ans. Il explore le grêle par capsule et image les voies urinaires, même si l’analyse d’urine est normale. Une perte de poids, une diarrhée chronique ou une CRP élevée persistante signalent une maladie active.</p><p class="lab">Si aucune cause n’est trouvée</p><p>Un traitement martial au long cours est légitime, notamment pour des angioectasies, dont le traitement endoscopique n’a pas prouvé sa supériorité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandations 12 à 16</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, passage clinique cité</a>.</p></template>
<template data-pop="d50-grossesse" data-title="Carence martiale pendant la grossesse"><p class="lab">Dépistage</p><p>Gynécologie suisse recommande <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et ferritine au début de la grossesse, puis entre 24 et 28 semaines. L’avis 2022 demande un contrôle d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> au moins une fois par trimestre, complété selon l’évolution clinique et obstétricale. Une ferritine inférieure à 30 µg/L indique des réserves vides avec 90 % de probabilité et se traite même sans anémie.</p><p class="lab">Traitement oral</p><p>Le traitement oral apporte 80 à 200 mg de fer par jour, en une prise, à jeun si possible. Le médecin contrôle la réponse après deux à quatre semaines. Les polyvitamines contenant du fer sont insuffisantes.</p><p class="lab">Fer intraveineux dès le deuxième trimestre</p><p>La voie intraveineuse s’envisage si l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> augmente de moins de 10 g/L en quatorze jours, ou devant intolérance, mauvaise adhésion ou malabsorption. Une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> inférieure à 90 g/L ou un besoin de correction rapide la justifient également. Ce besoin peut survenir au troisième trimestre, en présence de placenta prævia ou de refus de transfusion. Le carboxymaltose est la molécule la mieux étudiée ; la dose se calcule sur le poids d’avant la grossesse. Le fer intraveineux est contre-indiqué au premier trimestre.</p><div class="key"><b>Piège.</b> Une microcytose sans carence fait rechercher une hémoglobinopathie et tester le partenaire.</div><p class="src">Références : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis d’experts n° 77, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®</a>.</p></template>
<template data-pop="d50-postpartum" data-title="Anémie du post-partum"><p class="lab">Diagnostic</p><p>Une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> inférieure à 100 g/L est une anémie significative. Le nadir survient environ 48 heures après l’accouchement. La ferritine n’est pas interprétable dans les premières semaines ; elle se mesure avant l’accouchement ou à partir de six semaines.</p><p class="lab">Traitement</p><p>L’avis obstétrical suisse organise le choix de la voie selon l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>, tout en conservant l’évaluation de la tolérance clinique.</p><table class="t"><tr><th><button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></th><th>Conduite</th></tr><tr><td>95 à 120 g/L</td><td>Fer oral, 80 à 100 mg par jour</td></tr><tr><td>85 à moins de 95 g/L</td><td>Fer intraveineux en premier choix</td></tr><tr><td>&lt; 85 g/L</td><td>Fer intraveineux ; prise en charge spécialisée si forme très sévère ou mal tolérée ; la transfusion dépend de la clinique</td></tr></table><p>Une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de 90 g/L oriente ainsi vers le fer intraveineux en premier choix ; à 95 g/L, le schéma propose le fer oral. Une mauvaise tolérance ou une forme très sévère impose une décision spécialisée. La transfusion reste une décision clinique distincte.</p><p>Le fer intraveineux relève l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> plus vite et améliore davantage la fatigue que le fer oral.</p><p class="src">Référence : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis d’experts n° 77, 2022</a>.</p></template>
<template data-pop="d50-mici" data-title="Carence martiale et maladies inflammatoires chroniques de l’intestin"><p class="lab">Mécanismes</p><p>L’anémie est la complication systémique la plus fréquente des <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ; elle associe pertes sanguines, malabsorption et inflammation.</p><p class="lab">Seuils</p><p>La carence est définie par une ferritine inférieure à 30 µg/L sans inflammation clinique, endoscopique ou biologique. Le seuil devient inférieur à 100 µg/L en présence d’inflammation.</p><p class="lab">Traitement</p><p>Le fer intraveineux est préféré en cas de maladie active, d’intolérance antérieure au fer oral ou d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> inférieure à 100 g/L. Sa dose suit l’information professionnelle exacte : Ferinject® ne dépasse ni 1000 mg par semaine ni 20 mg/kg par perfusion. MonoFer® ne dépasse pas 20 mg/kg par semaine, sans plafond fixe universel de 1000 mg. Le fer oral peut aggraver une maladie active ; le maltol ferrique a été étudié dans les <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> inactives ou peu actives. La récidive se surveille tous les trois mois pendant un an, puis tous les six à douze mois.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gastroentérologique</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-ic" data-title="Carence martiale et insuffisance cardiaque : périmètre"><p>La carence dans l’insuffisance cardiaque peut combiner pertes digestives, diminution des apports ou de l’absorption et restriction du fer par l’inflammation. Une ferritine basse reste informative ; une ferritine normale n’exclut pas une restriction fonctionnelle et se lit avec la TSAT.</p><p>Le Delphi suisse 2019 et le texte Onkopedia 2025 se fondent sur les versions antérieures du référentiel cardiologique. mediX 08/2025 propose une indication plus restrictive du fer intraveineux. Ces textes ne suffisent pas à transformer leur seuil historique en prescription actuelle de tout patient insuffisant cardiaque.</p><p>Une nouvelle directive ESC sur l’insuffisance cardiaque a été publiée le 28 août 2026. Son texte complet sur le fer n’a pas été accessible lors de cette reprise ; aucun seuil thérapeutique ni classe de recommandation 2026 n’est donc attribué à ce document. L’indication cardiologique de traitement demande la consultation du texte spécialisé par le cardiologue. Le présent chapitre enseigne la reconnaissance de la carence absolue, la recherche des pertes et la sécurité des produits ; le cours I50 est un renvoi pédagogique, pas une preuve primaire de validation.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a>.</p><p class="src">Publication vérifiée : <a href="https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/heart-failure" target="_blank" rel="noopener">ESC, page officielle du 28.08.2026</a> ; accès au texte Oxford University Press indisponible le 11.10.2026.</p></template>
<template data-pop="d50-irc" data-title="Carence martiale et insuffisance rénale : KDIGO 2026"><p>L’anémie rénale peut associer déficit d’érythropoïétine, inflammation, pertes et carence martiale. Le bilan initial comprend hémogramme, réticulocytes, ferritine et TSAT. Les seuils suivants indiquent quand envisager le traitement dans ce contexte spécialisé ; ils ne définissent pas des réserves normales chez l’adulte sain.</p><table class="t"><tr><th>Patient anémique</th><th>Début du fer proposé par KDIGO 2026</th><th>Voie</th></tr><tr><td>Hémodialyse</td><td>Ferritine ≤ 500 µg/L et TSAT ≤ 30 %</td><td>Intraveineuse préférée</td></tr><tr><td>Sans dialyse ou dialyse péritonéale</td><td>Ferritine &lt; 100 µg/L et TSAT &lt; 40 % ; ou ferritine ≥ 100 et &lt; 300 µg/L avec TSAT &lt; 25 %</td><td>Orale ou intraveineuse selon déficit, tolérance et choix du patient</td></tr></table><p>Ces recommandations sont conditionnelles, de très faible certitude, classées 2D. Le fer habituel est suspendu si ferritine &gt; 700 µg/L ou TSAT ≥ 40 %, selon un point de pratique. La surveillance est tous les trois mois hors hémodialyse, tous les un à trois mois en hémodialyse ; une infection systémique justifie d’envisager une suspension temporaire. Un effet oral insuffisant après un à trois mois ou une mauvaise tolérance conduit à discuter la voie intraveineuse avec le néphrologue.</p><p>Ce référentiel international actualisé remplace ici les anciens paramètres rénaux du Delphi suisse 2019. La présence d’une carence documentée garde une indication de recherche de saignement ; elle ne doit pas être attribuée automatiquement à la néphropathie. Les doses des produits restent celles de leur information professionnelle suisse.</p><p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO, Anémie au cours de la maladie rénale chronique, janvier 2026, recommandations 2.1–2.4 et points de pratique 2.2–2.8</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">information professionnelle suisse Venofer®, mai 2025</a>.</p></template>
