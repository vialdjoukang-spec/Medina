<template data-pop="d50-age" data-title="Le sujet âgé"><p class="lab">Épidémiologie</p><p>L’anémie touche plus de 20 % des personnes de plus de 85 ans et plus de la moitié des résidents d’établissements médico-sociaux ; la carence y contribue dans environ la moitié des cas.</p><p class="lab">Causes</p><p>Les causes se cumulent souvent : alimentation pauvre, absorption réduite, saignement occulte aggravé par les antithrombotiques et maladie chronique. Une double lésion digestive est plus fréquente dans cette population.</p><p class="lab">Conduite</p><p>L’exploration se discute selon la fragilité, les comorbidités et l’espérance de vie, avec le patient et sa famille. Le fer oral reste le premier choix quand il est adapté ; une étude citée par la BSG a trouvé un effet d’une faible dose de 15 mg par jour, sans établir la posologie autorisée des produits du cours ; et la réponse est souvent lente. Si le fer oral est inadapté ou mal toléré, la voie intraveineuse reste une option avec les précautions propres à la préparation.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, sujet âgé</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a>.</p></template>
<template data-pop="d50-cancer" data-title="Carence martiale et cancer"><p>Chez le patient atteint de cancer, les pertes, l’inflammation, les traitements et une restriction de la production médullaire peuvent se cumuler. Une ferritine normale ou élevée n’exclut pas une carence : le cancer peut l’augmenter indépendamment des réserves. La TSAT et, dans les cas ambigus, les marqueurs d’érythropoïèse complètent l’interprétation.</p><p>Le Delphi suisse 2019 demande une coordination avec l’oncologue et propose la voie intraveineuse pour les patients symptomatiques carencés lorsque la correction rapide est utile. Les seuils liés aux agents stimulant l’érythropoïèse relèvent de leur référentiel oncologique et ne doivent pas être extrapolés au patient sain.</p><p>Le guide Onkopedia 2025 souligne la fréquence des carences fonctionnelles et la nécessité d’interpréter ferritine et marqueurs d’érythropoïèse dans ce contexte. La décision de fer tient compte du traitement oncologique, du bilan martial, d’une infection active et du risque de surcharge. Les doses et contre-indications de la préparation choisie restent celles de son information professionnelle suisse.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a>.</p></template>
<template data-pop="d50-preop" data-title="Avant une chirurgie programmée"><p>Une chirurgie à risque hémorragique rend utile la reconnaissance préalable d’une anémie et d’une carence. L’objectif est d’améliorer l’état hématologique avant l’intervention et de limiter l’exposition à une transfusion lorsque cela est possible ; un bénéfice individuel n’est pas garanti.</p><p>La BSG 2021 propose d’envisager la voie intraveineuse si la correction est particulièrement urgente, ou si le fer oral est inefficace, contre-indiqué ou mal toléré. L’avis de gynécologie suisse 2022 applique l’optimisation préalable de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et des réserves aux césariennes planifiées à risque de perte importante : en fin de grossesse, la voie intraveineuse peut alors être discutée selon le bilan martial. Le cours ne fixe pas de délai ni de cible préopératoire universels. La cause du déficit reste recherchée. La transfusion ne remplace pas une correction étiologique et martiale adaptée.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a>.</p><p class="src">Référence obstétricale : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n°77, 2022, Patient Blood Management</a>.</p></template>
