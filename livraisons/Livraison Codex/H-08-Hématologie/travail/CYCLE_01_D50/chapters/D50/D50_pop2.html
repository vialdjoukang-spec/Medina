<template data-pop="d50-d-sels" data-title="Sels ferreux : produits suisses et limites"><h3>Mécanisme et preuve</h3><p>Le fer ferreux absorbé par l’entérocyte alimente les protéines de transport et la synthèse d’hémoglobine. La BSG 2021 conclut que le fer oral corrige l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ; elle ne démontre pas une supériorité générale d’un sel sur les autres. Les trois préparations ci-dessous ont une libération modifiée : leur autorisation suisse ne prouve pas un avantage comparatif.</p><table class="t"><tr><th>Produit</th><th>Schéma adulte selon l’information professionnelle</th><th>Prise et durée</th></tr><tr><td>Tardyferon®</td><td>80 mg, un comprimé par jour ; deux, matin et soir, si état ferriprive grave</td><td>Avant ou pendant le repas selon tolérance ; avaler entier. Durée totale au plus six mois</td></tr><tr><td>ferro sanol®</td><td>100 mg, une capsule par jour ; deux au début d’une carence importante chez l’adolescent dès 15 ans et l’adulte d’au moins 50 kg. Au plus 5 mg/kg par jour</td><td>À jeun ou entre les repas. Les pellets ne se mâchent pas ; poursuite selon <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et réserves</td></tr><tr><td>Ferrum Hausmann®</td><td>100 mg, une capsule par jour ; deux ou trois en cas de carence grave</td><td>10 à 15 minutes avant le repas ; un à trois mois après correction de l’anémie, au plus six mois sans pertes chroniques</td></tr></table><p>Une prise quotidienne apporte 80 mg avec Tardyferon®, mais 100 mg avec ferro sanol® ou Ferrum Hausmann®. Le nombre de comprimés ou de capsules ne suffit donc pas à comparer les doses. Le schéma exact et la durée se vérifient avant tout remplacement.</p><h3>Contre-indications et précautions</h3><p>Pour ces trois produits : absence de carence certaine, surcharge et troubles d’utilisation du fer ; affections hépatiques et rénales graves et intolérance digestive inflammatoire importante sont des contre-indications dans les informations professionnelles lues. ferro sanol® est aussi contre-indiqué en cas de sténose œsophagienne. La forme solide est discutée en présence de dysphagie : Tardyferon® expose à des lésions après aspiration ou maintien dans la bouche.</p><p>Les symptômes digestifs et la coloration foncée des selles sont fréquents. L’absence de réponse impose de vérifier prise, interactions, pertes et carences associées. Le guide Onkopedia prévoit un contrôle d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> vers quatre semaines, la BSG dès deux à quatre semaines ; l’information professionnelle Tardyferon® indique une évaluation biologique utile après trois mois. Le contrôle clinique précoce ne remplace pas cette évaluation plus tardive des réserves.</p><h3>Grossesse, allaitement, âge</h3><p>Tardyferon® peut être utilisé pendant la grossesse si nécessaire ; son information professionnelle est rassurante pour l’allaitement. ferro sanol® et Ferrum Hausmann® disposent de données plus limitées et demandent une prescription motivée selon leurs informations professionnelles. Tardyferon® est contre-indiqué avant dix ans ; ferro sanol® avant six ans ou sous 20 kg ; Ferrum Hausmann® est contre-indiqué avant six ans et son utilisation pédiatrique n’est pas étudiée. Le cours ne fournit pas de schéma enfant extrapolé de ces doses adultes.</p><p>Les interactions sont propres au produit et détaillées dans la <button class="w" data-k="d50-interactions">comparaison des intervalles</button>. Un rythme un jour sur deux diffère des informations professionnelles quotidiennes et constitue un choix clinique hors schéma approuvé.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">information professionnelle suisse Tardyferon®, juillet 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">information professionnelle suisse ferro sanol®, avril 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">information professionnelle suisse Ferrum Hausmann®, mai 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-d-polymaltose" data-title="Fer ferrique polymaltose : Maltofer®"><h3>Mécanisme et preuve</h3><p>Le complexe d’hydroxyde ferrique-polymaltose fournit du fer absorbable puis lié aux protéines de transport et de stockage. Selon l’information professionnelle, les aliments ne réduisent pas sa biodisponibilité comme celle des sels ferreux. Une méta-analyse citée dans l’information professionnelle compare 319 adultes traités par polymaltose et 238 par sulfate ferreux : après huit à treize semaines à doses équivalentes, les taux moyens d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ne diffèrent pas significativement. Ce résultat ne démontre pas une supériorité.</p><h3>Schéma autorisé</h3><p>L’adulte et l’adolescent dès douze ans reçoivent 100 à 300 mg de fer par jour si l’anémie est présente, sinon 50 à 100 mg. La prise se fait pendant ou juste après le repas. Un comprimé contient 100 mg. Les gouttes et le sirop ont des concentrations différentes ; leur dose ne s’improvise pas à partir du nombre de comprimés. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> se normalise en moyenne en trois à cinq mois selon l’information professionnelle, puis une dose de carence sans anémie reconstitue les réserves.</p><h3>Sécurité et suivi</h3><p>L’hypersensibilité, la surcharge, les troubles d’utilisation du fer et les anémies sans carence martiale contre-indiquent Maltofer®. Les troubles digestifs et les selles foncées sont fréquents. Une absence de réponse après trois semaines fait revoir le diagnostic et la prise selon l’information professionnelle. Les données n’établissent pas de schéma d’adaptation rénale ou hépatique ; cela ne permet pas d’affirmer que toute insuffisance est sans risque.</p><p>Pendant la grossesse et l’allaitement, l’utilisation reste prudente et suit un avis médical. Les données cliniques gestationnelles n’ont pas montré d’effet indésirable ; le passage lacté du complexe n’est pas documenté. Les comprimés ne sont pas recommandés avant douze ans. L’information professionnelle ne montre pas d’interaction clinique significative avec la tétracycline ou l’hydroxyde d’aluminium. La prise orale ne s’associe pas à une administration parentérale de fer.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680301240218" target="_blank" rel="noopener">information professionnelle suisse Maltofer®, août 2021</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a>.</p></template>
<template data-pop="d50-d-maltol" data-title="Maltol ferrique : Feraccru®"><h3>Mécanisme et place</h3><p>Le complexe ferrique se dissocie dans le tube digestif et ne passe pas lui-même dans la circulation. Feraccru® est autorisé chez l’adulte carencé. Il offre une alternative après intolérance aux sels ferreux, sous réserve des limites digestives de son information professionnelle.</p><h3>Essais lus dans l’information professionnelle</h3><p>Chez 128 adultes atteints de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> inactives ou peu actives, avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> initiale de 95 à 120 g/L chez la femme et de 95 à 130 g/L chez l’homme, les essais AEGIS 1/2 trouvent une différence d’augmentation de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de 22 g/L en faveur du maltol à douze semaines ; 66 % des patients traités normalisent leur <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>. Dans l’essai rénal de 167 patients avec débit de filtration de 15 à moins de 60 mL/min/1,73 m², l’augmentation moyenne d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> à seize semaines est de 5,0 g/L contre −0,2 g/L sous placebo. Ces populations ne permettent pas une extrapolation aux poussées intestinales sévères ou à l’insuffisance rénale plus avancée.</p><h3>Dose et limites</h3><p>Feraccru® s’administre à raison de 30 mg, soit une gélule, deux fois par jour à jeun. Au moins douze semaines sont généralement nécessaires, puis la durée dépend des réserves. Aucune adaptation n’est nécessaire pour un débit de filtration ≥ 15 mL/min/1,73 m². L’information professionnelle ne fournit pas de donnée d’adaptation en dessous de 15 ni en insuffisance hépatique.</p><p>L’hypersensibilité et la surcharge, notamment l’hémochromatose, contre-indiquent Feraccru®. L’information professionnelle demande de ne pas l’utiliser en poussée aiguë de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ou en cas de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 95 g/L. Le produit s’évite par précaution pendant la grossesse et l’allaitement. Les effets digestifs sont fréquents ; <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et réserves sont surveillées.</p><p>Les médicaments chélatables de la liste de l’information professionnelle se prennent au moins deux heures à distance ; les tétracyclines demandent deux à trois heures. L’association au dimercaprol, au chloramphénicol et à la méthyldopa s’évite selon les avertissements spécifiques. Aucun schéma n’est établi avant dix-huit ans.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">information professionnelle suisse Feraccru®, août 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-d-carboxymaltose" data-title="Carboxymaltose ferrique : Ferinject®"><h3>Mécanisme et indication suisse</h3><p>Le complexe est capté par les macrophages, puis son fer rejoint les protéines de stockage et de transport. Ferinject® traite la carence de l’adulte lorsque la voie orale n’est pas assez efficace, est inefficace ou ne peut être utilisée ; la carence doit être biologiquement confirmée.</p><h3>Preuves et limites</h3><p>L’information professionnelle rapporte, dans l’anémie liée aux hémorragies utérines, une hausse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> supérieure à 20 g/L chez 82 % des patientes contre 61,8 % sous sulfate oral. En grossesse aux deuxième et troisième trimestres, l’essai de 121 contre 115 femmes trouve une différence de 2,7 g/L à trois semaines, non significative pour le critère principal, puis de 4,3 g/L à six semaines. Ce résultat tardif ne doit pas être présenté comme un succès du critère principal. Dans les maladies intestinales chroniques, la non-infériorité à douze semaines a été montrée, avec une réponse plus rapide à quatre semaines.</p><h3>Administration</h3><p>La perfusion ne dépasse ni 20 mg/kg ni 1000 mg ; l’injection ne dépasse pas 15 mg/kg. Le total hebdomadaire reste au plus de 1000 mg. Une perfusion de plus de 500 à 1000 mg dure au moins quinze minutes ; celle de plus de 200 à 500 mg, au moins six minutes. La dilution utilise exclusivement du chlorure de sodium à 0,9 %, selon les volumes de l’information professionnelle. En hémodialyse, la dose quotidienne ne dépasse pas 200 mg. Le médecin réévalue l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> au plus tôt quatre semaines après la dernière dose. L’information professionnelle juge une ferritine avant quatre semaines prématurée ; le Delphi suisse propose un contrôle à huit à douze semaines.</p><h3>Contre-indications et surveillance</h3><p>Le premier trimestre, la surcharge et l’anémie non ferriprive contre-indiquent le produit. Il en va de même d’une hypersensibilité au produit ou d’une hypersensibilité grave à un autre fer parentéral. En insuffisance hépatique, le médecin évalue le bénéfice et le risque ; il évite le produit si une surcharge contribue à l’atteinte. Les données d’adaptation ne permettent pas une règle générale. L’administration exige personnel formé, matériel de réanimation et surveillance pendant au moins trente minutes après chaque dose. Le traitement s’interrompt en cas de bactériémie, de réaction ou d’extravasation.</p><p>L’hypophosphatémie peut persister et conduire à une ostéomalacie. Le médecin contrôle le phosphate en cas de fortes doses répétées ou de facteurs de risque. Il recherche fatigue aggravée, myalgies et douleurs osseuses. L’information professionnelle de juin 2025 prévaut sur la qualification « non pertinente cliniquement » de l’avis gynécologique 2022. Après le premier trimestre, l’administration demande une évaluation stricte. Le risque de bradycardie fœtale impose une surveillance fœtale pendant l’administration. Le passage lacté est limité dans les données de l’information professionnelle, sans effet attendu aux doses thérapeutiques. L’usage n’est pas autorisé chez l’enfant ou l’adolescent dans cette information professionnelle suisse.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8247006/" target="_blank" rel="noopener">Schaefer et al., méta-analyse 2021</a>.</p></template>
<template data-pop="d50-d-derisomaltose" data-title="Dérisomaltose ferrique : MonoFer®"><h3>Mécanisme et indication</h3><p>Le complexe ferrique-glucidique permet une libération contrôlée de fer biodisponible vers les protéines de transport et de stockage. MonoFer® traite une carence lorsque le fer oral est inefficace ou inutilisable, ou qu’une assimilation rapide est cliniquement nécessaire ; le déficit est confirmé biologiquement.</p><h3>Preuve et limite</h3><p>L’information professionnelle rapporte chez 351 patients hémodialysés une efficacité non inférieure à celle du fer-saccharose pour la dose totale étudiée de 500 mg. En revanche, la non-infériorité n’a pas été démontrée dans l’essai de 338 patients avec maladie intestinale comparant une dose calculée selon Ganzoni modifié au sulfate oral. La méta-analyse européenne 2021 trouve moins d’hypophosphatémies qu’avec le carboxymaltose, mais les essais et les doses sont hétérogènes : elle ne garantit pas l’absence de cet effet.</p><h3>Dose autorisée</h3><p>La perfusion ne dépasse pas 20 mg/kg par administration et par semaine. Jusqu’à 1000 mg, elle dure plus de quinze minutes ; au-delà, au moins trente minutes. Un besoin dépassant 20 mg/kg se fractionne à au moins une semaine d’intervalle. Le bolus ne dépasse pas 500 mg, jusqu’à trois fois par semaine, sans dépasser la limite hebdomadaire. La dilution au chlorure de sodium à 0,9 % suit l’information professionnelle. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> se mesure au plus tôt quatre semaines après la dernière administration.</p><h3>Sécurité et terrains</h3><p>Le produit est contre-indiqué au premier trimestre, en cas de surcharge, d’anémie non ferriprive ou de maladie hépatique décompensée. Une hypersensibilité au produit ou une hypersensibilité grave à un autre fer parentéral le contre-indiquent également. L’information professionnelle ne demande pas d’adaptation rénale. Les données hépatiques insuffisantes imposent prudence et bilan martial ; aucun schéma n’est établi avant dix-huit ans.</p><p>L’administration exige personnel formé, réanimation disponible et surveillance pendant au moins trente minutes. Le traitement s’interrompt en cas de réaction, d’extravasation ou de bactériémie. Après le premier trimestre, il demande indication motivée, évaluation bénéfice-risque et surveillance fœtale. Le passage dans le lait est faible dans les données disponibles. Le produit ne s’associe pas au fer oral ; le suivi vérifie l’efficacité et le risque de surcharge.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8247006/" target="_blank" rel="noopener">Schaefer et al., méta-analyse 2021</a>.</p></template>
<template data-pop="d50-d-saccharose" data-title="Fer-saccharose : Venofer®"><h3>Mécanisme, indication et preuve</h3><p>Le complexe hydroxyde ferrique-saccharose est principalement capté par le système réticuloendothélial, puis son fer rejoint transferrine, ferritine et hémoglobine. Venofer® traite une carence lorsque le traitement oral est insuffisamment efficace ou impossible. L’information professionnelle décrit une réponse hématologique plus rapide que sous formulations orales solubles ; elle ne permet pas de conclure à une supériorité clinique universelle.</p><h3>Dose autorisée et durée</h3><p>La dose totale se calcule selon Ganzoni. L’adulte reçoit habituellement 100 à 200 mg une à trois fois par semaine. L’injection lente ne dépasse pas 200 mg et dure au moins dix minutes. Une perfusion de 200 mg dure au moins trente minutes. La perfusion maximale de 500 mg s’administre au plus une fois par semaine, chez un patient de plus de 70 kg, en au moins trois heures et demie. À 70 kg ou moins, cette perfusion maximale est limitée à 7 mg/kg. Les petites doses ont leurs propres durées dans l’information professionnelle et ne suivent pas le modèle de Ferinject®.</p><h3>Risques et populations</h3><p>Le premier trimestre, la surcharge et l’anémie non ferriprive contre-indiquent Venofer®. Il en va de même d’une hypersensibilité au produit ou d’une hypersensibilité grave à un autre fer parentéral. L’administration exige réanimation disponible, personnel formé et surveillance pendant au moins trente minutes. Une extravasation impose l’arrêt immédiat et peut laisser une pigmentation prolongée. Le traitement s’interrompt en cas de bactériémie ; les autres infections demandent une évaluation bénéfice-risque.</p><p>L’insuffisance hépatique demande une évaluation stricte et la prévention de la surcharge. La voie dans la ligne du dialyseur est autorisée selon les mêmes limites que l’injection. Le cours n’extrapole pas de dose enfant ; l’information professionnelle déconseille l’usage avant trois ans faute d’expérience. Après le premier trimestre, l’indication gestationnelle doit être impérative ; en allaitement, les données limitées demandent une évaluation bénéfice-risque. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et le bilan martial sont suivis ; une absence de réponse fait revoir le diagnostic, la prise en charge et les pertes.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">information professionnelle suisse Venofer®, mai 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-interactions" data-title="Fer oral : intervalles par produit"><p>Les intervalles d’une information professionnelle ne se transposent pas à tous les fers oraux. Le tableau sélectionne les interactions utiles au choix de la préparation ; toute association demande la lecture de son information professionnelle exacte.</p><table class="t"><tr><th>Produit</th><th>Interaction</th><th>Conduite de son information professionnelle</th></tr><tr><td>Tardyferon®</td><td>Lévothyroxine, bisphosphonates</td><td>Deux à trois heures d’intervalle</td></tr><tr><td>Tardyferon®</td><td>Quinolones</td><td>Quinolone quatre heures avant, ou quatre à six heures après le fer</td></tr><tr><td>Tardyferon®</td><td>Lévodopa, méthyldopa</td><td>Au moins trois heures</td></tr><tr><td>Tardyferon®</td><td>Colestyramine</td><td>Fer une à deux heures avant ou quatre à six heures après</td></tr><tr><td>Tardyferon®</td><td>Bictégravir</td><td>Bictégravir au moins deux heures avant le fer ; prise concomitante possible avec un repas selon l’information professionnelle. Ne pas extrapoler à tous les inhibiteurs de l’intégrase</td></tr><tr><td>ferro sanol®</td><td>Lévothyroxine</td><td>Au moins deux heures</td></tr><tr><td>ferro sanol®</td><td>Tétracyclines, quinolones</td><td>Éviter doxycycline ; autres tétracyclines au moins trois heures ; association aux quinolones déconseillée</td></tr><tr><td>Ferrum Hausmann®</td><td>Antiacides, médicaments complexables de sa liste</td><td>Trois heures si association inévitable ; lévothyroxine au moins deux heures</td></tr><tr><td>Feraccru®</td><td>Médicaments complexables de sa liste</td><td>Au moins deux heures ; tétracyclines deux à trois heures. Éviter dimercaprol, chloramphénicol et méthyldopa</td></tr><tr><td>Maltofer®</td><td>Tétracycline, hydroxyde d’aluminium</td><td>Pas de diminution significative dans les études cliniques citées ; exception propre à ce complexe</td></tr><tr><td>Tous les produits concernés</td><td>Fer parentéral concomitant</td><td>Association déconseillée ou contre-indiquée selon l’information professionnelle ; absorption orale réduite</td></tr></table><p>Les antiacides, le thé, le café et certains aliments diminuent l’absorption des sels ferreux. Les inhibiteurs de la pompe à protons peuvent la réduire par hypochlorhydrie. Une perte d’efficacité sous fer peut donc relever d’une interaction plutôt que d’une maladie réfractaire.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">information professionnelle suisse Tardyferon®, juillet 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">information professionnelle suisse ferro sanol®, avril 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">information professionnelle suisse Ferrum Hausmann®, mai 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">information professionnelle suisse Feraccru®, août 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680301240218" target="_blank" rel="noopener">information professionnelle suisse Maltofer®, août 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-mr" data-title="Contentieux : les formes à libération modifiée"><p>L’autorisation d’un médicament et la démonstration d’un avantage comparatif répondent à deux questions distinctes. Les positions ci-dessous doivent être lues avec cette distinction.</p><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>BSG 2021</td><td>Les formes à libération modifiée libèrent le fer au-delà des zones d’absorption maximale ; elles n’augmentent pas l’absorption, ne réduisent pas les effets indésirables et ne sont pas recommandées</td></tr><tr><td>Informations professionnelles suisses</td><td>Tardyferon®, ferro sanol® et Ferrum Hausmann®, tous à libération prolongée ou modifiée, sont autorisés dans l’anémie ferriprive et la carence latente</td></tr></table><p>L’autorisation suisse permet l’utilisation du produit dans ses indications ; elle ne démontre pas une absorption ou une tolérance supérieure. Chez un patient ne répondant pas, la prise et les pertes se réévaluent avant d’attribuer l’échec à la seule formulation.</p><p class="lab">Arbitrage</p><p>La BSG s’appuie sur des données d’absorption et de tolérance comparatives ; les informations suisses attestent l’autorisation, non une supériorité. En pratique suisse, ces préparations restent utilisables à raison d’une prise par jour ; la réponse se contrôle à deux à quatre semaines, et un échec fait vérifier l’adhésion avant de changer de voie.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, préparations orales</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">Tardyferon®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">ferro sanol®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">Ferrum Hausmann®, information professionnelle suisse</a>.</p></template>
<template data-pop="pareto-d50-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="d50-0,d50-1,d50-2,d50-3,d50-4,d50-5,d50-6"></p><ul><li>Chez l’adulte de 15 à 65 ans, l’OMS 2024 définit l’anémie par une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 130 g/L chez l’homme et &lt; 120 g/L chez la femme non enceinte. Pendant la grossesse, le seuil est &lt; 110 g/L, sauf au deuxième trimestre où il est &lt; 105 g/L. L’altitude et le contexte modifient l’interprétation.</li><li>Sans inflammation : ferritine &lt; 15 µg/L indique des réserves épuisées ; &lt; 30 µg/L correspond à des réserves insuffisantes selon Onkopedia 2025. Le Delphi 2019 propose aussi 30–50 µg/L avec TSAT &lt; 20 % pour la carence sans anémie, avec accord critique.</li><li>La restriction érythropoïétique peut précéder la baisse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ; ferritine, indices globulaires et <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ne mesurent pas la même étape.</li><li>L’hepcidine inhibe la ferroportine ; elle augmente sous inflammation et diminue habituellement dans la carence absolue.</li><li>Chez l’homme et la femme ménopausée explorés pour anémie ferriprive, environ un tiers ont une lésion digestive significative selon la BSG 2021. L’absence de symptôme digestif n’exclut pas la cause.</li><li>Le médecin recherche pertes, malabsorption et besoins accrus. Fatigue, pica et signes des phanères ne suffisent pas à prouver la carence.</li></ul></template>
<template data-pop="pareto-d50-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="d50-7,d50-8"></p><ul><li>La ferritine se lit avec la CRP. Une TSAT basse soutient une restriction, sans distinguer seule carence absolue et fonctionnelle. L’OMS 2020 propose conditionnellement &lt; 70 µg/L pour indiquer une carence sous inflammation.</li><li>Une hausse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ≥ 10 g/L après deux semaines de fer oral quotidien est fortement évocatrice de carence absolue ; la cause reste à rechercher.</li><li>Le bilan d’une anémie ferriprive comprend analyse d’urine et sérologie cœliaque. L’exploration digestive haute et basse s’indique chez l’homme et la femme ménopausée selon risque et état général.</li><li>BSG/ACPGBI 2025 : le test immunochimique fécal aide au tri, mais un résultat bas ne clôt pas le bilan.</li><li>Une persistance ou une récidive après des endoscopies adéquates négatives conduit à explorer le grêle par capsule et l’appareil rénal.</li><li>Un saignement actif, une dyspnée de repos ou une mauvaise tolérance circulatoire imposent une évaluation urgente. Pendant la grossesse, une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 90 g/L justifie une discussion spécialisée de fer intraveineux après le premier trimestre.</li></ul></template>
<template data-pop="pareto-d50-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="d50-9,d50-10,d50-11"></p><ul><li>Le traitement d’une anémie carencée commence parallèlement à la recherche de cause, sauf si une coloscopie est imminente.</li><li>Selon Onkopedia et la BSG, les sels ferreux s’emploient initialement en prise unique de 50–100 mg. Les règles de repas et de durée suivent l’information professionnelle exacte. Un jour sur deux diffère des informations professionnelles quotidiennes et demande une justification explicite.</li><li>Le médecin contrôle la réponse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> après deux à quatre semaines. Selon la BSG, le traitement continue environ trois mois après normalisation, dans les limites de durée du produit.</li><li>L’intolérance conduit à adapter rythme et prise. Onkopedia 2025 permet l’essai d’une autre préparation, sans promesse de supériorité. Le maltol ou la voie intraveineuse se discutent si nécessaire.</li><li>Le fer intraveineux exige une indication précise, une dose calculée et une surveillance ≥ 30 minutes. Pour Ferinject® et MonoFer®, l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> se contrôle au plus tôt quatre semaines après la dernière dose. Le Delphi 2019 propose la ferritine à huit à douze semaines.</li><li>La transfusion se réserve à l’anémie sévère symptomatique ou mal tolérée. Un apport martial reste nécessaire.</li><li>Sans anémie, les recommandations suisses divergent. Le médecin distingue stade, symptômes, autres causes et populations particulières. Une perfusion ne découle pas de la ferritine seule.</li></ul></template>
<template data-pop="pareto-d50-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="d50-12,d50-13,d50-14"></p><ul><li>Après correction, la BSG 2021 propose un hémogramme tous les trois mois la première année, puis tous les six mois. Le risque de récidive détermine l’adaptation du suivi.</li><li>Une récidive conduit à réévaluer qualité et ancienneté des endoscopies, grêle et appareil urinaire. Une cause irréversible peut justifier une substitution prolongée.</li><li>Pendant la grossesse, gynécologie suisse 2022 recommande la ferritine au début et à 24–28 semaines, puis un traitement si elle est &lt; 30 µg/L. La voie intraveineuse demande une indication précise après le premier trimestre.</li><li>Dans les <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button>, le seuil de ferritine dépend de l’inflammation. Une atteinte active et une intolérance favorisent la voie intraveineuse.</li><li>Dans la maladie rénale, KDIGO 2026 distingue hémodialyse et autres situations ; ses seuils de traitement ne sont pas des seuils de réserve normale chez le sujet sain.</li><li>L’indication de fer dans l’insuffisance cardiaque relève du spécialiste. Le texte primaire 2026 n’étant pas accessible, aucun seuil thérapeutique ne lui est attribué.</li><li>En pédiatrie, forme, âge et poids sont propres au produit. Aucune dose adulte n’est extrapolée.</li></ul></template>
<template data-pop="pareto-d50-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="d50-e-1,d50-e-2,d50-e-3,d50-e-4,d50-e-5"></p><ul><li>Le bilan initial associe hémogramme, ferritine et CRP ; la TSAT le complète selon le contexte. L’examen médullaire n’est pas une exploration de routine.</li><li>Un <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> &lt; 80 fl définit la microcytose ; une TCMH basse indique l’hypochromie. Les seuils réticulocytaires dépendent de l’automate.</li><li>Une TSAT et une ferritine basses rendent probable une carence absolue. Une TSAT basse avec ferritine normale fait discuter inflammation ou trouble de régulation.</li><li>Une microcytose disproportionnée avec bilan martial normal conduit à étudier l’hémoglobine. Une alpha-thalassémie peut avoir une électrophorèse normale.</li><li>Le bilan comprend une analyse d’urine dès le début ; l’exploration digestive dépend du terrain. Le test immunochimique fécal aide au tri sans exclure le cancer.</li><li>La capsule est préférée pour le grêle après un bilan endoscopique adéquat négatif et une réponse insuffisante ou une récidive.</li></ul></template>
<template data-pop="pareto-d50-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d50-p-1,d50-p-2,d50-p-3,d50-p-4,d50-p-5"></p><ul><li>Le choix du produit suit son information professionnelle suisse exacte. Dose, âge, repas, interactions, fonction rénale ou hépatique et grossesse ne sont pas interchangeables.</li><li>Ferinject® ne dépasse ni 20 mg/kg ni 1000 mg par perfusion, ni 1000 mg par semaine. MonoFer® ne dépasse pas 20 mg/kg par perfusion et par semaine. Sa perfusion dure plus de quinze minutes jusqu’à 1000 mg, puis au moins trente minutes au-delà.</li><li>Venofer® ne dépasse pas 200 mg par injection. Sa perfusion maximale est de 500 mg si le poids dépasse 70 kg, sinon 7 mg/kg. Elle dure au moins 3,5 heures et s’administre au plus une fois par semaine.</li><li>Le fer intraveineux exige personnel formé, matériel de réanimation et observation ≥ 30 minutes. Il est contre-indiqué au premier trimestre et s’interrompt en cas de bactériémie.</li><li>Sous Ferinject®, le phosphate se contrôle en présence de doses répétées élevées ou de facteurs de risque. Une hypophosphatémie persistante peut causer une ostéomalacie.</li><li>Les sels ferreux ont des interactions et des contre-indications rénales ou hépatiques graves propres au produit. Feraccru® s’évite pendant la grossesse et l’allaitement. Son information professionnelle demande de ne pas l’utiliser en poussée aiguë de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ou en cas de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 95 g/L.</li><li>Tout apport demande une indication documentée. Une ferritine élevée seule ne prouve pas une surcharge.</li></ul></template>

<template data-pop="pareto-d50-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="d50-s-physio-body"></p><ul><li>Absorption duodénale et proximale, recyclage macrophagique et pertes déterminent le bilan martial.</li><li>L’hepcidine hépatique provoque l’internalisation de la ferroportine ; inflammation et réserves abondantes l’augmentent.</li><li>L’érythropoïétine stimule l’érythroferrone, qui diminue l’hepcidine quand l’érythropoïèse demande du fer.</li><li>Cette régulation explique ferritine élevée avec disponibilité basse sous inflammation et l’intérêt d’adapter la prise orale.</li></ul></template>

<template data-pop="pareto-d50-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="d50-s-bioc-body"></p><ul><li>La transferrine assure le transport ; la ferritine stocke le fer. L’hème incorpore le fer dans l’hémoglobine et d’autres protéines.</li><li>Une TSAT basse renseigne sur la disponibilité du fer. Elle ne mesure pas, seule, les réserves.</li><li>La carence d’incorporation augmente la protoporphyrine de zinc et le récepteur soluble quand la moelle manque de fer.</li><li>L’interprétation nécessite CRP, contexte clinique et méthode analytique.</li></ul></template>

<template data-pop="pareto-d50-s-histo" data-title="Pareto — Hématologie cellulaire"><p class="ratio" data-cover="d50-s-histo-body"></p><ul><li>Le contenu en hémoglobine des réticulocytes reflète l’approvisionnement des cellules récemment produites.</li><li>Il réagit avant les indices moyens de toutes les hématies ; les seuils sont propres à l’automate.</li><li>Une restriction martiale prolongée entraîne hypochromie et microcytose. Le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> peut rester normal si la carence est mixte ou débutante.</li><li>Sous fer, les réticulocytes augmentent avant l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>. L’absence de réponse conduit à rechercher des pertes persistantes.</li></ul></template>

<template data-pop="pareto-d50-s-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="d50-s-gen-body"></p><ul><li>TMPRSS6 code la matriptase-2, qui atténue la synthèse d’hepcidine par la voie BMP–SMAD.</li><li>Les variants pathogènes entraînent une hepcidine inappropriée et une TSAT très basse. La réponse orale est mauvaise ; la réponse intraveineuse reste souvent partielle.</li><li>Le diagnostic génétique suit l’exclusion des causes acquises ; l’avis 2025 repose surtout sur des séries de cas.</li><li>Les anomalies des globines peuvent donner une microcytose sans carence ; une surcharge confirmée contre-indique les préparations martiales.</li></ul></template>

<template data-pop="d50-absorption" data-title="Anatomie et biochimie de l’absorption du fer"><h3>Du tube digestif au plasma</h3><p>Le duodénum est le principal site d’absorption ; le jéjunum proximal y participe. À la membrane apicale, le cytochrome b duodénal réduit le fer ferrique Fe³⁺ en fer ferreux Fe²⁺, qui peut franchir la membrane grâce à DMT1. Le passage basolatéral dépend de la ferroportine. L’héphæstine, une ferroxydase contenant du cuivre, réoxyde le Fe²⁺ en Fe³⁺ avant son transport lié à la transferrine.</p><h3>De la cellule normale à la carence</h3><p>L’entérocyte stocke aussi du fer dans la ferritine. Si l’hepcidine provoque l’internalisation puis la dégradation de la ferroportine, l’export diminue. En carence, plusieurs protéines de ce système sont davantage exprimées ; cette adaptation demeure limitée et peut être dépassée par les pertes. Une dérivation digestive peut soustraire les sites d’absorption au trajet des aliments.</p><div class="key"><b>Science → clinique, examen, traitement.</b> Une alimentation suffisante n’exclut donc pas une malabsorption. Une ferritine basse documente les réserves épuisées ; si une malabsorption explique l’échec du fer oral correctement utilisé, une substitution intraveineuse peut contourner l’étape intestinale, après vérification de l’indication et de la préparation.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>

<template data-pop="d50-volume-globulaire" data-title="Volume globulaire moyen : mesure et limites"><h3>Mesure et seuil</h3><p>Le volume globulaire moyen mesure le volume moyen des hématies circulantes, en femtolitres. Chez l’adulte, une valeur inférieure à 80 fl définit habituellement la microcytose ; l’intervalle complet dépend du laboratoire. Il s’agit d’une moyenne, qui ne décrit pas séparément chaque population cellulaire.</p><h3>Mécanisme et chronologie</h3><p>La restriction de fer produit des cellules progressivement hypochromes puis microcytaires. Les hématies anciennes restent longtemps majoritaires ; l’indice moyen peut donc rester normal au début. Les marqueurs réticulocytaires renseignent plus tôt sur l’approvisionnement de la production récente.</p><h3>Interprétation et pièges</h3><p>Une carence associée en vitamine B12 ou en folates peut relever la moyenne et masquer la microcytose. Une microcytose marquée pour une anémie légère, avec ferritine et saturation de la transferrine normales, évoque plutôt une thalassémie. Le bilan martial précède donc l’attribution de la microcytose à une carence.</p><div class="key"><b>À retenir.</b> La microcytose n’est ni nécessaire ni suffisante pour diagnostiquer une carence martiale. Le médecin lit ensemble l’hémoglobine, les indices globulaires, la ferritine et le contexte inflammatoire.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH, avril 2025, marqueurs biologiques</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017, tableau 3 et chronologie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, définitions et diagnostic différentiel</a>.</p></template>
