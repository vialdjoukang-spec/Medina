<template data-pop="d50-transfusion" data-title="Transfusion dans l’anémie ferriprive"><p class="lab">Indication</p><p>La transfusion est rarement nécessaire, car l’anémie lente est bien tolérée et le fer intraveineux relève l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> en une semaine. Elle se réserve à l’anémie sévère symptomatique ou à l’instabilité circulatoire.</p><h3>Cibles de transfusion et décision</h3><p>Ces valeurs sont des repères de prise en charge, distincts des intervalles normaux d’hémoglobine. Elles ne remplacent pas l’évaluation clinique.</p><table class="t"><tr><th>Contexte</th><th>Repère, g/L</th><th>Portée</th></tr><tr><td><button class="w" data-k="d50-sources-guides">BSG</button>, transfusion pour anémie ferriprive mal tolérée</td><td>Cible 70–90</td><td>Cible raisonnable après transfusion, pas seuil automatique pour tout patient</td></tr><tr><td><button class="w" data-k="d50-sources-guides">BSG</button>, maladie coronarienne instable</td><td>Cible 80–100</td><td>Adaptation à la tolérance et au risque ischémique</td></tr><tr><td>Avis suisse, après accouchement</td><td>Zone critique autour de 60–65</td><td>Décision individuelle selon symptômes, saignement et souhaits de la patiente</td></tr></table><p>Une valeur dans la zone critique obstétricale motive une évaluation urgente ; elle ne signifie pas à elle seule que la transfusion est obligatoire. Le traitement martial demeure nécessaire.</p><div class="key"><b>Piège.</b> Un concentré érythrocytaire apporte environ 200 mg de fer : le traitement martial doit suivre.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 19</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p></template>
<template data-pop="d50-essais" data-title="Carence sans anémie : preuves et incertitudes"><h3>Ce que l’évaluation suisse montre</h3><p>L’évaluation de l’<button class="w" data-k="d50-sources-guides">OFSP</button> 2020 examine notamment quatre essais de femmes présentant fatigue et carence sans anémie. Le fer améliore en moyenne le score continu de fatigue et certains sous-scores de qualité de vie. L’amélioration globale de la fatigue mesurée comme réponse binaire et la qualité de vie générale ne sont pas statistiquement améliorées dans cette synthèse.</p><p>L’analyse individuelle porte sur 657 des 718 femmes disponibles. Elle ne démontre pas de relation entre <button class="w" data-k="d50-ferritine">ferritine</button> initiale et ampleur du bénéfice sur la fatigue, ni un avantage du groupe situé sous 30 µg/L sur celui situé au-dessus. Ces données ne démontrent pas non plus qu’une perfusion soit supérieure à une prise orale : aucun essai direct comparant les deux voies dans ces populations n’a été identifié.</p><h3>Décision clinique</h3><div class="key"><b>À retenir.</b> Le résultat s’applique à des femmes sélectionnées avec fatigue ; il ne prouve pas un bénéfice pour tout homme, toute chute de cheveux ou tout trouble cognitif. La <button class="w" data-k="d50-sources-guides">BSG</button> admet une discussion de traitement symptomatique, tandis que les références suisses divergent. Un essai oral éventuel demande un objectif clinique mesurable et un suivi, après recherche des autres causes ; la perfusion demande une indication distincte.</div><p class="src">Références : <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020, page du 14.01.2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a>.</p></template>
<template data-pop="d50-surtraitement" data-title="Prévenir un traitement excessif"><p>Le Delphi suisse 2019 reconnaît un risque de traitement excessif de la carence sans anémie dans le système de santé suisse. L’<button class="w" data-k="d50-sources-guides">OFSP</button> a évalué spécifiquement ces indications : le bénéfice dépend de la population et du critère évalué, et l’absence de comparaison directe entre voies ne permet pas de conclure à la supériorité d’une perfusion.</p><div class="key"><b>À retenir.</b> Le médecin documente la carence, distingue réserve basse et érythropoïèse limitée, recherche les pertes et les autres causes de fatigue, puis choisit la voie et un objectif de réponse. Une <button class="w" data-k="d50-ferritine">ferritine</button> normale sans inflammation et une fatigue isolée ne suffisent pas à justifier un fer intraveineux.</div><div class="trap"><span class="k">Erreur fréquente</span> L’erreur consiste à confondre l’autorisation d’une préparation avec la preuve que toute fatigue justifie ce traitement. L’efficacité observée dans une population sélectionnée ne constitue pas une indication universelle.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020, page du 14.01.2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a>.</p></template>
<template data-pop="d50-recidive" data-title="Anémie persistante ou récidivante"><p class="lab">Définitions</p><p>Persistante : la carence demeure malgré un traitement adapté. Récidivante : elle disparaît, puis revient. Elle récidive chez 12 à 25 % des patients après des endoscopies négatives et une bonne réponse.</p><p class="lab">Démarche</p><p>Le médecin réévalue l’adhésion et la malabsorption. Il refait les endoscopies si elles sont anciennes ; la <button class="w" data-k="d50-sources-guides">BSG</button> propose un délai de deux ans. Il explore le grêle par capsule et image les voies urinaires, même si l’analyse d’urine est normale. Une perte de poids, une diarrhée chronique ou une <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button> élevée persistante signalent une maladie active.</p><p class="lab">Si aucune cause n’est trouvée</p><div class="key"><b>À retenir.</b> Un traitement martial au long cours est légitime, notamment pour des angioectasies, dont le traitement endoscopique n’a pas prouvé sa supériorité.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandations 12 à 16</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, passage clinique cité</a>.</p></template>
<template data-pop="d50-grossesse" data-title="Carence martiale pendant la grossesse"><p class="lab">Dépistage</p><p>Gynécologie suisse recommande <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et <button class="w" data-k="d50-ferritine">ferritine</button> au début de la grossesse, puis entre 24 et 28 semaines. L’avis 2022 demande un contrôle d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> au moins une fois par trimestre, complété selon l’évolution clinique et obstétricale. Une <button class="w" data-k="d50-ferritine">ferritine</button> inférieure à 30 µg/L indique des réserves vides avec 90 % de probabilité et se traite même sans anémie.</p><p class="lab">Traitement oral</p><p>Le traitement oral apporte 80 à 200 mg de fer par jour, en une prise, à jeun si possible. Le médecin contrôle la réponse après deux à quatre semaines. Les polyvitamines contenant du fer sont insuffisantes.</p><h3>Situations faisant discuter la voie intraveineuse</h3><p>Après le premier trimestre, l’avis obstétrical suisse retient les situations suivantes.</p><table class="t"><tr><th>Situation</th><th>Critère et raison</th></tr><tr><td>Réponse orale insuffisante</td><td>Hausse d’hémoglobine &lt;10 g/L en quatorze jours</td></tr><tr><td>Anémie sévère pour la décision obstétricale</td><td>Hémoglobine &lt;90 g/L ; correction plus rapide recherchée</td></tr><tr><td>Obstacle au traitement oral</td><td>Intolérance, mauvaise adhésion ou malabsorption</td></tr><tr><td>Temps ou risque obstétrical</td><td>Fin de grossesse, placenta prævia, risque hémorragique ou refus de transfusion</td></tr></table><p>La ligne sur l’hémoglobine à 90 g/L définit une décision obstétricale, distincte de la catégorie biologique <button class="w" data-k="d50-sources-guides">OMS</button>. La voie intraveineuse s’envisage si l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> augmente de moins de 10 g/L en quatorze jours, ou devant intolérance, mauvaise adhésion ou malabsorption. Une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> inférieure à 90 g/L ou un besoin de correction rapide la justifient également. Ce besoin peut survenir au troisième trimestre, en présence de placenta prævia ou de refus de transfusion. Le carboxymaltose est la molécule la mieux étudiée ; la dose se calcule sur le poids d’avant la grossesse. Le fer intraveineux est contre-indiqué au premier trimestre.</p><div class="key"><b>Piège.</b> Une microcytose sans carence fait rechercher une hémoglobinopathie et tester le partenaire.</div><p class="src">Références : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis d’experts n° 77, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®</a>.</p></template>
<template data-pop="d50-postpartum" data-title="Anémie du post-partum"><p class="lab">Diagnostic</p><p>Une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> inférieure à 100 g/L est une anémie significative. Le nadir survient environ 48 heures après l’accouchement. La <button class="w" data-k="d50-ferritine">ferritine</button> n’est pas interprétable dans les premières semaines ; elle se mesure avant l’accouchement ou à partir de six semaines.</p><p class="lab">Traitement</p><p>L’avis obstétrical suisse organise le choix de la voie selon l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>, tout en conservant l’évaluation de la tolérance clinique.</p><table class="t"><tr><th><button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></th><th>Conduite</th></tr><tr><td>95 à 120 g/L</td><td>Fer oral, 80 à 100 mg par jour</td></tr><tr><td>85 à moins de 95 g/L</td><td>Fer intraveineux en premier choix</td></tr><tr><td>&lt; 85 g/L</td><td>Fer intraveineux ; prise en charge spécialisée si forme très sévère ou mal tolérée ; la transfusion dépend de la clinique</td></tr></table><p>Une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de 90 g/L oriente ainsi vers le fer intraveineux en premier choix ; à 95 g/L, le schéma propose le fer oral. Une mauvaise tolérance ou une forme très sévère impose une décision spécialisée. La transfusion reste une décision clinique distincte.</p><div class="key"><b>À retenir.</b> L’avis suisse décrit aussi une stimulation de l’érythropoïèse dans des cas très sélectionnés d’hémoglobine &lt;80 g/L, avec symptômes importants ou refus de transfusion. Le bénéfice ajouté au fer intraveineux est peu documenté et l’usage est hors indication ; il relève du spécialiste, sans schéma de prescription proposé ici. Une intolérance digestive ou des symptômes persistants peuvent justifier le passage de la voie orale à la voie intraveineuse, même dans la première ligne du tableau. Le fer intraveineux relève l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> plus vite et améliore davantage la fatigue que le fer oral.</div><p class="src">Référence : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis d’experts n° 77, 2022</a>.</p></template>
<template data-pop="d50-mici" data-title="Carence martiale et maladies inflammatoires chroniques de l’intestin"><p class="lab">Mécanismes</p><p>L’anémie est la complication systémique la plus fréquente des <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ; elle associe pertes sanguines, malabsorption et inflammation.</p><h3>Seuils diagnostiques selon l’inflammation</h3><p>Le Delphi suisse distingue deux contextes ; les seuils ne sont pas des cibles thérapeutiques.</p><table class="t"><tr><th>Situation intestinale</th><th><button class="w" data-k="d50-ferritine">Ferritine</button> diagnostique, µg/L</th><th>Lecture</th></tr><tr><td>Absence d’inflammation clinique, endoscopique ou biologique</td><td>&lt; 30</td><td>Réserves insuffisantes</td></tr><tr><td>Inflammation présente</td><td>&lt; 100</td><td>Carence possible malgré l’augmentation inflammatoire de <button class="w" data-k="d50-ferritine">ferritine</button></td></tr></table><p>Une <button class="w" data-k="d50-ferritine">ferritine</button> à 70 µg/L n’a donc pas la même portée dans une maladie active que dans une maladie en rémission. La saturation, les marqueurs érythropoïétiques et le contexte complètent le bilan.</p><p class="lab">Traitement</p><div class="key"><b>À retenir.</b> Le fer intraveineux est préféré en cas de maladie active, d’intolérance antérieure au fer oral ou d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> inférieure à 100 g/L. Sa dose suit l’information professionnelle exacte : Ferinject® ne dépasse ni 1000 mg par semaine ni 20 mg/kg par perfusion. MonoFer® ne dépasse pas 20 mg/kg par semaine, sans plafond fixe universel de 1000 mg. Le fer oral peut aggraver une maladie active ; le maltol ferrique a été étudié dans les <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> inactives ou peu actives. La récidive se surveille tous les trois mois pendant un an, puis tous les six à douze mois.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gastroentérologique</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-ic" data-title="Carence martiale et insuffisance cardiaque : périmètre"><h3>Reconnaître la carence et sa cause</h3><p>La carence dans l’insuffisance cardiaque peut combiner pertes digestives, diminution des apports ou de l’absorption et restriction inflammatoire du fer. Une ferritine basse reste informative ; une valeur normale n’exclut pas une restriction fonctionnelle et se lit avec la <button class="w" data-k="d50-tsat">saturation de la transferrine</button>.</p><h3>Positions suisses et actualisation européenne</h3><p>Le Delphi suisse 2019 et Onkopedia 2025 se fondent sur des versions antérieures du référentiel cardiologique. <button class="w" data-k="d50-sources-guides">mediX</button> 08/2025 propose une indication plus restrictive du fer intraveineux. Leurs critères historiques ne deviennent pas automatiquement les critères du guide européen adopté le 28 août 2026.</p><p>Le jeu officiel de diapositives de la Société européenne de cardiologie, adapté du guide 2026, donne les deux recommandations suivantes chez les patients symptomatiques avec insuffisance cardiaque à fraction d’éjection réduite et carence en fer.</p><table class="t"><tr><th>Objectif</th><th>Recommandation <button class="w" data-k="d50-sources-guides">ESC</button> 2026</th></tr><tr><td>Soulager les symptômes et améliorer la qualité de vie</td><td>Le fer intraveineux est recommandé.</td></tr><tr><td>Réduire le risque d’hospitalisation pour insuffisance cardiaque</td><td>Le fer intraveineux doit être envisagé.</td></tr></table><p>Le bénéfice sur les symptômes et celui sur les hospitalisations sont donc des objectifs distincts. Ces lignes ne promettent pas une baisse de mortalité. Le cardiologue confirme la catégorie cardiaque et les critères martiaux avant la prescription ; les informations professionnelles suisses gouvernent le produit, la dose et la surveillance.</p><div class="trap"><span class="k">Limite de la source</span> Le support officiel a été consulté, mais le texte intégral spécialisé restait inaccessible. La diapositive sur le fer ne donne pas de seuil numérique de ferritine ou de saturation : aucun seuil 2026 n’est inventé ici. Le guide a aussi modifié ses catégories de fraction d’éjection ; les populations des études antérieures ne doivent pas être reclassées rétrospectivement.</div><div class="key"><b>À retenir.</b> La carence doit être reconnue et ses pertes recherchées ; la prescription cardiologique associe les recommandations spécialisées actuelles et la sécurité suisse du produit exact.</div><p class="src">Références : <a href="https://dam-assets.escardio.org/download/b2e587389baa11f185de06bdfb3e4be9" target="_blank" rel="noopener">ESC 2026, support officiel, pages 2, 8 et 91</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse, 2019</a> ; <a href="https://www.medix.ch/fr/connaissances/guide-des-bonnes-pratiques/carence-en-fer/" target="_blank" rel="noopener">mediX, 08/2025</a>.</p></template>
<template data-pop="d50-irc" data-title="Carence martiale et insuffisance rénale : Kidney Disease: Improving Global Outcomes 2026"><p>L’anémie rénale peut associer déficit d’érythropoïétine, inflammation, pertes et carence martiale. Le bilan initial comprend hémogramme, réticulocytes, <button class="w" data-k="d50-ferritine">ferritine</button> et <button class="w" data-k="d50-tsat">TSAT</button>. Les seuils suivants indiquent quand envisager le traitement dans ce contexte spécialisé ; ils ne définissent pas des réserves normales chez l’adulte sain.</p><h3>Source suisse et référentiel spécialisé plus récent</h3><p>Le guide de la Société suisse de néphrologie du 17 mars 2025 demande d’exclure les causes non rénales d’anémie. Il donne les objectifs ci-dessous pour la prise en charge de l’anémie rénale ; ils ne sont ni la normalité du sujet sain ni des seuils universels d’initiation du fer.</p><table class="t"><tr><th>Paramètre</th><th>Objectif du guide suisse 2025</th><th>Distinction</th></tr><tr><td>Ferritine</td><td>300–500 ng/mL, soit 300–500 µg/L</td><td>Cible spécialisée rénale, distincte de la référence Viollier 30–300 µg/L</td></tr><tr><td>Saturation de la transferrine</td><td>&gt;30 %</td><td>Cible rénale du document 2025, distincte de la référence 16–45 %</td></tr><tr><td>Hémoglobine</td><td>10–11,5 <button class="w" data-k="d50-conversion-hb">g/dL</button>, soit 100–115 g/L</td><td>Cible de prise en charge rénale, distincte des références adultes saines</td></tr></table><p>Le guide suisse demande aussi d’examiner les carences en vitamine B12 et en folates. Kidney Disease: Improving Global Outcomes 2026, publié ensuite, précise les seuils d’initiation et de suspension selon la dialyse. Le présent chapitre expose ces deux documents, mais ne transforme pas les cibles du guide suisse en obligation de perfusion : le néphrologue arbitre selon le traitement de l’anémie, le bilan et les risques.</p><p class="src">Source suisse : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie, guide 17.03.2025, figures 2 et 3</a>.</p><h3>Début du fer selon Kidney Disease: Improving Global Outcomes 2026</h3><p>Les seuils d’initiation sont distincts des cibles précédentes.</p><table class="t"><tr><th>Patient anémique</th><th>Début du fer proposé par Kidney Disease: Improving Global Outcomes 2026</th><th>Voie</th></tr><tr><td>Hémodialyse</td><td><button class="w" data-k="d50-ferritine">Ferritine</button> ≤ 500 µg/L et <button class="w" data-k="d50-tsat">TSAT</button> ≤ 30 %</td><td>Intraveineuse préférée</td></tr><tr><td>Sans dialyse ou dialyse péritonéale</td><td><button class="w" data-k="d50-ferritine">Ferritine</button> &lt; 100 µg/L et <button class="w" data-k="d50-tsat">TSAT</button> &lt; 40 % ; ou <button class="w" data-k="d50-ferritine">ferritine</button> ≥ 100 et &lt; 300 µg/L avec <button class="w" data-k="d50-tsat">TSAT</button> &lt; 25 %</td><td>Orale ou intraveineuse selon déficit, tolérance et choix du patient</td></tr></table><p>Ces recommandations sont conditionnelles, de très faible certitude, classées 2 D.</p><p>La suspension du fer relève de points de pratique distincts des seuils d’initiation.</p><table class="t"><tr><th>Condition, <button class="w" data-k="d50-sources-guides">KDIGO</button> 2026</th><th>Conséquence</th></tr><tr><td><button class="w" data-k="d50-ferritine">Ferritine</button> &gt; 700 µg/L</td><td>Suspendre le fer habituel et réévaluer</td></tr><tr><td>Saturation ≥ 40 %</td><td>Suspendre le fer habituel et réévaluer</td></tr><tr><td>Infection systémique active</td><td>Envisager une suspension temporaire</td></tr></table><p>Ces repères évitent d’assimiler une dose d’entretien à une prescription permanente. La surveillance est tous les trois mois hors hémodialyse, tous les un à trois mois en hémodialyse ; une infection systémique justifie d’envisager une suspension temporaire. Un effet oral insuffisant après un à trois mois ou une mauvaise tolérance conduit à discuter la voie intraveineuse avec le néphrologue.</p><div class="key"><b>À retenir.</b> Ce référentiel international actualisé remplace ici les anciens paramètres rénaux du Delphi suisse 2019. La présence d’une carence documentée garde une indication de recherche de saignement ; elle ne doit pas être attribuée automatiquement à la néphropathie. Les doses des produits restent celles de leur information professionnelle suisse.</div><p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">Kidney Disease: Improving Global Outcomes, Anémie au cours de la maladie rénale chronique, janvier 2026, recommandations 2.1–2.4 et points de pratique 2.2–2.8</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">information professionnelle suisse Venofer®, mai 2025</a>.</p></template>
<template data-pop="d50-age" data-title="Le sujet âgé"><p class="lab">Épidémiologie</p><p>L’anémie touche plus de 20 % des personnes de plus de 85 ans et plus de la moitié des résidents d’établissements médico-sociaux ; la carence y contribue dans environ la moitié des cas.</p><p class="lab">Causes</p><p>Les causes se cumulent souvent : alimentation pauvre, absorption réduite, saignement occulte aggravé par les antithrombotiques et maladie chronique. Une double lésion digestive est plus fréquente dans cette population.</p><p class="lab">Conduite</p><div class="key"><b>À retenir.</b> L’exploration se discute selon la fragilité, les comorbidités et l’espérance de vie, avec le patient et sa famille. Le fer oral reste le premier choix quand il est adapté ; une étude citée par la <button class="w" data-k="d50-sources-guides">BSG</button> a trouvé un effet d’une faible dose de 15 mg par jour, sans établir la posologie autorisée des produits du cours ; et la réponse est souvent lente. Si le fer oral est inadapté ou mal toléré, la voie intraveineuse reste une option avec les précautions propres à la préparation.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, sujet âgé</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a>.</p></template>
<template data-pop="d50-cancer" data-title="Carence martiale et cancer"><p>Chez le patient atteint de cancer, les pertes, l’inflammation, les traitements et une restriction de la production médullaire peuvent se cumuler. Une <button class="w" data-k="d50-ferritine">ferritine</button> normale ou élevée n’exclut pas une carence : le cancer peut l’augmenter indépendamment des réserves. La <button class="w" data-k="d50-tsat">TSAT</button> et, dans les cas ambigus, les marqueurs d’érythropoïèse complètent l’interprétation.</p><p>Le Delphi suisse 2019 demande une coordination avec l’oncologue et propose la voie intraveineuse pour les patients symptomatiques carencés lorsque la correction rapide est utile. Les seuils liés aux agents stimulant l’érythropoïèse relèvent de leur référentiel oncologique et ne doivent pas être extrapolés au patient sain.</p><p>Le guide Onkopedia 2025 souligne la fréquence des carences fonctionnelles et la nécessité d’interpréter <button class="w" data-k="d50-ferritine">ferritine</button> et marqueurs d’érythropoïèse dans ce contexte. La décision de fer tient compte du traitement oncologique, du bilan martial, d’une infection active et du risque de surcharge. Les doses et contre-indications de la préparation choisie restent celles de son information professionnelle suisse.</p><h3>Approche spécialisée du guide commun suisse</h3><p>Onkopedia 2025 propose l’approche ci-dessous chez le patient anémique atteint de cancer. Elle décrit des seuils décisionnels spécialisés ; la <button class="w" data-k="d50-ferritine">ferritine</button> n’y mesure pas fidèlement les réserves. La coordination oncologique détermine l’indication et le contexte de traitement.</p><table class="t"><tr><th>Constellation</th><th>Interprétation et décision à discuter</th></tr><tr><td>Saturation &lt;20 % et <button class="w" data-k="d50-ferritine">ferritine</button> &lt;30 µg/L</td><td>Carence absolue très probable ; substitution martiale initiale. Un essai oral reste possible dans cette constellation</td></tr><tr><td>Saturation &lt;20 % et <button class="w" data-k="d50-ferritine">ferritine</button> de 30 à &lt;100 µg/L</td><td>Une composante absolue reste possible ; essai de correction martiale seule envisageable</td></tr><tr><td>Saturation &lt;20 % et <button class="w" data-k="d50-ferritine">ferritine</button> de 100 à 800 µg/L</td><td>Composante fonctionnelle probable ; fer intraveineux et éventuelle stimulation de l’érythropoïèse à examiner dans le référentiel oncologique</td></tr><tr><td><button class="w" data-k="d50-ferritine">Ferritine</button> &gt;800 µg/L ou saturation &gt;50 %</td><td>Le guide ne propose pas de substitution ; réévaluation spécialisée</td></tr></table><div class="key"><b>À retenir.</b> Une <button class="w" data-k="d50-ferritine">ferritine</button> élevée peut masquer une carence réelle ; inversement, cette possibilité n’autorise pas une perfusion sans limites. Les dosages réticulocytaires et les autres marqueurs éclairent les cas ambigus. Les agents stimulant l’érythropoïèse ne sont pas prescrits à partir de ce tableau : leur indication, leurs risques et leur information professionnelle exacte relèvent de la prise en charge oncologique.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a>.</p></template>
<template data-pop="d50-preop" data-title="Avant une chirurgie programmée"><p>Une chirurgie à risque hémorragique rend utile la reconnaissance préalable d’une anémie et d’une carence. L’objectif est d’améliorer l’état hématologique avant l’intervention et de limiter l’exposition à une transfusion lorsque cela est possible ; un bénéfice individuel n’est pas garanti.</p><div class="key"><b>À retenir.</b> La <button class="w" data-k="d50-sources-guides">BSG</button> 2021 propose d’envisager la voie intraveineuse si la correction est particulièrement urgente, ou si le fer oral est inefficace, contre-indiqué ou mal toléré. L’avis de gynécologie suisse 2022 applique l’optimisation préalable de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et des réserves aux césariennes planifiées à risque de perte importante : en fin de grossesse, la voie intraveineuse peut alors être discutée selon le bilan martial. Le cours ne fixe pas de délai ni de cible préopératoire universels. La cause du déficit reste recherchée. La transfusion ne remplace pas une correction étiologique et martiale adaptée.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a>.</p><p class="src">Référence obstétricale : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n°77, 2022, Patient Blood Management</a>.</p></template>

<template data-pop="d50-references-suisses" data-title="Paramètres biologiques : références suisses et limites"><h3>La référence dépend de la mesure</h3><p>La société suisse d’hématologie participe au guide Onkopedia, qui présente plusieurs méthodes et souligne leurs différences. Un intervalle universel ne peut donc pas être imposé à tous les laboratoires. Les références suivantes proviennent du catalogue suisse Viollier, consulté le 11 octobre 2026. Elles servent de repères explicites ; le compte rendu du laboratoire du patient prévaut.</p><table class="t"><tr><th>Paramètre et population</th><th>Référence Viollier</th><th>Conditions et portée</th></tr><tr><td>Hémoglobine, femmes / hommes ≥ 19 ans</td><td>120–160 / 135–175 g/L</td><td>Sang sur anticoagulant ; cytométrie. Distinct des seuils <button class="w" data-k="d50-sources-guides">OMS</button>.</td></tr><tr><td><button class="w" data-k="d50-volume-globulaire">Volume globulaire moyen</button>, ≥ 19 ans</td><td>80–100 fl</td><td>Même prélèvement et méthode ; références pédiatriques différentes.</td></tr><tr><td>Teneur corpusculaire moyenne en hémoglobine, ≥ 19 ans</td><td>26–34 pg</td><td>Référence Viollier ; ne confond pas avec le seuil de 28 pg d’une autre méthode.</td></tr><tr><td>Réticulocytes absolus, femmes et hommes</td><td>32,8–97,7 × 10⁹/L</td><td>Fiche Viollier sans distinction d’âge ; cytométrie, sang sur anticoagulant.</td></tr><tr><td>Contenu réticulocytaire en hémoglobine</td><td>29,3–35,4 pg</td><td>Fiche Viollier sans distinction d’âge ; méthode propre au laboratoire.</td></tr><tr><td><button class="w" data-k="d50-ferritine">Ferritine</button>, ≥ 16 ans, femmes et hommes</td><td>30–300 µg/L</td><td>Sérum ; immunodosage par chimiluminescence ; inflammation et foie modifient le résultat.</td></tr><tr><td>Saturation de la transferrine, femmes et hommes</td><td>16–45 %</td><td>Sérum ; disponibilité du fer, pas quantité des réserves.</td></tr><tr><td><button class="w" data-k="d50-proteine-c-reactive">Protéine C réactive</button>, ≥ 1 an, femmes et hommes</td><td>&lt; 3,4 mg/L</td><td>Sérum ; immunoturbidimétrie ; référence Viollier, différente du seuil de 5 mg/L du Thomas-plot.</td></tr><tr><td>Concentration corpusculaire moyenne en hémoglobine, ≥ 19 ans</td><td>310–350 g/L</td><td>Sang <button class="w" data-k="d50-prelevement-edta">EDTA</button> ; valeur calculée. Masse rapportée au volume des hématies, distincte de la teneur par cellule.</td></tr><tr><td>Fer sérique, femmes / hommes ≥ 19 ans</td><td>9,0–30,4 / 11,6–31,3 µmol/L</td><td>Sérum ; colorimétrie. Variation horaire et inflammation ; pas un diagnostic isolé.</td></tr><tr><td>Capacité totale de fixation du fer, femmes et hommes</td><td>44,8–80,5 µmol/L</td><td>Sérum ; immunoturbidimétrie ; âge non précisé dans la fiche.</td></tr><tr><td>Hématocrite, femmes ≥ 13 / hommes ≥ 19 ans</td><td>0,360–0,460 / 0,410–0,530 L/L</td><td>Sang <button class="w" data-k="d50-prelevement-edta">EDTA</button> ; cytométrie ; références adolescentes masculines distinctes.</td></tr></table><div class="key"><b>À retenir.</b> Une mesure dans cet intervalle n’exclut pas toute maladie. Par exemple, une saturation à 18 % est dans la référence Viollier mais peut atteindre un seuil décisionnel spécialisé. Une hémoglobine à 132 g/L chez l’homme doit être distinguée du seuil diagnostique <button class="w" data-k="d50-sources-guides">OMS</button>. La grossesse demande ses critères obstétricaux ; aucune de ces références adultes n’est transposée à l’enfant.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/19720" target="_blank" rel="noopener">Viollier, hématocrite</a> ; <a href="https://www.viollier.ch/fr/analysis/19750" target="_blank" rel="noopener">Viollier, concentration globulaire</a> ; <a href="https://www.viollier.ch/fr/analysis/7130" target="_blank" rel="noopener">Viollier, fer sérique</a> ; <a href="https://www.viollier.ch/fr/analysis/16090" target="_blank" rel="noopener">Viollier, capacité totale de fixation</a> ; <a href="https://www.viollier.ch/fr/analysis/19710" target="_blank" rel="noopener">Viollier, hémoglobine, consulté le 11.10.2026</a> ; <a href="https://www.viollier.ch/fr/analysis/19730" target="_blank" rel="noopener">Viollier, volume globulaire moyen, consulté le 11.10.2026</a> ; <a href="https://www.viollier.ch/fr/analysis/19740" target="_blank" rel="noopener">Viollier, teneur globulaire, consulté le 11.10.2026</a> ; <a href="https://www.viollier.ch/fr/analysis/18325" target="_blank" rel="noopener">Viollier, réticulocytes absolus, consulté le 11.10.2026</a> ; <a href="https://www.viollier.ch/fr/analysis/18323" target="_blank" rel="noopener">Viollier, contenu réticulocytaire, consulté le 11.10.2026</a> ; <a href="https://www.viollier.ch/fr/analysis/24976" target="_blank" rel="noopener">Viollier, ferritine, consulté le 11.10.2026</a> ; <a href="https://www.viollier.ch/fr/analysis/16050" target="_blank" rel="noopener">Viollier, saturation, consulté le 11.10.2026</a> ; <a href="https://www.viollier.ch/fr/analysis/7480" target="_blank" rel="noopener">Viollier, protéine C réactive, consulté le 11.10.2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH et SGMO, avril 2025</a>, § 3.5.</p></template>
<template data-pop="d50-conversion-hb" data-title="Conversion des unités d’hémoglobine"><h3>Grandeurs et unités</h3><p>Une concentration associe une masse à un volume. Un décilitre représente un dixième de litre : 1 L = 10 <button class="w" data-k="d50-conversion-hb">dL</button>. La même masse répartie dans un litre produit donc un nombre dix fois plus petit lorsqu’on l’exprime par décilitre.</p><p>La conversion est : valeur en <button class="w" data-k="d50-conversion-hb">g/dL</button> = valeur en g/L ÷ 10. Dans l’autre sens, valeur en g/L = valeur en <button class="w" data-k="d50-conversion-hb">g/dL</button> × 10.</p><h3>Exemple et conséquence</h3><p>Une hémoglobine fictive à 90 g/L devient 90 ÷ 10 = 9 <button class="w" data-k="d50-conversion-hb">g/dL</button>. Une cible de calcul à 15 <button class="w" data-k="d50-conversion-hb">g/dL</button> devient 150 g/L. Pour Ganzoni, l’écart est donc 15 − 9 = 6 <button class="w" data-k="d50-conversion-hb">g/dL</button>, et non 150 − 90 = 60 introduit tel quel dans une formule en <button class="w" data-k="d50-conversion-hb">g/dL</button>. Cette erreur multiplie par dix le fer calculé pour l’hémoglobine.</p><div class="key"><b>À retenir.</b> La conversion ne change ni le résultat biologique ni sa gravité. La cible de 15 <button class="w" data-k="d50-conversion-hb">g/dL</button> appartient au modèle de dose du produit ; elle n’est pas un seuil d’anémie ni une cible universelle pour tout patient.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">information professionnelle suisse Venofer®, calcul du déficit</a> ; <a href="https://www.viollier.ch/fr/analysis/19710" target="_blank" rel="noopener">Viollier, référence d’hémoglobine en g/L, consulté le 11.10.2026</a>. Conversion arithmétique explicitée à partir des unités.</p></template>
<template data-pop="d50-fer-sang" data-title="Pertes sanguines : calculer la perte de fer"><h3>Pourquoi le volume seul ne suffit pas</h3><p>La plus grande part du fer du sang est incorporée dans l’hémoglobine. La masse perdue dépend donc du volume de sang perdu et de sa concentration en hémoglobine. La formule de Ganzoni de Venofer® utilise une teneur en fer de l’hémoglobine de 0,34 %, soit 0,0034 g de fer par gramme d’hémoglobine, ou 3,4 mg/g.</p><p>Estimation du fer perdu (mg) = volume de sang (L) × hémoglobine (g/L) × 3,4 (mg/g). Les litres puis les grammes se simplifient ; le résultat est en milligrammes de fer.</p><h3>Exemple fictif, pas mesure du patient</h3><p>Pour 10 mL de sang à 150 g/L : 10 mL ÷ 1000 = 0,010 L ; 0,010 × 150 = 1,5 g d’hémoglobine ; 1,5 × 3,4 = 5,1 mg de fer, soit environ 5 mg. Pour 1 mL, l’estimation est de 0,51 mg. Le repère clinique d’environ 0,5 mg par millilitre correspond à cette hypothèse d’hémoglobine.</p><div class="key"><b>À retenir.</b> La concentration fictive de 150 g/L se situe dans les références adultes Viollier. Elle n’est pas celle de tout saignement : à 90 g/L, le même volume emporte moins de fer. L’estimation ne mesure pas une hémorragie occulte et ne remplace pas le bilan étiologique.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">information professionnelle suisse Venofer®, calcul du déficit</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH et SGMO, avril 2025</a>, § 2.4, pertes sanguines ; <a href="https://www.viollier.ch/fr/analysis/19710" target="_blank" rel="noopener">Viollier, hémoglobine adulte, consulté le 11.10.2026</a>. Exemples arithmétiques construits pour l’enseignement.</p></template>
<template data-pop="d50-dose-volume" data-title="Dose de fer : poids, concentration et volume"><h3>Trois grandeurs différentes</h3><p>La dose en milligrammes mesure la masse de fer élémentaire. Le poids en kilogrammes intervient dans certaines limites d’administration. La concentration en mg/mL indique la masse contenue dans un millilitre de solution. Ces grandeurs ne sont ni des valeurs biologiques normales ni des critères de carence.</p><p>Dose correspondant au poids (mg) = poids (kg) × limite (mg/kg). Volume de préparation (mL) = dose retenue (mg) ÷ concentration (mg/mL). Avant de calculer le volume, le médecin applique toutes les limites du produit : poids, dose fixe, semaine, voie et durée.</p><h3>Exemple fictif : Ferinject®</h3><p>Pour un adulte de 60 kg, la limite de perfusion de 20 mg/kg donne 60 × 20 = 1200 mg. Le plafond fixe de 1000 mg par perfusion et par semaine réduit la dose maximale autorisée à 1000 mg. La préparation contient 50 mg/mL : 1000 ÷ 50 = 20 mL de préparation. Ces 20 mL ne représentent pas le volume final de perfusion : la dilution au chlorure de sodium à 0,9 % suit le tableau propre au produit.</p><h3>Exemple fictif : Venofer®</h3><p>Une dose de 200 mg, avec une préparation à 20 mg/mL, nécessite 200 ÷ 20 = 10 mL de Venofer®. Les modalités diffèrent de Ferinject® : une perfusion de 200 mg dure au moins trente minutes. Un même volume ne contient donc pas la même dose dans les deux produits.</p><div class="key"><b>À retenir.</b> Maltofer® sirop contient 10 mg/mL, mais les comprimés présentés dans le cours contiennent 100 mg par unité. Les fenêtres de produit fixent les formes et les doses autorisées. Aucun calcul de volume ne rend automatiquement adaptée une dose à un enfant, à une grossesse ou à une maladie rénale.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">FI suisse Ferinject®, composition et administration</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">information professionnelle suisse Venofer®, calcul du déficit</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680465370844" target="_blank" rel="noopener">FI suisse Maltofer®, formes et composition</a>. Exemples fictifs, calculs d’unités explicites.</p></template>
<template data-pop="d50-index-ferritine" data-title="Indice du récepteur soluble et de la ferritine : calcul et méthode"><h3>Deux informations complémentaires</h3><p>Le récepteur soluble de la transferrine renseigne sur l’activité et l’approvisionnement de l’érythropoïèse. La <button class="w" data-k="d50-ferritine">ferritine</button> renseigne sur les réserves, tout en augmentant sous inflammation. Leur indice compare le récepteur soluble au logarithme décimal de la <button class="w" data-k="d50-ferritine">ferritine</button>, afin de mettre en évidence une carence absolue associée à une inflammation.</p><p>Indice = récepteur soluble, valeur numérique en mg/L ÷ logarithme décimal de la <button class="w" data-k="d50-ferritine">ferritine</button>, valeur numérique en µg/L. Le logarithme est celui du nombre exprimé dans cette unité conventionnelle ; changer l’unité de <button class="w" data-k="d50-ferritine">ferritine</button> sans adapter la convention change l’indice. Le logarithme décimal de 10 vaut 1 ; celui de 100 vaut 2.</p><h3>Exemple fictif</h3><p>Avec un récepteur soluble à 3 mg/L et une <button class="w" data-k="d50-ferritine">ferritine</button> à 100 µg/L, le dénominateur vaut log₁₀(100) = 2 ; l’indice vaut 3 ÷ 2 = 1,5. Ce résultat ne reçoit pas de diagnostic avant identification du dosage : le même nombre ne se compare pas aux bornes d’un autre réactif.</p><p>Les références documentées sont présentées séparément.</p><table class="t"><tr><th>Méthode et population</th><th>Référence de l’indice</th><th>Limite</th></tr><tr><td>Viollier, femmes et hommes ; méthode à vérifier sur le compte rendu</td><td>0,38–1,54</td><td>La fiche suisse ne précise ni âge, ni matériel, ni méthode ; le compte rendu prévaut</td></tr><tr><td>Tina-quant, hommes ; Onkopedia</td><td>0,2–3,7</td><td>Référence spécifique du dosage</td></tr><tr><td>Tina-quant, femmes ; Onkopedia</td><td>0,6–3,8</td><td>Référence spécifique du dosage</td></tr></table><p>Le Thomas-plot associe cet indice au contenu réticulocytaire en hémoglobine. Ses seuils de décision diffèrent encore des intervalles descriptifs.</p><table class="t"><tr><th>Dosage, seuil du Thomas-plot</th><th><button class="w" data-k="d50-proteine-c-reactive">Protéine C réactive</button> ≤ 5 mg/L</th><th><button class="w" data-k="d50-proteine-c-reactive">Protéine C réactive</button> &gt;5 mg/L</th></tr><tr><td>Dade Behring</td><td>1,5</td><td>0,8</td></tr><tr><td>Tina-quant</td><td>3,8</td><td>2,0</td></tr></table><div class="key"><b>À retenir.</b> Ces seuils s’emploient avec le contenu réticulocytaire et le protocole analytique correspondant ; ils ne se transposent pas à Viollier. Le seuil inflammatoire de 5 mg/L du graphique n’est pas la limite de référence Viollier de 3,4 mg/L. Une érythropoïèse accélérée, par exemple lors d’hémolyse ou de thalassémie, peut augmenter l’indice sans réserves vides. <button class="w" data-k="d50-ferritine">Ferritine</button> et récepteur soluble restent donc interprétés individuellement.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/16054" target="_blank" rel="noopener">Viollier, indice récepteur soluble/logarithme ferritine, consulté le 11.10.2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH et SGMO, avril 2025</a>, § 3.5.8–3.5.9.</p></template>
<template data-pop="d50-rapport-hepcidine" data-title="Rapport saturation/hepcidine : raisonnement et limites"><h3>La question clinique</h3><p>Une hepcidine ne devient pas inappropriée par son seul chiffre : elle doit être comparée au fer disponible et à l’inflammation. Dans l’anémie ferriprive réfractaire héréditaire, une saturation très basse peut coexister avec une hepcidine insuffisamment abaissée. Hoving et coll. utilisent donc le rapport saturation/hepcidine comme argument spécialisé.</p><p>Rapport = saturation, en pourcentage ÷ hepcidine, en nmol/L. Le résultat est exprimé en % par nmol/L. Le numérateur est le pourcentage, par exemple 6, et non sa fraction 0,06.</p><h3>Exemple fictif</h3><p>Une saturation à 6 % avec une hepcidine à 4 nmol/L donne 6 ÷ 4 = 1,5 % par nmol/L. Ce nombre n’établit pas le diagnostic : l’âge, le sexe, l’inflammation et un dosage standardisé sont indispensables.</p><p>L’avis d’experts 2025 décrit les limites basses suivantes, correspondant au 2,5<sup>e</sup> percentile. Ce sont des repères de suspicion et non un intervalle suisse universel.</p><table class="t"><tr><th>Population adulte</th><th>Rapport suspect, % par nmol/L</th></tr><tr><td>Homme</td><td>&lt; 1,6</td></tr><tr><td>Femme avant la ménopause</td><td>&lt; 1,9</td></tr><tr><td>Femme après la ménopause</td><td>&lt; 1,4</td></tr></table><div class="key"><b>À retenir.</b> Les références pédiatriques diffèrent selon l’âge. Un résultat obtenu avec un dosage non standardisé, une autre unité d’hepcidine ou un peptide différent ne peut pas utiliser ces bornes. L’absence d’intervalle suisse harmonisé est une limite explicitement conservée ; le diagnostic génétique suit l’exclusion des causes acquises et un avis hématologique.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et coll., 2025, tableau 1 et note c ; avis d’experts européen</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH et SGMO, avril 2025</a>, § 3.5.11.</p></template>
<template data-pop="d50-teneur-globulaire" data-title="Teneur corpusculaire en hémoglobine : valeur et calcul"><h3>Une masse par cellule</h3><p>La teneur corpusculaire moyenne en hémoglobine mesure la masse moyenne d’hémoglobine dans une hématie. Viollier donne 26–34 pg dès 19 ans, pour les femmes et les hommes, sur sang anticoagulé analysé par cytométrie. Un picogramme représente 10⁻¹² gramme.</p><p>La formule est : concentration d’hémoglobine (g/L) ÷ nombre d’hématies par litre. Le litre se simplifie ; on obtient des grammes par hématie, puis on convertit en picogrammes.</p><h3>Exemple fictif</h3><p>Avec 120 g/L d’hémoglobine et 4 × 10¹² hématies/L : 120 ÷ (4 × 10¹²) = 30 × 10⁻¹² g par hématie, soit 30 pg. Ce résultat est dans la référence Viollier. Une anémie éventuelle reste jugée sur l’hémoglobine et la population ; une teneur conservée ne l’exclut pas.</p><div class="key"><b>À retenir.</b> La <button class="w" data-k="d50-sources-guides">BSG</button> et Onkopedia utilisent d’autres seuils d’hypochromie selon les méthodes. Un seuil de 28 pg ne remplace pas mécaniquement la borne basse Viollier de 26 pg. La restriction martiale, une thalassémie et des carences mixtes se distinguent par le bilan complet.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/19740" target="_blank" rel="noopener">Viollier, teneur corpusculaire moyenne, consulté le 11.10.2026</a> ; <a href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf" target="_blank" rel="noopener">Contrôle de qualité suisse, fiche technique 2011, formule section C 2 uniquement</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH et SGMO, avril 2025</a>, § 3.5.1. La définition générale d’anémie ancienne de la fiche Contrôle de qualité suisse n’est pas utilisée.</p></template>

<template data-pop="d50-conversion-phosphate" data-title="Conversion des unités de phosphate"><h3>La convention de mesure</h3><p>L’unité <button class="w" data-k="d50-conversion-phosphate">mg/dL</button> signifie milligrammes par décilitre. Un décilitre vaut 0,1 litre, soit 100 mL ; 1 <button class="w" data-k="d50-conversion-phosphate">mg/dL</button> équivaut donc à 10 mg/L. Le catalogue de l’Hôpital cantonal de Lucerne donne le facteur de conversion : valeur en mmol/L × 3,097 = valeur en <button class="w" data-k="d50-conversion-phosphate">mg/dL</button> ; dans l’autre sens, valeur en <button class="w" data-k="d50-conversion-phosphate">mg/dL</button> × 0,323 = valeur en mmol/L. Le résultat massique correspond à la convention analytique du phosphore ; il ne faut pas substituer la masse entière de l’ion phosphate à ce facteur validé.</p><h3>Exemple fictif et interprétation</h3><p>Une concentration de 0,8 mmol/L donne 0,8 × 3,097 = 2,4776 <button class="w" data-k="d50-conversion-phosphate">mg/dL</button>, soit environ 2,48 <button class="w" data-k="d50-conversion-phosphate">mg/dL</button>. Inversement, 2,5 <button class="w" data-k="d50-conversion-phosphate">mg/dL</button> donnent 2,5 × 0,323 = 0,8075 mmol/L, soit environ 0,81 mmol/L. Les arrondis expliquent pourquoi le seuil d’une étude à 2,5 <button class="w" data-k="d50-conversion-phosphate">mg/dL</button> ne se confond pas strictement avec une borne à 0,8 mmol/L.</p><div class="key"><b>À retenir.</b> Le laboratoire de l’Hôpital cantonal de Lucerne donne 0,81–1,45 mmol/L chez l’adulte sur plasma lithium-héparine, à jeun depuis douze heures, avec variation horaire. La conversion change l’unité, pas la gravité : symptômes, durée de la baisse et contexte de perfusion doivent être évalués. Aucun seuil de gravité supplémentaire n’est inventé à partir du calcul.</div><p class="src">Référence : <a href="https://analysenverzeichnis.luks.ch/analysis/Phosphat_anorganisch" target="_blank" rel="noopener">Hôpital cantonal de Lucerne, phosphate inorganique, facteur de conversion et référence adulte</a>. Exemple arithmétique fictif.</p></template>
<template data-pop="d50-rapport-cotes" data-title="Rapport de cotes : ce que compare le chiffre"><h3>Du nombre de patients au rapport</h3><p>Une probabilité rapporte les patients présentant un événement à tous les patients. Une cote compare ceux qui présentent l’événement à ceux qui ne le présentent pas. Le rapport de cotes divise la cote du groupe traité par celle du groupe comparateur ; il est sans unité.</p><p>Dans un exemple fictif de deux groupes de cent patients, vingt ont un effet digestif sous traitement A et dix sous traitement B. Les probabilités sont 20/100 = 20 % et 10/100 = 10 %. Les cotes sont 20/80 = 0,25 et 10/90 ≈ 0,111. Leur rapport vaut 0,25 ÷ 0,111 ≈ 2,25.</p><h3>Interprétation et limites</h3><p>Le tableau situe le résultat par rapport à la valeur neutre de 1.</p><table class="t"><tr><th>Rapport de cotes</th><th>Interprétation, événement du premier groupe</th></tr><tr><td>&lt;1</td><td>Cotes plus faibles</td></tr><tr><td>1</td><td>Cotes égales</td></tr><tr><td>&gt;1</td><td>Cotes plus élevées</td></tr></table><p>Cette comparaison reste propre à l’événement et aux groupes étudiés. Le rapport de 2,25 ne signifie pas 2,25 fois plus de patients : le rapport des probabilités de cet exemple vaut 20/10 = 2. La différence s’accentue lorsque l’événement est fréquent.</p><div class="key"><b>À retenir.</b> Dans les données citées par la <button class="w" data-k="d50-sources-guides">BSG</button>, les rapports de 2,32 contre placebo et de 3,05 contre fer intraveineux concernent les effets digestifs du sulfate ferreux. Ils n’indiquent ni une probabilité individuelle ni une supériorité globale de la voie intraveineuse. La population, l’incertitude et le comparateur restent indispensables.</div><p class="src">Référence clinique : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, effets digestifs du sulfate ferreux</a>. Définition arithmétique et exemple fictif explicités pour la lecture des chiffres.</p></template>

<template data-pop="d50-conversion-ferritine" data-title="Ferritine : ng/mL et µg/L"><h3>Masse et volume changent ensemble</h3><p>Un nanogramme vaut un millième de microgramme, et un millilitre vaut un millième de litre. Diviser une masse et un volume par le même facteur laisse la valeur numérique de leur rapport identique : 1 ng/mL = 0,001 µg/0,001 L = 1 µg/L.</p><p>Une <button class="w" data-k="d50-ferritine">ferritine</button> fictive de 20 ng/mL est donc égale à 20 µg/L. Cette valeur est sous la référence Viollier dès 16 ans de 30–300 µg/L et indique des réserves insuffisantes selon Onkopedia chez l’adulte sans inflammation. La conversion n’ajoute aucune information sur l’hémoglobine ni aucune indication de perfusion.</p><div class="key"><b>À retenir.</b> Elle ne s’applique pas à des unités dont la masse ou le volume change sans le même facteur. Le résultat doit garder sa méthode, sa population et son contexte inflammatoire.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/24976" target="_blank" rel="noopener">Viollier, ferritine en µg/L</a> ; <a href="https://www.medix.ch/fr/connaissances/guide-des-bonnes-pratiques/carence-en-fer/" target="_blank" rel="noopener">mediX 08/2025, ferritine en ng/mL</a>. Équivalence explicitée à partir des unités.</p></template>
<template data-pop="d50-poids-modele" data-title="Poids utilisé pour Ganzoni : calcul et limites"><h3>Un poids pour le modèle de dose</h3><p>Les FI Ferinject® et MonoFer® conseillent le poids idéal chez le patient en surpoids ou obèse et le poids avant la grossesse chez la femme enceinte. Elles donnent un exemple de poids correspondant à un indice de masse corporelle de 25 kg/m². Ce nombre est une convention de calcul dans ces FI, pas une référence biologique universelle ni une prescription de perte de poids.</p><p>Indice de masse corporelle = poids (kg) ÷ taille² (m²). En isolant le poids, on obtient : poids du modèle (kg) = 25 kg/m² × taille² (m²).</p><h3>Exemple fictif</h3><p>Pour une taille de 1,70 m, le carré est 1,70 × 1,70 = 2,89 m². Le poids du modèle vaut 25 × 2,89 = 72,25 kg. Ce poids peut servir au calcul indiqué par le produit, au lieu d’un poids augmenté par la graisse ; une rétention d’eau demande également une appréciation clinique. Le poids réel reste nécessaire pour les autres limites d’administration lorsqu’elles l’exigent.</p><div class="key"><b>À retenir.</b> La formule ne convient pas automatiquement à un enfant, à une personne cachectique ou à toutes les situations de grossesse. Le choix du poids et de la cible d’hémoglobine appartient au médecin ; il doit rester conforme à la préparation exacte.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">FI suisse Ferinject®, note A de Ganzoni</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">FI suisse MonoFer®, note A de Ganzoni</a>. Exemple fictif, transformation arithmétique de la formule.</p></template>

<template data-pop="d50-filtration-renale" data-title="Filtration rénale : normalité et seuils de produit"><h3>Une quantité filtrée par minute</h3><p>Le débit de filtration glomérulaire estime le volume de plasma filtré par les reins en une minute. Le résultat utilisé dans les études et dans la FI Feraccru® est rapporté à une surface corporelle de 1,73 m² : il s’exprime en mL/min/1,73 m². Une clairance médicamenteuse en mL/min n’est pas automatiquement interchangeable avec ce résultat indexé.</p><p>La Société suisse de néphrologie classe un débit estimé ≥ 90 mL/min/1,73 m² comme normal ou hyperfiltrant, catégorie G 1. Il s’agit d’une borne de classification, sans limite supérieure universelle : elle ne fournit pas un intervalle 90–120 valable pour tous les âges. La créatinine ou la cystatine C servent à l’estimation ; l’âge, le contexte et les marqueurs d’atteinte rénale participent à l’interprétation.</p><p>Les deux repères suivants répondent à des questions distinctes.</p><table class="t"><tr><th>Question</th><th>Repère ; mL/min/1,73 m²</th><th>Portée</th></tr><tr><td>Catégorie G 1, guide suisse 2025</td><td>≥ 90</td><td>Normal ou hyperfiltrant ; n’exclut pas une maladie rénale avec marqueurs d’atteinte</td></tr><tr><td>Critère de maladie rénale chronique, guide suisse 2025</td><td>&lt;60 pendant au moins trois mois</td><td>Chronicité requise ; une valeur isolée ne suffit pas</td></tr><tr><td>Population de l’essai rénal Feraccru®</td><td>15 à &lt;60</td><td>Critère d’étude, pas référence normale</td></tr><tr><td>Limite des données de la FI Feraccru®</td><td>&lt;15</td><td>Pas de donnée d’adaptation ; pas d’extrapolation de la dose</td></tr></table><div class="key"><b>À retenir.</b> Une personne de l’essai à 40 mL/min/1,73 m² présente donc une filtration diminuée ; son inclusion ne démontre pas l’efficacité en dessous de 15. Le résultat doit être lu avec son mode d’estimation et l’évolution du patient. Cette fenêtre ne calcule pas une clairance de médicament et ne remplace pas l’avis néphrologique.</div><p class="src">Références : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie, guide 17.03.2025, figures 2 et 3</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">FI suisse Feraccru®, insuffisance rénale et essai</a>.</p></template>

<template data-pop="d50-sport" data-title="Sport et carence martiale : consensus suisse"><h3>Les mécanismes propres à l’effort</h3><p>Le consensus de la Société suisse de médecine du sport, publié en 2015 et reproduit en 2016, décrit des besoins accrus, des pertes digestives liées à la micro-ischémie d’effort et des poussées d’hepcidine. La destruction mécanique d’hématies sous les impacts existe, mais le recyclage complet de leur fer ne constitue pas à lui seul une perte martiale. Les pertes sudorales ne sont pas considérées comme une cause quantitative majeure dans ce texte.</p><h3>Repères et exception de l’altitude</h3><p>Ces repères de ferritine sont ceux du consensus sportif ; ils ne sont pas des intervalles de laboratoire universels. Les classes d’âge sont reprises telles que publiées et se confrontent à la référence pédiatrique du laboratoire.</p><table class="t"><tr><th>Population du consensus</th><th>Ferritine ; µg/L</th><th>Sens du repère</th></tr><tr><td>Enfant, 6–12 ans</td><td>&lt; 15</td><td>Repère de carence dans ce cadre</td></tr><tr><td>Adolescent, 12–15 ans</td><td>&lt; 20</td><td>Repère de carence dans ce cadre</td></tr><tr><td>Athlète de plus de 15 ans</td><td>&lt; 30</td><td>Réserves insuffisantes</td></tr><tr><td>Athlète adulte d’élite avant séjour d’altitude</td><td>Cible de 50</td><td>Exception liée à l’augmentation des besoins ; texte anglais du consensus</td></tr></table><p>La cible d’altitude ne devient pas un seuil de perfusion pour toute fatigue. Le consensus recommande de corriger l’apport énergétique et alimentaire, puis de privilégier le fer oral ; la dose usuelle proposée alors était de 40–60 mg de fer élément par jour. Le schéma actuel est adapté au produit suisse et aux recommandations plus récentes, sans extrapoler une dose adulte à l’enfant.</p><h3>Performance et limites des preuves</h3><p>Les essais chez des sportifs sans anémie sont hétérogènes. Une hausse des réserves ne démontre pas à elle seule une meilleure performance. Dans la revue suisse, les sportifs aux réserves normales ne tirent pas un bénéfice fiable de la supplémentation ; certains essais observent un bénéfice chez des groupes réellement carencés. Une correction biologique et une amélioration ressentie restent des critères différents.</p><h3>Contrôle et prévention de l’excès</h3><p>Le consensus propose un bilan de réponse à six–huit semaines, puis un contrôle individualisé environ deux fois par an, voire deux à trois fois chez l’athlète d’endurance de haut niveau. Des réserves basses à répétition peuvent justifier un apport oral intermittent ; ce rythme se distingue de la fréquence quotidienne autorisée des produits cités. Une administration prolongée avec réserves normales ou élevées est déconseillée.</p><p>Le texte de 2015 comporte également des règles antidopage historiques. Elles ne sont pas reproduites comme règles actuelles : la réglementation en vigueur doit être vérifiée avant une perfusion chez un athlète soumis aux contrôles. L’actualisation ciblée consultée n’a pas identifié un nouveau consensus suisse formel qui remplacerait ce document ; cette recherche ne démontre pas une absence universelle.</p><div class="key"><b>À retenir.</b> Le sport modifie les besoins, le contexte du prélèvement et le suivi. L’exception d’altitude et les résultats d’études sélectionnées ne justifient pas une supplémentation sans déficit démontré.</div><p class="src">Référence : <a href="https://sems.ch/fileadmin/user_upload/Zeitschrift/64-2016-1/1-2016_1_Clenin.pdf" target="_blank" rel="noopener">Consensus de médecine du sport 2015, reproduction intégrale autorisée 2016, pages 6–15</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017, tableau des essais de performance</a> ; les limites de produit et de prescription restent celles des informations professionnelles suisses citées.</p></template>

<template data-pop="d50-concentration-globulaire" data-title="Concentration et teneur de l’hématie : deux mesures"><h3>Une masse par volume de globules rouges</h3><p>La concentration corpusculaire moyenne en hémoglobine rapporte la masse d’hémoglobine au volume occupé par les hématies. La fiche Viollier donne 310–350 g/L dès 19 ans, femmes et hommes, à partir du sang <button class="w" data-k="d50-prelevement-edta">EDTA</button> ; la méthode indiquée est un calcul.</p><p>Cette concentration ne se confond pas avec l’hémoglobine du sang entier, dont le volume inclut aussi le plasma. Elle ne se confond pas non plus avec la <button class="w" data-k="d50-teneur-globulaire">teneur moyenne par hématie</button>, exprimée en picogrammes. Une concentration dans la référence ne prouve donc pas que le patient a une hémoglobine sanguine normale ou des réserves suffisantes.</p><h3>Le calcul et les unités</h3><p>L’hématocrite est le volume d’hématies rapporté au volume sanguin, exprimé en litres par litre. La concentration corpusculaire = hémoglobine sanguine (g/L de sang) ÷ hématocrite (L d’hématies/L de sang). Le volume sanguin se simplifie ; le résultat est en g/L d’hématies. Une valeur à 42 % doit être convertie en 42 ÷ 100 = 0,42 L/L avant le calcul.</p><p>Viollier donne les références d’hématocrite ci-dessous sur sang <button class="w" data-k="d50-prelevement-edta">EDTA</button>, par cytométrie ; elles ne sont pas des cibles de traitement.</p><table class="t"><tr><th>Population de la fiche</th><th>Hématocrite ; L/L</th></tr><tr><td>Femmes dès 13 ans</td><td>0,360–0,460</td></tr><tr><td>Hommes dès 19 ans</td><td>0,410–0,530</td></tr></table><p>Les âges pédiatriques et les adolescents masculins ont leurs propres références. Le compte rendu prévaut.</p><h3>Exemple fictif</h3><p>Avec une hémoglobine à 140 g/L et un hématocrite à 0,42 L/L : 140 ÷ 0,42 ≈ 333 g/L d’hématies. Ces valeurs appartiennent aux références adultes Viollier des deux sexes et le résultat se situe dans l’intervalle de concentration 310–350 g/L. Une erreur consistant à diviser par 42 donnerait un nombre cent fois trop petit.</p><div class="key"><b>À retenir.</b> Le médecin lit les indices ensemble, avec la ferritine et le contexte inflammatoire. Leurs intervalles sont propres au laboratoire ; les références pédiatriques ne sont pas remplacées par la ligne adulte.</div><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/19750" target="_blank" rel="noopener">Viollier, concentration corpusculaire moyenne, méthode et références</a>, consulté le 11.10.2026 ; <a href="https://www.viollier.ch/fr/analysis/19720" target="_blank" rel="noopener">Viollier, hématocrite</a> ; <a href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf" target="_blank" rel="noopener">fiche suisse de contrôle de qualité 2011, sections C3 et F, formule uniquement</a>. Les anciennes références de cette fiche ne sont pas utilisées.</p></template>

<template data-pop="d50-prelevement-edta" data-title="Prélèvement anticoagulé pour l’hématologie"><h3>Du nom chimique au prélèvement</h3><p><button class="w" data-k="d50-prelevement-edta">EDTA</button> désigne ici l’acide éthylènediaminetétraacétique : E pour éthylène, D pour diamine, T pour tétra et A pour acétique. Cet additif empêche la coagulation dans les tubes utilisés pour la formule sanguine. Le rapport fédéral du 31 octobre 2025 décrit les formes dipotassique et tripotassique ; leur substitution demande une validation du laboratoire.</p><h3>Lire le matériel indiqué</h3><p>Les fiches Viollier d’hémoglobine, d’hématocrite et de concentration corpusculaire indiquent « Sang <button class="w" data-k="d50-prelevement-edta">EDTA</button> ». La ferritine et le bilan du fer demandent du sérum dans leurs fiches respectives. Le prélèvement fait donc partie de la définition analytique ; les instructions du laboratoire accompagnent les valeurs de référence et la méthode.</p><div class="key"><b>À retenir.</b> Sur ces fiches, <button class="w" data-k="d50-prelevement-edta">EDTA</button> qualifie le tube anticoagulé utilisé pour les mesures hématologiques. Le matériel demandé doit être vérifié pour chaque analyse.</div><p class="src">Références : <a href="https://www.bwl.admin.ch/dam/fr/sd-web/m03VGYFECO5Y/2024%20Bericht%20ven%C3%B6se%20Blutentnahmer%C3%B6rhchen%20%C3%B6ffentlich_franz%C3%B6sisch.pdf" target="_blank" rel="noopener">Rapport fédéral sur les tubes de prélèvement, 31.10.2025, section 8.3</a> ; <a href="https://www.viollier.ch/fr/analysis/19710" target="_blank" rel="noopener">Viollier, hémoglobine</a> ; <a href="https://www.viollier.ch/fr/analysis/19720" target="_blank" rel="noopener">Viollier, hématocrite</a> ; <a href="https://www.viollier.ch/fr/analysis/19750" target="_blank" rel="noopener">Viollier, concentration corpusculaire</a> ; <a href="https://www.viollier.ch/fr/analysis/24976" target="_blank" rel="noopener">Viollier, ferritine</a>.</p></template>
<template data-pop="d50-sources-guides" data-title="Organisations et guides cités dans D50"><h3>Identifier l’auteur et la version</h3><p>Le nom d’une organisation ne suffit pas à identifier une recommandation. Ce tableau rattache les sigles aux documents effectivement utilisés dans ce cours. Les seuils, populations et limites se lisent dans les fenêtres cliniques correspondantes.</p><table class="t"><tr><th>Sigle ou nom</th><th>Développement</th><th>Document utilisé et portée</th></tr><tr><td><button class="w" data-k="d50-sources-guides">BSG</button></td><td>B : British ; S : Society of ; G : Gastroenterology. Société britannique de gastroentérologie</td><td>Guide 2021 sur l’anémie ferriprive adulte ; clarification du test fécal en 2025 avec l’association de coloproctologie</td></tr><tr><td><button class="w" data-k="d50-sources-guides">OMS</button></td><td>O : Organisation ; M : mondiale ; S : de la santé</td><td>Ferritine en 2020 ; seuils d’hémoglobine selon les populations en 2024</td></tr><tr><td><button class="w" data-k="d50-sources-guides">OFSP</button></td><td>O : Office ; F : fédéral ; S : de la santé ; P : publique</td><td>Évaluation du fer sans anémie en 2020 ; synthèse officielle consultée, avec ses limites de certitude</td></tr><tr><td><button class="w" data-k="d50-sources-guides">mediX</button></td><td>Nom propre du réseau suisse de médecins de famille</td><td>Guide « Carence en fer », mise à jour août 2025</td></tr><tr><td><button class="w" data-k="d50-sources-guides">ESC</button></td><td>E : European ; S : Society of ; C : Cardiology. Société européenne de cardiologie</td><td>Guide 2026 : deux recommandations sur le fer lues dans le support officiel ; accès au texte intégral spécialisé limité</td></tr><tr><td><button class="w" data-k="d50-sources-guides">KDIGO</button></td><td>K : Kidney ; D : Disease ; I : Improving ; G : Global ; O : Outcomes. Améliorer les résultats globaux des maladies rénales</td><td>Guide 2026 sur l’anémie de la maladie rénale chronique ; décisions propres aux populations rénales</td></tr><tr><td><button class="w" data-k="d50-sources-guides">ACPGBI</button></td><td>A : Association ; C et P : of coloproctology ; G et B : of Great Britain ; I : and Ireland. Association de coloproctologie de Grande‑Bretagne et d’Irlande</td><td>Partenaire de la société britannique de gastroentérologie pour la clarification du test fécal en 2025</td></tr></table><h3>Relier la recommandation au produit suisse</h3><p>Ces guides décrivent des décisions cliniques. L’information professionnelle suisse du produit exact fixe ses indications, contre-indications, posologies et conditions d’administration. Les différences entre référence de laboratoire, seuil de décision et objectif thérapeutique restent explicites dans le cours.</p><div class="key"><b>À retenir.</b> Une citation se lit avec son année, son sujet et sa population. Le guide de carence martiale et la notice suisse du médicament répondent à des questions complémentaires.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://www.bsg.org.uk/getmedia/a25f5f4a-e86a-4f60-b8b1-35b30046f3d3/flgastro-2025-103329.pdf" target="_blank" rel="noopener">Clarification 2025</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS 2020</a> ; <a href="https://iris.who.int/handle/10665/376196" target="_blank" rel="noopener">OMS 2024</a> ; <a href="https://www.bag.admin.ch/dam/de/sd-web/Xa2e4TsMiPr8/h0002eisn-hta-report-es.pdf" target="_blank" rel="noopener">OFSP, synthèse 2020</a> ; <a href="https://www.medix.ch/fr/connaissances/guide-des-bonnes-pratiques/carence-en-fer/" target="_blank" rel="noopener">mediX 2025</a> ; <a href="https://dam-assets.escardio.org/download/b2e587389baa11f185de06bdfb3e4be9" target="_blank" rel="noopener">ESC, support officiel 2026</a> ; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026</a>.</p></template>
