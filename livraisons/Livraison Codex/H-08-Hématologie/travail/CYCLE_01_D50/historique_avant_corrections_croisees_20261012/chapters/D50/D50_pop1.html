<template data-pop="d50-anemie-def" data-title="Hémoglobine : normalité, diagnostic et gravité"><h3>Ce que mesure l’hémoglobine</h3><p>La concentration d’hémoglobine indique la masse de cette protéine dans un litre de sang. L’hémoglobine des hématies assure le transport de l’oxygène. Le résultat se lit avec la population, l’altitude et la tolérance clinique.</p><p>Le tableau distingue l’intervalle descriptif d’un laboratoire suisse du seuil diagnostique de l’<button class="w" data-k="d50-sources-guides">OMS</button>. Les intervalles Viollier concernent le sang prélevé sur anticoagulant, mesuré par cytométrie ; le compte rendu du laboratoire qui a réalisé l’analyse prévaut.</p><table class="t"><tr><th>Population et contexte</th><th>Intervalle de référence du laboratoire</th><th>Seuil diagnostique d’anémie</th></tr><tr><td>Femme, dès 19 ans, hors grossesse</td><td>120–160 g/L, Viollier</td><td>&lt; 120 g/L, <button class="w" data-k="d50-sources-guides">OMS</button> 2024, 15–65 ans</td></tr><tr><td>Homme, dès 19 ans</td><td>135–175 g/L, Viollier</td><td>&lt; 130 g/L, <button class="w" data-k="d50-sources-guides">OMS</button> 2024, 15–65 ans</td></tr><tr><td>Grossesse, premier ou troisième trimestre</td><td>Pas d’intervalle universel donné ici ; hémodilution physiologique</td><td>&lt; 110 g/L, <button class="w" data-k="d50-sources-guides">OMS</button> 2024 et gynécologie suisse</td></tr><tr><td>Grossesse, deuxième trimestre</td><td>Pas d’intervalle universel donné ici ; nadir de l’hémodilution</td><td>&lt; 105 g/L, <button class="w" data-k="d50-sources-guides">OMS</button> 2024 et gynécologie suisse</td></tr></table><p>Un homme à 132 g/L peut donc se situer sous la référence Viollier sans répondre au seuil <button class="w" data-k="d50-sources-guides">OMS</button> de l’anémie. Cette différence doit être expliquée ; elle ne justifie ni de modifier le résultat ni de prescrire du fer sans bilan martial. Les seuils adultes <button class="w" data-k="d50-sources-guides">OMS</button> de ce tableau concernent les 15–65 ans ; l’enfant et les autres âges demandent leur référence propre.</p><h3>Gravité biologique</h3><p>L’<button class="w" data-k="d50-sources-guides">OMS</button> 2024 classe l’anémie selon les catégories suivantes. Les bornes concernent la concentration d’hémoglobine, avant correction d’altitude.</p><table class="t"><tr><th>Population ; toutes les valeurs sont en g/L</th><th>Légère</th><th>Modérée</th><th>Sévère</th></tr><tr><td>Homme, 15–65 ans</td><td>110–129</td><td>80–109</td><td>&lt; 80</td></tr><tr><td>Femme non enceinte, 15–65 ans</td><td>110–119</td><td>80–109</td><td>&lt; 80</td></tr><tr><td>Grossesse, premier ou troisième trimestre</td><td>100–109</td><td>70–99</td><td>&lt; 70</td></tr><tr><td>Grossesse, deuxième trimestre</td><td>95–104</td><td>70–94</td><td>&lt; 70</td></tr></table><p>Une hémoglobine de 90 g/L est modérément abaissée dans ces quatre populations. Cette catégorie ne décide pas seule d’une transfusion : la rapidité de la baisse, le saignement et les signes de mauvaise tolérance changent l’urgence.</p><h3>Altitude et unités</h3><p>Pour les altitudes ci-dessous, l’<button class="w" data-k="d50-sources-guides">OMS</button> augmente le seuil diagnostique selon cette correction.</p><table class="t"><tr><th>Altitude de résidence</th><th>Augmentation du seuil <button class="w" data-k="d50-sources-guides">OMS</button> ; g/L</th></tr><tr><td> 500–999 m</td><td>4</td></tr><tr><td>1000–1499 m</td><td>8</td></tr><tr><td>1500–1999 m</td><td>11</td></tr></table><div class="key"><b>À retenir.</b> Le tabagisme demande également la correction <button class="w" data-k="d50-sources-guides">OMS</button> applicable. Les valeurs en grammes par litre ne doivent pas être introduites directement dans une formule utilisant des grammes par décilitre : <button class="w" data-k="d50-conversion-hb">conversion de l’hémoglobine, avec exemple</button>.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/19710" target="_blank" rel="noopener">Viollier, hémoglobine, consulté le 11.10.2026</a> ; <a href="https://iris.who.int/handle/10665/376196" target="_blank" rel="noopener">OMS 2024, tableaux 2 à 4</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 2022</a>.</p></template>
<template data-pop="d50-ferritine" data-title="Ferritine : ce qu’un seuil permet de conclure"><h3>Mesure, normalité suisse et seuils</h3><p>La ferritine renseigne sur les réserves de fer, mais augmente aussi lors d’une inflammation. Viollier utilise le sérum et un immunodosage par chimiluminescence ; son intervalle dès 16 ans est de 30–300 µg/L pour les femmes et les hommes. Les catégories répondent à des questions différentes.</p><table class="t"><tr><th>Contexte</th><th>Valeur de ferritine ; µg/L</th><th>Interprétation</th></tr><tr><td>Adulte sans inflammation</td><td>&lt; 15</td><td>Réserves épuisées ; seuil très spécifique, <button class="w" data-k="d50-sources-guides">BSG</button> et <button class="w" data-k="d50-sources-guides">OMS</button></td></tr><tr><td>Adulte sans inflammation</td><td>15 à &lt; 30</td><td>Réserves insuffisantes, Onkopedia 2025</td></tr><tr><td>Laboratoire Viollier, dès 16 ans, femmes et hommes</td><td>30–300</td><td>Intervalle de référence descriptif ; ni cible de traitement ni exclusion universelle de carence</td></tr><tr><td>Adulte avec inflammation</td><td>&lt; 70</td><td>Carence possible, <button class="w" data-k="d50-sources-guides">OMS</button> 2020 ; recommandation conditionnelle de faible certitude</td></tr><tr><td>Intestin inflammatoire actif</td><td>&lt; 100</td><td>Seuil spécialisé du Delphi suisse ; ne s’étend pas à toute inflammation</td></tr><tr><td>Cadre général <button class="w" data-k="d50-sources-guides">BSG</button></td><td>&gt; 150</td><td>Carence absolue peu probable dans ce cadre ; ne s’extrapole pas au cancer ou à une maladie hépatique</td></tr></table><p>Une ferritine à 200 µg/L peut appartenir à l’intervalle Viollier et accompagner une restriction du fer en cas d’inflammation. Inversement, une valeur à 20 µg/L sans inflammation indique des réserves insuffisantes selon Onkopedia. Le seuil obstétrical de 30 µg/L et la probabilité de réserves vides de 90 % concernent la grossesse dans l’avis suisse ; cette probabilité ne s’applique pas à tout adulte.</p><p>La <button class="w" data-k="d50-conversion-ferritine">conversion entre ng/mL et µg/L</button> montre pourquoi ces deux unités donnent le même nombre ; elle ne change pas le seuil clinique.</p><h3>Conditions d’interprétation</h3><p>Le médecin recherche inflammation, infection, atteinte hépatique et cancer, puis confronte la valeur à la <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button> et à la disponibilité du fer.</p><div class="key"><b>À retenir.</b> Dans les premières semaines après une perfusion ou après un accouchement, la valeur peut être élevée sans refléter les réserves initiales. Le Delphi 2019 propose le contrôle huit à douze semaines après la voie intraveineuse ; l’information professionnelle Ferinject® juge une mesure avant quatre semaines prématurée. La ferritine se lit avec <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button>, <button class="w" data-k="d50-tsat">TSAT</button> et contexte.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/24976" target="_blank" rel="noopener">Viollier, ferritine, matériel, méthode et références, consulté le 11.10.2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS, ferritine 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a>.</p></template>
<template data-pop="d50-tsat" data-title="Saturation de la transferrine : méthode et interprétation"><h3>Des sites de fixation au pourcentage</h3><p>La transferrine transporte le fer dans le plasma. Une molécule peut fixer deux ions de fer. La saturation compare le fer effectivement présent à la quantité que tous les sites de fixation pourraient accueillir. Ce rapport renseigne sur la disponibilité du fer, et non directement sur la quantité stockée.</p><p>La formule est : saturation (%) = fer sérique (µmol/L) ÷ capacité totale de fixation du fer (µmol/L) × 100. Les deux concentrations doivent utiliser la même unité et correspondre au même prélèvement. Lorsque le laboratoire déduit la capacité de fixation d’un dosage de transferrine, il utilise son facteur validé ; une concentration de transferrine en g/L ne se place pas directement au dénominateur.</p><h3>Calcul refaisable</h3><p>Dans un exemple fictif, le fer sérique vaut 8 µmol/L et la capacité totale de fixation vaut 50 µmol/L. Première étape : 8 ÷ 50 = 0,16, sans unité puisque les unités se simplifient. Deuxième étape : 0,16 × 100 = 16 %. Un résultat à 50 % signifierait que la moitié des sites sont occupés, soit un ion par molécule en moyenne ; cela ne décrit pas chaque molécule séparément.</p><h3>Références suisses des deux concentrations</h3><p>Les deux valeurs du calcul ont aussi leur référence de laboratoire. Viollier donne les repères suivants ; la fiche de fer ne précise pas de condition de jeûne.</p><table class="t"><tr><th>Mesure et population</th><th>Intervalle ; µmol/L</th><th>Matériel et méthode</th></tr><tr><td>Fer sérique, femmes dès 19 ans</td><td>9,0–30,4</td><td>Sérum ; colorimétrie</td></tr><tr><td>Fer sérique, hommes dès 19 ans</td><td>11,6–31,3</td><td>Sérum ; colorimétrie</td></tr><tr><td>Capacité totale de fixation, femmes et hommes</td><td>44,8–80,5</td><td>Sérum ; immunoturbidimétrie ; âge non indiqué</td></tr></table><p>Le fer fictif à 8 µmol/L est sous ces deux références adultes ; la capacité à 50 µmol/L est dans son intervalle. Le rapport peut pourtant se situer à la borne basse de sa référence : chaque résultat répond à une question différente. Le fer isolé ne prouve pas une carence, car l’inflammation peut aussi l’abaisser.</p><h3>Normalité et seuils distincts</h3><p>Viollier donne 16–45 % dans le sérum, pour les femmes et les hommes ; sa fiche ne distingue pas les âges. Le compte rendu individuel prévaut. Le tableau sépare cette référence des seuils cliniques.</p><table class="t"><tr><th>Question</th><th>Repère de saturation</th><th>Portée</th></tr><tr><td>Référence du laboratoire suisse Viollier</td><td>16–45 %</td><td>Intervalle descriptif du résultat</td></tr><tr><td>Restriction érythropoïétique, Onkopedia</td><td>≤ 15 %</td><td>Repère diagnostique du guide ; ne distingue pas seul carence absolue et inflammation</td></tr><tr><td>Contextes spécialisés du Delphi suisse</td><td>&lt; 20 %</td><td>Seuil utilisé avec la <button class="w" data-k="d50-ferritine">ferritine</button> et la situation clinique ; pas une prescription universelle</td></tr></table><p>L’exemple à 16 % est à la limite basse de l’intervalle Viollier et sous le seuil spécialisé de 20 %. La question clinique doit donc être précisée avant de conclure.</p><h3>Limites du rapport</h3><div class="key"><b>À retenir.</b> Le fer sérique varie selon l’heure et baisse sous inflammation. La transferrine, protéine négative de phase aiguë, peut également baisser et modifier le rapport. Une mesure peu après la prise orale est trompeuse : l’information professionnelle Feraccru® observe un pic de TSAT une heure et demie à trois heures après l’administration. La réponse clinique et le reste du bilan déterminent l’interprétation.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/7130" target="_blank" rel="noopener">Viollier, fer sérique</a> ; <a href="https://www.viollier.ch/fr/analysis/16090" target="_blank" rel="noopener">Viollier, capacité totale de fixation</a> ; <a href="https://www.viollier.ch/fr/analysis/16050" target="_blank" rel="noopener">Viollier, saturation de la transferrine, consulté le 11.10.2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">information professionnelle suisse Feraccru®, août 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et al., Br J Haematol 2025, avis d’experts</a>.</p></template>
<template data-pop="d50-seuil" data-title="Seuils de ferritine : populations et divergences"><h3>Un seuil répond à une question précise</h3><p>Le seuil diagnostique varie avec la population et l’inflammation. La comparaison sépare la mesure des réserves de la décision de traiter.</p><table class="t"><tr><th>Référence et population</th><th>Seuil</th><th>Portée</th></tr><tr><td><button class="w" data-k="d50-sources-guides">OMS</button> 2020, adulte apparemment sain</td><td>&lt; 15 µg/L</td><td>Déplétion des réserves ; seuil très spécifique</td></tr><tr><td>Onkopedia avec SGH/SSH, avril 2025, adulte sans inflammation</td><td>&lt; 30 µg/L</td><td>Réserves insuffisantes ; consensus diagnostique croissant</td></tr><tr><td>Delphi suisse 2019, carence sans anémie et sans inflammation</td><td>&lt; 30 µg/L ; ou 30–50 µg/L avec <button class="w" data-k="d50-tsat">TSAT</button> &lt; 20 %</td><td>Accord critique ; ne constitue pas un seuil universel de prescription</td></tr><tr><td>gynécologie suisse 2022, grossesse</td><td>&lt; 30 µg/L</td><td>Traitement proposé même sans anémie, compte tenu des besoins gestationnels</td></tr><tr><td><button class="w" data-k="d50-sources-guides">OMS</button> 2020, adulte avec inflammation</td><td>&lt; 70 µg/L</td><td>Peut indiquer une carence ; recommandation conditionnelle de faible certitude</td></tr><tr><td>Delphi suisse 2019, <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> avec inflammation</td><td>&lt; 100 µg/L</td><td>Critère spécialisé ; ne s’applique pas à toute <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button> élevée</td></tr></table><p>Une <button class="w" data-k="d50-ferritine">ferritine</button> de 25 µg/L chez un adulte sans inflammation indique des réserves insuffisantes selon Onkopedia. Elle ne signifie pas, à elle seule, anémie ni indication intraveineuse. Le seuil de 100 µg/L appartient ici aux <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> inflammatoires ; il ne s’étend pas à toute <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button> élevée.</p><h3>Divergence thérapeutique suisse</h3><p>Pour la simple déplétion sans anémie, le Delphi 2019 admet un traitement oral si elle est symptomatique. Onkopedia 2025 réserve le traitement du seul stade de réserves basses à certaines situations, et traite les stades avec restriction érythropoïétique. <button class="w" data-k="d50-sources-guides">mediX</button> 08/2025 ne propose pas de substitution générale au-delà de 15 µg/L sans anémie ni inflammation ; il est également plus restrictif pendant la grossesse.</p><div class="key"><b>À retenir.</b> Dans ce cours, la source spécialisée gynécologique gouverne la grossesse, et la distinction des stades d’Onkopedia organise le diagnostic hématologique. Pour une fatigue isolée sans anémie, la décision reste individualisée : les divergences sont expliquées au patient et une perfusion ne découle pas d’un chiffre seul. L’<button class="w" data-k="d50-sources-guides">OFSP</button> 2020 trouve un bénéfice moyen sur certains scores de fatigue, sans relation démontrée entre <button class="w" data-k="d50-ferritine">ferritine</button> initiale et amplitude de ce bénéfice dans son analyse individuelle. Il ne faut pas transformer cette observation en promesse personnelle.</div><div class="trap"><span class="k">Erreur fréquente</span> L’erreur consiste à appliquer le seuil obstétrical de 30 µg/L à tout adulte, puis à en déduire une indication de perfusion. Le diagnostic de réserves basses, le diagnostic d’anémie et le choix du traitement sont trois décisions distinctes.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a> ; <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020, page du 14.01.2025</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS, ferritine 2020</a>.</p></template>
<template data-pop="d50-stades" data-title="Stades de la carence : réserves et érythropoïèse"><h3>Progression décrite par Onkopedia 2025</h3><p>Les trois stades sont définis par ce qui devient insuffisant : réserves, approvisionnement médullaire, puis concentration d’hémoglobine. Le tableau n’invente pas de seuil unique pour les marqueurs dépendant de l’automate.</p><table class="t"><tr><th>Stade</th><th>Réserves et marqueurs</th><th>Hémoglobine et conséquence</th></tr><tr><td>I : déplétion isolée des réserves</td><td><button class="w" data-k="d50-ferritine">Ferritine</button> abaissée ; pas encore de restriction érythropoïétique démontrée</td><td>Hémoglobine et indices globulaires dans les références applicables ; décision de traitement selon le terrain</td></tr><tr><td>II : érythropoïèse carencée</td><td>Restriction de l’approvisionnement : marqueurs réticulocytaires, hématies hypochromes, récepteur soluble ou protoporphyrine peuvent devenir anormaux</td><td>Hémoglobine encore au-dessus du seuil d’anémie ; le guide indique une substitution</td></tr><tr><td>III : anémie ferriprive</td><td>Carence démontrée ; hypochromie et microcytose fréquentes mais inconstantes</td><td>Hémoglobine sous le seuil de la population ; correction martiale et recherche de cause</td></tr></table><p>Une <button class="w" data-k="d50-ferritine">ferritine</button> basse avec hémoglobine conservée n’est donc pas automatiquement un stade II. Il faut rechercher si l’approvisionnement de la moelle est effectivement limité.</p><p>Les marqueurs de restriction, notamment protoporphyrine de zinc et récepteur soluble, ne doivent pas être décrits comme forcément élevés dans une simple déplétion isolée. Les seuils précis dépendent de la méthode analytique.</p><div class="key"><b>À retenir.</b> Le guide Onkopedia traite les stades avec restriction érythropoïétique. Pour le seul stade de réserves basses, la décision dépend de situations particulières ; les positions suisses sur la fatigue sans anémie divergent, comme l’explique la <button class="w" data-k="d50-seuil">comparaison des seuils et indications</button>.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, mise à jour 08/2025</a>.</p></template>
<template data-pop="d50-fonctionnelle" data-title="Carence absolue et carence fonctionnelle"><p class="lab">Définitions</p><p>Dans la carence absolue, les réserves sont insuffisantes pour les besoins. Dans la carence fonctionnelle, les réserves des macrophages paraissent normales, mais le fer n’est pas livré à la moelle, car l’hepcidine, élevée par l’inflammation et l’interleukine 6, bloque la ferroportine.</p><p class="lab">Où la rencontrer</p><p>La restriction fonctionnelle accompagne l’insuffisance rénale chronique, notamment sous agents stimulant l’érythropoïèse. Elle accompagne aussi la polyarthrite rhumatoïde, les <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button>, le cancer et l’insuffisance cardiaque.</p><p class="lab">Comment la reconnaître</p><p>La <button class="w" data-k="d50-ferritine">ferritine</button> reste normale ou élevée, alors que la <button class="w" data-k="d50-tsat">TSAT</button> est inférieure à 20 %. Le contenu réticulocytaire en hémoglobine est bas selon le seuil de l’automate. Une très bonne réponse au fer oral oriente au contraire vers une carence absolue.</p><div class="key"><b>Piège.</b> Les deux formes coexistent souvent : une inflammation n’exclut pas un saignement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, carence fonctionnelle</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-bilan" data-title="Le bilan quotidien du fer"><p class="lab">Chiffres normaux</p><p>Le corps contient environ 4 g de fer chez l’homme et 2,5 g chez la femme. Les pertes atteignent environ 1 mg par jour chez l’homme par desquamation intestinale, et 2 mg chez la femme réglée. L’alimentation apporte 10 à 14 mg par jour, dont 0,5 à 2 mg sont absorbés, soit 5 à 15 %. Le repère nutritionnel de 14 mg cité par Clénin 2017 est général ; il ne remplace pas les recommandations propres à l’âge, au sexe et à la grossesse.</p><p class="lab">Capacité d’adaptation</p><p>En cas de pertes ou de besoins accrus, l’absorption peut augmenter fortement, jusqu’à quadrupler dans les estimations de Clénin 2017, et la biodisponibilité monter jusqu’à 35 % en cas de carence, à condition que l’alimentation apporte assez de fer. Une anémie ferriprive ne peut toutefois pas être corrigée par l’alimentation seule.</p><div class="key"><b>Exemple.</b> Une perte de 10 mL de sang par jour, invisible dans les selles, représente <button class="w" data-k="d50-fer-sang">environ 5 mg de fer, calcul détaillé</button>, soit plusieurs fois l’absorption quotidienne habituelle de 0,5 à 2 mg.</div><p class="src">Référence : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a>.</p></template>
<template data-pop="d50-hepcidine" data-title="L’hepcidine"><p class="lab">Rôle</p><p>L’hepcidine est un peptide produit par l’hépatocyte. Elle provoque l’internalisation de la ferroportine, seul exportateur cellulaire du fer. Elle bloque ainsi l’absorption intestinale et la libération du fer par les macrophages.</p><p class="lab">Régulation</p><p>Elle augmente quand le fer abonde, en cas d’inflammation et après un effort intense ; elle baisse quand les réserves s’épuisent et quand l’érythropoïèse s’accélère, par l’intermédiaire de l’érythroferrone.</p><h3>Mesure et normalité</h3><p>Onkopedia 2025 souligne que le dosage n’est pas standardisé : les méthodes immunologiques et la spectrométrie de masse ne reconnaissent pas toujours les mêmes formes du peptide. Aucun intervalle suisse universel n’est donné ici. Une valeur doit être interprétée avec la méthode du laboratoire, les réserves, la saturation et l’inflammation ; une hepcidine élevée seule ne prouve pas une maladie génétique.</p><p class="lab">Application au traitement</p><p>La <button class="w" data-k="d50-sources-guides">BSG</button> rapporte chez des femmes sélectionnées avec des réserves basses qu’une dose d’au moins 60 mg élève l’hepcidine pendant 24 heures et réduit de 35 à 45 % l’absorption fractionnelle de la dose du lendemain. L’étude zurichoise Karczewski 2024, menée chez quinze femmes sélectionnées avec <button class="w" data-k="d50-ferritine">ferritine</button> ≤ 30 µg/L et <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ≥ 117 g/L, mesure aussi une augmentation dose-dépendante sept heures après la prise. Il s’agit d’un marqueur physiologique, pas d’une démonstration de supériorité clinique d’un schéma.</p><div class="key"><b>Conséquence.</b> Les prises rapprochées peuvent réduire la fraction absorbée de la dose suivante ; une prise unique ou un jour sur deux exploite mieux la capacité d’absorption.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH et SGMO, avril 2025</a>, § 3.5.11 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, passage clinique cité</a> ; <a href="https://doi.org/10.57187/s.3635" target="_blank" rel="noopener">Karczewski et al., Swiss Med Wkly 2024</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-tissus" data-title="Conséquences tissulaires de la carence"><p class="lab">Mécanisme</p><p>Le fer est indispensable à la myoglobine, aux cytochromes de la chaîne respiratoire, à la phosphorylation oxydative, à la synthèse de neurotransmetteurs et à la myélinisation. Chez l’animal, la carence sans anémie diminue déjà le nombre de mitochondries et l’activité des enzymes respiratoires ; l’anémie, elle, atteint surtout le transport de l’oxygène.</p><p class="lab">Manifestations</p><p>Le patient peut présenter une fatigue, une baisse de capacité d’effort, des troubles de l’attention ou de la mémoire. Les autres manifestations comprennent jambes sans repos, chute de cheveux, céphalées et ongles cassants. Une koilonychie, une chéilite ou une glossite atrophique peuvent s’y associer.</p><div class="key"><b>Limite.</b> Ces symptômes sont peu spécifiques ; une amélioration sous traitement est un argument, mais ne prouve pas à elle seule que la carence expliquait tous les symptômes, compte tenu des autres causes et de l’effet placebo.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-digestif" data-title="Saignement digestif occulte"><p class="lab">Fréquence</p><p>Chez l’homme et la femme ménopausée, environ un tiers des explorations découvrent une lésion significative ; un cancer est trouvé dans 8 à 10 % des cas, une double lésion haute et basse dans 1 à 10 %.</p><p class="lab">Lésions</p><p>Les pertes peuvent provenir d’un adénocarcinome colique ou œso-gastrique, d’un ulcère peptique, de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ou d’angioectasies. Ces dernières sont fréquentes chez le sujet âgé. Une entéropathie aux <button class="w" data-k="d50-anti-inflammatoires">anti-inflammatoires non stéroïdiens</button>, une tumeur du grêle ou une parasitose constituent d’autres causes, les deux dernières étant plus rares.</p><div class="key"><b>Piège.</b> L’anémie ferriprive peut être la première manifestation d’un cancer digestif, sans aucun symptôme abdominal ; un test de sang occulte négatif ne l’exclut pas.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, tableau 1 et section imagerie</a>.</p></template>
<template data-pop="d50-menorragies" data-title="Ménorragies"><p class="lab">Poids épidémiologique</p><p>Les pertes menstruelles sont la cause la plus fréquente de carence chez la femme non ménopausée. Dans une étude de femmes jeunes souffrant de ménorragies, plus de la moitié avaient des réserves basses, mais seulement 25 % étaient anémiques.</p><p class="lab">Conduite</p><p>Le médecin quantifie les règles et recherche une cause gynécologique lorsque le saignement est anormal. L’information professionnelle rapporte un bénéfice du fer intraveineux dans un essai de patientes ayant une anémie liée à une hémorragie utérine ; il ne s’agit pas d’une supériorité universelle dans toute ménorragie : le carboxymaltose a obtenu une hausse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de plus de 20 g/L chez 82 % des patientes après une hémorragie utérine grave, contre 61,8 % sous fer oral.</p><div class="key"><b>Piège.</b> Une carence disproportionnée aux pertes, récidivante ou associée à un signe d’alerte justifie une exploration digestive même chez la femme jeune.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Information professionnelle suisse Ferinject®</a>.</p></template>
<template data-pop="d50-osler" data-title="Télangiectasie hémorragique héréditaire (maladie de Rendu et Osler)"><p>La télangiectasie hémorragique héréditaire est une maladie vasculaire qui expose à des épistaxis répétées et à des pertes sanguines chroniques. L’inspection des lèvres, de la langue, de la muqueuse buccale et des doigts peut orienter vers le diagnostic ; une télangiectasie isolée ne suffit pas à le confirmer.</p><p class="lab">Conséquences pour le traitement</p><div class="key"><b>À retenir.</b> Les pertes chroniques épuisent les réserves et peuvent nécessiter un fer intraveineux répété. L’information professionnelle suisse du carboxymaltose cite cette maladie parmi les facteurs de risque d’ostéomalacie hypophosphatémique en cas de doses élevées répétées : le phosphate sérique doit alors être surveillé.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025</a>.</p></template>
<template data-pop="d50-coeliaque" data-title="Maladie cœliaque et carence martiale"><p class="lab">Fréquence</p><p>La maladie cœliaque est trouvée chez 3 à 5 % des patients explorés pour une anémie ferriprive inexpliquée ; elle réduit l’absorption intestinale du fer.</p><p class="lab">Dépistage</p><p>Le test initial recherche les anticorps anti-transglutaminase tissulaire de classe immunoglobuline A, avec un dosage simultané des immunoglobulines A totales pour écarter un déficit en immunoglobulines de classe A ; le patient doit consommer du gluten. Le groupe européen de 2025 range la carence martiale chronique et l’anémie inexpliquée parmi les indications de dépistage.</p><p class="lab">Limites</p><p>La sensibilité de la sérologie baisse avec l’âge, jusqu’à 74 % chez les patients cœliaques révélés par une anémie ferriprive. Chez le sujet âgé, des biopsies duodénales au cours de la gastroscopie sont donc préférables.</p><div class="key"><b>Conséquence.</b> Une anémie qui ne répond pas au fer oral chez un adulte jeune fait rechercher une maladie cœliaque.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12704582/" target="_blank" rel="noopener">Société européenne d’étude de la maladie cœliaque, recommandations 2025, partie 1</a>.</p></template>
<template data-pop="d50-gastrite" data-title="Gastrite atrophique, Helicobacter pylori et inhibiteurs de la pompe à protons"><p class="lab">Mécanisme commun</p><p>L’acidité gastrique favorise l’absorption du fer alimentaire. Toute achlorhydrie, qu’elle provienne d’une gastrite atrophique, d’une gastrectomie ou d’un traitement prolongé par inhibiteur de la pompe à protons, la réduit.</p><p class="lab">Données</p><p>La gastrite atrophique est plus fréquente chez les patients sans autre cause d’anémie ferriprive. L’association avec Helicobacter pylori est faible et pourrait passer par l’ulcère ou l’atrophie ; dans une méta-analyse, l’éradication n’améliore pas la réponse au fer.</p><div class="key"><b>Conséquence.</b> Les biopsies gastriques systématiques restent discutées ; une gastrite atrophique, cause irréversible, peut justifier un traitement martial au long cours.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-bariatrique" data-title="Chirurgie gastrique et bariatrique"><p class="lab">Mécanisme</p><p>Après une dérivation gastrique de Roux en Y, la sécrétion acide diminue et l’intestin grêle proximal est court-circuité. La <button class="w" data-k="d50-sources-guides">BSG</button> décrit une anémie ferriprive chez environ un quart des patients deux ans après une dérivation de Roux en Y. Une réponse orale insuffisante peut conduire à choisir le fer intraveineux ; la chirurgie n’explique pas automatiquement toute nouvelle anémie.</p><p class="lab">Donnée suisse</p><p>Dans une série rétrospective monocentrique à Lausanne de 77 patients opérés avec des dosages avant et après la perfusion, 63,6 % ont développé une hypophosphatémie inférieure à 0,8 mmol/L après une perfusion de carboxymaltose ; la dose de 500 mg était associée, dans le modèle ajusté, à une baisse moyenne du phosphate supérieure de 0,26 mmol/L à celle associée à 250 mg (p = 0,020). La sélection des dossiers et des mesures limite l’extrapolation de cette fréquence ; cette série ne fournit pas une probabilité individuelle pour tous les patients opérés.</p><div class="key"><b>Piège.</b> Une carence nouvelle chez un opéré ne dispense pas de chercher une autre cause, notamment digestive.</div><p class="src">Références : <a href="https://doi.org/10.57187/s.3771" target="_blank" rel="noopener">Pereira Portela et al., Swiss Med Wkly 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>

<template data-pop="d50-irida" data-title="Anémie ferriprive réfractaire au fer"><p>L’anémie réfractaire par carence en fer est une maladie héréditaire rare due à des variants pathogènes de TMPRSS6. Ce gène code la matriptase-2 ; son atteinte maintient l’hepcidine élevée malgré la carence.</p><p class="lab">Reconnaître</p><p>Le patient présente une anémie hypochrome microcytaire avec <button class="w" data-k="d50-tsat">TSAT</button> très basse, souvent inférieure à 10 %, sans inflammation. La <button class="w" data-k="d50-ferritine">ferritine</button> reste relativement conservée. La réponse au fer oral est nulle ou partielle, et la réponse intraveineuse incomplète. Un <button class="w" data-k="d50-rapport-hepcidine">rapport saturation/hepcidine</button> bas peut aider, selon une méthode standardisée et un intervalle adapté à l’âge. Le diagnostic associe profil clinique et analyse génétique, après exclusion des causes acquises.</p><p class="lab">Traiter</p><div class="key"><b>À retenir.</b> La réponse au fer intraveineux est souvent plus reproductible mais partielle ; aucune recommandation internationale fondée sur des essais n’existe, et la conduite repose sur des avis d’experts.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et al., Br J Haematol 2025</a>.</p></template>
<template data-pop="d50-fatigue" data-title="Fatigue et carence martiale"><p class="lab">Valeur du symptôme</p><p>La fatigue peut motiver la consultation chez un patient carencé, avec ou sans anémie. Elle est banale et a de nombreuses causes : la <button class="w" data-k="d50-ferritine">ferritine</button> en éclaire une seule.</p><p class="lab">Ce que montrent les essais</p><p>L’évaluation de l’<button class="w" data-k="d50-sources-guides">OFSP</button> 2020 trouve un bénéfice moyen sur le score continu de fatigue chez des femmes sélectionnées, avec possibilité d’un effet placebo. Elle ne trouve pas d’amélioration statistiquement démontrée du critère binaire d’amélioration globale de la fatigue. Ces résultats ne se transposent pas à toute fatigue ni ne justifient une perfusion d’emblée.</p><div class="key"><b>Conséquence.</b> Les symptômes de la carence se retrouvent dans de nombreuses affections : le médecin recherche les autres causes de fatigue et juge l’effet du fer sur l’évolution des symptômes et de la <button class="w" data-k="d50-ferritine">ferritine</button>.</div><p class="src">Références : <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation des technologies de santé 2020</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-jambes" data-title="Syndrome des jambes sans repos"><p>La <button class="w" data-k="d50-sources-guides">BSG</button> et le consensus suisse citent le syndrome des jambes sans repos parmi les manifestations de la carence martiale.</p><p class="lab">Seuils particuliers</p><div class="key"><b>À retenir.</b> Le consensus suisse retient, chez le sujet âgé atteint de ce syndrome, une carence définie par une <button class="w" data-k="d50-ferritine">ferritine</button> inférieure à 50 µg/L ou une <button class="w" data-k="d50-tsat">TSAT</button> inférieure à 16 % ; le carboxymaltose y améliore significativement les symptômes. Ce seuil reste attribué au Delphi 2019 ; la prise en charge neurologique spécialisée peut utiliser d’autres critères, qui ne sont pas une cible universelle du présent cours.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a> ; <a href="https://www.bag.admin.ch/de/eisentherapie-bei-eisenmangel-ohne-blutarmut" target="_blank" rel="noopener">OFSP, évaluation 2020</a>.</p></template>
<template data-pop="d50-pica" data-title="Pica et pagophagie"><p>Le pica est l’envie de consommer des substances non alimentaires ; la pagophagie, le besoin de croquer de la glace. La <button class="w" data-k="d50-sources-guides">BSG</button> les cite parmi les manifestations relativement propres à la carence martiale, avec la chéilite angulaire et la glossite.</p><div class="key"><b>Conséquence.</b> Ces symptômes, rarement signalés spontanément, se recherchent à l’interrogatoire.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, anamnèse et examen</a>.</p></template>
<template data-pop="d50-phaneres" data-title="Signes des phanères et des muqueuses"><p class="lab">Signes</p><p>La koilonychie correspond à des ongles concaves en cuillère ; les ongles peuvent aussi être cassants. La chéilite angulaire fissure les commissures labiales. La glossite atrophique rend la langue lisse et dépapillée. Des sclérotiques bleues ou une chute de cheveux peuvent s’y associer. Le syndrome de Plummer et Vinson associe une dysphagie à la carence.</p><div class="key"><b>Valeur.</b> Ces signes sont tardifs et inconstants : leur absence n’exclut rien, leur présence oriente fortement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-inflammation" data-title="Restriction martiale sous inflammation"><h3>Mécanisme</h3><p>Les cytokines inflammatoires, notamment l’interleukine 6, augmentent l’hepcidine. La ferroportine est internalisée ; l’export intestinal et macrophagique diminue. Le fer peut alors être stocké mais insuffisamment disponible pour la moelle. D’autres effets inflammatoires réduisent la production et la réponse à l’érythropoïétine.</p><h3>Bilan et décision</h3><p>La <button class="w" data-k="d50-ferritine">ferritine</button> peut être normale ou élevée, la <button class="w" data-k="d50-tsat">TSAT</button> basse et le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> normal ou modérément abaissé. Un contenu réticulocytaire en <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> bas soutient la restriction ; son seuil dépend de la méthode et de l’automate. Une <button class="w" data-k="d50-ferritine">ferritine</button> &lt; 70 µg/L sous inflammation peut indiquer une carence selon l’<button class="w" data-k="d50-sources-guides">OMS</button> 2020, avec une recommandation conditionnelle de faible certitude ; elle ne prouve pas seule l’épuisement absolu des réserves.</p><div class="key"><b>À retenir.</b> La maladie causale se traite en parallèle. La place du fer dépend de la maladie chronique, des pertes, du stade et de l’information professionnelle exacte ; aucun seuil universel de 100 µg/L n’impose une perfusion. Carence absolue et inflammation peuvent coexister : une perte digestive reste recherchée lorsqu’elle est plausible.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS, ferritine 2020</a>.</p></template>
<template data-pop="d50-thalassemie" data-title="Thalassémie mineure"><p class="lab">Reconnaître</p><p>La microcytose est disproportionnée au degré d’anémie, souvent légère ; <button class="w" data-k="d50-ferritine">ferritine</button> et <button class="w" data-k="d50-tsat">TSAT</button> sont normales. L’origine et les antécédents familiaux orientent.</p><p class="lab">Confirmer</p><p>Gynécologie suisse demande une électrophorèse ou une chromatographie si le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> est inférieur à 80 fl ou la <button class="w" data-k="d50-teneur-globulaire">TCMH</button> inférieure à 27 pg sans carence. L’antécédent familial et l’origine constituent d’autres indications. Une alpha-thalassémie peut donner une électrophorèse normale. Le pourcentage d’hématies hypochromes s’élève même avec des réserves normales.</p><div class="key"><b>Piège.</b> Thalassémie et carence coexistent : la <button class="w" data-k="d50-ferritine">ferritine</button> se dose aussi chez le porteur connu. Une microcytose avec bilan martial normal ne justifie ni fer ni endoscopie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-epreuve" data-title="Épreuve thérapeutique par le fer oral"><p class="lab">Principe</p><p>Lorsque le bilan martial est ambigu, un traitement oral de deux à quatre semaines sert de test : une hausse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’au moins 10 g/L en deux semaines de prise quotidienne est fortement évocatrice d’une carence absolue selon la <button class="w" data-k="d50-sources-guides">BSG</button> 2021.</p><p class="lab">Limites</p><p>Ce repère concerne l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’un patient anémique sous prise quotidienne. Le test dépend de l’adhésion ; il ne renseigne pas sur la cause. Une absence de réponse n’exclut pas une carence en cas de malabsorption, d’inflammation ou de saignement persistant.</p><div class="key"><b>Conséquence.</b> L’épreuve ne retarde jamais l’exploration d’un patient à risque de cancer digestif.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 5</a>.</p></template>
<template data-pop="d50-qui-explorer" data-title="Qui explorer, et comment"><p class="lab">Chez tous</p><p>Le bilan initial associe une anamnèse détaillée, une analyse d’urine et une sérologie cœliaque.</p><p class="lab">Homme et femme ménopausée</p><p>La gastroscopie et la coloscopie sont les examens de première intention. La coloscopie virtuelle par tomodensitométrie constitue une alternative si la coloscopie est inadaptée.</p><p class="lab">Femme non ménopausée</p><p>L’endoscopie est indiquée après 50 ans, en l’absence de règles, devant un signe d’alerte ou une carence récidivante ou disproportionnée. Elle l’est également si deux apparentés du premier degré ont un cancer colorectal, ou si un apparenté l’a développé avant 50 ans.</p><p class="lab">Homme jeune</p><p>L’homme jeune suit le même algorithme d’exploration que le sujet âgé.</p><p class="lab">Sujet âgé fragile</p><p>Le médecin discute le bénéfice et le risque avec le patient et sa famille.</p><p class="lab">Carence sans anémie</p><p>La carence sans anémie ne justifie pas une exploration invasive systématique. Le seuil d’exploration est plus bas chez l’homme, la femme ménopausée ou en présence de symptômes digestifs.</p><div class="key"><b>Aide à la décision.</b> L’âge, le sexe, l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> prédisent le risque de cancer ; plus l’anémie est profonde et microcytaire, plus l’exploration est urgente.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandations 6 à 11, 22, 24 à 29</a>.</p></template>
<template data-pop="d50-endoscopie" data-title="Gastroscopie et coloscopie"><p class="lab">Technique</p><p>Les deux examens se font si possible au cours de la même séance, ce qui simplifie la décision lorsque la gastroscopie montre une lésion de signification incertaine. La gastroscopie comporte des biopsies duodénales chez le sujet âgé, chez qui la sérologie cœliaque est moins sensible.</p><p class="lab">Règle</p><p>La coloscopie n’est différée que si la gastroscopie découvre un cancer, car une double lésion est possible. Le fer oral est suspendu avant la préparation colique ; il n’a pas à l’être avant une gastroscopie ou une coloscopie virtuelle.</p><p class="lab">Alternatives</p><div class="key"><b>À retenir.</b> La coloscopie virtuelle par tomodensitométrie peut convenir au patient fragile, mais détecte moins bien les lésions vasculaires. La tomodensitométrie sans préparation se réserve au patient très fragile, car elle manque certains cancers.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, imagerie du tube digestif</a>.</p></template>
<template data-pop="d50-capsule" data-title="Capsule endoscopique de l’intestin grêle"><p class="lab">Indication</p><p>La capsule s’indique devant une anémie ferriprive dont les endoscopies haute et basse adéquates sont négatives, avec réponse insuffisante ou récidive. La <button class="w" data-k="d50-sources-guides">BSG</button> 2021 en fait l’examen préféré pour le grêle dans cette situation.</p><p class="lab">Rendement</p><p>Le rendement atteint environ deux tiers dans les séries d’anémie ferriprive. Les lésions vues sont surtout des angioectasies, une maladie de Crohn et une entéropathie aux <button class="w" data-k="d50-anti-inflammatoires">anti-inflammatoires non stéroïdiens</button>. Jusqu’à 28 % des lésions trouvées étaient en fait accessibles à la gastroscopie, sans justifier une seconde gastroscopie systématique.</p><p class="lab">Après la capsule</p><div class="key"><b>À retenir.</b> L’entéroscopie assistée confirme et traite ; après une capsule négative de bonne qualité, l’exploration ne reprend que si l’anémie persiste.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, passage clinique cité</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-fit" data-title="Test immunochimique fécal : mise à jour 2025"><h3>Question et fonctionnement</h3><p>Le test détecte l’hémoglobine humaine dans les selles. Il estime le risque de lésion colorectale et aide à organiser l’exploration ; il ne localise pas la cause et n’exclut pas une lésion digestive haute.</p><h3>Ce qui a changé</h3><p>La <button class="w" data-k="d50-sources-guides">BSG</button> 2021 jugeait les preuves insuffisantes pour son tri systématique dans l’anémie ferriprive. La clarification <button class="w" data-k="d50-sources-guides">BSG</button>/<button class="w" data-k="d50-sources-guides">ACPGBI</button> 2025 recommande désormais le test et la sérologie cœliaque avant l’adressage digestif. Elle retient pragmatiquement 10 µg d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> par gramme de selles, bien que les études utilisent des seuils de 4 à 10.</p><p>Au-dessus du seuil, la filière britannique organise une exploration haute et basse urgente pour suspicion de cancer. Au-dessous, sans signe d’alerte, une évaluation spécialisée détermine les examens et leur délai selon l’âge, l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et les comorbidités. Un résultat négatif ne clôt donc pas le bilan ; les faux négatifs persistent.</p><h3>Application suisse</h3><div class="key"><b>À retenir.</b> Il s’agit d’une organisation britannique, pas d’un délai réglementaire suisse. Onkopedia avec SGH/SSH 2025 souligne aussi qu’un test de sang occulte négatif n’exclut pas la cause digestive. La décision d’endoscopie conserve son fondement clinique chez l’homme et la femme ménopausée. Un test non retourné ne justifie pas l’abandon d’un bilan indiqué.</div><p class="src">Références : <a href="https://www.bsg.org.uk/clinical-resource/role-of-fit-in-the-investigation-of-ida" target="_blank" rel="noopener">BSG/ACPGBI, tri par test immunochimique fécal, 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-second" data-title="Marqueurs de seconde ligne : méthode et limites"><p>Ces marqueurs renseignent sur l’érythropoïèse et complètent la <button class="w" data-k="d50-ferritine">ferritine</button> lorsque l’inflammation la rend difficile à lire. Ils ne remplacent pas l’identification de la cause.</p><table class="t"><tr><th>Marqueur</th><th>Repère documenté</th><th>Interprétation et limite</th></tr><tr><td>Contenu réticulocytaire en <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></td><td>Clénin 2017 : 28–35 pg pour les méthodes décrites ; Onkopedia 2025 : seuils de 25 à 28 pg, compromis à 26 pg</td><td>Un taux bas soutient une restriction martiale récente ; seuil dépendant de l’automate, également abaissé dans la thalassémie. Réagit en 48–72 heures selon Clénin</td></tr><tr><td>Hématies hypochromes</td><td>Onkopedia 2025 : habituellement &lt; 2,5 % ; &gt; 10 % soutient fortement une carence d’approvisionnement</td><td>Population de cellules plus anciennes : réponse plus lente. Les seuils varient selon la méthode</td></tr><tr><td>Récepteur soluble de la transferrine</td><td>Dosage Tina-quant, Onkopedia : femmes 1,9–4,4 mg/L ; hommes 2,2–5,0 mg/L. Dade Behring : 0,76–1,76 mg/L pour les deux sexes</td><td>Augmente dans la restriction érythropoïétique mais aussi dans l’hémolyse et la thalassémie ; pas un dosage direct des réserves</td></tr><tr><td><button class="w" data-k="d50-index-ferritine">Indice récepteur soluble/logarithme de la ferritine</button></td><td>Viollier : 0,38–1,54, femmes et hommes ; références différentes selon le dosage</td><td>Peut aider à reconnaître une carence absolue associée à une inflammation ; seuil non universel</td></tr><tr><td>Protoporphyrine de zinc</td><td>Onkopedia 2025, méthode Aviv : normal ≤ 40 µmol/mol d’hème</td><td>Hausse quand le zinc remplace le fer lors de la synthèse de l’hème ; seuils dépendants de la méthode et d’autres causes d’érythropoïèse perturbée</td></tr></table><div class="key"><b>À retenir.</b> La <button class="w" data-k="d50-references-suisses">référence suisse Viollier du contenu réticulocytaire est de 29,3–35,4 pg</button> ; elle ne remplace pas les références des méthodes ci-dessus. La méthode doit être identifiée avant l’interprétation du résultat. Une valeur de contenu réticulocytaire à 28 pg ne se compare pas indistinctement aux seuils d’autres automates. Un résultat bas indique une restriction récente, mais la thalassémie peut aussi l’abaisser.</div><div class="trap"><span class="k">Piège</span> Un nombre de 28 pg ou une valeur de protoporphyrine sans nom de méthode ne constitue pas un critère interchangeable entre laboratoires.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/18323" target="_blank" rel="noopener">Viollier, contenu réticulocytaire</a> ; <a href="https://www.viollier.ch/fr/analysis/16054" target="_blank" rel="noopener">Viollier, indice ferritine</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-reponse" data-title="Réponse attendue au fer"><p class="lab">Chiffres</p><p>Sous fer oral, une réponse satisfaisante augmente l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’au moins 10 g/L en deux semaines ou de 20 g/L en quatre semaines. Le consensus suisse donne environ 1 g/L par jour et 20 à 30 g/L en trois semaines. La <button class="w" data-k="d50-sources-guides">BSG</button> rapporte 72,8 % de réponses satisfaisantes dans une analyse groupée d’essais, définies par une hausse de plus de 10 g/L en deux semaines ; les pertes persistantes et une maladie digestive réduisent les taux de normalisation. Une hausse inférieure à 10 g/L à deux semaines prédit l’échec avec une sensibilité de 90 % et une spécificité de 79 %.</p><p class="lab">Causes d’échec</p><p>L’échec peut résulter d’une mauvaise adhésion, d’une prise au repas ou d’une malabsorption liée à la maladie cœliaque, une gastrite atrophique ou une chirurgie. Le médecin recherche aussi saignement persistant, inflammation et carence associée en vitamine B12 ou en folates. Une hémolyse, une maladie médullaire ou un diagnostic erroné, comme une thalassémie, constituent d’autres explications.</p><div class="key"><b>Conduite.</b> Le médecin vérifie l’adhésion et recherche la cause d’échec. Il passe à la voie intraveineuse si l’anémie le justifie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-alterne" data-title="Fer un jour sur deux : justification et statut"><h3>Mécanisme</h3><p>Une prise de sel ferreux élève l’hepcidine pendant environ 24 heures. Les études de femmes carencées mais autrement en bonne santé, synthétisées par la <button class="w" data-k="d50-sources-guides">BSG</button> 2021, montrent qu’une dose de 60 mg réduit l’absorption de la dose suivante de 35 à 45 %. Une augmentation de la fraction absorbée ne prouve cependant pas, à elle seule, une correction clinique plus rapide.</p><h3>Choix clinique</h3><p>La <button class="w" data-k="d50-sources-guides">BSG</button> 2021 propose la prise un jour sur deux en cas d’intolérance ; Onkopedia 2025 la propose aussi comme adaptation de la tolérance. Le suivi mesure l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et les symptômes, car la meilleure fréquence dépend du déficit, du saignement et de l’observance.</p><h3>Autorisation suisse</h3><div class="key"><b>À retenir.</b> Les informations professionnelles lues de Tardyferon®, ferro sanol® et Ferrum Hausmann® décrivent une prise quotidienne. Le rythme alterné enseigné ici est donc un choix clinique hors fréquence approuvée pour ces produits. Sa justification et les modalités de contrôle sont discutées avec le patient ; il ne doit pas être présenté comme leur posologie autorisée.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">information professionnelle suisse Tardyferon®, juillet 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">information professionnelle suisse ferro sanol®, avril 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">information professionnelle suisse Ferrum Hausmann®, mai 2021</a>.</p></template>
<template data-pop="d50-faible-dose" data-title="Fer oral à faible dose"><p class="lab">Données</p><p>Chez des sujets âgés anémiques, 15 mg de fer par jour ont été aussi efficaces que 50 ou 150 mg, avec moins d’effets indésirables. Clénin 2017 discute 28 à 50 mg par jour dans la carence sans anémie chez la personne jeune en bonne santé ; ces doses issues de sa revue ne constituent pas l’information professionnelle de chaque produit. Une étude zurichoise ouverte, à un seul bras, chez 36 femmes sans anémie, a fait passer la <button class="w" data-k="d50-ferritine">ferritine</button> de 18 à 33 µg/L avec 6 mg deux fois par jour pendant huit semaines ; une seule a rapporté des effets digestifs. L’étude utilisait une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> d’inclusion ≥ 117 g/L, donc un seuil différent du seuil <button class="w" data-k="d50-sources-guides">OMS</button> 2024 de 120 g/L chez la femme ; ses résultats ne doivent pas être présentés comme une preuve contrôlée dans toute carence sans anémie. Le schéma expérimental ne remplace pas les doses autorisées des préparations du cours.</p><div class="key"><b>Limite.</b> Ces données sont peu nombreuses et l’étude zurichoise n’a pas de groupe témoin ; les doses faibles se réservent à l’intolérance, au sujet âgé et à la carence sans anémie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.57187/smw.2023.40079" target="_blank" rel="noopener">Simic et al., Swiss Med Wkly 2023</a>.</p></template>
<template data-pop="d50-vitc" data-title="Contentieux : faut-il ajouter de la vitamine C ?"><p>L’effet alimentaire de la vitamine C ne prouve pas que son ajout médicamenteux améliore un traitement martial. Les références suivantes répondent à ces deux questions différentes.</p><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>Clénin 2017</td><td>La vitamine C des aliments favorise l’absorption du fer non héminique ; un jus d’agrumes au repas est conseillé</td></tr><tr><td><button class="w" data-k="d50-sources-guides">BSG</button> 2021</td><td>Un grand essai randomisé montre que la vitamine C ajoutée au fer oral n’améliore ni la réponse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>, ni la reconstitution des réserves, ni la tolérance : non recommandée</td></tr><tr><td>Gynécologie suisse 2022</td><td>Pas d’influence significative sur la hausse de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></td></tr></table><p>Le conseil d’associer des aliments riches en vitamine C concerne l’absorption et la prévention. Pour un patient sous fer oral, les données thérapeutiques plus récentes ne justifient pas un complément systématique.</p><p class="lab">Arbitrage</p><div class="key"><b>À retenir.</b> Les deux sources les plus récentes, dont la recommandation suisse de 2022, s’accordent : le complément de vitamine C n’est pas utile au traitement. Le conseil diététique sur les aliments riches en vitamine C reste pertinent pour la prévention.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, supplément de vitamine C</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 2022</a>.</p></template>
<template data-pop="d50-ganzoni" data-title="Formule de Ganzoni et schéma simplifié"><h3>Le besoin total additionne deux besoins</h3><p>Il faut apporter le fer nécessaire à l’hémoglobine manquante et reconstituer les réserves. Le poids estime le volume sanguin dans ce modèle ; l’écart d’hémoglobine indique combien de protéine manque dans chaque unité de volume. Une dose calculée n’est jamais une autorisation de l’administrer en une seule perfusion.</p><p class="lab">Formule</p><p>Le déficit total se calcule ainsi : déficit (mg) = poids (kg) × (<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> cible − <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> mesurée) (<button class="w" data-k="d50-conversion-hb">g/dL</button>) × 2,4 + réserves (mg). Le facteur 2,4 combine la teneur en fer de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> (0,34 %), le volume sanguin (70 mL/kg) et la conversion d’unités. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> cible est de 15 <button class="w" data-k="d50-conversion-hb">g/dL</button> ; les réserves représentent 500 mg à partir de 35 kg. Le <button class="w" data-k="d50-poids-modele">poids idéal du modèle</button> s’emploie chez l’obèse, le poids d’avant la grossesse chez la femme enceinte.</p><h3>Origine du facteur et contrôle des unités</h3><p>Le modèle utilise 70 mL de sang par kilogramme, soit 0,7 <button class="w" data-k="d50-conversion-hb">dL</button>/kg, et 0,34 % de fer dans l’hémoglobine, soit 3,4 mg/g. Le produit 0,7 <button class="w" data-k="d50-conversion-hb">dL</button>/kg × 3,4 mg/g = 2,38 est arrondi à 2,4. Multiplié par le poids en kg et par l’écart d’hémoglobine en <button class="w" data-k="d50-conversion-hb">g/dL</button>, il donne des mg de fer. Ces hypothèses de volume et de teneur sont celles du modèle ; elles ne sont pas un dosage du volume sanguin du patient.</p><p>La <button class="w" data-k="d50-conversion-hb">conversion g/L vers g/dL</button> précède le calcul. La cible de 15 <button class="w" data-k="d50-conversion-hb">g/dL</button> est la convention de Ganzoni pour les poids d’au moins 35 kg, pas un intervalle biologique normal. Dans la FI Venofer®, sous 35 kg, la cible du modèle est de 13 <button class="w" data-k="d50-conversion-hb">g/dL</button> et les réserves valent 15 mg/kg ; cette règle ne constitue pas une prescription pédiatrique universelle.</p><p class="lab">Exemple</p><p>Dans un exemple fictif, pour une femme de 60 kg dont l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> est de 9 <button class="w" data-k="d50-conversion-hb">g/dL</button>, 90 g/L deviennent 9 <button class="w" data-k="d50-conversion-hb">g/dL</button>. L’écart au modèle est de 15 − 9 = 6 <button class="w" data-k="d50-conversion-hb">g/dL</button> ; le besoin pour l’hémoglobine vaut 60 × 6 × 2,4 = 864 mg. Avec 500 mg de réserves, le total calculé est de 864 + 500 = 1364 mg. L’arrondi prescrit donne 1300 mg.</p><p class="lab">Schéma simplifié du carboxymaltose</p><p>Ferinject® permet aussi une estimation simplifiée du besoin total selon poids et <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>. Ce schéma représente une autre méthode autorisée ; les limites par administration restent applicables.</p><table class="t"><tr><th><button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button></th><th>35 à moins de 70 kg</th><th>70 kg et plus</th></tr><tr><td>&lt; 10 <button class="w" data-k="d50-conversion-hb">g/dL</button></td><td>1500 mg</td><td>2000 mg</td></tr><tr><td>10 à moins de 14 <button class="w" data-k="d50-conversion-hb">g/dL</button></td><td>1000 mg</td><td>1500 mg</td></tr><tr><td>≥ 14 <button class="w" data-k="d50-conversion-hb">g/dL</button></td><td> 500 mg</td><td> 500 mg</td></tr></table><div class="key"><b>À retenir.</b> Pour l’exemple pédagogique de 60 kg avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> à 9 <button class="w" data-k="d50-conversion-hb">g/dL</button>, ce schéma donne 1500 mg, contre 1300 mg après Ganzoni et arrondi. Ces méthodes autorisées ne donnent pas toujours le même total. Le besoin de 1500 mg ne permet pas de dépasser la limite de 1000 mg par semaine de Ferinject®.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">FI Venofer®, origine du facteur, cibles et réserves</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025, tableaux 1 et 2</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">MonoFer®, juin 2026</a>.</p></template>
<template data-pop="d50-hypersensibilite" data-title="Réactions d’hypersensibilité au fer intraveineux"><p class="lab">Nature</p><p>Des réactions immédiates de type anaphylactique, potentiellement mortelles, peuvent survenir même après des perfusions bien tolérées. Elles peuvent provoquer hypotension, tachycardie, bronchospasme, œdème laryngé ou urticaire. Elles peuvent évoluer vers un syndrome de Kounis, spasme coronaire allergique pouvant causer un infarctus. Pendant la grossesse, une bradycardie fœtale peut accompagner une réaction maternelle.</p><p class="lab">Facteurs de risque</p><p>Le risque augmente en cas d’allergies connues, d’asthme sévère, d’eczéma, d’atopie, de lupus ou de polyarthrite rhumatoïde.</p><p class="lab">Conduite</p><p>La perfusion est arrêtée immédiatement. En cas d’anaphylaxie, l’adrénaline est le traitement prioritaire selon l’information professionnelle et le protocole d’urgence ; la surveillance de trente minutes reste obligatoire. L’information professionnelle de Ferinject® mentionne ensuite des antihistaminiques ou corticostéroïdes, dont l’effet est plus tardif. Onkopedia 2025 déconseille l’emploi systématique des antihistaminiques <button class="w" data-k="d50-hypersensibilite">H1</button>, qui peuvent aggraver ou brouiller les réactions ; il distingue le traitement d’une urticaire symptomatique. Ces adjuvants ne remplacent ni ne retardent l’adrénaline.</p><p>Les récepteurs <button class="w" data-k="d50-hypersensibilite">H1</button> sont les récepteurs de type 1 de l’histamine : H pour histamine, 1 pour le type de récepteur. L’information professionnelle suisse de cétirizine de Spirig décrit cette cible des antihistaminiques ; cette définition ne constitue pas une prescription dans la réaction au fer.</p><h3>Reconnaître l’évolution de la réaction</h3><p>Le tableau distingue des situations cliniques, sans inventer de limites chiffrées de fréquence cardiaque ou de pression artérielle. Il ne permet pas au patient de reprendre lui-même la perfusion.</p><table class="t"><tr><th>Situation</th><th>Signes ou évolution</th><th>Conséquence</th></tr><tr><td>Réaction sans signes de gravité, description <button class="w" data-k="d50-sources-guides">mediX</button></td><td>Absence d’hypotension, tachycardie, tachypnée, stridor ou œdème péri-orbitaire</td><td>Arrêt et observation médicale ; décision de reprise individualisée après régression</td></tr><tr><td>Symptômes qui s’aggravent</td><td>Progression de la réaction après l’arrêt</td><td>Prise en charge comme réaction grave selon le protocole d’urgence</td></tr><tr><td>Réaction grave ou menaçant la vie</td><td>Atteinte circulatoire ou respiratoire ; anaphylaxie possible</td><td>Traitement urgent ; une réaction grave à un fer parentéral contre-indique les autres fers parentéraux selon les FI</td></tr></table><p>Une réaction modérée antérieure demande une réévaluation spécialisée du rapport bénéfice-risque et du produit ; les modalités ne se déduisent pas d’une prémédication automatique. La règle suisse de surveillance pendant au moins trente minutes reste applicable après chaque dose.</p><p class="lab">Contentieux entre molécules</p><div class="key"><b>À retenir.</b> Certaines études trouvent plus de réactions légères ou modérées avec le dérisomaltose qu’avec le carboxymaltose (environ 10 % contre 2,5 %), d’autres aucune différence ; les réactions graves restent rares avec les deux.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">MonoFer®</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p><p class="src">Complément : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH, avril 2025, 4.2.3 réactions immédiates</a>. ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680625680042" target="_blank" rel="noopener">Cetirizin Spirig HC, mai 2023 : récepteurs histaminiques</a></p></template>
<template data-pop="d50-hypophos" data-title="Hypophosphatémie après fer intraveineux"><h3>Du mécanisme au symptôme</h3><p>Le carboxymaltose peut augmenter fortement le FGF23 intact. Ce facteur diminue la réabsorption rénale du phosphate et l’activation de la vitamine D. La baisse de calcitriol puis la réponse de parathormone peuvent prolonger la perte de phosphate. Une fatigue aggravée, des myalgies ou des douleurs osseuses après perfusion demandent donc une évaluation, et ne signifient pas nécessairement une carence persistante.</p><h3>Normalité suisse et mesure</h3><p>Le laboratoire de l’Hôpital cantonal de Lucerne donne la référence adulte ci-dessous pour le plasma lithium-héparine. Le dosage utilise une méthode colorimétrique au molybdate. Le prélèvement est à jeun depuis douze heures ; l’heure et l’hémolyse peuvent modifier le résultat. Un dosage sérique d’un autre laboratoire conserve ses propres références.</p><table class="t"><tr><th>Phosphate plasmatique adulte ; mmol/L</th><th>Lecture selon cette référence</th></tr><tr><td>&lt; 0,81</td><td>Inférieur à la référence</td></tr><tr><td>0,81–1,45</td><td>Intervalle de référence du laboratoire</td></tr><tr><td>&gt; 1,45</td><td>Supérieur à la référence</td></tr></table><p>Ce tableau distingue position dans un intervalle et gravité clinique. Le <button class="w" data-k="d50-conversion-phosphate">calcul de conversion mmol/L–mg/dL</button> explique pourquoi les seuils d’études ne sont pas tous identiques. Symptômes, profondeur et persistance de la baisse guident la prise en charge.</p><h3>Fréquence et portée des chiffres</h3><p>La méta-analyse européenne de 42 essais publiée en 2021 trouve des taux groupés d’hypophosphatémie de 47 % après carboxymaltose et 4 % après dérisomaltose. Jusqu’à 45 % des patients restaient hypophosphatémiques à la fin d’études allant jusqu’à trois mois. Les seuils, populations et contrôles étaient hétérogènes ; ces chiffres ne sont pas une probabilité personnelle constante.</p><h3>Risques et surveillance selon l’information professionnelle suisse</h3><p>Ferinject® cite fortes doses répétées, carence en vitamine D, malabsorption, <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button>, hyperparathyroïdie, télangiectasie hémorragique héréditaire et ostéoporose parmi les facteurs pertinents. La méta-analyse ajoute déficit martial sévère et fonction rénale préservée. Le médecin contrôle le phosphate chez les patients recevant plusieurs doses élevées ou un traitement prolongé, et chez ceux présentant des facteurs de risque. Si l’hypophosphatémie persiste, il réévalue le traitement par carboxymaltose.</p><p>Une ostéomalacie et des fractures sont rapportées. La qualification généralement bénigne de l’avis gynécologique 2022 ne prévaut pas sur l’information professionnelle Ferinject® de juin 2025, qui décrit ces complications et impose la surveillance ciblée.</p><h3>Degrés dans la cohorte suisse après bypass</h3><p>Portela 2024 classe les valeurs observées après carboxymaltose chez des patients opérés d’un bypass. Le tableau rapporte cette classification d’étude ; il ne remplace ni l’intervalle du laboratoire ni l’évaluation clinique individuelle.</p><table class="t"><tr><th>Catégorie publiée</th><th>Phosphate plasmatique ; mmol/L</th><th>Portée</th></tr><tr><td>Légère</td><td>0,6–0,8</td><td>Catégorie de cette cohorte</td></tr><tr><td>Sévère</td><td>0,3–0,59</td><td>Catégorie de cette cohorte</td></tr><tr><td>Critique</td><td>&lt; 0,3</td><td>Catégorie de cette cohorte</td></tr></table><div class="key"><b>À retenir.</b> Un résultat de 0,5 mmol/L appartient à la catégorie sévère de cette étude. Douleurs osseuses, faiblesse ou persistance du déficit imposent une évaluation médicale et une réévaluation du carboxymaltose, selon son information professionnelle. Les seuils propres à d’autres études expliquent une partie des différences de fréquence rapportées.</div><p class="src">Références : <a href="https://analysenverzeichnis.luks.ch/analysis/Phosphat_anorganisch" target="_blank" rel="noopener">Hôpital cantonal de Lucerne, phosphate inorganique, préanalytique et référence adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8247006/" target="_blank" rel="noopener">Schaefer et al., méta-analyse 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a>.</p><p class="src">Classification de cohorte : <a href="https://doi.org/10.57187/s.3771" target="_blank" rel="noopener">Portela et coll., Swiss Med Wkly 2024</a>, résultats ; patients après bypass, pas classification universelle.</p></template>
