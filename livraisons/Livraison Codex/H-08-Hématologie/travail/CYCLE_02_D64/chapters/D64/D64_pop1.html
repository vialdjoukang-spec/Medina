<template id="d64-a01-w1" data-pop="d64-a01-w1" data-title="Anémie : définition et conditions"><p>L’hémoglobine est la protéine qui porte l’essentiel de l’oxygène sanguin. L’anémie est définie par sa concentration, rapportée à la population et aux conditions du prélèvement. Une concentration peut varier avec le volume plasmatique ; elle ne mesure donc pas directement la masse totale d’hématies. Les seuils adultes du document HUG sont de 130 g/L chez l’homme et 120 g/L chez la femme. L’enfance et la grossesse demandent des références adaptées. Une valeur isolée ne révèle ni le mécanisme ni la cause. La première lecture associe le résultat, l’état clinique, les valeurs antérieures et les autres lignées.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-a01-w2" data-pop="d64-a01-w2" data-title="Périmètre : forme spécifique et démarche générale"><p>La forme sidéroblastique associe une anomalie d’utilisation du fer à une morphologie médullaire particulière. La dysérythropoïèse congénitale concerne une maturation érythroïde anormale d’origine génétique. Les deux peuvent produire une érythropoïèse inefficace et une surcharge, mais leurs critères et leurs traitements diffèrent. Une anémie encore inexpliquée n’est pas une troisième maladie équivalente : c’est un état du raisonnement. Le clinicien indique alors les hypothèses testées, les résultats manquants et la prochaine étape, puis révise la conclusion lorsque de nouvelles données deviennent disponibles.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-a01" data-pop="pareto-d64-a01" data-title="Loi de Pareto — Cas initial et périmètre"><p class="ratio" data-cover="d64-a01"></p><ul><li>Une anémie microcytaire avec fer non diminué impose une recherche causale. La tolérance prime dans l’urgence ; la morphologie et la génétique précisent ensuite la forme.</li><li>Le VGM décrit une taille. L’histoire familiale et le bilan du fer orientent, mais la forme exige une confirmation.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-a02-w1" data-pop="d64-a02-w1" data-title="Hémoglobine : référence et diagnostic"><p>Un seuil diagnostique répond à une définition clinique ; un intervalle de référence décrit la distribution observée dans une population de laboratoire. Lucerne affiche, chez l’adulte, 134–170 g/L pour l’homme et 118–152 g/L pour la femme. Ces valeurs diffèrent des seuils HUG sans pouvoir être substituées automatiquement. Ainsi, une hémoglobine de 119 g/L chez une femme peut appartenir à l’intervalle cité tout en satisfaisant la définition clinique HUG. Ce cas de frontière exige le contexte, l’historique et le référentiel retenu ; il ne justifie pas de gommer la divergence.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="d64-a02-w2" data-pop="d64-a02-w2" data-title="Classification morphologique : utilité et limites"><p>Le volume globulaire moyen, ou VGM, décrit la taille moyenne des hématies. Une microcytose peut accompagner une carence martiale, une hémoglobinopathie ou une anémie sidéroblastique ; elle ne choisit pas entre ces causes. Une macrocytose peut accompagner une carence vitaminique, une exposition ou une maladie médullaire. Deux populations opposées peuvent produire une moyenne apparemment normale. Le frottis et l’hétérogénéité des tailles complètent donc le VGM. La référence adulte de Lucerne est 82–97 fL, tandis que la fiche pédagogique CSCQ cite 80–100 fL : la méthode et la population doivent rester attachées à la valeur.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="pareto-d64-a02" data-pop="pareto-d64-a02" data-title="Loi de Pareto — Définition, classification et données de fréquence"><p class="ratio" data-cover="d64-a02"></p><ul><li>La taille des globules rouges, la régénération et la gravité décrivent trois dimensions différentes. Les intervalles de laboratoire ne remplacent ni les seuils diagnostiques ni l’examen clinique.</li><li>La morphologie, les réticulocytes et le contexte apportent des informations différentes.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="d64-a03-w1" data-pop="d64-a03-w1" data-title="Sidéroblaste : définition et portée"><p>Un sidéroblaste est un précurseur érythroïde nucléé contenant du fer colorable. Un sidéroblaste normal peut présenter quelques granules cytoplasmiques dispersés. La couronne pathologique est définie par au moins cinq granules disposés autour d’au moins un tiers du noyau, à la coloration de Perls. Le GFHC recommande un comptage de 200 érythroblastes et accepte 100 lorsque la cellularité est faible. Cette définition décrit une cellule ; elle n’est pas à elle seule un diagnostic de myélodysplasie. La recherche d’une exposition réversible et le contexte génétique restent nécessaires.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="d64-a03-w2" data-pop="d64-a03-w2" data-title="Génétique : indication, résultat et limites"><p>Un test génétique répond à une hypothèse clinique définie. Devant une microcytose ancienne, une surcharge et une histoire familiale compatible, ALAS2 fait partie des gènes pertinents. Le panel s’élargit lorsque le phénotype est syndromique ou atypique. Un résultat pathogène doit être cohérent avec le mode de transmission et les manifestations ; un variant de signification incertaine ne suffit pas. Un test négatif peut refléter une région mal couverte ou un mécanisme non détecté. Le conseil prétest et post-test explique ces limites ainsi que la portée du résultat pour la famille.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="pareto-d64-a03" data-pop="pareto-d64-a03" data-title="Loi de Pareto — Anémies sidéroblastiques héréditaires"><p class="ratio" data-cover="d64-a03"></p><ul><li>Une anémie sidéroblastique héréditaire se précise par son mécanisme et sa génétique. La pyridoxine ne traite pas toutes les formes ; la surcharge peut précéder les transfusions.</li><li>La pyridoxine peut améliorer ALAS2. SLC25A38 concerne l’apport mitochondrial de glycine et est habituellement réfractaire.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="d64-a04-w1" data-pop="d64-a04-w1" data-title="Cause secondaire : arguments et exclusions"><p>Une cause secondaire se démontre par un faisceau cohérent : maladie ou carence biologiquement compatible, chronologie, résultats ciblés et évolution après correction. Une carence en cuivre peut produire anémie, neutropénie et anomalies de maturation ; l’excès de zinc ou la malabsorption en fournit parfois l’explication. L’amélioration après correction renforce l’hypothèse, mais plusieurs interventions simultanées limitent l’attribution. À l’inverse, une cytopénie persistante malgré correction conduit à rechercher une affection médullaire. Le simple voisinage temporel de deux anomalies n’établit pas leur lien causal.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-a04-w2" data-pop="d64-a04-w2" data-title="Bilan spécialisé : question précise"><p>Avant un examen spécialisé, la demande formule la question : existe-t-il une couronne de fer, une dysplasie, une anomalie clonale ou une maladie héréditaire ? L’aspiration médullaire permet l’examen cellulaire et la coloration du fer ; la biopsie renseigne l’architecture. Cytogénétique et analyses moléculaires complètent les questions clonales ou héréditaires. Un frottis évocateur n’autorise pas à ignorer les causes réversibles. La conclusion spécialisée intègre les résultats et leurs limites, notamment un prélèvement pauvre ou un test qui ne couvre pas tous les mécanismes possibles.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-a04" data-pop="pareto-d64-a04" data-title="Loi de Pareto — Anémies sidéroblastiques secondaires à une maladie"><p class="ratio" data-cover="d64-a04"></p><ul><li>Une cause secondaire exige une preuve orientée. La carence en cuivre peut imiter une myélodysplasie ; une maladie clonale confirmée conserve sa stratégie propre.</li><li>Le déficit en cuivre peut imiter une maladie clonale ; le contexte guide les dosages et la confrontation.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-a05-w1" data-pop="d64-a05-w1" data-title="Imputabilité : faits et limites"><p>L’imputabilité médicamenteuse met en relation le produit exact, la dose, le délai, l’état avant exposition et les autres causes. L’information professionnelle suisse de Zyvoxid classe l’anémie sidéroblastique parmi les effets rares et décrit des myélosuppressions généralement réversibles, dont le risque semble lié à la durée du traitement. Elle impose une formule sanguine hebdomadaire et une surveillance étroite en cas d’insuffisance rénale sévère, d’atteinte hépatique modérée à sévère, de traitement de plus de deux semaines, de myélosuppression préalable ou de médicaments myélotoxiques associés. Une amélioration après arrêt soutient l’hypothèse sans la rendre certaine si d’autres interventions ont changé. La décision d’arrêt se coordonne avec le prescripteur, car l’infection traitée garde ses propres risques.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid comprimés pelliculés, information professionnelle ; autorisation 55558 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="d64-a05-w2" data-pop="d64-a05-w2" data-title="Toxiques : exposition et bilan"><p>L’exposition au plomb se recherche par le métier, les loisirs, l’habitat et les produits utilisés. Les ponctuations basophiles du frottis peuvent orienter, mais elles ne sont pas spécifiques et ne quantifient pas l’exposition. La plombémie répond à une question toxicologique précise ; le contexte clinique et la source d’exposition déterminent la conduite spécialisée. L’alcool et les suppléments de zinc constituent d’autres pistes. Le cours n’importe pas un seuil de chélation d’un référentiel étranger non vérifié : une suspicion de toxicité significative motive une évaluation toxicologique appropriée.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid comprimés pelliculés, information professionnelle ; autorisation 55558 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="pareto-d64-a05" data-pop="pareto-d64-a05" data-title="Loi de Pareto — Médicaments, toxines et autres formes sidéroblastiques"><p class="ratio" data-cover="d64-a05"></p><ul><li>Une exposition ne prouve pas sa responsabilité. La chronologie, les examens et la récupération après retrait orientent l’imputabilité ; Zyvoxid impose un hémogramme hebdomadaire.</li><li>Une association temporelle constitue un argument, pas une preuve suffisante.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid comprimés pelliculés, information professionnelle ; autorisation 55558 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="d64-a06-w1" data-pop="d64-a06-w1" data-title="Dysérythropoïèse : définition et mécanismes"><p>La dysérythropoïèse signifie que les précurseurs érythroïdes mûrissent anormalement. Ce terme morphologique peut être acquis ; l’adjectif congénital désigne un groupe de maladies héréditaires spécifiques. Une moelle hyperplasique peut coexister avec peu de réticulocytes, car une partie des précurseurs n’atteint pas efficacement la circulation. Le type I peut présenter ponts internucléaires et chromatine spongieuse ; le type II comporte fréquemment des érythroblastes binucléés. Ces images orientent, mais le sous-type se conclut avec les données moléculaires et les diagnostics concurrents.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.mqzh.ch/cm/images/mq20152/pdf/bph2015_2_d.pdf" target="_blank" rel="noopener">Association suisse pour le contrôle de qualité médical — Kongenitale dyserythropoetische Anämie (MQZH 2015-02)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5541865/fullTextXML" target="_blank" rel="noopener">Iolascon et collaborateurs — Recommendations regarding splenectomy in hereditary hemolytic anemias (Haematologica 2017 ; consensus européen)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555850126" target="_blank" rel="noopener">Swissmedic — Pegasys, information professionnelle ; autorisation 55585 (Décembre 2023)</a>.</p></template>
<template id="d64-a06-w2" data-pop="d64-a06-w2" data-title="Sous-types : critères et limites"><p>Le type I est associé à des variants bialléliques de CDAN1 ou de CDIN1, anciennement C15orf41, qui expliquent environ 90 % des cas ; il exige au moins 20 % d’érythroblastes anormaux en microscopie optique et des ponts internucléaires. Le type II est associé à SEC23B et se signale par 10 à 35 % d’érythroblastes tardifs binucléés ; le contrôle zurichois rappelle que le test de lyse au sérum acidifié y est positif, contrairement aux types I et III. Le type III classique, dominant, est lié à une mutation récurrente unique de KIF23 et comporte des érythroblastes géants jusqu’à douze noyaux. Les formes liées à KLF1 ou GATA1 ne se résument pas à ce trio.</p><p>L’interféron alpha est surtout documenté dans le type I, tandis que la splénectomie se discute dans certaines formes de type II, sur une preuve de faible niveau.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.mqzh.ch/cm/images/mq20152/pdf/bph2015_2_d.pdf" target="_blank" rel="noopener">Association suisse pour le contrôle de qualité médical — Kongenitale dyserythropoetische Anämie (MQZH 2015-02)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5541865/fullTextXML" target="_blank" rel="noopener">Iolascon et collaborateurs — Recommendations regarding splenectomy in hereditary hemolytic anemias (Haematologica 2017 ; consensus européen)</a>.</p></template>
<template id="pareto-d64-a06" data-pop="pareto-d64-a06" data-title="Loi de Pareto — Anémie dysérythropoïétique congénitale"><p class="ratio" data-cover="d64-a06"></p><ul><li>La dysérythropoïèse congénitale exige une concordance entre clinique, morphologie et génétique. Le fer peut s’accumuler sans transfusion ; interféron et splénectomie restent des options propres à certaines formes.</li><li>Le nombre de précurseurs ne mesure pas la sortie efficace dans le sang.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.mqzh.ch/cm/images/mq20152/pdf/bph2015_2_d.pdf" target="_blank" rel="noopener">Association suisse pour le contrôle de qualité médical — Kongenitale dyserythropoetische Anämie (MQZH 2015-02)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5541865/fullTextXML" target="_blank" rel="noopener">Iolascon et collaborateurs — Recommendations regarding splenectomy in hereditary hemolytic anemias (Haematologica 2017 ; consensus européen)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555850126" target="_blank" rel="noopener">Swissmedic — Pegasys, information professionnelle ; autorisation 55585 (Décembre 2023)</a>.</p></template>
<template id="d64-a07-w1" data-pop="d64-a07-w1" data-title="Anémie non précisée : démarche et limites"><p>La mention non précisée est une conclusion provisoire lorsque les informations ne permettent pas encore une cause fiable. Elle n’autorise ni l’absence de suivi ni une thérapeutique empirique indéfinie. Le dossier indique l’hémoglobine, les indices, les réticulocytes, le frottis et les autres lignées, puis les hypothèses déjà explorées. L’anémie inexpliquée persistante ou les cytopénies associées justifient l’avis spécialisé décrit par les HUG. La réévaluation doit être attribuée à un professionnel et à une échéance adaptée à la gravité, sans inventer un intervalle universel.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-a07-w2" data-pop="d64-a07-w2" data-title="Diagnostic causal : données nécessaires"><p>Une conclusion causale répond à trois questions : quel mécanisme explique le résultat, quelle donnée confirme la cause et quelle alternative importante reste possible ? Une hémolyse exige une concordance biologique et clinique ; une maladie rénale ne dispense pas d’explorer le fer et les autres mécanismes. Une carence documentée doit elle-même recevoir une explication. Lorsque le résultat ne suffit pas, la formulation reste probabiliste. Le clinicien sépare explicitement les faits établis, les hypothèses et les examens susceptibles de modifier la prise en charge.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-a07" data-pop="pareto-d64-a07" data-title="Loi de Pareto — Autres anémies précisées et non précisées"><p class="ratio" data-cover="d64-a07"></p><ul><li>Une anémie non précisée est une étape du raisonnement. La description du mécanisme oriente des examens ciblés et un suivi explicite jusqu’à la conclusion causale.</li><li>Une conclusion provisoire conserve un plan clinique explicite.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-a08-w1" data-pop="d64-a08-w1" data-title="Tolérance clinique : contexte et limites"><p>La tolérance se juge sur les symptômes, les paramètres vitaux, la vitesse d’installation et la réserve cardiopulmonaire. Une dyspnée de repos, une douleur thoracique, une syncope ou une altération de conscience motive une évaluation urgente. Ces manifestations ne sont pas spécifiques de l’anémie : une cause cardiaque, respiratoire ou hémorragique peut coexister. Une saturation conservée ne garantit pas un contenu sanguin en oxygène suffisant. Le chiffre d’hémoglobine soutient l’évaluation, mais ne remplace pas l’identification d’une défaillance clinique.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a>.</p></template>
<template id="d64-a08-w2" data-pop="d64-a08-w2" data-title="Signes ciblés : technique et interprétation"><p>L’examen commence par l’état général, la fréquence cardiaque, la pression artérielle, la respiration et les signes de saignement. Le médecin observe les conjonctives et la peau pour la pâleur, examine les sclères pour un ictère et palpe prudemment l’abdomen pour une organomégalie. Une splénomégalie clinique peut nécessiter confirmation par imagerie ; son absence à la palpation n’exclut pas une augmentation modérée. Il recherche aussi des signes neurologiques lorsque le cuivre, le plomb ou un traitement sont en cause. La fréquence de ces signes dans chaque maladie rare n’est pas suffisamment établie pour être chiffrée ici.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a>.</p></template>
<template id="pareto-d64-a08" data-pop="pareto-d64-a08" data-title="Loi de Pareto — Anamnèse, examen et gravité"><p class="ratio" data-cover="d64-a08"></p><ul><li>L’anamnèse relie le temps, les expositions et la famille. L’examen recherche d’abord une défaillance ; la tolérance ne se déduit jamais d’un chiffre isolé.</li><li>Le bilan rare ne doit pas retarder l’évaluation d’une défaillance ou d’une autre cause aiguë.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a>.</p></template>
<template id="d64-a09-w1" data-pop="d64-a09-w1" data-title="Réticulocytes : nombres, calculs et portée"><p>Le nombre absolu de réticulocytes vaut le nombre d’hématies multiplié par leur fraction réticulocytaire. Avec 3,0 T/L d’hématies et 2 %, on obtient 3,0 × 10¹² × 0,02 = 60 × 10⁹/L, soit 60 G/L. Ce résultat appartient à l’intervalle adulte de Lucerne, 33–98 G/L, mais le document genevois qualifie d’arégénérative une anémie avec moins de 70 G/L et de régénérative une anémie avec au moins 120 G/L. Le pourcentage seul peut sembler rassurant parce que son dénominateur, le nombre d’hématies, a diminué. La réponse s’interprète donc par rapport à la gravité et au délai, en vérifiant les unités.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a>.</p></template>
<template id="d64-a09-w2" data-pop="d64-a09-w2" data-title="Bilan médullaire : indication et limites"><p>Une anémie persistante inexpliquée, des cytopénies associées, un frottis anormal ou une suspicion de maladie médullaire peuvent justifier un prélèvement. Dans certaines anémies héréditaires, un panel moléculaire précoce évite des examens répétés ; il ne remplace pas toutes les questions morphologiques. Pour les sidéroblastes, la coloration de Perls se lit sur le frottis d’aspiration, car le fer des érythroblastes est perdu lors du traitement de la biopsie ; la biopsie reste en revanche la référence pour les réserves macrophagiques. Le consentement et l’information portent sur la question clinique, le prélèvement et la possibilité d’un résultat non conclusif.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a>.</p></template>
<template id="pareto-d64-a09" data-pop="pareto-d64-a09" data-title="Loi de Pareto — Diagnostic discriminant et examens spécialisés"><p class="ratio" data-cover="d64-a09"></p><ul><li>L’examen utile répond à une question mécanistique. La moelle, la génétique et le bilan martial se complètent ; aucun résultat isolé ne résume toutes les formes.</li><li>Le critère cellulaire et les critères de maladie sont distincts.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a>.</p></template>
<template id="d64-a10-w1" data-pop="d64-a10-w1" data-title="Traitement causal : indication par forme"><p>La décision thérapeutique part de la forme confirmée. Une anémie sidéroblastique liée à ALAS2 peut répondre à la pyridoxine ; SLC25A38 n’a pas cette réponse habituelle. Une exposition médicamenteuse appelle la réévaluation du produit, tandis qu’une carence en cuivre documentée appelle sa correction et le traitement de sa cause. Une dysérythropoïèse de type I peut conduire à une discussion spécialisée d’interféron hors indication suisse. Les traitements propres aux néoplasies myélodysplasiques suivent leur maladie. Un mécanisme partagé de surcharge ne rend pas ces traitements interchangeables.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5541865/fullTextXML" target="_blank" rel="noopener">Iolascon et collaborateurs — Recommendations regarding splenectomy in hereditary hemolytic anemias (Haematologica 2017 ; consensus européen)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a>.</p></template>
<template id="d64-a10-w2" data-pop="d64-a10-w2" data-title="Transfusion : décision, sécurité et alternatives"><p>La Société suisse d’hématologie recommande de ne pas transfuser inutilement pour atténuer les symptômes ou pour élever l’hémoglobine dans une zone jugée sûre, 70 à 80 g/L chez les patients stables et non cardiaques. Chez une personne sans saignement actif, une unité est transfusée et son effet vérifié avant d’en prescrire une autre ; chez l’enfant, la quantité se calcule au poids. Cette stratégie ne fixe pas à elle seule le seuil de début, qui dépend des symptômes et du contexte. Le bénéfice attendu est l’amélioration du transport d’oxygène ; les risques comprennent notamment réactions, surcharge circulatoire, allo-immunisation et accumulation de fer lors d’expositions répétées.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5541865/fullTextXML" target="_blank" rel="noopener">Iolascon et collaborateurs — Recommendations regarding splenectomy in hereditary hemolytic anemias (Haematologica 2017 ; consensus européen)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a>.</p></template>
<template id="pareto-d64-a10" data-pop="pareto-d64-a10" data-title="Loi de Pareto — Prise en charge et complications"><p class="ratio" data-cover="d64-a10"></p><ul><li>Le traitement est causal et individualisé. La transfusion, la pyridoxine et la chélation répondent à des objectifs différents et exigent chacune une surveillance.</li><li>La recommandation SSH vise à éviter une exposition inutile ; elle ne fixe pas à elle seule l’indication de début.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5541865/fullTextXML" target="_blank" rel="noopener">Iolascon et collaborateurs — Recommendations regarding splenectomy in hereditary hemolytic anemias (Haematologica 2017 ; consensus européen)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a>.</p></template>
<template id="d64-a11-w1" data-pop="d64-a11-w1" data-title="Suivi par forme : critères"><p>Le suivi vérifie simultanément l’efficacité et les complications. Dans une forme sensible à la pyridoxine, l’hémoglobine et les besoins transfusionnels documentent la réponse, tandis que l’examen sensitif cherche une toxicité. Dans une dysérythropoïèse, la charge en fer se surveille même sans transfusions régulières. La revue britannique du type I décrit un suivi spécialisé régulier, souvent annuel en situation stable, mais reconnaît l’absence de consensus universel pour la fréquence de l’imagerie du fer. Une modification clinique raccourcit les délais ; le calendrier d’un centre n’est pas une règle applicable à tous.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-a11-w2" data-pop="d64-a11-w2" data-title="Maladie rénale : articulation avec N18"><p>La maladie rénale peut diminuer le signal érythropoïétique et modifier l’interprétation de l’anémie. Elle peut aussi rendre un médicament inapproprié : Benadon 300 mg est contre-indiqué en insuffisance rénale selon sa fiche ; Exjade dispersible est contre-indiqué lorsque la clairance de créatinine est inférieure à 60 mL/min. Une estimation du débit de filtration et une clairance ne sont pas des mots interchangeables sans examiner méthode et unités. La stratégie rénale relève du cours N18, mais une microcytose avec surcharge ou un frottis dysplasique demande sa propre enquête.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="pareto-d64-a11" data-pop="pareto-d64-a11" data-title="Loi de Pareto — Suivi et situations particulières"><p class="ratio" data-cover="d64-a11"></p><ul><li>Le suivi distingue maladie, traitement et situation personnelle. Enfance, grossesse et insuffisances d’organe modifient fortement l’usage des produits suisses.</li><li>L’érythropoïèse inefficace modifie la régulation du fer et justifie une surveillance adaptée.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-a12-w1" data-pop="d64-a12-w1" data-title="Critères par forme : références"><p>Un critère doit être attaché à l’objet qu’il définit. Les cinq granules autour d’un tiers du noyau définissent un sidéroblaste en couronne, pas une maladie clonale. La présence de variants pathogènes cohérents avec le mode de transmission soutient une anémie héréditaire, tandis que les néoplasies myélodysplasiques utilisent une classification intégrée actualisée. La concordance clinique, morphologique et moléculaire prime sur l’accumulation de chiffres. Une discordance n’est pas effacée : elle motive une relecture, un examen complémentaire ou une conclusion provisoire.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a>.</p></template>
<template id="d64-a12-w2" data-pop="d64-a12-w2" data-title="Pareto du raisonnement hématologique"><p>La démarche prioritaire commence par la tolérance, puis décrit l’anémie et sa réponse réticulocytaire. Elle recherche les causes courantes et réversibles avant de conclure une maladie rare ou clonale. La morphologie et la génétique précisent ensuite la forme ; le traitement et la surveillance découlent de cette forme. Le raccourci dangereux est de passer directement d’une microcytose au fer, d’une couronne à une myélodysplasie ou d’une mutation incertaine à un diagnostic certain. Le résumé conserve ces décisions et leurs limites, sans remplacer les parties détaillées.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a>.</p></template>
<template id="pareto-d64-a12" data-pop="pareto-d64-a12" data-title="Loi de Pareto — Critères formels et paramètres clés"><p class="ratio" data-cover="d64-a12"></p><ul><li>La preuve morphologique identifie un mécanisme, la preuve causale précise la forme et la tolérance détermine l’urgence. Chaque médicament conserve son indication et ses limites suisses.</li><li>Il s’agit d’un critère morphologique cellulaire, sans détermination isolée de la cause.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a>.</p></template>
