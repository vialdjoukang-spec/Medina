<section class="ilot" id="d64-a01"><h2><span class="n">1</span> Cas initial et périmètre</h2>
<p>Une anémie découverte chez un adulte jeune pose deux questions distinctes : le patient est-il en danger, et quel mécanisme empêche sa moelle de fabriquer des hématies efficaces ? La catégorie D64 de la CIM-10-GM rassemble des formes rares, sidéroblastiques (D64.0 à D64.3) et dysérythropoïétiques congénitales (D64.4), ainsi que d’autres anémies précisées (D64.8) ou non précisées (D64.9) ; elle ne se réduit donc jamais à une anémie générique.</p>
<h3 id="d64-a01-partie-1">1. Cas fil rouge : symptômes, chronologie et résultats contextualisés du patient fictif</h3><p>Un homme de 34 ans, fictif, consulte pour une fatigue ancienne et une <button class="w" data-k="d64-a08-w1">dyspnée (tolérance clinique)</button> à l’effort. Son <button class="w" data-k="d64-a02-w1">hémoglobine (référence et diagnostic)</button> vaut 96 g/L, contre 134–170 g/L dans le laboratoire suisse de référence choisi pour ce cas. Son volume globulaire moyen est de 72 fL, contre 82–97 fL. La <button class="w" data-k="d64-e03-w1">ferritine (bilan du fer et limites)</button> n’est pas diminuée et les <button class="w" data-k="d64-a09-w1">réticulocytes (calcul et interprétation)</button> ne témoignent pas d’une compensation suffisante. Son oncle maternel aurait reçu de la vitamine B6 pour une anémie. Ces faits orientent le bilan, mais ne prouvent encore aucune maladie héréditaire.</p>
<h3 id="d64-a01-partie-2">2. Périmètre : formes sidéroblastiques, dysérythropoïétique congénitale et autres anémies concernées</h3><p>Les anémies sidéroblastiques héréditaires, celles secondaires à une maladie, celles liées aux médicaments ou aux toxines et les autres formes sidéroblastiques constituent un premier ensemble. Les anémies dysérythropoïétiques congénitales constituent un second ensemble : leur anomalie concerne la maturation érythroïde et possède des signatures morphologiques et génétiques différentes. Enfin, une anémie précisée par son mécanisme et une anémie encore inexpliquée exigent une démarche causale. Ces regroupements cliniques ne rendent pas leurs traitements interchangeables.</p>
<h3 id="d64-a01-partie-3">3. Prérequis : anémie, syndrome, mécanisme et cause</h3><p>L’anémie désigne une concentration d’<button class="w" data-k="d64-a02-w1">hémoglobine (référence et diagnostic)</button> insuffisante pour la population considérée. Elle décrit un résultat, tandis que le syndrome anémique rassemble ses manifestations cliniques. Le mécanisme précise si la production efficace diminue, si les cellules sont détruites ou si le sang est perdu. La cause explique ce mécanisme. Ainsi, une <button class="w" data-k="d64-a02-w2">microcytose (taille et causes)</button> décrit la taille des hématies ; un défaut de synthèse de l’<button class="w" data-k="d64-s03-w1">hème (synthèse et compartiments)</button> explique leur mauvaise hémoglobinisation ; une anomalie d’<button class="w" data-k="d64-a03-w2">ALAS2 (forme liée à l’X)</button> peut en constituer la cause.</p>
<p><button class="w" data-k="d64-a01-w1">Anémie : définition et conditions (explication détaillée)</button></p>
<h3 id="d64-a01-partie-4">4. Frontières : carences, hémolyse, aplasie et autres cours causaux à distinguer</h3><p>Une carence martiale, une carence en vitamine B12 ou en folates, une hémoglobinopathie, une hémolyse et une insuffisance médullaire restent des diagnostics concurrents. Les cours correspondants détaillent leurs traitements. Cependant, les exclure ou les reconnaître ici est indispensable : une <button class="w" data-k="d64-a02-w2">microcytose (taille et causes)</button> avec surcharge en fer ne justifie pas une prescription empirique de fer. De même, des <button class="w" data-k="d64-a03-w1">sidéroblastes en couronne (définition et portée)</button> ne suffisent pas à classer une néoplasie myélodysplasique ; celle-ci possède ses propres critères.</p>
<h3 id="d64-a01-partie-5">5. Sécurité : tolérance clinique, contexte et informations urgentes à recueillir</h3><p>Avant l’enquête familiale, le médecin recherche une douleur thoracique, une <button class="w" data-k="d64-a08-w1">dyspnée (tolérance clinique)</button> de repos, une <button class="w" data-k="d64-a08-w1">syncope (priorité clinique)</button>, un trouble de conscience ou un saignement actif. Il documente la rapidité d’installation, les maladies cardiaques et respiratoires et les paramètres vitaux. Une anémie lentement constituée et une chute récente de même amplitude n’ont pas nécessairement la même tolérance. Le bilan étiologique ne doit donc pas retarder l’évaluation urgente d’une défaillance clinique.</p>
<h3 id="d64-a01-partie-6">6. Cas final : forme spécifique, preuve diagnostique et plan de prise en charge</h3><p>Dans la suite fictive du cas, la moelle révèle des <button class="w" data-k="d64-a03-w1">sidéroblastes en couronne (définition et portée)</button> et l’analyse génétique identifie un variant pathogène d’<button class="w" data-k="d64-a03-w2">ALAS2 (forme liée à l’X)</button> concordant avec le phénotype. L’hématologue retient une anémie sidéroblastique liée à l’X, évalue la surcharge en fer et organise un essai thérapeutique surveillé de <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button> selon le produit suisse. La réponse sera mesurée, sans être présumée. Un conseil génétique explique ensuite la portée du résultat aux apparentés concernés.</p>
<p><button class="w" data-k="d64-a01-w2">Périmètre : forme spécifique et démarche générale (explication détaillée)</button></p>
<div class="key"><b>À retenir.</b> Une anémie microcytaire avec fer non diminué impose une recherche causale. La tolérance prime dans l’urgence ; la morphologie et la génétique précisent ensuite la forme.</div>
<div class="quiz ui"><p>Le cas initial associe microcytose et ferritine non diminuée. Quelle conclusion est justifiée ?</p><button data-ok="1">Il faut caractériser le mécanisme et rechercher une cause avant de prescrire du fer.</button><button data-ok="0">La microcytose prouve une carence martiale.</button><p class="fb" hidden>Le VGM décrit une taille. L’histoire familiale et le bilan du fer orientent, mais la forme exige une confirmation.</p></div>
<p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>. ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D60–D64 (Stand 15.09.2023)</a></p><button class="pareto-btn ui" data-k="pareto-d64-a01">▲ Loi de Pareto — Cas initial et périmètre</button></section>
<section class="ilot" id="d64-a02"><h2><span class="n">2</span> Définition, classification et données de fréquence</h2>
<p>Un même chiffre d’hémoglobine peut appartenir à l’intervalle d’un laboratoire, franchir un seuil diagnostique clinique et rester pourtant bien toléré. C’est pourquoi la définition, la classification morphologique et la classification mécanistique répondent chacune à une question différente.</p>
<h3 id="d64-a02-partie-1">1. Définition de l’anémie : population, conditions et référence applicable</h3><p>Chez l’adulte, le document clinique des Hôpitaux universitaires de Genève définit l’anémie par une <button class="w" data-k="d64-a02-w1">hémoglobine (référence et diagnostic)</button> inférieure à 130 g/L chez l’homme ou à 120 g/L chez la femme. Le même document retient, chez l’adulte, un hématocrite inférieur à 39 % chez l’homme et à 36 % chez la femme. Ces seuils diagnostiques ne sont pas les intervalles d’un automate. À Lucerne, les intervalles adultes affichés sont de 134–170 g/L et de 118–152 g/L respectivement. Cette différence n’est pas une erreur : les populations de référence, la méthode et l’objectif du seuil diffèrent. La grossesse et l’enfance nécessitent leurs références spécifiques.</p>
<h3 id="d64-a02-partie-2">2. Classification morphologique : indices utiles et limites d’un classement descriptif</h3><p>Le volume globulaire moyen classe la taille moyenne des hématies. Le tableau des références distingue les repères généraux du Centre suisse de contrôle de qualité, 80–100 fL, des valeurs de Lucerne, 82–97 fL. Une moyenne normale peut masquer deux populations opposées. Ainsi, une <button class="w" data-k="d64-a10-w2">transfusion (décision et sécurité)</button> récente ou l’association de mécanismes microcytaire et macrocytaire peut rendre la moyenne peu informative. Le frottis et la dispersion des tailles complètent donc le chiffre.</p>
<p>Le classement morphologique organise les hypothèses sans désigner une cause. Le tableau utilise les références adultes de Lucerne.</p><table class="t"><thead><tr><th scope="col">Aspect selon le VGM</th><th scope="col">Hypothèses à confronter</th><th scope="col">Limite</th></tr></thead><tbody><tr><th scope="row"><button class="w" data-k="d64-a02-w2">Microcytose (taille et causes)</button> : &lt; 82 fL</th><td>Carence martiale, hémoglobinopathie, certaines sidéroblastiques.</td><td>La taille ne prouve pas la carence.</td></tr><tr><th scope="row">Normocytose : 82–97 fL</th><td>Production insuffisante, perte ou destruction selon les <button class="w" data-k="d64-a09-w1">réticulocytes (calcul et interprétation)</button>.</td><td>Deux populations peuvent se compenser.</td></tr><tr><th scope="row"><button class="w" data-k="d64-a02-w2">Macrocytose (taille et causes)</button> : &gt; 97 fL</th><td>Carence vitaminique, exposition, certaines <button class="w" data-k="d64-a06-w1">dysérythropoïèses (maturation et mécanisme)</button> ou maladies clonales.</td><td>Une forme héréditaire n’est pas toujours microcytaire.</td></tr></tbody></table><p>Cette gradation est morphologique ; elle ne classe pas la gravité clinique.</p>
<h3 id="d64-a02-partie-3">3. Classification mécanistique : production, destruction ou perte selon les sources</h3><p>Le mécanisme se comprend en comparant l’anémie à la réponse réticulocytaire. Une production efficace accrue est attendue après une perte ou une destruction périphérique, à condition que la moelle dispose des ressources nécessaires. À l’inverse, une moelle riche en précurseurs peut produire peu d’hématies matures : cette érythropoïèse inefficace caractérise plusieurs formes du chapitre. Une hyperplasie médullaire n’est donc pas synonyme de régénération sanguine efficace.</p>
<p><button class="w" data-k="d64-a02-w1">Hémoglobine : référence et diagnostic (explication détaillée)</button></p>
<h3 id="d64-a02-partie-4">4. Paramètres : différence entre référence de laboratoire et seuil diagnostique</h3><p>Trois usages du chiffre doivent rester distincts. L’intervalle de référence décrit une population du laboratoire ; le seuil diagnostique définit une anomalie selon un référentiel ; une cible thérapeutique oriente une intervention dans une population précise. Par exemple, une <button class="w" data-k="d64-e03-w1">ferritine (bilan du fer et limites)</button> ciblée pendant une chélation n’est pas une valeur normale universelle. Les comparaisons longitudinales utilisent les mêmes unités, la même méthode si possible et la connaissance des <button class="w" data-k="d64-a10-w2">transfusions (décision et sécurité)</button>, de l’inflammation et des traitements récents.</p>
<h3 id="d64-a02-partie-5">5. Fréquence : données suisses disponibles et limites pour les formes rares</h3><p>L’anémie en général est fréquente : le document genevois l’estime à 1,5 % de la population, avec 1,6 % chez les hommes âgés et 3,2 % chez les femmes âgées. En revanche, les formes de D64 sont rares. Le contrôle de qualité zurichois de 2015 recense environ 120 patients atteints d’anémie dysérythropoïétique congénitale, issus de 98 familles, pour la Suisse, l’Autriche et l’Allemagne réunies. Les ressources publiques de la Société suisse d’hématologie ne fournissent pas de prévalence nationale propre à chaque forme ; le consensus européen de 2017 décrit plus de 200 patients publiés de type II et environ 100 de type I, ce qui traduit une rareté et une probable sous-identification. Les estimations anciennes varient selon les centres et les effets fondateurs ; elles ne constituent pas un taux suisse contemporain. L’âge adulte au diagnostic n’exclut pas une maladie congénitale.</p>
<h3 id="d64-a02-partie-6">6. Gradation : tableau commenté des critères et des conséquences cliniques documentées</h3><p>La gravité se classe ici par conséquences cliniques et non par un seuil numérique unique. Une anémie tolérée, une anémie symptomatique et une défaillance d’organe appellent des niveaux d’intervention différents, décrits dans le tableau de gravité. Cette gradation qualitative n’est pas un score validé. Chez le patient fictif, la <button class="w" data-k="d64-a08-w1">dyspnée (tolérance clinique)</button> d’effort motive l’évaluation, tandis que l’absence de signes de défaillance permet une démarche ordonnée et rapprochée.</p><p>Deux sources suisses fournissent toutefois des repères chiffrés de gravité, dans des populations précises. Le tableau les rassemble en distinguant ce qui relève de l’urgence et ce qui relève de la transfusion inutile.</p><table class="t"><thead><tr><th scope="col">Situation</th><th scope="col">Repère et source</th><th scope="col">Conséquence clinique</th></tr></thead><tbody><tr><th scope="row">Instabilité hémodynamique</th><td>Critère d’urgence quel que soit le chiffre (HUG 2013).</td><td>La prise en charge est hospitalière et immédiate.</td></tr><tr><th scope="row">Hémoglobine ≤ 70 g/L</th><td>Critère d’urgence (HUG 2013).</td><td>L’hospitalisation et la transfusion sont discutées sans attendre le bilan causal.</td></tr><tr><th scope="row">Hémoglobine 70–80 g/L chez un malade cardiovasculaire</th><td>Critère d’urgence (HUG 2013).</td><td>La réserve coronarienne limitée justifie une prise en charge urgente.</td></tr><tr><th scope="row">Hémoglobine 70–80 g/L chez un patient stable et non cardiaque</th><td>Zone jugée sûre par la Société suisse d’hématologie (2023).</td><td>Une transfusion destinée seulement à « augmenter le chiffre » est évitée.</td></tr><tr><th scope="row">Anémie chronique stable, symptômes d’effort limités</th><td>Aucun seuil universel ; jugement clinique.</td><td>Le bilan causal est organisé avec un suivi daté.</td></tr></tbody></table><p>Ce tableau se lit en commençant par la ligne la plus grave : une instabilité prime sur tout chiffre. L’erreur fréquente consiste à appliquer la zone « sûre » de 70–80 g/L à un patient coronarien ; la source suisse la réserve aux patients stables et non cardiaques. Ces repères datent de 2013 et de 2023 ; ils guident l’urgence, non le diagnostic de la forme.</p>
<p><button class="w" data-k="d64-a02-w2">Classification morphologique : utilité et limites (explication détaillée)</button></p>
<div class="key"><b>À retenir.</b> La taille des globules rouges, la régénération et la gravité décrivent trois dimensions différentes. Les intervalles de laboratoire ne remplacent ni les seuils diagnostiques ni l’examen clinique.</div>
<div class="quiz ui"><p>Un VGM normal suffit-il à exclure une maladie érythroïde ?</p><button data-ok="1">Non : la moyenne peut masquer des populations différentes et ne désigne pas la cause.</button><button data-ok="0">Oui : un VGM normal exclut une anémie de production.</button><p class="fb" hidden>La morphologie, les réticulocytes et le contexte apportent des informations différentes.</p></div>

p 5 (2023)</a></p><button class="pareto-btn ui" data-k="pareto-d64-a02">▲ Loi de Pareto — Définition, classification et données de fréquence</button></section>
<section class="ilot" id="d64-a03"><h2><span class="n">3</span> Anémies sidéroblastiques héréditaires</h2>
<p>Les anémies sidéroblastiques héréditaires résultent d’un défaut génétique de l’utilisation mitochondriale du fer par l’érythroblaste. La CIM-10-GM 2024 les classe en D64.0, code qui inclut explicitement l’anémie hypochrome sidéroblastique liée au chromosome X.</p>
<h3 id="d64-a03-partie-1">1. Anémies sidéroblastiques héréditaires : formes comprises et sources spécifiques</h3><p>Les formes héréditaires peuvent être isolées ou syndromiques. Les anomalies d’<button class="w" data-k="d64-a03-w2">ALAS2 (forme liée à l’X)</button>, liées à l’X, et les anomalies bialléliques de <button class="w" data-k="d64-a03-w2">SLC25A38 (forme héréditaire)</button> sont deux causes importantes des formes isolées. Les autres formes touchent notamment la biogenèse des centres fer-soufre ou la synthèse de protéines mitochondriales. Le tableau génétique distingue ces groupes, car leur âge de présentation, leurs manifestations extrahématologiques et leur sensibilité à la <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button> diffèrent.</p>
<p>Les principaux groupes héréditaires se distinguent par leur mécanisme et leurs signes associés. La liste suivante sélectionne les formes utiles au raisonnement sans prétendre épuiser les gènes rares.</p><table class="t"><thead><tr><th scope="col">Gène ou groupe</th><th scope="col">Transmission et mécanisme</th><th scope="col">Conséquence clinique</th></tr></thead><tbody><tr><th scope="row"><button class="w" data-k="d64-a03-w2">ALAS2 (forme liée à l’X)</button></th><td>Liée à l’X ; première étape de synthèse de l’<button class="w" data-k="d64-s03-w1">hème (synthèse et compartiments)</button>.</td><td>Une réponse à la <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button> est possible, mais variable.</td></tr><tr><th scope="row"><button class="w" data-k="d64-a03-w2">SLC25A38 (forme héréditaire)</button></th><td>Récessive ; apport mitochondrial de glycine.</td><td>La maladie peut être sévère et dépendante des <button class="w" data-k="d64-a10-w2">transfusions (décision et sécurité)</button> ; la <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button> n’a pas la réponse habituelle.</td></tr><tr><th scope="row">GLRX5, HSPA9, HSCB</th><td>Anomalies des centres fer-soufre.</td><td>La caractérisation moléculaire précise la forme.</td></tr><tr><th scope="row">ABCB7</th><td>Liée à l’X ; fonction mitochondriale.</td><td>Une ataxie peut accompagner l’anémie.</td></tr><tr><th scope="row">ADN mitochondrial, PUS1 ou YARS2</th><td>Mécanismes mitochondriaux variés.</td><td>Pearson associe notamment une atteinte pancréatique ; d’autres formes associent myopathie et acidose lactique.</td></tr><tr><th scope="row">TRNT1 ou SLC19A2</th><td>Formes syndromiques distinctes.</td><td>Une immunodéficience ou une forme sensible à la thiamine modifie l’enquête spécialisée.</td></tr></tbody></table><p>Les signes extrahématologiques servent à choisir le bilan ; ils ne suffisent pas à nommer un gène.</p>
<h3 id="d64-a03-partie-2">2. Mécanismes et phénotypes : caractéristiques documentées et variation entre sous-types</h3><p><button class="w" data-k="d64-a03-w2">ALAS2 (forme liée à l’X)</button> code l’enzyme érythroïde qui initie la synthèse de l’<button class="w" data-k="d64-s03-w1">hème (synthèse et compartiments)</button> avec le phosphate de pyridoxal comme cofacteur. Une activité insuffisante réduit la fabrication de l’hème malgré la présence de fer. <button class="w" data-k="d64-a03-w2">SLC25A38 (forme héréditaire)</button> participe à l’apport mitochondrial de glycine, autre substrat indispensable. Dans les deux situations, le fer peut s’accumuler dans les mitochondries des érythroblastes. Cependant, une même anomalie morphologique n’implique pas la même enzyme défectueuse ni la même réponse à la vitamine B6.</p>
<h3 id="d64-a03-partie-3">3. Anamnèse : histoire personnelle, âge de présentation et contexte familial</h3><p>L’entretien recherche une anémie ancienne, des <button class="w" data-k="d64-a10-w2">transfusions (décision et sécurité)</button> néonatales ou pédiatriques, une surcharge en fer avant toute transfusion et des antécédents familiaux. Une ataxie suggère certaines formes liées à ABCB7 ; une atteinte pancréatique exocrine chez un nourrisson oriente vers le syndrome de Pearson. Une myopathie, une acidose lactique ou une immunodéficience conduit vers d’autres formes syndromiques. Ces associations motivent des investigations spécialisées ; elles ne remplacent pas la confirmation moléculaire.</p>
<p><button class="w" data-k="d64-a03-w1">Sidéroblaste : définition et portée (explication détaillée)</button></p>
<h3 id="d64-a03-partie-4">4. Diagnostic : arguments cliniques, biologie, morphologie et génétique pertinente</h3><p>La combinaison d’une anémie compatible, de <button class="w" data-k="d64-a03-w1">sidéroblastes en couronne (définition et portée)</button> et d’un résultat génétique interprétable établit la forme héréditaire avec davantage de précision que la morphologie seule. Une <button class="w" data-k="d64-a02-w2">microcytose (taille et causes)</button> est fréquente dans les formes isolées, mais certaines formes mitochondriales sont normocytaires ou macrocytaires. Pour la forme liée à l’X, l’identification de la mutation d’<button class="w" data-k="d64-a03-w2">ALAS2 (forme liée à l’X)</button> est exigée pour un diagnostic concluant, selon la revue de Cazzola et Invernizzi ; un panel plus large devient nécessaire devant un phénotype syndromique. Une analyse négative n’exclut pas toutes les anomalies possibles.</p>
<h3 id="d64-a03-partie-5">5. Prise en charge : options spécifiques, complications et critères de réponse</h3><p>La <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button> peut améliorer les formes liées à <button class="w" data-k="d64-a03-w2">ALAS2 (forme liée à l’X)</button> ; la réponse est variable et doit être objectivée. Une forme liée à <button class="w" data-k="d64-a03-w2">SLC25A38 (forme héréditaire)</button> est généralement réfractaire et peut nécessiter <button class="w" data-k="d64-a10-w2">transfusions (décision et sécurité)</button> et prise en charge de la surcharge. Son évolution ressemble à celle d’une thalassémie majeure ; c’est pourquoi une greffe allogénique de cellules souches est envisagée chez le sujet jeune, dans un centre spécialisé. Dans la forme liée à l’X, la surcharge peut être traitée par des saignées modérées sous pyridoxine, car l’anémie s’améliore suffisamment pour les tolérer. Le traitement du fer accumulé demeure nécessaire même si l’anémie s’améliore, car les complications tissulaires dépendent d’une exposition cumulative.</p>
<h3 id="d64-a03-partie-6">6. Suivi familial : conseil, surveillance et limites des connaissances</h3><p>Le conseil génétique s’appuie sur le gène identifié et le mode de transmission, jamais sur le seul mot héréditaire. Une femme peut manifester une forme liée à l’X, notamment lorsque l’inactivation du chromosome X est déséquilibrée. Les apparentés reçoivent une information adaptée et un test ciblé lorsque sa pertinence est établie. Le suivi associe l’hémogramme, l’évaluation de la charge en fer et les manifestations propres au sous-type ; aucun calendrier unique n’est validé pour toutes ces maladies.</p>
<p><button class="w" data-k="d64-a03-w2">Génétique : indication, résultat et limites (explication détaillée)</button></p>
<div class="key"><b>À retenir.</b> Une anémie sidéroblastique héréditaire se précise par son mécanisme et sa génétique. La <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button> ne traite pas toutes les formes ; la surcharge peut précéder les <button class="w" data-k="d64-a10-w2">transfusions (décision et sécurité)</button>.</div>
<div class="quiz ui"><p>Une anémie liée à SLC25A38 a-t-elle la même réponse habituelle à la pyridoxine qu’une forme ALAS2 ?</p><button data-ok="1">Non ; le mécanisme et la réponse attendue diffèrent.</button><button data-ok="0">Oui ; toute couronne de fer implique un déficit en vitamine B6.</button><p class="fb" hidden>La pyridoxine peut améliorer ALAS2. SLC25A38 concerne l’apport mitochondrial de glycine et est habituellement réfractaire.</p></div>
<p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>. ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D60–D64 (Stand 15.09.2023)</a></p><button class="pareto-btn ui" data-k="pareto-d64-a03">▲ Loi de Pareto — Anémies sidéroblastiques héréditaires</button></section>
<section class="ilot" id="d64-a04"><h2><span class="n">4</span> Anémies sidéroblastiques secondaires à une maladie</h2>
<p>Une maladie acquise peut perturber la synthèse de l’hème au point de faire apparaître des sidéroblastes en couronne. La CIM-10-GM classe ces formes secondaires en D64.1 ; en revanche, elle exclut de D64 l’anémie réfractaire avec sidéroblastes en couronne, codée D46.1 parmi les néoplasies myélodysplasiques.</p>
<h3 id="d64-a04-partie-1">1. Anémies sidéroblastiques liées à une maladie : causes documentées et périmètre</h3><p>Une anémie sidéroblastique acquise liée à une maladie ne se confond pas avec l’anémie inflammatoire habituelle. La carence en <button class="w" data-k="d64-a04-w1">cuivre (cause réversible)</button> liée à une malabsorption peut produire une anémie, une neutropénie et des anomalies médullaires ressemblant à une myélodysplasie. À l’inverse, une néoplasie myélodysplasique peut elle-même comporter des <button class="w" data-k="d64-a03-w1">sidéroblastes en couronne (définition et portée)</button>. Dans ce dernier cas, le diagnostic de la maladie clonale guide la prise en charge et son classement spécifique.</p>
<h3 id="d64-a04-partie-2">2. Imputabilité clinique : relation temporelle et arguments orientant le bilan</h3><p>La chronologie confronte l’apparition de l’anémie à une chirurgie digestive, une malabsorption, une maladie médullaire ou une modification nutritionnelle. Une correction de la cause suivie d’une amélioration hématologique soutient l’imputabilité, sans constituer une preuve absolue lorsque plusieurs traitements ont changé. Le médecin compare également les hémogrammes antérieurs et l’évolution des autres lignées. Une cytopénie multiple persistante appelle une analyse plus large qu’une anémie isolée stable.</p>
<h3 id="d64-a04-partie-3">3. Diagnostics concurrents : autres mécanismes d’anémie au cours de la même maladie</h3><p>Une même maladie peut provoquer plusieurs mécanismes. Chez un patient dénutri consommant beaucoup d’alcool, une carence en folates, une hémorragie digestive et une toxicité médullaire peuvent coexister. Chez une personne atteinte de maladie rénale, un déficit relatif en <button class="w" data-k="d64-s02-w2">érythropoïétine (régulation)</button> n’exclut ni une carence martiale ni une maladie médullaire. Par conséquent, la présence d’une maladie connue ne suffit pas à attribuer toutes les anomalies sanguines à cette maladie.</p>
<p><button class="w" data-k="d64-a04-w1">Cause secondaire : arguments et exclusions (explication détaillée)</button></p>
<h3 id="d64-a04-partie-4">4. Confirmation : examens spécifiques, portée des résultats et limites</h3><p>La confirmation est orientée : <button class="w" data-k="d64-a04-w1">cuivre (cause réversible)</button> et zinc dans le contexte de malabsorption ou d’excès de zinc, bilan médullaire et cytogénétique lorsque la situation suggère une affection clonale, et analyse moléculaire appropriée si nécessaire. Les critères des néoplasies myélodysplasiques associent morphologie, nombre de blastes et anomalies génétiques ; les sidéroblastes ne sont qu’un élément. La classification de l’Organisation mondiale de la santé de 2022, reprise par la recommandation Onkopedia de mars 2026 à laquelle participe la Société suisse d’hématologie, définit une néoplasie myélodysplasique à blastes bas avec mutation de SF3B1 : moins de 5 % de blastes médullaires, moins de 2 % de blastes sanguins, sans délétion 5q, monosomie 7 ni caryotype complexe. Dans ce cadre, au moins 15 % de sidéroblastes en couronne peut remplacer la démonstration de la mutation. Une simple coloration positive n’établit donc pas cette catégorie, et les causes secondaires doivent avoir été écartées.</p>
<h3 id="d64-a04-partie-5">5. Traitement : prise en charge causale et mesures propres à l’anémie</h3><p>Le traitement causal suit le mécanisme établi. Une carence documentée se corrige avec le spécialiste et sa cause digestive ou nutritionnelle est traitée. Une néoplasie myélodysplasique suit une stratégie fondée sur son risque et son phénotype ; les traitements de cette maladie ne sont pas des traitements génériques de l’anémie sidéroblastique. En parallèle, la tolérance peut nécessiter un soutien <button class="w" data-k="d64-a10-w2">transfusionnel (décision et sécurité)</button>, et la surcharge en fer doit être recherchée lorsque l’exposition le justifie.</p>
<h3 id="d64-a04-partie-6">6. Suivi : évolution, réponse, complications et critères d’avis hématologique</h3><p>Le suivi compare les symptômes, l’<button class="w" data-k="d64-a02-w1">hémoglobine (référence et diagnostic)</button>, les <button class="w" data-k="d64-a09-w1">réticulocytes (calcul et interprétation)</button> et les autres lignées après l’intervention causale. Dans la carence en <button class="w" data-k="d64-a04-w1">cuivre (cause réversible)</button>, les sidéroblastes en couronne disparaissent habituellement environ deux mois après une supplémentation correcte, alors qu’une atteinte neurologique peut persister définitivement. L’absence d’amélioration impose de reconsidérer la cause, l’absorption et les diagnostics concurrents. Une aggravation des cytopénies, des anomalies du frottis ou une dépendance <button class="w" data-k="d64-a10-w2">transfusionnelle (décision et sécurité)</button> motive un avis hématologique sans attendre la fin d’un traitement empirique prolongé.</p>
<p><button class="w" data-k="d64-a04-w2">Bilan spécialisé : question précise (explication détaillée)</button></p>
<div class="key"><b>À retenir.</b> Une cause secondaire exige une preuve orientée. La carence en <button class="w" data-k="d64-a04-w1">cuivre (cause réversible)</button> peut imiter une myélodysplasie ; une maladie clonale confirmée conserve sa stratégie propre.</div>
<div class="quiz ui"><p>Une anémie et une neutropénie apparaissent après chirurgie digestive. Quelle piste réversible doit être considérée ?</p><button data-ok="1">Une carence en cuivre, à confirmer dans ce contexte.</button><button data-ok="0">Une myélodysplasie certaine, sans bilan nutritionnel.</button><p class="fb" hidden>Le déficit en cuivre peut imiter une maladie clonale ; le contexte guide les dosages et la confrontation.</p></div>
<p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/myelodysplastische-neoplasien-myelodysplastische-syndrome-mds/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SSH, SSOM) — Myelodysplastische Neoplasien (Mars 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>. ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D60–D64 (Stand 15.09.2023)</a></p><button class="pareto-btn ui" data-k="pareto-d64-a04">▲ Loi de Pareto — Anémies sidéroblastiques secondaires à une maladie</button></section>
<section class="ilot" id="d64-a05"><h2><span class="n">5</span> Médicaments, toxines et autres formes sidéroblastiques</h2>
<p>Un médicament, un toxique ou une carence métabolique peut bloquer une étape de la synthèse de l’hème. La CIM-10-GM range ces formes en D64.2 lorsqu’un médicament ou une toxine est en cause, et en D64.3 pour les autres anémies sidéroblastiques, y compris la forme sensible à la pyridoxine non classée ailleurs.</p>
<h3 id="d64-a05-partie-1">1. Médicaments et toxines : produits, expositions et preuves documentées</h3><p>Les expositions décrites comprennent l’alcool, le <button class="w" data-k="d64-a05-w2">plomb (exposition et bilan)</button> et plusieurs médicaments ; l’isoniazide et le chloramphénicol sont les plus souvent cités, mais le <button class="w" data-k="d64-a05-w1">linézolide (imputabilité et surveillance)</button>, le pyrazinamide, la pénicillamine et la cyclosérine le sont aussi. Jusqu’à un tiers des personnes ayant une consommation excessive et chronique d’alcool présenteraient des sidéroblastes en couronne, surtout en cas de malabsorption associée. Les mécanismes diffèrent : interférence avec la <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button>, inhibition d’enzymes de l’<button class="w" data-k="d64-s03-w1">hème (synthèse et compartiments)</button> ou toxicité de la synthèse protéique mitochondriale. L’information professionnelle suisse de Zyvoxid classe l’anémie sidéroblastique parmi les effets indésirables rares (de 1 sur 10 000 à 1 sur 1000) ; la revue européenne de 2022 décrit des sidéroblastes et une vacuolisation des érythroblastes après une exposition médiane de deux semaines. Cette donnée documente un risque connu ; elle ne permet pas d’attribuer automatiquement toute anémie sous linézolide à ce mécanisme.</p>
<h3 id="d64-a05-partie-2">2. Histoire d’exposition : dose reçue, durée, temporalité et autres facteurs lorsque connus</h3><p>L’histoire d’exposition relève les produits exacts, leurs dates de début et d’arrêt, les doses réellement reçues et les traitements associés. Elle inclut les compléments contenant du zinc, les expositions professionnelles ou domestiques au <button class="w" data-k="d64-a05-w2">plomb (exposition et bilan)</button> et la consommation d’alcool. Le dossier précise les valeurs sanguines antérieures. Un intervalle temporel compatible renforce une hypothèse ; une anémie présente avant l’exposition oblige à rechercher une autre cause ou une aggravation d’une maladie préexistante.</p>
<h3 id="d64-a05-partie-3">3. Imputabilité : arguments, diagnostics concurrents et limites de conclusion</h3><p>L’imputabilité combine la plausibilité biologique, la temporalité, les diagnostics concurrents et l’évolution après retrait. Une réexposition volontaire n’est pas nécessaire pour prouver le risque. Le <button class="w" data-k="d64-a05-w1">linézolide (imputabilité et surveillance)</button> peut provoquer une myélosuppression sans sidéroblastes ; l’isoniazide a aussi été associé à une aplasie érythroïde. Le médecin distingue donc la conclusion clinique prudente, anémie possiblement médicamenteuse, de la conclusion morphologique spécifique, anémie sidéroblastique documentée.</p>
<p>La chronologie et le mécanisme permettent de comparer les expositions. Une coexistence n’est pas une preuve d’imputabilité.</p><table class="t"><thead><tr><th scope="col">Exposition</th><th scope="col">Mécanisme ou indice</th><th scope="col">Décision orientée</th></tr></thead><tbody><tr><th scope="row">Isoniazide</th><td>Interférence avec le métabolisme de la <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button>.</td><td>Le prescripteur réévalue le traitement antituberculeux et la prévention par pyridoxine prévue par la fiche suisse de Benadon.</td></tr><tr><th scope="row"><button class="w" data-k="d64-a05-w1">Linézolide (imputabilité et surveillance)</button> — Zyvoxid</th><td>Toxicité mitochondriale ; cytopénies et rare anémie sidéroblastique dans la fiche.</td><td>La fiche impose une formule sanguine hebdomadaire ; l’arrêt est envisagé si une myélosuppression apparaît ou s’aggrave.</td></tr><tr><th scope="row">Alcool</th><td>L’alcool et l’acétaldéhyde inhibent de façon réversible la synthase de l’acide 5-aminolévulinique ; des carences associées sont fréquentes.</td><td>Le médecin quantifie la consommation et recherche une carence en folates, une malabsorption et un saignement associés.</td></tr><tr><th scope="row"><button class="w" data-k="d64-a05-w2">Plomb (exposition et bilan)</button></th><td>Inhibition d’enzymes de l’<button class="w" data-k="d64-s03-w1">hème (synthèse et compartiments)</button> ; ponctuations basophiles possibles.</td><td>Le médecin documente la source d’exposition et demande une plombémie ciblée.</td></tr><tr><th scope="row">Excès de zinc</th><td>Peut provoquer un déficit en <button class="w" data-k="d64-a04-w1">cuivre (cause réversible)</button>.</td><td>Le médecin confronte les suppléments, le dosage du <button class="w" data-k="d64-a04-w1">cuivre (cause réversible)</button> et du zinc, et les signes neurologiques.</td></tr></tbody></table><p>La réévaluation après correction fait partie de la preuve, tout en tenant compte des autres interventions.</p>
<p><button class="w" data-k="d64-a05-w1">Imputabilité : faits et limites (explication détaillée)</button></p>
<h3 id="d64-a05-partie-4">4. Bilan : examens hématologiques et toxicologiques selon la question</h3><p>Le bilan comprend un hémogramme complet, les <button class="w" data-k="d64-a09-w1">réticulocytes (calcul et interprétation)</button>, le frottis et un bilan martial. Une recherche de <button class="w" data-k="d64-a05-w2">plomb (exposition et bilan)</button> sanguin répond à une exposition plausible ; des ponctuations basophiles soutiennent cette recherche mais ne suffisent pas au diagnostic. Le <button class="w" data-k="d64-a04-w1">cuivre (cause réversible)</button> et le zinc sont dosés si le contexte le justifie. La moelle s’examine lorsque l’anémie reste inexpliquée, lorsque plusieurs lignées sont touchées ou lorsque la distinction avec une maladie clonale modifie la conduite.</p>
<h3 id="d64-a05-partie-5">5. Autres anémies sidéroblastiques : formes pertinentes distinctes des groupes précédents</h3><p>Une forme sidéroblastique peut rester non classée après le premier bilan. Cette description résiduelle conserve la preuve morphologique, mais ne devient pas une nouvelle cause. Des formes métaboliques inhabituelles ou des maladies héréditaires non identifiées peuvent expliquer certains cas. La carence en pyridoxine elle-même s’accompagne d’une anémie microcytaire hypochrome avec sidéroblastes en couronne, car le phosphate de pyridoxal est le cofacteur de la première enzyme de l’hème ; la CIM-10-GM range la forme sensible à la pyridoxine non classée ailleurs en D64.3. La revue européenne de 2022 rapporte aussi quelques cas réversibles de thrombopénie et d’anémie sidéroblastique au cours d’une hypothermie, avec un mécanisme incertain. Ces observations rares sont des associations documentées, non des critères permettant d’arrêter les investigations.</p>
<h3 id="d64-a05-partie-6">6. Prise en charge : retrait ou modification documentée, traitement et surveillance</h3><p>Une exposition évitable est interrompue ou remplacée dans un cadre médical adapté à l’indication initiale. Sous Zyvoxid, la fiche suisse demande une formule sanguine hebdomadaire et envisage l’arrêt si une myélosuppression apparaît ou s’aggrave. La stratégie anti-infectieuse doit rester efficace pendant cette modification. La correction d’une carence en <button class="w" data-k="d64-p01-w1">pyridoxine (indication et sécurité)</button> suit le produit exact. Enfin, les symptômes, les lignées sanguines et la disparition de l’exposition sont réévalués ensemble pour juger la récupération.</p>
<p><button class="w" data-k="d64-a05-w2">Toxiques : exposition et bilan (explication détaillée)</button></p>
<div class="key"><b>À retenir.</b> Une exposition ne prouve pas sa responsabilité. La chronologie, les examens et la récupération après retrait orientent l’imputabilité ; Zyvoxid impose un hémogramme hebdomadaire.</div>
<div class="quiz ui"><p>Une anémie est découverte sous linézolide. Que faut-il faire pour discuter l’imputabilité ?</p><button data-ok="1">Le médecin compare les résultats antérieurs, le délai, les autres causes et la fiche du produit.</button><button data-ok="0">Le médecin attribue d’emblée l’anémie au médicament.</button><p class="fb" hidden>Une association temporelle constitue un argument, mais pas une preuve suffisante. La fiche suisse de Zyvoxid décrit aussi des cytopénies sans sidéroblastes ; seule la confrontation complète permet de conclure.</p></div>
<p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid comprimés pelliculés, information professionnelle ; autorisation 55558 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>. ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D60–D64 (Stand 15.09.2023)</a></p><button class="pareto-btn ui" data-k="pareto-d64-a05">▲ Loi de Pareto — Médicaments, toxines et autres formes sidéroblastiques</button></section>
<section class="ilot" id="d64-a06"><h2><span class="n">6</span> Anémie dysérythropoïétique congénitale</h2>
<p>Les anémies dysérythropoïétiques congénitales associent une érythropoïèse inefficace à des anomalies morphologiques caractéristiques des érythroblastes. Elles correspondent au code D64.4, dont la CIM-10-GM exclut l’anémie de Diamond et Blackfan, classée parmi les aplasies congénitales, ainsi que la maladie de Di Guglielmo, classée parmi les leucémies.</p>
<h3 id="d64-a06-partie-1">1. Anémie dysérythropoïétique congénitale : définition et sous-types pertinents</h3><p>Les anémies dysérythropoïétiques congénitales associent une production érythroïde inefficace à des anomalies caractéristiques des précurseurs médullaires. Les types I, II et III se distinguent par la morphologie et la génétique ; des variants liés notamment à KLF1 ou GATA1 complètent ce spectre. L’anémie peut s’accompagner d’un renouvellement accru de l’<button class="w" data-k="d64-a02-w1">hémoglobine (référence et diagnostic)</button>, d’un <button class="w" data-k="d64-a08-w2">ictère (examen ciblé)</button> et d’une surcharge en fer. Une <button class="w" data-k="d64-a06-w1">dysérythropoïèse (maturation et mécanisme)</button> isolée au myélogramme n’établit cependant pas une maladie congénitale : la concordance entre experts sur les images de dysérythropoïèse est faible, et une moelle normale peut en comporter une minorité.</p>
<h3 id="d64-a06-partie-2">2. Mécanismes : étapes de l’érythropoïèse concernées et données disponibles</h3><p>Dans le type I, les protéines codées par <button class="w" data-k="d64-a06-w2">CDAN1 (sous-types génétiques)</button> et <button class="w" data-k="d64-a06-w2">CDIN1 (sous-types génétiques)</button>, anciennement C15orf41, interviennent dans l’organisation de la chromatine ; le lien complet entre leur altération et le phénotype reste étudié. Dans le type II, <button class="w" data-k="d64-a06-w2">SEC23B (type II)</button> participe au transport vésiculaire entre réticulum endoplasmique et appareil de Golgi. Dans le type III, <button class="w" data-k="d64-a06-w2">KIF23 (type III)</button> concerne la division cellulaire. Ces voies différentes expliquent pourquoi une anomalie commune de maturation ne justifie pas un traitement moléculaire commun.</p>
<h3 id="d64-a06-partie-3">3. Histoire naturelle : présentation, manifestations et évolution par sous-type</h3><p>La présentation peut commencer à la naissance ou être reconnue seulement à l’âge adulte. Les séries décrivent une anémie chronique, un <button class="w" data-k="d64-a08-w2">ictère (examen ciblé)</button>, une <button class="w" data-k="d64-a08-w2">splénomégalie (examen et interprétation)</button> et parfois des calculs biliaires. Le type I peut comporter des anomalies des extrémités. La gravité varie entre apparentés et au cours de la vie. Une infection à parvovirus B19 peut déclencher une crise aplasique : la production réticulocytaire s’effondre brutalement et l’anémie se décompense, comme le rappelle le contrôle de qualité zurichois de 2015. Une grossesse, une autre infection ou une intervention peut augmenter les besoins <button class="w" data-k="d64-a10-w2">transfusionnels (décision et sécurité)</button> d’une personne jusque-là indépendante des transfusions.</p>
<p>Les sous-types classiques ne sont pas interchangeables. Les données morphologiques ci-dessous orientent une confirmation spécialisée.</p><table class="t"><thead><tr><th scope="col">Sous-type</th><th scope="col">Gènes et mécanisme</th><th scope="col">Signature et limite</th></tr></thead><tbody><tr><th scope="row">Type I</th><td><button class="w" data-k="d64-a06-w2">CDAN1 (sous-types génétiques)</button> ou <button class="w" data-k="d64-a06-w2">CDIN1 (sous-types génétiques)</button> ; chromatine.</td><td>Ponts internucléaires et hétérochromatine spongieuse ; la microscopie électronique n’identifie pas le gène.</td></tr><tr><th scope="row">Type II</th><td><button class="w" data-k="d64-a06-w2">SEC23B (type II)</button> ; transport vésiculaire.</td><td>Érythroblastes binucléés et anomalies de glycosylation ; confirmer le contexte héréditaire.</td></tr><tr><th scope="row">Type III classique</th><td><button class="w" data-k="d64-a06-w2">KIF23 (type III)</button> ; division cellulaire.</td><td>Érythroblastes géants multinucléés ; maladie très rare.</td></tr><tr><th scope="row">Autres formes</th><td>Notamment KLF1 et GATA1.</td><td>Les présentations ne s’intègrent pas toutes aux trois types classiques.</td></tr></tbody></table><p>La surcharge et la régénération insuffisante peuvent se rencontrer dans plusieurs sous-types ; elles ne les distinguent pas seules.</p>
<p><button class="w" data-k="d64-a06-w1">Dysérythropoïèse : définition et mécanismes (explication détaillée)</button></p>
<h3 id="d64-a06-partie-4">4. Démarche diagnostique : clinique, biologie, morphologie et génétique indiquée</h3><p>Le diagnostic confronte une réponse réticulocytaire insuffisante, la morphologie et la génétique. Pour le type I, la revue britannique de 2019 rapporte qu’au moins 20 % des érythroblastes doivent présenter une anomalie en microscopie optique, et que l’absence de ponts internucléaires remet ce diagnostic en question ; ce seuil appartient au type I et ne vaut pas pour les autres types. Dans le type II, 10 à 35 % des érythroblastes tardifs sont binucléés ; dans le type III, des érythroblastes géants comptent jusqu’à douze noyaux. Ces signes ne se lisent pas hors contexte. Les panels génétiques peuvent préciser précocement certains cas et éviter une répétition de prélèvements invasifs ; la recommandation BSH/EHA de 2022 demande d’ailleurs une confirmation génétique de toute dysérythropoïèse congénitale, car des hémolyses héréditaires sont souvent prises à tort pour une dysérythropoïèse. Une variante de signification incertaine exige néanmoins des preuves supplémentaires.</p>
<h3 id="d64-a06-partie-5">5. Prise en charge : options spécifiques, complications et surveillance</h3><p>Le soutien <button class="w" data-k="d64-a10-w2">transfusionnel (décision et sécurité)</button> dépend de la tolérance et de l’histoire de la maladie. L’interféron alpha est une option spécialisée surtout décrite dans le type I ; son mécanisme bénéfique reste imparfaitement compris et cet usage n’est pas une indication suisse de <button class="w" data-k="d64-p01-w2">Pegasys (preuve et hors indication)</button>. La splénectomie n’est pas systématique. Le consensus européen de 2017 la propose dans le type II en cas d’anémie sévère ou de <button class="w" data-k="d64-a08-w2">splénomégalie (examen et interprétation)</button> symptomatique (recommandation de grade 2, niveau de preuve C) ; dans le type I, il la réserve à une anémie qui s’aggrave, à une thrombopénie ou une leucopénie significatives, ou à une splénomégalie massive et douloureuse, car trois des six patients splénectomisés suivis à long terme sont décédés. L’érythropoïétine recombinante n’a pas amélioré l’anémie du type I et n’est pas considérée comme un traitement.</p>
<h3 id="d64-a06-partie-6">6. Famille et incertitude : conseil, limites des analyses et état des connaissances</h3><p>La surveillance recherche une surcharge en fer même chez les patients jamais transfusés. Le suivi spécialisé considère également la croissance, les manifestations endocriniennes, osseuses et extramédullaires selon le phénotype. Le conseil familial distingue un résultat pathogène d’un résultat indéterminé et explique le mode de transmission propre au gène. Les recommandations disponibles reposent souvent sur des séries réduites ; elles ne permettent pas de promettre une évolution identique à tous les membres d’une famille.</p>
<p><button class="w" data-k="d64-a06-w2">Sous-types : critères et limites (explication détaillée)</button></p>
<div class="key"><b>À retenir.</b> La <button class="w" data-k="d64-a06-w1">dysérythropoïèse (maturation et mécanisme)</button> congénitale exige une concordance entre clinique, morphologie et génétique. Le fer peut s’accumuler sans <button class="w" data-k="d64-a10-w2">transfusion (décision et sécurité)</button> ; interféron et splénectomie restent des options propres à certaines formes.</div>
<div class="quiz ui"><p>Une moelle riche en précurseurs avec peu de réticulocytes est-elle contradictoire ?</p><button data-ok="1">Non ; elle peut traduire une érythropoïèse inefficace.</button><button data-ok="0">Oui ; une moelle riche produit nécessairement beaucoup d’hématies matures.</button><p class="fb" hidden>Le nombre de précurseurs ne mesure pas la sortie efficace dans le sang.</p></div>
