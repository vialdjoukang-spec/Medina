<template id="d64-e01-w1" data-pop="d64-e01-w1" data-title="Indices érythrocytaires : bases et calculs"><p>Le VGM s’exprime en femtolitres et se calcule pédagogiquement par hématocrite (%) × 10 / hématies (T/L). Avec 30 % et 3,0 T/L, il vaut 100 fL. La teneur corpusculaire moyenne en hémoglobine, ou TCMH, vaut hémoglobine (g/L) / hématies (T/L) ; avec 100 g/L et 3,0 T/L, elle vaut 33,3 pg. La concentration corpusculaire moyenne, ou CCMH, vaut hémoglobine (g/L) / hématocrite (L/L), soit 100 / 0,30 = 333 g/L. Ces valeurs fictives décrivent trois grandeurs différentes. Les intervalles du tableau local et la méthode restent nécessaires pour l’interprétation.</p><p class="src">Sources : <a href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page consultée le 13 octobre 2026 ; références publiées citées 2022)</a> ; <a href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page consultée le 13 octobre 2026)</a> ; <a href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf" target="_blank" rel="noopener">CSCQ — MCV, MCH et MCHC (Fiche pédagogique, version en ligne consultée le 13 octobre 2026)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-e01-w2" data-pop="d64-e01-w2" data-title="Réticulocytes absolus et corrigés : domaine d’usage"><p>Avec 3,0 T/L d’hématies et 2 % de réticulocytes, le nombre absolu vaut 60 G/L. Le pourcentage corrigé simple décrit par les HUG multiplie le pourcentage mesuré par le rapport hématocrite du patient / hématocrite de référence. Si l’on choisit pédagogiquement 30 % / 45 %, il vaut 2 × 30 / 45 = 1,33 %. La valeur 45 % est une hypothèse de l’exercice, pas une référence universelle. Ce pourcentage corrigé ne comprend pas le facteur de maturation d’un indice de production réticulocytaire. Il ne faut pas employer les noms de ces deux calculs comme des synonymes.</p><p class="src">Sources : <a href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page consultée le 13 octobre 2026 ; références publiées citées 2022)</a> ; <a href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page consultée le 13 octobre 2026)</a> ; <a href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf" target="_blank" rel="noopener">CSCQ — MCV, MCH et MCHC (Fiche pédagogique, version en ligne consultée le 13 octobre 2026)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="pareto-d64-e01" data-pop="pareto-d64-e01" data-title="Loi de Pareto — Hémogramme et réticulocytes"><p class="ratio" data-cover="d64-e01"></p><ul><li>L’hémogramme décrit les cellules ; les réticulocytes décrivent leur arrivée récente dans le sang. Les calculs gardent leurs unités et leur portée descriptive.</li><li>3,0 × 10¹²/L × 0,02 = 60 × 10⁹/L. Le résultat peut être dans l’intervalle adulte sans constituer une réponse suffisante à l’anémie.</li></ul><p class="src">Sources : <a href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page consultée le 13 octobre 2026 ; références publiées citées 2022)</a> ; <a href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page consultée le 13 octobre 2026)</a> ; <a href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf" target="_blank" rel="noopener">CSCQ — MCV, MCH et MCHC (Fiche pédagogique, version en ligne consultée le 13 octobre 2026)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-e02-w1" data-pop="d64-e02-w1" data-title="Sidéroblastes : coloration et portée"><p>La coloration de Perls révèle le fer ferrique sous forme d’un dépôt bleu. Le sidéroblaste normal contient quelques granules dispersés ; la couronne exige au moins cinq granules autour d’au moins un tiers du noyau. Le pourcentage se compte parmi les précurseurs érythroïdes, et non parmi toutes les cellules médullaires. La planche compare des cellules sans granules ou à quelques granules dispersés à des cellules dont les granules sont nombreux ou en couronne ; elle ne donne pas à elle seule la cause. L’absence de barre d’échelle dans la publication empêche une mesure fiable de taille sur l’écran.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-e02-w2" data-pop="d64-e02-w2" data-title="Morphologie : description et diagnostic"><p>La description précède l’interprétation : préciser le prélèvement et la coloration, puis décrire taille relative, noyau, cytoplasme et distribution des inclusions. Une ponctuation basophile concerne le sang périphérique et ne démontre pas un sidéroblaste médullaire. Des cellules binucléées peuvent orienter vers une dysérythropoïèse, mais le contexte distingue maladie héréditaire et anomalies acquises. La photographie électronique compare une organisation normale et une chromatine anormale ; elle ne permet pas un diagnostic moléculaire. La conclusion doit dire ce que l’image montre et ce qu’elle ne permet pas de décider.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-e02" data-pop="pareto-d64-e02" data-title="Loi de Pareto — Frottis, moelle et histologie"><p class="ratio" data-cover="d64-e02"></p><ul><li>La moelle montre un signe, non toute son étiologie. Le fer périnucléaire, les noyaux et la chromatine se décrivent avec la technique utilisée et ses limites.</li><li>La coloration et la distribution sont visibles. Le gène, la cause globale et une mesure de taille nécessitent d’autres données.</li></ul><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-e03-w1" data-pop="d64-e03-w1" data-title="Bilan du fer : association de résultats et limites"><p>La ferritine renseigne les réserves tout en étant sensible à l’inflammation et à une atteinte hépatique. La saturation de la transferrine rapporte le fer circulant à sa capacité de transport. Leur association, le contexte inflammatoire et la dynamique sont plus informatifs qu’une valeur isolée. Une élévation ne quantifie pas parfaitement le fer tissulaire ; une imagerie spécialisée peut répondre à cette question. Les seuils d’Exjade servent à une population traitée précise et ne définissent pas les intervalles normaux du laboratoire. Une microcytose ne constitue jamais, à elle seule, une preuve de carence martiale.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page consultée le 13 octobre 2026 ; références publiées citées 2022)</a>.</p></template>
<template id="d64-e03-w2" data-pop="d64-e03-w2" data-title="Génétique : variante et interprétation"><p>Un variant peut être pathogène, probablement pathogène, de signification incertaine ou sans lien causal démontré. L’interprétation confronte le phénotype, le mode de transmission et la ségrégation familiale, avec l’analyse du laboratoire spécialisé. Une variation incertaine ne justifie pas à elle seule une thérapeutique ciblée ou un dépistage prédictif présenté comme certain. Le compte rendu précise aussi les régions et types d’anomalies examinés. Une analyse négative n’exclut pas tout mécanisme génétique, particulièrement lorsque les signes cliniques et morphologiques restent très évocateurs.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page consultée le 13 octobre 2026 ; références publiées citées 2022)</a>.</p></template>
<template id="pareto-d64-e03" data-pop="pareto-d64-e03" data-title="Loi de Pareto — Bilans causaux, toxiques et génétiques"><p class="ratio" data-cover="d64-e03"></p><ul><li>Les examens s’organisent par hypothèse. Les associations biologiques orientent, tandis que les résultats discordants imposent une réévaluation explicite.</li><li>L’excès de zinc peut induire un déficit en cuivre ; cette hypothèse reste à confirmer.</li></ul><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page consultée le 13 octobre 2026 ; références publiées citées 2022)</a>.</p></template>
<template id="d64-s01-w1" data-pop="d64-s01-w1" data-title="Moelle : organisation et cellules"><p>La moelle est un tissu organisé dans lequel mûrissent les cellules sanguines. Les précurseurs érythroïdes progressent vers une cellule spécialisée en hémoglobine, puis libèrent des réticulocytes. Leur développement dépend d’un microenvironnement et d’interactions avec des cellules de soutien ; les îlots érythroblastiques comprennent un macrophage central dans les modèles décrits. L’aspiration montre surtout les cellules isolées, tandis que la biopsie conserve l’architecture. Une moelle riche en précurseurs peut être inefficace si une fraction importante n’atteint pas la circulation.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a>.</p></template>
<template id="d64-s01-w2" data-pop="d64-s01-w2" data-title="Maturation érythroïde : étapes"><p>Le schéma publié conduit de la cellule souche hématopoïétique aux progéniteurs érythroïdes précoces, puis au proérythroblaste. Les stades suivants sont basophile, polychromatophile et orthochromatique. La cellule diminue de taille, s’enrichit en hémoglobine et condense sa chromatine. Après expulsion du noyau, le réticulocyte termine sa maturation avant de devenir une hématie. BFU-E et CFU-E désignent deux étapes fonctionnelles de progéniteurs étudiés par formation de colonies ; ces sigles ne sont pas des résultats de l’hémogramme. Le dessin montre l’ordre et les changements, sans reproduire une échelle cellulaire mesurable.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a>.</p></template>
<template id="pareto-d64-s01" data-pop="pareto-d64-s01" data-title="Loi de Pareto — Anatomie médullaire et histologie"><p class="ratio" data-cover="d64-s01"></p><ul><li>Une moelle riche peut produire peu d’hématies efficaces. Le prélèvement choisi dépend de la question : cellule, fer, architecture ou ultrastructure.</li><li>Le réticulocyte a perdu son noyau puis élimine progressivement le matériel résiduel.</li></ul><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a>.</p></template>
<template id="d64-s02-w1" data-pop="d64-s02-w1" data-title="Transport d’oxygène : grandeurs et unités"><p>Le contenu artériel CaO₂, en mL d’oxygène par dL de sang, est estimé par 1,34 × Hb × SaO₂ + 0,0031 × PaO₂. Hb doit être en g/dL, SaO₂ en fraction et PaO₂ en mmHg. Avec 100 g/L d’Hb, il faut d’abord convertir en 10 g/dL ; 98 % devient 0,98. Le résultat fictif est 13,442 mL/dL. Le transport DO₂ vaut ce contenu multiplié par le débit cardiaque : à 5 L/min, multiplier encore par 10 dL/L donne 672,1 mL/min. La formule décrit une estimation globale, pas une cible thérapeutique ni la perfusion de chaque tissu.</p><p class="src">Sources : <a href="https://pac6.ch/fr/chapitres/06-le-monitorage-en-anesthesie-cardiaque/6-5-catheter-pulmonaire-arteriel-de-swan-ganz/6-5-9-transport-doxygene-et-rapport-do2-vo2" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Transport d’oxygène et rapport DO2/VO2 (Édition en ligne consultée le 13 octobre 2026)</a> ; <a href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne consultée le 13 octobre 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8269393/fullTextXML" target="_blank" rel="noopener">Tomc et Debeljak — Molecular Insights into the Oxygen-Sensing Pathway and Erythropoietin Expression Regulation in Erythropoiesis (International Journal of Molecular Sciences 2021 ; 22:7074)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-s02-w2" data-pop="d64-s02-w2" data-title="Régulation : bases et limites"><p>L’hypoxie rénale stabilise un facteur de transcription, notamment HIF2α, qui favorise l’expression de l’érythropoïétine. En présence d’oxygène, l’hydroxylation par les prolyl-hydroxylases et la reconnaissance par VHL favorisent la dégradation du facteur. En hypoxie, il peut s’associer à ARNT et activer des gènes cibles. La figure publiée résume plusieurs niveaux de régulation, y compris des mécanismes surtout étudiés en modèles cellulaires. Le signal hormonal agit sur des précurseurs capables de répondre ; il ne corrige pas automatiquement un défaut d’hème ou de maturation.</p><p class="src">Sources : <a href="https://pac6.ch/fr/chapitres/06-le-monitorage-en-anesthesie-cardiaque/6-5-catheter-pulmonaire-arteriel-de-swan-ganz/6-5-9-transport-doxygene-et-rapport-do2-vo2" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Transport d’oxygène et rapport DO2/VO2 (Édition en ligne consultée le 13 octobre 2026)</a> ; <a href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne consultée le 13 octobre 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8269393/fullTextXML" target="_blank" rel="noopener">Tomc et Debeljak — Molecular Insights into the Oxygen-Sensing Pathway and Erythropoietin Expression Regulation in Erythropoiesis (International Journal of Molecular Sciences 2021 ; 22:7074)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="pareto-d64-s02" data-pop="pareto-d64-s02" data-title="Loi de Pareto — Physiologie de l’érythropoïèse et de l’oxygène"><p class="ratio" data-cover="d64-s02"></p><ul><li>La saturation et le contenu en oxygène sont différents. L’hémoglobine, le débit cardiaque et les besoins tissulaires expliquent ensemble la tolérance.</li><li>La saturation est une fraction ; le contenu est une quantité par volume de sang.</li></ul><p class="src">Sources : <a href="https://pac6.ch/fr/chapitres/06-le-monitorage-en-anesthesie-cardiaque/6-5-catheter-pulmonaire-arteriel-de-swan-ganz/6-5-9-transport-doxygene-et-rapport-do2-vo2" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Transport d’oxygène et rapport DO2/VO2 (Édition en ligne consultée le 13 octobre 2026)</a> ; <a href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne consultée le 13 octobre 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8269393/fullTextXML" target="_blank" rel="noopener">Tomc et Debeljak — Molecular Insights into the Oxygen-Sensing Pathway and Erythropoietin Expression Regulation in Erythropoiesis (International Journal of Molecular Sciences 2021 ; 22:7074)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-s03-w1" data-pop="d64-s03-w1" data-title="Synthèse de l’hème : étapes et compartiments"><p>La synthèse débute dans la mitochondrie : glycine et succinyl-coenzyme A produisent l’acide 5-aminolévulinique sous l’action d’une synthase dépendante du phosphate de pyridoxal. Dans le cytosol se succèdent porphobilinogène, hydroxyméthylbilane, uroporphyrinogène III et coproporphyrinogène III. Les étapes terminales reviennent à la mitochondrie, jusqu’à la protoporphyrine IX. La ferrochélatase y insère du fer ferreux pour former l’hème. Le dessin publié distingue matrice, espace intermembranaire et cytosol. Les transports marqués d’un point d’interrogation restent incertains dans cette revue ; ils ne sont pas transformés ici en certitudes.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a> ; <a href="https://www.mdpi.com/2073-4409/9/3/579" target="_blank" rel="noopener">Swenson et collaborateurs — From Synthesis to Utilization: The Ins and Outs of Mitochondrial Heme (Cells 2020 ; 9:579)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="d64-s03-w2" data-pop="d64-s03-w2" data-title="Métabolisme du fer : lecture du bilan"><p>L’hepcidine, produite principalement par le foie, freine la disponibilité plasmatique du fer en agissant sur la ferroportine, exportateur cellulaire. Une stimulation érythroïde peut réduire ce frein, notamment par l’érythroferrone. Lors d’une érythropoïèse inefficace, cette réponse peut favoriser l’absorption malgré une surcharge déjà constituée. La transferrine transporte, la ferritine stocke et les macrophages recyclent : ces fonctions ne sont pas interchangeables. Le bilan biologique explore indirectement ces compartiments ; une élévation de ferritine isolée ne mesure pas exactement le fer de chaque organe.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a> ; <a href="https://www.mdpi.com/2073-4409/9/3/579" target="_blank" rel="noopener">Swenson et collaborateurs — From Synthesis to Utilization: The Ins and Outs of Mitochondrial Heme (Cells 2020 ; 9:579)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="pareto-d64-s03" data-pop="pareto-d64-s03" data-title="Loi de Pareto — Biochimie du fer, de l’hème et de la mitochondrie"><p class="ratio" data-cover="d64-s03"></p><ul><li>Le fer disponible doit être incorporé dans l’hème. Les compartiments et les enzymes expliquent la microcytose, la surcharge et les réponses thérapeutiques différentes.</li><li>La synthèse nécessite des enzymes, des substrats et des compartiments fonctionnels.</li></ul><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a> ; <a href="https://www.mdpi.com/2073-4409/9/3/579" target="_blank" rel="noopener">Swenson et collaborateurs — From Synthesis to Utilization: The Ins and Outs of Mitochondrial Heme (Cells 2020 ; 9:579)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="d64-s04-w1" data-pop="d64-s04-w1" data-title="Transmission : risque et limites"><p>ALAS2 fournit l’exemple d’une transmission liée à l’X, tandis que SLC25A38 et les causes classiques de dysérythropoïèse I ou II sont récessives. Le type III lié à KIF23 peut être dominant. Un risque familial chiffré n’est proposé qu’après confirmation du variant et du statut parental ; le seul nom de la maladie ne suffit pas. Une femme peut être symptomatique pour une maladie liée à l’X. Une histoire familiale négative n’exclut donc pas une cause héréditaire. Le conseil explique aussi l’expression variable et les limites pronostiques du test.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="d64-s04-w2" data-pop="d64-s04-w2" data-title="Dysérythropoïèse : normal puis perturbation"><p>Normalement, la maturation coordonne condensation de la chromatine, hémoglobinisation et division, puis expulsion du noyau. Dans la dysérythropoïèse de type I, la chromatine peut présenter un aspect spongieux et des ponts internucléaires. La comparaison électronique publiée montre un témoin et une cellule pathologique cultivés ; elle illustre l’anomalie de structure. Le travail moléculaire récent relie CDIN1 à Codanin1, mais précise que certains modèles de trafic des histones restent hypothétiques. Il faut distinguer la lésion observée, le gène causal et une explication mécanistique encore incomplète.</p><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="pareto-d64-s04" data-pop="pareto-d64-s04" data-title="Loi de Pareto — Génétique et dysérythropoïèse"><p class="ratio" data-cover="d64-s04"></p><ul><li>La génétique précise la cause sans effacer l’incertitude pronostique. La morphologie, le variant et le phénotype doivent rester concordants.</li><li>Le classement de la variation, la ségrégation et le phénotype font partie de l’interprétation.</li></ul><p class="src">Sources : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="d64-p01-w1" data-pop="d64-p01-w1" data-title="Monographie par forme et produit"><p>Benadon contient 300 mg de chlorhydrate de pyridoxine par comprimé sécable, autorisation Swissmedic 25635. Pour l’adulte et l’adolescent à partir de 15 ans, la fiche prévoit 150–300 mg par jour dans les anémies pyridoxino-dépendantes, parfois davantage sous décision médicale ; elle ne fixe pas un plafond universel. La prise se fait par voie orale et la durée continue ne doit pas dépasser cinq mois sans interruption. Le tableau détaille les contre-indications et la neuropathie. Exjade dispersible, autorisation 57466, relève d’une autre indication : retirer le fer en excès dans les populations prévues par sa fiche. Son nom commercial et sa forme doivent accompagner toute dose.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680555850126" target="_blank" rel="noopener">Swissmedic — Pegasys, information professionnelle ; autorisation 55585 (Version en ligne consultée le 13 octobre 2026)</a> ; <a href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-p01-w2" data-pop="d64-p01-w2" data-title="Preuve thérapeutique : population et limites"><p>Une option peut reposer sur une fiche suisse autorisée, une recommandation européenne ou une petite série de maladies rares : ces preuves n’ont pas la même portée. La revue du type I décrit des réponses à l’interféron alpha, mais Pegasys ne possède pas cette indication suisse. Le cours ne transpose donc pas le schéma des hépatites à la dysérythropoïèse. La greffe et la splénectomie nécessitent également une sélection spécialisée et une discussion des risques. Pour chaque option, le lecteur vérifie la forme étudiée, le bénéfice observé et la qualité des données avant d’envisager une extrapolation.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680555850126" target="_blank" rel="noopener">Swissmedic — Pegasys, information professionnelle ; autorisation 55585 (Version en ligne consultée le 13 octobre 2026)</a> ; <a href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-p01" data-pop="pareto-d64-p01" data-title="Loi de Pareto — Traitements propres à chaque forme"><p class="ratio" data-cover="d64-p01"></p><ul><li>La molécule, la forme suisse et l’indication forment un ensemble indissociable. Les usages spécialisés hors indication sont annoncés explicitement et ne deviennent pas des prescriptions générales.</li><li>La fiche étudiée concerne les comprimés à mettre en suspension et leurs modalités spécifiques.</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680555850126" target="_blank" rel="noopener">Swissmedic — Pegasys, information professionnelle ; autorisation 55585 (Version en ligne consultée le 13 octobre 2026)</a> ; <a href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-p02-w1" data-pop="d64-p02-w1" data-title="Surveillance : paramètres et décisions"><p>Pour Exjade dispersible, la créatinine est mesurée deux fois avant traitement. Créatinine et fonction rénale sont contrôlées chaque semaine pendant le premier mois et après modification, puis chaque mois. La protéinurie est évaluée avant traitement puis mensuellement ; les marqueurs tubulaires sont ajoutés si nécessaire. Les transaminases, bilirubine et phosphatase alcaline sont évaluées avant traitement, toutes les deux semaines le premier mois, puis mensuellement. Un examen auditif et ophtalmologique est prévu initialement puis annuellement. Chaque anomalie est confrontée à la fiche pour réduire, interrompre ou réévaluer, sans attendre le contrôle suivant si des symptômes sévères apparaissent.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid, information professionnelle (Mars 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a>.</p></template>
<template id="d64-p02-w2" data-pop="d64-p02-w2" data-title="Surcharge : indication et limites du traitement"><p>Pour une surcharge post-transfusionnelle dans le cadre autorisé, la fiche d’Exjade associe exposition transfusionnelle et preuve de surcharge avant introduction. La ferritine est suivie mensuellement et la dose ajustée par paliers de 5–10 mg/kg selon la tendance, en général tous les trois à six mois. La plage 500–1000 µg/L est une cible de traitement citée par la fiche, pas un intervalle normal. Une ferritine persistante sous 500 µg/L conduit à interrompre le traitement dans ce cadre. Les critères propres aux thalassémies non transfusées ne sont pas automatiquement transférables aux dysérythropoïèses non transfusées.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid, information professionnelle (Mars 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a>.</p></template>
<template id="pareto-d64-p02" data-pop="pareto-d64-p02" data-title="Loi de Pareto — Sécurité, surcharge et surveillance"><p class="ratio" data-cover="d64-p02"></p><ul><li>Un traitement efficace peut être toxique. Les contre-indications, les interactions et le calendrier de surveillance sont définis avant la première dose et relus lors de chaque adaptation.</li><li>Il s’agit d’un seuil de sécurité du produit exact ; une indication de chélation ne supprime pas cette contre-indication.</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid, information professionnelle (Mars 2026)</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a>.</p></template>
