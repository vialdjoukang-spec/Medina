<title>Jauge Betta MEDINA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Tableau de bord clinique : bandeau de progression continue, puis grille de 17 carreaux (1 carreau = 1 cycle), détail des 8 leçons au survol. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#17231c; --muted:#5b6a60; --line:#d5ddd6;
  --accent:#1f3428; --done:#2f7d4f; --wip:#c98a14; --todo:#c9d2cb; --inj:#1f5f8b;
  --n05:#3f6fb5; --e06:#a15c9c; --n07:#1f8a8a; --h08:#b5483f;
  --sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211b; --fg:#e4ebe5; --muted:#9aa89e; --line:#2c3a31;
  --accent:#9fd3b0; --done:#4fb87a; --wip:#e3a93a; --todo:#34413a; --inj:#5aa3d6;
  --n05:#7fa6e6; --e06:#d18bcc; --n07:#56c2c2; --h08:#e5857c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --fg:#e4ebe5; --muted:#9aa89e; --line:#2c3a31;
  --accent:#9fd3b0; --done:#4fb87a; --wip:#e3a93a; --todo:#34413a; --inj:#5aa3d6;
  --n05:#7fa6e6; --e06:#d18bcc; --n07:#56c2c2; --h08:#e5857c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:grid;gap:10px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:800;color:var(--accent);text-wrap:balance}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;font-variant-numeric:tabular-nums}
.big b{font-size:clamp(34px,7vw,52px);font-weight:800;line-height:1}
.big span{color:var(--muted)}
.bar{height:14px;border-radius:7px;background:var(--todo);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;cursor:default;outline:none;transition:transform .15s,box-shadow .15s}
.tile:hover,.tile:focus-visible,.tile.on{transform:translateY(-2px);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--fg) 40%,transparent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.cur{border-color:var(--wip);box-shadow:inset 0 0 0 1px var(--wip)}
.tile .h{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.tile .h b{font:800 18px/1 var(--mono)}
.tile .h small{font:600 12px/1 var(--mono);color:var(--muted)}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.dots i{height:16px;border-radius:3px;background:var(--todo);border-bottom:3px solid var(--f)}
.dots i.LIVRE{background:var(--done)} .dots i.INJECTE{background:var(--inj)} .dots i.EN_COURS{background:var(--wip)}
.mini{height:4px;border-radius:2px;background:var(--todo);overflow:hidden}
.mini i{display:block;height:100%;background:var(--done)}
.tile p{margin:0;font-size:12px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#pop{position:fixed;z-index:10;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 14px 40px -12px color-mix(in srgb,var(--fg) 45%,transparent);display:grid;gap:8px;pointer-events:none}
#pop h2{margin:0;font-size:15px;text-wrap:balance}
#pop .fr{display:grid;gap:3px}
#pop .fr > div:first-child{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--f)}
#pop .l{display:grid;grid-template-columns:46px 1fr auto;gap:8px;font-size:13px;line-height:1.3;align-items:start}
#pop .l code{font:600 13px var(--mono)}
#pop .s{font:600 11px/1.6 var(--mono);padding:0 6px;border-radius:4px;background:var(--todo);color:var(--fg);white-space:nowrap}
#pop .s.LIVRE{background:var(--done);color:var(--surface)} #pop .s.INJECTE{background:var(--inj);color:var(--surface)} #pop .s.EN_COURS{background:var(--wip);color:#17231c}
footer{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tile,.bar i{transition:none}}
</style>
<div class="wrap">
  <header>
    <div class="eyebrow">MEDINA · Examen fédéral · cycles Betta 31–47</div>
    <h1>Machine d'édition Betta</h1>
    <div class="big"><b id="pct">–</b><span id="sum"></span></div>
    <div class="bar" id="bar" role="progressbar" aria-label="Leçons livrées"></div>
    <div class="legend">
      <span style="--c:var(--inj)">Injectée</span><span style="--c:var(--done)">Livrée (audit différé)</span>
      <span style="--c:var(--wip)">En rédaction</span><span style="--c:var(--todo)">À faire</span>
      <span style="--c:var(--n05)">N-05 Neurologie</span><span style="--c:var(--e06)">E-06 Endocrinologie</span>
      <span style="--c:var(--n07)">N-07 Néphrologie</span><span style="--c:var(--h08)">H-08 Hématologie</span>
    </div>
  </header>
  <section class="grid" id="grid" aria-label="Cycles"></section>
  <footer id="foot"></footer>
</div>
<div id="pop" hidden></div>
<script>
const D=/*DATA*/null;
const FC=f=>f.startsWith("N-05")?"var(--n05)":f.startsWith("E-06")?"var(--e06)":f.startsWith("N-07")?"var(--n07)":"var(--h08)";
const LAB={LIVRE:"livrée",INJECTE:"injectée",EN_COURS:"en cours",A_FAIRE:"à faire"};
const ok=s=>s==="LIVRE"||s==="INJECTE";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(d){
  const all=d.cycles.flatMap(c=>c.lecons), n=all.length, cnt=k=>all.filter(l=>l.etat===k).length;
  const inj=cnt("INJECTE"),liv=cnt("LIVRE"),wip=cnt("EN_COURS"),fait=inj+liv;
  const cDone=d.cycles.filter(c=>c.lecons.every(l=>ok(l.etat))).length;
  const cur=d.cycles.find(c=>!c.lecons.every(l=>ok(l.etat)));
  pct.textContent=Math.round(100*fait/n)+" %";
  sum.textContent=`${fait}/${n} leçons · ${cDone}/${d.cycles.length} cycles`+(cur?` · en cours : cycle ${cur.n}`:" · terminé");
  bar.innerHTML=[["inj",inj],["done",liv],["wip",wip]].map(([k,v])=>`<i style="width:${100*v/n}%;background:var(--${k})"></i>`).join("");
  bar.setAttribute("aria-valuenow",fait);bar.setAttribute("aria-valuemax",n);
  grid.innerHTML=d.cycles.map((c,i)=>{const f=c.lecons.filter(l=>ok(l.etat)).length;
    return `<div class="tile${cur&&c.n===cur.n?" cur":""}" tabindex="0" data-i="${i}">
      <div class="h"><b>C${c.n}</b><small>${f}/${c.lecons.length}</small></div>
      <div class="dots">${c.lecons.map(l=>`<i class="${l.etat}" style="--f:${FC(l.frag)}" title="${esc(l.code)}"></i>`).join("")}</div>
      <div class="mini"><i style="width:${100*f/c.lecons.length}%"></i></div>
      <p>${esc(c.nom)}</p></div>`}).join("");
  foot.textContent=`Instantané du ${d.maj} · branche ${d.branche} · audit différé, jamais déclaré réalisé.`;
  window._d=d;
}
function show(t){
  const c=_d.cycles[t.dataset.i], g={};
  c.lecons.forEach(l=>(g[l.frag]=g[l.frag]||[]).push(l));
  pop.innerHTML=`<h2>Cycle ${c.n} · ${esc(c.nom)}</h2>`+Object.entries(g).map(([f,ls])=>`<div class="fr" style="--f:${FC(f)}"><div>${esc(f)}</div>${ls.map(l=>`<div class="l"><code>${esc(l.code)}</code><span>${esc(l.titre)}</span><span class="s ${l.etat}">${LAB[l.etat]||l.etat}</span></div>`).join("")}</div>`).join("");
  pop.hidden=false;
  const r=t.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight,vw=innerWidth,vh=innerHeight;
  let x=Math.min(Math.max(16,r.left),vw-w-16), y=r.bottom+8;
  if(y+h>vh-8) y=Math.max(8,r.top-h-8);
  pop.style.left=x+"px";pop.style.top=y+"px";
  document.querySelectorAll(".tile.on").forEach(e=>e.classList.remove("on"));t.classList.add("on");
}
const hide=()=>{pop.hidden=true;document.querySelectorAll(".tile.on").forEach(e=>e.classList.remove("on"))};
grid.addEventListener("pointerover",e=>{const t=e.target.closest(".tile");if(t)show(t)});
grid.addEventListener("pointerleave",hide);
grid.addEventListener("focusin",e=>{const t=e.target.closest(".tile");if(t)show(t)});
grid.addEventListener("focusout",hide);
addEventListener("scroll",hide,{passive:true});
render(D);
/* Rafraîchissement direct (GitHub Pages, raw.githack) ; silencieux dans un bac à sable. */
fetch(`https://raw.githubusercontent.com/vialdjoukang-spec/Medina/${D.branche}/organisation/betta_status.json?t=${Date.now()}`)
 .then(r=>r.ok?r.json():Promise.reject()).then(s=>{
   const d=structuredClone(D);
   d.cycles.forEach(c=>c.lecons.forEach(l=>{let v=s.cycles?.[c.n]?.lessons?.[l.code];v=v&&typeof v==="object"?v.state:v;
     if(v&&!(v==="A_FAIRE"&&l.etat==="EN_COURS"))l.etat=v}));
   d.maj="direct "+new Date().toLocaleString("fr-CH");render(d)}).catch(()=>{});
</script>
