
<!-- ===== FENÊTRES : sténoses, J98 et J99 ===== -->
<template data-pop="j95-stenose" data-title="Sténose post-intubation">
<div class="lab">Mécanisme</div><p>Le débit sanguin de la muqueuse trachéale diminue lorsque la pression du ballonnet dépasse environ 30 cm H₂O (22 mmHg) et s’interrompt vers 45 cm H₂O (Seegobin et van Hasselt, British Medical Journal 1984). Un ballonnet surgonflé, ou une sonde trop grosse dans la sous-glotte, rend donc la muqueuse ischémique. La séquence est l’ischémie, l’ulcération, la chondrite, le tissu de granulation, puis la fibrose rétractile en trois à six semaines.</p>
<div class="lab">Localisations</div><p>Sous-glotte, au contact de la sonde dans l’anneau cricoïdien (J95.5). Trachée au niveau du ballonnet ou de l’orifice de trachéotomie (J95.81). La sténose de l’orifice de trachéotomie résulte souvent d’une fracture d’anneau ou d’une résection excessive de cartilage.</p>
<div class="lab">Prévention</div><p>Sonde de taille adaptée, pression du ballonnet entre 20 et 30 cm H₂O vérifiée au manomètre, fixation sans traction, durée d’intubation limitée. Une étude de 2024 suggère qu’une pression de 30 cm H₂O peut déjà léser la muqueuse en cas de ventilation prolongée ; la fourchette basse est donc préférable.</p>
<div class="lab">Piège</div><p>Le stridor tardif est pris pour un asthme. Un « asthme » apparu après un séjour en soins intensifs et résistant aux bronchodilatateurs impose une courbe débit-volume.</p></template>

<template data-pop="j95-myer" data-title="Classification de Myer et Cotton">
<div class="lab">Principe</div><p>Cette classification, publiée en 1994, grade la sténose sous-glottique selon le pourcentage d’obstruction de la lumière. Elle se mesure en endoscopie en cherchant la plus grosse sonde qui passe avec une fuite d’air, rapportée à la taille attendue pour l’âge.</p>
<div class="lab">Grades</div><p>Grade I : 0 à 50 %. Grade II : 51 à 70 %. Grade III : 71 à 99 %. Grade IV : aucune lumière détectable.</p>
<div class="lab">Usage</div><p>Le grade oriente le traitement : les grades I et II relèvent souvent de l’endoscopie, les grades III et IV plus souvent d’une chirurgie de reconstruction ou de résection. Il ne décrit ni la longueur ni l’atteinte du cartilage, qui comptent aussi.</p></template>

<template data-pop="j95-lbronch" data-title="Broncholithiase">
<div class="lab">Définition</div><p>Présence de matériel calcifié dans la lumière bronchique, le plus souvent un ganglion péribronchique calcifié qui a érodé la paroi.</p>
<div class="lab">Causes</div><p>Séquelles de granulomatoses infectieuses, histoplasmose dans les régions d’endémie et tuberculose ; plus rarement silicose.</p>
<div class="lab">Clinique</div><p>Toux, hémoptysies parfois abondantes, pneumonies récidivantes en aval, expectoration de petits calculs appelée lithoptysie.</p>
<div class="lab">Conduite</div><p>Tomodensitométrie, bronchoscopie ; extraction endoscopique seulement si le calcul est libre, car l’arrachement d’un calcul encore fixé peut déchirer une artère voisine. Sinon, chirurgie.</p></template>

<template data-pop="j95-tbm" data-title="Trachéobronchomalacie et collapsus dynamique expiratoire">
<div class="lab">Définitions</div><p>La trachéobronchomalacie est un ramollissement du cartilage qui laisse la paroi s’affaisser à l’expiration. Le collapsus dynamique excessif des voies aériennes est un bombement de la membrane postérieure dans la lumière, sans atteinte cartilagineuse. La CIM les range en J98.0 sous les termes de dyskinésie et de collapsus trachéobronchique.</p>
<div class="lab">Causes</div><p>Intubation ou trachéotomie prolongées, compression ancienne par un goitre ou un vaisseau, polychondrite atrophiante, BPCO, obésité.</p>
<div class="lab">Diagnostic</div><p>La tomodensitométrie en inspiration et en expiration forcée et la bronchoscopie dynamique montrent la réduction de calibre. Une réduction de plus de 50 % est le seuil classique, mais des sujets sains le dépassent en expiration forcée ; des seuils de 70 à 80 % sont proposés pour les formes significatives. Le diagnostic exige donc des symptômes compatibles.</p>
<div class="lab">Traitement</div><p>Traitement des facteurs associés, pression positive continue, essai temporaire de prothèse pour juger du bénéfice, puis trachéobronchoplastie chez des patients sélectionnés.</p></template>

<template data-pop="j95-lobmoyen" data-title="Syndrome du lobe moyen">
<div class="lab">Définition</div><p>Atélectasie récidivante ou chronique du lobe moyen, plus rarement de la lingula.</p>
<div class="lab">Pourquoi le lobe moyen</div><p>Sa bronche est longue, étroite et naît à angle aigu ; elle est entourée de ganglions. Le lobe moyen est séparé des autres lobes par des scissures complètes, ce qui limite la ventilation collatérale qui pourrait le réaérer.</p>
<div class="lab">Formes</div><p>Obstructive : tumeur, compression ganglionnaire, corps étranger, broncholithe. Non obstructive : inflammation, bronchectasies, asthme, infections récidivantes.</p>
<div class="lab">Conduite</div><p>Tomodensitométrie et bronchoscopie pour exclure une obstruction, surtout chez l’adulte fumeur.</p></template>

<template data-pop="j95-atelronde" data-title="Atélectasie ronde">
<div class="lab">Définition</div><p>Masse arrondie sous-pleurale faite de poumon replié au contact d’un épaississement pleural.</p>
<div class="lab">Contexte</div><p>Exposition à l’amiante dans la majorité des cas, épanchement pleural ancien, insuffisance cardiaque.</p>
<div class="lab">Imagerie</div><p>La tomodensitométrie montre une masse au contact d’une plèvre épaissie, avec des vaisseaux et des bronches qui s’y enroulent en « queue de comète », et une perte de volume du lobe.</p>
<div class="lab">Piège</div><p>Elle simule un cancer bronchique, qui partage le même facteur de risque. Un aspect atypique, une croissance ou une fixation en tomographie par émission de positons font discuter une biopsie.</p></template>

<template data-pop="j95-pneumomed" data-title="Pneumomédiastin spontané et effet Macklin">
<div class="lab">Mécanisme</div><p>Une augmentation brutale de la pression alvéolaire rompt des alvéoles périphériques. L’air dissèque les gaines bronchovasculaires vers le hile, puis gagne le médiastin et le cou : c’est l’effet décrit par Macklin en 1939.</p>
<div class="lab">Déclencheurs</div><p>Crise d’asthme, vomissements, toux violente, effort à glotte fermée, inhalation de cannabis ou de cocaïne, manœuvre de Valsalva.</p>
<div class="lab">Signes</div><p>Douleur rétrosternale, dysphagie, voix modifiée, crépitation sous-cutanée cervicale, signe de Hamman : crépitation synchrone des battements cardiaques à l’auscultation.</p>
<div class="lab">Conduite</div><p>Le pronostic est généralement bon, avec récupération en quelques jours sous repos et antalgiques. La perforation œsophagienne doit être exclue par tomodensitométrie, parfois avec opacification, si des vomissements précèdent la douleur ou si fièvre, épanchement ou signes de choc apparaissent.</p></template>

<template data-pop="j95-kystes" data-title="Maladies kystiques acquises du poumon">
<div class="lab">Lymphangioléiomyomatose</div><p>Prolifération de cellules musculaires lisses anormales chez la femme, sporadique ou associée à la sclérose tubéreuse de Bourneville. Kystes diffus à paroi fine, pneumothorax récidivants, chylothorax. Un taux sérique de VEGF-D d’au moins 800 pg/mL dans un contexte compatible soutient le diagnostic selon la recommandation ATS/JRS 2016. Le sirolimus stabilise la fonction respiratoire.</p>
<div class="lab">Syndrome de Birt, Hogg et Dubé</div><p>Maladie autosomique dominante due à des variants du gène FLCN. Kystes basaux sous-pleuraux, pneumothorax familiaux, tumeurs rénales et fibrofolliculomes cutanés. La surveillance rénale est essentielle.</p>
<div class="lab">Autres causes</div><p>Pneumopathie interstitielle lymphoïde du syndrome de Sjögren, histiocytose langerhansienne pulmonaire du fumeur, pneumatocèles post-infectieuses.</p>
<div class="lab">Codage</div><p>J98.4 pour la maladie kystique acquise. La microlithiase alvéolaire relève de J84.0.</p></template>

<template data-pop="j95-paraldiaph" data-title="Paralysie diaphragmatique">
<div class="lab">Physiologie</div><p>Le diaphragme est le principal muscle inspiratoire. Sa contraction abaisse les coupoles, crée une pression pleurale négative et pousse le contenu abdominal en avant : l’abdomen se soulève à l’inspiration.</p>
<div class="lab">Paralysie unilatérale</div><p>Souvent asymptomatique au repos ; dyspnée d’effort ou en décubitus chez un patient à réserve réduite. Coupole surélevée en radiographie. Causes : chirurgie cardiaque ou thoracique, bloc interscalénique, compression tumorale, amyotrophie névralgique, idiopathique.</p>
<div class="lab">Paralysie bilatérale</div><p>Orthopnée marquée, dyspnée en immersion jusqu’à la poitrine, respiration abdominale paradoxale en décubitus, hypoventilation nocturne puis hypercapnie. Causes : maladies neuromusculaires, lésion médullaire haute, myopathies.</p>
<div class="lab">Traitement</div><p>Unilatérale symptomatique et persistante : plicature diaphragmatique. Bilatérale avec hypoventilation : ventilation non invasive nocturne. Lésion médullaire haute avec nerfs phréniques intacts : stimulation phrénique dans des centres spécialisés.</p>
<div class="lab">Pronostic iatrogène</div><p>Après lésion phrénique chirurgicale ou bloc, la récupération est fréquente ; elle peut prendre un à deux ans après une lésion nerveuse.</p></template>

<template data-pop="j95-eventr" data-title="Éventration et relâchement diaphragmatique">
<div class="lab">Définition</div><p>Surélévation permanente d’une coupole dont le muscle est aminci, avec une continuité préservée, à la différence d’une hernie.</p>
<div class="lab">Distinction avec la paralysie</div><p>Dans l’éventration, la coupole amincie bouge encore dans le bon sens, avec une amplitude réduite. Dans la paralysie, elle est immobile ou paradoxale au test du reniflement.</p>
<div class="lab">Codage</div><p>Le relâchement acquis relève de J98.6 ; une malformation congénitale du diaphragme relève de Q79.1.</p></template>

<template data-pop="j95-pr" data-title="Polyarthrite rhumatoïde et poumon">
<div class="lab">Atteintes</div><p>Pneumopathie interstitielle, souvent de type commun, plus fréquente chez l’homme fumeur avec des anticorps à titre élevé. Bronchectasies et bronchiolites. Nodules rhumatoïdes, parfois excavés. Pleurésie exsudative avec glucose bas et facteur rhumatoïde élevé. Arthrite crico-aryténoïdienne, qui peut donner un stridor. Syndrome de Caplan : nodules multiples chez un rhumatoïde exposé aux poussières minérales.</p>
<div class="lab">Diagnostic différentiel</div><p>Pneumopathie au méthotrexate, qui survient surtout dans la première année de traitement, avec fièvre et dyspnée subaiguës ; infections opportunistes sous biothérapie ; tuberculose sous anti-TNF.</p>
<div class="lab">Conduite</div><p>Tomodensitométrie de haute résolution, fonction respiratoire avec DLCO, avis pneumologique et rhumatologique conjoint. Traitement selon le cours J84.</p></template>

<template data-pop="j95-connect" data-title="Atteintes pulmonaires des connectivites">
<div class="lab">Règle générale</div><p>Les connectivites atteignent tous les compartiments du poumon : interstitium, voies aériennes, plèvre, vaisseaux et muscles respiratoires. Le type d’atteinte oriente le diagnostic de la maladie.</p>
<div class="lab">Sclérodermie systémique</div><p>Pneumopathie interstitielle non spécifique fréquente, surtout avec les anticorps anti-topoisomérase I ; hypertension pulmonaire, surtout dans la forme cutanée limitée. Dépistage par fonction respiratoire avec DLCO, tomodensitométrie et échocardiographie.</p>
<div class="lab">Myopathies inflammatoires</div><p>Syndrome des antisynthétases : myosite, pneumopathie interstitielle, arthrite, mains de mécanicien, phénomène de Raynaud. Forme anti-MDA5 : pneumopathie rapidement progressive, parfois fatale, avec peu de myosite.</p>
<div class="lab">Lupus</div><p>Pleurésie la plus fréquente ; pneumopathie lupique aiguë ; hémorragie alvéolaire grave ; syndrome des poumons rétractés par dysfonction diaphragmatique.</p>
<div class="lab">Piège</div><p>Chez un patient immunosupprimé, une opacité nouvelle est une infection jusqu’à preuve du contraire.</p></template>

<template data-pop="j95-gpa" data-title="Granulomatose avec polyangéite : atteinte respiratoire">
<div class="lab">Atteintes</div><p>Nodules pulmonaires multiples, souvent excavés ; hémorragie alvéolaire par capillarite ; sténose sous-glottique et sténoses bronchiques ; atteinte destructrice du nez et des sinus.</p>
<div class="lab">Diagnostic</div><p>ANCA anti-protéinase 3 le plus souvent ; biopsie d’un organe accessible ; recherche d’une atteinte rénale par la créatinine et le sédiment urinaire.</p>
<div class="lab">Sténose sous-glottique</div><p>Elle peut évoluer indépendamment de l’activité générale et relever d’injections locales de corticostéroïde et de dilatations endoscopiques.</p>
<div class="lab">Conséquence pratique</div><p>Une hémoptysie avec anémie et opacités bilatérales chez un patient porteur d’ANCA est une urgence vitale ; le traitement relève du cours des vascularites.</p></template>

<template data-pop="j95-spa" data-title="Spondylarthrite axiale et thorax">
<div class="lab">Mécanisme</div><p>L’ankylose des articulations costovertébrales et costosternales fixe la cage thoracique. La respiration devient surtout diaphragmatique, ce qui préserve en général les échanges gazeux.</p>
<div class="lab">Atteintes</div><p>Restriction légère à modérée ; fibrose apicale bulleuse rare, qui peut se surinfecter par des mycobactéries ou des champignons ; anomalies interstitielles discrètes en tomodensitométrie.</p>
<div class="lab">Piège</div><p>La fibrose apicale avec cavités ressemble à une tuberculose ; les prélèvements mycobactériens sont nécessaires.</p></template>

<template data-pop="j95-gvh" data-title="Bronchiolite oblitérante de la maladie du greffon contre l’hôte">
<div class="lab">Définition</div><p>Atteinte pulmonaire de la maladie du greffon contre l’hôte chronique, avec fibrose obstructive des bronchioles.</p>
<div class="lab">Critères NIH 2014</div><p>1. Rapport VEMS/capacité vitale inférieur à 0,7 ou au cinquième percentile. 2. VEMS inférieur à 75 % de la valeur prédite avec un déclin d’au moins 10 % en moins de deux ans, non corrigé au-dessus de 75 % par un bronchodilatateur. 3. Absence d’infection respiratoire. 4. Piégeage d’air en tomodensitométrie expiratoire, épaississement des petites voies aériennes ou bronchectasies, ou volume résiduel supérieur à 120 % de la valeur prédite. Lorsqu’une autre manifestation de maladie du greffon chronique est présente, les trois premiers critères suffisent.</p>
<div class="lab">Score pulmonaire et codage</div><p>Score 1 : VEMS de 60 à 79 % (J99.21). Score 2 : 40 à 59 % (J99.22). Score 3 : 39 % ou moins (J99.23). Le code dague correspondant (T86.06 ou T86.07) se place en premier.</p>
<div class="lab">Limite</div><p>Les critères sont stricts : ils peuvent manquer des bronchiolites prouvées par biopsie. Le déclin du VEMS sur des mesures répétées reste le signal le plus précoce.</p></template>
