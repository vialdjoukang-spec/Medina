<!-- ===== FENÊTRES : définitions, mécanismes, étiologies et clinique ===== -->
<template data-pop="j67-fib" data-title="Pneumopathie d’hypersensibilité fibrosante ou non fibrosante">
<div class="lab">Définition</div><p>ATS/JRS/ALAT 2020 classe la maladie en non fibrosante (inflammation pure) ou fibrosante (fibrose pure ou mêlée d’inflammation), d’après l’imagerie ou l’histologie. En cas de lésions mixtes, la catégorie est fixée par les lésions prédominantes.</p>
<div class="lab">Pourquoi ce choix</div><p>La fibrose est le principal déterminant du pronostic. Les anciennes formes aiguë, subaiguë et chronique avaient des limites arbitraires et prédisaient mal l’évolution : des patients « aigus » progressaient, des patients « chroniques » guérissaient après éviction.</p>
<div class="lab">Conséquence clinique</div><p>Le phénotype non fibrosant laisse espérer une guérison après éviction ; le phénotype fibrosant impose de chercher une progression et d’évaluer un antifibrosant.</p>
<div class="lab">Limites</div><p>La frontière dépend de la lecture radiologique, dont la concordance entre lecteurs reste imparfaite. La S2k 2024 conserve la distinction aiguë ou chronique pour l’expertise professionnelle.</p>
<div class="lab">Source</div><p>Raghu G. et al., ATS/JRS/ALAT 2020, section « Classification » ; Koschel D. et al., S2k 2024, recommandation 1.</p></template>

<template data-pop="j67-reco" data-title="Trois recommandations : laquelle appliquer ?">
<div class="lab">Les textes en vigueur</div><p><b>ATS/JRS/ALAT 2020</b> (American Journal of Respiratory and Critical Care Medicine, 1er août 2020) : diagnostic chez l’adulte, six questions traitées selon la méthode GRADE, toutes avec une confiance très faible ; elle définit les catégories tomodensitométriques, histologiques et les niveaux de confiance. <b>CHEST 2021</b> (American College of Chest Physicians, Chest, août 2021) : quatorze énoncés sur le diagnostic, preuves toutes de très faible qualité ; elle insiste pour établir la confiance diagnostique par l’exposition et la tomodensitométrie avant le lavage ou la biopsie. <b>S2k 2024</b> (Société allemande de pneumologie et Société allemande d’allergologie, Pneumologie décembre 2024, version anglaise Respiration 2025) : douze recommandations de consensus, dont les premières recommandations de traitement.</p>
<div class="lab">Contentieux et choix retenu</div><p>Les trois textes convergent sur l’anamnèse d’exposition, la tomodensitométrie et la discussion multidisciplinaire. Ils divergent sur la place du lavage : ATS/JRS/ALAT le recommande dans la forme non fibrosante, CHEST le place après l’évaluation de l’exposition et de l’imagerie, la S2k l’exige chez tout patient suspect. Ils divergent aussi sur les IgG, suggérées par ATS/JRS/ALAT et exigées par la S2k. Conformément à la règle de la source primaire applicable la plus récente, ce cours retient la S2k 2024 pour le traitement, seul texte qui le couvre, et pour l’exigence des IgG et du lavage. Il conserve les catégories et les niveaux de confiance d’ATS/JRS/ALAT 2020, que la S2k intègre explicitement.</p>
<div class="lab">Applicabilité en Suisse</div><p>Aucune recommandation suisse propre n’a été retrouvée au 8 octobre 2026. La S2k émane d’un pays voisin au système de soins comparable et cite la reconnaissance par la Suva ; elle reste un consensus d’experts, non une recommandation fondée sur des essais. Le niveau de preuve est faible dans les trois textes.</p>
<div class="lab">Accès aux textes</div><p>ATS/JRS/ALAT 2020 : <a data-reference-source="1" href="https://doi.org/10.1164/rccm.202005-2032ST" target="_blank" rel="noopener noreferrer">doi:10.1164/rccm.202005-2032ST</a> (<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener noreferrer">texte intégral PubMed Central</a>). CHEST 2021 : <a data-reference-source="1" href="https://doi.org/10.1016/j.chest.2021.03.066." target="_blank" rel="noopener noreferrer">doi:10.1016/j.chest.2021.03.066.</a> S2k : <a data-reference-source="1" href="https://doi.org/10.1159/000543675" target="_blank" rel="noopener noreferrer">doi:10.1159/000543675</a> (<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener noreferrer">texte intégral PubMed Central</a>). Textes consultés le 8 octobre 2026 ; pour CHEST 2021, seul le résumé a été lu.</p></template>

<template data-pop="j67-tabac" data-title="Tabac et pneumopathie d’hypersensibilité">
<div class="lab">Constat</div><p>La maladie est plus fréquente chez les non-fumeurs que chez les fumeurs, à exposition comparable (S2k 2024).</p>
<div class="lab">Mécanisme proposé</div><p>La nicotine et d’autres composants de la fumée réduisent l’activation des macrophages alvéolaires et la prolifération lymphocytaire. La sensibilisation devient moins probable. Ce mécanisme est plausible mais n’est pas démontré chez l’homme.</p>
<div class="lab">Limite majeure</div><p>Chez le fumeur qui développe la maladie, le tabagisme est associé à une évolution plus insidieuse et à un pronostic plus mauvais (ATS/JRS/ALAT 2020). Le tabac augmente aussi le risque de BPCO, de cancer et d’emphysème.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin recommande l’arrêt du tabac à tout patient. Il ne déduit jamais d’un statut de fumeur que la maladie est exclue.</p></template>

<template data-pop="j67-actino" data-title="Actinomycètes thermophiles">
<div class="lab">Définition</div><p>Bactéries à Gram positif filamenteuses qui forment des spores et se multiplient à des températures de 40 à 60 °C. Les principales sont <i>Saccharopolyspora rectivirgula</i> et des espèces de <i>Thermoactinomyces</i> et de <i>Laceyella</i>.</p>
<div class="lab">Écologie</div><p>Un foin ou une paille rentrés humides fermentent et chauffent ; ces conditions sélectionnent les actinomycètes thermophiles. La bagasse moisie et le compost réunissent les mêmes conditions.</p>
<div class="lab">Conséquence clinique</div><p>Leurs spores d’environ 1 µm atteignent les alvéoles et sensibilisent le sujet prédisposé : elles causent le poumon de fermier et la bagassose. Le panel d’IgG du fermier doit les inclure.</p>
<div class="lab">Prévention</div><p>Le séchage du foin avant stockage et l’ensilage, dont l’acidité empêche leur croissance, réduisent l’exposition.</p></template>

<template data-pop="j67-ferm" data-title="Poumon de fermier (J67.0)">
<div class="lab">Source</div><p>Foin, paille et céréales stockés humides et moisis ; actinomycètes thermophiles et moisissures (<i>Aspergillus</i>, <i>Lichtheimia</i>, <i>Alternaria</i>).</p>
<div class="lab">Chronologie</div><p>Les symptômes surviennent en fin d’hiver et au printemps, lors de l’affouragement, surtout après un été pluvieux. La S2k signale une incidence plus élevée dans les régions à fortes précipitations au moment des récoltes.</p>
<div class="lab">Évolution</div><p>La forme non fibrosante peut guérir après éviction. Un emphysème peut s’associer, même chez le non-fumeur.</p>
<div class="lab">Fréquence</div><p>La prévalence varie de 0,25 à 10,4 % chez les travailleurs agricoles selon les études. Elle a diminué avec l’ensilage et la mécanisation.</p>
<div class="lab">Piège</div><p>Le syndrome toxique des poussières organiques survient chez des agriculteurs non sensibilisés après une exposition massive ; il guérit en 24 à 48 heures sans anomalie radiologique.</p></template>

<template data-pop="j67-ois" data-title="Poumon des éleveurs d’oiseaux et alvéolite du duvet (J67.2)">
<div class="lab">Source</div><p>Protéines des déjections, des plumes, du duvet et du sérum des oiseaux : pigeons, perruches, perroquets, poules, oiseaux sauvages. Le duvet situé sous les plumes de couverture produit une poussière fine particulièrement antigénique.</p>
<div class="lab">Forme domestique</div><p>Une couette ou un oreiller en duvet d’oie ou de canard, surtout artisanal, peut suffire. Dans une série espagnole de 127 patients, le duvet était en cause chez 26 % d’entre eux. Une exposition indirecte, par un voisin ou par les vêtements d’un proche, est possible.</p>
<div class="lab">Persistance</div><p>Les antigènes aviaires restent détectables jusqu’à 18 mois dans la poussière après le départ des oiseaux. La quantité résiduelle d’antigène influence l’évolution.</p>
<div class="lab">Conduite</div><p>Le médecin fait retirer les oiseaux et toute literie ou vêtement en plumes, puis fait nettoyer le logement. Les IgG anti-plumes d’oie et de canard aident à distinguer l’alvéolite du duvet.</p></template>

<template data-pop="j67-humid" data-title="Poumon des humidificateurs et des fontaines (J67.7)">
<div class="lab">Source</div><p>Eau stagnante d’humidificateurs, de climatiseurs et de fontaines d’intérieur à brumisation ultrasonique, colonisée par des actinomycètes, des moisissures ou des bactéries. Les aérosols fins atteignent les alvéoles.</p>
<div class="lab">Évolution épidémiologique</div><p>D’abord professionnelle (menuiseries, reliures, imprimeries), la maladie a reculé grâce aux mesures d’hygiène. Les fontaines de salon ou de cabinet médical ont créé une forme domestique récente.</p>
<div class="lab">Conduite</div><p>Le médecin demande si un appareil a été acquis peu avant les symptômes, fait retirer ou assainir l’appareil et cherche des IgG contre les germes prélevés dans l’eau.</p>
<div class="lab">Piège</div><p>La « fièvre des humidificateurs » est une réaction toxique fébrile sans sensibilisation, proche du syndrome toxique des poussières organiques.</p></template>

<template data-pop="j67-mwf" data-title="Poumon des opérateurs de machines">
<div class="lab">Source</div><p>Fluides d’usinage aqueux utilisés pour refroidir et lubrifier le métal, contaminés par <i>Mycobacterium immunogenum</i>, d’autres mycobactéries non tuberculeuses, des pseudomonas ou des moisissures. L’usinage les transforme en aérosol.</p>
<div class="lab">Importance</div><p>Dans un registre britannique, l’exposition professionnelle expliquait 50 cas sur 206 ; les fluides d’usinage étaient la cause définie la plus fréquente (36 des 50 cas professionnels).</p>
<div class="lab">Diagnostic</div><p>Le panel d’IgG doit comporter au moins un antigène de pseudomonas et <i>Mycobacterium immunogenum</i>, selon la S2k 2024.</p>
<div class="lab">Codage</div><p>Aucun sous-code ne nomme cette forme ; elle se range parmi les alvéolites dues à d’autres poussières organiques (J67.8), par convention de codage.</p></template>

<template data-pop="j67-hottub" data-title="Poumon du bain à remous">
<div class="lab">Source</div><p>Complexe <i>Mycobacterium avium</i> dans l’eau chaude aérosolisée des bains à remous, plus rarement des douches ou piscines privées.</p>
<div class="lab">Particularité</div><p>La maladie mêle une réaction d’hypersensibilité et une colonisation : la mycobactérie peut être cultivée dans les expectorations, le lavage ou la biopsie. L’histologie diffère de la forme classique, ce qui l’exclut des critères histologiques de 2020.</p>
<div class="lab">Traitement</div><p>L’arrêt de l’exposition, avec ou sans corticostéroïde, suffit souvent sans traitement antimycobactérien.</p></template>

<template data-pop="j67-quest" data-title="Questionnaire d’exposition">
<div class="lab">Contenu</div><p>Liste structurée des expositions professionnelles, domestiques et de loisirs : oiseaux, plumes, moisissures visibles, dégâts d’eau, humidificateurs, fontaines, bains à remous, instruments à vent, foin, compost, bois, fluides d’usinage.</p>
<div class="lab">Valeur</div><p>Dans un registre indien, un questionnaire structuré a retrouvé une exposition chez 75 % des patients atteints. Un questionnaire de 22 items a aidé à identifier la source dans une petite série.</p>
<div class="lab">Limites</div><p>Aucun questionnaire n’est validé de manière standardisée. ATS/JRS/ALAT 2020 n’émet pas de recommandation à son sujet ; la S2k 2024 en recommande l’usage en complément de l’anamnèse.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin remet le questionnaire avant la consultation spécialisée, puis reprend chaque réponse positive à l’oral.</p></template>

<template data-pop="j67-48h" data-title="Symptômes 4 à 8 heures après l’exposition">
<div class="lab">Mécanisme</div><p>Les complexes immuns antigène-IgG se forment dans l’interstitium, activent le complément et recrutent des polynucléaires. Ce processus demande quelques heures, d’où le délai, à la différence de la réaction à IgE de l’asthme allergique qui débute en minutes.</p>
<div class="lab">Valeur</div><p>Le délai de 4 à 8 heures fait partie des six prédicteurs cliniques de Lacasse et collaborateurs (2003).</p>
<div class="lab">Limite</div><p>Ce délai manque souvent dans la forme fibrosante, où l’exposition est faible et continue.</p></template>

<template data-pop="j67-odts" data-title="Syndrome toxique des poussières organiques">
<div class="lab">Définition</div><p>Réaction fébrile non infectieuse et non allergique, 3 à 12 heures après l’inhalation massive de poussières organiques contaminées par des endotoxines ou des mycotoxines.</p>
<div class="lab">Clinique</div><p>Fièvre, frissons, toux, dyspnée modérée, céphalées et malaise. On l’appelle aussi fièvre des batteurs chez l’agriculteur et fièvre des humidificateurs.</p>
<div class="lab">Différence avec la pneumopathie d’hypersensibilité</div><p>Il ne demande aucune sensibilisation préalable et peut toucher plusieurs personnes exposées en même temps. Il n’y a pas d’IgG spécifiques élevées, pas d’atteinte fonctionnelle durable et pas d’anomalie radiologique ; la guérison survient en 24 à 48 heures.</p>
<div class="lab">Conduite</div><p>Le traitement est symptomatique ; la prévention repose sur la réduction de l’empoussièrement et la protection respiratoire lors des tâches à risque.</p></template>

<template data-pop="j67-crep" data-title="Râles crépitants fins">
<div class="lab">Technique</div><p>Le médecin ausculte les bases et les régions axillaires pendant une inspiration profonde, patient assis, bouche ouverte.</p>
<div class="lab">Mécanisme</div><p>Les petites voies aériennes et alvéoles fermées à l’expiration s’ouvrent brusquement en fin d’inspiration et produisent des bruits brefs et secs.</p>
<div class="lab">Valeur</div><p>Les crépitants inspiratoires figurent parmi les six prédicteurs de Lacasse. Ils sont présents dans les deux phénotypes.</p>
<div class="lab">Piège</div><p>Ils manquent entre deux expositions dans la forme non fibrosante, et ils ne distinguent pas la pneumopathie d’hypersensibilité d’une autre fibrose.</p></template>

<template data-pop="j67-squawk" data-title="Couinements inspiratoires">
<div class="lab">Définition</div><p>Bruits musicaux brefs entendus en milieu ou en fin d’inspiration, appelés aussi « squawks » ou « squeaks ».</p>
<div class="lab">Mécanisme</div><p>Une petite voie aérienne rétrécie par l’inflammation s’ouvre et fait vibrer sa paroi.</p>
<div class="lab">Valeur</div><p>ATS/JRS/ALAT 2020 les cite parmi les signes communs et comme prédicteur d’utilité limitée. Ils s’observent aussi dans d’autres atteintes bronchiolaires et dans certaines pneumopathies interstitielles.</p></template>

<template data-pop="j67-hippo" data-title="Hippocratisme digital">
<div class="lab">Examen</div><p>Le médecin cherche la perte de l’angle entre l’ongle et le repli unguéal, et le signe de Schamroth : la disparition de la fenêtre losangique entre deux ongles accolés dos à dos.</p>
<div class="lab">Signification</div><p>Dans une pneumopathie interstitielle, il oriente vers une forme fibrosante ancienne. Il est moins fréquent dans la pneumopathie d’hypersensibilité que dans la fibrose pulmonaire idiopathique.</p>
<div class="lab">Piège</div><p>Un hippocratisme d’apparition récente impose de chercher un cancer bronchique.</p></template>

<template data-pop="j67-exa" data-title="Exacerbation aiguë de la forme fibrosante">
<div class="lab">Définition</div><p>Aggravation respiratoire en moins d’un mois avec opacités nouvelles en verre dépoli ou condensations sur une fibrose connue, non expliquée par une insuffisance cardiaque ou une surcharge.</p>
<div class="lab">Fréquence et pronostic</div><p>Dans une cohorte japonaise citée par la S2k, 3 % des patients à un an et 10 % à trois ans ; la mortalité est élevée.</p>
<div class="lab">Conduite</div><p>Hospitalisation, oxygène, recherche d’infection et d’embolie pulmonaire, recherche d’une réexposition. Les corticostéroïdes à forte dose sont d’usage courant, sans preuve contrôlée dans cette indication.</p>
<div class="lab">Codage</div><p>Le cinquième caractère 1 de la catégorie J67 signale l’exacerbation aiguë.</p></template>

<template data-pop="j67-htp" data-title="Hypertension pulmonaire associée">
<div class="lab">Mécanisme</div><p>L’hypoxie alvéolaire contracte les artérioles pulmonaires, et la fibrose détruit le lit capillaire ; les résistances vasculaires augmentent.</p>
<div class="lab">Dépistage</div><p>Le médecin y pense devant une dyspnée ou une désaturation disproportionnées par rapport à la fonction respiratoire, une DLCO très basse, une syncope d’effort ou des signes droits. L’échocardiographie est l’examen de dépistage ; le cathétérisme droit confirme. Une artère pulmonaire dilatée en tomodensitométrie est un signe indirect.</p>
<div class="lab">Pronostic</div><p>Sa présence est associée à une survie nettement réduite.</p>
<div class="lab">Renvoi</div><p>Le traitement relève du cours I27 — Hypertension pulmonaire (P-02-Pneumologie).</p></template>

<template data-pop="j67-ffp" data-title="Protection respiratoire individuelle">
<div class="lab">Moyens</div><p>Masque filtrant de classe FFP2 ou FFP3 bien ajusté, ou appareil filtrant à ventilation assistée avec cagoule, qui reste efficace avec une barbe et fatigue moins.</p>
<div class="lab">Valeur</div><p>La protection réduit l’inhalation de particules de 1 à 5 µm. La S2k 2024 la considère comme une mesure de prévention secondaire qui ne remplace en aucun cas l’éviction.</p>
<div class="lab">Hiérarchie</div><p>La substitution (ensilage au lieu de foin), les mesures techniques (aspiration) et l’organisation du travail priment sur la protection individuelle.</p>
<div class="lab">Piège</div><p>Un masque chirurgical ne protège pas contre les spores.</p></template>

<template data-pop="j67-fpp" data-title="Fibrose pulmonaire progressive (ATS/ERS/JRS/ALAT 2022)">
<div class="lab">Définition</div><p>Chez un patient atteint d’une pneumopathie interstitielle fibrosante autre que la fibrose pulmonaire idiopathique, au moins deux des trois critères suivants au cours de l’année précédente, sans autre explication : aggravation des symptômes ; progression fonctionnelle (baisse absolue de la CVF d’au moins 5 % de la valeur prédite, ou de la DLCO d’au moins 10 %) ; progression radiologique de la fibrose.</p>
<div class="lab">Conséquence</div><p>Ce comportement progressif fait discuter le nintédanib, autorisé en Suisse pour les pneumopathies interstitielles fibrosantes chroniques avec phénotype progressif.</p>
<div class="lab">Limite</div><p>Les critères d’inclusion de l’essai INBUILD (2019) étaient différents ; les deux définitions ne se superposent pas exactement.</p></template>

<template data-pop="j67-tx" data-title="Évaluation de transplantation pulmonaire">
<div class="lab">Quand adresser</div><p>La S2k 2024 recommande une évaluation précoce chez le patient atteint de forme fibrosante progressive malgré le traitement.</p>
<div class="lab">Résultats</div><p>La survie après transplantation était meilleure que dans la fibrose pulmonaire idiopathique (rapport de risque 0,25 dans une étude citée par la S2k).</p>
<div class="lab">Piège</div><p>La maladie peut récidiver dans le greffon si l’exposition persiste ; l’éviction reste obligatoire après greffe.</p></template>
