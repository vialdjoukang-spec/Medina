<!-- ===== FENÊTRES : médicaments et droit des assurances ===== -->
<template data-pop="j67-d-pred" data-title="Prednisone">
<div class="lab">Mécanisme</div><p>Le glucocorticoïde se lie à son récepteur intracellulaire et réprime la transcription des cytokines inflammatoires ; il réduit le recrutement des lymphocytes et la formation des granulomes.</p>
<div class="lab">Preuves</div><p>Essai randomisé de Kokkarinen (1992), 36 patients atteints de poumon de fermier : prednisolone 8 semaines contre placebo ; DLCO meilleure à un mois, aucune différence de fonction à cinq ans. Dans la forme chronique, seules des études rétrospectives existent.</p>
<div class="lab">Statut suisse</div><p>L’information professionnelle de Prednisone Axapharm (mars 2026) ne nomme pas la pneumopathie d’hypersensibilité ; elle couvre notamment les états allergiques graves et la sarcoïdose symptomatique. L’emploi suit la S2k 2024.</p>
<div class="lab">Posologie</div><p>Forme non fibrosante : 0,5 mg/kg par jour ou 40 mg par jour, puis décroissance sur 2 à 3 mois. Forme fibrosante inflammatoire : au maximum 0,5 mg/kg par jour, réévaluation à 4–6 semaines, puis moins de 10 mg par jour pendant au moins 6 mois si réponse. Comprimés de 5, 20 et 50 mg.</p>
<div class="lab">Effets indésirables</div><p>Hyperglycémie, hypertension, prise de poids, troubles de l’humeur, ostéoporose, myopathie, cataracte, infections, insuffisance surrénalienne à l’arrêt brutal d’un traitement de plus de 8 à 10 jours.</p>
<div class="lab">Grossesse et allaitement</div><p>À éviter, surtout au premier trimestre, sauf nécessité claire ; la prednisone est alors préférée car son passage placentaire est le plus faible. Allaitement déconseillé pendant une corticothérapie systémique.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Prednisone Axapharm cpr 20 mg, mise à jour mars 2026, consultée le 08.10.2026 ; S2k 2024.</p></template>

<template data-pop="j67-d-mmf" data-title="Mycophénolate mofétil (hors indication)">
<div class="lab">Mécanisme</div><p>L’acide mycophénolique inhibe l’inosine monophosphate déshydrogénase, enzyme de la synthèse des purines indispensable aux lymphocytes ; il réduit leur prolifération.</p>
<div class="lab">Preuves</div><p>Cohorte rétrospective de Morisset et collaborateurs (2017) : 70 patients atteints de forme chronique, dont 51 sous mycophénolate ; gain de DLCO de 4,2 % de la valeur prédite à un an sous mycophénolate ou azathioprine, sans gain significatif de CVF.</p>
<div class="lab">Statut suisse</div><p>Autorisé pour la prévention du rejet de greffe (CellCept, septembre 2025) ; usage hors indication dans la pneumopathie d’hypersensibilité, décidé en centre.</p>
<div class="lab">Posologie de référence</div><p>L’information professionnelle prévoit 2 g par jour après greffe rénale et 3 g par jour après greffe cardiaque ou hépatique ; aucune dose n’est fixée pour la pneumopathie d’hypersensibilité.</p>
<div class="lab">Contre-indications</div><p>Grossesse, allaitement, femme en âge de procréer sans contraception hautement efficace.</p>
<div class="lab">Surveillance</div><p>Formule sanguine, troubles digestifs, infections.</p></template>

<template data-pop="j67-d-aza" data-title="Azathioprine (hors indication)">
<div class="lab">Mécanisme</div><p>Promédicament de la 6-mercaptopurine, qui s’incorpore aux acides nucléiques et freine la prolifération des lymphocytes.</p>
<div class="lab">Statut suisse</div><p>Imurek (avril 2026) est autorisé en transplantation et dans plusieurs maladies auto-immunes ; la pneumopathie d’hypersensibilité n’en fait pas partie.</p>
<div class="lab">Posologie</div><p>Pour les « autres affections », 1 à 3 mg/kg par jour, puis réduction par paliers de 0,5 mg/kg jusqu’à la dose minimale efficace ; réévaluation si aucune amélioration en 3 mois.</p>
<div class="lab">Pharmacogénétique</div><p>Un déficit en thiopurine méthyltransférase ou un variant de NUDT15 expose à une aplasie médullaire rapide ; un génotypage est à envisager avant le début.</p>
<div class="lab">Interactions</div><p>Avec l’allopurinol, la dose d’azathioprine se réduit au quart ; des décès ont été rapportés. Le fébuxostat n’est pas recommandé.</p>
<div class="lab">Contraception</div><p>Méthode efficace pour l’homme et la femme pendant le traitement et 3 à 6 mois après.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Imurek cpr pell 50 mg, mise à jour avril 2026, consultée le 08.10.2026.</p></template>

<template data-pop="j67-d-nint" data-title="Nintédanib (Ofev)">
<div class="lab">Mécanisme</div><p>Inhibiteur intracellulaire des récepteurs à activité tyrosine kinase du facteur de croissance dérivé des plaquettes, du facteur de croissance des fibroblastes et du facteur de croissance de l’endothélium vasculaire ; il réduit la prolifération et la migration des fibroblastes.</p>
<div class="lab">Indications suisses</div><p>Chez l’adulte : fibrose pulmonaire idiopathique ; pneumopathies interstitielles fibrosantes chroniques avec phénotype progressif ; pneumopathie interstitielle de la sclérodermie systémique.</p>
<div class="lab">Preuves</div><p>Essai INBUILD : 663 patients, dont 26 % de pneumopathies d’hypersensibilité ; déclin annuel de la CVF de 80,8 mL sous nintédanib contre 187,8 mL sous placebo dans la population globale.</p>
<div class="lab">Posologie</div><p>150 mg deux fois par jour à environ 12 heures d’intervalle, avec un repas ; maximum 300 mg par jour. Réduction à 100 mg deux fois par jour en cas d’effet indésirable ou de Child-Pugh A ; arrêt si cette dose est mal tolérée. Non recommandé en Child-Pugh B ou C ; non étudié sous une clairance de 30 mL/min.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée (66,9 % contre 23,9 % sous placebo dans INBUILD), nausées, vomissements, perte d’appétit, élévation des transaminases, saignements, atteintes rénales, rares perforations digestives.</p>
<div class="lab">Contre-indications</div><p>Grossesse ; hypersensibilité au nintédanib, à l’arachide ou au soja. Test de grossesse avant le début, contraception très efficace jusqu’à 3 mois après la dernière dose ; allaitement interrompu.</p>
<div class="lab">Surveillance</div><p>Transaminases et bilirubine ; arrêt définitif au-delà de 5 fois la limite supérieure de la normale, ou de 3 fois avec signes d’atteinte hépatique sévère.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Ofev caps moll 150 mg, mise à jour mars 2025, consultée le 08.10.2026.</p></template>

<template data-pop="j67-d-pirf" data-title="Pirfénidone (hors indication)">
<div class="lab">Mécanisme</div><p>Mécanisme exact inconnu ; effets antifibrosants et anti-inflammatoires dans les modèles expérimentaux.</p>
<div class="lab">Statut suisse</div><p>Esbriet (août 2022) est autorisé dans la seule fibrose pulmonaire idiopathique de l’adulte. La S2k 2024 propose la pirfénidone hors indication si le nintédanib est inefficace ou mal toléré dans une forme fibrosante progressive.</p>
<div class="lab">Preuves</div><p>Dans un essai de pneumopathies fibrosantes progressives où les pneumopathies d’hypersensibilité représentaient 45 % des patients, la pirfénidone retardait la progression, selon la S2k ; d’autres études vont dans le même sens.</p>
<div class="lab">Posologie</div><p>267 mg trois fois par jour les jours 1 à 7, 534 mg trois fois par jour les jours 8 à 14, puis 801 mg trois fois par jour avec les repas (2 403 mg par jour).</p>
<div class="lab">Interactions</div><p>Contre-indiquée avec la fluvoxamine ; prudence avec les inhibiteurs du CYP1A2.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Esbriet cpr pell 801 mg, mise à jour août 2022, consultée le 08.10.2026.</p></template>

<template data-pop="j67-d-bd" data-title="Bronchodilatateurs dans la byssinose">
<div class="lab">Rôle</div><p>Les bêta-2 agonistes et les antimuscariniques soulagent l’oppression et la dyspnée en relâchant le muscle lisse bronchique. Une prise de salbutamol avant le poste atténue la chute du VEMS observée au cours du poste.</p>
<div class="lab">Limite</div><p>Ils ne traitent pas la cause et masquent l’atteinte : la réduction de l’exposition reste la mesure principale.</p>
<div class="lab">Doses</div><p>Les molécules, formes et doses suisses sont présentées dans les cours J44 — Bronchopneumopathie chronique obstructive et J45 — Asthme (P-02-Pneumologie).</p></template>

<template data-pop="j67-suva" data-title="Maladie professionnelle : rôle du médecin">
<div class="lab">Base légale</div><p>Article 9 de la LAA : alinéa 1, maladies dues exclusivement ou de manière prépondérante à des substances ou travaux listés ; alinéa 2, autres maladies causées exclusivement ou de manière nettement prépondérante par le travail. L’annexe 1 de l’OLAA, chiffre 2, vise les affections de l’appareil respiratoire dues aux poussières de coton, de chanvre, de lin, de céréales et de leurs farines, d’enzymes, de moisissures et d’autres poussières organiques.</p>
<div class="lab">Rôle du médecin</div><p>Il évoque l’origine professionnelle, documente l’exposition, la chronologie et les examens, informe le patient qu’il doit annoncer la maladie à son employeur, qui la transmet à l’assureur-accidents, et répond aux demandes de rapport médical. La Suva et les autres assureurs LAA instruisent le cas.</p>
<div class="lab">Couverture</div><p>Salariés : assurance obligatoire. Indépendants et membres de leur famille collaborant à l’entreprise : seulement s’ils ont conclu l’assurance facultative (article 4 de la LAA).</p>
<div class="lab">Date déterminante</div><p>La maladie professionnelle est réputée déclarée dès que le patient doit se soumettre pour la première fois à un traitement médical ou est incapable de travailler (article 9, alinéa 3).</p>
<div class="lab">Source</div><p>LAA (RS 832.20) et OLAA (RS 832.202), versions en vigueur au 1er janvier 2026, fedlex.admin.ch, consultées le 08.10.2026.</p></template>

<template data-pop="j67-inapt" data-title="Exclusion d’un travail dangereux">
<div class="lab">Base légale</div><p>Selon l’article 84, alinéa 2, de la LAA, les organes d’exécution peuvent exclure d’un travail qui les mettrait en danger les assurés particulièrement exposés aux maladies professionnelles. Le Conseil fédéral règle les indemnités pour les assurés qui subissent un préjudice considérable.</p>
<div class="lab">Portée clinique</div><p>Chez un salarié atteint de pneumopathie d’hypersensibilité sensibilisé à un antigène professionnel, l’exclusion réalise l’éviction. Elle peut toutefois imposer un changement d’activité.</p>
<div class="lab">Conduite</div><p>Le médecin explique au patient les conséquences médicales d’une poursuite de l’exposition et l’oriente vers l’assureur pour l’instruction ; il ne décide pas lui-même de l’exclusion.</p></template>
