<!-- ===== FENÊTRES : examens, diagnostic et voies aériennes ===== -->
<template data-pop="j67-conf" data-title="Niveaux de confiance diagnostique (ATS/JRS/ALAT 2020)">
<div class="lab">Échelle</div><p>Diagnostic définitif : au moins 90 % de confiance. Confiance élevée : 80 à 89 %. Confiance modérée : 70 à 79 %. Confiance faible : 51 à 69 %. En dessous, la pneumopathie d’hypersensibilité n’est pas retenue.</p>
<div class="lab">Combinaison de référence</div><p>Exposition identifiée, aspect typique en tomodensitométrie et lymphocytose du lavage donnent une confiance élevée sans autre examen.</p>
<div class="lab">Pourquoi une échelle</div><p>Aucun examen n’est suffisant seul. Exprimer une probabilité permet de traiter quand le risque d’erreur est acceptable et de chercher une biopsie quand il ne l’est pas.</p>
<div class="lab">Limites</div><p>Les combinaisons ont été fixées par consensus d’experts et n’ont pas été validées prospectivement. Une confiance faible peut suffire si d’autres examens ne changeraient pas la conduite, si la biopsie est trop risquée ou si le patient la refuse.</p></template>

<template data-pop="j67-tdm" data-title="Tomodensitométrie à haute résolution">
<div class="lab">Technique</div><p>Acquisition volumique en coupes fines, sans injection, en décubitus dorsal en inspiration profonde, puis série après expiration prolongée. Dose réduite de 1 à 3 mSv ; l’ultra-basse dose de moins de 1 mSv est fortement déconseillée.</p>
<div class="lab">Pourquoi l’expiration</div><p>Seule l’expiration montre le piégeage aérique, signe clé des petites voies aériennes.</p>
<div class="lab">Lecture</div><p>Le radiologue thoracique décide s’il existe une fibrose, cherche les signes d’infiltration et des petites voies aériennes, puis classe l’aspect en typique, compatible ou indéterminé.</p>
<div class="lab">Erreur fréquente</div><p>Un angioscanner pour embolie ne remplace pas cet examen, faute de série en expiration et à cause de l’injection.</p></template>

<template data-pop="j67-nodcl" data-title="Nodules centrolobulaires flous">
<div class="lab">Définition</div><p>Petites opacités de moins de 5 mm, mal limitées, situées au centre des lobules secondaires, à quelques millimètres de la plèvre et des septums, sans contact avec eux.</p>
<div class="lab">Cause</div><p>Ils traduisent l’infiltrat inflammatoire et les granulomes autour de la bronchiole terminale.</p>
<div class="lab">Diagnostic différentiel</div><p>Bronchiolite respiratoire du fumeur, infections bronchiolaires, aspiration. Les nodules périlymphatiques de la sarcoïdose, au contraire, touchent la plèvre et les septums.</p></template>

<template data-pop="j67-3d" data-title="Motif à trois densités">
<div class="lab">Définition</div><p>Coexistence, en inspiration, de trois densités nettement délimitées : verre dépoli, poumon normal et lobules clairs à vascularisation réduite. Le terme remplace le « signe du fromage de tête ».</p>
<div class="lab">Mécanisme</div><p>Le verre dépoli traduit l’infiltration alvéolaire, les lobules clairs l’obstruction bronchiolaire avec vasoconstriction hypoxique.</p>
<div class="lab">Valeur</div><p>Très spécifique de la forme fibrosante (plus de 90 % selon la S2k), mais présent chez moins de la moitié des patients. Il distingue la forme fibrosante de la fibrose pulmonaire idiopathique. Il s’observe aussi dans la sarcoïdose et la pneumopathie interstitielle desquamative.</p></template>

<template data-pop="j67-piege" data-title="Piégeage aérique">
<div class="lab">Définition</div><p>Rétention anormale d’air en aval d’une petite voie aérienne obstruée. Le terme ne s’emploie que pour la série en expiration.</p>
<div class="lab">Aspect</div><p>Zones hypodenses qui ne gagnent pas de densité et ne perdent pas de volume en expiration, au milieu d’un poumon normal devenu plus dense.</p>
<div class="lab">Valeur</div><p>Atteinte de plus de trois lobes ou de plus de 5 % du parenchyme : la probabilité d’une forme fibrosante augmente (S2k). Un piégeage isolé peut être la seule anomalie.</p>
<div class="lab">Piège</div><p>Dans une zone de fibrose, la distorsion crée un piégeage secondaire ; le signe n’oriente vers une atteinte bronchiolaire primitive qu’en dehors de la fibrose. Il existe aussi dans les connectivites et la sarcoïdose.</p></template>

<template data-pop="j67-efr" data-title="Épreuves fonctionnelles respiratoires">
<div class="lab">Spirométrie</div><p>Elle mesure le VEMS et la CVF. Le rapport VEMS/CVF normal ou élevé avec une CVF basse évoque une restriction, à confirmer par la mesure de la CPT en pléthysmographie.</p>
<div class="lab">Capacité de diffusion</div><p>La DLCO mesure le passage du monoxyde de carbone de l’alvéole au sang. Elle baisse quand la membrane s’épaissit ou que la surface d’échange diminue.</p>
<div class="lab">Interprétation</div><p>Une valeur est anormale lorsqu’elle se situe sous la limite inférieure de la normale de la population de référence. Le suivi s’intéresse surtout aux variations absolues en pourcentage de la valeur prédite.</p>
<div class="lab">Valeur pronostique</div><p>Une DLCO inférieure à 50 % de la valeur prédite et une baisse de la CVF d’au moins 10 % en 6 à 12 mois sont associées à une mortalité accrue.</p></template>

<template data-pop="j67-6mn" data-title="Test de marche de six minutes">
<div class="lab">Technique</div><p>Le patient marche le plus loin possible pendant six minutes dans un couloir de 30 m ; l’oxymètre mesure la saturation en continu.</p>
<div class="lab">Valeur</div><p>Une désaturation à l’effort révèle un trouble de la diffusion masqué au repos. La saturation à l’effort est un facteur pronostique indépendant dans la forme chronique.</p>
<div class="lab">Piège</div><p>Un mauvais signal de l’oxymètre au doigt froid donne de fausses désaturations ; un capteur frontal peut être préféré.</p></template>

<template data-pop="j67-igg" data-title="IgG spécifiques (précipitines)">
<div class="lab">Méthodes</div><p>Précipitation en gel (double diffusion, immunoélectrophorèse, électrosynérèse) ou méthode immuno-enzymatique. Les deux ont des performances voisines.</p>
<div class="lab">Ce qu’elles prouvent</div><p>Une exposition et une sensibilisation à un moment de la vie. Une majorité des exposés porteurs d’IgG ne sont pas malades.</p>
<div class="lab">Choix du panel</div><p>Selon la source suspecte, ou panel courant (antigènes aviaires dont plumes d’oie, moisissures, actinomycètes thermophiles). Pour un antigène absent des panels, un prélèvement de poussière sur le lieu d’exposition peut être analysé.</p>
<div class="lab">Recommandations</div><p>ATS/JRS/ALAT 2020 les suggère (confiance très faible). La S2k 2024 les exige chez tout patient porteur d’une pneumopathie interstitielle nouvelle suspecte, avec une méthode dotée de seuils publiés.</p>
<div class="lab">Piège</div><p>Un résultat négatif n’exclut pas la maladie si l’antigène réel manque du panel.</p></template>

<template data-pop="j67-lba" data-title="Lavage bronchoalvéolaire">
<div class="lab">Technique</div><p>Au cours d’une bronchoscopie, le médecin instille du sérum physiologique dans un segment, puis l’aspire. Le laboratoire compte les cellules et cultive le liquide.</p>
<div class="lab">Valeurs</div><p>Sujet sain non fumeur : environ 10 à 15 % de lymphocytes. Pneumopathie d’hypersensibilité : souvent plus de 50 %, moins dans la forme fibrosante. Seuil jugé raisonnable par ATS/JRS/ALAT 2020 : 30 %.</p>
<div class="lab">Performance</div><p>Pour distinguer une forme fibrosante d’une fibrose pulmonaire idiopathique : seuil de 20 % (sensibilité 69 %, spécificité 61 %), 30 % (55 % et 80 %), 40 % (41 % et 93 %).</p>
<div class="lab">Autre rôle</div><p>Exclure une infection, en particulier une tuberculose ou une pneumocystose.</p>
<div class="lab">Piège</div><p>Le rapport CD4/CD8 ne sert pas au diagnostic (S2k, recommandation 5). L’absence de lymphocytose rend une forme aiguë très improbable mais n’exclut pas une forme fibrosante.</p></template>

<template data-pop="j67-cryo" data-title="Biopsies pulmonaires">
<div class="lab">Options</div><p>Biopsie transbronchique à la pince, cryobiopsie transbronchique, biopsie chirurgicale par thoracoscopie.</p>
<div class="lab">Choix</div><p>Forme non fibrosante : pince ou cryobiopsie. Forme fibrosante : cryobiopsie ; biopsie chirurgicale si la cryobiopsie échoue ou n’est pas possible (S2k, recommandation 6). ATS/JRS/ALAT 2020 suggère la biopsie chirurgicale seulement après épuisement des autres moyens.</p>
<div class="lab">Risques</div><p>La cryobiopsie donne un meilleur rendement que la pince mais saigne plus. Dans la seule étude de cryobiopsie limitée à des patients suspects de pneumopathie d’hypersensibilité, un saignement est survenu chez 4 % et un pneumothorax chez 27 %.</p>
<div class="lab">Décision</div><p>La discussion multidisciplinaire décide si la biopsie changera la conduite.</p></template>

<template data-pop="j67-histo" data-title="Critères histologiques">
<div class="lab">Forme non fibrosante typique</div><p>Sur au moins un site : pneumopathie interstitielle cellulaire centrée sur les bronchioles, à prédominance lymphocytaire ; bronchiolite cellulaire ; granulomes non nécrosants mal formés.</p>
<div class="lab">Forme fibrosante typique</div><p>Pneumopathie interstitielle fibrosante chronique ou fibrose centrée sur les voies aériennes, avec granulomes mal formés. La métaplasie péribronchiolaire et la fibrose en pont sont caractéristiques.</p>
<div class="lab">Exclusions</div><p>Plasmocytes plus nombreux que les lymphocytes, hyperplasie lymphoïde étendue, granulomes sarcoïdiens bien formés ou nécrosants, particules d’aspiration.</p>
<div class="lab">Limite</div><p>Une forme fibrosante peut ressembler à une pneumopathie interstitielle commune sur un site et à une forme cellulaire sur un autre ; plusieurs sites améliorent le diagnostic.</p></template>

<template data-pop="j67-evict" data-title="Éviction et test d’éviction">
<div class="lab">Mesure thérapeutique</div><p>L’éviction supprime la source : retrait des oiseaux et du duvet, assainissement de l’eau, changement de méthode de travail. Elle est la première mesure dans tous les phénotypes lorsque l’antigène est connu (S2k, recommandations 10 et 11).</p>
<div class="lab">Test diagnostique</div><p>Le médecin compare symptômes, CVF, DLCO et imagerie avant et après éloignement. Si la source est évidente, la normalisation suffit et la réexposition n’est pas nécessaire.</p>
<div class="lab">Performance</div><p>Après deux semaines d’éviction dans une forme chronique : sensibilité 51 %, spécificité 81 %. L’absence d’amélioration n’exclut pas le diagnostic.</p>
<div class="lab">Effet pronostique</div><p>Les données sont discordantes : un rapport de risque de décès de 0,18 dans une étude, aucun bénéfice significatif dans une autre après ajustement.</p></template>

<template data-pop="j67-provoc" data-title="Test de provocation spécifique par inhalation">
<div class="lab">Principe</div><p>Exposition contrôlée à l’antigène ou à l’environnement suspect, puis surveillance de la température, des leucocytes, de la CVF, de la DLCO et de la saturation.</p>
<div class="lab">Indications</div><p>Présentation aiguë avec source évidente mais diagnostic incertain, confirmation d’une source nouvelle, expertise de maladie professionnelle ; uniquement en centre expérimenté (S2k, recommandation 8).</p>
<div class="lab">Contre-indication relative</div><p>La S2k le déconseille dans la forme chronique, surtout fibrosante, lorsque la source est évidente, car le risque d’aggravation dépasse le bénéfice.</p></template>

<template data-pop="j67-byss" data-title="Classification de Schilling de la byssinose">
<div class="lab">Grades</div><p>Grade I : oppression thoracique et dyspnée seulement le premier jour de travail après un congé. Grade II : symptômes aussi les autres jours. Grade III : perte permanente de fonction respiratoire, qui force souvent à quitter le poste.</p>
<div class="lab">Limites</div><p>La classification repose sur les symptômes. L’Organisation mondiale de la santé a proposé en 1983 une version avec spirométrie, peu adoptée.</p>
<div class="lab">Aide pédagogique</div><p>« Le lundi d’abord, puis toute la semaine, puis pour toujours » : aide pédagogique, non critère officiel.</p></template>

<template data-pop="j67-xshift" data-title="Chute du VEMS au cours du poste">
<div class="lab">Technique</div><p>Spirométrie avant le début du poste, de préférence le premier jour après un congé, puis à la fin du poste, avec la même technique.</p>
<div class="lab">Valeur pronostique</div><p>Chez 611 ouvriers du coton suivis cinq ans, une chute de plus de 200 mL prédisait un déclin annuel accéléré du VEMS ; dans la cohorte de Shanghai, une chute de 5 % était prédictive à 5 et 15 ans.</p>
<div class="lab">Limites</div><p>Une prise de salbutamol avant le poste atténue la chute. La chute est plus marquée chez l’atopique. L’effet du travailleur sain sous-estime l’atteinte dans les populations encore en poste.</p></template>

<template data-pop="j67-endo" data-title="Endotoxine et byssinose">
<div class="lab">Nature</div><p>Lipopolysaccharide de la paroi des bactéries à Gram négatif, dont <i>Pantoea agglomerans</i>, abondantes sur les bractées du coton.</p>
<div class="lab">Mécanisme</div><p>Le lipopolysaccharide active les macrophages alvéolaires par le récepteur TLR4 ; ils libèrent interleukine 1, facteur de nécrose tumorale et médiateurs lipidiques. Les polynucléaires affluent, la muqueuse s’enflamme et la réactivité bronchique augmente.</p>
<div class="lab">Preuves</div><p>Chez des volontaires exposés dans une salle de cardage, la chute du VEMS corrélait avec l’endotoxine et non avec la poussière. Dans la cohorte de Shanghai, l’endotoxine cumulée, et non la poussière, prédisait le déclin du VEMS sur 20 ans.</p>
<div class="lab">Limite</div><p>Un autre composant du coton pourrait expliquer la bronchoconstriction aiguë ; le mécanisme n’est pas entièrement élucidé.</p></template>

<template data-pop="j67-lobule" data-title="Lobule pulmonaire secondaire">
<div class="lab">Définition</div><p>Plus petite unité du poumon limitée par des septums de tissu conjonctif ; polyèdre de 1 à 2,5 cm visible en tomodensitométrie à haute résolution.</p>
<div class="lab">Contenu</div><p>Une bronchiole et une artère pulmonaire en son centre ; veines et lymphatiques dans les septums et sous la plèvre.</p>
<div class="lab">Intérêt</div><p>La position d’une lésion dans le lobule oriente le diagnostic : centrolobulaire dans la pneumopathie d’hypersensibilité, périlymphatique dans la sarcoïdose, sous-pleurale dans la fibrose pulmonaire idiopathique.</p></template>

<template data-pop="j67-hyper" data-title="Hypersensibilités de types III et IV">
<div class="lab">Type III</div><p>Des complexes immuns antigène-IgG se déposent, activent le complément et recrutent des polynucléaires ; la réaction culmine en quelques heures.</p>
<div class="lab">Type IV</div><p>Des lymphocytes T sensibilisés activent des macrophages qui forment des granulomes ; la réaction culmine en 24 à 72 heures.</p>
<div class="lab">Différence avec le type I</div><p>Le type I, à IgE, provoque en minutes l’asthme allergique et la rhinite ; les tests cutanés et les IgE n’explorent pas la pneumopathie d’hypersensibilité.</p></template>
