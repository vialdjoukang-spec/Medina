
<!-- ===== FENÊTRES : clinique et examens ===== -->
<template data-pop="j96-directives" data-title="Directives anticipées et décision d’intubation">
<div class="lab">Cadre suisse</div><p>Le Code civil suisse reconnaît les directives anticipées, qui lient le médecin lorsqu’elles s’appliquent à la situation. Les directives médico-éthiques de l’ASSM guident les décisions de réanimation et de limitation thérapeutique.</p>
<div class="lab">Pourquoi en parler tôt</div><p>Dans la BPCO avancée et les maladies neuromusculaires, l’insuffisance aiguë peut imposer une décision d’intubation dans l’heure. Une discussion préalable, en état stable, permet de connaître la volonté du patient.</p>
<div class="lab">Options intermédiaires</div><p>La ventilation non invasive peut être fixée comme plafond thérapeutique explicite : elle est poursuivie, mais l’intubation n’est pas proposée en cas d’échec. Cette décision s’écrit dans le dossier.</p></template>
<template data-pop="j96-orthop" data-title="Orthopnée">
<div class="lab">Définition</div><p>Dyspnée qui apparaît ou s’aggrave en position couchée et s’améliore assise.</p>
<div class="lab">Deux mécanismes</div><p>Cardiaque : le retour veineux augmente en décubitus et majore la congestion pulmonaire. Diaphragmatique : en décubitus, le contenu abdominal pousse le diaphragme vers le thorax ; un diaphragme faible ne peut plus le repousser, le volume courant chute.</p>
<div class="lab">Distinguer</div><p>La faiblesse diaphragmatique donne une respiration abdominale paradoxale en décubitus et une chute de la capacité vitale couchée ; l’insuffisance cardiaque donne des crépitants, une turgescence jugulaire et des peptides natriurétiques élevés.</p></template>
<template data-pop="j96-cephal" data-title="Céphalées matinales et somnolence diurne">
<div class="lab">Mécanisme</div><p>Pendant le sommeil, et surtout le sommeil paradoxal, la ventilation diminue. Chez un patient à pompe fragile, la PaCO₂ monte la nuit ; le CO₂ dilate les vaisseaux cérébraux et augmente le volume sanguin intracrânien, d’où des céphalées au réveil qui s’estompent en une à deux heures.</p>
<div class="lab">Valeur</div><p>Associées à une somnolence diurne, un sommeil non réparateur et des réveils fréquents, elles évoquent une hypoventilation nocturne dans les maladies neuromusculaires, la cyphoscoliose et l’obésité-hypoventilation.</p>
<div class="lab">Conduite</div><p>Gaz veineux ou artériel du matin, oxymétrie et capnographie transcutanée nocturnes.</p></template>
<template data-pop="j96-fr" data-title="Fréquence respiratoire">
<div class="lab">Technique</div><p>Compter les cycles pendant 60 secondes, ou deux fois 30 secondes, en observant le thorax sans prévenir le patient, car l’attention modifie la respiration.</p>
<div class="lab">Valeurs</div><p>Adulte au repos : 12 à 20 par minute. Plus de 25 : charge élevée. Plus de 30 : signe de gravité. Moins de 10 : dépression de la commande ou épuisement.</p>
<div class="lab">Pourquoi elle prédit l’aggravation</div><p>Elle augmente avant la chute de la saturation, car le patient compense d’abord l’hypoxémie et l’acidose en ventilant plus. C’est pourquoi elle pèse lourd dans le score NEWS2.</p>
<div class="lab">Piège</div><p>Une fréquence qui baisse chez un patient qui reste dyspnéique et devient somnolent n’est pas une amélioration : c’est un épuisement.</p></template>
<template data-pop="j96-spo2" data-title="Saturation pulsée en oxygène">
<div class="lab">Principe</div><p>L’oxymètre envoie une lumière rouge (environ 660 nm) et infrarouge (environ 940 nm). L’oxyhémoglobine absorbe plus l’infrarouge, la désoxyhémoglobine plus le rouge. Seule la composante pulsatile, artérielle, est analysée.</p>
<div class="lab">Précision</div><p>Les normes internationales des oxymètres admettent un écart moyen de quelques points entre 70 et 100 % de saturation ; la précision se dégrade sous 80 %.</p>
<div class="lab">Erreurs</div><p>Surestimation chez les patients à peau pigmentée ; SpO₂ faussement normale avec la carboxyhémoglobine ; SpO₂ autour de 85 % avec la méthémoglobine ; signal faux en cas de vasoconstriction, de mouvements ou de vernis foncé.</p>
<div class="lab">Limite majeure</div><p>La SpO₂ ne mesure pas le CO₂. Une SpO₂ de 99 % sous oxygène peut coexister avec une acidose hypercapnique grave.</p></template>
<template data-pop="j96-tirage" data-title="Tirage et muscles accessoires">
<div class="lab">Description</div><p>Dépression inspiratoire des espaces sus-claviculaires, intercostaux ou sus-sternaux, et contraction visible des sterno-cléido-mastoïdiens et des scalènes.</p>
<div class="lab">Mécanisme</div><p>La pression intrathoracique devient très négative à l’inspiration, parce que la charge (obstruction, rigidité) est élevée ; les tissus mous sont aspirés. Les muscles accessoires sont recrutés quand le diaphragme seul ne suffit plus.</p>
<div class="lab">Valeur</div><p>Signe de lutte, il traduit une charge respiratoire élevée et précède souvent l’épuisement.</p></template>
<template data-pop="j96-paradox" data-title="Respiration abdominale paradoxale">
<div class="lab">Description</div><p>À l’inspiration, l’abdomen rentre au lieu de se gonfler, pendant que le thorax s’élargit.</p>
<div class="lab">Mécanisme</div><p>Normalement, le diaphragme descend et pousse les viscères en avant. S’il est paralysé ou épuisé, la dépression thoracique créée par les muscles accessoires l’aspire vers le haut, et l’abdomen se creuse.</p>
<div class="lab">Valeur</div><p>Signe d’épuisement ou de paralysie diaphragmatique ; dans un contexte aigu, il annonce l’arrêt respiratoire et impose un support ventilatoire.</p></template>
<template data-pop="j96-cyan" data-title="Cyanose centrale">
<div class="lab">Définition</div><p>Coloration bleutée des lèvres, de la langue et des muqueuses.</p>
<div class="lab">Mécanisme</div><p>Elle apparaît lorsque la concentration capillaire d’hémoglobine désoxygénée atteint environ 5 g/dL. Elle dépend donc de la quantité d’hémoglobine.</p>
<div class="lab">Pièges</div><p>Absente chez l’anémique même très hypoxémique ; précoce chez le polyglobulique. Difficile à voir sur peau pigmentée et sous éclairage artificiel. Une cyanose avec PaO₂ normale évoque une méthémoglobinémie.</p>
<div class="lab">Conséquence</div><p>C’est un signe tardif : son absence ne rassure pas.</p></template>
<template data-pop="j96-asterix" data-title="Astérixis">
<div class="lab">Technique</div><p>Le patient tend les bras, poignets en extension, doigts écartés. On observe des chutes brèves et irrégulières de la main suivies d’un retour, dues à des pertes intermittentes du tonus.</p>
<div class="lab">Valeur</div><p>Il traduit une encéphalopathie métabolique : hypercapnie, insuffisance hépatique ou rénale. Dans un contexte respiratoire, il oriente vers une narcose au CO₂.</p>
<div class="lab">Conséquence</div><p>Il impose une gazométrie et, si l’hypercapnie est confirmée avec acidose, une ventilation.</p></template>
<template data-pop="j96-gds" data-title="Gazométrie artérielle : prélèvement et lecture">
<div class="lab">Prélèvement</div><p>Ponction de l’artère radiale, après vérification de la circulation collatérale par la manœuvre d’Allen modifiée, avec une seringue héparinée. Noter la FiO₂, le dispositif, l’heure et la température. Évacuer toute bulle d’air et analyser sans délai.</p>
<div class="lab">Erreurs de prélèvement</div><p>Bulle d’air : la PaO₂ dérive vers celle de l’air et la PaCO₂ baisse. Délai prolongé, surtout avec une hyperleucocytose : les cellules consomment l’oxygène. Excès d’héparine liquide : dilution, PaCO₂ et bicarbonate faussement bas. Sang veineux prélevé par erreur : PaO₂ basse incohérente avec une SpO₂ normale.</p>
<div class="lab">Lecture</div><p>1. pH. 2. PaCO₂ et bicarbonate : quel trouble explique le pH ? 3. Compensation attendue : un troisième trouble ? 4. PaO₂ rapportée à la FiO₂, gradient alvéolo-artériel en air ambiant.</p>
<div class="lab">Complications</div><p>Douleur, hématome, rarement ischémie de la main ou pseudo-anévrisme. L’anesthésie locale réduit la douleur.</p></template>
<template data-pop="j96-pvco2" data-title="Pression veineuse en CO₂">
<div class="lab">Principe</div><p>Le sang veineux périphérique contient plus de CO₂ que le sang artériel, car il a traversé des tissus qui en produisent. La différence est de quelques mmHg, mais elle varie selon la perfusion locale.</p>
<div class="lab">Usage</div><p>Une méta-analyse (Byrne, Respirology 2014) a montré un pH veineux proche du pH artériel mais un accord trop large pour la pression en CO₂. Une PvCO₂ normale rend une hypercapnie artérielle peu probable ; une PvCO₂ élevée doit être confirmée par une gazométrie artérielle.</p>
<div class="lab">Piège</div><p>Un garrot prolongé et une hypoperfusion élèvent la PvCO₂ sans hypercapnie artérielle.</p></template>
<template data-pop="j96-ptcco2" data-title="Capnographie transcutanée">
<div class="lab">Principe</div><p>Une électrode chauffée appliquée sur la peau augmente la perfusion locale et mesure le CO₂ qui diffuse à travers l’épiderme. Un algorithme corrige le métabolisme cutané.</p>
<div class="lab">Usage</div><p>Surveillance continue pendant la nuit : dépistage de l’hypoventilation du sommeil, réglage et suivi de la ventilation à domicile, surveillance non invasive aux soins intensifs.</p>
<div class="lab">Limites</div><p>Temps de réponse de plusieurs minutes, dérive de l’électrode, moins fiable en cas de vasoconstriction ou d’œdème cutané. Une valeur anormale isolée se vérifie par un gaz du sang.</p></template>
<template data-pop="j96-gbs" data-title="Règle 20/30/40 dans les maladies neuromusculaires aiguës">
<div class="lab">Contenu</div><p>Dans le syndrome de Guillain-Barré, un risque élevé d’intubation est associé à une capacité vitale inférieure à 20 mL/kg, une pression inspiratoire maximale moins négative que −30 cmH₂O et une pression expiratoire maximale inférieure à 40 cmH₂O (Lawn, Archives of Neurology 2001).</p>
<div class="lab">Usage</div><p>Mesures répétées plusieurs fois par jour au début de la maladie ; une dégradation rapide impose l’admission en soins intensifs avant l’hypercapnie.</p>
<div class="lab">Piège</div><p>La faiblesse faciale empêche une mesure fiable à l’embout ; la SpO₂ et la PaCO₂ s’altèrent tardivement. Aide pédagogique, non critère officiel.</p></template>
<template data-pop="j96-soh" data-title="Syndrome obésité-hypoventilation">
<div class="lab">Définition</div><p>Association d’une obésité (indice de masse corporelle ≥ 30 kg/m²) et d’une hypercapnie diurne en éveil (PaCO₂ ≥ 45 mmHg), après exclusion d’une autre cause d’hypoventilation (guideline ATS 2019).</p>
<div class="lab">Mécanisme</div><p>La masse thoracique et abdominale augmente la charge ; la commande respiratoire répond mal au CO₂ ; des apnées obstructives coexistent dans la grande majorité des cas. La rétention nocturne de bicarbonate entretient l’hypercapnie diurne.</p>
<div class="lab">Dépistage</div><p>Selon l’ATS 2019, un bicarbonate sérique inférieur à 27 mmol/L rend le diagnostic improbable quand la probabilité clinique est faible ; au-delà, une gazométrie artérielle s’impose.</p>
<div class="lab">Traitement</div><p>Pression positive nocturne : pression positive continue en première intention si des apnées sévères sont associées, ventilation à deux niveaux sinon ; perte de poids importante (de l’ordre de 25 à 30 %), y compris par chirurgie bariatrique.</p></template>
<template data-pop="j96-p50" data-title="P50 de l’hémoglobine">
<div class="lab">Définition</div><p>Pression partielle d’oxygène pour laquelle l’hémoglobine est saturée à 50 %. Valeur normale de l’adulte : environ 26,7 mmHg (3,5 kPa) à pH 7,40 et 37 °C.</p>
<div class="lab">Déplacements</div><p>Vers la droite (P50 plus haute, libération facilitée) : acidose, hypercapnie, fièvre, 2,3-diphosphoglycérate élevé. Vers la gauche (affinité accrue) : alcalose, hypothermie, carboxyhémoglobine, hémoglobine fœtale.</p>
<div class="lab">Conséquence clinique</div><p>L’alcalose posthypercapnique déplace la courbe vers la gauche et réduit la libération tissulaire de l’oxygène, une raison de plus d’éviter une correction trop rapide du CO₂.</p></template>
<template data-pop="j96-altitude" data-title="Altitude et PaO₂ en Suisse">
<div class="lab">Principe</div><p>La FiO₂ reste de 0,21 en altitude, mais la pression barométrique baisse, donc la pression inspirée d’oxygène aussi. Le calcul utilise PAO₂ = 0,21 × (pression barométrique − 47) − PaCO₂/0,8.</p>
<div class="lab">Exemples calculés</div><p>Niveau de la mer (760 mmHg) : pression inspirée d’oxygène d’environ 150 mmHg. Neuchâtel (environ 430 m, pression proche de 722 mmHg) : environ 142 mmHg. Davos (environ 1 560 m, pression proche de 631 mmHg) : environ 123 mmHg. Les valeurs de pression sont des estimations par la formule barométrique.</p>
<div class="lab">Conséquence</div><p>Les PaO₂ de référence sont plus basses en altitude ; un patient BPCO limite en plaine peut remplir les critères d’oxygène à la montagne. La Revue médicale suisse (2023) rappelle cette influence dans la prescription de l’oxygène à domicile.</p></template>
<template data-pop="j96-avion" data-title="Oxygène en vol">
<div class="lab">Principe</div><p>Une cabine pressurisée correspond au maximum à une altitude d’environ 2 400 m (8 000 pieds). L’air inspiré équivaut alors à une FiO₂ d’environ 0,15 au niveau de la mer.</p>
<div class="lab">Évaluation</div><p>Un test d’hypoxie simulée fait respirer un mélange à 15 % d’oxygène pendant une vingtaine de minutes. Selon les recommandations de la British Thoracic Society sur le voyage aérien, une PaO₂ inférieure à 6,6 kPa (50 mmHg) pendant le test fait recommander l’oxygène en vol.</p>
<div class="lab">Patient sous oxygène de longue durée</div><p>Il a besoin d’oxygène en vol, habituellement à un débit supérieur à son débit au sol ; la compagnie aérienne doit être prévenue à l’avance, car les concentrateurs portables doivent être autorisés.</p></template>
<template data-pop="j96-echec" data-title="Critères d’échec du support non invasif">
<div class="lab">Ventilation non invasive</div><p>Absence de baisse de la PaCO₂ et de remontée du pH après une à quatre heures, fréquence respiratoire qui reste élevée, conscience qui se dégrade, intolérance du masque, impossibilité d’évacuer les sécrétions, instabilité hémodynamique.</p>
<div class="lab">Haut débit nasal</div><p>Hypoxémie ou tachypnée persistantes malgré une FiO₂ élevée, index ROX bas, signes de lutte croissants.</p>
<div class="lab">Pourquoi décider tôt</div><p>Une intubation retardée chez un patient épuisé s’accompagne d’une mortalité plus élevée. Les critères d’échec et le niveau de soins maximal sont donc écrits au moment de l’initiation.</p></template>
