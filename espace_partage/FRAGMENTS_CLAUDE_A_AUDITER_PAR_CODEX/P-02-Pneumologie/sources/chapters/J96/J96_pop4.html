
<!-- ===== FENÊTRES : monographies ===== -->
<template data-pop="j96-o2med" data-title="Monographie — Oxygène médicinal">
<div class="lab">Statut</div><p>En Suisse, l’oxygène médicinal est un médicament : il se prescrit, il a des indications, des effets indésirables et des précautions d’emploi. À domicile, sa fourniture et son remboursement suivent la LiMA.</p>
<div class="lab">Mécanisme</div><p>Il élève la pression alvéolaire d’oxygène et donc la PaO₂, sauf pour la fraction de sang shuntée.</p>
<div class="lab">Posologie</div><p>Exprimée par une cible de SpO₂, un dispositif et un débit (îlot 9 de l’onglet 1 et tableau des doses). Oxygène de longue durée : au moins 15 heures par jour.</p>
<div class="lab">Effets indésirables</div><p>Hypercapnie chez le patient à risque, atélectasies de résorption, toxicité pulmonaire à forte FiO₂ prolongée, sécheresse muqueuse, brûlures et incendies.</p>
<div class="lab">Précautions</div><p>Cible basse (88–92 %) en cas de risque d’hypercapnie, d’intoxication au paraquat ou d’antécédent de bléomycine. Interdiction de fumer et de toute flamme à proximité ; pas de corps gras sur le visage.</p></template>
<template data-pop="j96-naloxone" data-title="Monographie — Naloxone">
<div class="lab">Mécanisme</div><p>Antagoniste compétitif des récepteurs opioïdes, surtout mu. Il déplace l’opioïde et rétablit la commande respiratoire en une à deux minutes par voie intraveineuse.</p>
<div class="lab">Posologie (Naloxon Orpha 0,4 mg/mL, monographie consultée sur compendium.ch le 08.10.2026)</div><p>Surdosage en opioïdes chez l’adulte : 0,4 à 2 mg par voie intraveineuse, intramusculaire ou sous-cutanée, à répéter toutes les 2 à 3 minutes ; reconsidérer le diagnostic après une dose cumulée de 10 mg. Dépression respiratoire postopératoire : 0,1 à 0,2 mg par voie intraveineuse toutes les 2 à 3 minutes, avec une nouvelle dose possible après 1 à 2 heures.</p>
<div class="lab">Durée d’action et surveillance</div><p>Son effet est plus court que celui de la méthadone et des opioïdes à libération prolongée : la resédation est fréquente et impose une surveillance de plusieurs heures, parfois une perfusion.</p>
<div class="lab">Effets indésirables et précautions</div><p>Sevrage aigu chez le patient dépendant (agitation, vomissements, tachycardie, hypertension), douleur brutale chez le patient palliatif ; titration prudente dans ces situations. La monographie consultée mentionne une précaution pour l’allaitement pendant au moins 24 heures après l’administration.</p></template>
<template data-pop="j96-flumaz" data-title="Monographie — Flumazénil">
<div class="lab">Mécanisme</div><p>Antagoniste compétitif du site benzodiazépine du récepteur GABA de type A.</p>
<div class="lab">Posologie (information professionnelle allemande d’Anexate ; monographie suisse non relue pour ce cours)</div><p>Anesthésie : 0,2 mg par voie intraveineuse en 15 secondes, puis 0,1 mg toutes les 60 secondes si nécessaire, jusqu’à 1 mg ; dose habituelle 0,3 à 0,6 mg. Soins intensifs : 0,3 mg initial, puis 0,1 mg par minute, jusqu’à 2 mg.</p>
<div class="lab">Contre-indications et précautions</div><p>Épilepsie traitée par benzodiazépine, intoxication mixte avec un antidépresseur tricyclique ou un autre proconvulsivant, dépendance aux benzodiazépines : risque de convulsions et de sevrage. Sa demi-vie courte expose à une resédation.</p>
<div class="lab">Place</div><p>Réversion d’une sédation iatrogène bien identifiée, par exemple après une endoscopie ; il n’est pas un antidote de routine des intoxications volontaires.</p></template>
<template data-pop="j96-acetaz" data-title="Monographie — Acétazolamide">
<div class="lab">Mécanisme</div><p>Inhibiteur de l’anhydrase carbonique rénale. Il augmente l’excrétion de bicarbonate, corrige une alcalose métabolique et stimule la ventilation par l’acidose induite.</p>
<div class="lab">Preuves dans l’insuffisance respiratoire</div><p>Dans l’essai DIABOLO (JAMA 2016), chez des patients BPCO sous ventilation invasive, l’acétazolamide n’a pas réduit significativement la durée de ventilation. Il n’a pas d’indication autorisée dans l’insuffisance respiratoire en Suisse.</p>
<div class="lab">Précautions</div><p>Il peut aggraver l’acidose et la dyspnée d’un patient BPCO sévère incapable d’augmenter sa ventilation ; il provoque une hypokaliémie. Il est disponible en Suisse (Diamox), mais son usage dans ce contexte relève d’un avis spécialisé.</p></template>
<template data-pop="j96-morph" data-title="Monographie — Opioïdes dans la dyspnée réfractaire">
<div class="lab">Mécanisme</div><p>Les opioïdes diminuent la perception de la dyspnée et la réponse ventilatoire au CO₂, ce qui réduit la sensation de soif d’air.</p>
<div class="lab">Preuves</div><p>Ils sont utilisés en soins palliatifs pour la dyspnée réfractaire. Dans l’essai australien de Ekström (JAMA 2022), la morphine à libération prolongée à 8 ou 16 mg par jour n’a pas réduit la dyspnée maximale après une semaine chez des patients BPCO. Leur place hors fin de vie reste donc incertaine.</p>
<div class="lab">Pratique</div><p>Indication palliative, titration individuelle à faible dose, surveillance de la vigilance et de la fréquence respiratoire, prévention de la constipation. L’usage dans la dyspnée est hors indication autorisée en Suisse.</p></template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-j96-meca" data-title="Pareto — Définitions, mécanismes et causes">
<p class="ratio" data-cover="j96-1,j96-2,j96-3,j96-4"></p>
<ul><li>Insuffisance respiratoire : PaO₂ &lt; 8,0 kPa (type I) ou PaCO₂ &gt; 6,0 kPa (type II), au repos, en air ambiant.</li>
<li>Durée lue sur le pH et le bicarbonate ; aiguë sur chronique : pH bas malgré un bicarbonate élevé.</li>
<li>Codage : J96.0- aiguë, J96.1- chronique, J96.9- sans précision ; cinquième caractère 0, 1 ou 9 ; aiguë sur chronique = deux codes ; SDRA = J80.</li>
<li>Hypoxémie : inégalité ventilation-perfusion, shunt, hypoventilation, diffusion, altitude ; gradient normal = hypoventilation ou altitude.</li>
<li>Hypercapnie = baisse de la ventilation alvéolaire : commande, muscle, paroi, charge et espace mort.</li>
<li>L’oxygène en excès élève la PaCO₂ par levée de la vasoconstriction hypoxique et effet Haldane.</li>
<li>Hypercapnie persistante après exacerbation : réadmission ou décès à un an chez 80 % des patients sous oxygène seul.</li></ul></template>
<template data-pop="pareto-j96-clin" data-title="Pareto — Clinique, diagnostic et urgences">
<p class="ratio" data-cover="j96-5,j96-6,j96-7,j96-8"></p>
<ul><li>Rechercher BPCO, maladie neuromusculaire, obésité, oxygène ou ventilation à domicile, sédatifs, directives anticipées.</li>
<li>Céphalées matinales et somnolence : hypoventilation nocturne.</li>
<li>Gravité : fréquence respiratoire, conscience, respiration paradoxale ; la SpO₂ ne mesure jamais le CO₂.</li>
<li>Démarche : pH → PaCO₂ → bicarbonate attendu → gradient alvéolo-artériel en air ambiant.</li>
<li>Pièges de l’oxymétrie : monoxyde de carbone, méthémoglobine.</li>
<li>Intubation sans retard si coma, choc, arrêt imminent ou échec du support non invasif.</li>
<li>Ne pas normaliser trop vite une hypercapnie chronique : alcalose posthypercapnique.</li></ul></template>
<template data-pop="pareto-j96-ttt" data-title="Pareto — Oxygène, ventilation et traitement">
<p class="ratio" data-cover="j96-9,j96-10,j96-11,j96-12"></p>
<ul><li>Cibles BTS 2017 : 94–98 % ; 88–92 % si risque d’hypercapnie ; Venturi 24–28 % ; gazométrie à 30–60 minutes ; ne jamais arrêter brutalement.</li>
<li>Pas d’oxygène sans hypoxémie (infarctus, AVC).</li>
<li>Hypoxémie aiguë : haut débit nasal (ERS 2022). Acidose hypercapnique pH ≤ 7,35 : ventilation non invasive (ERS/ATS 2017, forte) ; pH &lt; 7,25 : unité capable d’intuber.</li>
<li>Gazométrie à une heure ; échec en une à quatre heures = intubation, sauf limitation écrite.</li>
<li>Traiter la cause ; arrêter les sédatifs ; corriger potassium et phosphore.</li>
<li>Oxygène de longue durée : PaO₂ ≤ 7,3 kPa (ou ≤ 8,0 avec retentissement), en état stable, ≥ 15 heures par jour ; inutile dans l’hypoxémie modérée (LOTT).</li>
<li>Ventilation à domicile après exacerbation si PaCO₂ &gt; 7 kPa à deux à quatre semaines (HOT-HMV).</li></ul></template>
<template data-pop="pareto-j96-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j96-13,j96-14"></p>
<ul><li>Gazométrie de contrôle à deux à quatre semaines ; oxygène réévalué à 60–90 jours.</li>
<li>Grossesse : PaCO₂ normale ≈ 4,0 kPa ; altitude et âge abaissent la PaO₂ de référence.</li>
<li>Critères : PaO₂ &lt; 8,0 kPa ou PaCO₂ &gt; 6,0 kPa ; type par la PaCO₂ ; durée par pH et bicarbonate.</li>
<li>Sous oxygène : rapport PaO₂/FiO₂ ; la SpO₂ normale n’exclut rien.</li></ul></template>
<template data-pop="pareto-j96-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j96-e-1,j96-e-2,j96-e-3,j96-e-4,j96-e-5,j96-e-6,j96-e-7"></p>
<ul><li>Gazométrie artérielle : examen de référence ; noter la FiO₂.</li>
<li>Normes : pH 7,35–7,45 ; PaCO₂ 4,7–6,0 kPa ; bicarbonate 22–26 mmol/L.</li>
<li>Compensation : +1 mmol/L (aigu) ou +3,5 à 4 (chronique) par 10 mmHg de PaCO₂.</li>
<li>Oxymétrie : surestime sur peau pigmentée ; fausse avec monoxyde de carbone et méthémoglobine.</li>
<li>Gaz veineux : dépistage de l’hypercapnie ; capnographie transcutanée la nuit.</li>
<li>Capacité vitale couchée : faiblesse diaphragmatique ; règle 20/30/40.</li>
<li>Bicarbonate ≥ 27 mmol/L chez l’obèse : rechercher une hypoventilation.</li></ul></template>
<template data-pop="pareto-j96-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j96-p-1,j96-p-2,j96-p-3,j96-p-4"></p>
<ul><li>L’oxygène est un médicament : cible, dispositif, débit.</li>
<li>Cible basse aussi en cas de paraquat ou de bléomycine ; débit maximal dans l’intoxication au monoxyde de carbone.</li>
<li>Naloxone : 0,4–2 mg en surdosage, 0,1–0,2 mg en postopératoire ; resédation fréquente.</li>
<li>Flumazénil : indications étroites ; contre-indiqué si épilepsie traitée ou tricycliques.</li>
<li>Éviter opioïdes avec benzodiazépines, gabapentinoïdes, alcool ; prudence avec les diurétiques de l’anse (alcalose).</li></ul></template>
