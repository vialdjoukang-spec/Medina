<section class="ilot" id="j96-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 71 ans atteinte de BPCO sévère (VEMS à 38 % de la valeur prédite) est amenée aux urgences pour une toux productive et une dyspnée croissante depuis trois jours. L’équipe préhospitalière lui a posé un masque à réservoir à 15 L/min, parce que sa saturation pulsée était à 84 %. À l’arrivée, sa SpO₂ atteint 99 %, mais elle est somnolente et répond lentement. La gazométrie artérielle montre un pH de 7,24, une PaCO₂ de 9,9 kPa (74 mmHg), une PaO₂ de 18,0 kPa (135 mmHg) et un bicarbonate de 31 mmol/L.</p>
<p>La question qui structure tout le cours est la suivante : <b>cette patiente a-t-elle une insuffisance respiratoire, de quel type, depuis quand, pourquoi s’aggrave-t-elle maintenant, et quel support respiratoire corrigera l’acidose sans l’exposer à un excès d’oxygène ?</b> La somnolence n’est pas ici un signe de fatigue banale. Elle traduit une narcose au CO₂, aggravée par un apport d’oxygène trop élevé pour une patiente à risque d’hypercapnie.</p>
<p>À la fin de ce cours, le médecin assistant sait poser le diagnostic gazométrique, distinguer l’insuffisance hypoxémique de l’insuffisance hypercapnique, reconnaître la composante aiguë d’une insuffisance chronique, prescrire l’oxygène avec une cible chiffrée, choisir entre oxygène conventionnel, haut débit nasal, ventilation non invasive et intubation, puis organiser l’oxygénothérapie de longue durée ou la ventilation à domicile.</p>
<div class="key"><b>Message fondateur.</b> L’insuffisance respiratoire n’est pas une maladie, mais un <b>syndrome gazométrique</b>. Deux systèmes peuvent céder : l’<b>échangeur pulmonaire</b>, dont la défaillance abaisse surtout la PaO₂, et la <button class="w" data-k="j96-pompe">pompe ventilatoire (centres, nerfs, muscles, paroi)</button>, dont la défaillance élève la PaCO₂. Le traitement efficace dépend de l’identification du système défaillant et de sa cause.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="j96-aa">équation des gaz alvéolaires et le gradient alvéolo-artériel (calcul et interprétation)</button>, la <button class="w" data-k="j96-compens">compensation rénale par le bicarbonate (aiguë ou chronique)</button> et la courbe de dissociation de l’hémoglobine. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="j96-1"><h2><span class="n">1</span>Définitions, classifications et codage</h2>
<p>L’insuffisance respiratoire est l’incapacité du système respiratoire à maintenir des gaz du sang artériel normaux. La définition opérationnelle repose sur la gazométrie artérielle, mesurée au repos, en air ambiant et au niveau de la mer. Une <b>PaO₂ inférieure à 8,0 kPa (60 mmHg)</b> définit l’insuffisance hypoxémique. Une <b>PaCO₂ supérieure à 6,0 kPa (45 mmHg)</b> définit l’hypercapnie. Le seuil de 8,0 kPa n’est pas arbitraire : il correspond au point où la courbe de dissociation de l’hémoglobine quitte son plateau, vers 90 % de saturation. En dessous, chaque baisse de PaO₂ fait chuter rapidement la saturation et le contenu artériel en oxygène.</p>
<p>Exemple : un homme de 50 ans a une PaO₂ de 9,5 kPa et une PaCO₂ de 5,0 kPa en air ambiant. Il est hypoxémique par rapport à la normale (environ 12 à 13 kPa chez l’adulte jeune), mais il ne remplit pas le critère d’insuffisance respiratoire. S’il descend à 7,2 kPa, il le remplit.</p>
<h3>1.1 Deux types physiopathologiques</h3>
<p>La classification en deux types oriente directement le traitement. Le tableau suivant compare leur définition, leur mécanisme dominant et leur traitement de support. Il se lit ligne par ligne, en partant de la PaCO₂.</p>
<table class="t"><tr><th>Critère</th><th>Type I : hypoxémique</th><th>Type II : hypercapnique</th></tr>
<tr><td>Gazométrie</td><td>PaO₂ &lt; 8,0 kPa ; PaCO₂ normale ou basse</td><td>PaCO₂ &gt; 6,0 kPa ; PaO₂ souvent basse</td></tr>
<tr><td>Système défaillant</td><td>Échangeur pulmonaire</td><td>Pompe ventilatoire</td></tr>
<tr><td>Mécanisme dominant</td><td>Shunt, inégalité ventilation-perfusion, trouble de diffusion</td><td>Hypoventilation alvéolaire</td></tr>
<tr><td>Gradient alvéolo-artériel</td><td>Élevé</td><td>Normal si l’hypoventilation est pure ; élevé si le poumon est aussi atteint</td></tr>
<tr><td>Exemples</td><td>Pneumonie, œdème pulmonaire, SDRA, embolie pulmonaire</td><td>Exacerbation de BPCO, surdosage en opioïdes, myasthénie, obésité-hypoventilation</td></tr>
<tr><td>Support principal</td><td>Oxygène, haut débit nasal, pression positive</td><td>Ventilation (non invasive ou invasive), oxygène prudent</td></tr></table>
<p>La lecture commence par la PaCO₂ : une PaCO₂ élevée signe une hypoventilation, quel que soit le niveau de PaO₂. L’erreur fréquente consiste à classer en type I un patient hypoxémique dont la PaCO₂ « normale » à 5,8 kPa est en réalité anormalement haute pour sa fréquence respiratoire de 32 par minute. Chez la patiente de l’îlot 0, la PaCO₂ de 9,9 kPa classe d’emblée l’insuffisance en type II, malgré une PaO₂ élevée sous oxygène.</p>
<h3>1.2 Aiguë, chronique ou aiguë sur chronique</h3>
<p>La durée se lit sur le pH et le bicarbonate. Une hypercapnie aiguë abaisse fortement le pH, parce que le rein n’a pas eu le temps de retenir du bicarbonate. Une hypercapnie chronique s’accompagne d’un bicarbonate élevé, retenu par le rein en trois à cinq jours, et d’un pH proche de la normale. L’hypoxémie chronique se reconnaît à ses conséquences : polyglobulie, <button class="w" data-k="j96-coeurpulm">cœur pulmonaire chronique (hypertrophie et dilatation du ventricule droit)</button>, hippocratisme parfois.</p>
<div class="two">
<div class="card"><h4>Aiguë</h4><p>Installation en minutes à jours. Hypercapnie avec pH &lt; 7,35 et bicarbonate proche de 24 à 27 mmol/L. Exemple : un surdosage en morphine chez un patient sans maladie respiratoire.</p></div>
<div class="card"><h4>Chronique</h4><p>Installation en mois. pH entre 7,35 et 7,45, bicarbonate élevé (souvent 30 à 36 mmol/L) si la PaCO₂ est haute. Exemple : un syndrome obésité-hypoventilation stable.</p></div>
<div class="card"><h4>Aiguë sur chronique</h4><p>Un patient dont la PaCO₂ de base est déjà élevée s’aggrave brutalement. Le bicarbonate est élevé, mais le pH baisse malgré tout. C’est la situation de la patiente de l’îlot 0, la plus fréquente aux urgences.</p></div>
<div class="card"><h4>Latente</h4><p>Les gaz du sang sont normaux au repos et en éveil, mais s’altèrent pendant le sommeil ou l’effort. C’est souvent le premier stade des maladies neuromusculaires et de l’obésité-hypoventilation ; elle se dépiste par la capnographie et l’oxymétrie nocturnes.</p></div></div>
<h3>1.3 Codage CIM-10-GM 2024</h3>
<p>La CIM-10-GM 2024 (BfArM) code l’insuffisance respiratoire sous J96, « insuffisance respiratoire, non classée ailleurs ». Le quatrième caractère précise la durée et le cinquième le type. Le tableau donne les neuf codes terminaux ; chaque code se construit en croisant une ligne et une colonne.</p>
<table class="t"><tr><th>Durée</th><th>Type I hypoxémique (…0)</th><th>Type II hypercapnique (…1)</th><th>Type non précisé (…9)</th></tr>
<tr><td>Aiguë (J96.0-)</td><td>J96.00</td><td>J96.01</td><td>J96.09</td></tr>
<tr><td>Chronique (J96.1-)</td><td>J96.10</td><td>J96.11</td><td>J96.19</td></tr>
<tr><td>Sans précision (J96.9-)</td><td>J96.90</td><td>J96.91</td><td>J96.99</td></tr></table>
<p>Trois règles de codage découlent des notes officielles. Une insuffisance avec hypoxémie <b>et</b> hypercapnie se code en type II. L’insuffisance <b>aiguë sur chronique</b> n’a pas de code propre : on code l’épisode aigu (J96.0-) et on ajoute le code chronique (J96.1-). Une dépendance prolongée à l’aspiration ou à la ventilation s’ajoute par Z99.0 ou Z99.1. La catégorie exclut le SDRA (J80), la détresse respiratoire du nouveau-né (P22), l’arrêt respiratoire et l’insuffisance cardio-respiratoire (R09.2) ainsi que l’insuffisance respiratoire consécutive à un acte médical (J95). La patiente de l’îlot 0 reçoit donc J96.01 et J96.11, en plus du code de sa BPCO exacerbée.</p>
<div class="trap"><span class="k">Piège</span>Le code J96 ne remplace jamais le diagnostic causal. Une insuffisance respiratoire aiguë due à une pneumonie se code avec la pneumonie (<a href="#/entry/J18">J18 — Pneumonies (P-02-Pneumologie)</a>). Un SDRA se code J80 et non J96 : il possède son propre cours, <a href="#/entry/J80">J80 — Syndrome de détresse respiratoire aiguë (P-02-Pneumologie)</a>.</div>
<div class="key"><b>À retenir.</b> L’insuffisance respiratoire se définit par une PaO₂ &lt; 8,0 kPa ou une PaCO₂ &gt; 6,0 kPa. Le type se lit sur la PaCO₂, la durée sur le pH et le bicarbonate. L’îlot suivant situe la fréquence et le pronostic de ces situations.</div>
</section>

<section class="ilot" id="j96-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’insuffisance respiratoire aiguë est l’un des premiers motifs d’admission en soins intensifs, parce qu’elle complique des maladies très fréquentes : pneumonie, exacerbation de BPCO, insuffisance cardiaque, sepsis. Aucun registre suisse publié ne donne aujourd’hui son incidence nationale ; cette lacune est nommée ici plutôt que comblée par une extrapolation. Les données suisses accessibles portent sur les maladies causales, traitées dans leurs propres cours.</p>
<h3>2.1 Pronostic de l’épisode aigu</h3>
<p>Le pronostic dépend de la cause, de l’âge, des comorbidités et de la réponse au premier support. Chez le patient BPCO en acidose hypercapnique, la ventilation non invasive a transformé le pronostic : elle diminue la mortalité et le recours à l’intubation, ce qui explique la recommandation forte des guidelines ERS/ATS 2017. Après l’épisode, le risque reste élevé. Dans l’essai <button class="w" data-k="j96-hothmv">HOT-HMV (JAMA 2017)</button>, 80,4 % des patients BPCO restés hypercapniques sous oxygène seul étaient réhospitalisés ou décédés à douze mois.</p>
<h3>2.2 Pronostic de l’insuffisance chronique</h3>
<p>L’hypoxémie chronique sévère de la BPCO réduit la survie, et l’oxygène délivré au moins quinze heures par jour l’allonge : c’est le résultat des deux essais fondateurs des années 1980, présentés dans la fenêtre <button class="w" data-k="j96-oxld">oxygénothérapie de longue durée (indications et preuves)</button>. L’hypercapnie chronique est un marqueur de gravité indépendant dans la BPCO et un signe d’atteinte avancée dans les maladies neuromusculaires. Dans la sclérose latérale amyotrophique, l’hypoventilation est la principale cause de décès, ce qui justifie une surveillance fonctionnelle régulière.</p>
<div class="key"><b>À retenir.</b> L’insuffisance respiratoire aiguë complique des maladies fréquentes ; aucun chiffre d’incidence suisse n’est publié. Une hypercapnie persistante après une exacerbation identifie un patient à très haut risque de réadmission ou de décès. La physiopathologie explique pourquoi.</div>
</section>

<section class="ilot" id="j96-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le système respiratoire comporte deux éléments en série. Le <b>poumon</b> assure les échanges gazeux entre l’alvéole et le capillaire. La <b>pompe ventilatoire</b> renouvelle l’air alvéolaire : elle comprend les centres respiratoires du tronc cérébral, la moelle cervicale, les nerfs phréniques et intercostaux, la jonction neuromusculaire, les muscles respiratoires et la paroi thoracique. Chaque cause d’insuffisance respiratoire atteint l’un de ces maillons, et chaque maillon a sa signature gazométrique.</p>
<h3>3.1 État normal</h3>
<p>Au niveau de la mer, l’air inspiré humidifié contient une pression partielle d’oxygène d’environ 150 mmHg (20 kPa). Dans l’alvéole, une partie de cet oxygène est remplacée par le CO₂ produit par l’organisme : la PAO₂ normale est d’environ 100 mmHg (13,3 kPa). Le sang artériel arrive presque à l’équilibre avec l’alvéole ; la petite différence normale, de 5 à 15 mmHg chez l’adulte jeune, provient des veines bronchiques et des veines de Thebesius, qui se déversent dans le cœur gauche sans passer par les alvéoles. La PaCO₂ reste stable vers 40 mmHg (5,3 kPa), parce que les centres respiratoires ajustent la ventilation alvéolaire à la production de CO₂ minute après minute.</p>
<h3>3.2 Première charnière : les cinq mécanismes de l’hypoxémie</h3>
<p>Cinq mécanismes abaissent la PaO₂. Le tableau les classe par fréquence clinique et indique comment les reconnaître, car leur réponse à l’oxygène diffère.</p>
<table class="t"><tr><th>Mécanisme</th><th>Exemple</th><th>Gradient alvéolo-artériel</th><th>Réponse à l’oxygène</th></tr>
<tr><td><button class="w" data-k="j96-vaq">Inégalité ventilation-perfusion</button></td><td>BPCO, asthme, embolie pulmonaire, pneumonie débutante</td><td>Élevé</td><td>Bonne, même à faible débit</td></tr>
<tr><td><button class="w" data-k="j96-shunt">Shunt droit-gauche</button></td><td>Pneumonie lobaire, atélectasie, œdème pulmonaire, SDRA</td><td>Élevé</td><td>Faible si le shunt dépasse environ 30 %</td></tr>
<tr><td><button class="w" data-k="j96-hypovent">Hypoventilation alvéolaire</button></td><td>Opioïdes, myasthénie, obésité-hypoventilation</td><td>Normal</td><td>Bonne, mais elle masque la hausse du CO₂</td></tr>
<tr><td><button class="w" data-k="j96-diff">Trouble de la diffusion</button></td><td>Pneumopathie interstitielle à l’effort</td><td>Élevé</td><td>Bonne</td></tr>
<tr><td>Baisse de la pression inspirée d’oxygène</td><td>Altitude, cabine d’avion</td><td>Normal</td><td>Bonne</td></tr></table>
<p>Le tableau se lit en deux temps. Un gradient normal oriente vers l’hypoventilation ou l’altitude, donc vers la pompe ou l’environnement. Un gradient élevé oriente vers le poumon. La réponse à l’oxygène sépare ensuite l’inégalité ventilation-perfusion, très sensible, du shunt, peu sensible : un patient dont la PaO₂ ne monte presque pas sous FiO₂ de 0,6 a un shunt important et a besoin d’une pression positive pour rouvrir les alvéoles.</p>
<h3>3.3 Deuxième charnière : l’hypercapnie traduit une ventilation alvéolaire insuffisante</h3>
<p>La PaCO₂ obéit à une relation simple : elle est proportionnelle à la production de CO₂ et inversement proportionnelle à la ventilation alvéolaire. Si la ventilation alvéolaire diminue de moitié, la PaCO₂ double, de 40 à 80 mmHg. La ventilation alvéolaire baisse dans trois situations : la commande centrale diminue (opioïdes, sédatifs, lésion du tronc cérébral), les muscles ne peuvent plus produire l’effort demandé (myopathie, atteinte phrénique, distension thoracique), ou l’<b>espace mort</b> augmente, de sorte qu’une ventilation totale normale ne renouvelle plus assez l’air alvéolaire (BPCO, respiration rapide et superficielle).</p>
<p>La pompe ventilatoire fonctionne comme une <button class="w" data-k="j96-charge">balance entre charge, capacité et commande</button>. La charge augmente avec les résistances bronchiques, la rigidité pulmonaire ou thoracique et la distension dynamique. La capacité diminue avec la faiblesse musculaire, la dénutrition, l’hypokaliémie ou l’hypophosphorémie. Quand la charge dépasse la capacité, le patient adopte une respiration rapide et superficielle. Ce choix économise ses muscles, mais il augmente la part de l’espace mort dans chaque cycle : la PaCO₂ monte malgré une fréquence élevée.</p>
<h3>3.4 Troisième charnière : la compensation et sa limite</h3>
<p>Le CO₂ dissous forme de l’acide carbonique, qui abaisse le pH. Le rein compense en retenant du bicarbonate et en excrétant des ions H⁺, mais ce processus demande trois à cinq jours. La <button class="w" data-k="j96-compens">règle de compensation</button> en découle : pour chaque hausse de 10 mmHg de PaCO₂, le bicarbonate monte d’environ 1 mmol/L en aigu et de 3,5 à 4 mmol/L en chronique. Un bicarbonate élevé à l’admission prouve donc une hypercapnie préexistante, ou une alcalose métabolique associée.</p>
<h3>3.5 Quatrième charnière : les conséquences tissulaires</h3>
<p>L’hypoxémie diminue le contenu artériel en oxygène et l’apport aux tissus. Le cerveau et le myocarde sont les premiers touchés : confusion, agitation, troubles du rythme. L’hypoxie alvéolaire contracte les artérioles pulmonaires ; cette vasoconstriction hypoxique protège les échanges à court terme, mais elle élève la pression artérielle pulmonaire et, si elle persiste, conduit au cœur pulmonaire chronique. L’hypercapnie dilate les vaisseaux cérébraux, ce qui explique les céphalées, puis déprime la conscience au-delà d’un certain niveau ; la vitesse d’installation compte plus que la valeur absolue, car l’acidose du liquide céphalorachidien est mieux tolérée lorsqu’elle a été compensée.</p>
<h3>3.6 Cinquième charnière : l’hypercapnie induite par l’oxygène</h3>
<p>Chez un patient à risque, un apport d’oxygène excessif peut élever la PaCO₂ de plusieurs kPa en une heure. La baisse de la commande respiratoire n’explique qu’une petite partie du phénomène. Le mécanisme principal est la <button class="w" data-k="j96-o2hyper">levée de la vasoconstriction hypoxique et l’effet Haldane</button> : l’oxygène réouvre la perfusion de zones mal ventilées, ce qui augmente l’espace mort fonctionnel, et l’hémoglobine oxygénée libère son CO₂. C’est ce qui s’est produit chez la patiente de l’îlot 0.</p>

<p>La figure se lit de gauche à droite pour le trajet de l’information et de l’air, puis de haut en bas pour la conséquence gazométrique. L’erreur fréquente consiste à ranger la BPCO dans une seule case : elle altère l’échangeur par l’inégalité ventilation-perfusion et la pompe par la distension et la charge résistive. Elle produit donc une hypoxémie et, à un stade avancé, une hypercapnie.</p>
<div class="key"><b>À retenir.</b> L’hypoxémie a cinq mécanismes ; le gradient alvéolo-artériel et la réponse à l’oxygène les séparent. L’hypercapnie a un seul mécanisme, la baisse de la ventilation alvéolaire, mais trois causes : commande, capacité musculaire, charge et espace mort. Le bicarbonate date l’hypercapnie. Les étiologies se rangent selon ces maillons.</div>
</section>

<section class="ilot" id="j96-4"><h2><span class="n">4</span>Étiologies et facteurs de décompensation</h2>
<p>La recherche étiologique suit les maillons de la figure 1. Elle commence par les causes les plus fréquentes et les plus rapidement réversibles, car une même gazométrie peut relever d’une pneumonie, d’un surdosage médicamenteux ou d’un œdème pulmonaire, avec des traitements opposés.</p>
<h3>4.1 Causes de l’insuffisance hypoxémique (type I)</h3>
<table class="t"><tr><th>Groupe</th><th>Causes fréquentes</th><th>Indice clinique</th><th>Cours de référence</th></tr>
<tr><td>Comblement alvéolaire</td><td>Pneumonie, œdème pulmonaire cardiogénique, SDRA, hémorragie alvéolaire</td><td>Fièvre, crépitants, orthopnée</td><td>J18, I50, J80</td></tr>
<tr><td>Collapsus alvéolaire</td><td>Atélectasie postopératoire, épanchement pleural abondant, pneumothorax</td><td>Chirurgie récente, silence auscultatoire</td><td>J90, J93</td></tr>
<tr><td>Vaisseaux</td><td>Embolie pulmonaire, hypertension pulmonaire</td><td>Douleur pleurale, poumon clair</td><td>I26, I27</td></tr>
<tr><td>Voies aériennes</td><td>Asthme aigu grave, exacerbation de BPCO</td><td>Sibilants, distension</td><td>J45, J44</td></tr>
<tr><td>Interstitium</td><td>Pneumopathie interstitielle et ses exacerbations</td><td>Crépitants secs, hippocratisme</td><td>J84</td></tr>
<tr><td>Shunt extrapulmonaire</td><td>Shunt intracardiaque, syndrome hépatopulmonaire</td><td>Hypoxémie réfractaire à l’oxygène</td><td>Cardiologie, hépatologie</td></tr></table>
<h3>4.2 Causes de l’insuffisance hypercapnique (type II)</h3>
<table class="t"><tr><th>Maillon</th><th>Causes</th><th>Indice clinique</th></tr>
<tr><td>Commande centrale</td><td>Opioïdes, benzodiazépines, alcool, AVC du tronc cérébral, hypothyroïdie sévère, alcalose métabolique</td><td>Bradypnée, myosis, coma</td></tr>
<tr><td>Moelle et nerfs</td><td>Lésion médullaire cervicale haute, sclérose latérale amyotrophique, syndrome de Guillain-Barré, paralysie phrénique</td><td>Déficit moteur, orthopnée</td></tr>
<tr><td>Jonction neuromusculaire</td><td>Myasthénie, botulisme, curares résiduels</td><td>Ptosis, fatigabilité</td></tr>
<tr><td>Muscles</td><td>Myopathies, hypokaliémie, hypophosphorémie, dénutrition</td><td>Faiblesse proximale, toux faible</td></tr>
<tr><td>Paroi thoracique</td><td>Obésité-hypoventilation, cyphoscoliose sévère, séquelles de thoracoplastie, volet costal</td><td>Morphologie, traumatisme</td></tr>
<tr><td>Charge et espace mort</td><td>BPCO, asthme aigu grave, bronchiectasies, mucoviscidose, obstruction des voies aériennes supérieures</td><td>Distension, stridor</td></tr></table>
<p>Ces deux tableaux se lisent ensemble. La majorité des patients âgés ont plusieurs causes : un patient BPCO obèse qui prend un hypnotique a trois maillons fragilisés. Le médecin cherche donc la cause principale et les facteurs aggravants, car chacun est une cible thérapeutique.</p>
<h3>4.3 Facteurs de décompensation d’une insuffisance chronique</h3>
<p>Une insuffisance chronique stable décompense lorsqu’un événement augmente la charge ou réduit la capacité ou la commande. Les déclencheurs habituels sont l’infection respiratoire, l’insuffisance cardiaque, l’embolie pulmonaire, le pneumothorax, une chirurgie abdominale haute, un sédatif ou un opioïde nouvellement prescrit, l’<button class="w" data-k="j96-o2hyper">oxygène administré sans cible</button> et l’arrêt de la ventilation à domicile. La recherche de ce déclencheur est systématique, car la ventilation ne corrige pas la cause.</p>
<div class="key"><b>À retenir.</b> Le type I relève surtout de causes alvéolaires, vasculaires ou bronchiques ; le type II relève d’un défaut de commande, de nerf, de muscle, de paroi ou d’une charge excessive. Chaque décompensation a un déclencheur à identifier. L’anamnèse permet souvent de le trouver.</div>

</section>

<section class="ilot" id="j96-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit trois buts : estimer la gravité, dater l’insuffisance et identifier la cause. Chez un patient trop dyspnéique pour parler, elle est obtenue auprès des proches, des ambulanciers et du dossier ; elle ne retarde jamais le traitement de support.</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin demande d’abord si le patient a déjà une maladie respiratoire chronique, une <button class="w" data-k="j96-oxld">oxygénothérapie de longue durée</button> ou une <button class="w" data-k="j96-vnid">ventilation à domicile</button>. Ces trois éléments signalent une insuffisance chronique et un risque d’hypercapnie. Il recherche ensuite une maladie neuromusculaire, une obésité importante, une cyphoscoliose, une cardiopathie et une maladie thromboembolique. Il fait la liste complète des médicaments sédatifs : opioïdes, benzodiazépines, hypnotiques, gabapentinoïdes. Il demande enfin si le patient a rédigé des <button class="w" data-k="j96-directives">directives anticipées (intubation, réanimation)</button>, car la décision d’intuber peut survenir dans l’heure.</p>
<h3>5.2 Symptômes, du plus fréquent au plus spécifique</h3>
<p>La <b>dyspnée</b> est le symptôme principal, mais son intensité reflète mal les gaz du sang : un patient sous opioïdes peut être très hypercapnique sans dyspnée, parce que la commande est déprimée. La <button class="w" data-k="j96-orthop">orthopnée (dyspnée en décubitus)</button> oriente vers l’œdème pulmonaire ou vers une faiblesse diaphragmatique. Les <button class="w" data-k="j96-cephal">céphalées matinales et la somnolence diurne (hypoventilation nocturne)</button> signent une hypercapnie chronique qui s’aggrave pendant le sommeil. La confusion, l’agitation ou au contraire l’obnubilation traduisent une hypoxémie ou une narcose au CO₂.</p>
<div class="two">
<div class="card"><h4>Forme typique aiguë</h4><p>Dyspnée rapidement croissante, tachypnée, impossibilité de terminer une phrase, sueurs, angoisse. Le contexte (fièvre, douleur thoracique, sibilants) oriente la cause.</p></div>
<div class="card"><h4>Forme hypercapnique « silencieuse »</h4><p>Somnolence, désorientation, tremblement des mains, peau chaude. Elle s’observe sous opioïdes, sous oxygène excessif ou à la fin d’un épuisement musculaire. La SpO₂ peut être normale.</p></div>
<div class="card"><h4>Forme chronique insidieuse</h4><p>Fatigue, sommeil non réparateur, céphalées au réveil, œdèmes des chevilles, baisse progressive de la tolérance à l’effort. Elle est souvent découverte lors d’une décompensation.</p></div>
<div class="card"><h4>Forme neuromusculaire</h4><p>Orthopnée, toux inefficace, encombrement, voix faible, infections répétées. La dyspnée est tardive, car le patient limite son activité.</p></div></div>
<div class="trap"><span class="k">Piège</span>L’absence de dyspnée n’exclut pas une insuffisance respiratoire. Un patient atteint de myasthénie ou de sclérose latérale amyotrophique peut décompenser avec une fréquence respiratoire peu élevée et peu de plainte, jusqu’à l’arrêt respiratoire.</div>
<div class="key"><b>À retenir.</b> L’anamnèse recherche une maladie chronique, un traitement d’oxygène ou de ventilation, les sédatifs et les directives anticipées. Les céphalées matinales et la somnolence orientent vers l’hypercapnie. L’examen clinique mesure ensuite la gravité.</div>
</section>

<section class="ilot" id="j96-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen évalue d’abord la gravité, puis le maillon défaillant. Il se fait en quelques minutes, pendant la mise en place de la surveillance.</p>
<h3>6.1 État général et signes vitaux</h3>
<p>Chez l’adulte sain au repos, la <button class="w" data-k="j96-fr">fréquence respiratoire (technique de mesure et seuils)</button> est de 12 à 20 par minute, la SpO₂ de 95 à 100 % à basse altitude et la conscience normale. La fréquence respiratoire est le signe vital le plus prédictif d’aggravation : une fréquence supérieure à 25 par minute traduit une charge élevée et compte dans le score NEWS2. La <button class="w" data-k="j96-spo2">saturation pulsée (principe et limites)</button> renseigne sur l’oxygénation, jamais sur le CO₂. L’état de conscience se décrit précisément, avec le score de Glasgow, car sa dégradation est un critère d’intubation.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div class="card"><h4>Signes de lutte</h4><p><button class="w" data-k="j96-tirage">Tirage et mise en jeu des muscles accessoires</button> : contraction des sterno-cléido-mastoïdiens, creusement sus-claviculaire et intercostal. Ils signent une charge que le diaphragme seul ne peut plus assurer.</p></div>
<div class="card"><h4>Signes d’épuisement</h4><p><button class="w" data-k="j96-paradox">Respiration abdominale paradoxale</button> : l’abdomen rentre à l’inspiration. La bradypnée après une tachypnée, les pauses et la baisse de vigilance annoncent un arrêt respiratoire.</p></div>
<div class="card"><h4>Signes d’hypoxémie</h4><p><button class="w" data-k="j96-cyan">Cyanose centrale (lèvres, langue)</button>, tachycardie, agitation, confusion. La cyanose est tardive et absente en cas d’anémie.</p></div>
<div class="card"><h4>Signes d’hypercapnie</h4><p><button class="w" data-k="j96-asterix">Astérixis (tremblement d’attitude des mains)</button>, peau chaude et moite, vasodilatation conjonctivale, pouls bondissant, somnolence.</p></div>
<div class="card"><h4>Signes de chronicité</h4><p>Distension thoracique, hippocratisme digital, polyglobulie, signes de <button class="w" data-k="j96-coeurpulm">cœur pulmonaire</button> : turgescence jugulaire, reflux hépato-jugulaire, œdèmes des membres inférieurs.</p></div>
<div class="card"><h4>Signes d’orientation causale</h4><p>Crépitants (œdème, pneumonie, fibrose), sibilants (obstruction), abolition du murmure vésiculaire (épanchement, pneumothorax), stridor (voies aériennes supérieures), myosis (opioïdes), ptosis (myasthénie).</p></div></div>
<p>Chez le patient neuromusculaire, l’examen ajoute la force de la toux et le comptage à voix haute sur une seule inspiration. Un adulte sain compte au-delà de 30 ; un patient qui ne dépasse pas 15 a habituellement une capacité vitale effondrée. Ce test, simple au lit, ne remplace pas la mesure de la capacité vitale, présentée dans l’onglet Examens.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Une SpO₂ de 98 % sous oxygène est rassurante sur l’oxygénation, mais elle ne dit rien de la ventilation. La patiente de l’îlot 0 avait une SpO₂ de 99 % et une acidose respiratoire grave. Chez tout patient somnolent ou à risque d’hypercapnie, la gazométrie est indispensable.</div>
<div class="key"><b>À retenir.</b> La fréquence respiratoire, la conscience et la respiration paradoxale mesurent la gravité. L’astérixis et la somnolence orientent vers l’hypercapnie. La SpO₂ ne mesure jamais le CO₂. La démarche diagnostique organise ces données.</div>
</section>

<section class="ilot" id="j96-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche répond à quatre questions successives : le patient est-il en insuffisance respiratoire, de quel type, depuis quand, et pour quelle cause ? Les trois premières se résolvent avec une seule <button class="w" data-k="j96-gds">gazométrie artérielle (prélèvement et lecture)</button>, interprétée avec la FiO₂ au moment du prélèvement.</p>
<h3>7.1 Étape 1 : confirmer et typer</h3>
<p>Le médecin lit d’abord le pH, puis la PaCO₂, puis le bicarbonate, puis la PaO₂ rapportée à la FiO₂. Un pH &lt; 7,35 avec une PaCO₂ &gt; 6,0 kPa définit une acidose respiratoire. Une PaO₂ basse avec une PaCO₂ basse ou normale définit le type I.</p>
<h3>7.2 Étape 2 : dater par la compensation</h3>
<p>Le bicarbonate mesuré se compare au bicarbonate attendu. Chez la patiente de l’îlot 0, la PaCO₂ dépasse la normale de 34 mmHg. Si l’hypercapnie était purement aiguë, le bicarbonate attendu serait d’environ 24 + 3,4 = 27 mmol/L. Si elle était purement chronique, il serait d’environ 24 + 12 = 36 mmol/L. Le bicarbonate mesuré de 31 mmol/L se situe entre les deux : il s’agit d’une acidose respiratoire aiguë sur chronique.</p>
<h3>7.3 Étape 3 : localiser le maillon par le gradient alvéolo-artériel</h3>
<p>Le <button class="w" data-k="j96-aa">gradient alvéolo-artériel</button> se calcule de façon fiable en air ambiant. Exemple 1 : un homme de 28 ans retrouvé somnolent après une prise d’héroïne a, en air ambiant, une PaO₂ de 55 mmHg et une PaCO₂ de 70 mmHg. La PAO₂ calculée vaut 150 − 70/0,8 ≈ 62 mmHg ; le gradient est de 7 mmHg, donc normal. L’hypoxémie s’explique entièrement par l’hypoventilation : la naloxone et la ventilation corrigent tout. Exemple 2 : une femme de 60 ans atteinte de pneumonie a une PaO₂ de 52 mmHg et une PaCO₂ de 32 mmHg. La PAO₂ vaut 150 − 40 = 110 mmHg ; le gradient de 58 mmHg prouve une atteinte de l’échangeur.</p>
<h3>7.4 Étape 4 : chercher la cause</h3>
<p>La cause se cherche avec un bilan ciblé : radiographie thoracique, électrocardiogramme, biologie avec peptide natriurétique, troponine selon le contexte, échographie pulmonaire et cardiaque au lit, angio-TDM si une embolie est suspectée. Le détail de chaque examen figure dans l’onglet Examens.</p>

<p>La figure se parcourt de haut en bas. Le premier embranchement repose sur la PaCO₂, et non sur la PaO₂. Le second sépare la pompe pure du poumon. L’erreur fréquente consiste à calculer un gradient sous lunettes nasales sans connaître la FiO₂ réelle : le résultat n’a alors qu’une valeur d’ordre de grandeur.</p>
<h3>7.5 Diagnostics différentiels hiérarchisés par gravité</h3>
<p>Trois situations miment une insuffisance respiratoire ou la compliquent et doivent être reconnues en premier. Une <b>intoxication au monoxyde de carbone</b> donne une SpO₂ faussement normale, car l’oxymètre confond carboxyhémoglobine et oxyhémoglobine. Une <b>méthémoglobinémie</b> donne une SpO₂ autour de 85 % qui ne répond pas à l’oxygène, avec une PaO₂ normale. Une <b>acidose métabolique</b> sévère provoque une polypnée sans insuffisance respiratoire : la PaCO₂ est basse, adaptée. Enfin, une <b>hyperventilation d’angoisse</b> donne une dyspnée intense avec une PaO₂ normale et une PaCO₂ basse ; ce diagnostic ne se pose qu’après exclusion d’une embolie pulmonaire, qui produit la même alcalose respiratoire.</p>
<div class="quiz ui"><p>Un homme de 66 ans, BPCO connue, a en air ambiant un pH de 7,37, une PaCO₂ de 7,6 kPa (57 mmHg), un bicarbonate de 32 mmol/L et une PaO₂ de 7,1 kPa (53 mmHg). Il se sent dans son état habituel. Quelle est la conclusion ?</p><button data-ok="0">Insuffisance respiratoire aiguë hypercapnique nécessitant une ventilation non invasive</button><button data-ok="1">Insuffisance respiratoire chronique hypercapnique compensée</button><button data-ok="0">Insuffisance respiratoire de type I</button><p class="fb" hidden>Le pH est normal et le bicarbonate élevé correspond à une compensation chronique : pour 17 mmHg au-dessus de la normale, le bicarbonate attendu est d’environ 30 à 31 mmol/L. Il s’agit d’une insuffisance chronique de type II (J96.11). La ventilation non invasive aiguë n’est pas indiquée sans acidose ; l’indication d’une oxygénothérapie de longue durée et d’une ventilation à domicile se discute en état stable.</p></div>
<div class="key"><b>À retenir.</b> Quatre questions structurent la démarche : confirmer, typer par la PaCO₂, dater par le bicarbonate, localiser par le gradient alvéolo-artériel. L’oxymétrie trompe dans l’intoxication au monoxyde de carbone et la méthémoglobinémie. La gravité se juge ensuite, et elle prime sur la recherche de la cause.</div>
</section>
