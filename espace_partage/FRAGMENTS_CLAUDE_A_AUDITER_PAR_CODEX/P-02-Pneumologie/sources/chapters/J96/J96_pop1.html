
<!-- ===== FENÊTRES : physiopathologie ===== -->
<template data-pop="j96-pompe" data-title="Pompe ventilatoire">
<div class="lab">Définition</div><p>La pompe ventilatoire regroupe tout ce qui renouvelle l’air alvéolaire : les centres respiratoires du tronc cérébral, la moelle cervicale, les nerfs phréniques et intercostaux, la jonction neuromusculaire, les muscles respiratoires et la paroi thoracique avec la plèvre et l’abdomen.</p>
<div class="lab">Pourquoi la distinguer du poumon</div><p>La défaillance de la pompe diminue la ventilation alvéolaire et élève la PaCO₂ ; le poumon peut être parfaitement sain. Un patient myasthénique en crise a des alvéoles normales : l’oxygène corrige sa saturation, mais seule la ventilation corrige son CO₂.</p>
<div class="lab">Conséquence pratique</div><p>Devant une hypercapnie, le médecin cherche quel maillon de la pompe cède : commande (opioïdes), nerf ou muscle (neuromusculaire), paroi (obésité, cyphoscoliose) ou charge excessive (BPCO). Le traitement de support est la ventilation, non l’oxygène seul.</p></template>
<template data-pop="j96-aa" data-title="Équation des gaz alvéolaires et gradient alvéolo-artériel">
<div class="lab">Formule</div><p>PAO₂ = FiO₂ × (pression barométrique − 47) − PaCO₂/0,8, en mmHg. Le chiffre 47 est la pression de vapeur d’eau à 37 °C ; 0,8 est le quotient respiratoire habituel. Au niveau de la mer en air ambiant : PAO₂ ≈ 150 − PaCO₂/0,8. Le gradient vaut PAO₂ − PaO₂.</p>
<div class="lab">Valeur normale</div><p>Environ 5 à 15 mmHg chez l’adulte jeune ; il augmente avec l’âge (approximation courante : âge/4 + 4 mmHg). Exemple : à 80 ans, un gradient de 22 mmHg peut être normal.</p>
<div class="lab">Interprétation</div><p>Hypoxémie avec gradient normal : hypoventilation ou baisse de la pression inspirée (altitude). Gradient élevé : inégalité ventilation-perfusion, shunt ou trouble de diffusion, donc atteinte de l’échangeur.</p>
<div class="lab">Limites</div><p>Le calcul suppose une FiO₂ connue. Sous lunettes nasales, la FiO₂ réelle est inconnue et le gradient approximatif. Le gradient augmente aussi avec la FiO₂, ce qui rend le rapport PaO₂/FiO₂ préférable sous oxygène.</p></template>
<template data-pop="j96-compens" data-title="Compensation rénale de l’acidose respiratoire">
<div class="lab">Mécanisme</div><p>L’hypercapnie acidifie les cellules tubulaires. Le rein augmente la sécrétion d’ions H⁺, l’excrétion d’ammonium et la réabsorption du bicarbonate filtré. Le bicarbonate plasmatique monte en trois à cinq jours.</p>
<div class="lab">Règles chiffrées</div><p>Pour 10 mmHg de PaCO₂ au-dessus de 40 mmHg : bicarbonate +1 mmol/L en aigu (tampons cellulaires seuls) ; +3,5 à 4 mmol/L en chronique. Exemple : PaCO₂ 60 mmHg chronique, bicarbonate attendu 31 à 32 mmol/L.</p>
<div class="lab">Usage</div><p>Un bicarbonate supérieur à l’attendu révèle une alcalose métabolique associée ; inférieur, une acidose métabolique associée. Un bicarbonate élevé à l’admission prouve une hypercapnie antérieure.</p>
<div class="lab">Piège</div><p>L’insuffisance rénale limite cette compensation ; un patient dialysé hypercapnique a un pH plus bas que prévu.</p></template>
<template data-pop="j96-vaq" data-title="Inégalité ventilation-perfusion">
<div class="lab">Définition</div><p>Coexistence de zones pulmonaires dont la ventilation est faible par rapport à leur perfusion et de zones où elle est excessive. C’est la cause la plus fréquente d’hypoxémie.</p>
<div class="lab">Mécanisme</div><p>Le sang qui traverse une zone peu ventilée sort moins oxygéné. Les zones bien ventilées ne compensent pas, car leur sang est déjà presque saturé (plateau de la courbe de dissociation).</p>
<div class="lab">Réponse à l’oxygène</div><p>Bonne : l’oxygène augmente la PAO₂ même dans les zones peu ventilées. Un patient BPCO passe souvent de 84 % à 92 % avec 1 à 2 L/min.</p>
<div class="lab">Conséquence pratique</div><p>Un faible débit suffit ; un débit élevé expose au risque d’hypercapnie en levant la vasoconstriction hypoxique.</p></template>
<template data-pop="j96-shunt" data-title="Shunt droit-gauche">
<div class="lab">Définition</div><p>Passage de sang veineux vers la circulation artérielle sans contact avec un gaz alvéolaire. Le shunt intrapulmonaire résulte d’alvéoles perfusées mais comblées ou collabées ; le shunt extrapulmonaire est intracardiaque ou vasculaire.</p>
<div class="lab">Réponse à l’oxygène</div><p>Faible : l’oxygène n’atteint pas le sang shunté. Au-delà d’une fraction de shunt d’environ 30 %, augmenter la FiO₂ ne relève presque plus la PaO₂.</p>
<div class="lab">Traitement</div><p>Rouvrir les alvéoles par une pression positive (PEP, haut débit nasal, pression positive continue, ventilation) et traiter la cause : drainer un épanchement, traiter l’œdème, l’atélectasie ou la pneumonie.</p>
<div class="lab">Exemple</div><p>Une patiente atteinte de pneumonie lobaire bilatérale reste à PaO₂ 8 kPa sous masque à réservoir ; elle a besoin d’un haut débit nasal ou d’une pression positive, et non d’un débit d’oxygène plus élevé.</p></template>
<template data-pop="j96-hypovent" data-title="Hypoventilation alvéolaire">
<div class="lab">Définition</div><p>Ventilation alvéolaire insuffisante pour éliminer le CO₂ produit ; la PaCO₂ dépasse 6,0 kPa (45 mmHg).</p>
<div class="lab">Effet sur l’oxygène</div><p>Le CO₂ accumulé occupe l’espace alvéolaire : la PAO₂ baisse de 1,25 mmHg par mmHg de PaCO₂ supplémentaire. Le gradient alvéolo-artériel reste normal si le poumon est sain.</p>
<div class="lab">Causes</div><p>Dépression de la commande (opioïdes, sédatifs), maladie neuromusculaire, paroi rigide ou lourde, charge excessive avec espace mort élevé.</p>
<div class="lab">Piège</div><p>L’oxygène corrige l’hypoxémie de l’hypoventilation et masque la hausse progressive du CO₂ si l’on ne surveille que la SpO₂.</p></template>
<template data-pop="j96-diff" data-title="Trouble de la diffusion">
<div class="lab">Définition</div><p>Ralentissement du passage de l’oxygène à travers la barrière alvéolo-capillaire épaissie ou réduite en surface.</p>
<div class="lab">Quand il compte</div><p>Au repos, le sang s’équilibre normalement en un tiers du temps de transit capillaire, ce qui laisse une réserve. À l’effort, le transit raccourcit et l’équilibre n’est plus atteint : la désaturation d’effort est typique des pneumopathies interstitielles.</p>
<div class="lab">Mesure</div><p>La DLCO (capacité de diffusion du monoxyde de carbone) le quantifie ; elle baisse aussi dans l’emphysème et les maladies vasculaires pulmonaires.</p></template>
<template data-pop="j96-charge" data-title="Balance charge, capacité et commande">
<div class="lab">Principe</div><p>La ventilation est maintenue tant que la capacité des muscles respiratoires, entraînés par une commande suffisante, dépasse la charge imposée par les résistances, l’élastance et la distension.</p>
<div class="lab">Augmentent la charge</div><p>Bronchospasme, sécrétions, distension dynamique avec PEP intrinsèque, œdème, fibrose, obésité, ascite, fièvre et sepsis (production de CO₂ accrue).</p>
<div class="lab">Diminuent la capacité</div><p>Maladie neuromusculaire, distension qui aplatit le diaphragme, hypokaliémie, hypophosphorémie, dénutrition, acidose, corticostéroïdes au long cours.</p>
<div class="lab">Conséquence</div><p>Quand la charge dépasse la capacité, le patient adopte une respiration rapide et superficielle, puis s’épuise. La ventilation non invasive soulage la charge et donne le temps de traiter la cause.</p></template>
<template data-pop="j96-o2hyper" data-title="Hypercapnie induite par l’oxygène">
<div class="lab">Constat</div><p>Chez un patient BPCO ou hypoventilant, un oxygène à haut débit peut élever la PaCO₂ et abaisser le pH en 30 à 60 minutes.</p>
<div class="lab">Mécanismes</div><p>1. Levée de la vasoconstriction hypoxique : le sang revient vers des zones mal ventilées, l’espace mort fonctionnel augmente. 2. Effet Haldane : l’hémoglobine oxygénée libère son CO₂. 3. Baisse modérée de la commande respiratoire, mécanisme le moins important.</p>
<div class="lab">Prévention</div><p>Cible de SpO₂ 88–92 %, masque Venturi 24 ou 28 %, gazométrie à 30–60 minutes.</p>
<div class="lab">Piège</div><p>Arrêter brutalement l’oxygène provoque une hypoxémie de rebond dangereuse ; on réduit vers la cible.</p></template>
<template data-pop="j96-coeurpulm" data-title="Cœur pulmonaire">
<div class="lab">Définition</div><p>Hypertrophie et dilatation du ventricule droit secondaires à une hypertension pulmonaire d’origine respiratoire.</p>
<div class="lab">Mécanisme</div><p>L’hypoxie alvéolaire chronique contracte puis remodèle les artérioles pulmonaires ; l’acidose renforce cette vasoconstriction. La postcharge du ventricule droit augmente.</p>
<div class="lab">Signes</div><p>Turgescence jugulaire, reflux hépato-jugulaire, œdèmes, hépatomégalie ; à l’échocardiographie, dilatation du ventricule droit et pression pulmonaire estimée élevée.</p>
<div class="lab">Conséquence</div><p>Sa présence abaisse le seuil de l’oxygène de longue durée à une PaO₂ ≤ 8,0 kPa. Le traitement principal est la correction de l’hypoxémie ; voir <a href="#/entry/I27">I27 — Hypertension pulmonaire (P-02-Pneumologie)</a>.</p></template>
<template data-pop="j96-hothmv" data-title="Essai HOT-HMV (JAMA 2017)">
<div class="lab">Question</div><p>Ajouter une ventilation non invasive à domicile à l’oxygène réduit-il les réadmissions et les décès après une exacerbation hypercapnique de BPCO ?</p>
<div class="lab">Population</div><p>116 patients britanniques encore hypercapniques (PaCO₂ &gt; 53 mmHg, soit 7 kPa) deux à quatre semaines après la correction de l’acidose ; exclusion de l’obésité (indice de masse corporelle &gt; 35) et des apnées obstructives.</p>
<div class="lab">Réglages</div><p>Pression inspiratoire médiane 24 cmH₂O, pression expiratoire 4 cmH₂O, fréquence de sécurité 14 par minute.</p>
<div class="lab">Résultat</div><p>Délai médian jusqu’à réadmission ou décès : 4,3 mois contre 1,4 mois (rapport de risque ajusté 0,49). Risque à douze mois : 63,4 % contre 80,4 %.</p>
<div class="lab">Limite</div><p>Essai ouvert, de taille modeste ; la mortalité seule n’a pas différé significativement.</p></template>
