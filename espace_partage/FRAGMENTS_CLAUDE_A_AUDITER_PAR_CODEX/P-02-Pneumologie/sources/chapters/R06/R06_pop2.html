
<!-- ===== FENÊTRES R06 : examen, urgences, démarche, situations particulières ===== -->
<template data-pop="r06-x-fr" data-title="Fréquence respiratoire">
<div class="lab">Technique</div><p>Le médecin compte les mouvements thoraciques pendant 30 secondes au moins, idéalement 60 secondes, sans prévenir le patient, par exemple en gardant la main sur le pouls. Prévenir le patient modifie sa respiration.</p>
<div class="lab">Valeurs</div><p>Chez l’adulte au repos, la fréquence normale se situe entre 12 et 20 par minute. Dans le score NEWS2, une fréquence de 21 à 24 donne 2 points, une fréquence d’au moins 25 donne 3 points, une fréquence de 9 à 11 donne 1 point et une fréquence de 8 ou moins donne 3 points.</p>
<div class="lab">Valeur clinique</div><p>La tachypnée est un signe précoce et sensible de détérioration, qui précède souvent la baisse de saturation. Une fréquence supérieure à 30 par minute fait partie des critères de pneumonie grave.</p>
<div class="lab">Piège</div><p>La fréquence est souvent estimée au lieu d’être comptée, et notée « 16 » par habitude. Une fréquence basse chez un patient somnolent peut traduire un épuisement ou une intoxication et non une amélioration.</p></template>

<template data-pop="r06-x-spo" data-title="Oxymétrie de pouls : lecture, cibles et pièges">
<div class="lab">Principe</div><p>L’oxymètre mesure l’absorption de deux longueurs d’onde, rouge et infrarouge, par le sang pulsatile, et en déduit la proportion d’hémoglobine oxygénée.</p>
<div class="lab">Lecture</div><p>Le médecin attend un signal stable avec une onde de pouls régulière et note la fraction d’oxygène administrée. Chez l’adulte sain au niveau de la mer, la saturation se situe entre 95 et 100 %.</p>
<div class="lab">Pièges</div><p>Une mauvaise perfusion, le froid, les mouvements et certains vernis faussent la mesure. L’oxymètre standard confond la carboxyhémoglobine avec l’oxyhémoglobine et surestime la saturation dans l’intoxication au monoxyde de carbone. La pigmentation cutanée foncée peut faire surestimer la saturation, ce qui risque de masquer une hypoxémie.</p>
<div class="lab">Limite</div><p>La saturation ne renseigne ni sur la PaCO₂, ni sur le pH, ni sur l’hémoglobine. Sous oxygène, une saturation normale peut masquer une hypoventilation sévère.</p></template>

<template data-pop="r06-x-tirage" data-title="Muscles accessoires, tirage et respiration paradoxale">
<div class="lab">Observation</div><p>Le médecin découvre le thorax et le cou. Il recherche la contraction des sterno-cléido-mastoïdiens et des scalènes à l’inspiration, la dépression des espaces intercostaux et du creux sus-sternal (tirage), le battement des ailes du nez et l’expiration active des muscles abdominaux.</p>
<div class="lab">Respiration paradoxale</div><p>Normalement, le thorax et l’abdomen se soulèvent ensemble à l’inspiration. Lorsque le diaphragme est fatigué ou paralysé, la dépression intrathoracique l’aspire vers le haut : l’abdomen se creuse pendant que le thorax se soulève.</p>
<div class="lab">Valeur</div><p>Ces signes traduisent une charge respiratoire que les muscles ne pourront pas soutenir longtemps. La respiration paradoxale annonce l’épuisement et impose une assistance ventilatoire rapide.</p>
<div class="lab">Piège</div><p>Chez le sujet âgé ou cachectique, ces signes peuvent manquer jusqu’à l’arrêt respiratoire.</p></template>

<template data-pop="r06-x-cyanose" data-title="Cyanose">
<div class="lab">Définition</div><p>La cyanose est une coloration bleutée de la peau et des muqueuses. Elle apparaît lorsque la concentration d’hémoglobine désoxygénée dans les capillaires dépasse environ 50 g/L.</p>
<div class="lab">Centrale ou périphérique</div><p>La cyanose centrale touche la langue et les lèvres ; elle traduit une hypoxémie artérielle. La cyanose périphérique touche les extrémités froides avec une langue rose ; elle traduit un ralentissement circulatoire.</p>
<div class="lab">Pièges</div><p>Chez l’anémique, la quantité d’hémoglobine désoxygénée nécessaire peut ne jamais être atteinte : une hypoxémie sévère existe sans cyanose. Une méthémoglobinémie donne une cyanose avec une PaO₂ normale. La cyanose est un signe tardif et inconstant.</p></template>

<template data-pop="r06-x-auscult" data-title="Bruits respiratoires anormaux">
<div class="lab">Sibilants</div><p>Bruits continus, aigus et musicaux, surtout expiratoires, produits par des bronches rétrécies. Diffus : asthme, BPCO, œdème pulmonaire. Localisés et fixes : obstacle bronchique.</p>
<div class="lab">Stridor</div><p>Bruit continu aigu, surtout inspiratoire, plus fort au cou qu’au thorax, produit par un rétrécissement laryngé ou trachéal.</p>
<div class="lab">Ronchi</div><p>Bruits graves produits par des sécrétions dans les grosses bronches ; ils se modifient après la toux.</p>
<div class="lab">Crépitants</div><p>Bruits discontinus, fins, de fin d’inspiration, produits par l’ouverture brutale de petites voies aériennes ou d’alvéoles collabées : œdème pulmonaire, pneumonie, fibrose pulmonaire.</p>
<div class="lab">Silence auscultatoire</div><p>Absence de bruit dans un asthme aigu grave : le débit d’air est trop faible pour produire un son. C’est un signe de menace vitale.</p>
<div class="lab">Technique</div><p>Le médecin ausculte le cou en plus du thorax lorsqu’un bruit est entendu à distance, pour distinguer un stridor de sibilants.</p></template>

<template data-pop="r06-x-jug" data-title="Turgescence jugulaire, reflux hépato-jugulaire et œdèmes">
<div class="lab">Technique</div><p>Le patient est incliné à 45 degrés, tête légèrement tournée. Le médecin repère le sommet de la pulsation de la veine jugulaire interne et mesure sa hauteur verticale au-dessus de l’angle sternal ; plus de 3 à 4 cm évoque une pression veineuse centrale élevée.</p>
<div class="lab">Reflux hépato-jugulaire</div><p>Une pression abdominale ferme de 10 à 15 secondes élève la colonne jugulaire de façon soutenue lorsque le ventricule droit ne peut accepter le retour veineux supplémentaire.</p>
<div class="lab">Œdèmes</div><p>Des œdèmes déclives, prenant le godet, bilatéraux, orientent vers une rétention hydrosodée ; unilatéraux, ils font rechercher une thrombose veineuse.</p>
<div class="lab">Piège</div><p>Ces signes orientent vers une pression veineuse élevée, mais une turgescence jugulaire existe aussi dans l’embolie massive, la tamponnade et le pneumothorax sous tension.</p></template>

<template data-pop="r06-x-paleur" data-title="Pâleur et anémie">
<div class="lab">Technique</div><p>Le médecin examine la conjonctive palpébrale inférieure, les paumes et les lits unguéaux, à la lumière du jour si possible.</p>
<div class="lab">Valeur</div><p>Une pâleur nette rend une anémie probable ; son absence n’exclut pas une anémie modérée.</p>
<div class="lab">Mécanisme de la dyspnée</div><p>L’anémie réduit le contenu artériel en oxygène. L’organisme compense par une augmentation du débit cardiaque et de la ventilation à l’effort ; la dyspnée apparaît à un effort plus faible.</p>
<div class="lab">Conséquence</div><p>Une hémoglobine est demandée devant toute dyspnée d’effort inexpliquée ; une anémie sévère chez un coronarien peut déclencher une ischémie.</p></template>

<template data-pop="r06-x-patterns" data-title="Rythmes respiratoires anormaux">
<div class="lab">Kussmaul</div><p>Respiration ample, profonde et régulière, souvent rapide, qui compense une acidose métabolique : acidocétose diabétique, insuffisance rénale, intoxications.</p>
<div class="lab">Cheyne-Stokes</div><p>Alternance d’une amplitude croissante puis décroissante et d’apnées centrales : insuffisance cardiaque, accident vasculaire cérébral, altitude.</p>
<div class="lab">Biot (ataxique)</div><p>Cycles irréguliers d’amplitude variable, séparés de pauses imprévisibles : lésion du bulbe, opioïdes. Elle annonce souvent un arrêt respiratoire.</p>
<div class="lab">Soupirs répétés</div><p>Inspirations profondes isolées interrompant une respiration normale : dyspnée suspirieuse, souvent bénigne.</p>
<div class="lab">Technique</div><p>L’observation dure au moins une minute, parce qu’un cycle de Cheyne-Stokes peut durer autant.</p></template>

<template data-pop="r06-news2" data-title="Score NEWS2 (score national d’alerte précoce, version 2)">
<div class="lab">Principe</div><p>Le score additionne des points pour la fréquence respiratoire, la saturation, l’oxygène administré, la pression artérielle systolique, la fréquence cardiaque, l’état de conscience et la température. Il a été publié par le Royal College of Physicians britannique en 2017.</p>
<div class="lab">Paramètres respiratoires</div><p>Fréquence respiratoire : 3 points à 8 ou moins, 1 point de 9 à 11, 0 de 12 à 20, 2 points de 21 à 24, 3 points à 25 ou plus. Saturation (échelle habituelle) : 3 points à 91 % ou moins, 2 points de 92 à 93 %, 1 point de 94 à 95 %, 0 à 96 % ou plus ; 2 points supplémentaires si le patient reçoit de l’oxygène.</p>
<div class="lab">Seuils d’action</div><p>Un paramètre à 3 points ou un total de 5 impose une évaluation médicale urgente ; un total d’au moins 7 impose une réponse d’urgence par une équipe capable de soins critiques.</p>
<div class="lab">Limite</div><p>Une seconde échelle de saturation (88 à 92 %) s’applique aux patients à risque d’hypercapnie. Le score aide à détecter une détérioration ; il ne pose pas de diagnostic.</p></template>

<template data-pop="r06-abcde" data-title="Évaluation ABCDE">
<div class="lab">Principe</div><p>Le médecin examine dans l’ordre A (« airway », voies aériennes), B (« breathing », ventilation), C (« circulation »), D (« disability », état neurologique) et E (« exposure », exposition du corps), et corrige chaque défaillance avant de passer à la lettre suivante.</p>
<div class="lab">Dans la dyspnée</div><p>A : le patient parle-t-il, existe-t-il un stridor, une salive non avalée ? B : fréquence respiratoire, saturation, tirage, auscultation. C : pouls, pression artérielle, temps de recoloration, marbrures. D : conscience, glycémie capillaire. E : éruption, œdème des membres, signes de thrombose.</p>
<div class="lab">Pourquoi cet ordre</div><p>Une obstruction des voies aériennes tue en minutes ; une hypoxémie en minutes à heures ; une défaillance circulatoire ensuite. L’ordre suit le délai dans lequel chaque défaillance devient mortelle.</p>
<div class="lab">Remarque</div><p>Les lettres viennent de termes anglais ; le cours les traduit pour éviter toute abréviation non définie.</p></template>

<template data-pop="r06-angio" data-title="Angiœdème histaminique et bradykinique">
<div class="lab">Définition</div><p>L’angiœdème est un œdème localisé du derme profond et de la sous-muqueuse. Atteignant la langue, le plancher buccal ou le larynx, il menace les voies aériennes.</p>
<div class="lab">Forme histaminique</div><p>Elle survient dans l’anaphylaxie et l’urticaire. Elle s’accompagne souvent d’urticaire et de prurit, et répond à l’adrénaline, aux antihistaminiques et aux corticostéroïdes.</p>
<div class="lab">Forme bradykinique</div><p>Elle survient sous inhibiteurs de l’enzyme de conversion, sous sacubitril-valsartan ou gliptines, et dans le déficit héréditaire ou acquis en inhibiteur de la C1 estérase. Elle ne s’accompagne pas d’urticaire et répond mal à l’adrénaline et aux antihistaminiques. Dans la forme due aux inhibiteurs de l’enzyme de conversion, l’icatibant n’a pas fait mieux que le placebo dans un essai randomisé de 121 patients (Sinert 2017).</p>
<div class="lab">Conduite</div><p>Le médecin sécurise les voies aériennes avec l’équipe d’anesthésie et d’oto-rhino-laryngologie, arrête définitivement l’inhibiteur de l’enzyme de conversion et adresse le patient à un allergologue lorsqu’un déficit héréditaire est possible. Le cours T78 détaille l’anaphylaxie.</p></template>

<template data-pop="r06-epiglottite" data-title="Épiglottite (supraglottite)">
<div class="lab">Description</div><p>Infection bactérienne de l’épiglotte et des structures supraglottiques. Depuis la vaccination contre <i>Haemophilus influenzae</i> de type b, elle est devenue rare chez l’enfant et touche surtout l’adulte.</p>
<div class="lab">Signes</div><p>Douleur de gorge intense contrastant avec un pharynx peu inflammatoire, odynophagie, hypersalivation, voix étouffée, fièvre, position assise penchée en avant ; stridor tardif.</p>
<div class="lab">Conduite</div><p>Le patient reste assis, au calme. L’examen de la gorge et la nasofibroscopie se font seulement là où une intubation difficile ou une trachéotomie sont possibles. Une antibiothérapie intraveineuse est débutée selon le protocole local.</p>
<div class="lab">Piège</div><p>Une douleur de gorge intense avec un examen buccal normal ne doit pas être banalisée : l’épiglotte se situe hors de vue de l’abaisse-langue.</p></template>

<template data-pop="r06-corps" data-title="Corps étranger des voies aériennes">
<div class="lab">Contexte</div><p>Il touche surtout le jeune enfant (aliments, petits jouets) et le sujet âgé avec trouble de la déglutition.</p>
<div class="lab">Signes</div><p>Syndrome de pénétration : toux brutale, suffocation pendant un repas ou un jeu. Ensuite, stridor si l’objet est laryngé ou trachéal ; sifflement localisé, diminution unilatérale du murmure ou pneumonies récidivantes si l’objet est bronchique.</p>
<div class="lab">Conduite</div><p>Si le patient tousse efficacement, on l’encourage à tousser. Si la toux devient inefficace et le patient conscient, on alterne tapes dans le dos et compressions abdominales chez l’adulte et l’enfant de plus d’un an, ou compressions thoraciques chez le nourrisson, selon les recommandations de réanimation en vigueur. La bronchoscopie extrait l’objet.</p>
<div class="lab">Piège</div><p>Une radiographie normale n’exclut pas un corps étranger, car beaucoup d’objets ne sont pas radio-opaques.</p></template>

<template data-pop="r06-croup" data-title="Croup viral (laryngotrachéite aiguë)">
<div class="lab">Description</div><p>Infection virale, surtout par le virus parainfluenza, qui provoque un œdème sous-glottique. Elle touche surtout l’enfant de 6 mois à 3 ans, en automne et en hiver.</p>
<div class="lab">Signes</div><p>Toux aboyante, voix rauque, stridor inspiratoire, souvent nocturnes, après un rhume. L’état général reste conservé.</p>
<div class="lab">Gravité</div><p>Le score de Westley cote le stridor, le tirage, l’entrée d’air, la cyanose et la conscience de 0 à 17 ; un score de 2 ou moins correspond à une forme légère, de 3 à 7 à une forme modérée, de 8 à 11 à une forme sévère, et un score d’au moins 12 à une insuffisance respiratoire imminente.</p>
<div class="lab">Traitement</div><p>Une dose de dexaméthasone par voie orale pour toutes les formes, et de l’adrénaline nébulisée pour les formes modérées à sévères, avec surveillance après l’administration.</p>
<div class="lab">Piège</div><p>Fièvre élevée, aspect toxique et absence de toux aboyante font évoquer une épiglottite ou une trachéite bactérienne.</p></template>

<template data-pop="r06-ronfl" data-title="Ronflement et respiration buccale">
<div class="lab">Mécanisme</div><p>Pendant le sommeil, le tonus des muscles dilatateurs du pharynx diminue. Le flux d’air fait vibrer le voile du palais et les parois pharyngées ; une réduction plus importante du calibre provoque des hypopnées et des apnées obstructives.</p>
<div class="lab">Quand s’inquiéter</div><p>Pauses respiratoires observées, réveils avec étouffement, somnolence diurne, hypertension résistante, fibrillation auriculaire, obésité. Chez l’enfant, respiration buccale permanente, sommeil agité, énurésie, troubles de l’attention ou croissance ralentie.</p>
<div class="lab">Démarche</div><p>Chez l’adulte, le questionnaire STOP-BANG estime la probabilité d’apnées, et une polygraphie ou une polysomnographie confirme le diagnostic. Chez l’enfant, l’hypertrophie des amygdales et des végétations est la cause la plus fréquente.</p>
<div class="lab">Renvoi</div><p>Le syndrome d’apnées du sommeil se code G47.3 et relève d’un cours propre.</p></template>

<template data-pop="r06-eternu" data-title="Éternuement">
<div class="lab">Mécanisme</div><p>L’irritation des terminaisons du nerf trijumeau dans la muqueuse nasale déclenche, par un centre du tronc cérébral, une inspiration profonde puis une expiration explosive à glotte d’abord fermée.</p>
<div class="lab">Causes</div><p>Rhinite allergique (salves d’éternuements, prurit, rhinorrhée claire), rhinite virale, irritants, réflexe photique (éternuement à l’exposition brutale à la lumière vive), rarement formes psychogènes.</p>
<div class="lab">Signes d’alerte</div><p>Obstruction nasale unilatérale, épistaxis répétées, rhinorrhée claire unilatérale après un traumatisme (fuite de liquide cérébrospinal).</p>
<div class="lab">Conséquence</div><p>Des éternuements isolés n’imposent pas d’examen ; une rhinite allergique se traite selon les recommandations de rhinologie et d’allergologie.</p></template>

<template data-pop="r06-nijmegen" data-title="Questionnaire de Nijmegen">
<div class="lab">Contenu</div><p>Le questionnaire recense 16 symptômes (oppression, respiration rapide, paresthésies, vertiges, palpitations, mains froides, anxiété, entre autres) cotés de 0 (jamais) à 4 (très souvent) ; le score maximal est de 64.</p>
<div class="lab">Interprétation</div><p>Un score d’au moins 23 est le seuil couramment utilisé pour évoquer une hyperventilation fonctionnelle. L’article de validation de 1985 rapportait une sensibilité de 91 % et une spécificité de 95 %, mais en comparant des patients à des soignants en bonne santé ; ce seuil n’a pas été lu dans l’article original pour ce cours.</p>
<div class="lab">Limite</div><p>Le questionnaire ne distingue pas une hyperventilation fonctionnelle d’une hyperventilation secondaire à une embolie ou à un asthme. Il sert au repérage et au suivi, après l’exclusion d’une cause organique.</p></template>

<template data-pop="r06-sachet" data-title="Pourquoi le sac en papier est dangereux">
<div class="lab">Principe supposé</div><p>Respirer dans un sac fait inhaler à nouveau l’air expiré, riche en dioxyde de carbone, ce qui remonte la PaCO₂ et corrige l’alcalose.</p>
<div class="lab">Danger démontré</div><p>Chez des volontaires sains, Callaham (1989) a mesuré une baisse moyenne de la pression en oxygène de l’air du sac d’environ 16 mmHg après 30 secondes et de plus de 25 mmHg après trois minutes. L’auteur rapporte trois décès de patients traités ainsi alors qu’ils étaient hypoxémiques ou en ischémie myocardique.</p>
<div class="lab">Conduite</div><p>Le médecin exclut d’abord une cause organique, puis explique le mécanisme et guide une respiration lente, abdominale, avec une expiration prolongée.</p></template>

<template data-pop="r06-hoquet-causes" data-title="Causes du hoquet persistant ou rebelle">
<div class="lab">Digestives</div><p>Reflux gastro-œsophagien, distension gastrique, œsophagite, hernie hiatale, pathologies hépatobiliaires, abcès sous-phrénique, cancer de l’œsophage ou de l’estomac.</p>
<div class="lab">Thoraciques</div><p>Péricardite, infarctus inférieur, tumeur médiastinale, pneumonie basale, goitre, irritation du nerf phrénique.</p>
<div class="lab">Neurologiques</div><p>Infarctus ou hémorragie du tronc cérébral, sclérose en plaques (névromyélite optique en particulier), tumeur, méningite, traumatisme crânien.</p>
<div class="lab">Métaboliques et toxiques</div><p>Urémie, hyponatrémie, hypocalcémie, alcool, médicaments : dexaméthasone et autres corticostéroïdes, benzodiazépines, opioïdes, chimiothérapies à base de platine, anesthésie générale.</p>
<div class="lab">Bilan initial</div><p>Examen neurologique, électrocardiogramme, ionogramme, créatinine, calcium, radiographie thoracique ; endoscopie digestive ou IRM cérébrale selon l’orientation.</p></template>

<template data-pop="r06-soupir" data-title="Dyspnée suspirieuse">
<div class="lab">Description</div><p>Le patient ressent qu’il ne peut pas « remplir ses poumons » et doit soupirer profondément pour être soulagé. La gêne survient au repos, souvent en période de stress, et disparaît paradoxalement à l’effort.</p>
<div class="lab">Arguments de bénignité</div><p>Âge jeune, absence de facteur de risque, examen normal, saturation normale, dyspnée qui ne s’aggrave pas à l’effort, absence de symptôme nocturne.</p>
<div class="lab">Conduite</div><p>Une spirométrie normale et un examen normal suffisent souvent ; le médecin explique le phénomène et propose une rééducation respiratoire si la gêne persiste.</p>
<div class="lab">Piège</div><p>Une dyspnée qui s’aggrave à l’effort n’est pas une dyspnée suspirieuse et impose la démarche habituelle.</p></template>

<template data-pop="r06-manoeuvres" data-title="Manœuvres physiques contre le hoquet aigu">
<div class="lab">Principe</div><p>Les manœuvres interrompent l’arc réflexe en augmentant la PaCO₂ ou en stimulant le nerf vague.</p>
<div class="lab">Exemples</div><p>Apnée prolongée, manœuvre de Valsalva, déglutition d’eau froide ou d’une cuillère de sucre, traction sur la langue, ramener les genoux contre la poitrine.</p>
<div class="lab">Valeur</div><p>Leur efficacité repose sur l’expérience et des observations, sans essai de qualité. Elles sont sans danger dans le hoquet aigu bénin.</p>
<div class="lab">Limite</div><p>Elles ne dispensent pas d’une recherche de cause lorsque le hoquet dépasse 48 heures.</p></template>

<template data-pop="r06-grossesse" data-title="Dyspnée physiologique de la grossesse">
<div class="lab">Mécanisme</div><p>La progestérone stimule le centre respiratoire et augmente sa sensibilité au dioxyde de carbone. Le volume courant augmente, la ventilation minute s’élève et la PaCO₂ baisse vers 30 mmHg, avec une compensation rénale qui garde un pH presque normal. L’utérus refoule ensuite le diaphragme.</p>
<div class="lab">Arguments de physiologie</div><p>Début progressif, souvent dès le premier trimestre, absence de toux, de douleur et de syncope, examen et saturation normaux, pas d’aggravation brutale.</p>
<div class="lab">Signes d’alerte</div><p>Dyspnée brutale, tachycardie persistante, douleur thoracique, hémoptysie, syncope, orthopnée, saturation basse : embolie pulmonaire, cardiomyopathie du péripartum, rétrécissement mitral, asthme aggravé, œdème pulmonaire de prééclampsie.</p>
<div class="lab">Piège</div><p>Une PaCO₂ de 40 mmHg pendant la grossesse est relativement élevée et peut signaler une fatigue respiratoire.</p></template>

<template data-pop="r06-brue" data-title="Événement bref résolu inexpliqué du nourrisson (BRUE)">
<div class="lab">Définition (Académie américaine de pédiatrie, 2016)</div><p>Chez un nourrisson de moins d’un an, événement de moins d’une minute, résolu à l’arrivée, comportant au moins un élément parmi : cyanose ou pâleur ; respiration absente, diminuée ou irrégulière ; modification marquée du tonus ; altération de la réactivité. L’événement reste inexpliqué après une anamnèse et un examen appropriés. Ce concept a remplacé celui d’ALTE, que la CIM-10-GM code encore R06.80.</p>
<div class="lab">Critères de faible risque</div><p>Âge supérieur à 60 jours ; terme de naissance d’au moins 32 semaines et âge post-conceptionnel d’au moins 45 semaines ; premier épisode ; durée inférieure à une minute ; aucune réanimation par un professionnel formé ; anamnèse et examen sans élément inquiétant.</p>
<div class="lab">Conduite chez le nourrisson à faible risque</div><p>Éducation des parents, surveillance brève de la saturation possible, électrocardiogramme et recherche de coqueluche envisageables ; pas de bilan extensif ni de moniteur à domicile.</p>
<div class="lab">Piège</div><p>Un événement expliqué (reflux évident, étouffement au biberon) n’est pas un BRUE. Des signes de maltraitance, de convulsion, d’infection ou de cardiopathie font sortir de la catégorie de faible risque.</p></template>

<template data-pop="r06-sanglot" data-title="Spasme du sanglot">
<div class="lab">Description</div><p>Chez l’enfant de 6 mois à 6 ans, une contrariété, une frustration ou une douleur déclenchent des pleurs, puis un arrêt respiratoire en expiration, une cyanose ou une pâleur, parfois une perte de connaissance brève et quelques secousses.</p>
<div class="lab">Deux formes</div><p>La forme cyanotique suit des pleurs de colère et une apnée expiratoire. La forme pâle suit une douleur ou une frayeur brusque et résulte d’une bradycardie réflexe d’origine vagale.</p>
<div class="lab">Conduite</div><p>Le médecin rassure les parents, car l’évolution est bénigne. Il recherche une carence martiale, dont la correction réduit la fréquence des épisodes dans plusieurs études. Il demande un électrocardiogramme dans la forme pâle ou atypique, pour exclure un syndrome du QT long.</p>
<div class="lab">Piège</div><p>Un épisode sans facteur déclenchant, pendant le sommeil ou à l’effort, n’est pas un spasme du sanglot et impose une évaluation cardiologique et neurologique.</p></template>

<template data-pop="r06-obesite" data-title="Syndrome d’obésité-hypoventilation">
<div class="lab">Définition</div><p>Association d’une obésité (IMC d’au moins 30 kg/m²) et d’une hypercapnie diurne (PaCO₂ d’au moins 45 mmHg) sans autre cause d’hypoventilation, selon l’American Thoracic Society (2019).</p>
<div class="lab">Mécanisme</div><p>La masse thoracique et abdominale réduit la compliance de la paroi et le volume pulmonaire ; la commande ventilatoire répond moins au dioxyde de carbone ; des apnées obstructives coexistent souvent.</p>
<div class="lab">Repérage</div><p>Des bicarbonates veineux élevés chez un patient obèse font rechercher l’hypercapnie par une gazométrie.</p>
<div class="lab">Conséquence</div><p>Ces patients risquent une hypercapnie sous oxygène à haut débit ; leur cible de saturation est de 88 à 92 %. Le traitement repose sur la ventilation nocturne et la perte de poids.</p></template>

<template data-pop="r06-altitude" data-title="Œdème pulmonaire de haute altitude">
<div class="lab">Mécanisme</div><p>L’hypoxie d’altitude provoque une vasoconstriction pulmonaire hétérogène. Les territoires moins contractés reçoivent un débit et une pression excessifs ; les capillaires laissent fuir du liquide dans les alvéoles.</p>
<div class="lab">Clinique</div><p>Baisse inhabituelle de performance, dyspnée d’effort puis de repos, toux sèche puis expectoration mousseuse, dans les premiers jours d’un séjour au-dessus d’environ 2 500 mètres. La saturation est plus basse que celle des compagnons de course.</p>
<div class="lab">Conduite</div><p>La descente et l’oxygène sont les mesures principales ; la nifédipine est un traitement d’appoint lorsque la descente est retardée. Une ascension lente prévient l’œdème.</p>
<div class="lab">Piège</div><p>La dyspnée d’effort modérée de l’altitude est normale ; la dyspnée de repos ne l’est pas.</p></template>
