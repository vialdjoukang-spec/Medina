
<!-- ===== FENÊTRES R06 : notions, mécanismes, épidémiologie, anamnèse ===== -->
<template data-pop="r06-ats" data-title="Définition de la dyspnée selon l’ATS 2012">
<div class="lab">Définition</div><p>L’American Thoracic Society (ATS) définit la dyspnée comme une expérience subjective d’inconfort respiratoire, faite de sensations qualitativement distinctes dont l’intensité varie. Elle naît de l’interaction de facteurs physiologiques, psychologiques, sociaux et environnementaux, et elle peut provoquer des réactions physiologiques et comportementales secondaires.</p>
<div class="lab">Trois qualités principales</div><p>La soif d’air, ou inspiration insatisfaite, traduit une commande ventilatoire que la ventilation ne satisfait pas. Le travail ou l’effort traduit une charge mécanique accrue ou une faiblesse musculaire. L’oppression thoracique traduit une bronchoconstriction, perçue par des récepteurs vagaux des voies aériennes.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin note les mots exacts du patient. « J’ai la poitrine serrée » oriente vers l’asthme ; « je n’arrive pas à remplir mes poumons » oriente vers une hypercapnie ou une distension ; « respirer me fatigue » oriente vers une charge ou une faiblesse musculaire.</p>
<div class="lab">Limite</div><p>Plusieurs qualités coexistent souvent, et le vocabulaire dépend de la langue et de la culture du patient. La qualité oriente le mécanisme sans prouver la cause.</p>
<div class="lab">Source</div><p>Parshall M. B. et al. American Journal of Respiratory and Critical Care Medicine 2012 ; 185 : 435-452.</p></template>

<template data-pop="r06-chronique" data-title="Syndrome de dyspnée chronique">
<div class="lab">Définition</div><p>Un consensus international obtenu par méthode Delphi, publié dans l’European Respiratory Journal en 2017, définit le syndrome de dyspnée chronique comme une dyspnée qui persiste malgré le traitement optimal de la physiopathologie sous-jacente et qui entraîne un handicap. Le consensus n’a pas exigé de durée minimale.</p>
<div class="lab">Pourquoi ce cadre existe</div><p>Les auteurs voulaient combattre le nihilisme thérapeutique : un patient atteint de BPCO sévère, déjà traité au maximum, gardait une dyspnée considérée comme inévitable. Nommer le syndrome autorise à traiter la sensation pour elle-même.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin vérifie d’abord que la cause est réellement traitée de façon optimale, puis propose réhabilitation, ventilateur à main, techniques respiratoires et, selon la population, un traitement médicamenteux.</p>
<div class="lab">Piège</div><p>Le syndrome n’est pas un diagnostic de cause. Une dyspnée qui s’aggrave chez un patient déjà « chronique » impose une nouvelle recherche de cause.</p></template>

<template data-pop="r06-borg" data-title="Échelle de Borg de 0 à 10">
<div class="lab">Principe</div><p>L’échelle de Borg modifiée cote l’intensité de la dyspnée au moment présent de 0 (aucune dyspnée) à 10 (maximale), avec des descripteurs verbaux : 1 très légère, 2 légère, 3 modérée, 5 sévère, 7 très sévère. Le patient montre le chiffre qui correspond à sa sensation.</p>
<div class="lab">Usage</div><p>Elle mesure une intensité instantanée : au repos, à la fin d’un test de marche de six minutes, ou avant et après un traitement. Une variation d’environ un point est habituellement considérée comme perceptible par le patient.</p>
<div class="lab">Différence avec l’échelle mMRC</div><p>L’échelle mMRC décrit le handicap habituel selon l’activité qui essouffle ; l’échelle de Borg décrit l’intensité ressentie maintenant. Un patient peut être au degré mMRC 3 et coter 1 au repos.</p>
<div class="lab">Piège</div><p>Le score dépend de la compréhension du patient ; il ne se compare d’un moment à l’autre que chez le même patient, avec la même consigne.</p></template>

<template data-pop="r06-ortho" data-title="Orthopnée, trépopnée et platypnée">
<div class="lab">Orthopnée</div><p>La dyspnée apparaît en décubitus et cède en position assise. En décubitus, le sang des membres inférieurs et de l’abdomen revient vers le thorax ; un ventricule gauche défaillant ne peut éjecter ce volume, et la pression capillaire pulmonaire s’élève. Elle s’observe aussi dans la paralysie diaphragmatique bilatérale, l’ascite volumineuse et l’obésité.</p>
<div class="lab">Trépopnée</div><p>La dyspnée apparaît en décubitus latéral d’un côté et pas de l’autre. Elle s’observe dans l’insuffisance cardiaque, un épanchement pleural unilatéral ou une atteinte pulmonaire unilatérale, parce que la position modifie la répartition de la perfusion et de la ventilation.</p>
<div class="lab">Platypnée</div><p>La dyspnée apparaît en position debout et cède en décubitus, souvent avec une désaturation debout (orthodéoxie). Elle évoque un shunt droite-gauche par un foramen ovale perméable, un syndrome hépatopulmonaire ou des malformations artérioveineuses pulmonaires des bases.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin demande combien d’oreillers le patient utilise, s’il dort assis, et mesure la saturation couché puis debout lorsque la dyspnée est posturale.</p></template>

<template data-pop="r06-chemo" data-title="Chémorécepteurs centraux et périphériques">
<div class="lab">Chémorécepteurs centraux</div><p>Situés à la face ventrale du bulbe, ils répondent au pH du liquide extracellulaire cérébral. Le dioxyde de carbone traverse librement la barrière hématoencéphalique et abaisse ce pH. Ils assurent l’essentiel de la réponse à l’hypercapnie : chez l’adulte sain, une hausse de la PaCO₂ de quelques mmHg augmente nettement la ventilation.</p>
<div class="lab">Chémorécepteurs périphériques</div><p>Situés dans les corpuscules carotidiens et aortiques, ils répondent surtout à la baisse de la PaO₂, de façon marquée sous environ 60 mmHg, et aussi à l’acidose. Ils expliquent la tachypnée de l’hypoxémie et de l’acidose métabolique.</p>
<div class="lab">Conséquences cliniques</div><p>Une acidose métabolique augmente la ventilation sans lésion pulmonaire : c’est la respiration de Kussmaul. Chez un patient atteint de BPCO avec hypercapnie chronique, les bicarbonates du liquide cérébral se sont adaptés et la réponse au dioxyde de carbone est émoussée.</p>
<div class="lab">Piège</div><p>Une forte sensibilité au dioxyde de carbone, comme dans l’insuffisance cardiaque, déstabilise la régulation et favorise la respiration de Cheyne-Stokes.</p></template>

<template data-pop="r06-corollaire" data-title="Décharge corollaire et inadéquation neuromécanique">
<div class="lab">Définition</div><p>Lorsque le cortex moteur et le tronc cérébral envoient une commande aux muscles respiratoires, ils envoient une copie de cette commande aux aires sensorielles. Cette copie s’appelle la décharge corollaire. Le cerveau compare la commande envoyée et le retour sensoriel du mouvement obtenu.</p>
<div class="lab">Mécanisme de la dyspnée</div><p>Si une commande forte produit peu de volume, parce que le poumon est raide, la bronche rétrécie ou le muscle faible, le cerveau perçoit un décalage. Ce décalage, appelé inadéquation neuromécanique, produit la sensation d’effort et contribue à la soif d’air.</p>
<div class="lab">Exemple</div><p>Un patient atteint de BPCO distendu à l’effort augmente sa commande, mais son volume courant ne peut plus augmenter, car il respire déjà près de sa capacité pulmonaire totale. La dyspnée croît alors brusquement.</p>
<div class="lab">Conséquence thérapeutique</div><p>Réduire la distension par un bronchodilatateur, ou réduire la commande par l’entraînement, diminue le décalage et la dyspnée.</p></template>

<template data-pop="r06-jrec" data-title="Mécanorécepteurs, récepteurs J et récepteurs des voies aériennes">
<div class="lab">Récepteurs à l’étirement</div><p>Situés dans le muscle lisse des voies aériennes, ils informent le tronc cérébral du volume pulmonaire et contribuent à arrêter l’inspiration. Leur stimulation par une inspiration profonde soulage partiellement la soif d’air.</p>
<div class="lab">Récepteurs juxtacapillaires (récepteurs J)</div><p>Situés dans l’interstitium alvéolaire, près des capillaires, ils sont stimulés par l’œdème interstitiel et la congestion. Ils provoquent une respiration rapide et superficielle et contribuent à la dyspnée de l’insuffisance cardiaque, de l’embolie et des pneumopathies interstitielles.</p>
<div class="lab">Récepteurs d’irritation</div><p>Situés dans l’épithélium bronchique, ils répondent aux irritants et à la bronchoconstriction ; ils provoquent la toux et la sensation d’oppression.</p>
<div class="lab">Conséquence clinique</div><p>Une tachypnée avec saturation normale ne prouve pas l’absence de maladie pulmonaire : la stimulation des récepteurs J suffit à l’expliquer.</p></template>

<template data-pop="r06-stridor-phys" data-title="Physique du stridor">
<div class="lab">Accélération et pression latérale</div><p>À débit constant, l’air accélère dans un segment rétréci. Selon le principe de Bernoulli, l’augmentation de vitesse abaisse la pression latérale exercée sur la paroi. La paroi souple est attirée vers la lumière, se rapproche, puis vibre : ces vibrations produisent un son aigu.</p>
<div class="lab">Siège et temps du cycle</div><p>À l’inspiration, la pression dans les voies aériennes extrathoraciques devient inférieure à la pression atmosphérique : un segment extrathoracique rétréci se collabe et le stridor est inspiratoire. À l’expiration, la pression pleurale positive comprime la trachée intrathoracique : le bruit est expiratoire. Un rétrécissement fixe gêne les deux temps.</p>
<div class="lab">Gravité</div><p>Le bruit dépend du débit. Un stridor qui diminue chez un enfant épuisé peut signifier que le débit s’effondre, et non que l’obstacle s’améliore.</p>
<div class="lab">Conséquence pratique</div><p>Le calme diminue le débit et la turbulence : on évite d’agiter un enfant qui présente un stridor.</p></template>

<template data-pop="r06-hypocap" data-title="Effets de l’hypocapnie">
<div class="lab">Calcium ionisé</div><p>L’alcalose respiratoire augmente la liaison du calcium à l’albumine. Le calcium ionisé baisse alors que le calcium total ne change pas. Cette baisse rend les membranes nerveuses plus excitables, d’où les paresthésies péribuccales et des doigts et, dans les formes marquées, des spasmes carpopédaux.</p>
<div class="lab">Débit sanguin cérébral</div><p>Le dioxyde de carbone dilate les artérioles cérébrales. Son abaissement les contracte et réduit le débit sanguin cérébral de quelques pour cent par mmHg, ce qui explique les vertiges, la sensation de tête vide et parfois une vision trouble.</p>
<div class="lab">Cœur</div><p>L’alcalose et la libération de catécholamines liée à l’angoisse provoquent palpitations et douleur thoracique atypique ; l’hypocapnie peut aussi favoriser un spasme coronaire chez un sujet prédisposé.</p>
<div class="lab">Piège</div><p>Ces symptômes ne prouvent pas une origine fonctionnelle : une embolie pulmonaire ou une acidocétose produisent aussi une hypocapnie.</p></template>

<template data-pop="r06-periodique" data-title="Respiration périodique et gain de boucle">
<div class="lab">Description</div><p>La respiration de Cheyne-Stokes alterne des phases de volume courant croissant puis décroissant et des apnées ou hypopnées centrales, sans effort respiratoire pendant la pause. Le cycle est long dans l’insuffisance cardiaque, souvent proche d’une minute ; l’American Academy of Sleep Medicine exige un cycle d’au moins 40 secondes pour la coder pendant le sommeil.</p>
<div class="lab">Mécanisme</div><p>La ventilation est réglée par une boucle : chémorécepteurs, tronc cérébral, poumons, sang, retour aux chémorécepteurs. Le gain de boucle est le rapport entre la correction apportée et l’erreur qui l’a déclenchée. Un temps de circulation long, dû à un débit cardiaque bas, retarde l’information ; une chémosensibilité élevée amplifie la correction. La correction dépasse alors la cible à chaque cycle.</p>
<div class="lab">Causes</div><p>Insuffisance cardiaque, accident vasculaire cérébral, altitude pendant le sommeil, opioïdes (qui donnent plutôt une respiration ataxique).</p>
<div class="lab">Conséquence pratique</div><p>Le traitement repose sur l’optimisation de l’insuffisance cardiaque. La ventilation auto-asservie est contre-indiquée chez un patient avec fraction d’éjection de 45 % ou moins et apnées centrales prédominantes (essai SERVE-HF, 2015, mortalité cardiovasculaire augmentée).</p></template>

<template data-pop="r06-hoquet-arc" data-title="Arc réflexe du hoquet">
<div class="lab">Voies afférentes</div><p>Le nerf vague, le nerf phrénique et la chaîne sympathique thoracique transmettent les stimulations venues de l’œsophage, de l’estomac, du diaphragme, du péricarde et du médiastin.</p>
<div class="lab">Centre</div><p>L’intégration se fait dans le tronc cérébral, à proximité des centres respiratoires, avec des influences de l’hypothalamus et des structures dopaminergiques et gabaergiques.</p>
<div class="lab">Voies efférentes</div><p>Le nerf phrénique provoque une contraction brusque du diaphragme, souvent unilatérale, accompagnée des muscles intercostaux inspiratoires. Environ 35 millisecondes plus tard, la glotte se ferme : l’arrêt brutal du flux d’air produit le bruit caractéristique.</p>
<div class="lab">Conséquences pratiques</div><p>Une distension gastrique stimule les afférences vagales : c’est le hoquet du repas copieux. Une lésion du tronc cérébral perturbe le centre : c’est le hoquet de l’infarctus bulbaire. Les traitements agissent sur l’arc : manœuvres vagales, agonistes GABA-B (baclofène), antagonistes dopaminergiques (métoclopramide, chlorpromazine).</p></template>

<template data-pop="r06-aa" data-title="Équation des gaz alvéolaires">
<div class="lab">Formule simplifiée</div><p>PAO₂ = fraction inspirée d’oxygène × (pression barométrique − 47) − PaCO₂ / 0,8. Le nombre 47 est la pression de vapeur d’eau saturante à 37 °C en mmHg ; 0,8 est le quotient respiratoire habituel.</p>
<div class="lab">Valeur normale</div><p>Au niveau de la mer, en air ambiant (21 %) et avec une PaCO₂ de 40 mmHg : 0,21 × (760 − 47) − 40 / 0,8, soit environ 150 − 50 = 100 mmHg. À Berne (environ 540 mètres, pression barométrique d’environ 715 mmHg), la PAO₂ normale est d’environ 90 mmHg.</p>
<div class="lab">Gradient</div><p>Le gradient alvéolo-artériel est la différence PAO₂ − PaO₂. Chez l’adulte jeune en air ambiant, il est habituellement inférieur à 10 à 15 mmHg ; il augmente avec l’âge, et une estimation courante de sa limite supérieure est l’âge divisé par 4, plus 4.</p>
<div class="lab">Interprétation</div><p>Un gradient normal avec hypoxémie oriente vers l’hypoventilation ou l’altitude. Un gradient élevé oriente vers un trouble de ventilation-perfusion, un shunt ou un trouble de diffusion.</p>
<div class="lab">Limite</div><p>Le calcul perd sa précision sous oxygène à fort débit, car la fraction inspirée réelle est inconnue avec des lunettes ou un masque simple.</p></template>

<template data-pop="r06-epi" data-title="Épidémiologie de la dyspnée : données et limites">
<div class="lab">Population générale</div><p>La revue de l’European Respiratory Review (2025) a réuni dix revues systématiques (315 études) puis 15 études récentes. Avec le critère d’un degré mMRC d’au moins 2, la prévalence poolée était de 12,5 % (3,7 à 29,5 % selon les études) en population générale et de 37,5 % en population clinique.</p>
<div class="lab">Toute dyspnée</div><p>La méta-analyse de BMC Pulmonary Medicine (2026), fondée sur 56 études et 450 520 participants, a trouvé 22,2 % de dyspnée mesurée par l’échelle mMRC ; 6,1 % au degré 2, 2,5 % au degré 3 et 1,2 % au degré 4. Les femmes rapportaient plus souvent une dyspnée que les hommes.</p>
<div class="lab">Facteurs associés</div><p>Âge, obésité, tabagisme, maladies cardiopulmonaires, fonction pulmonaire basse, anxiété et dépression sont associés à la dyspnée. Ces associations ne prouvent pas que chaque facteur cause la dyspnée.</p>
<div class="lab">Limite</div><p>Les définitions et les outils varient d’une étude à l’autre, ce qui explique l’écart des chiffres. Aucune donnée suisse spécifique n’a été lue en texte intégral pour ce cours.</p></template>

<template data-pop="r06-pronostic" data-title="Valeur pronostique de la dyspnée">
<div class="lab">Constat</div><p>Dans plusieurs cohortes, une dyspnée plus intense est associée à une mortalité plus élevée. Dans la BPCO, le degré de dyspnée prédit la survie au moins aussi bien que le VEMS, ce qui explique sa place dans l’indice BODE.</p>
<div class="lab">Pourquoi</div><p>La dyspnée intègre plusieurs dimensions que le VEMS ne mesure pas : distension, atteinte cardiaque, faiblesse musculaire, déconditionnement et comorbidités. Elle réduit l’activité physique, qui est elle-même associée à la mortalité.</p>
<div class="lab">Limite</div><p>Il s’agit d’une association. Aucun essai n’a montré que soulager la sensation seule, par exemple par un opioïde, réduit la mortalité.</p>
<div class="lab">Conséquence pratique</div><p>Un patient au degré mMRC 3 ou 4 justifie une évaluation complète, une réhabilitation et une discussion anticipée du projet de soins.</p></template>

<template data-pop="r06-a-coeur" data-title="Antécédents cardiaques et causes cardiaques de décompensation">
<div class="lab">À demander</div><p>Le médecin demande s’il existe une hypertension artérielle, un infarctus, une valvulopathie, une fibrillation auriculaire, une insuffisance cardiaque connue, une chimiothérapie cardiotoxique ou une radiothérapie thoracique. Il demande les derniers résultats d’échocardiographie.</p>
<div class="lab">Pourquoi</div><p>Une cardiopathie connue rend l’origine cardiaque de la dyspnée beaucoup plus probable. L’hypertension ancienne épaissit le ventricule gauche et le rend moins compliant : une tachycardie ou une poussée tensionnelle suffit alors à élever la pression de remplissage.</p>
<div class="lab">Déclencheurs cardiaques</div><p>Fibrillation auriculaire rapide, ischémie, poussée hypertensive, valvulopathie aiguë, écart de traitement ou de sel. La fibrillation auriculaire raccourcit la diastole et supprime la contraction auriculaire, ce qui élève la pression de l’oreillette gauche.</p>
<div class="lab">Piège</div><p>Les sibilants de l’« asthme cardiaque » font prescrire à tort un bronchodilatateur, qui accélère encore la fréquence cardiaque.</p></template>

<template data-pop="r06-a-poumon" data-title="Antécédents respiratoires et tabagisme">
<div class="lab">À demander</div><p>Asthme ou sifflements dans l’enfance, BPCO, tuberculose, pneumonies répétées, pneumothorax, chirurgie thoracique, apnées du sommeil, et tabagisme exprimé en paquets-années (nombre de paquets par jour multiplié par le nombre d’années).</p>
<div class="lab">Pourquoi</div><p>Un tabagisme d’au moins 10 à 20 paquets-années rend une BPCO et un cancer bronchique plus probables. Un asthme de l’enfance peut réapparaître chez l’adulte. Un antécédent de pneumothorax augmente le risque de récidive.</p>
<div class="lab">Exemple</div><p>Une femme fume 20 cigarettes par jour depuis 30 ans, soit 30 paquets-années. Une dyspnée progressive impose une spirométrie, même si l’auscultation est normale.</p>
<div class="lab">Piège</div><p>Le tabagisme ne prouve pas la BPCO : chez Mme D., la spirométrie faite après la recompensation était normale.</p></template>

<template data-pop="r06-a-expo" data-title="Expositions professionnelles, domestiques et animales">
<div class="lab">À demander</div><p>Le médecin demande la liste des emplois occupés, les poussières (silice, amiante, farine, bois), les vapeurs et les fumées, les produits chimiques (isocyanates), les animaux (oiseaux), les moisissures du domicile et les loisirs.</p>
<div class="lab">Pourquoi</div><p>Une exposition à des protéines d’oiseaux ou à des moisissures peut provoquer une pneumopathie d’hypersensibilité ; l’amiante provoque plaques pleurales, fibrose et mésothéliome ; la silice une silicose ; les isocyanates un asthme professionnel. Le délai entre exposition et maladie peut dépasser vingt ans pour l’amiante.</p>
<div class="lab">Conséquence en Suisse</div><p>Une maladie professionnelle doit être déclarée à l’assureur-accidents, le plus souvent la Suva, qui peut la reconnaître et prononcer une décision d’inaptitude.</p>
<div class="lab">Piège</div><p>Une amélioration pendant les vacances et une aggravation au retour au travail orientent fortement vers une cause professionnelle.</p></template>

<template data-pop="r06-a-thrombo" data-title="Facteurs de risque thromboembolique">
<div class="lab">À demander</div><p>Chirurgie ou fracture dans les quatre semaines, immobilisation, voyage prolongé, cancer actif, antécédent de thrombose, contraception œstroprogestative ou traitement hormonal, grossesse et post-partum, thrombophilie connue.</p>
<div class="lab">Pourquoi</div><p>Ces situations réunissent stase veineuse, lésion endothéliale ou hypercoagulabilité. Elles augmentent la probabilité clinique d’embolie pulmonaire et entrent dans le score de Wells.</p>
<div class="lab">Conséquence</div><p>Une dyspnée inexpliquée avec un de ces facteurs impose d’estimer la probabilité d’embolie avant toute conclusion fonctionnelle (cours I26).</p>
<div class="lab">Piège</div><p>L’absence de facteur de risque n’exclut pas l’embolie : une partie des embolies survient sans facteur identifié.</p></template>

<template data-pop="r06-a-medic" data-title="Médicaments responsables de dyspnée">
<div class="lab">À demander</div><p>Le médecin établit la liste complète des médicaments, y compris les collyres, les traitements récemment introduits et les produits sans ordonnance.</p>
<div class="lab">Exemples et mécanismes</div><p>Ticagrélor : dyspnée sans lésion, liée à l’adénosine. Bêtabloquants non sélectifs et collyres bêtabloquants : bronchospasme chez l’asthmatique. Amiodarone, méthotrexate, nitrofurantoïne : pneumopathie interstitielle. Anti-inflammatoires non stéroïdiens : rétention hydrosodée et bronchospasme chez les patients sensibles. Inhibiteurs de l’enzyme de conversion : angiœdème. Opioïdes et benzodiazépines : hypoventilation.</p>
<div class="lab">Conséquence</div><p>Une dyspnée qui apparaît dans les semaines suivant l’introduction d’un médicament fait discuter son rôle avant d’engager des examens lourds.</p></template>

<template data-pop="r06-a-psy" data-title="Anxiété, attaques de panique et dyspnée">
<div class="lab">À demander</div><p>Le médecin demande s’il existe des attaques de panique, un trouble anxieux, une dépression, un traumatisme récent ou une situation de stress, et si les crises surviennent au repos, sans lien avec l’effort.</p>
<div class="lab">Pourquoi</div><p>L’anxiété augmente la commande ventilatoire et l’attention portée à la respiration. Elle peut provoquer une hyperventilation et amplifier une dyspnée d’origine organique. Les patients atteints de BPCO ont plus souvent un trouble panique que les témoins.</p>
<div class="lab">Piège</div><p>Un antécédent psychiatrique ne prouve pas l’origine fonctionnelle d’une dyspnée actuelle. Le diagnostic de dyspnée anxieuse reste un diagnostic d’exclusion, en particulier chez une patiente à risque thromboembolique.</p></template>

<template data-pop="r06-s-debut" data-title="Mode de début de la dyspnée">
<div class="lab">Question</div><p>« Que faisiez-vous lorsque l’essoufflement a commencé ? Est-il apparu en quelques secondes, en quelques heures ou sur des semaines ? »</p>
<div class="lab">Début en secondes ou minutes</div><p>Embolie pulmonaire, pneumothorax, inhalation d’un corps étranger, anaphylaxie, œdème pulmonaire d’installation brutale, arythmie. Ces causes sont souvent graves et imposent une évaluation immédiate.</p>
<div class="lab">Début en heures ou jours</div><p>Pneumonie, exacerbation d’asthme ou de BPCO, décompensation cardiaque, épanchement pleural croissant.</p>
<div class="lab">Installation sur des semaines ou des mois</div><p>Insuffisance cardiaque chronique, BPCO, pneumopathie interstitielle, hypertension pulmonaire, anémie, maladie neuromusculaire, déconditionnement.</p>
<div class="lab">Piège</div><p>Le patient date souvent le début au jour où la gêne est devenue insupportable ; le médecin cherche l’activité abandonnée en premier pour dater le vrai début.</p></template>

<template data-pop="r06-s-position" data-title="Relation entre la dyspnée et la position">
<div class="lab">Questions</div><p>« Combien d’oreillers utilisez-vous ? Dormez-vous assis ? L’essoufflement change-t-il couché sur un côté, ou debout ? »</p>
<div class="lab">Orientation</div><p>Orthopnée : insuffisance cardiaque, paralysie diaphragmatique bilatérale, ascite. Trépopnée : épanchement ou atteinte unilatérale. Platypnée : shunt droite-gauche, syndrome hépatopulmonaire. Dyspnée en se penchant en avant (bendopnée) : insuffisance cardiaque avec pressions de remplissage élevées.</p>
<div class="lab">Exemple</div><p>Une patiente qui passe de un à trois oreillers en deux semaines aggrave probablement sa congestion pulmonaire.</p>
<div class="lab">Piège</div><p>Un patient atteint de BPCO sévère dort parfois assis pour mieux utiliser ses muscles accessoires ; l’orthopnée n’est pas spécifique du cœur.</p></template>

<template data-pop="r06-s-dpn" data-title="Dyspnée paroxystique nocturne">
<div class="lab">Description</div><p>Le patient se réveille brutalement avec une sensation d’étouffement, une à trois heures après le coucher, et doit s’asseoir ou se lever pour être soulagé en quelques minutes à une demi-heure. Une toux ou des sifflements l’accompagnent souvent.</p>
<div class="lab">Mécanisme</div><p>En décubitus, les œdèmes des membres inférieurs se résorbent lentement dans la circulation, ce qui augmente progressivement le volume intravasculaire. La baisse nocturne du tonus adrénergique et de la vigilance retarde la perception de la congestion.</p>
<div class="lab">Valeur</div><p>Elle oriente fortement vers une insuffisance cardiaque gauche. L’asthme nocturne et le reflux gastro-œsophagien sont les principaux diagnostics différentiels.</p>
<div class="lab">Piège</div><p>Les sifflements nocturnes font poser à tort un diagnostic d’asthme ; l’âge, l’orthopnée et les œdèmes orientent vers le cœur.</p></template>

<template data-pop="r06-s-douleur" data-title="Douleur thoracique respiratoire (R07.1)">
<div class="lab">Définition</div><p>La douleur thoracique respiratoire, ou douleur pleurale, est majorée par l’inspiration profonde et la toux, et souvent latéralisée. Elle se code R07.1 lorsqu’elle reste inexpliquée.</p>
<div class="lab">Mécanisme</div><p>La plèvre pariétale est innervée par les nerfs intercostaux et sensible à l’étirement ; la plèvre viscérale ne l’est pas. Une inflammation ou une lésion de la plèvre pariétale rend chaque mouvement respiratoire douloureux.</p>
<div class="lab">Causes à évoquer devant une dyspnée</div><p>Embolie pulmonaire avec infarctus pulmonaire, pneumonie, pneumothorax, péricardite (douleur soulagée penché en avant), fracture de côte, pleurésie virale.</p>
<div class="lab">Conséquence</div><p>L’association d’une douleur pleurale brutale et d’une dyspnée impose de rechercher d’abord un pneumothorax et une embolie.</p></template>

<template data-pop="r06-s-assoc" data-title="Symptômes associés à la dyspnée">
<div class="lab">Respiratoires</div><p>Toux et expectoration (infection, BPCO, bronchectasies), hémoptysie (embolie, cancer, tuberculose, bronchectasies), sifflements (asthme, BPCO, cœur), stridor ou voix modifiée (larynx).</p>
<div class="lab">Cardiovasculaires</div><p>Douleur thoracique, palpitations, syncope à l’effort (rétrécissement aortique, hypertension pulmonaire, embolie), œdèmes des membres inférieurs, prise de poids rapide (rétention hydrosodée).</p>
<div class="lab">Généraux</div><p>Fièvre (infection), amaigrissement (cancer, tuberculose, BPCO avancée), sueurs nocturnes, fatigue, paresthésies (hyperventilation), faiblesse musculaire ou dysphagie (maladie neuromusculaire).</p>
<div class="lab">Conséquence</div><p>Chaque symptôme associé déplace la probabilité vers un organe ; la syncope à l’effort et l’hémoptysie sont des signes d’alarme.</p></template>
