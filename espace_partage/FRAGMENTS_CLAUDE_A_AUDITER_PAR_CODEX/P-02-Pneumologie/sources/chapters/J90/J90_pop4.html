<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j90-clin" data-title="Pareto — Définitions, mécanismes et clinique">
<p class="ratio" data-cover="j90-0,j90-1,j90-2,j90-3,j90-4,j90-5,j90-6"></p>
<ul>
<li>Un épanchement est un signe : le liquide ponctionné renseigne directement sur sa cause.</li>
<li>Transsudat : pressions anormales, plèvre saine ; exsudat : plèvre perméable ou lymphatiques bloqués.</li>
<li>J91* accompagne le code de la maladie causale ; J90 seulement sans autre cause ; J92 plaques ; J94.0 chyle, J94.1 fibrothorax, J94.2 hémothorax non traumatique.</li>
<li>Causes dominantes : insuffisance cardiaque, pneumonie, cancer, embolie pulmonaire.</li>
<li>Exsudat lymphocytaire : cancer, tuberculose ; épanchement bilatéral : cause générale.</li>
<li>Antécédents décisifs : cardiopathie, cancer, amiante, tuberculose, médicaments, chirurgie récente.</li>
<li>Examen : matité, vibrations abolies, murmure diminué ; trachée repoussée si massif, médiane si atélectasie associée.</li>
</ul></template>

<template data-pop="pareto-j90-diag" data-title="Pareto — Démarche diagnostique et urgences">
<p class="ratio" data-cover="j90-7,j90-8"></p>
<ul>
<li>Échographie avant toute ponction ; ponction de tout épanchement unilatéral inexpliqué.</li>
<li>Light : exsudat si protéines &gt; 0,5, lactate déshydrogénase &gt; 0,6 ou &gt; deux tiers de la normale ; dosages sanguins du jour.</li>
<li>Faux exsudat sous diurétique : gradient d’albumine &gt; 12 g/L ou NT-proBNP élevé.</li>
<li>Cytologie 25 à 50 mL ; négative n’exclut pas ; biopsie guidée si exsudat non résolu.</li>
<li>Urgences : épanchement compressif, pH ≤ 7,2 ou pus, hémothorax, complications de ponction.</li>
<li>Évacuation lente, au plus environ 1,5 L, arrêt si toux ou oppression.</li>
</ul></template>

<template data-pop="pareto-j90-tt" data-title="Pareto — Traitements et affections pleurales particulières">
<p class="ratio" data-cover="j90-9,j90-10,j90-11,j90-12,j90-13"></p>
<ul>
<li>Transsudat : traiter la cause ; hydrothorax hépatique sans drain.</li>
<li>Infection : drain si pus ou pH ≤ 7,2 ; pH 7,2 à 7,4 avec lactate déshydrogénase &gt; 900 UI/L à discuter ; altéplase et dornase alfa si collection résiduelle.</li>
<li>Malin symptomatique : talc ou cathéter tunnelisé ; cathéter si plus de 25 % de poumon non expansible.</li>
<li>Chylothorax : triglycérides &gt; 1,24 mmol/L ; pseudochylothorax : cholestérol &gt; 5,18 mmol/L.</li>
<li>Hémothorax : rapport des hématocrites ≥ 0,5 ; complication : fibrothorax.</li>
<li>Plaques : marqueur d’amiante, non précancéreuses, à annoncer à la Suva ; épaississement nodulaire à biopsier.</li>
<li>J91* : indice propre à chaque maladie générale ; exclure l’infection d’abord.</li>
</ul></template>

<template data-pop="pareto-j90-crit" data-title="Pareto — Suivi et critères formels">
<p class="ratio" data-cover="j90-14,j90-15"></p>
<ul>
<li>Imagerie de contrôle après infection pleurale persistante ou épaississement inexpliqué.</li>
<li>L’âge ne dispense pas de ponctionner un épanchement unilatéral.</li>
<li>Critères : Light ; infection compliquée si pus, pH ≤ 7,2 ou glucose &lt; 3,3 mmol/L ; chyle, pseudochyle et hémothorax par leurs seuils ; malignité par cytologie ou biopsie.</li>
</ul></template>

<template data-pop="pareto-j90-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j90-e-1,j90-e-2,j90-e-3,j90-e-4,j90-e-5,j90-e-6"></p>
<ul>
<li>Références : analyse du liquide pour la nature, biopsie pleurale guidée pour la cause histologique.</li>
<li>Radiographie de face positive vers 200 mL ; échographie plus sensible, cloisons et nodules.</li>
<li>Tomodensitométrie : épaississement nodulaire, circonférentiel, &gt; 1 cm ou médiastinal oriente vers le cancer ; normale n’exclut pas.</li>
<li>pH immédiat sans héparine ; adénosine désaminase comme test d’exclusion en Suisse.</li>
<li>Pas de tomographie par émission de positons dans l’infection pleurale.</li>
</ul></template>

<template data-pop="pareto-j90-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="j90-sa,j90-sh,j90-sp,j90-sb,j90-sm"></p>
<ul>
<li>Plèvre pariétale sensible et systémique ; viscérale indolore ; aiguille au bord supérieur de la côte.</li>
<li>Stomates pariétaux : sortie lymphatique, bloquée par le cancer.</li>
<li>Starling : filtration pariétale, réserve lymphatique ; chute de pression pleurale si poumon non expansible.</li>
<li>Glycolyse bactérienne et neutrophile : pH et glucose bas.</li>
<li>Streptocoques anginosus, anaérobes, staphylocoque ; tuberculose pleurale à faible charge, biopsie plus rentable.</li>
</ul></template>

<template data-pop="pareto-j90-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j90-p-1,j90-p-2,j90-p-3,j90-p-4"></p>
<ul>
<li>Furosémide 20 à 40 mg puis jusqu’à 240 mg par jour (ESC 2021) ; spironolactone 100 à 400 mg et furosémide 40 à 160 mg dans la cirrhose (EASL 2018).</li>
<li>Amoxicilline et acide clavulanique 2,2 g toutes les 8 heures par voie intraveineuse ; couvrir les anaérobes, éviter les aminosides.</li>
<li>Altéplase 10 mg et dornase alfa 5 mg deux fois par jour pendant 3 jours ; jamais un agent seul.</li>
<li>Talc stérile calibré 4 g.</li>
<li>Dangers : saignement sous altéplase, hyperkaliémie sous spironolactone, anti-inflammatoires chez le cirrhotique.</li>
</ul></template>
