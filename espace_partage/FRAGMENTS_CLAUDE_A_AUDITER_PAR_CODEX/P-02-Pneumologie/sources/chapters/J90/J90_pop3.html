<!-- ===== FENÊTRES : traitements, plèvre chronique et monographies ===== -->
<template data-pop="j90-talc" data-title="Talc stérile : symphyse pleurale">
<div class="lab">Mécanisme</div><p>Le talc, silicate de magnésium, lèse les cellules mésothéliales et déclenche une inflammation avec dépôt de fibrine puis fibrose. Les deux feuillets adhèrent et la cavité disparaît : le liquide ne peut plus s’accumuler. Ce mécanisme exige que les feuillets se touchent, donc un poumon expansible.</p>
<div class="lab">Modes d’administration</div><p>Suspension dans du sérum physiologique par le drain ; poudrage lors d’une thoracoscopie ; suspension par un cathéter tunnelisé en ambulatoire. La dose utilisée dans TIME2 et IPC-PLUS était de 4 g.</p>
<div class="lab">Preuves</div><p>TIME2 (JAMA, 2012) : dyspnée à 42 jours équivalente à celle du cathéter tunnelisé, mais hospitalisation initiale plus longue (médiane 4 jours contre 0) et 22 % de gestes ultérieurs contre 6 %. IPC-PLUS (New England Journal of Medicine, 2018) : talc par le cathéter, symphyse à 35 jours chez 43 % des patients contre 23 % sous placebo. La BTS 2023 accepte la suspension ou le poudrage (conditionnelle).</p>
<div class="lab">Effets indésirables</div><p>Douleur et fièvre dans les 24 à 48 heures. Hypoxémie et syndrome de détresse respiratoire aiguë décrits avec des talcs à particules fines ; un talc calibré à grosses particules est donc utilisé.</p>
<div class="lab">Contre-indication pratique</div><p>Poumon non expansible au-delà de 25 % : la BTS 2023 préfère alors le cathéter tunnelisé.</p>
<div class="lab">Statut suisse</div><p>Le statut d’autorisation des préparations de talc stérile en Suisse n’a pas pu être vérifié pour ce cours.</p></template>

<template data-pop="j90-cath" data-title="Cathéter pleural tunnelisé à demeure">
<div class="lab">Principe</div><p>Un cathéter souple en silicone est tunnelisé sous la peau et laissé en place. Le patient ou une équipe de soins à domicile draine le liquide dans des bouteilles sous vide, selon les besoins ou quotidiennement.</p>
<div class="lab">Avantages</div><p>Pose ambulatoire, hospitalisation initiale très courte, efficacité en cas de poumon non expansible, symphyse spontanée chez une partie des patients.</p>
<div class="lab">Inconvénients</div><p>Infection du trajet ou de la cavité, obstruction, cloisonnement, douleur, image corporelle altérée ; TIME2 rapportait plus d’effets indésirables qu’avec le talc. La BTS 2023 demande de considérer l’impact psychologique avant la pose.</p>
<div class="lab">Fréquence de drainage</div><p>Le drainage quotidien augmente le taux de symphyse et permet un retrait plus précoce ; un drainage selon les symptômes contrôle aussi la dyspnée (BTS 2023).</p></template>

<template data-pop="j90-nel" data-title="Poumon non expansible">
<div class="lab">Définition</div><p>Poumon qui ne peut pas se réexpandre et venir au contact de la paroi après évacuation du liquide. Les causes sont une couenne de la plèvre viscérale, tumorale ou fibreuse, une obstruction bronchique ou une fibrose pulmonaire.</p>
<div class="lab">Reconnaissance</div><p>Douleur ou oppression thoracique pendant l’évacuation, pneumothorax d’évacuation sur la radiographie de contrôle sans fuite d’air, manométrie pleurale montrant une chute rapide de la pression.</p>
<div class="lab">Conséquences</div><p>La symphyse par talc échoue lorsque plus de 25 % du poumon reste non expansible ; la BTS 2023 recommande alors le cathéter tunnelisé. L’air visible après ponction n’est pas un pneumothorax par blessure et ne demande pas de drain.</p></template>

<template data-pop="j90-decort" data-title="Décortication pleurale">
<div class="lab">Principe</div><p>Le chirurgien retire la couenne fibreuse de la plèvre viscérale pour libérer le poumon, par thoracoscopie vidéo-assistée ou par thoracotomie.</p>
<div class="lab">Indications</div><p>Empyème organisé avec poumon piégé chez un patient opérable ; fibrothorax symptomatique persistant plusieurs mois ; certains épanchements malins avec poumon non expansible, après discussion des risques (BTS 2023).</p>
<div class="lab">Décision</div><p>La BTS 2023 demande une décision individualisée selon l’état du patient et le stade de l’empyème. Une part de l’épaississement régresse spontanément ; une décortication trop précoce du fibrothorax est inutile.</p></template>

<template data-pop="j90-plaques" data-title="Plaques pleurales">
<div class="lab">Aspect</div><p>Épaississements circonscrits de la plèvre pariétale, souvent bilatéraux, situés sur la paroi postéro-latérale et le diaphragme, fréquemment calcifiés. Ils respectent habituellement les culs-de-sac et les sommets.</p>
<div class="lab">Histologie</div><p>Collagène hyalin acellulaire disposé en couches, recouvert d’un mésothélium normal.</p>
<div class="lab">Signification</div><p>Ce sont des marqueurs d’exposition à l’amiante, apparaissant habituellement des décennies après son début. Elles ne sont ni un cancer ni une lésion précancéreuse ; la Suva le rappelle dans ses documents. Elles ne réduisent habituellement pas la fonction respiratoire.</p>
<div class="lab">Codage</div><p>J92.0 si l’amiante est mis en évidence, J92.9 sinon.</p></template>

<template data-pop="j90-epaiss" data-title="Épaississement pleural diffus">
<div class="lab">Définition</div><p>Épaississement continu de la plèvre viscérale, étendu, qui oblitère le cul-de-sac costodiaphragmatique et adhère à la plèvre pariétale.</p>
<div class="lab">Causes</div><p>Amiante, souvent après un épanchement bénin lié à l’amiante ; séquelles d’empyème, d’hémothorax ou de tuberculose ; médicaments comme les dérivés de l’ergot.</p>
<div class="lab">Conséquence</div><p>Syndrome restrictif avec baisse de la capacité vitale et dyspnée d’effort. Contrairement aux plaques, il a un retentissement fonctionnel.</p>
<div class="lab">Piège</div><p>Un épaississement nodulaire, circonférentiel ou médiastinal fait suspecter un mésothéliome ou des métastases et impose une biopsie.</p></template>

<template data-pop="j90-atelect" data-title="Atélectasie ronde">
<div class="lab">Mécanisme</div><p>Une portion de poumon périphérique s’enroule et se collabe contre une plèvre viscérale épaissie et rétractée, souvent après un épanchement lié à l’amiante.</p>
<div class="lab">Aspect</div><p>Masse arrondie sous-pleurale de quelques centimètres, au contact d’un épaississement pleural, avec des vaisseaux et des bronches qui convergent vers elle en courbe, décrits comme une queue de comète.</p>
<div class="lab">Conséquence</div><p>Reconnue sur la tomodensitométrie, elle évite une chirurgie inutile ; une croissance ou un aspect atypique impose néanmoins une biopsie, car un cancer bronchique peut coexister chez ces patients exposés.</p></template>

<template data-pop="j90-suva" data-title="Annonce à la Suva">
<div class="lab">Pourquoi</div><p>En Suisse, l’assurance-accidents obligatoire couvre les maladies professionnelles. Les maladies liées à l’amiante, dont les plaques pleurales, le mésothéliome, le cancer bronchique et l’asbestose, peuvent être reconnues lorsque l’exposition professionnelle en est la cause prépondérante.</p>
<div class="lab">Comment</div><p>Le médecin documente l’anamnèse professionnelle complète et les examens, et annonce le cas à l’assureur-accidents, le plus souvent la Suva. Les personnes vivant à l’étranger exposées autrefois en Suisse peuvent aussi être examinées.</p>
<div class="lab">Limites</div><p>La reconnaissance n’est pas automatique : la jurisprudence fédérale exige que l’origine professionnelle soit établie avec une vraisemblance prépondérante.</p>
<div class="lab">Source</div><p>Suva, page « Asbesterkrankungen und Versicherungsschutz », consultée le 08.10.2026 : interdiction de l’amiante en 1990, environ 150 décès par an en Suisse.</p></template>

<template data-pop="j90-d-furo" data-title="Furosémide">
<div class="lab">Mécanisme</div><p>Il bloque le cotransporteur Na-K-2Cl de la branche ascendante large de l’anse de Henle. L’excrétion de sodium et d’eau augmente, la volémie et la pression veineuse baissent, et la filtration vers la plèvre diminue.</p>
<div class="lab">Posologie</div><p>Insuffisance cardiaque (ESC 2021) : 20 à 40 mg par jour au début, 40 à 240 mg par jour selon la réponse. Hydrothorax hépatique (EASL 2018) : 40 mg par jour en association avec la spironolactone, jusqu’à 160 mg par jour.</p>
<div class="lab">Effets indésirables</div><p>Hypokaliémie, hyponatrémie, déshydratation, insuffisance rénale fonctionnelle, hyperuricémie, ototoxicité à fortes doses intraveineuses.</p>
<div class="lab">Surveillance</div><p>Poids, diurèse, kaliémie, natrémie, créatinine.</p>
<div class="lab">Remarque</div><p>Les doses sont tirées des recommandations ; l’information professionnelle suisse n’a pas pu être relue le 08.10.2026.</p></template>

<template data-pop="j90-d-spiro" data-title="Spironolactone">
<div class="lab">Mécanisme</div><p>Antagoniste du récepteur des minéralocorticoïdes dans le tube collecteur. Dans la cirrhose, l’hyperaldostéronisme secondaire retient le sodium : la spironolactone en est le diurétique le plus logique.</p>
<div class="lab">Posologie</div><p>EASL 2018 : 100 mg par jour au début, augmentés par paliers jusqu’à 400 mg par jour, associés au furosémide.</p>
<div class="lab">Effets indésirables</div><p>Hyperkaliémie, insuffisance rénale, gynécomastie douloureuse, hyponatrémie.</p>
<div class="lab">Contre-indications et prudence</div><p>Hyperkaliémie, insuffisance rénale sévère ; association avec inhibiteurs de l’enzyme de conversion, sartans ou potassium sous surveillance stricte.</p></template>

<template data-pop="j90-d-iet" data-title="Altéplase et dornase alfa intrapleurales">
<div class="lab">Mécanisme</div><p>L’altéplase active le plasminogène en plasmine, qui dégrade les cloisons de fibrine. La dornase alfa clive l’ADN extracellulaire libéré par les neutrophiles, qui rend le pus visqueux. Ensemble, elles rendent la collection drainable.</p>
<div class="lab">Preuves</div><p>MIST2 (New England Journal of Medicine, 2011, 210 patients) : l’association a réduit l’opacité pleurale au septième jour (−29,5 % contre −17,2 % sous placebo), le recours à la chirurgie à 3 mois (4 % contre 16 %) et la durée d’hospitalisation (différence de 6,7 jours). Chaque agent seul était inefficace, et la dornase seule augmentait le recours à la chirurgie.</p>
<div class="lab">Posologie</div><p>Altéplase 10 mg et dornase alfa 5 mg, chacune deux fois par jour pendant 3 jours, par le drain (BTS 2023). Une dose réduite d’altéplase de 5 mg peut être utilisée si le risque hémorragique est élevé.</p>
<div class="lab">Indication</div><p>Collection résiduelle quand le drain ne draine plus (BTS 2023, conditionnelle par consensus).</p>
<div class="lab">Sécurité</div><p>Risque de saignement pleural : consentement, surveillance de l’aspect du liquide et de l’hémoglobine. Usage intrapleural hors autorisation suisse.</p></template>

<template data-pop="j90-d-lido" data-title="Lidocaïne pour les gestes pleuraux">
<div class="lab">Mécanisme</div><p>Elle bloque les canaux sodiques voltage-dépendants des fibres nerveuses et empêche la propagation du potentiel d’action douloureux.</p>
<div class="lab">Usage</div><p>Infiltration de la peau, du périoste du bord costal et de la plèvre pariétale, seule structure sensible du trajet profond. L’aspiration de liquide pleural pendant l’infiltration confirme la profondeur.</p>
<div class="lab">Toxicité</div><p>Un surdosage provoque paresthésies péribuccales, acouphènes, convulsions puis troubles du rythme. L’information professionnelle suisse de Rapidocain autorise au plus 400 mg pour une infiltration chez l’adulte. Pour les gestes pleuraux, ce cours retient le plafond plus prudent de la BTS, 3 mg/kg sans dépasser 250 mg, comme dans J93 — Pneumothorax (P-02-Pneumologie). Chez un patient de 60 kg, ce plafond correspond à 180 mg, soit 18 mL de lidocaïne à 1 %.</p>
<div class="lab">Piège</div><p>La lidocaïne mélangée au prélèvement abaisse le pH pleural ; le prélèvement destiné au pH se fait avec une autre seringue.</p></template>

<template data-pop="j90-d-ains" data-title="Antalgie des gestes pleuraux et de la pleurésie">
<div class="lab">Douleur pleurétique</div><p>Le paracétamol et un anti-inflammatoire non stéroïdien soulagent l’inflammation pariétale chez le patient sans contre-indication.</p>
<div class="lab">Après talcage</div><p>L’essai TIME1 (JAMA, 2015, 320 patients) a montré une douleur équivalente sous anti-inflammatoire et sous opioïde, et un taux d’échec de symphyse à 3 mois non inférieur sous anti-inflammatoire (23 % contre 20 %). Les anti-inflammatoires ne sont donc pas à proscrire pour cette raison.</p>
<div class="lab">Contre-indications</div><p>Cirrhose, insuffisance rénale, ulcère actif, insuffisance cardiaque décompensée, anticoagulation à haut risque hémorragique.</p></template>

<template data-pop="j90-d-octreo" data-title="Octréotide dans le chylothorax">
<div class="lab">Mécanisme</div><p>Analogue de la somatostatine, il réduit les sécrétions digestives et le débit splanchnique, ce qui diminuerait la production de chyle.</p>
<div class="lab">Preuves</div><p>Séries de cas et études observationnelles, surtout pédiatriques et postopératoires ; aucun essai randomisé ne prouve son efficacité.</p>
<div class="lab">Statut</div><p>Usage hors autorisation suisse ; posologie non standardisée. Il ne remplace ni le drainage, ni la modification nutritionnelle, ni la ligature ou l’embolisation d’une fuite persistante.</p></template>
