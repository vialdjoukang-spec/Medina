<template data-pop="j10-q-decision" data-title="Quatre décisions devant un syndrome grippal"><p class="lab">Fonction et cible</p><p>Un syndrome grippal associe en général une fièvre d’apparition brutale, une toux ou un mal de gorge et des signes généraux. Il impose quatre décisions successives : tester ou non, traiter par antiviral ou non, soigner à domicile ou à l’hôpital, protéger l’entourage.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces décisions suivent un ordre logique. La gravité se juge d’abord, parce qu’un patient instable doit être orienté avant tout test. Le terrain se juge ensuite, parce qu’il détermine l’indication d’un antiviral. Le test ne vient qu’après, lorsque son résultat modifie la conduite. La protection de l’entourage découle de la contagiosité, maximale pendant les trois premiers jours.</p><p class="lab">Conséquence clinique</p><p>Chez un adulte jeune sans facteur de risque, le diagnostic clinique en période épidémique suffit le plus souvent ; il n’a besoin ni de test ni d’antiviral. Chez un patient à risque ou hospitalisé, le test et l’antiviral sont discutés immédiatement.</p><div class="key"><b>Limite.</b> Ces étapes résument la démarche ; elles ne remplacent ni les recommandations détaillées des parties Diagnostic et Prise en charge, ni le jugement clinique dans une situation inhabituelle.</div><p class="src">Références : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j10-types" data-title="Types A, B, C et D du virus influenza"><p class="lab">Fonction et cible</p><p>Les quatre types se distinguent par leurs protéines internes, la nucléoprotéine et la protéine de matrice. Ils diffèrent par leurs hôtes et par leur capacité épidémique.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le type A infecte les oiseaux aquatiques sauvages, qui hébergent presque tous ses sous-types, ainsi que les volailles, les porcs, les chevaux et l’être humain. Ce large éventail d’hôtes permet les réassortiments entre virus d’espèces différentes. Le type B circule presque exclusivement chez l’être humain ; il évolue par dérive mais ne subit pas de cassure. Le type C provoque des infections respiratoires bénignes, surtout chez l’enfant. Le type D infecte surtout les bovins ; aucune maladie humaine ne lui est clairement attribuée.</p><p class="lab">Conséquence clinique</p><p>Seuls les types A et B causent les épidémies saisonnières et sont inclus dans les vaccins. Seul le type A peut provoquer une pandémie. Les deux types peuvent provoquer une grippe grave : chez l’enfant et lors de certaines saisons, le type B est loin d’être bénin.</p><div class="key"><b>Limite.</b> Le type n’indique pas la gravité individuelle. Un test qui distingue A et B ne précise pas le sous-type ; seul un laboratoire de référence identifie un virus zoonotique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j10-hn" data-title="Hémagglutinine et neuraminidase : sous-types H et N"><p class="lab">Fonction et cible</p><p>L’hémagglutinine et la neuraminidase sont les deux glycoprotéines de l’enveloppe virale. Elles servent à classer les virus du type A en sous-types, notés H et N suivis d’un numéro.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’hémagglutinine fixe le virus à l’acide sialique de la cellule et permet la fusion des membranes. La neuraminidase coupe l’acide sialique pour libérer les virions néoformés. On connaît au moins 18 hémagglutinines et 11 neuraminidases ; deux de ces sous-types n’ont été trouvés que chez des chauves-souris. Les anticorps protecteurs visent surtout la tête de l’hémagglutinine.</p><p class="lab">Conséquence clinique</p><p>Le sous-type renseigne sur l’origine et le comportement épidémique d’un virus. Les sous-types humains saisonniers actuels sont H1N1 et H3N2 ; H5N1 est un sous-type aviaire. Les deux glycoprotéines sont aussi les cibles des vaccins (hémagglutinine) et des inhibiteurs de la neuraminidase.</p><div class="key"><b>Limite.</b> Deux virus du même sous-type peuvent différer beaucoup par leurs antigènes et leur gravité. Le virus A(H1N1)pdm09 et le virus H1N1 de 1918 partagent un sous-type, mais pas leurs propriétés épidémiques.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j10-nomenclature" data-title="Nom complet d’une souche de grippe"><p class="lab">Fonction et cible</p><p>Le nom d’une souche indique son type, son hôte d’origine s’il n’est pas humain, le lieu du premier isolement, le numéro de la souche, l’année et, pour le type A, le sous-type entre parenthèses.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une souche notée A/Lieu/numéro/année(H3N2) est un virus du type A, isolé chez l’être humain dans ce lieu cette année-là, de sous-type H3N2. Pour un virus animal, l’espèce s’ajoute après le type, par exemple « A/canard/… ». Le suffixe « pdm09 » distingue le virus pandémique de 2009 des virus H1N1 antérieurs.</p><p class="lab">Conséquence clinique</p><p>Cette nomenclature permet de lire la composition annuelle du vaccin, qui désigne chaque souche par son nom complet, et de comprendre les rapports de surveillance.</p><div class="key"><b>Limite.</b> Le nom d’une souche ne renseigne pas sur sa sensibilité aux antiviraux ni sur sa concordance avec le vaccin ; ces informations viennent des laboratoires de référence.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j10-derive" data-title="Dérive antigénique"><p class="lab">Fonction et cible</p><p>La dérive antigénique est l’accumulation progressive de mutations ponctuelles dans les gènes de l’hémagglutinine et de la neuraminidase. Elle touche les types A et B.</p><p class="lab">Mécanisme de l’affirmation</p><p>La polymérase virale copie l’acide ribonucléique sans corriger ses erreurs. Une fraction des mutations modifie les sites de l’hémagglutinine reconnus par les anticorps neutralisants. Dans une population déjà partiellement immunisée, ces variants échappent mieux aux anticorps et se multiplient davantage : la sélection naturelle les favorise.</p><p class="lab">Conséquence clinique</p><p>La dérive explique les épidémies annuelles, les réinfections au cours de la vie et la révision annuelle de la composition du vaccin par l’OMS. Elle explique aussi qu’un vaccin puisse être moins efficace une saison donnée : en 2023/2024, 18 % des virus suisses caractérisés ne réagissaient pas aux antisérums dirigés contre les souches vaccinales.</p><div class="key"><b>Limite.</b> La dérive est continue et modérée ; elle ne crée pas de nouveau sous-type. Une immunité croisée partielle persiste en général, ce qui distingue une épidémie saisonnière d’une pandémie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j10-cassure" data-title="Cassure antigénique et pandémie"><p class="lab">Fonction et cible</p><p>La cassure antigénique est l’apparition chez l’être humain d’un virus du type A porteur d’une hémagglutinine nouvelle pour la population. Elle seule peut provoquer une pandémie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le génome est divisé en huit segments. Lorsque deux virus différents, par exemple un virus humain et un virus aviaire, infectent la même cellule, les virions néoformés peuvent combiner des segments des deux parents : c’est le réassortiment. Le porc, dont les voies respiratoires portent des récepteurs pour les virus humains et aviaires, peut servir de lieu de mélange. Le virus de 2009 est un réassortant d’origine porcine. Un virus animal peut aussi s’adapter directement à l’être humain par mutations.</p><p class="lab">Conséquence clinique</p><p>Une pandémie exige trois conditions : une hémagglutinine nouvelle, une population sans immunité et une transmission interhumaine efficace. Elle touche alors des adultes jeunes, habituellement épargnés par les formes graves, et peut survenir hors de la saison hivernale. Le virus pandémique remplace souvent le virus saisonnier du même type et devient lui-même saisonnier.</p><div class="key"><b>Limite.</b> La plupart des infections humaines par des virus aviaires restent des impasses : sans transmission interhumaine soutenue, elles ne constituent pas une pandémie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a>.</p></template>
<template data-pop="j10-codage" data-title="Trois pièges de codage de la grippe"><p class="lab">Fonction et cible</p><p>Le code de la grippe dépend du virus identifié : J09 pour un virus zoonotique ou pandémique, J10 pour un virus saisonnier confirmé, J11 en l’absence d’identification.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le premier piège est un nom trompeur : <i>Haemophilus influenzae</i> est une bactérie, sans lien avec le virus influenza ; ses infections sont exclues des catégories J09 à J11. Le deuxième piège est le rhume : une infection aiguë des voies respiratoires supérieures sans grippe est exclue de J11 et se code ailleurs. Le troisième piège concerne les virus pandémiques devenus saisonniers : la CIM-10-GM renvoie aux règles du programme mondial de lutte contre la grippe de l’OMS pour décider si un virus relève encore de J09. Le virus A(H1N1)pdm09, qui circule chaque hiver, se code aujourd’hui comme un virus saisonnier.</p><p class="lab">Conséquence clinique</p><p>Un codage exact garantit la qualité des statistiques de morbidité et de mortalité. Une pneumonie ou une autre manifestation d’une grippe J09 se code par un code supplémentaire, car J09 n’a pas de subdivision.</p><div class="key"><b>Limite.</b> Les règles de codage ne remplacent pas la déclaration obligatoire : un virus zoonotique suspecté se déclare à l’autorité sanitaire, quel que soit le code retenu.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j09-j18.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc J09 à J18, version allemande officielle</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j10-sentinella" data-title="Réseau Sentinella et définition du syndrome grippal"><p class="lab">Fonction et cible</p><p>Sentinella est un réseau de médecins de premier recours volontaires, généralistes, internistes et pédiatres, d’environ 170 cabinets. Il estime l’activité grippale dans la population, car la plupart des patients peu malades ne sont jamais testés.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les médecins déclarent chaque semaine les consultations pour syndrome grippal. La définition retenue est l’apparition soudaine d’une forte fièvre de plus de 38 °C, d’une toux ou de maux de gorge, éventuellement accompagnés d’une sensation marquée de maladie, de faiblesse, de douleurs musculaires ou articulaires, de céphalées et de symptômes digestifs. Une partie des médecins envoie des frottis nasopharyngés au Centre national de référence de l’influenza, aux Hôpitaux universitaires de Genève, qui recherche plusieurs virus par PCR multiplex.</p><p class="lab">Conséquence clinique</p><p>L’OFSP extrapole ces déclarations à la population suisse et publie un bulletin hebdomadaire. Le médecin s’en sert pour estimer la probabilité qu’un syndrome grippal soit une grippe.</p><div class="key"><b>Limite.</b> L’échantillon est petit : l’OFSP recommande d’interpréter les extrapolations avec prudence. La définition du syndrome grippal n’est pas spécifique de la grippe ; d’autres virus la remplissent.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j10-seuil" data-title="Seuil épidémique : ancienne et nouvelle méthode"><p class="lab">Fonction et cible</p><p>Un seuil épidémique sert à dater le début et la fin d’une épidémie. Il permet d’annoncer aux médecins que la grippe circule.</p><p class="lab">Mécanisme de l’affirmation</p><p>Jusqu’à la saison 2019/2020, l’OFSP fixait avant chaque saison un seuil de consultations pour syndrome grippal, calculé sur les saisons précédentes. La pandémie de COVID-19 a modifié la fréquence des consultations et la circulation des virus ; l’OFSP a renoncé à fixer ce seuil à partir de 2020/2021. Le rapport 2023/2024 décrit la saison par le taux de frottis Sentinella positifs pour un virus influenza, qui a dépassé 10 % de la semaine 49 à la semaine 11, avec un maximum de 46,2 % la cinquième semaine.</p><p class="lab">Conséquence clinique</p><p>Le taux de positivité dit directement quelle part des syndromes grippaux est due à la grippe. Lorsqu’il atteint 40 %, un syndrome grippal sur deux à trois est une grippe ; hors saison, ce taux reste très bas.</p><div class="key"><b>Limite.</b> Ce taux dépend de la sélection des patients prélevés. Certains cantons emploient leurs propres seuils ; le médecin vérifie la source de l’indicateur qu’il lit.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/bag/fr/dokumente/mt/infektionskrankheiten/grippe/saisonbericht-grippe-2021-22.pdf.download.pdf/saisonbericht-grippe-2021-22_FR.pdf" target="_blank" rel="noopener">OFSP, Rapport sur la saison grippale 2021/2022</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j10-age" data-title="Incidence et gravité selon l’âge"><p class="lab">Fonction et cible</p><p>L’âge modifie à la fois la probabilité d’infection et la probabilité de complication. Les deux ne vont pas dans le même sens.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les jeunes enfants n’ont pas encore rencontré la plupart des virus ; ils s’infectent plus souvent et excrètent plus longtemps. En 2023/2024, les consultations Sentinella étaient les plus fréquentes chez les 0 à 4 ans et les moins fréquentes chez les 65 ans et plus. Chez la personne âgée, l’immunosénescence et les comorbidités augmentent la gravité : une pneumonie compliquait 8,6 % des consultations des 65 ans et plus, contre 3,4 % de l’ensemble des patients, et l’âge médian des hospitalisés était de 71 ans.</p><p class="lab">Conséquence clinique</p><p>La vaccination et l’antiviral visent en priorité les personnes âgées, qui portent l’essentiel des complications. La vaccination de l’entourage des nourrissons de moins de six mois les protège indirectement, car ils ne peuvent pas être vaccinés.</p><div class="key"><b>Limite.</b> Ces données décrivent une saison où A(H1N1)pdm09 dominait. Lors des saisons à A(H3N2), la charge chez les personnes âgées est souvent plus lourde ; une saison ne prédit pas la suivante.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j10-fardeau" data-title="Hospitalisations et décès dus à la grippe en Suisse"><p class="lab">Fonction et cible</p><p>Le fardeau de la grippe mesure son impact sur le système de santé. Il justifie la stratégie nationale de prévention et la vaccination des groupes à risque.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’OFSP indique que les complications de la grippe entraînent chaque année plusieurs milliers d’hospitalisations et fréquemment plusieurs centaines de décès. Ces chiffres sont des estimations : beaucoup de décès surviennent par décompensation cardiaque ou pulmonaire chez des patients jamais testés, et sont attribués à une autre cause. En 2023/2024, les six hôpitaux du système de surveillance ont recensé 1653 hospitalisations pour grippe, dont 12,0 % avec séjour aux soins intensifs et 4,2 % de décès hospitaliers.</p><p class="lab">Conséquence clinique</p><p>Le médecin peut expliquer à un patient âgé que la grippe n’est pas une maladie anodine pour lui. L’hospitalisation contractée à l’hôpital dans 17,2 % des cas montre que la vaccination du personnel protège aussi les patients.</p><div class="key"><b>Limite.</b> Les six hôpitaux de surveillance ne représentent pas tous les hôpitaux suisses, et ce système a été suspendu fin août 2024. Les données plus récentes doivent être lues sur le portail de l’OFSP.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/strategie-nationale-de-prevention-de-la-grippe-grips" target="_blank" rel="noopener">OFSP, Stratégie nationale de prévention de la grippe, publiée le 06.01.2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j10-ha" data-title="Hémagglutinine et acide sialique"><p class="lab">Fonction et cible</p><p>L’hémagglutinine reconnaît l’acide sialique terminal des glycoprotéines de la cellule. La liaison de ce sucre à l’avant-dernier sucre peut se faire par deux liaisons, alpha 2,6 ou alpha 2,3.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les virus humains se lient de préférence à l’acide sialique en liaison alpha 2,6, abondant dans l’épithélium des voies aériennes supérieures humaines. Les virus aviaires préfèrent la liaison alpha 2,3, présente chez l’être humain surtout dans les bronchioles et les alvéoles. Pour devenir fonctionnelle, l’hémagglutinine doit aussi être clivée par des protéases de l’hôte. Les virus saisonniers possèdent un site de clivage reconnu seulement par des protéases de l’épithélium respiratoire ; certains virus aviaires hautement pathogènes, dont A(H5N1), possèdent un site multibasique, clivé par des protéases présentes dans de nombreux tissus.</p><p class="lab">Conséquence clinique</p><p>Un virus aviaire se fixe mal au nez et à la gorge de l’être humain : il se transmet mal d’une personne à l’autre. Lorsqu’il atteint les alvéoles, il provoque en revanche une pneumonie grave. Ce double comportement explique la rareté et la gravité des infections humaines par A(H5N1).</p><div class="key"><b>Limite.</b> Un petit nombre de mutations peut déplacer la préférence de l’hémagglutinine vers la liaison alpha 2,6. La surveillance génétique des virus aviaires recherche précisément ces mutations.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a>.</p></template>
<template data-pop="j10-cycle" data-title="Endocytose, polymérase virale et vol de coiffe"><p class="lab">Fonction et cible</p><p>Après l’attachement, le virus doit livrer son génome au noyau, puis faire produire ses protéines par la cellule. Ces étapes reposent sur la protéine de matrice 2 et sur la polymérase virale à trois sous-unités.</p><p class="lab">Mécanisme de l’affirmation</p><p>La vésicule d’endocytose s’acidifie. Le canal ionique de la protéine de matrice 2 laisse entrer des protons dans le virion et libère ses ribonucléoprotéines ; l’acidité modifie aussi la forme de l’hémagglutinine, qui fusionne l’enveloppe avec la membrane. Dans le noyau, la polymérase virale arrache l’extrémité coiffée des ARN messagers de la cellule et s’en sert d’amorce pour ses propres ARN messagers. Ce « vol de coiffe » dépend d’une activité endonucléase portée par une sous-unité de la polymérase.</p><p class="lab">Conséquence clinique</p><p>Le baloxavir marboxil inhibe cette endonucléase et réduit rapidement la charge virale. L’amantadine bloquait le canal de la protéine de matrice 2 ; la résistance quasi générale des virus actuels l’a rendue inutilisable. La polymérase ne corrige pas ses erreurs, d’où la dérive antigénique.</p><div class="key"><b>Limite.</b> Une mutation de l’endonucléase peut réduire la sensibilité au baloxavir, surtout chez l’enfant et l’immunodéprimé. Les détails sont traités dans l’onglet Pharmacologie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j10-na" data-title="Neuraminidase et libération des virions"><p class="lab">Fonction et cible</p><p>La neuraminidase est une enzyme de surface qui coupe l’acide sialique. Elle agit à la fin du cycle et pendant la traversée du mucus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les virions néoformés bourgeonnent à la membrane cellulaire, qui porte de l’acide sialique. Sans neuraminidase, l’hémagglutinine les retiendrait à la surface de la cellule et les ferait s’agréger entre eux. La neuraminidase coupe ces liaisons et libère les virions. Elle découpe aussi les mucines sialylées du mucus, qui piégeraient sinon le virus avant qu’il n’atteigne l’épithélium.</p><p class="lab">Conséquence clinique</p><p>L’oseltamivir et le zanamivir inhibent la neuraminidase : les virions restent attachés à la cellule infectée et l’infection progresse moins vite vers les cellules voisines. Comme ils n’agissent pas sur les cellules déjà infectées, leur bénéfice est maximal lorsqu’ils sont donnés tôt, pendant la phase de réplication active.</p><div class="key"><b>Limite.</b> Des mutations de la neuraminidase peuvent conférer une résistance ; le Centre national de référence de l’influenza la recherche sur un échantillon de virus suisses. La neuraminidase favorise aussi l’adhérence du pneumocoque, ce qui relie ce mécanisme aux surinfections.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j10-ifn" data-title="Interférons et protéine non structurale 1"><p class="lab">Fonction et cible</p><p>Les interférons de type I et III sont la première ligne de défense antivirale. Ils sont produits dans les heures qui suivent l’infection d’une cellule.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des senseurs cytosoliques reconnaissent l’acide ribonucléique viral, qui porte des caractéristiques absentes des ARN de la cellule. Leur activation déclenche la sécrétion d’interférons, qui induisent dans les cellules voisines des protéines antivirales freinant la réplication. Le virus produit une protéine non structurale qui inhibe ces senseurs et la synthèse des interférons. L’issue des premières heures dépend de cet équilibre.</p><p class="lab">Conséquence clinique</p><p>Une réponse interféron efficace limite la réplication à l’épithélium bronchique. Une réponse retardée laisse la charge virale monter, puis s’accompagne d’une inflammation excessive. Les interférons participent aussi à la fièvre et à la fatigue des premiers jours.</p><div class="key"><b>Limite.</b> La réponse interféron altère le recrutement des polynucléaires et des macrophages contre les bactéries ; elle contribue ainsi à la surinfection. Une même réponse protège contre le virus et fragilise contre les bactéries.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j10-cytokines" data-title="Des cytokines aux symptômes généraux"><p class="lab">Fonction et cible</p><p>Les cytokines inflammatoires relient l’infection locale aux symptômes généraux. Elles expliquent que le patient se sente très malade dès le premier jour.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez 19 volontaires infectés par un virus A(H1N1), l’IL-6 et l’interféron alpha des sécrétions nasales culminaient le deuxième jour et évoluaient avec la charge virale, la température, la production de mucus et les scores de symptômes. Le TNF s’élevait plus tard, aux troisième et quatrième jours. Ces cytokines agissent sur l’hypothalamus par la PGE₂, qui élève le point de consigne thermique : le patient frissonne pour produire de la chaleur jusqu’à ce que sa température atteigne ce nouveau point.</p><p class="lab">Conséquence clinique</p><p>Un antipyrétique comme le paracétamol abaisse la PGE₂ et soulage la fièvre et les courbatures, sans agir sur le virus. L’intensité des symptômes généraux du deuxième jour correspond au pic de réplication et de contagiosité.</p><div class="key"><b>Limite.</b> Cette étude porte sur des adultes jeunes infectés expérimentalement ; elle ne décrit pas la réponse de la personne âgée, chez qui la fièvre peut manquer malgré une infection active.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j10-adaptatif" data-title="Anticorps et lymphocytes T dans la grippe"><p class="lab">Fonction et cible</p><p>L’immunité adaptative élimine le virus et protège contre les réinfections par une souche proche. Elle associe des anticorps et des lymphocytes T.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les anticorps dirigés contre la tête de l’hémagglutinine neutralisent le virus et empêchent son attachement ; les IgA sécrétoires protègent la muqueuse. Les anticorps contre la neuraminidase limitent la diffusion de l’infection. Les lymphocytes T CD8 reconnaissent des protéines internes, plus stables d’une souche à l’autre, et détruisent les cellules infectées. Lors d’une première rencontre, cette réponse demande une à deux semaines ; chez un sujet déjà exposé, la mémoire la rend plus rapide.</p><p class="lab">Conséquence clinique</p><p>Les anticorps expliquent la protection vaccinale, qui dépend de la concordance entre souches vaccinale et circulante. Les lymphocytes T expliquent qu’une exposition antérieure atténue la gravité même lorsqu’elle n’empêche pas l’infection.</p><div class="key"><b>Limite.</b> Les anticorps contre l’hémagglutinine sont spécifiques de la souche : la dérive les contourne. Un déficit de l’immunité cellulaire, par exemple après une greffe, prolonge l’excrétion virale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j10-dad" data-title="Pneumonie virale primaire et dommage alvéolaire diffus"><p class="lab">Fonction et cible</p><p>La pneumonie virale primaire est une atteinte des alvéoles par le virus lui-même, sans bactérie. Elle survient en général dans les trois à cinq premiers jours de la maladie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus infecte les pneumocytes et l’endothélium des capillaires alvéolaires. Les cellules meurent, la barrière alvéolo-capillaire devient perméable, et un exsudat riche en protéines remplit les alvéoles. La fibrine se dépose sur les parois et forme des membranes hyalines ; c’est le dommage alvéolaire diffus. Le sang qui traverse ces alvéoles non ventilées n’est pas oxygéné : il se crée un effet shunt, qui résiste à l’oxygène.</p><p class="lab">Conséquence clinique</p><p>Le patient présente une dyspnée croissante, une tachypnée et une hypoxémie, avec souvent des opacités bilatérales. L’évolution vers un SDRA peut exiger une ventilation mécanique, voire une oxygénation par membrane extracorporelle.</p><div class="key"><b>Limite.</b> La pneumonie virale primaire et la surinfection bactérienne peuvent coexister. L’imagerie et la clinique ne permettent pas toujours de les séparer, d’où la recherche microbiologique décrite dans l’onglet Examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j10-surinfection" data-title="Synergie entre virus influenza et bactéries"><p class="lab">Fonction et cible</p><p>La surinfection bactérienne est une pneumonie due à une bactérie qui profite des lésions provoquées par le virus. Elle est la principale cause de décès des grandes pandémies anciennes.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose la membrane basale, à laquelle les bactéries adhèrent. La neuraminidase coupe l’acide sialique et dévoile des récepteurs bactériens. Les interférons et la mort des macrophages alvéolaires réduisent la capacité à éliminer les bactéries. Le pneumocoque, le staphylocoque doré et le streptocoque du groupe A colonisent alors les voies aériennes basses. L’examen de 58 autopsies de 1918 et de 109 séries publiées montre que la majorité des décès de cette pandémie résultaient d’une pneumonie bactérienne secondaire.</p><p class="lab">Conséquence clinique</p><p>Une surinfection se manifeste typiquement par une aggravation après une amélioration initiale, entre le quatrième et le quatorzième jour environ. La vaccination antipneumococcique des groupes à risque et un antibiotique ciblé en cas de surinfection documentée ou probable découlent de ce mécanisme.</p><div class="key"><b>Limite.</b> La plupart des grippes ne se surinfectent pas. Un antibiotique systématique n’a pas d’indication dans une grippe non compliquée ; il expose aux effets indésirables et aux résistances.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., causes de décès de la pandémie de 1918, 2008</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j10-voies" data-title="Gouttelettes, aérosols et contact"><p class="lab">Fonction et cible</p><p>Les particules respiratoires émises par un patient ont des tailles variées. Les plus grosses tombent en un à deux mètres ; les plus fines restent en suspension plus longtemps dans un local mal ventilé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le CDC considère que le virus se transmet principalement par les gouttelettes émises lors de la toux, de l’éternuement ou de la parole, et moins souvent par le contact avec une surface contaminée suivi d’un contact avec la bouche, le nez ou les yeux. Des particules fines contenant du virus sont aussi émises ; leur part exacte dans la transmission reste discutée.</p><p class="lab">Conséquence clinique</p><p>Les mesures découlent des voies : masque chirurgical pour le patient et le soignant, distance, aération, hygiène des mains, nettoyage des surfaces. Lors des gestes générant des aérosols, comme l’intubation, le soignant porte un appareil de protection respiratoire filtrant.</p><div class="key"><b>Limite.</b> Aucune mesure isolée ne suffit. L’OFSP rappelle que le virus se transmet aussi avant l’apparition des symptômes, ce qui limite l’efficacité de l’isolement des seuls malades.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j10-incubation" data-title="Incubation et cinétique de l’excrétion virale"><p class="lab">Fonction et cible</p><p>L’incubation est le délai entre l’infection et les premiers symptômes. La période contagieuse correspond à la durée d’excrétion d’un virus capable d’infecter.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le CDC indique une incubation d’environ deux jours, de un à quatre jours ; l’OFSP retient un à trois jours. Dans les études d’inoculation volontaire, l’excrétion augmentait nettement entre 12 et 24 heures après l’infection, culminait le deuxième jour et durait en moyenne 4,8 jours. Le virus est donc présent dès la veille des symptômes. La contagiosité est maximale pendant les trois premiers jours de maladie et peut durer cinq à sept jours.</p><p class="lab">Conséquence clinique</p><p>Le malade limite ses contacts pendant les premiers jours, surtout avec des personnes à risque ; un soignant malade ne s’occupe pas de patients pendant cette période. Un contact qui tombe malade dans les quatre jours suivant l’exposition a probablement été infecté par ce cas.</p><div class="key"><b>Limite.</b> L’excrétion est plus longue chez le jeune enfant et chez l’immunodéprimé, parfois plusieurs semaines. Ces données de volontaires jeunes ne s’appliquent pas directement à la personne âgée.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j10-asympto" data-title="Infections asymptomatiques et peu symptomatiques"><p class="lab">Fonction et cible</p><p>Une infection asymptomatique est une infection confirmée sans symptôme ; une infection peu symptomatique ne provoque qu’un seul symptôme. Ces formes contribuent à la diffusion du virus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans les études d’inoculation, 66,9 % des infections étaient symptomatiques. Dans une étude de contacts familiaux à Hong Kong portant sur 235 infections secondaires, 11 % étaient asymptomatiques et 13 % peu symptomatiques. Ces patients excrétaient de l’ARN viral moins longtemps et en quantité inférieure de 1 à 2 logarithmes décimaux.</p><p class="lab">Conséquence clinique</p><p>Une personne qui se sent à peine malade peut infecter un patient fragile. La vaccination du personnel, le masque en période épidémique et l’hygiène des mains protègent mieux qu’un dépistage fondé sur les seuls symptômes.</p><div class="key"><b>Limite.</b> L’ARN détecté ne prouve pas la présence de virus infectieux ; la contribution exacte de ces formes à la transmission reste incertaine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28011603/" target="_blank" rel="noopener">Ip et al., excrétion virale des infections peu symptomatiques, 2017</a>.</p></template>
<template data-pop="j10-risque" data-title="Personnes à risque accru de complications selon l’OFSP"><p class="lab">Fonction et cible</p><p>L’OFSP définit les personnes à risque accru de complications de la grippe. Cette liste fixe les cibles prioritaires de la vaccination, prise en charge par l’assurance obligatoire des soins sous réserve de la franchise.</p><p class="lab">Mécanisme de l’affirmation</p><p>La liste comprend les personnes de 65 ans et plus, les femmes enceintes ou ayant accouché au cours des quatre dernières semaines, et les enfants prématurés, nés avant 32 semaines ou pesant moins de 1500 g, pendant leurs deux premiers hivers dès l’âge de six mois. Elle comprend aussi, dès six mois, les personnes atteintes de maladie cardiaque, pulmonaire, métabolique affectant le cœur, le poumon ou le rein, comme le diabète ou l’obésité morbide, d’une maladie neurologique ou musculosquelettique, hépatique, d’une insuffisance rénale, d’une asplénie, d’une hémoglobinopathie ou d’une immunodéficience. Les résidents des établissements de soins y figurent également.</p><p class="lab">Conséquence clinique</p><p>Chaque catégorie correspond à un mécanisme d’aggravation, décrit dans le tableau du cours. Les mêmes patients sont ceux pour lesquels un antiviral précoce est discuté. Dès 75 ans, ou dès 65 ans avec un facteur de risque supplémentaire, l’OFSP privilégie un vaccin à dose élevée.</p><div class="key"><b>Limite.</b> La liste est conçue pour la vaccination ; elle ne remplace pas l’évaluation clinique. Un patient sans facteur de risque peut faire une forme grave.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j10-grossesse-risque" data-title="Pourquoi la grossesse aggrave la grippe"><p class="lab">Fonction et cible</p><p>La grossesse modifie la respiration, la circulation et l’immunité. Ces adaptations normales réduisent la tolérance à une pneumonie.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus refoule le diaphragme et diminue la capacité résiduelle fonctionnelle, réserve d’oxygène des poumons. La consommation d’oxygène et le débit cardiaque augmentent. L’immunité s’adapte pour tolérer le fœtus. Une hypoxémie maternelle réduit en outre l’oxygénation fœtale. Pendant la pandémie de 2009, aux États-Unis, 30 femmes enceintes sur 788 cas rapportés d’avril à août sont décédées, soit 5 % de tous les décès dus au virus pandémique rapportés sur cette période ; les auteurs concluent à un risque de mortalité disproportionnellement élevé. Parmi les 56 décès de femmes enceintes admises aux soins intensifs jusqu’à fin 2009, 64,3 % survenaient au troisième trimestre.</p><p class="lab">Conséquence clinique</p><p>L’OFSP recommande la vaccination à toute femme enceinte et pendant les quatre semaines suivant l’accouchement. Dans la même série, le traitement plus de quatre jours après le début des symptômes s’associait à davantage d’admissions aux soins intensifs que le traitement dans les deux jours.</p><div class="key"><b>Limite.</b> Les données de 2009 portent sur un virus pandémique et sur une surveillance américaine ; elles décrivent une association et non un essai randomisé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20407061/" target="_blank" rel="noopener">Siston et al., grippe pandémique et grossesse, 2010</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j10-oms-risque" data-title="Définitions du haut risque : OFSP, OMS et IDSA"><p class="lab">Fonction et cible</p><p>Plusieurs définitions du risque de forme grave coexistent. Elles servent à des décisions différentes : vaccination pour l’OFSP, traitement antiviral pour l’OMS et l’IDSA.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les lignes directrices cliniques de l’OMS du 12 septembre 2024 considèrent comme à haut risque de progression vers une forme grave les personnes de 65 ans et plus ou porteuses d’au moins un facteur de risque majeur (immunodépression, maladie cardiovasculaire, neurologique ou respiratoire chronique). Le risque extrêmement élevé correspond à 85 ans et plus, ou à plusieurs facteurs majeurs. Elles réservent la prophylaxie après exposition aux personnes à très haut risque. Les recommandations de l’IDSA de 2019 utilisent une liste proche de celle de l’OFSP, en y ajoutant notamment les enfants de moins de cinq ans et les personnes d’origine autochtone américaine.</p><p class="lab">Conséquence clinique</p><p>En Suisse, le médecin applique la liste de l’OFSP pour repérer les patients à risque. Pour l’antiviral, il suit la Société suisse d’infectiologie (fiche validée le 01.09.2026), qui reprend la liste de l’OMS : 65 ans et plus, immunodépression, maladie cardiovasculaire, neurologique ou respiratoire chronique, ou plusieurs facteurs de risque. Elle réserve en routine le traitement ambulatoire au risque très élevé : 85 ans et plus ou immunodépression. L’onglet Pharmacologie détaille ces indications. La recommandation de l’IDSA de 2019 reste accessible et cohérente sur l’indication chez l’hospitalisé.</p><div class="key"><b>Limite.</b> Les listes ne sont pas strictement superposables ; l’OMS formule des recommandations conditionnelles, fondées sur des preuves de certitude variable. Le jugement clinique tranche les cas limites.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j10-debut" data-title="Début brutal"><p class="lab">Fonction et cible</p><p>Le début brutal est le passage, en quelques heures, d’un état normal à un état de maladie franche. Le patient peut souvent indiquer l’heure à laquelle il a commencé à frissonner.</p><p class="lab">Mécanisme de l’affirmation</p><p>La réplication virale est très rapide : la charge virale et les cytokines culminent dès le deuxième jour. Les signes généraux apparaissent donc presque en même temps que les signes respiratoires, sans phase prodromique prolongée.</p><p class="lab">Conséquence clinique</p><p>Ce trait distingue la grippe du rhume, qui s’installe progressivement avec une rhinorrhée au premier plan. L’heure de début permet aussi de calculer le délai de 48 heures utile à la décision d’antiviral.</p><div class="key"><b>Limite.</b> Un début brutal n’est pas spécifique : une infection à SARS-CoV-2, une pneumonie à pneumocoque ou une méningite peuvent débuter de la même façon. Chez la personne âgée, le début peut être insidieux.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j10-fievre" data-title="Fièvre de la grippe"><p class="lab">Fonction et cible</p><p>La fièvre est une élévation du point de consigne thermique de l’hypothalamus. Dans la grippe, elle atteint souvent 38 à 40 °C dès le premier jour.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les cytokines et la PGE₂ élèvent le point de consigne ; les frissons produisent de la chaleur jusqu’à l’atteindre. Chez des adultes et adolescents présentant un syndrome grippal, la fièvre était présente chez 68 % des grippes confirmées et 40 % des autres causes. Dans les études d’inoculation, elle manquait souvent : elle n’apparaissait que dans 37 % des infections A(H1N1), 40,6 % des A(H3N2) et 7,5 % des infections B.</p><p class="lab">Conséquence clinique</p><p>La fièvre dure en général trois à cinq jours. Sa réapparition après une défervescence évoque une surinfection bactérienne. Une fièvre et une toux de moins de 48 heures, en période épidémique, ont une valeur prédictive positive de 79 % pour une grippe.</p><div class="key"><b>Limite.</b> L’absence de fièvre n’exclut pas une grippe, en particulier chez la personne âgée ou immunodéprimée, ou après la prise d’un antipyrétique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j10-myalgies" data-title="Courbatures et fatigue"><p class="lab">Fonction et cible</p><p>Les courbatures sont des douleurs musculaires diffuses, surtout du dos et des membres. La fatigue de la grippe oblige souvent à s’aliter.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces symptômes proviennent surtout des cytokines circulantes, IL-6 et interférons en particulier, qui agissent sur le muscle et sur le système nerveux central. Leur intensité suit le pic de réplication du deuxième jour. Le muscle lui-même est rarement infecté chez l’adulte.</p><p class="lab">Conséquence clinique</p><p>Des courbatures intenses orientent vers une grippe plutôt que vers un rhume. Une douleur musculaire très forte à la pression, des urines foncées ou une faiblesse font rechercher une myosite ou une rhabdomyolyse, décrites parmi les complications.</p><div class="key"><b>Limite.</b> La fatigue peut persister plus de deux semaines, surtout chez la personne âgée, sans signifier une complication. Elle ne justifie pas à elle seule des examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j10-cephalees" data-title="Céphalées de la grippe"><p class="lab">Fonction et cible</p><p>Les céphalées de la grippe sont souvent frontales ou rétro-orbitaires, parfois avec une douleur à la mobilisation des yeux.</p><p class="lab">Mécanisme de l’affirmation</p><p>Elles accompagnent la fièvre et l’inflammation systémique ; elles s’atténuent en général avec les antipyrétiques et la défervescence.</p><p class="lab">Conséquence clinique</p><p>Une céphalée fébrile banale ne demande pas d’examen. Une raideur de nuque, une confusion, une somnolence, des convulsions ou un déficit neurologique doivent faire rechercher une méningite bactérienne ou une encéphalite, qui sont des urgences.</p><div class="key"><b>Limite.</b> La grippe n’exclut pas une autre infection : le CDC signale notamment des infections invasives à méningocoque après une grippe.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j10-toux" data-title="Toux sèche, douleur rétrosternale et mal de gorge"><p class="lab">Fonction et cible</p><p>La toux de la grippe est d’abord sèche et quinteuse. Elle s’accompagne souvent d’une brûlure rétrosternale et d’un mal de gorge.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium de la trachée et des bronches ; les terminaisons nerveuses mises à nu déclenchent la toux et la sensation de brûlure. La toux était présente chez 93 % des grippes confirmées dans l’analyse de Monto. La réparation de l’épithélium demande plusieurs semaines, d’où une toux qui persiste souvent plus de deux semaines.</p><p class="lab">Conséquence clinique</p><p>Une toux prolongée sans fièvre ni dyspnée après une grippe est attendue et ne justifie pas d’antibiotique. Une toux devenue productive avec fièvre et dyspnée fait rechercher une pneumonie.</p><div class="key"><b>Limite.</b> La toux est présente dans 80 % des syndromes grippaux non dus à la grippe ; elle est sensible mais peu spécifique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j10-atypique-age" data-title="Grippe de la personne âgée fragile"><p class="lab">Fonction et cible</p><p>Chez la personne âgée fragile, en particulier en établissement de soins, la grippe se présente souvent sans le tableau classique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence et une réponse cytokinique moins vive réduisent la fièvre. La réserve cérébrale et fonctionnelle diminuée fait que toute infection se traduit par une confusion, une chute, un refus alimentaire ou une perte d’autonomie. Le CDC signale ces modifications de l’état mental, du comportement et de l’appétit chez les résidents âgés.</p><p class="lab">Conséquence clinique</p><p>En période épidémique, un changement brutal de l’état d’un résident doit faire tester la grippe, surtout si d’autres résidents ou soignants toussent. Une confirmation précoce permet l’antiviral et les mesures de contrôle d’une flambée.</p><div class="key"><b>Limite.</b> Ces signes ne sont pas spécifiques ; ils imposent aussi de rechercher une autre infection, une déshydratation ou un effet médicamenteux.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j10-decompensation" data-title="Grippe révélée par une décompensation chronique"><p class="lab">Fonction et cible</p><p>Chez un patient porteur d’une maladie chronique, la grippe peut se révéler d’abord par l’aggravation de cette maladie.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre et la tachycardie augmentent la demande en oxygène du cœur ; l’inflammation favorise la thrombose coronaire. Le risque d’hospitalisation pour infarctus du myocarde était multiplié par 6,05 dans les sept jours suivant une grippe confirmée, sans excès après le septième jour. Chez l’asthmatique et le patient atteint de BPCO, le virus provoque un bronchospasme. Chez le diabétique, le stress inflammatoire élève la glycémie.</p><p class="lab">Conséquence clinique</p><p>Devant une insuffisance cardiaque décompensée, une exacerbation de BPCO ou un déséquilibre diabétique en hiver, le médecin recherche une grippe. Sa confirmation peut justifier un antiviral, quel que soit le délai chez l’hospitalisé.</p><div class="key"><b>Limite.</b> L’étude de Kwong est une série de cas autocontrôlée, donc observationnelle ; elle montre une association temporelle forte, non une preuve de causalité au sens d’un essai.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j10-delai" data-title="Délai depuis le début des symptômes"><p class="lab">Fonction et cible</p><p>Le délai entre le début des symptômes et la consultation détermine le bénéfice attendu d’un antiviral.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les antiviraux freinent la réplication virale, qui culmine aux premier et deuxième jours. Leur bénéfice sur la durée des symptômes, démontré dans les essais, porte sur des patients traités dans les 48 heures. Chez le patient hospitalisé ou gravement malade, la réplication persiste plus longtemps, et l’IDSA recommande l’antiviral quel que soit le délai.</p><p class="lab">Conséquence clinique</p><p>Le médecin note le jour et l’heure du début. Chez le patient ambulatoire à risque, il discute l’antiviral si le délai est court ; chez l’hospitalisé, il ne retarde pas le traitement pour un délai dépassé.</p><div class="key"><b>Limite.</b> Le délai de 48 heures est un repère tiré des essais, non une limite biologique stricte. Les indications précises figurent dans la partie Prise en charge et l’onglet Pharmacologie.</div><p class="src">Références : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j10-contage" data-title="Contacts et activité grippale régionale"><p class="lab">Fonction et cible</p><p>La probabilité avant test d’une grippe dépend surtout de la circulation du virus dans la population et dans l’entourage du patient.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un même syndrome grippal n’a pas la même signification en janvier et en juillet. La valeur prédictive positive d’un tableau clinique augmente avec la fréquence de la maladie. En 2023/2024, près de la moitié des frottis Sentinella étaient positifs au pic, contre très peu hors saison. Un contact familial malade dans les jours précédents renforce encore la probabilité.</p><p class="lab">Conséquence clinique</p><p>Le médecin consulte le bulletin hebdomadaire de l’OFSP et demande si l’entourage est malade. En pleine épidémie, il peut retenir un diagnostic clinique de grippe chez un patient sans risque ; hors saison, il teste plus volontiers et recherche d’autres causes.</p><div class="key"><b>Limite.</b> D’autres virus circulent en même temps, notamment le SARS-CoV-2 et le VRS ; des co-infections existent. Le contexte oriente sans exclure.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a>.</p></template>
<template data-pop="j10-vaccin-statut" data-title="Statut vaccinal de la saison"><p class="lab">Fonction et cible</p><p>Le statut vaccinal indique si le patient a reçu le vaccin de la saison en cours, et à quelle date.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le vaccin induit des anticorps contre l’hémagglutinine des souches choisies. La protection apparaît environ deux semaines après l’injection et dépend de la concordance avec les virus circulants. Elle réduit le risque d’infection et de forme grave, sans l’annuler. En 2023/2024, 9,1 % des patients consultant pour syndrome grippal ou infection respiratoire aiguë étaient vaccinés contre la grippe, et 15,2 % des 65 ans et plus.</p><p class="lab">Conséquence clinique</p><p>Un patient vacciné peut avoir une grippe : la vaccination ne permet pas d’exclure le diagnostic. Elle n’enlève pas non plus l’indication d’un antiviral chez un patient à risque.</p><div class="key"><b>Limite.</b> L’efficacité vaccinale varie selon la saison, l’âge et le sous-type. Le statut sert aussi à proposer la vaccination aux proches et au patient pour les saisons suivantes.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j10-expo-animale" data-title="Exposition animale et suspicion de grippe zoonotique"><p class="lab">Fonction et cible</p><p>Une grippe zoonotique est une infection humaine par un virus d’origine animale, par exemple A(H5N1) des oiseaux ou un virus d’origine porcine.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces virus se transmettent surtout par contact rapproché avec des animaux malades ou morts, leurs sécrétions ou un environnement contaminé. Le CDC retient une exposition récente, dans les dix jours précédant les symptômes, dans sa définition des cas à investiguer pour une infection par un virus aviaire. De 2003 au 31 mars 2026, l’OMS a recensé 997 infections humaines par A(H5N1), dont 478 décès.</p><p class="lab">Conséquence clinique</p><p>Une fièvre ou une conjonctivite après un contact avec des volailles, des oiseaux sauvages ou d’autres animaux infectés impose des précautions respiratoires, un prélèvement adressé au laboratoire de référence et une déclaration à l’autorité sanitaire. La conduite détaillée figure dans la partie Situations particulières.</p><div class="key"><b>Limite.</b> Le rapport élevé de décès reflète en partie un biais de détection : les formes bénignes sont moins souvent testées. Un test rapide de grippe A ne distingue pas un virus aviaire d’un virus saisonnier.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a> ; <a href="https://archive.cdc.gov/www_cdc_gov/bird-flu/hcp/case-definition/index.html" target="_blank" rel="noopener">CDC, définitions de cas des infections humaines par virus aviaires, version archivée</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j10-aspirine" data-title="Acide acétylsalicylique et syndrome de Reye"><p class="lab">Fonction et cible</p><p>Le syndrome de Reye associe une encéphalopathie aiguë et une stéatose hépatique microvésiculaire. Il survient chez l’enfant et l’adolescent après une infection virale, en particulier une grippe ou une varicelle.</p><p class="lab">Mécanisme de l’affirmation</p><p>Son association avec la prise d’acide acétylsalicylique pendant l’infection virale a été établie par des études épidémiologiques ; un trouble de la fonction mitochondriale est en cause. Le syndrome est devenu rare depuis que l’on évite ce médicament chez l’enfant fébrile.</p><p class="lab">Conséquence clinique</p><p>Chez l’enfant et l’adolescent grippés, le médecin traite la fièvre par le paracétamol ou l’ibuprofène, jamais par l’acide acétylsalicylique. Il le demande aussi lorsqu’un adulte de la famille donne ses propres médicaments.</p><div class="key"><b>Limite.</b> Le CDC décrit ce syndrome comme rare. Chez l’enfant qui prend de l’acide acétylsalicylique au long cours pour une indication précise, la vaccination antigrippale est particulièrement recommandée ; la décision relève du spécialiste.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j10-biphasique" data-title="Évolution en deux temps"><p class="lab">Fonction et cible</p><p>Une évolution en deux temps est une aggravation après une amélioration initiale : la fièvre réapparaît, la toux devient productive, une dyspnée ou une douleur thoracique s’installe.</p><p class="lab">Mécanisme de l’affirmation</p><p>La grippe non compliquée s’améliore à partir du troisième au cinquième jour. Une nouvelle aggravation à ce moment traduit le plus souvent une surinfection bactérienne de l’épithélium lésé, par le pneumocoque, le staphylocoque doré ou le streptocoque du groupe A.</p><p class="lab">Conséquence clinique</p><p>Ce récit impose un examen rapide, la recherche d’un foyer et d’une hypoxémie, une imagerie thoracique et la discussion d’un antibiotique. Le staphylocoque doré peut provoquer une pneumonie nécrosante rapidement grave chez l’adulte jeune.</p><div class="key"><b>Limite.</b> Une aggravation peut aussi traduire une pneumonie virale progressive, une myocardite, une embolie pulmonaire ou la décompensation d’une maladie chronique. Le récit oriente sans trancher.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j10-v-fr" data-title="Fréquence respiratoire"><p class="lab">Fonction et cible</p><p>La fréquence respiratoire mesure le travail ventilatoire. Chez l’adulte au repos, elle se situe entre 12 et 20 par minute.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une acidose métabolique ou une diminution de la compliance pulmonaire stimulent les centres respiratoires. La fréquence s’élève alors avant que la saturation ne baisse, car l’hyperventilation compense d’abord le défaut d’oxygénation. Le médecin la compte pendant une minute entière, sans prévenir le patient, car celui-ci modifie sa respiration lorsqu’il se sait observé.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une fréquence d’au moins 22 par minute augmente la probabilité d’une pneumonie, et une fréquence de 30 par minute ou plus est un signal d’alarme qui compte dans le score CRB-65.</p><div class="key"><b>Limite.</b> La fièvre et l’anxiété élèvent aussi la fréquence. Une fréquence normale sous oxygène n’exclut pas un épuisement débutant.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j10-v-spo" data-title="Saturation pulsée en oxygène"><p class="lab">Fonction et cible</p><p>L’oxymètre de pouls estime la saturation de l’hémoglobine artérielle en oxygène. Chez l’adulte sain, elle atteint au moins 95 % en air ambiant.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une pneumonie virale crée des alvéoles perfusées mais non ventilées ; le sang qui les traverse reste désaturé et abaisse la saturation du mélange artériel. La mesure doit se faire en air ambiant, avec un signal de pouls stable, sur un doigt bien perfusé et sans vernis.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une saturation inférieure à 92 % est un signal d’alarme de l’infection respiratoire aiguë, et une saturation inférieure à 90 % fait envisager une hospitalisation quel que soit le score. Chez le patient atteint de BPCO, le médecin compare la valeur à la saturation habituelle.</p><div class="key"><b>Limite.</b> Une mauvaise perfusion périphérique fausse la mesure ; une intoxication au monoxyde de carbone la surestime. Une saturation correcte sous oxygène peut masquer une aggravation : la fréquence respiratoire et la gazométrie la révèlent.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j10-v-pa" data-title="Pression artérielle et perfusion"><p class="lab">Fonction et cible</p><p>La pression artérielle et les signes de perfusion renseignent sur la capacité de la circulation à maintenir l’apport d’oxygène aux organes.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre, la transpiration et une prise de boissons réduite diminuent le volume circulant. Un sepsis, viral ou bactérien, provoque une vasodilatation. Une myocardite réduit le débit cardiaque. Chacun de ces mécanismes peut abaisser la pression. Le médecin recherche aussi les marbrures, un temps de recoloration prolongé et une diurèse diminuée.</p><p class="lab">Conséquence clinique</p><p>Une systolique inférieure à 90 mmHg est un signal d’alarme selon la Société suisse d’infectiologie ; une systolique inférieure à 90 mmHg ou une diastolique d’au plus 60 mmHg donne un point du CRB-65. Une hypotension orthostatique chez un patient qui boit peu traduit une déshydratation.</p><div class="key"><b>Limite.</b> Une pression encore normale n’exclut pas un choc débutant chez un patient hypertendu ; le médecin compare à la valeur habituelle et répète la mesure.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j10-v-fc" data-title="Fréquence cardiaque"><p class="lab">Fonction et cible</p><p>La fréquence cardiaque de repos de l’adulte se situe entre 60 et 100 par minute. La fièvre l’accélère.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’élévation de la température augmente le métabolisme et la fréquence cardiaque. Une déshydratation et une hypoxémie l’accélèrent davantage. Une myocardite grippale peut provoquer une tachycardie hors de proportion avec la fièvre, des troubles du rythme et des signes d’insuffisance cardiaque.</p><p class="lab">Conséquence clinique</p><p>Le médecin interprète la fréquence avec la température et l’hydratation. Une tachycardie qui persiste après la baisse de la fièvre, une douleur thoracique, une dyspnée ou un pouls irrégulier font rechercher une atteinte cardiaque par un électrocardiogramme et un dosage de troponine.</p><div class="key"><b>Limite.</b> Un bêtabloquant masque la tachycardie. Une fréquence normale n’exclut ni une myocardite ni un sepsis chez un patient ainsi traité.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, 2018</a>.</p></template>
<template data-pop="j10-conscience" data-title="État de conscience et confusion"><p class="lab">Fonction et cible</p><p>La confusion est une altération aiguë de l’attention et de la conscience. Elle se recherche par l’orientation, l’attention et la cohérence du discours.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une hypotension, une fièvre élevée, une déshydratation ou une hyponatrémie perturbent le fonctionnement cérébral, surtout chez la personne âgée dont la réserve est réduite. Plus rarement, la grippe provoque une encéphalite ou une encéphalopathie.</p><p class="lab">Conséquence clinique</p><p>Une confusion nouvelle est un signal d’alarme et compte dans le score CRB-65. Elle impose la recherche d’une hypoxémie, d’un trouble métabolique, d’un sepsis et, en présence d’une raideur de nuque ou de convulsions, d’une infection du système nerveux central.</p><div class="key"><b>Limite.</b> Chez un patient dément, le médecin compare avec l’état habituel décrit par l’entourage ou les soignants.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j10-ausc" data-title="Auscultation pulmonaire dans la grippe"><p class="lab">Fonction et cible</p><p>L’auscultation recherche les bruits anormaux qui traduisent une atteinte bronchique, alvéolaire ou pleurale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans la grippe non compliquée, l’atteinte prédomine dans la trachée et les bronches : l’auscultation est souvent normale, ou révèle des ronchi diffus qui changent après la toux. Lorsque des alvéoles se remplissent d’exsudat, des crépitants apparaissent ; une condensation transmet mieux les vibrations vocales et peut produire un souffle.</p><p class="lab">Conséquence clinique</p><p>Des crépitants localisés ou bilatéraux orientent vers une pneumonie, virale ou bactérienne, et justifient une imagerie. Des sibilants diffus chez un asthmatique traduisent un bronchospasme induit par le virus.</p><div class="key"><b>Limite.</b> Une auscultation normale n’exclut pas une pneumonie virale débutante, en particulier chez un patient hypoxémique. La saturation et la fréquence respiratoire restent indispensables.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j10-deshydratation" data-title="Déshydratation au cours de la grippe"><p class="lab">Fonction et cible</p><p>La déshydratation est une perte d’eau et de sel non compensée. Elle est fréquente chez la personne âgée et le jeune enfant grippés.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre et la tachypnée augmentent les pertes insensibles ; l’anorexie, les nausées et la fatigue réduisent les apports. La personne âgée ressent moins la soif. Le volume circulant diminue, ce qui provoque une tachycardie, une hypotension orthostatique et une baisse de la diurèse.</p><p class="lab">Conséquence clinique</p><p>Le médecin recherche des muqueuses sèches, une hypotension orthostatique, une baisse de la diurèse et une confusion. Une incapacité à boire est un motif d’hospitalisation chez un patient fragile. Le CDC signale la déshydratation parmi les complications de la grippe à tout âge.</p><div class="key"><b>Limite.</b> Les signes cutanés sont peu fiables chez la personne âgée. Une insuffisance rénale fonctionnelle se recherche par la créatinine lorsque le patient est hospitalisé.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j10-alarme" data-title="Signes de gravité d’une grippe"><p class="lab">Fonction et cible</p><p>Un signe de gravité signale une complication en cours ou une réserve insuffisante. Il change le lieu de soins et l’urgence du traitement.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les signes respiratoires traduisent une atteinte alvéolaire : dyspnée, fréquence respiratoire de 30 par minute ou plus, saturation inférieure à 92 %. Les signes circulatoires traduisent un sepsis, une déshydratation ou une atteinte cardiaque : systolique inférieure à 90 mmHg, marbrures, baisse de la diurèse, douleur thoracique. Les signes neurologiques traduisent une hypoxémie, un trouble métabolique ou une atteinte du système nerveux : confusion, convulsions, déficit. L’évolution en deux temps traduit une surinfection.</p><p class="lab">Conséquence clinique</p><p>Un seul signe suffit à justifier une évaluation hospitalière, des examens complémentaires et un antiviral sans attendre, quel que soit le délai depuis le début des symptômes. Chez le patient à risque, le seuil d’hospitalisation est plus bas.</p><div class="key"><b>Limite.</b> Ces signes ne sont pas spécifiques de la grippe ; ils signalent la gravité de toute infection respiratoire. L’absence de signe de gravité n’exclut pas une aggravation ultérieure : le médecin donne au patient des consignes de reconsultation.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="pareto-j10-bases" data-title="Pareto — Virus, mécanismes et clinique de la grippe"><p class="ratio" data-cover="j10-0,j10-1,j10-2,j10-3,j10-4,j10-5,j10-6"></p><ul><li>La grippe est due aux virus influenza A ou B. La dérive antigénique explique les épidémies annuelles et la révision annuelle du vaccin ; la cassure par réassortiment peut provoquer une pandémie.</li><li>Le code est J09 pour un virus zoonotique ou pandémique, J10 pour un virus saisonnier confirmé, J11 sans identification. <i>Haemophilus influenzae</i> est une bactérie, sans rapport avec ces codes.</li><li>En Suisse, l’épidémie culmine le plus souvent entre fin décembre et février. Les enfants consultent le plus ; les personnes âgées représentent l’essentiel des hospitalisations et des décès.</li><li>L’hémagglutinine fixe le virus à l’acide sialique ; la neuraminidase libère les virions. Le baloxavir bloque le vol de coiffe de la polymérase ; l’oseltamivir bloque la neuraminidase.</li><li>Les cytokines produisent la fièvre et les courbatures ; l’atteinte alvéolaire donne une pneumonie virale hypoxémiante ; l’épithélium lésé favorise la surinfection à pneumocoque et à staphylocoque doré.</li><li>L’incubation dure un à quatre jours ; la contagiosité commence la veille des symptômes et culmine pendant les trois premiers jours.</li><li>Les personnes à risque sont celles de 65 ans et plus, les femmes enceintes ou récemment accouchées, les malades chroniques, les immunodéprimés et les résidents d’établissements de soins.</li><li>Le récit typique associe un début brutal, une fièvre élevée, des courbatures et une toux sèche. Le médecin date le début, établit le terrain et recherche une exposition animale. La fièvre peut manquer chez la personne âgée.</li><li>Une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg, une confusion ou une aggravation en deux temps imposent une évaluation hospitalière.</li></ul></template>
