<section class="ilot" id="j80-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 58 ans, 76 kg pour 178 cm, est hospitalisé depuis deux jours pour une pneumonie à pneumocoque du lobe inférieur droit. Pendant la nuit, sa fréquence respiratoire passe de 22 à 36 par minute. Sa SpO₂ tombe à 86 % sous 6 L/min d’oxygène au masque. La radiographie montre désormais des opacités dans les deux poumons. Sa pression artérielle est de 128/74 mmHg et il n’a aucun antécédent cardiaque. La question qui structure le cours est la suivante : <b>cet œdème pulmonaire bilatéral est-il lésionnel ou cardiogénique, quelle est sa gravité, et quelle ventilation protège ce poumon au lieu de l’abîmer davantage ?</b></p>
<p>Le médecin assistant doit savoir poser le diagnostic de <button class="w" data-k="j80-global">syndrome de détresse respiratoire aiguë (définition globale 2024)</button>, le distinguer d’un <button class="w" data-k="j80-oapcardio">œdème pulmonaire cardiogénique (comparaison point par point)</button>, en grader la sévérité, appeler à temps les soins intensifs et connaître les mesures qui réduisent la mortalité. Il doit aussi reconnaître les œdèmes pulmonaires non cardiogéniques que code J81, comme l’œdème de haute altitude, fréquent en Suisse.</p>
<div class="key"><b>Message fondateur.</b> Le SDRA est un <b>œdème de perméabilité</b> : la barrière entre le capillaire et l’alvéole est lésée, et un liquide riche en protéines inonde les alvéoles à pression capillaire normale. Le poumon fonctionnel devient petit. Un volume courant « normal » distend alors à l’excès ce petit poumon et aggrave la lésion. C’est pourquoi la ventilation protectrice, à faible volume courant et à pression de plateau limitée, est la seule mesure ventilatoire dont le bénéfice sur la mortalité est démontré par un grand essai randomisé.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="j80-starling">équilibre de Starling (pressions qui font sortir ou rentrer l’eau du capillaire)</button>, le <button class="w" data-k="j80-shunt">shunt intrapulmonaire (sang qui traverse des alvéoles non ventilées)</button> et le <button class="w" data-k="j80-pf">rapport PaO₂/FiO₂ (calcul, seuils et pièges)</button>. L’onglet Sciences fondamentales les développe.</div>
</section>

<section class="ilot" id="j80-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Un œdème pulmonaire est une accumulation d’eau dans l’interstitium puis dans les alvéoles. Il a deux mécanismes opposés. L’<b>œdème hydrostatique</b> naît d’une pression capillaire trop élevée, habituellement par insuffisance du cœur gauche ou surcharge de volume ; la barrière reste intacte et le liquide est pauvre en protéines. L’<b>œdème de perméabilité</b> naît d’une lésion de la barrière ; le liquide est riche en protéines, même si la pression capillaire est normale. Le SDRA est la forme la plus grave de l’œdème de perméabilité.</p>
<h3>1.1 Définition globale du syndrome de détresse respiratoire aiguë (2024)</h3>
<p>Un groupe de consensus international a publié en 2024 une <button class="w" data-k="j80-global">définition globale (Matthay, American Journal of Respiratory and Critical Care Medicine 2024)</button>. Elle prolonge la <button class="w" data-k="j80-berlin">définition de Berlin 2012 (critères et mortalités de validation)</button> et l’ouvre aux patients non intubés. Quatre conditions doivent être réunies.</p>
<table class="t"><tr><th>Domaine</th><th>Critère de la définition globale 2024</th></tr>
<tr><td>Facteur de risque</td><td>Facteur déclenchant aigu (pneumonie, sepsis, aspiration, traumatisme, transfusion, choc…) ; l’œdème n’est ni principalement cardiogénique ni dû à une atélectasie</td></tr>
<tr><td>Délai</td><td>Insuffisance respiratoire hypoxémique apparue ou aggravée dans la semaine qui suit le facteur de risque ou des symptômes respiratoires nouveaux</td></tr>
<tr><td>Imagerie</td><td>Opacités bilatérales en radiographie ou en TDM, ou lignes B et consolidations bilatérales en échographie, non expliquées par un épanchement, une atélectasie ou des nodules</td></tr>
<tr><td>Oxygénation</td><td>Seuils de PaO₂/FiO₂ ou de SpO₂/FiO₂ selon que le patient est intubé ou non (tableau 1.2)</td></tr></table>
<p>Le tableau se lit en commençant par la dernière ligne, car elle classe le patient. L’erreur fréquente porte sur le facteur de risque : un œdème bilatéral sans facteur de risque identifiable doit faire chercher d’abord une cause cardiaque ou un diagnostic alternatif (îlot 7). Le patient de l’îlot 0 remplit les trois premières lignes : pneumonie, aggravation en 48 heures, opacités bilatérales.</p>
<h3>1.2 Grades d’oxygénation</h3>
<p>L’oxygénation se mesure par le rapport entre la PaO₂ en mmHg et la FiO₂ exprimée en fraction. Le rapport SpO₂/FiO₂ est accepté lorsque la SpO₂ est inférieure ou égale à 97 %, car au-dessus de cette valeur la courbe de dissociation de l’hémoglobine est plate et la saturation ne reflète plus la PaO₂.</p>
<table class="t"><tr><th>Catégorie</th><th>PaO₂/FiO₂ (mmHg)</th><th>SpO₂/FiO₂ (si SpO₂ ≤ 97 %)</th><th>Condition</th></tr>
<tr><td>Non intubé</td><td>≤ 300</td><td>≤ 315</td><td>Oxygène nasal à haut débit ≥ 30 L/min, ou VNI ou pression positive continue avec PEP ≥ 5 cm H₂O</td></tr>
<tr><td>Intubé, léger</td><td>&gt; 200 et ≤ 300</td><td>&gt; 235 et ≤ 315</td><td rowspan="3">PEP ≥ 5 cm H₂O</td></tr>
<tr><td>Intubé, modéré</td><td>&gt; 100 et ≤ 200</td><td>&gt; 148 et ≤ 235</td></tr>
<tr><td>Intubé, sévère</td><td>≤ 100</td><td>≤ 148</td></tr>
<tr><td>Ressources limitées</td><td>—</td><td>≤ 315</td><td>Ni PEP ni débit minimal exigés</td></tr></table>
<p>Le patient de l’îlot 0, s’il reçoit de l’oxygène nasal à haut débit à 50 L/min avec une FiO₂ de 0,60 et une PaO₂ de 66 mmHg, a un rapport de 110 : il remplit le critère des patients non intubés. S’il est ensuite intubé et que le rapport reste à 110 sous PEP de 10 cm H₂O, son SDRA est <b>modéré</b>. La catégorie peut changer d’un jour à l’autre ; le grade se note à la PEP appliquée.</p>
<div class="trap"><span class="k">Piège</span>En Suisse, de nombreux hôpitaux se trouvent au-dessus de 1 000 m. La définition globale demande alors de corriger le rapport par la pression barométrique : rapport corrigé = rapport mesuré × pression barométrique / 760. À Davos (environ 1 560 m, pression barométrique voisine de 630 mmHg), un rapport mesuré de 250 correspond à environ 207 au niveau de la mer. Le détail figure dans la fenêtre <button class="w" data-k="j80-pf">rapport PaO₂/FiO₂</button>.</div>
<h3>1.3 Enfant et adolescent</h3>
<p>Chez l’enfant de plus d’un mois et l’adolescent, la gravité se mesure par l’<button class="w" data-k="j80-palicc">indice d’oxygénation et l’indice de saturation en oxygène (PALICC)</button>, qui tiennent compte de la pression moyenne des voies aériennes. Le syndrome de détresse respiratoire du nouveau-né, dû à un déficit en surfactant, n’appartient pas à J80 : il est codé P22.0.</p>
<h3>1.4 Codage CIM-10-GM 2024</h3>
<p>La CIM-10-GM 2024 code la gravité du SDRA par un cinquième caractère. Elle applique la définition de Berlin à partir de 18 ans et celle de PALICC de 1 an à moins de 18 ans. La catégorie J81 code l’œdème pulmonaire aigu et la congestion pulmonaire passive, à l’exclusion des causes rangées ailleurs.</p>
<table class="t"><tr><th>Code</th><th>Libellé</th><th>Seuil</th></tr>
<tr><td>J80.01</td><td>SDRA léger de l’adulte</td><td>PaO₂/FiO₂ &gt; 200 et ≤ 300 mmHg, PEP ≥ 5 cm H₂O</td></tr>
<tr><td>J80.02</td><td>SDRA modéré de l’adulte</td><td>&gt; 100 et ≤ 200 mmHg, PEP ≥ 5 cm H₂O</td></tr>
<tr><td>J80.03</td><td>SDRA sévère de l’adulte</td><td>≤ 100 mmHg, PEP ≥ 5 cm H₂O</td></tr>
<tr><td>J80.04</td><td>SDRA léger de l’enfant et de l’adolescent</td><td>Indice d’oxygénation 4 à &lt; 8, ou indice de saturation 5 à &lt; 7,5</td></tr>
<tr><td>J80.05</td><td>SDRA modéré de l’enfant et de l’adolescent</td><td>Indice d’oxygénation 8 à &lt; 16, ou indice de saturation 7,5 à &lt; 12,3</td></tr>
<tr><td>J80.06</td><td>SDRA sévère de l’enfant et de l’adolescent</td><td>Indice d’oxygénation ≥ 16, ou indice de saturation ≥ 12,3</td></tr>
<tr><td>J80.09</td><td>SDRA sans précision du degré de gravité</td><td>—</td></tr>
<tr><td>J81</td><td>Œdème pulmonaire (aigu ; congestion pulmonaire passive)</td><td>Exclut : insuffisance cardiaque (I50.1), agents chimiques (J68.1), agents externes (J60–J70), pneumonie hypostatique (J18.2)</td></tr></table>
<p>Le codage suit donc la définition de Berlin, alors que la clinique utilise déjà la définition globale ; la fenêtre <button class="w" data-k="j80-cim">codage J80 et J81 (règles et pièges)</button> explique comment coder un patient non intubé. L’erreur fréquente consiste à coder J81 pour un œdème d’insuffisance cardiaque : la classification l’exclut explicitement et le renvoie à I50.1.</p>
<div class="key"><b>À retenir.</b> Le SDRA associe un facteur de risque aigu, un délai d’une semaine, des opacités bilatérales et une hypoxémie mesurée sous PEP ou haut débit. Sa sévérité dépend du rapport PaO₂/FiO₂, corrigé en altitude. J81 code les œdèmes non cardiogéniques qui ne remplissent pas ces critères ou qui ont une cause propre ; l’œdème cardiogénique relève de <a href="#/entry/I50">I50 — Insuffisance cardiaque (C-01-Cardiologie)</a>. L’îlot suivant donne la fréquence et le pronostic de ces situations.</div>
</section>

<section class="ilot" id="j80-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La meilleure source de fréquence reste l’étude observationnelle <button class="w" data-k="j80-lungsafe">LUNG SAFE (459 unités de soins intensifs, 50 pays, 2014)</button>. Le SDRA y concernait 10,4 % des admissions en soins intensifs et 23,4 % des patients ventilés mécaniquement. Les cliniciens ne le reconnaissaient que dans environ 60 % des cas, et seulement 34 % le jour où les critères étaient remplis. Une maladie non reconnue ne reçoit pas de ventilation protectrice : c’est la première cause évitable de mauvaise prise en charge.</p>
<p>Aucune donnée suisse publiée ne donne l’incidence nationale du SDRA ou de l’œdème pulmonaire non cardiogénique ; les registres suisses de soins intensifs ne publient pas ce diagnostic séparément. Les chiffres européens et mondiaux s’appliquent donc par défaut.</p>
<h3>2.1 Mortalité selon la gravité</h3>
<p>La mortalité hospitalière croît avec la gravité de l’hypoxémie. Le tableau compare les deux séries de référence ; il montre que la gravité de l’oxygénation prédit le pronostic, sans en être la seule cause.</p>
<table class="t"><tr><th>Gravité</th><th>Berlin 2012 (méta-analyse de validation)</th><th>LUNG SAFE 2016 (mortalité hospitalière)</th></tr>
<tr><td>Léger</td><td>27 %</td><td>34,9 %</td></tr>
<tr><td>Modéré</td><td>32 %</td><td>40,3 %</td></tr>
<tr><td>Sévère</td><td>45 %</td><td>46,1 %</td></tr></table>
<p>La lecture utile porte sur la colonne de droite : même un SDRA « léger » tue un patient sur trois. La raison est que le décès dépend surtout de la cause (sepsis, défaillances d’organes) et de l’âge, plus que de l’hypoxémie elle-même ; la plupart des patients meurent de défaillance multiviscérale, non d’hypoxémie réfractaire. Ce constat explique pourquoi le traitement de la cause compte autant que la ventilation.</p>
<h3>2.2 Œdèmes non cardiogéniques de J81</h3>
<p>L’œdème pulmonaire de haute altitude survient chez environ 0,2 à 6 % des personnes qui montent au-dessus de 2 500 m ; la fréquence dépend de l’altitude atteinte et de la vitesse d’ascension. Elle atteint environ 60 % chez les sujets qui ont déjà fait un épisode et remontent rapidement (synthèse de Bärtsch et Swenson, New England Journal of Medicine 2013). Le TRALI, lésion pulmonaire aiguë liée à la transfusion, reste une cause majeure de décès transfusionnel ; Swissmedic le recense dans son rapport annuel d’hémovigilance.</p>
<div class="key"><b>À retenir.</b> Le SDRA touche un patient ventilé sur quatre et reste méconnu dans 40 % des cas. Sa mortalité dépasse 30 % même dans les formes légères, parce que la cause et les défaillances associées tuent davantage que l’hypoxémie. L’îlot suivant explique comment la lésion de la barrière produit l’hypoxémie.</div>
</section>

<section class="ilot" id="j80-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie se lit comme une chaîne de cinq maillons. Chaque maillon explique un signe et justifie une mesure thérapeutique.</p>
<h3>3.1 État normal</h3>
<p>La barrière alvéolo-capillaire mesure environ 0,3 µm d’épaisseur sur ses faces minces. Elle comprend l’endothélium capillaire, une membrane basale fusionnée et l’épithélium alvéolaire, formé de pneumocytes de type I et de type II. Une petite quantité de liquide filtre en permanence du capillaire vers l’interstitium, selon l’<button class="w" data-k="j80-starling">équation de Starling</button>. Les lymphatiques la drainent : leur débit peut augmenter plusieurs fois avant que l’eau ne déborde dans les alvéoles. L’épithélium réabsorbe activement le sodium, et l’eau le suit : c’est la <button class="w" data-k="j80-clairance">clairance du liquide alvéolaire (canaux sodiques et pompe Na⁺/K⁺-ATPase)</button>.</p>
<h3>3.2 Premier maillon : agression directe ou indirecte</h3>
<p>Une <button class="w" data-k="j80-direct">agression directe ou indirecte (pneumonie et aspiration contre sepsis et pancréatite)</button> déclenche la lésion. Dans l’agression directe, le germe ou l’acide gastrique lèse d’abord l’épithélium. Dans l’agression indirecte, les médiateurs circulants du sepsis ou de la pancréatite lèsent d’abord l’endothélium. Les deux voies aboutissent à la même barrière rompue.</p>
<h3>3.3 Deuxième maillon : inflammation et rupture de la barrière</h3>
<p>Les macrophages alvéolaires activés libèrent l’IL-1, le TNF-α et l’IL-6. Ces cytokines attirent les polynucléaires neutrophiles. Ceux-ci libèrent des protéases, des radicaux libres de l’oxygène et des pièges extracellulaires d’ADN qui détruisent les pneumocytes de type I et les jonctions endothéliales. Le glycocalyx endothélial se détache. L’eau et les protéines plasmatiques passent alors dans l’interstitium puis dans les alvéoles, même si la pression capillaire est normale : c’est l’<b>œdème de perméabilité</b>.</p>
<h3>3.4 Troisième maillon : inondation alvéolaire et perte du surfactant</h3>
<p>Les protéines de l’œdème inactivent le surfactant, et les pneumocytes de type II lésés en produisent moins. Sans surfactant, la tension de surface augmente, et les petites alvéoles se ferment à chaque expiration. La clairance alvéolaire, normalement capable de résorber l’œdème, est elle-même altérée ; chez les patients dont la clairance reste la plus basse, la mortalité est la plus élevée. Les protéines précipitent sur les parois alvéolaires et forment les membranes hyalines.</p>
<h3>3.5 Quatrième maillon : shunt, espace mort et poumon de petite taille</h3>
<p>Les alvéoles inondées ou fermées restent perfusées. Le sang qui les traverse ne s’oxygène pas : c’est un <button class="w" data-k="j80-shunt">shunt intrapulmonaire</button>. L’oxygène ajouté ne l’atteint pas, ce qui explique une hypoxémie peu corrigée par l’augmentation de la FiO₂. Parallèlement, des microthromboses occluent des capillaires d’alvéoles encore ventilées : l’espace mort augmente, et la PaCO₂ monte malgré une ventilation minute élevée. Le volume de poumon encore aéré se réduit à celui d’un <button class="w" data-k="j80-babylung">poumon de petite taille (« baby lung » de Gattinoni)</button> : la compliance basse reflète surtout ce petit volume aéré, non une rigidité du tissu restant.</p>
<h3>3.6 Cinquième maillon : lésions induites par la ventilation, réparation ou fibrose</h3>
<p>Un volume courant calculé pour un poumon entier distend à l’excès le petit poumon aéré. L’ouverture et la fermeture répétées des alvéoles instables cisaillent l’épithélium. Ces <button class="w" data-k="j80-vili">lésions induites par la ventilation (volotraumatisme, atélectraumatisme, biotraumatisme)</button> entretiennent l’inflammation. Après environ une semaine, la phase proliférative commence : les pneumocytes de type II prolifèrent et réépithélialisent. Chez une partie des patients, une fibrose s’installe et laisse une restriction et un trouble de la diffusion.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> Le petit poumon aéré justifie le faible volume courant. Les alvéoles instables justifient une PEP suffisante. La répartition gravitaire de l’œdème justifie le décubitus ventral. La perméabilité accrue justifie un bilan hydrique prudent après la phase de choc. Le traitement de la cause supprime l’agression initiale. Aucun médicament ne répare directement la barrière.</div>
</section>

<section class="ilot" id="j80-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Le SDRA n’est pas une maladie mais un syndrome : il complique toujours une autre affection. Trouver cette affection est une urgence, car c’est elle que l’on traite. Les causes se rangent en agressions directes et indirectes.</p>
<table class="t"><tr><th>Agression</th><th>Causes</th><th>Fréquence dans LUNG SAFE</th></tr>
<tr><td>Directe (pulmonaire)</td><td>Pneumonie bactérienne ou virale (grippe, SARS-CoV-2), inhalation de contenu gastrique, contusion pulmonaire, noyade, inhalation de fumée ou de gaz toxique, vascularite pulmonaire</td><td>Pneumonie : 59 % ; inhalation : 14 %</td></tr>
<tr><td>Indirecte (systémique)</td><td>Sepsis d’origine extrapulmonaire, pancréatite aiguë, polytraumatisme et choc, transfusions massives, brûlures étendues, circulation extracorporelle, surdose médicamenteuse</td><td>Sepsis extrapulmonaire : 16 %</td></tr></table>
<p>Le tableau montre que la pneumonie domine, ce qui rattache souvent ce cours à <a href="#/entry/J18">J18 — Pneumonies de l’adulte (P-02-Pneumologie)</a> et à <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte (I-03-Infectiologie)</a>. Plusieurs causes s’additionnent souvent : une pancréatite suivie d’une inhalation et de transfusions multiplie le risque. Le patient de l’îlot 0 présente l’agression directe la plus fréquente.</p>
<h3>4.1 Facteurs qui modifient le risque</h3>
<p>L’abus chronique d’alcool est associé à un risque de SDRA environ deux fois plus élevé chez le patient septique ; l’alcool réduit le glutathion alvéolaire et altère la barrière épithéliale, ce qui fournit un mécanisme plausible. Le tabagisme actif ou passif est associé à davantage de SDRA après traumatisme. À l’inverse, le diabète est associé à moins de SDRA dans plusieurs cohortes ; ce lien reste une association statistique sans mécanisme protecteur démontré, et il ne justifie aucune décision.</p>
<h3>4.2 Causes d’œdème non cardiogénique codé en J81</h3>
<p>Plusieurs œdèmes non cardiogéniques ont une cause et une évolution propres. Ils sont détaillés à l’îlot 10 : <button class="w" data-k="j80-hape">œdème pulmonaire de haute altitude</button>, <button class="w" data-k="j80-neuro">œdème neurogénique (hémorragie méningée, état de mal épileptique)</button>, <button class="w" data-k="j80-negpress">œdème à pression négative (obstruction des voies aériennes supérieures)</button>, <button class="w" data-k="j80-reexp">œdème de réexpansion (après drainage pleural)</button>, <button class="w" data-k="j80-immersion">œdème d’immersion (plongée, nage)</button> et <button class="w" data-k="j80-transfu">œdèmes transfusionnels (TRALI et TACO)</button>.</p>
<div class="key"><b>À retenir.</b> Devant tout SDRA, le médecin cherche immédiatement la cause : pneumonie, inhalation et sepsis expliquent près de neuf cas sur dix. Un œdème bilatéral sans cause évidente doit faire penser à une cause cardiaque, à un œdème non cardiogénique particulier ou à une maladie qui imite le SDRA. L’anamnèse ordonne cette recherche.</div>
</section>

<section class="ilot" id="j80-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Le patient en détresse respiratoire parle peu. L’anamnèse s’obtient souvent auprès des proches, des soignants et du dossier. Elle répond à trois questions : quand l’hypoxémie a-t-elle commencé, quel facteur de risque la précède, et existe-t-il un argument cardiaque.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Arguments pour une cause lésionnelle</h4><p>Infection récente, fièvre, frissons ; <button class="w" data-k="j80-a-chrono">chronologie (délai depuis le facteur de risque)</button> ; vomissements ou trouble de la conscience suggérant une inhalation ; douleur abdominale et alcool évoquant une pancréatite ; transfusion dans les six heures ; traumatisme ; inhalation de fumée ; séjour en altitude ; plongée ou nage en eau froide ; chimiothérapie, amiodarone, drogues.</p></div>
<div class="card"><h4>Arguments pour une cause cardiaque</h4><p><button class="w" data-k="j80-a-cardio">Antécédents cardiaques (infarctus, valvulopathie, fraction d’éjection connue)</button> ; dyspnée d’effort progressive et orthopnée dans les semaines précédentes ; prise de poids et œdèmes des jambes ; douleur thoracique ; palpitations ; arrêt d’un diurétique ; perfusion de grands volumes ; <button class="w" data-k="j80-a-medic">médicaments à rechercher (anti-inflammatoires, glitazones, chimiothérapies, opioïdes)</button>.</p></div></div>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p><b>Dyspnée</b> — Elle s’installe en quelques heures à quelques jours et devient rapidement présente au repos. Elle traduit l’hypoxémie et l’augmentation du travail respiratoire imposée par un poumon peu compliant. Voir la fenêtre <button class="w" data-k="j80-s-dyspnee">dyspnée de l’œdème lésionnel (mécanisme et chronologie)</button>.</p>
<p><b>Toux</b> — Elle est sèche ou ramène une expectoration. Une expectoration mousseuse et rosée évoque un œdème alvéolaire massif, mais elle existe dans les deux types d’œdème et ne les distingue pas.</p>
<p><b>Symptômes de la cause</b> — Fièvre et douleur pleurale de la pneumonie, douleur épigastrique transfixiante de la pancréatite, céphalée brutale d’une hémorragie méningée, toux sèche et baisse de performance au deuxième jour en altitude.</p>
<p><b>Agitation, confusion</b> — Elles traduisent l’hypoxémie ou l’hypercapnie et précèdent l’épuisement.</p>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Patient hospitalisé pour une pneumonie ou un sepsis, qui s’aggrave entre le premier et le troisième jour : polypnée, besoins croissants en oxygène, opacités bilatérales. La plupart des cas apparaissent dans les 72 heures qui suivent le facteur de risque.</p></div>
<div class="card"><h4>Forme postopératoire ou post-traumatique</h4><p>Aggravation 24 à 48 heures après une chirurgie lourde, une pancréatite ou un polytraumatisme transfusé. Les opacités sont parfois masquées par des contusions ou des atélectasies.</p></div>
<div class="card"><h4>Forme transfusionnelle</h4><p>Dyspnée, fièvre et hypotension pendant la transfusion ou dans les six heures (TRALI). Une hypertension et une surcharge orientent plutôt vers le TACO.</p></div>
<div class="card"><h4>Forme d’altitude</h4><p>Alpiniste en bonne santé qui, au deuxième ou troisième jour au-dessus de 2 500 m, perd ses performances, tousse puis devient dyspnéique au repos, souvent la nuit.</p></div>
<div class="card"><h4>Forme sans facteur de risque évident</h4><p>Œdème bilatéral apparu en quelques jours chez un patient sans infection ni agression : elle impose de chercher une maladie qui imite le SDRA (hémorragie alvéolaire, pneumonie aiguë à éosinophiles, pneumopathie organisée, exacerbation de fibrose).</p></div>
<div class="card"><h4>Forme virale épidémique</h4><p>Grippe ou COVID-19 : hypoxémie souvent marquée avec une dyspnée initialement modeste, puis aggravation vers le septième au dixième jour des symptômes.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse date l’hypoxémie par rapport au facteur de risque et cherche un argument cardiaque. Une chronologie supérieure à une semaine ou l’absence de facteur de risque oriente vers un autre diagnostic. L’examen clinique mesure ensuite la gravité.</div>
</section>

<section class="ilot" id="j80-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen ne pose pas le diagnostic de SDRA, qui repose sur l’imagerie et la gazométrie. Il mesure la gravité, oriente vers une cause cardiaque ou lésionnelle, et cherche la cause.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Chez l’adulte sain au repos, la fréquence respiratoire est de 12 à 20 par minute et la SpO₂ de 95 à 100 % en air ambiant. Une <button class="w" data-k="j80-e-fr">fréquence respiratoire supérieure à 30 par minute et des signes de lutte (tirage, muscles accessoires, respiration paradoxale)</button> signalent une détresse. La <button class="w" data-k="j80-e-spo2">SpO₂ (fiabilité, cible, pièges)</button> se lit avec la FiO₂ délivrée. Fréquence cardiaque, pression artérielle, marbrures, diurèse et température renseignent sur un sepsis ou un choc associé.</p></div>
<div class="card"><h4>Examen pulmonaire</h4><p>L’inspection compte la fréquence et cherche une respiration abdominale paradoxale. L’auscultation trouve des <button class="w" data-k="j80-e-crep">crépitants bilatéraux (valeur et limites)</button>, parfois un souffle tubaire en regard d’une pneumonie. Une asymétrie brutale du murmure vésiculaire impose de chercher un pneumothorax, complication de la ventilation.</p></div>
<div class="card"><h4>Signes en faveur d’une cause cardiaque</h4><p><button class="w" data-k="j80-e-cardio">Turgescence jugulaire, troisième bruit, souffle valvulaire, œdèmes des membres inférieurs, extrémités froides</button>. Leur absence n’exclut pas une composante cardiaque, et leur présence n’exclut pas un SDRA associé.</p></div>
<div class="card"><h4>Signes de la cause</h4><p>Matité et souffle tubaire d’une pneumonie, défense abdominale d’une pancréatite, brûlures, déficit neurologique, morsure de langue après une crise convulsive, stridor avant un œdème à pression négative, purpura d’un sepsis à méningocoque.</p></div></div>
<div class="trap"><span class="k">Piège</span>Une SpO₂ de 94 % sous oxygène nasal à haut débit à 60 L/min et FiO₂ de 0,80 n’est pas rassurante : le rapport SpO₂/FiO₂ vaut 117, ce qui correspond à une atteinte grave. La SpO₂ isolée, sans FiO₂, ne mesure jamais la gravité.</div>
