
<!-- ===== FENÊTRES : traitement et examens ===== -->
<template data-pop="j80-esicm" data-title="Recommandations ESICM 2023">
<div class="lab">Référence</div><p>Grasselli G. et al., Intensive Care Medicine 2023 ; 49 : 727–759, publiées le 16.06.2023. 21 questions et 21 recommandations sur la définition, les phénotypes et l’assistance respiratoire de l’adulte, avec une cotation formelle de la certitude des preuves. Les traitements médicamenteux, dont les corticoïdes, n’y sont pas traités.</p>
<div class="lab">Recommandations principales</div><p>Volume courant faible (4 à 8 mL/kg de poids prédit), recommandation forte ; décubitus ventral plus de 16 heures par jour dans le SDRA modéré à sévère, forte ; ECMO veino-veineuse dans le SDRA sévère réfractaire, dans un centre expérimenté, forte ; pas de manœuvres de recrutement prolongées, forte ; pas de perfusion continue systématique de curares ; aucune recommandation pour ou contre une PEP élevée ; pas d’épuration extracorporelle du CO₂ hors essai.</p>
<div class="lab">Limite de lecture</div><p>Le texte intégral n’a pas été accessible lors de la rédaction (08.10.2026) ; le contenu est rapporté d’après des synthèses publiées (Diniz-Silva, Critical Care Science 2025) et le résumé officiel.</p></template>

<template data-pop="j80-ats" data-title="Recommandations ATS 2024">
<div class="lab">Référence</div><p>Qadir N. et al., American Journal of Respiratory and Critical Care Medicine 2024 ; 209 : 24–36 (mise à jour de la recommandation 2017).</p>
<div class="lab">Nouvelles recommandations</div><p>Corticoïdes suggérés dans le SDRA (conditionnelle, certitude modérée) ; ECMO veino-veineuse suggérée chez des patients sélectionnés atteints de SDRA sévère (conditionnelle, faible) ; curares suggérés dans le SDRA sévère précoce (conditionnelle, faible) ; PEP plus élevée sans manœuvre de recrutement suggérée dans le SDRA modéré à sévère (conditionnelle, faible) ; pas de manœuvres de recrutement prolongées (forte, modérée).</p>
<div class="lab">Recommandations 2017 maintenues</div><p>Volume courant 4 à 8 mL/kg de poids prédit et plateau &lt; 30 cm H₂O (forte) ; décubitus ventral plus de 12 heures par jour dans le SDRA sévère (forte) ; pas d’oscillation à haute fréquence en routine (forte).</p></template>

<template data-pop="j80-hfno" data-title="Oxygène nasal à haut débit">
<div class="lab">Mécanisme</div><p>Débit jusqu’à 60 L/min, supérieur au débit inspiratoire du patient : la FiO₂ délivrée est proche de celle réglée. Le gaz chauffé et humidifié préserve le mucus. Le haut débit lave l’espace mort nasopharyngé et produit une PEP d’environ 1 cm H₂O par 10 L/min, bouche fermée.</p>
<div class="lab">Preuves</div><p>Essai FLORALI (Frat, New England Journal of Medicine 2015) : chez des patients hypoxémiques non hypercapniques, mortalité à 90 jours plus basse avec le haut débit qu’avec l’oxygène standard ou la VNI ; intubations moins fréquentes dans le sous-groupe PaO₂/FiO₂ ≤ 200.</p>
<div class="lab">Recommandations</div><p>Surviving Sepsis Campaign 2026 : haut débit suggéré plutôt que l’oxygène conventionnel si PaO₂/FiO₂ &lt; 200 ou SpO₂/FiO₂ &lt; 235, et plutôt que la VNI en première intention (conditionnelles). ESICM 2023 : haut débit suggéré plutôt que l’oxygène conventionnel.</p>
<div class="lab">Surveillance</div><p>Fréquence respiratoire, SpO₂, indice ROX à 2, 6 et 12 heures ; l’absence d’amélioration fait discuter l’intubation.</p></template>

<template data-pop="j80-vni" data-title="VNI dans le SDRA">
<div class="lab">Place</div><p>Indiscutable dans l’œdème cardiogénique et l’exacerbation hypercapnique de BPCO ; incertaine dans le SDRA. L’ESICM 2023 ne recommande ni pour ni contre ; la Surviving Sepsis Campaign 2026 préfère le haut débit en première intention.</p>
<div class="lab">Risque</div><p>Sous VNI au masque, les volumes courants dépassent souvent 9 à 10 mL/kg de poids prédit ; dans une étude observationnelle, ces grands volumes étaient associés à l’échec. Le casque pourrait réduire ce problème, mais les essais sont petits.</p>
<div class="lab">Conséquence</div><p>Si la VNI est tentée, elle se fait en soins intensifs, avec mesure du volume courant et réévaluation en une à deux heures.</p></template>

<template data-pop="j80-arma" data-title="Essai ARMA (ARDS Network, 2000)">
<div class="lab">Plan</div><p>861 patients atteints de lésion pulmonaire aiguë ou de SDRA ; volume courant de 6 mL/kg de poids prédit avec plateau ≤ 30 cm H₂O, contre 12 mL/kg avec plateau ≤ 50 cm H₂O.</p>
<div class="lab">Résultat</div><p>Mortalité 31,0 % contre 39,8 % ; arrêt précoce pour efficacité ; plus de jours sans ventilation.</p>
<div class="lab">Portée et limite</div><p>Le bénéfice existe quelle que soit la compliance initiale. Le groupe témoin à 12 mL/kg dépassait la pratique courante de l’époque, ce qui a été critiqué ; l’ensemble des données ultérieures confirme néanmoins l’intérêt d’un volume faible.</p></template>

<template data-pop="j80-vt" data-title="Volume courant et poids prédit">
<div class="lab">Formules (ARDS Network)</div><p>Homme : 50 + 0,91 × (taille en cm − 152,4). Femme : 45,5 + 0,91 × (taille en cm − 152,4).</p>
<div class="lab">Exemples</div><p>Homme de 178 cm : 73,3 kg, soit 440 mL à 6 mL/kg. Femme de 160 cm : 52,4 kg, soit 315 mL.</p>
<div class="lab">Pourquoi la taille</div><p>Le volume pulmonaire dépend de la taille, non du poids : la graisse et les œdèmes n’augmentent pas la taille des poumons.</p>
<div class="lab">Réglage</div><p>Départ à 8 mL/kg puis réduction rapide à 6 mL/kg ; jusqu’à 4 mL/kg si le plateau dépasse 30 cm H₂O ; jusqu’à 8 mL/kg si une asynchronie sévère existe et que le plateau reste bas.</p></template>

<template data-pop="j80-plateau" data-title="Pression de plateau">
<div class="lab">Mesure</div><p>Pause téléinspiratoire de 0,5 à 1 seconde, en volume contrôlé, chez un patient passif. La pression se stabilise lorsque le débit s’annule : elle reflète la pression alvéolaire maximale.</p>
<div class="lab">Seuil</div><p>≤ 30 cm H₂O (ARMA, ESICM, ATS, Surviving Sepsis Campaign 2026).</p>
<div class="lab">Pièges</div><p>Les efforts du patient faussent la mesure. Une paroi thoracique rigide (obésité, hypertension abdominale) élève le plateau sans distension pulmonaire proportionnelle ; la pression œsophagienne permet alors d’estimer la pression transpulmonaire.</p></template>

<template data-pop="j80-driving" data-title="Pression motrice">
<div class="lab">Définition</div><p>Pression de plateau moins PEP, soit volume courant divisé par la compliance du système respiratoire. Elle rapporte le volume au poumon réellement aéré.</p>
<div class="lab">Données</div><p>Dans une analyse de 3 562 patients issus de neuf essais (Amato, New England Journal of Medicine 2015), la pression motrice était la variable la plus fortement associée à la survie ; le risque augmentait au-delà d’environ 15 cm H₂O.</p>
<div class="lab">Limite</div><p>Il s’agit d’une association observationnelle. Aucun essai n’a démontré qu’une stratégie ciblant la pression motrice réduise la mortalité ; les recommandations la mentionnent sans en faire une cible obligatoire.</p>
<div class="lab">Usage</div><p>À volume courant égal, une pression motrice qui baisse après une hausse de PEP suggère un recrutement ; une pression qui monte suggère une distension.</p></template>

<template data-pop="j80-pep" data-title="PEP élevée ou basse : choix retenu">
<div class="lab">Choix retenu (source la plus récente)</div><p>Surviving Sepsis Campaign 2026 (23.03.2026) : dans le SDRA modéré à sévère d’origine septique, PEP plus élevée suggérée plutôt que plus basse (recommandation conditionnelle, certitude modérée) ; titration incrémentielle de la PEP avec recrutement déconseillée (forte, modérée). L’ATS 2024 formule la même suggestion pour le SDRA modéré à sévère, sans manœuvre de recrutement.</p>
<div class="lab">Texte en vigueur plus ancien</div><p>ESICM 2023 : aucune recommandation pour ou contre une PEP élevée, faute de preuve suffisante d’un bénéfice de mortalité dans les essais pris isolément.</p>
<div class="lab">Relation entre les sources</div><p>Les textes ne se contredisent pas sur le fond : tous rejettent le recrutement agressif. Ils divergent sur la force accordée aux méta-analyses qui suggèrent un bénéfice de la PEP élevée chez les patients les plus hypoxémiques.</p>
<div class="lab">Mise en pratique</div><p>Une table PEP-FiO₂ « haute » ou une titration individualisée sans recrutement prolongé, en surveillant le plateau, la pression motrice et l’hémodynamique. Exemple : PEP de 12 à 16 cm H₂O pour un rapport inférieur à 150.</p>
<div class="lab">Limite</div><p>Une PEP élevée peut distendre un poumon peu recrutable et réduire le retour veineux ; elle s’abaisse si la pression motrice augmente ou si la pression artérielle chute.</p></template>

<template data-pop="j80-hypercap" data-title="Hypercapnie permissive">
<div class="lab">Principe</div><p>Accepter une PaCO₂ élevée pour ne pas augmenter le volume courant.</p>
<div class="lab">Limites du protocole ARMA</div><p>Objectif de pH 7,30 à 7,45 ; si le pH est inférieur à 7,30, augmentation de la fréquence jusqu’à 35 par minute ; si le pH reste inférieur à 7,15, augmentation possible du volume courant et administration de bicarbonate.</p>
<div class="lab">Contre-indications relatives</div><p>Hypertension intracrânienne, car le CO₂ dilate les vaisseaux cérébraux ; cœur pulmonaire aigu, car l’acidose augmente la résistance vasculaire pulmonaire.</p></template>

<template data-pop="j80-recrut" data-title="Manœuvres de recrutement">
<div class="lab">Définition</div><p>Augmentation transitoire de la pression pour rouvrir les alvéoles fermées, par exemple 40 cm H₂O pendant 40 secondes ou des paliers croissants de PEP.</p>
<div class="lab">Preuve</div><p>Essai ART (JAMA 2017, 1 010 patients) : la stratégie de recrutement avec titration de la PEP a augmenté la mortalité à 28 jours (55,3 % contre 49,3 %) et les barotraumatismes.</p>
<div class="lab">Recommandations</div><p>ESICM 2023, ATS 2024 et Surviving Sepsis Campaign 2026 : ne pas utiliser de manœuvres prolongées ni de titration incrémentielle (recommandations fortes).</p></template>

<template data-pop="j80-dv" data-title="Décubitus ventral : durée retenue">
<div class="lab">Mécanisme</div><p>Le poumon dorsal, le plus volumineux, se réouvre ; la perfusion reste dorsale ; le cœur ne comprime plus les lobes inférieurs ; la contrainte mécanique devient plus homogène. Le bénéfice de survie s’explique surtout par la réduction des lésions de ventilation.</p>
<div class="lab">Essai PROSEVA (Guérin, New England Journal of Medicine 2013)</div><p>466 patients, PaO₂/FiO₂ &lt; 150 sous FiO₂ ≥ 0,6 et PEP ≥ 5 cm H₂O, après 12 à 24 heures de stabilisation ; séances moyennes d’environ 17 heures. Mortalité à 28 jours 16,0 % contre 32,8 % ; à 90 jours 23,6 % contre 41,0 %.</p>
<div class="lab">Choix retenu et sources</div><p>La source la plus récente, la Surviving Sepsis Campaign 2026, suggère plus de 12 heures par jour (conditionnelle) ; l’ATS 2024 retient plus de 12 heures ; l’ESICM 2023 recommande plus de 16 heures (forte). Les trois textes s’accordent sur l’indication ; ils diffèrent sur la durée minimale. Le cours retient au moins 16 heures, car c’est la durée effectivement étudiée dans l’essai positif, ce qui satisfait aussi le seuil de 12 heures.</p>
<div class="lab">Contre-indications</div><p>Instabilité rachidienne, hypertension intracrânienne non contrôlée, abdomen ouvert, hémoptysie massive, sternotomie récente, instabilité hémodynamique majeure.</p>
<div class="lab">Complications</div><p>Escarres faciales, extubation accidentelle, déplacement de cathéters, œdème facial. Une équipe entraînée de quatre à cinq soignants les réduit.</p></template>

<template data-pop="j80-curares" data-title="Curares dans le SDRA : choix retenu">
<div class="lab">Choix retenu (source la plus récente)</div><p>Surviving Sepsis Campaign 2026 : dans le SDRA modéré à sévère d’origine septique, bolus intermittents de curare plutôt que perfusion continue (conditionnelle, certitude modérée).</p>
<div class="lab">Textes antérieurs en vigueur</div><p>ATS 2024 : curares suggérés dans le SDRA sévère précoce (conditionnelle, faible). ESICM 2023 : pas de perfusion continue systématique dans le SDRA modéré à sévère.</p>
<div class="lab">Essais</div><p>ACURASYS (Papazian, New England Journal of Medicine 2010, 340 patients, PaO₂/FiO₂ &lt; 150) : cisatracurium 48 heures, mortalité à 90 jours ajustée plus basse. Essai américain de 2019 (Moss, New England Journal of Medicine, 1 006 patients) : aucune différence de mortalité (42,5 % contre 42,8 %) lorsque le groupe témoin recevait une sédation légère.</p>
<div class="lab">Relation entre les sources</div><p>Tous les textes rejettent la curarisation continue de routine. Ils admettent la curarisation pour une asynchronie sévère, un décubitus ventral ou une hypoxémie réfractaire ; la forme en bolus est préférée par la source la plus récente.</p>
<div class="lab">Condition absolue</div><p>Sédation profonde préalable pour éviter un patient paralysé et conscient.</p></template>

<template data-pop="j80-ecmo" data-title="ECMO veino-veineuse">
<div class="lab">Principe</div><p>Le sang est drainé d’une grosse veine, oxygéné et épuré du CO₂ dans un oxygénateur à membrane, puis réinjecté dans l’oreillette droite. Le poumon peut être mis au repos avec une ventilation ultra-protectrice.</p>
<div class="lab">Essai EOLIA (Combes, New England Journal of Medicine 2018)</div><p>Critères : PaO₂/FiO₂ &lt; 50 mmHg plus de 3 heures, ou &lt; 80 mmHg plus de 6 heures, ou pH &lt; 7,25 avec PaCO₂ ≥ 60 mmHg plus de 6 heures, malgré une ventilation optimisée. Mortalité à 60 jours 35 % contre 46 % (différence non significative, p = 0,09) ; 28 % des témoins ont reçu une ECMO de sauvetage. Une analyse bayésienne ultérieure suggère un bénéfice probable.</p>
<div class="lab">Recommandations</div><p>ESICM 2023 : recommandée dans le SDRA sévère réfractaire, dans un centre expérimenté. ATS 2024 et Surviving Sepsis Campaign 2026 : suggérée chez des patients sélectionnés.</p>
<div class="lab">Organisation suisse</div><p>Le programme est concentré dans des centres hospitaliers universitaires ; le contact se prend tôt, car le transfert d’un patient très hypoxémique est risqué et peut nécessiter une équipe mobile.</p>
<div class="lab">Risques</div><p>Hémorragie liée à l’anticoagulation, thrombose du circuit, hémorragie cérébrale, infection.</p></template>

<template data-pop="j80-liquides" data-title="Stratégie liquidienne (FACTT)">
<div class="lab">Essai</div><p>FACTT (ARDS Network, New England Journal of Medicine 2006), 1 000 patients sans choc au moment de l’inclusion : stratégie conservatrice (diurétiques, apports limités) contre libérale.</p>
<div class="lab">Résultats</div><p>Bilan cumulé à 7 jours proche de zéro contre environ +7 L ; jours sans ventilation 14,6 contre 12,1 ; mortalité 25,5 % contre 28,4 % (différence non significative) ; pas d’augmentation du recours à la dialyse.</p>
<div class="lab">Application</div><p>Réanimer d’abord le choc (cours A41), puis viser un bilan neutre ou négatif dès la stabilisation, avec surveillance de la créatinine et de la natrémie.</p></template>

<template data-pop="j80-cortico" data-title="Corticoïdes dans le SDRA : choix retenu">
<div class="lab">Choix retenu (source la plus récente sur cette question)</div><p>Mise à jour SCCM 2024 (Chaudhuri, Critical Care Medicine 2024 ; publication en ligne le 19.01.2024) : corticoïdes suggérés chez l’adulte hospitalisé atteint de SDRA (recommandation conditionnelle, certitude modérée). Réduction probable de la mortalité à 28 jours (risque relatif 0,82 ; intervalle de confiance à 95 % 0,72 à 0,95). Aucune molécule, dose ou durée n’est recommandée faute de données comparatives.</p>
<div class="lab">Autres textes</div><p>ATS 2024 : même suggestion. ESICM 2023 : question non traitée. Surviving Sepsis Campaign 2026 : aucune recommandation spécifique au SDRA ; corticoïdes suggérés dans le choc septique. Recommandation SCCM et ESICM de 2017 (texte antérieur) : méthylprednisolone 1 mg/kg par jour dans le SDRA précoce modéré à sévère.</p>
<div class="lab">Relation entre les sources</div><p>Les textes récents convergent vers une suggestion, sans uniformité de schéma. Les essais disponibles utilisent la dexaméthasone (DEXA-ARDS) ou la méthylprednisolone.</p>
<div class="lab">Limites</div><p>Hyperglycémie fréquente, infections secondaires possibles. Données défavorables dans la grippe ; délétère si débuté après le quatorzième jour (ARDS Network 2006). Le bénéfice démontré dans la COVID-19 (RECOVERY) concerne une dose de 6 mg de dexaméthasone.</p></template>

<template data-pop="j80-no" data-title="Monoxyde d’azote inhalé">
<div class="lab">Mécanisme</div><p>Vasodilatateur sélectif des vaisseaux des alvéoles ventilées : il redirige le sang vers ces alvéoles, réduit le shunt et la pression artérielle pulmonaire. Il est inactivé immédiatement par l’hémoglobine, d’où l’absence d’effet systémique.</p>
<div class="lab">Preuves</div><p>Amélioration de l’oxygénation pendant environ 24 heures, sans réduction de mortalité ; augmentation du risque d’insuffisance rénale dans les méta-analyses (revue Cochrane 2016).</p>
<div class="lab">Place</div><p>Sauvetage transitoire d’une hypoxémie réfractaire ou d’un cœur pulmonaire aigu, par exemple en attendant une ECMO. Usage hors indication autorisée chez l’adulte atteint de SDRA.</p>
<div class="lab">Surveillance</div><p>Méthémoglobine, dioxyde d’azote ; sevrage progressif pour éviter une hypoxémie de rebond.</p></template>

<template data-pop="j80-gds" data-title="Gazométrie artérielle">
<div class="lab">Valeurs normales (adulte jeune, niveau de la mer, air ambiant)</div><p>pH 7,35 à 7,45 ; PaO₂ 80 à 100 mmHg (10,7 à 13,3 kPa) ; PaCO₂ 35 à 45 mmHg (4,7 à 6,0 kPa) ; bicarbonates 22 à 26 mmol/L ; SaO₂ ≥ 95 %.</p>
<div class="lab">Technique</div><p>Ponction radiale après test d’Allen modifié, ou cathéter artériel ; analyse rapide ; noter la FiO₂, la PEP et le mode de ventilation.</p>
<div class="lab">Lecture dans le SDRA</div><p>Hypoxémie avec hypocapnie au début (hyperventilation) ; normalisation ou hausse de la PaCO₂ annonce l’épuisement ou un espace mort élevé. Le lactate signale une hypoperfusion associée.</p>
<div class="lab">Erreur fréquente</div><p>Interpréter une PaO₂ sans la FiO₂ : 90 mmHg est normal en air ambiant mais traduit une atteinte sévère sous FiO₂ de 0,9 (rapport 100).</p></template>

<template data-pop="j80-rx" data-title="Radiographie thoracique du SDRA">
<div class="lab">Lésions élémentaires</div><p>Opacités alvéolaires bilatérales, souvent périphériques et asymétriques, bronchogramme aérien, cœur de taille normale, peu d’épanchement.</p>
<div class="lab">Comparaison</div><p>L’œdème cardiogénique donne une cardiomégalie, une redistribution vasculaire vers les sommets, des lignes de Kerley, des manchons péribronchiques, des épanchements et des opacités périhilaires en « ailes de papillon ».</p>
<div class="lab">Limites</div><p>Cliché au lit de qualité moyenne, concordance entre lecteurs modeste, retard de quelques heures sur l’hypoxémie. Une formation à la lecture améliore la concordance.</p></template>

<template data-pop="j80-tdm" data-title="TDM thoracique dans le SDRA">
<div class="lab">Aspect</div><p>Gradient antéro-postérieur : poumon aéré en avant, verre dépoli au milieu, condensations postérieures. À un stade tardif, réticulations, bronchectasies de traction et kystes témoignent d’une fibrose.</p>
<div class="lab">Indications</div><p>Évolution inhabituelle, absence de facteur de risque, suspicion de complication (abcès, pneumothorax cloisonné, épanchement), recherche d’un foyer abdominal ou d’une embolie (angioscanner).</p>
<div class="lab">Risque</div><p>Le transport d’un patient très hypoxémique comporte un risque réel ; la décision met en balance ce risque et le bénéfice attendu.</p></template>

<template data-pop="j80-echo" data-title="Échographie pulmonaire">
<div class="lab">Normal</div><p>Ligne pleurale fine et mobile (glissement), lignes A horizontales répétitives.</p>
<div class="lab">Signes de l’œdème</div><p>Lignes B : artefacts verticaux partant de la ligne pleurale, qui effacent les lignes A ; trois ou plus par espace intercostal définissent un champ pathologique.</p>
<div class="lab">SDRA contre cardiogénique</div><p>SDRA : lignes B hétérogènes, zones épargnées, ligne pleurale épaissie et irrégulière, consolidations sous-pleurales. Cardiogénique : lignes B diffuses symétriques, ligne pleurale fine, épanchements bilatéraux.</p>
<div class="lab">Place dans la définition globale</div><p>Admise pour prouver le caractère bilatéral, si l’opérateur est formé.</p></template>

<template data-pop="j80-proteines" data-title="Rapport des protéines œdème/plasma">
<div class="lab">Principe</div><p>Aspiration du liquide d’œdème par la sonde trachéale dans les premières heures, dosage simultané des protéines dans le liquide et dans le plasma.</p>
<div class="lab">Seuils (Ware et Matthay, New England Journal of Medicine 2005)</div><p>Rapport &gt; 0,65 : œdème de perméabilité. Rapport &lt; 0,45 : œdème hydrostatique. Entre les deux : mixte ou indéterminé.</p>
<div class="lab">Statut</div><p>Outil de recherche et d’enseignement, non un examen de routine ; il démontre que les deux œdèmes ont des mécanismes différents.</p></template>

<template data-pop="j80-lba" data-title="Lavage bronchoalvéolaire">
<div class="lab">Technique</div><p>Instillation et réaspiration de sérum physiologique par fibroscopie dans un segment atteint ; chez le patient ventilé, sous FiO₂ de 1,0 et avec prudence, car l’hypoxémie peut s’aggraver.</p>
<div class="lab">Lecture</div><p>Neutrophiles prédominants : SDRA ou infection bactérienne. Éosinophiles &gt; 25 % : pneumonie à éosinophiles. Lymphocytes élevés : pneumopathie d’hypersensibilité, pneumopathie organisée. Aliquotes de plus en plus hémorragiques et sidérophages : hémorragie alvéolaire.</p>
<div class="lab">Microbiologie</div><p>Cultures quantitatives, PCR virales, <i>Pneumocystis</i>, galactomannane aspergillaire chez l’immunodéprimé.</p></template>
