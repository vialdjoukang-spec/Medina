
<!-- ===== FENÊTRES : anamnèse, examen, diagnostic, complications ===== -->
<template data-pop="j80-a-chrono" data-title="Chronologie de l’hypoxémie">
<div class="lab">Pourquoi dater</div><p>La définition exige une apparition ou une aggravation dans la semaine qui suit le facteur de risque. La plupart des SDRA apparaissent dans les 72 heures ; une évolution sur plusieurs semaines oriente vers une pneumopathie interstitielle, une lymphangite ou une pneumopathie organisée.</p>
<div class="lab">Questions utiles</div><p>Quand la dyspnée est-elle apparue ? Depuis quand l’oxygène est-il nécessaire ? Quel événement l’a précédée : infection, vomissement, transfusion, chirurgie, ascension, crise convulsive ?</p>
<div class="lab">Exemple</div><p>Une transfusion à 14 heures suivie d’une hypoxémie à 17 heures évoque un TRALI ; la même hypoxémie trois jours après une pneumonie évoque un SDRA d’agression directe.</p></template>

<template data-pop="j80-a-cardio" data-title="Antécédents cardiaques">
<div class="lab">Ce qui oriente vers le cœur</div><p>Infarctus ou insuffisance cardiaque connus, fraction d’éjection basse, valvulopathie, fibrillation auriculaire rapide, hypertension mal contrôlée, dyspnée progressive avec orthopnée et prise de poids.</p>
<div class="lab">Limite</div><p>Un antécédent cardiaque ne prouve pas que l’œdème actuel soit cardiogénique : un patient cardiaque septique peut faire un SDRA. Il faut juger si le cœur explique <b>principalement</b> l’œdème, ce que l’échocardiographie précise.</p></template>

<template data-pop="j80-a-medic" data-title="Médicaments et toxiques à rechercher">
<div class="lab">Œdème hydrostatique favorisé</div><p>Anti-inflammatoires non stéroïdiens et glitazones (rétention hydrosodée), arrêt d’un diurétique, perfusions abondantes.</p>
<div class="lab">Œdème de perméabilité ou pneumopathie</div><p>Opioïdes et héroïne à forte dose, salicylés en surdose, cytarabine, gemcitabine, amiodarone, inhibiteurs de points de contrôle immunitaire, rétinoïdes (syndrome de différenciation), tocolytiques bêta-mimétiques.</p>
<div class="lab">Conséquence</div><p>L’arrêt du médicament fait partie du traitement ; certains tableaux répondent aux corticoïdes.</p></template>

<template data-pop="j80-s-dyspnee" data-title="Dyspnée de l’œdème lésionnel">
<div class="lab">Mécanisme</div><p>L’hypoxémie stimule les chémorécepteurs périphériques ; l’œdème interstitiel active les récepteurs juxtacapillaires, qui accélèrent la respiration et la rendent superficielle ; la compliance basse augmente le travail nécessaire à chaque cycle.</p>
<div class="lab">Chronologie</div><p>Elle s’installe en heures à jours. Une orthopnée marquée et une dyspnée paroxystique nocturne antérieures orientent plutôt vers une cause cardiaque.</p>
<div class="lab">Piège</div><p>Au cours de la COVID-19, certains patients décrivent peu de dyspnée malgré une hypoxémie profonde ; la SpO₂ et la fréquence respiratoire mesurent mieux la gravité que la plainte.</p></template>

<template data-pop="j80-e-fr" data-title="Fréquence respiratoire et signes de lutte">
<div class="lab">Normal</div><p>12 à 20 cycles par minute chez l’adulte au repos.</p>
<div class="lab">Technique</div><p>Compter pendant 30 à 60 secondes sans que le patient le sache, car l’attention modifie la respiration.</p>
<div class="lab">Valeur</div><p>Une fréquence supérieure à 30 par minute, le tirage, la contraction des sterno-cléido-mastoïdiens et la respiration abdominale paradoxale (abdomen qui rentre à l’inspiration) signalent une fatigue diaphragmatique et un risque d’épuisement.</p>
<div class="lab">Piège</div><p>La fréquence est souvent mal relevée dans les dossiers ; elle est pourtant le premier signe de dégradation et un composant de l’indice ROX.</p></template>

<template data-pop="j80-e-spo2" data-title="Oxymétrie de pouls">
<div class="lab">Principe</div><p>Mesure de l’absorption de deux longueurs d’onde par l’hémoglobine oxygénée et réduite dans le sang pulsatile.</p>
<div class="lab">Cible dans le SDRA</div><p>88 à 95 % chez l’adulte intubé (protocole ARMA) ; la Surviving Sepsis Campaign 2026 laisse le choix entre une cible conservatrice (environ 90 à 93 %) et libérale selon le patient.</p>
<div class="lab">Pièges</div><p>Surestimation chez les patients à peau foncée, mesure fausse en cas de carboxyhémoglobine ou de méthémoglobine, signal médiocre si les extrémités sont froides. Au-dessus de 97 %, la SpO₂ ne reflète plus la PaO₂.</p></template>

<template data-pop="j80-e-crep" data-title="Crépitants">
<div class="lab">Technique</div><p>Auscultation des bases et des régions postérieures, patient assis si possible ; chez le patient couché, ausculter aussi les régions latérales.</p>
<div class="lab">Valeur</div><p>Les crépitants traduisent l’ouverture de petites voies aériennes et d’alvéoles remplies de liquide. Ils existent dans les deux types d’œdème, dans la pneumonie et dans la fibrose ; ils ne distinguent pas la cause.</p>
<div class="lab">Piège</div><p>Leur absence n’exclut pas un SDRA : chez le patient ventilé, l’auscultation est souvent pauvre malgré une atteinte radiologique étendue.</p></template>

<template data-pop="j80-e-cardio" data-title="Signes cardiaques de congestion">
<div class="lab">Signes</div><p>Turgescence jugulaire et reflux hépato-jugulaire, troisième bruit, souffle d’insuffisance mitrale, œdèmes déclives, extrémités froides avec pincement de la pression différentielle.</p>
<div class="lab">Valeur</div><p>Le troisième bruit est spécifique d’une pression de remplissage élevée mais peu sensible. La turgescence jugulaire est difficile à juger chez le patient ventilé, car la PEP élève la pression veineuse.</p>
<div class="lab">Conséquence</div><p>Ces signes orientent vers I50 ; leur absence ne remplace pas l’échocardiographie.</p></template>

<template data-pop="j80-oapcardio" data-title="Œdème lésionnel contre œdème cardiogénique">
<div class="lab">Question décisive</div><p>La pression capillaire pulmonaire élevée explique-t-elle seule l’œdème ? Si oui, il s’agit d’un œdème cardiogénique (I50.1) ; sinon, d’un œdème de perméabilité (SDRA ou J81).</p>
<div class="lab">Arguments les plus utiles</div><p>Contexte et chronologie ; échocardiographie (fonction gauche, valves, rapport E/e′) ; peptides natriurétiques pour exclure ; aspect radiologique et échographique ; réponse rapide au diurétique et au dérivé nitré dans l’œdème cardiogénique.</p>
<div class="lab">Situation mixte</div><p>Un patient peut avoir les deux : sepsis avec cardiomyopathie septique, choc avec remplissage massif. Le traitement associe alors la ventilation protectrice et la correction de la surcharge.</p>
<div class="lab">Traitement de l’œdème cardiogénique</div><p>Il relève de <a href="#/entry/I50">I50 — Insuffisance cardiaque (C-01-Cardiologie)</a> : VNI, diurétique de l’anse, dérivé nitré si la pression systolique dépasse 110 mmHg, traitement de la cause.</p></template>

<template data-pop="j80-np" data-title="Peptides natriurétiques dans l’œdème aigu">
<div class="lab">Origine</div><p>Le BNP et le NT-proBNP sont libérés par les cardiomyocytes ventriculaires étirés.</p>
<div class="lab">Seuils d’exclusion</div><p>Dans l’insuffisance cardiaque aiguë, BNP &lt; 100 pg/mL ou NT-proBNP &lt; 300 pg/mL rendent le diagnostic improbable (ESC 2021, repris dans le cours I50).</p>
<div class="lab">Limites dans le SDRA</div><p>Ils s’élèvent aussi dans le sepsis, l’insuffisance rénale, l’embolie pulmonaire, l’hypertension pulmonaire et la dilatation du ventricule droit induite par la ventilation. Une valeur élevée ne prouve donc pas une cause cardiaque.</p>
<div class="lab">Usage pratique</div><p>Une valeur basse oriente fortement vers un œdème non cardiogénique ; une valeur élevée impose l’échocardiographie.</p></template>

<template data-pop="j80-diff" data-title="Imitateurs du SDRA">
<div class="lab">Principe</div><p>Dans une cohorte française (Gibelin, Intensive Care Medicine 2016), environ 7 à 8 % des patients remplissant les critères de Berlin n’avaient aucun facteur de risque classique ; une part importante d’entre eux avait une maladie relevant d’un traitement spécifique.</p>
<div class="lab">Hémorragie alvéolaire diffuse</div><p>Vascularites à ANCA, syndrome de Goodpasture, lupus, troubles de la coagulation. Lavage de plus en plus hémorragique, sidérophages. Traitement : immunosuppression, échanges plasmatiques selon la cause.</p>
<div class="lab">Pneumonie aiguë à éosinophiles</div><p>Souvent liée au début du tabagisme ou du vapotage. Lavage &gt; 25 % d’éosinophiles. Réponse rapide aux corticoïdes.</p>
<div class="lab">Pneumopathie organisée, pneumopathie médicamenteuse, exacerbation aiguë de fibrose</div><p>TDM caractéristique et anamnèse médicamenteuse ; corticothérapie selon la cause. Voir J84.</p>
<div class="lab">Pneumocystose</div><p>Immunodépression, LDH élevée, PCR positive ; traitement par cotrimoxazole et corticoïdes si hypoxémie.</p></template>

<template data-pop="j80-rox" data-title="Indice ROX">
<div class="lab">Calcul</div><p>(SpO₂ / FiO₂) / fréquence respiratoire. Exemple : SpO₂ 90 %, FiO₂ 0,60, fréquence 30 : (90/0,60)/30 = 5,0.</p>
<div class="lab">Seuils (Roca, American Journal of Respiratory and Critical Care Medicine 2019)</div><p>Un indice ≥ 4,88 à 2, 6 ou 12 heures prédit le succès du haut débit. Un indice inférieur à 2,85 à 2 heures, 3,47 à 6 heures et 3,85 à 12 heures prédit l’échec.</p>
<div class="lab">Limites</div><p>Il a été validé surtout dans la pneumonie. Il aide la décision mais ne la remplace pas : l’état de conscience, l’hémodynamique et l’effort inspiratoire restent décisifs.</p></template>

<template data-pop="j80-psili" data-title="Lésions pulmonaires auto-infligées par le patient">
<div class="lab">Hypothèse</div><p>Chez un patient non intubé qui fait des efforts inspiratoires très intenses, de larges variations de pression transpulmonaire et des mouvements de liquide pourraient aggraver la lésion, comme le ferait un volume courant excessif au ventilateur.</p>
<div class="lab">Arguments</div><p>Données expérimentales chez l’animal et associations observationnelles entre échec retardé du support non invasif et mortalité.</p>
<div class="lab">Débat</div><p>Aucun essai ne démontre qu’une intubation plus précoce réduit la mortalité. La notion justifie une surveillance rapprochée et une réévaluation fréquente, non une intubation systématique.</p></template>

<template data-pop="j80-intub" data-title="Intubation dans le SDRA">
<div class="lab">Décision</div><p>Fondée sur l’hypoxémie malgré le haut débit, le travail respiratoire, l’indice ROX, la conscience, l’hémodynamique et la capacité à protéger les voies aériennes.</p>
<div class="lab">Préoxygénation</div><p>Par VNI ou haut débit, car le shunt rend la désaturation très rapide pendant l’apnée.</p>
<div class="lab">Risques</div><p>Désaturation profonde, collapsus après induction par vasoplégie et perte de la précharge sous pression positive, arrêt cardiaque. Un vasopresseur doit être prêt, et l’opérateur le plus expérimenté réalise le geste.</p>
<div class="lab">Après l’intubation</div><p>Régler immédiatement le volume courant sur le poids prédit et mesurer la pression de plateau.</p></template>

<template data-pop="j80-barotrauma" data-title="Barotraumatisme">
<div class="lab">Formes</div><p>Pneumothorax, pneumomédiastin, emphysème sous-cutané, kystes aériques. Fréquence autour de 10 % dans les essais récents ; plus élevée dans la COVID-19.</p>
<div class="lab">Mécanisme</div><p>Rupture alvéolaire sous distension, l’air remontant le long des gaines bronchovasculaires vers le médiastin et la plèvre.</p>
<div class="lab">Conduite</div><p>Échographie (absence de glissement pleural, point poumon) ; drainage de tout pneumothorax chez le patient ventilé ; réduction des pressions. Voir J93.</p></template>

<template data-pop="j80-pav" data-title="Pneumonie acquise sous ventilation mécanique">
<div class="lab">Définition</div><p>Pneumonie apparue plus de 48 heures après l’intubation.</p>
<div class="lab">Diagnostic difficile</div><p>Les opacités préexistantes du SDRA masquent un nouveau foyer ; une fièvre nouvelle, des sécrétions purulentes et une aggravation de l’oxygénation doivent la faire chercher par prélèvement respiratoire.</p>
<div class="lab">Prévention</div><p>Tête surélevée, sédation légère, épreuves quotidiennes de réveil et de ventilation spontanée, aspiration sous-glottique selon le matériel, soins de bouche, extubation dès que possible.</p></template>

<template data-pop="j80-cpa" data-title="Cœur pulmonaire aigu">
<div class="lab">Définition</div><p>Dilatation aiguë du ventricule droit avec septum paradoxal, visible à l’échocardiographie.</p>
<div class="lab">Fréquence et causes</div><p>Environ un patient sur cinq atteint de SDRA modéré à sévère dans une cohorte française de 2016. Facteurs : PaO₂/FiO₂ &lt; 150, PaCO₂ ≥ 48 mmHg, pression motrice ≥ 18 cm H₂O, pneumonie comme cause. Ces facteurs augmentent la résistance vasculaire pulmonaire.</p>
<div class="lab">Conduite</div><p>Réduire la pression motrice et l’hypercapnie, envisager le décubitus ventral, qui décharge le ventricule droit, éviter la surcharge volémique ; le monoxyde d’azote inhalé peut aider transitoirement.</p></template>

<template data-pop="j80-pics" data-title="Syndrome post-réanimation">
<div class="lab">Composantes</div><p>Faiblesse musculaire acquise, troubles cognitifs (attention, mémoire), anxiété, dépression et stress post-traumatique ; atteinte possible des proches.</p>
<div class="lab">Données</div><p>Cinq ans après un SDRA, la distance de marche de six minutes reste à environ 76 % de la valeur prédite malgré une spirométrie presque normale (Herridge, 2011).</p>
<div class="lab">Prévention</div><p>Sédation légère, mobilisation précoce, prévention du délire, journal de réanimation, consultation de suivi et réadaptation.</p></template>

<template data-pop="j80-grossesse" data-title="SDRA et grossesse">
<div class="lab">Causes propres</div><p>Inhalation lors de l’anesthésie, embolie amniotique, prééclampsie avec œdème pulmonaire, sepsis du post-partum, pyélonéphrite, œdème après tocolyse par bêta-mimétiques.</p>
<div class="lab">Physiologie</div><p>La femme enceinte hyperventile : PaCO₂ normale d’environ 30 mmHg. Une PaCO₂ de 40 mmHg traduit déjà une hypoventilation relative. L’utérus gravide réduit la capacité résiduelle fonctionnelle et accélère la désaturation à l’intubation.</p>
<div class="lab">Conduite</div><p>Ventilation protectrice ; cible de SpO₂ souvent fixée plus haut par consensus (sans essai) pour préserver l’oxygénation fœtale ; décubitus latéral gauche ou décalage utérin ; décubitus ventral possible avec des appuis adaptés ; décision d’extraction fœtale discutée entre réanimateurs et obstétriciens selon l’âge gestationnel et l’état maternel.</p></template>
