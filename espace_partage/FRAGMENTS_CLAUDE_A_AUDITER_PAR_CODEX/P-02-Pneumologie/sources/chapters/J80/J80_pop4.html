<template data-pop="j80-d-dexa" data-title="Corticoïdes systémiques dans le SDRA">
<div class="lab">Mécanisme</div><p>Le complexe corticoïde-récepteur inhibe NF-κB et AP-1, réduit la production de cytokines et le recrutement des neutrophiles, et freine la prolifération fibroblastique. La dexaméthasone n’a pas d’effet minéralocorticoïde ; la méthylprednisolone en a peu ; l’hydrocortisone en a un.</p>
<div class="lab">Essais</div><p>DEXA-ARDS (Villar, Lancet Respiratory Medicine 2020, 277 patients, PaO₂/FiO₂ ≤ 200 sous PEP ≥ 10 cm H₂O) : dexaméthasone 20 mg par jour pendant 5 jours puis 10 mg par jour pendant 5 jours ; jours sans ventilation +4,8 ; mortalité à 60 jours 21 % contre 36 %. Essai ouvert, arrêté pour recrutement lent. RECOVERY (2020) : dexaméthasone 6 mg par jour pendant 10 jours dans la COVID-19 oxygénodépendante, réduction de mortalité. Essai ARDS Network 2006 : méthylprednisolone débutée entre 7 et 28 jours, sans bénéfice global et délétère après 14 jours.</p>
<div class="lab">Posologie</div><p>Selon l’essai choisi (tableau des doses de l’onglet Pharmacologie). Les monographies suisses n’ont pas d’indication « SDRA » ; l’usage repose sur les recommandations.</p>
<div class="lab">Effets indésirables</div><p>Hyperglycémie (76 % sous dexaméthasone dans DEXA-ARDS, 70 % dans le groupe témoin), infections, faiblesse musculaire, troubles neuropsychiques, hémorragie digestive.</p>
<div class="lab">Contre-indications relatives</div><p>Infection fongique invasive non traitée, grippe sans autre indication, début après le quatorzième jour.</p>
<div class="lab">Surveillance</div><p>Glycémie capillaire répétée, recherche d’infection secondaire, kaliémie.</p></template>

<template data-pop="j80-d-cisa" data-title="Cisatracurium">
<div class="lab">Mécanisme</div><p>Curare non dépolarisant de la famille des benzylisoquinoléines, antagoniste compétitif des récepteurs nicotiniques de la plaque motrice. Il est éliminé par la voie de Hofmann, dégradation chimique indépendante du foie et du rein : il convient aux défaillances d’organes.</p>
<div class="lab">Preuves</div><p>ACURASYS 2010 : perfusion de 48 heures dans le SDRA avec PaO₂/FiO₂ &lt; 150, mortalité ajustée réduite. Essai de 2019 : pas de bénéfice par rapport à une sédation légère.</p>
<div class="lab">Posologie (essai ACURASYS)</div><p>15 mg en bolus intraveineux, puis 37,5 mg/h pendant 48 heures. La Surviving Sepsis Campaign 2026 préfère des bolus intermittents. Posologie suisse à confirmer dans l’information professionnelle (Compendium non consulté).</p>
<div class="lab">Effets indésirables</div><p>Faiblesse acquise en réanimation, surtout en association avec les corticoïdes ; risque de conscience sous paralysie si la sédation est insuffisante ; laudanosine, métabolite épileptogène à forte exposition, sans conséquence clinique habituelle aux doses de réanimation.</p>
<div class="lab">Surveillance</div><p>Train de quatre, sédation profonde, protection oculaire, prévention des escarres.</p></template>

<template data-pop="j80-d-sed" data-title="Sédation et analgésie du patient ventilé">
<div class="lab">Principe</div><p>Analgésie d’abord, puis sédation la plus légère compatible avec la ventilation protectrice et la sécurité. La sédation profonde est réservée à la curarisation, au décubitus ventral ou à une asynchronie sévère.</p>
<div class="lab">Molécules</div><p>Propofol : action courte, réveil rapide ; au-delà d’environ 4 mg/kg/h prolongé, risque de syndrome de perfusion du propofol (acidose lactique, rhabdomyolyse, arythmies). Dexmédétomidine : sédation coopérante, bradycardie et hypotension. Midazolam : accumulation et délire, à limiter. Opioïdes (fentanyl, morphine) : analgésie et diminution de la commande respiratoire.</p>
<div class="lab">Surveillance</div><p>Échelles de sédation et de douleur, dépistage du délire, épreuve de réveil quotidienne.</p></template>

<template data-pop="j80-d-furo" data-title="Furosémide">
<div class="lab">Mécanisme</div><p>Inhibition du cotransporteur Na⁺-K⁺-2Cl⁻ de la branche ascendante large de l’anse de Henle : natriurèse puissante. Effet veinodilatateur précoce lors d’une injection intraveineuse.</p>
<div class="lab">Place</div><p>Œdème cardiogénique et TACO : traitement de première ligne (cours I50). SDRA : outil de la stratégie conservatrice après la phase de choc (FACTT). Inutile dans l’œdème de haute altitude ; dangereux dans le TRALI hypotensif.</p>
<div class="lab">Posologie</div><p>20 à 40 mg par voie intraveineuse chez le patient sans diurétique préalable (ESC 2021) ; adaptation selon la diurèse et la fonction rénale. Information professionnelle suisse non consultée lors de la rédaction.</p>
<div class="lab">Effets indésirables</div><p>Hypokaliémie, hypomagnésémie, alcalose métabolique, hypovolémie, insuffisance rénale fonctionnelle, ototoxicité à forte dose intraveineuse rapide.</p></template>

<template data-pop="j80-d-nif" data-title="Nifédipine et œdème de haute altitude">
<div class="lab">Mécanisme</div><p>Inhibiteur des canaux calciques de type L : vasodilatation des artérioles pulmonaires, baisse de la pression artérielle pulmonaire et de la pression capillaire, ce qui réduit la fuite capillaire de l’œdème d’altitude.</p>
<div class="lab">Preuves</div><p>Essai randomisé de Bärtsch (New England Journal of Medicine 1991) chez des alpinistes ayant déjà fait un œdème : nifédipine à libération prolongée 20 mg toutes les 8 heures, œdème chez 1 sujet sur 10 contre 7 sur 11 sous placebo. Le traitement curatif repose sur des séries non randomisées.</p>
<div class="lab">Posologie</div><p>Nifédipine à libération prolongée 30 mg toutes les 12 heures, en prévention (dès la veille de l’ascension et jusqu’au début de la descente ou après quatre à cinq jours à l’altitude maximale) ou en traitement si la descente et l’oxygène sont impossibles (Wilderness Medical Society ; dose vérifiée par une source secondaire). La forme à libération immédiate est à éviter, car elle provoque des hypotensions brutales.</p>
<div class="lab">Effets indésirables</div><p>Hypotension, céphalées, flush, œdèmes des chevilles, tachycardie réflexe.</p>
<div class="lab">Interactions</div><p>Inhibiteurs du CYP3A4 (clarithromycine, ritonavir, jus de pamplemousse) : majoration de l’effet hypotenseur.</p></template>

<template data-pop="pareto-j80-clin" data-title="Pareto — Définitions, mécanismes et clinique">
<p class="ratio" data-cover="j80-0,j80-1,j80-2,j80-3,j80-4,j80-5,j80-6"></p>
<ul>
<li>SDRA = œdème de <b>perméabilité</b> : barrière lésée, liquide riche en protéines, pression capillaire normale.</li>
<li>Définition globale 2024 : facteur de risque, délai ≤ 1 semaine, opacités bilatérales (radiographie, TDM ou échographie), œdème non principalement cardiogénique, hypoxémie.</li>
<li>Non intubé : PaO₂/FiO₂ ≤ 300 ou SpO₂/FiO₂ ≤ 315 (SpO₂ ≤ 97 %) sous haut débit ≥ 30 L/min ou PEP ≥ 5. Intubé : léger &gt; 200, modéré &gt; 100, sévère ≤ 100 sous PEP ≥ 5. Corriger au-dessus de 1 000 m.</li>
<li>Codage : J80.01–03 adulte (Berlin), J80.04–06 enfant (PALICC), J80.09 sans précision ; J81 œdème non cardiogénique ; I50.1 œdème cardiogénique.</li>
<li>Un patient ventilé sur quatre, méconnu dans 40 % des cas ; mortalité 35 à 46 %, surtout par défaillance multiviscérale.</li>
<li>Chaîne : agression → neutrophiles et cytokines → barrière rompue → perte du surfactant → shunt et espace mort → petit poumon aéré → lésions de ventilation → réparation ou fibrose.</li>
<li>Causes : pneumonie 59 %, sepsis extrapulmonaire 16 %, inhalation 14 % ; aussi pancréatite, traumatisme, transfusion.</li>
<li>Anamnèse : dater l’hypoxémie, chercher le facteur de risque et un argument cardiaque. Examen : fréquence respiratoire, SpO₂ avec FiO₂, signes de la cause.</li></ul></template>

<template data-pop="pareto-j80-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j80-7"></p>
<ul>
<li>Ordre : gazométrie et rapport → imagerie bilatérale → échocardiographie et peptides → facteur de risque → sinon, chercher un imitateur.</li>
<li>Échocardiographie : examen le plus discriminant. BNP &lt; 100 ou NT-proBNP &lt; 300 pg/mL : cause cardiaque improbable ; valeur élevée : non concluante.</li>
<li>Pression d’occlusion non exigée depuis 2012 ; cardiopathie et SDRA peuvent coexister.</li>
<li>Imitateurs : hémorragie alvéolaire, pneumocystose, pneumonie à éosinophiles, exacerbation de fibrose, pneumopathie médicamenteuse ; lavage et TDM.</li></ul></template>

<template data-pop="pareto-j80-trait" data-title="Pareto — Urgences et traitement">
<p class="ratio" data-cover="j80-8,j80-9"></p>
<ul>
<li>Alerte : fréquence &gt; 30, SpO₂ &lt; 90 % sous FiO₂ &gt; 0,5, rapport &lt; 200, PaCO₂ qui monte, confusion, choc ; ROX &lt; 3,85 à 12 heures.</li>
<li>Haut débit en première intention (Surviving Sepsis Campaign 2026) ; VNI incertaine ; intubation décidée tôt et en équipe.</li>
<li>Volume courant 6 mL/kg de poids prédit (taille) ; plateau ≤ 30 ; pression motrice basse ; PEP plus élevée suggérée si modéré à sévère ; pas de recrutement prolongé.</li>
<li>Décubitus ventral si rapport &lt; 150 : au moins 16 heures (PROSEVA, mortalité 32,8 → 16,0 %).</li>
<li>Curares : pas en perfusion continue systématique ; bolus si nécessaire, toujours sous sédation profonde.</li>
<li>ECMO veino-veineuse si rapport &lt; 80 persistant ; centre expérimenté.</li>
<li>Bilan liquidien négatif après le choc (FACTT) ; corticoïdes suggérés tôt (SCCM 2024) ; monoxyde d’azote seulement en sauvetage.</li>
<li>Complications : barotraumatisme, cœur pulmonaire aigu, pneumonie sous ventilation, faiblesse acquise.</li></ul></template>

<template data-pop="pareto-j80-crit" data-title="Pareto — Œdèmes particuliers, suivi, situations et critères">
<p class="ratio" data-cover="j80-10,j80-11,j80-12,j80-13"></p>
<ul>
<li>Haute altitude : descente, oxygène, nifédipine si descente impossible ; jamais de diurétique.</li>
<li>TRALI (≤ 6 h, hypotension, BNP bas, pas de diurétique) contre TACO (≤ 12 h, hypertension, BNP élevé, diurétique) ; déclarer à l’hémovigilance.</li>
<li>Pression négative, réexpansion, neurogénique, immersion : résolution en 24 à 72 heures si la cause est supprimée.</li>
<li>Suivi à trois mois : fonction pulmonaire, DLCO, force, dépistage psychologique ; séquelles surtout musculaires et psychiques.</li>
<li>Grossesse : PaCO₂ normale 30 mmHg ; obésité : poids prédit ; COVID-19 : dexaméthasone 6 mg 10 jours.</li>
<li>Critères formels : facteur de risque, semaine, opacités bilatérales, hypoxémie sous PEP ou haut débit, œdème non principalement cardiogénique.</li></ul></template>

<template data-pop="pareto-j80-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j80-e-1,j80-e-2,j80-e-3,j80-e-4,j80-e-5,j80-e-6"></p>
<ul>
<li>Pas d’examen unique : diagnostic clinique, radiologique et gazométrique ; échocardiographie pour la distinction.</li>
<li>Rapport PaO₂/FiO₂ toujours avec FiO₂ et PEP ; FiO₂ nasale estimée 0,21 + 0,03 × L/min ; SpO₂/FiO₂ valide si SpO₂ ≤ 97 %.</li>
<li>TDM : gradient antéro-postérieur ; échographie : lignes B hétérogènes, consolidations sous-pleurales.</li>
<li>Protéines œdème/plasma &gt; 0,65 perméabilité, &lt; 0,45 hydrostatique.</li>
<li>Pause téléinspiratoire : plateau ; compliance = volume courant / (plateau − PEP), normale 50 à 80 mL/cm H₂O.</li>
<li>Lavage : éosinophiles &gt; 25 %, aliquotes hémorragiques, <i>Pneumocystis</i>.</li></ul></template>

<template data-pop="pareto-j80-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="j80-sa,j80-sh,j80-sp,j80-si"></p>
<ul>
<li>L’eau filtrée remplit l’interstitium péribronchovasculaire avant les alvéoles ; l’œdème se dépose en arrière en décubitus dorsal.</li>
<li>Dommage alvéolaire diffus : exsudatif (membranes hyalines), prolifératif (pneumocytes de type II), fibrotique inconstant ; présent chez environ 45 % des SDRA autopsiés.</li>
<li>Starling : perméabilité accrue, σ effondré ; la moindre hausse de pression aggrave l’œdème.</li>
<li>Shunt : l’oxygène corrige peu ; PEP et décubitus ventral le réduisent.</li>
<li>Pression motrice associée à la survie (association, non preuve causale).</li>
<li>Surfactant inactivé par les protéines ; clairance par ENaC et Na⁺/K⁺-ATPase altérée.</li></ul></template>

<template data-pop="pareto-j80-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j80-p-1,j80-p-2,j80-p-3,j80-p-4"></p>
<ul>
<li>Aucun médicament ne répare la barrière ; corticoïdes, curares, sédatifs, diurétiques soutiennent ou modulent.</li>
<li>Dexaméthasone 20 mg × 5 jours puis 10 mg × 5 jours (DEXA-ARDS) ; 6 mg × 10 jours dans la COVID-19 ; jamais après le 14e jour.</li>
<li>Cisatracurium 15 mg puis 37,5 mg/h 48 heures (ACURASYS) ou bolus ; sédation profonde préalable.</li>
<li>Furosémide 20 à 40 mg par voie intraveineuse : TACO, œdème cardiogénique, bilan négatif post-choc ; pas dans l’œdème d’altitude ni le TRALI hypotensif.</li>
<li>Nifédipine libération prolongée 30 mg toutes les 12 heures : œdème de haute altitude.</li>
<li>Surveillance : glycémie, train de quatre, propofol ≤ 4 mg/kg/h, kaliémie.</li></ul></template>
