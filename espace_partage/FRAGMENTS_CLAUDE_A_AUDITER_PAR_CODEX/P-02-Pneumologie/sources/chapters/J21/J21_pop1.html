<!-- ===== FENÊTRES : notions cliniques et renvois ===== -->
<template data-pop="j21-vrs" data-title="Virus respiratoire syncytial">
<div class="lab">Définition</div><p>Le virus respiratoire syncytial est un virus enveloppé à ARN de la famille des <i>Pneumoviridae</i>, avec deux sous-groupes, A et B. Il doit son nom aux syncytia, cellules géantes formées par la fusion de cellules infectées.</p>
<div class="lab">Transmission et incubation</div><p>Il se transmet par les gouttelettes, les aérosols et les mains contaminées, avec une entrée par le nez et la conjonctive. L’incubation dure 2 à 8 jours. La contagiosité commence un jour avant les symptômes et dure trois à huit jours, plus longtemps chez le jeune nourrisson et l’immunodéprimé (OFSP-Bulletin 37/2024).</p>
<div class="lab">Clinique selon l’âge</div><p>Le nourrisson fait une bronchiolite ; l’enfant plus âgé et l’adulte sain font un rhume, parfois une toux sèche persistante ou une otite. Le sujet âgé et l’immunodéprimé peuvent faire une pneumonie, traitée dans le cours J12.</p>
<div class="lab">Conséquence pratique</div><p>L’immunité naturelle ne dure que six mois à deux ans : la réinfection est possible à tout âge, et les adultes de l’entourage transmettent le virus au nourrisson.</p></template>
<template data-pop="j21-hmpv" data-title="Métapneumovirus humain">
<div class="lab">Définition</div><p>Le métapneumovirus humain appartient à la même famille que le virus respiratoire syncytial. Il a été identifié en 2001 par une équipe néerlandaise.</p>
<div class="lab">Clinique</div><p>Il produit un tableau indiscernable de la bronchiolite à virus respiratoire syncytial, souvent un peu plus tard dans la saison d’hiver et de printemps. Il déclenche aussi des exacerbations d’asthme et de bronchopneumopathie chronique obstructive chez l’adulte.</p>
<div class="lab">Conséquence pratique</div><p>Le code J21.1 s’applique lorsqu’il est identifié. Les anticorps et vaccins dirigés contre la protéine F du virus respiratoire syncytial ne protègent pas contre lui.</p></template>
<template data-pop="j21-adeno" data-title="Adénovirus">
<div class="lab">Définition</div><p>L’adénovirus est un virus à ADN non enveloppé, résistant dans l’environnement.</p>
<div class="lab">Particularité</div><p>Il provoque des fièvres plus élevées et plus longues que le virus respiratoire syncytial, parfois une conjonctivite. Certains sérotypes causent des bronchiolites nécrosantes graves.</p>
<div class="lab">Conséquence pratique</div><p>Il est la cause la plus souvent décrite de bronchiolite oblitérante post-infectieuse. Un enfant qui reste oxygénodépendant ou sifflant plusieurs semaines après une bronchiolite à adénovirus doit être adressé au pneumologue pédiatre.</p></template>
<template data-pop="j21-dette" data-title="Immunité de population et date des épidémies">
<div class="lab">Constat</div><p>Pendant la pandémie de COVID-19, les mesures de distanciation ont presque supprimé la circulation du virus respiratoire syncytial. À leur levée, l’été 2021 a vu en Suisse une vague hors saison avec de nombreuses hospitalisations (OFSP-Bulletin 37/2024).</p>
<div class="lab">Mécanisme proposé</div><p>Un nombre inhabituel de nourrissons et de jeunes enfants n’avaient jamais rencontré le virus, et les mères avaient moins d’anticorps à transmettre. La population sensible était plus grande que d’habitude, ce qui a permis une épidémie hors saison. Cette explication reste une hypothèse plausible, compatible avec les observations de plusieurs pays.</p>
<div class="lab">Conséquence pratique</div><p>La saison habituelle n’est pas une garantie. Un tableau typique doit faire évoquer une bronchiolite même en été.</p></template>
<template data-pop="j21-poiseuille" data-title="Loi de Poiseuille appliquée aux bronchioles">
<div class="lab">Énoncé</div><p>Pour un écoulement laminaire dans un tube, la résistance est proportionnelle à la longueur et à la viscosité, et inversement proportionnelle au rayon à la puissance quatre.</p>
<div class="lab">Exemple chiffré</div><p>Si le rayon passe de 1 à 0,5, la résistance est multipliée par 2⁴, soit 16. Si le rayon passe de 1 à 0,8, elle est multipliée par environ 2,4.</p>
<div class="lab">Limite</div><p>L’écoulement dans les grosses bronches est en partie turbulent, et la loi ne s’applique qu’approximativement. Dans les petites voies aériennes, où la vitesse est faible, elle décrit bien le phénomène.</p>
<div class="lab">Conséquence pratique</div><p>Un œdème de paroi minime réduit fortement le débit chez le nourrisson, dont le rayon de départ est petit.</p></template>
<template data-pop="j21-protf" data-title="Protéine de fusion F">
<div class="lab">Définition</div><p>La protéine F est une glycoprotéine de l’enveloppe virale qui fusionne la membrane du virus avec celle de la cellule. Elle est très conservée entre les souches A et B.</p>
<div class="lab">Mécanisme</div><p>Elle passe d’une conformation instable de préfusion à une conformation stable de postfusion. Ce changement rapproche les deux membranes et permet l’entrée du génome. À la surface d’une cellule infectée, elle fusionne aussi les cellules voisines, d’où les syncytia.</p>
<div class="lab">Conséquence pratique</div><p>La forme de préfusion est la cible des anticorps les plus neutralisants. Le nirsévimab et les vaccins actuels la ciblent (OFSP-Bulletin 36/2025).</p></template>
<template data-pop="j21-bd-inefficace" data-title="Pourquoi les bronchodilatateurs échouent">
<div class="lab">Mécanisme</div><p>Un bêta-2 agoniste relâche le muscle lisse bronchique. Dans la bronchiolite, la lumière est réduite surtout par des débris, du mucus et de l’œdème. Le muscle lisse joue un rôle mineur.</p>
<div class="lab">Preuve</div><p>La revue Cochrane de 2014 (30 essais, 1992 nourrissons) n’a montré aucune amélioration de la saturation, du taux d’hospitalisation après traitement ambulatoire ni de la durée d’hospitalisation.</p>
<div class="lab">Piège</div><p>Une amélioration apparente après une nébulisation provient souvent de la désobstruction nasale faite juste avant, ou de l’évolution spontanée.</p>
<div class="lab">Exception</div><p>L’enfant de plus de 1 an, atopique, avec des sibilants récidivants sans crépitants, a probablement un sifflement viral ou un asthme : un bronchodilatateur d’épreuve se discute, avec évaluation objective de la réponse.</p></template>
<template data-pop="j21-collat" data-title="Ventilation collatérale">
<div class="lab">Définition</div><p>La ventilation collatérale est le passage d’air entre unités pulmonaires voisines par des voies qui contournent les bronchioles : pores de Kohn entre alvéoles, canaux de Lambert entre bronchioles et alvéoles, canaux de Martin entre bronchioles.</p>
<div class="lab">Chez le nourrisson</div><p>Ces communications sont peu développées. Une bronchiole bouchée isole donc son territoire, dont l’air se résorbe : une atélectasie se forme.</p>
<div class="lab">Conséquence pratique</div><p>Les atélectasies migrantes de la bronchiolite s’expliquent ainsi ; elles ne justifient pas d’antibiotique.</p></template>
<template data-pop="j21-vq" data-title="Inégalité ventilation-perfusion">
<div class="lab">Définition</div><p>Chaque unité pulmonaire a un rapport entre l’air qu’elle reçoit et le sang qui la traverse. Le rapport normal moyen est proche de 0,8 à 1.</p>
<div class="lab">Dans la bronchiolite</div><p>Les unités situées derrière un bouchon reçoivent peu ou pas d’air mais restent perfusées. Le sang qui les traverse ressort peu oxygéné et abaisse la saturation artérielle.</p>
<div class="lab">Réponse à l’oxygène</div><p>L’oxygène corrige bien les unités mal ventilées, car il élève la pression alvéolaire en oxygène. Il corrige mal les unités totalement exclues, qui se comportent comme un shunt.</p>
<div class="lab">Conséquence pratique</div><p>Une saturation qui reste basse malgré un oxygène croissant traduit une forme grave et une défaillance imminente.</p></template>
<template data-pop="j21-apnee" data-title="Apnée dans la bronchiolite">
<div class="lab">Définition</div><p>L’apnée est une pause respiratoire prolongée, ou plus courte mais accompagnée de bradycardie, de cyanose ou de pâleur.</p>
<div class="lab">Qui est à risque</div><p>Le nourrisson de moins de 6 semaines et l’ancien prématuré. NICE souligne qu’elle peut être le premier signe, sans autre signe respiratoire.</p>
<div class="lab">Mécanisme</div><p>Le contrôle ventilatoire est immature ; des réflexes laryngés exagérés aux sécrétions et une réponse centrale anormale à l’hypoxie sont proposés. Le mécanisme exact reste incomplètement élucidé.</p>
<div class="lab">Conduite</div><p>Une apnée observée ou rapportée impose une hospitalisation en urgence sous monitorage. NICE demande une aspiration des voies aériennes supérieures, même sans sécrétions visibles.</p></template>
<template data-pop="j21-premat" data-title="Prématurité et bronchiolite">
<div class="lab">Pourquoi le risque augmente</div><p>Les IgG maternelles traversent le placenta surtout au troisième trimestre : un enfant né avant terme en a reçu moins. Son poumon et son contrôle ventilatoire sont immatures, et une dysplasie bronchopulmonaire peut s’y ajouter.</p>
<div class="lab">Seuils retenus</div><p>NICE souligne surtout la naissance avant 32 semaines. Le Plan de vaccination 2026 recommande une dose d’anticorps en deuxième saison pour les enfants nés avant 32 0/7 semaines, et donne l’anticorps malgré la vaccination maternelle à tout enfant né avant 37 0/7 semaines.</p>
<div class="lab">Conséquence pratique</div><p>Un ancien prématuré en bronchiolite doit être évalué avec un seuil d’hospitalisation abaissé, à cause du risque d’apnée.</p></template>
<template data-pop="j21-immunisation" data-title="Statut d’immunisation à rechercher">
<div class="lab">Questions à poser</div><p>Le médecin demande si la mère a reçu Abrysvo pendant la grossesse, et à quelle date par rapport à l’accouchement. Il demande si l’enfant a reçu le nirsévimab, à quelle date et à quelle dose.</p>
<div class="lab">Interprétation</div><p>Un enfant protégé peut encore faire une bronchiolite, plus rarement grave, ou une bronchiolite due à un autre virus. Une immunisation récente ne change pas la prise en charge de l’épisode.</p>
<div class="lab">Conséquence pratique</div><p>Après une infection confirmée à virus respiratoire syncytial, l’anticorps n’est plus indiqué pendant la même saison, sauf perte de l’immunité humorale (Plan de vaccination 2026).</p></template>
<template data-pop="j21-sifflrec" data-title="Sifflement viral récidivant et asthme débutant">
<div class="lab">Définition</div><p>Le sifflement viral récidivant désigne des épisodes sifflants déclenchés par des virus chez l’enfant d’âge préscolaire, sans symptômes entre les épisodes. L’asthme débutant comporte aussi des symptômes entre les virus et souvent une atopie.</p>
<div class="lab">Indices</div><p>NICE oriente vers ces diagnostics devant un sifflement persistant sans crépitants, des épisodes récidivants, ou une atopie personnelle ou familiale. Ces formes sont rares avant 1 an.</p>
<div class="lab">Conséquence pratique</div><p>Contrairement à la bronchiolite, ces enfants peuvent répondre à un bronchodilatateur et relèvent du cours <b>J45 — Asthme (P-02-Pneumologie)</b>.</p></template>
<template data-pop="j21-apports" data-title="Apports hydriques insuffisants">
<div class="lab">Seuil</div><p>NICE retient des apports de 50 à 75 % de l’habituel comme critère d’orientation et d’admission, à pondérer par les facteurs de risque et le jugement clinique. Les parents doivent revenir si les apports tombent à ce niveau ou si aucune couche n’est mouillée depuis 12 heures.</p>
<div class="lab">Comment mesurer</div><p>Le médecin compare le volume ou la durée des repas des dernières 24 heures à l’habitude. Exemple : un nourrisson qui prend 5 biberons de 150 mL boit d’habitude 750 mL ; s’il en boit 400 mL, il est à 53 %.</p>
<div class="lab">Mécanisme</div><p>La polypnée empêche de coordonner succion, déglutition et respiration, et augmente les pertes respiratoires d’eau.</p></template>
<template data-pop="j21-fievre" data-title="Fièvre dans la bronchiolite">
<div class="lab">Fréquence</div><p>NICE indique une fièvre dans environ 30 % des cas, habituellement inférieure à 39 °C.</p>
<div class="lab">Signal d’alerte</div><p>Une fièvre supérieure à 39 °C, ou des crépitants localisés persistants, doivent faire évoquer une pneumonie. Une fièvre qui réapparaît après le cinquième jour fait rechercher une surinfection, dont l’otite moyenne aiguë.</p>
<div class="lab">Nourrisson de moins de 3 mois</div><p>La fièvre impose l’évaluation propre au nourrisson fébrile ; une bronchiolite évidente réduit la probabilité d’une infection bactérienne grave sans l’annuler, l’infection urinaire restant à considérer.</p></template>
<template data-pop="j21-epuisement" data-title="Épuisement">
<div class="lab">Définition</div><p>L’épuisement est l’incapacité des muscles respiratoires à maintenir le travail imposé par l’obstruction.</p>
<div class="lab">Signes</div><p>L’enfant ne répond plus normalement aux sollicitations, ne se réveille qu’après une stimulation prolongée, devient hypotonique. Sa fréquence respiratoire peut paradoxalement baisser et les signes de lutte diminuer.</p>
<div class="lab">Piège</div><p>Une fréquence qui ralentit chez un enfant somnolent n’est pas une amélioration. La gazométrie montre alors une PaCO₂ qui monte.</p>
<div class="lab">Conduite</div><p>NICE considère l’épuisement comme un signe de défaillance respiratoire imminente : soins intensifs à discuter.</p></template>
<template data-pop="j21-tirage" data-title="Tirage">
<div class="lab">Définition</div><p>Le tirage est la dépression inspiratoire des parties molles du thorax : sous les côtes, entre les côtes, au-dessus du sternum.</p>
<div class="lab">Mécanisme</div><p>Pour faire entrer l’air malgré la résistance, les muscles inspiratoires créent une forte pression négative. La paroi thoracique compliante du nourrisson se creuse au lieu de rester rigide.</p>
<div class="lab">Valeur</div><p>Un tirage marqué est un signe de détresse sévère selon NICE. Le tirage sus-sternal témoigne d’un effort plus intense que le tirage sous-costal isolé.</p>
<div class="lab">Technique</div><p>Le médecin déshabille le thorax et observe l’enfant calme, de face, pendant plusieurs cycles.</p></template>
<template data-pop="j21-geignement" data-title="Geignement expiratoire">
<div class="lab">Définition</div><p>Le geignement est un bruit expiratoire court, produit par une expiration contre une glotte partiellement fermée.</p>
<div class="lab">Mécanisme</div><p>Le nourrisson freine son expiration pour garder une pression positive dans les alvéoles et éviter leur collapsus. Il crée lui-même une pression expiratoire positive.</p>
<div class="lab">Valeur</div><p>NICE le classe parmi les signes de détresse respiratoire sévère qui imposent une orientation en urgence.</p></template>
<template data-pop="j21-crepitants" data-title="Crépitants fins de la bronchiolite">
<div class="lab">Définition</div><p>Les crépitants fins sont des bruits brefs et discontinus, surtout en fin d’inspiration.</p>
<div class="lab">Mécanisme</div><p>Ils correspondent à l’ouverture brutale de petites voies aériennes et d’alvéoles collabées ou remplies de sécrétions.</p>
<div class="lab">Interprétation</div><p>Bilatéraux, diffus et sans fièvre élevée, ils font partie de la bronchiolite. Localisés et persistants, avec une fièvre supérieure à 39 °C, ils évoquent une pneumonie (NICE).</p></template>
<template data-pop="j21-oxymetrie" data-title="Saturation pulsée en oxygène">
<div class="lab">Indication</div><p>NICE demande de la mesurer chez tout enfant suspect de bronchiolite, y compris en soins primaires si un oxymètre pédiatrique est disponible.</p>
<div class="lab">Technique</div><p>Le capteur pédiatrique entoure le pied ou la main. Le médecin attend une courbe régulière et une fréquence concordante, sur un enfant calme, pendant au moins une minute.</p>
<div class="lab">Limites</div><p>Le mouvement, le froid et l’hypoperfusion faussent la mesure. Les oxymètres peuvent surestimer la saturation chez les personnes à peau foncée (NICE).</p>
<div class="lab">Seuils</div><p>Orientation à discuter sous 92 % au cabinet ; admission et oxygène sous 90 % dès 6 semaines, sous 92 % avant 6 semaines ou en cas de comorbidité.</p></template>
<template data-pop="j21-renvoi-j40" data-title="Renvoi — J40 Bronchite (couvre J20 Bronchite aiguë)">
<div class="lab">Différence avec la bronchiolite</div><p>La bronchite aiguë atteint les bronches de calibre moyen. Chez l’adulte sain, elle donne une toux, parfois productive, sans détresse ni hypoxémie. Chez l’enfant, CIM-10-GM code J20 la bronchite aiguë quel que soit l’âge, et la trachéite sans précision avant 15 ans.</p>
<div class="lab">Où la trouver</div><p>Le cours <b>J40 — Bronchite, non précisée comme aiguë ou chronique (P-02-Pneumologie)</b> couvre J20, J40, J41 et J42 et distingue la bronchite chronique de la bronchopneumopathie chronique obstructive.</p></template>
<template data-pop="j21-renvoi-j12" data-title="Renvoi — J12 Pneumopathie virale">
<div class="lab">Différence avec la bronchiolite</div><p>La pneumonie virale atteint l’alvéole et l’interstitium. Chez l’adulte âgé ou immunodéprimé, le virus respiratoire syncytial et le métapneumovirus donnent plus souvent une pneumonie qu’une bronchiolite.</p>
<div class="lab">Où la trouver</div><p>Le cours <b>J12 — Pneumopathie virale, non classée ailleurs (P-02-Pneumologie)</b> traite aussi la vaccination de l’adulte contre le virus respiratoire syncytial, ses indications et son absence de remboursement.</p></template>
<template data-pop="j21-renvoi-j18" data-title="Renvoi — J18 Pneumonie">
<div class="lab">Quand y penser</div><p>Une fièvre supérieure à 39 °C, des crépitants localisés persistants, une aggravation secondaire ou une consolidation à l’imagerie orientent vers une pneumonie. Chez l’adulte avec une infection basse, les signes de gravité de la SSI sont ceux de la pneumonie.</p>
<div class="lab">Où la trouver</div><p>Le cours <b>J18 — Pneumonie, micro-organisme non précisé (P-02-Pneumologie)</b> traite les scores de gravité et l’antibiothérapie.</p></template>
<template data-pop="j21-renvoi-j45" data-title="Renvoi — J45 Asthme">
<div class="lab">Lien</div><p>Une bronchiolite grave est associée à des sifflements récidivants et à un asthme dans l’enfance, sans causalité démontrée. Un enfant de plus de 1 an qui siffle de façon récidivante, surtout s’il est atopique, doit être évalué pour un asthme.</p>
<div class="lab">Où la trouver</div><p>Le cours <b>J45 — Asthme (P-02-Pneumologie)</b> traite le diagnostic, y compris chez l’enfant de moins de 6 ans, et le traitement de fond.</p></template>
<template data-pop="j21-renvoi-j10" data-title="Renvoi — J10 Grippe">
<div class="lab">Lien</div><p>La grippe peut se présenter comme une infection basse aiguë. La SSI ne recommande un test que si un antiviral est envisagé.</p>
<div class="lab">Où la trouver</div><p>Le cours <b>J10 — Grippe, à virus d’influenza saisonnière identifié (P-02-Pneumologie)</b> traite le diagnostic, les antiviraux et la vaccination.</p></template>
