<section class="ilot" id="j21-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Léa, 3 mois, née à terme le 20 août, est amenée au cabinet un soir de janvier. Elle a le nez qui coule depuis trois jours. Depuis hier, elle tousse, respire vite et ne boit plus que la moitié de ses biberons. Son frère de 3 ans, qui fréquente une crèche, est enrhumé. Elle n’a pas reçu l’anticorps contre le virus respiratoire syncytial proposé en octobre, parce que le rendez-vous a été manqué. À l’examen, sa fréquence respiratoire est de 64 par minute, elle a un tirage sous-costal et sa saturation pulsée en oxygène est de 91 % à l’air ambiant.</p>
<p>La question qui structure ce cours est double : <b>cette nourrissonne a-t-elle une bronchiolite, et doit-elle être hospitalisée ?</b> Une seconde question suit aussitôt : <b>quels traitements aident réellement, et lesquels faut-il éviter ?</b> La réponse repose sur trois mesures simples, la saturation, l’hydratation et le travail respiratoire, et non sur des examens ou des médicaments.</p>
<p>Le cours traite aussi deux situations voisines. La bronchiolite de l’adulte est rare, mais elle existe chez le sujet âgé, l’immunodéprimé et après une inhalation toxique. Le code J22 désigne une infection aiguë des voies respiratoires inférieures dont le siège précis n’est pas établi ; chez l’adulte, la décision utile porte alors sur l’indication d’un antibiotique.</p>
<div class="key"><b>Objectifs.</b> Le médecin assistant sait poser le diagnostic clinique de bronchiolite sans examen complémentaire de routine. Il sait repérer les signes qui imposent une hospitalisation ou un transfert en soins intensifs. Il applique les seuils de saturation de NICE 2021, assure l’hydratation et l’oxygène, et s’abstient des bronchodilatateurs, des corticoïdes et des antibiotiques. Il connaît la prévention suisse par anticorps monoclonal ou vaccination maternelle selon le mois de naissance. Il sait enfin conduire une infection aiguë des voies respiratoires inférieures de l’adulte selon les recommandations de la Société suisse d’infectiologie.</div>
<div class="key"><b>Liens avec les cours voisins.</b> La <button class="w" data-k="j21-renvoi-j40">bronchite aiguë (J20, traitée dans le cours J40)</button> atteint les bronches de calibre moyen, sans détresse respiratoire chez l’adulte sain. La <button class="w" data-k="j21-renvoi-j12">pneumonie virale (J12)</button> et la <button class="w" data-k="j21-renvoi-j18">pneumonie bactérienne (J18)</button> atteignent les alvéoles. Le sifflement récidivant de l’enfant d’âge préscolaire relève de l’<button class="w" data-k="j21-renvoi-j45">asthme (J45)</button>.</div>
</section>

<section class="ilot" id="j21-1"><h2><span class="n">1</span>Définition, classifications et codage</h2>
<p>La bronchiolite aiguë est une <b>infection virale des bronchioles</b>, les voies aériennes de moins de 2 mm de diamètre dépourvues de cartilage. Elle touche le nourrisson et le jeune enfant. Le diagnostic est <b>clinique</b>. NICE le pose chez un enfant de moins de 2 ans qui présente un rhume de 1 à 3 jours, puis une toux persistante, une polypnée ou un tirage, et des sibilants ou des crépitants à l’auscultation. La maladie survient surtout pendant la première année de vie, avec un pic entre 3 et 6 mois.</p>
<p>Exemple : un nourrisson de 5 mois a un rhume depuis deux jours, puis tousse, respire à 56 par minute et présente des crépitants fins bilatéraux. Il remplit la définition, même s’il ne siffle pas. Les crépitants fins diffus sont fréquents dans la bronchiolite du nourrisson ; ils ne signifient pas une pneumonie s’ils sont bilatéraux et sans fièvre élevée.</p>
<h3>1.1 Limites de la définition</h3>
<p>Les définitions diffèrent selon les pays. NICE et l’Académie américaine de pédiatrie (2014) incluent l’enfant jusqu’à 2 ans. De nombreux pays européens réservent le terme au premier épisode avant 12 mois. Cette divergence a une conséquence : un enfant de 18 mois qui siffle pour la troisième fois a plus probablement un sifflement viral récidivant ou un asthme débutant qu’une bronchiolite, et il peut répondre aux bronchodilatateurs. NICE oriente vers ces diagnostics en cas de sifflement persistant sans crépitants, d’épisodes récidivants ou d’atopie personnelle ou familiale.</p>
<div class="trap"><span class="k">Piège</span>Le premier épisode sifflant d’un nourrisson de 4 mois et le troisième épisode d’un enfant atopique de 20 mois ne sont pas la même maladie. Appeler les deux « bronchiolite » conduit soit à refuser un bronchodilatateur utile au second, soit à donner un traitement inutile au premier.</div>
<h3>1.2 Gravité</h3>
<p>Il n’existe pas de score de gravité unique validé et adopté en Suisse. La gravité se décrit par trois axes que le médecin mesure à chaque évaluation : le <b>travail respiratoire</b>, l’<b>oxygénation</b> et l’<b>alimentation</b>. Le tableau suivant regroupe ces axes selon les seuils de NICE ; il sert d’aide à la décision et non de critère officiel de classification.</p>
<table class="t"><tr><th>Axe</th><th>Forme légère</th><th>Forme modérée</th><th>Forme sévère</th></tr>
<tr><td>Travail respiratoire</td><td>Tirage absent ou discret</td><td>Fréquence &gt; 60/min, tirage net</td><td>Fréquence &gt; 70/min, geignement, tirage marqué, épuisement</td></tr>
<tr><td>Oxygénation à l’air</td><td>Saturation ≥ 92 %</td><td>Saturation 90 à 92 %</td><td>Saturation &lt; 90 % persistante, cyanose</td></tr>
<tr><td>Alimentation</td><td>&gt; 75 % des apports habituels</td><td>50 à 75 % des apports</td><td>&lt; 50 %, signes de déshydratation</td></tr>
<tr><td>Apnée</td><td>Absente</td><td>Absente</td><td>Observée ou rapportée</td></tr></table>
<p>La lecture se fait par le critère le plus grave : un seul élément de la colonne « sévère » suffit à classer l’enfant comme sévère. Léa a une fréquence de 64/min, une saturation de 91 % et des apports à 50 % : elle est au moins modérée, à la limite du sévère pour l’alimentation. L’erreur fréquente consiste à juger la gravité sur l’intensité des sibilants, alors que les trois axes du tableau prédisent les besoins en soins.</p>
<h3>1.3 Codage CIM-10-GM 2024</h3>
<p>La catégorie J21 se subdivise selon le virus identifié. Le code J22 s’emploie lorsqu’une infection aiguë des voies respiratoires inférieures est établie sans que son siège (bronche, bronchiole, alvéole) soit précisé. Les exclusions évitent de coder deux fois la même maladie.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Usage pratique</th></tr>
<tr><td>J21.0</td><td>Bronchiolite aiguë due au virus respiratoire syncytial</td><td>Virus détecté par un test moléculaire ou antigénique</td></tr>
<tr><td>J21.1</td><td>Bronchiolite aiguë due au métapneumovirus humain</td><td>Virus détecté</td></tr>
<tr><td>J21.8</td><td>Bronchiolite aiguë due à d’autres micro-organismes précisés</td><td>Rhinovirus, virus parainfluenza, adénovirus, par exemple</td></tr>
<tr><td>J21.9</td><td>Bronchiolite aiguë, sans précision</td><td>Situation la plus fréquente en ambulatoire, sans test</td></tr>
<tr><td>J22</td><td>Infection aiguë des voies respiratoires inférieures, sans précision</td><td>Toux aiguë avec signes bas, siège non établi</td></tr></table>
<p>La catégorie J21 inclut la bronchiolite avec bronchospasme. Le bloc J20 à J22 exclut l’infection aiguë d’une bronchopneumopathie chronique obstructive, codée J44.0- ; l’exacerbation est codée J44.1-. J22 exclut l’infection aiguë des voies respiratoires supérieures (J06.9) et l’infection des voies respiratoires sans précision de siège (J98.7). La bronchiolite oblitérante due à l’inhalation de produits chimiques, de gaz ou de fumées est codée J68.4. La bronchite aiguë (J20) est traitée dans le cours J40.</p>
<div class="key"><b>À retenir.</b> La bronchiolite est un diagnostic clinique du nourrisson : rhume, puis toux, polypnée ou tirage, et sibilants ou crépitants. La gravité se juge sur le travail respiratoire, la saturation et l’alimentation. J21 se code selon le virus ; J22 désigne une infection basse dont le siège n’est pas établi. La partie suivante montre pourquoi cette maladie pèse autant sur les hôpitaux pédiatriques suisses.</div>
</section>

<section class="ilot" id="j21-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Le <button class="w" data-k="j21-vrs">virus respiratoire syncytial</button> infecte presque tous les enfants avant 3 ans. Selon l’OFSP, environ deux tiers des enfants sont infectés pendant la première année de vie et 87 % avant 18 mois. L’infection ne laisse qu’une immunité brève, de six mois à deux ans au plus. La réinfection reste donc possible à tout âge, y compris chez l’adulte et le sujet âgé.</p>
<h3>2.1 Saisonnalité suisse</h3>
<p>En Suisse, la saison du virus respiratoire syncytial dure en général de mi-novembre à mi-mars, avec un pic fréquent en janvier. Une saison « majeure » alterne souvent avec une saison « mineure ». L’été 2021 a fait exception : après la levée des mesures contre la COVID-19, de nombreux nourrissons ont été hospitalisés hors saison. Cette exception illustre l’effet de l’<button class="w" data-k="j21-dette">immunité de population sur la date des épidémies</button>.</p>
<h3>2.2 Hospitalisations</h3>
<p>Le virus respiratoire syncytial est le premier motif d’hospitalisation du nourrisson en hiver en Suisse. Pendant les quatre hivers 2015/2016 à 2018/2019, 2,6 % en moyenne des enfants en bas âge ont été hospitalisés pour une infection confirmée à ce virus. La durée moyenne de séjour était de 5,7 jours avant 1 an. Le tableau de l’OFSP, tiré de la statistique médicale des hôpitaux, montre que le risque dépend fortement de l’âge.</p>
<table class="t"><tr><th>Âge</th><th>Hospitalisations pour 1000 enfants, moyenne 2016–2019</th></tr>
<tr><td>Moins de 1 mois</td><td>43</td></tr><tr><td>1 à 2 mois</td><td>51</td></tr><tr><td>3 à 5 mois</td><td>21</td></tr><tr><td>6 à 11 mois</td><td>11</td></tr><tr><td>12 à 23 mois</td><td>4</td></tr></table>
<p>Le risque est maximal pendant les trois premiers mois, puis il diminue d’un facteur dix environ jusqu’à la deuxième année. Ce gradient s’explique par le calibre des bronchioles et la baisse des anticorps maternels (îlot 3). Il justifie que la prévention vise la naissance pour un enfant né en hiver. Le point le plus contre-intuitif est le suivant : <b>plus de 80 % des nourrissons hospitalisés sont des enfants sains nés à terme</b>. Cette proportion tombe à 60 à 75 % pendant la deuxième année de vie, où les comorbidités pèsent davantage.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Croire que la bronchiolite grave concerne surtout les prématurés et les cardiopathes. Ces enfants ont le risque individuel le plus élevé, mais ils sont peu nombreux. La majorité des lits occupés le sont par des nourrissons sains de moins de 3 mois : c’est la raison pour laquelle la Suisse recommande depuis 2024 une immunisation de tous les nourrissons.</div>
<p>Le coût direct moyen d’une hospitalisation pour virus respiratoire syncytial avant 1 an est estimé à 8458 francs, soit environ 18,7 millions de francs par an pour une cohorte de naissance (Stucki, 2022, cité par l’OFSP). La mortalité est faible dans les pays dotés de soins intensifs pédiatriques ; aucun taux suisse récent spécifique à la bronchiolite n’est publié sous une forme directement exploitable.</p>
<div class="key"><b>À retenir.</b> Presque tous les enfants rencontrent le virus respiratoire syncytial avant 3 ans. Le risque d’hospitalisation est maximal avant 3 mois et touche surtout des nourrissons sains. La saison suisse culmine en janvier. La partie suivante explique pourquoi un virus qui donne un rhume à l’adulte obstrue les voies aériennes du nourrisson.</div>
</section>

<section class="ilot" id="j21-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La bronchiolite résulte d’une rencontre entre un virus qui détruit l’épithélium cilié et des voies aériennes de très petit calibre. Chaque maillon de la chaîne explique un signe clinique et justifie, ou invalide, un traitement.</p>
<h3>3.1 État normal</h3>
<p>Les bronchioles sont tapissées d’un épithélium cilié qui fait remonter le mucus vers la trachée. Elles n’ont pas de cartilage : leur calibre dépend de la traction élastique du poumon qui les entoure. Chez le nourrisson, une bronchiole terminale mesure quelques dixièmes de millimètre. Selon la <button class="w" data-k="j21-poiseuille">loi de Poiseuille</button>, la résistance à l’écoulement varie comme l’inverse du rayon à la puissance quatre. Un épaississement de paroi de 0,1 mm, banal chez l’adulte, réduit fortement la lumière du nourrisson et multiplie sa résistance.</p>
<h3>3.2 Première charnière : infection et nécrose de l’épithélium</h3>
<p>Le virus pénètre par le nez et la conjonctive, se multiplie dans le rhinopharynx pendant 2 à 8 jours d’incubation, puis descend vers les bronchioles. Sa <button class="w" data-k="j21-protf">protéine de fusion F</button> fusionne l’enveloppe virale avec la cellule ciliée, puis les cellules entre elles, ce qui forme des <b>syncytia</b> qui ont donné son nom au virus. Les cellules ciliées infectées meurent et se détachent dans la lumière.</p>
<h3>3.3 Deuxième charnière : bouchons et œdème</h3>
<p>La lumière se remplit de cellules mortes, de fibrine et de mucus produit en excès. La sous-muqueuse est infiltrée de lymphocytes et devient œdémateuse. La clairance mucociliaire disparaît, car les cils ont été détruits. Le résultat est une <b>obstruction mécanique</b> par des bouchons, et non une contraction du muscle lisse. C’est la raison principale de l’<button class="w" data-k="j21-bd-inefficace">inefficacité des bronchodilatateurs</button>, qui n’agissent que sur le muscle.</p>
<h3>3.4 Troisième charnière : piégeage et atélectasies</h3>
<p>Un bouchon partiel laisse entrer l’air à l’inspiration, quand la bronchiole se dilate, mais le retient à l’expiration, quand elle se rétrécit. Ce mécanisme de clapet provoque une <b>distension thoracique</b> et des sibilants. Un bouchon complet laisse l’air distal se résorber : une <b>atélectasie</b> apparaît. Le nourrisson possède peu de <button class="w" data-k="j21-collat">voies de ventilation collatérale</button>, si bien qu’une bronchiole bouchée ne peut pas être contournée.</p>
<h3>3.5 Quatrième charnière : hypoxémie et travail respiratoire</h3>
<p>Les zones atélectasiées ou mal ventilées restent perfusées. Le sang qui les traverse ne s’oxygène pas : c’est une <button class="w" data-k="j21-vq">inégalité ventilation-perfusion</button>, qui explique la baisse de la saturation. La résistance accrue et la distension imposent un travail respiratoire élevé. La cage thoracique du nourrisson est souple et ses côtes horizontales : les muscles inspiratoires creusent les espaces intercostaux au lieu d’expandre le thorax, ce qui se voit comme un <b>tirage</b>. Le diaphragme travaille en position aplatie, peu efficace, et s’épuise.</p>
<h3>3.6 Cinquième charnière : alimentation, apnée et déshydratation</h3>
<p>Le nourrisson respire préférentiellement par le nez. Un nez encombré augmente donc à lui seul le travail respiratoire. Téter exige de coordonner succion, déglutition et respiration ; au-delà d’environ 60 respirations par minute, cette coordination échoue et l’enfant boit moins. La polypnée augmente aussi les pertes insensibles d’eau. Avant 6 semaines, et chez l’ancien prématuré, le virus peut provoquer des <button class="w" data-k="j21-apnee">apnées</button>, parfois avant tout signe respiratoire ; leur mécanisme exact reste incomplètement élucidé.</p>

<p>La figure se lit de gauche à droite. La rangée du haut donne la chaîne causale ; les coupes du bas montrent la conséquence mécanique sur une bronchiole. Le point à retenir est l’absence de rôle central du muscle lisse : le bouchon et l’œdème, non le spasme, réduisent la lumière.</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> Le bouchon ne cède qu’avec la régénération de l’épithélium, qui demande plusieurs jours. Le traitement soutient donc les fonctions menacées pendant ce délai : l’oxygène corrige l’inégalité ventilation-perfusion, la sonde gastrique ou la perfusion compense l’échec de la tétée, la désobstruction nasale réduit la résistance du nez. Le bronchodilatateur et le corticoïde ne raccourcissent pas la maladie, car ils ne visent ni le bouchon ni la nécrose.</div>
<div class="key"><b>À retenir.</b> Le virus détruit l’épithélium cilié des bronchioles ; débris, mucus et œdème forment des bouchons. Le petit calibre du nourrisson transforme ces bouchons en obstruction, en distension et en hypoxémie. La partie suivante identifie les virus responsables et les enfants qui risquent une forme grave.</div>
</section>

<section class="ilot" id="j21-4"><h2><span class="n">4</span>Virus en cause et facteurs de risque</h2>
<p>Le virus respiratoire syncytial est la cause principale, et la plus grave, de bronchiolite du nourrisson. D’autres virus produisent le même tableau. La distinction a peu d’effet sur le traitement, mais elle compte pour l’isolement hospitalier, la surveillance épidémiologique et le codage.</p>
<h3>4.1 Agents</h3>
<p>Le <button class="w" data-k="j21-vrs">virus respiratoire syncytial</button> (sous-groupes A et B) domine en hiver. Le <button class="w" data-k="j21-hmpv">métapneumovirus humain</button>, de la même famille, survient un peu plus tard dans la saison. Le <b>rhinovirus</b> circule toute l’année ; une bronchiolite à rhinovirus chez un enfant atopique annonce plus souvent un sifflement récidivant. Les <b>virus parainfluenza</b> (type 3 surtout), l’<button class="w" data-k="j21-adeno">adénovirus</button>, les virus de la grippe, le SARS-CoV-2 et le bocavirus complètent la liste. Les co-infections sont fréquentes lorsque des panels moléculaires larges sont utilisés ; la détection d’un virus ne prouve pas qu’il cause à lui seul la maladie.</p>
<h3>4.2 Facteurs de risque de forme grave</h3>
<p>NICE retient six facteurs qui doivent abaisser le seuil d’hospitalisation. L’OFSP y ajoute les facteurs d’hospitalisation identifiés en Suisse par Stucki et collaborateurs (2023). Le tableau les regroupe selon leur mécanisme.</p>
<table class="t"><tr><th>Facteur</th><th>Mécanisme du risque</th></tr>
<tr><td>Âge &lt; 3 mois ; naissance entre octobre et mars</td><td>Bronchioles plus étroites ; première saison vécue au plus jeune âge</td></tr>
<tr><td>Prématurité, surtout &lt; 32 semaines ; faible poids de naissance</td><td>Moins d’anticorps maternels transmis, poumon immature</td></tr>
<tr><td>Dysplasie bronchopulmonaire, mucoviscidose, malformation pulmonaire</td><td>Réserve ventilatoire faible, clairance altérée</td></tr>
<tr><td>Cardiopathie congénitale avec retentissement hémodynamique, hypertension pulmonaire</td><td>L’hypoxie aggrave la résistance vasculaire pulmonaire</td></tr>
<tr><td>Maladie neuromusculaire ou neurologique</td><td>Toux et déglutition inefficaces, fatigue musculaire</td></tr>
<tr><td>Immunodéficience, syndrome de Down</td><td>Excrétion virale prolongée ; voies aériennes et tonus anormaux dans la trisomie 21</td></tr></table>
<p>Le tableau se lit en deux temps. Un facteur présent abaisse le seuil d’admission, mais ne la décide pas seul. L’absence de tout facteur ne rassure pas devant un nourrisson de 6 semaines : l’âge seul suffit à justifier une surveillance étroite. L’OFSP mentionne également la naissance multiple, la maladie hépatique, l’hémophilie, l’insuffisance rénale et une carence sévère en vitamine D parmi les facteurs suisses d’hospitalisation.</p>
<p>Les facteurs liés à l’environnement comptent aussi. Le tabagisme dans le foyer aggrave les symptômes ; NICE demande de le déconseiller explicitement. La fratrie en crèche augmente l’exposition. La capacité des parents à surveiller l’enfant, la distance au service d’urgence et la situation sociale entrent dans la décision d’hospitaliser.</p>
<div class="key"><b>À retenir.</b> Le virus respiratoire syncytial domine ; le métapneumovirus et le rhinovirus suivent. L’âge inférieur à 3 mois, la prématurité, les maladies cardiaques, pulmonaires, neuromusculaires et l’immunodéficience augmentent le risque de forme grave. L’anamnèse doit les rechercher systématiquement.</div>
</section>

<section class="ilot" id="j21-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse établit le profil temporel typique, mesure l’alimentation, recherche les apnées et identifie les facteurs de risque. Elle permet aussi d’écarter un autre diagnostic.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Naissance et terrain</h4><p>Le médecin note le terme et le poids de naissance, car la <button class="w" data-k="j21-premat">prématurité</button> augmente le risque d’apnée et de forme grave. Il recherche une cardiopathie, une maladie pulmonaire chronique, une maladie neuromusculaire, une immunodéficience et une trisomie 21. Il demande le mois de naissance et l’état de l’<button class="w" data-k="j21-immunisation">immunisation contre le virus respiratoire syncytial (anticorps ou vaccin maternel)</button>.</p></div>
<div class="card"><h4>Entourage et épisodes antérieurs</h4><p>Il interroge sur la fratrie, la crèche et les personnes enrhumées. Il recherche le tabagisme au foyer. Il note les épisodes sifflants antérieurs, la dermatite atopique et l’asthme des parents, qui orientent vers un <button class="w" data-k="j21-sifflrec">sifflement récidivant ou un asthme débutant</button> plutôt que vers une bronchiolite.</p></div></div>
<h3>5.2 Symptômes, dans leur ordre d’apparition</h3>
<p><b>Rhinorrhée et obstruction nasale</b> — Elles précèdent la toux de 1 à 3 jours. Elles traduisent la multiplication du virus dans le rhinopharynx avant sa descente.</p>
<p><b>Toux</b> — Elle devient persistante quand les bronchioles sont atteintes. Les symptômes culminent entre le troisième et le cinquième jour ; la toux disparaît chez 90 % des nourrissons en trois semaines (NICE).</p>
<p><b>Difficulté à respirer</b> — Les parents décrivent une respiration rapide, un creusement sous les côtes ou un sifflement.</p>
<p><b>Difficulté à boire</b> — Elle apparaît typiquement entre le troisième et le cinquième jour. Le médecin la chiffre : quelle fraction des biberons ou des tétées habituels l’enfant prend-il ? <button class="w" data-k="j21-apports">Des apports entre 50 et 75 % de l’habituel</button> sont un critère d’hospitalisation selon NICE, à pondérer par les facteurs de risque. Le nombre de couches mouillées estime la diurèse.</p>
<p><b>Fièvre</b> — Elle est présente dans environ 30 % des cas et reste habituellement inférieure à 39 °C. Une <button class="w" data-k="j21-fievre">fièvre supérieure à 39 °C</button> ou des crépitants localisés persistants doivent faire évoquer une pneumonie.</p>
<p><b>Apnées</b> — Le médecin demande explicitement si l’enfant a cessé de respirer, a changé de couleur ou est devenu mou. Chez le nourrisson de moins de 6 semaines, l’apnée peut être le seul signe.</p>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Nourrisson de 2 à 6 mois en hiver, rhume de deux jours, puis toux, polypnée, tirage et crépitants fins ou sibilants. Évolution maximale au troisième à cinquième jour, puis amélioration.</p></div>
<div class="card"><h4>Nourrisson de moins de 6 semaines</h4><p>Apnées, pâleur, malaise, refus de boire, parfois sans toux ni tirage. Il doit être évalué en milieu hospitalier, car l’apnée peut récidiver sans prodrome.</p></div>
<div class="card"><h4>Forme fébrile avec signes en foyer</h4><p>Fièvre &gt; 39 °C, crépitants localisés persistants : la pneumonie, virale ou bactérienne, devient le diagnostic à exclure.</p></div>
<div class="card"><h4>Enfant de plus de 1 an qui récidive</h4><p>Sibilants sans crépitants, épisodes répétés, atopie : il s’agit plus probablement d’un sifflement viral ou d’un asthme ; un bronchodilatateur d’épreuve se discute.</p></div></div>
<div class="trap"><span class="k">Piège</span>La coqueluche du jeune nourrisson donne aussi des apnées et une toux, mais sans sibilants ni crépitants, avec des quintes suivies de cyanose. Une hyperlymphocytose et un contage adulte avec toux prolongée orientent vers elle ; la PCR sur aspiration nasopharyngée confirme.</div>
</section>

<section class="ilot" id="j21-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen mesure les trois axes de gravité. Il se fait sur un enfant calme, si possible après <b>désobstruction nasale</b>, car un nez encombré augmente la fréquence respiratoire et peut faire surestimer la gravité. Le médecin compte la fréquence respiratoire sur une minute entière, car la respiration du nourrisson est irrégulière.</p>
<h3>6.1 Valeurs normales d’abord</h3>
<p>Le tableau donne les seuils de polypnée de l’Organisation mondiale de la santé, utilisés pour la toux de l’enfant. Ils permettent de qualifier une fréquence mesurée.</p>
<table class="t"><tr><th>Âge</th><th>Polypnée si fréquence respiratoire ≥</th></tr>
<tr><td>Moins de 2 mois</td><td>60/min</td></tr><tr><td>2 à 11 mois</td><td>50/min</td></tr><tr><td>12 à 59 mois</td><td>40/min</td></tr></table>
<p>Une fréquence de 64/min chez Léa, âgée de 3 mois, dépasse le seuil de 50/min ; elle dépasse aussi le seuil de 60/min auquel NICE recommande d’envisager une orientation vers l’hôpital. À plus de 70/min, NICE considère la détresse comme sévère. La fièvre accélère la respiration : une mesure refaite après l’antipyrétique évite une surestimation.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin juge l’éveil, le tonus, le contact et les pleurs. Un enfant qui ne réagit plus normalement aux sollicitations est <button class="w" data-k="j21-epuisement">épuisé</button>. Il mesure la fréquence respiratoire, la fréquence cardiaque, la température et la <button class="w" data-k="j21-oxymetrie">saturation pulsée en oxygène</button> chez tout enfant suspect de bronchiolite. Il pèse l’enfant, car le poids sert aux apports hydriques et le compare au poids récent pour estimer la déshydratation.</p></div>
<div class="card"><h4>Travail respiratoire</h4><p>Le médecin observe le <button class="w" data-k="j21-tirage">tirage (sous-costal, intercostal, sus-sternal)</button>, le battement des ailes du nez, le <button class="w" data-k="j21-geignement">geignement expiratoire</button>, le balancement thoraco-abdominal et le hochement de tête. La cyanose centrale est un signe tardif.</p></div>
<div class="card"><h4>Auscultation</h4><p>Il entend des <button class="w" data-k="j21-crepitants">crépitants fins bilatéraux</button>, des sibilants, ou les deux. Les bruits varient d’une minute à l’autre avec les bouchons mobiles. Un silence auscultatoire chez un enfant en détresse traduit une ventilation très réduite.</p></div>
<div class="card"><h4>Hydratation et diagnostics alternatifs</h4><p>Il recherche une fontanelle déprimée, des muqueuses sèches, un temps de recoloration allongé et une diurèse réduite. Il cherche un souffle cardiaque, une hépatomégalie et des pouls fémoraux faibles, qui orientent vers une cardiopathie. Il examine les tympans : l’otite moyenne aiguë accompagne souvent la bronchiolite.</p></div></div>
<div class="trap"><span class="k">Piège</span>Le foie du nourrisson distendu est abaissé par le diaphragme et paraît augmenté. Une flèche hépatique normale à la percussion, et l’absence de souffle et de galop, distinguent cette fausse hépatomégalie d’une insuffisance cardiaque.</div>
<div class="key"><b>À retenir.</b> Le médecin désobstrue le nez, puis compte la fréquence respiratoire sur une minute, mesure la saturation, cherche le geignement, le tirage et l’épuisement, et chiffre l’hydratation. Un examen normal entre deux épisodes de toux ne rassure pas chez un nourrisson de moins de 6 semaines, car l’apnée peut survenir sans signe préalable.</div>
