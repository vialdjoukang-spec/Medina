<section class="ilot" id="j69-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 78 ans vit en établissement médico-social. Il a une maladie de Parkinson depuis neuf ans et tousse pendant les repas depuis trois mois. Il reçoit de l’amiodarone, 200 mg par jour depuis deux ans, pour une fibrillation auriculaire, et de la quétiapine le soir. Cette nuit, il a vomi en position couchée. Ce matin, il respire à 26 cycles par minute, sa température atteint 38,3 °C et sa SpO₂ vaut 89 % à l’air ambiant. Le médecin entend des crépitants à la base droite.</p>
<p>Le même tableau peut relever de trois mécanismes différents. Le liquide gastrique acide peut brûler chimiquement les alvéoles en quelques heures. Des sécrétions buccales colonisées peuvent provoquer une pneumonie bactérienne en quelques jours. L’amiodarone peut léser le poumon de façon progressive sur des mois. <b>La question qui structure le chapitre est donc : quel agent externe a atteint le poumon, par quelle voie, avec quelle gravité, et quel traitement découle de ce mécanisme ?</b></p>
<p>À la fin du chapitre, le médecin assistant distingue la <button class="w" data-k="j69-pnchim">pneumopathie chimique d’aspiration (lésion acide sans infection)</button> de la <button class="w" data-k="j69-pnasp">pneumonie d’aspiration (infection après aspiration)</button>. Il reconnaît une atteinte par gaz, fumées ou vapeurs et traite d’abord le monoxyde de carbone et le cyanure. Il suspecte une <button class="w" data-k="j69-diild">pneumopathie médicamenteuse (critères d’imputabilité)</button> devant toute opacité nouvelle sous traitement. Il connaît la <button class="w" data-k="j69-radique">pneumopathie radique (chronologie et champ d’irradiation)</button> et la lésion pulmonaire liée au vapotage.</p>
<div class="key"><b>Message fondateur.</b> Dans ce chapitre, le diagnostic repose d’abord sur l’exposition. L’imagerie et la biologie sont peu spécifiques. Seule la chronologie entre l’agent et les symptômes oriente vers la bonne cause, et donc vers le bon traitement. Une antibiothérapie ne soigne ni une brûlure chimique, ni une toxicité médicamenteuse, ni une pneumopathie radique.</div>
<div class="key"><b>Prérequis.</b> Le médecin assistant gagne à revoir la <button class="w" data-k="j69-deglut">déglutition et la protection des voies aériennes</button>, la <button class="w" data-k="j69-solub">solubilité des gaz irritants (site de la lésion)</button> et la liaison du <button class="w" data-k="j69-co">monoxyde de carbone à l’hémoglobine</button>. L’onglet Sciences fondamentales développe ces notions. La pneumonie communautaire en général est traitée dans <a href="#/entry/J18">J18 — Pneumonie à micro-organisme non précisé (P-02-Pneumologie)</a>.</div>
</section>

<section class="ilot" id="j69-1"><h2><span class="n">1</span>Définitions, classification et codage</h2>
<p>Les trois catégories J68, J69 et J70 forment le bloc « Maladies du poumon dues à des agents externes » de la CIM-10-GM 2024, à côté des pneumoconioses (J60 à J66) et des alvéolites allergiques (J67). Leur point commun est une cause extérieure identifiable. Le codage impose d’ajouter, au besoin, un code de cause externe du chapitre des causes externes (chapitre 20). Ce code supplémentaire rappelle que l’agent doit être nommé, et pas seulement l’atteinte pulmonaire.</p>
<h3>1.1 Trois conséquences de l’aspiration</h3>
<p>L’aspiration désigne l’entrée dans le larynx et l’arbre trachéobronchique de contenu oropharyngé ou gastrique. Elle produit trois tableaux distincts, qui coexistent parfois chez le même patient. La distinction importe, car seul le deuxième relève d’un antibiotique.</p>
<table class="t"><tr><th>Tableau</th><th>Matériel aspiré</th><th>Délai d’apparition</th><th>Mécanisme principal</th><th>Conséquence thérapeutique</th></tr>
<tr><td>Pneumopathie chimique</td><td>Liquide gastrique acide, en grand volume</td><td>Quelques heures</td><td>Brûlure acide de l’épithélium et de l’endothélium</td><td>Soins de soutien ; pas d’antibiotique systématique</td></tr>
<tr><td>Pneumonie d’aspiration</td><td>Sécrétions oropharyngées colonisées</td><td>Un à plusieurs jours</td><td>Infection bactérienne d’une région déclive</td><td>Antibiothérapie, puis prévention de la récidive</td></tr>
<tr><td>Obstruction des voies aériennes</td><td>Aliment solide, corps étranger</td><td>Immédiat</td><td>Occlusion bronchique, atélectasie en aval</td><td>Désobstruction, bronchoscopie</td></tr></table>
<p>Le premier réflexe de lecture porte sur le délai. Une dyspnée apparue deux heures après un vomissement chez un patient sédaté évoque une lésion chimique. Une fièvre apparue au troisième jour chez un patient qui tousse pendant les repas évoque une infection. L’erreur fréquente consiste à traiter la première comme la seconde. Chez le patient de l’îlot 0, le vomissement nocturne et la toux chronique aux repas rendent les deux mécanismes possibles.</p>
<h3>1.2 Définition retenue de la pneumonie d’aspiration</h3>
<p>La Société de pathologie infectieuse de langue française (<button class="w" data-k="j69-spilf">SPILF 2025, recommandation de référence</button>) exige deux éléments. Il faut un diagnostic positif de pneumonie, et un argument étiologique présomptif d’aspiration. Une pneumopathie chimique aiguë ne remplit pas cette définition. Cette règle protège contre l’antibiothérapie automatique de toute « fausse route ».</p>
<h3>1.3 Inventaire des codes CIM-10-GM 2024</h3>
<p>Le tableau suivant répond à une question pratique : quel code correspond à quelle situation clinique ? Il reprend chaque sous-code du BfArM, vérifié le 08.10.2026.</p>

<p>Trois exclusions du BfArM évitent des erreurs de codage. Le syndrome de Mendelson, c’est-à-dire l’aspiration de contenu gastrique pendant une anesthésie, se code J95.4. Les syndromes d’aspiration du nouveau-né se codent dans P24. La lésion pulmonaire liée à la cigarette électronique possède son propre code, U07.0, défini par le BfArM comme une atteinte liée au vapotage, avec infiltrats et infection improbable ou exclue. L’intoxication systémique par le monoxyde de carbone se code en outre T58, et celle par d’autres émanations T59.</p>
<div class="trap"><span class="k">Piège</span>Le code J69.0 ne prouve pas une infection bactérienne. Il décrit le matériel aspiré. Le médecin écrit donc dans le dossier s’il traite une pneumopathie chimique ou une pneumonie infectée, car la décision antibiotique en dépend.</div>
<h3>1.4 Limites avec les cours voisins</h3>
<p>Ce chapitre traite l’atteinte due à l’agent externe. Les maladies voisines sont développées ailleurs pour éviter les doublons. La pneumonie communautaire et ses germes relèvent de <a href="#/entry/J18">J18 — Pneumonie à micro-organisme non précisé (P-02-Pneumologie)</a>. Les pneumopathies interstitielles idiopathiques et les éosinophilies pulmonaires relèvent de <a href="#/entry/J84">J84 — Autres affections pulmonaires interstitielles (P-02-Pneumologie)</a>. L’abcès compliquant une aspiration relève de <a href="#/entry/J85">J85 — Abcès du poumon et du médiastin (P-02-Pneumologie)</a>. Le syndrome de détresse respiratoire aiguë relève de <a href="#/entry/J80">J80 — Syndrome de détresse respiratoire aiguë (P-02-Pneumologie)</a>. L’asthme professionnel de sensibilisation relève de <a href="#/entry/J45">J45 — Asthme (P-02-Pneumologie)</a>.</p>
<div class="key"><b>À retenir.</b> Le bloc J68–J70 se définit par l’agent externe : gaz et fumées (J68), liquides et solides aspirés (J69), rayonnements et médicaments (J70). Pour l’aspiration, le délai et le matériel aspiré séparent la lésion chimique de l’infection. La partie suivante mesure la fréquence de ces situations.</div>
</section>

<section class="ilot" id="j69-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Les chiffres de ce chapitre proviennent de populations différentes et ne s’additionnent pas. Ils renseignent pourtant sur la probabilité de chaque cause devant un patient donné.</p>
<h3>2.1 Aspiration</h3>
<p>La pneumonie d’aspiration concerne surtout le sujet âgé dépendant. Dans une cohorte espagnole de 134 patients âgés hospitalisés pour pneumonie, 55 % avaient une dysphagie oropharyngée ; ce groupe était plus âgé, vivait plus souvent en institution et avait une mortalité à 30 jours plus élevée. Selon la British Thoracic Society, une aspiration a été retrouvée chez 71 % des sujets âgés atteints de pneumonie, contre 10 % des témoins. La proportion exacte de pneumonies d’aspiration parmi les pneumonies communautaires varie selon la définition retenue ; aucune donnée suisse spécifique n’est publiée.</p>
<p>La pneumopathie chimique est plus rare. Dans les séries hospitalières citées par Niederman et Cilloniz (2022), environ 16 % des patients atteints de pneumopathie chimique ont évolué vers un syndrome de détresse respiratoire aiguë. Ce chiffre explique la surveillance rapprochée des premières heures.</p>
<h3>2.2 Intoxications par inhalation en Suisse</h3>
<p>En 2024, Tox Info Suisse a fourni 42 782 consultations, dont 35 606 concernaient une exposition humaine. Les produits domestiques représentaient 8 492 cas, soit 23,8 %, et les produits techniques et industriels 2 243 cas, soit 6,3 %. Le rapport ne ventile pas la voie inhalatoire ; la part des intoxications respiratoires n’est donc pas chiffrable à partir de cette source. Le mélange d’eau de Javel avec un acide ou un produit ammoniaqué reste un scénario domestique classique. L’incendie en espace clos expose en même temps à la chaleur, aux irritants, au monoxyde de carbone et au cyanure.</p>
<h3>2.3 Médicaments et rayonnements</h3>
<p>Les pneumopathies interstitielles médicamenteuses représentent 3 à 5 % de toutes les pneumopathies interstitielles, avec une incidence de 4,1 à 12,4 par million d’habitants et par an ; les anticancéreux en causent 23 à 51 % (Conte et al., 2022). Pour les <button class="w" data-k="j69-ici">inhibiteurs de points de contrôle immunitaire (mécanisme et toxicités)</button>, la SITC rapporte une pneumopathie chez 4 % des patients sous anti-PD-1 ou anti-PD-L1, et chez 7 % sous association. Une série hospitalière a toutefois mesuré 19 % en pratique courante. Le trastuzumab déruxtécan a provoqué une pneumopathie interstitielle chez 15,4 % des 1150 patients d’une analyse poolée, mortelle chez 2,2 %.</p>
<p>Pour l’amiodarone, les séries anciennes rapportaient des incidences très élevées ; les séries récentes, avec des doses d’entretien plus faibles, rapportent 1,6 à 2,9 %. La toxicité aiguë de la nitrofurantoïne survient chez environ un patient sur 5000 après une première exposition. Après radiothérapie thoracique conventionnelle d’un cancer bronchique, QUANTEC indique que le respect des contraintes de dose maintient le risque de pneumopathie symptomatique à environ 20 % au plus.</p>
<h3>2.4 Vapotage</h3>
<p>L’épidémie américaine de lésions pulmonaires liées au vapotage (<button class="w" data-k="j69-evali">EVALI (définition et cause)</button>) a culminé en 2019. Au 18 février 2020, le CDC comptait 2807 cas hospitalisés ou décès, dont 68 décès. Parmi 573 patients documentés, 76 % avaient utilisé un produit contenant du THC. Aucune série suisse comparable n’est publiée.</p>
<div class="key"><b>À retenir.</b> L’aspiration domine chez le sujet âgé dysphagique. Les toxicités médicamenteuses augmentent avec les traitements anticancéreux modernes. Les intoxications par fumées restent rares mais immédiatement graves. La partie suivante explique pourquoi le même poumon répond différemment à chaque agent.</div>
</section>

<section class="ilot" id="j69-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Chaque agent externe lèse le poumon par un mécanisme propre. Comprendre ce mécanisme permet de prévoir le délai, le siège et le traitement.</p>
<h3>3.1 État normal : quatre barrières</h3>
<p>Chez le sujet sain, la déglutition ferme le larynx pendant environ une demi-seconde. L’épiglotte bascule, les cordes vocales se ferment et la respiration s’interrompt. Si une petite quantité franchit les cordes vocales, la toux réflexe l’expulse. L’escalator mucociliaire et les macrophages alvéolaires éliminent ensuite le reste. Des microaspirations surviennent pendant le sommeil profond chez 45 % des sujets sains d’une petite étude isotopique de 20 volontaires (Huxley, 1978). Elles restent sans conséquence, parce que le volume est faible et que les défenses sont intactes.</p>
<h3>3.2 Première charnière : la défaillance de la protection</h3>
<p>Une aspiration devient pathologique lorsque le volume, l’acidité ou la charge bactérienne dépassent les défenses. Les trois facteurs se combinent : un trouble de conscience supprime la toux, une <button class="w" data-k="j69-dysph">dysphagie oropharyngée (dépistage et bilan)</button> laisse passer des liquides, une mauvaise hygiène buccale augmente la charge bactérienne de la salive. La maladie de Parkinson du patient de l’îlot 0 ralentit le réflexe de déglutition, et la quétiapine du soir diminue la vigilance.</p>
<h3>3.3 Deuxième charnière : le type de matériel décide de la lésion</h3>
<p>Le liquide gastrique acide détruit l’épithélium alvéolaire en quelques minutes. Une réaction inflammatoire riche en polynucléaires neutrophiles suit en quelques heures. L’œdème alvéolaire qui en résulte fait chuter la PaO₂. Les sécrétions oropharyngées colonisées apportent au contraire des bactéries ; l’infection se constitue en un à plusieurs jours. Une huile minérale, enfin, n’est pas dégradée par les macrophages ; elle entretient une inflammation chronique à corps étranger, qui définit la <button class="w" data-k="j69-lipid">pneumonie lipidique exogène (huiles, paraffine)</button>.</p>
<figure><svg viewBox="0 0 400 360" role="img" aria-label="Chaîne physiopathologique de l’aspiration" font-family="Inter,sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="1.3"><rect x="10" y="8" width="380" height="50" rx="5"/><path d="M200 58v18m-5-6l5 6 5-6"/><rect x="10" y="76" width="380" height="50" rx="5"/><path d="M200 126v14M66 140h268M66 140v18M200 140v18M334 140v18"/><rect x="6" y="158" width="122" height="110" rx="5"/><rect x="139" y="158" width="122" height="110" rx="5"/><rect x="272" y="158" width="122" height="110" rx="5"/><path d="M66 268v18M200 268v18M334 268v18"/><rect x="6" y="286" width="122" height="62" rx="5"/><rect x="139" y="286" width="122" height="62" rx="5"/><rect x="272" y="286" width="122" height="62" rx="5"/></g><g fill="#222" text-anchor="middle"><text x="200" y="28">1. Normal : fermeture laryngée,</text><text x="200" y="46">toux, clairance, macrophages</text><text x="200" y="96">2. Défaillance : dysphagie, conscience,</text><text x="200" y="114">reflux, hygiène buccale</text><text x="67" y="180">Liquide</text><text x="67" y="197">gastrique</text><text x="67" y="214">acide</text><text x="67" y="240">heures</text><text x="200" y="180">Salive</text><text x="200" y="197">colonisée</text><text x="200" y="240">jours</text><text x="334" y="180">Solide,</text><text x="334" y="197">huile</text><text x="334" y="240">minutes à mois</text><text x="67" y="308">Pneumopathie</text><text x="67" y="326">chimique</text><text x="200" y="308">Pneumonie</text><text x="200" y="326">d’aspiration</text><text x="334" y="308">Obstruction ou</text><text x="334" y="326">lipidique</text></g></svg><figcaption>Figure 1 — Aspiration : du normal à trois lésions. La ligne 1 décrit les défenses normales, la ligne 2 leur défaillance, puis la nature du matériel aspiré décide du délai et du type de lésion.</figcaption></figure>
<p>La figure se lit de haut en bas. Le médecin identifie d’abord la barrière défaillante, qui guide la prévention. Il identifie ensuite le matériel aspiré, qui guide le traitement. Chez le patient de l’îlot 0, le vomissement nocturne pointe vers la colonne de gauche, la toux chronique aux repas vers la colonne centrale.</p>
<h3>3.4 Troisième charnière : gaz, fumées et vapeurs</h3>
<p>Un gaz irritant lèse la muqueuse là où il se dissout. Les gaz très hydrosolubles, comme l’ammoniac, se dissolvent dans l’eau du nez, du pharynx et du larynx ; ils provoquent une douleur immédiate qui pousse à fuir. Les gaz peu hydrosolubles, comme le phosgène ou le dioxyde d’azote, n’irritent presque pas les voies supérieures. Ils atteignent les bronchioles et les alvéoles et provoquent un œdème lésionnel retardé, parfois après plusieurs heures de latence.</p>
<figure><svg viewBox="0 0 400 300" role="img" aria-label="Siège de la lésion selon la solubilité du gaz" font-family="Inter,sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="1.3"><path d="M40 20v70M60 20v70M40 90l-20 70M60 90l20 70M20 160l-12 60M80 160l12 60"/><circle cx="8" cy="232" r="10"/><circle cx="92" cy="232" r="10"/><path d="M110 50h20M110 128h20M110 232h20"/></g><g fill="#222"><text x="138" y="40">Très hydrosolubles</text><text x="138" y="56">(ammoniac, acide chlorhydrique) :</text><text x="138" y="72">nez, larynx, trachée ; alerte immédiate</text><text x="138" y="120">Solubilité intermédiaire (chlore) :</text><text x="138" y="136">trachée et bronches</text><text x="138" y="220">Peu hydrosolubles (phosgène,</text><text x="138" y="236">dioxyde d’azote) : bronchioles et</text><text x="138" y="252">alvéoles ; œdème retardé</text><text x="20" y="290">Voies aériennes, du haut vers les alvéoles</text></g></svg><figcaption>Figure 2 — La solubilité dans l’eau fixe le siège de la lésion. Plus le gaz est soluble, plus la lésion est haute et l’alerte précoce ; un gaz peu soluble atteint les alvéoles sans signal d’alarme.</figcaption></figure>
<p>La conséquence pratique est contre-intuitive. Un patient exposé à un gaz peu soluble peut paraître bien à l’arrivée et développer un œdème pulmonaire quelques heures plus tard. C’est pourquoi l’exposition à ces gaz justifie une surveillance prolongée même sans symptôme initial. Les fumées d’incendie ajoutent deux <button class="w" data-k="j69-asphyx">asphyxiants systémiques (monoxyde de carbone, cyanure)</button> qui ne lèsent pas le poumon mais bloquent le transport ou l’utilisation de l’oxygène.</p>
<h3>3.5 Quatrième charnière : médicaments et rayonnements</h3>
<p>Les médicaments lèsent le poumon par trois voies. Certains sont directement cytotoxiques, par formation de radicaux libres, comme la bléomycine et la nitrofurantoïne. D’autres déclenchent une réaction immunitaire, comme le méthotrexate ou les inhibiteurs de points de contrôle immunitaire. L’amiodarone s’accumule dans les macrophages et les pneumocytes de type II sous forme de complexes phospholipidiques ; cette phospholipidose marque l’exposition, et une composante immunitaire s’y ajoute chez certains patients.</p>
<p>Les rayonnements ionisants lèsent l’ADN des cellules endothéliales et des pneumocytes de type II. Des cytokines comme l’IL-1, l’IL-6 et le TNF-α sont libérées dans les deux semaines ; le TGF-β s’exprime vers six à huit semaines. La pneumopathie radique devient symptomatique surtout entre trois et douze semaines après la radiothérapie. La fibrose s’installe ensuite sur des mois, dans le volume irradié.</p>
<div class="key"><b>À retenir.</b> L’acide brûle en heures, la salive infecte en jours, l’huile inflamme en mois. Un gaz soluble lèse haut et alerte vite ; un gaz peu soluble lèse les alvéoles avec retard. Les médicaments agissent par toxicité directe, immunité ou accumulation ; les rayonnements lèsent l’ADN, puis induisent une fibrose. La partie suivante recense les agents en cause.</div>
</section>

<section class="ilot" id="j69-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<h3>4.1 Facteurs d’aspiration</h3>
<p>Le risque d’aspiration se raisonne barrière par barrière. Le tableau répond à la question : quelle défense est altérée, et comment la corriger ?</p>
<table class="t"><tr><th>Barrière altérée</th><th>Situations</th><th>Correction possible</th></tr>
<tr><td>Vigilance et toux</td><td>Sédatifs, opioïdes, antipsychotiques, alcool, épilepsie, anesthésie</td><td>Réduire les sédatifs, surveiller après une anesthésie</td></tr>
<tr><td>Déglutition</td><td>Accident vasculaire cérébral, maladie de Parkinson, démence, sclérose latérale amyotrophique, cancer de la tête et du cou</td><td>Dépistage de la dysphagie, adaptation des textures</td></tr>
<tr><td>Barrière œsophagienne et gastrique</td><td>Reflux, occlusion intestinale, gastroparésie, sonde nasogastrique</td><td>Position demi-assise, vidange gastrique</td></tr>
<tr><td>Charge bactérienne</td><td>Mauvaise hygiène bucco-dentaire, maladie parodontale</td><td>Soins de bouche quotidiens</td></tr></table>
<p>La lecture commence par la colonne « Barrière altérée ». Un patient cumule souvent plusieurs barrières. Le patient de l’îlot 0 en cumule trois : déglutition (Parkinson), vigilance (quétiapine) et barrière gastrique (vomissement couché). L’erreur fréquente consiste à ne traiter que l’infection sans corriger ces facteurs ; la récidive devient alors probable.</p>
<h3>4.2 Agents inhalés</h3>
<p>Les agents se classent selon leur mécanisme principal, ce qui prédit le siège de la lésion et l’urgence.</p>
<table class="t"><tr><th>Groupe</th><th>Exemples</th><th>Circonstance typique</th><th>Lésion dominante</th></tr>
<tr><td>Irritants très solubles</td><td>Ammoniac, acide chlorhydrique, dioxyde de soufre</td><td>Accident industriel, agriculture, nettoyage</td><td>Œdème laryngé, trachéobronchite</td></tr>
<tr><td>Irritant intermédiaire</td><td>Chlore, chloramines</td><td>Eau de Javel mélangée à un acide ou à un produit ammoniaqué, piscine</td><td>Trachéobronchite, bronchospasme</td></tr>
<tr><td>Irritants peu solubles</td><td>Phosgène, dioxyde d’azote, ozone</td><td>Industrie chimique, silo à fourrage, soudure</td><td>Œdème pulmonaire retardé, bronchiolite oblitérante</td></tr>
<tr><td>Asphyxiants systémiques</td><td>Monoxyde de carbone, cyanure d’hydrogène</td><td>Incendie, chauffage défectueux</td><td>Hypoxie tissulaire sans lésion pulmonaire propre</td></tr>
<tr><td>Fumées d’incendie</td><td>Chaleur, suie, irritants, asphyxiants</td><td>Incendie en espace clos</td><td>Brûlure des voies supérieures, lésion chimique distale</td></tr>
<tr><td>Aérosols de vapotage</td><td>Huile de THC, acétate de vitamine E</td><td>Liquides non contrôlés</td><td>Lésion alvéolaire aiguë</td></tr></table>
<p>Le tableau se lit par la colonne « Circonstance typique », car c’est elle que le patient raconte. Un agriculteur qui tousse le soir après être entré dans un silo récemment rempli évoque le dioxyde d’azote et un risque d’œdème retardé.</p>
<h3>4.3 Médicaments pneumotoxiques</h3>
<p>Plusieurs centaines de médicaments sont rapportés comme pneumotoxiques. Le site <button class="w" data-k="j69-pneumotox">Pneumotox (base de référence des toxicités respiratoires)</button> en tient l’inventaire. Le tableau retient les agents les plus fréquents en pratique suisse.</p>
<table class="t"><tr><th>Médicament</th><th>Tableau pulmonaire typique</th><th>Délai habituel</th><th>Facteur de risque connu</th></tr>
<tr><td><button class="w" data-k="j69-amio">Amiodarone (toxicité pulmonaire)</button></td><td>Pneumopathie interstitielle, pneumonie organisée, rarement atteinte alvéolaire diffuse</td><td>Surtout après deux mois</td><td>Dose et durée cumulées, maladie pulmonaire préexistante</td></tr>
<tr><td><button class="w" data-k="j69-mtx">Méthotrexate (pneumopathie d’hypersensibilité)</button></td><td>Pneumopathie d’hypersensibilité aiguë ou subaiguë</td><td>Souvent la première année</td><td>Atteinte pulmonaire préexistante discutée</td></tr>
<tr><td><button class="w" data-k="j69-nitro">Nitrofurantoïne (formes aiguë et chronique)</button></td><td>Forme aiguë fébrile avec éosinophilie ; forme chronique fibrosante</td><td>Heures à semaines ; ou mois à années</td><td>Prophylaxie urinaire prolongée</td></tr>
<tr><td>Bléomycine</td><td>Pneumopathie puis fibrose</td><td>Pendant ou après la chimiothérapie</td><td>Âge, insuffisance rénale, maladie pulmonaire préexistante</td></tr>
<tr><td>Inhibiteurs de points de contrôle immunitaire</td><td>Pneumonie organisée, verre dépoli, aspect d’hypersensibilité</td><td>Médiane de trois mois</td><td>Association, radiothérapie thoracique antérieure, anomalie interstitielle préalable</td></tr>
<tr><td>Trastuzumab déruxtécan</td><td>Pneumopathie interstitielle</td><td>87 % la première année</td><td>Insuffisance rénale, comorbidité pulmonaire, SpO₂ &lt; 95 % initiale</td></tr></table>
<p>La lecture commence par le délai : un délai compatible rend l’imputabilité plausible, un délai incompatible la rend improbable. L’erreur fréquente consiste à éliminer l’amiodarone parce que la dose actuelle est faible ; des cas surviennent à 200 mg par jour.</p>
<h3>4.4 Rayonnements ionisants</h3>
<p>Le risque de pneumopathie radique augmente avec la dose totale, la dose par fraction et le volume pulmonaire irradié. La chimiothérapie concomitante et l’immunothérapie l’augmentent aussi. QUANTEC exprime le volume irradié par le <button class="w" data-k="j69-v20">V20 (volume pulmonaire recevant au moins 20 Gy)</button> et par la dose pulmonaire moyenne.</p>
<div class="key"><b>À retenir.</b> Les facteurs d’aspiration se corrigent barrière par barrière. Les agents inhalés se classent par solubilité et par effet systémique. Les médicaments s’évaluent par le délai et Pneumotox ; les rayonnements par la dose et le volume irradié. La clinique, qui suit, s’appuie sur ces expositions.</div>
<button class="pareto-btn ui" data-k="pareto-j69-clin">▲ Loi de Pareto — Définitions, mécanismes et causes</button>
</section>

<section class="ilot" id="j69-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse d’exposition fait le diagnostic dans ce chapitre. Elle se mène comme une enquête chronologique : quel agent, quand, combien, et quel délai avant les symptômes.</p>
<h3>5.1 Antécédents et expositions à rechercher</h3>
<p>Le médecin recherche d’abord les <button class="w" data-k="j69-ant-asp">facteurs d’aspiration (questions ciblées)</button> : toux ou voix mouillée pendant les repas, maladie neurologique, sédatifs, reflux, vomissements. Il demande ensuite la <button class="w" data-k="j69-ant-med">liste complète des médicaments, actuels et passés</button>, y compris les cures courtes comme la nitrofurantoïne et les traitements anticancéreux terminés. Il recherche une radiothérapie thoracique, même ancienne, et précise la date de la dernière séance. Il interroge sur la profession, les loisirs, l’incendie récent, les produits ménagers mélangés et le <button class="w" data-k="j69-ant-vap">vapotage (produits et provenance)</button>.</p>
<h3>5.2 Symptômes</h3>
<p>Les symptômes sont peu spécifiques ; leur chronologie est l’élément discriminant. La <button class="w" data-k="j69-sx-dysp">dyspnée (délai et vitesse d’installation)</button> est presque constante. Une dyspnée qui suit l’exposition de quelques heures évoque une lésion chimique. Une dyspnée progressive sur des semaines évoque une toxicité médicamenteuse ou radique. La <button class="w" data-k="j69-sx-toux">toux (sèche ou productive)</button> est sèche dans les atteintes interstitielles et productive dans la pneumonie d’aspiration. La fièvre accompagne l’infection, mais aussi la pneumopathie chimique précoce, la toxicité aiguë de la nitrofurantoïne et la pneumopathie radique. Une douleur de gorge, une dysphonie et un stridor après inhalation signent une atteinte des voies supérieures.</p>
<div class="two">
<div class="card"><h4>Forme typique : aspiration du sujet âgé</h4><p>Un patient dysphagique présente en un à trois jours une fièvre, une toux productive et une opacité d’un segment déclive. Les signes respiratoires sont parfois discrets ; une confusion ou une chute peuvent être le premier symptôme.</p></div>
<div class="card"><h4>Forme aiguë après inhalation</h4><p>Un patient exposé à un irritant tousse, a mal à la gorge et respire mal dans les minutes qui suivent. Avec un gaz peu soluble, il peut rester asymptomatique pendant plusieurs heures puis décompenser.</p></div>
<div class="card"><h4>Forme subaiguë médicamenteuse</h4><p>Un patient sous amiodarone, méthotrexate ou immunothérapie se plaint d’une dyspnée d’effort et d’une toux sèche depuis quelques semaines. La fièvre et l’éosinophilie évoquent une hypersensibilité.</p></div>
<div class="card"><h4>Forme atypique : patient asymptomatique</h4><p>Une opacité nouvelle apparaît sur un scanner de suivi oncologique, sans symptôme. Il s’agit d’un grade 1 de la classification CTCAE ; la conduite dépend du médicament et de l’évolution.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse fixe trois dates : l’exposition, les premiers symptômes, l’aggravation. Le délai entre elles oriente vers l’acide, l’infection, le gaz peu soluble, le médicament ou le rayonnement. L’examen clinique mesure ensuite la gravité.</div>
</section>

<section class="ilot" id="j69-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen évalue d’abord la menace vitale, puis cherche les signes qui orientent vers l’agent. Le normal sert de référence : un adulte au repos respire 12 à 20 fois par minute, avec une SpO₂ habituellement de 95 à 100 % à l’air ambiant.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>La <button class="w" data-k="j69-ex-fr">fréquence respiratoire (seuil de gravité)</button> au-delà de 30 par minute traduit un travail respiratoire difficile à soutenir. La <button class="w" data-k="j69-ex-spo2">SpO₂ (limite en cas de monoxyde de carbone)</button> mesure la saturation, mais elle surestime l’oxygénation lorsque la carboxyhémoglobine est élevée. La confusion, l’hypotension et l’acidose suggèrent une hypoxie tissulaire.</p></div>
<div class="card"><h4>Voies aériennes supérieures</h4><p>Après un incendie, le médecin cherche la <button class="w" data-k="j69-ex-suie">suie et les brûlures du visage (signes d’inhalation)</button>, une raucité de la voix et un stridor. Ces signes annoncent un œdème laryngé qui progresse sur 24 heures.</p></div>
<div class="card"><h4>Auscultation</h4><p>Les crépitants localisés à une base évoquent une aspiration ; les <button class="w" data-k="j69-ex-crep">crépitants bilatéraux (atteinte interstitielle ou œdème)</button> évoquent une toxicité diffuse ou un œdème lésionnel. Les sibilants traduisent une atteinte bronchique par irritant.</p></div>
<div class="card"><h4>Déglutition et bouche</h4><p>Le médecin inspecte la dentition et la propreté buccale. Il fait réaliser, chez le patient vigilant, un <button class="w" data-k="j69-ex-eau">test de déglutition à l’eau (dépistage au lit)</button> ; une toux, une voix mouillée ou une chute de saturation après la gorgée le rendent positif.</p></div>
<div class="card"><h4>Signes extrapulmonaires</h4><p>Une éruption cutanée et une fièvre orientent vers une hypersensibilité médicamenteuse. Une radiodermite dessine le champ d’irradiation. Une acidose avec trouble de conscience après un incendie évoque le cyanure.</p></div>
<div class="card"><h4>Pièges de l’examen</h4><p>Un examen pulmonaire normal n’exclut pas une lésion par gaz peu soluble dans les premières heures. Une SpO₂ normale n’exclut pas une intoxication par le monoxyde de carbone.</p></div></div>
<div class="key"><b>À retenir.</b> L’examen cherche d’abord la menace : fréquence respiratoire, saturation interprétée avec prudence, voies supérieures après incendie, conscience. Il cherche ensuite les indices de l’agent : déglutition, peau, champ d’irradiation. La démarche diagnostique organise ces données.</div>
</section>

<section class="ilot" id="j69-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>Aucun examen ne prouve seul l’origine externe d’une atteinte pulmonaire. Le diagnostic repose sur quatre éléments : une exposition documentée, un délai compatible, une imagerie compatible et l’exclusion d’une autre cause, en particulier infectieuse et cardiaque.</p>
<figure><svg viewBox="0 0 400 420" role="img" aria-label="Algorithme diagnostique" font-family="Inter,sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="1.3"><rect x="70" y="6" width="260" height="44" rx="5"/><path d="M200 50v16m-5-6l5 6 5-6"/><rect x="70" y="66" width="260" height="44" rx="5"/><path d="M200 110v14M50 124h300M50 124v14M150 124v14M250 124v14M350 124v14"/><rect x="4" y="138" width="92" height="96" rx="5"/><rect x="104" y="138" width="92" height="96" rx="5"/><rect x="204" y="138" width="92" height="96" rx="5"/><rect x="304" y="138" width="92" height="96" rx="5"/><path d="M50 234v16M150 234v16M250 234v16M350 234v16"/><rect x="4" y="250" width="92" height="110" rx="5"/><rect x="104" y="250" width="92" height="110" rx="5"/><rect x="204" y="250" width="92" height="110" rx="5"/><rect x="304" y="250" width="92" height="110" rx="5"/><rect x="40" y="374" width="320" height="40" rx="5"/></g><g fill="#222" text-anchor="middle"><text x="200" y="26">Opacité ou dyspnée nouvelle</text><text x="200" y="42">Gravité d’abord (voies, CO, cyanure)</text><text x="200" y="86">Quelle exposition ?</text><text x="200" y="102">Quel délai ?</text><text x="50" y="158">Aspiration</text><text x="50" y="176">heures :</text><text x="50" y="192">chimique ;</text><text x="50" y="208">jours :</text><text x="50" y="224">infection</text><text x="150" y="158">Gaz, fumées</text><text x="150" y="176">minutes à</text><text x="150" y="192">24 heures</text><text x="250" y="158">Médicament</text><text x="250" y="176">semaines</text><text x="250" y="192">à années</text><text x="350" y="158">Radiothérapie</text><text x="350" y="176">3 à 12</text><text x="350" y="192">semaines</text><text x="50" y="270">Radiographie,</text><text x="50" y="286">segments</text><text x="50" y="302">déclives ;</text><text x="50" y="318">dépistage de</text><text x="50" y="334">la dysphagie</text><text x="150" y="270">Gaz du sang</text><text x="150" y="286">avec</text><text x="150" y="302">carboxy-</text><text x="150" y="318">hémoglobine,</text><text x="150" y="334">lactate</text><text x="250" y="270">Scanner haute</text><text x="250" y="286">résolution,</text><text x="250" y="302">Pneumotox,</text><text x="250" y="318">exclusion de</text><text x="250" y="334">l’infection</text><text x="350" y="270">Scanner</text><text x="350" y="286">superposé</text><text x="350" y="302">au champ</text><text x="350" y="318">irradié</text><text x="200" y="398">Exclure infection, insuffisance cardiaque, embolie</text></g></svg><figcaption>Figure 3 — Démarche diagnostique. La gravité est évaluée avant l’enquête étiologique ; l’exposition et le délai orientent ensuite vers l’examen discriminant de chaque branche.</figcaption></figure>
<p>La figure se lit de haut en bas. Le premier rectangle impose de traiter la menace vitale avant de chercher la cause. Le deuxième demande l’exposition et le délai, qui sélectionnent la branche. Le rectangle final rappelle les trois diagnostics alternatifs qui imitent toutes les branches.</p>
<h3>7.1 Différentiels hiérarchisés par gravité</h3>
<p>Les diagnostics alternatifs se classent selon le danger d’un retard. Le <button class="w" data-k="j69-diff">diagnostic différentiel (critère qui tranche)</button> se discute dans cet ordre.</p>
<table class="t"><tr><th>Diagnostic alternatif</th><th>Pourquoi il est dangereux de le manquer</th><th>Élément qui tranche</th></tr>
<tr><td>Pneumonie infectieuse, y compris opportuniste</td><td>Une corticothérapie à tort aggrave l’infection</td><td>Prélèvements microbiologiques, lavage bronchoalvéolaire si immunodépression</td></tr>
<tr><td>Œdème pulmonaire cardiogénique</td><td>Il demande des diurétiques et non des corticoïdes</td><td>Peptides natriurétiques, échocardiographie</td></tr>
<tr><td>Embolie pulmonaire</td><td>Elle impose une anticoagulation</td><td>Angio-TDM pulmonaire</td></tr>
<tr><td>Progression tumorale ou lymphangite</td><td>Elle change le traitement oncologique</td><td>Évolution, histologie si doute</td></tr>
<tr><td>Pneumopathie interstitielle idiopathique</td><td>Elle a un pronostic et un traitement propres</td><td>Absence d’exposition, discussion multidisciplinaire (J84)</td></tr></table>
<p>Le tableau se lit dans l’ordre des lignes, de la plus urgente à la moins urgente. Chez un patient sous immunothérapie avec une opacité nouvelle, le médecin écarte d’abord une infection avant de prescrire de fortes doses de corticoïdes.</p>
<div class="quiz ui"><p>Une femme de 55 ans reçoit de la nitrofurantoïne depuis cinq jours pour une cystite. Elle consulte pour une fièvre à 38,6 °C, une toux sèche et une dyspnée. Les éosinophiles sont à 1,2 G/L. La radiographie montre des opacités interstitielles bilatérales. Quelle conduite est la plus adaptée ?</p><button data-ok="0">Remplacer la nitrofurantoïne par un autre antibiotique urinaire et ajouter un macrolide pour une pneumonie atypique</button><button data-ok="1">Arrêter la nitrofurantoïne, rechercher une infection et surveiller l’amélioration attendue en quelques jours</button><button data-ok="0">Poursuivre la nitrofurantoïne et prescrire un corticoïde inhalé</button><p class="fb" hidden>Le délai court, la fièvre, l’éosinophilie et les opacités bilatérales évoquent la forme aiguë d’hypersensibilité à la nitrofurantoïne. L’arrêt du médicament est le traitement principal ; l’amélioration survient habituellement rapidement. Une infection doit néanmoins être recherchée, car elle reste le principal diagnostic alternatif. Un macrolide ne traite pas la cause.</p></div>
<div class="key"><b>À retenir.</b> Le diagnostic associe exposition, délai, imagerie compatible et exclusion. Le médecin traite la menace vitale avant l’enquête et écarte toujours l’infection, l’œdème cardiogénique et l’embolie. La partie suivante détaille les urgences.</div>
<button class="pareto-btn ui" data-k="pareto-j69-diag">▲ Loi de Pareto — Anamnèse, examen et diagnostic</button>
</section>
