
<!-- ===== FENÊTRES : risque, traitement, groupe 4, I28, situations ===== -->
<template data-pop="i27-risque3" data-title="Stratification du risque à trois niveaux (diagnostic)">
<div class="lab">Principe</div><p>L’ESC/ERS 2022 combine plusieurs variables pour estimer la mortalité à un an : faible &lt; 5 %, intermédiaire 5 à 20 %, élevée &gt; 20 %. Aucune variable ne suffit seule.</p>
<div class="lab">Variables et seuils (faible / élevé)</div><p>Signes d’insuffisance droite : absents / présents. Progression : aucune / rapide. Syncope : aucune / répétées. Classe fonctionnelle : I–II / IV. Test de marche : &gt; 440 m / &lt; 165 m. Pic de VO₂ : &gt; 15 / &lt; 11 mL/min/kg ; pente VE/VCO₂ : &lt; 36 / &gt; 44. BNP : &lt; 50 / &gt; 800 ng/L ; NT-proBNP : &lt; 300 / &gt; 1 100 ng/L. Surface de l’oreillette droite : &lt; 18 / &gt; 26 cm² ; TAPSE/PAPs : &gt; 0,32 / &lt; 0,19 mm/mmHg ; épanchement péricardique : absent / modéré à abondant. Pression de l’oreillette droite : &lt; 8 / &gt; 14 mmHg ; index cardiaque : ≥ 2,5 / &lt; 2,0 L/min/m² ; index de volume d’éjection : &gt; 38 / &lt; 31 mL/m² ; saturation veineuse mêlée : &gt; 65 / &lt; 60 %.</p>
<div class="lab">Usage</div><p>Le niveau de risque initial oriente la bithérapie orale ou la trithérapie avec prostanoïde parentéral.</p>
<div class="lab">Limite</div><p>Plus de la moitié des patients se classent en risque intermédiaire, ce qui a motivé le modèle à quatre niveaux pour le suivi.</p></template>

<template data-pop="i27-risque4" data-title="Stratification du risque à quatre niveaux (suivi)">
<div class="lab">Variables</div><p>Classe fonctionnelle de l’OMS, test de marche de six minutes, BNP ou NT-proBNP. Chaque variable reçoit 1 à 4 points ; la moyenne arrondie à l’entier supérieur donne le niveau.</p>
<div class="lab">Seuils</div><p>Classe I–II : 1 ; III : 3 ; IV : 4. Marche &gt; 440 m : 1 ; 320–440 : 2 ; 165–319 : 3 ; &lt; 165 : 4. NT-proBNP &lt; 300 : 1 ; 300–649 : 2 ; 650–1 100 : 3 ; &gt; 1 100 ng/L : 4. BNP &lt; 50 : 1 ; 50–199 : 2 ; 200–800 : 3 ; &gt; 800 ng/L : 4.</p>
<div class="lab">Mortalité observée à un an</div><p>0 à 3 % (faible), 2 à 7 % (intermédiaire bas), 9 à 19 % (intermédiaire haut), &gt; 20 % (élevé), selon l’ESC/ERS 2022.</p>
<div class="lab">Conséquence pratique</div><p>Le modèle sépare deux patients que l’ancien modèle confondait : l’intermédiaire bas relève d’un ajout oral, l’intermédiaire haut d’un traitement parentéral ou du sotatercept et d’une évaluation pour transplantation.</p></template>

<template data-pop="i27-crise" data-title="Défaillance ventriculaire droite aiguë">
<div class="lab">Reconnaissance</div><p>Hypotension, tachycardie, extrémités froides, oligurie, confusion, lactate élevé, élévation de la créatinine et des enzymes hépatiques, chez un patient atteint d’hypertension pulmonaire.</p>
<div class="lab">Spirale</div><p>Le ventricule droit dilaté comprime le gauche, le débit baisse, la pression artérielle baisse, la perfusion coronaire droite baisse, et l’ischémie aggrave la dysfonction droite.</p>
<div class="lab">Principes de traitement</div><p>Traiter le déclencheur (infection, arythmie, embolie, arrêt de traitement). Maintenir la pression artérielle par la noradrénaline. Soutenir la contractilité par la dobutamine. Réduire la postcharge par un vasodilatateur pulmonaire, inhalé ou intraveineux. Ajuster la volémie, le plus souvent par diurétiques, parfois par un remplissage prudent si la précharge est basse. Corriger l’hypoxémie, l’acidose et l’hypercapnie, qui contractent les artérioles pulmonaires.</p>
<div class="lab">Pièges</div><p>L’intubation provoque souvent un collapsus : la sédation abaisse la pression systémique et la pression positive élève la postcharge droite. Une oxygénation extracorporelle peut servir de pont vers la transplantation, chez un candidat sélectionné.</p></template>

<template data-pop="i27-exo" data-title="Réadaptation et activité physique">
<div class="lab">Recommandation</div><p>L’ESC/ERS 2022 encourage une réadaptation supervisée chez les patients stables sous traitement médicamenteux optimal.</p>
<div class="lab">Preuve</div><p>Un essai randomisé de 116 patients a montré une amélioration du test de marche de 34 m (écart-type 8 m) par rapport au groupe témoin.</p>
<div class="lab">Mécanisme</div><p>L’entraînement améliore la fonction musculaire périphérique, l’extraction d’oxygène et l’efficacité ventilatoire ; il ne guérit pas la vasculopathie.</p>
<div class="lab">Précautions</div><p>Le programme débute en milieu spécialisé, à intensité basse à modérée. Les efforts intenses, brusques ou isométriques, qui provoquent les syncopes, sont évités.</p></template>

<template data-pop="i27-preg" data-title="Grossesse et hypertension pulmonaire">
<div class="lab">Risque</div><p>L’augmentation de 30 à 50 % du volume sanguin et du débit cardiaque, les variations brutales du post-partum et le risque thromboembolique dépassent les capacités d’un ventricule droit limité. L’ESC/ERS 2022 rapporte une mortalité maternelle de 11 à 25 %, en baisse mais toujours très élevée.</p>
<div class="lab">Conseil</div><p>La grossesse est déconseillée. Une femme à risque intermédiaire ou élevé, avec dysfonction droite, reçoit un conseil explicite, et une interruption précoce est conseillée.</p>
<div class="lab">Si la grossesse se poursuit</div><p>Suivi multidisciplinaire en centre expert. Les antagonistes des récepteurs de l’endothéline, le riociguat et le sélexipag sont arrêtés ; les inhibiteurs calciques, les inhibiteurs de la phosphodiestérase de type 5 et les prostanoïdes sont considérés comme utilisables. L’accouchement est planifié, souvent par césarienne programmée sous anesthésie locorégionale.</p></template>

<template data-pop="i27-contra" data-title="Contraception dans l’hypertension pulmonaire">
<div class="lab">Pourquoi</div><p>La grossesse menace la vie de la patiente, et plusieurs médicaments sont tératogènes : antagonistes des récepteurs de l’endothéline, riociguat, sotatercept.</p>
<div class="lab">Interaction</div><p>Le bosentan induit le CYP3A4 : il a réduit l’aire sous la courbe de l’éthinylestradiol de 31 % (information professionnelle Tracleer). Une contraception hormonale seule n’est donc pas fiable sous bosentan.</p>
<div class="lab">Méthodes</div><p>L’ESC/ERS 2022 cite l’implant et le dispositif intra-utérin comme alternatives. Les contraceptifs contenant des œstrogènes augmentent le risque thromboembolique.</p>
<div class="lab">Surveillance</div><p>Un test de grossesse mensuel est recommandé sous bosentan par l’information professionnelle suisse. Sous sotatercept, la contraception se poursuit au moins quatre mois après la dernière dose.</p></template>

<template data-pop="i27-o2" data-title="Oxygénothérapie dans l’hypertension pulmonaire">
<div class="lab">Indication</div><p>L’ESC/ERS 2022 conseille l’oxygène de longue durée lorsque la PaO₂ est inférieure à 8 kPa (60 mmHg), ou la saturation artérielle inférieure à 92 %, à au moins deux reprises, avec une cible de PaO₂ supérieure à 8 kPa. L’oxygène nocturne s’envisage en cas de désaturation pendant le sommeil.</p>
<div class="lab">Base de preuve</div><p>Cette recommandation est extrapolée des données de la BPCO. Dans l’HTAP, l’oxygène de longue durée n’a pas montré de bénéfice durable prouvé.</p>
<div class="lab">Limite</div><p>Dans un shunt droite-gauche (syndrome d’Eisenmenger, fistule artérioveineuse), l’oxygène corrige peu la saturation, car le sang shunté ne passe pas par les alvéoles.</p></template>

<template data-pop="i27-fer" data-title="Carence martiale">
<div class="lab">Définition (ESC/ERS 2022)</div><p>Ferritine &lt; 100 µg/L, ou ferritine entre 100 et 299 µg/L avec saturation de la transferrine &lt; 20 %.</p>
<div class="lab">Pourquoi elle compte</div><p>Le fer sert à l’hémoglobine et aux enzymes mitochondriales des muscles, y compris du ventricule droit. Sa carence réduit la capacité d’effort indépendamment de l’anémie. Elle est fréquente dans l’HTAP, notamment sous anticoagulant ou en cas d’épistaxis.</p>
<div class="lab">Conduite</div><p>La carence se recherche régulièrement. Le fer intraveineux est recommandé en cas d’anémie ferriprive sévère (hémoglobine &lt; 7 à 8 g/dL) ; dans les autres cas, la voie se choisit selon la tolérance et l’absorption.</p></template>

<template data-pop="i27-vacc" data-title="Vaccinations">
<div class="lab">Recommandation</div><p>L’ESC/ERS 2022 recommande la vaccination contre la grippe, le pneumocoque et le SARS-CoV-2 chez les patients atteints d’HTAP.</p>
<div class="lab">Raison</div><p>Une infection respiratoire augmente la demande métabolique, provoque une hypoxémie qui contracte les artérioles pulmonaires et peut déclencher une décompensation droite.</p>
<div class="lab">Suisse</div><p>Le schéma suit le plan de vaccination suisse de l’OFSP en vigueur pour les personnes atteintes de maladies cardiaques et pulmonaires chroniques.</p></template>

<template data-pop="i27-anticoag" data-title="Anticoagulation selon le groupe">
<div class="lab">HTAP (groupe 1)</div><p>L’ESC/ERS 2022 ne formule aucune recommandation générale pour ou contre. Des registres anciens suggéraient un bénéfice dans la forme idiopathique, non confirmé ; dans l’HTAP de la sclérodermie, les données suggèrent un effet délétère. La décision est individuelle.</p>
<div class="lab">HTP thromboembolique chronique (groupe 4)</div><p>Anticoagulation thérapeutique à vie, classe I, niveau C. Un antivitamine K est recommandé en cas de syndrome des antiphospholipides, que l’on recherche systématiquement.</p>
<div class="lab">Autres indications</div><p>Fibrillation atriale, thrombose veineuse, cathéter central de longue durée : elles suivent leurs propres règles.</p>
<div class="lab">Piège</div><p>Sous sotatercept, l’association à un anticoagulant augmente le risque de saignement grave.</p></template>

<template data-pop="i27-tx" data-title="Transplantation pulmonaire">
<div class="lab">Indication</div><p>Patients atteints d’HTAP restant à risque intermédiaire haut ou élevé malgré un traitement médical maximal, y compris un prostanoïde parentéral ; maladie veino-occlusive dès le diagnostic ; certaines formes de groupe 3.</p>
<div class="lab">Modalités</div><p>Transplantation bipulmonaire le plus souvent ; transplantation cardiopulmonaire dans certaines cardiopathies congénitales complexes. Le ventricule droit récupère habituellement après la greffe, car sa postcharge redevient normale.</p>
<div class="lab">Conséquence pratique</div><p>L’adressage doit être précoce, car le délai d’attente est long et l’état du patient peut se dégrader vite. L’ESC/ERS 2022 recommande d’évaluer le patient dès que le risque reste élevé malgré le traitement.</p></template>

<template data-pop="i27-arbitrage" data-title="ESC/ERS 2022 et 7ᵉ Symposium mondial 2024 : quelle source suivre ?">
<div class="lab">Texte en vigueur</div><p>Les recommandations ESC/ERS 2022 restent les dernières recommandations européennes officielles sur l’hypertension pulmonaire au 08.10.2026. Elles fixent la définition, les groupes, la stratification du risque et l’algorithme de traitement. Elles ne mentionnent pas le sotatercept, autorisé après leur publication.</p>
<div class="lab">Sources plus récentes</div><p>Le 7ᵉ Symposium mondial de l’hypertension pulmonaire (Barcelone, 2024) a publié un algorithme de consensus qui intègre un inhibiteur de la signalisation de l’activine chez les patients restant à risque non faible. Trois essais randomisés soutiennent cet ajout : STELLAR (2023, classes II–III, gain de 40,8 m au test de marche), ZENITH (2025, patients à haut risque, réduction de 76 % du critère décès, transplantation ou hospitalisation) et un essai publié en 2025 chez des patients diagnostiqués depuis moins d’un an (aggravation clinique 10,6 % contre 36,9 %, sans différence de mortalité).</p>
<div class="lab">Choix retenu</div><p>Le cours suit l’ESC/ERS 2022 pour tout ce qu’elle couvre et ajoute le sotatercept selon la source primaire applicable la plus récente : les essais randomisés et l’autorisation suisse, qui couvre depuis le 05.02.2026 les classes fonctionnelles II à IV en association avec un traitement standard. Le symposium est un consensus d’experts, non une recommandation au sens formel ; il ne prévaut pas sur un texte officiel, mais il le complète là où celui-ci est muet.</p>
<div class="lab">Limites</div><p>Le texte intégral de l’algorithme du symposium n’a pas été lu pour ce cours ; sa structure est rapportée d’après une synthèse secondaire. La place exacte du sotatercept par rapport au prostanoïde parentéral chez le patient à haut risque reste une décision de centre.</p></template>

<template data-pop="i27-cteph" data-title="Hypertension pulmonaire thromboembolique chronique">
<div class="lab">Définition</div><p>Hypertension précapillaire due à l’obstruction des artères pulmonaires par un tissu fibreux issu de caillots non résolus, persistant après au moins trois mois d’anticoagulation efficace (groupe 4, I27.20).</p>
<div class="lab">Fréquence</div><p>Incidence 2 à 6 et prévalence 26 à 38 cas par million d’adultes (ESC/ERS 2022). En Suisse, une cohorte prospective a mesuré une incidence cumulée de 0,79 % à deux ans après une embolie (Coquoz et collaborateurs, 2018).</p>
<div class="lab">Facteurs favorisants</div><p>Embolies récidivantes ou volumineuses, syndrome des antiphospholipides, splénectomie, dérivation ventriculo-atriale ou dispositif intravasculaire infecté, cancer, maladie inflammatoire de l’intestin, hypothyroïdie substituée, groupe sanguin non O.</p>
<div class="lab">Diagnostic</div><p>Scintigraphie de perfusion (défauts non concordants), puis angioscanner, angiographie ou IRM et cathétérisme, en centre.</p>
<div class="lab">Traitement</div><p>Anticoagulation à vie ; endartériectomie si opérable ; angioplastie par ballonnet et riociguat si inopérable ou persistant.</p>
<div class="lab">Renvoi</div><p>L’embolie aiguë et le suivi après embolie sont traités dans le cours I26 — Embolie pulmonaire (P-02-Pneumologie).</p></template>

<template data-pop="i27-ctepd" data-title="Maladie thromboembolique chronique sans hypertension">
<div class="lab">Définition (ESC/ERS 2022)</div><p>Patient symptomatique, avec des défauts de perfusion non concordants et des signes de caillots fibreux organisés, après au moins trois mois d’anticoagulation efficace, sans hypertension pulmonaire au repos.</p>
<div class="lab">Mécanisme des symptômes</div><p>L’obstruction augmente l’espace mort et peut provoquer une hypertension à l’effort seulement. L’épreuve d’effort cardiopulmonaire ou le cathétérisme d’effort le démontrent.</p>
<div class="lab">Conduite</div><p>Discussion en centre ; anticoagulation au long cours ; endartériectomie ou angioplastie chez des patients sélectionnés et symptomatiques.</p></template>

<template data-pop="i27-pea" data-title="Endartériectomie pulmonaire">
<div class="lab">Technique</div><p>Sternotomie, circulation extracorporelle, hypothermie profonde et périodes d’arrêt circulatoire qui assèchent le champ. Le chirurgien clive la néo-intima fibreuse de la paroi et l’extrait en continuité jusqu’aux artères segmentaires et sous-segmentaires.</p>
<div class="lab">Place</div><p>Traitement de choix des lésions accessibles, classe I, niveau B (ESC/ERS 2022). L’opérabilité se décide par une équipe experte, selon la localisation des lésions, la concordance entre obstruction et RVP, et les comorbidités.</p>
<div class="lab">Résultats</div><p>Chez la plupart des patients, la pression et la fonction droite s’améliorent nettement. L’ESC/ERS 2019 citait une mortalité hospitalière de 4,7 % dans un registre international ; elle est plus faible dans les centres à grand volume.</p>
<div class="lab">Complications</div><p>Œdème de reperfusion, hypertension résiduelle ou persistante, saignement ; l’hypertension résiduelle relève de l’angioplastie ou du riociguat.</p></template>

<template data-pop="i27-bpa" data-title="Angioplastie pulmonaire par ballonnet">
<div class="lab">Technique</div><p>Par voie veineuse, un ballonnet dilate une à une les lésions segmentaires et sous-segmentaires, en plusieurs séances espacées de quelques semaines, pour limiter le risque de lésion de reperfusion.</p>
<div class="lab">Indication</div><p>HTP thromboembolique chronique inopérable par lésions distales, ou hypertension résiduelle après endartériectomie, en centre expérimenté.</p>
<div class="lab">Complications</div><p>Lésion vasculaire avec hémoptysie, œdème de reperfusion, réaction au produit de contraste. Leur fréquence baisse avec l’expérience du centre.</p>
<div class="lab">Association</div><p>Un traitement par riociguat est souvent instauré avant les séances, pour réduire la pression et le risque procédural.</p></template>

<template data-pop="i27-mavp" data-title="Malformation artérioveineuse pulmonaire">
<div class="lab">Définition</div><p>Communication anormale entre une artère et une veine pulmonaires, sans capillaire, réalisant un shunt droite-gauche continu (I28.0).</p>
<div class="lab">Fréquence et causes</div><p>Une étude japonaise par scanner, citée par la BTS 2017, l’estime à environ 1 personne sur 2 600. La majorité est liée à une télangiectasie hémorragique héréditaire ; les autres sont isolées, post-traumatiques, ou liées à une cirrhose, à une chirurgie cavo-pulmonaire ou à une infection.</p>
<div class="lab">Conséquences</div><p>Le sang n’est ni oxygéné ni filtré. Plus d’un patient sur quatre aura un accident vasculaire cérébral paradoxal, un abcès cérébral ou un infarctus du myocarde (BTS 2017). L’hypoxémie, la polyglobulie et, plus rarement, une hémorragie s’y ajoutent.</p>
<div class="lab">Diagnostic</div><p>Un scanner thoracique positif est diagnostique. Un scanner ou une échocardiographie de contraste négatifs excluent une malformation significative. Une radiographie normale ne l’exclut pas.</p>
<div class="lab">Diagnostic différentiel du shunt</div><p>Shunt intracardiaque intermittent par foramen ovale perméable, syndrome hépatopulmonaire, shunt fonctionnel présent chez environ 10 % de la population au repos (BTS 2017).</p></template>

<template data-pop="i27-hht" data-title="Télangiectasie hémorragique héréditaire">
<div class="lab">Définition</div><p>Maladie autosomique dominante des vaisseaux, estimée à environ 1 cas pour 5 000 personnes (deuxièmes recommandations internationales, 2020). Elle associe télangiectasies cutanéo-muqueuses et malformations artérioveineuses viscérales. L’éponyme est la maladie de Rendu-Osler.</p>
<div class="lab">Critères de Curaçao (aide au diagnostic clinique)</div><p>Épistaxis spontanées récidivantes ; télangiectasies cutanéo-muqueuses aux sites caractéristiques (lèvres, langue, doigts, nez) ; atteinte viscérale (malformations pulmonaires, hépatiques, cérébrales, télangiectasies digestives) ; apparenté au premier degré atteint. Trois critères rendent le diagnostic certain ; deux le rendent possible.</p>
<div class="lab">Génétique</div><p>Variants d’ENG, d’ACVRL1 ou de SMAD4. Un test génétique aide lorsque le diagnostic clinique est douteux et permet de cibler le dépistage familial.</p>
<div class="lab">Conséquence pratique</div><p>Tout adulte atteint ou suspect se voit proposer un dépistage des malformations pulmonaires (BTS 2017) et un dépistage de la carence martiale. Les apparentés au premier degré d’un patient porteur de fistules ont environ une chance sur quatre d’en avoir.</p>
<div class="lab">Renvoi</div><p>La maladie, codée I78.0, est développée dans le cours I77 — Autres atteintes des artères et artérioles, qui couvre aussi I78 (C-01-Cardiologie).</p></template>

<template data-pop="i27-platy" data-title="Platypnée et orthodéoxie">
<div class="lab">Définition</div><p>La platypnée est une dyspnée qui apparaît en position debout et disparaît en décubitus. L’orthodéoxie est la baisse de la saturation en position debout.</p>
<div class="lab">Mécanisme</div><p>Debout, la gravité dirige davantage de sang vers les bases. Si les fistules siègent aux bases, ce qui est fréquent, la fraction shuntée augmente et la saturation baisse.</p>
<div class="lab">Autres causes</div><p>Syndrome hépatopulmonaire, shunt par foramen ovale perméable lors d’une modification de l’anatomie médiastinale (après pneumonectomie, anévrisme aortique).</p>
<div class="lab">Technique</div><p>On mesure la saturation pulsée après quelques minutes en décubitus puis en position debout ; une baisse de plusieurs points est significative et oriente le bilan.</p></template>

<template data-pop="i27-embol" data-title="Embolisation des malformations artérioveineuses pulmonaires">
<div class="lab">Indication (BTS 2017)</div><p>Toute malformation visible au scanner est adressée à un radiologue interventionnel expérimenté, même chez un patient asymptomatique. L’ancienne règle qui réservait l’embolisation aux artères nourricières de 3 mm ou plus est abandonnée : des abcès cérébraux sont survenus avec des artères de 1 à 3 mm.</p>
<div class="lab">Technique</div><p>Des coils ou des bouchons vasculaires occluent l’artère nourricière au plus près du sac, par voie veineuse.</p>
<div class="lab">Sécurité</div><p>Le taux de complications majeures est d’environ 1 % en mains expérimentées ; le réseau européen VASCERN définit l’expérience par plus de 20 procédures. La grossesse, l’hypertension pulmonaire et l’insuffisance rénale sont des contre-indications relatives.</p>
<div class="lab">Suivi</div><p>Un contrôle clinique, physiologique et radiologique environ 6 mois après le traitement ; les scanners ultérieurs se décident au cas par cas en raison de l’irradiation.</p></template>

<template data-pop="i27-abces" data-title="Abcès cérébral et fistule pulmonaire">
<div class="lab">Mécanisme</div><p>Des bactéries passées dans le sang veineux, par exemple lors de soins dentaires, ne sont plus filtrées par les capillaires pulmonaires et atteignent le cerveau.</p>
<div class="lab">Prévention (BTS 2017)</div><p>Antibioprophylaxie recommandée pour tous les patients avant les soins dentaires et la chirurgie, même après embolisation, car de petites fistules persistent souvent.</p>
<div class="lab">Conséquence pratique</div><p>Un déficit neurologique, des céphalées ou une fièvre chez un patient porteur de fistules font rechercher un abcès cérébral. La thrombolyse d’un accident vasculaire cérébral n’est pas recommandée chez ces patients.</p></template>

<template data-pop="i27-ana" data-title="Anévrisme de l’artère pulmonaire">
<div class="lab">Définition</div><p>Dilatation focale concernant les trois tuniques de la paroi (I28.1). Une revue de 2023 retient un diamètre du tronc &gt; 4 cm ; il se distingue de la simple dilatation du tronc, fréquente dans l’hypertension pulmonaire.</p>
<div class="lab">Causes</div><p>Hypertension pulmonaire, présente chez environ deux tiers des patients d’après cette revue ; cardiopathies congénitales ; infections (tuberculose avec anévrisme de Rasmussen, endocardite droite, syphilis) ; maladie de Behçet et syndrome de Hughes-Stovin ; maladies du tissu conjonctif comme le syndrome de Marfan ; traumatismes et cathétérismes.</p>
<div class="lab">Complications</div><p>Compression du tronc coronaire gauche, des bronches ou du nerf récurrent ; dissection, surtout du tronc ; rupture avec hémoptysie massive.</p>
<div class="lab">Conduite</div><p>Aucune recommandation ne fixe de seuil. Le traitement est celui de la cause ; la chirurgie ou le traitement endovasculaire se discutent selon la taille, la croissance, les symptômes et la cause. La revue citée rapporte une discussion chirurgicale au-delà de 5,5 cm pour le tronc.</p></template>

<template data-pop="i27-behcet" data-title="Maladie de Behçet et artères pulmonaires">
<div class="lab">Atteinte</div><p>La maladie de Behçet est une vascularite qui touche des vaisseaux de tout calibre, artériels et veineux. Les anévrismes de l’artère pulmonaire en sont la manifestation pulmonaire la plus grave, souvent associés à des thromboses veineuses.</p>
<div class="lab">Piège thérapeutique</div><p>Une hémoptysie chez un patient atteint de thrombose veineuse peut faire évoquer une embolie et conduire à anticoaguler. Si la cause est un anévrisme, l’anticoagulation peut provoquer une hémorragie fatale. L’imagerie artérielle précède toute anticoagulation.</p>
<div class="lab">Traitement</div><p>Les recommandations EULAR 2018 préconisent des glucocorticoïdes à forte dose et du cyclophosphamide pour les anévrismes de l’artère pulmonaire ; l’embolisation est préférée à la chirurgie en cas de saignement actif.</p></template>

<template data-pop="i27-svp" data-title="Sténose des veines pulmonaires">
<div class="lab">Causes</div><p>Complication des ablations de fibrillation atriale par isolation des veines pulmonaires ; formes congénitales de l’enfant ; compression par médiastinite fibrosante ou tumeur.</p>
<div class="lab">Présentation</div><p>Dyspnée, toux, hémoptysie, douleur thoracique, infiltrats pulmonaires récidivants du même territoire, quelques semaines à mois après une ablation. Le tableau est souvent pris pour une pneumonie ou une embolie.</p>
<div class="lab">Diagnostic et traitement</div><p>L’angioscanner des veines pulmonaires ou l’IRM le montrent ; une scintigraphie de perfusion révèle l’hypoperfusion du territoire. La dilatation et la mise en place d’un stent se discutent en centre.</p>
<div class="lab">Renvoi</div><p>Voir le cours I48 — Fibrillation et flutter auriculaires (C-01-Cardiologie).</p></template>

<template data-pop="i27-altitude" data-title="Altitude et voyage aérien">
<div class="lab">Mécanisme</div><p>La pression partielle d’oxygène inspiré baisse avec l’altitude. Dans une cabine pressurisée à l’équivalent de 1 800 à 2 400 m, la PaO₂ baisse ; la vasoconstriction pulmonaire hypoxique élève la pression pulmonaire et la charge du ventricule droit.</p>
<div class="lab">Recommandation</div><p>L’ESC/ERS 2022 recommande l’oxygène en vol pour les patients déjà sous oxygène ou dont la PaO₂ est inférieure à 8 kPa au niveau de la mer.</p>
<div class="lab">Contexte suisse</div><p>Les séjours en montagne, les cols et les stations d’altitude exposent à la même hypoxie. Le patient discute avec son centre de l’altitude raisonnable, de l’oxygène et de la conduite en cas d’aggravation.</p>
<div class="lab">Groupe 3 d’altitude</div><p>Les habitants permanents de très haute altitude peuvent développer une hypertension pulmonaire par hypoxie chronique, classée dans le groupe 3.</p></template>

<template data-pop="i27-anesth" data-title="Chirurgie et anesthésie">
<div class="lab">Risque</div><p>Une chirurgie majeure expose à une mortalité et une morbidité élevées : la vasodilatation anesthésique abaisse la pression systémique, l’hypoxémie, l’hypercapnie, l’acidose, la douleur et la ventilation en pression positive élèvent la postcharge droite.</p>
<div class="lab">Préparation</div><p>Indication chirurgicale réévaluée ; planification avec le centre d’hypertension pulmonaire ; réalisation dans un hôpital disposant d’une anesthésie et de soins intensifs expérimentés. Les traitements spécifiques sont poursuivis sans interruption, avec relais intraveineux ou inhalé si la voie orale est impossible.</p>
<div class="lab">Principes</div><p>Préférer une anesthésie locorégionale si possible ; maintenir la pression artérielle ; éviter l’hypoxémie, l’hypercapnie et l’hypothermie ; disposer d’un vasodilatateur pulmonaire inhalé ; surveillance prolongée après l’intervention.</p></template>
