
<!-- ===== FENÊTRES : définitions, mécanismes, étiologies ===== -->
<template data-pop="i27-def" data-title="Définition hémodynamique de l’hypertension pulmonaire">
<div class="lab">Définition</div><p>L’ESC/ERS 2022 définit l’hypertension pulmonaire par une pression artérielle pulmonaire moyenne supérieure à 20 mmHg au repos, mesurée par cathétérisme cardiaque droit. Les valeurs normales de l’adulte au repos vont de 8 à 20 mmHg.</p>
<div class="lab">Pourquoi 20 et non 25 mmHg</div><p>Le seuil de 25 mmHg, utilisé jusqu’en 2015, n’avait pas de base physiologique. Les données de sujets sains situent la limite supérieure de la normale près de 20 mmHg, et les patients entre 21 et 24 mmHg ont déjà une mortalité augmentée. Le seuil des résistances a de même été abaissé de 3 à 2 unités Wood.</p>
<div class="lab">Limite</div><p>L’abaissement des seuils n’a pas été validé pour le traitement : les essais médicamenteux de l’HTAP ont inclus des patients à PAPm ≥ 25 mmHg et RVP ≥ 3 unités Wood. Un patient entre ces seuils relève d’une décision en centre.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic ne se pose jamais sur l’échocardiographie seule. Une estimation de pression systolique élevée conduit à une probabilité, puis, si une décision en dépend, au cathétérisme.</p></template>

<template data-pop="i27-rvp" data-title="Résistance vasculaire pulmonaire">
<div class="lab">Calcul</div><p>RVP = (PAPm − PAPO)/débit cardiaque. Le numérateur est la pression motrice du circuit pulmonaire, c’est-à-dire la différence entre l’entrée et la sortie. Le résultat s’exprime en unités Wood (mmHg·min/L) ; une unité Wood vaut 80 dyn·s·cm⁻⁵.</p>
<div class="lab">Valeurs</div><p>Normal : 0,3 à 2,0 unités Wood. Anormal : &gt; 2 unités Wood (ESC/ERS 2022). Une valeur &gt; 5 unités Wood définit une forme sévère dans le groupe 3.</p>
<div class="lab">Exemple</div><p>PAPm 40 mmHg, PAPO 10 mmHg, débit 4 L/min : RVP = 30/4 = 7,5 unités Wood. La même PAPm avec une PAPO de 28 mmHg et un débit de 6 L/min donne 2,0 unités Wood : l’hypertension est alors passive, d’origine gauche.</p>
<div class="lab">Piège</div><p>Les RVP dépendent du débit mesuré. Une erreur de thermodilution en cas d’insuffisance tricuspide sévère ou de shunt fausse le calcul ; la méthode de Fick directe est alors préférée.</p></template>

<template data-pop="i27-papo" data-title="Pression artérielle pulmonaire d’occlusion">
<div class="lab">Principe</div><p>Le cathéter à ballonnet est poussé dans une branche de l’artère pulmonaire jusqu’à l’occlure. Le sang ne circule plus en aval du ballon : la colonne de sang immobile transmet la pression des veines pulmonaires, donc celle de l’oreillette gauche.</p>
<div class="lab">Valeurs</div><p>Le seuil diagnostique reste 15 mmHg, bien que la limite supérieure réelle de la normale soit proche de 12 mmHg (ESC/ERS 2022).</p>
<div class="lab">Technique</div><p>La lecture se fait en fin d’expiration normale, sans manœuvre forcée, avec le zéro au niveau mi-thoracique. Chez le patient obèse ou atteint de BPCO, les variations respiratoires de pression intrathoracique peuvent fausser une lecture moyennée.</p>
<div class="lab">Piège</div><p>Une PAPO normale chez un patient déshydraté ou sous diurétique peut masquer une insuffisance cardiaque à fraction d’éjection préservée. Un remplissage ou un effort pendant le cathétérisme démasque alors la composante gauche.</p></template>

<template data-pop="i27-groupes" data-title="Classification clinique ESC/ERS 2022">
<div class="lab">Groupe 1 — Hypertension artérielle pulmonaire</div><p>1.1 idiopathique, avec répondeurs et non-répondeurs au test de vasoréactivité ; 1.2 héréditaire ; 1.3 associée à des médicaments ou des toxines ; 1.4 associée à une connectivite, à l’infection par le VIH, à l’hypertension portale, à une cardiopathie congénitale ou à la schistosomiase ; 1.5 HTAP avec atteinte veineuse ou capillaire (maladie veino-occlusive, hémangiomatose capillaire) ; 1.6 hypertension pulmonaire persistante du nouveau-né.</p>
<div class="lab">Groupe 2 — Cardiopathies gauches</div><p>Insuffisance cardiaque à fraction d’éjection préservée, modérément réduite ou réduite ; valvulopathies ; affections cardiovasculaires congénitales ou acquises entraînant une hypertension postcapillaire.</p>
<div class="lab">Groupe 3 — Maladies respiratoires et hypoxie</div><p>Maladies obstructives, restrictives, mixtes, syndromes d’hypoventilation, hypoxie sans maladie pulmonaire comme en altitude, anomalies du développement pulmonaire.</p>
<div class="lab">Groupe 4 — Obstructions artérielles pulmonaires</div><p>HTP thromboembolique chronique ; autres obstructions : sarcome ou autres tumeurs, artérites, sténoses congénitales, parasites dont l’échinococcose.</p>
<div class="lab">Groupe 5 — Mécanismes incertains ou multiples</div><p>Maladies hématologiques, systémiques, métaboliques, insuffisance rénale chronique, microangiopathie thrombotique tumorale, médiastinite fibrosante, cardiopathies congénitales complexes.</p>
<div class="lab">Conséquence pratique</div><p>Un patient peut cumuler plusieurs groupes. Le centre détermine la part dominante, qui oriente le traitement.</p></template>

<template data-pop="i27-vasculo" data-title="Vasculopathie proliférative de l’HTAP">
<div class="lab">Lésions</div><p>Hypertrophie de la média, muscularisation des artérioles, fibrose intimale concentrique ou excentrique, lésions plexiformes faites de canaux endothéliaux, inflammation périvasculaire.</p>
<div class="lab">Mécanisme</div><p>Les cellules endothéliales et musculaires lisses acquièrent une résistance à l’apoptose et une prolifération accrue. Un déficit de signalisation BMPR2, génétique ou acquis, une inflammation et un métabolisme cellulaire modifié y contribuent.</p>
<div class="lab">Conséquence</div><p>L’obstruction est en grande partie fixe. C’est pourquoi la plupart des patients ne répondent pas au test de vasoréactivité et pourquoi les traitements récents ciblent la prolifération.</p></template>

<template data-pop="i27-vch" data-title="Vasoconstriction pulmonaire hypoxique">
<div class="lab">Définition</div><p>Contraction des artérioles pulmonaires en réponse à une baisse de la pression alvéolaire en oxygène. Elle est propre à la circulation pulmonaire ; les artères systémiques se dilatent au contraire en hypoxie.</p>
<div class="lab">Mécanisme cellulaire</div><p>L’hypoxie inhibe des canaux potassiques sensibles à l’oxygène dans la cellule musculaire lisse. La membrane se dépolarise, les canaux calciques de type L s’ouvrent, le calcium entre et la cellule se contracte. Les mitochondries jouent le rôle de capteur d’oxygène.</p>
<div class="lab">Rôle physiologique</div><p>Le réflexe détourne le sang des zones mal ventilées et limite l’hypoxémie, par exemple dans une pneumonie lobaire.</p>
<div class="lab">Conséquence pathologique</div><p>Une hypoxie alvéolaire globale et chronique (BPCO sévère, hypoventilation, altitude) contracte tout le lit artériel et provoque un remodelage. L’oxygène de longue durée s’oppose à ce mécanisme.</p></template>

<template data-pop="i27-interdep" data-title="Interdépendance ventriculaire">
<div class="lab">Définition</div><p>Les deux ventricules partagent le septum et le péricarde. Le remplissage ou la pression de l’un modifient la forme et le remplissage de l’autre.</p>
<div class="lab">Dans l’hypertension pulmonaire</div><p>Le ventricule droit dilaté repousse le septum vers la gauche, surtout en fin de systole et au début de la diastole. Le ventricule gauche, comprimé, se remplit mal ; son volume d’éjection baisse alors que sa contractilité est normale.</p>
<div class="lab">Conséquence pratique</div><p>Un remplissage vasculaire massif chez un patient en défaillance droite aggrave la compression du ventricule gauche et peut faire chuter le débit. C’est pourquoi la volémie se gère avec prudence et souvent par diurétiques.</p></template>

<template data-pop="i27-syncope" data-title="Syncope d’effort">
<div class="lab">Mécanisme</div><p>À l’effort, les artérioles musculaires se dilatent et les résistances systémiques baissent. Un cœur sain compense par une hausse du débit. Dans l’hypertension pulmonaire sévère, le ventricule droit ne peut augmenter son débit face à des résistances pulmonaires fixes : la pression artérielle systémique chute et le cerveau est hypoperfusé. Une bradycardie réflexe ou une arythmie peuvent s’y ajouter.</p>
<div class="lab">Valeur</div><p>C’est un signe de gravité : elle classe le patient en classe fonctionnelle IV et fait partie des critères de risque élevé lorsqu’elle se répète.</p>
<div class="lab">Diagnostic différentiel</div><p>Rétrécissement aortique serré, cardiomyopathie hypertrophique obstructive, arythmie ventriculaire : tous trois limitent aussi le débit à l’effort. L’échocardiographie les distingue.</p>
<div class="lab">Conséquence pratique</div><p>Une syncope d’effort chez un patient dyspnéique impose une échocardiographie rapide et, si la probabilité d’hypertension pulmonaire est intermédiaire ou élevée, une orientation immédiate vers un centre.</p></template>

<template data-pop="i27-toxique" data-title="Médicaments et toxines associés à l’HTAP">
<div class="lab">Association certaine (ESC/ERS 2022)</div><p>Aminorex, benfluorex, dasatinib, dexfenfluramine, fenfluramine, méthamphétamines, huile de colza frelatée.</p>
<div class="lab">Association possible</div><p>Amphétamines, cocaïne, agents alkylants (cyclophosphamide, mitomycine C), bosutinib, ponatinib, carfilzomib, interférons alpha et bêta, leflunomide, diazoxide, L-tryptophane, phénylpropanolamine, millepertuis, solvants comme le trichloréthylène, antiviraux directs de l’hépatite C.</p>
<div class="lab">Histoire suisse</div><p>L’aminorex, un anorexigène commercialisé à la fin des années 1960, a provoqué une épidémie d’HTAP en Suisse, en Autriche et en Allemagne entre 1967 et 1972. Le nombre de cas a baissé après son retrait. Cet épisode a fondé la notion d’HTAP médicamenteuse.</p>
<div class="lab">Mécanisme</div><p>Les anorexigènes sérotoninergiques augmentent la sérotonine libre, qui stimule la prolifération des cellules musculaires lisses pulmonaires. Le dasatinib agit par un mécanisme différent, lié à l’inhibition de kinases ; l’HTAP peut régresser partiellement à son arrêt.</p>
<div class="lab">Conséquence pratique</div><p>Toute anamnèse d’HTAP recherche ces expositions, y compris anciennes et illicites. Le médicament suspect est arrêté.</p></template>

<template data-pop="i27-bmpr2" data-title="Gène BMPR2">
<div class="lab">Fonction</div><p>Le gène code le récepteur de type 2 des protéines morphogénétiques osseuses, de la famille du TGF-β. Ce récepteur transmet un signal antiprolifératif et antiapoptotique aux cellules vasculaires pulmonaires par les protéines SMAD 1, 5 et 8.</p>
<div class="lab">Pathologie</div><p>Une perte de fonction d’un allèle déséquilibre la signalisation au profit de l’activine et du TGF-β, qui favorisent la prolifération. Un second facteur (inflammation, hormones, autre variant) est souvent nécessaire au déclenchement.</p>
<div class="lab">Pénétrance</div><p>Selon l’ESC/ERS 2022, le risque de maladie au cours de la vie est d’environ 20 % chez un porteur, avec une pénétrance de 42 % chez la femme et 14 % chez l’homme.</p>
<div class="lab">Conséquence pratique</div><p>Le conseil génétique est proposé dans les formes idiopathiques, héréditaires et médicamenteuses. Les apparentés porteurs peuvent bénéficier d’un dépistage régulier en centre.</p></template>

<template data-pop="i27-sclero" data-title="HTAP de la sclérodermie systémique">
<div class="lab">Fréquence</div><p>Selon l’ESC/ERS 2022, la prévalence de l’HTAP dans la sclérodermie systémique est de 5 à 19 %, avec une incidence annuelle de 0,7 à 1,5 %. Elle survient surtout dans la forme cutanée limitée.</p>
<div class="lab">Dépistage</div><p>L’ESC/ERS 2022 recommande une évaluation annuelle du risque d’HTAP chez les patients sclérodermiques. Elle combine l’échocardiographie, les épreuves fonctionnelles avec DLCO et le NT-proBNP ; des algorithmes composites améliorent la sensibilité.</p>
<div class="lab">Particularités</div><p>Plusieurs mécanismes coexistent : vasculopathie artérielle, atteinte interstitielle (groupe 3), atteinte myocardique (groupe 2) et parfois atteinte veinulaire. Le cathétérisme est donc indispensable. Le pronostic est moins bon que dans la forme idiopathique, et l’anticoagulation y semble délétère.</p>
<div class="lab">Renvoi</div><p>Le phénomène de Raynaud et la sclérodermie sont développés dans le cours I73 — Autres maladies vasculaires périphériques (C-01-Cardiologie).</p></template>

<template data-pop="i27-popo" data-title="Hypertension portopulmonaire">
<div class="lab">Définition</div><p>HTAP survenant chez un patient atteint d’hypertension portale, cirrhotique ou non. Elle appartient au groupe 1. Elle concerne 1 à 2 % des patients avec hypertension portale (ESC/ERS 2022).</p>
<div class="lab">Mécanisme</div><p>Des substances vasoactives normalement épurées par le foie, comme la sérotonine et l’endothéline, atteignent le poumon par les dérivations portosystémiques. La circulation hyperdynamique augmente aussi le débit et la contrainte sur l’endothélium.</p>
<div class="lab">Dépistage</div><p>Les candidats à une transplantation hépatique reçoivent une échocardiographie. Chez eux, une pression systolique pulmonaire estimée &gt; 50 mmHg avait une sensibilité de 97 % et une spécificité de 77 % pour une HTAP modérée à sévère (ESC/ERS 2022). Le cathétérisme confirme.</p>
<div class="lab">Diagnostic différentiel</div><p>Le syndrome hépatopulmonaire est l’inverse hémodynamique : des capillaires pulmonaires dilatés provoquent une hypoxémie sans hypertension.</p>
<div class="lab">Conséquence pratique</div><p>Une hypertension portopulmonaire non contrôlée augmente fortement le risque de la transplantation hépatique. Le centre traite l’HTAP puis réévalue l’éligibilité. Les bêtabloquants prescrits pour les varices sont réévalués, car ils réduisent le débit cardiaque.</p></template>

<template data-pop="i27-eisen" data-title="Syndrome d’Eisenmenger">
<div class="lab">Définition</div><p>Inversion d’un shunt cardiaque gauche-droite en shunt droite-gauche, lorsque les résistances pulmonaires dépassent les résistances systémiques après des années de surcharge pulmonaire. La CIM-10-GM le code avec les malformations congénitales, hors I27.8.</p>
<div class="lab">Clinique</div><p>Cyanose, polyglobulie secondaire, hippocratisme digital, hémoptysies, embolies paradoxales, abcès cérébraux, goutte.</p>
<div class="lab">Conduite</div><p>La fermeture du défaut est contre-indiquée, car le shunt décharge le ventricule droit. Les saignées ne se font qu’en cas de symptômes d’hyperviscosité, et la carence martiale se corrige. La grossesse est formellement déconseillée. Le bosentan a amélioré la capacité d’effort dans l’essai BREATHE-5.</p>
<div class="lab">Renvoi</div><p>Les formes cliniques sont détaillées dans le cours Q21 — Malformations congénitales des cloisons cardiaques (C-01-Cardiologie).</p></template>

<template data-pop="i27-mvo" data-title="Maladie veino-occlusive pulmonaire">
<div class="lab">Définition</div><p>Forme du groupe 1 où une fibrose intimale obstrue les veinules et les petites veines pulmonaires, parfois associée à une prolifération capillaire. La CIM-10-GM la range sous I27.08.</p>
<div class="lab">Causes</div><p>Variants bialléliques du gène EIF2AK4 dans les formes héréditaires ; expositions aux solvants organiques, notamment le trichloréthylène, et à certaines chimiothérapies alkylantes.</p>
<div class="lab">Indices diagnostiques</div><p>DLCO très basse, hypoxémie marquée, et au scanner la triade lignes septales, verre dépoli centrolobulaire et adénopathies médiastinales. Le cathétérisme montre une PAPO normale, car l’occlusion du ballon mesure la pression en aval de veines encore perméables.</p>
<div class="lab">Piège</div><p>Les vasodilatateurs pulmonaires dilatent les artérioles en amont de l’obstacle veineux ; la pression capillaire monte et un œdème pulmonaire peut survenir. La biopsie pulmonaire est dangereuse et n’est pas recommandée.</p>
<div class="lab">Conséquence pratique</div><p>Le patient est adressé tôt pour une transplantation pulmonaire, seul traitement efficace.</p></template>

<template data-pop="i27-g2" data-title="Hypertension pulmonaire des cardiopathies gauches">
<div class="lab">Mécanisme</div><p>L’élévation de la pression de l’oreillette gauche remonte passivement dans les veines et les capillaires pulmonaires. Après des années, une partie des patients développe un remodelage artériel : c’est la forme combinée, de plus mauvais pronostic.</p>
<div class="lab">Profil qui oriente</div><p>Âge &gt; 65 ans, obésité, hypertension artérielle, diabète, fibrillation atriale, oreillette gauche dilatée, dysfonction diastolique à l’échocardiographie, coronaropathie. Le score H2FPEF estime la probabilité d’insuffisance cardiaque à fraction d’éjection préservée.</p>
<div class="lab">Diagnostic</div><p>PAPO &gt; 15 mmHg au cathétérisme. En cas de PAPO limite, un remplissage d’environ 500 mL en 5 à 10 minutes avec une PAPO ≥ 18 mmHg, ou une pente PAPO/débit &gt; 2 mmHg/L/min à l’effort, révèle la cause gauche (ESC/ERS 2022).</p>
<div class="lab">Traitement</div><p>Celui de la cardiopathie. Les médicaments de l’HTAP ne sont pas recommandés dans le groupe 2.</p>
<div class="lab">Renvoi</div><p>Voir le cours I50 — Insuffisance cardiaque (C-01-Cardiologie) et les cours de valvulopathies.</p></template>

<template data-pop="i27-g3" data-title="Hypertension pulmonaire des maladies respiratoires">
<div class="lab">Mécanismes</div><p>Vasoconstriction hypoxique, destruction du lit capillaire par l’emphysème ou la fibrose, compression vasculaire par l’hyperinflation, inflammation et remodelage liés au tabac.</p>
<div class="lab">Gravité</div><p>La forme sévère est définie par des RVP &gt; 5 unités Wood (ESC/ERS 2022). Elle a un pronostic plus sombre et mérite l’avis d’un centre, car une autre cause peut s’y ajouter.</p>
<div class="lab">Phénotype vasculaire</div><p>Certains patients ont une hypertension sévère avec une atteinte ventilatoire légère et une DLCO très basse. Ils ressemblent à l’HTAP et sont adressés en centre.</p>
<div class="lab">Traitement</div><p>Traitement de la maladie pulmonaire, oxygène de longue durée, ventilation non invasive si hypoventilation, réadaptation. Tréprostinil inhalé envisageable dans les pneumopathies interstitielles ; inhibiteur de la phosphodiestérase de type 5 au cas par cas dans les formes sévères.</p>
<div class="lab">Renvoi</div><p>Voir le cours J44 — Bronchopneumopathie chronique obstructive (P-02-Pneumologie).</p></template>

<template data-pop="i27-g5" data-title="Groupe 5 : mécanismes incertains ou multiples">
<div class="lab">Exemples et mécanismes</div><p>Drépanocytose et thalassémie : hémolyse qui consomme le monoxyde d’azote, thromboses, asplénie. Syndromes myéloprolifératifs : thromboses, hématopoïèse extramédullaire, hyperdébit. Sarcoïdose : fibrose, compression des vaisseaux par des adénopathies, granulomes vasculaires. Insuffisance rénale chronique : surcharge hydrosodée, fistule de dialyse à haut débit, dysfonction gauche. Médiastinite fibrosante : compression des artères et des veines pulmonaires. Microangiopathie thrombotique tumorale : emboles tumoraux microscopiques, évolution rapide.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement est celui de la cause. Les médicaments de l’HTAP n’ont pas de preuve solide dans ce groupe et ne s’emploient qu’au cas par cas en centre.</p></template>

<template data-pop="i27-cpc" data-title="Cœur pulmonaire chronique">
<div class="lab">Définition</div><p>Hypertrophie, puis dilatation et défaillance du ventricule droit, causées par une maladie qui atteint la fonction ou la structure du poumon, de la paroi thoracique ou de la commande ventilatoire. La définition historique de l’OMS (1963) exclut les atteintes pulmonaires secondaires à une cardiopathie gauche.</p>
<div class="lab">Codage</div><p>La CIM-10-GM range le cœur pulmonaire chronique sans autre précision sous I27.9. Lorsque le mécanisme est établi, le code I27.22 (maladie du poumon et hypoxie) ou I27.1 (cyphoscoliose) est plus précis.</p>
<div class="lab">Signes</div><p>Turgescence jugulaire, œdèmes, hépatomégalie, chez un patient hypoxémique, souvent hypercapnique. L’ECG montre des signes droits ; l’échocardiographie, un ventricule droit hypertrophié et dilaté.</p>
<div class="lab">Traitement</div><p>Correction de l’hypoxémie par l’oxygène de longue durée, ventilation non invasive en cas d’hypercapnie, diurétiques prudents, traitement de la maladie pulmonaire. Une alcalose métabolique induite par les diurétiques peut aggraver l’hypoventilation : la kaliémie et les bicarbonates se surveillent.</p>
<div class="lab">Piège</div><p>Les œdèmes du patient atteint de BPCO hypercapnique ne traduisent pas toujours une défaillance droite : l’hypercapnie et l’hypoxémie stimulent aussi la rétention hydrosodée rénale.</p></template>

<template data-pop="i27-cyphose" data-title="Cœur pulmonaire de la cyphoscoliose">
<div class="lab">Mécanisme</div><p>La déformation rigidifie la cage thoracique, réduit la compliance et les volumes pulmonaires et désavantage les muscles respiratoires. Le patient respire vite et superficiellement ; la ventilation alvéolaire baisse, d’abord en sommeil paradoxal, où seuls le diaphragme et des muscles affaiblis travaillent.</p>
<div class="lab">Gravité</div><p>Dans les séries classiques (Bergofsky, 1979), l’insuffisance respiratoire concerne surtout les déformations sévères, avec un angle de Cobb souvent supérieur à 100°, et les déformations de début précoce. Une faiblesse musculaire associée aggrave le risque.</p>
<div class="lab">Diagnostic</div><p>Spirométrie avec syndrome restrictif, gazométrie diurne, oxymétrie et capnographie nocturnes ou polygraphie, échocardiographie.</p>
<div class="lab">Traitement</div><p>La ventilation non invasive nocturne corrige l’hypoventilation, améliore la PaCO₂ diurne et la survie, et peut faire régresser l’hypertension pulmonaire. L’oxygène seul, sans ventilation, peut aggraver l’hypercapnie.</p></template>

<template data-pop="i27-sarcome" data-title="Sarcome intimal de l’artère pulmonaire">
<div class="lab">Définition</div><p>Tumeur maligne rare née de l’intima du tronc ou des artères pulmonaires proximales. Elle pousse dans la lumière et l’obstrue.</p>
<div class="lab">Indices</div><p>Elle imite une embolie pulmonaire ou une HTP thromboembolique chronique. L’orientent : l’absence de réponse à l’anticoagulation, une perte de poids, un syndrome inflammatoire, une masse qui remplit la lumière et la distend, une extension à travers la paroi ou vers la valve pulmonaire, une captation en tomographie par émission de positons.</p>
<div class="lab">Conséquence pratique</div><p>Tout « caillot » proximal atypique est discuté en centre. Le traitement repose sur la résection chirurgicale, et le pronostic reste réservé.</p></template>
