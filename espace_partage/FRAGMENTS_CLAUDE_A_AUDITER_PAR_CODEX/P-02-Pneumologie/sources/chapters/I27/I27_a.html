<section class="ilot" id="i27-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 38 ans, enseignante à Neuchâtel, consulte pour un essoufflement qui s’aggrave depuis dix-huit mois. Elle monte aujourd’hui un étage en s’arrêtant une fois. Il y a trois semaines, elle a perdu connaissance quelques secondes en montant rapidement une rue en pente. Deux médecins ont déjà conclu à un déconditionnement, puis à un asthme, sans amélioration sous inhalateur. Sa saturation au repos est de 95 %, sa radiographie thoracique a été jugée « sans particularité ».</p>
<div class="key"><b>Question clinique.</b> Une dyspnée d’effort inexpliquée avec syncope d’effort traduit-elle une maladie de la circulation pulmonaire ? Le médecin doit répondre à trois questions successives. La pression pulmonaire est-elle élevée ? Quel mécanisme l’élève, c’est-à-dire quel groupe ? Quel est le risque de décès à un an, qui fixe l’intensité du traitement ?</div>
<p>L’hypertension pulmonaire n’est pas une maladie unique. C’est un état hémodynamique commun à des affections très différentes : une insuffisance cardiaque gauche, une maladie pulmonaire chronique, des caillots organisés ou une vasculopathie primitive des petites artères. Le traitement dépend entièrement du mécanisme. Un vasodilatateur pulmonaire sauve des vies dans l’hypertension artérielle pulmonaire, mais il peut provoquer un œdème pulmonaire lorsque la pression est élevée par un ventricule gauche défaillant.</p>
<p>À la fin de ce cours, le médecin assistant sait reconnaître un tableau suspect malgré des examens d’orientation normaux. Il sait lire une probabilité échocardiographique, interpréter un cathétérisme cardiaque droit et classer le patient dans l’un des cinq groupes de l’ESC/ERS 2022. Il connaît la stratification du risque et les grandes lignes du traitement en centre. Il sait aussi rechercher systématiquement une maladie thromboembolique chronique, qui est curable, et reconnaître une fistule artérioveineuse pulmonaire, qui expose à l’accident vasculaire cérébral paradoxal.</p>
<div class="key"><b>Prérequis.</b> Le cours suppose connues la <button class="w" data-k="i27-rvp">résistance vasculaire pulmonaire (calcul et signification)</button>, la <button class="w" data-k="i27-papo">pression artérielle pulmonaire d’occlusion (reflet de la pression gauche)</button> et la physiologie du ventricule droit développée dans l’onglet Sciences fondamentales. L’embolie pulmonaire aiguë est traitée dans le cours <a href="#/entry/I26">I26 — Embolie pulmonaire (P-02-Pneumologie)</a> ; l’insuffisance cardiaque gauche dans le cours <a href="#/entry/I50">I50 — Insuffisance cardiaque (C-01-Cardiologie)</a>.</div>
</section>

<section class="ilot" id="i27-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La circulation pulmonaire normale est un circuit à basse pression. Chez l’adulte sain au repos, la pression artérielle pulmonaire moyenne vaut environ 14 mmHg, et la limite supérieure de la normale se situe vers 20 mmHg. Une pression plus élevée signifie que le ventricule droit pousse le sang contre un obstacle anormal ou contre une pression d’aval anormale.</p>
<h3>1.1 Définition hémodynamique (ESC/ERS 2022)</h3>
<p>L’ESC/ERS 2022 définit l’hypertension pulmonaire (HTP) par une <b>pression artérielle pulmonaire moyenne (PAPm) supérieure à 20 mmHg au repos</b>, mesurée par cathétérisme cardiaque droit. Le seuil antérieur de 25 mmHg a été abaissé parce que les sujets entre 21 et 24 mmHg ont une mortalité déjà augmentée. Voir la <button class="w" data-k="i27-def">définition hémodynamique et son historique</button>.</p>
<p>La PAPm seule ne dit pas où se situe l’obstacle. Deux autres mesures le localisent. La <button class="w" data-k="i27-papo">PAPO (pression capillaire « bloquée »)</button> estime la pression de l’oreillette gauche. Les <button class="w" data-k="i27-rvp">RVP (pression motrice divisée par le débit)</button> mesurent la résistance propre du lit artériel pulmonaire. Le tableau suivant croise ces trois mesures ; il répond à la question décisive : l’hypertension vient-elle des artères pulmonaires, du cœur gauche, ou des deux ?</p>
<table class="t"><tr><th>Profil</th><th>PAPm</th><th>PAPO</th><th>RVP</th><th>Groupes habituels</th></tr>
<tr><td>HTP précapillaire</td><td>&gt; 20 mmHg</td><td>≤ 15 mmHg</td><td>&gt; 2 unités Wood</td><td>1, 3, 4, 5</td></tr>
<tr><td>HTP postcapillaire isolée</td><td>&gt; 20 mmHg</td><td>&gt; 15 mmHg</td><td>≤ 2 unités Wood</td><td>2, 5</td></tr>
<tr><td>HTP postcapillaire et précapillaire combinée</td><td>&gt; 20 mmHg</td><td>&gt; 15 mmHg</td><td>&gt; 2 unités Wood</td><td>2, 5</td></tr>
<tr><td>HTP d’effort</td><td colspan="3">Pente PAPm/débit cardiaque &gt; 3 mmHg/L/min entre repos et effort</td><td>Maladie débutante</td></tr></table>
<p>La lecture commence par la PAPO. Une PAPO basse signifie que le cœur gauche se vide normalement : l’obstacle est en amont, dans les artères ou les artérioles pulmonaires. Une PAPO élevée signifie que la pression gauche remonte passivement dans le poumon. Les RVP départagent ensuite la forme postcapillaire isolée et la forme combinée, où un remodelage artériel s’est ajouté. Exemple : PAPm 34 mmHg, PAPO 9 mmHg, débit 4,2 L/min. Les RVP valent (34 − 9)/4,2 = 6,0 unités Wood : l’hypertension est précapillaire. L’ESC/ERS 2022 nomme enfin « HTP non classée » le cas rare d’une PAPm &gt; 20 mmHg avec PAPO ≤ 15 mmHg et RVP ≤ 2 unités Wood, observé surtout en cas de débit élevé.</p>
<div class="trap"><span class="k">Piège</span>Une pression systolique pulmonaire estimée à l’échocardiographie n’est pas une mesure. C’est un calcul à partir de la vitesse de régurgitation tricuspide et d’une pression auriculaire droite supposée. L’échocardiographie fournit une <b>probabilité</b> ; seul le cathétérisme droit pose le diagnostic et le profil hémodynamique.</div>
<h3>1.2 Classification clinique en cinq groupes</h3>
<p>La classification clinique regroupe les causes qui partagent un mécanisme, une présentation et une stratégie thérapeutique. Elle sert à une décision précise : un patient du groupe 1 reçoit des vasodilatateurs pulmonaires spécifiques, un patient du groupe 2 n’en reçoit pas. Le détail complet figure dans la <button class="w" data-k="i27-groupes">classification ESC/ERS 2022 détaillée</button>.</p>
<table class="t"><tr><th>Groupe</th><th>Mécanisme</th><th>Exemples</th><th>Traitement principal</th></tr>
<tr><td>1. Hypertension artérielle pulmonaire (HTAP)</td><td>Vasculopathie proliférative des petites artères</td><td>Idiopathique, héréditaire, médicamenteuse, connectivite, hypertension portale, VIH, cardiopathie congénitale</td><td>Vasodilatateurs pulmonaires spécifiques, sotatercept</td></tr>
<tr><td>2. HTP des cardiopathies gauches</td><td>Transmission passive de la pression gauche</td><td>Insuffisance cardiaque à fraction d’éjection préservée, valvulopathie mitrale ou aortique</td><td>Traitement de la cardiopathie</td></tr>
<tr><td>3. HTP des maladies respiratoires ou de l’hypoxie</td><td>Vasoconstriction hypoxique, perte du lit capillaire</td><td>BPCO, pneumopathie interstitielle, hypoventilation, haute altitude</td><td>Traitement de la maladie pulmonaire, oxygène</td></tr>
<tr><td>4. HTP des obstructions artérielles pulmonaires</td><td>Obstruction mécanique</td><td>HTP thromboembolique chronique, sarcome de l’artère pulmonaire</td><td>Endartériectomie, angioplastie, riociguat, anticoagulation</td></tr>
<tr><td>5. HTP de mécanisme incertain ou multifactoriel</td><td>Plusieurs mécanismes</td><td>Anémies hémolytiques, syndromes myéloprolifératifs, sarcoïdose, insuffisance rénale chronique</td><td>Traitement de la cause</td></tr></table>
<p>La fréquence est inverse de l’attention médiatique : les groupes 2 et 3 représentent la grande majorité des patients, alors que le groupe 1 reste rare. Le groupe 4 mérite une attention particulière, car c’est le seul groupe où une chirurgie peut guérir. Exemple : un homme de 70 ans, porteur d’une insuffisance cardiaque à fraction d’éjection préservée et d’une fibrillation atriale, appartient presque certainement au groupe 2 ; une femme de 35 ans sans cardiopathie ni pneumopathie évoque d’abord le groupe 1 ou le groupe 4.</p>
<h3>1.3 Classification fonctionnelle</h3>
<p>La <b>classe fonctionnelle de l’OMS</b> adapte la classification NYHA à l’hypertension pulmonaire. La classe I ne comporte aucune limitation. La classe II comporte une gêne aux activités ordinaires. La classe III comporte une gêne aux activités plus légères que l’ordinaire. La classe IV comporte une dyspnée au moindre effort ou au repos, ou des signes d’insuffisance ventriculaire droite. La différence avec la NYHA tient à la <b>syncope</b> : une syncope d’effort classe déjà le patient en IV, car elle traduit un débit cardiaque incapable d’augmenter.</p>
<h3>1.4 Codage CIM-10-GM 2024 et périmètre du cours</h3>
<p>La CIM-10-GM range ces affections dans le bloc I26–I28. Le tableau suivant rattache chaque sous-code à son îlot. Il évite de chercher une forme ailleurs et montre que la classification CIM-10-GM ne suit pas exactement les cinq groupes cliniques.</p>
<table class="t"><tr><th>Code</th><th>Intitulé CIM-10-GM 2024</th><th>Correspondance clinique</th><th>Îlot</th></tr>
<tr><td>I27.00</td><td>HTAP idiopathique et héréditaire</td><td>Groupe 1.1 et 1.2</td><td>4, 9</td></tr>

<tr><td>I27.1</td><td>Cardiopathie due à une cyphoscoliose</td><td>Groupe 3 (hypoventilation)</td><td>10</td></tr>

<tr><td>I27.22</td><td>HTP lors de maladie du poumon et hypoxie</td><td>Groupe 3</td><td>10</td></tr>
<tr><td>I27.28</td><td>Autres HTP secondaires précisées</td><td>Groupe 5 surtout</td><td>10</td></tr>
<tr><td>I27.8</td><td>Autres affections cardiopulmonaires précisées</td><td>Formes rares ; le syndrome d’Eisenmenger est exclu et codé avec les malformations congénitales</td><td>4, 14</td></tr>

<p>Le point utile est le suivant : le code I27.9 « cœur pulmonaire chronique » décrit une conséquence, l’atteinte du ventricule droit, et non une cause. Dès que le cathétérisme et le bilan précisent le groupe, le codage gagne à utiliser le sous-code de mécanisme. L’embolie pulmonaire aiguë (I26) et le cœur pulmonaire aigu qu’elle provoque restent dans le cours I26.</p>
<div class="key"><b>À retenir.</b> L’hypertension pulmonaire se définit par une PAPm &gt; 20 mmHg au cathétérisme droit. La PAPO et les RVP localisent l’obstacle : précapillaire si PAPO ≤ 15 mmHg et RVP &gt; 2 unités Wood. Les cinq groupes orientent le traitement, et seul le groupe 1 relève des vasodilatateurs spécifiques. La partie suivante montre combien chaque groupe pèse en pratique.</div>
</section>

<section class="ilot" id="i27-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’ESC/ERS 2022 estime que l’hypertension pulmonaire touche environ <b>1 % de la population mondiale</b>, avec une fréquence plus élevée après 65 ans. Cette fréquence globale reflète surtout les groupes 2 et 3, car l’insuffisance cardiaque gauche et les maladies pulmonaires chroniques sont fréquentes. Les études de population fiables pour chaque groupe restent toutefois rares, parce que le diagnostic exige un cathétérisme.</p>
<h3>2.1 Fréquence selon le groupe</h3>
<p>Les ordres de grandeur suivants proviennent de l’ESC/ERS 2022 pour les pays à revenu élevé. Ils permettent de situer la probabilité d’un groupe face à un patient donné.</p>
<table class="t"><tr><th>Population</th><th>Donnée ESC/ERS 2022</th><th>Lecture clinique</th></tr>
<tr><td>HTAP (groupe 1)</td><td>Incidence environ 6 et prévalence 48 à 55 cas par million d’adultes</td><td>Maladie rare : un généraliste en verra peu, d’où le retard diagnostique</td></tr>
<tr><td>Forme idiopathique</td><td>50 à 60 % des HTAP des registres</td><td>La forme « sans cause » est la plus fréquente du groupe 1</td></tr>
<tr><td>HTP thromboembolique chronique</td><td>Incidence 2 à 6 et prévalence 26 à 38 cas par million d’adultes</td><td>Sous-diagnostiquée, car l’embolie initiale manque souvent</td></tr>
<tr><td>Valvulopathie mitrale sévère symptomatique</td><td>HTP chez 60 à 70 %</td><td>Le groupe 2 domine en cardiologie</td></tr>
<tr><td>Fibrose pulmonaire idiopathique</td><td>PAPm ≥ 25 mmHg chez 8 à 15 % au bilan initial, plus de 60 % en phase terminale</td><td>Le groupe 3 suit la progression de la maladie pulmonaire</td></tr>
<tr><td>Sclérodermie systémique</td><td>Prévalence de l’HTAP 5 à 19 % ; incidence annuelle 0,7 à 1,5 %</td><td>Justifie un dépistage annuel</td></tr></table>
<p>Ce tableau se lit en partant du patient. Chez un sujet âgé avec une cardiopathie gauche, une hypertension pulmonaire est le plus souvent du groupe 2. Chez une femme jeune sans comorbidité, le groupe 1 devient plausible malgré sa rareté. L’erreur fréquente consiste à attribuer une dyspnée progressive au « manque d’entraînement » sans échocardiographie.</p>
<h3>2.2 Données suisses</h3>
<p>Le registre suisse de l’hypertension pulmonaire a inclus 996 patients entre 1998 et 2012, dans cinq hôpitaux universitaires et huit hôpitaux associés (Mueller-Mottet et collaborateurs, Respiration 2015). Il comptait 549 HTAP, 249 HTP thromboemboliques chroniques, 127 HTP de cause respiratoire, 36 HTP de cardiopathie gauche et 35 formes diverses. Ce recrutement n’est pas représentatif de la population : il reflète les patients adressés aux centres, d’où la sous-représentation du groupe 2. La survie sans événement atteignait 84, 72, 64 et 58 % à un, deux, trois et quatre ans. Elle s’améliorait pour l’HTAP et l’HTP thromboembolique chronique diagnostiquées après 2008.</p>
<p>La Suisse a connu un épisode historique : entre 1967 et 1972, une épidémie d’HTAP a suivi la commercialisation d’un anorexigène, l’aminorex, en Suisse, en Autriche et en Allemagne. Elle a établi le lien entre certains <button class="w" data-k="i27-toxique">médicaments et toxines et l’HTAP</button>.</p>
<h3>2.3 Pronostic</h3>
<p>Sans traitement spécifique, l’HTAP idiopathique avait une survie médiane inférieure à trois ans dans les registres anciens. Les traitements actuels ont nettement amélioré ce pronostic, sans guérir la maladie. Le pronostic dépend du <b>ventricule droit</b> et non du chiffre de pression : le patient meurt d’insuffisance ventriculaire droite. C’est pourquoi le risque se mesure par la classe fonctionnelle, la distance de marche, les peptides natriurétiques et l’hémodynamique droite (îlot 9).</p>
<div class="key"><b>À retenir.</b> L’hypertension pulmonaire est fréquente (environ 1 % de la population) mais l’HTAP est rare (environ 50 cas par million). Le retard diagnostique reste la règle dans l’HTAP. Le pronostic se lit sur la fonction du ventricule droit. La partie suivante explique pourquoi ce ventricule défaille.</div>
</section>

<section class="ilot" id="i27-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie suit une chaîne : une agression élève la résistance ou la pression d’aval, le ventricule droit s’adapte, puis il décompense. Chaque maillon explique un symptôme, et chaque traitement agit sur un maillon précis.</p>
<h3>3.1 État normal</h3>
<p>Le poumon reçoit la totalité du débit cardiaque, soit environ 5 L/min au repos, sous une pression motrice faible. Les RVP normales valent environ un dixième des résistances systémiques. Lors d’un effort, le débit peut tripler alors que la pression ne monte que modérément. Deux mécanismes le permettent : le <b>recrutement</b> de capillaires fermés au repos et la <b>distension</b> des vaisseaux déjà ouverts. Le ventricule droit, à paroi mince, est conçu pour éjecter un grand volume contre une faible pression. Il tolère mal une élévation brutale de sa postcharge.</p>
<h3>3.2 Première charnière : élévation de la postcharge droite</h3>
<p>La pression artérielle pulmonaire moyenne obéit à une relation simple : PAPm = PAPO + débit × RVP. Trois termes peuvent donc l’élever. Dans le groupe 2, la PAPO monte parce que le cœur gauche se remplit mal. Dans le groupe 1, les RVP montent par une <button class="w" data-k="i27-vasculo">vasculopathie proliférative (média, intima, lésions plexiformes)</button>. Dans le groupe 3, elles montent par <button class="w" data-k="i27-vch">vasoconstriction pulmonaire hypoxique</button> et perte du lit capillaire. Dans le groupe 4, des caillots organisés obstruent les artères proximales.</p>
<p>Dans l’HTAP, trois voies endothéliales sont déséquilibrées : excès d’endothéline 1, vasoconstrictrice et mitogène ; déficit en monoxyde d’azote ; déficit en prostacycline. Une quatrième voie, celle des protéines morphogénétiques osseuses et de l’activine, oriente les cellules vers la prolifération. Chaque voie est la cible d’une classe de médicaments (onglet Sciences fondamentales, biochimie).</p>
<h3>3.3 Deuxième charnière : adaptation du ventricule droit</h3>
<p>Face à une postcharge qui augmente lentement, le ventricule droit s’hypertrophie. Cette <b>hypertrophie concentrique</b> maintient le volume d’éjection, et le patient reste longtemps peu symptomatique au repos. C’est la phase de couplage conservé entre le ventricule et l’artère pulmonaire. Une montée brutale de la postcharge, comme dans l’embolie pulmonaire massive, ne laisse pas ce temps d’adaptation : le ventricule se dilate d’emblée.</p>
<h3>3.4 Troisième charnière : découplage et dilatation</h3>
<p>Quand l’hypertrophie ne suffit plus, le ventricule droit se dilate. L’anneau tricuspide s’élargit et provoque une insuffisance tricuspide. Le septum interventriculaire bombe vers la gauche et comprime le ventricule gauche : c’est l’<button class="w" data-k="i27-interdep">interdépendance ventriculaire</button>. Le ventricule gauche, sous-rempli, éjecte moins, et le débit cardiaque chute. La pression du ventricule droit, élevée en systole comme en diastole, réduit la perfusion coronaire droite au moment où les besoins en oxygène augmentent : une ischémie ventriculaire droite s’installe et aggrave la dysfonction.</p>
<h3>3.5 Quatrième charnière : manifestations</h3>
<p>Le débit cardiaque ne peut plus augmenter à l’effort. Les muscles se vasodilatent pendant l’exercice alors que le débit reste fixe : la pression artérielle systémique chute, et une <button class="w" data-k="i27-syncope">syncope d’effort</button> survient. La congestion veineuse systémique explique la turgescence jugulaire, l’hépatomégalie, les œdèmes et l’ascite. L’ischémie du ventricule droit explique un angor d’effort. L’hypoxémie résulte d’un débit cardiaque bas, qui abaisse la saturation du sang veineux mêlé, et parfois d’un shunt par un foramen ovale réouvert.</p>

<p>La figure se lit de gauche à droite pour chaque circuit. Le point à regarder d’abord est la PAPO : identique dans les deux cas, elle prouve que le cœur gauche n’est pas en cause dans l’exemple de droite. L’élévation de la PAPm vient donc des RVP, multipliées par neuf. La baisse du débit, de 5 à 3,5 L/min, signe un ventricule droit déjà en difficulté : c’est elle, plus que la pression, qui annonce le risque de décès.</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> Les vasodilatateurs pulmonaires et le sotatercept abaissent les RVP du groupe 1. L’oxygène lève la vasoconstriction hypoxique du groupe 3. L’endartériectomie retire l’obstacle du groupe 4. Les diurétiques soulagent la congestion due au ventricule droit défaillant, sans agir sur la cause. Dans le groupe 2, abaisser les RVP sans abaisser la PAPO augmente le débit vers un cœur gauche qui ne peut l’accepter : d’où le risque d’œdème pulmonaire.</div>
</section>

<section class="ilot" id="i27-4"><h2><span class="n">4</span>Étiologies par groupe</h2>
<p>Chercher la cause d’une hypertension pulmonaire revient à parcourir les groupes du plus fréquent au plus rare, sans oublier le groupe 4, curable. Cette partie présente, pour chaque groupe, les causes à connaître et l’indice clinique qui les fait suspecter.</p>
<h3>4.1 Groupe 1 : hypertension artérielle pulmonaire</h3>
<div class="two">
<div class="card"><h4>Idiopathique et héréditaire</h4><p>La forme idiopathique est un diagnostic d’exclusion. Les formes héréditaires sont surtout liées à des variants du gène <button class="w" data-k="i27-bmpr2">BMPR2 (récepteur des protéines morphogénétiques osseuses)</button>. Selon l’ESC/ERS 2022, le risque de développer une HTAP au cours de la vie est d’environ 20 % chez un porteur ; la pénétrance atteint 42 % chez la femme et 14 % chez l’homme.</p></div>
<div class="card"><h4>Médicaments et toxines</h4><p>Les associations certaines comprennent l’aminorex, le benfluorex, la fenfluramine, la dexfenfluramine, les méthamphétamines, le dasatinib et l’huile de colza frelatée. Le détail figure dans la fiche <button class="w" data-k="i27-toxique">médicaments et toxines</button>. Une HTAP sous dasatinib peut régresser à l’arrêt du médicament.</p></div>
<div class="card"><h4>Connectivites</h4><p>La <button class="w" data-k="i27-sclero">sclérodermie systémique (dépistage annuel)</button> est la connectivite la plus souvent en cause. Le lupus et la connectivite mixte peuvent aussi se compliquer d’HTAP. Le phénomène de Raynaud et les télangiectasies orientent.</p></div>
<div class="card"><h4>Hypertension portale</h4><p>L’<button class="w" data-k="i27-popo">hypertension portopulmonaire</button> concerne 1 à 2 % des patients avec hypertension portale (ESC/ERS 2022). Elle modifie l’éligibilité à la transplantation hépatique.</p></div>
<div class="card"><h4>Infection par le VIH</h4><p>La prévalence citée par l’ESC/ERS 2022 est d’environ 0,5 %. Le mécanisme associe l’inflammation chronique et des protéines virales qui lèsent l’endothélium.</p></div>
<div class="card"><h4>Cardiopathies congénitales et schistosomiase</h4><p>Un shunt gauche-droite prolongé expose les artères pulmonaires à un débit et une pression excessifs, jusqu’au <button class="w" data-k="i27-eisen">syndrome d’Eisenmenger</button>. La schistosomiase est une cause fréquente dans le monde, rare en Suisse hors migration.</p></div></div>
<p>La <button class="w" data-k="i27-mvo">maladie veino-occlusive pulmonaire</button> partage la présentation de l’HTAP, mais l’obstacle touche aussi les veinules. Elle est cruciale à reconnaître : un vasodilatateur pulmonaire peut y provoquer un œdème pulmonaire.</p>
<h3>4.2 Groupe 2 : cardiopathies gauches</h3>
<p>C’est le groupe le plus fréquent. Il comprend l’insuffisance cardiaque à fraction d’éjection préservée, l’insuffisance cardiaque à fraction d’éjection réduite et les valvulopathies mitrales et aortiques. Le profil typique est un sujet de plus de 65 ans, obèse, hypertendu, diabétique, avec une fibrillation atriale et une oreillette gauche dilatée. Voir la fiche <button class="w" data-k="i27-g2">HTP des cardiopathies gauches</button>.</p>
<h3>4.3 Groupe 3 : maladies respiratoires et hypoxie</h3>
<p>Les causes principales sont la BPCO, les pneumopathies interstitielles, la combinaison emphysème et fibrose, les syndromes d’hypoventilation dont la cyphoscoliose sévère, et l’hypoxie chronique d’altitude. Les apnées obstructives du sommeil isolées n’élèvent habituellement la pression que modestement. Voir la fiche <button class="w" data-k="i27-g3">HTP des maladies respiratoires</button>.</p>
<h3>4.4 Groupe 4 : obstructions artérielles pulmonaires</h3>
<p>L’<button class="w" data-k="i27-cteph">HTP thromboembolique chronique</button> en est la forme principale. D’autres obstacles sont rares : sarcome intimal de l’artère pulmonaire, autres tumeurs, artérites dont l’artérite de Takayasu, sténoses congénitales et kystes hydatiques. Le <button class="w" data-k="i27-sarcome">sarcome de l’artère pulmonaire</button> imite une embolie chronique.</p>
<h3>4.5 Groupe 5 : mécanismes incertains ou multiples</h3>
<p>Ce groupe réunit des maladies hématologiques (anémies hémolytiques chroniques comme la drépanocytose, syndromes myéloprolifératifs), systémiques (sarcoïdose, histiocytose langerhansienne pulmonaire, neurofibromatose de type 1), métaboliques (glycogénoses, maladie de Gaucher), l’insuffisance rénale chronique avec ou sans hémodialyse, la microangiopathie thrombotique tumorale pulmonaire, la médiastinite fibrosante et certaines cardiopathies congénitales complexes. Voir la fiche <button class="w" data-k="i27-g5">groupe 5</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure au groupe 3 chez tout patient porteur d’une BPCO. Une BPCO légère n’explique pas une hypertension sévère avec des RVP &gt; 5 unités Wood. Une telle discordance impose de chercher une autre cause, notamment une maladie thromboembolique chronique, et d’adresser le patient à un centre.</div>
<div class="key"><b>À retenir.</b> Le groupe 2 est le plus fréquent, le groupe 1 le plus traitable par médicaments, le groupe 4 le seul curable par chirurgie. Une hypertension disproportionnée à la maladie cardiaque ou pulmonaire visible doit faire chercher une seconde cause. L’anamnèse, décrite ensuite, fournit les premiers indices.</div>
</section>

<section class="ilot" id="i27-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Les symptômes de l’hypertension pulmonaire sont ceux d’un débit cardiaque qui ne s’adapte pas à l’effort. Ils sont aspécifiques au début, ce qui explique un délai diagnostique souvent supérieur à deux ans dans l’HTAP. L’anamnèse cherche trois choses : le profil d’effort, les signes de gravité et la cause.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Antécédents orientant vers un groupe</h4><p><button class="w" data-k="i27-cteph">Embolie pulmonaire ou thrombose veineuse</button> ; cardiopathie gauche, hypertension artérielle, fibrillation atriale ; BPCO, fibrose, apnées du sommeil, déformation thoracique ; connectivite, phénomène de Raynaud ; cirrhose ; VIH ; cardiopathie congénitale opérée ou non ; drépanocytose ; splénectomie ; cancer.</p></div>
<div class="card"><h4>Expositions et famille</h4><p>Prise d’anorexigènes ou d’amphétamines, consommation de méthamphétamine ou de cocaïne, traitement par dasatinib ou par interféron. Séjour prolongé en haute altitude. Origine d’une zone d’endémie de schistosomiase. HTAP ou mort subite inexpliquée chez un apparenté, épistaxis familiales évoquant une <button class="w" data-k="i27-hht">télangiectasie hémorragique héréditaire</button>.</p></div></div>
<h3>5.2 Symptômes, du plus fréquent au moins fréquent</h3>
<p><b>Dyspnée d’effort progressive</b> — C’est le symptôme initial habituel. Elle progresse sur des mois et ne s’accompagne ni de sibilants ni d’orthopnée marquée. Voir la <button class="w" data-k="i27-dyspnee">dyspnée de l’hypertension pulmonaire (mécanisme)</button>.</p>
<p><b>Fatigue et intolérance à l’effort</b> — Elles traduisent le débit cardiaque fixe et la fatigue musculaire qui en découle.</p>
<p><b>Angor d’effort</b> — Il traduit l’ischémie du ventricule droit ou, plus rarement, la compression du tronc commun coronaire gauche par une artère pulmonaire dilatée. Voir l’<button class="w" data-k="i27-angor">angor de l’hypertension pulmonaire</button>.</p>
<p><b>Syncope ou présyncope d’effort</b> — Elle signe un débit incapable d’augmenter. Elle classe le patient en classe fonctionnelle IV et fait partie des signes d’alarme (îlot 8).</p>
<p><b>Œdèmes, prise de poids, ballonnement abdominal et satiété précoce</b> — Ils traduisent la congestion veineuse systémique et hépatique de l’insuffisance ventriculaire droite.</p>
<p><b>Hémoptysie</b> — Elle provient le plus souvent d’artères bronchiques hypertrophiées, plus fréquentes dans l’HTP thromboembolique chronique et les cardiopathies congénitales. Voir l’<button class="w" data-k="i27-hemopt">hémoptysie de l’hypertension pulmonaire</button>.</p>
<p><b>Dysphonie, toux, douleur thoracique</b> — Une artère pulmonaire très dilatée peut comprimer le nerf laryngé récurrent gauche : c’est le <button class="w" data-k="i27-ortner">syndrome d’Ortner</button>.</p>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique d’HTAP</h4><p>Femme de 30 à 60 ans, dyspnée d’effort progressive, examen longtemps normal, saturation normale au repos qui chute à l’effort, électrocardiogramme montrant des signes droits.</p></div>
<div class="card"><h4>Forme du sujet âgé</h4><p>Patient de plus de 65 ans avec plusieurs comorbidités cardiaques et pulmonaires. La question est moins « HTAP ou non » que « quelle part revient à chaque maladie ».</p></div>
<div class="card"><h4>Forme après embolie</h4><p>Dyspnée persistante ou nouvelle plus de trois mois après une embolie traitée. Elle impose une échocardiographie puis une scintigraphie de ventilation et de perfusion.</p></div>
<div class="card"><h4>Forme dépistée</h4><p>Patient asymptomatique ou peu symptomatique découvert lors d’un dépistage : sclérodermie, porteur d’un variant BMPR2, bilan avant transplantation hépatique.</p></div>
<div class="card"><h4>Forme décompensée</h4><p>Œdèmes, ascite, hépatomégalie douloureuse, hypotension, insuffisance rénale fonctionnelle : le ventricule droit est en échec. L’urgence prime.</p></div>
<div class="card"><h4>Forme hypoxémique avec shunt</h4><p>Cyanose, polyglobulie, hippocratisme digital : syndrome d’Eisenmenger, ou fistule artérioveineuse pulmonaire sans hypertension (îlot 12).</p></div></div>
<div class="key"><b>À retenir.</b> Une dyspnée d’effort progressive inexpliquée, surtout avec syncope d’effort, angor ou œdèmes, doit conduire à une échocardiographie. L’anamnèse recherche systématiquement une embolie passée, une connectivite, une hépatopathie, une cardiopathie congénitale, une exposition médicamenteuse et une histoire familiale. L’examen clinique, décrit ensuite, cherche la surcharge droite et la cause.</div>
</section>

<section class="ilot" id="i27-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen est souvent normal au début de la maladie. Les signes apparaissent quand le ventricule droit s’hypertrophie, puis se dilate. L’examen poursuit deux objectifs : mesurer le retentissement droit et repérer les indices d’une cause.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin observe l’essoufflement à la parole et à la marche. Il mesure la fréquence cardiaque, souvent élevée, et la pression artérielle : une pression systolique basse traduit un débit bas. Il mesure la saturation pulsée au repos puis à la marche ; une désaturation d’effort est fréquente. Il pèse le patient, car une prise de poids rapide révèle une rétention hydrosodée.</p></div>
<div class="card"><h4>Cœur</h4><p>L’<button class="w" data-k="i27-b2">éclat du deuxième bruit au foyer pulmonaire</button> traduit la fermeture forcée de la valve pulmonaire. Le <button class="w" data-k="i27-harzer">soulèvement ventriculaire droit (signe de Harzer)</button> traduit l’hypertrophie. Le <button class="w" data-k="i27-it">souffle d’insuffisance tricuspide (signe de Carvallo)</button> traduit la dilatation de l’anneau. Un bruit de galop droit et un souffle diastolique d’insuffisance pulmonaire s’y ajoutent dans les formes évoluées.</p></div>
<div class="card"><h4>Congestion veineuse</h4><p>La <button class="w" data-k="i27-jug">turgescence jugulaire et le reflux hépatojugulaire</button>, l’onde v jugulaire ample de l’insuffisance tricuspide, l’hépatomégalie parfois pulsatile, les œdèmes des membres inférieurs et l’ascite traduisent l’insuffisance ventriculaire droite.</p></div>
<div class="card"><h4>Indices de cause</h4><p>Sclérodactylie, télangiectasies, ulcères digitaux (sclérodermie). Crépitants fins de type « velcro » (fibrose). Thorax distendu (BPCO). Cyphoscoliose. Signes d’insuffisance hépatocellulaire et circulation collatérale (hypertension portale). Séquelles de thrombose veineuse. Épistaxis et télangiectasies des lèvres (télangiectasie hémorragique héréditaire). <button class="w" data-k="i27-hippo">Hippocratisme digital (signe d’orientation)</button>.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un hippocratisme digital n’appartient pas à l’HTAP idiopathique. Il oriente vers une cardiopathie congénitale cyanogène, une pneumopathie interstitielle, une maladie veino-occlusive, une hépatopathie ou une fistule artérioveineuse pulmonaire.</div>
<div class="trap"><span class="k">Piège</span>Des œdèmes et une turgescence jugulaire chez un patient à poumons clairs ne signent pas une insuffisance cardiaque gauche. L’absence de crépitants et d’orthopnée avec une congestion systémique franche oriente vers une défaillance droite isolée.</div>
<div class="key"><b>À retenir.</b> Les signes d’hypertension pulmonaire sont un éclat de B2, un soulèvement droit et un souffle d’insuffisance tricuspide. Les signes de défaillance droite sont la turgescence jugulaire, l’hépatomégalie, les œdèmes et l’ascite. L’examen recherche aussi les indices d’une cause, qui orientent le bilan décrit dans la démarche diagnostique.</div>
