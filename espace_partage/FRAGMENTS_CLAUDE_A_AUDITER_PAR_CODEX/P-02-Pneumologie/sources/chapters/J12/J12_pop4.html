
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j12-clin" data-title="Pareto — Définitions, mécanismes et clinique">
<p class="ratio" data-cover="j12-0,j12-1,j12-2,j12-3,j12-4,j12-5,j12-6"></p>
<ul>
<li>J12.0 adénovirus, J12.1 VRS, J12.2 paragrippaux, J12.3 métapneumovirus, J12.8 autres virus dont le SARS-CoV-2, J12.9 virus non précisé ; J16.0 <i>Chlamydia</i> ; J17.* derrière le code dague de la maladie générale. Grippe : J10.0.</li>
<li>COVID-19 en Suisse : J12.8 puis U07.1! (virus prouvé) ou U07.2! (clinique et épidémiologie).</li>
<li>Un virus est détecté chez environ 23 % des adultes hospitalisés pour pneumonie (EPIC) ; un agent n’est trouvé que chez 38 %. Détection n’est pas causalité.</li>
<li>VRS en Suisse : novembre à avril ; hospitalisations surtout avant 1 an et après 75 ans ; létalité hospitalière de 3,9 % après 75 ans.</li>
<li>Chaîne : récepteur, lésion épithéliale, interférons puis interleukine 6, effet shunt, surinfection. Antiviral tôt, immunomodulateur sous oxygène.</li>
<li>Terrain à risque : âge, cardiopathie, bronchopathie, diabète, grossesse, immunodépression.</li>
<li>Anamnèse : exposition, terrain, médicaments, jour du premier symptôme.</li>
<li>Examen : fréquence respiratoire et SpO₂ au repos et à l’effort ; l’auscultation peut être normale.</li></ul></template>

<template data-pop="pareto-j12-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j12-7"></p>
<ul>
<li>Imagerie pour la pneumonie, PCR multiplex nasopharyngée pour le virus, prélèvement profond chez l’immunodéprimé ou l’intubé.</li>
<li>Le bilan bactérien reste nécessaire ; la procalcitonine seule ne décide pas de l’antibiotique initial dans une pneumonie radiologique.</li>
<li>Différentiel par gravité : embolie pulmonaire, œdème cardiogénique, pneumonie bactérienne, pneumocystose, tuberculose.</li></ul></template>

<template data-pop="pareto-j12-grav" data-title="Pareto — Gravité et complications">
<p class="ratio" data-cover="j12-8"></p>
<ul>
<li>Sévère selon l’OMS : SpO₂ &lt; 90 %, signes de pneumonie ou détresse (fréquence &gt; 30 par minute) ; critique : SDRA, sepsis, choc, suppléance.</li>
<li>SpO₂ de 90 à 94 % en baisse : alerte. L’oxymétrie prime sur les scores.</li>
<li>Complications : SDRA, surinfection, aspergillose, décompensation cardiaque, thrombose, embolie.</li></ul></template>

<template data-pop="pareto-j12-ttt" data-title="Pareto — Traitement">
<p class="ratio" data-cover="j12-9"></p>
<ul>
<li>Oxygène : 94 à 98 %, ou 88 à 92 % si risque d’hypercapnie ; prophylaxie thromboembolique ; traitement des comorbidités.</li>
<li>Pneumonie radiologique hospitalisée : antibiotique de la pneumonie communautaire, réévalué à 48–72 heures.</li>
<li>COVID-19 non sévère à risque modéré ou élevé : nirmatrelvir-ritonavir dans les 5 jours, après contrôle des interactions ; sinon remdésivir 3 jours.</li>
<li>COVID-19 sous oxygène : dexaméthasone 6 mg par jour jusqu’à 10 jours, puis baricitinib ou tocilizumab (hors étiquette en Suisse).</li>
<li>VRS, métapneumovirus, paragrippaux : soins de soutien ; ribavirine ou cidofovir seulement chez l’immunodéprimé, en centre spécialisé.</li></ul></template>

<template data-pop="pareto-j12-prev" data-title="Pareto — Prévention, J16, J17 et situations particulières">
<p class="ratio" data-cover="j12-10,j12-11,j12-12"></p>
<ul>
<li>VRS : une dose dès 75 ans ou dès 60 ans à risque, de mi-octobre à mi-novembre ; femme enceinte : Abrysvo entre 32 et 36 semaines ; nourrisson : nirsévimab ou vaccination maternelle.</li>
<li>COVID-19 : une dose annuelle dès 65 ans ou dès 16 ans à risque, et pendant la grossesse.</li>
<li><i>Chlamydia pneumoniae</i> : J16.0, doxycycline ou macrolide ; pas de bêtalactamine seule.</li>
<li>J17 : rougeole (vitamine A), varicelle (aciclovir intraveineux), cytomégalovirus (ganciclovir), aspergillose, psittacose et fièvre Q (doxycycline). Pneumocystose : B48.5.</li>
<li>Nirmatrelvir-ritonavir : 150/100 mg toutes les 12 heures si DFG 30–59 ; schéma réduit sous 30 ; pas d’emploi en Child-Pugh C. Remdésivir : pas d’adaptation rénale. Baricitinib : 2 mg si DFG 30–60.</li></ul></template>

<template data-pop="pareto-j12-crit" data-title="Pareto — Critères formels et paramètres clés">
<p class="ratio" data-cover="j12-13"></p>
<ul>
<li>Pneumonie radiologique, virus identifié, absence d’agent plus probable.</li>
<li>Surveiller SpO₂, fréquence respiratoire, jour du début, risque OMS, besoin d’oxygène, interactions, bactérie associée.</li></ul></template>

<template data-pop="pareto-j12-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j12-e-1,j12-e-2,j12-e-3,j12-e-4,j12-e-5"></p>
<ul>
<li>PCR multiplex nasopharyngée : examen de référence ; sérologie inutile au diagnostic aigu.</li>
<li>Antigène : positif seulement pendant la forte charge virale ; PCR positive prolongée sans infection active.</li>
<li>Lymphopénie et procalcitonine basse orientent vers un virus ; hausse rapide des D-dimères : embolie.</li>
<li>Verre dépoli non spécifique ; chez l’immunodéprimé, penser pneumocystose et lavage bronchoalvéolaire.</li>
<li>PaO₂/FiO₂ ≤ 300 mmHg sous pression positive : SDRA ; PaCO₂ qui monte : fatigue.</li></ul></template>

<template data-pop="pareto-j12-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="j12-sa,j12-sh,j12-sp,j12-si,j12-sm"></p>
<ul>
<li>Bronchiole étroite du nourrisson : résistance en puissance quatre du rayon, d’où la bronchiolite.</li>
<li>ECA2 et TMPRSS2 sur les pneumocytes de type II ; protéine F des cellules ciliées pour le VRS.</li>
<li>Dommage alvéolaire diffus : membranes hyalines ; inclusions « en œil de hibou » : cytomégalovirus.</li>
<li>Shunt peu sensible à l’oxygène ; 90 % de saturation au début de la pente de la courbe.</li>
<li>Interférons tôt, interleukine 6 et JAK-STAT tard ; nirsévimab et vaccins ciblent la protéine F en préfusion.</li>
<li>Ritonavir : inhibiteur du CYP3A4 ; <i>Chlamydia</i> intracellulaire : macrolide ou doxycycline.</li></ul></template>

<template data-pop="pareto-j12-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j12-p-1,j12-p-2,j12-p-3,j12-p-4"></p>
<ul>
<li>Paxlovid : 300/100 mg toutes les 12 heures pendant 5 jours, dans les 5 jours ; adaptation rénale ; contre-indications par le CYP3A4.</li>
<li>Veklury : 200 mg puis 100 mg par jour ; 3 jours sans oxygène, 5 à 10 jours avec oxygène.</li>
<li>Dexaméthasone 6 mg par jour jusqu’à 10 jours, seulement sous oxygène.</li>
<li>Baricitinib 4 mg par jour ; tocilizumab dose unique selon le poids, hors étiquette.</li>
<li>Nirsévimab 50 mg (&lt; 5 kg) ou 100 mg ; 200 mg en deuxième saison.</li>
<li>À éviter : ivermectine, hydroxychloroquine, plasma de convalescent, anticorps monoclonaux anciens, antibiotiques sans argument bactérien.</li></ul></template>
