<section class="ilot" id="j93-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. R., 23 ans, étudiant en architecture, consulte aux urgences de Neuchâtel un dimanche matin. La veille au soir, assis devant son ordinateur, il a ressenti une douleur brutale en coup de poignard sous la clavicule droite. La douleur augmente à l’inspiration profonde. Depuis, il s’essouffle en montant un étage. Il mesure 1,88 m et pèse 66 kg, soit un indice de masse corporelle de 18,7 kg/m². Il fume 10 cigarettes par jour depuis l’âge de 16 ans et du cannabis le week-end. Il n’a aucune maladie connue.</p>
<p>La fréquence cardiaque est de 92/min, la pression artérielle de 124/76 mmHg, la fréquence respiratoire de 18/min et la SpO₂ de 97 % à l’air ambiant. Le murmure vésiculaire est diminué à droite, où la percussion est tympanique. La radiographie thoracique de face montre une ligne pleurale viscérale fine, sans trame pulmonaire au-delà. La distance entre cette ligne et la coupole est de 3,5 cm à l’apex ; elle mesure 2,5 cm latéralement à hauteur du hile.</p>
<p>Le patient pratique la plongée sous-marine avec bouteille et doit prendre l’avion pour Lisbonne dans dix jours. Le cas pose cinq questions qui structurent le cours. <b>De quel type de pneumothorax s’agit-il ? Existe-t-il un signe de gravité ? Faut-il drainer, exsuffler, ou seulement surveiller ? Comment réduire le risque de récidive ? Quand pourra-t-il voler, et pourra-t-il replonger ?</b></p>
<p>À la fin du cours, le médecin assistant sait distinguer un pneumothorax spontané primaire d’un pneumothorax spontané secondaire. Il reconnaît en quelques secondes un pneumothorax sous tension et le décomprime sans attendre l’imagerie. Il choisit entre surveillance, exsufflation, dispositif ambulatoire et drain selon les symptômes, les facteurs de risque et la préférence du patient. Il organise le suivi et donne des conseils exacts sur le tabac, l’avion et la plongée.</p>
<div class="key"><b>Message fondateur.</b> Depuis la recommandation de la British Thoracic Society (BTS) de 2023 et la recommandation européenne ERS/EACTS/ESTS de 2024, ce sont les <b>symptômes et la stabilité physiologique</b>, et non la taille radiologique, qui décident d’un geste. Un pneumothorax volumineux mais bien toléré chez un jeune patient peut être surveillé. Un pneumothorax modeste chez un patient atteint de BPCO sévère peut menacer sa vie.</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="j93-ppl">pression pleurale négative (pourquoi le poumon reste accolé à la paroi)</button>, la <button class="w" data-k="j93-bleb">bulle sous-pleurale et le bleb (lésions de l’apex)</button> et la distinction entre <button class="w" data-k="j93-psp-ssp">pneumothorax spontané primaire et secondaire (critères et conséquences)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="j93-1"><h2><span class="n">1</span>Définitions, classification et codage</h2>
<p>Un <b>pneumothorax</b> est la présence d’air dans la cavité pleurale, entre la plèvre viscérale qui recouvre le poumon et la plèvre pariétale qui tapisse la paroi. Normalement, cette cavité est virtuelle : elle contient seulement quelques millilitres de liquide. L’air y pénètre soit depuis le poumon, à travers une brèche de la plèvre viscérale, soit depuis l’extérieur, à travers la paroi. Le poumon, qui a une tendance naturelle à se rétracter, se décolle alors de la paroi.</p>
<h3>1.1 Classification selon le mécanisme</h3>
<p>La première question clinique est de savoir si le pneumothorax est survenu sans cause extérieure. La réponse oriente le pronostic, le traitement et le codage. Le tableau suivant présente les quatre grandes catégories reconnues par la BTS 2023 et l’ERS/EACTS/ESTS 2024.</p>
<table class="t"><tr><th>Catégorie</th><th>Définition</th><th>Exemple</th><th>Traitée dans</th></tr>
<tr><td>Spontané primaire</td><td>Sans maladie pulmonaire connue ni cause extérieure</td><td>Homme de 23 ans, grand et mince, fumeur</td><td>Ce cours</td></tr>
<tr><td>Spontané secondaire</td><td>Sur une maladie pulmonaire établie, ou après 50 ans avec un tabagisme important</td><td>Femme de 68 ans atteinte de BPCO</td><td>Ce cours</td></tr>
<tr><td>Iatrogène</td><td>Provoqué par un acte médical</td><td>Ponction pulmonaire sous TDM, cathéter sous-clavier</td><td>Renvoi, §12</td></tr>
<tr><td>Traumatique</td><td>Provoqué par un traumatisme thoracique</td><td>Fracture de côte après chute à ski</td><td>Renvoi, §12</td></tr></table>
<p>La lecture du tableau commence par la colonne « Définition ». La catégorie « secondaire » inclut, selon la BTS 2023, le patient de plus de 50 ans avec un tabagisme important, même sans diagnostic de BPCO. Ce choix s’explique par la fréquence d’un emphysème méconnu à cet âge et par le moins bon résultat de l’exsufflation dans ce groupe. L’erreur fréquente consiste à classer « primaire » un fumeur de 58 ans au seul motif que sa spirométrie n’a jamais été faite.</p>
<div class="trap"><span class="k">Piège</span>« Primaire » ne veut pas dire « poumon sain ». La plupart des patients atteints de pneumothorax spontané primaire ont des modifications de type emphysémateux visibles à la TDM. La distinction reflète une différence de pronostic et de traitement, et non une absence de lésion (BTS 2023).</div>
<h3>1.2 Classification selon le retentissement</h3>
<p>Le <button class="w" data-k="j93-tension">pneumothorax sous tension (définition physiologique et signes)</button> est un pneumothorax dans lequel la pression intrapleurale devient positive pendant tout ou partie du cycle respiratoire. Il comprime le poumon controlatéral et gêne le retour veineux. C’est une urgence vitale, quel que soit le type de pneumothorax. Le diagnostic est clinique : la déclaration clinique de la BTS sur les gestes pleuraux (2023) précise qu’il se traite sans attendre l’imagerie.</p>
<p>La taille radiologique se décrit par une distance en centimètres entre la plèvre viscérale et la paroi. Elle ne décide plus à elle seule du traitement, mais elle conditionne la <b>sécurité d’un geste</b> : la BTS 2023 considère qu’un pneumothorax est de taille suffisante pour être ponctionné sans danger s’il mesure habituellement au moins 2 cm latéralement ou à l’apex. Les méthodes de mesure figurent dans l’onglet Examens, fiche <button class="w" data-k="j93-taille">mesure de la taille (Collins, Light, seuils)</button>.</p>
<h3>1.3 Codage CIM-10-GM 2024</h3>
<p>La catégorie J93 de la CIM-10-GM 2024 (BfArM) comprend quatre sous-codes. Les exclusions envoient plusieurs situations vers d’autres chapitres de la classification, ce qui évite de coder deux fois la même maladie.</p>
<table class="t"><tr><th>Code</th><th>Intitulé officiel</th><th>Situation typique</th></tr>
<tr><td>J93.0</td><td>Pneumothorax spontané sous tension</td><td>Pneumothorax spontané avec pression positive et retentissement hémodynamique</td></tr>
<tr><td>J93.1</td><td>Autres pneumothorax spontanés</td><td>Pneumothorax spontané primaire ou secondaire sans tension ; la maladie sous-jacente se code en plus</td></tr>
<tr><td>J93.8</td><td>Autres pneumothorax</td><td>Pneumothorax précisé non classable ailleurs</td></tr>
<tr><td>J93.9</td><td>Pneumothorax, sans précision</td><td>Information insuffisante pour préciser</td></tr>
<tr><th colspan="3">Exclusions de J93 et cours qui les traitent</th></tr>
<tr><td>P25.1</td><td>Pneumothorax congénital ou périnatal</td><td>Néonatologie, hors de ce cours</td></tr>
<tr><td>J95.80</td><td>Pneumothorax iatrogène</td><td>Principes au §12 de ce cours</td></tr>
<tr><td>S27.0</td><td>Pneumothorax traumatique</td><td>Traumatologie thoracique ; principes au §12</td></tr>
<tr><td>A15-A16</td><td>Pneumothorax tuberculeux (maladie active)</td><td>Cours de la tuberculose</td></tr>
<tr><td>J86</td><td>Pyopneumothorax</td><td>Cours J90 — Épanchements pleuraux (P-02-Pneumologie), section pyothorax</td></tr></table>
<p>La première colonne à regarder est celle de la situation typique : elle évite l’erreur de coder J93.1 un pneumothorax survenu après la pose d’une voie veineuse centrale, qui relève de J95.80. Un hémopneumothorax spontané se code J94.2 et se traite dans le cours J90 — Épanchements pleuraux (P-02-Pneumologie). L’endométriose thoracique d’un pneumothorax cataménial se code en complément sous N80.8.</p>
<div class="key"><b>À retenir.</b> Le médecin classe d’abord le pneumothorax selon son mécanisme (primaire, secondaire, iatrogène, traumatique), puis selon son retentissement (sous tension ou non). La taille sert surtout à juger si un geste est techniquement sûr. La partie suivante montre que le type de pneumothorax prédit la récidive et la mortalité.</div>
</section>

<section class="ilot" id="j93-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Aucune donnée épidémiologique suisse publiée sur le pneumothorax spontané n’a été retrouvée lors de la recherche du 8 octobre 2026. Les chiffres européens les plus solides proviennent de la base nationale d’hospitalisation française de 2008 à 2011. Cette étude a compté 42 595 patients de 14 ans et plus et estimé l’incidence annuelle des pneumothorax non traumatiques à 22,7 cas pour 100 000 habitants. Le rapport femmes-hommes était de 1 pour 3,3, et l’âge moyen de 37 ans chez l’homme et de 41 ans chez la femme (Bobbio, Thorax 2015).</p>
<p>Dans les hôpitaux britanniques, les admissions hospitalières pour pneumothorax sont passées de 9,1 à 14,1 pour 100 000 habitants par an en cinquante ans (BTS 2023). La distribution selon l’âge est bimodale. Un premier pic concerne l’homme jeune, grand et mince, entre 15 et 34 ans : c’est le pneumothorax primaire. Un second pic concerne le sujet de plus de 55 ans atteint de BPCO : c’est le pneumothorax secondaire.</p>
<h3>2.1 Récidive</h3>
<p>La récidive est le problème pronostique principal du pneumothorax primaire. Après un premier épisode, elle survient chez <b>32 %</b> des patients ; après un premier pneumothorax secondaire, elle varie de 13 à 39 % selon les séries (BTS 2023). La plupart des récidives surviennent dans la première année, ce qui justifie un suivi pneumologique et une décision explicite sur la prévention.</p>
<p>Les facteurs associés à la récidive sont le tabagisme poursuivi, le sexe féminin, le jeune âge, un indice de masse corporelle bas et la présence de bulles visibles à la TDM. Ces facteurs sont des associations statistiques. Seul l’arrêt du tabac est à la fois modifiable et appuyé par un mécanisme plausible, détaillé au §4 : la fumée entretient l’inflammation bronchiolaire et la formation de blebs.</p>
<h3>2.2 Mortalité</h3>
<p>Le pneumothorax primaire tue rarement. Le pneumothorax secondaire est plus grave, car il survient sur un poumon dont la réserve est déjà amputée. Chez un patient dont le volume expiratoire maximal par seconde (VEMS) vaut 0,9 L, la perte de la ventilation d’un poumon partiellement collabé peut suffire à provoquer une insuffisance respiratoire hypercapnique. Dans la mucoviscidose, la survie médiane après un pneumothorax est de 30 mois, ce qui reflète la sévérité de la maladie sous-jacente plus que l’effet propre du pneumothorax (BTS 2023).</p>
<div class="key"><b>À retenir.</b> Le pneumothorax primaire touche surtout l’homme jeune, grand, mince et fumeur ; il récidive chez environ un patient sur trois. Le pneumothorax secondaire touche surtout le patient atteint de BPCO ; il est plus dangereux parce que la réserve respiratoire est faible. La partie suivante explique pourquoi le poumon se décolle et comment un pneumothorax devient compressif.</div>
</section>

<section class="ilot" id="j93-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le pneumothorax résulte de la rupture d’un équilibre de forces. Chaque maillon de la chaîne explique un signe clinique ou une décision thérapeutique.</p>
<h3>3.1 État normal : deux forces opposées</h3>
<p>Le poumon contient des fibres élastiques et un film liquidien alvéolaire soumis à la tension de surface. Ces deux éléments le poussent à se rétracter vers le hile. La cage thoracique, au repos, tend au contraire à s’ouvrir vers l’extérieur. Les deux plèvres, séparées par une fine lame liquide, transmettent ces forces opposées. Il en résulte une <button class="w" data-k="j93-ppl">pression pleurale négative</button> d’environ −0,5 kPa (−5 cm d’eau) en fin d’expiration calme. Cette dépression maintient le poumon déplissé contre la paroi.</p>
<h3>3.2 Première charnière : la brèche</h3>
<p>Dans le pneumothorax spontané primaire, l’air provient le plus souvent d’une zone fragile de l’apex. Les <button class="w" data-k="j93-bleb">blebs et bulles sous-pleurales</button> y sont fréquents. L’ERS 2015 souligne que leur rupture n’explique pas tous les cas : des zones de porosité diffuse de la plèvre viscérale, appelées « inflammation pleurale poreuse », peuvent laisser fuir l’air sans bulle visible. Cette incertitude explique pourquoi la chirurgie de prévention associe presque toujours une symphyse pleurale à la résection des bulles.</p>
<p>Dans le pneumothorax secondaire, la brèche naît d’une maladie établie : rupture d’une bulle d’emphysème, nécrose d’une cavité infectieuse, kyste d’une maladie kystique. L’apex est une zone de prédilection, car la pression pleurale y est plus négative qu’à la base en position debout ; les alvéoles apicales y sont plus distendues et leur paroi davantage étirée.</p>
<h3>3.3 Deuxième charnière : l’équilibre des pressions</h3>
<p>Dès que la brèche s’ouvre, l’air passe du compartiment à pression plus élevée, l’alvéole, vers le compartiment à pression plus basse, la cavité pleurale. Le poumon se rétracte jusqu’à ce que la pression pleurale atteigne la pression atmosphérique ou que la brèche se ferme. Chez la plupart des patients, la brèche se colmate spontanément par un dépôt de fibrine : c’est la base physiologique de la <button class="w" data-k="j93-conserv">surveillance sans geste (traitement conservateur)</button>.</p>
<h3>3.4 Troisième charnière : l’effet de valve et la tension</h3>
<p>Si la brèche se comporte comme une valve, l’air entre à l’inspiration et ne ressort pas à l’expiration. La pression pleurale devient positive et le médiastin est refoulé vers le côté opposé. Le poumon controlatéral est comprimé, et les veines caves s’écrasent ou se coudent. Le retour veineux diminue, puis le débit cardiaque chute. Chez le patient qui respire spontanément, l’hypoxémie et la détresse respiratoire précèdent souvent l’hypotension. Chez le patient ventilé en pression positive, l’effondrement hémodynamique peut survenir en quelques minutes, car le ventilateur pousse l’air dans la plèvre à chaque cycle.</p>
<h3>3.5 Quatrième charnière : manifestations</h3>
<p>L’irritation de la plèvre pariétale, richement innervée, produit la douleur pleurale homolatérale brutale. La rétraction du poumon diminue la surface ventilée. Le poumon collabé reste partiellement perfusé ; ce shunt explique l’hypoxémie, surtout dans un pneumothorax volumineux ou secondaire. Le volume d’air entre paroi et poumon conduit mal les vibrations vocales et transmet mal le murmure vésiculaire, alors qu’il augmente la sonorité à la percussion.</p>
<h3>3.6 Cinquième charnière : la résorption</h3>
<p>Une fois la brèche fermée, l’air pleural se résorbe par diffusion vers le sang des capillaires pleuraux, car la somme des pressions partielles des gaz du sang veineux est inférieure à la pression atmosphérique. La vitesse est lente, de l’ordre de 1,25 à 2,2 % du volume de l’hémithorax par 24 heures selon des données historiques. L’oxygène à forte concentration accélère cette résorption en abaissant la pression partielle d’azote du sang : c’est la base de l’<button class="w" data-k="j93-o2">oxygénothérapie à haut débit (mécanisme et limites)</button>.</p>

<section class="ilot" id="j93-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<h3>4.1 Pneumothorax spontané primaire</h3>
<p>Le <b>tabagisme</b> est le principal facteur de risque selon l’ERS 2015. Le mécanisme proposé est l’inflammation des petites voies aériennes, qui favorise la distension et la rupture des alvéoles sous-pleurales. Le cannabis fumé est également associé à des bulles apicales. Le mécanisme proposé, non démontré, est une inhalation profonde suivie d’une apnée prolongée, qui augmente la pression alvéolaire. La BTS 2023 conseille l’arrêt du tabac après tout pneumothorax.</p>
<p>La <b>morphologie longiligne</b> est un autre facteur classique. L’hypothèse mécanique est la suivante : chez un sujet grand, le gradient vertical de pression pleurale est plus important ; les alvéoles apicales sont donc plus étirées. Cette explication reste une hypothèse physiologique et non une causalité démontrée.</p>
<p>Les <button class="w" data-k="j93-familial">pneumothorax familiaux (Birt-Hogg-Dubé, Marfan, Ehlers-Danlos)</button> représentent environ 10 % des cas dans certaines séries (BTS 2023). Un antécédent familial doit faire rechercher une cause génétique et demander une TDM.</p>
<h3>4.2 Pneumothorax spontané secondaire</h3>
<p>Les causes de pneumothorax secondaire sont nombreuses. Le tableau suivant les classe par mécanisme, afin que le médecin sache quelle lésion rechercher sur la TDM et quel traitement de fond associer.</p>
<table class="t"><tr><th>Mécanisme</th><th>Maladies</th><th>Indice orientant</th></tr>
<tr><td>Destruction emphysémateuse</td><td>BPCO, déficit en alpha-1-antitrypsine</td><td>Âge &gt; 50 ans, tabagisme, distension</td></tr>
<tr><td>Bronchectasies et infection chronique</td><td>Mucoviscidose</td><td>Atteinte sévère, sujet jeune</td></tr>
<tr><td>Nécrose infectieuse</td><td>Pneumocystose, tuberculose, pneumonie nécrosante, COVID-19 sévère</td><td>Immunodépression, fièvre, cavités</td></tr>
<tr><td>Maladies kystiques</td><td><button class="w" data-k="j93-lam">lymphangioléiomyomatose (femme jeune, kystes)</button>, histiocytose langerhansienne, Birt-Hogg-Dubé</td><td>Kystes diffus à la TDM</td></tr>
<tr><td>Fibrose et maladies interstitielles</td><td>Fibrose pulmonaire idiopathique, sarcoïdose avancée</td><td>Râles crépitants, rayon de miel</td></tr>
<tr><td>Tumeur</td><td>Cancer bronchique, métastases de sarcome</td><td>Masse, nodule excavé</td></tr>
<tr><td>Endométriose thoracique</td><td><button class="w" data-k="j93-catam">pneumothorax cataménial (règles, côté droit)</button></td><td>Récidive dans les 72 heures autour des règles</td></tr>
<tr><td>Tissu conjonctif fragile</td><td>Syndromes de Marfan et d’Ehlers-Danlos</td><td>Morphotype, antécédents familiaux</td></tr></table>
<p>La lecture commence par la colonne « Indice orientant », car c’est l’anamnèse qui guide la recherche. La BPCO est de loin la première cause chez l’adulte de plus de 50 ans. Chez une femme jeune non fumeuse qui récidive, le cataménial et la lymphangioléiomyomatose sont les deux diagnostics à ne pas manquer. Chez un patient vivant avec le VIH et ayant peu de lymphocytes CD4, un pneumothorax doit faire rechercher une pneumocystose.</p>
<div class="key"><b>À retenir.</b> Le tabac est le facteur modifiable majeur du pneumothorax primaire. Le pneumothorax secondaire révèle ou complique une maladie pulmonaire, d’abord la BPCO. Un pneumothorax familial ou chez une femme jeune qui récidive impose une TDM et la recherche d’une cause kystique ou génétique. La partie suivante transforme ces notions en questions d’anamnèse.</div>
</section>

<section class="ilot" id="j93-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche trois informations : le type de pneumothorax, sa tolérance et les éléments qui modifieront les conseils de sortie. Elle se fait en même temps que l’évaluation de la gravité, car un pneumothorax sous tension ne laisse pas le temps d’une anamnèse complète.</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin demande d’abord s’il existe une <button class="w" data-k="j93-atcd-poumon">maladie pulmonaire connue (BPCO, mucoviscidose, VIH)</button>, car elle fait passer le pneumothorax dans la catégorie secondaire. Il précise le <b>tabagisme</b> en paquets-années et la consommation de cannabis. Il recherche un <b>pneumothorax antérieur</b>, du même côté ou du côté opposé, car un deuxième épisode homolatéral ou un premier épisode controlatéral est une indication de chirurgie selon la BTS 2023. Il note les <b>antécédents familiaux</b> de pneumothorax, de tumeur rénale ou de lésions cutanées du visage, qui évoquent un syndrome de Birt-Hogg-Dubé. Chez une femme, il relie la date des symptômes à celle des règles et recherche une endométriose pelvienne.</p>
<p>Il recherche aussi tout <b>acte médical récent</b> sur le thorax, le cou ou l’abdomen supérieur : voie veineuse centrale, ponction, acupuncture, bloc nerveux, endoscopie. La réponse oriente vers un pneumothorax iatrogène. Enfin, il demande la profession, la pratique de la plongée et les voyages en avion prévus : ces informations orientent la prévention.</p>
<h3>5.2 Symptômes</h3>
<p>La <button class="w" data-k="j93-douleur">douleur thoracique pleurale (caractérisation et mécanisme)</button> est le symptôme le plus fréquent. Elle est brutale, homolatérale, latérale ou sous-claviculaire, et augmentée par l’inspiration profonde. Elle survient le plus souvent au repos ; l’effort n’est pas un déclencheur habituel. La douleur diminue souvent en quelques heures, même si le pneumothorax persiste, ce qui explique les consultations tardives.</p>
<p>La <b>dyspnée</b> dépend de la réserve respiratoire plus que de la taille. Un étudiant de 23 ans peut tolérer un poumon collabé à moitié avec une dyspnée d’effort modeste, alors qu’un patient atteint de BPCO avec un VEMS de 35 % de la valeur prédite peut être en détresse avec un liseré de 1,5 cm. Une toux sèche, provoquée par l’irritation pleurale, est possible.</p>
<div class="two">
<div class="card"><h4>Forme typique du primaire</h4><p>Un homme de 15 à 34 ans, grand, mince et fumeur ressent une douleur latérale brutale au repos, suivie d’une dyspnée d’effort modérée. Il n’a aucune maladie respiratoire connue et ses constantes sont normales.</p></div>
<div class="card"><h4>Forme typique du secondaire</h4><p>Un patient de plus de 55 ans atteint de BPCO présente une aggravation brutale de sa dyspnée, souvent sans douleur marquée. Le tableau est facilement confondu avec une exacerbation de BPCO.</p></div>
<div class="card"><h4>Forme pauci-symptomatique</h4><p>Un patient consulte plusieurs jours après une douleur thoracique résolutive. Le pneumothorax est découvert sur une radiographie faite pour une autre raison. Ce délai augmente le risque d’œdème de réexpansion lors d’un drainage.</p></div>
<div class="card"><h4>Forme grave d’emblée</h4><p>Un patient présente une dyspnée intense, une agitation ou une confusion, une tachycardie et une hypotension. Ce tableau impose de rechercher immédiatement un pneumothorax sous tension.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer une dyspnée brutale chez un patient atteint de BPCO à une exacerbation, puis renforcer les bronchodilatateurs sans radiographie. Une dyspnée qui s’aggrave brutalement, sans fièvre ni modification de l’expectoration, doit faire rechercher un pneumothorax.</div>
<div class="key"><b>À retenir.</b> L’anamnèse classe le pneumothorax en primaire ou secondaire, repère les récidives et les indices d’une cause familiale ou cataméniale, et recueille la profession, la plongée et les voyages en avion. La dyspnée reflète la réserve respiratoire et non la taille. L’examen clinique, décrit dans la partie suivante, cherche d’abord les signes de tension.</div>
</section>

<section class="ilot" id="j93-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel, mais le médecin cherche les signes de gravité dès les premières secondes. Un examen normal n’exclut pas un petit pneumothorax.</p>
<h3>6.1 État général et constantes</h3>
<p>Le médecin observe l’aspect général : capacité à parler en phrases complètes, agitation, sueurs, cyanose. Il mesure la fréquence respiratoire, la SpO₂, la fréquence cardiaque, la pression artérielle et la température. Chez le patient du cas, une fréquence de 92/min, une pression de 124/76 mmHg et une SpO₂ de 97 % traduisent une bonne tolérance. Une tachycardie supérieure à 120/min, une hypotension ou une SpO₂ basse sous oxygène orientent vers la tension. L’anthropométrie (taille, poids, indice de masse corporelle) documente le morphotype longiligne.</p>
<h3>6.2 Signes thoraciques ciblés</h3>
<div class="two">
<div class="card"><h4>Du côté atteint</h4><p>Le <button class="w" data-k="j93-mv">murmure vésiculaire diminué ou aboli (technique et valeur)</button> est le signe le plus utile. La <button class="w" data-k="j93-percu">percussion tympanique (hypersonorité)</button> et la diminution des vibrations vocales complètent le tableau. L’ampliation de l’hémithorax peut être réduite.</p></div>
<div class="card"><h4>Signes de tension</h4><p>La détresse respiratoire, la tachycardie, l’hypotension, la turgescence jugulaire et l’asymétrie thoracique avec hémithorax distendu sont les <button class="w" data-k="j93-signes-tension">signes du pneumothorax sous tension</button>. La déviation de la trachée est tardive.</p></div>
<div class="card"><h4>Emphysème sous-cutané</h4><p>Une crépitation neigeuse à la palpation du cou ou du thorax indique que l’air a diffusé dans les tissus. Il est fréquent après un drain et peut signaler un drain mal positionné ou bouché.</p></div>
<div class="card"><h4>Signes d’une maladie sous-jacente</h4><p>Une distension thoracique, un hippocratisme digital, des râles crépitants ou des lésions cutanées du visage orientent vers une cause secondaire ou familiale.</p></div></div>
<p>Un pneumothorax gauche peut produire un <b>craquement synchrone des battements cardiaques</b> à l’auscultation (signe de Hamman) lorsque de l’air entoure le cœur ou le médiastin. Ce signe doit aussi faire rechercher un pneumomédiastin.</p>
<div class="trap"><span class="k">Piège</span>Chez un patient atteint de BPCO avec distension, la diminution du murmure et l’hypersonorité sont bilatérales et préexistantes. L’asymétrie disparaît, et l’examen ne permet plus de reconnaître le pneumothorax. L’imagerie est alors indispensable.</div>
<div class="key"><b>À retenir.</b> Le côté atteint est silencieux et tympanique. La détresse, la tachycardie, l’hypotension et la turgescence jugulaire font suspecter une tension, qui se traite avant l’imagerie. Chez le patient emphysémateux, l’examen est peu fiable. La démarche diagnostique, développée dans la partie suivante, s’appuie sur la radiographie, l’échographie et la TDM.</div>
