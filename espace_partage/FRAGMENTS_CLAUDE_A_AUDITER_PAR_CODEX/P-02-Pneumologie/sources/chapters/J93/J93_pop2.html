
<!-- ===== FENÊTRES J93 : examens et gestes ===== -->
<template data-pop="j93-rx" data-title="Radiographie thoracique dans le pneumothorax">
<div class="lab">Technique</div><p>Le cliché de face se fait debout, en inspiration. L’air monte vers l’apex : c’est là que le liseré se cherche en premier, puis le long de la paroi latérale.</p>
<div class="lab">Signes</div><p>La ligne pleurale viscérale est fine, blanche et parallèle à la paroi ; aucune trame vasculaire n’est visible au-delà. En décubitus, l’air se collecte en avant et en bas, ce qui produit un cul-de-sac costo-diaphragmatique profond et clair. Une tension refoule le médiastin vers le côté opposé et abaisse la coupole.</p>
<div class="lab">Valeur</div><p>En position debout, la radiographie confirme la plupart des pneumothorax. En décubitus, sa sensibilité n’est que d’environ 50 % (Alrajhi, Chest 2012).</p>
<div class="lab">Pièges</div><p>Un pli cutané, le bord de l’omoplate et les vêtements simulent une ligne pleurale. La paroi d’une bulle est concave vers l’extérieur, alors que la ligne d’un pneumothorax suit la courbure de la paroi.</p>
<div class="lab">Erreur fréquente</div><p>Les clichés en expiration ne sont plus recommandés en routine (BTS 2010). En cas de doute, l’échographie ou la TDM répondent mieux.</p></template>

<template data-pop="j93-echo" data-title="Échographie pleurale">
<div class="lab">Principe</div><p>L’interface entre la paroi et l’air pleural réfléchit totalement les ultrasons. Le glissement de la plèvre viscérale contre la plèvre pariétale, normalement visible, disparaît.</p>
<div class="lab">Technique</div><p>La sonde est posée sur la paroi antérieure, entre deux côtes, chez le patient couché, là où l’air se collecte. L’opérateur cherche le glissement, les lignes B, le pouls pulmonaire, puis l’aspect en mode temps-mouvement, et enfin le point poumon en déplaçant la sonde latéralement.</p>
<div class="lab">Valeur</div><p>L’échographie a une sensibilité de 90,9 % et une spécificité de 98,2 % dans la méta-analyse d’Alrajhi (Chest 2012). Le point poumon a une spécificité de 100 % et une sensibilité de 66 % (Lichtenstein, Intensive Care Medicine 2000).</p>
<div class="lab">Limites et pièges</div><p>L’absence de glissement se voit aussi dans les adhérences pleurales, l’emphysème bulleux, l’apnée et l’intubation sélective. L’échographie ne mesure pas la taille d’un pneumothorax ; la déclaration clinique de la BTS 2023 ne la juge pas nécessaire dans le pneumothorax habituel, sauf pour repérer un site de drain dans un pneumothorax cloisonné.</p></template>

<template data-pop="j93-tdm" data-title="TDM thoracique dans le pneumothorax">
<div class="lab">Statut</div><p>La TDM est l’examen de référence pour la présence d’air pleural, mais elle n’est pas systématique dans le premier pneumothorax primaire.</p>
<div class="lab">Indications</div><p>Elle est indiquée en cas de doute diagnostique, de bulle géante possible, de recherche d’une maladie sous-jacente (emphysème, kystes, fibrose, tumeur), de pneumothorax familial (BTS 2023), de pneumothorax cloisonné ou de poumon adhérent avant un drain, et pour préparer une chirurgie.</p>
<div class="lab">Piège</div><p>Des blebs sont fréquents après un premier pneumothorax primaire. Leur présence ne suffit pas à indiquer une chirurgie, et leur absence n’exclut pas une récidive.</p></template>

<template data-pop="j93-gds" data-title="Gazométrie artérielle dans le pneumothorax">
<div class="lab">Indication</div><p>La gazométrie est indiquée lorsque la SpO₂ est basse, lorsqu’une maladie pulmonaire expose à l’hypercapnie ou lorsqu’une insuffisance respiratoire aiguë est suspectée.</p>
<div class="lab">Profils</div><p>Chez le sujet jeune, la PaO₂ est abaissée par le shunt du poumon rétracté et la PaCO₂ est basse par hyperventilation. Chez le patient atteint de BPCO, une PaCO₂ élevée avec un pH bas signale une insuffisance respiratoire aiguë hypercapnique.</p>
<div class="lab">Conséquence pratique</div><p>La gazométrie fixe la cible d’oxygène et le recours à la ventilation, qui ne commence qu’après ou avec le drainage.</p></template>

<template data-pop="j93-src" data-title="Surveillance, exsufflation ou drain : sources et désaccords">
<div class="lab">Question</div><p>Quel traitement initial proposer à un adulte atteint d’un pneumothorax spontané primaire stable, sans caractéristique à haut risque ?</p>
<div class="lab">Source retenue : ERS/EACTS/ESTS 2024</div><p>Cette recommandation conjointe européenne, publiée le 28.05.2024 (European Respiratory Journal 2024;63:2300797), est la source primaire applicable la plus récente. Elle recommande de façon conditionnelle la surveillance du patient peu symptomatique et stable, de façon <b>forte</b> l’exsufflation plutôt que le drain lorsqu’un traitement initial est nécessaire, de façon conditionnelle le traitement ambulatoire, et de façon conditionnelle une chirurgie précoce chez le patient qui privilégie la prévention de la récidive. Accès : résumé et recommandations principales lus sur PubMed le 08.10.2026 ; le texte intégral n’a pas pu être ouvert depuis l’environnement de rédaction. Un chirurgien thoracique de l’Hôpital universitaire de Zurich figure parmi les auteurs.</p>
<div class="lab">Texte britannique antérieur : BTS 2023</div><p>La recommandation britannique (Thorax 2023;78 Suppl 3) a été lue en texte intégral. Elle recommande la surveillance du patient peu symptomatique quelle que soit la taille, le dispositif ambulatoire dans les centres équipés, puis l’exsufflation <b>ou</b> le drain, sans préférence entre les deux. Son parcours (caractéristiques à haut risque, taille de 2 cm, contrôles à 2 à 4 jours et à 2 à 4 semaines) reste l’outil pratique utilisé dans ce cours, car le résumé de l’ERS 2024 ne le contredit pas.</p>
<div class="lab">Texte européen antérieur : ERS 2015</div><p>Cette déclaration de groupe de travail porte sur le pneumothorax primaire : l’aspiration n’est requise que chez le patient symptomatique, et un traitement définitif avec symphyse est proposé après un pneumothorax persistant ou récidivant.</p>
<div class="lab">Essai qui nuance</div><p>Dans l’essai de Marx (2023, 402 adultes avec pneumothorax primaire complet), l’échec à 24 heures a été de 29 % après exsufflation contre 18 % après drain, avec moins de douleur et sans excès de récidive à un an. Le patient doit savoir qu’un second geste est possible.</p>
<div class="lab">Applicabilité en Suisse</div><p>Aucune recommandation nationale suisse spécifique n’a été retrouvée le 08.10.2026. La recommandation européenne s’applique à l’adulte ; elle ne couvre ni l’enfant, ni le pneumothorax traumatique ou iatrogène.</p>
<div class="lab">Niveau de preuve</div><p>La certitude des preuves est faible à très faible pour la plupart des comparaisons de la BTS 2023. La décision partagée avec le patient fait partie intégrante de la recommandation.</p></template>

<template data-pop="j93-decomp" data-title="Décompression à l’aiguille">
<div class="lab">Indication</div><p>La décompression est indiquée devant un pneumothorax sous tension suspecté cliniquement, sans attendre l’imagerie.</p>
<div class="lab">Site</div><p>Chez l’adulte, l’aiguille est introduite au quatrième ou cinquième espace intercostal, juste en avant de la ligne axillaire moyenne (ATLS 10e édition, 2018). Chez l’enfant, elle est introduite au deuxième espace intercostal sur la ligne médioclaviculaire. L’aiguille passe au ras du bord supérieur de la côte inférieure.</p>
<div class="lab">Pourquoi ce site</div><p>La paroi antérieure de l’adulte est souvent plus épaisse que la longueur d’un cathéter standard ; le site latéral réduit ce risque d’échec.</p>
<div class="lab">Critères d’efficacité et échecs</div><p>Un sifflement d’air et l’amélioration rapide de la pression artérielle et de la SpO₂ confirment l’efficacité. Le cathéter peut se couder, se boucher ou sortir. En cas d’échec, une thoracostomie au doigt est réalisée par un opérateur entraîné.</p>
<div class="lab">Suite obligatoire</div><p>Un drain thoracique est posé dans tous les cas, car la brèche reste ouverte.</p></template>

<template data-pop="j93-oedeme" data-title="Œdème pulmonaire de réexpansion">
<div class="lab">Définition</div><p>L’œdème de réexpansion associe une hypoxémie et des infiltrats alvéolaires nouveaux du poumon réexpandu ; il survient le plus souvent dans l’heure qui suit l’évacuation rapide d’air ou de liquide.</p>
<div class="lab">Mécanisme</div><p>Le poumon resté longtemps rétracté a un surfactant altéré et des capillaires plus perméables. La réexpansion brutale, surtout sous aspiration, augmente les forces de filtration et provoque un œdème lésionnel.</p>
<div class="lab">Fréquence</div><p>Il est visible radiologiquement dans jusqu’à un tiers des drainages de pneumothorax volumineux, mais il reste le plus souvent asymptomatique (déclaration clinique BTS 2023).</p>
<div class="lab">Prévention et conduite</div><p>Le médecin n’applique pas d’aspiration d’emblée après la pose d’un drain. En cas d’œdème, il évalue le patient, administre de l’oxygène selon la cible et soutient la ventilation si nécessaire. Il ne clampe pas un drain qui bulle, car le risque de tension est alors plus grave.</p></template>

<template data-pop="j93-exsuf" data-title="Exsufflation à l’aiguille">
<div class="lab">Principe</div><p>Un cathéter fin est introduit dans la plèvre, l’air est aspiré à la seringue par un robinet à trois voies, puis le cathéter est retiré. Le patient peut souvent rentrer à domicile.</p>
<div class="lab">Technique</div><p>La BTS 2010 décrivait un cathéter de 16 à 18 G, posé au deuxième espace intercostal sur la ligne médioclaviculaire ou dans le triangle de sécurité, après anesthésie locale. L’aspiration s’arrête en cas de résistance, de toux importante ou après 2,5 L ; un volume supérieur suggère une fuite qui persiste.</p>
<div class="lab">Critères de succès</div><p>Amélioration des symptômes et amélioration durable sur la radiographie de contrôle (BTS 2023). En cas d’échec, un drain est posé.</p>
<div class="lab">Preuves</div><p>Dans la méta-analyse de la BTS 2023, l’hospitalisation est plus courte de 2,55 jours qu’avec le drain, mais un second geste est plus fréquent. L’ERS/EACTS/ESTS 2024 recommande fortement l’exsufflation plutôt que le drain pour le traitement initial du pneumothorax primaire. Dans l’essai de Marx (2023), l’échec a été de 29 % contre 18 %, avec moins de douleur.</p>
<div class="lab">Limites</div><p>L’exsufflation n’est pas un geste de routine dans le pneumothorax secondaire, ni chez le patient ventilé.</p></template>

<template data-pop="j93-ambu" data-title="Dispositif ambulatoire à valve unidirectionnelle">
<div class="lab">Principe</div><p>Le dispositif est un petit drain intégré à une valve qui laisse sortir l’air sans le laisser entrer. Le patient rentre à domicile avec le dispositif. Une valve de Heimlich reliée à un drain classique fonctionne selon le même principe.</p>
<div class="lab">Indications</div><p>Il est indiqué pour le traitement initial du pneumothorax primaire chez un patient bien entouré, dans un centre disposant d’une expertise et d’un suivi (BTS 2023 ; ERS/EACTS/ESTS 2024, recommandation conditionnelle). Il est en général à éviter dans le pneumothorax secondaire.</p>
<div class="lab">Preuves</div><p>Dans l’essai de Hallifax (Lancet 2020, 236 patients de 16 à 55 ans), la durée médiane d’hospitalisation a été de 0 jour contre 4 jours, mais les événements indésirables ont été plus fréquents (55 % contre 39 %). Les 14 événements graves sont tous survenus dans le groupe ambulatoire : agrandissement du pneumothorax, œdème, dysfonction, fuite ou déplacement du dispositif.</p>
<div class="lab">Surveillance</div><p>Le patient est revu en consultation tous les 2 à 3 jours ; le dispositif est retiré à la résolution, puis un contrôle a lieu à 2 à 4 semaines (BTS 2023). La déclaration clinique de la BTS considère qu’une infirmière spécialisée en pathologie pleurale est indispensable à un tel parcours.</p></template>

<template data-pop="j93-drain" data-title="Drain thoracique">
<div class="lab">Calibre</div><p>Le calibre s’exprime en French (Fr) : 1 Fr = 1/3 mm, donc un drain de 12 Fr a un diamètre externe de 4 mm. Un drain de 14 Fr ou moins est dit de petit calibre. Il convient à la plupart des pneumothorax spontanés et iatrogènes ; un plus gros calibre se discute en cas de fuite importante, de pneumothorax secondaire à grosse fuite ou de patient ventilé (déclaration clinique BTS 2023).</p>
<div class="lab">Pose</div><p>Le drain est posé par technique de Seldinger dans le triangle de sécurité, au ras du bord supérieur de la côte, après anesthésie locale. Le trocart métallique est à éviter, car il expose à des lésions d’organe.</p>
<div class="lab">Surveillance quotidienne</div><p>Le médecin vérifie l’oscillation du liquide avec la respiration, qui prouve la perméabilité, et le bullage, qui prouve une fuite. Le bocal reste sous le niveau du thorax, avec assez d’eau pour couvrir l’extrémité du tube. Une radiographie contrôle la position dans les heures qui suivent la pose.</p>
<div class="lab">Règles de sécurité</div><p>Un drain qui bulle n’est jamais clampé, sauf supervision spécialisée. L’aspiration n’est pas appliquée d’emblée. L’arrêt de l’oscillation fait rechercher une coudure ou une obstruction, levée par un rinçage au sérum physiologique.</p>
<div class="lab">Retrait</div><p>Le drain est retiré quand le poumon est réexpandu et que le bullage a cessé.</p></template>

<template data-pop="j93-triangle" data-title="Triangle de sécurité">
<div class="lab">Limites</div><p>Le triangle est limité en avant par le bord latéral du grand pectoral, en arrière par le bord antérieur du grand dorsal et en bas par une ligne horizontale passant par le cinquième espace intercostal ; son sommet se situe sous l’aisselle. Cette définition provient des recommandations de la BTS sur la pose de drain.</p>
<div class="lab">Pourquoi ce site</div><p>Il évite la glande mammaire et les muscles pectoraux en avant, le nerf thoracique long en arrière, et le diaphragme, le foie et la rate en bas.</p>
<div class="lab">Piège</div><p>Le diaphragme remonte à l’expiration, surtout chez le patient couché ou obèse : un drain posé trop bas peut léser le foie ou la rate.</p></template>

<template data-pop="j93-fap" data-title="Fuite aérienne persistante">
<div class="lab">Définition</div><p>La fuite aérienne persistante se manifeste par un bullage prolongé du drain ou par l’absence de réexpansion. Sa définition varie : la revue Breathe de l’ERS (2024) la considère installée vers 48 heures après le geste ; la BTS 2023 retient l’avis chirurgical si elle persiste malgré 5 à 7 jours de drainage ; la BTS 2010 conseillait un avis chirurgical à 3 à 5 jours.</p>
<div class="lab">Options</div><p>Le patient opérable est orienté vers la chirurgie. Chez le patient inopérable, le patch sanguin autologue est recommandé de façon conditionnelle dans le pneumothorax secondaire (ERS/EACTS/ESTS 2024) ; les valves endobronchiques se discutent sans recommandation formelle faute de preuves. L’aspiration n’a pas démontré de bénéfice ; si elle est utilisée, elle est à basse pression et haut débit.</p>
<div class="lab">Conséquence pratique</div><p>Un avis chirurgical précoce évite de prolonger un drainage inefficace, surtout chez le patient fragile.</p></template>

<template data-pop="j93-blood" data-title="Patch sanguin autologue">
<div class="lab">Principe</div><p>Du sang veineux du patient est prélevé stérilement et injecté par le drain dans la plèvre. La coagulation colmate la brèche et l’inflammation favorise l’accolement des plèvres.</p>
<div class="lab">Indication</div><p>Il est indiqué dans le pneumothorax secondaire avec fuite persistante, en particulier chez le patient inopérable (ERS/EACTS/ESTS 2024, recommandation conditionnelle ; BTS 2023, point de bonne pratique).</p>
<div class="lab">Preuves</div><p>La BTS 2023 note une hospitalisation plus courte qu’avec le drainage seul, à partir de données non gradées. La revue Breathe 2024 cite un essai où le colmatage a été obtenu chez 82 % des patients contre 9 % avec du sérum physiologique.</p>
<div class="lab">Risques</div><p>Infection pleurale et obstruction d’un drain de petit calibre par les caillots ; le volume injecté varie selon les protocoles.</p></template>

<template data-pop="j93-vats" data-title="Thoracoscopie vidéo-assistée et thoracotomie">
<div class="lab">Gestes</div><p>Le chirurgien résèque les bulles par agrafage, parfois renforcé par une colle, et réalise une symphyse par abrasion pleurale, pleurectomie partielle ou talcage. La BTS 2023 recommande de considérer l’une ou l’autre, ou les deux, sans supériorité démontrée.</p>
<div class="lab">Comparaison</div><p>Par rapport à la thoracotomie, la thoracoscopie réduit l’hospitalisation de 3,66 jours, la douleur et les complications, mais la récidive est un peu plus élevée : 31 contre 15 pour 1 000 patients (BTS 2023, certitude très faible).</p>
<div class="lab">Choix</div><p>La thoracoscopie convient au cas général. La thoracotomie est réservée aux patients dont le risque de récidive doit être le plus bas possible, par exemple certains pilotes ou plongeurs professionnels.</p>
<div class="lab">Information du patient</div><p>Le patient est informé du risque de douleurs chroniques et de paresthésies de la paroi.</p></template>

<template data-pop="j93-talc" data-title="Symphyse au talc">
<div class="lab">Principe</div><p>Le talc stérile provoque une inflammation pleurale suivie d’une fibrose qui accole les deux plèvres. Il est introduit en poudre pendant une thoracoscopie ou en suspension par un drain.</p>
<div class="lab">Preuves</div><p>Dans la méta-analyse de la BTS 2023, la récidive est de 179 pour 1 000 patients contre 320 avec le drain seul, pour les pneumothorax primaires et secondaires (certitude très faible), et le besoin d’opiacés est plus important. Le talc est moins efficace que la chirurgie.</p>
<div class="lab">Indications</div><p>Il sert à prévenir une récidive de pneumothorax secondaire chez un patient fragile, par exemple atteint de BPCO sévère décompensée par son premier épisode (BTS 2023) ; patient inopérable.</p>
<div class="lab">Sécurité</div><p>L’ERS 2015 exige un talc calibré, sans petites particules, associées à des syndromes de détresse respiratoire aiguë. Une analgésie est donnée avant et après le geste (BTS 2023). Le drain utilisé pour un talcage doit être d’au moins 12 Fr, car le talc obstrue les drains fins.</p>
<div class="lab">Statut suisse</div><p>Aucune information professionnelle suisse d’un talc pleural n’a été retrouvée sur swissmedicinfo-pro.ch le 08.10.2026.</p></template>

<template data-pop="j93-boyle" data-title="Loi de Boyle et Mariotte, avion et plongée">
<div class="lab">Loi</div><p>À température constante, le produit de la pression par le volume d’une quantité de gaz est constant. Quand la pression ambiante baisse, le volume d’un gaz piégé augmente.</p>
<div class="lab">Avion</div><p>La cabine est pressurisée à une altitude équivalente en général inférieure ou égale à 2 438 m (8 000 pieds), soit environ 75 kPa au lieu de 101 kPa. Un gaz piégé gagne environ 35 % de volume. Un pneumothorax persistant contre-indique le vol commercial ; le vol est possible 7 jours après la résolution radiographique complète (BTS 2023 et déclaration BTS 2022 sur le voyage aérien).</p>
<div class="lab">Plongée</div><p>La pression augmente d’environ 100 kPa tous les 10 m. Lors de la remontée de 10 m à la surface, un volume d’air pleural double. Une récidive en profondeur peut devenir une tension pendant la remontée. La BTS 2023 déconseille définitivement la plongée avec bouteille, sauf après une prévention chirurgicale très sûre comme une pleurectomie.</p>
<div class="lab">Suisse</div><p>Pour les pilotes, l’aptitude relève d’un médecin examinateur aéronautique. Pour les plongeurs, aucune règle publiée de la Société suisse de médecine subaquatique et hyperbare spécifique au pneumothorax n’a été retrouvée ; un médecin titulaire de l’attestation de formation complémentaire en médecine de plongée évalue l’aptitude.</p></template>
