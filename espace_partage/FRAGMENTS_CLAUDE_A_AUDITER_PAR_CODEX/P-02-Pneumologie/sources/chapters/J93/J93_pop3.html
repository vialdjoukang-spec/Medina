<template data-pop="j93-d-para" data-title="Paracétamol (Dafalgan)">
<div class="lab">Mécanisme</div><p>Le paracétamol a une action antalgique et antipyrétique centrale, avec une inhibition faible des cyclo-oxygénases périphériques ; il n’a presque pas d’effet anti-inflammatoire ni d’effet sur l’agrégation plaquettaire.</p>
<div class="lab">Posologie suisse</div><p>Information professionnelle de Dafalgan, mise à jour de juillet 2026, consultée le 08.10.2026 : adulte de plus de 50 kg, 1 g toutes les 4 à 8 heures, au maximum 4 g par 24 heures. Maximum 2 g par jour en cas d’atteinte hépatique chronique ou d’insuffisance hépatique légère à modérée, d’alcoolisme chronique, de malnutrition, de déshydratation ou de cachexie. Clairance de la créatinine de 10 à 50 mL/min : intervalle de 6 heures, au maximum 3 g par jour ; inférieure à 10 mL/min : intervalle de 8 heures, au maximum 2 g par jour.</p>
<div class="lab">Contre-indications</div><p>Le paracétamol est contre-indiqué en cas d’hypersensibilité, d’insuffisance hépatique sévère, d’hépatite aiguë, de maladie hépatique décompensée et de maladie de Gilbert.</p>
<div class="lab">Place</div><p>C’est l’antalgique de base de tout patient atteint de pneumothorax, y compris pendant la grossesse.</p></template>

<template data-pop="j93-d-ibu" data-title="Ibuprofène (Brufen)">
<div class="lab">Mécanisme</div><p>Inhibition réversible des cyclo-oxygénases 1 et 2, qui réduit la synthèse des prostaglandines responsables de la sensibilisation des terminaisons nerveuses de la plèvre pariétale.</p>
<div class="lab">Posologie suisse</div><p>Information professionnelle de Brufen, mise à jour de décembre 2024, consultée le 08.10.2026 : dose la plus faible efficace pendant la durée la plus courte, en prises fractionnées ; maximum de 2 400 mg par jour chez l’adulte.</p>
<div class="lab">Contre-indications</div><p>L’ibuprofène est contre-indiqué en cas de clairance de la créatinine inférieure à 30 mL/min, ulcère gastroduodénal actif ou récidivant, saignement digestif sous anti-inflammatoire, maladie inflammatoire intestinale active, insuffisance cardiaque sévère, insuffisance hépatique sévère, tendance hémorragique, troisième trimestre de grossesse.</p>
<div class="lab">Interactions</div><p>Le risque hémorragique augmente avec les anticoagulants oraux, les antiagrégants et les inhibiteurs sélectifs de la recapture de la sérotonine ; l’ibuprofène inhibe lui-même l’agrégation plaquettaire.</p></template>

<template data-pop="j93-d-opi" data-title="Opiacés dans le pneumothorax">
<div class="lab">Place</div><p>Les opiacés traitent la douleur non contrôlée par le paracétamol et l’anti-inflammatoire, notamment pendant un drainage, après une symphyse chimique ou après une chirurgie. La méta-analyse de la BTS 2023 montre un besoin d’opiacés plus élevé après symphyse chimique.</p>
<div class="lab">Mode d’emploi</div><p>Ils sont titrés selon le protocole de l’établissement et l’information professionnelle du produit choisi, avec une surveillance de la vigilance et de la fréquence respiratoire.</p>
<div class="lab">Prudence</div><p>Chez le patient atteint de BPCO hypercapnique, l’opiacé déprime la commande ventilatoire et peut aggraver l’hypercapnie. Un laxatif accompagne toute prescription de plus de quelques jours, car la constipation est constante.</p></template>

<template data-pop="j93-d-lido" data-title="Lidocaïne 1 % (Rapidocain)">
<div class="lab">Mécanisme</div><p>Blocage des canaux sodiques voltage-dépendants des fibres nerveuses, qui interrompt la conduction de l’influx douloureux.</p>
<div class="lab">Formes suisses</div><p>Rapidocain 10 mg/ml existe sans conservateur en ampoules de 5 et 10 mL et en flacon de 20 mL ; une forme avec épinéphrine existe aussi.</p>
<div class="lab">Posologie</div><p>Information professionnelle suisse (juillet 2024, consultée le 08.10.2026) : infiltration chez l’adulte jusqu’à 400 mg, soit 40 mL de la solution à 1 %. Déclaration clinique BTS 2023 pour les gestes pleuraux : jusqu’à 3 mg/kg, au maximum 250 mg ; de nombreux opérateurs utilisent jusqu’à 4,5 mg/kg (300 mg) ; avec adrénaline, jusqu’à 7 mg/kg (500 mg). Voir la fenêtre sur le choix du plafond.</p>
<div class="lab">Technique</div><p>Le médecin infiltre la peau, puis le plan musculaire au ras du bord supérieur de la côte, jusqu’à la plèvre pariétale, en aspirant avant chaque injection. L’aspiration d’air confirme l’entrée dans la plèvre et la profondeur du geste.</p>
<div class="lab">Toxicité</div><p>Un surdosage ou une injection intravasculaire provoque des paresthésies péribuccales, un goût métallique et des acouphènes, puis des convulsions et des troubles du rythme et de la conduction. L’information suisse contre-indique la lidocaïne en cas d’hypersensibilité aux anesthésiques de type amide, hypovolémie, insuffisance cardiaque aiguë décompensée, troubles de conduction, choc sévère, myasthénie, injection dans une zone infectée.</p></template>

<template data-pop="j93-lido-src" data-title="Plafond de la lidocaïne : information suisse et BTS">
<div class="lab">Question</div><p>Quelle dose maximale de lidocaïne 1 % utiliser pour l’anesthésie locale d’un drain ou d’une exsufflation chez l’adulte ?</p>
<div class="lab">Texte en vigueur en Suisse</div><p>Information professionnelle de Rapidocain (Sintetica), mise à jour de juillet 2024, lue sur swissmedicinfo-pro.ch le 08.10.2026 : infiltration chez l’adulte jusqu’à 400 mg (40 mL de la solution à 1 %). C’est le cadre réglementaire du produit.</p>
<div class="lab">Source spécialisée la plus récente</div><p>Déclaration clinique de la BTS sur les gestes pleuraux (Thorax 2023), lue en texte intégral : jusqu’à 3 mg/kg, au maximum 250 mg (25 mL) ; elle reconnaît l’absence de consensus et l’usage courant de 4,5 mg/kg (300 mg) sans augmentation nette des effets indésirables.</p>
<div class="lab">Choix retenu</div><p>Ce cours retient le plafond le plus bas, 3 mg/kg sans dépasser 250 mg. Il respecte à la fois l’autorisation suisse et la recommandation spécialisée la plus récente. Le choix s’explique par la région intercostale, très vascularisée, où l’absorption de l’anesthésique local est rapide.</p>
<div class="lab">Limites</div><p>Les deux sources ne s’opposent pas : la BTS précise un usage plus prudent dans le cadre de l’autorisation suisse. Aucune étude comparative n’a établi le plafond optimal pour les gestes pleuraux.</p></template>

<template data-pop="j93-d-n2o" data-title="Protoxyde d’azote">
<div class="lab">Usage habituel</div><p>Le mélange d’oxygène et de protoxyde d’azote à parts égales est utilisé pour l’analgésie de courte durée lors de gestes douloureux.</p>
<div class="lab">Pourquoi il est contre-indiqué</div><p>Le protoxyde d’azote est environ trente fois plus soluble dans le sang que l’azote. Il diffuse dans toute cavité gazeuse fermée plus vite que l’azote n’en sort, et le volume de cette cavité augmente. Un pneumothorax peut ainsi s’agrandir et devenir compressif.</p>
<div class="lab">Source</div><p>L’information produit européenne de ces mélanges (par exemple Livopan) le contre-indique en cas de signes ou de symptômes de pneumothorax. L’information professionnelle suisse correspondante n’a pas été retrouvée le 08.10.2026.</p>
<div class="lab">Conséquence pratique</div><p>Pour la pose d’un drain, l’analgésie repose sur l’anesthésie locale, le paracétamol, l’anti-inflammatoire et, si nécessaire, un opiacé titré.</p></template>
