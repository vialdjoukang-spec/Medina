
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j47-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="j47-0,j47-1,j47-2,j47-3,j47-4,j47-5,j47-6"></p>
<ul>
<li>Bronchiectasies = dilatation bronchique <b>permanente</b> à la tomodensitométrie + syndrome clinique (toux, crachats, exacerbations). J47 sans sous-code ; exclus : Q33.4 congénitale, A15–A16 tuberculose active, E84 mucoviscidose.</li>
<li>Environ 1 adulte sur 200 (Royaume-Uni) ; pas de données suisses ; retard diagnostique de plus de 10 ans chez 1 patient sur 4 ; étiquettes erronées d’asthme ou de BPCO.</li>
<li>Vortex : défaut de clairance → infection (<i>H. influenzae</i>, <i>P. aeruginosa</i>, MNT) → neutrophiles et élastase → destruction et dilatation → plus de rétention. Hémoptysie = artères bronchiques systémiques.</li>
<li>Causes : idiopathiques 20–40 %, post-infectieuses, BPCO, asthme ; traitables à ne pas manquer : ABPA, déficit en anticorps, MNT, mucoviscidose, DCP, obstacle localisé. Traction de fibrose ≠ J47.</li>
<li>Indices : début dans l’enfance, sinusites, infertilité, dextrocardie → génétique ; asthme et moules bruns → ABPA ; femme mince, lobe moyen → MNT.</li>
<li>Examen : crépitants grossiers modifiés par la toux, IMC, saturation ; examen normal possible.</li>
<li><i>P. aeruginosa</i> : mortalité environ ×3, hospitalisations environ ×7.</li>
</ul></template>

<template data-pop="pareto-j47-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j47-7"></p>
<ul>
<li>Suspecter : toux productive chronique, infections répétées, asthme ou BPCO aux exacerbations fréquentes, hémoptysie, <i>P. aeruginosa</i> dans les crachats.</li>
<li>Référence : tomodensitométrie en haute résolution hors épisode aigu (rapport broncho-artériel ≥ 1, absence d’effilement, bronches à &lt; 1 cm de la plèvre).</li>
<li>Bilan minimal pour tous (ERS 2025) : formule sanguine, IgG-IgA-IgM, électrophorèse, IgE et sérologie <i>Aspergillus</i>, culture des crachats avec BAAR.</li>
<li>Ciblé : sueur et CFTR, monoxyde d’azote nasal et tests ciliaires, alpha-1 antitrypsine, auto-immunité, réponse vaccinale, bronchoscopie si atteinte localisée.</li>
<li>Différentiels à éliminer d’abord : tuberculose active, cancer.</li>
</ul></template>

<template data-pop="pareto-j47-tt" data-title="Pareto — Exacerbations et traitement de fond">
<p class="ratio" data-cover="j47-8,j47-9"></p>
<ul>
<li>Urgences : hémoptysie abondante (asphyxie ; côté qui saigne en bas ; embolisation des artères bronchiques), sepsis, insuffisance respiratoire hypercapnique.</li>
<li>Exacerbation : ≥ 3 symptômes sur 6 aggravés ≥ 48 h + modification du traitement. Crachat avant l’antibiotique ; choix selon les cultures antérieures ; 14 jours, ou 7–10 jours si germe sensible et réponse rapide ; pas de corticostéroïde oral sans asthme ou BPCO.</li>
<li>Pour tous : drainage bronchique (forte), réhabilitation si dyspnée (forte), vaccins, plan d’autogestion.</li>
<li>Haut risque = ≥ 2 exacerbations par an, ou 1 + symptômes sévères, ou ≥ 1 hospitalisation.</li>
<li>Haut risque : macrolide au long cours après exclusion des MNT (forte) ; antibiotique inhalé si <i>P. aeruginosa</i> chronique (forte), autres germes (conditionnelle).</li>
<li>Non en routine : corticostéroïde inhalé sans asthme ni BPCO, DNase recombinante, antibiotique oral au long cours non macrolide.</li>
</ul></template>

<template data-pop="pareto-j47-crit" data-title="Pareto — Germes, suivi, situations particulières et critères">
<p class="ratio" data-cover="j47-10,j47-11,j47-12,j47-13"></p>
<ul>
<li>Premier <i>P. aeruginosa</i> : nouvelle culture, éradication rapide (ciprofloxacine 500–750 mg deux fois par jour 14 jours ± inhalé 3 mois). Chronique : 2 isolements à ≥ 3 mois d’intervalle sur 1 an.</li>
<li>MNT recherchées chez tous et avant tout macrolide ; jamais de macrolide seul si MNT active.</li>
<li>Suivi : exacerbations, crachats, poids, spirométrie annuelle, culture en état stable, QTc, audition, foie. Patient qui se dégrade : nouvelle infection, ABPA, observance, comorbidités.</li>
<li>Grossesse : pas de macrolide au long cours sans avis ; sujet âgé : interactions, audition, tendons ; insuffisance rénale : aminosides et ciprofloxacine.</li>
<li>Critères : radiologie (rapport ≥ 1, absence d’effilement, bronches près de la plèvre) + ≥ 2 sur 3 (toux, crachats, exacerbations).</li>
</ul></template>

<template data-pop="pareto-j47-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j47-e-1,j47-e-2,j47-e-3,j47-e-4,j47-e-5"></p>
<ul>
<li>Socle pour tous : tomodensitométrie, culture des crachats avec BAAR, immunoglobulines et électrophorèse, sérologie de l’ABPA.</li>
<li>Topographie : lobes supérieurs → mucoviscidose ; central → ABPA ; lobe moyen et lingula → MNT ou DCP ; un seul lobe → obstacle.</li>
<li>ABPA (ISHAM 2024) : sensibilisation + IgE totales ≥ 500 UI/mL + 2 parmi IgG <i>Aspergillus</i>, éosinophilie, imagerie.</li>
<li>Sueur : chlorure ≥ 60 mmol/L compatible ; 30–59 intermédiaire → génétique.</li>
<li>BSI : 0–4 léger, 5–8 modéré, ≥ 9 sévère (âge et hospitalisation pèsent le plus). FACED : 0–2, 3–4, 5–7 ; E-FACED + 2 si hospitalisation.</li>
<li>Spirométrie : souvent obstructive, sans profil propre ; les scores ne décident pas seuls d’un traitement préventif.</li>
</ul></template>

<template data-pop="pareto-j47-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="j47-sa,j47-sh,j47-sp,j47-sm,j47-sg"></p>
<ul>
<li>Bronche comparée à l’artère pulmonaire voisine ; hémoptysie par les artères bronchiques systémiques, cible de l’embolisation.</li>
<li>Paroi : perte des cils, du cartilage et de l’élastine, infiltration neutrophilique → dilatation irréversible.</li>
<li>Clairance : cils libres dans une couche périciliaire hydratée par CFTR ; la toux et le drainage la remplacent.</li>
<li>Neutrophiles → élastase activée par la DPP-1 → destruction ; <i>P. aeruginosa</i> en biofilm → éradication précoce.</li>
<li>Mucoviscidose et DCP surtout autosomiques récessives ; situs inversus dans environ la moitié des DCP.</li>
</ul></template>

<template data-pop="pareto-j47-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j47-p-1,j47-p-2,j47-p-3,j47-p-4"></p>
<ul>
<li>Azithromycine 250 mg par jour ou 500 mg trois fois par semaine (hors indication) ; avant : BAAR négatifs, QTc, audition, foie.</li>
<li>Antibiotiques inhalés si <i>P. aeruginosa</i> chronique ; bronchodilatateur et drainage avant ; première dose surveillée.</li>
<li>Ciprofloxacine 500–750 mg deux fois par jour : seule option orale contre <i>P. aeruginosa</i> ; tendons, QT, CYP1A2, cations.</li>
<li>Brensocatib 10 ou 25 mg par jour (ASPEN, environ 20 % d’exacerbations en moins ; hyperkératose) ; non retrouvé en Suisse.</li>
<li>Interactions : macrolides et QT ; érythromycine et itraconazole et CYP3A4 (itraconazole + budésonide ou fluticasone inhalés → Cushing).</li>
<li>À éviter : corticostéroïde inhalé sans indication, DNase recombinante, antitussifs, macrolide seul si MNT.</li>
</ul></template>
