
<!-- ===== FENÊTRES : anamnèse, examen, examens complémentaires ===== -->
<template data-pop="j47-a-enfance" data-title="Début dans l’enfance">
<div class="lab">Pourquoi le demander</div><p>Une toux productive présente depuis l’enfance oriente vers une cause génétique ou un déficit immunitaire. Le résumé clinique ERS 2026 rappelle qu’un patient dont les symptômes ont débuté dans l’enfance a une maladie génétique jusqu’à preuve du contraire.</p>
<div class="lab">Question utile</div><p>« Toussiez-vous et crachiez-vous déjà à l’école ? Avez-vous eu une coqueluche, une rougeole, une pneumonie grave ? »</p>
<div class="lab">Conséquence pratique</div><p>Une réponse positive conduit au test de la sueur, à l’exploration ciliaire et au bilan immunitaire, même chez un adulte de 50 ans.</p></template>

<template data-pop="j47-a-orl" data-title="Rhinosinusite chronique et otites">
<div class="lab">Mécanisme</div><p>Les sinus et l’oreille moyenne possèdent le même épithélium cilié que les bronches. Un défaut ciliaire, une mucoviscidose ou un déficit en anticorps les atteignent donc aussi.</p>
<div class="lab">Valeur</div><p>Une rhinosinusite chronique depuis l’enfance avec otites répétées oriente vers une DCP ; une polypose nasale chez un sujet jeune, vers une mucoviscidose.</p>
<div class="lab">Conséquence pratique</div><p>Les lavages nasaux au sérum physiologique soulagent la rhinosinusite associée, qui altère la qualité de vie et entretient l’écoulement postérieur.</p></template>

<template data-pop="j47-a-fert" data-title="Infertilité">
<div class="lab">Mécanisme</div><p>Le flagelle du spermatozoïde a la même structure que le cil : une DCP le rend immobile. Dans la mucoviscidose, l’absence bilatérale des canaux déférents cause une azoospermie obstructive. Le syndrome de Young associe azoospermie obstructive et bronchiectasies.</p>
<div class="lab">Conséquence pratique</div><p>Une infertilité masculine associée à des bronchiectasies conduit au test de la sueur, à l’analyse du CFTR et à l’exploration ciliaire. La question doit être posée avec tact, mais elle doit être posée.</p></template>

<template data-pop="j47-s-toux" data-title="Toux des bronchiectasies">
<div class="lab">Caractéristiques</div><p>Toux productive quotidienne ou presque, présente depuis des mois ou des années, maximale au réveil et lors des changements de position.</p>
<div class="lab">Mécanisme</div><p>Le mucus s’accumule pendant la nuit, faute de clairance ciliaire ; le passage à la position debout et l’activité le mobilisent et déclenchent la toux.</p>
<div class="lab">Piège</div><p>Un antitussif soulage le symptôme mais supprime le principal moyen de clairance ; il est déconseillé.</p></template>

<template data-pop="j47-s-crachats" data-title="Crachats : volume, couleur, purulence">
<div class="lab">Volume</div><p>Le patient l’estime en cuillères à soupe ou en fraction de gobelet par jour. Son volume habituel sert de référence pour reconnaître une exacerbation.</p>
<div class="lab">Couleur et purulence</div><p>Un crachat clair est muqueux ; jaune, vert ou brun, il est mucopurulent ou purulent. La couleur verte vient de la myéloperoxydase des neutrophiles : un crachat purulent n’est pas normal et traduit une charge en neutrophiles élevée, souvent associée à une infection bactérienne.</p>
<div class="lab">Valeur</div><p>La purulence est un facteur de risque d’exacerbation dans l’ERS 2025. Des crachats très épais, bruns, en moules bronchiques font évoquer une ABPA.</p></template>

<template data-pop="j47-s-dysp" data-title="Dyspnée et fatigue">
<div class="lab">Mécanismes</div><p>La dyspnée vient de l’obstruction des petites voies aériennes, de la distension, du déconditionnement musculaire et parfois d’une comorbidité cardiaque. La fatigue accompagne l’inflammation chronique, les troubles du sommeil liés à la toux et la dépression.</p>
<div class="lab">Mesure</div><p>L’échelle de dyspnée du Medical Research Council entre dans les scores BSI et FACED.</p>
<div class="lab">Conséquence pratique</div><p>Une dyspnée ou une capacité d’effort réduite conduit à la réhabilitation respiratoire (recommandation forte ERS 2025) et à la recherche des traits traitables, dont l’insuffisance cardiaque.</p></template>

<template data-pop="j47-s-hemopt" data-title="Hémoptysie">
<div class="lab">Mécanisme</div><p>L’inflammation chronique fait proliférer les artères bronchiques, issues de l’aorte, à pression systémique. Leur érosion par l’inflammation ou l’infection saigne dans la lumière bronchique.</p>
<div class="lab">Formes</div><p>Stries de sang lors d’une exacerbation, fréquentes et habituellement traitées avec l’exacerbation ; hémoptysie franche ; hémoptysie grave, définie surtout par son retentissement (gêne respiratoire, hypoxémie, instabilité hémodynamique).</p>
<div class="lab">Piège</div><p>Une hémoptysie nouvelle ne doit pas être attribuée d’emblée aux bronchiectasies : un cancer, une tuberculose active, une MNT ou une embolie pulmonaire doivent être exclus.</p>
<div class="lab">Conséquence pratique</div><p>Hémoptysie nouvelle : radiographie, avis spécialisé, souvent tomodensitométrie. Hémoptysie grave : position latérale du côté qui saigne, protection des voies aériennes, angiotomodensitométrie et embolisation des artères bronchiques.</p></template>

<template data-pop="j47-x-imc" data-title="Indice de masse corporelle et dénutrition">
<div class="lab">Technique</div><p>Poids en kilogrammes divisé par le carré de la taille en mètres, mesurés à chaque consultation.</p>
<div class="lab">Valeur</div><p>Un IMC inférieur à 18,5 kg/m² ajoute 2 points au BSI, car il est associé à la mortalité. La dénutrition traduit le coût énergétique de la toux, de l’inflammation et du travail respiratoire.</p>
<div class="lab">Conséquence pratique</div><p>Un patient dénutri est adressé au diététicien ; un amaigrissement récent fait rechercher une MNT, une tuberculose ou un cancer.</p></template>

<template data-pop="j47-x-crep" data-title="Crépitants grossiers">
<div class="lab">Définition</div><p>Bruits discontinus, de tonalité grave, entendus au début et au milieu de l’inspiration, souvent aux bases.</p>
<div class="lab">Mécanisme</div><p>L’air traverse des sécrétions mobiles dans des bronches dilatées et crée des bulles qui éclatent. Une toux déplace les sécrétions et modifie les crépitants.</p>
<div class="lab">Technique</div><p>Ausculter avant et après une toux volontaire ; noter la topographie, qui reflète les lobes atteints.</p>
<div class="lab">Piège</div><p>Les crépitants fins, télé-inspiratoires et fixes évoquent plutôt une fibrose ; les crépitants de l’insuffisance cardiaque s’accompagnent d’autres signes de congestion.</p></template>

<template data-pop="j47-x-ronchi" data-title="Ronchi et sibilants">
<div class="lab">Définition</div><p>Les ronchi sont des bruits continus graves, liés aux sécrétions dans les grosses bronches ; les sibilants sont des bruits continus aigus, liés au rétrécissement des voies aériennes.</p>
<div class="lab">Valeur</div><p>Les ronchi qui disparaissent après une toux confirment la présence de sécrétions mobiles. Des sibilants diffus font rechercher un asthme ou une BPCO associés ; un sibilant localisé et fixe fait rechercher un obstacle.</p></template>

<template data-pop="j47-x-hippo" data-title="Hippocratisme digital">
<div class="lab">Définition</div><p>Bombement des ongles et élargissement de l’extrémité des doigts ; l’angle entre l’ongle et le repli unguéal dépasse 180 degrés.</p>
<div class="lab">Technique</div><p>Signe de Schamroth : en accolant face à face les ongles de deux doigts symétriques, la fenêtre losangique normale disparaît.</p>
<div class="lab">Valeur</div><p>Il a été classique dans les bronchiectasies suppurées ; il est devenu rare. Son apparition chez un fumeur fait rechercher un cancer bronchique, car il n’est jamais dû à l’asthme ni à la BPCO isolée.</p></template>

<template data-pop="j47-tdm" data-title="Tomodensitométrie thoracique en haute résolution">
<div class="lab">Technique</div><p>Acquisition volumique sans injection de produit de contraste, en inspiration profonde, avec reconstruction en coupes fines. Des coupes en expiration peuvent montrer un piégeage aérique.</p>
<div class="lab">Valeur</div><p>Examen de référence du diagnostic. Il précise la forme, l’étendue lobaire, les bouchons muqueux et les signes orientant vers une cause.</p>
<div class="lab">Pièges</div><p>Un examen réalisé pendant une pneumonie peut montrer une dilatation réversible. Des coupes épaisses ou des artefacts de mouvement font manquer des dilatations périphériques. Les bronchiectasies de traction d’une fibrose ne sont pas des bronchiectasies J47.</p>
<div class="lab">Conséquence pratique</div><p>La tomodensitométrie n’est pas répétée systématiquement ; elle l’est en cas de dégradation inexpliquée, d’hémoptysie ou de suspicion d’une complication.</p></template>

<template data-pop="j47-ig" data-title="Immunoglobulines et réponse vaccinale">
<div class="lab">Dosage</div><p>IgG, IgA et IgM sériques avec électrophorèse des protéines, interprétées selon les valeurs de référence du laboratoire.</p>
<div class="lab">Réponse vaccinale</div><p>Lorsque les immunoglobulines sont normales ou limites mais que les infections sont répétées, on mesure les anticorps contre plusieurs sérotypes de pneumocoque avant puis quelques semaines après une vaccination par le vaccin polysaccharidique. Une réponse insuffisante définit un déficit en anticorps spécifiques.</p>
<div class="lab">Piège</div><p>Une hypogammaglobulinémie peut être secondaire : anticorps anti-CD20, corticostéroïdes à forte dose, myélome, leucémie lymphoïde chronique, pertes digestives ou rénales.</p>
<div class="lab">Conséquence pratique</div><p>Un déficit confirmé conduit à un avis d’immunologie et, selon le cas, à une substitution en immunoglobulines.</p></template>

<template data-pop="j47-expecto" data-title="Examen des crachats">
<div class="lab">Recueil</div><p>Crachat matinal après rinçage de la bouche, acheminé rapidement. Un patient qui ne crache pas peut obtenir un échantillon après drainage bronchique ou après une inhalation de sérum salé hypertonique.</p>
<div class="lab">Demande</div><p>Culture bactériologique standard et culture pour BAAR, demandée explicitement. L’ERS 2025 recommande une culture chez tous les patients au diagnostic, en état stable, et au début de chaque exacerbation si possible.</p>
<div class="lab">Interprétation</div><p>Une culture négative est fréquente après un antibiotique. Une culture positive chez un patient stable ne justifie pas un antibiotique, sauf premier <i>P. aeruginosa</i>, qui conduit à l’éradication.</p></template>

<template data-pop="j47-sueur" data-title="Test de la sueur">
<div class="lab">Principe</div><p>La pilocarpine appliquée par iontophorèse stimule la sudation ; on mesure la concentration de chlorure dans la sueur recueillie. Le canal CFTR défaillant ne réabsorbe pas le chlorure dans le canal sudoral : la sueur est trop salée.</p>
<div class="lab">Seuils</div><p>Chlorure ≥ 60 mmol/L : compatible avec une mucoviscidose ; 30 à 59 mmol/L : valeur intermédiaire qui impose l’analyse génétique ; &lt; 30 mmol/L : mucoviscidose peu probable (consensus de la Cystic Fibrosis Foundation, 2017).</p>
<div class="lab">Conséquence pratique</div><p>Un test positif ou intermédiaire conduit à l’analyse du CFTR et à l’avis d’un centre de mucoviscidose ; le patient relève alors du cours E84.</p></template>

<template data-pop="j47-nno" data-title="Monoxyde d’azote nasal et tests ciliaires">
<div class="lab">Principe</div><p>L’épithélium des sinus produit normalement beaucoup de monoxyde d’azote ; dans la DCP, cette production est très basse pour des raisons encore discutées.</p>
<div class="lab">Valeur</div><p>Une valeur basse, mesurée selon une technique standardisée chez un patient coopérant, oriente fortement vers une DCP ; elle peut aussi être basse dans la mucoviscidose et lors d’une sinusite aiguë.</p>
<div class="lab">Confirmation</div><p>Vidéomicroscopie à haute vitesse du battement ciliaire sur brossage nasal, microscopie électronique de l’ultrastructure ciliaire et génétique, dans un centre de référence.</p></template>

<template data-pop="j47-exa" data-title="Définition de l’exacerbation (Hill et al., 2017)">
<div class="lab">Définition</div><p>Aggravation d’au moins trois des six symptômes suivants pendant au moins 48 heures : toux ; volume ou consistance des crachats ; purulence des crachats ; dyspnée ou tolérance à l’effort ; fatigue ou malaise ; hémoptysie ; et décision d’un clinicien de modifier le traitement.</p>
<div class="lab">Limite</div><p>Elle a été conçue pour les essais. En pratique, l’ERS 2025 demande de tenir compte du ressenti du patient, qui détecte souvent des changements précoces.</p>
<div class="lab">Exacerbation sévère</div><p>Une exacerbation qui exige une hospitalisation ou un antibiotique intraveineux compte comme sévère ; une seule par an place le patient à haut risque selon l’ERS 2025.</p></template>

<template data-pop="j47-embol" data-title="Embolisation des artères bronchiques">
<div class="lab">Principe</div><p>Un radiologue interventionnel cathétérise les artères bronchiques à partir de l’artère fémorale et les occlut par des microparticules.</p>
<div class="lab">Pourquoi elle agit</div><p>Le saignement vient des artères bronchiques hypertrophiées, à pression systémique ; leur occlusion tarit le saignement sans altérer les échanges gazeux, assurés par les artères pulmonaires.</p>
<div class="lab">Préparation</div><p>L’angiotomodensitométrie localise le saignement et cartographie les artères.</p>
<div class="lab">Risques</div><p>Récidive si d’autres artères se développent ; complication rare mais grave : ischémie médullaire si une artère spinale naît d’une artère bronchique ou intercostale embolisée.</p></template>

<template data-pop="j47-bsi" data-title="Score BSI">
<div class="lab">Construction</div><p>Dérivé d’une cohorte de 608 patients d’Édimbourg et validé dans quatre cohortes européennes (Chalmers et al., 2014).</p>
<div class="lab">Variables</div><p>Âge (0 à 6 points), IMC &lt; 18,5 kg/m² (2), VEMS (0 à 3), hospitalisation dans les deux années précédentes (5), au moins trois exacerbations dans l’année (2), dyspnée MRC (0 à 3), colonisation par <i>P. aeruginosa</i> (3) ou par un autre germe (1), au moins trois lobes atteints ou forme kystique (1).</p>
<div class="lab">Interprétation</div><p>0–4 léger, 5–8 modéré, ≥ 9 sévère. Pour le groupe sévère, la mortalité à quatre ans allait de 9,9 à 29,2 % et l’hospitalisation à quatre ans de 41,2 à 80,4 % dans les cohortes (site du réseau européen des bronchiectasies).</p>
<div class="lab">Limite</div><p>Il prédit la mortalité et l’hospitalisation à l’échelle d’un groupe ; il ne décide pas seul d’un traitement.</p></template>

<template data-pop="j47-faced" data-title="Scores FACED et E-FACED">
<div class="lab">Variables</div><p>VEMS &lt; 50 % (2 points), âge ≥ 70 ans (2), colonisation chronique à <i>P. aeruginosa</i> (1), plus de deux lobes atteints (1), dyspnée MRC de grade III ou IV (1). Total 0 à 7 : 0–2 léger, 3–4 modéré, 5–7 sévère (Martínez-García et al., 2014, mortalité à cinq ans).</p>
<div class="lab">E-FACED</div><p>Ajoute 2 points pour au moins une exacerbation hospitalisée dans l’année précédente ; total 0 à 9. Il prédit mieux les exacerbations que le FACED (Martínez-García et al., 2017).</p>
<div class="lab">Comparaison</div><p>Le FACED est plus simple ; le BSI prédit mieux les hospitalisations et les exacerbations. Les deux sont acceptés.</p></template>

<template data-pop="j47-risque" data-title="Risque futur d’exacerbation selon l’ERS 2025">
<div class="lab">Définition opérationnelle</div><p>Haut risque : au moins deux exacerbations par an, ou une exacerbation par an associée à des symptômes sévères, ou au moins une exacerbation sévère hospitalisée par an (algorithme ERS 2025).</p>
<div class="lab">Facteurs aggravants</div><p>Cause (BPCO, DCP, polyarthrite rhumatoïde), infection à bactérie à Gram négatif, surtout <i>P. aeruginosa</i>, crachats purulents, MNT, ABPA.</p>
<div class="lab">Symptômes sévères</div><p>L’ERS 2025 ne fixe pas de seuil. Le résumé clinique 2026 propose des repères non officiels : un score de qualité de vie spécifique aux bronchiectasies de 40 ou moins, ou un score de symptômes équivalent.</p>
<div class="lab">Changement par rapport à 2017</div><p>L’ERS 2017 réservait les traitements préventifs aux patients ayant au moins trois exacerbations par an ; ce seuil réservait des traitements efficaces aux formes avancées.</p></template>

<template data-pop="j47-rapid" data-title="Patient qui se dégrade (ERS 2025)">
<div class="lab">Définition</div><p>Augmentation de la fréquence ou de la sévérité des exacerbations, aggravation marquée des symptômes ou déclin rapide de la fonction respiratoire.</p>
<div class="lab">Démarche</div><p>Rechercher une nouvelle infection (<i>P. aeruginosa</i>, MNT), une ABPA, une mauvaise observance du drainage ou des traitements, une comorbidité nouvelle (insuffisance cardiaque, reflux, anxiété, dépression) ; répéter le bilan étiologique ; réévaluer la tomodensitométrie si nécessaire.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin de premier recours adresse rapidement au pneumologue le patient qui se dégrade, plutôt que de multiplier les cures d’antibiotiques.</p></template>
