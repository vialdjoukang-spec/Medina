<section class="ilot" id="j47-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 58 ans, enseignante, jamais fumeuse, consulte pour une toux grasse quotidienne qui dure depuis plus de dix ans. Elle crache chaque matin l’équivalent de deux à trois cuillères à soupe d’expectorations jaunes. Elle a reçu trois cures d’antibiotiques cette année pour des « bronchites ». On lui a d’abord dit qu’elle avait un asthme, puis une bronchopneumopathie chronique obstructive (BPCO), mais aucun inhalateur ne l’a soulagée. Elle a fait une coqueluche sévère à 6 ans. Depuis deux semaines, ses crachats contiennent des stries de sang.</p>
<p>La question qui structure tout le cours est la suivante : <b>cette patiente a-t-elle des bronchiectasies, comment les prouver, quelle maladie les a causées, quel est son risque d’exacerbation et de décès, et quels traitements réduiront ce risque ?</b></p>
<p>À la fin du cours, le médecin assistant reconnaît le syndrome clinique des bronchiectasies, prescrit la tomodensitométrie qui en fait la preuve, réalise le bilan étiologique minimal de l’European Respiratory Society (ERS), mesure la sévérité par les scores BSI et FACED, traite une exacerbation, reconnaît une hémoptysie grave et construit un traitement de fond selon la recommandation ERS 2025.</p>
<div class="key"><b>Message fondateur.</b> Les bronchiectasies ne sont pas une maladie unique mais l’aboutissement commun de nombreuses agressions bronchiques. Le diagnostic ne s’arrête pas à l’image : il exige la recherche de la cause, car plusieurs causes ont un traitement propre qui change le pronostic (déficit en anticorps, aspergillose bronchopulmonaire allergique, mycobactéries non tuberculeuses, mucoviscidose).</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="j47-mucocil">clairance mucociliaire (escalier mucociliaire)</button>, l’<button class="w" data-k="j47-neutro">inflammation neutrophilique (élastase et protéases)</button> et le <button class="w" data-k="j47-cercle">cercle vicieux de Cole (modèle du vortex)</button>. Ces notions sont approfondies dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="j47-1"><h2><span class="n">1</span>Définition, codage et classifications</h2>
<p>Les bronchiectasies sont une <b>dilatation permanente et irréversible des bronches</b>, associée à un syndrome clinique de toux, d’expectoration et d’infections respiratoires récidivantes. Le mot « permanente » est essentiel : une bronche peut paraître dilatée pendant une pneumonie puis reprendre son calibre en quelques mois. Le mot « syndrome clinique » l’est aussi : une dilatation découverte par hasard sur un scanner, sans aucun symptôme, n’a pas la même signification qu’une maladie bronchique suppurative.</p>
<p>Le consensus international de 2021 (Aliberti et al., Lancet Respiratory Medicine 2022) exige donc deux composantes pour parler de bronchiectasies cliniquement significatives : une <button class="w" data-k="j47-bar">preuve radiologique (rapport broncho-artériel, absence d’effilement)</button> et au moins deux éléments cliniques parmi la toux la plupart des jours, l’expectoration la plupart des jours et des exacerbations. Ce consensus a été écrit pour les essais thérapeutiques ; il sert de repère en pratique.</p>
<h3>1.1 Codage CIM-10-GM 2024</h3>
<p>La catégorie J47 « Bronchectasie » de la CIM-10-GM 2024 n’a <b>pas de subdivision</b> : le code J47 s’emploie seul (vérifié sur le site du BfArM, bloc J40–J47, le 08.10.2026). Elle inclut la bronchiolectasie. Trois situations sont exclues et relèvent d’autres catégories ; elles sont renvoyées vers leur cours sans être dupliquées ici.</p>
<table class="t"><tr><th>Situation</th><th>Code</th><th>Où elle est traitée</th></tr>
<tr><td>Bronchiectasie congénitale</td><td>Q33.4</td><td>Malformations pulmonaires congénitales (fragment pédiatrique)</td></tr>
<tr><td>Bronchiectasie tuberculeuse en phase active</td><td>A15–A16</td><td>Cours de la tuberculose (A15–A19)</td></tr>
<tr><td>Mucoviscidose avec atteinte pulmonaire</td><td>E84</td><td>Cours de la mucoviscidose (E84) ; ce cours n’en traite que le diagnostic à ne pas manquer</td></tr></table>
<p>Ce tableau se lit par la cause. Une patiente guérie d’une tuberculose il y a vingt ans, qui garde des bronches dilatées, relève bien de J47 ; on peut y ajouter le code de séquelle de tuberculose (B90). À l’inverse, un adolescent porteur de deux variants pathogènes du gène <button class="w" data-k="j47-cf">CFTR (mucoviscidose, renvoi vers E84)</button> relève de E84, même si son scanner montre des bronchiectasies. L’erreur fréquente consiste à coder J47 sans avoir cherché une mucoviscidose chez un adulte jeune.</p>
<h3>1.2 Classification morphologique de Reid</h3>
<p>La <button class="w" data-k="j47-reid">classification de Reid (cylindriques, variqueuses, kystiques)</button> décrit la forme des bronches dilatées. Les formes cylindriques sont les plus fréquentes et les moins sévères ; les formes kystiques traduisent une destruction pariétale avancée et comptent comme critère de gravité dans le score BSI.</p>
<h3>1.3 Classifications de sévérité et de risque</h3>
<p>Deux scores validés mesurent la sévérité : le <button class="w" data-k="j47-bsi">score BSI (neuf variables, 0 à 26 points)</button> et le <button class="w" data-k="j47-faced">score FACED (cinq variables, 0 à 7 points)</button>. La recommandation ERS 2025 ajoute une évaluation <b>individuelle du risque futur d’exacerbation</b>, qui ne se limite plus au nombre d’exacerbations de l’année précédente ; elle est détaillée à l’îlot 9.</p>
<div class="key"><b>À retenir.</b> Le diagnostic associe une dilatation bronchique permanente démontrée par tomodensitométrie et un syndrome clinique. J47 n’a pas de sous-code en CIM-10-GM 2024 ; la forme congénitale, la tuberculose active et la mucoviscidose sont codées ailleurs. La sévérité se mesure par les scores BSI ou FACED et le risque futur par l’évaluation individuelle de l’ERS 2025.</div>
</section>

<section class="ilot" id="j47-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les bronchiectasies sont décrites comme la troisième maladie respiratoire chronique des voies aériennes après l’asthme et la BPCO. Selon le résumé de la recommandation ERS 2025 destiné aux médecins de premier recours (Mosgrove et al., 2026), environ <b>un adulte sur 200</b> en est atteint au Royaume-Uni, et les taux d’hospitalisation et de mortalité y augmentent d’environ 4 % par an. En Allemagne, une estimation fondée sur les données de facturation de 2013 retenait 67 cas pour 100 000 habitants (Ringshausen et al., 2015). <b>Aucune donnée de prévalence suisse publiée n’a été trouvée</b> ; la lacune est nommée et les chiffres européens servent de repère.</p>
<p>La prévalence augmente avec l’âge et la maladie touche davantage les femmes. L’augmentation récente reflète en partie la diffusion de la tomodensitométrie : un plus grand nombre de bronchiectasies est reconnu, sans que l’on puisse séparer la part d’une augmentation réelle de celle d’un meilleur diagnostic.</p>
<p>Le <b>retard diagnostique</b> est le problème majeur de premier recours. Un patient sur quatre attend plus de dix ans avant que le diagnostic soit posé (Mosgrove et al., 2026). Pendant ce délai, il est souvent étiqueté « asthme », « BPCO » ou « bronchites à répétition », comme la patiente de l’îlot 0.</p>
<h3>2.1 Pronostic</h3>
<p>Le pronostic dépend de la cause, de la fréquence des exacerbations et de l’infection chronique. L’infection chronique à <button class="w" data-k="j47-pseudo">Pseudomonas aeruginosa (marqueur de gravité)</button> est associée à une mortalité environ trois fois plus élevée et à un risque d’hospitalisation environ sept fois plus élevé (données reprises par Mosgrove et al., 2026). Cette association ne prouve pas à elle seule une causalité : <i>P. aeruginosa</i> colonise surtout des bronches déjà très altérées. Elle justifie néanmoins une conduite active, car l’éradication précoce et les antibiotiques inhalés réduisent les exacerbations.</p>
<p>Les patients porteurs de bronchiectasies ont en moyenne trois à quatre comorbidités : maladie cardiovasculaire, ostéoporose, reflux gastro-œsophagien, rhinosinusite chronique, anxiété et dépression. Ces comorbidités pèsent sur la qualité de vie et sur la mortalité, d’où l’approche par « traits traitables » de l’ERS 2025.</p>
<div class="key"><b>À retenir.</b> Environ un adulte sur 200 serait atteint en nord-ouest de l’Europe ; les données suisses manquent. Le diagnostic est en moyenne très tardif. Les exacerbations fréquentes, l’hospitalisation et l’infection chronique à <i>P. aeruginosa</i> signalent le mauvais pronostic ; les comorbidités doivent être recherchées activement.</div>
</section>

<section class="ilot" id="j47-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Une bronche se dilate durablement lorsque sa paroi perd ses éléments de soutien (cartilage, fibres élastiques, muscle lisse) sous l’effet d’une inflammation prolongée. Chaque étape de cette destruction explique un symptôme, et chaque traitement agit sur une étape.</p>
<h3>3.1 État normal</h3>
<p>Chez le sujet sain, les bronches s’effilent progressivement de la trachée vers la périphérie. Une bronche a un diamètre interne inférieur à celui de l’artère pulmonaire qui l’accompagne. Le mucus capte les particules et les bactéries inhalées, puis l’<button class="w" data-k="j47-mucocil">escalier mucociliaire</button> le remonte vers le larynx, où il est dégluti sans que la personne s’en aperçoive. La toux n’intervient qu’en appoint.</p>
<h3>3.2 Première charnière : défaut de clairance</h3>
<p>Une agression initiale altère la clairance : infection sévère qui détruit l’épithélium cilié (coqueluche, rougeole, pneumonie nécrosante, tuberculose), cils immobiles de la <button class="w" data-k="j47-dcp">dyskinésie ciliaire primitive (DCP)</button>, mucus déshydraté de la mucoviscidose, obstruction localisée par un corps étranger ou une tumeur. Le mucus stagne.</p>
<h3>3.3 Deuxième charnière : infection chronique</h3>
<p>Le mucus qui stagne devient un milieu de culture. <i>Haemophilus influenzae</i> est la bactérie la plus fréquente ; <i>P. aeruginosa</i>, <i>Staphylococcus aureus</i>, <i>Moraxella catarrhalis</i> et les <button class="w" data-k="j47-mnt">mycobactéries non tuberculeuses (MNT)</button> suivent. Chez une partie des patients, une hypersensibilité à <i>Aspergillus fumigatus</i> produit une <button class="w" data-k="j47-abpa">aspergillose bronchopulmonaire allergique (ABPA)</button>.</p>
<h3>3.4 Troisième charnière : inflammation neutrophilique</h3>
<p>Les bactéries attirent les polynucléaires neutrophiles par des chimiokines comme CXCL8. Les neutrophiles libèrent des <button class="w" data-k="j47-neutro">sérine-protéases (élastase neutrophile)</button>, qui digèrent l’élastine et le collagène de la paroi, ralentissent le battement ciliaire et stimulent la sécrétion de mucus. Le pus des crachats est fait de ces neutrophiles : un crachat purulent n’est pas normal.</p>
<h3>3.5 Quatrième charnière : destruction et dilatation</h3>
<p>La paroi digérée cède à la traction élastique du parenchyme voisin et à la pression de la toux : la bronche se dilate. Les dilatations retiennent encore davantage le mucus, et le cycle s’entretient. Cole a décrit ce cercle vicieux en 1986 ; le <button class="w" data-k="j47-cercle">modèle du vortex</button> (Flume et al., 2018) insiste sur le fait que chaque composante aggrave toutes les autres, ce qui justifie de traiter plusieurs composantes à la fois.</p>
<h3>3.6 Cinquième charnière : manifestations</h3>
<p>La rétention de mucus infecté produit la <b>toux productive quotidienne</b>. Les poussées infectieuses produisent les <b>exacerbations</b>. Les artères bronchiques, issues de l’aorte et donc à pression systémique, s’hypertrophient autour des bronches inflammatoires ; leur érosion produit l’<button class="w" data-k="j47-s-hemopt">hémoptysie (sang à pression systémique)</button>. L’obstruction des petites voies aériennes par le mucus et l’épaississement pariétal expliquent l’obstruction spirométrique et la dyspnée. Aux stades évolués apparaissent hypoxémie, hypertension pulmonaire et dénutrition.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> Le drainage bronchique et les agents mucoactifs agissent sur la clairance ; l’éradication et les antibiotiques inhalés réduisent la charge bactérienne ; les macrolides réduisent l’inflammation et la sécrétion de mucus en plus de leur effet antibactérien ; l’inhibiteur de la <button class="w" data-k="j47-d-dpp1">DPP-1 (brensocatib)</button> diminue l’activation des protéases neutrophiles ; le traitement de la cause supprime l’agression initiale. Un traitement qui n’agit que sur l’infection laisse les autres composantes progresser.</div>
</section>

<section class="ilot" id="j47-4"><h2><span class="n">4</span>Étiologies et maladies associées</h2>
<p>La recherche de la cause n’est pas un exercice académique. Selon l’ERS 2025, une partie des causes possède un traitement spécifique qui modifie l’évolution. Les bronchiectasies restent néanmoins <b>idiopathiques dans 20 à 40 % des cas</b>, avec une grande variation d’un centre à l’autre, en partie parce que le bilan est inégalement réalisé (Mosgrove et al., 2026).</p>
<p>Le tableau suivant classe les causes selon la question pratique : faut-il un traitement propre ? Il distingue les causes fréquentes des causes rares mais traitables.</p>
<table class="t"><tr><th>Groupe</th><th>Exemples</th><th>Indice clinique</th><th>Conséquence</th></tr>
<tr><td>Post-infectieuses</td><td><button class="w" data-k="j47-postinf">Coqueluche, rougeole, pneumonie sévère, tuberculose guérie</button></td><td>Infection grave datée ; atteinte souvent localisée</td><td>Diagnostic d’exclusion : le bilan minimal reste nécessaire</td></tr>
<tr><td>Maladies des voies aériennes</td><td><button class="w" data-k="j47-bpco">BPCO, asthme sévère</button></td><td>Tabac, obstruction, éosinophilie</td><td>Traiter la maladie associée ; corticostéroïde inhalé seulement si elle l’exige</td></tr>
<tr><td>Allergique</td><td><button class="w" data-k="j47-abpa">ABPA</button></td><td>Asthme, crachats épais en moules, IgE totales très élevées</td><td>Corticostéroïde oral ou itraconazole</td></tr>
<tr><td>Déficits immunitaires</td><td><button class="w" data-k="j47-dici">DICV, hypogammaglobulinémie secondaire</button></td><td>Infections oto-rhino-laryngologiques et pulmonaires répétées, sinusites</td><td>Substitution en immunoglobulines</td></tr>
<tr><td>Génétiques</td><td><button class="w" data-k="j47-cf">Mucoviscidose (E84)</button>, <button class="w" data-k="j47-dcp">DCP</button>, déficit en alpha-1 antitrypsine</td><td>Début dans l’enfance, sinusites, infertilité, situs inversus</td><td>Centre spécialisé ; modulateurs du CFTR pour la mucoviscidose</td></tr>
<tr><td>Maladies systémiques</td><td><button class="w" data-k="j47-sys">Polyarthrite rhumatoïde, syndrome de Sjögren, colite ulcéreuse</button></td><td>Arthrites, sécheresse, diarrhée sanglante</td><td>Attention aux immunosuppresseurs</td></tr>
<tr><td>Infection mycobactérienne</td><td><button class="w" data-k="j47-mnt">MNT</button></td><td>Femme mince, lobe moyen et lingula, nodules</td><td>Recherche systématique ; pas de macrolide seul</td></tr>
<tr><td>Obstruction localisée</td><td><button class="w" data-k="j47-obstr">Corps étranger, tumeur, adénopathie</button></td><td>Atteinte d’un seul lobe ; pneumonies au même endroit</td><td>Bronchoscopie</td></tr>
<tr><td>Inhalation et reflux</td><td>Troubles de la déglutition, reflux sévère</td><td>Atteinte des segments déclives</td><td>Bilan de la déglutition</td></tr>
<tr><td>Rares</td><td><button class="w" data-k="j47-rare">Mounier-Kuhn, Williams-Campbell, syndrome de Young, ongles jaunes</button></td><td>Trachée large, ongles jaunes, azoospermie</td><td>Centre spécialisé</td></tr></table>
<p>Ce tableau se lit en commençant par la dernière colonne. Les lignes dont la conséquence est un traitement spécifique (ABPA, déficit en anticorps, MNT, mucoviscidose, obstruction localisée) sont celles qu’il ne faut jamais manquer. Exemple : un homme de 45 ans aux pneumonies répétées et aux sinusites chroniques a une IgG à 3 g/L ; sa cause est un déficit en anticorps, et la substitution en immunoglobulines réduira ses infections.</p>
<p>La relation entre bronchiectasies et MNT, ou entre bronchiectasies et ABPA, est <b>bidirectionnelle</b>. Ces affections peuvent créer les bronchiectasies, mais des bronches déjà dilatées favorisent aussi leur apparition. C’est pourquoi le bilan est répété lorsque l’état du patient se dégrade.</p>
<div class="trap"><span class="k">Piège</span>Les bronchiectasies de traction d’une fibrose pulmonaire ne relèvent pas de J47. Elles résultent de la rétraction du parenchyme fibreux qui tire sur la paroi bronchique, et non d’une maladie bronchique suppurative. Elles se codent avec la pneumopathie interstitielle (J84) et ne reçoivent pas le traitement des bronchiectasies.</div>
<div class="key"><b>À retenir.</b> Les causes les plus fréquentes sont post-infectieuses, idiopathiques et liées à la BPCO ou à l’asthme. Les causes traitables à ne jamais manquer sont l’ABPA, le déficit en anticorps, les MNT, la mucoviscidose, la DCP et l’obstruction bronchique localisée.</div>
</section>

<section class="ilot" id="j47-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse doit faire évoquer le diagnostic, orienter vers la cause et mesurer le retentissement. Elle cherche une toux productive chronique, des infections répétées et les indices des causes traitables.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Antécédents personnels</h4><p><button class="w" data-k="j47-a-enfance">Infection grave ou début des symptômes dans l’enfance</button> ; pneumonies répétées au même endroit ; <button class="w" data-k="j47-a-orl">rhinosinusite chronique et otites</button> ; <button class="w" data-k="j47-a-fert">infertilité (homme ou femme)</button> ; asthme ou BPCO « résistants au traitement » ; polyarthrite rhumatoïde, maladie inflammatoire de l’intestin ; reflux, troubles de la déglutition ; traitement immunosuppresseur ou anticorps anti-CD20 ; inhalation d’un corps étranger.</p></div>
<div class="card"><h4>Antécédents familiaux et exposition</h4><p>Mucoviscidose, DCP ou bronchiectasies dans la fratrie, consanguinité parentale (maladies autosomiques récessives). Tabagisme en paquets-années, exposition aux fumées de biomasse. Exposition à des eaux de douche ou de spa en aérosol, qui transmettent les MNT.</p></div></div>
<h3>5.2 Symptômes, du plus fréquent au moins fréquent</h3>
<p><b>Toux chronique</b> — Quotidienne ou presque, présente depuis des mois ou des années, maximale au réveil, lorsque les sécrétions accumulées pendant la nuit se mobilisent. Voir la <button class="w" data-k="j47-s-toux">fiche de la toux des bronchiectasies</button>.</p>
<p><b>Expectoration</b> — Quotidienne, mucopurulente ou purulente, de volume variable. Le patient sait souvent quantifier son volume et sa couleur habituels, et cette connaissance sert de référence pour reconnaître une exacerbation. Voir la <button class="w" data-k="j47-s-crachats">fiche des crachats (volume, couleur, purulence)</button>.</p>
<p><b>Dyspnée et fatigue</b> — La dyspnée d’effort traduit l’obstruction et le déconditionnement ; la fatigue, souvent sous-estimée, accompagne l’inflammation chronique. Voir la <button class="w" data-k="j47-s-dysp">fiche dyspnée et fatigue</button>.</p>
<p><b>Hémoptysie</b> — Des stries de sang dans les crachats sont fréquentes lors des exacerbations ; une hémoptysie abondante est une urgence. Voir la <button class="w" data-k="j47-s-hemopt">fiche de l’hémoptysie</button>.</p>
<p><b>Douleur thoracique</b> — Elle est souvent de type pleural lors des exacerbations ; elle impose d’éliminer une embolie pulmonaire ou une pneumonie si elle est nouvelle.</p>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Adulte de plus de 50 ans, toux grasse quotidienne depuis des années, trois exacerbations par an, crachats jaunes, crépitants aux bases. Souvent étiqueté asthme ou BPCO avant le scanner.</p></div>
<div class="card"><h4>Forme sèche</h4><p>Toux peu productive, patiente mince, atteinte du lobe moyen et de la lingula. Ce profil fait rechercher une infection à MNT, car l’expectoration est rare et la culture doit être demandée spécifiquement.</p></div>
<div class="card"><h4>Forme à début précoce</h4><p>Toux productive depuis l’enfance, otites, sinusites, infertilité, dextrocardie. Elle impose de chercher une DCP ou une mucoviscidose, quel que soit l’âge au diagnostic.</p></div>
<div class="card"><h4>Asthme qui « ne répond pas »</h4><p>Asthme ancien, crachats épais bruns en moules bronchiques, éosinophilie : profil de l’ABPA.</p></div>
<div class="card"><h4>BPCO aux exacerbations fréquentes</h4><p>Fumeur aux exacerbations répétées, expectoration purulente chronique, <i>P. aeruginosa</i> dans les crachats : association BPCO et bronchiectasies, de pronostic plus sombre.</p></div>
<div class="card"><h4>Forme hémoptoïque</h4><p>Peu de crachats, hémoptysies répétées, souvent une séquelle localisée de tuberculose ; la recherche d’un cancer ou d’une tuberculose active est prioritaire.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Accepter sans preuve une étiquette d’asthme ou de BPCO chez un patient qui crache tous les jours et ne répond pas aux inhalateurs. Le résumé ERS 2026 pour le premier recours recommande de réévaluer ces diagnostics et de demander une tomodensitométrie lorsque la toux est productive et les infections répétées.</div>
<div class="key"><b>À retenir.</b> L’anamnèse évoque le diagnostic devant une toux productive chronique avec infections répétées, et elle oriente vers la cause par l’âge de début, les sinusites, l’infertilité, l’asthme et les maladies systémiques. Le volume et la couleur habituels des crachats sont notés : ils servent de référence pour reconnaître une exacerbation.</div>
</section>

<section class="ilot" id="j47-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen peut être normal dans une forme légère. Dans les formes typiques, il retrouve des bruits surajoutés en rapport avec les sécrétions et des signes qui orientent vers la cause ou la gravité.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Fréquence respiratoire, saturation pulsée en oxygène, température et pression artérielle ; ces paramètres mesurent la gravité d’une exacerbation. Poids, taille et <button class="w" data-k="j47-x-imc">indice de masse corporelle (dénutrition, IMC inférieur à 18,5 kg/m²)</button> : la dénutrition compte dans le score BSI.</p></div>
<div class="card"><h4>Auscultation pulmonaire</h4><p><button class="w" data-k="j47-x-crep">Crépitants grossiers inspiratoires</button>, souvent aux bases, modifiés par la toux ; <button class="w" data-k="j47-x-ronchi">ronchi et sibilants (sécrétions, obstruction)</button>. Une auscultation localisée et fixe oriente vers une atteinte segmentaire ou un obstacle.</p></div>
<div class="card"><h4>Mains et extrémités</h4><p><button class="w" data-k="j47-x-hippo">Hippocratisme digital</button>, devenu rare. Ongles jaunes épaissis (syndrome des ongles jaunes). Déformations articulaires de la polyarthrite rhumatoïde.</p></div>
<div class="card"><h4>Signes d’orientation et de gravité</h4><p>Bruits du cœur à droite (dextrocardie de la DCP), polypes nasaux, écoulement purulent postérieur. Cyanose, œdèmes des membres inférieurs, turgescence jugulaire : hypoxémie chronique et cœur pulmonaire.</p></div></div>
<div class="trap"><span class="k">Piège</span>Des crépitants aux bases chez un adulte ne signent pas toujours une insuffisance cardiaque ou une fibrose. Les crépitants des bronchiectasies sont plus grossiers, précoces dans l’inspiration et changent après une toux, parce qu’ils naissent de sécrétions mobiles ; les crépitants fins de la fibrose sont télé-inspiratoires et fixes.</div>
<div class="key"><b>À retenir.</b> L’examen cherche des crépitants grossiers modifiés par la toux, mesure la gravité par les signes vitaux et la saturation, et repère les indices de la cause : dextrocardie, polypes, arthrite, ongles jaunes. Un examen normal n’exclut pas le diagnostic.</div>
