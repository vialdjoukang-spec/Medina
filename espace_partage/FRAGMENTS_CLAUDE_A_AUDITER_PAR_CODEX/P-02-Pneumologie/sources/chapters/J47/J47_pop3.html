
<!-- ===== FENÊTRES : traitement et monographies ===== -->
<template data-pop="j47-kine" data-title="Kinésithérapie de drainage bronchique">
<div class="lab">Objectif</div><p>Mobiliser les sécrétions des petites voies aériennes vers les grosses bronches, puis les évacuer par une expiration forcée ou une toux contrôlée.</p>
<div class="lab">Techniques</div><p>Cycle actif des techniques respiratoires (contrôle respiratoire, expansion thoracique, expirations forcées) ; drainage autogène (respiration à volumes croissants) ; dispositifs à pression expiratoire positive, fixes ou oscillants, qui maintiennent les bronches ouvertes pendant l’expiration ; drainage postural selon les lobes atteints. Aucune technique n’a démontré sa supériorité (ERS 2025).</p>
<div class="lab">Mode d’emploi</div><p>La technique est choisie et enseignée par un physiothérapeute respiratoire, puis pratiquée quotidiennement, et intensifiée pendant les exacerbations. La recommandation BTS 2019 propose des séances de 10 à 30 minutes, une ou deux fois par jour, selon le volume des crachats. Une bonne hydratation fluidifie le mucus.</p>
<div class="lab">Preuves</div><p>Recommandation forte de l’ERS 2025 malgré une certitude très faible, parce que le bénéfice attendu est jugé important et le risque faible. Moins de la moitié des patients européens ont appris une technique, et environ la moitié seulement la pratiquent régulièrement (Mosgrove et al., 2026).</p>
<div class="lab">En Suisse</div><p>La physiothérapie respiratoire est prescrite par le médecin et prise en charge par l’assurance obligatoire selon l’ordonnance sur les prestations (OPAS), par séries de séances renouvelables.</p></template>

<template data-pop="j47-auto" data-title="Plan d’autogestion et réserve d’antibiotique">
<div class="lab">Contenu</div><p>Description des crachats habituels, signes d’une exacerbation, intensification du drainage, conduite en cas d’hémoptysie, coordonnées à appeler.</p>
<div class="lab">Réserve d’antibiotique</div><p>Elle permet de débuter le traitement sans délai. Le résumé ERS 2026 pour le premier recours la réserve aux patients capables de reconnaître une exacerbation, dont le traitement efficace est connu et qui préviennent le médecin dès qu’ils le commencent, afin que la fréquence des exacerbations reste mesurée.</p>
<div class="lab">Règle</div><p>Le patient recueille un crachat avant la première dose lorsqu’il le peut.</p></template>

<template data-pop="j47-vacc" data-title="Vaccinations en Suisse">
<div class="lab">Grippe</div><p>Le Plan de vaccination suisse recommande la vaccination annuelle contre la grippe aux personnes atteintes d’une maladie respiratoire chronique.</p>
<div class="lab">Pneumocoques</div><p>La vaccination contre les pneumocoques est recommandée aux personnes atteintes d’une maladie pulmonaire chronique, selon le schéma en vigueur de l’OFSP.</p>
<div class="lab">Autres</div><p>Les vaccinations contre la COVID-19, le virus respiratoire syncytial et la coqueluche suivent les critères d’âge et de maladie du Plan de vaccination suisse de l’année en cours.</p>
<div class="lab">Mécanisme</div><p>Les infections virales et pneumococciques déclenchent des exacerbations ; les prévenir réduit le nombre d’exacerbations et de cures d’antibiotiques.</p></template>

<template data-pop="j47-eradic" data-title="Éradication de Pseudomonas aeruginosa">
<div class="lab">Indication</div><p>Premier isolement de <i>P. aeruginosa</i> (recommandation conditionnelle de l’ERS 2025, certitude très faible). Une nouvelle culture confirme l’isolement sans retarder la discussion.</p>
<div class="lab">Schémas</div><p>Ciprofloxacine orale 500 à 750 mg deux fois par jour pendant deux semaines, souvent suivie d’un antibiotique inhalé pendant trois mois ; antibiotique intraveineux en cas de résistance ou d’échec. Exemple du résumé ERS 2026 : ciprofloxacine 750 mg deux fois par jour pendant 14 jours, puis colistine nébulisée deux fois par jour pendant trois mois.</p>
<div class="lab">Pourquoi tôt</div><p>Au premier isolement, les bactéries ne sont pas encore protégées par un biofilm mature ; les chances d’éradication diminuent ensuite.</p>
<div class="lab">Suivi</div><p>Cultures répétées après le traitement ; deux isolements à au moins trois mois d’intervalle sur un an définissent ensuite l’infection chronique.</p></template>

<template data-pop="j47-chir" data-title="Chirurgie de résection">
<div class="lab">Indications</div><p>Atteinte localisée à un lobe ou un segment, réfractaire à un traitement médical optimal ; hémoptysie récidivante localisée malgré l’embolisation ; abcès ou obstacle non accessible à la bronchoscopie.</p>
<div class="lab">Limite</div><p>L’ERS 2017 recommandait de ne pas opérer, sauf maladie localisée et réfractaire ; ce point n’a pas été réexaminé en 2025 et reste valable selon le résumé clinique 2026. Une maladie diffuse n’est pas une indication.</p></template>

<template data-pop="j47-tx" data-title="Transplantation pulmonaire">
<div class="lab">Indication</div><p>Maladie terminale malgré un traitement optimal : fonction respiratoire très basse, insuffisance respiratoire chronique, hypertension pulmonaire, exacerbations sévères répétées. L’algorithme ERS 2025 du patient qui se dégrade inclut l’orientation vers une évaluation de transplantation.</p>
<div class="lab">Particularité</div><p>Les bronchiectasies diffuses imposent une transplantation bipulmonaire, pour ne pas laisser un poumon infecté contaminer le greffon.</p></template>

<template data-pop="j47-d-azi" data-title="Azithromycine au long cours">
<div class="lab">Mécanisme</div><p>Macrolide qui se lie à la sous-unité 50S du ribosome bactérien. Au long cours, ses effets anti-inflammatoires et immunomodulateurs dominent : moins de recrutement des neutrophiles, moins de sécrétion de mucus, inhibition des facteurs de virulence de <i>P. aeruginosa</i>.</p>
<div class="lab">Preuves</div><p>EMBRACE (2012, 500 mg trois fois par semaine pendant six mois) et BAT (2013, 250 mg par jour pendant douze mois) ont réduit les exacerbations. Le résumé ERS 2026 pour le premier recours chiffre la réduction des exacerbations à environ 50 %. Recommandation forte de l’ERS 2025, certitude modérée, chez le patient à haut risque.</p>
<div class="lab">Posologie</div><p>250 mg par jour, 500 mg ou 250 mg trois fois par semaine ; l’ERS 2025 privilégie les prises intermittentes, mieux tolérées sur le plan digestif. Prescription hors indication autorisée en Suisse.</p>
<div class="lab">Avant de commencer</div><p>Cultures pour BAAR négatives, ECG avec QTc, interrogatoire sur l’audition, tests hépatiques ; revue des médicaments qui allongent le QT.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée et nausées jusqu’à un patient sur cinq ; acouphènes et baisse de l’audition, réversibles à l’arrêt ; atteinte hépatique rare et précoce ; allongement du QT ; résistance des streptocoques commensaux.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux macrolides ; MNT active non traitée ; QTc long. Le résumé de l’information professionnelle de Zithromax consulté sur Compendium mentionne aussi la grossesse et l’allaitement ; l’information professionnelle complète n’a pas pu être lue.</p></template>

<template data-pop="j47-d-ery" data-title="Érythromycine au long cours">
<div class="lab">Preuve</div><p>BLESS (2013) : érythromycine éthylsuccinate 400 mg deux fois par jour pendant 48 semaines ; réduction des exacerbations, mais sélection de streptocoques oropharyngés résistants aux macrolides.</p>
<div class="lab">Place</div><p>Alternative lorsque l’azithromycine n’est pas disponible ou mal tolérée ; le résumé ERS 2026 cite l’érythromycine et la clarithromycine comme substituts.</p>
<div class="lab">Piège</div><p>Inhibiteur puissant du CYP3A4 : interactions avec les statines, la colchicine, la ciclosporine et les alcaloïdes de l’ergot, contrairement à l’azithromycine.</p></template>

<template data-pop="j47-d-inh" data-title="Antibiotiques inhalés">
<div class="lab">Principe</div><p>L’inhalation dépose de fortes concentrations d’antibiotique au contact des bactéries, avec une exposition systémique faible.</p>
<div class="lab">Preuves</div><p>Recommandation forte de l’ERS 2025, certitude modérée, chez le patient infecté chroniquement par <i>P. aeruginosa</i> et à haut risque ; conditionnelle pour les autres germes. PROMIS I (2024) : colistiméthate deux fois par jour, 0,58 contre 0,95 exacerbation par an (rapport de taux 0,61) ; PROMIS II, interrompu par la pandémie, n’a pas confirmé l’effet. Gentamicine nébulisée 80 mg deux fois par jour pendant 12 mois : moins d’exacerbations et une charge bactérienne réduite (Murray et al., 2011).</p>
<div class="lab">Mode d’emploi</div><p>Drainage bronchique et bronchodilatateur avant l’inhalation ; première dose sous surveillance spécialisée pour détecter un bronchospasme.</p>
<div class="lab">Effets indésirables</div><p>Bronchospasme, toux, altération du goût ; toxicité rénale et auditive possible avec les aminosides chez l’insuffisant rénal ou en association avec d’autres médicaments toxiques.</p>
<div class="lab">En Suisse</div><p>Les formes inhalées disponibles sont surtout autorisées pour la mucoviscidose ; leur emploi dans les bronchiectasies est hors indication et relève du pneumologue.</p></template>

<template data-pop="j47-d-cipro" data-title="Ciprofloxacine">
<div class="lab">Mécanisme</div><p>Fluoroquinolone qui inhibe l’ADN gyrase et la topoisomérase IV bactériennes ; seule classe orale active sur <i>P. aeruginosa</i>.</p>
<div class="lab">Posologie citée</div><p>500 à 750 mg deux fois par jour pendant 14 jours pour une exacerbation ou une éradication (résumé ERS 2026 pour le premier recours). L’information professionnelle suisse en vigueur fixe la dose maximale et l’adaptation à la fonction rénale ; elle n’a pas pu être lue en texte intégral pour ce cours.</p>
<div class="lab">Effets indésirables</div><p>Tendinopathie et rupture tendineuse, surtout chez le sujet âgé et sous corticostéroïdes ; allongement du QT ; neuropathie ; troubles neuropsychiques ; colite à <i>Clostridioides difficile</i>.</p>
<div class="lab">Interactions</div><p>Théophylline et tizanidine (inhibition du CYP1A2) ; calcium, magnésium et fer, qui en réduisent l’absorption ; antivitamines K.</p>
<div class="lab">Restriction</div><p>Swissmedic a restreint le 29.01.2018 l’emploi des fluoroquinolones dans les infections bactériennes non compliquées aux situations où les autres antibiotiques ne conviennent pas ; elles ne sont pas un choix empirique de routine lorsque l’amoxicilline convient.</p></template>

<template data-pop="j47-d-sshyp" data-title="Solution saline hypertonique">
<div class="lab">Mécanisme</div><p>La solution saline hypertonique (6 à 7 %) attire l’eau dans la couche périciliaire par osmose, hydrate le mucus et stimule la toux.</p>
<div class="lab">Place</div><p>Recommandation conditionnelle de l’ERS 2025, certitude très faible, lorsque le drainage seul ne contrôle pas les symptômes. Elle complète le drainage sans le remplacer. Une méta-analyse de 2026 n’a pas montré de réduction significative des exacerbations par les agents mucoactifs, avec une certitude très faible (McCullough et al., 2026).</p>
<div class="lab">Mode d’emploi</div><p>Bronchodilatateur avant la nébulisation, par exemple salbutamol 2,5 mg nébulisé (résumé ERS 2026) ; première inhalation sous surveillance de la spirométrie.</p>
<div class="lab">Effet indésirable</div><p>Bronchospasme, parfois tardif même après un usage prolongé ; si les symptômes persistent, arrêt ou passage à une concentration plus faible.</p></template>

<template data-pop="j47-d-muco" data-title="Agents mucoactifs oraux">
<div class="lab">Molécules</div><p>La N-acétylcystéine rompt les ponts disulfure des glycoprotéines du mucus ; la carbocistéine modifierait la composition des mucines.</p>
<div class="lab">Preuves</div><p>Les données sont contradictoires et de faible certitude ; une sous-étude mécanistique de 2026 n’a pas montré de modification de la viscoélasticité des crachats sous carbocistéine ou solution hypertonique (McKelvey et al., 2026).</p>
<div class="lab">Conséquence pratique</div><p>Le bénéfice est réévalué individuellement ; un arrêt encadré est raisonnable chez le patient qui ne perçoit pas d’amélioration (Mosgrove et al., 2026).</p></template>

<template data-pop="j47-d-dnase" data-title="DNase recombinante (dornase alfa)">
<div class="lab">Mécanisme</div><p>Enzyme qui coupe l’ADN libéré par les neutrophiles morts et réduit la viscosité du mucus.</p>
<div class="lab">Pourquoi elle est déconseillée</div><p>Efficace dans la mucoviscidose, elle a augmenté les exacerbations et accéléré le déclin du VEMS dans un essai chez des patients atteints de bronchiectasies sans mucoviscidose (O’Donnell et al., 1998). L’ERS 2025 suggère de ne pas l’employer (recommandation conditionnelle, certitude très faible).</p>
<div class="lab">Piège</div><p>Un résultat favorable dans la mucoviscidose ne se transpose pas aux autres bronchiectasies : la composition du mucus et la maladie sous-jacente diffèrent.</p></template>

<template data-pop="j47-d-csi" data-title="Corticostéroïde inhalé dans les bronchiectasies">
<div class="lab">Recommandation</div><p>L’ERS 2025 suggère de ne pas prescrire de corticostéroïde inhalé au long cours sans asthme ni BPCO associés (conditionnelle, certitude faible).</p>
<div class="lab">Pourquoi</div><p>L’inflammation neutrophilique répond peu aux corticostéroïdes. Le corticostéroïde inhalé augmente le risque de pneumonie et peut favoriser l’infection bronchique bactérienne et l’infection à MNT ; à forte dose, il expose à l’insuffisance surrénalienne, au diabète et à l’ostéoporose.</p>
<div class="lab">Exception</div><p>Un asthme associé ou une BPCO avec éosinophilie peut le justifier. Chez un patient déjà traité sans indication claire, le médecin revoit le diagnostic d’asthme ou de BPCO et peut arrêter le corticostéroïde inhalé.</p></template>

<template data-pop="j47-d-bd" data-title="Bronchodilatateurs">
<div class="lab">Place</div><p>Une association BALA et AMLA est raisonnable chez le patient dyspnéique avec obstruction (résumé ERS 2026). Ce point de l’ERS 2017 n’a pas été réexaminé en 2025.</p>
<div class="lab">Autres usages</div><p>Un BACA avant le drainage, la solution hypertonique ou l’antibiotique inhalé prévient le bronchospasme et facilite l’expectoration.</p>
<div class="lab">Piège</div><p>Un BACA utilisé plus de quatre fois par jour chez un patient sans asthme fait rechercher une autre cause de dyspnée, comme une insuffisance cardiaque ou un déconditionnement.</p></template>

<template data-pop="j47-d-dpp1" data-title="Brensocatib, inhibiteur de la DPP-1">
<div class="lab">Mécanisme</div><p>La DPP-1 (cathepsine C) active, pendant la maturation des neutrophiles dans la moelle osseuse, l’élastase neutrophile, la protéinase 3 et la cathepsine G. Le brensocatib, inhibiteur oral réversible, diminue l’activité de ces protéases dans les neutrophiles qui atteindront les bronches.</p>
<div class="lab">Preuves</div><p>ASPEN (2025, 1 721 patients) : taux annualisé d’exacerbations de 1,02 avec 10 mg et de 1,04 avec 25 mg contre 1,29 sous placebo (rapports de taux 0,79 et 0,81) ; déclin du VEMS réduit avec 25 mg (différence de 38 mL).</p>
<div class="lab">Posologie étudiée</div><p>10 mg ou 25 mg une fois par jour.</p>
<div class="lab">Effets indésirables</div><p>Hyperkératose cutanée, habituellement légère, des mains et des pieds.</p>
<div class="lab">Statut</div><p>Autorisé aux États-Unis le 12.08.2025 et dans l’Union européenne le 18.11.2025. Aucune autorisation suisse n’a été retrouvée dans les sources consultées le 08.10.2026 ; une recommandation ERS dédiée aux anti-inflammatoires est en préparation.</p></template>

<template data-pop="j47-d-abpa" data-title="Traitement de l’ABPA">
<div class="lab">Principe</div><p>Le corticostéroïde oral réduit l’inflammation de type 2 ; l’itraconazole réduit la charge fongique qui l’entretient.</p>
<div class="lab">Recommandation ISHAM 2024</div><p>Prednisolone orale ou itraconazole en monothérapie pour l’ABPA aiguë ; association réservée aux exacerbations récidivantes. Pas de traitement systématique de l’ABPA asymptomatique.</p>
<div class="lab">Surveillance</div><p>Réponse évaluée par les symptômes, les IgE totales et l’imagerie. Itraconazole : interactions par inhibition du CYP3A4, dont le syndrome de Cushing avec le budésonide ou la fluticasone inhalés ; toxicité hépatique ; contre-indication en cas d’insuffisance cardiaque.</p></template>

<template data-pop="j47-d-ig" data-title="Substitution en immunoglobulines">
<div class="lab">Indication</div><p>Déficit confirmé de production d’anticorps avec infections bactériennes récidivantes, sur décision d’un immunologue.</p>
<div class="lab">Modalités</div><p>Perfusion intraveineuse toutes les 3 à 4 semaines ou injection sous-cutanée hebdomadaire ; la dose s’ajuste au taux résiduel d’IgG et à la fréquence des infections.</p>
<div class="lab">Effet</div><p>Elle restaure l’opsonisation des bactéries encapsulées, réduit les infections et ralentit la progression des bronchiectasies.</p></template>
