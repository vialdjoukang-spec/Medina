
<!-- ===== FENÊTRES : examens ===== -->
<template data-pop="r05-e-rx" data-title="Radiographie du thorax dans la toux">
<div class="lab">Indication</div><p>Toute toux chronique (ERS 2020, déclaration de bonne pratique ; DGP 2025, recommandation de consensus fort). Toute toux aiguë ou subaiguë avec signe d’alarme, en particulier une suspicion de pneumonie.</p>
<div class="lab">Technique</div><p>Cliché de face et de profil, debout, en inspiration profonde. Un cliché récent suffit ; l’ERS 2020 parle de radiographie « récente » sans fixer de délai.</p>
<div class="lab">Ce qu’elle montre</div><p>Masse, atélectasie, infiltrat, caverne, opacités interstitielles, signes de bronchiectasies, cardiomégalie, épanchement, adénopathies hilaires.</p>
<div class="lab">Limites</div><p>Elle ne voit pas un petit cancer central, des bronchiectasies débutantes ni une maladie interstitielle précoce. Un signe d’alarme persistant justifie une tomodensitométrie malgré une radiographie normale.</p></template>

<template data-pop="r05-e-spiro" data-title="Spirométrie dans la toux chronique">
<div class="lab">But</div><p>Rechercher une obstruction (rapport VEMS/CVF inférieur à la LIN) et sa réversibilité après bronchodilatateur.</p>
<div class="lab">Interprétation</div><p>Obstruction réversible : asthme probable. Obstruction persistante : BPCO ou asthme ancien. Spirométrie normale : fréquent dans la toux chronique ; elle n’exclut ni l’asthme à toux prédominante ni la bronchite à éosinophiles.</p>
<div class="lab">Limite</div><p>L’ERS 2020 souligne la très faible valeur prédictive négative de la réversibilité et de la variabilité du débit de pointe chez les patients à fonction normale.</p>
<div class="lab">Détails techniques</div><p>Les critères de qualité et les seuils de réversibilité sont exposés dans J45 — Asthme (P-02-Pneumologie).</p></template>

<template data-pop="r05-e-provoc" data-title="Test de provocation à la méthacholine">
<div class="lab">Principe</div><p>Inhalation de doses croissantes de méthacholine, un agoniste muscarinique qui contracte le muscle lisse bronchique. On mesure la dose qui fait chuter le VEMS de 20 %.</p>
<div class="lab">Interprétation</div><p>Positif à faible dose : hyperréactivité bronchique, compatible avec un asthme ou un asthme à toux prédominante. Négatif chez un patient non traité : asthme improbable ; une bronchite à éosinophiles reste possible.</p>
<div class="lab">Place</div><p>L’ERS 2020 note que les centres divergent sur son utilité dans la toux chronique ; la recommandation allemande de 2025 le propose, ou à défaut un essai de corticostéroïde inhalé de 4 semaines, en cas de suspicion d’hyperréactivité ou de bronchite à éosinophiles.</p>
<div class="lab">Contre-indications</div><p>Obstruction déjà sévère, infarctus ou accident vasculaire cérébral récent, anévrisme aortique non contrôlé : la bronchoconstriction provoquée serait dangereuse.</p></template>

<template data-pop="r05-e-feno" data-title="FeNO et éosinophiles sanguins dans la toux">
<div class="lab">Principe</div><p>La FeNO reflète l’activité de la NO synthase inductible épithéliale, induite par l’interleukine 13 ; elle marque une inflammation de type 2. Les éosinophiles sanguins reflètent l’action de l’interleukine 5.</p>
<div class="lab">Valeur</div><p>Méta-analyse citée par l’ERS 2020 : spécificité de 0,85 de la FeNO pour prédire un asthme chez l’adulte qui tousse ; aucun seuil consensuel. Éosinophiles sanguins supérieurs à 300 par µL : inflammation éosinophilique probable, à confirmer par des mesures répétées.</p>
<div class="lab">Limites</div><p>Un essai n’a pas montré que la FeNO prédise la réponse au montélukast. Aucune étude n’a évalué la valeur prédictive des éosinophiles sanguins dans la toux chronique. Le tabac abaisse la FeNO ; les corticostéroïdes abaissent les deux marqueurs.</p>
<div class="lab">Conséquence pratique</div><p>Des marqueurs élevés justifient un essai anti-inflammatoire ; des marqueurs bas le rendent moins probablement utile sans l’exclure.</p></template>

<template data-pop="r05-e-phimp" data-title="Explorations œsophagiennes dans la toux">
<div class="lab">pH-impédancemétrie de 24 heures</div><p>Une sonde nasale enregistre l’acidité et le passage de liquide ou de gaz dans l’œsophage, et les relie dans le temps aux épisodes de toux. L’ERS 2020 la juge inutile en l’absence de symptômes peptiques.</p>
<div class="lab">Manométrie haute résolution</div><p>Mesure la motricité œsophagienne ; elle montre la dysmotilité fréquente chez les patients qui toussent. Le transit baryté la détecte avec une faible sensibilité.</p>
<div class="lab">Place</div><p>La recommandation allemande de 2025 les réserve aux patients avec reflux typique qui ne répondent pas à un inhibiteur de la pompe à protons à forte dose, selon le consensus de Lyon 2.0, et au cas par cas aux patients sans symptôme digestif chez qui aucune autre cause n’est trouvée.</p>
<div class="lab">Conséquence pratique</div><p>Un reflux documenté et résistant peut conduire à discuter une chirurgie antireflux ; la recommandation allemande cite une méta-analyse d’études non contrôlées avec disparition de la toux chez 58 % des patients opérés, sans données suffisantes à long terme.</p></template>

<template data-pop="r05-e-coq" data-title="Diagnostic biologique de la coqueluche">
<div class="lab">PCR</div><p>La réaction en chaîne par polymérase sur un prélèvement nasopharyngé détecte l’ADN de <i>Bordetella pertussis</i>. Elle est la plus utile au début de la maladie, pendant les premières semaines de toux, lorsque la bactérie est encore présente.</p>
<div class="lab">Sérologie</div><p>La recherche d’anticorps dirigés contre la toxine pertussique devient utile plus tard, chez l’adolescent et l’adulte vus après plusieurs semaines de toux. Une vaccination récente gêne l’interprétation.</p>
<div class="lab">Réserve</div><p>Les délais précis d’utilité de chaque test et les seuils sérologiques dépendent du laboratoire ; ils n’ont pas été vérifiés dans une directive suisse pour ce cours.</p>
<div class="lab">Conséquence pratique</div><p>Le test se demande surtout lorsque son résultat change une décision : traitement précoce, protection d’un nourrisson ou d’une femme enceinte de l’entourage.</p></template>
