
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-r05-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="r05-0,r05-1,r05-2,r05-3,r05-4,r05-5,r05-6"></p>
<ul>
<li>Durée : aiguë moins de 3 semaines, subaiguë 3 à 8 semaines, chronique plus de 8 semaines (enfant : plus de 4 semaines).</li>
<li>R05 sans sous-code en CIM-10-GM 2024 ; U69.6! pour la toux chronique réfractaire ou inexpliquée ; R04.2 si hémorragie ; F45.33 si psychogène.</li>
<li>Toux chronique : environ 10 % des adultes, deux tiers de femmes, pic entre 50 et 70 ans ; incontinence, syncope, dépression.</li>
<li>Arc réflexe vagal : fibres Aδ et C, canaux TRPV1, TRPA1, P2X3, noyau du tractus solitaire ; hypersensibilité périphérique ou centrale.</li>
<li>Toux utile (mucus, obstacle) : ne pas la supprimer ; toux par hypersensibilité : traiter la cause puis neuromoduler.</li>
<li>Causes chroniques : tabac, asthme et bronchite à éosinophiles, reflux, rhinosinusite, inhibiteur de l’enzyme de conversion (effet de classe), BPCO ; ne pas manquer cancer, tuberculose, fibrose.</li>
<li>Coqueluche : quintes subaiguës de l’adulte, danger pour le nourrisson.</li>
<li>Anamnèse : signes d’alarme d’abord, puis médicaments, tabac, déclencheurs, score sur 10, incontinence.</li>
<li>Examen souvent normal ; hippocratisme jamais dû à l’asthme ni au reflux.</li></ul></template>

<template data-pop="pareto-r05-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="r05-7"></p>
<ul>
<li>Toux aiguë ou subaiguë sans alarme : ni examen ni antibiotique.</li>
<li>Toux chronique : radiographie du thorax et spirométrie pour tous ; pas de tomodensitométrie systématique.</li>
<li>Arrêt de l’inhibiteur de l’enzyme de conversion et du tabac ; poursuite du bilan si la toux persiste plus de 3 semaines après le changement.</li>
<li>Traits traitables : FeNO, éosinophiles, méthacholine, voies aériennes supérieures, reflux typique.</li>
<li>Essais séquentiels de 2 à 4 semaines, un à la fois, jugés sur un score.</li></ul></template>

<template data-pop="pareto-r05-urg" data-title="Pareto — Signes d’alarme et urgences">
<p class="ratio" data-cover="r05-8"></p>
<ul>
<li>Dyspnée de repos, stridor, SpO₂ inférieure à 90 %, fréquence cardiaque supérieure à 120 par minute, douleur thoracique.</li>
<li>Hémoptysie, dysphonie, fièvre, sueurs nocturnes, amaigrissement, dysphagie, immunodépression.</li>
<li>Modification de la toux chez un fumeur de 55 à 80 ans : tomodensitométrie même si la radiographie est normale.</li>
<li>Corps étranger de l’enfant : bronchoscopie ; coqueluche du nourrisson : hospitalisation.</li></ul></template>

<template data-pop="pareto-r05-tt" data-title="Pareto — Traitement">
<p class="ratio" data-cover="r05-9,r05-10"></p>
<ul>
<li>Toux aiguë : pas d’antibiotique ; miel après 12 mois ; antitussif bref discuté chez l’adulte.</li>
<li>Codéine contre-indiquée avant 12 ans, pendant l’allaitement, chez le métaboliseur ultrarapide (Swissmedic 2017).</li>
<li>Coqueluche : macrolide précoce, protection des nourrissons, vaccination à chaque grossesse.</li>
<li>Toux chronique : corticostéroïde inhalé ou antileucotriène 2 à 4 semaines ; inhibiteur de la pompe à protons seulement si reflux typique.</li>
<li>Toux réfractaire : explication, orthophonie, morphine à libération prolongée 5 à 10 mg deux fois par jour (recommandation forte), gabapentine ou prégabaline.</li>
<li>Géfapixant 45 mg deux fois par jour, autorisé par Swissmedic en 2022 : bénéfice modeste, dysgueusie 41 %.</li></ul></template>

<template data-pop="pareto-r05-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="r05-11,r05-12,r05-13"></p>
<ul>
<li>Score sur 10 avant et après chaque essai ; LCQ : différence minimale importante 1,3 point.</li>
<li>Traitement inefficace arrêté ; traitement efficace réduit après quelques mois.</li>
<li>Enfant : toux chronique au-delà de 4 semaines ; corps étranger, asthme, bronchite bactérienne prolongée ; pas de neuromodulateur.</li>
<li>Sujet âgé : toux aux repas = aspiration.</li>
<li>Après COVID-19 : environ 30 % de toux persistante ; exclure une atteinte interstitielle.</li></ul></template>

<template data-pop="pareto-r05-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="r05-e-1,r05-e-2,r05-e-3,r05-e-4,r05-e-5,r05-e-6,r05-e-7"></p>
<ul>
<li>Radiographie : oriente sans exclure un petit cancer central.</li>
<li>Spirométrie souvent normale ; elle n’exclut ni l’asthme à toux prédominante ni la bronchite à éosinophiles.</li>
<li>Méthacholine négative : asthme improbable, bronchite à éosinophiles possible.</li>
<li>Expectoration induite : éosinophiles supérieurs à 3 % ; éosinophiles sanguins supérieurs à 300 par µL ; FeNO sans seuil consensuel.</li>
<li>pH-impédancemétrie inutile sans symptôme peptique ; laryngoscopie si dysphonie ou stridor.</li>
<li>Coqueluche : PCR au début, sérologie plus tard.</li></ul></template>

<template data-pop="pareto-r05-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="r05-sa,r05-sp,r05-sn,r05-si,r05-sm,r05-sg"></p>
<ul>
<li>Nerf vague : larynx (laryngé supérieur), trachée (récurrent), bronches, oreille (rameau auriculaire), œsophage.</li>
<li>Trois phases : inspiration, compression glotte fermée, expulsion ; les pressions expliquent incontinence, syncope, fractures.</li>
<li>Inhibiteur de l’enzyme de conversion : bradykinine et substance P accumulées, sensibilisation des fibres C.</li>
<li>P2X3 bloqué par le géfapixant ; P2X2/3 gustatif bloqué aussi, d’où la dysgueusie.</li>
<li>Bronchite à éosinophiles : mastocytes épithéliaux, toux sans obstruction.</li>
<li>Coqueluche : toxine pertussique et cytotoxine trachéale ; toux qui survit à la bactérie.</li>
<li>CYP2D6 : codéine imprévisible chez l’enfant et le métaboliseur ultrarapide.</li></ul></template>

<template data-pop="pareto-r05-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="r05-p-1,r05-p-2,r05-p-3,r05-p-4"></p>
<ul>
<li>Traiter la cause avant le symptôme ; jamais d’antitussif dans une toux productive utile.</li>
<li>Doses vérifiées : géfapixant 45 mg deux fois par jour (une fois si débit de filtration inférieur à 30) ; morphine à libération prolongée 5 à 10 mg deux fois par jour ; gabapentine jusqu’à 1800 mg par jour ; prégabaline 300 mg par jour ; ésoméprazole 40 mg deux fois par jour si reflux typique.</li>
<li>Opioïdes + benzodiazépines, alcool ou gabapentinoïdes : dépression respiratoire.</li>
<li>Dextrométhorphane + sérotoninergiques ou inhibiteurs de la monoamine oxydase : syndrome sérotoninergique.</li>
<li>Morphine, gabapentine et prégabaline : hors indication autorisée dans la toux.</li></ul></template>
