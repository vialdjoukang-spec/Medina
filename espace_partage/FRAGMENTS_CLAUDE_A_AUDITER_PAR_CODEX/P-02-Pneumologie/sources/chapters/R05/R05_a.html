<section class="ilot" id="r05-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Madame L., 58 ans, enseignante, consulte pour une toux sèche qui dure depuis cinq mois. La toux a commencé après un rhume en hiver et n’a jamais cessé. Elle décrit un chatouillement dans la gorge qui précède chaque quinte. Le parfum d’une collègue, l’air froid, le fait de parler longtemps et le téléphone déclenchent la toux. Elle perd quelques gouttes d’urine pendant les quintes et n’ose plus aller au théâtre. Elle n’a jamais fumé. Elle prend de l’énalapril 10 mg par jour depuis trois ans pour une hypertension artérielle. Elle a déjà reçu deux cures d’antibiotique et un sirop « contre la toux », sans effet.</p>
<p>La question qui structure tout le cours est la suivante : <b>cette toux cache-t-elle une maladie grave, quelle cause traitable l’entretient, et que proposer lorsque aucune cause ne répond au traitement ?</b> La toux est le symptôme qui amène le plus souvent un patient chez son médecin de premier recours pour un problème respiratoire. La très grande majorité des toux aiguës guérit seule. Une petite fraction révèle un cancer bronchique, une tuberculose, une embolie pulmonaire, une insuffisance cardiaque ou une coqueluche. Une autre fraction devient chronique et détruit la qualité de vie sans menacer la survie.</p>
<p>Le médecin assistant doit savoir classer une toux selon sa durée, reconnaître les <button class="w" data-k="r05-alarme">signes d’alarme (drapeaux rouges)</button>, prescrire les deux examens de base d’une toux chronique, rechercher les <button class="w" data-k="r05-traits">traits traitables (asthme, éosinophilie bronchique, reflux, rhinosinusite, médicament)</button> et conduire des essais thérapeutiques séquentiels. Il doit enfin connaître le <button class="w" data-k="r05-hyper">syndrome d’hypersensibilité à la toux</button> et ses traitements neuromodulateurs, dont le <button class="w" data-k="r05-d-gefa">géfapixant (autorisé par Swissmedic en 2022)</button>.</p>
<div class="key"><b>Message fondateur.</b> La toux est un réflexe de protection : elle expulse ce qui menace les voies aériennes. Elle devient une maladie lorsque le réflexe se déclenche pour des stimulus qui ne devraient pas le provoquer. Le médecin cherche donc deux choses distinctes : une <b>cause qui stimule</b> un réflexe normal (corps étranger, tumeur, infection, insuffisance cardiaque) et un <b>réflexe devenu trop sensible</b> qui répond à des stimulus banals (parfum, parole, air froid).</div>
<div class="key"><b>Liens avec les cours voisins.</b> L’asthme est traité dans <b>J45 — Asthme (P-02-Pneumologie)</b>, la bronchopneumopathie chronique obstructive (BPCO) dans <b>J44 — Autres maladies pulmonaires obstructives chroniques (P-02-Pneumologie)</b>, la grippe dans <b>J10 — Grippe à virus grippal saisonnier identifié (P-02-Pneumologie)</b> et la dyspnée dans <b>R06 — Anomalies de la respiration (P-02-Pneumologie)</b>. Le présent cours traite la toux comme symptôme et comme maladie autonome ; il renvoie à ces cours pour le traitement de fond de chaque maladie.</div>
</section>

<section class="ilot" id="r05-1"><h2><span class="n">1</span>Définition, codage et classifications</h2>
<p>La toux est une expiration brusque et bruyante, déclenchée par un réflexe, qui expulse l’air et les sécrétions des voies aériennes. Elle comporte trois phases : une inspiration, une compression contre la glotte fermée, puis une expulsion explosive à l’ouverture de la glotte. Le patient peut aussi tousser volontairement. Le <b>besoin de tousser</b> (« urge to cough ») est la sensation consciente qui précède la toux ; il est au premier plan dans la toux chronique de l’adulte, où les patients décrivent un chatouillement laryngé ou une irritation pharyngée.</p>
<h3>1.1 Classification selon la durée</h3>
<p>La durée oriente la cause, parce que les infections virales guérissent en quelques semaines alors que les maladies chroniques persistent. Les seuils sont des conventions. La recommandation allemande de pneumologie S2k de 2025 et le collège américain CHEST de 2018 utilisent les mêmes bornes chez l’adulte. L’<button class="w" data-k="r05-ctx-duree">ERS 2020 retient 4 semaines chez l’enfant</button>.</p>
<table class="t"><tr><th>Catégorie</th><th>Durée chez l’adulte</th><th>Causes dominantes</th><th>Bilan initial</th></tr>
<tr><td>Aiguë</td><td>Moins de 3 semaines</td><td>Infection virale des voies aériennes supérieures, rhinite allergique, exacerbation d’asthme ou de BPCO, pneumonie</td><td>Anamnèse et examen ; examens seulement si signe d’alarme</td></tr>
<tr><td>Subaiguë</td><td>3 à 8 semaines</td><td>Toux post-infectieuse, coqueluche, rhinosinusite post-virale, hyperréactivité bronchique transitoire</td><td>Anamnèse et examen ; examens seulement si signe d’alarme</td></tr>
<tr><td>Chronique</td><td>Plus de 8 semaines</td><td>Tabac, asthme et bronchite à éosinophiles, reflux, rhinosinusite chronique, inhibiteur de l’enzyme de conversion, BPCO, bronchiectasies, hypersensibilité à la toux</td><td>Radiographie du thorax et spirométrie chez tous</td></tr></table>
<p>La lecture du tableau commence par la dernière colonne. Une toux aiguë sans signe d’alarme ne justifie aucun examen, parce qu’elle est le plus souvent due à une infection virale qui guérit seule ; la recommandation allemande de 2025 se limite alors à l’anamnèse et à l’examen. Une toux chronique impose au contraire deux examens chez tous les patients, car le risque de méconnaître un cancer, une tuberculose ou une maladie interstitielle n’est plus négligeable. Exemple : un homme de 45 ans qui tousse depuis 10 jours après un rhume, sans fièvre ni dyspnée, ne reçoit ni radiographie ni antibiotique ; s’il tousse encore à 9 semaines, il reçoit une radiographie et une spirométrie.</p>
<h3>1.2 Classification selon l’expectoration</h3>
<p>La recommandation allemande de 2025 distingue la <b>toux sèche</b> et la <b>toux productive</b>, définie par une expectoration d’au moins 5 à 30 mL par 24 heures, soit d’une cuillère à café à deux cuillères à soupe. La distinction est utile parce que la toux productive chronique oriente vers une bronchite chronique, une BPCO, des bronchiectasies ou une infection, et que son pronostic est moins favorable. Beaucoup de patients décrivent pourtant comme « glaires » la sensation de corps étranger laryngé de l’hypersensibilité à la toux, sans rien cracher. Le médecin demande donc ce que le patient crache réellement, et en quelle quantité.</p>
<h3>1.3 Toux chronique réfractaire et toux chronique inexpliquée</h3>
<p>Deux termes désignent la toux chronique qui persiste malgré une évaluation complète. La <b>toux chronique réfractaire</b> persiste alors qu’une cause probable (reflux, asthme, rhinite) a été traitée correctement. La <b>toux chronique inexpliquée</b> (ou idiopathique) persiste sans cause identifiable après le bilan. La recommandation allemande de 2025 demande de diagnostiquer ces formes comme une <b>maladie autonome</b> et non comme un symptôme, parce que leur mécanisme commun est une hypersensibilité du réflexe de toux.</p>
<h3>1.4 Codage CIM-10-GM 2024</h3>
<p>La catégorie R05 « Toux » appartient au chapitre XVIII (symptômes et signes anormaux) et ne comporte <b>aucun sous-code</b> dans la CIM-10-GM 2024 publiée par le BfArM. Elle comporte en revanche une consigne et deux exclusions qui changent le code choisi.</p>
<table class="t"><tr><th>Situation</th><th>Code</th><th>Règle</th></tr>
<tr><td>Toux sans cause établie</td><td>R05</td><td>Code du symptôme ; il est remplacé par le code de la maladie lorsque la cause est démontrée (par exemple J45.9, J44.9)</td></tr>
<tr><td>Toux chronique idiopathique ou réfractaire</td><td>R05 et U69.6!</td><td>Le code supplémentaire U69.6! signale la toux chronique idiopathique ou réfractaire</td></tr>
<tr><td>Toux avec hémorragie</td><td>R04.2</td><td>Exclusion de R05 : l’hémoptysie se code dans R04</td></tr>
<tr><td>Toux psychogène</td><td>F45.33</td><td>Exclusion de R05 : code du trouble somatoforme de l’appareil respiratoire</td></tr></table>
<p>Le codeur doit retenir deux pièges. Le premier est le code R05 conservé après la découverte d’une cause : la toux d’un asthme démontré se code J45, pas R05. Le second est l’emploi de sous-codes R05.1 à R05.9, qui existent dans la version américaine de la classification mais <b>pas</b> dans la CIM-10-GM utilisée en Suisse. La correspondance dans la CIM-11 (catégorie MD12, toux) n’a pas été vérifiée sur le navigateur officiel de l’Organisation mondiale de la santé (OMS) pour ce cours.</p>
<div class="key"><b>À retenir.</b> La durée classe la toux en aiguë (moins de 3 semaines), subaiguë (3 à 8 semaines) et chronique (plus de 8 semaines chez l’adulte, plus de 4 semaines chez l’enfant). La toux productive et la toux sèche n’ont pas les mêmes causes. R05 ne possède pas de sous-code dans la CIM-10-GM 2024 ; U69.6! s’ajoute pour la toux chronique réfractaire ou inexpliquée. La partie suivante montre combien de personnes sont concernées et ce que la toux leur coûte.</div>
</section>

<section class="ilot" id="r05-2"><h2><span class="n">2</span>Épidémiologie et retentissement</h2>
<p>La toux aiguë est le symptôme respiratoire le plus fréquent en médecine de premier recours. Selon la recommandation allemande de 2025, les rhinovirus causent 30 à 50 % des rhumes, suivis des coronavirus saisonniers, du virus respiratoire syncytial, des virus para-influenza, des virus grippaux, des adénovirus et des métapneumovirus. La toux est le symptôme du rhume qui dure le plus longtemps, en général deux à trois semaines. Les bactéries sont beaucoup plus rares : <i>Mycoplasma pneumoniae</i>, <i>Chlamydia pneumoniae</i> et <i>Bordetella pertussis</i> causent la plupart des bronchites aiguës bactériennes.</p>
<p>La toux chronique touche environ <b>10 % des adultes</b> selon une méta-analyse citée par l’ERS 2020, avec une prévalence plus élevée en Europe, en Amérique et en Océanie qu’en Asie et en Afrique. Dans une enquête internationale portant sur 10 032 patients de consultations spécialisées, deux tiers étaient des femmes et l’âge le plus fréquent se situait dans la sixième décennie. Cette répartition s’explique en partie par une sensibilité plus élevée du réflexe de toux chez la femme, mesurée par le test à la capsaïcine, et par une représentation corticale plus étendue de la sensation de toux. La toux chronique réfractaire ou inexpliquée représente 30 à 40 % des patients adressés en consultation spécialisée, selon la recommandation allemande ; une étude canadienne en population l’estime à 3,3 % de tous les patients.</p>
<h3>2.1 Retentissement</h3>
<p>Une toux chronique ne tue pas en elle-même, mais elle altère la qualité de vie autant que d’autres maladies chroniques. Les patients rapportent en moyenne huit symptômes associés à la toux selon l’ERS 2020. Les plus lourds sont l’<button class="w" data-k="r05-incont">incontinence urinaire d’effort pendant la toux</button>, la gêne à la parole et la dépression. La toux répétée provoque aussi des vomissements, un épuisement, des troubles du sommeil, des fractures de côtes, des hernies et des <button class="w" data-k="r05-syncope">syncopes de toux</button>. Les patients consultent souvent par crainte d’une maladie grave, par gêne sociale ou à la demande de leur entourage.</p>
<p>Exemple : Madame L. ne participe plus aux réunions de parents d’élèves, porte des protections urinaires et dort mal. Son score de toux est de 8 sur 10. Ce retentissement justifie un bilan complet et un traitement actif, même si sa toux ne menace pas sa survie.</p>
<h3>2.2 Pronostic</h3>
<p>La toux aiguë virale guérit spontanément ; la toux post-infectieuse disparaît habituellement avant 8 semaines. La toux chronique due à un trait traitable s’améliore lorsque ce trait est corrigé : l’arrêt d’un inhibiteur de l’enzyme de conversion supprime la toux en quelques semaines, et la bronchite à éosinophiles répond aux corticostéroïdes. La toux chronique réfractaire évolue au contraire sur des années ; dans les essais du géfapixant, la durée moyenne de la toux à l’inclusion dépassait 11 ans. Le pronostic de la toux productive chronique est moins bon que celui de la toux sèche, parce qu’il reflète souvent une maladie bronchique structurelle.</p>
<div class="key"><b>À retenir.</b> La toux aiguë est virale dans l’immense majorité des cas. La toux chronique touche environ un adulte sur dix, surtout la femme de 50 à 70 ans. Son retentissement (incontinence, isolement, dépression, sommeil) justifie une prise en charge active. La partie suivante explique pourquoi certains patients toussent à la moindre stimulation.</div>
</section>

<section class="ilot" id="r05-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La toux est un réflexe vagal. Comprendre son arc réflexe permet de comprendre à la fois les causes, qui stimulent les terminaisons nerveuses, et les traitements, qui agissent sur les récepteurs périphériques ou sur le système nerveux central.</p>
<h3>3.1 Le réflexe normal</h3>
<p>Les fibres afférentes du nerf vague (X<sup>e</sup> nerf crânien) se terminent dans la muqueuse du larynx, de la trachée et des grosses bronches. Certaines atteignent aussi le pharynx, l’œsophage, les septa alvéolaires et le conduit auditif externe, ce qui explique la toux déclenchée par l’examen de l’oreille (<button class="w" data-k="r05-arnold">réflexe d’Arnold</button>). Deux grands types de fibres participent au réflexe. Les <b>fibres Aδ myélinisées</b> répondent au contact mécanique et à l’acidité : elles déclenchent la toux de protection contre l’aspiration. Les <b>fibres C non myélinisées</b> répondent aux agents chimiques irritants grâce à des canaux ioniques spécialisés (TRPV1, TRPA1, P2X3) et produisent la sensation d’irritation.</p>
<p>Les influx gagnent le tronc cérébral, où ils font relais dans le <b>noyau du tractus solitaire</b>. Un générateur central du rythme organise ensuite la séquence motrice. Le cortex peut moduler le réflexe : il permet de réprimer volontairement une toux, et l’imagerie fonctionnelle montre des régions plus étendues chez la femme.</p>

<p>La figure se lit de gauche à droite puis de droite à gauche. Le stimulus agit sur les terminaisons vagales ; le message gagne le tronc cérébral ; la commande descend vers les muscles respiratoires et laryngés. Les deux annotations rouges situent l’hypersensibilité : elle peut naître des terminaisons elles-mêmes, qui se dépolarisent pour un stimulus trop faible, ou du relais central, qui amplifie un message normal. Les traitements suivent la même logique : le géfapixant bloque un récepteur périphérique, la morphine et la gabapentine agissent au niveau central.</p>
<h3>3.2 Le syndrome d’hypersensibilité à la toux</h3>
<p>La plupart des adultes atteints de toux chronique toussent pour des stimulus thermiques, chimiques ou mécaniques de faible intensité, qui ne font pas tousser un sujet sain. Cette observation a conduit l’ERS 2020 à adopter le <button class="w" data-k="r05-hyper">syndrome d’hypersensibilité à la toux</button> comme diagnostic englobant. La recommandation allemande de 2025 reprend l’analogie avec la douleur neuropathique : l’<b>hypertussie</b> désigne une toux excessive pour un stimulus tussigène, comme l’hyperalgésie ; l’<b>allotussie</b> désigne une toux déclenchée par un stimulus qui n’est pas tussigène, comme la parole ou le rire, à la manière de l’allodynie.</p>
<p>Plusieurs mécanismes y conduisent. Une inflammation de type 2 existe chez environ un quart des patients et produit l’asthme à toux prédominante et la bronchite à éosinophiles. Le reflux, en particulier le reflux gazeux non acide, et les troubles de la motilité œsophagienne exposent le larynx à un contenu agressif. Les inhibiteurs de l’enzyme de conversion augmentent la sensibilité du réflexe chez la plupart des sujets. Certaines neuropathies sensitives héréditaires comportent une toux chronique, ce qui appuie l’hypothèse d’un processus neuropathique.</p>
<h3>3.3 Mécanismes propres aux grandes causes</h3>
<p>Chaque cause agit par un mécanisme identifiable, et ce mécanisme dicte le traitement. Le tableau suivant relie la cause au mécanisme et au traitement qui en découle.</p>
<table class="t"><tr><th>Cause</th><th>Mécanisme principal</th><th>Conséquence thérapeutique</th></tr>
<tr><td>Inhibiteur de l’enzyme de conversion</td><td>L’enzyme de conversion dégrade la bradykinine et la substance P ; son blocage les accumule, ce qui sensibilise les fibres C</td><td>Arrêt de la classe ; un antagoniste du récepteur de l’angiotensine II ne modifie pas le réflexe</td></tr>
<tr><td>Asthme à toux prédominante, bronchite à éosinophiles</td><td>Inflammation éosinophilique de la muqueuse et médiateurs qui sensibilisent les terminaisons</td><td>Corticostéroïde inhalé ou oral, antileucotriène</td></tr>
<tr><td>Reflux et dysmotilité œsophagienne</td><td>Contact du larynx avec un reflux acide ou non acide, liquide ou gazeux, et réflexe œso-trachéobronchique</td><td>Inhibiteur de la pompe à protons seulement si symptômes peptiques</td></tr>
<tr><td>Rhinosinusite chronique</td><td>Écoulement postérieur et inflammation diffuse qui abaissent le seuil du réflexe laryngé</td><td>Corticostéroïde nasal, lavages, traitement de la rhinite</td></tr>
<tr><td>Bronchite chronique, BPCO, bronchiectasies</td><td>Hypersécrétion de mucus et défaut de clairance : la toux est d’abord utile</td><td>Sevrage tabagique, drainage, traitement de la maladie</td></tr>
<tr><td>Cancer bronchique, corps étranger</td><td>Stimulation mécanique d’un réflexe normal par un obstacle endobronchique</td><td>Traitement de la lésion</td></tr>
<tr><td>Coqueluche</td><td>Toxine pertussique qui altère l’épithélium cilié et provoque des quintes</td><td>Macrolide précoce, protection des nourrissons</td></tr></table>
<p>Le tableau enseigne une distinction pratique. Dans les trois dernières lignes, le réflexe est normal et la toux remplit sa fonction : la supprimer par un antitussif serait inutile ou dangereux, car le mucus ou l’obstacle restent en place. Dans les quatre premières, le réflexe est sensibilisé : traiter la cause abaisse sa sensibilité, et un neuromodulateur peut être discuté si la toux persiste.</p>
<div class="trap"><span class="k">Piège</span>Le tabac déprime la sensibilité du réflexe de toux, mesurée par la capsaïcine, tout en augmentant le mucus. Après l’arrêt, la toux augmente souvent pendant le premier mois avant de s’améliorer. Le médecin prévient le patient pour éviter qu’il ne reprenne la cigarette en croyant aller plus mal.</div>
<div class="key"><b>À retenir.</b> La toux est un réflexe vagal dont la sensibilité peut augmenter au niveau périphérique (récepteurs TRPV1, TRPA1, P2X3) ou central. Une toux qui remplit sa fonction (mucus, obstacle) ne se supprime pas ; une toux par hypersensibilité se traite par la cause, puis par neuromodulation. La partie suivante recense les causes à rechercher.</div>
</section>

<section class="ilot" id="r05-4"><h2><span class="n">4</span>Étiologies</h2>
<p>Les causes de toux sont nombreuses, mais leur fréquence dépend fortement de la durée. Le médecin ne cherche donc pas les mêmes causes chez un patient qui tousse depuis cinq jours et chez un patient qui tousse depuis cinq mois. Le tableau suivant, adapté de la recommandation allemande de 2025, sépare les causes fréquentes des causes rares mais dangereuses.</p>
<table class="t"><tr><th>Durée</th><th>Causes fréquentes</th><th>Causes rares à ne pas manquer</th></tr>
<tr><td>Aiguë (moins de 3 semaines)</td><td>Infection virale, rhinite allergique, exacerbation d’asthme ou de BPCO</td><td>Pneumonie, embolie pulmonaire, pneumothorax, insuffisance cardiaque aiguë, corps étranger, inhalation toxique</td></tr>
<tr><td>Subaiguë (3 à 8 semaines)</td><td>Toux post-infectieuse, hyperréactivité bronchique post-virale, rhinosinusite post-virale</td><td>Coqueluche, <i>Mycoplasma pneumoniae</i>, SARS-CoV-2, pneumonie traînante</td></tr>
<tr><td>Chronique (plus de 8 semaines)</td><td>Tabac et bronchite chronique, asthme et bronchite à éosinophiles, reflux, rhinosinusite chronique, inhibiteur de l’enzyme de conversion, BPCO</td><td>Cancer bronchique, tuberculose, maladie pulmonaire interstitielle, bronchiectasies, apnées du sommeil, aspiration chronique, embolies récidivantes, maladies trachéales</td></tr></table>
<p>La lecture se fait par ligne. Chez Madame L., la ligne « chronique » s’applique : la colonne de gauche propose l’inhibiteur de l’enzyme de conversion, l’asthme, le reflux et la rhinite ; la colonne de droite rappelle de vérifier qu’aucun cancer, aucune tuberculose ni aucune fibrose n’est présent. L’erreur fréquente consiste à attribuer une toux chronique à une « bronchite » répétée et à prescrire des antibiotiques sans radiographie.</p>
<h3>4.1 Asthme, asthme à toux prédominante et bronchite à éosinophiles</h3>
<p>L’ERS 2020 regroupe sous le terme de <b>toux asthmatique</b> trois situations. L’<b>asthme classique</b> associe une obstruction variable et une hyperréactivité bronchique. L’<button class="w" data-k="r05-cva">asthme à toux prédominante (« cough variant asthma »)</button> se manifeste par une toux isolée avec hyperréactivité bronchique. La <button class="w" data-k="r05-naeb">bronchite à éosinophiles non asthmatique</button> associe une éosinophilie de l’expectoration supérieure à 3 % sans obstruction ni hyperréactivité ; elle concerne jusqu’à 13 % des patients de consultations spécialisées. Les trois répondent aux traitements anti-inflammatoires de l’asthme, ce qui justifie de les rechercher activement. Le diagnostic et le traitement de l’asthme sont détaillés dans J45 — Asthme (P-02-Pneumologie).</p>
<h3>4.2 Reflux gastro-œsophagien et reflux laryngé</h3>
<p>Le rôle du reflux est controversé ; sa fréquence estimée varie de 0 à près de 100 % selon les séries. Les premières études fondées sur le reflux acide montraient une faible relation temporelle avec la toux. L’hypothèse actuelle porte sur un reflux non acide, liquide ou gazeux, et sur une dysmotilité œsophagienne, fréquente chez les patients qui toussent. La toux pendant ou après les repas, au lever du lit, au changement de position, avec dysphonie ou goût désagréable, oriente vers cette cause. Le <button class="w" data-k="r05-harq">questionnaire HARQ (Hull Airway Reflux Questionnaire)</button> aide à documenter ces symptômes. Le point pratique est thérapeutique : un <button class="w" data-k="r05-ctx-ipp">inhibiteur de la pompe à protons n’est indiqué que si des symptômes peptiques existent</button>.</p>
<h3>4.3 Rhinosinusite et syndrome de toux des voies aériennes supérieures</h3>
<p>Le collège américain a proposé en 2006 le terme de <b>syndrome de toux des voies aériennes supérieures</b> pour remplacer l’« écoulement nasal postérieur ». Il regroupe la rhinite allergique ou non allergique et la rhinosinusite chronique. Le mécanisme reste discuté : l’écoulement de mucus vers le pharynx pourrait stimuler le larynx, ou l’inflammation des voies aériennes supérieures et inférieures pourrait abaisser globalement le seuil du réflexe. Les antihistaminiques de première génération réduisent la toux surtout par leur effet anticholinergique central. La recommandation allemande de 2025 ajoute l’<button class="w" data-k="r05-ilo">obstruction laryngée inductible</button> et l’hypersensibilité laryngée parmi les causes des voies aériennes supérieures.</p>
<h3>4.4 Médicaments</h3>
<p>Une toux chronique survient chez environ 15 % des patients traités par inhibiteur de l’enzyme de conversion selon l’ERS 2020 ; la recommandation allemande de 2025 donne environ 10 % des femmes et 5 % des hommes. Il s’agit d’un <b>effet de classe</b>. Le délai entre le début du traitement et la toux va de quelques jours à plusieurs mois, si bien que l’absence de lien chronologique évident n’écarte pas la cause. Voir la <button class="w" data-k="r05-iec">fiche de la toux aux inhibiteurs de l’enzyme de conversion</button>. D’autres médicaments font tousser par un autre mécanisme : l’amiodarone et plusieurs chimiothérapies par toxicité pulmonaire directe, les bêtabloquants par hyperréactivité bronchique, les bisphosphonates et les inhibiteurs calciques en aggravant un reflux, et les collyres à base de prostanoïdes (latanoprost) qui descendent par le canal lacrymonasal et irritent le pharynx.</p>
<h3>4.5 Tabac, bronchite chronique et BPCO</h3>
<p>Le tabac est la principale cause évitable de toux chronique. La consommation cumulée et la consommation actuelle prédisent la fréquence de la toux mesurée objectivement. La <b>bronchite chronique</b> se définit par une toux productive la plupart des jours pendant au moins trois mois par an, deux années consécutives ; elle peut exister sans obstruction. La BPCO associe une obstruction persistante. La recommandation allemande de 2025 rappelle qu’une toux qui augmente sans signe d’infection chez un patient atteint de BPCO doit faire rechercher une embolie pulmonaire, découverte chez 4 à 6 % des patients hospitalisés pour exacerbation. Le traitement de la BPCO relève de J44 (P-02-Pneumologie).</p>
<h3>4.6 Coqueluche</h3>
<p>La <button class="w" data-k="r05-coq">coqueluche</button> est due à <i>Bordetella pertussis</i>. Chez l’adulte vacciné il y a longtemps, elle se présente comme une toux subaiguë par quintes, parfois suivies de vomissements, avec peu de fièvre ; la reprise inspiratoire bruyante (« chant du coq ») manque souvent. L’Office fédéral de la santé publique (OFSP) décrit trois phases : une phase catarrhale de type grippal avec toux banale, une phase paroxystique de 1 à 6 semaines, puis une convalescence de plusieurs semaines à plusieurs mois. Sa reconnaissance compte moins pour le patient que pour son entourage : un nourrisson non protégé risque une pneumonie, des convulsions et une atteinte cérébrale. La recommandation allemande de 2025 signale des épidémies en 2024 en Tchéquie et au Danemark, avec des complications chez environ un patient adulte sur dix lorsque le patient a un asthme ou une BPCO.</p>
<h3>4.7 Causes graves et causes rares</h3>
<p>Le <b>cancer bronchique</b> produit une toux par stimulation mécanique d’un réflexe normal ; la recommandation allemande de 2025 classe parmi les signes d’alarme toute modification de la toux chez un fumeur âgé de 55 à 80 ans. La <b>tuberculose</b> doit être évoquée en cas de toux persistante avec fièvre, sueurs nocturnes, amaigrissement, origine d’un pays de forte incidence, séjour carcéral ou immunodépression. L’<b>insuffisance cardiaque</b> fait tousser par congestion pulmonaire, surtout en décubitus. Les <b>maladies pulmonaires interstitielles</b> s’accompagnent d’une toux chez 30 à 90 % des patients selon l’ERS 2020. Les <b>apnées obstructives du sommeil</b>, l’<b>aspiration chronique</b> après un accident vasculaire cérébral ou dans la maladie de Parkinson, les <b>embolies pulmonaires récidivantes</b> et des maladies trachéales rares (trachéobronchomalacie, polychondrite) complètent la liste.</p>
<div class="key"><b>À retenir.</b> Une toux aiguë est virale jusqu’à preuve du contraire. Une toux subaiguë est post-infectieuse, sauf coqueluche à reconnaître pour protéger les nourrissons. Une toux chronique se rattache le plus souvent au tabac, à un trait éosinophilique, au reflux, à la rhinosinusite ou à un inhibiteur de l’enzyme de conversion ; le cancer, la tuberculose et les maladies interstitielles sont exclus par le bilan de base. La partie suivante montre comment l’anamnèse fait le tri.</div>
</section>

<section class="ilot" id="r05-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse fait la plus grande partie du diagnostic de la toux. Elle vise trois buts dans cet ordre : repérer un signe d’alarme, identifier une cause traitable, puis mesurer le retentissement. Elle est structurée par les questions suivantes.</p>
<h3>5.1 Durée et circonstances de début</h3>
<p>Le médecin date le début de la toux, parce que la durée détermine la catégorie et le bilan. Il demande si elle a suivi un rhume, une grippe ou une infection à SARS-CoV-2 : environ 30 % des patients atteints de COVID-19 gardent une toux chronique selon la recommandation allemande de 2025. Un début brutal chez un enfant d’âge préscolaire, au cours d’un repas ou d’un jeu, évoque un <b>corps étranger</b> et impose une bronchoscopie. Un contact avec une personne qui tousse par quintes, ou avec un nourrisson, oriente vers la coqueluche.</p>
<h3>5.2 Caractère de la toux et de l’expectoration</h3>
<p>Le patient décrit ce qu’il crache : rien, un mucus clair, des expectorations purulentes, de l’écume ou du sang. Une expectoration abondante et quotidienne pendant des années oriente vers des bronchiectasies ; une écume rosée vers un œdème pulmonaire ; du sang vers une cause grave à explorer sans délai. Une toux nocturne évoque l’asthme, l’insuffisance cardiaque ou le reflux ; une toux à l’effort évoque l’asthme. Des <b>quintes</b> suivies de vomissements évoquent la coqueluche.</p>
<h3>5.3 Déclencheurs et sensation laryngée</h3>
<p>Le médecin recherche les <button class="w" data-k="r05-trig">déclencheurs typiques de l’hypersensibilité à la toux</button> : changement de température, parole prolongée ou téléphone, rire, parfums, repas, position couchée, poussières et fumées. Il demande s’il existe un chatouillement de gorge, une sensation de boule ou de mucus collé, une dysphonie ou une sensation de gorge serrée à l’inspiration, qui évoque une obstruction laryngée inductible. Chez Madame L., le parfum, la parole et l’air froid déclenchent la toux, précédée d’un chatouillement : le tableau est typique d’une hypersensibilité à la toux.</p>
<h3>5.4 Médicaments, tabac et expositions</h3>
<p>La liste complète des médicaments est demandée à chaque patient, y compris les collyres. La recommandation allemande de 2025 demande de vérifier chaque médicament pour l’effet indésirable « toux ». L’anamnèse tabagique comprend le tabac fumé, la cigarette électronique, le cannabis et le tabagisme passif, exprimés en paquets-années. L’anamnèse professionnelle recherche des poussières, des vapeurs et des agents sensibilisants. Le médecin note les voyages, l’origine géographique et les facteurs de risque de tuberculose.</p>
<h3>5.5 Symptômes associés qui orientent vers une cause</h3>
<div class="two">
<div class="card"><h4>Voies aériennes supérieures</h4><p>Obstruction nasale, rhinorrhée, raclement de gorge, écoulement postérieur, anosmie. Ils orientent vers une rhinite ou une rhinosinusite chronique.</p></div>
<div class="card"><h4>Reflux</h4><p>Pyrosis, régurgitations, toux pendant ou après les repas, dysphonie, goût amer. Seuls les symptômes peptiques typiques justifient un essai d’inhibiteur de la pompe à protons.</p></div>
<div class="card"><h4>Asthme</h4><p>Sifflements, dyspnée variable, toux nocturne ou d’effort, atopie, rhinite allergique. Leur absence n’écarte pas une toux asthmatique.</p></div>
<div class="card"><h4>Signes généraux</h4><p>Fièvre, sueurs nocturnes, perte de poids, hémoptysie, dyspnée. Ils sont des signes d’alarme et précèdent toute autre démarche.</p></div></div>
<h3>5.6 Retentissement et mesure</h3>
<p>Le médecin demande au patient de <b>noter sa toux sur 10</b> à chaque consultation, ce que l’ERS 2020 recommande comme mesure simple du succès d’un traitement. Le <button class="w" data-k="r05-lcq">questionnaire de Leicester sur la toux (LCQ)</button> quantifie la qualité de vie. Il interroge explicitement sur l’incontinence urinaire, que les patientes mentionnent rarement d’elles-mêmes alors qu’elle est sévère chez un quart d’entre elles.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à une « bronchite à répétition » chez une patiente qui tousse depuis des années et lui prescrire des antibiotiques à chaque aggravation. L’ERS 2020 rappelle que la toux chronique méconnue est souvent étiquetée « infections respiratoires récidivantes », « asthme résistant au traitement » ou « exacerbations de BPCO ».</div>
<div class="key"><b>À retenir.</b> L’anamnèse recherche d’abord les signes d’alarme, puis la durée, l’expectoration, les déclencheurs, les médicaments (inhibiteur de l’enzyme de conversion), le tabac et les symptômes d’asthme, de reflux et de rhinite. Elle mesure le retentissement par un score sur 10. La partie suivante décrit l’examen clinique.</div>
</section>

<section class="ilot" id="r05-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Dans la toux chronique, l’examen est souvent normal ; un examen normal n’écarte donc aucune cause. Il sert surtout à repérer les signes d’une maladie grave et à orienter le bilan. Le médecin examine d’abord les paramètres vitaux, puis les voies aériennes supérieures, le thorax et les signes extra-respiratoires.</p>
<div class="two">
<div class="card"><h4>Paramètres vitaux et état général</h4><p>Un adulte sain respire 12 à 20 fois par minute avec une saturation pulsée en oxygène (SpO₂) de 95 % ou plus. Une tachypnée, une cyanose, une SpO₂ inférieure à 90 % ou une fréquence cardiaque supérieure à 120 par minute sont des signes d’alarme selon la recommandation allemande de 2025. Le poids et la température sont notés à chaque consultation.</p></div>
<div class="card"><h4>Voies aériennes supérieures</h4><p>La rhinoscopie antérieure montre normalement une muqueuse rose et humide. Une muqueuse pâle et œdématiée évoque une rhinite allergique, des polypes une rhinosinusite chronique, un mucus sur la paroi pharyngée postérieure un écoulement postérieur. Une dysphonie persistante impose un examen laryngé.</p></div>
<div class="card"><h4>Thorax</h4><p>Le murmure vésiculaire normal est doux et symétrique. Les sibilants orientent vers l’asthme ou la BPCO ; des crépitants fins « velcro » aux bases vers une fibrose ; des crépitants grossiers vers des bronchiectasies ou une insuffisance cardiaque ; un sibilant localisé et fixe vers un obstacle bronchique ; un stridor vers une atteinte laryngée ou trachéale.</p></div>
<div class="card"><h4>Signes extra-respiratoires</h4><p>Un <button class="w" data-k="r05-hippo">hippocratisme digital</button> n’est jamais dû à l’asthme ni au reflux : il oriente vers un cancer, une fibrose ou des bronchiectasies. Une turgescence jugulaire, des œdèmes et un troisième bruit cardiaque orientent vers une insuffisance cardiaque. Des adénopathies sus-claviculaires orientent vers un cancer. L’examen du conduit auditif peut montrer un cérumen ou un corps étranger qui entretient le réflexe d’Arnold.</p></div></div>
<p>Exemple : chez Madame L., les paramètres vitaux sont normaux, la SpO₂ est à 97 %, la muqueuse nasale est normale, l’auscultation est normale et il n’y a pas d’hippocratisme. Cet examen normal n’établit aucun diagnostic ; il rend seulement une cause grave peu probable et permet de poursuivre le bilan de base sans urgence.</p>
<div class="trap"><span class="k">Piège</span>Un patient qui tousse pendant l’examen peut présenter des sibilants transitoires dus à la toux elle-même. Seuls des sibilants reproductibles au repos, ou une obstruction documentée par la spirométrie, orientent vers l’asthme.</div>
<div class="key"><b>À retenir.</b> L’examen d’une toux chronique est souvent normal. Il recherche des signes d’alarme (tachypnée, désaturation, tachycardie, amaigrissement), une atteinte des voies aériennes supérieures, des bruits anormaux, un hippocratisme et une insuffisance cardiaque. La démarche diagnostique, développée dans la partie suivante, repose ensuite sur deux examens de base et des essais thérapeutiques.</div>
