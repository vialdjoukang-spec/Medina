<template data-pop="j60-d-inh" data-title="Isoniazide (Isoniaz-TB)">
<div class="lab">Mécanisme</div><p>Promédicament activé par la catalase-peroxydase mycobactérienne ; il inhibe la synthèse des acides mycoliques de la paroi de <i>Mycobacterium tuberculosis</i>.</p>
<div class="lab">Indication dans ce cours</div><p>Traitement préventif d’une infection tuberculeuse chez le silicotique. L’information professionnelle cite expressément la silicose parmi les situations à risque où la monothérapie préventive s’emploie.</p>
<div class="lab">Posologie</div><p>Adulte : 5 mg/kg une fois par jour, maximum 300 mg, au moins une demi-heure avant ou deux heures après un repas ; neuf mois selon l’information professionnelle, six ou neuf mois selon le guide suisse 2024. Pyridoxine 10 à 20 mg par jour, 50 à 75 mg par jour pour prévenir les paresthésies chez le sujet à risque.</p>
<div class="lab">Effets indésirables</div><p>Hépatite, plus fréquente avec l’âge et l’alcool, parfois mortelle ; neuropathie périphérique ; réactions cutanées graves rares ; syndrome lupique.</p>
<div class="lab">Contre-indications</div><p>Atteinte hépatique sévère, hépatite aiguë, antécédent d’hépatite à l’isoniazide, névrite périphérique, hypersensibilité.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques avant et pendant le traitement ; arrêt si les transaminases dépassent trois fois la normale ; information du patient sur les signes d’hépatite.</p>
<div class="lab">Grossesse et allaitement</div><p>Utilisation prudente avec pyridoxine ; l’allaitement n’impose pas l’arrêt, avec surveillance du nourrisson.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, Isoniaz-TB, mise à jour février 2026, ch.oddb.org, consultée le 08.10.2026.</p></template>

<template data-pop="j60-d-rif" data-title="Rifampicine (Rifampicin Labatec, Rimactan)">
<div class="lab">Mécanisme</div><p>Inhibe l’ARN polymérase dépendante de l’ADN des mycobactéries ; bactéricide.</p>
<div class="lab">Indication dans ce cours</div><p>Traitement préventif de quatre mois, seule, ou de trois mois avec l’isoniazide (guide suisse 2024) ; toujours en association pour une tuberculose active.</p>
<div class="lab">Posologie</div><p>Adulte : 10 mg/kg (8 à 12) une fois par jour, à jeun, au moins une demi-heure avant un repas ; dose maximale 600 mg par jour.</p>
<div class="lab">Contre-indications</div><p>Clairance de la créatinine inférieure à 25 mL/min ; maladie hépatique aiguë, cirrhose, insuffisance hépatique grave ; antécédent d’hépatite médicamenteuse ; porphyrie ; association avec certains antiviraux et antifongiques (inhibiteurs de protéase, voriconazole).</p>
<div class="lab">Interactions</div><p>Inducteur puissant du CYP3A4 et de la glycoprotéine P : diminue l’effet de la warfarine, des anticoagulants oraux directs, des contraceptifs hormonaux, des corticostéroïdes et du nintédanib (aire sous la courbe −50,3 %).</p>
<div class="lab">Effets indésirables et surveillance</div><p>Hépatotoxicité, troubles digestifs, coloration rouge orangé des liquides biologiques et des lentilles souples, rares réactions immunoallergiques. Tests hépatiques et formule sanguine selon le contexte.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, Rifampicin Labatec, mise à jour octobre 2023, ch.oddb.org, consultée le 08.10.2026.</p></template>

<template data-pop="j60-d-cort" data-title="Corticostéroïdes systémiques dans les pneumoconioses">
<div class="lab">Mécanisme</div><p>Ils inhibent la transcription des cytokines inflammatoires et l’activation des lymphocytes T ; ils freinent la formation des granulomes.</p>
<div class="lab">Indication</div><p>Bérylliose chronique avec atteinte fonctionnelle significative ou déclin, selon la déclaration de l’ATS de 2014 ; la sensibilisation seule ne se traite pas.</p>
<div class="lab">Posologie</div><p>Aucun essai randomisé ne fixe la dose ni la durée dans la bérylliose ; le schéma se décide en centre, avec recherche de la plus faible dose efficace.</p>
<div class="lab">Absence d’indication</div><p>Silicose chronique, asbestose, pneumoconioses inertes : aucun bénéfice démontré, risque de réactivation tuberculeuse chez le silicotique.</p>
<div class="lab">Surveillance</div><p>Recherche d’une infection tuberculeuse avant le début, glycémie, pression artérielle, densité osseuse, humeur ; attention à la rifampicine, qui réduit leur exposition.</p></template>
