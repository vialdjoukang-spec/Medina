<section class="ilot" id="j60-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 41 ans consulte son médecin de famille pour une dyspnée d’effort progressive depuis un an. Il tousse à sec et a perdu 3 kg. Il fabrique depuis treize ans des plans de travail de cuisine en <button class="w" data-k="j60-pierre">pierre artificielle (agglomérat de quartz et de résine)</button>. Pendant les cinq premières années, l’atelier coupait et polissait à sec. Il portait un masque de façon irrégulière. Il a fumé dix paquets-années et a arrêté il y a six ans. La radiographie thoracique montre de nombreuses petites opacités arrondies dans les zones supérieures et des ganglions hilaires augmentés de volume.</p>
<p>La question qui structure le cours est la suivante : <b>cet homme a-t-il une pneumoconiose, laquelle, avec quel degré de certitude, quelles complications faut-il chercher aujourd’hui, et que doit faire le médecin pour sa santé, pour son poste de travail et pour ses droits d’assuré ?</b></p>
<p>À la fin du cours, le médecin assistant sait mener une anamnèse professionnelle chronologique. Il reconnaît les tableaux radiologiques et fonctionnels de la silicose, de l’asbestose, de la pneumoconiose des houilleurs et des pneumoconioses rares. Il recherche la tuberculose et le cancer bronchique, qui font la gravité de ces maladies. Il connaît la <button class="w" data-k="j60-ilo">classification ILO des radiographies (lecture standardisée)</button>, l’annonce à la Suva et les mesures de prévention suisses.</p>
<div class="key"><b>Message fondateur.</b> Une pneumoconiose ne se diagnostique pas sur une image isolée. Le diagnostic repose sur trois éléments : une exposition suffisante à une poussière minérale, une latence compatible, et des anomalies d’imagerie ou d’histologie typiques, après exclusion des autres causes. Aucun médicament ne retire la poussière du poumon. La seule mesure qui change le pronostic est l’arrêt de l’exposition, et il dépend d’une question que le médecin doit poser : « Quel métier exercez-vous, et avec quels matériaux ? »</div>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="j84-efr">syndrome restrictif (diminution de la capacité pulmonaire totale)</button>, la <button class="w" data-k="j84-dlco">capacité de diffusion du monoxyde de carbone (DLCO)</button> et la <button class="w" data-k="j84-tdm">tomodensitométrie à haute résolution (technique et lecture)</button>. Les mécanismes cellulaires sont développés dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="j60-1"><h2><span class="n">1</span>Définition, codage et classifications</h2>
<p>Une <button class="w" data-k="j60-def-pneumo">pneumoconiose (définition de l’ILO)</button> est l’accumulation de poussières dans les poumons et la réaction du tissu pulmonaire à leur présence. Dans la CIM-10-GM, le mot désigne les poussières <b>inorganiques</b>, c’est-à-dire minérales ou métalliques. Les poussières organiques (foin moisi, plumes, coton) provoquent d’autres maladies, codées J66 et J67, qui relèvent d’autres cours.</p>
<p>La réaction du tissu dépend de la poussière. La silice cristalline et l’amiante détruisent les macrophages qui les captent et déclenchent une fibrose. Le béryllium déclenche une réaction immunitaire à granulomes. Les oxydes de fer ou d’étain s’accumulent sans fibrose notable. Cette différence explique pourquoi certaines pneumoconioses évoluent vers l’insuffisance respiratoire et d’autres restent des images sans conséquence.</p>
<h3>1.1 Codage CIM-10-GM 2024</h3>
<p>Le codeur choisit la catégorie d’après l’agent en cause, puis l’association à une tuberculose. La question utile est donc toujours : « Quelle poussière, et le patient a-t-il aussi une tuberculose ? »</p>
<table class="t"><tr><th>Code</th><th>Intitulé CIM-10-GM 2024</th><th>Sous-codes et inclusions</th></tr>
<tr><td>J60</td><td>Pneumoconiose des mineurs de charbon</td><td>Anthracose, anthracosilicose, poumon des mineurs de charbon</td></tr>
<tr><td>J61</td><td>Pneumoconiose due à l’amiante et à d’autres fibres minérales</td><td>Asbestose ; J61.0 sans exacerbation aiguë, J61.1 avec exacerbation aiguë</td></tr>
<tr><td>J62</td><td>Pneumoconiose due à la poussière de silice</td><td>Fibrose silicotique, massive comprise ; J62.0 talc ; J62.8 autres poussières de silice, silicose sans autre précision</td></tr>
<tr><td>J63</td><td>Pneumoconiose due à d’autres poussières inorganiques</td><td>J63.0 aluminose, J63.1 bauxite, J63.2 bérylliose, J63.3 graphite, J63.4 sidérose, J63.5 stannose, J63.8 autres poussières précisées</td></tr>
<tr><td>J64</td><td>Pneumoconiose, sans précision</td><td>Agent non identifié</td></tr>
<tr><td>J65</td><td>Pneumoconiose associée à la tuberculose</td><td>Tout état J60 à J64 avec une tuberculose classée en A15 ou A16</td></tr></table>
<p>La lecture se fait de bas en haut. Dès qu’une tuberculose respiratoire coexiste, le code J65 remplace les codes J60 à J64, qui l’excluent tous. Les <button class="w" data-k="j90-plaques">plaques pleurales (marqueurs d’exposition à l’amiante)</button> ne sont pas une asbestose : avec mise en évidence d’amiante, elles se codent J92.0 et relèvent du cours J90. Exemple : un ancien tuyauteur a une asbestose et des plaques ; il reçoit J61.0 et J92.0. S’il développe une tuberculose pulmonaire, l’asbestose passe en J65.</p>
<h3>1.2 Formes de la silicose selon le délai et l’intensité</h3>
<p>Les <button class="w" data-k="j60-formes-silicose">trois formes de silicose (chronique, accélérée, aiguë)</button> se distinguent par le délai entre le début de l’exposition et la maladie. Ce délai reflète la dose reçue chaque jour : plus elle est forte, plus la maladie est précoce et grave.</p>
<div class="two">
<div class="card"><h4>Silicose chronique</h4><p>Elle apparaît habituellement après plus de dix ans d’exposition modérée. Elle commence par de petits nodules des lobes supérieurs. Elle peut rester simple ou se compliquer d’une <button class="w" data-k="j60-fmp">fibrose massive progressive (conglomérats de plus de 1 cm)</button>.</p></div>
<div class="card"><h4>Silicose accélérée</h4><p>Elle apparaît entre cinq et dix ans après une exposition intense. Elle progresse plus vite et se complique plus souvent de fibrose massive, de tuberculose et de maladie auto-immune. La silicose aux pierres artificielles en est l’exemple actuel.</p></div>
<div class="card"><h4>Silicose aiguë</h4><p>Elle survient quelques semaines à cinq ans après une exposition massive, par exemple lors du sablage. Les alvéoles se remplissent d’un matériel protéinacé : on parle de <button class="w" data-k="j60-sil-aigue">silicoprotéinose (silicose aiguë)</button>. L’insuffisance respiratoire est souvent mortelle.</p></div>
<div class="card"><h4>Silicose compliquée</h4><p>Elle désigne la présence d’opacités de plus de 1 cm. Elle diminue les volumes pulmonaires, détruit le parenchyme voisin et conduit à l’hypoxémie et au cœur pulmonaire.</p></div></div>
<div class="trap"><span class="k">Piège</span>Le délai se compte depuis le <b>début</b> de l’exposition, pas depuis sa fin. Une silicose ou une asbestose peut se révéler dix ou vingt ans après la retraite. Un patient retraité n’est donc jamais « hors de cause » parce qu’il ne travaille plus.</div>
<div class="key"><b>À retenir.</b> Le médecin nomme la pneumoconiose d’après la poussière, puis précise la forme et la présence d’une tuberculose, qui impose le code J65. Il distingue les poussières fibrogènes, qui menacent la fonction respiratoire, des poussières peu actives, qui laissent surtout une image. L’épidémiologie montre ensuite où se trouvent ces expositions aujourd’hui en Suisse.</div>
</section>

<section class="ilot" id="j60-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>En Suisse, la silicose a fortement diminué mais n’a pas disparu. Une étude de la Suva portant sur 2005 à 2014 a recensé 179 travailleurs reconnus atteints de silicose. L’incidence était d’environ 300 cas par an dans les années 1970 et a passé sous 20 cas par an depuis le milieu des années 1990 (Koller et al., 2018). Dans cette série, 46 % des malades avaient été exposés pour la première fois avant 1975, date d’introduction de la <button class="w" data-k="j60-vme">valeur limite suisse pour le quartz (0,15 mg/m³ de fraction alvéolaire)</button>. Parmi les 2 579 mesures de poussière réalisées dans les entreprises, 28 % dépassaient cette valeur.</p>
<p>L’amiante reste la première cause de décès professionnel reconnu. La Suisse a interdit l’amiante en 1990, mais la latence de plusieurs décennies explique qu’environ 150 personnes meurent encore chaque année d’une maladie due à une exposition à l’amiante (Suva, page « Maladies et prestations d’assurance », consultée le 08.10.2026). La majorité de ces décès sont des mésothéliomes et des cancers bronchiques ; l’asbestose est devenue rare grâce à la baisse des expositions.</p>
<p>Une nouvelle épidémie touche les ouvriers qui découpent et polissent la <button class="w" data-k="j60-pierre">pierre artificielle</button>. Ce matériau contient plus de 90 % de silice cristalline, contre moins de 10 % pour le marbre. Les séries publiées décrivent des silicoses diagnostiquées après 7 à 19 ans d’exposition, chez des travailleurs dont l’âge médian se situe entre 33 et 55 ans (Fazio et al., 2025). Une revue systématique de 2026 retrouve un âge moyen de 41,9 ans et une fibrose massive progressive chez 28,6 % des patients dès le diagnostic (Mason et al., 2026). Les données suisses propres à ce matériau ne sont pas publiées.</p>
<p>La pneumoconiose des houilleurs n’a plus de source minière en Suisse, où aucune mine de charbon n’est exploitée. Le médecin la rencontre chez des personnes qui ont travaillé dans des mines de charbon à l’étranger. Le même raisonnement vaut pour de nombreux travailleurs migrants : dans l’étude de la Suva, 63 % des malades d’origine étrangère avaient commencé à travailler à l’étranger, où une partie de la silicose a pu s’acquérir.</p>
<h3>2.1 Pronostic</h3>
<p>Le pronostic dépend de la poussière, de la dose cumulée et des complications. Une silicose simple peut rester stable des années. Elle peut aussi progresser après l’arrêt de l’exposition, car la silice reste dans le poumon et continue de tuer les macrophages. La <button class="w" data-k="j60-fmp">fibrose massive progressive</button>, la tuberculose et le cancer bronchique font la mortalité. Dans l’asbestose, le risque de <button class="w" data-k="j60-cancer">cancer bronchique (interaction avec le tabac)</button> domine le pronostic : dans une cohorte de calorifugeurs nord-américains, l’asbestose multipliait la mortalité par cancer bronchique par 7,4 chez les non-fumeurs et par 36,8 chez les fumeurs (Markowitz et al., 2013).</p>
<div class="key"><b>Chiffre à connaître.</b> Une silicose radiologique multiplie le risque de tuberculose par 4,01 (méta-analyse de huit études ; Ehrlich et al., 2021). L’exposition à la silice sans silicose visible le multiplie encore par 1,92. Chaque silicotique doit donc être évalué pour une infection tuberculeuse.</div>
<div class="key"><b>À retenir.</b> En Suisse, la silicose persiste à bas bruit, l’amiante tue encore par ses cancers, et la pierre artificielle crée des silicoses graves chez des travailleurs jeunes. La gravité vient surtout des complications. Le mécanisme cellulaire, qui explique ces complications, est décrit dans l’îlot suivant.</div>

</section>

<section class="ilot" id="j60-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie suit une chaîne en cinq étapes. Chaque étape explique un signe clinique, un examen ou une décision.</p>
<h3>3.1 État normal : l’épuration des particules</h3>
<p>Chez le sujet sain, les grosses particules s’arrêtent dans le nez et les bronches. Le tapis mucociliaire les remonte vers le pharynx en quelques heures. Seules les particules de diamètre aérodynamique inférieur à environ 5 µm atteignent les alvéoles : c’est la <button class="w" data-k="j60-depot">fraction alvéolaire (dépôt selon la taille)</button>. Dans l’alvéole, les macrophages les phagocytent et les évacuent vers l’escalator mucociliaire ou vers les lymphatiques et les ganglions hilaires. Ce système suffit pour les poussières banales de la vie quotidienne.</p>
<h3>3.2 Première charnière : la surcharge et la toxicité pour le macrophage</h3>
<p>Une poussière fibrogène ne se contente pas de s’accumuler. Les particules de silice cristalline présentent à leur surface des groupements chimiques réactifs. Après phagocytose, elles rompent la membrane du lysosome. Le contenu du lysosome se répand dans le cytoplasme et active l’<button class="w" data-k="j60-nlrp3">inflammasome NLRP3 (production d’interleukine 1β)</button>. Le macrophage meurt et relâche la silice intacte, qu’un autre macrophage phagocyte à son tour. Ce cycle explique que la maladie progresse après l’arrêt de l’exposition.</p>
<p>Les fibres d’amiante agissent par leur forme. Une fibre plus longue qu’un macrophage ne peut pas être entièrement englobée : c’est la <button class="w" data-k="j60-amphibole">phagocytose frustrée (longueur et biopersistance des fibres)</button>. Le macrophage libère en continu des espèces réactives de l’oxygène et des cytokines.</p>
<h3>3.3 Deuxième charnière : la fibrose</h3>
<p>Les cytokines du macrophage, dont l’interleukine 1β, le TNF-α et le TGF-β, recrutent et activent les fibroblastes. Ceux-ci déposent du collagène. Autour de la silice, ce collagène s’organise en couches concentriques : c’est le <button class="w" data-k="j60-nodule">nodule silicotique (histologie)</button>. Autour de l’amiante, la fibrose est diffuse, interstitielle, et commence autour des bronchioles respiratoires des bases.</p>
<p>La topographie suit la clairance. La silice et le charbon prédominent dans les zones supérieures et postérieures, où la ventilation et le drainage lymphatique sont moins efficaces. L’amiante prédomine dans les bases, où les fibres longues se déposent davantage. Cette différence oriente la lecture de la radiographie.</p>
<h3>3.4 Troisième charnière : la perte fonctionnelle</h3>
<p>La fibrose rigidifie le poumon. La compliance diminue, les volumes baissent et le patient respire plus vite et moins profondément. La paroi alvéolo-capillaire s’épaissit et le lit capillaire se raréfie : la DLCO diminue et le patient désature à l’effort. Dans la silicose, les nodules péribronchiolaires et l’emphysème associé ajoutent souvent une obstruction : le profil fonctionnel est fréquemment mixte. Avec le temps, l’hypoxémie chronique contracte les artérioles pulmonaires et conduit au <button class="w" data-k="j60-cpulm">cœur pulmonaire chronique</button>.</p>
<h3>3.5 Quatrième charnière : les effets au-delà de la fibrose</h3>
<p>Le macrophage chargé de silice tue mal les mycobactéries, ce qui explique la <button class="w" data-k="j60-tb">silicotuberculose (J65)</button>. La silice agit aussi comme adjuvant immunitaire dans les modèles expérimentaux. Chez l’homme, l’exposition est associée à la polyarthrite rhumatoïde, à la sclérodermie systémique, aux vasculites associées aux ANCA et à des atteintes rénales ; ces liens reposent sur des études d’association, et non sur une causalité démontrée chez chaque patient (voir la fenêtre <button class="w" data-k="j60-auto">silice et auto-immunité</button>). Enfin, la silice cristalline et l’amiante sont classés cancérogènes certains pour l’homme (groupe 1) par le Centre international de recherche sur le cancer.</p>

<div class="key"><b>À retenir.</b> La silice tue le macrophage par sa chimie de surface, l’amiante par sa forme, et la maladie s’entretient d’elle-même tant que la poussière reste dans le poumon. La topographie (sommets pour la silice, bases pour l’amiante) et les complications (tuberculose, auto-immunité, cancer) découlent de ce mécanisme. Les agents et métiers précisent ensuite quelle poussière rechercher.</div>

<section class="ilot" id="j60-4"><h2><span class="n">4</span>Agents, métiers et formes cliniques</h2>
<p>Le médecin ne reconnaît une pneumoconiose que s’il connaît les métiers qui exposent. Le tableau associe chaque catégorie CIM à son agent, aux activités typiques et au comportement du tissu. Il sert à transformer une profession en hypothèse diagnostique.</p>
<table class="t"><tr><th>Catégorie</th><th>Agent</th><th>Activités typiques</th><th>Réaction du poumon</th></tr>
<tr><td>J60</td><td>Charbon, souvent mêlé de quartz</td><td>Mines de charbon souterraines (à l’étranger)</td><td>Macules et emphysème focal ; nodules ; fibrose massive possible</td></tr>
<tr><td>J61</td><td><button class="w" data-k="j60-amiante">Amiante et autres fibres minérales</button></td><td>Isolation, chantiers navals, fibrociment, freins, rénovation de bâtiments anciens</td><td>Fibrose interstitielle diffuse des bases</td></tr>
<tr><td>J62.8</td><td><button class="w" data-k="j60-silice">Silice cristalline (quartz, cristobalite)</button></td><td>Tunnels, carrières, taille de pierre, fonderies, sablage, céramique, pierre artificielle</td><td>Nodules silicotiques des sommets ; fibrose massive</td></tr>
<tr><td>J62.0</td><td><button class="w" data-k="j60-talc">Talc</button></td><td>Extraction et broyage du talc ; injection intraveineuse de comprimés broyés</td><td>Granulomes à corps étrangers, fibrose</td></tr>
<tr><td>J63.0, J63.1</td><td><button class="w" data-k="j60-alu">Aluminium, bauxite</button></td><td>Poudre d’aluminium, fusion de la bauxite</td><td>Fibrose rare</td></tr>
<tr><td>J63.2</td><td><button class="w" data-k="j60-berylliose">Béryllium</button></td><td>Alliages cuivre-béryllium, électronique, aéronautique, prothèses dentaires</td><td>Granulomes d’hypersensibilité, comme une sarcoïdose</td></tr>
<tr><td>J63.3, J63.4, J63.5</td><td><button class="w" data-k="j60-inertes">Graphite, fer, étain</button></td><td>Électrodes, soudage, fonte de l’étain</td><td>Accumulation peu ou pas fibrogène, sauf graphite mêlé de silice</td></tr>
<tr><td>J63.8</td><td><button class="w" data-k="j60-metaux-durs">Métaux durs, baryum, autres</button></td><td>Affûtage d’outils en carbure de tungstène et cobalt ; baryte</td><td>Pneumopathie à cellules géantes pour les métaux durs</td></tr>
<tr><td>J64</td><td>Agent non identifié</td><td>Exposition mixte mal documentée</td><td>Selon l’image</td></tr></table>
<p>La première colonne à regarder est la dernière : elle dit si l’image menace la fonction. Exemple : un soudeur de 55 ans a de fines opacités diffuses. S’il soude de l’acier ordinaire, une sidérose bénigne est probable et l’image peut régresser après l’arrêt. S’il a aussi meulé des pièces de fonderie, la silice doit être recherchée, car elle change le pronostic.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à une sarcoïdose devant des granulomes sans demander l’exposition au béryllium. La <button class="w" data-k="j60-berylliose">bérylliose</button> lui ressemble en imagerie et en histologie. Le diagnostic change la prise en charge : l’éviction du béryllium, l’annonce à la Suva et la protection des collègues.</div>
<h3>4.1 Formes à connaître par leur nom</h3>
<p>Le <button class="w" data-k="j60-caplan">syndrome de Caplan (pneumoconiose et polyarthrite rhumatoïde)</button> associe des nodules pulmonaires de 0,5 à 5 cm à une polyarthrite rhumatoïde chez un travailleur exposé au charbon ou à la silice. Le <button class="w" data-k="j60-auto">syndrome d’Erasmus</button> associe une exposition à la silice et une sclérodermie systémique. La pneumoconiose des houilleurs est décrite dans la fenêtre <button class="w" data-k="j60-charbon">macule charbonneuse et emphysème focal</button>.</p>
<div class="key"><b>À retenir.</b> Chaque catégorie J60 à J63 correspond à un agent et à des métiers précis. Les poussières fibrogènes (silice, amiante, charbon riche en quartz) et le béryllium exigent un suivi ; le fer, l’étain et le baryum laissent surtout une image. L’anamnèse professionnelle permet de faire ce tri.</div>
</section>

<section class="ilot" id="j60-5"><h2><span class="n">5</span>Anamnèse professionnelle et clinique</h2>
<p>Le diagnostic d’une pneumoconiose commence par une <button class="w" data-k="j60-anam-pro">anamnèse professionnelle chronologique (technique)</button>. Le médecin reconstitue chaque emploi depuis l’apprentissage, avec ses dates, le matériau manipulé, le procédé, la quantité de poussière, la ventilation et la protection respiratoire. Il demande aussi les activités annexes, les emplois à l’étranger et les loisirs exposants.</p>
<h3>5.1 Antécédents et contexte</h3>
<p>Le tabagisme se quantifie en paquets-années, car il multiplie le risque de cancer associé à l’amiante et aggrave la fonction. Une tuberculose ancienne, un contact tuberculeux ou une origine d’un pays de forte incidence comptent, car la silice favorise la réactivation. Une polyarthrite, un phénomène de Raynaud ou une maladie rénale orientent vers les effets systémiques de la silice. La <button class="w" data-k="j60-latence">latence (délai depuis le début de l’exposition)</button> se calcule pour chaque poussière.</p>
<h3>5.2 Symptômes par fréquence</h3>
<p>Une pneumoconiose simple est souvent asymptomatique et découverte sur une radiographie de surveillance. Quand des symptômes apparaissent, la <b>dyspnée d’effort</b> vient en premier : elle traduit la perte de volume et la baisse de la diffusion. La <b>toux</b> sèche ou productive suit ; une toux productive oriente vers une bronchite chronique associée, fréquente chez le mineur et le fumeur. Le mineur de charbon peut cracher des expectorations noires (mélanoptysie) lorsqu’un conglomérat se nécrose.</p>
<p>Certains symptômes ne doivent pas être attribués à la pneumoconiose elle-même. Une fièvre, des sueurs nocturnes ou une perte de poids rapide font rechercher une tuberculose. Une hémoptysie fait rechercher une tuberculose ou un cancer bronchique. Une douleur thoracique pleurale chez un ancien exposé à l’amiante fait rechercher un épanchement ou un mésothéliome, traités dans les cours J90 et C45.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Un tailleur de pierre de 62 ans, exposé trente ans, a une dyspnée d’effort lente et des nodules des sommets sur une radiographie de contrôle. Sa fonction est longtemps peu altérée.</p></div>
<div class="card"><h4>Forme accélérée moderne</h4><p>Un ouvrier de 35 ans, exposé huit ans à la pierre artificielle, a une dyspnée progressive, des nodules diffus et parfois une maladie auto-immune. La fonction peut être normale au diagnostic dans environ la moitié des cas (Mason et al., 2026).</p></div>
<div class="card"><h4>Forme aiguë</h4><p>Un sableur exposé massivement depuis quelques mois a une dyspnée rapidement croissante, une hypoxémie et des opacités en verre dépoli. Le tableau imite une pneumonie qui ne guérit pas.</p></div>
<div class="card"><h4>Forme révélée par une complication</h4><p>Un ancien mineur a une fièvre, une perte de 8 kg et une cavité dans un conglomérat. Le diagnostic de pneumoconiose est posé à l’occasion d’une silicotuberculose.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un retraité qui répond « employé de bureau » à la question du métier actuel peut avoir travaillé vingt ans dans un tunnel. Le médecin demande « tous les métiers depuis la fin de l’école », pas « le métier ».</div>
<div class="key"><b>À retenir.</b> L’anamnèse établit l’exposition, la latence et les cofacteurs (tabac, tuberculose, auto-immunité). La dyspnée d’effort est le symptôme principal ; la fièvre, l’amaigrissement et l’hémoptysie annoncent une complication. L’examen clinique cherche ensuite les signes de fibrose et de retentissement.</div>
</section>

<section class="ilot" id="j60-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique est souvent normal dans une pneumoconiose simple. Il sert surtout à mesurer le retentissement et à repérer les signes qui orientent vers l’asbestose ou une complication. Le médecin procède du général au particulier et compare toujours au normal.</p>
<div class="two">
<div class="card"><h4>État général et constantes</h4><p>Le poids se compare au poids habituel : une perte de plus de 5 % en six mois fait rechercher une tuberculose ou un cancer. La fréquence respiratoire normale de l’adulte est de 12 à 20 par minute ; une polypnée de repos traduit une maladie avancée. La <button class="w" data-k="j60-spo2">saturation au repos et à l’effort</button> se mesure, car la désaturation d’effort précède l’hypoxémie de repos.</p></div>
<div class="card"><h4>Auscultation</h4><p>Le murmure vésiculaire normal est doux et symétrique. Des <button class="w" data-k="j60-crepitants">crépitants secs inspiratoires des bases</button> évoquent l’asbestose. Ils sont rares dans la silicose simple, qui prédomine aux sommets et se traduit par peu de signes. Des sibilants traduisent une obstruction associée.</p></div>
<div class="card"><h4>Mains et articulations</h4><p>Un <button class="w" data-k="j60-hippo">hippocratisme digital (technique et signification)</button> se voit dans l’asbestose avancée. Dans une silicose, il fait rechercher un cancer bronchique. Des synovites et des nodules rhumatoïdes orientent vers un syndrome de Caplan ; une sclérodactylie et un phénomène de Raynaud vers une sclérodermie.</p></div>
<div class="card"><h4>Retentissement cardiaque</h4><p>Un éclat du deuxième bruit au foyer pulmonaire, une turgescence jugulaire, un reflux hépatojugulaire et des œdèmes des membres inférieurs signent le <button class="w" data-k="j60-cpulm">cœur pulmonaire chronique</button>. Ils indiquent un stade évolué et une hypoxémie à corriger.</p></div></div>
<p>Exemple : le patient de l’îlot 0 a une fréquence respiratoire de 18 par minute, une auscultation normale, une saturation de 95 % au repos qui chute à 89 % après deux étages. L’examen normal ne rassure pas : la désaturation d’effort révèle déjà une atteinte de la diffusion.</p>
<div class="key"><b>À retenir.</b> Un examen pulmonaire normal n’exclut pas une pneumoconiose. Les crépitants des bases et l’hippocratisme orientent vers l’asbestose ; la désaturation d’effort mesure le retentissement ; les signes de cœur pulmonaire marquent un stade avancé. La démarche diagnostique assemble ensuite exposition, imagerie et fonction.</div>
