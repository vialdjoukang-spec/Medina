<template data-pop="j60-ilo" data-title="Classification ILO des radiographies de pneumoconioses">
<div class="lab">Nature</div><p>Système international de codage des anomalies des radiographies thoraciques de face attribuables aux poussières, publié par l’ILO. L’édition révisée de 2022 remplace les images analogiques numérisées par des images de référence acquises numériquement (format d’imagerie médicale pour les consoles de diagnostic et format d’image courant).</p>
<div class="lab">Contenu</div><p>Qualité technique ; petites opacités (forme, taille, zones, profusion en 12 sous-catégories) ; grandes opacités (A, B, C) ; anomalies pleurales (plaques, calcifications, culs-de-sac, épaississement diffus) ; symboles obligatoires (par exemple es, ax, tb, ca, cv) ; commentaires.</p>
<div class="lab">Usage</div><p>Surveillance médicale des travailleurs exposés, études épidémiologiques, expertise. Les images de référence priment sur les définitions écrites.</p>
<div class="lab">Limite</div><p>La classification décrit des aspects ; elle ne définit pas des entités pathologiques et ne pose pas de diagnostic. La lecture varie entre lecteurs, d’où l’intérêt de lecteurs formés.</p>
<div class="lab">Source</div><p>International Labour Organization, Guidelines for the use of the ILO International Classification of Radiographs of Pneumoconioses, revised edition 2022.</p></template>

<template data-pop="j60-ilo-prof" data-title="Profusion des petites opacités">
<div class="lab">Échelle</div><p>Quatre catégories (0, 1, 2, 3), chacune divisée en trois, soit 12 sous-catégories : 0/−, 0/0, 0/1, 1/0, 1/1, 1/2, 2/1, 2/2, 2/3, 3/2, 3/3, 3/+.</p>
<div class="lab">Lecture de la notation</div><p>Le premier chiffre est la catégorie retenue, le second celle sérieusement envisagée. 1/0 signifie « catégorie 1, la catégorie 0 a été envisagée » ; 0/− signifie une absence particulièrement évidente d’opacités.</p>
<div class="lab">Profusion globale</div><p>Elle se juge sur l’ensemble des zones atteintes. Si une zone diffère de trois sous-catégories ou plus des autres, la zone nettement moins atteinte est ignorée.</p>
<div class="lab">Formes et tailles</div><p>Arrondies : p (jusqu’à environ 1,5 mm), q (1,5 à 3 mm), r (3 à 10 mm). Irrégulières : s, t, u, avec les mêmes limites de largeur. Exemple : « q/t » signifie une majorité d’opacités arrondies q et des opacités irrégulières t.</p></template>

<template data-pop="j60-rx" data-title="Radiographie thoracique de face">
<div class="lab">Technique</div><p>Cliché de face, debout, en inspiration profonde ; qualité notée de 1 (bonne) à 4 (inacceptable) dans la classification ILO.</p>
<div class="lab">Normal</div><p>Les vaisseaux se suivent jusqu’à la périphérie, les culs-de-sac sont libres, les hiles ont une taille et une densité normales.</p>
<div class="lab">Pathologique</div><p>Silicose : petites opacités arrondies des zones supérieures, hiles augmentés, parfois calcifiés en coquille ; grandes opacités dans les formes compliquées. Asbestose : opacités irrégulières des bases, souvent avec plaques pleurales.</p>
<div class="lab">Limites</div><p>Elle manque les nodules débutants et la fibrose discrète que montre la tomodensitométrie ; elle confond une plaque vue de face avec une opacité parenchymateuse.</p></template>

<template data-pop="j60-coquille" data-title="Calcifications ganglionnaires en coquille d’œuf">
<div class="lab">Aspect</div><p>Calcification fine et périphérique des ganglions hilaires et médiastinaux, dessinant un anneau ; symbole « es » dans la classification ILO.</p>
<div class="lab">Mécanisme</div><p>La silice transportée par les macrophages s’accumule à la périphérie du ganglion, où la fibrose et la calcification se développent.</p>
<div class="lab">Valeur</div><p>Elle est très évocatrice de silicose, mais n’apparaît que dans une minorité des cas. Elle se voit aussi dans la sarcoïdose et après irradiation ganglionnaire.</p></template>

<template data-pop="j60-tdm-sil" data-title="Tomodensitométrie de la silicose">
<div class="lab">Lésions élémentaires</div><p>Micronodules bien limités, centrolobulaires et périlymphatiques (sous-pleuraux, le long des scissures et des septums), prédominant aux sommets et en arrière.</p>
<div class="lab">Formes avancées</div><p>Conglomérats symétriques des lobes supérieurs, souvent calcifiés, avec emphysème cicatriciel autour ; adénopathies calcifiées.</p>
<div class="lab">Formes modernes</div><p>Dans la silicose aux pierres artificielles, une série californienne a décrit plus souvent que prévu des micronodules diffus centrolobulaires, du verre dépoli, des grandes opacités basales ou excavées et des infections associées, sources d’erreurs diagnostiques (Lateef et al., 2026).</p>
<div class="lab">Signes d’alarme</div><p>Cavité, asymétrie nouvelle, nodule spiculé ou croissance rapide : tuberculose ou cancer à rechercher.</p></template>

<template data-pop="j60-tdm-asb" data-title="Tomodensitométrie de l’asbestose">
<div class="lab">Signes précoces</div><p>Opacités punctiformes sous-pleurales centrolobulaires, lignes courbes sous-pleurales parallèles à la paroi, bandes parenchymateuses, prédominant aux bases et en arrière.</p>
<div class="lab">Signes évolués</div><p>Réticulations, bronchectasies de traction et rayon de miel, aspect proche de celui de la fibrose pulmonaire idiopathique.</p>
<div class="lab">Signes associés</div><p>Plaques pleurales, souvent calcifiées ; elles manquent dans une minorité d’asbestoses.</p>
<div class="lab">Technique</div><p>Des coupes en décubitus ventral distinguent une vraie fibrose postérieure d’une hypoventilation déclive. La technique générale est décrite dans la fiche <button class="w" data-k="j84-tdm">tomodensitométrie à haute résolution</button>.</p></template>

<template data-pop="j60-gds" data-title="Gazométrie artérielle">
<div class="lab">Valeurs normales</div><p>Adulte jeune au repos, en air ambiant, à basse altitude : PaO₂ d’environ 10,7 à 13,3 kPa (80 à 100 mmHg) ; PaCO₂ de 4,7 à 6,0 kPa (35 à 45 mmHg). La PaO₂ normale diminue avec l’âge et l’altitude.</p>
<div class="lab">Dans les pneumoconioses</div><p>Hypoxémie d’abord à l’effort, puis au repos ; PaCO₂ normale ou basse par hyperventilation ; hypercapnie seulement dans les formes terminales ou avec obstruction sévère.</p>
<div class="lab">Décision</div><p>Elle fonde l’indication de l’oxygénothérapie (voir la fiche oxygénothérapie du cours J84).</p>
<div class="lab">Piège</div><p>Une saturation normale au repos n’exclut pas une hypoxémie d’effort ; le test de marche la révèle.</p></template>

<template data-pop="j60-tm6" data-title="Test de marche de six minutes">
<div class="lab">Technique</div><p>Le patient marche le plus loin possible pendant six minutes dans un couloir plat ; on mesure la distance, la saturation, la fréquence cardiaque et la dyspnée, selon la norme ERS/ATS.</p>
<div class="lab">Interprétation</div><p>La distance se compare aux équations de référence selon l’âge, le sexe, la taille et le poids ; la désaturation renseigne sur le défaut de diffusion.</p>
<div class="lab">Usage</div><p>Suivi de l’évolution, indication de l’oxygène ambulatoire, bilan de transplantation.</p>
<div class="lab">Limite</div><p>Le résultat dépend de la motivation, des articulations et du cœur ; il ne localise pas la cause de la limitation.</p></template>

<template data-pop="j60-igra" data-title="Test de libération d’interféron gamma">
<div class="lab">Principe</div><p>Les lymphocytes du patient sont exposés à des antigènes spécifiques de <i>Mycobacterium tuberculosis</i>, absents du BCG et de la plupart des mycobactéries non tuberculeuses ; l’interféron gamma libéré est mesuré.</p>
<div class="lab">Interprétation</div><p>Positif : infection tuberculeuse, active ou non ; il ne distingue pas les deux. Négatif : infection peu probable, mais la sensibilité baisse chez l’immunodéprimé. Indéterminé : à répéter ou à compléter.</p>
<div class="lab">Usage chez le silicotique</div><p>Rechercher une infection avant de proposer un traitement préventif, et avant tout traitement immunosuppresseur.</p>
<div class="lab">Règle du guide suisse</div><p>Un test n’est utile que si un résultat positif conduit à traiter (guide de la tuberculose en Suisse, version 1.2024).</p></template>

<template data-pop="j60-belpt" data-title="Test de prolifération lymphocytaire au béryllium">
<div class="lab">Principe</div><p>Les lymphocytes du sang ou du lavage bronchoalvéolaire sont cultivés avec des sels de béryllium ; leur prolifération est comparée à celle de cultures témoins.</p>
<div class="lab">Interprétation (ATS 2014)</div><p>Un résultat anormal confirmé sans atteinte pulmonaire définit la sensibilisation. Avec des granulomes ou une inflammation pulmonaire, il définit la bérylliose chronique.</p>
<div class="lab">Usage</div><p>Surveillance des travailleurs exposés, diagnostic différentiel avec la sarcoïdose.</p>
<div class="lab">Limites</div><p>Il demande un laboratoire spécialisé ; un résultat isolé se confirme par un second test.</p></template>

<template data-pop="j60-biopsie" data-title="Biopsie et analyse minéralogique">
<div class="lab">Indications</div><p>Image atypique, exposition incertaine, suspicion d’un autre diagnostic qui change le traitement (cancer, sarcoïdose, pneumopathie d’hypersensibilité), expertise.</p>
<div class="lab">Techniques</div><p>Biopsies transbronchiques ou cryobiopsies, biopsie chirurgicale, prélèvement d’une masse guidé par l’imagerie ; analyse minéralogique par microscopie électronique et spectrométrie pour identifier et compter les particules.</p>
<div class="lab">Limites</div><p>Les petits prélèvements manquent souvent les lésions et la poussière (Hua et al., 2025) ; une biopsie négative n’exclut pas la maladie.</p>
<div class="lab">Principe</div><p>Une biopsie n’est pas nécessaire lorsque l’exposition, la latence et l’imagerie concordent.</p></template>

<template data-pop="j60-nodule" data-title="Nodule silicotique">
<div class="lab">Structure</div><p>Centre de collagène hyalin disposé en couches concentriques, entouré de macrophages chargés de poussière, de fibroblastes et de lymphocytes.</p>
<div class="lab">Lumière polarisée</div><p>Les particules de silice sont faiblement biréfringentes ; les silicates associés le sont davantage.</p>
<div class="lab">Évolution</div><p>Les nodules grossissent, confluent et forment la fibrose massive progressive. Le collagène hyalin ne régresse pas.</p>
<div class="lab">Topographie</div><p>Ils suivent les lymphatiques (autour des bronchioles, des vaisseaux, sous la plèvre) et se retrouvent dans les ganglions.</p></template>

<template data-pop="j60-corps-asb" data-title="Corps asbestosiques">
<div class="lab">Structure</div><p>Fibre d’amiante, surtout amphibole, recouverte par les macrophages d’un manteau de fer et de protéines, en chapelet et renflée aux extrémités ; positive à la réaction de Perls.</p>
<div class="lab">Recherche</div><p>Dans les coupes de tissu, le lavage bronchoalvéolaire ou les expectorations ; comptage en microscopie optique.</p>
<div class="lab">Signification</div><p>Ils prouvent l’exposition, pas la maladie. L’asbestose exige une fibrose ; des corps sans fibrose témoignent seulement d’une exposition.</p></template>

<template data-pop="j60-depot" data-title="Dépôt des particules selon leur taille">
<div class="lab">Mécanismes</div><p>Impaction pour les grosses particules aux bifurcations des voies supérieures ; sédimentation pour les particules de quelques micromètres dans les petites voies et les alvéoles ; diffusion pour les très fines particules.</p>
<div class="lab">Fraction alvéolaire</div><p>Les particules de diamètre aérodynamique inférieur à environ 5 µm atteignent les alvéoles (Lateef et al., 2026). Les valeurs limites du quartz portent sur cette fraction.</p>
<div class="lab">Cas des fibres</div><p>Le diamètre aérodynamique d’une fibre dépend surtout de son diamètre ; une fibre longue et fine atteint donc le poumon profond.</p>
<div class="lab">Conséquence</div><p>Le danger d’une poussière ne se juge pas à sa visibilité : la fraction la plus dangereuse est invisible à l’œil nu.</p></template>

<template data-pop="j60-nlrp3" data-title="Inflammasome NLRP3">
<div class="lab">Définition</div><p>Complexe protéique cytoplasmique de l’immunité innée qui associe le capteur NLRP3, un adaptateur et la caspase 1.</p>
<div class="lab">Activation par la silice</div><p>La rupture du lysosome libère la cathepsine B ; la sortie de potassium et les espèces réactives de l’oxygène activent aussi le complexe. La caspase 1 clive la pro-interleukine 1β en interleukine 1β active (Lam et Tate, 2025).</p>
<div class="lab">Conséquences</div><p>Inflammation, mort du macrophage, libération de signaux de danger et activation des fibroblastes.</p>
<div class="lab">Portée thérapeutique</div><p>Les inhibiteurs de cette voie restent expérimentaux dans la silicose ; aucun n’est autorisé dans cette indication.</p></template>
