<!-- ===== FENÊTRES R04 : Pareto ===== -->
<template data-pop="pareto-r04-clin" data-title="Pareto — Définitions, mécanismes et clinique">
<p class="ratio" data-cover="r04-0,r04-1,r04-2,r04-3,r04-4,r04-5,r04-6"></p>
<ul>
<li>L’hémoptysie est du sang sous-glottique émis par la toux ; R04.2 la code, R04.0 l’épistaxis, R04.1 la gorge, R04.8 l’hémorragie pulmonaire sans précision.</li>
<li>Hémoptysie menaçante : plus de 100 mL par 24 heures, ou insuffisance respiratoire, ou instabilité hémodynamique (CIRSE 2022).</li>
<li>La mort vient de l’asphyxie : l’espace mort mesure environ 150 mL et le sang crée un shunt.</li>
<li>90 % des hémoptysies viennent des artères bronchiques, à pression aortique.</li>
<li>Causes : moitié cryptogéniques ; infections, cancer, bronchectasies, tuberculose, embolie, aspergillose.</li>
<li>Mortalité hospitalière de 9,2 % ; cancer, aspergillose et ventilation mécanique pèsent 2 points chacun dans le score de Fartoukh.</li>
<li>Toujours exclure une origine nasale, pharyngée ou digestive, et examiner le nez et la gorge.</li>
<li>Les signes vitaux mesurent la menace ; l’auscultation latéralise mal.</li>
<li>La néovascularisation bronchique naît de l’inflammation chronique ; une artère bronchique de plus de 2 mm est pathologique.</li>
<li>Un anticoagulant fait saigner une lésion existante ; il ne dispense jamais du bilan étiologique.</li>
<li>Indices cliniques : hippocratisme, souffle mitral, télangiectasies de Rendu-Osler, purpura ou hématurie de vascularite, grosse jambe de thrombose.</li>
</ul></template>

<template data-pop="pareto-r04-diag" data-title="Pareto — Démarche diagnostique et urgence">
<p class="ratio" data-cover="r04-7,r04-8"></p>
<ul>
<li>Radiographie et biologie d’emblée ; angio-TDM en phase aortique chez le patient stable, bronchoscopie sur patient intubé chez l’instable.</li>
<li>Décubitus latéral côté qui saigne vers le bas.</li>
<li>Intubation par sonde d’au moins 8,0 mm ; intubation sélective du côté sain.</li>
<li>Réversion : concentré de complexe prothrombinique selon l’INR et vitamine K ; idarucizumab 5 g pour le dabigatran.</li>
<li>Acide tranexamique intraveineux comme mesure d’attente seulement.</li>
<li>Embolisation des artères bronchiques en première ligne : succès à 24 heures de 82 à 100 %, récidive jusqu’à 47 %, ischémie médullaire rare.</li>
<li>Chirurgie si échec, source artérielle pulmonaire, traumatisme ou aspergillome réfractaire.</li>
</ul></template>

<template data-pop="pareto-r04-ttt" data-title="Pareto — Traitement, épistaxis et autres sites">
<p class="ratio" data-cover="r04-9,r04-10,r04-11"></p>
<ul>
<li>Le sang pur justifie le plus souvent une hospitalisation ; l’acide tranexamique nébulisé réduit la durée d’une hémoptysie non menaçante dans de petits essais.</li>
<li>La cause se traite : bronchectasies, tuberculose avec isolement, cancer, aspergillome, embolie.</li>
<li>Épistaxis : tête penchée en avant, compression du tiers inférieur du nez d’au moins 5 minutes, puis cautérisation ou méchage.</li>
<li>L’acide tranexamique topique ne réduit pas le méchage (NoPAC) ; l’acide tranexamique oral garde une indication suisse dans l’épistaxis récidivante.</li>
<li>Les gestes locaux précèdent toute modification de l’anticoagulation si le saignement n’est pas menaçant.</li>
<li>Tout saignement après amygdalectomie relève de l’ORL en urgence.</li>
<li>Opacités bilatérales et anémie évoquent une hémorragie alvéolaire diffuse, même sans hémoptysie.</li>
</ul></template>

<template data-pop="pareto-r04-fin" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="r04-12,r04-13,r04-14"></p>
<ul>
<li>Récidive de 16,3 % en trois ans ; 4 % de cancers diagnostiqués après une hémoptysie cryptogénique.</li>
<li>Fumeur : TDM de contrôle et bronchoscopie si la TDM n’est pas contributive.</li>
<li>Reprise de l’anticoagulation après hémostase et traitement de la cause, au cas par cas.</li>
<li>Mucoviscidose : embolisations répétées ; enfant : nez, gorge, corps étranger ; grossesse : pas d’acide tranexamique au premier trimestre.</li>
<li>Malformation artérioveineuse : embolisation pulmonaire, risque d’embolie paradoxale.</li>
</ul></template>

<template data-pop="pareto-r04-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="r04-e-1,r04-e-2,r04-e-3,r04-e-4,r04-e-5,r04-e-6"></p>
<ul>
<li>Angio-TDM en phase aortique, de la base du cou aux artères rénales : examen de référence chez le patient stable.</li>
<li>Bronchoscopie : localise dans 73 à 93 % des cas, trouve la cause dans 2,5 à 8 %.</li>
<li>Artère bronchique de plus de 2 mm, plèvre de plus de 3 mm : cibles d’embolisation.</li>
<li>Biologie : hémoglobine, plaquettes, INR, créatinine, groupe, gazométrie, urine ; mycobactéries avant la bronchoscopie.</li>
<li>L’absence d’extravasation à l’artériographie n’empêche pas l’embolisation ; aucune branche spinale ne doit naître du vaisseau traité.</li>
</ul></template>

<template data-pop="pareto-r04-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="r04-p-1,r04-p-2,r04-p-3,r04-p-4,r04-p-5"></p>
<ul>
<li>Acide tranexamique intraveineux : 0,5 à 1 g deux à trois fois par jour ou 1 g toutes les 6 à 8 heures, au plus 1 mL/min, dose réduite selon la créatinine.</li>
<li>Cyklokapron oral dans l’épistaxis : 1 g trois fois par jour pendant 7 jours.</li>
<li>Contre-indications : thrombose aiguë, convulsions, insuffisance rénale grave, voie intrathécale.</li>
<li>Beriplex P/N : 25, 35 ou 50 UI/kg selon l’INR, avec vitamine K ; Praxbind 5 g pour le dabigatran.</li>
<li>Vasoconstricteurs topiques et nitrate d’argent pour l’épistaxis ; hémostase endobronchique en bronchoscopie.</li>
</ul></template>
