<!-- ===== FENÊTRES R04 : notions cliniques ===== -->
<template data-pop="r04-dualcirc" data-title="Double circulation pulmonaire">
<div class="lab">Normal</div><p>Le poumon reçoit la circulation pulmonaire, issue du ventricule droit, qui transporte tout le débit cardiaque sous une pression moyenne d’environ 15 mmHg et assure les échanges gazeux. Il reçoit aussi la circulation bronchique, issue de l’aorte, qui transporte environ 1 % du débit cardiaque sous pression systémique et nourrit les bronches, la plèvre viscérale et les ganglions.</p>
<div class="lab">Perturbation</div><p>Une inflammation chronique, comme des bronchectasies, une ancienne caverne tuberculeuse ou un aspergillome, fait proliférer et dilater les artères bronchiques. Ces artères fragiles développent des anastomoses avec la circulation pulmonaire.</p>
<div class="lab">Conséquence clinique</div><p>Environ 90 % des hémoptysies proviennent des artères bronchiques, 5 % des artères pulmonaires et 5 % d’artères systémiques non bronchiques (Ittrich 2017). Le saignement bronchique est abondant parce qu’il se fait sous pression aortique.</p>
<div class="lab">Décision</div><p>L’embolisation vise les artères bronchiques et les artères systémiques non bronchiques. Une source artérielle pulmonaire, plus rare, relève d’une embolisation pulmonaire ou de la chirurgie.</p>
<div class="lab">Sources</div><p>Ittrich et coll., Deutsches Ärzteblatt International 2017 ; CIRSE 2022, texte intégral lu le 08.10.2026.</p></template>

<template data-pop="r04-asphyxie" data-title="Asphyxie par inondation des voies aériennes">
<div class="lab">Synthèse</div><p>L’hémoptysie grave tue surtout par asphyxie, avant le choc hémorragique.</p>
<div class="lab">Mécanisme</div><p>Le volume des voies de conduction, ou espace mort anatomique, mesure environ 150 mL chez l’adulte. Le sang qui y pénètre forme des caillots qui obstruent les bronches et remplit les alvéoles déclives. Les alvéoles inondées restent perfusées sans être ventilées : ce shunt abaisse la PaO₂ et répond mal à l’oxygène.</p>
<div class="lab">Conséquence clinique</div><p>Quelques centaines de millilitres suffisent à provoquer une détresse respiratoire, alors que la même perte sanguine serait bien tolérée sur le plan hémodynamique. La SpO₂ et la fréquence respiratoire mesurent donc la menace mieux que le volume craché.</p>
<div class="lab">Limites</div><p>Le volume toléré dépend de la réserve respiratoire, de la force de la toux et de la vitesse du saignement ; aucun seuil universel n’existe.</p>
<div class="lab">Sources</div><p>Davidson et Shojaee, Chest 2020 (résumé lu) ; Kathuria et coll., Journal of Intensive Care 2020 (texte intégral lu).</p></template>

<template data-pop="r04-def-massive" data-title="Définitions de l’hémoptysie menaçante">
<div class="lab">Contentieux</div><p>Les publications proposent des seuils de 100 à 1000 mL par 24 heures, la plupart entre 300 et 600 mL (Ittrich 2017). Kathuria 2020 considère comme menaçants un débit de plus de 100 mL par heure ou un volume de plus de 500 mL par 24 heures, et ajoute qu’un volume de 50 mL peut suffire selon l’état cardiorespiratoire.</p>
<div class="lab">Source retenue</div><p>Le document de pratique le plus récent consulté, les standards de la Société européenne de radiologie cardiovasculaire et interventionnelle (CIRSE 2022), définit l’hémoptysie menaçante comme toute hémoptysie de plus de 100 mL par 24 heures, ou qui provoque une insuffisance respiratoire nécessitant une intubation, ou une instabilité hémodynamique. Ce cours retient cette définition, car elle combine volume et conséquences.</p>
<div class="lab">Périmètre et niveau de preuve</div><p>Il s’agit d’un consensus d’experts destiné aux radiologues interventionnels, et non d’une recommandation fondée sur des essais. Il s’applique à l’adulte.</p>
<div class="lab">Limites</div><p>Le volume est mal estimé et une partie du sang reste dans les bronches. Chez un patient à faible réserve respiratoire, un volume inférieur à 100 mL peut menacer la vie.</p>
<div class="lab">Accès au texte</div><p>Kettenbach et coll., Cardiovascular and Interventional Radiology 2022;45:721–732, doi 10.1007/s00270-022-03127-w, texte intégral en libre accès lu le 08.10.2026. Aucune définition suisse publiée n’a été retrouvée.</p></template>

<template data-pop="r04-pseudo" data-title="Pseudo-hémoptysie">
<div class="lab">Définition</div><p>La pseudo-hémoptysie est l’expectoration d’un sang qui ne vient pas des voies sous-glottiques : épistaxis postérieure, saignement gingival, pharyngé ou digestif haut.</p>
<div class="lab">Mécanisme</div><p>Le sang d’une épistaxis postérieure coule dans le pharynx, déclenche la toux et est recraché. À l’inverse, le sang d’une hémoptysie peut être avalé, puis vomi ou émis sous forme de méléna.</p>
<div class="lab">Conséquence pratique</div><p>L’inspection du nez et de l’oropharynx précède toute imagerie thoracique. Un doute persistant entre origine respiratoire et digestive justifie une endoscopie digestive haute.</p>
<div class="lab">Piège</div><p>Un sang rouge vif et mousseux, mêlé à l’expectoration, oriente vers l’hémoptysie ; un sang sombre, en marc de café, avec débris alimentaires, oriente vers l’hématémèse. Le mélange de signes impose d’examiner les deux voies.</p></template>

<template data-pop="r04-crypto" data-title="Hémoptysie cryptogénique">
<div class="lab">Définition</div><p>Une hémoptysie est dite cryptogénique lorsque le bilan clinique, la TDM et, selon le contexte, la bronchoscopie ne retrouvent aucune cause.</p>
<div class="lab">Fréquence et pronostic</div><p>Elle représente environ 50 % des hémoptysies hospitalisées en France. Parmi ces patients, 4 % reçoivent un diagnostic de cancer bronchique dans les trois ans (Abdulmalak 2015). Ce chiffre est une association observée dans une base administrative ; il ne prouve pas que le cancer était présent et invisible au moment du saignement.</p>
<div class="lab">Décision</div><p>Le fumeur ou l’ancien fumeur bénéficie d’une TDM de contrôle et d’une bronchoscopie si la TDM n’est pas contributive. Le sevrage tabagique est proposé. Le patient connaît les signes qui imposent une consultation.</p>
<div class="lab">Limites</div><p>Aucune recommandation suisse ne fixe le délai ni la durée du suivi.</p></template>

<template data-pop="r04-fartoukh" data-title="Score de Fartoukh">
<div class="lab">Origine</div><p>Score de mortalité hospitalière dérivé de 1087 patients admis en réanimation pour hémoptysie dans un hôpital universitaire parisien sur 14 ans (Fartoukh, Respiration 2012).</p>
<div class="lab">Composantes</div><p>Alcoolisme chronique, atteinte d’une artère pulmonaire, opacités dans au moins deux quadrants : 1 point chacun. Cancer, aspergillose, ventilation mécanique à l’admission : 2 points chacun.</p>
<div class="lab">Interprétation</div><p>Mortalité prédite : 1 % pour 0 point, 2 % pour 1, 6 % pour 2, 16 % pour 3, 34 % pour 4, 58 % pour 5, 79 % pour 6, 91 % pour 7. L’aire sous la courbe était de 0,87 dans l’échantillon de validation.</p>
<div class="lab">Limites</div><p>Population de réanimation d’un seul centre, rétrospective ; le score décrit un pronostic et ne dicte pas un geste. Il n’a pas été validé en Suisse.</p></template>

<template data-pop="r04-rasmussen" data-title="Anévrisme de Rasmussen">
<div class="lab">Définition</div><p>Pseudo-anévrisme d’une branche de l’artère pulmonaire situé dans la paroi d’une caverne tuberculeuse.</p>
<div class="lab">Mécanisme</div><p>L’inflammation granulomateuse et la nécrose caséeuse fragilisent la paroi de l’artère qui longe la caverne. La paroi se dilate puis se rompt dans la cavité, qui communique avec les bronches.</p>
<div class="lab">Conséquence pratique</div><p>Le saignement vient de la circulation pulmonaire : l’embolisation des seules artères bronchiques échoue. Les anévrismes et malformations artérielles pulmonaires expliquent environ 5 à 10,5 % des saignements qui persistent après embolisation bronchique (Ittrich 2017).</p>
<div class="lab">Décision</div><p>Une angio-TDM qui montre un anévrisme pulmonaire oriente vers une embolisation de l’artère pulmonaire ou une chirurgie.</p></template>

<template data-pop="r04-dah" data-title="Hémorragie alvéolaire diffuse">
<div class="lab">Définition</div><p>Saignement d’origine capillaire dans les alvéoles des deux poumons.</p>
<div class="lab">Présentation</div><p>Dyspnée, opacités alvéolaires bilatérales, chute de l’hémoglobine et hypoxémie. L’hémoptysie manque chez jusqu’à un tiers des patients (Lara, Chest 2010).</p>
<div class="lab">Diagnostic</div><p>Le lavage bronchoalvéolaire montre des aliquotes successives de plus en plus hémorragiques. La recherche de la cause comprend l’analyse d’urine, les ANCA, les anticorps antimembrane basale glomérulaire et les anticorps du lupus.</p>
<div class="lab">Causes</div><p>Vascularites associées aux ANCA, syndrome de Goodpasture, lupus, toxiques et médicaments, troubles de l’hémostase. La capillarite pulmonaire est la lésion des vascularites.</p>
<div class="lab">Décision</div><p>Aucun geste local ne traite une lésion diffuse : le traitement est celui de la cause, souvent immunosuppresseur, dans le cours M31 — Autres vasculopathies nécrosantes (I-13-Immunologie et allergologie). Sans cause établie, le code est R04.8.</p></template>

<template data-pop="r04-hht" data-title="Maladie de Rendu-Osler et critères de Curaçao">
<div class="lab">Définition</div><p>La télangiectasie hémorragique héréditaire, ou maladie de Rendu-Osler, est une maladie autosomique dominante qui crée des télangiectasies cutanéomuqueuses et des malformations artérioveineuses viscérales.</p>
<div class="lab">Critères de Curaçao (2000)</div><p>Quatre critères : épistaxis spontanées et récidivantes ; télangiectasies multiples des lèvres, de la cavité buccale, des doigts ou du nez ; lésions viscérales (malformations artérioveineuses pulmonaires, hépatiques, cérébrales, médullaires, télangiectasies digestives) ; apparenté au premier degré atteint. Diagnostic certain avec 3 critères, possible avec 2, peu probable avec moins de 2 (Shovlin 2000).</p>
<div class="lab">Conséquence pratique</div><p>Une malformation artérioveineuse pulmonaire expose à l’embolie paradoxale et à l’abcès cérébral, car le sang veineux court-circuite le filtre capillaire pulmonaire. Son dépistage et son embolisation pulmonaire préviennent ces complications.</p>
<div class="lab">Limites</div><p>Les critères sont cliniques ; chez l’enfant, la pénétrance dépend de l’âge et un critère manquant n’exclut pas la maladie.</p></template>

<template data-pop="r04-aspergillome" data-title="Aspergillome">
<div class="lab">Définition</div><p>Boule de filaments d’Aspergillus développée dans une cavité préexistante, souvent une séquelle de tuberculose.</p>
<div class="lab">Mécanisme du saignement</div><p>La paroi de la cavité est inflammatoire et très vascularisée par des artères systémiques. Le frottement de la boule fongique et l’inflammation érodent ces vaisseaux.</p>
<div class="lab">Pronostic</div><p>Les récidives hémorragiques touchent 30 à 100 % des patients selon les séries (Ittrich 2017). Après embolisation, le succès immédiat est d’environ 64 % et la récidive d’environ 52 % (CIRSE 2022).</p>
<div class="lab">Décision</div><p>L’embolisation sert souvent de mesure temporaire ; la résection chirurgicale se discute à froid chez le patient opérable. Le cours B44 — Aspergillose (I-03-Infectiologie) détaille le traitement antifongique.</p></template>

<template data-pop="r04-ep" data-title="Hémoptysie et embolie pulmonaire">
<div class="lab">Mécanisme</div><p>Une embolie distale peut provoquer un infarctus pulmonaire hémorragique, car le territoire privé de flux pulmonaire reçoit encore du sang des artères bronchiques. L’hémoptysie est alors en général de faible volume et s’accompagne d’une douleur pleurale.</p>
<div class="lab">Fréquence</div><p>L’embolie pulmonaire représente 2,6 % des hémoptysies hospitalisées en France (Abdulmalak 2015).</p>
<div class="lab">Décision</div><p>L’hémoptysie ne contre-indique pas à elle seule l’anticoagulation d’une embolie ; la décision dépend du volume du saignement et de la gravité de l’embolie. Cette décision est traitée dans I26 — Embolie pulmonaire (P-02-Pneumologie). L’acide tranexamique est contre-indiqué en cas de thrombose aiguë selon l’information professionnelle suisse.</p>
<div class="lab">Limites</div><p>Aucune donnée comparative solide ne fixe un seuil de volume au-delà duquel l’anticoagulation doit être suspendue.</p></template>

<template data-pop="r04-position" data-title="Décubitus latéral côté qui saigne">
<div class="lab">Geste</div><p>Le patient est couché sur le côté du poumon qui saigne, ce côté vers le bas.</p>
<div class="lab">Mécanisme</div><p>Par gravité, le sang reste dans le poumon déclive et ne coule pas dans la bronche souche controlatérale. Le poumon supérieur sain garde sa ventilation.</p>
<div class="lab">Limites</div><p>La perfusion se redistribue aussi vers le poumon déclive, ce qui peut augmenter le shunt. Le côté doit être connu ou fortement suspecté ; sinon, la position semi-assise et l’aspiration sont préférées.</p>
<div class="lab">Source</div><p>Ittrich 2017 ; Kathuria 2020.</p></template>

<template data-pop="r04-intub" data-title="Intubation sélective">
<div class="lab">Principe</div><p>La sonde d’intubation est avancée dans la bronche souche du poumon sain, ce qui isole le poumon qui saigne et ventile seulement le poumon sain.</p>
<div class="lab">Technique</div><p>Sonde à simple lumière d’au moins 8,0 mm, qui permet le passage d’un bronchoscope. Si le poumon droit saigne, la sonde est placée dans la bronche souche gauche ; si le poumon gauche saigne, dans la bronche souche droite, de préférence sous contrôle bronchoscopique (Kathuria 2020).</p>
<div class="lab">Risque</div><p>L’intubation sélective droite peut obstruer l’orifice de la bronche lobaire supérieure droite, qui naît très haut, et provoquer une atélectasie de ce lobe.</p>
<div class="lab">Alternatives</div><p>La sonde à double lumière exige un opérateur très entraîné et ses lumières étroites s’obstruent ; elle n’est pas recommandée en routine. Un ballonnet de blocage bronchique placé par bronchoscopie isole aussi le territoire qui saigne.</p></template>

<template data-pop="r04-chir" data-title="Chirurgie de l’hémoptysie">
<div class="lab">Indications</div><p>Échec de l’embolisation, plaie traumatique ou iatrogène de l’artère pulmonaire, tumeur nécrotique résécable, caverne tuberculeuse, aspergillome réfractaire (Ittrich 2017 ; Kathuria 2020).</p>
<div class="lab">Risque</div><p>La mortalité des séries récentes varie de 4 à 19 % ; elle est plus élevée en urgence qu’entre deux épisodes de saignement. La récidive après résection est de 2,2 à 3,4 %.</p>
<div class="lab">Décision</div><p>La chirurgie se planifie à froid lorsque c’est possible, après stabilisation par embolisation. Le CIRSE 2022 la propose en urgence si l’embolisation efficace est impossible et que le saignement récidive dans les 72 heures.</p></template>

<template data-pop="r04-kiesselbach" data-title="Tache vasculaire de Kiesselbach">
<div class="lab">Anatomie</div><p>Zone de la partie antérieure et inférieure du septum nasal où s’anastomosent des branches des artères ethmoïdale antérieure, sphénopalatine, grande palatine et labiale supérieure, sous une muqueuse fine.</p>
<div class="lab">Conséquence clinique</div><p>La plupart des épistaxis y naissent, car la muqueuse y est exposée à l’air sec, au grattage et aux traumatismes. Environ 10 % des épistaxis viennent de la partie postérieure, à partir de l’artère sphénopalatine (Schmidtman 2022).</p>
<div class="lab">Décision</div><p>La compression des ailes du nez contre le septum comprime directement cette zone ; un point visible se cautérise.</p></template>

<template data-pop="r04-epist" data-title="Premiers gestes dans l’épistaxis">
<div class="lab">Séquence</div><p>Évaluer les voies aériennes et l’état hémodynamique. Faire asseoir le patient, penché en avant. Moucher ou aspirer les caillots. Comprimer fermement le tiers inférieur, la partie souple, du nez pendant au moins 5 minutes sans relâcher (American Academy of Otolaryngology 2020).</p>
<div class="lab">Pourquoi</div><p>La compression écrase la tache de Kiesselbach et laisse le caillot se former. La tête penchée en avant évite que le sang soit avalé, vomi ou aspiré.</p>
<div class="lab">Ensuite</div><p>Vasoconstricteur topique, rhinoscopie antérieure, cautérisation d’un point visible, méchage si le site reste invisible ; avis ORL si échec, saignement postérieur ou récidive unilatérale.</p>
<div class="lab">Limites</div><p>D’autres sources proposent une compression de 10 à 15 minutes (Schmidtman 2022). La recommandation américaine fixe un minimum, non une durée maximale.</p></template>

<template data-pop="r04-nopac" data-title="Essai NoPAC">
<div class="lab">Question</div><p>L’acide tranexamique topique réduit-il le recours au méchage antérieur chez l’adulte dont l’épistaxis persiste après premiers secours et vasoconstricteur ?</p>
<div class="lab">Méthode</div><p>Essai randomisé en double aveugle contre placebo, 496 patients, 26 services d’urgence britanniques, de 2017 à 2019.</p>
<div class="lab">Résultat</div><p>Méchage chez 43,7 % des patients sous acide tranexamique et 41,3 % sous placebo (rapport de cotes 1,107 ; intervalle de confiance à 95 % de 0,769 à 1,594). Aucune différence sur les critères secondaires.</p>
<div class="lab">Portée</div><p>L’acide tranexamique appliqué sur un rouleau de coton n’est pas plus efficace que le placebo dans cette population. Le résultat ne concerne pas l’acide tranexamique oral des épistaxis récidivantes ni la maladie de Rendu-Osler.</p>
<div class="lab">Source</div><p>Reuben et coll., Annals of Emergency Medicine 2021;77:631–640, résumé lu le 08.10.2026.</p></template>

<template data-pop="r04-amygdal" data-title="Hémorragie après amygdalectomie">
<div class="lab">Chronologie</div><p>Le saignement est dit primaire le jour de l’intervention, secondaire ensuite, lorsque l’escarre se détache. Dans une série de 250 enfants opérés pour ce saignement, la médiane était au sixième jour et 14,8 % des épisodes survenaient dans les 24 premières heures (Chorney 2021).</p>
<div class="lab">Conduite</div><p>Tout saignement, même minime, impose un avis ORL immédiat, car il peut annoncer un saignement abondant. La surveillance des voies aériennes est prioritaire.</p>
<div class="lab">Bilan de coagulation</div><p>Dans la même série, le bilan de coagulation systématique après un premier saignement a rarement conduit à un diagnostic ; un deuxième épisode justifie un avis d’hématologie.</p></template>
