<!-- ===== FENÊTRES R04 : examens et gestes ===== -->
<template data-pop="r04-rx" data-title="Radiographie thoracique dans l’hémoptysie">
<div class="lab">Pourquoi</div><p>Examen immédiat, au lit si nécessaire, qui cherche la trace du sang aspiré et une lésion causale.</p>
<div class="lab">Normal</div><p>Champs pulmonaires symétriques, hiles normaux, coupoles nettes, aucune opacité focale.</p>
<div class="lab">Pathologique</div><p>Opacités alvéolaires du côté qui saigne ; caverne apicale de la tuberculose ; masse ou atélectasie du cancer ; masse dans une cavité surmontée d’un croissant gazeux de l’aspergillome ; opacités bilatérales de l’hémorragie alvéolaire diffuse.</p>
<div class="lab">Performance</div><p>Latéralisation dans 33 à 82 % des cas, cause dans 35 à 50 % des cas (Ittrich 2017).</p>
<div class="lab">Piège</div><p>Une radiographie normale n’exclut ni un cancer endobronchique ni des bronchectasies ; la TDM reste nécessaire chez le fumeur et en cas de sang pur.</p></template>

<template data-pop="r04-bio" data-title="Biologie de l’hémoptysie">
<div class="lab">Hémoglobine</div><p>Mesure les pertes cumulées. Elle baisse en retard, car l’hémodilution prend plusieurs heures ; une valeur initiale normale ne rassure pas.</p>
<div class="lab">Plaquettes, INR, temps de céphaline activée</div><p>Détectent une thrombopénie, l’effet d’un antagoniste de la vitamine K ou une coagulopathie. L’INR fixe la dose de concentré de complexe prothrombinique.</p>
<div class="lab">Créatinine</div><p>Conditionne l’injection d’iode et la dose d’acide tranexamique, éliminé par le rein.</p>
<div class="lab">Gazométrie</div><p>Mesure le shunt et la ventilation ; une PaCO₂ qui monte signale l’épuisement.</p>
<div class="lab">Analyse d’urine</div><p>Une hématurie avec protéinurie évoque un syndrome pneumo-rénal et fait doser les ANCA et les anticorps antimembrane basale glomérulaire.</p>
<div class="lab">Microbiologie</div><p>Recherche de mycobactéries dans l’expectoration par examen direct, culture et amplification génique, avant la bronchoscopie et sous protection respiratoire ; anticorps anti-aspergillaires si cavité.</p></template>

<template data-pop="r04-angiotdm" data-title="Angio-TDM thoracique pour hémoptysie">
<div class="lab">Technique</div><p>TDM injectée en phase artérielle aortique. En cas d’hémoptysie grave et active, l’acquisition va de la base du cou aux artères rénales, pour repérer les artères systémiques non bronchiques (CIRSE 2022).</p>
<div class="lab">Résultats attendus</div><p>Lobe qui saigne, artères bronchiques de plus de 2 mm, artères non bronchiques sous une plèvre épaissie de plus de 3 mm, anévrisme pulmonaire, cause.</p>
<div class="lab">Performance</div><p>Localisation du lobe dans 63 à 100 % des cas ; cause dans 60 à 77 % des cas (Ittrich 2017).</p>
<div class="lab">Limites</div><p>Elle exige un patient transportable et une fonction rénale compatible. Chez le patient instable, la bronchoscopie sur patient intubé passe en premier.</p>
<div class="lab">Alternative</div><p>Pour des crachats striés de sang avec bronchectasies suspectées, une TDM sans injection suffit et trouve la cause dans 82 à 100 % des cas (CIRSE 2022).</p></template>

<template data-pop="r04-bronchoscopie" data-title="Bronchoscopie dans l’hémoptysie">
<div class="lab">Rôle</div><p>Localiser le site, aspirer les caillots, réaliser une hémostase et prélever. Elle localise dans 73 à 93 % des cas, mais trouve la cause dans 2,5 à 8 % des cas (Ittrich 2017).</p>
<div class="lab">Bronchoscope rigide</div><p>Large canal d’aspiration et de ventilation ; préféré en cas de saignement abondant pour extraire les caillots et tamponner.</p>
<div class="lab">Gestes d’hémostase</div><p>Lavage au sérum froid, instillation d’un vasoconstricteur, ballonnet de blocage bronchique, traitement thermique d’une lésion endobronchique. Le laser est contre-indiqué au-delà d’une FiO₂ de 0,40 en raison du risque d’incendie des voies aériennes (Kathuria 2020).</p>
<div class="lab">Piège</div><p>La bronchoscopie souple chez un patient non intubé qui inonde ses voies aériennes aggrave l’hypoxémie ; elle se fait après sécurisation des voies aériennes.</p></template>

<template data-pop="r04-bae" data-title="Embolisation des artères bronchiques">
<div class="lab">Principe</div><p>Occlusion des artères bronchiques et systémiques non bronchiques pathologiques par des particules calibrées, de préférence des particules non sphériques d’alcool polyvinylique de 355 à 500 µm ; les particules de moins de 300 µm sont proscrites (CIRSE 2022).</p>
<div class="lab">Indications</div><p>Hémoptysie menaçante ; au moins trois épisodes d’au moins 100 mL en une semaine ; saignement chronique ou croissant ; pont vers la transplantation dans la mucoviscidose.</p>
<div class="lab">Contre-indication</div><p>Absolue : branche à destination du cœur, de la moelle ou du cerveau naissant du vaisseau à traiter.</p>
<div class="lab">Résultats</div><p>Succès technique de 90 à 100 % ; succès clinique de 82 à 100 % à 24 heures, de 70 à 92 % à 30 jours et de 64 à 92 % à un an ; récidive jusqu’à 47 % (CIRSE 2022).</p>
<div class="lab">Complications</div><p>Syndrome post-embolisation de 1,7 à 31 %, douleur thoracique de 1,4 à 34 %, dysphagie de 0,7 à 30 %, ischémie médullaire de 0,2 à 6,5 %, accident ischémique cérébral de 0,6 à 2 %.</p>
<div class="lab">Limites</div><p>Traitement symptomatique : la cause doit être traitée. La mucoviscidose nécessite souvent une nouvelle embolisation tous les 2 à 3 ans.</p></template>

<template data-pop="r04-myelite" data-title="Ischémie médullaire après embolisation">
<div class="lab">Mécanisme</div><p>Une branche spinale naît du tronc intercostobronchique dans environ 5 à 10 % des cas. Des particules injectées dans ce tronc peuvent occlure la vascularisation de la moelle.</p>
<div class="lab">Fréquence</div><p>Rapportée jusqu’à 6 % dans les séries anciennes, elle est inférieure à 1 % dans les séries récentes (CIRSE 2022).</p>
<div class="lab">Prévention</div><p>Recherche angiographique de toute branche spinale ; cathétérisme au-delà de l’origine des artères intercostales ; particules d’au moins 300 µm.</p>
<div class="lab">Surveillance</div><p>Examen moteur et sensitif des membres inférieurs et recherche d’un trouble sphinctérien après l’embolisation ; tout déficit impose une IRM médullaire urgente.</p></template>
