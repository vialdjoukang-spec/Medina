<!-- ===== FENÊTRES R04 : pharmacologie et arbitrages ===== -->
<template data-pop="r04-txa" data-title="Acide tranexamique et hémoptysie : données et position retenue">
<div class="lab">Normal</div><p>Le caillot qui ferme une brèche est dissous par la plasmine. La muqueuse bronchique est riche en activateurs du plasminogène.</p>
<div class="lab">Mécanisme du traitement</div><p>L’acide tranexamique empêche l’activation du plasminogène et protège le caillot existant ; il ne ferme pas une artère sous pression aortique.</p>
<div class="lab">Données dans l’hémoptysie non menaçante</div><p>Essai de Wand 2018 : 47 patients, nébulisation de 500 mg trois fois par jour contre placebo ; arrêt du saignement en 5 jours chez 96 % contre 50 %, moins de gestes invasifs. Essai de Dinesh 2026 : 46 patients, nébulisation et voie intraveineuse de 500 mg toutes les 8 heures d’efficacité comparable. Méta-analyse de Mahalingam 2025 : tendance favorable, preuves limitées par le risque de biais.</p>
<div class="lab">Données dans l’hémoptysie menaçante</div><p>Aucun essai. Kathuria 2020 le juge envisageable comme mesure d’attente avant l’intervention définitive. Le CIRSE 2022 estime les preuves insuffisantes pour recommander les antifibrinolytiques.</p>
<div class="lab">Position retenue</div><p>Dans l’hémoptysie non menaçante, l’acide tranexamique est une option raisonnable. Dans l’hémoptysie menaçante, il peut être donné par voie intraveineuse comme mesure d’attente, sans retarder la protection des voies aériennes ni l’embolisation. Cette position suit les données les plus récentes lues ; elle n’est pas une recommandation suisse.</p>
<div class="lab">Limites</div><p>Petits essais monocentriques, population souvent tuberculeuse dans les essais indiens, usage nébulisé hors indication en Suisse. Contre-indication en cas de thrombose aiguë.</p>
<div class="lab">Accès aux textes</div><p>Wand, Chest 2018, doi 10.1016/j.chest.2018.09.026 ; Dinesh, Lung India 2026, doi 10.4103/lungindia.lungindia_264_25 ; Mahalingam, Lung 2025, doi 10.1007/s00408-024-00774-3 ; CIRSE 2022, doi 10.1007/s00270-022-03127-w ; résumés lus, sauf CIRSE en texte intégral, le 08.10.2026.</p></template>

<template data-pop="r04-d-txa" data-title="Monographie : acide tranexamique">
<div class="lab">Formes suisses</div><p>Tranexam Labatec, solution injectable à 100 mg/mL (ampoules de 500 mg/5 mL et 1000 mg/10 mL) ; Cyklokapron, comprimés pelliculés de 500 mg et comprimés effervescents de 1000 mg.</p>
<div class="lab">Posologie de l’adulte</div><p>Voie intraveineuse lente, au plus 1 mL/min : 0,5 à 1 g deux à trois fois par jour en fibrinolyse locale ; 1 g toutes les 6 à 8 heures en fibrinolyse générale. Voie orale dans l’épistaxis prolongée ou récidivante : 2 comprimés de 500 mg trois fois par jour pendant 7 jours.</p>
<div class="lab">Insuffisance rénale</div><p>Voie intraveineuse : créatinine de 120 à 249 µmol/L, 10 mg/kg toutes les 12 heures ; 250 à 500 µmol/L, 10 mg/kg toutes les 24 heures ; plus de 500 µmol/L, 5 mg/kg toutes les 24 heures ; contre-indication en insuffisance rénale grave. Aucune adaptation hépatique.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité, thrombose veineuse ou artérielle aiguë, fibrinolyse de coagulopathie de consommation sauf exception, insuffisance rénale grave, antécédent de convulsions, voies intrathécale, péridurale, intraventriculaire et intracérébrale.</p>
<div class="lab">Effets indésirables</div><p>Nausées, vomissements, diarrhée ; hypotension, bradycardie et asystolie en cas d’injection trop rapide ; troubles visuels ; convulsions ; thromboses.</p>
<div class="lab">Grossesse et allaitement</div><p>Non recommandé au premier trimestre ; données limitées rassurantes aux deuxième et troisième trimestres ; passage dans le lait à environ 1 % de la concentration sérique.</p>
<div class="lab">Sources</div><p>Information professionnelle suisse, ch.oddb.org, Tranexam Labatec solution injectable (juillet 2026) et Cyklokapron (juin 2026), consultées le 08.10.2026.</p></template>

<template data-pop="r04-avk" data-title="Réversion des anticoagulants">
<div class="lab">Antagonistes de la vitamine K</div><p>Beriplex P/N : 25 UI/kg pour un INR de 2,0 à 3,9 ; 35 UI/kg pour 4,0 à 6,0 ; 50 UI/kg au-delà de 6,0 ; dose unique maximale de 5000 UI ; correction en environ 30 minutes. La vitamine K est toujours envisagée en même temps, car elle agit en 4 à 6 heures et prolonge la correction. La répétition du concentré n’est pas étayée.</p>
<div class="lab">Dabigatran</div><p>Praxbind : 5 g, en deux perfusions consécutives de 5 à 10 minutes de 2,5 g ou en bolus. Une seconde dose de 5 g peut être discutée si le saignement reprend avec des temps de coagulation allongés.</p>
<div class="lab">Inhibiteurs du facteur Xa</div><p>Le choix de l’antidote suit le protocole hospitalier ; ce cours ne fixe pas de dose.</p>
<div class="lab">Risque</div><p>La réversion expose au risque thromboembolique de l’indication initiale ; elle se réserve au saignement menaçant ou à un geste urgent.</p>
<div class="lab">Sources</div><p>Informations professionnelles suisses de Beriplex P/N (octobre 2022) et Praxbind (mars 2021), ch.oddb.org, consultées le 08.10.2026.</p></template>

<template data-pop="r04-d-vaso" data-title="Vasoconstricteurs topiques et cautérisation">
<div class="lab">Vasoconstricteurs</div><p>L’oxymétazoline ou l’adrénaline diluée, appliquées sur un coton intranasal, contractent les artérioles de la muqueuse et réduisent le débit local. Leur emploi dans l’épistaxis est mentionné par la recommandation américaine de 2020 ; c’est un usage hors indication des préparations nasales suisses. En bronchoscopie, l’instillation d’adrénaline est décrite comme mesure d’attente (Kathuria 2020).</p>
<div class="lab">Cautérisation</div><p>Le nitrate d’argent ou la cautérisation électrique ferment un vaisseau visible après anesthésie locale ; la cautérisation se limite au site qui saigne et ne se fait pas simultanément sur les deux faces du septum, pour éviter une perforation.</p>
<div class="lab">Limites</div><p>Aucune dose ni dilution standardisée n’est fixée par les sources consultées ; elles suivent les protocoles locaux. Les vasoconstricteurs se manient avec prudence chez le patient coronarien.</p></template>
