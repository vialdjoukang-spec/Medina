<section class="ilot" id="j85-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 58 ans consulte pour une toux productive qui dure depuis trois semaines. Ses crachats sont purulents et ont une odeur fétide. Il a maigri de 5 kg et transpire la nuit. Il boit environ huit verres d’alcool par jour. Un mois plus tôt, il a été retrouvé endormi sur le sol après une soirée très arrosée. Sa dentition est en mauvais état. La température atteint 38,6 °C, la fréquence respiratoire 22 par minute et la saturation 93 % à l’air ambiant. La radiographie montre, dans le lobe inférieur droit, une cavité de 6 cm à paroi épaisse avec un niveau hydroaérique, et un émoussement du cul-de-sac costodiaphragmatique droit.</p>
<p>La question qui structure ce cours est la suivante : <b>cette cavité est-elle un abcès pulmonaire, un empyème pleural ou une autre lésion cavitaire comme un cancer ou une tuberculose, quels germes faut-il couvrir, faut-il drainer et pendant combien de temps faut-il traiter ?</b></p>
<p>À la fin de ce cours, le médecin assistant sait reconnaître une suppuration du poumon, de la plèvre ou du médiastin. Il sait distinguer un abcès d’un empyème sur l’imagerie. Il choisit une antibiothérapie qui couvre la flore oropharyngée anaérobie. Il sait quand un drain, des enzymes intrapleuraux ou une chirurgie deviennent nécessaires. Il reconnaît les urgences : choc septique, hémoptysie massive, inondation bronchique, fistule et médiastinite.</p>
<div class="key"><b>Message fondateur.</b> Une suppuration thoracique est une collection de pus. Un antibiotique pénètre mal dans une cavité nécrotique, acide et pauvre en vaisseaux. La guérison exige donc deux actions : un antibiotique adapté, et l’évacuation du pus par les bronches, par un drain ou par le chirurgien. L’abcès pulmonaire se draine le plus souvent seul par une bronche. Le pyothorax, lui, ne se draine pas seul : il exige presque toujours un drain.</div>
<div class="key"><b>Prérequis et cours voisins.</b> La pneumonie communautaire et nosocomiale est traitée dans le cours J18. L’<button class="w" data-k="j85-inhal">inhalation de liquide oropharyngé ou gastrique (mécanisme initial de l’abcès)</button> est la cause principale ; la pneumopathie d’inhalation elle-même relève de la catégorie J69. L’épanchement pleural, la ponction, les critères de Light et les <button class="w" data-k="j90-stades">stades de l’épanchement parapneumonique (exsudatif, fibrinopurulent, organisé)</button> sont traités dans le cours J90. Le présent cours commence là où le pus est formé.</div>
</section>

<section class="ilot" id="j85-1"><h2><span class="n">1</span>Définitions, classifications et codage</h2>
<p>Les termes de ce domaine désignent des lésions différentes, qui n’ont ni le même traitement ni le même pronostic. Le médecin doit d’abord nommer correctement ce qu’il voit sur l’imagerie.</p>
<h3>1.1 Les entités</h3>
<p>Le tableau suivant sépare les lésions selon l’endroit où siège le pus et selon l’étendue de la nécrose. La colonne de droite indique le fait qui permet de les distinguer en pratique.</p>
<table class="t"><tr><th>Entité</th><th>Définition</th><th>Fait distinctif</th></tr>
<tr><td>Abcès pulmonaire</td><td>Cavité de plus de 2 cm, creusée dans le parenchyme par une nécrose liquéfiante d’origine infectieuse, contenant du pus ou des débris</td><td>Cavité unique à paroi épaisse, souvent avec niveau hydroaérique</td></tr>
<tr><td><button class="w" data-k="j85-necpn">Pneumonie nécrosante (cavités multiples de moins de 2 cm)</button></td><td>Pneumonie dont la nécrose crée plusieurs petites cavités</td><td>Plusieurs cavités dans une condensation ; germes plus virulents</td></tr>
<tr><td><button class="w" data-k="j85-gangrene">Gangrène pulmonaire (nécrose ischémique massive)</button></td><td>Nécrose étendue d’un lobe ou d’un poumon par thrombose des vaisseaux, avec un fragment de poumon mort détaché</td><td>Séquestre pulmonaire flottant dans une cavité ; évolution rapide</td></tr>
<tr><td>Abcès du médiastin</td><td>Collection purulente dans les espaces celluleux du médiastin</td><td>Origine cervicale, dentaire ou œsophagienne ; urgence chirurgicale</td></tr>
<tr><td>Pyothorax (empyème pleural)</td><td>Pus dans la cavité pleurale, ou germes visibles à l’examen direct ou en culture du liquide pleural</td><td>Collection pleurale lenticulaire ; ne se draine pas seule</td></tr>
<tr><td>Pyopneumothorax</td><td>Pus et air dans la cavité pleurale</td><td>Niveau hydroaérique pleural ; évoque une fistule</td></tr></table>
<p>Le premier élément à regarder est la localisation du pus : parenchyme, plèvre ou médiastin. Le second est l’étendue de la nécrose. Exemple : un patient porteur de six cavités de 1 cm dans une pneumonie du lobe supérieur n’a pas « six abcès » ; il a une pneumonie nécrosante, souvent due à <i>Staphylococcus aureus</i> ou à <i>Klebsiella pneumoniae</i>, dont le pronostic et le spectre antibiotique diffèrent de ceux d’un abcès d’inhalation.</p>
<h3>1.2 Classifications de l’abcès pulmonaire</h3>
<p>L’abcès est dit <b>primaire</b> lorsqu’il naît d’une infection du parenchyme, le plus souvent après inhalation, chez un sujet sans lésion bronchique préalable. Il est dit <b>secondaire</b> lorsqu’il complique un autre processus : obstruction bronchique par un cancer ou un corps étranger, <button class="w" data-k="j85-emboles">embolies septiques (endocardite tricuspidienne, syndrome de Lemierre)</button>, immunodépression, ou rupture d’un abcès sous-phrénique dans le poumon. Une revue de 2015 (Kuhajda, Annals of Translational Medicine, résumé lu) attribue environ 60 % des abcès à la forme primaire. Cette distinction compte, car un abcès secondaire impose de traiter sa cause : un cancer bronchique obstructif ne guérit pas avec un antibiotique.</p>
<p>L’abcès est dit <b>aigu</b> lorsque l’évolution dure moins de quatre à six semaines, et <b>chronique</b> au-delà. Ce seuil est une convention descriptive, non un critère validé. Un abcès chronique a une paroi fibreuse épaisse qui se rétracte moins et répond moins bien à l’antibiotique seul.</p>
<h3>1.3 Le pyothorax selon la présence d’une fistule</h3>
<p>Une <b>fistule</b> est une communication anormale entre la cavité pleurale infectée et un autre organe creux ou la peau. Elle change le traitement, car le pus est réensemencé ou l’air entre en permanence. La CIM-10-GM sépare donc le pyothorax avec fistule (J86.0) du pyothorax sans fistule (J86.9). L’îlot 11 détaille chaque fistule.</p>
<h3>1.4 Codage CIM-10-GM 2024</h3>
<p>Le tableau ci-dessous reprend la classification officielle du BfArM pour le bloc J85-J86, vérifiée le 08.10.2026. Il permet de coder chaque situation sans erreur.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Exemple</th></tr>
<tr><td>J85.0</td><td>Gangrène et nécrose du poumon</td><td>Séquestre lobaire au cours d’une pneumonie à <i>Klebsiella</i></td></tr>
<tr><td>J85.1</td><td>Abcès du poumon avec pneumonie</td><td>Abcès dans une pneumonie d’inhalation sans germe identifié</td></tr>
<tr><td>J85.2</td><td>Abcès du poumon sans pneumonie</td><td>Abcès isolé ; abcès du poumon sans autre précision</td></tr>
<tr><td>J85.3</td><td>Abcès du médiastin</td><td>Collection médiastinale après abcès dentaire</td></tr>
<tr><td>J86.00</td><td>Pyothorax avec fistule du parenchyme pulmonaire</td><td>Fistule pneumopleurale par rupture d’un abcès</td></tr>
<tr><td>J86.01</td><td>Pyothorax avec fistule des bronches et de la trachée</td><td>Fistule bronchopleurale après pneumonectomie</td></tr>
<tr><td>J86.02</td><td>Pyothorax avec fistule de la paroi thoracique</td><td>Empyème de nécessité ; fistule pleurocutanée</td></tr>
<tr><td>J86.03</td><td>Pyothorax avec fistule œsotrachéale</td><td>Fistule entre œsophage et trachée</td></tr>
<tr><td>J86.04</td><td>Pyothorax avec fistule œsopleurale</td><td>Rupture spontanée de l’œsophage</td></tr>
<tr><td>J86.05</td><td>Pyothorax avec autre fistule œsophagienne</td><td>Fistule œsobronchique ou œsopulmonaire</td></tr>
<tr><td>J86.08</td><td>Pyothorax avec autre fistule</td><td>Fistule pleurobiliaire, par exemple</td></tr>
<tr><td>J86.09</td><td>Pyothorax avec fistule, sans précision</td><td>Fistule certaine, trajet non documenté</td></tr>
<tr><td>J86.9</td><td>Pyothorax sans fistule</td><td>Empyème pleural, y compris chronique, sans autre précision</td></tr></table>
<p>Trois règles d’exclusion évitent les erreurs fréquentes. Premièrement, un abcès associé à une pneumonie due à un germe précisé est codé avec la pneumonie correspondante (J09 à J16), et non en J85.1. Deuxièmement, un empyème tuberculeux relève de A15-A16 et du cours sur la tuberculose. Troisièmement, la médiastinite sans abcès collecté est codée J98.50 ; seul l’abcès collecté relève de J85.3. Le germe peut être précisé par un code supplémentaire de B95 à B98.</p>
<div class="key"><b>À retenir.</b> Le médecin nomme la lésion selon le siège du pus (poumon, plèvre, médiastin) et selon l’étendue de la nécrose (abcès, pneumonie nécrosante, gangrène). Il cherche toujours une cause secondaire à un abcès et une fistule à un pyothorax. Ces deux questions déterminent le traitement, qui est développé après l’étude des mécanismes.</div>
</section>

<section class="ilot" id="j85-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Aucune donnée suisse publiée sur l’incidence de l’abcès pulmonaire ou du pyothorax n’a été trouvée lors de la rédaction (recherche du 08.10.2026). Les chiffres suivants proviennent de cohortes européennes ; ils donnent des ordres de grandeur, non une incidence suisse.</p>
<h3>2.1 Abcès pulmonaire</h3>
<p>L’incidence exacte de l’abcès pulmonaire n’est pas connue, et la mortalité rapportée varie de 2 à 20 % selon les séries. Une cohorte danoise de quatre hôpitaux a inclus 222 adultes hospitalisés entre 2016 et 2021 (Kirkegaard Vaarst, European Clinical Respiratory Journal, 2025, texte intégral lu). L’âge médian était de 65 ans, 62 % étaient des hommes, 33 % avaient une bronchopneumopathie chronique obstructive (BPCO) et 74 % fumaient ou avaient fumé. La mortalité toutes causes était d’environ 7 % à 90 jours et 15 % à un an chez les patients non drainés. Ces décès reflètent surtout le terrain, et non l’abcès seul.</p>
<h3>2.2 Pyothorax</h3>
<p>L’incidence de l’infection pleurale augmente régulièrement dans les données européennes récentes (déclaration ERS/ESTS 2023). La durée médiane d’hospitalisation reste de 10 à 14 jours. Dans la cohorte prospective de validation du score RAPID, 542 adultes ont été suivis : la mortalité était de 10 % à trois mois et de 19 % à un an (Corcoran, European Respiratory Journal, 2020, résumé lu). Plus de 30 % des patients meurent ou doivent être opérés (introduction de MIST2, New England Journal of Medicine, 2011). Une revue de 2025 rapporte une mortalité à un an de 10 à 20 %, qui atteint 35 % chez le sujet âgé et l’immunodéprimé (Pearce, Journal of Clinical Medicine, 2025, texte intégral lu).</p>
<h3>2.3 Médiastin</h3>
<p>La <button class="w" data-k="j85-dnm">médiastinite nécrosante descendante (infection cervicale ou dentaire qui descend dans le médiastin)</button> est rare et très grave. Pearse rapportait en 1938 une mortalité de 85 % sans drainage chirurgical ; les séries récentes rapportent 11 à 50 %, selon la précocité et l’étendue du drainage (revue de Chaulk, Mediastinum, 2025, texte intégral lu). La rupture spontanée de l’œsophage tue jusqu’à 40 % des patients ; la mortalité descend à environ 6 % lorsque le diagnostic est posé dans les 24 premières heures (revue de Predescu, Diagnostics, 2025).</p>
<div class="key"><b>À retenir.</b> Ces infections sont rares mais graves : une personne sur cinq atteinte d’infection pleurale meurt dans l’année. Le pronostic dépend du terrain et du délai de drainage. Le retard diagnostique est le facteur sur lequel le médecin peut agir ; les mécanismes expliquent pourquoi.</div>
</section>

<section class="ilot" id="j85-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les suppurations thoraciques suivent une même logique : des bactéries atteignent un espace où les défenses sont débordées, elles détruisent le tissu, et le pus s’accumule dans une cavité que le sang et l’antibiotique atteignent mal. Chaque charnière de cette chaîne explique un signe et une décision.</p>
<h3>3.1 État normal</h3>
<p>Chez le sujet sain, de petites quantités de sécrétions oropharyngées atteignent les voies aériennes pendant le sommeil. La toux, le transport mucociliaire et les macrophages alvéolaires les éliminent sans dommage. La cavité pleurale contient seulement quelques millilitres de liquide stérile, renouvelé en permanence et réabsorbé par les lymphatiques pariétaux. Le médiastin est un espace celluleux lâche, séparé du cou par des plans de fascias qui restent pourtant continus avec lui.</p>
<h3>3.2 Première charnière : un inoculum massif ou des défenses diminuées</h3>
<p>L’abcès primaire commence par une <button class="w" data-k="j85-inhal">inhalation d’un volume important de liquide oropharyngé</button>. Elle survient lorsque la conscience ou la déglutition sont altérées : ivresse, sédation, crise d’épilepsie, accident vasculaire cérébral, anesthésie. Si la bouche est mal entretenue, le liquide inhalé transporte une flore très dense en <button class="w" data-k="j85-anaer">bactéries anaérobies (Prevotella, Fusobacterium, Peptostreptococcus)</button> et en streptocoques du groupe <i>anginosus</i>. Le liquide tombe par gravité dans les <button class="w" data-k="j85-segments">segments déclives (segment postérieur du lobe supérieur, segment apical du lobe inférieur)</button>. Le patient de l’îlot 0 a dormi sur le sol en état d’ivresse : son abcès siège dans le lobe inférieur droit, là où le liquide tombe en décubitus dorsal.</p>
<h3>3.3 Deuxième charnière : la nécrose liquéfiante</h3>
<p>Une pneumonie d’inhalation non traitée évolue en une à deux semaines. Les bactéries anaérobies et les streptocoques sécrètent des enzymes protéolytiques ; les polynucléaires neutrophiles libèrent les leurs en mourant. Le tissu se liquéfie au centre du foyer. La nécrose apparaît là où l’apport sanguin est le plus faible. Elle forme une cavité de plus de 2 cm remplie de pus.</p>
<h3>3.4 Troisième charnière : l’ouverture dans une bronche</h3>
<p>Lorsque l’abcès s’ouvre dans une bronche, le pus est expectoré et de l’air entre dans la cavité. L’air surmonte le liquide restant et dessine le <b>niveau hydroaérique</b> sur la radiographie debout. Le patient expectore un pus fétide, parfois en grande quantité d’un coup : c’est la <button class="w" data-k="j85-vomique">vomique (expectoration brutale du contenu d’un abcès)</button>. Ce drainage naturel explique pourquoi la plupart des abcès guérissent sans drain. Il explique aussi le risque d’inondation des autres bronches.</p>
<h3>3.5 Quatrième charnière : la paroi et la chronicité</h3>
<p>Autour de la cavité, l’organisme forme un tissu de granulation puis une coque fibreuse. Cette paroi limite l’infection, mais elle gêne la diffusion de l’antibiotique et empêche la cavité de se refermer. Un abcès de plus de 6 cm répond moins bien à l’antibiotique seul (revue de Hadid, Journal of Thoracic Disease, 2024, texte intégral lu). Le pus est acide et pauvre en oxygène. Les aminosides, dont l’action exige un transport actif dépendant de l’oxygène, y sont peu efficaces.</p>
<h3>3.6 La gangrène pulmonaire</h3>
<p>Dans la <button class="w" data-k="j85-gangrene">gangrène pulmonaire</button>, l’infection est si virulente qu’elle thrombose les artères pulmonaires et bronchiques du territoire. Le tissu meurt par ischémie, avant même d’être liquéfié par les enzymes. Un fragment de poumon mort se détache et flotte dans une cavité. L’antibiotique n’atteint pas un tissu sans circulation, ce qui explique le recours fréquent à la résection chirurgicale.</p>
<h3>3.7 L’atteinte pleurale</h3>
<p>La plèvre s’infecte surtout par contiguïté avec une pneumonie, mais un tiers des infections pleurales surviennent sans pneumonie visible (Pearce, 2025). L’inflammation rend la plèvre perméable ; les bactéries envahissent le liquide. Les neutrophiles consomment le glucose et produisent de l’acide lactique et du dioxyde de carbone : le pH baisse et le glucose s’effondre. Le dépôt de fibrine crée des cloisons, car l’inhibiteur 1 des activateurs du plasminogène (PAI-1) bloque sa dégradation. L’ADN libéré par les neutrophiles morts, notamment sous forme de pièges extracellulaires (NET), rend le pus visqueux. Ces deux phénomènes, fibrine et ADN, sont la cible de l’association intrapleurale d’altéplase et de dornase alfa. Sans drainage, les fibroblastes forment une couenne qui enserre le poumon. Ce passage du liquide libre au pus cloisonné, puis à la couenne, correspond aux <button class="w" data-k="j90-stades">trois stades de l’infection pleurale</button>.</p>
<h3>3.8 Le médiastin</h3>
<p>Les espaces rétropharyngé, prétrachéal et périvasculaire du cou se prolongent sans barrière jusqu’au médiastin. La pression intrathoracique négative et la gravité favorisent la descente du pus. L’espace rétropharyngé serait la voie d’environ 70 % des médiastinites descendantes (Chaulk, 2025). Une perforation de l’œsophage verse directement salive, acide et bactéries dans le médiastin, puis dans la plèvre gauche.</p>

<button class="pareto-btn ui" data-k="pareto-j85-clin">▲ Loi de Pareto — Définitions, épidémiologie et mécanismes</button>
<div class="key"><b>À retenir.</b> La cavité naît d’une inhalation massive dans un segment déclive, puis d’une nécrose liquéfiante. L’air dans la cavité prouve son ouverture bronchique. La plèvre infectée devient acide, cloisonnée puis fibreuse. Ces mécanismes orientent la recherche des causes et des terrains, détaillés dans l’îlot suivant.</div>
</section>

<section class="ilot" id="j85-4"><h2><span class="n">4</span>Étiologies, terrains et germes</h2>
<p>Le médecin recherche toujours le mécanisme d’entrée des germes. Il en déduit les germes probables et donc l’antibiotique empirique. Le tableau suivant relie chaque mécanisme à ses terrains et à ses germes typiques.</p>
<table class="t"><tr><th>Mécanisme</th><th>Terrains typiques</th><th>Germes habituels</th></tr>
<tr><td>Inhalation</td><td>Alcool, sédatifs, épilepsie, accident vasculaire cérébral, troubles de la déglutition, mauvaise hygiène dentaire</td><td>Anaérobies de la bouche, streptocoques du groupe <i>anginosus</i>, flore polymicrobienne</td></tr>
<tr><td>Pneumonie nécrosante</td><td>Grippe récente, diabète, sujet jeune sans terrain (staphylocoque)</td><td><i>S. aureus</i> producteur de leucocidine de Panton et Valentine, <i>K. pneumoniae</i>, <i>S. pyogenes</i>, pneumocoque</td></tr>
<tr><td>Voie sanguine</td><td>Usage de drogues par voie intraveineuse, cathéter, angine récente</td><td><i>S. aureus</i> ; <i>Fusobacterium necrophorum</i> dans le syndrome de Lemierre</td></tr>
<tr><td>Obstruction bronchique</td><td>Fumeur de plus de 45 ans, corps étranger chez l’enfant</td><td>Flore mixte en aval d’un cancer ou d’un corps étranger</td></tr>
<tr><td>Contiguïté</td><td>Abcès sous-phrénique, abcès hépatique, perforation œsophagienne</td><td>Entérobactéries, anaérobies digestifs, <i>Candida</i></td></tr>
<tr><td>Infection nosocomiale ou postopératoire</td><td>Chirurgie thoracique, ventilation mécanique, drain pleural</td><td><i>S. aureus</i> dont SARM, entérobactéries, <i>Pseudomonas</i>, entérocoques</td></tr>
<tr><td>Immunodépression</td><td>Neutropénie, greffe, virus de l’immunodéficience humaine (VIH) avancé</td><td><i>Nocardia</i>, champignons, mycobactéries, <i>Rhodococcus</i></td></tr></table>
<p>La colonne du mécanisme se lit en premier, car elle commande la couverture antibiotique. L’erreur fréquente est d’oublier l’obstruction bronchique : chez un fumeur de 60 ans dont l’abcès ne répond pas, un cancer bronchique doit être cherché par bronchoscopie. Dans la cohorte danoise, cinq patients n’avaient aucune régression après huit semaines d’antibiotique ; trois avaient un cancer (Kirkegaard Vaarst, 2025).</p>
<h3>4.1 Le terrain de l’inhalation</h3>
<p>Les antécédents qui favorisent l’abcès d’inhalation ont un point commun : ils associent un inoculum dense et une protection des voies aériennes défaillante. L’<button class="w" data-k="j85-a-alcool">alcoolisme (premier terrain de l’abcès pulmonaire)</button> cumule les deux. Les <button class="w" data-k="j85-a-dents">infections dentaires et parodontales (réservoir d’anaérobies)</button> augmentent la densité bactérienne de la salive. Les <button class="w" data-k="j85-a-dysph">troubles de la déglutition (accident vasculaire cérébral, maladie de Parkinson, démence)</button> font passer le liquide dans la trachée. Un sujet édenté a moins d’anaérobies buccaux : un abcès fétide chez un édenté doit faire chercher une obstruction bronchique.</p>
<h3>4.2 Les germes de l’infection pleurale</h3>
<p>La microbiologie de la plèvre diffère de celle de la pneumonie. Les germes de pneumonie atypique y sont presque absents. Dans une sous-analyse moléculaire de l’essai MIST1, les streptocoques dominaient l’infection communautaire (52 %), tandis que <i>S. aureus</i> et les entérocoques dominaient l’infection nosocomiale ; 25 % des staphylocoques nosocomiaux étaient résistants à la méticilline (Pearce, 2025). Les cultures conventionnelles du liquide pleural ne sont positives que dans 58 % des cas. L’<button class="w" data-k="j85-anginosus">infection à streptocoques du groupe anginosus (milleri)</button> forme volontiers des abcès et des empyèmes cloisonnés.</p>
<div class="key"><b>À retenir.</b> Le terrain désigne le mécanisme, et le mécanisme désigne les germes. L’inhalation impose de couvrir les anaérobies ; la voie sanguine fait penser au staphylocoque ; le contexte nosocomial impose de couvrir le SARM et les bacilles à Gram négatif. Ces terrains se recherchent par une anamnèse ciblée.</div>
</section>

<section class="ilot" id="j85-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse établit trois faits : le mécanisme d’entrée, la durée d’évolution et l’existence d’un signe de gravité. Une évolution de plusieurs semaines avec amaigrissement oriente vers un abcès d’inhalation ou un empyème ancien, mais aussi vers un cancer ou une tuberculose.</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin interroge sur la consommation d’<button class="w" data-k="j85-a-alcool">alcool</button> et de sédatifs, sur un épisode de perte de connaissance ou de vomissements, sur l’<button class="w" data-k="j85-a-dents">état dentaire</button> et les soins dentaires récents, et sur une <button class="w" data-k="j85-a-dysph">dysphagie</button>. Il recherche un <button class="w" data-k="j85-a-iv">usage de drogues par voie intraveineuse (embolies septiques)</button> et une angine récente, qui évoque un <button class="w" data-k="j85-lemierre">syndrome de Lemierre (thrombophlébite jugulaire septique)</button>. Il demande s’il y a eu une <button class="w" data-k="j85-a-chir">chirurgie thoracique ou œsophagienne, une endoscopie ou un drain pleural récents</button>. Il précise enfin les causes d’<button class="w" data-k="j85-a-immuno">immunodépression (diabète, corticoïdes, chimiothérapie, VIH)</button> et le tabagisme, qui oriente vers une obstruction tumorale.</p>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<p>Les symptômes sont présentés du plus fréquent au plus spécifique. Aucun n’est constant, et leur absence n’exclut pas une suppuration.</p>
<table class="t"><tr><th>Symptôme</th><th>Mécanisme</th><th>Valeur</th></tr>
<tr><td>Fièvre et frissons</td><td>Libération de cytokines pyrogènes par le foyer</td><td>Fréquente ; peut manquer chez le sujet âgé</td></tr>
<tr><td>Toux productive</td><td>Drainage du pus par la bronche ouverte</td><td>Fréquente dans l’abcès ; plus rare dans l’empyème isolé</td></tr>
<tr><td><button class="w" data-k="j85-s-crachats">Crachats purulents fétides</button></td><td>Acides gras volatils et composés soufrés produits par les anaérobies</td><td>Évocateurs d’anaérobies ; présents dans une minorité de cas</td></tr>
<tr><td>Amaigrissement et sueurs nocturnes</td><td>Catabolisme d’une infection prolongée</td><td>Évolution de plusieurs semaines ; diagnostic différentiel avec cancer et tuberculose</td></tr>
<tr><td><button class="w" data-k="j85-s-pleur">Douleur thoracique pleurale</button></td><td>Inflammation de la plèvre pariétale innervée</td><td>Évoque une atteinte pleurale</td></tr>
<tr><td><button class="w" data-k="j85-s-hemopt">Hémoptysie</button></td><td>Érosion d’un vaisseau de la paroi de la cavité</td><td>Rare mais potentiellement mortelle</td></tr>
<tr><td>Douleur cervicale, dysphagie, trismus</td><td>Infection des espaces du cou</td><td>Évoque une médiastinite descendante</td></tr></table>
<p>La ligne des crachats fétides se lit avec prudence. Leur présence oriente vers les anaérobies, mais leur absence ne les exclut pas. Exemple : une femme de 72 ans en institution, apathique et subfébrile, sans crachats, peut avoir un empyème à anaérobies ; seule l’imagerie le montrera.</p>
<h3>5.3 Formes typiques et atypiques</h3>
<p>Une revue de 2025 décrit deux phénotypes de l’infection pleurale (Pearce, 2025). Les cartes suivantes les opposent, avec deux formes particulières.</p>
<div class="two">
<div class="card"><h4>Forme aiguë du sujet jeune</h4><p>Le patient a peu de comorbidités. Il présente une fièvre élevée, une douleur pleurale, une dyspnée et une toux. Une pneumonie qui ne s’améliore pas après 48 à 72 heures d’antibiotique fait chercher un épanchement infecté.</p></div>
<div class="card"><h4>Forme insidieuse du sujet fragile</h4><p>Le patient âgé, polymorbide ou immunodéprimé présente une anorexie, un malaise et un amaigrissement sur plusieurs semaines. Le diagnostic est souvent retardé, car d’autres causes sont explorées en premier.</p></div>
<div class="card"><h4>Abcès d’inhalation subaigu</h4><p>Le tableau dure deux à six semaines : toux, crachats fétides, fièvre modérée, amaigrissement. Il ressemble à une tuberculose ou à un cancer, ce qui impose les examens de l’îlot 7.</p></div>
<div class="card"><h4>Forme décapitée</h4><p>Un antibiotique oral pris pour une « bronchite » atténue la fièvre sans évacuer le pus. La collection persiste et se cloisonne. Une fièvre qui reprend à l’arrêt de l’antibiotique évoque cette forme.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse cherche le mécanisme (inhalation, voie sanguine, chirurgie, perforation), la durée et les signes de gravité. Une pneumonie qui ne guérit pas doit faire chercher une collection. L’examen clinique, détaillé ensuite, oriente vers le siège de cette collection.</div>
</section>

<section class="ilot" id="j85-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen évalue d’abord la gravité, puis cherche les signes du siège de la suppuration et de sa cause. Le médecin compare chaque constatation avec ce qu’il attend chez un sujet sain.</p>
<h3>6.1 État général et signes vitaux</h3>
<p>Chez l’adulte sain au repos, la fréquence respiratoire est de 12 à 20 par minute, la saturation pulsée en oxygène (SpO₂) de 95 % ou plus à l’air ambiant, et la pression artérielle systolique supérieure à 100 mmHg. Une fréquence respiratoire d’au moins 22 par minute, une confusion ou une pression systolique d’au plus 100 mmHg forment le score qSOFA ; deux éléments font suspecter un sepsis, qui se confirme par le score SOFA (définitions Sepsis-3). Une hypotension malgré le remplissage signe un choc septique et impose un contrôle de la source sans délai.</p>
<h3>6.2 Anthropométrie et état nutritionnel</h3>
<p>Le médecin pèse le patient et calcule la perte de poids. La dénutrition est fréquente dans les suppurations prolongées. Elle aggrave le pronostic : une albumine sérique inférieure à 27 g/L ajoute un point au <button class="w" data-k="j90-rapid">score RAPID (risque de décès de l’infection pleurale)</button>.</p>
<h3>6.3 Signes ciblés</h3>
<p>Les signes suivants sont présentés en deux colonnes : à gauche ceux qui orientent vers le siège de la suppuration, à droite ceux qui orientent vers sa cause ou vers une complication.</p>
<div class="two">
<div class="card"><h4>Siège de la suppuration</h4><p>Le murmure vésiculaire normal est doux, entendu sur tout le champ pulmonaire. Une condensation donne des crépitants et un souffle tubaire. Une grande cavité ouverte dans une bronche peut donner un <button class="w" data-k="j85-x-cavite">souffle caverneux ou amphorique</button>. Un épanchement donne une matité déclive, une diminution des vibrations vocales et du murmure vésiculaire. Une <button class="w" data-k="j85-x-paroi">tuméfaction fluctuante de la paroi thoracique</button> évoque un empyème de nécessité.</p></div>
<div class="card"><h4>Cause et complications</h4><p>L’<button class="w" data-k="j85-x-dents">examen de la bouche (haleine fétide, caries, gingivite)</button> cherche le réservoir d’anaérobies. Un souffle cardiaque nouveau et des points d’injection orientent vers une endocardite tricuspidienne. Une <button class="w" data-k="j85-x-cou">tuméfaction cervicale douloureuse, un trismus ou une crépitation sous-cutanée</button> annoncent une médiastinite. Un <button class="w" data-k="j85-x-hippo">hippocratisme digital</button> d’apparition récente évoque une suppuration chronique ou un cancer.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un examen pulmonaire presque normal n’exclut pas un abcès profond. Une cavité centrale entourée de poumon aéré ne modifie ni la percussion ni l’auscultation. L’imagerie est indispensable dès que l’anamnèse évoque une suppuration.</div>
<div class="key"><b>À retenir.</b> L’examen mesure d’abord la gravité par les signes vitaux et l’état nutritionnel. Il cherche ensuite un épanchement, une cavité, un foyer dentaire, cervical ou cardiaque. Il oriente l’imagerie, qui établit le diagnostic selon la démarche décrite ensuite.</div>
<button class="pareto-btn ui" data-k="pareto-j85-sem">▲ Loi de Pareto — Étiologies, anamnèse et examen</button>
</section>

<section class="ilot" id="j85-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche répond à quatre questions successives. Y a-t-il une collection ? Où siège-t-elle ? Quel germe la cause ? Existe-t-il une cause sous-jacente, en particulier un cancer ? L’algorithme de la figure 2 les ordonne.</p>
<h3>7.1 Imagerie : montrer et localiser la collection</h3>
<p>La radiographie thoracique de face et de profil est le premier examen. Elle montre une cavité avec niveau hydroaérique ou une opacité pleurale. Environ 10 % des épanchements parapneumoniques significatifs échappent à la radiographie, surtout derrière une pneumonie basale (Pearce, 2025). L’échographie thoracique est plus sensible pour l’épanchement et guide la ponction. La <button class="w" data-k="j85-tdm">tomodensitométrie injectée (distinction entre abcès et empyème)</button> est l’examen de référence pour localiser la collection, chercher des cloisons, une fistule ou une obstruction bronchique. La déclaration ERS/ESTS 2023 et la revue de Pearce la recommandent chez tout patient dont la fièvre persiste après 48 heures de drainage et de traitement optimal.</p>
<h3>7.2 Ponction : prouver le pyothorax</h3>
<p>Une collection pleurale accessible est ponctionnée sous échographie. L’aspiration de pus affirme l’empyème : le médecin pose alors un drain sans attendre la biochimie. Un liquide non purulent est analysé selon le <button class="w" data-k="j90-ph">pH du liquide pleural (seuil de drainage ≤ 7,2)</button>, le glucose et la lactate déshydrogénase (LDH). La technique de la ponction et l’interprétation complète du liquide sont traitées dans le cours J90.</p>
<h3>7.3 Microbiologie : identifier le germe</h3>
<p>Le médecin prélève deux paires d’hémocultures avant l’antibiotique. Il ensemence le liquide pleural à la fois dans un tube stérile et dans des <button class="w" data-k="j85-hemoc">flacons d’hémoculture (rendement augmenté jusqu’à 20 %)</button>. L’expectoration a une valeur limitée, car elle est contaminée par la flore buccale et ne cultive pas les anaérobies stricts. Le lavage bronchoalvéolaire et la ponction transthoracique d’un abcès ont un meilleur rendement. Dans la cohorte danoise, la culture était positive dans 35 % des lavages, 40 % des biopsies, 20 % des expectorations et 8 % des hémocultures (Kirkegaard Vaarst, 2025).</p>
<h3>7.4 Bronchoscopie : chercher la cause</h3>
<p>La <button class="w" data-k="j85-fibro">bronchoscopie (recherche d’une obstruction, prélèvements)</button> n’est pas systématique dans l’abcès d’inhalation typique. Elle est indiquée lorsque l’abcès survient chez un fumeur de plus de 45 ans, chez un édenté, sans terrain d’inhalation, lorsqu’il ne régresse pas, ou lorsqu’un corps étranger est possible.</p>

<p>L’algorithme se lit de haut en bas. La tomodensitométrie oriente vers l’une des trois colonnes ; chaque colonne a ses prélèvements propres. L’erreur fréquente est de rester dans la colonne de gauche alors que la collection est pleurale : un antibiotique prolongé ne guérit pas un empyème non drainé.</p>
<h3>7.5 Diagnostic différentiel des lésions cavitaires</h3>
<p>Une cavité n’est pas toujours un abcès. Le tableau suivant classe les <button class="w" data-k="j85-diffcav">principales lésions cavitaires</button> selon leur gravité et le fait qui les distingue.</p>
<table class="t"><tr><th>Diagnostic</th><th>Arguments</th><th>Examen discriminant</th></tr>
<tr><td>Tuberculose cavitaire</td><td>Lobe supérieur, origine d’une zone d’endémie, contage, évolution lente</td><td>Examen direct, amplification génique et culture de mycobactéries ; isolement respiratoire jusqu’au résultat</td></tr>
<tr><td>Carcinome bronchique excavé</td><td>Fumeur, paroi épaisse et irrégulière (souvent plus de 15 mm), absence de régression</td><td>Bronchoscopie, biopsie</td></tr>
<tr><td>Embolies septiques</td><td>Nodules multiples périphériques excavés, toxicomanie, cathéter, angine</td><td>Hémocultures, échocardiographie, échographie des veines jugulaires</td></tr>
<tr><td>Aspergillose ou autre mycose</td><td>Immunodépression, signe du halo, cavité préexistante</td><td>Galactomannane, lavage, biopsie</td></tr>
<tr><td>Granulomatose avec polyangéite</td><td>Nodules excavés multiples, atteinte rénale ou sinusienne</td><td>Anticorps anticytoplasme des neutrophiles, biopsie</td></tr>
<tr><td>Infarctus pulmonaire excavé</td><td>Contexte d’embolie pulmonaire</td><td>Angiographie par tomodensitométrie</td></tr>
<tr><td>Bulle ou kyste infectés, séquestration</td><td>Paroi fine, lésion connue ; sujet jeune pour la séquestration</td><td>Tomodensitométrie antérieure, angiographie (artère systémique)</td></tr>
<tr><td>Kyste hydatique</td><td>Origine d’une zone d’endémie, membrane flottante</td><td>Sérologie, imagerie</td></tr></table>
<p>La tuberculose figure en premier, car elle impose un isolement et une déclaration. Isoler un patient porteur d’un abcès jusqu’aux résultats a peu d’inconvénients ; ne pas isoler une tuberculose expose l’entourage à la contamination. L’erreur fréquente est de conclure à l’abcès devant toute cavité fébrile chez un fumeur. Exemple : un fumeur de 66 ans avec une cavité à paroi de 20 mm, sans terrain d’inhalation ni crachats fétides, doit avoir une bronchoscopie dès le début.</p>
<div class="quiz ui"><p>Un homme de 61 ans, fumeur, édenté depuis dix ans, présente une cavité de 5 cm du lobe supérieur droit avec niveau hydroaérique. Il n’a aucun antécédent d’inhalation. Quel examen est prioritaire après les hémocultures et les recherches de mycobactéries ?</p><button data-ok="1">Une bronchoscopie pour chercher une obstruction tumorale</button><button data-ok="0">Aucun examen : un traitement par co-amoxicilline suffit</button><button data-ok="0">Une échographie thoracique</button><p class="fb" hidden>Un édenté a peu d’anaérobies buccaux, et ce patient n’a pas de terrain d’inhalation. Ces deux faits rendent l’abcès primaire peu probable. Chez un fumeur de plus de 45 ans, une obstruction par un carcinome est la première cause d’abcès secondaire ; la bronchoscopie la cherche et permet des prélèvements.</p></div>
<div class="key"><b>À retenir.</b> La tomodensitométrie localise la collection ; la ponction prouve le pyothorax ; les hémocultures, le liquide pleural et le lavage identifient le germe ; la bronchoscopie cherche une cause. Une cavité qui ne régresse pas est un cancer ou une tuberculose jusqu’à preuve du contraire. Les situations qui menacent la vie sont décrites ensuite.</div>
</section>
