
<!-- ===== FENÊTRES : examens, urgences et gestes ===== -->
<template data-pop="j85-tdm" data-title="Tomodensitométrie : abcès ou empyème">
<div class="lab">Technique</div><p>Coupes thoraciques après injection de produit de contraste iodé au temps veineux, pour que la plèvre inflammatoire se rehausse.</p>
<div class="lab">Abcès pulmonaire</div><p>Cavité ronde dans le parenchyme, paroi épaisse et irrégulière, angle aigu avec la paroi thoracique, vaisseaux et bronches qui s’arrêtent au bord de la cavité. Le niveau a la même longueur dans toutes les directions.</p>
<div class="lab">Empyème</div><p>Collection lenticulaire qui suit la paroi, angle obtus, poumon refoulé et comprimé, feuillets pariétal et viscéral rehaussés et séparés par le liquide : c’est le signe de la plèvre dédoublée. Microbulles, cloisons et densification de la graisse extrapleurale renforcent le diagnostic.</p>
<div class="lab">Autres apports</div><p>Recherche d’une obstruction bronchique, d’une fistule, d’un séquestre, d’une extension médiastinale ; vérification de la position du drain.</p>
<div class="lab">Erreur fréquente</div><p>Prendre un empyème avec niveau hydroaérique pour un abcès sous-pleural, et ne pas drainer.</p></template>

<template data-pop="j85-echo" data-title="Échographie thoracique dans l’infection pleurale">
<div class="lab">Technique</div><p>Sonde posée dans les espaces intercostaux, patient assis ; elle se fait au lit du malade.</p>
<div class="lab">Normal</div><p>La ligne pleurale glisse avec la respiration ; le cul-de-sac costodiaphragmatique ne contient pas de liquide visible.</p>
<div class="lab">Pathologique</div><p>Liquide anéchogène ou échogène, cloisons, logettes, épaississement pleural.</p>
<div class="lab">Valeur</div><p>Sensibilité de 94,5 % et spécificité de 97,9 % pour l’épanchement (Pearce, 2025). Elle repère le meilleur site de ponction et réduit les complications.</p>
<div class="lab">Limites</div><p>Elle ne prouve ni n’exclut l’infection sans ponction ; la présence de cloisons ne prédit pas l’évolution.</p></template>

<template data-pop="j85-hemoc" data-title="Liquide pleural en flacons d’hémoculture">
<div class="lab">Technique</div><p>Le médecin injecte une partie du liquide pleural dans un flacon aérobie et un flacon anaérobie d’hémoculture, en plus du tube stérile envoyé au laboratoire.</p>
<div class="lab">Pourquoi</div><p>Le flacon protège les anaérobies de l’oxygène et contient un milieu enrichi ; il dilue aussi l’antibiotique déjà présent.</p>
<div class="lab">Valeur</div><p>Cette double technique augmente le rendement jusqu’à 20 % et est adoptée par les recommandations (Pearce, 2025).</p>
<div class="lab">Piège</div><p>Le volume à injecter par flacon dépend du fabricant ; le laboratoire local le précise.</p></template>

<template data-pop="j85-16s" data-title="Séquençage de l’ARN ribosomique 16S">
<div class="lab">Principe</div><p>Toutes les bactéries possèdent le gène de l’ARN ribosomique 16S. Une amplification par réaction de polymérisation en chaîne (PCR) puis un séquençage identifient les bactéries présentes, même mortes.</p>
<div class="lab">Valeur</div><p>Il identifie un germe dans des liquides stériles en culture, notamment après antibiotique : 16 % de diagnostics supplémentaires dans les échantillons de MIST1.</p>
<div class="lab">Limites</div><p>Il ne donne pas d’antibiogramme. Dans un échantillon polymicrobien, il est difficile de savoir quel germe compte. Il n’est pas disponible en urgence partout.</p></template>

<template data-pop="j85-amylase" data-title="Amylase du liquide pleural">
<div class="lab">Normal</div><p>Le liquide pleural contient peu d’amylase, à un taux proche de celui du sang.</p>
<div class="lab">Augmentation</div><p>Rupture de l’œsophage (amylase salivaire), pancréatite ou pseudokyste pancréatique (amylase pancréatique), certains cancers (amylase salivaire).</p>
<div class="lab">Conséquence pratique</div><p>Un empyème gauche, très acide, riche en amylase, après des vomissements, impose une opacification de l’œsophage en urgence.</p></template>

<template data-pop="j85-fibro" data-title="Bronchoscopie dans les suppurations">
<div class="lab">Indications</div><p>Abcès chez un fumeur de plus de 45 ans, chez un édenté ou sans terrain d’inhalation ; absence de régression ; suspicion de corps étranger ; hémoptysie ; immunodépression nécessitant un lavage.</p>
<div class="lab">Apports</div><p>Vue directe d’une tumeur ou d’un corps étranger, biopsies, lavage bronchoalvéolaire pour les bactéries, les mycobactéries et les champignons, drainage endoscopique de certains abcès.</p>
<div class="lab">Risque</div><p>Aspirer un grand abcès peut faire couler le pus dans les autres bronches ; le geste se fait avec un aspirateur puissant et, si besoin, sous protection des voies aériennes.</p></template>

<template data-pop="j85-oeso" data-title="Opacification de l’œsophage">
<div class="lab">Technique</div><p>Tomodensitométrie après ingestion d’un produit de contraste hydrosoluble, ou transit œsophagien par le même produit.</p>
<div class="lab">Pourquoi un produit hydrosoluble</div><p>La baryte qui fuit dans le médiastin entretient une inflammation ; le produit hydrosoluble est utilisé en premier.</p>
<div class="lab">Signes</div><p>Fuite de produit de contraste, air et liquide autour de l’œsophage, épanchement pleural gauche.</p>
<div class="lab">Conséquence pratique</div><p>Une fuite démontrée impose jeûne, antibiotique, drainage et avis chirurgical ou endoscopique.</p></template>

<template data-pop="j85-diffcav" data-title="Lésions cavitaires du poumon">
<div class="lab">Démarche</div><p>Le médecin considère toute cavité comme une tuberculose possible jusqu’au résultat des recherches de mycobactéries, et comme un cancer possible chez le fumeur jusqu’à la régression.</p>
<div class="lab">Paroi</div><p>Une paroi très épaisse et irrégulière oriente vers un cancer ; une paroi fine vers une bulle ou un kyste. Ce critère est indicatif et ne remplace pas la biopsie.</p>
<div class="lab">Nombre</div><p>Une cavité unique oriente vers un abcès ou un cancer ; des cavités multiples vers des embolies septiques, une granulomatose avec polyangéite, une pneumonie nécrosante ou des métastases.</p>
<div class="lab">Contexte</div><p>Terrain d’inhalation : abcès. Origine d’une zone d’endémie et lobe supérieur : tuberculose. Immunodépression : champignons, <i>Nocardia</i>.</p></template>

<template data-pop="j85-inond" data-title="Inondation bronchique">
<div class="lab">Définition</div><p>Passage brutal du contenu d’un abcès ou d’un empyème fistulisé dans les bronches du poumon sain.</p>
<div class="lab">Signes</div><p>Vomique abondante, toux incoercible, chute de la saturation, détresse respiratoire.</p>
<div class="lab">Conduite</div><p>Coucher le patient sur le côté malade, aspirer, oxygéner, appeler les soins intensifs ; l’intubation sélective du poumon sain peut être nécessaire.</p>
<div class="lab">Prévention</div><p>Les gestes de drainage d’un grand abcès se font dans un environnement capable de protéger les voies aériennes.</p></template>

<template data-pop="j85-fbp" data-title="Fistule bronchopleurale">
<div class="lab">Définition</div><p>Communication entre une bronche et la cavité pleurale.</p>
<div class="lab">Causes</div><p>Lâchage du moignon bronchique après résection pulmonaire, surtout pneumonectomie droite ; rupture d’un abcès ou d’une pneumonie nécrosante ; tuberculose.</p>
<div class="lab">Fréquence après chirurgie</div><p>0,8 à 12,5 % après pneumonectomie ; 0,44 à 4,0 % après lobectomie (Kononets, 2026). Facteurs de risque : diabète, BPCO, traitement néoadjuvant, chirurgie antérieure, ventilation prolongée.</p>
<div class="lab">Signes</div><p>Fuite d’air persistante dans le drain ; expectoration abondante de liquide ; après pneumonectomie, baisse du niveau liquide de la cavité opérée ou nouveau niveau.</p>
<div class="lab">Traitement</div><p>Drainage, antibiotique, patient couché sur le côté opéré ; fermeture par réfection du moignon, lambeau musculaire ou valve endobronchique ; fenêtre thoracique ouverte en cas d’échec.</p></template>

<template data-pop="j85-boerhaave" data-title="Rupture spontanée de l’œsophage (syndrome de Boerhaave)">
<div class="lab">Mécanisme</div><p>Une hausse brutale de la pression dans l’œsophage pendant des vomissements violents rompt toute l’épaisseur de la paroi, dans environ 90 % des cas sur le bord gauche de l’œsophage distal.</p>
<div class="lab">Tableau</div><p>Triade de Mackler : vomissements, douleur thoracique, emphysème sous-cutané cervical. Elle est souvent incomplète, et la douleur fait évoquer un infarctus ou une dissection.</p>
<div class="lab">Liquide pleural</div><p>Épanchement gauche très acide, riche en amylase, parfois avec des débris alimentaires.</p>
<div class="lab">Pronostic</div><p>Mortalité jusqu’à 40 % ; environ 6 % lorsque le diagnostic est posé dans les 24 heures (Predescu, 2025).</p>
<div class="lab">Codage</div><p>L’empyème qui en résulte relève de J86.04 (fistule œsopleurale).</p></template>

<template data-pop="j85-dnm" data-title="Médiastinite nécrosante descendante">
<div class="lab">Définition</div><p>Infection nécrosante du médiastin qui provient d’une infection dentaire ou cervicale et descend par les espaces du cou.</p>
<div class="lab">Origine</div><p>Abcès de la deuxième ou troisième molaire inférieure, angine de Ludwig, abcès péri-amygdalien ou rétropharyngé.</p>
<div class="lab">Terrain</div><p>Diabète, obésité, alcool et tabac, radiothérapie cervicale, artériopathie.</p>
<div class="lab">Traitement</div><p>Protection des voies aériennes, antibiotique à large spectre couvrant les anaérobies, drainage chirurgical cervical et thoracique selon l’extension ; reprises fréquentes.</p>
<div class="lab">Pronostic</div><p>Mortalité de 85 % sans chirurgie dans la série historique de Pearse ; 11 à 50 % dans les séries modernes (Chaulk, 2025).</p></template>

<template data-pop="j85-estrera" data-title="Critères d’Estrera (1983)">
<div class="lab">Énoncé</div><p>Les quatre critères sont nécessaires : 1) manifestations cliniques d’une infection cervicale sévère ; 2) aspect radiologique caractéristique de médiastinite ; 3) infection nécrosante du médiastin documentée en chirurgie ou à l’autopsie ; 4) lien établi entre l’infection oropharyngée et l’atteinte médiastinale. Wheatley les a précisés en 1990.</p>
<div class="lab">Usage</div><p>Ils définissent l’entité dans les séries publiées. En pratique, la tomodensitométrie du cou et du thorax suffit à décider du drainage, sans attendre le troisième critère.</p></template>

<template data-pop="j85-endo" data-title="Classification d’Endo">
<div class="lab">Énoncé</div><p>Type I : infection limitée au médiastin situé au-dessus de la carène. Type IIa : extension au médiastin antérieur sous la carène. Type IIb : extension aux médiastins antérieur et postérieur sous la carène. Un sous-type limité au médiastin postérieur inférieur a été décrit en 2021 (Sugio).</p>
<div class="lab">Usage</div><p>Le type I peut être drainé par voie cervicale ; le type II demande en général un abord thoracique, par thoracotomie ou par VATS.</p></template>

<template data-pop="j85-necessitatis" data-title="Empyème de nécessité">
<div class="lab">Définition</div><p>Empyème qui traverse la paroi thoracique et forme une collection sous-cutanée, puis parfois une fistule pleurocutanée.</p>
<div class="lab">Causes</div><p>Tuberculose et actinomycose classiquement ; anaérobies et staphylocoque plus rarement.</p>
<div class="lab">Codage</div><p>J86.02, sauf origine tuberculeuse (A15-A16).</p>
<div class="lab">Conduite</div><p>Tomodensitométrie, ponction ou biopsie avec recherche de mycobactéries et d’<i>Actinomyces</i>, drainage et antibiotique prolongé.</p></template>

<template data-pop="j85-duree" data-title="Durée de l’antibiothérapie">
<div class="lab">Abcès pulmonaire</div><p>Aucun essai n’a fixé la durée. Les pratiques vont de trois à huit semaines. Dans la cohorte danoise : voie intraveineuse 14 jours, puis voie orale 26 jours (médianes). Le traitement se poursuit jusqu’à la disparition de la cavité ou une petite cicatrice stable.</p>
<div class="lab">Pyothorax</div><p>Habituellement deux à six semaines selon l’évolution, surtout sur avis d’experts. Un petit essai randomisé (50 patients stables, score RAPID de 4 ou moins) n’a pas montré plus d’échecs avec 14 à 21 jours qu’avec 28 à 42 jours.</p>
<div class="lab">Critères de relais oral</div><p>Apyrexie, amélioration clinique, alimentation possible, marqueurs inflammatoires en baisse, collection drainée.</p>
<div class="lab">Piège</div><p>Prolonger l’antibiotique ne remplace pas le drainage d’une collection persistante.</p></template>

<template data-pop="j85-drain" data-title="Drain pleural de petit calibre">
<div class="lab">Technique</div><p>Drain de 14 French ou moins, posé par la technique de Seldinger sous guidage échographique ou tomodensitométrique, dans la plus grande poche de liquide.</p>
<div class="lab">Preuves</div><p>La taille ne modifie ni la mortalité ni le recours à un second geste ; un drain plus gros est plus douloureux (déclaration ERS/ESTS 2023).</p>
<div class="lab">Entretien</div><p>Rinçage par 20 mL de sérum physiologique toutes les six heures pour éviter l’obstruction.</p>
<div class="lab">Surveillance</div><p>Volume et aspect du liquide, fièvre, imagerie de contrôle. Un drain qui ne draine plus avec une collection persistante impose une décision : enzymes, second drain ou chirurgie.</p></template>

<template data-pop="j85-drain-abces" data-title="Drainage percutané ou endoscopique de l’abcès">
<div class="lab">Indications</div><p>Sepsis persistant ou aggravation après 7 à 14 jours d’antibiotique intraveineux, abcès de plus de 6 cm, patient trop fragile pour une chirurgie.</p>
<div class="lab">Voie percutanée</div><p>Cathéter posé sous tomodensitométrie ou échographie ; succès de 88,5 % dans une méta-analyse citée par Hadid (2024). Plus sûr pour un abcès sous-pleural adhérent à la paroi.</p>
<div class="lab">Voie endoscopique</div><p>Cathéter placé par bronchoscopie dans la cavité ; amélioration chez 90 % des 42 patients d’une série (Herth, cité par Hadid, 2024).</p>
<div class="lab">Complications</div><p>Pneumothorax, fistule bronchopleurale, empyème, hémorragie, inondation bronchique.</p></template>

<template data-pop="j85-chir-abces" data-title="Chirurgie de l’abcès et de la gangrène">
<div class="lab">Indications</div><p>Échec du traitement médical et du drainage, hémorragie non contrôlée, fistule bronchopleurale, empyème associé, cancer suspecté, gangrène pulmonaire.</p>
<div class="lab">Gestes</div><p>De la résection limitée à la lobectomie, voire à la pneumonectomie ; la lobectomie est la plus fréquente. Un lambeau musculaire peut renforcer le moignon bronchique.</p>
<div class="lab">Anesthésie</div><p>L’intubation sélective protège le poumon sain du pus pendant l’intervention.</p>
<div class="lab">Risque</div><p>Mortalité opératoire jusqu’à 11 % (Hadid, 2024), liée surtout au terrain et à la gravité.</p></template>

<template data-pop="j85-vats" data-title="Chirurgie thoracique vidéo-assistée (VATS)">
<div class="lab">Principe</div><p>Le chirurgien introduit une caméra et des instruments par une à trois petites incisions. Il débride la cavité pleurale, ouvre les logettes et retire la fibrine ou la couenne.</p>
<div class="lab">Avantages</div><p>Par rapport à la thoracotomie : hospitalisation plus courte, moins de douleur, moins de fuites d’air, reprise du travail plus rapide.</p>
<div class="lab">Limites</div><p>Une couenne ancienne et épaisse peut imposer une conversion en thoracotomie. Le patient doit supporter une ventilation sur un seul poumon.</p>
<div class="lab">Moment</div><p>Le délai entre l’admission et l’intervention est un facteur de risque de décès dans les séries chirurgicales ; l’avis du chirurgien est demandé tôt.</p></template>

<template data-pop="j85-owt" data-title="Fenêtre thoracique ouverte">
<div class="lab">Principe</div><p>Le chirurgien résèque un segment de côtes et ouvre largement la cavité pleurale infectée à la peau, pour la drainer et la nettoyer en continu.</p>
<div class="lab">Techniques</div><p>Lambeau d’Eloesser ; procédure de Clagett, qui associe une fenêtre puis une fermeture secondaire après stérilisation.</p>
<div class="lab">Indications</div><p>Empyème chronique, surtout après pneumonectomie ou avec fistule bronchopleurale, chez un patient qui ne supporte pas une décortication.</p>
<div class="lab">Suite</div><p>La fermeture définitive exige souvent un lambeau musculaire ou d’épiploon ; elle n’est pas toujours possible.</p></template>

<template data-pop="j85-mist1" data-title="Essai MIST1 (2005)">
<div class="lab">Question</div><p>La streptokinase intrapleurale améliore-t-elle le pronostic de l’infection pleurale ?</p>
<div class="lab">Méthode</div><p>Essai britannique en double aveugle : 454 patients, streptokinase 250 000 UI deux fois par jour pendant trois jours ou placebo.</p>
<div class="lab">Résultat</div><p>Décès ou chirurgie à trois mois : 31 % sous streptokinase contre 27 % sous placebo. Aucun bénéfice sur la mortalité, la chirurgie, la radiographie ou la durée d’hospitalisation. Effets indésirables graves : 7 % contre 3 %.</p>
<div class="lab">Conséquence</div><p>La streptokinase seule est abandonnée ; la définition de l’infection pleurale de cet essai sert de référence.</p></template>

<template data-pop="j85-mist2" data-title="Essai MIST2 (2011)">
<div class="lab">Question</div><p>L’altéplase, la dornase alfa ou leur association améliorent-elles le drainage ?</p>
<div class="lab">Méthode</div><p>Essai factoriel en aveugle : 210 patients répartis en quatre groupes (double placebo, altéplase seule, dornase seule, association), traitement de trois jours.</p>
<div class="lab">Résultats</div><p>Association : opacité pleurale −29,5 % contre −17,2 % sous placebo au septième jour ; chirurgie à trois mois 4 % contre 16 % ; hospitalisation réduite de 6,7 jours. Altéplase seule et dornase seule : aucun bénéfice ; dornase seule : 39 % de chirurgie.</p>
<div class="lab">Limites</div><p>Critère principal radiologique ; effectif modeste ; la mortalité n’était pas le critère principal.</p></template>

<template data-pop="j85-uk" data-title="Urokinase intrapleurale chez l’enfant">
<div class="lab">Schéma</div><p>Un an ou plus : 40 000 UI dans 40 mL de sérum physiologique ; moins d’un an : 10 000 UI dans 10 mL ; toutes les 12 heures pendant trois jours, soit six doses (essai de Thomson, 2002, repris par la British Thoracic Society).</p>
<div class="lab">Preuves</div><p>Hospitalisation plus courte que sous placebo (Thomson). Résultats comparables à la VATS d’emblée, pour un coût moindre (Sonnappa, 2006).</p>
<div class="lab">Disponibilité</div><p>La disponibilité d’une urokinase en Suisse n’a pas été vérifiée pour ce cours ; certains centres utilisent l’altéplase selon des protocoles pédiatriques.</p></template>
