
<!-- ===== FENÊTRES I77 : anamnèse, examen clinique et examens complémentaires ===== -->
<template data-pop="i77-dissection-cervicale" data-title="Dissection cervicale ou coronaire : chercher une dysplasie">
<div class="lab">Lien</div><p>Une dysplasie fibromusculaire est trouvée chez une partie des patients ayant une dissection carotidienne, vertébrale ou coronaire spontanée. La dysplasie fragilise la paroi ; la dissection en est une complication.</p>
<div class="lab">Conduite</div><p>Après une dissection spontanée, le médecin recherche une dysplasie dans les autres territoires par une imagerie de la tête au bassin, en général un angioscanner. Il cherche aussi des anévrismes intracrâniens, qui changent la surveillance.</p>
<div class="lab">Renvois</div><p>Traitement de la dissection cervicale et essais CADISS et TREAT-CAD : I71 — Anévrismes et dissections artérielles (C-01-Cardiologie). Dissection coronaire spontanée : I21 — Syndromes coronariens aigus et infarctus du myocarde (C-01-Cardiologie).</p>
<div class="lab">Codage</div><p>Dissection carotidienne I72.0, vertébrale I72.6, autre artère précérébrale I72.5, artère cérébrale intracrânienne I67.0. La dysplasie associée se code en plus, I77.3.</p></template>

<template data-pop="i77-acouphene" data-title="Acouphène pulsatile">
<div class="lab">Définition</div><p>Bruit perçu dans l’oreille, synchrone du pouls. Contrairement à l’acouphène continu, il traduit souvent un flux sanguin turbulent proche de l’oreille interne.</p>
<div class="lab">Causes à évoquer</div><p>Dysplasie ou dissection de la carotide interne, fistule artérioveineuse durale, hypertension intracrânienne idiopathique, tumeur du glomus jugulaire, et états à haut débit comme l’anémie ou l’hyperthyroïdie.</p>
<div class="lab">Technique d’examen</div><p>Le médecin ausculte le cou, la région mastoïdienne et l’orbite. Une compression douce de la veine jugulaire homolatérale qui supprime le bruit oriente vers une origine veineuse.</p>
<div class="lab">Conséquence pratique</div><p>Un acouphène pulsatile chez une femme hypertendue jeune impose une imagerie des artères cervicales. Chez un patient anémique, il peut disparaître avec la correction de l’anémie.</p></template>

<template data-pop="i77-epistaxis" data-title="Épistaxis de la télangiectasie hémorragique héréditaire">
<div class="lab">Caractère</div><p>Les épistaxis sont spontanées, récidivantes, souvent nocturnes, et proviennent de télangiectasies de la partie antérieure de la cloison et des cornets. Elles commencent souvent dans l’enfance et s’aggravent avec l’âge.</p>
<div class="lab">Mécanisme</div><p>La télangiectasie est une veinule dilatée exposée à la pression artérielle, avec une paroi pauvre en cellules de soutien. Le flux d’air dessèche la muqueuse, des croûtes se forment et arrachent la lésion.</p>
<div class="lab">Évaluation</div><p>La sévérité se mesure par le score de sévérité des épistaxis, qui tient compte de la fréquence, de la durée, de l’intensité, du recours aux soins, de l’anémie et des transfusions.</p>
<div class="lab">Piège</div><p>Des épistaxis banales sont fréquentes dans la population. C’est leur caractère spontané et récidivant, associé à des télangiectasies ou à un antécédent familial, qui oriente vers la maladie.</p></template>

<template data-pop="i77-spo2" data-title="Saturation couchée et debout : orthodéoxie">
<div class="lab">Technique</div><p>Le médecin mesure la saturation pulsée après quelques minutes en décubitus, puis après quelques minutes debout, en air ambiant.</p>
<div class="lab">Interprétation</div><p>Une baisse de la saturation en position debout est une orthodéoxie. Elle évoque un court-circuit aux bases pulmonaires, où la gravité dirige plus de sang en position debout. Elle s’observe dans les malformations pulmonaires et dans le syndrome hépatopulmonaire.</p>
<div class="lab">Valeur et limites</div><p>Une saturation normale n’exclut pas une malformation pulmonaire : une petite malformation peut ne pas désaturer tout en exposant à l’abcès cérébral. La saturation ne remplace pas l’échocardiographie de contraste.</p>
<div class="lab">Conséquence pratique</div><p>Chez l’enfant, l’association d’une radiographie thoracique et d’une oxymétrie est une alternative de dépistage reconnue par les recommandations de 2020.</p></template>

<template data-pop="i77-souffle" data-title="Souffle épigastrique ou lombaire">
<div class="lab">Technique</div><p>Le patient est couché, abdomen détendu. Le médecin ausculte au-dessus et de part et d’autre de l’ombilic, puis dans les angles costolombaires, en pressant légèrement le stéthoscope.</p>
<div class="lab">Interprétation</div><p>Un souffle systolique et diastolique, latéralisé, est plus évocateur d’une sténose de l’artère rénale qu’un souffle purement systolique, qui peut venir de l’aorte ou du tronc cœliaque chez un sujet mince.</p>
<div class="lab">Valeur et limites</div><p>Le souffle oriente mais ne prouve pas : il manque chez beaucoup de patients atteints, et un souffle systolique médian se rencontre chez des sujets sains. Un souffle variant avec la respiration évoque une compression cœliaque.</p>
<div class="lab">Conséquence pratique</div><p>Un souffle latéralisé chez un hypertendu jeune justifie un écho-Doppler des artères rénales.</p></template>

<template data-pop="i77-branham" data-title="Signe de Nicoladoni-Branham">
<div class="lab">Technique</div><p>Le médecin comprime la fistule ou l’artère qui l’alimente pendant quelques secondes, en surveillant la fréquence cardiaque et la pression artérielle.</p>
<div class="lab">Réponse</div><p>La fréquence cardiaque ralentit et la pression diastolique augmente.</p>
<div class="lab">Mécanisme</div><p>La compression supprime un circuit à faible résistance : la résistance totale remonte et la pression s’élève. Les barorécepteurs détectent cette hausse et ralentissent le cœur par le nerf vague.</p>
<div class="lab">Valeur</div><p>Le signe démontre que la fistule a un retentissement hémodynamique systémique. Son absence n’exclut pas une petite fistule.</p></template>

<template data-pop="i77-telangiectasie" data-title="Télangiectasies : aspect et diagnostic différentiel">
<div class="lab">Aspect</div><p>Macules ou petites papules rouge vif de 1 à 3 mm, qui blanchissent à la pression, sur les lèvres, la langue, le palais, la face, les oreilles et la pulpe des doigts. Elles n’ont pas de rayons.</p>
<div class="lab">Évolution</div><p>Leur nombre augmente avec l’âge ; elles manquent souvent chez l’enfant.</p>
<div class="lab">Diagnostic différentiel</div><p>Angiome stellaire : point central avec rayons. Angiome rubis : papule rouge du tronc chez l’adulte, sans signification. Télangiectasies de la sclérodermie : macules mates en forme de polygone sur le visage et les mains, avec phénomène de Raynaud et sclérodactylie.</p>
<div class="lab">Conséquence pratique</div><p>L’examen de la langue et de la pulpe des doigts est indispensable devant des épistaxis récidivantes ou une anémie ferriprive inexpliquée.</p></template>

<template data-pop="i77-naevus" data-title="Nævus arachnéen (angiome stellaire)">
<div class="lab">Définition</div><p>Artériole cutanée dilatée, d’où partent des vaisseaux en rayons. Code I78.1.</p>
<div class="lab">Technique d’examen</div><p>Le médecin presse le point central avec la pointe d’un stylo : toute la lésion blanchit. Au relâchement, elle se recolore du centre vers la périphérie, ce qui prouve que le point central est l’artériole nourricière.</p>
<div class="lab">Signification</div><p>Quelques lésions sont banales chez l’enfant, chez l’adulte sain et pendant la grossesse. De nombreuses lésions chez l’adulte orientent vers une hépatopathie chronique ; elles s’associent alors à d’autres signes, comme l’érythrose palmaire ou la gynécomastie.</p>
<div class="lab">Mécanisme</div><p>L’hypothèse la plus admise est une hyperœstrogénie relative : le foie malade dégrade moins les œstrogènes, et la transformation périphérique des androgènes en œstrogènes augmente. Les œstrogènes dilatent les artérioles cutanées.</p></template>

<template data-pop="i77-echo-renale" data-title="Écho-Doppler des artères rénales">
<div class="lab">Principe</div><p>L’effet Doppler mesure la vitesse des globules rouges. Dans une sténose, la vitesse augmente proportionnellement au rétrécissement de la section.</p>
<div class="lab">Critères</div><p>Directs : pic de vitesse systolique au site de la sténose, avec des seuils publiés de 180 à 285 cm/s pour une sténose de plus de 50 %, et rapport rénal sur aortique supérieur à 3,5 pour une sténose de plus de 60 %. Indirects : index de résistance intrarénal, aspect amorti du flux en aval et différence d’index entre les reins supérieure à 0,05 (ESVS 2025).</p>
<div class="lab">Limites dans la dysplasie</div><p>La dysplasie siège au tiers moyen et distal, moins accessible que l’ostium ; l’obésité, les gaz digestifs et l’expérience de l’opérateur limitent l’examen. Les artères rénales multiples peuvent être manquées.</p>
<div class="lab">Conséquence pratique</div><p>Un écho-Doppler normal chez une patiente très évocatrice ne clôt pas le bilan : l’angioscanner reste indiqué.</p></template>

<template data-pop="i77-angiographie" data-title="Angiographie par cathéter et gradient de pression">
<div class="lab">Principe</div><p>Un cathéter introduit par voie fémorale ou radiale injecte du produit de contraste dans l’artère, filmée en soustraction numérique. Un guide de pression mesure la pression en amont et en aval de la sténose.</p>
<div class="lab">Pourquoi c’est la référence</div><p>Elle a la meilleure résolution spatiale et elle mesure directement le retentissement hémodynamique, que l’aspect du collier de perles sous-estime souvent.</p>
<div class="lab">Seuil</div><p>Un gradient supérieur à 10 % entre l’artère rénale et l’aorte est retenu ; ce seuil provient de la sténose athéromateuse et n’est pas validé dans la dysplasie (ESVS 2025).</p>
<div class="lab">Limites et risques</div><p>Geste invasif, avec risque de dissection, d’hématome de ponction et de néphropathie au produit de contraste. Il n’est fait que lorsqu’une angioplastie est envisagée dans le même temps.</p></template>

<template data-pop="i77-ir" data-title="Index de résistance intrarénal">
<div class="lab">Calcul</div><p>Index de résistance = (vitesse systolique maximale − vitesse télédiastolique) / vitesse systolique maximale, mesuré dans une artère interlobaire.</p>
<div class="lab">Exemple</div><p>Vitesse systolique 40 cm/s, télédiastolique 14 cm/s : index = (40 − 14) / 40 = 0,65.</p>
<div class="lab">Interprétation</div><p>Une sténose d’amont amortit le flux d’aval et abaisse l’index du côté sténosé. Un index élevé, au-delà de 0,8, traduit une atteinte du parenchyme et des petites artères ; l’ESVS 2025 cite un index inférieur à 0,8 parmi les critères de rein encore viable avant une revascularisation.</p>
<div class="lab">Limites</div><p>L’index dépend aussi de la fréquence cardiaque, de la compliance artérielle et de l’âge ; il s’interprète en comparant les deux reins.</p></template>

<template data-pop="i77-echo-contraste" data-title="Échocardiographie de contraste transthoracique">
<div class="lab">Technique</div><p>Le médecin agite rapidement du sérum physiologique entre deux seringues, avec un peu d’air ou de sang, et l’injecte dans une veine du bras pendant l’enregistrement de la vue des quatre cavités.</p>
<div class="lab">Lecture</div><p>Normalement, les bulles opacifient le cœur droit et s’arrêtent dans les capillaires pulmonaires. Des bulles dans le cœur gauche signent un court-circuit droit-gauche. Un passage immédiat évoque un court-circuit intracardiaque ; un passage retardé, après trois à cinq cycles environ, évoque une malformation pulmonaire.</p>
<div class="lab">Valeur</div><p>Examen très sensible, sans irradiation, recommandé comme dépistage initial des malformations pulmonaires (recommandations 2011, reprises en 2020). Un examen négatif rend une malformation traitable très improbable.</p>
<div class="lab">Limites</div><p>Un petit passage de bulles est fréquent chez des patients sans malformation traitable ; la quantification du passage guide la décision de scanner.</p></template>

<template data-pop="i77-grade-bulles" data-title="Grade du passage de bulles">
<div class="lab">Échelle</div><p>Les centres experts utilisent une échelle semi-quantitative fondée sur le nombre maximal de bulles visibles dans le ventricule gauche sur une image : grade 0, aucune bulle ; grade 1, moins de 30 ; grade 2, de 30 à 100 ; grade 3, plus de 100.</p>
<div class="lab">Décision</div><p>Un grade 2 ou 3 conduit au scanner thoracique, car la probabilité d’une malformation traitable par embolisation est élevée. Pour un grade 1, la conduite varie selon les centres, car les malformations trouvées sont rarement assez grandes pour être embolisées.</p>
<div class="lab">Source et limites</div><p>Cette échelle provient de séries néerlandaises et nord-américaines de centres experts ; les recommandations internationales ne fixent pas de seuil chiffré. Le protocole exact appartient au centre qui réalise l’examen.</p></template>

<template data-pop="i77-genetique-thh" data-title="Test génétique de la télangiectasie">
<div class="lab">Gènes</div><p>ENG (type 1), ACVRL1 (type 2), SMAD4 (forme avec polypose juvénile) ; plus rarement GDF2. Un variant est trouvé chez 97 % des patients au diagnostic clinique définitif.</p>
<div class="lab">Indications (recommandations 2011 et 2020)</div><p>Identifier le variant d’une famille cliniquement atteinte ; diagnostiquer un apparenté asymptomatique ou peu symptomatique, y compris un enfant ; permettre un diagnostic prénatal ou préimplantatoire ; aider au diagnostic quand les critères de Curaçao sont insuffisants.</p>
<div class="lab">Ordre</div><p>Le test commence par un apparenté atteint. Si ENG et ACVRL1 sont normaux, SMAD4 est recherché.</p>
<div class="lab">Interprétation</div><p>Un variant familial absent chez un apparenté exclut la maladie et le dépistage de ses malformations. Un test négatif sans variant familial connu ne l’exclut pas.</p>
<div class="lab">Cadre suisse</div><p>Le test génétique est encadré par la loi fédérale sur l’analyse génétique humaine ; il exige une information et un consentement préalables.</p></template>

<template data-pop="i77-smad4" data-title="Forme SMAD4 : polypose juvénile et télangiectasie">
<div class="lab">Définition</div><p>Un variant de SMAD4 provoque une polypose juvénile associée aux signes de la télangiectasie hémorragique héréditaire. Les polypes hamartomateux du tube digestif exposent au saignement et au cancer.</p>
<div class="lab">Surveillance recommandée (2020)</div><p>Coloscopie dès 15 ans, répétée tous les trois ans si elle est normale, ou chaque année avec une œsogastroduodénoscopie si des polypes sont trouvés.</p>
<div class="lab">Autres atteintes rapportées</div><p>Des dilatations de l’aorte ont été rapportées dans des séries de patients porteurs d’un variant SMAD4, en lien avec le rôle de SMAD4 dans la voie du TGF-β ; leur fréquence reste mal connue.</p>
<div class="lab">Conséquence pratique</div><p>Un patient atteint de télangiectasie avec des polypes digestifs jeunes doit avoir un test de SMAD4.</p></template>

<template data-pop="i77-embolisation" data-title="Embolisation des malformations pulmonaires">
<div class="lab">Technique</div><p>Par voie veineuse fémorale, un cathéter atteint l’artère pulmonaire qui nourrit la malformation. Le radiologue l’occlut par des spires métalliques ou des bouchons vasculaires, au plus près du sac.</p>
<div class="lab">Indication</div><p>Les malformations dont l’artère nourricière mesure au moins 3 mm sont accessibles à l’embolisation ; les recommandations demandent de traiter les grandes malformations et celles qui désaturent, y compris chez l’enfant.</p>
<div class="lab">Complications</div><p>Douleur pleurale transitoire, embolie gazeuse ou matérielle rare, reperméabilisation à distance.</p>
<div class="lab">Suivi</div><p>Un suivi à long terme recherche la reperméabilisation des malformations traitées et la croissance des petites malformations non traitées, par scanner, oxymétrie ou échocardiographie de contraste selon le centre.</p></template>

<template data-pop="i77-meche" data-title="Méchage atraumatique de l’épistaxis">
<div class="lab">Principe</div><p>En cas d’épistaxis nécessitant une intervention, la recommandation de 2011, toujours en vigueur, demande un méchage avec un matériel qui risque peu de faire saigner au retrait, par exemple un ballonnet pneumatique lubrifié à faible pression.</p>
<div class="lab">Pourquoi</div><p>Une mèche classique adhère à la muqueuse ; son retrait arrache les télangiectasies et relance le saignement.</p>
<div class="lab">Piège</div><p>Les cautérisations répétées soulagent temporairement mais perforent la cloison nasale.</p>
<div class="lab">Conséquence pratique</div><p>Le patient atteint de télangiectasie signale sa maladie à l’équipe d’urgence, qui adapte le matériel et adresse à un oto-rhino-laryngologiste expérimenté.</p></template>

<template data-pop="i77-score-epistaxis" data-title="Score de sévérité des épistaxis">
<div class="lab">Composition</div><p>Questionnaire de six items : fréquence et durée des épistaxis, intensité habituelle, recours à un soin médical, anémie, transfusions. Le score va de 0 à 10.</p>
<div class="lab">Interprétation</div><p>Score bas : épistaxis légères ; intermédiaire : modérées ; élevé : sévères. Les seuils publiés sont 4 et 7. Une variation d’au moins 0,71 point est considérée comme cliniquement significative.</p>
<div class="lab">Usage</div><p>Suivre l’effet d’un traitement chez un même patient et définir les critères d’inclusion et de jugement des essais, comme l’essai PATH-HHT.</p>
<div class="lab">Limite</div><p>Le score dépend de la mémoire du patient sur les trois derniers mois ; un carnet des saignements le complète utilement.</p></template>
