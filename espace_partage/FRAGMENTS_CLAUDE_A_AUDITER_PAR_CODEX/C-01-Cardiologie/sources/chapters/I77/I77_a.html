<section class="ilot" id="i77-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p><b>Patiente A.</b> Une femme de 38 ans, non fumeuse, consulte pour une hypertension artérielle découverte il y a quatre mois. Sa pression atteint 168/102 mmHg sous trois antihypertenseurs, dont un diurétique. Elle se plaint depuis un an de céphalées et d’un bruit pulsatile dans l’oreille droite, synchrone du pouls. Le médecin entend un souffle épigastrique latéralisé à gauche. Sa créatinine vaut 68 µmol/L et sa kaliémie 3,4 mmol/L. Elle n’a ni diabète, ni dyslipidémie, ni antécédent cardiovasculaire familial précoce.</p>
<p><b>Patient B.</b> Un homme de 46 ans saigne du nez plusieurs fois par semaine depuis l’adolescence. Il est adressé pour une anémie ferriprive à 92 g/L, malgré deux gastroscopies jugées « normales » par ailleurs. Sa mère a présenté un abcès cérébral à 52 ans. Le médecin observe de petites taches rouges sur les lèvres, la langue et la pulpe des doigts. La saturation pulsée vaut 93 % en air ambiant.</p>
<p>Ces deux patients n’ont pas d’athérosclérose, et pourtant leurs artères ou leurs capillaires sont malades. Quatre questions organisent le chapitre : <b>la lésion vasculaire est-elle athéromateuse ou non, quel est son mécanisme (paroi fragile, compression extrinsèque, communication anormale entre artère et veine), quel territoire menace-t-elle, et quelle complication grave faut-il prévenir ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître une <b>dysplasie fibromusculaire</b> et en conduire le bilan de la tête au bassin. Il sait aussi poser le diagnostic de <b>télangiectasie hémorragique héréditaire</b> par les critères de Curaçao et organiser le dépistage des malformations pulmonaires et cérébrales. Il sait enfin reconnaître une compression artérielle, une fistule artérioveineuse acquise ou un nævus arachnéen, et coder correctement les catégories I77, I78 et I79. Les anévrismes et les dissections de l’aorte et des grosses artères relèvent du cours I71 — Anévrismes et dissections artérielles (C-01-Cardiologie). Les vascularites systémiques relèvent du cours M31 — Vascularites systémiques (I-13-Immunologie et allergologie).</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i77-tuniques">structure des trois tuniques artérielles (intima, média, adventice)</button>, le <button class="w" data-k="i77-goldblatt">mécanisme de Goldblatt de l’hypertension rénovasculaire (rénine et angiotensine II)</button> et la <button class="w" data-k="i77-shunt">physiologie d’un court-circuit artérioveineux (débit, résistance, oxygénation)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i77-1"><h2><span class="n">1</span>Définitions et classification CIM-10-GM</h2>
<p>Les catégories I77 à I79 réunissent des maladies hétérogènes de la paroi artérielle et des capillaires. Leur point commun est négatif : aucune n’est due à l’athérosclérose, classée en I70, ni à l’embolie artérielle, classée en I74. Le classement CIM-10-GM 2024 suit la lésion décrite et non la cause. Une sténose de l’artère rénale par dysplasie se code donc I77.3, alors qu’une sténose rénale athéromateuse se code I70.1. Cette distinction n’est pas administrative : elle sépare deux maladies qui ne se traitent pas de la même façon.</p>

<p>Le médecin regarde d’abord la colonne « Où lire ». Elle montre que l’ulcère pénétrant de l’aorte, bien que codé I77.80, est enseigné avec la dissection aortique. Il partage en effet son mécanisme, son imagerie et son urgence. L’erreur fréquente consiste à coder une dissection de la carotide en I77 : la CIM-10-GM 2024 la range en <b>I72.0</b>, avec l’anévrisme carotidien, et la dissection vertébrale en I72.6. Une dissection des artères cérébrales intracrâniennes se code I67.0. L’astérisque de I79 signale un <button class="w" data-k="i77-dague">code de manifestation du système dague-astérisque (double codage obligatoire)</button>.</p>
<div class="trap"><span class="k">Piège</span>Les exclusions de I77.0 sont précises. Un anévrisme artérioveineux sans précision se code Q27.3, car il est présumé congénital ; une fistule coronaire acquise se code I25.4 ; une fistule cérébrale acquise se code I67.11 ; une fistule traumatique se code au chapitre des lésions traumatiques. Dans la télangiectasie hémorragique héréditaire, le code I78.0 décrit la maladie ; une malformation pulmonaire associée peut être codée en plus selon les règles de codage en vigueur.</div>
<h3>1.2 Définitions opérationnelles</h3>
<p>La <b>dysplasie fibromusculaire</b> est une maladie artérielle idiopathique, segmentaire, non athéromateuse et non inflammatoire de la musculature de la paroi. Elle sténose les artères de petit et moyen calibre. Le <button class="w" data-k="i77-consensus-dfm">consensus international de 2019 (définition et critères d’imagerie)</button> exige au moins une lésion <b>multifocale</b> en « collier de perles » ou <b>focale</b> sur l’imagerie. Un anévrisme, une dissection ou une tortuosité isolés ne suffisent pas au diagnostic. Ils comptent en revanche comme atteintes d’un autre territoire chez un patient qui a déjà une lésion typique.</p>
<p>La <b>télangiectasie hémorragique héréditaire</b> est une maladie autosomique dominante. Elle produit des communications directes entre artérioles et veinules, sans réseau capillaire intermédiaire. Ces lésions sont petites sur la peau et les muqueuses (télangiectasies) et grandes dans les viscères (<button class="w" data-k="i77-mav">malformations artérioveineuses viscérales (poumon, cerveau, foie)</button>). Le diagnostic clinique repose sur les <button class="w" data-k="i77-curacao">critères de Curaçao (quatre critères, seuil de trois)</button>.</p>
<p>La <b>fistule artérioveineuse acquise</b> est une communication anormale entre une artère et une veine, créée après la naissance par un traumatisme, une ponction ou une érosion. La <b>compression artérielle extrinsèque</b> est une sténose produite par une structure voisine (muscle, ligament, bande fibreuse) sur une artère dont la paroi est initialement saine.</p>
<div class="key"><b>À retenir.</b> Les catégories I77 à I79 rassemblent les atteintes artérielles et capillaires non athéromateuses. Le codage suit la lésion : I77.3 pour la dysplasie fibromusculaire, I77.4 pour la compression cœliaque, I78.0 pour la télangiectasie hémorragique héréditaire. Les dissections des artères cervicales se codent en I72 et sont enseignées dans I71. L’îlot suivant montre que ces maladies sont rares individuellement, mais fréquentes dans certaines populations ciblées.</div>
</section>

<section class="ilot" id="i77-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La rareté apparente de ces maladies tient surtout à leur sous-diagnostic. Elles touchent souvent des patients jeunes, sans facteur de risque cardiovasculaire, chez qui personne ne cherche une artériopathie.</p>
<h3>2.1 Dysplasie fibromusculaire</h3>
<p>La prévalence dans la population générale est inconnue. Les meilleures estimations proviennent de populations examinées pour une autre raison. Chez les donneurs vivants de rein, dont les artères rénales sont imagées avant le prélèvement, la dysplasie rénale est trouvée chez 2,3 à 6,6 % des sujets ; elle concernait 5,8 % des participants de l’essai CORAL (ESVS 2025). Ces sujets étaient en majorité asymptomatiques : la maladie reste donc souvent silencieuse. Environ 10 % des sténoses des artères rénales sont dysplasiques ; les autres sont athéromateuses.</p>
<p>La maladie touche surtout les femmes. Dans le <button class="w" data-k="i77-registre">registre américain de la dysplasie fibromusculaire (Olin 2012)</button>, 91 % des 447 premiers patients étaient des femmes, avec un âge moyen au diagnostic de 52 ans. Ce chiffre surestime peut-être la prédominance féminine, car une femme hypertendue jeune est plus souvent explorée. Les artères rénales et les artères carotides et vertébrales extracrâniennes sont les plus atteintes ; plusieurs territoires sont touchés chez beaucoup de patients.</p>
<h3>2.2 Télangiectasie hémorragique héréditaire</h3>
<p>Les deuxièmes recommandations internationales de 2020 estiment sa prévalence à environ 1 sur 5 000. En Suisse, avec environ 9 millions d’habitants, cela représenterait de l’ordre de 1 800 personnes atteintes ; ce calcul suppose une prévalence suisse égale à l’estimation internationale. Le délai diagnostique est long : beaucoup de patients saignent du nez depuis l’enfance et ne sont diagnostiqués qu’à l’âge adulte, après une complication. Les épistaxis apparaissent souvent dans l’enfance, et les télangiectasies cutanées se multiplient avec l’âge : l’expression de la maladie est dépendante de l’âge.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de registre national suisse publié de la dysplasie fibromusculaire ni de la télangiectasie hémorragique héréditaire. Les chiffres cités sont européens, américains ou internationaux. Le Réseau européen de référence des maladies vasculaires rares (<button class="w" data-k="i77-vascern">VASCERN (réseau européen et centres experts)</button>) structure la prise en charge en Europe.</div>
<h3>2.3 Pronostic</h3>
<p>Le pronostic de la dysplasie fibromusculaire dépend de ses complications : dissection, anévrisme et accident vasculaire cérébral. L’hypertension rénovasculaire guérit parfois après angioplastie, mais la guérison sans médicament ne dépasse pas environ un tiers des patients dans les méta-analyses citées par l’ESVS 2025. Le pronostic de la télangiectasie hémorragique héréditaire dépend surtout des malformations viscérales non dépistées. Une malformation pulmonaire non traitée peut provoquer un accident vasculaire cérébral par <button class="w" data-k="i77-embolie-paradoxale">embolie paradoxale (le filtre pulmonaire est court-circuité)</button> ou un abcès cérébral, comme chez la mère du patient B.</p>
<div class="key"><b>À retenir.</b> La dysplasie fibromusculaire concerne surtout des femmes d’âge moyen et reste souvent asymptomatique ; elle explique environ 10 % des sténoses rénales. La télangiectasie hémorragique héréditaire touche environ une personne sur 5 000 et se diagnostique tard. Dans les deux maladies, le pronostic dépend des complications que le dépistage peut prévenir. L’îlot suivant explique les mécanismes qui produisent ces complications.</div>

<section class="ilot" id="i77-3"><h2><span class="n">3</span>Physiopathologie : trois mécanismes</h2>
<p>Toutes les maladies de ce chapitre se ramènent à trois mécanismes. La paroi artérielle peut être <b>anormale</b> ; l’artère peut être <b>comprimée</b> de l’extérieur ; une artère peut <b>communiquer anormalement</b> avec une veine. Chaque mécanisme produit ses propres complications. Les connaître permet de prévoir ce qu’il faut chercher chez le patient.</p>
<h3>3.1 Paroi anormale : sténose, anévrisme et dissection</h3>
<p>Une artère musculaire normale possède une média faite de cellules musculaires lisses organisées en couches, entre deux limitantes élastiques. Dans la dysplasie fibromusculaire, cette organisation est perdue : des zones de <button class="w" data-k="i77-histo-dfm">fibroplasie (prolifération de cellules et de matrice)</button> rétrécissent la lumière, et des zones amincies se dilatent. L’alternance donne l’aspect en « collier de perles ». Une paroi désorganisée résiste mal aux contraintes : l’intima peut se déchirer et le sang peut disséquer la média. C’est pourquoi la dysplasie se complique de <b>dissections</b> et d’<b>anévrismes</b> et pas seulement de sténoses.</p>
<p>La sténose a une conséquence hémodynamique précise. Selon la <button class="w" data-k="i77-poiseuille">loi de Poiseuille (débit proportionnel au rayon à la puissance quatre)</button>, une réduction de moitié du rayon divise le débit par seize à pression constante. Dans le rein, la baisse de pression en aval d’une sténose stimule la sécrétion de rénine par l’appareil juxtaglomérulaire. L’angiotensine II produite contracte les artérioles et stimule l’aldostérone, ce qui élève la pression artérielle systémique : c’est le <button class="w" data-k="i77-goldblatt">mécanisme de Goldblatt (rein ischémique et hypertension)</button>. L’aldostérone explique l’hypokaliémie modérée de la patiente A.</p>
<h3>3.2 Compression extrinsèque</h3>
<p>Une structure voisine écrase une artère saine, soit en permanence, soit lors d’un mouvement. Dans le <button class="w" data-k="i77-ligament">syndrome du ligament arqué médian (compression du tronc cœliaque)</button>, la bande fibreuse diaphragmatique comprime le tronc cœliaque surtout en expiration. Dans le <button class="w" data-k="i77-poplite">syndrome de l’artère poplitée piégée (anomalie musculaire ou hypertrophie)</button>, le chef médial du gastrocnémien comprime l’artère lors de la flexion plantaire. La compression répétée lèse l’intima : elle peut finir par produire une sténose fixe, une thrombose ou un anévrisme post-sténotique.</p>
<h3>3.3 Communication artérioveineuse : court-circuit et perte du filtre capillaire</h3>
<p>Normalement, le sang artériel traverse un lit capillaire de haute résistance avant d’atteindre les veines. Ce lit capillaire a trois fonctions : il abaisse la pression, il permet les échanges, et dans le poumon il filtre les petits caillots et les bactéries. Une communication directe entre artère et veine supprime ces trois fonctions. La résistance de l’ensemble du circuit baisse, et le cœur doit augmenter son débit pour maintenir la pression : une grande fistule peut provoquer une <button class="w" data-k="i77-haut-debit">insuffisance cardiaque à haut débit (mécanisme et signes)</button>.</p>
<p>Dans le poumon, une malformation artérioveineuse crée un <button class="w" data-k="i77-shunt">court-circuit droit-gauche (sang désaturé vers l’aorte)</button>. Le sang veineux ne passe plus au contact des alvéoles : il rejoint l’oreillette gauche désaturé, ce qui abaisse la saturation artérielle. Surtout, les petits caillots et les bactéries veineuses ne sont plus arrêtés par les capillaires pulmonaires. Ils atteignent la circulation cérébrale, d’où les infarctus et les abcès cérébraux. Sur la muqueuse nasale ou digestive, la télangiectasie est une petite communication artérioveineuse à paroi fragile, exposée à la pression artérielle et aux microtraumatismes : elle saigne facilement.</p>

<p>La figure se lit ligne par ligne. Devant un patient, le médecin identifie d’abord le mécanisme, puis il cherche activement les complications de la colonne de droite, même asymptomatiques. Chez le patient B, la communication artérioveineuse explique à la fois les épistaxis, l’anémie, la saturation basse et le risque d’abcès cérébral. L’erreur fréquente consiste à traiter l’anémie sans chercher la malformation pulmonaire qui menace le cerveau.</p>
<div class="key"><b>À retenir.</b> Une paroi désorganisée se sténose, se dilate et se dissèque. Une compression extrinsèque produit une ischémie liée au mouvement ou au repas. Une communication artérioveineuse abaisse la résistance, fait saigner les muqueuses et court-circuite le filtre pulmonaire. L’îlot suivant passe en revue les causes à évoquer devant une sténose sans athérome.</div>
</section>

<section class="ilot" id="i77-4"><h2><span class="n">4</span>Étiologies d’une sténose artérielle non athéromateuse</h2>
<p>Une sténose artérielle chez un patient de moins de 50 ans, sans facteur de risque, ou siégeant au milieu d’une artère plutôt qu’à son origine, n’est probablement pas athéromateuse. L’athérome naît au contact de l’aorte, où les forces de cisaillement sont perturbées : une sténose rénale athéromateuse siège à l’ostium. La dysplasie touche au contraire le tiers moyen et distal de l’artère. Ce simple repère oriente déjà le diagnostic.</p>
<p>Le tableau compare les causes à distinguer. La question qu’il résout est la suivante : devant une sténose d’allure non athéromateuse, quelle maladie la produit, et quel indice la trahit ?</p>
<table class="t"><tr><th>Cause</th><th>Terrain typique</th><th>Siège et aspect</th><th>Indice discriminant</th></tr>
<tr><td>Dysplasie fibromusculaire</td><td>Femme de 30 à 60 ans</td><td>Tiers moyen et distal ; collier de perles ou sténose focale</td><td>Absence d’inflammation ; autres territoires atteints</td></tr>
<tr><td>Athérosclérose (I70)</td><td>Plus de 55 ans, facteurs de risque</td><td>Ostium, plaques calcifiées</td><td>Atteinte d’autres territoires athéromateux</td></tr>
<tr><td>Artérite de Takayasu (M31.4)</td><td>Femme de moins de 40 ans</td><td>Aorte et branches proximales ; paroi épaissie</td><td>Syndrome inflammatoire, épaississement pariétal concentrique</td></tr>
<tr><td>Artérite à cellules géantes (M31.5, M31.6)</td><td>Plus de 50 ans</td><td>Artères temporales, axillaires, aorte</td><td>Céphalée, claudication de la mâchoire, CRP élevée</td></tr>
<tr><td>Artériopathie radique</td><td>Antécédent de radiothérapie</td><td>Champ d’irradiation</td><td>Délai de plusieurs années après l’irradiation</td></tr>
<tr><td>Compression extrinsèque (I77.1, I77.4)</td><td>Sujet jeune, sportif ; femme jeune pour le tronc cœliaque</td><td>Artère poplitée, tronc cœliaque, artère sous-clavière</td><td>Variation avec la position ou la respiration</td></tr>
<tr><td>Dissection ancienne</td><td>Douleur brutale passée</td><td>Effilement, double lumière</td><td>Hématome de paroi sur l’imagerie</td></tr>
<tr><td>Maladie génétique du tissu conjonctif</td><td>Antécédents familiaux, signes cutanés</td><td>Anévrismes et dissections multiples</td><td><button class="w" data-k="i77-veds">Syndrome d’Ehlers-Danlos vasculaire (gène COL3A1)</button></td></tr></table>
<p>Le médecin cherche d’abord le terrain et l’indice discriminant. Une femme de 25 ans avec une sténose de l’artère sous-clavière et une CRP à 60 mg/L évoque une artérite de Takayasu, pas une dysplasie : la dysplasie ne produit pas de syndrome inflammatoire. L’erreur fréquente consiste à conclure « dysplasie » sur la seule jeunesse de la patiente, sans chercher l’inflammation ni les antécédents familiaux de rupture artérielle précoce.</p>
<h3>4.1 Facteurs associés à la dysplasie fibromusculaire</h3>
<p>La cause de la dysplasie reste inconnue. Plusieurs facteurs y sont associés sans que leur rôle causal soit démontré. Le <b>sexe féminin</b> et l’exposition aux hormones féminines sont évoqués, car la maladie est surtout féminine ; aucune étude n’a prouvé qu’une hormone la provoque. Le <b>tabagisme</b> est associé à des lésions plus sévères dans plusieurs séries ; il reste un facteur à corriger, car il lèse l’endothélium. Une <button class="w" data-k="i77-phactr1">composante génétique (variant du locus PHACTR1)</button> est démontrée : le même variant est associé à la dissection coronaire spontanée et à la migraine. Des formes familiales existent.</p>
<div class="trap"><span class="k">Piège</span>Une dissection coronaire spontanée chez une femme jeune doit faire chercher une dysplasie dans les autres territoires (SCAD, cours I21 — Syndromes coronariens aigus et infarctus du myocarde (C-01-Cardiologie)). Les deux maladies partagent un terrain et un variant génétique ; leur coexistence est fréquente dans les séries publiées.</div>
<div class="key"><b>À retenir.</b> Une sténose du tiers moyen d’une artère, chez une femme jeune sans syndrome inflammatoire, évoque une dysplasie fibromusculaire. Une inflammation oriente vers une vascularite, des antécédents familiaux de rupture vers une maladie du tissu conjonctif, et une variation positionnelle vers une compression. Les îlots suivants montrent comment l’anamnèse et l’examen recueillent ces indices.</div>
<button class="pareto-btn ui" data-k="pareto-i77-meca">▲ Loi de Pareto — Mécanismes et étiologies</button>
</section>

<section class="ilot" id="i77-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse doit d’abord établir si le patient a un terrain athéromateux. Elle recherche ensuite les indices propres à chaque mécanisme. Les symptômes de ces maladies sont trompeurs, car ils ressemblent à des troubles fréquents et bénins : céphalée, bourdonnement d’oreille, saignement de nez, douleur abdominale.</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin demande un antécédent d’<b>hypertension artérielle avant 30 ans</b>, de <button class="w" data-k="i77-dissection-cervicale">dissection cervicale ou de dissection coronaire spontanée (dépistage des autres territoires)</button>, d’accident vasculaire cérébral jeune ou d’anévrisme. Il demande un <b>cathétérisme artériel récent</b>, car une fistule fémorale apparaît après une ponction. Il recherche une <b>radiothérapie</b> cervicale ou abdominale, même ancienne. Il interroge sur la famille : épistaxis, anémie, abcès cérébral, accident vasculaire cérébral jeune ou hémorragie pulmonaire chez un apparenté du premier degré sont des indices de télangiectasie hémorragique héréditaire. Une mort subite ou une rupture artérielle avant 40 ans chez un apparenté évoque une maladie génétique du tissu conjonctif.</p>
<h3>5.2 Symptômes par territoire</h3>
<p>Le tableau suivant relie chaque symptôme à son mécanisme. La fréquence est donnée lorsqu’une série l’a mesurée ; sinon, le symptôme est simplement décrit comme possible.</p>
<table class="t"><tr><th>Symptôme</th><th>Maladie évoquée</th><th>Mécanisme</th><th>Fréquence documentée</th></tr>
<tr><td>Hypertension artérielle</td><td>Dysplasie rénale</td><td>Activation du système rénine-angiotensine</td><td>Environ deux patients sur trois (registre américain)</td></tr>
<tr><td>Céphalées</td><td>Dysplasie cervicale</td><td>Mal expliqué ; migraine associée</td><td>Environ un patient sur deux (registre américain)</td></tr>
<tr><td><button class="w" data-k="i77-acouphene">Acouphène pulsatile (bruit synchrone du pouls)</button></td><td>Dysplasie carotidienne</td><td>Flux turbulent transmis à l’oreille interne</td><td>Environ un patient sur quatre (registre américain)</td></tr>
<tr><td><button class="w" data-k="i77-epistaxis">Épistaxis récidivantes spontanées</button></td><td>Télangiectasie hémorragique héréditaire</td><td>Rupture de télangiectasies nasales</td><td>Symptôme le plus fréquent de la maladie</td></tr>
<tr><td>Douleur abdominale après le repas, perte de poids</td><td>Ligament arqué médian, ischémie mésentérique</td><td>Débit cœliaque insuffisant pendant la digestion</td><td>Non quantifiée</td></tr>
<tr><td>Claudication du mollet chez un sportif jeune</td><td>Artère poplitée piégée</td><td>Compression à la contraction du mollet</td><td>Non quantifiée</td></tr>
<tr><td>Dyspnée d’effort, œdèmes</td><td>Grande fistule artérioveineuse, malformations hépatiques</td><td>Insuffisance cardiaque à haut débit</td><td>Rare</td></tr>
<tr><td>Méléna, fatigue, dyspnée</td><td>Télangiectasies digestives</td><td>Saignement digestif chronique, carence martiale</td><td>Plus fréquent après 50 ans</td></tr></table>
<p>Le médecin repère d’abord les symptômes « banals » de la colonne de gauche. Un acouphène pulsatile ne relève pas d’abord de l’oto-rhino-laryngologiste : il impose d’ausculter le cou et, s’il s’accompagne d’une hypertension jeune, d’imager les artères. Pour le patient B, des épistaxis depuis l’adolescence associées à une anémie disproportionnée par rapport aux saignements visibles évoquent un saignement digestif occulte par télangiectasies.</p>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique de dysplasie fibromusculaire</h4><p>La patiente typique est une femme de 30 à 60 ans. Elle a une hypertension artérielle récente ou résistante, des céphalées et un acouphène pulsatile. Le souffle épigastrique ou cervical oriente l’imagerie, qui montre un collier de perles des artères rénales ou carotides internes.</p></div>
<div class="card"><h4>Formes atypiques de dysplasie fibromusculaire</h4><p>La maladie peut toucher un homme. Elle est souvent découverte par hasard sur un angioscanner, ou révélée par une dissection cervicale, une dissection coronaire spontanée ou un infarctus rénal. Elle peut atteindre isolément une artère mésentérique ou iliaque. Chez l’enfant, la forme est souvent focale et sévère, et elle doit faire discuter une maladie génétique.</p></div>
<div class="card"><h4>Forme typique de télangiectasie hémorragique héréditaire</h4><p>Le patient saigne du nez spontanément et de façon récidivante depuis l’enfance. Il porte des télangiectasies des lèvres, de la langue et des doigts, a une anémie ferriprive et un apparenté atteint.</p></div>
<div class="card"><h4>Formes atypiques de télangiectasie hémorragique héréditaire</h4><p>La maladie peut se révéler par un abcès cérébral, un accident vasculaire cérébral jeune, une hémoptysie, une hémorragie cérébrale ou une insuffisance cardiaque à haut débit d’origine hépatique, sans épistaxis notables. Chez l’enfant, les télangiectasies cutanées manquent souvent.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse établit le terrain, recherche un cathétérisme ou une irradiation, et interroge la famille. Une hypertension jeune avec céphalée et acouphène pulsatile évoque une dysplasie ; des épistaxis récidivantes avec un apparenté atteint évoquent une télangiectasie hémorragique héréditaire. L’examen clinique vérifie ces hypothèses.</div>
</section>

<section class="ilot" id="i77-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit un ordre fixe : état général, signes vitaux, anthropométrie, puis signes ciblés. Il est souvent normal dans la dysplasie, ce qui ne l’exclut pas. Dans la télangiectasie hémorragique héréditaire, il apporte au contraire des critères diagnostiques visibles.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin note la pâleur et la tachycardie d’une anémie. Il mesure la <b>pression artérielle aux deux bras</b> : une différence systolique de plus de 15 mmHg entre les bras suggère une sténose de l’artère sous-clavière du côté le plus bas. Ce seuil de 15 mmHg vise la sténose sous-clavière ; le cours I10 — Hypertension artérielle (C-01-Cardiologie) retient une différence d’au moins 10 mmHg pour choisir le bras de référence et signaler un risque accru, et une asymétrie supérieure à 20 mmHg avec douleur thoracique fait évoquer une dissection aortique (cours I71 — Anévrismes et dissections artérielles). Il mesure la <button class="w" data-k="i77-spo2">saturation pulsée couchée puis debout (orthodéoxie)</button> : une baisse en position debout évoque un court-circuit pulmonaire des bases. Il note une pression différentielle large et une tachycardie, signes d’un haut débit.</p></div>
<div class="card"><h4>Anthropométrie</h4><p>Le poids et son évolution comptent : une perte de poids involontaire avec douleurs après le repas oriente vers une ischémie mésentérique. Une grande taille, une hyperlaxité ou une peau fine et translucide orientent vers une maladie du tissu conjonctif.</p></div>
<div class="card"><h4>Auscultation vasculaire</h4><p>Le médecin ausculte les deux carotides, l’épigastre et les flancs, puis les creux poplités. Un <button class="w" data-k="i77-souffle">souffle épigastrique ou lombaire (technique et valeur)</button> chez un hypertendu jeune oriente vers une sténose rénale. Un souffle continu, systolique et diastolique, sur un point de ponction évoque une fistule artérioveineuse.</p></div>
<div class="card"><h4>Pouls et manœuvres</h4><p>Les pouls pédieux et tibiaux postérieurs sont palpés au repos, puis pendant une flexion plantaire active contre résistance : leur disparition suggère une <button class="w" data-k="i77-poplite">artère poplitée piégée (manœuvres de provocation)</button>. Sur une fistule, le <button class="w" data-k="i77-branham">signe de Nicoladoni-Branham (bradycardie à la compression)</button> est recherché.</p></div>
<div class="card"><h4>Peau et muqueuses</h4><p>Le médecin examine les lèvres, la langue, le palais, la face et la pulpe des doigts à la recherche de <button class="w" data-k="i77-telangiectasie">télangiectasies (aspect et distinction avec l’angiome stellaire)</button>. Il recherche aussi des <button class="w" data-k="i77-naevus">angiomes stellaires (nævus arachnéen) sur le territoire cave supérieur</button>, signe d’hépatopathie ou d’hyperœstrogénie.</p></div>
<div class="card"><h4>Signes neurologiques et cardiaques</h4><p>Un syndrome de Claude Bernard-Horner ou un déficit focal évoque une dissection cervicale. Une turgescence jugulaire, des œdèmes et un souffle systolique d’éjection évoquent une insuffisance cardiaque à haut débit. Une hépatomégalie avec souffle hépatique évoque des malformations hépatiques de télangiectasie.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Le médecin conclut à l’absence de télangiectasie parce que le visage est normal. Les lésions les plus utiles au diagnostic se trouvent sur la langue, les lèvres et la pulpe des doigts ; elles sont souvent ignorées si le patient n’ouvre pas la bouche ni ne montre ses mains.</div>
<div class="key"><b>À retenir.</b> L’examen mesure la pression aux deux bras, la saturation couchée et debout, ausculte cou, épigastre et flancs, et inspecte la bouche et les doigts. Un examen normal n’exclut pas une dysplasie. L’îlot suivant organise ces indices en démarche diagnostique.</div>
</section>

<section class="ilot" id="i77-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche répond à trois questions successives. La lésion est-elle non athéromateuse ? Quel mécanisme la produit ? Quels autres territoires faut-il explorer ? La troisième question est propre à ce chapitre : la dysplasie et la télangiectasie hémorragique héréditaire sont des maladies <b>multifocales</b>, et la lésion qui a révélé la maladie n’est souvent pas la plus dangereuse.</p>
<h3>7.1 Dysplasie fibromusculaire</h3>
<p>Le diagnostic repose sur l’imagerie artérielle : au moins une lésion multifocale ou focale typique, sans athérome ni inflammation qui l’expliquent mieux. L’<button class="w" data-k="i77-echo-renale">écho-Doppler des artères rénales (critères et limites)</button> est l’examen de première ligne ; il voit mal le tiers moyen et distal de l’artère, siège habituel de la dysplasie. L’<b>angioscanner</b> ou l’<b>angio-IRM</b> confirme la lésion. Le consensus recommande une imagerie unique <b>de la tête au bassin</b>, en général un angioscanner, chez tout patient atteint, quel que soit le territoire révélateur. Cette imagerie cherche d’autres sténoses, des anévrismes et des dissections silencieux. L’<button class="w" data-k="i77-angiographie">angiographie par cathéter avec mesure du gradient de pression (examen de référence)</button> reste l’examen de référence, mais elle est réservée aux patients pour lesquels une angioplastie est envisagée.</p>
<h3>7.2 Télangiectasie hémorragique héréditaire</h3>
<p>Le diagnostic clinique repose sur les critères de Curaçao : <b>définitif avec trois critères ou plus, possible avec deux, improbable avec moins de deux</b>. La recherche d’un <button class="w" data-k="i77-genetique-thh">variant pathogène des gènes ENG, ACVRL1 ou SMAD4 (indications du test)</button> confirme la maladie, notamment chez un apparenté asymptomatique. Une fois le diagnostic posé ou suspecté, le médecin organise un dépistage systématique des malformations pulmonaires et cérébrales, puis un bilan martial.</p>

<h3>7.3 Diagnostics différentiels hiérarchisés par gravité</h3>
<p>Les différentiels se classent selon le danger d’une erreur. Le médecin élimine d’abord ce qui tue vite, puis ce qui se traite différemment.</p>
<table class="t"><tr><th>Rang</th><th>Diagnostic à ne pas manquer</th><th>Pourquoi il est grave</th><th>Critère qui le distingue</th></tr>
<tr><td>1</td><td>Dissection aortique, ulcère pénétrant</td><td>Mortalité élevée en quelques heures</td><td>Douleur brutale, imagerie de l’aorte (I71)</td></tr>
<tr><td>2</td><td>Dissection cervicale avec ischémie cérébrale</td><td>Infarctus cérébral du sujet jeune</td><td>Douleur cervicale, Claude Bernard-Horner, déficit</td></tr>
<tr><td>3</td><td>Vascularite des gros vaisseaux</td><td>Sténoses évolutives, cécité dans l’artérite à cellules géantes</td><td>Syndrome inflammatoire, paroi épaissie</td></tr>
<tr><td>4</td><td>Syndrome d’Ehlers-Danlos vasculaire</td><td>Ruptures artérielles et digestives ; geste invasif dangereux</td><td>Antécédents familiaux, peau fine, anévrismes multiples</td></tr>
<tr><td>5</td><td>Hyperaldostéronisme primaire, phéochromocytome</td><td>Autres hypertensions secondaires curables</td><td>Rapport aldostérone sur rénine, métanéphrines</td></tr>
<tr><td>6</td><td>Épistaxis d’autre cause</td><td>Erreur de diagnostic familial</td><td>Absence de télangiectasies et d’antécédent familial</td></tr></table>
<p>Le tableau se lit du rang 1 au rang 6. Chez une patiente hypertendue avec kaliémie basse, la dysplasie rénale et l’hyperaldostéronisme primaire donnent tous deux une hypokaliémie. Le rapport aldostérone sur rénine les distingue : la rénine est élevée dans l’hypertension rénovasculaire et effondrée dans l’hyperaldostéronisme primaire.</p>
<div class="quiz ui"><p><b>Question.</b> Une femme de 44 ans a une dysplasie fibromusculaire des deux artères rénales découverte lors d’un bilan d’hypertension. Quel examen complémentaire le consensus de 2019 recommande-t-il ensuite ?</p>
<button data-ok="0">A. Une biopsie de l’artère rénale pour confirmer le sous-type histologique.</button>
<button data-ok="1">B. Une imagerie unique de la tête au bassin, en général par angioscanner.</button>
<button data-ok="0">C. Aucune imagerie supplémentaire en l’absence de symptôme neurologique.</button>
<button data-ok="0">D. Une tomographie par émission de positons pour exclure une vascularite.</button>
<p class="fb" hidden>Réponse B. La dysplasie est multifocale : des anévrismes et des dissections cervicales ou intracrâniennes peuvent rester silencieux jusqu’à la complication. Une imagerie unique de la tête au bassin les recherche. La biopsie n’est jamais indiquée pour le diagnostic, car l’imagerie suffit et la paroi est fragile. Une tomographie par émission de positons ne se discute qu’en présence d’arguments pour une vascularite.</p></div>
<div class="key"><b>À retenir.</b> La dysplasie se diagnostique par l’imagerie, puis s’explore de la tête au bassin. La télangiectasie hémorragique héréditaire se diagnostique par les critères de Curaçao ou par un variant pathogène, puis impose le dépistage des malformations pulmonaires et cérébrales. Les dissections, les vascularites et les maladies du tissu conjonctif passent en premier dans le diagnostic différentiel. L’îlot suivant décrit les urgences.</div>
</section>

<section class="ilot" id="i77-8"><h2><span class="n">8</span>Urgences et complications</h2>
<p>Ces maladies chroniques se révèlent souvent par une urgence. Le médecin doit reconnaître la complication, la traiter, puis remonter à la maladie causale, faute de quoi la récidive frappe un autre territoire.</p>
<div class="alert"><b>Urgences à reconnaître en premier.</b> <b>1. Épistaxis massive</b> avec instabilité hémodynamique chez un patient atteint de télangiectasie hémorragique héréditaire : compression, <button class="w" data-k="i77-meche">méchage atraumatique (matériel lubrifié, faible pression)</button>, transfusion si choc, avis oto-rhino-laryngologique ; les mèches classiques arrachent les télangiectasies au retrait et relancent le saignement. <b>2. Hémoptysie ou hémothorax</b> par rupture d’une malformation pulmonaire, surtout pendant la grossesse : embolisation en urgence. <b>3. Déficit neurologique ou abcès cérébral</b> chez un patient porteur d’une malformation pulmonaire : imagerie cérébrale, prise en charge de l’accident vasculaire cérébral ou de l’abcès, puis traitement de la malformation. <b>4. Dissection cervicale</b> révélant une dysplasie : filière de l’accident vasculaire cérébral (I71). <b>5. Douleur abdominale aiguë</b> par dissection isolée d’une artère mésentérique ou rupture d’anévrisme viscéral : angioscanner en urgence. <b>6. Infarctus rénal</b> (douleur lombaire, LDH élevée, hématurie) par dissection de l’artère rénale.</div>
<p>L’ordre de l’encadré suit la gravité immédiate. Une épistaxis chez un patient atteint de télangiectasie n’est pas anodine : un épisode prolongé, chez un patient déjà carencé en fer, peut imposer une transfusion. La rupture d’une malformation pulmonaire pendant la grossesse s’explique par l’augmentation du volume sanguin et du débit cardiaque, qui dilatent la malformation ; c’est pourquoi les recommandations demandent un dépistage avant ou pendant la grossesse.</p>
<h3>8.1 Complications chroniques</h3>
<p>La dysplasie se complique d’une <b>hypertension résistante</b>, d’une <b>atrophie rénale</b> en aval d’une sténose serrée, d’<b>anévrismes</b> rénaux, viscéraux et intracrâniens, et de <b>dissections</b>. La télangiectasie hémorragique héréditaire se complique d’une <b>anémie ferriprive chronique</b>, de <b>malformations hépatiques</b> responsables d’insuffisance cardiaque à haut débit, d’hypertension portale ou de cholangite ischémique, et d’<b>hypertension pulmonaire</b>. Une grande fistule artérioveineuse acquise peut provoquer une insuffisance cardiaque à haut débit et une insuffisance veineuse du membre.</p>
<div class="trap"><span class="k">Piège</span>Une biopsie hépatique chez un patient atteint de télangiectasie hémorragique héréditaire expose à une hémorragie grave à travers une malformation : les recommandations de 2020 demandent de l’éviter. De même, l’embolisation de l’artère hépatique est déconseillée, car son effet est transitoire et sa morbidité élevée.</div>
<div class="key"><b>À retenir.</b> Les urgences sont l’épistaxis massive, la rupture d’une malformation pulmonaire, l’embolie paradoxale ou l’abcès cérébral, la dissection cervicale, la dissection viscérale et l’infarctus rénal. Chaque urgence oblige à remonter à la maladie causale et à explorer les autres territoires. Les îlots suivants détaillent la prise en charge de chaque maladie, en commençant par la dysplasie fibromusculaire.</div>
