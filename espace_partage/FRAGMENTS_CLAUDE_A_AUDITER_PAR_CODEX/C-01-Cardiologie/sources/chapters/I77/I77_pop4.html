
<!-- ===== FENÊTRES I77 : Pareto ===== -->
<template data-pop="pareto-i77-def" data-title="Pareto — Définitions, codage et épidémiologie">
<p class="ratio" data-cover="i77-1,i77-2"></p>
<ul><li>I77 à I79 : atteintes artérielles et capillaires non athéromateuses ; le code suit la lésion.</li><li>I77.3 dysplasie fibromusculaire ; I77.4 compression cœliaque ; I77.1 sténose ou compression ; I77.0 fistule acquise ; I78.0 télangiectasie héréditaire ; I78.1 angiome stellaire ; I79 = codes astérisque.</li><li>Dissection carotidienne I72.0, vertébrale I72.6 (cours I71) ; ulcère pénétrant I77.80 (cours I71).</li><li>Dysplasie : lésion focale ou multifocale obligatoire ; anévrisme ou dissection seuls insuffisants.</li><li>Curaçao : trois critères sur quatre = définitif.</li><li>Dysplasie : 2,3 à 6,6 % des donneurs de rein, 10 % des sténoses rénales, surtout des femmes. Télangiectasie : environ 1 sur 5 000, diagnostic tardif.</li></ul></template>

<template data-pop="pareto-i77-meca" data-title="Pareto — Mécanismes et étiologies">
<p class="ratio" data-cover="i77-3,i77-4"></p>
<ul><li>Paroi anormale → sténose, anévrisme, dissection.</li><li>Compression → ischémie liée au mouvement, à la respiration ou au repas ; stent seul inutile.</li><li>Communication artérioveineuse → résistance basse (haut débit), saignement, perte du filtre pulmonaire (embolie paradoxale, abcès cérébral).</li><li>Sténose rénale → rénine, angiotensine II, aldostérone → hypertension et hypokaliémie.</li><li>Ostium = athérome ; tiers moyen = dysplasie ; CRP élevée = vascularite ; antécédents de rupture = Ehlers-Danlos vasculaire.</li><li>Dissection coronaire spontanée → chercher une dysplasie (locus PHACTR1 partagé).</li></ul></template>

<template data-pop="pareto-i77-clin" data-title="Pareto — Clinique, diagnostic et urgences">
<p class="ratio" data-cover="i77-5,i77-6,i77-7,i77-8"></p>
<ul><li>Dysplasie : hypertension jeune ou résistante, céphalées, acouphène pulsatile, souffle épigastrique ou cervical.</li><li>Télangiectasie : épistaxis récidivantes, télangiectasies des lèvres, de la langue et des doigts, anémie, apparenté atteint.</li><li>Examen : pression aux deux bras, saturation couchée et debout, auscultation, pouls avec manœuvres.</li><li>Dysplasie confirmée → imagerie unique de la tête au bassin ; angiographie seulement si geste.</li><li>Télangiectasie → dépistage pulmonaire de tous, IRM cérébrale de l’adulte, bilan martial.</li><li>Urgences : épistaxis massive (méchage atraumatique), rupture de malformation pulmonaire, abcès ou infarctus cérébral, dissections, infarctus rénal.</li><li>Pas de biopsie hépatique dans la télangiectasie.</li></ul></template>

<template data-pop="pareto-i77-dfm" data-title="Pareto — Dysplasie fibromusculaire et dissections">
<p class="ratio" data-cover="i77-9,i77-10"></p>
<ul><li>Antihypertenseurs ; arrêt du tabac ; aspirine 75 à 100 mg raisonnable sans contre-indication (avis d’experts), surtout atteinte cervicale ou dissection ; pas de statine pour la dysplasie elle-même.</li><li>IEC ou ARA : créatinine et kaliémie à une ou deux semaines.</li><li>Angioplastie au ballonnet, stent seulement en sauvetage : hypertension résistante sous au moins trois médicaments et sténose de plus de 70 % (ESVS 2025, IIa C) ; guérison stricte 18 %, large 37 %.</li><li>ASTRAL et CORAL ne s’appliquent pas à la dysplasie.</li><li>Anévrisme rénal : réparation dès 3,0 cm, ou pendant la grossesse quelle que soit la taille.</li><li>Dissection mésentérique ou cœliaque isolée : traitement médical, antiagrégant à considérer, stent si ischémie intestinale, écho-Doppler annuel.</li><li>Médiolyse segmentaire : anévrismes viscéraux sans inflammation ; pas d’immunosuppresseur.</li></ul></template>

<template data-pop="pareto-i77-comp" data-title="Pareto — Compressions, fistules et autres lésions artérielles">
<p class="ratio" data-cover="i77-11,i77-12"></p>
<ul><li>Ligament arqué : diagnostic d’exclusion, sténose d’au moins 70 % par deux techniques dont un angioscanner en inspiration et expiration, validation pluridisciplinaire ; libération chirurgicale chez des patients sélectionnés ; pas de stent primaire.</li><li>Artère poplitée piégée : homme jeune sportif, claudication, pouls abolis en flexion plantaire ; chirurgie de libération.</li><li>Fistule acquise : après ponction fémorale ; frémissement, souffle continu ; écho-Doppler ; stent couvert ou chirurgie si persistante.</li><li>Saignement sentinelle sur site irradié → rupture imminente.</li><li>« Nécrose kystique de la média » = dégénérescence de la média, codée selon la lésion (I71).</li><li>Aortite : chercher vascularite, IgG4 et infection avant de coder I77.6.</li></ul></template>

<template data-pop="pareto-i77-thh" data-title="Pareto — Télangiectasie hémorragique héréditaire">
<p class="ratio" data-cover="i77-13,i77-14"></p>
<ul><li>Gènes : ENG, ACVRL1, SMAD4 (coloscopie dès 15 ans), plus rarement GDF2 ; variant trouvé dans 97 % des formes définitives.</li><li>Dépistage pulmonaire par échocardiographie de contraste, confirmation par scanner ; embolisation si artère nourricière d’au moins 3 mm.</li><li>Malformation pulmonaire : antibioprophylaxie, pas d’air intraveineux, pas de plongée.</li><li>Épistaxis : humidification → acide tranexamique → ablation ou antiangiogénique → septodermoplastie ou fermeture nasale ; méchage atraumatique.</li><li>Pomalidomide 4 mg : essai PATH-HHT 2024 positif ; hors indication.</li><li>Saignement digestif léger, modéré, sévère selon la réponse au fer ; bévacizumab si modéré à sévère.</li><li>Antithrombotiques autorisés si indiqués ; héparine ou antivitamine K préférées ; éviter la double antiagrégation.</li></ul></template>

<template data-pop="pareto-i77-cap" data-title="Pareto — Capillaires et codage I79">
<p class="ratio" data-cover="i77-15,i77-16"></p>
<ul><li>Angiome stellaire : artériole centrale, rayons, blanchiment centrifuge ; territoire cave supérieur ; nombreux = hépatopathie ; banal en petit nombre et pendant la grossesse.</li><li>Distinction : télangiectasie héréditaire sans rayons ; angiome plan Q82.5 ; nævus pigmentaire D22.</li><li>I79 = codes astérisque, jamais seuls : A52.0† puis I79.1* ; diabète avec quatrième caractère .5 puis I79.2*.</li><li>Aortite syphilitique : endartérite des vasa vasorum → anévrisme ascendant, insuffisance aortique, sténose ostiale coronaire.</li></ul></template>

<template data-pop="pareto-i77-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i77-17,i77-18"></p>
<ul><li>Dysplasie : pression, rein, anévrismes ; pas de dépistage systématique des apparentés asymptomatiques.</li><li>Télangiectasie : fer, malformations, dépistage familial ; risque de transmission 50 % par enfant.</li><li>Grossesse : dépister les malformations pulmonaires, les traiter au deuxième trimestre ; péridurale permise ; réparer un anévrisme viscéral quelle que soit sa taille ; arrêter IEC et ARA.</li><li>Enfant : test génétique, dépistage pulmonaire sans scanner, puis tous les cinq ans.</li><li>Insuffisance rénale : réduire l’acide tranexamique ; prudence avec l’iode et les IEC.</li></ul></template>

<template data-pop="pareto-i77-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i77-e-1,i77-e-2,i77-e-3,i77-e-4,i77-e-5"></p>
<ul><li>Référence de la dysplasie : angiographie avec gradient, réservée au geste ; gradient de plus de 10 % (seuil non validé dans la dysplasie).</li><li>Écho-Doppler rénal : pic de vitesse 180 à 285 cm/s selon le seuil, rapport rénal sur aortique supérieur à 3,5 ; normal ≠ exclusion.</li><li>Collier de perles plus large que l’artère = forme multifocale ; sténose focale = exclure une vascularite.</li><li>Compressions : imagerie en deux temps respiratoires ou avec manœuvres.</li><li>Fistule : flux artériel continu à basse résistance, veine artérialisée.</li><li>Bulles retardées dans le cœur gauche = malformation pulmonaire ; scanner sans injection pour confirmer.</li><li>Rénine élevée = rénovasculaire ; rénine effondrée = hyperaldostéronisme primaire ; LDH élevée et hématurie = infarctus rénal.</li></ul></template>

<template data-pop="pareto-i77-quiz" data-title="Pareto — Entraînement">
<p class="ratio" data-cover="i77-e-6"></p>
<ul><li>Accélération au tiers moyen chez une femme jeune → dysplasie → imagerie de la tête au bassin.</li><li>Bulles retardées et abondantes → scanner puis embolisation.</li><li>Ligament arqué : deux techniques, sténose d’au moins 70 %, équipe pluridisciplinaire, pas de stent.</li><li>Échec du fer oral → au moins modéré → fer intraveineux puis antiangiogénique.</li></ul></template>

<template data-pop="pareto-i77-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i77-sa,i77-sh,i77-sp,i77-sg"></p>
<ul><li>Rein et diaphragme mobiles → fracture des stents ; ligament arqué comprime en expiration.</li><li>Gastrocnémien médial mal migré → artère poplitée piégée.</li><li>Fibroplasie médiale = collier de perles ; intimale = sténose focale ; dégénérescence de la média = dissection aortique.</li><li>Télangiectasie = veinule reliée à une artériole sans capillaire, paroi pauvre en cellules murales.</li><li>Filtration du rein sténosé dépendante de l’angiotensine II → créatinine après IEC ou ARA.</li><li>Court-circuit : saturation = moyenne pondérée ; oxygène peu efficace ; orthodéoxie ; perte du filtre.</li><li>Voie BMP9-ALK1-endogline-SMAD4 défaillante → VEGF prédominant → antiangiogéniques.</li></ul></template>

<template data-pop="pareto-i77-pharma1" data-title="Pareto — Médicaments et doses">
<p class="ratio" data-cover="i77-p-1,i77-p-2,i77-p-3,i77-p-4"></p>
<ul><li>Aspirine 75 à 100 mg par jour : dysplasie sans contre-indication (raisonnable, avis d’experts), après angioplastie, dissection viscérale.</li><li>IEC ou ARA : contrôle à une ou deux semaines ; hausse de créatinine de plus de 30 % → réduire et chercher une sténose bilatérale.</li><li>Acide tranexamique : Cyklokapron 500 mg, 1 à 1,5 g deux à trois fois par jour ; réduire si rein altéré.</li><li>Bévacizumab 5 mg/kg par voie intraveineuse, hors indication ; pomalidomide 4 mg par jour, hors indication.</li><li>Fer oral 35 à 65 mg de fer élément par jour ou un jour sur deux ; intraveineux si échec.</li><li>Amoxicilline 2 g 30 à 60 minutes avant un soin dentaire en cas de malformation pulmonaire.</li><li>Benzathine pénicilline G 2,4 millions d’unités par semaine pendant trois semaines dans la syphilis tertiaire sans neurosyphilis.</li></ul></template>

<template data-pop="pareto-i77-pharma" data-title="Pareto — Interactions, surveillance et pratiques à éviter">
<p class="ratio" data-cover="i77-p-5"></p>
<ul><li>Acide tranexamique + œstrogènes → thrombose ; insuffisance rénale sévère = contre-indication.</li><li>IEC ou ARA + AINS + diurétique → chute de filtration.</li><li>Pomalidomide + fluvoxamine → exposition augmentée ; tératogène.</li><li>Bévacizumab : pression, protéinurie, cicatrisation.</li><li>À éviter : stent rénal d’emblée, corticoïdes dans la dysplasie, AINS et double antiagrégation dans la télangiectasie, cautérisations répétées, sprays d’antiangiogéniques, biopsie hépatique, plongée.</li></ul></template>
