
<!-- ===== FENÊTRES I77 : notions fondamentales et définitions ===== -->
<template data-pop="i77-tuniques" data-title="Les trois tuniques artérielles">
<div class="lab">Définition</div><p>Une artère musculaire comporte trois couches concentriques. L’intima, au contact du sang, est un endothélium posé sur une fine couche conjonctive et limité par la limitante élastique interne. La média est faite de cellules musculaires lisses, de fibres élastiques et de collagène ; elle est limitée par la limitante élastique externe. L’adventice est un tissu conjonctif qui contient des nerfs et, dans les grosses artères, des vasa vasorum.</p>
<div class="lab">Fonction de chaque tunique</div><p>L’endothélium empêche la coagulation au contact du sang et règle le tonus par le monoxyde d’azote. La média résiste à la pression et adapte le calibre par la contraction musculaire. L’adventice ancre l’artère et la nourrit de l’extérieur.</p>
<div class="lab">Corrélation clinique</div><p>Chaque maladie du chapitre touche une tunique précise. La fibroplasie médiale de la dysplasie désorganise la média ; la fibroplasie intimale épaissit l’intima ; la dégénérescence de la média prépare la dissection aortique ; l’aortite syphilitique détruit la média en obstruant les vasa vasorum de l’adventice.</p>
<div class="lab">Conséquence pratique</div><p>Une sténose par épaississement de l’intima répond au ballonnet différemment d’une média désorganisée. Une média fragile se dissèque lors d’un geste endovasculaire : c’est pourquoi les angioplasties de dysplasie se font avec des ballonnets adaptés et une montée en pression prudente.</p></template>

<template data-pop="i77-goldblatt" data-title="Mécanisme de Goldblatt : le rein ischémique">
<div class="lab">Expérience fondatrice</div><p>En 1934, Harry Goldblatt pose un clip partiel sur l’artère rénale d’un chien et provoque une hypertension durable. Cette expérience démontre qu’un rein mal perfusé élève la pression de tout l’organisme.</p>
<div class="lab">Mécanisme</div><p>La baisse de pression dans l’artériole afférente stimule la sécrétion de rénine. La rénine transforme l’angiotensinogène en angiotensine I, que l’enzyme de conversion transforme en angiotensine II. L’angiotensine II contracte les artérioles, stimule l’aldostérone, qui retient le sodium et élimine le potassium, et contracte l’artériole efférente du rein sténosé pour maintenir sa filtration.</p>
<div class="lab">Deux situations</div><p>Avec une sténose unilatérale, le rein controlatéral excrète le sodium en excès : l’hypertension dépend surtout de la rénine, et un IEC ou un ARA est très efficace. Avec une sténose bilatérale ou sur rein unique, le sodium est retenu : l’hypertension dépend du volume, et un bloqueur du système rénine-angiotensine peut faire chuter la filtration.</p>
<div class="lab">Conséquence pratique</div><p>Une hypokaliémie avec rénine élevée chez une hypertendue jeune oriente vers une hypertension rénovasculaire. La créatinine est contrôlée après tout IEC ou ARA.</p></template>

<template data-pop="i77-shunt" data-title="Court-circuit artérioveineux et court-circuit droit-gauche">
<div class="lab">Définition</div><p>Un court-circuit est un passage du sang qui évite le lit capillaire. Dans une fistule systémique, le sang artériel passe directement dans une veine. Dans une malformation pulmonaire, le sang de l’artère pulmonaire, désaturé, passe directement dans une veine pulmonaire puis dans le cœur gauche : c’est un court-circuit droit-gauche.</p>
<div class="lab">Conséquences mesurables</div><p>La saturation artérielle est la moyenne pondérée des sangs mélangés. Avec 20 % du débit court-circuité à 70 % de saturation et 80 % oxygéné à 98 %, la saturation vaut environ 92 %. L’oxygène à fort débit augmente peu la saturation, car il n’atteint pas le sang court-circuité.</p>
<div class="lab">Perte du filtre</div><p>Les capillaires pulmonaires arrêtent normalement les petits caillots, les bulles d’air et les bactéries. Un court-circuit les laisse passer vers les artères cérébrales : infarctus cérébral, embolie gazeuse et abcès cérébral.</p>
<div class="lab">Conséquence pratique</div><p>La gravité d’une malformation pulmonaire ne se juge pas à la saturation : une petite malformation qui ne désature pas peut quand même provoquer un abcès cérébral. Le dépistage concerne donc tous les patients.</p></template>

<template data-pop="i77-poiseuille" data-title="Loi de Poiseuille et sténose">
<div class="lab">Énoncé</div><p>Pour un écoulement laminaire dans un tube, le débit vaut Q = ΔP × π × r⁴ / (8 × η × L), où ΔP est la différence de pression, r le rayon, η la viscosité et L la longueur.</p>
<div class="lab">Exemple chiffré</div><p>Si le rayon passe de 3 à 1,5 mm, r⁴ est divisé par 16 : à différence de pression égale, le débit est divisé par 16. En pratique, la vasodilatation d’aval compense en partie : le débit de repos n’est réduit que par une sténose serrée, alors que le débit maximal, à l’effort ou après un repas, est limité plus tôt.</p>
<div class="lab">Limites</div><p>La loi suppose un écoulement laminaire, stationnaire, dans un tube rigide. Le sang est pulsatile, les artères sont élastiques, et une sténose crée des turbulences. La loi donne donc une tendance, pas une valeur exacte.</p>
<div class="lab">Conséquence pratique</div><p>Une série de sténoses modérées, comme dans un collier de perles, peut avoir un effet cumulé important : c’est pourquoi le gradient de pression mesuré est plus fiable que l’estimation visuelle du degré de sténose.</p></template>

<template data-pop="i77-histo-dfm" data-title="Fibroplasie et sous-types de dysplasie">
<div class="lab">Définition</div><p>La fibroplasie est une prolifération de cellules et de matrice extracellulaire, collagène surtout, qui désorganise une tunique artérielle. Elle n’est ni athéromateuse ni inflammatoire.</p>
<div class="lab">Sous-types histologiques anciens</div><p>La fibroplasie médiale, la plus fréquente, alterne des crêtes fibromusculaires et une média amincie : collier de perles plus large que l’artère. La fibroplasie périmédiale épaissit la partie externe de la média : perles plus petites que l’artère. La fibroplasie intimale épaissit l’intima : sténose focale. L’hyperplasie médiale est rare.</p>
<div class="lab">Classification actuelle</div><p>Le consensus de 2019 utilise l’imagerie : forme multifocale ou focale. Cette classification remplace l’histologie, car l’artère n’est plus prélevée pour le diagnostic.</p>
<div class="lab">Conséquence pratique</div><p>La forme focale, plus fréquente chez l’enfant et l’homme, répond moins bien au ballonnet et doit faire exclure une vascularite.</p></template>

<template data-pop="i77-haut-debit" data-title="Insuffisance cardiaque à haut débit">
<div class="lab">Définition</div><p>Insuffisance cardiaque dans laquelle le débit cardiaque est élevé, parce que les résistances vasculaires systémiques sont basses. Le cœur n’est pas d’abord défaillant ; il est surchargé.</p>
<div class="lab">Mécanisme</div><p>Une grande fistule, des malformations hépatiques, une anémie sévère ou une hyperthyroïdie abaissent la résistance totale. Le cœur augmente son débit pour maintenir la pression ; le rein retient du sodium. La surcharge de volume dilate les cavités et élève les pressions de remplissage.</p>
<div class="lab">Signes</div><p>Tachycardie, pression différentielle large, extrémités chaudes, souffle d’éjection, turgescence jugulaire et œdèmes. L’échocardiographie montre un débit élevé et des cavités dilatées.</p>
<div class="lab">Piège</div><p>Dans la télangiectasie, l’anémie aggrave le haut débit des malformations hépatiques. Corriger l’anémie fait partie du traitement de l’insuffisance cardiaque.</p></template>

<template data-pop="i77-embolie-paradoxale" data-title="Embolie paradoxale">
<div class="lab">Définition</div><p>Passage d’un embole veineux dans la circulation artérielle systémique à travers un court-circuit droit-gauche. Il est « paradoxal », car un caillot veineux devrait s’arrêter dans le poumon.</p>
<div class="lab">Voies</div><p>Un foramen ovale perméable, une communication interauriculaire ou une malformation artérioveineuse pulmonaire. Dans la télangiectasie, la malformation pulmonaire est la voie principale.</p>
<div class="lab">Conséquences</div><p>Infarctus cérébral, accident ischémique transitoire, embolie gazeuse après une perfusion mal purgée, abcès cérébral par passage de bactéries d’origine dentaire ou cutanée.</p>
<div class="lab">Conséquence pratique</div><p>Un abcès cérébral ou un infarctus cérébral sans cause chez un sujet jeune impose une échocardiographie de contraste, qui recherche un court-circuit et en situe le niveau par le délai d’arrivée des bulles.</p></template>

<template data-pop="i77-mav" data-title="Malformations artérioveineuses viscérales">
<div class="lab">Définition</div><p>Communication anormale entre une ou plusieurs artères et une ou plusieurs veines, sans lit capillaire, dans un organe. Dans la télangiectasie, elles touchent le poumon, le cerveau, la moelle et le foie.</p>
<div class="lab">Complications par organe</div><p>Poumon : désaturation, embolie paradoxale, abcès cérébral, hémoptysie, hémothorax. Cerveau : hémorragie, épilepsie. Foie : insuffisance cardiaque à haut débit, hypertension portale, ischémie biliaire. Tube digestif : saignement chronique.</p>
<div class="lab">Codage</div><p>Dans la télangiectasie, le code I78.0 décrit la maladie causale. Une malformation artérioveineuse isolée, sans maladie héréditaire, se code selon son siège : Q27.3 en périphérie, I67.1 pour une forme cérébrale acquise, Q28 pour une forme cérébrale congénitale.</p>
<div class="lab">Conséquence pratique</div><p>La découverte d’une malformation pulmonaire isolée fait rechercher la télangiectasie : la majorité des malformations pulmonaires sont dues à cette maladie dans les séries publiées.</p></template>

<template data-pop="i77-rendu" data-title="Rendu, Osler et Weber">
<div class="lab">Histoire</div><p>Henri Rendu décrit en 1896 l’association d’épistaxis familiales et de télangiectasies. William Osler distingue en 1901 la maladie de l’hémophilie. Frederick Parkes Weber complète la description en 1907. Le nom de « télangiectasie hémorragique héréditaire » est proposé ensuite par Hanes en 1909.</p>
<div class="lab">Usage actuel</div><p>Les recommandations internationales utilisent le nom descriptif. Les éponymes restent dans la CIM-10-GM 2024 (I78.0) et dans l’usage courant.</p>
<div class="lab">Piège</div><p>Le nom d’Osler désigne aussi les nodosités de l’endocardite : la « maladie de Rendu-Osler » n’a aucun lien avec les « faux panaris d’Osler ».</p></template>

<template data-pop="i77-dague" data-title="Système dague-astérisque de la CIM-10">
<div class="lab">Principe</div><p>Certaines maladies se manifestent dans un autre organe. La CIM-10 code alors la cause par un code marqué d’une dague (†) et la manifestation par un code marqué d’un astérisque (*).</p>
<div class="lab">Règle</div><p>Le code astérisque ne s’emploie jamais seul. Il suit toujours le code dague. Exemple : aortite syphilitique = A52.0† puis I79.1*.</p>
<div class="lab">Pourquoi</div><p>Le double codage permet de compter à la fois les maladies causales et les atteintes d’organe dans les statistiques et la facturation hospitalière, sans perdre l’information sur la cause.</p>
<div class="lab">Piège</div><p>Coder I79.2* seul pour une artériopathie diabétique fait disparaître le diabète de la statistique. La séquence correcte associe le code du diabète, avec le quatrième caractère .5, et I79.2*.</p></template>

<template data-pop="i77-consensus-dfm" data-title="Consensus international de la dysplasie fibromusculaire (2019)">
<div class="lab">Source</div><p>Gornik, Persu et al., <i>Vascular Medicine</i> 2019;24:164–189, publié simultanément dans le <i>Journal of Hypertension</i> 2019;37:229–252. Document de la Society for Vascular Medicine et du groupe de travail « Hypertension et rein » de la Société européenne d’hypertension. Il remplace les documents européen et américain de 2014.</p>
<div class="lab">Définition</div><p>Maladie artérielle idiopathique, segmentaire, non athéromateuse et non inflammatoire de la musculature de la paroi, qui sténose les artères de petit et moyen calibre.</p>
<div class="lab">Critère diagnostique</div><p>Au moins une lésion focale ou multifocale sur l’imagerie. Un anévrisme, une dissection ou une tortuosité isolés ne suffisent pas.</p>
<div class="lab">Recommandations principales</div><p>Imagerie unique de la tête au bassin chez tout patient ; aspirine 75 à 100 mg par jour en l’absence de contre-indication ; angioplastie au ballonnet sans stent pour les indications retenues ; arrêt du tabac ; protocole commun d’angiographie et d’angioplastie.</p>
<div class="lab">Limites de la lecture</div><p>Le texte intégral n’a pas été lu pour cette rédaction ; les recommandations citées proviennent du résumé, du communiqué de la Society for Vascular Medicine et de leur reprise dans l’ESVS 2025, lue en texte intégral.</p></template>

<template data-pop="i77-curacao" data-title="Critères de Curaçao (2000)">
<div class="lab">Source</div><p>Shovlin et al., <i>American Journal of Medical Genetics</i> 2000;91:66–67. Consensus du comité scientifique de la fondation de la maladie, réuni à Curaçao. Retenus par les recommandations internationales de 2011 et de 2020.</p>
<div class="lab">Les quatre critères</div><p>1. Épistaxis spontanées et récidivantes. 2. Télangiectasies multiples aux sites caractéristiques : lèvres, cavité buccale, doigts, nez. 3. Lésion viscérale : télangiectasies digestives, malformation artérioveineuse pulmonaire, hépatique, cérébrale ou médullaire. 4. Apparenté du premier degré atteint selon ces critères.</p>
<div class="lab">Interprétation</div><p>Trois ou quatre critères : diagnostic définitif. Deux : possible ou suspecté. Zéro ou un : improbable.</p>
<div class="lab">Limites</div><p>L’expression dépend de l’âge : un enfant atteint peut n’avoir aucun critère. Le test génétique complète alors les critères. Inversement, des épistaxis banales et un parent atteint donnent deux critères chez un enfant qui n’est peut-être pas porteur.</p>
<div class="lab">Aide-mémoire</div><p>« Nez, peau, viscère, famille » : aide pédagogique, non critère officiel.</p></template>

<template data-pop="i77-registre" data-title="Registre américain de la dysplasie fibromusculaire">
<div class="lab">Source</div><p>Olin et al., <i>Circulation</i> 2012;125:3182–3190 ; 447 patients des premiers centres participants.</p>
<div class="lab">Résultats principaux</div><p>91 % de femmes ; âge moyen au diagnostic de 52 ans. Hypertension chez environ deux patients sur trois, céphalées chez environ la moitié, acouphène pulsatile chez environ un quart. Les artères rénales et carotides extracrâniennes étaient les plus atteintes ; une dissection ou un anévrisme était fréquent.</p>
<div class="lab">Limites</div><p>Un registre de centres experts recrute les patients diagnostiqués, donc ceux qui ont été explorés : il surestime probablement la proportion de femmes et de formes symptomatiques. Il décrit des associations, pas des causes.</p>
<div class="lab">Conséquence pratique</div><p>Le profil type aide à penser à la maladie ; il ne doit pas empêcher de la chercher chez un homme ou chez un patient âgé.</p></template>

<template data-pop="i77-vascern" data-title="VASCERN et centres experts">
<div class="lab">Définition</div><p>VASCERN est le réseau européen de référence des maladies vasculaires rares multisystémiques. Il réunit des centres experts de plusieurs pays et publie des parcours de soins, notamment pour la télangiectasie hémorragique héréditaire et les maladies vasculaires héréditaires.</p>
<div class="lab">Situation suisse</div><p>La Suisse n’est pas membre de l’Union européenne ; la participation formelle d’hôpitaux suisses à ce réseau n’a pas été vérifiée lors de la rédaction. En pratique, les patients suisses sont suivis par les centres universitaires de médecine interne, d’angiologie, d’oto-rhino-laryngologie et de pneumologie.</p>
<div class="lab">Conséquence pratique</div><p>Les décisions d’antiangiogénique, de dépistage cérébral ou d’embolisation se prennent dans un centre ayant l’expérience de la maladie.</p></template>

<template data-pop="i77-phactr1" data-title="Locus PHACTR1 : un variant partagé">
<div class="lab">Donnée</div><p>Une étude d’association pangénomique (Kiando et al., <i>PLoS Genetics</i> 2016) a montré qu’un variant fréquent du locus PHACTR1 est associé à la dysplasie fibromusculaire. Le même locus est associé à la dissection coronaire spontanée et à la migraine ; l’allèle opposé est associé à la maladie coronaire athéromateuse.</p>
<div class="lab">Interprétation</div><p>Ce lien suggère une biologie commune de la paroi artérielle entre la dysplasie et la dissection coronaire spontanée. Il ne prouve pas un mécanisme précis.</p>
<div class="lab">Limite</div><p>L’effet d’un variant fréquent sur le risque individuel est modeste. Il n’existe pas de test génétique diagnostique de la dysplasie.</p>
<div class="lab">Conséquence pratique</div><p>La coexistence de la dysplasie et de la dissection coronaire spontanée justifie l’imagerie extracoronaire après une dissection coronaire.</p></template>

<template data-pop="i77-veds" data-title="Syndrome d’Ehlers-Danlos vasculaire">
<div class="lab">Définition</div><p>Maladie autosomique dominante due à un variant du gène COL3A1, qui code le collagène de type III. Ce collagène donne leur résistance aux artères, à l’intestin et à l’utérus.</p>
<div class="lab">Signes d’alerte</div><p>Ruptures artérielles, digestives ou utérines avant 40 ans, peau fine et translucide, ecchymoses faciles, visage caractéristique, pneumothorax, antécédents familiaux de mort subite jeune.</p>
<div class="lab">Pourquoi le distinguer de la dysplasie</div><p>Les deux maladies donnent des dissections et des anévrismes de moyen calibre. Dans l’Ehlers-Danlos vasculaire, un cathétérisme artériel ou une chirurgie exposent à des déchirures graves : l’imagerie non invasive est privilégiée.</p>
<div class="lab">Traitement</div><p>L’essai BBEST (2010) a suggéré que le céliprolol réduit les événements artériels ; la disponibilité de ce médicament en Suisse n’a pas été confirmée lors de la rédaction. La prise en charge est détaillée dans I71 — Anévrismes et dissections artérielles (C-01-Cardiologie).</p></template>

<template data-pop="i77-ligament" data-title="Ligament arqué médian">
<div class="lab">Anatomie</div><p>Bande fibreuse ou musculaire qui unit les deux piliers du diaphragme en avant de l’aorte, au niveau de la première vertèbre lombaire, juste au-dessus de l’origine du tronc cœliaque.</p>
<div class="lab">Mécanisme</div><p>Si le diaphragme s’insère bas ou si le tronc cœliaque naît haut, le ligament croise l’artère. En expiration, le diaphragme remonte et la compression augmente.</p>
<div class="lab">Fréquence et signification</div><p>La configuration compressive est fréquente chez des sujets sans symptôme. Elle ne devient un syndrome que si des douleurs abdominales chroniques restent inexpliquées après un bilan complet.</p>
<div class="lab">Débat</div><p>L’origine de la douleur est discutée : ischémie, irritation du plexus cœliaque, ou les deux. L’essai randomisé CARoSO, contre opération simulée, doit trancher l’efficacité de la libération chirurgicale (ESVS 2025).</p></template>

<template data-pop="i77-poplite" data-title="Artère poplitée piégée : forme et manœuvres">
<div class="lab">Définition</div><p>Compression de l’artère poplitée par une structure musculaire ou fibreuse anormale, ou par un muscle hypertrophié.</p>
<div class="lab">Manœuvres de provocation</div><p>Le médecin palpe les pouls pédieux et tibial postérieur au repos, puis pendant une flexion plantaire active contre résistance et pendant une dorsiflexion passive du pied, genou tendu. La disparition du pouls ou la baisse du flux Doppler pendant la manœuvre est évocatrice.</p>
<div class="lab">Valeur et limites</div><p>Une compression positionnelle s’observe chez une partie des sujets sains et sportifs. La manœuvre positive n’a de valeur qu’avec des symptômes concordants et une structure anormale à l’imagerie, ou un muscle hypertrophié dans la forme fonctionnelle.</p>
<div class="lab">Conséquence pratique</div><p>Une claudication du mollet chez un homme jeune sans facteur de risque fait pratiquer ces manœuvres et un écho-Doppler dynamique, avant qu’une thrombose poplitée ne survienne.</p></template>

<template data-pop="i77-rich" data-title="Classification de Rich modifiée">
<div class="lab">Types</div><p>Type I : l’artère contourne en dedans un chef médial du gastrocnémien normalement inséré. Type II : le chef médial s’insère trop en dehors et l’artère passe en dedans de lui. Type III : un faisceau accessoire du muscle comprime l’artère. Type IV : l’artère passe sous le muscle poplité ou sous une bande fibreuse. Type V : l’un des types précédents avec compression de la veine poplitée. Type VI, ou fonctionnel : anatomie normale, compression par un muscle hypertrophié.</p>
<div class="lab">Origine</div><p>Les types I à IV résultent d’une anomalie de la migration embryonnaire du chef médial du gastrocnémien par rapport à la formation de l’artère.</p>
<div class="lab">Limite</div><p>Des séries récentes proposent d’autres classifications, car certains patients n’entrent dans aucun type. La classification guide la chirurgie mais ne change pas le principe : libérer l’artère.</p></template>

<template data-pop="i77-mediolyse" data-title="Médiolyse artérielle segmentaire">
<div class="lab">Définition</div><p>Maladie non inflammatoire de la média, caractérisée par une vacuolisation puis une lyse des cellules musculaires lisses de la média externe. Elle touche surtout les artères mésentériques, cœliaques et rénales.</p>
<div class="lab">Mécanisme</div><p>La rupture des vacuoles lèse la média interne et crée une porte d’entrée pour une dissection ; la paroi amincie forme des anévrismes en chapelet.</p>
<div class="lab">Présentation</div><p>Hémorragie abdominale ou rétropéritonéale, douleur abdominale, dissection viscérale, souvent chez l’adulte d’âge moyen.</p>
<div class="lab">Piège</div><p>L’aspect d’anévrismes multiples des artères digestives imite une polyartérite noueuse. L’absence de syndrome inflammatoire et d’atteinte systémique oriente vers la médiolyse ; les immunosuppresseurs n’ont pas de place.</p>
<div class="lab">Codage</div><p>I77.88, autres atteintes précisées des artères et artérioles.</p></template>

<template data-pop="i77-degenerescence" data-title="Dégénérescence de la média (nécrose kystique d’Erdheim-Gsell)">
<div class="lab">Terminologie</div><p>Le terme ancien de « nécrose kystique de la média », associé aux noms d’Erdheim et de Gsell, désigne des accumulations de matrice mucoïde dans la média aortique. Le consensus de pathologie de 2016 (Halushka et al., <i>Cardiovascular Pathology</i>) recommande de parler de dégénérescence de la média, car il n’y a ni nécrose ni kyste vrais.</p>
<div class="lab">Lésions</div><p>Perte des cellules musculaires lisses, fragmentation et perte des lames élastiques, accumulation de matrice extracellulaire mucoïde.</p>
<div class="lab">Contextes</div><p>Syndrome de Marfan et autres aortopathies héréditaires, bicuspidie aortique, hypertension artérielle et vieillissement.</p>
<div class="lab">Codage et renvoi</div><p>La lésion histologique se code selon sa manifestation clinique : dissection aortique I71.0, anévrisme aortique I71.1 à I71.9. Le rattachement exact du terme histologique isolé dans l’index alphabétique de la CIM-10-GM 2024 n’a pas été vérifié ; il ne correspond pas à I77.5. L’enseignement clinique est dans I71.</p></template>
