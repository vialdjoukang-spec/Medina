<section class="ilot" id="i85-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. Daniel B., 58 ans, patient fictif dont le cas suit tout le cours, est employé de commerce à Neuchâtel. Il boit environ six verres standard par jour depuis vingt ans et n’a jamais consulté pour son foie. À 23 heures, il vomit du sang rouge à trois reprises, puis il fait un malaise en se levant. Aux urgences, sa pression artérielle est de 92/58 mmHg et sa fréquence cardiaque de 118/min. Il est conscient et orienté.</p>
<p>L’examen montre des angiomes stellaires sur le thorax, une érythrose palmaire, une rate palpable et une ascite de faible abondance. Le bilan initial donne une hémoglobine de 78 g/L, des plaquettes à 88 G/L, un INR de 1,6, une bilirubine de 52 µmol/L, une albumine de 27 g/L et une créatinine de 98 µmol/L. Il ne prend aucun médicament.</p>
<p><b>Ce saignement provient-il de varices ? Quels gestes faut-il accomplir dans la première heure, et lesquels sont inutiles ou dangereux ? Dans quel délai faut-il une endoscopie ? M. B. doit-il recevoir un shunt intrahépatique dès les premiers jours ? Comment éviter qu’il saigne à nouveau ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître une hypertension portale avant toute hémorragie, à l’aide de l’élastographie et des plaquettes. Il sait prescrire et titrer un bêtabloquant non sélectif, conduire la prise en charge d’une rupture de varices heure par heure et poser l’indication d’un TIPS préemptif. Il sait aussi distinguer les varices gastriques selon Sarin et reconnaître les varices des autres localisations de la catégorie I86 : varices sublinguales, varicocèle, varices pelviennes et vulvaires. Le référentiel est la conférence de consensus Baveno VIII, tenue en mars 2026 et coordonnée notamment depuis l’Hôpital de l’Île à Berne.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i85-ohm">loi d’Ohm appliquée à la circulation portale (pression = débit × résistance)</button>, la <button class="w" data-k="i85-anastomoses">géographie des anastomoses portosystémiques (où naissent les varices)</button> et la <button class="w" data-k="i85-laplace">tension pariétale d’une varice (pourquoi elle se rompt)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i85-1"><h2><span class="n">1</span>Définitions, classifications et codage</h2>
<p>Une <b>varice</b> est une veine dilatée, allongée et tortueuse, dont la paroi s’est amincie. Dans l’œsophage et l’estomac, la varice n’est pas une maladie primitive de la paroi veineuse : c’est une <b>voie de dérivation</b> qui s’ouvre parce que le sang portal ne traverse plus le foie sous une pression normale. Le sang reflue alors vers la veine gastrique gauche, puis vers les veines sous-muqueuses de l’œsophage, qui rejoignent la veine cave supérieure. Comprendre une varice œsophagienne revient donc à comprendre une hypertension portale.</p>
<h3>1.1 Hypertension portale : définitions hémodynamiques</h3>
<p>La pression portale se mesure indirectement par le <button class="w" data-k="i85-hvpg">gradient de pression veineuse hépatique (HVPG, technique et seuils)</button>. Le HVPG est la différence entre la pression sus-hépatique bloquée, qui reflète la pression sinusoïdale, et la pression sus-hépatique libre. Il mesure ainsi la résistance que le foie oppose au sang portal, indépendamment de la pression abdominale. Chaque seuil du tableau ci-dessous correspond à un événement clinique observé dans les cohortes ; c’est pourquoi ils structurent toute la prise en charge.</p>
<table class="t"><tr><th>Gradient (HVPG)</th><th>Signification</th><th>Conséquence clinique</th></tr>
<tr><td>1 à 5 mmHg</td><td>Valeur normale</td><td>Pas d’hypertension portale</td></tr>
<tr><td>6 à 9 mmHg</td><td>Hypertension portale infraclinique</td><td>Pas de varices ni d’ascite attendues ; le risque de décompensation reste faible</td></tr>
<tr><td>≥ 10 mmHg</td><td><b>Hypertension portale cliniquement significative</b> (Baveno VI, Baveno VII et Baveno VIII)</td><td>Des varices peuvent se former ; le risque de décompensation augmente : un bêtabloquant non sélectif devient indiqué</td></tr>
<tr><td>≥ 12 mmHg</td><td>Seuil de rupture</td><td>Les varices saignent rarement au-dessous de ce niveau ; il sert de cible thérapeutique</td></tr>
<tr><td>≥ 16 mmHg</td><td>Hypertension portale sévère</td><td>Mortalité accrue après une chirurgie abdominale non hépatique (Baveno VII)</td></tr>
<tr><td>≥ 20 mmHg pendant une hémorragie</td><td>Haut risque d’échec</td><td>Critère de TIPS préemptif (Baveno VIII, 5.31)</td></tr></table>
<p>Le médecin retient d’abord la ligne des 10 mmHg : c’est la frontière entre une cirrhose où l’on surveille et une cirrhose où l’on traite pour prévenir la décompensation. L’erreur fréquente consiste à attendre l’apparition des varices pour traiter, alors que le seuil hémodynamique est franchi avant elles. Chez M. B., la splénomégalie, les plaquettes à 88 G/L et l’ascite montrent sans mesure invasive que ce seuil est dépassé depuis longtemps.</p>
<h3>1.2 Maladie hépatique chronique avancée compensée et décompensation</h3>
<p>Baveno VIII conserve la notion de <button class="w" data-k="i85-cacld">maladie hépatique chronique avancée compensée (définition par l’élastographie)</button>. Ce terme désigne le continuum entre la fibrose sévère et la cirrhose, reconnu par une élasticité hépatique supérieure à 10 kPa plutôt que par une biopsie. Il remplace « cirrhose compensée » lorsque le diagnostic repose sur des tests non invasifs (Baveno VIII, 1.1 et 1.2). La <b>décompensation</b> est définie par trois événements : une ascite cliniquement évidente due à l’hypertension portale, une hémorragie variceuse ou une encéphalopathie hépatique manifeste de grade West Haven II ou plus (Baveno VIII, 3.3). Une ascite visible seulement en imagerie ne constitue pas une décompensation (3.4).</p>
<p>Cette définition a une conséquence directe. Le passage de l’état compensé à l’état décompensé augmente nettement la mortalité, car la maladie n’est plus seulement hémodynamique : la fonction hépatique, le rein et l’immunité se dégradent ensemble (3.1). L’objectif principal du traitement d’une hypertension portale compensée est donc de <b>prévenir la décompensation</b>, et non plus seulement de prévenir le saignement (3.2 e).</p>
<h3>1.3 Varices œsophagiennes : taille et signes rouges</h3>
<p>L’endoscopiste décrit la taille des varices en deux classes. Les <b>petites varices</b> mesurent moins de 5 mm ; les <b>grandes varices</b> mesurent plus de 5 mm. Il recherche aussi les <button class="w" data-k="i85-signes-rouges">signes rouges (zébrures, taches cerise, taches hématocystiques)</button>, qui correspondent à des zones où la paroi est très mince. Une varice est dite « à haut risque » lorsqu’elle est grande, lorsqu’elle porte des signes rouges ou lorsqu’elle survient chez un patient en classe C de <button class="w" data-k="i85-child">Child-Pugh (calcul et interprétation)</button>. Ces trois éléments augmentent la tension de la paroi ou traduisent une hypertension portale plus sévère.</p>
<h3>1.4 Varices gastriques : classification de Sarin</h3>
<p>Baveno VIII recommande la classification de Sarin, car le siège de la varice gastrique prédit le risque hémorragique et choisit le traitement (5.38). Le tableau ci-dessous la résume ; le lecteur cherche d’abord si la varice prolonge une varice œsophagienne ou si elle est isolée.</p>
<table class="t"><tr><th>Type</th><th>Siège</th><th>Traitement de l’hémorragie</th></tr>
<tr><td><button class="w" data-k="i85-sarin">GOV1</button></td><td>Prolonge une varice œsophagienne sous le cardia, le long de la petite courbure</td><td>Comme une varice œsophagienne : ligature</td></tr>
<tr><td>GOV2</td><td>Prolonge une varice œsophagienne vers le fundus</td><td>Colle de cyanoacrylate ou traitement échoendoscopique, puis TIPS</td></tr>
<tr><td>IGV1</td><td>Isolée dans le fundus</td><td>Comme GOV2 ; rechercher une thrombose de la veine splénique</td></tr>
<tr><td>IGV2</td><td>Isolée ailleurs dans l’estomac</td><td>Individualisé, souvent endovasculaire</td></tr></table>
<p>La lecture utile oppose GOV1, traitée comme l’œsophage, aux varices cardiofundiques GOV2 et IGV1, plus volumineuses et plus graves. L’erreur fréquente consiste à ligaturer une grosse varice fundique : l’élastique tombe en quelques jours et laisse un ulcère sur un vaisseau de gros calibre, qui peut saigner abondamment.</p>
<h3>1.5 Codage CIM-10-GM 2024 : le piège de la double classification</h3>
<p>La catégorie <b>I85</b> distingue les varices œsophagiennes hémorragiques (I85.0) et non hémorragiques (I85.9). La catégorie <b>I86</b> regroupe les varices d’autres localisations : sublinguales (I86.0), scrotales ou varicocèle (I86.1), pelviennes (I86.2), vulvaires (I86.3), gastriques (I86.4) et d’autres sièges précisés (I86.8), qui comprennent l’intestin grêle (I86.80), le côlon (I86.81) et le rectum (I86.82). Les varices du membre inférieur relèvent de I83, traitées dans le cours I83 — Varices des membres inférieurs (C-01-Cardiologie).</p>
<div class="trap"><span class="k">Piège</span>Chez un patient cirrhotique, I85 n’est pas le bon code. La CIM-10-GM exclut de I85 et de I86.4 les varices survenant au cours d’une maladie du foie ou d’une schistosomiase. Le codeur emploie alors le système croix-astérisque : la maladie causale porte la croix (par exemple <button class="w" data-k="i85-codage">K74.6† ou K70.3†</button>), et la manifestation porte l’astérisque, I98.2* sans hémorragie ou I98.3* avec hémorragie. M. B. se code donc avec sa cirrhose alcoolique et I98.3*. Les codes I85 et I86.4 restent réservés aux varices dont la cause n’est pas hépatique, par exemple une thrombose de la veine splénique.</div>
<div class="key"><b>À retenir.</b> Une varice œsophagienne est une collatérale portosystémique. Le HVPG mesure l’hypertension portale ; le seuil de 10 mmHg définit l’hypertension portale cliniquement significative et l’indication d’un bêtabloquant non sélectif. La décompensation comprend l’ascite, l’hémorragie variceuse et l’encéphalopathie manifeste. La taille, les signes rouges et la classe C de Child-Pugh définissent le haut risque, et la classification de Sarin oriente le traitement des varices gastriques. L’épidémiologie montre maintenant combien de patients sont concernés.</div>
</section>

<section class="ilot" id="i85-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2>
<p>En Suisse, les hospitalisations liées à la cirrhose ont augmenté de 1 631 en 1998 à 4 052 en 2020, selon une étude nationale fondée sur la statistique médicale des hôpitaux (Favre-Bulle et al., 2024). Les hommes représentaient 68,7 % des patients. La maladie alcoolique du foie restait la première cause en 2020 (47,9 %), suivie par la stéatose hépatique d’origine métabolique (42,7 %, estimée par exclusion des autres causes), tandis que la cirrhose liée au VHC passait de 12,3 % en 2012 à 3,2 % en 2020. La mortalité hospitalière a diminué de 12,1 % à 9,7 % entre 2012 et 2020.</p>
<p>Cette évolution a deux explications vérifiables. Les antiviraux à action directe guérissent l’hépatite C, ce qui supprime une cause majeure de progression. À l’inverse, l’obésité et le diabète augmentent la part des maladies métaboliques. Le médecin suisse rencontrera donc de plus en plus de varices chez des patients obèses et diabétiques, chez qui l’élastographie est plus difficile à interpréter.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de registre suisse des varices ni des hémorragies variceuses, et l’étude citée ne donne pas leur fréquence. Les chiffres d’histoire naturelle ci-dessous proviennent de cohortes européennes et de revues de référence.</div>
<p>Les varices ne sont pas présentes d’emblée chez tous les cirrhotiques. Dans une étude transversale de 494 patients, dont 48 % étaient décompensés, 38 % avaient des varices œsophagiennes au moment du dépistage. Chez les patients sans varices au départ, l’incidence de nouvelles varices passait de 5 % à un an à 28 % à trois ans (revue de Jachs et al., 2021). Les varices grossissent parce que la pression portale continue de monter tant que la cause hépatique persiste.</p>
<p>La rupture variceuse reste l’une des urgences les plus graves de l’hépatologie. Sa mortalité à six semaines atteint 15 à 20 %, et environ 30 % chez les patients en classe C de Child-Pugh, alors qu’elle est très faible en classe A (Mallet et al., 2017). Cette différence s’explique par le terrain : un foie défaillant ne supporte ni l’hypoperfusion, ni l’infection, ni la surcharge protéique du sang digéré. Sans prophylaxie secondaire, le risque de récidive atteint 60 % et celui de décès 33 % au cours de la première année. C’est pourquoi un premier saignement impose toujours un traitement de fond.</p>
<p>Les autres varices de la catégorie I86 ont une épidémiologie différente. La varicocèle touche environ 15 % des hommes et 35 à 40 % des hommes consultant pour infertilité (<button class="w" data-k="i85-eau">EAU 2026</button>). Les varices sublinguales sont fréquentes après 60 ans : 33 % des 1 139 patients dentaires de 48 à 84 ans d’une cohorte suédoise en présentaient (Bergh et al., 2023).</p>
<div class="key"><b>À retenir.</b> La cirrhose hospitalisée augmente en Suisse, portée par l’alcool et la maladie métabolique. Un tiers environ des cirrhotiques ont des varices au dépistage. Une rupture tue 15 à 20 % des patients en six semaines, davantage en classe C, et récidive dans 60 % des cas en un an sans prophylaxie. La physiopathologie explique ces chiffres.</div>

<section class="ilot" id="i85-3"><h2><span class="n">3</span>Physiopathologie de l’hypertension portale</h2>
<p>La veine porte reçoit environ 1 à 1,5 L/min de sang venant de l’intestin, de la rate, du pancréas et de l’estomac. Normalement, ce débit traverse les sinusoïdes hépatiques sous une très faible résistance : le gradient de pression entre veine porte et veines sus-hépatiques reste de 1 à 5 mmHg. Selon la <button class="w" data-k="i85-ohm">loi d’Ohm (ΔP = Q × R)</button>, ce gradient ne peut augmenter que si la résistance, le débit, ou les deux, augmentent. La cirrhose fait les deux. Le raisonnement suit la chaîne : <b>lésion hépatique → résistance intrahépatique accrue → vasodilatation splanchnique et hyperdébit portal → collatérales portosystémiques → varices → rupture.</b></p>
<h3>3.1 Premier temps : la résistance intrahépatique</h3>
<p>La résistance comporte une part <b>structurale</b>, majoritaire, et une part <b>dynamique</b>, réversible. La part structurale vient de la fibrose, des nodules de régénération qui compriment les veinules et de la <button class="w" data-k="i85-capillarisation">capillarisation des sinusoïdes (perte des fenestrations)</button>. La part dynamique vient de la contraction des <button class="w" data-k="i85-stellaires">cellules étoilées activées (myofibroblastes périsinusoïdaux)</button>. Ces cellules se contractent parce que l’endothélium sinusoïdal malade produit trop peu de monoxyde d’azote et trop d’endothéline 1. C’est cette part dynamique que le carvédilol, par son effet alpha-1-bloquant, peut réduire.</p>
<h3>3.2 Deuxième temps : la vasodilatation splanchnique</h3>
<p>Une fois la pression portale élevée, les artérioles splanchniques se dilatent, sous l’effet d’un excès local de NO, de glucagon et d’autres peptides vasodilatateurs, et de la <button class="w" data-k="i85-translocation">translocation bactérienne intestinale (endotoxines)</button>. Le débit entrant dans la veine porte augmente alors. La circulation devient <button class="w" data-k="i85-hyperdynamique">hyperdynamique (débit cardiaque élevé, résistances systémiques basses)</button> : la pression artérielle baisse, le système rénine-angiotensine-aldostérone et le système sympathique s’activent, et le rein retient du sodium. Cette séquence explique à la fois l’ascite et l’entretien de l’hypertension portale. Elle explique aussi l’action des médicaments : le bêtabloquant non sélectif et la terlipressine réduisent le débit entrant, alors que le TIPS supprime la résistance.</p>
<h3>3.3 Troisième temps : les collatérales et la varice</h3>
<p>Le sang portal cherche des voies vers la circulation systémique à travers des <button class="w" data-k="i85-anastomoses">anastomoses portosystémiques préexistantes</button>. Ces vaisseaux embryonnaires s’ouvrent et se remodèlent sous l’effet de l’hyperpression et de facteurs angiogéniques comme le VEGF. La figure 1 montre les principaux sites. Les collatérales ne décomprimeront jamais suffisamment la veine porte, car elles opposent elles-mêmes une résistance et parce que le débit splanchnique continue d’augmenter.</p>

<p>La lecture de la figure commence par la veine gastrique gauche, car c’est elle qui alimente les varices œsophagiennes, les plus fréquentes. Les veines gastriques courtes, venues de la rate, expliquent les varices fundiques ; c’est aussi pourquoi une thrombose isolée de la veine splénique crée des varices fundiques sans varices œsophagiennes. L’erreur fréquente est de croire que la tête de méduse est le signe le plus courant : elle est en réalité rare, alors que la splénomégalie et la thrombopénie sont presque constantes.</p>
<h3>3.4 Quatrième temps : la rupture</h3>
<p>Dans la <button class="w" data-k="i85-jonction">zone palissadique de la jonction œsogastrique</button>, les veines sont superficielles, longitudinales et peu soutenues par le tissu de voisinage. La tension de leur paroi suit la <button class="w" data-k="i85-laplace">loi de Laplace (tension = pression × rayon / épaisseur)</button>. Une varice saigne lorsque cette tension dépasse la résistance de sa paroi. Trois facteurs l’augmentent : la pression intravariqueuse, donc le HVPG ; le rayon, d’où le risque des grandes varices ; et l’amincissement de la paroi, visible sous forme de signes rouges. La relation explique chaque traitement : le bêtabloquant baisse la pression, la ligature supprime le rayon, et le TIPS abaisse le gradient.</p>
<p>Le saignement aggrave lui-même la situation. Le sang perdu déclenche une vasoconstriction réflexe, puis la transfusion et le remplissage remontent la pression portale. Le sang digéré apporte une charge protéique qui produit de l’ammoniac, d’où l’<button class="w" data-k="i85-encephalopathie">encéphalopathie hépatique (mécanisme et grades)</button>. L’hypoperfusion favorise la translocation bactérienne et l’infection, qui augmente à son tour la pression portale et la récidive. Chaque mesure de la prise en charge vise un maillon de ce cercle.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> La résistance structurale diminue lentement avec le traitement de la cause, par l’abstinence ou l’antiviral. La résistance dynamique répond au carvédilol. Le débit splanchnique répond au bêtabloquant non sélectif, à la terlipressine et à l’octréotide. Le rayon de la varice disparaît avec la ligature. Le gradient global est supprimé par le TIPS. L’infection est prévenue par la ceftriaxone, et l’encéphalopathie par le lactulose.</div>
<div class="key"><b>À retenir.</b> L’hypertension portale naît d’une résistance hépatique accrue, puis s’entretient par l’hyperdébit splanchnique. Les collatérales s’ouvrent aux sites d’anastomose, surtout par la veine gastrique gauche. La varice se rompt quand la tension pariétale dépasse la résistance de la paroi, ce qui dépend de la pression, du rayon et de l’épaisseur. Les causes de l’hypertension portale se classent selon le siège de l’obstacle.</div>
</section>

<section class="ilot" id="i85-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Toute hypertension portale vient d’un obstacle à l’écoulement du sang entre l’intestin et le cœur droit. Le siège de cet obstacle guide l’enquête, car il détermine si le HVPG est élevé ou normal. Le HVPG mesure seulement la résistance sinusoïdale : il reste normal lorsque l’obstacle se situe avant les sinusoïdes, par exemple dans une thrombose porte. Le tableau suivant classe les causes ; le lecteur cherche d’abord si le foie lui-même est malade.</p>
<table class="t"><tr><th>Siège</th><th>Causes principales</th><th>HVPG</th><th>Indice clinique</th></tr>
<tr><td>Préhépatique</td><td>Thrombose de la veine porte, thrombose de la veine splénique, compression tumorale</td><td>Normal</td><td>Élastographie hépatique normale, varices fundiques isolées si la veine splénique est thrombosée</td></tr>
<tr><td>Intrahépatique présinusoïdal</td><td>Schistosomiase, <button class="w" data-k="i85-psvd">maladie vasculaire porto-sinusoïdale</button>, cholangite biliaire primitive précoce</td><td>Normal ou peu élevé</td><td>Hypertension portale marquée avec fonction hépatique conservée</td></tr>
<tr><td>Sinusoïdal</td><td><b>Cirrhose</b> : alcool, MASLD, VHB, VHC, hémochromatose, hépatite auto-immune, maladie de Wilson</td><td>Élevé</td><td>Élasticité hépatique &gt; 15 kPa, stigmates d’insuffisance hépatocellulaire</td></tr>
<tr><td>Postsinusoïdal et posthépatique</td><td>Syndrome de Budd-Chiari, maladie veino-occlusive, insuffisance cardiaque droite, péricardite constrictive</td><td>Variable</td><td>Hépatomégalie douloureuse, turgescence jugulaire si l’origine est cardiaque</td></tr></table>
<p>Le premier réflexe face à des varices est de vérifier que l’élasticité hépatique est cohérente. Baveno VIII précise qu’une élasticité inférieure à 10 kPa chez un patient porteur de signes d’hypertension portale doit faire suspecter une maladie vasculaire du foie (1.6). L’erreur fréquente consiste à étiqueter « cirrhose cryptogénique » une thrombose porte ou une maladie porto-sinusoïdale, qui se traitent différemment, notamment par l’anticoagulation. Chez l’enfant, l’obstruction extrahépatique de la veine porte est l’une des deux grandes causes d’hypertension portale, avec la maladie hépatique chronique avancée (Baveno VIII, 1.24).</p>
<h3>4.1 Facteurs qui précipitent la décompensation</h3>
<p>Chez un cirrhotique, plusieurs facteurs accélèrent la progression ou déclenchent une décompensation. La poursuite de l’alcool est le principal moteur des événements hépatiques dans la maladie alcoolique (Baveno VIII, 2.1). Une hépatite aiguë surajoutée, alcoolique, virale ou médicamenteuse, peut précipiter une décompensation (3.7). Une infection bactérienne chez un patient porteur d’une hypertension portale significative aggrave le pronostic (3.10), car l’inflammation augmente la vasodilatation splanchnique et la pression portale. Une chirurgie majeure expose au même risque, d’autant plus que l’hypertension portale est sévère (3.13). Le diabète, l’obésité et la maladie parodontale s’associent aussi à un risque accru (3.8 et 3.12) ; ces associations ne prouvent pas une causalité directe, mais elles justifient leur prise en charge.</p>
<h3>4.2 Facteurs de risque de rupture</h3>
<p>Le risque qu’une varice saigne dépend des trois termes de la loi de Laplace et de l’état du foie. Les grandes varices, les signes rouges, la classe C de Child-Pugh et un HVPG élevé l’augmentent. Une consommation d’alcool active augmente le débit splanchnique et la pression portale. Les anti-inflammatoires non stéroïdiens favorisent le saignement par leur action sur la muqueuse et les plaquettes, et ils aggravent la rétention sodée. Pour les varices des autres localisations, les facteurs sont propres à chaque siège : anatomie de la veine spermatique gauche pour la varicocèle, grossesses multiples pour les varices pelviennes, âge, tabac et hypertension pour les varices sublinguales.</p>
<div class="key"><b>À retenir.</b> Les causes se classent en préhépatiques, intrahépatiques (présinusoïdales, sinusoïdales) et posthépatiques ; la cirrhose est sinusoïdale et donne un HVPG élevé. Une élasticité hépatique normale avec des varices oriente vers une maladie vasculaire du foie. L’alcool, l’infection, une hépatite surajoutée et la chirurgie précipitent la décompensation. L’anamnèse recherche ces éléments.</div>
<button class="pareto-btn ui" data-k="pareto-i85-physio">▲ Loi de Pareto — Physiopathologie et étiologies</button>
</section>

<section class="ilot" id="i85-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Les varices œsophagiennes ne donnent aucun symptôme tant qu’elles ne saignent pas. L’anamnèse a donc deux buts distincts. Chez le patient qui ne saigne pas, elle cherche la maladie hépatique et ses facteurs de progression. Chez le patient qui saigne, elle confirme l’origine digestive haute, estime la perte sanguine et repère les éléments qui changent le traitement immédiat.</p>
<h3>5.1 Antécédents et terrain</h3>
<p>Le médecin quantifie la <button class="w" data-k="i85-alcool">consommation d’alcool en verres standard (questionnaire et seuils)</button>, car l’alcool est la première cause en Suisse et son arrêt change le pronostic. Il recherche une <button class="w" data-k="i85-viral">hépatite virale B ou C (sérologies, traitements reçus)</button>, un surpoids, un diabète, une dyslipidémie, une transfusion ancienne, une toxicomanie intraveineuse et des antécédents familiaux d’hémochromatose. Il demande les épisodes antérieurs de décompensation : ascite ponctionnée, confusion, ictère, saignement. Il note un traitement par <button class="w" data-k="i85-anticoag">anticoagulant ou antiplaquettaire (conduite en cas d’hémorragie)</button>, un bêtabloquant déjà prescrit et la prise d’anti-inflammatoires non stéroïdiens. Une pancréatite antérieure oriente vers une thrombose de la veine splénique ; un voyage ou un séjour en zone d’endémie oriente vers une schistosomiase.</p>
<h3>5.2 Symptômes de l’hémorragie</h3>
<p>Les manifestations sont présentées par ordre de fréquence décroissante. Chacune est cliquable pour sa caractérisation et son mécanisme.</p>
<table class="t"><tr><th>Symptôme</th><th>Ce qu’il signifie</th></tr>
<tr><td><button class="w" data-k="i85-hematemese">Hématémèse</button></td><td>Saignement en amont de l’angle duodénojéjunal ; rouge si abondant et récent, « marc de café » si le sang a séjourné dans l’estomac</td></tr>
<tr><td><button class="w" data-k="i85-melena">Méléna</button></td><td>Selles noires et goudronneuses : le sang a été digéré pendant plusieurs heures ; environ 50 à 100 mL de sang suffisent</td></tr>
<tr><td>Malaise, lipothymie, soif</td><td>Hypovolémie ; le malaise en orthostatisme de M. B. traduit une perte importante</td></tr>
<tr><td>Rectorragies ou hématochézie</td><td>Hémorragie haute très abondante avec transit accéléré, ou varices rectales</td></tr>
<tr><td>Confusion, somnolence</td><td>Encéphalopathie hépatique déclenchée par la charge protéique, ou hypoperfusion cérébrale</td></tr></table>
<p>La lecture du tableau doit éviter une erreur fréquente : l’absence d’hématémèse n’exclut pas une rupture de varices, qui peut se révéler par un méléna isolé ou par un état de choc. Un patient cirrhotique qui présente une anémie aiguë, un choc ou une encéphalopathie inexpliquée doit être examiné à la recherche d’un saignement digestif.</p>
<h3>5.3 Formes typique et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Hématémèse abondante de sang rouge, brutale, sans douleur, chez un patient cirrhotique connu ou porteur de stigmates d’hépatopathie, suivie de méléna. L’absence de douleur s’explique par l’absence d’ulcération et d’inflammation : la varice se rompt mécaniquement.</p></div>
<div class="card"><h4>Formes atypiques</h4><p>Méléna isolé ; choc inaugural sans extériorisation ; encéphalopathie inaugurale ; anémie chronique par suintement d’une gastropathie d’hypertension portale ; rectorragies par varices rectales ou stomiales ; saignement d’une varice duodénale après chirurgie abdominale. Chez un patient non cirrhotique, une hémorragie de varices fundiques isolées doit faire chercher une thrombose de la veine splénique.</p></div></div>
<div class="key"><b>À retenir.</b> Les varices sont silencieuses jusqu’à leur rupture. L’anamnèse quantifie l’alcool, recherche les causes virales et métaboliques, les anticoagulants et les anti-inflammatoires. L’hématémèse et le méléna dominent, mais un choc ou une encéphalopathie peuvent être inauguraux. L’examen clinique estime la gravité, puis recherche les signes d’hépatopathie.</div>
</section>

<section class="ilot" id="i85-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen se déroule toujours dans le même ordre : l’état général et les paramètres vitaux d’abord, car ils décident de la réanimation, puis l’anthropométrie, puis les signes de maladie hépatique et d’hypertension portale. Chez un sujet sain, la peau est sans angiome, la rate n’est pas palpable, l’abdomen est plat et sans circulation veineuse visible, et la matité hépatique mesure environ 6 à 12 cm sur la ligne médioclaviculaire.</p>
<div class="two">
<div class="card"><h4>État général et paramètres vitaux</h4><p><button class="w" data-k="i85-choc">Signes de choc hémorragique (index de choc, marbrures, temps de recoloration)</button> : une fréquence cardiaque de 118/min avec une pression systolique de 92 mmHg donne chez M. B. un index de choc de 1,28, qui traduit une perte importante. La vigilance et le grade d’encéphalopathie déterminent le besoin d’<button class="w" data-k="i85-intubation">intubation avant l’endoscopie</button>. La température recherche une infection associée. Le bêtabloquant masque la tachycardie : une fréquence normale ne rassure pas chez un patient traité.</p></div>
<div class="card"><h4>Anthropométrie</h4><p>Le poids et l’indice de masse corporelle guident l’interprétation de l’élastographie, moins fiable au-delà de 30 kg/m². L’ascite fausse le poids. La <button class="w" data-k="i85-sarcopenie">sarcopénie (circonférence brachiale, force de préhension)</button> s’évalue sur les membres supérieurs, car elle aggrave le pronostic du patient décompensé (Baveno VIII, 4.16).</p></div>
<div class="card"><h4>Signes d’insuffisance hépatocellulaire</h4><p><button class="w" data-k="i85-angiomes">Angiomes stellaires</button>, <button class="w" data-k="i85-erythrose">érythrose palmaire</button>, ictère, hippocratisme digital, gynécomastie, <button class="w" data-k="i85-asterixis">astérixis (recherche et signification)</button> et fetor hepaticus. Les angiomes et l’érythrose traduisent l’excès d’œstrogènes et de vasodilatateurs que le foie ne dégrade plus.</p></div>
<div class="card"><h4>Signes d’hypertension portale</h4><p><button class="w" data-k="i85-splenomegalie">Splénomégalie</button>, signe le plus fréquent ; <button class="w" data-k="i85-ascite">ascite (matité déclive, flot)</button> ; <button class="w" data-k="i85-cvc">circulation veineuse collatérale abdominale (sens du flux)</button> ; souffle de <button class="w" data-k="i85-cruveilhier">Cruveilhier-Baumgarten</button>. Le toucher rectal confirme un méléna et recherche des varices rectales.</p></div></div>
<p>La lecture des deux colonnes donne une hiérarchie : les signes vitaux décident de l’urgence, la splénomégalie et l’ascite prouvent l’hypertension portale, et les stigmates cutanés désignent la cirrhose. Aucun signe pris isolément ne permet d’affirmer ou d’exclure des varices ; c’est l’endoscopie qui les montre.</p>
<h3>6.1 Examen des varices des autres localisations</h3>
<p>Les varices de la catégorie I86 s’examinent par l’inspection et la palpation, avec des manœuvres propres à chaque siège. La <button class="w" data-k="i85-varicocele-ex">varicocèle s’examine debout, au repos puis en Valsalva</button>, dans une pièce chaude. Les <button class="w" data-k="i85-sublinguale">varices sublinguales</button> apparaissent à la face ventrale de la langue lorsque le patient relève la pointe. Les varices vulvaires et de la face postérieure de la cuisse s’examinent debout, car la position couchée les vide.</p>
<div class="key"><b>À retenir.</b> L’examen commence par la gravité : index de choc, vigilance et risque d’inhalation. La splénomégalie, l’ascite et la circulation collatérale prouvent l’hypertension portale ; les angiomes, l’érythrose et l’astérixis désignent l’insuffisance hépatocellulaire. Les varices des autres localisations s’examinent debout ou en Valsalva. La démarche diagnostique organise ensuite les examens.</div>
<button class="pareto-btn ui" data-k="pareto-i85-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i85-7"><h2><span class="n">7</span>Démarche diagnostique et diagnostics différentiels</h2>
<p>La démarche diffère selon la situation. Chez le patient qui ne saigne pas, la question est de savoir s’il a une hypertension portale cliniquement significative, car la réponse décide du bêtabloquant. Chez le patient qui saigne, la question est de confirmer l’origine variceuse par l’endoscopie, après la réanimation. Baveno VIII a déplacé le centre de gravité : on ne cherche plus d’abord les varices, on cherche l’hypertension portale qui les produit.</p>
<h3>7.1 Le patient qui ne saigne pas : tests non invasifs</h3>
<p>L’élasticité hépatique, mesurée par <button class="w" data-k="i85-elastographie">élastographie impulsionnelle à vibration contrôlée</button> à jeun, et la numération plaquettaire sont les deux piliers du diagnostic non invasif (Baveno VIII, 1.12). Les plaquettes baissent parce que la rate agrandie les séquestre et parce que le foie produit moins de thrombopoïétine. Le tableau suivant donne les seuils de Baveno VIII ; le lecteur applique d’abord la règle d’exclusion, la plus robuste.</p>
<table class="t"><tr><th>Question</th><th>Critère (Baveno VIII)</th><th>Conduite</th></tr>
<tr><td>Maladie hépatique chronique avancée ?</td><td>&lt; 10 kPa : exclue ; 10–15 kPa : suggérée ; &gt; 15 kPa : très probable (1.3)</td><td>Répéter la mesure si ≥ 10 kPa (1.4) ; adresser à l’hépatologue (1.7)</td></tr>
<tr><td>Hypertension portale significative exclue ?</td><td>≤ 15 kPa <b>et</b> plaquettes ≥ 150 G/L (1.15)</td><td>Pas de bêtabloquant ; tests non invasifs chaque année (1.9)</td></tr>
<tr><td>Hypertension portale significative établie ?</td><td>≥ 25 kPa (cause virale, alcoolique ou métabolique sans obésité), ou <button class="w" data-k="i85-anticipate">probabilité ANTICIPATE ≥ 75 %</button>, ou élasticité splénique &gt; 55 kPa (1.16)</td><td>Bêtabloquant non sélectif, de préférence le carvédilol (3.15)</td></tr>
<tr><td>Zone intermédiaire</td><td>Ni exclusion ni confirmation</td><td>Réévaluer à 12 mois (1.17) ou mesurer l’élasticité splénique</td></tr>
<tr><td>Endoscopie de dépistage nécessaire ?</td><td>Seulement si le bêtabloquant est impossible, sauf si &lt; 20 kPa et plaquettes ≥ 150 G/L, ou élasticité splénique &lt; 40 kPa (1.19)</td><td>Ligature si grandes varices (3.19)</td></tr></table>
<p>Ce tableau change une pratique ancienne. Un patient qui prend déjà un bêtabloquant non sélectif n’a plus besoin d’une endoscopie de dépistage, car le résultat ne modifierait pas sa prise en charge (3.18). Le piège est de transposer le seuil de 25 kPa au patient obèse atteint de MASLD : l’élastographie y surestime la fibrose, et Baveno VIII recommande alors le modèle ANTICIPATE adapté. La <button class="w" data-k="i85-regle5">règle des 5 (10, 15, 20, 25 kPa)</button> exprime en outre un risque de décompensation croissant, quelle que soit la cause (1.8).</p>

<p>La figure se lit de haut en bas. Le premier embranchement repose sur deux mesures simples et peu coûteuses. La branche de droite ne demande pas d’endoscopie si le patient tolère le bêtabloquant. Un patient de 62 ans atteint d’une hépatite C guérie, avec 28 kPa et 110 G/L de plaquettes, reçoit donc du carvédilol sans gastroscopie de dépistage.</p>
<h3>7.2 Le patient qui saigne : endoscopie après réanimation</h3>
<p>La rupture variceuse est définie par un saignement visible à partir d’une varice, en jet ou en nappe, par des stigmates d’hémorragie récente comme un caillot ou un <button class="w" data-k="i85-clou">clou plaquettaire blanc</button>, ou par la présence de varices et de sang dans l’estomac sans autre source (Baveno VIII, 5.1). L’<button class="w" data-k="i85-endoscopie">endoscopie digestive haute</button> est l’examen de référence de ce diagnostic. Elle se fait dans les 12 heures après l’admission, une fois l’hémodynamique restaurée (5.18), et plus tôt si le patient reste instable.</p>
<h3>7.3 Diagnostics différentiels d’une hémorragie digestive haute chez un cirrhotique</h3>
<p>Un cirrhotique peut saigner d’une autre lésion que ses varices. Les différentiels sont classés ici par gravité décroissante, avec le critère qui les distingue.</p>
<table class="t"><tr><th>Diagnostic</th><th>Critère discriminant</th></tr>
<tr><td>Rupture de varices œsophagiennes ou gastriques</td><td>Varice qui saigne, stigmate ou varices avec sang sans autre lésion</td></tr>
<tr><td>Ulcère gastroduodénal</td><td>Ulcère visible ; prise d’anti-inflammatoires, <i>Helicobacter pylori</i></td></tr>
<tr><td>Ulcère après ligature</td><td>Saignement 1 à 2 semaines après une séance de ligature (Baveno VIII, 5.47)</td></tr>
<tr><td>Syndrome de <button class="w" data-k="i85-mallory">Mallory-Weiss</button></td><td>Vomissements non sanglants puis sanglants ; déchirure longitudinale du cardia</td></tr>
<tr><td><button class="w" data-k="i85-gastropathie">Gastropathie d’hypertension portale</button></td><td>Muqueuse fundique en mosaïque ; saignement surtout chronique</td></tr>
<tr><td>Ectasies vasculaires antrales</td><td>Stries rouges antrales ; indépendantes de la pression portale</td></tr>
<tr><td>Œsophagite, cancer œsogastrique, carcinome hépatocellulaire avec hémobilie</td><td>Lésion visible à l’endoscopie ou à l’imagerie</td></tr></table>
<p>La lecture rappelle qu’un cirrhotique saigne de ses varices dans la majorité des cas, mais pas toujours. Le traitement vasoactif et l’antibioprophylaxie sont donc débutés avant l’endoscopie sur la seule suspicion, puis l’endoscopie confirme ou réoriente. Si un ulcère est trouvé, le vasoactif est arrêté et l’inhibiteur de la pompe à protons poursuivi.</p>
<div class="quiz ui"><p><b>Cas.</b> Une femme de 55 ans atteinte d’une MASLD, IMC 27 kg/m², a une élasticité hépatique de 13 kPa à deux reprises et des plaquettes à 182 G/L. Que faut-il faire ?</p>
<button data-ok="0">A. Une endoscopie de dépistage des varices.</button>
<button data-ok="0">B. Du carvédilol, car l’élasticité dépasse 10 kPa.</button>
<button data-ok="1">C. Traiter la cause métabolique, sans bêtabloquant, et répéter les tests non invasifs dans 12 mois.</button>
<button data-ok="0">D. Une mesure du HVPG, indispensable avant toute décision.</button>
<p class="fb" hidden>Réponse C. L’élasticité de 13 kPa suggère une maladie chronique avancée, mais la combinaison ≤ 15 kPa et plaquettes ≥ 150 G/L exclut une hypertension portale cliniquement significative avec une valeur prédictive négative supérieure à 90 % (Baveno VIII, 1.15). Le bêtabloquant n’est pas indiqué sans hypertension portale significative (3.16), et l’endoscopie est inutile. Les tests sont répétés chaque année (1.9). La perte de poids d’au moins 10 % s’associe à une baisse d’élasticité (2.13).</p></div>
<div class="key"><b>À retenir.</b> Chez le patient compensé, l’élastographie et les plaquettes classent l’hypertension portale sans endoscopie systématique : ≤ 15 kPa avec plaquettes ≥ 150 G/L l’excluent, ≥ 25 kPa la confirment hors obésité. Chez le patient qui saigne, l’endoscopie dans les 12 heures confirme la rupture après la réanimation. Les différentiels comprennent l’ulcère, l’ulcère de ligature et le Mallory-Weiss. La rupture de varices est l’urgence de l’îlot suivant.</div>
