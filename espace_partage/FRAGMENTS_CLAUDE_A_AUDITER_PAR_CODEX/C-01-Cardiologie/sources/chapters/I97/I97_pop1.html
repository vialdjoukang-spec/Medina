
<!-- ===== FENÊTRES I97 : notions fondamentales, définitions et mécanismes ===== -->
<template data-pop="i97-bilan-o2" data-title="Bilan en oxygène du myocarde pendant une intervention">
<div class="lab">Définition</div><p>Le myocarde est lésé quand ses besoins en oxygène dépassent l’apport coronaire. Les besoins dépendent de la fréquence cardiaque, de la contractilité et de la tension de la paroi ventriculaire, elle-même proportionnelle à la pression et au rayon du ventricule. L’apport dépend du débit coronaire et du contenu artériel en oxygène.</p>
<div class="lab">Mécanisme normal</div><p>Au repos, le myocarde extrait déjà environ 70 % de l’oxygène du sang coronaire, contre environ 25 % pour l’ensemble de l’organisme. Il ne peut donc pas augmenter son extraction : il augmente son débit coronaire en dilatant ses artérioles. Le ventricule gauche se perfuse surtout en diastole, car sa contraction comprime les vaisseaux intramuraux en systole.</p>
<div class="lab">Perturbation périopératoire</div><p>La douleur et les catécholamines accélèrent le cœur et augmentent la contractilité : les besoins montent. La tachycardie raccourcit la diastole, l’hypotension diminue la pression de perfusion, l’anémie réduit le contenu en oxygène et l’hypoxémie sa saturation : l’apport baisse. Une sténose coronaire fixe empêche la dilatation compensatrice en aval.</p>
<div class="lab">Exemple chiffré</div><p>Une Hb de 140 g/L saturée à 98 % transporte environ 190 mL d’oxygène par litre de sang ; une Hb de 84 g/L n’en transporte plus qu’environ 115 mL. À débit coronaire égal, l’apport baisse donc d’environ 40 %.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement d’une lésion de type 2 vise chaque terme : ralentir le cœur, restaurer la pression diastolique, corriger l’anémie et l’hypoxémie.</p>
<p class="small">Source : ESC 2022, section 8 ; physiologie classique du contenu artériel en oxygène (1,34 mL d’oxygène par gramme d’hémoglobine saturée).</p>
</template>

<template data-pop="i97-autoreg" data-title="Autorégulation du débit des organes">
<div class="lab">Définition</div><p>L’autorégulation est la capacité d’un organe à maintenir un débit sanguin stable malgré les variations de pression artérielle. Elle repose sur une réponse myogène des artérioles, qui se contractent quand elles sont étirées, et sur des signaux métaboliques locaux.</p>
<div class="lab">Plage et seuil</div><p>Chez l’adulte normotendu, le cerveau et le rein maintiennent leur débit sur une large plage de pression moyenne. Sous le seuil inférieur, les artérioles sont déjà dilatées au maximum : le débit devient proportionnel à la pression. La valeur de ce seuil varie selon l’organe et la personne ; elle n’est pas une constante.</p>
<div class="lab">Hypertension chronique</div><p>L’hypertension chronique épaissit la paroi artériolaire et déplace la courbe vers les pressions plus élevées. Une pression moyenne de 65 mmHg peut alors se trouver sous le seuil d’un hypertendu, même si elle est bien tolérée par un normotendu.</p>
<div class="lab">Conséquence clinique</div><p>C’est pourquoi l’ESC 2022 exprime l’objectif peropératoire de deux façons : éviter une baisse de plus de 20 % par rapport à la valeur de base, et éviter une pression moyenne inférieure à 60 à 70 mmHg pendant 10 minutes ou plus (classe I, niveau B).</p>
<div class="lab">Limite</div><p>L’essai POISE-3 n’a pas montré de bénéfice d’une cible plus haute (au moins 80 mmHg) chez des hypertendus traités. Le seuil individuel reste inconnu au lit du patient.</p>
<p class="small">Source : ESC 2022, recommandation 33 ; Marcucci M et al., <i>Annals of Internal Medicine</i> 2023;176:605–614.</p>
</template>

<template data-pop="i97-dague" data-title="Convention croix–astérisque de la CIM-10">
<div class="lab">Principe</div><p>La CIM-10 permet de coder une même affection selon son étiologie et selon sa manifestation. Le code de l’étiologie porte une croix (†) ; le code de la manifestation porte un astérisque (*). Le code astérisque ne s’emploie jamais seul.</p>
<div class="lab">Exemple</div><p>Une aortite syphilitique tardive se code A52.0† (syphilis cardiovasculaire, étiologie) et I98.0* (manifestation circulatoire). Une cardiopathie chagasique chronique se code B57.2† et I98.1*. Des varices œsophagiennes d’une cirrhose alcoolique se codent avec le code de la maladie hépatique (K70.-†) et I98.2* ou I98.3* selon l’absence ou la présence d’une hémorragie.</p>
<div class="lab">Pourquoi</div><p>Le double codage permet de compter à la fois les maladies infectieuses ou hépatiques et leurs atteintes d’organe. Il évite qu’une aortite syphilitique disparaisse des statistiques cardiovasculaires.</p>
<div class="lab">Piège</div><p>I98 exclut les troubles déjà classés dans d’autres catégories astérisque du chapitre IX. Une endocardite au cours d’une maladie infectieuse, par exemple, possède sa propre catégorie astérisque.</p>
<p class="small">Source : BfArM, CIM-10-GM 2024, catégorie I98 et règles générales, consultées le 08.10.2026.</p>
</template>

<template data-pop="i97-risque-chir" data-title="Risque chirurgical intrinsèque (ESC 2022, tableau 5)">
<div class="lab">Définition</div><p>Le risque chirurgical estime la fréquence du décès cardiovasculaire, de l’infarctus et de l’AVC à 30 jours, attribuable à l’intervention seule, sans tenir compte du terrain. Il reflète l’ampleur de l’agression : durée, pertes sanguines, mouvements liquidiens, réponse inflammatoire, clampage vasculaire.</p>
<div class="lab">Bas risque (&lt; 1 %)</div><p>Chirurgie mammaire, dentaire, thyroïdienne, ophtalmologique, gynécologique ou orthopédique mineure (méniscectomie), reconstructrice, superficielle, urologique mineure (résection transurétrale de la prostate), résection pulmonaire mineure vidéo-assistée.</p>
<div class="lab">Risque intermédiaire (1–5 %)</div><p>Chirurgie carotidienne asymptomatique ou endartériectomie symptomatique, endoprothèse aortique, chirurgie de la tête et du cou, interventions intrapéritonéales (splénectomie, hernie hiatale, cholécystectomie), chirurgie intrathoracique non majeure, neurochirurgie ou orthopédie majeures (hanche, rachis), angioplastie artérielle périphérique, transplantation rénale, chirurgie urologique ou gynécologique majeure.</p>
<div class="lab">Haut risque (&gt; 5 %)</div><p>Surrénalectomie, chirurgie aortique et vasculaire majeure, stent carotidien symptomatique, chirurgie duodénopancréatique, résection hépatique ou biliaire, œsophagectomie, revascularisation ouverte d’un membre en ischémie aiguë ou amputation, pneumonectomie, transplantation pulmonaire ou hépatique, perforation intestinale, cystectomie totale.</p>
<div class="lab">Limite</div><p>Ces catégories sont une approximation ; une même intervention réalisée en urgence ou chez un patient fragile porte un risque plus élevé.</p>
<p class="small">Source : ESC 2022, tableau 5.</p>
</template>

<template data-pop="i97-urgence" data-title="Degrés d’urgence d’une intervention (ESC 2022)">
<div class="lab">Quatre catégories</div><p><b>Immédiate</b> : l’intervention se fait sans aucun délai pour sauver la vie ou un organe. <b>Urgente</b> : sans délai inutile, pour sauver la vie, un membre ou un organe. <b>Sensible au délai</b> : le plus tôt possible, car un retard expose à la perte d’une fonction ou à des complications ; la chirurgie d’un cancer ou d’une sténose carotidienne symptomatique en est l’exemple. <b>Programmée</b> : sans risque significatif lié à un report.</p>
<div class="lab">Pourquoi cela compte</div><p>Une intervention aiguë comporte plus de complications qu’une intervention programmée. L’évaluation préopératoire n’a de sens que si elle peut modifier la conduite : elle est complète avant une chirurgie programmée, réduite à l’essentiel avant une chirurgie urgente, et absente avant une chirurgie immédiate.</p>
<div class="lab">Exemple</div><p>La prothèse de M. R. est programmée : son bilan peut attendre une échocardiographie. Une fracture du col fémoral est urgente : on opère dans les jours qui suivent, et le bilan cardiaque ne doit pas la retarder.</p>
<p class="small">Source : ESC 2022, section 3.1.1.</p>
</template>

<template data-pop="i97-pmi" data-title="Lésion et infarctus myocardiques périopératoires : définitions">
<div class="lab">Lésion ou infarctus périopératoire (ESC 2022)</div><p>Le terme anglais « peri-operative myocardial infarction/injury » désigne une lésion aiguë du cardiomyocyte, c’est-à-dire une libération postopératoire de troponine hypersensible, avec ou sans symptômes, avec ou sans signe ECG ou d’imagerie. Le critère est une hausse absolue supérieure à la limite supérieure de la normale entre la valeur préopératoire et celle du 1er ou du 2e jour.</p>
<div class="lab">Infarctus périopératoire</div><p>Il exige en plus au moins un critère de la quatrième définition universelle : douleur ischémique, modifications ECG ischémiques, perte nouvelle de myocarde viable ou trouble segmentaire d’allure ischémique à l’imagerie, thrombus coronaire.</p>
<div class="lab">MINS</div><p>Le terme de la cohorte VISION désigne le sous-ensemble des lésions attribuées à une ischémie coronaire, par déséquilibre apports-besoins ou thrombose, en l’absence d’autre cause cardiaque (fibrillation rapide, insuffisance cardiaque aiguë) ou extracardiaque (sepsis, embolie pulmonaire).</p>
<div class="lab">Pourquoi un terme large</div><p>Au moment du dosage, on ignore souvent si le patient remplira les critères de l’infarctus. Le terme large déclenche le bilan sans préjuger de la cause. La mortalité est comparable que les critères de l’infarctus soient remplis ou non (BASEL-PMI).</p>
<div class="lab">Codage</div><p>Un infarctus postopératoire se code dans les catégories I21 ou I22 ; la CIM-10-GM ne prévoit pas de code propre à la lésion sans infarctus.</p>
<p class="small">Source : ESC 2022, section 8.1 ; Botto F et al., <i>Anesthesiology</i> 2014 ; Puelacher C et al., <i>Circulation</i> 2018.</p>
</template>

<template data-pop="i97-pcis" data-title="Syndromes post-lésion cardiaque (ESC 2025)">
<div class="lab">Définition</div><p>L’ESC 2025 regroupe sous ce terme les syndromes inflammatoires du péricarde et de la plèvre qui suivent une lésion cardiaque : péricardite tardive après infarctus (syndrome de Dressler), syndrome post-péricardiotomie et péricardite post-traumatique, avec ou sans saignement. Beaucoup de formes post-traumatiques sont aujourd’hui iatrogènes.</p>
<div class="lab">Formes et fréquences</div><p>Le syndrome de Dressler concerne moins de 1 % des infarctus, surtout étendus ou reperfusés tard, 1 à 2 semaines après l’infarctus. Une péricardite suit environ 10 % des ablations de fibrillation auriculaire. Les formes après implantation d’un stimulateur ou après ablation deviennent plus fréquentes avec le nombre de gestes.</p>
<div class="lab">Mécanisme</div><p>Une réaction auto-immune, déclenchée par le sang dans le péricarde ou l’incision de la plèvre, est l’hypothèse retenue. Trois faits la soutiennent : un délai de quelques semaines, la réponse aux anti-inflammatoires et la possibilité de récidives.</p>
<div class="lab">Codage</div><p>Le syndrome post-péricardiotomie se code I97.0 ; le syndrome de Dressler I24.1 ; une péricardite après ablation ou stimulateur se code selon les règles des complications d’un acte.</p>
<p class="small">Source : ESC 2025 sur les myocardites et les péricardites, section 11.3.</p>
</template>

<template data-pop="i97-basel" data-title="Étude BASEL-PMI (Bâle, 2014–2015)">
<div class="lab">Plan</div><p>Étude diagnostique prospective de l’hôpital universitaire de Bâle. Elle a inclus 2 018 patients consécutifs à risque cardiovasculaire, d’âge médian 74 ans, opérés d’une chirurgie non cardiaque avec un séjour prévu d’au moins 24 heures. Tous ont reçu un dépistage par troponine T hypersensible avant et après l’intervention, en routine clinique.</p>
<div class="lab">Définition</div><p>La lésion était une hausse absolue d’au moins 14 ng/L entre la valeur préopératoire et les valeurs postopératoires.</p>
<div class="lab">Résultats</div><p>Une lésion a suivi 397 des 2 546 interventions (16 %). Une douleur thoracique typique accompagnait 6 % des lésions, un symptôme ischémique quelconque 18 %. La mortalité à 30 jours était de 8,9 % avec lésion contre 1,5 % sans (rapport de risques ajusté 2,7), et de 22,5 % contre 9,3 % à un an. Elle était comparable que la lésion remplisse ou non les autres critères de l’infarctus spontané.</p>
<div class="lab">Portée et limites</div><p>C’est la principale donnée suisse sur le sujet. Elle concerne des patients à risque d’un centre universitaire et ne s’extrapole pas à toute la population opérée. Elle établit une association pronostique, pas l’effet d’un traitement.</p>
<p class="small">Source : Puelacher C et al., <i>Circulation</i> 2018;137:1221–1232.</p>
</template>

<template data-pop="i97-vulnerable" data-title="Période vulnérable après une intervention">
<div class="lab">Définition</div><p>L’ESC 2022 décrit un risque cardiovasculaire maximal dans la période périopératoire immédiate, mais qui semble rester élevé pendant 3 à 5 mois.</p>
<div class="lab">Mécanismes proposés</div><p>L’inflammation postopératoire, l’hypercoagulabilité, l’anémie, la déshydratation et l’arrêt de certains traitements persistent au-delà de la sortie. Le déconditionnement physique et les infections intercurrentes s’y ajoutent.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin traitant revoit le patient après la sortie, vérifie la reprise des médicaments suspendus, contrôle l’hémoglobine et organise la recherche d’ischémie prévue après une lésion myocardique.</p>
<p class="small">Source : ESC 2022, section 8.</p>
</template>

<template data-pop="i97-stress" data-title="Réponse neuroendocrine au stress chirurgical">
<div class="lab">Mécanisme</div><p>L’incision et la douleur activent le système sympathique et l’axe hypothalamo-hypophyso-surrénalien. Les catécholamines et le cortisol augmentent en quelques minutes ; le glucagon et l’hormone de croissance s’y ajoutent, alors que l’action de l’insuline diminue.</p>
<div class="lab">Effets cardiovasculaires</div><p>Les catécholamines accélèrent le cœur, augmentent la contractilité et resserrent les artérioles : les besoins en oxygène du myocarde augmentent. Elles favorisent aussi les arythmies auriculaires et l’activation plaquettaire.</p>
<div class="lab">Effets métaboliques</div><p>L’hyperglycémie de stress et le catabolisme protéique durent plusieurs jours après une intervention majeure. Chez le diabétique, ils déséquilibrent la glycémie.</p>
<div class="lab">Conséquence pratique</div><p>Une analgésie efficace réduit ce stress : l’ESC 2022 recommande d’éviter la douleur aiguë postopératoire (classe I, niveau B). Dans une étude citée par cette recommandation, les scores de douleur des 72 premières heures s’associaient à la lésion myocardique.</p>
<p class="small">Source : ESC 2022, sections 7.5 et 8.</p>
</template>

<template data-pop="i97-type2" data-title="Infarctus de type 2 en période périopératoire">
<div class="lab">Définition</div><p>L’infarctus de type 2 est une nécrose myocardique due à un déséquilibre entre apports et besoins en oxygène, sans thrombose coronaire aiguë. La quatrième définition universelle l’oppose au type 1, causé par une rupture ou une érosion de plaque.</p>
<div class="lab">Déclencheurs périopératoires</div><p>Hypotension, anémie ou saignement, tachycardie, hypoxémie, hypertension sévère et fibrillation rapide. Le terrain est souvent une coronaropathie stable qui empêche l’adaptation du débit coronaire.</p>
<div class="lab">Fréquence</div><p>Environ la moitié des lésions périopératoires n’ont pas de mécanisme sûr dans le dossier ; l’ESC 2022 les rattache par défaut à un type 2 sur hypotension non documentée, tout en rappelant qu’elles peuvent cacher un type 1 manqué ou une embolie pulmonaire.</p>
<div class="lab">Traitement</div><p>Le traitement corrige le déclencheur. Les patients sont en général traités comme après un infarctus de type 1, avec aspirine et statine, mais les preuves sont limitées ; une double antiagrégation n’est pas indiquée sans stent. Une recherche d’ischémie est organisée après la sortie.</p>
<div class="lab">Piège</div><p>La classification entre type 1 et type 2 est moins fiable après une intervention qu’en dehors, selon l’ESC 2022.</p>
<p class="small">Source : ESC 2022, figures 18 et 19 ; quatrième définition universelle de l’infarctus (2018).</p>
</template>

<template data-pop="i97-sideration" data-title="Sidération myocardique après chirurgie cardiaque">
<div class="lab">Définition</div><p>La sidération est une dysfonction contractile réversible qui persiste après le rétablissement du débit coronaire, sans nécrose. Elle se distingue de l’hibernation, qui est une adaptation à une ischémie chronique.</p>
<div class="lab">Mécanisme</div><p>Pendant le clampage aortique, le cœur arrêté par la cardioplégie reste ischémique. À la reperfusion, la surcharge calcique et les espèces réactives de l’oxygène altèrent les protéines contractiles et leur sensibilité au calcium.</p>
<div class="lab">Évolution</div><p>La fonction se récupère habituellement en 24 à 72 heures. Pendant cette période, un soutien inotrope peut être nécessaire au sevrage de la circulation extracorporelle.</p>
<div class="lab">Conséquence pratique</div><p>Une FEVG basse au 1er jour ne permet pas de juger la fonction à distance. Une dysfonction qui persiste au-delà de quelques jours fait rechercher une ischémie, une occlusion de greffon ou une dysfonction de valve.</p>
<p class="small">Source : physiologie de l’ischémie-reperfusion ; fenêtre « Sidération et hibernation » du cours I21.</p>
</template>

<template data-pop="i97-vasoplegie" data-title="Vasoplégie après circulation extracorporelle">
<div class="lab">Définition</div><p>La vasoplégie est une hypotension avec résistances vasculaires basses et débit cardiaque conservé ou élevé, qui nécessite des vasopresseurs après une chirurgie cardiaque. Il n’en existe pas de définition unique dans les recommandations consultées.</p>
<div class="lab">Mécanisme</div><p>Le contact du sang avec le circuit active le complément et les leucocytes. Les cytokines induisent la synthèse inductible du monoxyde d’azote, qui relâche le muscle lisse vasculaire ; l’ouverture des canaux potassiques et un déficit relatif en vasopressine s’y ajoutent.</p>
<div class="lab">Facteurs favorisants</div><p>Une circulation extracorporelle longue, une insuffisance cardiaque avancée et un traitement préopératoire par inhibiteur du SRAA sont associés à la vasoplégie.</p>
<div class="lab">Traitement</div><p>La noradrénaline est le premier vasopresseur ; la vasopressine, qui agit par un récepteur non adrénergique, est souvent ajoutée lorsque les récepteurs adrénergiques répondent mal. Le remplissage seul ne corrige pas une vasodilatation.</p>
<p class="small">Source : physiologie du choc distributif ; ESC 2022, section 8 ; consensus EACTS 2020 sur l’assistance postcardiotomie.</p>
</template>

<template data-pop="i97-pm-syndrome" data-title="Syndrome du stimulateur">
<div class="lab">Définition</div><p>Le syndrome du stimulateur regroupe les signes provoqués par une stimulation ventriculaire seule, qui supprime le synchronisme entre oreillettes et ventricules. L’essai MOST le définissait par des signes de congestion avec conduction rétrograde, ou par une baisse de la pression systolique d’au moins 20 mmHg en stimulation, avec faiblesse, vertige ou syncope reproductibles.</p>
<div class="lab">Mécanisme</div><p>En stimulation VVI, l’oreillette se contracte parfois pendant la systole ventriculaire, valves fermées, ou reçoit l’influx par conduction rétrograde. Le sang reflue vers les veines pulmonaires et caves, la contribution auriculaire au remplissage disparaît et des barorécepteurs auriculaires provoquent une vasodilatation réflexe.</p>
<div class="lab">Fréquence</div><p>Dans MOST, 182 des 996 patients stimulés en mode VVIR pour une maladie du sinus (18,3 %) ont rempli les critères, la plupart dans les six premiers mois.</p>
<div class="lab">Traitement</div><p>Le rétablissement d’une stimulation séquentielle, en mode DDD si le boîtier le permet, corrige le syndrome. Dans MOST, la reprogrammation a amélioré la qualité de vie.</p>
<div class="lab">Codage</div><p>Le syndrome est inclus dans I97.1 de la CIM-10-GM 2024.</p>
<p class="small">Source : Link et al., <i>Journal of the American College of Cardiology</i> 2004;43:2066–2071 ; BfArM, CIM-10-GM 2024.</p>
</template>

<template data-pop="i97-takotsubo" data-title="Syndrome de Takotsubo en période périopératoire">
<div class="lab">Définition</div><p>Le syndrome de Takotsubo est une dysfonction ventriculaire gauche transitoire, souvent une akinésie apicale avec hypercinésie basale, sans occlusion coronaire expliquant l’étendue du trouble.</p>
<div class="lab">Mécanisme proposé</div><p>Une décharge massive de catécholamines, comme celle du stress chirurgical ou de catécholamines administrées, sidère les segments où la densité des récepteurs bêta est la plus forte.</p>
<div class="lab">Fréquence</div><p>Son incidence périopératoire est inconnue, car les études de dépistage par troponine n’ont pas réalisé d’échocardiographie chez tous les patients. L’ESC 2022 encourage fortement l’échocardiographie dans le bilan d’une lésion myocardique pour ne pas le manquer.</p>
<div class="lab">Conséquence pratique</div><p>La forme avec obstruction de la chambre de chasse aggrave l’hypotension sous inotrope : une échocardiographie précède l’ajout d’un inotrope chez un patient hypotendu avec troponine élevée.</p>
<p class="small">Source : ESC 2022, section 8.3.</p>
</template>

<template data-pop="i97-poaf-substrat" data-title="Fibrillation postopératoire : déclencheur aigu ou substrat démasqué">
<div class="lab">Question</div><p>Pourquoi la fibrillation après une chirurgie non cardiaque s’associe-t-elle davantage aux AVC tardifs qu’après une chirurgie cardiaque ?</p>
<div class="lab">Données</div><p>Dans la méta-analyse citée par l’ESC 2022, le rapport de risques d’AVC à long terme était de 2,00 après chirurgie non cardiaque et de 1,20 après chirurgie cardiaque. Une étude citée par la même recommandation trouvait, après chirurgie non cardiaque, un risque thromboembolique comparable à celui d’une fibrillation non chirurgicale.</p>
<div class="lab">Interprétation proposée</div><p>Après chirurgie cardiaque, l’inflammation péricardique et l’agression directe de l’oreillette suffisent souvent à déclencher l’arythmie chez des patients sans substrat. Après chirurgie non cardiaque, l’agression est moindre : une arythmie qui survient révèle plus souvent une oreillette déjà malade. Cette explication est plausible mais non démontrée.</p>
<div class="lab">Conséquence pratique</div><p>Une fibrillation postopératoire n’est jamais considérée comme un incident clos : elle impose un CHA₂DS₂-VA, une décision d’anticoagulation et un suivi du rythme.</p>
<p class="small">Source : ESC 2022, section 8.6.2.2 ; ESC 2024, section 9.6.</p>
</template>
