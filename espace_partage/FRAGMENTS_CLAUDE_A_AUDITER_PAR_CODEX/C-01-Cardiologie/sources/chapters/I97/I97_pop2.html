
<!-- ===== FENÊTRES I97 : anamnèse, examen clinique, évaluation préopératoire ===== -->
<template data-pop="i97-a-coro" data-title="Antécédent de coronaropathie et d’angioplastie">
<div class="lab">Questions</div><p>Le médecin demande la date et le contexte de l’angioplastie (syndrome coronarien aigu ou angor stable), le type de stent, les antiplaquettaires en cours et leur durée prévue. Il recherche un angor résiduel et note le dernier test d’ischémie et la FEVG connue.</p>
<div class="lab">Pourquoi</div><p>La date décide du moment de l’intervention : l’ESC 2022 recommande d’attendre 6 mois après une angioplastie programmée et 12 mois après un syndrome coronarien aigu (classe I, niveau A). Avant ce délai, l’arrêt de l’inhibiteur du récepteur P2Y12 expose à une thrombose de stent. La coronaropathie compte aussi un point dans l’indice de risque révisé et place le patient dans le groupe à dépister par troponine.</p>
<div class="lab">Exemple</div><p>M. R. a reçu son stent il y a trois ans, pour un angor stable, et ne prend plus que l’aspirine : aucun délai ne s’impose, et l’aspirine se poursuit.</p>
<p class="small">Source : ESC 2022, recommandation 13.</p>
</template>

<template data-pop="i97-a-ic" data-title="Insuffisance cardiaque et valvulopathie connues">
<div class="lab">Questions</div><p>Le médecin précise la classe fonctionnelle actuelle, la dernière hospitalisation, le poids sec, la FEVG et le traitement. Il note la valvulopathie connue, sa sévérité et la date de la dernière échocardiographie.</p>
<div class="lab">Pourquoi</div><p>L’insuffisance cardiaque augmente la mortalité opératoire : dans les données citées par l’ESC 2022, la mortalité hospitalière était de 4,8 % contre 0,78 % sans insuffisance cardiaque. Une chirurgie programmée n’est pas recommandée en cas de décompensation. L’ESC 2022 demande une échocardiographie de moins de 6 mois, ou répétée si l’état s’aggrave.</p>
<div class="lab">Valvulopathies</div><p>Un rétrécissement aortique sévère symptomatique se traite avant une chirurgie différable. Une valvulopathie sévère méconnue se découvre souvent par un souffle à l’examen préopératoire.</p>
<p class="small">Source : ESC 2022, sections 6.2 et 6.3.</p>
</template>

<template data-pop="i97-a-medic" data-title="Médicaments à relever avant une intervention">
<div class="lab">Médicaments</div><p>Le médecin relève les bêtabloquants, les IEC ou ARA, les diurétiques, les iSGLT2, les statines, les antiplaquettaires, les anticoagulants, les antiarythmiques, l’insuline et les antidiabétiques. Il demande aussi les AINS pris en automédication.</p>
<div class="lab">Pourquoi</div><p>Chaque classe pose une décision propre : poursuivre, suspendre ou reprendre. La dose et l’heure de la dernière prise d’un anticoagulant décident du délai avant l’intervention ou de l’antagonisation en urgence.</p>
<div class="lab">Communication</div><p>L’ESC 2022 recommande des instructions individualisées, orales et écrites, pour les modifications avant et après l’intervention (classe I, niveau C), et suggère une liste structurée chez le patient à haut risque (classe IIa, niveau C).</p>
<p class="small">Source : ESC 2022, recommandations 5 et 12.</p>
</template>

<template data-pop="i97-s-angor" data-title="Douleur thoracique nouvelle avant une intervention">
<div class="lab">Caractérisation</div><p>Le médecin précise le siège rétrosternal, la constriction, le déclenchement à l’effort ou au froid, la durée de quelques minutes et le soulagement au repos ou par la nitroglycérine.</p>
<div class="lab">Conduite</div><p>Une douleur évocatrice d’une coronaropathie méconnue impose un bilan cardiaque avant une chirurgie programmée (ESC 2022, classe I, niveau C), et une évaluation pluridisciplinaire avant une chirurgie urgente. Les indications de coronarographie sont les mêmes qu’en dehors de la chirurgie.</p>
<div class="lab">Piège</div><p>Un angor instable méconnu transforme une chirurgie programmée en risque majeur : la plaque est déjà instable au moment où le stress chirurgical favorise sa rupture.</p>
<p class="small">Source : ESC 2022, recommandation 4.</p>
</template>

<template data-pop="i97-s-dyspnee" data-title="Dyspnée ou œdèmes nouveaux avant une intervention">
<div class="lab">Conduite</div><p>L’ESC 2022 recommande un ECG et un dosage de peptide natriurétique devant une dyspnée ou des œdèmes périphériques nouveaux, sauf cause non cardiaque certaine (classe I, niveau C). Si le peptide est élevé, une échocardiographie précède l’intervention (classe I, niveau C).</p>
<div class="lab">Pourquoi</div><p>Une insuffisance cardiaque méconnue expose à la décompensation lors des apports liquidiens périopératoires. Le peptide normal rend ce diagnostic improbable et évite un examen inutile.</p>
<div class="lab">Piège</div><p>Des œdèmes sous inhibiteur calcique ou une dyspnée d’obésité peuvent imiter une insuffisance cardiaque ; le peptide aide à trancher.</p>
<p class="small">Source : ESC 2022, recommandation 4.</p>
</template>

<template data-pop="i97-s-pleuro" data-title="Douleur pleuropéricardique et fièvre tardive après chirurgie cardiaque">
<div class="lab">Caractérisation</div><p>La douleur est thoracique, augmentée par l’inspiration, la toux ou le décubitus, et soulagée en position penchée en avant. La fièvre apparaît habituellement une à plusieurs semaines après l’intervention, après une phase d’amélioration.</p>
<div class="lab">Mécanisme</div><p>L’inflammation des feuillets péricardiques et pleuraux, recouverts de fibrine, irrite les terminaisons nerveuses de la plèvre pariétale et du péricarde, innervées par le nerf phrénique.</p>
<div class="lab">Diagnostic différentiel</div><p>Médiastinite, pneumonie, embolie pulmonaire, endocardite sur prothèse, infection urinaire ou de cathéter. Chaque cause infectieuse se cherche avant de conclure à une inflammation stérile.</p>
<p class="small">Source : ESC 2025, section 11.3.</p>
</template>

<template data-pop="i97-s-pm" data-title="Symptômes évocateurs d’un syndrome du stimulateur">
<div class="lab">Symptômes</div><p>Le patient décrit une fatigue, des vertiges ou des lipothymies, une dyspnée, des pulsations dans le cou ou la tête, une toux ou une gêne thoracique. Ces symptômes surviennent quand la stimulation ventriculaire prend le relais du rythme propre.</p>
<div class="lab">Indice clé</div><p>Les symptômes apparaissent après la pose d’un stimulateur simple chambre ventriculaire, souvent dans les premiers mois, et varient avec le pourcentage de battements stimulés.</p>
<div class="lab">Piège</div><p>Ces plaintes sont souvent attribuées à l’âge, à la maladie sinusale initiale ou aux antihypertenseurs. La mesure de la pression en rythme propre et en stimulation fait le diagnostic.</p>
<p class="small">Source : Link et al., <i>Journal of the American College of Cardiology</i> 2004.</p>
</template>

<template data-pop="i97-escaliers" data-title="Monter deux étages d’escalier">
<div class="lab">Technique</div><p>Le médecin demande si le patient monte deux étages d’escalier sans s’arrêter, à son rythme habituel. La réponse est rapportée par le patient ; elle ne nécessite aucun équipement.</p>
<div class="lab">Valeur</div><p>Dans une grande cohorte prospective de patients à haut risque citée par l’ESC 2022, l’incapacité de monter deux étages ajoutait une information pronostique à l’indice de risque révisé pour les événements cardiaques à 30 jours. L’ESC 2022 propose d’ajuster l’estimation du risque selon cette réponse avant une chirurgie à risque intermédiaire ou élevé (classe IIa, niveau B).</p>
<div class="lab">Limites</div><p>L’auto-évaluation est imprécise et dépend de la motivation et de la mémoire. Une limitation orthopédique, neurologique ou respiratoire empêche de conclure sur la réserve cardiaque.</p>
<div class="lab">Notion historique</div><p>Le seuil classique de 4 équivalents métaboliques (METs) reposait sur des entretiens subjectifs sans valeur démontrée ; l’ESC 2022 le juge moins fiable que la question des escaliers ou le DASI.</p>
<p class="small">Source : ESC 2022, section 4.2 et recommandation 6.</p>
</template>

<template data-pop="i97-dasi" data-title="Questionnaire DASI">
<div class="lab">Définition</div><p>Le DASI est un questionnaire de douze activités quotidiennes, de la toilette au sport intense. Chaque activité possible apporte un poids ; le score total va de 0 à 58,2.</p>
<div class="lab">Valeur</div><p>Dans une étude prospective internationale, le DASI estimait le risque cardiaque plus précisément que l’appréciation subjective du médecin et améliorait l’indice de risque révisé. Un score inférieur à 34 s’associait à un excès de décès ou d’infarctus à 30 jours.</p>
<div class="lab">Conversion</div><p>La consommation maximale d’oxygène estimée vaut 0,43 × DASI + 9,6 mL/kg/min ; divisée par 3,5, elle donne les METs. Un score de 34 correspond ainsi à environ 24 mL/kg/min, soit près de 7 METs.</p>
<div class="lab">Limite</div><p>L’épreuve d’effort cardiorespiratoire n’a pas prédit la mortalité à 30 jours, l’infarctus ou l’arrêt cardiaque dans la même étude, dont le nombre d’événements était faible.</p>
<p class="small">Source : ESC 2022, section 4.2 ; Wijeysundera et al., <i>Lancet</i> 2018.</p>
</template>

<template data-pop="i97-fragilite" data-title="Fragilité avant une intervention">
<div class="lab">Définition</div><p>La fragilité est une réduction de la réserve physiologique de plusieurs systèmes, qui expose à une décompensation après un stress modéré. Elle se distingue de l’âge et des comorbidités.</p>
<div class="lab">Outils</div><p>L’ESC 2022 cite l’indice de fragilité et le phénotype de fragilité comme outils les plus recommandés, et l’échelle clinique de fragilité, plus simple, fondée sur l’anamnèse. Un dépistage cognitif rapide peut s’y ajouter.</p>
<div class="lab">Recommandation</div><p>Dépister la fragilité avec un outil validé est à envisager dès 70 ans avant une chirurgie à risque intermédiaire ou élevé (classe IIa, niveau B).</p>
<div class="lab">Conséquence</div><p>Une fragilité confirmée fait discuter l’indication opératoire, la préparation (nutrition, réadaptation) et l’orientation après la sortie, avec le patient.</p>
<p class="small">Source : ESC 2022, section 4.1.2.</p>
</template>

<template data-pop="i97-rcri" data-title="Indice de risque cardiaque révisé">
<div class="lab">Critères (un point chacun)</div><p>Cardiopathie ischémique ; maladie cérébrovasculaire ; antécédent d’insuffisance cardiaque ; diabète traité par insuline ; créatinine supérieure à 2 mg/dL (177 µmol/L) ; chirurgie à haut risque, c’est-à-dire intrapéritonéale, intrathoracique ou vasculaire sus-inguinale.</p>
<div class="lab">Interprétation</div><p>Selon les données reprises par l’ESC 2022, un score de 0 correspond à environ 4 % de décès, d’infarctus ou d’arrêt cardiaque à 30 jours, un score de 1 à 6 %, de 2 à 10 % et de 3 ou plus à 15 %.</p>
<div class="lab">Pourquoi ces critères</div><p>Les quatre premiers signalent une maladie athéroscléreuse ou une dysfonction ventriculaire ; l’insuffisance rénale et le diabète insulinotraité sont souvent des marqueurs d’une coronaropathie méconnue ; la chirurgie à haut risque mesure l’agression.</p>
<div class="lab">Limites</div><p>L’indice date de 1999 et ignore l’âge, la fragilité et la capacité fonctionnelle. Il sert au tri ; il ne remplace pas les biomarqueurs.</p>
<div class="lab">Exemple</div><p>M. R. : coronaropathie, insuline et créatinine à 190 µmol/L, soit 3 points.</p>
<p class="small">Source : ESC 2022, tableau 6 et section 3.3.</p>
</template>

<template data-pop="i97-e-ta" data-title="Pression artérielle avant une intervention">
<div class="lab">Technique</div><p>Le médecin mesure la pression au repos, aux deux bras, avec un brassard adapté. Une différence de plus de 15 à 20 mmHg entre les bras suggère une sténose de l’artère sous-clavière et désigne le bras de référence pour la surveillance.</p>
<div class="lab">Seuil de report</div><p>L’ESC 2022 ne conseille pas de différer l’intervention pour une hypertension de grade 1 ou 2. Elle juge en revanche raisonnable de différer une intervention programmée lorsque la pression systolique atteint 180 mmHg ou la diastolique 110 mmHg, jusqu’au contrôle tensionnel.</p>
<div class="lab">Pourquoi</div><p>Une hypertension sévère non contrôlée expose aux grandes variations de pression pendant l’anesthésie, et notamment aux hypotensions profondes à l’induction. Une hypertension non traitée un mois avant l’intervention s’associait à une hausse de 69 % de la mortalité à 90 jours dans une grande étude observationnelle.</p>
<p class="small">Source : ESC 2022, section 6.8.</p>
</template>

<template data-pop="i97-e-souffle" data-title="Souffle systolique éjectionnel découvert avant une intervention">
<div class="lab">Technique</div><p>Le souffle du rétrécissement aortique est mésosystolique, rugueux, maximal au deuxième espace intercostal droit et irradie vers les carotides. Un deuxième bruit aboli et un pouls carotidien lent et faible orientent vers une sténose serrée.</p>
<div class="lab">Conduite</div><p>Un souffle nouveau avec symptômes ou signes de maladie cardiovasculaire impose une échocardiographie avant l’intervention (ESC 2022, classe I, niveau C), de même qu’un souffle évocateur d’une valvulopathie significative avant une chirurgie à haut risque.</p>
<div class="lab">Pourquoi</div><p>Le ventricule d’un rétrécissement aortique sévère ne peut pas augmenter son débit et dépend d’une pression diastolique suffisante pour sa perfusion. La vasodilatation de l’anesthésie peut provoquer un collapsus avec ischémie.</p>
<p class="small">Source : ESC 2022, recommandation 4 et section 6.3.</p>
</template>

<template data-pop="i97-e-ic" data-title="Signes de surcharge avant ou après une intervention">
<div class="lab">Signes</div><p>La surcharge se reconnaît à une turgescence jugulaire avec reflux hépatojugulaire, à des crépitants bilatéraux, à un troisième bruit, à des œdèmes déclives et à une prise de poids.</p>
<div class="lab">Mécanisme</div><p>Une pression de remplissage élevée se transmet aux veines systémiques et pulmonaires. Les apports liquidiens périopératoires l’augmentent encore chez un ventricule incapable d’éjecter le volume reçu.</p>
<div class="lab">Conduite</div><p>Avant l’intervention, une surcharge signe une insuffisance cardiaque décompensée qui fait différer une chirurgie programmée. Après l’intervention, elle oriente une hypotension vers un mécanisme cardiogénique et contre-indique un remplissage supplémentaire.</p>
<p class="small">Source : ESC 2022, sections 6.2 et 8.4.</p>
</template>

<template data-pop="i97-e-perfusion" data-title="Signes d’hypoperfusion périphérique">
<div class="lab">Signes</div><p>L’hypoperfusion se traduit par des marbrures, un temps de recoloration capillaire allongé au-delà d’environ 3 secondes, des extrémités froides, une oligurie inférieure à 0,5 mL/kg/heure, une confusion et un lactate élevé.</p>
<div class="lab">Mécanisme</div><p>Quand le débit baisse, le système sympathique resserre d’abord les vaisseaux de la peau et du rein pour préserver le cerveau et le cœur. La peau et la diurèse renseignent donc tôt sur l’insuffisance circulatoire.</p>
<div class="lab">Piège</div><p>Une pression normale n’exclut pas un choc débutant chez un patient vasoconstricté ; à l’inverse, un choc distributif peut donner des extrémités chaudes au début.</p>
<p class="small">Source : physiologie du choc ; ESC 2022, section 8.</p>
</template>

<template data-pop="i97-e-tamp" data-title="Signes de tamponnade après chirurgie cardiaque">
<div class="lab">Signes classiques</div><p>La tamponnade associe classiquement une hypotension, une turgescence jugulaire, un pouls paradoxal (baisse inspiratoire de la pression systolique de plus de 10 mmHg), des bruits du cœur assourdis et une tachycardie.</p>
<div class="lab">Particularités postopératoires</div><p>L’épanchement peut être localisé derrière le cœur et ne comprimer qu’une cavité ; la ventilation mécanique modifie le pouls paradoxal ; des drains qui cessent brusquement de couler peuvent signaler un caillot. Les signes classiques manquent donc souvent.</p>
<div class="lab">Conduite</div><p>Une échocardiographie urgente, au besoin transœsophagienne, confirme le diagnostic. Le drainage est souvent chirurgical après chirurgie cardiaque.</p>
<p class="small">Source : ESC 2025, section 11.3 ; fenêtre « Signes échographiques de tamponnade » du cours I30.</p>
</template>

<template data-pop="i97-e-canon" data-title="Ondes « en canon » au pouls jugulaire">
<div class="lab">Définition</div><p>Une onde « en canon » est une onde a géante, visible au cou, produite par la contraction de l’oreillette droite contre une valve tricuspide fermée.</p>
<div class="lab">Mécanisme</div><p>Quand l’oreillette et le ventricule se contractent sans coordination, l’oreillette expulse parfois son sang vers la veine cave supérieure et les jugulaires au lieu du ventricule. Les ondes en canon irrégulières traduisent une dissociation auriculoventriculaire ; régulières, une conduction rétrograde à chaque battement.</p>
<div class="lab">Valeur</div><p>Chez un porteur de stimulateur ventriculaire, elles orientent vers un syndrome du stimulateur. Elles se voient aussi dans le bloc auriculoventriculaire complet et la tachycardie ventriculaire.</p>
<p class="small">Source : sémiologie du pouls veineux jugulaire ; Link et al., 2004.</p>
</template>

<template data-pop="i97-ecg-preop" data-title="ECG préopératoire">
<div class="lab">Indication</div><p>L’ESC 2022 recommande un ECG à 12 dérivations avant une chirurgie à risque intermédiaire ou élevé chez le patient de 65 ans ou plus, ou atteint d’une maladie, d’un facteur de risque ou de symptômes cardiovasculaires (classe I, niveau C). Elle déconseille l’ECG systématique chez le patient à bas risque opéré d’une chirurgie à bas ou moyen risque (classe III, niveau B). Entre 45 et 65 ans sans maladie, ECG et biomarqueurs sont à envisager avant une chirurgie à haut risque (classe IIa, niveau C).</p>
<div class="lab">Anomalies significatives</div><p>Onde Q pathologique, modification du ST et de l’onde T, rythme non sinusal, bloc de branche gauche.</p>
<div class="lab">Valeur de référence</div><p>Le tracé préopératoire permet d’interpréter un ECG postopératoire : un sous-décalage ancien n’a pas la même signification qu’un sous-décalage nouveau.</p>
<p class="small">Source : ESC 2022, section 4.3 et recommandations 3 et 7.</p>
</template>

<template data-pop="i97-tn-preop" data-title="Troponine hypersensible avant et après l’intervention">
<div class="lab">Recommandation</div><p>Chez le patient atteint d’une maladie ou d’un facteur de risque cardiovasculaire (dont l’âge de 65 ans ou plus), ou de symptômes évocateurs, l’ESC 2022 recommande de doser la troponine T ou I hypersensible avant une chirurgie à risque intermédiaire ou élevé, puis 24 et 48 heures après (classe I, niveau B).</p>
<div class="lab">Pourquoi avant</div><p>La valeur de base mesure une lésion chronique. Elle a une valeur pronostique propre et permet d’affirmer qu’une hausse postopératoire est aiguë.</p>
<div class="lab">Pourquoi 24 et 48 heures</div><p>La plupart des lésions surviennent pendant l’intervention ou juste après, sous anesthésie ou analgésie, et restent muettes. Deux dosages couvrent la période où la troponine atteint son maximum.</p>
<div class="lab">Avantages sur le peptide</div><p>La troponine est plus disponible, moins chère, exclut un infarctus récent avant l’intervention et permet le diagnostic de lésion dès le 1er jour.</p>
<div class="lab">Conséquence</div><p>Une valeur anormale fait demander un avis cardiologique, sans retarder une chirurgie nécessaire.</p>
<p class="small">Source : ESC 2022, section 4.4, figure 4 et recommandation 7.</p>
</template>

<template data-pop="i97-np-preop" data-title="Peptides natriurétiques avant l’intervention">
<div class="lab">Recommandation</div><p>Dans la même population que la troponine, le dosage du BNP ou du NT-proBNP est à envisager avant une chirurgie à risque intermédiaire ou élevé (ESC 2022, classe IIa, niveau B).</p>
<div class="lab">Seuils</div><p>BNP anormal à partir de 35 pg/mL, NT-proBNP à partir de 125 pg/mL. Ils s’interprètent selon l’âge, le sexe, l’obésité, la fonction rénale et la cardiopathie connue.</p>
<div class="lab">Mécanisme</div><p>Les peptides sont libérés par les cardiomyocytes étirés : ils mesurent la contrainte pariétale, donc une insuffisance cardiaque même infraclinique.</p>
<div class="lab">Conséquence</div><p>Un peptide élevé oriente vers une échocardiographie, recommandée avant une chirurgie à haut risque (classe I) et possible avant une chirurgie à risque intermédiaire (classe IIb).</p>
<p class="small">Source : ESC 2022, recommandations 7 et 8 ; fenêtre « Peptides natriurétiques » du cours I50.</p>
</template>

<template data-pop="i97-imagerie-effort" data-title="Imagerie d’effort avant une intervention">
<div class="lab">Indications (ESC 2022)</div><p>Recommandée avant une chirurgie programmée à haut risque chez un patient à capacité fonctionnelle faible et à probabilité élevée de coronaropathie ou à haut risque clinique (classe I, niveau B). À envisager avant une chirurgie à haut risque chez un patient asymptomatique à capacité faible, déjà revascularisé (classe IIa, niveau C). Possible avant une chirurgie à risque intermédiaire si une ischémie est suspectée (classe IIb, niveau B). Non recommandée en routine (classe III, niveau C).</p>
<div class="lab">Modalités</div><p>Échocardiographie de stress à la dobutamine, scintigraphie de perfusion, IRM de stress. Elles fonctionnent sans effort physique, utile chez un patient limité par la hanche ou le genou.</p>
<div class="lab">Pourquoi pas pour tous</div><p>Une ischémie découverte ne change le pronostic que si elle conduit à une revascularisation utile ; or la revascularisation prophylactique n’a pas amélioré le pronostic dans l’essai CARP.</p>
<p class="small">Source : ESC 2022, recommandation 9.</p>
</template>

<template data-pop="i97-carp" data-title="Essai CARP (2004)">
<div class="lab">Plan</div><p>Essai randomisé chez des patients coronariens stables devant subir une chirurgie vasculaire majeure, comparant une revascularisation coronaire préalable à un traitement médical seul.</p>
<div class="lab">Résultats</div><p>L’infarctus à 30 jours était de 8,4 % dans les deux groupes, et la mortalité à 2,7 ans de 22 % contre 23 %.</p>
<div class="lab">Conséquence</div><p>La revascularisation prophylactique systématique avant une chirurgie non cardiaque n’est pas justifiée. Les indications de coronarographie et de revascularisation restent celles qui s’appliquent hors chirurgie (ESC 2022, classe I, niveau C).</p>
<div class="lab">Limite</div><p>L’essai excluait les lésions du tronc commun et les sténoses aortiques sévères ; il ne s’applique pas à ces patients.</p>
<p class="small">Source : ESC 2022, section 6.1 ; essai CARP, <i>New England Journal of Medicine</i> 2004.</p>
</template>

<template data-pop="i97-thrombose-stent" data-title="Thrombose de stent et chirurgie">
<div class="lab">Mécanisme</div><p>Après la pose d’un stent, l’endothélium recouvre progressivement les mailles métalliques. Tant que ce recouvrement est incomplet, le métal et le polymère exposés activent les plaquettes : la double antiagrégation empêche la formation d’un thrombus.</p>
<div class="lab">Pourquoi la chirurgie aggrave le risque</div><p>L’intervention crée un état prothrombotique au moment où l’inhibiteur du récepteur P2Y12 est souvent arrêté. L’association d’un stent récent, d’un arrêt des antiplaquettaires et du stress chirurgical concentre le risque.</p>
<div class="lab">Gravité</div><p>La thrombose de stent occlut brutalement une artère coronaire et provoque le plus souvent un infarctus étendu, avec une mortalité élevée.</p>
<div class="lab">Conséquence</div><p>D’où les délais de l’ESC 2022 : 6 mois après une angioplastie programmée, 12 mois après un syndrome coronarien aigu, au moins 1 mois si la chirurgie est sensible au délai, et la poursuite de l’aspirine pendant l’intervention.</p>
<p class="small">Source : ESC 2022, section 5.3.1 et recommandation 13.</p>
</template>

<template data-pop="i97-algo01" data-title="Pourquoi l’algorithme rapide ne s’applique pas après une intervention">
<div class="lab">L’algorithme</div><p>L’algorithme de 0 heure et 1 heure (ou 2 heures) de l’ESC exclut ou confirme un infarctus chez un patient qui consulte aux urgences pour une douleur thoracique, à partir d’une valeur initiale et de sa variation.</p>
<div class="lab">Pourquoi il ne s’applique pas</div><p>Il a été validé chez des patients symptomatiques, dans un contexte où la lésion débute avec la douleur. Après une intervention, la lésion survient à un moment inconnu, souvent sans symptôme, sur un fond de lésion chronique fréquente. Ses seuils ne sont pas validés dans ce contexte.</p>
<div class="lab">Ce qui le remplace</div><p>La comparaison entre la valeur préopératoire et celles du 1er et du 2e jour, avec un seuil de hausse absolue égal à la limite supérieure de la normale.</p>
<p class="small">Source : ESC 2022, figure 4.</p>
</template>
