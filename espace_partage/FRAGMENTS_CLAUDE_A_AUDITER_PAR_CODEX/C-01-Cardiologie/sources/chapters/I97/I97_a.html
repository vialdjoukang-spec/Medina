<section class="ilot" id="i97-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. R., 74 ans, 82 kg, doit recevoir une prothèse totale de hanche dans six semaines pour une coxarthrose invalidante. Il a reçu un stent coronaire actif il y a trois ans, il traite un diabète par insuline et sa créatinine vaut 190 µmol/L. Il prend de l’aspirine, du bisoprolol, du lisinopril, de l’atorvastatine et de l’empagliflozine. Il marche 300 m avant que la douleur de hanche ne l’arrête. Quatre questions organisent ce cours : <b>quel est son risque cardiaque opératoire, quels examens le modifient réellement, quels médicaments poursuivre ou suspendre, et comment reconnaître une complication cardiovasculaire que l’anesthésie et l’analgésie rendent silencieuse ?</b></p>
<p>Une seconde patiente sert de fil rouge pour la chirurgie cardiaque. Mme B., 66 ans, a reçu trois pontages et une plastie mitrale. Au 18e jour, elle revient avec une fièvre à 38,2 °C, une douleur thoracique majorée à l’inspiration et un frottement. Il faut alors distinguer une réaction inflammatoire bénigne d’une infection du médiastin, d’une embolie pulmonaire ou d’une tamponnade.</p>
<p>À la fin de ce cours, le médecin assistant sait estimer le risque d’une chirurgie non cardiaque selon l’ESC 2022, choisir les examens préopératoires utiles et renoncer aux inutiles. Il sait dépister et explorer une lésion myocardique périopératoire, traiter une hypotension ou un choc postopératoire, et conduire une fibrillation auriculaire postopératoire. Il sait diagnostiquer et traiter un syndrome post-péricardiotomie, reconnaître une défaillance cardiaque après chirurgie cardiaque et un syndrome du stimulateur. Il sait enfin coder ces situations dans les catégories I97, I98 et I99 de la CIM-10-GM 2024, sans les confondre avec I21, I30, I48 ou I50.</p>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="i97-bilan-o2">bilan en oxygène du myocarde (apports et besoins)</button>, l’<button class="w" data-k="i97-autoreg">autorégulation du débit des organes (seuil de pression)</button> et la <button class="w" data-k="i21-udmi4">définition universelle de l’infarctus (types 1 à 5)</button>. Ces notions sont reprises dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i97-1"><h2><span class="n">1</span>Définitions, périmètre et classifications</h2>
<p>La catégorie I97 regroupe les troubles circulatoires causés par un acte médical et non classés ailleurs. La mention « non classés ailleurs » a une conséquence pratique : une complication qui possède son propre code le garde. Un infarctus postopératoire reste codé I21, une fibrillation auriculaire postopératoire I48, une embolie pulmonaire I26 et un choc postopératoire T81.1. La CIM-10-GM exclut expressément ce dernier de I97, parce qu’elle classe le choc postopératoire parmi les complications des actes chirurgicaux du chapitre des lésions traumatiques. Ces complications constituent pourtant l’essentiel du risque circulatoire d’une intervention : leur reconnaissance périopératoire est développée ici, leur traitement de fond dans les cours I21, I48, I26 et I50.</p>
<h3>1.1 Sous-catégories de la CIM-10-GM 2024</h3>
<p>La question utile au codage est double : l’acte était-il une chirurgie cardiaque, et la complication est-elle un lymphœdème ? Le tableau suit cet ordre.</p>
<table class="t"><tr><th>Code</th><th>Intitulé (CIM-10-GM 2024)</th><th>Contenu clinique</th></tr>
<tr><td>I97.0</td><td>Syndrome post-cardiotomie</td><td>Syndrome inflammatoire péricardique et pleural après ouverture du péricarde</td></tr>
<tr><td>I97.1</td><td>Autres troubles fonctionnels après chirurgie cardiaque</td><td>Insuffisance ou défaillance cardiaque après chirurgie cardiaque ou due à une prothèse cardiaque ; syndrome du stimulateur</td></tr>
<tr><td>I97.20 à I97.22, I97.29</td><td>Lymphœdème après mastectomie (partielle), stades I à III, sans précision</td><td>Lymphœdème du bras après chirurgie mammaire avec curage</td></tr>
<tr><td>I97.80 à I97.88</td><td>Lymphœdème après un acte médical selon le territoire (cervical, axillaire, inguinal, urogénital, autres) et le stade</td><td>Lymphœdème après curage ou irradiation hors chirurgie mammaire</td></tr>
<tr><td>I97.89</td><td>Autres troubles circulatoires après un acte médical, non classés ailleurs</td><td>Complication circulatoire sans code propre</td></tr>
<tr><td>I97.9</td><td>Trouble circulatoire après un acte médical, sans précision</td><td>Code d’attente, à éviter quand le trouble est connu</td></tr></table>
<p>Le tableau se lit de haut en bas : le codeur cherche d’abord un code propre à la complication, puis la sous-catégorie I97 qui correspond à l’acte. L’erreur fréquente consiste à coder I97.1 une fibrillation auriculaire après pontage : elle reste I48, car elle possède son code. M. R. ne relève donc de I97 que si sa complication n’a pas de code spécifique. Le <button class="w" data-k="i89-codage">codage détaillé des lymphœdèmes (cours I89)</button> applique la même logique.</p>
<h3>1.2 I98 et I99</h3>
<p>I98 est une catégorie « astérisque » : elle décrit une <b>manifestation</b> circulatoire d’une maladie codée ailleurs, qui porte la « croix » de l’étiologie. La <button class="w" data-k="i97-dague">convention croix–astérisque (double codage étiologie–manifestation)</button> impose les deux codes. I98.0 désigne la syphilis cardiovasculaire, I98.1 l’atteinte cardiovasculaire d’autres infections comme la maladie de Chagas chronique, I98.2 et I98.3 les varices œsophagiennes et gastriques au cours d’une maladie du foie ou d’une schistosomiase, sans ou avec hémorragie, et I98.8 les autres troubles précisés. I99 est une catégorie résiduelle pour un trouble circulatoire autre ou non précisé : son emploi signale presque toujours un diagnostic inachevé.</p>
<h3>1.3 Classifications de la chirurgie non cardiaque</h3>
<p>Le risque d’un patient dépend autant de l’intervention que de son terrain. L’ESC 2022 classe donc les interventions selon le <button class="w" data-k="i97-risque-chir">risque chirurgical intrinsèque (bas, intermédiaire, élevé)</button> : moins de 1 %, 1 à 5 % ou plus de 5 % de décès cardiovasculaire, d’infarctus et d’AVC à 30 jours, estimés pour l’intervention seule. Une chirurgie mammaire ou une cataracte est à bas risque ; une prothèse de hanche, une cholécystectomie ou une endoprothèse aortique à risque intermédiaire ; une chirurgie aortique ouverte, une œsophagectomie ou une pneumonectomie à haut risque. Elle classe aussi l’<button class="w" data-k="i97-urgence">urgence de l’intervention (immédiate, urgente, sensible au délai, programmée)</button>, car une intervention qu’on ne peut pas différer interdit l’optimisation préalable et augmente à elle seule le risque.</p>
<p>Deux termes reviennent dans tout le cours. La <button class="w" data-k="i97-pmi">lésion ou infarctus myocardique périopératoire (définition par la troponine)</button> désigne une hausse aiguë de la troponine hypersensible après l’intervention, avec ou sans symptômes. Le terme MINS, issu de la cohorte VISION, en désigne le sous-ensemble attribué à une ischémie coronaire. L’infarctus périopératoire, au sens de la définition universelle, exige en plus un signe d’ischémie.</p>
<div class="trap"><span class="k">Piège</span>Le libellé « syndrome post-cardiotomie » de la CIM-10-GM désigne la même entité que le « syndrome post-péricardiotomie » des recommandations. L’ESC 2025 le range dans un ensemble plus large, les <button class="w" data-k="i97-pcis">syndromes post-lésion cardiaque (définition et formes)</button>, qui comprend aussi le syndrome de Dressler après infarctus et les péricardites après ablation, stimulateur ou traumatisme. Le syndrome de Dressler se code I24.1, non I97.0.</div>
</section>

<section class="ilot" id="i97-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La lésion myocardique périopératoire est la complication cardiovasculaire la plus fréquente d’une chirurgie non cardiaque. Les données de référence sont suisses : l’étude <button class="w" data-k="i97-basel">BASEL-PMI (dépistage systématique par troponine à Bâle)</button> a suivi 2 018 patients à risque, d’âge médian 74 ans, opérés entre 2014 et 2015. Une lésion est survenue après 16 % des 2 546 interventions. Seuls 6 % des patients concernés ont eu une douleur thoracique typique et 18 % un symptôme ischémique quelconque. La mortalité à 30 jours atteignait 8,9 % avec lésion contre 1,5 % sans lésion, et 22,5 % contre 9,3 % à un an.</p>
<p>La cohorte internationale VISION avait déjà montré le même phénomène chez 15 065 adultes de 45 ans ou plus : 8,0 % ont présenté une lésion d’origine ischémique, 15,8 % seulement de ces patients ont eu un symptôme, et 58,2 % n’auraient pas rempli la définition universelle de l’infarctus. Cette lésion triplait presque le risque de décès à 30 jours après ajustement (rapport de risques 3,87). L’ESC 2022 résume ces données : environ 90 % des lésions passent inaperçues sans dépistage, et la mortalité à 30 jours avoisine 10 %. Le lien entre lésion et décès est une association ; la troponine signale une souffrance myocardique et un terrain fragile, sans prouver que chaque décès découle de cette lésion.</p>
<p>Les autres complications ont des fréquences différentes selon l’intervention. La fibrillation auriculaire postopératoire survient chez 30 à 50 % des patients après chirurgie cardiaque et chez 5 à 30 % après chirurgie non cardiaque (ESC 2024). Le syndrome post-péricardiotomie touchait 29,4 % du groupe placebo de l’essai COPPS-2, qui le recherchait activement. Une défaillance cardiaque postcardiotomie, définie par l’impossibilité de sevrer la circulation extracorporelle ou un choc persistant malgré les médicaments, concerne moins de 4 % des adultes opérés du cœur (consensus EACTS 2020). L’insuffisance cardiaque aiguë touche 1 à 2 % des patients à risque dans les 30 jours d’une chirurgie non cardiaque majeure, et l’AVC périopératoire 0,1 à 3 % selon le type d’intervention, avec une mortalité de 18 à 26 %.</p>
<p>Le risque ne s’éteint pas à la sortie. L’ESC 2022 décrit une <button class="w" data-k="i97-vulnerable">période vulnérable de 3 à 5 mois (risque prolongé)</button> après l’intervention. L’inflammation, l’hypercoagulabilité et l’anémie postopératoires persistent pendant cette période et maintiennent un déséquilibre entre apports et besoins du myocarde.</p>
<div class="trap"><span class="k">Lacune documentaire</span>La Suisse ne dispose pas de registre national des complications cardiovasculaires périopératoires, et l’OFS ne publie pas leur incidence. Les chiffres suisses proviennent de la cohorte bâloise BASEL-PMI, qui ne représente que des patients à risque d’un centre universitaire. Aucune recommandation suisse propre à l’évaluation préopératoire n’a été trouvée ; la Société suisse de cardiologie applique les recommandations de l’ESC.</div>
<button class="pareto-btn ui" data-k="pareto-i97-bases">▲ Loi de Pareto — Définitions, codage, épidémiologie</button>
</section>

<section class="ilot" id="i97-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Une intervention agit sur la circulation par quatre voies simultanées : le stress chirurgical, l’anesthésie, les pertes sanguines et liquidiennes, et l’inflammation tissulaire. Le raisonnement suit la chaîne : <b>agression chirurgicale → activation sympathique, inflammation et hypercoagulabilité → déséquilibre apports-besoins, thrombose ou arythmie → lésion myocardique, défaillance circulatoire ou syndrome inflammatoire.</b></p>
<h3>3.1 La réponse au stress chirurgical</h3>
<p>Normalement, le myocarde au repos extrait déjà environ 70 % de l’oxygène du sang coronaire. Il ne peut donc augmenter son apport qu’en augmentant le débit coronaire. L’incision, la douleur, l’intubation et l’hypothermie déclenchent une <button class="w" data-k="i97-stress">réponse neuroendocrine au stress (catécholamines, cortisol)</button>. Les catécholamines accélèrent le cœur et élèvent la contractilité et la postcharge : les besoins en oxygène augmentent. La tachycardie raccourcit en même temps la diastole, seule phase où le ventricule gauche se perfuse. Chez un patient porteur d’une sténose coronaire fixe, le débit coronaire ne suit plus la demande : c’est l’<button class="w" data-k="i97-type2">infarctus de type 2 par déséquilibre apports-besoins (mécanisme périopératoire dominant)</button>.</p>
<p>L’intervention active aussi la coagulation. Le facteur tissulaire libéré par les tissus lésés, l’immobilité et la baisse de la fibrinolyse forment un état prothrombotique. La plaque coronaire, soumise aux variations de pression et aux catécholamines, peut se rompre et provoquer un <b>infarctus de type 1</b>, plus rare mais plus grave. L’ESC 2022 insiste sur l’hétérogénéité des lésions : environ la moitié restent de mécanisme incertain et sont rattachées, par défaut, à un type 2 dû à une hypotension non documentée.</p>
<h3>3.2 Hypotension et perfusion des organes</h3>
<p>La pression artérielle moyenne est le produit du débit cardiaque et des résistances vasculaires systémiques. Les anesthésiques abaissent les deux : ils dilatent les artérioles, réduisent le tonus veineux, donc le retour veineux, et dépriment la contractilité. Le cerveau et le rein maintiennent leur débit tant que la pression reste dans leur <button class="w" data-k="i97-autoreg">plage d’autorégulation (seuil inférieur)</button>. Le myocarde gauche dépend, lui, de la pression diastolique aortique, car il se perfuse surtout en diastole. Une baisse de 25 minutes à 58 mmHg de pression moyenne, comme chez M. R. en salle de réveil, réduit donc la perfusion coronaire au moment où la douleur et l’anémie augmentent les besoins. L’ESC 2022 recommande d’éviter une baisse de plus de 20 % par rapport à la valeur de base, ou une pression moyenne inférieure à 60 à 70 mmHg pendant 10 minutes ou plus (classe I, niveau B).</p>

<h3>3.3 Après une chirurgie cardiaque</h3>
<p>Trois mécanismes propres à la chirurgie cardiaque expliquent les troubles de I97.0 et I97.1. D’abord, la cardioplégie et l’ischémie-reperfusion de l’aorte clampée provoquent une <button class="w" data-k="i97-sideration">sidération myocardique (dysfonction réversible sans nécrose)</button> qui déprime la contraction pendant 24 à 72 heures. Ensuite, la circulation extracorporelle active le complément, les leucocytes et la production de monoxyde d’azote : une <button class="w" data-k="i97-vasoplegie">vasoplégie (hypotension à débit conservé)</button> peut en résulter. Enfin, l’ouverture du péricarde et le sang qui s’y accumule exposent des antigènes cardiaques au système immunitaire : après un délai de plusieurs jours à semaines, une réaction inflammatoire auto-immune produit le syndrome post-péricardiotomie.</p>
<p>Un stimulateur programmé en stimulation ventriculaire seule supprime la synchronisation entre oreillettes et ventricules. L’oreillette se contracte alors parfois contre une valve tricuspide ou mitrale fermée : la pression auriculaire monte, le reflux remonte dans les veines et la contribution auriculaire au remplissage disparaît. Ce <button class="w" data-k="i97-pm-syndrome">syndrome du stimulateur (perte du synchronisme auriculoventriculaire)</button> donne une fatigue, des vertiges et une baisse de la pression d’au moins 20 mmHg.</p>
<div class="key"><b>À retenir.</b> Le stress chirurgical augmente les besoins du myocarde au moment où l’hypotension, l’anémie et la tachycardie réduisent ses apports ; la plupart des lésions périopératoires naissent de ce déséquilibre, une minorité d’une thrombose coronaire. Après chirurgie cardiaque, la sidération, la vasoplégie et la réaction immunitaire péricardique expliquent les troubles propres à I97. L’îlot suivant identifie les patients chez qui ces mécanismes deviennent dangereux.</div>
</section>

<section class="ilot" id="i97-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<p>Le risque cardiovasculaire opératoire résulte de trois groupes de facteurs : le terrain du patient, l’intervention et les circonstances. L’ESC 2022 les distingue parce que seuls certains se corrigent avant l’opération.</p>
<table class="t"><tr><th>Groupe</th><th>Facteurs (ESC 2022, figure 17)</th><th>Pourquoi ils augmentent le risque</th></tr>
<tr><td>Terrain chronique</td><td>Âge &gt; 75 ans, coronaropathie, insuffisance cardiaque, rétrécissement aortique sévère, artériopathie, maladie cérébrovasculaire, insuffisance rénale, diabète, anémie</td><td>Ils réduisent la réserve coronaire ou la réserve de débit, et le rein ou le diabète signalent souvent une coronaropathie méconnue</td></tr>
<tr><td>Terrain aigu</td><td>Syndrome coronarien aigu, syndrome aortique aigu, AVC récent, traumatisme aigu (fracture de hanche)</td><td>La plaque ou le tissu cérébral sont instables au moment de l’agression</td></tr>
<tr><td>Intervention</td><td>Urgence, hypotension, hypercoagulabilité, saignement, inflammation, tachycardie, hypothermie</td><td>Ils augmentent les besoins ou réduisent les apports en oxygène</td></tr>
<tr><td>Période postopératoire</td><td>Hypotension, saignement, hypoxémie, tachycardie, douleur</td><td>Ils prolongent le déséquilibre au-delà du bloc opératoire</td></tr></table>
<p>Le tableau se lit en deux temps : les deux premières lignes définissent qui dépister, les deux dernières ce que l’équipe doit éviter. M. R. cumule une coronaropathie, un diabète sous insuline et une insuffisance rénale : il appartient au groupe que l’ESC 2022 désigne pour la surveillance par troponine.</p>
<p>L’<button class="w" data-k="i97-rcri">indice de risque cardiaque révisé (six critères, un point chacun)</button> reste l’outil de synthèse le plus simple. Il compte la cardiopathie ischémique, la maladie cérébrovasculaire, l’insuffisance cardiaque, le diabète sous insuline, une créatinine supérieure à 177 µmol/L (2 mg/dL) et une chirurgie à haut risque. Un score de 0, 1, 2 et 3 ou plus correspond à environ 4, 6, 10 et 15 % de décès, d’infarctus ou d’arrêt cardiaque à 30 jours, selon les données reprises par l’ESC 2022. M. R. a un score de 3 : coronaropathie, insuline et créatinine. La prothèse de hanche n’ajoute pas de point, car l’indice ne compte comme chirurgie à haut risque que les interventions intrapéritonéales, intrathoraciques ou vasculaires sus-inguinales.</p>
<p>La <button class="w" data-k="i97-fragilite">fragilité (réserve physiologique réduite)</button> s’ajoute chez la personne âgée : l’ESC 2022 propose de la dépister avec un outil validé dès 70 ans avant une chirurgie à risque intermédiaire ou élevé (classe IIa, niveau B). Les facteurs propres aux autres complications sont détaillés dans leurs îlots : chirurgie thoracique et âge pour la fibrillation auriculaire, ouverture du péricarde pour le syndrome post-péricardiotomie, stimulation ventriculaire fréquente pour le syndrome du stimulateur.</p>
<div class="key"><b>À retenir.</b> Le risque se calcule à partir du terrain et de l’intervention ; l’indice de risque révisé et la fragilité le résument. Les facteurs peropératoires et postopératoires, hypotension, anémie, tachycardie et douleur, sont ceux que l’équipe corrige. L’anamnèse doit maintenant les rechercher.</div>
<button class="pareto-btn ui" data-k="pareto-i97-meca">▲ Loi de Pareto — Physiopathologie et facteurs de risque</button>
</section>

<section class="ilot" id="i97-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse préopératoire a deux buts : découvrir une maladie cardiovasculaire méconnue qui changerait la conduite, et estimer la réserve fonctionnelle. L’ESC 2022 en fait la base de l’évaluation de tous les patients (classe I, niveau C). Après l’intervention, l’anamnèse change de rôle : elle cherche des symptômes que les opiacés, la sédation et la douleur de la plaie masquent.</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin interroge sur une <button class="w" data-k="i97-a-coro">coronaropathie et une angioplastie récente (date, type de stent, traitement)</button>, car la date de l’angioplastie fixe le délai d’une chirurgie programmée. Il recherche une <button class="w" data-k="i97-a-ic">insuffisance cardiaque ou une valvulopathie connues</button>, une arythmie, un stimulateur ou un défibrillateur, un AVC, une artériopathie, une insuffisance rénale et un diabète. Il note les <button class="w" data-k="i97-a-medic">médicaments cardiovasculaires et antithrombotiques (noms, doses, dernière prise)</button>. Il demande enfin une histoire familiale de cardiomyopathie génétique : l’ESC 2022 recommande alors un ECG et une échocardiographie quel que soit l’âge (classe I, niveau C).</p>
<h3>5.2 Capacité fonctionnelle</h3>
<p>La capacité fonctionnelle mesure la réserve cardiorespiratoire que l’intervention va solliciter. La question la plus simple est la capacité de monter <button class="w" data-k="i97-escaliers">deux étages d’escalier sans s’arrêter (valeur et limites)</button>. Dans une grande cohorte prospective, l’incapacité de le faire ajoutait une information pronostique à l’indice de risque révisé ; l’ESC 2022 propose d’en tenir compte avant une chirurgie à risque intermédiaire ou élevé (classe IIa, niveau B). Le questionnaire <button class="w" data-k="i97-dasi">DASI (douze activités, score de 0 à 58,2)</button> estime cette capacité plus précisément : un score inférieur à 34 s’associait à un excès de décès ou d’infarctus à 30 jours.</p>
<div class="trap"><span class="k">Piège</span>M. R. ne monte pas deux étages, mais c’est sa hanche qui l’arrête, non son cœur. Une capacité non évaluable n’équivaut pas à une capacité faible : le médecin recherche alors une dyspnée, une douleur thoracique ou une fatigue anormale lors des efforts que la hanche autorise, et s’appuie davantage sur les biomarqueurs.</div>
<h3>5.3 Symptômes à rechercher</h3>
<p>Avant l’intervention, une <button class="w" data-k="i97-s-angor">douleur thoracique d’effort nouvelle</button>, une <button class="w" data-k="i97-s-dyspnee">dyspnée ou des œdèmes nouveaux</button>, une syncope ou des palpitations imposent un bilan avant une chirurgie programmée (ESC 2022, classe I, niveau C). Après l’intervention, la plupart des lésions myocardiques restent muettes. Le médecin recherche donc des signes indirects : tachycardie inexpliquée, hypotension, oligurie, confusion, dyspnée ou besoin d’oxygène croissant. Dans les semaines qui suivent une chirurgie cardiaque, il recherche une <button class="w" data-k="i97-s-pleuro">douleur pleuropéricardique et une fièvre tardive (syndrome post-péricardiotomie)</button> ; chez un porteur de stimulateur, une <button class="w" data-k="i97-s-pm">fatigue, des vertiges et des pulsations cervicales (syndrome du stimulateur)</button>.</p>
<div class="two">
<div class="card"><h4>Forme typique (chirurgie non cardiaque)</h4><p>Patient de 70 ans ou plus, coronarien, opéré d’une intervention à risque intermédiaire. Il ne se plaint de rien au premier jour. La troponine de contrôle s’élève et l’ECG reste inchangé : la lésion n’est découverte que par le dépistage.</p></div>
<div class="card"><h4>Formes atypiques</h4><p>Confusion ou chute de la diurèse comme seul signe d’un bas débit ; fibrillation auriculaire au 3e jour, révélatrice d’un infarctus ou d’une embolie pulmonaire ; épanchement pleural gauche tardif après pontage, révélateur d’un syndrome post-péricardiotomie ; fatigue chronique après pose d’un stimulateur simple chambre.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse préopératoire cherche une maladie cardiaque méconnue, une angioplastie récente et la capacité de monter deux étages ; l’anamnèse postopératoire cherche des équivalents silencieux. L’examen clinique complète cette recherche.</div>
</section>

<section class="ilot" id="i97-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique préopératoire recherche les trois découvertes qui changent la conduite : un souffle d’un rétrécissement aortique, des signes d’insuffisance cardiaque et une hypertension sévère. L’examen postopératoire cherche la cause d’une instabilité.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin apprécie l’état général, la fragilité et l’état nutritionnel. Il mesure la <button class="w" data-k="i97-e-ta">pression artérielle (seuil de report d’une chirurgie programmée)</button> aux deux bras, la fréquence et la régularité du pouls, la saturation et la température. Une pression de 135/80 mmHg est normale chez un patient traité ; une pression de 186/112 mmHg fait différer une intervention programmée. Il pèse le patient et calcule l’indice de masse corporelle, utile pour les doses et le risque de lymphœdème.</p></div>
<div class="card"><h4>Cœur et vaisseaux</h4><p>Il ausculte le cœur : un <button class="w" data-k="i97-e-souffle">souffle systolique éjectionnel nouveau (rétrécissement aortique)</button> impose une échocardiographie. Il recherche une <button class="w" data-k="i97-e-ic">turgescence jugulaire, des crépitants et des œdèmes</button>, signes d’une surcharge qui interdit une chirurgie programmée. Il palpe les pouls périphériques, dont l’absence suggère une artériopathie et donc une coronaropathie probable.</p></div>
<div class="card"><h4>Après l’intervention</h4><p>Devant une hypotension, il évalue la <button class="w" data-k="i97-e-perfusion">perfusion périphérique (marbrures, temps de recoloration, diurèse)</button>, la volémie, la plaie et les drains. Il cherche des <button class="w" data-k="i97-e-tamp">signes de tamponnade (pouls paradoxal, jugulaires turgescentes)</button> après chirurgie cardiaque, et une asymétrie des membres inférieurs évocatrice de thrombose.</p></div>
<div class="card"><h4>Signes propres à I97</h4><p>Un <button class="w" data-k="i30-e-frott">frottement péricardique (technique et valeur)</button> et une matité de la base gauche orientent vers un syndrome post-péricardiotomie. Des <button class="w" data-k="i97-e-canon">ondes « en canon » jugulaires (contraction auriculaire contre une valve fermée)</button> orientent vers un syndrome du stimulateur. Un bras plus gros du côté opéré oriente vers un lymphœdème, confirmé par la mesure des circonférences.</p></div></div>
<div class="key"><b>À retenir.</b> Un souffle éjectionnel, des signes de surcharge et une pression d’au moins 180/110 mmHg modifient une chirurgie programmée. Après l’intervention, la perfusion, la volémie et la recherche d’une tamponnade précèdent toute interprétation de la troponine. La démarche préopératoire de l’ESC 2022 intègre maintenant ces éléments.</div>
<button class="pareto-btn ui" data-k="pareto-i97-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i97-7"><h2><span class="n">7</span>Évaluation cardiaque avant une chirurgie non cardiaque</h2>
<p>L’évaluation préopératoire répond à une seule question : un examen ou un traitement réalisé avant l’intervention réduira-t-il le risque, sans retarder une chirurgie nécessaire ? Elle se fait idéalement au moment où l’intervention est proposée (ESC 2022, classe I, niveau B), car un risque découvert la veille ne peut plus être réduit. Le risque se communique au patient en termes absolus, par exemple « 1 sur 100 ».</p>
<h3>7.1 La démarche en cinq étapes</h3>
<p>La figure suivante résume la démarche de l’ESC 2022 appliquée à M. R. Elle répond successivement à l’urgence, à l’instabilité cardiaque, au risque du patient, au risque de l’intervention et aux résultats des examens.</p>
<figure><svg viewBox="0 0 380 470" role="img" aria-label="Algorithme d’évaluation cardiaque avant une chirurgie non cardiaque selon l’ESC 2022" font-family="Georgia,serif" font-size="12"><g fill="none" stroke="#222" stroke-width="1.4"><rect x="60" y="6" width="260" height="40" rx="5"/><path d="M190 46v14m-5-5l5 5 5-5"/><rect x="60" y="62" width="260" height="40" rx="5"/><path d="M190 102v14m-5-5l5 5 5-5"/><rect x="60" y="118" width="260" height="40" rx="5"/><path d="M190 158v14m-5-5l5 5 5-5"/><rect x="10" y="174" width="110" height="78" rx="5"/><rect x="135" y="174" width="110" height="78" rx="5"/><rect x="260" y="174" width="110" height="78" rx="5"/><path d="M65 252v16m-5-5l5 5 5-5M190 252v16m-5-5l5 5 5-5M315 252v16m-5-5l5 5 5-5"/><rect x="10" y="270" width="110" height="80" rx="5"/><rect x="135" y="270" width="110" height="80" rx="5"/><rect x="260" y="270" width="110" height="80" rx="5"/><path d="M190 350v16m-5-5l5 5 5-5"/><rect x="20" y="368" width="340" height="44" rx="5"/><path d="M190 412v14m-5-5l5 5 5-5"/><rect x="20" y="428" width="340" height="36" rx="5"/><path d="M320 26h40M320 82h40M320 138h40"/></g><g fill="#222" text-anchor="middle"><text x="190" y="24">1. Intervention immédiate ?</text><text x="190" y="40">oui → opérer sans délai</text><text x="190" y="80">2. Cardiopathie instable ?</text><text x="190" y="96">oui → traiter d’abord, équipe pluridisciplinaire</text><text x="190" y="136">3. Âge et maladie cardiovasculaire</text><text x="190" y="152">ou facteurs de risque ?</text><text x="65" y="194">&lt; 65 ans</text><text x="65" y="210">sans facteur</text><text x="65" y="226">ni maladie</text><text x="190" y="194">≥ 65 ans ou</text><text x="190" y="210">facteurs</text><text x="190" y="226">de risque</text><text x="315" y="194">Maladie</text><text x="315" y="210">cardiovasculaire</text><text x="315" y="226">connue</text><text x="65" y="290">Aucun examen</text><text x="65" y="306">systématique ;</text><text x="65" y="322">45–65 ans : ECG</text><text x="65" y="338">si haut risque</text><text x="190" y="290">Risque</text><text x="190" y="306">intermédiaire</text><text x="190" y="322">ou élevé : ECG,</text><text x="190" y="338">troponine, NT-proBNP</text><text x="315" y="290">Idem, plus</text><text x="315" y="306">échocardiographie</text><text x="315" y="322">ou imagerie</text><text x="315" y="338">selon indication</text><text x="190" y="386">4. Résultats anormaux ou capacité faible :</text><text x="190" y="402">échocardiographie, imagerie d’effort</text><text x="190" y="446">5. Opérer et surveiller la troponine à 24 et 48 h</text></g></svg><figcaption>Figure 2 — Évaluation cardiaque avant une chirurgie non cardiaque, simplifiée d’après l’ESC 2022. Les classes de recommandation figurent dans le texte et l’onglet Examens.</figcaption></figure>
<p>La figure se lit de haut en bas : chaque étape n’est franchie que si la précédente l’autorise. L’erreur fréquente consiste à demander une échocardiographie ou une épreuve d’effort à tous les patients âgés : l’ESC 2022 déconseille l’évaluation systématique de la fonction ventriculaire (classe III, niveau C) et l’imagerie d’effort systématique (classe III, niveau C). Chez M. R., coronarien de 74 ans opéré d’une intervention à risque intermédiaire, la colonne de droite s’applique.</p>
<h3>7.2 Ce que recommande l’ESC 2022</h3>
<p>Le tableau rassemble les recommandations qui changent la conduite chez un patient de 65 ans ou plus, ou porteur de facteurs de risque ou d’une maladie cardiovasculaire, avant une intervention à risque intermédiaire ou élevé.</p>
<table class="t"><tr><th>Mesure</th><th>Indication</th><th>Classe, niveau</th></tr>
<tr><td><button class="w" data-k="i97-ecg-preop">ECG à 12 dérivations</button></td><td>Maladie ou facteur de risque cardiovasculaire (dont âge ≥ 65 ans), symptômes</td><td>I, C</td></tr>
<tr><td><button class="w" data-k="i97-tn-preop">Troponine hypersensible avant, puis à 24 et 48 heures</button></td><td>Même population</td><td>I, B</td></tr>
<tr><td><button class="w" data-k="i97-np-preop">BNP ou NT-proBNP</button></td><td>Même population</td><td>IIa, B</td></tr>
<tr><td>Échocardiographie transthoracique</td><td>Capacité faible, peptide élevé ou souffle, avant une chirurgie à haut risque</td><td>I, B</td></tr>
<tr><td>Échocardiographie transthoracique</td><td>Mêmes anomalies ou au moins un facteur de risque, avant une chirurgie à risque intermédiaire</td><td>IIb, B</td></tr>
<tr><td><button class="w" data-k="i97-imagerie-effort">Imagerie d’effort</button></td><td>Chirurgie programmée à haut risque, capacité faible et probabilité élevée de coronaropathie</td><td>I, B</td></tr>
<tr><td>Coronarographie</td><td>Mêmes indications qu’en dehors d’une chirurgie</td><td>I, C</td></tr>
<tr><td>Aucun examen systématique</td><td>Patient à bas risque, chirurgie à risque bas ou intermédiaire</td><td>III, B</td></tr></table>
<p>Le tableau se lit en commençant par la dernière ligne : l’absence d’examen est la règle chez le patient à bas risque. La troponine reçoit la classe la plus forte parce qu’elle sert deux fois : avant l’intervention, elle mesure une lésion chronique de base ; après, elle révèle une lésion aiguë autrement silencieuse. Chez M. R., la troponine T hypersensible vaut 18 ng/L (limite supérieure 14 ng/L) et le NT-proBNP 410 pg/mL, au-dessus du seuil de 125 pg/mL. L’échocardiographie, possible (classe IIb), montre une FEVG à 50 % sans valvulopathie. Aucune imagerie d’effort n’est indiquée : la chirurgie n’est pas à haut risque et la revascularisation prophylactique n’améliore pas le pronostic (<button class="w" data-k="i97-carp">essai CARP (revascularisation avant chirurgie vasculaire)</button>).</p>
<h3>7.3 Quand différer l’intervention</h3>
<p>Une intervention programmée se diffère devant un syndrome coronarien aigu, une insuffisance cardiaque décompensée, une arythmie mal contrôlée, un rétrécissement aortique sévère symptomatique ou une pression systolique d’au moins 180 mmHg ou diastolique d’au moins 110 mmHg. Elle se diffère aussi après une angioplastie : l’ESC 2022 recommande d’attendre 6 mois après une angioplastie programmée et 12 mois après un syndrome coronarien aigu (classe I, niveau A). Si l’intervention ne peut attendre, un mois de double antiagrégation au minimum est requis après une angioplastie programmée (classe I, niveau B), et au moins trois mois sont à envisager après un syndrome coronarien aigu à haut risque (classe IIa, niveau C). Ces délais existent parce que l’endothélisation du stent est incomplète au début : arrêter l’inhibiteur du récepteur P2Y12 trop tôt expose à une <button class="w" data-k="i97-thrombose-stent">thrombose de stent (mécanisme et gravité)</button>.</p>
<div class="key"><b>À retenir.</b> Avant une chirurgie à risque intermédiaire ou élevé, tout patient de 65 ans ou plus, ou porteur d’une maladie ou d’un facteur de risque cardiovasculaire, reçoit un ECG et une troponine hypersensible avant puis à 24 et 48 heures ; le peptide natriurétique est conseillé. Les examens d’imagerie restent réservés aux anomalies, aux capacités faibles et aux chirurgies à haut risque. Une intervention programmée attend 6 mois après une angioplastie programmée et 12 mois après un syndrome coronarien aigu.</div>

</section>

<section class="ilot" id="i97-8"><h2><span class="n">8</span>Urgences : hypotension et choc périopératoires</h2>
<div class="alert"><b>Gravité d’abord.</b> Une hypotension postopératoire avec signes d’hypoperfusion (marbrures, oligurie inférieure à 0,5 mL/kg/heure, confusion, lactate élevé) est un choc jusqu’à preuve du contraire. Le médecin appelle l’anesthésiste ou l’équipe de réanimation, pose deux voies veineuses, administre de l’oxygène si la saturation baisse, réalise un ECG et une échographie cardiaque ciblée, et cherche une hémorragie. Après chirurgie cardiaque, une tamponnade se décompresse sans délai. Une fibrillation auriculaire avec instabilité hémodynamique se cardioverse en urgence (ESC 2022, classe I).</div>
<p>Le choc postopératoire se code T81.1, mais son raisonnement est circulatoire. La pression artérielle moyenne dépend du débit cardiaque et des résistances vasculaires ; le débit dépend lui-même du remplissage, de la contractilité, de la fréquence et de l’absence d’obstacle. Chaque mécanisme a une cause postopératoire typique.</p>
<table class="t"><tr><th>Mécanisme</th><th>Causes postopératoires</th><th>Indices cliniques</th><th>Première mesure</th></tr>
<tr><td>Hypovolémique</td><td>Hémorragie, pertes digestives, jeûne prolongé</td><td>Extrémités froides, veines plates, drains productifs, Hb en baisse</td><td>Remplissage, transfusion, hémostase</td></tr>
<tr><td>Distributif</td><td>Sepsis, anaphylaxie, anesthésie neuraxiale, vasoplégie après circulation extracorporelle</td><td>Extrémités chaudes au début, pression diastolique basse</td><td>Remplissage puis noradrénaline ; traitement de la cause</td></tr>
<tr><td>Cardiogénique</td><td>Infarctus, sidération après chirurgie cardiaque, arythmie</td><td>Jugulaires turgescentes, crépitants, ECG modifié</td><td>Échocardiographie, traitement de la cause, inotrope</td></tr>
<tr><td>Obstructif</td><td><button class="w" data-k="i30-echo-tamp">Tamponnade (signes échographiques)</button>, embolie pulmonaire, pneumothorax sous tension</td><td>Jugulaires turgescentes, poumons clairs, ventricule droit dilaté</td><td>Lever l’obstacle</td></tr></table>
<p>Le tableau se lit par la colonne des indices : les veines du cou séparent les chocs à pression veineuse basse, hypovolémique et distributif, des chocs à pression veineuse élevée, cardiogénique et obstructif. L’erreur fréquente consiste à remplir abondamment un patient dont le choc est cardiogénique ou obstructif : le liquide aggrave alors la congestion sans augmenter le débit. Après chirurgie cardiaque, une hypotension avec des drains qui cessent brusquement de couler évoque une tamponnade par caillot, même si le péricarde a été laissé ouvert.</p>
<h3>8.1 L’hypotension sans choc</h3>
<p>Une hypotension isolée est fréquente après l’anesthésie. Elle compte pourtant, car sa durée s’associe à la lésion myocardique et rénale. L’essai <button class="w" data-k="i97-poise3">POISE-3 (stratégie d’évitement de l’hypotension)</button> a comparé chez 7 490 patients hypertendus une cible peropératoire de pression moyenne d’au moins 80 mmHg, avec arrêt des inhibiteurs du SRAA, à une cible d’au moins 60 mmHg avec poursuite de tous les antihypertenseurs. Les complications vasculaires majeures ont été identiques : 13,9 % contre 14,0 %. L’essai ne justifie donc pas une cible plus haute pour tous ; l’ESC 2022 maintient l’objectif d’éviter une baisse de plus de 20 % ou une pression moyenne inférieure à 60 à 70 mmHg pendant 10 minutes ou plus.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer une hypotension au premier jour aux seuls analgésiques. Chez M. R., la pression moyenne de 58 mmHg pendant 25 minutes coïncide avec une Hb à 84 g/L : l’anémie aiguë et l’hypotension réduisent ensemble l’apport en oxygène au myocarde, et la troponine du lendemain le confirme.</div>
<div class="key"><b>À retenir.</b> Devant une hypotension postopératoire, le médecin recherche d’abord des signes d’hypoperfusion, puis classe le mécanisme par la pression veineuse et l’échocardiographie ; il ne remplit pas un choc cardiogénique ou obstructif. Une hypotension prolongée, même sans choc, prépare la lésion myocardique traitée dans l’îlot suivant.</div>
</section>
