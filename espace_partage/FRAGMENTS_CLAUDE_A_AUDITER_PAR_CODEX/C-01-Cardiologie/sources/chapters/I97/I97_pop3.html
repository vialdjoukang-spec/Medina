
<!-- ===== FENÊTRES I97 : complications, chirurgie cardiaque, I98, renvois ===== -->
<template data-pop="i97-manage" data-title="Essai MANAGE (2018) : dabigatran après une lésion myocardique">
<div class="lab">Plan</div><p>Essai international randomisé contre placebo chez 1 754 patients, d’âge moyen 70 ans, ayant présenté une lésion myocardique attribuée à une ischémie après une chirurgie non cardiaque, surtout orthopédique, générale ou vasculaire. Le dabigatran 110 mg deux fois par jour était débuté dans les 35 jours, en médiane 6 jours après l’intervention, et pris en moyenne 9 mois. Soixante pour cent des patients prenaient déjà de l’aspirine ou un inhibiteur du récepteur P2Y12.</p>
<div class="lab">Résultats</div><p>Le critère principal, qui réunissait décès vasculaire, infarctus, AVC non hémorragique, thrombose artérielle périphérique, amputation et thrombose veineuse symptomatique, est survenu chez 11 % des patients sous dabigatran contre 15 % sous placebo (rapport de risques 0,72 ; intervalle de confiance à 95 % 0,55 à 0,93). Les hémorragies majeures n’ont pas augmenté. Plus de 90 % des lésions étaient sans symptôme.</p>
<div class="lab">Interprétation</div><p>Le mécanisme proposé est une réduction de la génération de thrombine dans un état prothrombotique postopératoire. Le bénéfice repose sur un seul essai, avec un arrêt fréquent du traitement ; l’ESC 2022 n’en tire qu’une recommandation faible (classe IIb, niveau B) chez les patients à faible risque hémorragique, à partir d’une semaine après l’intervention.</p>
<div class="lab">Contexte suisse</div><p>L’information professionnelle suisse du dabigatran ne mentionne pas cette indication : la prescription est hors indication et se discute avec le cardiologue.</p>
<p class="small">Source : Devereaux et al., <i>Lancet</i> 2018;391:2325–2334 ; ESC 2022, section 8.1 et recommandation 34.</p>
</template>

<template data-pop="i97-poise3" data-title="Essai POISE-3 : stratégies de pression artérielle">
<div class="lab">Plan</div><p>Essai randomisé dans 110 hôpitaux de 22 pays, chez 7 490 patients à risque vasculaire, opérés d’une chirurgie non cardiaque et prenant au moins un antihypertenseur au long cours.</p>
<div class="lab">Deux stratégies</div><p><b>Évitement de l’hypotension</b> : pression moyenne peropératoire d’au moins 80 mmHg ; inhibiteurs du SRAA suspendus avant et pendant 2 jours après l’intervention ; autres antihypertenseurs donnés seulement si la systolique atteignait 130 mmHg. <b>Évitement de l’hypertension</b> : pression moyenne d’au moins 60 mmHg et poursuite de tous les antihypertenseurs.</p>
<div class="lab">Résultats</div><p>Le critère principal, décès vasculaire, lésion myocardique non mortelle, AVC et arrêt cardiaque à 30 jours, est survenu chez 13,9 % contre 14,0 % (rapport de risques 0,99).</p>
<div class="lab">Interprétation</div><p>Une cible plus élevée appliquée à tous n’apporte pas de bénéfice démontré. L’adhésion aux stratégies était imparfaite. L’essai ne contredit pas l’objectif de l’ESC 2022, qui vise à éviter les hypotensions profondes ou prolongées.</p>
<p class="small">Source : Marcucci M et al., <i>Annals of Internal Medicine</i> 2023;176:605–614.</p>
</template>

<template data-pop="i97-poise" data-title="Essais POISE-1 et POISE-2">
<div class="lab">POISE-1 (2008)</div><p>8 351 patients non traités par bêtabloquant ont reçu du métoprolol succinate à libération prolongée 200 mg par jour ou un placebo, débuté 2 à 4 heures avant l’intervention et poursuivi 30 jours. Le critère principal, décès cardiovasculaire, infarctus et arrêt cardiaque non mortels, a baissé de 6,9 % à 5,8 %. Les décès, les AVC et les hypotensions ou bradycardies significatives ont toutefois augmenté ; l’hypotension expliquait la plus grande part des décès et des AVC.</p>
<div class="lab">Leçon</div><p>Un bêtabloquant à forte dose débuté juste avant l’intervention empêche l’adaptation à l’hypovolémie et au saignement : la fréquence ne peut plus compenser la baisse de la pression. D’où la classe III de l’initiation en routine.</p>
<div class="lab">POISE-2 (2014)</div><p>L’aspirine périopératoire n’a pas réduit les décès ni les infarctus à 30 jours et a augmenté les saignements majeurs. Une analyse secondaire suggérait un bénéfice chez les patients porteurs d’un stent, d’où la poursuite de l’aspirine après angioplastie.</p>
<div class="lab">Arrêt du bêtabloquant</div><p>À l’inverse, l’arrêt d’un bêtabloquant chronique s’associait à une mortalité accrue dans cinq études observationnelles, et une interruption de plus de 2 jours après l’intervention pourrait doubler le risque de fibrillation.</p>
<p class="small">Source : ESC 2022, sections 5.2 et 5.3.1.</p>
</template>

<template data-pop="i97-poaf-oac" data-title="Anticoagulation de la fibrillation postopératoire : quelle recommandation retenir ?">
<div class="lab">Recommandation retenue (la plus récente)</div><p><b>ESC 2024 sur la fibrillation auriculaire</b> : une anticoagulation orale au long cours doit être envisagée chez les patients présentant une fibrillation postopératoire après chirurgie cardiaque ou non cardiaque, à risque thromboembolique élevé, pour prévenir l’AVC et l’embolie (classe IIa, niveau B).</p>
<div class="lab">Texte antérieur toujours en vigueur pour la chirurgie non cardiaque</div><p><b>ESC 2022 sur la chirurgie non cardiaque</b> : après une chirurgie non cardiaque, une anticoagulation au long cours doit être envisagée chez tous les patients à risque d’AVC, en tenant compte du bénéfice net attendu et des préférences du patient informé (classe IIa, niveau B). Une anticoagulation thérapeutique est à envisager le plus tôt possible pendant l’hospitalisation selon le CHA₂DS₂-VASc et le risque hémorragique.</p>
<div class="lab">Relation entre les deux textes</div><p>Les deux recommandations concordent pour la chirurgie non cardiaque. L’ESC 2024 étend la classe IIa à la chirurgie cardiaque, où la recommandation antérieure de 2020 était plus faible, et remplace le CHA₂DS₂-VASc par le CHA₂DS₂-VA.</p>
<div class="lab">Niveau de preuve et limites</div><p>Les preuves sont observationnelles : aucun essai randomisé n’a encore démontré le bénéfice de l’anticoagulation dans cette situation. Le risque d’AVC rapporté après fibrillation postopératoire varie fortement d’une étude à l’autre. Le risque hémorragique de la plaie pèse sur le moment de l’instauration.</p>
<div class="lab">Applicabilité en Suisse</div><p>La Société suisse de cardiologie applique les recommandations de l’ESC ; aucune recommandation suisse divergente n’a été trouvée.</p>
<p class="small">Source : Van Gelder et al., ESC 2024, recommandation 26 (section 9.6) ; Halvorsen S et al., ESC 2022, section 8.6.2.2 et recommandation 34.</p>
</template>

<template data-pop="i97-copps2" data-title="Essai COPPS-2 (2014)">
<div class="lab">Plan</div><p>Essai randomisé en double aveugle dans 11 centres italiens, chez 360 candidats à une chirurgie cardiaque en rythme sinusal. La colchicine, 0,5 mg deux fois par jour à partir de 70 kg ou une fois par jour en dessous, était débutée 48 à 72 heures avant l’intervention et poursuivie un mois.</p>
<div class="lab">Résultats</div><p>Le syndrome post-péricardiotomie à 3 mois est survenu chez 19,4 % des patients sous colchicine contre 29,4 % sous placebo (différence absolue 10 % ; nombre à traiter 10). La fibrillation postopératoire et les épanchements n’ont pas diminué significativement dans l’analyse principale. Les effets indésirables, surtout digestifs, ont été plus fréquents : 20,0 % contre 11,7 % (nombre pour nuire 12), sans effet indésirable grave.</p>
<div class="lab">Conséquence</div><p>L’ESC 2025 recommande d’envisager la colchicine selon ce schéma en l’absence de contre-indication et si elle est tolérée (classe IIa, niveau A). Une méta-analyse citée par l’ESC 2025 montre que seule la colchicine, parmi les préventions testées (aspirine, méthylprednisolone, dexaméthasone), réduit ce syndrome (rapport de cotes 0,38).</p>
<p class="small">Source : Imazio M et al., <i>JAMA</i> 2014;312:1016–1023 ; ESC 2025, section 11.3.</p>
</template>

<template data-pop="i97-pcis-crit" data-title="Critères du syndrome post-lésion cardiaque (ESC 2025)">
<div class="lab">Critères</div><p>Au moins deux des cinq critères suivants, après une lésion cardiaque : 1. fièvre sans autre cause ; 2. douleur péricardique ou pleurale ; 3. frottement péricardique ou pleural ; 4. épanchement péricardique ; 5. épanchement pleural avec élévation de la CRP.</p>
<div class="lab">Exigence d’inflammation</div><p>La preuve d’une activité inflammatoire, par exemple une CRP élevée, est indispensable. Elle distingue le syndrome des conséquences mécaniques banales de la chirurgie, comme un épanchement pleural ou péricardique précoce sans inflammation.</p>
<div class="lab">Pourquoi ces critères</div><p>Ils reflètent l’atteinte conjointe du péricarde et de la plèvre, parfois avec infiltrats pulmonaires : le syndrome n’est pas une simple péricardite, d’où des critères distincts de ceux de la péricardite aiguë.</p>
<div class="lab">Imagerie</div><p>L’imagerie multimodale aide dans les formes compliquées, épanchements cloisonnés ou inflammation persistante.</p>
<div class="lab">Exemple</div><p>Mme B. réunit fièvre, douleur pleurale, frottement et épanchement péricardique, avec une CRP à 96 mg/L.</p>
<p class="small">Source : ESC 2025, section 11.3.1.</p>
</template>

<template data-pop="i97-mediastinite" data-title="Médiastinite après sternotomie">
<div class="lab">Définition</div><p>La médiastinite est une infection profonde de la sternotomie qui atteint le médiastin. Elle survient le plus souvent dans les premières semaines.</p>
<div class="lab">Facteurs de risque</div><p>Le diabète, l’obésité, une bronchopneumopathie, le prélèvement des deux artères mammaires internes, une reprise chirurgicale et une ventilation prolongée augmentent le risque, car ils réduisent la vascularisation du sternum ou les défenses contre l’infection.</p>
<div class="lab">Signes</div><p>La médiastinite se manifeste par une fièvre, un écoulement ou une rougeur de la cicatrice, une instabilité du sternum à la toux, une douleur et parfois un sepsis. Les staphylocoques en sont les germes les plus fréquents.</p>
<div class="lab">Pourquoi l’exclure d’abord</div><p>Elle partage la fièvre et la douleur avec le syndrome post-péricardiotomie, mais un anti-inflammatoire seul la laisserait évoluer. Elle exige un débridement chirurgical et une antibiothérapie.</p>
<div class="lab">Examens</div><p>Les hémocultures, les prélèvements de la plaie et le scanner thoracique orientent le diagnostic ; la CRP et la procalcitonine sont peu discriminantes après chirurgie cardiaque.</p>
<p class="small">Source : principes de chirurgie cardiaque ; ESC 2025, section 11.3.</p>
</template>

<template data-pop="i97-pc-shock" data-title="Défaillance cardiaque postcardiotomie">
<div class="lab">Définition</div><p>Impossibilité de sevrer la circulation extracorporelle, ou choc cardiogénique persistant malgré les inotropes et les vasopresseurs à dose maximale. Elle survient chez moins de 4 % des adultes opérés du cœur.</p>
<div class="lab">Difficulté</div><p>Beaucoup de patients présentent au sevrage une dysfonction transitoire et un bas débit qui se corrigent vite avec les médicaments. L’enjeu est d’identifier ceux qui ne récupéreront pas et de les assister avant les lésions d’organe.</p>
<div class="lab">Causes</div><p>Sidération étendue, protection myocardique insuffisante, occlusion de greffon, dysfonction de prothèse, défaillance ventriculaire droite, vasoplégie associée.</p>
<div class="lab">Assistance</div><p>L’ECLS veino-artérielle est l’assistance temporaire la plus utilisée. Dans une large méta-analyse citée par le consensus, 34 % des patients assistés ont survécu jusqu’à la sortie ; les séries monocentriques rapportent 25 à 42 %.</p>
<p class="small">Source : Lorusso R et al., consensus EACTS/ELSO/STS/AATS 2020, <i>Annals of Thoracic Surgery</i> 2021;111:327–369.</p>
</template>

<template data-pop="i97-ppm" data-title="Disproportion entre prothèse valvulaire et patient">
<div class="lab">Définition</div><p>La disproportion existe quand la surface effective d’une prothèse aortique fonctionnelle est trop petite pour le débit du patient. Le gradient reste élevé alors que la prothèse est normale.</p>
<div class="lab">Seuils</div><p>La surface effective indexée à la surface corporelle définit une disproportion modérée à 0,85 cm²/m² ou moins et sévère à 0,65 cm²/m² ou moins ; des seuils plus bas s’appliquent chez l’obèse (critères VARC-3).</p>
<div class="lab">Mécanisme</div><p>Le ventricule gauche continue d’éjecter contre un obstacle : l’hypertrophie régresse moins et une insuffisance cardiaque peut persister.</p>
<div class="lab">Diagnostic différentiel</div><p>Un gradient élevé peut aussi traduire une thrombose de valve, une dégénérescence ou une fuite ; l’échocardiographie compare la surface mesurée à la surface attendue pour le modèle.</p>
<div class="lab">Codage</div><p>Une insuffisance cardiaque due à une prothèse cardiaque est incluse dans I97.1.</p>
<p class="small">Source : VARC-3, <i>European Heart Journal</i> 2021 ; BfArM, CIM-10-GM 2024.</p>
</template>

<template data-pop="i97-syphilis-cv" data-title="Syphilis cardiovasculaire (I98.0)">
<div class="lab">Mécanisme</div><p>Au stade tertiaire, <i>Treponema pallidum</i> atteint les vasa vasorum de l’aorte ascendante. L’endartérite oblitérante prive la média de sang ; ses fibres élastiques et musculaires se détruisent et sont remplacées par une fibrose.</p>
<div class="lab">Délai</div><p>L’aortite apparaît habituellement 10 à 30 ans après une infection non traitée.</p>
<div class="lab">Manifestations</div><p>L’aortite donne un anévrisme de l’aorte ascendante, souvent calcifié, une insuffisance aortique par dilatation de l’anneau et une sténose des ostia coronaires responsable d’angor.</p>
<div class="lab">Diagnostic</div><p>Le diagnostic repose sur une sérologie tréponémique positive et l’imagerie de l’aorte ; une analyse du liquide céphalorachidien recherche une neurosyphilis associée.</p>
<div class="lab">Traitement</div><p>La pénicilline traite l’infection mais ne répare pas l’aorte ; l’anévrisme et la valvulopathie relèvent de la chirurgie selon leurs critères propres.</p>
<div class="lab">Codage</div><p>L’aortite se code A52.0† pour l’étiologie et I98.0* pour la manifestation.</p>
<p class="small">Source : BfArM, CIM-10-GM 2024 ; pathologie classique de la syphilis tertiaire.</p>
</template>

<template data-pop="i97-chagas" data-title="Maladie de Chagas chronique (I98.1)">
<div class="lab">Agent et transmission</div><p><i>Trypanosoma cruzi</i> se transmet par des punaises triatomes en Amérique latine, et hors zone d’endémie par la mère à l’enfant, la transfusion et la greffe.</p>
<div class="lab">Mécanisme</div><p>La persistance du parasite dans le myocarde et la réaction immunitaire produisent une myocardite chronique fibrosante, qui atteint aussi le tissu de conduction et l’innervation autonome.</p>
<div class="lab">Manifestations</div><p>Des décennies après l’infection, une partie des patients développent une cardiomyopathie. Elle associe un bloc de branche droit et un hémibloc antérieur gauche, des extrasystoles et des tachycardies ventriculaires, un anévrisme apical, une insuffisance cardiaque et des embolies.</p>
<div class="lab">Dépistage en Suisse</div><p>La Suisse compte des personnes originaires des pays d’endémie. Une sérologie se demande devant un ECG ou une cardiomyopathie évocateurs chez une personne née ou ayant vécu en Amérique latine, et chez la femme enceinte originaire de ces pays.</p>
<div class="lab">Traitement</div><p>Le benznidazole est indiqué dans les formes récentes. Dans l’essai BENEFIT, il n’a pas réduit la détérioration clinique d’une cardiomyopathie établie. Le traitement de la cardiomyopathie suit celui de l’insuffisance cardiaque et des arythmies.</p>
<div class="lab">Codage</div><p>L’atteinte se code B57.2† pour l’étiologie et I98.1* pour la manifestation.</p>
<p class="small">Source : BfArM, CIM-10-GM 2024 ; Morillo et al., BENEFIT, <i>New England Journal of Medicine</i> 2015.</p>
</template>

<template data-pop="i97-serosyph" data-title="Sérologie de la syphilis">
<div class="lab">Deux familles de tests</div><p>Les tests tréponémiques détectent des anticorps dirigés contre le tréponème ; ils restent positifs à vie, même après traitement. Les tests non tréponémiques détectent des anticorps anti-cardiolipine ; leur titre reflète l’activité de l’infection et baisse après traitement.</p>
<div class="lab">Au stade tertiaire</div><p>Le test tréponémique est positif. Le test non tréponémique peut être faiblement positif ou négatif, car son titre baisse spontanément avec le temps.</p>
<div class="lab">Piège</div><p>Un test non tréponémique négatif n’exclut pas une aortite syphilitique ; un test non tréponémique positif isolé peut être un faux positif (grossesse, maladie auto-immune).</p>
<p class="small">Source : principes de la sérologie de la syphilis.</p>
</template>

<template data-pop="i97-acidocetose" data-title="Acidocétose euglycémique sous iSGLT2">
<div class="lab">Définition</div><p>Acidose métabolique avec corps cétoniques élevés, alors que la glycémie est normale ou modérément élevée, souvent inférieure à 14 mmol/L.</p>
<div class="lab">Mécanisme</div><p>L’iSGLT2 élimine le glucose dans l’urine : la glycémie reste basse malgré le déficit en insuline. La baisse de l’insuline et la hausse du glucagon pendant le jeûne et le stress chirurgical activent la cétogenèse.</p>
<div class="lab">Pourquoi elle est piégeuse</div><p>Une glycémie presque normale n’alerte pas ; les nausées et la fatigue sont attribuées à l’anesthésie. Le diagnostic se fait par la mesure des gaz du sang et des cétones.</p>
<div class="lab">Prévention</div><p>L’ESC 2022 propose d’interrompre l’iSGLT2 au moins 3 jours avant une chirurgie à risque intermédiaire ou élevé (classe IIa, niveau C), et de le reprendre une fois l’alimentation rétablie.</p>
<p class="small">Source : ESC 2022, recommandation 12.</p>
</template>

<template data-pop="i97-renvoi-i21" data-title="Renvoi : I21 — Infarctus aigu du myocarde (C-01-Cardiologie)">
<div class="lab">Ce qui reste dans ce cours</div><p>Le dépistage de la lésion myocardique périopératoire, ses mécanismes propres et son bilan en cinq étapes.</p>
<div class="lab">Ce que traite le cours I21</div><p>Le diagnostic et le traitement de l’infarctus avec ou sans sus-décalage du ST, la coronarographie, les antithrombotiques et la prévention secondaire, ainsi que la définition universelle de l’infarctus, dont la cinquième version de 2026.</p>
<div class="lab">Adaptation postopératoire</div><p>Un infarctus postopératoire se traite comme hors chirurgie, après discussion du risque hémorragique avec le chirurgien (ESC 2022, classe I, niveau C). Dans les cinq premiers jours, le saignement limite les antithrombotiques selon le site et l’étendue de l’intervention.</p>
<p class="small">Source : ESC 2022, sections 8.1 et 8.2.</p>
</template>

<template data-pop="i97-renvoi-i50" data-title="Renvoi : I50 — Insuffisance cardiaque (C-01-Cardiologie)">
<div class="lab">Ce qui reste dans ce cours</div><p>La défaillance postcardiotomie, l’insuffisance cardiaque liée à une prothèse et son codage en I97.1, et l’insuffisance cardiaque aiguë postopératoire après chirurgie non cardiaque.</p>
<div class="lab">Ce que traite le cours I50</div><p>Le diagnostic, la classification par la FEVG, le traitement de fond et la prise en charge de la décompensation.</p>
<div class="lab">Fréquence postopératoire</div><p>L’insuffisance cardiaque aiguë touche 1 à 2 % des patients à risque dans les 30 jours d’une chirurgie non cardiaque majeure, et 4 à 6 % dans l’année ; l’insuffisance cardiaque chronique méconnue et les apports liquidiens en sont les principaux déterminants.</p>
<p class="small">Source : ESC 2022, section 8.4.</p>
</template>

<template data-pop="i97-renvoi-i89" data-title="Renvoi : I89 — Lymphœdème (C-01-Cardiologie)">
<div class="lab">Ce qui reste dans ce cours</div><p>Le codage des lymphœdèmes après un acte médical (I97.2- et I97.8-) et leur risque selon le geste.</p>
<div class="lab">Ce que traite le cours I89</div><p>La physiopathologie, les stades, la mesure des volumes, la lymphoscintigraphie, la thérapie décongestive complexe, la compression, la chirurgie lymphatique, l’érysipèle et la prise en charge des coûts en Suisse.</p>
<div class="lab">Message principal</div><p>Une mesure des deux bras avant la chirurgie mammaire permet de détecter tôt un excès de volume ; la biopsie du ganglion sentinelle réduit le risque par rapport au curage.</p>
<p class="small">Source : cours I89 ; DiSipio T et al., <i>Lancet Oncology</i> 2013.</p>
</template>
