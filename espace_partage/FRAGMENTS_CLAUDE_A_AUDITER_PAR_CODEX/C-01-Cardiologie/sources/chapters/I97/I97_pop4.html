
<!-- ===== FENÊTRES I97 : monographies et Pareto ===== -->
<template data-pop="i97-d-bb" data-title="Bêtabloquants autour d’une intervention">
<div class="lab">Mécanisme</div><p>Le blocage des récepteurs bêta-1 ralentit le cœur, réduit la contractilité et allonge la diastole : les besoins en oxygène baissent et la perfusion coronaire s’améliore. Le même blocage empêche la tachycardie compensatrice d’une hypovolémie ou d’un saignement.</p>
<div class="lab">Poursuite (classe I, niveau B)</div><p>Un traitement chronique se poursuit, y compris le matin de l’intervention. Après un traitement prolongé, les récepteurs bêta sont plus nombreux ; un arrêt brutal expose à une tachycardie, à une ischémie et à une fibrillation. L’arrêt s’associait à une mortalité accrue dans cinq études observationnelles.</p>
<div class="lab">Initiation</div><p>Non recommandée en routine (classe III, niveau A), à la suite de POISE-1. À envisager avant une chirurgie à haut risque chez un patient à au moins deux facteurs de risque de l’indice révisé (classe IIb, niveau A), ou chez un coronarien ou un patient ischémique (classe IIb, niveau B). Elle se fait idéalement au moins une semaine avant, à faible dose, vers une fréquence de repos de 60 à 70/min avec une pression systolique supérieure à 100 mmHg. L’aténolol ou le bisoprolol sont préférés.</p>
<div class="lab">Surveillance</div><p>Fréquence et pression avant chaque prise ; réduction ou omission d’une dose en cas d’hypotension, de bradycardie ou de saignement actif, sans arrêt définitif injustifié.</p>
<div class="lab">Contre-indications</div><p>Bloc auriculoventriculaire de haut degré sans stimulateur, bradycardie symptomatique, choc, asthme sévère pour les molécules non sélectives.</p>
<p class="small">Source : ESC 2022, section 5.2 et recommandation 12.</p>
</template>

<template data-pop="i97-d-sraa" data-title="IEC et ARA autour d’une intervention">
<div class="lab">Mécanisme de l’hypotension</div><p>L’anesthésie supprime le tonus sympathique ; la pression dépend alors davantage du système rénine-angiotensine. Un IEC ou un ARA bloque cette compensation et favorise l’hypotension à l’induction.</p>
<div class="lab">Recommandation</div><p>Sans insuffisance cardiaque, suspendre l’IEC ou l’ARA le jour de l’intervention est à envisager (ESC 2022, classe IIa, niveau B). Avec une insuffisance cardiaque stable, la poursuite peut être envisagée (classe IIb, niveau C). Le traitement se reprend dès que possible.</p>
<div class="lab">Preuves</div><p>L’omission dans les 24 heures précédentes s’associait à moins d’hypotension peropératoire ; une revue systématique n’a pas montré d’effet sur la mortalité ni sur les événements cardiovasculaires majeurs. Dans POISE-3, l’arrêt des inhibiteurs du SRAA faisait partie de la stratégie d’évitement de l’hypotension, sans bénéfice global.</p>
<div class="lab">Piège</div><p>Un IEC non repris après la sortie prive un insuffisant cardiaque ou un diabétique albuminurique d’un traitement pronostique.</p>
<p class="small">Source : ESC 2022, section 5.2 et recommandation 12.</p>
</template>

<template data-pop="i97-d-sglt2" data-title="iSGLT2 autour d’une intervention">
<div class="lab">Mécanisme</div><p>L’inhibition du cotransporteur sodium-glucose de type 2 au tube proximal élimine du glucose et du sodium dans l’urine. Elle abaisse la glycémie sans insuline et favorise une légère cétose.</p>
<div class="lab">Risque périopératoire</div><p>Le jeûne, la baisse de l’insuline et le stress chirurgical favorisent une acidocétose euglycémique, dont la glycémie presque normale retarde le diagnostic. La diurèse osmotique s’ajoute à l’hypovolémie.</p>
<div class="lab">Recommandation</div><p>Interrompre au moins 3 jours avant une chirurgie à risque intermédiaire ou élevé est à envisager (ESC 2022, classe IIa, niveau C). La reprise se fait quand l’alimentation et l’hydratation sont rétablies, car le bénéfice cardiorénal au long cours reste démontré.</p>
<p class="small">Source : ESC 2022, recommandation 12.</p>
</template>

<template data-pop="i97-d-aspirine" data-title="Aspirine à faible dose autour d’une intervention">
<div class="lab">Mécanisme</div><p>L’aspirine acétyle de façon irréversible la cyclo-oxygénase 1 des plaquettes : la synthèse de thromboxane A2 cesse pour toute la vie de la plaquette, environ 7 à 10 jours.</p>
<div class="lab">Après angioplastie</div><p>Poursuivre si le risque hémorragique le permet (ESC 2022, classe I, niveau B), pour protéger le stent.</p>
<div class="lab">En prévention primaire</div><p>L’arrêt avant l’intervention est possible, et l’arrêt définitif est à envisager chez un patient à risque faible ou modéré : POISE-2 n’a montré aucun bénéfice et plus de saignements.</p>
<div class="lab">Chirurgie à très haut risque hémorragique</div><p>Arrêt d’au moins 7 jours avant une neurochirurgie intracrânienne ou rachidienne ou une chirurgie vitréorétinienne (classe I, niveau C). Sans antécédent d’angioplastie, un arrêt d’au moins 3 jours peut être envisagé si le saignement l’emporte (classe IIb, niveau B).</p>
<div class="lab">Reprise</div><p>Dans les 48 heures si possible (classe I, niveau C).</p>
<p class="small">Source : ESC 2022, section 5.3.1 et recommandation 13.</p>
</template>

<template data-pop="i97-d-p2y12" data-title="Inhibiteurs du récepteur P2Y12 : délais d’arrêt">
<div class="lab">Délais (ESC 2022, classe I, niveau B)</div><p>Si l’arrêt est indiqué : ticagrélor 3 à 5 jours, clopidogrel 5 jours, prasugrel 7 jours avant l’intervention.</p>
<div class="lab">Pourquoi ces écarts</div><p>Le clopidogrel et le prasugrel sont des promédicaments dont le métabolite bloque le récepteur de façon irréversible : la fonction revient avec les nouvelles plaquettes, environ 10 à 15 % par jour. Le prasugrel inhibe plus fortement, d’où le délai plus long. Le ticagrélor bloque le récepteur de façon réversible : son effet décroît avec sa concentration.</p>
<div class="lab">Décision</div><p>La gestion après une angioplastie récente se discute entre chirurgien, anesthésiste et cardiologue (classe I, niveau C). L’aspirine se poursuit pendant l’arrêt de l’inhibiteur du P2Y12.</p>
<p class="small">Source : ESC 2022, recommandation 13 et tableau 7.</p>
</template>

<template data-pop="i97-d-aspirine-hd" data-title="Aspirine à haute dose dans le syndrome post-péricardiotomie">
<div class="lab">Mécanisme</div><p>À haute dose, l’aspirine inhibe les cyclo-oxygénases des tissus et des leucocytes, pas seulement celles des plaquettes : elle réduit la synthèse des prostaglandines responsables de la fièvre, de la douleur et de l’exsudat.</p>
<div class="lab">Place</div><p>Premier choix chez le patient déjà sous antiplaquettaire, comme après un pontage, et dans la péricardite après infarctus (ESC 2025, classe I, niveau C), car elle évite d’ajouter un deuxième AINS qui s’opposerait à l’effet antiplaquettaire de l’aspirine.</p>
<div class="lab">Posologie (ESC 2025)</div><p>750 à 1 000 mg trois fois par jour pendant 1 à 2 semaines, puis décroissance de 250 mg toutes les 1 à 2 semaines selon les symptômes et la CRP. Un inhibiteur de la pompe à protons protège l’estomac.</p>
<div class="lab">Précautions</div><p>Saignement digestif, surtout avec un anticoagulant ; insuffisance rénale ; asthme avec intolérance à l’aspirine. La créatinine se contrôle chez le patient âgé.</p>
<p class="small">Source : ESC 2025, tableau 13 et recommandation 22.</p>
</template>

<template data-pop="i97-d-colchicine" data-title="Colchicine : traitement et prévention">
<div class="lab">Mécanisme</div><p>La colchicine se lie à la tubuline et empêche la polymérisation des microtubules. Elle réduit la migration des neutrophiles et l’assemblage de l’inflammasome NLRP3, donc la libération d’interleukine 1.</p>
<div class="lab">Posologie (ESC 2025)</div><p>Traitement : 0,5 mg une fois par jour en dessous de 70 kg ou en cas d’insuffisance rénale sévère, sinon deux fois par jour, sans dose de charge. Prévention du syndrome post-péricardiotomie : 0,5 mg une fois par jour jusqu’à 70 kg, deux fois au-delà, de 48 à 72 heures avant l’intervention à un mois après (classe IIa, niveau A).</p>
<div class="lab">Effets indésirables</div><p>Diarrhée et nausées, plus fréquentes que sous placebo dans COPPS-2 (nombre pour nuire 12) ; rarement myopathie, neuropathie et cytopénie, surtout en cas d’accumulation.</p>
<div class="lab">Contre-indications et interactions</div><p>Selon l’information professionnelle suisse citée dans le cours I30, la colchicine est contre-indiquée en dessous de 30 mL/min de clairance et en association avec les inhibiteurs puissants du CYP3A4 ou de la glycoprotéine P. Son élimination dépend de ces deux voies : leur inhibition fait monter la concentration jusqu’à la toxicité.</p>
<div class="lab">Surveillance</div><p>Transit, créatinine, hémogramme et créatine kinase en cas de traitement prolongé ou de douleurs musculaires.</p>
<p class="small">Source : ESC 2025, section 11.3 et tableau 13 ; Imazio M et al., <i>JAMA</i> 2014.</p>
</template>

<template data-pop="i97-d-anakinra" data-title="Anakinra dans les formes réfractaires">
<div class="lab">Mécanisme</div><p>L’anakinra est un antagoniste recombinant du récepteur de l’interleukine 1. Il bloque l’action de l’interleukine 1 alpha et bêta, cytokines centrales de l’inflammation péricardique récidivante.</p>
<div class="lab">Place</div><p>L’ESC 2025 recommande un antagoniste de l’interleukine 1 dans le syndrome post-lésion cardiaque réfractaire, pour prévenir les récidives et l’évolution vers la constriction (classe I, niveau B).</p>
<div class="lab">Posologie (ESC 2025)</div><p>1 à 2 mg/kg/jour par voie sous-cutanée, au plus 100 mg/jour chez l’adulte, pendant au moins 6 mois, puis décroissance pendant au moins 3 à 6 mois.</p>
<div class="lab">Effets indésirables</div><p>Réactions au point d’injection, infections, neutropénie, élévation des transaminases. Le dépistage d’une tuberculose latente et l’hémogramme précèdent le traitement.</p>
<div class="lab">Prescription</div><p>Elle relève d’un centre spécialisé des maladies péricardiques.</p>
<p class="small">Source : ESC 2025, tableau 13 et recommandation 22.</p>
</template>

<template data-pop="i97-d-amiodarone" data-title="Amiodarone et fibrillation postopératoire">
<div class="lab">Mécanisme</div><p>L’amiodarone bloque surtout les courants potassiques de repolarisation, ce qui allonge la période réfractaire auriculaire ; elle bloque aussi les canaux sodiques et calciques et les récepteurs bêta, ce qui freine le nœud auriculoventriculaire.</p>
<div class="lab">Place</div><p>Recommandée en périopératoire pour prévenir la fibrillation après chirurgie cardiaque lorsqu’un médicament est souhaité (ESC 2024, classe I, niveau A). Dans les méta-analyses, elle est aussi efficace qu’un bêtabloquant, et leur association fait mieux qu’un bêtabloquant seul. Une dose cumulée de charge inférieure à 3 000 mg pourrait suffire avec moins d’effets indésirables. Elle sert aussi à la cardioversion pharmacologique d’une fibrillation postopératoire chez un patient à FEVG réduite.</p>
<div class="lab">Effets indésirables</div><p>Bradycardie, allongement du QT, hypotension par voie intraveineuse, phlébite, dysthyroïdie due à sa forte teneur en iode, atteinte hépatique et pulmonaire lors d’un traitement prolongé.</p>
<div class="lab">Interactions</div><p>Elle augmente la digoxinémie, l’INR sous antivitamine K et l’exposition à certains AOD.</p>
<p class="small">Source : ESC 2024, section 9.6 et recommandation 26 ; ESC 2022, section 8.6.</p>
</template>

<template data-pop="i97-d-digoxine" data-title="Digoxine dans la fibrillation postopératoire">
<div class="lab">Mécanisme</div><p>La digoxine inhibe la pompe sodium-potassium et augmente le tonus vagal sur le nœud auriculoventriculaire : elle ralentit la conduction sans abaisser la pression.</p>
<div class="lab">Place</div><p>En postopératoire immédiat, l’ESC 2022 privilégie un bêtabloquant à faible dose associé à une charge en digoxine, sauf si la pression est élevée, pour éviter l’hypotension. Elle convient aussi à une FEVG réduite.</p>
<div class="lab">Limites</div><p>Son effet est lent et diminue pendant l’effort et les décharges adrénergiques, car il repose sur le tonus vagal.</p>
<div class="lab">Précautions</div><p>Hypokaliémie, insuffisance rénale et amiodarone augmentent sa toxicité ; la dose se réduit et la digoxinémie se mesure. Les signes d’intoxication sont des nausées, des troubles visuels et des arythmies.</p>
<p class="small">Source : ESC 2022, figure 20 ; ESC 2024.</p>
</template>

<template data-pop="i97-d-dabigatran" data-title="Dabigatran 110 mg après une lésion myocardique">
<div class="lab">Mécanisme</div><p>Le dabigatran est un inhibiteur direct et réversible de la thrombine : il empêche la conversion du fibrinogène en fibrine et l’activation plaquettaire par la thrombine.</p>
<div class="lab">Preuve</div><p>Dans MANAGE, 110 mg deux fois par jour ont réduit les complications vasculaires majeures de 15 % à 11 % après une lésion myocardique ischémique, sans excès d’hémorragies majeures.</p>
<div class="lab">Place</div><p>À envisager à partir d’une semaine après l’intervention chez un patient à faible risque hémorragique (ESC 2022, classe IIb, niveau B). L’indication ne figure pas dans l’information professionnelle suisse : la prescription est hors indication.</p>
<div class="lab">Précautions</div><p>Élimination rénale à environ 80 % : contre-indiqué en dessous de 30 mL/min de clairance dans ses indications suisses. Les inhibiteurs puissants de la glycoprotéine P augmentent son exposition. L’idarucizumab l’antagonise en urgence.</p>
<p class="small">Source : Devereaux et al., <i>Lancet</i> 2018 ; ESC 2022, recommandations 14 et 34.</p>
</template>

<template data-pop="i97-d-vaso" data-title="Vasopresseurs de l’hypotension postopératoire">
<div class="lab">Principe</div><p>Un vasopresseur ne corrige qu’une vasodilatation. Il ne remplace ni le remplissage d’une hypovolémie, ni le drainage d’une tamponnade, ni l’inotrope d’un ventricule défaillant.</p>
<div class="lab">Noradrénaline</div><p>Agoniste alpha-1 puissant et bêta-1 modéré : elle resserre les artérioles et maintient le débit. Premier vasopresseur d’un choc distributif, administrée par voie centrale en perfusion continue titrée.</p>
<div class="lab">Phényléphrine</div><p>Agoniste alpha-1 pur : elle élève la pression en ralentissant parfois le cœur par réflexe. Elle convient aux hypotensions brèves d’induction, et au rétrécissement aortique où la tachycardie est délétère.</p>
<div class="lab">Vasopressine</div><p>Elle agit sur les récepteurs V1 du muscle lisse, indépendants des récepteurs adrénergiques. Elle s’ajoute dans la vasoplégie après circulation extracorporelle quand la noradrénaline ne suffit plus.</p>
<div class="lab">Posologie</div><p>Les doses se titrent en continu selon la pression cible, sous la responsabilité de l’équipe d’anesthésie ou de réanimation ; elles ne sont pas détaillées dans ce cours.</p>
<p class="small">Source : pharmacologie des agonistes adrénergiques et de la vasopressine ; ESC 2022, section 7.</p>
</template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-i97-bases" data-title="Pareto — Définitions, codage, épidémiologie">
<p class="ratio" data-cover="i97-1,i97-2"></p>
<ul><li>I97 = complication circulatoire d’un acte sans code propre : I97.0 post-cardiotomie ; I97.1 insuffisance cardiaque après chirurgie cardiaque ou prothèse, syndrome du stimulateur ; I97.2- lymphœdème après mastectomie ; I97.8- autres lymphœdèmes et troubles ; I97.9 sans précision.</li><li>Gardent leur code : infarctus I21, FA I48, embolie I26, choc postopératoire T81.1, Dressler I24.1.</li><li>I98 = astérisque (syphilis I98.0, Chagas I98.1, varices I98.2/I98.3) avec code d’étiologie ; I99 résiduelle.</li><li>Risque chirurgical &lt; 1 %, 1–5 %, &gt; 5 % ; urgence immédiate, urgente, sensible au délai, programmée.</li><li>Lésion périopératoire : 16 % (BASEL-PMI), muette dans environ 90 %, mortalité 30 jours 8,9 % contre 1,5 %.</li><li>FA postopératoire 30–50 % (cardiaque), 5–30 % (non cardiaque) ; post-péricardiotomie 29,4 % (placebo COPPS-2) ; défaillance postcardiotomie &lt; 4 %.</li><li>Période vulnérable 3–5 mois.</li></ul></template>

<template data-pop="pareto-i97-meca" data-title="Pareto — Physiopathologie et facteurs de risque">
<p class="ratio" data-cover="i97-3,i97-4"></p>
<ul><li>Stress → besoins en oxygène ↑, diastole ↓ ; hypotension, anémie → apports ↓ : type 2 dominant ; thrombose de plaque : type 1, plus rare.</li><li>Éviter baisse &gt; 20 % ou pression moyenne &lt; 60–70 mmHg ≥ 10 minutes (I, B).</li><li>Chirurgie cardiaque : sidération 24–72 heures, vasoplégie, réaction immunitaire péricardique retardée.</li><li>Syndrome du stimulateur : perte du synchronisme, oreillette contre valve fermée.</li><li>Indice de risque révisé : cardiopathie ischémique, AVC, insuffisance cardiaque, insuline, créatinine &gt; 177 µmol/L, chirurgie à haut risque ; 0/1/2/≥ 3 → 4/6/10/15 %.</li><li>Fragilité dès 70 ans (IIa).</li></ul></template>

<template data-pop="pareto-i97-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i97-5,i97-6"></p>
<ul><li>Anamnèse : angioplastie (date), insuffisance cardiaque, valvulopathie, médicaments et dernière prise.</li><li>Deux étages d’escalier (IIa) ; DASI &lt; 34 défavorable ; capacité non évaluable ≠ faible.</li><li>Douleur thoracique, dyspnée ou œdèmes nouveaux → bilan avant chirurgie programmée.</li><li>Postopératoire : lésions muettes ; chercher tachycardie, hypotension, oligurie, confusion.</li><li>Examen : souffle éjectionnel → échocardiographie ; surcharge → différer ; ≥ 180/110 mmHg → différer.</li><li>Frottement après chirurgie cardiaque ; ondes en canon avec stimulateur VVI.</li></ul></template>

<template data-pop="pareto-i97-preop" data-title="Pareto — Évaluation préopératoire">
<p class="ratio" data-cover="i97-7"></p>
<ul><li>Évaluer au moment où l’intervention est proposée (I, B) ; risque communiqué en chiffres absolus.</li><li>Étapes : urgence → cardiopathie instable → patient → intervention → examens.</li><li>≥ 65 ans, facteurs ou maladie cardiovasculaire + chirurgie intermédiaire ou élevée : ECG (I, C), troponine avant, 24 et 48 heures (I, B), peptide (IIa, B).</li><li>Échocardiographie : capacité faible, peptide élevé ou souffle avant haut risque (I) ; intermédiaire (IIb) ; pas de routine (III).</li><li>Imagerie d’effort : haut risque programmé, capacité faible, probabilité élevée (I) ; pas de routine (III) ; CARP : pas de revascularisation prophylactique.</li><li>Bas risque : aucun examen systématique (III, B).</li><li>Après angioplastie : 6 mois (programmée), 12 mois (syndrome coronarien aigu), ≥ 1 mois si sensible au délai.</li></ul></template>

<template data-pop="pareto-i97-postop" data-title="Pareto — Urgences et lésion myocardique">
<p class="ratio" data-cover="i97-8,i97-9"></p>
<ul><li>Hypotension + hypoperfusion = choc ; classer par la pression veineuse et l’échocardiographie ; ne pas remplir un choc cardiogénique ou obstructif ; tamponnade après chirurgie cardiaque.</li><li>POISE-3 : cible ≥ 80 mmHg sans bénéfice (13,9 % contre 14,0 %).</li><li>Lésion : hausse absolue &gt; limite supérieure (avant → 1er ou 2e jour) ; sans base : &gt; 5 fois la limite au 1er jour ou variation &gt; limite ; algorithme 0 heure et 1 heure non validé.</li><li>Bilan en cinq étapes : ST/douleur → anémie → hypotension → échocardiographie → aucune cause ; type 2 le plus souvent.</li><li>Traiter la cause ; aspirine, statine, recherche d’ischémie différée ; dabigatran 110 mg × 2 dès une semaine (IIb, hors indication en Suisse).</li></ul></template>

<template data-pop="pareto-i97-chircard" data-title="Pareto — Fibrillation postopératoire et chirurgie cardiaque">
<p class="ratio" data-cover="i97-10,i97-11"></p>
<ul><li>FA postopératoire : pic 2e–4e jour ; récidive × 4–5 ; AVC.</li><li>Instable → cardioversion ; stable → potassium, magnésium, douleur, hypoxie ; fréquence &lt; 110/min ; bêtabloquant faible dose + digoxine.</li><li>Anticoagulation au long cours selon CHA₂DS₂-VA (ESC 2024, IIa, B), AOD préféré.</li><li>Prévention : amiodarone après chirurgie cardiaque (I, A) ; péricardiotomie postérieure (IIa) ; pas de bêtabloquant débuté avant chirurgie non cardiaque (III).</li><li>Post-péricardiotomie : ≥ 2 critères sur 5 + CRP ; exclure infection ; aspirine haute dose + colchicine ; anti-interleukine 1 si réfractaire ; prévention par colchicine (IIa, A).</li><li>Épanchement modéré à abondant : tamponnade ≈ 10 % le premier mois.</li><li>I97.1 : défaillance postcardiotomie &lt; 4 %, ECLS (survie 34 %) ; prothèse ; syndrome du stimulateur 18,3 % (MOST) → stimulation séquentielle.</li></ul></template>

<template data-pop="pareto-i97-autres" data-title="Pareto — Traitements chroniques, lymphœdème, I98 et I99">
<p class="ratio" data-cover="i97-12,i97-13,i97-14"></p>
<ul><li>Poursuivre bêtabloquant (I), statine (I), aspirine après stent (I).</li><li>Suspendre IEC ou ARA et diurétique le jour même sans insuffisance cardiaque (IIa) ; iSGLT2 ≥ 3 jours (IIa).</li><li>Ne pas débuter un bêtabloquant la veille (III, POISE-1).</li><li>P2Y12 : ticagrélor 3–5, clopidogrel 5, prasugrel 7 jours ; AOD sans relais.</li><li>Lymphœdème : 16,6 % (21,4 % prospectif) ; curage 19,9 % contre sentinelle 5,6 % ; renvoi I89.</li><li>I98 : syphilis tertiaire (aorte ascendante, insuffisance aortique, ostia), Chagas (bloc de branche droit, anévrisme apical), varices portales ; I99 résiduelle.</li></ul></template>

<template data-pop="pareto-i97-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i97-15,i97-16"></p>
<ul><li>Plan écrit de reprise des traitements (I) ; recherche d’ischémie après la sortie ; cardiologie avant 3 mois après FA postopératoire.</li><li>Prévention : traiter l’anémie (I, A), arrêt du tabac ≥ 4 semaines, technique peu invasive chez le patient à haut risque (IIa).</li><li>Rétrécissement aortique sévère symptomatique : traiter avant une chirurgie différable.</li><li>Stimulateur ou défibrillateur : reprogrammer avant chirurgie sus-ombilicale (IIa), contrôler après (I).</li><li>Urgence : opérer, puis surveiller ; arrêt immédiat de l’AOD ; idarucizumab pour le dabigatran (IIa).</li></ul></template>

<template data-pop="pareto-i97-exam" data-title="Pareto — Examens">
<p class="ratio" data-cover="i97-e-1,i97-e-2,i97-e-3,i97-e-4,i97-e-5,i97-e-6"></p>
<ul><li>Troponine hypersensible avant, 24 et 48 heures : examen de référence du dépistage ; valeur de base indispensable.</li><li>Peptides anormaux : BNP ≥ 35 pg/mL, NT-proBNP ≥ 125 pg/mL ; orientent vers l’échocardiographie.</li><li>ECG : référence préopératoire ; pas systématique à bas risque.</li><li>Échocardiographie : rétrécissement aortique, FEVG, tamponnade (examen de référence), Takotsubo ; ETO pour l’épanchement postérieur.</li><li>CRP indispensable au syndrome post-péricardiotomie mais non spécifique ; D-dimères inutilisables après chirurgie.</li><li>Syphilis : test tréponémique positif, non tréponémique parfois négatif au stade tertiaire.</li></ul></template>

<template data-pop="pareto-i97-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i97-sa,i97-sh,i97-sp,i97-si"></p>
<ul><li>Récessus péricardiques postérieurs non drainés → épanchement cloisonné, tamponnade atypique ; péricardiotomie postérieure.</li><li>Curage axillaire = section des collecteurs ; sentinelle les épargne.</li><li>Troponine libérée dès la rupture membranaire ; élimination partiellement rénale.</li><li>Myocarde : extraction ≈ 70 %, perfusion diastolique ; tachycardie, hypotension, anémie s’additionnent.</li><li>Autorégulation déplacée vers la droite chez l’hypertendu.</li><li>Agression → immunité innée, inflammasome, interleukine 1 et 6, CRP ; facteur tissulaire, fibrinolyse ↓ ; post-péricardiotomie = réaction immunitaire retardée.</li></ul></template>

<template data-pop="pareto-i97-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i97-p-1,i97-p-2,i97-p-3,i97-p-4,i97-p-5,i97-p-6"></p>
<ul><li>Pas de « protection » médicamenteuse de routine : POISE-1 et POISE-2 négatifs.</li><li>Bêtabloquant poursuivi ; initiation seulement ≥ 1 semaine avant une chirurgie à haut risque chez des patients choisis.</li><li>IEC, ARA, diurétique suspendus le jour même ; iSGLT2 ≥ 3 jours ; reprise documentée.</li><li>Aspirine après stent poursuivie ; P2Y12 3–5/5/7 jours ; AOD sans relais ni dose réduite.</li><li>Post-péricardiotomie : aspirine 750–1 000 mg × 3, colchicine 0,5 mg × 1–2 ; prednisone en dernier recours ; anakinra si réfractaire.</li><li>Amiodarone préventive (I, A) ; digoxine + bêtabloquant faible dose ; dabigatran 110 mg × 2 (IIb).</li><li>Noradrénaline pour la vasodilatation ; vasopressine pour la vasoplégie.</li><li>Interactions : colchicine + CYP3A4/glycoprotéine P ; amiodarone + digoxine, AOD, antivitamine K ; AINS + anticoagulant. AINS non aspirine à éviter (III).</li></ul></template>
