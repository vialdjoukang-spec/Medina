
<!-- ===== FENÊTRES R00 : anamnèse et examen clinique ===== -->
<template data-pop="r00-s-debut" data-title="Mode de début et de fin des palpitations">
<div class="lab">Question à poser</div><p>« Votre cœur s’est-il emballé d’un seul coup, comme un interrupteur, ou s’est-il accéléré progressivement ? Et comment l’accès s’est-il arrêté ? »</p>
<div class="lab">Interprétation</div><p>Un début et une fin brutaux orientent vers une réentrée : réentrée intranodale, tachycardie par voie accessoire, flutter. Un début et une fin progressifs, sur plusieurs minutes, orientent vers une tachycardie sinusale, liée à l’effort, à l’émotion ou à une cause systémique.</p>
<div class="lab">Mécanisme</div><p>Le circuit de réentrée atteint sa fréquence en un battement ; le nœud sinusal suit les catécholamines, qui montent et descendent lentement.</p>
<div class="lab">Piège</div><p>Après l’arrêt brutal d’une réentrée, la fréquence sinusale reste élevée quelques minutes, car l’adrénaline libérée pendant l’accès persiste. Le patient peut alors décrire une fin « progressive ». Le médecin demande donc si le battement rapide s’est arrêté d’un coup, même si une sensation de cœur rapide a persisté.</p></template>

<template data-pop="r00-s-regul" data-title="Régularité et fréquence : faire tapoter le rythme">
<div class="lab">Technique</div><p>Le médecin demande au patient de tapoter sur la table le rythme ressenti pendant l’accès. Il peut aussi tapoter lui-même plusieurs rythmes et demander lequel ressemble à l’accès.</p>
<div class="lab">Interprétation</div><p>Un rythme rapide et régulier oriente vers une réentrée ou un flutter. Un rythme rapide et totalement irrégulier oriente vers une fibrillation auriculaire. Des battements normaux interrompus par des pauses orientent vers des extrasystoles.</p>
<div class="lab">Fréquence</div><p>Si le patient a mesuré son pouls ou si une montre l’a affiché, une fréquence au-delà de 150/min au repos est peu compatible avec une tachycardie sinusale d’anxiété, qui dépasse rarement la fréquence maximale théorique de l’âge.</p>
<div class="lab">Limite</div><p>La description du patient est approximative ; elle oriente l’enregistrement, elle ne le remplace pas.</p></template>

<template data-pop="r00-s-circonst" data-title="Circonstances de survenue">
<div class="lab">À l’effort</div><p>Des palpitations pendant l’effort sont un signe d’alarme : elles orientent vers une tachycardie ventriculaire catécholergique, une cardiomyopathie, une ischémie ou une tachycardie supraventriculaire déclenchée par l’adrénaline.</p>
<div class="lab">Juste après l’effort</div><p>À la récupération, le tonus vagal remonte brusquement : des accès de fibrillation auriculaire d’origine vagale et certaines tachycardies supraventriculaires surviennent à ce moment.</p>
<div class="lab">Au repos, au coucher</div><p>Les extrasystoles sont souvent perçues au coucher, en décubitus latéral gauche, quand le cœur se rapproche de la paroi thoracique et que l’attention n’est plus détournée.</p>
<div class="lab">En se penchant, au lever</div><p>Un accès déclenché en se penchant en avant oriente vers une réentrée. Des palpitations au lever, avec vertiges et fatigue, orientent vers une tachycardie orthostatique ou une hypovolémie.</p>
<div class="lab">Après un repas, de l’alcool, une substance</div><p>Ces circonstances orientent vers un déclencheur modifiable.</p></template>

<template data-pop="r00-s-vagal" data-title="Arrêt par une manœuvre vagale">
<div class="lab">Question</div><p>« Avez-vous trouvé un moyen d’arrêter l’accès ? » Les patients découvrent souvent seuls qu’une poussée en apnée, une toux, de l’eau froide sur le visage ou un vomissement provoqué arrêtent l’accès.</p>
<div class="lab">Interprétation</div><p>Une manœuvre vagale ralentit transitoirement la conduction dans le nœud auriculoventriculaire. Si le circuit de la tachycardie passe par le nœud, il s’interrompt. L’arrêt brutal par une manœuvre vagale oriente donc fortement vers une réentrée intranodale ou par voie accessoire.</p>
<div class="lab">Limite</div><p>L’échec d’une manœuvre n’exclut pas une réentrée, car la manœuvre est souvent mal exécutée ou trop courte. Une fibrillation auriculaire ou un flutter ralentissent sans s’arrêter.</p>
<div class="lab">Danger</div><p>Le massage carotidien n’est pas enseigné au patient. Il est évité chez le sujet âgé ou porteur d’un souffle carotidien, en raison du risque d’embolie cérébrale.</p></template>

<template data-pop="r00-s-polyurie" data-title="Polyurie après un accès">
<div class="lab">Description</div><p>Le patient urine abondamment pendant ou juste après un accès de tachycardie prolongé.</p>
<div class="lab">Mécanisme</div><p>Pendant une tachycardie rapide, et surtout quand oreillette et ventricule se contractent simultanément, la pression auriculaire monte et la paroi auriculaire se distend. Les myocytes auriculaires libèrent alors le peptide natriurétique auriculaire, qui augmente l’excrétion rénale de sodium et d’eau.</p>
<div class="lab">Valeur</div><p>La polyurie oriente vers une tachycardie supraventriculaire soutenue, plutôt que vers une tachycardie sinusale ou des extrasystoles. Elle n’a pas de valeur isolée.</p></template>

<template data-pop="r00-s-assoc" data-title="Symptômes associés aux palpitations">
<div class="lab">Syncope ou présyncope</div><p>Elle signale une chute du débit cérébral : fréquence extrême, pause, ou cœur malade incapable de tolérer l’arythmie. C’est un signe d’alarme.</p>
<div class="lab">Douleur thoracique</div><p>La tachycardie raccourcit la diastole, pendant laquelle se fait la perfusion coronaire, et augmente la consommation d’oxygène. Une douleur pendant l’accès peut traduire une ischémie fonctionnelle, ou révéler une coronaropathie.</p>
<div class="lab">Dyspnée</div><p>Elle traduit une élévation de la pression auriculaire gauche par remplissage insuffisant ou une insuffisance cardiaque ; elle peut aussi accompagner l’anxiété.</p>
<div class="lab">Signes adrénergiques</div><p>Sueurs, tremblements, angoisse, pâleur : ils accompagnent aussi bien une tachycardie mal tolérée qu’une attaque de panique, et ne tranchent donc pas.</p>
<div class="lab">Fatigue persistante</div><p>Elle oriente vers une cause systémique, une anémie, une hyperthyroïdie, ou vers une cardiomyopathie rythmique après des semaines de tachycardie.</p></template>

<template data-pop="r00-atcd-card" data-title="Cardiopathie connue : pourquoi elle change tout">
<div class="lab">Principe</div><p>Chez un patient au cœur sain, les palpitations sont presque toujours bénignes. Chez un patient porteur d’une cardiopathie, la même plainte peut annoncer une tachycardie ventriculaire.</p>
<div class="lab">Cicatrice d’infarctus</div><p>La cicatrice contient des faisceaux de myocarde survivant, à conduction lente, entourés de fibrose. Ces faisceaux forment des circuits de réentrée ventriculaire.</p>
<div class="lab">Cardiomyopathies</div><p>La fibrose de la cardiomyopathie hypertrophique, dilatée ou arythmogène fournit un substrat semblable. Les cardiopathies congénitales opérées laissent des cicatrices chirurgicales autour desquelles des réentrées peuvent tourner.</p>
<div class="lab">Conséquence pratique</div><p>Un patient porteur d’une cardiopathie qui décrit des palpitations est adressé au cardiologue ; l’enregistrement et parfois l’exploration électrophysiologique décident du traitement, éventuellement d’un défibrillateur (<a href="#/entry/I47">I47</a>).</p></template>

<template data-pop="r00-atcd-fam" data-title="Antécédents familiaux à rechercher">
<div class="lab">Questions</div><p>Un parent est-il mort subitement, jeune, sans explication ? Y a-t-il des noyades inexpliquées, des accidents de la route sans cause, des syncopes répétées, un défibrillateur implanté, une cardiomyopathie connue dans la famille ?</p>
<div class="lab">Pourquoi</div><p>Les cardiomyopathies hypertrophique, dilatée et arythmogène, ainsi que les canalopathies comme le QT long, le syndrome de Brugada et la tachycardie ventriculaire polymorphe catécholergique, sont souvent héréditaires, le plus fréquemment selon un mode autosomique dominant.</p>
<div class="lab">Conséquence</div><p>Un antécédent familial de mort subite inexpliquée d’un apparenté jeune est un signe d’alarme : il justifie un avis cardiologique et oriente vers un dépistage familial.</p>
<div class="lab">Piège</div><p>Une noyade chez un bon nageur peut révéler un QT long de type 1, dont les arythmies sont déclenchées par l’effort, en particulier la natation.</p></template>

<template data-pop="r00-atcd-medic" data-title="Inventaire médicamenteux actif">
<div class="lab">Méthode</div><p>Le médecin demande au patient d’apporter tous ses médicaments, y compris les collyres, les inhalateurs, les produits en vente libre, les compléments alimentaires et les produits de perte de poids. Il interroge sur la caféine, les boissons énergisantes, l’alcool, la nicotine et les drogues, en quantités.</p>
<div class="lab">Ce qu’il cherche</div><p>Des médicaments qui accélèrent le cœur : salbutamol, décongestionnants, lévothyroxine en excès, méthylphénidate. Des médicaments qui le ralentissent : bêtabloquants, vérapamil, diltiazem, digoxine, anticholinestérasiques. Des médicaments qui allongent le QT.</p>
<div class="lab">Chronologie</div><p>Le lien est plus probable si les symptômes ont commencé après l’introduction ou l’augmentation du médicament, ou après l’arrêt brutal d’un bêtabloquant.</p>
<div class="lab">Conséquence</div><p>L’essai d’arrêt ou de réduction, quand il est possible, est à la fois diagnostique et thérapeutique.</p></template>

<template data-pop="r00-s-souffle-adulte" data-title="Symptômes à rechercher devant un souffle de l’adulte">
<div class="lab">Dyspnée d’effort</div><p>Elle traduit une élévation de la pression auriculaire gauche à l’effort, par fuite ou par obstacle. Le patient âgé réduit souvent son activité pour l’éviter : le médecin demande ce que le patient ne fait plus.</p>
<div class="lab">Douleur thoracique d’effort</div><p>Dans le rétrécissement aortique, l’hypertrophie augmente les besoins en oxygène, et la pression intraventriculaire élevée comprime la microcirculation sous-endocardique : une angine survient même avec des coronaires normales.</p>
<div class="lab">Syncope d’effort</div><p>L’effort dilate les artères musculaires alors que l’orifice aortique rétréci empêche le débit d’augmenter : la pression chute et le cerveau est hypoperfusé.</p>
<div class="lab">Conséquence</div><p>Un seul de ces symptômes chez un patient porteur d’un souffle aortique impose une échocardiographie rapide, car le pronostic du rétrécissement serré symptomatique est sombre sans remplacement valvulaire (<a href="#/entry/I35">I35</a>).</p>
<div class="lab">Autres éléments</div><p>Fièvre prolongée, amaigrissement (endocardite) ; antécédent de rhumatisme articulaire aigu, surtout chez un patient né dans un pays à forte endémie (<a href="#/entry/I00">I00</a>).</p></template>

<template data-pop="r00-s-souffle-enfant" data-title="Signes de cardiopathie chez l’enfant">
<div class="lab">Chez le nourrisson</div><p>Biberons longs et interrompus, sudation pendant les repas, polypnée, stagnation pondérale : un shunt gauche-droite important surcharge la circulation pulmonaire et augmente le travail respiratoire, au point que le nourrisson ne peut plus téter et respirer à la fois.</p>
<div class="lab">Cyanose</div><p>Une cyanose centrale traduit le passage de sang désaturé dans la circulation systémique : cardiopathie cyanogène.</p>
<div class="lab">Chez l’enfant plus âgé</div><p>Intolérance à l’effort, essoufflement, douleur thoracique ou syncope d’effort, infections respiratoires répétées.</p>
<div class="lab">Contexte</div><p>Syndrome génétique connu (trisomie 21, syndrome de Turner, de Williams-Beuren, de DiGeorge), échographie prénatale anormale, cardiopathie congénitale chez un parent ou un frère ou une sœur.</p>
<div class="lab">Conséquence</div><p>La présence d’un seul de ces éléments exclut le diagnostic de souffle innocent et impose un avis de cardiologie pédiatrique (DGPK 2017).</p></template>

<template data-pop="r00-e-pouls" data-title="Pouls : technique et interprétation">
<div class="lab">Technique</div><p>Le médecin palpe le pouls radial pendant une minute entière lorsque le rythme est irrégulier, et non 15 secondes multipliées par quatre. Il ausculte simultanément le cœur pour détecter un déficit de pouls.</p>
<div class="lab">Déficit de pouls</div><p>Certains battements, survenant après une diastole courte, éjectent trop peu de sang pour être palpés. La fréquence auscultée dépasse alors la fréquence palpée : c’est le cas des extrasystoles précoces et de la fibrillation auriculaire rapide.</p>
<div class="lab">Interprétation</div><p>Un pouls régulier à 150/min fait évoquer un flutter 2:1. Un pouls totalement irrégulier fait évoquer une fibrillation auriculaire. Un pouls régulier avec des pauses fait évoquer des extrasystoles.</p>
<div class="lab">Pouls carotidien</div><p>Un pouls carotidien lent à monter et de faible amplitude évoque un rétrécissement aortique serré ; un pouls ample et bref évoque une insuffisance aortique importante.</p></template>

<template data-pop="r00-e-ortho" data-title="Épreuve d’orthostatisme">
<div class="lab">Technique</div><p>Le patient reste couché 5 minutes ; le médecin mesure la fréquence et la pression. Le patient se lève ; les mesures sont répétées à 1, 3, 5 et 10 minutes, en notant les symptômes.</p>
<div class="lab">Hypotension orthostatique</div><p>Selon l’ESC 2018 sur la syncope, une baisse de la pression systolique d’au moins 20 mmHg ou de la diastolique d’au moins 10 mmHg, ou une systolique inférieure à 90 mmHg, avec symptômes, définit une hypotension orthostatique.</p>
<div class="lab">Tachycardie orthostatique</div><p>Une augmentation de la fréquence d’au moins 30/min dans les 10 minutes, ou d’au moins 40/min chez l’adolescent de 12 à 19 ans, sans hypotension orthostatique, avec des symptômes durables, oriente vers un syndrome de tachycardie orthostatique posturale (<a href="#/entry/I49">I49</a>).</p>
<div class="lab">Piège</div><p>Une hypovolémie, un déconditionnement ou un médicament produisent la même tachycardie orthostatique ; ils sont recherchés avant de conclure.</p></template>

<template data-pop="r00-e-coarct" data-title="Coarctation de l’aorte à l’examen">
<div class="lab">Mécanisme</div><p>Le rétrécissement de l’isthme aortique, après l’artère sous-clavière gauche, élève la pression en amont et la réduit en aval. Les membres supérieurs sont hypertendus, les membres inférieurs moins bien perfusés.</p>
<div class="lab">Signes</div><p>Pouls fémoraux faibles et retardés par rapport aux pouls radiaux ; pression aux membres inférieurs inférieure à celle des membres supérieurs ; souffle systolique doux, parfois maximal dans le dos entre les omoplates. Une différence de pression systolique de plus de 20 mmHg entre bras et jambe est un repère classique en faveur d’une coarctation.</p>
<div class="lab">Pourquoi c’est important</div><p>Le souffle peut être discret et passer pour innocent. Seule la palpation des pouls fémoraux révèle la coarctation chez l’enfant asymptomatique ou l’adulte jeune hypertendu (<a href="#/entry/Q21">Q21</a>).</p></template>

<template data-pop="r00-e-thyr" data-title="Signes d’hyperthyroïdie">
<div class="lab">Signes généraux</div><p>Amaigrissement malgré un appétit conservé, thermophobie, peau chaude et moite, tremblement fin des extrémités, nervosité, diarrhée.</p>
<div class="lab">Signes cardiaques</div><p>Tachycardie sinusale de repos, pouls ample, souffle systolique de débit, fibrillation auriculaire. Les hormones thyroïdiennes augmentent le nombre et la sensibilité des récepteurs β et accélèrent directement le nœud sinusal.</p>
<div class="lab">Signes orientant vers la cause</div><p>Goitre diffus, exophtalmie et myxœdème prétibial dans la maladie de Basedow ; nodule palpable dans un adénome toxique.</p>
<div class="lab">Conséquence</div><p>Une TSH basse fait doser la T4 libre. Le bêtabloquant soulage les symptômes adrénergiques en attendant le traitement de la thyrotoxicose.</p></template>

<template data-pop="r00-e-anemie" data-title="Signes d’anémie">
<div class="lab">Signes</div><p>Pâleur des conjonctives, des lèvres et des paumes ; koïlonychie dans une carence martiale ancienne ; tachycardie sinusale ; souffle systolique de débit.</p>
<div class="lab">Mécanisme cardiovasculaire</div><p>Le contenu artériel en oxygène dépend surtout de l’hémoglobine. Quand elle baisse, l’apport d’oxygène aux tissus baisse aussi, même avec une saturation normale. L’organisme compense en augmentant le débit cardiaque, par la fréquence et le volume d’éjection, et en dilatant les artérioles. La viscosité sanguine diminue. Ces deux effets accélèrent le flux et le rendent turbulent.</p>
<div class="lab">Valeur</div><p>La pâleur conjonctivale est un signe peu sensible ; l’hémogramme tranche.</p>
<div class="lab">Conséquence</div><p>Une anémie découverte devant des palpitations impose d’en chercher la cause, notamment un saignement digestif ou gynécologique.</p></template>

<template data-pop="r00-e-auscult" data-title="Technique d’auscultation">
<div class="lab">Conditions</div><p>Pièce calme, patient torse nu, stéthoscope directement sur la peau. Le médecin ausculte les quatre foyers, puis les zones d’irradiation : carotides, aisselle gauche, dos.</p>
<div class="lab">Membrane et cloche</div><p>La membrane, appuyée fermement, transmet les sons aigus : B1, B2, souffles de fuite aortique et mitrale, frottement. La cloche, posée légèrement, transmet les sons graves : B3, B4, roulement du rétrécissement mitral.</p>
<div class="lab">Positions</div><p>Décubitus latéral gauche, cloche à l’apex : il rapproche la pointe du cœur de la paroi et démasque le roulement mitral et le B3. Assis, penché en avant, en expiration forcée : il rapproche la base du cœur de la paroi et démasque le souffle diastolique d’une insuffisance aortique.</p>
<div class="lab">Repérage du temps</div><p>La palpation du pouls carotidien pendant l’auscultation situe B1, qui le précède, et B2, qui le suit.</p>
<div class="lab">Piège</div><p>Le souffle diastolique de l’insuffisance aortique est doux, aspiratif et facilement manqué si le patient reste couché.</p></template>

<template data-pop="r00-e-grille" data-title="Décrire un souffle en sept caractères">
<div class="lab">1. Temps</div><p>Systolique, diastolique ou continu ; précoce, méso ou télé, ou holo.</p>
<div class="lab">2. Intensité</div><p>De 1/6 à 6/6 selon l’échelle de Levine ; frémissement à partir de 4/6.</p>
<div class="lab">3. Foyer maximal</div><p>Aortique, pulmonaire, tricuspide, mitral, ou bord gauche du sternum.</p>
<div class="lab">4. Irradiation</div><p>Vers les carotides pour un souffle aortique, vers l’aisselle pour une fuite mitrale, vers le dos pour une coarctation ou une sténose pulmonaire.</p>
<div class="lab">5. Timbre</div><p>Doux, rude, râpeux, musical, aspiratif, roulant.</p>
<div class="lab">6. Forme</div><p>Losangique (crescendo-decrescendo), en plateau, decrescendo.</p>
<div class="lab">7. Variations</div><p>Avec la respiration, la position, les manœuvres dynamiques et la longueur du cycle précédent.</p>
<div class="lab">Exemple</div><p>« Souffle mésosystolique, 3/6, losangique, rude, maximal au deuxième espace droit, irradiant aux carotides, diminuant au passage en position debout » : cette description oriente vers un rétrécissement aortique.</p></template>

<template data-pop="r00-manoeuvres" data-title="Manœuvres dynamiques">
<div class="lab">Inspiration</div><p>Elle augmente le retour veineux au cœur droit : les souffles d’origine droite, tricuspide et pulmonaire, se renforcent. Sensibilité 100 %, spécificité 88 % pour l’origine droite (Lembo et al., 1988).</p>
<div class="lab">Valsalva</div><p>Pendant la poussée, la pression intrathoracique élevée réduit le retour veineux : le ventricule gauche se remplit moins. Le souffle de la cardiomyopathie hypertrophique obstructive augmente (sensibilité 65 %, spécificité 96 %), car l’obstruction dynamique s’aggrave quand la cavité diminue. La plupart des autres souffles diminuent.</p>
<div class="lab">Accroupissement puis lever</div><p>Le passage de l’accroupissement à la station debout réduit brusquement la précharge : le souffle de la cardiomyopathie hypertrophique obstructive augmente (95 % et 84 %). Le passage inverse augmente précharge et postcharge et le diminue (95 % et 85 %).</p>
<div class="lab">Handgrip</div><p>Le serrement de poing soutenu augmente la postcharge : la fuite mitrale et la communication interventriculaire se renforcent (68 % et 92 %), le souffle de la cardiomyopathie hypertrophique obstructive diminue.</p>
<div class="lab">Limites</div><p>L’étude portait sur 50 patients examinés par deux cardiologues expérimentés ; les performances d’un examinateur moins entraîné sont probablement plus basses. Aucune manœuvre isolée n’est parfaite ; le rétrécissement aortique se diagnostiquait par exclusion. Le Valsalva et l’accroupissement sont évités chez un patient instable. Source : N Engl J Med 1988;318:1572–1578.</p></template>

<template data-pop="r00-innocent" data-title="Souffle innocent : conditions du diagnostic">
<div class="lab">Caractères du souffle</div><p>Souffle systolique, sauf le bourdonnement veineux qui est continu ; intensité de 3/6 au plus, sans frémissement ; timbre doux ou musical ; bruits du cœur normaux, B2 normalement dédoublé ; aucun clic ni bruit surajouté ; variation avec la position.</p>
<div class="lab">Contexte</div><p>Le souffle est le seul élément anormal : enfant asymptomatique, croissance normale, pouls fémoraux normaux, saturation normale, pas de syndrome associé, pas d’antécédent familial de cardiopathie congénitale.</p>
<div class="lab">Statut de cette liste</div><p>Il s’agit d’une synthèse pédagogique fondée sur la recommandation DGPK 2017, qui ne publie pas de liste numérotée. Selon la DGPK, les souffles innocents ne dépassent pratiquement jamais 3/6 ; l’auscultation est typique mais pas probante, et le diagnostic suppose l’exclusion raisonnable d’une maladie organique.</p>
<div class="lab">Exceptions à la règle</div><p>Un souffle chez un nouveau-né, un souffle nouveau et persistant, et un souffle connu qui change justifient un avis de cardiologie pédiatrique même s’ils ressemblent à un souffle innocent.</p>
<div class="lab">Aide-mémoire</div><p>Les « sept S » anglo-saxons (<i>sensitive</i> à la position, <i>short</i>, <i>single</i>, <i>small</i>, <i>soft</i>, <i>sweet</i>, <i>systolic</i>) résument ces caractères. Aide pédagogique, non critère officiel.</p></template>

<template data-pop="r00-innocents-types" data-title="Souffles innocents de l’enfant">
<div class="lab">Souffle de Still</div><p>Le plus fréquent. Enfant de 2 à 6 ans environ. Souffle systolique musical ou vibrant, faible, maximal au bord gauche du sternum, aux troisième et quatrième espaces ; plus fort en décubitus, plus faible assis ou debout. Son origine exacte reste discutée.</p>
<div class="lab">Souffle d’éjection pulmonaire</div><p>Enfant d’âge scolaire et adolescent. Souffle systolique doux au deuxième espace gauche, dû à un flux rapide dans le tronc pulmonaire, accentué par la fièvre ou l’effort.</p>
<div class="lab">Sténose pulmonaire périphérique du nouveau-né</div><p>Nouveau-né et jeune nourrisson. Souffle systolique doux aux deuxièmes espaces droit et gauche, irradiant aux aisselles et au dos. Avant la naissance, les branches pulmonaires reçoivent peu de sang et restent étroites ; après la fermeture du canal artériel, tout le débit droit les traverse brusquement. Le souffle disparaît habituellement avec leur croissance.</p>
<div class="lab">Souffle supraclaviculaire</div><p>Enfant et adolescent. Souffle systolique bref au-dessus de la clavicule, né à l’origine des artères brachiocéphaliques ; il diminue quand les épaules sont portées en arrière.</p>
<div class="lab">Bourdonnement veineux</div><p>Enfant de 3 à 6 ans environ. Souffle continu, doux, maximal sous la clavicule droite, renforcé en diastole. Il naît du flux veineux à la jonction des veines jugulaire et sous-clavière, et disparaît en décubitus, à la rotation de la tête ou à la compression douce de la jugulaire. Ces manœuvres le distinguent d’un canal artériel persistant.</p>
