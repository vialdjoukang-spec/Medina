<!-- ===== FENÊTRES R02 : mesures, imagerie, décisions thérapeutiques, essais ===== -->
<template data-pop="r02-pressions" data-title="Évaluation hémodynamique du membre menacé">
<div class="lab">Quelle mesure pour quel patient</div><p>Chez le non-diabétique sans insuffisance rénale, l’index de pression cheville-bras et la pression de cheville suffisent souvent. Chez le diabétique et le dialysé, les GVG 2019 préfèrent la pression d’orteil, et l’IWGDF 2023 recommande d’associer ondes Doppler du pied, index de cheville et index orteil-bras. Lorsque l’orteil ne peut être mesuré, la pression transcutanée en oxygène ou la pression de perfusion cutanée prend le relais.</p>
<div class="lab">Pourquoi mesurer</div><p>Les signes cliniques d’ischémie sont peu fiables, surtout en présence d’une neuropathie et d’une infection. Les mesures classent l’ischémie de WIfI, prédisent la cicatrisation et décident de l’urgence vasculaire.</p>
<div class="lab">Piège</div><p>Une seule mesure normale n’exclut pas l’artériopathie ; l’IWGDF rappelle qu’aucune valeur seuil ne permet de l’écarter avec certitude.</p>
</template>

<template data-pop="r02-ips" data-title="Index de pression systolique cheville-bras">
<div class="lab">Technique</div><p>Patient couché depuis quelques minutes, le médecin mesure au Doppler continu la pression systolique des artères pédieuse et tibiale postérieure, brassard à la cheville, et la pression brachiale des deux bras. Pour chaque jambe, l’index rapporte la pression de cheville la plus haute à la pression brachiale la plus haute.</p>
<div class="lab">Interprétation</div><p>De 1,00 à 1,40 : normal. De 0,91 à 0,99 : limite. Inférieur ou égal à 0,90 : artériopathie (ESC). Inférieur à 0,40 : ischémie sévère (GVG 2019, IWGDF 2023). Supérieur à 1,40 : artère incompressible, valeur non interprétable.</p>
<div class="lab">Piège</div><p>La calcification de la média peut surestimer l’index même en dessous de 1,40. Chez le diabétique, l’IWGDF considère l’artériopathie comme moins probable seulement si l’index se situe entre 0,9 et 1,3, avec un index orteil-bras d’au moins 0,70 et des ondes triphasiques ou biphasiques.</p>
</template>

<template data-pop="r02-pression-orteil" data-title="Pression d’orteil et index orteil-bras">
<div class="lab">Technique</div><p>Un petit brassard est placé à la base du gros orteil, ou d’un autre orteil s’il est amputé ou nécrosé. Un capteur photopléthysmographique sur la pulpe détecte le retour du flux pendant le dégonflage. L’index orteil-bras rapporte cette pression à la pression brachiale.</p>
<div class="lab">Interprétation</div><p>Un index orteil-bras d’au moins 0,70 rend une artériopathie moins probable (IWGDF 2023). Pour WIfI, une pression d’orteil d’au moins 60 mmHg correspond au grade d’ischémie 0, de 40 à 59 au grade 1, de 30 à 39 au grade 2 et inférieure à 30 au grade 3.</p>
<div class="lab">Valeur pronostique</div><p>Une pression d’au moins 30 mmHg augmente la probabilité pré-test de cicatrisation jusqu’à 30 % ; une valeur inférieure augmente d’environ 20 % la probabilité d’amputation majeure (IWGDF 2023).</p>
<div class="lab">Pourquoi elle est préférée</div><p>Les artères digitales sont moins souvent calcifiées que les artères de cheville : la pression d’orteil reste interprétable chez le diabétique et le dialysé.</p>
</template>

<template data-pop="r02-tcpo2" data-title="Pression transcutanée en oxygène">
<div class="lab">Technique</div><p>Une électrode posée sur la peau du dos du pied chauffe localement le tégument, ce qui dilate les capillaires et permet à l’oxygène de diffuser vers le capteur. Le patient est couché, au repos, dans une pièce tempérée ; la valeur est lue après stabilisation.</p>
<div class="lab">Interprétation</div><p>Pour WIfI, une valeur d’au moins 60 mmHg correspond au grade d’ischémie 0, une valeur inférieure à 30 mmHg au grade 3. Selon l’IWGDF 2023, une valeur d’au moins 25 mmHg augmente la probabilité de cicatrisation jusqu’à 45 % ; une valeur inférieure augmente d’environ 20 % la probabilité d’amputation majeure.</p>
<div class="lab">Pièges</div><p>L’œdème, l’infection locale, une peau épaisse ou kératosique et le refroidissement abaissent la valeur sans que l’artère soit en cause. Une mesure faite en pleine poussée infectieuse doit être répétée après contrôle de l’infection.</p>
</template>

<template data-pop="r02-doppler-ondes" data-title="Ondes Doppler du pied">
<div class="lab">Technique</div><p>Le médecin place une sonde Doppler continue sur l’artère pédieuse et la tibiale postérieure et analyse la forme de l’onde, au son ou sur un tracé.</p>
<div class="lab">Interprétation</div><p>L’onde triphasique, avec une montée raide, un reflux protodiastolique et un rebond, est normale. L’onde biphasique, qui perd le rebond, s’observe avec une rigidité artérielle ou une sténose modérée. L’onde monophasique amortie, ou l’absence d’onde, témoigne d’une ischémie sévère en aval d’une occlusion.</p>
<div class="lab">Valeur</div><p>L’IWGDF 2023 l’associe aux index de pression ; une onde monophasique ou absente fait partie des critères d’ischémie sévère qui imposent un avis vasculaire urgent. Une onde triphasique ou biphasique rend une artériopathie moins probable.</p>
</template>

<template data-pop="r02-angio" data-title="Angiographie avant revascularisation">
<div class="lab">Recommandation</div><p>Les GVG 2019 recommandent d’obtenir une imagerie angiographique de haute qualité de tout le membre, avec des vues dédiées de la cheville et du pied, chez tout patient candidat à la revascularisation. Elles précisent qu’un patient candidat au sauvetage de membre ne doit pas se voir refuser une revascularisation sans angiographie complète incluant la cheville et le pied.</p>
<div class="lab">Choix de la technique</div><p>L’écho-Doppler est suggéré en premier, puis une imagerie non invasive par scanner ou résonance magnétique avant le cathétérisme. L’angiographie par cathéter permet de traiter dans le même temps.</p>
<div class="lab">Précautions</div><p>Le contraste iodé expose le patient insuffisant rénal ou septique à une altération de la fonction rénale ; la fonction rénale, l’hydratation et les médicaments néphrotoxiques sont vérifiés avant le geste.</p>
</template>

<template data-pop="r02-plan" data-title="Cadre décisionnel PLAN des GVG 2019">
<div class="lab">Trois axes</div><p>Patient : risque opératoire et espérance de vie. Membre, en anglais <i>limb</i> : sévérité de la menace, stadifiée par WIfI. Anatomie : complexité des lésions, stadifiée par le système GLASS, qui définit une artère cible préférée de l’aine à la cheville et classe la complexité en stades I à III.</p>
<div class="lab">Risque du patient</div><p>Risque moyen : mortalité périopératoire attendue inférieure à 5 % et survie à deux ans supérieure à 50 %. Risque élevé : mortalité périopératoire supérieure à 5 % ou survie à deux ans inférieure à 50 %.</p>
<div class="lab">Logique</div><p>Les axes sont examinés dans cet ordre. Un patient à risque élevé est plus souvent orienté vers une technique endovasculaire, moins invasive ; un patient à risque moyen, avec une menace avancée, une anatomie complexe et une bonne veine saphène, vers un pontage veineux.</p>
</template>

<template data-pop="r02-bestcli" data-title="Essai BEST-CLI (2022)">
<div class="lab">Question</div><p>Chez des patients atteints de CLTI avec artériopathie sous-inguinale, une stratégie initiale chirurgicale est-elle supérieure à une stratégie endovasculaire ?</p>
<div class="lab">Méthode</div><p>Essai international randomisé de 1 830 patients, en deux cohortes parallèles : cohorte 1, patients disposant d’un segment unique de grande veine saphène utilisable ; cohorte 2, patients nécessitant un autre conduit. Critère principal : événement majeur du membre, défini par une amputation au-dessus de la cheville ou une réintervention majeure, ou décès.</p>
<div class="lab">Résultats</div><p>Cohorte 1, suivi médian 2,7 ans : critère principal chez 42,6 % des patients opérés contre 57,4 % des patients traités par voie endovasculaire (rapport de risque 0,68 ; intervalle de confiance à 95 % 0,59 à 0,79). Cohorte 2 : 42,8 % contre 47,7 %, différence non significative.</p>
<div class="lab">Portée</div><p>Le pontage avec veine saphène adéquate est préférable chez le patient qui peut le supporter. Sans veine adéquate, les deux stratégies donnent des résultats comparables. Source : Farber A et al., <i>New England Journal of Medicine</i> 2022.</p>
</template>

<template data-pop="r02-basil2" data-title="Essai BASIL-2 (2023)">
<div class="lab">Question</div><p>Chez des patients atteints de CLTI nécessitant une revascularisation sous-poplitée, faut-il commencer par un pontage veineux ou par le meilleur traitement endovasculaire ?</p>
<div class="lab">Méthode</div><p>Essai randomisé ouvert de 345 patients, âge médian 72,5 ans, dans 41 centres britanniques, suédois et danois. Critère principal : survie sans amputation majeure.</p>
<div class="lab">Résultats</div><p>Amputation majeure ou décès chez 63 % des patients du groupe pontage contre 53 % du groupe endovasculaire (rapport de risque ajusté 1,35 ; intervalle de confiance à 95 % 1,02 à 1,80). La différence tenait surtout aux décès, plus nombreux après pontage (53 % contre 45 %).</p>
<div class="lab">Portée et relation avec BEST-CLI</div><p>Dans les lésions sous-poplitées de patients âgés et fragiles, l’endovasculaire d’abord est raisonnable. BEST-CLI portait sur des lésions sous-inguinales plus variées, avec une veine adéquate. Les deux essais ne se contredisent pas : ils guident le choix selon l’anatomie et le patient. Source : Bradbury et al., <i>Lancet</i> 2023.</p>
</template>

<template data-pop="r02-amput-niveaux" data-title="Niveaux d’amputation">
<div class="lab">Amputations mineures</div><p>Les amputations mineures retirent un orteil, un rayon, c’est-à-dire l’orteil et une partie du métatarsien, ou l’avant-pied par amputation transmétatarsienne. Elles conservent l’appui sur le talon et une marche avec chaussure adaptée.</p>
<div class="lab">Amputations majeures</div><p>Les amputations majeures se font sous le genou (transtibiale), par désarticulation du genou ou au-dessus du genou (transfémorale). Plus le niveau est haut, plus la marche avec prothèse demande d’énergie et plus la réadaptation est difficile chez le sujet âgé.</p>
<div class="lab">Choix du niveau</div><p>Le niveau doit cicatriser : il dépend de la perfusion mesurée, de l’étendue de la nécrose et de l’infection, et du projet fonctionnel. Les GVG 2019 suggèrent l’amputation transmétatarsienne lorsque plus de deux rayons seraient amputés, surtout si l’hallux est atteint, et une revascularisation pour abaisser le niveau d’une amputation majeure chez un patient capable de remarcher.</p>
</template>

<template data-pop="r02-hbo" data-title="Oxygénothérapie hyperbare">
<div class="lab">Principe</div><p>Le patient respire de l’oxygène pur dans un caisson pressurisé. La quantité d’oxygène dissous dans le plasma augmente nettement, ce qui accroît la diffusion vers les tissus perfusés.</p>
<div class="lab">Limite physiologique</div><p>L’oxygène dissous n’atteint que les tissus encore irrigués : un tissu nécrosé ou privé de flux par une occlusion n’en bénéficie pas.</p>
<div class="lab">Recommandations</div><p>Les GVG 2019 recommandent de ne pas la proposer pour sauver un membre dont l’ischémie sévère n’est pas corrigée. L’IWGDF/IDSA 2023 suggère de ne pas l’utiliser pour traiter l’infection du pied diabétique. L’IDSA 2014 ne la recommande pas dans la myonécrose clostridienne, faute de bénéfice démontré et parce qu’elle peut retarder la réanimation et le débridement.</p>
<div class="lab">Conséquence pratique</div><p>Elle ne remplace jamais la chirurgie ni la revascularisation ; toute indication résiduelle se discute en centre spécialisé.</p>
</template>

<template data-pop="r02-atb-logique" data-title="Principes de l’antibiothérapie d’une gangrène">
<div class="lab">Ce que l’antibiotique peut faire</div><p>Il traite l’infection des tissus vivants autour de la nécrose et limite la diffusion sanguine. Il n’atteint pas le tissu mort, faute de perfusion, et ne stérilise pas un abcès non drainé.</p>
<div class="lab">Règles</div><p>Pas d’antibiotique pour une nécrose sèche non infectée ; prélèvements profonds avant la première dose quand l’état le permet, sans retarder le traitement d’un sepsis ; spectre selon la gravité, l’ischémie et les facteurs de résistance ; réévaluation à 48–72 heures avec les cultures ; durée fixée par l’infection résiduelle.</p>
<div class="lab">Source</div><p>IWGDF/IDSA 2023 ; IDSA 2014 pour les infections nécrosantes ; molécules et doses dans l’onglet Pharmacologie.</p>
</template>
