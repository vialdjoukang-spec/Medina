<!-- ===== FENÊTRES R02 : monographies et Pareto ===== -->
<template data-pop="r02-d-coamox" data-title="Amoxicilline-acide clavulanique">
<div class="lab">Mécanisme</div><p>L’amoxicilline inhibe la synthèse de la paroi bactérienne en se fixant aux protéines liant la pénicilline. L’acide clavulanique inactive de nombreuses bêtalactamases, ce qui étend le spectre aux staphylocoques sensibles à la méticilline, à beaucoup d’entérobactéries et aux anaérobies, dont les <i>Bacteroides</i>.</p>
<div class="lab">Place dans la gangrène</div><p>Option probabiliste de l’infection modérée ou sévère du pied et de la gangrène humide avec ischémie ou nécrose, selon l’IWGDF/IDSA 2023. Elle ne couvre ni <i>Pseudomonas</i> ni le SARM.</p>
<div class="lab">Posologie suisse</div><p>Intraveineuse (Co-Amoxi-Mepha i.v., information professionnelle d’août 2026) : 1,2 g 3 à 4 fois par jour en injection lente dans les infections modérées ; 2,2 g 3 à 4 fois par jour en perfusion d’au moins 30 minutes dans les infections graves, jusqu’à 6 fois par jour, jamais plus souvent que toutes les 4 heures. Clairance 10–30 mL/min : 1,2 g puis 600 mg toutes les 12 heures ; inférieure à 10 mL/min : 600 mg toutes les 24 heures ; hémodialyse : 600 mg supplémentaires en fin de séance. Orale (Augmentin, mars 2026) : 625 mg 3 fois par jour, jusqu’à 1 g 3 fois par jour.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Elle peut provoquer une diarrhée, une colite à <i>Clostridioides difficile</i>, un exanthème et une hépatite cholestatique. Elle est contre-indiquée en cas d’allergie aux pénicillines et après un ictère ou une atteinte hépatique survenus sous ce médicament.</p>
</template>

<template data-pop="r02-d-piptazo" data-title="Pipéracilline-tazobactam">
<div class="lab">Mécanisme</div><p>La pipéracilline est une uréidopénicilline à large spectre, associée à un inhibiteur de bêtalactamases. Elle couvre les cocci à Gram positif sensibles, les entérobactéries, <i>Pseudomonas aeruginosa</i> et les anaérobies.</p>
<div class="lab">Place</div><p>Elle est indiquée dans l’infection sévère avec facteurs de risque de bacilles à Gram négatif résistants, ulcère macéré, antibiotiques récents ou <i>Pseudomonas</i> isolé récemment . Elle sert aussi au traitement probabiliste des infections nécrosantes, associée à la vancomycine selon l’IDSA 2014.</p>
<div class="lab">Posologie suisse</div><p>Pipéracilline/Tazobactam Sandoz (mars 2026) : 2,25 à 4,5 g 3 fois par jour, jusqu’à 4,5 g 3 à 4 fois par jour selon la gravité. Filtration de 20 à 40 mL/min : 4,5 g toutes les 8 heures ; inférieure à 20 mL/min : 4,5 g toutes les 12 heures ; dose supplémentaire après hémodialyse selon l’information professionnelle.</p>
<div class="lab">Surveillance</div><p>Sa néphrotoxicité possible augmente en association avec la vancomycine, selon l’information professionnelle. Elle expose aussi à la colite à <i>Clostridioides difficile</i> et à une allergie croisée avec les autres bêtalactamines.</p>
</template>

<template data-pop="r02-d-clinda" data-title="Clindamycine">
<div class="lab">Mécanisme</div><p>La clindamycine est un lincosamide qui se fixe sur la sous-unité 50S du ribosome et inhibe la synthèse des protéines bactériennes, dont les toxines. Elle est active sur les streptocoques, beaucoup de staphylocoques et les anaérobies.</p>
<div class="lab">Place</div><p>Elle s’associe à la pénicilline dans la myonécrose clostridienne et la fasciite à streptocoque du groupe A (IDSA 2014). Elle constitue une alternative en cas d’allergie aux bêtalactamines dans l’infection légère du pied, et une couverture anaérobie associée à une céphalosporine.</p>
<div class="lab">Posologie suisse</div><p>Dalacin C Phosphat (juillet 2026), adulte : infections sévères 1 200 à 1 800 mg par jour en 2 à 4 doses ; infections très sévères 2 400 à 2 700 mg par jour en 2 à 4 doses ; des doses intraveineuses jusqu’à 4 800 mg par jour ont été administrées. Pas plus de 1 200 mg par perfusion d’une heure, débit maximal de 30 mg/min, concentration maximale de 12 mg/mL.</p>
<div class="lab">Effets indésirables et interactions</div><p>Elle expose à la colite à <i>Clostridioides difficile</i>, à des réactions cutanées et à une néphrotoxicité potentielle. Elle potentialise les curares et peut élever l’INR sous antivitamine K ; la rifampicine, inducteur du CYP3A4, abaisse ses concentrations.</p>
</template>

<template data-pop="r02-d-peni" data-title="Pénicilline G (benzylpénicilline)">
<div class="lab">Mécanisme</div><p>La pénicilline G est une bêtalactamine bactéricide, très active sur les streptocoques et les clostridies.</p>
<div class="lab">Place</div><p>Elle s’associe à la clindamycine dans la myonécrose clostridienne et la fasciite à streptocoque du groupe A documentées (IDSA 2014). L’information professionnelle suisse cite la gangrène gazeuse parmi les indications et précise qu’elle ne doit pas être utilisée seule dans une infection grave à germe inconnu.</p>
<div class="lab">Posologie suisse</div><p>Penicillin Grünenthal (mai 2023) : dans les infections graves, 20 à 60 millions d’unités par jour en 4 à 6 doses. Le tableau de l’IDSA 2014 propose 2 à 4 millions d’unités toutes les 4 à 6 heures pour les clostridies.</p>
<div class="lab">Précautions</div><p>Chaque million d’unités apporte 1,7 mmol de sodium : la surcharge sodée compte chez l’insuffisant cardiaque ou rénal. À forte dose et en insuffisance rénale, des convulsions et des myoclonies peuvent survenir ; la dose se réduit selon la fonction rénale.</p>
</template>

<template data-pop="r02-d-metro" data-title="Métronidazole">
<div class="lab">Mécanisme</div><p>Le métronidazole est un nitro-imidazolé réduit dans les bactéries anaérobies en dérivés qui lèsent l’ADN. Il est actif sur les anaérobies stricts, inactif sur les aérobies.</p>
<div class="lab">Place</div><p>Il assure la couverture anaérobie, associé à une céphalosporine, dans la gangrène humide avec nécrose ou gaz, selon l’IWGDF/IDSA 2023.</p>
<div class="lab">Posologie suisse</div><p>Metronidazol i.v. B. Braun (février 2026) : dose de charge de 15 mg/kg, puis 7,5 mg/kg selon le schéma de l’information professionnelle ; durée habituelle de 5 à 7 jours, sans dépasser 10 jours en règle générale. La voie intraveineuse est réservée aux patients qui ne peuvent pas prendre la voie orale.</p>
<div class="lab">Effets indésirables et interactions</div><p>Une neuropathie périphérique, des convulsions, une ataxie ou une confusion imposent l’arrêt. Avec l’alcool, il provoque une réaction de type disulfirame ; il élève les concentrations de ciclosporine et de lithium et potentialise les antivitamines K. Sa dose se réduit en cas d’insuffisance hépatique sévère.</p>
</template>

<template data-pop="r02-d-vanco" data-title="Vancomycine">
<div class="lab">Mécanisme</div><p>La vancomycine est un glycopeptide qui bloque la synthèse de la paroi des bactéries à Gram positif, y compris le SARM.</p>
<div class="lab">Place</div><p>Elle s’ajoute en cas de facteur de risque de SARM dans l’infection du pied, et dans le traitement probabiliste des infections nécrosantes avant identification du germe (IDSA 2014).</p>
<div class="lab">Posologie suisse</div><p>Vancomycine Sandoz i.v. (mars 2026), à partir de 12 ans : 15 à 20 mg/kg toutes les 8 à 12 heures, au plus 2 g par dose ; dose de charge de 25 à 30 mg/kg chez le patient gravement malade. Les doses suivantes s’ajustent aux concentrations sériques et à la fonction rénale.</p>
<div class="lab">Surveillance</div><p>La perfusion dure au moins 60 minutes, à 10 mg/min au plus, pour éviter la réaction histaminique et l’hypotension. La créatinine et les concentrations sériques sont surveillées, en particulier en association avec la pipéracilline-tazobactam.</p>
</template>

<template data-pop="r02-d-iloprost" data-title="Iloprost intraveineux">
<div class="lab">Mécanisme</div><p>L’iloprost est un analogue stable de la prostacycline : il dilate les artérioles et inhibe l’agrégation plaquettaire par l’augmentation de l’adénosine monophosphate cyclique.</p>
<div class="lab">Indication suisse</div><p>Ilomedin 20/50 i.v. (novembre 2021) : thromboangéite oblitérante évoluée avec troubles circulatoires sévères lorsqu’une revascularisation n’est pas indiquée ; rares phénomènes de Raynaud secondaires évolués et réfractaires.</p>
<div class="lab">Posologie</div><p>La perfusion intraveineuse délivre 0,5 à 2,0 ng/kg/min sur 6 heures par jour, dose réglée selon la tolérance, à l’hôpital ou dans un cabinet équipé, avec mesure de la pression artérielle et de la fréquence cardiaque au début et à chaque augmentation. Une grossesse est exclue avant le traitement.</p>
<div class="lab">Limites</div><p>Il provoque céphalées, flush, nausées et hypotension. Les GVG 2019 ne le proposent pas pour sauver un membre dans la CLTI athéroscléreuse ; son emploi y reste sélectif, pour la douleur de repos ou une perte tissulaire mineure sans revascularisation possible.</p>
</template>

<template data-pop="r02-d-sglt2" data-title="Inhibiteurs du SGLT2 et plaie du pied">
<div class="lab">Recommandation</div><p>L’IWGDF 2023 recommande de ne pas débuter un inhibiteur du SGLT2 chez un diabétique ayant une plaie ou une gangrène du pied, et d’envisager une interruption temporaire chez celui qui en reçoit déjà, jusqu’à la cicatrisation.</p>
<div class="lab">Raisons</div><p>Un excès d’amputations a été observé avec la canagliflozine dans un programme d’essais cardiovasculaires, sans confirmation constante avec les autres molécules. La déplétion volémique et le risque d’acidocétose en situation infectieuse aiguë ajoutent un argument de prudence.</p>
<div class="lab">Après cicatrisation</div><p>Chez le diabétique de type 2 artéritique dont le débit de filtration dépasse 30 mL/min/1,73 m², l’IWGDF 2023 recommande d’envisager un inhibiteur du SGLT2 ou un agoniste du récepteur du GLP-1 au bénéfice cardiovasculaire démontré, indépendamment de la glycémie.</p>
</template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-r02-bases" data-title="Pareto — Définitions, épidémiologie, mécanismes et causes"><p class="ratio" data-cover="r02-1,r02-2,r02-3,r02-4"></p><ul>
<li>Gangrène sèche : nécrose ischémique de coagulation, noire et délimitée, stable ; humide : nécrose surinfectée qui se liquéfie et s’étend ; gazeuse : myonécrose par toxines clostridiennes, choc en heures.</li>
<li>R02 seulement si la cause n’est pas classée ailleurs : I70.25, I73.-, diabète avec complication vasculaire et A48.0 l’excluent.</li>
<li>Le tissu mort n’est atteint ni par les défenses ni par les antibiotiques : il s’excise ; l’infection aggrave l’ischémie par l’œdème, les thromboses et la consommation.</li>
<li>Diabète : neuropathie, atteinte distale, calcification de la média qui fausse l’index de cheville.</li>
<li>Topographie : nécrose distale unilatérale aux pouls absents pour l’athérosclérose ; nécroses symétriques pour la microcirculation, les vasopresseurs ou l’ergot.</li>
<li>Genève : risque d’amputation × 20 chez le diabétique ; CLTI non revascularisée : environ 22 % de décès et 22 % d’amputations en un an.</li></ul></template>

<template data-pop="pareto-r02-clinique" data-title="Pareto — Anamnèse et examen clinique"><p class="ratio" data-cover="r02-5,r02-6"></p><ul>
<li>La vitesse d’évolution des dernières heures sépare la gangrène stable de l’infection qui menace la vie.</li>
<li>Douleur disproportionnée, bulles hémorragiques, crépitation, peau grise ou bronzée : avis chirurgical immédiat.</li>
<li>Chez le diabétique, une hyperglycémie inexpliquée ou une odeur peuvent être les seuls signes d’infection.</li>
<li>Signes vitaux d’abord : deux critères du syndrome inflammatoire classent l’infection du pied au grade 4.</li>
<li>Érythème mesuré en centimètres, stylet osseux, monofilament, pouls des deux côtés ; un pouls perçu n’exclut pas l’artériopathie distale.</li></ul></template>

<template data-pop="pareto-r02-diag" data-title="Pareto — Démarche diagnostique et urgences"><p class="ratio" data-cover="r02-7,r02-8"></p><ul>
<li>Ordre : menace vitale, puis menace pour le membre par WIfI, puis cause.</li>
<li>Ischémie WIfI 3 : pression d’orteil ou transcutanée inférieure à 30 mmHg, pression de cheville inférieure à 50 mmHg, index inférieur ou égal à 0,39 ; la pression d’orteil l’emporte.</li>
<li>Index de cheville supérieur à 1,40 : non interprétable.</li>
<li>Pyoderma gangrenosum et calciphylaxie imitent la gangrène et ne s’excisent pas.</li>
<li>Urgences horaires : infection nécrosante et myonécrose, gangrène humide septique, ischémie aiguë, purpura fulminans, gangrène veineuse de thrombopénie induite par l’héparine.</li>
<li>LRINEC d’au moins 6 : sensibilité 68,2 % ; scanner : 88,5 % ; aucun n’exclut une suspicion clinique forte.</li></ul></template>

<template data-pop="pareto-r02-tt" data-title="Pareto — Traitement et pied diabétique"><p class="ratio" data-cover="r02-9,r02-10"></p><ul>
<li>Gangrène humide : drainage, excision et antibiotique d’abord, restadification, puis revascularisation.</li>
<li>Gangrène sèche non infectée : garder sèche, pas d’antibiotique, pas de débridement avant revascularisation.</li>
<li>Revascularisation recommandée au stade WIfI 4 avec ischémie 2 ou 3 chez le patient à risque moyen ; but : flux direct vers au moins une artère du pied.</li>
<li>BEST-CLI : pontage préférable avec bonne veine saphène ; BASIL-2 : endovasculaire d’abord pour le sous-poplité du patient âgé.</li>
<li>Amputation transmétatarsienne si plus de deux rayons ; amputation primaire pour un membre non sauvable ou un patient sans projet de marche, après décision partagée.</li>
<li>Pied diabétique : grades IWGDF/IDSA 1 à 4, suffixe (O) ; prélèvement tissulaire ou osseux ; durée selon l’infection résiduelle (6 semaines sans chirurgie, 3 semaines si marge osseuse positive).</li>
<li>Plaie qui ne diminue pas de 50 % en 4 semaines : réévaluer la perfusion.</li></ul></template>

<template data-pop="pareto-r02-suivi" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="r02-11,r02-12,r02-13"></p><ul>
<li>Antiagrégant, statine, arrêt du tabac, éducation et chaussures adaptées pour tous ; détails dans le cours I70.</li>
<li>Sujet fragile : décision partagée, amputation primaire ou soins palliatifs ; dialysé : pression d’orteil et calciphylaxie.</li>
<li>Réanimation : gangrène symétrique laissée se délimiter ; neutropénie ou cancer colique : <i>Clostridium septicum</i>.</li>
<li>Pas de critères formels de la gangrène ; décisions fondées sur la définition de la CLTI, la classification IWGDF/IDSA et le diagnostic opératoire de la myonécrose.</li></ul></template>

<template data-pop="pareto-r02-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="r02-e-1,r02-e-2,r02-e-3,r02-e-4,r02-e-5"></p><ul>
<li>Exploration chirurgicale : référence pour l’infection nécrosante ; elle n’attend pas l’imagerie.</li>
<li>Pression d’orteil : mesure préférée chez le diabétique ; moins de 30 mmHg signe une ischémie sévère ; index orteil-bras normal à partir de 0,70.</li>
<li>Onde Doppler monophasique : lit d’aval maximalement dilaté, ischémie sévère ; pression transcutanée en oxygène inférieure à 30 mmHg : ischémie de grade 3, faussement basse en cas d’œdème ou d’infection.</li>
<li>Index de cheville supérieur à 1,40 : artère incompressible ; même en dessous, la calcification peut surestimer la pression.</li>
<li>Angiographie incluant cheville et pied avant de déclarer un patient non revascularisable.</li>
<li>Radiographie : gaz et ostéite, signes osseux tardifs ; IRM si ostéite douteuse ; biopsie osseuse pour le germe.</li>
<li>Prélèvement tissulaire plutôt qu’écouvillon ; créatine kinase et hémolyse pour la myonécrose ; plaquettes et fibrinogène pour une cause microvasculaire.</li></ul></template>

<template data-pop="pareto-r02-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="r02-sa,r02-sh,r02-sp,r02-sm"></p><ul>
<li>Les orteils sont au bout de l’arcade plantaire : pression la plus basse, nécrose la plus précoce ; les gaines des fléchisseurs conduisent l’infection plantaire vers la jambe.</li>
<li>Coagulation pour la gangrène sèche, liquéfaction pour l’humide, lyse toxinique pauvre en polynucléaires pour la gazeuse ; pas de granulation sans perfusion.</li>
<li>Apport en oxygène = débit × contenu artériel ; résistance inversement proportionnelle à la quatrième puissance du rayon ; la calcification de la média fausse le brassard.</li>
<li>Pesanteur : environ 0,78 mmHg par centimètre, d’où le soulagement jambe pendante ; la pression transcutanée en oxygène baisse aussi avec l’œdème et l’infection, sans lésion artérielle nouvelle.</li>
<li>Infection légère : cocci à Gram positif ; nécrose ischémique : flore polymicrobienne avec anaérobies ; clostridies : toxines alpha et thêta, d’où la clindamycine.</li></ul></template>

<template data-pop="pareto-r02-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="r02-p-1,r02-p-2,r02-p-3,r02-p-4,r02-p-5"></p><ul>
<li>Pas d’antibiotique pour une nécrose sèche non infectée ; jamais d’antibiotique à la place de la chirurgie d’une gangrène humide.</li>
<li>Gangrène humide en Suisse : amoxicilline-acide clavulanique intraveineuse 2,2 g 3 à 4 fois par jour, réduite sous 30 mL/min ; pipéracilline-tazobactam si <i>Pseudomonas</i> probable ; vancomycine si risque de SARM.</li>
<li>Myonécrose : spectre large au départ, puis pénicilline et clindamycine ; oxygénothérapie hyperbare jamais avant la chirurgie.</li>
<li>Durée fixée par l’infection résiduelle après chirurgie, non par la cicatrisation ; relais oral dès stabilisation, spectre réduit selon les cultures.</li>
<li>Iloprost : indication suisse limitée à la maladie de Buerger et au Raynaud secondaire réfractaires ; inhibiteurs du SGLT2 suspendus pendant une plaie active.</li>
<li>À éviter : ergot avec inhibiteurs du CYP3A4, anti-inflammatoires chez le néphropathe, antivitamine K pendant une thrombopénie induite par l’héparine ; créatinine quotidienne sous pipéracilline-tazobactam et vancomycine.</li></ul></template>
