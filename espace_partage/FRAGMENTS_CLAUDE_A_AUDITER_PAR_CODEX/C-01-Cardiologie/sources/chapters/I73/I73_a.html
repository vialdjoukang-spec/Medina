<section class="ilot" id="i73-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 41 ans, secrétaire, consulte en février. Depuis deux hivers, ses doigts deviennent brutalement blancs au froid, puis bleus, puis rouges et douloureux au réchauffement. Elle a noté cette année une petite plaie au bout de l’index droit, qui a mis six semaines à cicatriser. Ses doigts lui semblent « gonflés » le matin. Sa sœur cadette décrit les mêmes changements de couleur depuis l’âge de 16 ans, sans aucune autre plainte.</p>
<p>Les deux sœurs ont le même symptôme, mais pas la même maladie. Chez la cadette, le spasme est fonctionnel : les artères sont saines et le pronostic est bon. Chez l’aînée, l’âge de début tardif, la plaie pulpaire et les doigts boudinés font craindre une <button class="w" data-k="i73-ssc">sclérodermie systémique débutante (atteinte des petits vaisseaux et fibrose)</button>. Trois questions organisent le chapitre : <b>le phénomène de Raynaud est-il primaire ou secondaire, existe-t-il une ischémie tissulaire qui menace le doigt, et quel traitement réduit les crises sans nuire ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître un phénomène de Raynaud et en distinguer les formes primaire et secondaire par l’anamnèse, l’examen, la <button class="w" data-k="i73-capillaro">capillaroscopie périunguéale (examen des anses capillaires du repli de l’ongle)</button> et les anticorps antinucléaires. Il sait aussi reconnaître une thromboangéite oblitérante, une érythromélalgie et une acrocyanose, qui forment avec le phénomène de Raynaud la catégorie I73 de la CIM-10-GM. L’artériopathie athéromateuse des membres relève du chapitre I70 et n’est pas reprise ici.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i73-thermo">thermorégulation par la circulation cutanée des extrémités (rôle des anastomoses artérioveineuses)</button>, le <button class="w" data-k="i73-alpha2c">récepteur α2C-adrénergique (effecteur de la vasoconstriction au froid)</button> et la <button class="w" data-k="i73-endoth">fonction de l’endothélium (monoxyde d’azote, prostacycline, endothéline)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i73-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Le <b>phénomène de Raynaud</b> est une ischémie digitale transitoire et réversible, déclenchée par le froid ou par une émotion. Elle se traduit par un changement de couleur bien délimité des doigts ou des orteils. Normalement, le froid réduit le débit cutané des extrémités sans le supprimer, ce qui limite la perte de chaleur. Dans le phénomène de Raynaud, les artères digitales et les artérioles se ferment presque complètement : le doigt devient blanc au-delà d’une limite nette. Le sang qui stagne se désature ensuite et le doigt bleuit. Au réchauffement, le spasme cède et une <button class="w" data-k="i73-phases">hyperhémie réactive (phase rouge, douloureuse)</button> recolore le doigt.</p>
<p>Le consensus international de 2014 exige au minimum <b>deux couleurs, blanc et bleu</b>, et le froid parmi les déclencheurs. La séquence complète blanc, bleu, rouge est plus typique, mais elle n’est pas obligatoire. Le diagnostic est clinique : le médecin ne voit presque jamais la crise et s’appuie sur la description ou sur une <button class="w" data-k="i73-photo">photographie prise par le patient pendant la crise</button>.</p>
<h3>1.1 Primaire ou secondaire</h3>
<p>La distinction entre forme primaire et forme secondaire commande tout le reste, car elle sépare un trouble fonctionnel bénin d’une maladie des vaisseaux qui peut détruire le doigt. Le <b>phénomène de Raynaud primaire</b>, autrefois nommé « maladie de Raynaud », survient sans maladie causale ; les artères sont structurellement normales. Le <b>phénomène de Raynaud secondaire</b>, ou « syndrome de Raynaud », accompagne une maladie identifiable, surtout une connectivite, qu’il précède souvent de plusieurs années.</p>
<table class="t"><tr><th>Élément</th><th>Primaire</th><th>Secondaire</th></tr>
<tr><td>Âge de début</td><td>Adolescence, adulte jeune</td><td>Souvent après 30 à 40 ans</td></tr>
<tr><td>Atteinte</td><td>Symétrique, plusieurs doigts</td><td>Parfois asymétrique, douloureuse</td></tr>
<tr><td>Lésions tissulaires</td><td>Absentes</td><td>Ulcères pulpaires, cicatrices en creux, nécrose possibles</td></tr>
<tr><td>Capillaroscopie</td><td>Normale</td><td>Souvent anormale (aspect sclérodermique)</td></tr>
<tr><td>Anticorps antinucléaires</td><td>Négatifs ou titre bas (1:40)</td><td>Souvent positifs, parfois spécifiques</td></tr>
<tr><td>Signes de maladie causale</td><td>Absents</td><td>Doigts boudinés, sclérodactylie, télangiectasies, arthrite, pouls absent</td></tr></table>
<p>Ce tableau se lit par la colonne de droite : un seul élément de la forme secondaire suffit à poursuivre l’enquête. L’erreur fréquente consiste à conclure à une forme primaire chez une femme jeune parce que son âge est « typique », sans capillaroscopie ni anticorps. Chez la patiente du cas fil rouge, le début à 39 ans, la plaie pulpaire et les doigts boudinés relèvent tous de la colonne de droite. La forme primaire n’est donc pas un diagnostic de première impression ; elle repose sur des <button class="w" data-k="i73-crit-prim">critères explicites (consensus international 2014)</button>.</p>
<h3>1.2 La catégorie I73 dans la CIM-10-GM 2024</h3>
<p>La catégorie I73 regroupe des maladies des petites artères et de la microcirculation des extrémités qui ne relèvent pas de l’athérosclérose. Le codage est utile au clinicien, car il impose de choisir entre une cause précise et une formule « sans précision ».</p>
<table class="t"><tr><th>Code</th><th>Intitulé (BfArM, 2024)</th><th>Contenu clinique</th></tr>
<tr><td>I73.0</td><td>Syndrome de Raynaud</td><td>Maladie, phénomène (y compris secondaire) et gangrène de Raynaud</td></tr>
<tr><td>I73.1</td><td>Thrombo-angéite oblitérante [Buerger]</td><td>Artérite inflammatoire distale du fumeur jeune</td></tr>
<tr><td>I73.8</td><td>Autres maladies vasculaires périphériques précisées</td><td>Acrocyanose, érythrocyanose, érythromélalgie, acroparesthésies de Schultze et de Nothnagel</td></tr>
<tr><td>I73.9</td><td>Maladie vasculaire périphérique, sans précision</td><td>Spasme artériel, claudication intermittente sans autre indication</td></tr></table>
<p>Le tableau montre que le code ne remplace pas le diagnostic. Un phénomène de Raynaud secondaire à une sclérodermie systémique se code I73.0 et la connectivite se code à part, dans la catégorie M34. La CIM-10-GM exclut de I73 les engelures et le pied d’immersion (catégorie T69), les gelures (T33 à T35) et le spasme des artères cérébrales (G45). Une claudication due à une <button class="w" data-k="i73-renvoi-i70">artériopathie athéromateuse des membres inférieurs (chapitre I70)</button> se code I70.2 et non I73.9.</p>
<div class="trap"><span class="k">Piège</span>Le mot « syndrome » n’a pas ici son sens habituel. L’intitulé « Syndrome de Raynaud » de la CIM-10-GM couvre aussi la forme primaire. Dans les publications, « syndrome de Raynaud » désigne souvent la seule forme secondaire. Le dossier précise donc toujours « primaire » ou « secondaire à… ».</div>
</section>

<section class="ilot" id="i73-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Le phénomène de Raynaud est fréquent. La méta-analyse de Garner et al. (2015) estime la prévalence de la forme primaire à 4,85 % dans la population générale, avec un intervalle de confiance large (2,08 à 8,71 %). Elle est un peu plus élevée chez la femme (5,74 %) que chez l’homme (4,12 %). L’hétérogénéité entre études est très forte, car les définitions et les climats diffèrent. Une prévalence plus élevée dans les pays froids est plausible, puisque le froid déclenche les crises.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune étude de prévalence suisse du phénomène de Raynaud, de la thromboangéite oblitérante ou de l’érythromélalgie n’a été trouvée lors de la rédaction (recherche du 08.10.2026). Les chiffres cités proviennent de cohortes européennes, nord-américaines et d’une méta-analyse internationale.</div>
<p>Le pronostic dépend de la forme. Le phénomène primaire reste bénin : il ne provoque ni ulcère ni amputation. Le risque est l’évolution vers une connectivite. Dans la cohorte prospective montréalaise de <button class="w" data-k="i73-koenig">Koenig et al. (586 patients suivis jusqu’à 20 ans)</button>, 12,6 % des patients adressés pour un phénomène de Raynaud sans connectivite ont développé une sclérodermie systémique définie. Le risque était très élevé lorsque la capillaroscopie initiale était anormale et qu’un anticorps spécifique de la sclérodermie était présent. Leur absence simultanée excluait presque cette évolution. Ces chiffres viennent d’un centre de référence : ils surestiment le risque d’une patiente vue en médecine de premier recours.</p>
<p>La <b>thromboangéite oblitérante</b> est rare en Europe. Dans la cohorte française de <button class="w" data-k="i73-lejoncour">Le Joncour et al. (224 patients, 2018)</button>, l’âge médian au diagnostic était de 38,5 ans, et 23,8 % des patients étaient des femmes. Après un suivi moyen de 5,7 ans, 21,4 % des patients avaient subi une amputation. La survie sans amputation était de 85 % à 5 ans, 74 % à 10 ans et 66 % à 15 ans. Le décès est rare, mais la perte de membre est fréquente.</p>
<p>L’<b>érythromélalgie</b> est rare. À Olmsted County (Minnesota), son incidence ajustée était de 1,3 cas pour 100 000 personnes par an, dont 1,1 pour la forme primaire. Elle était trois fois plus fréquente chez la femme (Reed et Davis, 2009). L’<b>acrocyanose</b> n’a pas de donnée épidémiologique fiable ; elle est décrite surtout chez la femme jeune et mince.</p>

</section>

<section class="ilot" id="i73-3"><h2><span class="n">3</span>Physiopathologie du phénomène de Raynaud</h2>
<p>La peau des doigts est un organe de thermorégulation. Son débit varie de plus de dix fois entre le froid et la chaleur, alors que ses besoins métaboliques sont faibles. Ce débit passe surtout par des <button class="w" data-k="i73-thermo">anastomoses artérioveineuses sous contrôle sympathique (court-circuit des capillaires)</button>. Le raisonnement suit la chaîne : <b>froid ou émotion → activation sympathique → vasoconstriction excessive des artères digitales → ischémie (blanc) → désaturation (bleu) → reperfusion (rouge)</b>. Dans la forme secondaire, une lésion de la paroi s’ajoute au spasme.</p>
<h3>3.1 Le spasme : une réponse normale devenue excessive</h3>
<p>Au froid, la noradrénaline libérée par les fibres sympathiques contracte le muscle lisse des artères digitales. Le froid active en plus une voie propre : il fait migrer des <button class="w" data-k="i73-alpha2c">récepteurs α2C-adrénergiques vers la surface des cellules musculaires lisses</button>, ce qui amplifie la contraction. Dans le phénomène primaire, cette réponse est simplement trop forte. Les artères sont saines, si bien que le spasme cède toujours et ne laisse aucune lésion. La cause exacte de cette hyperréactivité reste inconnue ; une composante familiale est fréquente.</p>
<h3>3.2 La lésion : la paroi devient le problème</h3>
<p>Dans la sclérodermie systémique, l’endothélium est lésé tôt. Il produit moins de <button class="w" data-k="i73-endoth">monoxyde d’azote et de prostacycline (vasodilatateurs)</button> et davantage d’endothéline 1, un vasoconstricteur puissant. L’intima prolifère et rétrécit la lumière des artères digitales. Une artère déjà rétrécie à 50 % perd beaucoup plus de débit qu’une artère saine pour le même degré de contraction, car la résistance varie selon l’inverse de la puissance quatre du rayon (loi de Poiseuille). Les capillaires se raréfient et se déforment : c’est ce que montre la capillaroscopie. Le spasme survient alors sur un réseau rétréci, et l’ischémie peut durer assez pour créer un <button class="w" data-k="i73-ulcere">ulcère digital (nécrose pulpaire ischémique)</button>.</p>

</section>

<section class="ilot" id="i73-4"><h2><span class="n">4</span>Causes du phénomène de Raynaud secondaire</h2>
<p>Une forme secondaire se cache souvent derrière une présentation banale. Les causes se regroupent en six familles. Leur recherche repose surtout sur l’anamnèse et l’examen, puis sur quelques examens ciblés. L’aide-mémoire <button class="w" data-k="i73-mnemo">des six familles de causes (aide pédagogique)</button> aide à les passer en revue.</p>
<table class="t"><tr><th>Famille</th><th>Exemples</th><th>Indice clinique</th></tr>
<tr><td>Connectivites</td><td><button class="w" data-k="i73-ssc">Sclérodermie systémique</button>, connectivite mixte, lupus, syndrome de Sjögren, dermatomyosite</td><td>Doigts boudinés, ulcères, arthralgies, sécheresse, faiblesse proximale</td></tr>
<tr><td>Maladies artérielles obstructives</td><td><button class="w" data-k="i73-buerger">Thromboangéite oblitérante</button>, athérosclérose, embolie, artérite</td><td>Atteinte asymétrique, pouls absent, tabac</td></tr>
<tr><td>Causes professionnelles et mécaniques</td><td><button class="w" data-k="i73-vibr">Syndrome des vibrations main-bras</button>, syndrome du marteau hypothénarien, défilé thoracobrachial</td><td>Outils vibrants, usage de la paume comme marteau, atteinte unilatérale</td></tr>
<tr><td>Médicaments et toxiques</td><td><button class="w" data-k="i73-medic">Dérivés de l’ergot, triptans, sympathomimétiques, certains anticancéreux, cocaïne, nicotine</button></td><td>Début après une prescription ou une exposition</td></tr>
<tr><td>Anomalies du sang</td><td><button class="w" data-k="i73-cryo">Cryoglobulines, agglutinines froides, paraprotéine</button>, polyglobulie</td><td>Purpura, acrocyanose, hépatite C, gammapathie</td></tr>
<tr><td>Causes endocriniennes et autres</td><td>Hypothyroïdie, syndrome paranéoplasique</td><td>Fatigue, frilosité, perte de poids</td></tr></table>
<p>Ce tableau se lit d’abord par sa dernière colonne, car c’est l’indice clinique qui oriente la recherche. Le premier réflexe concerne l’asymétrie : un phénomène de Raynaud limité à une main n’est presque jamais primaire. Il fait chercher une cause locale, vibration, lésion artérielle ou compression. Exemple : un homme de 48 ans, carreleur, dont seuls l’annulaire et l’auriculaire droits blanchissent, doit être examiné pour un <button class="w" data-k="i73-vibr">syndrome du marteau hypothénarien (lésion de l’artère ulnaire dans la paume)</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Arrêter un bêtabloquant indispensable au seul motif d’un phénomène de Raynaud. Le blocage des récepteurs β2 vasculaires laisse la vasoconstriction α-adrénergique sans contrepoids, ce qui explique une vasoconstriction périphérique. Dans une méta-analyse en réseau de 38 essais randomisés (Khouri et al., 2016), elle était rapportée chez 7 % des patients sous bêtabloquant contre 4,6 % des témoins, avec un excès net pour l’aténolol et le propranolol, et non pour les molécules à activité sympathomimétique intrinsèque. Après un infarctus ou dans une insuffisance cardiaque, le bénéfice vital du bêtabloquant l’emporte : le médecin discute une autre molécule plutôt qu’un arrêt, et cherche quand même une cause secondaire.</div>

<section class="ilot" id="i73-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse a trois buts : confirmer qu’il s’agit bien d’un phénomène de Raynaud, chercher une cause secondaire, et mesurer le retentissement. Elle commence par la <button class="w" data-k="i73-question">question de dépistage (sensibilité inhabituelle des doigts au froid)</button>, puis demande la séquence des couleurs, leur limite et leur durée.</p>
<h3>5.1 Antécédents et expositions</h3>
<div class="two">
<ul><li><button class="w" data-k="i73-atcd-fam">Histoire familiale de phénomène de Raynaud (orientation vers la forme primaire)</button></li><li><button class="w" data-k="i73-tabac">Tabac, cannabis (thromboangéite oblitérante, aggravation du spasme)</button></li><li><button class="w" data-k="i73-vibr">Travail avec des outils vibrants (marteau-piqueur, tronçonneuse, meuleuse)</button></li><li><button class="w" data-k="i73-medic">Médicaments vasoconstricteurs, anticancéreux, stimulants</button></li></ul>
<ul><li><button class="w" data-k="i73-ssc">Brûlures œsophagiennes, dysphagie, essoufflement (atteinte de la sclérodermie)</button></li><li>Sécheresse des yeux et de la bouche : elle oriente vers un syndrome de Sjögren, qui associe un phénomène de Raynaud chez une partie des patients.</li><li>Arthralgies, éruption photosensible, aphtes : elles orientent vers un lupus, dont le phénomène de Raynaud peut précéder les autres signes.</li><li><button class="w" data-k="i73-cryo">Purpura déclive, hépatite C, gammapathie connue (cryoglobulinémie)</button></li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i73-phases">Changements de couleur bien délimités (blanc, bleu, rouge)</button></li><li><button class="w" data-k="i73-s-engourd">Engourdissement, maladresse pendant la crise</button></li><li><button class="w" data-k="i73-phases">Douleur pulsatile au réchauffement (phase rouge)</button></li></ul>
<ul><li><button class="w" data-k="i73-ulcere">Plaie pulpaire lente à cicatriser (ulcère digital)</button></li><li>Douleur ischémique permanente d’un doigt : elle signale une ischémie critique et impose une évaluation le jour même (îlot 8).</li><li>Atteinte des orteils, du nez, des oreilles ou des mamelons : elle est possible dans les deux formes et ne distingue pas primaire et secondaire.</li></ul></div>
<p>La crise dure habituellement quelques minutes à une demi-heure. Une ischémie qui persiste plusieurs heures après le réchauffement n’est plus un spasme simple : elle suggère une occlusion fixe. Le retentissement se mesure par le nombre de crises par jour, leur durée, la gêne dans le travail et la présence de lésions.</p>
<h3>5.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme primaire typique</h4><p>Femme de 19 ans, quatre à cinq crises par jour en hiver, des deux mains, depuis l’âge de 15 ans. Sa mère a les mêmes symptômes. Aucun ulcère, examen normal, capillaroscopie normale, anticorps antinucléaires négatifs. Le diagnostic de forme primaire est posé ; la réévaluation est prévue si un signe nouveau apparaît.</p></div>
<div class="card"><h4>Forme secondaire à une sclérodermie</h4><p>Femme de 52 ans, phénomène apparu à 49 ans, doigts boudinés, deux cicatrices pulpaires en creux, télangiectasies du visage, reflux. Capillaroscopie : mégacapillaires et raréfaction. Anticorps anticentromère positifs. Le phénomène de Raynaud est la porte d’entrée d’une <button class="w" data-k="i73-ssc">sclérodermie systémique cutanée limitée</button>.</p></div>
<div class="card"><h4>Forme unilatérale professionnelle</h4><p>Homme de 45 ans, bûcheron, crises limitées à la main droite depuis cinq ans, fourmillements nocturnes. La cause est un <button class="w" data-k="i73-vibr">syndrome des vibrations main-bras</button>, maladie professionnelle à déclarer à l’assureur-accidents (en Suisse, le plus souvent la Suva).</p></div>
<div class="card"><h4>Forme révélant une artérite du fumeur</h4><p>Homme de 32 ans, fumeur de 25 cigarettes par jour et de cannabis, phénomène de Raynaud d’une main, puis plaie de l’orteil et douleur de la voûte plantaire à la marche. Ces éléments orientent vers une <button class="w" data-k="i73-buerger">thromboangéite oblitérante (îlot 10)</button>.</p></div></div>
</section>

<section class="ilot" id="i73-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen se fait le plus souvent hors crise. Il répond à deux questions : existe-t-il une lésion tissulaire ou une obstruction artérielle, et existe-t-il des signes d’une maladie causale ? Il suit l’ordre habituel : état général, signes vitaux, anthropométrie, puis signes ciblés.</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>L’examen note l’état général, la fièvre, la perte de poids et l’indice de masse corporelle. Une maigreur importante oriente vers une acrocyanose ou un trouble du comportement alimentaire, qui réduit la production de chaleur. Le médecin mesure la <button class="w" data-k="i73-e-pa">pression artérielle aux deux bras (asymétrie supérieure à 15 mmHg)</button>, car une différence signale une sténose de l’artère subclavière, qui peut produire un phénomène unilatéral. Une hypertension récente et sévère chez un patient sclérodermique fait craindre une crise rénale sclérodermique (îlot 8).</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Mains et pieds</b><ul><li><button class="w" data-k="i73-e-pouls">Pouls radial, ulnaire, pédieux et tibial postérieur</button></li><li><button class="w" data-k="i73-e-allen">Test d’Allen (perméabilité des arcades palmaires)</button></li><li><button class="w" data-k="i73-ulcere">Ulcères pulpaires, cicatrices en creux, nécrose</button></li><li><button class="w" data-k="i73-e-capdermato">Repli de l’ongle au dermatoscope (capillaroscopie de dépistage)</button></li></ul></div>
<div><b>Signes de sclérodermie</b><ul><li><button class="w" data-k="i73-e-boudin">Doigts boudinés (œdème sclérodermique précoce)</button></li><li><button class="w" data-k="i73-e-sclerodact">Sclérodactylie (peau épaissie qui ne se plisse plus)</button></li><li><button class="w" data-k="i73-e-telang">Télangiectasies en nappe du visage et des paumes</button></li><li>Calcinose sous-cutanée des doigts : nodules durs, parfois ouverts à la peau, qui libèrent un matériau crayeux.</li></ul></div>
<div><b>Autres connectivites et vascularites</b><ul><li>Arthrite des petites articulations, éruption malaire, livedo : elles orientent vers un lupus ou une polyarthrite.</li><li>Mains de mécanicien, faiblesse proximale : elles orientent vers une myosite.</li><li><button class="w" data-k="i73-cryo">Purpura palpable des jambes</button>.</li></ul></div>
<div><b>Causes locales</b><ul><li><button class="w" data-k="i73-e-tos">Manœuvres du défilé thoracobrachial (abolition du pouls en abduction)</button></li><li><button class="w" data-k="i73-vibr">Callosité et sensibilité de l’éminence hypothénar</button></li><li><button class="w" data-k="i73-e-souffle">Souffle subclavier ou axillaire</button></li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Un examen normal entre les crises ne prouve pas la forme primaire. Les doigts boudinés et les premières anomalies capillaroscopiques précèdent souvent de plusieurs années l’épaississement cutané franc de la sclérodermie. Le repli de l’ongle s’examine donc chez tout patient, et la capillaroscopie formelle s’obtient au moindre doute.</div>
