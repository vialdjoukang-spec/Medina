
<!-- ===== FENÊTRES I73 : notions fondamentales, définitions, épidémiologie ===== -->
<template data-pop="i73-thermo" data-title="Thermorégulation et anastomoses artérioveineuses">
<div class="lab">Définition</div><p>Les anastomoses artérioveineuses sont des courts-circuits musculaires qui relient directement une artériole à une veinule, sans passer par les capillaires. Elles abondent dans la pulpe des doigts, le lit de l’ongle, les paumes, les plantes, le nez et les oreilles.</p>
<div class="lab">Fonctionnement normal</div><p>Ouvertes, elles font passer un grand débit de sang chaud près de la surface : la chaleur se dissipe. Fermées, elles réduisent la perte de chaleur et protègent la température centrale. Leur paroi musculaire épaisse est innervée par des fibres sympathiques noradrénergiques ; le tonus sympathique règle donc leur ouverture.</p>
<div class="lab">Conséquence clinique</div><p>Le froid ressenti par le tronc ferme aussi ces anastomoses, par voie réflexe. C’est pourquoi un patient qui protège ses mains mais garde le tronc froid continue d’avoir des crises. La consigne pratique est de protéger tout le corps.</p>
<div class="lab">Limite</div><p>Les anastomoses servent la thermorégulation, pas la nutrition des tissus, qui dépend des capillaires. Leur fermeture seule ne crée pas d’ischémie ; c’est la fermeture des artères digitales en amont qui produit le doigt blanc.</p></template>

<template data-pop="i73-alpha2c" data-title="Récepteur α2C-adrénergique et froid">
<div class="lab">Définition</div><p>Les récepteurs α2-adrénergiques du muscle lisse vasculaire répondent à la noradrénaline en provoquant une contraction. Le sous-type α2C prédomine dans les petites artères cutanées des extrémités.</p>
<div class="lab">Mécanisme du froid</div><p>À température normale, une grande partie des récepteurs α2C reste dans l’appareil de Golgi, inactive. Le refroidissement active une voie de signalisation qui comprend la Rho-kinase et fait migrer ces récepteurs vers la membrane. La même quantité de noradrénaline produit alors une contraction plus forte. Ce mécanisme a été décrit surtout sur des artères isolées et des modèles animaux.</p>
<div class="lab">Phénomène de Raynaud</div><p>L’hyperréactivité au froid de la forme primaire impliquerait une réponse α2C excessive. Cette hypothèse est cohérente avec les données expérimentales, mais aucun médicament ciblant spécifiquement le récepteur α2C n’a démontré de bénéfice clinique.</p>
<div class="lab">Conséquence pratique</div><p>Ce mécanisme explique que le froid local et l’activation sympathique s’additionnent. Il justifie la protection contre le froid et l’évitement des sympathomimétiques.</p></template>

<template data-pop="i73-endoth" data-title="Endothélium : monoxyde d’azote, prostacycline, endothéline">
<div class="lab">Fonction normale</div><p>L’endothélium règle en permanence le tonus des artères. Il libère du monoxyde d’azote, qui active la guanylate cyclase du muscle lisse et augmente le GMPc, et de la prostacycline, qui augmente l’AMPc. Ces deux messagers relâchent le muscle et freinent l’agrégation des plaquettes. Il libère aussi de l’endothéline 1, un vasoconstricteur très puissant, en faible quantité.</p>
<div class="lab">Dans la sclérodermie</div><p>L’endothélium lésé produit moins de monoxyde d’azote et de prostacycline, et davantage d’endothéline 1. L’équilibre penche vers la contraction et vers le remodelage de la paroi, car l’endothéline stimule aussi la prolifération des cellules musculaires lisses et des fibroblastes.</p>
<div class="lab">Corrélation thérapeutique</div><p>Chaque déséquilibre a son médicament : les inhibiteurs de la phosphodiestérase de type 5 prolongent l’effet du monoxyde d’azote, l’iloprost remplace la prostacycline, le bosentan bloque l’endothéline. Ce lien explique le « continuum » thérapeutique de l’EULAR 2023 entre phénomène de Raynaud, ulcères et hypertension artérielle pulmonaire.</p></template>

<template data-pop="i73-phases" data-title="Les trois phases colorées de la crise">
<div class="lab">Phase blanche</div><p>Les artères digitales se ferment ; le doigt se vide de sang et pâlit au-delà d’une limite nette. Le patient décrit un doigt « mort », engourdi et froid. Cette phase traduit l’ischémie.</p>
<div class="lab">Phase bleue</div><p>Un peu de sang entre ou stagne et cède son oxygène aux tissus. L’hémoglobine désoxygénée colore la peau en bleu violacé.</p>
<div class="lab">Phase rouge</div><p>Au réchauffement, le spasme cède. Les métabolites accumulés pendant l’ischémie, dont l’adénosine et l’acidité, dilatent les vaisseaux : le débit dépasse la normale pendant quelques minutes. Cette hyperhémie réactive s’accompagne de picotements et d’une douleur pulsatile.</p>
<div class="lab">Valeur diagnostique</div><p>Le consensus de 2014 exige au minimum les phases blanche et bleue. La phase rouge manque souvent. Une rougeur isolée, chaude et douloureuse à la chaleur oriente au contraire vers une érythromélalgie.</p>
<div class="lab">Piège</div><p>Une cyanose permanente sans phase blanche n’est pas un phénomène de Raynaud : c’est une acrocyanose ou une cyanose d’origine centrale, qui se vérifie par la saturation en oxygène.</p></template>

<template data-pop="i73-photo" data-title="Photographie de la crise">
<div class="lab">Principe</div><p>Le médecin voit rarement la crise, qui dure quelques minutes. Il demande au patient de photographier ses mains pendant un épisode, avec son téléphone, à la lumière du jour.</p>
<div class="lab">Valeur</div><p>La photographie montre la limite nette entre doigt pâle et peau normale, le nombre de doigts touchés et la symétrie. Elle distingue un phénomène de Raynaud d’une simple pâleur au froid ou d’une acrocyanose.</p>
<div class="lab">Limite</div><p>La couleur rendue dépend de l’éclairage et de l’appareil. La photographie complète l’anamnèse sans la remplacer.</p></template>

<template data-pop="i73-question" data-title="Question de dépistage et description de la crise">
<div class="lab">Question de dépistage</div><p>Le consensus international de 2014 commence par une question : « Vos doigts sont-ils inhabituellement sensibles au froid ? » Une réponse négative rend le phénomène de Raynaud peu probable.</p>
<div class="lab">Description</div><p>Le médecin demande ensuite quelles couleurs apparaissent, si la limite est nette, combien de doigts sont touchés, si les deux mains le sont, et combien de temps dure la crise. Il demande aussi si le froid fait partie des déclencheurs, ce qui est exigé.</p>
<div class="lab">Piège</div><p>« Avoir froid aux mains » est très fréquent et ne suffit pas. Seule la description d’un changement de couleur délimité, au moins blanc puis bleu, définit le phénomène.</p></template>

<template data-pop="i73-crit-prim" data-title="Critères du phénomène de Raynaud primaire (consensus 2014)">
<div class="lab">Source</div><p>Maverakis E et al., International consensus criteria for the diagnosis of Raynaud’s phenomenon, Journal of Autoimmunity 2014 ; Delphi de 12 experts de quatre pays.</p>
<div class="lab">Cinq critères, tous requis</div><ul><li>Les critères en trois étapes du phénomène de Raynaud sont remplis.</li><li>La capillaroscopie périunguéale est normale.</li><li>L’examen ne montre aucun signe de cause secondaire : ulcère, nécrose, sclérodactylie, calcinose, fibrose cutanée.</li><li>Aucune connectivite n’est connue.</li><li>Les anticorps antinucléaires sont négatifs ou de titre bas, par exemple 1:40 en immunofluorescence indirecte.</li></ul>
<div class="lab">Limites</div><p>Ce consensus d’experts ne repose pas sur une validation prospective. Il ne définit pas de critères de la forme secondaire. Il ne fixe pas de durée d’observation : une patiente classée primaire peut évoluer, d’où la réévaluation si un signe apparaît.</p>
<div class="lab">Conséquence pratique</div><p>Deux examens sont indispensables avant de parler de forme primaire : la capillaroscopie et les anticorps antinucléaires.</p></template>

<template data-pop="i73-renvoi-i70" data-title="Renvoi : artériopathie athéromateuse (chapitre I70)">
<div class="lab">Frontière entre les chapitres</div><p>L’artériopathie oblitérante athéromateuse des membres, la claudication avec un index de pression systolique abaissé, l’ischémie chronique menaçante et l’ischémie aiguë par embolie ou thrombose relèvent du chapitre I70, qui couvre aussi la catégorie I74. Le présent chapitre traite les maladies non athéromateuses des petites artères et de la microcirculation.</p>
<div class="lab">Situations de chevauchement</div><p>Un sujet âgé fumeur qui développe un phénomène de Raynaud asymétrique peut avoir une artériopathie athéromateuse de l’artère subclavière ou des artères de l’avant-bras. Le bilan suit alors le chapitre I70 : facteurs de risque, index de pression, imagerie, prévention cardiovasculaire.</p>
<div class="lab">Codage</div><p>La claudication intermittente avec artériopathie oblitérante se code I70.2 ; le code I73.9 ne s’emploie qu’en l’absence de cause trouvée.</p></template>

<template data-pop="i73-ssc" data-title="Sclérodermie systémique : ce que le phénomène de Raynaud annonce">
<div class="lab">Définition</div><p>Maladie auto-immune rare qui associe une atteinte des petits vaisseaux, une activation immunitaire et une fibrose de la peau et des organes. Le phénomène de Raynaud en est la manifestation la plus constante et souvent la première, parfois des années avant la fibrose cutanée.</p>
<div class="lab">Deux formes cutanées</div><p>La forme <b>limitée</b> touche la peau en aval des coudes et des genoux et le visage ; elle s’associe souvent aux anticorps anticentromère, à la calcinose, aux télangiectasies et, tardivement, à une hypertension artérielle pulmonaire. L’ancien acronyme CREST la résume. La forme <b>diffuse</b> touche aussi le tronc et la racine des membres, évolue plus vite et expose davantage à la pneumopathie interstitielle et à la crise rénale.</p>
<div class="lab">Classification</div><p>Critères ACR/EULAR 2013 : 9 points ou plus. L’épaississement des doigts dépassant les articulations métacarpophalangiennes suffit seul. Les critères ne s’appliquent pas si un autre diagnostic explique mieux les signes.</p>
<div class="lab">Dépistage d’organe</div><p>Après le diagnostic, le patient est suivi en centre : échocardiographie et épreuves fonctionnelles respiratoires avec diffusion du monoxyde de carbone pour l’hypertension pulmonaire, scanner thoracique pour la pneumopathie interstitielle, pression artérielle et créatinine pour la crise rénale.</p></template>

<template data-pop="i73-koenig" data-title="Cohorte de Koenig et al. (Montréal, 2008)">
<div class="lab">Plan</div><p>Étude prospective de 586 patients adressés pour un phénomène de Raynaud sans connectivite définie, suivis pendant 3 197 années-patients. Capillaroscopie et anticorps spécifiques de la sclérodermie (anticentromère, anti-Th/To, anti-topo-isomérase I, anti-ARN polymérase III) au départ.</p>
<div class="lab">Résultats</div><p>74 patients, soit 12,6 %, ont développé une sclérodermie systémique définie. La dilatation des capillaires, la perte de capillaires et les anticorps spécifiques prédisaient chacun cette évolution de façon indépendante. Parmi les patients qui avaient à la fois un anticorps spécifique et une capillaroscopie anormale, 79,5 % avaient une sclérodermie définie au suivi ; ces patients avaient un risque 60 fois plus élevé.</p>
<div class="lab">Limites</div><p>Les patients venaient d’un centre spécialisé : la proportion d’évolution est plus faible en médecine de premier recours. L’étude démontre une valeur pronostique, pas un effet d’un traitement précoce.</p>
<div class="lab">Conséquence pratique</div><p>Capillaroscopie et anticorps se demandent ensemble. Leur normalité conjointe est rassurante ; leur anomalie conjointe impose un suivi rapproché en rhumatologie.</p></template>

<template data-pop="i73-lejoncour" data-title="Cohorte française de thromboangéite oblitérante (Le Joncour et al., 2018)">
<div class="lab">Plan</div><p>Étude rétrospective multicentrique de 224 patients répondant aux critères de Papa, publiée dans le Journal of the American Heart Association en 2018.</p>
<div class="lab">Résultats</div><p>Âge médian au diagnostic de 38,5 ans ; 23,8 % de femmes ; 81,7 % de patients décrits comme blancs. Après 5,7 ans de suivi moyen, 58,9 % des patients avaient eu un événement vasculaire, 21,4 % une amputation, 1,4 % étaient décédés. La survie sans amputation était de 85 % à 5 ans, 74 % à 10 ans, 66 % à 15 ans. L’infection du membre au diagnostic était associée à l’amputation (rapport de risque 12,1). L’arrêt du tabac était associé à un risque d’amputation plus faible.</p>
<div class="lab">Limites</div><p>Étude observationnelle : l’association avec l’arrêt du tabac ne prouve pas à elle seule la causalité, mais elle concorde avec l’ensemble des séries et avec le mécanisme.</p></template>

<template data-pop="i73-mnemo" data-title="Six familles de causes secondaires (aide pédagogique)">
<p><small>Aide pédagogique, non critère officiel.</small></p>
<p>Le médecin passe en revue six familles, dans l’ordre de leur fréquence en consultation spécialisée : <b>connectivites</b> ; <b>artères obstruées</b> (thromboangéite, athérosclérose, embolie) ; <b>travail et mécanique</b> (vibrations, marteau hypothénarien, défilé thoracobrachial) ; <b>médicaments et toxiques</b> ; <b>sang</b> (cryoglobulines, agglutinines froides, paraprotéines) ; <b>hormones et cancers</b> (hypothyroïdie, syndrome paranéoplasique).</p>
<p>La question clé de chaque famille est simple : signes de connectivite ? pouls et symétrie ? métier et loisirs ? liste des médicaments ? purpura ou anémie ? signes généraux ?</p></template>

<template data-pop="i73-ulcere" data-title="Ulcère digital ischémique">
<div class="lab">Définition</div><p>Perte de substance de la pulpe ou de la face dorsale d’un doigt, causée par une ischémie. Les ulcères pulpaires de la sclérodermie résultent de l’atteinte des petites artères ; les ulcères en regard des articulations résultent souvent de la tension d’une peau épaissie sur un relief osseux.</p>
<div class="lab">Signification</div><p>Un ulcère digital exclut la forme primaire et signe une maladie de la paroi artérielle. Il vaut 2 points dans les critères ACR/EULAR 2013 ; une cicatrice pulpaire en creux en vaut 3.</p>
<div class="lab">Complications</div><p>Douleur intense, infection, ostéite de la phalange distale, nécrose sèche, amputation spontanée de la pulpe.</p>
<div class="lab">Prise en charge</div><p>Soins locaux spécialisés, antalgie suffisante, recherche d’une infection, traitement vasodilatateur intensifié selon l’EULAR 2023 : inhibiteur de la phosphodiestérase de type 5 et/ou iloprost ; bosentan si les ulcères récidivent.</p>
<div class="lab">Piège</div><p>Un ulcère qui ne cicatrise pas malgré le traitement fait chercher une calcinose sous-jacente, une infection osseuse ou une occlusion d’une artère plus proximale.</p></template>

<template data-pop="i73-capillaro" data-title="Capillaroscopie périunguéale">
<div class="lab">Principe</div><p>Observation au microscope des anses capillaires du repli proximal de l’ongle, couchées parallèlement à la peau. Une goutte d’huile rend la peau transparente. La vidéocapillaroscopie, avec un grossissement d’environ 200 fois, est la méthode de référence ; le dermatoscope sert au dépistage.</p>
<div class="lab">Normal</div><p>Chez l’adulte, au moins 7 anses par millimètre, fines, régulières, en épingle à cheveux.</p>
<div class="lab">Aspect sclérodermique</div><p>Selon l’algorithme rapide du groupe d’étude EULAR (2020) : capillaires géants, d’au moins 50 µm, et/ou perte de capillaires, associés à des formes anormales. Les autres anomalies isolées sont non spécifiques.</p>
<div class="lab">Valeur</div><p>Une capillaroscopie normale est l’un des critères de la forme primaire. Un aspect sclérodermique, associé à un anticorps spécifique, prédit fortement l’évolution vers une sclérodermie (Koenig et al., 2008).</p>
<div class="lab">Limites</div><p>L’interprétation dépend de l’expérience de l’opérateur. Les traumatismes du repli de l’ongle créent de faux aspects. Une capillaroscopie normale n’exclut pas une connectivite sans atteinte microvasculaire, comme certaines formes de lupus.</p></template>

<template data-pop="i73-aan" data-title="Anticorps antinucléaires (immunofluorescence sur cellules HEp-2)">
<div class="lab">Technique</div><p>Le sérum du patient est déposé sur des cellules humaines en culture (lignée HEp-2). Les anticorps qui se fixent aux noyaux sont révélés par un anticorps marqué fluorescent. Le laboratoire rend un titre, la plus forte dilution encore positive, et un aspect.</p>
<div class="lab">Interprétation</div><p>Le consensus de 2014 admet dans la forme primaire des anticorps négatifs ou de titre bas, par exemple 1:40. Un titre élevé, un aspect centromère ou nucléolaire, orientent vers une sclérodermie et justifient les anticorps spécifiques.</p>
<div class="lab">Piège</div><p>Des anticorps antinucléaires à titre bas ou modéré existent chez une partie des sujets sains, plus souvent chez la femme et le sujet âgé. Leur présence isolée ne prouve aucune maladie.</p></template>
