
<!-- ===== FENÊTRES I73 : clinique, causes, examen, urgences, autres maladies ===== -->
<template data-pop="i73-atcd-fam" data-title="Histoire familiale">
<div class="lab">Valeur</div><p>Le phénomène de Raynaud primaire est souvent familial : une mère ou une sœur atteinte est fréquente. Cette donnée oriente vers la forme primaire, sans la prouver.</p>
<div class="lab">Piège</div><p>Une histoire familiale de connectivite oriente au contraire vers une forme secondaire, car la prédisposition aux maladies auto-immunes est elle aussi en partie familiale. Le cas des deux sœurs montre que deux membres d’une famille peuvent avoir des formes différentes.</p></template>

<template data-pop="i73-tabac" data-title="Tabac, nicotine et artères digitales">
<div class="lab">Mécanisme</div><p>La nicotine stimule la libération de catécholamines et contracte les artères cutanées. La fumée lèse l’endothélium et favorise la thrombose. Dans la thromboangéite oblitérante, le tabac est le facteur principal : la maladie survient presque toujours chez des fumeurs et progresse tant que l’exposition continue.</p>
<div class="lab">Cannabis</div><p>Des séries de cas décrivent des artérites distales chez des consommateurs de cannabis, souvent aussi fumeurs de tabac. Le lien est une association, sans mécanisme démontré.</p>
<div class="lab">Conséquence pratique</div><p>L’arrêt complet est demandé dans toute forme secondaire et dans la thromboangéite oblitérante, avec un accompagnement structuré. Réduire la consommation ne suffit pas.</p></template>

<template data-pop="i73-vibr" data-title="Syndrome des vibrations main-bras et marteau hypothénarien">
<div class="lab">Syndrome des vibrations main-bras</div><p>L’usage prolongé d’outils vibrants (marteau-piqueur, tronçonneuse, meuleuse, perforateur) lèse les artères digitales et les nerfs. Il provoque un phénomène de Raynaud, souvent limité aux doigts les plus exposés, et des troubles sensitifs. Il touche surtout la main qui tient l’outil.</p>
<div class="lab">Syndrome du marteau hypothénarien</div><p>L’habitude de frapper avec la paume (carreleurs, mécaniciens, menuisiers, certains sportifs) traumatise l’artère ulnaire contre le crochet de l’hamatum. Il en résulte une thrombose ou un anévrisme de l’artère ulnaire, puis des embolies vers l’annulaire et l’auriculaire. L’examen trouve un test d’Allen anormal pour l’artère ulnaire ; l’écho-Doppler montre la lésion.</p>
<div class="lab">Conséquence pratique</div><p>Ces atteintes sont des maladies professionnelles à déclarer à l’assureur-accidents, en Suisse le plus souvent la Suva. La réduction de l’exposition est la première mesure ; un anévrisme ulnaire avec embolies peut nécessiter une chirurgie.</p></template>

<template data-pop="i73-medic" data-title="Médicaments et substances qui favorisent le phénomène de Raynaud">
<div class="lab">Mécanisme</div><p>Ils contractent les artères directement (dérivés de l’ergot, triptans), augmentent l’activité sympathique (sympathomimétiques décongestionnants, amphétamines, méthylphénidate, cocaïne, nicotine) ou lèsent l’endothélium (certains anticancéreux comme la bléomycine et le cisplatine).</p>
<div class="lab">Bêtabloquants</div><p>Ils sont classiquement cités. Une méta-analyse en réseau (Khouri et al., 2016) trouve une vasoconstriction périphérique chez 7 % des patients traités contre 4,6 % des témoins, surtout avec l’aténolol et le propranolol. Un bêtabloquant indispensable n’est pas arrêté pour ce seul motif.</p>
<div class="lab">Conséquence pratique</div><p>La liste des médicaments, y compris les sprays nasaux et les stimulants, fait partie de toute anamnèse. Un début de crises après une prescription fait discuter un remplacement.</p></template>

<template data-pop="i73-cryo" data-title="Cryoglobulines et agglutinines froides">
<div class="lab">Cryoglobulines</div><p>Immunoglobulines qui précipitent au-dessous de 37 °C. Le type I, monoclonal, s’associe à un myélome ou à une macroglobulinémie ; il obstrue les petits vaisseaux et donne des nécroses au froid. Les types II et III, mixtes, forment des complexes immuns et produisent une vascularite : purpura des jambes, arthralgies, neuropathie, glomérulonéphrite. L’hépatite C en est la cause principale.</p>
<div class="lab">Agglutinines froides</div><p>Anticorps, le plus souvent de type IgM, qui agglutinent les globules rouges au froid. Ils donnent une acrocyanose et une anémie hémolytique, après une infection à mycoplasme ou dans un lymphome.</p>
<div class="lab">Prélèvement</div><p>Le sang destiné à la recherche de cryoglobulines est prélevé, transporté et coagulé à 37 °C. Un tube refroidi donne un faux négatif.</p>
<div class="lab">Conséquence pratique</div><p>Une nécrose au froid avec purpura ou une acrocyanose avec anémie ne se traite pas par vasodilatateur seul : la cause hématologique ou infectieuse se traite.</p></template>

<template data-pop="i73-s-engourd" data-title="Engourdissement et maladresse pendant la crise">
<p>L’ischémie prive les fibres nerveuses sensitives d’oxygène ; leur conduction se ralentit puis s’interrompt. Le patient décrit des doigts engourdis, maladroits, incapables de boutonner un vêtement. Ces symptômes disparaissent avec la crise. Des fourmillements nocturnes permanents, sans changement de couleur, orientent plutôt vers un syndrome du canal carpien.</p></template>

<template data-pop="i73-e-pa" data-title="Pression artérielle aux deux bras">
<div class="lab">Technique</div><p>La pression systolique se mesure aux deux bras, au repos, avec un brassard adapté.</p>
<div class="lab">Interprétation</div><p>Une différence de plus de 15 mmHg suggère une sténose de l’artère subclavière du côté le plus bas. Cette sténose peut expliquer un phénomène de Raynaud unilatéral ou des embolies digitales.</p>
<div class="lab">Conséquence pratique</div><p>Une asymétrie fait demander un écho-Doppler des artères subclavières ; la mesure de la pression se fait ensuite sur le bras le plus haut.</p></template>

<template data-pop="i73-e-pouls" data-title="Palpation des pouls distaux">
<p>Le médecin palpe les pouls radial et ulnaire au poignet, puis les pouls pédieux et tibial postérieur. Un pouls absent signe une obstruction en amont, ce qui exclut un phénomène primaire pur. Le pouls ulnaire est plus difficile à percevoir que le radial ; son absence isolée se vérifie par le test d’Allen et l’écho-Doppler. Au pied, l’absence des pouls distaux avec des pouls fémoraux et poplités normaux oriente vers une atteinte distale comme la thromboangéite oblitérante.</p></template>

<template data-pop="i73-e-allen" data-title="Test d’Allen">
<div class="lab">Technique</div><p>Le patient serre le poing pour vider la main. L’examinateur comprime les artères radiale et ulnaire au poignet. Le patient ouvre la main, qui reste pâle. L’examinateur libère une artère et observe la recoloration ; puis il recommence en libérant l’autre artère.</p>
<div class="lab">Interprétation</div><p>Une main qui se recolore en quelques secondes indique une artère perméable et des arcades fonctionnelles. Une recoloration absente ou très lente indique une occlusion de l’artère libérée ou une arcade incomplète. Un test anormal pour l’artère ulnaire chez un travailleur manuel oriente vers un marteau hypothénarien ; chez un jeune fumeur, vers une thromboangéite oblitérante.</p>
<div class="lab">Limites</div><p>La main trop ouverte ou l’hyperextension du poignet donnent de faux résultats. Le seuil de temps de recoloration varie selon les auteurs ; l’écho-Doppler confirme toute anomalie.</p></template>

<template data-pop="i73-e-capdermato" data-title="Repli de l’ongle au dermatoscope">
<p>Le dermatoscope du cabinet, avec une goutte d’huile ou de gel, montre les anses capillaires du repli de l’ongle à un grossissement d’environ 10 fois. Il suffit pour voir des capillaires géants ou de grandes zones sans capillaire. Une image normale au dermatoscope ne remplace pas une vidéocapillaroscopie si la suspicion clinique est forte, car les anomalies discrètes lui échappent.</p></template>

<template data-pop="i73-e-boudin" data-title="Doigts boudinés">
<div class="lab">Description</div><p>Les doigts sont gonflés de façon diffuse, en saucisse, la peau est tendue et les plis des articulations s’effacent. Le patient remarque souvent que ses bagues ne passent plus le matin.</p>
<div class="lab">Mécanisme</div><p>Il s’agit de la phase œdémateuse précoce de la sclérodermie, avant la fibrose.</p>
<div class="lab">Valeur</div><p>Les doigts boudinés valent 2 points dans les critères ACR/EULAR 2013. Chez un patient ayant un phénomène de Raynaud, ils imposent une capillaroscopie et la recherche des anticorps spécifiques.</p>
<div class="lab">Piège</div><p>Une dactylite de spondyloarthrite ou un œdème d’origine veineuse ou lymphatique peuvent ressembler à des doigts boudinés ; la dactylite touche souvent un seul doigt.</p></template>

<template data-pop="i73-e-sclerodact" data-title="Sclérodactylie">
<p>La peau des doigts est épaissie, indurée, adhérente aux plans profonds ; elle ne se plisse plus quand on la pince. Elle limite la flexion des doigts. Dans les critères ACR/EULAR 2013, une sclérodactylie limitée aux doigts, entre les articulations métacarpophalangiennes et interphalangiennes proximales, vaut 4 points. Un épaississement qui dépasse les articulations métacarpophalangiennes des deux mains suffit seul à classer une sclérodermie (9 points).</p></template>

<template data-pop="i73-e-telang" data-title="Télangiectasies de la sclérodermie">
<p>Petites taches rouges, planes, en nappe ou arrondies, sur le visage, les lèvres, les paumes et les doigts. Elles sont faites de capillaires dilatés et s’effacent à la pression. Elles s’associent surtout à la forme cutanée limitée et valent 2 points dans les critères ACR/EULAR 2013. Leur présence chez un patient ayant un phénomène de Raynaud fait chercher les autres signes de sclérodermie.</p></template>

<template data-pop="i73-e-tos" data-title="Défilé thoracobrachial">
<div class="lab">Mécanisme</div><p>L’artère subclavière, la veine subclavière et le plexus brachial passent entre la clavicule, la première côte et les muscles scalènes. Une côte cervicale ou une anomalie musculaire peut comprimer l’artère lors de l’élévation du bras. La compression chronique crée une sténose, une dilatation après la sténose et parfois un thrombus qui envoie des emboles vers les doigts.</p>
<div class="lab">Examen</div><p>Le médecin palpe le pouls radial bras pendant, puis en abduction et rotation externe. La disparition du pouls est fréquente chez des sujets sains : elle n’a de valeur qu’avec des symptômes concordants. L’écho-Doppler dynamique et la radiographie à la recherche d’une côte cervicale complètent le bilan.</p>
<div class="lab">Conséquence</div><p>Un phénomène de Raynaud unilatéral avec des embolies digitales chez un sujet jeune fait chercher un défilé thoracobrachial artériel, qui peut relever de la chirurgie.</p></template>

<template data-pop="i73-e-souffle" data-title="Souffle subclavier ou axillaire">
<p>Un souffle systolique entendu au-dessus ou au-dessous de la clavicule traduit un flux turbulent à travers une sténose de l’artère subclavière ou axillaire. Il oriente vers une athérosclérose chez le sujet âgé, vers une artérite de Takayasu ou un défilé thoracobrachial chez le sujet jeune. Il s’accompagne souvent d’une asymétrie de pression entre les deux bras.</p></template>

<template data-pop="i73-embolie" data-title="Embolie digitale">
<div class="lab">Présentation</div><p>Un ou deux doigts deviennent brutalement froids, douloureux, pâles ou violacés, et le restent. Des taches violacées, des hémorragies en flammèche sous les ongles ou un orteil bleu peuvent l’accompagner.</p>
<div class="lab">Sources</div><p>Le cœur (fibrillation auriculaire, endocardite, thrombus ventriculaire), une plaque ou un anévrisme de l’aorte ou de l’artère subclavière, un anévrisme de l’artère ulnaire du marteau hypothénarien, un défilé thoracobrachial.</p>
<div class="lab">Conséquence pratique</div><p>Une embolie n’est pas un phénomène de Raynaud. Elle impose une recherche de source le jour même : ECG, échocardiographie, écho-Doppler et imagerie des artères en amont, hémocultures si de la fièvre fait craindre une endocardite.</p></template>

<template data-pop="i73-ischcrit" data-title="Ischémie digitale critique">
<div class="lab">Définition clinique</div><p>Douleur ischémique permanente d’un doigt, persistant entre les crises et après réchauffement, avec ou sans ulcère ou nécrose. Elle traduit une occlusion fixe, souvent un thrombus formé sur une artère digitale déjà rétrécie.</p>
<div class="lab">Évaluation</div><p>Examen des pouls et du test d’Allen, écho-Doppler, recherche d’une source embolique, bilan d’une vascularite ou d’une cryoglobulinémie, recherche d’une infection.</p>
<div class="lab">Traitement</div><p>Hospitalisation, réchauffement, antalgie, arrêt de tout vasoconstricteur et du tabac, iloprost intraveineux. Une anticoagulation brève se discute si une occlusion thrombotique récente est démontrée ; cette décision repose sur un faible niveau de preuve. Le chirurgien intervient en cas de nécrose infectée ou si un geste de revascularisation est possible.</p></template>

<template data-pop="i73-crs" data-title="Crise rénale sclérodermique">
<div class="lab">Définition</div><p>Insuffisance rénale aiguë avec hypertension artérielle souvent sévère et d’apparition brutale, chez un patient atteint de sclérodermie, surtout dans la forme diffuse et en présence d’anticorps anti-ARN polymérase III. Elle résulte d’une atteinte des petites artères rénales avec activation de la rénine.</p>
<div class="lab">Facteurs associés</div><p>Les corticoïdes à forte dose sont associés à un risque accru dans des études observationnelles.</p>
<div class="lab">Traitement</div><p>Un inhibiteur de l’enzyme de conversion est la base du traitement, car il bloque le système rénine-angiotensine activé. La prise en charge est hospitalière, avec un néphrologue.</p></template>

<template data-pop="i73-htap" data-title="Hypertension artérielle pulmonaire de la sclérodermie">
<p>Les mêmes lésions des petites artères qui donnent le phénomène de Raynaud touchent les artérioles pulmonaires. La résistance pulmonaire augmente et le ventricule droit s’épuise. L’hypertension artérielle pulmonaire survient surtout dans la forme cutanée limitée, souvent tardivement. Elle se dépiste en centre par l’échocardiographie, les épreuves fonctionnelles respiratoires avec diffusion du monoxyde de carbone et le NT-proBNP, puis se confirme par cathétérisme cardiaque droit. L’EULAR 2023 recommande en première ligne l’association d’un inhibiteur de la phosphodiestérase de type 5 et d’un antagoniste des récepteurs de l’endothéline.</p></template>

<template data-pop="i73-mamelon" data-title="Vasospasme du mamelon pendant l’allaitement">
<p>Le mamelon peut blanchir puis bleuir après la tétée, avec une douleur brûlante ou pulsatile. Ce vasospasme survient surtout chez les femmes qui ont un phénomène de Raynaud. Il est souvent confondu avec une mycose ou une mauvaise prise du sein. La protection contre le froid après la tétée, l’application de chaleur et la correction de la position soulagent la plupart des patientes. Un traitement médicamenteux éventuel se décide avec un spécialiste, en vérifiant la compatibilité avec l’allaitement dans l’information professionnelle.</p></template>

<template data-pop="i73-ips" data-title="Index de pression systolique cheville-bras">
<div class="lab">Technique</div><p>La pression systolique est mesurée au Doppler aux artères tibiale postérieure et pédieuse, puis divisée par la pression systolique humérale la plus élevée des deux bras.</p>
<div class="lab">Interprétation</div><p>Une valeur de 1,00 à 1,40 est normale. Une valeur de 0,90 ou moins signe une artériopathie oblitérante des membres inférieurs. Une valeur supérieure à 1,40 traduit des artères incompressibles, calcifiées, et rend l’index non interprétable.</p>
<div class="lab">Dans ce chapitre</div><p>Un index abaissé chez un jeune fumeur avec des artères proximales normales oriente vers une thromboangéite oblitérante. Un index normal au repos chez un sportif qui boite n’exclut pas une sténose : un test d’effort est alors nécessaire.</p></template>

<template data-pop="i73-acrocya" data-title="Acrocyanose">
<div class="lab">Définition</div><p>Coloration bleu violacé permanente, symétrique et indolore des mains, parfois des pieds, aggravée par le froid. Les mains sont froides et souvent moites. Les pouls sont normaux et il n’y a ni phase blanche ni ulcère.</p>
<div class="lab">Mécanisme</div><p>Vasoconstriction persistante des artérioles cutanées associée à une dilatation des veinules. Le sang circule lentement dans les vaisseaux superficiels et s’y désature.</p>
<div class="lab">Formes</div><p>La forme primaire touche surtout la femme jeune et mince ; elle est bénigne. Une forme secondaire se discute devant un début tardif, une asymétrie, une douleur ou des signes généraux : anorexie mentale, agglutinines froides, cryoglobulines, néoplasie, médicaments.</p>
<div class="lab">Conséquence pratique</div><p>La forme primaire n’exige qu’une explication et une protection contre le froid. La saturation en oxygène normale distingue l’acrocyanose d’une cyanose centrale.</p></template>

<template data-pop="i73-erm" data-title="Érythromélalgie">
<div class="lab">Définition</div><p>Accès de douleur brûlante, de rougeur et de chaleur des extrémités, surtout des pieds. Les accès sont déclenchés par la chaleur, l’effort, la station debout prolongée ; ils sont soulagés par le froid et la surélévation.</p>
<div class="lab">Diagnostic</div><p>Il est clinique, sans critère consensuel. Une photographie pendant l’accès est utile, car la peau peut être normale à l’examen.</p>
<div class="lab">Causes</div><p>Forme primaire, parfois héréditaire (gène SCN9A). Forme secondaire : néoplasies myéloprolifératives, médicaments (nifédipine, vérapamil, bromocriptine), neuropathies des petites fibres, connectivites.</p>
<div class="lab">Épidémiologie</div><p>Incidence de 1,3 cas pour 100 000 personnes par an à Olmsted County ; trois fois plus fréquente chez la femme (Reed et Davis, 2009).</p>
<div class="lab">Piège</div><p>L’immersion prolongée dans l’eau glacée, que les patients pratiquent pour se soulager, provoque macération, ulcères et infections.</p></template>

<template data-pop="i73-erm-nmp" data-title="Érythromélalgie et néoplasies myéloprolifératives">
<div class="lab">Mécanisme</div><p>Dans la thrombocythémie essentielle et la polyglobulie de Vaquez, des plaquettes activées s’agrègent dans les artérioles des extrémités. Elles y provoquent une inflammation et des occlusions, d’où la rougeur, la chaleur et la douleur, parfois une nécrose d’un orteil.</p>
<div class="lab">Diagnostic</div><p>L’hémogramme montre une thrombocytose ou une hématocrite élevée. La recherche d’une mutation de JAK2, en particulier JAK2 V617F, puis l’avis d’un hématologue complètent le bilan. L’érythromélalgie peut précéder de plusieurs années le diagnostic de l’hémopathie.</p>
<div class="lab">Traitement</div><p>L’acide acétylsalicylique à faible dose soulage souvent rapidement, car il inhibe l’activation plaquettaire. Le traitement de l’hémopathie relève de l’hématologue.</p></template>

<template data-pop="i73-buerger" data-title="Thromboangéite oblitérante : synthèse">
<div class="lab">Définition</div><p>Maladie inflammatoire segmentaire, non athéromateuse, des artères de petit et moyen calibre et des veines des extrémités, presque toujours liée au tabac.</p>
<div class="lab">Terrain</div><p>Adulte de moins de 45 ans, fumeur ; âge médian de 38,5 ans dans la cohorte française de 2018, avec près d’un quart de femmes.</p>
<div class="lab">Clinique</div><p>Ischémie distale des membres inférieurs et souvent supérieurs, claudication de la voûte plantaire, ulcères et nécroses des orteils et des doigts, phénomène de Raynaud, thrombophlébites superficielles migratrices.</p>
<div class="lab">Diagnostic</div><p>Critères d’Olin : terrain, ischémie distale documentée, exclusion des autres causes, imagerie compatible.</p>
<div class="lab">Traitement et pronostic</div><p>Arrêt complet du tabac ; iloprost pour la douleur de repos et les ulcères ; soins des plaies. Le risque d’amputation reste élevé : 34 % à 15 ans dans la cohorte française.</p></template>

<template data-pop="i73-buerger-histo" data-title="Lésion histologique de la thromboangéite oblitérante">
<div class="lab">Phase aiguë</div><p>Thrombus occlusif très riche en cellules inflammatoires, avec des micro-abcès de polynucléaires et parfois des cellules géantes. La paroi est infiltrée, mais sa structure est conservée et la limitante élastique interne reste intacte.</p>
<div class="lab">Phase chronique</div><p>Le thrombus s’organise et se recanalise ; une fibrose englobe l’artère, la veine et le nerf voisins.</p>
<div class="lab">Valeur diagnostique</div><p>La conservation de la limitante élastique interne distingue la maladie d’une vascularite nécrosante, qui détruit la paroi, et de l’athérosclérose, qui épaissit l’intima par une plaque. La biopsie est rarement faite, car elle porte sur un tissu ischémique qui cicatrise mal.</p></template>

<template data-pop="i73-claud-plant" data-title="Claudication de la voûte plantaire">
<p>La douleur à la marche siège dans la voûte du pied, et non dans le mollet. Elle traduit une obstruction des artères tibiales distales et plantaires, territoire typique de la thromboangéite oblitérante. Le mollet reste indolore, car les artères de la jambe sont perméables plus haut. Elle est souvent prise pour une fasciite plantaire ou un trouble orthopédique, ce qui retarde le diagnostic chez le jeune fumeur.</p></template>

<template data-pop="i73-tvs-migr" data-title="Thrombophlébite superficielle migratrice">
<p>Cordons veineux superficiels rouges, chauds et douloureux, qui apparaissent successivement à différents endroits des membres. Dans la thromboangéite oblitérante, ils traduisent l’atteinte inflammatoire des veines. Leur présence chez un jeune fumeur avec une ischémie distale renforce le diagnostic. Une thrombophlébite migratrice fait aussi chercher un cancer, en particulier du pancréas, chez le sujet plus âgé, et une maladie de Behçet.</p></template>

<template data-pop="i73-crit-olin" data-title="Critères d’Olin de la thromboangéite oblitérante (2000)">
<div class="lab">Source</div><p>Olin, Thromboangiitis obliterans (Buerger’s disease), New England Journal of Medicine 2000.</p>
<div class="lab">Critères</div><ul><li>Âge inférieur à 45 ans.</li><li>Tabagisme actuel ou récent.</li><li>Ischémie distale des membres (claudication, douleur de repos, ulcère ou gangrène) documentée par des examens non invasifs.</li><li>Exclusion d’une maladie auto-immune, d’un état d’hypercoagulabilité et d’un diabète.</li><li>Exclusion d’une source embolique proximale par échocardiographie et imagerie artérielle.</li><li>Aspect artériographique compatible dans les membres atteints et non atteints.</li></ul>
<div class="lab">Autres jeux de critères</div><p>Les critères de Shionoya et le score de Papa sont aussi utilisés ; la cohorte française de 2018 a retenu ceux de Papa. Aucun jeu de critères n’a été validé contre un examen de référence, car la biopsie est rarement faite.</p>
<div class="lab">Piège</div><p>Un diabète ou une maladie auto-immune n’excluent pas une thromboangéite, mais ils rendent le diagnostic incertain : l’atteinte distale peut alors leur être attribuée.</p></template>

<template data-pop="i73-angio-buerger" data-title="Imagerie artérielle de la thromboangéite oblitérante">
<p>L’imagerie montre des artères proximales lisses, sans plaque ni calcification, et des occlusions segmentaires des artères distales de la jambe, du pied, de l’avant-bras et de la main. Des collatérales fines et sinueuses contournent les occlusions : elles donnent l’aspect « en tire-bouchon ». Cet aspect n’est pas spécifique : il existe aussi dans la sclérodermie, le lupus et d’autres artérites distales. Il soutient le diagnostic dans le bon contexte clinique.</p></template>

<template data-pop="i73-nicotine" data-title="Substituts nicotiniques et thromboangéite oblitérante">
<div class="lab">Le problème</div><p>La nicotine elle-même contracte les artères et pourrait entretenir l’activité de la maladie. Plusieurs auteurs recommandent donc d’éviter toute forme de nicotine, y compris les substituts.</p>
<div class="lab">L’incertitude</div><p>Aucun essai n’a comparé l’évolution de la maladie sous substituts nicotiniques et sans nicotine. Le risque d’une reprise du tabac, qui expose à la fumée, peut être plus grave qu’une substitution transitoire.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin privilégie une aide à l’arrêt sans nicotine lorsqu’elle est possible ; si le patient ne parvient pas à arrêter sans substitut, la décision est partagée et documentée, avec un objectif d’arrêt complet de la nicotine.</p></template>

<template data-pop="i73-g-scn9a" data-title="SCN9A et canal Nav1.7">
<div class="lab">Fonction normale</div><p>Le canal sodique Nav1.7 est exprimé dans les neurones nociceptifs et sympathiques. Il s’ouvre lors de petites dépolarisations et les amplifie jusqu’au seuil du potentiel d’action : il règle la sensibilité du nocicepteur.</p>
<div class="lab">Érythromélalgie héréditaire</div><p>Des variants avec gain de fonction du gène SCN9A facilitent l’ouverture du canal (Yang et al., 2004, première description). Les nocicepteurs deviennent hyperexcitables, surtout à la chaleur, d’où la douleur brûlante. La transmission est autosomique dominante.</p>
<div class="lab">Conséquence pratique</div><p>Une érythromélalgie de l’enfant, surtout familiale, fait discuter un génotypage en centre spécialisé. Certains variants répondent à des bloqueurs du canal sodique, mexilétine ou carbamazépine, ce qui fait de la génétique un outil de choix thérapeutique.</p></template>
