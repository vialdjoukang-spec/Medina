
<!-- ===== FENÊTRES I73 : monographies ===== -->
<template data-pop="i73-d-ica" data-title="Monographie — Inhibiteurs calciques dihydropyridiniques (nifédipine)">
<div class="lab">Mécanisme</div><p>Blocage du canal calcique de type L des cellules musculaires lisses artérielles. Moins de calcium entre dans la cellule, la chaîne légère de la myosine est moins phosphorylée, et l’artère se relâche. Les dihydropyridines agissent surtout sur les vaisseaux et peu sur le cœur.</p>
<div class="lab">Preuves</div><p>Revue Cochrane 2017 (Rirash et al.) : 38 essais, 982 participants, surtout de courte durée et souvent croisés. Les inhibiteurs calciques réduisaient la fréquence des crises de 2,9 par semaine après exclusion d’un essai aberrant, et la sévérité de 0,62 cm sur une échelle de 10 cm. L’effet semblait plus grand à dose élevée et dans la forme primaire. L’EULAR 2023 les place en première ligne de la sclérodermie.</p>
<div class="lab">Posologie</div><p>Nifédipine à libération prolongée : 30 mg une fois par jour, augmentation progressive selon la tolérance, maximum de 120 mg par jour selon l’information professionnelle de l’Adalat 30 mg à libération prolongée (Bayer, 2025, texte portugais). Le comprimé s’avale entier, sans le croquer ni le couper. Le texte suisse n’a pas été relu pour ce chapitre ; le phénomène de Raynaud est une utilisation hors indication.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, bouffées de chaleur, vertiges, palpitations par tachycardie réflexe, œdèmes des chevilles, hypotension. Les œdèmes viennent d’une dilatation artériolaire qui augmente la pression capillaire ; les diurétiques les corrigent mal.</p>
<div class="lab">Contre-indications et précautions</div><p>Hypotension, choc cardiogénique, rétrécissement aortique serré, syndrome coronarien aigu récent. Prudence dans l’insuffisance hépatique, car la nifédipine est métabolisée par le foie. Interactions par le CYP3A4.</p>
<div class="lab">Surveillance</div><p>Pression artérielle, fréquence cardiaque, œdèmes ; efficacité jugée sur un hiver.</p></template>

<template data-pop="i73-d-ipde5" data-title="Monographie — Inhibiteurs de la phosphodiestérase de type 5">
<div class="lab">Mécanisme</div><p>Le monoxyde d’azote endothélial produit du GMPc dans le muscle lisse ; la phosphodiestérase de type 5 le dégrade. L’inhibiteur prolonge donc la relaxation artérielle. Il agit d’autant mieux que l’endothélium produit encore du monoxyde d’azote.</p>
<div class="lab">Preuves</div><p>Méta-analyse de six essais randomisés, 224 patients (Roustit et al., 2013) : amélioration du score de sévérité, diminution de la fréquence et de la durée des crises du phénomène de Raynaud secondaire. L’EULAR 2023 recommande de les envisager dans le phénomène de Raynaud et dans les ulcères digitaux de la sclérodermie.</p>
<div class="lab">Posologie</div><p>Sildénafil : la dose de l’hypertension artérielle pulmonaire est de 20 mg trois fois par jour (Revatio). Dans le phénomène de Raynaud, l’emploi est hors indication et les doses des essais varient ; la prescription se fait en centre spécialisé.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, bouffées vasomotrices, congestion nasale, dyspepsie, troubles visuels transitoires, hypotension.</p>
<div class="lab">Contre-indications</div><p>Association aux dérivés nitrés et aux donneurs de monoxyde d’azote, association au riociguat, hypotension sévère, perte de vision par neuropathie optique ischémique antérieure.</p></template>

<template data-pop="i73-d-ilo" data-title="Monographie — Iloprost par voie intraveineuse">
<div class="lab">Mécanisme</div><p>Analogue stable de la prostacycline. Il active le récepteur de la prostacycline, augmente l’AMPc, dilate les artérioles et inhibe l’agrégation plaquettaire.</p>
<div class="lab">Preuves</div><p>Thromboangéite oblitérante : essai randomisé en double aveugle de Fiessinger et Schäfer (1990), 133 patients analysés. Après 21 à 28 jours, 85 % des patients sous iloprost avaient une cicatrisation ou un soulagement de la douleur ischémique, contre 17 % sous aspirine ; à six mois, 88 % contre 21 %. Sclérodermie : l’EULAR 2023 recommande de l’envisager dans le phénomène de Raynaud sévère après échec du traitement oral et dans les ulcères digitaux.</p>
<div class="lab">Posologie</div><p>Selon l’information professionnelle allemande de l’Ilomedin : perfusion intraveineuse de 6 heures par jour ; début à 0,5 ng/kg/min pendant 30 minutes, paliers de 0,5 ng/kg/min environ toutes les 30 minutes jusqu’à la dose tolérée, au maximum 2,0 ng/kg/min. Les 2 à 3 premiers jours servent à trouver cette dose. Le statut d’autorisation suisse n’a pas pu être confirmé lors de la rédaction (08.10.2026).</p>
<div class="lab">Effets indésirables</div><p>Céphalées, bouffées vasomotrices, nausées, hypotension, douleur de la mâchoire, réaction au site de perfusion. Ils dépendent de la dose et justifient la titration.</p>
<div class="lab">Précautions</div><p>Surveillance de la pression et du pouls pendant la perfusion ; risque hémorragique avec les anticoagulants et les antiagrégants. Une amputation urgente, par exemple pour une gangrène infectée, ne se retarde pas au profit d’un essai d’iloprost.</p></template>

<template data-pop="i73-d-bosentan" data-title="Monographie — Bosentan">
<div class="lab">Mécanisme</div><p>Antagoniste des récepteurs A et B de l’endothéline. Il bloque la vasoconstriction et la prolifération cellulaire induites par l’endothéline 1, surproduite par l’endothélium lésé de la sclérodermie.</p>
<div class="lab">Indication suisse</div><p>Hypertension pulmonaire (classes fonctionnelles NYHA II à IV) et réduction du nombre de nouveaux ulcères digitaux chez les adultes atteints de sclérodermie systémique avec ulcères digitaux actifs (compendium.ch, Tracleer 125 mg, consulté le 08.10.2026). Il ne guérit pas un ulcère existant plus vite ; l’EULAR 2023 le limite à la prévention de nouveaux ulcères. Le macitentan, autre molécule de la classe, a échoué dans deux essais sur les ulcères digitaux.</p>
<div class="lab">Posologie</div><p>62,5 mg deux fois par jour pendant 4 semaines, puis 125 mg deux fois par jour, indépendamment des repas (compendium.ch).</p>
<div class="lab">Contre-indications</div><p>Insuffisance hépatique modérée à sévère ; transaminases supérieures à trois fois la limite supérieure de la normale ; association à la ciclosporine ou au glibenclamide ; grossesse jusqu’à trois mois après l’arrêt ; allaitement (compendium.ch).</p>
<div class="lab">Effets indésirables et surveillance</div><p>Élévation des transaminases, dose-dépendante et réversible ; baisse de l’hémoglobine ; œdèmes ; tératogénicité. Les transaminases et l’hémoglobine se contrôlent avant et pendant le traitement selon l’information professionnelle ; une contraception fiable non uniquement hormonale est nécessaire, car le bosentan réduit l’efficacité des contraceptifs hormonaux.</p></template>

<template data-pop="i73-d-aspirine" data-title="Monographie — Acide acétylsalicylique dans l’érythromélalgie">
<div class="lab">Mécanisme</div><p>Acétylation irréversible de la cyclo-oxygénase 1 des plaquettes, qui ne produisent plus de thromboxane pendant leur durée de vie, environ 7 à 10 jours. L’activation et l’agrégation plaquettaires dans les artérioles diminuent.</p>
<div class="lab">Indication</div><p>Érythromélalgie des néoplasies myéloprolifératives (thrombocythémie essentielle, polyglobulie de Vaquez), où la réponse est souvent rapide et spectaculaire. Elle sert parfois de test diagnostique. Elle n’a pas d’effet démontré dans l’érythromélalgie primaire ni dans le phénomène de Raynaud simple.</p>
<div class="lab">Posologie</div><p>Faible dose antiagrégante, 100 mg une fois par jour avec la forme suisse courante ; l’hématologue adapte le traitement de l’hémopathie.</p>
<div class="lab">Précautions</div><p>Risque hémorragique digestif ; prudence si la thrombocytose est extrême, car un syndrome de von Willebrand acquis peut s’y associer et augmenter le risque de saignement sous aspirine.</p></template>

<template data-pop="i73-d-autres" data-title="Autres traitements de faible niveau de preuve">
<div class="lab">Fluoxétine</div><p>Inhibiteur sélectif de la recapture de la sérotonine. Un petit essai comparatif a suggéré un effet sur les crises. L’EULAR 2017 l’avait mentionnée avec une force de recommandation faible ; l’EULAR 2023 ne l’a pas réévaluée et ne formule aucune recommandation pour ou contre.</p>
<div class="lab">Losartan</div><p>Antagoniste des récepteurs de l’angiotensine II. Il a été testé dans un petit essai, avec un effet favorable ; le niveau de preuve reste faible. Il peut être choisi chez un patient qui a aussi besoin d’un traitement antihypertenseur.</p>
<div class="lab">Dérivés nitrés locaux</div><p>Appliqués sur les doigts, ils libèrent du monoxyde d’azote localement. Les céphalées limitent leur usage ; leur association aux inhibiteurs de la phosphodiestérase de type 5 est contre-indiquée.</p>
<div class="lab">Toxine botulique</div><p>Injectée à la base des doigts ou dans la paume, elle bloquerait la libération de noradrénaline et la migration des récepteurs α2C. Les essais sont petits et hétérogènes ; elle se réserve aux formes réfractaires, en centre spécialisé, hors indication autorisée.</p>
<div class="lab">Sympathectomie</div><p>La sympathectomie digitale, geste de microchirurgie autour des artères digitales, se discute dans les formes réfractaires avec ulcères. La sympathectomie thoracique est abandonnée, car son effet s’épuise souvent en quelques mois.</p></template>
