
<!-- ===== FENÊTRES I95 : symptômes, examen clinique et examens complémentaires ===== -->
<template data-pop="i95-s-vertige" data-title="Vertige orthostatique">
<div class="lab">Caractérisation</div><p>Le patient décrit une tête vide, une instabilité ou une sensation de malaise imminent, sans rotation de l’environnement. Le symptôme apparaît debout, parfois après quelques minutes, et cède en position assise ou couchée.</p>
<div class="lab">Mécanisme</div><p>La baisse du débit cérébral sous la limite de l’autorégulation réduit l’apport d’oxygène au tronc cérébral et au cortex.</p>
<div class="lab">Diagnostic différentiel</div><p>Un vertige rotatoire déclenché par les mouvements de la tête, même couché, oriente vers une cause vestibulaire. Un déséquilibre de la marche sans lien avec la position oriente vers une cause neurologique ou une neuropathie sensitive.</p></template>

<template data-pop="i95-s-visuel" data-title="Troubles visuels orthostatiques">
<div class="lab">Caractérisation</div><p>Vision floue, grisée, rétrécissement du champ visuel ou voile noir en se levant.</p>
<div class="lab">Mécanisme</div><p>La rétine et le cortex occipital, situés au-dessus du cœur, souffrent tôt de la baisse de pression de perfusion ; le cortex occipital se trouve en outre dans un territoire de jonction artérielle.</p>
<div class="lab">Valeur</div><p>Ce symptôme est très évocateur d’une cause hémodynamique lorsqu’il est bilatéral et lié à la position.</p></template>

<template data-pop="i95-s-fatigue" data-title="Fatigue et faiblesse des jambes">
<div class="lab">Mécanisme</div><p>La perfusion insuffisante du cerveau et des muscles debout réduit la tolérance à la station prolongée. Le patient écourte ses activités debout, comme la cuisine ou les courses.</p>
<div class="lab">Piège</div><p>La fatigue est peu spécifique : elle n’oriente vers l’hypotension que si elle prédomine debout et s’améliore couché. Une anémie, une hypothyroïdie, une dépression ou une maladie de Parkinson non contrôlée peuvent l’expliquer.</p></template>

<template data-pop="i95-s-cintre" data-title="Douleur « en cintre »">
<div class="lab">Caractérisation</div><p>Douleur sourde de la nuque et du haut des épaules, apparaissant debout et cédant en position couchée. Son nom vient de sa topographie, qui rappelle la forme d’un cintre à vêtements.</p>
<div class="lab">Mécanisme</div><p>Les muscles trapèzes et cervicaux, situés au-dessus du cœur, reçoivent moins de sang quand la pression debout baisse ; leur ischémie produit la douleur.</p>
<div class="lab">Valeur</div><p>Ce symptôme est assez caractéristique de l’hypotension orthostatique neurogène. Il est souvent pris à tort pour une cervicalgie mécanique.</p>
<div class="lab">Aide pédagogique</div><p>Le nom de « cintre » sert d’aide pédagogique, non de critère officiel.</p></template>

<template data-pop="i95-s-cogn" data-title="Ralentissement cognitif orthostatique">
<div class="lab">Caractérisation</div><p>Difficulté à se concentrer, lenteur de la pensée ou confusion en position debout, qui s’améliorent couché.</p>
<div class="lab">Mécanisme</div><p>La baisse du débit cérébral touche d’abord les fonctions corticales complexes, avant la perte de conscience.</p>
<div class="lab">Piège</div><p>Chez un patient atteint d’une synucléinopathie, ces fluctuations sont parfois attribuées à tort à la démence. Une mesure de pression pendant l’épisode les rattache à l’hypotension.</p></template>

<template data-pop="i95-s-chute" data-title="Chutes inexpliquées">
<div class="lab">Lien avec l’hypotension</div><p>Le sujet âgé ne se souvient souvent pas de prodromes ni d’une brève perte de connaissance : une syncope se présente alors comme une chute. L’hypotension orthostatique et post-prandiale est une cause fréquente de chutes inexpliquées.</p>
<div class="lab">Indices</div><p>Chute au lever, après un repas, après la prise des médicaments, en sortant d’un bain chaud, sans trébucher.</p>
<div class="lab">Conduite</div><p>Le test d’orthostatisme fait partie de toute évaluation de chute ; le consensus de 2017 classe les chutes inexpliquées parmi les situations à dépister. Les lésions traumatiques se recherchent systématiquement.</p></template>

<template data-pop="i95-s-syncope" data-title="Syncope d’origine orthostatique">
<div class="lab">Caractéristiques évocatrices</div><p>Survenue en position debout, absente couché, moins marquée assis ; prédominance matinale ; aggravation après un effort, un repas ou à la chaleur ; amélioration en s’asseyant ou en se couchant (ESC 2018, tableau 8).</p>
<div class="lab">Différence avec la syncope réflexe</div><p>La syncope réflexe s’accompagne souvent de prodromes végétatifs, comme les sueurs, la pâleur et les nausées, après une station debout prolongée ou un déclencheur émotionnel. La syncope orthostatique neurogène survient plutôt dans les minutes qui suivent le lever, sans activation végétative.</p>
<div class="lab">Signaux d’alarme</div><p>Effort, décubitus, palpitations, absence de prodrome ou cardiopathie connue font rechercher une syncope cardiaque.</p></template>

<template data-pop="i95-s-dysauto" data-title="Autres signes de dysautonomie">
<div class="lab">Vessie</div><p>Pollakiurie, urgenturie, vidange incomplète ; la rétention fait contre-indiquer la midodrine selon l’information suisse.</p>
<div class="lab">Tube digestif</div><p>Constipation, souvent ancienne, satiété précoce par gastroparésie.</p>
<div class="lab">Sexualité</div><p>Dysfonction érectile, souvent l’un des premiers signes chez l’homme.</p>
<div class="lab">Sudation et température</div><p>Anhidrose des jambes, sudation compensatrice du tronc, intolérance à la chaleur.</p>
<div class="lab">Valeur</div><p>L’association de plusieurs de ces signes à une hypotension orthostatique oriente fortement vers une défaillance autonome généralisée.</p></template>

<template data-pop="i95-s-rbd" data-title="Trouble du comportement en sommeil paradoxal">
<div class="lab">Définition</div><p>Perte de l’atonie musculaire normale du sommeil paradoxal : le patient agit ses rêves, crie, se débat, parfois se blesse ou blesse son conjoint.</p>
<div class="lab">Signification</div><p>Ce trouble est un marqueur précoce des synucléinopathies et peut les précéder de plusieurs années. Associé à une hypotension orthostatique, il oriente vers une maladie de Parkinson, une démence à corps de Lewy ou une atrophie multisystématisée débutante.</p>
<div class="lab">Diagnostic</div><p>Le diagnostic formel repose sur la polysomnographie, qui montre le tonus musculaire pendant le sommeil paradoxal.</p></template>

<template data-pop="i95-e-test" data-title="Test d’orthostatisme actif : technique">
<div class="lab">Préparation</div><p>Le patient est au calme, loin d’un repas copieux, idéalement le matin. Le médecin note les médicaments pris et leur heure.</p>
<div class="lab">Déroulement</div><p>Repos couché cinq minutes, puis mesure de la pression et de la fréquence. Lever actif, patient immobile, sans croiser les jambes. Mesures à une et trois minutes ; prolongation jusqu’à dix minutes si l’anamnèse est évocatrice. Les symptômes sont notés à chaque mesure.</p>
<div class="lab">Recommandation</div><p>L’ESC 2018 indique la mesure intermittente au tensiomètre couché puis debout pendant trois minutes lors de toute première évaluation d’une syncope (classe I, niveau C). L’ESC 2024 propose de mesurer la pression après une à trois minutes debout avant de débuter ou d’intensifier un traitement antihypertenseur.</p>
<div class="lab">Pièges</div><p>Un appareil automatique peut échouer pendant une chute rapide ; une mesure manuelle de contrôle est utile. Un patient incapable de rester debout trois minutes a, de ce fait, une intolérance orthostatique sévère. Un test fait l’après-midi, après hydratation, peut être faussement normal.</p></template>

<template data-pop="i95-e-fc" data-title="Gain de fréquence cardiaque au lever">
<div class="lab">Valeur normale</div><p>Le gain habituel est de 10 à 20 /min selon le consensus de 2017.</p>
<div class="lab">Interprétation</div><p>Un gain inférieur à 15 /min dans les trois minutes, en présence d’une chute tensionnelle, oriente vers une cause neurogène selon le consensus de 2017 ; l’ESC 2018 précise qu’il dépasse rarement 10 /min dans les formes neurogènes. Un gain élevé oriente vers une hypovolémie ou une anémie. Le rapport ΔFC/ΔPAS inférieur à 0,5 /min par mmHg affine cette lecture.</p>
<div class="lab">Conditions</div><p>Rythme sinusal, absence de bêtabloquant, d’ivabradine, de vérapamil ou de diltiazem, absence de stimulateur cardiaque.</p>
<div class="lab">Distinction</div><p>Un gain ≥ 30 /min sans chute tensionnelle définit une autre entité, le syndrome de tachycardie orthostatique posturale.</p></template>

<template data-pop="i95-e-volemie" data-title="Évaluation clinique de la volémie">
<div class="lab">Signes</div><p>Muqueuses sèches, pli cutané, baisse du débit urinaire, perte de poids récente, veines jugulaires plates couché.</p>
<div class="lab">Limites</div><p>Chez le sujet âgé, le pli cutané et la sécheresse buccale sont peu fiables, car la peau perd son élasticité et la respiration buccale assèche la bouche. Le poids comparé à une valeur antérieure et la biologie sont plus informatifs.</p>
<div class="lab">Conséquence</div><p>Une hypovolémie démontrée se corrige avant tout traitement presseur ; sa correction peut suffire.</p></template>

<template data-pop="i95-e-decub" data-title="Mesure de la pression couchée">
<div class="lab">Seuils</div><p>Définition actuelle (consensus américano-européen de 2018) : systolique ≥ 140 mmHg et/ou diastolique ≥ 90 mmHg après au moins 5 minutes couché, chez un patient ayant une hypotension orthostatique neurogène prouvée. Degrés : légère 140 à 159/90 à 99 mmHg, modérée 160 à 179/100 à 109 mmHg, sévère ≥ 180/≥ 110 mmHg. Le consensus de 2017 utilisait ≥ 150/90 mmHg pour définir l’hypertension de décubitus et garde ses seuils de traitement (160, puis 180/110 mmHg).</p>
<div class="lab">Pourquoi la mesurer</div><p>Elle conditionne le choix du presseur, l’heure de sa dernière prise et l’éventuel traitement du coucher. Elle explique aussi la polyurie nocturne.</p>
<div class="lab">Piège</div><p>Une pression normale assise au cabinet n’exclut pas une pression couchée élevée ; la mesure ambulatoire nocturne précise le profil.</p></template>

<template data-pop="i95-e-neuro" data-title="Examen neurologique ciblé">
<div class="lab">Syndrome parkinsonien</div><p>Bradykinésie, rigidité, tremblement de repos ; une réponse faible à la lévodopa et une évolution rapide orientent vers une atrophie multisystématisée.</p>
<div class="lab">Syndrome cérébelleux</div><p>Ataxie de la marche, dysarthrie, dysmétrie : forme cérébelleuse de l’atrophie multisystématisée.</p>
<div class="lab">Neuropathie</div><p>Hypoesthésie distale, aréflexie, perte de la sensibilité vibratoire : diabète, amylose, carence en cobalamine.</p>
<div class="lab">Fonctions cognitives</div><p>Fluctuations de l’attention et hallucinations visuelles : démence à corps de Lewy.</p></template>

<template data-pop="i95-tilt" data-title="Test d’inclinaison">
<div class="lab">Technique</div><p>Le patient est couché sur une table basculante, puis incliné à 60 à 70° ; la pression est enregistrée battement par battement avec l’électrocardiogramme. Une provocation pharmacologique peut être ajoutée pour rechercher une syncope réflexe.</p>
<div class="lab">Indications (ESC 2018)</div><p>Suspicion de syncope réflexe, d’hypotension orthostatique, de syndrome de tachycardie orthostatique posturale ou de pseudosyncope psychogène (classe IIa). Le diagnostic est probable si le test reproduit les symptômes avec le profil circulatoire caractéristique.</p>
<div class="lab">Lecture</div><p>Hypotension orthostatique : chute progressive dès l’inclinaison. Syncope réflexe : phase stable puis effondrement brutal avec bradycardie ou vasodilatation. Forme retardée : chute au-delà de trois minutes.</p>
<div class="lab">Limites</div><p>Un test négatif n’exclut pas une syncope réflexe. Le test ne sert pas à évaluer l’efficacité d’un médicament (ESC 2018).</p></template>

<template data-pop="i95-valsalva" data-title="Manœuvre de Valsalva">
<div class="lab">Technique</div><p>Le patient souffle dans un embout contre une résistance pendant environ 15 secondes, avec un enregistrement continu de la pression et de la fréquence.</p>
<div class="lab">Réponse normale</div><p>La pression baisse au début de l’effort, puis remonte grâce à la vasoconstriction sympathique. À la reprise respiratoire, elle dépasse sa valeur de départ et la fréquence ralentit.</p>
<div class="lab">Défaillance sympathique</div><p>La pression baisse continûment sans remontée, sans dépassement ; la fréquence ne s’accélère pas pendant l’effort. L’ESC 2018 considère l’absence de dépassement et d’accélération comme une forte preuve d’hypotension orthostatique neurogène.</p>
<div class="lab">Recommandation</div><p>ESC 2018 : à envisager chez les patients suspects d’hypotension orthostatique neurogène (classe IIa, niveau B).</p>
<div class="lab">Précautions</div><p>Elle est évitée en cas de rétinopathie proliférante ou de chirurgie oculaire récente, car l’effort élève la pression intraoculaire et veineuse.</p></template>

<template data-pop="i95-rythme-resp" data-title="Test de respiration profonde">
<div class="lab">Technique</div><p>Le patient respire lentement et profondément, au rythme de six cycles par minute, pendant que l’électrocardiogramme enregistre la fréquence.</p>
<div class="lab">Principe</div><p>À l’inspiration, le tonus vagal diminue et le cœur accélère ; à l’expiration, il ralentit. L’amplitude de cette variation mesure la fonction vagale cardiaque.</p>
<div class="lab">Interprétation</div><p>La variation diminue normalement avec l’âge ; elle s’interprète donc selon des normes d’âge du laboratoire. Une variation réduite signale une atteinte vagale, précoce dans le diabète.</p>
<div class="lab">Recommandation</div><p>ESC 2018 : à envisager chez les patients suspects d’hypotension orthostatique neurogène (classe IIa, niveau B).</p></template>

<template data-pop="i95-noradr" data-title="Noradrénaline plasmatique couché et debout">
<div class="lab">Technique</div><p>Prélèvement après un repos couché prolongé, puis après une station debout de plusieurs minutes, sur cathéter posé à l’avance pour éviter l’effet du stress de la ponction.</p>
<div class="lab">Interprétation</div><p>Normalement, la noradrénaline augmente nettement au lever. Une hausse faible confirme l’échec sympathique. Une valeur couchée basse indique une perte des neurones postganglionnaires, comme dans la dysautonomie pure ; une valeur couchée normale avec hausse faible oriente vers une atteinte centrale, comme dans l’atrophie multisystématisée.</p>
<div class="lab">Limites</div><p>Les valeurs dépendent du laboratoire, des médicaments et des conditions de prélèvement ; l’examen se réalise en centre spécialisé.</p></template>

<template data-pop="i95-mibg" data-title="Scintigraphie cardiaque à la MIBG">
<div class="lab">Principe</div><p>La MIBG radiomarquée est captée par les terminaisons sympathiques comme la noradrénaline. Le rapport de captation entre le cœur et le médiastin mesure l’innervation sympathique cardiaque.</p>
<div class="lab">Interprétation</div><p>Captation effondrée : dénervation postganglionnaire, comme dans la maladie de Parkinson, la démence à corps de Lewy et la dysautonomie pure. Captation habituellement conservée dans l’atrophie multisystématisée.</p>
<div class="lab">Pièges</div><p>Le diabète, l’insuffisance cardiaque, une cardiopathie ischémique et certains médicaments, comme les antidépresseurs qui bloquent la recapture de la noradrénaline, réduisent aussi la captation.</p></template>

<template data-pop="i95-peau" data-title="Biopsie cutanée de l’alpha-synucléine">
<div class="lab">Technique</div><p>Petites biopsies cutanées à l’emporte-pièce, prélevées notamment à la jambe et à la nuque, colorées par immunofluorescence pour l’alpha-synucléine phosphorylée dans les fibres nerveuses.</p>
<div class="lab">Interprétation</div><p>Des dépôts dans les fibres autonomes orientent vers une synucléinopathie. Leur absence ne l’exclut pas.</p>
<div class="lab">Statut</div><p>Examen spécialisé, disponible dans certains centres ; il complète l’évaluation neurologique. Sa disponibilité et son remboursement en Suisse n’ont pas été vérifiés pour ce cours.</p></template>

<template data-pop="i95-bio" data-title="Bilan biologique de l’hypotension">
<div class="lab">Hémogramme</div><p>Une anémie réduit le transport d’oxygène vers le cerveau et aggrave les symptômes ; une anémie microcytaire fait rechercher un saignement digestif.</p>
<div class="lab">Ionogramme et créatinine</div><p>L’hyponatrémie avec hyperkaliémie évoque une insuffisance surrénalienne ; l’hypokaliémie évoque un diurétique ou la fludrocortisone. La créatinine guide l’usage de la midodrine, contre-indiquée en insuffisance rénale sévère.</p>
<div class="lab">Glycémie et HbA1c</div><p>Elles recherchent un diabète, cause fréquente de neuropathie autonome.</p>
<div class="lab">Cortisol matinal</div><p>Un cortisol bas oriente vers une insuffisance surrénalienne, à confirmer par le test au tétracosactide.</p>
<div class="lab">Cobalamine</div><p>Une carence peut causer une neuropathie autonome curable.</p>
<div class="lab">Selon le contexte</div><p>Chaînes légères libres et immunofixation si une amylose est suspectée ; TSH si une dysthyroïdie est évoquée ; anticorps dirigés contre le récepteur ganglionnaire de l’acétylcholine en cas de dysautonomie subaiguë.</p></template>

<template data-pop="i95-s-dbh" data-title="Dopamine bêta-hydroxylase et son déficit">
<div class="lab">Fonction</div><p>Cette enzyme, située dans les vésicules des terminaisons sympathiques, transforme la dopamine en noradrénaline. Elle utilise l’ascorbate et le cuivre comme cofacteurs.</p>
<div class="lab">Déficit congénital</div><p>Maladie autosomique récessive très rare. La noradrénaline et l’adrénaline sont quasi absentes, la dopamine est élevée. Le patient a une hypotension orthostatique sévère depuis l’enfance, un ptosis et une congestion nasale.</p>
<div class="lab">Traitement</div><p>La droxidopa est convertie directement en noradrénaline par la DOPA décarboxylase, sans passer par l’enzyme déficiente ; elle corrige l’hypotension.</p></template>
