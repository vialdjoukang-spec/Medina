
<!-- ===== FENÊTRES I95 : Pareto ===== -->
<template data-pop="pareto-i95-def" data-title="Pareto — Définitions, codage et épidémiologie">
<p class="ratio" data-cover="i95-1,i95-2"></p>
<ul><li>Pas de seuil bas absolu : l’hypotension orthostatique se définit par une chute mesurée, provoquée par le lever ; les symptômes ne sont pas requis, et une chute asymptomatique reste une hypotension orthostatique.</li><li>Hypotension orthostatique classique : ≥ 20 mmHg systolique ou ≥ 10 mmHg diastolique dans les 3 minutes, ou systolique debout &lt; 90 mmHg (ESC 2018) ; ≥ 30 mmHg si hypertension couchée.</li><li>Forme initiale : &gt; 40/20 mmHg dans les 15 premières secondes ; forme retardée : au-delà de 3 minutes.</li><li>Neurogène : gain de fréquence faible, rapport ΔFC/ΔPAS &lt; 0,5.</li><li>I95.0 idiopathique, I95.1 orthostatique (neurogène de type Shy et Drager en G23.8, syndrome de tachycardie orthostatique posturale en G90.80), I95.2 médicamenteuse, I95.8 chronique et autres ; R03.0 et R03.1 = constatations à confirmer.</li><li>Prévalence : 22 % après 60 ans à domicile, 24 % en long séjour, 30 % dans la maladie de Parkinson ; aucune donnée suisse.</li><li>Associations avec chutes, cognition, mortalité : causalité directe seulement pour la chute et la syncope.</li><li>Pression basse asymptomatique : pas de risque démontré, pas de traitement.</li></ul></template>

<template data-pop="pareto-i95-physio" data-title="Pareto — Physiopathologie et étiologies">
<p class="ratio" data-cover="i95-3,i95-4"></p>
<ul><li>Lever → stockage veineux sous le diaphragme → débit ↓ → baroréflexe → noradrénaline sur α1 → pression maintenue.</li><li>Perte de connaissance pour une systolique de 50 à 60 mmHg au cœur (ESC 2018).</li><li>Neurogène : lésion centrale et préganglionnaire (atrophie multisystématisée) ou postganglionnaire (Parkinson, dysautonomie pure, diabète).</li><li>Hypertension couchée → natriurèse nocturne → hypovolémie et hypotension maximale le matin.</li><li>Post-prandiale : vasodilatation splanchnique non compensée.</li><li>Causes : médicaments d’abord ; hypovolémie, déconditionnement, insuffisance surrénalienne ; synucléinopathies ; diabète, amylose ; cardiopathie à débit fixe ; idiopathique par exclusion.</li></ul></template>

<template data-pop="pareto-i95-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i95-5,i95-6"></p>
<ul><li>Question clé : symptômes debout, améliorés assis ou couché.</li><li>Symptômes : vertige, vision grise, fatigue, douleur en cintre, lenteur cognitive, chutes, syncope ; aggravés le matin, après les repas, à la chaleur.</li><li>Rechercher dysautonomie (vessie, intestin, érection, sudation) et rêves agis.</li><li>Liste exacte des médicaments et de leurs horaires.</li><li>Test : couché 5 minutes, debout à 1 et 3 minutes, jusqu’à 10 minutes ; mesurer la pression couchée ; calculer ΔFC/ΔPAS.</li><li>Un test normal n’exclut pas : moment, forme retardée, forme initiale.</li></ul></template>

<template data-pop="pareto-i95-diag" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="i95-7,i95-8"></p>
<ul><li>Ordre : gravité → chute démontrée et symptomatique → mécanisme → cause.</li><li>Chute symptomatique et anamnèse typique : syncope due à l’hypotension orthostatique (classe I).</li><li>Différentiels graves : syncope cardiaque, hémorragie, insuffisance surrénalienne.</li><li>R03.0 : confirmer hors cabinet selon le cours I10 ; R03.1 asymptomatique : ne pas traiter.</li><li>Hypoperfusion = choc ; tachycardie orthostatique marquée = chercher une hémorragie ; crise surrénalienne = hydrocortisone immédiate ; couché &gt; 180/110 mmHg sous presseur = réduire ou traiter au coucher.</li></ul></template>

<template data-pop="pareto-i95-tt" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i95-9"></p>
<ul><li>Objectif : symptômes, chutes, autonomie ; pas de normalisation de la pression debout.</li><li>Expliquer (I), réviser les médicaments (IIa B), remplacer plutôt qu’alléger (ESC 2024).</li><li>Hydratation 2 à 3 L et 10 g de sel sans hypertension (I) ; contre-pression (IIa) ; ceinture ou contention 30 à 40 mmHg (IIa B) ; tête du lit &gt; 10° (IIa) ; bolus d’eau ; repas fractionnés.</li><li>Persistance : midodrine (IIa B) ou fludrocortisone (IIa C) ; droxidopa sans autorisation suisse connue.</li><li>Dernier presseur au moins 4 à 5 heures avant le coucher ; agent bref au coucher si couché &gt; 180/110 mmHg.</li></ul></template>

<template data-pop="pareto-i95-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i95-10,i95-11"></p>
<ul><li>Suivi : pression couchée et debout, kaliémie sous fludrocortisone, mesure ambulatoire nocturne.</li><li>Formes médicamenteuses curables ; formes neurogènes primaires progressives ; dysautonomie pure parfois annonciatrice.</li><li>Mesurer la pression debout avant d’intensifier un antihypertenseur chez le sujet âgé.</li><li>Midodrine contre-indiquée (information suisse) : hypertension, obstacle urinaire, insuffisance rénale sévère, grossesse ; fludrocortisone évitée en insuffisance cardiaque.</li><li>Parkinson : décision partagée avec le neurologue ; grossesse : décubitus latéral gauche.</li></ul></template>

<template data-pop="pareto-i95-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i95-e-1,i95-e-2,i95-e-3,i95-e-4,i95-e-5,i95-e-6,i95-e-7"></p>
<ul><li>Première ligne : test d’orthostatisme actif (classe I), électrocardiogramme, biologie.</li><li>Référence de l’intolérance orthostatique : inclinaison avec mesure continue (IIa) ; elle seule voit la forme initiale.</li><li>Mesure ambulatoire : hypertension nocturne de la défaillance autonome (I B), chutes post-prandiales.</li><li>Tests autonomiques (Valsalva, respiration profonde, IIa B) ; noradrénaline couchée et MIBG séparent atteinte postganglionnaire et centrale.</li><li>Natrémie basse et kaliémie haute : insuffisance surrénalienne jusqu’à preuve du contraire.</li></ul></template>

<template data-pop="pareto-i95-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i95-sa,i95-sh,i95-sp,i95-sb,i95-sg"></p>
<ul><li>Arc baroréflexe : sinus carotidien et aorte → bulbe → moelle (préganglionnaire, acétylcholine) → ganglion → postganglionnaire (noradrénaline) → α1.</li><li>Alpha-synucléine : neurones périphériques dans Parkinson et dysautonomie pure, oligodendrocytes dans l’atrophie multisystématisée.</li><li>Récepteurs dénervés hypersensibles : forte réponse aux presseurs.</li><li>Autorégulation cérébrale déplacée vers le haut chez l’hypertendu ; Valsalva sans dépassement = échec sympathique.</li><li>Midodrine : agoniste α1 direct ; droxidopa : noradrénaline sans dopamine bêta-hydroxylase ; fludrocortisone : sodium retenu, potassium perdu.</li><li>Génétique : déficit en dopamine bêta-hydroxylase, amylose à transthyrétine, SNCA.</li></ul></template>

<template data-pop="pareto-i95-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i95-p-1,i95-p-2,i95-p-3,i95-p-4,i95-p-5"></p>
<ul><li>Retirer avant d’ajouter ; tout presseur élève aussi la pression couchée.</li><li>Midodrine (Gutron gouttes 10 mg/mL) : 7 gouttes 2 à 3 fois par jour, maximum 30 mg par jour, dernière dose au moins 4 heures avant le coucher ; contre-indications suisses à vérifier avant toute prescription.</li><li>Fludrocortisone 0,1 à 0,3 mg par jour, hors indication en Suisse ; kaliémie.</li><li>Droxidopa : pas d’autorisation suisse connue ; bénéfice au long cours non établi.</li><li>Interactions : vasoconstricteurs, bradycardisants, alphabloquants, diurétiques avec la fludrocortisone, carbidopa avec la droxidopa.</li><li>Hypertension couchée : agent bref au coucher (patch de nitroglycérine, captopril, losartan).</li><li>Syncope réflexe : midodrine et fludrocortisone IIb B ; bêtabloquants III A.</li></ul></template>
