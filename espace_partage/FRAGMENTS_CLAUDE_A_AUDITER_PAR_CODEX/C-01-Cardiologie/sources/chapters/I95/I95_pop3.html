
<!-- ===== FENÊTRES I95 : traitement, médicaments et situations particulières ===== -->
<template data-pop="i95-revision" data-title="Révision des médicaments hypotenseurs">
<div class="lab">Recommandation</div><p>ESC 2018 : la modification ou l’arrêt des médicaments hypotenseurs doit être envisagé dans l’hypotension orthostatique (classe IIa, niveau B). Dans l’hypotension médicamenteuse, l’élimination de l’agent responsable est la stratégie principale ; la qualité des preuves est jugée modérée.</p>
<div class="lab">Méthode</div><p>Le médecin liste chaque molécule, son indication actuelle, son mécanisme hypotenseur et son heure de prise. Il retire d’abord ce qui n’a plus d’indication, puis remplace ce qui a une alternative, puis ajuste l’horaire de ce qui reste indispensable.</p>
<div class="lab">Classes préférées chez l’hypertendu à risque de chute</div><p>L’ESC 2018 préfère les inhibiteurs de l’enzyme de conversion, les antagonistes des récepteurs de l’angiotensine et les inhibiteurs calciques, moins associés à l’hypotension orthostatique que les diurétiques et les bêtabloquants.</p>
<div class="lab">Piège</div><p>Arrêter brutalement un bêtabloquant chez un coronarien ou un patient en fibrillation auriculaire expose à un rebond ischémique ou tachycardique ; la décroissance est progressive et l’indication est pesée.</p></template>

<template data-pop="i95-cible" data-title="Cible tensionnelle de l’hypertendu ayant une hypotension orthostatique">
<div class="lab">Source retenue : ESC 2024 (hypertension)</div><p>La recommandation la plus récente applicable à l’hypertendu demande de rechercher une hypotension orthostatique avant de débuter ou d’intensifier un traitement. Chez les patients ayant une hypotension orthostatique symptomatique avant traitement, elle propose de ne traiter qu’à partir de 140/90 mmHg au cabinet et autorise une cible plus souple. Elle recommande de remplacer le médicament qui aggrave l’hypotension par un autre antihypertenseur plutôt que d’alléger tout le traitement, et de commencer par les mesures non médicamenteuses. Les classes de recommandation de ces points ont été recoupées par des synthèses secondaires ; le tableau original n’a pas été lu en texte intégral.</p>
<div class="lab">Texte antérieur toujours en vigueur : ESC 2018 (syncope)</div><p>Chez les patients ayant une hypotension orthostatique établie et un risque de chute, l’ESC 2018 conseille d’éviter un traitement antihypertenseur agressif et de viser une systolique de 140 à 150 mmHg. Ce conseil figure parmi les commentaires pratiques, sans classe de recommandation.</p>
<div class="lab">Donnée récente : Juraschek et al. (2020)</div><p>Cette méta-analyse sur données individuelles de 18 466 participants d’essais a montré que le traitement intensif ne majorait pas l’hypotension orthostatique ; il la réduisait légèrement (rapport de cotes 0,93, intervalle de confiance à 95 % : 0,86 à 0,99). Ses limites sont importantes : mesure assis puis debout, sans la première minute, et absence de données sur les chutes et les syncopes. Elle porte sur des hypertendus d’essais, non sur des patients dysautonomiques.</p>
<div class="lab">Relation entre les sources</div><p>Les trois sources convergent sur un point : l’hypotension orthostatique ne justifie pas d’abandonner le traitement de l’hypertension, mais elle oriente le choix des molécules et la cible. Pour l’hypertendu courant, l’ESC 2024 s’applique. Pour le patient dysautonomique qui chute, la cible plus haute de l’ESC 2018 reste le repère le plus spécifique.</p></template>

<template data-pop="i95-sel" data-title="Hydratation et sel">
<div class="lab">Recommandation</div><p>ESC 2018 : hydratation et apport de sel adéquats indiqués (classe I, niveau C). En l’absence d’hypertension, viser 2 à 3 L de liquides et 10 g de chlorure de sodium par jour.</p>
<div class="lab">Mécanisme</div><p>Le sel retient l’eau dans le compartiment extracellulaire et augmente le volume plasmatique, donc le volume disponible au lever.</p>
<div class="lab">Contre-indications relatives</div><p>Hypertension, notamment de décubitus, insuffisance cardiaque, maladie rénale avancée, œdèmes. Le consensus de 2017 recommande une surveillance renforcée chez les patients à risque d’insuffisance cardiaque ou d’œdème ; il considère qu’une natriurèse supérieure à 100 mmol par 24 heures témoigne d’un apport suffisant.</p></template>

<template data-pop="i95-eau" data-title="Bolus d’eau">
<div class="lab">Modalités</div><p>Boire rapidement, en moins de cinq minutes, environ 500 mL d’eau, avant le lever, avant un repas ou avant une activité debout.</p>
<div class="lab">Effet</div><p>Le consensus de 2017 rapporte une élévation de la systolique d’environ 30 mmHg en quelques minutes, qui peut durer jusqu’à une heure. Les boissons autres que l’eau n’ont pas produit cet effet.</p>
<div class="lab">Mécanisme</div><p>L’eau pauvre en sel, en abaissant l’osmolalité de la veine porte, déclenche un réflexe presseur sympathique ; l’effet est plus marqué chez les patients dysautonomiques. L’ESC 2018 mentionne aussi l’efficacité de l’ingestion rapide d’eau fraîche sur l’intolérance orthostatique et l’hypotension post-prandiale.</p>
<div class="lab">Précaution</div><p>Insuffisance cardiaque, hyponatrémie et restriction hydrique prescrite.</p></template>

<template data-pop="i95-contre-pression" data-title="Manœuvres de contre-pression">
<div class="lab">Gestes</div><p>Croiser les jambes en serrant les cuisses, contracter les fessiers et l’abdomen, se mettre sur la pointe des pieds, s’accroupir, ou poser un pied sur une chaise en se penchant en avant.</p>
<div class="lab">Mécanisme</div><p>La contraction musculaire comprime les veines des jambes et de l’abdomen et chasse le sang vers le cœur ; le volume d’éjection et la pression remontent en quelques secondes.</p>
<div class="lab">Recommandation</div><p>ESC 2018 : manœuvres isométriques à envisager dans l’hypotension orthostatique (classe IIa, niveau C).</p>
<div class="lab">Limite</div><p>Elles demandent des prodromes suffisants et une force musculaire conservée ; elles sont difficiles chez le patient parkinsonien avancé.</p></template>

<template data-pop="i95-contention" data-title="Ceinture abdominale et bas de contention">
<div class="lab">Recommandation</div><p>ESC 2018 : ceinture abdominale et/ou bas de contention pour réduire le stockage veineux (classe IIa, niveau B).</p>
<div class="lab">Modalités</div><p>Le consensus de 2017 retient une compression de 30 à 40 mmHg. Les modèles montant jusqu’à la taille sont les plus efficaces, puis les modèles montant à la cuisse ; les bas montant au genou sont inefficaces. La ceinture abdominale est une alternative mieux tolérée.</p>
<div class="lab">Pratique</div><p>Les vêtements se mettent couché, avant le lever, et se retirent au coucher, car la compression couchée majorerait l’hypertension de décubitus.</p>
<div class="lab">Limite</div><p>L’enfilage est difficile pour les patients âgés ou parkinsoniens ; l’adhésion baisse en été.</p></template>

<template data-pop="i95-lit" data-title="Tête du lit surélevée">
<div class="lab">Recommandation</div><p>ESC 2018 : sommeil tête surélevée de plus de 10° pour augmenter le volume liquidien (classe IIa, niveau C).</p>
<div class="lab">Mécanisme</div><p>L’inclinaison réduit la pression de perfusion rénale nocturne et la natriurèse de pression ; elle limite la polyurie nocturne et l’hypertension de décubitus.</p>
<div class="lab">Modalités</div><p>Le consensus de 2017 propose de surélever la tête du lit de 15 à 23 cm, en plaçant des cales sous les pieds du lit côté tête ; des oreillers empilés ne suffisent pas, car ils fléchissent le cou sans incliner le tronc.</p></template>

<template data-pop="i95-repas" data-title="Mesures alimentaires">
<div class="lab">Principe</div><p>Des repas plus petits et plus fréquents, pauvres en glucides rapides et sans alcool, réduisent la vasodilatation splanchnique post-prandiale.</p>
<div class="lab">Pratique</div><p>Le patient reste assis ou couché 30 à 60 minutes après le repas principal et évite les efforts et les bains chauds dans ce délai.</p>
<div class="lab">Source</div><p>Mesures citées par l’ESC 2018 et le consensus de 2017, sans classe de recommandation propre.</p></template>

<template data-pop="i95-d-mido" data-title="Midodrine">
<div class="lab">Mécanisme</div><p>Prodrogue transformée en desglymidodrine, agoniste direct des récepteurs α1. Elle contracte les artérioles et les veines, sans dépendre de la noradrénaline endogène. Elle traverse peu la barrière hématoencéphalique.</p>
<div class="lab">Preuves</div><p>Trois essais randomisés contre placebo, dont l’essai multicentrique de Low et al. (JAMA, 1997), ont montré une hausse de la pression debout et une amélioration des symptômes. ESC 2018 : à envisager si les symptômes persistent (classe IIa, niveau B) ; la qualité des preuves est jugée modérée.</p>
<div class="lab">Posologie suisse (Gutron gouttes 10 mg/mL)</div><p>Dès 12 ans, hypotension fonctionnelle : 7 gouttes deux fois par jour, entretien de 3 à 15 gouttes deux fois par jour. Forme iatrogène : 7 gouttes deux à trois fois par jour. Forme sévère : trois prises par jour, la première 30 à 45 minutes avant le lever, augmentation hebdomadaire possible, maximum 30 mg par jour. Dernière dose au moins quatre heures avant le coucher. Information consultée sur compendium.ch le 08.10.2026.</p>
<div class="lab">Effets indésirables</div><p>Hypertension couchée, principale cause d’arrêt selon l’ESC 2018 ; piloérection, prurit et fourmillements du cuir chevelu ; difficultés mictionnelles ; bradycardie réflexe.</p>
<div class="lab">Contre-indications suisses</div><p>Cardiopathie organique sévère, hypertension, réponse hypertensive au test d’orthostatisme, troubles du rythme, phéochromocytome, maladie rénale aiguë, insuffisance rénale sévère, artériopathie occlusive ou spastique sévère, glaucome à angle fermé, obstacle urinaire et hypertrophie prostatique avec résidu, rétinopathie diabétique proliférante, hyperthyroïdie, grossesse et allaitement.</p>
<div class="lab">Surveillance</div><p>Pression couchée et debout à chaque palier, fonction rénale, symptômes urinaires.</p></template>

<template data-pop="i95-d-fludro" data-title="Fludrocortisone">
<div class="lab">Mécanisme</div><p>Corticoïde fluoré à forte activité minéralocorticoïde. Il augmente la réabsorption de sodium au tube collecteur et le volume plasmatique ; l’effet apparaît en trois à sept jours.</p>
<div class="lab">Preuves</div><p>Deux petites études d’observation et un essai en double aveugle chez 60 patients (ESC 2018). ESC 2018 : à envisager si les symptômes persistent (classe IIa, niveau C).</p>
<div class="lab">Posologie</div><p>0,1 à 0,3 mg une fois par jour (ESC 2018) ; le consensus de 2017 retient habituellement 0,1 à 0,2 mg et juge le bénéfice faible au-delà de 0,3 mg. En Suisse, Florinef 0,1 mg est enregistré pour l’insuffisance surrénalienne : l’usage dans l’hypotension orthostatique est hors indication.</p>
<div class="lab">Effets indésirables</div><p>Hypokaliémie, œdèmes, hypertension de décubitus, décompensation d’une insuffisance cardiaque ; aux doses élevées, freination de l’axe corticotrope.</p>
<div class="lab">Sécurité comparée</div><p>Dans une cohorte rétrospective américaine (Grijalva et al., 2017), les utilisateurs de fludrocortisone avaient plus d’hospitalisations toutes causes que ceux de midodrine (rapport de taux ajusté 1,20 ; 1,42 en cas d’insuffisance cardiaque). Cette étude d’observation ne prouve pas la causalité.</p>
<div class="lab">Surveillance</div><p>Kaliémie, poids, œdèmes et pression couchée après une à deux semaines, puis régulièrement.</p></template>

<template data-pop="i95-d-droxi" data-title="Droxidopa">
<div class="lab">Mécanisme</div><p>Acide aminé synthétique converti en noradrénaline par la DOPA décarboxylase, dans et hors des neurones. Elle fournit de la noradrénaline même quand les terminaisons sympathiques sont rares.</p>
<div class="lab">Statut</div><p>Autorisée par la FDA en 2014 pour l’hypotension orthostatique neurogène symptomatique. Aucune spécialité suisse n’a été trouvée lors de la recherche du 08.10.2026 ; le statut Swissmedic n’a pas pu être confirmé dans les bases suisses complètes.</p>
<div class="lab">Preuves</div><p>Dans l’essai de phase 3 de Kaufmann et al. (Neurology, 2014), 162 répondeurs randomisés pendant sept jours ont amélioré leur score de symptômes ; la systolique debout a augmenté de 11,2 mmHg contre 3,9 mmHg sous placebo. L’ESC 2018 résume quatre essais courts totalisant 485 patients : le bénéfice observé à deux semaines disparaissait à huit semaines, et l’efficacité au long cours n’est pas établie.</p>
<div class="lab">Posologie (information américaine)</div><p>100 mg trois fois par jour, augmentés par paliers jusqu’à 600 mg trois fois par jour au maximum.</p>
<div class="lab">Effets indésirables et interactions</div><p>Hypertension couchée (systolique &gt; 180 mmHg chez 4,9 % des patients contre 2,5 % sous placebo dans l’essai de 2014), céphalées, vertiges. La carbidopa et le bensérazide peuvent réduire sa conversion.</p></template>

<template data-pop="i95-d-pyrido" data-title="Pyridostigmine">
<div class="lab">Mécanisme</div><p>Inhibiteur de l’acétylcholinestérase. Il renforce la transmission cholinergique dans les ganglions sympathiques ; l’effet est plus marqué debout, quand l’activité sympathique est sollicitée, ce qui explique qu’il aggrave peu la pression couchée.</p>
<div class="lab">Posologie</div><p>30 à 60 mg une à trois fois par jour (consensus de 2017), hors indication.</p>
<div class="lab">Place</div><p>Option lorsque l’hypertension de décubitus limite les autres presseurs ; effet presseur modeste et efficacité moins établie (ESC 2018).</p>
<div class="lab">Effets indésirables</div><p>Crampes abdominales, diarrhée, hypersalivation, sudation, incontinence urinaire, bradycardie.</p></template>

<template data-pop="i95-d-octreo" data-title="Octréotide">
<div class="lab">Mécanisme</div><p>Analogue de la somatostatine qui réduit la libération des peptides digestifs vasodilatateurs et la vasodilatation splanchnique après le repas.</p>
<div class="lab">Place</div><p>Hypotension post-prandiale réfractaire. Jansen et Lipsitz (1995) le jugeaient efficace, mais injectable et coûteux ; l’ESC 2018 le cite parmi les traitements d’appoint. Usage hors indication ; aucune posologie validée par une recommandation lue pour ce cours.</p>
<div class="lab">Effets indésirables</div><p>Troubles digestifs, lithiase biliaire au long cours, perturbations glycémiques.</p></template>

<template data-pop="i95-d-desmo" data-title="Desmopressine">
<div class="lab">Mécanisme</div><p>Agoniste des récepteurs V2 du tube collecteur ; elle réduit la diurèse nocturne.</p>
<div class="lab">Place</div><p>Polyurie nocturne de la défaillance autonome (ESC 2018, traitement d’appoint), hors indication.</p>
<div class="lab">Risque</div><p>Hyponatrémie, surtout chez le sujet âgé et en cas d’apports hydriques élevés ; la natrémie est contrôlée après l’introduction.</p></template>

<template data-pop="i95-d-acarb" data-title="Acarbose">
<div class="lab">Mécanisme</div><p>Inhibiteur des alpha-glucosidases intestinales ; il ralentit l’absorption des glucides et la libération post-prandiale d’insuline et de peptides vasodilatateurs.</p>
<div class="lab">Place</div><p>Cité par le consensus de 2017 pour réduire la chute post-prandiale ; usage hors indication chez le non-diabétique.</p>
<div class="lab">Effets indésirables</div><p>Flatulences et diarrhée par fermentation des glucides non absorbés.</p></template>

<template data-pop="i95-d-cafe" data-title="Caféine">
<div class="lab">Mécanisme</div><p>Antagoniste des récepteurs de l’adénosine, qui s’oppose à la vasodilatation splanchnique post-prandiale.</p>
<div class="lab">Données contradictoires</div><p>Jansen et Lipsitz (1995) estimaient que les données disponibles ne soutenaient pas son usage ; le consensus de 2017 la mentionne comme moyen possible. Elle peut se proposer avec le repas, sans en attendre un effet important.</p></template>

<template data-pop="i95-hdecub-tt" data-title="Traitement de l’hypertension de décubitus">
<div class="lab">Mesures</div><p>Ne pas s’allonger à plat le jour ; dormir tête surélevée ; dernière dose de presseur au moins quatre heures avant le coucher (information suisse de la midodrine) ou cinq heures (consensus de 2017).</p>
<div class="lab">Seuils (consensus de 2017)</div><p>Surveillance jusqu’à 160 mmHg de systolique ; décision individuelle entre 160 et 180 mmHg ; traitement au coucher au-delà de 180/110 mmHg.</p>
<div class="lab">Médicaments</div><p>Agents de courte durée pris au coucher seulement : patch de nitroglycérine retiré au lever, captopril, losartan, hydralazine, clonidine. Les diurétiques et la fludrocortisone sont évités.</p>
<div class="lab">Piège</div><p>Le traitement nocturne majore l’hypotension lors d’un lever nocturne : le patient s’assoit d’abord au bord du lit.</p></template>

<template data-pop="i95-agee" data-title="Sujet âgé : chutes et hypotension">
<div class="lab">Enjeu</div><p>Chez le sujet âgé fragile, la chute et ses conséquences, comme la fracture du col du fémur, pèsent souvent plus lourd que le bénéfice d’une pression basse.</p>
<div class="lab">Démarche</div><p>Test d’orthostatisme systématique, mesure post-prandiale si les malaises suivent les repas, révision médicamenteuse, puis cible tensionnelle individualisée selon l’ESC 2024.</p>
<div class="lab">Piège</div><p>Le risque de chute ne contre-indique pas à lui seul une anticoagulation indiquée ; il impose de traiter la cause des chutes.</p></template>

<template data-pop="i95-parkinson" data-title="Hypotension et traitement antiparkinsonien">
<div class="lab">Mécanismes</div><p>La maladie détruit les terminaisons sympathiques ; la lévodopa et les agonistes dopaminergiques ajoutent une vasodilatation et une action sympatholytique.</p>
<div class="lab">Conduite</div><p>La décision se partage avec le neurologue : fractionner les doses, éviter les pics de concentration, préférer les molécules les moins hypotensives, puis ajouter des mesures physiques et, si besoin, un presseur.</p>
<div class="lab">Piège</div><p>Réduire la lévodopa pour améliorer la pression peut aggraver la motricité et donc les chutes : le bénéfice net se juge sur les chutes et l’autonomie.</p></template>

<template data-pop="i95-grossesse" data-title="Hypotension et grossesse">
<div class="lab">Physiologie</div><p>La pression baisse au cours du deuxième trimestre, par vasodilatation hormonale et développement de la circulation utéroplacentaire, puis remonte en fin de grossesse.</p>
<div class="lab">Syndrome hypotensif de décubitus (O26.5)</div><p>En décubitus dorsal en fin de grossesse, l’utérus comprime la veine cave inférieure ; le retour veineux chute. La position latérale gauche le corrige.</p>
<div class="lab">Traitement</div><p>Mesures physiques et hydratation d’abord. L’information suisse de Gutron contre-indique la midodrine pendant la grossesse et l’allaitement ; toute pharmacothérapie relève d’une décision spécialisée.</p></template>
