<template data-pop="b50-pa-gravite" data-title="Gravité : un seul critère change le parcours"><div class="lab">Triage suisse</div><p>Un seul signe majeur, notamment confusion, détresse respiratoire, choc, acidose, hypoglycémie, insuffisance rénale ou vomissements empêchant l’oral, conduit au parcours hospitalier. Pour le clinicien peu expérimenté, une parasitémie ≥2 % suffit aussi.</p><div class="lab">Pour le cas</div><p>La valeur de 0,8 % ne franchit pas ce seuil. Les organes, la glycémie et la tolérance orale restent inconnus : la forme non compliquée ne peut pas encore être conclue.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I, p. 1 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-cycle" data-title="Cycle : formes asexuées et gamétocytes"><div class="lab">Deux destins sanguins</div><p>Les mérozoïtes envahissent les globules rouges et les formes asexuées s’y multiplient. Une partie se différencie en gamétocytes qui pourront être ingérés par un moustique. Les gamétocytes ne représentent pas une multiplication asexuée humaine.</p><div class="lab">Conséquence</div><p>Après traitement, la présence isolée de gamétocytes ne démontre pas une persistance des formes asexuées. Le frottis de suivi doit les distinguer.</p><div class="src">Sources : <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS, WHO guidelines for malaria, 10 septembre 2026, glossaire, p. PDF 265</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §II.6, p. 5 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-exposition" data-title="Exposition : lieu, dates et protection"><div class="lab">Risque</div><p>Le médecin précise les pays et régions visités, la saison, les dates, les piqûres possibles et les moyens de protection. Une prophylaxie ou une moustiquaire n’exclut pas le paludisme devant une fièvre après voyage.</p><div class="lab">Décision</div><p>Le lieu peut modifier le choix d’un antipaludique. Aucune destination ni date de contamination n’est renseignée pour le cas.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Paludisme », transmission et urgence</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §II, p. 2 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-fievre" data-title="Fièvre et frissons"><div class="lab">Mécanisme</div><p>La multiplication sanguine et la rupture des schizontes contribuent à la réaction inflammatoire et aux accès fébriles. La fièvre ne suit pas obligatoirement une périodicité reconnaissable.</p><div class="lab">Décision</div><p>Ces symptômes sont peu spécifiques ; le voyage et la preuve parasitologique fondent le diagnostic. Les 0,8 % ne disent pas si une complication accompagne la fièvre.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Paludisme », « Tableau clinique »</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS, WHO guidelines for malaria, 10 septembre 2026, glossaire, p. PDF 265</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-hematologie" data-title="Anémie : perte de globules rouges"><div class="lab">Mécanisme</div><p>Des hématies infectées et non infectées peuvent être détruites ou retirées de la circulation. Leur perte réduit la quantité d’hémoglobine qui transporte l’oxygène.</p><div class="lab">Mesure</div><p>L’hémoglobine doit être mesurée ; une pâleur ou 0,8 % de parasitémie ne la chiffre pas. Le guide suisse retient &lt;7 g/dL chez l’adulte comme critère de gravité.</p><div class="src">Sources : <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS, WHO guidelines for malaria, 10 septembre 2026, §5.2.2, p. PDF 215</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I, p. 1 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-sequestration" data-title="Séquestration et pourcentage circulant"><div class="lab">Mécanisme</div><p>Les globules rouges parasités par P. falciparum peuvent adhérer aux petits vaisseaux. Le frottis périphérique mesure ceux qui circulent et ne chiffre pas toute la biomasse potentiellement séquestrée.</p><div class="lab">Limite</div><p>Le mécanisme contribue aux défaillances, avec l’inflammation et la perfusion. Il ne permet pas de prédire une atteinte cérébrale chez cette personne à partir de 0,8 %.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §III, commentaires p. 6 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-immunite" data-title="Immunité partielle : ne pas la présumer"><div class="lab">Population</div><p>Une exposition répétée en zone d’endémie peut créer une protection partielle qui diminue après éloignement. Elle n’est pas quantifiable de façon fiable lors du triage.</p><div class="lab">Décision</div><p>L’origine géographique ou un voyage ne suffit pas à la supposer. L’exception suisse au parcours parentéral pour 2 à moins de 4 % reste spécialisée et soumise à d’autres conditions.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I, commentaire p. 1 imprimée</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS, WHO guidelines for malaria, 10 septembre 2026, immunité, p. PDF 35</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-prophylaxie" data-title="Prophylaxie antérieure : prise et choix curatif"><div class="lab">À documenter</div><p>Le médecin identifie le produit, les dates, les doses réellement prises, les oublis et les vomissements. Une infection peut survenir malgré une prophylaxie.</p><div class="lab">Conséquence</div><p>Le médicament récent peut modifier le choix ou la surveillance de la cure. Le cas ne donne aucune prophylaxie ; aucun échec de produit particulier ne peut être inféré.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §II, tableau et notes p. 2 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-digestif" data-title="Vomissements et absorption"><div class="lab">Triage</div><p>Des vomissements répétés qui empêchent l’oral constituent un critère de gravité dans le guide suisse. Une diarrhée ou une alimentation insuffisante peuvent aussi réduire l’exposition à la luméfantrine.</p><div class="lab">Produit</div><p>La FI Riamet demande un aliment ou une boisson lipidique et de répéter une prise vomie dans l’heure. La capacité orale n’est pas renseignée pour le cas.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1 et §II commentaire 1 p. 3 imprimées</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI suisse Riamet n° 54594, décembre 2019, « Posologie »</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-neuro" data-title="Conscience et convulsions"><div class="lab">Évaluation</div><p>Une conscience altérée ou des convulsions font traiter l’infection comme grave. Le médecin décrit l’état neurologique, mesure la glycémie et recherche aussi une autre cause urgente.</p><div class="lab">Limite</div><p>Un frottis positif ne démontre pas, à lui seul, un paludisme cérébral. Aucune atteinte neurologique n’est documentée dans le cas.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1 et §III p. 6 imprimées</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-respiration" data-title="Dyspnée et oxygénation"><div class="lab">Évaluation</div><p>Le médecin mesure l’oxygénation et recherche un œdème pulmonaire ou une détresse respiratoire. Lésion endothéliale et apports hydriques excessifs peuvent aggraver une complication respiratoire.</p><div class="lab">Décision</div><p>Une hypoxie ou une détresse impose le parcours grave, même sous 2 % de parasitémie. Aucune mesure respiratoire n’est fournie pour le cas.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1 et §III commentaires p. 6 imprimées</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-rein" data-title="Diurèse et fonction rénale"><div class="lab">Seuils suisses</div><p>Une diurèse &lt;0,4 mL/kg/h, une créatinine >265 µmol/L ou une urée >20 mmol/L figure dans les critères suisses de forme grave. Pour 70 kg, 0,4 mL/kg/h correspond à 28 mL/h.</p><div class="lab">Limite</div><p>Ce calcul ne décrit pas la diurèse réelle du patient. Le médecin relie mesures rénales, circulation et hydratation avant la décision thérapeutique.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I, p. 1 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-perfusion" data-title="Perfusion périphérique et choc"><div class="lab">Examen</div><p>Le guide suisse inclut un choc compensé lorsque la recoloration capillaire dure au moins trois secondes, même sans hypotension. Une baisse de pression peut apparaître plus tard.</p><div class="lab">Décision</div><p>Le médecin examine perfusion, température des extrémités et pression artérielle. Aucune valeur circulatoire n’est fournie pour ce cas.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I, tableau p. 1 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-glycemie" data-title="Glycémie immédiate si trouble neurologique"><div class="lab">Seuil</div><p>Une glycémie &lt;2,2 mmol/L figure parmi les critères suisses de paludisme grave. L’hypoglycémie peut contribuer à une confusion ou une convulsion et doit être identifiée sans délai.</p><div class="lab">Limite</div><p>Le cas ne donne aucune glycémie. Un trouble de conscience ne peut être attribué au seul parasite avant cette mesure et l’examen neurologique.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1 et §III p. 6 imprimées</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-microscopie" data-title="Goutte épaisse et frottis mince"><div class="lab">Deux fonctions</div><p>La goutte épaisse est sensible pour détecter le parasite. Le frottis mince aide à établir l’espèce et la parasitémie. Une lecture expérimentée améliore la fiabilité.</p><div class="lab">Résultat négatif</div><p>Une première microscopie négative ne clôt pas une forte suspicion. Des contrôles sériés se décident selon la probabilité et les autres diagnostics ; le cas a déjà un frottis positif.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §V, p. 8 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-differentiels" data-title="Sepsis et autres causes urgentes"><div class="lab">Évaluation parallèle</div><p>Un choc ou une conscience altérée peut avoir une cause associée au paludisme. Le guide suisse recommande de rechercher une infection bactérienne en cas de choc et de ne pas donner automatiquement des antibiotiques à tout adulte paludéen grave.</p><div class="lab">Décision</div><p>Le bilan associé ne diffère pas le traitement antipaludique urgent. Aucune co-infection n’est attribuée à la personne du cas.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §III, commentaires p. 6 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-seuil" data-title="Seuil suisse de 2 % et exception"><div class="lab">Règle générale</div><p>Un clinicien peu expérimenté applique le parcours grave lorsque la parasitémie atteint 2 %. Ce seuil s’ajoute aux autres critères d’organe.</p><div class="lab">Exception spécialisée</div><p>Un expert peut discuter une ACT orale pour 2 à moins de 4 % si l’hyperparasitémie est isolée, l’immunité partielle plausible et l’adhésion fiable. L’observation clinique dure jusqu’à deux prises, soit huit heures, avant sortie éventuelle.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I, commentaire p. 1 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-oral" data-title="Conditions du traitement oral"><div class="lab">Éligibilité</div><p>Un parcours oral demande l’absence de critère grave, une absorption possible, une adhésion fiable et un accès aux contrôles. Les 0,8 % seuls ne remplissent pas ces conditions.</p><div class="lab">Suivi</div><p>La numération et la parasitémie microscopique sont contrôlées toutes les 24 heures jusqu’à négativation des formes asexuées. Le lieu de soin est réévalué si une condition manque.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1 et §II.6 p. 5 imprimées</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-schemas" data-title="Riamet : cinq jours recommandés, trois jours en FI"><div class="lab">Guide clinique 2026</div><p>Pour falciparum non compliqué dès 35 kg, SSTTM/Swiss TPH prévoit quatre comprimés 20/120 mg à dix reprises de H0 à H108 : 40 comprimés sur cinq jours.</p><div class="lab">Information produit</div><p>La FI Riamet de décembre 2019 décrit six prises, 24 comprimés sur trois jours. Le guide ajoute quatre prises pour limiter les échecs tardifs chez des voyageurs non immuns ; le prescripteur documente l’écart et vérifie 40 comprimés.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §II tableau p. 2 et commentaire 1 p. 3 imprimées</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI suisse Riamet n° 54594, décembre 2019, « Posologie » et « Présentation »</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-grave" data-title="Forme grave : artésunate IV hospitalier"><div class="lab">Traitement recommandé</div><p>SSTTM/Swiss TPH recommande artésunate IV en première ligne. Pour l’adulte, la dose est 2,4 mg/kg à H0, H12, H24 puis quotidiennement. Le soutien d’organe et la parasitémie sont suivis en parallèle.</p><div class="lab">Produit réel</div><p>Le guide n’identifie pas le flacon hospitalier. Les listes Swissmedic du 30 septembre 2026 ne recensent pas de spécialité finie d’artésunate IV ; un stock importé reste possible et doit être vérifié sans retarder les soins.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §III p. 5–6 imprimées</a> ; <a href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener" data-reference-source="1">Swissmedic, listes autorisées, 30 septembre 2026</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-relais" data-title="Relais oral après artésunate IV"><div class="lab">Conditions cumulatives</div><p>Le patient est stable, tolère l’oral, présente une parasitémie &lt;1 % et a reçu au moins 24 heures d’artésunate IV. La cure orale complète commence 8 à 12 heures après la dernière dose IV.</p><div class="lab">Raison</div><p>L’artésunate réduit vite les parasites sans remplacer le traitement oral complet. La région d’acquisition et les interactions déterminent le produit de relais.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §III, tableau p. 5 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-suivi" data-title="Surveillance clinique et microscopique"><div class="lab">Rythme</div><p>La SSTTM/Swiss TPH demande numération et parasitémie microscopique toutes les 24 heures jusqu’à négativation. L’amélioration clinique et les anomalies biologiques sont lues ensemble.</p><div class="lab">Piège</div><p>Une hausse modérée dans les 24 à 36 premières heures peut refléter le cycle sanguin. Une aggravation clinique impose néanmoins une réévaluation immédiate.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §II.6 p. 5 et §III.4 p. 7 imprimées</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-recurrence" data-title="Fièvre qui revient après traitement"><div class="lab">Hypothèses</div><p>Une nouvelle fièvre peut signaler une recrudescence sanguine, une nouvelle infection ou une autre maladie. P. falciparum ne possède pas d’hypnozoïte hépatique responsable d’une rechute tardive.</p><div class="lab">Examen</div><p>La microscopie recherche les formes asexuées. Un test HRP2 ou une PCR isolément positifs peuvent persister après guérison et ne prouvent pas un échec.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §IV p. 7 et §V p. 8 imprimées</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS, WHO guidelines for malaria, 10 septembre 2026, glossaire p. PDF 265</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-hemolyse-retardee" data-title="Hémolyse retardée après artésunate IV"><div class="lab">Mécanisme</div><p>La rate retire des parasites d’hématies qui survivent temporairement avec une durée de vie réduite. Leur élimination différée peut abaisser l’hémoglobine après la clairance initiale.</p><div class="lab">Calendrier</div><p>Le guide suisse prévoit des contrôles à J7, J14, J21 et J28 après artésunate IV. Le même calendrier n’est pas imposé universellement après une forme non compliquée traitée oralement.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §III.2, p. 6 imprimée</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-prevention" data-title="Prévention d’un nouveau voyage"><div class="lab">Mesures</div><p>Les conseils dépendent de la destination et de la saison. La protection contre les piqûres comprend vêtements, répulsifs et moustiquaire ; une chimioprophylaxie est discutée selon le risque.</p><div class="lab">Limite</div><p>Une cure de Riamet traite l’épisode, mais sa FI ne l’indique pas comme prophylaxie. Le traitement de secours en voyage suit un plan et ne remplace pas l’accès aux soins.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Paludisme », prévention</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI suisse Riamet n° 54594, décembre 2019, « Mises en garde et précautions »</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-declaration" data-title="Déclaration du paludisme en Suisse"><div class="lab">Responsabilités</div><p>Après un résultat de laboratoire positif, le médecin déclare le cas au médecin cantonal sous une semaine. Le laboratoire transmet tous ses résultats positifs à l’OFSP sous une semaine avec l’espèce si connue.</p><div class="lab">Portée</div><p>Microscopie, antigène ou méthode moléculaire peuvent déclencher la déclaration. Ce calendrier de surveillance ne retarde jamais la prise en charge clinique.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, p. 88–89, §45, p. 88–89 imprimées</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="b50-pa-particuliers" data-title="Grossesse, enfance et atteinte d’organe"><div class="lab">Population</div><p>Le cas adulte non enceinte de 70 kg ne fournit aucun schéma universel pour un enfant ou une grossesse. Le guide suisse et la FI du produit exact définissent les adaptations nécessaires.</p><div class="lab">Sécurité</div><p>Une insuffisance rénale aiguë peut être d’abord un critère de gravité. La FI Riamet contre-indique l’insuffisance rénale ou hépatique sévère ; la FI Malarone distingue prophylaxie et traitement pour la fonction rénale.</p><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1, §II p. 4 et §III p. 5 imprimées</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI suisse Riamet n° 54594, décembre 2019, « Contre-indications »</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54150" target="_blank" rel="noopener" data-reference-source="1">FI suisse Malarone n° 54150, décembre 2025, « Posologie » et « Contre-indications »</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="pareto-b50-pa-comprendre" data-title="Comprendre le paludisme à falciparum"><p>Le frottis confirme P. falciparum à 0,8 %. Le parasite traverse le foie puis se multiplie dans les globules rouges. La fièvre et l’anémie reflètent la phase sanguine. La séquestration explique pourquoi la parasitémie périphérique ne résume pas l’atteinte des organes. Le voyage, l’examen et la biologie précisent la situation.</p><div class="key"><b>À retenir.</b> La décision s’appuie sur les données établies et sur les sources suisses applicables ; les inconnues du cas restent à vérifier.</div><div class="src">Sources : <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Paludisme », « Tableau clinique »</a> ; <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1 et §V p. 8 imprimées</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/d3c6488b-3ee6-41cb-960f-ddf0202cd74d/content" target="_blank" rel="noopener" data-reference-source="1">OMS, WHO guidelines for malaria, 10 septembre 2026, glossaire p. PDF 265</a>.</div></template>

<template data-pop="pareto-b50-pa-traiter" data-title="Décider du parcours thérapeutique"><p>Un seul critère grave, dont une parasitémie ≥2 % pour le clinicien peu expérimenté, mène au parcours hospitalier. Le guide suisse recommande cinq jours de Riamet pour falciparum non compliqué ; sa FI indique trois jours. Le Grand Mékong favorise l’alternative atovaquone/proguanil. La forme grave reçoit artésunate IV selon le produit réellement disponible.</p><div class="key"><b>À retenir.</b> La décision s’appuie sur les données établies et sur les sources suisses applicables ; les inconnues du cas restent à vérifier.</div><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §I p. 1, §II p. 2–3 et §III p. 5 imprimées</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">FI suisse Riamet n° 54594, décembre 2019, « Posologie »</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54150" target="_blank" rel="noopener" data-reference-source="1">FI suisse Malarone n° 54150, décembre 2025, « Posologie »</a>.</div></template>

<template data-pop="pareto-b50-pa-suivre" data-title="Confirmer la réponse et prévenir la récidive"><p>L’équipe contrôle le patient, la numération et les formes sanguines asexuées au microscope toutes les 24 heures jusqu’à négativation. Après artésunate IV, elle recherche l’hémolyse retardée à J7, J14, J21 et J28. Une nouvelle fièvre appelle une réévaluation ; la déclaration OFSP suit son propre délai d’une semaine.</p><div class="key"><b>À retenir.</b> La décision s’appuie sur les données établies et sur les sources suisses applicables ; les inconnues du cas restent à vérifier.</div><div class="src">Sources : <a href="https://www.swisstph.ch/fileadmin/user_upload/SwissTPH/Documents/Travel_Clinic/SwissTPH_Malaria_Tx_recommendations_1._September_2026.pdf" target="_blank" rel="noopener" data-reference-source="1">SSTTM/Swiss TPH, 1er septembre 2026, §II.6 p. 5, §III p. 6–7 et §V p. 8 imprimées</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, p. 88–89, §45 p. 88–89 imprimées</a>.</div></template>
