name: Codex_Sentinella — livraisons Claude

on:
  push:
    branches:
      - 'claude/**'
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: medina-codex-sentinella
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lire uniquement le code de confiance de main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Scanner les livraisons et informer Codex
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          import subprocess
          import sys

          env = os.environ.copy()
          credentials = base64.b64encode(
              ("x-access-token:" + env["GH_TOKEN"]).encode()
          ).decode()
          env.update({
              "GIT_CONFIG_COUNT": "1",
              "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
              "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + credentials,
          })
          state = Path(env["RUNNER_TEMP"]) / "medina-codex-sentinella"
          result = subprocess.run([
              sys.executable, "tools/codex_sentinella.py",
              "--repo-root", env["GITHUB_WORKSPACE"],
              "--state-dir", str(state),
              "--integration-branch", "main",
              "--notify",
          ], env=env)
          sys.exit(result.returncode)
          PY

      - name: Afficher le résultat et la limite de la veille
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "medina-codex-sentinella" / "sentinella.json"
          try:
              result = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              result = {"scan_status": "indisponible", "entries": [], "notifications": {}}
          notifications = result.get("notifications", {})
          entries = result.get("entries", [])
          lines = [
              "## Codex_Sentinella", "",
              "Scan : **" + str(result.get("scan_status")) + "**  ",
              "Têtes Claude portant un signal : **" + str(len({e.get("sha") for e in entries})) + "**  ",
              "Remises de fragment : **" + str(sum(e.get("kind") == "fragment_delivery" for e in entries)) + "**  ",
              "Consignes Claude : **" + str(sum(e.get("kind") == "claude_instruction" for e in entries)) + "**  ",
              "Nouvelles notifications : **" + str(len(notifications.get("created", []))) + "**  ",
              "Erreur de notification : **" + str(notifications.get("error")) + "**", "",
              "Une issue par empreinte de remise ou de consignes sert de file durable à Codex. "
              "Le fichier `sentinella.json` conserve l'ordre proposé pour les agents.",
              "La détection ne lance aucun audit, aucune injection et ne réveille pas une session Codex inactive.",
              "Les déclencheurs GitHub et la planification toutes les cinq minutes sont soumis aux délais d'Actions.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Conserver les preuves de réception
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medina-codex-sentinella-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/medina-codex-sentinella/sentinella.json
            ${{ runner.temp }}/medina-codex-sentinella/queue.json
            ${{ runner.temp }}/medina-codex-sentinella/status.json
            ${{ runner.temp }}/medina-codex-sentinella/state.json
          retention-days: 30
          if-no-files-found: warn
