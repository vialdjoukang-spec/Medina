name: MEDINA

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mission:
    name: MEDINA / mission et périmètre
    runs-on: ubuntu-latest
    # A direct push has happened already; this is a visible diagnostic.
    # Required pull-request checks and server rules provide prevention.
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      # For pull_request_target the controller and Python file come exclusively
      # from the trusted base, never the pull request. Candidate Git objects are
      # only read as data; no candidate checkout, import, build or install occurs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          fetch-depth: 0
          persist-credentials: false
      - name: Contrôler le diff et la réservation centrale
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || 'main' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Token is read by Git's credential helper, never interpolated in URL.
          git config --local credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          else
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$HEAD_SHA"
          if [[ ! -f tools/ai_session_guard.py ]]; then
            echo 'Bootstrap: guard absent in trusted base; activation requires a subsequent protected change.'
            exit 0
          fi
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_BRANCH")
          if [[ "$EVENT_NAME" == "push" ]]; then
            args+=(--integrated)
            echo 'Post-push detection only: enforce PRs and this required check with server branch protection.'
          fi
          python3 tools/ai_session_guard.py check "${args[@]}"
