name: Publier MEDINA sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Vérifier les preuves et verrous des fragments avant publication
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if test -z "$base" || test "$base" = 0000000000000000000000000000000000000000; then
            base=$(git rev-parse HEAD^)
          fi
          python3 tools/espace.py garde "$base" HEAD
      - name: Vérifier les tests Python
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Construire MEDINA et ses fragments
        env:
          MEDINA_OUT: ${{ github.workspace }}/dist
        run: |
          python build_front.py
          python build_front.py --all-fragments
          python tools/build_fragment_work_preview.py --output dist/apercus/infectiologie.html
      - name: Assembler le site
        run: |
          mkdir -p _site/fragments _site/apercus
          cp dist/MEDINA.html _site/MEDINA.html
          cp dist/fragments/*.html _site/fragments/
          cp dist/apercus/*.html _site/apercus/
          python build_index.py --fragments-dir _site/fragments --output _site/index.html
          python tools/build_organisation.py --output _site/organisation.html
      - name: Installer Chromium pour contrôler les cours en rédaction
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Contrôler l’aperçu Infectiologie sur ordinateur et mobile
        run: |
          python tests/verify_fragment_work_preview.py \
            --url "file://$GITHUB_WORKSPACE/_site/apercus/infectiologie.html" \
            --sources "livraisons/Livraison Codex/I-03-Infectiologie/travail/PRODUCTION_FRAGMENT_2026-10-08/sources" \
            --output _site/apercus/controle
      - name: Produire une capture animée du cours VIH
        run: |
          python tools/build_preview_capture_animation.py \
            --url "file://$GITHUB_WORKSPACE/_site/apercus/infectiologie.html#/entry/B24" \
            --output _site/apercus/controle
      - name: Conserver les captures et le rapport de lecture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-cours-infectiologie
          path: _site/apercus/controle
          if-no-files-found: warn
      - name: Auditer les fragments
        env:
          MEDINA_FRAGMENTS: ${{ github.workspace }}/_site/fragments
        run: python tests/audit_fragments.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
