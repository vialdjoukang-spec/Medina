name: Cycle 2 - sources complementaires
on:
  push:
    branches: [codex/cycles-20261014-0800]
    paths: [.github/workflows/cycle2-supplementary-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recuperer les sources publiques temporaires
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.request,urllib.parse
          out=pathlib.Path('cycle2-supplementary-sources');out.mkdir()
          urls={
            'platelet.xml':'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3134593/fullTextXML',
            'luks-transferrin.html':'https://analysenverzeichnis.luks.ch/analysis/Transferrin',
            'luks-tsat.html':'https://analysenverzeichnis.luks.ch/analysis/Transferrinsaettigung',
            'newcastle-transferrin.html':'https://laboratories.newcastle-hospitals.nhs.uk/test-directory/transferrin-serum/',
            'commons-platelet.html':'https://commons.wikimedia.org/wiki/File:Platelet_aggregation_pathway.png',
            'commons-willis.html':'https://commons.wikimedia.org/wiki/File:Circle_of_Willis_fr.svg',
            'heme-search.json':'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.3390/cells9030579&format=json'}
          for gene in ('TBXAS1','TBXA2R','F2','F2R','ADCY3','GNAS','P2RY1','P2RX1','HMBS','UROS','UROD','CPOX','PPOX','ALAD'):
              urls['hgnc-'+gene+'.json']='https://rest.genenames.org/fetch/symbol/'+gene
          def fetch(item):
              name,url=item;record={'file':name,'url':url,'attempted_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MEDINA-Cycle2-Verification/1.0','Accept':'application/json' if name.endswith('.json') else '*/*'})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      data=response.read(16*1024*1024+1)
                      if len(data)>16*1024*1024:raise ValueError('Response too large')
                      if name.endswith('.xml') and b'<article' not in data:raise ValueError('Not an article XML')
                      if name.endswith('.json'):json.loads(data)
                      out.joinpath(name).write_bytes(data);record.update(ok=True,final_url=response.geturl(),bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as exc:record.update(ok=False,error=str(exc))
              return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(fetch,urls.items()))
          search=out/'heme-search.json'
          if search.exists():
              matches=json.loads(search.read_text()).get('resultList',{}).get('result',[])
              pmcid=next((m['pmcid'] for m in matches if m.get('pmcid')),None)
              if pmcid:records.append(fetch(('heme.xml','https://www.ebi.ac.uk/europepmc/webservices/rest/'+pmcid+'/fullTextXML')))
          out.joinpath('MANIFEST.json').write_text(json.dumps({'purpose':'Archives temporaires de consultation; pas une attestation de lecture ni un audit. Ne pas republier les textes intégraux.','sources':records},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([{'file':r['file'],'ok':r['ok']} for r in records]))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: medina-cycle2-supplementary-sources-${{ github.run_id }}
          path: cycle2-supplementary-sources/
          retention-days: 3
