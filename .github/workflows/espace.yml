name: Garde des fragments MEDINA

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  garde-espace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Vérifier les refus et les verrous des fragments
        run: python3 -m unittest discover -s tests -p test_espace_fragments.py
      - name: Vérifier les gardes du cycle autorisé
        run: python3 -m unittest discover -s tests -p test_tetrade_cycle.py
      - name: Vérifier la chaîne nocturne et son échéance de publication
        run: python3 -m unittest tests.test_night_cycle tests.test_publication_manifest
      - name: Vérifier les deux espaces Novo et les transactions d'injection
        run: python3 -m unittest tests.test_cycle_claude tests.test_novo_cycle tests.test_novo_cycle_gate tests.test_betta_cycle tests.test_betta_injecter
      - name: Vérifier les réparations techniques sans audit médical
        run: python3 -m unittest tests.test_clov2_veille tests.test_medina_resume tests.test_medina_unblock tests.test_pages_scope tests.test_glossary_loader
      - name: Refuser une injection prématurée ou une réouverture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if test -z "$base" || test "$base" = 0000000000000000000000000000000000000000; then
            base=$(git merge-base "$HEAD_SHA" origin/main)
          fi
          python3 tools/espace.py garde "$base" "$HEAD_SHA"
