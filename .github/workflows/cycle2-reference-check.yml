name: Cycle 2 - références et moteur de contrôle

on:
  push:
    branches: [codex/cycles-20261014-0800]
    paths: [.github/workflows/cycle2-reference-check.yml]

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Recueillir les références publiques sans les injecter au dépôt
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, subprocess, urllib.request, zipfile
          root = pathlib.Path('.')
          out = pathlib.Path('cycle2-reference-material')
          out.mkdir()
          urls = {
            'bern.pdf': 'https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf',
            'ssed-technology.pdf': 'https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf',
            'ssed-drive.pdf': 'https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf',
            'ssed-foot.pdf': 'https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf',
            'jbds-dka.pdf': 'https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf',
            'kdigo-2024.pdf': 'https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf',
            'swiss-cda.pdf': 'https://www.mqzh.ch/cm/images/mq20152/pdf/bph2015_2_d.pdf',
            'cscq.pdf': 'https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf',
            'sidero.xml': 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML',
            'cda.xml': 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML',
            'renal-ultrasound.xml': 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4808817/fullTextXML',
            'heme.html': 'https://www.mdpi.com/2073-4409/9/3/579',
            'perfusion.xml': 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8576366/fullTextXML',
            'fi-aspirine.html': 'https://amiko.oddb.org/fr/fi?gtin=7680517950406',
            'fi-sortis.html': 'https://amiko.oddb.org/fr/fi?gtin=7680540850285',
            'fi-eliquis.html': 'https://amiko.oddb.org/fr/fi?gtin=7680615490026',
            'fi-baqsimi.html': 'https://amiko.oddb.org/fr/fi?gtin=7680674650010',
            'fi-kerendia.html': 'https://amiko.oddb.org/fr/fi?gtin=7680681300014',
            'fi-aranesp.html': 'https://amiko.oddb.org/fr/fi?gtin=7680557250047',
            'fi-benadon.html': 'https://amiko.oddb.org/fr/fi?gtin=7680256350192',
            'fi-exjade.html': 'https://amiko.oddb.org/fr/fi?gtin=7680574660010',
            'fi-pegasys.html': 'https://amiko.oddb.org/fr/fi?gtin=7680555850126',
            'fi-zyvoxid.html': 'https://amiko.oddb.org/fr/fi?gtin=7680555580054'
          }
          def fetch(item):
              name, url = item
              rec = {'file': name, 'url': url, 'attempted_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'MEDINA-Cycle2-SourceVerification/1.0', 'Accept': '*/*'})
                  with urllib.request.urlopen(req, timeout=50) as response:
                      data = response.read(32 * 1024 * 1024 + 1)
                      if len(data) > 32 * 1024 * 1024:
                          raise ValueError('Source exceeds bounded retrieval size')
                      if name.endswith('.pdf') and not data.startswith(b'%PDF'):
                          raise ValueError('Response is not a PDF; no substitution accepted')
                      if name.endswith('.xml') and b'<article' not in data:
                          raise ValueError('Response is not article XML')
                      out.joinpath(name).write_bytes(data)
                      rec.update(ok=True, final_url=response.geturl(), content_type=response.headers.get('Content-Type'), bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
              except Exception as exc:
                  rec.update(ok=False, error=str(exc))
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(fetch, urls.items()))
          manifest = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'purpose': 'Consultation temporaire des sources publiques pour corriger Cycle 2. Téléchargement ne vaut pas lecture ni audit. Aucun fichier source externe réinjecté au dépôt.', 'sources': results}
          out.joinpath('FETCH_MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          with zipfile.ZipFile('cycle2-engine.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  if name.startswith(('engine/', 'shell/', 'nosology/', 'nosologyEngine/', 'modules/', 'preview/', 'sources/')) and pathlib.Path(name).is_file() and not pathlib.Path(name).is_symlink():
                      z.write(name, name)
          print(json.dumps([{'file': r['file'], 'ok': r['ok']} for r in results]))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: medina-cycle2-reference-material-${{ github.sha }}
          path: |
            cycle2-reference-material/
            cycle2-engine.zip
          retention-days: 3
          if-no-files-found: error
