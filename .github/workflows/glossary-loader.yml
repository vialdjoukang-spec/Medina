name: Chargeur et aperçu isolé MEDINA

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glossary-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Préserver les priorités, les empreintes et la compilation réelle de l'aperçu
        run: python3 -m unittest tests.test_glossary_loader tests.test_fragment_work_preview
      - name: Vérifier la suite technique complète sur le clone GitHub
        run: python3 -m unittest discover -s tests
