name: MEDINA - Deblocage delegue
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read
  statuses: read
concurrency:
  group: medina-unblock
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Tester les limites de delegation
        run: python3 -m unittest discover -s tests -p test_medina_unblock.py -v
      - name: Scanner sans modifier les branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/medina_unblock.py
