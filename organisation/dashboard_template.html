-radius:10px;padding:8px 12px;font-size:.81rem;font-weight:bold;color:#24536b;text-decoration:none}.action:hover{background:#f2f8fc}.action.primary{background:#1f513c;border-color:#1f513c;color:#fff}.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:24px 1px 12px}.section-heading h2{margin:0}.section-heading p{margin:0;font-size:.81rem;color:var(--muted)}.block-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.block-card{width:100%;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);min-height:132px}.block-card:hover{background:#f0f7fb;border-color:#83aabd}.block-code{display:inline-block;color:#385d70;background:#eaf4fb;font-weight:bold;font-size:.78rem;padding:3px 9px;border-radius:7px;margin-bottom:10px}.block-title{font-weight:bold;line-height:1.45;font-size:.97rem;overflow-wrap:anywhere}.block-foot{margin-top:auto;padding-top:12px;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;width:100%;gap:10px}.block-foot b{color:#185b7d}.block-summary{background:#eaf4fb;border:1px solid var(--line);padding:22px 25px;border-radius:var(--radius);margin-bottom:18px}.block-summary h1{margin-top:8px}.block-summary p{font-size:.87rem;margin-bottom:0}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 17px}.status{display:inline-block;vertical-align:middle;padding:4px 9px;border-radius:8px;font-size:.73rem;font-weight:bold;line-height:1.4;white-space:normal}.status.primary{background:#e3f1e8;color:#24513b}.status.covered{background:#eee9f6;color:#624576}.status.planned{background:#fff0d8;color:#88500e}.legend .status{font-size:.72rem}.lesson-list{display:flex;flex-direction:column;gap:9px}.lesson-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}.lesson-row.selected{border-color:#4f94b4;background:#f0f8fc}.rank{color:#466479;text-align:center;font-size:.7rem;line-height:1.3}.rank strong{display:block;color:#214b64;font-size:1.03rem;margin-top:2px}.lesson-main{display:block;padding:0;border:0;background:transparent;text-align:left;min-width:0}.lesson-title{display:block;color:#173349;font-weight:bold;line-height:1.45;font-size:.94rem;overflow-wrap:anywhere}.lesson-code{color:#1a6574}.lesson-sub{display:block;margin-top:7px;font-size:.76rem;color:var(--muted);line-height:1.5}.lesson-open{font-size:.76rem;font-weight:bold;border:1px solid #b8d0dc;border-radius:9px;padding:7px 10px;text-decoration:none;white-space:nowrap;background:#f7fbfd}.planned-mark{font-size:.75rem;color:#805725;padding:4px 7px}.detail-card{border:1px solid #aac8d6;background:#fff;border-radius:18px;margin-bottom:19px;padding:23px 25px;box-shadow:0 7px 20px #17334908}.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.detail-top .rank{background:#eaf4fb;border-radius:11px;min-width:72px;padding:10px 12px;flex-shrink:0}.detail-top h2{font-size:1.15rem}.detail-card dl{display:grid;grid-template-columns:155px minmax(0,1fr);gap:9px 17px;margin:17px 0;font-size:.87rem}.detail-card dt{font-weight:bold;color:#476271}.detail-card dd{margin:0;color:#253d4b;overflow-wrap:anywhere}.detail-note{background:#f1f7fa;border-radius:10px;padding:11px 13px;font-size:.84rem;margin:15px 0 0;line-height:1.6}.empty{background:#fff;border:1px dashed #a8c6d6;border-radius:var(--radius);padding:25px;color:#445f6e}.empty p:last-child{margin-bottom:0}.search-summary{background:#eaf4fb;border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:15px}.search-summary p{margin:0;font-size:.86rem}.search-result-context{display:block;font-size:.73rem;line-height:1.5;margin-top:6px;color:#557183}.more-button{display:block;margin:20px auto 0;padding:11px 18px;border:1px solid #98bacd;backgro <body>
<a class="skip-link" href="#main-content">Aller aux leçons</a>
<header class="topbar">
  <a class="brand" href="#" aria-label="MEDINA, accueil de l’organisation"><span class="brand-mark" aria-hidden="true">M</span><span><strong>MEDINA</strong><small>Organisation des leçons</small></span></a>
  <button class="menu-button" id="menu-toggle" type="button" aria-controls="fragment-sidebar" aria-expanded="false"><span aria-hidden="true">☰</span><span class="menu-word">Fragments</span></button>
  <nav class="top-links" id="global-links" aria-label="Accès à MEDINA et aux livraisons"></nav>
</header>
<button class="drawer-shade" id="drawer-shade" type="button" aria-label="Fermer la liste des fragments" tabindex="-1"></button>
<aside class="sidebar" id="fragment-sidebar" aria-label="Fragments MEDINA">
  <div class="sidebar-head"><div><h2>Ordre de production</h2><small id="fragment-total"></small></div><button class="close-nav" id="close-nav" type="button">Fermer ×</button></div>
  <nav class="fragment-nav" id="fragment-nav" aria-label="Liste des fragments"></nav>
  <div class="actions" id="sidebar-links" aria-label="Dossiers et document de référence"></div>
  <p class="sidebar-note">Ordre théorique proposé ; priorités du plan, puis catalogue. Le rang ne mesure pas la complétude du fragment.</p>
</aside>
<main class="page" id="main-content" tabindex="-1">
 <div class="page-inner">
  <div class="search-bar"><label class="search-label" for="lesson-search">Rechercher</label><input class="search-input" id="lesson-search" type="search" autocomplete="off" placeholder="Code CIM ou titre, dans tous les fragments…"><button class="clear-search" id="clear-search" type="button" hidden>Effacer</button></div>
  <div class="reference-note" id="reference-note"></div>
  <div id="view"></div>
  <footer class="page-footer" id="page-footer"></footer>
 </div>
</main>
<div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
<script type="application/json" id="medina-data">__MEDINA_DATA__</script>
<script>
(()=>{
 'use strict';
 let DATA;
 try{DATA=JSON.parse(document.getElementById('medina-data').textContent)}catch(error){document.getElementById('view').textContent='Le catalogue des leçons ne peut pas être ouvert.';return}
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const norm=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const safeUrl=value=>{const u=String(value??'').trim();if(!u||/[\u0000-\u001f\u007f]/.test(u)||u.startsWith('//'))return '';if(/^https?:\/\//i.test(u))return u;if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';return u};
 const link=(url,text,classes='action')=>{const u=safeUrl(url);return u?'<a class="'+esc(classes)+'" href="'+esc(u)+'">'+esc(text)+'</a>':''};
 const rank=value=>value!=null&&value!==''&&Number.isFinite(Number(value))?String(Number(value)).padStart(2,'0'):'—';
 const dateLabel=value=>{const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value);const options={day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Zurich'};if(/T\d{2}:\d{2}/.test(String(value))){options.hour='2-digit';options.minute='2-digit'}return new Intl.DateTimeFormat('fr-CH',options).format(date)};
 const statusNames={primary:'Cours propre intégré',covered:'Regroupement déclaré',planned:'À produire'};
 const status=category=>['primary','covered'].includes(category.status)&&category.course?category.status:'planned';
 const badge=category=>'<span class="status '+status(category)+'">'+statusNames[status(category)]+'</span>';
 const fragments=(DATA.fragments||[]).slice().sort((a,b)=>Number(a.order)-Number(b.order));
 const fragmentMap=new Map(fragments.map(f=>[String(f.id),f]));
 const allCategories=[];
 fragments.forEach(fragment=>(fragment.blocks||[]).forEach(block=>(block.categories||[]).forEach(category=>allCategories.push({fragment,block,category,haystack:norm([category.code,category.title,fragment.label,fragment.specialty,block.code,block.title,category.course?.code,category.course?.title].join(' '))}))));
 const view=document.getElementById('view'),search=document.getElementById('lesson-search'),sidebar=document.getElementById('fragment-sidebar'),toggle=document.getElementById('menu-toggle'),shade=document.getElementById('drawer-shade');
 const mobile=matchMedia('(max-width:1000px)');
 let state={},searchLimit=120,searchTimer=null;
 function href(next){const p=new URLSearchParams();if(next.search){p.set('search',next.search)}else{if(next.fragment)p.set('fragment',next.fragment);if(next.block)p.set('block',next.block);if(next.category)p.set('category',next.category)}return '#'+p.toString()}
 function parseHash(){const raw=location.hash.slice(1);if(raw==='main-content')return state.fragment?state:{fragment:fragments[0]?.id};let p;try{p=new URLSearchParams(raw)}catch(error){p=new URLSearchParams()}const query=(p.get('search')||p.get('q')||'').trim();if(query)return {search:query};const fragment=fragmentMap.get(p.get('fragment')||p.get('f'))||fragments[0];if(!fragment)return {};const block=(fragment.blocks||[]).find(b=>String(b.code)===(p.get('block')||p.get('b')));const category=block&&(block.categories||[]).find(c=>String(c.code)===(p.get('category')||p.get('c')));return {fragment:fragment.id,...(block?{block:block.code}:{}),...(category?{category:category.code}:{})}}
 function navigate(next,{replace=false,focus=true}={}){const target=href(next);state=next;if(replace){try{history.replaceState(null,'',target)}catch(error){location.hash=target}render(focus)}else if(location.hash===target){render(focus)}else{location.hash=target}}
 function drawer(open,returnFocus=false){const on=mobile.matches&&open;sidebar.classList.toggle('open',on);shade.classList.toggle('open',on);toggle.setAttribute('aria-expanded',String(on));sidebar.inert=mobile.matches&&!on;document.getElementById('main-content').inert=on;if(on){(sidebar.querySelector('[aria-current="page"]')||sidebar.querySelector('button'))?.focus()}else if(returnFocus&&mobile.matches){toggle.focus()}}
 function blockButton(fragment,block){return '<button class="block-card" type="button" data-fragment="'+esc(fragment.id)+'" data-block="'+esc(block.code)+'" data-block-code="'+esc(block.code)+'"><span class="block-code">'+esc(block.code)+'</span><span class="block-title">'+esc(block.title)+'</span><span class="block-foot"><span>'+esc((block.categories||[]).length)+' catégories CIM</span><b>Voir les leçons →</b></span></button>'}
 function lessonRow(fragment,block,category,{context=false}={}){const own=status(category)==='primary',grouped=status(category)==='covered';const subtitle=grouped?'Référence : '+category.course.code+' · '+category.course.title:own?'Cours : '+category.course.code+' · '+category.course.title:'';const selected=state.fragment===fragment.id&&state.block===block.code&&state.category===category.code;return '<div class="lesson-row'+(selected?' selected':'')+'"><span class="rank">Rang<strong>'+esc(rank(category.order))+'</strong></span><button class="lesson-main" type="button" data-fragment="'+esc(fragment.id)+'" data-block="'+esc(block.code)+'" data-category="'+esc(category.code)+'" data-category-code="'+esc(category.code)+'"><span class="lesson-title"><span class="lesson-code">'+esc(category.code)+'</span> — '+esc(category.title)+'</span><span class="lesson-sub">'+badge(category)+(subtitle?' <span>'+esc(subtitle)+'</span>':'')+'</span>'+(context?'<span class="search-result-context">'+esc(fragment.label)+' · '+esc(block.code)+' — '+esc(block.title)+'</span>':'')+'</button>'+(category.course?link(category.course.url,'Ouvrir le cours ↗','lesson-open'):'<span class="planned-mark">Cours à produire</span>')+'</div>'}
 function relatedLessons(fragment){const related=(fragment.related||[]).slice().sort((a,b)=>Number(a.order)-Number(b.order));if(!related.length)return '';return '<section aria-labelledby="related-title"><div class="section-heading"><h2 id="related-title">Chapitres du plan rattachés à d’autres fragments</h2></div><p class="lesson-sub">Ces références complètent le parcours thématique. Leur catégorie reste rattachée au fragment indiqué.</p><div class="lesson-list">'+related.map(r=>{const s=['primary','covered'].includes(r.status)?r.status:'planned';return '<div class="lesson-row" data-related-code="'+esc(r.code)+'"><span class="rank">Plan<strong>'+esc(rank(r.order))+'</strong></span><div><span class="lesson-title"><span class="lesson-code">'+esc(r.code)+'</span> — '+esc(r.title)+'</span><span class="lesson-sub"><span class="status '+s+'">'+statusNames[s]+'</span></span><span class="search-result-context">'+esc(r.fragment_label)+'</span></div>'+link(r.url,'Accéder ↗','lesson-open')+'</div>'}).join('')+'</div></section>'}
 function fragmentActions(fragment){return '<div class="actions">'+link(fragment.url,'Ouvrir le fragment ↗','action primary')+link(fragment.source_url,'Consulter les sources')+link(fragment.delivery_codex_url,'Livraison Codex')+link(fragment.delivery_claude_url,'Livraison Claude')+'</div>'}
 function fragmentHeader(fragment){return '<header class="fragment-cover"><span class="eyebrow">Fragment · rang de production '+esc(rank(fragment.order))+'</span><h1 tabindex="-1" id="view-title">'+esc(fragment.label)+'</h1><p>'+esc(fragment.specialty)+'</p><div class="counts"><span class="count"><strong>'+esc(fragment.category_count??0)+'</strong>catégories du catalogue</span><span class="count"><strong>'+esc(fragment.integrated_count??0)+'</strong>cours intégrés</span><span class="count"><strong>'+esc((fragment.blocks||[]).length)+'</strong>blocs CIM</span></div><p class="lesson-sub">Ordre théorique proposé ; priorités du plan, puis catalogue.</p>'+fragmentActions(fragment)+'</header>'}
 function breadcrumbs(fragment,block,category){return '<nav class="breadcrumbs" aria-label="Fil d’Ariane"><button class="crumb-button" type="button" data-fragment="'+esc(fragment.id)+'">'+esc(fragment.label)+'</button>'+(block?'<span class="crumb-sep" aria-hidden="true">›</span>'+(category?'<button class="crumb-button" type="button" data-fragment="'+esc(fragment.id)+'" data-block="'+esc(block.code)+'">Bloc '+esc(block.code)+' — '+esc(block.title)+'</button>':'<span>Bloc '+esc(block.code)+' — '+esc(block.title)+'</span>'):'')+(category?'<span class="crumb-sep" aria-hidden="true">›</span><span>'+esc(category.code)+' — '+esc(category.title)+'</span>':'')+'</nav>'}
 function categoryDetail(fragment,block,category){const categoryStatus=status(category);let message;if(categoryStatus==='primary'){message='Cours disponible. L’exhaustivité de la leçon reste à vérifier.'}else if(categoryStatus==='covered'){message='Regroupement déclaré. Les particularités de cette catégorie restent à vérifier dans le cours de référence.'}else{message='Cette leçon reste à produire.'}const course=category.course;return '<section class="detail-card" aria-labelledby="category-title"><div class="detail-top"><div><span class="eyebrow">Catégorie CIM · leçon</span><h2 id="category-title" tabindex="-1"><span class="lesson-code">'+esc(category.code)+'</span> — '+esc(category.title)+'</h2>'+badge(category)+'</div><div class="rank">Ordre<br>théorique<strong>'+esc(rank(category.order))+'</strong></div></div><dl><dt>Fragment</dt><dd>'+esc(fragment.label)+'</dd><dt>Bloc CIM</dt><dd>'+esc(block.code)+' — '+esc(block.title)+'</dd><dt>Cours de référence</dt><dd>'+(course?esc(course.code)+' — '+esc(course.title):'À produire')+'</dd>'+(course?.fragment_id&&String(course.fragment_id)!==String(fragment.id)?'<dt>Lieu du cours</dt><dd>'+esc(course.fragment_label)+'</dd>':'')+'</dl><p class="detail-note">'+esc(message)+'</p>'+(course?'<div class="actions">'+link(course.url,'Ouvrir '+course.code+' — '+course.title,'action primary')+'</div>':'')+'</section>'}
 function renderFragment(fragment){const block=(fragment.blocks||[]).find(b=>String(b.code)===String(state.block));const category=block&&(block.categories||[]).find(c=>String(c.code)===String(state.category));if(!block){const blocks=(fragment.blocks||[]).slice().sort((a,b)=>{const ra=Math.min(...(a.categories||[]).map(c=>Number(c.order)||Infinity));const rb=Math.min(...(b.categories||[]).map(c=>Number(c.order)||Infinity));return ra-rb||String(a.code).localeCompare(String(b.code),'fr')});return breadcrumbs(fragment)+fragmentHeader(fragment)+(blocks.length?'<div class="section-heading"><h2>Blocs de la classification</h2><p>Un bloc regroupe plusieurs catégories. Chaque catégorie ouvre sa fiche de leçon.</p></div><div class="block-grid">'+blocks.map(b=>blockButton(fragment,b)).join('')+'</div>':'<section class="empty"><h2>Catégories à rattacher</h2><p>Aucune catégorie de la classification n’est encore assignée à ce fragment.</p><p>Son périmètre doit être constitué avant la production des leçons.</p></section>')+relatedLessons(fragment)}const cats=(block.categories||[]).slice().sort((a,b)=>Number(a.order)-Number(b.order)||String(a.code).localeCompare(String(b.code),'fr'));return breadcrumbs(fragment,block,category)+'<header class="block-summary"><span class="eyebrow">'+esc(fragment.label)+'</span><span class="block-code">Bloc '+esc(block.code)+'</span><h1 id="view-title" tabindex="-1">'+esc(block.title)+'</h1><p>'+esc(cats.length)+' catégories dans ce bloc. Ordre théorique proposé ; priorités du plan, puis catalogue.</p></header>'+(category?categoryDetail(fragment,block,category):'')+'<div class="section-heading"><h2>Catégories et leçons</h2><p>Code CIM · intitulé complet · ordre théorique</p></div><div class="legend" aria-label="Statuts des leçons"><span class="status primary">Cours propre intégré</span><span class="status covered">Regroupement déclaré</span><span class="status planned">À produire</span></div><div class="lesson-list">'+cats.map(c=>lessonRow(fragment,block,c)).join('')+'</div>'}
 function renderSearch(){const words=norm(state.search).split(' ').filter(Boolean);const found=allCategories.filter(c=>words.every(w=>c.haystack.includes(w))).sort((a,b)=>Number(a.fragment.order)-Number(b.fragment.order)||Number(a.category.order)-Number(b.category.order));const visible=found.slice(0,searchLimit);return '<header class="search-summary"><span class="eyebrow">Recherche dans tous les fragments</span><h1 id="view-title" tabindex="-1">'+esc(state.search)+'</h1><p>'+esc(found.length)+' catégorie'+(found.length===1?'':'s')+' correspond'+(found.length===1?'':'ent')+' à la recherche'+(found.length>visible.length?' · '+esc(visible.length)+' affichées':'')+'.</p></header>'+(visible.length?'<div class="lesson-list">'+visible.map(x=>lessonRow(x.fragment,x.block,x.category,{context:true})).join('')+'</div>':'<section class="empty"><h2>Aucune correspondance</h2><p>Essayez un code CIM, un terme médical ou le nom d’une spécialité.</p></section>')+(found.length>visible.length?'<button class="more-button" type="button" data-more-search>Afficher les résultats suivants</button>':'')}
 function render(focus=false){state=parseHash();if(search.value!==(state.search||''))search.value=state.search||'';document.getElementById('clear-search').hidden=!state.search;document.querySelectorAll('.fragment-button').forEach(b=>{if(b.dataset.fragment===state.fragment)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(state.search){view.innerHTML=renderSearch();document.title='MEDINA · Recherche : '+state.search}else{const fragment=fragmentMap.get(String(state.fragment));view.innerHTML=fragment?renderFragment(fragment):'<section class="empty"><h1>Le catalogue est vide</h1></section>';document.title=fragment?'MEDINA · '+fragment.label:'MEDINA · Organisation des leçons'}document.getElementById('announcement').textContent=state.search?'Résultats de recherche affichés.':(fragmentMap.get(String(state.fragment))?.label||'Catalogue affiché.');if(focus){drawer(false);(document.getElementById('category-title')||document.getElementById('view-title'))?.focus({preventScroll:true});document.getElementById('view').scrollIntoView({block:'start',behavior:'instant'})}}
 const links=DATA.links||{};
 document.getElementById('global-links').innerHTML=link(links.online,'MEDINA en ligne ↗','main-top')+link(links.repository,'Dépôt GitHub','secondary-top')+link(links.codex,'Dossier Codex','secondary-top')+link(links.claude,'Dossier Claude','secondary-top')+link(links.html,'HTML de référence','secondary-top');
 document.getElementById('sidebar-links').innerHTML=link(links.codex,'Dossier Codex')+link(links.claude,'Dossier Claude')+link(links.html,'HTML de référence');
 document.getElementById('fragment-total').textContent=fragments.length+' fragments · codes et intitulés';
 document.getElementById('fragment-nav').innerHTML=fragments.map(f=>'<button type="button" class="fragment-button" data-fragment="'+esc(f.id)+'" data-fragment-id="'+esc(f.id)+'"><span class="fragment-label">'+esc(f.label)+'</span><span class="fragment-meta">'+esc(f.category_count??0)+' catégories · '+esc(f.integrated_count??0)+' cours intégrés</span></button>').join('');
 const version=DATA.catalogue?.version||'CIM-10-GM 2024';
 document.getElementById('reference-note').innerHTML='<span class="ref-pill">'+esc(version)+'</span><p>Les intitulés proviennent du catalogue historique. La couverture exhaustive CIM-11 n’est pas établie.</p>';
 document.getElementById('page-footer').innerHTML='<span>'+esc(DATA.catalogue?.integrated_courses??0)+' cours intégrés · '+esc(DATA.catalogue?.total_categories??0)+' catégories du catalogue</span>'+link(links.protocol,'Organisation et livraisons','footer-link')+(DATA.generated_at?'<span>État du '+esc(dateLabel(DATA.generated_at))+'</span>':'');
 document.addEventListener('click',event=>{const b=event.target.closest('button[data-fragment]');if(b){searchLimit=120;navigate({fragment:b.dataset.fragment,...(b.dataset.block?{block:b.dataset.block}:{}),...(b.dataset.category?{category:b.dataset.category}:{})});return}if(event.target.closest('[data-more-search]')){searchLimit+=120;render(false)}});
 search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{searchLimit=120;const query=search.value.trim();navigate(query?{search:query}:{fragment:state.fragment||fragments[0]?.id},{replace:true,focus:false})},150)});
 document.getElementById('clear-search').addEventListener('click',()=>{clearTimeout(searchTimer);searchLimit=120;search.value='';navigate({fragment:fragments[0]?.id},{replace:true,focus:false});search.focus()});
 toggle.addEventListener('click',()=>drawer(!sidebar.classList.contains('open')));shade.addEventListener('click',()=>drawer(false,true));document.getElementById('close-nav').addEventListener('click',()=>drawer(false,true));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sidebar.classList.contains('open'))drawer(false,true)});
 mobile.addEventListener('change',()=>drawer(false));window.addEventListener('hashchange',()=>render(true));drawer(false);render(false);
})();
</script>
</body>
</html>
