 const link=(url,text,classes='action')=>{const u=safeUrl(url);return u?'<a class="'+esc(classes)+'" href="'+esc(u)+'">'+esc(text)+'</a>':''};
 const rank=value=>value!=null&&value!==''&&Number.isFinite(Number(value))?String(Number(value)).padStart(2,'0'):'—';
 const dateLabel=value=>{const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value);const options={day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Zurich'};if(/T\d{2}:\d{2}/.test(String(value))){options.hour='2-digit';options.minute='2-digit'}return new Intl.DateTimeFormat('fr-CH',options).format(date)};
 const statusNames={primary:'Cours propre intégré',covered:'Regroupement déclaré',planned:'À produire'};
 const status=category=>['primary','covered'].includes(category.status)&&category.course?category.status:'planned';
 const badge=category=>'<span class="status '+status(category)+'">'+statusNames[status(category)]+'</span>';
 const fragments=(DATA.fragments||[]).slice().sort((a,b)=>Number(a.order)-Number(b.order));
 const fragmentMap=new Map(fragments.map(f=>[String(f.id),f]));
 const courseRef=category=>category.group||category.course;
 const blockOrder=(fragment,block)=>(fragment.blocks||[]).findIndex(item=>item.code===block.code)+1;
 const categoryColour=(fragment,block)=>'hsl('+Math.round((blockOrder(fragment,block)*137.508+187)%360)+' 82% 73%)';
 function chaptersInBlock(fragment,block){
  const grouped=new Map();
  (block.categories||[]).forEach(category=>{const reference=courseRef(category),key=reference?(reference.fragment_id||fragment.id)+'/'+reference.code:fragment.id+'/'+category.code;if(!grouped.has(key))grouped.set(key,{categories:[],reference,key});grouped.get(key).categories.push(category)});
  const result=[...grouped.values()].sort((a,b)=>Math.min(...a.categories.map(c=>Number(c.order)))-Math.min(...b.categories.map(c=>Number(c.order))));
  result.forEach((group,index)=>{group.categories.sort((a,b)=>Number(a.order)-Number(b.order));group.representative=group.categories.find(category=>category.code===group.reference?.code)||group.categories[0];group.code=group.reference?.code||group.representative.code;group.title=group.reference?.title||group.representative.title;group.order=index+1;group.available=!!group.reference&&group.reference.integrated!==false&&group.categories.some(category=>status(category)!=='planned');group.renvoi=!!group.reference&&!group.categories.some(category=>category.code===group.reference.code)});
  return result;
 }
 const allCategories=[];
 fragments.forEach(fragment=>(fragment.blocks||[]).forEach(block=>(block.categories||[]).forEach(category=>allCategories.push({fragment,block,category,haystack:norm([category.code,category.title,fragment.label,fragment.specialty,block.code,block.title,category.course?.code,category.course?.title].join(' '))}))));
 const view=document.getElementById('view'),search=document.getElementById('lesson-search'),sidebar=document.getElementById('fragment-sidebar'),toggle=document.getElementById('menu-toggle'),shade=document.getElementById('drawer-shade');
 const mobile=matchMedia('(max-width:1000px)');
 let state={},searchLimit=120,searchTimer=null;
 function href(next){const p=new URLSearchParams();if(next.search){p.set('search',next.search)}else{if(next.fragment)p.set('fragment',next.fragment);if(next.block)p.set('block',next.block);if(next.category)p.set('category',next.category)}return '#'+p.toString()}
 function parseHash(){const raw=location.hash.slice(1);if(raw==='main-content')return state.fragment?state:{fragment:fragments[0]?.id};let p;try{p=new URLSearchParams(raw)}catch(error){p=new URLSearchParams()}const query=(p.get('search')||p.get('q')||'').trim();if(query)return {search:query};const fragment=fragmentMap.get(p.get('fragment')||p.get('f'))||fragments[0];if(!fragment)return {};const block=(fragment.blocks||[]).find(b=>String(b.code)===(p.get('block')||p.get('b')));const category=block&&(block.categories||[]).find(c=>String(c.code)===(p.get('category')||p.get('c')));return {fragment:fragment.id,...(block?{block:block.code}:{}),...(category?{category:category.code}:{})}}
 function navigate(next,{replace=false,focus=true}={}){const target=href(next);state=next;if(replace){try{history.replaceState(null,'',target)}catch(error){location.hash=target}render(focus)}else if(location.hash===target){render(focus)}else{location.hash=target}}
 function drawer(open,returnFocus=false){const on=mobile.matches&&open;sidebar.classList.toggle('open',on);shade.classList.toggle('open',on);toggle.setAttribute('aria-expanded',String(on));sidebar.inert=mobile.matches&&!on;document.getElementById('main-content').inert=on;if(on){(sidebar.querySelector('[aria-current="page"]')||sidebar.querySelector('button'))?.focus()}else if(returnFocus&&mobile.matches){toggle.focus()}}
 function blockButton(fragment,block){const order=blockOrder(fragment,block);return '<button class="block-card" style="--category-colour:'+categoryColour(fragment,block)+'" type="button" data-fragment="'+esc(fragment.id)+'" data-block="'+esc(block.code)+'" data-block-code="'+esc(block.code)+'"><span class="block-code">'+esc(block.code)+'</span><span class="category-number">Catégorie '+rank(order)+'</span><span class="block-title">'+esc(block.title)+'</span><span class="block-foot"><span>'+esc(chaptersInBlock(fragment,block).length)+' chapitres · '+esc((block.categories||[]).length)+' catégories CIM</span><b>Ouvrir →</b></span></button>'}
 function lessonRow(fragment,block,category,{context=false}={}){
  const group=category.categories?category:chaptersInBlock(fragment,block).find(item=>item.categories.some(c=>c.code===category.code)),representative=group.representative,selected=state.fragment===fragment.id&&state.block===block.code&&group.categories.some(c=>c.code===state.category);
  const chapterStatus=group.available?'primary':'planned',chapterLabel=(group.renvoi?'Renvoi au cours unique · ':'')+(group.available?'Cours disponible':'Cours à produire'),refs=group.searchVariants||group.categories.map(c=>({fragment,block,category:c}));
  const variants='<details class="chapter-variants"><summary>'+refs.length+' catégorie'+(refs.length>1?'s':'')+' CIM associée'+(refs.length>1?'s':'')+'</summary><ul>'+refs.map(item=>{const c=item.category;return '<li><button class="category-variant" type="button" data-fragment="'+esc(item.fragment.id)+'" data-block="'+esc(item.block.code)+'" data-category="'+esc(c.code)+'" data-category-code="'+esc(c.code)+'"'+(state.category===c.code?' aria-current="page"':'')+'>'+esc(c.code)+' — '+esc(c.title)+'</button></li>'}).join('')+'</ul></details>';
  return '<div class="lesson-row'+(selected?' selected':'')+'" style="--category-colour:'+categoryColour(fragment,block)+'" data-chapter-code="'+esc(group.code)+'"><span class="rank">Chapitre<strong>'+esc(group.order)+'</strong></span><button class="lesson-main" type="button" data-fragment="'+esc(fragment.id)+'" data-block="'+esc(block.code)+'" data-category="'+esc(representative.code)+'" data-category-code="'+esc(representative.code)+'" aria-label="'+esc(group.order+'. '+group.code+' — '+group.title)+'"><span class="lesson-code">'+esc(group.code)+'</span><span class="lesson-title">'+esc(group.title)+'</span><span class="lesson-sub"><span class="status '+chapterStatus+'">'+esc(chapterLabel)+'</span></span>'+(context?'<span class="search-result-context">'+esc(fragment.label)+' · Catégorie '+rank(blockOrder(fragment,block))+' — '+esc(block.title)+'</span>':'')+'</button>'+(group.available?link(group.reference.url,'Ouvrir le cours ↗','lesson-open'):'<span class="planned-mark">Cours à produire</span>')+variants+'</div>';
 }
 function relatedLessons(fragment){const related=(fragment.related||[]).slice().sort((a,b)=>Number(a.order)-Number(b.order));if(!related.length)return '';return '<section aria-labelledby="related-title"><div class="section-heading"><h2 id="related-title">Chapitres du plan rattachés à d’autres fragments</h2></div><p class="lesson-sub">Ces références complètent le parcours thématique. Leur catégorie reste rattachée au fragment indiqué.</p><div class="lesson-list">'+related.map(r=>{const s=['primary','covered'].includes(r.status)?r.status:'planned';return '<div class="lesson-row" data-related-code="'+esc(r.code)+'"><span class="rank">Plan<strong>'+esc(rank(r.order))+'</strong></span><div><span class="lesson-title"><span class="lesson-code">'+esc(r.code)+'</span> — '+esc(r.title)+'</span><span class="lesson-sub"><span class="status '+s+'">'+statusNames[s]+'</span></span><span class="search-result-context">'+esc(r.fragment_label)+'</span></div>'+link(r.url,'Accéder ↗','lesson-open')+'</div>'}).join('')+'</div></section>'}
 function fragmentActions(fragment){return '<div class="actions">'+link(fragment.url,'Ouvrir le fragment ↗','action primary')+link(fragment.source_url,'Consulter les sources')+link(fragment.delivery_codex_url,'Livraison Codex')+link(fragment.delivery_claude_url,'Livraison Claude')+'</div>'}
 function productionLabel(fragment){const p=fragment.production;return p?esc(p.owner)+' · fragment '+esc(p.queue_order)+'/'+esc(p.queue_size)+' dans sa file':'Cardiologie · mission partagée en cours'}
 function fragmentHeader(fragment){return '<header class="fragment-cover"><span class="eyebrow">Fragment · rang de production '+esc(rank(fragment.order))+'</span><h1 tabindex="-1" id="view-title">'+esc(fragment.label)+'</h1><p>'+esc(fragment.specialty)+'</p><div class="counts"><span class="count"><strong>'+esc(fragment.category_count??0)+'</strong>catégories du catalogue</span><span class="count"><strong>'+esc(fragment.integrated_count??0)+'</strong>cours intégrés</span><span class="count"><strong>'+esc((fragment.blocks||[]).length)+'</strong>blocs CIM</span></div><p class="lesson-sub" data-production-owner="'+esc(fragment.production?.owner||'shared')+'">'+productionLabel(fragment)+'</p><p class="lesson-sub">Ordre théorique proposé ; priorités du plan, puis catalogue.</p>'+fragmentActions(fragment)+'</header>'}
 function breadcrumbs(fragment,block,category){return '<nav class="breadcrumbs" aria-label="Fil d’Ariane"><button class="crumb-button" type="button" data-fragment="'+esc(fragment.id)+'">'+esc(fragment.label)+'</button>'+(block?'<span class="crumb-sep" aria-hidden="true">›</span>'+(category?'<button class="crumb-button" type="button" data-fragment="'+esc(fragment.id)+'" data-block="'+esc(block.code)+'">Catégorie '+rank(blockOrder(fragment,block))+' — '+esc(block.title)+'</button>':'<span>Catégorie '+rank(blockOrder(fragment,block))+' — '+esc(block.title)+'</span>'):'')+(category?'<span class="crumb-sep" aria-hidden="true">›</span><span>'+esc(category.code)+' — '+esc(category.title)+'</span>':'')+'</nav>'}
 function categoryDetail(fragment,block,category){const categoryStatus=status(category);let message;if(categoryStatus==='primary'){message='Cours disponible. L’exhaustivité de la leçon reste à vérifier.'}else if(categoryStatus==='covered'){message='Cette catégorie est développée dans le cours commun indiqué. Ses particularités doivent y rester explicites.'}else{message='Ce chapitre reste à produire.'}const course=courseRef(category);return '<section class="detail-card" aria-labelledby="category-title"><div class="detail-top"><div><span class="eyebrow">Catégorie CIM rattachée au chapitre</span><h2 id="category-title" tabindex="-1" aria-label="'+esc(category.code+' — '+category.title)+'"><span class="lesson-code">'+esc(category.code)+'</span> '+esc(category.title)+'</h2>'+badge(category)+'</div><div class="rank">Production<strong>'+esc(rank(category.order))+'</strong></div></div><dl><dt>Fragment</dt><dd>'+esc(fragment.label)+'</dd><dt>Catégorie</dt><dd>'+esc(block.code)+' — '+esc(block.title)+'</dd><dt>Cours commun</dt><dd>'+(course?esc(course.code)+' — '+esc(course.title):'À produire')+'</dd>'+(course?.fragment_id&&String(course.fragment_id)!==String(fragment.id)?'<dt>Lieu du cours</dt><dd>'+esc(course.fragment_label)+'</dd>':'')+'</dl><p class="detail-note">'+esc(message)+'</p>'+(course&&course.integrated!==false?'<div class="actions">'+link(course.url,'Ouvrir '+course.code+' — '+course.title,'action primary')+'</div>':'')+'</section>'}
 function renderFragment(fragment){
  const block=(fragment.blocks||[]).find(b=>String(b.code)===String(state.block)),category=block&&(block.categories||[]).find(c=>String(c.code)===String(state.category));
  if(!block){const blocks=fragment.blocks||[];return breadcrumbs(fragment)+fragmentHeader(fragment)+(blocks.length?'<div class="section-heading"><h2>Catégories et chapitres</h2><p>Chaque catégorie ouvre ses chapitres numérotés.</p></div><div class="block-grid">'+blocks.map(b=>blockButton(fragment,b)).join('')+'</div>':'<section class="empty"><h2>Catégories à rattacher</h2><p>Aucune catégorie de la classification n’est encore assignée à ce fragment.</p><p>Son périmètre doit être constitué avant la production des leçons.</p></section>')+relatedLessons(fragment)}
  const chapters=chaptersInBlock(fragment,block);
  return breadcrumbs(fragment,block,category)+'<header class="block-summary" style="--category-colour:'+categoryColour(fragment,block)+'"><span class="eyebrow">'+esc(fragment.label)+'</span><span class="block-code">'+esc(block.code)+'</span><span class="category-number">Catégorie '+rank(blockOrder(fragment,block))+'</span><h1 id="view-title" tabindex="-1">'+esc(block.title)+'</h1><p>'+chapters.length+' chapitres · '+(block.categories||[]).length+' catégories CIM. Les numéros suivent l’ordre théorique de production dans cette catégorie.</p></header>'+(category?categoryDetail(fragment,block,category):'')+'<div class="section-heading"><h2>Chapitres</h2><p>Les variantes CIM restent réunies dans le même cours.</p></div><div class="legend" aria-label="Statuts des chapitres"><span class="status primary">Cours disponible</span><span class="status planned">Cours à produire</span></div><div class="lesson-list">'+chapters.map(group=>lessonRow(fragment,block,group)).join('')+'</div>';
 }
 function renderSearch(){
  const words=norm(state.search).split(' ').filter(Boolean),matching=allCategories.filter(c=>words.every(w=>c.haystack.includes(w))).sort((a,b)=>Number(a.fragment.order)-Number(b.fragment.order)||Number(a.category.order)-Number(b.category.order)),unique=new Map();
  matching.forEach(item=>{const group=chaptersInBlock(item.fragment,item.block).find(chapter=>chapter.categories.some(c=>c.code===item.category.code)),old=unique.get(group.key);if(!old)unique.set(group.key,{...item,group,matches:[item]});else{old.matches.push(item);if(old.group.renvoi&&!group.renvoi)Object.assign(old,{...item,group})}});
  const found=[...unique.values()].map(item=>({...item,group:{...item.group,searchVariants:item.matches}})),visible=found.slice(0,searchLimit);
  return '<header class="search-summary"><span class="eyebrow">Recherche dans tous les fragments</span><h1 id="view-title" tabindex="-1">'+esc(state.search)+'</h1><p>'+found.length+' chapitre'+(found.length===1?'':'s')+' · '+matching.length+' catégorie'+(matching.length===1?'':'s')+' CIM'+(found.length>visible.length?' · '+visible.length+' chapitres affichés':'')+'.</p></header>'+(visible.length?'<div class="lesson-list">'+visible.map(x=>lessonRow(x.fragment,x.block,x.group,{context:true})).join('')+'</div>':'<section class="empty"><h2>Aucune correspondance</h2><p>Essayez un code CIM, un terme médical ou le nom d’une spécialité.</p></section>')+(found.length>visible.length?'<button class="more-button" type="button" data-more-search>Afficher les résultats suivants</button>':'');
 }
 function render(focus=false){state=parseHash();if(search.value!==(state.search||''))search.value=state.search||'';document.getElementById('clear-search').hidden=!state.search;document.querySelectorAll('.fragment-button').forEach(b=>{if(b.dataset.fragment===state.fragment)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(state.search){view.innerHTML=renderSearch();document.title='MEDINA · Recherche : '+state.search}else{const fragment=fragmentMap.get(String(state.fragment));view.innerHTML=fragment?renderFragment(fragment):'<section class="empty"><h1>Le catalogue est vide</h1></section>';document.title=fragment?'MEDINA · '+fragment.label:'MEDINA · Organisation des leçons'}document.getElementById('announcement').textContent=state.search?'Résultats de recherche affichés.':(fragmentMap.get(String(state.fragment))?.label||'Catalogue affiché.');if(focus){drawer(false);(document.getElementById('category-title')||document.getElementById('view-title'))?.focus({preventScroll:true});document.getElementById('view').scrollIntoView({block:'start',behavior:'instant'})}}
 const links=DATA.links||{};
 document.getElementById('global-links').innerHTML=link(links.online,'MEDINA en ligne ↗','main-top')+link(links.repository,'Dépôt GitHub','secondary-top')+link(links.codex,'Dossier Codex','secondary-top')+link(links.claude,'Dossier Claude','secondary-top')+link(links.html,'HTML de référence','secondary-top');
 document.getElementById('sidebar-links').innerHTML=link(links.codex,'Dossier Codex')+link(links.claude,'Dossier Claude')+link(links.html,'HTML de référence');
 document.getElementById('fragment-total').textContent=fragments.length+' fragments · codes et intitulés';
 document.getElementById('fragment-nav').innerHTML=fragments.map(f=>'<button type="button" class="fragment-button" data-fragment="'+esc(f.id)+'" data-fragment-id="'+esc(f.id)+'"><span class="fragment-label">'+esc(f.label)+'</span><span class="fragment-meta">'+esc(f.category_count??0)+' catégories · '+esc(f.integrated_count??0)+' cours intégrés<br>'+productionLabel(f)+'</span></button>').join('');
 const production=DATA.production;
 document.getElementById('production-summary').innerHTML='<h2 id="production-title">21 fragments restants : Claude 11 · Codex 10</h2><p>Un chapitre actif par responsable, avec sous-agents en parallèle. Claude audite Codex et Codex audite Claude avant injection ; contrôler et publier avant le chapitre suivant.</p><p>'+esc(production.categories.Claude)+' catégories historiques pour Claude · '+esc(production.categories.Codex)+' pour Codex. Les trois axes sans catégories demandent un inventaire propre. La cardiologie conserve sa mission actuelle.</p>'+Object.entries(production.agents).map(([agent,p])=>'<p data-active-agent="'+esc(agent)+'">'+esc(agent)+' : '+(p.active_chapter?esc(p.active_chapter.code)+' — '+esc(p.active_chapter.title)+' · '+esc(({writing:'rédaction',review:'audit croisé',checks:'contrôles',integration:'intégration',blocked:'bloqué'})[p.active_chapter.stage]):'aucun chapitre actif déclaré dans les 21 fragments')+'</p>').join('')+link(links.repository+'/blob/main/docs/collaboration/FRAGMENTS_RESTANTS.md','Consignes et files complètes');
 const version=DATA.catalogue?.version||'CIM-10-GM 2024';
 document.getElementById('reference-note').innerHTML='<span class="ref-pill">'+esc(version)+'</span><p>Les intitulés proviennent du catalogue historique. La couverture exhaustive CIM-11 n’est pas établie.</p>';
 document.getElementById('page-footer').innerHTML='<span>'+esc(DATA.catalogue?.integrated_courses??0)+' cours intégrés · '+esc(DATA.catalogue?.total_categories??0)+' catégories du catalogue</span>'+link(links.protocol,'Organisation et livraisons','footer-link')+(DATA.generated_at?'<span>État du '+esc(dateLabel(DATA.generated_at))+'</span>':'');
 document.addEventListener('click',event=>{const b=event.target.closest('button[data-fragment]');if(b){searchLimit=120;navigate({fragment:b.dataset.fragment,...(b.dataset.block?{block:b.dataset.block}:{}),...(b.dataset.category?{category:b.dataset.category}:{})});return}if(event.target.closest('[data-more-search]')){searchLimit+=120;render(false)}});
 search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{searchLimit=120;const query=search.value.trim();navigate(query?{search:query}:{fragment:state.fragment||fragments[0]?.id},{replace:true,focus:false})},150)});
 document.getElementById('clear-search').addEventListener('click',()=>{clearTimeout(searchTimer);searchLimit=120;search.value='';navigate({fragment:fragments[0]?.id},{replace:true,focus:false});search.focus()});
 toggle.addEventListener('click',()=>drawer(!sidebar.classList.contains('open')));shade.addEventListener('click',()=>drawer(false,true));document.getElementById('close-nav').addEventListener('click',()=>drawer(false,true));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sidebar.classList.contains('open'))drawer(false,true)});
 mobile.addEventListener('change',()=>drawer(false));window.addEventListener('hashchange',()=>render(true));drawer(false);render(false);
})();
</script>
