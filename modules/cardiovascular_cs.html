<section class="cs-section" id="cs-preparation" aria-labelledby="cs-h-preparation"><h2 id="cs-h-preparation"><span>1</span>Préparation</h2>
<p class="cs-seek"><b>On cherche :</b> les conditions sans lesquelles les signes suivants ne valent rien — position, exposition, silence, matériel.</p>
<ol class="cs-steps"><li>Identité, présentation, accord. Annoncez : « je vais regarder, palper, écouter ».</li><li>Demandez où il y a mal et si la position allongée est possible.</li><li>Hygiène des mains. Stéthoscope nettoyé.</li><li>Patient à <b>30–45°</b>, torse découvert, couvert dès que la zone est examinée.</li><li>Pièce silencieuse pour l’auscultation. Lumière rasante pour le cou.</li><li>Brassard adapté : la vessie gonflable couvre environ 80 % de la circonférence du bras.</li></ol>
<div class="cs-key"><b>Vous vous placez à droite du patient.</b> Tous les repères de cette page supposent cette position.</div></section>

<section class="cs-section" id="cs-general" aria-labelledby="cs-h-general"><h2 id="cs-h-general"><span>2</span>État général : dix secondes</h2>
<p class="cs-seek"><b>On cherche :</b> un patient instable, avant tout le reste.</p>
<ol class="cs-steps"><li>Parle-t-il en phrases complètes ? Est-il orienté ?</li><li>Respiration : fréquence, tirage, position assise forcée.</li><li>Peau : sueurs, pâleur, cyanose des lèvres, marbrures des genoux.</li><li>Touchez les mains : chaudes et sèches, ou froides et moites.</li><li>Temps de recoloration au pouce, pression 5 secondes : <b>&gt; 3 s</b> = perfusion à documenter.</li></ol>
<div class="cs-alert"><b>Arrêtez l’examen et appelez à l’aide si :</b> pression systolique &lt; 90 mmHg, marbrures, confusion nouvelle, douleur thoracique en cours, fréquence respiratoire &gt; 25/min, saturation &lt; 90 %.</div></section>

<section class="cs-section" id="cs-constantes" aria-labelledby="cs-h-constantes"><h2 id="cs-h-constantes"><span>3</span>Constantes : la technique fait la valeur</h2>
<p class="cs-seek"><b>On cherche :</b> fréquence et régularité du pouls, pression artérielle juste, retentissement postural.</p>
<h3>Pouls radial</h3>
<ol class="cs-steps"><li>Deux ou trois pulpes sur l’artère radiale, poignet en légère flexion.</li><li>Régulier : comptez 30 s × 2. <b>Irrégulier : comptez 60 s</b>.</li><li>Notez amplitude et symétrie droite-gauche.</li><li>Pouls irrégulier → électrocardiogramme. La palpation ne diagnostique pas une fibrillation auriculaire.</li></ol>
<h3>Pression artérielle</h3>
<ol class="cs-steps"><li>Repos assis <b>5 minutes</b>, dos appuyé, pieds au sol, sans parler.</li><li>Bras nu, soutenu, milieu du brassard au niveau du cœur.</li><li>Deux mesures à 1–2 minutes d’intervalle ; retenez la moyenne.</li><li><b>Première consultation : mesurez aux deux bras.</b> Différence &gt; 15 mmHg : retenez le bras le plus haut et explorez l’axe sous-clavier.</li></ol>
<div class="cs-table-wrap"><table><caption>Trois manœuvres à faire soi-même, pas à déduire</caption><thead><tr><th>Manœuvre</th><th>Geste</th><th>Seuil</th></tr></thead><tbody>
<tr><td>Hypotension orthostatique</td><td>Mesurez couché, puis à 1 et 3 minutes debout.</td><td>Chute ≥ 20 systolique ou ≥ 10 diastolique.</td></tr>
<tr><td>Pouls paradoxal</td><td>Dégonflez lentement : notez le premier bruit (expiration), puis celui audible à chaque cycle.</td><td>Écart &gt; 10 mmHg : tamponnade, asthme sévère.</td></tr>
<tr><td>Déficit de pouls</td><td>Auscultez l’apex pendant qu’un aide palpe le radial.</td><td>Apex &gt; radial : contractions non transmises.</td></tr>
</tbody></table></div>
<div class="cs-key"><b>Notez toujours la méthode avec le chiffre :</b> bras, taille du brassard, position, repos. Une pression sans sa technique n’est pas interprétable.</div></section>

<section class="cs-section" id="cs-peripherie" aria-labelledby="cs-h-peripherie"><h2 id="cs-h-peripherie"><span>4</span>Périphérie et pouls</h2>
<p class="cs-seek"><b>On cherche :</b> une artère obstruée, une perfusion basse, un signe d’endocardite.</p>
<h3>Palper les axes, toujours des deux côtés</h3>
<div class="cs-table-wrap"><table><thead><tr><th>Pouls</th><th>Où poser les doigts</th></tr></thead><tbody>
<tr><td>Brachial</td><td>Pli du coude, en dedans du tendon du biceps.</td></tr>
<tr><td>Carotidien</td><td>Bord antérieur du sterno-cléido-mastoïdien. <b>Un côté à la fois.</b></td></tr>
<tr><td>Fémoral</td><td>Mi-distance entre épine iliaque antéro-supérieure et symphyse pubienne.</td></tr>
<tr><td>Poplité</td><td>Genou fléchi à 30°, deux mains, pulpes dans le creux poplité.</td></tr>
<tr><td>Tibial postérieur</td><td>Deux centimètres derrière et sous la malléole interne.</td></tr>
<tr><td>Pédieux</td><td>Dos du pied, en dehors du tendon de l’extenseur de l’hallux.</td></tr>
</tbody></table></div>
<ol class="cs-steps"><li><b>Palpez radial et fémoral en même temps</b> : un retard fémoral oriente vers une coarctation.</li><li>Pouls pédieux absent : cherchez le tibial postérieur avant de conclure. Un pédieux est absent chez environ 1 personne sur 10 sans maladie.</li><li>Auscultez carotides, aorte abdominale et fémorales : un souffle localisé signale une sténose, son intensité ne la mesure pas.</li><li>Mains : température, hippocratisme, hémorragies sous-unguéales ; conjonctives pour l’anémie.</li><li>Œdème : pression ferme <b>10 secondes</b> sur la malléole ou le tibia ; notez le godet, sa hauteur et la symétrie.</li></ol>
<div class="cs-key"><b>Unilatéral oriente vers la veine ou le lymphatique ; bilatéral vers le cœur, le rein, le foie ou un médicament.</b></div></section>

<section class="cs-section" id="cs-cou" aria-labelledby="cs-h-cou"><h2 id="cs-h-cou"><span>5</span>Cou : pression veineuse</h2>
<p class="cs-seek"><b>On cherche :</b> une pression veineuse élevée, c’est-à-dire une congestion droite.</p>
<ol class="cs-steps"><li>Patient à <b>45°</b>, tête tournée de 15° à gauche, cou relâché, lumière rasante.</li><li>Regardez la <b>jugulaire interne droite</b>, entre les deux chefs du sterno-cléido-mastoïdien.</li><li>Repérez le sommet des oscillations, puis mesurez la <b>hauteur verticale au-dessus de l’angle de Louis</b> ; ajoutez 5 cm.</li><li>Résultat &gt; 8–9 cm d’eau : pression veineuse élevée. Notez l’inclinaison avec le chiffre.</li><li>Oscillations invisibles : écrivez « jugulaire non visualisée », jamais « pression normale ».</li></ol>
<div class="cs-table-wrap"><table><caption>Veine ou artère : quatre différences décisives</caption><thead><tr><th></th><th>Jugulaire interne</th><th>Carotide</th></tr></thead><tbody>
<tr><td>Palpation</td><td>Non palpable.</td><td>Palpable.</td></tr>
<tr><td>Sommets par cycle</td><td>Deux.</td><td>Un.</td></tr>
<tr><td>Pression basse du cou</td><td>L’onde disparaît.</td><td>Le pouls persiste.</td></tr>
<tr><td>Inspiration</td><td>Le niveau baisse.</td><td>Inchangé.</td></tr>
</tbody></table></div>
<div class="cs-key"><b>Reflux hépatojugulaire :</b> pression ferme et indolore de l’hypocondre droit, patient respirant normalement, pendant 10 à 15 secondes. Une élévation maintenue qui retombe au relâchement est positive.</div></section>

<section class="cs-section" id="cs-precordium" aria-labelledby="cs-h-precordium"><h2 id="cs-h-precordium"><span>6</span>Précordium : inspection et palpation</h2>
<p class="cs-seek"><b>On cherche :</b> un choc de pointe déplacé ou soutenu, un soulèvement droit, un frémissement.</p>
<ol class="cs-steps"><li>Regardez d’abord, tangentiellement : cicatrices, boîtier de stimulateur, pulsations visibles.</li><li>Choc de pointe : pulpes des doigts, normalement <b>5<sup>e</sup> espace intercostal gauche, ligne médioclaviculaire</b>, surface d’une pièce de monnaie.</li><li>Introuvable : refaites en <b>décubitus latéral gauche</b>, puis en expiration bloquée.</li><li>Soulèvement parasternal : talon de la main au bord gauche du sternum, bras tendu — signe une surcharge du ventricule droit.</li><li>Frémissement : talon de la main sur chaque foyer. Un frémissement palpable signe un souffle d’au moins 4/6.</li></ol>
<div class="cs-key"><b>Décrivez trois choses :</b> le siège, l’étendue, la durée. Pointe déplacée en dehors et en bas = dilatation ; pointe soutenue sans déplacement = surcharge de pression.</div></section>

<section class="cs-section" id="cs-auscultation" aria-labelledby="cs-h-auscultation"><h2 id="cs-h-auscultation"><span>7</span>Auscultation</h2>
<p class="cs-seek"><b>On cherche :</b> le rythme, les deux bruits, puis tout son supplémentaire — que l’on date avant de le nommer.</p>
<ol class="cs-steps"><li>Comptez les espaces à partir de l’angle de Louis : il marque la <b>2<sup>e</sup> côte</b>. Le mamelon n’est pas un repère.</li><li>Palpez la carotide pendant que vous écoutez : ce qui suit immédiatement B1 est systolique.</li><li><b>Membrane</b> pour B1, B2 et les souffles aigus. <b>Cloche</b>, posée sans appuyer, pour B3, B4 et le roulement mitral.</li><li>Quatre foyers, puis les irradiations : creux sus-sternal, carotides, aisselle gauche.</li></ol>
<div class="cs-table-wrap"><table><thead><tr><th>Foyer</th><th>Repère</th><th>Ce qu’on y cherche</th></tr></thead><tbody>
<tr><td>Aortique</td><td>2<sup>e</sup> espace intercostal droit.</td><td>Souffle d’éjection irradiant aux carotides.</td></tr>
<tr><td>Pulmonaire</td><td>2<sup>e</sup> espace intercostal gauche.</td><td>Dédoublement de B2, souffle d’éjection.</td></tr>
<tr><td>Tricuspide</td><td>4<sup>e</sup> espace, bord sternal gauche bas.</td><td>Souffle augmenté par l’inspiration.</td></tr>
<tr><td>Mitral</td><td>5<sup>e</sup> espace, ligne médioclaviculaire.</td><td>Souffle holosystolique irradiant à l’aisselle, B3, roulement.</td></tr>
</tbody></table></div>
<h3>Manœuvres : elles font le diagnostic</h3>
<div class="cs-table-wrap"><table><thead><tr><th>Manœuvre</th><th>Comment</th><th>Ce qu’elle révèle</th></tr></thead><tbody>
<tr><td>Décubitus latéral gauche, cloche</td><td>Patient tourné à gauche, cloche à la pointe.</td><td>Roulement du rétrécissement mitral, B3, B4.</td></tr>
<tr><td>Assis penché en avant, expiration bloquée</td><td>Membrane au bord sternal gauche haut.</td><td>Souffle diastolique de l’insuffisance aortique, frottement péricardique.</td></tr>
<tr><td>Inspiration profonde</td><td>Écoutez au bord sternal gauche bas.</td><td>Souffle qui augmente : il vient du cœur droit.</td></tr>
<tr><td>Valsalva, ou passage accroupi-debout</td><td>Poussez 10 secondes à glotte fermée.</td><td>Souffle qui augmente : cardiomyopathie hypertrophique. Tous les autres diminuent.</td></tr>
<tr><td>Poignée serrée 30 secondes</td><td>Serrez fort les deux poings.</td><td>Insuffisance mitrale et communication interventriculaire augmentent ; cardiomyopathie hypertrophique diminue.</td></tr>
</tbody></table></div>
<div class="cs-key"><b>Décrivez un souffle en six mots :</b> temps, foyer maximal, irradiation, intensité sur 6, timbre, variation avec les manœuvres. L’intensité ne mesure pas la gravité.</div></section>

<section class="cs-section" id="cs-congestion" aria-labelledby="cs-h-congestion"><h2 id="cs-h-congestion"><span>8</span>Congestion</h2>
<p class="cs-seek"><b>On cherche :</b> le liquide en amont du cœur — poumons, foie, jambes.</p>
<ol class="cs-steps"><li>Auscultez les deux bases, patient assis : crépitants fins de fin d’inspiration, non modifiés par la toux.</li><li>Percutez les bases : matité déclive et murmure aboli = épanchement.</li><li>Palpez le foie sous le rebord costal droit en inspiration ; notez la douleur et la flèche hépatique.</li><li>Recherchez une ascite si l’abdomen est distendu : matité des flancs qui se déplace.</li><li>Œdèmes : chevilles chez le patient debout, <b>sacrum chez le patient alité</b>.</li><li>Demandez le poids : trois kilos en une semaine valent mieux que n’importe quel signe physique.</li></ol>
<div class="cs-key"><b>Les crépitants manquent dans l’insuffisance cardiaque chronique, même décompensée.</b> Jugulaire, reflux et œdème sacré prennent alors le relais.</div></section>

<section class="cs-section" id="cs-correlation" aria-labelledby="cs-h-correlation"><h2 id="cs-h-correlation"><span>9</span>Du signe au diagnostic</h2>
<p class="cs-seek"><b>On cherche :</b> le regroupement. Un signe isolé ne décide rien ; un signe placé dans son syndrome et son histoire désigne un diagnostic et un examen.</p>
<h3>Le signe trouvé renvoie à son cours</h3>
<div class="cs-table-wrap"><table><thead><tr><th>Signe physique</th><th>Syndrome</th><th>Diagnostics à considérer</th></tr></thead><tbody>
<tr><td>Jugulaire élevée, reflux positif, œdèmes déclives, hépatalgie</td><td>Congestion droite</td><td><a href="#/entry/I50">Insuffisance cardiaque</a> ; <a href="#/entry/I34">Valvulopathies mitrales, tricuspides et pulmonaires</a> ; <a href="#/entry/I30">Péricardites, épanchement péricardique, tamponnade et constriction</a> ; cœur pulmonaire</td></tr>
<tr><td>Crépitants des bases, orthopnée, B3, pointe déplacée</td><td>Congestion gauche</td><td><a href="#/entry/I50">Insuffisance cardiaque</a> ; <a href="#/entry/I34">Valvulopathies mitrales</a> ; <a href="#/entry/I21">Syndromes coronariens aigus</a></td></tr>
<tr><td>Pression basse, extrémités froides, marbrures, recoloration lente, oligurie</td><td>Bas débit, choc cardiogénique</td><td><a href="#/entry/I21">Syndromes coronariens aigus</a> ; <a href="#/entry/I40">Myocardites</a> ; <a href="#/entry/I26">Embolie pulmonaire aiguë</a> ; <a href="#/entry/I30">Tamponnade</a></td></tr>
<tr><td>Souffle systolique râpeux au foyer aortique, irradiant aux carotides, pouls lent et faible</td><td>Obstacle à l’éjection gauche</td><td><a href="#/entry/I35">Valvulopathies aortiques</a> ; cardiomyopathie hypertrophique obstructive</td></tr>
<tr><td>Souffle holosystolique à la pointe, irradiant à l’aisselle, B3</td><td>Régurgitation mitrale</td><td><a href="#/entry/I34">Valvulopathies mitrales</a> ; complication de <a href="#/entry/I21">un infarctus</a></td></tr>
<tr><td>Souffle diastolique au bord sternal gauche haut, pression différentielle large, pouls bondissant</td><td>Régurgitation aortique</td><td><a href="#/entry/I35">Valvulopathies aortiques</a> ; dissection de l’aorte ascendante (<a href="#/entry/I71">Anévrismes et dissections artérielles</a>)</td></tr>
<tr><td>Pouls irrégulièrement irrégulier, déficit de pouls</td><td>Arythmie à conduction variable</td><td><a href="#/entry/I48">Fibrillation et flutter auriculaires</a> ; <a href="#/entry/I49">Extrasystoles et autres arythmies</a></td></tr>
<tr><td>Bradycardie régulière, ondes « a » en canon au cou</td><td>Dissociation auriculoventriculaire</td><td><a href="#/entry/I44">Troubles de la conduction et bradycardies</a></td></tr>
<tr><td>Pouls paradoxal, jugulaire élevée, bruits assourdis, pression basse</td><td>Tamponnade</td><td><a href="#/entry/I30">Péricardites, épanchement péricardique, tamponnade et constriction</a></td></tr>
<tr><td>Frottement péricardique, douleur soulagée en se penchant en avant</td><td>Inflammation péricardique</td><td><a href="#/entry/I30">Péricardites</a> ; <a href="#/entry/I40">Myocardites</a></td></tr>
<tr><td>Fièvre, souffle nouveau, hémorragies sous-unguéales, splénomégalie</td><td>Endocardite</td><td><a href="#/entry/I33">Endocardite infectieuse</a> ; <a href="#/entry/I00">Rhumatisme articulaire aigu</a></td></tr>
<tr><td>Asymétrie tensionnelle &gt; 15 mmHg, douleur thoracique migratrice, déficit de pouls</td><td>Syndrome aortique aigu</td><td><a href="#/entry/I71">Anévrismes et dissections artérielles</a></td></tr>
<tr><td>Pouls distaux abolis, membre froid, douleur de repos, ulcère distal</td><td>Ischémie artérielle des membres</td><td><a href="#/entry/I70">Artériopathie des membres inférieurs et ischémie aiguë</a></td></tr>
<tr><td>Mollet unilatéral douloureux, augmenté de volume, chaud</td><td>Thrombose veineuse</td><td><a href="#/entry/I80">Thrombose veineuse profonde</a> ; <a href="#/entry/I83">Varices des membres inférieurs</a></td></tr>
<tr><td>Tachycardie, hypoxémie, jugulaire élevée, cœur droit surchargé après immobilisation</td><td>Surcharge droite aiguë</td><td><a href="#/entry/I26">Embolie pulmonaire aiguë</a></td></tr>
<tr><td>Pression élevée aux deux bras, choc de pointe soutenu, B4</td><td>Surcharge de pression chronique</td><td><a href="#/entry/I10">Hypertension artérielle</a> ; <a href="#/entry/I42">Cardiomyopathies</a></td></tr>
</tbody></table></div>
<h3>L’anamnèse oriente l’examen</h3>
<div class="cs-table-wrap"><table><thead><tr><th>Plainte</th><th>Ce que vous cherchez en premier</th><th>Diagnostics</th></tr></thead><tbody>
<tr><td>Douleur thoracique de repos, &gt; 20 minutes, sueurs</td><td>Stabilité, souffle nouveau, frottement, asymétrie tensionnelle, signes droits</td><td><a href="#/entry/I21">Syndromes coronariens aigus</a> ; <a href="#/entry/I71">Dissection aortique</a> ; <a href="#/entry/I30">Péricardite</a> ; <a href="#/entry/I26">Embolie pulmonaire</a></td></tr>
<tr><td>Dyspnée d’effort progressive, orthopnée, prise de poids</td><td>Jugulaire, reflux, B3, crépitants, œdèmes</td><td><a href="#/entry/I50">Insuffisance cardiaque</a> ; <a href="#/entry/I34">Valvulopathies mitrales</a></td></tr>
<tr><td>Dyspnée brutale avec douleur latérale</td><td>Fréquence, saturation, signes droits, mollets</td><td><a href="#/entry/I26">Embolie pulmonaire aiguë</a> ; <a href="#/entry/I30">Péricardite</a></td></tr>
<tr><td>Palpitations</td><td>Pouls pendant la crise, régularité, déficit de pouls, signes de mauvaise tolérance</td><td><a href="#/entry/I48">Fibrillation et flutter auriculaires</a> ; <a href="#/entry/I47">Tachycardies paroxystiques</a> ; <a href="#/entry/I49">Extrasystoles</a></td></tr>
<tr><td>Syncope d’effort</td><td>Souffle aortique, pouls lent et faible, réponse à Valsalva</td><td><a href="#/entry/I35">Rétrécissement aortique</a> ; cardiomyopathie hypertrophique ; <a href="#/entry/I44">troubles de la conduction</a></td></tr>
<tr><td>Douleur du mollet à la marche, cédant à l’arrêt</td><td>Pouls distaux, souffles fémoraux, température et trophicité</td><td><a href="#/entry/I70">Artériopathie des membres inférieurs</a></td></tr>
<tr><td>Fièvre prolongée sans foyer, valvulopathie ou matériel implanté connus</td><td>Souffle nouveau, signes vasculaires périphériques, rate</td><td><a href="#/entry/I33">Endocardite infectieuse</a></td></tr>
<tr><td>Œdèmes bilatéraux sans dyspnée</td><td>Jugulaire, reflux, foie, protéinurie, médicaments</td><td>Cause cardiaque <a href="#/entry/I50">insuffisance cardiaque</a> à distinguer d’une cause rénale, hépatique ou médicamenteuse</td></tr>
</tbody></table></div>
<div class="cs-key"><b>Règle de décision.</b> Un signe isolé ouvre une hypothèse. Deux signes concordants dans le même territoire la renforcent. Le signe discordant, lui, impose de chercher un autre diagnostic plutôt que de l’écarter.</div>
<div class="cs-alert"><b>Associations qui imposent une action immédiate.</b> Douleur thoracique avec asymétrie tensionnelle : imagerie aortique avant tout anticoagulant. Jugulaire élevée avec pression basse et bruits assourdis : échocardiographie en urgence. Fièvre avec souffle nouveau : hémocultures avant l’antibiotique. Membre froid sans pouls : avis vasculaire dans l’heure.</div></section>

<section class="cs-section" id="cs-synthese" aria-labelledby="cs-h-synthese"><h2 id="cs-h-synthese"><span>10</span>Synthèse à voix haute</h2>
<p class="cs-seek"><b>On cherche :</b> transmettre en trente secondes ce qui change la prise en charge.</p>
<ol class="cs-steps"><li>État général et stabilité.</li><li>Constantes avec leur technique.</li><li>Signes positifs, dans l’ordre de l’examen.</li><li>Signes négatifs qui comptent, et ce que vous n’avez pas pu voir.</li><li>Hypothèse, puis examen demandé.</li></ol>
<div class="cs-case"><b>Modèle.</b><p>« Patient stable, dyspnéique à l’effort. Pouls régulier à 78. Pression 132/76 au bras droit, brassard adapté, après 5 minutes de repos. Jugulaire à 7 cm au-dessus de l’angle sternal à 45°, reflux hépatojugulaire positif. Souffle holosystolique 3/6 à la pointe, irradiant à l’aisselle. Crépitants aux deux bases, œdèmes bilatéraux prenant le godet. Congestion gauche et droite sur probable insuffisance mitrale : échocardiographie et peptide natriurétique. »</p></div></section>

<section class="cs-section" id="cs-entrainement" aria-labelledby="cs-h-entrainement"><h2 id="cs-h-entrainement"><span>11</span>Entraînement</h2>
<div class="cs-quiz" data-cs-answer="b"><h3>Cas 1 · Jugulaire invisible</h3><p>Vous ne voyez aucune onde veineuse cervicale. Que notez-vous ?</p><button type="button" data-cs-choice="a">La pression veineuse est normale.</button><button type="button" data-cs-choice="b">Jugulaire non visualisée ; hauteur non évaluée.</button><p class="cs-feedback" hidden>Une onde invisible ne se transforme pas en pression basse. Vous notez la limite.</p></div>
<div class="cs-quiz" data-cs-answer="a"><h3>Cas 2 · Pouls irrégulier</h3><p>Le pouls radial est irrégulier. La montre du patient affiche une alerte. Quelle étape confirme le rythme ?</p><button type="button" data-cs-choice="a">Un électrocardiogramme.</button><button type="button" data-cs-choice="b">Une palpation prolongée des deux poignets.</button><p class="cs-feedback" hidden>Seul le tracé identifie le rythme. La palpation et la montre signalent, elles ne diagnostiquent pas.</p></div>
<div class="cs-quiz" data-cs-answer="b"><h3>Cas 3 · Souffle systolique 4/6</h3><p>Le souffle augmente au passage accroupi-debout et diminue à la poignée serrée. Que suspectez-vous ?</p><button type="button" data-cs-choice="a">Une insuffisance mitrale.</button><button type="button" data-cs-choice="b">Une cardiomyopathie hypertrophique obstructive.</button><p class="cs-feedback" hidden>Diminuer le remplissage augmente l’obstruction dynamique. L’insuffisance mitrale suit le comportement inverse.</p></div>
<div class="cs-checklist"><h3>Liste de contrôle d’une station clinique</h3><p>Cochez après avoir fait le geste. Les cases restent dans ce navigateur.</p><label><input type="checkbox" data-cs-check="preparation"> Identité, accord, position 30–45°, brassard adapté.</label><label><input type="checkbox" data-cs-check="general"> État général et recherche d’instabilité.</label><label><input type="checkbox" data-cs-check="constantes"> Pouls, pression aux deux bras, manœuvre posturale si indiquée.</label><label><input type="checkbox" data-cs-check="pouls"> Pouls des quatre membres, radial-fémoral simultané, souffles vasculaires.</label><label><input type="checkbox" data-cs-check="jugulaire"> Jugulaire mesurée ou limite notée, reflux hépatojugulaire.</label><label><input type="checkbox" data-cs-check="palpation"> Choc de pointe, soulèvement parasternal, frémissement.</label><label><input type="checkbox" data-cs-check="auscultation"> Quatre foyers, cloche et membrane, au moins une manœuvre.</label><label><input type="checkbox" data-cs-check="congestion"> Bases pulmonaires, foie, œdèmes déclives.</label><label><input type="checkbox" data-cs-check="synthese"> Synthèse en trente secondes avec les limites.</label><p class="cs-progress" role="status">0 / 9 étapes cochées</p><button type="button" class="cs-reset-checklist" data-cs-reset>Tout décocher</button></div></section>
