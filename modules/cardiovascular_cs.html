<div class="cs-intro"><p>Ce parcours suit un examen complet de l’adulte. Vous progressez de l’état général aux signes périphériques, puis au cou et au précordium. Vous terminez par la recherche de congestion et par une synthèse clinique. Une situation instable impose d’abord l’évaluation urgente.</p><p>Les schémas 3D montrent des repères anatomiques simplifiés. Vous pouvez les tourner, sélectionner un repère et lire la technique correspondante. L’apprentissage du geste se complète par une pratique supervisée au lit du patient.</p></div>

<section class="cs-atlas" aria-labelledby="cs-atlas-title"><header><span class="cs-eyebrow">Repères en fenêtres</span><h2 id="cs-atlas-title">Explorer l’examen en 3D</h2><p>Chaque fenêtre associe un modèle rotatif, des repères sélectionnables et une explication du geste. Les repères sont aussi disponibles sous forme de boutons pour le clavier.</p></header><div class="cs-model-grid"><button type="button" data-cs-model="thorax"><span aria-hidden="true">01</span><b>Thorax et foyers</b><small>Vous situez les espaces intercostaux et les zones d’écoute.</small></button><button type="button" data-cs-model="neck"><span aria-hidden="true">02</span><b>Jugulaire et carotide</b><small>Vous distinguez une onde veineuse d’un pouls artériel.</small></button><button type="button" data-cs-model="pulses"><span aria-hidden="true">03</span><b>Pouls périphériques</b><small>Vous suivez les sites de palpation du bras jusqu’au pied.</small></button><button type="button" data-cs-model="heart"><span aria-hidden="true">04</span><b>Cœur, valves et cycle</b><small>Vous reliez les cavités aux bruits et aux souffles.</small></button></div></section>

<section class="cs-section" id="cs-preparation" aria-labelledby="cs-h-preparation"><h2 id="cs-h-preparation"><span>1</span>Préparer un examen fiable et respectueux</h2><p>La préparation améliore à la fois le confort et la qualité des signes recueillis. Un patient tendu, mal installé ou insuffisamment exposé peut rendre l’examen trompeur. Vous expliquez donc le déroulement avant de commencer.</p><h3>Le patient comprend ce que vous allez faire</h3><p>Vous confirmez l’identité, vous vous présentez et vous expliquez la palpation ainsi que l’auscultation. Vous recueillez son accord et demandez s’il existe une douleur ou une difficulté à s’allonger. Vous proposez un accompagnement selon les préférences du patient et les pratiques locales. Vous exposez seulement la région nécessaire et préservez l’intimité.</p><p>Vous réalisez l’hygiène des mains et vérifiez la propreté du matériel. Vous disposez d’un stéthoscope, d’un appareil de pression validé et de brassards adaptés. Vous placez initialement le patient en position semi-assise, souvent à 30–45°, si son état le permet. Les positions changent ensuite selon le signe recherché.</p><div class="cs-key"><b>À retenir.</b> Une difficulté à s’allonger constitue déjà une information clinique. Vous adaptez la position et décrivez les limites de l’examen.</div></section>

<section class="cs-section" id="cs-general" aria-labelledby="cs-h-general"><h2 id="cs-h-general"><span>2</span>Observer avant de toucher</h2><p>La première observation estime la tolérance circulatoire et respiratoire. Vous regardez le patient dans son ensemble avant de vous concentrer sur le cœur. Une anomalie isolée reste peu spécifique ; plusieurs signes concordants prennent davantage de sens.</p><h3>État général, respiration et perfusion</h3><p>Vous appréciez la vigilance, la capacité à parler, la fréquence respiratoire apparente et l’utilisation des muscles accessoires. Vous observez la coloration, les sueurs et la posture. Des extrémités froides, des marbrures et une altération de la conscience peuvent évoquer une perfusion insuffisante. Leur interprétation dépend de la température ambiante, des médicaments et du contexte.</p><p>Vous recherchez une pâleur et une cyanose des muqueuses lorsque l’éclairage permet une lecture fiable. Une saturation mesurée complète cette observation. Une saturation conservée ne renseigne pas directement sur la quantité d’hémoglobine ni sur le débit cardiaque. Un patient anémique peut recevoir moins d’oxygène dans ses tissus malgré une saturation normale.</p><div class="cs-alert"><b>Priorité clinique.</b> Une douleur thoracique actuelle avec malaise, une dyspnée sévère, une syncope persistante ou des signes de choc justifient une évaluation urgente. Vous interrompez le parcours d’entraînement pour mobiliser l’aide adaptée.</div><div class="cs-key"><b>Science → clinique.</b> L’oxygène délivré dépend du débit et du contenu artériel en oxygène. L’observation et les constantes renseignent plusieurs parties de cette relation.</div></section>

<section class="cs-section" id="cs-constantes" aria-labelledby="cs-h-constantes"><h2 id="cs-h-constantes"><span>3</span>Mesurer les constantes avec une technique explicite</h2><p>Une mesure n’est interprétable que si sa méthode est correcte. La fréquence du pouls, la pression et la respiration décrivent des aspects différents de la circulation. Vous notez leurs valeurs et les conditions de recueil.</p><h3>Pouls et rythme</h3><p>Vous palpez le pouls radial avec la pulpe de deux ou trois doigts. Vous appréciez sa fréquence, sa régularité et son amplitude. Vous comptez pendant une minute lorsque le rythme est irrégulier. Vous comparez les deux côtés si une asymétrie est suspectée. Une irrégularité évoque une arythmie, mais seul un tracé ECG permet d’identifier une fibrillation auriculaire.</p><p>Lorsque la fréquence à l’apex paraît supérieure à celle du poignet, vous recherchez un déficit de pouls. Certaines contractions produisent une onde trop faible pour être perçue en périphérie. Cette différence ne fournit pas à elle seule le diagnostic du rythme.</p><h3>Pression artérielle</h3><p>Pour une mesure programmée au cabinet, le patient repose au calme pendant cinq minutes. Son dos et son bras sont soutenus ; ses pieds restent posés et ses jambes ne sont pas croisées. Le brassard est adapté à la circonférence du bras et placé au niveau du cœur. Vous évitez une mesure sur les vêtements et les conversations pendant le recueil.</p><p>Vous mesurez initialement les deux bras. Une différence persistante mérite une confirmation et une interprétation clinique. Vous répétez les mesures selon le protocole plutôt que de retenir une lecture inattendue isolée. Vous notez le bras, la position et le brassard. Une seule valeur élevée ne suffit généralement pas à caractériser une hypertension chronique.</p><p>En cas de vertige au lever ou de suspicion d’hypotension orthostatique, vous mesurez après le repos puis à une et trois minutes debout, selon la tolérance. Une baisse d’au moins 20 mmHg systolique ou 10 mmHg diastolique répond au seuil usuel. Vous notez aussi les symptômes et la fréquence cardiaque. Vous sécurisez le patient pendant le lever.</p><div class="cs-key"><b>À retenir.</b> La technique précède l’interprétation. Un brassard trop petit, un bras mal placé ou une mesure après effort peut déplacer la décision.</div><p class="cs-course-links">Vous approfondissez ces mécanismes dans <a href="#/entry/I10">I10 · Hypertension</a> et <a href="#/entry/I48">I48 · Fibrillation auriculaire</a>.</p></section>

<section class="cs-section" id="cs-peripherie" aria-labelledby="cs-h-peripherie"><h2 id="cs-h-peripherie"><span>4</span>Examiner les signes périphériques et les pouls</h2><p>La périphérie peut révéler une mauvaise perfusion, une maladie vasculaire ou un contexte systémique. Vous comparez les membres et vous cherchez des signes concordants. La palpation devient plus utile lorsque vous connaissez le trajet de l’artère.</p><h3>Mains, peau et face</h3><p>Vous appréciez la température et la coloration des mains. Vous examinez les ongles et la peau selon la question clinique. Un hippocratisme digital possède plusieurs causes et ne désigne pas une cardiopathie particulière. Des lésions cutanées évocatrices d’une endocardite doivent être confrontées à la fièvre, au contexte et aux examens. Leur absence n’exclut pas la maladie.</p><p>Vous observez les conjonctives et les muqueuses si vous recherchez une anémie ou une cyanose. Vous repérez les cicatrices, les dispositifs implantés et les signes de traitement. Ils orientent l’anamnèse et les précautions de l’examen, sans fournir à eux seuls le diagnostic actuel.</p><h3>Comparer les axes artériels</h3><p>Vous palpez les pouls brachial, radial, fémoral, poplité, tibial postérieur et pédieux selon l’indication. Le fémoral se cherche sous le ligament inguinal. Le tibial postérieur se cherche derrière la malléole médiale. Le pédieux se cherche sur le dos du pied, avec une position variable. Le poplité se cherche profondément avec le genou légèrement fléchi.</p><button type="button" class="cs-open" data-cs-model="pulses">Ouvrir les sites de palpation en 3D</button><p>Vous comparez les côtés et décrivez un pouls présent, diminué ou non perçu. « Non perçu » ne signifie pas automatiquement « artère occluse ». Une technique difficile, un œdème ou une variation anatomique peut expliquer l’absence palpatoire. Un Doppler et des mesures hémodynamiques complètent une suspicion d’artériopathie.</p><div class="cs-key"><b>À retenir.</b> La comparaison bilatérale et la progression le long de l’axe orientent un obstacle. Vous ne massez pas un mollet douloureux pour rechercher une thrombose ; le signe de Homans ne constitue pas un test diagnostique fiable.</div><p class="cs-course-links">Vous reliez ces signes à <a href="#/entry/I70">I70 · Artériopathie</a> et <a href="#/entry/I80">I80 · Thrombose veineuse</a>.</p></section>

<section class="cs-section" id="cs-cou" aria-labelledby="cs-h-cou"><h2 id="cs-h-cou"><span>5</span>Distinguer la jugulaire de la carotide</h2><p>Le cou montre une onde artérielle et une onde veineuse. La première reflète l’éjection artérielle ; la seconde renseigne indirectement sur les pressions droites. Leur confusion peut conduire à déclarer une congestion inexistante.</p><h3>Observer la pression veineuse jugulaire</h3><p>Vous installez le patient en position semi-assise et vous ajustez l’inclinaison pour voir le sommet des oscillations. Vous relâchez le cou et observez préférentiellement le trajet de la jugulaire interne droite. L’onde veineuse n’est normalement pas palpable. Elle varie avec la respiration et la position ; sa forme peut comporter plusieurs oscillations.</p><p>Vous identifiez le point le plus haut de l’onde, puis mesurez sa hauteur verticale au-dessus de l’angle sternal. Vous notez cette hauteur en centimètres avec l’inclinaison du patient. L’ajout conventionnel de cinq centimètres estime une pression en centimètres d’eau, avec des limites anatomiques. Ce résultat ne doit pas être converti implicitement en mmHg.</p><button type="button" class="cs-open" data-cs-model="neck">Ouvrir jugulaire, carotide et angle sternal en 3D</button><p>Une hauteur de six centimètres au-dessus de l’angle sternal correspond, avec cette convention, à environ onze centimètres d’eau. Vous interprétez l’estimation avec les œdèmes, les symptômes et l’état respiratoire. Lorsque l’onde n’est pas identifiable, vous écrivez « jugulaire non visualisée ». Vous ne la déclarez pas normale.</p><h3>Palper la carotide avec prudence</h3><p>Vous palpez doucement une carotide à la fois. Vous ne comprimez jamais les deux carotides simultanément et vous ne réalisez pas de massage du sinus carotidien dans cet examen de routine. Vous appréciez l’amplitude et la montée de l’onde. Un pouls lentement ascendant peut orienter un rétrécissement aortique, mais l’échocardiographie caractérise la valve.</p><p>La respiration aide à interpréter l’onde veineuse. Une absence de diminution ou une augmentation inspiratoire peut évoquer un défaut de remplissage droit dans certains contextes. Vous ne déduisez pas une étiologie unique de ce signe. Les mouvements du cou, une mauvaise inclinaison et une respiration forcée peuvent rendre sa lecture difficile.</p><div class="cs-key"><b>À retenir.</b> Vous décrivez d’abord ce que vous avez réellement observé. Une estimation jugulaire renseigne les pressions droites ; elle ne mesure pas directement le volume sanguin total.</div></section>

<section class="cs-section" id="cs-precordium" aria-labelledby="cs-h-precordium"><h2 id="cs-h-precordium"><span>6</span>Inspecter et palper le précordium</h2><p>La paroi thoracique transmet certains mouvements cardiaques. Leur siège et leur durée orientent la taille et la charge des cavités. Vous observez avant de palper afin de ne pas effacer une impulsion discrète.</p><h3>Localiser le choc de pointe</h3><p>Vous recherchez les cicatrices, les déformations et les pulsations visibles. Vous palpez ensuite avec la pulpe des doigts. Le choc de pointe se situe habituellement vers le cinquième espace intercostal gauche, près de la ligne médioclaviculaire. Sa perception dépend de la morphologie, de la position et des poumons.</p><p>Vous décrivez le siège, l’étendue et la durée de l’impulsion. Une pointe déplacée latéralement peut accompagner une dilatation, mais aussi un déplacement du médiastin. Une impulsion soutenue peut évoquer une surcharge de pression. L’absence de choc palpable ne prouve pas une fonction normale ou anormale.</p><h3>Explorer le bord sternal et les vibrations</h3><p>Vous palpez la région parasternale avec la base de la main pour rechercher un soulèvement. Vous recherchez aussi un frémissement avec la paume ou la pulpe des doigts. Ce frémissement correspond à une vibration palpable du flux turbulent. Vous le décrivez par son siège et son temps dans le cycle.</p><button type="button" class="cs-open" data-cs-model="thorax" data-cs-point="apex">Ouvrir les repères du choc de pointe en 3D</button><div class="cs-key"><b>À retenir.</b> La palpation formule une hypothèse hémodynamique. L’échocardiographie précise les dimensions, les valves et la fonction des cavités.</div></section>

<section class="cs-section" id="cs-auscultation" aria-labelledby="cs-h-auscultation"><h2 id="cs-h-auscultation"><span>7</span>Auscultation : repérer, dater, décrire puis interpréter</h2><p>L’auscultation ne consiste pas seulement à reconnaître un nom de souffle. Vous devez d’abord situer les bruits et la phase du cycle. Les foyers représentent des zones où les sons se transmettent bien ; ils ne sont pas les projections exactes des valves.</p><h3>Retrouver les espaces intercostaux</h3><p>Vous repérez l’angle sternal, puis la deuxième côte. Vous comptez les espaces intercostaux à partir de ce repère. Le mamelon ne constitue pas un repère constant. Vous appliquez le stéthoscope directement sur la peau en respectant l’intimité.</p><p>Le tableau indique les zones initiales d’écoute. Vous explorez ensuite les régions voisines et les irradiations selon ce que vous entendez.</p><div class="cs-table-wrap"><table><thead><tr><th>Foyer</th><th>Repère de surface</th><th>Question principale</th></tr></thead><tbody><tr><td>Aortique</td><td>Deuxième espace intercostal droit, près du sternum.</td><td>Vous cherchez surtout un souffle d’éjection et sa transmission.</td></tr><tr><td>Pulmonaire</td><td>Deuxième espace intercostal gauche, près du sternum.</td><td>Vous écoutez notamment les composantes du deuxième bruit.</td></tr><tr><td>Tricuspide</td><td>Bord sternal gauche bas, vers les quatrième et cinquième espaces.</td><td>Vous cherchez un souffle droit et sa variation respiratoire.</td></tr><tr><td>Mitral</td><td>Région de l’apex, habituellement au cinquième espace gauche.</td><td>Vous cherchez les souffles et les bruits d’origine apicale.</td></tr><tr><td>Zone d’Erb</td><td>Troisième espace intercostal gauche, près du sternum.</td><td>Vous complétez l’écoute, notamment d’une fuite aortique.</td></tr></tbody></table></div><p>Le lecteur associe chaque repère à une question, sans limiter l’écoute à ce point. Une fuite aortique peut être mieux entendue au bord sternal gauche que dans le foyer aortique classique. La fenêtre 3D rend cette distinction visible.</p><button type="button" class="cs-open" data-cs-model="thorax">Ouvrir les cinq zones d’écoute en 3D</button><h3>Identifier les bruits et le temps du souffle</h3><p>Le premier bruit, B1, correspond principalement à la fermeture des valves mitrale et tricuspide. Le deuxième bruit, B2, correspond à la fermeture aortique et pulmonaire. La systole se situe entre B1 et B2. La diastole se situe entre B2 et le B1 suivant. La palpation douce d’un pouls carotidien, d’un seul côté, peut aider à dater la systole.</p><p>À l’inspiration, la fermeture pulmonaire peut être retardée : le dédoublement physiologique de B2 augmente. Un dédoublement fixe ou paradoxal suggère d’autres mécanismes, mais doit être confirmé dans le contexte. Un troisième bruit peut être physiologique chez un sujet jeune. Chez un adulte symptomatique, il peut orienter une surcharge ou un remplissage rapide anormal. Un quatrième bruit nécessite une contraction auriculaire et n’est donc pas attendu dans une FA persistante.</p><button type="button" class="cs-open" data-cs-model="heart">Relier cavités, valves et cycle dans la fenêtre 3D</button><h3>Décrire un souffle avant de nommer la maladie</h3><p>Vous précisez le temps, le siège maximal, l’irradiation, la forme, le timbre et l’intensité. Vous indiquez les variations avec la respiration et la position. Vous distinguez un souffle systolique, diastolique et continu. Un souffle diastolique impose la recherche d’une anomalie ; l’échocardiographie précise sa cause et son retentissement.</p><p>L’intensité peut être décrite sur six degrés. Un frémissement accompagne classiquement les degrés élevés, à partir du quatrième. Le volume sonore n’est toutefois pas une mesure directe de gravité. Une valve très malade avec un débit faible peut produire un souffle discret.</p><p>Un souffle d’éjection au foyer aortique irradiant vers les carotides évoque un rétrécissement aortique. Un souffle holosystolique apical irradiant vers l’aisselle évoque une fuite mitrale. Un souffle diastolique décroissant au bord sternal gauche évoque une fuite aortique. Ces descriptions orientent une hypothèse ; elles n’établissent pas seules le diagnostic.</p><h3>Utiliser la position pour tester une hypothèse</h3><p>En décubitus latéral gauche, vous rapprochez l’apex de la paroi et recherchez les phénomènes graves avec la cloche posée légèrement. Pour une fuite aortique, vous écoutez le patient assis, penché en avant, en expiration confortable. Vous cessez la manœuvre si elle provoque une gêne.</p><p>L’inspiration augmente le retour veineux droit et peut renforcer un souffle tricuspide. Les manœuvres de Valsalva ou d’accroupissement modifient le remplissage et les résistances. Elles peuvent aider une question précise, par exemple une obstruction dynamique, chez un patient stable et sous supervision. Elles ne remplacent pas l’examen de base.</p><div class="cs-key"><b>Science → examen.</b> La direction du flux, le gradient de pression et le moment d’ouverture ou de fermeture expliquent les sons. Vous décrivez ces observations puis vous choisissez l’échocardiographie adaptée.</div><p class="cs-course-links">Vous approfondissez <a href="#/entry/I35">I35 · Valve aortique</a>, <a href="#/entry/I34">I34 · Valve mitrale</a> et <a href="#/entry/I42">I42 · Cardiomyopathies</a>.</p></section>

<section class="cs-section" id="cs-congestion" aria-labelledby="cs-h-congestion"><h2 id="cs-h-congestion"><span>8</span>Compléter par les poumons, l’abdomen et les jambes</h2><p>Un examen cardiovasculaire complet recherche les conséquences en amont et en aval du cœur. La congestion pulmonaire et la congestion systémique ne se présentent pas toujours ensemble. Vous cherchez des signes concordants et des diagnostics alternatifs.</p><h3>Poumons et abdomen</h3><p>Vous auscultez les bases et les autres champs pulmonaires selon la situation. Des crépitants peuvent accompagner une congestion, mais aussi une infection ou une maladie interstitielle. Leur absence ne suffit pas à exclure une insuffisance cardiaque. Vous recherchez aussi des signes d’épanchement si l’histoire ou l’examen les évoque.</p><p>Vous examinez l’abdomen lorsque le contexte le justifie. Une hépatomégalie douloureuse, une ascite ou une augmentation soutenue de l’onde jugulaire pendant une pression abdominale peuvent orienter une congestion droite. Vous évitez une pression douloureuse et vous interprétez la manœuvre avec la respiration et les autres signes.</p><h3>Œdèmes et perfusion distale</h3><p>Vous comparez les jambes, recherchez un œdème prenant le godet et observez les régions déclives. Chez un patient alité, l’œdème peut être sacré. Une atteinte bilatérale peut accompagner une congestion, mais aussi une maladie rénale, hépatique, veineuse ou un effet médicamenteux. Une jambe unilatéralement gonflée impose un raisonnement distinct.</p><p>Vous examinez les pieds, les plaies, la température et les pouls. Une douleur de repos, un pied froid ou un déficit moteur nouveau exige une évaluation vasculaire urgente. Vous ne déduisez pas la perfusion d’une seule couleur ou d’un seul pouls.</p><div class="cs-key"><b>À retenir.</b> La congestion est une interprétation de plusieurs observations. Elle ne se réduit pas à l’existence d’un œdème.</div><p class="cs-course-links">Vous reliez ce tableau à <a href="#/entry/I50">I50 · Insuffisance cardiaque</a>.</p></section>

<section class="cs-section" id="cs-synthese" aria-labelledby="cs-h-synthese"><h2 id="cs-h-synthese"><span>9</span>Présenter une synthèse sans dépasser les signes</h2><p>Une bonne synthèse sépare les constatations, leur interprétation et la suite de l’évaluation. Elle décrit aussi les limites techniques. Vous pouvez ainsi transmettre une hypothèse claire sans transformer l’examen en certitude injustifiée.</p><div class="cs-case"><b>Exemple de présentation.</b><p>« Le patient est confortable au repos, mais décrit une dyspnée d’effort. Le pouls est régulier à 78 par minute. La pression est de 132/76 mmHg au bras droit avec un brassard adapté. La jugulaire est visualisée à une hauteur augmentée ; je précise la mesure et l’inclinaison. J’entends des crépitants aux bases et j’observe des œdèmes bilatéraux prenant le godet. Ces signes concordent avec une congestion. Une échocardiographie et le bilan adapté préciseront la cause et le retentissement. »</p></div><p>Lorsque la jugulaire reste invisible, vous remplacez cette constatation par une limite explicite. Lorsque l’auscultation est difficile, vous le signalez. Vous mentionnez les signes d’alerte, puis les examens qui répondent aux incertitudes restantes.</p><div class="cs-key"><b>Science → décision.</b> Le signe apporte une information sur un mécanisme. La décision combine cette information avec l’histoire, les constantes et les examens adaptés.</div></section>

<section class="cs-section" id="cs-entrainement" aria-labelledby="cs-h-entrainement"><h2 id="cs-h-entrainement"><span>10</span>S’entraîner au raisonnement et au déroulement</h2><p>Ces cas vérifient l’interprétation d’un geste, puis la liste de contrôle aide une répétition supervisée. Le compteur indique uniquement les étapes que vous avez cochées. Il ne constitue pas une note de compétence clinique.</p><div class="cs-quiz" data-cs-answer="b"><h3>Cas 1 · Une jugulaire difficile à voir</h3><p>Vous ne parvenez pas à identifier une onde veineuse cervicale. Quelle formulation transmet correctement le résultat ?</p><button type="button" data-cs-choice="a">La pression veineuse est normale.</button><button type="button" data-cs-choice="b">La jugulaire n’est pas visualisée ; sa hauteur n’est pas évaluée.</button><p class="cs-feedback" hidden>Vous décrivez la limite réelle. Une onde non visualisée ne permet pas de conclure qu’elle est basse ou normale.</p></div><div class="cs-quiz" data-cs-answer="a"><h3>Cas 2 · Un pouls irrégulier</h3><p>Le pouls radial est irrégulier. Le patient montre une alerte optique de sa montre. Quelle étape confirme le rythme ?</p><button type="button" data-cs-choice="a">Un tracé ECG interprété par un médecin.</button><button type="button" data-cs-choice="b">Le nom automatique affiché par la montre suffit.</button><p class="cs-feedback" hidden>L’irrégularité et l’alerte orientent. La documentation ECG confirme. Sa durée et la décision de traitement s’interprètent selon le contexte.</p></div><div class="cs-quiz" data-cs-answer="b"><h3>Cas 3 · Un souffle discret</h3><p>Un patient dyspnéique possède un souffle systolique peu intense. Quelle conclusion est correcte ?</p><button type="button" data-cs-choice="a">Une faible intensité exclut une valvulopathie sévère.</button><button type="button" data-cs-choice="b">Le débit et les conditions d’écoute peuvent réduire l’intensité ; le contexte reste déterminant.</button><p class="cs-feedback" hidden>Le volume sonore ne mesure pas directement la sévérité. La description, les symptômes et l’échocardiographie orientent l’évaluation.</p></div><div class="cs-checklist"><h3>Liste de contrôle d’une station clinique</h3><p>Vous cochez une étape après l’avoir expliquée et pratiquée. Les cases servent à votre entraînement dans ce navigateur.</p><label><input type="checkbox" data-cs-check="preparation"> J’ai confirmé l’identité, obtenu l’accord et adapté l’exposition.</label><label><input type="checkbox" data-cs-check="general"> J’ai évalué l’état général et recherché une situation instable.</label><label><input type="checkbox" data-cs-check="constantes"> J’ai mesuré et documenté les constantes avec leur technique.</label><label><input type="checkbox" data-cs-check="pouls"> J’ai comparé les pouls et examiné la perfusion périphérique.</label><label><input type="checkbox" data-cs-check="jugulaire"> J’ai distingué jugulaire et carotide, puis décrit la hauteur ou sa limite.</label><label><input type="checkbox" data-cs-check="palpation"> J’ai inspecté et palpé le précordium.</label><label><input type="checkbox" data-cs-check="auscultation"> J’ai écouté les foyers et décrit les bruits ainsi que les souffles.</label><label><input type="checkbox" data-cs-check="congestion"> J’ai recherché la congestion pulmonaire et systémique.</label><label><input type="checkbox" data-cs-check="synthese"> J’ai présenté les constatations, les hypothèses et les limites.</label><output class="cs-progress" aria-live="polite">0 / 9 étapes cochées</output><button type="button" class="cs-reset-checklist">Réinitialiser mon entraînement</button></div></section>
