<p>Devant une masse, la topographie et le retentissement guident l’imagerie et l’urgence. Une compression médullaire n’a pas le même délai qu’une petite lésion cutanée stable. Le prélèvement tissulaire doit permettre l’immunohistochimie et, si nécessaire, la génétique ; un résultat qualifié seulement de « petites cellules » ne suffit pas à conclure à un sarcome myéloïde.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a> ; <a data-reference-source="1" href="https://iris.unil.ch/entities/publication/607ac57b-f30a-4d32-aa01-23eaa45bb7f9" target="_blank" rel="noopener">[S511] Manifestations ORL du sarcome myéloïde</a>.</p></div></section><section class="ilot" id="c92-semio-interpretation" data-semiology="interpretation"><h3>5. Interpréter ensemble, sans raccourci</h3>
<p>Une leucocytose ne prouve pas une leucémie et une numération leucocytaire normale ne l’exclut pas. Un pourcentage de blastes doit être rattaché au sang ou à la moelle, à une méthode et à la classification utilisée. La règle de 20 % conserve une place importante mais comporte des exceptions génétiques ; <button class="w" data-k="c92-classification">OMS</button> et <button class="w" data-k="c92-classification">ICC</button> ne formulent pas toutes ces exceptions de la même façon.</p>
<p>Un corps d’Auer soutient la différenciation myéloïde, sans identifier à lui seul <button class="w" data-k="c92-differenciation">PML::RARA</button>. Une PCR ciblée négative ne remplace pas la vérification d’une discordance avec caryotype ou FISH ; des transcrits atypiques peuvent échapper à une méthode. Pour une <button class="w" data-k="c92-bcr-abl">LMC</button>, la démonstration de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> est centrale, tandis qu’un MDS/MPN avec neutrophilie exige son exclusion et d’autres critères.</p>
<p>Après traitement, rémission morphologique, récupération des numérations et maladie résiduelle mesurable décrivent trois dimensions. Une moelle à moins de 5 % de blastes ne prouve pas seule une rémission complète ; une <button class="w" data-k="c92-mrd">MRD</button> négative signifie absence de signal détecté dans les conditions de l’analyse, pas absence certaine de toute cellule leucémique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></section><section class="ilot" id="c92-semio-differentials" data-semiology="differentials"><h3>6. Construire les diagnostics différentiels</h3>
<p>Selon le tableau, discuter réaction infectieuse ou inflammatoire, effet médicamenteux, autres néoplasies myéloprolifératives, SMD/MDS-MPN, leucémie lymphoblastique et autres causes de cytopénies. La chronologie, la persistance, les cellules observées, les autres lignées et la génétique resserrent les hypothèses. Un traitement récent peut aussi modifier le frottis et les numérations.</p>
<p>Dans une prolifération neutrophilique, <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>, dysgranulopoïèse, proportion de précurseurs et exclusions moléculaires aident à distinguer <button class="w" data-k="c92-bcr-abl">LMC</button>, MDS/MPN avec neutrophilie et autres entités. Dans une masse, lymphome et autres tumeurs font partie des diagnostics concurrents : la morphologie isolée ou un marqueur peu spécifique peut tromper.</p>
<p>Une maladie connue ne protège pas d’une complication indépendante. Une dyspnée chez un patient leucémique peut notamment refléter infection, anémie, surcharge, hémorragie ou leucostase selon le contexte. Reconnaître plusieurs mécanismes évite de retarder un traitement urgent en attribuant tout au clone.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a>.</p></div></section><section class="ilot" id="c92-semio-urgency" data-semiology="urgency"><h3>7. Identifier ce qui ne peut pas attendre</h3>
<p>Suspecter et prendre en charge sans délai une <button class="w" data-k="c92-differenciation">LPA</button> avec coagulopathie, une leucostase symptomatique, une lyse tumorale, une infection grave en contexte neutropénique, une hémorragie menaçante ou une compression neurologique. L’appel spécialisé et la stabilisation se font en parallèle du diagnostic ; ils ne sont pas reportés jusqu’à obtention de toutes les analyses.</p>
<p>Le traitement lui-même crée des urgences : syndrome de différenciation, arythmie avec <button class="w" data-k="c92-interactions">QT</button> prolongé, réaction de perfusion ou toxicité neurologique. La date du traitement et des changements de dose participe à l’interprétation. Les autres causes, notamment infection, ne disparaissent pas parce qu’une toxicité est plausible.</p>
<p>Éviter deux automatismes dangereux : appliquer une leucaphérèse à toute hyperleucocytose, et transfuser les hématies sans discuter le contexte de leucostase. Dans la <button class="w" data-k="c92-differenciation">LPA</button>, support hémostatique et éviction des gestes invasifs non indispensables sont prioritaires. Chaque décision doit être contextualisée plutôt que déduite d’un seuil unique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680690770013" target="_blank" rel="noopener">[S516] Tibsovo / ivosidenib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680548450142" target="_blank" rel="noopener">[S539] Cytosar Solution / cytarabine</a>.</p></div></section><section class="ilot" id="c92-semio-limits" data-semiology="limits"><h3>8. Reconnaître les limites de ce que l’on sait</h3>
<p>Les photographies montrent des champs sélectionnés. Elles ne fournissent ni numération absolue, ni décompte représentatif, ni génotype. Les données de cohorte ou les survies médianes ne prédisent pas le devenir d’une personne. Un taux d’incidence européen ne devient pas une incidence suisse, et une statistique regroupant toutes les leucémies n’est pas celle de C92 seul.</p>
<p>Le risque <button class="w" data-k="c92-sources">ELN</button> dépend de la version et du traitement : la classification de 2022 pour traitements intensifs n’est pas interchangeable avec celle de 2024 pour certains traitements moins intensifs. Les entités rares disposent souvent de données rétrospectives. Les divergences entre recommandations et <button class="w" data-k="c92-fi">FI</button> doivent être nommées, pas masquées derrière un seul tableau.</p>
<p>L’examen clinique oriente la probabilité et la gravité, mais les sources consultées ne donnent pas ici une sensibilité/spécificité universelle de chaque signe pour C92. La leçon ne transforme pas cette absence de mesure en chiffre inventé. Les cas pédagogiques sont fictifs ; leur réponse ne remplace pas l’évaluation d’une personne réelle.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/NBK608332/" target="_blank" rel="noopener">[S509] EBMT Handbook, chapter76: Myelodysplastic/Myeloproliferative Neoplasms</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">[S537] Le cancer en Suisse, rapport 2021, leucémies</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Auer_rods.PNG" target="_blank" rel="noopener">[S529] Auer rods, aspirat médullaire humain</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Peripheral_blood_smear_of_acute_promyelocytic_leukemia,_hypogranular_variant,_source_image_(1).jpg" target="_blank" rel="noopener">[S530] Peripheral smear, hypogranular APL</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Chronic_Myeloid_Leukemia_smear_2009-04-09.JPG" target="_blank" rel="noopener">[S531] CML blood smear with left shift</a>.</p></div></section><section class="ilot" id="c92-semio-sources" data-semiology="sources"><h3>9. Sources et portée des liens cliniques</h3>
<p>Le codage repose sur la CIM-10-GM française publiée par l’<button class="w" data-k="c92-classification">OFS</button>. La classification biologique s’appuie sur l’<button class="w" data-k="c92-classification">OMS</button> 2022 et les distinctions <button class="w" data-k="c92-classification">ICC</button> exposées par l’<button class="w" data-k="c92-sources">ELN</button>. Les recommandations <button class="w" data-k="c92-sources">ELN</button> 2022/2024 pour <button class="w" data-k="c92-classification">LAM</button> et <button class="w" data-k="c92-sources">ELN</button> 2025 pour <button class="w" data-k="c92-bcr-abl">LMC</button>, les recommandations Onkopedia lues et les informations professionnelles suisses datées structurent les décisions décrites.</p>
<p>Le chapitre suisse CHUV de <button class="w" data-k="c92-bcr-abl">LMC</button> sert pour manifestations et diagnostic, pas comme source thérapeutique suffisante pour 2026. Le résumé institutionnel suisse sur le sarcome ORL est identifié comme résumé, avec complément par une revue européenne. EBMT et MLL éclairent les entités rares et leurs limites. Les références sont attribuées aux passages ; aucune lecture intégrale de chaque document ni validation médicale humaine n’est revendiquée.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S501] CIM-10-GM 2024 français, catégories C92</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fr/hematologie/hem-home/patients-et-famille/maladies-et-traitements/cancers-du-sang/leucemies-aigues-ou-chroniques/leucemie-myeloide-chronique" target="_blank" rel="noopener">[S538] Leucémie myéloïde chronique : manifestations et diagnostic</a> ; <a data-reference-source="1" href="https://iris.unil.ch/entities/publication/607ac57b-f30a-4d32-aa01-23eaa45bb7f9" target="_blank" rel="noopener">[S511] Manifestations ORL du sarcome myéloïde</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/NBK608332/" target="_blank" rel="noopener">[S509] EBMT Handbook, chapter76: Myelodysplastic/Myeloproliferative Neoplasms</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a>.</p></div></section><figure id="c92-causal-semio"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="Du signe à la décision"><title>Du signe à la décision</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Décrire symptôme, chronologie et</tspan><tspan x="290" dy="29">gravité</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Relier aux fonctions perturbées</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Comparer les mécanismes possibles</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Choisir examen et traitement</tspan><tspan x="290" dy="29">urgent utiles</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="572" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Réévaluer avec les résultats et la</tspan><tspan x="290" dy="29">réponse</tspan></text></svg><figcaption><b>Du signe à la décision.</b> Schéma de raisonnement ; aucun signe isolé ne démontre toutes les maladies de C92. Schéma logique pédagogique ; aucune structure anatomique dessinée.</figcaption></figure><div class="key"><p><b>Science → clinique.</b> Chronologie et gravité orientent les mécanismes possibles.</p><p><b>Science → examen.</b> Hémogramme, frottis, coagulation et génétique répondent à des questions différentes.</p><p><b>Science → traitement.</b> Stabiliser les urgences en parallèle du diagnostic précis.</p><p><b>À retenir.</b> Relier fonction normale, mécanisme, mesure et décision sans effacer les limites.</p></div><button class="pareto-btn ui" data-k="pareto-c92-semio">▲ Loi de Pareto — Sémiologie fondamentale et analytique</button></div><div class="sci" id="c92-s-anat" role="tabpanel" aria-labelledby="c92-tab-anat" hidden><section class="ilot" id="c92-s-anat-cours"><h3>Moelle, sang et tissus : trois espaces à relier</h3>
<p>Le tissu hématopoïétique médullaire occupe des espaces au sein de l’os. Son organisation permet renouvellement, maturation et passage des cellules vers la circulation. La photographie macroscopique ci-dessous localise ce compartiment entre les travées ; elle ne montre ni la hiérarchie des cellules souches, ni les marqueurs de surface, ni les anomalies génétiques. La structure visible sert de repère spatial à un fonctionnement qui nécessite d’autres méthodes pour être étudié.</p>
<p>Le sang circulant est un échantillon accessible, mais il n’est pas une copie complète de la moelle. Des cellules anormales peuvent prédominer dans la moelle sans être nombreuses dans le sang. À l’inverse, une forte circulation de cellules renseigne sur leur présence, sans décrire l’architecture médullaire. Cette différence explique pourquoi numération, frottis, aspiration et biopsie ne sont pas redondants.</p>
<figure id="c92-science-marrow" data-origin="human-original"><img src="assets/img/c92/alpha/codex/normal-marrow-openstax2016.jpg" alt="Photographie de coupe osseuse montrant espaces médullaires rouges entre les travées" loading="lazy"><figcaption><b>Le compartiment médullaire normal.</b> <b>Repère 1, centre rouge :</b> tissu médullaire entre les travées. <b>Repère 2, travées claires :</b> charpente spongieuse. <b>Repère 3, périphérie :</b> limite osseuse de la pièce. <b>Repère 4, barre blanche supérieure :</b> barre originale conservée, sans mesure calculée faute de valeur lisible. Cette vue macroscopique localise un compartiment ; elle ne compte ni blastes ni cellules souches et ne montre aucun génotype. Original : OpenStax, édition 8.25 du 18 mai 2016, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; repères français ajoutés à la légende.</figcaption></figure>
<p>L’aspiration fournit des cellules dissociées pour morphologie, cytométrie et génétique. La biopsie conserve une architecture : cellularité, répartition d’un infiltrat et environnement tissulaire. Un prélèvement hémodilué ou pauvre peut sous-représenter la population recherchée. La qualité et le site du prélèvement doivent donc accompagner l’interprétation, surtout lorsque le résultat paraît incompatible avec la clinique.</p>
<p>La rate participe à la circulation et au traitement des éléments sanguins ; elle peut augmenter de volume dans certaines néoplasies myéloïdes. Une gêne sous-costale gauche ou une satiété précoce peut conduire à son examen. La splénomégalie n’est cependant pas spécifique de <button class="w" data-k="c92-bcr-abl">LMC</button> : infections, maladies hépatiques et autres hémopathies font partie des contextes possibles. Le mécanisme et l’étiologie ne se déduisent pas du seul volume.</p>
<p>Un sarcome myéloïde correspond à une masse de cellules myéloïdes immatures en dehors de la moelle. Le site détermine une partie des symptômes : peau, tissus mous, os, structures ORL ou autres organes ne donnent pas la même présentation. Une lésion rachidienne avec compression impose une priorité différente d’une masse sans retentissement immédiat. Pourtant, le traitement n’est pas uniquement déterminé par la topographie : la nature systémique potentielle justifie un bilan médullaire et moléculaire.</p>
<p>L’imagerie répond à des questions anatomiques : localisation, extension, compression, sites multiples et accessibilité d’une biopsie. Elle ne remplace pas l’identification du type cellulaire. Une réponse locale après traitement ne prouve pas seule la disparition du clone dans les autres compartiments. Le raisonnement doit conserver la distinction entre cible visible, maladie systémique et mesure de réponse.</p>
<p>Cette carte des compartiments guide enfin les gestes. La coagulopathie d’une <button class="w" data-k="c92-differenciation">LPA</button> modifie le risque d’un prélèvement invasif ; l’urgence du diagnostic doit être conciliée avec sa sécurité. L’absence d’une image spectaculaire n’autorise pas à retarder une prise en charge si le sang, la coagulation et l’état clinique indiquent une urgence.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S525] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S528] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a> ; <a data-reference-source="1" href="https://iris.unil.ch/entities/publication/607ac57b-f30a-4d32-aa01-23eaa45bb7f9" target="_blank" rel="noopener">[S511] Manifestations ORL du sarcome myéloïde</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Un clone médullaire peut avoir un retentissement sanguin et extramédullaire.</p><p><b>Science → examen.</b> Aspiration, biopsie et imagerie renseignent des compartiments différents.</p><p><b>Science → traitement.</b> Le contrôle local d’une masse ne remplace pas le traitement systémique indiqué.</p><p><b>À retenir.</b> Relier fonction normale, mécanisme, mesure et décision sans effacer les limites.</p></div><button class="pareto-btn ui" data-k="pareto-c92-anat">▲ Loi de Pareto — Anatomie</button></div><div class="sci" id="c92-s-histo" role="tabpanel" aria-labelledby="c92-tab-histo" hidden><section class="ilot" id="c92-s-histo-cours"><h3>De la cellule normale au clone : regarder sans surinterpréter</h3>
<p>La maturation granulocytaire transforme progressivement noyau, chromatine et cytoplasme. Dans le sang normal, les éléments matures ont des fonctions différentes de celles des précurseurs médullaires. Le frottis permet de reconnaître des catégories morphologiques, mais les limites entre certaines cellules exigent expérience, coloration adaptée et décompte représentatif.</p>
<p>Un blaste se décrit avec taille, rapport nucléocytoplasmique, chromatine, nucléoles et cytoplasme. Aucun de ces caractères isolés ne suffit à définir toute une lignée ou toute une entité. La leucémie peut modifier les aspects habituels et exprimer des marqueurs aberrants. Morphologie, cytométrie et génétique se complètent ; un désaccord doit être résolu, pas effacé.</p>
<figure id="c92-science-auer" data-origin="human-original"><img src="assets/img/c92/alpha/codex/aml-auer-rods.png" alt="Aspirat médullaire humain de leucémie aiguë myéloïde avec deux flèches rouges originales vers des corps d’Auer" loading="lazy"><figcaption><b>Un indice de différenciation myéloïde.</b> <b>Repère 1, flèche rouge centrale :</b> inclusion cytoplasmique allongée désignée dans l’original. <b>Repère 2, flèche rouge en haut à droite :</b> second repérage original. <b>Repère 3, grandes cellules violettes :</b> population blastique décrite dans la provenance ; apprécier noyau et cytoplasme avec le laboratoire. <b>Repère 4, ensemble du champ :</b> image sélectionnée, sans décompte représentatif de toute la moelle. Les flèches existaient avant MEDINA. Un corps d’Auer oriente vers une différenciation myéloïde ; cette image ne démontre ni <button class="w" data-k="c92-differenciation">PML::RARA</button> ni un sous-type génétique précis. Original : VashiDonsk, téléversement original du 4 mai 2006, <a href="https://commons.wikimedia.org/wiki/File:Auer_rods.PNG" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels intacts ; repères français ajoutés à la légende. La figure et ses annotations françaises sont proposées sous CC BY-SA 3.0.</figcaption></figure>
<p>Les corps d’Auer sont des inclusions cytoplasmiques associées à la différenciation myéloïde. Leur présence est un indice utile, pas une analyse moléculaire. Les deux flèches rouges de l’original ont été conservées ; elles ne transforment pas le champ en décompte de blastes. Une image sélectionnée peut illustrer un signe sans représenter la proportion de cellules porteuses dans toute la moelle.</p>
<figure id="c92-science-apl" data-origin="human-original"><img src="assets/img/c92/alpha/codex/apl-hypogranular.jpg" alt="Frottis sanguin humain de LPA hypogranulaire montrant deux cellules anormales et des hématies" loading="lazy"><figcaption><b>Une <button class="w" data-k="c92-differenciation">LPA</button> peut être peu granuleuse.</b> <b>Repère 1, grande cellule à gauche :</b> noyau irrégulier, avec repli du contour. <b>Repère 2, cellule au centre droit :</b> autre noyau irrégulier et cytoplasme périphérique. <b>Repère 3, cytoplasme bleu :</b> les grosses granulations typiques ne sont pas évidentes dans ce champ. <b>Repère 4, disques rosés autour :</b> hématies servant de contexte visuel, sans étalonnage de taille. La provenance indique une <button class="w" data-k="c92-differenciation">LPA</button> hypogranulaire, coloration de Wright. Aucun corps d’Auer n’est affirmé ici ; la photographie seule ne démontre pas <button class="w" data-k="c92-differenciation">PML::RARA</button>. Original : Mikael Häggström, 29 novembre 2022, <a href="https://commons.wikimedia.org/wiki/File:Peripheral_blood_smear_of_acute_promyelocytic_leukemia,_hypogranular_variant,_source_image_(1).jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0</a>. Pixels intacts ; repères français ajoutés à la légende.</figcaption></figure>
<p>La <button class="w" data-k="c92-differenciation">LPA</button> hypogranulaire montre pourquoi une règle visuelle trop simple est dangereuse. Les granulations peuvent être peu évidentes et les noyaux irréguliers. La provenance de la figure précise le diagnostic et la coloration ; aucun corps d’Auer n’est affirmé dans ce champ. En situation clinique, la morphologie suspecte déclenche une recherche rapide de <button class="w" data-k="c92-differenciation">PML::RARA</button> et la gestion de la coagulopathie, sans attendre une « photographie parfaite ».</p>
<figure id="c92-science-cml" data-origin="human-original"><img src="assets/img/c92/alpha/codex/cml-left-shift.jpg" alt="Frottis humain de LMC riche en éléments granulocytaires de maturations différentes" loading="lazy"><figcaption><b>Des maturations différentes dans le même frottis.</b> <b>Repère 1, moitié supérieure :</b> éléments nucléés nombreux, aux formes variées. <b>Repère 2, centre inférieur :</b> cellules à noyau segmenté clairement visibles. <b>Repère 3, grandes cellules moins segmentées :</b> contraste de maturation décrit comme déviation à gauche dans la provenance. <b>Repère 4, fond du champ :</b> hématies plus pâles autour des éléments nucléés. Aucun basophile précis ni pourcentage de blastes n’est assigné à cette seule image. Le diagnostic de <button class="w" data-k="c92-bcr-abl">LMC</button> exige <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> ; une photographie ne mesure pas non plus la leucocytose absolue. Original : Paulo Henrique Orlandi Mourao, 9 avril 2009, <a href="https://commons.wikimedia.org/wiki/File:Chronic_Myeloid_Leukemia_smear_2009-04-09.JPG" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels intacts ; repères français ajoutés à la légende. La figure et ses annotations françaises sont proposées sous CC BY-SA 3.0.</figcaption></figure>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, un frottis peut montrer un continuum de maturation granulocytaire. Le champ choisi illustre cette diversité, pas la valeur absolue des leucocytes ni la preuve de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>. La basophilie, lorsqu’elle est documentée par un décompte, participe au bilan ; elle n’est pas assignée ici à une cellule incertaine pour fabriquer un repère.</p>
<p>La dysplasie désigne des anomalies morphologiques de maturation. Elle peut être importante dans un MDS/MPN avec neutrophilie, mais la dysplasie seule ne définit plus toutes les catégories modernes de <button class="w" data-k="c92-classification">LAM</button> liées à la myélodysplasie. Le contexte, les anomalies cytogénétiques et les mutations déterminées par la classification choisie doivent être intégrés. Le changement de nom n’est donc pas seulement un changement d’étiquette.</p>
<p>Enfin, le décompte dépend du matériel : sang, aspiration médullaire, apposition ou tissu. Les critères de réponse utilisent des seuils et des exigences distincts du simple diagnostic morphologique. La photographie pédagogique ne peut ni démontrer une rémission, ni établir une maladie résiduelle négative. Son rôle est d’apprendre à poser la question que le laboratoire pourra mesurer.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S526] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Auer_rods.PNG" target="_blank" rel="noopener">[S529] Auer rods, aspirat médullaire humain</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Peripheral_blood_smear_of_acute_promyelocytic_leukemia,_hypogranular_variant,_source_image_(1).jpg" target="_blank" rel="noopener">[S530] Peripheral smear, hypogranular APL</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Chronic_Myeloid_Leukemia_smear_2009-04-09.JPG" target="_blank" rel="noopener">[S531] CML blood smear with left shift</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> La maturation cellulaire et ses anomalies expliquent les aspects du frottis.</p><p><b>Science → examen.</b> Un champ choisi ne vaut ni décompte représentatif ni génotype.</p><p><b>Science → traitement.</b> Une suspicion morphologique de <button class="w" data-k="c92-differenciation">LPA</button> impose un circuit urgent.</p><p><b>À retenir.</b> Relier fonction normale, mécanisme, mesure et décision sans effacer les limites.</p></div><button class="pareto-btn ui" data-k="pareto-c92-histo">▲ Loi de Pareto — Histologie</button></div><div class="sci" id="c92-s-physio" role="tabpanel" aria-labelledby="c92-tab-physio" hidden><section class="ilot" id="c92-s-physio-cours"><h3>Produire, différencier, défendre : les fonctions ne se résument pas au nombre</h3>
<p>L’hématopoïèse normale renouvelle en continu les cellules sanguines. Production, maturation, survie et sortie vers le sang contribuent à la numération observée. Une concentration mesurée à un instant résulte donc de plusieurs processus ; elle ne mesure pas directement la vitesse de production ni la qualité fonctionnelle de chaque cellule.</p>
<p>Dans une <button class="w" data-k="c92-classification">LAM</button>, l’expansion d’un clone et le défaut de différenciation peuvent réduire la production normale. Les conséquences suivent les lignées : transport d’oxygène pour les hématies, défense pour les neutrophiles et hémostase pour les plaquettes. Une leucocytose faite de cellules anormales ne compense pas automatiquement un défaut de défense. Le nombre total et la formule doivent être interprétés ensemble.</p>
<figure id="c92-causal-fonction"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="De la prolifération au signe clinique"><title>De la prolifération au signe clinique</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Clone myéloïde anormal et</tspan><tspan x="290" dy="29">maturation perturbée</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Hématopoïèse normale moins</tspan><tspan x="290" dy="29">efficace</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Défaut de transport, défense ou</tspan><tspan x="290" dy="29">hémostase</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Anémie, infection ou saignement à</tspan><tspan x="290" dy="29">caractériser</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="572" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Examens et prise en charge selon</tspan><tspan x="290" dy="29">mécanisme</tspan></text></svg><figcaption><b>De la prolifération au signe clinique.</b> Chaîne explicative simplifiée ; plusieurs mécanismes peuvent coexister chez une même personne. Schéma logique pédagogique ; aucune structure anatomique dessinée.</figcaption></figure>
<p>L’anémie diminue la capacité de transport d’oxygène ; le retentissement dépend aussi de la vitesse d’installation et des réserves cardiorespiratoires. Une saturation normale ne mesure pas la quantité totale d’hémoglobine disponible. La neutropénie modifie la réponse à l’infection ; l’absence de pus ou de forte réaction locale n’exclut pas une infection grave. La thrombopénie contribue au saignement, mais une coagulopathie peut ajouter un risque indépendant.</p>
<p>La <button class="w" data-k="c92-differenciation">LPA</button> illustre ce dernier point. Le désordre de coagulation n’est pas expliqué uniquement par le remplacement médullaire. Il exige des mesures spécifiques, une surveillance rapprochée et un traitement rapide du mécanisme leucémique. Une amélioration d’un paramètre isolé ne suffit pas à conclure que le risque hémorragique est résolu.</p>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, la maturation relativement conservée rend possible une accumulation importante de granulocytes avec un début parfois peu symptomatique. L’inhibition de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> réduit l’avantage du clone et permet une réponse hématologique, puis moléculaire. Ces étapes n’ont pas le même délai ni la même profondeur : normaliser la numération n’équivaut pas à atteindre une réponse moléculaire majeure.</p>
<p>Après traitement d’une <button class="w" data-k="c92-classification">LAM</button>, l’aplasie liée au médicament peut précéder la récupération des lignées. Une cytopénie persistante peut également refléter la maladie, une infection ou d’autres causes. La moelle, la chronologie et les traitements associés aident à distinguer ces mécanismes. C’est pourquoi la conduite sous vénétoclax diffère avant et après rémission documentée.</p>
<p>La physiologie rend enfin les objectifs cohérents : stabiliser une fonction vitale aujourd’hui, contrôler le clone, puis réduire le risque de rechute. Ces objectifs se complètent mais ne se confondent pas. Une transfusion peut améliorer le transport d’oxygène sans traiter la leucémie ; une réponse moléculaire peut être profonde sans effacer toutes les toxicités ou les besoins de support.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S525] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S526] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S527] 18.5 Hemostasis  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Une leucocytose peut coexister avec une défense inefficace.</p><p><b>Science → examen.</b> Numération, fonction et réponse moléculaire ne sont pas synonymes.</p><p><b>Science → traitement.</b> Support immédiat, contrôle du clone et prévention de rechute se complètent.</p><p><b>À retenir.</b> Relier fonction normale, mécanisme, mesure et décision sans effacer les limites.</p></div><button class="pareto-btn ui" data-k="pareto-c92-physio">▲ Loi de Pareto — Physiologie</button></div><div class="sci" id="c92-s-bio" role="tabpanel" aria-labelledby="c92-tab-bio" hidden><section class="ilot" id="c92-s-bio-cours"><h3>Signaux, mort cellulaire et métabolisme : du mécanisme à la surveillance</h3>
<p>Une cellule hématopoïétique reçoit des signaux qui règlent croissance, différenciation et survie. Une anomalie de kinase peut maintenir un signal de prolifération ; une anomalie de régulation transcriptionnelle ou épigénétique peut perturber la maturation. Plusieurs mécanismes coopèrent souvent. Une mutation isolée n’explique donc pas à elle seule toute la trajectoire d’une <button class="w" data-k="c92-classification">LAM</button>.</p>
<p><button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> est une kinase de fusion centrale dans la <button class="w" data-k="c92-bcr-abl">LMC</button>. Les <button class="w" data-k="c92-bcr-abl">TKI</button> dirigés vers le site ATP et l’asciminib dirigé vers la poche myristoylique n’occupent pas la même zone. Cette différence aide à comprendre des profils de résistance distincts. La démonstration d’une mutation résistante appelle une interprétation liée au produit, à sa dose autorisée et au contexte ; elle ne justifie pas de choisir arbitrairement un autre inhibiteur portant la même étiquette de classe.</p>
<p><button class="w" data-k="c92-flt3">FLT3</button> transmet des signaux de croissance et de survie. Les altérations ITD et du domaine tyrosine kinase n’ont pas exactement les mêmes implications pour chaque traitement. La présence d’une cible n’efface pas les autres mutations, le risque de rechute ni les contraintes de tolérance. Les essais et les <button class="w" data-k="c92-fi">FI</button> définissent les populations dans lesquelles la cible devient une indication.</p>
<figure id="c92-causal-cible"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="Une cible moléculaire ne suffit pas à prescrire"><title>Une cible moléculaire ne suffit pas à prescrire</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Anomalie démontrée par une méthode</tspan><tspan x="290" dy="29">adaptée</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Mécanisme et sensibilité au</tspan><tspan x="290" dy="29">médicament</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Population et phase de maladie</tspan><tspan x="290" dy="29">étudiées</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Indication suisse, interactions et</tspan><tspan x="290" dy="29">organes</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="572" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Prescription spécialisée et suivi</tspan><tspan x="290" dy="29">de réponse</tspan></text></svg><figcaption><b>Une cible moléculaire ne suffit pas à prescrire.</b> La plausibilité biologique est une étape ; preuve clinique et conditions d’utilisation restent nécessaires. Schéma logique pédagogique ; aucune structure anatomique dessinée.</figcaption></figure>
<p>Dans la <button class="w" data-k="c92-differenciation">LPA</button>, <button class="w" data-k="c92-differenciation">PML::RARA</button> perturbe la différenciation. <button class="w" data-k="c92-differenciation">ATRA</button> et <button class="w" data-k="c92-differenciation">ATO</button> agissent sur cette biologie ; la différenciation peut s’accompagner d’une réaction inflammatoire systémique. Fièvre, dyspnée, prise de poids ou atteinte rénale doivent donc être interprétées dans la chronologie du traitement. Une complication peut survenir pendant un effet antileucémique attendu, et une infection concomitante reste possible.</p>
<p>BCL-2 protège certaines cellules de l’apoptose. Le vénétoclax abaisse ce seuil de survie, ce qui peut contribuer à une destruction tumorale rapide. La lyse libère potassium, phosphate et précurseurs de l’urate ; les troubles électrolytiques et l’atteinte rénale peuvent s’amplifier mutuellement. La prévention et les prises de sang après les paliers de dose découlent de cette cinétique, pas seulement d’une anomalie déjà présente avant traitement.</p>
<p>La rasburicase dégrade l’urate. Son activité peut se poursuivre dans le tube après prélèvement : le dosage risque alors de sous-estimer la concentration réelle si les conditions préanalytiques ne sont pas respectées. Ce mécanisme explique une consigne de laboratoire qui pourrait sembler administrative. Son risque d’hémolyse/méthémoglobinémie en déficit de G6PD explique aussi une contre-indication indépendante du niveau d’urate.</p>
<p>Les voies du métabolisme médicamenteux relient la biochimie à la sécurité. <button class="w" data-k="c92-interactions">CYP3A</button>, transporteurs et élimination ne contribuent pas de façon identique à chaque produit. Ajouter un inhibiteur enzymatique peut augmenter l’exposition ; cela peut imposer une réduction pour vénétoclax ou ivosidenib, mais ne permet pas de copier cette règle à l’asciminib. Le tableau d’interactions doit porter le nom du produit, le contexte et la date de la <button class="w" data-k="c92-fi">FI</button>.</p>
<p>Le <button class="w" data-k="c92-interactions">QT</button> dépend enfin de l’électrophysiologie et de facteurs modifiables : médicaments associés, potassium, magnésium, bradycardie et maladies cardiaques. Les seuils de suspension et de reprise sont propres aux protocoles et aux <button class="w" data-k="c92-fi">FI</button>. Un ECG « presque normal » ne neutralise pas une association à risque, et une correction électrolytique ne remplace pas toute la surveillance requise.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680690770013" target="_blank" rel="noopener">[S516] Tibsovo / ivosidenib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S522] FI suisse Fasturtec</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Signal prolifératif, différenciation et apoptose produisent des manifestations distinctes.</p><p><b>Science → examen.</b> Électrolytes, fonction rénale et ECG accompagnent les traitements ciblés.</p><p><b>Science → traitement.</b> Interactions et adaptations sont propres au produit exact.</p><p><b>À retenir.</b> Relier fonction normale, mécanisme, mesure et décision sans effacer les limites.</p></div><button class="pareto-btn ui" data-k="pareto-c92-bio">▲ Loi de Pareto — Biochimie et pharmacologie moléculaire</button></div><div class="sci" id="c92-s-gen" role="tabpanel" aria-labelledby="c92-tab-gen" hidden><section class="ilot" id="c92-s-gen-cours"><h3>Classification, pronostic et suivi : trois usages de la génétique</h3>
<p>Une analyse génétique peut nommer la maladie, estimer un risque ou mesurer une réponse. Ces objectifs utilisent parfois la même anomalie, mais pas nécessairement la même méthode ni le même seuil. Le compte rendu doit préciser matériel, technique, cible, sensibilité et contexte. Un résultat « positif » sans ces éléments ne suffit pas à décider.</p>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, la démonstration de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> est centrale. Le caryotype peut montrer le chromosome Philadelphie et des anomalies additionnelles ; la FISH cible le remaniement ; la RT-PCR identifie un transcrit et prépare le suivi. Une PCR courante peut manquer un transcrit atypique : la discordance avec les autres méthodes exige une discussion avec le laboratoire. Le suivi de ces formes atypiques peut nécessiter une méthode personnalisée plutôt qu’un chiffre standard mal appliqué.</p>
<p>Dans la <button class="w" data-k="c92-classification">LAM</button>, certaines anomalies génétiques définissent une entité à des niveaux de blastes inférieurs à 20 %, mais les classifications diffèrent. L’<button class="w" data-k="c92-classification">OMS</button> 2022 conserve notamment des exceptions exigeant 20 % pour <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> et CEBPA ; l’<button class="w" data-k="c92-classification">ICC</button> exposée par l’<button class="w" data-k="c92-sources">ELN</button> emploie souvent un seuil de 10 % pour ses entités génétiques, avec exceptions. Il faut donc écrire la classification utilisée et conserver la corrélation morphologique, au lieu de mémoriser un seuil unique pour tout.</p>
<p>La catégorie <button class="w" data-k="c92-classification">LAM</button> liée à la myélodysplasie ne repose plus sur la seule dysplasie morphologique. L’histoire clinique, des anomalies cytogénétiques et des mutations définies participent à sa classification. Les listes ne sont pas identiques entre <button class="w" data-k="c92-classification">OMS</button> et <button class="w" data-k="c92-classification">ICC</button> ; RUNX1 illustre une différence. Une ancienne catégorie de codage ou un libellé historique de <button class="w" data-k="c92-fi">FI</button>, tel AML-MRC, ne peut être remplacé automatiquement par la nouvelle catégorie sans examiner les critères.</p>
<figure id="c92-causal-genetique"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="Donner un sens à un résultat génétique"><title>Donner un sens à un résultat génétique</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="66" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Méthode et matériel documentés</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Anomalie interprétée dans une</tspan><tspan x="290" dy="29">classification datée</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Risque adapté au traitement</tspan><tspan x="290" dy="29">envisagé</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Cible éventuelle et indication</tspan><tspan x="290" dy="29">vérifiées</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="572" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Marqueur de suivi choisi avec ses</tspan><tspan x="290" dy="29">limites</tspan></text></svg><figcaption><b>Donner un sens à un résultat génétique.</b> Diagnostic, pronostic, choix thérapeutique et suivi sont des fonctions distinctes du résultat. Schéma logique pédagogique ; aucune structure anatomique dessinée.</figcaption></figure>
<p>Le pronostic dépend du traitement. L’<button class="w" data-k="c92-sources">ELN</button> 2022 pour traitements intensifs ne conserve plus le ratio allélique <button class="w" data-k="c92-flt3">FLT3</button>-ITD comme dans l’ancienne version ; une mutation NPM1 ne doit pas faire ignorer une cytogénétique défavorable. L’<button class="w" data-k="c92-sources">ELN</button> 2024 pour certains traitements moins intensifs utilise d’autres associations, avec un rôle majeur de TP53 et des conditions autour de NPM1, IDH1/2 et des voies de signalisation. Ce tableau ne s’étend pas automatiquement à tous les traitements, aux rechutes ni aux patients déjà exposés à un hypométhylant.</p>
<p>La maladie résiduelle mesurable utilise un marqueur suivi dans le temps avec une sensibilité connue. Certaines mutations de l’hématopoïèse clonale, notamment DNMT3A, TET2 et ASXL1, peuvent persister sans signifier à elles seules le même risque qu’un marqueur leucémique spécifique. Une négativité dépend de la qualité du prélèvement et des contrôles analytiques ; une variation doit être replacée dans une cinétique.</p>
<p>En <button class="w" data-k="c92-bcr-abl">LMC</button>, l’échelle internationale permet de suivre <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> pour les transcrits usuels. Une réponse moléculaire majeure correspond à ≤ 0,1 %, <button class="w" data-k="c92-cml-is">MR4</button> à ≤ 0,01 % et <button class="w" data-k="c92-cml-is">MR4,5</button> à ≤ 0,0032 %, sous réserve de contrôles adéquats. Un résultat indétectable avec trop peu de transcrits de contrôle ne démontre pas nécessairement une réponse profonde. La profondeur et sa durée contribuent aux critères d’un éventuel arrêt surveillé du <button class="w" data-k="c92-bcr-abl">TKI</button>.</p>
<p>Enfin, une prédisposition germinale peut modifier le conseil familial et le choix d’un donneur apparenté. Une variante mesurée dans le sang tumoral n’est pas automatiquement germinale ; un prélèvement non hématopoïétique approprié et un conseil spécialisé peuvent être nécessaires. Éviter un donneur porteur d’une prédisposition pertinente demande une démarche dédiée, pas une conclusion tirée d’un seul panel tumoral.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S501] CIM-10-GM 2024 français, catégories C92</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680680140017" target="_blank" rel="noopener">[S541] Vyxeos liposomal / daunorubicine–cytarabine</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Une même étiquette C92 recouvre plusieurs biologies.</p><p><b>Science → examen.</b> Classification, risque et <button class="w" data-k="c92-mrd">MRD</button> exigent méthodes et versions précisées.</p><p><b>Science → traitement.</b> Une cible moléculaire ne remplace ni l’indication ni la discussion clinique.</p><p><b>À retenir.</b> Relier fonction normale, mécanisme, mesure et décision sans effacer les limites.</p></div><button class="pareto-btn ui" data-k="pareto-c92-gen">▲ Loi de Pareto — Génétique</button></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="c92-p-1"><h2><span class="n">p-1</span> Induction intensive : raisonner en protocole et en formulation</h2>
<p>Dans une <button class="w" data-k="c92-classification">LAM</button> éligible à une induction intensive, la cytarabine et une anthracycline constituent une base historique de plusieurs protocoles. La cytarabine perturbe la synthèse de l’ADN ; l’anthracycline endommage l’ADN par plusieurs mécanismes, dont l’inhibition de la topoisomérase II. L’association agit sur le clone mais expose aussi l’hématopoïèse normale : aplasie, infection et saignement font partie du risque anticipé, non d’un effet secondaire accessoire.</p>
<p>La décision associe caractéristiques moléculaires, état fonctionnel, comorbidités, souhaits de la personne et possibilités de consolidation. L’âge seul ne décide pas de l’intensité. Les doses ci-dessous décrivent les informations professionnelles suisses effectivement consultées ; le choix d’un protocole, ses adaptations et les traitements associés relèvent de l’équipe spécialisée.</p>
<table class="t"><thead><tr><th>Produit et contexte</th><th>Schéma décrit dans la <button class="w" data-k="c92-fi">FI</button> suisse</th><th>Surveillance et limites</th></tr></thead><tbody><tr><td>Cytosar Solution, cytarabine conventionnelle</td><td>100–200 mg/m²/j en perfusion IV continue pendant sept jours, selon association et protocole.</td><td>Hémogramme rapproché, infection, hémorragie et fonctions hépatique/rénale. Les seuils de cytopénie se lisent dans le contexte du protocole d’induction, pas comme une règle automatique empêchant tout traitement d’une <button class="w" data-k="c92-classification">LAM</button> déjà cytopénique.</td></tr><tr><td>Cytarabine à forte dose</td><td>2–3 g/m² en perfusion IV de 1–3 h, toutes les 12 h pendant 2–6 jours : plage de <button class="w" data-k="c92-fi">FI</button>, non ordonnance universelle.</td><td>Toxicités cérébelleuse, cornéenne, digestive et hépatique. Le risque neurologique augmente notamment en cas de dysfonction rénale/hépatique ; évaluation et adaptation spécialisées.</td></tr><tr><td>Daunoblastin, daunorubicine libre</td><td>Un exemple de la <button class="w" data-k="c92-fi">FI</button> associe 45 mg/m² IV J1–3 à cytarabine 100 mg/m²/j sur sept jours. Cet exemple ne hiérarchise pas tous les protocoles contemporains.</td><td>Évaluation cardiaque et exposition antérieure aux anthracyclines ; extravasation vésicante. Injection strictement IV, dans une perfusion à écoulement libre, suivant la préparation et le protocole.</td></tr><tr><td>Vyxeos liposomal, indication spécifique</td><td>Première induction : daunorubicine 44 mg/m² + cytarabine 100 mg/m² IV sur 90 min, J1, J3, J5. Seconde induction éventuelle : mêmes doses J1 et J3. Au maximum deux inductions.</td><td>Adulte avec <button class="w" data-k="c92-classification">LAM</button> secondaire à un traitement ou AML-MRC au sens de la <button class="w" data-k="c92-fi">FI</button>. La nouvelle catégorie AML-MR ne rend pas automatiquement tout patient éligible à ce libellé historique.</td></tr><tr><td>Vyxeos, consolidation</td><td>29 mg/m² de daunorubicine + 65 mg/m² de cytarabine, IV sur 90 min J1 et J3, au maximum deux cycles. Intervalles de 5–8 semaines selon récupération et tolérance.</td><td>La <button class="w" data-k="c92-fi">FI</button> exige rémission, neutrophiles > 0,5 G/L et plaquettes ≥ 50 G/L avant consolidation, sans toxicité inacceptable. Myélosuppression prolongée, infection et cardiotoxicité restent des risques.</td></tr></tbody></table>
<p><b>Vyxeos n’est pas interchangeable avec les deux molécules libres.</b> Le rapport fixe, la formulation liposomale et la pharmacocinétique changent l’exposition. Ne jamais transformer une dose exprimée pour Vyxeos en une prescription séparée de daunorubicine et cytarabine. Les deux quantités doivent être identifiées, avec la formulation et les jours d’administration.</p>
<p>Pour la daunorubicine libre, la <button class="w" data-k="c92-fi">FI</button> donne une dose cumulée adulte de 550 mg/m², abaissée à 400 mg/m² dans certains contextes de radiothérapie médiastinale ou de médicaments cardiotoxiques associés. Cela ne constitue pas une zone sans risque en dessous du seuil. La rubrique des contre-indications emploie aussi une plage cumulée de 500–600 mg/m² : l’exposition complète et le contexte cardiologique doivent être revus. Le risque cumulatif de Vyxeos n’est pas assimilé par une simple équivalence à celui de la molécule libre.</p>
<p>La <button class="w" data-k="c92-fi">FI</button> de daunorubicine prévoit des réductions en cas d’atteinte hépatique ou rénale modérée et des contre-indications dans les atteintes sévères indiquées. Certaines précautions emploient parallèlement le terme « relatives » pour des situations figurant dans les contre-indications : cette divergence rédactionnelle appelle une vérification spécialisée, pas une permission générale de traiter. Pour Vyxeos, les données de dialyse et d’atteinte hépatique sévère sont limitées ; aucun seuil de bilirubine n’est recopié ici car l’unité de l’extraction française consultée est incohérente.</p>
<p>La cytarabine peut être utilisée chez l’enfant dans des protocoles adaptés. Vyxeos n’est pas autorisé avant 18 ans dans la <button class="w" data-k="c92-fi">FI</button> consultée. Les doses, plafonds cumulés et stratégies pédiatriques ne se déduisent pas d’une simple réduction de la dose adulte. <button class="w" data-k="c92-formulation">Pourquoi la formulation fait partie du médicament</button></p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680548450142" target="_blank" rel="noopener">[S539] Cytosar Solution / cytarabine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680683400019" target="_blank" rel="noopener">[S540] Daunoblastin / daunorubicine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680680140017" target="_blank" rel="noopener">[S541] Vyxeos liposomal / daunorubicine–cytarabine</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a>.</p></div></section>
<section class="ilot" id="c92-p-2"><h2><span class="n">p-2</span> <button class="w" data-k="c92-differenciation">LPA</button> : différencier les cellules et protéger la coagulation</h2>
<p>Dans la <button class="w" data-k="c92-differenciation">LPA</button>, l’acide tout-trans rétinoïque, ou <button class="w" data-k="c92-differenciation">ATRA</button>, lève en partie le blocage de différenciation lié à <button class="w" data-k="c92-differenciation">PML::RARA</button> ; le trioxyde d’arsenic, ou <button class="w" data-k="c92-differenciation">ATO</button>, agit également sur cette oncoprotéine. Cette logique explique une réponse différente de la simple cytotoxicité. Elle explique aussi le syndrome de différenciation : l’amélioration biologique du clone peut s’accompagner d’une inflammation avec atteinte d’organes.</p>
<p>Une suspicion de <button class="w" data-k="c92-differenciation">LPA</button> est une urgence. L’<button class="w" data-k="c92-differenciation">ATRA</button> doit être instauré rapidement avec l’équipe d’hématologie, pendant que la recherche urgente de <button class="w" data-k="c92-differenciation">PML::RARA</button> et le support de l’hémostase sont organisés. Attendre une classification complète devant une morphologie évocatrice et une coagulopathie peut faire perdre du temps. L’<button class="w" data-k="c92-differenciation">ATO</button> répond en revanche à un cadre diagnostique, un bilan et une surveillance précis ; il ne découle pas de tout frottis contenant un corps d’Auer.</p>
<table class="t"><thead><tr><th>Traitement</th><th>Dose et cadre suisses</th><th>Risques et conduite</th></tr></thead><tbody><tr><td>Vesanoid, trétinoïne/<button class="w" data-k="c92-differenciation">ATRA</button></td><td>45 mg/m²/j par voie orale en deux prises avec les repas. La <button class="w" data-k="c92-fi">FI</button> prévoit une dose de 25 mg/m²/j par précaution en cas d’insuffisance rénale/hépatique ; chez l’enfant, expérience limitée et réduction possible en cas de toxicité.</td><td>Tératogénicité ; grossesse/allaitement et associations à vitamine A/autres rétinoïdes ou tétracyclines contre-indiquées. Vérifier contraception, allergies aux excipients dont soja/arachide, céphalées et syndrome de différenciation.</td></tr><tr><td>Trisenox, <button class="w" data-k="c92-differenciation">ATO</button> : induction de première ligne non à haut risque</td><td>0,15 mg/kg/j IV jusqu’à rémission, au maximum 60 jours, avec <button class="w" data-k="c92-differenciation">ATRA</button>. Population nouvellement diagnostiquée : leucocytes ≤ 10 G/L.</td><td>Perfusion en 1–2 h, jusqu’à 4 h si réactions vasomotrices. ECG, électrolytes, fonction hépatique/rénale ; un schéma de rechute a des durées différentes.</td></tr><tr><td>Consolidation <button class="w" data-k="c92-differenciation">ATO</button> + <button class="w" data-k="c92-differenciation">ATRA</button>, première ligne</td><td><button class="w" data-k="c92-differenciation">ATO</button> 0,15 mg/kg/j cinq jours par semaine pendant quatre semaines, puis quatre semaines sans <button class="w" data-k="c92-differenciation">ATO</button> ; quatre cycles. <button class="w" data-k="c92-differenciation">ATRA</button> 45 mg/m²/j deux semaines sur quatre, sept cycles.</td><td>Ne pas confondre avec le schéma de rechute/réfractaire de Trisenox ni avec la durée générale d’induction mentionnée dans la <button class="w" data-k="c92-fi">FI</button> de Vesanoid.</td></tr><tr><td>Syndrome de différenciation suspecté</td><td>Dexaméthasone 10 mg IV toutes les 12 h, au moins trois jours et jusqu’à résolution, avec évaluation et surveillance urgentes.</td><td>Fièvre, dyspnée, prise de poids, œdèmes, hypotension ou atteinte rénale peuvent se combiner. La <button class="w" data-k="c92-fi">FI</button> Trisenox demande d’interrompre <button class="w" data-k="c92-differenciation">ATO</button> et <button class="w" data-k="c92-differenciation">ATRA</button> dès la suspicion ; certaines recommandations européennes autorisent leur maintien dans des formes légères. La divergence est explicite, jamais résolue par défaut.</td></tr></tbody></table>
<p>Pour prévenir les arythmies sous <button class="w" data-k="c92-differenciation">ATO</button>, la <button class="w" data-k="c92-fi">FI</button> demande de maintenir le potassium au-dessus de 4 mEq/L et le magnésium au-dessus de 1,8 mg/dL, avec ECG au moins deux fois par semaine et plus selon le risque. Un <button class="w" data-k="c92-interactions">QTc</button> supérieur à 500 ms impose une réévaluation et une correction des facteurs favorisants. En cas de syncope ou d’arythmie, le traitement est suspendu et la reprise suit les critères et paliers de la <button class="w" data-k="c92-fi">FI</button> ; le seuil de reprise indiqué dans ce contexte est inférieur à 460 ms. Ces seuils ne doivent pas être copiés pour tous les autres médicaments allongeant le <button class="w" data-k="c92-interactions">QT</button>.</p>
<p>Le support de coagulation vise notamment des plaquettes de 30–50 G/L et un fibrinogène de 1–1,5 g/L selon les sources consultées, avec contrôles rapprochés et adaptation au saignement. Éviter les gestes invasifs non indispensables pendant la coagulopathie. La leucaphérèse n’est pas recommandée dans la <button class="w" data-k="c92-differenciation">LPA</button> en raison du risque hémorragique ; une hyperleucocytose ne justifie pas d’importer mécaniquement la conduite d’une autre <button class="w" data-k="c92-classification">LAM</button>.</p>
<p>Pour une <button class="w" data-k="c92-differenciation">LPA</button> nouvellement diagnostiquée à haut risque, les résultats européens récents modifient les options combinées, mais la <button class="w" data-k="c92-fi">FI</button> suisse Trisenox consultée limite sa première ligne au risque non élevé. L’emploi de l’<button class="w" data-k="c92-differenciation">ATO</button> dans le haut risque doit donc être reconnu comme hors indication de cette <button class="w" data-k="c92-fi">FI</button>, avec décision spécialisée et vérification réglementaire ; ce n’est pas une extension automatique de l’autorisation.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Un patient traité pour <button class="w" data-k="c92-differenciation">LPA</button> développe dyspnée, fièvre et prise de poids. Quelle démarche est la plus appropriée ?</p><button data-ok="1">Suspecter un syndrome de différenciation, évaluer en urgence et appliquer la conduite du protocole et de la information professionnelle.</button><button data-ok="0">Attendre la prochaine PCR pour décider.</button><button data-ok="0">Conclure que la différenciation prouve une absence de complication.</button><p class="fb" hidden>Le syndrome peut être grave et coexister avec une infection ou une surcharge. Corticoïdes, surveillance et gestion des médicaments ne doivent pas attendre une preuve moléculaire de réponse.</p></div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527750195" target="_blank" rel="noopener">[S521] FI suisse Vesanoid</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></section>
<section class="ilot" id="c92-p-3"><h2><span class="n">p-3</span> Traitements moins intensifs : association ne signifie pas faible risque</h2>
<p>Chez une personne non éligible à une induction intensive, un traitement moins intensif peut contrôler la <button class="w" data-k="c92-classification">LAM</button> et produire des rémissions. L’azacitidine agit notamment sur la régulation épigénétique ; le vénétoclax inhibe BCL-2, protéine qui protège certaines cellules de l’apoptose. Leur complémentarité explique l’association, mais aussi une myélosuppression importante et un risque de lyse tumorale. Le mot « moins intensif » ne signifie ni traitement banal, ni surveillance allégée.</p>
<table class="t"><thead><tr><th>Association ou produit</th><th>Repères de <button class="w" data-k="c92-fi">FI</button> suisse</th><th>Décisions pratiques</th></tr></thead><tbody><tr><td>Vidaza injectable, azacitidine</td><td>75 mg/m²/j sous-cutanés pendant sept jours, cycle de 28 jours. La <button class="w" data-k="c92-fi">FI</button> recommande au moins six cycles, avec poursuite selon bénéfice/progression.</td><td>Numération, fonction rénale/hépatique et bicarbonates ; adaptation aux toxicités selon le protocole. La formulation injectable n’est pas interchangeable avec une azacitidine orale.</td></tr><tr><td>Venclxyto avec agent hypométhylant, <button class="w" data-k="c92-classification">LAM</button></td><td>Vénétoclax oral : 100 mg J1, 200 mg J2, 400 mg J3 puis 400 mg/j, avec repas, selon <button class="w" data-k="c92-fi">FI</button> et interactions.</td><td>Avant l’escalade : leucocytes &lt; 25 G/L, hydratation, prévention de l’hyperuricémie et correction des anomalies. Surveiller potassium, urate, phosphate, calcium et créatinine.</td></tr><tr><td>Venclxyto avec cytarabine à faible dose</td><td>La <button class="w" data-k="c92-fi">FI</button> suisse prévoit 600 mg/j de vénétoclax à partir de J4 après escalade ; cytarabine 20 mg/m² sous-cutanés dix jours par cycle de 28 jours.</td><td>L’indication suisse ne doit pas être remplacée par une posologie étrangère. Cette possibilité de <button class="w" data-k="c92-fi">FI</button> n’en fait pas le premier choix pour chaque patient, ni une population automatiquement couverte par la classification <button class="w" data-k="c92-sources">ELN</button> 2024 moins intensive.</td></tr><tr><td>Azacitidine + ivosidenib, mutation IDH1 R132</td><td>Tibsovo 500 mg oral une fois par jour, avec azacitidine 75 mg/m² J1–7 par cycle de 28 jours ; respecter le jeûne : deux heures avant et une heure après.</td><td><button class="w" data-k="c92-classification">LAM</button> adulte nouvellement diagnostiquée, non éligible à induction intensive, hors <button class="w" data-k="c92-differenciation">LPA</button>. Un statut IDH1 documenté et l’évaluation du <button class="w" data-k="c92-interactions">QT</button>/interactions sont nécessaires.</td></tr></tbody></table>
<p>Au début du vénétoclax, la <button class="w" data-k="c92-fi">FI</button> demande des contrôles biologiques avant chaque palier, 6–8 heures après les nouvelles doses et 24 heures après le palier final. Le niveau de surveillance dépend du risque tumoral, rénal et clinique. Une insuffisance rénale peut majorer le risque de lyse même quand aucune réduction initiale standard de dose n’est prévue. Des résultats biologiques rassurants avant la première prise ne dispensent donc pas du suivi après la prise.</p>
<p>La cytopénie sous azacitidine/vénétoclax se raisonne avec l’état de la maladie. Avant rémission, elle ne conduit habituellement pas à interrompre automatiquement le traitement. Après rémission, une cytopénie sévère prolongée peut imposer de retarder le cycle, puis de raccourcir la durée de vénétoclax lors des récidives de toxicité, par exemple de 28 à 21 jours selon la <button class="w" data-k="c92-fi">FI</button>. Une moelle et l’évolution clinique aident à distinguer maladie persistante et aplasie liée au traitement ; ces situations ne justifient pas la même décision.</p>
