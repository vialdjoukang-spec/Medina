<p>Une numération très anormale peut annoncer plusieurs maladies dont le traitement diffère profondément. Une leucémie myéloïde aiguë perturbe la différenciation et la production sanguine efficace ; une leucémie myéloïde chronique <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> positive conserve souvent une maturation granulocytaire importante en phase chronique. Une masse de blastes myéloïdes peut, elle, apparaître hors de la moelle. Le premier travail consiste à reconnaître la présentation, rechercher une urgence et obtenir les preuves qui identifient la maladie.</p>
<p>La famille C92 réunit ces situations dans la CIM-10-GM. Elle comprend les formes aiguës, la <button class="w" data-k="c92-bcr-abl">LMC</button> <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> positive, l’ancienne « <button class="w" data-k="c92-bcr-abl">LMC</button> atypique » <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> négative, le sarcome myéloïde, la leucémie promyélocytaire et des formes particulières ou non précisées. Les mots du catalogue ne remplacent pas la classification biologique actuelle. Ainsi, une <button class="w" data-k="c92-classification">LAM</button> myélomonocytaire n’est pas une leucémie myélomonocytaire chronique, et une dysplasie visible ne suffit plus à classer une <button class="w" data-k="c92-classification">LAM</button> comme myélodysplasie-associée.</p>
<table class="t"><thead><tr><th>Sous-catégorie <button class="w" data-k="c92-classification">OFS</button>, CIM-10-GM 2024</th><th>Libellé français et portée clinique</th></tr></thead><tbody><tr><td>C92.0</td><td>Leucémie myéloblastique aiguë [<button class="w" data-k="c92-classification">LMA</button>] : préciser ensuite l’entité biologique et ses caractéristiques.</td></tr><tr><td>C92.1</td><td>Leucémie myéloïde chronique, BCR/ABL positive : démonstration de la fusion et caractérisation de la phase.</td></tr><tr><td>C92.2</td><td>Leucémie myéloïde chronique atypique, BCR/ABL négative : libellé historique à relier aux critères modernes de MDS/MPN avec neutrophilie.</td></tr><tr><td>C92.3</td><td>Sarcome myéloïde : masse tissulaire à caractériser et bilan systémique, même sans blastes circulants.</td></tr><tr><td>C92.4</td><td>Leucémie promyélocytaire aiguë : urgence de coagulation et confirmation de <button class="w" data-k="c92-differenciation">PML::RARA</button>.</td></tr><tr><td>C92.5</td><td>Leucémie myélomonocytaire aiguë : ne pas confondre avec la leucémie myélomonocytaire chronique codée C93.1.</td></tr><tr><td>C92.6</td><td>Leucémie myéloïde aiguë avec anomalie 11q23 : caractériser le remaniement et la classification biologique, sans réduire la génétique moderne au seul libellé de code.</td></tr><tr><td>C92.7</td><td>Autres leucémies myéloïdes : catégorie résiduelle, pas protocole thérapeutique unique.</td></tr><tr><td>C92.8</td><td>Leucémie myéloïde aiguë avec dysplasie multilinéaire : ancien libellé administratif, sans équivalence automatique avec toute <button class="w" data-k="c92-classification">LAM</button> liée à la myélodysplasie selon <button class="w" data-k="c92-classification">OMS</button>/<button class="w" data-k="c92-classification">ICC</button> actuelles.</td></tr><tr><td>C92.9</td><td>Leucémie myéloïde, sans précision : conserver l’incertitude et compléter une caractérisation réalisable.</td></tr></tbody></table>
<p>Dans ces sous-catégories, le cinquième caractère <b>0</b> signifie « sans mention de rémission complète » et <b>1</b> « en rémission complète ». Par exemple, C92.00 et C92.01 ne décrivent pas deux lignées différentes. Ne pas importer un cinquième caractère de rechute issu de l’ICD-10-CM américaine. Le statut clinique documenté, la version de codage applicable et les règles suisses en vigueur restent à vérifier ; cette leçon ne certifie pas une facturation individuelle.</p>
<p>Trois questions guident toute la leçon : <b>la personne est-elle menacée maintenant ; quelle lignée et quelle anomalie définissent le clone ; quel résultat modifiera réellement la conduite ?</b> L’interrogatoire et l’examen commencent immédiatement. La morphologie, l’immunophénotype, la cytogénétique et la biologie moléculaire se complètent ensuite ; aucun de ces étages ne doit être remplacé par une impression isolée au frottis.</p>
<div class="alert"><b>Point de décision.</b> Des saignements avec un frottis évocateur de leucémie promyélocytaire imposent une prise en charge spécialisée immédiate. La confirmation génétique est urgente, mais son attente ne doit pas retarder l’<button class="w" data-k="c92-differenciation">ATRA</button> et le soutien de la coagulation sous responsabilité hématologique.</div>
<p>À l’examen fédéral, partir de la présentation : anomalie leucocytaire, anémie, thrombopénie, coagulation perturbée ou résultat cytologique inhabituel. Les situations <button class="w" data-k="c92-profiles">PROFILES</button> 152, 154, 159, 165 et 174 soutiennent ce raisonnement ; elles ne constituent pas une promesse de question sur un sous-code. <button class="w" data-k="c92-profiles">Objectifs et limites du référentiel</button> · <button class="w" data-k="c92-classification">Comprendre les classifications</button></p>

<section class="ilot" id="c92-2"><h2><span class="n">2</span> Épidémiologie, terrain et facteurs de risque</h2>
<p>Les fréquences doivent être rattachées à la maladie réellement étudiée. Le rapport suisse <button class="w" data-k="c92-classification">OFS</button> consulté regroupe des leucémies C91–C95 : ce total n’est ni une incidence de C92 seul, ni une fréquence de chaque forme myéloïde. Les sources retenues ne permettent pas ici de donner une incidence suisse actuelle et précise de chacun des sous-types. Cette limite évite une fausse exactitude.</p>
<p>Pour la <button class="w" data-k="c92-classification">LAM</button>, Onkopedia rapporte environ 3,7 nouveaux cas pour 100 000 habitants par an dans son contexte de référence et une forte augmentation avec l’âge ; un registre suédois adulte situe l’âge médian à 72 ans. Ce sont des repères européens, pas des chiffres nationaux suisses. Une médiane décrit une population : elle n’exclut pas une <button class="w" data-k="c92-classification">LAM</button> chez un adulte jeune ou un enfant. Les néoplasies MDS/MPN avec neutrophilie et les sarcomes myéloïdes sont rares ; leurs séries sont petites et sélectionnées.</p>
<p>L’âge avancé, certains antécédents de syndrome myélodysplasique, des expositions cytotoxiques et l’hématopoïèse clonale participent au risque de <button class="w" data-k="c92-classification">LAM</button>. Rechercher radiothérapie, chimiothérapie, exposition au benzène et tabagisme, sans attribuer une causalité individuelle sur la seule présence d’un facteur. Une maladie survenue après traitement cytotoxique doit être caractérisée génétiquement et qualifiée par son contexte : l’étiquette « secondaire » ne dispense pas de chercher une cible ou une prédisposition.</p>
<p>La plupart des anomalies présentes dans les cellules leucémiques sont acquises. Une histoire familiale, plusieurs cancers personnels, des cytopénies antérieures ou certains résultats, notamment DDX41, peuvent conduire à une évaluation germinale. La distinction importe aussi pour choisir un donneur apparenté : un variant délétère partagé ne doit pas être ignoré. Un variant trouvé dans le sang tumoral ne prouve pas à lui seul une transmission héréditaire.</p>
<div class="key"><b>À retenir.</b> Ne pas confondre risque de développer une maladie, classification pronostique au diagnostic et risque de rechute après traitement. Ces trois questions utilisent des populations et des paramètres différents.</div>

<section class="ilot" id="c92-3"><h2><span class="n">3</span> Du fonctionnement normal au clone pathologique</h2>
<p>La moelle maintient une production réglée de cellules sanguines. Les progéniteurs prolifèrent puis mûrissent ; les cellules deviennent capables d’assurer des fonctions différentes. Les neutrophiles participent à la défense anti-infectieuse, les hématies au transport de l’oxygène, et les plaquettes à l’hémostase primaire. Le nombre de cellules et leur efficacité fonctionnelle sont deux dimensions distinctes.</p>
<p>Dans une <button class="w" data-k="c92-classification">LAM</button>, un clone myéloïde anormal se développe avec un défaut variable de différenciation. L’espace médullaire et les interactions qui soutiennent l’hématopoïèse normale sont perturbés. Une anémie explique une partie de la fatigue ou de la dyspnée ; une thrombopénie favorise le saignement ; une neutropénie ou une défense inefficace expose aux infections. Une leucocytose élevée ne signifie donc pas que l’immunité est performante.</p>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, la fusion <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> produit une tyrosine kinase anormalement active. En phase chronique, la production granulocytaire augmente avec une maturation encore présente. Les inhibiteurs de tyrosine kinase réduisent le signal de croissance ; ils ne sont pas interchangeables avec un traitement de toute leucocytose. La progression vers une phase blastique correspond à une maladie plus complexe que la simple persistance d’un chiffre élevé.</p>
<p>La <button class="w" data-k="c92-differenciation">LPA</button> illustre un autre mécanisme : <button class="w" data-k="c92-differenciation">PML::RARA</button> perturbe le programme de différenciation. L’<button class="w" data-k="c92-differenciation">ATRA</button> agit sur ce blocage ; le trioxyde d’arsenic intervient sur la protéine de fusion par une autre voie. Le traitement peut restaurer une différenciation, mais cette modification rapide peut aussi provoquer un syndrome inflammatoire grave. Comprendre le mécanisme permet de surveiller simultanément l’efficacité et la toxicité.</p>

<section class="ilot" id="c92-4"><h2><span class="n">4</span> Démarche initiale : sécuriser avant de préciser</h2>
<p>Une suspicion de leucémie aiguë conduit à une évaluation hématologique urgente. Mesurer les constantes, rechercher un saignement, une infection, une atteinte respiratoire ou neurologique et apprécier la perfusion. Prélever rapidement l’hémogramme avec formule et frottis, les paramètres de coagulation et le bilan de lyse. Les prélèvements utiles au diagnostic doivent être organisés sans retarder les gestes indispensables.</p>
<p>La leucostase est un syndrome clinique : dyspnée, hypoxie, troubles neurologiques ou autres atteintes d’organes dans un contexte compatible. Une hyperleucocytose supérieure à 100 G/L constitue un repère de risque dans la <button class="w" data-k="c92-classification">LAM</button>, mais l’absence de ce chiffre ne suffit pas à exclure une leucostase. La cytoréduction et le traitement spécifique relèvent immédiatement du centre spécialisé. La leucaphérèse n’est pas une réponse automatique à une valeur élevée asymptomatique ; elle est particulièrement évitée dans la <button class="w" data-k="c92-differenciation">LPA</button> coagulopathique.</p>
<p>Une fièvre chez une personne neutropénique ou présentant une infection sévère impose prélèvements adaptés et traitement anti-infectieux rapide selon les protocoles locaux. Des signes inflammatoires peuvent être discrets. La présence d’une leucémie ne permet pas d’expliquer une fièvre sans chercher une infection. À l’inverse, un syndrome de différenciation peut coexister avec une infection : les deux hypothèses doivent rester ouvertes.</p>
<p>Chez une personne stable, attendre les résultats génétiques rapidement disponibles peut améliorer le choix de l’induction. Cette attente est une décision surveillée, pas une règle absolue : coagulopathie menaçante, leucostase, lyse ou dégradation clinique changent la priorité. Documenter précisément ce qui est connu, ce qui manque et le délai de réévaluation.</p>
<div class="alert"><b>Point de décision.</b> <button class="w" data-k="c92-differenciation">LPA</button> suspectée, leucostase, hémorragie majeure, lyse tumorale, sepsis et syndrome de différenciation sont des urgences distinctes. Chacune demande une action immédiate adaptée ; aucune n’est traitée par la simple normalisation d’un chiffre.</div>

<section class="ilot" id="c92-5"><h2><span class="n">5</span> Anamnèse : reconstruire la trajectoire</h2>
<p>Préciser le début et la vitesse d’évolution : fatigue récente, gêne à l’effort, infections répétées, ecchymoses spontanées, saignements muqueux ou règles inhabituellement abondantes. Rechercher dyspnée de repos, céphalée nouvelle, trouble visuel, confusion ou déficit focal. Un symptôme ancien stable et un symptôme brutal n’ont pas la même valeur d’alarme.</p>
<p>Une <button class="w" data-k="c92-bcr-abl">LMC</button> peut rester silencieuse pendant des mois et être découverte sur une numération. Fatigue, perte pondérale et sueurs nocturnes sont possibles mais peu spécifiques. Demander retentissement sur les activités, satiété inhabituelle ou gêne abdominale, sans conclure à une splénomégalie sur le seul récit. Une masse, une douleur osseuse localisée, une atteinte cutanée ou des symptômes ORL persistants peuvent orienter vers une manifestation extramédullaire qui nécessite sa propre preuve.</p>
<p>Recueillir les numérations antérieures et les résultats médullaires disponibles. Un antécédent de myélodysplasie, de néoplasie myéloproliférative ou de traitement anticancéreux modifie l’interprétation. Dresser la liste complète des médicaments, automédications et produits végétaux : les interactions <button class="w" data-k="c92-interactions">CYP3A</button> deviennent particulièrement importantes avec plusieurs thérapies ciblées. Le millepertuis ne doit pas être oublié.</p>
<p>Le terrain guide aussi la faisabilité du traitement : fonction cardiaque, pulmonaire, rénale et hépatique ; infections ; autonomie ; cognition ; soutien à domicile ; projet parental. L’âge civil seul ne résume pas l’aptitude à une thérapie intensive ou à une greffe. Les préférences de la personne, la charge du suivi et les objectifs de soins doivent être discutés avec une information compréhensible.</p>
<p>Chez une personne déjà traitée pour <button class="w" data-k="c92-bcr-abl">LMC</button>, demander les prises réellement effectuées, les interruptions, la tolérance, les repas et les médicaments ajoutés. Une remontée moléculaire peut traduire plusieurs situations ; attribuer immédiatement le résultat à une mutation résistante ferait perdre des informations essentielles.</p>

<section class="ilot" id="c92-6" data-semiology-clinical="C92"><h2><span class="n">6</span> Examen clinique : décrire le signe et son mécanisme</h2>
<p>L’examen commence par la gravité : état de conscience, fréquence respiratoire, saturation, pression artérielle, pouls, température et signes de mauvaise perfusion. Une hypoxie ou un trouble neurologique dans une leucémie hyperleucocytaire exige une évaluation urgente ; la même manifestation peut aussi provenir d’une infection, d’une hémorragie ou d’une autre complication. Le contexte oriente, mais ne suffit pas à prouver le mécanisme.</p>
<p>Rechercher pâleur, pétéchies, ecchymoses et saignements muqueux. La pâleur n’est pas un dosage d’hémoglobine. Une thrombopénie peut contribuer au saignement, tandis qu’une coagulopathie, notamment dans la <button class="w" data-k="c92-differenciation">LPA</button>, ajoute un mécanisme distinct. Examiner la bouche et les gencives : infection, ulcération et infiltration ne se déduisent pas du même signe. L’hypertrophie gingivale peut accompagner une différenciation monocytique ou myélomonocytaire.</p>
<p>Palper les aires ganglionnaires et apprécier foie et rate. Une rate augmentée peut participer au tableau d’une <button class="w" data-k="c92-bcr-abl">LMC</button>, mais n’est pas spécifique de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>. Noter localisation, volume clinique et sensibilité ; l’évolution sous traitement peut être informative. Examiner les lésions cutanées ou masses avec précision : nombre, taille, couleur, douleur, évolution et signes compressifs. Une biopsie peut devenir nécessaire pour distinguer infiltration myéloïde, infection et autre tumeur.</p>
<p>Rechercher un foyer infectieux selon les symptômes et le risque : poumons, peau, bouche et région périnéale par examen adapté. Une neutropénie peut atténuer les signes habituels. L’examen neurologique est orienté par la plainte et recherche une atteinte focale ou diffuse ; une ponction lombaire n’est pas un examen réflexe à effectuer pendant une coagulopathie promyélocytaire.</p>
<p>Consigner les résultats négatifs utiles et les limites. Une absence de splénomégalie ou de saignement visible n’exclut pas une leucémie. Les sources retenues ne fournissent pas de sensibilité universelle permettant de transformer ces signes en test de dépistage autonome.</p>
<div class="key"><b>À retenir.</b> Signe → mécanisme possible → examen discriminant → décision. La valeur sémiologique se construit avec la chronologie et la biologie ; un signe isolé ne nomme pas le clone.</div>

<section class="ilot" id="c92-7"><h2><span class="n">7</span> Reconnaître les grands tableaux myéloïdes</h2>
<p><b>Le tableau aigu.</b> Cytopénies, blastes et symptômes d’insuffisance médullaire orientent vers une leucémie aiguë. La leucocytose peut être importante, normale ou basse : le chiffre total ne suffit pas à exclure la maladie. Les formes myélomonocytaires et certaines <button class="w" data-k="c92-classification">LAM</button> avec réarrangement KMT2A peuvent présenter des manifestations extramédullaires ; leur classification exige les examens intégrés.</p>
<p><b>Le tableau promyélocytaire.</b> Une coagulopathie associée à une morphologie suspecte doit faire évoquer la <button class="w" data-k="c92-differenciation">LPA</button>. La forme hypogranulaire peut être moins évidente au premier regard. Des corps d’Auer sont un indice myéloïde, mais leur présence n’est pas une preuve autonome de <button class="w" data-k="c92-differenciation">PML::RARA</button>, et leur absence visible n’exclut pas la maladie.</p>
<figure id="c92-main-apl" data-origin="human-original"><img src="assets/img/c92/alpha/codex/apl-hypogranular.jpg" alt="Frottis sanguin humain de LPA hypogranulaire montrant deux cellules anormales et des hématies" loading="lazy"><figcaption><b>Une <button class="w" data-k="c92-differenciation">LPA</button> peut être peu granuleuse.</b> <b>Repère 1, grande cellule à gauche :</b> noyau irrégulier, avec repli du contour. <b>Repère 2, cellule au centre droit :</b> autre noyau irrégulier et cytoplasme périphérique. <b>Repère 3, cytoplasme bleu :</b> les grosses granulations typiques ne sont pas évidentes dans ce champ. <b>Repère 4, disques rosés autour :</b> hématies servant de contexte visuel, sans étalonnage de taille. La provenance indique une <button class="w" data-k="c92-differenciation">LPA</button> hypogranulaire, coloration de Wright. Aucun corps d’Auer n’est affirmé ici ; la photographie seule ne démontre pas <button class="w" data-k="c92-differenciation">PML::RARA</button>. Original : Mikael Häggström, 29 novembre 2022, <a href="https://commons.wikimedia.org/wiki/File:Peripheral_blood_smear_of_acute_promyelocytic_leukemia,_hypogranular_variant,_source_image_(1).jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0</a>. Pixels intacts ; repères français ajoutés à la légende.</figcaption></figure>
<p><b>Le tableau chronique <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> positif.</b> Une prolifération granulocytaire avec déviation à gauche conduit à rechercher la fusion. La <button class="w" data-k="c92-bcr-abl">LMC</button> se distingue d’une réaction à une infection, d’une autre néoplasie myéloproliférative et du MDS/MPN avec neutrophilie. Le frottis aide à poser la question ; il ne remplace pas la réponse moléculaire.</p>
<p><b>Le tableau dysplasique et prolifératif <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> négatif.</b> Le MDS/MPN avec neutrophilie associe prolifération et dysgranulopoïèse, avec des critères d’exclusion précis. Un test <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> négatif ne suffit pas à poser ce diagnostic, surtout si la technique ne couvre pas un transcrit atypique.</p>
<p><b>Le tableau extramédullaire.</b> Le sarcome myéloïde est une masse tissulaire de blastes myéloïdes. Il peut accompagner une maladie médullaire, précéder sa détection ou correspondre à une rechute. Une numération rassurante ne dispense pas du bilan médullaire et de la caractérisation du tissu.</p>
<p>Les catégories résiduelles « autres » ou « non précisées » servent à décrire l’information disponible ; elles n’autorisent pas à ignorer une caractérisation réalisable. Le traitement suit la maladie établie, le terrain et ses cibles, pas le seul degré de précision du code.</p>

<section class="ilot" id="c92-8"><h2><span class="n">8</span> Établir un diagnostic intégré et nommer sa classification</h2>
<p>Le diagnostic ne se résume pas à « des blastes dans le sang ». La morphologie décrit les cellules, l’immunophénotype précise leur différenciation, et la génétique peut définir l’entité, le risque ou une cible. Le bilan médullaire reste central, y compris lorsque le sang fournit déjà une information forte. En cas de ponction sans matériel exploitable, la biopsie et les appositions peuvent apporter une information différente.</p>
<div class="alert"><b>Point de décision.</b> Pour une <button class="w" data-k="c92-classification">LAM</button>, indiquer la classification utilisée. Le seuil habituel de 20 % de blastes n’est pas universel lorsque certaines anomalies génétiques définissantes sont présentes. Une anomalie moléculaire doit être interprétée avec la morphologie et la clinique ; elle n’est pas automatiquement synonyme de maladie manifeste.</div>
<table class="t"><thead><tr><th>Situation</th><th>Éléments indispensables</th><th>Limite à garder visible</th></tr></thead><tbody><tr><td><button class="w" data-k="c92-classification">LAM</button> selon <button class="w" data-k="c92-classification">OMS</button> 2022</td><td>Morphologie et différenciation myéloïde ; génétique intégrée. Plusieurs entités génétiques peuvent être reconnues sous 20 % de blastes.</td><td><button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>, CEBPA et AML-MR gardent des exigences propres, notamment le seuil de 20 % ; pas de règle « toute mutation suffit ».</td></tr><tr><td><button class="w" data-k="c92-classification">LAM</button> selon <button class="w" data-k="c92-classification">ICC</button> / <button class="w" data-k="c92-sources">ELN</button> 2022</td><td>Plusieurs entités à anomalies récurrentes exigent au moins 10 % de blastes.</td><td><button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> exige au moins 20 % ; la catégorie MDS/AML à 10–19 % concerne d’autres situations définies.</td></tr><tr><td><button class="w" data-k="c92-differenciation">LPA</button></td><td>Faisceau clinique/morphologique puis démonstration urgente de <button class="w" data-k="c92-differenciation">PML::RARA</button> ; documenter les variants si la suspicion persiste.</td><td>Commencer la prise en charge urgente avant confirmation ; un réarrangement RARA rare n’assure pas la même sensibilité aux médicaments.</td></tr><tr><td><button class="w" data-k="c92-bcr-abl">LMC</button></td><td>Démonstration de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>, avec morphologie, cytogénétique et type de transcrit au diagnostic.</td><td>Un test limité aux transcrits habituels peut manquer une variante ; vérifier les discordances.</td></tr><tr><td>MDS/MPN avec neutrophilie</td><td>Leucocytes ≥ 13 G/L, précurseurs myéloïdes circulants ≥ 10 %, dysgranulopoïèse, moelle hypercellulaire et blastes &lt; 20 %, avec exclusions appropriées.</td><td><button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> négatif seul ne suffit pas ; SETBP1/ETNK1 soutiennent le diagnostic sans le remplacer.</td></tr><tr><td>Sarcome myéloïde</td><td>Biopsie tissulaire, panel immunohistochimique, génétique et bilan médullaire.</td><td>Une masse isolée ou une numération normale ne permet pas d’écarter une maladie myéloïde systémique.</td></tr></tbody></table>
<p>La <button class="w" data-k="c92-classification">LAM</button> myélodysplasie-associée illustre l’évolution des critères : dans l’<button class="w" data-k="c92-classification">OMS</button> 2022, l’histoire et les anomalies cytogénétiques ou moléculaires définies priment ; la dysplasie morphologique seule a perdu son rôle de critère suffisant. Les listes de gènes de l’<button class="w" data-k="c92-classification">OMS</button> et de l’<button class="w" data-k="c92-classification">ICC</button> ne sont pas identiques. Un compte rendu doit préciser la classification, les résultats et les limites, plutôt que juxtaposer des étiquettes de versions différentes.</p>
<p>Pour la <button class="w" data-k="c92-bcr-abl">LMC</button>, l’<button class="w" data-k="c92-classification">OMS</button> 2022 adopte une approche biphasique et supprime la phase accélérée comme catégorie, alors que l’<button class="w" data-k="c92-classification">ICC</button> la conserve. L’<button class="w" data-k="c92-sources">ELN</button> 2025 expose ce désaccord. Le pourcentage de blastes, les basophiles, les anomalies chromosomiques additionnelles et l’évolution restent utiles ; ils doivent être rapportés sans faire croire qu’une nomenclature unique est universellement adoptée.</p>

<section class="ilot" id="c92-9"><h2><span class="n">9</span> Choisir les examens pour répondre à une question</h2>
<p>L’hémogramme indique les nombres absolus ; la formule et le frottis décrivent leur répartition et leur aspect. Comparer les résultats antérieurs, vérifier les alertes de l’automate et demander une lecture compétente si des cellules anormales sont suspectées. Une proportion de blastes sur un champ photographique sélectionné ne remplace pas un décompte validé.</p>
<p>L’aspirat médullaire donne accès à la cytologie et à plusieurs analyses complémentaires. La biopsie décrit architecture, cellularité et infiltration, notamment si l’aspirat est pauvre ou impossible. Préparer les prélèvements avec le laboratoire permet de conserver le matériel nécessaire à la cytométrie, à la cytogénétique et à la biologie moléculaire ; ces examens ne sont pas des copies interchangeables du même test.</p>
<p>La cytogénétique conventionnelle recherche des anomalies chromosomiques et leur contexte. La FISH répond à une question ciblée. La PCR identifie ou quantifie un transcrit défini, tandis que le séquençage examine un ensemble de variants selon la conception du panel. Un panel négatif ne prouve pas l’absence de toute anomalie : couverture, sensibilité, longueur des insertions, qualité de prélèvement et transcrits atypiques comptent.</p>
<p>Avant traitement, compléter selon la situation : fonction rénale et hépatique, potassium, phosphate, calcium, urate et LDH, coagulation, sérologies, évaluation cardiaque et grossesse potentielle. La recherche rapide de <button class="w" data-k="c92-differenciation">PML::RARA</button> est prioritaire si <button class="w" data-k="c92-differenciation">LPA</button> suspectée ; les résultats <button class="w" data-k="c92-flt3">FLT3</button>, NPM1, IDH et autres anomalies pertinentes orientent la stratégie de <button class="w" data-k="c92-classification">LAM</button>. Le temps de rendu attendu doit être connu.</p>
<p>La maladie résiduelle mesurable répond ensuite à une autre question : reste-t-il un signal détectable après traitement, avec quelle méthode et quelle sensibilité ? Une morphologie en rémission et une PCR encore détectable peuvent coexister. À l’inverse, une <button class="w" data-k="c92-mrd">MRD</button> négative n’est pas la preuve que toute cellule leucémique a disparu. Le type de prélèvement et le moment du contrôle doivent accompagner le résultat.</p>
<div class="key"><b>À retenir.</b> Avant de demander un examen : quelle hypothèse, quel prélèvement, quel délai et quelle conséquence si le résultat est positif, négatif ou non interprétable ?</div>
<p><button class="w" data-k="c92-hemogramme">Lire la numération et le frottis</button> · <button class="w" data-k="c92-moelle">Aspirat ou biopsie ?</button> · <button class="w" data-k="c92-mrd">Comprendre la maladie résiduelle mesurable</button></p>

<section class="ilot" id="c92-10"><h2><span class="n">10</span> Un arbre diagnostique qui conserve les alternatives</h2>
<p><b>Premier embranchement : urgence ou stabilité.</b> Une atteinte respiratoire, neurologique, infectieuse ou hémorragique impose stabilisation et avis hématologique sans attendre la classification complète. En parallèle, le frottis et la coagulation permettent de repérer une possible <button class="w" data-k="c92-differenciation">LPA</button>. Chez une personne stable, le bilan intégré peut être organisé dans un ordre qui préserve la qualité des prélèvements et le choix du traitement.</p>
<p><b>Deuxième embranchement : population blastique ou prolifération plus mature.</b> Une population blastique conduit à l’immunophénotype et à la génétique : <button class="w" data-k="c92-classification">LAM</button>, leucémie lymphoblastique, leucémie à lignée ambiguë et autres diagnostics doivent être distingués. Une prolifération granulocytaire avec déviation à gauche conduit à rechercher <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>, mais aussi un contexte réactionnel et des signes de dysplasie.</p>
<p><b>Troisième embranchement : concordance des résultats.</b> Si <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> est démontré, définir le transcrit et la phase avec les données morphologiques et cliniques. Si le résultat est négatif malgré une forte suspicion, vérifier la technique et la couverture des transcrits avant de conclure. Si la dysgranulopoïèse prédomine avec prolifération persistante, examiner les critères de MDS/MPN avec neutrophilie et exclure les autres néoplasies définies.</p>
<p><b>Quatrième embranchement : une masse change le prélèvement.</b> Une lésion tissulaire demande une caractérisation propre, même si une leucémie est connue. Infection, lymphome, autre tumeur ou sarcome myéloïde peuvent avoir une présentation proche. Le diagnostic sur tissu et le bilan médullaire doivent dialoguer ; une réponse au traitement n’est pas toujours un substitut suffisant à une preuve initiale accessible.</p>
<table class="t"><thead><tr><th>Hypothèse concurrente</th><th>Élément discriminant à rechercher</th></tr></thead><tbody><tr><td>Réaction infectieuse ou inflammatoire</td><td>Contexte, évolution, formule/frottis et absence ou présence d’un marqueur clonal pertinent ; ne pas opposer artificiellement infection et leucémie.</td></tr><tr><td>LAL ou leucémie à lignée ambiguë</td><td>Panel immunophénotypique complet et génétique ; une cellule immature seule ne définit pas sa lignée.</td></tr><tr><td>MDS ou autre MDS/MPN</td><td>Histoire, cytopénies, dysplasie, blastes et critères génétiques selon classification.</td></tr><tr><td>Carence B12/folate ou aplasie</td><td>Contexte, dosages orientés et aspect médullaire ; conserver une hypothèse concomitante si les résultats l’exigent.</td></tr><tr><td>Lymphome ou autre masse</td><td>Biopsie, panel adapté et confrontation radioclinique ; pas diagnostic de sarcome sur localisation seule.</td></tr></tbody></table>

<section class="ilot" id="c92-11"><h2><span class="n">11</span> Traiter la maladie identifiée et la personne qui la porte</h2>
<p>La décision appartient à une équipe hématologique spécialisée, en tenant compte de la biologie, de la gravité, des comorbidités, de l’autonomie et des objectifs de la personne. Une stratégie intensive de <button class="w" data-k="c92-classification">LAM</button> vise une rémission puis une consolidation ; la greffe allogénique peut réduire le risque de rechute au prix de risques propres. Une stratégie moins intensive reste un traitement actif, avec des toxicités et une surveillance parfois exigeantes.</p>
<p><b><button class="w" data-k="c92-classification">LAM</button> hors <button class="w" data-k="c92-differenciation">LPA</button>.</b> La génétique oriente l’usage de traitements ciblés et l’évaluation du risque. L’association azacitidine–vénétoclax est une option importante chez les personnes ne pouvant recevoir une chimiothérapie intensive ; pour IDH1 R132, azacitidine–ivosidenib possède une indication suisse précise. <button class="w" data-k="c92-flt3">FLT3</button>-ITD et <button class="w" data-k="c92-flt3">FLT3</button>-TKD ne sont pas une seule cible indistincte : les indications de midostaurine, quizartinib et giltéritinib diffèrent selon mutation, ligne et contexte. Les schémas complets sont présentés dans l’onglet pharmacologique.</p>
<p><b><button class="w" data-k="c92-differenciation">LPA</button>.</b> <button class="w" data-k="c92-differenciation">ATRA</button> dès suspicion, soutien de la coagulation et confirmation rapide ; puis protocole adapté au risque. La <button class="w" data-k="c92-fi">FI</button> suisse de Trisenox vise notamment la première ligne à risque non élevé, avec leucocytes initiaux ≤ 10 G/L. L’usage de l’arsenic dans un schéma de première ligne à haut risque ne doit pas être présenté comme inclus automatiquement dans cette indication, même si des recommandations européennes récentes le discutent.</p>
<p><b><button class="w" data-k="c92-bcr-abl">LMC</button>.</b> Choisir un inhibiteur selon objectifs, comorbidités, interactions et profil de résistance. Le bénéfice d’une réponse plus profonde n’est pas identique à un bénéfice démontré de survie globale. Évaluer observance, cinétique moléculaire et tolérance avant de changer sur une seule mesure. Une progression blastique ou une résistance complexe impose une stratégie spécialisée pouvant inclure allogreffe.</p>
<p><b>Formes rares.</b> Le MDS/MPN avec neutrophilie ne se traite pas comme une <button class="w" data-k="c92-bcr-abl">LMC</button> Ph+ : les preuves sont limitées, la cytoréduction contrôle certains symptômes et l’allogreffe reste la stratégie à potentiel curatif établi chez les personnes éligibles. Pour un sarcome myéloïde, une approche systémique est généralement discutée même si la masse paraît isolée ; le traitement local répond notamment au contrôle d’une lésion ou à une compression.</p>
<p>Le soutien est une composante du traitement : prévention et prise en charge des infections, lyse, hémorragies, besoins transfusionnels, nutrition, douleur et soutien psychologique. Les interactions entre anti-infectieux et traitements ciblés doivent être anticipées ; une prophylaxie utile peut imposer une adaptation de dose du médicament antileucémique.</p>

ener">[S516] Tibsovo / ivosidenib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680663100014" target="_blank" rel="noopener">[S514] Rydapt / midostaurine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680672110011" target="_blank" rel="noopener">[S518] Xospata / giltéritinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S535] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S536] OFSP, cas particuliers, art. 71a–d OAMal</a>.</p></div></section>
<section class="ilot" id="c92-12"><h2><span class="n">12</span> Suivre la réponse, prévenir les complications et préparer l’après</h2>
<p>Le suivi doit nommer ce qu’il mesure. Dans la <button class="w" data-k="c92-classification">LAM</button>, la réponse morphologique, la récupération des lignées et la maladie résiduelle ne sont pas équivalentes. Une rémission complète exige notamment moins de 5 % de blastes médullaires, absence de blastes circulants et de maladie extramédullaire, neutrophiles ≥ 1 G/L et plaquettes ≥ 100 G/L. Les catégories de récupération partielle ou incomplète ont leurs propres définitions.</p>
<p>Après un traitement curatif de <button class="w" data-k="c92-classification">LAM</button>, Onkopedia propose des contrôles cliniques et de numération tous les 1–3 mois pendant les deux premières années, puis tous les 3–6 mois jusqu’à cinq ans, avec investigation médullaire si suspicion. Le suivi moléculaire dépend du marqueur et du traitement : ce calendrier général ne remplace pas un protocole de <button class="w" data-k="c92-mrd">MRD</button> individualisé. Pour la <button class="w" data-k="c92-differenciation">LPA</button>, le résultat moléculaire après consolidation est central ; le suivi ultérieur dépend notamment du schéma et du risque.</p>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, l’<button class="w" data-k="c92-sources">ELN</button> 2025 recommande un suivi moléculaire au moins tous les trois mois jusqu’à confirmation de la réponse moléculaire majeure, puis des intervalles de 4–6 mois si elle est stable. Les contrôles se rapprochent si les transcrits augmentent, si la tolérance entraîne des interruptions ou si un arrêt thérapeutique est envisagé. « Indétectable » signifie sous la limite d’une méthode sur un prélèvement suffisamment informatif.</p>
<p>Une rémission sans traitement de <button class="w" data-k="c92-bcr-abl">LMC</button> se prépare avec des critères stricts : première phase chronique, réponse profonde durable, durée de traitement suffisante, patient informé et laboratoire permettant des résultats rapides. Après arrêt, les contrôles sont fréquents et prolongés ; une perte de réponse moléculaire majeure conduit à reprendre le <button class="w" data-k="c92-bcr-abl">TKI</button>. Ce projet n’est ni une obligation ni une preuve de guérison définitive.</p>
<p>Prévenir aussi les dommages du suivi lui-même : expliquer les symptômes qui imposent un appel urgent, vérifier les interactions à chaque changement de traitement, surveiller les organes selon le produit et aborder fatigue, fertilité et retour aux activités. Il n’existe pas de programme de dépistage de population démontré pour éviter toutes ces leucémies. Réduire les expositions modifiables ne remplace pas le bilan d’une anomalie persistante.</p>

<section class="ilot" id="c92-13"><h2><span class="n">13</span> Les repères qui changent une décision</h2>
<table class="t"><thead><tr><th>Repère</th><th>Ce qu’il signifie</th><th>Ce qu’il ne signifie pas</th></tr></thead><tbody><tr><td><button class="w" data-k="c92-classification">LAM</button> : 20 %, avec exceptions génétiques</td><td>Seuil à interpréter selon l’entité et la classification nommée.</td><td>Toute maladie sous 20 % serait bénigne ou non leucémique.</td></tr><tr><td><button class="w" data-k="c92-differenciation">LPA</button> : leucocytes initiaux ≤ 10 G/L</td><td>Risque non élevé dans le cadre <button class="w" data-k="c92-differenciation">ATRA</button>/<button class="w" data-k="c92-differenciation">ATO</button> discuté et indication suisse Trisenox correspondante.</td><td>Absence d’urgence hémorragique.</td></tr><tr><td><button class="w" data-k="c92-bcr-abl">LMC</button> : IS ≤ 10 %, ≤ 1 %, ≤ 0,1 %</td><td>Jalons favorables respectivement à 3, 6 et 12 mois, avec contexte clinique.</td><td>Ordre automatique de changement à partir d’un seul résultat.</td></tr><tr><td>Réponse moléculaire majeure : IS ≤ 0,1 %</td><td>Niveau de réponse standardisé pour les transcrits usuels.</td><td>Zéro cellule leucémique ou autorisation immédiate d’arrêter.</td></tr><tr><td>Vénétoclax : leucocytes &lt; 25 G/L avant début</td><td>Condition de préparation avec prévention et surveillance de lyse selon <button class="w" data-k="c92-fi">FI</button>.</td><td>Risque de lyse devenu nul.</td></tr><tr><td>MDS/MPN neutrophilique : ≥ 13 G/L et précurseurs ≥ 10 %</td><td>Deux éléments d’un diagnostic comportant dysplasie et exclusions.</td><td>Diagnostic sur deux chiffres seuls.</td></tr></tbody></table>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une personne présente 12 % de blastes médullaires et une mutation NPM1. Peut-on exclure une <button class="w" data-k="c92-classification">LAM</button> parce que le seuil de 20 % n’est pas atteint ?</p><button data-ok="1">Non : intégrer la génétique, la morphologie et la classification applicable.</button><button data-ok="0">Oui : 20 % est obligatoire dans toute leucémie aiguë myéloïde.</button><button data-ok="0">Oui : NPM1 ne sert qu’à choisir une dose.</button><p class="fb" hidden>Les classifications actuelles reconnaissent certaines <button class="w" data-k="c92-classification">LAM</button> génétiquement définies sous 20 %. L’<button class="w" data-k="c92-classification">OMS</button> et l’<button class="w" data-k="c92-classification">ICC</button> n’emploient pas exactement les mêmes seuils ; la corrélation intégrée reste indispensable.</p></div>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une <button class="w" data-k="c92-bcr-abl">LMC</button> traitée présente une seule PCR supérieure au jalon attendu, après plusieurs interruptions pour toxicité. Quelle est la première démarche ?</p><button data-ok="1">Reconstituer les prises, la tolérance, les interactions et la cinétique, puis organiser la confirmation et le bilan adapté.</button><button data-ok="0">Déclarer immédiatement une mutation résistante.</button><button data-ok="0">Arrêter tout suivi parce que le patient se sent bien.</button><p class="fb" hidden>L’<button class="w" data-k="c92-sources">ELN</button> 2025 demande de contextualiser les résultats. Une valeur isolée ne suffit pas à expliquer la cause ni à dicter tous les changements de traitement.</p></div>

<section class="ilot" id="c92-14"><h2><span class="n">14</span> Pièges fréquents et explication au patient</h2>
<p><b>Confondre famille, maladie et cible.</b> C92 n’est pas un protocole. La <button class="w" data-k="c92-bcr-abl">LMC</button> <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> positive, la <button class="w" data-k="c92-differenciation">LPA</button> <button class="w" data-k="c92-differenciation">PML::RARA</button> et une <button class="w" data-k="c92-classification">LAM</button> <button class="w" data-k="c92-flt3">FLT3</button> mutée n’appellent pas les mêmes médicaments. Un ancien libellé administratif doit être relié avec prudence à une entité moderne ; les formes myélomonocytaires aiguë et chronique doivent rester distinctes.</p>
<p><b>Surinterpréter une image ou une mesure.</b> Une photographie peut montrer une anomalie remarquable sans représenter toute la population cellulaire. La présence de corps d’Auer ne nomme pas la fusion. Une PCR négative dépend du transcrit, du prélèvement et de sa qualité ; une <button class="w" data-k="c92-mrd">MRD</button> négative n’efface pas tout risque de rechute. Un marqueur de clonalité peut persister sans être un marqueur fiable de maladie résiduelle leucémique.</p>
<p><b>Fusionner des recommandations différentes.</b> Les classifications <button class="w" data-k="c92-classification">OMS</button>/<button class="w" data-k="c92-classification">ICC</button>, les risques <button class="w" data-k="c92-sources">ELN</button> intensif/moins intensif, les règles de réponse et les indications Swissmedic répondent à des questions différentes. Les fiches de médicaments distinguent aussi populations et schémas. Une contre-indication de la LLC ne doit pas être importée en <button class="w" data-k="c92-classification">LAM</button>, ni une option européenne transformée en indication suisse.</p>
<p><b>Oublier la personne après la rémission.</b> Le traitement peut imposer une surveillance durable, une fatigue, des contraintes de prise et des décisions familiales. Expliquer ce qui est certain, ce qui reste à mesurer et les symptômes qui nécessitent un contact. L’autorisation d’un médicament, son inscription à la liste des spécialités et sa prise en charge dans un cas particulier ne garantissent pas automatiquement un remboursement individuel.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Un frottis peu granuleux accompagne saignements et coagulopathie. Faut-il attendre la PCR finale pour contacter l’hématologue et traiter une <button class="w" data-k="c92-differenciation">LPA</button> suspectée ?</p><button data-ok="1">Non : organiser immédiatement la prise en charge de LPA suspectée et la confirmation urgente.</button><button data-ok="0">Oui : l’absence de grosses granulations exclut la LPA.</button><button data-ok="0">Oui : commencer uniquement si les leucocytes dépassent 100 G/L.</button><p class="fb" hidden>La <button class="w" data-k="c92-differenciation">LPA</button> hypogranulaire peut être trompeuse. Le risque hémorragique justifie <button class="w" data-k="c92-differenciation">ATRA</button> et soutien de la coagulation dès suspicion sous responsabilité spécialisée, avec recherche urgente de <button class="w" data-k="c92-differenciation">PML::RARA</button>.</p></div>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une personne reçoit azacitidine–vénétoclax pour <button class="w" data-k="c92-classification">LAM</button> et doit recevoir un inhibiteur puissant du <button class="w" data-k="c92-interactions">CYP3A</button>. Quelle attitude est correcte ?</p><button data-ok="1">Appliquer le schéma suisse d’adaptation propre à la leucémie aiguë myéloïde, avec surveillance accrue et coordination pharmaceutique.</button><button data-ok="0">Maintenir toujours 400 mg sans adaptation.</button><button data-ok="0">Appliquer automatiquement la contre-indication d’escalade de la leucémie lymphoïde chronique.</button><p class="fb" hidden>La <button class="w" data-k="c92-fi">FI</button> distingue les indications. En <button class="w" data-k="c92-classification">LAM</button>, une escalade et une dose réduites sont prévues ; le risque de toxicité et de lyse demeure. Le produit exact et le moment de l’association comptent.</p></div>
<div class="key"><b>À retenir.</b> Une bonne décision est traçable : diagnostic et classification, résultat décisif, urgence, objectif du traitement, produit suisse exact, surveillance et limite connue. Les cas de cette leçon sont fictifs ; les références et leurs dates sont accessibles dans les fiches.</div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="c92-e-1"><h2><span class="n">e-1</span> Hémogramme et frottis : quantité, morphologie et urgence</h2>
<p>L’hémogramme mesure des nombres absolus et des indices ; le frottis permet d’examiner des cellules. Ces deux informations répondent à des questions différentes. Une leucocytose totale peut contenir beaucoup de cellules anormales sans assurer une défense efficace. Inversement, une leucémie aiguë peut s’accompagner d’une numération leucocytaire normale ou basse. Les normes de l’hémoglobine et des autres paramètres doivent être rapportées au laboratoire, à l’âge et à la situation clinique.</p>
<p>Devant une anomalie, comparer aux résultats antérieurs, vérifier les alertes de l’automate et organiser la lecture du frottis. Décrire les cellules immatures, les signes de dysplasie et les lignées associées, plutôt que conclure immédiatement à un sous-type génétique. Dans le cadre diagnostique de <button class="w" data-k="c92-classification">LAM</button>, l’<button class="w" data-k="c92-sources">ELN</button> précise un décompte de 200 cellules nucléées sur les frottis sanguins et de 500 sur les frottis médullaires ; ces exigences ne peuvent pas être satisfaites en regardant seulement une photographie pédagogique.</p>
<figure id="c92-exam-auer" data-origin="human-original"><img src="assets/img/c92/alpha/codex/aml-auer-rods.png" alt="Aspirat médullaire humain de leucémie aiguë myéloïde avec deux flèches rouges originales vers des corps d’Auer" loading="lazy"><figcaption><b>Un indice de différenciation myéloïde.</b> <b>Repère 1, flèche rouge centrale :</b> inclusion cytoplasmique allongée désignée dans l’original. <b>Repère 2, flèche rouge en haut à droite :</b> second repérage original. <b>Repère 3, grandes cellules violettes :</b> population blastique décrite dans la provenance ; apprécier noyau et cytoplasme avec le laboratoire. <b>Repère 4, ensemble du champ :</b> image sélectionnée, sans décompte représentatif de toute la moelle. Les flèches existaient avant MEDINA. Un corps d’Auer oriente vers une différenciation myéloïde ; cette image ne démontre ni <button class="w" data-k="c92-differenciation">PML::RARA</button> ni un sous-type génétique précis. Original : VashiDonsk, téléversement original du 4 mai 2006, <a href="https://commons.wikimedia.org/wiki/File:Auer_rods.PNG" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels intacts ; repères français ajoutés à la légende. La figure et ses annotations françaises sont proposées sous CC BY-SA 3.0.</figcaption></figure>
<p>Les corps d’Auer représentent un indice de différenciation myéloïde. Ils ne sont ni présents dans toutes les <button class="w" data-k="c92-classification">LAM</button>, ni suffisants pour prouver une <button class="w" data-k="c92-differenciation">LPA</button>. Une morphologie promyélocytaire suspecte doit toutefois déclencher une recherche urgente de <button class="w" data-k="c92-differenciation">PML::RARA</button> et la prise en charge de la coagulopathie. La forme hypogranulaire justifie de conserver la suspicion malgré l’absence de grosses granulations évidentes.</p>
<p>Dans une prolifération granulocytaire chronique, examiner la diversité des maturations, les basophiles et la dysplasie avec un décompte adapté. Un prélèvement unique ne permet pas toujours de distinguer réaction et néoplasie. La persistance, le contexte et la génétique sont déterminants. Noter aussi anémie et thrombopénie : les autres lignées aident à comprendre le retentissement médullaire et la gravité.</p>
<div class="key"><b>À retenir.</b> Un frottis fournit des arguments morphologiques. Il ne remplace ni la numération absolue, ni le décompte représentatif, ni la démonstration de la fusion ou de la mutation.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Auer_rods.PNG" target="_blank" rel="noopener">[S529] Auer rods, aspirat médullaire humain</a>.</p></div></section>
<section class="ilot" id="c92-e-2"><h2><span class="n">e-2</span> Moelle et tissu : obtenir le bon matériel</h2>
<p>L’aspiration médullaire permet l’examen cytologique et fournit du matériel pour cytométrie, cytogénétique et analyses moléculaires. La biopsie ostéomédullaire montre l’architecture, la cellularité et la répartition des infiltrats. Elle devient particulièrement importante en cas de ponction pauvre ou blanche ; une absence de matériel aspiré n’équivaut pas à une absence de maladie. Les appositions de biopsie peuvent compléter la cytologie.</p>
<p>Prévenir le laboratoire avant les prélèvements lorsque l’urgence ou une entité particulière est suspectée. Le choix du tube, du transport et de la répartition des échantillons influence ce qui pourra être analysé. La qualité et l’hémodilution du prélèvement comptent aussi pour la maladie résiduelle : une mesure techniquement faible peut donner une impression trompeuse de négativité.</p>
<p>La cytométrie doit établir la différenciation avec un panel approprié, sans faire reposer la lignée sur un marqueur peu spécifique isolé. Des expressions aberrantes existent ; certains marqueurs habituels peuvent manquer. Morphologie, immunophénotype et génétique doivent aboutir à une conclusion cohérente. Un marqueur utile pour caractériser le clone au diagnostic n’est pas nécessairement suffisant pour son suivi.</p>
<p>Pour un sarcome myéloïde, le prélèvement tissulaire est indispensable lorsque la preuve peut être obtenue. Une simple cytoponction peut être insuffisante. Le panel immunohistochimique doit distinguer les tumeurs myéloïdes des lymphomes et d’autres masses ; MPO, CD33, CD117, CD68 et d’autres marqueurs sont interprétés ensemble. Leur expression varie et aucun résultat isolé ne remplace l’ensemble du bilan.</p>
<p>Le tissu mérite aussi une analyse génétique, surtout dans une forme apparemment isolée. Un bilan médullaire avec immunophénotype et génétique recherche une atteinte concomitante. L’imagerie dépend de la localisation : une atteinte neurologique, rachidienne ou musculosquelettique ne pose pas la même question qu’une masse de tissus mous. Une exploration métabolique peut aider à inventorier les sites, sans prouver à elle seule leur nature.</p>
<p><button class="w" data-k="c92-moelle">Ce que chaque prélèvement apporte</button> · <button class="w" data-k="c92-sarcome">Pourquoi une masse isolée appelle un bilan systémique</button></p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a> ; <a data-reference-source="1" href="https://iris.unil.ch/entities/publication/607ac57b-f30a-4d32-aa01-23eaa45bb7f9" target="_blank" rel="noopener">[S511] Manifestations ORL du sarcome myéloïde</a>.</p></div></section>
<section class="ilot" id="c92-e-3"><h2><span class="n">e-3</span> Cytogénétique et biologie moléculaire : nommer la cible</h2>
<p>Un caryotype donne une vue d’ensemble des chromosomes et recherche notamment des anomalies additionnelles. L’<button class="w" data-k="c92-sources">ELN</button> recommande au moins 20 métaphases médullaires pour définir un caryotype normal dans la <button class="w" data-k="c92-classification">LAM</button> ; en cas d’échec, des analyses ciblées peuvent apporter une partie de l’information. Une FISH normale pour une cible ne signifie pas que tout le génome est normal.</p>
<p>La PCR peut détecter ou quantifier un transcrit défini. Pour la <button class="w" data-k="c92-bcr-abl">LMC</button>, identifier le type de transcrit au diagnostic permet de choisir un suivi pertinent. Les transcrits usuels e13a2 et e14a2 se suivent sur l’échelle internationale ; une variante nécessite une méthode adaptée et validée. Une discordance entre cytogénétique et PCR doit faire vérifier la couverture technique, et non effacer l’un des résultats.</p>
<p>Dans la <button class="w" data-k="c92-classification">LAM</button>, la recherche de <button class="w" data-k="c92-differenciation">PML::RARA</button>, des fusions définissantes et des mutations susceptibles d’orienter le traitement doit être organisée rapidement. Le séquençage à haut débit n’a pas la même sensibilité pour tous les événements ; de longues duplications <button class="w" data-k="c92-flt3">FLT3</button>-ITD peuvent être mal détectées par certaines approches. La méthode, le délai et les limites doivent accompagner l’interprétation.</p>
<p>Une mutation sert parfois à définir une maladie, parfois à estimer un risque, parfois à choisir un médicament, parfois à envisager une prédisposition familiale. Ces fonctions ne se superposent pas toujours. Le profil <button class="w" data-k="c92-sources">ELN</button> 2022 ne doit pas être utilisé sans préciser son contexte principalement intensif ; l’<button class="w" data-k="c92-sources">ELN</button> 2024 moins intensif prend en compte les traitements HMA et leurs associations dans une population définie.</p>
<p>En <button class="w" data-k="c92-bcr-abl">LMC</button>, le bilan mutationnel de résistance n’est pas recommandé systématiquement au diagnostic d’une phase chronique. Il devient pertinent selon réponse insuffisante, avertissement, progression ou autre situation définie. Une perte de réponse moléculaire après arrêt programmé du <button class="w" data-k="c92-bcr-abl">TKI</button> ne nécessite pas automatiquement un bilan de résistance identique à celui d’un échec sous traitement.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Le caryotype est compatible avec un chromosome Philadelphie, mais la PCR standard est négative. Quelle conclusion est la plus rigoureuse ?</p><button data-ok="1">Vérifier les transcrits couverts, la qualité et la concordance avec le laboratoire avant d’exclure BCR::ABL1.</button><button data-ok="0">Le caryotype est forcément faux.</button><button data-ok="0">Le patient a nécessairement un MDS/MPN avec neutrophilie.</button><p class="fb" hidden>Une méthode ciblée peut manquer un transcrit atypique. L’<button class="w" data-k="c92-sources">ELN</button> recommande une stratégie permettant de résoudre la discordance et de préparer un suivi moléculaire adapté.</p></div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a>.</p></div></section>
<section class="ilot" id="c92-e-4"><h2><span class="n">e-4</span> Réponse et <button class="w" data-k="c92-mrd">MRD</button> : lire la profondeur sans promettre l’éradication</h2>
<p>La rémission morphologique, la récupération de l’hématopoïèse et la profondeur moléculaire décrivent des dimensions différentes. Pour la <button class="w" data-k="c92-classification">LAM</button>, une rémission complète comporte une moelle avec moins de 5 % de blastes, aucune maladie extramédullaire ni blaste circulant, et une récupération des neutrophiles et plaquettes. CRh correspond à une récupération partielle définie, tandis que CRi désigne une récupération incomplète selon les critères ; le compte rendu doit préciser la catégorie utilisée.</p>
<table class="t"><thead><tr><th>Réponse <button class="w" data-k="c92-classification">LAM</button>, <button class="w" data-k="c92-sources">ELN</button> 2022</th><th>Critères principaux</th></tr></thead><tbody><tr><td>CR</td><td>Blastes médullaires &lt; 5 %, absence de blastes circulants et de maladie extramédullaire ; neutrophiles ≥ 1 G/L, plaquettes ≥ 100 G/L.</td></tr><tr><td>CRh</td><td>Autres critères de CR, neutrophiles ≥ 0,5 G/L et plaquettes ≥ 50 G/L. Si CRh est utilisée, CRi ne doit pas la recompter.</td></tr><tr><td>CRi</td><td>Autres critères de CR, avec neutropénie &lt; 1 G/L ou thrombopénie &lt; 100 G/L.</td></tr><tr><td>État morphologique sans leucémie</td><td>Moelle &lt; 5 %, absence de maladie extramédullaire/circulante, sans exigence de récupération ; une moelle simplement aplasique n’est pas une preuve suffisante.</td></tr><tr><td>Rechute après réponse</td><td>Blastes médullaires ≥ 5 %, réapparition sanguine confirmée selon critères ou maladie extramédullaire ; replacer le résultat dans le contexte.</td></tr></tbody></table>
<p>La <button class="w" data-k="c92-mrd">MRD</button> peut être étudiée par cytométrie ou par méthode moléculaire lorsque le marqueur est approprié. Pour certaines <button class="w" data-k="c92-classification">LAM</button>, NPM1 et les fusions du core-binding factor sont particulièrement utiles. Les mutations DNMT3A, TET2 ou ASXL1 peuvent refléter une hématopoïèse clonale persistante ; leur détection ne doit pas être automatiquement appelée <button class="w" data-k="c92-mrd">MRD</button> leucémique. La méthode et le marqueur restent essentiels.</p>
<p>En <button class="w" data-k="c92-bcr-abl">LMC</button>, les pourcentages sur l’échelle internationale ne sont pas des pourcentages de blastes. Une réponse moléculaire majeure correspond à <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> IS ≤ 0,1 %, <button class="w" data-k="c92-cml-is">MR4</button> à ≤ 0,01 % et <button class="w" data-k="c92-cml-is">MR4,5</button> à ≤ 0,0032 %. Une réponse dite indétectable exige un nombre suffisant de transcrits de contrôle pour préciser la sensibilité atteinte. Une valeur « zéro » imprimée sans cette information peut être mal comprise.</p>
<p>Un résultat résiduel doit être rapproché de la cinétique, du traitement et du moment de prélèvement. Une faible positivité n’a pas la même portée selon le marqueur et la phase du traitement. Une négativité réduit parfois le risque estimé sans l’annuler. Ne pas annoncer une guérison sur un seul prélèvement, ni un échec irréversible avant d’avoir confirmé et interprété une variation pertinente.</p>
<p><button class="w" data-k="c92-mrd">Les limites d’une mesure sensible</button> · <button class="w" data-k="c92-jalons">Jalons LMC à 3, 6 et 12 mois</button></p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></section>
<section class="ilot" id="c92-e-5"><h2><span class="n">e-5</span> Avant et pendant le traitement : chercher les risques modifiables</h2>
<p>Le bilan préthérapeutique prépare une action. Évaluer fonction rénale, hépatique, cardiaque et état infectieux, rechercher une grossesse possible, discuter préservation de fertilité lorsque le délai et la situation le permettent, et anticiper les besoins transfusionnels. Les examens sont adaptés au traitement envisagé ; une liste uniforme ne remplace pas cette réflexion.</p>
<p>La lyse tumorale nécessite potassium, phosphate, calcium, urate, créatinine et évaluation de la charge de maladie. Avec le vénétoclax en <button class="w" data-k="c92-classification">LAM</button>, la <button class="w" data-k="c92-fi">FI</button> impose notamment une numération leucocytaire inférieure à 25 G/L avant le début, une hydratation et une prévention de l’hyperuricémie adaptées. Contrôler les valeurs avant la dose, puis 6–8 heures après chaque nouvelle dose pendant l’escalade et 24 heures après la dose finale ; les personnes à risque demandent des mesures supplémentaires.</p>
<p>Une <button class="w" data-k="c92-differenciation">LPA</button> exige un suivi rapproché des plaquettes, du fibrinogène et des tests de coagulation, avec correction immédiate selon les objectifs du centre. Le saignement clinique reste déterminant. Une ponction lombaire ou un geste invasif non indispensable ne doit pas être réalisé par automatisme pendant la coagulopathie.</p>
<p>Pour les traitements exposant au <button class="w" data-k="c92-interactions">QT</button> long, corriger les électrolytes et rechercher les médicaments associés. Les calendriers ne sont pas universels : Trisenox demande un ECG au moins deux fois par semaine pendant induction et consolidation ; Xospata prévoit notamment les jours 8 et 15 du premier cycle puis avant les deux suivants ; Tibsovo et Vanflyta ont leurs propres séquences. Ces différences sont reprises dans les fiches suisses.</p>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, l’<button class="w" data-k="c92-sources">ELN</button> prévoit au minimum un ECG, une mesure de pression artérielle et un dépistage VHB avant <button class="w" data-k="c92-bcr-abl">TKI</button> ; les facteurs cardiovasculaires et les examens supplémentaires dépendent du produit et du terrain. La <button class="w" data-k="c92-fi">FI</button> Scemblix précise en outre le suivi pancréatique et hématologique. Une recommandation générale de surveillance ne remplace pas les exigences du médicament choisi.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Après introduction d’un traitement ciblé, dyspnée, prise de poids et fièvre apparaissent. Peut-on conclure immédiatement à une infection seule ?</p><button data-ok="1">Non : rechercher aussi un syndrome de différenciation et les autres causes, en traitant rapidement les urgences possibles.</button><button data-ok="0">Oui : un médicament antileucémique ne peut pas causer ce tableau.</button><button data-ok="0">Oui : l’absence d’hyperleucocytose exclut la différenciation.</button><p class="fb" hidden>La différenciation peut survenir avec plusieurs médicaments et ne dépend pas toujours d’une hyperleucocytose. Elle peut coexister avec une infection ; l’évaluation et les traitements urgents sont coordonnés.</p></div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680672110011" target="_blank" rel="noopener">[S518] Xospata / giltéritinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680690770013" target="_blank" rel="noopener">[S516] Tibsovo / ivosidenib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-c92-examens">▲ Loi de Pareto — Examens</button></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="c92-tab-semio" role="tab" aria-selected="true" aria-controls="c92-s-semio" data-s="c92-s-semio">Sémiologie fondamentale et analytique</button><button id="c92-tab-anat" role="tab" aria-selected="false" aria-controls="c92-s-anat" data-s="c92-s-anat">Anatomie</button><button id="c92-tab-histo" role="tab" aria-selected="false" aria-controls="c92-s-histo" data-s="c92-s-histo">Histologie</button><button id="c92-tab-physio" role="tab" aria-selected="false" aria-controls="c92-s-physio" data-s="c92-s-physio">Physiologie</button><button id="c92-tab-bio" role="tab" aria-selected="false" aria-controls="c92-s-bio" data-s="c92-s-bio">Biochimie et pharmacologie moléculaire</button><button id="c92-tab-gen" role="tab" aria-selected="false" aria-controls="c92-s-gen" data-s="c92-s-gen">Génétique</button></div><div class="chap-body sci-body"><div class="sci" id="c92-s-semio" role="tabpanel" aria-labelledby="c92-tab-semio"><section class="ilot" id="c92-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3>
<h4>Partir des fonctions avant de nommer la maladie</h4>
<p>La moelle produit les éléments sanguins dans un environnement organisé. Les hématies transportent l’oxygène, les plaquettes participent à l’hémostase et les leucocytes assurent différentes fonctions de défense. La maturation et la production sont régulées : le nombre total de cellules ne suffit pas à décrire leur fonction. Une augmentation de cellules anormales peut donc coexister avec un défaut de défense et une réduction des lignées normales.</p>
<p>Cette organisation permet de comprendre trois groupes de manifestations : défaut d’une lignée normale, accumulation/infiltration de cellules anormales et conséquences systémiques du clone ou du traitement. Anémie, saignement et infection ne sont pas interchangeables, même s’ils peuvent survenir ensemble. Une masse extramédullaire, une splénomégalie et une coagulopathie ajoutent des mécanismes différents à l’insuffisance médullaire.</p>
<p>La sémiologie relie ainsi fonction, mécanisme, signe, examen et décision. C92 désigne une famille de codage, pas un syndrome clinique unique. Une <button class="w" data-k="c92-classification">LAM</button>, une <button class="w" data-k="c92-differenciation">LPA</button>, une <button class="w" data-k="c92-bcr-abl">LMC</button> et un sarcome myéloïde peuvent commencer par des symptômes différents et appeler des urgences différentes. Le diagnostic précis ne doit pas être anticipé à partir du seul code.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S525] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S526] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S527] 18.5 Hemostasis  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S501] CIM-10-GM 2024 français, catégories C92</a>.</p></div></section><section class="ilot" id="c92-semio-signs" data-semiology="signs"><h3>2. Décrire les symptômes et les signes</h3>
<p>Interroger le début et la vitesse d’évolution de la fatigue, la dyspnée, les palpitations, les infections et les saignements. Distinguer ecchymoses, pétéchies, épistaxis, gingivorragies et saignement profond ; préciser abondance, spontanéité, médicaments et antécédents. Une fièvre se décrit avec son contexte et ses signes de gravité, sans l’attribuer d’emblée à la tumeur.</p>
<p>Rechercher perte de poids involontaire, sueurs nocturnes, gêne ou satiété précoce sous les côtes gauches, douleurs osseuses et masses. Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, une découverte fortuite à l’hémogramme est possible : l’absence de symptôme ne prouve pas l’absence de maladie. À l’inverse, fatigue et amaigrissement sont peu spécifiques et ne démontrent pas une leucémie.</p>
<p>L’examen apprécie conscience, paramètres vitaux, perfusion, état respiratoire, peau et muqueuses, adénopathies, foie, rate et anomalies focales. Une hypertrophie gingivale ou une lésion cutanée peut orienter vers une infiltration, mais exige une confirmation adaptée. Documenter ce qui est réellement observé ; ne pas ajouter un signe classique absent chez le patient pour compléter une liste.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fr/hematologie/hem-home/patients-et-famille/maladies-et-traitements/cancers-du-sang/leucemies-aigues-ou-chroniques/leucemie-myeloide-chronique" target="_blank" rel="noopener">[S538] Leucémie myéloïde chronique : manifestations et diagnostic</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a>.</p></div></section><section class="ilot" id="c92-semio-mechanisms" data-semiology="mechanisms"><h3>3. Relier les manifestations à leurs mécanismes</h3>
<p>Dans la <button class="w" data-k="c92-classification">LAM</button>, une prolifération avec défaut de différenciation peut réduire l’hématopoïèse efficace. Une baisse de l’hémoglobine réduit le transport d’oxygène ; une baisse ou une anomalie des plaquettes contribue au saignement ; un déficit de neutrophiles fonctionnels expose aux infections. Ces relations expliquent des tendances, sans déterminer à elles seules la gravité individuelle.</p>
<p>Dans la <button class="w" data-k="c92-differenciation">LPA</button>, une coagulopathie complexe expose notamment à des hémorragies graves. Le risque n’est pas résumé par le nombre de plaquettes. Dans une hyperleucocytose, les propriétés des cellules et leurs interactions microvasculaires peuvent contribuer à une leucostase ; le nombre total ne suffit donc pas à prévoir dyspnée ou atteinte neurologique. La lyse cellulaire, spontanée ou après traitement, libère des constituants qui perturbent urate, potassium, phosphate et fonction rénale.</p>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, la prolifération granulocytaire conserve une part de maturation. Une grande numération peut coexister avec peu de symptômes initiaux. La rate peut augmenter de volume et devenir symptomatique. Une masse myéloïde extramédullaire produit un effet local, mais peut appartenir à une maladie systémique ; mécanisme local et nature hématologique doivent être considérés ensemble.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a>.</p></div></section><section class="ilot" id="c92-semio-examination" data-semiology="examination"><h3>4. Examiner et choisir les premières mesures</h3>
<p>La première question est la stabilité : détresse respiratoire, trouble neurologique, saignement actif ou état septique demandent une prise en charge urgente. L’hémogramme avec formule et le frottis décrivent ensuite les lignées et les cellules. Comparer aux résultats antérieurs et demander une lecture spécialisée des alertes morphologiques.</p>
<p>Le bilan initial recherche aussi coagulation perturbée, atteinte rénale, risque de lyse et complications. Si une <button class="w" data-k="c92-differenciation">LPA</button> est suspectée, la recherche rapide de <button class="w" data-k="c92-differenciation">PML::RARA</button> et la prise en charge de la coagulopathie se déroulent sans attendre la fin de tout le bilan génétique. La ponction médullaire, la biopsie, la cytométrie et la génétique répondent à des questions complémentaires, avec une répartition adaptée des prélèvements.</p>
