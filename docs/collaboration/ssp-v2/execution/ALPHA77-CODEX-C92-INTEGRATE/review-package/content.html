<p>Le vénétoclax interagit fortement avec les inhibiteurs du <button class="w" data-k="c92-interactions">CYP3A</button>. Dans la <button class="w" data-k="c92-classification">LAM</button>, la <button class="w" data-k="c92-fi">FI</button> prévoit avec un inhibiteur puissant une escalade réduite de 10, 20, 50 puis au maximum 100 mg à partir de J4 ; avec un inhibiteur modéré, la réduction est d’au moins 50 %. La reprise de la dose antérieure attend 2–3 jours après l’arrêt de l’inhibiteur. Cette règle de <button class="w" data-k="c92-classification">LAM</button> ne doit pas être confondue avec la contre-indication de certains inhibiteurs pendant l’escalade en LLC. Le millepertuis est contre-indiqué. La prévention antifongique doit donc être intégrée à la prescription, pas ajoutée après calcul des doses.</p>
<p>Pour Tibsovo, un inhibiteur modéré ou puissant du <button class="w" data-k="c92-interactions">CYP3A4</button>, s’il ne peut être évité, impose une réduction à 250 mg/j selon la <button class="w" data-k="c92-fi">FI</button>. Les inducteurs puissants et le dabigatran sont contre-indiqués. Le traitement est aussi contre-indiqué dans certaines situations de <button class="w" data-k="c92-interactions">QT</button> très prolongé ou de risque rythmique spécifiées dans la <button class="w" data-k="c92-fi">FI</button>. ECG hebdomadaire pendant les trois premières semaines, puis mensuel ; numération et biochimie rapprochées au début. Un syndrome de différenciation nécessite traitement et surveillance ; l’interruption est envisagée selon gravité et persistance, notamment au-delà de 48 h malgré corticoïdes.</p>
<p>L’atteinte hépatique sévère impose une réduction de 50 % du vénétoclax. Vidaza est contre-indiqué dans l’atteinte hépatique sévère, la grossesse et l’allaitement selon la <button class="w" data-k="c92-fi">FI</button> consultée ; les anomalies rénales et bicarbonatées peuvent imposer un report et une réduction ultérieure. Pour ivosidenib, les données en insuffisance rénale ou hépatique sévère sont limitées. Les indications et adaptations pédiatriques ne sont pas établies par ces schémas adultes.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une prophylaxie par inhibiteur puissant du <button class="w" data-k="c92-interactions">CYP3A</button> est ajoutée pendant l’escalade de vénétoclax pour <button class="w" data-k="c92-classification">LAM</button>. Que faut-il faire ?</p><button data-ok="1">Recalculer le schéma de leucémie aiguë myéloïde selon la information professionnelle et réévaluer la surveillance avant les prises suivantes.</button><button data-ok="0">Garder automatiquement 400 mg car il ne s’agit pas d’une chimiothérapie IV.</button><button data-ok="0">Appliquer sans distinction la règle d’escalade de la leucémie lymphoïde chronique.</button><p class="fb" hidden>L’interaction augmente l’exposition. La <button class="w" data-k="c92-fi">FI</button> distingue les indications et prévoit une escalade réduite en <button class="w" data-k="c92-classification">LAM</button> ; le contexte infectieux, la lyse et les autres médicaments doivent être intégrés.</p></div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680573800011" target="_blank" rel="noopener">[S515] Vidaza / azacitidine injectable</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680690770013" target="_blank" rel="noopener">[S516] Tibsovo / ivosidenib</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a>.</p></div></section>
<section class="ilot" id="c92-p-4"><h2><span class="n">p-4</span> Cibler <button class="w" data-k="c92-flt3">FLT3</button> : trois médicaments, trois contextes</h2>
<p><button class="w" data-k="c92-flt3">FLT3</button> est un récepteur impliqué dans des signaux de survie et de prolifération. Une mutation peut participer au développement du clone, mais « <button class="w" data-k="c92-flt3">FLT3</button> positif » ne définit pas une ordonnance unique. Il faut préciser ITD ou mutation du domaine tyrosine kinase, première ligne ou rechute, traitements associés et contexte de greffe. La mutation peut évoluer : l’analyse au moment d’une rechute peut changer la décision.</p>
<table class="t"><thead><tr><th>Produit</th><th>Indication et doses de <button class="w" data-k="c92-fi">FI</button></th><th>Surveillance / piège</th></tr></thead><tbody><tr><td>Rydapt, midostaurine</td><td><button class="w" data-k="c92-classification">LAM</button> adulte nouvellement diagnostiquée <button class="w" data-k="c92-flt3">FLT3</button> mutée : 50 mg deux fois par jour avec nourriture, J8–21 de l’induction et de la consolidation ; entretien 50 mg deux fois par jour en cycles de 28 jours, jusqu’à douze mois.</td><td>Ne pas reprendre la dose de mastocytose. Vigilance pulmonaire, <button class="w" data-k="c92-interactions">QT</button> et interactions ; les inhibiteurs puissants du <button class="w" data-k="c92-interactions">CYP3A4</button> appellent alternative/monitorage selon <button class="w" data-k="c92-fi">FI</button>, sans réduction empirique universelle imposée. Éviter les inducteurs puissants.</td></tr><tr><td>Vanflyta, quizartinib</td><td><button class="w" data-k="c92-classification">LAM</button> adulte <button class="w" data-k="c92-flt3">FLT3</button>-ITD nouvellement diagnostiquée : 35,4 mg/j J8–21 de l’induction et J6–19 de la consolidation. Entretien 26,5 mg/j deux semaines, puis 53 mg/j si <button class="w" data-k="c92-interactions">QTcF</button> ≤ 450 ms et critères remplis, au maximum 36 cycles.</td><td>Ne pas commencer si <button class="w" data-k="c92-interactions">QTcF</button> > 450 ms. <button class="w" data-k="c92-interactions">QT</button>, potassium et magnésium sont centraux. La <button class="w" data-k="c92-fi">FI</button> suisse ne l’indique pas comme entretien après allogreffe. Les milligrammes indiqués ici sont ceux du principe actif dans la <button class="w" data-k="c92-fi">FI</button>.</td></tr><tr><td>Xospata, giltéritinib</td><td><button class="w" data-k="c92-classification">LAM</button> adulte <button class="w" data-k="c92-flt3">FLT3</button> mutée récidivante/réfractaire : 120 mg une fois par jour. Une réponse peut être tardive ; la <button class="w" data-k="c92-fi">FI</button> demande d’envisager six mois si absence de progression/toxicité imposant arrêt.</td><td>Surveiller ECG, biochimie et CPK ; différenciation, pancréatite et syndrome d’encéphalopathie postérieure réversible. Ce libellé n’est pas une indication générale de première ligne.</td></tr></tbody></table>
<p>Les réductions de quizartinib ne sont pas interchangeables. Avec un inhibiteur puissant du <button class="w" data-k="c92-interactions">CYP3A</button>, 35,4 mg devient 17,7 mg ; 26,5 mg devient 17,7 mg ; 53 mg devient 26,5 mg. Le tableau d’adaptation pour effet indésirable utilise d’autres paliers : recopier une colonne dans l’autre peut donc produire une erreur. Les ECG sont hebdomadaires pendant induction/consolidation, puis rapprochés au début de l’entretien et lors des augmentations. Les antécédents de torsades/arythmies ventriculaires, le <button class="w" data-k="c92-interactions">QT</button> congénital et les désordres électrolytiques graves font partie des contre-indications ou situations empêchant l’initiation prévues.</p>
<p>Pour giltéritinib, l’ECG est réalisé avant traitement, à J8 et J15 du premier cycle, puis avant les deux cycles suivants. Un <button class="w" data-k="c92-interactions">QTc</button> supérieur à 500 ms impose une suspension ; la reprise à 80 mg suit les critères de retour proche de la valeur initiale ou sous 480 ms. Une élévation de plus de 30 ms à J8 doit être confirmée à J9 et peut conduire à une réduction. Ces règles sont propres à Xospata. Un PRES confirmé impose l’arrêt, tandis que d’autres complications ont leur propre procédure de reprise.</p>
<p>Quizartinib n’est pas recommandé lorsque la clairance de créatinine est inférieure à 30 mL/min ou en insuffisance hépatique sévère dans la <button class="w" data-k="c92-fi">FI</button> consultée. Giltéritinib ne demande pas de réduction initiale rénale standard, mais une atteinte sévère exige surveillance ; les données hépatiques sévères manquent. Les contraceptions et délais après traitement diffèrent : par exemple quatre mois pour les femmes et les hommes sous midostaurine, six mois pour les femmes et quatre mois pour les hommes sous giltéritinib. Une discussion de fertilité et une vérification de la <button class="w" data-k="c92-fi">FI</button> exacte précèdent le traitement.</p>
<p><button class="w" data-k="c92-flt3">Mutation, phase de traitement et indication</button> · <button class="w" data-k="c92-interactions">Pourquoi un tableau d’interactions unique ne suffit pas</button></p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680663100014" target="_blank" rel="noopener">[S514] Rydapt / midostaurine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680672110011" target="_blank" rel="noopener">[S518] Xospata / giltéritinib</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a>.</p></div></section>
<section class="ilot" id="c92-p-5"><h2><span class="n">p-5</span> <button class="w" data-k="c92-bcr-abl">LMC</button> : inhiber <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>, puis mesurer la réponse</h2>
<p>La fusion <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> produit une tyrosine kinase dont l’activité dérègle la croissance cellulaire. L’imatinib et plusieurs autres <button class="w" data-k="c92-bcr-abl">TKI</button> occupent le site de liaison à l’ATP ; l’asciminib se lie à la poche myristoylique d’ABL1. Deux médicaments dirigés vers la même protéine peuvent donc différer par leurs interactions, mutations de résistance et contraintes de prise. Une association ou un changement ne se décide pas seulement sur le nom de la cible.</p>
<table class="t"><thead><tr><th>Produit / situation</th><th>Dose et prise de <button class="w" data-k="c92-fi">FI</button> suisse</th><th>Points de surveillance</th></tr></thead><tbody><tr><td>Glivec, imatinib : <button class="w" data-k="c92-bcr-abl">LMC</button> en phase chronique</td><td>400 mg une fois par jour avec repas et grand verre d’eau ; les phases avancées ont une dose usuelle de 600 mg/j dans la <button class="w" data-k="c92-fi">FI</button>.</td><td>Numération, foie, rétention hydrosodée et interactions. Les adaptations peuvent dépendre de la tolérance, de l’atteinte d’organe et du contexte de phase.</td></tr><tr><td>Imatinib chez l’enfant</td><td>340 mg/m²/j, maximum 600 mg/j, selon indication et arrondi de la <button class="w" data-k="c92-fi">FI</button> ; expérience insuffisante avant deux ans pour <button class="w" data-k="c92-bcr-abl">LMC</button>.</td><td>Croissance, tolérance et suivi spécialisé ; ne pas appliquer la dose adulte fixe.</td></tr><tr><td>Scemblix, asciminib : <button class="w" data-k="c92-bcr-abl">LMC</button> Ph+ phase chronique adulte</td><td>80 mg une fois par jour ou 40 mg deux fois par jour ; si mutation T315I, 200 mg deux fois par jour. Ne pas manger pendant les deux heures précédant et l’heure suivant la prise.</td><td>Numération toutes les deux semaines pendant trois mois puis mensuelle ; lipase/amylase mensuelles, pression artérielle, ECG/électrolytes selon risque et statut VHB avant traitement.</td></tr><tr><td>Asciminib : réduction pour toxicité</td><td>Dose réduite usuelle : 40 mg/j ou 20 mg deux fois par jour ; en T315I, 160 mg deux fois par jour. Arrêter si la dose réduite n’est pas tolérée selon les critères de la <button class="w" data-k="c92-fi">FI</button>.</td><td>Les adaptations concernent l’événement précis. Un effet pancréatique ou hématologique ne se gère pas en recopiant sans contexte la ligne d’un autre effet.</td></tr></tbody></table>
<p>La <button class="w" data-k="c92-fi">FI</button> Scemblix de septembre 2026 inclut la <button class="w" data-k="c92-bcr-abl">LMC</button> Ph+ en phase chronique de l’adulte, y compris nouvellement diagnostiquée. Ce statut suisse est daté : il ne doit être déduit ni d’une ancienne page, ni d’une autorisation américaine évoquée dans un article. L’<button class="w" data-k="c92-sources">ELN</button> 2025 compare les options en fonction de l’efficacité, des comorbidités, de la tolérance, du coût et du projet d’arrêt ultérieur. De meilleures réponses moléculaires précoces ne prouvent pas automatiquement un avantage de survie globale pour chaque comparaison.</p>
<p>La sélection tient compte des risques propres aux produits : atteintes pulmonaires pour dasatinib, facteurs cardiovasculaires ou diabète/pancréatite pour nilotinib, tolérance digestive et fonctions rénale/hépatique pour bosutinib. Ces repères européens orientent la discussion ; les doses de ces produits ne sont pas détaillées ici sans lecture de leur <button class="w" data-k="c92-fi">FI</button> suisse exacte. Une mutation T315I appelle des options spécifiques, dont ponatinib ou asciminib selon le contexte, tandis que certaines mutations de la poche myristoylique ou certains transcrits atypiques peuvent limiter l’asciminib.</p>
<p>Les interactions ne sont pas uniformes entre <button class="w" data-k="c92-bcr-abl">TKI</button>. La <button class="w" data-k="c92-fi">FI</button> asciminib demande de la prudence avec les inhibiteurs/inducteurs puissants du <button class="w" data-k="c92-interactions">CYP3A4</button>, sans imposer une réduction initiale automatique dans tous les cas. En revanche, elle décrit des interactions importantes avec les substrats : la warfarine demande une attention particulière, surtout à 200 mg deux fois par jour ; la rosuvastatine doit être évitée ou adaptée conformément à sa propre <button class="w" data-k="c92-fi">FI</button>. Une ordonnance complète, les produits sans ordonnance et les compléments doivent être revus.</p>
<p>La réponse se mesure par <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> sur l’échelle internationale, pas par la seule normalisation des leucocytes. La numération est rapprochée jusqu’à réponse hématologique ; la PCR est au moins trimestrielle jusqu’à confirmation de la réponse moléculaire majeure, puis généralement espacée à quatre à six mois si elle reste stable. Une hausse inattendue appelle vérification de l’observance, interactions, qualité du prélèvement, cinétique et éventuelle résistance avant de conclure à l’échec sur une valeur isolée.</p>
<p>La grossesse nécessite un projet discuté tôt. L’<button class="w" data-k="c92-sources">ELN</button> décrit des situations sélectionnées et des alternatives, mais chaque <button class="w" data-k="c92-fi">FI</button> conserve ses contre-indications et exigences de contraception. Les décisions peuvent différer selon parent exposé, terme, phase de maladie et profondeur de réponse. Un projet de grossesse ne justifie donc pas un arrêt spontané du <button class="w" data-k="c92-bcr-abl">TKI</button> ni une transposition générale d’un cas publié. <button class="w" data-k="c92-tfr">Quand un arrêt du TKI peut être discuté</button> · <button class="w" data-k="c92-cml-is">Comprendre les seuils de réponse</button></p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">[S519] FI suisse Glivec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></section>
<section class="ilot" id="c92-p-6"><h2><span class="n">p-6</span> Support, interactions et situations particulières</h2>
<p>Le traitement antileucémique ne suffit pas à sécuriser la prise en charge. Une infection, une hémorragie, une lyse tumorale ou une leucostase peuvent déterminer le pronostic immédiat. Les mesures de support sont individualisées selon maladie, traitement, numération, comorbidités et protocole local. Elles ne doivent pas être réduites à une liste ajoutée après l’ordonnance.</p>
<table class="t"><thead><tr><th>Situation</th><th>Logique de décision</th><th>Limite à ne pas franchir</th></tr></thead><tbody><tr><td>Hyperleucocytose et symptômes respiratoires/neurologiques</td><td>Suspecter une leucostase, organiser une évaluation urgente et une cytoréduction avec l’hématologie. La décision repose sur la clinique et le type cellulaire, pas sur un seuil isolé.</td><td>Une hyperleucocytose asymptomatique n’impose pas une leucaphérèse ; la <button class="w" data-k="c92-differenciation">LPA</button> appelle des précautions spécifiques et une éviction de cette procédure.</td></tr><tr><td>Risque de lyse tumorale</td><td>Évaluer charge tumorale, rein, urate, électrolytes et traitement prévu ; hydratation et traitement de l’hyperuricémie selon le risque, avec contrôles après exposition.</td><td>L’absence de réduction initiale rénale d’un médicament n’annule pas le risque de lyse. Une surcharge peut limiter l’hydratation et impose une stratégie individualisée.</td></tr><tr><td>Rasburicase, Fasturtec</td><td>La <button class="w" data-k="c92-fi">FI</button> suisse décrit 0,2 mg/kg/j IV sur 30 min, jusqu’à sept jours selon le besoin. Le produit dégrade l’urate déjà formé.</td><td>Déficit en G6PD contre-indiqué : risque d’hémolyse et méthémoglobinémie. Respecter les conditions préanalytiques spécifiques du dosage d’urate sous rasburicase ; une dégradation dans le tube peut abaisser artificiellement la mesure.</td></tr><tr><td>Fièvre en contexte neutropénique</td><td>Évaluation urgente, prélèvements et antibiothérapie empirique selon le protocole local sans retard inapproprié ; recherche de foyer et d’instabilité.</td><td>Ne pas attendre une réaction inflammatoire spectaculaire : l’immunodépression peut atténuer certains signes. Les choix dépendent de colonisations, antibiotiques antérieurs, allergies et fonction rénale.</td></tr><tr><td>Transfusion</td><td>Décider avec symptômes, contexte hémorragique, cardiopulmonaire et type de leucémie ; produits et prophylaxies adaptés à la filière.</td><td>Les objectifs de coagulation d’une <button class="w" data-k="c92-differenciation">LPA</button> ne sont pas les seuils d’une autre <button class="w" data-k="c92-classification">LAM</button> stable. En hyperleucocytose avec risque de leucostase, éviter une stratégie érythrocytaire libérale non discutée.</td></tr></tbody></table>
<p>L’hydroxyurée peut participer à la cytoréduction dans certaines situations, mais sa dose doit être choisie selon le produit suisse exact, l’objectif, la numération et la fonction rénale. Une posologie issue d’un consensus européen ne devient pas automatiquement celle de la <button class="w" data-k="c92-fi">FI</button> de Litalir. Dans un MDS/MPN avec neutrophilie, cytoréduction et traitement curatif sont également distincts : les données européennes retiennent l’allogreffe comme stratégie à potentiel curatif établi chez des patients sélectionnés, avec incertitudes sur le meilleur traitement préalable.</p>
<p>Le risque d’interaction doit être raisonné par médicament et mécanisme. Un azolé peut augmenter l’exposition de certains inhibiteurs de kinase ou du vénétoclax ; plusieurs antiémétiques et autres médicaments peuvent ajouter un risque de <button class="w" data-k="c92-interactions">QT</button> ; la fonction rénale, le potassium et le magnésium modifient encore ce risque. Une réduction appropriée pour un médicament peut être incorrecte pour un autre. La conciliation médicamenteuse est reprise au début d’un cycle, à toute nouvelle prescription et lors des transitions hôpital–domicile.</p>
<p>La nutrition, la fertilité, les vaccinations, la santé buccodentaire, la fatigue, le retentissement psychologique et l’aide sociale s’intègrent à la prise en charge. Les patients doivent disposer de consignes écrites : qui appeler, pour quels symptômes, comment prendre le traitement, que faire en cas d’oubli et pourquoi ne pas modifier seuls les doses. Une décision palliative ou un traitement de contrôle peut être cohérent avec les objectifs de la personne ; il ne supprime pas les soins de support.</p>
<p>Enfin, autorisation, disponibilité et remboursement décrivent trois réalités différentes. Le libellé Swissmedic d’une <button class="w" data-k="c92-fi">FI</button> ne prouve pas l’inscription ou la couverture de chaque situation par l’assurance. Les conditions de prise en charge usuelles ou exceptionnelles doivent être vérifiées au moment de la décision ; aucun accord de financement individuel n’est présumé dans cette leçon.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S522] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529580165" target="_blank" rel="noopener">[S523] FI suisse Litalir</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S524] Prise en chargede la neutropénie fébrile</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/NBK608332/" target="_blank" rel="noopener">[S509] EBMT Handbook, chapter76: Myelodysplastic/Myeloproliferative Neoplasms</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S536] OFSP, cas particuliers, art. 71a–d OAMal</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S535] OFSP, liste des spécialités</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-c92-pharma">▲
