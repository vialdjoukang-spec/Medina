<section class="ilot" id="e10-a01"><h2><span class="n">A01</span> Cas initial et objectifs</h2>
<h3 id="e10-a01-partie-1">Cas inaugural</h3>
<p><b>Cas entièrement fictif.</b> Camille, 24 ans, boit continuellement et se lève quatre fois par nuit pour uriner depuis deux semaines. Elle a perdu 5 kg malgré un appétit conservé. Depuis ce matin, elle vomit et respire profondément. Au cabinet, la glycémie capillaire est de 24 mmol/L, le pouls de 112/min et la pression artérielle de 96/62 mmHg. Ces données inventées servent à apprendre ; elles ne définissent ni une fréquence ni une norme.</p>
<p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p>
<h3 id="e10-a01-partie-2">Questions initiales</h3>
<p>Trois questions distinctes se posent d’emblée. L’hyperglycémie explique-t-elle la soif et les urines abondantes ? Quelle forme de diabète peut être à l’origine de cette carence métabolique ? Existe-t-il déjà une <button class="w" data-k="e10-a06-fenetre-1">acidocétose (critères et mécanismes)</button>, une déshydratation menaçante ou une autre urgence ? Chez Camille, les vomissements et la respiration profonde rendent la troisième question prioritaire : attendre les autoanticorps avant d’orienter la patiente lui ferait perdre des heures pendant lesquelles l’acidose peut s’aggraver.</p>
<p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<h3 id="e10-a01-partie-3">Objectifs</h3>
<p>Le médecin qui accueille Camille doit savoir confirmer une hyperglycémie avec un prélèvement contextualisé, proposer une classification sans réduire le type 1 à un âge, relier chaque symptôme au manque d’insuline et expliquer un schéma basal–prandial. Il doit aussi distinguer une hypoglycémie d’une acidocétose, lire un rapport de capteur, refaire un calcul prescrit et organiser le dépistage des complications. Ces compétences suivent l’ordre réel de la prise en charge : d’abord la sécurité, ensuite la classification, enfin l’autonomie de la personne.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p>
<h3 id="e10-a01-partie-4">Notions de départ</h3>
<p>La glycémie est une concentration de glucose dans le sang. L’insuline est une hormone sécrétée par les cellules β du pancréas ; elle coordonne l’utilisation et le stockage des nutriments et freine leur production par le foie. Une mesure élevée renseigne sur le résultat de ces flux. Elle ne mesure directement ni la quantité de cellules β ni leur destruction immunitaire.</p>
<p class="src">Sources : <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a>.</p>
<h3 id="e10-a01-partie-5">Frontières du cours</h3>
<p>Le cours concerne le diabète de type 1, principalement chez l’adulte. Il explique les adaptations qui imposent une équipe pédiatrique ou obstétricale, sans transposer aux enfants les débits d’un protocole d’adultes. Le diabète de type 2, les formes monogéniques, les maladies du pancréas et les hyperglycémies médicamenteuses restent des diagnostics concurrents ; une personne peut avoir besoin d’insuline avant que sa classification soit définitive.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p>
<h3 id="e10-a01-partie-6">Cas final</h3>
<p>Le cas sera repris après le bilan aigu : résolution de la cétose, choix de produits exacts, apprentissage des injections, gestion des repas, prévention des hypoglycémies et rendez-vous coordonnés. Aucune dose ne se déduit ici de son seul poids, car chaque information supplémentaire modifie la conduite. Le premier exercice demande donc de distinguer les examens urgents, qui déterminent le lieu de soins, de ceux qui peuvent attendre la stabilisation.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p>
<div class="key"><b>À retenir.</b> Le diagnostic de diabète, son type et sa gravité sont trois questions distinctes. Chez une personne qui vomit et respire profondément, le médecin recherche immédiatement la cétose et l’acidose, sans attendre les examens de classification, parce que la gravité décide du lieu de soins.</div>

<section class="ilot" id="e10-a02"><h2><span class="n">A02</span> Définition, classification et fréquence</h2>
<h3 id="e10-a02-partie-1">Définition du diabète de type 1</h3>
<p>Le diabète de type 1 correspond à une perte de fonction des cellules β, le plus souvent par auto-immunité, qui conduit à un déficit d’insuline nécessitant une substitution. La définition décrit le mécanisme ; le diagnostic de diabète décrit l’hyperglycémie ; l’acidocétose décrit une complication aiguë. Ces trois niveaux ne sont donc pas interchangeables. Les sources suisses lues pour ce chapitre couvrent le diagnostic biologique, les technologies, la conduite, le pied et les produits exacts ; <button class="w" data-k="e10-gl-3">NICE</button> NG17, recommandation britannique, comble les lacunes sur la classification et le suivi de l’adulte.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a>.</p>
<h3 id="e10-a02-partie-2">Présentations</h3>
<p>Le début peut être rapide avec amaigrissement et cétose, ou plus progressif chez un adulte gardant une sécrétion résiduelle. <button class="w" data-k="e10-gl-3">NICE</button> demande explicitement de ne pas exclure un type 1 sur l’âge ou l’indice de masse corporelle seuls. Une personne en surpoids peut avoir un diabète auto-immun ; un adulte mince peut avoir une autre forme. Le terme <button class="w" data-k="e10-gl-11">LADA</button> décrit une présentation auto-immune lente de l’adulte et ne dispense pas de vérifier le besoin actuel d’insuline.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p>
<h3 id="e10-a02-partie-3">Diagnostic différentiel de type</h3>
<p>Une installation rapide, une perte de poids et une cétose orientent vers une carence insulinique ; des <button class="w" data-k="e10-s04-fenetre-1">autoanticorps spécifiques (marqueur et portée)</button> soutiennent l’auto-immunité. Des antécédents familiaux sur plusieurs générations, l’absence d’autoanticorps et une sécrétion conservée peuvent faire discuter une forme monogénique. Une pancréatite, une chirurgie pancréatique ou un médicament hyperglycémiant modifient aussi le raisonnement. Chez l’adulte de 60 ans ou plus avec diabète récent et amaigrissement, <button class="w" data-k="e10-gl-3">NICE</button> demande de suivre la filière de recherche d’un cancer du pancréas.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p>
<h3 id="e10-a02-partie-4">Fréquence</h3>
<p><b>La statistique suisse disponible ne mesure pas la prévalence du type 1.</b> MonAM rapporte qu’en 2022, 6,2 % des personnes de 15 ans ou plus vivant dans un ménage privé déclaraient un diagnostic de diabète ou un traitement contre cette maladie. L’Enquête suisse sur la santé comportait environ 22 000 répondants. L’indicateur, mis à jour le 17 mars 2025, indique expressément qu’il ne permet pas de quantifier séparément les types 1 et 2. La proportion de personnes sous insuline ne constitue pas un substitut : certaines personnes ayant un type 2 en reçoivent.</p>
<p class="src">Sources : <a href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">OFSP / Obsan — Diabète (âge : 15+) — mise à jour 17 mars 2025, enquête 2022</a>.</p>
<h3 id="e10-a02-partie-5">Histoire naturelle</h3>
<p>L’auto-immunité peut précéder les symptômes ; la perte de fonction β et l’apparition de l’hyperglycémie ne surviennent pas à un rythme uniforme. Les autoanticorps sont des marqueurs de cette trajectoire, tandis que le peptide C renseigne sur la sécrétion restante. Après traitement initial, une amélioration transitoire des besoins ne prouve pas une guérison. L’incertitude de classification doit être réévaluée si l’évolution devient atypique ; on ne déduit pas un calendrier individuel d’un modèle de population.</p>
<p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p>
<h3 id="e10-a02-partie-6">Complications</h3>
<p>Les complications aiguës comprennent l’acidocétose, l’état hyperosmolaire et l’hypoglycémie liée au traitement ; un coma est un état clinique dont la cause reste à déterminer. Les atteintes chroniques touchent notamment le rein, la rétine, les nerfs et les artères périphériques. Elles peuvent être isolées, multiples, associées à un pied diabétique ou absentes au bilan. Une complication seulement mentionnée comme « non précisée » appelle une caractérisation clinique, et non une supposition sur l’organe atteint.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p>
<div class="key"><b>À retenir.</b> Le phénotype oriente, les examens précisent et l’évolution peut faire réviser la classification. Une statistique suisse qui réunit tous les diabètes ne mesure pas la fréquence du type 1.</div>

<section class="ilot" id="e10-a03"><h2><span class="n">A03</span> Mécanismes et symptômes</h2>
<h3 id="e10-a03-partie-1">Métabolisme normal</h3>
<p>Après un repas, l’augmentation du glucose stimule la sécrétion d’insuline. Le muscle et le tissu adipeux augmentent leur captation du glucose ; le foie favorise le stockage et freine sa production. Entre les repas, la production hépatique fournit du glucose aux tissus, mais une sécrétion basale d’insuline limite l’emballement de la production de glucose et de cétones. Le glucagon participe à la mobilisation hépatique des réserves ; son action ne doit pas être assimilée à une inhibition universelle de l’entrée du glucose dans toutes les cellules.</p>
<p class="src">Sources : <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a>.</p>
<h3 id="e10-a03-partie-2">Mécanismes du type 1</h3>
<p>Dans le type 1 auto-immun, des lymphocytes reconnaissent des constituants des cellules β. La destruction et le dysfonctionnement qui en résultent diminuent la sécrétion d’insuline. Les lymphocytes B peuvent présenter des antigènes aux lymphocytes T et produire des autoanticorps ; les lymphocytes T cytotoxiques participent à la destruction cellulaire. Les mécanismes étudiés chez la souris et chez l’humain ne permettent pas de calculer la masse β restante chez un patient à partir d’un taux d’anticorps.</p>
<p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a>.</p>
<h3 id="e10-a03-partie-3">Manifestations</h3>
<p>Lorsque la glycémie dépasse les capacités de réabsorption rénale, le glucose reste dans l’urine et y retient de l’eau : cette diurèse osmotique explique polyurie, déshydratation et soif. Le défaut d’utilisation et de stockage des nutriments, associé à leur mobilisation, contribue à l’amaigrissement. Si la production hépatique de cétones dépasse leur utilisation et leur élimination, l’acidose provoque une compensation respiratoire profonde ; nausées et douleurs abdominales peuvent accompagner la décompensation.</p>
<p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Tran et al. — Review of Evidence for Adult DKA Management Protocols — 2017</a>.</p>
<figure><img src="assets/img/cycle2/e10/e10-01-glucose.jpg" alt="Homéostasie du glucose : flux entre intestin, foie, rein et tissus, et signaux des cellules α et β." loading="lazy"><figcaption>Figure 1 — Exemple publié de physiologie normale. Les flèches noires représentent les flux de glucose ; les couleurs représentent les signaux hormonaux. « Insulin-dependent tissues » : tissus sensibles à l’insuline ; « insulin-independent tissues » : tissus dont la captation représentée ne dépend pas du signal insulinique. La figure ne représente que l’état normal ; les perturbations du type 1 sont expliquées dans le texte voisin.<br>Crédit : Andrea Mari, Andrea Tura, Eleonora Grespan et Roberto Bizzotto (2020). <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Publication originale</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. <a href="assets/img/cycle2/e10/e10-01-glucose.jpg" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a>.</figcaption></figure>
<h3 id="e10-a03-partie-4">Classification et mécanisme</h3>
<p>La chaîne causale explique les signes mais ne remplace pas les critères. Une respiration profonde n’est pas une mesure du pH ; une haleine évocatrice ne quantifie pas les cétones ; la soif ne prouve pas le type 1. Il faut mesurer glucose, β-hydroxybutyrate et équilibre acido-basique pour caractériser une acidocétose, puis rechercher des arguments immunologiques lorsque la sécurité immédiate est assurée.</p>
<p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<h3 id="e10-a03-partie-5">Facteurs associés</h3>
<p>La susceptibilité génétique et les facteurs environnementaux participent au risque auto-immun. Cependant, association et cause individuelle sont différentes : un épisode infectieux peut précéder le diagnostic ou précipiter une décompensation sans démontrer qu’il a provoqué l’auto-immunité. Les revues décrivent plusieurs mécanismes et modèles expérimentaux. Le conseil clinique évite donc d’attribuer la maladie à un aliment, une émotion ou une infection précise sans preuve propre au cas.</p>
<p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a>.</p>
<h3 id="e10-a03-partie-6">Chaîne explicative</h3>
<p>Exemple de chaîne complète : manque d’insuline → lipolyse adipocytaire accrue → arrivée d’acides gras au foie → β-oxydation et production d’<button class="w" data-k="e10-gl-33">acétyl-CoA</button> → synthèse de corps cétoniques → acidose → augmentation de la ventilation. L’examen sanguin du β-hydroxybutyrate renseigne sur la cétose ; le pH et les bicarbonates renseignent sur son retentissement acido-basique. Ces deux mesures répondent donc à deux questions complémentaires.</p>
<p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<div class="key"><b>À retenir.</b> Chaque symptôme correspond à un flux : le glucose urinaire entraîne la perte d’eau, la lipolyse alimente les cétones et l’acidose stimule la ventilation. Le médecin mesure ensuite la perturbation au lieu de la supposer.</div>

<section class="ilot" id="e10-a04"><h2><span class="n">A04</span> Anamnèse, examen et diagnostic</h2>
<h3 id="e10-a04-partie-1">Anamnèse</h3>
<p>Le médecin précise le début de la soif, de la polyurie, de la nycturie, de l’amaigrissement, de la fatigue, de la vision floue et des infections récentes. Il recherche des vomissements, une douleur abdominale et une impossibilité de boire, car ces signes annoncent une décompensation. Il documente ensuite les maladies auto-immunes personnelles ou familiales, les maladies pancréatiques, les médicaments et une éventuelle grossesse, qui orientent la classification et la filière. Chez une personne déjà traitée, il demande le produit, la dernière dose, les interruptions de pompe et les réserves de matériel, sans transformer l’entretien en accusation de mauvaise observance.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<h3 id="e10-a04-partie-2">Examen</h3>
<p>L’examen commence par la conscience, la respiration, la perfusion et l’hydratation : fréquence respiratoire, pouls, pression artérielle, température, saturation et signes de déshydratation. Une tachypnée profonde, une hypotension ou une altération de conscience modifient immédiatement le lieu de soins. Le médecin recherche ensuite un foyer infectieux, des signes cardiaques ou neurologiques et une cause abdominale, car ces affections peuvent avoir déclenché la crise. Le poids et l’examen des sites d’injection complètent le bilan lorsque l’urgence le permet.</p>
<p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<h3 id="e10-a04-partie-3">Mesures</h3>
<p>Le prélèvement diagnostique de référence mesure le glucose plasmatique veineux en mmol/L ; l’heure et l’état de jeûne doivent être connus. À titre d’intervalle de laboratoire suisse, Viollier affiche 3,3–5,5 mmol/L pour les 16–99 ans dans son catalogue du glucose. Cet intervalle doit être lu avec les conditions préanalytiques du laboratoire et ne constitue ni le seuil diagnostique de diabète ni une cible universelle sous insuline. Un capteur mesure le glucose interstitiel et ne remplace pas cette caractérisation.</p>
<p class="src">Sources : <a href="https://www.viollier.ch/fr/analysis/7380" target="_blank" rel="noopener">Viollier — catalogue glucose — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p>
<h3 id="e10-a04-partie-4">Diagnostic</h3>
<p>La prise de position suisse retient trois seuils plasmatiques : glycémie à jeun ≥ 7,0 mmol/L, glycémie à deux heures d’une charge orale de 75 g ≥ 11,1 mmol/L, ou glycémie aléatoire ≥ 11,1 mmol/L avec symptômes typiques. Ce document ne détaille pas la répétition d’un résultat isolé ; chez une personne asymptomatique, le médecin contrôle donc les conditions du prélèvement avant d’étiqueter la maladie. Devant une présentation aiguë évocatrice de type 1, il n’organise ni charge orale ni attente de l’<button class="w" data-k="e10-gl-1">HbA1c</button>, car la position <button class="w" data-k="e10-gl-2">SSED</button> précise que ce marqueur ne convient pas au diagnostic du type 1.</p>
<p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a>.</p>
<h3 id="e10-a04-partie-5">Classification</h3>
<p><button class="w" data-k="e10-gl-3">NICE</button> recommande deux autoanticorps spécifiques différents au diagnostic d’un type 1 adulte suspecté, parce que le taux de faux négatifs est le plus bas à ce moment et diminue encore avec deux marqueurs. Le <button class="w" data-k="e10-e01-fenetre-2">peptide C (utilité et limites)</button> n’est pas systématique pour confirmer une présentation typique. Si les anticorps sont négatifs et que le type reste incertain, un peptide C non à jeun, interprété avec une glycémie simultanée et le contexte rénal, peut aider ; sa valeur discriminante augmente avec le temps écoulé depuis le diagnostic. Aucun résultat ne doit retarder la correction d’une carence insulinique menaçante.</p><p><b>Raisonnement de l’examen fédéral : hyperglycémie avec soif, polyurie ou amaigrissement.</b> Le médecin classe les hypothèses d’abord par gravité, puis par fréquence. Le tableau suivant donne, pour chacune, l’élément qui la distingue et l’examen qui tranche.</p><table class="t"><tr><th>Rang</th><th>Hypothèse</th><th>Élément discriminant</th><th>Examen décisif</th></tr><tr><td>1</td><td>Acidocétose, urgence vitale</td><td>Vomissements, respiration profonde, altération de l’état général ; toute glycémie &gt; 11 mmol/L avec symptômes systémiques est une urgence jusqu’à preuve du contraire selon la fiche suisse.</td><td>Cétonémie et gazométrie veineuse (pH, bicarbonates).</td></tr><tr><td>2</td><td>État hyperosmolaire ou forme mixte</td><td>Hypovolémie marquée, troubles neurologiques, installation plus lente.</td><td>Glucose, habituellement ≥ 30 mmol/L, et osmolalité ≥ 320 <button class="w" data-k="e10-gl-28">mOsm</button>/kg sans cétonémie importante.</td></tr><tr><td>3</td><td>Diabète révélant une maladie pancréatique, dont un cancer</td><td>Âge de 60 ans ou plus, amaigrissement, diabète nouveau.</td><td>Filière de suspicion de cancer pancréatique.</td></tr><tr><td>4</td><td>Type 1 sans décompensation</td><td>Cétose, perte de poids rapide, début avant 50 ans, indice de masse corporelle &lt; 25 kg/m², auto-immunité personnelle ou familiale ; aucun critère isolé ne suffit.</td><td>Deux autoanticorps spécifiques au diagnostic.</td></tr><tr><td>5</td><td>Type 2</td><td>Absence de cétose, autoanticorps négatifs, évolution sans carence rapide.</td><td>Réévaluation clinique ; peptide C non à jeun apparié à une glycémie si le doute persiste.</td></tr><tr><td>6</td><td>Autres sous-types : monogénique, pancréatique, médicamenteux</td><td>Histoire familiale sur plusieurs générations, antécédent pancréatique, médicament hyperglycémiant.</td><td>Avis spécialisé ; peptide C répété lors des revues.</td></tr></table><p>La lecture commence toujours par la première ligne, qui se vérifie en quelques minutes. Chez Camille, vomissements et respiration profonde orientent vers l’acidocétose ; la cétonémie et le pH tranchent avant toute discussion de classification. L’erreur fréquente consiste à commencer par les anticorps, qui ne changent ni le lieu de soins ni les premières heures de traitement.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a>.</p>
<h3 id="e10-a04-partie-6">Recours spécialisé</h3>
<p>Une suspicion de décompensation avec altération générale justifie une orientation urgente ; le parcours suisse <button class="w" data-k="e10-gl-30">RMS</button> indique le 144 si l’état le nécessite. Le médecin transmet les symptômes, les paramètres vitaux, le glucose, les cétones, les traitements et l’heure des dernières doses, car l’équipe d’accueil en a besoin pour choisir le premier traitement. Une suspicion de type 1 sans détresse nécessite aussi une évaluation spécialisée rapide pour organiser l’insuline et l’apprentissage. Après crise, la fiche suisse prévoit un contact spécialisé dans les une à deux semaines ; ce rendez-vous ne remplace pas la coordination avant la sortie.</p>
<p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p>
<div class="key"><b>À retenir.</b> Le diagnostic repose sur un prélèvement adapté à la question posée. L’urgence se traite d’abord ; la classification immunologique vient ensuite et ne retarde jamais l’insuline nécessaire.</div>

<section class="ilot" id="e10-a05"><h2><span class="n">A05</span> Stratégie d’insuline et éducation initiale</h2>
<h3 id="e10-a05-partie-1">Objectifs individualisés</h3>
<p>Le plan vise à éviter les symptômes et les crises, limiter les complications et rendre le traitement compatible avec la vie réelle. Le bénéfice d’une glycémie plus proche de la cible doit être mis en balance avec les hypoglycémies, la charge mentale, les capacités de la personne et ses préférences. Les objectifs du capteur et de l’<button class="w" data-k="e10-gl-1">HbA1c</button> sont discutés ensemble ; une valeur moyenne favorable ne compense pas des hypoglycémies sévères répétées.</p>
<p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p>
<h3 id="e10-a05-partie-2">Composantes de l’insulinothérapie</h3>
<p>L’insuline basale couvre les besoins entre les repas et pendant la nuit ; les bolus couvrent les glucides des repas et, selon le plan prescrit, corrigent une hyperglycémie. Avec plusieurs injections, ces fonctions utilisent généralement une insuline prolongée et une rapide. Avec une pompe, une insuline rapide assure les deux fonctions par débit de fond et bolus. Une interruption de débit supprime donc rapidement la couverture basale de la pompe.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p>
<h3 id="e10-a05-partie-3">Modalités</h3>
<p>Deux produits suisses servent d’exemples dans l’onglet pharmacologique : NovoRapid FlexPen ou Penfill, insuline aspart 100 U/mL, et Tresiba, insuline dégludec en présentations distinctes ; leurs <button class="w" data-k="e10-p01-fenetre-1">informations professionnelles (synthèse par produit)</button> fixent les voies et les populations autorisées. Le choix du stylo, de la cartouche et d’un éventuel système automatisé dépend des capacités, des préférences et des compatibilités documentées. La <button class="w" data-k="e10-gl-2">SSED</button> 2025 recommande de proposer les systèmes automatisés à toutes les personnes de type 1 ; cela ne dispense ni de l’apprentissage ni de la vérification séparée de la prise en charge par l’assurance.</p>
<p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p>
<h3 id="e10-a05-partie-4">Éducation</h3>
<p>L’éducation initiale doit permettre de mesurer, d’injecter, de reconnaître une hypoglycémie, de disposer d’un secours, de surveiller les cétones en cas de maladie et de joindre l’équipe. La personne apprend ensuite à relier quantité de glucides, activité, dose et résultat. La démonstration puis la reformulation par la personne vérifient une compétence réelle. Une éducation structurée complète se poursuit après le diagnostic ; <button class="w" data-k="e10-gl-3">NICE</button> la propose six à douze mois après le diagnostic, sans retarder les compétences vitales initiales.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p>
<h3 id="e10-a05-partie-5">Calculs</h3>
<p><b>Exemple fictif à paramètres déjà prescrits.</b> Un rapport de 1 U pour 10 g signifie que 60 g de glucides correspondent à 60 g ÷ 10 g/U = 6 U. Si le facteur de correction prescrit vaut 2 mmol/L par U, avec glycémie de 12 mmol/L et objectif de 6 mmol/L, le quotient (12−6) ÷ 2 donne 3 U. Le total arithmétique serait 9 U avant prise en compte de l’insuline encore active, de l’activité, de la tendance et de l’arrondi possible du dispositif. Ces paramètres sont inventés pour l’exercice, pas calculés à partir d’une règle universelle.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p>
<h3 id="e10-a05-partie-6">Organisation des soins</h3>
<p>Le suivi associe médecin de premier recours, diabétologue, infirmier ou infirmière d’éducation et diététicien ou diététicienne, avec les autres spécialistes selon les besoins. Avant l’autonomie, l’équipe vérifie l’identification du produit, le réglage de dose, l’injection, le contrôle du matériel et les conduites de secours. Le plan écrit précise aussi qui contacter, comment gérer une panne et quand revoir les rapports. Les adaptations relèvent d’un apprentissage prescrit et réévalué, et non de l’application isolée d’une formule.</p>
<p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p>
<div class="key"><b>À retenir.</b> La fonction basale couvre les besoins hors repas ; la fonction prandiale couvre les repas et corrige l’hyperglycémie. La personne adapte ensuite des paramètres prescrits, car l’arithmétique ne remplace jamais le contexte clinique.</div>

<section class="ilot" id="e10-a06"><h2><span class="n">A06</span> Décompensations et états avec coma</h2>
<h3 id="e10-a06-partie-1">Décompensations</h3>
<p>Une infection, une dose omise, une panne de pompe, une maladie aiguë ou des difficultés d’accès au traitement peuvent précipiter une décompensation. Le médecin recherche aussi une pneumonie, un infarctus, un sepsis, un accident neurologique ou une affection abdominale selon les symptômes, car ces affections déclenchent la crise et figurent parmi ses causes de décès chez l’adulte. L’hyperglycémie seule ne mesure pas la gravité : une acidocétose peut exister avec une glycémie peu élevée chez une personne déjà partiellement traitée. La fiche suisse <button class="w" data-k="e10-gl-30">RMS</button> considère toute glycémie &gt; 11 mmol/L accompagnée de symptômes systémiques comme une urgence hyperglycémique jusqu’à preuve du contraire, et place en premier l’état général, l’hydratation et la conscience.</p>
<p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<h3 id="e10-a06-partie-2">Acidocétose</h3>
<p>Le référentiel britannique <button class="w" data-k="e10-gl-4">JBDS</button> de mars 2023 exige trois composantes : glucose > 11 mmol/L <b>ou diabète connu</b> ; cétones sanguines > 3 mmol/L ou cétonurie au moins 2+ ; pH veineux < 7,3 et/ou bicarbonates < 15 mmol/L. Il ne classe pas simplement en trois grades : il fournit des marqueurs de gravité appelant une surveillance renforcée, dont cétones > 6, bicarbonates < 5 mmol/L, pH < 7,0, potassium < 3,5 mmol/L, Glasgow < 12, pression systolique < 90 mmHg ou saturation < 92 % en air ambiant si la fonction respiratoire de base est normale.</p>
<p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<h3 id="e10-a06-partie-3">Tableaux avec coma</h3>
<p>Un coma n’est pas synonyme d’acidocétose. Le médecin mesure immédiatement le glucose pour rechercher une hypoglycémie, puis recherche acidose et cétose, hyperosmolalité, hypoxie, infection, intoxication ou lésion neurologique. Le <button class="w" data-k="e10-gl-4">JBDS</button> décrit l’état hyperosmolaire par une hypovolémie marquée, un glucose habituellement ≥ 30 mmol/L et une osmolalité ≥ 320 <button class="w" data-k="e10-gl-28">mOsm</button>/kg, sans cétonémie importante (≤ 3,0 mmol/L), avec un pH &gt; 7,3 et des bicarbonates ≥ 15 mmol/L. Il traite comme forme mixte la personne qui associe hypovolémie marquée, osmolalité ≥ 320 mOsm/kg, pH &lt; 7,3, bicarbonates &lt; 15 mmol/L et cétones &gt; 3,0 mmol/L ; celle-ci suit alors le parcours de l’acidocétose.</p><p><b>Raisonnement de l’examen fédéral : trouble de conscience chez une personne diabétique.</b> Les hypothèses se classent par gravité immédiate et par rapidité de correction. Le tableau précise l’élément discriminant et l’examen décisif de chacune.</p><table class="t"><tr><th>Rang</th><th>Hypothèse</th><th>Élément discriminant</th><th>Examen décisif</th></tr><tr><td>1</td><td>Hypoglycémie sévère</td><td>Insuline récente ou repas manqué ; sueurs et tremblements possibles, mais parfois absents.</td><td>Glucose capillaire immédiat ; amélioration après apport de glucose.</td></tr><tr><td>2</td><td>Acidocétose</td><td>Vomissements, respiration profonde, déshydratation.</td><td>Cétonémie et pH veineux.</td></tr><tr><td>3</td><td>État hyperosmolaire ou forme mixte</td><td>Hypovolémie marquée, installation sur plusieurs jours, signes neurologiques.</td><td>Glucose et osmolalité ; cétones et pH pour reconnaître la forme mixte.</td></tr><tr><td>4</td><td>Événement vasculaire déclencheur ou compliquant</td><td>Déficit focal, douleur thoracique ; ces événements sont plus fréquents dans l’état hyperosmolaire.</td><td>Imagerie cérébrale urgente si le score de Glasgow baisse ; électrocardiogramme.</td></tr><tr><td>5</td><td>Sepsis ou infection déclenchante</td><td>Fièvre, foyer clinique, hypotension.</td><td>Hémocultures et bilan du foyer.</td></tr></table><p>La première ligne se teste en une minute et se corrige immédiatement : c’est pourquoi elle précède toutes les autres. Une glycémie élevée n’exclut ensuite ni un accident vasculaire ni un sepsis ; à l’inverse, une acidocétose peut exister sans coma et un coma hypoglycémique sans acidocétose.</p>
<p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p>
<h3 id="e10-a06-partie-4">Parcours urgent</h3>
<p><b>Parcours suisse réellement lu.</b> La fiche <button class="w" data-k="e10-gl-30">RMS</button> 2019 du programme cantonal vaudois demande d’évaluer la gravité devant l’hyperglycémie symptomatique, de rechercher la déshydratation et les troubles de conscience, et d’appeler le 144 si l’état général est altéré. En ambulatoire, elle recommande de poser une voie veineuse, d’initier la réhydratation, idéalement par chlorure de sodium, puis de corriger la glycémie par un bolus d’insuline rapide seulement si le médecin en a les compétences. Son tableau diagnostique plus ancien n’est pas fusionné avec celui du <button class="w" data-k="e10-gl-4">JBDS</button> : les critères biochimiques détaillés de l’adulte proviennent du protocole britannique de 2023, tandis que l’orientation locale suit le texte suisse.</p>
<p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p>
<figure><img src="assets/img/cycle2/e10/e10-02-emergency.jpg" alt="Chaîne physiopathologique publiée de l’acidocétose : déficit insulinique, lipolyse, cétogenèse, diurèse et déshydratation." loading="lazy"><figcaption>Figure 2 — Exemple publié de mécanisme de crise, et non algorithme thérapeutique suisse. À gauche, « lipolysis » et « ketogenesis » relient lipolyse et cétones ; à droite, « osmotic diuresis » et « dehydration » relient glucose urinaire et perte d’eau. La figure ne contient aucune branche de traitement : remplissage, potassium, critères de réponse et relais sont exposés dans les deux tableaux de la sous-partie suivante, construits à partir du texte JBDS, avec l’orientation suisse RMS. Le corrigendum vérifié porte seulement sur le nom d’une autrice.<br>Crédit : Tara T. T. Tran, Anthony Pease, Anna J. Wood, Jeffrey D. Zajac, Johan Mårtensson, Rinaldo Bellomo et Elif I. Ekinci (2017). <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Publication originale</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. <a href="assets/img/cycle2/e10/e10-02-emergency.jpg" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a>.</figcaption></figure>
<h3 id="e10-a06-partie-5">Traitement et surveillance</h3>
<p>À l’hôpital, le traitement coordonne remplissage, insuline, potassium et cause déclenchante. Le <button class="w" data-k="e10-gl-4">JBDS</button> 2023 décrit un protocole britannique pour l’adulte ; l’équipe suisse applique son protocole hospitalier, mais les raisons physiologiques de chaque étape restent identiques.</p><p><b>Remplissage.</b> Si la pression systolique est inférieure à 90 mmHg, le JBDS administre 500 mL de chlorure de sodium à 0,9 % en 10 à 15 minutes, répétables en attendant l’avis senior. Au-dessus de 90 mmHg, son schéma illustratif pour un adulte de 70 kg auparavant en bonne santé prévoit 1 L la première heure, puis 1 L en 2 heures, 1 L en 2 heures, 1 L en 4 heures, 1 L en 4 heures et 1 L en 6 heures, avec une réévaluation cardiovasculaire obligatoire à 12 heures. Le remplissage est plus prudent chez l’adulte de 18 à 25 ans, la personne âgée, la femme enceinte et en cas d’insuffisance cardiaque ou rénale, situations qui justifient une unité de soins intermédiaires. La diurèse doit rester d’au moins 0,5 mL/kg/h.</p><p><b>Insuline.</b> Le débit fixe initial de 0,1 U/kg/h est décrit pour l’insuline soluble humaine du protocole britannique et ne constitue pas une posologie suisse interchangeable entre produits. La <button class="w" data-k="e10-gl-5">FI</button> suisse autorise NovoRapid par voie intraveineuse, administré par un professionnel avec surveillance étroite du glucose et du potassium ; elle précise que des solutions de chlorure de sodium à 0,9 % ou de glucose à 5 % ou 10 % contenant 40 mmol/L de chlorure de potassium et 0,05 à 1,0 U/mL d’insuline restent stables 24 heures. Le JBDS poursuit l’insuline basale prolongée habituelle à la dose et à l’heure usuelles ; chez une personne au diagnostic inaugural, il ajoute une basale de 0,25 U/kg une fois par jour pour prévenir la reprise de la cétose à l’arrêt de la perfusion. Quand le glucose passe sous 14 mmol/L, le glucose à 10 % à 125 mL/h permet de poursuivre l’insuline nécessaire à la cétose, et le JBDS envisage de réduire le débit à 0,05 U/kg/h.</p><p><b>Potassium.</b> L’acidose et le manque d’insuline font sortir le potassium des cellules : la kaliémie d’admission est souvent normale ou élevée alors que le stock corporel est diminué par les pertes urinaires. L’insuline fait ensuite rentrer le potassium dans les cellules ; dans l’enquête britannique citée par le JBDS, 67,1 % des patients avaient une kaliémie &lt; 4,0 mmol/L à 24 heures. Le tableau suivant donne la règle de remplacement du JBDS et sa raison.</p><table class="t"><tr><th>Kaliémie dans les 24 premières heures</th><th>Potassium ajouté par litre de perfusion</th><th>Raison</th></tr><tr><td>&gt; 5,5 mmol/L</td><td>Aucun</td><td>Le potassium extracellulaire est déjà élevé ; l’insuline va le faire baisser, et un ajout exposerait à une hyperkaliémie.</td></tr><tr><td>3,5–5,5 mmol/L</td><td>40 mmol, à condition que la personne urine</td><td>Le stock est déficitaire et la kaliémie va baisser sous insuline ; la diurèse permet d’éliminer un éventuel excès.</td></tr><tr><td>&lt; 3,5 mmol/L</td><td>Avis senior : un apport supplémentaire est nécessaire</td><td>L’hypokaliémie expose à des arythmies ventriculaires et à une paralysie respiratoire ; une perfusion plus concentrée suit des règles locales strictes.</td></tr></table><p>La première ligne mérite une attention particulière : une kaliémie élevée à l’admission ne dispense pas de surveiller, car elle chute rapidement sous insuline. Si la kaliémie sort de 4,0–5,5 mmol/L pendant le traitement, le JBDS la contrôle chaque heure et demande un avis senior immédiat si l’anomalie persiste une heure de plus.</p><p><b>Réponse au traitement.</b> Le JBDS évalue chaque heure la vitesse de correction, et non seulement le niveau atteint. Le tableau suivant indique le critère utilisé selon la mesure disponible.</p><table class="t"><tr><th>Mesure</th><th>Objectif horaire</th><th>Si l’objectif n’est pas atteint</th></tr><tr><td>Cétones sanguines (référence)</td><td>Baisse ≥ 0,5 mmol/L/h</td><td>L’équipe vérifie la pompe, la ligne et le volume restant, puis le prescripteur augmente le débit d’insuline de 1 U/h chaque heure jusqu’à l’objectif.</td></tr><tr><td>Bicarbonates veineux, si les cétones ne sont pas mesurables</td><td>Hausse ≥ 3,0 mmol/L/h</td><td>Même conduite.</td></tr><tr><td>Glucose plasmatique, à défaut</td><td>Baisse ≥ 3,0 mmol/L/h</td><td>Même conduite ; la résolution de l’acidose se vérifie ensuite par gaz veineux, car le glucose ne la prouve pas.</td></tr></table><p><button class="w" data-k="e10-a06-potassium">Exemple fictif : vitesse de baisse des cétones (calcul et conduite)</button>. Le glucose et les cétones sont contrôlés chaque heure ; pH, bicarbonates et potassium à une heure, deux heures, puis toutes les deux heures. Dans la plupart des cas, la cétonémie et l’acidose ont disparu à 24 heures ; sinon, un avis senior est demandé.</p>
<p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p>
<h3 id="e10-a06-partie-6">Après l’épisode</h3>
<p>La résolution repose sur des cétones &lt; 0,6 mmol/L <b>et</b> un pH veineux &gt; 7,3 ; des bicarbonates encore bas peuvent refléter une acidose hyperchlorémique due aux grands volumes de chlorure de sodium. Le relais sous-cutané se fait lorsque la personne mange et boit : selon le <button class="w" data-k="e10-gl-4">JBDS</button>, l’insuline rapide sous-cutanée est donnée avec un repas et la perfusion arrêtée 30 à 60 minutes plus tard, de sorte qu’aucun intervalle ne reste sans insuline. Avant la sortie, l’équipe analyse le déclencheur, vérifie le matériel et l’accès au traitement, enseigne le plan de maladie et de panne, puis organise le suivi : la fiche <button class="w" data-k="e10-gl-30">RMS</button> prévoit une consultation spécialisée une à deux semaines après l’épisode chez la personne de type 1. Chez Camille, cet entretien est aussi indispensable que la normalisation des chiffres.</p>
<p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p>
<div class="alert"><b>Point de sécurité.</b> L’urgence clinique passe avant tout ; glucose, cétones et pH caractérisent ensuite la crise. Le traitement de la cétose continue même lorsque le glucose baisse, avec un apport glucosé et une surveillance rapprochée du potassium, car une kaliémie normale à l’admission masque un déficit du stock corporel.</div>
