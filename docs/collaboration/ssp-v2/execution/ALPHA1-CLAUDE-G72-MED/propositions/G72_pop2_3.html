<template data-pop="g72-sm-faiblesse" data-title="Faiblesse vraie">
<div class="lab">Définition</div><p>La faiblesse est une perte de force mesurable ; la fatigue est une impression d’épuisement sans perte de force. Leur séparation est la première étape du bilan [S29].</p>
<div class="lab">Technique</div><p>Le médecin cote douze groupes musculaires (score MRC) et mesure la préhension au dynamomètre chez un patient coopérant [S18 ; S19].</p>
<div class="lab">Valeur et piège</div><p>Un score inférieur à 48 définit la faiblesse acquise en réanimation sans en donner la cause [S18]. La valeur diagnostique du testing n’est pas chiffrée dans les sources lues.</p></template>
<template data-pop="g72-sm-myalgie" data-title="Myalgie sous statine">
<div class="lab">Définition</div><p>Douleur, raideur, sensibilité ou crampe musculaire attribuée à la statine, habituellement symétrique et proximale [S16].</p>
<div class="lab">Valeur</div><p>7 à 29 % en registres ; 9,4 % contre 4,6 % sous placebo dans STOMP (P = 0,054) [S16]. Dans 19 essais en aveugle (123 940 participants), l’excès est de 11 événements pour 1000 personnes-années la première année : une plainte sur quinze seulement est due à la statine [S24].</p>
<div class="lab">Piège</div><p>Arrêter la statine sur ce seul symptôme prive le patient d’un bénéfice cardiovasculaire démontré [S24].</p></template>
<template data-pop="g72-sm-urines" data-title="Urines foncées (myoglobinurie)">
<div class="lab">Mécanisme</div><p>La myoglobine libérée par les fibres détruites passe dans l’urine ; l’information professionnelle suisse de l’atorvastatine décrit une insuffisance rénale aiguë consécutive à une myoglobinurie [S1].</p>
<div class="lab">Conduite</div><p>Une douleur sévère avec signes de myoglobinurie, ou une créatine kinase supérieure à 40 fois la limite, impose un bilan rénal (analyse d’urine, créatinine) [S16].</p>
<div class="lab">Limite</div><p>La valeur diagnostique de ce signe n’est pas chiffrée dans les sources lues.</p></template>
<template data-pop="g72-sm-acces" data-title="Accès de faiblesse">
<div class="lab">Mécanisme</div><p>Une dépolarisation soutenue du sarcolemme inactive les canaux sodiques ; la fibre devient inexcitable et la paralysie est flasque [S17].</p>
<div class="lab">Caractérisation</div><p>Forme hypokaliémique : premier accès entre 5 et 35 ans, accès de plus de 2 heures. Forme hyperkaliémique : début avant 20 ans, accès de moins de 2 heures, raideur myotonique entre les accès chez environ la moitié des patients [S17].</p>
<div class="lab">Piège</div><p>Des troubles sensitifs ou une altération de la conscience orientent vers une autre cause ; des réflexes conservés dans un membre paralysé doivent aussi faire évoquer une autre cause, sans écarter à eux seuls la paralysie périodique [S17].</p></template>
<template data-pop="g72-sm-ici" data-title="Ptosis et diplopie sous immunothérapie">
<div class="lab">Mécanisme</div><p>La toxicité immunitaire des inhibiteurs de point de contrôle peut toucher ensemble le muscle, la jonction neuromusculaire et le myocarde [S26].</p>
<div class="lab">Valeur</div><p>Dans une revue systématique de 103 cas publiés de chevauchement, le ptosis (71,8 %) et la faiblesse (62,1 %) étaient les présentations les plus fréquentes [S27]. Ce chiffre décrit des cas publiés, non une sensibilité.</p>
<div class="lab">Conduite</div><p>Le médecin recherche le chevauchement cardiaque et respiratoire et commence sans délai une corticothérapie à forte dose [S26].</p></template>
