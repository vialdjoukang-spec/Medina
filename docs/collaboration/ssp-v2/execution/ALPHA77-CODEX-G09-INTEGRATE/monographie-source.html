figure="ventricle"] [data-g09-mark="1"]{left:54%;top:25%}[data-g09-figure="ventricle"] [data-g09-mark="2"]{left:53%;top:68%}[data-g09-figure="ventricle"] [data-g09-mark="3"]{left:29%;top:69%}[data-g09-figure="cochlea"] [data-g09-mark="1"]{left:83%;top:43%}[data-g09-figure="cochlea"] [data-g09-mark="2"]{left:83%;top:60%}[data-g09-figure="cochlea"] [data-g09-mark="3"]{left:88%;top:49%}[data-g09-figure="histo"] [data-g09-mark="1"]{left:38%;top:31%}[data-g09-figure="histo"] [data-g09-mark="2"]{left:28%;top:50%}[data-g09-figure="histo"] [data-g09-mark="3"]{left:45%;top:65%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#g09-1">Définition</a></li><li><a href="#g09-2">Épidémiologie</a></li><li><a href="#g09-3">Physiopathologie</a></li><li><a href="#g09-4">Démarche clinique</a></li><li><a href="#g09-5">Anamnèse</a></li><li><a href="#g09-6">Examen clinique</a></li><li><a href="#g09-7">Syndromes</a></li><li><a href="#g09-8">Diagnostic positif</a></li><li><a href="#g09-9">Explorations</a></li><li><a href="#g09-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#g09-11">Prise en charge</a></li><li><a href="#g09-12">Prévention, suivi et pronostic</a></li><li><a href="#g09-13">Points clés</a></li><li><a href="#g09-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="G09"><section class="ilot" id="g09-question" ><h2>Après la phase aiguë : guéri de quoi, capable de quoi ?</h2><p><b>Vignette fictive.</b> Une personne quitte l’hôpital après une méningite bactérienne. Elle marche et converse normalement, mais se fatigue dès qu’elle reprend son travail, oublie des consignes et entend moins bien. Dans un autre dossier, une personne s’aggrave à nouveau après une encéphalite herpétique. S’agit-il dans les deux cas de séquelles à accepter sans autre enquête ?</p><p>Il faut distinguer le contrôle de la maladie causale, les déficiences résiduelles, la récupération et une nouvelle activité ou complication. Un examen moteur rassurant ne mesure pas la mémoire, l’audition ou la capacité à soutenir un effort intellectuel. Une aggravation après amélioration mérite une nouvelle évaluation ; elle ne doit pas être automatiquement appelée séquelle.</p><div class="key"><b>À retenir.</b> Décrire la trajectoire, les fonctions et le retentissement avant de donner une étiquette.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p></section>
<section class="ilot" id="g09-1" ><h2>1. Définition : une conséquence tardive à relier à sa cause</h2><p>Une séquelle est un état résiduel ou un effet tardif d’une affection antérieure. Elle peut associer déficit moteur, trouble de coordination, perte auditive, atteinte cognitive, crises, fatigue ou difficultés psychiques et sociales. Ces dimensions ne signifient pas que la maladie initiale est encore active ; elles ne démontrent pas non plus qu’elle ne puisse pas récidiver.</p><p>La note OFS de <b>G09</b> vise un trouble classé ailleurs qui est la séquelle d’un état initialement classé en <b>G00–G08, hors catégories marquées d’un astérisque</b>. Elle comprend les états précisés comme séquelles ou effets tardifs, ou présents une année ou plus après le début de l’affection. Il n’est donc pas nécessaire d’attendre un an si le caractère séquellaire est déjà établi. Aucun sous-code décimal G09.x n’est décrit dans cette version.</p><p>Le champ clinique des suites neuro-inflammatoires est plus large que le code. L’OFS distingue notamment <b>B94.1, séquelles d’encéphalite virale</b>, et <b>B90.0, séquelles de tuberculose du SNC</b>. L’encéphalite herpétique B00.4† renvoie à G05.1*. On ne transforme donc pas toute suite d’infection ou toute plainte après HSV/FSME en G09.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a>.</p><p><button class="w" data-k="g09-exp-1">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-1">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-2" ><h2>2. Épidémiologie : ne pas confondre un code et une cohorte</h2><p>Aucune incidence suisse directe de G09 n’a été retenue dans les sources consultées. La fréquence et le profil des suites dépendent de la maladie initiale, de la population, des outils de mesure et du moment du suivi. Une série hospitalière, une étude de réanimation et une population de personnes ayant une infection légère ne sont pas interchangeables.</p><p>L’étude prospective bernoise publiée en 2024 a inclus 50 adultes hospitalisés pour méningite ou méningo-encéphalite/encéphalite virale et 21 témoins. Elle montre que cognition subjective, fatigue, sommeil et retentissement social ou professionnel peuvent rester perturbés malgré l’amélioration, y compris après des formes initialement peu sévères. Elle excluait notamment les méningites purulentes bactériennes et les encéphalites auto-immunes.</p><p>Cette cohorte éclaire le suivi clinique transversal ; elle ne mesure pas une incidence G09 ni le risque de chaque enfant ou de chaque malade. Son petit effectif, sa sélection et le recueil en partie subjectif limitent les extrapolations. Les données post-HSV et les parcours anti-NMDAr ont également leurs propres populations.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-METHOD — Méthodes 2.1–2.3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-LIMIT — Discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p><p><button class="w" data-k="g09-exp-2">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-2">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-3" ><h2>3. Physiopathologie : compartiment, réseau et mécanisme</h2><p>Les méninges enveloppent le SNC, tandis que le parenchyme contient les réseaux neuronaux et gliaux. La localisation de l’atteinte initiale contribue au profil résiduel. Une inflammation méningée, une atteinte du tissu cérébral et une atteinte médullaire ne se résument pas à un même mécanisme ni à un seul examen de contrôle.</p><figure data-g09-figure="meninges"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Gray1196.png" alt="Planche historique humaine des enveloppes crâniennes et méningées, avec sinus sagittal supérieur" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span><span data-g09-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Os crânien, coloré en jaune sur l’original.</li><li>Sinus sagittal supérieur, espace veineux bleu.</li><li>Enveloppes méningées : les étiquettes originales distinguent dure-mère, arachnoïde et pie-mère.</li><li>Tissu cérébral sous les enveloppes : compartiment différent d’une membrane méningée.</li></ol><p>Planche normale historique, sans inflammation ou pression mesurée. Elle distingue les compartiments ; elle ne montre pas une lésion d’un patient et ne justifie pas une ponction lombaire.</p><p data-g09-credit>Henry Gray / Henry Vandyke Carter, Anatomy of the Human Body, édition 1918, planche 1196 · <a href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une atteinte de la voie corticospinale peut laisser faiblesse, ralentissement des mouvements fins et spasticité. Après une lésion aiguë, la faiblesse peut d’abord être flasque puis devenir spastique ; l’absence initiale d’hypertonie n’écarte pas une localisation centrale. Une atteinte du cervelet ou de ses voies donne plutôt des troubles de coordination et d’équilibre.</p><figure data-g09-figure="motor"><div data-g09-frame="tall"><img src="assets/img/g09/alpha/codex/Gray764.png" alt="Planche historique humaine du trajet moteur corticospinal et de sa décussation" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Région motrice corticale, départ du schéma de la commande volontaire.</li><li>Trajet dans la capsule interne, indiqué sur l’original.</li><li>Décussation des pyramides : croisement figuré avant le trajet médullaire.</li></ol><p>Schéma anatomique normal et simplifié, sans mesure de force ou de spasticité. Il aide à localiser ; il ne prouve ni infection, ni inflammation active, ni gravité d’une séquelle.</p><p data-g09-credit>Gray, Anatomy of the Human Body, édition 1918, planche 764 ; schéma humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les fonctions cognitives reposent sur plusieurs réseaux. Mémoire, langage, attention, planification et comportement peuvent être atteints de manière différente. Une personne qui parle et marche peut conserver une gêne importante dans une activité complexe. La fatigue, le sommeil et les médicaments peuvent encore modifier les performances observées.</p><p>Dans l’encéphalite anti-NMDAr, le PNDS décrit des perturbations synaptiques liées aux anticorps, documentées notamment dans des travaux expérimentaux. Ce mécanisme n’est pas synonyme de destruction irréversible de tous les neurones. Une lésion résiduelle, une dysfonction encore récupérable et une nouvelle activité inflammatoire doivent être distinguées par la clinique et les investigations appropriées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/13-3-circulation-and-the-central-nervous-system" target="_blank" rel="noopener">NORMAL-CSF — Méninges et système ventriculaire</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones, glie du SNC et myéline</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p><p><button class="w" data-k="g09-exp-3">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-3">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-4" ><h2>4. Démarche clinique : comparer avant de conclure</h2><p><b>Rechercher une alerte.</b> Nouvelle altération de conscience, déficit nouveau brutal, crise prolongée ou répétée, fièvre avec signes neurologiques, céphalée nouvelle importante ou dégradation rapide appellent une évaluation urgente. Le dossier d’une ancienne inflammation ne suffit pas à expliquer le nouvel événement.</p><p><b>Reconstruire l’histoire.</b> Vérifier diagnostic initial, preuves, localisation, traitements et examens de référence. Comparer état avant maladie, état à la sortie et trajectoire actuelle. Une plainte persistante, une amélioration lente et une rechute après intervalle d’amélioration ne posent pas la même question.</p><p><b>Décrire les fonctions.</b> Examiner motricité, coordination, audition, langage et cognition, puis interroger sommeil, fatigue, humeur et autonomie. Rechercher le retentissement sur les activités, l’école, le travail et les proches. Les tests sont choisis selon ce qui doit être objectivé ou modifié.</p><p><b>Organiser un plan.</b> Préciser les avis, les examens, les objectifs fonctionnels, la personne de contact et les signes qui nécessitent un retour anticipé. La conclusion causale et la documentation de la déficience précèdent le choix du code.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-FOLLOW — Sections 6.1–6.3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a>.</p><p><button class="w" data-k="g09-exp-4">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-4">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-5" ><h2>5. Anamnèse : symptômes, calendrier et vie réelle</h2><p>Reprendre le compte rendu initial : méningite, encéphalite, myélite ou autre atteinte, agent ou mécanisme retenu, preuve microbiologique ou immunologique et éventuelles complications. Demander ce qui s’améliore, persiste, fluctue ou s’aggrave. Interroger aussi les proches, avec l’accord de la personne, car une difficulté de mémoire ou de comportement peut être peu perçue.</p><p>Explorer faiblesse, raideur, chutes, maladresse, douleur, audition, acouphènes, langage, mémoire, attention et capacité à planifier une journée. Demander combien de temps une tâche peut être soutenue et quelles adaptations sont nécessaires. Une fatigue cognitive n’est pas mesurée par la seule capacité à marcher dans le couloir.</p><p>Documenter sommeil, humeur, anxiété, crises éventuelles, traitements, changements de dose, observance, alcool et fonction rénale connue. Somnolence ou changement comportemental sous médicament peut modifier l’interprétation. Chez l’enfant, demander acquisitions, langage, jeu, scolarité et changements lors des transitions ; chez l’adulte, préciser activité antérieure, exigences du travail et sécurité des tâches.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-FOLLOW — Sections 6.1–6.3</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a>.</p><p><button class="w" data-k="g09-exp-5">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-5">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-6" ><h2>6. Examen clinique : normalité, localisation et fonction</h2><p>Comparer les deux côtés et l’état antérieur : force dans les gestes, maintien des bras, manœuvre de Mingazzini si adaptée, mouvements fins, tonus, réflexes et réponse plantaire. Chez l’adulte, la réponse plantaire normale décrite dans le référentiel est une flexion du gros orteil ; une extension oriente dans le contexte approprié, sans nommer seule la cause. L’âge et les capacités imposent d’adapter l’examen.</p><p>Observer station debout et marche avec sécurité, précision doigt-nez et talon-genou, parole et mouvements oculaires. Une hypermétrie et un polygone élargi orientent différemment d’une faiblesse. Une ataxie peut aussi être proprioceptive, vestibulaire ou frontale ; l’étiquette cérébelleuse doit rester confrontée aux autres signes.</p><p>Évaluer compréhension, expression, attention, mémoire et fonctions exécutives avec des tâches adaptées. Distinguer dysarthrie, aphasie, difficulté auditive et fatigue avant d’attribuer un échec à un trouble cognitif. Une conversation brève ne remplace pas une évaluation neuropsychologique si les exigences quotidiennes révèlent une difficulté.</p><figure data-g09-figure="cochlea"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Gray928.png" alt="Coupe longitudinale humaine schématique de la cochlée, rampes et canal cochléaire" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Rampe vestibulaire, scala vestibuli de l’original.</li><li>Rampe tympanique, scala tympani de l’original.</li><li>Canal cochléaire, ductus cochlearis, compartiment distinct des deux rampes.</li></ol><p>Planche normale, sans perte de cellules ciliées, ossification ou infection démontrées. Elle ne mesure pas l’audition ; l’évaluation audiologique du patient reste nécessaire.</p><p data-g09-credit>Henry Gray / Henry Vandyke Carter, Anatomy of the Human Body, édition 1918, planche 928 · <a href="https://commons.wikimedia.org/wiki/File:Gray928.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La plainte auditive justifie une évaluation audiologique formelle selon le contexte ; le schéma normal ne mesure aucune perte. Dans les suites de méningite bactérienne, NICE recommande de la proposer dans les quatre semaines après que la personne est apte au test, de préférence avant la sortie. Cette horloge diffère du contrôle médical à quatre à six semaines après sortie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception" target="_blank" rel="noopener">NORMAL-HEARING — Audition : conduction et cochlée</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a>.</p><p><button class="w" data-k="g09-exp-6">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-6">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-7" ><h2>7. Syndromes : plusieurs axes, plusieurs besoins</h2><table class="t"><thead><tr><th>Profil</th><th>Interprétation</th><th>Décision à préparer</th></tr></thead><tbody><tr><td>Faiblesse avec signes corticospinaux</td><td>Atteinte centrale à localiser, possible évolution du tonus</td><td>Mesurer capacité et sécurité ; distinguer déficit et spasticité avant traitement</td></tr><tr><td>Ataxie, hypermétrie, dysarthrie</td><td>Atteinte cérébelleuse ou de ses voies possible</td><td>Examiner différentiels et retentissement ; imagerie selon question</td></tr><tr><td>Mémoire, attention, langage ou planification perturbés</td><td>Domaines cognitifs différents</td><td>Bilan adapté et objectifs de réadaptation, sans score universel unique</td></tr><tr><td>Baisse auditive après méningite</td><td>Déficience à documenter, enjeu de communication et de développement</td><td>Audiologie ; surdité sévère/profonde : évaluation spécialisée urgente d’implant selon NICE</td></tr><tr><td>Fatigue, sommeil ou humeur perturbés</td><td>Symptômes réels avec causes possibles multiples</td><td>Trajectoire, médicaments, évaluations ciblées et retentissement quotidien</td></tr><tr><td>Nouvelle aggravation après amélioration</td><td>Une séquelle stable n’explique pas automatiquement ce changement</td><td>Rechercher activité, complication, autre maladie ou toxicité</td></tr></tbody></table><p>Ces profils se combinent. Ils ne sont pas des sous-codes G09 et n’identifient pas seuls l’agent initial. Le niveau d’aide et le projet de vie ne se déduisent pas du seul nom de syndrome.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p><p><button class="w" data-k="g09-exp-7">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-7">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-8" ><h2>8. Diagnostic positif : documenter une conséquence, éprouver l’explication</h2><p>Le diagnostic clinique relie une affection antérieure documentée, un déficit ou symptôme caractérisé et une trajectoire compatible. Il recherche aussi ce qui pourrait changer l’explication : nouvelle activité inflammatoire, complication, maladie intercurrente, trouble du sommeil ou effet médicamenteux. Il n’existe pas ici de score clinique universel « positif G09 » retenu.</p><p>Le caractère séquellaire n’implique pas une récupération définitivement terminée. Des améliorations peuvent se poursuivre, avec des déficiences encore importantes dans les tâches complexes. Inversement, une nouvelle aggravation ne doit pas être absorbée dans une étiquette de séquelle sans réévaluation.</p><p>Après cette conclusion, vérifier le périmètre de codage : état initial G00–G08 hors catégories astérisque pour la note G09, manifestation à préciser et catégories étiologiques distinctes comme B94.1 ou B90.0. Le délai d’un an est une formulation de la nomenclature, pas une règle imposant de refuser l’aide ou le suivi jusque-là.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-LIMIT — Discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p><p><button class="w" data-k="g09-exp-8">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-8">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-9" ><h2>9. Explorations : choisir l’examen qui peut changer le plan</h2><table class="t"><thead><tr><th>Question</th><th>Outil</th><th>Limite</th></tr></thead><tbody><tr><td>Quel profil fonctionnel et quelle évolution ?</td><td>Examen neurologique, entretien et mesures comparables</td><td>Un résultat moteur normal ne teste pas toutes les fonctions</td></tr><tr><td>Quelle perte auditive ?</td><td>Audiologie formelle avec méthodes adaptées à l’âge et aux capacités</td><td>Le simple constat “entend la conversation” ne remplace pas le bilan recommandé</td></tr><tr><td>Quels domaines cognitifs et quel retentissement ?</td><td>Évaluation neuropsychologique et langage selon besoins</td><td>Tenir compte audition, langue, fatigue et niveau antérieur ; pas seuil universel</td></tr><tr><td>Nouvelle lésion, complication ou question anatomique ?</td><td>IRM ou autre imagerie choisie par l’équipe</td><td>Une image seule ne mesure pas toute la fatigue ou la participation sociale</td></tr><tr><td>Épisodes compatibles avec crises ?</td><td>Histoire détaillée et EEG selon avis neurologique</td><td>Une prescription antérieure d’antiépileptique ne prouve pas à elle seule une épilepsie chronique</td></tr><tr><td>Nouvelle activité infectieuse/immune ou toxicité ?</td><td>Bilan ciblé, médicaments, fonction rénale ; LCR/anticorps si indication</td><td>Ni ponction ni panel d’anticorps systématique pour toute plainte stable</td></tr></tbody></table><p>Les comparaisons avec les examens antérieurs comptent. Une recherche destinée à expliquer une aggravation est différente d’un contrôle de récupération stable. Les bilans ne doivent pas retarder l’urgence lorsqu’un état nouveau le requiert.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-FOLLOW — Sections 6.1–6.3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a>.</p><p><button class="w" data-k="g09-exp-9">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-9">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-10" ><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Changement récent ou signe de gravité ?</b> Réévaluation urgente adaptée ; ne pas partir du principe que l’ancienne maladie explique tout.</li><li><b>Affection initiale et trajectoire documentées ?</b> Reprendre preuves, localisation, traitements et état de référence.</li><li><b>Fonction atteinte caractérisée ?</b> Séparer motricité, coordination, audition, cognition, fatigue, sommeil et humeur.</li><li><b>Cause résiduelle concordante ou autre explication ?</b> Vérifier médicaments, organes, contexte et examens ciblés.</li><li><b>Conclusion et plan explicites ?</b> Documenter déficience, retentissement, récupération possible, suivi et codage approprié.</li></ol><p>Une faiblesse peut différer d’une spasticité ; une ataxie n’est pas toujours cérébelleuse ; un trouble de compréhension peut être auditif ou linguistique. Fatigue et baisse de performance peuvent être aggravées par sommeil, humeur ou traitement. Sous baclofène, confusion, somnolence ou myoclonies peuvent relever d’une encéphalopathie toxique, notamment en insuffisance rénale.</p><p>Après HSV, une nouvelle dégradation neuropsychiatrique ou motrice peut relever d’une encéphalite auto-immune. Dans la cohorte espagnole, des anticorps étaient aussi présents chez certains sans syndrome auto-immun : un résultat isolé ne suffit donc pas. L’équipe doit rechercher aussi une récidive infectieuse ou une autre cause, sans déclarer une séquelle fixe par défaut.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p><p><button class="w" data-k="g09-exp-10">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-10">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-11" ><h2>11. Prise en charge : objectifs fonctionnels et traitements conditionnels</h2><p><b>Rééducation et réadaptation.</b> Définir des objectifs concrets avec la personne : déplacements sûrs, communication, autonomie, gestion d’une tâche, reprise d’étude ou d’emploi. Mobiliser selon les besoins physiothérapie, ergothérapie, orthophonie/logopédie, neuropsychologie, soutien psychologique et aide sociale. Adapter l’intensité à la fatigue, aux capacités préservées et à la trajectoire ; une récupération lente ne signifie pas absence de possibilités.</p><p><b>Audition.</b> Organiser le bilan et la réhabilitation adaptés. Une surdité sévère ou profonde après méningite bactérienne appelle une évaluation spécialisée urgente pour implant selon NICE. Chez l’enfant, les enjeux de langage, développement et apprentissage justifient de ne pas attendre une difficulté scolaire majeure.</p><p><b>Symptômes moteurs et crises.</b> Un antiépileptique traite une indication établie ; il n’est pas prescrit à toute personne codée G09. Le baclofène demande une spasticité et une indication appropriées, avec examen de ce que le tonus permet encore de faire. Diminuer le tonus peut aggraver station et marche si une part de ce tonus soutient la fonction.</p><p><b>Maladie active ou toxicité.</b> Le traitement d’une rechute infectieuse ou auto-immune relève de son diagnostic et de l’équipe spécialisée. Les doses d’immunothérapie ou d’antimicrobiens aigus ne sont pas recopiées comme traitement universel de séquelles. Une suspicion d’intoxication médicamenteuse impose une conduite urgente spécifique ; elle ne se traite pas comme une simple lenteur de récupération.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p><p><button class="w" data-k="g09-exp-11">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-11">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-12" ><h2>12. Prévention, suivi et pronostic : garder le projet dans le temps</h2><p>Le suivi associe symptômes, fonctions et participation réelle. Après méningite bactérienne ou maladie méningococcique, NICE prévoit un contrôle médical/pédiatrique à quatre à six semaines après sortie, avec audition et autres besoins. Chez l’enfant, le suivi neurodéveloppemental et la vigilance aux transitions scolaires se prolongent ; ces délais ne deviennent pas un calendrier unique pour toutes les encéphalites et myélites.</p><p>Dans les suites d’anti-NMDAr, le PNDS de centre expert propose une coordination durable et des réévaluations cognitives et sociales. Les cohortes virales suisses rappellent que certaines plaintes persistent malgré l’amélioration. Aucun délai de récupération ni retour complet au travail ne peut être promis à partir d’une seule étude ou d’un examen bref.</p><p>La reprise scolaire ou professionnelle peut être progressive et nécessiter des adaptations. L’aptitude à conduire ou à effectuer une tâche dangereuse dépend des déficits, des crises, du traitement et du cadre suisse actuel ; aucun délai universel n’est donné ici. Le document suisse de conduite consulté est réellement daté de 2019 malgré son chemin web de 2026.</p><p>La prévention de nouvelles infections dépend de la cause et du risque. L’OFSP recommande la vaccination FSME des personnes exposées selon âge et région, mais un vaccin ne répare pas une séquelle. Une infection naturelle FSME documentée pose une autre question qu’une simple exposition : la source OFSP décrit une immunité probablement durable. Le calendrier et le produit réel se vérifient avec le professionnel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-FOLLOW — Sections 6.1–6.3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-LIMIT — Discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.epi.ch/wp-content/uploads/2026/01/Fahreignung-mit-Epilepsie-Flyer-F.pdf" target="_blank" rel="noopener">CH-EPI — Introduction, contexte et actualisation</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/meningo-encephalite-a-tiques-fsme" target="_blank" rel="noopener">CH-OFSP-PREV — Prévention et vaccination</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener">CH-OFSP-IMMUNITY — Section 2.5, immunité après infection</a>.</p><p><button class="w" data-k="g09-exp-12">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-12">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-13" ><h2>13. Points clés : une conclusion qui guide la suite</h2><ul><li>Décrire maladie initiale, trajectoire, déficiences et retentissement.</li><li>Distinguer déficit moteur, spasticité, coordination, audition et cognition.</li><li>Une forme initialement légère peut laisser une gêne ; une conversation normale ne teste pas toutes les fonctions.</li><li>Une nouvelle aggravation impose de rouvrir le diagnostic, y compris médicaments et fonction rénale.</li><li>Le suivi auditif et le contrôle médical n’utilisent pas la même horloge NICE.</li><li>Rééducation, réadaptation et traitements symptomatiques ont des objectifs différents.</li><li>Le code G09 a un périmètre précis ; B94.1 et B90.0 ne disparaissent pas derrière une étiquette générale.</li></ul><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a>.</p><p><button class="w" data-k="g09-exp-13">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-13">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-14" ><h2>14. Pièges : ne pas refermer trop tôt le raisonnement</h2><p>Appeler séquelle toute plainte après une infection, attendre obligatoirement un an pour la reconnaître, ou classer toute suite virale en G09 sont trois erreurs différentes. Une amélioration globale peut masquer un déficit subtil ; une nouvelle aggravation peut relever d’une activité traitable ou d’une toxicité.</p><p>Les autres raccourcis sont de conclure au trouble cognitif sans vérifier audition et langage, de réduire tout échec de marche à une faiblesse, de traiter toute raideur avec une dose adulte standard ou de prolonger un antiépileptique sans révision de l’indication. Les FI précises et les populations limitent chaque produit.</p><p>Une date dans un nom de fichier n’est pas la version du texte, une cohorte ne mesure pas une incidence de code et une photographie normale n’est pas une preuve de maladie. Les incertitudes doivent rester visibles dans le plan et les sources.</p><div class="trap"><b>Piège.</b> Le suivi cherche ce qui peut être amélioré ou traité, sans attribuer d’emblée chaque changement à une séquelle définitive.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.epi.ch/wp-content/uploads/2026/01/Fahreignung-mit-Epilepsie-Flyer-F.pdf" target="_blank" rel="noopener">CH-EPI — Introduction, contexte et actualisation</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-LIMIT — Discussion, limites et conclusion</a>.</p><p><button class="w" data-k="g09-exp-14">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g09-14">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g09-entrainement" ><h2>S’entraîner : quatre décisions et quatre cas</h2><div class="quiz ui"><p>Une nouvelle aggravation après amélioration doit-elle être appelée séquelle par défaut ?</p><button data-ok="1">Non, il faut rechercher nouvelle activité, complication, autre maladie ou toxicité.</button><button data-ok="0">Oui, le diagnostic ancien explique nécessairement le changement.</button><p class="fb" hidden>La trajectoire peut changer l’urgence et les investigations.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p><div class="quiz ui"><p>Les quatre semaines du bilan auditif NICE commencent-elles automatiquement à la sortie ?</p><button data-ok="1">Non, elles commencent quand la personne est apte au test ; le test est préféré avant sortie.</button><button data-ok="0">Oui, c’est la même horloge que le contrôle médical.</button><p class="fb" hidden>Le contrôle médical à quatre à six semaines se calcule après sortie, dans la population du guide.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a>.</p><div class="quiz ui"><p>G09 est-il automatique pour toute suite d’encéphalite virale ?</p><button data-ok="1">Non, sa note et les catégories étiologiques distinctes doivent être vérifiées.</button><button data-ok="0">Oui, tout symptôme résiduel du SNC impose G09.</button><p class="fb" hidden>B94.1 et les exclusions des catégories astérisque doivent rester visibles.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a>.</p><div class="quiz ui"><p>La barre du comprimé Keppra garantit-elle deux doses égales ?</p><button data-ok="1">Non, la FI la décrit pour faciliter la déglutition.</button><button data-ok="0">Oui, toute rainure garantit une demi-dose exacte.</button><p class="fb" hidden>La formulation et la concentration adaptées sont nécessaires à la dose prescrite.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a>.</p><p><button class="w" data-k="g09-cas-1">Cas 1</button> <button class="w" data-k="g09-cas-2">Cas 2</button> <button class="w" data-k="g09-cas-3">Cas 3</button> <button class="w" data-k="g09-cas-4">Cas 4</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — EPA 2.2 et SSP 4, 28, 101, 102, 105, 207, 219</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, connaissances et compétences cliniques</a>.</p></section>
</div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g09-e-function" ><h2>Examen et mesures fonctionnelles : comparer ce qui compte</h2><p>Le bilan commence par la question de la personne et par la trajectoire. Force, tonus, coordination, audition, langage et cognition décrivent des fonctions différentes. Une mesure gagne en valeur lorsqu’elle est comparable à un état antérieur et mise en relation avec l’autonomie. Une conversation ou une marche brève peut manquer une difficulté révélée par une tâche prolongée.</p><p>L’évaluation neuropsychologique précise les domaines atteints et préservés. Langue, audition, fatigue, sommeil, humeur et niveau antérieur peuvent modifier la performance. Il ne faut pas interpréter tout échec comme une perte de mémoire ni appliquer un seuil cognitif unique à tous les âges. Le bilan aide à fixer des objectifs et à choisir des adaptations ; il ne constitue pas à lui seul une preuve de nouvelle inflammation.</p><p>Chez l’enfant, le développement et les apprentissages se lisent dans le temps. NICE souligne que certaines complications deviennent visibles aux transitions, par exemple à l’entrée à l’école. Un résultat précoce rassurant ne supprime donc pas toute vigilance ultérieure.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-METHOD — Méthodes 2.1–2.3</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a>.</p></section>
<section class="ilot" id="g09-e-hearing" ><h2>Audiologie : deux horloges à ne pas confondre</h2><table class="t"><thead><tr><th>Question</th><th>Population et délai attribués</th><th>Conséquence</th></tr></thead><tbody><tr><td>Quand tester l’audition ?</td><td>NICE NG240 : dans quatre semaines après aptitude au test, de préférence avant sortie</td><td>Prévoir le bilan, sans attendre le contrôle médical si le test est réalisable</td></tr><tr><td>Quand revoir médicalement ?</td><td>NICE NG240 : quatre à six semaines après sortie pour méningite bactérienne/maladie méningococcique</td><td>Revoir audition, neurologie, développement, besoins et autres complications</td></tr><tr><td>Et une surdité sévère/profonde ?</td><td>NICE : évaluation urgente d’implant chez enfant, jeune et adulte</td><td>Orientation spécialisée, sans attendre une échéance de routine</td></tr><tr><td>Et les autres causes ?</td><td>Calendrier selon mécanisme, âge et équipe</td><td>Ne pas transformer NG240 en programme universel G09</td></tr></tbody></table><p>Les méthodes audiologiques sont adaptées à l’âge et aux capacités de réponse. Un test de conversation ne remplace pas une évaluation formelle. Une difficulté auditive peut perturber un test de compréhension ou d’apprentissage ; elle doit rester présente dans l’interprétation du profil cognitif.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception" target="_blank" rel="noopener">NORMAL-HEARING — Audition : conduction et cochlée</a>.</p></section>
<section class="ilot" id="g09-e-imaging" ><h2>Imagerie, EEG et biologie : donner une cible à chaque outil</h2><p>L’imagerie cherche une structure ou une complication qui peut expliquer le tableau et changer le plan. L’IRM peut être discutée devant une question lésionnelle ou une nouvelle aggravation ; une image de contrôle ne mesure pas seule toute la fatigue, la cognition ou la participation sociale. Le choix et l’urgence dépendent du tableau réel.</p><figure data-g09-figure="ventricle"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Gray739.png" alt="Planche humaine de la région du ventricule latéral gauche exposée de côté, avec plexus et hippocampe" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Plexus choroïde, nommé dans la légende originale.</li><li>Région de l’hippocampe, voisin de la corne inférieure du ventricule latéral.</li><li>Sillon cérébral latéral, repère externe nommé sur l’original.</li></ol><p>Anatomie normale exposée, pas une IRM ni une hydrocéphalie. Les repères situent des structures ; ils ne mesurent ni volume ventriculaire, ni pression, ni mémoire.</p><p data-g09-credit>Henry Gray / Henry Vandyke Carter, Anatomy of the Human Body, édition 1918, planche 739 · <a href="https://commons.wikimedia.org/wiki/File:Gray739.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Un EEG répond à une question d’activité cérébrale et de crises ; il ne remplace pas l’évaluation cognitive et fonctionnelle. L’histoire des épisodes et les indications du traitement antérieur doivent être reprises. La révision à trois mois proposée par NICE pour les personnes sous antiépileptiques après méningite ne signifie pas un arrêt automatique à cette date.</p><p>En cas de nouvelle activité suspectée, LCR, tests infectieux ou anticorps sont choisis avec l’équipe spécialisée. Après HSV, des anticorps peuvent exister sans encéphalite auto-immune clinique ; un résultat isolé ne suffit pas. En cas de traitement potentiellement sédatif ou neurotoxique, vérifier produit, dose, calendrier, associations et fonction rénale. Une ponction ou un panel immunologique n’est pas demandé systématiquement pour toute plainte stable.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/13-3-circulation-and-the-central-nervous-system" target="_blank" rel="noopener">NORMAL-CSF — Méninges et système ventriculaire</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a>.</p></section>
</div></div>

<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g09-tab-semio" role="tab" data-s="g09-s-semio" aria-controls="g09-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="g09-tab-anat" role="tab" data-s="g09-s-anat" aria-controls="g09-s-anat" aria-selected="false">Anatomie</button><button id="g09-tab-histo" role="tab" data-s="g09-s-histo" aria-controls="g09-s-histo" aria-selected="false">Histologie</button><button id="g09-tab-physio" role="tab" data-s="g09-s-physio" aria-controls="g09-s-physio" aria-selected="false">Physiologie</button><button id="g09-tab-bio" role="tab" data-s="g09-s-bio" aria-controls="g09-s-bio" aria-selected="false">Biochimie</button><button id="g09-tab-immuno" role="tab" data-s="g09-s-immuno" aria-controls="g09-s-immuno" aria-selected="false">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div class="sci" id="g09-s-semio" role="tabpanel" aria-labelledby="g09-tab-semio"><section class="ilot" id="g09-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le fonctionnement normal associe commande motrice, coordination, réception sensorielle et traitement cognitif. Les voies corticospinales soutiennent la commande volontaire ; le cervelet et ses connexions contribuent à la précision et à l’équilibre. La cochlée transforme une information mécanique en signal nerveux. Les fonctions cognitives comprennent mémoire, langage, attention et fonctions exécutives, sans être un seul score.</p><p>La normalité se juge avec âge, capacités et état antérieur. Chez l’adulte, le référentiel décrit une réponse plantaire normale en flexion du gros orteil ; une extension s’interprète dans un ensemble clinique. Une conversation ou une marche normale ne démontre pas l’intégrité de toutes les fonctions. La figure cochléaire ci-dessous situe des compartiments, sans mesurer une audition individuelle.</p><figure data-g09-figure="cochlea"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Gray928.png" alt="Coupe longitudinale humaine schématique de la cochlée, rampes et canal cochléaire" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Rampe vestibulaire, scala vestibuli de l’original.</li><li>Rampe tympanique, scala tympani de l’original.</li><li>Canal cochléaire, ductus cochlearis, compartiment distinct des deux rampes.</li></ol><p>Planche normale, sans perte de cellules ciliées, ossification ou infection démontrées. Elle ne mesure pas l’audition ; l’évaluation audiologique du patient reste nécessaire.</p><p data-g09-credit>Henry Gray / Henry Vandyke Carter, Anatomy of the Human Body, édition 1918, planche 928 · <a href="https://commons.wikimedia.org/wiki/File:Gray928.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception" target="_blank" rel="noopener">NORMAL-HEARING — Audition : conduction et cochlée</a>.</p></section>
<section class="ilot" id="g09-semio-signs" data-semiology="signs"><h3>Symptômes et signes : nommer avant de regrouper</h3><p>Une plainte de faiblesse peut correspondre à déficit de commande, raideur, fatigue ou trouble d’équilibre. Une maladresse peut relever de coordination, de sensibilité ou d’une difficulté gestuelle cognitive. Les mots de la personne doivent être traduits en observations sans les effacer.</p><p>Déficit moteur, hypertonie dépendant de l’étirement, hypermétrie, dysarthrie, baisse auditive et trouble du langage ne sont pas interchangeables. Mémoire, attention et planification sont également distinctes. Fatigue, somnolence et humeur doivent être recueillies parce qu’elles modifient la vie quotidienne et peuvent influencer les performances. Un signe positif n’explique pas seul la cause.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a>.</p></section>
<section class="ilot" id="g09-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au profil clinique</h3><p>Une atteinte corticospinale peut produire un déficit de commande puis des signes spastiques ; le délai entre composantes compte. Une atteinte cérébelleuse perturbe la précision, le rythme et l’équilibre. Une atteinte auditive peut altérer la compréhension d’une consigne et les apprentissages, sans être une aphasie.</p><p>Une déficience résiduelle, une récupération encore en cours et une activité immune nouvelle posent des questions différentes. Dans l’anti-NMDAr, des perturbations synaptiques liées aux anticorps sont décrites, avec un socle expérimental ; elles ne prouvent pas une destruction irréversible de tous les neurones. À l’inverse, une plainte nouvelle ne démontre pas une rechute immune : médicaments, organes et autres maladies peuvent contribuer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception" target="_blank" rel="noopener">NORMAL-HEARING — Audition : conduction et cochlée</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a>.</p></section>
<section class="ilot" id="g09-semio-examination" data-semiology="examination"><h3>Recueillir les données de façon comparable</h3><p>Reconstituer affection initiale, traitement, état antérieur et trajectoire. Examiner de façon adaptée force, maintien des membres, tonus, réflexes, coordination, marche, langage et cognition. Décrire le côté, les gestes affectés et le retentissement plutôt que d’écrire seulement « examen anormal ».</p><p>L’évaluation auditive formelle, le bilan neuropsychologique, l’imagerie et l’EEG répondent à des questions distinctes. Répéter un outil n’est utile que si la comparaison est interprétable et peut modifier le plan. L’enfant, la personne fatiguée ou celle qui comprend mal la langue du test demande une adaptation ; une difficulté à répondre ne doit pas être automatiquement attribuée à une lésion cognitive.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-METHOD — Méthodes 2.1–2.3</a>.</p></section>
<section class="ilot" id="g09-semio-interpretation" data-semiology="interpretation"><h3>Concordance et discordance</h3><p>Le profil doit correspondre à la localisation et à la trajectoire attendues, tout en restant ouvert à d’autres causes. Une bonne récupération motrice peut coexister avec fatigue cognitive ou baisse auditive. Un résultat sérologique ou d’anticorps ne remplace pas un syndrome clinique ; dans la cohorte post-HSV, certains patients avaient des anticorps sans encéphalite auto-immune.</p><p>Une aggravation après modification de dose, surtout en insuffisance rénale sous baclofène, peut signaler une toxicité. Un tonus diminué par traitement peut faciliter un soin mais gêner la station si ce tonus aidait la fonction. Une mesure biologique ou une photographie normale ne dit donc pas seule si une intervention améliore la vie réelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p></section>
<section class="ilot" id="g09-semio-differentials" data-semiology="differentials"><h3>Différentiels : vérifier les catégories et les mécanismes</h3><p>Ataxie cérébelleuse, proprioceptive, vestibulaire et frontale ont des éléments de différenciation. Dysarthrie, aphasie, surdité et fatigue ne doivent pas être regroupées en « parle mal » ou « ne comprend pas ». Déficit moteur et apraxie ne sont pas synonymes.</p><p>La nouvelle activité infectieuse ou immune, une complication, un effet médicamenteux et une autre maladie peuvent mimer ou aggraver une séquelle. Le code suit l’explication : G09 a une note précise, tandis que B94.1 et B90.0 décrivent des catégories distinctes. Une suite virale ne devient pas G09 simplement parce qu’elle affecte le système nerveux.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a>.</p></section>
<section class="ilot" id="g09-semio-urgency" data-semiology="urgency"><h3>Le changement qui impose une réévaluation rapide</h3><p>Altération de conscience, déficit nouveau brutal, crise prolongée ou répétée, fièvre avec signes neurologiques ou dégradation rapide exigent une évaluation urgente. Ne pas attendre une échéance de suivi sous prétexte qu’un diagnostic ancien est connu.</p><p>Après HSV, de nouveaux symptômes neuropsychiatriques ou moteurs peuvent relever d’une encéphalite auto-immune et doivent être explorés avec l’équipe. Sous baclofène, confusion, somnolence ou myoclonies peuvent annoncer une encéphalopathie, notamment avec accumulation rénale. La conduite urgente devant une toxicité suspectée diffère d’un sevrage planifié habituel.</p><p>Après méningite bactérienne, une surdité sévère ou profonde nécessite une évaluation spécialisée urgente d’implant selon NICE. Ce besoin ne doit pas attendre que le calendrier de contrôle ordinaire soit arrivé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a>.</p></section>
<section class="ilot" id="g09-semio-limits" data-semiology="limits"><h3>Limites : population, outil et portée de la preuve</h3><p>Les fréquences des cohortes ne deviennent pas une incidence suisse G09. L’étude bernoise était adulte, virale et sélectionnée ; le groupe post-HSV et le PNDS anti-NMDAr répondent à d’autres questions. Les délais NICE s’appliquent aux populations du guide, avec des horloges différentes.</p><p>Un résultat de test dépend des conditions et du niveau antérieur. Une image histologique d’architecture ne montre pas un anticorps ni la fonction d’un réseau ; un schéma normal ne prouve pas une séquelle. Les FI de produits réels, les formulations, les organes et l’âge limitent les posologies. L’auto-relecture de ce cours n’est pas une validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-METHOD — Méthodes 2.1–2.3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-LIMIT — Discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.histologistes.org/CHEC/images/pedago/resumes/Cortex_Cerebelleux.pdf" target="_blank" rel="noopener">EU-HISTO — Architecture du cortex, Purkinje et histophysiologie</a>.</p></section>
<section class="ilot" id="g09-semio-sources" data-semiology="sources"><h3>Sources réellement lues et décisions attribuées</h3><p>La nomenclature OFS fixe le périmètre G09 et les catégories étiologiques voisines. Les données bernoises 2024 éclairent les symptômes et limites d’une cohorte virale adulte. Les sources OFSP sur FSME relèvent de la clinique et de la prévention de cette maladie, sans donner une fréquence G09.</p><p>Le CEN décrit les signes et les manœuvres ; NICE NG240 donne un parcours après méningite bactérienne ou maladie méningococcique. Le PNDS français de centre expert décrit l’anti-NMDAr et sa réadaptation, sans être présenté comme validation indépendante de la HAS. Quatre FI suisses exactes précisent les produits. Le ledger distingue les passages, les dates et les limites ; les textes complets restent hors Git.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-METHOD — Méthodes 2.1–2.3</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener">CH-OFSP-CLIN — Section 2.4, séquelles</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680004500039" target="_blank" rel="noopener">FI-FSME-CC — Indication, doses, rappels, précautions, interactions et grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680006830035" target="_blank" rel="noopener">FI-FSME-JUNIOR — Indication, doses, rappels et précautions</a>.</p></section>
<section class="ilot" id="g09-semio-bridge" ><h3>De l’observation à la décision</h3><p><b>Science → clinique.</b> Nommer fonction, localisation et trajectoire avant de conclure à une séquelle.</p><p><b>Science → examen.</b> Choisir l’outil qui objective le déficit ou recherche une cause nouvelle, en expliquant ses limites.</p><p><b>Science → traitement.</b> L’objectif est une amélioration utile et sûre ; un code, une image ou un chiffre ne prescrit pas un traitement universel.</p><div class="key"><b>À retenir.</b> Relier structure, mécanisme, signe, mesure et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a>.</p></section>
</div><div class="sci" id="g09-s-anat" role="tabpanel" aria-labelledby="g09-tab-anat" hidden><section class="ilot" id="g09-s-anat-content" ><h2>Anatomie : enveloppes, tissu et voies</h2><p>Le SNC associe encéphale et moelle, avec des régions et des voies qui ne remplissent pas la même fonction. Les méninges sont des enveloppes : dure-mère externe résistante, arachnoïde et pie-mère au contact du tissu. L’espace sous-arachnoïdien contient du LCR. Une atteinte méningée n’est donc pas anatomiquement identique à une atteinte du parenchyme ou d’un faisceau médullaire.</p><p>Les voies corticospinales relient la commande corticale aux circuits moteurs. Leur croisement dans la moelle allongée explique une partie de la relation entre côté de lésion et côté du déficit. Le cervelet communique avec d’autres régions par ses pédoncules ; une difficulté de coordination ne se résume pas à une perte de force.</p><figure data-g09-figure="meninges"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Gray1196.png" alt="Planche historique humaine des enveloppes crâniennes et méningées, avec sinus sagittal supérieur" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span><span data-g09-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Os crânien, coloré en jaune sur l’original.</li><li>Sinus sagittal supérieur, espace veineux bleu.</li><li>Enveloppes méningées : les étiquettes originales distinguent dure-mère, arachnoïde et pie-mère.</li><li>Tissu cérébral sous les enveloppes : compartiment différent d’une membrane méningée.</li></ol><p>Planche normale historique, sans inflammation ou pression mesurée. Elle distingue les compartiments ; elle ne montre pas une lésion d’un patient et ne justifie pas une ponction lombaire.</p><p data-g09-credit>Henry Gray / Henry Vandyke Carter, Anatomy of the Human Body, édition 1918, planche 1
