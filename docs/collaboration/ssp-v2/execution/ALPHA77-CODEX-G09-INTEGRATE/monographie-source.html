196 · <a href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La cochlée appartient à l’oreille interne, distincte du cortex qui interprète l’information et des fonctions de langage. Les ventricules sont des espaces de circulation du LCR, voisins de structures cérébrales sans être eux-mêmes un test de mémoire. Ces distinctions permettent de formuler la question clinique avec précision et d’éviter de demander à un seul examen de tout expliquer.</p><p><b>Science → clinique.</b> La localisation aide à séparer faiblesse, ataxie, perte auditive et trouble cognitif. Une topographie cohérente ne donne pas seule la cause ou l’activité actuelle.</p><p><b>Science → examen.</b> Examen neurologique, audiologie et imagerie répondent à des niveaux différents. Une planche normale situe les compartiments ; elle ne représente pas l’état d’une personne.</p><p><b>Science → traitement.</b> Le plan doit viser la fonction atteinte et la maladie lorsqu’elle est active. Un traitement de spasticité médullaire ne répare pas une cochlée et une prothèse auditive ne traite pas une rechute inflammatoire.</p><div class="key"><b>À retenir.</b> Localiser l’atteinte avant de choisir l’explication et l’intervention.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/13-3-circulation-and-the-central-nervous-system" target="_blank" rel="noopener">NORMAL-CSF — Méninges et système ventriculaire</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones, glie du SNC et myéline</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception" target="_blank" rel="noopener">NORMAL-HEARING — Audition : conduction et cochlée</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a>.</p></section>
</div><div class="sci" id="g09-s-histo" role="tabpanel" aria-labelledby="g09-tab-histo" hidden><section class="ilot" id="g09-s-histo-content" ><h2>Histologie : lire une architecture sans inventer la maladie</h2><p>Le tissu nerveux associe neurones, cellules gliales, vaisseaux et prolongements. Les corps cellulaires, axones et dendrites ne sont pas des structures équivalentes. Dans le SNC, des oligodendrocytes forment la myéline autour de segments axonaux ; d’autres cellules gliales ont des fonctions de soutien ou de surveillance. Une coloration H&E ne mesure pas à elle seule toutes ces fonctions.</p><p>Le cortex cérébelleux offre une architecture de référence en trois couches : moléculaire externe, couche des cellules de Purkinje et couche granulaire interne. La source universitaire décrit les cellules de Purkinje comme une efférence inhibitrice du cortex cérébelleux. La microphotographie humaine permet de repérer des zones de densité différente et de grandes cellules à leur interface.</p><figure data-g09-figure="histo"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Cerebellar_cortex_-_intermed_mag.jpg" alt="Microphotographie humaine H&amp;E d’architecture du cortex cérébelleux, couches moléculaire et granulaire et cellules de Purkinje" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Couche moléculaire externe, relativement peu dense en noyaux.</li><li>Couche des cellules de Purkinje : grande cellule visible à gauche du repère, à l’interface des deux couches.</li><li>Couche granulaire interne, dense en petits noyaux.</li></ol><p>Contexte clinique individuel non précisé par la provenance. La photographie permet une lecture d’architecture avec le cours d’histologie ; elle ne démontre pas une séquelle G09, un anticorps, une quantité de myéline ou une inflammation active.</p><p data-g09-credit>Nephron, microphotographie personnelle, mise en ligne le 22 décembre 2010 ; catégorie de provenance : histologie du cervelet humain · <a href="https://commons.wikimedia.org/wiki/File:Cerebellar_cortex_-_intermed_mag.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le contexte clinique individuel de l’original Nephron n’est pas précisé. L’image n’est donc pas présentée comme une biopsie normale certifiée ni comme un cas de séquelle. Elle ne démontre pas de récepteur NMDA, de charge d’anticorps, de quantité de myéline ou d’activité inflammatoire. Une architecture et une molécule sont des échelles de preuve différentes.</p><p><b>Science → clinique.</b> Un trouble de coordination peut orienter vers cervelet ou ses connexions, mais une photographie d’architecture ne donne pas le retentissement de la personne.</p><p><b>Science → examen.</b> L’examen clinique et l’imagerie localisent selon la question. Une biopsie n’est pas une étape systématique pour reconnaître une séquelle stable ou une fatigue.</p><p><b>Science → traitement.</b> Le mécanisme et la trajectoire déterminent l’intervention. Une légende histologique ne justifie ni immunothérapie, ni antiépileptique, ni pronostic de récupération complète.</p><div class="key"><b>À retenir.</b> Décrire ce qui est visible et conserver ce que l’image ne peut pas dire.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones, glie du SNC et myéline</a> ; <a data-reference-source="1" href="https://www.histologistes.org/CHEC/images/pedago/resumes/Cortex_Cerebelleux.pdf" target="_blank" rel="noopener">EU-HISTO — Architecture du cortex, Purkinje et histophysiologie</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p></section>
</div><div class="sci" id="g09-s-physio" role="tabpanel" aria-labelledby="g09-tab-physio" hidden><section class="ilot" id="g09-s-physio-content" ><h2>Physiologie : LCR, protection et fonctionnement en réseau</h2><p>Le LCR circule dans les ventricules et autour du SNC. Le modèle classique décrit sa production au niveau des plexus choroïdes, son passage par le système ventriculaire puis les espaces sous-arachnoïdiens et sa résorption vers le sang. Ce liquide et les enveloppes contribuent à l’environnement protecteur du tissu nerveux ; ils ne sont pas un simple vide entre os et cerveau.</p><p>Les ventricules latéraux communiquent avec le troisième ventricule ; l’aqueduc conduit vers le quatrième, puis des ouvertures rejoignent les espaces sous-arachnoïdiens. La planche historique situe seulement une partie de cette anatomie. Elle ne représente ni un flux mesuré ni la pression d’un patient, et ne remplace pas une imagerie lorsque celle-ci est indiquée.</p><figure data-g09-figure="ventricle"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Gray739.png" alt="Planche humaine de la région du ventricule latéral gauche exposée de côté, avec plexus et hippocampe" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Plexus choroïde, nommé dans la légende originale.</li><li>Région de l’hippocampe, voisin de la corne inférieure du ventricule latéral.</li><li>Sillon cérébral latéral, repère externe nommé sur l’original.</li></ol><p>Anatomie normale exposée, pas une IRM ni une hydrocéphalie. Les repères situent des structures ; ils ne mesurent ni volume ventriculaire, ni pression, ni mémoire.</p><p data-g09-credit>Henry Gray / Henry Vandyke Carter, Anatomy of the Human Body, édition 1918, planche 739 · <a href="https://commons.wikimedia.org/wiki/File:Gray739.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le fonctionnement neurologique repose aussi sur une circulation d’information entre réseaux. Une personne peut réussir un geste bref mais avoir du mal à enchaîner une tâche, à maintenir l’attention ou à intégrer une consigne auditive. La performance dépend de plusieurs fonctions, de la fatigue et des conditions du moment ; elle ne se déduit pas d’un seul compartiment anatomique.</p><p><b>Science → clinique.</b> Une plainte nouvelle ou une dégradation de fonction doit être replacée dans son calendrier. L’ancienne inflammation n’est pas une explication suffisante à tout changement.</p><p><b>Science → examen.</b> Imagerie, audition et bilan cognitif testent des dimensions distinctes. Répéter les mesures dans des conditions comparables aide à comprendre la trajectoire, sans transformer un résultat en certitude sur toute la fonction.</p><p><b>Science → traitement.</b> Rééducation, adaptations et soins de la cause répondent à des objectifs différents. Une amélioration d’une tâche et sa tolérance comptent davantage qu’un chiffre isolé sans retentissement évalué.</p><div class="key"><b>À retenir.</b> Relier circulation, réseau et fonction réelle sans demander à une seule mesure de tout résumer.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/13-3-circulation-and-the-central-nervous-system" target="_blank" rel="noopener">NORMAL-CSF — Méninges et système ventriculaire</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p></section>
</div><div class="sci" id="g09-s-bio" role="tabpanel" aria-labelledby="g09-tab-bio" hidden><section class="ilot" id="g09-s-bio-content" ><h2>Biochimie : excitabilité, cibles et exposition au médicament</h2><p>La membrane neuronale sépare des milieux dont les concentrations ioniques diffèrent. Gradients, perméabilité sélective, canaux et pompe sodium-potassium participent au potentiel de membrane et aux signaux électriques. Une valeur de repos décrite pour un exemple cellulaire n’est pas une norme unique pour tous les neurones et ne se confond pas avec un EEG clinique.</p><p>La communication entre cellules implique notamment des synapses et la libération de neurotransmetteurs. La FI du lévétiracétam décrit une liaison à la protéine vésiculaire SV2A pouvant contribuer à son action ; son mécanisme n’est pas entièrement élucidé. La FI du baclofène décrit une stimulation des récepteurs GABAB au niveau médullaire avec réduction de transmission réflexe. Ces deux médicaments n’ont ni la même cible ni le même objectif.</p><figure data-g09-figure="motor"><div data-g09-frame="tall"><img src="assets/img/g09/alpha/codex/Gray764.png" alt="Planche historique humaine du trajet moteur corticospinal et de sa décussation" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Région motrice corticale, départ du schéma de la commande volontaire.</li><li>Trajet dans la capsule interne, indiqué sur l’original.</li><li>Décussation des pyramides : croisement figuré avant le trajet médullaire.</li></ol><p>Schéma anatomique normal et simplifié, sans mesure de force ou de spasticité. Il aide à localiser ; il ne prouve ni infection, ni inflammation active, ni gravité d’une séquelle.</p><p data-g09-credit>Gray, Anatomy of the Human Body, édition 1918, planche 764 ; schéma humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une cible moléculaire n’abolit pas les limites d’indication. Une séquelle de maladie inflammatoire n’est pas automatiquement une épilepsie ou une spasticité relevant de ces produits. Leur exposition dépend notamment des organes et de la dose. Une accumulation rénale de baclofène peut provoquer somnolence, confusion ou myoclonies et simuler une aggravation neurologique.</p><p><b>Science → clinique.</b> Une modification de comportement, de vigilance ou de performance doit être comparée au calendrier thérapeutique et à la fonction rénale, sans être attribuée d’emblée à la maladie initiale.</p><p><b>Science → examen.</b> Nommer produit, formulation, unité et dose par prise ou par jour. Une concentration de solution permet un calcul de volume ; elle ne détermine pas l’indication ni l’adaptation rénale.</p><p><b>Science → traitement.</b> Le prescripteur confronte bénéfice, tolérance et population. La planche motrice montre un trajet macroscopique, pas SV2A ou GABAB ; aucun marquage moléculaire n’est inventé sur l’image.</p><div class="key"><b>À retenir.</b> Conserver la chaîne indication → produit → dose → exposition → effet et tolérance.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential" target="_blank" rel="noopener">NORMAL-ACTION — Potentiel de membrane, paragraphes sur gradients Na/K et pompe</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones, glie du SNC et myéline</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a>.</p></section>
</div><div class="sci" id="g09-s-immuno" role="tabpanel" aria-labelledby="g09-tab-immuno" hidden><section class="ilot" id="g09-s-immuno-content" ><h2>Immunologie et physiopathologie : activité et conséquence</h2><p>Le SNC possède des cellules gliales aux fonctions différentes ; la microglie participe à la surveillance et à la phagocytose. Une affection inflammatoire peut concerner des enveloppes, du parenchyme ou des voies, avec des conséquences variables. Dire qu’une fonction reste diminuée ne démontre pas que le même mécanisme inflammatoire soit encore actif.</p><p>Dans l’anti-NMDAr, le PNDS décrit des anticorps dirigés contre un récepteur neuronal et des altérations de son organisation synaptique, avec un socle important de modèles expérimentaux. Ces données expliquent qu’une dysfonction ne se réduise pas à une perte irréversible de toutes les cellules. Elles ne permettent pas de promettre une récupération complète chez chaque patient.</p><figure data-g09-figure="histo"><div data-g09-frame="wide"><img src="assets/img/g09/alpha/codex/Cerebellar_cortex_-_intermed_mag.jpg" alt="Microphotographie humaine H&amp;E d’architecture du cortex cérébelleux, couches moléculaire et granulaire et cellules de Purkinje" loading="lazy"><span data-g09-mark="1" aria-hidden="true">1</span><span data-g09-mark="2" aria-hidden="true">2</span><span data-g09-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Couche moléculaire externe, relativement peu dense en noyaux.</li><li>Couche des cellules de Purkinje : grande cellule visible à gauche du repère, à l’interface des deux couches.</li><li>Couche granulaire interne, dense en petits noyaux.</li></ol><p>Contexte clinique individuel non précisé par la provenance. La photographie permet une lecture d’architecture avec le cours d’histologie ; elle ne démontre pas une séquelle G09, un anticorps, une quantité de myéline ou une inflammation active.</p><p data-g09-credit>Nephron, microphotographie personnelle, mise en ligne le 22 décembre 2010 ; catégorie de provenance : histologie du cervelet humain · <a href="https://commons.wikimedia.org/wiki/File:Cerebellar_cortex_-_intermed_mag.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>L’étude espagnole post-HSV montre une complication auto-immune possible après une amélioration initiale. Elle montre aussi que des anticorps peuvent apparaître sans syndrome d’encéphalite auto-immune. L’agent initial, la trajectoire, les manifestations et les investigations doivent donc être interprétés ensemble. L’image H&E présentée ne visualise aucun de ces anticorps et n’est pas une preuve d’activité.</p><p><b>Science → clinique.</b> De nouveaux troubles psychiatriques, cognitifs ou moteurs après une encéphalite doivent être réévalués. À l’inverse, une plainte stable ne suffit pas à prescrire une immunothérapie.</p><p><b>Science → examen.</b> Les recherches infectieuses et immunologiques suivent une question et un contexte. Une positivité isolée ne remplace pas la discussion clinique et les exclusions pertinentes.</p><p><b>Science → traitement.</b> La maladie active relève d’un traitement spécifique spécialisé ; les conséquences fonctionnelles relèvent aussi de réadaptation. La vaccination FSME est préventive et ne constitue pas un traitement d’une séquelle établie.</p><div class="key"><b>À retenir.</b> Distinguer mécanisme actif, déficit résiduel et potentiel de récupération.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones, glie du SNC et myéline</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-FOLLOW — Sections 6.1–6.3</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/meningo-encephalite-a-tiques-fsme" target="_blank" rel="noopener">CH-OFSP-PREV — Prévention et vaccination</a>.</p></section>
</div></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g09-p-strategy" ><h2>Stratégie : traiter une indication et garder la fonction</h2><p>G09 n’est pas une indication médicamenteuse universelle. Les traitements ci-dessous répondent à une épilepsie, une spasticité ou un risque infectieux précis ; ils ne réparent pas indistinctement toutes les séquelles. La rééducation et les adaptations fonctionnelles restent des interventions à part entière.</p><p>Après méningite bactérienne, NICE propose une revue des médicaments antiépileptiques trois mois après sortie avec un professionnel compétent. Ce rendez-vous ne signifie ni traitement obligatoire pendant trois mois ni arrêt automatique. Reprendre motif initial, événements ultérieurs, examens et tolérance avant de décider.</p><p>Un changement de vigilance, de comportement ou de marche peut relever d’une maladie, d’une complication ou d’un médicament. Conserver produit, voie, dose par prise et par jour, fonction rénale et calendrier dans le dossier. Les monographies suivantes sont des références pédagogiques de FI suisses exactes, pas une prescription individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p></section>
<section class="ilot" id="g09-p-keppra" ><h2>Keppra oral : indication, formulation et doses de référence</h2><p><b>FI suisse d’avril 2023</b>, UCB-Pharma, GTIN 7680552970049 ; comprimés et solution buvable, sans transposition de l’information de perfusion. Lévétiracétam en monothérapie des crises focales avec ou sans généralisation secondaire dès 16 ans ; en association pour crises focales dès un mois chez le nourrisson né à terme. Les indications d’association pour myoclonies d’épilepsie juvénile myoclonique et crises tonico-cloniques d’épilepsie généralisée idiopathique ont leurs propres limites dès 12 ans.</p><table class="t"><thead><tr><th>Population dans la FI</th><th>Dose orale par prise, deux prises/jour</th><th>Titration et limite</th></tr></thead><tbody><tr><td>Adulte et adolescent >40 kg</td><td>500 mg ; départ plus faible à 250 mg possible selon évaluation</td><td>Si départ 250 : 500 mg après deux semaines ; ensuite paliers 250 ou 500 mg par prise toutes 2–4 semaines, jusqu’à 1500 mg deux fois/jour selon efficacité/tolérance</td></tr><tr><td>Nourrisson né à terme, 1 à moins de 6 mois, en association</td><td>7 mg/kg au départ</td><td>Augmentations de 7 mg/kg par prise toutes deux semaines, jusqu’à 21 mg/kg par prise deux fois/jour ; solution requise</td></tr><tr><td>À partir de 6 mois, enfant/adolescent <40 kg, en association</td><td>10 mg/kg au départ</td><td>Paliers ne dépassant pas 10 mg/kg par prise toutes 2–4 semaines, jusqu’à 30 mg/kg par prise deux fois/jour ; dose efficace minimale</td></tr></tbody></table><p>La transition pondérale doit être vérifiée dans la FI pour le patient réel, notamment à la frontière de 40 kg ; les tableaux rénaux utilisent encore d’autres populations de poids. La solution contient <b>100 mg/mL</b>. Les comprimés ont une barre permettant de faciliter la déglutition, <b>sans division en doses égales</b>. La FI recommande la solution pour certaines petites doses, enfants de moins de 25 kg au début ou difficultés de déglutition. Ne pas improviser une demi-dose à partir d’une rainure.</p><p>La dose se fractionne en deux prises, indépendamment des repas. L’indication selon âge, type de crise et association/monothérapie précède le calcul. Une crise aiguë ou une ancienne prescription hospitalière ne suffit pas à définir une épilepsie chronique ou un schéma G09 universel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a>.</p></section>
<section class="ilot" id="g09-p-keppra-organs" ><h2>Lévétiracétam : organes, reproduction et sécurité</h2><p>La FI adapte l’entretien à la fonction rénale. Le tableau ci-dessous concerne <b>l’adulte et l’adolescent dès 16 ans pesant plus de 50 kg</b> et utilise une clairance rapportée à 1,73 m² telle que décrite dans la FI. Les tableaux pédiatriques ne sont pas interchangeables avec celui-ci.</p><table class="t"><thead><tr><th>Clairance, mL/min/1,73 m²</th><th>Entretien selon cette table de FI</th></tr></thead><tbody><tr><td>≥80</td><td>500–1500 mg deux fois/jour</td></tr><tr><td>50–79</td><td>500–1000 mg deux fois/jour</td></tr><tr><td>30–49</td><td>250–750 mg deux fois/jour</td></tr><tr><td><30</td><td>250–500 mg deux fois/jour</td></tr><tr><td>Dialyse</td><td>500–1000 mg une fois/jour ; dose initiale de 750 mg le premier jour et supplément de 250–500 mg après dialyse selon la FI</td></tr></tbody></table><p>Chez le sujet âgé, suivre la fonction rénale. En atteinte hépatique légère à modérée, pas d’adaptation habituelle ; en atteinte sévère, l’estimation rénale peut être trompeuse et la FI recommande une réduction de moitié de l’entretien si la clairance est inférieure à 60 mL/min/1,73 m². La mesure et la population demandées par la FI doivent rester visibles.</p><p>Contre-indication : hypersensibilité au produit, substances apparentées ou excipients. Surveiller somnolence, troubles comportementaux et idées suicidaires, signes d’hypersensibilité et autres effets indésirables. Une baisse de performance ne doit pas être automatiquement attribuée à la séquelle. Les interactions par induction/inhibition enzymatique sont décrites comme peu probables, ce qui ne dispense pas de vérifier toute l’ordonnance et les organes.</p><p>Projet de grossesse : avis spécialisé, indication réévaluée et, si traitement nécessaire, dose efficace minimale et monothérapie si possible. Éviter l’arrêt brutal ; surveillance clinique pendant grossesse, car l’exposition peut changer. L’allaitement est déconseillé dans la FI ; si le traitement est nécessaire pendant cette période, discuter bénéfices et risques en considérant l’importance de l’allaitement. Une adaptation ou un arrêt se fait selon un plan prescrit.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a>.</p></section>
<section class="ilot" id="g09-p-baclofen" ><h2>Liorésal oral : spasticité, bénéfice fonctionnel et prudence</h2><p><b>FI suisse de janvier 2025</b>, Novartis, GTIN 7680360830184. Baclofène oral : indication notamment pour spasticité médullaire d’origine infectieuse, dégénérative, traumatique ou néoplasique, et spasticité grave réversible de sclérose en plaques. Ce libellé ne devient pas une indication automatique pour toute raideur ou toute séquelle cérébrale.</p><p><b>Adulte :</b> commencer généralement par 5 mg trois fois/jour, puis augmenter prudemment la dose unitaire de 5 mg tous les trois jours selon réponse. La dose journalière indicative moyenne est de 30–80 mg ; 100–120 mg/j peuvent être utilisés dans certains cas sous surveillance hospitalière. Le plafond exceptionnel n’est pas une cible. La titration est particulièrement lente chez personne âgée, fragile ou avec atteinte cérébrale/organique.</p><p><b>Enfant :</b> expérience limitée, âge minimal de douze mois et schéma pondéral spécialisé. La FI décrit un départ très faible, par exemple 0,3 mg/kg/j en quatre prises, puis adaptation prudente à intervalles d’une à deux semaines ; entretien 0,75–2 mg/kg/j. Le libellé de la FI donne un maximum de 40 mg/j chez les moins de 8 ans et de 60 mg/j chez les plus de 8 ans ; le palier exact de huit ans doit être vérifié avec le spécialiste. Le comprimé de 10 mg peut se diviser en deux doses similaires ; la rainure de 25 mg ne garantit pas deux doses égales. La voie intrathécale relève d’une autre préparation et d’un autre protocole.</p><p><b>Fonction et organes.</b> Réduire le tonus peut enlever un soutien utile à la station ou à la marche. Évaluer donc force, chutes, transferts et objectif avant d’augmenter. En insuffisance rénale, prudence majeure : la FI signale des toxicités à faibles doses et une initiation particulièrement basse en hémodialyse, autour de 5 mg/j, sans garantie d’innocuité. En insuffisance terminale, bénéfice attendu supérieur aux risques et surveillance étroite sont requis.</p><p>Somnolence, confusion, myoclonies et coma peuvent relever d’une encéphalopathie ; la FI demande l’arrêt en cas de signes, avec conduite médicale urgente adaptée. Cela diffère d’un arrêt planifié après usage prolongé, habituellement progressif sur environ trois semaines selon la FI. L’arrêt brutal peut provoquer rebond, confusion, hallucinations ou crises. Prudence en épilepsie, avec poursuite du traitement anticonvulsivant approprié sous surveillance.</p><p>Interactions importantes : autres dépresseurs du SNC, alcool, opioïdes, certains antidépresseurs, lithium et médicaments altérant la fonction rénale. Risques de sédation, hypotonie et dépression respiratoire à évaluer. Grossesse seulement en nécessité absolue ; ne pas administrer pendant allaitement selon cette FI. La conduite et les activités dangereuses doivent être réévaluées si la vigilance ou les capacités sont affectées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a>.</p></section>
<section class="ilot" id="g09-p-vaccine" ><h2>FSME-Immun : prévention, produit et calendrier attribué</h2><p>La vaccination FSME est préventive. Elle ne restaure pas une audition ou une mémoire déjà altérée et ne traite pas une inflammation active. L’OFSP recommande généralement la vaccination dès trois ans pour les personnes exposées en zone à risque, avec une situation géographique régulièrement actualisée. L’infection naturelle documentée et la simple exposition sont des situations différentes ; la source OFSP décrit une immunité probablement durable après infection.</p><table class="t"><thead><tr><th>Produit, FI juillet 2025</th><th>Âge et dose IM</th><th>Primovaccination de cette FI</th></tr></thead><tbody><tr><td>FSME-Immun CC, GTIN 7680004500039</td><td>Dès 16 ans révolus : 0,5 mL</td><td>Deuxième dose 1–3 mois après première, ou dès 14 jours pour schéma rapide ; troisième 5–12 mois après deuxième</td></tr><tr><td>FSME-Immun 0.25 mL Junior, GTIN 7680006830035</td><td>De 1 an révolu à moins de 16 ans : 0,25 mL ; formulation adulte dès 16 ans</td><td>Mêmes délais de primovaccination, avec formulation pédiatrique propre</td></tr></tbody></table><p><b>Rappels :</b> la page OFSP actuelle indique dix ans si le risque persiste. Les FI décrivent un premier rappel à trois ans, puis cinq ans pour CC de 16–49 ans et trois ans à partir de 50 ans ; Junior décrit trois ans puis cinq ans. Les deux FI renvoient explicitement aux recommandations officielles nationales. Conserver ces attributions et vérifier le calendrier suisse en vigueur, sans fabriquer un intervalle moyen.</p><p>Contre-indications et précautions : hypersensibilité au produit/résidus, allergie sévère aux protéines d’œuf/poulet, report en infection fébrile aiguë et possibilité de réponse diminuée sous immunosuppression. Chez certaines personnes âgées ou immunodéficientes, la FI propose un contrôle de réponse. Prévoir moyens de traitement d’une anaphylaxie et respecter la voie habituelle IM ; toute exception suit la FI et la situation réelle.</p><p>Grossesse : CC seulement si protection urgente nécessaire après évaluation soigneuse bénéfice/risque ; passage des composants dans le lait inconnu. La FI Junior renvoie aux informations du produit adulte. L’autorisation dès un an est distincte de la recommandation générale OFSP dès trois ans. Ne pas substituer arbitrairement volumes ou formulations.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.bag.admin.ch/fr/meningo-encephalite-a-tiques-fsme" target="_blank" rel="noopener">CH-OFSP-PREV — Prévention et vaccination</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener">CH-OFSP-IMMUNITY — Section 2.5, immunité après infection</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680004500039" target="_blank" rel="noopener">FI-FSME-CC — Indication, doses, rappels, précautions, interactions et grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680006830035" target="_blank" rel="noopener">FI-FSME-JUNIOR — Indication, doses, rappels et précautions</a>.</p></section>
<section class="ilot" id="g09-p-populations" ><h2>Populations et cadre suisse : préciser ce qui reste individuel</h2><p>L’enfant demande des mesures adaptées à son développement et des formulations autorisées. La personne âgée peut cumuler déficit sensoriel, comorbidités et modification de fonction rénale. Grossesse, allaitement, organes et autres médicaments imposent une vérification propre à chaque produit ; la mention G09 ne neutralise aucune de ces conditions.</p><p>Le retour à l’école, au travail ou à la conduite se construit avec les capacités et les règles applicables. La source suisse de conduite consultée est datée de novembre 2019 ; son hébergement sous un chemin 2026 ne la rend pas nouvelle. Aucun délai universel d’aptitude n’est présenté ici. Prise en charge, prestations et mesures de réadaptation se vérifient dans le dossier réel, sans droit automatique déduit du code.</p><p>Les situations PROFILES pertinentes incluent notamment fatigue, audition, mémoire/cognition, céphalée et crise. Les cas et quiz MEDINA sont des exercices fictifs originaux, sans statut de questions fédérales officielles. Le plan vaccinal suisse 2026 complet n’a pas été lu lors de cette recherche ; les informations retenues sont attribuées à la page OFSP actuelle, au document 2024 et aux FI exactes 2025.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680004500039" target="_blank" rel="noopener">FI-FSME-CC — Indication, doses, rappels, précautions, interactions et grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680006830035" target="_blank" rel="noopener">FI-FSME-JUNIOR — Indication, doses, rappels et précautions</a> ; <a data-reference-source="1" href="https://www.epi.ch/wp-content/uploads/2026/01/Fahreignung-mit-Epilepsie-Flyer-F.pdf" target="_blank" rel="noopener">CH-EPI — Introduction, contexte et actualisation</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — EPA 2.2 et SSP 4, 28, 101, 102, 105, 207, 219</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, connaissances et compétences cliniques</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/meningo-encephalite-a-tiques-fsme" target="_blank" rel="noopener">CH-OFSP-PREV — Prévention et vaccination</a>.</p></section>
