<template data-pop="g81-sm-definitions" data-title="Hémiplégie et hémiparésie">
<div class="lab">Définition</div><p>L’hémiplégie et l’hémiparésie touchent les membres supérieur et inférieur d’un même côté, ainsi que la face. L’hémiplégie correspond à une paralysie totale ; l’hémiparésie à une paralysie incomplète.</p>
<div class="lab">Variantes</div><p>L’hémiplégie proportionnelle est égale sur tout l’hémicorps. L’hémiplégie brachio-faciale prédomine à la face et au bras. Une monoparésie ne touche qu’un membre.</p>
<div class="lab">Limite</div><p>La CIM-10-GM réunit les deux termes sous G81 ; la cotation de 0 à 5 précise le degré, groupe musculaire par groupe musculaire.</p>
<p class="src">Référence : Université médicale virtuelle francophone, sémiologie neurologique, § 2.4 « Topographie des atteintes pyramidales » (Pottier, 2013).</p></template>
<template data-pop="g81-sm-cotation" data-title="Cotation de la force musculaire de 0 à 5">
<div class="lab">Échelle</div><p>0 : aucune contraction. 1 : contraction visible sans mouvement. 2 : mouvement possible en l’absence de pesanteur. 3 : mouvement contre la pesanteur. 4 : mouvement contre résistance. 5 : force normale.</p>
<div class="lab">Technique</div><p>Le médecin teste chaque groupe musculaire et compare les deux côtés. Le patient est installé de façon à pouvoir éliminer la pesanteur pour distinguer 2 de 3.</p>
<div class="lab">Piège</div><p>Une cotation à 5 n’exclut pas une atteinte pyramidale discrète : les gestes fins distaux sont touchés les premiers.</p>
<p class="src">Référence : Université médicale virtuelle francophone, sémiologie neurologique, § 1.1 « Examen musculaire » (cotation du site de Rouen).</p></template>
<template data-pop="g81-sm-maladresse" data-title="Maladresse distale">
<div class="lab">Mécanisme</div><p>Dans le syndrome pyramidal, la force est souvent conservée ou peu altérée, mais les gestes sont malhabiles et les mouvements fins distaux difficiles ou impossibles.</p>
<div class="lab">Valeur</div><p>Le thumb rolling était anormal chez 88 % des 17 patients d’une série d’AVC moteurs purs légers, l’épreuve de pronation chez 47 %.</p>
<div class="lab">Piège</div><p>Conclure « force normale, examen normal » fait manquer un déficit discret. La fréquence de la maladresse dans l’AVC n’est pas chiffrée dans les sources lues.</p>
<p class="src">Références : UMVF, § 2.4 ; Nowak, Can J Neurol Sci 2011;38(1):129-32.</p></template>
<template data-pop="g81-sm-spasticite" data-title="Hypertonie spastique : technique et mécanisme">
<div class="lab">Normal</div><p>Chez le sujet sain relâché, aucun réflexe d’étirement n’apparaît entre 60 et 180 °/s ; il n’apparaît qu’au-delà d’environ 200 °/s.</p>
<div class="lab">Technique</div><p>Le médecin mobilise passivement le segment lentement, puis rapidement. Une résistance qui naît à partir d’un certain angle et croît avec la vitesse est spastique, dite « élastique ».</p>
<div class="lab">Mécanisme</div><p>La facilitation réticulospinale médiane prédomine sur l’inhibition réticulospinale dorsale ; les inhibitions spinales diminuent.</p>
<div class="lab">Piège</div><p>Une résistance indépendante de la vitesse traduit plutôt une hypertonie intrinsèque du muscle raccourci. Aucune sensibilité ni spécificité de ce signe n’est donnée par les sources lues.</p>
<p class="src">Références : Trompetto et al., Biomed Res Int 2014 ; UMVF, § 2.4.</p></template>
<template data-pop="g81-sm-babinski" data-title="Réflexe cutané plantaire et signe de Babinski">
<div class="lab">Technique</div><p>Le patient est en décubitus dorsal, genou et cheville en demi-flexion. Le médecin stimule le bord externe de la plante d’arrière en avant avec une pointe mousse.</p>
<div class="lab">Normal et pathologique</div><p>La réponse normale est une flexion du gros orteil. Le signe de Babinski est une extension lente du gros orteil, parfois avec un écartement des autres orteils.</p>
<div class="lab">Chronologie et limite</div><p>Le Babinski apparaît tôt après la lésion, avant la spasticité. Sa sensibilité et sa spécificité ne sont pas chiffrées dans les sources lues.</p>
<p class="src">Références : UMVF, § 1.2.2 ; Trompetto 2014.</p></template>
<template data-pop="g81-sm-dissociation" data-title="Dissociation automatico-volontaire">
<div class="lab">Définition</div><p>Le déficit pyramidal est surtout apparent dans le mouvement volontaire et s’atténue dans l’activité spontanée.</p>
<div class="lab">Exemple</div><p>La paralysie faciale centrale est nette dans la grimace sur ordre et disparaît dans le sourire spontané. Elle prédomine sur le bas du visage.</p>
<div class="lab">Différentiel</div><p>La paralysie faciale périphérique touche toute l’hémiface, front compris, et s’accentue dans la mimique et le mouvement volontaire.</p>
<p class="src">Référence : UMVF, § 2.4 et § 1.5.5.</p></template>
<template data-pop="g81-sm-alterne" data-title="Syndromes alternes du tronc cérébral">
<div class="lab">Principe</div><p>Une lésion du tronc cérébral atteint un nerf crânien du côté de la lésion et la voie pyramidale avant sa décussation : l’hémiplégie est controlatérale.</p>
<div class="lab">Exemples</div><p>Weber (pédoncule) : III homolatéral et hémiplégie controlatérale. Millard-Gubler (protubérance) : VII périphérique homolatéral et hémiplégie controlatérale respectant la face. Bulbe médian : XII homolatéral et hémiplégie respectant la face.</p>
<div class="lab">Lecture</div><p>Le niveau se déduit du nerf crânien atteint. Si la lésion siège au-dessus du noyau du facial, l’hémiplégie touche la face ; au-dessous, elle la respecte.</p>
<p class="src">Référence : UMVF, § 2.10 « Syndromes alternés » et § 2.4.</p></template>
<template data-pop="g81-sm-brown" data-title="Syndrome de Brown-Séquard">
<div class="lab">Définition</div><p>Lésion d’une hémi-moelle latérale.</p>
<div class="lab">Signes</div><p>Sous la lésion : syndrome pyramidal et syndrome cordonnal postérieur du même côté ; déficit thermo-algique du côté opposé, proprioception respectée de ce côté.</p>
<div class="lab">Piège</div><p>L’hémiplégie est homolatérale à la lésion et la face est respectée : une hémiparésie sans atteinte faciale doit faire examiner la sensibilité.</p>
<p class="src">Référence : UMVF, § 2.8 « Syndrome de Brown-Séquard ».</p></template>
