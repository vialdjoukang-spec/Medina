<section class="ilot" id="e07-0"><h2><span class="n">0</span>Question clinique</h2>
<p>La catégorie E07 réunit des situations qui n’ont en commun qu’une chose : un <b>résultat biologique ou morphologique thyroïdien qui ne correspond pas à la clinique attendue</b>. Cinq scénarios, tous <b>fictifs</b> dans cette leçon, ouvrent le cours et guident chaque partie.</p>
<ol><li><b>Un nodule et une calcitonine élevée.</b> Une femme de 52 ans consulte pour un nodule thyroïdien découvert à l’échographie ; la calcitonine basale est à 40 pg/ml. S’agit-il d’une hyperplasie bénigne des cellules C ou d’un cancer médullaire débutant ?</li><li><b>Un goitre chez un nouveau-né.</b> Un nourrisson au quatrième jour de vie a un dépistage néonatal anormal ; l’échographie montre une glande en place, augmentée de volume. Sa famille compte un cousin sourd. Quelle est la cause, et que faut-il prescrire avant toute imagerie ?</li><li><b>Une thyroxine totale basse chez un sujet en bonne santé.</b> Un homme de 30 ans a une thyroxine totale basse, mais une thyroxine libre et une thyréostimuline normales. Faut-il traiter ?</li><li><b>Un patient de soins intensifs.</b> Après une chirurgie abdominale compliquée de sepsis, un patient a une triiodothyronine basse, une thyroxine basse et une thyréostimuline normale. S’agit-il d’une hypothyroïdie ?</li><li><b>Une tuméfaction cervicale brutale.</b> Après une ponction, un adulte présente une augmentation rapide du cou et une gêne respiratoire : l’évaluation des voies aériennes précède le bilan étiologique.</li></ol>
<p>Dans ces situations, la réponse exige de comprendre comment la glande synthétise ses hormones, comment le sang les transporte et comment la biologie les mesure. L’erreur la plus coûteuse est identique partout : prendre un chiffre isolé pour une maladie, puis traiter ou opérer sur cette seule base. La leçon enseigne donc, pour chaque situation, le mécanisme, la conduite et la mise en garde propre à la source qui la fonde.</p>
<div class="key"><b>À retenir.</b> E07 est un code résiduel : on ne le traite pas comme une maladie unique, mais comme plusieurs démarches : hypercalcitoninémie, défaut de synthèse, protéine de transport, maladie non thyroïdienne et lésion hémorragique ou ischémique. Chacune a sa règle de décision, et aucune ne dispense de rechercher une urgence, une maladie concomitante ou un cancer.</div>
</section>

<section class="ilot" id="e07-1"><h2><span class="n">1</span>Définition, classification et périmètre</h2>
<p>La classification statistique suisse CIM-10-GM 2024, publiée par l’Office fédéral de la statistique, nomme la catégorie <b>E07, Autres affections de la thyroïde</b> et lui attribue quatre sous-codes <button class="w" data-k="e07-nosologie">libellés officiels et notes d’inclusion et d’exclusion</button>. Les notes d’inclusion ont été contrôlées dans le navigateur britannique de la classification internationale ; l’office suisse ne publie ici que les libellés, ce qui limite la précision de la correspondance.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Sous-code</th><th style="min-width:10em">Libellé</th><th style="min-width:10em">Contenu (notes d’inclusion)</th><th style="min-width:10em">Monographie dans cette leçon</th></tr></thead><tbody>
<tr><td style="min-width:10em">E07.0</td><td style="min-width:10em">Hypersécrétion de calcitonine</td><td style="min-width:10em">Hyperplasie des cellules C ; hypersécrétion de thyrocalcitonine</td><td style="min-width:10em">Partie A</td></tr>
<tr><td style="min-width:10em">E07.1</td><td style="min-width:10em">Goitre dû à un trouble de l’hormonosynthèse</td><td style="min-width:10em">Goitre dyshormonogénétique familial ; syndrome de Pendred</td><td style="min-width:10em">Partie B</td></tr>
<tr><td style="min-width:10em">E07.8</td><td style="min-width:10em">Autres affections précisées de la thyroïde</td><td style="min-width:10em">Anomalie de la globuline liant la thyroxine ; hémorragie et infarctus de la thyroïde ; syndrome de basse triiodothyronine (maladie non thyroïdienne)</td><td style="min-width:10em">Parties C, D et E</td></tr>
<tr><td style="min-width:10em">E07.9</td><td style="min-width:10em">Affection de la thyroïde, sans précision</td><td style="min-width:10em">Aucune note</td><td style="min-width:10em">Code de repli</td></tr></tbody></table>
<p>Le tableau montre qu’un même code recouvre des mécanismes sans rapport entre eux. La conséquence pédagogique est simple : on ne cherche pas un « traitement de E07 », mais le sous-groupe auquel appartient le patient. Cinq frontières évitent les confusions de codage et de conduite.</p>
<ul><li>Le <b>carcinome médullaire de la thyroïde</b> est codé en C73 ; il n’intervient ici que comme diagnostic différentiel et comme enjeu de l’hypercalcitoninémie.</li><li>L’<b>hypothyroïdie congénitale par dysgénésie</b> (athyréose, ectopie, hypoplasie) relève de E03.1 ; la dyshormonogenèse s’en distingue par un mécanisme de synthèse et, le plus souvent, par un goitre.</li><li>Le <b>goitre congénital transitoire à fonction normale</b> est exclu de E07.1 et codé en P72.0.</li><li>Le <b>diagnostic de l’hypothyroïdie primaire de l’adulte</b> n’appartient pas à E07 ; le syndrome de maladie non thyroïdienne est précisément ce qu’il faut distinguer d’elle.</li><li>E07.9 est un code résiduel sans conduite propre : on le réserve aux situations dont la nature n’est pas précisée.</li></ul>
<div class="trap"><span class="k">Piège</span> Coder E07.0 devant toute calcitonine élevée : l’hypercalcitoninémie a de nombreuses causes extra-thyroïdiennes et le cancer médullaire est codé ailleurs. Le code décrit un diagnostic établi, non un résultat de laboratoire isolé.</div>
<div class="key"><b>À retenir.</b> E07.0, hypercalcitoninémie et hyperplasie des cellules C ; E07.1, dyshormonogenèse et syndrome de Pendred ; E07.8, protéine de transport, hémorragie et maladie non thyroïdienne ; E07.9, sans précision.</div>
</section>

<section class="ilot" id="e07-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Les fréquences ne sont comparables qu’à population égale. Le tableau regroupe les chiffres lus dans les sources, avec leur population, car un chiffre sans population induit en erreur.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Entité</th><th style="min-width:10em">Fréquence rapportée</th><th style="min-width:10em">Population et source</th></tr></thead><tbody>
<tr><td style="min-width:10em">Hypothyroïdie congénitale primaire</td><td style="min-width:10em">Environ 1/3000 à 1/2000 naissances</td><td style="min-width:10em">Nouveau-nés ; consensus <button class="w" data-k="e07-hc">hypothyroïdie congénitale (épidémiologie et causes)</button></td></tr>
<tr><td style="min-width:10em">Hypothyroïdie congénitale centrale</td><td style="min-width:10em">Jusqu’à environ 1/16 000</td><td style="min-width:10em">Nouveau-nés ; même consensus</td></tr>
<tr><td style="min-width:10em">Dysgénésie thyroïdienne</td><td style="min-width:10em">Environ 65 % de l’hypothyroïdie congénitale primaire permanente</td><td style="min-width:10em">Même consensus</td></tr>
<tr><td style="min-width:10em">Glande en place</td><td style="min-width:10em">Environ 35 % ; moins de la moitié relèvent d’un défaut héréditaire de synthèse</td><td style="min-width:10em">Même consensus</td></tr>
<tr><td style="min-width:10em">Syndrome de Pendred</td><td style="min-width:10em">4 à 7,5 % des surdités héréditaires ; 7,5 à 10 pour 100 000 hors populations africaines</td><td style="min-width:10em">Revue audiologique 2026 ; étude soudanaise 2025 (fait épidémiologique seul)</td></tr>
<tr><td style="min-width:10em">Déficit partiel en thyroxine-binding globulin</td><td style="min-width:10em">Environ 1/4000 nouveau-nés</td><td style="min-width:10em">Série coréenne 2022</td></tr>
<tr><td style="min-width:10em">Déficit complet</td><td style="min-width:10em">Environ 1/15 000 nouveau-nés</td><td style="min-width:10em">Même série</td></tr>
<tr><td style="min-width:10em">Carcinome médullaire parmi les nodules</td><td style="min-width:10em">Prévalence d’environ 0,23 à 0,32 %</td><td style="min-width:10em">Personnes avec nodule ; <button class="w" data-k="e07-cochrane">revue Cochrane 2020 sur le dosage de la calcitonine</button></td></tr>
<tr><td style="min-width:10em">Hyperplasie des cellules C opératoire</td><td style="min-width:10em">73,8 % des goitres multinodulaires (31/42) ; 45,7 % des carcinomes papillaires (16/35)</td><td style="min-width:10em">Série chirurgicale italienne ; patients opérés, donc non représentatifs de la population générale</td></tr></tbody></table>
<p>Ces chiffres appellent trois lectures. D’abord, les maladies de la partie B et de la partie C se transmettent selon des modes précis : récessif autosomique pour la plupart des dyshormonogenèses, avec un risque de récurrence de 25 % lorsque les deux parents portent un variant pathogène du même gène dans un modèle récessif, et lié au chromosome X pour la globuline liant la thyroxine. Ensuite, la rareté du cancer médullaire parmi les nodules réduit la valeur prédictive d’une faible élévation de calcitonine ; un résultat franchement élevé ou un contexte familial ne reçoit pas la même interprétation. Pour le dépistage néonatal suisse, les données institutionnelles indiquent : le prélèvement est effectué au <b>quatrième jour de vie</b>, le laboratoire national se trouve à Zurich, environ 80 000 à 85 000 échantillons sont analysés chaque année et onze maladies hormonales et métaboliques sont dépistées <button class="w" data-k="e07-depistage">dépistage néonatal en Suisse</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Appliquer à un nodule isolé la prévalence du cancer médullaire d’une série chirurgicale. Dans une série opératoire, les patients ont déjà été sélectionnés sur des critères suspects ; dans la population des nodules, la prévalence est de l’ordre de 3 pour 1000.</div>
<div class="key"><b>À retenir.</b> Hypothyroïdie congénitale primaire : 1/3000 à 1/2000. Déficit partiel en protéine de transport : 1/4000. Cancer médullaire parmi les nodules : moins de 0,5 %. Aucune donnée suisse de prévalence n’a été lue pour la partie A, C ou D.</div>

<section class="ilot" id="e07-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiologie normale précède chaque pathologie, parce que chaque erreur de laboratoire de E07 est la déformation d’un mécanisme normal.</p>
<h3>3.1 La calcitonine et les cellules C (partie A)</h3>
<p>Les cellules C, ou parafolliculaires, de la thyroïde produisent la calcitonine, un peptide de <b>32 acides aminés</b>. Il dérive de la procalcitonine (116 acides aminés), elle-même issue d’une pré-prohormone de 141 acides aminés <button class="w" data-k="e07-calcitonine-phys">calcitonine : précurseurs, rôle et valeurs normales</button>. Le rôle proposé est l’homéostasie calcique, par inhibition des ostéoclastes et de la réabsorption rénale du calcium. Après thyroïdectomie totale, l’absence de calcitonine n’entraîne pas de trouble calcique net, ce qui suggère une redondance physiologique : la calcitonine n’est donc pas indispensable à la calcémie, et son intérêt clinique est essentiellement celui d’un <b>marqueur</b>.</p>
<p>Une hyperplasie de ces cellules augmente la masse sécrétante ; une tumeur issue d’elles, le carcinome médullaire, la fait progresser davantage. Le dosage monte donc dans les deux situations, ce qui explique à la fois la sensibilité du marqueur et sa faible spécificité aux valeurs modérément élevées <button class="w" data-k="e07-hcc">hyperplasie des cellules C : physiologique et néoplasique</button>.</p>
<h3>3.2 La synthèse des hormones thyroïdiennes (partie B)</h3>
<p>La synthèse suit une chaîne dont chaque étape dépend d’une protéine codée par un gène précis. Un défaut héréditaire de l’une d’elles bloque la production d’hormones, c’est une <b>dyshormonogenèse</b> <button class="w" data-k="e07-genes">gènes de l’hormonosynthèse et phénotypes</button>. L’original ci-dessous situe la glande et le follicule ; la chaîne fonctionnelle est détaillée dans le texte et le tableau des gènes, sans prétendre dessiner un nouveau modèle anatomique.</p>
<figure class="e07-figure" style="margin:1.4em auto;max-width:46rem" id="e07-figure-clinique"><div class="e07-image" style="position:relative;width:100%;background:#fff"><img style="display:block;width:100%;height:auto" src="assets/img/e07/alpha/codex/e07-thyroide-normale-openstax2013.jpg" alt="Original OpenStax 2013 : vues antérieure et postérieure de la thyroïde et microphotographie de follicules, avec repères français numérotés" loading="lazy" width="737" height="1410"><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:48%;top:17%">1</span><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:48%;top:25%">2</span><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:26%;top:75%">3</span><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:46%;top:88.7%">4</span></div><figcaption><b>Original anatomique et histologique.</b> 1 : isthme en avant de la trachée ; 2 : anneaux trachéaux ; 3 : colloïde dans la lumière folliculaire ; 4 : épithélium folliculaire au bord de la colloïde. La cellule parafolliculaire est indiquée par le libellé anglais original ; cette image normale ne diagnostique pas une hyperplasie. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">OpenStax College</a>, <i>Anatomy &amp; Physiology</i>, édition 2013 ; microphotographie créditée aux Regents of University of Michigan Medical School (2012). <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">Source exacte</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Octets originaux conservés ; chiffres français superposés sans modification des pixels. La licence de cette version ne se déduit pas de celle des éditions actuelles.</figcaption></figure>
<p>Lorsque la synthèse devient insuffisante, la FT4 peut diminuer et la <button class="w" data-k="e07-hormones-local">TSH</button> augmenter, stimulant la croissance glandulaire. Un <b>goitre</b> est donc possible, sans être obligatoire : formes transitoires, non goitreuses et parfois hypoplasiques sont décrites, notamment avec DUOX2, <button class="w" data-k="e07-tpo-local">TPO</button> ou SLC26A4. La présence d’une glande en place ne suffit pas à prouver une dyshormonogenèse, et une <button class="w" data-k="e07-hormones-local">T3</button> conservée ne l’exclut pas. Imagerie, histoire et tests orientés précisent le mécanisme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>].</p>
<h3>3.3 Le transport des hormones (partie C)</h3>
<p>La globuline liant la thyroxine est la principale protéine de transport : elle lie environ 70 % de la triiodothyronine et 75 % de la thyroxine sériques. Elle est une glycoprotéine hépatique de 54 kDa, codée par le gène <b>SERPINA7</b> sur le chromosome X <button class="w" data-k="e07-tbg">globuline liant la thyroxine : physiologie et génétique</button>. Si elle est quantitativement basse, les hormones totales baissent mais la fraction libre, biologiquement active, reste normale : le sujet est euthyroïdien. La concentration totale peut donc être <b>réellement basse</b> sans déficit de la fraction libre : c’est une anomalie de transport, pas nécessairement une erreur de mesure. Certains variants entraînent en plus des résultats de FT4 dépendants de l’immunodosage. Une maladie thyroïdienne véritable peut coexister [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>].</p>
<h3>3.4 La maladie non thyroïdienne (partie D)</h3>
<p>Une maladie aiguë peut abaisser la <button class="w" data-k="e07-hormones-local">T3</button> par des mécanismes centraux et périphériques. Dans les modèles inflammatoires, le facteur nucléaire kappa B et la DIO2 hypothalamique contribuent à la diminution de TRH ; la DIO1 hépatique diminue fréquemment. DIO2, DIO3, transporteurs et récepteurs changent différemment selon organe et durée. La reverse-T3 n’est pas toujours élevée. Les concentrations sanguines ne décrivent donc pas directement l’action hormonale tissulaire <button class="w" data-k="e07-smnt-meca">mécanismes et limites du syndrome de maladie non thyroïdienne</button> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>Science → clinique.</b> Défaut de synthèse : hormones basses, thyréostimuline haute, goitre. Défaut de transport : hormones totales basses, hormones libres et thyréostimuline normales. Maladie critique : triiodothyronine basse, thyréostimuline normale ou basse. Trois profils biologiques, trois conduites : traiter tôt, ne pas traiter, ne pas traiter sans autre indication.</div>
</section>

<section class="ilot" id="e07-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<h3>4.1 Hypercalcitoninémie : une liste de causes avant le cancer</h3>
<p>Plusieurs situations élèvent la calcitonine sans cancer médullaire. Le tableau donne les valeurs typiques rapportées par une revue de référence de 2026 <button class="w" data-k="e07-ct-causes">causes non médullaires d’hypercalcitoninémie et valeurs typiques</button>.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Cause</th><th style="min-width:10em">Calcitonine typique (pg/ml)</th><th style="min-width:10em">Précision de la source</th></tr></thead><tbody>
<tr><td style="min-width:10em">Tabagisme, surtout chez l’homme</td><td style="min-width:10em">10–15</td><td style="min-width:10em">Surtout chez l’homme</td></tr>
<tr><td style="min-width:10em">Goitre ou augmentation de la masse thyroïdienne</td><td style="min-width:10em">10–20</td><td style="min-width:10em">Augmentation de la masse thyroïdienne</td></tr>
<tr><td style="min-width:10em">Thyroïdite auto-immune</td><td style="min-width:10em">10–15</td><td style="min-width:10em">Liée au volume plus qu’à l’auto-immunité</td></tr>
<tr><td style="min-width:10em">Inhibiteur de la pompe à protons, hypergastrinémie</td><td style="min-width:10em">10–20</td><td style="min-width:10em">Hypergastrinémie associée</td></tr>
<tr><td style="min-width:10em">Gastrite auto-immune, anémie de Biermer</td><td style="min-width:10em">15–40</td><td style="min-width:10em">Hypergastrinémie</td></tr>
<tr><td style="min-width:10em">Insuffisance rénale chronique légère à modérée ; avancée</td><td style="min-width:10em">10–20 ; 20–50 (rarement &gt; 100)</td><td style="min-width:10em">Valeurs plus élevées si l’insuffisance est avancée</td></tr>
<tr><td style="min-width:10em">Hyperplasie des cellules C sporadique ; sévère</td><td style="min-width:10em">20–50 ; 50–100</td><td style="min-width:10em">Sévère : rare hors néoplasie endocrinienne multiple</td></tr>
<tr><td style="min-width:10em">Hypercalcémie non médullaire</td><td style="min-width:10em">10–20</td><td style="min-width:10em">Hypercalcémie d’origine non médullaire</td></tr>
<tr><td style="min-width:10em">Sepsis, inflammation aiguë</td><td style="min-width:10em">10–40 (transitoire)</td><td style="min-width:10em">Élévation transitoire</td></tr>
<tr><td style="min-width:10em">Carcinome thyroïdien différencié</td><td style="min-width:10em">10–20</td><td style="min-width:10em">Carcinome thyroïdien différencié, non médullaire</td></tr>
<tr><td style="min-width:10em">Carcinome pulmonaire à petites cellules</td><td style="min-width:10em">100–1000 et plus</td><td style="min-width:10em">Sécrétion par une autre tumeur neuroendocrine</td></tr>
<tr><td style="min-width:10em">Tumeur neuroendocrine du pancréas</td><td style="min-width:10em">20–300</td><td style="min-width:10em">Sécrétion par une autre tumeur neuroendocrine</td></tr>
<tr><td style="min-width:10em">Carcinome neuroendocrine de la prostate</td><td style="min-width:10em">50–300</td><td style="min-width:10em">Sécrétion par une autre tumeur neuroendocrine</td></tr></tbody></table>
<p>Ce tableau fixe un ordre de grandeur utile : la plupart des causes bénignes restent sous 50 pg/ml, alors que les sécrétions ectopiques peuvent atteindre plusieurs centaines. Il montre aussi que les chevauchements existent, ce qui interdit toute conclusion à partir d’un seul dosage. Les causes analytiques s’y ajoutent : <button class="w" data-k="e07-ct-interference">interférences et conditions de prélèvement de la calcitonine</button>.</p>
<h3>4.2 Dyshormonogenèse : plusieurs gènes et phénotypes possibles par étape</h3>
<p>Les causes sont génétiques. La transmission est généralement autosomique récessive, avec un risque de 25 % dans la fratrie lorsque les deux parents sont porteurs pour une même maladie récessive ; certains gènes (DUOX1, DUOX2, IYD) montrent une transmission dominante ou une pénétrance incomplète. Une oligogénicité est décrite. Le syndrome de Pendred relève de mutations biallèliques de <b>SLC26A4</b> (pendrine) <button class="w" data-k="e07-pendred">syndrome de Pendred</button>.</p>
<h3>4.3 Anomalie de la globuline liant la thyroxine : causes héréditaires et acquises</h3>
<p>La quantité de <button class="w" data-k="e07-tbg">TBG</button> et son affinité peuvent varier indépendamment. Un déficit héréditaire lié à SERPINA7 abaisse les hormones totales ; une duplication ou triplication peut produire un excès et une hyperthyroxinémie totale avec euthyroïdie. Les œstrogènes et la grossesse augmentent aussi la liaison. La maladie grave et l’hypoprotéinémie de la cirrhose peuvent la diminuer ; certains médicaments déplacent <button class="w" data-k="e07-hormones-local">T4</button> de ses protéines. Ces effets ne dispensent pas de vérifier FT4, <button class="w" data-k="e07-hormones-local">TSH</button> et méthode, car une dysfonction authentique peut coexister <button class="w" data-k="e07-facteurs-liaison">facteurs de liaison</button> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>].</p>
<h3>4.4 Maladie non thyroïdienne et hémorragie</h3>
<p>Le syndrome de maladie non thyroïdienne peut accompagner une maladie aiguë ou critique, la restriction calorique et les médicaments qui agissent sur l’axe : la <b>dopamine</b> et les <b>glucocorticoïdes à haute dose</b> abaissent la thyréostimuline. L’hémorragie thyroïdienne est rapportée sur un goitre préexistant après un traumatisme, dans un contexte dont l’anticoagulation doit être documentée et, exceptionnellement, après une cytoponction <button class="w" data-k="e07-hemorragie">hémorragie de la thyroïde : cas rapportés</button>.</p>
<div class="trap"><span class="k">Piège</span> Rechercher le cancer médullaire sans avoir listé les médicaments et les maladies de l’estomac, du rein et du poumon : un inhibiteur de la pompe à protons, une anémie de Biermer ou une insuffisance rénale peuvent contribuer à une élévation sans démontrer sa cause chez ce patient.</div>
<div class="key"><b>À retenir.</b> Calcitonine : causes bénignes le plus souvent entre 10 et 50 pg/ml ; sécrétions ectopiques jusqu’à plusieurs centaines. Dyshormonogenèse : plusieurs gènes et phénotypes possibles par étape, récessive le plus souvent. Protéine de transport : liée à l’X.</div>
<button class="pareto-btn ui" data-k="pareto-e07-mecanismes">▲ Loi de Pareto — Mécanismes et causes</button>
</section>

<section class="ilot" id="e07-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse est conduite selon la porte d’entrée, car les cinq parties de E07 se présentent par des motifs différents. Elle cherche d’abord ce qui rend le résultat biologique plausible sans maladie thyroïdienne, puis ce qui évoque une maladie héréditaire.</p>
<h3>5.1 Antécédents à rechercher</h3>
<ul><li><b>Pour la calcitonine</b> : antécédent personnel ou familial de cancer médullaire ou de <button class="w" data-k="e07-ret">néoplasie endocrinienne multiple de type 2 et gène RET</button>, tabagisme, prise d’<button class="w" data-k="e07-ct-causes">inhibiteur de la pompe à protons</button>, maladie gastrique auto-immune, insuffisance rénale, goitre ou thyroïdite connus.</li><li><b>Pour la dyshormonogenèse</b> : consanguinité, goitre ou surdité dans la fratrie ou la famille, dépistage néonatal anormal, hypothyroïdie congénitale connue dans la famille.</li><li><b>Pour la globuline liante</b> : valeurs de thyroxine totale basses chez des hommes de la famille, grossesse, traitement œstrogénique.</li><li><b>Pour la maladie non thyroïdienne</b> : maladie aiguë, chirurgie récente, jeûne, dopamine ou glucocorticoïdes à haute dose.</li><li><b>Pour l’hémorragie</b> : goitre connu, traumatisme cervical, anticoagulation, ponction récente.</li></ul>
<h3>5.2 Symptômes selon la partie</h3>
<p>Les symptômes sont rares et indirects. Un nodule est le plus souvent asymptomatique. Chez le nouveau-né dyshormonogénétique, le goitre peut devenir compressif <button class="w" data-k="e07-goitre-neonatal">goitre congénital compressif et goitre fœtal</button>. La surdité d’un enfant ou d’un adulte, parfois ancienne, est le symptôme cardinal du syndrome de Pendred. Le déficit isolé en globuline liante ne produit pas de symptômes de dysfonction thyroïdienne. Le syndrome de maladie non thyroïdienne n’a pas de symptôme propre : il est celui de la maladie causale. L’hémorragie thyroïdienne donne une tuméfaction cervicale brutale, douloureuse, avec risque respiratoire.</p>
<div class="two"><div class="card"><h4>Formes typiques</h4><p><b>Nodule avec calcitonine modérément élevée</b> chez une femme de 52 ans, fumeuse, sous inhibiteur de la pompe à protons depuis des années : la calcitonine est à 40 pg/ml, le reste du bilan est normal. <b>Enfant sourd avec goitre</b> : surdité neurosensorielle congénitale, goitre, aqueduc vestibulaire élargi. <b>Patient en soins intensifs</b> : triiodothyronine basse, thyréostimuline normale.</p></div><div class="card"><h4>Formes trompeuses</h4><p><b>Faux diagnostic de cancer médullaire</b> sur une macrocalcitonine ou un anticorps hétérophile. <b>Faux diagnostic d’hypothyroïdie centrale</b> chez un nouveau-né dont le dépistage fondé sur la thyroxine est anormal à cause d’une globuline liante de faible affinité. <b>Hypothyroïdie confondue avec une maladie non thyroïdienne</b> en phase de récupération, où la thyréostimuline peut remonter.</p></div></div>
<div class="trap"><span class="k">Piège</span> L’absence de symptôme n’écarte pas une anomalie découverte fortuitement ou dans un dépistage indiqué. Elle n’impose pas pour autant tous les dosages à toute personne asymptomatique : l’indication dépend du contexte.</div>
<div class="key"><b>À retenir.</b> Trois questions guident l’anamnèse : quels facteurs non thyroïdiens expliquent le résultat ? y a-t-il une surdité ou un goitre dans la famille ? le patient est-il gravement malade ou sous médicament qui agit sur l’axe ?</div>
</section>

<section class="ilot" id="e07-6"><h2 data-semiology-clinical="E07"><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, anthropométrie, puis signes ciblés. Dans E07, il oriente moins qu’il ne protège : il cherche ce qui impose l’urgence (voies aériennes) et ce qui oriente la famille de causes.</p>
<div class="two"><div class="card"><h4>Cou et thyroïde</h4><p>Inspecter et palper le cou : volume de la glande, caractère diffus ou nodulaire, adénopathies cervicales. Chez le nouveau-né, un goitre volumineux peut dévier ou comprimer la trachée et provoquer une détresse respiratoire <button class="w" data-k="e07-goitre-neonatal">goitre compressif du nouveau-né</button>. Une tuméfaction brutale, douloureuse, chez un patient sous anticoagulant impose d’évaluer la perméabilité des voies aériennes <button class="w" data-k="e07-hemorragie">hémorragie thyroïdienne</button>.</p></div><div class="card"><h4>Audition et développement</h4><p>Répéter les tests auditifs chez tout enfant ayant une hypothyroïdie congénitale avant l’âge scolaire, selon le consensus ENDO-ERN. Une surdité neurosensorielle congénitale, avec ou sans goitre, fait évoquer le syndrome de Pendred.</p></div><div class="card"><h4>Signes d’hypothyroïdie</h4><p>Chez le patient de soins intensifs, l’hypothermie et les troubles de conscience évoquent un coma myxœdémateux, à rechercher même si la <button class="w" data-k="e07-hormones-local">TSH</button> n’est pas élevée lorsque médicaments ou atteinte centrale modifient l’axe <button class="w" data-k="e07-smnt-dd">diagnostic différentiel de la maladie non thyroïdienne</button>.</p></div><div class="card"><h4>Cancer médullaire à exclure</h4><p>L’examen palpe le cou à la recherche de nodules et d’adénopathies cervicales, mais la palpation ne remplace ni le dosage ni la cytologie : la cytoponction seule méconnaît souvent le cancer médullaire. L’examen cherche aussi les signes d’autres atteintes des néoplasies endocriniennes multiples de type 2 chez les porteurs de la mutation RET <button class="w" data-k="e07-ret">dépistage du phéochromocytome</button>.</p></div></div>
<p>L’examen clinique a une valeur limitée dans les formes biologiques pures (déficit en globuline liante, hyperplasie des cellules C sans nodule) : il est alors normal. C’est précisément ce qui impose de ne pas traiter sur le seul chiffre.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à l’absence de goitre chez un nouveau-né parce que le cou est plat : un goitre congénital massif peut menacer les voies aériennes dès la naissance, et la respiration est le premier signe à surveiller.</div>
<div class="key"><b>À retenir.</b> L’examen cherche trois choses : compression des voies aériennes, surdité, signes d’une hypothyroïdie ou d’une néoplasie endocrinienne. Un examen normal ne protège pas contre une calcitonine élevée.</div>
<button class="pareto-btn ui" data-k="pareto-e07-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>

<section class="ilot" id="e07-7"><h2><span class="n">7</span>Démarche diagnostique et diagnostic différentiel</h2>
<p>Chaque partie de E07 a sa propre démarche, mais toutes obéissent à la même règle : <b>interpréter le résultat avec la population, la méthode de dosage et le contexte</b> avant de décider d’un traitement ou d’une opération.</p>
<h3>7.1 Calcitonine élevée : de la zone grise à la décision</h3>
<p>Le repère général de 10 pg/ml ne définit pas à lui seul une calcitonine normale ; l’homme a des valeurs plus élevées que la femme, l’enfant aussi, et tous les seuils dépendent de la méthode de dosage. La revue de référence de 2026 place une <b>zone grise entre 10 et 100 pg/ml</b>, souvent due à une hyperplasie des cellules C, et juge une valeur <b>supérieure à 100 pg/ml</b> évocatrice d’un cancer médullaire <button class="w" data-k="e07-ct-seuils">seuils d’interprétation de la calcitonine</button>. Les recommandations européennes de 2023 sur les nodules fixent des seuils d’action à plus de 30 pg/ml chez la femme et plus de 34 pg/ml chez l’homme, en soulignant que plusieurs variables influencent ce seuil. Les recommandations allemandes citées par la même revue indiquent environ 30 pg/ml chez la femme et 60 pg/ml chez l’homme : les seuils diffèrent selon l’origine, ce qui illustre pourquoi aucun chiffre ne se transpose sans sa source.</p>
<figure><svg style="max-width:100%;height:auto" viewBox="0 0 560 330" role="img" aria-label="Figure 2 — Démarche devant une calcitonine élevée" font-family="Atkinson Hyperlegible, sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="1.5"><rect x="150" y="8" width="260" height="38" rx="6"/><rect x="20" y="86" width="160" height="62" rx="6"/><rect x="200" y="86" width="160" height="62" rx="6"/><rect x="380" y="86" width="160" height="62" rx="6"/><rect x="20" y="190" width="160" height="62" rx="6"/><rect x="200" y="190" width="160" height="62" rx="6"/><rect x="380" y="190" width="160" height="62" rx="6"/><path d="M280 46v20M100 66h360M100 66v20M280 66v20M460 66v20M100 148v42M280 148v42M460 148v42"/></g><g fill="#222"><text x="170" y="32">Interpréter la calcitonine basale</text><text x="36" y="108">Dans la norme du labo</text><text x="36" y="126">Contexte et risque</text><text x="216" y="108">10 à 100 : zone grise</text><text x="216" y="126">Causes non médullaires ?</text><text x="396" y="108">Plus de 100 pg/ml</text><text x="396" y="126">Cancer médullaire ?</text><text x="36" y="212">Suivi selon le dossier</text><text x="216" y="212">Refaire, autre méthode,</text><text x="216" y="230">tests ciblés si nécessaires</text><text x="396" y="212">Avis spécialisé, bilan,</text><text x="396" y="230">RET selon diagnostic</text><text x="150" y="290">Les seuils sont des repères dépendants de la méthode</text></g></svg><figcaption>Figure 2 — Schéma de principe de la lecture d’une calcitonine basale, d’après la revue de 2026 et les recommandations européennes de 2023. Il ne remplace pas le jugement clinique.</figcaption></figure>
<p>Dans une élévation indéterminée, des outils complémentaires peuvent affiner le bilan. Le <button class="w" data-k="e07-test-calcium">test au calcium</button> a identifié les 47 cancers médullaires de la série italienne lorsqu’il était combiné au dosage basal ; ses seuils &gt;79 pg/ml chez la femme et &gt;466 chez l’homme étaient établis avec Immulite 2000 dans une population chirurgicale excluant RET germinal. Ce résultat ne justifie pas un test systématique de toute zone grise. La <button class="w" data-k="e07-pct">procalcitonine</button> est un complément prometteur, avec des seuils variables et des élévations possibles hors infection ; l’absence d’infection ne suffit donc pas à conclure à un cancer. L’<button class="w" data-k="e07-ace-cytologie">antigène carcinoembryonnaire</button> contribue au suivi et au pronostic, pas au dépistage isolé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/40576708/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/34382653/" target="_blank" rel="noopener">S10</a>].</p>
<p>La question de savoir <b>s’il faut doser la calcitonine devant tout nodule</b> reste ouverte. Le panel européen de 2023 ne recommande ni pour ni contre le dosage systématique, et le propose dans des scénarios choisis : nodule destiné à la chirurgie ou à un traitement mini-invasif, cytologie indéterminée ou échographie suspecte, antécédent personnel ou familial de cancer médullaire ou de néoplasie endocrinienne multiple de type 2. La revue Cochrane de 2020 explique ce choix : au seuil de 10 pg/ml, la sensibilité groupée est de 100 % et la spécificité de 97,2 %, mais la valeur prédictive positive n’est que de 7,7 %, car la maladie est rare <button class="w" data-k="e07-cochrane">dosage systématique de la calcitonine : preuves Cochrane</button>.</p>
<h3>7.2 Dyshormonogenèse : de la <button class="w" data-k="e07-hormones-local">TSH</button> au gène</h3>
<p>Le dépistage néonatal s’appuie sur la <b>thyréostimuline</b>, test le plus sensible pour l’hypothyroïdie congénitale primaire ; la thyroxine y est ajoutée si possible pour repérer la forme centrale. La confirmation repose sur la thyroxine libre et la thyréostimuline sériques. Une thyroxine libre basse avec une thyréostimuline nettement élevée impose la lévothyroxine immédiate ; une thyréostimuline supérieure à 20 mU/l à la confirmation, vers la deuxième semaine de vie, justifie le traitement même si la thyroxine libre est normale (seuil d’avis expert du consensus). L’imagerie (scintigraphie, échographie) se fait <b>après le début du traitement</b> et non avant, et la scintigraphie peut être faussement négative lorsqu’elle est réalisée plus de 5 à 7 jours après son début <button class="w" data-k="e07-imagerie-hc">imagerie de l’hypothyroïdie congénitale</button>. Le <b>test au perchlorate</b> est positif si plus de 10 % de l’iode 123 sont déchargés ; associé au dosage de la thyroglobuline, il oriente le gène à tester <button class="w" data-k="e07-perchlorate">test au perchlorate et thyroglobuline</button>.</p>
<h3>7.3 Anomalie de la globuline liant la thyroxine</h3>
<p>Le diagnostic évoque la dissociation entre des hormones <b>totales basses</b> et des hormones <b>libres et une thyréostimuline normales</b>. La confirmation repose sur le dosage de la globuline liante, avec échographie ou anticorps au besoin, pour éviter l’erreur diagnostique <button class="w" data-k="e07-tbg">globuline liant la thyroxine</button>.</p>
<h3>7.4 Maladie non thyroïdienne</h3>
<p>Une <b>thyréostimuline normale ne suffit pas à exclure une hypothyroïdie chez le patient gravement malade</b>. Une thyréostimuline élevée avec thyroxine basse évoque l’hypothyroïdie, mais s’observe aussi en phase de récupération. La dopamine et les glucocorticoïdes à haute dose abaissent la thyréostimuline, y compris chez l’hypothyroïdien ; le rapport triiodothyronine/thyroxine et la reverse-triiodothyronine ont une faible valeur diagnostique <button class="w" data-k="e07-smnt-dd">diagnostic différentiel de la maladie non thyroïdienne</button>.</p>
<h3>7.5 Diagnostics différentiels par gravité</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Rang</th><th style="min-width:10em">Situation</th><th style="min-width:10em">Pourquoi l’exclure en premier</th></tr></thead><tbody>
<tr><td style="min-width:10em">1</td><td style="min-width:10em">Goitre compressif, hémorragie compressive</td><td style="min-width:10em">Menace des voies aériennes</td></tr>
<tr><td style="min-width:10em">2</td><td style="min-width:10em">Coma myxœdémateux</td><td style="min-width:10em">Urgence endocrinienne ; hypothermie, troubles de conscience, hormones basses avec signes cliniques de défaillance ; la <button class="w" data-k="e07-hormones-local">TSH</button> peut être non élevée en atteinte centrale ou sous médicament</td></tr>
<tr><td style="min-width:10em">3</td><td style="min-width:10em">Cancer médullaire, néoplasie endocrinienne multiple de type 2</td><td style="min-width:10em">Calcitonine élevée ; conséquences familiales ; phéochromocytome associé</td></tr>
<tr><td style="min-width:10em">4</td><td style="min-width:10em">Dyshormonogenèse non traitée</td><td style="min-width:10em">Le retard de traitement compromet le neurodéveloppement</td></tr>
<tr><td style="min-width:10em">5</td><td style="min-width:10em">Hypothyroïdie primaire de l’adulte</td><td style="min-width:10em">Se distingue de la maladie non thyroïdienne par une thyréostimuline élevée persistante</td></tr>
<tr><td style="min-width:10em">6</td><td style="min-width:10em">Anomalie de la globuline liante, maladie non thyroïdienne</td><td style="min-width:10em">Anomalie isolée de transport habituellement sans dysfonction ; syndrome de maladie non thyroïdienne associé à une maladie parfois mortelle</td></tr></tbody></table>
<p>Une aide pédagogique, non critère officiel, résume l’ordre de lecture d’un bilan thyroïdien discordant <button class="w" data-k="e07-mnemo">aide mnémotechnique (aide pédagogique, non critère officiel)</button>.</p>
<p>La hiérarchie classe d’abord ce qui peut tuer ou handicaper rapidement, puis ce qui engage le pronostic de la famille, enfin ce qui expose à un traitement inutile. C’est l’ordre dans lequel la démarche est conduite.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Débuter une imagerie avant la lévothyroxine chez un nouveau-né dont la biologie confirme l’hypothyroïdie : le traitement ne se retarde pas pour l’examen.</div>
<div class="key"><b>À retenir.</b> Calcitonine : zone grise de 10 à 100 pg/ml, évocation de cancer au-delà. Hypothyroïdie congénitale : traiter d’abord, imager ensuite. Globuline liante : dissociation hormones totales et libres. Maladie non thyroïdienne : la thyréostimuline normale n’exclut pas une hypothyroïdie concomitante en maladie critique.</div>
</section>

<section class="ilot" id="e07-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><b>Gravité d’abord.</b><ul><li><b>Détresse respiratoire du nouveau-né</b> par goitre congénital massif : une compression trachéale ayant nécessité une intubation, régressive sous lévothyroxine, est rapportée pour un variant homozygote du gène de la thyroglobuline. Le goitre fœtal peut menacer la vie in utero ; une prise en charge interdisciplinaire est décrite, parfois par une stratégie de traitement intra-partum ex utero.</li><li><b>Hémorragie thyroïdienne compressive</b> : tuméfaction cervicale brutale et douloureuse après traumatisme, dans un contexte dont l’anticoagulation doit être documentée ou après cytoponction ; les voies aériennes sont menacées en premier.</li><li><b>Coma myxœdémateux</b> : hypothermie, troubles de la conscience, thyroxine basse et signes de décompensation ; une <button class="w" data-k="e07-hormones-local">TSH</button> non élevée ne l’exclut pas dans certains contextes ; une insuffisance surrénalienne peut coexister, à rechercher et prendre en charge selon le protocole hospitalier avant la substitution.</li><li><b>Prématuré de très faible poids sous lévothyroxine</b> : collapsus cardiovasculaire rapporté, en lien avec l’immaturité de l’axe et une possible insuffisance corticosurrénalienne.</li><li><b>Néoplasie endocrinienne multiple de type 2B</b> (mutation M918T) : thyroïdectomie dès que possible ; recherche de phéochromocytome avant chirurgie dans le contexte de NEM2.</li></ul></div>
<p>Les complications des cinq parties sont de nature différente. Le <b>retard de traitement</b> d’une hypothyroïdie congénitale menace le neurodéveloppement : des études en fratrie montrent un quotient intellectuel normal si la lévothyroxine commence avant 10 jours à au moins 10 µg/kg/jour. La <b>surdité</b> du syndrome de Pendred est une complication fonctionnelle durable ; l’implant cochléaire donne en général un bénéfice utile, avec des preuves de faible niveau. Chez le patient dyshormonogénétique, de rares cancers papillaires ou folliculaires sont rapportés, souvent après une thyréostimuline durablement élevée par mauvaise observance à l’adolescence. Enfin, le <b>traitement inutile</b> constitue une complication iatrogène : un faux diagnostic d’hypothyroïdie par déficit en globuline liante mène à une lévothyroxine inutile et à une thyrotoxicose iatrogène.</p>
<div class="trap"><span class="k">Piège</span> Prescrire une hormone thyroïdienne à un patient de réanimation sur la seule base d’une triiodothyronine basse : les essais hétérogènes disponibles n’établissent pas de bénéfice clinique justifiant une substitution systématique.</div>
<div class="key"><b>À retenir.</b> Les urgences de E07 sont respiratoires (goitre, hémorragie), endocriniennes (coma myxœdémateux, prématuré) et oncologiques familiales (néoplasie endocrinienne multiple de type 2B). Les complications évitables sont le retard du traitement de l’hypothyroïdie congénitale et le traitement à tort.</div>
<button class="pareto-btn ui" data-k="pareto-e07-diagnostic">▲ Loi de Pareto — Diagnostic et urgences</button>
</section>

<section class="ilot" id="e07-9"><h2><span class="n">9</span>Prise en charge hiérarchisée</h2>
<p>La prise en charge suit l’ordre « objectif, moyens, choix justifiés, surveillance, critères de modification ». Elle diffère complètement d’une partie à l’autre, ce qui explique le tableau suivant.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Partie</th><th style="min-width:10em">Objectif</th><th style="min-width:10em">Moyen principal</th><th style="min-width:10em">Choix justifié</th></tr></thead><tbody>
<tr><td style="min-width:10em">A. Calcitonine</td><td style="min-width:10em">Ne pas manquer un cancer médullaire, ne pas opérer à tort</td><td style="min-width:10em">Mesure répétée, tests ciblés si nécessaires, recherche RET</td><td style="min-width:10em">Une élévation modérée peut avoir plusieurs causes ; niveau, sexe, méthode, cinétique et risque clinique orientent une évaluation spécialisée</td></tr>
<tr><td style="min-width:10em">B. Dyshormonogenèse</td><td style="min-width:10em">Commencer la substitution au plus tard à 2 semaines de vie et corriger rapidement la FT4 ; viser la normalisation de la <button class="w" data-k="e07-hormones-local">TSH</button> dans les 4 semaines après le début</td><td style="min-width:10em">Lévothyroxine par voie orale, une prise par jour</td><td style="min-width:10em">Traiter avant l’imagerie ; viser une thyréostimuline dans la partie basse de la norme</td></tr>
<tr><td style="min-width:10em">C. Globuline liante</td><td style="min-width:10em">Éviter un traitement</td><td style="min-width:10em">Aucun ; information du patient</td><td style="min-width:10em">Si anomalie de transport isolée ; rechercher une maladie coexistante</td></tr>
<tr><td style="min-width:10em">D. Maladie non thyroïdienne</td><td style="min-width:10em">Éviter un traitement inutile</td><td style="min-width:10em">Traiter la maladie causale ; poursuivre la lévothyroxine chez l’hypothyroïdien connu</td><td style="min-width:10em">Pas de substitution systématique du seul profil NTIS</td></tr>
<tr><td style="min-width:10em">E. Hémorragie</td><td style="min-width:10em">Protéger les voies aériennes</td><td style="min-width:10em">Surveillance intensive, prise en charge conservatrice dans le cas rapporté</td><td style="min-width:10em">Niveau de preuve : cas cliniques seuls</td></tr></tbody></table>
<h3>9.1 Calcitonine</h3>
<p>La revue de 2026 décrit une surveillance à trois à six mois pour certaines élévations sous les seuils d’action, après vérification des causes et du contexte. Une ascension ou un seuil dépassé conduit à une réévaluation spécialisée, pas à une opération décidée par une valeur seule. Un cancer médullaire conduit au conseil génétique et à la recherche de RET germinal. Chez un porteur pathogène, le calendrier de thyroïdectomie et de dépistage des autres atteintes dépend du variant, de l’âge, de la calcitonine et de la famille : la stimulation n’est pas un préalable universel. Le repère britannique actualisé distingue notamment M918T, avec chirurgie avant un an, les variants à haut risque avec chirurgie avant cinq ans, et les risques modérés nécessitant une décision individualisée. Avant chirurgie d’une NEM2, rechercher un phéochromocytome. <button class="w" data-k="e07-ret">RET : conseil familial et décision spécialisée</button> ; sources [<a data-reference-source="1" href="https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/multiple-endocrine-neoplasia-type-2/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>]. La monographie du cancer relève de C73.</p>
<h3>9.2 Dyshormonogenèse</h3>
<p>La lévothyroxine est débutée au plus tard à deux semaines de vie, ou dès la confirmation, à une dose initiale pouvant atteindre 15 µg/kg/jour : 10 à 15 µg/kg/jour dans les formes sévères (thyroxine libre inférieure à 5 pmol/l) et environ 10 µg/kg/jour dans les formes légères ; si la FT4 initiale est dans sa norme d’âge, 5 à 10 µg/kg/jour peuvent être envisagés <button class="w" data-k="e07-levo-hc">lévothyroxine dans l’hypothyroïdie congénitale</button>. L’information professionnelle suisse d’Euthyrox® indique pour la tranche de 0 à 6 mois 25 à 75 µg/jour, soit 10 µg/kg, avec adaptation individuelle à la clinique et à la biologie <button class="w" data-k="e07-euthyrox">information professionnelle suisse d’Euthyrox®</button>. Les deux sources ne donnent pas des consignes identiques : le consensus distingue la gravité initiale, tandis que la FI fournit des tranches d’âge. Le choix et les ajustements reposent sur la FT4, la <button class="w" data-k="e07-hormones-local">TSH</button> et l’examen, sans appliquer systématiquement la dose la plus élevée.</p>
<p>Pour la dyshormonogenèse seule, le consensus ajoute deux consignes propres : viser une thyréostimuline dans la <b>partie basse de la norme</b>, et surveiller le volume de la glande par échographie tous les 2 à 3 ans <button class="w" data-k="e07-tsh-cible">cible de thyréostimuline et surveillance du goitre</button>. La justification est le goitre : une thyréostimuline élevée entretient la croissance de la glande, et de rares cancers sont rapportés chez les patients mal observants.</p>
<h3>9.3 Globuline liante, maladie non thyroïdienne et hémorragie</h3>
<p>Le déficit isolé en globuline liante ne nécessite pas de substitution hormonale. Les essais disponibles dans le syndrome de maladie non thyroïdienne n’établissent pas de bénéfice clinique justifiant une substitution systématique <button class="w" data-k="e07-smnt-traitement">traitement de la maladie non thyroïdienne</button>. Pour l’hémorragie thyroïdienne, la source se limite à des cas : une tuméfaction cervicale brutale menace d’abord les voies aériennes, et un cas post-traumatique a été traité de façon conservatrice sous surveillance intensive.</p>
<h3>9.4 Infarctus ou nodule remanié après ponction</h3><p>La ponction peut exceptionnellement provoquer des remaniements hémorragiques, ischémiques et fibreux. Le nodule peut paraître disparaître ou devenir nécrotique, alors que l’échantillon initial comportait une lésion suspecte. Transmettre cytologie, date du geste et images au pathologiste ; rechercher les zones viables et l’invasion capsulaire ou périphérique. Les 17 cas parmi 656 patients opérés dans une série ne constituent pas un risque de population. Aucune anticoagulation ni thrombolyse thyroïdienne n’est déduite de cette description <button class="w" data-k="e07-hemorragie">hémorragie et infarctus : portée des observations</button> [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/27294033/" target="_blank" rel="noopener">S38</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8955603/" target="_blank" rel="noopener">S39</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/31967057/" target="_blank" rel="noopener">S40</a>].</p>
<div class="trap"><span class="k">Erreur fréquente</span> Transposer sans contrôle une dose de lévothyroxine du nouveau-né à l’enfant plus grand : l’information professionnelle suisse diminue la dose par kilogramme avec l’âge (10 µg/kg de 0 à 6 mois, 8 µg/kg de 6 à 12 mois, 5 à 6 µg/kg de 1 à 5 ans, 4 à 5 µg/kg de 6 à 12 ans).</div>
<div class="key"><b>À retenir.</b> Calcitonine : confirmer, évaluer le risque ; stimulation sélectionnée et RET selon le diagnostic. Dyshormonogenèse : lévothyroxine avant 2 semaines, avant l’imagerie, cible basse-normale. Anomalie isolée de transport ou NTIS : pas de substitution systématique ; traiter toute hypothyroïdie authentique coexistante.</div>
</section>

<section class="ilot" id="e07-10"><h2><span class="n">10</span>Suivi, pronostic et prévention</h2>
<p>Le suivi de la dyshormonogenèse est chiffré et rythmé. Le premier contrôle a lieu une à deux semaines après le début du traitement (au plus tard une semaine si la dose initiale atteint 50 µg/j ou davantage), puis toutes les deux semaines jusqu’à normalisation de la thyréostimuline, puis tous les un à trois mois jusqu’à 12 mois, tous les deux à quatre mois de 1 à 3 ans, tous les trois à six mois ensuite, et quatre à six semaines après tout changement de dose. La prise de sang se fait avant la dose ou au moins quatre heures après. Si le diagnostic permanent n’est pas établi chez un enfant à glande en place, l’axe est réévalué après 2 à 3 ans ; une thyréostimuline de 10 mU/l ou plus après quatre semaines d’arrêt signe une hypothyroïdie congénitale primaire permanente.</p>
<p>Le <b>pronostic</b> de l’hypothyroïdie congénitale non syndromique correctement traitée est généralement favorable ; les atteintes syndromiques, le retard thérapeutique et les difficultés d’adhésion imposent une appréciation individuelle. Dans le syndrome de maladie non thyroïdienne, des hormones très basses accompagnent souvent une affection plus grave, mais ni la causalité ni l’utilité de leur normalisation pharmacologique ne sont établies. Les données sériques ne permettent pas de déduire l’état hormonal de chaque tissu. Le suivi de calcitonine utilise si possible le même laboratoire et la même méthode ; une évolution inattendue appelle une vérification analytique et clinique, non une conclusion immédiate de progression [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>].</p>
<p>La <b>prévention</b> est génétique et diagnostique : conseil génétique par un professionnel expérimenté, diagnostic anténatal proposé en cas de récurrence familiale de dyshormonogenèse, recherche systématique de la mutation RET chez tout patient atteint de cancer médullaire, dépistage néonatal par la thyréostimuline. Elle est aussi pharmacologique : savoir que la grossesse, les œstrogènes, la maladie grave et certains médicaments modifient les dosages évite les traitements inutiles.</p>
<div class="trap"><span class="k">Piège</span> Interpréter une association pronostique comme une cause : la thyroxine basse prédit la mortalité du patient de réanimation, mais ne prouve pas que la corriger sauve le patient.</div>
<div class="key"><b>À retenir.</b> Suivi de l’hypothyroïdie congénitale : contrôle 4 à 6 semaines après chaque changement de dose. Pronostic de la maladie non thyroïdienne : association, non causalité. Prévention : conseil génétique et dépistage néonatal.</div>
<button class="pareto-btn ui" data-k="pareto-e07-prise">▲ Loi de Pareto — Prise en charge et suivi</button>
</section>

<section class="ilot" id="e07-11"><h2><span class="n">11</span>Situations particulières</h2>
<div class="two"><div class="card"><h4>Grossesse et œstrogènes</h4><p>La grossesse et les œstrogènes augmentent la capacité de liaison des protéines de transport. L’information professionnelle suisse précise que les œstrogènes augmentent les besoins en lévothyroxine ; un dosage de thyroxine totale doit donc être lu avec la situation de la patiente <button class="w" data-k="e07-facteurs-liaison">facteurs acquis modifiant la liaison</button>.</p></div><div class="card"><h4>Prématuré de très faible poids</h4><p>L’immaturité de l’axe et une possible insuffisance corticosurrénalienne exposent à un collapsus cardiovasculaire sous lévothyroxine <button class="w" data-k="e07-prematures">prématurés et lévothyroxine</button>. Un deuxième prélèvement de dépistage à 10 à 14 jours est conseillé chez les nouveau-nés à risque, dont les prématurés.</p></div><div class="card"><h4>Insuffisance rénale</h4><p>Une insuffisance rénale légère à modérée élève la calcitonine à 10 à 20 pg/ml, une insuffisance avancée à 20 à 50 pg/ml, rarement plus de 100. Le test au calcium garde un usage en insuffisance rénale avancée.</p></div><div class="card"><h4>Enfant avec surdité</h4><p>Une surdité neurosensorielle congénitale avec ou sans goitre fait évoquer le syndrome de Pendred, et les tests auditifs sont répétés avant l’âge scolaire chez tout enfant atteint d’hypothyroïdie congénitale.</p></div></div>
<h3>11.1 Cas récapitulatif (fictif)</h3>
<p>Une femme de 52 ans, fumeuse, sous inhibiteur de la pompe à protons depuis huit ans, a un nodule de 14 mm et une calcitonine basale à 40 pg/ml. Ce chiffre dépasse le repère féminin de 30 pg/ml de l’<button class="w" data-k="e07-sources-guides">ETA</button> 2023 : il justifie un avis spécialisé et une confirmation organisée. Tabac et IPP sont des explications possibles à examiner, sans prouver la cause de cette élévation. Vérifier prélèvement, méthode, interférences et traitements ; confronter aux images et aux antécédents. Un test au calcium ou la procalcitonine peuvent être discutés selon le dossier. L’intervention n’est ni automatique ni écartée par l’existence d’un IPP [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>].</p>
<div class="key"><b>À retenir.</b> Chaque situation particulière modifie l’interprétation d’un dosage : grossesse (protéine de transport), prématurité (axe immature), insuffisance rénale (calcitonine plus élevée). L’adaptation peut modifier la décision, le calendrier et la surveillance.</div>
<button class="pareto-btn ui" data-k="pareto-e07-situations">▲ Loi de Pareto — Situations particulières</button>
</section>

<section class="ilot" id="e07-12"><h2><span class="n">12</span>Arguments diagnostiques et paramètres décisifs</h2>
<div class="alert"><b>Arguments diagnostiques et limites.</b><ul><li><b>Hyperplasie des cellules C ou hypercalcitoninémie</b> : calcitonine basale au-dessus du seuil du laboratoire ; seuils d’action européens de 2023 au-dessus de 30 pg/ml (femme) et 34 pg/ml (homme) ; seuils stimulés de 79 pg/ml (femme) et 466 pg/ml (homme) issus d’une étude avec Immulite 2000, non universels ; le diagnostic d’hyperplasie repose sur l’histologie avec immunohistochimie.</li><li><b>Dyshormonogenèse</b> : profil typique d’hypothyroïdie primaire avec glande en place ou goitre ; perchlorate et thyroglobuline orientent le mécanisme, puis la génétique peut confirmer. Le perchlorate peut rester négatif, notamment pour IYD ; aucun test génétique ne doit retarder le traitement indiqué.</li><li><b>Syndrome de Pendred</b> : surdité neurosensorielle et variants biallèliques pathogènes de SLC26A4 ; anomalies vestibulaires et atteinte thyroïdienne variables, parfois tardives ; distinguer Pendred et surdité SLC26A4 sans atteinte thyroïdienne.</li><li><b>Déficit en globuline liant la thyroxine</b> : thyroxine totale basse, thyroxine libre et thyréostimuline normales, globuline basse ; gène SERPINA7.</li><li><b>Maladie non thyroïdienne</b> : triiodothyronine basse (thyroxine basse possible), thyréostimuline normale ou basse, maladie aiguë ou critique compatible, avec recherche d’une maladie thyroïdienne coexistante et des effets médicamenteux.</li></ul></div>
<div class="key"><b>Paramètres clés.</b><ul><li>Calcitonine : utiliser la référence de la méthode ; chez Viollier, femme &lt;4,9 ng/L et homme &lt;11,9 ng/L (1 ng/L = 1 pg/ml). Zone 10–100 : repère de revue, pas intervalle normal ; au-delà de 100, forte suspicion à confirmer.</li><li>Procalcitonine : référence et seuil dépendants de l’essai ; les seuils de 0,1–0,2 ng/ml étudiés pour le cancer médullaire ne sont pas diagnostiques à eux seuls.</li><li>Cochrane : valeur prédictive positive de la calcitonine à 10 pg/ml et plus, 7,7 %.</li><li>Hypothyroïdie congénitale primaire : 1/3000 à 1/2000 ; dysgénésie 65 % ; récurrence récessive 25 % si les deux parents sont porteurs.</li><li>Lévothyroxine : jusqu’à 15 µg/kg/jour avant 2 semaines de vie ; Euthyrox® suisse 10 µg/kg de 0 à 6 mois.</li><li>Test au perchlorate positif : décharge supérieure à 10 %.</li><li>Globuline liante : 75 % de la thyroxine ; déficit partiel 1/4000, complet 1/15 000.</li><li>Maladie non thyroïdienne : la baisse hormonale est associée à la gravité ; aucun seuil pronostique unique ne décide d’une substitution [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>].</li></ul></div>
<p>Aucun de ces seuils ne remplace le jugement clinique : chacun dépend d’une méthode, d’une population et d’une source qui bornent son usage.</p>
</section>
<section class="ilot" id="e07-13"><h2><span class="n">13</span>Points clés et synthèse syndromique</h2><p>La catégorie E07 n’a ni fréquence globale utile, ni score clinique unique, ni traitement commun. Elle rassemble cinq raisonnements qui doivent rester distincts : un signal de cellules C, un défaut de synthèse, une anomalie de transport, une adaptation à une maladie critique et une lésion cervicale hémorragique ou ischémique. Le diagnostic positif repose sur une concordance, pas sur l’appartenance au code.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Syndrome</th><th style="min-width:10em">Concordance attendue</th><th style="min-width:10em">Décision prioritaire</th></tr></thead><tbody><tr><td style="min-width:10em">Hypercalcitoninémie</td><td style="min-width:10em">Résultat confirmé, méthode et sexe connus, contexte et nodule évalués</td><td style="min-width:10em">Ne pas attribuer une élévation à un IPP sans preuve ; avis spécialisé selon niveau et risque</td></tr><tr><td style="min-width:10em">Dyshormonogenèse</td><td style="min-width:10em">Biologie de synthèse insuffisante, glande et histoire compatibles, génétique orientée</td><td style="min-width:10em">Traiter l’hypothyroïdie confirmée avant que l’enquête étiologique retarde la substitution</td></tr><tr><td style="min-width:10em">Anomalie <button class="w" data-k="e07-tbg">TBG</button></td><td style="min-width:10em">Total discordant avec libre/<button class="w" data-k="e07-hormones-local">TSH</button> fiables et clinique ; <button class="w" data-k="e07-tbg">TBG</button> ou affinité documentée</td><td style="min-width:10em">Éviter une substitution inutile, sans interrompre un traitement d’une vraie maladie coexistante</td></tr><tr><td style="min-width:10em">Maladie non thyroïdienne</td><td style="min-width:10em">Profil hormonal et chronologie compatibles avec une maladie générale</td><td style="min-width:10em">Traiter la maladie, examiner les médicaments et ne pas exclure une hypothyroïdie sur <button class="w" data-k="e07-hormones-local">TSH</button> seule</td></tr><tr><td style="min-width:10em">Hémorragie ou infarctus</td><td style="min-width:10em">Chronologie cervicale ou post-ponction, images, cytologie/histologie confrontées</td><td style="min-width:10em">Protéger les voies aériennes ; ne pas assimiler nodule nécrotique et guérison</td></tr></tbody></table><p>À la sortie de consultation, le patient doit savoir quelle hypothèse est retenue, quel résultat reste à vérifier, quand le prochain contrôle a lieu et quels symptômes imposent une consultation urgente. Pour un enfant, préciser par écrit la préparation de la dose, la prise complète et le calendrier du premier contrôle ; pour une anomalie familiale, organiser le conseil sans promettre une certitude au-delà de la classification du variant [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/multiple-endocrine-neoplasia-type-2/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/34126618/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p></section>
<section class="ilot" id="e07-14"><h2><span class="n">14</span>Pièges, limites et examen fédéral</h2><p><b>Les erreurs à éviter :</b> appeler normale toute calcitonine &lt;10 pg/ml ; rassurer sur une femme à 40 pg/ml parce qu’elle prend un IPP ; appliquer un seuil stimulé hors de sa méthode ; confondre 25 mg de gluconate et 25 mg de calcium ; substituer une <button class="w" data-k="e07-hormones-local">T4</button> totale basse sans lire FT4/<button class="w" data-k="e07-hormones-local">TSH</button> ; exclure une hypothyroïdie en réanimation parce que la <button class="w" data-k="e07-hormones-local">TSH</button> est normale ; attendre le gène avant de traiter un nouveau-né ; appeler guéri un nodule qui s’infarctit après ponction.</p><p><button class="w" data-k="e07-sources-guides">PROFILES</button> 2017 cite l’inspection et la palpation de la thyroïde et du cou, les tests auditifs, le goitre et les hormones thyroïdiennes anormales. Les vignettes de cette leçon entraînent le recueil ciblé, l’interprétation d’un examen, la décision et l’explication au patient ; elles sont créées pour l’apprentissage et ne sont pas des questions officielles. Le lien avec ces compétences ne garantit ni contenu futur ni résultat d’examen [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S37</a>].</p><p>La Suisse apporte ici des instructions de produit et de laboratoire ainsi que le dépistage néonatal. Les recommandations européennes précisent les décisions cliniques ; les résumés de cas éclairent les formes rares avec leurs limites. Aucun seuil de rappel néonatal suisse, coût global de prise en charge, remboursement d’un test hors indication ou prévalence nationale E07 n’est inventé. Les revues et contrôles de ce dossier sont des auto-relectures par intelligence artificielle, sans certification clinique humaine.</p></section><div class="src"><h3>Sources et passages effectivement consultés</h3><p>Relecture du 2 novembre 2026. Chaque référence précise sa portée ; les résumés ne sont pas présentés comme lectures intégrales. Les anciennes preuves du cycle 32 sont conservées dans le dépôt, sans adoption automatique.</p><ul data-justification-sources="1"><li id="e07-ref-s1"><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] CIM-10-GM 2024, catégorie E07 et sous-codes</a> — OFS, 2024. Entrées E07 et E07.0/.1/.8/.9 du catalogue local <i>Limites :</i> Pas de conduite clinique ou de codage suisse 2026 certifiés.</li><li id="e07-ref-s2"><a data-reference-source="1" href="https://classbrowser.nhs.uk/ICD-10-5TH-Edition/vol1/block-e00-e07.htm" target="_blank" rel="noopener">[S2] ICD-10 : notes E07</a> — NHS, classification internationale, 5e édition consultée. E07.0 à E07.9 et exclusion P72.0 <i>Limites :</i> Source européenne de notes internationales ; les libellés suisses restent ceux de l’OFS, pas substitution administrative.</li><li id="e07-ref-s3"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">[S3] Congenital Hypothyroidism: A 2020-2021 Consensus Guidelines Update — ENDO-ERN, endorsed by ESPE and ESE</a> — ENDO-ERN, ESPE, ESE, 2020–2021. §3.1 et 3.2 relus en entier ; §2.3, 4.2, 5.2 et tableau 3, §5.3 : passages dyshormonogenèse, imagerie, génétique et suivi <i>Limites :</i> Consensus européen ; doses de gravité distinctes de la FI suisse exacte ; données surtout observationnelles.</li><li id="e07-ref-s4"><a data-reference-source="1" href="https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/multiple-endocrine-neoplasia-type-2/" target="_blank" rel="noopener">[S4] MEN2 — diagnostic, génétique et prise en charge</a> — NHS England GeNotes, révision 29.05.2024. Overview, Clinical features, Genomics, Diagnosis, Inheritance, Management et tableau 1 <i>Limites :</i> Synthèse britannique fondée notamment s
