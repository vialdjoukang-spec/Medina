<p>Le syndrome de Pendred est lié à des variants bialléliques de SLC26A4. La surdité est centrale dans le phénotype, tandis que le goitre, la fonction hormonale et l’anatomie de l’oreille sont variables. Les 13 diagnostics résolus sur 37 probands dans la cohorte slovaque et autrichienne concernaient un ensemble aqueduc élargi/Pendred ; il ne faut ni annoncer un rendement universel de 35 % ni interpréter un résultat négatif comme exclusion de toute cause génétique. Le conseil décrit le risque familial, les limites du panel et la surveillance clinique [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/40426046/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38877731/" target="_blank" rel="noopener">S28</a>].</p><p>SERPINA7 est situé sur le chromosome X. Un homme hémizygote peut exprimer pleinement un déficit ; une femme hétérozygote peut avoir une concentration intermédiaire ou dans la norme, selon l’expression du chromosome X. Déficit quantitatif, baisse d’affinité et excès par duplication ou triplication sont différents. Les cas coréens montrent aussi qu’une hypothyroïdie auto-immune peut coexister : la découverte du variant ne supprime pas un autre diagnostic [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/34126618/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>].</p><p>Les variants activateurs constitutionnels de RET exposent à la NEM2 et se transmettent de façon autosomique dominante. Le calendrier des examens et de la thyroïdectomie dépend du variant et de la famille. Un variant incertain n’est pas assimilé à une preuve de syndrome ni à une indication opératoire. L’équipe experte organise la cascade familiale, explique les limites et recherche les autres atteintes avant un geste à risque [<a data-reference-source="1" href="https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/multiple-endocrine-neoplasia-type-2/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>].</p><p>Enfin, les anomalies des récepteurs hormonaux et des transporteurs cellulaires appartiennent au différentiel des tests discordants. L’<button class="w" data-k="e07-sources-guides">ETA</button> 2024 demande d’exclure contexte et interférence avant d’engager une exploration génétique ciblée. Un panel large réalisé avant cette étape peut produire un résultat difficile à interpréter sans répondre à la question clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>].</p><div class="key"><b>Gène → famille → soin.</b> Le diagnostic moléculaire précise mécanisme et risque ; il ne remplace ni le traitement rapide d’une hypothyroïdie avérée ni l’examen des voies aériennes. La prescription de conseil et de surveillance est individualisée.</div><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>] §5 et tableau 3 ; [<a data-reference-source="1" href="https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/multiple-endocrine-neoplasia-type-2/" target="_blank" rel="noopener">S4</a>] NHS NEM2 ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/40426046/" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38877731/" target="_blank" rel="noopener">S28</a>] résumés Pendred ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/34126618/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>] <button class="w" data-k="e07-tbg">TBG</button> ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>] <button class="w" data-k="e07-sources-guides">ETA</button> 2024.</p><button class="pareto-btn ui" data-k="pareto-e07-sciences">▲ Loi de Pareto — Sciences fondamentales</button><p class="key"><b>Science → clinique.</b> Le même gène peut donner des phénotypes variables ; le risque dépend du variant et de la transmission.</p><p class="key"><b>Science → examen.</b> Phénotype et fiabilité du dosage orientent les tests ; un variant incertain ne prouve pas une maladie.</p><p class="key"><b>Science → traitement.</b> La génétique guide conseil et surveillance mais ne retarde pas la substitution d’une hypothyroïdie congénitale confirmée.</p><p class="key"><b>À retenir.</b> 25 % est le risque du modèle récessif décrit ; il ne s’applique pas à tout goitre familial.</p></section></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e07-p-1"><h2><span class="n">p-1</span>Stratégie pharmacologique propre à E07</h2>
<p>La pharmacologie dépend du mécanisme. Une hypothyroïdie par dyshormonogenèse peut nécessiter la lévothyroxine ; un déficit isolé de <button class="w" data-k="e07-tbg">TBG</button> ou un syndrome de maladie non thyroïdienne ne justifie pas de substitution systématique. Une hypothyroïdie authentique peut pourtant coexister avec ces deux situations. Les médicaments peuvent aussi modifier le prélèvement, l’axe ou la liaison protéique. Le calcium utilisé pour stimuler la calcitonine est un test spécialisé, dont la dose d’étude n’est pas un protocole universel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>].</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Partie</th><th style="min-width:10em">Rôle du médicament</th><th style="min-width:10em">Produit</th><th style="min-width:10em">Place selon le phénotype</th></tr></thead><tbody>
<tr><td style="min-width:10em">A. Calcitonine</td><td style="min-width:10em">Test diagnostique</td><td style="min-width:10em">Gluconate de calcium par voie intraveineuse</td><td style="min-width:10em">Zone grise ; distinction d’une sécrétion ectopique ; insuffisance rénale avancée</td></tr>
<tr><td style="min-width:10em">A. Calcitonine</td><td style="min-width:10em">Cause d’élévation</td><td style="min-width:10em">Inhibiteurs de la pompe à protons</td><td style="min-width:10em">À rechercher avant de conclure à un cancer</td></tr>
<tr><td style="min-width:10em">B. Dyshormonogenèse, Pendred</td><td style="min-width:10em">Traitement de fond</td><td style="min-width:10em">Lévothyroxine</td><td style="min-width:10em">Dès la confirmation, au plus tard à 2 semaines de vie</td></tr>
<tr><td style="min-width:10em">C. Globuline liante</td><td style="min-width:10em">Aucun</td><td style="min-width:10em">—</td><td style="min-width:10em">Pas de substitution pour l’anomalie isolée ; traiter une hypothyroïdie coexistante</td></tr>
<tr><td style="min-width:10em">D. Maladie non thyroïdienne</td><td style="min-width:10em">Aucun</td><td style="min-width:10em">—</td><td style="min-width:10em">Pas de substitution systématique du profil NTIS ; traiter l’hypothyroïdie authentique</td></tr>
<tr><td style="min-width:10em">D. Maladie non thyroïdienne</td><td style="min-width:10em">Cause de variation de la thyréostimuline</td><td style="min-width:10em">Dopamine ; glucocorticoïdes à haute dose</td><td style="min-width:10em">Abaissent la thyréostimuline, y compris chez l’hypothyroïdien</td></tr></tbody></table>
<p>Le tableau classe les médicaments par rôle : traitement, test ou cause d’erreur. La prescription est conditionnée par le phénotype biologique, jamais par un chiffre isolé.</p>
<div class="key"><b>À retenir.</b> Traiter une hypothyroïdie démontrée, éviter la substitution automatique d’une anomalie de transport ou d’un NTIS, et encadrer les tests diagnostiques. Une maladie concomitante conserve ses indications propres.</div>
</section>

<section class="ilot" id="e07-p-2"><h2><span class="n">p-2</span>Doses rapportées et cibles</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Produit et situation</th><th style="min-width:10em">Dose rapportée</th><th style="min-width:10em">Source</th></tr></thead><tbody>
<tr><td style="min-width:10em">Lévothyroxine, hypothyroïdie congénitale : dose initiale</td><td style="min-width:10em">Jusqu’à 15 µg/kg/jour</td><td style="min-width:10em">Consensus ENDO-ERN 2020-2021</td></tr>
<tr><td style="min-width:10em">Forme sévère (thyroxine libre inférieure à 5 pmol/l)</td><td style="min-width:10em">10 à 15 µg/kg/jour</td><td style="min-width:10em">Consensus ENDO-ERN</td></tr>
<tr><td style="min-width:10em">Forme légère</td><td style="min-width:10em">10 µg/kg/jour</td><td style="min-width:10em">Consensus ENDO-ERN</td></tr>
<tr><td style="min-width:10em">Euthyrox®, 0 à 6 mois</td><td style="min-width:10em">25 à 75 µg/jour (10 µg/kg)</td><td style="min-width:10em">Information professionnelle suisse, février 2023</td></tr>
<tr><td style="min-width:10em">Euthyrox®, 6 à 12 mois</td><td style="min-width:10em">50 à 75 µg/jour (8 µg/kg)</td><td style="min-width:10em">Information professionnelle suisse</td></tr>
<tr><td style="min-width:10em">Euthyrox®, 1 à 5 ans</td><td style="min-width:10em">75 à 100 µg/jour (5 à 6 µg/kg)</td><td style="min-width:10em">Information professionnelle suisse</td></tr>
<tr><td style="min-width:10em">Euthyrox®, 6 à 12 ans</td><td style="min-width:10em">100 à 150 µg/jour (4 à 5 µg/kg)</td><td style="min-width:10em">Information professionnelle suisse</td></tr>
<tr><td style="min-width:10em">Euthyrox®, 12 ans et plus</td><td style="min-width:10em">Comme l’adulte</td><td style="min-width:10em">Information professionnelle suisse</td></tr>
<tr><td style="min-width:10em">Gluconate de calcium, test de stimulation</td><td style="min-width:10em">25 mg/kg de poids ajusté, soit 2,3 mg/kg de calcium élément, à 5 ml/min, au moins 3 minutes</td><td style="min-width:10em">Fugazzola et al. 2020 : protocole d’étude ; ne pas transposer au produit importé sans validation pharmaceutique</td></tr></tbody></table>
<p>Le tableau sépare les doses du consensus européen et celles du produit suisse. Une FT4 initiale normale peut justifier 5 à 10 µg/kg/jour selon le consensus, tandis qu’une forme sévère appelle 10 à 15. Ce ne sont pas des tranches interchangeables. La FT4 doit se corriger rapidement ; la <button class="w" data-k="e07-hormones-local">TSH</button> se normalise plus lentement, avec un objectif dans les quatre semaines. En dyshormonogenèse goitreuse, la cible à long terme est la partie basse de la norme de <button class="w" data-k="e07-hormones-local">TSH</button> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p>
<div class="trap"><span class="k">Piège</span> Confondre dose initiale (jusqu’à 15 µg/kg/jour en cas de forme sévère) et dose d’entretien : la dose est ajustée sur la thyroxine libre et la thyréostimuline, contrôlée 1 à 2 semaines après le début (au plus tard une semaine à partir de 50 µg/j initiaux), puis toutes les 2 semaines jusqu’à normalisation.</div>
</section>

<section class="ilot" id="e07-p-3"><h2><span class="n">p-3</span>Interactions dangereuses, surveillance et effets indésirables</h2>
<div class="alert"><b>Interactions et situations dangereuses.</b><ul><li><b>Sels de fer, calcium, aluminium</b> : prendre la lévothyroxine au moins 2 heures avant ; <b>résines</b> : 4 à 5 heures ; inhibiteurs de la pompe à protons, soja, orlistat et inducteurs enzymatiques figurent aussi parmi les interactions de l’information professionnelle suisse.</li><li><b>Œstrogènes</b> : augmentent les besoins en lévothyroxine.</li><li><b>Biotine</b> : fausse les immunodosages thyroïdiens.</li><li><b>Furosémide, salicylates, anticoagulants oraux</b> : déplacent la thyroxine de ses protéines et modifient les dosages.</li><li><b>Prématuré de très faible poids</b> : collapsus cardiovasculaire sous lévothyroxine en cas d’insuffisance corticosurrénalienne.</li></ul></div>
<p>La <b>surveillance</b> de l’hypothyroïdie congénitale primaire associe FT4, thyréostimuline et examen clinique : prélèvement avant la dose ou au moins 4 heures après, contrôle 4 à 6 semaines après tout changement de dose. L’absorption atteint environ 80 % à jeun ; la prise se fait à jeun, au moins 30 minutes avant le petit-déjeuner ; chez le nourrisson, le comprimé est désagrégé dans un peu d’eau et la suspension préparée extemporanément. Le plein effet apparaît en 1 à 3 semaines (demi-vie d’environ 7 jours). Le risque documenté dans ce cours est la thyrotoxicose iatrogène, notamment après un traitement inutile du déficit en globuline liante.</p>
<p><b>Monographies.</b> Les fenêtres <button class="w" data-k="e07-euthyrox">Euthyrox®, information professionnelle suisse</button>, <button class="w" data-k="e07-levo-hc">lévothyroxine dans l’hypothyroïdie congénitale</button>, <button class="w" data-k="e07-interactions-levo">interactions de la lévothyroxine</button>, <button class="w" data-k="e07-gluconate-test">gluconate de calcium comme test</button> et <button class="w" data-k="e07-tsh-medicaments">dopamine et glucocorticoïdes sur la thyréostimuline</button> détaillent mécanisme, preuves, posologie, effets indésirables et surveillance.</p>
<div class="key"><b>À retenir.</b> Lévothyroxine : à jeun, séparée de 2 heures des sels et de 4 à 5 heures des résines, contrôlée sur la thyréostimuline 4 à 6 semaines après chaque changement.</div>
</section>

<section class="ilot" id="e07-p-4"><h2><span class="n">p-4</span>Médicaments et gestes à éviter ; limites</h2>
<ul><li>Lévothyroxine pour un déficit en globuline liant la thyroxine : exposition à une thyrotoxicose iatrogène.</li><li>Hormone thyroïdienne en maladie critique sur la seule base d’une triiodothyronine basse : aucun bénéfice démontré.</li><li>Imagerie avant le début de la lévothyroxine chez un nouveau-né dont l’hypothyroïdie est confirmée.</li><li>Conclure à une hypothyroïdie sous dopamine ou glucocorticoïdes à haute dose sur la thyréostimuline seule.</li><li>Décider une opération sur une calcitonine isolée, sans répétition ni recherche de causes non médullaires.</li><li>Transposer une posologie pédiatrique d’un âge à l’autre sans relire l’information professionnelle.</li></ul>
<p>Les informations professionnelles lues concernent Euthyrox oral en Suisse et Calciumgluconat B. Braun 10 % allemand, mentionné comme produit importé par PHEL. Le test de calcitonine n’est pas l’indication autorisée de ce calcium. Les données sur hémorragie et infarctus sont observationnelles ; aucune posologie anticoagulante ou thrombolytique n’en est déduite. Une prise en charge urgente ou oncologique relève de son protocole spécialisé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>, <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2026-04/calcium_gluconate_v1.3.pdf" target="_blank" rel="noopener">S35</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/27294033/" target="_blank" rel="noopener">S38</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8955603/" target="_blank" rel="noopener">S39</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/31967057/" target="_blank" rel="noopener">S40</a>].</p>
<div class="key"><b>À retenir.</b> Les erreurs thérapeutiques de E07 sont des erreurs de lecture d’un chiffre : traiter une fausse hypothyroïdie, opérer une fausse tumeur, différer un vrai traitement.</div>
<button class="pareto-btn ui" data-k="pareto-e07-pharma">▲ Loi de Pareto — Pharmacologie</button>
</section>
<section class="ilot" id="e07-p-5"><h2>Produit exact, contre-indications et situations particulières</h2><h3>Euthyrox oral — ce que dit l’information suisse</h3><p>Euthyrox contient de la lévothyroxine sodique ; le texte AIPS/Swissmedic consulté, repris par AmiKo, est daté de février 2023 (autorisation 54949, GTIN de recherche 7680549490017). Les comprimés permettent des doses de 25 à 200 µg. Chez l’adulte, la FI indique pour l’hypothyroïdie 25–50 µg/j initialement, avec augmentation de 25–50 µg toutes les 2–4 semaines et entretien habituel de 100–200 µg/j ; elle recommande 25 µg au départ avec progression prudente chez les sujets âgés ou certaines formes sévères et cardiovasculaires. Ces valeurs décrivent le produit, pas une prescription personnalisée ni une conduite de coma myxœdémateux [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p><p><b>Contre-indications de cette FI :</b> hypersensibilité, insuffisance cardiaque accompagnée de tachycardie, pancardite ou myocardite aiguë, infarctus aigu du myocarde, angine de poitrine, troubles hypophysaires ou surrénaliens non traités, hyperthyroïdie hors emploi associé autorisé ; l’association à un thyréostatique est contre-indiquée pendant la grossesse. Une situation cardiaque ou surrénalienne impose donc une décision médicale structurée avant la substitution, pas un simple calcul au kilogramme. Une hypothyroïdie centrale ne se suit pas sur la seule <button class="w" data-k="e07-hormones-local">TSH</button> [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>].</p><p>Les effets indésirables rapportés comprennent hypersensibilité et angiœdème, perte pondérale, symptômes psychotiques, tremblements, insomnie, agitation, céphalées, convulsions, tachycardie, arythmies dont fibrillation auriculaire, symptômes angineux, révélation d’une insuffisance cardiaque, diarrhée et sueurs. Leur fréquence n’est pas quantifiable dans cette FI. Une progression trop rapide de dose favorise les manifestations de thyrotoxicose ; chez l’enfant, surveiller également croissance et signes de surtraitement. Le médicament n’est pas un traitement amaigrissant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p><h3>Administration et interactions à relier au résultat</h3><p>La dose quotidienne se prend à jeun au moins une demi-heure avant le repas. Pour le nourrisson et l’enfant de moins d’un an, laisser le comprimé se désagréger dans un peu d’eau, préparer juste avant la prise et s’assurer de l’administration complète. Le consensus européen autorise une organisation alimentaire plus souple chez l’enfant avec une prise constante par rapport au repas ; la consigne du produit suisse exact reste explicitée ici plutôt que fusionnée avec celle du consensus [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p><p>Prendre la lévothyroxine au moins deux heures avant fer, calcium ou aluminium, et quatre à cinq heures avant les résines échangeuses d’ions selon cette FI. IPP, sévélamer, orlistat et soja peuvent modifier l’absorption ; les inducteurs enzymatiques peuvent augmenter la clairance. Contrôler le bilan lors de leur introduction ou retrait. Le déplacement de liaison n’a pas toujours un effet univoque : phénytoïne et certains inhibiteurs de protéase peuvent aussi accroître la clairance [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p><p>Les antivitamines K peuvent avoir un effet renforcé : contrôler la coagulation et adapter si nécessaire. Chez le patient diabétique, surveiller la glycémie car l’effet hypoglycémiant peut diminuer. Œstrogènes, amiodarone et médicaments influençant la conversion <button class="w" data-k="e07-hormones-local">T4</button>–<button class="w" data-k="e07-hormones-local">T3</button> changent les besoins ou le profil hormonal. La biotine peut produire des valeurs faussement hautes ou basses selon l’essai ; informer le laboratoire et envisager une méthode non sensible à cette interférence [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p><h3>Grossesse, prématurité, rein et foie</h3><p>Une substitution indiquée se poursuit pendant grossesse et allaitement, avec surveillance spécialisée et adaptation éventuelle des besoins. Après l’accouchement, la FI prévoit le retour à la dose antérieure et un contrôle de <button class="w" data-k="e07-hormones-local">TSH</button> à six–huit semaines. Ce conseil concerne une patiente traitée, pas toute hausse de <button class="w" data-k="e07-hormones-local">T4</button> totale liée à la grossesse. Chez le prématuré immature de très faible poids, surveiller la circulation lors de l’introduction, car un collapsus a été rapporté dans un contexte pouvant comporter une insuffisance corticosurrénalienne. Pour insuffisance rénale ou hépatique, la FI ne fournit pas de recommandation posologique spécifique issue d’études pharmacocinétiques ; aucune réduction forfaitaire n’est inventée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p><p class="src"><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">[S19] FI suisse Euthyrox, produit exact</a> ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>] ENDO-ERN, §3.1–3.3.</p></section>
<section class="ilot" id="e07-p-6"><h2>Calcium diagnostique : ne pas confondre étude et médicament importé</h2><p>Le document suisse PHEL mis à jour en mars 2026 décrit Calciumgluconat B. Braun 10 %, produit importé. Le <button class="w" data-k="e07-rcp-local">RCP</button> allemand exact de juillet 2014 précise 940 mg de gluconate pour 10 ml, correspondant à 2,10 mmol de calcium, auxquels s’ajoute le calcium du saccharate : <b>2,25 mmol de calcium total pour 10 ml</b>. Cette composition doit être vérifiée sur l’ampoule réellement disponible ; « 10 % » ne permet pas de reconstruire seul une dose de calcium élément [<a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>, <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2026-04/calcium_gluconate_v1.3.pdf" target="_blank" rel="noopener">S35</a>].</p><p>L’indication du <button class="w" data-k="e07-rcp-local">RCP</button> est l’hypocalcémie aiguë symptomatique. Son exemple adulte est 10 ml initialement, ajustés à la clinique et à la calcémie ; sa vitesse IV ne doit pas dépasser 2 ml/min, avec patient allongé et surveillance de fréquence cardiaque ou électrocardiogramme. Ce n’est pas une recommandation de traitement E07 : le test de calcitonine est <b>hors indication</b>. Les 25 mg/kg de gluconate et 5 ml/min de la série italienne ne peuvent pas être transférés automatiquement à ce produit, dont la composition et la vitesse de <button class="w" data-k="e07-rcp-local">RCP</button> sont différentes. Le centre doit valider produit, dose élémentaire, dilution, vitesse, prélèvements et sécurité avec la pharmacie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>].</p><p>Le <button class="w" data-k="e07-rcp-local">RCP</button> contre-indique notamment hypercalcémie, hypercalciurie, hypersensibilité et intoxication ou traitement par glycosides cardiaques ; l’exception pour hypocalcémie immédiatement menaçante sans alternative ne concerne pas un test électif. Chez le nouveau-né jusqu’à 28 jours, l’association à la ceftriaxone IV est contre-indiquée ; à tout âge, ne pas mélanger ni coadministrer les solutions, et respecter les modalités spécifiques lorsqu’une administration successive est envisagée. Une atteinte rénale, une néphrocalcinose, une cardiopathie ou une sarcoïdose demandent une indication particulièrement prudente et une surveillance adaptée [<a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>].</p><p>Surveiller pression artérielle, rythme, symptômes et site d’injection. Injection trop rapide ou surdosage peuvent provoquer bradycardie, arythmie, vasodilatation, hypotension ou collapsus ; nausées, chaleur et sueurs sont décrites. L’extravasation peut léser les tissus jusqu’à la nécrose. Les thiazidiques augmentent le risque d’hypercalcémie ; les interactions avec digoxine, calcium-antagonistes, magnésium et épinéphrine figurent dans le <button class="w" data-k="e07-rcp-local">RCP</button>. Pendant la grossesse, ce texte réserve l’emploi aux situations indispensables avec contrôle de la calcémie ; il ne valide pas un test de stimulation de routine [<a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>].</p><p>Dans la série diagnostique italienne, 133 patients ont eu un recueil de tolérance et 67 une surveillance électrocardiogramme. La sensation de chaleur concernait 57 % ; 16,4 % étaient bradycardes avant et 25,4 % après, avec 9 % de nouveaux cas. Cette lecture explique les deux nombres et ne constitue pas une preuve d’innocuité universelle. Les seuils de réponse appartiennent à l’essai Immulite 2000 et à la sélection étudiée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>].</p><p class="src"><a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">[S34] RCP allemand B. Braun, §1–4.8</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2026-04/calcium_gluconate_v1.3.pdf" target="_blank" rel="noopener">[S35] PHEL</a> ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>] méthodes et sécurité.</p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e07-nosologie" data-title="Catégorie E07 : libellés, inclusions et exclusions">
<div class="lab">Définition</div><p>La catégorie E07 de la classification statistique suisse CIM-10-GM 2024 s’intitule « Autres affections de la thyroïde ». Ses quatre sous-codes sont E07.0 (hypersécrétion de calcitonine), E07.1 (goitre dû à un trouble de l’hormonosynthèse), E07.8 (autres affections précisées) et E07.9 (sans précision).</p>
<div class="lab">Contenu</div><p>Les notes de la classification internationale consultées dans le navigateur NHS précisent : E07.0 inclut l’hyperplasie des cellules C et l’hypersécrétion de thyrocalcitonine ; E07.1 inclut le goitre dyshormonogénétique familial et le syndrome de Pendred, et exclut le goitre congénital transitoire à fonction normale (P72.0) ; E07.8 inclut l’anomalie de la globuline liant la thyroxine, l’hémorragie, l’infarctus et le syndrome de basse triiodothyronine (maladie non thyroïdienne) ; E07.9 n’a pas de note.</p>
<div class="lab">Application</div><p>Un patient dont la calcitonine est élevée sans diagnostic établi ne relève pas encore de E07.0 : le code désigne l’hypersécrétion ou l’hyperplasie constatée. Le cancer médullaire est codé en C73, la dysgénésie thyroïdienne en E03.1.</p>
<div class="lab">Limite</div><p>L’office suisse publie les libellés sans notes d’inclusion ; les notes proviennent de la version de l’Organisation mondiale de la santé, qui n’est pas la modification allemande utilisée en Suisse.</p>
<p class="src">Source : Office fédéral de la statistique, CIM-10-GM 2024 ; NHS, navigateur ICD-10 5e édition, notes E07.</p></template>

<template data-pop="e07-calcitonine-phys" data-title="Calcitonine : précurseurs, rôle et valeurs normales">
<div class="lab">Définition</div><p>La calcitonine est un peptide de 32 acides aminés produit par les cellules C (parafolliculaires) de la thyroïde. Elle provient de la procalcitonine (116 acides aminés), elle-même issue d’une pré-prohormone de 141 acides aminés.</p>
<div class="lab">Rôle</div><p>Le rôle proposé est l’homéostasie calcique, par inhibition des ostéoclastes et de la réabsorption rénale du calcium. Après thyroïdectomie totale, l’absence de calcitonine n’entraîne pas de trouble calcique net, ce qui suggère une redondance : le dosage vaut surtout comme marqueur des cellules C.</p>
<div class="lab">Valeurs normales</div><p>La référence dépend de la méthode, du sexe et de l’âge. Viollier affiche &lt;4,9 ng/L chez la femme et &lt;11,9 chez l’homme ; ce sont des limites de laboratoire, pas des seuils opératoires. Le repère général 10 pg/ml de la revue ne remplace pas cette référence et n’est pas une norme néonatale.</p>
<div class="lab">Limite</div><p>Revue narrative ; les seuils ne se transposent pas d’un laboratoire à l’autre.</p>
<p class="src">Source : Giovanella et al., J Mol Endocrinol 2026;76(2).</p></template>

<template data-pop="e07-hcc" data-title="Hyperplasie des cellules C : physiologique et néoplasique">
<div class="lab">Définition</div><p>L’hyperplasie des cellules C désigne une augmentation du nombre de cellules productrices de calcitonine. Deux entités sont distinguées.</p>
<div class="lab">Hyperplasie physiologique ou réactive</div><p>Elle accompagne les affections thyroïdiennes inflammatoires, métaboliques et néoplasiques, et l’hypercalcémie. Elle est rarement reconnue avant l’opération. Son diagnostic repose sur l’immunohistochimie et l’analyse quantitative. Son potentiel de progression vers le cancer médullaire est incomplètement connu.</p>
<div class="lab">Hyperplasie néoplasique</div><p>Appelée carcinome médullaire in situ, elle est associée aux néoplasies endocriniennes multiples de type 2 et au cancer médullaire familial. Les cellules sont reconnaissables en coloration conventionnelle ; leur nombre n’est pas déterminant. La recherche d’un variant germinal de RET peut repérer la prédisposition avant les symptômes ; elle ne démontre pas à elle seule une hyperplasie histologique.</p>
<div class="lab">Application</div><p>Dans les néoplasies endocriniennes multiples de type 2, le cancer médullaire est habituellement bilatéral et multicentrique, très fréquemment associé à une hyperplasie qui le précède : c’est le fondement du dépistage précoce. Dans le cancer sporadique, l’hyperplasie est habituellement absente ou focale. Elle peut aussi accompagner la thyroïdite auto-immune et le petit carcinome papillaire.</p>
<div class="lab">Limite</div><p>Les définitions anatomopathologiques viennent de résumés d’auteurs américains et allemands ; elles décrivent des faits, non une conduite.</p>
<p class="src">Source : Albores et Krueger 2001 (Endocr Pathol) ; Sheu, Görges et Schmid 2003  ; Giovanella et al. 2026 ; Fugazzola et al. 2020.</p></template>

<template data-pop="e07-ct-causes" data-title="Causes non médullaires d’hypercalcitoninémie">
<div class="lab">Contenu</div><p>Tabagisme (10 à 15 pg/ml, surtout chez l’homme) ; goitre (10 à 20) ; thyroïdite auto-immune (10 à 15, liée au volume plus qu’à l’auto-immunité) ; inhibiteurs de la pompe à protons et hypergastrinémie (10 à 20) ; gastrite auto-immune, anémie de Biermer (15 à 40) ; insuffisance rénale chronique légère à modérée (10 à 20), avancée (20 à 50, rarement plus de 100) ; hyperplasie des cellules C sporadique (20 à 50), sévère (50 à 100, rare hors néoplasie endocrinienne multiple) ; hypercalcémie non médullaire (10 à 20) ; sepsis ou inflammation aiguë (10 à 40, transitoire) ; carcinome thyroïdien différencié (10 à 20) ; carcinome pulmonaire à petites cellules (100 à 1000 et plus) ; tumeur neuroendocrine du pancréas (20 à 300) ; carcinome neuroendocrine de la prostate (50 à 300).</p>
<div class="lab">Application</div><p>Devant 40 pg/ml chez une femme, le repère <button class="w" data-k="e07-sources-guides">ETA</button> de 30 est dépassé : confirmer et organiser l’avis spécialisé, tout en examinant causes possibles et interférences. Les fourchettes se chevauchent et ne permettent pas d’attribuer le résultat au tabac ou à un IPP.</p>
<div class="lab">Limite</div><p>Valeurs typiques d’une revue narrative, avec chevauchements.</p>
<p class="src">Source : Giovanella et al., J Mol Endocrinol 2026, tableau 2.</p></template>

<template data-pop="e07-ct-interference" data-title="Calcitonine : laboratoire suisse et interférences"><div class="lab">Préanalytique locale</div><p>Suivre le laboratoire réalisateur. CHUV : sérum sans gel, transport immédiat dans les 30 minutes ; sinon centrifuger, séparer et congeler. Viollier décrit un tube sérum avec gel puis séparation et congélation. Ces consignes différentes ne doivent pas être fusionnées en un tube universel. Noter heure, traitement et méthode ; le CHUV préfère un prélèvement à distance du repas et avant IPP, avec arrêt idéalement deux semaines seulement si possible et décidé médicalement.</p><div class="lab">Interférences</div><p>Hétérophiles, anticorps anti-réactifs, macrocalcitonine, biotine et effet crochet peuvent donner des valeurs inattendues. Une autre méthode, dilution ou précipitation au PEG peut aider selon l’hypothèse ; le laboratoire choisit la procédure, dont un résultat isolé ne constitue pas une preuve absolue.</p><div class="lab">Suivi</div><p>Préférer même laboratoire et même méthode pour une cinétique ; vérifier un changement de plateforme avant de conclure à une progression. Une valeur basse discordante avec un tableau suspect justifie aussi une vérification.</p><p class="src">[<a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>] CHUV et [<a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>] Viollier, fiches consultées ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>] méthodes, interférences et préanalytique.</p></template>

<template data-pop="e07-ct-seuils" data-title="Calcitonine : seuils d’interprétation">
<div class="lab">Zone grise</div><p>10 à 100 pg/ml, souvent due à une hyperplasie des cellules C ; au-delà de 100 pg/ml, un cancer médullaire est fortement évoqué, sans confirmation histologique par le seul chiffre.</p>
<div class="lab">Seuils d’action</div><p>Recommandation européenne 2023 sur les nodules : calcitonine basale supérieure à 30 pg/ml chez la femme et à 34 pg/ml chez l’homme, avec la réserve que plusieurs variables influencent le seuil ; ces valeurs viennent de l’étude italienne de Fugazzola (135 cas, 47 cancers médullaires). Recommandations allemandes citées par la revue de 2026 : environ 30 pg/ml chez la femme et 60 pg/ml chez l’homme.</p>
<div class="lab">Conduite sous le seuil</div><p>Pour certains dossiers sous les seuils d’action, la revue propose un contrôle à 3–6 mois ; une ascension conduit à une réévaluation spécialisée. Risque clinique et méthode priment sur un intervalle automatique.</p>
<div class="lab">Arbitrage de source</div><p>Pour un désaccord, la source primaire applicable la plus récente l’emporte, avec accès au texte en vigueur ; ici la recommandation européenne de 2023 est la référence des seuils d’action, la recommandation allemande n’étant citée que par une revue.</p>
<p class="src">Source : Durante, Hegedüs et al., <button class="w" data-k="e07-sources-guides">ETA</button> 2023 ; Fugazzola et al. 2020 ; Giovanella et al. 2026.</p></template>

<template data-pop="e07-test-calcium" data-title="Test de stimulation par le calcium : portée des preuves"><div class="lab">Indication</div><p>Le calcium stimule les cellules C ; le test n’est pas systématique pour toute calcitonine modérée. La revue 2026 conserve une place dans certains dossiers discordants, sécrétions ectopiques, insuffisance rénale ou évaluation spécialisée de porteurs RET, sans protocole universel.</p><div class="lab">Population et méthode</div><p>L’étude italienne comprend 135 patients sélectionnés pour chirurgie, dont 47 cancers médullaires ; elle exclut les variants RET germinaux. Dosage Immulite 2000. Seuils issus de la courbe de performance basaux &gt;30 pg/ml femme et &gt;34 homme ; stimulés &gt;79 et &gt;466. Tous les cancers étaient identifiés par la combinaison dans cet échantillon, sans garantie de sensibilité universelle.</p><div class="lab">Protocole rapporté</div><p>25 mg/kg de gluconate sur poids ajusté, équivalant dans l’étude à 2,3 mg/kg de calcium élément ; 5 ml/min, durée au moins trois minutes. La formule de poids ajusté n’est pas fournie ici. La transposition au médicament importé est interdite sans protocole validé : le <button class="w" data-k="e07-rcp-local">RCP</button> exact décrit une autre composition et une vitesse maximale adulte de 2 ml/min pour son indication d’hypocalcémie.</p><div class="lab">Tolérance réelle</div><p>Recueil chez 133 patients ; 67 surveillés par électrocardiogramme. Chaleur 57 %, bradycardie 16,4 % avant et 25,4 % après, soit 9 % de nouveaux cas. Les contre-indications du produit restent applicables.</p><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>] méthodes, résultats et discussion ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>] place actuelle ; [<a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>, <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2026-04/calcium_gluconate_v1.3.pdf" target="_blank" rel="noopener">S35</a>] produit exact et contexte suisse. Test diagnostique hors indication du <button class="w" data-k="e07-rcp-local">RCP</button>.</p></template>

<template data-pop="e07-pct" data-title="Procalcitonine dans le cancer médullaire">
<div class="lab">Valeurs</div><p>Les références et seuils dépendent de l’essai. Des études utilisent 0,1–0,2 ng/ml pour explorer un cancer médullaire ; une valeur indétectable peut être rassurante dans la population étudiée, mais ne suffit pas à exclure toute tumeur. Infection, inflammation systémique, traumatisme et insuffisance rénale doivent être considérés. Demi-vie de 20 à 24 heures ; peu de variation avec l’âge et le sexe. Usage hors autorisation pour la thyroïde.</p>
<div class="lab">Preuves</div><p>Méta-analyse de 11 études (5817 patients, 335 cancers médullaires) : sensibilité 0,90 (intervalle de confiance à 95 % de 0,71 à 0,97), spécificité 1,00 (0,85 à 1,00). Étude prospective néerlandaise avec cohorte de validation suisse (Lugano et Zurich) : pour une calcitonine de 10 à 100 pg/ml, la combinaison calcitonine et procalcitonine atteint une sensibilité de 100 % et une spécificité de 99,7 %.</p>
<div class="lab">Limite</div><p>Méta-analyse et cohorte chirurgicale sélectionnée, résumés seuls pour ces deux sources : la validation prospective portait sur 335 patients néerlandais et 61 suisses, dont 44 cancers médullaires. Les performances ne sont pas celles d’un dépistage universel ; une élévation ne se réduit pas au couple infection/cancer.</p>
<p class="src">Source : Giovanella et al. 2026 ; Giovanella et al., J Clin Endocrinol Metab 2021;106:3634 ; Schonebaum et al., Thyroid 2025;35:1030.</p></template>

<template data-pop="e07-ace-cytologie" data-title="Antigène carcinoembryonnaire et cytoponction dans le cancer médullaire">
<div class="lab">Antigène carcinoembryonnaire</div><p>Non spécifique au diagnostic ; utile au pronostic et au suivi. Seuil courant de 5 ng/ml, jusqu’à 10 ng/ml chez le fumeur.</p>
<div class="lab">Cytoponction</div><p>Dans une série de 104 cancers médullaires sporadiques (Pise), la cytoponction n’était diagnostique que chez 45,9 % des 85 patients ponctionnés, alors que la calcitonine préopératoire évoquait le cancer dans toutes les catégories échographiques. La recommandation européenne de 2023 juge utile le dosage de la calcitonine dans le liquide de lavage de ponction en cas de suspicion cytologique avec calcitonine sérique normale, ou de calcitonine sérique élevée.</p>
<div class="lab">Limite</div><p>Population déjà diagnostiquée, donc biais de sélection ; résumé seul.</p>
<p class="src">Source : Matrone, Elisei et al., J Endocrinol Invest 2026;49:1501 ; Durante, Hegedüs et al. 2023 ; Giovanella et al. 2026.</p></template>

<template data-pop="e07-cochrane" data-title="Calcitonine : performances et probabilité avant test"><div class="lab">Population</div><p>La revue Cochrane 2020 regroupe 16 études et 72 368 participants avec nodules ; recherche jusqu’à juin 2018. La prévalence médiane est 0,32 % dans l’ensemble, 0,23 % dans le calcul rapporté de valeur prédictive au seuil de 10 pg/ml.</p><div class="lab">Résultats du résumé</div><p>À 10 pg/ml : sensibilité groupée 100 % (intervalle de confiance 95 % 99,7–100), spécificité 97,2 % (95,9–98,6), valeur prédictive positive 7,7 % (4,9–12,1) pour la prévalence utilisée. Ces nombres ne sont pas des performances garanties pour chaque sexe, laboratoire ou contexte.</p><div class="lab">Limites</div><p>Quinze des seize études n’avaient pas une référence ou un suivi adéquat pour les résultats négatifs, d’où un risque important de surestimation. L’amélioration du pronostic par un dépistage systématique reste incertaine. Le résumé n’autorise pas à affirmer qu’une calcitonine à n’importe quel niveau n’a que 7,7 % de risque.</p><p class="src">[<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/32176812/" target="_blank" rel="noopener">S7</a>] résumé structuré intégral, PMID 32176812 ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S5</a>] <button class="w" data-k="e07-sources-guides">ETA</button> 2023 : indications ciblées et absence de position pour ou contre le dépistage universel.</p></template>

<template data-pop="e07-ret" data-title="RET : conseil génétique et prise en charge spécialisée">
<div class="lab">Mécanisme et famille</div><p>Des variants constitutionnels activateurs de RET prédisposent à la NEM2, de transmission autosomique dominante. Un parent porteur peut transmettre le variant avec un risque de 50 % à chaque grossesse ; le risque et l’âge d’expression des manifestations dépendent du variant.</p><div class="lab">Décision</div><p>Le document NHS révisé en 2024 décrit trois niveaux de risque. M918T justifie une prise en charge très précoce avec thyroïdectomie avant un an ; les variants à haut risque conduisent à une chirurgie avant cinq ans ; la décision pour les variants à risque modéré est individualisée. Un résultat génétique dans la famille impose une consultation spécialisée, sans attendre des symptômes. La calcitonine et l’échographie contribuent au bilan ; aucun test stimulé n’est obligatoire dans tous les cas.</p><div class="lab">Sécurité</div><p>Rechercher un phéochromocytome avant une chirurgie chez un patient avec NEM2 ; organiser sa surveillance ainsi que celle de l’hyperparathyroïdie selon le risque. Les anciens âges de 8 et 20 ans ne constituent pas ici une consigne universelle.</p><div class="lab">Portée</div><p>Synthèse britannique fondée notamment sur la classification ATA américaine ; les âges ne remplacent pas une décision du centre expert. Le tableau du site sur le test génétique ne doit pas être utilisé pour différer une cascade familiale chez un enfant.</p><p class="src">[<a data-reference-source="1" href="https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/multiple-endocrine-neoplasia-type-2/" target="_blank" rel="noopener">S4</a>] NHS GeNotes, révision 29.05.2024, rubriques diagnostic, hérédité, prise en charge et tableau 1 ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>] Giovanella 2026.</p>
</template>

<template data-pop="e07-hc" data-title="Hypothyroïdie congénitale : épidémiologie et causes">
<div class="lab">Fréquence</div><p>L’hypothyroïdie congénitale primaire touche environ 1/3000 à 1/2000 nouveau-nés ; la forme centrale jusqu’à environ 1/16 000.</p>
<div class="lab">Causes</div><p>La dysgénésie (athyréose, ectopie, hypoplasie) représente environ 65 % des formes primaires permanentes. Les 35 % restants ont une glande en place ; moins de la moitié relèvent d’un défaut héréditaire de synthèse, la dyshormonogenèse. La transmission est généralement autosomique récessive, avec un risque de récurrence de 25 % lorsque les deux parents portent un variant pathogène du même gène dans un modèle récessif ; DUOX1, DUOX2 et IYD peuvent être dominants ou à pénétrance incomplète.</p>
<div class="lab">Mécanisme commun</div><p>Un défaut de synthèse peut abaisser la FT4 et augmenter la <button class="w" data-k="e07-hormones-local">TSH</button>, favorisant le goitre. L’intensité varie ; certaines formes sont transitoires ou sans goitre. Ni une <button class="w" data-k="e07-hormones-local">T3</button> conservée ni une glande peu volumineuse ne suffisent à l’exclure.</p>
<p class="src">Source : van Trotsenburg et al., Thyroid 2021;31:387-419 (consensus ENDO-ERN, Société européenne d’endocrinologie pédiatrique, Société européenne d’endocrinologie).</p></template>

<template data-pop="e07-genes" data-title="Gènes de l’hormonosynthèse et phénotypes">
<div class="lab">Contenu</div><p>SLC5A5 (NIS) : captation basolatérale de l’iodure, captation nulle ou faible, goitre. SLC26A4 (pendrine) : efflux apical de l’iodure, défaut partiel d’organification, hypothyroïdie légère à modérée, thyroglobuline élevée, syndrome de Pendred avec surdité. <button class="w" data-k="e07-tpo-local">TPO</button> : organification et couplage, défaut complet, hypothyroïdie sévère, goitre. TG : précurseur thyroglobuline, captation élevée, goitre congénital ou à croissance rapide, thyroglobuline basse. DUOX2 et DUOX1 : production de peroxyde d’hydrogène, hypothyroïdie transitoire ou permanente. DUOXA2 : chaperon de DUOX2. IYD : recyclage de l’iode, captation préservée, test au perchlorate négatif, thyroglobuline élevée. SLC26A7 : transporteur d’anions, goitre, audition normale.</p>
<div class="lab">Limite</div><p>Des mutations de <button class="w" data-k="e07-tpo-local">TPO</button>, SLC26A4 et DUOX2 ont aussi été trouvées dans des hypothyroïdies congénitales sans goitre avec hypoplasie ; une oligogénicité est décrite.</p>
<p class="src">Source : consensus ENDO-ERN 2020-2021, tableau 3.</p></template>

<template data-pop="e07-perchlorate" data-title="Test au perchlorate et thyroglobuline">
<div class="lab">Principe</div><p>Le test mesure la décharge d’iode 123 après administration de perchlorate. Il est positif si plus de 10 % de l’iode 123 est déchargé, ce qui indique un défaut d’organification.</p>
<div class="lab">Orientation du gène</div><p>La combinaison du test et de la thyroglobuline sérique oriente le gène : thyroglobuline basse, gène TG ; thyroglobuline haute, gènes <button class="w" data-k="e07-tpo-local">TPO</button>, DUOX2, SLC26A4 ou IYD.</p>
<div class="lab">Application</div><p>Le test est négatif dans le défaut de recyclage par IYD : l’iode est organifié mais mal recyclé.</p>
<p class="src">Source : consensus ENDO-ERN 2020-2021.</p></template>

<template data-pop="e07-depistage" data-title="Dépistage néonatal en Suisse et recommandation ENDO-ERN">
<div class="lab">Recommandation ENDO-ERN</div><p>La thyréostimuline est le test le plus sensible pour l’hypothyroïdie congénitale primaire (grade 1). La thyroxine y est ajoutée si possible pour la forme centrale (grade 2). Un deuxième prélèvement à 10 à 14 jours est conseillé chez les nouveau-nés à risque, dont les prématurés.</p>
<div class="lab">Suisse</div><p>Le prélèvement sur buvard est fait au quatrième jour de vie. Le laboratoire national est à Zurich (Kinderspital) ; environ 80 000 à 85 000 échantillons sont analysés chaque année ; 11 maladies hormonales et métaboliques sont dépistées.</p>
<div class="lab">Limite</div><p>Le seuil opérationnel suisse de rappel n’est pas fourni ici ; la page suisse décrit onze maladies et une fréquence d’hypothyroïdie d’environ 1/3500 nouveau-nés, distincte de la fréquence de la seule dyshormonogenèse. Un dépistage fondé sur la thyroxine peut être trompé par un déficit en globuline liante.</p>
<p class="src">Source : van Trotsenburg et al. 2021 ; dépistage néonatal suisse du Kinderspital Zürich ; Hengeveld et al., Horm Res Paediatr 2021.</p></template>

<template data-pop="e07-imagerie-hc" data-title="Imagerie de l’hypothyroïdie congénitale">
<div class="lab">Règle</div><p>Débuter le traitement avant l’imagerie. La scintigraphie, avec ou sans test au perchlorate, l’échographie, ou les deux, précisent la cause.</p>
<div class="lab">Piège</div><p>La scintigraphie peut être faussement négative si elle est réalisée plus de 5 à 7 jours après le début de la lévothyroxine.</p>
<div class="lab">Application</div><p>Un nouveau-né à thyroxine libre basse et thyréostimuline nettement élevée est traité le jour de la confirmation ; l’imagerie vient après.</p>
<p class="src">Source : consensus ENDO-ERN 2020-2021.</p></template>

<template data-pop="e07-pendred" data-title="Syndrome de Pendred">
<div class="lab">Définition</div><p>Maladie autosomique récessive associant surdité neurosensorielle, goitre et défaut d’organification de l’iodure, avec ou sans hypothyroïdie. La surdité, liée à des malformations de l’oreille interne (aqueduc vestibulaire élargi, dysplasie de Mondini), est le signe cardinal ; le phénotype thyroïdien est variable et modulé par l’apport iodé.</p>
<div class="lab">Mécanisme</div><p>Mutations biallèliques de SLC26A4, qui code la pendrine, échangeur d’anions (chlorure, iodure, bicarbonate). Dans l’oreille interne, la pendrine maintient la composition et le potentiel de l’endolymphe ; dans la thyroïde, elle est apicale et participe à l’efflux d’iodure vers la lumière folliculaire ; au rein, elle sécrète le bicarbonate, d’où une alcalose métabolique sévère décrite lors d’une charge alcaline.</p>
<div class="lab">Épidémiologie</div><p>Cause de 4 à 7,5 % des surdités héréditaires ; prévalence estimée de 7,5 à 10 pour 100 000 hors populations africaines.</p>
<div class="lab">Diagnostic</div><p>Évoquer le syndrome devant une surdité neurosensorielle congénitale avec ou sans goitre ; répéter les tests auditifs avant l’âge scolaire chez tout enfant atteint d’hypothyroïdie congénitale. Dans une cohorte européenne de 37 probands avec aqueduc vestibulaire élargi ou syndrome de Pendred, 13 diagnostics génétiques ont été résolus (35 %), dont 7 Pendred et 6 formes auditives non syndromiques ; ce n’est pas le rendement de tout test réalisé pour Pendred.</p>
<div class="lab">Évolution</div><p>La morphologie de l’oreille interne peut varier au sein d’une même famille. L’implant cochléaire donne en général un bénéfice utile (revue systématique, preuves de faible niveau). De rares cancers thyroïdiens sont rapportés (environ 1 % selon une revue de cas), avec un faible niveau de preuve ; cette estimation n’est pas un risque individuel établi.</p>
<p class="src">Source : Wémeau et Kopp 2017 ; Manuelli et al. 2026 ; Sklenar et al. 2025 ; Islam et al. 2025 ; Chen et al. 2024 ; Biggs et al. 2020 ; Wu et al. 2026 ; van Trotsenburg et al. 2021.</p></template>

<template data-pop="e07-goitre-neonatal" data-title="Goitre congénital compressif et goitre fœtal">
<div class="lab">Cas rapportés</div><p>Un variant homozygote du gène de la thyroglobuline a donné un goitre congénital massif avec compression trachéale néonatale nécessitant une intubation, régressif sous lévothyroxine. Une série de quatre cas consécutifs décrit le goitre fœtal comme une menace vitale in utero, avec une prise en charge interdisciplinaire et parfois une stratégie de traitement intra-partum ex utero.</p>
<div class="lab">Application</div><p>Un goitre fœtal ou néonatal volumineux est une urgence respiratoire avant d’être un problème hormonal.</p>
<div class="lab">Limite</div><p>Un cas clinique et une série de cas ; aucune recommandation.</p>
<p class="src">Source : Anık et al., Hormones 2026 ; Scharf et al., Arch Gynecol Obstet 2026;313(1).</p></template>

<template data-pop="e07-levo-hc" data-title="Lévothyroxine dans l’hypothyroïdie congénitale">
<div class="lab">Traitement</div><p>Début au plus tard à 2 semaines de vie ou dès la confirmation ; dose initiale pouvant atteindre 15 µg/kg/jour ; forme sévère (thyroxine libre inférieure à 5 pmol/l) 10 à 15 µg/kg/jour ; forme légère environ 10 µg/kg/jour ; FT4 initialement normale pour l’âge : 5 à 10 µg/kg/jour peuvent être envisagés ; une prise orale par jour. Des études en fratrie montrent un quotient intellectuel normal si la lévothyroxine débute avant 10 jours à au moins 10 µg/kg/jour.</p>
<div class="lab">Suivi</div><p>Contrôle 1 à 2 semaines après le début (au plus tard une semaine si la dose initiale atteint 50 µg/j ou davantage), puis toutes les 2 semaines jusqu’à normalisation de la thyréostimuline, puis tous les 1 à 3 mois jusqu’à 12 mois, tous les 2 à 4 mois de 1 à 3 ans, tous les 3 à 6 mois ensuite ; 4 à 6 semaines après tout changement de dose. Prélèvement avant la dose ou au moins 4 heures après.</p>
<div class="lab">Pronostic</div><p>Croissance, puberté, fertilité, santé osseuse, métabolique et cardiovasculaire normales dans l’hypothyroïdie congénitale non syndromique bien traitée.</p>
<p class="src">Source : van Trotsenburg et al., Thyroid 2021;31:387-419.</p></template>

<template data-pop="e07-euthyrox" data-title="Euthyrox oral : information professionnelle suisse exacte"><div class="lab">Produit</div><p>Lévothyroxine sodique, autorisation 54949, FI février 2023 ; GTIN de consultation 7680549490017. Indication de substitution d’une hypothyroïdie ; une <button class="w" data-k="e07-hormones-local">T4</button> totale basse avec euthyroïdie n’est pas une indication.</p><div class="lab">Posologies de la FI</div><p>0–6 mois : 25–75 µg/j (10 µg/kg) ; 6–12 mois : 50–75 µg/j (8 µg/kg) ; 1–5 ans : 75–100 µg/j (5–6 µg/kg) ; 6–12 ans : 100–150 µg/j (4–5 µg/kg) ; dès 12 ans, posologie adulte. Adulte : début habituel 25–50 µg/j, augmentations de 25–50 µg toutes les 2–4 semaines ; individualiser et commencer prudemment à 25 µg dans les situations mentionnées par la FI. Les doses néonatales selon gravité du consensus ENDO-ERN sont exposées séparément.</p><div class="lab">Contre-indications</div><p>Hypersensibilité, insuffisance cardiaque avec tachycardie, pancardite ou myocardite aiguë, infarctus aigu du myocarde, angine de poitrine, troubles hypophysaires ou surrénaliens non traités, hyperthyroïdie hors emploi associé autorisé. Association à un thyréostatique contre-indiquée pendant la grossesse.</p><div class="lab">Administration et interactions</div><p>À jeun au moins 30 minutes avant le repas ; suspension extemporanée dans l’eau chez le nourrisson. Prendre au moins deux heures avant sels de calcium/fer/aluminium, quatre à cinq heures avant résines. IPP, soja, inducteurs enzymatiques et autres médicaments peuvent modifier les besoins ; surveiller aussi coagulation sous antivitamine K et glycémie chez le diabétique. Signaler la biotine au laboratoire.</p><div class="lab">Effets indésirables et surveillance</div><p>Hypersensibilité/angiœdème, symptômes de thyrotoxicose, troubles du rythme, symptômes angineux, aggravation cardiaque, agitation, insomnie, tremblements, convulsions, diarrhée et sueurs ; fréquences non déterminables. Chez le prématuré de très faible poids, surveiller la circulation. Contrôler FT4, <button class="w" data-k="e07-hormones-local">TSH</button> et clinique selon âge et cause ; ne pas modifier la dose sur une <button class="w" data-k="e07-hormones-local">T3</button> totale isolée.</p><div class="lab">Grossesse et autres organes</div><p>Continuer la substitution indiquée avec suivi spécialisé ; besoins parfois augmentés. Après accouchement, retour à la dose antérieure et contrôle <button class="w" data-k="e07-hormones-local">TSH</button> à 6–8 semaines selon FI. Aucune adaptation rénale ou hépatique forfaitaire n’est établie par la FI.</p><p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">[S19] AIPS/Swissmedic via AmiKo, FI exacte</a>. Pharmacocinétique : liaison 99,97 %, demi-vie environ 7 jours ; pas d’extrapolation à une préparation injectable.</p></template>

<template data-pop="e07-interactions-levo" data-title="Interactions de la lévothyroxine">
<div class="lab">Absorption</div><p>Sels de fer, calcium et aluminium : prendre la lévothyroxine au moins 2 heures avant. Résines : 4 à 5 heures. Inhibiteurs de la pompe à protons, soja, orlistat et inducteurs enzymatiques sont aussi cités.</p>
<div class="lab">Besoins et dosage</div><p>Les œstrogènes augmentent les besoins. La biotine fausse les immunodosages. Le furosémide, les salicylates et les anticoagulants oraux déplacent la thyroxine de ses protéines.</p>
<div class="lab">Application</div><p>Avant d’augmenter la dose d’un enfant dont la thyréostimuline reste élevée, on vérifie l’observance, l’heure de prise et les produits pris simultanément.</p>
<p class="src">Source : information professionnelle suisse Euthyrox®, février 2023.</p></template>

<template data-pop="e07-gluconate-test" data-title="Calcium diagnostique : étude et RCP exact"><div class="lab">Rôle</div><p>La stimulation des cellules C peut aider dans des situations choisies ; les dosages sensibles ont réduit son usage. Elle ne sépare pas sans erreur hyperplasie et cancer.</p><div class="lab">Étude</div><p>Fugazzola décrit 25 mg/kg de gluconate sur poids ajusté, soit 2,3 mg/kg de calcium élément, à 5 ml/min pendant au moins trois minutes. Cette dose est rapportée pour comprendre l’étude ; elle ne constitue pas une prescription du produit importé.</p><div class="lab">Produit et indication</div><p>Calciumgluconat B. Braun 10 % allemand, mentionné par PHEL : 940 mg de gluconate et calcium du saccharate, total 2,25 mmol/10 ml. <button class="w" data-k="e07-rcp-local">RCP</button> juillet 2014 : hypocalcémie aiguë symptomatique, vitesse adulte IV au plus 2 ml/min. La stimulation de calcitonine est hors indication ; pharmacie et centre expert doivent valider un protocole propre.</p><div class="lab">Risques</div><p>Hypercalcémie, hypercalciurie, glycosides cardiaques et règles ceftriaxone constituent des points de sécurité majeurs. Surveiller rythme, pression et site de perfusion ; extravasation, hypotension et arythmies sont possibles. La chaleur de l’étude (57 %) et les 9 % de bradycardies nouvelles ne prouvent pas une innocuité générale.</p><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>] étude italienne ; [<a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">S34</a>] <button class="w" data-k="e07-rcp-local">RCP</button> exact §1–4.8 ; [<a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2026-04/calcium_gluconate_v1.3.pdf" target="_blank" rel="noopener">S35</a>] PHEL suisse ; détails dans l’onglet pharmacologique.</p></template>

<template data-pop="e07-tsh-medicaments" data-title="Dopamine et glucocorticoïdes à haute dose sur la thyréostimuline">
<div class="lab">Contenu</div><p>La dopamine et les glucocorticoïdes à haute dose abaissent la thyréostimuline, y compris chez le patient hypothyroïdien. Le cortisol peut réduire la stimulation centrale et modifier le métabolisme hormonal ; les variations de désiodases dépendent du tissu, du modèle et du stade de la maladie, comme le détaille la fenêtre NTIS.</p>
<div class="lab">Application</div><p>Chez un patient de soins intensifs, une thyréostimuline basse ne prouve pas un axe normal : le médicament peut la masquer.</p>
<p class="src">Source : Fliers et Boelen, An update on non-thyroidal illness syndrome, 2021 ; Gierach et Junik, Endokrynol Pol 2026.</p></template>

<template data-pop="e07-tsh-cible" data-title="Dyshormonogenèse : cible de thyréostimuline et surveillance du goitre">
<div class="lab">Consigne</div><p>Viser une thyréostimuline dans la partie basse de la norme et surveiller le volume thyroïdien par échographie tous les 2 à 3 ans. Cytoponction des nodules suspects.</p>
<div class="lab">Justification</div><p>La thyréostimuline stimule la croissance de la glande : la maintenir basse-normale limite le goitre. De rares cancers papillaires ou folliculaires sont rapportés, souvent lors d’une thyréostimuline durablement élevée par mauvaise observance à l’adolescence.</p>
<div class="lab">Réévaluation</div><p>Après 2 à 3 ans, si le diagnostic permanent n’est pas établi chez un enfant à glande en place ; une thyréostimuline de 10 mU/l ou plus après 4 semaines d’arrêt signe une hypothyroïdie primaire permanente.</p>
<p class="src">Source : van Trotsenburg et al. 2021.</p></template>

<template data-pop="e07-tbg" data-title="TBG : déficit, excès et affinité"><div class="lab">Normal</div><p><button class="w" data-k="e07-tbg">TBG</button> est une glycoprotéine synthétisée dans le foie, codée par SERPINA7 sur le chromosome X ; elle transporte environ 70 % de la <button class="w" data-k="e07-hormones-local">T3</button> et 75 % de la <button class="w" data-k="e07-hormones-local">T4</button> sériques. <button class="w" data-k="e07-tbg">TBG</button> n’est pas la thyroglobuline (TG), précurseur de la synthèse thyroïdienne.</p><div class="lab">Trois profils</div><p>Déficit complet ou partiel : hormones totales basses ; excès, notamment par duplication ou triplication : hormones totales élevées. Dans une anomalie isolée, la fonction libre peut rester normale. Une variation d’affinité peut survenir avec une concentration de <button class="w" data-k="e07-tbg">TBG</button> normale, comme dans le cas néerlandais dépisté à tort pour hypothyroïdie centrale.</p><div class="lab">Génétique et fréquence</div><p>Expression plus complète chez l’homme hémizygote ; femmes hétérozygotes variables. Les fréquences de déficit partiel (environ 1/4000) et complet (1/15000) sont citées en introduction de la série coréenne ; elles ne sont pas mesurées par ses quatre cas et ne représentent pas des estimations suisses.</p><div class="lab">Décision</div><p>Confronter clinique, <button class="w" data-k="e07-hormones-local">TSH</button>, FT4 et méthode avant de conclure. Une anomalie isolée de transport ne demande pas de lévothyroxine. Dans la série coréenne, une patiente avait pourtant une hypothyroïdie auto-immune concomitante nécessitant sa substitution : la <button class="w" data-k="e07-tbg">TBG</button> anormale ne doit pas la faire interrompre.</p><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>] corps et discussion ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/34126618/" target="_blank" rel="noopener">S18</a>] résumé du cas de faible affinité ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>] section anomalies de liaison ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>] méthode de résolution des discordances.</p></template>

<template data-pop="e07-facteurs-liaison" data-title="Liaison hormonale : contexte physiologique et médicaments"><div class="lab">Concentration et affinité</div><p>Œstrogènes et grossesse augmentent la liaison et les concentrations totales. Une maladie grave ou une hypoprotéinémie de cirrhose peuvent réduire la capacité de liaison. Un excès constitutionnel de <button class="w" data-k="e07-tbg">TBG</button> peut résulter d’une duplication ou triplication de SERPINA7 ; ce mécanisme est distinct d’un déplacement médicamenteux.</p><div class="lab">Interactions</div><p>Furosémide, salicylates et anticoagulants oraux peuvent déplacer la lévothyroxine. Phénytoïne et certains inhibiteurs de protéase peuvent associer déplacement et augmentation de clairance : l’effet net ne se déduit pas d’une seule flèche. Les œstrogènes peuvent accroître les besoins chez une personne déjà substituée.</p><div class="lab">Exploration</div><p>Lire total, FT4, <button class="w" data-k="e07-hormones-local">TSH</button> et état clinique ensemble ; appeler le laboratoire si une anomalie de liaison perturbe un immunodosage. Ne pas traiter une <button class="w" data-k="e07-hormones-local">T4</button> totale élevée isolée comme une hyperthyroïdie, ni une <button class="w" data-k="e07-hormones-local">T4</button> totale basse isolée comme une hypothyroïdie. Les autres causes acquises ne sont pas une liste exhaustive dans cette leçon.</p><p class="src">[<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>] FI Euthyrox, interactions et pharmacocinétique ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>] <button class="w" data-k="e07-tbg">TBG</button>/TTR/albumine ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>] interférences.</p></template>

<template data-pop="e07-smnt-meca" data-title="Maladie non thyroïdienne : mécanismes et limites">
<div class="lab">Échelle systémique</div><p>La maladie et la restriction calorique peuvent abaisser rapidement la <button class="w" data-k="e07-hormones-local">T3</button> circulante ; <button class="w" data-k="e07-hormones-local">T4</button> et <button class="w" data-k="e07-hormones-local">TSH</button> peuvent diminuer lorsque la maladie se prolonge. Inflammation, médicaments, protéines de liaison, transport cellulaire et métabolisme local interagissent. La reverse-T3 peut augmenter, rester normale ou baisser : elle ne définit pas à elle seule le syndrome.</p><div class="lab">Échelle tissulaire</div><p>La DIO1 hépatique diminue fréquemment. L’activité de DIO2 et DIO3 varie selon tissu, modèle et stade ; on ne peut pas attribuer la même flèche à tous les organes. Dans les modèles inflammatoires, la DIO2 des tanycytes augmente et participe à la réduction de TRH. Les transporteurs MCT8/MCT10 et les récepteurs sont aussi modulés. Les macrophages et neutrophiles ont des réponses différentes, décrites en partie dans des modèles expérimentaux.</p><div class="lab">Conséquence clinique</div><p>Une concentration sérique basse ne mesure pas directement l’action hormonale de chaque tissu. Normaliser le sang par une hormone ne garantit pas de normaliser les tissus ; cela explique pourquoi un résultat de laboratoire ne constitue pas une cible thérapeutique automatique.</p><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>] Fliers et Boelen 2021, transport des hormones thyroïdiennes, réponses propres aux tissus et organes, mécanismes des changements du métabolisme hormonal et conclusion. Données humaines et expérimentales distinguées.</p>
</template>

<template data-pop="e07-smnt-dd" data-title="Maladie non thyroïdienne : diagnostic différentiel">
<div class="lab">Raisonnement</div><p>En maladie critique, <button class="w" data-k="e07-hormones-local">T3</button> basse, <button class="w" data-k="e07-hormones-local">T4</button> normale ou basse et <button class="w" data-k="e07-hormones-local">TSH</button> normale ou basse évoquent le syndrome de maladie non thyroïdienne. Une <button class="w" data-k="e07-hormones-local">TSH</button> normale ne suffit pas à exclure une hypothyroïdie concomitante : dopamine, glucocorticoïdes, atteinte hypophysaire et phase de la maladie modifient l’interprétation. Rechercher un traitement antérieur, une maladie thyroïdienne ou hypophysaire, la chronologie et les anciens bilans.</p><div class="lab">Discrimination</div><p>Une <button class="w" data-k="e07-hormones-local">TSH</button> franchement élevée avec FT4 basse soutient une hypothyroïdie primaire, mais la récupération peut produire une remontée transitoire. Les anticorps anti-<button class="w" data-k="e07-tpo-local">TPO</button> soutiennent une cause auto-immune sans la prouver isolément. La reverse-T3 n’est ni toujours élevée en NTIS ni suffisamment fiable pour trancher ; elle n’est pas un examen de routine permettant d’exclure une hypothyroïdie.</p><div class="lab">Urgence</div><p>Hypothermie, altération de conscience et défaillance cardiorespiratoire exigent une évaluation urgente d’une hypothyroïdie sévère parmi les autres causes. Ne pas attendre une <button class="w" data-k="e07-hormones-local">TSH</button> très élevée pour agir si le contexte suggère une atteinte centrale ou médicamenteuse. Les présentations et posologies injectables relèvent d’un protocole hospitalier propre, non de la FI Euthyrox orale.</p><div class="lab">Pronostic</div><p>La baisse hormonale accompagne la gravité sans prouver qu’une substitution améliore la survie. Une hypothyroïdie avérée reste à traiter ; une <button class="w" data-k="e07-hormones-local">T3</button> basse isolée ne suffit pas à prescrire.</p><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>] Fliers et Boelen 2021, Differential diagnosis and clinical implications ; [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>] FI Euthyrox, contre-indications et surveillance.</p>
</template>

<template data-pop="e07-smnt-traitement" data-title="Maladie non thyroïdienne : traitement">
<div class="lab">Contenu</div><p>Les essais hétérogènes en maladie critique n’établissent pas un bénéfice clinique justifiant une substitution systématique du NTIS. La lévothyroxine se poursuit chez l’hypothyroïdien connu.</p>
<div class="lab">Application</div><p>La conduite vise la maladie causale ; une hypothyroïdie authentique, connue ou nouvellement identifiée, conserve son indication de traitement.</p>
<p class="src">Source : Fliers et Boelen 2021.</p></template>

<template data-pop="e07-hemorragie" data-title="Hémorragie et infarctus de la thyroïde">
<div class="lab">Hémorragie : priorité respiratoire</div><p>Une tuméfaction rapidement croissante après traumatisme ou ponction peut comprimer les voies aériennes. Le cas conservateur publié concernait une femme sans stridor ni détresse respiratoire, surveillée en soins intensifs ; il ne justifie pas l’observation seule devant une obstruction. Un décès post-ponction par hémorragie cervicale compressive est documenté, bien que cette complication soit exceptionnelle.</p><div class="lab">Infarctus après ponction</div><p>Une ponction peut exceptionnellement provoquer nécrose, hémorragie, fibrose et disparition partielle du tissu d’un nodule. Dans une série sélectionnée de 656 patients opérés, 17 nodules (2,5 %) avaient des changements de ce type ; ce pourcentage ne mesure pas le risque de toute ponction. Une série de 28 cas d’infarctus montrait des discordances cytologie–histologie, notamment lorsqu’une mince couronne tumorale viable n’était pas reconnue.</p><div class="lab">Conduite raisonnée</div><p>Transmettre au pathologiste la cytologie initiale, la date du geste et les images ; examiner soigneusement les zones viables et l’invasion capsulaire ou périphérique. La disparition apparente d’un nodule ou l’absence de cellules viables dans une coupe ne prouvent pas une guérison oncologique. Aucune indication d’anticoagulation ou de thrombolyse thyroïdienne n’est déduite du mot « infarctus ».</p><p class="src">[<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>] résumés des cas d’hémorragie ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/27294033/" target="_blank" rel="noopener">S38</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8955603/" target="_blank" rel="noopener">S39</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/31967057/" target="_blank" rel="noopener">S40</a>] résumés des séries et du cas d’infarctus post-ponction. Limites : données observationnelles sélectionnées, pas essai thérapeutique.</p>
</template>

<template data-pop="e07-prematures" data-title="Prématurés de très faible poids et lévothyroxine">
<div class="lab">Contenu</div><p>L’information professionnelle suisse signale l’immaturité de l’axe et une possible insuffisance corticosurrénalienne chez le prématuré de très faible poids, avec un collapsus cardiovasculaire rapporté sous lévothyroxine.</p>
<div class="lab">Application</div><p>Le traitement du prématuré demande une surveillance étroite ; un deuxième prélèvement de dépistage à 10 à 14 jours est conseillé chez les nouveau-nés à risque.</p>
<p class="src">Source : information professionnelle Euthyrox®, février 2023 ; van Trotsenburg et al. 2021.</p></template>

<template data-pop="e07-mnemo" data-title="Aide mnémotechnique : bilan thyroïdien discordant">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Ordre de lecture en trois questions : <b>Libre ?</b> la thyroxine libre est-elle normale ? <b>Stimuline ?</b> la thyréostimuline est-elle normale ? <b>Contexte ?</b> le patient est-il en réanimation, enceinte, sous médicament ? Si FT4 et <button class="w" data-k="e07-hormones-local">TSH</button> sont fiables et normales dans un contexte stable, une <button class="w" data-k="e07-hormones-local">T4</button> totale basse évoque une anomalie de transport ; rechercher néanmoins une maladie coexistante si la clinique l’impose.</p>
<div class="lab">Limite</div><p>Cette aide ne remplace aucun critère diagnostique et ne s’applique ni à la calcitonine ni à la dyshormonogenèse.</p></template>

<template data-pop="e07-sources-guides" data-title="Sources, lecture et limites de la leçon"><div class="lab">Sources nouvelles et relues</div><p>Laboratoires CHUV/Viollier, dépistage suisse, FI Euthyrox, fiche PHEL et <button class="w" data-k="e07-rcp-local">RCP</button> exact du calcium importé ; ENDO-ERN 2021, <button class="w" data-k="e07-sources-guides">ETA</button> 2023/2024, synthèse NHS NEM2 2024, revues calcitonine 2026 et NTIS 2021. Les cas rares sont signalés comme résumés. La bibliographie détaillée associe identifiant, URL, passage lu, population et limite.</p><div class="lab">Limites maintenues</div><p>Pas de recommandation suisse unique E07, pas de seuil opérationnel de rappel néonatal suisse publié ici, pas de fréquence nationale globale ni de score unique. Le test de calcium est hors indication du produit importé. Les données d’hémorragie/infarctus et certaines données génétiques reposent sur de petites séries. Les seuils de laboratoire et d’étude ne sont pas universels.</p><div class="lab">Statut</div><p>Auto-relecture par intelligence artificielle ; aucune validation médicale humaine. Les anciens dossiers restent des preuves historiques et ne certifient pas cette version.</p></template>

<template data-pop="pareto-e07-definition" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="e07-1,e07-2"></p><ul><li>E07.0 calcitonine et cellules C ; E07.1 dyshormonogenèse et Pendred ; E07.8 globuline liante, hémorragie, maladie non thyroïdienne ; E07.9 sans précision. Cancer médullaire en C73, dysgénésie en E03.1.</li><li>Hypothyroïdie congénitale primaire 1/3000 à 1/2000 ; dysgénésie 65 % ; récurrence récessive 25 % si les deux parents sont porteurs.</li><li>Cancer médullaire parmi les nodules : moins de 0,5 % ; déficit partiel en globuline liante 1/4000.</li></ul></template>
<template data-pop="pareto-e07-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="e07-3,e07-4"></p><ul><li>Cellules C : calcitonine de 32 acides aminés ; marqueur plus que régulateur ; élevée aussi par causes bénignes (tabac, inhibiteur de la pompe à protons, rein).</li><li>Dyshormonogenèse : défaut de synthèse de gravité variable, goitre possible ; plusieurs gènes et phénotypes possibles par étape.</li><li>Globuline liante : hormones totales basses, libres normales. Maladie non thyroïdienne : triiodothyronine basse par désiodases et thyréolibérine.</li></ul></template>
<template data-pop="pareto-e07-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="e07-5,e07-6"></p><ul><li>Rechercher cancer médullaire ou néoplasie endocrinienne multiple, surdité, goitre familial, maladie aiguë, médicaments.</li><li>Examiner le cou et les voies aériennes ; répéter les tests auditifs chez l’enfant.</li><li>Un examen normal n’exclut ni hyperplasie ni anomalie de transport.</li></ul></template>
<template data-pop="pareto-e07-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="e07-7,e07-8"></p><ul><li>Calcitonine : norme du laboratoire, sexe et méthode ; repères <button class="w" data-k="e07-sources-guides">ETA</button> &gt;30 pg/ml femme et &gt;34 homme, différents des limites de référence. Plus de 100 augmente fortement la suspicion sans être un diagnostic histologique.</li><li>Hypothyroïdie congénitale : ne pas retarder le traitement pour l’imagerie ; perchlorate au-delà de 10 %.</li><li>Urgences : compression trachéale, hémorragie, coma myxœdémateux, néoplasie endocrinienne multiple 2B.</li></ul></template>
<template data-pop="pareto-e07-prise" data-title="Pareto — Prise en charge et suivi">
