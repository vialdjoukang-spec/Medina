<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e07-e-1"><h2><span class="n">e-1</span>Hiérarchie des examens</h2>
<p>Chaque examen répond à une question précise. Il n’existe pas de test unique pour E07, mais chaque sous-question possède sa <b>référence</b>, nommée dans le tableau.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Question</th><th style="min-width:10em">Examen</th><th style="min-width:10em">Référence (gold standard)</th><th style="min-width:10em">Statut</th></tr></thead><tbody>
<tr><td style="min-width:10em">Nodule thyroïdien : calcitonine à doser ?</td><td style="min-width:10em">Calcitonine basale</td><td style="min-width:10em">Histologie avec immunohistochimie</td><td style="min-width:10em">Conditionnel : chirurgie ou traitement mini-invasif prévu, cytologie indéterminée ou échographie suspecte, antécédent de cancer médullaire ou de néoplasie endocrinienne multiple de type 2</td></tr>
<tr><td style="min-width:10em">Calcitonine en zone grise</td><td style="min-width:10em">Test au calcium ; procalcitonine</td><td style="min-width:10em">Histologie</td><td style="min-width:10em">Conditionnel</td></tr>
<tr><td style="min-width:10em">Cancer médullaire confirmé</td><td style="min-width:10em">Recherche de mutation germinale RET</td><td style="min-width:10em">Séquençage de RET</td><td style="min-width:10em">Indiqué chez tout patient</td></tr>
<tr><td style="min-width:10em">Nouveau-né : hypothyroïdie ?</td><td style="min-width:10em">Thyréostimuline du dépistage, puis thyroxine libre et thyréostimuline sériques</td><td style="min-width:10em">Thyroxine libre et thyréostimuline sériques</td><td style="min-width:10em">Indiqué</td></tr>
<tr><td style="min-width:10em">Cause de l’hypothyroïdie congénitale</td><td style="min-width:10em">Scintigraphie, test au perchlorate, échographie, thyroglobuline</td><td style="min-width:10em">Génétique (panels de séquençage, hybridation génomique ou exome)</td><td style="min-width:10em">Conditionnel : après le début du traitement</td></tr>
<tr><td style="min-width:10em">Thyroxine totale basse, thyroxine libre normale</td><td style="min-width:10em">Globuline liant la thyroxine</td><td style="min-width:10em">Dosage de la globuline ; gène SERPINA7</td><td style="min-width:10em">Conditionnel</td></tr>
<tr><td style="min-width:10em">Patient de soins intensifs, triiodothyronine basse</td><td style="min-width:10em">Thyréostimuline, thyroxine, triiodothyronine</td><td style="min-width:10em">Aucune : diagnostic d’exclusion fondé sur le contexte</td><td style="min-width:10em">Indiqué ; rapport <button class="w" data-k="e07-hormones-local">T3</button>/<button class="w" data-k="e07-hormones-local">T4</button> et reverse-triiodothyronine : non systématiques</td></tr>
<tr><td style="min-width:10em">Hémorragie cervicale</td><td style="min-width:10em">Évaluation des voies aériennes ; imagerie si l’état permet le bilan</td><td style="min-width:10em">Confrontation clinique et radiologique</td><td style="min-width:10em">Urgence si gêne respiratoire ; données de cas</td></tr><tr><td style="min-width:10em">Nodule remanié après ponction</td><td style="min-width:10em">Comparaison avec images et cytologie antérieures</td><td style="min-width:10em">Examen histologique des zones viables et de la capsule</td><td style="min-width:10em">Conditionnel ; infarctus ne signifie pas guérison</td></tr></tbody></table>
<p>Le tableau précise le statut de chaque examen : <i>indiqué</i> dans la situation clinique décrite, <i>conditionnel</i> pour ceux qui dépendent du contexte, <i>non systématique</i> pour ceux qui n’ont pas de rôle initial. Les cellules sont courtes parce que la logique est constante : une question, une référence, une décision.</p>
<div class="key"><b>À retenir.</b> Pour chaque situation, on nomme d’abord la question, puis la référence ; un examen sans question précise n’est pas indiqué.</div>
</section>

<section class="ilot" id="e07-e-2"><h2><span class="n">e-2</span>Calcitonine, procalcitonine et antigène carcinoembryonnaire</h2>
<h3>Fiche d’interprétation de la calcitonine basale</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Élément</th><th style="min-width:10em">Contenu</th></tr></thead><tbody>
<tr><td style="min-width:10em">Valeur normale</td><td style="min-width:10em">Référence locale selon sexe, âge et méthode : Viollier &lt;4,9 ng/L femme, &lt;11,9 ng/L homme ; ne pas appliquer ces valeurs comme normes néonatales. 1 ng/L = 1 pg/ml</td></tr>
<tr><td style="min-width:10em">Zone grise</td><td style="min-width:10em">10 à 100 pg/ml, souvent hyperplasie des cellules C</td></tr>
<tr><td style="min-width:10em">Évocation de cancer médullaire</td><td style="min-width:10em">Supérieure à 100 pg/ml</td></tr>
<tr><td style="min-width:10em">Seuils d’action 2023 (femme ; homme)</td><td style="min-width:10em">Supérieure à 30 pg/ml ; supérieure à 34 pg/ml</td></tr>
<tr><td style="min-width:10em">Hypercalcitoninémie sans cancer</td><td style="min-width:10em">Voir tableau de la partie 4 : tabagisme, goitre, thyroïdite, inhibiteur de la pompe à protons, insuffisance rénale, sepsis</td></tr>
<tr><td style="min-width:10em">Pièges analytiques</td><td style="min-width:10em">Anticorps hétérophiles, anticorps humains anti-souris, facteur rhumatoïde ; macrocalcitonine ; effet crochet ; interférence biotine-streptavidine</td></tr>
<tr><td style="min-width:10em">Erreur fréquente</td><td style="min-width:10em">Opérer sur une valeur isolée, sans la répéter avec la même méthode</td></tr></tbody></table>
<p>Cette fiche rassemble les repères de lecture. La <button class="w" data-k="e07-ct-interference">pré-analytique et les interférences de la calcitonine</button> expliquent pourquoi la même matrice et le même laboratoire sont nécessaires au suivi : les protéases sériques dégradent la calcitonine, et les méthodes diffèrent entre laboratoires.</p>
<h3>Procalcitonine et antigène carcinoembryonnaire</h3>
<p>La <button class="w" data-k="e07-pct">procalcitonine</button> a une référence courante inférieure à 0,05 ng/ml, à vérifier pour l’essai utilisé ; sa demi-vie est de 20 à 24 heures et elle varie peu avec l’âge et le sexe ; son usage pour la thyroïde est hors autorisation. Une méta-analyse de 11 études (5817 patients, 335 cancers médullaires) a donné une sensibilité de 0,90 (intervalle de confiance à 95 % de 0,71 à 0,97) et une spécificité de 1,00 (0,85 à 1,00). Une étude néerlandaise avec cohorte de validation suisse (Lugano et Zurich) a trouvé, dans la plage de calcitonine de 10 à 100 pg/ml, une sensibilité de 100 % et une spécificité de 99,7 % pour la combinaison calcitonine et procalcitonine. Ces chiffres viennent de populations sélectionnées : la cohorte prospective de 2025 comportait 396 patients opérés (335 dans la cohorte néerlandaise et 61 en Suisse), dont 44 cancers médullaires, 186 autres cancers et 166 lésions bénignes. Ils ne garantissent pas les mêmes performances chez tous les porteurs de nodules.</p>
<p>L’antigène carcinoembryonnaire n’est pas diagnostique ; il sert au pronostic et au suivi, avec un seuil courant de 5 ng/ml, jusqu’à 10 ng/ml chez le fumeur.</p>
<div class="trap"><span class="k">Piège</span> Considérer un résultat de calcitonine négatif comme exclusion absolue : l’effet crochet donne un faux négatif aux très hautes valeurs, et une dilution est alors nécessaire.</div>
<div class="key"><b>À retenir.</b> Calcitonine : même méthode, même matrice, répétée. Procalcitonine : complément dont la valeur dépend de la méthode et de la population. Antigène carcinoembryonnaire : pronostic, non diagnostic.</div>
</section>

<section class="ilot" id="e07-e-3"><h2><span class="n">e-3</span>Test au calcium et cytologie</h2>
<h3>Test de stimulation par le calcium</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Élément</th><th style="min-width:10em">Contenu</th></tr></thead><tbody>
<tr><td style="min-width:10em">Principe</td><td style="min-width:10em">Stimulation des cellules C ; alternative étudiée à la pentagastrine, aujourd’hui réservée à des situations sélectionnées</td></tr>
<tr><td style="min-width:10em">Protocole de l’étude</td><td style="min-width:10em">Gluconate de calcium par voie intraveineuse, 25 mg/kg de poids ajusté, soit 2,3 mg/kg de calcium élément, à 5 ml/min, durée minimale de 3 minutes ; calcitonine basale avant la perfusion</td></tr>
<tr><td style="min-width:10em">Seuils stimulés</td><td style="min-width:10em">Dans la série Immulite 2000 : supérieur à 79 pg/ml chez la femme et à 466 chez l’homme ; pas seuil universel</td></tr>
<tr><td style="min-width:10em">Rendement</td><td style="min-width:10em">La combinaison a identifié les 47 cancers de 135 patients sélectionnés ; porteurs germinaux RET exclus ; pas estimation universelle de sensibilité</td></tr>
<tr><td style="min-width:10em">Tolérance</td><td style="min-width:10em">Sensation de chaleur 57 % ; parmi 67 suivis par électrocardiogramme, bradycardie 16,4 % avant et 25,4 % après (9 % nouveaux cas). Les données de cette série ne suppriment pas les contre-indications du produit</td></tr>
<tr><td style="min-width:10em">Usages restants</td><td style="min-width:10em">Distinguer le cancer médullaire d’une sécrétion ectopique (réponse émoussée ou absente) ; insuffisance rénale avancée ; stratification des porteurs de RET</td></tr></tbody></table>
<p>Le tableau montre le protocole et ses limites : la source est une série chirurgicale italienne, avec une bradycardie préexistante chez 16,4 % et observée après test chez 25,4 % des 67 patients suivis par électrocardiogramme ; 9 % correspondent aux nouveaux cas ; la fiche suisse PHEL décrit un produit allemand importé ; son <button class="w" data-k="e07-rcp-local">RCP</button> exact a été lu et ne comporte pas l’indication de stimulation de calcitonine <button class="w" data-k="e07-test-calcium">test au calcium : protocole, seuils et réserves</button>.</p>
<h3>Cytoponction et dosage dans le liquide de lavage</h3>
<p>La cytoponction seule méconnaît souvent le cancer médullaire : dans une série de 104 cancers médullaires sporadiques opérés à Pise, elle n’était diagnostique que chez 45,9 % des 85 patients ponctionnés, alors que la calcitonine préopératoire évoquait le cancer dans toutes les catégories échographiques. La recommandation européenne de 2023 juge utile le dosage de la calcitonine dans le liquide de lavage de ponction en cas de suspicion cytologique de cancer médullaire avec calcitonine sérique normale, ou de calcitonine sérique élevée.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Se fier à une cytologie bénigne pour écarter un cancer médullaire lorsque la calcitonine est élevée : la cytologie seule le manque dans plus de la moitié des cas de cette série.</div>
<div class="key"><b>À retenir.</b> Test au calcium : indication, produit et protocole validés par le centre expert ; seuils de série dépendants de la méthode. La cytologie seule n’écarte pas un cancer médullaire.</div>
</section>

<section class="ilot" id="e07-e-4"><h2><span class="n">e-4</span>Hypothyroïdie congénitale : biologie, imagerie, génétique</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Examen</th><th style="min-width:10em">Rôle</th><th style="min-width:10em">Seuil ou règle</th></tr></thead><tbody>
<tr><td style="min-width:10em">Thyréostimuline du dépistage</td><td style="min-width:10em">Test le plus sensible pour l’hypothyroïdie primaire</td><td style="min-width:10em">Recommandation de grade 1 ; second prélèvement à 10 à 14 jours si nouveau-né à risque</td></tr>
<tr><td style="min-width:10em">Thyroxine du dépistage</td><td style="min-width:10em">Repérer la forme centrale</td><td style="min-width:10em">Ajout conseillé si possible</td></tr>
<tr><td style="min-width:10em">Thyroxine libre et thyréostimuline sériques</td><td style="min-width:10em">Confirmation</td><td style="min-width:10em">Thyroxine libre basse avec thyréostimuline élevée : traiter ; thyréostimuline supérieure à 20 mU/l à la confirmation vers la deuxième semaine : traiter même si thyroxine libre normale (avis expert)</td></tr>
<tr><td style="min-width:10em">Scintigraphie</td><td style="min-width:10em">Capter et situer le tissu</td><td style="min-width:10em">Peut être faussement négative au-delà de 5 à 7 jours de traitement</td></tr>
<tr><td style="min-width:10em">Test au perchlorate</td><td style="min-width:10em">Défaut d’organification</td><td style="min-width:10em">Positif si décharge d’iode 123 supérieure à 10 %</td></tr>
<tr><td style="min-width:10em">Échographie</td><td style="min-width:10em">Volume et morphologie</td><td style="min-width:10em">Après le début du traitement</td></tr>
<tr><td style="min-width:10em">Thyroglobuline sérique</td><td style="min-width:10em">Orienter le gène avec le perchlorate</td><td style="min-width:10em">Basse : gène TG ; haute : <button class="w" data-k="e07-tpo-local">TPO</button>, DUOX2, SLC26A4, IYD</td></tr>
<tr><td style="min-width:10em">Génétique</td><td style="min-width:10em">Confirmation</td><td style="min-width:10em">Panels de séquençage, hybridation génomique comparative ou exome</td></tr></tbody></table>
<p>La logique est causale. Le traitement précède l’imagerie parce que le pronostic neurodéveloppemental dépend de la précocité de la lévothyroxine, et qu’une scintigraphie réalisée plus de 5 à 7 jours après son début peut être faussement négative. La thyroglobuline est basse quand le défaut touche la thyroglobuline elle-même et haute quand une autre étape de synthèse est bloquée, ce qui permet de choisir le gène à séquencer. Le perchlorate teste l’organification de l’iode : une décharge supérieure à 10 % montre que l’iode entre dans la cellule mais n’est pas fixé.</p>
<h3>Table de configurations biologiques</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Diagnostic</th><th style="min-width:10em">Thyréostimuline</th><th style="min-width:10em">Thyroxine libre</th><th style="min-width:10em">Hormones totales</th><th style="min-width:10em">Particularité</th></tr></thead><tbody>
<tr><td style="min-width:10em">Hypothyroïdie primaire (dyshormonogenèse)</td><td style="min-width:10em">Élevée</td><td style="min-width:10em">Basse</td><td style="min-width:10em">Basses</td><td style="min-width:10em">Goitre ou glande en place</td></tr>
<tr><td style="min-width:10em">Déficit en globuline liante</td><td style="min-width:10em">Normale</td><td style="min-width:10em">Normale</td><td style="min-width:10em">Basses</td><td style="min-width:10em">Globuline basse ; sujet euthyroïdien</td></tr>
<tr><td style="min-width:10em">Maladie non thyroïdienne, phase aiguë</td><td style="min-width:10em">Normale ou basse</td><td style="min-width:10em">—</td><td style="min-width:10em">Triiodothyronine basse ; thyroxine basse si sévère</td><td style="min-width:10em">Reverse-triiodothyronine variable, non discriminante isolément</td></tr>
<tr><td style="min-width:10em">Maladie non thyroïdienne, récupération</td><td style="min-width:10em">Peut remonter</td><td style="min-width:10em">—</td><td style="min-width:10em">Thyroxine basse</td><td style="min-width:10em">Peut ressembler à une hypothyroïdie</td></tr>
<tr><td style="min-width:10em">Hypothyroïdie sévère décompensée</td><td style="min-width:10em">Souvent élevée si primaire ; non obligatoire</td><td style="min-width:10em">Basse</td><td style="min-width:10em">Souvent basses</td><td style="min-width:10em">Hypothermie, troubles de conscience</td></tr>

<p>Ce tableau croise les diagnostics et les associations biologiques ; les cases marquées d’un tiret signifient que la source lue n’en fait pas un critère. Il montre des profils typiques, non une règle d’exclusion : maladie critique, médicaments et atteinte centrale peuvent masquer une hausse de <button class="w" data-k="e07-hormones-local">TSH</button>. Une anomalie <button class="w" data-k="e07-tbg">TBG</button> peut coexister avec une hypothyroïdie authentique.</p>
<div class="key"><b>À retenir.</b> Traiter avant l’imagerie ; perchlorate et thyroglobuline orientent le gène ; <button class="w" data-k="e07-hormones-local">TSH</button>, FT4, méthode et contexte se confrontent sans règle d’exclusion sur un résultat isolé.</div>
</section>

<section class="ilot" id="e07-e-5"><h2><span class="n">e-5</span>Globuline liante et maladie non thyroïdienne : fiches</h2>
<h3>Fiche : déficit en globuline liant la thyroxine</h3>
<p>Valeurs : hormones totales basses, thyroxine libre et thyréostimuline normales ; la globuline lie 70 % de la triiodothyronine et 75 % de la thyroxine. Seuils : trois phénotypes, déficit complet (1/15 000 nouveau-nés), partiel (1/4000) et excès. Piège : un déficit fonctionnel de globuline (variant de faible affinité, concentration normale) peut simuler une hypothyroïdie congénitale centrale lors d’un dépistage fondé sur la thyroxine ; la thyroxine libre normale a redressé le diagnostic dans le cas rapporté <button class="w" data-k="e07-tbg">globuline liant la thyroxine et dépistage</button>. Erreur fréquente : prescrire de la lévothyroxine, ce qui expose à une thyrotoxicose iatrogène.</p>
<h3>Fiche : syndrome de maladie non thyroïdienne</h3>
<p>La <button class="w" data-k="e07-hormones-local">T3</button> est souvent basse en maladie critique, la <button class="w" data-k="e07-hormones-local">T4</button> peut diminuer et la <button class="w" data-k="e07-hormones-local">TSH</button> être normale ou basse. La reverse-T3 varie et n’est pas un test discriminant fiable. Interroger antécédents, traitement de substitution, dopamine, glucocorticoïdes et chronologie ; comparer les bilans antérieurs. Les hormones basses s’associent à la gravité sans prouver une indication de substitution. Une hypothyroïdie concomitante avérée doit être traitée ; la seule <button class="w" data-k="e07-hormones-local">T3</button> basse ne suffit pas <button class="w" data-k="e07-smnt-meca">mécanismes et limites</button> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> Les deux fiches se lisent à la thyréostimuline et à la thyroxine libre : si elles sont fiables et normales dans un contexte stable, une <button class="w" data-k="e07-hormones-local">T4</button> totale basse évoque notamment une anomalie de transport plutôt qu’une indication automatique de substitution.</div>
<button class="pareto-btn ui" data-k="pareto-e07-examens">▲ Loi de Pareto — Examens complémentaires</button>
</section>

<section class="ilot" id="e07-e-6"><h2><span class="n">e-6</span>Cas cliniques</h2>
<div class="quiz ui"><p><b>Cas 1 (fictif).</b> Une femme de 52 ans, fumeuse, sous inhibiteur de la pompe à protons, a un nodule et une calcitonine basale à 40 pg/ml. Quelle est la première conduite ?</p><button data-ok="0">Thyroïdectomie totale immédiate</button><button data-ok="1">Confirmer le résultat et demander un avis spécialisé ; examiner méthode et causes possibles</button><button data-ok="0">Doser la thyroglobuline pour trier le nodule</button><p class="fb" hidden>40 pg/ml dépasse le repère féminin de l’<button class="w" data-k="e07-sources-guides">ETA</button>. Tabac et IPP ne permettent pas d’en affirmer la cause. Confirmation analytique, examen du nodule et avis spécialisé précèdent le choix de tests supplémentaires ou de chirurgie.</p></div>
<div class="quiz ui"><p><b>Cas 2 (fictif).</b> Un nouveau-né de 4 jours a une thyréostimuline très élevée au dépistage. Que faire en premier ?</p><button data-ok="0">Attendre la scintigraphie avant de traiter</button><button data-ok="1">Confirmer par thyroxine libre et thyréostimuline sériques et débuter la lévothyroxine sans attendre l’imagerie</button><button data-ok="0">Retarder le traitement jusqu’au test génétique</button><p class="fb" hidden>Une thyroxine libre basse avec thyréostimuline nettement élevée impose la lévothyroxine immédiate ; l’imagerie se fait après le début du traitement.</p></div>
<div class="quiz ui"><p><b>Cas 3 (fictif).</b> Un homme de 30 ans en bonne santé a une thyroxine totale basse, une thyroxine libre et une thyréostimuline normales. Quel diagnostic évoquer ?</p><button data-ok="1">Déficit en globuline liant la thyroxine ; ne pas traiter</button><button data-ok="0">Hypothyroïdie centrale à traiter par lévothyroxine</button><button data-ok="0">Hyperplasie des cellules C</button><p class="fb" hidden>La dissociation entre hormones totales basses et fraction libre normale évoque une anomalie de la protéine de transport ; le patient est euthyroïdien et le traitement exposerait à une thyrotoxicose iatrogène.</p></div>
<div class="quiz ui"><p><b>Cas 4 (fictif).</b> Un patient de soins intensifs a une triiodothyronine basse, une thyroxine basse et une thyréostimuline normale. Quelle conduite ?</p><button data-ok="0">Débuter la lévothyroxine pour hypothyroïdie</button><button data-ok="1">Évaluer contexte et hypothyroïdie concomitante ; ne pas substituer sur la seule T3 basse</button><button data-ok="0">Doser la calcitonine</button><p class="fb" hidden>Une thyréostimuline normale ne suffit pas à exclure une hypothyroïdie en maladie critique ; les essais disponibles ne justifient pas une substitution systématique du syndrome de maladie non thyroïdienne.</p></div>
</section>

<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e07-tab-semio" role="tab" aria-selected="true" aria-controls="e07-s-semio" data-s="e07-s-semio">Sémiologie fondamentale et analytique</button><button role="tab" aria-selected="false" aria-controls="e07-s-anat" data-s="e07-s-anat">Anatomie</button><button role="tab" aria-selected="false" aria-controls="e07-s-histo" data-s="e07-s-histo">Histologie</button><button role="tab" aria-selected="false" aria-controls="e07-s-physio" data-s="e07-s-physio">Physiologie</button><button role="tab" aria-selected="false" aria-controls="e07-s-bioch" data-s="e07-s-bioch">Biochimie</button><button role="tab" aria-selected="false" aria-controls="e07-s-gene" data-s="e07-s-gene">Génétique</button></div><div class="chap-body sci-body"><div class="sci" id="e07-s-semio" role="tabpanel" aria-labelledby="e07-tab-semio"><section class="ilot" id="e07-s-semio-cours"><h2>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h2>
<h3 id="e07-semio-normal" data-semiology="normal">1. Normalité utile : organe, fonction et mesure</h3><p>La thyroïde réunit une fonction mécanique, des cellules folliculaires qui produisent <button class="w" data-k="e07-hormones-local">T4</button>/<button class="w" data-k="e07-hormones-local">T3</button> et des cellules C qui produisent la calcitonine. Ces axes ne se confondent pas : une glande volumineuse peut comprimer avec des hormones normales, tandis qu’un défaut de synthèse peut se présenter sans goitre. Le sang transporte surtout les hormones sous forme liée ; la fraction libre et l’action tissulaire sont des notions distinctes de la quantité totale. La <button class="w" data-k="e07-hormones-local">TSH</button> traduit le rétrocontrôle dans un axe intact, mais maladie critique, médicaments et atteinte centrale en changent la signification [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S42</a>].</p><p>Avant de qualifier un chiffre d’anormal, préciser l’analyte, l’unité, l’âge, le sexe, la situation physiologique et le laboratoire. Pour la calcitonine, 1 ng/L équivaut à 1 pg/ml ; la référence Viollier (&lt;4,9 chez la femme, &lt;11,9 chez l’homme) n’est pas un seuil opératoire. La FT4 du nouveau-né utilise ses propres normes ; une valeur adulte ne doit pas être appliquée sans contrôle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>].</p>
<h3 id="e07-semio-signs" data-semiology="signs">2. Signes, symptômes et temporalité</h3><p>Décrire une tuméfaction cervicale par sa date d’apparition, sa vitesse de croissance, sa douleur et les circonstances : naissance, infection, traumatisme ou ponction. Demander une gêne à inspirer, à avaler, une modification de voix et une intolérance à la position allongée ; une progression rapide pèse davantage qu’une anomalie hormonale isolée. La surdité neurosensorielle congénitale ou précoce, surtout avec goitre familial, oriente vers Pendred, mais le goitre peut apparaître plus tard et l’imagerie de l’oreille varier [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42463600/" target="_blank" rel="noopener">S25</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38877731/" target="_blank" rel="noopener">S28</a>].</p><p>Chez le nouveau-né, une clinique peu expressive ne rassure pas après dépistage positif : l’objectif est de traiter avant les conséquences neurodéveloppementales. Chez l’adulte avec hormones totales basses et absence de signes de dysfonction, l’anomalie de transport est plausible ; elle doit être confirmée, non supposée. Chez le patient de réanimation, fatigue, ralentissement ou hypothermie se lisent avec sédation, infection et défaillance d’organes. L’absence de plainte n’a pas le même sens dans ces trois populations [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>].</p>
<h3 id="e07-semio-mechanisms" data-semiology="mechanisms">3. Du mécanisme au signe et à la décision</h3><div class="e07-chain" style="border-left:4px solid #237a75;padding:.8em 1em;background:#eff8f5"><p><b>Synthèse insuffisante → rétrocontrôle diminué → stimulation par <button class="w" data-k="e07-hormones-local">TSH</button> → goitre possible.</b> La FT4 et la <button class="w" data-k="e07-hormones-local">TSH</button> apprécient la fonction ; l’échographie apprécie volume et position. Si l’hypothyroïdie congénitale est confirmée, commencer la lévothyroxine sans attendre la preuve génétique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>].</p><p><b>Protéine de transport diminuée → réserve liée réduite → <button class="w" data-k="e07-hormones-local">T4</button> totale basse avec fraction libre conservée.</b> La conséquence n’est pas une indication de substitution. Doser <button class="w" data-k="e07-tbg">TBG</button> et vérifier les méthodes en cas de discordance ; conserver le traitement d’une hypothyroïdie authentique coexistante [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>].</p><p><b>Maladie critique → métabolisme et axe modifiés → <button class="w" data-k="e07-hormones-local">T3</button> basse, <button class="w" data-k="e07-hormones-local">TSH</button> parfois non élevée.</b> Traiter le contexte causal et rechercher les indices d’une maladie thyroïdienne propre. La correction d’un chiffre n’est pas une preuve de bénéfice clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>].</p><p><b>Expansion cervicale → réduction de la lumière aérienne → dyspnée ou stridor.</b> L’urgence dépend de la ventilation et de la progression ; les voies aériennes passent avant le classement E07 ou la discussion d’un dosage [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42463600/" target="_blank" rel="noopener">S25</a>].</p></div>
<h3 id="e07-semio-examination" data-semiology="examination">4. Examen et conditions de mesure</h3><p>Observer d’abord l’état général, la respiration, la voix et la capacité à parler ou à s’alimenter ; ne pas transformer un examen électif du cou en retard devant une détresse. Chez un patient stable, inspecter puis palper la thyroïde, décrire asymétrie, nodules, douleur et ganglions, et confronter à l’échographie. Une palpation normale n’exclut ni un petit cancer médullaire ni une anomalie de transport. <button class="w" data-k="e07-sources-guides">PROFILES</button> demande explicitement l’examen des structures cervicales et de la thyroïde ; le dossier pédagogique ne lui attribue pas une sensibilité chiffrée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S37</a>].</p><p>Pour l’audition, préciser le dépistage néonatal, le développement du langage, la progression et l’histoire familiale ; une évaluation audiologique adaptée à l’âge est nécessaire si Pendred est suspecté. Le suivi de l’hypothyroïdie congénitale comporte aussi l’attention à l’audition avant l’âge scolaire. Un goitre absent ou une morphologie cochléovestibulaire inhabituelle ne suffisent pas à écarter le syndrome [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38877731/" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/33136026/" target="_blank" rel="noopener">S29</a>].</p><p>Pour la calcitonine, demander la procédure du laboratoire réalisateur. Le CHUV demande un transport immédiat dans les 30 minutes, sinon séparation et congélation du sérum ; Viollier utilise sa propre filière avec sérum séparé congelé. Les tubes ne sont pas interchangeables par défaut. Noter IPP et compléments ; le CHUV ne propose leur interruption que si elle est possible, idéalement deux semaines pour les IPP, sur décision médicale [<a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>, <a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>].</p>
<h3 id="e07-semio-interpretation" data-semiology="interpretation">5. Valeur diagnostique et absence de signe</h3><p>Une calcitonine élevée indique un signal biologique, pas l’histologie. Les causes réactives, une interférence et un cancer peuvent se chevaucher. Dans la revue Cochrane, la valeur prédictive positive au seuil de 10 pg/ml était de 7,7 % pour une prévalence médiane de 0,23 % ; les études comportaient d’importants biais de vérification. Cette faible valeur ne permet pas de rassurer une patiente à 40 pg/ml : la probabilité individuelle dépend du sexe, du contexte, de la méthode et du nodule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/32176812/" target="_blank" rel="noopener">S7</a>].</p><p>La même logique s’applique aux résultats négatifs : une cytologie non diagnostique de cancer médullaire ne l’exclut pas. Dans la série de Pise, 85 des 104 patients atteints avaient eu une ponction, diagnostique dans 45,9 % des cas ponctionnés. Cette série de cancers connus ne mesure pas la spécificité du test dans une population générale. L’effet crochet ou une tumeur rarement peu sécrétante peuvent aussi expliquer une discordance ; discuter dilution, autre méthode ou lavage de ponction avec le laboratoire et le spécialiste [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/41774330/" target="_blank" rel="noopener">S23</a>].</p>
<h3 id="e07-semio-differentials" data-semiology="differentials">6. Discriminants réellement utiles</h3><p><b>Goitre et surdité :</b> Pendred est une hypothèse forte, pas une preuve sans analyse du phénotype et de SLC26A4. <b>Goitre néonatal :</b> dyshormonogenèse, causes maternelles et autres hypothyroïdies congénitales sont distinguées par histoire, biologie et imagerie. <b><button class="w" data-k="e07-hormones-local">T4</button> totale basse :</b> <button class="w" data-k="e07-tbg">TBG</button> basse ou d’affinité réduite, maladie critique et hypothyroïdie vraie ne se séparent pas par le seul chiffre total. <b>FT4 élevée avec <button class="w" data-k="e07-hormones-local">TSH</button> non freinée :</b> contexte médicamenteux et interférence précèdent l’exploration d’une résistance hormonale ou d’une tumeur hypophysaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/34126618/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>].</p><p>Une <button class="w" data-k="e07-hormones-local">TSH</button> franchement élevée persistante et une FT4 basse étayent l’hypothyroïdie primaire ; une FT4 basse avec <button class="w" data-k="e07-hormones-local">TSH</button> normale ou basse exige de considérer aussi une atteinte centrale. Rechercher les bilans antérieurs, les médicaments et les autres axes hypophysaires selon le contexte. La reverse-T3 n’est pas un arbitre fiable entre hypothyroïdie et maladie critique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>].</p>
<h3 id="e07-semio-urgency" data-semiology="urgency">7. Drapeaux rouges et conduite temporelle</h3><p>Dyspnée croissante, stridor, trouble de conscience ou tuméfaction cervicale rapide conduisent à une évaluation urgente ; une détresse respiratoire ne doit pas attendre une échographie programmée ou le retour d’un dosage. L’observation conservatrice d’une hémorragie décrite dans un cas stable ne s’applique pas à une obstruction. Un goitre fœtal ou néonatal volumineux exige une équipe périnatale et respiratoire expérimentée [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42463600/" target="_blank" rel="noopener">S25</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42572068/" target="_blank" rel="noopener">S26</a>].</p><p>Une hypothyroïdie congénitale confirmée se traite rapidement, au plus tard à deux semaines de vie ; imagerie et génétique ne doivent pas retarder la substitution. Chez un patient avec suspicion de déficit surrénalien ou hypophysaire, sécuriser cette dimension avant la substitution selon le protocole spécialisé ; la FI Euthyrox contre-indique les troubles surrénaliens ou hypophysaires non traités. Une NEM2 à haut risque impose une orientation précoce, avec recherche de phéochromocytome avant chirurgie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/multiple-endocrine-neoplasia-type-2/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>].</p>
<h3 id="e07-semio-limits" data-semiology="limits">8. Limites et populations particulières</h3><p>Les seuils stimulés de calcitonine de 79 et 466 pg/ml proviennent d’une série italienne et d’un immunodosage précis ; les porteurs germinaux RET en étaient exclus. Leur application à un enfant, à une autre méthode ou à un patient insuffisant rénal n’est pas automatique. Les données sur l’hémorragie et l’infarctus sont surtout des cas et séries sélectionnés. Aucun score validé unique ne couvre la catégorie E07 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/27294033/" target="_blank" rel="noopener">S38</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8955603/" target="_blank" rel="noopener">S39</a>].</p><p>La grossesse modifie les protéines de liaison, la prématurité modifie l’axe et le risque thérapeutique, et la maladie critique modifie plusieurs niveaux simultanément. Les normes et doses doivent donc être adaptées. L’absence de recommandation suisse globale E07 n’empêche pas d’appliquer les instructions suisses du produit exact et du laboratoire ; elle impose de nommer les recommandations européennes utilisées pour le reste [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>, <a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>].</p>
<h3 id="e07-semio-sources" data-semiology="sources">9. Sources reliées aux assertions</h3><p>Normal et dyshormonogenèse : [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>] ENDO-ERN, §2–5 et tableau 3 ; [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S42</a>] anatomie normale. Calcitonine : [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S5</a>] <button class="w" data-k="e07-sources-guides">ETA</button> 2023, paragraphes calcitonine et lavage ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>] revue 2026, méthodes/interférences ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/32176812/" target="_blank" rel="noopener">S7</a>] résumé Cochrane et [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>] série et sécurité du test. Transport : [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>] quatre cas coréens, [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/34126618/" target="_blank" rel="noopener">S18</a>] résumé néerlandais, [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>] démarche <button class="w" data-k="e07-sources-guides">ETA</button> 2024 et [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>] anomalies de liaison. Maladie critique : [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>] revue 2021, corps lu. Cou et audition : [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42463600/" target="_blank" rel="noopener">S25</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42572068/" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38877731/" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/33136026/" target="_blank" rel="noopener">S29</a>], résumés identifiés. Applicabilité suisse : [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>] FI exacte, [<a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>, <a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>] laboratoires et [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S37</a>] <button class="w" data-k="e07-sources-guides">PROFILES</button>. Les sources publiques détaillées figurent en fin de cours ; aucune certification humaine n’est revendiquée.</p>
<figure><svg role="img" aria-label="Démarche sémiologique : schéma logique non anatomique" viewBox="0 0 460 335" style="width:100%;max-width:600px;height:auto;display:block;margin:auto"><rect x="10" y="8" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="41" text-anchor="middle" font-size="18" fill="#153653">Signe ou résultat inattendu</text><text x="230" y="84" text-anchor="middle" font-size="22" fill="#153653">↓</text><rect x="10" y="88" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="121" text-anchor="middle" font-size="18" fill="#153653">Contexte + méthode + examen</text><text x="230" y="164" text-anchor="middle" font-size="22" fill="#153653">↓</text><rect x="10" y="168" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="201" text-anchor="middle" font-size="18" fill="#153653">Hypothèse clinique confrontée</text><text x="230" y="244" text-anchor="middle" font-size="22" fill="#153653">↓</text><rect x="10" y="248" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="281" text-anchor="middle" font-size="18" fill="#153653">Décision et suivi individualisés</text></svg><figcaption>Schéma logique, non anatomique. Les étapes représentent une démarche d’interprétation, pas un score validé. Sources [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>, <a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>].</figcaption></figure><p class="key"><b>Science → clinique.</b> Un même chiffre total peut résulter d’une anomalie de transport ou d’une maladie générale ; la plainte et la chronologie changent sa signification.</p><p class="key"><b>Science → examen.</b> Confronter FT4, <button class="w" data-k="e07-hormones-local">TSH</button> et méthode ; examiner d’abord les voies aériennes devant une tuméfaction rapide.</p><p class="key"><b>Science → traitement.</b> L’hypothyroïdie congénitale confirmée se traite sans attendre le gène ; <button class="w" data-k="e07-hormones-local">T3</button> basse isolée en réanimation ne suffit pas à substituer.</p><p class="key"><b>À retenir.</b> Décrire le signe, comprendre son mécanisme et tester l’hypothèse avant de traiter le chiffre.</p></section></div><div class="sci" id="e07-s-anat" hidden><section class="ilot" id="e07-s-anat-cours"><h2>Anatomie : cou, trachée et oreille interne</h2><p>La thyroïde comprend deux lobes reliés par un isthme, en avant et sur les côtés de la trachée sous le larynx. L’anatomie explique la distinction entre <b>fonction hormonale</b> et <b>effet de masse</b> : la taille et l’extension du tissu peuvent gêner les voies aériennes même si la <button class="w" data-k="e07-hormones-local">TSH</button> est normale. Dans le cou, une croissance lente peut être longtemps tolérée ; une augmentation rapide après hémorragie modifie beaucoup plus vite les rapports et la ventilation. Ce raisonnement conduit à commencer l’examen par la respiration, puis à documenter volume, asymétrie et signes de compression [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S42</a>].</p>
<figure class="e07-figure" style="margin:1.4em auto;max-width:46rem" id="e07-figure-compression"><div class="e07-image" style="position:relative;width:100%;background:#fff"><img style="display:block;width:100%;height:auto" src="assets/img/e07/alpha/codex/e07-goitre-compressif-original.jpg" alt="Scanner sagittal original d’un goitre comprimant la trachée ; la flèche rouge préexistante et le repère 1 désignent le rétrécissement" loading="lazy" width="699" height="697"><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:48%;top:54%">1</span><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:40%;top:49%">2</span></div><figcaption><b>Compression mécanique, indépendamment du bilan hormonal.</b> 1 : lumière trachéale rétrécie au niveau indiqué par la flèche rouge de l’auteur ; 2 : masse goitreuse antérieure. Le scanner montre un patient adulte ; il n’établit ni dyshormonogenèse, ni hémorragie, ni diagnostic néonatal. Stockholm, 18.08.2016, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Goitre_compressif_sur_la_trach%C3%A9e_(sagittal).jpg" target="_blank" rel="noopener">original Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Image et annotations proposées sous cette licence ; aucun pixel modifié, repères ajoutés sans modification des pixels. L’original comporte une injection iodée ; le choix d’un examen injecté dépend de la situation clinique.</figcaption></figure>
<p>Le scanner original illustre une lumière trachéale réduite, sans permettre de déduire la cause du goitre. Une image de compression chez un adulte ne constitue pas une illustration d’un syndrome de Pendred ni d’une obstruction néonatale. Chez un nouveau-né avec goitre massif, le cas rapporté de variant TG documente au contraire la nécessité d’une intubation puis une régression sous lévothyroxine ; il sert de preuve clinique séparée, non de légende attribuée à ce scanner [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42463600/" target="_blank" rel="noopener">S25</a>].</p>
<p>L’autre territoire pertinent est l’oreille interne. La pendrine participe aux échanges d’anions qui soutiennent son environnement liquidien. Une anomalie SLC26A4 peut se manifester par une surdité neurosensorielle et un aqueduc vestibulaire élargi ; la morphologie n’est pas uniforme, même dans une famille portant le même variant. Le lien anatomique explique pourquoi l’audiologie et l’imagerie spécialisée de l’oreille peuvent aider à définir le phénotype, mais ne remplacent pas le conseil génétique [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38877731/" target="_blank" rel="noopener">S28</a>].</p>
<div class="key"><b>Normal → perturbation → signe → examen.</b> Une voie aérienne normalement libre devient mécaniquement réduite : dyspnée et stridor conduisent à l’évaluation urgente. Une anomalie de l’oreille interne peut expliquer la surdité : audiologie adaptée à l’âge et bilan spécialisé. Aucun taux de <button class="w" data-k="e07-hormones-local">TSH</button> ne mesure ces deux risques anatomiques.</div><p class="src">[<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S42</a>] §17.4, localisation ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/36643771/" target="_blank" rel="noopener">S21a</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/35960205/" target="_blank" rel="noopener">S21c</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42463600/" target="_blank" rel="noopener">S25</a>] résumés de cas ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38877731/" target="_blank" rel="noopener">S28</a>] Pendred ; original Stockholm 2016 documenté ci-dessus.</p><p class="key"><b>Science → clinique.</b> L’effet de masse cervical peut menacer la respiration indépendamment de la fonction hormonale.</p><p class="key"><b>Science → examen.</b> L’observation respiratoire précède la palpation ; imagerie et audiologie répondent ensuite à une question anatomique précise.</p><p class="key"><b>Science → traitement.</b> Une obstruction demande une prise en charge urgente des voies aériennes ; une substitution ne remplace pas ce geste.</p><p class="key"><b>À retenir.</b> Une image de goitre compressif adulte ne démontre ni la cause ni un syndrome néonatal.</p></section></div><div class="sci" id="e07-s-histo" hidden><section class="ilot" id="e07-s-histo-cours"><h2>Histologie : follicules, cellules C et lésion après ponction</h2><p>Le follicule associe une lumière remplie de colloïde et un épithélium folliculaire. La thyroglobuline dans la colloïde sert de support à la synthèse de <button class="w" data-k="e07-hormones-local">T4</button> et <button class="w" data-k="e07-hormones-local">T3</button>. Les cellules parafolliculaires produisent la calcitonine ; elles ne sont pas les cellules qui synthétisent les iodothyronines. Une augmentation de calcitonine n’est donc pas un marqueur direct de production de <button class="w" data-k="e07-hormones-local">T4</button>, et une <button class="w" data-k="e07-hormones-local">TSH</button> normale ne renseigne pas sur la nature d’une prolifération de cellules C [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S42</a>].</p>
<figure class="e07-figure" style="margin:1.4em auto;max-width:46rem" id="e07-figure-histologie"><div class="e07-image" style="position:relative;width:100%;background:#fff"><img style="display:block;width:100%;height:auto" src="assets/img/e07/alpha/codex/e07-thyroide-normale-openstax2013.jpg" alt="Original OpenStax 2013 : vues antérieure et postérieure de la thyroïde et microphotographie de follicules, avec repères français numérotés" loading="lazy" width="737" height="1410"><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:48%;top:17%">1</span><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:48%;top:25%">2</span><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:26%;top:75%">3</span><span class="e07-pin" style="position:absolute;border:2px solid #102e44;background:#fff4a8;color:#102e44;border-radius:50%;font:bold 14px/1.5 sans-serif;min-width:1.6em;text-align:center;transform:translate(-50%,-50%);left:46%;top:88.7%">4</span></div><figcaption><b>Original anatomique et histologique.</b> 1 : isthme en avant de la trachée ; 2 : anneaux trachéaux ; 3 : colloïde dans la lumière folliculaire ; 4 : épithélium folliculaire au bord de la colloïde. La cellule parafolliculaire est indiquée par le libellé anglais original ; cette image normale ne diagnostique pas une hyperplasie. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">OpenStax College</a>, <i>Anatomy &amp; Physiology</i>, édition 2013 ; microphotographie créditée aux Regents of University of Michigan Medical School (2012). <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">Source exacte</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Octets originaux conservés ; chiffres français superposés sans modification des pixels. La licence de cette version ne se déduit pas de celle des éditions actuelles.</figcaption></figure>
<p>Les résumés anatomopathologiques distinguent hyperplasie C réactive ou physiologique et prolifération néoplasique liée notamment aux NEM2. L’immunohistochimie et l’analyse de l’architecture sont nécessaires ; l’image normale ci-dessus ne permet pas de poser ce diagnostic. Le nombre de cellules seul ne suffit pas à caractériser une prolifération néoplasique. Une calcitonine modérée ne sépare pas de façon certaine ces catégories [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/11914470/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/12961023/" target="_blank" rel="noopener">S12</a>].</p><p>Dans la série italienne sélectionnée pour chirurgie, une hyperplasie C était retrouvée dans 31 des 42 goitres multinodulaires et 16 des 35 cancers papillaires. Cette fréquence élevée dans les prélèvements opératoires explique un chevauchement biologique, sans donner la prévalence d’hyperplasie C dans la population. À l’inverse, une valeur basse n’exclut pas absolument un petit cancer ou une interférence du dosage [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>].</p>
<p>Après ponction, une nécrose ischémique et des remaniements hémorragiques ou fibreux peuvent remplacer une partie du nodule. Le diagnostic dépend alors de la confrontation avec la cytologie antérieure, les zones viables et l’étude de la capsule. Une pièce presque nécrotique peut être trompeuse si le pathologiste ignore le résultat initial. Ce lien science–clinique justifie la transmission de l’histoire du geste et des lames, sans conclure qu’une disparition de cellules tumorales sur une coupe prouve une guérison [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/27294033/" target="_blank" rel="noopener">S38</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8955603/" target="_blank" rel="noopener">S39</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/31967057/" target="_blank" rel="noopener">S40</a>].</p><div class="key"><b>Histologie et traitement.</b> L’organisation tissulaire permet de distinguer les processus ; le marqueur sanguin oriente le bilan. La prise en charge conserve la discordance jusqu’à sa résolution, plutôt que de sélectionner le seul examen rassurant.</div><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>] synthèse ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7878259/" target="_blank" rel="noopener">S8</a>] calcitonine ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/11914470/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/12961023/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/27294033/" target="_blank" rel="noopener">S38</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/8955603/" target="_blank" rel="noopener">S39</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/31967057/" target="_blank" rel="noopener">S40</a>] résumés anatomopathologiques ; original normal 2013 à licence propre.</p><p class="key"><b>Science → clinique.</b> Cellules folliculaires et cellules C assurent des fonctions différentes ; un résultat sanguin ne remplace pas l’architecture tissulaire.</p><p class="key"><b>Science → examen.</b> Confronter cytologie, histologie, immunohistochimie et histoire de ponction ; rechercher les zones viables après nécrose.</p><p class="key"><b>Science → traitement.</b> L’infarctus d’un nodule n’autorise pas à déclarer une guérison oncologique ; la décision conserve l’information cytologique initiale.</p><p class="key"><b>À retenir.</b> La figure normale situe follicule et colloïde, sans représenter une hyperplasie C.</p></section></div><div class="sci" id="e07-s-physio" hidden><section class="ilot" id="e07-s-physio-cours"><h2>Physiologie : synthèse, réserve liée et action tissulaire</h2><p>L’iodure doit être capté, transféré vers le compartiment apical, organifié sur la thyroglobuline puis incorporé aux hormones. NIS/SLC5A5 intervient dans la captation ; <button class="w" data-k="e07-tpo-local">TPO</button> dans l’organification et le couplage ; DUOX2 et DUOXA2 contribuent au système générateur de peroxyde ; TG fournit le précurseur et IYD récupère l’iode des iodotyrosines. La pendrine participe à l’efflux apical mais ne représente pas son unique voie : la revue de Pendred décrit notamment la compensation possible par d’autres canaux, dont ANO1. C’est pourquoi une anomalie génétique n’entraîne pas nécessairement un bloc complet ou une hypothyroïdie de même intensité chez tous [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>].</p><p>La <button class="w" data-k="e07-hormones-local">TSH</button> stimule une glande dont la réponse est limitée par le défaut. Si l’insuffisance persiste, le goitre peut se développer ; certaines formes sont transitoires ou non goitreuses. Une hypothyroïdie manifeste doit être corrigée sans attendre le génotype. À long terme, la cible basse-normale de <button class="w" data-k="e07-hormones-local">TSH</button> proposée pour une dyshormonogenèse goitreuse vise à limiter la stimulation du volume, avec surveillance échographique et attention aux nodules suspects [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>].</p><p>La majorité de <button class="w" data-k="e07-hormones-local">T4</button>/<button class="w" data-k="e07-hormones-local">T3</button> circule liée à <button class="w" data-k="e07-tbg">TBG</button>, transthyretine et albumine. Une baisse de <button class="w" data-k="e07-tbg">TBG</button> réduit la réserve totale tout en permettant une fraction libre normale quand l’axe est intact. À l’inverse, un excès de <button class="w" data-k="e07-tbg">TBG</button>, par exemple sous œstrogènes ou par duplication du gène, augmente les hormones totales sans imposer une hyperthyroïdie. Les nombres diffèrent selon la molécule, le produit et la source : la FI Euthyrox rapporte 99,97 % de liaison de la lévothyroxine administrée ; les revues de <button class="w" data-k="e07-tbg">TBG</button> estiment sa part à environ 75 % de la <button class="w" data-k="e07-hormones-local">T4</button> circulante. Ne pas transformer ces descriptions en formules de correction individuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>].</p><p>La fraction libre doit ensuite entrer dans les cellules par des transporteurs et être métabolisée. MCT8, MCT10 et OATP1C1 illustrent pourquoi la concentration sanguine et l’accès cellulaire ne sont pas identiques. DIO2 peut produire localement <button class="w" data-k="e07-hormones-local">T3</button> ; DIO3 inactive <button class="w" data-k="e07-hormones-local">T4</button>/<button class="w" data-k="e07-hormones-local">T3</button>, tandis que DIO1 participe au métabolisme périphérique. Les récepteurs nucléaires et leurs cofacteurs conditionnent la réponse. Une anomalie de transport sérique <button class="w" data-k="e07-tbg">TBG</button> ne doit pas être assimilée à un déficit du transporteur cellulaire MCT8 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>].</p><p>En maladie critique, le foie, le muscle, l’hypothalamus et les cellules immunitaires ne répondent pas tous de la même manière. Certains résultats proviennent de souris ou de cultures cellulaires et ne sont pas directement une cible thérapeutique humaine. L’inflammation, la restriction calorique et les médicaments modifient l’axe ; la <button class="w" data-k="e07-hormones-local">TSH</button> peut rester basse malgré une <button class="w" data-k="e07-hormones-local">T4</button> basse. Normaliser le sérum ne garantit pas de restaurer chaque tissu. Le traitement vise donc la maladie sous-jacente et une hypothyroïdie authentique si elle est démontrée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>].</p><div class="key"><b>Examen et décision.</b> Synthèse : FT4/<button class="w" data-k="e07-hormones-local">TSH</button> puis recherche de cause. Transport sérique : total, libre, <button class="w" data-k="e07-tbg">TBG</button> et méthode. Action tissulaire : contexte et exploration spécialisée si discordance persistante. Ces trois niveaux ne se traitent pas sur le même chiffre.</div><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>] tableau 3 et §3–5 ; [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28648509/" target="_blank" rel="noopener">S13</a>] résumé Pendred ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>] transport, organes et traitement ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4407423/" target="_blank" rel="noopener">S41</a>] liaison ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>] différentiel des tests discordants.</p><figure><svg role="img" aria-label="Niveaux fonctionnels hormonaux : schéma logique non anatomique" viewBox="0 0 460 335" style="width:100%;max-width:600px;height:auto;display:block;margin:auto"><rect x="10" y="8" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="41" text-anchor="middle" font-size="18" fill="#153653">Synthèse glandulaire</text><text x="230" y="84" text-anchor="middle" font-size="22" fill="#153653">↓</text><rect x="10" y="88" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="121" text-anchor="middle" font-size="18" fill="#153653">Transport lié et fraction libre</text><text x="230" y="164" text-anchor="middle" font-size="22" fill="#153653">↓</text><rect x="10" y="168" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="201" text-anchor="middle" font-size="18" fill="#153653">Entrée et métabolisme tissulaires</text><text x="230" y="244" text-anchor="middle" font-size="22" fill="#153653">↓</text><rect x="10" y="248" width="440" height="54" rx="8" fill="#eef3fa" stroke="#254568"/><text x="230" y="281" text-anchor="middle" font-size="18" fill="#153653">Action hormonale selon le tissu</text></svg><figcaption>Schéma logique, non anatomique. Ces niveaux participent à la fonction ; leur état ne se déduit pas d’un seul dosage sérique. Sources [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9816506/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11301568/" target="_blank" rel="noopener">S36</a>].</figcaption></figure><p class="key"><b>Science → clinique.</b> Une réserve liée abaissée peut réduire la <button class="w" data-k="e07-hormones-local">T4</button> totale sans insuffisance hormonale ; la maladie critique ajoute des variations tissulaires.</p><p class="key"><b>Science → examen.</b> Total, libre et <button class="w" data-k="e07-hormones-local">TSH</button> répondent à des questions distinctes ; les normes dépendent de l’âge et la méthode.</p><p class="key"><b>Science → traitement.</b> Traiter la synthèse insuffisante démontrée ; ne pas corriger mécaniquement la réserve liée ou un profil NTIS.</p><p class="key"><b>À retenir.</b> Le résultat sérique ne mesure pas directement l’action hormonale de chaque organe.</p></section></div><div class="sci" id="e07-s-bioch" hidden><section class="ilot" id="e07-s-bioch-cours"><h2>Biochimie : calcitonine, interférences et désiodases</h2><p>La calcitonine mature compte 32 acides aminés ; elle dérive d’une procalcitonine de 116 acides aminés et d’un précurseur de 141. Ces molécules sont liées par leur biosynthèse, mais leurs dosages n’ont ni les mêmes indications ni la même cinétique. Le calcium stimule la sécrétion des cellules C ; cette propriété fonde le test de stimulation, dont l’utilité clinique s’est réduite avec les immunodosages basaux sensibles. La procalcitonine, plus stable avec une demi-vie de l’ordre de 20–24 heures, peut compléter le bilan, mais infection, traumatisme, choc et dysfonction rénale ou hépatique en compliquent l’interprétation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>].</p>
<figure><svg style="max-width:100%;height:auto" viewBox="0 0 560 175" role="img" aria-label="Chaîne biochimique non anatomique : précurseur 141 acides aminés, procalcitonine 116, calcitonine 32" font-family="sans-serif" font-size="14"><g fill="#eef5f7" stroke="#24485a"><rect x="5" y="25" width="160" height="100" rx="7"/><rect x="200" y="25" width="160" height="100" rx="7"/><rect x="395" y="25" width="160" height="100" rx="7"/></g><g fill="#102c38"><text x="20" y="60">Précurseur</text><text x="20" y="90">141 acides aminés</text><text x="211" y="60">Procalcitonine</text><text x="211" y="90">116 acides aminés</text><text x="409" y="60">Calcitonine</text><text x="409" y="90">32 acides aminés</text><text x="172" y="80">→</text><text x="367" y="80">→</text></g></svg><figcaption>Schéma logique de filiation moléculaire, non anatomique. Les flèches représentent la maturation du précurseur ; elles ne signifient pas qu’un dosage est interchangeable avec l’autre. Source [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>], introduction.</figcaption></figure>
<p>Un immunodosage repose sur des interactions moléculaires. Des anticorps hétérophiles ou dirigés contre les réactifs peuvent produire des valeurs trompeuses ; une macrocalcitonine correspond à une forme de haut poids moléculaire dont le comportement analytique diffère. En excès majeur d’antigène, l’effet crochet peut paradoxalement sous-estimer la concentration. Le laboratoire peut discuter dilution, méthode alternative ou précipitation au PEG selon l’hypothèse ; aucun test correctif ne doit être prescrit mécaniquement sans connaître la plateforme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>].</p><p>La biotine et les anticorps anti-streptavidine ou anti-ruthénium n’affectent pas toutes les méthodes de la même manière. Une discordance clinique–biologique demande l’historique des compléments et une communication avec le biologiste. De même, les résultats de calcitonine de plateformes différentes ne sont pas convertibles par un facteur unique : le suivi longitudinal privilégie la même méthode. La conservation du sérum et le délai de transport peuvent changer le résultat avant même le dosage [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>, <a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>].</p><p>Les désiodases réalisent des transformations distinctes : DIO2 retire un iode externe pour produire <button class="w" data-k="e07-hormones-local">T3</button> à partir de <button class="w" data-k="e07-hormones-local">T4</button> ; DIO3 inactive <button class="w" data-k="e07-hormones-local">T4</button> en reverse-T3 et <button class="w" data-k="e07-hormones-local">T3</button> en diiodothyronine ; DIO1 peut catalyser plusieurs réactions. En NTIS, l’ensemble dépend de l’organe et du stade. La reverse-T3 peut être normale ou basse malgré un syndrome de maladie non thyroïdienne, et ne résout pas à elle seule le diagnostic différentiel. Cette limite découle de la physiologie et des études cliniques, pas d’une simple indisponibilité du test [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>].</p><div class="key"><b>Biochimie → clinique.</b> Comprendre le test aide à reconnaître une fausse discordance ; comprendre le métabolisme évite de traiter une concentration isolée. Le résultat reste relié au prélèvement, à l’instrument et au patient.</div><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12921259/" target="_blank" rel="noopener">S6</a>] calcitonine et tables 1–4 ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>] transport et métabolisme des hormones thyroïdiennes et différentiel ; [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S19</a>] biotine ; [<a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00656/calcitonine-ct" target="_blank" rel="noopener">S32</a>, <a data-reference-source="1" href="https://www.viollier.ch/fr/analysis/36059" target="_blank" rel="noopener">S33</a>] préanalytique suisse.</p><p class="key"><b>Science → clinique.</b> Une interférence peut produire une discordance sans modifier la sécrétion réelle ; précurseurs et hormone mature ne sont pas interchangeables.</p><p class="key"><b>Science → examen.</b> Discuter dilution, méthode alternative ou recherche d’interférence avec le laboratoire selon la plateforme.</p><p class="key"><b>Science → traitement.</b> Le test au calcium est une procédure spécialisée hors indication du produit décrit, pas un traitement de l’hypercalcitoninémie.</p><p class="key"><b>À retenir.</b> Un seuil de série doit garder son immunodosage, sa population et ses limites.</p></section></div><div class="sci" id="e07-s-gene" hidden><section class="ilot" id="e07-s-gene-cours"><h2>Génétique : transmission, phénotype et conseil familial</h2><p>Un résultat génétique n’a de sens qu’avec le phénotype et la classification du variant. La plupart des dyshormonogenèses classiques suivent une transmission autosomique récessive : si les deux parents portent chacun un variant pathogène du même gène, le risque d’un enfant atteint est de 25 % à chaque grossesse. Cela n’est pas un risque universel de tout goitre ou de tout résultat de panel. Des formes dominantes, une pénétrance incomplète et des associations de variants de plusieurs gènes sont décrites, notamment pour DUOX et IYD [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>].</p>
<figure><svg style="max-width:100%;height:auto" viewBox="0 0 500 245" role="img" aria-label="Table de transmission autosomique récessive pour deux parents hétérozygotes : AA, Aa, Aa, aa" font-family="sans-serif" font-size="16"><g fill="#f0f7f4" stroke="#254d41"><rect x="160" y="60" width="145" height="70"/><rect x="305" y="60" width="145" height="70"/><rect x="160" y="130" width="145" height="70"/><rect x="305" y="130" width="145" height="70"/></g><g fill="#17382d"><text x="180" y="40">Parent 1 : A</text><text x="325" y="40">Parent 1 : a</text><text x="10" y="100">Parent 2 : A</text><text x="10" y="170">Parent 2 : a</text><text x="220" y="100">A / A</text><text x="365" y="100">A / a</text><text x="220" y="170">A / a</text><text x="345" y="170">a / a : atteint</text><text x="20" y="235">Deux parents porteurs ; hypothèses récessives explicites</text></g></svg><figcaption>Table logique non anatomique : quatre combinaisons équiprobables dans le modèle récessif, soit 25 % aa à chaque grossesse. A représente ici l’allèle fonctionnel et a le variant pathogène ; la gravité clinique n’est pas déduite du tableau. Source [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>], conseil génétique.</figcaption></figure>
