<p class="ratio" data-cover="e07-9,e07-10"></p><ul><li>Calcitonine : confirmer, évaluer le risque ; stimulation sélectionnée et RET selon le diagnostic ; anomalie isolée de transport ou NTIS : pas de substitution systématique ; traiter toute hypothyroïdie authentique coexistante.</li><li>Lévothyroxine jusqu’à 15 µg/kg/jour avant 2 semaines ; cible basse-normale en dyshormonogenèse.</li><li>Contrôle 4 à 6 semaines après chaque changement de dose ; association pronostique n’est pas causalité.</li></ul></template>
<template data-pop="pareto-e07-situations" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="e07-11"></p><ul><li>Grossesse et œstrogènes augmentent la liaison et les besoins.</li><li>Prématuré : risque de collapsus sous lévothyroxine.</li><li>Insuffisance rénale : calcitonine 10 à 50 pg/ml, rarement plus de 100.</li></ul></template>
<template data-pop="pareto-e07-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e07-e-1,e07-e-2,e07-e-3,e07-e-4,e07-e-5"></p><ul><li>Calcitonine répétée avec la même méthode ; test au calcium sélectionné (seuils d’étude 79 et 466 pg/ml, méthode propre) ; procalcitonine avec ses facteurs de confusion ; cytologie insuffisante seule.</li><li>Hypothyroïdie congénitale : thyréostimuline et thyroxine libre, perchlorate, thyroglobuline, génétique.</li><li>Globuline liante et maladie non thyroïdienne : <button class="w" data-k="e07-hormones-local">TSH</button> et FT4 s’interprètent avec contexte et fiabilité analytique.</li></ul></template>
<template data-pop="pareto-e07-sciences" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="e07-s-semio-cours,e07-s-anat-cours,e07-s-histo-cours,e07-s-physio-cours,e07-s-bioch-cours,e07-s-gene-cours"></p><ul><li>Cellules C produisent la calcitonine ; hyperplasie réactive ou néoplasique.</li><li>Chaîne de synthèse : captation, efflux, peroxyde, organification, recyclage ; plusieurs gènes et phénotypes possibles par étape.</li><li>Deux parents porteurs d’une même maladie récessive : 25 % ; globuline liante liée à l’X ; RET dominant.</li></ul></template>
<template data-pop="pareto-e07-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e07-p-1,e07-p-2,e07-p-3,e07-p-4,e07-p-5,e07-p-6"></p><ul><li>La lévothyroxine traite l’hypothyroïdie avérée ; une anomalie isolée de transport ou un NTIS ne justifie pas une substitution systématique.</li><li>Séparer de 2 heures des sels et de 4 à 5 heures des résines ; œstrogènes augmentent les besoins.</li><li>Ne pas substituer le seul chiffre ; poursuivre ou introduire un traitement si une hypothyroïdie authentique est démontrée.</li></ul></template>

<template data-pop="e07-tpo-local" data-title="TPO : thyroperoxydase"><p>Dans cette leçon, <button class="w" data-k="e07-tpo-local">TPO</button> désigne la peroxydase thyroïdienne, enzyme de l’organification de l’iode et du couplage sur la thyroglobuline. Son déficit peut provoquer une dyshormonogenèse ; le phénotype varie et n’impose pas toujours un goitre. Anti-<button class="w" data-k="e07-tpo-local">TPO</button> désigne les anticorps dirigés contre cette enzyme. Ce terme ne désigne pas ici la thrombopoïétine.</p><p class="src">[<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">S3</a>] ENDO-ERN, tableau 3 ; [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">S16</a>] différentiel du NTIS.</p></template>

<template data-pop="e07-rcp-local" data-title="RCP : résumé des caractéristiques du produit"><p>Dans cette leçon, ce sigle désigne le résumé des caractéristiques du produit, ici le document allemand exact de Calciumgluconat B. Braun 10 %. Il décrit composition, indication autorisée, doses, voies, contre-indications, interactions et effets indésirables. Le test de calcitonine n’y figure pas comme indication. Ce sigle ne désigne pas ici la réanimation cardiopulmonaire.</p><p class="src"><a data-reference-source="1" href="https://www.fachinfo.de/fi/pdf/002742" target="_blank" rel="noopener">[S34] RCP exact, juillet 2014, §1–4.8</a>.</p></template>

<template data-pop="e07-hormones-local" data-title="Thyroxine, triiodothyronine et thyréostimuline"><p>La thyroxine contient quatre atomes d’iode, la triiodothyronine trois. La fraction totale comprend la réserve liée aux protéines ; la fraction libre doit être interprétée avec la méthode et les normes d’âge. La thyréostimuline hypophysaire participe au rétrocontrôle, mais une valeur normale ou basse n’exclut pas une hypothyroïdie lorsque maladie critique, médicament ou atteinte centrale modifie l’axe. Les références adultes ne sont pas appliquées au nouveau-né. Aucun seuil unique ne remplace le contexte.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">[S3] ENDO-ERN</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8285315/" target="_blank" rel="noopener">[S16] NTIS</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">[S42] synthèse normale</a>.</p></template>
