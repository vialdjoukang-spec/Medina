<template data-pop="g91-sm-pc" data-title="Périmètre crânien : mesure et courbe">
<div class="lab">Normal</div><p>Le périmètre crânien d’un enfant sain progresse le long de sa propre courbe de percentiles [S19].</p><div class="lab">Technique</div><p>Le médecin mesure le périmètre à chaque visite et le reporte sur la courbe ; la ligne directrice germano-autrichienne recommande au moins un contrôle annuel du périmètre et du développement chez l’enfant dérivé [S19].</p><div class="lab">Mécanisme</div><p>Chez le nourrisson, les sutures et la fontanelle ouvertes permettent au crâne de céder sous la pression du LCS accumulé [S2].</p><div class="lab">Valeur et piège</div><p>La sortie de percentile est citée en tête des signes d’une série de 107 enfants, sans fréquence lisible dans le texte extrait ; aucune sensibilité n’a été trouvée [S19]. Une mesure isolée ne permet pas de conclure. Le seuil de 98e percentile du réseau nord-américain HCRN est un consensus américain, cité par la revue de Kahle, et n’est pas retenu comme seuil décisionnel ici [S2].</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/006-102l_S2k_Hydrozephalus-Kindesalter_2025-06.pdf" target="_blank" rel="noopener">AWMF S2k 006-102, 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Kahle 2024</a>.</p></template>
<template data-pop="g91-sm-fontanelle" data-title="Fontanelle : palpation et pièges">
<div class="lab">Technique</div><p>La fontanelle se palpe chez un nourrisson calme ; sa taille et sa tension se contrôlent à chaque visite et se montrent aux parents [S19].</p><div class="lab">Pathologique</div><p>Une fontanelle tendue, bombante ou pulsatile accompagne des sutures disjointes dans l’hypertension intracrânienne du nouveau-né [S19 ; S2].</p><div class="lab">Piège</div><p>Pendant les cris, la fontanelle est presque toujours haute ; après les cris, chez l’enfant dérivé, elle peut s’affaisser par hyperdrainage [S19].</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/006-102l_S2k_Hydrozephalus-Kindesalter_2025-06.pdf" target="_blank" rel="noopener">AWMF S2k 006-102, 2025</a>.</p></template>
<template data-pop="g91-sm-coucher" data-title="Parésie du regard vers le haut (« coucher de soleil »)">
<div class="lab">Définition</div><p>L’enfant ne peut pas porter le regard vers le haut ; les yeux paraissent tournés vers le bas [S2].</p><div class="lab">Valeur</div><p>C’est un signe d’hypertension intracrânienne chez le nourrisson et chez l’enfant plus âgé [S2]. Les sources lues ne donnent ni sa fréquence ni son mécanisme précis : lacune déclarée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Kahle 2024</a>.</p></template>
<template data-pop="g91-sm-papille" data-title="Œdème papillaire et gaine du nerf optique">
<div class="lab">Valeur</div><p>L’œdème papillaire fait partie des signes d’hypertension intracrânienne de l’enfant [S2].</p><div class="lab">Technique complémentaire</div><p>Une équipe entraînée peut mesurer par échographie le diamètre de la gaine du nerf optique, avec un indice mécanique réduit au-dessous de 0,2 pour protéger le cristallin et la rétine [S19].</p><div class="lab">Limite</div><p>La revue de Kahle juge ces techniques non validées pour un usage généralisé [S2].</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/006-102l_S2k_Hydrozephalus-Kindesalter_2025-06.pdf" target="_blank" rel="noopener">AWMF S2k 006-102, 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Kahle 2024</a>.</p></template>
<template data-pop="g91-sm-valve" data-title="Examen d’une dérivation">
<div class="lab">Technique</div><p>Le médecin palpe tout le trajet du cathéter pour exclure une déconnexion, une dislocation ou une migration ; il palpe prudemment la chambre de ponction [S19].</p><div class="lab">Lecture</div><p>Une chambre qui ne se remplit pas évoque une obstruction ou un hyperdrainage persistant [S19].</p><div class="lab">Piège</div><p>Le pompage répété de la chambre par les parents crée des pressions très élevées et peut détruire le mécanisme de la valve [S19].</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/006-102l_S2k_Hydrozephalus-Kindesalter_2025-06.pdf" target="_blank" rel="noopener">AWMF S2k 006-102, 2025, chapitre 7.7</a>.</p></template>
<template data-pop="g91-sm-pouce" data-title="Syndrome L1 : pouces en adduction">
<div class="lab">Sémiologie</div><p>Le syndrome L1, lié au gène L1CAM, associe une hydrocéphalie par sténose de l’aqueduc, une déficience intellectuelle sévère, une parésie spastique et des pouces en adduction [S19].</p><div class="lab">Valeur</div><p>Des mutations de L1CAM sont retrouvées chez environ 10 % des garçons atteints d’une hydrocéphalie isolée ; la transmission est récessive liée à l’X [S19].</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/006-102l_S2k_Hydrozephalus-Kindesalter_2025-06.pdf" target="_blank" rel="noopener">AWMF S2k 006-102, 2025, chapitre 3.7</a>.</p></template>
