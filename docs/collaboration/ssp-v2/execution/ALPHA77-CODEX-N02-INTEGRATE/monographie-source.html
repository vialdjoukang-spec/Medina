<section class="ilot" data-semiology="interpretation" id="n02-semio-interpretation"><h3>Interpréter une probabilité, pas une étiquette automatique</h3><p>Les HUG utilisent plus de 60 % de dysmorphie ou plus de 5 % d’acanthocytes comme indices glomérulaires. La recommandation européenne chez les jeunes souligne une spécificité élevée des acanthocytes, mais une sensibilité imparfaite et dépendante de la méthode. Un signe fortement évocateur peut orienter lorsqu’il est présent sans exclure la maladie lorsqu’il manque.</p><p>La valeur d’un résultat dépend aussi de la probabilité avant le test. Une jeune personne avec plusieurs apparentés atteints et une albuminurie persistante ne se raisonne pas comme un adulte avec un seul prélèvement après course intense. Un résultat génétique incertain ne devient pas pathogène parce qu’il semble répondre à une attente. De même, des IgA sanguines ne remplacent pas les dépôts rénaux observés sur biopsie.</p><p>Les unités doivent rester visibles. Le seuil local HUG de 26/µL et le seuil CUEN de 10/µL ne sont pas des stades d’une même maladie. Albumine/créatinine en mg/g, protéines/créatinine en g/g et protéinurie en g/j décrivent des mesures liées mais distinctes. Vérifier analyte, unité et population avant d’utiliser un seuil diagnostique ou thérapeutique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p></section>
<section class="ilot" data-semiology="differentials" id="n02-semio-differentials"><h3>Discriminer les causes qui changent la conduite</h3><p>Une bandelette positive sans hématies confirmées conduit à envisager hémoglobine, myoglobine ou interférence. Une urine rouge avec bandelette négative peut avoir une cause pigmentaire non hémique ; l’alimentation et certains médicaments orientent. Il faut commencer par cette distinction pour éviter une cystoscopie ou une biopsie fondée sur une fausse prémisse.</p><p>Une source glomérulaire se discute devant acanthocytes, cylindres, albuminurie et maladie rénale ou systémique. Une source urologique se discute devant symptômes urinaires, colique, caillots et facteurs de risque tumoral. Ces groupes se chevauchent : une personne avec une maladie génétique peut aussi développer un calcul ou une tumeur. L’attribution de tout saignement à une cause ancienne est donc un piège.</p><p>Parmi les atteintes glomérulaires, IgA, collagène IV et glomérulonéphrites systémiques ne suivent pas le même parcours. La famille et la stabilité orientent la génétique ; la protéinurie et l’activité peuvent justifier le tissu ; la dégradation rapide exige un bilan urgent. Un syndrome néphrotique brutal chez un porteur COL4 A3/4 demande d’envisager une maladie surajoutée plutôt que d’expliquer mécaniquement tout par le variant.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a>.</p></section>
<section class="ilot" data-semiology="urgency" id="n02-semio-urgency"><h3>Identifier le moment où la surveillance ne suffit plus</h3><p>La persistance se confirme sur plusieurs prélèvements seulement si la situation est stable. Oligurie, hausse rapide de créatinine, surcharge respiratoire, hypertension avec retentissement ou manifestations systémiques sévères changent immédiatement le délai. Un syndrome pulmonaire–rénal ne se surveille pas comme une anomalie urinaire isolée. Une rétention par caillots ou un saignement mal toléré appelle également une prise en charge urgente.</p><p>Dans une IgA connue, l’insuffisance aiguë associée à une hématurie visible nécessite d’abord une évaluation et un soutien adaptés. Le repère KDIGO de deux semaines après disparition de l’hématurie pour considérer une nouvelle biopsie si la fonction ne récupère pas n’est pas une consigne d’attendre deux semaines avant de consulter. Il s’inscrit dans une prise en charge déjà engagée.</p><p>La définition d’IgA rapidement progressive associe une baisse fonctionnelle majeure sur une courte durée et l’exclusion d’autres causes. Des croissants histologiques isolés ne suffisent pas. Cette distinction protège contre deux erreurs opposées : retarder une maladie agressive ou exposer une personne stable à une immunosuppression inappropriée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></section>
<section class="ilot" data-semiology="limits" id="n02-semio-limits"><h3>Définir le domaine de validité de la conclusion</h3><p>La stratégie suisse HUG 2024 est le point d’appui clinique principal, complétée par les recommandations européennes pour jeunes et collagène IV. Le risque urologique adulte ne se transpose pas à un enfant. Les délais d’observation supposent une personne stable. Une recommandation de néphroprotection n’est pas automatiquement une indication autorisée du produit suisse, en particulier en pédiatrie et dans Alport.</p><p>Le diagnostic génétique peut rester incomplet : variant incertain, couverture technique insuffisante ou discordance phénotypique. Une biopsie échantillonne le rein et ses résultats s’interprètent avec la clinique. Une image de microscopie publiée dans ce cours montre un champ et une coloration ; elle ne fournit ni le génotype, ni un pronostic individuel, ni la totalité des lésions d’un patient.</p><p>La fonction normale au début ne promet pas une absence de progression. À l’inverse, un diagnostic familial ne prédit pas une insuffisance terminale chez chacun. Présenter la variabilité et le plan de suivi permet d’informer sans banaliser ni dramatiser. Les seuils, résultats et préférences doivent être rediscutés au fil de l’évolution.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section>
<section class="ilot" data-semiology="sources" id="n02-semio-sources"><h3>Relier chaque décision à une lecture traçable</h3><p>Les définitions, la confirmation et l’orientation clinique renvoient aux pages 1–9 de la stratégie HUG 2024 effectivement lues. Le manuel CUEN précise la sémiologie et fournit un seuil français distinct ; les divergences sont conservées au lieu d’être fusionnées. Le guide européen des jeunes justifie échographie, répétition chez le patient stable et place de la génétique, avec une littérature de recherche arrêtée avant sa publication.</p><p>Le guide ERKNet/ERA/ESPN fonde les différences de génotype, la surveillance et le début du traitement. KDIGO 2025 fonde le diagnostic biopsique et les stratégies IgA dans les sections lues. Les FI suisses exactes sont séparées de ces recommandations : elles fixent notamment doses, limites d’organes, grossesse et interactions des produits décrits.</p><p>Le registre de sources public associe URL, section, population, empreinte et paraphrase. Les documents complets et extraits de travail restent dans le cache externe. Il s’agit de lectures ciblées réellement effectuées, pas d’une lecture intégrale revendiquée de tous les ouvrages ni d’une validation médicale humaine. Les figures ont leur propre preuve de provenance et de licence, distincte des preuves thérapeutiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section>
<section class="ilot" id="n02-bridge-semio"><h3>Relier la science à la décision</h3><p><b>Science → clinique.</b> La description des hématies et des signes associés localise et hiérarchise les hypothèses. Une fonction normale ne suffit pas à prouver une hématurie isolée.</p><p><b>Science → examen.</b> Confirmer les cellules, mesurer protéines et fonction, puis interpréter morphologie et trajectoire ensemble.</p><p><b>Science → traitement.</b> L’urgence, la preuve étiologique, le génotype et les contre-indications priment sur la seule persistance de la bandelette.</p><div class="key"><b>À retenir.</b> Décrire, confirmer, localiser, évaluer le retentissement, puis décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a>.</p></section></div><div aria-labelledby="n02-tab-anat" class="sci" hidden="" id="n02-s-anat" role="tabpanel"><section class="ilot" id="n02-s-anat-content"><h2>Anatomie : distinguer le filtre et les voies excrétrices</h2><p>Le rein associe cortex périphérique, médulla organisée en pyramides et cavités collectrices qui conduisent l’urine vers le bassinet puis l’uretère. Les corpuscules glomérulaires appartiennent au parenchyme cortical ; leurs capillaires reçoivent le sang et filtrent vers l’espace de Bowman. Le liquide poursuit ensuite son trajet dans les tubules. Cette succession explique comment deux lésions situées dans des compartiments différents peuvent donner le même signe final, du sang dans l’urine.</p><p>Une lésion glomérulaire introduit les érythrocytes tôt dans le trajet néphronique. Une lésion de la voie excrétrice les introduit en aval. L’examen du sédiment exploite une partie de cette différence, tandis que l’imagerie et l’endoscopie explorent des structures plus grandes. Aucun de ces examens ne remplace entièrement les autres. Une échographie normale ne démontre pas l’intégrité moléculaire du filtre ; un sédiment glomérulaire ne montre pas la paroi de la vessie.</p><p>La planche historique du rein normal permet de repérer cortex, pyramide, bassinet et uretère. Les annotations sont ajoutées en HTML sans modifier les pixels. La figure n’est ni une image de cancer ni un schéma d’Alport. Elle aide à situer les hypothèses et à comprendre pourquoi une cystoscopie explore une question différente d’une biopsie rénale.</p><figure data-n02-figure="kidney"><div data-n02-frame="tall"><img alt="Planche anatomique humaine historique du rein normal" loading="lazy" src="assets/img/n02/alpha/codex/Kidney_section_vertical.png"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span><span aria-hidden="true" data-n02-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cortex : parenchyme périphérique, distinct de la voie urinaire.</li><li>Pyramide médullaire : repère anatomique normal.</li><li>Bassinet : voie collectrice, distincte du filtre glomérulaire.</li><li>Uretère : continuité de la voie excrétrice.</li></ol><p>Planche normale historique ; elle situe le parenchyme et les voies excrétrices sans montrer une cause de saignement. Aucune lésion fictive n’est ajoutée.</p><p data-n02-credit="">Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 · <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" rel="noopener" target="_blank">Domaine public</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Au niveau microscopique, le glomérule associe un peloton capillaire, son support mésangial et la capsule qui reçoit le filtrat. Les podocytes recouvrent le versant externe des capillaires par leurs prolongements. Une anomalie de collagène IV concerne une architecture beaucoup plus fine que celle visible sur la planche macroscopique. Il faut alors passer de la localisation anatomique à l’analyse histologique ou génétique.</p><p><b>Conséquence clinique.</b> Les caillots et la temporalité dans la miction peuvent orienter vers les voies, mais ne localisent pas avec certitude toutes les lésions. Une hématurie totale n’impose pas une cause rénale. L’histoire, le sédiment et le risque tumoral permettent de choisir l’examen approprié plutôt que de déduire un diagnostic de la seule couleur ou du seul moment de saignement.</p><p><b>Conséquence thérapeutique.</b> Le blocage rénine–angiotensine protège certains néphrons malades ; il ne traite pas une obstruction par caillots ni une tumeur vésicale. L’anatomie sert donc aussi à vérifier que le traitement proposé répond au bon compartiment et à ne pas laisser une cause associée sans prise en charge.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-REIN — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a>.</p></section>
<section class="ilot" id="n02-bridge-anat"><h3>Relier la science à la décision</h3><p><b>Science → clinique.</b> Le filtre glomérulaire et la voie excrétrice sont deux compartiments différents qui peuvent produire le même signe.</p><p><b>Science → examen.</b> Sédiment, biopsie, échographie et cystoscopie explorent des dimensions différentes ; un résultat normal ne remplace pas les autres.</p><p><b>Science → traitement.</b> Le blocage rénine–angiotensine ne traite pas une obstruction par caillots ; choisir le traitement selon la structure atteinte.</p><div class="key"><b>À retenir.</b> La localisation anatomique organise les examens et prévient une attribution trop rapide.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-REIN — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a>.</p></section></div><div aria-labelledby="n02-tab-histo" class="sci" hidden="" id="n02-s-histo" role="tabpanel"><section class="ilot" id="n02-s-histo-content"><h2>Histologie : lire une lésion sans lui faire dire une étiologie entière</h2><p>Le filtre normal associe endothélium, membrane basale et podocytes. Le mésangium soutient les anses capillaires et participe à l’organisation glomérulaire. Le diagnostic pathologique exige d’identifier le compartiment atteint, la nature des dépôts et les lésions actives ou chroniques. Une coloration courante, une immunofluorescence et une étude ultrastructurale ne montrent pas la même information.</p><p>Dans une maladie du collagène IV, la membrane basale peut être amincie, irrégulière ou lamellée selon le contexte. Une membrane fine est un constat morphologique ; elle ne garantit pas un avenir bénin et n’identifie pas à elle seule le mode de transmission. Les données génétiques et familiales complètent le tissu. Une sclérose segmentaire secondaire peut apparaître avec la perte podocytaire ; elle ne démontre pas une maladie primitive sensible aux corticoïdes.</p><p>Dans l’IgA, les dépôts glomérulaires d’IgA fondent le diagnostic dans un contexte approprié. Rechercher les causes secondaires, notamment maladie hépatique, maladie inflammatoire intestinale, infection ou maladie systémique selon le tableau. MEST-C décrit plusieurs composantes : mésangium, endocapillaire, sclérose segmentaire, atteinte tubulo-interstitielle et croissants. La protéinurie et la fonction restent nécessaires pour interpréter le risque et discuter le traitement.</p><figure data-n02-figure="podocytes"><div data-n02-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n02/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n02-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La microphotographie suivante illustre une glomérulonéphrite extracapillaire ; la source décrit une maladie anti-membrane basale avec immunofluorescence linéaire. Cette fluorescence n’est pas visible sur la coloration PAS présentée. L’image sert à montrer un diagnostic différentiel grave et les limites d’une coupe, pas à illustrer faussement une IgA ou un syndrome d’Alport.</p><figure data-n02-figure="crescent"><div data-n02-frame="wide"><img alt="Microphotographie humaine PAS d’une glomérulonéphrite extracapillaire, avec maladie anti-membrane basale documentée par la source" loading="lazy" src="assets/img/n02/alpha/codex/Crescentic_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Premier glomérule lésé dans la moitié gauche.</li><li>Autre glomérule lésé ; l’évaluation d’activité et de fibrose nécessite toute la biopsie.</li><li>Lumière tubulaire : repère de séparation entre compartiments.</li></ol><p>La source rapporte des dépôts linéaires d’IgG en immunofluorescence ; ce signal n’est pas visible sur cette coloration PAS. Les repères localisent les structures sans prétendre typer chaque cellule ni quantifier les croissants.</p><p data-n02-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Crescentic_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Un champ ne permet pas de calculer la proportion totale de glomérules lésés ni de conclure à une progression rapide. Cette dernière exige une trajectoire clinique. Dans une IgA, des croissants sans chute fonctionnelle rapide ne déclenchent pas automatiquement un protocole cytotoxique. Inversement, une dégradation rapide justifie une évaluation urgente même si l’on ne dispose pas encore d’une image spectaculaire.</p><p><b>Science → décision.</b> La biopsie doit répondre à une question diagnostique ou pronostique utile. Elle peut éviter de traiter une cause structurale comme une inflammation, révéler une maladie surajoutée ou guider une prise en charge urgente. La génétique peut rendre une biopsie de confirmation inutile dans certaines formes établies, tout en laissant une indication si l’évolution devient atypique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></section>
<section class="ilot" id="n02-bridge-histo"><h3>Relier la science à la décision</h3><p><b>Science → clinique.</b> Une membrane fine, des dépôts d’IgA et un croissant ne racontent pas la même maladie ni le même niveau d’activité.</p><p><b>Science → examen.</b> Microscopie optique, immunofluorescence et électronique se complètent ; la génétique ajoute une preuve différente.</p><p><b>Science → traitement.</b> La trajectoire clinique et le mécanisme gouvernent le traitement ; un croissant seul ne justifie pas un protocole de progression rapide.</p><div class="key"><b>À retenir.</b> Lire tissu, fonction et contexte ensemble, sans tirer tout un diagnostic d’un seul champ.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></section></div><div aria-labelledby="n02-tab-physio" class="sci" hidden="" id="n02-s-physio" role="tabpanel"><section class="ilot" id="n02-s-physio-content"><h2>Physiologie : fonction globale, perméabilité et adaptation</h2><p>La filtration glomérulaire produit un ultrafiltrat que les tubules modifient par réabsorption et sécrétion. L’urine finale n’est donc pas une copie du plasma. Une anomalie de perméabilité peut faire apparaître du sang ou de l’albumine avant qu’une baisse importante du débit global soit mesurable. C’est pourquoi une créatinine normale ne suffit pas à classer une hématurie comme sans risque.</p><p>Le néphron agit en série : glomérule, tubule proximal, anse, segment distal et système collecteur. Le traitement tubulaire de l’eau et des solutés influence la composition de l’urine et l’environnement des cellules qui y transitent. Les cylindres se distinguent de simples cellules libres ; leur nature oriente vers une atteinte rénale, sans que chaque type soit spécifique d’une unique maladie.</p><figure data-n02-figure="nephron"><div data-n02-frame="tall"><img alt="Illustration humaine historique des échanges tubulaires du néphron normal" loading="lazy" src="assets/img/n02/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tubule proximal : réabsorption et sécrétion modifient le filtrat.</li><li>Branche ascendante : repère de la réabsorption de sodium, potassium et chlorure.</li><li>Canal collecteur : ajustement final de l’eau et des solutés.</li></ol><p>Schéma simplifié normal ; les flèches sont celles de l’original. Il ne mesure pas les flux d’un patient et ne représente pas une glomérulonéphrite.</p><p data-n02-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La protéinurie traduit un retentissement différent de l’hématurie seule. Dans l’IgA, sa persistance est un marqueur de risque et une cible thérapeutique ; dans le collagène IV, l’apparition de microalbuminurie change souvent le moment du traitement. Il faut vérifier si l’on mesure albumine ou protéines totales et réévaluer après un épisode de sang visible qui peut majorer le résultat.</p><p>Le système rénine–angiotensine participe à la régulation de la pression et à l’hémodynamique rénale. Son blocage diminue la pression artérielle et la protéinurie chez les patients appropriés, mais expose à hypotension, hyperkaliémie et modification de la fonction. Une déplétion hydrosodée ou une sténose artérielle rénale significative change le risque. L’ajout d’un second bloqueur n’est donc pas une simple intensification sans conséquence.</p><p>Les inhibiteurs SGLT2 agissent sur le transport tubulaire du glucose et du sodium. Leur intérêt dans certaines maladies rénales chroniques ne dépend pas uniquement du contrôle glycémique ; leur utilisation demande néanmoins une population et une indication appropriées. La FI Forxiga ne recommande pas l’introduction sous un débit de 25 mL/min/1,73 m² et ne recommande pas son emploi sous immunosuppresseur dans la maladie rénale chronique. Une hématurie isolée n’est pas une indication autonome.</p><p><b>Science → surveillance.</b> Comparer pression, volume, potassium, créatinine et protéines avant et après une modification thérapeutique. Une hausse de créatinine doit être interprétée avec l’état clinique, la déshydratation, les médicaments et l’évolution ; elle ne doit être ni ignorée ni automatiquement attribuée à une progression irréversible. Les contrôles de sécurité précoces ne sont pas remplacés par le suivi annuel d’une maladie stable.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></section>
<section class="ilot" id="n02-bridge-physio"><h3>Relier la science à la décision</h3><p><b>Science → clinique.</b> Perméabilité et débit global sont distincts : sang et albumine peuvent apparaître avant une baisse importante de filtration.</p><p><b>Science → examen.</b> Suivre pression, créatinine, potassium et protéines avant et après modification thérapeutique.</p><p><b>Science → traitement.</b> Une action sur la pression ou le transport tubulaire peut protéger le rein mais aussi modifier volume, potassium et fonction.</p><div class="key"><b>À retenir.</b> La sécurité suit la physiologie : protéger sans provoquer déplétion ou double blocage.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></section></div><div aria-labelledby="n02-tab-bio" class="sci" hidden="" id="n02-s-bio" role="tabpanel"><section class="ilot" id="n02-s-bio-content"><h2>Biochimie et biologie moléculaire : mesurer la bonne substance</h2><p>La bandelette dite « sang » réagit à une propriété de l’hème. Les globules rouges contiennent de l’hémoglobine, mais l’hémoglobine libre et la myoglobine peuvent aussi produire une réaction positive. Le test ne compte pas les cellules. Lorsque le résultat et la microscopie divergent, il faut considérer la qualité du prélèvement et le contexte clinique plutôt que conclure automatiquement à une microhématurie.</p><p>La vitamine C, certains contextes de pH et des substances interférentes peuvent modifier la réaction ; une contamination par des produits oxydants peut également perturber l’analyse. Les HUG listent ces limites. Le bon réflexe est de vérifier les conditions et de confirmer l’observation, pas de tirer d’une bandelette isolée un diagnostic moléculaire. Une urine colorée par un pigment non hémique peut donner encore une autre combinaison de résultats.</p><p>L’albumine est une protéine particulière, tandis que le dosage des protéines totales inclut d’autres constituants. Le rapport à la créatinine urinaire réduit l’effet de la dilution sans rendre tous les prélèvements équivalents. Chez le jeune, le premier prélèvement du matin aide à discuter une composante orthostatique. Le choix de l’analyte doit suivre la question clinique : albuminurie de suivi Alport, protéinurie totale pour certains seuils IgA, ou suspicion de protéinurie tubulaire dans un contexte différent.</p><figure data-n02-figure="sediment"><div data-n02-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n02/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span><span aria-hidden="true" data-n02-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n02-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les gènes COL4 A3, COL4 A4 et COL4 A5 codent des chaînes du collagène IV impliquées dans la membrane basale. Le variant et son mode de transmission participent au risque, mais la prédiction n’est pas entièrement déterministe. Une variante de signification incertaine n’est pas une preuve de causalité ; une variante hétérozygote peut coexister avec une autre cause de maladie rénale. Le conseil génétique explique cette différence entre résultat de laboratoire et diagnostic.</p><p>Une concentration sérique d’IgA n’est pas un substitut à la démonstration rénale des dépôts. La biologie sanguine et la biopsie observent des compartiments et des phénomènes distincts. De même, le terme MEST-C résume des lésions morphologiques, pas un dosage sanguin ni un calcul de bénéfice thérapeutique. Associer les données évite de demander à un seul marqueur de résoudre toutes les questions.</p><p><b>Science → prescription.</b> La comparaison de deux seuils médicamenteux exige le même analyte et la même unité. Filspari emploie un rapport protéines/créatinine d’au moins 0,75 g/g ; Kinpeygo d’au moins 0,8 g/g, avec aussi une voie d’éligibilité par protéinurie d’au moins 1 g/j. Ces seuils ne doivent pas devenir 0,75 ou 0,8 mg/g d’albumine. Les différences viennent des FI propres, pas d’une faute à harmoniser arbitrairement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p><p><button class="w" data-k="n02-calcul-acr">Calculer et interpréter un rapport urinaire</button></p></section>
<section class="ilot" id="n02-bridge-bio"><h3>Relier la science à la décision</h3><p><b>Science → clinique.</b> La réaction à l’hème ne compte pas les cellules ; albumine et protéines totales sont des analytes différents.</p><p><b>Science → examen.</b> Nommer analyte et unité avant un calcul ; une IgA sérique ne démontre pas les dépôts rénaux.</p><p><b>Science → traitement.</b> Comparer les seuils propres aux FI : protéines/créatinine en g/g, et non albumine en mg/g.</p><div class="key"><b>À retenir.</b> Une unité correcte fait partie de la décision médicale.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section></div><div aria-labelledby="n02-tab-immuno" class="sci" hidden="" id="n02-s-immuno" role="tabpanel"><section class="ilot" id="n02-s-immuno-content"><h2>Immunologie et physiopathologie : distinguer inflammation et défaut structural</h2><p>Une hématurie glomérulaire est un signe commun à plusieurs mécanismes. La néphropathie à IgA implique des dépôts glomérulaires d’IgA et une atteinte immunologique ; la maladie du collagène IV repose d’abord sur une anomalie structurale héréditaire. Une glomérulonéphrite liée à une infection ou une maladie anti-membrane basale constitue encore un autre mécanisme. Ces catégories ne se traitent pas par une même dose empirique de corticoïde.</p><p>KDIGO sépare dans l’IgA les stratégies visant le processus lié à l’IgA et celles visant les conséquences de la perte néphronique. La réduction de la protéinurie et la protection hémodynamique ne prouvent pas l’extinction de toute activité immunologique. Inversement, cibler l’inflammation ne dispense pas de contrôler pression, albuminurie, mode de vie et toxicités. Cette complémentarité biologique ne suffit toutefois pas à autoriser toutes les combinaisons médicamenteuses dans le cadre suisse.</p><p>Le budésonide de Kinpeygo a une formulation à libération modifiée spécifique ; il ne se remplace pas par une préparation inhalée ou un autre produit digestif portant la même molécule. Son action glucocorticoïde peut exposer à effets systémiques, suppression de l’axe surrénalien, infections et effets métaboliques. La formulation ciblée ne signifie donc pas absence de surveillance. L’inhibition du CYP3 A peut augmenter l’exposition et modifier le risque.</p><figure data-n02-figure="crescent"><div data-n02-frame="wide"><img alt="Microphotographie humaine PAS d’une glomérulonéphrite extracapillaire, avec maladie anti-membrane basale documentée par la source" loading="lazy" src="assets/img/n02/alpha/codex/Crescentic_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Premier glomérule lésé dans la moitié gauche.</li><li>Autre glomérule lésé ; l’évaluation d’activité et de fibrose nécessite toute la biopsie.</li><li>Lumière tubulaire : repère de séparation entre compartiments.</li></ol><p>La source rapporte des dépôts linéaires d’IgG en immunofluorescence ; ce signal n’est pas visible sur cette coloration PAS. Les repères localisent les structures sans prétendre typer chaque cellule ni quantifier les croissants.</p><p data-n02-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Crescentic_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le sparsentan associe un antagonisme de l’endothéline et du récepteur de l’angiotensine ; il vise des voies de lésion et de pression intrarénales plutôt qu’une suppression immune générale. Le guide IgA demande de ne pas l’associer à un inhibiteur de l’enzyme de conversion ou à un antagoniste de l’angiotensine. La FI ajoute des limites propres : grossesse, potassium, pression, rétention hydrosodée et surveillance hépatique. Un mécanisme intéressant n’efface pas ces risques.</p><p>Dans Alport, l’albuminurie et la perte podocytaire peuvent aboutir à des lésions secondaires de sclérose. Leur présence histologique n’est pas une démonstration de maladie immunologique primitive. La néphroprotection, la surveillance familiale et le conseil génétique suivent ce mécanisme ; une présentation brutalement différente motive au contraire la recherche d’une maladie surajoutée.</p><p><b>Science → décision partagée.</b> Expliquer au patient si l’objectif est de réduire le risque de progression, de traiter une activité immunologique documentée ou de gérer une complication. Présenter les limites des preuves selon âge, fonction et génotype. Une recommandation européenne hors indication suisse se nomme explicitement et se discute dans un cadre spécialisé ; elle ne devient pas une prescription standard pour toute hématurie persistante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p>
</section>
<section class="ilot" id="n02-bridge-immuno"><h3>Relier la science à la décision</h3><p><b>Science → clinique.</b> L’IgA implique une maladie immune ; le collagène IV une anomalie structurale dont les lésions secondaires peuvent être trompeuses.</p><p><b>Science → examen.</b> Le diagnostic intègre histologie, données moléculaires et clinique ; une photographie PAS ne montre pas la fluorescence.</p><p><b>Science → traitement.</b> Traiter un mécanisme établi, respecter la formulation, les interactions et les limites suisses des combinaisons.</p><div class="key"><b>À retenir.</b> Un mécanisme plausible ne suffit pas à autoriser une prescription.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section></div></div></div>

<div class="panel" hidden="" id="pP"><div class="chap-body"><section class="ilot" id="n02-p-principes"><h2>Choisir un traitement après avoir identifié la maladie</h2><p>Une hématurie isolée n’a pas de traitement médicamenteux universel. L’objectif est de traiter une cause démontrée et de réduire un risque documenté. Le blocage rénine–angiotensine protège certains patients ayant une maladie glomérulaire ; les traitements spécifiques de l’IgA concernent une maladie établie, une population et un niveau de protéinurie définis. Aucun de ces produits ne remplace l’évaluation d’une rétention par caillots ou d’une glomérulonéphrite rapidement progressive.</p><p>Les doses ci-dessous viennent de cinq informations professionnelles suisses exactes effectivement consultées. Leurs indications ne recouvrent pas toutes les recommandations internationales. La dose maximale d’une indication ne se transpose pas à une autre. La durée d’une néphroprotection est habituellement prolongée et réévaluée ; elle n’est pas un traitement de quelques jours destiné à faire disparaître la bandelette.</p><p>Avant de débuter, préciser pression, état volémique, fonction rénale, potassium, traitements associés et projet de grossesse. Répéter les contrôles de sécurité après introduction et titration selon le produit et la situation. Le calendrier de suivi d’une maladie stable ne remplace pas cette surveillance rapprochée. Une aggravation clinique impose une réévaluation anticipée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section>
<section class="ilot" id="n02-p-ramipril"><h2>Ramipril Zentiva — distinguer néphropathie, hypertension et Alport</h2><p><b>FI suisse, décembre 2021 ; voie orale.</b> L’indication rénale du produit est une néphropathie glomérulaire avec protéinurie supérieure à 3 g/j. Le schéma de cette indication commence à 1,25 mg une fois par jour, avec doublement selon tolérance en deux à trois semaines ; son maximum est <b>5 mg/j</b>. La durée est décidée individuellement pour un traitement prolongé. Le schéma de l’hypertension commence à 2,5 mg/j et peut atteindre 10 mg/j : ce plafond différent ne doit pas être présenté comme celui de la néphropathie.</p><p>Pour une clairance entre 20 et 50 mL/min/1,73 m², la FI donne 1,25 mg/j au départ et 5 mg/j maximum. En dessous de 20 mL/min et en dialyse, l’expérience est insuffisante et ce point figure dans sa rubrique contre-indications. En atteinte hépatique, début sous surveillance stricte et maximum 2,5 mg/j. Corriger une déplétion hydrosodée et revoir les diurétiques avant l’instauration ; toute pause de diurétique se décide selon l’état clinique.</p><p>Antécédent d’angio-œdème, sténose artérielle rénale hémodynamiquement importante bilatérale ou sur rein unique et instabilité hémodynamique sont des obstacles majeurs. Ne pas associer au sacubitril/valsartan : intervalle d’au moins 36 heures dans les deux sens. Éviter un double blocage du système rénine–angiotensine ; vérifier aliskirène, sels de potassium, diurétiques épargneurs de potassium, AINS et lithium. Surveiller hypotension, créatinine, potassium et angio-œdème. Le ramipril ne doit pas être utilisé pendant la grossesse ; l’allaitement n’est pas recommandé avec ce produit.</p><p><b>Différence avec la recommandation européenne.</b> Le guide Alport privilégie le ramipril et propose chez l’enfant une dose initiale de 1 à 2 mg/m²/j, avec maximum de 6 mg/m²/j. Cette utilisation est hors indication suisse du produit consulté, dont la FI ne recommande pas l’emploi avant 18 ans. Ne pas convertir ce schéma spécialisé en dose adulte ni appliquer le plafond de l’hypertension à un enfant. Le moment du début dépend du génotype et de l’albuminurie, comme expliqué dans la clinique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a>.</p><p><button class="w" data-k="n02-calcul-dose">Comprendre la dose en mg/m²</button></p></section>
<section class="ilot" id="n02-p-cosaar"><h2>Cosaar — une alternative de blocage à indication suisse propre</h2><p><b>Losartan, FI avril 2025 ; voie orale.</b> L’indication rénale précise concerne les adultes avec diabète de type 2, hypertension, créatininémie élevée et rapport albumine/créatinine d’au moins 300 mg/g. La dose initiale est 50 mg une fois par jour ; selon la réponse tensionnelle, elle peut atteindre 100 mg une fois par jour. Chez une personne hypovolémique, envisager 25 mg/j au départ. L’utilisation antiprotéinurique d’une IgA ou d’Alport ne correspond pas à cette indication rénale spécifique : la nommer hors indication lorsqu’elle est proposée dans ce cadre.</p><p>La FI ne demande pas d’adaptation systématique chez le sujet âgé ou insuffisant rénal, y compris dialysé, mais recommande la prudence et un début réduit en insuffisance sévère, hypovolémie ou forte exposition diurétique. En atteinte hépatique, prévoir une dose réduite ; l’insuffisance hépatique sévère est contre-indiquée. Le produit ne devrait pas être utilisé chez l’enfant ou l’adolescent selon la FI retenue.</p><p>Vérifier angio-œdème antérieur, potassium, fonction rénale et état volémique. AINS, lithium et produits augmentant le potassium nécessitent une attention particulière ; le double blocage augmente hypotension, hyperkaliémie et insuffisance rénale. L’association à l’aliskirène est contre-indiquée chez les patients diabétiques ou insuffisants rénaux concernés par la FI. Le losartan ne s’ajoute pas au sparsentan.</p><p>La FI contre-indique les deuxième et troisième trimestres, déconseille le premier et exige l’arrêt dès qu’une grossesse est diagnostiquée. Un projet de grossesse conduit à choisir en amont une autre stratégie. La durée et la titration dépendent de la maladie, de la réponse et de la tolérance ; une hématurie persistante seule ne justifie pas de dépasser la dose recommandée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section>
<section class="ilot" id="n02-p-forxiga"><h2>Forxiga — protection de la maladie rénale chronique, avec limites suisses</h2><p><b>Dapagliflozine, FI août 2026 ; voie orale.</b> Pour la maladie rénale chronique de l’adulte, la dose recommandée est 10 mg une fois par jour, à tout moment et indépendamment des repas ; avaler le comprimé entier. Ce schéma n’est pas le début à 5 mg de certaines situations de diabète. La durée est prolongée selon bénéfice et tolérance. Dans l’indication rénale, il ne s’agit pas d’augmenter au-delà de 10 mg/j pour corriger une bandelette.</p><p>L’instauration n’est pas recommandée si le débit estimé est inférieur à 25 mL/min/1,73 m². Un traitement déjà commencé à 10 mg/j peut être poursuivi en dessous de ce seuil, selon la FI, jusqu’à la situation nécessitant dialyse ou transplantation. En atteinte hépatique légère ou modérée, pas d’ajustement ; si elle est sévère, commencer à 5 mg/j puis envisager 10 mg selon tolérance. La sécurité et l’efficacité de l’indication rénale ne se transposent pas à l’enfant.</p><p>La FI ne recommande pas le traitement de néphropathie sous immunosuppresseurs, après transplantation, en dialyse ou en polykystose faute de données suffisantes. Elle ne dispose pas d’expérience chez les patients non diabétiques sans albuminurie. Ces limites doivent être conservées lorsqu’on lit une recommandation internationale IgA ou Alport ; ne pas additionner automatiquement budésonide, sparsentan et dapagliflozine.</p><p>Évaluer hypovolémie et pression ; les diurétiques peuvent majorer déshydratation et hypotension. Rechercher une acidocétose devant nausées, douleurs abdominales, dyspnée ou altération générale, même sans forte hyperglycémie ; interrompre le traitement et évaluer rapidement en cas de suspicion. Les infections génitales, et une douleur périnéale fébrile évoquant une fasciite, demandent une évaluation adaptée. Le produit ne traite ni un diabète de type 1 ni une acidocétose.</p><p>Arrêter si possible au moins trois jours avant chirurgie lourde ou jeûne prolongé ; reprendre lorsque l’état est stable et l’alimentation orale rétablie. Une maladie aiguë grave peut également nécessiter une interruption. Surveiller le lithium si associé ; ajuster les traitements hypoglycémiants exposant à l’hypoglycémie selon le prescripteur. Arrêter dès grossesse diagnostiquée ; ne pas utiliser pendant l’allaitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a>.</p></section>
<section class="ilot" id="n02-p-filspari"><h2>Filspari — remplacer le blocage usuel, surveiller pression, potassium et foie</h2><p><b>Sparsentan, FI juin 2026 ; voie orale.</b> Indication : IgA primitive de l’adulte avec protéinurie d’au moins 1 g/j ou rapport protéines/créatinine d’au moins <b>0,75 g/g</b>. Débuter à 200 mg une fois par jour durant 14 jours, puis augmenter selon tolérance à 400 mg une fois par jour, dose d’entretien. Avaler entier avec de l’eau, avec ou sans repas. La FI ne fixe pas une cure limitée à neuf mois pour ce produit.</p><p>Le sparsentan bloque les récepteurs de l’endothéline et de l’angiotensine. KDIGO demande de ne pas l’associer à un autre bloqueur du système rénine–angiotensine. La FI contre-indique l’association aux antagonistes de l’angiotensine, de l’endothéline et aux inhibiteurs de rénine ; elle formule une prudence surveillée pour les IEC. Dans ce cours, la stratégie clinique retient le remplacement du blocage usuel et l’absence d’association à un IEC/ARA, en conservant cette différence de formulation entre guide et FI.</p><p>Pas d’ajustement rénal si débit au moins 30 mL/min/1,73 m² ; utilisation non recommandée en dessous de 30 ou pour débuter en dialyse. Prudence après transplantation. En atteinte hépatique A/B de Child-Pugh, pas d’ajustement pharmacocinétique mais prudence en B ; non recommandé en C. Ne pas débuter avec ASAT/ALAT supérieures à deux fois la limite supérieure de la normale. Doser aminotransférases et bilirubine avant traitement puis <b>tous les trois mois</b> selon cette FI.</p><p>Suivre pression, potassium, créatinine, œdèmes et signes hépatiques. Ne pas augmenter la dose si pression systolique au plus 100 mmHg ; une intolérance peut nécessiter adaptation des traitements associés, réduction ou interruption. En cas de potassium supérieur à 5,5 mmol/L, envisager l’arrêt. Une élévation hépatique significative persistante, un ictère ou l’association à une bilirubine supérieure à deux fois la normale exige la conduite d’arrêt décrite par la FI.</p><p>Éviter inhibiteurs puissants et inducteurs puissants du CYP3 A ainsi que pamplemousse ; surveiller les interactions avec médicaments à marge étroite. Les produits augmentant le potassium majorent le risque. Grossesse contre-indiquée : confirmer son absence avant de débuter et contraception efficace pendant le traitement puis un mois après l’arrêt. Ne pas utiliser pendant l’allaitement. Aucune donnée pédiatrique avant 18 ans ne permet de transposer le schéma.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a>.</p></section>
<section class="ilot" id="n02-p-kinpeygo"><h2>Kinpeygo — un budésonide à formulation spécifique</h2><p><b>Gélules à libération modifiée de 4 mg, FI juin 2026 ; voie orale.</b> Indication : IgA primitive adulte avec protéinurie d’au moins 1 g/j ou rapport protéines/créatinine d’au moins <b>0,8 g/g</b>. La dose recommandée est 16 mg une fois par jour le matin, au moins une heure avant le repas, pendant neuf mois initialement. Avaler les gélules entières ; ne pas ouvrir, écraser ni mâcher. Une autre présentation de budésonide n’est pas équivalente à cette formulation.</p><p>À l’arrêt, réduire à 8 mg une fois par jour pendant deux semaines ; le médecin peut ensuite prévoir 4 mg/j pendant deux semaines supplémentaires. Un nouveau traitement se discute individuellement. Le traitement n’est pas conçu comme une augmentation indéfinie au-delà de 16 mg/j. Pas de modification pharmacocinétique rénale attendue ; cela ne prouve pas une efficacité identique à tous les stades de maladie rénale.</p><p>Insuffisance hépatique C : contre-indication. En classe B, surveiller davantage hypercorticisme et suppression surrénalienne. Avant 18 ans, efficacité et sécurité ne sont pas établies. Surveiller infections, pression, glycémie, os, yeux et signes de suppression de l’axe surrénalien selon le contexte. Une exposition à la varicelle ou à la rougeole et un stress chirurgical nécessitent une discussion médicale ; une couverture glucocorticoïde systémique peut être requise en situation de stress.</p><p>Éviter les inhibiteurs puissants du CYP3 A4 ; si une association est incontournable, la FI prévoit une évaluation bénéfice–risque, un espacement et éventuellement une réduction à 8 mg/j. Éviter pamplemousse et jus ; les inducteurs enzymatiques peuvent réduire l’exposition. Attention aux médicaments dont le risque augmente lorsque le potassium baisse. La formulation ciblée ne supprime pas les effets glucocorticoïdes systémiques.</p><p>Éviter pendant la grossesse sauf nécessité clinique après évaluation des risques ; ne pas extrapoler les données du budésonide inhalé au produit oral. Pendant l’allaitement, choisir entre interruption de l’allaitement ou du traitement en tenant compte de leurs bénéfices. La surveillance et l’arrêt progressif font partie de la prescription, au même titre que la dose initiale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a>.</p></section>
<section class="ilot" id="n02-p-populations"><h2>Populations et contexte suisse : rendre les limites utilisables</h2><table class="t"><thead><tr><th>Situation</th><th>Décision à expliciter</th></tr></thead><tbody><tr><td>Enfant ou adolescent</td><td>Génétique et bilan pédiatrique ; schéma Alport européen hors indication ; pas transposition des nouveaux produits adultes.</td></tr><tr><td>Grossesse ou projet</td><td>Conseil préconceptionnel, adaptation des bloqueurs rénine–angiotensine ; grossesse contre-indiquée pour sparsentan.</td></tr><tr><td>Fonction rénale diminuée</td><td>Choisir le produit selon son seuil propre : 25 pour introduction dapagliflozine, 30 pour recommandation sparsentan ; ne pas les harmoniser.</td></tr><tr><td>Maladie hépatique</td><td>Ramipril maximum 2,5 mg/j ; sparsentan non recommandé en C ; Kinpeygo contre-indiqué en C ; règles distinctes.</td></tr><tr><td>Sujet âgé ou hypovolémique</td><td>Revoir pression, risque de chute, diurétiques et titration ; dose théorique maximale ne signifie pas dose tolérée.</td></tr><tr><td>Remboursement et autorisation</td><td>Indication FI et remboursement sont deux questions ; vérifier les conditions LS contemporaines pour la personne, sans promettre une prise en charge automatique.</td></tr></tbody></table><p>Le cours n’établit pas de déclaration OFSP propre à toute hématurie N02, ni de règle universelle Suva, AI ou d’aptitude à conduire. Ces décisions dépendent de la cause, du retentissement et du cadre individuel. Les FI signalent notamment les vertiges et l’hypotension : une personne symptomatique doit éviter la conduite tant que ces symptômes persistent et demander conseil. La correspondance avec PROFILES sert la formation ; elle ne constitue pas une certification de capacité professionnelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">CH-MEBEKO — Introduction et§2.1</a>.</p></section>
