rk="1"]{left:28%;top:46%}[data-n02-figure="crescent"] [data-n02-mark="2"]{left:38%;top:80%}[data-n02-figure="crescent"] [data-n02-mark="3"]{left:47%;top:42%}[data-n02-figure="sediment"] [data-n02-mark="1"]{left:24%;top:19%}[data-n02-figure="sediment"] [data-n02-mark="2"]{left:74%;top:20%}[data-n02-figure="sediment"] [data-n02-mark="3"]{left:25%;top:71%}[data-n02-figure="sediment"] [data-n02-mark="4"]{left:77%;top:75%}[data-n02-figure="kidney"] [data-n02-mark="1"]{left:23%;top:39%}[data-n02-figure="kidney"] [data-n02-mark="2"]{left:46%;top:31%}[data-n02-figure="kidney"] [data-n02-mark="3"]{left:65%;top:61%}[data-n02-figure="kidney"] [data-n02-mark="4"]{left:87%;top:87%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#n02-1">Définition</a></li><li><a href="#n02-2">Épidémiologie</a></li><li><a href="#n02-3">Physiopathologie</a></li><li><a href="#n02-4">Démarche clinique</a></li><li><a href="#n02-5">Anamnèse</a></li><li><a href="#n02-6">Examen clinique</a></li><li><a href="#n02-7">Syndromes</a></li><li><a href="#n02-8">Diagnostic positif</a></li><li><a href="#n02-9">Explorations</a></li><li><a href="#n02-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#n02-11">Prise en charge</a></li><li><a href="#n02-12">Prévention, suivi et pronostic</a></li><li><a href="#n02-13">Points clés</a></li><li><a href="#n02-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="N02"><section class="ilot" id="n02-question"><h2>Des urines anormales, une personne qui se sent bien</h2><p><b>Vignette fictive.</b> Une jeune adulte consulte après trois examens urinaires positifs pour le sang en six mois. Elle n’a ni brûlure, ni douleur, ni sang visible. Sa mère rapporte les mêmes résultats depuis longtemps. La pression artérielle et la créatinine sont normales ; le rapport albumine/créatinine n’a pas encore été mesuré. Faut-il rassurer définitivement, demander un scanner ou prescrire un corticoïde ?</p><p>Aucune de ces décisions ne découle de la seule bandelette. Il faut confirmer les hématies, examiner leur morphologie, mesurer l’albuminurie, reconstituer l’histoire familiale et rechercher les signaux de gravité. Une atteinte liée au collagène IV est possible, mais une histoire familiale ne prouve pas son mécanisme. Le bilan doit donner une explication et un plan de suivi proportionné, sans transformer une anomalie isolée en maladie rapidement progressive.</p><div class="key"><b>À retenir.</b> Confirmer le sang, localiser son origine, apprécier le risque, puis choisir les examens utiles.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p></section>
<section class="ilot" id="n02-1"><h2>1. Définition : un phénotype, plusieurs maladies</h2><p>L’hématurie correspond à la présence d’érythrocytes dans l’urine. Elle est macroscopique si le sang est visible et microscopique s’il est détecté par analyse. La bandelette réagit aussi à l’hémoglobine et à la myoglobine : une réaction positive n’est donc pas, à elle seule, la preuve d’érythrocytes urinaires. Le résultat se confirme par une mesure cellulaire et, lorsque l’origine rénale est discutée, par l’examen du sédiment.</p><p><b>Récidivante</b> décrit des épisodes séparés ; <b>persistante</b> décrit une anomalie retrouvée sur plusieurs prélèvements. Les définitions temporelles varient selon le contexte. Le guide européen Alport utilise au moins deux prélèvements sur six à douze mois ; l’approche européenne pédiatrique recherche la persistance sur trois à cinq examens en trois à six mois. Ces durées organisent l’évaluation d’une personne stable : elles ne justifient jamais d’attendre devant une insuffisance rénale, une protéinurie importante ou des signes systémiques.</p><p>Une hématurie est dite <b>isolée</b> lorsque ne s’y associent ni protéinurie/albuminurie pathologique, ni hypertension, ni altération de la fonction rénale, ni manifestation systémique évocatrice. Cette qualification nécessite de mesurer ces paramètres ; « sans douleur » ne signifie pas « isolée ». Le présent cours traite surtout le phénotype glomérulaire récurrent ou persistant, ses causes IgA et collagène IV, et les exclusions urologiques nécessaires.</p><p>La catégorie administrative N02 ne doit être attribuée qu’après le raisonnement clinique. Dans la CIM-10-GM suisse consultée, elle exclut l’hématurie sans autre indication R31 et le syndrome douleur lombaire–hématurie N39.81. Les sous-catégories morphologiques ne se déduisent pas d’une bandelette : les qualificatifs .0 à .8 reposent normalement sur une preuve histologique. Le mot historique « bénigne » conservé dans certains libellés n’est pas une garantie pronostique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">CH-CIM — XML :N02,N00–N08,modificateurS14 N00_4 .0–.9</a>.</p><p><button class="w" data-k="n02-exp-1">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-1">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-2"><h2>2. Épidémiologie et populations à risque</h2><p>La fréquence observée de la microhématurie dépend du seuil utilisé, de l’âge, du dépistage, du nombre de prélèvements et des causes transitoires exclues. Les séries de population, de consultations et de biopsies ne mesurent pas le même phénomène. Les sources retenues ne fournissent pas une incidence suisse fiable de la catégorie clinique N02 : aucun chiffre national n’est extrapolé à partir d’une cohorte étrangère.</p><p>Chez les enfants et les jeunes adultes ayant une microhématurie glomérulaire persistante, les maladies liées à COL4 A3, COL4 A4 ou COL4 A5 et la néphropathie à IgA occupent une place importante dans le diagnostic différentiel. Une variante hétérozygote de COL4 A3 ou COL4 A4 peut être fréquente dans la population, mais sa présence ne signifie pas que toute personne développera une insuffisance rénale. Les familles adressées en centre spécialisé enrichissent les séries en phénotypes sévères.</p><p>Chez l’adulte plus âgé, le tabac, l’antécédent d’hématurie visible, certaines expositions professionnelles, une irradiation pelvienne ou le cyclophosphamide augmentent le poids d’une cause urothéliale. Une origine glomérulaire probable ne rend pas cette seconde hypothèse impossible. L’évaluation combine la probabilité de maladie rénale et le risque urologique au lieu d’appliquer le même scanner à tous les âges.</p><p>Le contexte familial change la démarche : insuffisance rénale inexpliquée, dialyse, surdité ou anomalies oculaires chez des apparentés orientent vers le collagène IV. L’absence de ces signes ne l’exclut pas, en raison d’une expression variable et de manifestations parfois tardives. L’histoire doit donc préciser les âges et les diagnostics, pas seulement recueillir « maladie rénale dans la famille ».</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a>.</p><p><button class="w" data-k="n02-exp-2">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-2">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-3"><h2>3. Physiopathologie : du filtre au signe urinaire</h2><p>Le filtre glomérulaire associe endothélium capillaire, membrane basale et podocytes. Une atteinte de ce dispositif peut laisser passer des érythrocytes et des protéines dans l’espace urinaire. La morphologie érythrocytaire se modifie au cours de ce passage et du trajet urinaire ; des acanthocytes ou des cylindres érythrocytaires orientent vers une origine glomérulaire. Leur absence dans un prélèvement ne suffit pas à exclure cette origine.</p><p>Dans les maladies liées au collagène IV, une anomalie génétique altère une composante structurale de la membrane basale glomérulaire. Selon le génotype et le stade, l’aspect peut être aminci, irrégulier ou lamellé. Le défaut structural explique l’hématurie précoce ; l’apparition d’albuminurie, la perte podocytaire et les lésions secondaires de sclérose annoncent un risque plus important. Une lésion de sclérose segmentaire secondaire ne transforme pas cette maladie en indication automatique d’immunosuppression.</p><p>Dans la néphropathie à IgA, les dépôts glomérulaires d’IgA définissent une maladie immunologique dont la démonstration nécessite une biopsie. Des épisodes visibles proches d’une infection respiratoire sont évocateurs, mais ne constituent pas un test diagnostique. Le risque évolutif se lit surtout dans la protéinurie et la trajectoire du débit de filtration, avec les données histologiques et cliniques.</p><p>Un saignement issu des voies excrétrices rejoint l’urine après le filtre. Calcul, infection, tumeur ou autre lésion peuvent donc donner une hématurie sans anomalie primitive de la membrane basale. La distinction physiopathologique guide le choix entre analyse glomérulaire, génétique, biopsie et exploration urologique ; elle n’autorise pas à négliger une cause concomitante.</p><figure data-n02-figure="podocytes"><div data-n02-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n02/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n02-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p><p><button class="w" data-k="n02-exp-3">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-3">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-4"><h2>4. Démarche clinique : décider du délai avant de multiplier les tests</h2><p><b>Première étape : rechercher une complication.</b> Une baisse rapide de fonction rénale, une oligurie, une dyspnée avec suspicion de surcharge ou d’hémorragie pulmonaire, une hypertension sévère avec retentissement, ou un saignement visible mal toléré imposent une évaluation urgente. Des caillots avec impossibilité d’uriner font rechercher une rétention. Ces tableaux sortent de la surveillance d’une microhématurie isolée.</p><p><b>Deuxième étape : valider le prélèvement.</b> Vérifier règles, contamination génitale, infection, exercice intense récent, traumatisme, couleur des urines et médicaments. Une cause transitoire plausible se traite ou disparaît puis le contrôle est organisé ; l’anomalie persistante ne doit pas rester attribuée indéfiniment à cet épisode. Sous anticoagulant, rechercher la source du saignement au lieu d’en faire une explication suffisante.</p><p><b>Troisième étape : établir le profil.</b> Mesurer pression artérielle, créatinine avec débit estimé, albuminurie et/ou protéinurie quantitatives ; examiner le sédiment. La stratégie HUG propose de confirmer une origine glomérulaire sur un second prélèvement à plus d’une semaine chez la personne stable, puis un avis néphrologique. Albuminurie, hypertension, baisse du débit ou manifestations systémiques renforcent le besoin d’évaluation ; la vitesse de dégradation détermine l’urgence.</p><p><b>Quatrième étape : choisir une filière.</b> Chez le jeune sans signe de gravité, histoire familiale, échographie et génétique peuvent précéder une biopsie. Une présentation active avec protéinurie ou insuffisance rénale nécessite un bilan néphrologique plus rapide. Chez l’adulte à risque urothélial, intégrer l’urologie même si des indices glomérulaires sont présents. Expliquer au patient ce qui est établi, ce qui reste hypothétique et la date du prochain contrôle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a>.</p><p><button class="w" data-k="n02-exp-4">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-4">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-5"><h2>5. Anamnèse analytique</h2><table class="t"><thead><tr><th>Domaine</th><th>Questions utiles</th><th>Ce que la réponse change</th></tr></thead><tbody><tr><td>Chronologie</td><td>Premier résultat, nombre de contrôles, épisodes visibles, intervalle avec infection ou effort</td><td>Distinguer transitoire, récurrent et persistant ; rapprocher les résultats de la fonction rénale.</td></tr><tr><td>Saignement</td><td>Couleur, caillots, moment dans la miction, douleur, règles ou saignement génital</td><td>Confirmer l’origine urinaire ; les caillots orientent vers une source urologique.</td></tr><tr><td>Voies urinaires</td><td>Brûlures, pollakiurie, fièvre, colique, traumatisme, geste récent</td><td>Chercher infection, calcul ou lésion ; recontrôler après résolution.</td></tr><tr><td>Retentissement rénal</td><td>Œdèmes, baisse du volume urinaire, pression connue, créatinine antérieure</td><td>Repérer un syndrome néphritique et la trajectoire.</td></tr><tr><td>Manifestations systémiques</td><td>Purpura, arthralgies, symptômes respiratoires, atteinte générale</td><td>Discuter vascularite, lupus ou autre maladie systémique ; urgence si atteinte d’organe.</td></tr><tr><td>Famille</td><td>Hématurie, insuffisance rénale, âge de dialyse, audition, yeux, consanguinité</td><td>Établir un arbre familial et orienter COL4 A3/4/5.</td></tr><tr><td>Expositions</td><td>Tabac quantifié, irradiation pelvienne, cyclophosphamide, produits professionnels, voyages pertinents</td><td>Estimer le risque urologique et les diagnostics spécifiques.</td></tr><tr><td>Traitements et projet de grossesse</td><td>Anticoagulants, anti-inflammatoires, bloqueurs du système rénine–angiotensine, compléments</td><td>Évaluer effets indésirables, interactions et traitements à adapter.</td></tr></tbody></table><p>Un épisode d’urines foncées pendant une infection peut orienter vers une néphropathie à IgA ; il ne prouve ni l’IgA ni une maladie postinfectieuse. Demander les comptes rendus antérieurs et leurs dates est plus utile que retenir un délai approximatif reconstruit plusieurs années après. Une maladie familiale dite « bénigne » mérite une reformulation prudente lorsque l’on découvre une albuminurie ou une baisse de fonction.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a>.</p><p><button class="w" data-k="n02-exp-5">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-5">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-6"><h2>6. Examen clinique : chercher le retentissement et les indices extrarénaux</h2><p>Mesurer la pression dans des conditions adaptées, rechercher les valeurs antérieures et répéter une mesure inattendue. Chez l’enfant, interpréter avec les références pédiatriques ; le seuil et l’objectif d’un adulte ne se transposent pas. Évaluer poids, œdèmes, état d’hydratation et signes de surcharge. Une pression normale et l’absence d’œdèmes n’excluent pas une atteinte glomérulaire débutante.</p><p>Examiner abdomen et régions lombaires selon les symptômes ; une douleur, une masse ou une rétention orientent mais ne remplacent pas l’imagerie. Inspecter la peau lorsqu’un purpura ou une maladie systémique est évoqué, rechercher les signes articulaires et respiratoires associés. Une dyspnée, une désaturation ou une altération générale imposent de sortir du simple bilan ambulatoire.</p><p>Dans un contexte de collagène IV, rechercher les plaintes auditives et visuelles, puis organiser les examens spécialisés selon génotype et âge. Un entretien sans plainte auditive n’équivaut pas à une audiométrie normale. L’examen ophtalmologique de référence et son suivi sont adaptés au risque ; les porteurs hétérozygotes COL4 A3/4 n’ont pas le même calendrier que les garçons avec forme liée à l’X ou les formes récessives.</p><p>Conclure l’examen par une synthèse : état stable ou instable, signes de rétention/surcharge, pression, manifestations extrarénales et limites de l’examen. Une consultation clinique rassurante n’annule pas une albuminurie quantitative ou une créatinine qui augmente.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a>.</p><p><button class="w" data-k="n02-exp-6">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-6">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-7"><h2>7. Syndromes et classifications utiles</h2><table class="t"><thead><tr><th>Profil</th><th>Éléments</th><th>Décision structurante</th></tr></thead><tbody><tr><td>Microhématurie glomérulaire isolée</td><td>Persistance confirmée, sans albuminurie/protéinurie, hypertension ni baisse du débit</td><td>Avis néphrologique, histoire familiale, échographie ; génétique selon contexte ; suivi.</td></tr><tr><td>Hématurie avec albuminurie ou protéinurie</td><td>Atteinte de filtration plus étendue ; risque évolutif supérieur selon cause</td><td>Quantifier, suivre et discuter biopsie ou génétique ; néphroprotection adaptée.</td></tr><tr><td>Syndrome néphritique</td><td>Hématurie avec retentissement rénal, pression/œdèmes et parfois baisse rapide du débit</td><td>Évaluation accélérée ou urgente, bilan étiologique et biopsie selon tableau.</td></tr><tr><td>Épisodes macroscopiques récurrents</td><td>Infections associées possibles, douleur/caillots ou non</td><td>Confirmer l’origine ; IgA n’est qu’une hypothèse avant biopsie ; surveiller fonction.</td></tr><tr><td>Phénotype collagène IV</td><td>Famille, hématurie persistante, audition/yeux ou anomalie génétique</td><td>Distinguer lié à X, autosomique récessif et hétérozygotie ; conseil familial.</td></tr><tr><td>Profil urologique</td><td>Hématies plutôt non glomérulaires, caillots, symptômes ou facteurs de risque</td><td>Échographie, cystoscopie et/ou imagerie en coupe selon risque et âge.</td></tr></tbody></table><p>La classification génétique Alport distingue COL4 A5 lié à l’X, variants bialléliques COL4 A3/4 et variants hétérozygotes COL4 A3/4. Les risques et le moment de début du traitement ne sont pas identiques. Dans l’IgA biopsiée, MEST-C décrit des lésions histologiques ; ce n’est ni un score clinique de bandelette ni un déclencheur autonome de corticoïdes. Les cylindres ou un croissant isolé ne suffisent pas non plus à définir une progression rapide.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a>.</p><p><button class="w" data-k="n02-exp-7">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-7">▲ Loi de Pareto — Le raisonnement essentiel</button></section>

<section class="ilot" id="n02-8"><h2>8. Diagnostic positif : distinguer le signe et sa cause</h2><p>La première preuve est la présence d’érythrocytes dans un échantillon correctement recueilli. Les seuils ne sont pas universels : les HUG retiennent un seuil physiologique local de 26 millions/L, soit 26/µL, approximativement cinq hématies par champ ; le manuel français CUEN emploie au moins 10/µL. Le nombre par champ dépend de la préparation et de la méthode. Utiliser la référence du laboratoire et écrire l’unité évite de transformer une divergence technique en contradiction clinique.</p><p>L’origine glomérulaire est soutenue par des hématies dysmorphiques, particulièrement des acanthocytes, et des cylindres érythrocytaires. La stratégie HUG cite plus de 60 % de dysmorphie ou plus de 5 % d’acanthocytes ; la recommandation européenne pour jeunes utilise également le repère d’environ 5 % d’acanthocytes. Ces résultats dépendent de l’expertise et du prélèvement : un sédiment peu contributif ne ferme pas le dossier si les autres indices persistent.</p><p>La cause nécessite une preuve distincte. <b>L’IgA est un diagnostic de biopsie</b> : le dosage sanguin d’IgA ne le remplace pas. Chez l’adulte, KDIGO 2025 propose de considérer la biopsie lorsqu’une IgA est possible et que la protéinurie atteint au moins 0,5 g/j, si le geste est réalisable. Une suspicion de collagène IV conduit à une analyse adaptée des trois gènes ; une variante de signification incertaine ne suffit pas à établir un diagnostic moléculaire.</p><p>Un résultat génétique doit être confronté au phénotype et à la famille. Une variante hétérozygote COL4 A3/4 peut ne pas expliquer une évolution inhabituellement sévère ; une maladie surajoutée est possible. Inversement, un panel négatif ne rend pas toute maladie génétique impossible. La biopsie peut être utile devant une évolution atypique, une insuffisance aiguë ou un syndrome néphrotique inattendu.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p><p><button class="w" data-k="n02-exp-8">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-8">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-9"><h2>9. Explorations : une question avant chaque prescription</h2><p>Le bilan initial associe confirmation urinaire, sédiment, quantification de l’albuminurie/protéinurie, créatinine et estimation du débit, pression artérielle et échographie selon le contexte. Les HUG proposent notamment numération, électrolytes, albumine et marqueurs orientés par la présentation. Un panel immunologique large n’est pas un réflexe nécessaire pour toute hématurie isolée ; il devient pertinent si le tableau suggère une maladie systémique ou une glomérulonéphrite active.</p><p>Le rapport albumine/créatinine mesure la composante albuminurique ; le rapport protéines/créatinine mesure les protéines totales. Ils ne sont pas interchangeables. Un prélèvement du matin facilite l’interprétation chez le jeune et aide à examiner une composante orthostatique. Une hématurie visible peut augmenter la protéinurie mesurée par apport de sang : recontrôler sur urines claires pour apprécier la protéinurie rénale persistante, sans différer la prise en charge d’un tableau grave.</p><p>L’échographie explore rein, voies excrétrices et vessie sans irradiation. Chez l’enfant ou le jeune avec microhématurie isolée, elle est la première imagerie ; scanner et cystoscopie systématiques sont inappropriés. Chez l’adulte à risque urothélial, l’échographie ne remplace pas toujours la cystoscopie ou l’imagerie multiphasique. Les indications de contraste dépendent de la question, de la fonction rénale, de la grossesse et des contre-indications propres à chaque technique.</p><p>Biopsie et génétique répondent à des questions différentes. Le tissu décrit activité, chronicité et dépôts ; la génétique peut établir une maladie héréditaire, organiser le conseil familial et éviter certaines biopsies. Le choix dépend de la probabilité, de l’urgence, de la présentation et de l’impact attendu sur la conduite. Une variante découverte n’efface pas un signe discordant qui exige une autre investigation.</p><figure data-n02-figure="sediment"><div data-n02-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n02/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span><span aria-hidden="true" data-n02-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n02-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p><p><button class="w" data-k="n02-exp-9">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-9">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-10"><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Bandelette positive :</b> confirmer les hématies ; si elles manquent, envisager hémoglobinurie, myoglobinurie ou interférence, selon clinique et prélèvement.</li><li><b>Cause transitoire plausible :</b> infection, contamination menstruelle, effort ou geste ; traiter/écarter puis programmer un contrôle. Une persistance rouvre l’évaluation.</li><li><b>Gravité présente :</b> baisse rapide du débit, oligurie, signes systémiques, surcharge, saignement mal toléré ou rétention → évaluation urgente adaptée, sans délai de confirmation prolongé.</li><li><b>Indices glomérulaires :</b> sédiment, albuminurie, pression et fonction ; avis néphrologique. Famille/jeune isolé → collagène IV et stratégie génétique ; protéinurie ou activité → discuter biopsie, IgA et maladies inflammatoires.</li><li><b>Indices urologiques ou risque tumoral :</b> explorer selon âge et risque. Une hématurie sous anticoagulant et une anomalie rénale concomitante n’excluent pas une lésion urothéliale.</li><li><b>Bilan initial non concluant :</b> suivi daté, réévaluation de la persistance et des nouveaux signes ; ne pas conclure à une bénignité permanente.</li></ol><table class="t"><thead><tr><th>Hypothèse</th><th>Arguments</th><th>Limite décisive</th></tr></thead><tbody><tr><td>IgA</td><td>Épisodes proches d’infections, protéinurie, hématurie glomérulaire</td><td>Biopsie nécessaire ; IgA sanguine et chronologie ne prouvent pas.</td></tr><tr><td>Collagène IV</td><td>Famille, persistance jeune, audition/yeux, membrane basale anormale</td><td>Triade souvent incomplète ; variant incertain non diagnostique.</td></tr><tr><td>GN systémique ou rapidement progressive</td><td>Créatinine en hausse, protéinurie, manifestations extrarénales</td><td>Le traitement urgent dépend de la cause ; ne pas rester dans N02 isolé.</td></tr><tr><td>Infection, calcul, tumeur</td><td>Symptômes urinaires, colique, caillots ou facteurs de risque</td><td>Une absence de douleur ne rassure pas contre une tumeur.</td></tr><tr><td>Pigment sans hématies</td><td>Bandelette positive, absence d’érythrocytes confirmée</td><td>Chercher hémoglobine/myoglobine et contexte ; une urine rouge peut aussi être non hémique.</td></tr></tbody></table><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p><p><button class="w" data-k="n02-exp-10">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-10">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-11"><h2>11. Prise en charge : traiter le risque démontré</h2><p><b>Hématurie isolée.</b> Il n’existe pas de prescription anti-inflammatoire ou immunosuppressive justifiée par la seule présence d’hématies. Expliquer le résultat, documenter une base de pression/fonction/protéines et organiser le suivi. Traiter une infection ou un calcul lorsqu’ils sont établis ; rechercher une lésion urologique selon risque. Les mesures générales incluent arrêt du tabac et contrôle des facteurs rénaux et cardiovasculaires pertinents.</p><p><b>Maladie du collagène IV.</b> Le blocage du système rénine–angiotensine est la base de néphroprotection. ERKNet/ERA/ESPN recommande de le débuter et titrer à la dose maximale tolérée dès la microalbuminurie, quel que soit le sous-type. Chez les garçons/mâles avec forme liée à l’X et dans les formes autosomiques récessives, un début après deux ans peut être proposé dès l’hématurie. En revanche, chez les femmes avec forme liée à l’X et les hétérozygotes COL4 A3/4, l’hématurie isolée seule ne justifie pas ce début précoce. Ces distinctions empêchent de prescrire le même traitement à toute famille.</p><p>Les schémas pédiatriques européens et les indications Alport sont distincts des autorisations et doses des produits suisses. Le ramipril pédiatrique proposé dans le guide est hors indication suisse du produit relu ; le suivi spécialisé surveille pression, fonction rénale et potassium. Un inhibiteur SGLT2 peut être discuté chez certains adultes avec maladie rénale et albuminurie persistante, sur preuves limitées dans Alport ; il ne se transpose ni à l’enfant ni à une microhématurie isolée avec fonction normale.</p><p><b>IgA confirmée.</b> KDIGO 2025 vise une protéinurie inférieure à 0,5 g/j, idéalement inférieure à 0,3 g/j, et la préservation du débit. Les mesures de mode de vie comprennent apport sodé inférieur à 2 g/j de sodium, soit environ 5 g de sel, activité et contrôle pondéral adaptés, arrêt du tabac. Le blocage rénine–angiotensine est utilisé à dose tolérée sauf contre-indication. La cible tensionnelle adulte proposée ≤ 120/70 mmHg exige une mesure fiable et une tolérance clinique ; elle n’est pas une cible pédiatrique universelle.</p><p>Chez les personnes à risque de progression, des traitements visant la production d’IgA pathogène ou les conséquences de l’atteinte néphronique peuvent être discutés. La prescription suisse doit respecter les FI exactes : Kinpeygo est un budésonide à libération modifiée propre à l’IgA ; Filspari est le sparsentan, qui remplace le blocage rénine–angiotensine usuel et ne s’y ajoute pas. Forxiga a une indication de maladie rénale chronique, mais sa FI déconseille l’utilisation chez les patients recevant des immunosuppresseurs : une recommandation générale de combinaison ne gomme pas cette limite suisse.</p><p><b>Formes particulières.</b> Une insuffisance aiguë pendant une hématurie macroscopique nécessite soutien et réévaluation ; KDIGO propose de considérer une nouvelle biopsie si la fonction ne s’améliore pas dans les deux semaines après disparition du sang visible. Une IgA rapidement progressive, définie dans ce cadre par une chute d’au moins 50 % du débit en trois mois au plus après exclusions, exige biopsie et traitement spécialisé ; des croissants seuls ne suffisent pas à ce diagnostic. Les corticoïdes systémiques et cytotoxiques ne sont pas un traitement empirique de N02.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p><p><button class="w" data-k="n02-exp-11">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-11">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-12"><h2>12. Prévention, suivi et pronostic</h2><p>Le suivi surveille une trajectoire, pas seulement la disparition du sang. Documenter pression, albuminurie/protéinurie, créatinine/débit, épisodes visibles, symptômes extrarénaux et tolérance thérapeutique. Une augmentation des protéines, une hypertension nouvelle ou une baisse de fonction change la catégorie de risque et le rythme des consultations. Le patient doit savoir qui contacter et quels signes imposent une consultation anticipée.</p><p>Pour les adultes asymptomatiques hétérozygotes COL4 A3/4, le guide européen suggère un dépistage urinaire tous les un à deux ans et une pression au moins annuelle, adapté à l’histoire familiale. Lorsque l’albuminurie dépasse 30 mg/g sur deux prélèvements et qu’un traitement rénine–angiotensine est instauré, le débit et l’albuminurie sont suivis en général tous les six à douze mois, plus souvent selon stade et évolution. Ce calendrier de maladie stable n’est pas celui des contrôles de sécurité juste après une introduction ou une augmentation de médicament.</p><p>L’audition est surveillée plus étroitement dans les formes liées à l’X chez le garçon et les formes récessives : le guide propose un début vers quatre ans, annuel durant l’enfance puis espacé chez l’adulte. Les femmes liées à l’X et les hétérozygotes COL4 A3/4 ont des besoins différents ; pour ces derniers, l’examen auditif est surtout guidé par les symptômes. L’ophtalmologie de référence et les contrôles sont individualisés. Le conseil génétique aborde transmission, apparentés, reproduction et implications d’un éventuel don de rein ; un apparenté porteur n’est pas présumé donneur sans risque.</p><p>Dans l’IgA, protéinurie et débit sont les repères pronostiques centraux. L’outil international de prédiction après biopsie estime un risque de déclin fonctionnel ou d’insuffisance rénale ; il ne calcule pas le bénéfice individuel d’un médicament et n’est pas validé pour une hématurie sans biopsie. Dans les maladies du collagène IV, le génotype, le sexe dans les formes liées à l’X, l’albuminurie et la trajectoire familiale modulent le risque. Le terme « familial bénin » doit être abandonné comme promesse définitive.</p><p>Après un bilan urologique négatif chez l’adulte, les HUG proposent un contrôle urinaire à douze mois, ou six mois dans certaines situations à faible risque explorées par échographie seule. L’arrêt éventuel de ce suivi est conditionnel ; hématurie persistante/récidivante, nouvel épisode visible ou nouveaux symptômes justifient une nouvelle discussion. Cela ne remplace pas le suivi d’une maladie glomérulaire confirmée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a>.</p><p><button class="w" data-k="n02-exp-12">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-12">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-13"><h2>13. Points clés et entraînement clinique</h2><ul><li>La bandelette détecte l’hème ; la présence de globules rouges doit être confirmée.</li><li>« Isolée » suppose pression, fonction et protéines évaluées, pas seulement absence de douleur.</li><li>Le sédiment oriente le compartiment ; il ne nomme pas seul l’étiologie.</li><li>IgA nécessite une biopsie ; collagène IV demande une interprétation génétique et clinique.</li><li>Une fonction qui baisse ou un syndrome systémique interdit d’attendre plusieurs mois.</li><li>Les calendriers, seuils et doses dépendent de l’âge, du génotype, de la méthode et du produit.</li></ul><p>Les exercices ci-dessous sont originaux et fictifs. Le rapprochement pédagogique avec PROFILES 2017 concerne notamment l’hématurie (SSP64), les anomalies histologiques/génétiques (SSP159), la fonction rénale (SSP161), le sédiment urinaire (SSP164) et la protéinurie (SSP173). Les exigences MEBEKO lues concernent l’examen 2026. Il ne s’agit ni d’un mapping officiel CIM–PROFILES ni de questions fédérales reproduites.</p><p><button class="w" data-k="n02-cas-1">Cas clinique 1 — raisonner avant de traiter</button></p><p><button class="w" data-k="n02-cas-2">Cas clinique 2 — raisonner avant de traiter</button></p><p><button class="w" data-k="n02-cas-3">Cas clinique 3 — raisonner avant de traiter</button></p><p><button class="w" data-k="n02-cas-4">Cas clinique 4 — raisonner avant de traiter</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CH-PROFILES — pp.29,32 :SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">CH-MEBEKO — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p><p><button class="w" data-k="n02-exp-13">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-13">▲ Loi de Pareto — Le raisonnement essentiel</button><div class="quiz ui"><p>Bandelette sang positive : IgA certaine ?</p><button data-ok="1">Non : confirmer les hématies et leur origine.</button><button data-ok="0">Oui : la bandelette identifie les dépôts.</button><p class="fb" hidden="">Le test détecte l’hème ; le diagnostic d’IgA exige une biopsie.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a>.</p><div class="quiz ui"><p>Une surdité absente exclut-elle COL4 A3/4/5 ?</p><button data-ok="1">Non : le phénotype varie selon gène, âge et sexe.</button><button data-ok="0">Oui : la triade est toujours complète.</button><p class="fb" hidden="">L’histoire et les paramètres rénaux restent utiles même sans signe auditif.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p><div class="quiz ui"><p>Filspari s’ajoute-t-il au losartan ?</p><button data-ok="1">Non : il remplace le blocage usuel.</button><button data-ok="0">Oui : le double blocage est toujours préférable.</button><p class="fb" hidden="">La FI contre-indique l’association aux ARA ; KDIGO évite aussi l’association aux IEC.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p><div class="quiz ui"><p>60 mg/L d’albumine et 1 g/L de créatinine : quel rapport ?</p><button data-ok="1">60 mg/g.</button><button data-ok="0">60 g/j.</button><p class="fb" hidden="">Diviser les concentrations du même prélèvement ; les litres s’annulent, pas les unités des analytes.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a>.</p></section>
<section class="ilot" id="n02-14"><h2>14. Pièges à éviter</h2><table class="t"><thead><tr><th>Raccourci trompeur</th><th>Correction</th></tr></thead><tbody><tr><td>Bandelette positive = hématurie glomérulaire</td><td>Confirmer les cellules puis rechercher les indices d’origine.</td></tr><tr><td>Urines rouges = gravité proportionnelle à la couleur</td><td>Évaluer tolérance, rétention et fonction ; la couleur ne quantifie pas le risque.</td></tr><tr><td>Anticoagulant = cause suffisante</td><td>Le traitement peut révéler un saignement ; rechercher sa source.</td></tr><tr><td>Hématurie familiale = bénigne</td><td>Mesurer protéines et fonction, discuter collagène IV et suivi.</td></tr><tr><td>IgA sérique élevée = IgA rénale</td><td>La biopsie établit le diagnostic ; les causes secondaires sont recherchées.</td></tr><tr><td>Panel génétique négatif = aucun risque héréditaire</td><td>Sensibilité et interprétation ont des limites ; réexaminer le phénotype.</td></tr><tr><td>Tout croissant = progression rapide</td><td>L’évolution fonctionnelle et les exclusions sont nécessaires.</td></tr><tr><td>Plus de médicaments = meilleure néphroprotection</td><td>Éviter double blocage ; respecter interactions et FI, notamment immunosuppression/SGLT2.</td></tr><tr><td>Budésonide = aucun effet systémique</td><td>Surveiller infection, axe surrénalien et effets glucocorticoïdes.</td></tr><tr><td>Un seuil français, suisse ou pédiatrique vaut partout</td><td>Citer population, laboratoire, unité et source.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Une surveillance explicite est une prise en charge ; une absence de plan ne l’est pas.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p><p><button class="w" data-k="n02-exp-14">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n02-14">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n02-annexe-cim"><h2>Après la conclusion clinique : sous-codes morphologiques</h2><p>Le diagnostic clinique précède le codage. Les suffixes ci-dessous sont ceux du modificateur morphologique OFS appliqué à N02. Ils ne représentent ni dix stades cliniques ni dix prescriptions. Les suffixes .0 à .8 nécessitent normalement une identification précise par biopsie ou autopsie. Un variant COL4 ou une IgA soupçonnée ne permettent pas d’inventer une morphologie.</p><table class="t"><thead><tr><th>Sous-code</th><th>Libellé morphologique OFS</th></tr></thead><tbody><tr><td>N02.0</td><td>Anomalies glomérulaires mineures</td></tr><tr><td>N02.1</td><td>Lésions glomérulaires segmentaires et focales</td></tr><tr><td>N02.2</td><td>Glomérulonéphrite membraneuse diffuse</td></tr><tr><td>N02.3</td><td>Glomérulonéphrite mésangio-proliférative diffuse</td></tr><tr><td>N02.4</td><td>Glomérulonéphrite proliférative endocapillaire diffuse</td></tr><tr><td>N02.5</td><td>Glomérulonéphrite mésangiocapillaire diffuse</td></tr><tr><td>N02.6</td><td>Maladie à dépôt dense</td></tr><tr><td>N02.7</td><td>Glomérulonéphrite diffuse en croissant</td></tr><tr><td>N02.8</td><td>Autres modifications morphologiques</td></tr><tr><td>N02.9</td><td>Type de modification morphologique non précisé</td></tr></tbody></table><p>R31 décrit l’hématurie sans autre indication, hors N02 ; N39.81 correspond au syndrome du flanc douloureux avec hématurie exclu de cette catégorie. Les indications de biopsie viennent de la clinique et des recommandations applicables, jamais de la volonté de remplir un suffixe. La catégorie historique inclut le terme « bénigne » ; le cours conserve le libellé comme information administrative et n’en fait pas un pronostic.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">CH-CIM — XML :N02,N00–N08,modificateurS14 N00_4 .0–.9</a>.</p></section>
</div></div>

<div class="panel" hidden="" id="pE"><div class="chap-body"><section class="ilot" id="n02-e-urines"><h2>Urines : confirmer, quantifier, localiser</h2><table class="t"><thead><tr><th>Mesure</th><th>Technique et lecture</th><th>Conséquence</th></tr></thead><tbody><tr><td>Bandelette sang</td><td>Réaction à l’hème ; confirmer les cellules, vérifier contamination et interférences</td><td>Ne distingue pas hématies, hémoglobine et myoglobine.</td></tr><tr><td>Numération des hématies</td><td>Résultat avec unité et référence du laboratoire ; 1 million/L = 1/µL</td><td>Les seuils HUG 26/µL et CUEN 10/µL sont attribués à leurs méthodes.</td></tr><tr><td>Sédiment</td><td>Morphologie, acanthocytes, cylindres ; prélèvement correctement recueilli et examiné</td><td>Origine glomérulaire probable si indices concordants ; sensibilité imparfaite.</td></tr><tr><td>Albumine/créatinine</td><td>Échantillon urinaire, préférentiellement matinal selon contexte</td><td>Quantifie albuminurie, distincte des protéines totales.</td></tr><tr><td>Protéines/créatinine ou collecte</td><td>Vérifier unité et qualité ; urines claires pour suivi après épisode visible</td><td>La contamination sanguine peut augmenter le total ; ne pas méconnaître une vraie protéinurie.</td></tr><tr><td>Culture</td><td>Si symptômes ou contexte infectieux</td><td>L’infection établie est traitée puis l’hématurie contrôlée.</td></tr></tbody></table><p><b>Exemple fictif de conversion.</b> 26 × 10⁶ cellules/L divisées par 10⁶ µL/L donnent 26 cellules/µL. Ce calcul d’unité est exact ; l’équivalence avec un nombre par champ microscopique est seulement approximative et dépend du laboratoire. Une valeur exprimée en mg/g de créatinine ne se compare pas directement à une valeur en mg/mmol sans conversion appropriée.</p><p>Le seuil d’albuminurie de 30 mg/g employé dans le suivi européen Alport n’est pas le seuil de protéinurie totale de 0,5 g/j utilisé pour discuter une biopsie IgA chez l’adulte. Les FI utilisent encore des critères propres : rapport protéines/créatinine ≥ 0,75 g/g pour Filspari et ≥ 0,8 g/g pour Kinpeygo, ou protéinurie ≥ 1 g/j. Écrire le nom de l’analyte évite une erreur de prescription.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section>
<section class="ilot" id="n02-e-bilan"><h2>Fonction, imagerie et bilan orienté</h2><p>La créatinine, le débit estimé, la pression et les protéines urinaires forment une base de comparaison. Rechercher les anciennes valeurs ; une mesure dans la norme de population peut avoir augmenté pour cette personne. En situation aiguë, l’estimation du débit fondée sur une créatinine changeante doit être interprétée avec prudence. Les électrolytes et l’état clinique renseignent le retentissement et la sécurité d’un traitement.</p><p>L’échographie recherche anomalies rénales, calculs visibles, dilatation et anomalie vésicale selon la qualité de l’examen. Elle ne visualise pas directement les dépôts mésangiaux d’IgA ou le réseau moléculaire du collagène IV. Une échographie normale ne ferme donc pas la filière glomérulaire. Chez le jeune avec microhématurie isolée, elle précède les investigations irradiantes ; une cystoscopie est réservée aux indications spécifiques, notamment anomalie vésicale non résolue par l’évaluation.</p><p>Chez l’adulte, la stratégie HUG 2024 stratifie le risque urologique ; les situations intermédiaires associent généralement échographie et cystoscopie, les risques élevés imagerie multiphasique et cystoscopie. Le tableau est adapté d’une stratégie antérieure et ne constitue pas un seuil d’âge universel applicable en 2026 à toute population. Grossesse, contraste, fonction rénale et dispositifs implantés nécessitent une appréciation spécifique de la modalité ; une contre-indication à l’IRM n’est pas une contre-indication automatique au scanner.</p><p>Les examens immunologiques, infectieux ou hématologiques dépendent du syndrome : suspicion de lupus, vascularite, maladie anti-membrane basale, infection associée ou autre maladie systémique. Les prescrire sans hypothèse augmente les résultats fortuits ; les différer devant une glomérulonéphrite active peut retarder un traitement nécessaire. Le rythme de la maladie arbitre cette différence.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p></section>
<section class="ilot" id="n02-e-biopsie"><h2>Biopsie, génétique et outils pronostiques</h2><p>Une biopsie pour suspicion d’IgA doit être analysée avec les techniques nécessaires au diagnostic et à l’appréciation des lésions. MEST-C décrit hypercellularité mésangiale, hypercellularité endocapillaire, sclérose segmentaire, atrophie tubulaire/fibrose interstitielle et croissants. Le compte rendu associe diagnostic, activité, chronicité et contexte ; le cours ne propose pas une somme improvisée de ces lettres pour décider d’un médicament.</p><p>L’outil international IgA repose sur une maladie biopsiée et des variables cliniques/histologiques ; il prédit le risque d’une perte importante de débit ou d’insuffisance rénale, avec des versions au moment de la biopsie ou après un à deux ans. Il ne prédit pas la réponse individuelle au traitement. Une estimation sans toutes les données, hors de la population validée ou appliquée à une microhématurie non biopsiée donne une précision trompeuse.</p><p>La génétique du collagène IV doit couvrir COL4 A3, COL4 A4 et COL4 A5 selon une méthode appropriée. L’interprétation distingue pathogénicité, mode de transmission, concordance phénotypique et limites du test. L’étude familiale et, si nécessaire, la phase des variants peuvent modifier la conclusion. Un résultat incertain se communique comme tel ; il ne justifie pas de prédire une dialyse à un enfant.</p><p>Dans une forme liée à l’X ou récessive génétiquement établie, la biopsie n’est habituellement pas nécessaire pour confirmer la même étiologie. Une évolution discordante peut cependant la rendre utile. Dans l’hétérozygotie COL4 A3/4, la coexistence d’une autre maladie est possible ; le diagnostic génétique ne doit pas absorber toutes les anomalies ultérieures.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a>.</p></section>
</div></div><div class="panel" hidden="" id="pS"><div class="sci-bar ui" role="tablist"><button aria-controls="n02-s-semio" aria-selected="true" data-s="n02-s-semio" id="n02-tab-semio" role="tab">Sémiologie fondamentale et analytique</button><button aria-controls="n02-s-anat" aria-selected="false" data-s="n02-s-anat" id="n02-tab-anat" role="tab">Anatomie</button><button aria-controls="n02-s-histo" aria-selected="false" data-s="n02-s-histo" id="n02-tab-histo" role="tab">Histologie et anatomopathologie</button><button aria-controls="n02-s-physio" aria-selected="false" data-s="n02-s-physio" id="n02-tab-physio" role="tab">Physiologie</button><button aria-controls="n02-s-bio" aria-selected="false" data-s="n02-s-bio" id="n02-tab-bio" role="tab">Biochimie et biologie moléculaire</button><button aria-controls="n02-s-immuno" aria-selected="false" data-s="n02-s-immuno" id="n02-tab-immuno" role="tab">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div aria-labelledby="n02-tab-semio" class="sci" id="n02-s-semio" role="tabpanel"><section class="ilot" data-semiology="normal" id="n02-semio-normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le rein normal filtre le plasma au niveau des corpuscules glomérulaires, puis modifie le filtrat dans les tubules. Le sang circule dans les capillaires ; l’urine chemine dans un espace différent. Endothélium, membrane basale et podocytes participent à la séparation. La présence persistante d’érythrocytes dans l’urine invite donc à chercher une rupture de cette séparation ou un saignement en aval, dans les voies excrétrices.</p><p>Une faible quantité d’hématies peut être compatible avec la référence du laboratoire. La normalité ne se définit pas par une couleur : une microhématurie peut laisser l’urine d’aspect habituel. Elle ne se définit pas non plus par une créatinine isolée, puisque l’atteinte du filtre peut précéder la baisse de fonction. Pour parler d’hématurie isolée, il faut connaître pression, protéines urinaires, fonction et contexte systémique.</p><p>La planche ci-dessous situe la barrière normale et les pédicelles. Elle explique où chercher le mécanisme, mais ne montre ni collagène IV anormal ni dépôts d’IgA. L’étudiant doit distinguer une illustration anatomique, une hypothèse physiopathologique et un résultat d’examen obtenu chez le patient.</p><figure data-n02-figure="podocytes"><div data-n02-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n02/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n02-mark="1">1</span><span aria-hidden="true" data-n02-mark="2">2</span><span aria-hidden="true" data-n02-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n02-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a>.</p></section>
<section class="ilot" data-semiology="signs" id="n02-semio-signs"><h3>Décrire le signe avant d’en nommer la cause</h3><p>Microhématurie, hématurie visible, hématurie récidivante et hématurie persistante décrivent des dimensions différentes. Demander si les urines étaient rouges ou brunes, si des caillots existaient, si la miction était douloureuse et si les épisodes se répétaient. La couleur ne mesure pas la gravité ; l’état général, la fonction rénale et l’obstruction éventuelle importent davantage.</p><p>L’apparition au début de la miction peut orienter vers l’urètre, la fin vers la vessie, tandis qu’une hématurie totale localise moins bien. Ces descriptions ne constituent pas une preuve anatomique. Une douleur de colique, une brûlure avec fièvre ou un épisode indolore chez un fumeur changent les hypothèses, sans autoriser une conclusion définitive avant les examens.</p><p>Analyser aussi ce qui accompagne le sang : œdèmes, baisse de diurèse, hypertension, purpura, arthralgies, symptômes respiratoires, audition ou vision. La chronologie d’une infection et l’histoire familiale ont une valeur d’orientation. L’absence de la triade rénale–auditive–oculaire ne rend pas un trouble du collagène IV impossible ; l’expression varie selon le gène, le sexe et l’âge.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p></section>
<section class="ilot" data-semiology="mechanisms" id="n02-semio-mechanisms"><h3>Relier anomalie du filtre et expression urinaire</h3><p>Une atteinte glomérulaire peut laisser passer hématies et albumine. Les hématies traversent un environnement qui peut modifier leur forme ; des acanthocytes renforcent ainsi la localisation glomérulaire. Un cylindre érythrocytaire signifie que des hématies ont été incorporées dans une structure formée dans le néphron : il n’est pas équivalent à quelques cellules libres contaminant un prélèvement.</p><p>Une anomalie de collagène IV fragilise la structure de la membrane basale. Une hématurie peut précéder les signes de perte néphronique ; la survenue d’albuminurie et de sclérose secondaire indique un autre niveau de retentissement. Dans l’IgA, la biopsie identifie des dépôts glomérulaires et les lésions associées. La même hématurie clinique peut donc venir d’un défaut structural héréditaire ou d’une atteinte immunologique.</p><p>Cette chaîne mécanisme–signe–examen explique le traitement : une anomalie structurale ne se corrige pas par des corticoïdes empiriques ; le blocage rénine–angiotensine vise la protection du néphron et la protéinurie. Dans l’IgA à risque, des traitements spécifiques s’ajoutent selon preuve et indication. La baisse des protéines est utile, mais ne démontre pas à elle seule que tout mécanisme causal a disparu.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations 1.4.3.1–2 et 1.4.4.1–3, pp.S18–S25</a>.</p></section>
<section class="ilot" data-semiology="examination" id="n02-semio-examination"><h3>Observer correctement : prélèvement, sédiment et patient</h3><p>Vérifier les conditions du prélèvement : règles, contamination génitale, exercice intense, infection ou geste récent. Un résultat qui ne concorde pas avec le contexte doit être contrôlé dans des conditions documentées. Les hématies peuvent être comptées par une méthode automatisée, mais la question morphologique requiert une appréciation du sédiment adaptée ; tous les automates ne répondent pas à cette question de manière équivalente.</p><p>Demander explicitement la recherche de dysmorphie, d’acanthocytes et de cylindres lorsque l’origine glomérulaire est en jeu. La fraîcheur, la préparation et l’expérience influencent la lecture. Un compte rendu « sang positif » n’est pas synonyme de « sédiment glomérulaire ». Les photographies de cylindres du cours sont attribuées à leur légende originale ; leur résolution ne permet pas de reclasser chaque cellule.</p><p>Au lit du patient, mesurer la pression, observer les œdèmes et apprécier l’état volémique et respiratoire. Comparer la diurèse et la créatinine aux valeurs antérieures. Une simple palpation lombaire normale n’explore ni le filtre microscopique ni une petite lésion urothéliale. Chaque technique apporte donc une information partielle à réunir dans la synthèse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a>.</p></section>
