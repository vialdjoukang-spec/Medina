<template id="ch-C73"><div class="chap"><style>[data-c73-table="1"]{font-size:inherit!important;display:block;max-width:100%;overflow-x:auto}[data-c73-table="1"] th,[data-c73-table="1"] td{font-size:inherit!important;min-width:9em}[data-c73-frame]{position:relative;max-width:737px;margin:auto}[data-c73-frame] img,[data-c73-canvas] img{display:block;width:100%;height:auto}[data-c73-marker]{position:absolute;background:#123d4e;color:white;border:2px solid white;border-radius:50%;padding:1px 4px;font-weight:bold;font-size:12px;line-height:1.2}[data-c73-normal-pin="1"]{left:44%;top:16%}[data-c73-normal-pin="2"]{left:47%;top:24%}[data-c73-normal-pin="3"]{left:40%;top:50%}[data-c73-normal-pin="4"]{left:53%;top:84%}[data-c73-scroll]{overflow-x:auto;max-width:100%;border:1px solid currentColor}[data-c73-canvas]{position:relative;min-width:760px}[data-c73-path-pin="1"]{left:15%;top:24%}[data-c73-path-pin="2"]{left:49%;top:24%}[data-c73-path-pin="3"]{left:82%;top:24%}[data-c73-path-pin="4"]{left:49%;top:74%}</style><div class="chap-head"><div class="code"><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> · Tumeur maligne de la thyroïde · Endocrinologie et métabolisme</div><h1>Tumeur maligne de la thyroïde</h1><span class="status">Production Sol du 2 novembre 2026 · Sources datées suisses et européennes · Auto-relecture, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#c73-1">Une masse du cou, plusieurs maladies possibles</a></li><li><a href="#c73-2">Définition : code, lignage, grade et stade</a></li><li><a href="#c73-3">Épidémiologie suisse : dater le numérateur et le dénominateur</a></li><li><a href="#c73-4">Du tissu normal à la maladie tumorale</a></li><li><a href="#c73-5">Risques et génétique : distinguer tumeur et famille</a></li><li><a href="#c73-6">Anamnèse : évolution, retentissement et projet de vie</a></li><li><a href="#c73-7">Sémiologie clinique : décrire avant d’interpréter</a></li><li><a href="#c73-8">Diagnostic : articuler image, cellules et tissu</a></li><li><a href="#c73-9">TNM 9 : étendue anatomique et risque de récidive</a></li><li><a href="#c73-10">Diagnostic différentiel : chercher ce qui change la décision</a></li><li><a href="#c73-11">Traitement : définir le but avant de choisir le moyen</a></li><li><a href="#c73-12">Suivi et pronostic : surveiller la bonne maladie</a></li><li><a href="#c73-13">Populations particulières et cadre suisse</a></li><li><a href="#c73-14">Critères formels et paramètres à garder ensemble</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="c73-1"><h2><span class="n">1</span>Une masse du cou, plusieurs maladies possibles</h2><p>Une personne fictive de quarante-huit ans consulte pour un nodule découvert à l’échographie. Sa <button class="w" data-k="c73-tsh">thyréostimuline</button> est dans l’intervalle du laboratoire. Elle demande si cela exclut un cancer. Non : le dosage renseigne sur le fonctionnement hormonal global, tandis que l’échographie, la cytologie et, selon le cas, l’histologie répondent à la question de la nature du tissu. Le bilan doit aussi rechercher une extension et une menace respiratoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p>« Cancer de la thyroïde » rassemble des tumeurs de lignages et de comportements différents. Une petite tumeur papillaire sélectionnée, un cancer médullaire héréditaire et un cancer anaplasique rapidement compressif n’ont ni le même bilan ni le même traitement. Une expression comme « bon cancer » peut banaliser l’expérience de la personne et masquer ces différences [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>Pour l’examen fédéral, l’enjeu est de relier une anomalie histologique ou moléculaire à une décision expliquée. Les situations suisses <button class="w" data-k="c73-profiles">PROFILES</button> incluent l’histologie, la cytologie et les tests génétiques anormaux, ainsi que l’évaluation partagée des risques oncologiques. La correspondance pédagogique de ce cours n’est pas une correspondance officielle entre un code et une question d’examen [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p><div class="key"><b>À retenir.</b> Une <button class="w" data-k="c73-tsh">thyréostimuline</button> normale n’exclut pas un cancer. Identifier le lignage, l’étendue et l’urgence avant de choisir le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-1">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-2"><h2><span class="n">2</span>Définition : code, lignage, grade et stade</h2><p>Le catalogue suisse local <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM2024</a> donne <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> — Tumeur maligne de la thyroïde, sans subdivision. Le numéro <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">C73.9</a> présent sur une fiche anglaise de stadification ne crée pas un sous-code suisse. Le code de siège, le type histologique, le grade et le stade décrivent des dimensions différentes [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Groupe</th><th>Origine et repère</th><th>Conséquence du raisonnement</th></tr></thead><tbody><tr><td>Papillaire, folliculaire, oncocytaire</td><td>Lignage folliculaire ; différenciation variable.</td><td>Une capacité de fixer l’iode peut persister, mais ne se déduit pas du nom seul.</td></tr><tr><td>Différencié de haut grade et peu différencié</td><td>Deux catégories à distinguer dans la classification 2022.</td><td>Le grade et la nécrose ajoutent une information pronostique.</td></tr><tr><td>Médullaire</td><td>Cellules C, <button class="w" data-k="c73-calcitonin">calcitonine</button> ; recherche de prédisposition <button class="w" data-k="c73-ret">RET</button>.</td><td>Le suivi et les traitements diffèrent des formes folliculaires.</td></tr><tr><td>Anaplasique</td><td>Carcinome indifférencié, souvent rapidement invasif.</td><td>Évaluation urgente, preuve tissulaire et analyse moléculaire rapide.</td></tr></tbody></table><p>La terminologie actuelle remplace « Hürthle » par « oncocytaire » et distingue un sous-type histologique d’un variant génétique. Une néoplasie folliculaire non invasive à caractéristiques nucléaires de type papillaire, dite <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">NIFTP</a>, appartient aux néoplasies de faible risque de comportement incertain dans la classification 2022 : elle ne devient pas automatiquement un cancer <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a>. Son diagnostic exige l’étude du tissu et de l’absence d’invasion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p>« Microcarcinome papillaire » signifie une taille d’au plus 1 cm. Ce n’est plus un sous-type histologique autonome et cela ne garantit pas l’absence de caractéristiques agressives. La taille doit rester accompagnée du sous-type, de l’invasion et de l’évaluation ganglionnaire [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><div class="key"><b>À retenir.</b> Un code de siège ne remplace ni le lignage ni le grade. <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> n’a pas de sous-code suisse dans le catalogue 2024 utilisé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-2">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-3"><h2><span class="n">3</span>Épidémiologie suisse : dater le numérateur et le dénominateur</h2><p>Les tableaux officiels de l’Organe national d’enregistrement du cancer rapportent, pour 2018–2022,1249 nouveaux cas chez les hommes et 2966 chez les femmes, soit 4215 cas <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> en cinq ans. Diviser par cinq donne une moyenne calculée d’environ 250 hommes et 593 femmes par an, soit 843 cas annuels. Ce ne sont pas des comptages de 2026 [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>].</p><p>Les taux standardisés selon l’âge, utilisant le standard européen 1976, sont de 4,90 chez les hommes et 12,02 chez les femmes pour 100000 personnes-années. Le taux brut répond à une autre question et dépend de la structure d’âge de la population. Un rapport entre nombres bruts ne remplace pas un rapport entre taux standardisés [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>].</p><p>Sur la même période, 274 décès ont été enregistrés, 116 chez les hommes et 158 chez les femmes. On ne peut pas diviser ces décès par les nouveaux cas de la période pour calculer la létalité : les personnes décédées ne sont pas nécessairement celles diagnostiquées pendant ces cinq années [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Mortality/ONEC_Mortalit__Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S12</a>].</p><p>La découverte d’une lésion dépend de l’intensité et des indications de l’imagerie. L’augmentation des diagnostics de petits cancers ne prouve pas une augmentation parallèle des maladies qui menacent la vie. Aucune prévalence suisse <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> ni prévalence européenne contemporaine n’a été établie dans les lectures ciblées ; une fréquence européenne des nodules ne doit pas être utilisée comme fréquence de cancer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>].</p><div class="key"><b>À retenir.</b> Les 843 cas par an sont une moyenne dérivée des données suisses 2018–2022. Incidence, mortalité et survie demandent des dénominateurs distincts [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Mortality/ONEC_Mortalit__Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-3">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-4"><h2><span class="n">4</span>Du tissu normal à la maladie tumorale</h2><p>La glande normale comporte des follicules bordés de cellules qui fabriquent la <button class="w" data-k="c73-tg">thyroglobuline</button>, captent l’iodure et produisent les hormones thyroïdiennes. La colloïde est un compartiment extracellulaire de stockage. Les cellules C constituent un autre lignage fonctionnel et sécrètent la <button class="w" data-k="c73-calcitonin">calcitonine</button> ; celle-ci n’est pas une hormone précurseur de la thyroxine [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p>Une prolifération tumorale peut conserver certains caractères du tissu d’origine et en perdre d’autres. La <button class="w" data-k="c73-tg">thyroglobuline</button> est utile pour suivre une maladie différenciée dans un contexte approprié ; elle n’est pas un test de dépistage de tout nodule et ne constitue pas le marqueur du cancer médullaire. Une dédifférenciation peut réduire l’expression de la <button class="w" data-k="c73-tg">thyroglobuline</button> et la capacité de fixer l’iode [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p>Les modifications moléculaires participent à la signalisation de croissance. Une altération de <button class="w" data-k="c73-ret">RET</button> peut être une mutation dans un cancer médullaire ou une fusion dans un cancer papillaire : le nom du gène ne suffit pas à définir l’éligibilité au même médicament. Il faut préciser le type d’altération, le type tumoral, l’âge, les traitements antérieurs et le libellé suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="15" fill="currentColor" text-anchor="middle">Lignage et différenciation</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="15" fill="currentColor" text-anchor="middle">Marqueurs et fonction conservés ou perdus</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="15" fill="currentColor" text-anchor="middle">Examens et traitements adaptés</text></svg><figcaption>Schéma causal original Sol 2026, sans structure anatomique dessinée. Chaîne de raisonnement fondée sur les caractéristiques tissulaires ; une perte de différenciation n’est pas une étape obligatoire de tout cancer [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</figcaption></figure><div class="key"><b>À retenir.</b> Comprendre la fonction normale explique pourquoi un marqueur ou le radioiode ne convient pas à tous les cancers thyroïdiens [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-4">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-5"><h2><span class="n">5</span>Risques et génétique : distinguer tumeur et famille</h2><p>Rechercher une irradiation cervicale pendant l’enfance, les antécédents familiaux de cancer thyroïdien et les manifestations d’un syndrome de prédisposition. Un facteur de risque renforce l’attention portée à une lésion ; il ne prouve pas que celle-ci est maligne. L’absence d’histoire familiale ne suffit pas non plus à exclure une prédisposition [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><p>Tout cancer médullaire confirmé appelle une discussion de l’analyse germinale de <button class="w" data-k="c73-ret">RET</button> avec conseil génétique. Un variant trouvé dans le sang peut concerner les apparentés ; une altération somatique détectée uniquement dans la tumeur répond d’abord à une question tumorale. Ces deux analyses ne sont pas interchangeables [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>La néoplasie endocrinienne multiple de type 2 peut associer cancer médullaire, phéochromocytome et, selon le sous-type, hyperparathyroïdie. Avant la chirurgie thyroïdienne, si un statut germinal négatif n’est pas établi, rechercher les tumeurs endocriniennes associées selon l’équipe experte. Un phéochromocytome présent doit être pris en charge et opéré avant le cancer médullaire pour éviter une crise liée à la sécrétion de catécholamines lors de l’intervention [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Chez un porteur asymptomatique d’un variant germinal pathogène de <button class="w" data-k="c73-ret">RET</button>, une thyroïdectomie prophylactique doit être proposée en équipe spécialisée. Son calendrier dépend du variant, de l’âge et de la <button class="w" data-k="c73-calcitonin">calcitonine</button> interprétée selon les valeurs adaptées ; il ne s’agit pas d’un dépistage de tout enfant dans la population générale [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>D’autres prédispositions, notamment liées à <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">PTEN</a> ou <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">DICER1</a>, peuvent concerner des lésions du lignage folliculaire chez l’enfant. Le contexte clinique et familial guide l’orientation ; il ne justifie pas de proposer sans indication la même analyse génétique à tout adulte présentant un nodule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><div class="key"><b>À retenir.</b> Germinal signifie potentiellement familial ; somatique décrit la tumeur. Un cancer médullaire impose de penser à <button class="w" data-k="c73-ret">RET</button> et aux risques endocriniens associés avant l’opération [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-5">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-6"><h2><span class="n">6</span>Anamnèse : évolution, retentissement et projet de vie</h2><p>Préciser la date et les circonstances de découverte, la vitesse de croissance, une douleur ou un gonflement brutal, une modification de voix, une dysphagie, une dyspnée et une gêne en position couchée. Une croissance rapide n’établit pas à elle seule le diagnostic d’un cancer anaplasique : une hémorragie ou un lymphome peuvent aussi modifier rapidement le cou. Elle impose de réévaluer le délai et le niveau de soins [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p>Documenter les anciennes échographies et les prélèvements : quel nodule a été ponctionné, avec quelle catégorie cytologique, et existe-t-il une concordance avec l’image actuelle ? Une phrase ancienne « ponction bénigne » sans localisation précise ne rassure pas sur toutes les lésions futures [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p><p>Rechercher irradiation, chirurgie et traitements antérieurs, antécédents familiaux, symptômes endocriniens associés, grossesse, allaitement et projet de grossesse. Relever les médicaments, les compléments de biotine, les produits iodés et les injections récentes de contraste ; ils peuvent modifier les analyses ou la préparation d’une procédure nucléaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><p>Enfin, demander les attentes et les craintes : sécurité du suivi, cicatrice, voix, fertilité, travail, incertitude génétique ou accès à un traitement. Une décision partagée exige une explication des objectifs et des contraintes de chaque option. Les textes lus ne fournissent pas une fréquence universelle de chaque symptôme applicable à toutes les histologies [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p><div class="key"><b>À retenir.</b> La chronologie, la voix, la respiration et les traitements antérieurs changent le raisonnement. Les inquiétudes de la personne font partie du bilan [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-6">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-7"><h2><span class="n">7</span>Sémiologie clinique : décrire avant d’interpréter</h2><div data-semiology-clinical="C73"><p>La sémiologie clinique recherche une masse thyroïdienne, des adénopathies, une atteinte des structures voisines et une menace fonctionnelle. Elle relie chaque signe à un mécanisme possible sans lui attribuer une valeur diagnostique absolue [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p></div><p>Observer l’état général, la respiration et la voix, puis inspecter le cou au repos et à la déglutition. Palper les lobes, l’isthme et les aires ganglionnaires cervicales ; décrire consistance, douleur, contours, mobilité et fixation. Une masse qui suit la déglutition est compatible avec une origine thyroïdienne mais ne prouve pas sa bénignité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p><p>Une dureté, une fixation, une adénopathie suspecte ou une dysphonie nouvelle renforcent la suspicion. Une paralysie d’une corde vocale peut résulter d’une atteinte du nerf laryngé récurrent mais nécessite une évaluation spécialisée ; la voix seule ne mesure pas la mobilité des cordes vocales. La normalité de la palpation n’exclut ni petite lésion ni extension profonde [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Une masse cervicale ferme rapidement progressive, avec dysphagie, dysphonie ou dyspnée, fait évoquer notamment un cancer anaplasique et appelle un bilan immédiat. Stridor ou détresse respiratoire font prioriser l’évaluation et la protection des voies aériennes. Le bilan tumoral ambulatoire ne doit pas retarder les soins urgents [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Aucune sensibilité ou spécificité universelle de cet examen n’a été établie dans les lectures. La profondeur, le volume, le type de lésion et l’expérience de l’examinateur modifient sa performance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><div class="key"><b>À retenir.</b> Un signe est un argument, pas une histologie. L’urgence respiratoire se décide sur le retentissement actuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-7">Essentiel de cette partie</button></section>

<section class="ilot" id="c73-8"><h2><span class="n">8</span>Diagnostic : articuler image, cellules et tissu</h2><p>Une échographie cervicale évalue le nodule et les ganglions. Chez l’adulte, le guide européen 2023 propose une ponction selon le risque échographique et la taille : catégorie <button class="w" data-k="c73-tirads">EU-TIRADS</button> 3 au-delà de 20 mm, 4 au-delà de 15 mm et 5 au-delà de 10 mm, avec exceptions devant un ganglion pathologique ou une extension suspectée. Ces seuils ne sont pas directement transposables à l’enfant [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><p>La cytoponction décrit des cellules. Une catégorie indéterminée n’est ni un cancer certain ni un résultat à ignorer. Une suspicion de néoplasie folliculaire ne permet pas à elle seule de séparer adénome et carcinome : l’invasion capsulaire ou vasculaire demande une étude histologique adéquate. Les résultats doivent être confrontés à l’échographie et au contexte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p>La <button class="w" data-k="c73-calcitonin">calcitonine</button> est utile dans l’évaluation d’un cancer médullaire suspecté ; son interprétation dépend du laboratoire, de la méthode et du contexte. Les guides ne définissent pas un consensus universel de dosage systématique chez tout nodule. La directive allemande allemande déconseille la ponction si un cancer des cellules C est suspecté, car la fibrose provoquée peut perturber un protocole chirurgical fondé sur la desmoplasie. D’autres recommandations discutent cytologie et marqueurs de lavage : coordonner le prélèvement avec l’équipe experte plutôt qu’enseigner un « toujours » commun [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Si une forme anaplasique, un lymphome ou une métastase intrathyroïdienne est suspecté, une microbiopsie tissulaire peut être plus informative qu’une cytoponction. Le diagnostic et l’analyse moléculaire doivent être organisés rapidement. Un marqueur sanguin absent ne remplace pas cette preuve tissulaire [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><div class="key"><b>À retenir.</b> Échographie, cytologie et histologie répondent à des questions distinctes. Adapter le prélèvement au diagnostic suspecté et à son usage clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-8">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-9"><h2><span class="n">9</span><button class="w" data-k="c73-tnm">TNM</button> 9 : étendue anatomique et risque de récidive</h2><p>Le stade <button class="w" data-k="c73-tnm">TNM</button> décrit l’étendue anatomique ; le risque de récidive et la réponse au traitement ajoutent d’autres informations. La fiche européenne <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">NDRS</a>, version 1.1 du 16 décembre 2025, renvoie à la neuvième édition <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">UICC</a>. Le livre lui-même n’a pas été lu. Les groupes ci-dessous proviennent de cette fiche, sans présenter les anciennes tables <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">AJCC</a> 8 comme la dernière classification [<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://doi.org/10.1002/ijc.70561" target="_blank" rel="noopener">S10</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Type</th><th>Condition</th><th>Groupe de stade</th></tr></thead><tbody><tr><td>Différencié, âge inférieur à 55 ans</td><td>Sans métastase distante / avec métastase distante s/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">T3a</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">N0</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">M0</a> ; extension ou ganglions du groupe <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">IVB</a> ; <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">M1</a></td><td><a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">IVA</a> ; <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">IVB</a> ; <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">IVC</a>.</td></tr></tbody></table><p>Pour le dernier groupe, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">IVB</a> comprend <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">T1</a>–<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">T3a</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">N1</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">M0</a> ou <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">T3b</a>/<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">T4a</a>/<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">T4b</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">N0</a>–<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">N1</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">M0</a>. Ainsi, tous les cancers anaplasiques sont classés au stade <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">IV</a>, mais tous ne sont pas métastatiques. À l’inverse, un ganglion atteint dans un cancer différencié ne signifie pas automatiquement stade <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">IV</a> [<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><p>La catégorie T prend en compte diamètre et invasion. La fiche distingue notamment une tumeur limitée à la glande jusqu’à 2 cm, de plus 2 à 4 cm, ou de plus 4 cm, et les degrés d’extension. Son astérisque concernant les définitions détaillées inclut les formes folliculaires et anaplasiques mais ne liste pas le médullaire : ne pas étendre sans réserve tous les détails d’un tableau à tous les types [<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><p>Après traitement, la réponse combine données cliniques, imagerie et marqueurs pertinents. Une excellente réponse peut permettre d’alléger la suppression de <button class="w" data-k="c73-tsh">thyréostimuline</button> ou la surveillance, tandis qu’une persistance structurelle impose une réévaluation. Le stade initial ne remplace pas cette appréciation dynamique [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><div class="key"><b>À retenir.</b> Toujours préciser édition, histotype et âge. <button class="w" data-k="c73-tnm">TNM</button>, risque de récidive et réponse au traitement ne sont pas des synonymes [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-9">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-10"><h2><span class="n">10</span>Diagnostic différentiel : chercher ce qui change la décision</h2><p>Une masse du cou ne correspond pas nécessairement à un carcinome thyroïdien. Le diagnostic différentiel repose sur le siège, l’évolution, la fonction et la nature tissulaire ; aucun signe isolé ne tranche toutes les situations [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Hypothèse</th><th>Élément discriminant recherché</th><th>Limite</th></tr></thead><tbody><tr><td>Nodule bénin ou goitre multinodulaire</td><td>Concordance clinique, échographie et cytologie si indiquée.</td><td>Multiplicité et fonction normale n’excluent pas un cancer.</td></tr><tr><td>Adénome folliculaire versus carcinome folliculaire</td><td>Invasion capsulaire ou vasculaire sur le tissu.</td><td>L’architecture folliculaire d’une ponction ne suffit pas.</td></tr><tr><td>Thyroïdite ou remaniement hémorragique</td><td>Douleur, chronologie aiguë, contexte et image.</td><td>Une évolution rapide nécessite tout de même une évaluation.</td></tr><tr><td>Lymphome thyroïdien</td><td>Tissu suffisant pour caractériser la prolifération lymphoïde.</td><td>Ne pas retarder le prélèvement adapté par répétition de ponctions non contributives.</td></tr><tr><td>Métastase d’un autre cancer</td><td>Histoire tumorale, histologie et panel de marqueurs.</td><td>Le siège thyroïdien ne prouve pas une origine thyroïdienne.</td></tr><tr><td>Masse ganglionnaire ou autre lésion cervicale</td><td>Localisation anatomique et prélèvement ciblé.</td><td>La palpation seule ne définit pas le lignage.</td></tr></tbody></table><p>Les marqueurs doivent être interprétés en panel et avec la morphologie. Un cancer médullaire peut avoir une architecture papillaire ; une tumeur papillaire peut avoir un aspect solide et une expression focale de la <button class="w" data-k="c73-tg">thyroglobuline</button>. La photographie histologique de ce cours illustre ces pièges, sans permettre à elle seule un diagnostic individuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>].</p><div class="key"><b>À retenir.</b> L’élément discriminant peut être tissulaire. Ne pas confondre apparence, siège et origine [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-10">Essentiel de cette partie</button><figure data-c73-original="pathology"><div data-c73-scroll="1" tabindex="0" aria-label="Planche histologique défilante horizontalement"><div data-c73-canvas="1"><img src="assets/img/c73/alpha/codex/histopathology-cameselle2020.jpg" width="1527" height="1210" alt="Six panneaux histopathologiques humains publiés : médullaire papillaire, papillaire solide, marqueurs focaux, tumeur oncocytaire claire et ultrastructure mitochondriale."/><span data-c73-marker="1" data-c73-path-pin="1" aria-hidden="true">1</span><span data-c73-marker="1" data-c73-path-pin="2" aria-hidden="true">2</span><span data-c73-marker="1" data-c73-path-pin="3" aria-hidden="true">3</span><span data-c73-marker="1" data-c73-path-pin="4" aria-hidden="true">4</span></div></div><figcaption>Original humain, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">Cameselle-Teijeiro</a>, Eloy et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">Sobrinho-Simões</a> 2020, figure 2, licence Creative Commons Attribution 4.0. Repères français : 1 panneau a, cancer médullaire à architecture papillaire ; 2 panneau b, sous-type solide de cancer papillaire ; 3 panneau c, expression focale de <button class="w" data-k="c73-tg">thyroglobuline</button> ; 4 panneau e, aspect oncocytaire clair. Le panneau d montre une expression de thyroxine et f une ultrastructure avec mitochondries gonflées. Les lettres a–f appartiennent à l’original. La légende ne précise pas toutes les colorations ni un grossissement : aucun n’est inventé. Faire défiler horizontalement pour inspecter les panneaux. Terminologie historique 2020 replacée dans la classification 2022 ; pas de diagnostic ou de pronostic individuel déduit de cette image [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</figcaption></figure></section>
<section class="ilot" id="c73-11"><h2><span class="n">11</span>Traitement : définir le but avant de choisir le moyen</h2><p>La décision se prend dans une équipe multidisciplinaire avec la personne : contrôle local, guérison possible, prévention d’une complication, maîtrise d’une maladie progressive ou soulagement. Une surveillance active structurée peut convenir à certains microcarcinomes papillaires intrathyroïdiens sans caractéristiques défavorables, éloignés des structures critiques et suivis de façon fiable. Elle n’est pas une absence de soins [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>La chirurgie dépend du type, de l’étendue et du risque. <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">SEOM</a> admettent hémi ou thyroïdectomie totale pour certaines tumeurs différenciées de 1–4 cm sans extension ni ganglion clinique. La directive allemande allemande privilégie davantage la totale pour un cancer papillaire de plus 1 cm mais admet l’hémi dans des cas justifiés sans facteurs défavorables. Ces différences doivent être expliquées ; elles ne constituent pas un consensus universel de la même opération [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>Le curage ganglionnaire thérapeutique vise un compartiment atteint. Il ne faut pas transformer la possibilité d’un curage prophylactique dans une situation particulière en règle de retirer tous les ganglions de toute personne. Le risque d’hypoparathyroïdie ou d’atteinte nerveuse et l’expertise chirurgicale participent à la décision [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><p>Dans les cancers différenciés, distinguer ablation d’un reliquat, traitement adjuvant et traitement d’une maladie connue par iode 131. Le radioiode n’est pas systématique pour toute tumeur de faible risque ; sa pertinence dépend du risque et des propriétés de la maladie. Une maladie dite réfractaire au radioiode ne déclenche pas automatiquement un traitement systémique si elle est stable et asymptomatique [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>].</p><p>Une progression morphologique importante, des symptômes ou une menace sans option locale appropriée peuvent justifier un inhibiteur ciblé. Rechercher les altérations utiles avant le choix et vérifier la FI suisse exacte : un gène, une mutation, une fusion et une autorisation étrangère ne sont pas interchangeables. La radioactivité ne traite pas par le même mécanisme un cancer médullaire ou anaplasique ; leurs stratégies sont propres [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p>Pour le médullaire opérable, la chirurgie thyroïdienne totale et le traitement ganglionnaire central, avec extension latérale selon le contexte, sont discutés dans une équipe experte. La directive allemande décrit des exceptions selon la <button class="w" data-k="c73-calcitonin">calcitonine</button> et la desmoplasie ; elles ne deviennent pas des critères universels isolés de leur protocole [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>Les indications suisses du sorafénib et du lenvatinib concernent des formes différenciées progressives réfractaires au radioiode ; <button class="w" data-k="c73-cabo">Cabometyx</button> précise en outre une progression après un traitement ciblant le facteur de croissance de l’endothélium vasculaire. Dans le médullaire, les conditions du selpercatinib et du vandétanib sont propres à leurs fiches professionnelles ; ne pas transposer un produit ou une ligne d’un histotype à l’autre [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p><p>Le cancer anaplasique requiert une organisation urgente associant voies aériennes, histologie, moléculaire et évaluation de résécabilité. Un traitement ciblant <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">BRAF</a> et <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">MEK</a> peut rendre certaines tumeurs opérables ; la recommandation européenne et les conditions de l’indication suisse agnostique restent distinctes. Soins de support et soins palliatifs peuvent être associés précocement selon les besoins, sans attendre l’échec de tout traitement [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><div class="key"><b>À retenir.</b> Ni chirurgie maximale, ni radioiode, ni traitement systémique ne sont automatiques. Le bénéfice attendu, la biologie et les risques guident une décision partagée [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-11">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-12"><h2><span class="n">12</span>Suivi et pronostic : surveiller la bonne maladie</h2><p>Après une forme différenciée traitée, le suivi repose sur la clinique, l’échographie et les marqueurs adaptés à l’étendue du traitement. Après thyroïdectomie totale et radioiode, mesurer la <button class="w" data-k="c73-tg">thyroglobuline</button> avec ses anticorps : les anticorps peuvent perturber l’interprétation. Après hémi, le tissu normal restant produit aussi de la <button class="w" data-k="c73-tg">thyroglobuline</button> ; les seuils de suivi ne se transposent pas directement et <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> ne recommande pas son dosage de routine dans ce contexte [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p>Une hausse isolée d’un marqueur demande de vérifier méthode, anticorps, conditions hormonales et trajectoire, puis de choisir l’imagerie appropriée. Elle ne démontre pas à elle seule une progression structurelle qui exige un inhibiteur. Dans le médullaire, <button class="w" data-k="c73-calcitonin">calcitonine</button> et antigène carcinoembryonnaire ont leur place dans le suivi ; leur évolution ne se substitue pas non plus à l’évaluation clinique et morphologique [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>Les objectifs de <button class="w" data-k="c73-tsh">thyréostimuline</button> sont adaptés au risque, à la réponse et aux risques cardiaques ou osseux. La directive allemande courante propose notamment 0,5–2 mU/L pour une excellente réponse, 0,1–0,5 pour certaines réponses intermédiaires ou biologiquement incomplètes et une valeur sous 0,1 pour une persistance structurelle, avec adaptation individuelle. Ces repères ne sont pas une dose fixe de lévothyroxine et ne constituent pas une règle de suppression de tous les histotypes [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><p>Les tableaux suisses 2018/22 donnent une survie relative à cinq ans, standardisée par âge, d’environ 89,0%chez les hommes et 94,2%chez les femmes. Il s’agit d’une analyse de période de tous les cancers <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> regroupés, corrigée de la survie attendue dans la population. Ces chiffres ne prédisent pas la survie d’une personne avec un histotype, un stade ou une réponse particuliers [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</p><p>Rechercher aussi les effets du traitement : hypocalcémie après chirurgie, troubles de voix, difficultés à avaler, effets salivaires du radioiode, surtraitement hormonal, complications des inhibiteurs et détresse psychologique. L’évolution favorable d’un marqueur ne suffit pas à conclure que la qualité de vie est satisfaisante [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><div class="key"><b>À retenir.</b> Suivi tumoral, suivi des effets indésirables et qualité de vie se complètent. Une survie de population n’est pas un pronostic individuel [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-12">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-13"><h2><span class="n">13</span>Populations particulières et cadre suisse</h2><p>Chez l’enfant, les seuils de taille et les choix de chirurgie de l’adulte ne sont pas appliqués automatiquement. L’<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA</a> recommande une équipe expérimentée en cancer thyroïdien pédiatrique, un bilan cervical complet et une discussion individualisée de l’activité de radioiode. Les recommandations 2022 reposent souvent sur des données limitées et un consensus ; les doses d’une indication pédiatrique de gliome ne sont pas des doses de cancer thyroïdien [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p>Grossesse et allaitement changent le calendrier et les moyens thérapeutiques. La substitution hormonale nécessaire doit être poursuivie et contrôlée pendant la grossesse ; les besoins peuvent évoluer. L’iode 131 est contre-indiqué pendant grossesse et allaitement. La FI Curium demande l’arrêt de l’allaitement au moins huit semaines avant, sans reprise pour cet enfant. La chirurgie peut parfois être différée ou organisée pendant le deuxième trimestre si nécessaire, selon la maladie et l’équipe ; aucune stratégie unique ne convient à toute situation [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><p>Chez la personne âgée, les comorbidités cardiaques, le risque osseux, l’état fonctionnel et les préférences modifient la balance de suppression hormonale, de chirurgie ou de traitement systémique. Une insuffisance rénale peut augmenter l’exposition au radioiode et modifier la sécurité d’autres traitements. L’absence de données dans une FI n’autorise pas à inventer une réduction numérique de dose [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p>En Suisse, les personnes et institutions soumises à déclaration transmettent les données oncologiques et informent la personne. Le médecin qui annonce le diagnostic assume l’information ; le registre dépend du domicile, et les moins de vingt ans relèvent du registre du cancer de l’enfant. Ces obligations ne sont pas une indication thérapeutique [<a data-reference-source="1" href="https://www.nkrs.ch/fr/informations-relatives-a-l-obligation-de-declarer" target="_blank" rel="noopener">S27</a>].</p><p>Enfin, autorisation Swissmedic, indication de FI, inscription dans la liste des spécialités et remboursement doivent être vérifiés séparément. Une prise en charge exceptionnelle selon les articles 71 a–71 d exige une procédure et l’accord spécial de l’assureur après consultation de son médecin-conseil. Aucune limitation individuelle de chaque produit ni règle spécifique <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> d’aptitude à la conduite, de <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">Suva</a> ou d’assurance-invalidité n’est certifiée par les lectures de ce cours [<a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><div class="key"><b>À retenir.</b> Vérifier population, produit, calendrier et financement. Une autorisation ou une recommandation étrangère n’accorde pas automatiquement le remboursement suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-13">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-14"><h2><span class="n">14</span>Critères formels et paramètres à garder ensemble</h2><div class="alert"><b>Diagnostic formel.</b> Une lésion suspecte demande une caractérisation appropriée, généralement cytologique puis histologique selon la situation. Le diagnostic du carcinome folliculaire ou oncocytaire encapsulé dépend de critères d’invasion sur le tissu ; une cytologie « folliculaire » ne suffit pas. Le type, le grade et l’étendue sont documentés. Une menace respiratoire est prise en charge avant que tout ce bilan soit terminé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</div><table class="t" data-c73-table="1"><thead><tr><th>Repère</th><th>Sens exact</th><th>Limite</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a></td><td>Code suisse 2024 de siège, sans subdivision.</td><td><a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">C73.9</a> anglais non ajouté au catalogue suisse.</td></tr><tr><td>55 ans</td><td>Séparation des groupes de stade des formes différenciées dans la fiche <button class="w" data-k="c73-tnm">TNM</button> 9.</td><td>Ne pas appliquer le même mécanisme d’âge au médullaire ou à l’anaplasique.</td></tr><tr><td>1 cm</td><td>Définition de microcarcinome papillaire.</td><td>Taille ne garantit pas l’absence de sous-type agressif.</td></tr><tr><td>0,5–2 mU/L</td><td>Exemple d’objectif de <button class="w" data-k="c73-tsh">thyréostimuline</button> après excellente réponse selon directive allemande.</td><td>Objectif biologique, pas dose ni norme universelle pour tout patient.</td></tr><tr><td>1,1 gigabecquerel =1100 mégabecquerels</td><td>Conversion d’activité radioactive.</td><td>Activité n’est pas dose absorbée en grays ni présentation du produit.</td></tr><tr><td>2 injections de 0,9 mg à 24 h</td><td>Schéma <button class="w" data-k="c73-rh">Thyrogen</button>, voie intramusculaire.</td><td>Indication et calendrier nucléaire vérifiés ; ne pas injecter dans une veine.</td></tr></tbody></table><p>Avant une décision, reformuler la question : quel histotype, quel risque immédiat, quelle étendue, quel objectif, quelle preuve et quelle population ? Une addition de marqueurs, une catégorie échographique et un stade ne se remplacent pas mutuellement. Les seuils proches d’une limite demandent une lecture attentive des unités, des inégalités et de la méthode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><div class="key"><b>À retenir.</b> Cancer thyroïdien : preuve tissulaire adaptée, classification explicite, urgence reconnue et traitement contextualisé. Les nombres restent liés à leur question [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-14">Essentiel de cette partie</button></section><div class="src"><h3>Sources effectivement consultées</h3><ul data-justification-sources="1"><li><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] C73 : libellé suisse local</a> — <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM2024</a>. Lecture : Objet <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> et liste de codes. Limite : Métadonnées suisses locales ; document officiel intégral non relu.</li><li><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">[S2] C73, bloc C73–C75</a> — 2024. Lecture : Entrée <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> et en-tête du bloc. Limite : Classification allemande 2024, pas recommandation de traitement.</li><li><a
