<section class="ilot" id="c73-p-4"><h2><span class="n">4</span>Lenvatinib : indication progressive et surveillance</h2><p><button class="w" data-k="c73-lenv">Lenvima</button>, FI suisse de septembre 2025, est étudié ici uniquement dans son indication de cancer différencié. Le statut réfractaire au radioiode ne suffit pas à lui seul à imposer un inhibiteur : progression, symptômes, menace et possibilités locales sont discutés au préalable [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Situation</th><th>FI <button class="w" data-k="c73-lenv">Lenvima</button> septembre 2025</th><th>Limite</th></tr></thead><tbody><tr><td>Indication thyroïdienne</td><td>Cancer différencié progressif, avancé ou métastatique, réfractaire au radioiode.</td><td>Pas tout cancer stable ayant reçu du radioiode.</td></tr><tr><td>Dose adulte</td><td>24 mg par voie orale une fois par jour, avec ou sans nourriture.</td><td>Deux capsules 10 mg et une 4 mg ; vérifier la prescription.</td></tr><tr><td>Paliers de réduction</td><td>20 mg, puis 14 mg, puis 10 mg par jour.</td><td>Ne pas sauter automatiquement au palier 14 mg.</td></tr><tr><td>Insuffisance rénale sévère</td><td>14 mg par jour dans le contexte différencié ; terminale non recommandée.</td><td>Ne pas transposer une dose d’un autre cancer.</td></tr><tr><td>Insuffisance hépatique</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child A</a>/B sans adaptation ; Child C14 mg par jour pour cette indication.</td><td>Doses d’autres indications différentes.</td></tr></tbody></table><p>Contrôler l’hypertension avant le début, puis la surveiller à une semaine, toutes les deux semaines pendant les deux premiers mois et ensuite mensuellement selon la FI. Protéinurie, déshydratation, fonction rénale, bilan hépatique, électrolytes et risque cardiaque demandent des contrôles. Une invasion proche de gros vaisseaux ou des voies digestives rend particulièrement pertinentes les complications hémorragiques, fistules et perforations [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</p><p>La FI prévoit une interruption six jours avant une chirurgie élective et une reprise après appréciation de la cicatrisation. Grossesse et allaitement sont contre-indiqués ; contraception pendant le traitement et un mois après, avec méthode non hormonale supplémentaire si contraception orale. La sécurité et l’efficacité ne sont pas établies de 2 à 18 ans et le produit ne doit pas être utilisé avant 2 ans ; aucune dose pédiatrique de cancer thyroïdien n’est déduite ici [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</p><div class="key"><b>À retenir.</b> 24 mg et ses paliers appartiennent à une indication précise. Hypertension, protéinurie, saignement et cicatrisation font partie du choix et du suivi [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-4">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-5"><h2><span class="n">5</span>Selpercatinib : <button class="w" data-k="c73-ret">RET</button>, indication et interactions</h2><p><button class="w" data-k="c73-sel">Retsevmo</button>, FI suisse de décembre 2025, impose de préciser l’altération et la population. Les autorisations ou recommandations étrangères de première ligne ne remplacent pas les conditions du libellé suisse. Le tableau ne remplace pas la vérification de la molécule et des traitements antérieurs [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Question</th><th>FI <button class="w" data-k="c73-sel">Retsevmo</button> décembre 2025</th><th>Précision</th></tr></thead><tbody><tr><td>Papillaire</td><td>Adulte, fusion <button class="w" data-k="c73-ret">RET</button>, maladie avancée nécessitant un traitement systémique après progression sous traitement préalable incluant radioiode.</td><td>Ne pas élargir à toute histologie ou tout enfant.</td></tr><tr><td>Médullaire</td><td>Mutation <button class="w" data-k="c73-ret">RET</button>, avancé, adulte et adolescent dès 12 ans.</td><td>Mutation et fusion ne sont pas synonymes.</td></tr><tr><td>Dose selon poids</td><td>Moins 50 kg : 120 mg deux fois par jour ; au moins 50 kg : 160 mg deux fois par jour.</td><td>Prises orales espacées d’environ 12 heures.</td></tr><tr><td>Foie sévèrement atteint</td><td>80 mg deux fois par jour.</td><td>Vérifier la définition et l’ensemble des ajustements de la FI.</td></tr><tr><td>Rein</td><td>Pas d’adaptation pour un débit de filtration glomérulaire estimé d’au moins 15 mL/min/1,73 m² ; stade terminal/dialyse sans données.</td><td>Ne pas inventer une dose de dialyse.</td></tr><tr><td>Médicaments de l’acidité gastrique</td><td>Inhibiteur de pompe : prendre avec nourriture ; antagoniste <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">H2</a> : <button class="w" data-k="c73-sel">Retsevmo</button> 2 heures avant.</td><td>Antiacide 2 heures avant ou après ; pas délai supplémentaire inventé.</td></tr></tbody></table><p>Éviter autant que possible les inhibiteurs puissants ou modérés de <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">CYP3A</a> et les inducteurs pertinents ; les ajustements dépendent du niveau d’inhibition et de la dose initiale. Par exemple, un inhibiteur puissant conduit dans la FI à 40 mg deux fois par jour à partir de 120 mg, ou 80 mg deux fois par jour à partir de 160 mg. Il ne faut pas appliquer une réduction unique à toute interaction [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><p>Surveiller pression artérielle, électrocardiogramme, électrolytes, fonction hépatique et thyroïdienne selon les délais du produit. Une pneumopathie, un saignement ou une hypertension importante appelle une évaluation et une adaptation. La créatinine peut aussi augmenter par effet sur sa sécrétion tubulaire ; cela n’autorise pas à ignorer une véritable atteinte rénale [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><p>Interrompre au moins sept jours avant une chirurgie élective ; après chirurgie majeure, attendre au moins deux semaines et une cicatrisation adéquate. Chez l’adolescent, les effets sur les cartilages de croissance demandent une attention particulière. La grossesse relève d’une appréciation spécialisée du bénéfice et du risque ; l’allaitement est évité pendant le traitement et pendant deux semaines après. Les mesures de contraception concernent les deux sexes et se poursuivent deux semaines après [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><div class="key"><b>À retenir.</b> Un résultat <button class="w" data-k="c73-ret">RET</button> ne suffit pas : vérifier mutation ou fusion, âge, poids, indication, interactions et chirurgie prévue [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-5">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-6"><h2><span class="n">6</span>Dabrafénib et tramétinib : deux partenaires à surveiller</h2><p>Les deux FI suisses d’août 2026 comportent une indication agnostique conditionnelle chez l’adulte. La directive allemande discute l’association en néoadjuvant pour certaines formes anaplasiques non résécables <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">BRAF</a> <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">V600E</a>. Cette recommandation et les conditions suisses ne sont pas confondues : l’utilisation concrète exige une vérification spécialisée de l’indication et de l’accès [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI suisses Tafinlar et Mekinist, août 2026</th><th>Piège</th></tr></thead><tbody><tr><td>Indication agnostique adulte</td><td>Tumeur solide <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">BRAF</a> <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">V600E</a> non résécable ou métastatique, progression après traitement préalable et absence d’alternative satisfaisante.</td><td>Ne certifie pas toute utilisation néoadjuvante première ligne dans l’anaplasique.</td></tr><tr><td>Dabrafénib</td><td>150 mg deux fois par jour par voie orale.</td><td>Dose adulte, pas tableau pédiatrique de gliome.</td></tr><tr><td>Tramétinib</td><td>2 mg une fois par jour par voie orale.</td><td>Deux médicaments, deux fréquences.</td></tr><tr><td>Repas</td><td>Au moins 1 heure avant ou 2 heures après un repas.</td><td>Coordonner les prises selon la prescription.</td></tr><tr><td>Fièvre</td><td>Dès 38°C, interrompre les deux partenaires et rechercher notamment une infection.</td><td>Ne pas interrompre seulement le dabrafénib.</td></tr><tr><td>Fonctions d’organes</td><td>Pas d’ajustement pour rein léger/modéré ou foie léger ; précautions et données limitées au-delà.</td><td>Aucune réduction numérique universelle inventée.</td></tr></tbody></table><p>La pyrexie peut s’accompagner de frissons, déshydratation, hypotension et insuffisance rénale. La FI demande l’interruption des deux médicaments dès 38°C, une recherche d’infection et un traitement de soutien approprié. La reprise relève du prescripteur après au moins 24 heures sans symptômes, à dose identique ou réduite selon récidive et gravité. Ce n’est pas un conseil d’autogestion isolée d’une fièvre chez une personne traitée pour cancer [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p>Évaluer la fraction d’éjection ventriculaire gauche avant traitement, à un mois puis environ tous les trois mois. Contrôler le foie toutes les quatre semaines pendant six mois, puis selon la clinique. Une nouvelle anomalie visuelle ou respiratoire nécessite une évaluation rapide ; rétinopathie, atteinte cardiaque, pneumopathie, saignement et réactions cutanées graves font partie des risques [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p>Le dabrafénib a de nombreuses interactions enzymatiques et peut réduire l’efficacité des contraceptifs hormonaux. Une méthode alternative est nécessaire ; les mesures contraceptives de l’association tiennent compte du délai d’au moins seize semaines après le tramétinib. Grossesse et allaitement exigent une vérification spécialisée ; les indications pédiatriques de gliome dès un an ne créent pas une dose de cancer thyroïdien pédiatrique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><div class="key"><b>À retenir.</b> Une association n’est pas un seul médicament : voies, fréquences, interactions et conduite devant la fièvre doivent rester explicites [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-6">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-7"><h2><span class="n">7</span>Prescription, autorisation et remboursement</h2><p>La FI décrit un produit et son autorisation ; une recommandation clinique répond à une population et à une question ; la liste des spécialités et ses limitations concernent la prise en charge. Ces documents doivent être lus ensemble sans supposer que l’un remplace les autres [<a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><p>Les conditions d’un usage hors indication ou hors limitation et les possibilités de remboursement exceptionnel sont appréciées individuellement. Le cadre <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">OFSP</a> exige notamment l’accord spécial de l’assureur après consultation du médecin-conseil. L’accès urgent à une équipe oncologique ne doit pas être assimilé à une garantie financière automatique [<a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><p>Aucune limitation individuelle actuelle de chacun des médicaments n’est certifiée dans cette lecture ciblée. Les fiches professionnelles sont datées ; cela ne certifie pas le stock, une disponibilité locale immédiate ou le financement d’un schéma pour une personne donnée. Expliquer cette distinction permet de discuter le plan concrètement sans annoncer une promesse non vérifiée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><div class="key"><b>À retenir.</b> Vérifier la clinique, le libellé du produit et l’accès réel. Ne pas transformer une source étrangère ou une cible moléculaire en accord suisse automatique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-7">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-8"><h2><span class="n">8</span>Sorafénib : dose, peau, calcium et fonction thyroïdienne</h2><p><button class="w" data-k="c73-sor">Nexavar</button>, FI suisse de novembre 2023, conserve une indication dans le cancer différencié progressif réfractaire au radioiode. Il ne faut pas comparer directement les résultats d’essais différents pour affirmer une supériorité individuelle sur un autre inhibiteur [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <button class="w" data-k="c73-sor">Nexavar</button> novembre 2023</th><th>Limite</th></tr></thead><tbody><tr><td>Indication</td><td>Cancer différencié progressif, avancé ou métastatique, réfractaire au radioiode.</td><td>Pas un traitement de tout nodule ni de toute maladie stable.</td></tr><tr><td>Dose orale</td><td>400 mg deux fois par jour, soit 800 mg par jour.</td><td>À jeun ou avec un repas léger pauvre en graisses.</td></tr><tr><td>Réductions thyroïdiennes</td><td>600 mg par jour en deux prises, puis 400 mg par jour, puis 200 mg par jour.</td><td>Ne pas copier directement le palier d’un autre type de cancer.</td></tr><tr><td>Rein</td><td>Pas d’adaptation légère, modérée ou sévère selon la FI ; dialyse sans expérience.</td><td>Surveiller hydratation et électrolytes ; absence de réduction ne signifie pas absence de risque.</td></tr><tr><td>Foie et enfant</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child A</a>/B sans adaptation ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child C</a> sans expérience. Enfant et adolescent non prévus.</td><td>Aucune dose <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child C</a> ou pédiatrique inventée.</td></tr></tbody></table><p>Rechercher et surveiller syndrome main-pied, hypertension, diarrhée ou déshydratation, atteinte cardiaque, saignement et troubles des électrolytes. La FI souligne le contrôle de la calcémie dans le cancer thyroïdien, notamment en cas d’antécédent d’hypoparathyroïdie, et le contrôle mensuel de la <button class="w" data-k="c73-tsh">thyréostimuline</button> avec adaptation de la substitution si nécessaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p><p>Le risque de saignement rend importantes les infiltrations trachéales, bronchiques ou œsophagiennes, qui doivent être traitées localement avant l’administration selon la FI. Une chirurgie majeure nécessite une interruption préventive et une appréciation de la cicatrisation avant reprise ; aucun délai numérique non donné par cette FI n’est ajouté ici [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p><p>Les inducteurs enzymatiques peuvent diminuer l’exposition ; les dérivés de la coumarine et d’autres associations exigent leur propre surveillance. Le médicament ne doit pas être administré pendant une grossesse sauf nécessité absolue ; contraception fiable pendant le traitement et absence d’allaitement sont requises selon le texte. Aucun schéma pédiatrique ou de dialyse n’est déduit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p><div class="key"><b>À retenir.</b> Vérifier les paliers propres au cancer différencié et surveiller peau, pression, calcium et fonction thyroïdienne [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-8">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-9"><h2><span class="n">9</span>Cabozantinib : produit et ligne thérapeutique</h2><p><button class="w" data-k="c73-cabo">Cabometyx</button>, FI suisse de décembre 2025, est décrit dans son indication de cancer différencié après un traitement ciblant la voie du facteur de croissance vasculaire. La forme pharmaceutique, les indications et les populations d’un autre produit de cabozantinib ne sont pas assimilées à cette fiche [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <button class="w" data-k="c73-cabo">Cabometyx</button> décembre 2025</th><th>Précision</th></tr></thead><tbody><tr><td>Indication thyroïdienne</td><td>Adulte, cancer différencié avancé ou métastatique, réfractaire ou non éligible au radioiode, progression pendant ou après un traitement ciblant le facteur de croissance de l’endothélium vasculaire.</td><td>Cette FI n’est pas une autorisation de tout cabozantinib dans le médullaire.</td></tr><tr><td>Monothérapie orale</td><td>60 mg une fois par jour ; réductions 40 mg puis 20 mg par jour.</td><td>Ne pas copier la dose d’une association destinée au cancer rénal.</td></tr><tr><td>Repas</td><td>Ne rien manger pendant au moins 2 heures avant et 1 heure après.</td><td>Comprimés entiers.</td></tr><tr><td>Foie</td><td>Léger : pas d’ajustement ; modéré : aucune recommandation numérique possible ; sévère : non recommandé.</td><td>Ne pas inventer un palier <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child B</a>.</td></tr><tr><td>Rein et enfant</td><td>Léger/modéré : prudence ; sévère : non recommandé. Utilisation pédiatrique non autorisée.</td><td>Pas dose enfant ni dose rénale sévère proposée.</td></tr></tbody></table><p>Surveiller précocement pression artérielle, protéines urinaires, calcium et autres électrolytes, fonction hépatique, peau et symptômes digestifs. Fistules, perforations, hémorragies, thromboses et défaut de cicatrisation sont des risques importants. Un examen dentaire et une hygiène buccale adaptée participent à la prévention des complications maxillaires [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p><p>Dans la mesure du possible, la FI demande un arrêt au moins 28 jours avant une chirurgie programmée, y compris dentaire ; la reprise repose sur une cicatrisation adéquate. Les inhibiteurs et inducteurs enzymatiques ainsi que les autres traitements concomitants doivent être vérifiés ; le calendrier d’une autre molécule n’est pas transposé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p><p>Éviter la grossesse, sauf nécessité absolue évaluée ; contraception efficace pour les deux sexes et partenaires pendant le traitement et au moins quatre mois après. La contraception orale demande une méthode supplémentaire. L’allaitement n’a pas lieu pendant le traitement ni pendant au moins quatre mois après [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p><div class="key"><b>À retenir.</b> <button class="w" data-k="c73-cabo">Cabometyx</button> : 60 mg en monothérapie dans une indication précise, paliers 40 puis 20 mg, repas et chirurgie avec délais propres au produit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-9">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-10"><h2><span class="n">10</span>Vandétanib : indication <button class="w" data-k="c73-ret">RET</button> et risque électrique cardiaque</h2><p><button class="w" data-k="c73-van">Caprelsa</button>, FI suisse d’avril 2025, exige une forme médullaire agressive et symptomatique avec mutation <button class="w" data-k="c73-ret">RET</button> dans la population indiquée. Ce libellé n’est pas remplacé par une indication étrangère plus large ou pédiatrique. Le choix avec les autres options relève de l’équipe spécialisée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <button class="w" data-k="c73-van">Caprelsa</button> avril 2025</th><th>Point de sécurité</th></tr></thead><tbody><tr><td>Indication</td><td>Adulte, cancer médullaire agressif et symptomatique avec mutation <button class="w" data-k="c73-ret">RET</button>, non opérable, avancé ou métastatique.</td><td>Pas indication suisse universelle de tout cancer médullaire.</td></tr><tr><td>Dose orale</td><td>300 mg une fois par jour, avec ou sans repas ; paliers 200 puis 100 mg.</td><td>Pas dose pédiatrique.</td></tr><tr><td>Clairance de la créatinine</td><td>De 30 mL/min inclus à moins de 50 mL/min : dose initiale 200 mg.</td><td>Clairance inférieure à 30 mL/min : contre-indication de la FI.</td></tr><tr><td>Foie</td><td>Déconseillé si bilirubine supérieure à 1,5 fois la limite normale.</td><td>Données insuffisantes, pas réduction inventée.</td></tr><tr><td>Électrocardiogramme et électrolytes</td><td>Avant traitement, puis 2–4 semaines, 8–12 semaines et tous les 3 mois.</td><td>Plus fréquent si besoin ; contrôler calcium, magnésium et potassium.</td></tr></tbody></table><p>Le syndrome congénital du <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">QT</a> long, l’insuffisance rénale sévère et l’allaitement sont contre-indiqués. La rubrique posologique dit aussi « déconseillé » pour le rein sévère ; cela n’annule pas la contre-indication explicite. Un intervalle corrigé durablement supérieur à 480 millisecondes empêche l’instauration selon la FI ; une valeur d’au moins 500 millisecondes impose l’arrêt, avec éventuelle reprise médicale seulement après correction durable et réévaluation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p><p>Éviter les associations qui allongent cet intervalle et rechercher les interactions. Une diarrhée peut aggraver la perte d’électrolytes et le risque d’arythmie. Surveiller aussi pression, peau/photosensibilité, foie, rein et symptômes pulmonaires ; une suspicion de pneumopathie interstitielle impose l’interruption et l’évaluation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p><p>La grossesse exige une appréciation du bénéfice et du risque ; contraception fiable pendant le traitement et au moins quatre mois après pour les personnes concernées. Avant une chirurgie, envisager une interruption d’au moins quatre semaines selon la balance individuelle ; ne pas administrer pendant au moins deux semaines après chirurgie majeure et attendre une cicatrisation suffisante [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p><div class="key"><b>À retenir.</b> Le risque d’arythmie exige une sélection initiale, des contrôles et une lecture des contre-indications ; la dose rénale ne contourne pas une contre-indication [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-10">Essentiel de cette partie</button></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="c73-tsh" data-title="Thyréostimuline : fonction et objectif"><p>La <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyréostimuline</a> renseigne sur le rétrocontrôle hormonal, pas directement sur la nature d’un nodule. Une valeur normale n’exclut pas un cancer. Après une forme différenciée traitée, un objectif de suppression peut être discuté selon risque/réponse et risques cardiaques ou osseux ; ce n’est ni une norme de dépistage ni une dose fixe [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p></template>

<template data-pop="c73-tirads" data-title="Score échographique et taille"><p>Chez l’adulte, le guide <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA</a> 2023 propose la ponction pour <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">EU-TIRADS</a> 3 au-delà de 20 mm, 4 au-delà de 15 mm et 5 au-delà de 10 mm. Un ganglion pathologique ou une extension suspectée peut modifier la décision. Ces seuils ne sont ni des stades ni des seuils pédiatriques automatiques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p></template>
<template data-pop="c73-cyto" data-title="Cellules, tissu et invasion"><p>La cytoponction étudie des cellules. Une néoplasie folliculaire ne prouve pas un carcinome ; l’invasion capsulaire ou vasculaire demande l’étude adéquate du tissu. Confronter la qualité du prélèvement, l’échographie et la catégorie de résultat. Les systèmes britanniques Thy et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda</a> ne sont pas automatiquement superposables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p></template>
<template data-pop="c73-calcitonin" data-title="Calcitonine : question médullaire"><p>La <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">calcitonine</a> est un marqueur lié aux cellules C. Un résultat s’interprète avec méthode, unité et contexte, pas comme un seuil universel indépendant du laboratoire. Les guides ne soutiennent pas un même consensus de dosage systématique pour tout nodule. Une suspicion médullaire doit être coordonnée avec l’équipe experte avant la ponction, compte tenu de stratégies différentes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p></template>
<template data-pop="c73-tg" data-title="Thyroglobuline et anticorps"><p>Le contexte tissulaire et thérapeutique compte : du tissu normal restant après hémi peut produire de la <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyroglobuline</a>. Après thyroïdectomie totale et radioiode, le marqueur répond à une autre question. Associer les anticorps anti-<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyroglobuline</a>, qui peuvent interférer, et interpréter avec méthode, stimulation et imagerie. Une hausse isolée n’impose pas automatiquement un traitement systémique [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p></template>
<template data-pop="c73-tnm" data-title="TNM neuvième édition : ce que le stade décrit"><p>La fiche européenne <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">NDRS</a> v 1.1 du 16 décembre 2025 fournit les groupes <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">UICC</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">TNM</a> 9. Pour une forme différenciée avant 55 ans, absence de métastase distante correspond au stade un et présence au stade deux, quelle que soit l’atteinte ganglionnaire. Le risque de récidive demande d’autres données. Le livre n’a pas été lu et <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">C73.9</a> de la fiche anglaise n’est pas ajouté comme sous-code suisse [<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://doi.org/10.1002/ijc.70561" target="_blank" rel="noopener">S10</a>].</p></template>
<template data-pop="c73-ret" data-title="RET : mutation, fusion et contexte"><p>Une altération de <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> doit être caractérisée : mutation ou fusion, germinale ou somatique. Les mutations d’un cancer médullaire et les fusions d’un cancer papillaire ne désignent pas la même indication de selpercatinib. Un résultat tumoral ne prouve pas à lui seul une prédisposition familiale ; l’âge et les traitements antérieurs restent pertinents [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><p>Un cancer médullaire confirmé conduit à discuter l’analyse germinale <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> et le conseil génétique, même sans histoire familiale. Si un statut germinal négatif n’est pas établi avant chirurgie, rechercher les atteintes endocriniennes associées. Un phéochromocytome présent est pris en charge avant l’intervention thyroïdienne pour éviter le danger des catécholamines ; ne pas assimiler toute altération somatique à une prédisposition familiale [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p></template>



<template data-pop="c73-lt4" data-title="Euthyrox : dose et objectif"><table class="t" data-c73-table="1"><thead><tr><th>Question</th><th>Repère FI février 2023</th><th>Limite clinique</th></tr></thead><tbody><tr><td>Produit et voie</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Euthyrox</a>, comprimés 25–200 microgrammes ; voie orale.</td><td>Vérifier présentation et prescription.</td></tr><tr><td>Après thyroïdectomie pour cancer</td><td>Plage 150–300 microgrammes par jour dans la FI.</td><td>Pas une dose initiale universelle ; objectif de <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyréostimuline</a> et risques individuels.</td></tr><tr><td>Prise</td><td>À jeun, au moins 30 minutes avant le petit déjeuner.</td><td>Régularité et interactions modifient l’exposition.</td></tr><tr><td>Absorption</td><td>Calcium, fer ou aluminium au moins 2 heures après ; résines 4–5 heures après.</td><td>Ne pas remplacer ces délais par une règle inventée commune à tous les médicaments.</td></tr><tr><td>Fonctions d’organes</td><td>Pharmacocinétique rénale/hépatique non étudiée.</td><td>Aucune adaptation numérique universelle déduite.</td></tr></tbody></table><p>FI suisse février 2023. Une plage d’autorisation n’est pas une première dose universelle. Microgramme et milligramme diffèrent d’un facteur mille. Adapter au besoin, au suivi et aux risques, sans dose rénale ou hépatique inventée [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p></template>

<template data-pop="c73-rh" data-title="Thyrogen : voie et calendrier"><table class="t" data-c73-table="1"><thead><tr><th>Étape</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">Thyrogen</a> juin 2023</th><th>Point de sécurité</th></tr></thead><tbody><tr><td>Injection</td><td>0,9 mg par voie intramusculaire, puis 0,9 mg 24 heures après.</td><td>Voie exclusivement intramusculaire, pas intraveineuse.</td></tr><tr><td>Radioiode</td><td>24 heures après la seconde injection.</td><td>Planifier avec le service nucléaire.</td></tr><tr><td>Thyroglobuline stimulée</td><td>Prélèvement 72 heures après la seconde injection.</td><td>Anticorps et méthode restent pertinents.</td></tr><tr><td>Préablation</td><td>Avec 1,1–3,7 gigabecquerels après chirurgie quasi totale ou totale, sans métastase distante.</td><td>Ne pas élargir automatiquement à une maladie métastatique.</td></tr></tbody></table><p>FI juin 2023. Le contexte préablation est sans métastase distante. Risques de gonflement tumoral et cardiaques évalués ; population pédiatrique exceptionnelle et adaptation rénale non établie. Ne pas transformer un usage hors indication étranger en autorisation suisse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p></template>
<template data-pop="c73-lenv" data-title="Lenvima : dose différenciée et sécurité"><table class="t" data-c73-table="1"><thead><tr><th>Situation</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Lenvima</a> septembre 2025</th><th>Limite</th></tr></thead><tbody><tr><td>Indication thyroïdienne</td><td>Cancer différencié progressif, avancé ou métastatique, réfractaire au radioiode.</td><td>Pas tout cancer stable ayant reçu du radioiode.</td></tr><tr><td>Dose adulte</td><td>24 mg par voie orale une fois par jour, avec ou sans nourriture.</td><td>Deux capsules 10 mg et une 4 mg ; vérifier la prescription.</td></tr><tr><td>Paliers de réduction</td><td>20 mg, puis 14 mg, puis 10 mg par jour.</td><td>Ne pas sauter automatiquement au palier 14 mg.</td></tr><tr><td>Insuffisance rénale sévère</td><td>14 mg par jour dans le contexte différencié ; terminale non recommandée.</td><td>Ne pas transposer une dose d’un autre cancer.</td></tr><tr><td>Insuffisance hépatique</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child A</a>/B sans adaptation ; Child C14 mg par jour pour cette indication.</td><td>Doses d’autres indications différentes.</td></tr></tbody></table><p>FI septembre 2025. Pression, protéinurie, foie/rein, saignement et fistules sont surveillés ; chirurgie élective : interruption six jours avant puis appréciation de la cicatrisation. Dose et paliers d’un autre cancer ne sont pas transposés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</p></template>
<template data-pop="c73-sel" data-title="Retsevmo : indication et poids"><table class="t" data-c73-table="1"><thead><tr><th>Question</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">Retsevmo</a> décembre 2025</th><th>Précision</th></tr></thead><tbody><tr><td>Papillaire</td><td>Adulte, fusion <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a>, maladie avancée nécessitant un traitement systémique après progression sous traitement préalable incluant radioiode.</td><td>Ne pas élargir à toute histologie ou tout enfant.</td></tr><tr><td>Médullaire</td><td>Mutation <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a>, avancé, adulte et adolescent dès 12 ans.</td><td>Mutation et fusion ne sont pas synonymes.</td></tr><tr><td>Dose selon poids</td><td>Moins 50 kg : 120 mg deux fois par jour ; au moins 50 kg : 160 mg deux fois par jour.</td><td>Prises orales espacées d’environ 12 heures.</td></tr><tr><td>Foie sévèrement atteint</td><td>80 mg deux fois par jour.</td><td>Vérifier la définition et l’ensemble des ajustements de la FI.</td></tr><tr><td>Rein</td><td>Pas d’adaptation pour un débit de filtration glomérulaire estimé d’au moins 15 mL/min/1,73 m² ; stade terminal/dialyse sans données.</td><td>Ne pas inventer une dose de dialyse.</td></tr><tr><td>Médicaments de l’acidité gastrique</td><td>Inhibiteur de pompe : prendre avec nourriture ; antagoniste <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">H2</a> : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">Retsevmo</a> 2 heures avant.</td><td>Antiacide 2 heures avant ou après ; pas délai supplémentaire inventé.</td></tr></tbody></table><p>FI décembre 2025. Interactions avec <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">CYP3A</a> et médicaments modifiant l’acidité nécessitent leur propre lecture ; aucune réduction unique ne convient à toutes. Contrôler notamment foie, électrocardiogramme, électrolytes et pression. Pas dose de dialyse inventée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p></template>


<template data-pop="c73-profiles" data-title="PROFILES : raisonnement et communication"><p>Le référentiel 2017 inclut l’histologie, la cytologie et les tests moléculaires anormaux, ainsi que l’évaluation partagée des risques de maladies fréquentes, notamment oncologiques. La correspondance locale <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a>–situations 159/227 est pédagogique et non un tableau officiel <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">CIM</a>–<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a>. Elle ne garantit pas une question d’examen [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p></template>

<template data-pop="c73-sor" data-title="Nexavar : indication et paliers thyroïdiens"><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">Nexavar</a> novembre 2023</th><th>Limite</th></tr></thead><tbody><tr><td>Indication</td><td>Cancer différencié progressif, avancé ou métastatique, réfractaire au radioiode.</td><td>Pas un traitement de tout nodule ni de toute maladie stable.</td></tr><tr><td>Dose orale</td><td>400 mg deux fois par jour, soit 800 mg par jour.</td><td>À jeun ou avec un repas léger pauvre en graisses.</td></tr><tr><td>Réductions thyroïdiennes</td><td>600 mg par jour en deux prises, puis 400 mg par jour, puis 200 mg par jour.</td><td>Ne pas copier directement le palier d’un autre type de cancer.</td></tr><tr><td>Rein</td><td>Pas d’adaptation légère, modérée ou sévère selon la FI ; dialyse sans expérience.</td><td>Surveiller hydratation et électrolytes ; absence de réduction ne signifie pas absence de risque.</td></tr><tr><td>Foie et enfant</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child A</a>/B sans adaptation ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child C</a> sans expérience. Enfant et adolescent non prévus.</td><td>Aucune dose <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child C</a> ou pédiatrique inventée.</td></tr></tbody></table><p>FI suisse novembre 2023. Surveiller peau, pression, calcémie et fonction thyroïdienne. Les doses du cancer rénal ou hépatique ne remplacent pas les paliers thyroïdiens ; aucune dose de dialyse ou pédiatrique n’est déduite [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p></template>
<template data-pop="c73-cabo" data-title="Cabometyx : produit et indication différenciée"><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">Cabometyx</a> décembre 2025</th><th>Précision</th></tr></thead><tbody><tr><td>Indication thyroïdienne</td><td>Adulte, cancer différencié avancé ou métastatique, réfractaire ou non éligible au radioiode, progression pendant ou après un traitement ciblant le facteur de croissance de l’endothélium vasculaire.</td><td>Cette FI n’est pas une autorisation de tout cabozantinib dans le médullaire.</td></tr><tr><td>Monothérapie orale</td><td>60 mg une fois par jour ; réductions 40 mg puis 20 mg par jour.</td><td>Ne pas copier la dose d’une association destinée au cancer rénal.</td></tr><tr><td>Repas</td><td>Ne rien manger pendant au moins 2 heures avant et 1 heure après.</td><td>Comprimés entiers.</td></tr><tr><td>Foie</td><td>Léger : pas d’ajustement ; modéré : aucune recommandation numérique possible ; sévère : non recommandé.</td><td>Ne pas inventer un palier <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child B</a>.</td></tr><tr><td>Rein et enfant</td><td>Léger/modéré : prudence ; sévère : non recommandé. Utilisation pédiatrique non autorisée.</td><td>Pas dose enfant ni dose rénale sévère proposée.</td></tr></tbody></table><p>FI décembre 2025. Cette formulation ne devient pas une indication médullaire par analogie. Précautions de saignement, fistule et cicatrisation ; arrêt 28 jours avant chirurgie programmée si possible. Vérifier les interactions et la reprise après cicatrisation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p></template>
<template data-pop="c73-van" data-title="Caprelsa : indication, rein et risque cardiaque"><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">Caprelsa</a> avril 2025</th><th>Point de sécurité</th></tr></thead><tbody><tr><td>Indication</td><td>Adulte, cancer médullaire agressif et symptomatique avec mutation <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a>, non opérable, avancé ou métastatique.</td><td>Pas indication suisse universelle de tout cancer médullaire.</td></tr><tr><td>Dose orale</td><td>300 mg une fois par jour, avec ou sans repas ; paliers 200 puis 100 mg.</td><td>Pas dose pédiatrique.</td></tr><tr><td>Clairance de la créatinine</td><td>De 30 mL/min inclus à moins de 50 mL/min : dose initiale 200 mg.</td><td>Clairance inférieure à 30 mL/min : contre-indication de la FI.</td></tr><tr><td>Foie</td><td>Déconseillé si bilirubine supérieure à 1,5 fois la limite normale.</td><td>Données insuffisantes, pas réduction inventée.</td></tr><tr><td>Électrocardiogramme et électrolytes</td><td>Avant traitement, puis 2–4 semaines, 8–12 semaines et tous les 3 mois.</td><td>Plus fréquent si besoin ; contrôler calcium, magnésium et potassium.</td></tr></tbody></table><p>FI avril 2025. Forme médullaire agressive symptomatique <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> mutée adulte ; pas indication pédiatrique. Rein sévère contre-indiqué malgré la formulation « déconseillé » dans une autre rubrique. Intervalle corrigé durablement supérieur à 480 millisecondes : pas d’instauration ; au moins 500 millisecondes : arrêt et réévaluation médicale [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p></template>

<template data-pop="pareto-c73-1" data-title="Essentiel — Une masse du cou, plusieurs maladies possibles"><p>Une <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyréostimuline</a> normale n’exclut pas un cancer. Identifier le lignage, l’étendue et l’urgence avant de choisir le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p class="ratio" data-cover="c73-1"></p></template>
<template data-pop="pareto-c73-2" data-title="Essentiel — Définition : code, lignage, grade et stade"><p>Un code de siège ne remplace ni le lignage ni le grade. <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> n’a pas de sous-code suisse dans le catalogue 2024 utilisé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p class="ratio" data-cover="c73-2"></p></template>
<template data-pop="pareto-c73-3" data-title="Essentiel — Épidémiologie suisse : dater le numérateur et le dénominateur"><p>Les 843 cas par an sont une moyenne dérivée des données suisses 2018–2022. Incidence, mortalité et survie demandent des dénominateurs distincts [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Mortality/ONEC_Mortalit__Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</p><p class="ratio" data-cover="c73-3"></p></template>
<template data-pop="pareto-c73-4" data-title="Essentiel — Du tissu normal à la maladie tumorale"><p>Comprendre la fonction normale explique pourquoi un marqueur ou le radioiode ne convient pas à tous les cancers thyroïdiens [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p class="ratio" data-cover="c73-4"></p></template>
<template data-pop="pareto-c73-5" data-title="Essentiel — Risques et génétique : distinguer tumeur et famille"><p>Germinal signifie potentiellement familial ; somatique décrit la tumeur. Un cancer médullaire impose de penser à <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> et aux risques endocriniens associés avant l’opération [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p class="ratio" data-cover="c73-5"></p></template>
<template data-pop="pareto-c73-6" data-title="Essentiel — Anamnèse : évolution, retentissement et projet de vie"><p>La chronologie, la voix, la respiration et les traitements antérieurs changent le raisonnement. Les inquiétudes de la personne font partie du bilan [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p class="ratio" data-cover="c73-6"></p></template>
<template data-pop="pareto-c73-7" data-title="Essentiel — Sémiologie clinique : décrire avant d’interpréter"><p>Un signe est un argument, pas une histologie. L’urgence respiratoire se décide sur le retentissement actuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p class="ratio" data-cover="c73-7"></p></template>
<template data-pop="pareto-c73-8" data-title="Essentiel — Diagnostic : articuler image, cellules et tissu"><p>Échographie, cytologie et histologie répondent à des questions distinctes. Adapter le prélèvement au diagnostic suspecté et à son usage clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p class="ratio" data-cover="c73-8"></p></template>
<template data-pop="pareto-c73-9" data-title="Essentiel — TNM9 : étendue anatomique et risque de récidive"><p>Toujours préciser édition, histotype et âge. <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">TNM</a>, risque de récidive et réponse au traitement ne sont pas des synonymes [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><p class="ratio" data-cover="c73-9"></p></template>
<template data-pop="pareto-c73-10" data-title="Essentiel — Diagnostic différentiel : chercher ce qui change la décision"><p>L’élément discriminant peut être tissulaire. Ne pas confondre apparence, siège et origine [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p class="ratio" data-cover="c73-10"></p></template>
<template data-pop="pareto-c73-11" data-title="Essentiel — Traitement : définir le but avant de choisir le moyen"><p>Ni chirurgie maximale, ni radioiode, ni traitement systémique ne sont automatiques. Le bénéfice attendu, la biologie et les risques guident une décision partagée [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>].</p><p class="ratio" data-cover="c73-11"></p></template>
<template data-pop="pareto-c73-12" data-title="Essentiel — Suivi et pronostic : surveiller la bonne maladie"><p>Suivi tumoral, suivi des effets indésirables et qualité de vie se complètent. Une survie de population n’est pas un pronostic individuel [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</p><p class="ratio" data-cover="c73-12"></p></template>
<template data-pop="pareto-c73-13" data-title="Essentiel — Populations particulières et cadre suisse"><p>Vérifier population, produit, calendrier et financement. Une autorisation ou une recommandation étrangère n’accorde pas automatiquement le remboursement suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><p class="ratio" data-cover="c73-13"></p></template>
<template data-pop="pareto-c73-14" data-title="Essentiel — Critères formels et paramètres à garder ensemble"><p>Cancer thyroïdien : preuve tissulaire adaptée, classification explicite, urgence reconnue et traitement contextualisé. Les nombres restent liés à leur question [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><p class="ratio" data-cover="c73-14"></p></template>
<template data-pop="pareto-c73-e-1" data-title="Essentiel — Biologie : définir ce que le dosage peut montrer"><p>Le nom du dosage doit être suivi de la question qu’il résout. Fonction, marqueur tumoral et complication ne sont pas la même chose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p class="ratio" data-cover="c73-e-1"></p></template>
<template data-pop="pareto-c73-e-2" data-title="Essentiel — Échographie, prélèvement et concordance"><p>La qualité et la concordance du prélèvement comptent. Seuils adultes et exceptions ne se transposent pas directement à l’enfant [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><p class="ratio" data-cover="c73-e-2"></p></template>
<template data-pop="pareto-c73-e-3" data-title="Essentiel — Imagerie d’extension : une indication précise"><p>Un examen d’extension doit répondre à une question qui influence la conduite. Documenter aussi ses conséquences sur le calendrier nucléaire [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><p class="ratio" data-cover="c73-e-3"></p></template>
<template data-pop="pareto-c73-e-4" data-title="Essentiel — Quatre exercices de décision"><p>Comprendre pourquoi la réponse est correcte compte davantage que reconnaître une expression. Préserver âge, histotype, unités et population [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><p class="ratio" data-cover="c73-e-4"></p></template>
<template data-pop="pareto-c73-p-1" data-title="Essentiel — Lévothyroxine : substitution et suppression"><p>Microgramme, dose prescrite et objectif biologique sont distincts. La FI fournit une plage, la situation clinique détermine la dose [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><p class="ratio" data-cover="c73-p-1"></p></template>
<template data-pop="pareto-c73-p-2" data-title="Essentiel — Iode131 : objectif, activité et radioprotection"><p>Le radioiode exige une indication, une activité individualisée, une préparation et des consignes écrites. La conversion d’unités ne remplace aucune de ces décisions [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S21</a>].</p><p class="ratio" data-cover="c73-p-2"></p></template>
<template data-pop="pareto-c73-p-3" data-title="Essentiel — Thyrogen : une stimulation avec un calendrier propre"><p>Deux injections intramusculaires et des délais distincts : vérifier indication, voie et calendrier avant les calculs [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><p class="ratio" data-cover="c73-p-3"></p></template>
<template data-pop="pareto-c73-p-4" data-title="Essentiel — Lenvatinib : indication progressive et surveillance"><p>24 mg et ses paliers appartiennent à une indication précise. Hypertension, protéinurie, saignement et cicatrisation font partie du choix et du suivi [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</p><p class="ratio" data-cover="c73-p-4"></p></template>
<template data-pop="pareto-c73-p-5" data-title="Essentiel — Selpercatinib : RET, indication et interactions"><p>Un résultat <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> ne suffit pas : vérifier mutation ou fusion, âge, poids, indication, interactions et chirurgie prévue [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><p class="ratio" data-cover="c73-p-5"></p></template>
<template data-pop="pareto-c73-p-6" data-title="Essentiel — Dabrafénib et tramétinib : deux partenaires à surveiller"><p>Une association n’est pas un seul médicament : voies, fréquences, interactions et conduite devant la fièvre doivent rester explicites [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p class="ratio" data-cover="c73-p-6"></p></template>
<template data-pop="pareto-c73-p-7" data-title="Essentiel — Prescription, autorisation et remboursement"><p>Vérifier la clinique, le libellé du produit et l’accès réel. Ne pas transformer une source étrangère ou une cible moléculaire en accord suisse automatique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><p class="ratio" data-cover="c73-p-7"></p></template>
<template data-pop="pareto-c73-p-8" data-title="Essentiel — Sorafénib : dose, peau, calcium et fonction thyroïdienne"><p>Vérifier les paliers propres au cancer différencié et surveiller peau, pression, calcium et fonction thyroïdienne [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p><p class="ratio" data-cover="c73-p-8"></p></template>
<template data-pop="pareto-c73-p-9" data-title="Essentiel — Cabozantinib : produit et ligne thérapeutique"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">Cabometyx</a> : 60 mg en monothérapie dans une indication précise, paliers 40 puis 20 mg, repas et chirurgie avec délais propres au produit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p><p class="ratio" data-cover="c73-p-9"></p></template>
<template data-pop="pareto-c73-p-10" data-title="Essentiel — Vandétanib : indication RET et risque électrique cardiaque"><p>Le risque d’arythmie exige une sélection initiale, des contrôles et une lecture des contre-indications ; la dose rénale ne contourne pas une contre-indication [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p><p class="ratio" data-cover="c73-p-10"></p></template>
