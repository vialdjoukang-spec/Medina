 data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">[S3] Clinical practice guidelines for thyroid nodule management</a> — 2023. Lecture : Bilan, échographie, cytologie et traitements des nodules. Limite : Adultes ; seuils non automatiquement pédiatriques.</li><li><a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">[S4] S3 Schilddrüsenkarzinom, Langversion 1.3</a> — Septembre 2026. Lecture : Sections ciblées de diagnostic, chirurgie, suivi hormonal, maladie avancée, médullaire et anaplasique. Limite : Lecture ciblée, pas tout le document ; différences entre guides attribuées.</li><li><a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">[S5] Thyroid cancer assessment and management NG230</a> — 2022, liens systémiques actualisés 2023/2025. Lecture : Recommandations de bilan, traitement et suivi, sections 1.1–1.7. Limite : Contexte britannique, financement non transposé à la Suisse.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">[S6] SEOM-GETNE-TTCC clinical guideline thyroid cancer</a> — Titre 2023, publication 2024. Lecture : Histologie, moléculaire, chirurgie, maladie avancée et suivi. Limite : Autorisations étrangères distinctes des indications suisses.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">[S7] ETA consensus radioiodine post-surgical thyroid cancer</a> — 2022. Lecture : Tableau 1 et recommandations 1–8. Limite : Risque, ablation, adjuvant et maladie connue distingués.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">[S8] Pediatric thyroid nodules and differentiated thyroid carcinoma</a> — 2022. Lecture : Bilan, chirurgie, radioiode et traitements ciblés pédiatriques, parties citées dans le dossier. Limite : Données et consensus de 2022 ; doses adultes non transposées.</li><li><a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">[S9] UICC TNM 9 thyroid gland staging sheet</a> — v 1.1,16 décembre 2025. Lecture : Deux pages entières et page 2 réellement affichée. Limite : Livre de stadification non lu ; code anglais non ajouté au catalogue suisse.</li><li><a data-reference-source="1" href="https://doi.org/10.1002/ijc.70561" target="_blank" rel="noopener">[S10] Changes in the ninth edition of UICC TNM</a> — 2026. Lecture : Introduction et ligne thyroïde du tableau 1. Limite : Article et livre non entièrement lus.</li><li><a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">[S11] Incidence nationale 1983–2022</a> — Miseàjour 21/26 août 2025 ; publication index 11 nov 2025. Lecture : En-têtes et lignes nationales de cancer thyroïdien. Limite : Données 2018–2022, pas comptage 2026 ; valeurs annuelles dérivées des cinq ans.</li><li><a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Mortality/ONEC_Mortalit__Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">[S12] Mortalité nationale 1983–2022</a> — Miseàjour 21/26 août 2025 ; publication index 11 nov 2025. Lecture : En-têtes et lignes nationales de cancer thyroïdien. Limite : Données 2018–2022 ; pas calcul de létalité par division des décès et nouveaux cas.</li><li><a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">[S13] Survie cancer 1980–2022</a> — Miseàjour 21/26 août 2025 ; publication index 11 nov 2025. Lecture : En-têtes, lignes de survie standardisée et note de méthode. Limite : Analyse de période et standardisation par âge ; pas pronostic individuel.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">[S14] Euthyrox : information professionnelle exacte</a> — Février 2023. Lecture : Indications, doses, interactions, populations et sécurité. Limite : La plage de dose ne devient pas une prescription universelle.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">[S15] Sodium iodide (I-131) capsule T Curium</a> — Juillet 2022. Lecture : Indications, doses, interactions, contre-indications et populations. Limite : Plage d’ablation distincte de toute maladie métastatique ; activité individualisée.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">[S16] Thyrogen information professionnelle</a> — Juin 2023. Lecture : Indications, voie, calendrier, populations et sécurité. Limite : Préablation sans métastase distante ; voie intramusculaire seulement.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">[S17] Lenvima information professionnelle</a> — Septembre 2025. Lecture : Indication thyroïdienne, doses, populations, interactions et sécurité. Limite : Doses du cancer différencié, pas d’une autre indication.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">[S18] Retsevmo information professionnelle</a> — Décembre 2025. Lecture : Indications, poids, interactions, populations et sécurité. Limite : Mutation et fusion, âge et traitements antérieurs restent distincts.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">[S19] Tafinlar information professionnelle</a> — Août 2026. Lecture : Indication agnostique adulte et sections de dose, sécurité, interactions et populations. Limite : Lecture ciblée ; indication agnostique conditionnelle, pas dose pédiatrique de cancer thyroïdien.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">[S20] Mekinist information professionnelle</a> — Août 2026. Lecture : Indication agnostique adulte et sections de dose, sécurité, interactions et populations. Limite : Lecture ciblée ; indication agnostique conditionnelle, pas dose pédiatrique de cancer thyroïdien.</li><li><a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">[S21] Radiothérapie métabolique</a> — V2,24 juin 2025. Lecture : Pages 1–4 et tableau 1 de radioprotection. Limite : Directive de radioprotection, pas indication clinique.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">[S22] Thyroid gland : science normale</a> — AnatomyPhysiology 2 e. Lecture : Anatomie, follicule, synthèse hormonale et rétrocontrôle. Limite : Manuel de science normale, pas recommandation américaine de traitement.</li><li><a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">[S23] Notice propre image 1811</a> — 19 juin 2013. Lecture : Notice, licence et photographie originale. Limite : Licence propre et pixels conservés ; image normale.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">[S24] Pitfalls in Challenging Thyroid Tumors</a> — 2020. Lecture : Légende de figure 2, paragraphes associés et licence. Limite : Nomenclature historique 2020 confrontée à la classification 2022.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">[S25] Update from the 2022 WHO Classification of Thyroid Tumors</a> — 2022. Lecture : Terminologie, grade, types histologiques et remarques cliniques. Limite : Revue de classification, pas livre entier ; aucune figure sous licence non commerciale reproduite.</li><li><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S26] PROFILES</a> — 2017. Lecture : Examen cervical et situations 159/227. Limite : Correspondance pédagogique, pas tableau officiel de codes ni question garantie.</li><li><a data-reference-source="1" href="https://www.nkrs.ch/fr/informations-relatives-a-l-obligation-de-declarer" target="_blank" rel="noopener">[S27] Obligation de déclarer et informer</a> — Pageconsultée 2 nov 2026. Lecture : Corps de page sur déclaration et information. Limite : Cadre institutionnel général, pas choix thérapeutique.</li><li><a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S28] Médicaments, liste des spécialités et FAQ</a> — Pageconsultée 2 nov 2026. Lecture : Listes et questions fréquentes 1–4. Limite : Aucune limitation individuelle des produits certifiée.</li><li><a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S29] Prise en charge de médicaments dans des cas particuliers</a> — Pageconsultée 2 nov 2026. Lecture : Conditions, cadre des articles 71 a–71 d et garantie de prise en charge. Limite : Aucun accord de remboursement individuel déduit.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">[S30] Nexavar information professionnelle</a> — Novembre 2023. Lecture : Indication, doses, paliers thyroïdiens, populations, interactions et sécurité. Limite : Lecture ciblée ; dialyse et enfant sans dose déduite.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">[S31] Cabometyx information professionnelle</a> — Décembre 2025. Lecture : Indication différenciée, monothérapie, populations, interactions et sécurité. Limite : Produit et ligne thérapeutique distincts du cancer médullaire et des associations rénales.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">[S32] Caprelsa information professionnelle</a> — Avril 2025. Lecture : Indication médullaire, dose, contre-indications, risque cardiaque et populations. Limite : Adulte avec mutation <button class="w" data-k="c73-ret">RET</button> ; contre-indication rénale et libellés divergents exposés.</li></ul><p>Audit différé — revue intelligence artificielle, distincte d’une validation médicale humaine. Textes intégraux en cache externe ; paraphrases et métadonnées seulement dans le cours.</p></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="c73-e-1"><h2><span class="n">1</span>Biologie : définir ce que le dosage peut montrer</h2><p>La <button class="w" data-k="c73-tsh">thyréostimuline</button> est un examen de fonction, pas un test d’exclusion du cancer. L’interpréter avec l’intervalle du laboratoire, l’âge, la grossesse et les traitements. En cas de résultat discordant, rechercher une interférence, notamment la biotine, et préciser les conditions de prélèvement plutôt que conclure immédiatement à une modification tumorale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><p>La <button class="w" data-k="c73-tg">thyroglobuline</button> et ses anticorps servent à un suivi différencié dans un contexte défini. Elle n’est pas un dosage de dépistage de tout nodule. La <button class="w" data-k="c73-calcitonin">calcitonine</button> s’inscrit dans l’évaluation d’un cancer médullaire suspecté ; aucune valeur seuil universelle diagnostique n’est donnée ici. La méthode, le contexte et les recommandations de l’équipe importent [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p>Avant ou après chirurgie, les dosages du calcium et de la parathormone peuvent contribuer à identifier une atteinte parathyroïdienne. Paresthésies, crampes ou tétanie après thyroïdectomie font rechercher une hypocalcémie. Une valeur isolée ou un schéma ambigu extrait d’un guide ne devient pas un ordre universel d’arrêter le calcium [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><div class="key"><b>À retenir.</b> Le nom du dosage doit être suivi de la question qu’il résout. Fonction, marqueur tumoral et complication ne sont pas la même chose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-e-2"><h2><span class="n">2</span>Échographie, prélèvement et concordance</h2><p>L’échographie doit décrire les nodules et les aires ganglionnaires pertinentes. Un score de risque n’est pas un diagnostic histologique. La décision de ponction dépend du score, de la taille et des exceptions cliniques. La cytologie se lit avec le prélèvement réellement réalisé, sa qualité et la concordance échographique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Risque échographique adulte</th><th>Seuil de taille du guide <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA</a> 2023</th><th>Précision</th></tr></thead><tbody><tr><td><button class="w" data-k="c73-tirads">EU-TIRADS</button> 3</td><td>Ponction au-delà de 20 mm.</td><td>Faible risque ne signifie pas risque nul.</td></tr><tr><td><button class="w" data-k="c73-tirads">EU-TIRADS</button> 4</td><td>Au-delà de 15 mm.</td><td>Ne pas confondre catégorie et stade.</td></tr><tr><td><button class="w" data-k="c73-tirads">EU-TIRADS</button> 5</td><td>Au-delà de 10 mm.</td><td>Ganglion ou extension suspects peuvent modifier la décision.</td></tr></tbody></table><p>Une ponction non diagnostique appelle une stratégie adaptée ; selon le cas, une nouvelle ponction ou une microbiopsie peut être discutée. En cas de suspicion anaplasique ou lymphomateuse, organiser rapidement du tissu adéquat et les analyses nécessaires. Les catégories britanniques Thy de <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> et les catégories <button class="w" data-k="c73-cyto">Bethesda</button> ne sont pas deux libellés automatiquement interchangeables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><div class="key"><b>À retenir.</b> La qualité et la concordance du prélèvement comptent. Seuils adultes et exceptions ne se transposent pas directement à l’enfant [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-e-3"><h2><span class="n">3</span>Imagerie d’extension : une indication précise</h2><p>Une imagerie en coupe est choisie selon suspicion d’extension locale, ganglionnaire ou distante. <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> la propose notamment dans des maladies plus étendues ; elle n’est pas une étape identique obligatoire pour chaque petit cancer différencié intrathyroïdien. La question et l’histotype guident la modalité [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p>Le cancer anaplasique nécessite un bilan rapide de l’étendue ; la directive allemande discute échographie, tomodensitométrie, imagerie par résonance magnétique et imagerie métabolique appropriées. Une suspicion d’atteinte cérébrale appelle une imagerie adaptée. La possibilité d’une préparation nucléaire future ne doit pas faire ignorer le besoin d’une imagerie urgente actuelle [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Le contraste iodé peut modifier la fixation d’un radioiode ultérieur. Relever date et produit puis coordonner avec la médecine nucléaire. La FI Curium donne des délais indicatifs, notamment six à huit semaines après certains contrastes hydrosolubles ; ce délai ne devient pas une règle d’interdire toute imagerie iodée urgente [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><div class="key"><b>À retenir.</b> Un examen d’extension doit répondre à une question qui influence la conduite. Documenter aussi ses conséquences sur le calendrier nucléaire [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-e-4"><h2><span class="n">4</span>Quatre exercices de décision</h2><p>Chaque vignette suivante est fictive. Les réponses vérifient un raisonnement ; elles ne constituent pas des données de patients ni une prescription [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><div class="quiz"><h3>Fonction normale et nodule</h3><button data-ok="0">Une fonction hormonale normale exclut une tumeur maligne.</button><button data-ok="1">La fonction et la nature du tissu doivent être évaluées séparément.</button><div class="fb">La <button class="w" data-k="c73-tsh">thyréostimuline</button> renseigne sur la fonction globale. Le risque tumoral dépend notamment de la clinique, de l’image et du prélèvement adapté [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</div></div><div class="quiz"><h3>Cancer médullaire et phéochromocytome associé</h3><button data-ok="0">Opérer la thyroïde sans tenir compte du phéochromocytome.</button><button data-ok="1">Prendre en charge le phéochromocytome avant l’opération thyroïdienne.</button><div class="fb">Les catécholamines peuvent rendre l’intervention dangereuse. L’évaluation de prédisposition et des tumeurs associées change l’ordre des soins [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</div></div><div class="quiz"><h3>Cancer différencié à quarante ans avec ganglion, sans métastase distante</h3><button data-ok="0">L’atteinte ganglionnaire impose toujours le stade quatre.</button><button data-ok="1">La classification anatomique de neuvième édition le classe dans le groupe un à cet âge.</button><div class="fb">Avant cinquante-cinq ans, la fiche européenne classe une forme différenciée sans métastase distante au stade un ; le ganglion reste pertinent pour le risque et la prise en charge [<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</div></div><div class="quiz"><h3>Conversion d’activité radioactive</h3><button data-ok="0">Un virgule un gigabecquerel vaut onze mégabecquerels.</button><button data-ok="1">Un virgule un gigabecquerel vaut mille cent mégabecquerels.</button><div class="fb">Un gigabecquerel vaut mille mégabecquerels. La conversion ne choisit ni l’indication ni l’activité individuelle [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S21</a>].</div></div><div class="key"><b>À retenir.</b> Comprendre pourquoi la réponse est correcte compte davantage que reconnaître une expression. Préserver âge, histotype, unités et population [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-e-4">Essentiel de cette partie</button></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist" aria-label="Sciences fondamentales"><button id="c73-tab-semio" data-s="c73-s-semio" role="tab" aria-controls="c73-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="c73-tab-anat" data-s="c73-s-anat" role="tab" aria-controls="c73-s-anat" aria-selected="false">Anatomie fonctionnelle et rapports cervicaux</button><button id="c73-tab-histo" data-s="c73-s-histo" role="tab" aria-controls="c73-s-histo" aria-selected="false">Histologie, lignages et limites morphologiques</button><button id="c73-tab-physio" data-s="c73-s-physio" role="tab" aria-controls="c73-s-physio" aria-selected="false">Physiologie, rétrocontrôle et marqueurs</button><button id="c73-tab-bioch" data-s="c73-s-bioch" role="tab" aria-controls="c73-s-bioch" aria-selected="false">Biochimie de l’iode et unités thérapeutiques</button><button id="c73-tab-gene" data-s="c73-s-gene" role="tab" aria-controls="c73-s-gene" aria-selected="false">Génétique, signalisation et thérapie ciblée</button></div><div class="sci" id="c73-s-semio" role="tabpanel" aria-labelledby="c73-tab-semio"><section class="ilot" id="c73-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La thyroïde normale est placée en avant de la trachée, avec deux lobes reliés par un isthme. Ses cellules folliculaires assurent une production hormonale soumise au rétrocontrôle ; les cellules C ont une autre fonction sécrétoire. La structure, la fonction et la nature du tissu sont donc trois dimensions qu’un seul dosage ne résume pas [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p>Une valeur de <button class="w" data-k="c73-tsh">thyréostimuline</button> dans l’intervalle du laboratoire est compatible avec une fonction globale normale. Elle n’est pas une mesure de la prolifération cellulaire et ne permet pas d’exclure une tumeur. La normalité pertinente dépend de la méthode, de l’âge, de la grossesse et des traitements ; aucun intervalle numérique unique n’est imposé ici [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p></section><section class="ilot" id="c73-semio-signs" data-semiology="signs"><h3>Du symptôme rapporté au signe observé</h3><p>Le symptôme appartient au récit : gêne à avaler, essoufflement, changement de voix ou perception d’une boule. Le signe est observé ou mesuré : masse, fixation, adénopathie, stridor ou paralysie de corde vocale constatée par examen approprié. Noter leur chronologie et leur évolution est nécessaire avant de les expliquer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p></section><section class="ilot" id="c73-semio-mechanisms" data-semiology="mechanisms"><h3>Relier la perturbation à son retentissement</h3><p><b>Science → clinique.</b> Une prolifération augmente le volume ; sa position peut gêner la trachée ou l’œsophage. Une atteinte du nerf laryngé récurrent peut perturber la mobilité d’une corde vocale et modifier la voix. Le mécanisme explique l’alerte, sans prouver que toute dysphonie soit tumorale. Une masse rapide impose aussi d’évoquer hémorragie et lymphome [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p></section><section class="ilot" id="c73-semio-examination" data-semiology="examination"><h3>Choisir une observation ou un test adapté</h3><p><b>Science → examen.</b> Observer respiration et voix, inspecter à la déglutition, palper thyroïde et ganglions puis demander l’échographie indiquée. L’échographie décrit la structure et guide un prélèvement ; la cytologie étudie des cellules ; l’histologie examine notamment l’invasion. Une laryngoscopie, une imagerie en coupe ou une microbiopsie répondent à des questions distinctes selon les signes et le type suspecté [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p></section><section class="ilot" id="c73-semio-interpretation" data-semiology="interpretation"><h3>Interpréter avec la probabilité et les limites</h3><p>Un ganglion suspect ou une masse fixée renforce une hypothèse, mais ne constitue pas son type histologique. Une cytologie bénigne discordante avec une image très suspecte demande une réévaluation. Une <button class="w" data-k="c73-calcitonin">calcitonine</button> élevée ne doit pas être lue sans méthode, unité et contexte ; la <button class="w" data-k="c73-tg">thyroglobuline</button> n’est pas un test universel pour trier les nodules [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p></section><section class="ilot" id="c73-semio-differentials" data-semiology="differentials"><h3>Comparer les hypothèses qui changent le parcours</h3><p>Un goitre bénin, une thyroïdite, un saignement intranodulaire, un lymphome, une métastase et un carcinome peuvent se présenter comme une masse. L’invasion capsulaire ou vasculaire aide à distinguer certaines tumeurs folliculaires sur le tissu. La rapidité et l’état respiratoire déterminent le délai, tandis que l’histologie et les marqueurs adaptés déterminent le lignage [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p></section><section class="ilot" id="c73-semio-urgency" data-semiology="urgency"><h3>Reconnaître une menace avant la fin du bilan</h3><p><b>Science → traitement.</b> Stridor, détresse respiratoire ou aggravation compressive rapide imposent une évaluation urgente des voies aériennes avec une équipe adaptée. Ni une ponction programmée ni l’effet retardé du radioiode ne doivent faire différer cette prise en charge. Une suspicion de cancer anaplasique accélère aussi l’organisation du tissu, de l’imagerie et de l’analyse moléculaire [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p></section><section class="ilot" id="c73-semio-limits" data-semiology="limits"><h3>Éviter les raccourcis et suivre la trajectoire</h3><p>L’absence de douleur, une mobilité conservée ou une fonction normale ne certifient pas la bénignité. La palpation ne voit pas toute extension profonde. Les lectures ne donnent pas de sensibilité ou spécificité universelle applicable à toutes les tailles et histologies. Les données successives doivent être confrontées : ce qui change, la méthode utilisée et la concordance entre les examens [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p></section><section class="ilot" id="c73-semio-sources" data-semiology="sources"><h3>Sources, décisions et message essentiel</h3><p><b>À retenir.</b> Décrire, relier le mécanisme, choisir le test puis décider du délai. Les repères viennent du <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/">guide européen des nodules 2023</a>, de la <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/">S3 allemande 1.3 de septembre 2026</a> et du <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland">chapitre de science normale</a>. Les différences de stratégie entre guides sont attribuées ; une auto-relecture intelligence artificielle n’est pas une validation médicale humaine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p></section><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="15" fill="currentColor" text-anchor="middle">Signe décrit et contexte</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="15" fill="currentColor" text-anchor="middle">Mécanisme possible et test pertinent</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="15" fill="currentColor" text-anchor="middle">Urgence et décision partagée</text></svg><figcaption>Schéma causal original Sol 2026, sans structure anatomique dessinée. Organisation du raisonnement, sans anatomie dessinée ; une flèche ne prouve pas un diagnostic [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</figcaption></figure></div><div class="sci" id="c73-s-anat" role="tabpanel" aria-labelledby="c73-tab-anat" hidden><h3>Du siège normal à la menace locale</h3><p>La thyroïde normale comporte deux lobes de part et d’autre de la trachée, reliés en avant par un isthme. Les parathyroïdes sont habituellement situées en arrière de la glande. Une augmentation de volume ou une extension tumorale peut donc affecter des structures dont les fonctions sont différentes : respiration, déglutition, mobilité laryngée et régulation du calcium [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p>Les compartiments ganglionnaires organisent l’exploration et le geste chirurgical. Le compartiment central comprend les tissus pré- et paratrachéaux et les régions centrales inférieures ; les compartiments latéraux suivent d’autres chaînes cervicales. Le terme « ganglion cervical » ne précise ni niveau, ni côté, ni preuve d’atteinte. Une description anatomique complète est nécessaire pour que l’imagerie et l’équipe opératoire parlent de la même lésion [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p><b>Science → clinique.</b> Une infiltration proche du nerf laryngé récurrent peut participer à une modification de voix. Une extension vers la trachée peut menacer la ventilation. Une dysphagie peut traduire un effet sur les rapports œsophagiens. Le volume externe palpé ne mesure pas à lui seul la profondeur ni le degré de cette menace ; une petite partie visible ne rassure pas sur les espaces profonds [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p><b>Science → examen.</b> L’échographie explore les lobes et les aires ganglionnaires accessibles. Une imagerie en coupe est choisie pour des questions d’extension, et l’examen des cordes vocales évalue une fonction que la simple palpation ne montre pas. Le résultat doit localiser l’atteinte et préciser les structures concernées ; il ne suffit pas de dire « masse importante » [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p><b>Science → traitement.</b> La proximité des parathyroïdes et des nerfs explique certains risques de thyroïdectomie ou de curage. Réduire la maladie et préserver la fonction demandent une stratégie adaptée, un geste compartimental lorsqu’il est indiqué et une équipe expérimentée. L’anatomie n’autorise pas une exérèse maximale de routine chez tout patient [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><p><b>À retenir.</b> Localiser une lésion sert à anticiper son retentissement et les risques du traitement. La planche ci-dessous représente le normal ; elle ne montre pas une invasion tumorale ni le statut ganglionnaire d’une personne [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">S23</a>].</p><figure data-c73-original="normal"><div data-c73-frame="normal"><img src="assets/img/c73/alpha/codex/normal-thyroid-openstax2013.jpg" width="737" height="1410" alt="Planche humaine normale : lobes et isthme devant la trachée, face postérieure avec parathyroïdes, puis follicules avec colloïde."/><span data-c73-marker="1" data-c73-normal-pin="1" aria-hidden="true">1</span><span data-c73-marker="1" data-c73-normal-pin="2" aria-hidden="true">2</span><span data-c73-marker="1" data-c73-normal-pin="3" aria-hidden="true">3</span><span data-c73-marker="1" data-c73-normal-pin="4" aria-hidden="true">4</span></div><figcaption>Normal humain, original OpenStax College/Connexions 2013, licence Creative Commons Attribution 3.0 ; micrographie University of Michigan©2012, grossissement optique annoncé 1332 fois. Repères français superposés : 1 isthme ; 2 trachée ; 3 région postérieure des parathyroïdes ; 4 colloïde folliculaire. La coloration n’est pas précisée par la légende lue. Aucun pixel modifié ni lésion <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> représentée ; le grossissement de publication n’est pas une calibration de l’écran [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">S23</a>].</figcaption></figure></div><div class="sci" id="c73-s-histo" role="tabpanel" aria-labelledby="c73-tab-histo" hidden><h3>Lire des cellules dans leur organisation</h3><p>Dans la thyroïde normale, les cellules folliculaires bordent une lumière contenant la colloïde. Cette organisation rend possible un stockage extracellulaire de <button class="w" data-k="c73-tg">thyroglobuline</button> et de précurseurs hormonaux. Les cellules C forment une population sécrétoire différente. Il faut partir de ces fonctions et de ces lignages pour comprendre les marqueurs utilisés ensuite [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p>Une tumeur peut organiser ses cellules en papilles, follicules ou structures solides. L’architecture seule ne définit pas toujours le lignage : la figure originale publiée en 2020 montre notamment un cancer médullaire à disposition papillaire et un cancer papillaire solide. Certains marqueurs sont focaux ou faibles ; les conditions techniques et la différenciation modifient leur expression. Un panel cohérent avec la morphologie est plus informatif qu’une coloration isolée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>].</p><p><b>Science → clinique.</b> La classification 2022 distingue les carcinomes différenciés de haut grade et les carcinomes peu différenciés. Le grade apporte une information qui n’est pas contenue dans la seule taille. Un microcarcinome peut appartenir à un sous-type agressif ; le mot « micro » ne permet donc pas d’annoncer un risque nul [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p><b>Science → examen.</b> La cytoponction prélève des cellules mais n’étudie pas toute la capsule. Pour une tumeur folliculaire encapsulée, l’évaluation de l’invasion capsulaire ou vasculaire demande du tissu et une analyse adaptée. Une néoplasie folliculaire non invasive à caractères nucléaires papillaires doit satisfaire des critères histologiques : elle ne peut être affirmée uniquement sur une petite population de cellules ponctionnées [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p><b>Science → traitement.</b> La distinction entre adénome, néoplasie de faible risque, carcinome différencié, médullaire et anaplasique change les objectifs et les options. L’histologie et l’analyse moléculaire peuvent modifier la prise en charge ; la photographie n’est pas un algorithme d’ordonnance. Les termes historiques « Hürthle » du document 2020 sont replacés dans la terminologie oncocytaire 2022 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p><b>À retenir.</b> Lignage, architecture, invasion et grade se complètent. Les lettres originales de la figure sont expliquées en français ; ni coloration ni grossissement non indiqués par la légende ne sont inventés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><figure data-c73-original="pathology"><div data-c73-scroll="1" tabindex="0" aria-label="Planche histologique défilante horizontalement"><div data-c73-canvas="1"><img src="assets/img/c73/alpha/codex/histopathology-cameselle2020.jpg" width="1527" height="1210" alt="Six panneaux histopathologiques humains publiés : médullaire papillaire, papillaire solide, marqueurs focaux, tumeur oncocytaire claire et ultrastructure mitochondriale."/><span data-c73-marker="1" data-c73-path-pin="1" aria-hidden="true">1</span><span data-c73-marker="1" data-c73-path-pin="2" aria-hidden="true">2</span><span data-c73-marker="1" data-c73-path-pin="3" aria-hidden="true">3</span><span data-c73-marker="1" data-c73-path-pin="4" aria-hidden="true">4</span></div></div><figcaption>Original humain, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">Cameselle-Teijeiro</a>, Eloy et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">Sobrinho-Simões</a> 2020, figure 2, licence Creative Commons Attribution 4.0. Repères français : 1 panneau a, cancer médullaire à architecture papillaire ; 2 panneau b, sous-type solide de cancer papillaire ; 3 panneau c, expression focale de <button class="w" data-k="c73-tg">thyroglobuline</button> ; 4 panneau e, aspect oncocytaire clair. Le panneau d montre une expression de thyroxine et f une ultrastructure avec mitochondries gonflées. Les lettres a–f appartiennent à l’original. La légende ne précise pas toutes les colorations ni un grossissement : aucun n’est inventé. Faire défiler horizontalement pour inspecter les panneaux. Terminologie historique 2020 replacée dans la classification 2022 ; pas de diagnostic ou de pronostic individuel déduit de cette image [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</figcaption></figure></div><div class="sci" id="c73-s-physio" role="tabpanel" aria-labelledby="c73-tab-physio" hidden><h3>Fonction hormonale et masse tumorale ne se mesurent pas pareil</h3><p>Le fonctionnement normal relie l’hypophyse à la cellule folliculaire. La <button class="w" data-k="c73-tsh">thyréostimuline</button> stimule les processus de synthèse et de libération hormonales ; les hormones circulantes participent au rétrocontrôle. Une glande contenant une tumeur peut conserver une production globale compatible avec l’intervalle du laboratoire. La fonction des cellules normales restantes peut contribuer à cette apparente normalité [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p>La <button class="w" data-k="c73-tg">thyroglobuline</button> est produite par les cellules folliculaires et sert de support à la synthèse hormonale. Sa concentration sanguine dépend du tissu présent et du contexte de mesure. Après hémi, du tissu normal demeure et peut en produire ; après thyroïdectomie totale et ablation, la question posée par le dosage est différente. Il est incorrect de prendre un seuil d’un contexte pour l’appliquer sans modification à l’autre [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p><b>Science → clinique.</b> Une substitution par lévothyroxine remplace une production insuffisante ; une suppression de <button class="w" data-k="c73-tsh">thyréostimuline</button> dans certaines formes différenciées vise un objectif oncologique. Ces deux buts peuvent utiliser la même molécule mais ne sont pas la même stratégie. Les risques cardiaques et osseux imposent d’adapter l’intensité et de réévaluer le bénéfice au cours du suivi [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><p><b>Science → examen.</b> L’interprétation d’une <button class="w" data-k="c73-tg">thyroglobuline</button> associe ses anticorps, la méthode, les conditions hormonales et la trajectoire. Une valeur détectable ou en hausse ne localise pas à elle seule la maladie. La <button class="w" data-k="c73-calcitonin">calcitonine</button> répond à un autre lignage ; elle ne remplace ni la <button class="w" data-k="c73-tg">thyroglobuline</button> dans le suivi différencié ni la preuve tissulaire d’une lésion [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p><b>Science → traitement.</b> Une excellente réponse peut permettre un objectif moins suppressif, par exemple 0,5–2 mU/L dans la directive allemande. Une persistance structurelle peut justifier une suppression plus forte sous réserve des risques. Il ne s’agit pas d’imposer ces objectifs à tous les cancers médullaires ou anaplasiques, ni de calculer une dose sur la valeur de <button class="w" data-k="c73-tsh">thyréostimuline</button> sans considérer la personne [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><p><b>À retenir.</b> Le contrôle hormonal, le marqueur et l’image ont des fonctions complémentaires. Une fonction normale n’exclut pas une tumeur ; un marqueur isolé ne suffit pas à choisir un traitement systémique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="15" fill="currentColor" text-anchor="middle">Tissu présent et état hormonal</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="15" fill="currentColor" text-anchor="middle">Marqueur, méthode et anticorps</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="15" fill="currentColor" text-anchor="middle">Interprétation avec imagerie et trajectoire</text></svg><figcaption>Schéma causal original Sol 2026, sans structure anatomique dessinée. Les conditions de mesure font partie du résultat clinique ; le schéma ne prédit pas une évolution tumorale [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</figcaption></figure></div><div class="sci" id="c73-s-bioch" role="tabpanel" aria-labelledby="c73-tab-bioch" hidden><h3>Une activité radioactive n’est pas une masse de médicament</h3><p>Les cellules folliculaires normales captent l’iodure, l’intègrent à des résidus de la <button class="w" data-k="c73-tg">thyroglobuline</button> et forment les précurseurs hormonaux. Le stockage dans la colloïde puis la récupération et la libération des hormones font partie de cette organisation. La biologie de l’iode permet de comprendre pourquoi certaines tumeurs différenciées peuvent conserver une capacité de fixation, tandis que la perte de différenciation peut la réduire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p>Le radioiode utilise une propriété biologique du tissu pour y délivrer une irradiation. La question « cette maladie fixe-t-elle l’iode de manière utile ? » diffère de la question « ce cancer vient-il de la thyroïde ? ». Une origine thyroïdienne seule ne prouve pas l’efficacité attendue du même traitement nucléaire. Le bilan de risque, les traitements antérieurs et la distribution de la maladie participent à la décision [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>].</p><p><b>Science → clinique.</b> Une charge iodée, certains médicaments ou un contraste récent peuvent modifier la fixation et le calendrier. Leur présence doit être recherchée avant une procédure ; ne pas organiser d’arrêt autonome d’un traitement important. Le besoin d’une imagerie urgente doit aussi rester prioritaire lorsqu’un danger immédiat l’impose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><p><b>Science → examen.</b> La préparation et les conditions de mesure doivent être connues pour interpréter une scintigraphie ou un dosage stimulé. La <button class="w" data-k="c73-tsh">thyréostimuline</button> recombinante augmente la stimulation sans être elle-même de l’iode radioactif. Les injections et le radioiode ont des doses, des unités, des voies et des temps distincts [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><p><b>Science → traitement.</b> Le becquerel exprime une activité radioactive ; le gray exprime une dose absorbée. Un gigabecquerel vaut mille mégabecquerels, donc 1,1 gigabecquerel correspond à 1100 mégabecquerels. La plage de présentation d’une capsule n’est pas la dose à prescrire. Le service nucléaire individualise l’activité et les mesures de radioprotection ; la fonction rénale et l’exposition de l’entourage sont pertinentes [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S21</a>].</p><p><b>À retenir.</b> Ne pas confondre unité, préparation et objectif : ablation d’un reliquat, adjuvant et traitement d’une maladie connue demandent des décisions distinctes. Une conversion arithmétique ne décide pas de l’indication [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="15" fill="currentColor" text-anchor="middle">Cellules capables de capter l’iode</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="15" fill="currentColor" text-anchor="middle">Activité choisie et dosimétrie</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="15" fill="currentColor" text-anchor="middle">Effet attendu et radioprotection</text></svg><figcaption>Schéma causal original Sol 2026, sans structure anatomique dessinée. Séquence logique conditionnelle, sans anatomie ni activité universelle proposée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S21</a>].</figcaption></figure></div><div class="sci" id="c73-s-gene" role="tabpanel" aria-labelledby="c73-tab-gene" hidden><h3>Le type d’altération compte autant que le nom du gène</h3><p>Une cellule normale répond à des signaux qui régulent sa croissance et son fonctionnement. Les protéines de signalisation transmettent des informations ; une altération tumorale peut rendre certaines de ces voies anormalement actives. La recherche moléculaire n’est utile à une décision que si le résultat est correctement caractérisé et relié à la maladie, à la population et au traitement envisagé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p>Une mutation modifie une séquence génétique, tandis qu’une fusion réunit des éléments de gènes différents. Dans le cadre thyroïdien étudié ici, <button class="w" data-k="c73-ret">RET</button> peut être impliqué par une mutation dans le cancer médullaire ou par une fusion dans le cancer papillaire. La présence du seul mot <button class="w" data-k="c73-ret">RET</button> ne démontre pas une même indication. Une anomalie de <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">BRAF</a> doit également être décrite avec son variant ; l’indication agnostique suisse de l’association dabrafénib–tramétinib précise <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">V600E</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p><b>Science → clinique.</b> Une altération germinale peut être présente au-delà de la tumeur et intéresser la famille. Une analyse somatique renseigne sur la lésion étudiée. Devant un cancer médullaire, le conseil génétique et l’évaluation germinale ne sont pas remplacés par un résultat tumoral. Les manifestations endocriniennes associées peuvent modifier l’ordre des interventions [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p><b>Science → examen.</b> Le prélèvement doit fournir du matériel adapté et une analyse réalisée assez rapidement pour être utile. C’est particulièrement important dans le cancer anaplasique. La morphologie, l’immunohistochimie et la caractérisation moléculaire sont interprétées ensemble ; un marqueur négatif isolé ou une expression focale ne permet pas toujours d’exclure un lignage [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>].</p><p><b>Science → traitement.</b> Un inhibiteur peut viser une voie ou une protéine altérée, mais l’existence d’une cible ne garantit ni réponse, ni bénéfice suffisant, ni autorisation suisse dans toutes les situations. Le selpercatinib distingue indications papillaires et médullaires ; l’association ciblant <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">BRAF</a> et <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">MEK</a> a une indication agnostique adulte conditionnelle. Une recommandation européenne de néoadjuvant dans une forme anaplasique n’efface pas les conditions du libellé et la question du remboursement [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><p><b>À retenir.</b> Préciser germinal ou somatique, mutation ou fusion, histotype, âge et ligne thérapeutique. Le résultat moléculaire aide à choisir une stratégie ; il ne remplace pas l’ensemble du raisonnement clinique [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="15" fill="currentColor" text-anchor="middle">Altération caractérisée dans son contexte</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="15" fill="currentColor" text-anchor="middle">Cible et indication exacte du produit</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="15" fill="currentColor" text-anchor="middle">Bénéfice attendu, risques et accès vérifiés</text></svg><figcaption>Schéma causal original Sol 2026, sans structure anatomique dessinée. Une association biologique n’est pas une garantie d’efficacité ou de remboursement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</figcaption></figure></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="c73-p-1"><h2><span class="n">1</span>Lévothyroxine : substitution et suppression</h2><p><button class="w" data-k="c73-lt4">Euthyrox</button>, FI suisse de février 2023, est une lévothyroxine orale. Après thyroïdectomie, remplacer la production absente et supprimer la <button class="w" data-k="c73-tsh">thyréostimuline</button> dans certaines formes différenciées sont deux objectifs à distinguer. La même molécule ne rend pas le même objectif approprié à tous les histotypes [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Question</th><th>Repère FI février 2023</th><th>Limite clinique</th></tr></thead><tbody><tr><td>Produit et voie</td><td><button class="w" data-k="c73-lt4">Euthyrox</button>, comprimés 25–200 microgrammes ; voie orale.</td><td>Vérifier présentation et prescription.</td></tr><tr><td>Après thyroïdectomie pour cancer</td><td>Plage 150–300 microgrammes par jour dans la FI.</td><td>Pas une dose initiale universelle ; objectif de <button class="w" data-k="c73-tsh">thyréostimuline</button> et risques individuels.</td></tr><tr><td>Prise</td><td>À jeun, au moins 30 minutes avant le petit déjeuner.</td><td>Régularité et interactions modifient l’exposition.</td></tr><tr><td>Absorption</td><td>Calcium, fer ou aluminium au moins 2 heures après ; résines 4–5 heures après.</td><td>Ne pas remplacer ces délais par une règle inventée commune à tous les médicaments.</td></tr><tr><td>Fonctions d’organes</td><td>Pharmacocinétique rénale/hépatique non étudiée.</td><td>Aucune adaptation numérique universelle déduite.</td></tr></tbody></table><p>La dose est individualisée selon besoin, réponse, âge, état cardiaque et risque osseux. La plage de FI n’impose pas 150 microgrammes comme première dose à toute personne. Les symptômes de surtraitement et les résultats biologiques doivent être évalués ; une suppression plus intense n’est pas automatiquement meilleure. Une maladie cardiaque ou une insuffisance surrénalienne non traitée doit être considérée selon les contre-indications et précautions du produit [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><p>La biotine peut perturber les analyses. Calcium, fer, résines, aliments et autres médicaments peuvent modifier l’exposition ; préciser les prises avant d’augmenter une dose devant une valeur inattendue. La substitution nécessaire pendant une grossesse est poursuivie et surveillée, avec réévaluation des besoins ; elle n’est pas remplacée par un arrêt pour protéger le fœtus [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><div class="key"><b>À retenir.</b> Microgramme, dose prescrite et objectif biologique sont distincts. La FI fournit une plage, la situation clinique détermine la dose [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-2"><h2><span class="n">2</span>Iode 131 : objectif, activité et radioprotection</h2><p>La FI suisse Curium de juillet 2022 doit être liée à l’objectif nucléaire. Le guide européen distingue ablation d’un reliquat, adjuvant et traitement d’une maladie connue. La décision de traiter n’est pas donnée par le seul fait qu’une capsule existe dans une activité particulière [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI Curium juillet 2022</th><th>Interprétation</th></tr></thead><tbody><tr><td>Produit</td><td>Sodium iodide (<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">I</a>-131) capsule T ; oral.</td><td>Capsule thérapeutique, pas préparation diagnostique interchangeable.</td></tr><tr><td>Présentation</td><td>37–7400 mégabecquerels à la date de calibration.</td><td>Plage de présentation, pas dose de chaque patient.</td></tr><tr><td>Ablation de reliquat après chirurgie</td><td>1100–3700 mégabecquerels selon reliquat, fixation et contexte.</td><td>Pas schéma universel de toute maladie métastatique.</td></tr><tr><td>Rein ou enfant</td><td>Évaluation individuelle et dosimétrie.</td><td>Ne pas appliquer une réduction fixe inventée.</td></tr><tr><td>Grossesse et allaitement</td><td>Contre-indications ; sevrage au moins 8 semaines avant, sans reprise pour cet enfant.</td><td>Informer et vérifier avant administration.</td></tr></tbody></table><p>Grossesse, allaitement et certaines difficultés de déglutition ou lésions digestives contre-indiquent cette capsule. Le service vérifie la capacité de l’avaler, les interactions, la fonction rénale et la préparation. Gonflement ou inflammation peuvent être dangereux au voisinage de structures critiques ; le traitement n’est pas une méthode de décompression immédiate [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><p>Pour le projet de grossesse, la FI comporte un conseil de six à douze mois et précise douze mois de contraception dans le contexte malin. Le calendrier est clarifié avec l’équipe plutôt que choisir silencieusement le nombre le plus court. Après traitement, les précautions de proximité, d’hygiène et de sortie sont individualisées. La directive suisse de radioprotection prévoit notamment une filière hospitalière dès 200 mégabecquerels, avec exceptions ambulatoires encadrées ; le fractionnement pour éviter l’hospitalisation n’est pas autorisé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S21</a>].</p><div class="key"><b>À retenir.</b> Le radioiode exige une indication, une activité individualisée, une préparation et des consignes écrites. La conversion d’unités ne remplace aucune de ces décisions [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-p-3"><h2><span class="n">3</span><button class="w" data-k="c73-rh">Thyrogen</button> : une stimulation avec un calendrier propre</h2><p><button class="w" data-k="c73-rh">Thyrogen</button> contient de la <button class="w" data-k="c73-tsh">thyréostimuline</button> recombinante. La FI suisse de juin 2023 décrit les indications et le calendrier ci-dessous. Une recommandation qui évoque un usage hors indication ne transforme pas cet usage en indication suisse, notamment pour la préablation avec métastases distantes [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Étape</th><th>FI <button class="w" data-k="c73-rh">Thyrogen</button> juin 2023</th><th>Point de sécurité</th></tr></thead><tbody><tr><td>Injection</td><td>0,9 mg par voie intramusculaire, puis 0,9 mg 24 heures après.</td><td>Voie exclusivement intramusculaire, pas intraveineuse.</td></tr><tr><td>Radioiode</td><td>24 heures après la seconde injection.</td><td>Planifier avec le service nucléaire.</td></tr><tr><td>Thyroglobuline stimulée</td><td>Prélèvement 72 heures après la seconde injection.</td><td>Anticorps et méthode restent pertinents.</td></tr><tr><td>Préablation</td><td>Avec 1,1–3,7 gigabecquerels après chirurgie quasi totale ou totale, sans métastase distante.</td><td>Ne pas élargir automatiquement à une maladie métastatique.</td></tr></tbody></table><p>Le produit est contre-indiqué pendant la grossesse et ne doit pas être utilisé pendant l’allaitement. Une insuffisance rénale terminale peut prolonger l’exposition ; aucune règle numérique d’adaptation n’est établie. L’activité de radioiode doit également tenir compte du terrain. L’emploi pédiatrique est exceptionnel et les résultats adultes ne donnent pas un schéma automatique à tout enfant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><p>La stimulation peut provoquer un gonflement de tissu tumoral, important près des voies aériennes, du cerveau, de la moelle ou des orbites. Les risques cardiaques sont évalués. Cette précaution explique la planification spécialisée ; elle ne justifie pas d’inventer dans ce cours une dose préventive de corticoïde [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><div class="key"><b>À retenir.</b> Deux injections intramusculaires et des délais distincts : vérifier indication, voie et calendrier avant les calculs [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-p-3">Essentiel de cette partie</button></section>
