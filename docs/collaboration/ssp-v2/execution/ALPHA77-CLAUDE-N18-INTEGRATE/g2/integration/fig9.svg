<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma décisionnel non anatomique. Une maladie rénale chronique dont le phénotype est précisé conduit à chercher un indice de cause génétique : histoire familiale, début précoce, atteinte extrarénale, consanguinité ou cause inconnue. Si un indice est présent, un conseil génétique précède le test par panel orienté ou exome. Trois résultats sont possibles : variant pathogène, qui permet diagnostic, conseil et test des apparentés ; variant de signification incertaine, qui ne fonde aucune décision à lui seul ; résultat négatif, qui n’exclut pas une cause héréditaire." viewBox="0 0 480 652"><defs><marker id="n18-s05-fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"></path></marker></defs><rect x="10" y="8" width="460" height="68" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"></rect><text x="240" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Maladie rénale chronique</text><text x="240" y="62" text-anchor="middle" font-size="18" fill="#111111">phénotype précisé d’abord</text><line x1="240" y1="76" x2="240" y2="104" stroke="#111111" stroke-width="2" marker-end="url(#n18-s05-fleche)"></line><rect x="10" y="106" width="460" height="128" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"></rect><text x="240" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Indice d’une cause génétique ?</text><text x="240" y="162" text-anchor="middle" font-size="18" fill="#111111">histoire familiale, début précoce,</text><text x="240" y="186" text-anchor="middle" font-size="18" fill="#111111">atteinte extrarénale, consanguinité,</text><text x="240" y="210" text-anchor="middle" font-size="18" fill="#111111">cause inconnue au stade avancé</text><line x1="240" y1="234" x2="240" y2="262" stroke="#111111" stroke-width="2" marker-end="url(#n18-s05-fleche)"></line><rect x="10" y="264" width="460" height="68" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"></rect><text x="240" y="292" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Conseil génétique, puis test</text><text x="240" y="318" text-anchor="middle" font-size="18" fill="#111111">panel orienté par le phénotype ou exome</text><line x1="26" y1="332" x2="26" y2="584" stroke="#111111" stroke-width="2"></line><line x1="26" y1="396" x2="48" y2="396" stroke="#111111" stroke-width="2" marker-end="url(#n18-s05-fleche)"></line><line x1="26" y1="490" x2="48" y2="490" stroke="#111111" stroke-width="2" marker-end="url(#n18-s05-fleche)"></line><line x1="26" y1="584" x2="48" y2="584" stroke="#111111" stroke-width="2" marker-end="url(#n18-s05-fleche)"></line><rect x="50" y="358" width="420" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="3"></rect><text x="260" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Variant pathogène</text><text x="260" y="416" text-anchor="middle" font-size="18" fill="#111111">diagnostic, conseil, test des apparentés</text><rect x="50" y="452" width="420" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="8 5"></rect><text x="260" y="482" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Signification incertaine</text><text x="260" y="510" text-anchor="middle" font-size="18" fill="#111111">aucune décision fondée sur lui seul</text><rect x="50" y="546" width="420" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="2 4"></rect><text x="260" y="576" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Résultat négatif</text><text x="260" y="604" text-anchor="middle" font-size="18" fill="#111111">n’exclut pas une cause héréditaire</text><text x="240" y="642" text-anchor="middle" font-size="18" fill="#111111">Schéma non anatomique, élaboré pour la leçon</text></svg>