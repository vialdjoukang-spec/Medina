<template data-pop="n18-sm-fatigue" data-title="Fatigue dans la maladie rénale chronique — mécanisme et valeur"><p>La fatigue est une baisse ressentie d’énergie. Dans la revue mondiale reprise par KDIGO 2024 (figure 49), elle touche 70 % des personnes atteintes de maladie rénale chronique sans suppléance, contre 34 % dans un groupe témoin ; l’intervalle de confiance du groupe témoin, de 0 à 70 %, montre combien ce chiffre est imprécis.</p><p>Le mécanisme le mieux documenté est l’anémie rénale : déficit en érythropoïétine, toxines urémiques qui freinent l’érythropoïèse, globules rouges de durée de vie raccourcie et homéostasie du fer perdue (HUG 2017). Le Centre hospitalier universitaire vaudois décrit alors une tendance à la fatigue et un souffle court lors des efforts. KDIGO associe aussi la fatigue aux troubles du sommeil, eux-mêmes liés au prurit, à la douleur, à l’anémie, à l’anxiété ou à la dépression.</p><p>Technique d’interrogatoire : date de début, effort encore toléré, qualité du sommeil, humeur, médicaments. Piège : dans la population générale, une fatigue isolée n’est pas liée à l’anémie (mediX 2025) ; une hémoglobine normale fait chercher une autre cause, en particulier une dépression, que les HUG recommandent de dépister.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, figure 49 et tableau 38</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">HUG (2017), § 3.1 et § 3.5.2</a> ; <a href="https://www.chuv.ch/fr/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/signes-et-symptomes" target="_blank" rel="noopener">CHUV (29.01.2020)</a> ; <a href="https://www.medix.ch/fr/connaissances/guide-des-bonnes-pratiques/carence-en-fer/" target="_blank" rel="noopener">mediX (08/2025)</a>.</p></template>
<template data-pop="n18-sm-dyspnee" data-title="Souffle court — trois mécanismes à séparer"><p>Le souffle court touche 42 % des personnes atteintes de maladie rénale chronique sans suppléance (KDIGO 2024, figure 49). Trois mécanismes peuvent le produire. L’excès de sodium et d’eau peut gagner les poumons : l’œdème pulmonaire gêne les échanges gazeux et donne une difficulté respiratoire (OpenStax 26.1). L’anémie rénale donne un souffle court lors des efforts (CHUV). Une maladie cardiaque peut enfin coexister.</p><p>Technique : préciser la circonstance, effort ou repos, l’évolution du poids et la présence d’œdèmes, puis ausculter le cœur et les poumons à chaque consultation (HUG 2017). Un reflux hépatojugulaire ou une hépatomégalie douloureuse orientent vers une insuffisance cardiaque (médecine vasculaire, item 323). Piège : rattacher d’emblée la dyspnée au rein retarde le diagnostic cardiaque. Une dyspnée de repos avec surcharge relève de l’évaluation urgente.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, figure 49</a> ; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-1-body-fluids-and-fluid-compartments" target="_blank" rel="noopener">OpenStax 26.1</a> ; <a href="https://www.chuv.ch/fr/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/signes-et-symptomes" target="_blank" rel="noopener">CHUV (29.01.2020)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">HUG (2017)</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/medecine-vasculaire/enseignement/vasculaire_323/site/html/cours.pdf" target="_blank" rel="noopener">Médecine vasculaire, item 323</a>.</p></template>
<template data-pop="n18-sm-appetit" data-title="Appétit diminué, nausées et perte de poids"><p>Une diminution de l’appétit touche 42 % des personnes atteintes de maladie rénale chronique sans suppléance (KDIGO 2024, figure 49). Les HUG décrivent, vers 70 % de perte de filtration, des nausées, des vomissements, un manque d’appétit et un dégoût de la viande ; le CHUV situe ces troubles digestifs et la perte de poids aux stades avancés. Ils accompagnent l’accumulation de l’urée et des autres déchets que le rein n’élimine plus.</p><p>Valeur : KDIGO associe l’anorexie à la dépression, à la dénutrition, à une moins bonne qualité de vie, à davantage d’hospitalisations et à une mortalité plus élevée ; le retentissement des nausées n’a pas été évalué systématiquement. Technique : peser le patient sur la même balance, rechercher les vomissements, la douleur, les troubles dentaires et la constipation. Aux stades G4 et G5, après 65 ans ou en cas de perte de poids involontaire, de fragilité ou d’appétit réduit, la dénutrition se dépiste deux fois par an avec un outil validé.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, figure 49, tableau 38, point de pratique 5.2.3.2</a> ; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">HUG (09.03.2026)</a> ; <a href="https://www.chuv.ch/fr/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/signes-et-symptomes" target="_blank" rel="noopener">CHUV (29.01.2020)</a>.</p></template>
<template data-pop="n18-sm-prurit" data-title="Prurit associé à la maladie rénale chronique"><p>Le prurit est une sensation qui conduit à se gratter. Il touche 46 % des personnes atteintes de maladie rénale chronique sans suppléance (KDIGO 2024, figure 49) ; les HUG et le CHUV le citent parmi les manifestations des stades avancés. KDIGO souligne qu’il altère la qualité de vie et entretient d’autres symptômes : mauvais sommeil, fatigue et dépression.</p><p>Mécanisme : il n’est pas entièrement établi dans les sources lues. L’information professionnelle suisse de Kapruvia indique que les récepteurs opioïdes modulent les signaux de démangeaison et l’inflammation, et que l’activation des récepteurs kappa réduit les démangeaisons. Technique : préciser la topographie, l’horaire, le retentissement sur le sommeil et l’état de la peau. Piège : une peau sèche et une carence martiale, qui peut donner un prurit (mediX 2025), sont des causes à corriger d’abord.</p><p>Conduite : émollients hydratants si la peau est sèche, gabapentinoïdes avec réévaluation par un médecin selon KDIGO 2024. Kapruvia n’est autorisé en Suisse que chez l’adulte hémodialysé souffrant d’un prurit modéré à sévère. Un prurit rebelle attribuable à l’insuffisance rénale fait partie des motifs de début de la dialyse.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, figure 49, tableaux 38 et 41</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680686530027" target="_blank" rel="noopener">Information professionnelle suisse Kapruvia (mise à jour mai 2024)</a> ; <a href="https://www.medix.ch/fr/connaissances/guide-des-bonnes-pratiques/carence-en-fer/" target="_blank" rel="noopener">mediX (08/2025)</a> ; <a href="https://www.chuv.ch/fr/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/signes-et-symptomes" target="_blank" rel="noopener">CHUV (29.01.2020)</a>.</p></template>
<template data-pop="n18-sm-crampes" data-title="Crampes et impatiences"><p>Les crampes musculaires touchent 46 % des personnes atteintes de maladie rénale chronique sans suppléance (KDIGO 2024, figure 49). Les HUG citent les crampes musculaires et les impatiences parmi les signes qui apparaissent vers 70 % de perte de filtration. Le mécanisme des crampes n’est pas décrit dans les sources lues : la leçon ne l’invente pas.</p><p>Pour le syndrome des jambes sans repos, KDIGO recommande l’hygiène du sommeil, l’exercice, l’arrêt des médicaments qui interfèrent avec la voie dopaminergique et la correction des facteurs contributifs, comme l’hyperphosphatémie et la carence en fer ou l’anémie. Technique : préciser le retentissement sur le sommeil et rechercher une carence martiale.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, figure 49 et tableau 38</a> ; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">HUG (09.03.2026)</a>.</p></template>
<template data-pop="n18-sm-nycturie" data-title="Nycturie — définitions, mécanisme et calendrier mictionnel"><p>Deux définitions coexistent. L’International Continence Society, citée par la Revue médicale suisse, définit la nycturie comme la plainte de devoir se réveiller la nuit pour uriner, chaque miction étant précédée et suivie de sommeil ; la dernière miction avant l’endormissement et la première du matin ne comptent pas. L’Académie nationale de médecine la définit comme un rythme inversé de l’excrétion urinaire, devenue à prédominance nocturne, observé par exemple dans l’insuffisance rénale chronique, en raison d’une excrétion retardée de la charge osmotique d’origine alimentaire.</p><p>Trois mécanismes s’opposent : la polyurie nocturne, définie après 65 ans par une diurèse nocturne supérieure à 33 % de la diurèse de 24 heures ; la polyurie globale, supérieure à 40 mL/kg par 24 heures ; et la petite capacité vésicale, inférieure à 150 mL. Les syndromes œdémateux, dont l’insuffisance rénale, un diurétique pris moins de 6 heures avant le coucher et les boissons du soir favorisent la polyurie nocturne.</p><p>Technique : le calendrier mictionnel recueille sur 24 heures le nombre de mictions, leurs horaires, les volumes bus et urinés. Valeur : les sources lues ne chiffrent pas la nycturie dans la maladie rénale chronique ; après 70 ans, 69 à 93 % des hommes se lèvent au moins une fois par nuit, ce qui rend ce symptôme peu spécifique chez la personne âgée.</p><p class="src">Sources : <a href="https://revmed.ch/view/432498/3722690/RMS_582_1" target="_blank" rel="noopener">Da Costa et coll., « Nycturie du patient âgé : en pratique », Rev Med Suisse 2017;13:1946-51</a> ; <a href="https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26555928/nycturie" target="_blank" rel="noopener">Académie nationale de médecine (2016), via le Grand dictionnaire terminologique</a>.</p></template>
<template data-pop="n18-sm-pa" data-title="Pression artérielle — mécanisme rénal et technique de mesure"><p>Mécanisme : quand les reins fonctionnent moins bien, le sodium s’accumule et favorise la rétention d’eau, qui élève la pression ; la régulation hormonale de la pression, dépendante du rein, se dérègle aussi. L’hypertension peut apparaître dès que les reins fonctionnent à 90 % (HUG 2026). Elle est souvent la première manifestation, avec des valeurs souvent supérieures à 140/90 mmHg, et reste elle-même silencieuse (CHUV).</p><p>Technique au cabinet selon la Société européenne de cardiologie (2024, § 5.2.2) : patient assis confortablement, dos soutenu et jambes décroisées, après 5 minutes de repos ; brassard au bras, à hauteur du cœur, bras soutenu pour éviter un effort isométrique ; trois mesures espacées de 1 à 2 minutes, et des mesures supplémentaires seulement si les valeurs diffèrent de plus de 10 mmHg. Les HUG demandent aussi, à chaque consultation, le contrôle du carnet d’automesures.</p><p>Piège : une cible tensionnelle n’a de sens qu’avec la méthode de mesure qui lui correspond ; les objectifs KDIGO et SSN sont repris dans l’onglet Pathologie.</p><p class="src">Sources : <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">HUG (09.03.2026)</a> ; <a href="https://www.chuv.ch/fr/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/signes-et-symptomes" target="_blank" rel="noopener">CHUV (29.01.2020)</a> ; <a href="https://academic.oup.com/eurheartj/article/45/38/3912/7741010" target="_blank" rel="noopener">Société européenne de cardiologie, recommandations 2024 sur l’hypertension</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">HUG (2017), § 3.1</a>.</p></template>
<template data-pop="n18-sm-orthostatisme" data-title="Hypotension orthostatique — technique et seuils"><p>Définition de la Société européenne de cardiologie (2024, § 5.1) : baisse d’au moins 20 mmHg de la pression systolique ou d’au moins 10 mmHg de la diastolique, mesurée debout à 1 minute ou à 3 minutes, après 5 minutes en position assise ou couchée.</p><p>Portée dans la maladie rénale chronique : la check-list des HUG sous inhibiteur de l’enzyme de conversion commence par la question de l’hypotension orthostatique, et la SSN demande d’adapter la cible tensionnelle à la fragilité, aux comorbidités et à l’hypotension orthostatique. Piège : une mesure rapide sans repos ni délai debout ne permet pas de conclure ; le résultat se note avec la position, le délai et les symptômes.</p><p class="src">Sources : <a href="https://academic.oup.com/eurheartj/article/45/38/3912/7741010" target="_blank" rel="noopener">Société européenne de cardiologie 2024</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">HUG (2017), check-list</a> ; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN (17.03.2025), figure 3</a>.</p></template>
<template data-pop="n18-sm-godet" data-title="Œdème prenant le godet — technique, mécanisme, limites"><p>Normal d’abord : sans œdème, les reliefs osseux et tendineux restent visibles et l’appui du doigt ne laisse aucune empreinte. L’œdème correspond à une rétention d’eau et de sodium dans les espaces interstitiels ; il atténue puis efface ces reliefs.</p><p>Technique : appuyer avec un doigt sur la zone suspecte ; si la dépression persiste plusieurs secondes après le retrait, l’œdème prend le godet (OpenStax 26.1 ; médecine vasculaire, item 323). Chez le patient alité, l’œdème de cause générale se cherche aux fesses, à la face postérieure des cuisses et aux lombes, car sa topographie varie avec la position.</p><p>Mécanisme dans la maladie rénale : rétention hydrosodée, mécanisme des œdèmes de l’insuffisance rénale terminale oligurique ; dans le syndrome néphrotique, baisse de la pression oncotique par hypoalbuminémie. Limite : le godet ne désigne pas la cause. Un œdème unilatéral oriente vers une cause locale ; un signe de Stemmer, vers un lymphœdème ; une chronologie médicamenteuse, vers un inhibiteur calcique dihydropyridinique.</p><p class="src">Sources : <a href="https://archives.uness.fr/sites/campus-unf3s-2014/medecine-vasculaire/enseignement/vasculaire_323/site/html/cours.pdf" target="_blank" rel="noopener">Collège des enseignants de médecine vasculaire, item 323 (Université médicale virtuelle francophone, 2010-2011)</a> ; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-1-body-fluids-and-fluid-compartments" target="_blank" rel="noopener">OpenStax 26.1</a>.</p></template>
<template data-pop="n18-sm-paleur" data-title="Pâleur — où la chercher et ce qu’elle vaut"><p>La pâleur traduit une anémie. Dans la maladie rénale chronique, l’anémie résulte d’un déficit en érythropoïétine, d’une inhibition de l’érythropoïèse par les toxines urémiques, d’une durée de vie raccourcie des globules rouges et d’une homéostasie du fer perdue (HUG 2017).</p><p>Technique et valeur : mediX qualifie la pâleur cutanée de signe douteux et la pâleur des muqueuses, en particulier conjonctivale, de signe plus fiable ; les sources lues ne lui attribuent ni sensibilité ni spécificité chiffrées. Piège : une conjonctive colorée n’exclut pas une anémie modérée. La décision repose sur l’hémoglobine et le bilan martial.</p><p class="src">Sources : <a href="https://www.medix.ch/fr/connaissances/guide-des-bonnes-pratiques/carence-en-fer/" target="_blank" rel="noopener">mediX, Carence en fer (08/2025)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">HUG (2017), § 3.5.2</a>.</p></template>
<template data-pop="n18-sm-oligurie" data-title="Oligurie et anurie — définitions et portée"><p>Normal d’abord : l’adulte produit 1 à 2 litres d’urine par jour. Le rein doit en produire au moins 500 mL environ pour éliminer les déchets ; une production inférieure s’appelle une oligurie, et l’absence quasi complète d’urine une anurie (OpenStax 25.1).</p><p>Portée : le CHUV rappelle que les reins peuvent perdre 80 à 90 % de leur fonction avant de réduire la production d’urine ; une diurèse conservée ne prouve donc pas une filtration conservée. À l’inverse, une oligoanurie nouvelle avec une créatinine en hausse rapide dans un syndrome néphritique évoque une glomérulonéphrite rapidement progressive, urgence néphrologique selon les HUG.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-1-physical-characteristics-of-urine" target="_blank" rel="noopener">OpenStax 25.1</a> ; <a href="https://www.chuv.ch/fr/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/signes-et-symptomes" target="_blank" rel="noopener">CHUV (29.01.2020)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">HUG (2017), § 2.3</a>.</p></template>
<template data-pop="n18-sm-hyperk" data-title="Hyperkaliémie — signes cliniques et électrocardiogramme"><p>Le potassium retenu par le rein peut provoquer des troubles du rythme cardiaque (CHUV). Le Conseil européen de réanimation classe l’hyperkaliémie selon la kaliémie : légère de 5,5 à 5,9 mmol/L, modérée de 6,0 à 6,4, sévère à partir de 6,5 et extrême à partir de 9,0 mmol/L.</p><p>Signes : une faiblesse des membres, une paralysie flasque ou des paresthésies peuvent indiquer une hyperkaliémie sévère. À l’électrocardiogramme apparaissent progressivement une onde T ample et pointue, plus grande que l’onde R dans plus d’une dérivation, un PR supérieur à 0,2 s, une onde P aplatie ou absente, un QRS supérieur à 0,12 s, une onde sinusoïdale, une tachycardie ventriculaire, une bradycardie, puis l’arrêt cardiaque.</p><p>Valeur et piège : l’électrocardiogramme reflète la sévérité et la vitesse d’installation, mais il peut être normal même en cas d’hyperkaliémie sévère. Lorsqu’il établit le diagnostic, le traitement peut débuter avant le résultat du laboratoire. Chez les patients en hyperkaliémie sévère, 15 % présentent une arythmie ou un arrêt cardiaque dans les 6 heures suivant le premier tracé.</p><p class="src">Sources : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">Lott et coll., European Resuscitation Council Guidelines 2025 Special Circumstances in Resuscitation, Resuscitation 2025;215:110753</a> ; <a href="https://www.chuv.ch/fr/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/signes-et-symptomes" target="_blank" rel="noopener">CHUV (29.01.2020)</a>.</p></template>
<template data-pop="n18-sm-bandelette" data-title="Bandelette urinaire au lit du malade — portée et limites"><p>Les HUG recommandent, chez une personne à risque, une créatinine plasmatique et un « sédiment urinaire » dès la première consultation : bandelette complétée par un examen au microscope. Devant des œdèmes sans signe cardiaque ou hépatique, la bandelette et la créatinine viennent en premier ; une bandelette positive fait doser l’albuminémie et quantifier la protéinurie.</p><p>Limites selon KDIGO 2024 : les bandelettes qui mesurent les protéines totales sont trop peu sensibles, ne corrigent pas la concentration urinaire, restent semi-quantitatives et ne sont pas standardisées entre fabricants. Un résultat positif se confirme au laboratoire par un ACR ou un rapport protéines/créatinine, de préférence sur les premières urines du matin. Une bandelette d’albumine peut manquer d’autres protéines.</p><p class="src">Sources : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">HUG (2017), § 2.2</a> ; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, points de pratique 1.3.1.1 et 1.3.1.2, tableau 16</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/medecine-vasculaire/enseignement/vasculaire_323/site/html/cours.pdf" target="_blank" rel="noopener">Médecine vasculaire, item 323, partie III</a>.</p></template>
