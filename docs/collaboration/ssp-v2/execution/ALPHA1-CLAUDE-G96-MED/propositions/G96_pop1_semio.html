<template data-pop="g96-sm-orthostatique" data-title="Céphalée orthostatique : mécanisme, technique, valeur">
<div class="lab">Normal</div>
<p data-src="S24">Chez le sujet sain, le lever ne transfère que quelques millilitres de liquide du crâne vers le rachis ; la pression intracrânienne reste physiologique et aucune céphalée n’apparaît.</p>
<div class="lab">Mécanisme</div>
<p data-src="S24 S5">La fuite diminue le volume de liquide et augmente la compliance. Au lever, une part plus grande du liquide crânien passe dans le rachis ; la pression intracrânienne devient pathologiquement basse et le cerveau s’affaisse, ce qui tire sur la dure-mère et les nerfs crâniens. Couché, la pression redevient positive et la douleur cède.</p>
<div class="lab">Technique</div>
<p data-src="S2">Le médecin fait chronométrer trois délais : l’intensité au réveil (absente ou légère, 1 à 3 sur 10), l’apparition moins de deux heures après le lever, une amélioration de plus de 50 % moins de deux heures après le retour couché. Les horaires doivent être constants.</p>
<div class="lab">Valeur</div>
<p data-src="S5 S28">Présente chez 75 à 80 % des patients selon l’encadré de la classification, et chez 92 % des patients ayant une céphalée dans la méta-analyse de 2021. Aucune sensibilité ni spécificité n’est donnée par les sources lues.</p>
<div class="lab">Piège</div>
<p data-src="S3 S28">Le caractère postural peut s’estomper avec le temps : il se recherche au début de l’histoire. Huit pour cent des céphalées ne sont pas orthostatiques et 3 % des patients n’ont pas de céphalée.</p></template>
<template data-pop="g96-sm-cochleo" data-title="Symptômes cochléovestibulaires">
<div class="lab">Description</div>
<p data-src="S2 S5">Le patient décrit une audition étouffée ou une sensation d’oreille pleine, des acouphènes ou des vertiges. Environ la moitié des patients ont des troubles auditifs.</p>
<div class="lab">Valeur</div>
<p data-src="S2">Vertiges 50,5 %, audition étouffée 37,1 %, acouphènes 27,7 %, baisse de l’audition 26,2 % dans le tableau 3 du consensus britannique.</p>
<div class="lab">Mécanisme</div>
<p>Les sources lues ne précisent pas le mécanisme de ces symptômes ; le cours n’en propose pas.</p>
<div class="lab">Piège et discriminant</div>
<p data-src="S6 S2">Certains patients sont d’abord traités pour une surdité brusque ou une maladie de Ménière. Face à une migraine, un vertige isolé oriente vers la migraine, une baisse de l’audition et des acouphènes vers la fuite.</p></template>
<template data-pop="g96-sm-diplopie" data-title="Diplopie et nerfs crâniens">
<div class="lab">Mécanisme</div>
<p data-src="S5">L’affaissement du cerveau exerce une traction sur les nerfs crâniens. Les nerfs abducens, oculomoteur et trochléaire peuvent être atteints ; un déficit du champ visuel est aussi décrit.</p>
<div class="lab">Technique</div>
<p data-src="S2 S5">Le médecin recherche une paralysie du nerf abducens et un déficit du champ visuel, deux atteintes décrites dans la maladie. Les sources lues ne décrivent pas de technique propre à la maladie.</p>
<div class="lab">Valeur</div>
<p data-src="S5 S28 S2">Moins de 10 % des patients ; 6 % dans la méta-analyse ; paralysie du nerf abducens chez 1 %.</p>
<div class="lab">Piège</div>
<p data-src="S2">Un changement brutal de l’examen neurologique fait chercher une thrombose veineuse cérébrale par angioscanner ou IRM veineuse.</p></template>
<template data-pop="g96-sm-vigilance" data-title="Troubles cognitifs, du comportement et de la vigilance">
<div class="lab">Description</div>
<p data-src="S2">Les troubles cognitifs sont surtout des difficultés de concentration et de recherche du mot. Un syndrome frontotemporal comportemental et un coma sont rares.</p>
<div class="lab">Valeur</div>
<p data-src="S2">Troubles cognitifs 31,7 %, syndrome frontotemporal comportemental 2,5 %, coma 0,5 %.</p>
<div class="lab">Conséquence</div>
<p data-src="S2 S5">Une baisse de vigilance est un signe de gravité ; elle impose l’imagerie et l’avis d’un centre spécialisé. Attribuer ces troubles à un épuisement professionnel retarde le diagnostic.</p></template>
<template data-pop="g96-sm-siderose" data-title="Sidérose superficielle : signes et recherche">
<div class="lab">Signes</div>
<p data-src="S2">Une ataxie, une baisse de l’audition ou des signes médullaires chez un patient porteur d’une fuite doivent faire suspecter une sidérose superficielle.</p>
<div class="lab">Recherche</div>
<p data-src="S2">IRM du cerveau et du rachis avec séquences sensibles au sang ; la ferritine du liquide et la xanthochromie peuvent être mesurées.</p>
<div class="lab">Valeur et divergence</div>
<p data-src="S2 S5">1,5 % dans le tableau 3 du consensus britannique ; 5 à 10 % dans l’encadré de la revue de Fribourg. L’écart reste inexpliqué par les sources lues.</p></template>
<template data-pop="g96-sm-constantes" data-title="Constantes couché puis debout : technique et seuils">
<div class="lab">Technique</div>
<p data-src="S2">Le médecin mesure la fréquence cardiaque et la pression artérielle couché, puis debout, au cours d’une épreuve formelle de station debout.</p>
<div class="lab">Seuils</div>
<p data-src="S2">Une hausse de la fréquence cardiaque de plus de 30 par minute signe une tachycardie orthostatique posturale. Une chute de plus de 20 mmHg de la pression systolique et/ou de plus de 10 mmHg de la diastolique signe une hypotension orthostatique.</p>
<div class="lab">Limite</div>
<p data-src="S2">Une épreuve négative n’exclut pas une tachycardie orthostatique posturale : si la suspicion reste forte, une exploration autonome complémentaire se discute.</p></template>
<template data-pop="g96-sm-gaineoptique" data-title="Échographie de la gaine du nerf optique">
<div class="lab">Principe</div>
<p data-src="S5">La gaine du nerf optique contient du liquide céphalorachidien. Chez le patient atteint, sa largeur diminue lorsqu’il passe de la position couchée à la position debout.</p>
<div class="lab">Seuil</div>
<p data-src="S5">Une diminution de plus de 5 % est considérée comme pathologique. Ce changement est décrit dans l’hypotension intracrânienne spontanée et non dans la tachycardie orthostatique posturale.</p>
<div class="lab">Place en Suisse</div>
<p data-src="S30">L’Inselspital de Berne l’intègre, avec l’IRM crânienne et spinale, aux examens non invasifs de son schéma diagnostique par étapes.</p>
<div class="lab">Limite</div>
<p>Les sources lues ne donnent ni sensibilité ni spécificité ; l’examen relève d’un centre entraîné.</p></template>
