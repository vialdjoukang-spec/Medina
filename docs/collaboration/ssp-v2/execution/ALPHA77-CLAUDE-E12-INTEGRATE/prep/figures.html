<!-- Figure 2 — dans #e12-s-anat-cours — Variante A -->
<figure><img src="assets/img/e12/alpha/claude/e12-fig2-pancreatite-chronique-calcifiante-ct-hellerhoff.jpg" alt="Tomodensitométrie abdominale en coupe axiale : multiples calcifications blanches alignées le long du corps et de la queue du pancréas, désignées par une flèche rouge." width="580" height="479" loading="lazy" decoding="async"><figcaption>Figure 2 — Pancréatite chronique calcifiante en tomodensitométrie (CT) axiale : de multiples calcifications pancréatiques, désignées par la flèche, suivent le corps et la queue de la glande. Le CT est la méthode la plus adaptée pour montrer les calcifications pancréatiques (HaPanEU 2017, énoncé 2-2). La source ne précise pas la cause de cette pancréatite : l’image illustre le signe recherché dans la FCPD, non une FCPD prouvée. <small>Image : Hellerhoff (flèche ajoutée par Doc James), <a href="https://commons.wikimedia.org/wiki/File:Chronische_Pankreatitis_mit_Verkalkungen_-_CT_axial.jpg" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener" data-reference-source="1">CC BY-SA 3.0</a>.</small></figcaption></figure>

<!-- Figure 3 — dans #e12-s-histo-cours — Variante A -->
<figure><img src="assets/img/e12/alpha/claude/e12-fig3-ilot-langerhans-he-polarlys.jpg" alt="Coupe histologique de pancréas colorée à l’hémalun-éosine : au centre, un îlot de cellules endocrines plus pâles ; autour, des acinus exocrines plus sombres." width="596" height="518" loading="lazy" decoding="async"><figcaption>Figure 3 — Îlot de Langerhans normal, coloration hémalun-éosine : au centre, l’îlot de cellules endocrines plus pâles, qui sécrètent notamment l’insuline et le glucagon ; autour, les acinus exocrines plus sombres. Dans la FCPD, la destruction des cellules alpha réduit la réserve de glucagon (Endotext 2024). L’image montre un îlot conservé, non un îlot fibrosé ; aucune micrographie d’îlot de FCPD sous licence libre n’a été trouvée. <small>Image : Polarlys, <a href="https://commons.wikimedia.org/wiki/File:Langerhanssche_Insel.jpg" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence <a href="https://creativecommons.org/licenses/by/2.5" target="_blank" rel="noopener" data-reference-source="1">CC BY 2.5</a>.</small></figcaption></figure>
