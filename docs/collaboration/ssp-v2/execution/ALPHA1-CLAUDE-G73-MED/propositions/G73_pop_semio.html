<template data-pop="g73-sm-faiblesse" data-title="Faiblesse proximale : technique, mécanisme, valeur, piège"><div class="lab">Normal</div><p>Un sujet sain se relève d’une chaise et monte un escalier sans appui.</p><div class="lab">Technique</div><p>Le médecin observe le relever d’une chaise, puis teste les muscles proximaux des membres inférieurs, des membres supérieurs et enfin les muscles distaux, dans l’ordre d’extension de la maladie [S3].</p><div class="lab">Mécanisme</div><p>Les anticorps anti-VGCC réduisent la libération d’acétylcholine : moins de fibres atteignent leur seuil et la force diminue [S24].</p><div class="lab">Valeur</div><p>La faiblesse proximale des jambes est le symptôme moteur initial le plus fréquent [S7]. Les membres supérieurs sont atteints chez 74 % des patients avec cancer et 52 % sans cancer dans la cohorte prospective [S4].</p><div class="lab">Piège</div><p>Toute myopathie proximale produit la même plainte : la dysautonomie et l’électrophysiologie orientent vers la jonction [S3].</p></template>
<template data-pop="g73-sm-reflexes" data-title="Réflexes et facilitation post-effort"><div class="lab">Normal</div><p>Dans la myasthénie, comme chez le sujet sain, les réflexes ostéotendineux sont présents [S18].</p><div class="lab">Technique</div><p>Le médecin teste le réflexe au repos, fait contracter le muscle au maximum pendant environ 10 secondes, puis teste à nouveau [S18].</p><div class="lab">Mécanisme</div><p>L’activité répétée augmente transitoirement la libération d’acétylcholine, propriété de plasticité à court terme de la zone active [S32 ; S5].</p><div class="lab">Valeur</div><p>La facilitation de la force ou des réflexes n’est observée que chez un tiers des patients [S18].</p><div class="lab">Piège</div><p>Son absence n’exclut pas le diagnostic ; la stimulation nerveuse répétée tranche [S3].</p></template>
<template data-pop="g73-sm-bouche" data-title="Bouche sèche : signe autonome"><div class="lab">Mécanisme</div><p>Les canaux calciques P/Q existent aussi dans le système nerveux autonome ; les anticorps y réduisent la transmission [S24].</p><div class="lab">Valeur</div><p>Dysautonomie chez environ 90 % des patients [S3]. Bouche sèche : 56 % avec cancer, 61 % sans cancer [S4].</p><div class="lab">Piège</div><p>Elle aide à reconnaître le syndrome et à le distinguer de la myasthénie, où la dysautonomie manque [S18] ; elle ne prédit pas le cancer [S4].</p></template>
<template data-pop="g73-sm-erectile" data-title="Dysfonction érectile : item du DELTA-P"><div class="lab">Mécanisme</div><p>Atteinte autonome par les mêmes anticorps [S24].</p><div class="lab">Valeur</div><p>56 % des hommes avec cancer et 47 % sans cancer ; c’est l’item le moins performant du DELTA-P, dont le retrait donne un score à cinq items d’aire 84,5 % [S4].</p><div class="lab">Piège</div><p>Son début est difficile à dater chez l’homme âgé ou porteur d’une comorbidité ; chez la femme, l’item est coté 0 [S4].</p></template>
