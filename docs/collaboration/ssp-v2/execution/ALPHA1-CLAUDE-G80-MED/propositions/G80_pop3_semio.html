<template data-pop="g80-sm-fidgety" data-title="Fidgety movements : présence, absence, valeur">
<div class="lab">Normal</div><p>Le nourrisson sain produit des mouvements spontanés variés ; les fidgety movements, petits mouvements continus, sont présents pendant la période d’évaluation des mouvements généraux, avant 5 mois d’âge corrigé [S5].</p><div class="lab">Technique</div><p>Un professionnel formé observe le mouvement spontané, le plus souvent filmé ; l’évaluation exige de distinguer une variation normale d’un mouvement atypique [S5].</p><div class="lab">Valeur</div><p>Sensibilité 98 % dans la revue systématique [S5]. Dans une série cas-témoins italienne de 441 nourrissons à haut risque, absence à 3 mois : sensibilité 95 %, spécificité 97 %, soit un rapport de vraisemblance positif d’environ 32 et négatif d’environ 0,05 [S26].</p><div class="lab">Piège</div><p>Le schéma cas-témoins surestime la précision ; certaines formes hémiplégiques échappent à cet outil [S5].</p>
</template>
<template data-pop="g80-sm-hine" data-title="HINE : seuils et orientation">
<div class="lab">Seuils</div><p>Score inférieur à 73 à 6, 9 ou 12 mois : haut risque de PC. Score inférieur à 40 : presque toujours une PC [S5].</p><div class="lab">Orientation</div><p>50 à 73 : forme unilatérale probable, 95 à 99 % marcheront ; inférieur à 50 : forme bilatérale probable. À 3–6 mois, 40 à 60 : GMFCS I–II probable ; inférieur à 40 : GMFCS III–V probable [S5].</p><div class="lab">Valeur</div><p>À 3 mois : sensibilité 88 %, spécificité 62 % dans une série cas-témoins italienne [S26] ; rapport de vraisemblance positif d’environ 2,3 (calcul de l’audit).</p><div class="lab">Piège</div><p>Un score isolé à 3 mois produit des faux positifs ; il se combine à l’imagerie [S26].</p>
</template>
<template data-pop="g80-sm-asymetrie" data-title="Asymétrie d’usage des mains">
<div class="lab">Mécanisme</div><p>Dans la PC unilatérale, le nourrisson acquiert le sourire, la déglutition et la tenue de tête ; l’asymétrie n’apparaît qu’au moment des gestes complexes comme la préhension [S5].</p><div class="lab">Valeur</div><p>Signe d’entrée de la voie de détection après 5 mois d’âge corrigé ; il justifie des examens standardisés [S5]. Sa sensibilité n’est pas chiffrée dans les sources lues.</p><div class="lab">Piège</div><p>Le score moteur peut rester normal si l’enfant réalise l’épreuve d’une seule main [S5].</p>
</template>
<template data-pop="g80-sm-assise" data-title="Absence d’assise seule à 9 mois">
<div class="lab">Seuil</div><p>Un nourrisson qui ne tient pas assis seul à 9 mois doit recevoir des examens standardisés de dépistage de la PC [S5].</p><div class="lab">Limite</div><p>Un retard isolé n’est pas un diagnostic : la PC exige un trouble moteur et au moins un critère supplémentaire, imagerie anormale ou anamnèse à risque [S5].</p>
</template>
<template data-pop="g80-sm-orteils" data-title="Appui sur les orteils">
<div class="lab">Seuil</div><p>L’incapacité à prendre appui sur toute la plante du pied, talon et avant-pied, fait partie des signes qui imposent des examens standardisés [S5].</p><div class="lab">Orientation</div><p>Associée à une bonne fonction des mains, elle oriente vers une forme bilatérale à prédominance crurale [S5].</p><div class="lab">Limite</div><p>Son mécanisme et sa valeur chiffrée ne sont pas détaillés dans les sources lues.</p>
</template>
