<template data-pop="g90-sm-station" data-title="Mesure couchée puis debout : technique et lecture">
<div class="lab">Technique</div>
<p>Le patient reste couché au moins 5 minutes, puis se lève et reste immobile ; la pression et la fréquence cardiaque sont notées à des temps fixes jusqu’à 3 minutes [S3]. Le sphygmomanomètre suffit pour les formes classique et retardée ; la forme initiale, qui dure moins de 15 secondes, exige une mesure continue battement par battement [S1 ; S3].</p>
<div class="lab">Lecture</div>
<p>Une chute systolique d’au moins 20 mmHg, diastolique d’au moins 10 mmHg, ou une systolique inférieure à 90 mmHg définit l’hypotension orthostatique [S1]. Une accélération cardiaque de 10 battements par minute ou moins, ou un rapport accélération sur chute systolique inférieur à 0,5 battement par minute et par mmHg, plaide pour une cause neurogène [S1 ; S3].</p>
<div class="lab">Exemple chiffré</div>
<p>Une pression de 132 puis 104 mmHg donne une chute de 28 mmHg ; une fréquence de 64 puis 71 donne 7 battements ; le rapport vaut 7 / 28 = 0,25, donc inférieur à 0,5.</p>
<div class="lab">Piège</div>
<p>Un brassard automatique répète ses mesures quand les valeurs divergent et peut manquer une chute rapide [S1].</p>
</template>
<template data-pop="g90-sm-pupille" data-title="Pupilles et paupières dans le syndrome de Claude Bernard-Horner">
<div class="lab">Normal</div>
<p>Les pupilles sont de même taille et se dilatent ensemble dans l’obscurité ; le muscle de Müller relève la paupière de 2 à 3 mm [S4].</p>
<div class="lab">Technique</div>
<p>Le médecin observe en lumière vive, éteint brusquement la lumière, puis compare les pupilles à 5 secondes et à 15 secondes. La pupille atteinte reste petite les 5 premières secondes, puis se dilate lentement : c’est le retard de dilatation [S4].</p>
<div class="lab">Valeur</div>
<p>Myosis chez 98 % et ptosis chez 88 % des 450 patients d’une série ; le retard de dilatation est très spécifique mais pas toujours présent [S4].</p>
<div class="lab">Piège</div>
<p>Un ptosis marqué n’est pas expliqué par le Horner seul ; la paupière inférieure peut être légèrement remontée [S4].</p>
</template>
<template data-pop="g90-sm-anhidrose" data-title="Rechercher une anhidrose">
<div class="lab">Technique</div>
<p>Une cuillère métallique glisse moins bien sur la peau sèche du côté atteint. Le test amidon-iode colore en bleu la peau qui transpire après chaleur ou effort ; le côté atteint reste incolore [S4].</p>
<div class="lab">Topographie</div>
<p>L’anhidrose couvre l’hémiface dans les lésions de premier et de deuxième ordre ; elle se limite à une petite zone frontale dans les lésions de troisième ordre [S4].</p>
<div class="lab">Limite</div>
<p>L’anhidrose n’est notée que chez 4 % des patients d’une grande série, en partie parce qu’elle n’était pas recherchée : son absence n’exclut pas le diagnostic [S4].</p>
</template>
<template data-pop="g90-sm-da" data-title="Signes de la dysréflexie autonome">
<div class="lab">Signes</div>
<p>Céphalée, sudation, rougeur au-dessus de la lésion, piloérection, congestion nasale, vision floue et anxiété ; la céphalée et la sudation sont présentes dans 88 % des épisodes [S5].</p>
<div class="lab">Fréquence cardiaque</div>
<p>La définition classique associe hypertension et bradycardie, mais une tachycardie est observée aussi souvent dans une série, et plus souvent dans d’autres : un pouls rapide n’exclut pas la dysréflexie [S5].</p>
<div class="lab">Seuil</div>
<p>La définition retenue par la source est une hausse brutale de la systolique de 20 à 40 mmHg au-dessus de la base chez l’adulte, de 15 à 20 mmHg chez l’enfant [S5]. La pression de base du patient doit donc être connue.</p>
</template>
<template data-pop="g90-sm-budapest" data-title="Examen d’un membre douloureux selon Budapest">
<div class="lab">Technique</div>
<p>Le médecin compare les deux membres dans quatre catégories : sensitive, vasomotrice, sudomotrice et œdème, motrice et trophique. Il exige au moins un symptôme dans trois catégories et au moins un signe observé dans deux catégories [S6].</p>
<div class="lab">Valeur</div>
<p>Sensibilité 0,99, spécificité 0,68 : dans l’étude de validation, 32 % des patients douloureux sans la maladie remplissaient les critères [S6 ; S7].</p>
<div class="lab">Piège</div>
<p>Les signes psychologiques n’excluent pas le diagnostic ; l’exclusion des autres causes reste obligatoire [S6].</p>
</template>
<template data-pop="g90-sm-pots" data-title="Tachycardie posturale : critères chiffrés">
<div class="lab">Critères</div>
<p>Accélération soutenue de plus de 30 battements par minute, ou fréquence de plus de 120 par minute, dans les 10 minutes de station debout ou d’inclinaison, sans chute de pression répondant aux critères d’hypotension orthostatique [S3]. De 12 à 19 ans, l’accélération requise dépasse 40 battements par minute [S3].</p>
<div class="lab">Diagnostic</div>
<p>Le diagnostic est clinique : il exige des symptômes d’intolérance orthostatique et la mesure d’une tachycardie posturale excessive au test d’inclinaison ou au test de station debout active [S3]. Chez l’adolescent, la revue suisse retient le test de Schellong [S19].</p>
<div class="lab">Exemple chiffré</div>
<p>Une fréquence de 72 puis 108 par minute donne 36 battements : le critère est rempli à 22 ans, mais pas à 16 ans, car 36 ne dépasse pas 40.</p>
</template>
