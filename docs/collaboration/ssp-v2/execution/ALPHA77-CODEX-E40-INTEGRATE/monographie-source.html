</div><div class="sci" id="e40-s-histo" role="tabpanel" aria-labelledby="e40-tab-histo" hidden><section class="ilot" id="e40-s-histology" ><h2>Muqueuse, villosité et barrière : du normal à l’altération</h2><p>Un revêtement n’est pas seulement une frontière. L’épithélium œsophagien stratifié résiste aux contraintes mécaniques ; les glandes et le muscle contribuent au transit. L’épithélium intestinal possède une spécialisation absorbante et une bordure en brosse, avec cellules sécrétrices de mucus. Cette différence d’architecture correspond à des fonctions différentes.</p><figure data-e40-figure="esoph"><div data-e40-frame="tall"><img src="assets/img/e40/alpha/codex/gray1033.png" alt="Coupe histologique historique de l’œsophage humain, épithélium stratifié, sous-muqueuse glandulaire et couches musculaires" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Revêtement épithélial stratifié, protection contre les frottements.</li><li>Sous-muqueuse et glandes, à distinguer de la muqueuse.</li><li>Couches musculaires, nécessaires à la propulsion du bol alimentaire.</li></ol><p>Architecture humaine normale, pas lésion nutritionnelle ni mesure de déglutition. Une dysphagie peut limiter les apports, mais ne se diagnostique pas sur cette planche et ne signifie pas E40 à elle seule.</p><p data-e40-credit>Gray, Anatomy of the Human Body, édition 1918, planche 1033, coupe humaine d’après dessin de V. Horsley · <a href="https://commons.wikimedia.org/wiki/File:Gray1033.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Dans la villosité humaine dessinée parv.Ebner, l’anneau périphérique représente l’épithélium. Le chorion central contient vaisseaux et chylifère, avec cellules de soutien et cellules immunitaires. La figure comporte un espace de rétraction décrit dans sa légende : il s’agit d’un artefact de préparation, pas d’une preuve de lésion nutritionnelle.</p><figure data-e40-figure="villus"><div data-e40-frame="wide"><img src="assets/img/e40/alpha/codex/gray1060.png" alt="Coupe transversale historique d’une villosité de l’intestin humain, épithélium, cellules caliciformes, capillaires et chylifère" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span><span data-e40-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Épithélium absorbant et bordure striée, face vers la lumière.</li><li>Cellule caliciforme claire au sein de l’épithélium, productrice de mucus.</li><li>Chylifère central, voie lymphatique des lipides en chylomicrons.</li><li>Petit vaisseau sanguin du chorion, distinct du chylifère.</li></ol><p>Dessin histologique normal× 350, pas biopsie de malnutrition. La rétraction de membrane décrite dans la légende originale est un artefact, pas une lésion E40 ; aucun microbiote ni dosage protéique n’est visible.</p><p data-e40-credit>Gray, Anatomy of the Human Body, édition 1918, planche 1060, coupe humaine d’après v. Ebner · <a href="https://commons.wikimedia.org/wiki/File:Gray1060.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une diminution de la fonction absorbante ou une altération de la barrière peut contribuer à la malnutrition et à la vulnérabilité infectieuse. La revue pédiatrique retrouve des anomalies de barrière dans des études hétérogènes ; elle ne permet pas de reconnaître une maladie précise sur un dessin normal. Une diarrhée peut avoir plusieurs causes, dont infection, malabsorption ou intolérance pendant traitement.</p><p>La matrice extracellulaire et les vaisseaux lymphatiques appartiennent à l’environnement tissulaire qui régule le liquide. Des protéines associées à leur intégrité diffèrent entre groupes dans l’étude de 2022. Ce résultat ne transforme pas une coloration standard ou une image de villosité en dosage de matrice ni en diagnostic d’E40.</p><p><b>Science → clinique.</b> Distinguer douleur, dysphagie, diarrhée et faiblesse d’apports ; une atteinte histologique possible n’est pas prouvée par le symptôme seul.</p><p><b>Science → examen.</b> La biopsie n’est pas un examen obligatoire de tout œdème nutritionnel. L’enquête digestive est orientée par signes, trajectoire et maladies suspectées.</p><p><b>Science → traitement.</b> Adapter la prise alimentaire et traiter la cause tout en contrôlant la tolérance ; ne pas augmenter brutalement les apports pour compenser une diarrhée sans réévaluer le patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray1033.png" target="_blank" rel="noopener">IMG-ESOPH — Description humaine et licence</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray1060.png" target="_blank" rel="noopener">IMG-VILLUS — Description humaine et licence</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-7-chemical-digestion-and-absorption-a-closer-look" target="_blank" rel="noopener">NORMAL-GUT — Digestion protéines et absorption glucides, protéines, lipides</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a>.</p><div class="key"><b>À retenir.</b> Une architecture normale illustre la fonction ; elle ne prouve pas une lésion E40.</div></section>
</div><div class="sci" id="e40-s-physio" role="tabpanel" aria-labelledby="e40-tab-physio" hidden><section class="ilot" id="e40-s-physiology" ><h2>Absorption, bilan hydrique et lecture du poids</h2><p>Le bilan nutritionnel dépend de ce qui est absorbé et utilisé, et non uniquement de la nourriture proposée. La digestion transforme protéines et glucides en unités absorbables. Les transporteurs épithéliaux, les gradients ioniques et les voies sanguines/lymphatiques permettent leur distribution. Le transport de certains sucres ou acides aminés est associé au sodium ; les lipides longs empruntent une organisation différente.</p><p>Le liquide interstitiel résulte d’échanges continus. La pression hydrostatique, les propriétés de la barrière, les protéines et le drainage lymphatique contribuent à l’équilibre. Le modèle classique où tout liquide filtré serait simplement réabsorbé au pôle veineux est trop simplificateur ; le rôle du retour lymphatique doit rester visible.</p><p>L’albumine contribue à la pression oncotique, mais sa concentration dépend de plusieurs processus. L’étude pédiatrique compare des enfants à albumine comparable et retrouve encore des différences liées au phénotype œdémateux. Cela explique pourquoi « corriger l’albumine » n’est pas à lui seul un plan thérapeutique démontré de kwashiorkor.</p><p>Pendant stabilisation, un enfant œdémateux peut perdre du poids parce que l’eau diminue. Pendant renutrition, une hausse rapide peut au contraire refléter une rétention hydrique et nécessiter une évaluation. Le nombre sur la balance doit donc être relié à œdème, prises, diurèse, respiration, perfusion et évolution clinique.</p><p>Les quantités alimentaires ne sont pas universelles. L’OMS 2026 propose F75 en stabilisation des six à cinquante-neuf mois hospitalisés, puis transition. Les objectifs ESPEN adultes et les précautions suisses de renutrition répondent à une autre physiologie d’âge et à des populations différentes.</p><p><b>Science → clinique.</b> Une apparence gonflée peut masquer une perte de tissu ; un poids qui baisse peut être un bon signe si l’œdème et l’état général s’améliorent.</p><p><b>Science → examen.</b> Les mesures répétées et le bilan hydrique donnent un sens à la variation pondérale ; une valeur isolée ne distingue pas eau et tissu.</p><p><b>Science → traitement.</b> Ajuster énergie, volume et rythme selon la phase et la tolérance, en évitant la transposition des kcal/kg pédiatriques à l’adulte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-7-chemical-digestion-and-absorption-a-closer-look" target="_blank" rel="noopener">NORMAL-GUT — Digestion protéines et absorption glucides, protéines, lipides</a> ; <a data-reference-source="1" href="https://ec.europa.eu/programmes/erasmus-plus/project-result-content/d6eb4036-767f-4d49-bdde-70a1657290ee/Anatomy_Physiology_LymphSystem.pdf" target="_blank" rel="noopener">NORMAL-LYMPH — Fonctions lymphatiques et organisation immune</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRANS — 4.6.2–4.6.3 p 35–36</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-TARGET — Recommandations 10–12 et commentaires</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a>.</p><figure data-e40-figure="villus"><div data-e40-frame="wide"><img src="assets/img/e40/alpha/codex/gray1060.png" alt="Coupe transversale historique d’une villosité de l’intestin humain, épithélium, cellules caliciformes, capillaires et chylifère" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span><span data-e40-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Épithélium absorbant et bordure striée, face vers la lumière.</li><li>Cellule caliciforme claire au sein de l’épithélium, productrice de mucus.</li><li>Chylifère central, voie lymphatique des lipides en chylomicrons.</li><li>Petit vaisseau sanguin du chorion, distinct du chylifère.</li></ol><p>Dessin histologique normal× 350, pas biopsie de malnutrition. La rétraction de membrane décrite dans la légende originale est un artefact, pas une lésion E40 ; aucun microbiote ni dosage protéique n’est visible.</p><p data-e40-credit>Gray, Anatomy of the Human Body, édition 1918, planche 1060, coupe humaine d’après v. Ebner · <a href="https://commons.wikimedia.org/wiki/File:Gray1060.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><div class="key"><b>À retenir.</b> Lire le poids avec le compartiment hydrique et la phase de traitement.</div></section>
</div><div class="sci" id="e40-s-bio" role="tabpanel" aria-labelledby="e40-tab-bio" hidden><section class="ilot" id="e40-s-biochemistry" ><h2>Du catabolisme à la renutrition : glucose, phosphate et thiamine</h2><p>Quand les apports se réduisent durablement, l’organisme s’adapte à un état catabolique. La revue suisse décrit baisse de l’insuline, mobilisation des réserves et néoglucogenèse, avec recours aux substrats endogènes. La masse corporelle peut diminuer alors que certains dosages restent initialement dans leur intervalle de référence.</p><p>Lors de la reprise glucidique, la réponse anabolique augmente l’utilisation de glucose et les besoins intracellulaires en phosphate et autres électrolytes. Une concentration sanguine initialement normale ne garantit donc pas un stock corporel normal. Potassium et magnésium doivent être suivis ensemble ; une déplétion magnésienne peut entretenir une hypokaliémie malgré apport potassique.</p><p>La thiamine, sous forme active pyrophosphate, intervient comme cofacteur de voies du métabolisme glucidique et de la transcétolase. Ses besoins augmentent avec l’utilisation des glucides. Une carence sévère peut donner un tableau neurologique ou cardiaque ; l’indication et la voie du traitement doivent être évaluées, sans assimiler chaque confusion à une seule carence.</p><p>Le syndrome de renutrition peut associer hypophosphatémie, hypokaliémie, hypomagnésémie, troubles glycémiques, rétention d’eau et de sodium et défaillance d’organe. Les définitions varient et d’autres mécanismes abaissent le phosphate ; chronologie, autres causes et manifestations doivent être examinées. Il n’est pas assimilé à toute baisse isolée d’un ion.</p><p>La revue suisse recommande une prévention individualisée, thiamine avant reprise chez patient à risque, progression énergétique et surveillance rapprochée surtout dans les premières 72 heures, avec vulnérabilité pouvant durer jusqu’à dix jours. Elle concerne les adultes médicaux et exclut les troubles alimentaires de son champ : la source reconnaît les limites de preuve et les divergences de stratégie.</p><p><b>Science → clinique.</b> Une dégradation après reprise alimentaire demande une réévaluation urgente, pas simplement davantage de calories.</p><p><b>Science → examen.</b> Suivre P/K/Mg, glycémie, fonction rénale, bilan hydrique et symptômes avec leur trajectoire ; utiliser les intervalles du laboratoire.</p><p><b>Science → traitement.</b> Les apports et substitutions sont prescrits selon risque, organes et formulation. Benerva oral et injectable n’ont pas une dose interchangeable ; 200–300 mg de revue adulte ne devient pas une dose IV universelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-LIMIT — 3, 4 et 6, limites</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a>.</p><figure data-e40-figure="liver"><div data-e40-frame="wide"><img src="assets/img/e40/alpha/codex/liver-inferior.PNG" alt="Planche historique humaine de la face inférieure du foie avec hile, veine porte, vésicule et lobes" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Hile et région de la veine porte, nommés sur l’original : arrivée de nutriments absorbés.</li><li>Vésicule biliaire, réservoir de bile ; elle ne fabrique pas l’albumine.</li><li>Lobe droit et empreinte rénale, repères anatomiques normaux.</li></ol><p>Anatomie normale, sans stéatose, cirrhose ni hépatomégalie démontrées. Une palpation et un bilan orienté évaluent le patient ; la figure ne mesure pas sa fonction hépatique.</p><p data-e40-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 1086, face inférieure du foie d’après modèle de His · <a href="https://commons.wikimedia.org/wiki/File:Gray1086-liver.PNG" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><div class="key"><b>À retenir.</b> La reprise glucidique exige une surveillance des besoins et des stocks, pas un apport uniforme.</div></section>
</div><div class="sci" id="e40-s-immuno" role="tabpanel" aria-labelledby="e40-tab-immuno" hidden><section class="ilot" id="e40-s-immunology" ><h2>Barrières, infection et cercle nutritionnel</h2><p>Les défenses normales associent barrières cutanées et muqueuses, réponses innées et réponses adaptatives. La muqueuse digestive permet l’absorption tout en limitant l’entrée d’agents. Les tissus lymphatiques et les cellules immunitaires relient cette fonction locale à une réponse systémique.</p><figure data-e40-figure="kwa"><div data-e40-frame="tall"><img src="assets/img/e40/alpha/codex/kwashiorkor.jpg" alt="Portrait historique d’un enfant dont la source décrit un kwashiorkor, cheveux fins, joues arrondies et lésions commissurales" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cheveux fins et irréguliers, signes décrits dans la provenance.</li><li>Joue arrondie : l’inspection seule ne démontre pas le godet ni sa cause.</li><li>Lésion commissurale visible : à examiner, sans identifier une carence vitaminique sur la photographie seule.</li></ol><p>Portrait historique, pas un test diagnostique. La légende de 1970 réduit la cause aux protéines/vitamines ; cette explication n’est pas reprise comme connaissance actuelle. Aucun taux d’albumine ni grade d’œdème des pieds n’est visible.</p><p data-e40-credit>Centers for Disease Control and Prevention, photographie 1970, PHIL 6180 · <a href="https://commons.wikimedia.org/wiki/File:Kwashiorkor_6180.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public, œuvre USGov</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La malnutrition pédiatrique peut s’accompagner de perturbations de barrière, de sécrétions protectrices, du complément et de tissus lymphatiques. La revue systématique 2014 inclut 245 études, majoritairement anciennes, chez des enfants de un à soixante mois. Les paramètres ne sont pas tous diminués : leucocytes, lymphocytes ou immunoglobulines peuvent être conservés ou élevés. Une numération non basse ne garantit donc pas une protection normale.</p><p>Infection et malnutrition peuvent s’entretenir. L’infection réduit l’appétit, augmente les besoins et favorise le catabolisme ; la malnutrition peut altérer les défenses et la tolérance à l’infection. La pauvreté et les conditions de vie sont aussi des facteurs communs ; les associations ne démontrent pas chaque lien causal dans un dossier.</p><p>Les études sont souvent observationnelles, transversales et confondues par l’infection. Une orientation de cytokines ou un résultat de recherche ne devient pas un test clinique diagnostique universel. Les observations pédiatriques ne prouvent pas un même profil chez tout adulte dénutri.</p><p>Dans son protocole MAS pédiatrique, l’OMS prévoit des antibiotiques de routine selon âge et circuit, avec adaptation aux résistances. Elle rappelle aussi l’évaluation des causes d’absence de réponse et les soins préventifs. Les aliments thérapeutiques conformes apportent déjà des micronutriments ; une dose pharmacologique supplémentaire de vitamine A n’est pas automatiquement indiquée sans signe de carence ou autre raison justifiée.</p><p><b>Science → clinique.</b> Chercher l’infection et la maladie sous-jacente même si les signes sont peu expressifs ; ne pas expliquer tout symptôme par un manque de protéines.</p><p><b>Science → examen.</b> Le diagnostic combine histoire, état général, examen et bilan ciblé. Ni CRP ni leucocytes ne résument l’ensemble des défenses.</p><p><b>Science → traitement.</b> Nutrition, prise en charge infectieuse et soutien de l’environnement sont complémentaires. Les probiotiques ou autres traitements du microbiote ne se déduisent pas d’une hypothèse mécanistique ; aucune indication de ce type n’est créée ici.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://ec.europa.eu/programmes/erasmus-plus/project-result-content/d6eb4036-767f-4d49-bdde-70a1657290ee/Anatomy_Physiology_LymphSystem.pdf" target="_blank" rel="noopener">NORMAL-LYMPH — Fonctions lymphatiques et organisation immune</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Kwashiorkor_6180.jpg" target="_blank" rel="noopener">IMG-KWA — Description, droits et original</a>.</p><div class="key"><b>À retenir.</b> Nutrition et infection interagissent ; aucun dosage isolé ne résume les défenses.</div></section>
</div></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e40-p-strategy" ><h2>Une prescription pour une indication, un produit et une population</h2><p>La base du traitement est un plan nutritionnel et étiologique adapté. Aliments thérapeutiques, vitamines, électrolytes et antibiotiques ont des statuts et des objectifs différents. F75, F100 et RUTF sont des aliments thérapeutiques ; une FI suisse de médicament n’est pas inventée pour eux.</p><p>Deux FI suisses réellement lues sont détaillées ici : <b>Benerva, avril 2019</b>, et <b>Amoxicilline Spirig HC 200 mg/4 mL, août 2024</b>. Le schéma OMS pédiatrique et le consensus suisse de renutrition adulte sont attribués séparément. Un calcul de volume ne choisit ni l’indication ni la dose et ne remplace pas l’adaptation aux organes.</p><p>Les traitements IV d’une infection grave, les substitutions électrolytiques et les situations de nourrisson demandent le protocole du service et une prescription propre à la formulation. Aucune substitution automatique entre amoxicilline, ampicilline ou autre antibiotique n’est permise par leur proximité de nom.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRANS — 4.6.2–4.6.3 p 35–36</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a>.</p></section>
<section class="ilot" id="e40-p-b1" ><h2>Thiamine : FI Benerva et renutrition adulte distinguées</h2><p><b>FI suisse d’avril 2019</b>, Farmaceutica Teofarma Suisse SA, GTIN 7680256360580. Benerva contient de la thiamine : comprimés 100 mg ou 300 mg et ampoule de 1 mL contenant 100 mg. Les indications incluent carence par apport insuffisant, besoin augmenté ou trouble d’absorption ; les formes sévères comprennent béribéri et encéphalopathie de Wernicke.</p><table class="t"><thead><tr><th>Rubrique de FI : adultes et adolescents dès 12 ans</th><th>Dose et voie</th></tr></thead><tbody><tr><td>Prophylaxie, symptômes légers/besoins augmentés</td><td>100 mg tous les deux jours par voie orale</td></tr><tr><td>Hypovitaminose modérée</td><td>100 mg/j par voie orale</td></tr><tr><td>Hypovitaminose grave</td><td>200–300 mg/j par voie orale</td></tr><tr><td>Carence sévère/avitaminose avec nécessité parentérale</td><td>Doses quotidiennes jusqu’à 200 mg par voie IM ou IV très lente ; poursuivre oralement si possible</td></tr></tbody></table><p>La FI précise que l’utilisation et la sécurité n’ont pas été systématiquement étudiées chez les enfants et adolescents, malgré sa rubrique posologique dès douze ans. Aucune dose de nourrisson ne doit en être déduite. L’IV reste limitée aux patients hospitalisés ; privilégier la voie orale lorsque possible en raison des réactions anaphylactoïdes. L’ampoule n’est pas un comprimé rendu liquide.</p><p><b>Source clinique distincte.</b> La revue suisse 2019 des adultes médicaux à risque de renutrition propose 200–300 mg de thiamine au moins trente minutes avant la reprise. Ce conseil ne signifie pas que 200–300 mg IV seraient une dose autorisée universelle de Benerva. Choisir voie, formulation, dose et durée avec l’équipe, en tenant compte d’une éventuelle carence neurologique/cardiaque et du contexte.</p><p><b>Mécanisme.</b> Le pyrophosphate de thiamine participe au métabolisme des glucides et à la transcétolase. La reprise glucidique augmente les besoins ; une supplémentation ne remplace pas la surveillance des électrolytes et du bilan hydrique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p></section>
<section class="ilot" id="e40-p-b1-safety" ><h2>Thiamine : contre-indications, interactions et reproduction</h2><p>Contre-indication : hypersensibilité au principe actif ou aux excipients. Le comprimé 100 mg contient notamment lactose et saccharose ; les intolérances précisées dans la FI doivent être vérifiées. Des réactions allergiques/anaphylactiques sont rapportées, particulièrement importantes à anticiper lors de la voie parentérale ; comprimés et injectable ont aussi leurs propres effets indésirables digestifs ou locaux.</p><p>La thiosemicarbazone et le 5-fluorouracil antagonisent l’action de la thiamine ; les antiacides peuvent inhiber son absorption. Vérifier l’ordonnance complète plutôt que supposer qu’une vitamine n’a jamais d’interaction.</p><p>Pendant grossesse ou allaitement, les besoins physiologiques ne sont pas les doses pharmacologiques du produit. La FI indique, pour ces dernières et faute d’études contrôlées, un emploi seulement en nécessité absolue. Elle ne fournit pas de schéma rénal chiffré à recopier ; cette absence n’autorise pas à inventer une adaptation ou à ignorer une insuffisance d’organe.</p><p>Une confusion ou une dyspnée chez une personne dénutrie doit être évaluée dans son ensemble. Une carence B1, un syndrome de renutrition, un sepsis et une autre défaillance peuvent se ressembler ou coexister. Le choix du traitement urgent ne s’établit pas à partir d’un seul symptôme.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a>.</p></section>
<section class="ilot" id="e40-p-amox" ><h2>Amoxicilline orale : le protocole OMS n’est pas la FI suisse</h2><p><b>OMS/UNICEF 2026.</b> Dans le circuit de malnutrition aiguë sévère pédiatrique, une antibiothérapie de routine est prévue selon âge et cadre de soins. Pour les six à cinquante-neuf mois en ambulatoire, la durée indiquée est de sept jours à l’entrée, sauf cure déjà reçue pendant hospitalisation. L’annexe 14 donne pour l’amoxicilline orale <b>50 mg/kg par prise, deux prises/jour</b>. Une infection précise peut imposer autre choix, dose ou durée ; besoin d’IV implique hospitalisation.</p><p><b>FI suisse d’août 2024</b>, Amoxicilline Spirig HC 200 mg/4 mL, GTIN 7680667000013. La suspension prête à l’emploi contient <b>50 mg/mL</b>. Chez l’enfant jusqu’à 40 kg inclus, ses indications générales prévoient <b>50–100 mg/kg/j en trois à quatre prises</b>, maximum 2000 mg/j et dose unitaire maximale 50 mg/kg. La FI ne crée pas d’indication particulière intitulée kwashiorkor.</p><table class="t"><thead><tr><th>Référence et population</th><th>Dose exprimée</th><th>Ce qu’il faut conserver</th></tr></thead><tbody><tr><td>OMS MAS, circuit pédiatrique adapté</td><td>50 mg/kg/prise × 2/j = 100 mg/kg/j</td><td>Attribution OMS, âge et décision clinique ; ne pas présenter cette répartition comme texte FI suisse</td></tr><tr><td>FI Spirig HC, enfant ≤ 40 kg</td><td>50–100 mg/kg/j répartis en 3–4 prises ; max 2000 mg/j</td><td>Indication sensible et fonction rénale, concentration du produit après préparation</td></tr><tr><td>Nouveau-né/prématuré</td><td>FI : parentéral généralement privilégié, oral au plus tôt à partir de 8 jours</td><td>Pas protocole ambulatoire 6–59 mois appliqué au nouveau-né</td></tr><tr><td>Infection grave ou besoin IV</td><td>Schéma du service, âge, infection et résistances</td><td>Amoxicilline IV et ampicilline sont des médicaments distincts ; pas conversion de nom</td></tr></tbody></table><p><b>Calcul pédagogique fictif.</b> Si une équipe a déjà retenu le schéma OMS oral pour un enfant de 8 kg avec une suspension identifiée à 50 mg/mL :50 mg/kg/prise× 8 kg= 400 mg/prise ; 400 mg÷ 50 mg/mL=<b>8 mL par prise</b>, deux fois/jour. Cela représente 800 mg/j et 16 mL/j. Ce calcul expose le protocole OMS ; il ne prescrit pas ce schéma ni ne le rend identique à la répartition FI 3–4 prises.</p><p>La préparation et l’agitation suivent la notice du produit ; utiliser un dispositif oral gradué approprié. L’annexe OMS propose aussi une suspension à 125 mg/5 mL, soit 25 mg/mL : elle aurait un autre volume pour la même dose. Ne jamais transférer un nombre de millilitres entre concentrations.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a>.</p></section>
<section class="ilot" id="e40-p-amox-organs" ><h2>Amoxicilline : organes, sécurité, interactions et reproduction</h2><p>La dose dépend de l’infection, de la sensibilité, de l’âge, du poids et de la fonction rénale. Dans cette FI orale, les enfants ≤ 40 kg avec insuffisance rénale doivent recevoir une forme parentérale. Le tableau adulte/enfant>40 kg donne, si ClCr 10–30 mL/min, au maximum 500 mg toutes les douze heures ; si<10, au maximum 500 mg toutes les vingt-quatre heures. Ces plafonds ne sont ni des doses pédiatriques universelles ni des prescriptions indépendantes de l’indication.</p><p>Contre-indications : hypersensibilité aux pénicillines ou aux céphalosporines ; la FI inclut aussi mononucléose infectieuse et leucémie lymphoïde en raison du risque d’exanthème. La FI demande un arrêt immédiat devant réaction allergique, avec prise en charge urgente si gravité. Elle décrit aussi les réactions cutanées sévères, la diarrhée sévère/persistante et le syndrome d’entérocolite médicamenteuse, notamment pédiatrique. Les excipients comprennent de faibles quantités d’alcool benzylique : accumulation et toxicité sont une précaution particulière chez jeunes enfants et insuffisants rénaux/hépatiques. Une accumulation du médicament en insuffisance rénale peut augmenter le risque d’effets indésirables ; cristallurie et atteinte rénale sont notamment rapportées. Le bilan hydrique doit être adapté au patient, sans conseil de remplissage uniforme devant œdème.</p><p>Interactions à vérifier : probénécide augmente/prolonge l’exposition ; allopurinol augmente le risque d’exanthème ; pénicillines peuvent réduire l’excrétion du méthotrexate. Sous acénocoumarol/warfarine, contrôler l’INR lors d’introduction ou arrêt selon situation. L’ordonnance complète et la fonction rénale comptent davantage qu’une liste mémorisée.</p><p>Grossesse : prudence dans la FI faute d’études contrôlées humaines. Allaitement : le texte spécifique Spirig HC indique de ne pas administrer ou, si nécessaire, de sevrer, en raison du passage dans le lait et d’effets possibles ; cette formulation est attribuée à la FI exacte et doit être discutée individuellement avec le prescripteur. Elle ne constitue pas une consigne autonome d’arrêt de l’allaitement pour tout antibiotique.</p><p>L’activité β-lactamine porte sur la synthèse de la paroi bactérienne ; elle n’agit pas comme un nutriment et ne remplace pas une alimentation thérapeutique. L’amoxicilline ne traite pas toute cause d’œdème, et une décision OMS de routine pédiatrique ne devient pas une antibiothérapie systématique de tout adulte dénutri.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a>.</p></section>
<section class="ilot" id="e40-p-nutrition" ><h2>Aliments thérapeutiques et objectifs adultes : ne pas fusionner les unités</h2><table class="t"><thead><tr><th>Cadre</th><th>Apport attribué</th><th>Limites et surveillance</th></tr></thead><tbody><tr><td>OMS 2026, 6–59 mois hospitalisés, stabilisation</td><td>F75 = 75 kcal/100 mL ; 80–100 kcal/kg/j, souvent bas de fourchette si instable ; 8 repas/j idéalement</td><td>Poids hydrique, tolérance, signes de surcharge, prise effective ; calcul par équipe</td></tr><tr><td>OMS 2026, transition</td><td>F100 ou RUTF 100–130 kcal/kg/j</td><td>Phase distincte, critères cliniques et appétit ; revenir à stabilisation si dégradation</td></tr><tr><td>Revue suisse 2019, adulte médical à risque de renutrition</td><td>Début proposé 5–15 kcal/kg/j selon risque, progression vers besoin sur 5–10 jours</td><td>Consensus à preuve limitée, hors troubles alimentaires ; ions, glycémie, organes et eau surveillés</td></tr><tr><td>ESPEN 2023, adulte polymorbide hospitalisé</td><td>Estimation 30 kcal/kg de poids réel chez fortement dénutri sans calorimétrie, à atteindre prudemment ; protéines 1,2–1,5 g/kg/j si soutien nécessaire</td><td>Objectifs adaptés, pas début automatique à 30 ; poids œdémateux et organes nécessitent jugement</td></tr></tbody></table><p>Ces valeurs ont des populations et des phases différentes. Aucun rapport de proportion ne permet de passer de F75 pédiatrique à la dose adulte. Les électrolytes nécessitent une prescription avec concentration, voie, vitesse et fonction rénale propres ; aucun schéma injectable générique n’est improvisé dans ce cours.</p><p>Dans la MAS pédiatrique, les aliments conformes apportent déjà vitamine A et autres micronutriments ; une haute dose supplémentaire demande une indication, par exemple signes de carence. Avant six mois, soutien lactation et supplémentation contrôlée suivent une branche distincte, sans recette domestique de dilution ni RUTF universel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRANS — 4.6.2–4.6.3 p 35–36</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-LIMIT — 3, 4 et 6, limites</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-TARGET — Recommandations 10–12 et commentaires</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a>.</p></section>
<section class="ilot" id="e40-p-swiss" ><h2>Cadre suisse et populations : transmettre un plan utilisable</h2><p>Le code, le produit, l’indication et l’organisation des soins doivent être documentés dans le dossier réel. Les intervalles biologiques sont ceux du laboratoire, adaptés à l’âge et à la méthode. Nourrisson, enfant, grossesse/allaitement, personne âgée et insuffisance d’organe réclament une vérification propre ; l’étiquette nutritionnelle ne neutralise pas les précautions d’un produit.</p><p>Un relais sûr précise quantités et prises réellement possibles, surveillance, signes d’alerte, accès aux soins et soutien familial/social. La fin d’hospitalisation ne signifie pas fin du traitement nutritionnel. Chez l’adulte, aide au repas et traitement de la cause peuvent être aussi déterminants qu’une valeur calorique.</p><p>Les objectifs PROFILES incluent l’examen nutritionnel, la peau/les cheveux et le raisonnement devant œdème ou perte pondérale. Les cas et quiz MEDINA sont des exercices fictifs originaux, sans statut de questions officielles de l’examen fédéral. Les auto-relectures IA et les contrôles techniques restent distincts d’une validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Évaluation nutritionnelle, examen peau-cheveux ; symptômes œdème, perte de poids et malnutrition</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, CK et CS</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p></section>
