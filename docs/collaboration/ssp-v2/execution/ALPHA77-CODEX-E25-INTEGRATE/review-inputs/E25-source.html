<div class="chap-body">
<section class="ilot" id="e25-1"><h2><span class="n">1</span>Une urgence peut précéder le résultat du dépistage</h2><p>Un garçon fictif de onze jours boit moins, vomit et perd du poids. Il paraît somnolent, sa perfusion est mauvaise et la glycémie est basse. Ses organes génitaux externes d’apparence habituelle n’excluent pas une hyperplasie congénitale des surrénales. Une crise surrénalienne avec perte de sel est une hypothèse urgente, même si le dépistage n’est pas encore disponible [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>La priorité est d’évaluer conscience, respiration, circulation, glycémie et électrolytes, d’appeler une équipe pédiatrique urgente et d’administrer le remplacement parentéral approprié sans attendre une confirmation génétique. Les prélèvements hormonaux sont faits avant si cela n’occasionne aucun retard dangereux. Le bilan recherche aussi sepsis et autres causes de choc [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Le cours relie les situations <button class="w" data-k="e25-profiles">PROFILES</button> d’organes génitaux atypiques, de pression anormale et de croissance/puberté inhabituelles au raisonnement. Cette correspondance est pédagogique ; les exercices ne sont pas des questions officielles [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Un garçon peut présenter une perte de sel sans signe génital visible. L’urgence clinique précède la confirmation étiologique [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-2"><h2><span class="n">2</span>Définition et formes cliniques</h2><p>La catégorie E25 regroupe les anomalies génito-surrénaliennes. Son noyau clinique est l’hyperplasie congénitale des surrénales liée à un déficit enzymatique de la stéroïdogenèse. Le déficit en 21-hydroxylase, dû à des variants de <button class="w" data-k="e25-genes">CYP21A2</button>, représente plus de 90 % des formes dans les séries de référence ; ce pourcentage ne décrit pas une fréquence suisse de toute la catégorie [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>La forme classique comprend une forme avec perte de sel et une forme virilisante simple. Toutes deux peuvent manquer de cortisol ; le déficit minéralocorticoïde et son expression clinique varient. La forme non classique possède une activité résiduelle plus importante : elle peut être asymptomatique ou se révéler par pubarche prématurée, hirsutisme, acné, troubles des règles ou difficulté à concevoir. Une révélation tardive ne signifie pas une maladie acquise [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>].</p>
<p>Les autres déficits ne reproduisent pas tous ce profil. Un déficit en 11β-hydroxylase associe volontiers excès androgénique et hypertension ; un déficit en 17α-hydroxylase/17,20-lyase peut associer hypertension et déficit en stéroïdes sexuels. Les anomalies du transport du cholestérol, de sa transformation initiale ou d’autres enzymes exigent un profil spécialisé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Classique ne signifie pas toujours perte de sel ; non classique reste congénital. Le mécanisme enzymatique guide les signes et le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-3"><h2><span class="n">3</span>Épidémiologie : conserver chaque dénominateur</h2><p>Le programme suisse de dépistage indique environ un syndrome adrénogénital pour 9000 nouveau-nés. C’est un chiffre d’information du dépistage, pas une mesure actuelle de toutes les anomalies E25, ni de la forme non classique souvent non repérée à la naissance [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</p>
<p>Une étude suisse publiée en 2025 a recherché rétrospectivement les variations du développement sexuel chez les personnes nées de 2000 à 2019, avec dix hôpitaux pédiatriques et huit endocrinologues privés. Parmi 561 patients identifiés, 118 étaient 46,<button class="w" data-k="e25-chromosomes">XX</button> ; la fréquence rapportée de l’hyperplasie congénitale 46,<button class="w" data-k="e25-chromosomes">XX</button> était d’une pour 7500 filles nouveau-nées. Son dénominateur est celui des filles et son mode de recrutement celui d’une cohorte clinique. On ne la compare donc pas directement au chiffre tous nouveau-nés du dépistage [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12210017/" target="_blank" rel="noopener">S7</a>].</p>
<p>Les recommandations européennes de génétique 2020 rapportent environ une forme classique pour 16 000 naissances dans de nombreuses populations, avec variations entre programmes. La revue systématique 2017 estimait 4,2 % de formes non classiques parmi des femmes sélectionnées pour excès androgénique, avec intervalle de confiance 3,2–5,4 %. Ce chiffre ne s’applique ni à toutes les femmes ni à tous les nouveau-nés suisses [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Aucune incidence suisse contemporaine de l’ensemble E25 et de chacune de ses formes rares n’est établie dans les lectures. Les chiffres gardent leur population, leur date et leur méthode.</p>
<div class="key"><b>À retenir.</b> 1/9000 nouveau-nés, 1/7500 filles et 4,2 % de femmes hyperandrogéniques décrivent trois populations différentes [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12210017/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-4"><h2><span class="n">4</span>Du fonctionnement normal aux symptômes</h2><p>Le cortex surrénalien transforme le cholestérol en stéroïdes. La zone glomérulée produit l’aldostérone, sous contrôle surtout du système rénine–angiotensine et du potassium ; la zone fasciculée produit le cortisol et la zone réticulée des androgènes. La médulla interne produit des catécholamines. Une maladie corticale ne constitue donc pas une destruction primaire obligatoire de toutes les fonctions médullaires [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p>Le cortisol freine l’axe hypothalamo-hypophysaire. Quand sa synthèse est insuffisante, l’hormone corticotrope augmente et stimule le cortex. Dans le déficit en 21-hydroxylase, la 17-hydroxyprogestérone s’accumule et les flux stéroïdiens favorisent les androgènes ; l’hyperplasie est une conséquence de la stimulation et ne suffit pas à préciser le déficit [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Le cortisol participe à la réponse au stress, au maintien du glucose et à la réponse vasculaire. Son déficit expose à l’hypoglycémie, à l’asthénie et au collapsus. L’aldostérone favorise la rétention rénale de sodium et l’excrétion de potassium : son insuffisance provoque pertes hydrosodées, hypovolémie, rénine élevée et hyperkaliémie. L’excès d’androgènes explique virilisation fœtale 46,<button class="w" data-k="e25-chromosomes">XX</button>, maturation osseuse accélérée et pubarche précoce [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Ces associations ne sont pas des lois universelles de E25 : l’accumulation de désoxycorticostérone dans certains déficits exerce au contraire un effet minéralocorticoïde et peut élever la pression. La biochimie précède donc l’attribution d’une perte de sel à toute forme rare [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30817301/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Le déficit en cortisol explique la vulnérabilité au stress ; le profil minéralocorticoïde distingue perte de sel et hypertension [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-5"><h2><span class="n">5</span>Étiologies et diagnostics voisins</h2><table class="t" data-e25-table="1"><thead><tr><th>Hypothèse</th><th>Indices discriminants</th><th>Suite utile</th></tr></thead><tbody><tr><td>Déficit en 21-hydroxylase</td><td>17-hydroxyprogestérone et précurseurs, hyperandrogénie ± perte de sel</td><td>Profil stéroïdien puis <button class="w" data-k="e25-genes">CYP21A2</button> spécialisé.</td></tr><tr><td>Déficit en 11β-hydroxylase</td><td>Hyperandrogénie, hypertension possible, 11-désoxycortisol</td><td>Profil incluant désoxycorticostérone ; <button class="w" data-k="e25-genes">CYP11B1</button>.</td></tr><tr><td>Déficit en 17α-hydroxylase/17,20-lyase</td><td>Déficit sexuel et hypertension/hypokaliémie possibles</td><td>Profil spécialisé ; <button class="w" data-k="e25-genes">CYP17A1</button>.</td></tr><tr><td>Autres déficits : <button class="w" data-k="e25-genes">HSD3B2</button>, <button class="w" data-k="e25-genes">POR</button>, <button class="w" data-k="e25-genes">StAR</button>, <button class="w" data-k="e25-genes">CYP11A1</button></td><td>Perte de sel ou variations du développement, profils variables ; signes squelettiques possibles avec <button class="w" data-k="e25-genes">POR</button></td><td>Pas de diagnostic sur un dosage isolé ; centre spécialisé.</td></tr><tr><td>Ovaires polykystiques ou autre cause ovarienne</td><td>Hirsutisme/troubles des règles sans preuve du déficit congénital</td><td>Exclure les causes pertinentes selon chronologie et profil.</td></tr><tr><td>Tumeur surrénale/ovarienne, exposition androgénique</td><td>Installation rapide, progression marquée, exposition ou masse</td><td>Bilan orienté ; aucune attribution automatique à <button class="w" data-k="e25-nosologie">E25.8</button>.</td></tr></tbody></table>
<p>Une virilisation rapide, une hypertension sévère ou une discordance entre signes et dosage demandent de réexaminer l’hypothèse. Les infections, maladies rénales, anomalies digestives ou autres causes d’hypoglycémie restent des différentiels d’un nourrisson en mauvais état. Le sepsis et la crise surrénalienne peuvent nécessiter une prise en charge simultanée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> L’hypertension avec excès androgénique fait chercher une autre voie que la seule 21-hydroxylase. Les tumeurs et les ovaires polykystiques gardent leur diagnostic propre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-6"><h2><span class="n">6</span>Anamnèse et communication</h2><p>Chez le nourrisson, préciser alimentation, vomissements, poids de naissance et évolution pondérale, urines, fièvre, état général, dépistage et traitements reçus. Chercher un antécédent familial de déficit enzymatique, de consanguinité ou de décès néonatal inexpliqué avec tact. Un dépistage négatif ou en attente ne clôt pas l’enquête si le tableau est grave [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Chez l’enfant, documenter courbe de croissance, âge de pubarche, progression, développement pubertaire et âge osseux antérieur. Chez l’adulte, préciser chronologie de l’hirsutisme/acné, cycles, désir de grossesse, fertilité et changements rapides. Les signes n’ont pas la même signification selon leur vitesse d’apparition [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>].</p>
<p>Pour toute personne traitée, relever le produit exact, dose, horaires, prise réelle, vomissements, maladies récentes, interventions, médicaments inducteurs/inhibiteurs et accès au traitement. Demander si le patient possède une carte, un plan de maladie et un kit injectable utilisable, et s’il sait qui appeler [<a data-reference-source="1" href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Aborder intimité, image corporelle, sexualité et difficultés familiales sans présumer identité de genre ou orientation. Expliquer le but de tout examen génital ; respecter consentement, confidentialité et possibilité d’accompagnement. Les comportements ou attirances ne sont pas des symptômes à corriger [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> La chronologie, la croissance et l’accès réel au remplacement sont aussi importants que l’étiquette génétique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-7"><h2><span class="n">7</span>Examen clinique et sémiologie</h2><p data-semiology-clinical="E25">La sémiologie relie chaque signe à une hypothèse et à une action. Mesurer constantes, perfusion, hydratation, conscience, poids et croissance ; examiner la pression avec une technique et des références adaptées à l’âge. L’hyperpigmentation peut orienter vers une stimulation corticotrope primaire sans être constante ni spécifique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Un nourrisson peut présenter seulement mauvaise alimentation, vomissements, perte pondérale et somnolence avant le choc. Un enfant peut grandir vite initialement, mais perdre du potentiel de taille par maturation osseuse accélérée. À l’inverse, ralentissement statural avec prise pondérale sous traitement évoque notamment un excès glucocorticoïde [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>L’examen des organes génitaux, s’il est indiqué, est expliqué et limité aux besoins cliniques. L’aspect externe seul ne détermine ni les chromosomes, ni les organes internes, ni l’identité future. Les examens répétés et photographies sans nécessité peuvent nuire. L’examen testiculaire ne suffit pas à exclure de petites inclusions surrénaliennes ; une échographie a sa place selon le suivi spécialisé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les neuf volets de <button class="w" data-k="e25-semio">sémiologie : normal, signes et limites</button> détaillent cette démarche. Aucune performance diagnostique chiffrée du seul examen clinique n’est inventée.</p>
<div class="key"><b>À retenir.</b> Une anatomie externe apparemment habituelle ne rassure pas sur le cortisol. La croissance rapide et la petite taille finale peuvent relever du même excès androgénique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-7">Essentiel de cette partie</button></section>

<section class="ilot" id="e25-8"><h2><span class="n">8</span>Diagnostic positif et séquence d’exploration</h2><p>La démarche commence par la sécurité : si crise suspectée, traitement urgent et prélèvements sans retard. Hors urgence, on précise âge, tableau, traitement et résultat du dépistage avant de choisir le profil biologique. Un dépistage néonatal élevé n’est pas à lui seul une confirmation, particulièrement chez le prématuré ou le nouveau-né malade [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Le dosage de 17-hydroxyprogestérone est central pour le déficit en 21-hydroxylase. Les immunodosages peuvent réagir avec d’autres stéroïdes ; la spectrométrie de masse et un profil de plusieurs précurseurs améliorent la spécificité. Les seuils dépendent du prélèvement, de l’âge, de la méthode, de la prématurité et du stress. La prise de glucocorticoïdes modifie les valeurs [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Pour une forme non classique, le seuil basal historique de 6 nmol/L (2 ng/ml) oriente vers une stimulation lorsque le laboratoire ne dispose pas de seuil local plus pertinent. Une valeur basale ou stimulée de 30 nmol/L (10 ng/ml) soutient le diagnostic dans les études anciennes. Ces chiffres ne sont pas un seuil universel moderne transférable à tout immunodosage ou toute méthode de masse [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30566904/" target="_blank" rel="noopener">S5</a>].</p>
<p>La stimulation au tétracosactide et le génotypage sont interprétés avec le profil complet. La FI du test de réserve cortisolaire et les critères stéroïdiens de l’hyperplasie répondent à des questions différentes. Le génotypage spécialisé recherche variants et nombre de copies, avec analyse parentale si nécessaire ; un panel limité négatif peut manquer une anomalie [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<div class="key"><b>À retenir.</b> Dépister, confirmer le déficit et évaluer la réserve cortisolaire sont des questions distinctes ; le seuil garde sa méthode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-8">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-9"><h2><span class="n">9</span>Drapeaux rouges et crise surrénalienne</h2><p>Hypotension ou mauvaise perfusion, déshydratation, troubles de conscience, convulsions, hypoglycémie et troubles du sodium/potassium imposent une prise en charge urgente. Une infection avec vomissements peut empêcher l’absorption du traitement oral. Une kaliémie normale n’exclut pas une insuffisance en cortisol et une pression encore conservée n’exclut pas la déplétion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<table class="t" data-e25-table="1"><thead><tr><th>Repère européen consensus de la société britannique d’endocrinologie et diabétologie pédiatriques 2023</th><th>Dose initiale hydrocortisone</th><th>Portée</th></tr></thead><tbody><tr><td>Moins d’un an</td><td>25 mg intramusculaire ou intraveineuse</td><td>Option pratique par âge ; pas 100 mg systématique au nouveau-né.</td></tr><tr><td>1–5 ans</td><td>50 mg intramusculaire ou intraveineuse</td><td>Suite hospitalière selon réponse et protocole.</td></tr><tr><td>Dès 6 ans</td><td>100 mg intramusculaire ou intraveineuse</td><td>Pas le traitement d’entretien.</td></tr><tr><td>Option au poids, enfant >28 jours corrigés</td><td>2 mg/kg intraveineuse, maximum 100 mg</td><td>Alternative, pas ajout au bolus par âge.</td></tr><tr><td>Nouveau-né <28 jours corrigés</td><td>4 mg/kg intraveineuse</td><td>Option hospitalière au poids ; suite et réévaluation spécialisées.</td></tr></tbody></table>
<p>La voie veineuse ne doit pas retarder l’injection intramusculaire disponible selon le plan. Le consensus associe contrôle/correction du glucose, remplissage adapté et surveillance répétée. Son tableau propose en choc un bolus de chlorure de sodium 0,9 % de 10 ml/kg avec réévaluation ; en glycémie &lt;3 mmol/L, glucose 10 % 2 ml/kg intraveineuse et contrôle à quinze minutes. Ce sont des repères de protocole pédiatrique hospitalier, pas une autorisation de n’importe quel produit ou un protocole autonome à domicile [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>La famille applique son plan injectable et sollicite immédiatement l’aide urgente ; elle ne reste pas à domicile après une injection pour une décompensation grave. Les prélèvements diagnostiques ne retardent pas l’hydrocortisone. La suite, les fluides, les électrolytes et la cause demandent une équipe expérimentée ; des adolescents pris en charge par un service adulte peuvent relever du protocole adulte local [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> La dose de crise dépend de l’âge/poids et du contexte. Après l’injection de secours, l’évaluation urgente et la surveillance restent indispensables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-9">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-10"><h2><span class="n">10</span>Prise en charge : remplacer sans surtraiter</h2><p>Le traitement classique remplace le cortisol indispensable et contrôle autant que possible l’excès androgénique, avec minéralocorticoïde si le profil l’exige. Le suivi cherche un équilibre : l’insuffisance expose à la crise et à l’excès androgénique ; une dose excessive compromet croissance, poids, pression, os et métabolisme. La normalisation complète de tous les précurseurs n’est pas l’objectif automatique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>L’hydrocortisone est privilégiée chez l’enfant en croissance. La FI <button class="w" data-k="e25-alkindi">Alkindi</button> décrit, pour l’hyperplasie, 10–15 mg/m²/j en trois ou quatre prises de la naissance à moins de dix-huit ans. <button class="w" data-k="e25-galepharm">Hydrocortisone Galepharm</button> et <button class="w" data-k="e25-solucortef">Solu-Cortef</button> ont leurs formes et indications propres. Un comprimé, des granulés et une injection ne s’interchangent pas sans vérifier dose délivrée, dispositif et suivi [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Le minéralocorticoïde est ajusté à la pression, aux électrolytes, à la rénine et à la situation clinique. La FI <button class="w" data-k="e25-florinef">Florinef</button> mars 2026 indique 2–5 µg/kg/j pour 0–12 ans ; la revue spécialisée cite chez le nourrisson 100–200 µg/j, parfois davantage en résistance rénale néonatale. Ces repères peuvent différer fortement : ils sont affichés séparément, sans fabriquer une dose moyenne. Le centre pédiatrique et la pharmacie doivent vérifier le schéma, le produit et sa justification [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<p>Une forme non classique asymptomatique ne nécessite pas systématiquement de glucocorticoïde. Symptômes, croissance et fertilité orientent une décision individualisée ; un traitement peut lui-même supprimer l’axe et créer un besoin de couverture de stress. Les traitements de l’hirsutisme ont leurs indications et risques propres, sans ordonnance de classe improvisée ici [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30566904/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Le remplacement classique est indispensable ; le traitement non classique dépend des conséquences. La dose se juge avec la croissance et la clinique, jamais un marqueur seul [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-10">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-11"><h2><span class="n">11</span>Complications, pronostic et suivi</h2><p>Le suivi mesure croissance, vitesse staturale, poids, pression, puberté, signes de sous-traitement et d’excès glucocorticoïde. Les prélèvements hormonaux doivent garder un horaire comparable par rapport au médicament, avec méthode connue. L’hormone corticotrope seule n’est pas une cible de titration validée ; vouloir supprimer tous les précurseurs peut provoquer un surtraitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Chez le petit enfant, les visites sont rapprochées ; la revue propose au moins tous les trois mois avant dix-huit mois puis environ tous les quatre à six mois chez l’enfant plus âgé, avec adaptation lors d’un changement. La FI Alkindi souligne aussi le suivi fréquent de croissance. Les intervalles de synthèse ne remplacent pas les besoins du patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<p>Une maturation osseuse accélérée peut réduire la taille adulte. Obésité, hypertension, troubles métaboliques et fragilité osseuse sont recherchés selon exposition et risque. Les inclusions surrénaliennes testiculaires sont habituellement bénignes mais peuvent altérer les tubes et la fertilité ; l’échographie est plus sensible que la palpation pour les petites lésions. Ni la bilatéralité ni l’imagerie seules n’excluent toute tumeur d’une autre nature [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30817301/" target="_blank" rel="noopener">S11</a>].</p>
<p>La fertilité peut être préservée, mais son évaluation ne se résume pas à un dosage. Le suivi aborde cycles, projet parental, fonction gonadique, accès au conseil génétique et éventuelle conservation de sperme selon lésions. Le pronostic bénéficie du dépistage et des soins ; le risque de crise persiste malgré un diagnostic précoce [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Suivre croissance, pression, hormones contextualisées et vécu. Un dépistage réussi n’annule pas le risque de crise ni les besoins à l’âge adulte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-11">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-12"><h2><span class="n">12</span>Maladie intercurrente, grossesse et transition</h2><p>Le patient reçoit un plan écrit de maladie, une carte et un kit injectable avec formation pratique de l’entourage. La FI Alkindi décrit doublement ou triplement transitoire lors de stress léger selon le plan ; consensus de la société britannique d’endocrinologie et diabétologie pédiatriques propose un total oral d’environ 30 mg/m²/j en quatre prises pour ses épisodes de maladie. Ce sont des approches distinctes, pas deux augmentations à cumuler [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Vomissements empêchant la prise, détérioration ou stress majeur imposent relais parentéral et évaluation urgente. Le consensus précise de ne pas augmenter automatiquement la fludrocortisone pendant la maladie ; l’effet minéralocorticoïde des fortes doses d’hydrocortisone et les fluides peuvent couvrir temporairement le besoin, avec reprise orale quand possible. Le plan spécialisé décide [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>La grossesse demande maintien du remplacement nécessaire, suivi endocrino-obstétrical et adaptation au contexte. La FI Florinef exige une nécessité démontrée et interdit l’allaitement pendant ce produit, tandis que la FI Alkindi permet la substitution hydrocortisonée avec précautions. Ces formulations et avertissements ne sont pas harmonisés par supposition [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<p>Le traitement fœtal prénatal par dexaméthasone reste expérimental dans les sources ; risques, effets à long terme et enjeux éthiques empêchent une prescription routinière. Le diagnostic génétique prénatal est une démarche distincte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>]. La transition vers les soins adultes prépare autonomie, renouvellements, maladie, études/voyages et projet parental sans rupture de remplacement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> Le plan de stress s’écrit avant la maladie et ne cumule pas aveuglément des schémas. La transition doit conserver un accès continu au traitement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-12">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-13"><h2><span class="n">13</span>Tous les sous-codes et contexte suisse</h2><table class="t" data-e25-table="1"><thead><tr><th>Code local OFS 2024</th><th>Libellé</th></tr></thead><tbody><tr><td>E25</td><td>Anomalies génito-surrénaliennes</td></tr><tr><td><button class="w" data-k="e25-nosologie">E25.0</button></td><td>Anomalies génito-surrénaliennes congénitales liées à un déficit enzymatique</td></tr><tr><td><button class="w" data-k="e25-nosologie">E25.00</button></td><td>Déficit en 21-hydroxylase [<button class="w" data-k="e25-nosologie">SAG</button> de type 3], forme classique</td></tr><tr><td><button class="w" data-k="e25-nosologie">E25.01</button></td><td>Déficit en 21-hydroxylase [<button class="w" data-k="e25-nosologie">SAG</button> de type 3], forme tardive</td></tr><tr><td><button class="w" data-k="e25-nosologie">E25.08</button></td><td>Autres anomalies adrénogénitales congénitales liées à un déficit enzymatique</td></tr><tr><td><button class="w" data-k="e25-nosologie">E25.09</button></td><td>Anomalie adrénogénitale congénitale liée à un déficit enzymatique, sans précision</td></tr><tr><td><button class="w" data-k="e25-nosologie">E25.8</button></td><td>Autres anomalies génito-surrénaliennes</td></tr><tr><td><button class="w" data-k="e25-nosologie">E25.9</button></td><td>Anomalie génito-surrénalienne, sans précision</td></tr></tbody></table>
<p><button class="w" data-k="e25-nosologie">E25.0</button> est le parent des déficits enzymatiques congénitaux. <button class="w" data-k="e25-nosologie">E25.00</button> et <button class="w" data-k="e25-nosologie">E25.01</button> distinguent les formes classique et tardive de déficit en 21-hydroxylase. Les autres déficits enzymatiques congénitaux relèvent du groupe <button class="w" data-k="e25-nosologie">E25.08</button> s’ils sont précisés ; l’absence d’information enzymatique ne justifie pas d’inventer un gène. <button class="w" data-k="e25-nosologie">E25.8</button> et <button class="w" data-k="e25-nosologie">E25.9</button> conservent leurs libellés, sans absorber toute hyperandrogénie ou toute variation du développement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>].</p>
<p>Le dépistage néonatal suisse et le parcours spécialisé constituent le contexte de soins. Le remboursement d’un produit, sa disponibilité à la date d’une prescription, les règles de génétique et les décisions chirurgicales individuelles exigent une vérification actuelle. Aucune autorisation suisse 2026 du crinecerfont n’est établie par les essais lus ; une recherche de nom sans résultat ne démontre pas son absence réglementaire [<a data-reference-source="1" href="https://kinderklinik.insel.ch/fileadmin/Kinderklinik/Dokumente/PDFs/Neo/Elterninfo/Screening-Flyer2022_Web7_de.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>La prise en charge génitale distingue urgence fonctionnelle et décision irréversible élective. Information, temps de discussion, autonomie et consentement sont essentiels ; les références à la loi allemande dans une brochure ne deviennent pas une règle suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> Le code suit le diagnostic documenté. Aucun statut de remboursement ou de traitement génital individuel n’est déduit du seul libellé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-13">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-14"><h2><span class="n">14</span>Critères, paramètres et pièges fédéraux</h2><p><b>Critères formels.</b> Le déficit en 21-hydroxylase se construit sur le tableau, le profil hormonal et la confirmation moléculaire adaptée, avec distinction classique/non classique. Le dépistage seul ne suffit pas ; une crise reste clinique et ne doit pas attendre ces critères [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p><b>Paramètres à garder avec leurs unités.</b> Les seuils historiques non classiques de 6 et 30 nmol/L concernent la 17-hydroxyprogestérone, pas le cortisol. La FI Synacthen mesure le cortisol avant et à trente minutes ; ses seuils historiques ne sont pas un seuil de 17-hydroxyprogestérone. Les doses d’hydrocortisone en mg/m²/j ne sont pas des mg/kg par injection ; les microgrammes de fludrocortisone ne sont pas des milligrammes [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p><b>Pièges.</b> Donner 100 mg à chaque nouveau-né sans référentiel ; rassurer sur les organes génitaux d’un garçon ; étiqueter un prématuré sur un dépistage isolé ; confondre seuil de dépistage et confirmation ; normaliser la 17-hydroxyprogestérone au prix d’un Cushing ; tripler la fludrocortisone avec l’hydrocortisone ; interrompre une substitution indispensable ; traiter toute forme non classique asymptomatique ; affirmer qu’une imagerie testiculaire suffit à tout distinguer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>L’examen évalue la capacité à expliquer mécanisme, gravité, choix du test et conduite, avec respect de l’intimité et des incertitudes. Aucun score pronostique E25 unique ni question fédérale garantie n’est inventé [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Le bon chiffre répond à une question, une méthode, un âge et une voie. Les unités et la population font partie de la réponse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-14">Essentiel de cette partie</button></section>
<div class="src"><h3>Sources effectivement consultées</h3><ul data-justification-sources="1"><li><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] CIM-10-GM E25 et subdivisions</a> — 2024. Toutes entrées E25 du catalogue local. Limites : Libellés locaux 2024, aucune certification administrative 2026.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">[S3] Congenital adrenal hyperplasia—current insights in pathophysiology, diagnostics and management</a> — En ligne 2021 ; volume février 2022. Physiologie et déficits enzymatiques ciblés ; diagnostic néonatal et biochimique ; traitement et surveillance enfants/adultes ; crise ; non classique ; prénatal ; psychosocial ; fertilité masculine. Limites : Lecture de sections, pas totalité de la longue revue ; recommandations Endocrine Society 2018 citées, confrontées à FI suisses et consensus de la société britannique d’endocrinologie et diabétologie pédiatriques européen. Pas statut réglementaire 2026.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">[S4] Non-classic congenital adrenal hyperplasia due to 21-hydroxylase deficiency revisited: an update with a special focus on adolescent and adult women.</a> — 2017. Résumé publié et métadonnées PubMed/Europe PMC. Limites : Revue systématique 2017, données jusqu’à octobre 2016 ; résumé seul, pas fondement unique de prescription.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30566904/" target="_blank" rel="noopener">[S5] MANAGEMENT OF ENDOCRINE DISEASE: Diagnosis and management of the patient with non-classic CAH due to 21-hydroxylase deficiency.</a> — 2019. Résumé publié et métadonnées PubMed/Europe PMC. Limites : Résumé seul, pas doses ni horaire folliculaire déduits.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30817301/" target="_blank" rel="noopener">[S11] Typical characteristics of children with congenital adrenal hyperplasia due to 11β-hydroxylase deficiency: a single-centre experience and review of the literature.</a> — 2019. Résumé publié et métadonnées PubMed/Europe PMC. Limites : Petite série pédiatrique, aucune incidence extrapolée.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">[S13] Phase 3 Trial of Crinecerfont in Pediatric Congenital Adrenal Hyperplasia.</a> — 2024. Résumé publié et métadonnées PubMed/Europe PMC. Limites : Résumé seul ; essai financé Neurocrine, pas FI suisse ni preuve de bénéfice clinique à long terme.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12210017/" target="_blank" rel="noopener">[S7] Prevalence of differences of sex development in Switzerland</a> — 2025. Résumé ; cohorte de naissances 2000–2019. Limites : Cohorte rétrospective sélectionnée ; dénominateur filles pour 46,<button class="w" data-k="e25-chromosomes">XX</button>, pas tous nouveau-nés ni toute E25.</li><li><a data-reference-source="1" href="https://kinderklinik.insel.ch/fileadmin/Kinderklinik/Dokumente/PDFs/Neo/Elterninfo/Screening-Flyer2022_Web7_de.pdf" target="_blank" rel="noopener">[S8] Dépistage néonatal suisse</a> — 2022. Pages dépistage et syndrome adrénogénital. Limites : Brochure parentale datée ; ni seuil analytique ni protocole de rappel détaillé.</li><li><a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">[S9] Maladies dépistées : syndrome adrénogénital</a> — Page consultée 2026-11-02. Rubrique syndrome adrénogénital. Limites : Chiffre informatif environ 1/9000 nouveau-nés, pas fréquence de toute la catégorie E25 ; un dépistage ne garantit pas zéro séquelle.</li><li><a data-reference-source="1" href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">[S10] Adrenogenitales Syndrom : information aux familles</a> — 2023. Présentation, traitement, urgence, croissance et famille. Limites : Information patient ; droit allemand non transféré en Suisse ; illustrations tierces non reproduites.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">[S12] Phase 3 trial of crinecerfont in adult congenital adrenal hyperplasia</a> — 2024. Résumé, méthodes et résultats principaux ; sponsor et populations. Limites : Sections ciblées ; bénéfice de dose et biomarqueur, pas statut Swissmedic ni sécurité à long terme ; aucune figure copiée.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">[S14] Information professionnelle suisse Alkindi granulés 0,5/1/2/5 mg</a> — Février 2025. Indications, posologie, contre-indications, précautions, interactions, grossesse/allaitement ciblées. Limites : La FI exacte ne vaut pas une autre formulation ni un protocole syndromique ; la dose maximale n’est pas inventée si non définie.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">[S15] Information professionnelle suisse Hydrocortisone Galepharm 10 mg comprimé sécable</a> — Août 2025. Indications, posologie, contre-indications, précautions, interactions, grossesse/allaitement ciblées. Limites : La FI exacte ne vaut pas une autre formulation ni un protocole syndromique ; la dose maximale n’est pas inventée si non définie.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">[S16] Information professionnelle suisse Solu-Cortef injectable</a> — Octobre 2025. Indications, posologie, contre-indications, précautions, interactions, grossesse/allaitement ciblées. Limites : La FI exacte ne vaut pas une autre formulation ni un protocole syndromique ; la dose maximale n’est pas inventée si non définie.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">[S17] Information professionnelle suisse Florinef 0,1 mg comprimé</a> — Mars 2026. Indications, posologie, contre-indications, précautions, interactions, grossesse/allaitement ciblées. Limites : La FI exacte ne vaut pas une autre formulation ni un protocole syndromique ; la dose maximale n’est pas inventée si non définie.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">[S18] Information professionnelle suisse Synacthen injectable immédiat 0,25 mg/ml</a> — Juin 2023. Indications, posologie, contre-indications, précautions, interactions, grossesse/allaitement ciblées. Limites : La FI exacte ne vaut pas une autre formulation ni un protocole syndromique ; la dose maximale n’est pas inventée si non définie.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">[S19] The adrenal glands</a> — 2e §17.6. Situation, cortex, médulla et couches corticales. Limites : Pédagogie américaine, pas recommandation clinique. L’aldostérone n’est pas décrite comme principalement <button class="w" data-k="e25-corticotrope">ACTH</button> dépendante. Licence de figure historique traitée séparément.</li><li><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S20] PROFILES</a> — 2017. Situations examen organes génitaux, pression, enfance croissance/puberte. Limites : Lien pédagogique, aucune question officielle ni correspondance CIM officielle.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">[S21] Emergency and perioperative management of adrenal insufficiency in children and young people: BSPED consensus guidance</a> — 2023. Résumé, méthodes, sick day, tableau 3 crise, fludrocortisone. Limites : Consensus européen, preuves pédiatriques limitées ; ne remplace pas protocole suisse ni FI du produit. Autre article de résumé 2024 distingué.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">[S22] EMQN best practice guidelines for molecular genetic testing and reporting of 21-hydroxylase deficiency</a> — 2020. Résumé, introduction, indications, échantillons parentaux, diagnostic prénatal, locus et méthodes ciblées. Limites : Lecture ciblée ; ancienneté et législation nationale à vérifier. Pas disponibilité suisse de tout test.</li></ul><p>Audit différé — revue par intelligence artificielle, distincte d’une validation médicale humaine. Les sources intégrales restent en cache externe ; ce cours contient des paraphrases et leurs références.</p>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e25-e-1"><h2><span class="n">e-1</span>Du dépistage au diagnostic</h2><p>Le programme suisse recherche la forme à risque avant les symptômes. La brochure 2022 décrit un prélèvement au troisième ou quatrième jour. Le dépistage sanguin de 17-hydroxyprogestérone n’est pas une photographie directe de l’activité enzymatique ; une valeur élevée nécessite le rappel et le parcours de confirmation du programme [<a data-reference-source="1" href="https://kinderklinik.insel.ch/fileadmin/Kinderklinik/Dokumente/PDFs/Neo/Elterninfo/Screening-Flyer2022_Web7_de.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</p>
<p>Prématurité, maladie, stress et prélèvement très précoce augmentent les difficultés d’interprétation et les faux positifs. Les stéroïdes maternels peuvent contribuer à des faux négatifs. Le poids, l’âge gestationnel et la méthode doivent accompagner la valeur. Un second niveau par spectrométrie de masse peut utiliser plusieurs stéroïdes et leurs rapports ; sa disponibilité exacte dépend du programme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Un enfant symptomatique est évalué sans attendre le rappel. Prélever glucose, sodium, potassium, fonction rénale et hormones pertinentes, en conservant l’heure et les médicaments déjà reçus. Ni le bilan ni un prélèvement difficile ne retardent l’injection nécessaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> Un dépistage positif appelle une confirmation contextualisée ; un tableau grave appelle un traitement immédiat même avec dépistage négatif ou en attente [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-e-2"><h2><span class="n">e-2</span>Profil hormonal et test dynamique</h2><p>La 17-hydroxyprogestérone basale et stimulée soutient la recherche d’un déficit en 21-hydroxylase ; cortisol, androstènedione, autres précurseurs, rénine, aldostérone et électrolytes répondent à d’autres dimensions. Le laboratoire et l’endocrinologue choisissent le profil selon hypothèse, âge et traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>La FI <button class="w" data-k="e25-synacthen">Synacthen immédiat</button> donne pour l’exploration adulte de la réserve cortisolaire 0,25 mg intramusculaire ou intraveineuse, avec cortisol avant et exactement trente minutes après. Elle cite un accroissement d’au moins 200 nmol/L ou un taux final au-dessus de 500 nmol/L ; ces paramètres historiques ne sont pas strictement identiques et leur lecture dépend de la méthode actuelle. Ils ne deviennent pas des seuils de 17-hydroxyprogestérone [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p>Le cortisol total dépend aussi des protéines de liaison : œstrogènes, maladie hépatique, syndrome néphrotique ou maladie critique peuvent changer son interprétation. Le test est programmé et surveillé en raison du risque d’anaphylaxie ; le matériel de réanimation doit être disponible. Le test n’a pas priorité sur le traitement d’une crise [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> La stimulation peut explorer la réserve en cortisol ou les précurseurs d’un bloc enzymatique ; les critères de ces deux questions ne s’échangent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-e-3"><h2><span class="n">e-3</span>Génétique, os et échographie</h2><p>L’analyse <button class="w" data-k="e25-genes">CYP21A2</button> demande une méthode distinguant le gène du pseudogène et étudiant les variations de copies. Séquençage et technique de dosage de copies se complètent. Les échantillons parentaux aident à savoir si deux variants se trouvent sur le même chromosome ou sur deux chromosomes différents. Une seule variation trouvée ne prouve pas une maladie récessive complète ; un examen limité négatif ne l’exclut pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>L’âge osseux répond à la question de maturation et de potentiel statural ; il ne mesure pas directement l’adhésion au traitement ni l’activité d’une enzyme. Les courbes de croissance, la puberté et l’exposition médicamenteuse restent nécessaires. Les examens répétés sont choisis pour leur conséquence utile [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>L’échographie testiculaire recherche les inclusions surrénaliennes selon la forme et le suivi. La revue propose des intervalles de deux à cinq ans pour de petites lésions stables dans les formes classiques, avec individualisation ; ce n’est pas un dépistage annuel obligatoire de toute forme non classique. L’imagerie seule ne distingue pas toujours une inclusion d’une tumeur de Leydig, et une masse nouvelle est évaluée spécifiquement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Un résultat génétique exige sa méthode et sa phase familiale ; une image exige sa question clinique. Aucun examen ne remplace le suivi longitudinal [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-e-4"><h2><span class="n">e-4</span>Quatre exercices de raisonnement</h2><div class="quiz ui"><p><b>Cas fictif 1.</b> Un garçon de onze jours a vomissements, mauvaise perfusion et hypoglycémie, dépistage en attente. Quelle conduite ?</p>
<button data-ok="1">Prise en charge urgente, prélèvements sans retard et hydrocortisone parentérale adaptée à l’âge/poids selon plan pédiatrique.</button><button data-ok="0">Attendre le génotypage puisque les organes génitaux sont habituels.</button><p class="fb" hidden>Le consensus européen donne notamment 25 mg avant un an comme repère par âge ; il propose aussi une option néonatale au poids. Ces options ne se cumulent pas et la suite est hospitalière [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 2.</b> Une femme avec hirsutisme a 17-hydroxyprogestérone basale 7 nmol/L. Que conclure ?</p>
<button data-ok="1">Une exploration contextualisée, éventuellement stimulation et génétique, reste nécessaire.</button><button data-ok="0">La valeur prouve seule une forme non classique.</button><p class="fb" hidden>Le seuil historique 6 nmol/L est un repère de dépistage dans certaines méthodes ; ce n’est pas une confirmation universelle. Chronologie, laboratoire et profil orientent la suite [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 3.</b> Un enfant présente excès androgénique et hypertension. Quelle hypothèse examiner ?</p>
<button data-ok="1">Un déficit en 11β-hydroxylase ou une autre voie à effet minéralocorticoïde.</button><button data-ok="0">Une perte de sel par 21-hydroxylase est la seule explication possible.</button><p class="fb" hidden>La désoxycorticostérone peut expliquer l’hypertension du déficit en 11β. Le profil stéroïdien distingue les voies ; la pression ne s’interprète pas seule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30817301/" target="_blank" rel="noopener">S11</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 4.</b> Un prématuré a un dépistage élevé mais paraît stable. Quelle lecture ?</p>
<button data-ok="1">Rappel et confirmation avec âge gestationnel, méthode et profil, sans oublier les signes d’alerte.</button><button data-ok="0">Diagnostic certain parce que le dépistage est toujours spécifique.</button><p class="fb" hidden>La prématurité et les réactions croisées augmentent les faux positifs. Une situation stable permet l’exploration prévue ; toute détérioration impose une évaluation urgente [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</div><div class="key"><b>À retenir.</b> Les exercices sont originaux : urgence, seuil contextualisé, profil hypertensif et dépistage du prématuré [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-e-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e25-tab-semio" role="tab" aria-controls="e25-s-semio" data-s="e25-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="e25-tab-anat" role="tab" aria-controls="e25-s-anat" data-s="e25-s-anat" aria-selected="false">Anatomie</button><button id="e25-tab-histo" role="tab" aria-controls="e25-s-histo" data-s="e25-s-histo" aria-selected="false">Histologie</button><button id="e25-tab-physio" role="tab" aria-controls="e25-s-physio" data-s="e25-s-physio" aria-selected="false">Physiologie</button><button id="e25-tab-bioch" role="tab" aria-controls="e25-s-bioch" data-s="e25-s-bioch" aria-selected="false">Biochimie</button><button id="e25-tab-gene" role="tab" aria-controls="e25-s-gene" data-s="e25-s-gene" aria-selected="false">Génétique et immunologie</button></div><div class="chap-body sci-body"><div class="sci" role="tabpanel" aria-labelledby="e25-tab-semio" id="e25-s-semio"><div class="key"><p><b>Science → clinique.</b> La mauvaise perfusion et l’hypoglycémie signalent un danger sans imposer une seule étiologie. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>Science → examen.</b> La clinique choisit glucose et électrolytes urgents ; les prélèvements hormonaux ne retardent pas les soins. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>]</p><p><b>Science → traitement.</b> Le plan parentéral et l’aide urgente répondent à l’impossibilité d’absorber le remplacement. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>À retenir.</b> Une structure, une mesure et une décision répondent à des questions différentes.</p></div><figure><svg viewBox="0 0 660 130" role="img" aria-label="Enchaînement logique, sans représentation anatomique"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="12" width="200" height="96" rx="8"/><rect x="230" y="12" width="200" height="96" rx="8"/><rect x="455" y="12" width="200" height="96" rx="8"/><path d="M205 60h25m-8-5 8 5-8 5M430 60h25m-8-5 8 5-8 5"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="105" y="65">Signes de gravité</text><text x="330" y="65">Aide urgente</text><text x="555" y="65">Prélèvements sans retard</text></g></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les flèches résument la séquence discutée dans le texte, sans probabilité ni causalité individuelle supplémentaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</figcaption></figure><section class="ilot" id="e25-s-semio-cours"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><section class="ilot" id="e25-semio-normal" data-semiology="normal"><h3>Fonction normale</h3><p>Le cortisol soutient la réponse au stress et le maintien du glucose ; l’aldostérone règle la rétention rénale de sodium et l’excrétion de potassium. La croissance, la puberté et la pression s’interprètent avec l’âge. Une apparence externe habituelle ne permet pas de connaître ces fonctions. Les androgènes participent au développement mais leur effet dépend de la période de vie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
</section>
<section class="ilot" id="e25-semio-signs" data-semiology="signs"><h3>Signes et symptômes</h3><p>Chez le nourrisson, difficulté à boire, vomissements, perte de poids, déshydratation et somnolence sont souvent peu spécifiques. Hypoglycémie, convulsions ou mauvaise perfusion indiquent une gravité. Chez l’enfant, pubarche et croissance accélérées orientent vers un excès androgénique ; chez l’adulte, hirsutisme, acné et troubles des règles sont des portes d’entrée sans être spécifiques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</section>
<section class="ilot" id="e25-semio-mechanisms" data-semiology="mechanisms"><h3>Relier le signe au mécanisme</h3><p>La perte de sodium et d’eau réduit le volume circulant ; le déficit cortisolaire gêne l’adaptation à la maladie et au jeûne. L’excès androgénique peut accélérer l’âge osseux et réduire la taille finale malgré une grande taille initiale. L’excès de désoxycorticostérone peut donner hypertension : toutes les formes ne perdent pas le sel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
</section>
<section class="ilot" id="e25-semio-examination" data-semiology="examination"><h3>Examen expliqué et proportionné</h3><p>Contrôler constantes, perfusion, état de conscience, poids, courbes, hydratation et pression adaptée au gabarit. Examiner peau, croissance et puberté selon indication. Expliquer l’examen génital, obtenir l’accord approprié, préserver intimité et éviter répétitions et photographies sans nécessité. L’aspect génital ne remplace ni l’analyse biologique ni la parole de la personne [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</section>
<section class="ilot" id="e25-semio-interpretation" data-semiology="interpretation"><h3>Interpréter en contexte</h3><p>Une pression conservée n’exclut pas une hypovolémie débutante. Une kaliémie normale n’exclut pas une insuffisance cortisolaire. Une hyperpigmentation oriente sans confirmer seule. Sous traitement, prise pondérale et ralentissement statural font examiner l’exposition glucocorticoïde ; accélération staturale et maturation osseuse font examiner le contrôle androgénique, sans accuser automatiquement une mauvaise adhésion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
</section>
<section class="ilot" id="e25-semio-differentials" data-semiology="differentials"><h3>Différentiels discriminants</h3><p>Choc et vomissements imposent aussi d’envisager sepsis, maladie digestive, rénale ou métabolique ; les traitements urgents peuvent devoir être associés. Hirsutisme et cycles irréguliers ne distinguent pas seuls forme non classique et ovaires polykystiques. Une progression rapide ou une masse fait chercher une cause tumorale ou une exposition plutôt que de forcer E25 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</section>
<section class="ilot" id="e25-semio-urgency" data-semiology="urgency"><h3>Urgence et action</h3><p>Vomissements empêchant le remplacement, altération de conscience, convulsions, hypoglycémie ou perfusion anormale appellent aide urgente et hydrocortisone parentérale selon plan. Les prélèvements précèdent si possible, jamais au prix d’un retard dangereux. Après une injection à domicile, la famille sollicite l’évaluation urgente ; l’amélioration initiale ne dispense pas d’une surveillance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</section>
<section class="ilot" id="e25-semio-limits" data-semiology="limits"><h3>Limites de la sémiologie</h3><p>Aucun signe isolé ni score clinique unique validé pour toute E25 n’est établi dans ces lectures. Les garçons peuvent n’avoir aucun signe génital visible ; une palpation testiculaire normale manque de petites inclusions. L’identité de genre et l’orientation ne sont pas des tests hormonaux. La sémiologie choisit la bonne exploration et protège la relation de soin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
</section>
<section class="ilot" id="e25-semio-sources" data-semiology="sources"><h3>Sources et portée</h3><p>Les mécanismes et la démarche viennent de la revue multiauteur 2021/2022 ; les signaux de crise et l’action pédiatrique sont confrontés au consensus britannique européen consensus de la société britannique d’endocrinologie et diabétologie pédiatriques 2023 et aux informations suisses. Il s’agit d’une synthèse pédagogique, sans validation humaine indépendante ni performance chiffrée inventée de l’examen [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</section>
</section>
</div><div class="sci" role="tabpanel" aria-labelledby="e25-tab-anat" id="e25-s-anat" hidden><div class="key"><p><b>Science → clinique.</b> Une apparence génitale habituelle chez le garçon n’exclut pas le déficit cortical. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>Science → examen.</b> Une image normale de surrénale ne mesure pas l’activité enzymatique ; le profil hormonal est nécessaire. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>]</p><p><b>Science → traitement.</b> La fonction déficitaire et le profil déterminent le remplacement, pas le seul volume de la glande. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>À retenir.</b> Une structure, une mesure et une décision répondent à des questions différentes.</p></div><section class="ilot" id="e25-s-anat-cours"><h2><span class="n">s-anat-cours</span>Anatomie normale puis portée clinique</h2><p>Les surrénales sont deux glandes situées au-dessus des reins. Une capsule entoure chaque glande ; le cortex forme une région externe et la médulla une région interne. Cette organisation distingue des tissus ayant des productions différentes. La proximité du rein n’en fait pas une partie du système collecteur urinaire, et la mesure de fonction rénale ne mesure pas directement le fonctionnement hormonal surrénalien [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p>Le cortex comprend trois zones. La glomérulée, la plus périphérique, produit les minéralocorticoïdes ; la fasciculée produit principalement le cortisol ; la réticulée participe à la production d’androgènes. La médulla contient des cellules chromaffines et produit des catécholamines. Cette séparation aide à comprendre pourquoi le déficit enzymatique peut modifier plusieurs voies corticales sans constituer une tumeur médullaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<figure id="e25-anat-figure"><div data-e25-fig="1"><img src="assets/img/e25/alpha/codex/adrenal-openstax2013.jpg" alt="Planche humaine originale : surrénale au-dessus du rein, coupe cortex et médulla, micrographie et zones corticales." loading="eager"><span data-e25-marker="1" data-e25-p1="1" data-e25-pin="1">1</span><span data-e25-marker="1" data-e25-p2="1" data-e25-pin="2">2</span><span data-e25-marker="1" data-e25-p3="1" data-e25-pin="3">3</span><span data-e25-marker="1" data-e25-p4="1" data-e25-pin="4">4</span></div><figcaption>Original humain OpenStax College, Connexions, 19 juin 2013 ; micrographie University of Michigan Medical School ©2012. <a href="https://commons.wikimedia.org/wiki/File:1818_The_Adrenal_Glands.jpg" target="_blank" rel="noopener">Figure historique 1818</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels inchangés ; quatre repères français en surimpression : 1 surrénale au-dessus du rein ; 2 cortex périphérique et médulla centrale ; 3 coupe histologique ; 4 régions corticales et médullaire. Planche normale, aucun déficit enzymatique individuel démontré. Les labels anglais originaux sont complétés par cette légende ; lire la légende sur petit écran.</figcaption></figure>
<p>Dans l’hyperplasie congénitale, la stimulation corticotrope chronique peut augmenter le tissu cortical. L’image anatomique ne révèle pourtant pas quelle enzyme est déficiente : deux patients peuvent avoir une morphologie comparable et des profils stéroïdiens très différents. Une surrénale volumineuse n’est ni une preuve autonome de déficit en 21-hydroxylase ni un examen de dépistage remplaçant la biologie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les effets génitaux sont des effets hormonaux à distance. Chez un fœtus 46,<button class="w" data-k="e25-chromosomes">XX</button> atteint d’une forme classique, l’excès androgénique peut modifier les organes génitaux externes ; cet aspect n’indique pas à lui seul l’ensemble des organes internes ni une identité future. Un garçon peut avoir un aspect externe habituel malgré le même danger de perte de sel. L’anatomie sert ici à comprendre cette dissociation et à éviter une rassurance trompeuse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</p>
<p>Enfin, des cellules de type surrénalien peuvent se trouver dans les testicules et former des inclusions, souvent bilatérales et proches des voies séminifères. Elles ne correspondent pas à une migration visible de la glande sur la planche ; leur origine et leur croissance ne se résument pas à l’<button class="w" data-k="e25-corticotrope">ACTH</button>. Le suivi spécialisé utilise une imagerie orientée lorsque cela modifie les soins [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Cortex et médulla ont des fonctions distinctes ; l’anatomie normale explique les voies sans confirmer le déficit d’un patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-s-anat-cours">Essentiel de cette partie</button></section>
