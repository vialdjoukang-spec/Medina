</div><div class="sci" role="tabpanel" aria-labelledby="e25-tab-histo" id="e25-s-histo" hidden><div class="key"><p><b>Science → clinique.</b> L’hyperplasie sous stimulation n’est pas une preuve de cancer. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>Science → examen.</b> La planche normale ne remplace pas le profil stéroïdien ou une analyse génétique. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>]</p><p><b>Science → traitement.</b> Le contrôle hormonal cherche l’équilibre ; aucune biopsie systématique n’est déduite de cette coupe. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>À retenir.</b> Une structure, une mesure et une décision répondent à des questions différentes.</p></div><section class="ilot" id="e25-s-histo-cours"><h2><span class="n">s-histo-cours</span>Histologie : lire la zone avant de nommer la maladie</h2><p>La coupe normale montre une capsule, plusieurs régions corticales et une médulla. L’histologie donne un support cellulaire à la zonation hormonale : l’emplacement d’une cellule et les enzymes qu’elle exprime déterminent les stéroïdes qu’elle peut synthétiser. Il faut distinguer l’identification pédagogique d’une région et la preuve de l’activité d’une enzyme chez un patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p>Sur la planche historique, les zones sont présentées de la périphérie vers le centre : glomérulée, fasciculée, réticulée, puis médulla. Les noms décrivent aussi des organisations tissulaires, mais une petite image sur téléphone ne permet pas un diagnostic microscopique fiable. Les repères et la légende permettent de suivre l’organisation ; ils ne sont pas une coloration immunologique d’une enzyme précise [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<figure id="e25-histo-figure"><div data-e25-fig="1"><img src="assets/img/e25/alpha/codex/adrenal-openstax2013.jpg" alt="Planche humaine originale : surrénale au-dessus du rein, coupe cortex et médulla, micrographie et zones corticales." loading="eager"><span data-e25-marker="1" data-e25-p1="1" data-e25-pin="1">1</span><span data-e25-marker="1" data-e25-p2="1" data-e25-pin="2">2</span><span data-e25-marker="1" data-e25-p3="1" data-e25-pin="3">3</span><span data-e25-marker="1" data-e25-p4="1" data-e25-pin="4">4</span></div><figcaption>Original humain OpenStax College, Connexions, 19 juin 2013 ; micrographie University of Michigan Medical School ©2012. <a href="https://commons.wikimedia.org/wiki/File:1818_The_Adrenal_Glands.jpg" target="_blank" rel="noopener">Figure historique 1818</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels inchangés ; quatre repères français en surimpression : 1 surrénale au-dessus du rein ; 2 cortex périphérique et médulla centrale ; 3 coupe histologique ; 4 régions corticales et médullaire. Planche normale, aucun déficit enzymatique individuel démontré. Les labels anglais originaux sont complétés par cette légende ; lire la légende sur petit écran.</figcaption></figure>
<p>La production d’aldostérone appartient au cortex glomérulé, celle du cortisol à la fasciculée et une partie de la production androgénique à la réticulée. Les différences d’expression enzymatique expliquent que le même cholestérol initial aboutisse à plusieurs produits. La médulla a une autre fonction, catécholaminergique : elle ne remplace pas un cortisol manquant. Les interactions entre cortex et médulla existent, et les enfants avec déficit cortisolaire peuvent être particulièrement vulnérables à l’hypoglycémie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p>Le terme hyperplasie désigne une augmentation de tissu sous stimulation chronique ; il ne signifie pas malignité. Le déficit enzymatique repose sur un mécanisme moléculaire et biochimique, non sur une biopsie obligatoire de la surrénale. Les examens proposés dans le cours sont choisis pour diagnostiquer, traiter et suivre sans ajouter un prélèvement invasif sans bénéfice [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les inclusions surrénaliennes testiculaires possèdent des ressemblances histologiques avec le cortex. Elles sont généralement bénignes, mais leur localisation peut obstruer les voies séminifères et provoquer fibrose et atteinte de fertilité. Elles doivent être distinguées d’autres lésions ; même l’imagerie n’offre pas une discrimination absolue avec une tumeur de Leydig. Cette limite justifie un avis spécialisé plutôt qu’un diagnostic sur la seule bilatéralité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> La coupe normale illustre les territoires ; elle ne montre ni un variant <button class="w" data-k="e25-genes">CYP21A2</button> ni une hyperplasie pathologique individuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-s-histo-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e25-tab-physio" id="e25-s-physio" hidden><div class="key"><p><b>Science → clinique.</b> Le déficit cortisolaire explique la vulnérabilité au jeûne et à la maladie. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>Science → examen.</b> La croissance, la pression et les hormones chronométrées se lisent ensemble. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>]</p><p><b>Science → traitement.</b> Remplacer sans surtraiter et préparer le plan de stress répondent à deux besoins. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>À retenir.</b> Une structure, une mesure et une décision répondent à des questions différentes.</p></div><figure><svg viewBox="0 0 660 130" role="img" aria-label="Enchaînement logique, sans représentation anatomique"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="12" width="200" height="96" rx="8"/><rect x="230" y="12" width="200" height="96" rx="8"/><rect x="455" y="12" width="200" height="96" rx="8"/><path d="M205 60h25m-8-5 8 5-8 5M430 60h25m-8-5 8 5-8 5"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="105" y="65">Cortisol insuffisant</text><text x="330" y="65">Signal accru</text><text x="555" y="65">Précurseurs et androgènes</text></g></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les flèches résument la séquence discutée dans le texte, sans probabilité ni causalité individuelle supplémentaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</figcaption></figure><section class="ilot" id="e25-s-physio-cours"><h2><span class="n">s-physio-cours</span>Physiologie : trois régulations et un équilibre thérapeutique</h2><p>Le cortisol varie dans le temps et participe à l’adaptation aux besoins. L’hypothalamus stimule l’hypophyse, qui libère l’hormone corticotrope ; celle-ci stimule le cortex. Le cortisol exerce un rétrocontrôle négatif. Quand le déficit enzymatique empêche la réponse normale, l’augmentation du signal ne répare pas l’enzyme : elle stimule le tissu et augmente les précurseurs disponibles pour d’autres voies [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>L’aldostérone répond principalement à la rénine–angiotensine et au potassium. Une diminution du volume circulant active cette régulation ; si la synthèse est insuffisante, l’organisme continue à perdre sodium et eau malgré le signal. La rénine peut donc aider à évaluer le versant minéralocorticoïde, mais ses conditions de mesure et la pression restent indispensables. Le cortisol et l’aldostérone ne partagent pas une seule commande physiologique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Le troisième versant concerne les androgènes. Leur excès peut accélérer la croissance initiale et la maturation osseuse. Une avance d’âge osseux peut ensuite réduire la taille finale. Ce mécanisme explique pourquoi la grande taille d’un enfant ne prouve pas une croissance saine, et pourquoi l’évaluation suit la vitesse staturale, la puberté et les courbes sur plusieurs consultations [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Le remplacement glucocorticoïde compense le manque et réduit la stimulation corticotrope ; il peut donc agir sur deux objectifs. Mais la dose nécessaire au contrôle androgénique peut excéder la substitution physiologique. L’excès médicamenteux ralentit la croissance et augmente les risques métaboliques. Le suivi ne cherche pas une suppression parfaite de tout précurseur au prix de ces effets [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Lors de fièvre, chirurgie ou traumatisme important, les besoins en cortisol augmentent. Une personne dépendante de son traitement ne peut pas nécessairement augmenter sa production : le plan adapte le remplacement. Les vomissements ajoutent un défaut d’absorption. En revanche, le consensus ne demande pas de multiplier automatiquement la fludrocortisone ; le plan de stress distingue les fonctions et les produits [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>La physiologie explique ainsi trois erreurs : attendre un signe génital pour suspecter une crise, prendre un marqueur normalisé pour une preuve d’équilibre parfait et augmenter indistinctement tous les comprimés. Chaque modification doit répondre au besoin hormonal réellement concerné [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> Le traitement remplace un besoin et module un signal ; ces deux effets ne justifient pas une suppression hormonale maximale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-s-physio-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e25-tab-bioch" id="e25-s-bioch" hidden><div class="key"><p><b>Science → clinique.</b> Hypertension et hyperandrogénie peuvent orienter vers la voie 11β. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>Science → examen.</b> Le profil multi-stéroïdien évite de conclure sur la seule 17-hydroxyprogestérone. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>]</p><p><b>Science → traitement.</b> Le remplacement est choisi après compréhension du profil glucocorticoïde et minéralocorticoïde. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>À retenir.</b> Une structure, une mesure et une décision répondent à des questions différentes.</p></div><figure><svg viewBox="0 0 660 130" role="img" aria-label="Enchaînement logique, sans représentation anatomique"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="12" width="200" height="96" rx="8"/><rect x="230" y="12" width="200" height="96" rx="8"/><rect x="455" y="12" width="200" height="96" rx="8"/><path d="M205 60h25m-8-5 8 5-8 5M430 60h25m-8-5 8 5-8 5"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="105" y="65">Bloc enzymatique</text><text x="330" y="65">Précurseurs modifiés</text><text x="555" y="65">Profil ciblé</text></g></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les flèches résument la séquence discutée dans le texte, sans probabilité ni causalité individuelle supplémentaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</figcaption></figure><section class="ilot" id="e25-s-bioch-cours"><h2><span class="n">s-bioch-cours</span>Biochimie : le précurseur indique la voie, pas tout le diagnostic</h2><p>La stéroïdogenèse commence avec le cholestérol. Son transfert mitochondrial et la transformation initiale en prégnénolone impliquent des protéines distinctes ; des anomalies précoces peuvent affecter plusieurs familles de stéroïdes. Des étapes ultérieures conduisent aux glucocorticoïdes, aux minéralocorticoïdes et aux stéroïdes sexuels. Le gène d’une enzyme n’est pas le nom de tous les produits situés en aval [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>La 21-hydroxylase convertit la progestérone en désoxycorticostérone et la 17-hydroxyprogestérone en 11-désoxycortisol. Le défaut <button class="w" data-k="e25-genes">CYP21A2</button> réduit ces conversions et favorise l’accumulation de précurseurs, dont la 17-hydroxyprogestérone. D’autres transformations peuvent produire du 21-désoxycortisol et des androgènes. L’élévation d’un marqueur doit être confrontée aux autres voies et à la méthode de dosage [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>La 11β-hydroxylase intervient plus loin dans la production du cortisol. Son déficit peut augmenter le 11-désoxycortisol et la désoxycorticostérone ; l’activité minéralocorticoïde de cette dernière explique l’hypertension possible. Une 17-hydroxyprogestérone élevée n’est donc pas toujours synonyme de déficit en 21-hydroxylase, surtout si la pression ou le profil ne concorde pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30817301/" target="_blank" rel="noopener">S11</a>].</p>
<p>Les déficits en 17α-hydroxylase/17,20-lyase, en 3β-hydroxystéroïde déshydrogénase et en oxydoréductase du cytochrome <button class="w" data-k="e25-genes">P450</button> affectent d’autres branchements. Le déficit en <button class="w" data-k="e25-genes">POR</button> peut combiner plusieurs perturbations et des signes squelettiques. Il serait faux de donner à toutes ces formes des électrolytes obligatoirement normaux ou la même réponse en androgènes. Le centre choisit un profil stéroïdien, éventuellement des métabolites urinaires et la génétique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les immunodosages peuvent mesurer en partie des molécules proches. La spectrométrie de masse améliore la spécificité analytique mais n’annule pas les variations d’âge, d’horaire, de maladie ou de traitement. Une valeur sur sang séché de dépistage n’a pas automatiquement le même seuil qu’un sérum stimulé. Les unités sont conservées et les anciens seuils ne sont pas déclarés universels [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>].</p>
<p>Enfin, un biomarqueur prometteur n’est pas une cible validée pour chaque décision. La revue discute les androgènes oxygénés et les profils élargis ; leur intérêt scientifique ne dispense pas des données de croissance, de pression, de symptômes et du produit reçu [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Un bloc modifie un réseau de stéroïdes. Le profil, la méthode et le contexte empêchent d’étiqueter une enzyme sur un seul chiffre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-s-bioch-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e25-tab-gene" id="e25-s-gene" hidden><div class="key"><p><b>Science → clinique.</b> Le génotype oriente sans rendre inutiles les signes et la surveillance. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>Science → examen.</b> Séquence et nombre de copies se complètent ; la phase parentale clarifie les variants. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>]</p><p><b>Science → traitement.</b> Conseil familial et remplacement sont distincts ; le test ne répare pas la synthèse. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]</p><p><b>À retenir.</b> Une structure, une mesure et une décision répondent à des questions différentes.</p></div><figure><svg viewBox="0 0 660 130" role="img" aria-label="Enchaînement logique, sans représentation anatomique"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="12" width="200" height="96" rx="8"/><rect x="230" y="12" width="200" height="96" rx="8"/><rect x="455" y="12" width="200" height="96" rx="8"/><path d="M205 60h25m-8-5 8 5-8 5M430 60h25m-8-5 8 5-8 5"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="105" y="65">Gène / pseudogène</text><text x="330" y="65">Méthodes complémentaires</text><text x="555" y="65">Interprétation familiale</text></g></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les flèches résument la séquence discutée dans le texte, sans probabilité ni causalité individuelle supplémentaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</figcaption></figure><section class="ilot" id="e25-s-gene-cours"><h2><span class="n">s-gene-cours</span>Génétique et immunologie : une maladie récessive, pas une auto-immunité</h2><p>Le déficit en 21-hydroxylase est généralement autosomique récessif. Deux copies pathogènes sur les chromosomes correspondants peuvent produire la maladie ; les porteurs d’une seule copie ne sont pas assimilés automatiquement à des personnes avec forme classique. Le conseil évalue le patient, les apparentés et le partenaire selon le projet familial, sans déduire un risque personnel du seul pourcentage d’une population [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p><button class="w" data-k="e25-genes">CYP21A2</button> se situe dans une région complexe du chromosome 6, à proximité d’un pseudogène très ressemblant, <button class="w" data-k="e25-genes">CYP21A1P</button>. Conversions géniques, délétions, duplications et réarrangements rendent l’analyse difficile. Un séquençage ne répond pas nécessairement à la question du nombre de copies ; une technique de dosage de copies ne décrit pas nécessairement tous les petits variants. Les méthodes se complètent et doivent être validées par le laboratoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Si deux variants sont détectés, leur disposition compte : sur la même copie, ils ne prouvent pas que l’autre copie est atteinte. Les prélèvements parentaux peuvent établir cette phase et distinguer un variant transmis d’un événement nouveau. Le résultat doit préciser la méthode, ses limites et la classification des variants. Un résultat de signification incertaine ne devient pas pathogène par commodité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Le génotype oriente souvent la sévérité, mais des discordances existent. La prédiction n’annule pas le bilan clinique, électrolytique et hormonal ni les mesures de sécurité. Les chiffres de concordance d’une cohorte ne doivent pas être transformés en certitude individuelle, et une forme non classique peut transmettre un allèle associé à une forme plus sévère [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Le mécanisme congénital n’est pas celui d’une destruction auto-immune des surrénales. La proximité génomique de régions immunologiques ne fait pas du déficit enzymatique une maladie d’anticorps. Il faut aussi distinguer substitution et immunosuppression pharmacologique : la FI Alkindi n’interdit pas les vaccins vivants aux seules doses substitutives, alors que les fortes doses de corticostéroïdes ont d’autres précautions [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Le conseil prénatal repose sur consentement et cadre légal national. Le diagnostic fœtal et un traitement fœtal sont deux décisions différentes ; la dexaméthasone prénatale demeure expérimentale dans les références lues. Une brochure étrangère ne constitue pas une autorisation suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<div class="key"><b>À retenir.</b> Le pseudogène et le nombre de copies compliquent le test. Génotype, phénotype et risque familial se discutent ensemble ; récessif ne signifie pas auto-immun [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-s-gene-cours">Essentiel de cette partie</button></section>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e25-p-1"><h2><span class="n">p-1</span>Choisir la fonction avant le produit</h2><p>L’hydrocortisone remplace le glucocorticoïde et freine la stimulation corticotrope. La fludrocortisone remplace surtout l’action minéralocorticoïde lorsque celle-ci manque. Le tétracosactide est ici un agent diagnostique. Ces fonctions ne sont pas interchangeables et aucun médicament ne répare directement le variant génétique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p>Le schéma tient compte de l’âge, de la surface corporelle, des symptômes, de la croissance, des horaires et de la formulation réellement disponible. Les doses de crise se distinguent de l’entretien et des adaptations de maladie orale. Une injection en mg/kg ne doit pas être lue comme un total en mg/m²/j [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Le suivi demande les prises réelles et les obstacles matériels avant de modifier les doses. Les inducteurs enzymatiques peuvent réduire l’exposition ; un changement de préparation peut modifier la précision de dose. Le traitement indispensable d’une forme classique n’est pas interrompu selon un conseil générique de décroissance destiné à une autre indication [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> Entretien, maladie orale et crise sont trois contextes. Un produit exact, une voie, une unité et une population accompagnent chaque dose [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-p-2"><h2><span class="n">p-2</span>Hydrocortisone orale : deux formulations suisses</h2><table class="t" data-e25-table="1"><thead><tr><th>Produit et FI</th><th>Repères propres à la FI</th><th>Limites pratiques</th></tr></thead><tbody><tr><td><button class="w" data-k="e25-alkindi">Alkindi, février 2025</button></td><td>Naissance à &lt;18 ans ; hyperplasie 10–15 mg/m²/j en 3–4 prises ; individualisation.</td><td>Granulés 0,5/1/2/5 mg ; ne pas avaler l’enveloppe, mâcher ou mélanger à liquide ; pas de sonde.</td></tr><tr><td><button class="w" data-k="e25-galepharm">Hydrocortisone Galepharm, août 2025</button></td><td>Comprimé sécable 10 mg ; syndrome adrénogénital, dose usuelle 10–30 mg/j selon situation.</td><td>Ne pas attribuer à la FI les données pédiatriques Swisspeddose annexées ; suivi après changement de produit.</td></tr></tbody></table>
<p>Aucun plafond chronique universel n’est inventé à partir de ces intervalles. La dose minimale efficace répond aux besoins, à la croissance et aux effets indésirables. Sous- ou surexposition peut être dangereuse. Les monographies précisent interactions, populations et manipulation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> Les granulés pédiatriques et le comprimé de 10 mg ont des contraintes différentes ; le changement de produit mérite une surveillance [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-p-3"><h2><span class="n">p-3</span>Injectable et minéralocorticoïde</h2><p><button class="w" data-k="e25-solucortef">Solu-Cortef</button> permet le remplacement parentéral urgent. La FI suisse indique l’intraveineuse préférée en urgence et l’intramusculaire possible. Elle ne donne pas un bolus de crise néonatale de 100 mg à appliquer à tout enfant. Les repères du consensus européen sont clairement attribués à celui-ci, avec surveillance et suite hospitalière [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p><button class="w" data-k="e25-florinef">Florinef</button> 0,1 mg oral vise la perte minéralocorticoïde ; il ne traite pas seul le manque de cortisol. Le schéma est adapté à pression, sodium, potassium, rénine, poids et œdèmes. La divergence entre la FI pédiatrique et les repères néonataux spécialisés doit être résolue par le prescripteur, sans conversion cachée ni dose hybride [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<p>La <button class="w" data-k="e25-metabolisme">revue du métabolisme médicamenteux</button> accompagne le traitement. La maladie intercurrente appelle l’adaptation glucocorticoïde prévue. consensus de la société britannique d’endocrinologie et diabétologie pédiatriques ne demande pas d’augmenter automatiquement la fludrocortisone ; si la voie orale est impossible, fluides et effet minéralocorticoïde de l’hydrocortisone à fortes doses participent temporairement à l’équilibre. Le produit et la suite restent vérifiés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> L’injection urgente ne remplace pas la surveillance ; le minéralocorticoïde ne remplace pas le cortisol et ne se triple pas automatiquement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-p-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-p-4"><h2><span class="n">p-4</span>Test diagnostique et traitements émergents</h2><p><button class="w" data-k="e25-synacthen">Synacthen immédiat</button> stimule la production surrénalienne dans un test supervisé. La contre-indication thérapeutique du syndrome adrénogénital dans sa FI n’abolit pas son utilisation diagnostique ; il faut lire l’indication et la section posologique correspondantes. Il ne faut pas l’administrer comme traitement substitutif de la crise [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p>Le crinecerfont antagonise le récepteur <button class="w" data-k="e25-crf">CRF1</button> et réduit le signal conduisant à l’excès androgénique. Un essai multinational adulte de 182 personnes sur vingt-quatre semaines a montré une différence de réduction glucocorticoïde de 17 points de pourcentage ; le résumé de l’essai pédiatrique de 103 personnes sur vingt-huit semaines rapporte 23,5 points. Ces critères de dose et biomarqueurs ne prouvent pas une prévention à long terme des crises, des fractures ou de l’infertilité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>].</p>
<p>Ces essais financés par le fabricant ne sont pas des FI suisses. Aucun statut suisse 2026 ni dose à prescrire n’est déduit de leur publication. Le traitement étudié ne remplace pas le cortisol et le minéralocorticoïde nécessaires ; réduire un signal n’est pas corriger le déficit de synthèse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> Le tétracosactide est diagnostique ici. Les résultats du crinecerfont gardent leur durée, leur critère et leur statut d’essai, sans ordonnance suisse inventée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-p-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e25-semio" data-title="Sémiologie structurée E25"><p>Le volet Sciences s’ouvre sur la sémiologie : fonction normale, signes, mécanismes, examen, interprétation, différentiels, urgence, limites et sources. Un signe choisit une action, il ne remplace pas la confirmation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</template>
<template data-pop="e25-alkindi" data-title="Hydrocortisone en granulés — FI suisse février 2025"><div class="lab">Produit et indication</div><p>Alkindi contient l’hydrocortisone en granulés dans des capsules à ouvrir de 0,5, 1, 2 ou 5 mg. La FI couvre la substitution de l’insuffisance corticosurrénale de la naissance à moins de dix-huit ans. Le récepteur glucocorticoïde médie les effets de remplacement et le rétrocontrôle ; un minéralocorticoïde peut rester nécessaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Dose, voie et durée</div><p>La FI donne habituellement 8–10 mg/m²/j pour l’insuffisance et 10–15 mg/m²/j pour l’hyperplasie, répartis en trois ou quatre prises. La réponse individuelle, la croissance et les résultats guident l’adaptation ; ce repère n’est pas un maximum universel. La substitution d’une forme classique est prolongée, avec réévaluations, et ne s’interrompt pas par défaut [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Manipulation</div><p>Ouvrir la capsule ; ne pas avaler son enveloppe, ni mâcher les granulés. Administrer directement sur la langue, à la cuillère ou sur un aliment mou froid/à température ambiante, consommé dans les cinq minutes, puis boire pour avaler tous les granulés. Ne pas les mélanger à un liquide et ne pas administrer par sonde nasogastrique, qui pourrait s’obstruer. Des résidus dans les selles ne prouvent pas un échec et ne justifient pas une dose supplémentaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Maladie et changement de préparation</div><p>La FI décrit doublement ou triplement transitoire dans un stress léger selon le plan ; maladie sévère, vomissements ou impossibilité d’absorber exigent le relais parentéral sans retard et une évaluation urgente. Ce schéma ne se cumule pas automatiquement avec le total de maladie proposé par consensus de la société britannique d’endocrinologie et diabétologie pédiatriques. Après passage d’une préparation composée aux granulés, la précision peut changer ; une insuffisance dans la première semaine est possible et le suivi est renforcé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="lab">Contre-indications, risques et interactions</div><p>Hypersensibilité, dysphagie et prématuré ne pouvant s’alimenter par voie orale contre-indiquent cette préparation. Prise pondérale avec ralentissement statural, hypertension, troubles osseux ou visuels peuvent signaler une surexposition. Le sous-remplacement expose à la crise. Les doses substitutives ne constituent pas une immunosuppression interdisant à elles seules les vaccins vivants [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<p>Inducteurs du <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">CYP3A4</a>, notamment rifampicine et carbamazépine, peuvent réduire l’effet et provoquer une insuffisance ; inhibiteurs tels que certains azolés ou ritonavir peuvent augmenter l’exposition. Surveillance et adaptation sont nécessaires. Aucun ajustement rénal ou hépatique forfaitaire non documenté n’est inventé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Grossesse et allaitement</div><p>La substitution hydrocortisonée peut être utilisée si nécessaire avec surveillance ; ces données ne rendent pas ce produit pédiatrique automatiquement indiqué chez toute adulte. Les conditions d’une autre formulation et celles de la fludrocortisone restent distinctes [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e25-galepharm" data-title="Hydrocortisone comprimé — FI suisse août 2025"><div class="lab">Produit et rôle</div><p>Hydrocortisone Galepharm est un comprimé de 10 mg sécable. Il remplace le cortisol et peut freiner l’excès de stimulation corticotrope. La FI cite une dose usuelle de 10–30 mg/j pour le syndrome adrénogénital ; la substitution d’une insuffisance chronique est décrite à 10–20 mg/j, avec complément minéralocorticoïde/sel si nécessaire. Ces contextes ne se remplacent pas par une dose anti-inflammatoire générique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<div class="lab">Schéma et individualisation</div><p>Voie orale au cours des repas ; la FI répartit le total en une ou plusieurs prises, jusqu’à trois ou quatre selon l’indication. La répartition et la dose sont personnalisées selon besoins, symptômes et contrôle biologique. Aucun maximum spécifique E25 universel n’est établi à partir d’une simple fourchette. La durée de substitution classique est prolongée et l’arrêt intempestif expose à la crise. Les données Swisspeddose ajoutées après la FI par l’outil sont une source distincte ; elles ne sont pas attribuées au texte réglementaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<div class="lab">Adaptations et précautions</div><p>La FI ne demande pas d’adaptation rénale systématique ; insuffisance hépatique sévère ou hypothyroïdie peuvent ralentir le métabolisme et demander réduction. L’état clinique et le suivi gardent priorité. Fièvre importante, intervention, traumatisme et vomissements appellent un plan de stress avec relais parentéral si l’absorption manque [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Les précautions générales des corticostéroïdes dépendent de dose et durée : infections, troubles métaboliques, pression, os, yeux et effets psychiques méritent surveillance. L’hypersensibilité au produit doit être vérifiée ; on ne transpose pas une contre-indication destinée à une forte dose immunosuppressive à l’abandon d’un remplacement vital [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<div class="lab">Interactions et populations</div><p>Inducteurs/inhibiteurs enzymatiques et traitements modifiant glucose, potassium ou coagulation peuvent demander adaptation ; la liste réelle des médicaments est revue. La grossesse exige une indication et un suivi ; à doses pharmacologiques/élevées, la FI demande d’interrompre l’allaitement. La substitution et les préparations ont des limites propres, à distinguer des recommandations générales [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
</template>
<template data-pop="e25-solucortef" data-title="Hydrocortisone injectable — FI suisse octobre 2025"><div class="lab">Rôle et produit</div><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">Solu-Cortef</a> est une préparation injectable de succinate sodique d’hydrocortisone. Les ampoules à deux compartiments contiennent 100 mg ou 250 mg de poudre, chacun avec 2 ml de solvant ; ils ne délivrent donc pas la même concentration après reconstitution. La FI indique notamment le choc par insuffisance corticosurrénale. En urgence la FI préfère la voie intraveineuse ; la voie intramusculaire peut être utilisée selon les conditions. Le dispositif, la concentration reconstituée et la dose à prélever sont vérifiés avant usage. La reconstitution est aseptique ; le produit est à usage unique, à utiliser de préférence immédiatement et au plus tard dans les quatre heures à 15–25 °C selon la FI. Les restes sont éliminés. Une voie intrathécale mentionnée pour d’autres indications n’est jamais une voie de traitement de la crise E25 [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<div class="lab">Doses : ne pas confondre les sources</div><p>La FI décrit des doses initiales individualisées jusqu’à 100 mg intraveineuse en au moins trente secondes, puis selon l’état et des intervalles pouvant être de deux, quatre ou six heures. Des doses d’au moins 500 mg doivent être injectées en au moins dix minutes. Ces indications générales ne fixent pas un bolus de 100 mg pour tout nouveau-né ; le repère consensus de la société britannique d’endocrinologie et diabétologie pédiatriques pédiatrique par âge ou poids est cité séparément [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Les schémas périopératoires de la FI peuvent différer des consensus spécialisés. Le cours ne compose pas un protocole en mélangeant leurs doses. L’anesthésiste et l’endocrinologue choisissent le schéma adapté, avec suite, surveillance et transition orale. Le bolus initial ne remplace pas la poursuite du traitement, les fluides, la correction du glucose et la recherche du facteur déclenchant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="lab">Contre-indications et précautions</div><p>La FI liste hypersensibilité, voie épidurale et certaines limites de voies ; l’intramusculaire est contre-indiquée en cas de purpura thrombopénique idiopathique. Les vaccins vivants sont contre-indiqués aux doses immunosuppressives. Les voies, la situation vitale et la substitution sont examinées avec précision, sans utiliser une précaution générale pour laisser une crise sans traitement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Effets possibles : hyperglycémie, rétention hydrosodée, troubles du potassium, infections, effets psychiques, osseux ou oculaires selon dose/durée. Interactions et compatibilités doivent être vérifiées. La fonction rénale ne demande pas d’ajustement systématique ; une atteinte hépatique sévère ou hypothyroïdie peut réduire le métabolisme. La grossesse et le nouveau-né demandent une évaluation propre [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Le traitement d’urgence est bref dans cette forme, puis relayé selon récupération et maladie de fond. Une forme classique reste dépendante d’un remplacement durable ; la fin de l’injection n’est pas la fin de toute substitution [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
</template>
<template data-pop="e25-florinef" data-title="Fludrocortisone 0,1 mg — FI suisse mars 2026"><table class="t" data-e25-table="1"><thead><tr><th>Population</th><th>Dose orale de la FI</th><th>Interprétation</th></tr></thead><tbody><tr><td>Adulte</td><td>0,1 mg trois fois/semaine à 0,2 mg/j ; usuelle 0,1 mg/j</td><td>Ajuster à pression, électrolytes et clinique.</td></tr><tr><td>12–18 ans</td><td>Dose adulte</td><td>Pas confusion avec hydrocortisone.</td></tr><tr><td>0–12 ans</td><td>2–5 µg/kg/j</td><td>Divergence avec certains repères néonataux spécialisés.</td></tr><tr><td>Hypertension transitoire sous traitement</td><td>La FI cite réduction à maximum 0,05 mg/j</td><td>Réévaluation clinique ; ne pas appliquer comme règle isolée à toute hypertension.</td></tr></tbody></table>
<div class="lab">Rôle et divergence explicite</div><p>Florinef est une fludrocortisone orale de 0,1 mg indiquée notamment dans l’insuffisance primaire marquée et le syndrome adrénogénital avec perte de sel. Elle favorise rétention sodée et excrétion potassique, mais ne remplace pas seule le cortisol [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<p>La revue spécialisée cite souvent 100–200 µg/j chez le nourrisson, parfois davantage en résistance rénale néonatale ; cela peut être très différent de 2–5 µg/kg/j. Les chiffres gardent leurs sources et populations. Le cours ne fabrique ni moyenne ni schéma par défaut : prescription, formulation, justification et surveillance doivent être vérifiées par le centre et la pharmacie. Les besoins peuvent diminuer avec la maturation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Surveillance et sécurité</div><p>Contrôler pression, poids, œdèmes, sodium, potassium et rénine selon les conditions de mesure. Rétention hydrosodée, hypertension, hypokaliémie et alcalose sont des risques. L’apport sodé et le médicament se règlent ensemble ; aucun mélange oral de sel pour nourrisson n’est improvisé. Les données rénales/hépatiques sont insuffisantes pour une recommandation formelle, ce qui ne signifie pas absence de risque [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<p>Les contre-indications comprennent hypersensibilité, mycose systémique, ulcère gastro-intestinal aigu, herpès oculaire, zona/varicelle, hypertension sévère et artériosclérose cérébrale avancée. Interactions favorisant perte de potassium ou effets digitaliques et traitements métaboliques imposent revue pharmaceutique. Le bénéfice et les risques du remplacement nécessaire sont individualisés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Maladie, grossesse et conservation</div><p>consensus de la société britannique d’endocrinologie et diabétologie pédiatriques ne demande pas de multiplier automatiquement la dose en maladie ou crise ; l’adaptation glucocorticoïde et les soins hospitaliers sont distincts. Reprendre l’oral quand possible selon le plan [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]. La FI demande une nécessité démontrée en grossesse, surveillance du nouveau-né pour insuffisance et absence d’allaitement pendant le traitement. Conserver au réfrigérateur entre 2 et 8 °C. La durée est celle du besoin, avec réévaluation ; le produit n’agit pas comme une injection de secours immédiate [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e25-synacthen" data-title="Tétracosactide immédiat — FI suisse juin 2023"><div class="lab">Produit et question diagnostique</div><p>Synacthen immédiat contient 0,25 mg de tétracosactide dans 1 ml ; la forme dépôt est différente. Son activité corticotrope stimule la surrénale. Dans ce cours, il sert au test diagnostique et non au remplacement d’une hormone manquante [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Test de la FI et limites</div><p>Chez l’adulte, 0,25 mg intramusculaire ou intraveineuse ; dosage du cortisol immédiatement avant et exactement trente minutes après. La FI cite une augmentation d’au moins 200 nmol/L ou un taux au-dessus de 500 nmol/L, avec unités et formulations historiques. L’augmentation et le taux final ne sont pas deux grandeurs identiques, et la méthode analytique actuelle doit guider l’interprétation. La FI ne fournit pas une posologie pédiatrique étudiée ; aucun schéma adulte n’est étendu automatiquement à tout enfant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p>Pour une hyperplasie, la réponse des précurseurs, notamment de la 17-hydroxyprogestérone, est une autre question que le seul cortisol. Les seuils historiques non classiques viennent d’autres études et doivent être contextualisés. Œstrogènes, protéines de liaison, maladie hépatique, syndrome néphrotique ou maladie critique peuvent modifier le cortisol total ; l’expert choisit l’interprétation ou une autre exploration [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Contre-indications et surveillance</div><p>Une hypersensibilité préalable aux préparations corticotropes contre-indique l’usage. Réaction anaphylactique, notamment chez les personnes avec terrain allergique/asthmatique, exige interrogatoire, disponibilité de réanimation et surveillance pendant trente minutes. La contre-indication du syndrome adrénogénital dans les indications thérapeutiques ne signifie pas interdiction de son exploration diagnostique ; les sections sont distinguées explicitement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p>La dose est celle d’un examen ponctuel, pas d’une substitution quotidienne. Le test ne doit jamais retarder le traitement d’une crise ni être proposé à domicile comme secours. Conditions de grossesse, autres contre-indications et médicaments modifiant le test sont revus par l’équipe avant programmation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</template>

<template data-pop="e25-genes" data-title="Gènes et protéines de la stéroïdogenèse"><table class="t" data-e25-table="1"><thead><tr><th>Symbole</th><th>Sens dans ce cours</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP21A2</a></td><td>Gène de la 21-hydroxylase.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP21A1P</a></td><td>Pseudogène proche, conversions et difficultés analytiques.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP11B1</a></td><td>Gène de la 11β-hydroxylase.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP17A1</a></td><td>Gène de l’enzyme 17α-hydroxylase et 17,20-lyase.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">HSD3B2</a></td><td>Gène de la 3β-hydroxystéroïde déshydrogénase de type 2.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">POR</a></td><td>Oxydoréductase du cytochrome <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">P450</a> ; perturbations combinées, sans électrolytes obligatoirement normaux.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">StAR</a></td><td>Protéine régulatrice aiguë de la stéroïdogenèse : transfert du cholestérol.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP11A1</a></td><td>Clivage de la chaîne latérale du cholestérol, étape initiale.</td></tr></tbody></table><p>Les symboles des cytochromes décrivent une nomenclature. Le test distingue copie active, pseudogène et nombre de copies ; le génotype oriente sans remplacer la clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p></template>
<template data-pop="e25-chromosomes" data-title="Constitution chromosomique et respect"><p>46,<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">XX</a> décrit quarante-six chromosomes dont deux X ; 46,<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">XY</a> comporte un X et un Y. Chromosomes, organes, fonctions hormonales et identité sont des dimensions distinctes. L’excès androgénique peut modifier les organes externes en 46,<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">XX</a> ; leur apparence ne détermine pas l’identité future [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p></template>
<template data-pop="e25-nosologie" data-title="Classification suisse"><table class="t" data-e25-table="1"><thead><tr><th>Code</th><th>Libellé OFS 2024</th></tr></thead><tbody><tr><td>E25</td><td>Anomalies génito-surrénaliennes</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.0</a></td><td>Anomalies génito-surrénaliennes congénitales liées à un déficit enzymatique</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.00</a></td><td>Déficit en 21-hydroxylase [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">SAG</a> de type 3], forme classique</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.01</a></td><td>Déficit en 21-hydroxylase [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">SAG</a> de type 3], forme tardive</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.08</a></td><td>Autres anomalies adrénogénitales congénitales liées à un déficit enzymatique</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.09</a></td><td>Anomalie adrénogénitale congénitale liée à un déficit enzymatique, sans précision</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.8</a></td><td>Autres anomalies génito-surrénaliennes</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.9</a></td><td>Anomalie génito-surrénalienne, sans précision</td></tr></tbody></table><p><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">SAG</a> signifie syndrome adrénogénital dans le libellé. Le code suit le diagnostic ; aucune tumeur ou hyperandrogénie n’est automatiquement <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.8</a>. Aucun remboursement 2026 n’est certifié [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>].</p></template>
<template data-pop="e25-profiles" data-title="Cadre suisse de formation"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">PROFILES</a> signifie Principal Relevant Objectives and Framework for Integrated Learning and Education in Switzerland. Les situations de départ concernent notamment organes génitaux externes atypiques, pression anormale et croissance/puberté. Le lien avec E25 est pédagogique, sans question officielle ni correspondance officielle avec la classification des maladies [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p></template>
<template data-pop="e25-corticotrope" data-title="Hormone corticotrope"><p>L’hormone adrénocorticotrope hypophysaire stimule le cortex, notamment le cortisol, qui exerce un rétrocontrôle. Un signal accru ne répare pas un bloc enzymatique. L’aldostérone dépend surtout de rénine–angiotensine et potassium. Le signal seul n’est pas une cible de titration [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p></template>
<template data-pop="e25-crf" data-title="Récepteur du signal hypothalamique"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">CRF1</a> est le récepteur de type 1 du facteur de libération de la corticotropine. Son antagonisme peut réduire stimulation corticotrope et androgènes. Les essais ne remplacent pas le cortisol nécessaire et ne prouvent pas une autorisation suisse actuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>].</p></template>
<template data-pop="e25-metabolisme" data-title="Métabolisme de l’hydrocortisone"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">CYP3A4</a> est une enzyme de la famille des cytochromes <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">P450</a> participant au métabolisme de l’hydrocortisone. Inducteurs et inhibiteurs peuvent changer son exposition ; le produit et le contexte guident l’adaptation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p></template>

<template data-pop="pareto-e25-1" data-title="Essentiel — Une urgence peut précéder le résultat du dépistage"><p>Un garçon peut présenter une perte de sel sans signe génital visible. L’urgence clinique précède la confirmation étiologique [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-1"></p>
</template>
<template data-pop="pareto-e25-2" data-title="Essentiel — Définition et formes cliniques"><p>Classique ne signifie pas toujours perte de sel ; non classique reste congénital. Le mécanisme enzymatique guide les signes et le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-2"></p>
</template>
<template data-pop="pareto-e25-3" data-title="Essentiel — Épidémiologie : conserver chaque dénominateur"><p>1/9000 nouveau-nés, 1/7500 filles et 4,2 % de femmes hyperandrogéniques décrivent trois populations différentes [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12210017/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</p>
<p class="ratio" data-cover="e25-3"></p>
</template>
<template data-pop="pareto-e25-4" data-title="Essentiel — Du fonctionnement normal aux symptômes"><p>Le déficit en cortisol explique la vulnérabilité au stress ; le profil minéralocorticoïde distingue perte de sel et hypertension [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-4"></p>
</template>
<template data-pop="pareto-e25-5" data-title="Essentiel — Étiologies et diagnostics voisins"><p>L’hypertension avec excès androgénique fait chercher une autre voie que la seule 21-hydroxylase. Les tumeurs et les ovaires polykystiques gardent leur diagnostic propre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-5"></p>
</template>
<template data-pop="pareto-e25-6" data-title="Essentiel — Anamnèse et communication"><p>La chronologie, la croissance et l’accès réel au remplacement sont aussi importants que l’étiquette génétique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-6"></p>
</template>
<template data-pop="pareto-e25-7" data-title="Essentiel — Examen clinique et sémiologie"><p>Une anatomie externe apparemment habituelle ne rassure pas sur le cortisol. La croissance rapide et la petite taille finale peuvent relever du même excès androgénique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-7"></p>
</template>
<template data-pop="pareto-e25-8" data-title="Essentiel — Diagnostic positif et séquence d’exploration"><p>Dépister, confirmer le déficit et évaluer la réserve cortisolaire sont des questions distinctes ; le seuil garde sa méthode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e25-8"></p>
</template>
<template data-pop="pareto-e25-9" data-title="Essentiel — Drapeaux rouges et crise surrénalienne"><p>La dose de crise dépend de l’âge/poids et du contexte. Après l’injection de secours, l’évaluation urgente et la surveillance restent indispensables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-9"></p>
</template>
<template data-pop="pareto-e25-10" data-title="Essentiel — Prise en charge : remplacer sans surtraiter"><p>Le remplacement classique est indispensable ; le traitement non classique dépend des conséquences. La dose se juge avec la croissance et la clinique, jamais un marqueur seul [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-10"></p>
</template>
<template data-pop="pareto-e25-11" data-title="Essentiel — Complications, pronostic et suivi"><p>Suivre croissance, pression, hormones contextualisées et vécu. Un dépistage réussi n’annule pas le risque de crise ni les besoins à l’âge adulte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-11"></p>
</template>
<template data-pop="pareto-e25-12" data-title="Essentiel — Maladie intercurrente, grossesse et transition"><p>Le plan de stress s’écrit avant la maladie et ne cumule pas aveuglément des schémas. La transition doit conserver un accès continu au traitement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-12"></p>
</template>
<template data-pop="pareto-e25-13" data-title="Essentiel — Tous les sous-codes et contexte suisse"><p>Le code suit le diagnostic documenté. Aucun statut de remboursement ou de traitement génital individuel n’est déduit du seul libellé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>].</p>
<p class="ratio" data-cover="e25-13"></p>
</template>
<template data-pop="pareto-e25-14" data-title="Essentiel — Critères, paramètres et pièges fédéraux"><p>Le bon chiffre répond à une question, une méthode, un âge et une voie. Les unités et la population font partie de la réponse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-14"></p>
</template>
<template data-pop="pareto-e25-e-1" data-title="Essentiel — Du dépistage au diagnostic"><p>Un dépistage positif appelle une confirmation contextualisée ; un tableau grave appelle un traitement immédiat même avec dépistage négatif ou en attente [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-e-1"></p>
</template>
<template data-pop="pareto-e25-e-2" data-title="Essentiel — Profil hormonal et test dynamique"><p>La stimulation peut explorer la réserve en cortisol ou les précurseurs d’un bloc enzymatique ; les critères de ces deux questions ne s’échangent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e25-e-2"></p>
</template>
<template data-pop="pareto-e25-e-3" data-title="Essentiel — Génétique, os et échographie"><p>Un résultat génétique exige sa méthode et sa phase familiale ; une image exige sa question clinique. Aucun examen ne remplace le suivi longitudinal [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e25-e-3"></p>
</template>
<template data-pop="pareto-e25-e-4" data-title="Essentiel — Quatre exercices de raisonnement"><p>Les exercices sont originaux : urgence, seuil contextualisé, profil hypertensif et dépistage du prématuré [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-e-4"></p>
</template>
<template data-pop="pareto-e25-s-anat-cours" data-title="Essentiel — Anatomie normale puis portée clinique"><p>Cortex et médulla ont des fonctions distinctes ; l’anatomie normale explique les voies sans confirmer le déficit d’un patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e25-s-anat-cours"></p>
</template>
<template data-pop="pareto-e25-s-histo-cours" data-title="Essentiel — Histologie : lire la zone avant de nommer la maladie"><p>La coupe normale illustre les territoires ; elle ne montre ni un variant <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP21A2</a> ni une hyperplasie pathologique individuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e25-s-histo-cours"></p>
</template>
<template data-pop="pareto-e25-s-physio-cours" data-title="Essentiel — Physiologie : trois régulations et un équilibre thérapeutique"><p>Le traitement remplace un besoin et module un signal ; ces deux effets ne justifient pas une suppression hormonale maximale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-s-physio-cours"></p>
</template>
<template data-pop="pareto-e25-s-bioch-cours" data-title="Essentiel — Biochimie : le précurseur indique la voie, pas tout le diagnostic"><p>Un bloc modifie un réseau de stéroïdes. Le profil, la méthode et le contexte empêchent d’étiqueter une enzyme sur un seul chiffre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e25-s-bioch-cours"></p>
</template>
<template data-pop="pareto-e25-s-gene-cours" data-title="Essentiel — Génétique et immunologie : une maladie récessive, pas une auto-immunité"><p>Le pseudogène et le nombre de copies compliquent le test. Génotype, phénotype et risque familial se discutent ensemble ; récessif ne signifie pas auto-immun [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e25-s-gene-cours"></p>
</template>
<template data-pop="pareto-e25-p-1" data-title="Essentiel — Choisir la fonction avant le produit"><p>Entretien, maladie orale et crise sont trois contextes. Un produit exact, une voie, une unité et une population accompagnent chaque dose [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-p-1"></p>
</template>
<template data-pop="pareto-e25-p-2" data-title="Essentiel — Hydrocortisone orale : deux formulations suisses"><p>Les granulés pédiatriques et le comprimé de 10 mg ont des contraintes différentes ; le changement de produit mérite une surveillance [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<p class="ratio" data-cover="e25-p-2"></p>
</template>
<template data-pop="pareto-e25-p-3" data-title="Essentiel — Injectable et minéralocorticoïde"><p>L’injection urgente ne remplace pas la surveillance ; le minéralocorticoïde ne remplace pas le cortisol et ne se triple pas automatiquement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-p-3"></p>
</template>
<template data-pop="pareto-e25-p-4" data-title="Essentiel — Test diagnostique et traitements émergents"><p>Le tétracosactide est diagnostique ici. Les résultats du crinecerfont gardent leur durée, leur critère et leur statut d’essai, sans ordonnance suisse inventée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e25-p-4"></p>
</template>
