<section class="ilot" id="c95-e-3"><h2><span class="n">e-3</span> Interpréter le panel et les méthodes génétiques</h2>
<h3>Un panel construit pour éviter les faux raccourcis</h3>
<p>La comparaison aux cellules normales aide à distinguer expression faible, forte et maturation coordonnée. Le compte rendu doit identifier la population analysée et ne pas additionner des positivités provenant de cellules différentes comme si elles appartenaient toutes au même blaste.</p>
<table class="t"><thead><tr><th>Profil</th><th>Lecture intégrée</th><th>Étape complémentaire</th></tr></thead><tbody><tr><td>CD19 fort + CD22 fort + <button class="w" data-k="c95-cytometrie">MPO</button> définissante</td><td>Profil B/myéloïde possible sur une même population.</td><td>Vérifier autres critères, génétique et exclusions.</td></tr><tr><td>CD19 fort + marqueurs B + CD13 isolé</td><td>Lignée B avec marqueur associé myéloïde possible.</td><td>Ne pas appeler LAPM sans critère myéloïde définissant.</td></tr><tr><td>CD7 + CD34, sans <button class="w" data-k="c95-crit-t">CD3</button> définissant</td><td>Immaturité et marqueur associé, pas preuve T suffisante.</td><td>Panel étendu et diagnostics différentiels.</td></tr><tr><td><button class="w" data-k="c95-cytometrie">MPO</button> absente, deux marqueurs monocytaires concordants</td><td>Différenciation monocytaire possible dans le cadre approprié.</td><td>Intégrer morphologie, autres populations et classification.</td></tr><tr><td>Aucun marqueur de lignée après panel complet</td><td>LAI possible si exclusions satisfaites.</td><td>Rechercher catégories génétiques et différenciations rares.</td></tr></tbody></table>
<p>Le caryotype montre des anomalies à l’échelle chromosomique ; FISH teste des régions choisies ; amplification en chaîne par polymérase et séquençage ont leurs cibles et limites. Le laboratoire choisit des méthodes complémentaires selon l’urgence et le spectre recherché. Une fusion peut être importante pour la classification, le choix d’un médicament et le suivi, sans répondre de façon identique à ces trois usages.</p>
<p>Si <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> est détecté, rechercher le contexte de LMC avant de conclure à une LAPM de novo. Si une mutation liée à la myélodysplasie est détectée, préciser OMS ou <button class="w" data-k="c95-who-icc">ICC</button> et intégrer l’histoire. Si le phénotype change à la rechute, comparer au clone initial et élargir les analyses pertinentes.</p>
<p>Les images originales des onglets clinique et scientifique montrent des exemples publiés, pas une bibliothèque exhaustive de tous les profils possibles. Elles aident à apprendre la lecture des axes, contrôles et populations ; elles ne remplacent pas l’interprétation spécialisée d’un cas réel.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div></section>
<section class="ilot" id="c95-e-4"><h2><span class="n">e-4</span> Préanalytique, réponse et discordances</h2>
<p>Un résultat fiable commence avant la machine. Identité, heure, type de prélèvement, traitement reçu, quantité cellulaire et transport conditionnent l’analyse. Une moelle diluée par du sang ou un échantillon pauvre peut réduire la capacité à détecter une maladie résiduelle. Le rapport doit rendre cette limite visible.</p>
<p>La mesure d’urate sous rasburicase illustre un piège particulier : l’enzyme continue de dégrader l’urate après le prélèvement. La fiche Fasturtec impose tube hépariné prérefroidi, glace, centrifugation à 4°C et dosage dans les 4 heures. Une valeur très basse dans un tube resté à température ambiante ne constitue donc pas une preuve suffisante de contrôle métabolique.</p>
<p>Pour la MRD, conserver cible initiale, méthode, sensibilité et calendrier. Le marqueur peut être immunophénotypique ou moléculaire ; il doit rester informatif dans le contexte du traitement. Après un traitement ciblant CD19, une analyse trop centrée sur cet antigène peut manquer une évolution de lignée.</p>
<p>Une discordance se résout par la confrontation des données : qualité des échantillons, cellules réellement mesurées, méthode, cible et évolution clinique. Il n’est pas logique de choisir automatiquement le résultat le plus rassurant ou de moyenner deux tests qui ne mesurent pas la même chose.</p>
<div class="key"><b>À retenir.</b> Le compte rendu utile relie résultat, limite et conséquence. Il indique ce qui a été démontré, ce qui reste probable et l’examen supplémentaire qui peut changer la décision. La surveillance doit rester proportionnée au risque et au protocole.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a>.</p></div></section>
<section class="ilot" id="c95-e-5"><h2><span class="n">e-5</span> Cinq cas pour vérifier le raisonnement</h2><p>Vignettes fictives. Choisir une réponse puis lire le raisonnement, y compris lorsqu’elle paraît évidente. Les cas vérifient une décision et ses limites, sans simuler une prescription personnalisée.</p><div class="quiz ui"><p><b>Cas1 — marqueurs</b> Des lymphoblastes B expriment CD19/CD22 et une faible <button class="w" data-k="c95-cytometrie">MPO</button> uniforme, sous le repère de lignée, sans profil monocytaire. Quelle conclusion est correcte ?</p><button data-ok="1">A. Ne pas conclure à une LAPM sur la seule faible myéloperoxydase ; intégrer le panel et les contrôles.</button><button data-ok="0">B. Toute myéloperoxydase détectable impose une LAPM B/myéloïde.</button><button data-ok="0">C. La moitié des blastes doivent obligatoirement exprimer myéloperoxydase pour toute classification.</button><p class="fb" hidden>Réponse A. Intensité, configuration et contexte comptent. Le50 % OMS est une intensité relative au contrôle normal, pas un pourcentage universel de blastes positifs. La figure 6 originale illustre une LLA-B à <button class="w" data-k="c95-cytometrie">MPO</button> faible aberrante.</p></div><div class="quiz ui"><p><b>Cas2 — génétique</b> Une leucémie blastique de phénotype mixte porte <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button>. Que faut-il encore examiner ?</p><button data-ok="1">A. Le contexte d’une LMC en phase blastique, avec histoire et bilan intégré.</button><button data-ok="0">B. Rien : la fusion observée prouve toujours une LAPM de novo.</button><button data-ok="0">C. Uniquement le code de facturation.</button><p class="fb" hidden>Réponse A. La même fusion existe dans plusieurs contextes. Elle peut être une cible thérapeutique sans suffire à définir l’entité. Le diagnostic intégré précède l’application d’une stratégie propre à la maladie.</p></div><div class="quiz ui"><p><b>Cas3 — urgence</b> Un patient avec48 G/L de leucocytes blastiques présente dyspnée hypoxémique et confusion. Quelle conduite de raisonnement est correcte ?</p><button data-ok="1">A. Évaluation urgente de leucostase et des autres causes, sans attendre100 G/L.</button><button data-ok="0">B. Exclure la leucostase car les leucocytes sont sous 100 G/L.</button><button data-ok="0">C. Attendre la fin du séquençage avant toute prise en charge.</button><p class="fb" hidden>Réponse A. La leucostase est clinique et peut survenir sans hyperleucocytose extrême. Infection, hémorragie et cause métabolique restent à rechercher. Soins urgents et caractérisation se conduisent en parallèle.</p></div><div class="quiz ui"><p><b>Cas4 — réponse</b> Une moelle contient3 % de blastes et une MRD est détectée à 0,02 % par une méthode appropriée. Quelle affirmation est correcte ?</p><button data-ok="1">A. Morphologie et MRD décrivent des niveaux différents ; vérifier aussi les autres critères de réponse.</button><button data-ok="0">B. Moins de 5 % prouve automatiquement la guérison.</button><button data-ok="0">C.0,02 % équivaut à 2 % et impose le même traitement dans tout protocole.</button><p class="fb" hidden>Réponse A.0,02 %=2×10⁻⁴. La décision dépend du moment, de la méthode et du protocole ; les numérations et sites extramédullaires comptent aussi dans la définition de réponse. Une MRD positive ne se code pas automatiquement comme réfractarité morphologique.</p></div><div class="quiz ui"><p><b>Cas5 — rasburicase</b> Sous rasburicase, un tube d’urate est resté à température ambiante avant analyse et le résultat est très bas. Quelle lecture est correcte ?</p><button data-ok="1">A. Suspecter une baisse ex vivo et refaire selon la préanalytique de la fiche, avec surveillance des autres paramètres.</button><button data-ok="0">B. Arrêter toute surveillance de lyse puisque l’urate est bas.</button><button data-ok="0">C. Conclure que potassium et phosphate sont nécessairement normaux.</button><p class="fb" hidden>Réponse A. La rasburicase reste active dans le tube. Tube hépariné prérefroidi, glace, centrifugation à 4°C et dosage dans les 4 heures limitent cet artefact. Le traitement de l’urate ne corrige pas directement toutes les perturbations de lyse.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a>.</p></div><button class="pareto-btn ui" data-k="pareto-c95-examens">▲ Loi de Pareto — synthèse</button></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="c95-tab-semio" role="tab" aria-selected="true" aria-controls="c95-s-semio" data-s="c95-s-semio">Sémiologie fondamentale et analytique</button><button id="c95-tab-anat" role="tab" aria-selected="false" aria-controls="c95-s-anat" data-s="c95-s-anat">Anatomie</button><button id="c95-tab-histo" role="tab" aria-selected="false" aria-controls="c95-s-histo" data-s="c95-s-histo">Histologie et cytométrie</button><button id="c95-tab-physio" role="tab" aria-selected="false" aria-controls="c95-s-physio" data-s="c95-s-physio">Physiologie</button><button id="c95-tab-bio" role="tab" aria-selected="false" aria-controls="c95-s-bio" data-s="c95-s-bio">Biochimie</button><button id="c95-tab-gen" role="tab" aria-selected="false" aria-controls="c95-s-gen" data-s="c95-s-gen">Génétique</button></div><div class="chap-body sci-body"><div class="sci" id="c95-s-semio" role="tabpanel" aria-labelledby="c95-tab-semio"><section class="ilot" id="c95-s-semio-cours"><h2>Comment une lignée ambiguë produit-elle des signes observables ?</h2><p>La sémiologie analytique relie une fonction normale, sa perturbation, un signe et une décision. Elle évite deux raccourcis : déduire une lignée d’un symptôme et déduire l’absence de danger d’un chiffre isolé. Les neuf étapes suivantes complètent l’examen clinique de la monographie.</p><section class="ilot" id="c95-semio-normal" data-semiology="normal"><h3>1. Fonctions normales et réserves</h3>
<p>La moelle renouvelle des cellules aux fonctions différentes. Les érythrocytes transportent l’oxygène grâce à l’hémoglobine ; les neutrophiles répondent rapidement à des agressions infectieuses ; les plaquettes issues des mégacaryocytes participent à l’obturation initiale d’une brèche vasculaire. La coagulation stabilise ensuite le clou plaquettaire par un réseau de fibrine.</p>
<p>Le nombre, la maturation et la fonction ne sont pas identiques. Une numération leucocytaire élevée peut être composée de cellules immatures malignes, tandis que le contingent utile de neutrophiles est insuffisant. De même, une saturation normale indique la proportion d’hémoglobine oxygénée, sans donner la quantité totale d’hémoglobine disponible.</p>
<p>La réponse à un défaut de production dépend de la réserve et de la vitesse d’installation. Une baisse rapide d’hémoglobine peut être mal tolérée avant qu’une adaptation ne se produise. Les maladies cardiorespiratoires modifient la tolérance ; le même résultat biologique n’impose donc pas la même lecture clinique chez tous les patients.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S321] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S330] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S331] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S332] 18.5 Hemostasis  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a>.</p></div></section><figure id="c95-figure-semio-moelle" data-origin="human-original"><img src="assets/img/c95/alpha/codex/normal-marrow-openstax2016.jpg" alt="Photographie originale d’une coupe osseuse avec tissu spongieux et moelle rouge" loading="lazy" width="854" height="791"><figcaption><b>Os spongieux et moelle : situer la production sanguine.</b> <b>Au centre :</b> les espaces entre les travées sont occupés par la moelle, visible ici en rouge. <b>À la périphérie :</b> le tissu osseux délimite la pièce. Cette photographie macroscopique montre un site de tissu médullaire ; elle ne permet ni de compter les blastes ni d’attribuer leur lignée. La barre blanche est conservée mais aucune mesure n’en est déduite, sa valeur n’étant pas donnée sur ce fichier. Original : OpenStax, Anatomy and Physiology, édition 8.25 du 18 mai 2016, fichier2205 Bone Marrow, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels et repères d’origine conservés ; légende française explicative ajoutée.</figcaption></figure><section class="ilot" id="c95-semio-mecanisme" data-semiology="mecanisme"><h3>2. Perturbation : production insuffisante et infiltration</h3>
<p>L’accumulation de cellules leucémiques perturbe l’hématopoïèse normale. Les cytopénies peuvent toucher une ou plusieurs lignées et coexister avec une hyperleucocytose blastique. L’infiltration d’organes, les interactions microvasculaires, l’infection et les perturbations métaboliques ajoutent d’autres mécanismes.</p>
<p>Une douleur osseuse peut accompagner une atteinte médullaire ; une organomégalie évoque une infiltration sans la prouver ; une fièvre peut être infectieuse ou liée à d’autres mécanismes. Le raisonnement ne consiste pas à attribuer tous les signes à une seule cause dès que le mot leucémie apparaît.</p>
<p>La LALA ajoute une difficulté de classification, mais ne crée pas un syndrome clinique spécifique permettant d’identifier B/myéloïde ou T/myéloïde au lit du malade. Le laboratoire caractérise les cellules ; l’examen clinique mesure le retentissement et la priorité des soins. Ces deux analyses se complètent.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div></section><section class="ilot" id="c95-semio-symptomes" data-semiology="symptomes"><h3>3. Symptômes : décrire la plainte et sa chronologie</h3>
<p>Pour la fatigue, préciser début, progression, effort déclenchant, dyspnée, douleur thoracique, vertiges et perte d’autonomie. Pour la fièvre, rechercher frissons, prises médicamenteuses, douleur buccale, toux, symptômes urinaires et date d’un éventuel traitement cytotoxique. L’absence d’un foyer évident ne rassure pas en neutropénie.</p>
<p>Un saignement se décrit par site, abondance, caractère spontané, répétition et tolérance. Épistaxis, gingivorragies, pétéchies et règles abondantes orientent vers une anomalie de l’hémostase primaire, sans exclure une coagulopathie associée. Céphalée nouvelle ou déficit focal imposent une évaluation urgente.</p>
<p>Rechercher les traitements antérieurs, l’exposition à un médicament ciblant CD19, l’histoire d’hémopathie et les résultats initiaux. Ces informations peuvent modifier la classification d’une rechute. Les préférences, l’entourage et l’accès au centre participent ensuite au plan de soins, sans remplacer la stabilisation immédiate.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S320] Prise en chargede la neutropénie fébrile</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div></section><section class="ilot" id="c95-semio-signes" data-semiology="signes"><h3>4. Signes physiques : constater sans surinterpréter</h3>
<p>Pâleur, tachycardie et dyspnée sont compatibles avec une anémie, mais la tachycardie peut aussi être liée à fièvre, douleur, déshydratation ou autre cause. Le purpura suggère une extravasation sanguine ; sa présence ne donne pas le nombre de plaquettes et n’établit pas seule une CIVD.</p>
<p>Palper ganglions, foie et rate, examiner peau et muqueuses, rechercher foyer infectieux et signe neurologique. Une masse médiastinale exige une exploration adaptée si la clinique l’évoque. L’absence d’adénopathie ou d’organomégalie n’exclut pas une leucémie aiguë.</p>
<p>Noter état de conscience, fréquence respiratoire, saturation, pression, pouls, température et perfusion. Une réévaluation répétée peut montrer une aggravation avant le retour des analyses spécialisées. Les sources étudiées ne donnent pas de sensibilité/spécificité validée de ces signes pour reconnaître spécifiquement une LAPM.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S320] Prise en chargede la neutropénie fébrile</a>.</p></div></section><section class="ilot" id="c95-semio-syndromes" data-semiology="syndromes"><h3>5. Regrouper les syndromes sans les confondre</h3>
<p>Le syndrome d’insuffisance médullaire regroupe les conséquences des cytopénies. Un syndrome tumoral décrit les infiltrations ou masses. Une leucostase est un syndrome de retentissement microvasculaire ; une lyse tumorale est un ensemble de perturbations métaboliques. Ils peuvent coexister et demander des réponses différentes.</p>
<p>Une personne présentant leucocytes48 G/L, hypoxémie et confusion peut avoir une leucostase, une infection, une hémorragie ou une cause métabolique. Le chiffre inférieur à 100 G/L n’exclut pas la première hypothèse. Inversement, une hyperleucocytose sans manifestation ne démontre pas à elle seule la leucostase.</p>
<p>La suspicion de LAP avec coagulopathie constitue une filière particulière : traiter l’urgence et rechercher PML::RARA en parallèle. Le fait que la lignée finale ne soit pas encore connue ne justifie ni attente passive ni traitement identique pour toutes les leucémies.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S329] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a>.</p></div></section><section class="ilot" id="c95-semio-examens" data-semiology="examens"><h3>6. Transformer une hypothèse en examen utile</h3>
<p>Une numération avec différentiel quantifie les lignées circulantes ; le frottis décrit les cellules ; la moelle permet une analyse plus complète du compartiment de production. La cytométrie attribue des profils, et la génétique précise les catégories et cibles. Chaque examen répond à une question différente.</p>
<p>Devant un saignement, compléter la numération par la coagulation selon le contexte. Devant une menace métabolique, suivre urate, potassium, phosphate, calcium, créatinine et diurèse. Sous rasburicase, respecter la préanalytique du dosage d’urate ; un prélèvement non refroidi peut produire un résultat faussement bas.</p>
<p>Le laboratoire doit connaître la suspicion et l’urgence pour organiser les tests rapides. Le panel étendu n’est pas une raison de retarder l’antibiothérapie ou le traitement d’une LAP suspectée. Une ponction lombaire se programme en tenant compte du risque hémorragique et de la situation clinique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S320] Prise en chargede la neutropénie fébrile</a>.</p></div></section><section class="ilot" id="c95-semio-interpretation" data-semiology="interpretation"><h3>7. Interpréter : unité, méthode et dénominateur</h3>
<p>Le pourcentage de blastes porte sur un ensemble de cellules défini. L’intensité de <button class="w" data-k="c95-cytometrie">MPO</button> est un signal relatif comparé à des neutrophiles normaux. Le seuil OMS «50 %» de cette intensité ne signifie donc pas que 50 % des blastes doivent être positifs. Confondre ces deux mesures peut créer une fausse lignée.</p>
<p>La MRD à 0,01 % correspond à 10<sup>−4</sup>. Un résultat négatif n’est interprétable que si la sensibilité et la qualité de l’échantillon sont suffisantes. Une RC morphologique sous 5 % de blastes n’exclut pas une population résiduelle détectable à une échelle bien plus fine.</p>
<p>Enfin, les intervalles d’un laboratoire, les critères diagnostiques et les seuils d’intervention sont trois objets différents. Les repères adultes HUG 2019 servent à comprendre les unités ; ils ne constituent ni normes nationales 2026 ni seuils transfusionnels universels.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S323] HUG, enseignement hémogramme adulte, septembre 2019</a>.</p></div></section><section class="ilot" id="c95-semio-gravite" data-semiology="gravite"><h3>8. Gravité : la priorité peut précéder le nom final</h3>
<p>Instabilité hémodynamique, détresse respiratoire, déficit neurologique, hémorragie importante ou perturbation métabolique grave justifient une prise en charge immédiate. L’équipe peut commencer soins de support et investigations en parallèle. Le diagnostic intégré affine ensuite la stratégie antileucémique.</p>
<p>Une fièvre après chimiothérapie avec neutropénie possible demande une évaluation urgente ; les signes locaux peuvent manquer. La revue suisse insiste sur une antibiothérapie rapide, avec choix actuel adapté aux résistances et au protocole local. La source 2016 ne sert pas ici à figer une molécule en 2026.</p>
<p>Le traitement lui-même crée des risques : syndrome de différenciation sous ATRA, occlusion sous ponatinib, hémolyse sous rasburicase chez une personne prédisposée, ou lyse après une thérapie efficace. Les consignes de surveillance doivent donc évoluer avec le traitement reçu.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S320] Prise en chargede la neutropénie fébrile</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S329] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680630970053" target="_blank" rel="noopener">[S314] FI suisse Iclusig</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S319] FI suisse Venclyxto</a>.</p></div></section><section class="ilot" id="c95-semio-synthese" data-semiology="synthese"><h3>9. Synthèse analytique et transmission</h3>
<p>Une transmission utile commence par l’état du patient, les syndromes menaçants, les résultats discriminants et ce qui reste attendu. Par exemple : « suspicion de leucémie aiguë, saignement et thrombopénie, stabilité actuelle documentée, coagulation et caractérisation en cours, centre prévenu ». Elle ne remplace pas une incertitude par un diagnostic trop précis.</p>
<p>Après le bilan, préciser le type de LALA, les critères de lignée, la génétique et la stratégie de réponse/MRD. Le parcours prévoit les étapes de consolidation, les soins de support et les contacts d’urgence. À chaque réévaluation, relier un changement de résultat à une décision réelle.</p>
<p>La qualité du raisonnement se voit dans les limites conservées : absence de signes n’exclut pas la maladie, nombre élevé ne garantit pas la fonction, marqueur positif ne définit pas seul une lignée, et résultat négatif ne signifie pas absence absolue. Ces distinctions rendent l’information utile au patient et à l’équipe.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S326] CIMS, PROFILES 2017, SSP</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Relier fatigue, infection et saignement aux fonctions atteintes, puis rechercher les urgences.</p><p><b>Science → examen.</b> Chaque examen répond à une question ; une intensité n’est pas un pourcentage de cellules.</p><p><b>Science → traitement.</b> Soins urgents et caractérisation avancent en parallèle, avec réévaluation.</p><p><b>À retenir.</b> Un signe oriente et mesure la gravité ; il ne définit pas une lignée.</p></div><button class="pareto-btn ui" data-k="pareto-c95-semio">▲ Loi de Pareto — Sémiologie fondamentale et analytique</button></section></div><div class="sci" id="c95-s-anat" role="tabpanel" aria-labelledby="c95-tab-anat" hidden><section class="ilot" id="c95-s-anat-cours"><h2>Moelle, sang et sites d’infiltration</h2>
<h3>Le compartiment normal</h3>
<p>La moelle rouge se situe dans les espaces du tissu osseux spongieux et contient les cellules hématopoïétiques avec leur environnement de soutien. Chez l’adulte, la répartition de la moelle active diffère de celle du jeune enfant ; le sang circulant n’en est qu’une sortie, pas une reproduction complète du contenu médullaire. Une anomalie de production peut donc être importante sans nombreux blastes dans le sang.</p>
<p>Les cellules souches et progéniteurs se différencient dans ce compartiment. Les lymphocytes T poursuivent une maturation thymique, tandis que les cellules B se développent initialement dans la moelle puis participent aux réponses dans les tissus lymphoïdes. Les cellules circulantes peuvent gagner d’autres territoires ; sang, moelle, ganglion et liquide cérébrospinal répondent ainsi à des questions anatomiques distinctes.</p>
<figure id="c95-figure-moelle-science" data-origin="human-original"><img src="assets/img/c95/alpha/codex/normal-marrow-openstax2016.jpg" alt="Photographie originale d’une coupe osseuse avec tissu spongieux et moelle rouge" loading="lazy" width="854" height="791"><figcaption><b>Os spongieux et moelle : situer la production sanguine.</b> <b>Au centre :</b> les espaces entre les travées sont occupés par la moelle, visible ici en rouge. <b>À la périphérie :</b> le tissu osseux délimite la pièce. Cette photographie macroscopique montre un site de tissu médullaire ; elle ne permet ni de compter les blastes ni d’attribuer leur lignée. La barre blanche est conservée mais aucune mesure n’en est déduite, sa valeur n’étant pas donnée sur ce fichier. Original : OpenStax, Anatomy and Physiology, édition 8.25 du 18 mai 2016, fichier2205 Bone Marrow, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels et repères d’origine conservés ; légende française explicative ajoutée.</figcaption></figure>
<h3>De la localisation au prélèvement</h3>
<p>Une aspiration médullaire fournit des cellules dispersées, utiles pour morphologie, cytométrie et génétique. La biopsie conserve une organisation tissulaire et peut aider lorsque l’aspiration est pauvre ou discordante. Ces techniques ne sont pas deux noms du même prélèvement ; le choix et leur complémentarité dépendent de la question.</p>
<p>Une infiltration ganglionnaire, splénique, cutanée ou du système nerveux peut accompagner une leucémie aiguë. Le site ne détermine pas automatiquement la lignée et une masse ne constitue pas un stade tumeur–ganglions–métastases de LALA. L’exploration neurologique se décide avec le protocole et la sécurité procédurale ; une ponction lombaire ne doit pas être banalisée chez une personne à risque hémorragique.</p>
<h3>Ce que l’image permet de comprendre</h3>
<p>La photographie montre de la moelle dans un support osseux. Elle permet de situer le tissu, sans identifier une cellule leucémique, mesurer une infiltration ni déduire un nombre de blastes. La barre de l’original est conservée sans conversion métrique, faute de valeur d’échelle fournie sur ce fichier. Cette limite distingue une illustration anatomique d’un examen diagnostique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S321] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S331] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S322] File: 2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a>.</p></div><div class="key"><p><b>Science → clinique.</b> Moelle, sang et organes infiltrés peuvent donner des manifestations différentes.</p><p><b>Science → examen.</b> Aspiration, biopsie et liquide cérébrospinal ne répondent pas à la même question.</p><p><b>Science → traitement.</b> Le site et le risque procédural modifient le parcours, pas le code seul.</p><p><b>À retenir.</b> Une photographie de moelle situe le tissu ; elle ne compte pas les blastes.</p></div><button class="pareto-btn ui" data-k="pareto-c95-anat">▲ Loi de Pareto — Anatomie</button></section></div><div class="sci" id="c95-s-histo" role="tabpanel" aria-labelledby="c95-tab-histo" hidden><section class="ilot" id="c95-s-histo-cours"><h2>Morphologie et cytométrie : deux langages complémentaires</h2>
<h3>Reconnaître maturation et population</h3>
<p>Le frottis permet d’apprécier taille, rapport nucléocytoplasmique, chromatine, nucléoles, granulations et éventuelles inclusions. Ces indices suggèrent une immaturité ou une différenciation, mais une morphologie semblable peut recouvrir des maladies différentes. Le diagnostic LALA exige une confrontation avec immunophénotype et génétique.</p>
<p>La cytométrie mesure des signaux sur des cellules sélectionnées. Les marqueurs de surface et intracellulaires demandent des méthodes adaptées ; les contrôles normaux servent à comparer les intensités. CD34 ou TdT renseignent l’immaturité, tandis que les combinaisons CD19/CD10/CD22/<button class="w" data-k="c95-crit-b">CD79a</button>, <button class="w" data-k="c95-crit-t">CD3</button> spécifique et <button class="w" data-k="c95-cytometrie">MPO</button>/différenciation monocytaire contribuent à attribuer une lignée dans le cadre OMS.</p>
<figure id="c95-figure-mpal-science" data-origin="human-original"><img src="assets/img/c95/alpha/codex/flow-g003.png" alt="Cytométrie originale : blastes B myéloïdes en rouge, cellules B matures en bleu et neutrophiles en vert" loading="lazy"><figcaption><b>Une population remplit les critères B et myéloïdes.</b> <b>Rouge :</b> population blastique biphénotypique ; les panneaux montrent notamment CD19, CD10, CD22 et <button class="w" data-k="c95-crit-b">CD79a</button>. <b>Bleu :</b> cellules B matures servant de comparaison. <b>Vert :</b> neutrophiles. <b>Panneau de droite :</b> une partie du nuage rouge dépasse le repère de <button class="w" data-k="c95-cytometrie">MPO</button> du laboratoire ; ce cas publié satisfait les critères B/myéloïdes et porte une fusion P2RY8::CRLF2. Le trait rose matérialise une intensité, pas 50 % de cellules positives. Les axes/logarithmes et contrôles restent ceux de l’original ; on ne recalcule pas le seuil à partir des pixels. Original : Fuda et Chen, Cancers 2025; 17: 871, figure 3, <a href="https://doi.org/10.3390/cancers17050871" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels et repères d’origine conservés ; légende française explicative ajoutée.</figcaption></figure>
<h3>Pourquoi un signal positif peut être insuffisant</h3>
<p>Une <button class="w" data-k="c95-cytometrie">MPO</button> faible uniforme sur une LLA-B ne démontre pas une seconde lignée. Le profil de maturation, les intensités et la présence d’autres marqueurs cohérents comptent. La figure 6 de la revue illustre précisément un cas classé LLA-B malgré un faible signal <button class="w" data-k="c95-cytometrie">MPO</button>. À l’inverse, la figure 3 montre une population remplissant les critères B/myéloïdes.</p>
<p>Dans une forme bilinéale, il faut démontrer que chaque population est aberrante. Une composante de lignée myéloïde distincte peut être classée selon les critères LMA appropriés même si elle n’exprime pas <button class="w" data-k="c95-cytometrie">MPO</button> ; il serait faux d’imposer le même raisonnement simplifié à toute population biphénotypique et à toute population séparée. Les divergences de taille minimale OMS/<button class="w" data-k="c95-who-icc">ICC</button> doivent rester explicites.</p>
<h3>La LAI est un résultat d’exclusion documentée</h3>
<p>Absence de <button class="w" data-k="c95-cytometrie">MPO</button> n’équivaut pas à absence de toute lignée. Le panel doit examiner les alternatives lymphoïdes, monocytaires, mégacaryocytaires, érythroïdes et dendritiques pertinentes. La figure 14 publiée montre des blastes CD34/<button class="w" data-k="c95-lai">CD117</button> sans profil définissant après ce bilan ; TdT n’y est pas fortement positive. Aucune image unique ne remplace les résultats complets du cas.</p>
<figure id="c95-figure-lai-science" data-origin="human-original"><img src="assets/img/c95/alpha/codex/flow-g014.png" alt="Cytométrie originale d’une leucémie aiguë indifférenciée, blastes CD34 CD117 sans marqueurs définissant une lignée" loading="lazy"><figcaption><b>LAI : un panel étendu, pas un marqueur manquant.</b> <b>Rouge :</b> blastes CD34+ exprimant <button class="w" data-k="c95-lai">CD117</button>, sans <button class="w" data-k="c95-cytometrie">MPO</button>, <button class="w" data-k="c95-crit-t">CD3</button> ou combinaison B définissante. <b>Vert :</b> neutrophiles ; <b>bleu :</b> cellules B ; <b>rose :</b> monocytes. Les panneaux documentent aussi l’absence de profils monocytaires, mégacaryocytaires et érythroïdes ; d’autres marqueurs négatifs figurent dans la légende de l’article. TdT n’est pas fortement exprimée dans ce cas : son absence n’exclut donc pas la LAI. La conclusion suppose la confrontation avec génétique et contexte. Original : Fuda et Chen, Cancers 2025; 17: 871, figure 14, <a href="https://doi.org/10.3390/cancers17050871" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels et repères d’origine conservés ; légende française explicative ajoutée.</figcaption></figure><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div><div class="key"><p><b>Science → clinique.</b> Des symptômes semblables peuvent recouvrir LLA, LMA ou LALA.</p><p><b>Science → examen.</b> Morphologie, intensité, panel, populations et génétique s’intègrent.</p><p><b>Science → traitement.</b> Une attribution erronée de seconde lignée peut orienter vers une stratégie inadaptée.</p><p><b>À retenir.</b> Marqueur associé, marqueur d’immaturité et marqueur définissant sont différents.</p></div><button class="pareto-btn ui" data-k="pareto-c95-histo">▲ Loi de Pareto — Histologie et cytométrie</button></section></div><div class="sci" id="c95-s-physio" role="tabpanel" aria-labelledby="c95-tab-physio" hidden><section class="ilot" id="c95-s-physio-cours"><h2>Production, fonction et insuffisance médullaire</h2>
<h3>Régulation et maturation normales</h3>
<p>L’hématopoïèse associe renouvellement, engagement de lignée, maturation et élimination des cellules vieillies. Les besoins de l’organisme modulent la production par des signaux, dont l’érythropoïétine pour la lignée rouge. La réponse dépend cependant d’une moelle capable de produire et de ressources suffisantes ; un signal hormonal ne garantit pas une compensation efficace dans une moelle malade.</p>
<p>Le réticulocyte est une cellule rouge récemment libérée, encore porteuse de matériel résiduel. Sa mesure contribue à distinguer une production insuffisante d’une réponse régénérative dans le contexte d’une anémie. Elle ne diagnostique pas une leucémie à elle seule. L’hémoglobine porte l’oxygène ; la saturation mesure la fraction de sites occupés, et non le stock total de transport.</p>
<h3>Défense et hémostase</h3>
<p>Les neutrophiles migrent vers des signaux inflammatoires et participent à la phagocytose et à la destruction microbienne. Les lymphocytes B et T ont des fonctions immunitaires distinctes. Les blastes peuvent exprimer certains marqueurs de ces lignées sans avoir la fonction d’une cellule mature. Une hyperleucocytose blastique peut donc coexister avec une défense insuffisante.</p>
<p>Les plaquettes sont des fragments de mégacaryocytes. Leur adhésion et leur activation construisent un clou initial, renforcé par la fibrine. Une thrombopénie compromet cette première réponse, tandis qu’une coagulopathie peut altérer la stabilisation. Les mécanismes se superposent parfois, ce qui explique pourquoi numération plaquettaire et bilan de coagulation répondent à des questions complémentaires.</p>
<figure id="c95-physio-causal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 465" role="img" aria-label="Une même moelle, plusieurs fonctions en défaut"><title>Une même moelle, plusieurs fonctions en défaut</title><rect x="20" y="20" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="53" text-anchor="middle" font-size="18" fill="#17365d">Production normale perturbée par la maladie</text><text x="340" y="92" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="95" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="128" text-anchor="middle" font-size="18" fill="#17365d">Érythrocytes, neutrophiles ou plaquettes insuffisants</text><text x="340" y="167" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="170" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="203" text-anchor="middle" font-size="18" fill="#17365d">Transport O₂, défense ou hémostase compromis</text><text x="340" y="242" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="245" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="278" text-anchor="middle" font-size="18" fill="#17365d">Tolérance clinique + bilan de chaque lignée</text><text x="340" y="317" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="320" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="353" text-anchor="middle" font-size="18" fill="#17365d">Soins de support et traitement causal adaptés</text></svg><figcaption><b>Une même moelle, plusieurs fonctions en défaut.</b> Les trois fonctions ne chutent pas toujours avec la même intensité ; la numération leucocytaire totale ne mesure pas la défense immunitaire. Diagramme causal pédagogique non anatomique ; les sources de la section en précisent les limites.</figcaption></figure>
<h3>Le lien thérapeutique</h3>
<p>Traiter la maladie vise à restaurer une hématopoïèse utile, mais l’induction peut temporairement aggraver les cytopénies. Le soutien transfusionnel, la prévention infectieuse et la surveillance s’inscrivent donc dans le même parcours. Une récupération des numérations ne prouve pas seule l’absence de MRD ; la réponse doit être mesurée à plusieurs niveaux.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S321] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S330] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S331] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S332] 18.5 Hemostasis  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a>.</p></div><div class="key"><p><b>Science → clinique.</b> Hyperleucocytose blastique et défense anti-infectieuse insuffisante peuvent coexister.</p><p><b>Science → examen.</b> Différentiel, réticulocytes, plaquettes et coagulation examinent des fonctions distinctes.</p><p><b>Science → traitement.</b> Soutenir les fonctions pendant le traitement et mesurer leur récupération.</p><p><b>À retenir.</b> Nombre, maturation et fonction ne sont pas synonymes.</p></div><button class="pareto-btn ui" data-k="pareto-c95-physio">▲ Loi de Pareto — Physiologie</button></section></div><div class="sci" id="c95-s-bio" role="tabpanel" aria-labelledby="c95-tab-bio" hidden><section class="ilot" id="c95-s-bio-cours"><h2>Signal enzymatique, lyse et oxydation</h2>
<h3><button class="w" data-k="c95-cytometrie">MPO</button> : fonction et lecture analytique</h3>
<p>La myéloperoxydase appartient au programme enzymatique de certaines cellules myéloïdes. En diagnostic, sa détection est un marqueur de différenciation ; l’intensité mesurée dépend de la méthode et des contrôles. Le seuil OMS relatif ne mesure ni l’activité antimicrobienne effective du blaste ni la proportion de cellules capables de défendre l’organisme.</p>
<p>Une expression faible peut être aberrante dans une LLA-B. La lecture doit conserver le profil global et les autres marqueurs, au lieu de traiter chaque signal comme une valeur binaire. Le laboratoire décide si le critère de lignée est rempli dans la classification annoncée.</p>
<h3>Catabolisme des acides nucléiques et urate</h3>
<p>Une destruction cellulaire importante libère des composants intracellulaires. Le catabolisme des purines contribue à la charge en acide urique, tandis que potassium et phosphate ont leurs propres conséquences. La fonction rénale conditionne l’élimination et peut être aggravée par ces perturbations ; la prévention exige une vision métabolique globale.</p>
<p>La rasburicase catalyse la conversion de l’urate en allantoïne plus soluble. Cette réaction produit aussi du peroxyde d’hydrogène, ce qui explique le risque oxydatif en déficit en <button class="w" data-k="c95-d-rasburicase">G6PD</button>. La méthémoglobine ne transporte pas l’oxygène de la même manière que l’hémoglobine fonctionnelle ; une complication oxydative impose une évaluation urgente et l’arrêt selon la fiche.</p>
<figure id="c95-bio-causal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 465" role="img" aria-label="Une enzyme agit aussi après le prélèvement"><title>Une enzyme agit aussi après le prélèvement</title><rect x="20" y="20" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="53" text-anchor="middle" font-size="18" fill="#17365d">Rasburicase présente dans le sang prélevé</text><text x="340" y="92" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="95" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="128" text-anchor="middle" font-size="18" fill="#17365d">Dégradation de l’urate poursuivie dans le tube</text><text x="340" y="167" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="170" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="203" text-anchor="middle" font-size="18" fill="#17365d">Sans préanalytique adaptée : urate faussement bas</text><text x="340" y="242" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="245" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="278" text-anchor="middle" font-size="18" fill="#17365d">Tube prérefroidi, glace, centrifugation à 4 °C</text><text x="340" y="317" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="320" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="353" text-anchor="middle" font-size="18" fill="#17365d">Dosage dans les 4 heures selon fiche suisse</text></svg><figcaption><b>Une enzyme agit aussi après le prélèvement.</b> Le refroidissement concerne la qualité de la mesure ; il ne remplace pas la surveillance des autres paramètres de lyse. Diagramme causal pédagogique non anatomique ; les sources de la section en précisent les limites.</figcaption></figure>
<h3>Unités et décision</h3>
<p>Une dose enmg/kg ne se confond pas avec une concentration enmg/mL ni une dose enmg/m². Le calcul doit préciser masse corporelle ou surface, puis préparation et durée de perfusion. De même, 0,01 % et10<sup>−4</sup> décrivent la même proportion, tandis que 0,1 % est dix fois plus élevé. Une erreur d’unité peut faire franchir artificiellement un seuil diagnostique ou thérapeutique.</p>
<p>La LDH peut augmenter avec renouvellement cellulaire ou lésion tissulaire ; elle n’est ni une preuve de LAPM ni une mesure directe de MRD. Son interprétation complète le bilan plutôt qu’elle ne remplace une analyse cellulaire. Le mécanisme biologique explique une mesure, mais ne suffit pas à lui donner une spécificité qu’elle n’a pas.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a>.</p></div><div class="key"><p><b>Science → clinique.</b> Lyse et toxicité oxydative peuvent altérer rapidement les organes.</p><p><b>Science → examen.</b> Préanalytique de l’urate, unités et autres électrolytes conditionnent l’interprétation.</p><p><b>Science → traitement.</b> Rasburicase traite l’urate, avec contre-indications ; elle ne corrige pas tous les composants de lyse.</p><p><b>À retenir.</b> Une mesure techniquement fausse peut masquer une urgence.</p></div><button class="pareto-btn ui" data-k="pareto-c95-bio">▲ Loi de Pareto — Biochimie</button></section></div><div class="sci" id="c95-s-gen" role="tabpanel" aria-labelledby="c95-tab-gen" hidden><section class="ilot" id="c95-s-gen-cours"><h2>Génome, programme de lignée et évolution clonale</h2>
<h3>Trois niveaux à distinguer</h3>
<p>Une anomalie constitutionnelle concerne la personne au-delà du clone tumoral ; une anomalie somatique est acquise dans une population cellulaire ; une anomalie clonale est partagée par des cellules apparentées. Un panel tumoral ne suffit pas à prouver une prédisposition familiale. Une question germinale demande une démarche spécifique et un prélèvement approprié.</p>
<p>Le caryotype explore des anomalies chromosomiques visibles à son niveau de résolution. Une FISH répond à une cible définie. Les analyses moléculaires recherchent des séquences, variants ou fusions selon leur conception. Un résultat négatif n’exclut pas une anomalie que le test ne couvre pas, et un caryotype normal n’est pas un génome sans altération.</p>
<h3>Les anomalies qui organisent le raisonnement LALA</h3>
<p><button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> produit une kinase de fusion et peut constituer une cible d’ITK ; il impose aussi le diagnostic différentiel de LMC blastique. <button class="w" data-k="c95-kmt2a">KMT2A</button> et ZNF384 réarrangés sont associés à des groupes biologiques particuliers. BCL11B peut être activé par une réorganisation régulatrice ; cela illustre l’importance des programmes d’expression, au-delà du simple changement de séquence codante.</p>
<p>Les mutations liées à la myélodysplasie et les antécédents peuvent conduire vers une LMA, mais les frontières et listes diffèrent entre OMS et <button class="w" data-k="c95-who-icc">ICC</button>. RUNX1 est un exemple de divergence. Une anomalie cytogénétique quelconque ne signifie pas caryotype complexe ; la fréquence élevée d’anomalies dans une série n’autorise pas cette substitution.</p>
<figure id="c95-gen-causal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 465" role="img" aria-label="Un clone peut présenter plusieurs programmes"><title>Un clone peut présenter plusieurs programmes</title><rect x="20" y="20" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="53" text-anchor="middle" font-size="18" fill="#17365d">Anomalies fondatrices dans un progéniteur</text><text x="340" y="92" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="95" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="128" text-anchor="middle" font-size="18" fill="#17365d">Programmes de différenciation variables</text><text x="340" y="167" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="170" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="203" text-anchor="middle" font-size="18" fill="#17365d">Populations phénotypiques parfois différentes</text><text x="340" y="242" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="245" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="278" text-anchor="middle" font-size="18" fill="#17365d">Sélection et évolution possibles sous traitement</text><text x="340" y="317" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="320" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="353" text-anchor="middle" font-size="18" fill="#17365d">Rechute : recontrôler phénotype et parenté clonale</text></svg><figcaption><b>Un clone peut présenter plusieurs programmes.</b> Modèle explicatif issu des revues ; il ne prouve pas le mécanisme de chaque cas ni un risque chiffré universel. Diagramme causal pédagogique non anatomique ; les sources de la section en précisent les limites.</figcaption></figure>
<h3>Pourquoi la génétique aide au suivi</h3>
<p>Une cible moléculaire informative peut suivre le clone même si certains marqueurs de surface changent. Elle doit néanmoins rester liée à la maladie réellement mesurée, à la qualité du prélèvement et à la sensibilité. La discordance entre morphologie, cytométrie et génétique impose une interprétation intégrée.</p>
<p>Une cible ne donne pas automatiquement une indication de traitement : mutation sensible, contexte clinique, données d’efficacité, autorisation suisse et interactions comptent aussi. La génétique permet de poser une meilleure question thérapeutique ; elle ne dispense pas d’en vérifier la réponse clinique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2025.1715087/full" target="_blank" rel="noopener">[S306] Frontiers | Mixed phenotype acute leukemia, the dissection of an enigmatic disease in the era of novel therapies</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">[S313] FI suisse Glivec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680630970053" target="_blank" rel="noopener">[S314] FI suisse Iclusig</a>.</p></div><div class="key"><p><b>Science → clinique.</b> Plasticité et évolution clonale expliquent certaines rechutes au phénotype différent.</p><p><b>Science → examen.</b> Confronter couverture du test, contexte, cible et classification.</p><p><b>Science → traitement.</b> Une kinase de fusion peut être ciblée après vérification clinique et réglementaire.</p><p><b>À retenir.</b> Somatique, constitutionnel et clonal répondent à trois questions différentes.</p></div><button class="pareto-btn ui" data-k="pareto-c95-gen">▲ Loi de Pareto — Génétique</button></section></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="c95-p-1"><h2><span class="n">p-1</span> Mécanisme, indication et protocole</h2>
<p>Une cible moléculaire explique un mécanisme ; une étude renseigne l’effet observé dans sa population ; la fiche professionnelle définit les indications et précautions autorisées ; le protocole rassemble les médicaments, doses, calendrier et soins de support. Ces quatre niveaux doivent être lus ensemble. Une LAPM n’autorise pas à assembler librement une induction de LLA et une induction de LMA.</p>
<table class="t"><thead><tr><th>Classe / produit</th><th>Mécanisme utile</th><th>Place et limite</th></tr></thead><tbody><tr><td>Imatinib — Glivec</td><td>Inhibition de kinases dont <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button>.</td><td>Fiche suisse LLA Ph+ ; discuter son usage dans LAPM Ph+ au centre.</td></tr><tr><td>Ponatinib — Iclusig</td><td>Inhibition de <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button>, y compris T315I.</td><td>LLA Ph+ adulte avec mutation T315I, ou pour laquelle les autres inhibiteurs de la tyrosine kinase c-abl ne sont pas appropriés.</td></tr><tr><td>Rasburicase — Fasturtec</td><td>Transformation enzymatique de l’urate en allantoïne.</td><td>Prévention/traitement de l’hyperuricémie aiguë à risque rénal lors de l’instauration de chimiothérapie ; indication incluant leucémie aiguë.</td></tr><tr><td>Hydroxycarbamide — Litalir</td><td>Inhibition de la ribonucléotide réductase et de la synthèse d’ADN.</td><td>Fiche suisse LMC et autres syndromes myéloprolifératifs ; cytoréduction aiguë discutée dans recommandations, portée distincte.</td></tr><tr><td>Trétinoïne — Vesanoid / ATRA</td><td>Action rétinoïde favorisant la différenciation dans la LAP.</td><td>Urgence sur suspicion de LAP ; pas traitement empirique de toute C95.</td></tr><tr><td>Blinatumomab — Blincyto</td><td>Engagement des lymphocytes T contre cellules portant CD19.</td><td>Indications LLA-B selon statut et phase ; données LAPM limitées, pas indication nommée.</td></tr><tr><td>Vénétoclax — Venclyxto</td><td>Inhibition de BCL-2, favorisant l’apoptose.</td><td>Indications suisses LLC et certaines LMA en association ; ne définit pas un schéma LAPM validé.</td></tr></tbody></table>
<p>Les dates lues sont juillet 2026 pour Glivec, septembre 2024 pour Iclusig, août 2024 pour Fasturtec, août 2026 pour Litalir, octobre 2023 pour Vesanoid, septembre 2025 pour Blincyto et avril 2025 pour Venclyxto. Une date ancienne n’implique pas automatiquement que la fiche est invalide ; une mise à jour récente doit en revanche remplacer une dose ou une précaution mémorisée d’une ancienne version.</p>
<p>Le bilan avant traitement comprend les fonctions d’organe, les interactions, les médicaments prescrits et non prescrits, la possibilité de grossesse et les besoins de support. Le lecteur doit pouvoir expliquer pourquoi il vérifie un paramètre : créatinine pour élimination et lyse, foie pour métabolisme/toxicité, pression et risque vasculaire pour ponatinib, ou déficit en <button class="w" data-k="c95-d-rasburicase">G6PD</button> avant rasburicase.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">[S313] FI suisse Glivec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680630970053" target="_blank" rel="noopener">[S314] FI suisse Iclusig</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529580165" target="_blank" rel="noopener">[S316] FI suisse Litalir</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527750195" target="_blank" rel="noopener">[S317] FI suisse Vesanoid</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656540018" target="_blank" rel="noopener">[S318] FI suisse Blincyto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S319] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div></section>
<section class="ilot" id="c95-p-2"><h2><span class="n">p-2</span> ITK : imatinib et ponatinib</h2>
<h3>Imatinib : la dose appartient à une indication</h3>
<p>La fiche Glivec recommande600 mg/j par voie orale chez l’adulte avec LLA Ph+, en association à une chimiothérapie standard. La prise se fait avec un repas et un grand verre d’eau. Chez l’enfant et l’adolescent concernés, la dose est fondée sur la surface corporelle, 340 mg/m²/j avec maximum600 mg/j ; les règles d’arrondi et les limites d’âge suivent la fiche et le protocole pédiatrique. Ces valeurs sont des repères de la fiche LLA, pas une ordonnance individualisée de LAPM.</p>
<p>En insuffisance hépatique légère ou modérée, la dose initiale est au plus400 mg/j selon l’indication ; en insuffisance sévère, 100 mg/j est recommandé au départ, avec augmentation possible sous conditions. En insuffisance rénale ou dialyse, la fiche propose aussi au plus400 mg/j initialement et une adaptation selon tolérance/efficacité. Ces situations ne doivent pas être résumées par « aucune adaptation car faible élimination rénale ».</p>
<p>Surveiller numération, fonction hépatique, rétention hydrique et manifestations cardiaques selon le terrain. Une cytopénie peut venir de la leucémie ou du médicament : la fiche prévoit de distinguer ces mécanismes avant certaines adaptations. Les inhibiteurs ou inducteurs du CYP3A et certains substrats exposent à des interactions ; le méthotrexate à forte dose demande une vigilance particulière concernant son élimination.</p>
<h3>Ponatinib : efficacité ciblée et risque vasculaire</h3>
<p>Dans l’indication LLA Ph+ de la fiche Iclusig, la dose initiale et maximale est45 mg une fois par jour. La réduction45→15 mg lorsque <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> atteint ≤ 1 % décrite pour la LMC en phase chronique ne doit pas être appliquée automatiquement à la LLA. Une adaptation liée à toxicité ou interaction suit son propre algorithme.</p>
<p>Une insuffisance hépatique Child-Pugh A, B ou C conduit à une dose initiale recommandée de 30 mg/j avec prudence. La fiche indique qu’une clairance de créatinine estimée ≥ 50 mL/min devrait permettre l’usage sans adaptation, tout en précisant l’absence d’étude dans l’insuffisance rénale ; en dessous de 50 mL/min ou en insuffisance terminale, prudence accrue.</p>
<p>Évaluer et traiter les facteurs de risque cardiovasculaire, surveiller pression artérielle, signes d’occlusion, fonction hépatique et toxicité pancréatique. Les lipases sont surveillées toutes les deux semaines pendant les deux premiers mois puis selon la fiche et la situation. Une douleur thoracique, un déficit neurologique ou une douleur abdominale inhabituelle demande une évaluation urgente. Les interactions CYP3A peuvent imposer évitement ou réduction ; la décision n’est pas un automatisme identique pour tout co-traitement.</p>

<section class="ilot" id="c95-p-3"><h2><span class="n">p-3</span> Rasburicase : traiter l’urate sans perdre la surveillance</h2>
<p>Fasturtec contient une urate oxydase recombinante. Elle transforme l’acide urique en allantoïne plus soluble et produit du peroxyde d’hydrogène. Le mécanisme explique à la fois la baisse rapide d’urate, la contre-indication en déficit en <button class="w" data-k="c95-d-rasburicase">G6PD</button> et l’artefact possible du prélèvement sanguin.</p>
<p>La fiche suisse donne0,20 mg/kg/j par perfusion intraveineuse de 30 minutes, pour une durée guidée par l’uricémie et le jugement clinique, jusqu’à 7 jours. Aucun ajustement n’est indiqué pour insuffisance rénale ou hépatique dans cette fiche. Le calcul pondéral n’autorise pas à ignorer la concentration préparée, les règles de dilution ou la compatibilité : la préparation relève du protocole pharmaceutique.</p>
<p><b>Exemple pédagogique :</b> pour70 kg, 0,20×70=14 mg par jour selon cette dose de fiche. Ce calcul illustre l’unité mg/kg ; il ne sélectionne pas le traitement d’une personne réelle et ne transforme pas une stratégie locale de dose fixe en règle universelle. La durée ne doit pas être automatiquement portée à 7 jours si la situation n’en a pas besoin.</p>
<p>Contre-indications : déficit en <button class="w" data-k="c95-d-rasburicase">G6PD</button>, autres troubles métaboliques prédisposant à une anémie hémolytique, hypersensibilité. Le centre vérifie ces éléments avant administration selon sa procédure. Hémolyse, méthémoglobinémie ou réaction anaphylactique imposent arrêt et prise en charge urgente ; la fiche prévoit un arrêt immédiat et définitif pour ces réactions graves. Les données sur répétition des cycles sont limitées.</p>
<p>La mesure de l’urate exige un tube hépariné prérefroidi, transport et maintien sur glace, centrifugation à 4°C, puis dosage dans les 4 heures. Sans ces mesures, l’enzyme agit encore après le prélèvement et peut abaisser artificiellement le résultat. Potassium, phosphate, calcium, créatinine, diurèse et état clinique restent à suivre indépendamment.</p>

<section class="ilot" id="c95-p-4"><h2><span class="n">p-4</span> Hydroxycarbamide et ATRA : deux objectifs différents</h2>
<h3>Hydroxycarbamide : cytoréduire sous surveillance</h3>
<p>Litalir inhibe la ribonucléotide réductase, ce qui limite la disponibilité de désoxyribonucléotides nécessaires à la synthèse d’ADN. La fiche suisse nomme LMC et autres syndromes myéloprolifératifs. Sa version d’août 2026 indique, dans ce cadre, une dose initiale de 40–50 mg/kg/j puis un entretien de 10–20 mg/kg/j, selon réponse et tolérance. Ce ne sont pas des doses validées ici pour toute leucémie aiguë.</p>
<p>Onkopedia LMA discute une cytoréduction d’urgence, notamment par hydroxycarbamide, dans l’hyperleucocytose/leucostase. Ce contexte est distinct du libellé de la fiche. On ne juxtapose donc pas la dose d’un protocole LMA à l’indication suisse comme si elles provenaient du même niveau de preuve. Le centre choisit la dose, les objectifs et la fréquence de surveillance.</p>
<p>La fiche exige des contrôles hématologiques au moins hebdomadaires au début de son usage indiqué, puis adaptés ; une urgence aiguë peut nécessiter une surveillance bien plus rapprochée. La myélosuppression, les atteintes cutanées et les autres toxicités sont recherchées. Une réduction de dose doit être envisagée en insuffisance rénale, 30–60 % du produit étant éliminé inchangé par le rein. Les données hépatiques manquent : prudence et contrôles fréquents.</p>
<p>Grossesse et allaitement sont contre-indiqués. La contraception est demandée pendant le traitement puis au moins6 mois chez la femme et3 mois chez l’homme dont la partenaire est en âge de procréer. Certains systèmes de mesure continue du glucose peuvent afficher des valeurs faussement élevées sous hydroxycarbamide, avec risque de correction insulinique excessive : informer l’équipe diabétologique et suivre les instructions du dispositif.</p>
<h3>ATRA : différencier dans une LAP suspectée</h3>
<p>La trétinoïne agit dans la leucémie promyélocytaire, liée classiquement à PML::RARA. Onkopedia LAP janvier 2026 demande de commencer l’ATRA dès suspicion, sans attendre la confirmation, avec prise en charge de la coagulopathie. Cela ne dispense pas de confirmer le diagnostic ni d’ajouter le traitement de risque approprié ; une hyperleucocytose n’est pas une indication à laisser l’ATRA seul sans protocole.</p>
<p>La fiche Vesanoid comporte une dose habituelle de 45 mg/m²/j en deux prises orales et des adaptations pour situations particulières ; le cours ne transforme pas cette valeur en nombre de gélules sans surface corporelle ni protocole. Les risques de syndrome de différenciation, d’hypertension intracrânienne et les contraintes de grossesse demandent une surveillance spécialisée. ATRA n’est pas le traitement d’une LAPM simplement parce qu’elle est codée C95.</p>

<section class="ilot" id="c95-p-5"><h2><span class="n">p-5</span> Immunothérapie, apoptose et vérification du parcours</h2>
<h3>Blinatumomab : cible CD19 et complications immunitaires</h3>
<p>Le blinatumomab rapproche les lymphocytes T des cellules CD19 positives. La fiche Blincyto septembre 2025 comporte plusieurs indications de LLA-B : rechute/réfractarité selon statut Ph et traitements préalables, rémission avec MRD ≥ 0,1 %, et consolidation de LLA Ph négative CD19 positive dans les populations prévues. Il faut lire le libellé correspondant, et non additionner les indications comme une autorisation générale.</p>
<p>Dans la LAPM, les observations publiées restent plus limitées. Le statut CD19, les autres populations leucémiques et le risque d’évolution de lignée sont pertinents. Syndrome de relargage cytokinique, toxicité neurologique dont syndrome de neurotoxicité associé aux cellules effectrices immunitaires, infections et lyse imposent des procédures spécialisées. Aucun schéma posologique LAPM n’est inventé à partir de la fiche LLA.</p>
<h3>Vénétoclax : BCL-2 et risque de lyse</h3>
<p>Le vénétoclax favorise l’apoptose en inhibant BCL-2. La fiche Venclyxto avril 2025 prévoit certaines LLC et, en association à azacitidine, décitabine ou cytarabine faible dose, certaines LMA nouvellement diagnostiquées non éligibles à une chimiothérapie intensive ; la LAP est exclue de cette indication LMA. Une LAPM ne devient pas automatiquement une indication de cette association.</p>
<p>La montée de dose, les interactions et la prévention de lyse dépendent de l’indication et du partenaire. La fiche avertit de perturbations métaboliques parfois dès 6–8 heures après la première dose ou une augmentation. Les inhibiteurs puissants du CYP3A sont contre-indiqués pendant l’instauration et l’augmentation de dose dans la LLC ; on ne transforme pas cette règle spécifique en interdiction générale identique dans tous les schémas LMA. Le millepertuis est contre-indiqué.</p>
<h3>La dernière vérification est une décision documentée</h3>
<p>Avant un traitement, confirmer diagnostic, objectif, indication, dose par population, fonctions d’organe, interactions, contraception, surveillance et circuit d’urgence. Pour un usage hors indication, documenter la justification et le parcours de prise en charge financière. Cette liste explique la logique de sécurité ; elle ne remplace pas un protocole prescripteur complet.</p>
<p>Le coût du médicament, sa disponibilité et le remboursement doivent être vérifiés à la date réelle de la décision. Le cours ne donne aucun prix supposé ni garantie d’assurance. Une coordination avec pharmacie et assurance peut être nécessaire sans retarder les soins urgents indispensables.</p>

<template data-pop="c95-sources-guides" data-title="Sources, actualité et limites">
<p>La recherche associe sources suisses de codage, statistiques, pharmacologie et formation, puis recommandations européennes et travaux ciblés sur la lignée ambiguë. Onkopedia LMA est datée de septembre 2025, LLA de mars 2026 et LAP de janvier 2026. Les tables OMS 2022 et la revue cytométrique 2025 sont utilisées pour attribuer les lignées ; une revue clinique publiée en ligne le9octobre 2025 discute les limites de traitement.</p>
<p>Les lectures ne sont pas toutes équivalentes : les méthodes et résultats pertinents d’iBFM 2018 et d’EBMT 2017 ont été lus, tandis que seul le résumé public d’EBMT 2026 a été accessible. La revue suisse de neutropénie fébrile date de 2016 ; elle soutient la reconnaissance d’urgence et ne remplace pas l’antibiothérapie locale actuelle. Les statistiques OFS portent sur 2013–2017 et l’ensemble C91–C95.</p>
<p>Les sept fiches professionnelles suisses ont été consultées par produit, avec dates de mise à jour conservées. Aucune incidence suisse propre à la LAPM, aucun prix individuel et aucun remboursement garanti ne sont établis ici. Les références américaines descriptives de registre et les figures de laboratoire ne fondent pas une recommandation de traitement américaine.</p>
