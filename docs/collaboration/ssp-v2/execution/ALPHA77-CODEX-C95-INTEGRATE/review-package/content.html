<template data-pop="pareto-c95-bio" data-title="Pareto — Biochimie"><p class="ratio" data-cover="c95-s-bio-cours"></p><ul><li>La <button class="w" data-k="c95-cytometrie">MPO</button> est un signal de différenciation à interpréter ; elle ne mesure pas la défense fonctionnelle du blaste.</li><li>La lyse libère plusieurs composants ; une baisse d’urate ne corrige pas potassium et phosphate.</li><li>Rasburicase produit du peroxyde : <button class="w" data-k="c95-d-rasburicase">G6PD</button> et risque oxydatif expliquent une contre-indication.</li><li>Dose, concentration, surface corporelle et proportion doivent garder leurs unités.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a>.</p></div></template>
<template data-pop="pareto-c95-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="c95-s-gen-cours"></p><ul><li>Somatique, constitutionnel et clonal sont trois notions différentes.</li><li>Caryotype, FISH et méthodes moléculaires ont des couvertures distinctes.</li><li><button class="w" data-k="c95-bcrabl1">BCR::ABL1</button>, <button class="w" data-k="c95-kmt2a">KMT2A</button>, ZNF384 et BCL11B éclairent la biologie sans abolir le contexte.</li><li>Une cible peut aider au suivi ou au traitement, après vérification de sa pertinence et de la preuve.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2025.1715087/full" target="_blank" rel="noopener">[S306] Frontiers | Mixed phenotype acute leukemia, the dissection of an enigmatic disease in the era of novel therapies</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a>.</p></div></template>
<template data-pop="pareto-c95-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c95-p-1,c95-p-2,c95-p-3,c95-p-4,c95-p-5"></p><ul><li>Distinguer dose de fiche LLA/LMC/LMA et protocole LAPM ; ne pas fusionner les indications.</li><li>Ponatinib45→15 mg à réponse ≤ 1 % : règle LMC chronique, pas automatiquement LLA.</li><li>Litalir août 2026 : indication chronique, dose initiale40–50 mg/kg/j ; cytoréduction aiguë de portée distincte.</li><li>Rasburicase : <button class="w" data-k="c95-d-rasburicase">G6PD</button>, préanalytique, autres paramètres ; ATRA seulement filière LAP suspectée.</li><li>Blinatumomab et vénétoclax : preuve LAPM limitée, toxicités et interactions spécifiques.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">[S313] FI suisse Glivec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680630970053" target="_blank" rel="noopener">[S314] FI suisse Iclusig</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529580165" target="_blank" rel="noopener">[S316] FI suisse Litalir</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527750195" target="_blank" rel="noopener">[S317] FI suisse Vesanoid</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656540018" target="_blank" rel="noopener">[S318] FI suisse Blincyto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S319] FI suisse Venclyxto</a>.</p></div></template>
