<section class="ilot" id="c95-0"><h2><span class="n">0</span> Question clinique</h2>
<p>Un homme de 34 ans consulte pour une fatigue récente, une fièvre et des saignements gingivaux. Son hémoglobine est à 82 g/L, les plaquettes à 21 G/L et les leucocytes à 48 G/L ; le frottis identifie 70 % de blastes. Cette vignette fictive impose une évaluation hématologique urgente. La numération révèle une insuffisance de production normale, malgré un nombre élevé de leucocytes ; elle n’attribue pas à elle seule une lignée aux cellules anormales.</p>
<p>Le laboratoire retrouve ensuite une population blastique exprimant fortement la myéloperoxydase et des marqueurs B concordants. Après vérification des contrôles, de la morphologie, de la génétique et des diagnostics concurrents, il peut retenir une <button class="w" data-k="c95-lapm">leucémie aiguë à phénotype mixte</button> B/myéloïde. Le problème n’est pas seulement de nommer la leucémie : il faut traiter ses complications immédiates, obtenir les prélèvements de référence et choisir un protocole adapté à sa biologie.</p>
<div class="key"><b>Trois questions guident le cours.</b> Le patient est-il en danger maintenant ? Quelle population leucémique est réellement présente ? Quel traitement et quelle surveillance répondent à cette maladie chez ce patient ? L’urgence clinique et la caractérisation biologique avancent en parallèle.</div>
<p>La catégorie C95, « leucémie à cellules non précisées », rassemble des situations où la lignée n’est pas attribuée ou ne peut pas l’être. Son principal contenu clinique développé ici est la leucémie aiguë de lignée ambiguë, abrégée LALA. Elle comprend notamment la LAPM, la leucémie aiguë indifférenciée (LAI) et certaines formes sans autre précision biologique. Un dossier encore incomplet n’est pas automatiquement une LALA : l’absence de résultat et une ambiguïté démontrée sont deux situations différentes.</p>
<p>Pour l’examen fédéral, les points de départ sont une fatigue, une fièvre, un purpura, une adénopathie ou une anomalie de laboratoire. Il faut reconnaître l’urgence et expliquer l’étape suivante, sans prétendre diagnostiquer une lignée par les symptômes. Le référentiel de l’examen 2026 conserve PROFILES 2017 ; la transition vers PROFILES 2 pour l’examen est annoncée pour 2028. Les correspondances de situations sont détaillées dans <button class="w" data-k="c95-profiles">la fiche de préparation à l’examen</button>.</p>
<div class="alert"><b>Ne pas universaliser le seuil de 20 %.</b> Il s’applique au diagnostic de LALA dans les classifications étudiées. Certaines LMA définies génétiquement suivent d’autres règles OMS ou <button class="w" data-k="c95-who-icc">ICC</button>. Une suspicion de leucémie promyélocytaire avec coagulopathie justifie une prise en charge immédiate sans attendre de réunir un seuil arbitraire.</div>

<section class="ilot" id="c95-1"><h2><span class="n">1</span> Nosologie, définitions et classifications</h2>
<h3>Décrire la maladie avant son code</h3>
<p>Dans une leucémie aiguë habituelle, l’analyse intégrée permet d’attribuer une lignée dominante. Dans la LALA, les blastes remplissent les critères de plusieurs lignées ou n’expriment pas suffisamment de marqueurs pour une attribution unique. La classification associe morphologie, immunophénotype, génétique et contexte. Elle ne se réduit pas à une addition de marqueurs « positifs » sur un compte rendu.</p>
<table class="t"><thead><tr><th>Entité</th><th>Définition utile</th><th>Limite à garder</th></tr></thead><tbody><tr><td>LAPM biphénotypique</td><td>Une population blastique remplit les critères de plusieurs lignées.</td><td>Coexpression aberrante isolée ≠ seconde lignée.</td></tr><tr><td>LAPM bilinéale</td><td>Plusieurs populations blastiques aberrantes de lignées différentes.</td><td>Deux populations phénotypiques ne prouvent pas deux clones indépendants.</td></tr><tr><td>LAI</td><td>Aucun marqueur définissant une lignée après panel suffisamment large ; au plus un marqueur associé par lignée.</td><td>Écarter les lignées rares, une LMA peu différenciée et les catégories génétiques.</td></tr><tr><td>LALA sans autre précision biologique</td><td>Profil ambigu ne remplissant ni une catégorie définie ni les critères de LAI.</td><td>Ce diagnostic biologique n’est pas synonyme de résultat de laboratoire encore manquant.</td></tr></tbody></table>
<p>Le total des blastes néoplasiques doit atteindre au moins 20 % dans le sang ou la moelle pour les LALA considérées ici. Pour une forme bilinéale, le compte porte sur l’ensemble des populations malignes. La taille minimale d’une composante mineure diffère : l’OMS n’impose pas le seuil de 5 % utilisé dans la description <button class="w" data-k="c95-who-icc">ICC</button> ; en dessous de ce seuil <button class="w" data-k="c95-who-icc">ICC</button>, la population mineure est signalée avec la lignée prédominante. Dans tous les cas, il faut distinguer un petit contingent leucémique de précurseurs normaux résiduels.</p>
<h3>Les critères OMS de lignée</h3>
<table class="t"><thead><tr><th>Lignée</th><th>Critère dans le contexte d’un phénotype ambigu</th><th>Précision décisive</th></tr></thead><tbody><tr><td>B</td><td>CD19 fort et au moins un parmi CD10, CD22, <button class="w" data-k="c95-crit-b">CD79a</button> fortement exprimé ; CD19 faible et au moins deux.</td><td>CD19 fort : une partie dépasse 50 % de l’intensité des précurseurs B normaux. Ne pas utiliser <button class="w" data-k="c95-crit-b">CD79a</button> si la lignée T est considérée.</td></tr><tr><td>T</td><td><button class="w" data-k="c95-crit-t">CD3</button> cytoplasmique ou membranaire, avec intensité suffisante ; alternative immunohistochimique appropriée.</td><td>Anticorps anti-chaîne epsilon ; une partie dépasse 50 % du niveau des T matures. Réactif non-zêta en immunohistochimie.</td></tr><tr><td>Myéloïde</td><td><button class="w" data-k="c95-cytometrie">MPO</button> suffisamment forte ou profil compatible avec la maturation myéloïde ; ou différenciation monocytaire.</td><td><button class="w" data-k="c95-cytometrie">MPO</button> : une partie dépasse 50 % du niveau des neutrophiles matures dans la table OMS ; une expression faible uniforme isolée est insuffisante.</td></tr><tr><td>Monocytaire</td><td>Au moins deux : estérase non spécifique, CD11c, CD14, CD64, lysozyme.</td><td>Le panel et la coordination du profil comptent ; un seul CD13 ou CD33 n’est pas ce critère.</td></tr></tbody></table>
<p>Le « 50 % » concerne une intensité relative d’expression avec contrôles internes, et non la proportion de blastes positifs. Le compte rendu doit nommer la méthode et la classification. L’<button class="w" data-k="c95-who-icc">ICC</button> exige des niveaux comparables aux contrôles pour certains marqueurs et ne fixe pas le même seuil quantitatif de <button class="w" data-k="c95-cytometrie">MPO</button>. Les <button class="w" data-k="c95-who-icc">différences OMS–ICC</button> empêchent d’enseigner un tableau fusionné comme s’il s’agissait d’une seule règle.</p>
<h3>Les groupes génétiques</h3>
<p><button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> et <button class="w" data-k="c95-kmt2a">KMT2A</button> réarrangé définissent des groupes reconnus ; ZNF384 réarrangé et BCL11B réarrangé/activé ont rejoint les classifications récentes. ZNF384 relie certaines LAPM B/myéloïdes pédiatriques à des LLA-B biologiquement proches. BCL11B peut définir un continuum avec des leucémies très immatures et des formes T/myéloïdes. Une fusion ou mutation ne se lit donc pas sans son contexte phénotypique et la hiérarchie de la classification.</p>
<p>Il n’existe pas de stade tumeur–ganglions–métastases propre à la LALA. On décrit la biologie, les sites atteints, la charge tumorale, les urgences, l’aptitude thérapeutique et la réponse. La présence d’une LMA définie, d’une LMC en phase blastique ou d’une néoplasie myéloïde/lymphoïde avec fusion de kinase peut changer le diagnostic malgré un phénotype mixte.</p>
<h3>Le périmètre administratif C95</h3>
<table class="t"><thead><tr><th>Sous-code CIM-10-GM 2024</th><th>Signification</th><th>Conséquence</th></tr></thead><tbody><tr><td>C95.00 / C95.01</td><td>Leucémie aiguë à cellules non précisées, sans mention de RC / en RC.</td><td>Inclut formes biphénotypiques, bilinéales, de lignée mixte et lignée incertaine.</td></tr><tr><td>C95.10 / C95.11</td><td>Leucémie chronique à cellules non précisées, sans mention de RC / en RC.</td><td>L’exacerbation aiguë d’une leucémie chronique non précisée reste ici selon la note d’exclusion.</td></tr><tr><td>C95.70 / C95.71</td><td>Autres leucémies à cellules non précisées, sans mention de RC / en RC.</td><td>Catégorie documentaire, pas un protocole unique démontré.</td></tr><tr><td>C95.90 / C95.91</td><td>Leucémie sans précision, sans mention de RC / en RC.</td><td>Préciser le dossier dès que possible ; ne pas inventer une lignée ou effacer un diagnostic historique.</td></tr><tr><td>C95.8!</td><td>Leucémie réfractaire à l’induction standard.</td><td>Code additionnel sans cinquième caractère, jamais une nouvelle lignée ni un code isolé.</td></tr></tbody></table>
<p>Le caractère final 0 inclut la rémission partielle ou l’absence d’information sur la rémission ; 1 exige une rémission complète documentée. La version 2024 lue ne définit pas de caractère 2. Ces correspondances expliquent le cours de la plateforme ; elles ne certifient pas une facturation individuelle en 2026. Les catégories chroniques et « autres » ne sont pas nécessairement temporaires : elles reflètent ce que le dossier permet d’affirmer.</p>

<section class="ilot" id="c95-2"><h2><span class="n">2</span> Épidémiologie</h2>
<p>Le premier repère est suisse, mais il concerne l’ensemble des leucémies. Le rapport OFS 2021 décrit environ 1 150 diagnostics annuels en 2013–2017, dont près de 700 chez les hommes et 450 chez les femmes, et environ 600 décès annuels. Le groupe est C91–C95. Utiliser ces nombres comme incidence de LAPM multiplierait artificiellement la fréquence d’une maladie rare.</p>
<p>Le même rapport situe le risque de développer une leucémie au cours de la vie à 1,4 % chez l’homme et 0,9 % chez la femme. Les âges médians diffèrent selon la famille : environ 69 ans pour les leucémies myéloïdes, 68 ans chez l’homme et 70 ans chez la femme pour les lymphoïdes. Ces chiffres datés décrivent un ensemble comprenant formes aiguës et chroniques ; ils ne donnent pas l’âge médian d’une LALA suisse actuelle.</p>
<table class="t"><thead><tr><th>Population</th><th>Repère publié</th><th>Interprétation</th></tr></thead><tbody><tr><td>Suisse, C91–C95, 2013–2017</td><td>≈1 150 diagnostics/an ; ≈600 décès/an.</td><td>Contexte national agrégé et historique.</td></tr><tr><td>LMA, données européennes reprises par Onkopedia</td><td>≈3,7/100 000/an ; fréquence croissante avec l’âge.</td><td>Comparateur fréquent, non valeur suisse spécifique C95.</td></tr><tr><td>LLA, Onkopedia</td><td>≈1,1/100 000/an ; pic avant 5 ans, second pic après 80 ans.</td><td>Épidémiologie LLA, différente de celle de LAPM.</td></tr><tr><td>LALA, revue récente</td><td>≈2–3 % des leucémies aiguës ; estimation SEER 0,35/million-personnes-années.</td><td>Ordre de grandeur, registre américain descriptif et définitions variables.</td></tr></tbody></table>
<p>La forme B/myéloïde est la plus fréquente ; la forme T/myéloïde vient ensuite. Les proportions varient selon l’âge, la définition retenue et la présence de groupes génétiques. La revue de Karasek donne des fourchettes de 59–72 % et 21–32 % dans les séries considérées. Il serait trompeur de les transformer en probabilités fixes pour chaque consultation.</p>
<p>L’évolution des classifications modifie aussi les séries : certains anciens cas étiquetés « phénotype mixte » sont aujourd’hui rattachés à une LMA génétiquement définie. La rareté et cette hétérogénéité expliquent le faible nombre d’essais prospectifs. Elles justifient une expertise de centre et une discussion des données disponibles, sans conclure que l’absence d’essai signifie absence d’option thérapeutique.</p>
<div class="key"><b>À retenir.</b> Aucun chiffre suisse propre à C95 ou à la LAPM n’a été établi dans les sources consultées. Toujours préciser le code regroupé, la période, le pays et la population avant de comparer incidence ou survie.</div>

<section class="ilot" id="c95-3"><h2><span class="n">3</span> Du progéniteur à la lignée ambiguë</h2>
<h3>Le normal : produire des cellules fonctionnelles</h3>
<p>La moelle rouge assure le renouvellement des cellules sanguines à partir de cellules souches hématopoïétiques. L’engagement de lignée s’accompagne d’une modification coordonnée de l’expression génique et des protéines cellulaires. Les cellules érythroïdes, les mégacaryocytes et les leucocytes n’ont pas la même fonction ; le laboratoire suit leurs étapes de maturation avec des caractéristiques morphologiques et des marqueurs.</p>
<p>La <button class="w" data-k="c95-cytometrie">MPO</button> participe au profil de différenciation myéloïde ; <button class="w" data-k="c95-crit-t">CD3</button> appartient au complexe du récepteur T ; plusieurs protéines associées aux cellules B permettent de reconnaître un engagement B. Aucun de ces repères ne doit être détaché de son intensité, du stade de maturation et de la population réellement analysée. Les marqueurs d’immaturité, tels CD34 ou TdT, répondent à une autre question que les marqueurs de lignée.</p>
<figure id="c95-figure-moelle-clinique" data-origin="human-original"><img src="assets/img/c95/alpha/codex/normal-marrow-openstax2016.jpg" alt="Photographie originale d’une coupe osseuse avec tissu spongieux et moelle rouge" loading="lazy" width="854" height="791"><figcaption><b>Os spongieux et moelle : situer la production sanguine.</b> <b>Au centre :</b> les espaces entre les travées sont occupés par la moelle, visible ici en rouge. <b>À la périphérie :</b> le tissu osseux délimite la pièce. Cette photographie macroscopique montre un site de tissu médullaire ; elle ne permet ni de compter les blastes ni d’attribuer leur lignée. La barre blanche est conservée mais aucune mesure n’en est déduite, sa valeur n’étant pas donnée sur ce fichier. Original : OpenStax, Anatomy and Physiology, édition 8.25 du 18 mai 2016, fichier2205 Bone Marrow, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels et repères d’origine conservés ; légende française explicative ajoutée.</figcaption></figure>
<h3>La transformation : prolifération et maturation anormales</h3>
<p>Dans la leucémie aiguë, des cellules malignes immatures s’accumulent et perturbent l’hématopoïèse normale. Une anémie réduit la capacité de transport d’oxygène ; une neutropénie fragilise la défense anti-infectieuse ; une thrombopénie altère l’hémostase primaire. L’hyperleucocytose peut être constituée de blastes inefficaces : elle ne garantit pas une défense contre les infections.</p>
<p>La LALA ne correspond pas simplement à une cellule qui aurait « oublié de choisir ». Les études rapportées dans les revues décrivent des altérations génétiques et épigénétiques pouvant conserver plusieurs programmes de différenciation. Des sous-populations phénotypiquement différentes partagent parfois les mêmes anomalies fondatrices. Une LAPM bilinéale ne prouve donc pas l’existence de deux cancers indépendants.</p>
<h3>Un génome et un programme d’expression</h3>
<p><button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> produit une kinase de fusion qui peut constituer une cible thérapeutique. <button class="w" data-k="c95-kmt2a">KMT2A</button> réarrangé et ZNF384 réarrangé interviennent dans des programmes transcriptionnels spécifiques. L’activation de BCL11B décrite dans certaines LALA peut résulter du rapprochement d’éléments régulateurs, avec expression anormale dans un progéniteur. Elle ne doit pas être confondue avec toute mutation ou perte de fonction de BCL11B.</p>
<p>Des anomalies cytogénétiques sont fréquentes, mais un caryotype anormal n’est pas synonyme de caryotype complexe. Leurs fréquences dépendent fortement de la série. Les anomalies liées à la myélodysplasie obligent à réexaminer la classification ; elles ne justifient pas un raccourci où toute mutation figurant dans un panel transforme automatiquement une LLA en LMA.</p>
<h3>La plasticité sous traitement</h3>
<p>Après une thérapie dirigée contre CD19, une rechute peut perdre cette cible ou changer de lignée. La sélection d’un contingent préexistant et la plasticité d’un programme cellulaire peuvent contribuer à ce phénomène ; le mécanisme exact n’est pas démontré chez chaque patient. Il faut donc réévaluer morphologie, immunophénotype et génétique à la rechute au lieu de reproduire l’ancienne étiquette.</p>
<p>La série EVOLVE citée par Sherban et Wolach porte sur 70 patients ayant déjà présenté un changement de lignée après immunothérapie : 53 avaient évolué vers une LMA et 17 vers une LAPM B/myéloïde ou une LAI. Ces nombres décrivent la répartition des événements recensés ; ils ne signifient pas que 75,7 % de tous les patients traités changent de lignée. La fiche <button class="w" data-k="c95-lineage-switch">changement de lignée</button> précise ce piège de dénominateur.</p>
<div class="key"><b>Conséquence thérapeutique.</b> Un phénotype mixte n’implique pas qu’un protocole de lignée unique soit voué à l’échec. Les données disponibles soutiennent au contraire une induction de type LLA pour la plupart des LAPM, dans un protocole adapté et contrôlé.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S321] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S322] File: 2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2025.1715087/full" target="_blank" rel="noopener">[S306] Frontiers | Mixed phenotype acute leukemia, the dissection of an enigmatic disease in the era of novel therapies</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">[S313] FI suisse Glivec</a>.</p></div></section>
<section class="ilot" id="c95-4"><h2><span class="n">4</span> Causes et facteurs de risque</h2>
<p>On ne dispose pas d’une cause unique propre à la LAPM qui puisse être recherchée pour confirmer le diagnostic. L’anamnèse rassemble des contextes pertinents, et non une preuve causale. L’absence d’exposition connue n’élimine pas une leucémie ; la présence d’une exposition ne permet pas de déterminer sa lignée.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Pourquoi le rechercher</th><th>Limite</th></tr></thead><tbody><tr><td>Exposition professionnelle à certains produits chimiques</td><td>Le rapport suisse cite notamment benzène, formaldéhyde, oxyde d’éthylène et1,3-butadiène parmi les risques de certaines leucémies.</td><td>Pas association spécifique LAPM démontrée par ce rapport.</td></tr><tr><td>Chimiothérapie ou radiothérapie antérieure</td><td>Peut orienter vers une néoplasie myéloïde après traitement cytotoxique et modifier la classification.</td><td>Un antécédent ne remplace pas le bilan génétique et morphologique.</td></tr><tr><td>Antécédents familiaux ou constitutionnels</td><td>Un âge inhabituel, plusieurs cancers ou une histoire familiale peuvent faire discuter une prédisposition.</td><td>Ne pas imposer un panel germinal universel ni choisir un donneur familial sans évaluation adaptée.</td></tr><tr><td>Immunothérapie anti-CD19 antérieure</td><td>Une rechute peut perdre la cible ou changer de lignée.</td><td>Contexte d’évolution clonale sous traitement, pas facteur de risque de toute LAPM initiale.</td></tr><tr><td>Tabac, radiations et autres facteurs rapportés par l’OFS</td><td>À documenter et à discuter selon l’exposition et le type de leucémie.</td><td>Association générale ; aucune attribution individuelle automatique.</td></tr></tbody></table>
<p>La distinction entre une LAPM de novo et une LMA secondaire à phénotype mixte a une portée pratique. Dans les séries citées par la revue, leurs résultats et leurs réponses à l’induction diffèrent. La frontière avec les anomalies liées à la myélodysplasie reste discutée : la conclusion est prise par confrontation du dossier, de la classification utilisée et du laboratoire de référence, avec justification explicite.</p>
<p>Une suspicion de lien professionnel nécessite des renseignements précis : tâche, substance, durée, intensité, protection et autres expositions. Les sources de ce chapitre ne permettent pas de conclure automatiquement à une reconnaissance Suva/LAA ou à une prestation assurance-invalidité. Il faut distinguer plausibilité médicale, documentation professionnelle et décision assurantielle.</p>
<div class="alert"><b>Piège.</b> Les anomalies somatiques du clone leucémique ne sont pas nécessairement des anomalies constitutionnelles transmissibles. Une consultation génétique répond à une question spécifique ; le résultat d’un panel tumoral n’autorise pas à annoncer un risque familial sans confirmation appropriée.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">[S312] Le cancer en Suisse, rapport 2021, leucémies</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2025.1715087/full" target="_blank" rel="noopener">[S306] Frontiers | Mixed phenotype acute leukemia, the dissection of an enigmatic disease in the era of novel therapies</a>.</p></div><button class="pareto-btn ui" data-k="pareto-c95-mecanismes">▲ Loi de Pareto — synthèse</button></section>
<section class="ilot" id="c95-5"><h2><span class="n">5</span> Interroger</h2>
<p>On commence par la chronologie et la tolérance. Une fatigue qui s’aggrave en quelques jours, des saignements spontanés ou une fièvre conduisent à rechercher une insuffisance médullaire et une complication urgente. Une installation moins spectaculaire, un nombre de leucocytes normal ou l’absence de blastes circulants n’excluent pas une leucémie aiguë.</p>
<table class="t"><thead><tr><th>Question</th><th>Mécanisme possible</th><th>Conséquence</th></tr></thead><tbody><tr><td>Fatigue, dyspnée, vertiges, palpitations ?</td><td>Anémie et réduction du transport d’oxygène, mais aussi infection ou autre atteinte.</td><td>Évaluer tolérance, hémoglobine et fonctions vitales.</td></tr><tr><td>Fièvre, frissons, douleur buccale, toux, dysurie ?</td><td>Infection favorisée par neutropénie ; signes parfois peu marqués.</td><td>Chercher foyer et gravité, organiser prise en charge urgente.</td></tr><tr><td>Pétéchies, ecchymoses, épistaxis, gingivorragies, règles abondantes ?</td><td>Thrombopénie, parfois coagulopathie associée.</td><td>Quantifier le saignement et rechercher une atteinte profonde ou neurologique.</td></tr><tr><td>Douleurs osseuses, masse ganglionnaire, gêne abdominale ?</td><td>Atteinte médullaire ou infiltration d’organes.</td><td>Examen ciblé puis exploration adaptée ; aucun signe ne définit la lignée.</td></tr><tr><td>Céphalée inhabituelle, trouble visuel, confusion, faiblesse focale ?</td><td>Atteinte neurologique infectieuse, hémorragique, leucostase ou infiltration.</td><td>Évaluation urgente, sans choisir d’emblée une seule cause.</td></tr><tr><td>Cancer antérieur, traitement cytotoxique, anti-CD19, médicaments actuels ?</td><td>Contexte classificatoire, risque infectieux ou toxicité et interaction.</td><td>Récupérer traitements, doses, dates et anciens comptes rendus.</td></tr></tbody></table>
<p>Le retentissement fonctionnel compte : autonomie, alimentation, capacité à boire, entourage, éloignement du centre et compréhension des consignes influencent le parcours. Chez une personne âgée, l’âge civil ne remplace pas l’évaluation de la fragilité et des comorbidités. Le souhait du patient et les possibilités de traitement sont discutés après stabilisation, dans une information proportionnée à l’urgence.</p>
<h3>Fréquences : toujours nommer la population</h3>
<p>Onkopedia décrit, dans la LLA de l’adulte, une infection ou un saignement au diagnostic chez environ un tiers des patients, des adénopathies et une splénomégalie autour de 60 %, une masse médiastinale dans 14 % de l’ensemble des LLA et dans 60 % des LLA-T. Ces fréquences aident à comprendre des présentations possibles ; elles ne sont pas des sensibilités diagnostiques de la LAPM. L’atteinte du système nerveux central est rapportée chez 7 % des LLA au diagnostic, souvent détectée par le bilan protocolisé plutôt que par les seuls symptômes.</p>
<p>Après une chimiothérapie, préciser la date du dernier cycle, les prophylaxies, les infections précédentes, les résistances connues et la présence d’un accès veineux central. Une fièvre avec neutropénie possible appelle le contact immédiat avec l’équipe traitante ou les urgences. Attendre l’apparition de pus ou un foyer évident est dangereux, car les signes inflammatoires peuvent rester discrets.</p>
<div class="key"><b>La question clinique reste ouverte.</b> Le tableau suggère une maladie hématologique et mesure sa gravité. Il ne sépare pas, à lui seul, LMA, LLA et LALA. L’étape suivante est un bilan sanguin/médullaire adapté, mené sans retarder les soins urgents.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S320] Prise en chargede la neutropénie fébrile</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div></section>
<section class="ilot" id="c95-6"><h2><span class="n">6</span> Examiner</h2>
<div data-semiology-clinical="C95"><h3>Observer d’abord la stabilité</h3>
<p>État de conscience, fréquence respiratoire, saturation, pouls, pression artérielle, température et perfusion périphérique orientent la priorité. Une dyspnée hypoxémique ou une anomalie neurologique peut traduire une leucostase, une infection, une hémorragie ou une autre complication. Le chiffre de leucocytes n’est pas un examen clinique de remplacement.</p>
<h3>Peau, muqueuses et hémostase</h3>
<p>Rechercher pâleur, pétéchies, ecchymoses, saignement gingival, épistaxis et lésions cutanées. Une hémorragie profonde ne prouve pas à elle seule une CIVD : elle peut accompagner une thrombopénie sévère ou d’autres anomalies de l’hémostase. Sa gravité impose cependant numération, coagulation et évaluation urgente. L’examen des muqueuses recherche aussi des lésions infectieuses et des obstacles à l’alimentation.</p>
<h3>Ganglions et organes</h3>
<p>Palper les aires ganglionnaires accessibles et rechercher une hépatosplénomégalie. Une masse médiastinale n’est pas diagnostiquée par la palpation ; dyspnée, gêne positionnelle ou signes de compression conduisent à une exploration adaptée. Une hyperplasie gingivale et des infiltrats cutanés sont décrits plus souvent dans certaines LMA monocytaires, mais ne suffisent pas à leur diagnostic.</p>
<h3>Examen neurologique et recherche infectieuse</h3>
<p>Évaluer orientation, langage, motricité et paires crâniennes selon la situation. Une raideur méningée ou des céphalées orientent sans établir une infiltration leucémique. Une ponction lombaire n’est pas un geste automatique immédiat chez un patient avec coagulopathie, thrombopénie non corrigeable ou autre risque procédural ; le centre choisit le moment et le bilan préalable.</p>
<table class="t"><thead><tr><th>Constat</th><th>Hypothèses principales</th><th>Ce qu’il ne prouve pas</th></tr></thead><tbody><tr><td>Pâleur et tachycardie</td><td>Anémie, mauvaise tolérance, autres causes de tachycardie.</td><td>Ni taux précis d’hémoglobine ni lignée leucémique.</td></tr><tr><td>Pétéchies et gingivorragies</td><td>Thrombopénie ; rechercher coagulopathie selon contexte.</td><td>Pas diagnostic de CIVD sans bilan.</td></tr><tr><td>Fièvre avec signes locaux minimes</td><td>Infection possible malgré réponse inflammatoire faible.</td><td>L’absence de foyer n’autorise pas à différer l’évaluation.</td></tr><tr><td>Dyspnée/hypoxémie et confusion</td><td>Leucostase, infection, hémorragie, causes métaboliques.</td><td>Pas besoin de dépasser100 G/L pour évoquer une leucostase.</td></tr><tr><td>Adénopathies ou organomégalie</td><td>Infiltration possible, infection ou autre hémopathie.</td><td>Pas attribution B, T ou myéloïde sur la clinique.</td></tr></tbody></table>
<p>L’examen est répété : une aggravation entre deux prélèvements peut modifier la priorité. Les sources consultées ne fournissent pas de sensibilité ou de spécificité validée des signes physiques pour identifier la LAPM. L’absence d’adénopathies, de splénomégalie ou d’hyperleucocytose ne l’exclut donc pas.</p>
<div class="key"><b>À retenir.</b> L’examen décide du niveau de soins, documente les syndromes et guide les explorations. L’attribution de lignée repose sur le bilan intégré. La sémiologie analytique reprend neuf étapes, du fonctionnement normal à la synthèse, dans l’onglet scientifique.</div></div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S320] Prise en chargede la neutropénie fébrile</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div><button class="pareto-btn ui" data-k="pareto-c95-clinique">▲ Loi de Pareto — synthèse</button></section>

<section class="ilot" id="c95-7"><h2><span class="n">7</span> Construire le diagnostic intégré</h2>
<h3>Premier temps : confirmer le syndrome et préserver les prélèvements</h3>
<p>La formule sanguine avec différentiel, le frottis et les paramètres de coagulation répondent aux premières questions. Il faut associer créatinine, potassium, phosphate, calcium, acide urique et LDH pour évaluer les conséquences métaboliques et préparer le traitement. Les examens infectieux dépendent de la présentation. Prélever ne doit pas retarder les soins d’une complication menaçante ; le laboratoire et le centre de référence organisent ensemble le circuit urgent.</p>
<p>L’aspiration médullaire fournit des cellules pour morphologie, cytométrie et génétique. La biopsie renseigne notamment sur l’architecture ou un prélèvement pauvre. Le sang périphérique contenant suffisamment de blastes peut fournir une partie des analyses, selon le laboratoire ; un frottis sans blaste ne clôt pas l’enquête. Il faut signaler tout traitement déjà reçu, car il peut modifier la quantité de cellules et le profil interprétable.</p>
<h3>Deuxième temps : séparer immaturité et lignée</h3>
<p>CD34, <button class="w" data-k="c95-lai">CD117</button>, TdT et HLA-DR contribuent à décrire l’immaturité ; ils ne constituent pas tous des critères spécifiques d’une lignée. La cytométrie identifie les populations, compare les intensités aux contrôles internes et recherche une expression coordonnée. CD13 ou CD33 sur une LLA-B ne suffisent pas à appeler une LAPM. À l’inverse, une expression réellement définissante de <button class="w" data-k="c95-cytometrie">MPO</button> et de marqueurs B peut conduire à cette catégorie après les exclusions requises.</p>
<figure id="c95-figure-diagnostic-mpal" data-origin="human-original"><img src="assets/img/c95/alpha/codex/flow-g003.png" alt="Cytométrie originale : blastes B myéloïdes en rouge, cellules B matures en bleu et neutrophiles en vert" loading="lazy"><figcaption><b>Une population remplit les critères B et myéloïdes.</b> <b>Rouge :</b> population blastique biphénotypique ; les panneaux montrent notamment CD19, CD10, CD22 et <button class="w" data-k="c95-crit-b">CD79a</button>. <b>Bleu :</b> cellules B matures servant de comparaison. <b>Vert :</b> neutrophiles. <b>Panneau de droite :</b> une partie du nuage rouge dépasse le repère de <button class="w" data-k="c95-cytometrie">MPO</button> du laboratoire ; ce cas publié satisfait les critères B/myéloïdes et porte une fusion P2RY8::CRLF2. Le trait rose matérialise une intensité, pas 50 % de cellules positives. Les axes/logarithmes et contrôles restent ceux de l’original ; on ne recalcule pas le seuil à partir des pixels. Original : Fuda et Chen, Cancers 2025; 17: 871, figure 3, <a href="https://doi.org/10.3390/cancers17050871" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels et repères d’origine conservés ; légende française explicative ajoutée.</figcaption></figure>
<h3>Troisième temps : intégrer génétique et contexte</h3>
<p>Le caryotype, les recherches rapides de fusions et les analyses moléculaires sont choisis pour ne pas manquer une catégorie qui change la prise en charge. PML::RARA est urgent si la morphologie et la coagulation suggèrent une leucémie promyélocytaire. <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> impose de distinguer une maladie de novo d’une LMC en phase blastique ; <button class="w" data-k="c95-kmt2a">KMT2A</button>, ZNF384 et BCL11B contribuent à la classification de certaines LALA. Le panel n’est pas une liste de cases indépendante des cellules examinées.</p>
<p>Les anomalies myélodysplasiques et les antécédents de néoplasie myéloïde peuvent conduire à une classification LMA plutôt que LAPM. La frontière reste débattue pour certaines mutations isolées. RUNX1 figure parmi les gènes liés à la myélodysplasie de l’<button class="w" data-k="c95-who-icc">ICC</button>, mais pas dans la même liste OMS. Un compte rendu doit donc expliquer la hiérarchie utilisée au lieu d’affirmer qu’une mutation quelconque « exclut toujours » le phénotype mixte.</p>
<h3>Quatrième temps : une conclusion utilisable</h3>
<p>La conclusion précise le pourcentage global de blastes, les populations identifiées, les critères de lignée, les anomalies génétiques, la classification et les analyses encore attendues. Elle indique si une cible de suivi est disponible. Un avis intégré provisoire peut guider l’urgence ; il doit conserver ses limites jusqu’à réception des résultats complémentaires. Une réunion spécialisée confronte ensuite diagnostic, aptitude au traitement et stratégie.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a>.</p></div></section>
<section class="ilot" id="c95-8"><h2><span class="n">8</span> Diagnostics différentiels et pièges</h2>
<table class="t"><thead><tr><th>Situation</th><th>Question discriminante</th><th>Erreur évitée</th></tr></thead><tbody><tr><td>LLA-B avec marqueurs myéloïdes aberrants</td><td>La <button class="w" data-k="c95-cytometrie">MPO</button> atteint-elle un profil définissant ? Existe-t-il une différenciation monocytaire coordonnée ?</td><td>Additionner CD13/CD33 ou une <button class="w" data-k="c95-cytometrie">MPO</button> faible pour fabriquer une LAPM.</td></tr><tr><td>LMA avec marqueurs lymphoïdes aberrants</td><td>Une catégorie génétique LMA prime-t-elle ? Le profil B/T est-il réellement définissant ?</td><td>Appeler mixte toute LMA CD7+ ou CD19+.</td></tr><tr><td>LMC en phase blastique</td><td>Antécédents, morphologie, autres cellules porteuses de <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> et bilan global sont-ils compatibles ?</td><td>Assimiler <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button> à une LAPM de novo.</td></tr><tr><td>LAI versus LMA peu différenciée</td><td>Le panel est-il assez large ? Quels marqueurs associés et quelles anomalies génétiques sont présents ?</td><td>Poser LAI devant le seul résultat <button class="w" data-k="c95-cytometrie">MPO</button> négatif.</td></tr><tr><td>Précurseurs B normaux résiduels</td><td>La maturation est-elle organisée ou le contingent est-il aberrant ?</td><td>Confondre hématogones et deuxième population leucémique.</td></tr><tr><td>Néoplasie dendritique plasmacytoïde blastique</td><td>Panel spécifique de différenciation dendritique et exclusions adaptés.</td><td>Déduire le diagnostic du trio CD4/CD56/CD123 seul.</td></tr><tr><td>Néoplasie avec fusion de kinase, notamment FGFR1</td><td>Contexte clinique, éosinophilie éventuelle, atteintes et recherche ciblée de fusion.</td><td>Prescrire une recherche isolée universelle à partir d’un cas publié.</td></tr></tbody></table>
<figure id="c95-figure-mpo-faible" data-origin="human-original"><img src="assets/img/c95/alpha/codex/flow-g006.png" alt="Cytométrie originale d’une LLA B à expression faible de MPO, sous le repère de lignée myéloïde" loading="lazy"><figcaption><b>Une <button class="w" data-k="c95-cytometrie">MPO</button> faible n’établit pas une LAPM.</b> <b>Rouge :</b> lymphoblastes B ; <b>bleu :</b> cellules B matures ; <b>vert :</b> neutrophiles. <b>À droite :</b> le nuage blastique reste sous le repère rose de <button class="w" data-k="c95-cytometrie">MPO</button>. Les autres panneaux ne montrent pas une différenciation monocytaire coordonnée. Les auteurs classent ce cas en LLA-B avec expression aberrante faible de <button class="w" data-k="c95-cytometrie">MPO</button>. La présence d’un signal n’est donc pas synonyme de seconde lignée. Cette illustration ne mesure ni sensibilité ni spécificité dans une population. Original : Fuda et Chen, Cancers 2025; 17: 871, figure 6, <a href="https://doi.org/10.3390/cancers17050871" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels et repères d’origine conservés ; légende française explicative ajoutée.</figcaption></figure>
<p>Une leucémie T très immature peut exprimer des marqueurs associés aux progéniteurs ou à la lignée myéloïde. L’identification de la lignée T dans une suspicion de LALA repose sur des critères spécifiques de <button class="w" data-k="c95-crit-t">CD3</button>, et non sur CD7 seul. Si <button class="w" data-k="c95-crit-t">CD3</button> est absent, il faut réexaminer qualité technique, panel et diagnostics possibles. Quelques publications de cas ne permettent pas de supprimer cette exigence ni d’appeler toute leucémie <button class="w" data-k="c95-crit-t">CD3</button> négative une LLA-T.</p>
<p>La LAI exige des exclusions positives : on a réellement recherché les lignées B, T, myéloïde/monocytaire, et les différenciations rares pertinentes. Certaines LALA sans autre précision n’ont ni un profil suffisant de LAPM ni un profil assez indifférencié pour LAI. Cette catégorie évite une fausse alternative binaire ; elle exige elle aussi une expertise et une documentation.</p>
<p>Un changement de lignée après un traitement ciblant les cellules B est un autre piège. La disparition de CD19 peut rendre une rechute moins visible à une méthode trop étroite. Un nouveau phénotype peut rester apparenté au clone initial. On confronte donc les anciens résultats, la morphologie, un panel large et les marqueurs moléculaires ; l’étiquette initiale ne dispense pas de reclassifier la rechute.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2025.1715087/full" target="_blank" rel="noopener">[S306] Frontiers | Mixed phenotype acute leukemia, the dissection of an enigmatic disease in the era of novel therapies</a>.</p></div><button class="pareto-btn ui" data-k="pareto-c95-diagnostic">▲ Loi de Pareto — synthèse</button></section>
<section class="ilot" id="c95-9"><h2><span class="n">9</span> Traiter les urgences avant le protocole complet</h2>
<p>La priorité est la gravité clinique. Les décisions décrites ici se prennent avec l’équipe hématologique et les soins aigus ; elles ne constituent pas une ordonnance autonome. Le patient instable peut nécessiter plusieurs mesures simultanées. La cytoréduction, le traitement infectieux, le soutien hémostatique et la prévention métabolique ont des objectifs différents et ne se remplacent pas.</p>
<table class="t"><thead><tr><th>Menace</th><th>Indices et bilan</th><th>Réponse initiale spécialisée</th></tr></thead><tbody><tr><td>Infection grave / neutropénie fébrile</td><td>Fièvre, frissons ou dégradation, parfois peu de signes locaux ; neutrophiles, cultures et foyer selon contexte.</td><td>Évaluation urgente ; antibiothérapie empirique rapide selon protocole local et résistances, prélèvements sans retard indu.</td></tr><tr><td>Hémorragie / coagulopathie</td><td>Saignement, numération plaquettaire, TP/INR, TCA, fibrinogène et marqueurs de fibrinolyse.</td><td>Soutien hémostatique et traitement de la cause ; suspicion de LAP : filière immédiate avec ATRA sans attendre la confirmation moléculaire.</td></tr><tr><td>Leucostase</td><td>Dyspnée/hypoxémie, troubles neurologiques, blastes ; aucun seuil unique ne remplace ces signes.</td><td>Surveillance rapprochée, traitement causal et cytoréduction décidés en urgence, avec prévention de lyse.</td></tr><tr><td>Lyse tumorale</td><td>Potassium, phosphate, calcium, urate, créatinine, diurèse et ECG selon gravité.</td><td>Hydratation adaptée à la fonction cardiorénale, surveillance répétée et traitement métabolique ; rasburicase selon risque/indication et contre-indications.</td></tr><tr><td>Cytopénies symptomatiques</td><td>Tolérance de l’anémie, importance du saignement, contexte procédural.</td><td>Produits sanguins et objectifs adaptés au contexte ; pas de seuil transfusionnel universel déduit de ce chapitre.</td></tr></tbody></table>
<p>La revue suisse de neutropénie fébrile consultée insiste sur l’urgence de l’antibiothérapie, idéalement dans l’heure après l’évaluation appropriée. Il s’agit d’une source de 2016 consacrée à la période après chimiothérapie : le choix antibiotique exact doit être confronté au protocole actuel du centre. Un faible score clinique ne suffit pas ici à autoriser une prise en charge ambulatoire d’une leucémie aiguë à haut risque.</p>
<p>L’hyperleucocytose et la leucostase ne sont pas synonymes. Une leucostase peut survenir sans leucocytes au-dessus de 100 G/L ; un nombre élevé sans manifestation ne démontre pas le syndrome. Les schémas de cytoréduction par hydroxycarbamide cités dans Onkopedia concernent notamment la LMA hyperleucocytaire et ne deviennent pas une posologie universelle pour chaque C95.</p>
<p>Si une leucémie aiguë promyélocytaire est suspectée, le risque hémorragique justifie l’ATRA immédiatement dans la filière spécialisée. Le traitement définitif dépend de la confirmation et du groupe de risque ; une hyperleucocytose peut nécessiter un traitement combiné. Donner de l’ATRA à toute leucémie non typée serait une autre erreur. Les posologies et les mesures de coagulation appartiennent au protocole LAP du centre.</p>
<p>La rasburicase dégrade l’acide urique déjà présent, mais ne corrige pas directement une hyperkaliémie ou une hyperphosphatémie. Elle produit du peroxyde d’hydrogène : le déficit en <button class="w" data-k="c95-d-rasburicase">G6PD</button> et les troubles prédisposant à l’hémolyse sont des contre-indications de la fiche suisse. L’échantillon d’urate sous traitement doit être refroidi et analysé selon les instructions, faute de quoi la dégradation continue dans le tube et rassure à tort.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S329] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S320] Prise en chargede la neutropénie fébrile</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529580165" target="_blank" rel="noopener">[S316] FI suisse Litalir</a>.</p></div></section>
<section class="ilot" id="c95-10"><h2><span class="n">10</span> Choisir l’induction et la consolidation</h2>
<h3>Le niveau de preuve doit rester visible</h3>
<p>La rareté de la LAPM limite les essais comparatifs. Les revues et les cohortes disponibles favorisent généralement une induction de type LLA pour de nombreuses LAPM, avec adaptation à la biologie et à l’âge. Cela ne signifie ni que toute LALA, notamment toute LAI, relève d’un seul protocole, ni qu’une réponse insuffisante puisse être gérée par une règle unique. Les décisions relèvent d’un centre expérimenté, idéalement dans un cadre d’étude ou de registre lorsque disponible.</p>
<p>La cohorte pédiatrique iBFM rétrospective inclut 233 enfants et adolescents de moins de 18 ans traités entre 2002 et 2015. La survie sans événement à 5 ans était de 80±4 % sous traitement de type LLA, 36±7,2 % sous type LMA et50±12 % sous traitement combiné. Les groupes n’étaient pas randomisés ; ces nombres soutiennent une orientation, sans établir à eux seuls la supériorité causale d’un schéma pour chaque sous-type.</p>
<p>Le protocole choisi doit prévoir l’évaluation de réponse, la prophylaxie du système nerveux central et les soins de support adaptés. Dans une LAPM <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button>, un inhibiteur de tyrosine kinase est discuté avec la stratégie de type LLA. Le choix de l’ITK tient compte de la mutation, des traitements précédents, des risques cardiovasculaires, des interactions et des autorisations suisses. La présence d’une cible biologique ne suffit pas à démontrer l’autorisation de toute combinaison.</p>
<h3>La place de l’allogreffe</h3>
<p>Chez l’adulte éligible, une allogreffe en première rémission complète est souvent envisagée en raison du risque de rechute. La décision associe réponse, maladie résiduelle, biologie, comorbidités, toxicité attendue, donneur et préférences. Ce n’est pas une obligation fondée sur le seul code C95. Chez l’enfant, la cohorte iBFM ne montre pas de bénéfice global de l’allogreffe ; elle réserve une discussion particulière aux mauvaises réponses et aux situations sélectionnées.</p>
<table class="t"><thead><tr><th>Cohorte de greffe</th><th>Résultats publiés</th><th>Limite de comparaison</th></tr></thead><tbody><tr><td>EBMT 2017 : 519 adultes en RC1, greffés2000–2014</td><td>À3 ans : survie globale56,3 %, survie sans leucémie46,5 %, rechute31,4 %, mortalité sans rechute22,1 %.</td><td>Sélection de patients ayant atteint RC1 et reçu une greffe ; pas de bras sans greffe randomisé.</td></tr><tr><td>EBMT 2026 : 195 patients en RC1, greffés 2014–2023</td><td>À2 ans : survie globale70,7 %, survie sans leucémie56,4 %, rechute29,8 %, mortalité sans rechute13,8 %.</td><td>Résumé public seulement lu ; horizon et période différents, pas preuve directe d’un gain de 14,4 points.</td></tr></tbody></table>
<p>Les stratégies émergentes telles blinatumomab, vénétoclax ou traitements cellulaires ciblés peuvent être discutées dans des situations sélectionnées. Leur base de preuve dans la LAPM est moins établie que dans certaines LLA ou LMA. Il faut distinguer expérience publiée, essai clinique, usage hors indication et remboursement, sans présenter une petite série comme standard suisse.</p>

<section class="ilot" id="c95-11"><h2><span class="n">11</span> Mesurer la réponse et organiser le suivi</h2>
<h3>Trois niveaux de réponse</h3>
<p>La disparition des symptômes n’est pas une preuve de rémission. La rémission morphologique et hématologique suit les critères du protocole, tandis que la maladie résiduelle mesurable, ou MRD, recherche une population persistante au-dessous de la résolution morphologique. Dans les critères LMA ELN repris par Onkopedia, la RC comprend notamment moins de 5 % de blastes médullaires, absence de blastes sanguins et de maladie extramédullaire, neutrophiles ≥ 1 G/L et plaquettes ≥ 100 G/L. Cette définition source LMA ne doit pas être transférée sans vérification à tous les protocoles LALA.</p>
<p>Une MRD négative signifie qu’aucune maladie n’a été détectée par la méthode, dans l’échantillon et à sa sensibilité. Elle ne signifie pas absence absolue de cellule leucémique. Onkopedia LLA souligne une sensibilité minimale de 10<sup>−4</sup> pour l’évaluation moléculaire usuelle. Le laboratoire documente la qualité du prélèvement, la cible, la sensibilité atteinte et l’interprétation clinique.</p>
<h3>Éviter une cible trop étroite</h3>
<p>La plasticité de lignée rend particulièrement utile la combinaison raisonnée de méthodes. Si une population B disparaît après un traitement ciblé mais qu’une population myéloïde apparentée émerge, une analyse limitée à CD19 peut manquer une rechute. La cytométrie de suivi doit tenir compte du phénotype initial et des déviations possibles ; une cible moléculaire peut aider lorsqu’elle est informative. Un résultat discordant mérite une confrontation, pas une moyenne des deux tests.</p>
<p>Le calendrier vient du protocole et de la réponse : fin d’induction, étapes de consolidation, avant/après greffe et situations de suspicion n’ont pas le même objectif. Onkopedia décrit pour la LLA un suivi de MRD tous les 3 mois la première année après la fin de la maintenance, puis tous les 6 mois la deuxième. Ce repère ne s’applique pas indistinctement à toute LALA ni à chaque phase post-greffe.</p>
<h3>Suivre aussi la personne</h3>
<p>Le suivi évalue infections, cytopénies, fonctions d’organe, toxicités médicamenteuses, état nutritionnel, fatigue, difficultés psychiques, fertilité et reprise des activités. Le patient reçoit une consigne claire sur la fièvre, le saignement, la dyspnée et les nouveaux signes neurologiques, avec un numéro de contact. Après greffe, les mesures spécifiques de prévention, vaccination et surveillance relèvent de l’équipe de transplantation.</p>
<p>La persistance de maladie ou une rechute impose un nouveau bilan intégré. L’obtention de la RC1, la MRD et les modifications de lignée sont des informations pronostiques et thérapeutiques ; aucune ne suffit isolément à prescrire une nouvelle induction. Une stratégie de rattrapage prend en compte les traitements déjà reçus, la cible actuelle et l’objectif de soins partagé.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://doi.org/10.1182/blood-2017-12-821363" target="_blank" rel="noopener">[S309] International cooperative study identifies treatment strategy in childhood ambiguous lineage leukemia | Blood | American Society of Hematology</a>.</p></div></section>
<section class="ilot" id="c95-12"><h2><span class="n">12</span> Pronostic : expliquer sans transformer une cohorte en destin</h2>
<p>Le pronostic dépend de l’âge, de l’aptitude thérapeutique, du groupe biologique, de la réponse précoce, de la MRD et des possibilités de consolidation. Une catégorie administrative comme C95.9 ne porte pas un pronostic uniforme. Les séries rétrospectives utilisent des classifications et des traitements différents ; leur comparaison exige de vérifier les critères d’inclusion.</p>
<p>La revue récente rapporte, à partir d’un registre américain de 4 756 adultes, un âge médian de 68 ans, une survie médiane de 4,2 mois et une mortalité à 30 jours de 33 %. Ces résultats décrivent une population large comprenant des patients âgés ou non intensivement traités. Ils ne constituent pas une estimation personnalisée pour l’homme de 34 ans de la vignette ni une recommandation de prise en charge américaine.</p>
<p>À l’inverse, les cohortes de greffe en RC1 sélectionnent des patients qui ont survécu à l’induction, répondu et été jugés transplantables. Leur survie ne peut pas être annoncée à toute personne nouvellement diagnostiquée. L’horizon de 2 ans d’EBMT 2026 ne se compare pas directement à celui de 3 ans d’EBMT 2017. Les événements concurrents expliquent aussi pourquoi rechute et mortalité sans rechute doivent être présentées ensemble.</p>
<p>Une anomalie cytogénétique est fréquente dans les séries de LAPM, mais « caryotype anormal » ne signifie pas « caryotype complexe ». Les chiffres de 64–87 % rapportés par une revue concernent des anomalies cytogénétiques en général. De même, une fréquence de changement de lignée issue d’une série sélectionnée ne doit pas être appliquée à toutes les personnes recevant une immunothérapie.</p>
<div class="key"><b>Communication clinique.</b> Nommer ce qui est connu aujourd’hui, ce qui dépend des résultats à venir et ce que la prochaine étape peut changer. Expliquer bénéfice attendu, toxicités et alternatives ; vérifier la compréhension et les préférences. Une fourchette de cohorte ne remplace pas une estimation actualisée en réunion spécialisée.</div>

<section class="ilot" id="c95-13"><h2><span class="n">13</span> Situations particulières et parcours suisse</h2>
<h3>Enfant, adulte âgé, grossesse</h3>
<p>Chez l’enfant, les groupes génétiques, la tolérance et la stratégie de greffe diffèrent de ceux de l’adulte. L’étude iBFM fournit une base pédiatrique importante mais rétrospective. Une mauvaise réponse doit être discutée dans un groupe spécialisé ; le seuil de ≥ 5 % de blastes à la fin de l’induction apparaît dans un algorithme proposé de cette étude, pas comme loi universelle pour tout patient ou tout protocole.</p>
<p>Chez l’adulte âgé ou fragile, l’objectif est de choisir une stratégie proportionnée à la biologie, aux fonctions d’organe et aux souhaits. Les schémas moins intensifs et les associations ciblées décrits dans les revues ne sont pas interchangeables ; leur preuve dans la LALA peut rester limitée. « Non éligible à l’intensif » ne signifie pas automatiquement « éligible à n’importe quelle association orale ».</p>
<p>Une grossesse ou un projet de fertilité impose une discussion immédiate avec les équipes concernées. Les fiches des médicaments comportent des contre-indications ou avertissements spécifiques ; l’hydroxycarbamide et l’ATRA comportent notamment des contraintes majeures. Il n’est pas possible de déduire un schéma sûr à partir de ce chapitre. Les mesures de préservation de fertilité se discutent quand la situation et l’urgence le permettent.</p>
<h3>Indication, accès et information</h3>
<p>Les sept fiches suisses examinées ne nomment pas une indication spécifique « LAPM » pour les médicaments antileucémiques présentés. Certaines indications de soins de support, comme Fasturtec dans la leucémie aiguë à risque de lyse, peuvent en revanche couvrir la situation selon leurs termes. Il faut examiner le libellé exact du produit et du schéma ; hors indication ne signifie pas automatiquement interdit, remboursé ou non remboursé.</p>
<p>Le remboursement nécessite une vérification actualisée de la Liste des spécialités, de ses limitations et, si nécessaire, des conditions OAMal 71a–71d avec demande individuelle. Aucune garantie de prise en charge ni prix actuel n’a été établi pour une personne dans ce cours. Le centre coordonne aussi les besoins sociaux, l’arrêt de travail, les démarches assurance-invalidité éventuelles et les questions professionnelles documentées.</p>
<p>Le médecin de premier recours reconnaît l’urgence, transmet les informations pertinentes et accompagne les effets à long terme avec le centre. Le spécialiste établit le diagnostic intégré et le protocole. Le patient doit savoir qui contacter pour une fièvre ou une toxicité ; la continuité des soins vaut autant que la liste des examens prescrits.</p>

<section class="ilot" id="c95-14"><h2><span class="n">14</span> Synthèse de la décision</h2>
<figure id="c95-arbre-final"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" role="img" aria-label="Du signe à une décision documentée"><title>Du signe à une décision documentée</title><rect x="20" y="20" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="53" text-anchor="middle" font-size="18" fill="#17365d">Instabilité, infection, saignement ou signe neurologique ?</text><text x="340" y="92" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="95" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="128" text-anchor="middle" font-size="18" fill="#17365d">Soins urgents + prélèvements adaptés en parallèle</text><text x="340" y="167" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="170" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="203" text-anchor="middle" font-size="18" fill="#17365d">Morphologie + cytométrie + génétique + contexte</text><text x="340" y="242" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="245" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="278" text-anchor="middle" font-size="18" fill="#17365d">Classification intégrée et critères de lignée explicites</text><text x="340" y="317" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="320" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="353" text-anchor="middle" font-size="18" fill="#17365d">Protocole spécialisé, réponse, MRD et consolidation</text><text x="340" y="392" text-anchor="middle" font-size="21" fill="#92400e">↓</text><rect x="20" y="395" width="640" height="54" rx="8" fill="#fff7ed" stroke="#92400e"/><text x="340" y="428" text-anchor="middle" font-size="18" fill="#17365d">Suivi de la maladie, des toxicités et du projet de vie</text></svg><figcaption><b>Du signe à une décision documentée.</b> Les étapes sont reliées, mais l’urgence ne doit pas attendre la fin du bilan classificatoire. Une réévaluation peut ramener à une étape antérieure. Diagramme causal pédagogique non anatomique ; les sources de la section en précisent les limites.</figcaption></figure>
<p>Chez l’homme de la vignette, le diagnostic de LAPM B/myéloïde suppose que les deux profils soient définissants et que les catégories concurrentes aient été examinées. L’hémorragie, l’infection et la lyse sont évaluées avant le choix complet de l’induction. Le protocole, la stratégie de MRD et l’éventuelle greffe sont ensuite discutés à partir de la biologie et de la réponse, avec information du patient.</p>
<ul><li>Un code non précisé ne prouve pas une ambiguïté biologique ; documenter ce qui est connu.</li><li>Un marqueur positif ne définit pas à lui seul une seconde lignée ; vérifier intensité, combinaison et population.</li><li>Le seuil de 20 % propre aux LALA ne remplace pas les règles des autres leucémies ni la reconnaissance d’une urgence.</li><li>Une préférence issue de cohortes guide la discussion, sans se transformer en prescription universelle.</li><li>Une RC morphologique, une MRD négative et une guérison ne sont pas synonymes.</li><li>Les chiffres de survie, l’autorisation suisse et le remboursement répondent à des questions distinctes.</li></ul>
<p>Les fiches, les cinq cas d’application et les six sciences fondamentales reprennent ces décisions avec leurs mécanismes. Les références sont liées aux affirmations ; les lectures limitées et les données non disponibles restent signalées. Le contenu a fait l’objet d’une auto-relecture assistée par intelligence artificielle, sans prétendre à une validation médicale humaine indépendante.</p>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="c95-e-1"><h2><span class="n">e-1</span> Prescrire selon la question clinique</h2>
<p>Le bilan initial doit fournir une réponse assez rapide pour les urgences et assez complète pour la classification. Une collection de tests sans question peut retarder l’interprétation ; une analyse trop étroite peut manquer une catégorie déterminante. Le centre coordonne la disponibilité des cellules et les priorités du laboratoire.</p>
<table class="t"><thead><tr><th>Question</th><th>Examen</th><th>Ce que le résultat ne dit pas seul</th></tr></thead><tbody><tr><td>Existe-t-il une cytopénie ou une population circulante anormale ?</td><td>Numération, différentiel, frottis.</td><td>Une numération normale ou sans blaste ne démontre pas une moelle normale.</td></tr><tr><td>Quelle population médullaire est présente ?</td><td>Aspiration, morphologie ; biopsie selon contexte/qualité.</td><td>Le pourcentage de blastes ne suffit pas à attribuer la lignée.</td></tr><tr><td>Quelles lignées sont définies ?</td><td>Cytométrie avec panel, contrôles et marqueurs intracellulaires adaptés.</td><td>CD13, CD33, CD7 ou CD34 isolés ne font pas une LAPM.</td></tr><tr><td>Une catégorie génétique change-t-elle le diagnostic ?</td><td>Caryotype, FISH et analyses moléculaires hiérarchisées.</td><td>Un test ciblé négatif n’exclut pas toute anomalie génétique.</td></tr><tr><td>Y a-t-il coagulopathie ou risque de lyse ?</td><td>Plaquettes/coagulation ; urate, ions, créatinine, LDH, diurèse.</td><td>Un urate normal ne suffit pas à exclure toutes les composantes de lyse.</td></tr><tr><td>Existe-t-il une atteinte extramédullaire ou neurologique ?</td><td>Examen et imagerie/prélèvements ciblés ; bilan du système nerveux selon protocole.</td><td>Une TDM ne remplace pas la caractérisation cellulaire ; ponction lombaire non automatique si risque procédural.</td></tr><tr><td>Comment suivre la réponse ?</td><td>Moelle et MRD à temps définis, avec cible et sensibilité documentées.</td><td>Une MRD négative n’équivaut pas à absence absolue de maladie.</td></tr></tbody></table>
<p>Les prélèvements de référence sont particulièrement utiles avant le traitement lorsque cela est réalisable sans retarder les soins indispensables. Ils permettent de conserver le phénotype initial, une cible moléculaire et les éléments de comparaison à la rechute. Un traitement déjà administré doit être signalé au laboratoire.</p>
<p>Le bilan préthérapeutique explore aussi les fonctions d’organe et les risques infectieux selon le protocole. Le typage et la recherche de donneur se discutent si une allogreffe est envisagée ; ils ne transforment pas à eux seuls la greffe en décision déjà acquise. La pertinence du test dépend de la stratégie qu’il peut modifier.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S301] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">[S302] Akute Lymphatische Leukämie (ALL) — Onkopedia</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S304] Khoury et al., WHO-HAEM5 : myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2072-6694/17/5/871" target="_blank" rel="noopener">[S305] Acute Leukemia of Ambiguous Lineage: Diagnosis and Evaluation by Flow Cytometry | MDPI</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">[S303] Acute leukemia of ambiguous lineage: the known and the uncertain - PMC</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S315] FI suisse Fasturtec</a>.</p></div></section>
<section class="ilot" id="c95-e-2"><h2><span class="n">e-2</span> Lire un chiffre avec son unité et sa finalité</h2>
<p>Les repères HUG 2019 lus pour l’adulte sont Hb140–180 g/L chez l’homme et120–160 g/L chez la femme, leucocytes4–11 G/L, plaquettes150–350 G/L. Ils servent à comprendre le bilan et restent datés ; les intervalles du laboratoire du patient prévalent. Ils ne sont ni des normes pédiatriques ni des seuils transfusionnels.</p>
<table class="t"><thead><tr><th>Nombre</th><th>Objet mesuré</th><th>Erreur à éviter</th></tr></thead><tbody><tr><td>≥ 20 %</td><td>Total de blastes néoplasiques pour LALA dans les cadres étudiés.</td><td>Le transférer à toute LMA génétiquement définie ou en faire un préalable à l’urgence LAP.</td></tr><tr><td>>50 % de l’intensité normale</td><td>Repère OMS de certains marqueurs, dont <button class="w" data-k="c95-cytometrie">MPO</button>/<button class="w" data-k="c95-crit-t">CD3</button>/CD19 selon contrôles appropriés.</td><td>Le lire comme50 % des cellules positives.</td></tr><tr><td>5 %</td><td>Seuil <button class="w" data-k="c95-who-icc">ICC</button> de composante mineure dans le contexte bilinéaire décrit.</td><td>L’imposer à l’OMS ou compter des précurseurs normaux comme leucémiques.</td></tr><tr><td>&lt; 5 % de blastes médullaires</td><td>Un des éléments de RC morphologique/hématologique, selon protocole.</td><td>En déduire MRD négative ou guérison.</td></tr><tr><td>10⁻⁴ =0,01 %</td><td>Sensibilité moléculaire minimale de MRD soulignée par Onkopedia LLA.</td><td>La confondre avec0,1 % =10⁻³ de certaines indications thérapeutiques.</td></tr><tr><td>100 G/L de leucocytes</td><td>Repère souvent associé à l’hyperleucocytose.</td><td>Exclure une leucostase symptomatique sous ce chiffre.</td></tr><tr><td>0,20 mg/kg/j</td><td>Dose pondérale de rasburicase dans la fiche suisse.</td><td>Confondre mg/kg, mg/m² et mg/mL.</td></tr></tbody></table>
<p><b>Exemple fictif :</b> dans un prélèvement de 200 cellules évaluables, 60 blastes représentent30 %. Ce calcul suppose que le dénominateur et les cellules aient été correctement définis. Il ne donne ni l’intensité de <button class="w" data-k="c95-cytometrie">MPO</button> ni la proportion d’une lignée sur un diagramme différent.</p>
<p>Autre exemple : une MRD de 0,02 % dépasse0,01 % et vaut2×10<sup>−4</sup>. La décision dépend pourtant du temps du protocole, de la méthode et du seuil clinique retenu ; le calcul ne suffit pas à choisir le traitement. Une incertitude préanalytique ou un échantillon pauvre doit rester visible dans le compte rendu.</p>
