<!-- Proposition MAJ-06 — remplace la phrase du cas récapitulatif de c77-11 « Le bilan mammaire (mammographie, échographie) est normal, le scanner thoraco-abdomino-pelvien est normal. » (C77_b.html). Source : [S4] Onkopedia CUP-Syndrom 2025, Tabelle 6 (« Befall axillärer Lymphknoten bei Frauen : Skelettszintigraphie, MRT der Mammae ») et § 5.1.1.2. -->
Le bilan mammaire est normal : mammographie, échographie, puis IRM mammaire. La ligne directrice exige cette IRM devant toute adénopathie axillaire de la femme, avec une scintigraphie osseuse, avant de retenir un CUP « sein-like » [S4]. Le scanner thoraco-abdomino-pelvien est normal.
