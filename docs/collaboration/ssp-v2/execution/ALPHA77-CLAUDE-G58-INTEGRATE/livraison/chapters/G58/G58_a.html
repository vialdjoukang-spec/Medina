<p>Dans cette <b>vignette fictive</b>, un homme de 58 ans, sans diabète connu, consulte pour une douleur brûlante du pied droit apparue il y a trois semaines. Dix jours plus tard, il ne relève plus la pointe du pied droit ; la semaine dernière, la face interne de la main gauche est devenue engourdie. Il a perdu 6 kg et rapporte une fatigue persistante.</p>
<p>Deux nerfs distincts, dans deux membres différents, ont été atteints à des moments différents : le tableau n’est ni une polyneuropathie symétrique, ni une compression locale. Il évoque une <button class="w" data-k="g58-mnm">mononévrite multiple</button>, dont la cause la plus redoutable est une <button class="w" data-k="g58-vasculites">vascularite</button>, parce qu’un retard de traitement expose à des déficits permanents et au décès. Le médecin doit donc reconnaître le motif, chercher l’atteinte d’autres organes, obtenir la preuve de l’atteinte du nerf et débuter l’immunosuppression sans attendre un schéma complet.</p>
<p>Le code G58 rassemble aussi une situation très différente : la douleur d’une paroi thoracique ou abdominale en bande, la <button class="w" data-k="g58-intercostale">névralgie intercostale</button>. Là, la question n’est plus de sauver un organe, mais de ne pas manquer la cause (chirurgie thoracique, zona, fracture costale, compression) et de soulager une douleur neuropathique souvent longue.</p>
<div class="key"><b>À retenir.</b> Une atteinte nerveuse multifocale, asymétrique et douloureuse est une vascularite jusqu’à preuve du contraire. Une douleur en bande de la paroi est une atteinte d’un nerf intercostal à documenter par sa cause. Le cours traite ces deux familles dans cet ordre de gravité.</div>
</section>
<section class="ilot" id="g58-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>La catégorie G58 de la classification internationale des maladies, dans sa version allemande 2024 (CIM-10-GM) publiée par l’Institut fédéral des médicaments et dispositifs médicaux (BfArM) et reprise en français par l’Office fédéral de la statistique (OFS), regroupe les mononeuropathies qui ne relèvent ni du membre supérieur ni du membre inférieur. Quatre sous-catégories existent : la névrite intercostale (G58.0), la mononévrite de sièges multiples (G58.7), les autres mononévrites précisées (G58.8) et la mononévrite sans précision (G58.9). Les <button class="w" data-k="g58-cim">exclusions et les codes voisins</button> évitent de classer ici une lésion traumatique aiguë ou une mononeuropathie diabétique.</p>
<p>Pour le clinicien, deux entités dominent. La <b>mononévrite multiple</b> est une neuropathie périphérique asymétrique qui touche plusieurs nerfs individuels ; elle est fréquemment associée aux vascularites et à d’autres affections dysimmunitaires. Elle correspond au schéma classique de l’ischémie de nerfs individuels. La <b>névralgie intercostale</b> est une douleur neuropathique dans le territoire d’un ou plusieurs nerfs intercostaux.</p>
<p>La <b>neuropathie vasculitique non systémique</b>, ou NSVN, est une vascularite limitée aux vaisseaux du nerf (les <button class="w" data-k="g58-vasanervorum">vasa nervorum</button>), sans atteinte d’un autre organe. Les lignes directrices de la <button class="w" data-k="g58-pns">Peripheral Nerve Society de 2010</button> y rangent aussi la radiculoplexopathie non diabétique. Le tableau suivant situe les vascularites associées à une neuropathie. Il sert à choisir la direction du bilan : une cause primaire impose l’évaluation des autres organes, une cause secondaire impose de traiter la maladie de fond.</p>
<table class="t"><thead><tr><th>Groupe</th><th>Exemples</th><th>Conséquence pour le bilan</th></tr></thead><tbody><tr><td>Vascularites primaires systémiques</td><td>Périartérite noueuse (PAN) ; vascularites associées aux <button class="w" data-k="g58-anca">ANCA</button> : granulomatose avec polyangéite (GPA), polyangéite microscopique (MPA), granulomatose éosinophilique avec polyangéite (EGPA)</td><td>Rechercher poumon, rein, peau, cœur et œil ; doser les ANCA</td></tr><tr><td>Vascularites secondaires</td><td>Polyarthrite rhumatoïde, syndrome de Sjögren, lupus, sclérodermie, sarcoïdose, <button class="w" data-k="g58-cryo">cryoglobulinémie</button> (hépatite C), infections (VHB, VHC, VIH), médicaments, néoplasies</td><td>Identifier et traiter la maladie ou l’agent en cause</td></tr><tr><td>Neuropathie vasculitique non systémique</td><td>Vascularite lymphocytaire des petites et moyennes artères du nerf, organe unique</td><td>Exclure toute autre atteinte d’organe avant de poser le diagnostic</td></tr></tbody></table>
<p>Lecture du tableau : la neuropathie n’est pas une maladie à part, mais un mode de présentation de maladies différentes, et le nom de la maladie détermine le traitement. Il s’appuie sur les revues de Ruffer et coll. (2024) et de Blaes (2015), lues dans leur texte intégral.</p>
<p>Le <b>degré de certitude</b> est codifié par la <button class="w" data-k="g58-pns">Peripheral Nerve Society</button> (2010, résumé lu). Cette codification distingue ce que la biopsie démontre de ce que la clinique laisse seulement penser, ce qui évite d’afficher une certitude que le prélèvement ne donne pas. Une série de 14 patients brésiliens avec NSVN illustre cette limite : la vascularite était certaine chez 2, probable chez 6 et possible chez 6.</p>
<table class="t"><thead><tr><th>Niveau</th><th>Contenu</th><th>Remarque</th></tr></thead><tbody><tr><td>Vascularite certaine</td><td>Inflammation de la paroi vasculaire accompagnée de lésions vasculaires, en l’absence d’imitateur (lymphome, granulomatose lymphomatoïde, amylose)</td><td>Correspond à la preuve histologique</td></tr><tr><td>Vascularite probable</td><td>Dépôts vasculaires d’IgM, de C3 ou de fibrinogène en immunofluorescence directe ; dépôts d’hémosidérine ; perte asymétrique des fibres ; dégénérescence axonale active marquée ; nécrose, régénération ou infarctus des myofibres dans la biopsie du court péronier</td><td>Prédicteurs de classe II/III (Good Practice Points)</td></tr><tr><td>Cliniquement probable, sans biopsie</td><td>Atteinte sensitive ou sensitivomotrice, asymétrique ou multifocale, surtout distale aux membres inférieurs, douloureuse, d’évolution aiguë par poussées, avec électrophysiologie non démyélinisante</td><td>Autorise un traitement lorsque la biopsie n’est pas réalisable</td></tr></tbody></table>
<div class="trap"><span class="k">Piège</span> Un prélèvement qui ne montre pas de vascularite certaine n’exclut pas la maladie : la sensibilité de la biopsie nerveuse pour une vascularite certaine ne dépasse pas 50 à 60 % (Koike), car les lésions sont focales et le nerf prélevé peut être épargné. Le médecin lit la biopsie avec la clinique, l’électrophysiologie et le bilan général, et ne retient pas un résultat « négatif » comme preuve d’absence.</div>

<section class="ilot" id="g58-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>Les vascularites systémiques surviennent à environ 60 à 140 cas par million et par an, dont environ 30 % de formes secondaires ; la périartérite noueuse reste rare, de 0,1 à 1,6 cas par million et par an en Europe. Une vascularite est trouvée dans environ 1 % des biopsies nerveuses pratiquées pour une neuropathie inexpliquée (Blaes, 2015). Aucune donnée suisse n’a été retrouvée pour la mononévrite multiple ni pour la névralgie intercostale : cette <button class="w" data-k="g58-lacunes">lacune</button> est nommée, et les chiffres ci-dessous sont européens, asiatiques ou issus de revues.</p>
<p>La neuropathie est un événement fréquent dans certaines vascularites. Le tableau donne des <b>fourchettes</b> et non des valeurs uniques : les séries divergent selon le recrutement, la définition de la neuropathie et la période.</p>
<table class="t"><thead><tr><th>Maladie</th><th>Fréquence de la neuropathie (Blaes, 2015)</th><th>Autres séries</th></tr></thead><tbody><tr><td>Périartérite noueuse</td><td>65–85 %</td><td>Environ 50 % selon le texte, jusqu’à 50 % selon le tableau 1 (Ruffer, 2024)</td></tr><tr><td>EGPA</td><td>65–80 %</td><td>Jusqu’à 80 %, surtout avec MPO-ANCA ; 77 % dans des études antérieures (Koike, 2022)</td></tr><tr><td>GPA</td><td>5–50 %</td><td>10–25 % pour GPA et MPA réunies (Ruffer) ; 17 % (Koike)</td></tr><tr><td>MPA</td><td>6–75 %</td><td>58 % (Koike)</td></tr><tr><td>Cryoglobulinémie</td><td>30–70 %</td><td>17–80 % (Ruffer)</td></tr><tr><td>Polyarthrite rhumatoïde</td><td>15–70 %</td><td>35–63 % pour la vascularite rhumatoïde (Ruffer)</td></tr><tr><td>Lupus ; Sjögren ; sclérodermie</td><td>20–27 % ; 30–45 % ; 5–30 %</td><td>—</td></tr><tr><td>Infections (VHB, VHC, VIH) ; sarcoïdose</td><td>5–70 % ; 5–10 %</td><td>—</td></tr></tbody></table>
<p>Cette dispersion enseigne une règle de prudence : la <b>présence</b> d’une neuropathie ne permet pas d’estimer la probabilité d’une maladie précise, mais son <b>absence</b> ne l’exclut pas non plus. Le clinicien raisonne à partir du tableau clinique global.</p>
<p>Pour la névralgie intercostale, la revue de Shamoun et coll. (2026) estime la prévalence à environ 15 % dans le contexte étudié ; 3 à 22 % des adressages en centre de la douleur concernent une douleur thoracique ; la douleur chronique après chirurgie thoracique atteint environ 38 % à 12 mois, avec une composante neuropathique de 29 à 33 % ; jusqu’à 80 % des fractures de côtes traumatiques sont concernées. Les patients consultent en moyenne environ cinq médecins avant le diagnostic : le retard est la règle. Le syndrome de piégeage des nerfs cutanés antérieurs (ACNES) touche surtout les femmes (77 % des 260 patients d’une cohorte néerlandaise, âge moyen 42 ans).</p>
<p>Le pronostic dépend de la cause. Dans les vascularites à ANCA, environ 15 % des patients ont une neuropathie et environ 40 % d’entre eux s’améliorent (Blaes) ; chez des patients avec MPA ou GPA, la mortalité à cinq ans est de 25 % avec neuropathie et de 18 % sans, différence non significative (Koike). La neuropathie n’est pas associée à davantage d’atteintes viscérales menaçantes (Ruffer). Dans la périartérite noueuse, une atteinte cardiaque ou du système nerveux central assombrit le pronostic.</p>
