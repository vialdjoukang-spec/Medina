<div class="chap-body">
<section class="ilot" id="e30-1"><h2><span class="n">1</span>Le signe, son âge et son tempo</h2><p>Une fille fictive de six ans et demi développe des seins. Un garçon fictif de quatorze ans et demi s’inquiète de ne pas changer comme ses camarades. Les deux situations justifient une évaluation, mais ni une injection automatique ni une simple rassurance sur l’histoire familiale. L’âge oriente ; le tempo, la croissance, les autres signes et le contexte donnent leur sens [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Chez la fille, le début central est généralement marqué par le développement mammaire ; chez le garçon, par l’augmentation du volume testiculaire. Une pilosité pubienne isolée peut provenir de la surrénale et ne prouve pas la même activation. Une ménarche est un signe plus tardif, pas le début habituel du processus [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Le raisonnement rejoint les situations <button class="w" data-k="e30-profiles">PROFILES</button> de croissance et puberté inhabituelles, ainsi que l’examen génital expliqué et proportionné. Le rapprochement avec E30 est pédagogique, sans correspondance officielle entre code et question fédérale. Les vignettes sont originales [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Un âge inhabituel déclenche une enquête. La progression et la croissance distinguent souvent mieux les hypothèses qu’un signe isolé [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-2"><h2><span class="n">2</span>Définition et périmètre de la leçon</h2><p>E30 désigne les anomalies de la puberté non classées ailleurs. Le cours distingue retard, précocité, variantes isolées et anomalie encore non précisée. Il enseigne aussi les diagnostics voisins nécessaires au raisonnement, sans prétendre les faire tous entrer dans E30 ni modifier leurs autres chapitres [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>].</p>
<p>La puberté centrale correspond à la réactivation de l’axe hypothalamo-hypophyso-gonadique. Une production périphérique de stéroïdes sexuels peut provoquer certains signes sans cette activation. Le retard peut refléter une maturation constitutionnelle, une inhibition fonctionnelle liée à une maladie ou à un déficit énergétique, ou un déficit permanent d’origine centrale ou gonadique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>La distinction clinique et le code ne sont pas la même question. Les notes allemandes de la modification 2024 excluent la précocité centrale de <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.1</a> vers <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E22.8</a> ; elles excluent aussi l’hyperplasie congénitale surrénale et le syndrome de <button class="w" data-k="e30-syndrome">McCune-Albright</button> vers leurs catégories. Ces notes sont confrontées aux libellés suisses locaux, sans certification du codage individuel 2026 [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>].</p>
<div class="key"><b>À retenir.</b> Le mécanisme et l’étiologie guident les soins. « Précoce » ne signifie pas nécessairement <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.1</a> après diagnostic précis [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-3"><h2><span class="n">3</span>Épidémiologie suisse puis européenne</h2><p>Les études longitudinales zurichoises publiées en 1983 décrivaient 142 filles et 142 garçons suivis dans la période 1954–1980. Chez les filles, la ménarche moyenne était à 13,4 ans, avec écart-type d’un an ; la durée et l’ordre de certains signes variaient largement. Ce sont des données historiques de développement, pas des normes suisses actuelles ou une incidence des anomalies E30 [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618891/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618890/" target="_blank" rel="noopener">S10</a>].</p>
<p>Une cohorte nationale danoise publiée en 2020 comptait 8596 enfants enregistrés entre 1998 et 2017 avec précocité centrale, thélarche prématurée ou adrénarche prématurée. Elle ne comptait donc pas seulement des formes centrales. Dans le groupe défini par le registre comme d’origine danoise, l’incidence diagnostique annuelle moyenne de forme centrale était de 9,2 pour 10 000 filles et 0,9 pour 10 000 garçons [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7550972/" target="_blank" rel="noopener">S21</a>].</p>
<p>Les codes n’avaient pas tous été validés sur dossier, et une suspicion initiale pouvait ne pas avoir été corrigée après exploration. L’adressage et la sensibilisation ont pu évoluer. Ces limites empêchent de confondre taux d’enregistrement, mécanisme biologique et fréquence suisse actuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7550972/" target="_blank" rel="noopener">S21</a>].</p>
<p>Les séries européennes de retard pubertaire sont souvent dominées par les garçons et les consultations spécialisées. Leurs proportions de retard constitutionnel ne deviennent pas une probabilité automatique pour tout adolescent. Aucune incidence suisse contemporaine de toute E30 et de chaque sous-groupe n’est établie dans les lectures [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Les cohortes suisses anciennes décrivent le développement ; les registres danois décrivent des diagnostics dans une période donnée. Aucun chiffre ne remplace une incidence suisse E30 non établie [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618891/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618890/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7550972/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-4"><h2><span class="n">4</span>Du fonctionnement normal au trouble</h2><p>Le signal hypothalamique pulsatile stimule la sécrétion hypophysaire des gonadotrophines. Celles-ci activent les gonades et la production de stéroïdes sexuels. Le développement des caractères secondaires, la poussée staturale et la maturation osseuse sont liés, mais n’atteignent pas tous leur maximum au même moment [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<p>Dans le testicule, les cellules de Leydig produisent la testostérone en réponse au signal lutéinisant ; les cellules de Sertoli soutiennent le compartiment germinal et répondent au signal folliculostimulant. Dans l’ovaire, les cellules folliculaires coopèrent à la maturation et à la production de stéroïdes. L’inhibine freine surtout la sécrétion folliculostimulante ; ce n’est pas un raccourci selon lequel toute baisse de cette hormone fait directement baisser la testostérone [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
<p>Les androgènes surrénaliens expliquent l’adrénarche : odeur corporelle, pilosité et acné peuvent apparaître sans gonadarche. À l’inverse, une activation gonadique centrale peut commencer avant que tous ces signes soient présents. La pilosité seule ne mesure donc pas l’état de l’axe central [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Un excès précoce de stéroïdes peut accélérer croissance et âge osseux, puis réduire le potentiel statural. Le manque de stéroïdes peut retarder la poussée et compromettre l’acquisition osseuse. Les œstrogènes participent à la maturation des cartilages de croissance dans les deux sexes ; l’aromatisation de la testostérone compte aussi [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Adrénarche et gonadarche sont deux processus. Une grande taille initiale n’exclut pas un risque de petite taille finale si la maturation est accélérée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-5"><h2><span class="n">5</span>Classer les mécanismes et leurs causes</h2><table class="t" data-e30-table="1"><thead><tr><th>Profil</th><th>Hypothèses</th><th>Élément utile</th></tr></thead><tbody><tr><td>Précoce central</td><td>Activation prématurée idiopathique, familiale ou liée à une atteinte neurologique</td><td>Progression des signes et réponse gonadotrope ; rechercher signes neurologiques.</td></tr><tr><td>Précoce périphérique</td><td>Kyste/tumeur gonadique, cause surrénale, hormone chorionique, exposition, mutation activatrice ou hypothyroïdie sévère</td><td>Stéroïdes élevés avec gonadotrophines freinées ; profil orienté et imagerie selon la cause.</td></tr><tr><td>Retard avec gonadotrophines élevées</td><td>Insuffisance gonadique, anomalie chromosomique ou séquelle acquise</td><td>Stéroïdes insuffisants et réponse hypophysaire élevée selon âge/stade.</td></tr><tr><td>Retard avec signal bas/inadapté</td><td>Retard constitutionnel, déficit central permanent ou inhibition fonctionnelle</td><td>Croissance, nutrition, maladie, autres axes, contexte néonatal et progression.</td></tr><tr><td>Signe isolé</td><td>Thélarche ou adrénarche prématurée, lipomastie</td><td>Examen du tissu, autres signes et évolution ; ne pas conclure sur la seule apparence.</td></tr></tbody></table>
<p>Une maladie cœliaque ou inflammatoire, une restriction alimentaire, une faible disponibilité énergétique, un exercice excessif, des médicaments et d’autres endocrinopathies peuvent freiner la maturation. Une croissance anormale ou l’arrêt de progression demande de reconsidérer un diagnostic constitutionnel présumé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>Une histoire familiale de puberté tardive n’exclut pas un déficit congénital, et une histoire de précocité n’exclut pas une lésion neurologique. Une cause déjà connue comme Turner, Klinefelter ou une anomalie surrénale garde son parcours propre [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> La distinction central/périphérique et gonadique/centrale choisit les explorations ; l’histoire familiale oriente sans trancher [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-6"><h2><span class="n">6</span>Anamnèse : croissance, chronologie et vécu</h2><p>Reconstituer l’âge du premier signe, sa vitesse, les saignements, la croissance et les changements récents. Relire les courbes plutôt que demander seulement « a-t-il grandi ? ». Préciser taille parentale, puberté des apparentés et antécédents de traitement. Une photo intime n’est pas nécessaire pour recueillir la chronologie [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Rechercher céphalées, troubles visuels, crises, antécédents neurologiques, irradiation, chimiothérapie et exposition à des crèmes ou hormones de l’entourage. Dans le retard, préciser alimentation, poids, activité physique, maladie chronique, symptômes digestifs, médicaments et signes d’autres déficits. Micropénis, cryptorchidie bilatérale et trouble de l’odorat orientent vers un déficit central congénital, sans être toujours présents [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Chez la fille, préciser développement mammaire, cycles ou absence de règles et contexte gynécologique ; un saignement prépubère ne devient pas automatiquement une ménarche. Chez le garçon, l’augmentation testiculaire et la virilisation ne sont pas toujours parallèles [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/33687345/" target="_blank" rel="noopener">S16</a>].</p>
<p>Demander ce qui préoccupe l’adolescent : décalage avec les pairs, harcèlement, image corporelle, anxiété et projet de vie. Expliquer les échanges confidentiels et leurs limites selon le cadre clinique ; adapter l’information et le consentement à la maturité. L’apparence ou le caryotype ne déterminent pas une identité de genre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> La courbe et le tempo sont des données cliniques ; la détresse et les obstacles aux soins font aussi partie de l’indication de suivi [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-7"><h2><span class="n">7</span>Examen clinique et sémiologie</h2><div data-semiology-clinical="E30"><p>La sémiologie commence par taille, poids, vitesse staturale, proportions, pression et état général. Décrire le développement avec les <button class="w" data-k="e30-stades">stades de Tanner et leur méthode</button>, en distinguant seins, organes génitaux et pilosité. La pilosité ne remplace pas une mesure de développement gonadique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Chez la fille, distinguer tissu mammaire et adiposité peut nécessiter une palpation expliquée. Chez le garçon, mesurer le volume testiculaire avec un outil connu et rechercher asymétrie, masse ou antécédent de cryptorchidie. Le seuil d’un orchidomètre n’est pas une conversion automatique d’un volume échographique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>L’examen génital est proportionné à la question, expliqué et réalisé avec accord approprié et respect de l’intimité. Réduire les répétitions et ne pas tirer de conclusion sur une activité sexuelle à partir de l’hymen. Les signes neurologiques et syndromiques sont recherchés selon l’hypothèse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
<p>Une morphologie seule ne confirme pas la cause. Les neuf volets de <button class="w" data-k="e30-semio">sémiologie fondamentale et analytique</button> développent le lien entre signe, mécanisme, examen et décision ; aucune sensibilité chiffrée universelle de l’examen n’est inventée.</p>
</div><div class="key"><b>À retenir.</b> La méthode, le stade et le suivi donnent un sens au volume ou au signe. L’examen protège aussi l’intimité et la relation de soin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-7">Essentiel de cette partie</button></section>

<section class="ilot" id="e30-8"><h2><span class="n">8</span>Diagnostic : une séquence et des seuils contextualisés</h2><p>Confirmer d’abord le signe et sa chronologie, apprécier progression et croissance, puis rechercher la cause. Les repères usuels de précocité sont avant huit ans chez la fille et neuf ans chez le garçon. L’absence de seins à treize ans ou de croissance testiculaire pubertaire à quatorze ans justifie une évaluation selon <button class="w" data-k="e30-europe">Endo-ERN</button> ; un arrêt ou une progression inadéquate peut justifier une enquête sans attendre ces âges [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Le profil comprend les <button class="w" data-k="e30-gonadotrophines">gonadotrophines et stéroïdes sexuels</button> avec âge, stade, horaire et méthode. Une valeur basse du signal lutéinisant ne suffit pas à exclure une activation centrale débutante. Les dosages peu sensibles et les fluctuations sont particulièrement importants au début [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>Une stimulation peut aider : le guide danois 2025 cite comme indicatifs un pic lutéinisant &gt;5 unités internationales/L et/ou un rapport lutéinisant/folliculostimulant &gt;0,6 à trente minutes. Ce n’est pas un seuil universel ; des enfants de deux–trois ans avec thélarche isolée peuvent dépasser le pic sans forme centrale progressive [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Dans le retard, le test ne distingue pas seul maturation constitutionnelle et déficit central permanent. L’évaluation longitudinale, les autres causes, les marqueurs et éventuellement la génétique spécialisée complètent le bilan. Le diagnostic constitutionnel reste une conclusion suivie, pas une étiquette rassurante fondée seulement sur la famille [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Le seuil choisit une exploration et garde sa méthode ; il ne remplace pas âge, progression et contexte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-8">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-9"><h2><span class="n">9</span>Gravité, drapeaux rouges et imagerie</h2><p>Céphalées inhabituelles ou progressives, troubles visuels, vomissements neurologiques, crises ou déficit focal imposent une évaluation rapide. Une virilisation très rapide, une masse ou une asymétrie testiculaire nette font rechercher une production périphérique ou une tumeur. Un saignement prépubère nécessite d’examiner aussi infection, corps étranger, traumatisme et situation de protection de l’enfant ; il ne doit pas être attribué sans examen à la puberté [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>Le guide européen danois 2025 propose une imagerie cérébrale pour les filles centrales de moins de six ans, une discussion spécialisée à six–huit ans, et pour tous les garçons centraux avant neuf ans. Les recommandations italiennes publiées en 2024/2025 demandent aussi l’imagerie chez les garçons centraux [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Une revue européenne 2026 discute des données plus sélectives chez les garçons de huit–neuf ans sans signes neurologiques. Ses cohortes récentes excluent certains antécédents et ses propositions nécessitent validation ; elle reprend aussi une recommandation américaine 2026. Ce désaccord n’autorise ni à ignorer un drapeau rouge ni à exclure une lésion sur la famille seule. La <button class="w" data-k="e30-imagerie">décision d’imagerie actualisée</button> appartient au parcours spécialisé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>La FI Lucrin mentionne un scanner cérébral dans son bilan initial. Les sources cliniques privilégient le raisonnement par résonance magnétique ; ce libellé de produit n’impose pas une irradiation automatique. L’équipe confronte indication, urgence, méthode et FI [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> Un signe neurologique, une progression explosive ou une masse change l’urgence. Les débats de dépistage d’une lésion ne concernent pas une situation avec drapeau rouge [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-9">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-10"><h2><span class="n">10</span>Traitement : parfois surveiller, parfois freiner ou induire</h2><p>La cause et la conséquence guident la décision. Une variante isolée stable peut demander une surveillance plutôt qu’un médicament ; une production périphérique demande le traitement de sa cause. Les agonistes à action prolongée du signal hypothalamique suppriment l’activation centrale après une phase initiale de stimulation ; ils ne traitent pas automatiquement une source périphérique autonome [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Dans une précocité centrale progressive, le bénéfice statural est mieux établi pour les débuts très précoces. À six–huit ans chez la fille, tempo, âge osseux, taille attendue et vécu orientent une décision partagée ; tous les enfants n’ont pas le même bénéfice. Les FI <button class="w" data-k="e30-lucrin">Lucrin Dépôt 3,75 mg mensuel</button> et <button class="w" data-k="e30-pamorelin">Pamorelin LA 22,5 mg</button> précisent leurs indications, voies et intervalles, qui ne se substituent pas l’un à l’autre [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Dans le retard, traiter d’abord les causes fonctionnelles accessibles et accompagner le vécu. En déficit permanent connu, une induction à un âge proche des pairs peut être envisagée sans attendre le seuil général de retard : environ onze ans chez la fille et douze ans chez le garçon dans les recommandations européennes, avec individualisation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<p>L’estradiol est augmenté progressivement ; le protocole d’induction n’est pas le schéma d’une contraception combinée. La testostérone peut induire les caractères chez le garçon, mais ne restaure pas à elle seule croissance testiculaire et spermatogenèse en déficit central. L’alternative par gonadotropines et le projet de fertilité sont discutés. Les monographies distinguent <button class="w" data-k="e30-testoviron">l’énanthate suisse</button>, <button class="w" data-k="e30-estradiol">l’induction œstrogénique et sa limite de produit</button> et <button class="w" data-k="e30-undecanoate">l’undécanoate adulte</button> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> Surveiller, freiner et induire répondent à trois situations différentes. L’objectif est une maturation adaptée, pas une dose adulte immédiate [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-10">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-11"><h2><span class="n">11</span>Suivi, complications et pronostic</h2><p>Le suivi documente taille, vitesse, poids, stade, effets attendus et indésirables, prise réelle et vécu. Sous suppression centrale, une progression persistante peut indiquer erreur de diagnostic, problème d’administration ou suppression insuffisante ; elle ne se corrige pas par un changement improvisé d’intervalle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>La FI Pamorelin prévoit des contrôles hormonaux un à deux mois après la première injection et la taille tous les trois–six mois. Les guides proposent différents rythmes d’âge osseux selon question et situation ; aucun intervalle unique n’est attribué à toutes les sources. En induction, un suivi clinique tous les trois–six mois adapte progression et tolérance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>La précocité progressive peut compromettre la taille finale ; le retard prolongé avec déficit hormonal peut compromettre acquisition osseuse et bien-être. La prédiction de taille conserve ses incertitudes et ne promet pas des centimètres identiques à tout enfant. Une histoire de traitement ne prouve ni infertilité future ni fertilité garantie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Après arrêt d’une suppression, le développement doit reprendre ; la famille connaît les raisons de recontacter le centre si l’évolution manque. Les déficits permanents nécessitent une transition vers la substitution adulte, l’éducation à l’autonomie et la discussion de fertilité. La décision d’arrêt confronte les limites des FI suisses et les critères cliniques, sans mélange caché d’âge chronologique et osseux [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Le suivi vérifie le sens de l’évolution et les effets. Une dose ou une date ne remplacent pas le contrôle de la maturation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-11">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-12"><h2><span class="n">12</span>Populations particulières et information</h2><p>Chez le petit enfant, la minipuberté et la thélarche isolée modifient l’interprétation hormonale. Un pic stimulé qui serait évocateur chez un enfant plus âgé n’a pas automatiquement le même sens à deux–trois ans. Les dosages et leur lecture doivent être adaptés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Chez l’enfant ayant un déficit connu, une anomalie chromosomique ou un traitement gonadotoxique, le suivi commence plus tôt. Une puberté spontanée initiale n’exclut pas une insuffisance secondaire de progression, notamment dans certains profils gonadiques. Taille petite ou grande et caryotype ne suffisent pas à prédire tous les besoins [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<p>En restriction alimentaire ou maladie inflammatoire, traiter la cause et les conséquences nutritionnelles est essentiel. Une induction ne remplace pas la restauration de santé générale. L’adolescent avec handicap ou difficultés cognitives reçoit une information et une éducation adaptées, avec soutien du réseau ; le besoin d’éducation à la santé sexuelle n’est pas effacé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>Grossesse possible, allaitement, maladie hépatique, rénale ou risque thromboembolique changent la vérification du produit. Les données adultes des FI ne sont pas des taux de risque pédiatriques. Un traitement hormonal substitutif n’est pas, par sa seule présence, un contraceptif. Confidentialité, consentement approprié et projet de vie accompagnent le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> L’âge, la cause connue, les autres maladies et les objectifs modifient le parcours ; les mêmes chiffres ne s’appliquent pas à tous [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-12">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-13"><h2><span class="n">13</span>Tous les sous-codes et contexte suisse</h2><table class="t" data-e30-table="1"><thead><tr><th>Code OFS local 2024</th><th>Libellé</th></tr></thead><tbody><tr><td>E30</td><td>Anomalies de la puberté, non classées ailleurs</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.0</a></td><td>Puberté retardée</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.1</a></td><td>Puberté précoce</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.8</a></td><td>Autres anomalies de la puberté</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.9</a></td><td>Anomalie de la puberté, sans précision</td></tr></tbody></table>
<p><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.0</a> inclut le retard constitutionnel dans les notes allemandes ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.8</a> inclut thélarche et pubarche prématurées. <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.1</a> ne reçoit pas par défaut une précocité centrale confirmée, qui est exclue vers <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E22.8</a> dans ces notes ; les causes surrénales ou syndromiques citées gardent leurs catégories propres [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>].</p>
<p>La brochure suisse 2021 évoque la prise en charge par l’assurance de base. Ce propos ancien ne certifie pas un remboursement individuel 2026, une autorisation hors indication pédiatrique ou une formulation disponible. Produit, indication, durée, critères et éventuel accord sont vérifiés à la date de prescription ; aucun statut administratif individuel n’est inventé [<a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<p>Le bilan génétique et l’examen intime suivent le cadre suisse actuel de consentement et de confidentialité ; les recommandations étrangères ne créent pas à elles seules une règle légale suisse. La leçon ne prétend pas établir une obligation spécifique de déclaration ou une couverture d’assurance pour tout E30 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Le code documente le diagnostic ; il ne choisit ni traitement ni remboursement. Le contexte administratif reste daté et individualisé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-13">Essentiel de cette partie</button><p><button class="w" data-k="e30-codes">Consulter les libellés et exclusions en détail</button></p>
</section>
<section class="ilot" id="e30-14"><h2><span class="n">14</span>Critères formels, paramètres et pièges</h2><p><b>Critères formels.</b> Les repères cliniques sont précocité avant huit/neuf ans, absence de seins à treize ans ou d’augmentation testiculaire pubertaire à quatorze selon <button class="w" data-k="e30-europe">Endo-ERN</button>, et progression inadéquate à tout âge pertinent. Une absence de ménarche à quinze ans avec développement, ou treize ans sans signes, mérite exploration ; l’aménorrhée peut avoir une cause différente du simple retard gonadique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/33687345/" target="_blank" rel="noopener">S16</a>].</p>
<p><b>Méthode et paramètres.</b> Le repère testiculaire ≥4 ml à l’orchidomètre ne remplace ni une mesure échographique ni les anciennes définitions 3/3,5 ml. Le guide allemand 2021 utilise 13,5 ans chez la fille, là où <button class="w" data-k="e30-europe">Endo-ERN</button> recommande évaluation à treize ; on n’attend pas ce délai s’il existe progression arrêtée ou maladie. Les pics gonadotropes et leur rapport gardent méthode, timing et âge [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/174-022l_S1_Pubertas-tarda-und-Hypogonadismus_2021-12.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618890/" target="_blank" rel="noopener">S10</a>].</p>
<p><b>Pièges.</b> Confondre pilosité et activation centrale ; exclure la précocité par une valeur basale basse ; diagnostiquer constitutionnel sur la famille seule ; traiter une cause périphérique avec un dépôt central sans bilan ; copier l’intervalle d’une autre préparation ; commencer une dose adulte pour induire ; assimiler substitution de testostérone et restauration de fertilité ; rassurer sur tout effet indésirable d’après une brochure ancienne [<a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<p>Pour l’examen, expliquer la question clinique, le test qui change la décision et le suivi est plus utile qu’un chiffre isolé. Aucun score E30 unique ni question officielle garantie n’est inventé [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Le stade, la méthode et la population font partie de chaque seuil. L’incertitude appelle une exploration ou un suivi explicite, pas une conclusion automatique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/174-022l_S1_Pubertas-tarda-und-Hypogonadismus_2021-12.pdf" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-14">Essentiel de cette partie</button></section>
<div class="src"><h3>Sources effectivement consultées</h3><ul data-justification-sources="1"><li><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] CIM-10-GM E30 et subdivisions</a> — 2024. Toutes entrées locales E30, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.0</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.1</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.8</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.9</a>. Limites : Libellés locaux 2024 ; aucune certification administrative 2026.</li><li><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">[S2] Notes CIM-10-GM E30 et E22.8</a> — 2024. Entrées <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.0</a>–<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.9</a>, inclusions/exclusions ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E22.8</a>. Limites : Notes allemandes confrontées aux libellés suisses, pas règles suisses détaillées certifiées 2026.</li><li><a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">[S3] Troubles de la puberté</a> — Page consultée 2026-11-02. Page clinique patient entière. Limites : Information aux patients, sans seuils de laboratoire ni protocole de prescription.</li><li><a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">[S4] Traitement de la puberté précoce</a> — 2021. Trois pages : début pubertaire, traitement, injection, soutien et effets indésirables. Limites : Brochure ancienne : formulations et intervalle Lucrin non transférés au 3,75 mg mensuel. Les phrases rassurantes sur absence de risque/interactions sont confrontées aux FI, non adoptées. Pas remboursement 2026 garanti.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">[S5] Pubertal induction and transition to adult sex hormone replacement: Endo-ERN clinical practice guideline</a> — 2022. Physiologie/minipuberté ; biologie ; R1.1, R2.1–2.11 ciblées, R3.1–3.9, R4.1–4.2 et rationales ; tableaux ciblés. Limites : Sections réellement lues, pas totalité du texte/tableaux ; nombreuses preuves faibles et données issues de Turner. Doses de protocole ne deviennent pas une FI suisse.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">[S6] Management of andrological disorders from childhood and adolescence to transition age: SIAMS/SIEDP part 1</a> — En ligne 2024, volume 2025. Sections puberté précoce/retardée, recommandations R5–R6 ; diagnostics et traitements ciblés. Limites : Guideline européenne masculine, pas extrapolée à toutes les filles ; plages et forces de preuve conservées. Imagerie confrontée à revue européenne 2026.</li><li><a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">[S7] Pubertas præcox hos piger og drenge</a> — Approuvée février 2025. p.1–3 ; exploration et interprétation p.5–8 ; traitement/suivi p.9–10. Limites : Version approuvée trouvée sur le site DPS, distincte du projet 2024 non approuvé. Produits danois non attribués à FI suisse ; seuils/méthodes et âges osseux non universels.</li><li><a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/174-022l_S1_Pubertas-tarda-und-Hypogonadismus_2021-12.pdf" target="_blank" rel="noopener">[S8] Pubertas tarda und Hypogonadismus</a> — Révision novembre 2021, réexamen prévu novembre 2026. Définition, signes, bilan, traitement et schémas ciblés. Limites : Recommandation S1 ancienne ; seuil féminin 13,5 ans et volume 3,5 ml distingués de <button class="w" data-k="e30-europe">Endo-ERN</button> 13 ans/4 ml ; traitements allemands non assimilés aux produits suisses.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618891/" target="_blank" rel="noopener">[S9] Pubertal development in Swiss girls.</a> — 1983. Résumé publié. Limites : Résumé seul, cohortes 1954–1980 ; pas norme 2026 ni fréquence E30. Définitions historiques de puberté incluent signes différents.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618890/" target="_blank" rel="noopener">[S10] Pubertal development in Swiss boys.</a> — 1983. Résumé publié. Limites : Résumé seul, cohortes 1954–1980 ; pas norme 2026 ni fréquence E30. Définitions historiques de puberté incluent signes différents.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">[S11] Information professionnelle suisse Lucrin Dépôt 3,75 mg seringue double compartiment</a> — Mai 2025. Formulation, indication, posologie, contre-indications, précautions ; interactions et grossesse ciblées sauf S15 comparatif adulte limité. Limites : Pas équivalence entre préparations ou entre FI et protocole. Maximum non inventé ; données adultes ne sont pas incidences pédiatriques.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">[S12] Information professionnelle suisse Pamorelin LA 22,5 mg</a> — Juillet 2026. Formulation, indication, posologie, contre-indications, précautions ; interactions et grossesse ciblées sauf S15 comparatif adulte limité. Limites : Pas équivalence entre préparations ou entre FI et protocole. Maximum non inventé ; données adultes ne sont pas incidences pédiatriques.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">[S13] Information professionnelle suisse Testoviron Dépôt 250 mg/ml</a> — Juillet 2026. Formulation, indication, posologie, contre-indications, précautions ; interactions et grossesse ciblées sauf S15 comparatif adulte limité. Limites : Pas équivalence entre préparations ou entre FI et protocole. Maximum non inventé ; données adultes ne sont pas incidences pédiatriques.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">[S14] Information professionnelle suisse Progynova 2 mg et Progynova mite 1 mg</a> — Octobre 2022. Formulation, indication, posologie, contre-indications, précautions ; interactions et grossesse ciblées sauf S15 comparatif adulte limité. Limites : Pas équivalence entre préparations ou entre FI et protocole. Maximum non inventé ; données adultes ne sont pas incidences pédiatriques.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">[S15] Information professionnelle suisse Testosteron-Mepha 1000 mg/4 ml</a> — Juin 2026. Formulation, indication, posologie, contre-indications, précautions ; interactions et grossesse ciblées sauf S15 comparatif adulte limité. Limites : Pas équivalence entre préparations ou entre FI et protocole. Maximum non inventé ; données adultes ne sont pas incidences pédiatriques.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/33687345/" target="_blank" rel="noopener">[S16] MANAGEMENT OF ENDOCRINE DISEASE: Diagnosis and management of primary amenorrhea and female delayed puberty.</a> — 2021. Résumé publié, définition et mécanismes. Limites : Résumé seul, pas fondement de dose. Le délai post-thélarche a une exception si début avant dix ans ; aucune règle simplifiée universelle.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">[S17] Precocious puberty in boys: current insights into etiology, genetic advances, and environmental factors</a> — 2026. Résumé ; risque intracrânien, tableau de cohortes et limites de sélection ; génétique ciblée. Limites : Revue, pas nouveau consensus européen validé ; reprend guideline Endocrine Society américaine 2026 avec propositions à valider. Ni source américaine seule ni justification automatique de ne pas imager. Les cohortes récentes excluent certains risques.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">[S18] Anatomy and physiology of the testicular reproductive system</a> — 2e, chapitre 27, version servie 2026. Anatomie, cellules, hormones et rétrocontrôle ciblés. Limites : Manuel pédagogique américain, pas recommandation clinique ; paraphrases ciblées, aucun conseil américain de traitement comme fondement. Licence propre aux figures distincte du site actuel.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">[S19] Anatomy and physiology of the ovarian reproductive system</a> — 2e, chapitre 27, version servie 2026. Anatomie, cellules, hormones et rétrocontrôle ciblés. Limites : Manuel pédagogique américain, pas recommandation clinique ; paraphrases ciblées, aucun conseil américain de traitement comme fondement. Licence propre aux figures distincte du site actuel.</li><li><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S20] PROFILES</a> — 2017. Situations organes génitaux, croissance/puberte, pression ; passages déjà réellement lus ce jour. Limites : Réutilisation déclarée d’une lecture du jour ; correspondance pédagogique non officielle, aucune question garantie.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7550972/" target="_blank" rel="noopener">[S21] Trends in the incidence of central precocious puberty and normal variant puberty in Denmark, 1998–2017</a> — 2020. Résumé, résultats et Strengths and Limitations. Limites : Éditeur américain mais cohorte européenne descriptive, pas recommandation de traitement. Codes non validés sur chaque dossier, possible non-confirmation ou adressements croissants ; pas incidence suisse ni E30 entière.</li></ul><p>Audit différé — auto-relecture par intelligence artificielle, distincte d’une validation médicale humaine. Les sources intégrales restent en cache externe ; le texte public contient paraphrases, références et limites.</p>
