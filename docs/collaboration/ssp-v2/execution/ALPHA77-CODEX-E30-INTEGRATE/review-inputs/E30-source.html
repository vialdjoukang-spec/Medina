<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e30-e-1"><h2><span class="n">e-1</span>Chaque examen répond à une question</h2><table class="t" data-e30-table="1"><thead><tr><th>Question</th><th>Examen orienté</th><th>Limite</th></tr></thead><tbody><tr><td>Le développement est-il précoce ou retardé ?</td><td>Chronologie, courbes, examen et stade</td><td>La pilosité seule ne prouve pas l’activation gonadique.</td></tr><tr><td>La maturation est-elle accélérée ?</td><td>Radiographie de la main/du poignet pour âge osseux</td><td>Méthode, lecteur et âge comptent ; pas une prédiction certaine de taille.</td></tr><tr><td>Le signal est-il central ou périphérique ?</td><td>Gonadotrophines et stéroïdes, parfois stimulation</td><td>Une valeur basale basse n’exclut pas un début central.</td></tr><tr><td>Le retard est-il gonadique ou central/fonctionnel ?</td><td>Gonadotrophines, stéroïdes, contexte, autres axes</td><td>Constitutionnel et permanent peuvent se recouvrir initialement.</td></tr><tr><td>Existe-t-il une cause structurale ?</td><td>Imagerie ciblée selon signes, âge et profil</td><td>Pas une imagerie indistincte de tous les organes.</td></tr></tbody></table>
<p>La prescription indique âge, stade, heure et traitement reçu. Le laboratoire doit disposer de méthodes adaptées aux faibles concentrations pédiatriques. Un résultat isolé après une exposition hormonale ou sous traitement n’a pas le même sens que le bilan initial [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<div class="key"><b>À retenir.</b> La question clinique précède le test. Méthode et conditions font partie du résultat [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-e-2"><h2><span class="n">e-2</span>Hormones, stimulation et faux raccourcis</h2><p>Le <button class="w" data-k="e30-gonadotrophines">signal gonadotrope</button> et les stéroïdes sont lus ensemble. Au début physiologique, la sécrétion est pulsatile et surtout nocturne ; la mesure basale peut rester basse. Le guide européen 2022 cite des repères de signal lutéinisant basal autour de 0,3 unité internationale/L, tandis que d’autres algorithmes emploient d’autres seuils. La détection, l’âge et le contexte empêchent d’en faire une règle universelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>Le test de stimulation est réalisé selon protocole et préparation exacts du centre. Le seuil du guide danois à trente minutes et ses exceptions de jeune âge ne s’appliquent pas automatiquement à un autre agoniste, un autre horaire ou une autre méthode. La stimulation diagnostique ponctuelle n’est pas la suppression recherchée avec un dépôt thérapeutique prolongé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Un profil périphérique fait rechercher des précurseurs surrénaliens, la fonction thyroïdienne, une gonadotrophine chorionique ou une exposition, selon les signes. Une tumeur peut être peu palpable et une cause surrénale ne se classe pas automatiquement <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E30.1</a>. Les résultats orientent une imagerie ciblée [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>En retard, un bilan de maladie chronique, de nutrition et d’autres axes peut être indiqué. Une réponse dynamique ne sépare pas à elle seule constitutionnel et congénital ; les contrôles de progression sont une partie de la démarche, avec une échéance expliquée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Un test positif ou négatif ne répond pas à toutes les questions. Stimulation ponctuelle et traitement continu ont des objectifs opposés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-e-3"><h2><span class="n">e-3</span>Imagerie, caryotype et génétique</h2><p>L’âge osseux soutient l’évaluation de tempo ; il ne mesure ni une enzyme ni la cause du trouble. Une avance n’est pas obligatoire au début d’une progression et les méthodes ont leurs incertitudes. Le guide italien souligne de ne pas interrompre le suivi seulement parce que l’âge osseux n’est pas avancé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>L’échographie explore une masse, une asymétrie, les gonades ou les structures utérines selon question. Une petite structure utérine avant exposition œstrogénique peut être mal visible : « non vue » ne prouve pas toujours une absence. Les volumes pelviens se recouvrent entre variantes et activation centrale ; aucun seuil échographique unique ne suffit [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Le caryotype ou une analyse chromosomique se discute notamment devant insuffisance gonadique, petite taille ou anomalies associées. Les analyses de gènes sont orientées et interprétées en centre spécialisé ; un variant incertain ne confirme pas seul un mécanisme. Le contexte familial ne supprime pas la recherche de signes neurologiques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>Le choix d’une imagerie cérébrale conserve les <button class="w" data-k="e30-imagerie">divergences documentées entre sources 2025 et 2026</button>. Une urgence neurologique n’est pas une situation de simple dépistage électif. Aucune stratégie de non-imagerie n’est déduite du résultat génétique seul [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> Image, chromosome et gène répondent à des questions différentes ; une absence de visibilité ou un variant incertain n’est pas une conclusion clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-e-4"><h2><span class="n">e-4</span>Exercices de raisonnement</h2><div class="quiz ui"><p><b>Cas fictif 1.</b> Une fille de six ans et demi développe des seins, sans autre information. Quelle conduite ?</p>
<button data-ok="1">Évaluer le signe, les courbes, la progression et le contexte, puis discuter le parcours spécialisé.</button><button data-ok="0">Prescrire automatiquement un dépôt hormonal pour toute thélarche.</button><p class="fb" hidden>Avant huit ans, l’évaluation est indiquée ; une thélarche isolée et une activation progressive n’ont pas le même traitement. Tempo et bénéfice attendu orientent la décision [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 2.</b> Un garçon de quatorze ans et demi a de petits testicules et un signal gonadotrope bas. Son père était tardif. Que conclure ?</p>
<button data-ok="1">Retard constitutionnel possible, mais causes fonctionnelles et déficit permanent restent à examiner et suivre.</button><button data-ok="0">La famille tardive exclut un déficit central permanent.</button><p class="fb" hidden>L’histoire familiale se retrouve dans plusieurs mécanismes. Le test dynamique et le résultat basal ne séparent pas seuls les hypothèses ; croissance et progression gardent leur rôle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 3.</b> Un garçon de huit ans présente une virilisation rapide sans augmentation testiculaire parallèle. Quel raisonnement ?</p>
<button data-ok="1">Rechercher une production périphérique et orienter le profil hormonal et l’imagerie.</button><button data-ok="0">Donner un dépôt suppresseur central sans bilan, car toute virilisation est centrale.</button><p class="fb" hidden>Stéroïdes périphériques, exposition et hormone chorionique font partie des causes ; l’examen et le profil guident les explorations. Une petite masse peut échapper à la palpation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 4.</b> Sous triptoréline, une enfant a céphalées inhabituelles, vomissements et troubles visuels. Que faire ?</p>
<button data-ok="1">Évaluation médicale urgente des symptômes neurologiques et du traitement.</button><button data-ok="0">Rassurer systématiquement, car la brochure ancienne dit les effets secondaires presque absents.</button><p class="fb" hidden>Ces signes demandent de rechercher une cause neurologique, dont une hypertension intracrânienne signalée dans la FI. La brochure ancienne ne remplace pas la sécurité du produit actuel [<a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
</div><div class="key"><b>À retenir.</b> Les quatre cas sont originaux : signe isolé, retard non encore classé, profil périphérique et sécurité neurologique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-e-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e30-tab-semio" role="tab" aria-controls="e30-s-semio" data-s="e30-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="e30-tab-anat" role="tab" aria-controls="e30-s-anat" data-s="e30-s-anat" aria-selected="false">Anatomie</button><button id="e30-tab-histo" role="tab" aria-controls="e30-s-histo" data-s="e30-s-histo" aria-selected="false">Histologie</button><button id="e30-tab-physio" role="tab" aria-controls="e30-s-physio" data-s="e30-s-physio" aria-selected="false">Physiologie</button><button id="e30-tab-bioch" role="tab" aria-controls="e30-s-bioch" data-s="e30-s-bioch" aria-selected="false">Biochimie</button><button id="e30-tab-gene" role="tab" aria-controls="e30-s-gene" data-s="e30-s-gene" aria-selected="false">Génétique et immunologie</button></div><div class="chap-body sci-body"><div class="sci" role="tabpanel" aria-labelledby="e30-tab-semio" id="e30-s-semio"><section class="ilot" id="e30-s-semio-cours"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><div class="key"><p><b>Science → clinique.</b> Un signe isolé ne précise pas toute l’activation hormonale. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → examen.</b> Chronologie, croissance et examen choisissent les mesures utiles. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → traitement.</b> La gravité et la conséquence guident orientation, surveillance ou traitement. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>]</p>
<p><b>À retenir.</b> Le signe, la mesure et le traitement répondent à des questions différentes.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Signe et chronologie</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mécanisme et gravité</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Examen puis décision</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les flèches résument le raisonnement décrit, sans score ni certitude individuelle supplémentaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</figcaption></figure>
<section class="ilot" id="e30-semio-normal" data-semiology="normal"><h3>Développement normal</h3><p>Le développement gonadique, la pilosité surrénalienne, la poussée staturale et les règles sont liés mais distincts. Les seins sont généralement le premier signe central chez la fille ; la croissance testiculaire l’est chez le garçon. Le stade et l’âge ne déterminent pas l’identité ni le vécu de la personne [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</section>
<section class="ilot" id="e30-semio-signs" data-semiology="signs"><h3>Signes et symptômes</h3><p>Décrire seins, volume testiculaire, virilisation, pilosité, saignements et croissance séparément. Une accélération staturale avec progression soutenue n’a pas le même sens qu’un signe isolé stable. Un retard peut se révéler par absence de poussée ou arrêt après un début, sans absence de tout changement corporel [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</section>
<section class="ilot" id="e30-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe</h3><p>L’activation centrale stimule les gonades ; une production périphérique peut élever les stéroïdes en freinant le signal hypophysaire. Un manque de signal ou une gonade insuffisante réduit la réponse. L’adrénarche peut produire pilosité et odeur sans activation centrale. Les stéroïdes modifient croissance et maturation osseuse, avec des effets décalés dans le temps [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</section>
<section class="ilot" id="e30-semio-examination" data-semiology="examination"><h3>Examen expliqué</h3><p>Mesurer taille, poids, vitesse, proportions et pression, puis décrire le développement avec un outil connu. Distinguer tissu mammaire et adiposité, volume testiculaire et asymétrie. Expliquer le but de tout examen intime, obtenir l’accord approprié, préserver intimité et limiter répétitions. Le résultat garde la méthode de mesure [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</section>
<section class="ilot" id="e30-semio-interpretation" data-semiology="interpretation"><h3>Interprétation contextualisée</h3><p>Une pilosité isolée ne prouve pas une activation centrale ; une mesure gonadotrope basse ne l’exclut pas. Une histoire familiale n’écarte pas la maladie et un âge osseux encore peu avancé ne clôt pas le suivi d’une progression. Relier les signes à leur chronologie évite ces raccourcis [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</section>
<section class="ilot" id="e30-semio-differentials" data-semiology="differentials"><h3>Différentiels utiles</h3><p>Thélarche isolée, adrénarche, lipomastie et début central sont confrontés aux courbes et aux autres signes. Le retard impose nutrition, maladies chroniques et déficits gonadiques/centraux. Un saignement prépubère nécessite aussi une évaluation gynécologique et de protection adaptée ; il n’est pas automatiquement une ménarche [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</section>
<section class="ilot" id="e30-semio-urgency" data-semiology="urgency"><h3>Urgence et orientation</h3><p>Céphalée inhabituelle avec trouble visuel, vomissements neurologiques, crise ou déficit focal impose évaluation rapide. Une masse, une virilisation explosive ou une dégradation générale change aussi le niveau de soins. Sous traitement, un symptôme nouveau n’est pas déclaré bénin par principe ; les FI exactes guident la sécurité [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
</section>
<section class="ilot" id="e30-semio-limits" data-semiology="limits"><h3>Limites et relation de soin</h3><p>L’apparence ne confirme ni l’axe ni le gène. Les échelles et volumes ne remplacent pas l’évolution ; aucune performance universelle de l’examen n’est établie ici. L’hymen n’est pas un test d’activité sexuelle. L’examen sert la question clinique et ne présume pas l’identité ou les préférences de la personne [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
</section>
<section class="ilot" id="e30-semio-sources" data-semiology="sources"><h3>Sources et portée</h3><p>La démarche suisse <button class="w" data-k="e30-chuv">CHUV</button> est confrontée aux recommandations européennes <button class="w" data-k="e30-europe">Endo-ERN</button>, italiennes et danoises approuvées en 2025. Les méthodes et les divergences restent visibles. Les FI datées complètent la sécurité ; aucune validation humaine indépendante ou question fédérale officielle n’est revendiquée [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
</section>
</section>
</div><div class="sci" role="tabpanel" aria-labelledby="e30-tab-anat" id="e30-s-anat" hidden><div class="key"><p><b>Science → clinique.</b> Asymétrie et augmentation bilatérale ont des significations différentes. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → examen.</b> La méthode de volume et la question anatomique accompagnent le résultat. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → traitement.</b> La présence de structures et la fonction gonadique orientent le remplacement. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>]</p>
<p><b>À retenir.</b> Le signe, la mesure et le traitement répondent à des questions différentes.</p>
</div><section class="ilot" id="e30-s-anat-cours"><h2><span class="n">s-anat-cours</span>Anatomie normale : gonades, conduits et structures cibles</h2><p>Les gonades associent une fonction endocrine et une fonction de production de gamètes. Les testicules sont situés dans le scrotum ; les ovaires dans le pelvis. Les conduits génitaux et l’utérus ne sont pas des gonades. Cette distinction explique pourquoi une absence de règles peut correspondre à un problème de structure ou de voie d’écoulement malgré un développement hormonal présent [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
<p>Dans le testicule adulte, des enveloppes entourent des lobules contenant les tubules séminifères. Ceux-ci rejoignent des conduits et l’épididyme, où se poursuit la maturation/organisation du transport des spermatozoïdes. Le cordon spermatique et les enveloppes situent la glande ; leur aspect n’est pas une mesure de réserve hormonale. La planche est une anatomie normale et ne montre ni une tumeur ni une anomalie pubertaire [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>].</p>
<figure id="e30-anatomy-figure"><div data-e30-frame="anatomy"><img src="assets/img/e30/alpha/codex/testis-openstax.jpg" alt="Illustration humaine originale en coupe du testicule, enveloppes, tubules et épididyme." loading="eager"><span data-e30-marker="1" data-e30-pin="a1">1</span><span data-e30-marker="1" data-e30-pin="a2">2</span><span data-e30-marker="1" data-e30-pin="a3">3</span><span data-e30-marker="1" data-e30-pin="a4">4</span></div><figcaption>Illustration humaine originale OpenStax Anatomy and Physiology, version 8.25, 18 mai 2016. <a href="https://commons.wikimedia.org/wiki/File:Figure_28_01_03.jpg" target="_blank" rel="noopener">Source et attribution</a> ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels inchangés, repères français superposés : 1 cordon spermatique ; 2 épididyme ; 3 lobules/tubules séminifères ; 4 enveloppe albuginée. Anatomie adulte normale, pas mesure de stade pubertaire ni image du patient. Les structures ovariennes sont expliquées dans le texte ; cette planche n’en est pas une représentation.</figcaption></figure>
<p>Le volume testiculaire augmente au début de la puberté, en partie par développement du compartiment tubulaire. Il n’est pourtant pas une mesure directe de la testostérone dans toutes les maladies : les compartiments tubulaire et endocrine peuvent être atteints différemment. Une asymétrie ou une masse oriente autrement qu’une augmentation bilatérale. L’examen et l’échographie répondent à des questions complémentaires [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Dans l’ovaire, les follicules comportent un ovocyte et des cellules de soutien. La maturation folliculaire et la production de stéroïdes participent au développement mammaire et à la croissance de l’utérus. L’utérus peut être très petit avant exposition œstrogénique ; son absence de visualisation n’est pas toujours une preuve d’absence anatomique. Le contexte et l’imagerie spécialisée évitent de conclure trop vite [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
<p>Enfin, les organes externes ne décrivent pas à eux seuls les chromosomes, la fonction hormonale, la fertilité ou l’identité de genre. Un examen utile précise la structure nécessaire à la décision, protège l’intimité et évite de répéter des gestes sans bénéfice. La corrélation clinique se construit avec la croissance et les mesures, jamais sur la planche seule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Structure gonadique, fonction hormonale et structures utérines sont distinctes ; une image normale ne diagnostique pas le mécanisme du trouble [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-s-anat-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e30-tab-histo" id="e30-s-histo" hidden><div class="key"><p><b>Science → clinique.</b> Les compartiments endocrines et germinaux peuvent fonctionner différemment. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → examen.</b> La micrographie n’attribue ni âge ni fertilité et ne remplace pas le bilan. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → traitement.</b> Induire des caractères ne signifie pas restaurer la spermatogenèse. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>]</p>
<p><b>À retenir.</b> Le signe, la mesure et le traitement répondent à des questions différentes.</p>
</div><section class="ilot" id="e30-s-histo-cours"><h2><span class="n">s-histo-cours</span>Histologie : compartiments cellulaires et limites d’une image</h2><p>Les tubules séminifères occupent une grande partie du testicule. Leur épithélium contient des cellules germinales à différents niveaux de maturation et des cellules de soutien de Sertoli. Les cellules de Leydig se trouvent dans le compartiment interstitiel entre les tubules et produisent des androgènes en réponse au signal lutéinisant. La séparation de ces compartiments explique que volume, stéroïdes circulants et production de gamètes ne soient pas trois mesures équivalentes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>].</p>
<p>Les cellules de Sertoli entourent et soutiennent les cellules germinales. Leurs jonctions limitent les passages et participent à la barrière hémato-testiculaire ; cette organisation ne signifie pas une barrière absolue à toute substance ni une explication unique de toute infertilité. La fonction germinale demande un environnement local adapté, qui ne se résume pas au taux sanguin de testostérone [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>].</p>
<figure id="e30-histology-figure"><div data-e30-frame="histology"><img src="assets/img/e30/alpha/codex/seminiferous-human.jpg" alt="Photographie originale déclarée humaine au microscope : sections de tubules séminifères, parois et lumières." loading="eager"><span data-e30-marker="1" data-e30-pin="h1">1</span><span data-e30-marker="1" data-e30-pin="h2">2</span><span data-e30-marker="1" data-e30-pin="h3">3</span></div><figcaption>Micrographie humaine originale de Jpogi, photographie à travers un microscope, <a href="https://commons.wikimedia.org/wiki/File:Seminiferous_tubule.JPG" target="_blank" rel="noopener">notice Commons déclarant le domaine public</a>. Date de création et coloration non précisées dans les métadonnées lues ; aucune barre de calibration fournie. Pixels inchangés. Repères français : 1 paroi/épithélium tubulaire ; 2 lumière tubulaire ; 3 voisinage entre sections tubulaires. La résolution ne permet pas une identification fiable de chaque cellule de Sertoli ou de Leydig, ni l’attribution d’un âge ou d’une fertilité. Le vignettage et le pointeur du microscope appartiennent à l’original.</figcaption></figure>
<p>Sur la micrographie, reconnaître des sections tubulaires et leurs lumières est possible. La coloration et la calibration n’étant pas précisées dans la notice, aucun grossissement chiffré ni mesure n’est inventé. Les cellules fines ne sont pas étiquetées comme si un examen histologique spécialisé avait été réalisé. L’image ne permet pas d’attribuer un âge, une réponse au traitement ou une fertilité individuelle [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>].</p>
<p>Dans l’ovaire, un follicule associe l’ovocyte et des cellules de granulosa ; les structures périphériques, dont la thèque, participent avec elles au fonctionnement stéroïdien. Le nombre et l’organisation des couches évoluent au cours de la maturation folliculaire. La progression pubertaire ne se diagnostique pas par une biopsie obligatoire ; clinique, hormones et imagerie sont choisies selon la question [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
<p>Cette histologie éclaire le traitement : donner un stéroïde dans le sang peut induire des caractères secondaires sans reproduire la stimulation des cellules de soutien ou la maturation des gamètes. En hypogonadisme central masculin, la testostérone seule n’induit ni augmentation testiculaire ni spermatogenèse. Le projet reproductif demande donc une discussion spécialisée distincte du seul objectif de virilisation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Les compartiments endocrines et germinaux coopèrent mais ne se mesurent pas par un seul chiffre. La micrographie illustre des tubules, pas un diagnostic individuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-s-histo-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e30-tab-physio" id="e30-s-physio" hidden><div class="key"><p><b>Science → clinique.</b> Adrénarche et activation centrale peuvent produire des signes décalés. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → examen.</b> Une valeur ponctuelle peut manquer une sécrétion pulsatile débutante. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → traitement.</b> Stimulation ponctuelle et dépôt prolongé n’ont pas le même objectif. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>]</p>
<p><b>À retenir.</b> Le signe, la mesure et le traitement répondent à des questions différentes.</p>

<section class="ilot" id="e30-s-physio-cours"><h2><span class="n">s-physio-cours</span>Physiologie : la pulsation et le tempo</h2><p>L’axe de reproduction n’est pas simplement éteint de la naissance jusqu’à l’adolescence. Il connaît une activation postnatale, la minipuberté, puis une période de faible activité avant la réactivation pubertaire. Certaines concentrations restent élevées plus longtemps chez la petite fille. L’âge est donc indispensable à l’interprétation d’un dosage ; un résultat de nourrisson n’est pas comparé sans précaution à celui d’un enfant plus âgé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<p>À l’approche de la puberté, la sécrétion hypothalamique devient plus active de manière pulsatile, avec une expression nocturne initiale importante. Le signal stimule les gonadotrophines hypophysaires, puis les gonades. Un prélèvement bas à un instant ne prouve pas l’absence de toute activité. La sensibilité du dosage et les variations temporelles expliquent pourquoi la clinique et parfois la stimulation complètent le résultat [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>La sécrétion gonadique agit sur les tissus cibles et exerce des rétrocontrôles. La croissance, la maturation osseuse, les caractères secondaires et la composition corporelle changent à des rythmes différents. La ménarche survient généralement plusieurs années après le début mammaire ; la poussée staturale n’a pas le même placement relatif chez tous. Une simple présence de pilosité n’indique pas toute cette progression [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Les androgènes surrénaliens participent à une autre composante : l’adrénarche. L’odeur, l’acné et la pilosité peuvent précéder l’activation centrale ou rester isolées. La source suisse historique décrivant parfois la pilosité comme premier signe de développement ne contredit pas cette distinction entre signe corporel et gonadarche centrale [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618891/" target="_blank" rel="noopener">S9</a>].</p>
<p>Le traitement utilise une propriété temporelle : une stimulation diagnostique ponctuelle teste une réponse, alors qu’une exposition prolongée à un agoniste peut désensibiliser le système après une phase de stimulation initiale. Une augmentation transitoire des stéroïdes ou des signes peut donc survenir au début d’un dépôt. Ce mécanisme ne justifie pas de considérer tout symptôme nouveau comme banal [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Enfin, l’induction d’un déficit permanent cherche à imiter une progression physiologique, avec faibles doses puis augmentation et suivi. Passer immédiatement à une dose adulte peut accélérer la maturation de façon inadaptée. La prise en charge suit le développement du patient et ses objectifs, plutôt qu’une valeur hormonale isolée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> La temporalité change le sens du signal : pulsation physiologique, stimulation ponctuelle et exposition prolongée ne sont pas équivalentes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-s-physio-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e30-tab-bioch" id="e30-s-bioch" hidden><div class="key"><p><b>Science → clinique.</b> Un profil isolé peut recouvrir plusieurs mécanismes du retard. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → examen.</b> Heure, méthode, seuil et protocole de stimulation restent documentés. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → traitement.</b> Unités et formulations empêchent de copier une dose d’une autre préparation. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>]</p>
<p><b>À retenir.</b> Le signe, la mesure et le traitement répondent à des questions différentes.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Méthode et conditions</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Résultat contextualisé</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Décision et suivi</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les flèches résument le raisonnement décrit, sans score ni certitude individuelle supplémentaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</figcaption></figure>
<section class="ilot" id="e30-s-bioch-cours"><h2><span class="n">s-bioch-cours</span>Biochimie : quel signal, quelle mesure ?</h2><p>Les gonadotrophines et les stéroïdes sexuels sont deux étages différents du système. Un signal hypophysaire élevé face à des stéroïdes insuffisants peut orienter vers une insuffisance gonadique ; un signal bas ou inadapté peut correspondre à un déficit central ou à une inhibition fonctionnelle. Mais le même profil initial peut être observé pendant un retard constitutionnel : la biologie est confrontée au stade et à la progression [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>Au début du développement, les concentrations sont faibles. Des méthodes insuffisamment sensibles peuvent donner une valeur indétectable malgré une activité débutante. L’heure et la pulsation ajoutent de la variabilité. Les méthodes de spectrométrie de masse peuvent améliorer la spécificité des stéroïdes à faible concentration ; leur disponibilité et les références du laboratoire restent importantes. Les valeurs d’une méthode ne sont pas automatiquement les seuils d’une autre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<p>La stimulation explore une réserve de réponse dans des conditions définies. Préparation injectée, dose, temps de prélèvement et méthode sont documentés. Le pic lutéinisant et le rapport avec le signal folliculostimulant sont des repères de certains protocoles ; les jeunes enfants avec thélarche isolée ont des chevauchements. Un test ponctuel ne mesure ni le futur tempo ni à lui seul la permanence d’un déficit [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Les stéroïdes sexuels gonadiques et les androgènes surrénaliens ne sont pas une même production. Une virilisation avec gonadotrophines freinées fait rechercher production périphérique, précurseurs, hormone chorionique et exposition selon le tableau. Une hypothyroïdie sévère peut provoquer un tableau particulier de précocité avec d’autres signes et une maturation différente ; un dosage choisi sur la question aide à le reconnaître [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Le métabolisme des stéroïdes explique aussi certains effets du traitement. L’aromatisation transforme une partie des androgènes en œstrogènes ; ceux-ci participent à la maturation osseuse dans les deux sexes. L’inhibine donne une information sur le compartiment de soutien et son rétrocontrôle, sans devenir une preuve unique de fertilité ou un diagnostic autonome [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
<p>Enfin, une différence d’unité est une différence clinique : milligrammes de testostérone ou de dépôt, microgrammes d’estradiol et unités internationales d’un dosage ne s’échangent pas. Les tableaux européens de protocole ne remplacent pas la concentration et l’indication du produit suisse choisi [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> Le profil répond à une question et garde son heure, sa méthode et ses unités ; un seuil ne devient pas un verdict universel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-s-bioch-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e30-tab-gene" id="e30-s-gene" hidden><div class="key"><p><b>Science → clinique.</b> L’histoire familiale oriente sans exclure une maladie différente. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → examen.</b> Le variant classé se confronte au mécanisme, à la famille et aux signes. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → traitement.</b> Le conseil génétique accompagne les décisions sans remplacer les soins. [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>]</p>
<p><b>À retenir.</b> Le signe, la mesure et le traitement répondent à des questions différentes.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Variant interprété</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mécanisme documenté</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Phénotype et contexte</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les flèches résument le raisonnement décrit, sans score ni certitude individuelle supplémentaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</figcaption></figure>
<section class="ilot" id="e30-s-gene-cours"><h2><span class="n">s-gene-cours</span>Génétique, immunologie et interprétation</h2><p>Le calendrier pubertaire a une composante familiale et génétique, mais l’histoire des apparentés ne suffit pas à nommer le mécanisme chez un enfant. Retard constitutionnel et déficit central congénital peuvent tous deux comporter une histoire familiale. Le développement est aussi influencé par l’état nutritionnel, les maladies et le contexte ; une association environnementale ne permet pas d’attribuer automatiquement une cause à un cas individuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>Dans la précocité centrale familiale, des variants affectent des freins de l’activation. Les pertes de fonction de <button class="w" data-k="e30-genes">MKRN3</button> et <button class="w" data-k="e30-genes">DLK1</button> concernent des gènes à expression paternelle soumise à empreinte ; de rares gains de fonction de <button class="w" data-k="e30-genes">KISS1</button> ou <button class="w" data-k="e30-genes">KISS1R</button> ont aussi été décrits. Le mécanisme de transmission et le parent transmetteur comptent pour le conseil. Tous les variants trouvés ne sont pas pathogènes, et toutes les précocités ne sont pas monogéniques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>Dans le retard, les anomalies chromosomiques ou du développement gonadique peuvent produire un profil d’insuffisance primaire. D’autres variants touchent le développement ou la fonction de l’axe central. L’odorat, les antécédents néonataux et les anomalies associées aident à orienter les explorations ; ils n’ont pas une présence obligatoire. Une analyse négative limitée ne résout pas toutes les hypothèses [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>Le laboratoire et le centre spécialisé évaluent la méthode, la classification du variant, la famille et la cohérence clinique. Un résultat incertain ne doit pas devenir une explication rassurante ou une justification automatique de ne pas faire d’imagerie. Les stratégies génétiques et neurologiques sont discutées avec leurs limites et les recommandations datées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>Les mécanismes immunologiques sont distincts. Une maladie inflammatoire ou immune peut contribuer à une inhibition fonctionnelle ou à une atteinte centrale ; cela ne signifie pas que toute puberté tardive est auto-immune. La recherche d’une maladie cœliaque ou d’autres causes s’appuie sur le tableau. Dans le testicule, les jonctions des cellules de soutien participent à un environnement protégeant les cellules germinales, mais ne suffisent pas à diagnostiquer une infertilité immunologique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>].</p>
<p>Enfin, chromosomes, fonction endocrine, structures et identité de genre sont des dimensions différentes. Le conseil génétique prépare une compréhension et des décisions éclairées ; il ne remplace pas la parole de la personne ni le suivi clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Famille et gènes orientent sans supprimer les autres causes. Le variant, son mécanisme et la clinique sont interprétés ensemble [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-s-gene-cours">Essentiel de cette partie</button></section>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e30-p-1"><h2><span class="n">p-1</span>Mécanisme et objectif avant la préparation</h2><p>Dans une activation centrale progressive, un agoniste prolongé du signal hypothalamique entraîne après stimulation initiale une désensibilisation et une diminution des gonadotrophines/stéroïdes. Dans un déficit, on cherche au contraire une progression par remplacement sexuel ou stimulation gonadique adaptée. Ces stratégies ne s’échangent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Les noms commerciaux ne définissent pas seuls la concentration ni l’intervalle. La FI <button class="w" data-k="e30-lucrin">Lucrin Dépôt 3,75 mg</button> concerne une seringue mensuelle de base, avec dose pédiatrique totale spécifique ; <button class="w" data-k="e30-pamorelin">Pamorelin LA 22,5 mg</button> est une injection à vingt-quatre semaines. Une brochure ancienne parlant d’un Lucrin de douze semaines ne remplace pas la FI de la formulation lue [<a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Les conditions de traitement d’une FI ne sont pas la définition générale de tout trouble pubertaire. Produit, voie, diagnostic confirmé, bilan, âge et surveillance sont vérifiés par l’équipe spécialisée avant prescription [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Un agoniste ponctuel diagnostique, un dépôt suppresseur et une substitution sexuelle ont trois objectifs différents [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-p-2"><h2><span class="n">p-2</span>Deux dépôts : intervalles et populations exacts</h2><table class="t" data-e30-table="1"><thead><tr><th>Produit suisse et version</th><th>Repères de la FI</th><th>Population/limite</th></tr></thead><tbody><tr><td><button class="w" data-k="e30-lucrin">Lucrin Dépôt 3,75 mg, mai 2025</button></td><td>Début pédiatrique 0,3 mg/kg par quatre semaines, minimum 7,5 mg ; tableau de doses totales selon poids.</td><td>Activation centrale rapidement progressive, traitement commencé avant huit/neuf ans, test positif et âge osseux en avance selon critères FI.</td></tr><tr><td><button class="w" data-k="e30-pamorelin">Pamorelin LA 22,5 mg, juillet 2026</button></td><td>22,5 mg intramusculaire toutes les vingt-quatre semaines ; ce n’est pas six mois calendaires.</td><td>Dès deux ans, début clinique avant huit/neuf ans, diagnostic central confirmé ; contrôle spécialisé.</td></tr></tbody></table>
<p>Les monographies détaillent dose, technique, contre-indications et risques. Les limites d’arrêt indiquées par ces FI sont avant onze ans chez la fille et douze chez le garçon. Les guides discutent aussi stade et âge osseux ; le cours ne fusionne pas ces paramètres en une règle nouvelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> La dose totale pédiatrique n’est pas nécessairement une seringue ; un intervalle de vingt-quatre semaines n’est pas celui de la préparation mensuelle [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-p-3"><h2><span class="n">p-3</span>Induction : faible dose puis progression</h2><p><button class="w" data-k="e30-testoviron">Testoviron Dépôt</button> contient l’énanthate de testostérone 250 mg/ml. Sa FI juillet 2026 décrit pour l’induction tardive chez le garçon un début à 50 mg toutes les quatre semaines, puis une progression jusqu’à 250 mg toutes les trois semaines sur trois ans, sous expert pédiatrique. Ce n’est pas la dose adulte initiale à copier chez tout adolescent [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>].</p>
<p>L’induction œstrogénique privilégie une progression physiologique selon le protocole européen. Mais <button class="w" data-k="e30-estradiol">Progynova et le schéma pédiatrique</button> ne sont pas une seule autorisation : la FI suisse de ce produit n’a aucune indication enfant/adolescente. Une préparation adaptée, une dose précise et son cadre d’emploi sont vérifiés avec la pharmacie ; aucune recette de découpe n’est improvisée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>].</p>
<p><button class="w" data-k="e30-undecanoate">L’undécanoate adulte à longue action</button> n’est pas un remplacement de la faible dose d’énanthate au début de l’induction. Le suivi évalue croissance, stade, tolérance, pression et paramètres pertinents. Dans un déficit central, les options de stimulation gonadique et de fertilité sont discutées séparément [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> Le produit, l’ester et la dose comptent. Induire progressivement et substituer à dose adulte ne sont pas deux noms du même schéma [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-p-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e30-p-4"><h2><span class="n">p-4</span>Sécurité et surveillance</h2><p>Céphalée inhabituelle avec troubles visuels ou vomissements, réaction allergique, lésion cutanée sévère ou symptôme neurologique sous traitement demande une évaluation adaptée, parfois urgente. Les FI actuelles des dépôts décrivent des risques que la formule rassurante de la brochure 2021 ne permet pas d’écarter [<a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Sous testostérone, surveiller tolérance clinique, croissance/maturation et paramètres selon la dose, notamment hématocrite au stade de remplacement adulte. Une toux ou dyspnée pendant une injection huileuse ne doit pas être banalisée. Les médicaments coadministrés et les facteurs de risque sont revus [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<p>Les interactions, la grossesse et l’allaitement gardent les limites du produit. La substitution œstrogénique n’est pas contraceptive. L’induction chez une adolescente ne doit pas être présentée comme la posologie autorisée d’un produit ménopausique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>].</p>
<p>Les <button class="w" data-k="e30-imagerie">précautions de bilan cérébral</button> et l’évaluation d’une tumeur connue sont confrontées à la FI de l’agoniste : un débat sur le dépistage radiologique n’annule pas une condition de sécurité du produit choisi [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<div class="key"><b>À retenir.</b> Un effet initial possible n’est pas une explication automatique de tout symptôme. La sécurité se lit dans la FI exacte et la situation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</div><button class="pareto-btn ui" data-k="pareto-e30-p-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e30-lucrin" data-title="Leuproréline dépôt 3,75 mg — FI suisse mai 2025"><div class="lab">Formulation et indication</div><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">Lucrin Dépôt</a> contient par seringue double compartiment 3,75 mg d’acétate de leuproréline, correspondant à 3,57 mg de leuproréline. Après reconstitution, la suspension s’administre par voie sous-cutanée ou intramusculaire. Cette FI n’est pas celle d’une préparation à douze semaines [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
