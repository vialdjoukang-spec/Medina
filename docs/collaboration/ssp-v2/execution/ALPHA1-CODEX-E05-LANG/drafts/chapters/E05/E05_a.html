<section class="ilot" id="e05-a01"><h2><span class="n">A01</span> Cas initial et objectifs</h2>
<h3 id="e05-a01-partie-1">Cas</h3>
<p>Mme L., 34 ans, vit à Neuchâtel et fume. Depuis trois mois, elle a perdu 5 kg malgré un appétit conservé. Elle sent son cœur battre trop vite, ses mains tremblent et elle supporte mal la chaleur. À l’examen, sa fréquence cardiaque atteint 112/min, la peau est chaude et moite, la thyroïde est augmentée de volume de façon diffuse et indolore, et la paupière supérieure découvre la sclère au-dessus de l’iris. Le bilan montre une TSH inférieure à 0,01 mU/l et une T4 libre doublée ; les anticorps anti-récepteur de la TSH (<b>TRAK</b>) sont à 8,5 UI/l. <button class="w" data-k="e05-cas">Données complètes et intervalles de référence</button>.</p><p>Ce cas sert de fil rouge : il réapparaît pour le diagnostic, le traitement, le score d’activité de l’orbitopathie, le projet de grossesse et l’arrêt du traitement après 18 mois. Les chiffres de la patiente sont inventés pour enseigner ; les seuils et intervalles cités viennent de sources lues.</p><p class="src">Sources : <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p>
<h3 id="e05-a01-partie-2">Objectifs</h3>
<p>Cinq compétences guident le cours. Le médecin doit d’abord <b>reconnaître</b> une thyrotoxicose à partir de symptômes parfois discrets, surtout chez le sujet âgé. Il doit ensuite la <b>confirmer et en classer la cause</b>, car le traitement dépend du mécanisme : une maladie de Basedow, un nodule autonome et une thyroïdite se soignent différemment. Troisième compétence : <b>traiter la maladie de Basedow</b>, par antithyroïdien de synthèse, iode radioactif ou chirurgie. Quatrième : <b>reconnaître les urgences</b> (crise thyrotoxique, agranulocytose, orbitopathie menaçant la vue). Dernière compétence : <b>adapter la conduite</b> à la grossesse, à l’enfant, au sujet âgé et aux expositions médicamenteuses.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p>
<h3 id="e05-a01-partie-3">Prérequis cliquables</h3>
<p>Deux notions de base servent partout dans le cours : le circuit hypothalamo-hypophyso-thyroïdien (<button class="w" data-k="e05-axe">axe thyréotrope</button>) et la synthèse des hormones à partir de l’iode, développée dans l’onglet Sciences (S03). Le lecteur qui les maîtrise comprend pourquoi la TSH s’effondre dans la thyrotoxicose et pourquoi un antithyroïdien ne guérit pas en quelques jours.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://doi.org/10.3390/ijms24043393" target="_blank" rel="noopener">Köhrle — sélénium, iode et fer dans la synthèse des hormones thyroïdiennes — 2023</a>.</p>
<div class="key"><b>À retenir.</b> Mme L. présente une thyrotoxicose franche avec un goitre diffus et une rétraction palpébrale, un tableau qui oriente d’emblée vers une maladie de Basedow. La partie suivante précise les termes (thyrotoxicose, hyperthyroïdie) et la classification par mécanisme.</div>
</section>
<section class="ilot" id="e05-a02"><h2><span class="n">A02</span> Définitions et classification</h2>
<h3 id="e05-a02-partie-1">Thyrotoxicose et hyperthyroïdie</h3>
<p>Le mot <b>hyperthyroïdie</b> désigne une synthèse et une sécrétion inappropriées d’hormones par la thyroïde. Le mot <b>thyrotoxicose</b> désigne l’excès d’hormones thyroïdiennes dans l’organisme, quelle qu’en soit l’origine. Cette distinction compte, car trois mécanismes distincts produisent une thyrotoxicose : une synthèse accrue par la glande, la libération d’hormones préformées lors de la destruction du tissu thyroïdien (thyroïdite) et un apport exogène de lévothyroxine. Dans la thyroïdite, les antithyroïdiens de synthèse sont inefficaces, parce qu’ils bloquent la fabrication d’hormones et non la libération du stock déjà constitué ; l’évolution est triphasique, avec une phase d’hyperthyroïdie, une phase d’hypothyroïdie transitoire puis un retour à l’euthyroïdie en un an, une hypothyroïdie définitive restant possible.</p><p>Les hormones thyroïdiennes augmentent la thermogenèse et le métabolisme de base, abaissent le cholestérol sérique et les résistances vasculaires systémiques. Leur excès explique donc la chaleur, l’amaigrissement, la tachycardie et les palpitations décrits plus loin.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30376773/" target="_blank" rel="noopener">Praxis — Slahor, Thyreotoxikose und Thyreoiditis — 2018, résumé</a> ; <a href="https://www.jstage.jst.go.jp/article/endocrj/63/12/63_EJ16-0336/_pdf" target="_blank" rel="noopener">JTA — recommandations 2016 sur la crise thyrotoxique (Satoh et coll.) — 2016</a>.</p><p>La classification statistique CIM-10-GM 2024 rattache à la thyrotoxicose les atteintes oculaire et cardiaque thyrotoxiques ; elle en exclut la thyroïdite chronique avec thyrotoxicose transitoire, l’hyperthyroïdie néonatale et la thyroïdite du post-partum.</p><p class="src">Sources : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc des maladies de la thyroïde — état du 15 septembre 2023</a>.</p>
<h3 id="e05-a02-partie-2">Gradation biologique</h3>
<p>La biologie distingue quatre situations. Les bornes figurent dans le tableau suivant ; elles s’appliquent à l’adulte. Une définition suisse (manifeste, infraclinique) et une gradation européenne (grades 1 et 2) coexistent : elles ne se contredisent pas, mais découpent la zone de TSH inférieure à 0,4 mU/l de façon différente. La <button class="w" data-k="e05-t3tox">T3-thyrotoxicose</button> et les <button class="w" data-k="e05-grades">grades de l’hyperthyroïdie infraclinique</button> ouvrent leurs fenêtres.</p><table class='t'><tr><th>Situation</th><th>TSH (mU/l)</th><th>T4 libre</th><th>T3 libre</th><th>Conséquence</th></tr><tr><td>Hyperthyroïdie manifeste (définition suisse)</td><td>&lt; 0,1 ou indétectable</td><td>Élevée</td><td>Non requise par la définition</td><td>Complications de l’hyperthyroïdie non traitée : amaigrissement, ostéoporose, fibrillation auriculaire, embolies</td></tr><tr><td>Infraclinique, grade 1 (ETA)</td><td>0,1–0,39</td><td>Dans l’intervalle de référence</td><td>Dans l’intervalle de référence</td><td>Pas de traitement du sujet jeune asymptomatique</td></tr><tr><td>Infraclinique, grade 2 (ETA)</td><td>&lt; 0,1, persistante</td><td>Dans l’intervalle de référence</td><td>Dans l’intervalle de référence</td><td>Risque accru de fibrillation auriculaire, d’insuffisance cardiaque, de fractures ; traitement si plus de 65 ans</td></tr><tr><td>T3-thyrotoxicose</td><td>Indétectable</td><td>Normale</td><td>Élevée</td><td>Souvent stade initial d’un nodule autonome</td></tr></table><p>Lecture du tableau : une TSH inférieure à 0,1 mU/l justifie de chercher la cause quelle que soit la T4 libre, car même sans hormone libre élevée, le risque cardiovasculaire et osseux est augmenté. Une T3 libre seule élevée reste une thyrotoxicose, et non une variante normale.</p><p class="src">Sources : <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26558232/" target="_blank" rel="noopener">ETA — recommandations 2015 sur l’hyperthyroïdie infraclinique (Biondi et coll.) — 26 août 2015, résumé</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p>
<h3 id="e05-a02-partie-3">Classification par mécanisme</h3>
<p>Puisque le traitement dépend de la cause, la classification par mécanisme est l’outil central. Le tableau suivant regroupe les causes selon huit mécanismes. Il couvre la maladie de Basedow, l’adénome toxique et le goitre multinodulaire toxique (autonomie), le tissu thyroïdien ectopique, la thyrotoxicose factice, l’hypersécrétion hypophysaire de TSH et, comme forme extrême de toutes ces causes, la crise thyrotoxique, traitée dans la partie A07.</p><table class='t'><tr><th>Mécanisme</th><th>Causes</th><th>Indice clé</th><th>Examen d’orientation</th></tr><tr><td>Synthèse accrue par anticorps stimulants</td><td>Maladie de Basedow</td><td>Goitre diffus, orbitopathie, atteinte cutanée prétibiale</td><td>TRAK ; échographie Doppler</td></tr><tr><td>Synthèse accrue par autonomie</td><td>Adénome toxique (nodule solitaire), goitre multinodulaire toxique</td><td>Nodules, âge avancé, T3-thyrotoxicose</td><td>Scintigraphie</td></tr><tr><td>Surcharge iodée</td><td>Amiodarone, produits de contraste iodés, algues ou compléments</td><td>Exposition récente ou prolongée à l’iode</td><td>TSH ; Doppler (type de l’atteinte amiodaronique)</td></tr><tr><td>Libération d’hormones préformées par destruction</td><td>Thyroïdites subaiguë, silencieuse, du post-partum, médicamenteuse (renvoi au cours Thyroïdites)</td><td>Douleur cervicale dans la forme subaiguë ; contexte du post-partum ou d’immunothérapie</td><td>Scintigraphie : fixation nulle ou basse</td></tr><tr><td>Stimulation par l’hCG</td><td>Thyrotoxicose gestationnelle transitoire</td><td>Premier trimestre ; ni goitre ni orbitopathie</td><td>Contexte ; TRAK négatif</td></tr><tr><td>Stimulation hypophysaire</td><td>Adénome thyréotrope</td><td>T4 et T3 libres élevées avec TSH non freinée</td><td>Test de freinage à la T3, test au TRH, IRM hypophysaire</td></tr><tr><td>Apport exogène</td><td>Thyrotoxicose factice ou iatrogène (lévothyroxine)</td><td>Absence de goitre et d’anticorps</td><td>Thyroglobuline basse ou indétectable</td></tr><tr><td>Tissu thyroïdien ectopique</td><td>Struma ovarii</td><td>Hyperthyroïdie résistante au traitement</td><td>Imagerie pelvienne</td></tr></table><p>Lecture du tableau : la colonne « Examen d’orientation » indique le premier examen qui sépare les mécanismes entre eux. L’anticorps (TRAK) identifie la maladie de Basedow ; la scintigraphie distingue autonomie nodulaire et destruction thyroïdienne ; la TSH non freinée révèle l’adénome thyréotrope, que l’on ne doit pas traiter comme une hyperthyroïdie thyroïdienne.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30376773/" target="_blank" rel="noopener">Praxis — Slahor, Thyreotoxikose und Thyreoiditis — 2018, résumé</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31791071/" target="_blank" rel="noopener">Koehler et coll. — Schilddrüse und Schwangerschaft — décembre 2019, résumé</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24783044/" target="_blank" rel="noopener">ETA — recommandations 2013 sur les adénomes hypophysaires sécrétant la TSH — 2013, résumé</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10195380/" target="_blank" rel="noopener">Bogazzi, Bartalena et coll. — thyrotoxicose factice, séries italiennes — 1996 et 1999, résumés</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34387530/" target="_blank" rel="noopener">Podfigurna et coll. — hyperthyroïdie et struma ovarii — 2021, résumé</a>.</p>
<div class="key"><b>À retenir.</b> La thyrotoxicose est un excès d’hormones circulantes ; l’hyperthyroïdie en est la forme où la thyroïde elle-même produit trop. Une TSH inférieure à 0,1 mU/l est le seuil qui fait chercher la cause. La partie suivante donne les chiffres de fréquence et le contexte suisse de l’iode.</div>
</section>
<section class="ilot" id="e05-a03"><h2><span class="n">A03</span> Épidémiologie, pronostic et contexte suisse</h2>
<h3 id="e05-a03-partie-1">Fréquence</h3>
<p>Les chiffres européens servent de cadre, car aucune donnée suisse d’incidence de la maladie de Basedow n’a été trouvée dans les sources lues. Le tableau les rassemble avec leur population ; la dernière ligne distingue l’estimation suisse, qui provient d’une conférence d’experte et non d’une étude nationale.</p><table class='t'><tr><th>Indicateur</th><th>Valeur</th><th>Population</th><th>Source</th></tr><tr><td>Prévalence de l’hyperthyroïdie</td><td>1,2–1,6 % (manifeste 0,5–0,6 % ; infraclinique 0,7–1,0 %)</td><td>Population générale (ETA)</td><td>ETA 2018</td></tr><tr><td>Incidence de la maladie de Basedow</td><td>20–30 nouveaux cas pour 100 000 par an</td><td>Zone iodo-suffisante</td><td>ETA 2018</td></tr><tr><td>Risque de maladie de Basedow sur la vie</td><td>Environ 3 % des femmes, 0,5 % des hommes ; pic entre 30 et 60 ans</td><td>Adultes</td><td>ETA 2018</td></tr><tr><td>Incidence de l’hyperthyroïdie</td><td>51 pour 100 000 par an ; prévalence 0,75 %</td><td>Europe, 1975–2012 (méta-analyse)</td><td>Garmendia Madariaga 2014</td></tr><tr><td>Prévalence en Suisse</td><td>Manifeste 0,5–0,8 % ; infraclinique 1–5 %</td><td>Population suisse (estimation d’une experte, sans étude suisse primaire)</td><td>ARS MEDICI 2023</td></tr><tr><td>Goitres nodulaires toxiques</td><td>≈ 60 % des hyperthyroïdies en carence iodée ; 15–30 % en zone iodo-suffisante</td><td>Adultes</td><td>EANM 2023</td></tr></table><p>Lecture du tableau : l’incidence de 51 pour 100 000 par an de la méta-analyse concerne toutes les hyperthyroïdies, celle de 20 à 30 pour 100 000 concerne la seule maladie de Basedow ; les deux chiffres ne se contredisent donc pas. Un dépistage général de la TSH n’est pas recommandé chez l’asymptomatique.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24423323/" target="_blank" rel="noopener">Garmendia Madariaga et coll. — incidence et prévalence des dysfonctions thyroïdiennes en Europe, méta-analyse — 2014, résumé</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a>.</p>
<h3 id="e05-a03-partie-2">Iode et causes selon la région</h3>
<p>La cause dominante dépend de l’apport en iode. En zone de carence iodée, les goitres nodulaires toxiques représentent environ 60 % des hyperthyroïdies ; en zone iodo-suffisante, 15 à 30 %. Ils restent la cause la plus fréquente chez le sujet âgé issu de zones carencées. La Suisse iode son <button class="w" data-k="e05-iode-suisse">sel à 25 mg d’iode par kilogramme</button> : on peut s’attendre à une répartition proche de celle des zones iodo-suffisantes, où les goitres nodulaires toxiques ne représentent qu’une part de 15 à 30 % ; aucune donnée suisse ne le confirme directement. Un excès d’iode apporté par des algues ou des compléments alimentaires peut provoquer perte de poids, troubles du rythme, insomnie, tremblement ou anxiété.</p><p class="src">Sources : <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV — sel iodé — page consultée le 14 octobre 2026</a>.</p>
<h3 id="e05-a03-partie-3">Complications et pronostic</h3>
<p>L’hyperthyroïdie non traitée entraîne perte de poids, ostéoporose et fractures de fragilité, fibrillation auriculaire, embolies et dysfonction cardiovasculaire. Le mécanisme est le même que celui des symptômes : l’excès d’hormones augmente la fréquence cardiaque, accélère le remodelage osseux et surcharge le myocarde. Pour l’<button class="w" data-k="e05-infraclinique-risques">hyperthyroïdie infraclinique avec TSH inférieure à 0,1 mU/l</button>, le risque coronarien, rythmique et osseux est déjà augmenté.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p>
<div class="key"><b>À retenir.</b> La maladie de Basedow touche surtout la femme entre 30 et 60 ans ; l’apport en iode du pays fixe la répartition des causes. L’hyperthyroïdie non traitée altère le cœur et l’os ; même infraclinique, elle justifie une recherche de cause lorsque la TSH est inférieure à 0,1 mU/l. La partie suivante explique comment les causes produisent l’excès d’hormones.</div>
</section>
<section class="ilot" id="e05-a04"><h2><span class="n">A04</span> Physiopathologie</h2>
<h3 id="e05-a04-partie-1">Basedow : anticorps stimulants</h3>
<p>Dans la thyroïde normale, la TSH se fixe à son récepteur ; la boucle de rétrocontrôle adapte la production d’hormones aux besoins. Dans la maladie de Basedow, ce circuit est détourné. Des <button class="w" data-k="e05-trak-mecanisme">anticorps stimulants</button>, surtout de classe IgG1, se fixent sur le récepteur de la TSH, augmentent l’AMPc intracellulaire et provoquent la libération d’hormones ainsi que la croissance des thyréocytes. La glande s’hypertrophie de façon diffuse, ce qui explique le goitre diffus. Le même récepteur interagit avec celui de l’<button class="w" data-k="e05-igf1r">IGF-1</button> sur les fibroblastes orbitaires, ce qui relie la thyroïde à l’orbitopathie.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p>
<h3 id="e05-a04-partie-2">Terrain génétique et environnemental</h3>
<p>Trente pour cent des patients ont un apparenté atteint de maladie de Basedow ou de thyroïdite d’Hashimoto, et 80 % de la susceptibilité est génétique selon les études de jumeaux. Les gènes en cause comprennent <b>HLA-DR3</b> et <b>HLA-DR4</b>, <b>CTLA-4</b>, <b>PTPN22</b>, <b>BACH2</b>, <b>CD40</b> et un variant non codant du gène du récepteur de la TSH. Les facteurs d’environnement sont le tabac, un apport iodé élevé, le stress et la grossesse ; la contraception orale et le sexe masculin sont protecteurs.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p>
<h3 id="e05-a04-partie-3">Autonomie nodulaire</h3>
<p>Les nodules autonomes fonctionnent sans stimulation par la TSH, à cause d’une <button class="w" data-k="e05-autonomie">mutation activatrice</button> du récepteur de la TSH ou de Gsα. En zone de carence iodée, la stimulation chronique favorise le goitre puis l’autonomie. Ce mécanisme explique que le TRAK soit négatif dans l’autonomie et que le traitement antithyroïdien ne serve que de pont vers un traitement définitif.</p><p class="src">Sources : <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p>
<h3 id="e05-a04-partie-4">Iode, amiodarone, produits de contraste</h3>
<p>Une charge iodée peut déclencher la thyrotoxicose (<button class="w" data-k="e05-jod-basedow">surcharge iodée</button>). L’<button class="w" data-k="e05-amiodarone">amiodarone</button> agit par deux mécanismes distincts : une hyperthyroïdie induite par l’iode (type 1) ou une thyroïdite destructrice (type 2). Son effet inhibiteur sur la conversion de T4 en T3 modifie en outre le profil hormonal. L’amiodarone peut aussi déclencher une hyperthyroïdie jusqu’à quelques mois après son arrêt ; son élimination est lente (longue demi-vie).</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/29594056/" target="_blank" rel="noopener">ETA — recommandations 2018 sur les dysfonctions thyroïdiennes liées à l’amiodarone (Bartalena et coll.) — mars 2018, résumé</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34395299/" target="_blank" rel="noopener">ETA — recommandations 2021 sur les dysfonctions induites par les produits de contraste iodés (Bednarczuk et coll.) — 16 juin 2021, résumé</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680333930163" target="_blank" rel="noopener">Swissmedic — Cordarone comprimés (amiodarone), information professionnelle — avril 2024</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p>
<h3 id="e05-a04-partie-5">Immunothérapies, reconstitution immunitaire, hCG</h3>
<p>Trois situations méritent une attention particulière. Après un traitement par l’<button class="w" data-k="e05-alemtuzumab">alemtuzumab</button>, un Basedow apparaît chez 20 à 30 % des patients. Les <button class="w" data-k="e05-checkpoint">inhibiteurs de points de contrôle</button> provoquent une thyroïdite précoce. Enfin, l’<button class="w" data-k="e05-hcg">hCG</button> stimule la thyroïde au premier trimestre de la grossesse.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31791071/" target="_blank" rel="noopener">Koehler et coll. — Schilddrüse und Schwangerschaft — décembre 2019, résumé</a>.</p>
<div class="key"><b>À retenir.</b> Chaque cause de thyrotoxicose détourne la chaîne TSH, récepteur, AMPc, hormones par un mécanisme différent : anticorps, mutation, surcharge en iode ou destruction. Cette chaîne explique pourquoi les examens (TRAK, scintigraphie) et les traitements diffèrent. La partie suivante porte sur l’examen clinique.</div>
</section>
<section class="ilot" id="e05-a05"><h2><span class="n">A05</span> Anamnèse et examen clinique</h2>
<h3 id="e05-a05-partie-1">Symptômes</h3>
<p>Les symptômes communs à toutes les causes découlent de l’excès d’hormones : perte de poids, palpitations, tachycardie, hypertension systolique, tremblement fin, sudation, selles fréquentes, nervosité, hyperactivité, fatigue et faiblesse musculaire. La peau est chaude et moite. Dans la maladie de Basedow s’ajoutent une atteinte cutanée du tibia, une exophtalmie et un goitre diffus. Mme L. cumule les signes communs et deux signes spécifiques (goitre diffus, rétraction palpébrale).</p><div class="two"><div class="card"><b>Sujet âgé</b><p>Le tableau peut être fruste (fatigue, troubles de l’humeur, dyspnée : thyrotoxicose <button class="w" data-k="e05-apathique">apathique</button>) ou dramatique (fibrillation auriculaire, insuffisance cardiaque, syndrome coronarien). Le risque d’orbitopathie est plus grand, et celui d’une agranulocytose grave aussi.</p></div><div class="card"><b>Enfant et adolescent</b><p>Le diagnostic est souvent tardif : baisse des résultats scolaires, changement de comportement, anxiété, troubles du sommeil. Chez l’adolescente amaigrie, on conclut à tort à un trouble du comportement alimentaire.</p></div></div><p class="src">Sources : <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a>.</p>
<h3 id="e05-a05-partie-2">Antécédents et médicaments à rechercher</h3>
<p>L’interrogatoire recherche une cause médicamenteuse ou une exposition à l’iode. Il note : l’amiodarone, les produits de contraste iodés, les algues et compléments riches en iode, la lévothyroxine prise sans indication, la <button class="w" data-k="e05-biotine">biotine</button> (faux profil biologique), l’alemtuzumab et les inhibiteurs de points de contrôle immunitaire. Il note aussi les antécédents familiaux de maladie de Basedow ou d’Hashimoto, le tabagisme et une grossesse récente. Un excès d’iode apporté par des algues peut donner amaigrissement, troubles du rythme, insomnie, tremblement ou anxiété : ces signes imitent ceux d’une thyrotoxicose.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV — sel iodé — page consultée le 14 octobre 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29264498/" target="_blank" rel="noopener">Cas clinique d’interférence de la biotine simulant une maladie de Basedow (hôpital de Bicêtre) — 2017, résumé</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30376773/" target="_blank" rel="noopener">Praxis — Slahor, Thyreotoxikose und Thyreoiditis — 2018, résumé</a>.</p>
<h3 id="e05-a05-partie-3">Signes généraux et cardiovasculaires</h3>
<p>L’examen mesure la fréquence cardiaque, la pression artérielle et le poids. La tachycardie, l’hypertension systolique et la perte de poids s’expliquent par l’action des hormones thyroïdiennes, qui augmentent la thermogenèse et le métabolisme de base et abaissent les résistances vasculaires. Un tremblement fin des mains et une peau chaude et moite complètent le tableau. Un pouls irrégulier fait chercher une fibrillation auriculaire, complication reconnue de l’hyperthyroïdie non traitée. Chez Mme L., la fréquence de 112/min au repos confirme le retentissement cardiaque.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p>
<h3 id="e05-a05-partie-4">Examen des yeux</h3>
<p>Les yeux sont examinés dès la première consultation, car l’orbitopathie conditionne le choix du traitement de l’hyperthyroïdie. On cherche la <button class="w" data-k="e05-retraction">rétraction de la paupière supérieure</button>, la proptose et les signes inflammatoires. La figure 1 montre une exophtalmie bilatérale avec une rétraction palpébrale nette.</p><figure><img src="assets/img/cycle3/e05/proptosis_and_lid_retraction_from_graves_disease.jpg" alt="Visage de face : yeux saillants, paupières supérieures rétractées découvrant la sclère au-dessus de l&#x27;iris." loading="lazy"><figcaption>Figure 1 — Exophtalmie bilatérale et rétraction des paupières supérieures dans une orbitopathie basedowienne : la sclère blanche est visible au-dessus de l’iris des deux yeux.<br>Crédit : Jonathan Trobe (University of Michigan Kellogg Eye Center), CC BY 3.0. <a href="https://commons.wikimedia.org/wiki/File:Proptosis_and_lid_retraction_from_Graves%27_Disease.jpg" target="_blank" rel="noopener">Page Commons</a> · <a href="https://creativecommons.org/licenses/by/3.0" target="_blank" rel="noopener">CC BY 3.0</a>.</figcaption></figure><p>Le <button class="w" data-k="e05-cas-score">score d’activité clinique (CAS)</button> compte sept signes inflammatoires. Le tableau suivant les détaille ; l’orbitopathie est active à partir de 3 points sur 7.</p><table class='t'><tr><th>Item du CAS</th><th>Comment le repérer</th><th>Point</th></tr><tr><td>Douleur rétrobulbaire spontanée</td><td>Interrogatoire : douleur derrière le globe, au repos</td><td>1</td></tr><tr><td>Douleur aux mouvements oculaires verticaux</td><td>Interrogatoire : douleur au regard vers le haut ou le bas</td><td>1</td></tr><tr><td>Rougeur palpébrale</td><td>Observation de la paupière</td><td>1</td></tr><tr><td>Rougeur conjonctivale</td><td>Observation de la conjonctive</td><td>1</td></tr><tr><td>Œdème de la caroncule ou du pli semi-lunaire</td><td>Observation de l’angle interne de l’œil</td><td>1</td></tr><tr><td>Œdème palpébral</td><td>Observation de la paupière gonflée</td><td>1</td></tr><tr><td>Chémosis</td><td>Observation de la conjonctive soulevée par l’œdème</td><td>1</td></tr></table><p>Lecture du tableau : chaque item vaut un point, sans pondération. Mme L. présente une rougeur palpébrale et un œdème palpébral : son score est de 2 sur 7, donc sous le seuil d’activité de 3 sur 7. Un troisième signe suffirait à classer l’orbitopathie comme active. Le traitement de l’orbitopathie est exposé en A10.</p><p class="src">Sources : <a href="https://academic.oup.com/ejendo/article/185/4/G43/6680998" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a>.</p>
<h3 id="e05-a05-partie-5">Peau, extrémités, cou</h3>
<p>La peau et les extrémités sont examinées par inspection et palpation. L’atteinte prétibiale se présente comme une peau épaissie, indurée, sur la face antérieure des jambes. <button class="w" data-k="e05-myxoedeme">La figure 2</button> réunit des doigts tuméfiés et ce signe cutané chez une femme de 33 ans en hyperthyroïdie.</p><figure><img src="assets/img/cycle3/e05/myxedema.jpg" alt="Deux photographies : mains aux doigts tuméfiés, puis jambes à la peau épaissie et indurée sur la face antérieure." loading="lazy"><figcaption>Figure 2 — Dermopathie et acropachie thyroïdiennes chez une femme de 33 ans en hyperthyroïdie : en haut, doigts tuméfiés ; en bas, épaississement cutané induré des faces antérieures des jambes (myxœdème prétibial).<br>Crédit : Herbert L. Fred et Hendrik A. van Dijk, CC BY 2.0. <a href="https://commons.wikimedia.org/wiki/File:Myxedema.jpg" target="_blank" rel="noopener">Page Commons</a> · <a href="https://creativecommons.org/licenses/by/2.0" target="_blank" rel="noopener">CC BY 2.0</a>.</figcaption></figure><p>Au cou, la palpation de la thyroïde sépare un goitre diffus, caractéristique de la maladie de Basedow, d’un goitre nodulaire, qui oriente vers l’autonomie. Un souffle est possible sur un goitre basedowien. Enfin, une faiblesse musculaire soudaine avec baisse du potassium évoque une <button class="w" data-k="e05-paralysie-periodique">paralysie périodique thyrotoxique</button>.</p><p class="src">Sources : <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Swissmedic — Prednisone Streuli 5, 20 et 50 mg, information professionnelle — juin 2026</a>.</p>
<div class="key"><b>À retenir.</b> L’examen d’une thyrotoxicose combine les signes de l’excès d’hormones (tachycardie, tremblement, chaleur) et les signes propres à la cause (goitre, yeux, peau). L’interrogatoire cherche toujours l’iode, l’amiodarone et la biotine. La partie suivante transforme ces indices en démarche diagnostique.</div>
</section>
<section class="ilot" id="e05-a06"><h2><span class="n">A06</span> Diagnostic et diagnostic différentiel</h2>
<h3 id="e05-a06-partie-1">Démarche biologique</h3>
<p>En Suisse, le bilan initial suit le <button class="w" data-k="e05-reflexe">test réflexe</button> : la TSH est dosée seule, puis le laboratoire ajoute la T4 libre et la T3 si la TSH est supprimée. La TSH est l’examen le plus sensible, car la relation entre T4 libre et TSH est logarithmique-linéaire inverse : une petite variation de la T4 libre produit une grande variation de la TSH. Une TSH normale exclut la plupart des hyperthyroïdies et des hypothyroïdies. Elle ne les exclut pas en cas de dysthyroïdie centrale, de résistance aux hormones thyroïdiennes, d’adénome hypophysaire sécrétant la TSH, ni sous glucocorticoïdes ou dopamine. Quand l’hyperthyroïdie est fortement suspectée, le médecin demande d’emblée la TSH et la T4 libre.</p><p>Chez Mme L., la TSH est inférieure à 0,01 mU/l, la T4 libre est à 48 pmol/l et la T3 libre à 16 pmol/l : la thyrotoxicose est confirmée.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p>
<h3 id="e05-a06-partie-2">Confirmer la cause</h3>
<p>Un TRAK positif signe la maladie de Basedow. Les tests de liaison de deuxième et troisième génération ont une sensibilité de 97 % et une spécificité de 98 % dans une méta-analyse de 21 études ; le laboratoire suisse de référence indique une positivité d’environ 90 % dans la maladie de Basedow, moins de 10 % dans la thyroïdite d’Hashimoto et aucune élévation dans l’autonomie. Cette différence de 97 % et 90 % tient à la méthode et à la population étudiée. Un TRAK négatif n’exclut pas la maladie : la scintigraphie distingue alors un Basedow sans anticorps (fixation homogène augmentée), des nodules autonomes et une thyroïdite (fixation nulle ou basse).</p><p>L’échographie avec Doppler couleur soutient le diagnostic : la glande est souvent augmentée de volume, hypoéchogène et très vascularisée (« thyroid inferno »). Un aspect échographique typique associé à un TRAK positif rend la scintigraphie inutile dans la grande majorité des cas. La société suisse d’endocrinologie précise, dans sa liste Smarter Medicine, qu’en cas d’hyperthyroïdie l’échographie aide à distinguer Basedow, autonomie nodulaire et thyroïdite, et influence la conduite. La scintigraphie est suggérée dès qu’un nodule coexiste avec l’hyperthyroïdie et avant l’iode 131.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/69_Choosing_Wisely/Top.5.list.SGED.Fachpublikum_formatted.pdf" target="_blank" rel="noopener">SSED — liste Top 5 Smarter Medicine, version pour professionnels — non datée, consultée le 14 octobre 2026</a> ; <a href="https://doi.org/10.1530/ETJ-23-0067" target="_blank" rel="noopener">ETA — recommandations 2023 sur les nodules thyroïdiens (Durante et coll.) — 1 octobre 2023</a>.</p>
<h3 id="e05-a06-partie-3">Algorithme</h3>
<p>Le schéma suivant résume la démarche. Il enchaîne la TSH, les hormones libres, le TRAK avec l’échographie, puis la scintigraphie quand l’échographie et l’anticorps ne tranchent pas.</p><figure><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma didactique : démarche diagnostique devant une suspicion de thyrotoxicose, de la TSH à l’examen décisif." font-family="sans-serif" font-size="14" text-anchor="middle" width="560" height="600" viewBox="0 0 560 600"><defs><marker id="e05-fl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f2c66"></path></marker></defs><rect x="170" y="10" width="220" height="44" rx="8" fill="#eef2fa" stroke="#0f2c66"></rect><text x="280" y="37" fill="#0f2c66">TSH seule (test réflexe)</text><line x1="280" y1="54" x2="140" y2="96" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><line x1="280" y1="54" x2="420" y2="96" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><rect x="10" y="98" width="260" height="62" rx="8" fill="#ffffff" stroke="#0f2c66"></rect><text x="140" y="123" fill="#0f2c66">TSH normale</text><text x="140" y="145" fill="#0f2c66">thyrotoxicose le plus souvent exclue</text><rect x="300" y="98" width="250" height="62" rx="8" fill="#ffffff" stroke="#0f2c66"></rect><text x="425" y="123" fill="#0f2c66">TSH supprimée</text><text x="425" y="145" fill="#0f2c66">T4 libre + T3 ajoutées</text><line x1="425" y1="160" x2="425" y2="196" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><rect x="300" y="198" width="250" height="62" rx="8" fill="#eef2fa" stroke="#0f2c66"></rect><text x="425" y="223" fill="#0f2c66">Thyrotoxicose confirmée</text><text x="425" y="245" fill="#0f2c66">TRAK + écho-Doppler</text><line x1="360" y1="260" x2="160" y2="306" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><line x1="490" y1="260" x2="470" y2="306" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><rect x="20" y="308" width="270" height="76" rx="8" fill="#ffffff" stroke="#0f2c66"></rect><text x="155" y="333" fill="#0f2c66">TRAK positif</text><text x="155" y="355" fill="#0f2c66">maladie de Basedow</text><text x="155" y="374" fill="#0f2c66">(Doppler hypervasculaire)</text><rect x="330" y="308" width="220" height="76" rx="8" fill="#ffffff" stroke="#0f2c66"></rect><text x="440" y="333" fill="#0f2c66">TRAK négatif</text><text x="440" y="355" fill="#0f2c66">ou nodules</text><text x="440" y="374" fill="#0f2c66">ou avant iode 131</text><line x1="440" y1="384" x2="440" y2="424" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><rect x="300" y="426" width="250" height="44" rx="8" fill="#eef2fa" stroke="#0f2c66"></rect><text x="425" y="453" fill="#0f2c66">Scintigraphie thyroïdienne</text><line x1="340" y1="470" x2="100" y2="514" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><line x1="425" y1="470" x2="285" y2="514" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><line x1="510" y1="470" x2="480" y2="514" stroke="#0f2c66" marker-end="url(#e05-fl)"></line><rect x="10" y="516" width="180" height="70" rx="8" fill="#ffffff" stroke="#0f2c66"></rect><text x="100" y="541" fill="#0f2c66">Fixation homogène</text><text x="100" y="561" fill="#0f2c66">Basedow</text><text x="100" y="577" fill="#0f2c66">sans anticorps</text><rect x="200" y="516" width="170" height="70" rx="8" fill="#ffffff" stroke="#0f2c66"></rect><text x="285" y="541" fill="#0f2c66">Fixation focale</text><text x="285" y="561" fill="#0f2c66">ou hétérogène</text><text x="285" y="577" fill="#0f2c66">autonomie nodulaire</text><rect x="380" y="516" width="170" height="70" rx="8" fill="#ffffff" stroke="#0f2c66"></rect><text x="465" y="541" fill="#0f2c66">Fixation nulle</text><text x="465" y="561" fill="#0f2c66">ou basse</text><text x="465" y="577" fill="#0f2c66">thyroïdite, apport exogène</text></svg><figcaption>Schéma didactique — Démarche diagnostique devant une thyrotoxicose : la TSH décide d’abord, le TRAK et l’échographie confirment le Basedow, la scintigraphie sépare les autres causes. Ce schéma résume des sources lues ; il n’est pas une recommandation officielle.</figcaption></figure><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/7_Endokrinologie/72_Empfehlungen_SGED/recommandations_postanalytique_bilan_thyroidien_20251010.pdf" target="_blank" rel="noopener">SSCC (approuvé par la SSED) — test réflexe du bilan thyroïdien initial — octobre 2025</a> ; <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p>
<h3 id="e05-a06-partie-4">Différentiel des hormones anormales</h3>
<p>Devant une TSH basse avec hormones anormales, le médecin classe les diagnostics d’abord par gravité (ce qui tue ou menace un organe), puis par fréquence. Le tableau suivant indique, pour chaque diagnostic, le critère qui le distingue et l’examen décisif. Trois lignes donnent accès à une explication par un mot vert : l’<button class="w" data-k="e05-thyreotrope">adénome thyréotrope</button>, la <button class="w" data-k="e05-factice">thyrotoxicose factice</button> et le <button class="w" data-k="e05-struma-ovarii">struma ovarii</button>.</p><table class='t'><tr><th>Rang</th><th>Diagnostic</th><th>Gravité</th><th>Discriminant</th><th>Examen décisif</th></tr><tr><td>1</td><td>Crise thyrotoxique</td><td>Vitale, mortalité d’environ 10 %</td><td>Thyrotoxicose avec fièvre ≥ 38 °C, tachycardie ≥ 130/min, trouble de conscience, insuffisance cardiaque, atteinte digestive ou hépatique ; facteur déclenchant</td><td>Diagnostic clinique : score de Burch-Wartofsky ≥ 45 ou critères JTA ; T3 et T4 libres élevées</td></tr><tr><td>2</td><td>Thyrotoxicose induite par l’amiodarone (types 1, 2 ou mixte)</td><td>Parfois mortelle chez le cardiaque ; thyroïdectomie urgente possible</td><td>Amiodarone en cours ou arrêtée depuis quelques mois ; aggravation d’une arythmie ou d’une insuffisance cardiaque</td><td>TSH effondrée ; Doppler (débit réduit dans le type 2) ; fixation d’iode faussée par le médicament</td></tr><tr><td>3</td><td>Adénome thyréotrope ou résistance aux hormones thyroïdiennes</td><td>Erreur thérapeutique grave (ablation, croissance tumorale)</td><td>T4 et T3 libres élevées avec TSH normale ou élevée</td><td>Test de freinage à la T3, test au TRH, IRM hypophysaire, génétique</td></tr><tr><td>4</td><td>Maladie de Basedow</td><td>Orbitopathie, cardiopathie, crise</td><td>Goitre diffus, orbitopathie, atteinte prétibiale ; femme de 30 à 60 ans ; cause la plus fréquente en zone iodo-suffisante</td><td>TRAK positif (seuil du laboratoire, par exemple 1,22 UI/l) ; écho-Doppler hypervasculaire</td></tr><tr><td>5</td><td>Goitre multinodulaire toxique ou adénome toxique</td><td>Sujet âgé, fibrillation auriculaire</td><td>Goitre nodulaire ancien, âge avancé, T3-thyrotoxicose fréquente, déclenchement par l’iode ; TRAK négatif</td><td>Scintigraphie (fixation focale ou hétérogène, parenchyme freiné)</td></tr><tr><td>6</td><td>Thyroïdite destructrice (subaiguë, silencieuse, du post-partum, médicamenteuse, sous immunothérapie)</td><td>En général bénigne, évolution triphasique</td><td>Douleur cervicale (de Quervain), post-partum, immunothérapie récente ; ni goitre basedowien ni orbitopathie</td><td>Scintigraphie : fixation nulle ou basse ; Doppler : débit réduit</td></tr><tr><td>7</td><td>Thyrotoxicose gestationnelle transitoire liée à l’hCG</td><td>Bénigne, sans antithyroïdien</td><td>Premier trimestre, TSH abaissée, ni orbitopathie ni goitre ; TRAK négatif</td><td>Contexte et TRAK ; intervalles de grossesse du laboratoire</td></tr><tr><td>8</td><td>Thyrotoxicose factice ou iatrogène</td><td>Surdosage volontaire potentiellement mortel</td><td>Absence de goitre et d’anticorps, prise d’hormones (perte de poids recherchée)</td><td>Thyroglobuline basse ou indétectable ; fixation basse ; Doppler sans hypervascularisation</td></tr><tr><td>9</td><td>Faux profil biologique (biotine, anticorps anti-streptavidine, héparine pour la T4 libre)</td><td>Risque de traitement inutile</td><td>Discordance entre clinique et biologie</td><td>Autre méthode de dosage ou répétition une semaine après l’arrêt de la biotine</td></tr><tr><td>10</td><td>Struma ovarii (tissu ectopique)</td><td>Rare</td><td>Hyperthyroïdie résistante, masse ovarienne</td><td>Imagerie pelvienne, histologie</td></tr></table><p>Lecture du tableau : les trois premiers diagnostics sont ceux qu’une erreur rend dangereux. La crise thyrotoxique exige un traitement immédiat (A07). La thyrotoxicose induite par l’amiodarone peut tuer le patient atteint d’une maladie cardiaque. L’adénome thyréotrope est le piège thérapeutique : traiter la thyroïde aggrave la tumeur. Les lignes 4 et 5 sont les plus fréquentes. La mortalité de 10 % de la crise s’applique aux crises déclarées, non à l’ensemble des thyrotoxicoses.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000490384" target="_blank" rel="noopener">ETA — recommandations 2018 sur l’hyperthyroïdie de Basedow (Kahaly et coll.) — 25 juillet 2018</a> ; <a href="https://www.jstage.jst.go.jp/article/endocrj/63/12/63_EJ16-0336/_pdf" target="_blank" rel="noopener">JTA — recommandations 2016 sur la crise thyrotoxique (Satoh et coll.) — 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29594056/" target="_blank" rel="noopener">ETA — recommandations 2018 sur les dysfonctions thyroïdiennes liées à l’amiodarone (Bartalena et coll.) — mars 2018, résumé</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680333930163" target="_blank" rel="noopener">Swissmedic — Cordarone comprimés (amiodarone), information professionnelle — avril 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24783044/" target="_blank" rel="noopener">ETA — recommandations 2013 sur les adénomes hypophysaires sécrétant la TSH — 2013, résumé</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31791071/" target="_blank" rel="noopener">Koehler et coll. — Schilddrüse und Schwangerschaft — décembre 2019, résumé</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10195380/" target="_blank" rel="noopener">Bogazzi, Bartalena et coll. — thyrotoxicose factice, séries italiennes — 1996 et 1999, résumés</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29264498/" target="_blank" rel="noopener">Cas clinique d’interférence de la biotine simulant une maladie de Basedow (hôpital de Bicêtre) — 2017, résumé</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34387530/" target="_blank" rel="noopener">Podfigurna et coll. — hyperthyroïdie et struma ovarii — 2021, résumé</a> ; <a href="https://ribook.risch.ch/de/analysen/tsh" target="_blank" rel="noopener">Laboratoire Risch — catalogue Ribook (TSH, T4 libre, T3 libre, TRAK) — modifié le 30 juillet 2026</a>.</p>
<h3 id="e05-a06-partie-5">Goitre et exophtalmie</h3>
<p>Deux autres situations de départ conduisent à la thyrotoxicose : la tuméfaction cervicale et l’exophtalmie. Le premier tableau classe les causes d’un goitre ; le second, celles d’une exophtalmie (<button class="w" data-k="e05-igg4-orbite">maladie associée aux IgG4</button> incluse).</p><table class='t'><tr><th>Rang</th><th>Diagnostic</th><th>Gravité</th><th>Discriminant</th><th>Examen décisif</th></tr><tr><td>1</td><td>Goitre compressif (trachée)</td><td>Obstruction des voies aériennes ; carbimazole contre-indiqué en cas de compression trachéale</td><td>Dyspnée, stridor, goitre plongeant</td><td>Échographie ; scanner sans contraste ou IRM si goitre plongeant</td></tr><tr><td>2</td><td>Cancer thyroïdien dans un goitre nodulaire</td><td>Malin</td><td>Nodule non fonctionnel (froid), caractères échographiques suspects</td><td>Scintigraphie, puis cytoponction des nodules non fonctionnels suspects ; nodules hyperfonctionnels non ponctionnés</td></tr><tr><td>3</td><td>Goitre diffus basedowien</td><td>—</td><td>Goitre diffus, souffle possible, orbitopathie</td><td>TRAK, écho-Doppler</td></tr><tr><td>4</td><td>Goitre nodulaire toxique</td><td>—</td><td>Nodules, âge</td><td>Scintigraphie</td></tr><tr><td>5</td><td>Thyroïdite, douloureuse ou non</td><td>—</td><td>Douleur, évolution triphasique</td><td>Fixation nulle</td></tr><tr><td>6</td><td>Goitre non toxique</td><td>—</td><td>TSH normale</td><td>TSH, échographie</td></tr></table><p>Lecture du tableau : un goitre qui comprime la trachée passe avant toute cause fonctionnelle, car il menace les voies aériennes ; l’information professionnelle suisse du carbimazole le range parmi les contre-indications. Un nodule non fonctionnel sur scintigraphie reste suspect, un nodule hyperfonctionnel ne se ponctionne pas.</p><table class='t'><tr><th>Rang</th><th>Diagnostic</th><th>Gravité</th><th>Discriminant</th><th>Examen décisif</th></tr><tr><td>1</td><td>Orbitopathie basedowienne menaçant la vue (neuropathie optique, ulcération cornéenne)</td><td>Perte visuelle : urgence</td><td>Baisse d’acuité, dyschromatopsie, exposition cornéenne</td><td>Examen ophtalmologique spécialisé urgent ; IRM orbitaire</td></tr><tr><td>2</td><td>Pathologie orbitaire non thyroïdienne (inflammatoire, infectieuse, tumorale, maladie associée aux IgG4)</td><td>Variable, parfois grave</td><td>Fonction thyroïdienne normale, atteinte unilatérale ou des glandes lacrymales ou salivaires</td><td>Imagerie orbitaire, biologie, histologie</td></tr><tr><td>3</td><td>Orbitopathie basedowienne active (CAS ≥ 3/7) ou inactive</td><td>Qualité de vie</td><td>Bilatérale, rétraction palpébrale, TRAK positifs ; 6 à 7 % chez l’euthyroïdien ou l’hypothyroïdien</td><td>CAS, gravité EUGOGO, TRAK, IRM en cas de doute</td></tr></table><p>Lecture du tableau : une baisse d’acuité visuelle ou une atteinte cornéenne dans une orbitopathie basedowienne est une urgence ophtalmologique. Une exophtalmie unilatérale ou avec fonction thyroïdienne normale fait chercher une cause orbitaire non thyroïdienne.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Swissmedic — Néo-Mercazole 5 mg (carbimazole), information professionnelle — août 2020</a> ; <a href="https://doi.org/10.1007/s00259-023-06274-5" target="_blank" rel="noopener">EANM — recommandation 2023 sur la thérapie par l’iode radioactif des maladies thyroïdiennes bénignes (Campennì et coll.) — 2023</a> ; <a href="https://doi.org/10.1530/ETJ-23-0067" target="_blank" rel="noopener">ETA — recommandations 2023 sur les nodules thyroïdiens (Durante et coll.) — 1 octobre 2023</a> ; <a href="https://academic.oup.com/ejendo/article/185/4/G43/6680998" target="_blank" rel="noopener">EUGOGO — recommandations 2021 sur le traitement médical de l’orbitopathie basedowienne (Bartalena et coll.) — 27 août 2021</a> ; <a href="https://doi.org/10.1530/ETJ-25-0318" target="_blank" rel="noopener">Bartalena et coll. — comparaison EUGOGO 2021 et consensus ATA/ETA 2022 sur l’orbitopathie — 8 décembre 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42021675/" target="_blank" rel="noopener">Praxis — Hösli, Brändle et coll., Orbitopathie nicht immer endokrin bedingt — avril 2026, résumé</a> ; <a href="https://www.rosenfluh.ch/media/arsmedici/2023/17/Hyper-und-Hypothyreose-Wann-sollte-man-danach-suchen-wie-abklaeren-und-wie-behandeln.pdf" target="_blank" rel="noopener">ARS MEDICI — Prof. M. Christ-Crain, Hôpital universitaire de Bâle : hyper- et hypothyroïdie — 25 août 2023</a>.</p><div class="quiz ui" id="e05-quiz-1"><p><b>Quiz 1 — Une femme de 29 ans, enceinte de 9 semaines, a une TSH à 0,05 mU/l, un TRAK négatif et pas de goitre. Quelle est la conduite ?</b></p><button data-ok="0">Maladie de Basedow : antithyroïdien immédiat à pleine dose.</button><button data-ok="1">Thyrotoxicose gestationnelle liée à l’hCG : pas d’antithyroïdien, surveillance.</button><button data-ok="0">Iode 131 : traitement définitif d’emblée.</button><p class="fb" hidden>Au premier trimestre, l’hCG stimule le récepteur de la TSH et abaisse la TSH ; cette thyrotoxicose gestationnelle transitoire est la première cause d’hyperthyroïdie de la grossesse et ne nécessite pas d’antithyroïdien (revue de 2019). Le TRAK négatif et l’absence de goitre écartent la maladie de Basedow. L’iode 131 est de toute façon contre-indiqué pendant la grossesse. Le médecin compare la valeur aux intervalles de grossesse du laboratoire (par exemple, TSH de 0,1 à 2,5 mU/l au premier trimestre chez Risch).</p></div>
<div class="key"><b>À retenir.</b> Le diagnostic repose sur trois temps : la TSH (puis T4 libre et T3), le TRAK avec l’échographie Doppler, et la scintigraphie quand ces examens ne tranchent pas. Le différentiel se classe par gravité avant la fréquence : crise, amiodarone, adénome thyréotrope d’abord. La partie suivante traite l’urgence.</div>
