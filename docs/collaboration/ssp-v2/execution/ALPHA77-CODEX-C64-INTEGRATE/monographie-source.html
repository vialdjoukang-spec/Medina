</div></div><div class="panel" hidden="" id="pS"><div class="sci-bar ui" role="tablist"><button aria-controls="c64-s-semio" aria-selected="true" data-s="c64-s-semio" id="c64-tab-semio" role="tab">Sémiologie fondamentale et analytique</button><button aria-controls="c64-s-anat" aria-selected="false" data-s="c64-s-anat" id="c64-tab-anat" role="tab">Anatomie</button><button aria-controls="c64-s-histo" aria-selected="false" data-s="c64-s-histo" id="c64-tab-histo" role="tab">Histologie et anatomopathologie</button><button aria-controls="c64-s-physio" aria-selected="false" data-s="c64-s-physio" id="c64-tab-physio" role="tab">Physiologie</button><button aria-controls="c64-s-bio" aria-selected="false" data-s="c64-s-bio" id="c64-tab-bio" role="tab">Biochimie et biologie moléculaire</button><button aria-controls="c64-s-immuno" aria-selected="false" data-s="c64-s-immuno" id="c64-tab-immuno" role="tab">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div aria-labelledby="c64-tab-semio" class="sci" id="c64-s-semio" role="tabpanel"><section class="ilot" data-semiology="normal" id="c64-semio-normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le rein normal associe parenchyme filtrant et modificateur de l’urine, vaisseaux et voies collectrices. Le cortex et la médulla ne sont pas équivalents au bassinet. Cette séparation explique pourquoi une masse du parenchyme et une lésion urothéliale peuvent produire la même hématurie tout en relevant d’examens et de traitements distincts.</p><p>La fonction globale peut rester conservée malgré une lésion focale grâce au parenchyme restant et au rein opposé. Des urines sans sang visible, une palpation normale et une créatinine stable sont donc des observations utiles mais ne constituent pas un dépistage négatif du cancer. Les valeurs antérieures, les limites du laboratoire et les conditions de mesure donnent le véritable point de comparaison.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax Anatomy and Physiology 2e — §25.3, anatomie externe, interne, hile, néphrons</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS,CIM-10-GM 2024 français — ClassesC64etC65, XML officiel</a>.</p><figure data-c64-figure="kidney"><div data-c64-frame="tall"><img alt="Planche anatomique humaine historique du rein normal" loading="lazy" src="assets/img/c64/alpha/codex/Kidney_section_vertical.png"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span><span aria-hidden="true" data-c64-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cortex : parenchyme périphérique, distinct de la voie urinaire.</li><li>Pyramide médullaire : repère anatomique normal.</li><li>Bassinet : voie collectrice exclue du code C64 comme siège primitif.</li><li>Uretère : continuité de la voie excrétrice.</li></ol><p>Image normale historique, sans tumeur ni mesure fonctionnelle. Les annotations HTML ne modifient pas les pixels ; aucune tumeur fictive n’est dessinée.</p><p data-c64-credit="">Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 · <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" rel="noopener" target="_blank">Domaine public</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure></section>
<section class="ilot" data-semiology="signs" id="c64-semio-signs"><h3>Décrire la présentation et sa temporalité</h3><p>Distinguer masse découverte à l’imagerie, douleur ressentie et masse palpable. Pour une hématurie, préciser visibilité, caillots, récidives, douleur et retentissement. Une douleur du flanc continue n’a pas la même histoire qu’une colique aiguë ; l’histoire oriente sans attribuer automatiquement chaque symptôme à la masse découverte.</p><p>Fièvre, fatigue, perte d’appétit et amaigrissement sont non spécifiques. Une douleur osseuse, une toux ou un symptôme neurologique dirigent la recherche d’extension. Sous traitement, une nouvelle diarrhée, une dyspnée, des céphalées ou une faiblesse doivent être datées par rapport aux médicaments, y compris après l’arrêt d’une immunothérapie. La triade classique est trop rare pour servir de filtre diagnostique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a>.</p></section>
<section class="ilot" data-semiology="mechanisms" id="c64-semio-mechanisms"><h3>Relier un mécanisme à une conduite</h3><p>Une tumeur qui saigne vers les cavités peut produire une hématurie et des caillots ; ces derniers peuvent gêner l’écoulement. Une extension dans les veines peut contribuer à une circulation collatérale, une varicocèle persistante ou des œdèmes. Ces signes suggèrent un mécanisme que l’imagerie doit vérifier ; ils ne déterminent pas eux-mêmes la hauteur d’un thrombus.</p><p>La voie <button class="w" data-k="c64-vhl">VHL</button>–<button class="w" data-k="c64-hif">HIF</button>–<button class="w" data-k="c64-vegf">VEGF</button> favorise l’angiogenèse dans les cellules claires. Le traitement antiangiogénique peut en retour provoquer hypertension et protéinurie : un même patient nécessite donc une lecture de la maladie et des effets du traitement. Une augmentation de créatinine sous <button class="w" data-k="c64-pd1">anti-PD1</button> ne doit pas être automatiquement appelée néphrite immune ; déshydratation, obstacle, infection et autres médicaments restent dans le différentiel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p></section>
<section class="ilot" data-semiology="examination" id="c64-semio-examination"><h3>Observer et mesurer de manière reproductible</h3><p>L’examen mesure pression, pouls, température, poids et état général, puis recherche masse abdominale, adénopathies et signes veineux selon contexte. La persistance d’une varicocèle en décubitus mérite une attention particulière ; elle n’est pas un diagnostic autonome de cancer. L’absence de masse palpable ne permet pas d’écarter une lésion visualisée.</p><p>Les mesures initiales servent de référence pendant le traitement. Une pression inattendue est vérifiée dans des conditions appropriées ; une protéinurie détectée est quantifiée selon le protocole clinique. Pour l’imagerie, comparer la même lésion et des phases pertinentes évite de confondre changement de technique et changement tumoral. Le chiffre brut ne doit jamais perdre son unité et sa date.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a>.</p></section>
<section class="ilot" data-semiology="interpretation" id="c64-semio-interpretation"><h3>Valeur d’un résultat positif ou négatif</h3><p>Une masse rehaussée augmente la suspicion de tumeur solide mais ne sépare pas toutes les lésions bénignes et malignes. Une <button class="w" data-k="c64-biopsie">biopsie</button> diagnostique a de bonnes performances pour malignité ; le résultat non diagnostique et le <button class="w" data-k="c64-grade">grade</button> sont des problèmes différents. La valeur d’un test se lit avec la probabilité avant examen, la qualité du prélèvement et les conséquences d’une erreur.</p><p>Un calcium corrigé élevé entre dans IMDC, mais n’identifie pas à lui seul le mécanisme d’une hypercalcémie. Une anémie peut résulter de plusieurs causes. Un ganglion augmenté de taille n’est pas automatiquement métastatique. À l’inverse, absence d’hématurie, créatinine normale et bonne autonomie ne prouvent pas un faible stade. Le raisonnement relie résultats concordants et discordants.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a>.</p></section>
<section class="ilot" data-semiology="differentials" id="c64-semio-differentials"><h3>Discriminer les diagnostics concurrents</h3><p>Une lésion kystique suit les critères de <button class="w" data-k="c64-bosniak">Bosniak</button> ; une masse riche en graisse oriente vers angiomyolipome ; une masse oncocytaire reste parfois indéterminée même après carotte. Une lésion centrée sur les cavités appelle la question urothéliale. Le contexte infectieux, un cancer antérieur ou une présentation multifocale peut rendre la biopsie particulièrement décisive.</p><p>Ne pas réduire l’hématurie à la masse rénale simplement parce que celle-ci est visible. Les voies urinaires peuvent porter une autre cause. De même, une diarrhée sous traitement combiné peut venir du TKI, d’une colite immune ou d’une infection ; la conduite dépend de la gravité et de l’étiologie, pas du seul nom du médicament.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p></section>
<section class="ilot" data-semiology="urgency" id="c64-semio-urgency"><h3>Repérer ce qui change immédiatement le niveau de soins</h3><p>Saignement mal toléré, rétention par caillots, détresse respiratoire, déficit neurologique ou altération majeure de l’état général imposent une évaluation urgente. Sous immunothérapie, la toxicité peut toucher plusieurs organes et survenir tardivement ; une suspicion de pneumopathie, myocardite, colite sévère ou insuffisance endocrinienne ne doit pas attendre le prochain rendez-vous programmé.</p><p>La priorité est de mesurer le retentissement, stabiliser et contacter l’équipe compétente. La suspension ou l’arrêt des agents dépend ensuite du type et du grade de toxicité selon les FI ; il n’existe pas une réduction de dose universelle pour tous les médicaments. L’évaluation des causes alternatives accompagne la prise en charge, sans retarder une action nécessaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a>.</p></section>
<section class="ilot" data-semiology="limits" id="c64-semio-limits"><h3>Populations et limites d’application suisse</h3><p>Les données EAU concernent largement l’adulte et souvent les cellules claires. Les enfants, grossesses, insuffisances d’organe sévères et histologies rares ne sont pas représentés de la même manière. Les marqueurs et critères ne doivent pas être extrapolés : WHO/ISUP ne grade pas le chromophobe ; IMDC ne définit pas l’adjuvant.</p><p>Les FI suisses consultées restreignent les quatre associations de première ligne au risque intermédiaire/défavorable, alors que l’EAU discute aussi certaines options au risque favorable. Cette divergence reste visible. Les figures sont des originaux humains historiques ou des microphotographies ; aucune ne montre les anomalies génétiques ou la totalité d’une tumeur. Les contrôles de cette leçon sont des auto-relectures IA, sans validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a>.</p></section>
<section class="ilot" data-semiology="sources" id="c64-semio-sources"><h3>Correspondance des sources avec les décisions</h3><p>OFS étaye la fréquence suisse et le périmètre C64/C65. RMS 2018 et Inselspital apportent le contexte suisse des petites masses et de la préservation rénale ; leurs passages anciens ne déterminent pas seuls la classification ou les traitements actuels. EAU 2026 précise diagnostic, TNM, biopsie, risque, traitement et suivi. Les huit FI exactes soutiennent doses, voies, adaptations et précautions des produits cités.</p><p><b>Science → clinique.</b> Une masse silencieuse peut être significative ; un symptôme nouveau peut être dû au traitement.</p><p><b>Science → examen.</b> L’imagerie localise, la pathologie caractérise, la biologie mesure fonction et retentissement.</p><p><b>Science → traitement.</b> La conduite est liée à une population et à une preuve ; elle est réévaluée si la trajectoire change.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://krebs-monitoring.bfs.admin.ch/fr/detail/C64" rel="noopener" target="_blank">OFS, Monitorage du cancer, données 2025 — Chiffres clés C64, moyennes annuelles 2018–2022</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/420513/3655172/RMS_629_2160.pdf" rel="noopener" target="_blank">Liernur, Iselin, Klein ; HUG/Revue Médicale Suisse 2018 — RMS2018;14:2160–2163, quatre pages cliniques</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a>.</p></section>
<div class="key"><b>À retenir.</b> Décrire, localiser, expliquer puis vérifier : un signe ne remplace pas toute la chaîne diagnostique.</div></div><div aria-labelledby="c64-tab-anat" class="sci" hidden="" id="c64-s-anat" role="tabpanel"><section class="ilot" id="c64-s-anat-content"><h2>Anatomie : situer avant de classer</h2><p>Les reins sont rétropéritonéaux, de part et d’autre du rachis. Une capsule fibreuse les entoure ; graisse périrénale et fascia constituent des plans anatomiques utiles à la description de l’extension. Le hile réunit vaisseaux et voies excrétrices. Le cortex périphérique et la médulla organisée en pyramides appartiennent au parenchyme, tandis que les papilles évacuent l’urine vers les calices, puis le bassinet et l’uretère.</p><p>La planche historique ci-dessous permet de repérer ces compartiments. Elle ne dessine pas une tumeur et ne donne pas sa vascularisation. Elle montre pourquoi « rein » peut désigner, dans le langage courant, plusieurs tissus dont les cancers ne sont pas identiques. Dans C64, le siège parenchymateux est central ; bassinet et calices comme siège primitif relèvent C65 dans la source suisse.</p><figure data-c64-figure="kidney"><div data-c64-frame="tall"><img alt="Planche anatomique humaine historique du rein normal" loading="lazy" src="assets/img/c64/alpha/codex/Kidney_section_vertical.png"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span><span aria-hidden="true" data-c64-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cortex : parenchyme périphérique, distinct de la voie urinaire.</li><li>Pyramide médullaire : repère anatomique normal.</li><li>Bassinet : voie collectrice exclue du code C64 comme siège primitif.</li><li>Uretère : continuité de la voie excrétrice.</li></ol><p>Image normale historique, sans tumeur ni mesure fonctionnelle. Les annotations HTML ne modifient pas les pixels ; aucune tumeur fictive n’est dessinée.</p><p data-c64-credit="">Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 · <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" rel="noopener" target="_blank">Domaine public</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les artères rénales proviennent de l’aorte ; les veines rénales se drainent vers la veine cave inférieure. Une extension tumorale dans ces veines peut progresser au-delà du rein sans que le diamètre tumoral seul rende compte de l’étendue. Le compte rendu précise veine rénale, branches, veine cave, niveau par rapport au diaphragme et éventuelle invasion pariétale. Un schéma mental de la continuité veineuse aide à comprendre T3a, T3b et T3c.</p><p>Le fascia de Gerota sert de frontière de classification. Une extension dans la graisse périrénale ou du sinus sans le franchir n’est pas décrite comme une extension T4 ; le franchissement et l’invasion contiguë de la surrénale homolatérale changent la catégorie. Une surrénale normale n’est pas retirée automatiquement parce que la tumeur siège au pôle supérieur. Les structures normales guident la décision opératoire, sans imposer un geste identique à toutes les localisations.</p><p>Une masse exophytique périphérique et une masse proche du sinus ou des cavités peuvent avoir un même diamètre mais une complexité technique différente. Les scores de néphrométrie codent cette anatomie ; ils ne sont pas des scores de malignité. La préservation du parenchyme requiert d’évaluer les rapports avec les vaisseaux et les cavités, le rein opposé et les conséquences d’une ischémie ou d’une perte de tissu.</p><p><b>Science → clinique.</b> Varicocèle persistante et œdèmes peuvent orienter vers un problème veineux, sans en prouver la cause.</p><p><b>Science → examen.</b> CT et IRM doivent répondre à l’extension réelle et aux rapports de la masse.</p><p><b>Science → traitement.</b> Chirurgie partielle, radicale et traitement du thrombus se décident à partir d’une anatomie précise, de la fonction et du risque oncologique.</p><div class="key"><b>À retenir.</b> Localisation, taille et extension sont trois descriptions complémentaires.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax Anatomy and Physiology 2e — §25.3, anatomie externe, interne, hile, néphrons</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS,CIM-10-GM 2024 français — ClassesC64etC65, XML officiel</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §4,pp.17–18,tableau 4.1</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a>.</p></section>
</div><div aria-labelledby="c64-tab-histo" class="sci" hidden="" id="c64-s-histo" role="tabpanel"><section class="ilot" id="c64-s-histo-content"><h2>Histologie : reconnaître les familles et les limites du champ</h2><p>Le carcinome à cellules claires présente des cellules dont le cytoplasme apparaît pâle dans de nombreux champs, avec un réseau vasculaire caractéristique. La morphologie doit être interprétée sur un prélèvement adéquat, parfois avec immunohistochimie et analyses complémentaires. Une photographie pédagogique n’est pas un compte rendu anatomopathologique et ne remplace pas l’évaluation de toute la pièce.</p><figure data-c64-figure="clear"><div data-c64-frame="wide"><img alt="Microphotographie humaine de carcinome rénal à cellules claires, grade 2 attribué par la source" loading="lazy" src="assets/img/c64/alpha/codex/Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Noyau sombre dans une cellule tumorale, au centre du champ.</li><li>Cytoplasme pâle : morphologie visible de cellules claires.</li><li>Hématie dans un petit espace vasculaire : repère de la vascularisation du champ.</li></ol><p>La source attribue le diagnostic de carcinome à cellules claires et le grade 2. Une photographie isolée ne suffit pas à grader toute une tumeur ni à rechercher une mutation VHL. Original vu le 2 novembre 2026 ; provenance et droits lus dans les métadonnées Commons ; aucune lecture intégrale de l’article de provenance revendiquée.</p><p data-c64-credit="">Mikael Häggström, microphotographie personnelle · <a href="https://commons.wikimedia.org/wiki/File:Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" rel="noopener" target="_blank">CC0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le carcinome papillaire constitue une autre famille. La classification OMS 2022 a abandonné la séparation systématique en types I et II, car certaines lésions autrefois regroupées recouvrent des entités biologiquement distinctes. Une légende ancienne contenant « type II » ne justifie pas de restaurer cette subdivision dans le cours. La microphotographie suivante montre un champ pigmenté attribué à un carcinome papillaire ; elle ne montre pas toute l’architecture ni toutes les caractéristiques de la tumeur.</p><figure data-c64-figure="papillary"><div data-c64-frame="wide"><img alt="Microphotographie humaine de carcinome rénal papillaire avec pigment brun décrit comme hémosidérine" loading="lazy" src="assets/img/c64/alpha/codex/Histopathology_of_papillary_renal_cell_carcinoma_with_ample_hemosiderin.jpg"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Contingent de cellules tumorales à fort grossissement : noyaux violets et cytoplasme pigmenté.</li><li>Pigment brun abondant : hémosidérine décrite par la source.</li><li>Hématies dans l’espace clair, distinctes des granules pigmentés.</li></ol><p>Diagnostic papillaire attribué à la source ; le champ à fort grossissement ne montre pas toute l’architecture. La division historique en types I/II n’est pas utilisée dans la classification OMS 2022. Original vu le 2 novembre 2026 ; provenance et droits lus dans les métadonnées Commons ; aucune lecture intégrale de l’article de provenance revendiquée.</p><p data-c64-credit="">Mikael Häggström, microphotographie personnelle · <a href="https://commons.wikimedia.org/wiki/File:Histopathology_of_papillary_renal_cell_carcinoma_with_ample_hemosiderin.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" rel="noopener" target="_blank">CC0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le carcinome chromophobe peut comporter des cellules pâles ou éosinophiles. La source de la troisième image décrit un contingent éosinophile sans cellules pâles dans ce champ. Le diagnostic différentiel avec certaines néoplasies oncocytaires nécessite une expertise ; l’aspect rose d’un cytoplasme ne suffit pas. Le grade WHO/ISUP utilisé pour cellules claires et papillaire n’est pas appliqué au chromophobe.</p><figure data-c64-figure="chromo"><div data-c64-frame="wide"><img alt="Microphotographie humaine de carcinome rénal chromophobe éosinophile, avec barre originale de 100 micromètres" loading="lazy" src="assets/img/c64/alpha/codex/Histopathology_of_eosinophilic_chromophobe_renal_cell_carcinoma,_without_pale_cells.jpg"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Noyau et cytoplasme éosinophile dans le contingent photographié.</li><li>Cellules à cytoplasme rose : l’absence de cellules pâles est décrite par la source.</li><li>Barre d’échelle originale : 100 µm selon la légende publiée.</li></ol><p>Diagnostic de carcinome chromophobe éosinophile attribué à Ohashi et collaborateurs. Le grade WHO/ISUP n’est pas appliqué à cet histotype ; cette coupe ne suffit pas à distinguer tous les oncocytomes. Original vu le 2 novembre 2026 ; provenance et droits lus dans les métadonnées Commons ; aucune lecture intégrale de l’article de provenance revendiquée.</p><p data-c64-credit="">Riuko Ohashi et coll., Cancers 2019;11:1492, DOI 10.3390/cancers11101492 · <a href="https://commons.wikimedia.org/wiki/File:Histopathology_of_eosinophilic_chromophobe_renal_cell_carcinoma,_without_pale_cells.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les caractères <button class="w" data-k="c64-sarcomatoide">sarcomatoïdes</button> et rhabdoïdes sont des signes de dédifférenciation, pas de simples synonymes de grande taille. La nécrose, l’invasion vasculaire, les marges et l’extension apportent d’autres informations pronostiques. Un grade obtenu sur une carotte peut manquer un contingent plus agressif : c’est une limite d’échantillonnage, pas nécessairement une erreur de lecture.</p><p>Une biopsie oncocytaire peut rester indéterminée. L’OMS 2022 ne permet pas de certifier définitivement un <button class="w" data-k="c64-oncocytome">oncocytome</button> sur une simple carotte dans tous les cas ; le résultat doit être confronté à l’imagerie et à la décision envisagée. De même, un prélèvement nécrotique ou insuffisant ne prouve pas une lésion bénigne. La question clinique transmise au pathologiste influence les techniques et la qualité de la réponse.</p><p><b>Science → clinique.</b> L’histotype change les preuves de traitement disponibles ; toutes les tumeurs rénales ne se traitent pas comme des cellules claires.</p><p><b>Science → examen.</b> Biopsie et pièce répondent à la même maladie avec des capacités d’échantillonnage différentes.</p><p><b>Science → traitement.</b> Le choix systémique, l’adjuvant et le <button class="w" data-k="c64-genetique">conseil génétique</button> peuvent dépendre de l’histologie ; ils ne se fondent pas sur une seule image illustrative.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a>.</p></section>
<div class="key"><b>À retenir.</b> La nature tumorale, le grade et l’échantillonnage sont trois questions différentes.</div></div><div aria-labelledby="c64-tab-physio" class="sci" hidden="" id="c64-s-physio" role="tabpanel"><section class="ilot" id="c64-s-physio-content"><h2>Physiologie : préserver la fonction malgré une lésion focale</h2><p>Le néphron forme un filtrat au glomérule puis en modifie la composition par réabsorption et sécrétion tubulaires. L’urine finale reflète cette succession, pas une simple fuite du plasma. La planche humaine historique rappelle la répartition de certains échanges ; ses flèches appartiennent à l’original. Elle ne fournit pas les flux d’un patient et ne localise pas une tumeur.</p><figure data-c64-figure="nephron"><div data-c64-frame="tall"><img alt="Planche humaine historique des échanges du néphron normal" loading="lazy" src="assets/img/c64/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tubule proximal : modification du filtrat après la filtration glomérulaire.</li><li>Branche ascendante : repère d’échanges de sodium, potassium et chlorure.</li><li>Canal collecteur : ajustement final de l’eau et des solutés.</li></ol><p>Image normale historique, sans tumeur ni mesure fonctionnelle. Les annotations HTML ne modifient pas les pixels ; aucune tumeur fictive n’est dessinée.</p><p data-c64-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une tumeur focale peut laisser une fonction globale relativement normale. La créatinine dépend du fonctionnement total et de facteurs de production et de distribution ; elle ne décrit pas séparément les deux reins. Ainsi, une personne avec masse unilatérale peut avoir un débit estimé conservé, tandis qu’une autre avec petite masse et néphropathie antérieure dispose d’une réserve réduite. La même opération n’a pas le même coût fonctionnel dans ces deux situations.</p><p>Avant traitement, il faut connaître la trajectoire de créatinine, le débit estimé, la protéinurie et les comorbidités. Le rein opposé est évalué anatomiquement ; une mesure de fonction séparée peut aider lorsque le résultat influence le choix, notamment en fonction altérée, rein unique ou maladie bilatérale. Une valeur isolée n’épuise pas la notion de réserve rénale.</p><p>La <button class="w" data-k="c64-nephrectomie">néphrectomie partielle</button> vise à conserver des néphrons tout en obtenant un contrôle oncologique approprié. Elle ne signifie pas risque fonctionnel nul : perte de tissu, ischémie, complications et maladie rénale sous-jacente peuvent peser. La néphrectomie radicale retire davantage de parenchyme ; le bénéfice oncologique attendu doit être confronté aux conséquences possibles sur le long terme. Les données fonctionnelles ne prouvent pas à elles seules une différence de survie globale entre toutes les techniques.</p><p>Les traitements systémiques peuvent perturber cette physiologie. Diarrhée et vomissements réduisent les apports et favorisent la déshydratation ; les inhibiteurs de voies VEGF peuvent produire hypertension et protéinurie ; l’immunothérapie peut entraîner une néphrite. Une hausse de créatinine réclame donc un raisonnement causal et chronologique. Interrompre ou réduire un TKI et suspendre un anticorps ne suivent pas nécessairement les mêmes règles.</p><p>Après la phase oncologique, le suivi de fonction et de pression reste pertinent même si l’imagerie est espacée. Une consultation néphrologique se discute particulièrement en présence de protéinurie, maladie rénale ou débit postopératoire attendu inférieur à 45 mL/min/1,73 m². La prévention cardiovasculaire fait partie de cette prise en charge globale.</p><p><b>Science → clinique.</b> Une fonction normale n’exclut pas une masse ; une petite masse n’implique pas une grande réserve.</p><p><b>Science → examen.</b> Comparer fonction globale, imagerie du rein opposé et, si utile, fonction séparée.</p><p><b>Science → traitement.</b> Préserver les néphrons, prévenir la déshydratation et surveiller toxicités permettent de traiter le cancer sans négliger le rein restant.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax Anatomy and Physiology 2e — §25.3, anatomie externe, interne, hile, néphrons</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §9,pp.78–81,tableau 9.1</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p></section>
<div class="key"><b>À retenir.</b> Une fonction globale conservée ne signifie pas absence de lésion ; anticiper le rein restant.</div></div><div aria-labelledby="c64-tab-bio" class="sci" hidden="" id="c64-s-bio" role="tabpanel"><section class="ilot" id="c64-s-bio-content"><h2>Biochimie : de VHL–HIF aux nombres utilisés en clinique</h2><p>VHL participe à la régulation des facteurs induits par l’hypoxie. Dans les carcinomes à cellules claires sporadiques avec inactivation de cette voie, l’accumulation de HIF favorise l’expression de médiateurs comme VEGF et PDGF, qui soutiennent la néoangiogenèse. Le mécanisme relie une anomalie moléculaire à une propriété tissulaire et à des cibles médicamenteuses, sans constituer une recette de prédiction individuelle.</p><p>Les inhibiteurs de tyrosine kinase cités ciblent des récepteurs et voies de signalisation impliqués dans la croissance et la vascularisation. Le cabozantinib a notamment une activité sur VEGFR, MET et AXL ; d’autres agents ont des profils différents. Les qualifier tous d’« antiangiogéniques » est utile pour comprendre des toxicités communes, mais ne rend pas interchangeables leurs doses, interactions ou indications.</p><p>Le belzutifan illustre une cible située au niveau de HIF-2α. EAU 2026 décrit une activité dans certaines lignes de carcinome à cellules claires prétraité, avec anémie et hypoxie parmi les toxicités importantes. Cette mention de mécanisme et de preuves européennes ne fournit ici ni dose, ni promesse d’autorisation ou de remboursement suisse ; un produit et une indication suisses exacts devraient être vérifiés avant prescription.</p><figure data-c64-figure="clear"><div data-c64-frame="wide"><img alt="Microphotographie humaine de carcinome rénal à cellules claires, grade 2 attribué par la source" loading="lazy" src="assets/img/c64/alpha/codex/Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Noyau sombre dans une cellule tumorale, au centre du champ.</li><li>Cytoplasme pâle : morphologie visible de cellules claires.</li><li>Hématie dans un petit espace vasculaire : repère de la vascularisation du champ.</li></ol><p>La source attribue le diagnostic de carcinome à cellules claires et le grade 2. Une photographie isolée ne suffit pas à grader toute une tumeur ni à rechercher une mutation VHL. Original vu le 2 novembre 2026 ; provenance et droits lus dans les métadonnées Commons ; aucune lecture intégrale de l’article de provenance revendiquée.</p><p data-c64-credit="">Mikael Häggström, microphotographie personnelle · <a href="https://commons.wikimedia.org/wiki/File:Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" rel="noopener" target="_blank">CC0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La biochimie intervient aussi dans l’interprétation du risque. IMDC utilise un calcium corrigé au-dessus de la limite supérieure, une hémoglobine basse et des neutrophiles ou plaquettes élevés. Il faut identifier l’analyte, la méthode, l’unité et la limite du laboratoire. Le calcium total et le calcium corrigé ne sont pas des nombres interchangeables ; appliquer une formule sans connaître les unités ou sa validité peut créer une fausse catégorie.</p><p>Le rehaussement au scanner est un autre exemple de différence mesurée. Un gain de 35 HU entre 28 et 63 HU n’est pas un taux de croissance ni un pourcentage de malignité. Les unités Hounsfield décrivent l’atténuation ; la comparaison de phases renseigne sur l’arrivée du contraste. Une explication moléculaire de l’angiogenèse ne suffit pas à convertir toute masse rehaussée en cellules claires.</p><p>Enfin, les mesures d’effet clinique doivent rester distinctes. Dans KEYNOTE-564, le rapport de risques de décès rapporté est de 0,62 avec intervalle de confiance 0,44–0,87 ; les survies globales à 48 mois étaient 91,2 % et 86,0 % dans les bras comparés. Le premier chiffre est une mesure relative au cours du temps ; la différence de 5,2 points à cet horizon est une différence absolue estimée. Ni l’un ni l’autre ne garantit le bénéfice individuel et ils ne s’appliquent pas à toute masse opérée.</p><p><b>Science → clinique.</b> Un mécanisme rend cohérente une hypothèse ; il ne remplace pas un essai ni une mesure correctement interprétée.</p><p><b>Science → examen.</b> Vérifier unités, limites de laboratoire et population avant tout calcul de score ou de bénéfice.</p><p><b>Science → traitement.</b> Les cibles expliquent une partie de l’efficacité et des toxicités ; la dose reste celle du produit exact et de son contexte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.3.5,pp.48–50,tableau 7.1p.52,recommandationsp.53</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a>.</p></section>
<div class="key"><b>À retenir.</b> Un mécanisme, une mesure relative et une différence absolue ne répondent pas à la même question.</div></div><div aria-labelledby="c64-tab-immuno" class="sci" hidden="" id="c64-s-immuno" role="tabpanel"><section class="ilot" id="c64-s-immuno-content"><h2>Immunologie et physiopathologie : traiter une cible sans perdre le contexte</h2><p>Les points de contrôle immunitaires régulent l’activation lymphocytaire. Les anticorps dirigés contre PD-1, comme pembrolizumab et nivolumab, et contre CTLA-4, comme ipilimumab, peuvent restaurer une activité antitumorale. Ils ne détruisent pas simplement une cellule rénale par un effet cytotoxique direct. Leur efficacité et leurs toxicités résultent de mécanismes différents de ceux des inhibiteurs de kinase.</p><p>Dans le carcinome rénal, l’expression de PD-L1 n’est pas un critère de sélection de routine permettant de décider seul de ces traitements. Un marqueur peut être associé à un pronostic sans être un test prédictif validé pour choisir un médicament. Les indications reposent sur histologie, situation, risque et essais, puis sur le cadre suisse. La présence de cibles biologiques ne justifie pas n’importe quelle association.</p><p>L’association nivolumab–ipilimumab mobilise deux voies de contrôle immunitaire. Dans le schéma rénal suisse consulté, les quatre doses initiales utilisent nivolumab 3 mg/kg et ipilimumab 1 mg/kg toutes les trois semaines, avant entretien par nivolumab. Inverser ces doses en recopiant le mélanome est une erreur clinique concrète. Les associations anti-PD1–TKI ont encore d’autres schémas et toxicités.</p><p>L’activation immune peut toucher tissus sains : poumon, intestin, foie, rein, glandes endocrines, cœur ou autres organes. Les événements peuvent être multiples, graves et tardifs. Une diarrhée exige de rechercher gravité, colite et autres causes ; une dyspnée fait discuter inflammation pulmonaire, infection, embolie ou progression ; une hausse de créatinine n’est pas automatiquement immune. La concordance temporelle aide mais ne suffit pas.</p><p>Les FI décrivent des suspensions ou arrêts selon organe et grade, avec traitement immunosuppresseur ou substitutif selon le cas. Une réduction graduelle de dose d’anticorps n’est pas l’équivalent de celle d’un TKI. Le cours enseigne les signaux d’alerte et le recours rapide à l’équipe ; il ne condense pas toutes les toxicités en une dose universelle de corticoïde. Les protocoles d’urgence et la prescription spécialisée sont adaptés à l’organe réellement atteint.</p><p>Dans les formes héréditaires, le contexte moléculaire change également la stratégie. Une mutation somatique n’est pas la preuve d’une variante constitutionnelle transmissible. Bilatéralité, multifocalité, âge jeune, histoire familiale ou histologie caractéristique motivent le conseil génétique. Les syndromes VHL, Birt–Hogg–Dubé et FH ont des risques différents ; une surveillance jusqu’à une taille repère dans certaines formes VHL ne se transpose pas à un carcinome déficient en FH agressif.</p><p><b>Science → clinique.</b> Un symptôme sous traitement peut être une <button class="w" data-k="c64-toxicite">toxicité immune</button>, mais il faut aussi rechercher ses concurrents.</p><p><b>Science → examen.</b> Biologie, imagerie et parfois biopsie évaluent l’organe atteint ; PD-L1 seul ne choisit pas le traitement RCC.</p><p><b>Science → traitement.</b> Suspendre, traiter puis réévaluer selon la FI et l’équipe spécialisée ; ne pas appliquer un protocole d’un autre cancer ou d’un autre syndrome génétique.</p><div class="key"><b>À retenir.</b> Une même voie biologique peut être une cible thérapeutique et une source de toxicité.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.5,p.24 et§8,pp.75–77</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a>.</p><p>La microphotographie suivante rappelle le tissu tumoral ciblé ; elle ne montre ni lymphocytes fonctionnels, ni expression PD-L1, ni réponse à un anticorps. Ces mécanismes sont établis par les sources et ne sont pas inférés de la photographie.</p><figure data-c64-figure="clear"><div data-c64-frame="wide"><img alt="Microphotographie humaine de carcinome rénal à cellules claires, grade 2 attribué par la source" loading="lazy" src="assets/img/c64/alpha/codex/Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Noyau sombre dans une cellule tumorale, au centre du champ.</li><li>Cytoplasme pâle : morphologie visible de cellules claires.</li><li>Hématie dans un petit espace vasculaire : repère de la vascularisation du champ.</li></ol><p>La source attribue le diagnostic de carcinome à cellules claires et le grade 2. Une photographie isolée ne suffit pas à grader toute une tumeur ni à rechercher une mutation VHL. Original vu le 2 novembre 2026 ; provenance et droits lus dans les métadonnées Commons ; aucune lecture intégrale de l’article de provenance revendiquée.</p><p data-c64-credit="">Mikael Häggström, microphotographie personnelle · <a href="https://commons.wikimedia.org/wiki/File:Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" rel="noopener" target="_blank">CC0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure></section>
</div></div></div>


<div class="panel" hidden="" id="pP"><div class="chap-body"><section class="ilot" id="c64-p-principes"><h2>Prescrire selon la situation, l’histologie et le produit suisse</h2><p>Les traitements ci-dessous concernent l’adulte et relèvent d’une équipe expérimentée en oncologie. Les doses sont celles des <b>FI suisses des produits exacts consultés</b>, pas une prescription individualisée. Avant de choisir, préciser histotype, stade, risque, ligne, traitements antérieurs, fonctions rénale et hépatique, comorbidités, interactions et objectif partagé.</p><p>Les quatre associations de première ligne présentées ont, dans les FI suisses consultées, une indication de carcinome rénal avancé à risque <b>intermédiaire/défavorable</b>. L’EAU 2026 discute également certaines associations au risque favorable ; cette recommandation ne remplace pas l’autorisation suisse ni la vérification du remboursement. La forme IV d’un anticorps ne doit pas être confondue avec une présentation sous-cutanée portant un autre GTIN.</p><p>Un anticorps <button class="w" data-k="c64-pd1">anti-PD1</button> ou anti-CTLA4 n’est pas ajusté comme un TKI. Les FI prévoient suspensions et arrêts selon toxicité ; les TKI ont souvent des paliers de réduction. Toute modification est reliée à un effet identifié et au traitement associé. Une diarrhée sous combinaison ne permet pas, à elle seule, d’identifier le médicament responsable.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a>.</p></section>
<section class="ilot" id="c64-p-combinaisons"><h2>Schémas initiaux suisses en première ligne avancée</h2><table class="t"><thead><tr><th>Association</th><th>Schéma adulte dans les FI retenues</th><th>Point de sécurité</th></tr></thead><tbody><tr><td>Pembrolizumab + axitinib</td><td>Keytruda IV 200 mg toutes les 3 semaines ou 400 mg toutes les 6 semaines, perfusion 30 min ; Inlyta initialement 5 mg par voie orale deux fois/j.</td><td>Augmentation d’axitinib en association seulement après ≥6 semaines selon FI Keytruda et tolérance ; pas copie de l’escalade à 2 semaines de sa monothérapie.</td></tr><tr><td>Pembrolizumab + lenvatinib</td><td>Même schéma de Keytruda IV ; Kisplyx 20 mg par voie orale une fois/j.</td><td>Adapter lenvatinib à la fonction et aux toxicités ; contrôler pression, rein et protéinurie.</td></tr><tr><td>Nivolumab + cabozantinib</td><td>Opdivo IV 240 mg toutes les 2 semaines, perfusion 30 min ; Cabometyx 40 mg par voie orale une fois/j.</td><td>Cabozantinib 40 mg en association, pas 60 mg de monothérapie ; nivolumab jusqu’à 24 mois dans ce schéma selon FI.</td></tr><tr><td>Nivolumab + ipilimumab</td><td>Nivolumab 3 mg/kg IV 30 min puis ipilimumab 1 mg/kg IV 30 min le même jour, toutes les 3 semaines pour 4 doses ; ensuite nivolumab 240 mg IV toutes les 2 semaines.</td><td>Premier entretien 3 semaines après la dernière association ; poches et filtres distincts. Ne pas inverser 3/1 en 1/3 du mélanome.</td></tr></tbody></table><p>Ces schémas ne sont pas une hiérarchie universelle. Besoin de réponse, profil de toxicité, maladies auto-immunes, risque cardiovasculaire, fonction et souhaits participent au choix. Le pembrolizumab avancé est généralement limité à 24 mois selon les conditions de FI, ou arrêté plus tôt pour progression ou toxicité ; l’adjuvant a une durée différente. La poursuite de chaque composant après arrêt de l’autre se décide selon les informations professionnelles et la situation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a>.</p></section>
<section class="ilot" id="c64-p-pembrolizumab"><h2>Pembrolizumab — Keytruda IV, GTIN 7680662310025</h2><p>Le pembrolizumab est un anticorps anti-PD1. La FI suisse prévoit les associations axitinib et lenvatinib en première ligne avancée à risque intermédiaire/défavorable, ainsi que l’adjuvant de certains carcinomes à cellules claires à risque accru après résection. Le schéma adulte IV est de <b>200 mg toutes les 3 semaines ou 400 mg toutes les 6 semaines</b>, en perfusion de 30 minutes. En adjuvant, la durée maximale prévue est de <b>12 mois</b>, sauf récidive ou toxicité imposant l’arrêt.</p><p>Aucune adaptation posologique n’est nécessaire en insuffisance rénale légère à modérée ; l’insuffisance sévère n’a pas été étudiée. La FI ne demande pas d’adaptation hépatique légère ou modérée, mais les données modérées sont limitées et l’atteinte sévère non étudiée. « Pas d’adaptation » n’équivaut pas à « absence de risque », notamment devant une atteinte d’organe nouvelle.</p><p>La contre-indication est l’hypersensibilité sévère au principe actif ou aux excipients. Surveiller signes pulmonaires, digestifs, hépatiques, rénaux, endocriniens et cardiaques. Les effets immunes peuvent survenir après l’arrêt. La conduite distingue suspension, arrêt définitif et traitement de l’organe atteint ; une dose réduite improvisée n’est pas la solution universelle.</p><p>L’adjuvant exige une discussion de la probabilité de récidive et du bénéfice absolu attendu. Les résultats de KEYNOTE-564 ne couvrent pas toutes les petites masses rénales ni les autres histotypes. La décision d’utiliser le produit dans une situation particulière doit rester liée à sa FI et à l’évaluation multidisciplinaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.3.5,pp.48–50,tableau 7.1p.52,recommandationsp.53</a>.</p></section>
<section class="ilot" id="c64-p-nivoipi"><h2>Nivolumab et ipilimumab — deux produits, un schéma rénal précis</h2><p><b>Opdivo IV, GTIN 7680656600019</b>, et <b>Yervoy, GTIN 7680617980013</b>, sont les produits consultés. Pour le carcinome rénal avancé en première ligne à risque intermédiaire/défavorable, l’induction est nivolumab 3 mg/kg avec ipilimumab 1 mg/kg toutes les 3 semaines, quatre doses. Le nivolumab est administré d’abord, puis l’ipilimumab le même jour dans des dispositifs distincts. L’entretien rénal décrit dans ces FI est nivolumab 240 mg toutes les 2 semaines ; le schéma 480 mg toutes les 4 semaines d’autres indications n’est pas transposé ici.</p><p>Exemple pédagogique fictif à 70 kg, sans ajustement clinique : nivolumab 3 × 70 = 210 mg et ipilimumab 1 × 70 = 70 mg pour une dose d’induction. Ce calcul illustre la distinction des médicaments ; la préparation, les volumes, le poids utilisé et les conditions d’administration sont vérifiés par l’équipe et la pharmacie.</p><p>Pour le nivolumab, les données pharmacocinétiques n’imposent pas d’ajustement en insuffisance rénale légère/modérée ; les données sévères sont trop limitées pour conclure. Même absence d’ajustement dans l’atteinte hépatique légère/modérée, avec prudence si sévère. Pour l’ipilimumab, les analyses pharmacocinétiques n’imposent pas d’adaptation rénale légère/modérée ni hépatique légère ; sécurité et efficacité dans les insuffisances d’organe ne sont pas directement établies. La FI appelle à la prudence devant transaminases initiales ≥5 fois la limite supérieure ou bilirubine >3 fois cette limite. L’hypersensibilité est contre-indiquée pour chacun des deux produits. Les deux FI doivent être lues pour l’association ; les fonctions hépatique et thyroïdienne et les symptômes digestifs sont notamment évalués avant administrations d’ipilimumab.</p><p>L’association expose à des toxicités immunes parfois graves. Une diarrhée importante, une douleur abdominale, une dyspnée, une faiblesse inhabituelle ou une douleur thoracique déclenchent une évaluation rapide. La dose de corticoïde et les critères de reprise dépendent de l’organe et du grade ; ils ne sont pas remplacés par un protocole unique dans cette fiche.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a>.</p></section>
<section class="ilot" id="c64-p-cabozantinib"><h2>Cabozantinib — Cabometyx, GTIN 7680664710014</h2><p>La FI couvre les comprimés de 20, 40 et 60 mg. Elle prévoit <b>60 mg une fois/j en monothérapie après un traitement dirigé contre <button class="w" data-k="c64-vegf">VEGF</button></b>, et <b>40 mg une fois/j avec nivolumab</b> en première ligne avancée à risque intermédiaire/défavorable. La recommandation européenne de certaines utilisations plus précoces ne doit pas effacer cette indication suisse précise.</p><table class="t"><thead><tr><th>Situation</th><th>Instruction de FI</th></tr></thead><tbody><tr><td>Prise</td><td>Avaler entier ; ne pas manger pendant au moins 2 h avant et 1 h après la prise.</td></tr><tr><td>Réduction en monothérapie</td><td>60 → 40 → 20 mg/j selon toxicité.</td></tr><tr><td>Réduction en association nivolumab</td><td>40 → 20 mg/j → 20 mg un jour sur deux selon toxicité.</td></tr><tr><td>Insuffisance rénale</td><td>Prudence légère/modérée ; sévère non recommandée faute de données suffisantes.</td></tr><tr><td>Insuffisance hépatique</td><td>Légère : pas d’adaptation ; Child-Pugh B : pas de recommandation posologique possible avec données limitées ; Child-Pugh C : non recommandé.</td></tr><tr><td>Interactions</td><td>Prudence avec inhibiteurs puissants CYP3A4 ; éviter inducteurs puissants et rechercher alternatives.</td></tr><tr><td>Chirurgie programmée</td><td>Si possible, interrompre au moins 28 jours avant ; reprise seulement après cicatrisation adéquate selon clinicien.</td></tr></tbody></table><p>Contrôler pression avant traitement puis précocement, protéines urinaires, fonction, électrolytes et foie. Diarrhée et vomissements peuvent provoquer déshydratation ; les risques incluent hémorragie, thrombose, perforation/fistule et troubles de cicatrisation. Une hémorragie sévère ou son risque impose une évaluation spécifique. La contre-indication formelle est l’hypersensibilité ; les situations non recommandées ou de grande prudence ne sont pas renommées arbitrairement contre-indications.</p><p>En association avec nivolumab, une atteinte hépatique peut relever des deux agents ; les critères de suspension ou d’arrêt de la FI combinée doivent être appliqués. La présence d’un <button class="w" data-k="c64-thrombus">thrombus tumoral</button> n’autorise pas à traiter toute image veineuse comme une thrombose ordinaire sans expertise.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a>.</p></section>
<section class="ilot" id="c64-p-axitinib"><h2>Axitinib — Inlyta, GTIN 7680622810015</h2><p>La FI propre d’Inlyta indique le carcinome rénal avancé après échec d’un traitement systémique préalable. L’utilisation en première ligne avec pembrolizumab est documentée dans la FI de Keytruda. La dose initiale est <b>5 mg par voie orale deux fois/j</b>, avec ou sans repas. En cas de toxicité nécessitant réduction, les paliers sont 3 mg puis 2 mg deux fois/j.</p><p>La FI d’Inlyta permet une augmentation en monothérapie après deux semaines sans effet indésirable de grade supérieur à 2, sauf si la pression est supérieure à 150/90 mmHg ou si un traitement hypotenseur est pris : passage à 7 mg, puis éventuellement 10 mg deux fois/j selon les mêmes critères. <b>En association avec pembrolizumab, le délai initial indiqué dans la FI de Keytruda est d’au moins six semaines</b>. Les conditions de pression et de tolérance restent à vérifier ; aucune escalade automatique n’est déduite d’une absence de plainte.</p><p>Aucun ajustement rénal n’est nécessaire selon la FI. En insuffisance hépatique légère Child A, pas d’ajustement ; en Child B, réduction initiale, par exemple de 5 à 2 mg deux fois/j ; Child C non évalué. En présence inévitable d’un inhibiteur puissant CYP3A4, une réduction d’environ moitié est recommandée, avec exemple 5 à 2 mg deux fois/j. Toute modification lors de l’arrêt de l’interaction est réévaluée.</p><p>Contrôler pression, fonction thyroïdienne, protéines urinaires et symptômes cardiaques ou hémorragiques. L’hypersensibilité est contre-indiquée. La mise en garde de la FI précise qu’Inlyta ne doit pas être administré aux patients présentant des métastases cérébrales ou ayant récemment présenté une hémorragie gastro-intestinale active, populations non évaluées dans les études citées. Cette restriction doit être vérifiée avec l’équipe avant prescription. Pour une chirurgie planifiée, l’interruption est d’au moins 24 h avant selon FI, et la reprise dépend d’une cicatrisation adéquate. Ce délai n’est pas celui du cabozantinib.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680622810015" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indication propre ; posologie ; adaptations ; sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p></section>
<section class="ilot" id="c64-p-lenvatinib"><h2>Lenvatinib — Kisplyx, GTIN 7680660850011</h2><p>Le produit rénal consulté est <b>Kisplyx</b>, capsules de 4 et 10 mg. En première ligne avancée à risque intermédiaire/défavorable avec pembrolizumab, la dose est <b>20 mg une fois/j</b>. Les réductions usuelles de cette association sont 14, 10 puis 8 mg/j selon toxicité. Le schéma après un traitement VEGF avec évérolimus est une autre indication et ne doit pas être confondu avec cette dose de première ligne.</p><table class="t"><thead><tr><th>Situation</th><th>Dose ou précaution de FI</th></tr></thead><tbody><tr><td>Insuffisance rénale légère/modérée</td><td>Pas d’ajustement initial.</td></tr><tr><td>Insuffisance rénale sévère</td><td>Dose initiale 10 mg/j dans l’association pembrolizumab.</td></tr><tr><td>Insuffisance rénale terminale</td><td>Non recommandé, faute d’étude.</td></tr><tr><td>Hépatique Child A/B</td><td>Pas d’ajustement initial.</td></tr><tr><td>Hépatique Child C</td><td>Dose initiale 10 mg/j ; données limitées.</td></tr><tr><td>Administration</td><td>Une prise quotidienne, avec ou sans nourriture ; capsules selon modalités exactes de FI.</td></tr></tbody></table><p>La pression doit être contrôlée avant traitement et surveillée. Rechercher protéinurie, altération rénale, troubles ioniques, diarrhée, vomissements et signes cardiaques. Une bandelette ≥2+ appelle une quantification et une décision selon la FI ; elle ne signifie pas automatiquement une excrétion de 2 g/j. Un syndrome néphrotique impose l’arrêt du lenvatinib selon FI. La déshydratation doit être corrigée et la dose réévaluée avec l’équipe.</p><p>La grossesse possible, la contraception et l’allaitement sont vérifiés dans les informations des deux médicaments. Les données pédiatriques ne permettent pas de déduire une dose de carcinome rénal de l’enfant. Le nom d’une autre marque de lenvatinib destinée à une autre indication ne justifie pas de copier son schéma.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p></section>
<section class="ilot" id="c64-p-tki-mono"><h2>Sunitinib et pazopanib : options de monothérapie, schémas distincts</h2><p>Selon la situation, notamment lorsque l’immunothérapie n’est pas possible, une monothérapie ciblée peut rester appropriée. Les FI suisses de ces deux produits couvrent le carcinome rénal avancé et/ou métastatique ; le choix tient compte des recommandations, des comorbidités et des autres options. Ils ne sont pas associés automatiquement à un anti-PD1.</p><table class="t"><thead><tr><th>Produit exact</th><th>Dose RCC</th><th>Adaptations et sécurité</th></tr></thead><tbody><tr><td>Sutent, GTIN 7680575630067</td><td>50 mg une fois/j pendant 4 semaines, puis pause 2 semaines ; avec ou sans repas.</td><td>Paliers 12,5 mg selon tolérance. Pas d’ajustement initial en insuffisance rénale légère à sévère ou sous dialyse, mais efficacité non étudiée chez les patients dialysés. Child A/B : pas d’ajustement ; Child C : prudence, non étudié.</td></tr><tr><td>Votrient, GTIN 7680603260020</td><td>800 mg une fois/j, au moins 1 h avant ou 2 h après repas ; comprimés entiers.</td><td>Réduction initiale 400 mg, puis paliers 200 mg. Clairance ≥30 mL/min : pas d’ajustement ; sévère/dialyse non recommandé. Hépatique modérée selon définition de FI : 200 mg/j ; sévère contre-indiquée.</td></tr></tbody></table><p>Pour <b>sunitinib</b>, le schéma continu à 37,5 mg d’une autre indication ne remplace pas le schéma RCC 4/2. Surveiller cœur, intervalle QT selon risque, pression, thyroïde, numération, foie et signes de microangiopathie ou de protéinurie. Les interactions CYP3A4 peuvent modifier l’exposition ; les gélules ne sont pas ouvertes ni mâchées.</p><p>Pour <b>pazopanib</b>, les tests hépatiques sont contrôlés avant traitement, aux semaines 3, 5, 7 et 9, puis aux mois 3 et 4 et ensuite régulièrement. Les définitions hépatiques utilisent notamment la bilirubine et ne sont pas remplacées sans précaution par un autre classement. Surveiller aussi pression, ECG et électrolytes selon contexte, fonction et protéinurie. L’hypersensibilité et l’insuffisance hépatique sévère sont contre-indiquées. Une chirurgie planifiée conduit à interrompre au plus tard sept jours avant selon FI ; reprise après cicatrisation adéquate.</p><p>Le pazopanib ne doit pas être associé sans vérification à des médicaments augmentant le pH gastrique : la FI recommande de les éviter, car ils peuvent réduire son absorption. Les deux agents ont des interactions importantes ; un bilan complet des médicaments et compléments est nécessaire. Les essais d’association de pazopanib avec certains traitements, dont pembrolizumab, ont montré des problèmes de toxicité ; on ne crée pas une combinaison en assemblant deux molécules actives séparément.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575630067" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; organes ; risques cardiaques/hépatiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680603260020" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; fonctions ; surveillance</a>.</p></section>
<section class="ilot" id="c64-p-securite"><h2>Surveillance pratique et motifs de contact rapide</h2><table class="t"><thead><tr><th>Avant et pendant</th><th>Pourquoi</th><th>Action devant anomalie</th></tr></thead><tbody><tr><td>Pression et symptômes cardiovasculaires</td><td>HTA, décompensation, événements vasculaires possibles sous TKI</td><td>Évaluer rapidement une poussée sévère ou douleur thoracique ; adaptation selon FI et clinique.</td></tr><tr><td>Créatinine, électrolytes, urines/protéines</td><td>Déshydratation, toxicité glomérulaire ou néphrite immune</td><td>Rechercher cause, gravité et obstacle ; suspension ou réduction selon agent, pas automatisme.</td></tr><tr><td>Foie et numération</td><td>Hépatotoxicité et effets hématologiques</td><td>Respecter calendrier du produit et critères de suspension/arrêt.</td></tr><tr><td>Thyroïde et signes endocriniens</td><td>Endocrinopathies sous TKI ou immunothérapie</td><td>Évaluer fatigue inhabituelle, hypotension, troubles métaboliques ; traitement spécialisé.</td></tr><tr><td>Diarrhée, douleur abdominale, dyspnée</td><td>Toxicité immune, infection ou effet TKI</td><td>Contacter l’équipe sans attendre si important, persistant ou associé à signes de gravité.</td></tr><tr><td>Interactions et interventions prévues</td><td>Exposition, saignement, cicatrisation</td><td>Vérifier CYP, médicaments associés et délai propre au produit ; pas délai unique de classe.</td></tr><tr><td>Projet de grossesse et allaitement</td><td>Risques reproductifs et données limitées</td><td>Décision oncologique/obstétricale ; vérifier contraception et durée propre à chaque FI.</td></tr></tbody></table><p>La reconnaissance d’une toxicité ne constitue pas son diagnostic définitif. Les mesures de sécurité et les examens se conduisent en parallèle. Les doses de traitements de support ou d’immunosuppression sont choisies selon la complication réelle ; aucune ordonnance universelle de corticoïde n’est déduite du seul mot « immunothérapie ».</p><div cl
