"3"]{left:75%;top:75%}[data-c64-figure="clear"] [data-c64-mark="1"]{left:55%;top:42%}[data-c64-figure="clear"] [data-c64-mark="2"]{left:65%;top:46%}[data-c64-figure="clear"] [data-c64-mark="3"]{left:40%;top:36%}[data-c64-figure="chromo"] [data-c64-mark="1"]{left:49%;top:63%}[data-c64-figure="chromo"] [data-c64-mark="2"]{left:73%;top:25%}[data-c64-figure="chromo"] [data-c64-mark="3"]{left:84%;top:92%}[data-c64-figure="papillary"] [data-c64-mark="1"]{left:28%;top:53%}[data-c64-figure="papillary"] [data-c64-mark="2"]{left:13%;top:47%}[data-c64-figure="papillary"] [data-c64-mark="3"]{left:88%;top:39%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#c64-1">Définition</a></li><li><a href="#c64-2">Épidémiologie</a></li><li><a href="#c64-3">Physiopathologie</a></li><li><a href="#c64-4">Démarche clinique</a></li><li><a href="#c64-5">Anamnèse</a></li><li><a href="#c64-6">Examen clinique</a></li><li><a href="#c64-7">Syndromes</a></li><li><a href="#c64-8">Diagnostic positif</a></li><li><a href="#c64-9">Explorations</a></li><li><a href="#c64-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#c64-11">Prise en charge</a></li><li><a href="#c64-12">Prévention, suivi et pronostic</a></li><li><a href="#c64-13">Points clés</a></li><li><a href="#c64-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="C64"><section class="ilot" id="c64-question"><h2>Une masse découverte par hasard : quel risque faut-il traiter ?</h2><p><b>Vignette fictive.</b> Une personne de 67 ans réalise une échographie pour une douleur digestive. Une masse rénale droite de 3,2 cm est décrite. Elle n’a ni hématurie ni douleur lombaire ; sa créatinine est stable. Elle craint qu’une opération retire nécessairement tout le rein. Le premier entretien explique qu’une masse est un constat d’imagerie, que toutes les masses ne sont pas malignes et que le choix dépend de la caractérisation, de l’extension, de la fonction rénale et des préférences.</p><p>Il faut rechercher les images antérieures, caractériser le rehaussement, examiner le rein opposé et discuter l’utilité d’une <button class="w" data-k="c64-biopsie">biopsie</button>. Une petite tumeur limitée peut relever d’une chirurgie partielle ; chez certaines personnes, une <button class="w" data-k="c64-surveillance">surveillance active</button> ou un traitement local moins invasif se discute. La taille seule n’impose ni une néphrectomie totale ni l’absence de traitement. Les valeurs et le scénario sont construits pour l’apprentissage.</p><div class="key"><b>À retenir.</b> Nommer séparément la masse, l’histologie, le stade et le risque du traitement.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/420513/3655172/RMS_629_2160.pdf" rel="noopener" target="_blank">Liernur, Iselin, Klein ; HUG/Revue Médicale Suisse 2018 — RMS2018;14:2160–2163, quatre pages cliniques</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a>.</p></section>
<section class="ilot" id="c64-1"><h2>1. Définition et périmètre</h2><p>Le carcinome à cellules rénales est une tumeur maligne épithéliale du parenchyme rénal. Les principaux histotypes sont le carcinome à cellules claires, le carcinome papillaire et le carcinome chromophobe ; des entités plus rares ont des mécanismes et des traitements différents. Le code <b>C64</b> désigne le siège rénal à l’exception du bassinet. Il ne précise pas, à lui seul, l’histotype, le <button class="w" data-k="c64-grade">grade</button>, le côté ou le stade.</p><p>Le bassinet et les calices appartiennent aux voies excrétrices et sont exclus de C64 dans la classification suisse consultée. Une tumeur urothéliale de ces cavités relève d’un raisonnement distinct : l’imagerie, la cytologie, l’endoscopie et la stratégie opératoire peuvent différer. À l’inverse, l’extension d’un carcinome parenchymateux vers les cavités ne transforme pas automatiquement son origine en tumeur urothéliale.</p><p>Une <b>masse rénale</b> est un signe radiologique. Elle peut correspondre à une tumeur maligne, un <button class="w" data-k="c64-oncocytome">oncocytome</button>, un angiomyolipome ou une lésion kystique. Un rehaussement solide suspect fonde une probabilité clinique ; l’anatomopathologie établit l’histologie sur biopsie ou pièce opératoire selon le parcours retenu. Le cours porte surtout sur l’adulte ; une masse de l’enfant n’est pas traitée par transposition de ces protocoles.</p><figure data-c64-figure="kidney"><div data-c64-frame="tall"><img alt="Planche anatomique humaine historique du rein normal" loading="lazy" src="assets/img/c64/alpha/codex/Kidney_section_vertical.png"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span><span aria-hidden="true" data-c64-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cortex : parenchyme périphérique, distinct de la voie urinaire.</li><li>Pyramide médullaire : repère anatomique normal.</li><li>Bassinet : voie collectrice exclue du code C64 comme siège primitif.</li><li>Uretère : continuité de la voie excrétrice.</li></ol><p>Image normale historique, sans tumeur ni mesure fonctionnelle. Les annotations HTML ne modifient pas les pixels ; aucune tumeur fictive n’est dessinée.</p><p data-c64-credit="">Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 · <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" rel="noopener" target="_blank">Domaine public</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS,CIM-10-GM 2024 français — ClassesC64etC65, XML officiel</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-1">Synthèse 20/80 — 1</button></p></section>
<section class="ilot" id="c64-2"><h2>2. Épidémiologie et facteurs de risque</h2><p>Le monitorage officiel suisse rapporte, pour <b>2018–2022</b>, une moyenne annuelle de <b>819 nouveaux cas chez les hommes et 352 chez les femmes</b> dans la catégorie C64, soit environ 1 170 cas par an. Les décès sont respectivement 193 et 105 en moyenne annuelle. Il s’agit de données de population et de localisation, pas du nombre de seuls carcinomes à cellules claires. Les périodes doivent accompagner les chiffres ; les estimations plus anciennes d’une revue ne remplacent pas ce tableau national.</p><p>Pour l’Europe, le guide EAU rapporte des estimations de 145 721 nouveaux cas et 52 347 décès en 2022. Ces effectifs européens et les moyennes suisses ne portent ni sur la même période ni sur le même périmètre géographique ; leur rapport brut ne mesure pas un sur-risque. Les taux standardisés européens utilisent encore un autre dénominateur et ne sont pas confondus avec ces nombres de cas.</p><p>Le tabagisme, l’obésité, l’hypertension artérielle et l’histoire familiale augmentent le risque. Leur présence ne prouve pas le diagnostic et leur absence ne l’exclut pas. L’âge et les comorbidités influencent simultanément la probabilité de tumeur, le risque opératoire et les conséquences d’une perte de néphrons. Une proportion croissante des masses est découverte fortuitement lors d’une imagerie réalisée pour une autre raison.</p><p>Les formes héréditaires constituent une minorité mais ont des conséquences pour le patient et ses apparentés. Une présentation jeune, bilatérale, multifocale ou familiale motive une évaluation dédiée. Il n’existe pas de dépistage systématique recommandé du carcinome rénal dans la population générale ; cette absence ne concerne pas la surveillance organisée de certains syndromes génétiques. Une association épidémiologique entre alcool et risque n’est pas un motif de recommander de boire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://krebs-monitoring.bfs.admin.ch/fr/detail/C64" rel="noopener" target="_blank">OFS, Monitorage du cancer, données 2025 — Chiffres clés C64, moyennes annuelles 2018–2022</a> ; <a data-reference-source="1" href="https://urologie.insel.ch/fr/prestations/pathologies/tumeurs-du-parenchyme-renal" rel="noopener" target="_blank">Inselspital, Clinique universitaire d’urologie Berne — Tumeurs du parenchyme rénal : diagnostic et chirurgieT1</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3,pp.8–10</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.5,p.24 et§8,pp.75–77</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-2">Synthèse 20/80 — 2</button></p></section>
<section class="ilot" id="c64-3"><h2>3. Physiopathologie : du clone tumoral aux manifestations</h2><p>Dans de nombreux carcinomes à cellules claires sporadiques, l’inactivation de <b><button class="w" data-k="c64-vhl">VHL</button></b> favorise l’accumulation des facteurs induits par l’hypoxie, ou <button class="w" data-k="c64-hif">HIF</button>. L’expression de médiateurs comme le <button class="w" data-k="c64-vegf">VEGF</button> et le PDGF augmente et soutient la formation de vaisseaux tumoraux. Cette voie explique une partie de la vascularisation et fournit des cibles thérapeutiques ; elle ne permet pas de prédire seule la réponse d’un individu. Une mutation observée dans la tumeur n’établit pas une maladie héréditaire VHL.</p><p>La croissance peut rester silencieuse tant qu’elle ne produit ni saignement urinaire, ni distension douloureuse, ni effet de masse. Une extension dans les veines rénales puis la veine cave constitue un <b><button class="w" data-k="c64-thrombus">thrombus tumoral</button></b> ; il faut le distinguer d’une thrombose sanguine ordinaire et décrire sa hauteur. L’envahissement de la graisse, des organes voisins, des ganglions ou des sites distants change le stade et les options.</p><p>Les manifestations générales ou paranéoplasiques peuvent être disproportionnées par rapport aux symptômes urinaires : fatigue, fièvre, amaigrissement, anomalies hématologiques, hypercalcémie ou anomalies hépatiques nécessitent une interprétation clinique. Ces anomalies ne prouvent pas toutes une métastase. Il faut rechercher leurs autres causes et mesurer leur gravité. Le traitement peut lui-même provoquer hypertension, protéinurie, insuffisance rénale ou inflammation d’organe ; l’attribution temporelle est donc essentielle.</p><table class="t"><thead><tr><th>Processus</th><th>Expression possible</th><th>Conséquence</th></tr></thead><tbody><tr><td>Croissance locale</td><td>Masse fortuite ou douleur du flanc</td><td>Caractériser la lésion sans attendre une triade clinique.</td></tr><tr><td>Communication avec voies urinaires</td><td>Hématurie, parfois caillots</td><td>Évaluer le saignement et garder un bilan urologique complet.</td></tr><tr><td>Extension veineuse</td><td>Thrombus, œdèmes, varicocèle persistante</td><td>Décrire veine rénale, cave et extension par imagerie.</td></tr><tr><td>Angiogenèse et échappement immunitaire</td><td>Cibles VEGFR et points de contrôle immunitaires</td><td>Choisir un traitement selon preuves, histologie et indication suisse.</td></tr></tbody></table><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §4,pp.17–18,tableau 4.1</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-3">Synthèse 20/80 — 3</button></p></section>
<section class="ilot" id="c64-4"><h2>4. Démarche clinique : sécurité, caractérisation, décision</h2><p><b>Évaluer d’abord l’urgence.</b> Une hématurie importante avec malaise, instabilité ou rétention par caillots nécessite une prise en charge immédiate. Un déficit neurologique nouveau, une dyspnée aiguë, une douleur osseuse avec signes médullaires, une confusion ou une déshydratation sévère font rechercher une complication urgente. Chez une personne sous traitement oncologique, une toxicité médicamenteuse, une infection et une progression peuvent se ressembler.</p><p><b>Caractériser ensuite la masse.</b> Reprendre le compte rendu et les images : solide ou kystique, rehaussement, diamètre maximal, localisation, contact avec le sinus et les cavités, veines, rein opposé et lésions associées. Une comparaison avec une imagerie antérieure donne une trajectoire, sans que la seule vitesse de croissance identifie l’histologie. La fonction rénale antérieure, la protéinurie et les comorbidités sont documentées avant de choisir une intervention.</p><p><b>Établir l’extension et l’utilité d’une preuve tissulaire.</b> La biopsie doit répondre à une décision concrète. Elle est requise avant une ablation et avant un traitement systémique si aucune histologie n’est disponible. Elle peut guider une surveillance active. Elle n’est pas automatiquement nécessaire avant une chirurgie décidée indépendamment de son résultat.</p><p><b>Décider avec le patient.</b> Urologue, radiologue, pathologiste, oncologue et, lorsque nécessaire, néphrologue confrontent bénéfice oncologique, préservation de fonction, risques de traitement et préférences. La décision explique aussi ce qui déclencherait un changement de stratégie et qui assure le suivi. Un âge élevé seul ne suffit pas à conclure à l’inopérabilité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/420513/3655172/RMS_629_2160.pdf" rel="noopener" target="_blank">Liernur, Iselin, Klein ; HUG/Revue Médicale Suisse 2018 — RMS2018;14:2160–2163, quatre pages cliniques</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-4">Synthèse 20/80 — 4</button></p></section>
<section class="ilot" id="c64-5"><h2>5. Anamnèse analytique</h2><p>Commencer par le motif réel de découverte et le ressenti du patient. Une masse incidente chez une personne asymptomatique n’a pas la même présentation qu’une hématurie avec caillots ou une perte de poids. Demander les dates, l’évolution et les examens antérieurs ; faire préciser douleur, saignement, symptômes urinaires, appétit et capacité d’activité quotidienne.</p><table class="t"><thead><tr><th>Question</th><th>Information recherchée</th><th>Interprétation</th></tr></thead><tbody><tr><td>Hématurie visible, caillots, durée, récidives, anticoagulants ?</td><td>Saignement, obstruction et causes concurrentes</td><td>Un anticoagulant ne dispense pas d’explorer une hématurie.</td></tr><tr><td>Douleur du flanc ou osseuse, toux, céphalée, déficit ?</td><td>Manifestation locale ou extension symptomatique</td><td>Les symptômes dirigent les examens complémentaires urgents ou ciblés.</td></tr><tr><td>Tabac, poids, hypertension et traitement ?</td><td>Facteurs de risque et risque cardiovasculaire</td><td>Ces facteurs modifient le contexte, sans constituer un test diagnostique.</td></tr><tr><td>Rein unique, maladie rénale, diabète, protéinurie ?</td><td>Réserve fonctionnelle avant intervention</td><td>Prévoir le risque de maladie rénale après traitement.</td></tr><tr><td>Cancer rénal familial, lésions bilatérales, pneumothorax ou signes cutanés ?</td><td>Prédisposition génétique possible</td><td>Orienter vers <button class="w" data-k="c64-genetique">conseil génétique</button> ; ne pas diagnostiquer un syndrome sur un signe isolé.</td></tr><tr><td>Traitements actuels, automédication, grossesse possible ?</td><td>Interactions, toxicités et conditions particulières</td><td>Vérifier produit exact, contraception et projet thérapeutique avec spécialistes.</td></tr><tr><td>Objectifs, autonomie, soutien, contraintes du suivi ?</td><td>Faisabilité et choix partagé</td><td>Une surveillance active suppose un suivi réellement organisé.</td></tr></tbody></table><p>Chez un patient déjà traité, noter le début et la dernière dose de chaque agent. Une diarrhée, une dyspnée ou une baisse de diurèse peuvent relever d’une <button class="w" data-k="c64-toxicite">toxicité immune</button> ou d’un inhibiteur de kinase. Le délai n’exclut pas une toxicité immune tardive après l’arrêt. Le bilan doit aussi rechercher infection, obstacle, déshydratation et autres médicaments.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.5,p.24 et§8,pp.75–77</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-5">Synthèse 20/80 — 5</button></p></section>
<section class="ilot" id="c64-6"><h2>6. Examen clinique et limites du signe négatif</h2><p>Mesurer pression artérielle, fréquence cardiaque, température, poids et état d’hydratation ; évaluer l’état général et les capacités fonctionnelles. Palper l’abdomen et les fosses lombaires sans attribuer automatiquement une masse abdominale au rein. Rechercher des adénopathies cervicales, des œdèmes des membres inférieurs et, selon le contexte, une varicocèle qui persiste en décubitus. Un examen abdominal normal est fréquent dans une petite tumeur.</p><p>Un examen cardiopulmonaire et neurologique ciblé répond aux symptômes et aux risques de traitement. Une douleur rachidienne avec faiblesse, trouble de sensibilité ou sphinctérien impose une évaluation urgente ; une douleur osseuse isolée n’est pas à elle seule une preuve de métastase. Rechercher les signes d’anémie, d’hypercalcémie symptomatique ou de déshydratation selon le contexte biologique.</p><p>La fragilité ne se réduit pas à l’âge. Chez la personne âgée, un dépistage gériatrique peut orienter une évaluation plus complète ; le guide EAU cite notamment un score G8 ≤ 14/17 comme signal d’évaluation. Les fonctions cognitives, la nutrition, la mobilité et le soutien social participent au choix. La pression et la protéinurie initiales donnent aussi un point de comparaison avant un traitement antiangiogénique.</p><div class="key"><b>À retenir.</b> L’examen recherche le retentissement et les complications ; il n’a pas la sensibilité nécessaire pour exclure une petite masse.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575630067" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; organes ; risques cardiaques/hépatiques</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-6">Synthèse 20/80 — 6</button></p></section>
<section class="ilot" id="c64-7"><h2>7. Syndromes et classifications utiles</h2><p>Trois portes d’entrée dominent : <b>masse incidente</b>, <b>manifestation locale</b> et <b>manifestation systémique ou métastatique</b>. La triade douleur du flanc, hématurie et masse palpable est rare et ne doit pas devenir une condition du diagnostic. Les manifestations paranéoplasiques restent des hypothèses de mécanisme après exclusion des autres causes ; une anomalie hépatique ne suffit pas à diagnostiquer une métastase hépatique.</p><p>Il faut distinguer quatre descriptions : l’histotype désigne la nature tumorale ; le grade décrit certains caractères microscopiques ; le TNM décrit l’extension ; un score pronostique estime un risque dans une population définie. Le grade WHO/ISUP est utilisé notamment pour cellules claires et papillaire, pas pour chromophobe. Le terme <button class="w" data-k="c64-sarcomatoide">sarcomatoïde</button> correspond à une dédifférenciation, pas à un quatrième histotype autonome.</p><table class="t"><thead><tr><th>Situation</th><th>Outil pertinent</th><th>Ce qu’il ne faut pas confondre</th></tr></thead><tbody><tr><td>Extension anatomique</td><td>TNM 2017 reproduit dans EAU 2026</td><td>Taille seule et stade complet.</td></tr><tr><td>Après chirurgie d’un carcinome à cellules claires</td><td>Leibovich 2003</td><td>Risque de récidive et risque IMDC métastatique.</td></tr><tr><td>Carcinome métastatique avant traitement systémique</td><td>IMDC : 0, 1–2 ou ≥3 facteurs</td><td>Risque favorable/intermédiaire/défavorable et opérabilité.</td></tr><tr><td>Adjuvant pembrolizumab</td><td>Critères de population KEYNOTE-564</td><td>Toute tumeur rénale opérée et haut risque éligible.</td></tr><tr><td>Complexité technique d’une masse</td><td>Scores anatomiques de néphrométrie</td><td>Complexité opératoire et malignité certaine.</td></tr></tbody></table><p>Ces outils sont détaillés dans les examens et les fenêtres <button class="w" data-k="c64-imdc">IMDC</button>, <button class="w" data-k="c64-leibovich">Leibovich</button> et <button class="w" data-k="c64-adjuvant">adjuvant</button>. Ils ne remplacent pas la discussion de l’espérance de vie, des comorbidités, du risque de maladie rénale et des préférences.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §4,pp.17–18,tableau 4.1</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.3.5,pp.48–50,tableau 7.1p.52,recommandationsp.53</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-7">Synthèse 20/80 — 7</button></p></section>


<section class="ilot" id="c64-8"><h2>8. Diagnostic positif : ce qui est certain et ce qui reste probable</h2><p>Le diagnostic radiologique d’une masse solide rehaussée suscite la suspicion de carcinome, mais ne donne pas une histologie certaine. La tomodensitométrie ou l’IRM ne distinguent pas de façon fiable tous les oncocytomes et angiomyolipomes pauvres en graisse des tumeurs malignes. La présence de graisse macroscopique peut fortement orienter vers un angiomyolipome dans un contexte compatible ; les formes atypiques demandent une expertise.</p><p>La preuve anatomopathologique vient d’une biopsie carottée ou de la pièce opératoire. Le compte rendu doit préciser le type tumoral et, lorsque applicable, le grade, la nécrose, les éléments sarcomatoïdes ou rhabdoïdes, les marges et l’extension. Une carotte peut identifier une néoplasie oncocytaire sans permettre de conclure définitivement à un oncocytome bénin. L’échantillonnage et l’hétérogénéité expliquent pourquoi le grade sur biopsie peut sous-estimer la pièce.</p><p>Un résultat « non diagnostique » n’est pas un résultat bénin. Si l’imagerie demeure suspecte et que le résultat modifie la décision, une nouvelle biopsie ou une autre stratégie se discute. La preuve tissulaire est particulièrement importante avant un traitement qui détruit la lésion ou avant un traitement systémique. Il faut conserver la distinction entre diagnostic de travail, preuve histologique et stade clinique ou pathologique.</p><figure data-c64-figure="clear"><div data-c64-frame="wide"><img alt="Microphotographie humaine de carcinome rénal à cellules claires, grade 2 attribué par la source" loading="lazy" src="assets/img/c64/alpha/codex/Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg"/><span aria-hidden="true" data-c64-mark="1">1</span><span aria-hidden="true" data-c64-mark="2">2</span><span aria-hidden="true" data-c64-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Noyau sombre dans une cellule tumorale, au centre du champ.</li><li>Cytoplasme pâle : morphologie visible de cellules claires.</li><li>Hématie dans un petit espace vasculaire : repère de la vascularisation du champ.</li></ol><p>La source attribue le diagnostic de carcinome à cellules claires et le grade 2. Une photographie isolée ne suffit pas à grader toute une tumeur ni à rechercher une mutation VHL. Original vu le 2 novembre 2026 ; provenance et droits lus dans les métadonnées Commons ; aucune lecture intégrale de l’article de provenance revendiquée.</p><p data-c64-credit="">Mikael Häggström, microphotographie personnelle · <a href="https://commons.wikimedia.org/wiki/File:Grade_2_clear_cell_renal_cell_carcinoma,_original.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" rel="noopener" target="_blank">CC0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-8">Synthèse 20/80 — 8</button></p></section>
<section class="ilot" id="c64-9"><h2>9. Explorations : répondre à des questions précises</h2><p>La biologie initiale documente au minimum fonction rénale, numération et contexte métabolique ; les examens hépatiques, phosphatase alcaline, calcium, marqueurs inflammatoires et autres paramètres sont adaptés au bilan et au traitement envisagé. L’analyse urinaire recherche hématurie et protéinurie. Une créatinine normale peut coexister avec une tumeur importante : elle reflète la fonction globale des deux reins, pas la présence ou l’absence de malignité.</p><p>Le scanner multiphasique comprend des images sans contraste et après injection selon le protocole radiologique. Il précise rehaussement, extension locale, veines, ganglions et abdomen. L’IRM est utile notamment pour caractériser l’extension veineuse ou lorsque le contraste iodé doit être évité. Le choix de contraste en insuffisance rénale ou grossesse demande une évaluation spécifique ; « IRM » ne signifie pas automatiquement « gadolinium sans risque ».</p><p>Le bilan thoracique est adapté au risque. L’EAU autorise à envisager l’omission d’un scanner thoracique dans certaines masses incidentes cT1a cN0 sans symptômes systémiques avec hémoglobine et plaquettes normales ; il s’agit d’une recommandation faible pour un sous-groupe, pas d’une règle applicable à toutes les tumeurs T1. Les examens osseux et cérébraux répondent aux symptômes ; une imagerie cérébrale est aussi proposée dans certaines évaluations de maladie métastatique avant traitement systémique ou chirurgie cytoréductrice. Le FDG-PET n’est pas le bilan de stadification primaire de routine.</p><p>La scintigraphie de fonction séparée peut aider si la fonction est réduite, si le rein est unique ou les masses bilatérales et que la décision dépend de la contribution de chaque rein. L’onglet Examens fournit les techniques, limites, classification TNM et calculs de risque sans multiplier des tests sans question clinique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-9">Synthèse 20/80 — 9</button></p></section>
<section class="ilot" id="c64-10"><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Y a-t-il une urgence ?</b> Saignement mal toléré, rétention par caillots, signes neurologiques, détresse respiratoire ou toxicité sévère : prise en charge immédiate en parallèle du diagnostic.</li><li><b>La lésion vient-elle du parenchyme ou des cavités ?</b> Une masse centrale au contact de l’urothélium peut nécessiter cytologie et endoscopie pour une tumeur des voies excrétrices.</li><li><b>Solide ou kystique ?</b> Une masse solide rehaussée suit le raisonnement tumoral ; une lésion kystique est caractérisée selon <button class="w" data-k="c64-bosniak">Bosniak</button>, avec version précisée.</li><li><b>La biopsie peut-elle changer la conduite ?</b> La demander avant ablation ou traitement systémique sans histologie, et dans des situations sélectionnées de surveillance.</li><li><b>Quelle extension et quelle <button class="w" data-k="c64-protection">réserve fonctionnelle</button> ?</b> Le TNM et les risques opératoires déterminent avec l’histologie les options locales ou systémiques.</li></ol><table class="t"><thead><tr><th>Alternative</th><th>Indices utiles</th><th>Limite ou conduite</th></tr></thead><tbody><tr><td>Kyste simple</td><td>Liquide et paroi fine sans élément suspect</td><td>Bosniak I/II habituellement bénin ; ne pas appliquer le traitement d’une masse solide.</td></tr><tr><td>Oncocytome</td><td>Masse solide parfois oncocytaire à la biopsie</td><td>Imagerie non définitive ; carotte limitée pour certifier bénignité.</td></tr><tr><td>Angiomyolipome</td><td>Graisse macroscopique dans un contexte compatible</td><td>Forme pauvre en graisse difficile ; seuil historique de 4 cm non décision automatique.</td></tr><tr><td>Tumeur urothéliale du haut appareil</td><td>Lésion centrée sur cavités, contexte d’hématurie</td><td>Cytologie/endoscopie selon indication ; C65 si siège bassinet/calices.</td></tr><tr><td>Infection ou lésion inflammatoire</td><td>Fièvre, douleur, inflammation, contexte infectieux</td><td>Confronter imagerie et cultures ; une fièvre peut aussi être tumorale.</td></tr><tr><td>Métastase rénale ou lymphome</td><td>Contexte oncologique, lésions multiples ou atypiques</td><td>La preuve tissulaire peut modifier radicalement le traitement.</td></tr><tr><td>Lésion héréditaire ou histotype rare</td><td>Jeune âge, bilatéralité, famille, histologie particulière</td><td>Conseil génétique et centre expert ; pas protocole unique de cellules claires.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le diagnostic différentiel reste ouvert tant que l’élément discriminant n’a pas été obtenu.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS,CIM-10-GM 2024 français — ClassesC64etC65, XML officiel</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.5,p.24 et§8,pp.75–77</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-10">Synthèse 20/80 — 10</button></p></section>
<section class="ilot" id="c64-11"><h2>11. Prise en charge : proportionner le traitement au risque</h2><h3>Maladie localisée</h3><p>Une <b><button class="w" data-k="c64-nephrectomie">néphrectomie partielle</button></b> est recommandée pour les tumeurs T1 lorsqu’elle est techniquement réalisable et oncologiquement appropriée. Elle vise à retirer la tumeur tout en préservant du parenchyme. Le choix dépend de la localisation, de la complexité, des fonctions rénales et de l’expérience du centre ; il ne se résume pas à une taille. L’avantage fonctionnel ne doit pas être transformé en preuve certaine d’un bénéfice de survie globale contre la néphrectomie radicale.</p><p>Une néphrectomie radicale peut être nécessaire lorsque la chirurgie partielle n’est pas appropriée. Pour certaines tumeurs T2 chez des patients avec rein unique, masses bilatérales ou maladie rénale chronique, une approche conservatrice peut se discuter si faisable. Ni surrénalectomie pour toute tumeur du pôle supérieur, ni curage ganglionnaire systématique sans indication ne se déduisent du mot « radicale ». Une marge microscopique positive appelle un suivi renforcé et une décision contextualisée, pas automatiquement l’ablation du rein restant.</p><h3>Surveillance, ablation et radiothérapie stéréotaxique</h3><p>La <b>surveillance active</b> comprend une imagerie répétée et des critères de réévaluation avec possibilité d’intervention différée. L’<b>attente vigilante</b> privilégie le traitement des symptômes lorsque l’on n’anticipe pas de traitement actif ultérieur. Ces deux objectifs doivent être expliqués. Chez certains patients cT1a sans indication immédiate, la surveillance active est possible ; chez des patients cT1 non opérables, une ablation thermique ou une radiothérapie stéréotaxique ablative peut être envisagée.</p><p>Une biopsie doit précéder l’ablation thermique ; elle ne doit pas être simplement reportée au geste destructeur. La radiofréquence au-delà de 3 cm et la cryoablation au-delà de 4 cm ne sont pas proposées de routine par l’EAU. Les preuves comparatives et le recul diffèrent ; il faut parler du risque de récidive locale, de reprise de traitement et des incertitudes sans présenter toutes les options comme équivalentes.</p><h3>Adjuvant après chirurgie</h3><p>Le pembrolizumab adjuvant se discute pour certains carcinomes à cellules claires à risque accru selon KEYNOTE-564 : pT2 grade 4 ou sarcomatoïde N0M0 ; pT3 tout grade N0M0 ; pT4 N0M0 ; tout pT N+M0 ; ou M1 sans maladie résiduelle après résection complète de métastases dans la fenêtre étudiée. Une restadification et une discussion du bénéfice, de la toxicité immune parfois durable et du surtraitement sont nécessaires. L’EAU propose préférentiellement un début dans les 12–16 semaines après néphrectomie. La FI suisse prévoit un traitement adjuvant jusqu’à 12 mois.</p><p>Le bénéfice démontré avec pembrolizumab ne s’étend pas automatiquement à toute immunothérapie ou tout histotype. Le traitement néoadjuvant n’est pas recommandé en dehors d’essais cliniques. Les critères d’adjuvant ne sont ni les six facteurs IMDC ni un simple synonyme de stade métastatique.</p><h3>Maladie avancée ou métastatique</h3><p>La stratégie tient compte de l’histotype, du risque IMDC, du besoin de réponse, des comorbidités, des traitements antérieurs et des préférences. Pour les cellules claires à risque intermédiaire ou défavorable, les associations usuelles comprennent nivolumab–ipilimumab, pembrolizumab–axitinib, pembrolizumab–lenvatinib et nivolumab–cabozantinib. Leurs mécanismes, doses et précautions sont détaillés dans Pharmacologie à partir des produits suisses exacts.</p><p><b>Différence réglementaire explicite :</b> l’EAU 2026 envisage aussi faiblement certaines associations au risque favorable. Les FI suisses consultées restreignent les quatre associations de première ligne au risque intermédiaire/défavorable. Une recommandation européenne n’élargit pas l’autorisation ni le remboursement suisse. Sunitinib ou pazopanib restent des options selon le contexte, notamment lorsque l’immunothérapie n’est pas possible ; la décision de première ligne au risque favorable est individualisée en oncologie, avec vérification réglementaire actuelle.</p><p>Une néphrectomie cytoréductrice n’est pas systématique. Elle n’est pas recommandée chez les patients de mauvais risque et ne doit pas retarder d’emblée un traitement systémique nécessaire chez un patient de risque intermédiaire avec tumeur primitive asymptomatique. Une chirurgie différée ou un traitement local de métastases peut se discuter dans des situations sélectionnées. Les lignes ultérieures dépendent des expositions et de la réponse ; un rechallenge d’immunothérapie n’est pas un réflexe après progression.</p><p>Les histologies non claires ont des preuves moins solides et des options propres. Les carcinomes médullaires agressifs constituent notamment une exception au raccourci « aucune chimiothérapie dans les cancers rénaux ». Douleur, fatigue, nutrition, souffrance psychique et projet de vie justifient des soins de support et, si approprié, des soins palliatifs précoces en parallèle du traitement oncologique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.3.5,pp.48–50,tableau 7.1p.52,recommandationsp.53</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575630067" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; organes ; risques cardiaques/hépatiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680603260020" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; fonctions ; surveillance</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-11">Synthèse 20/80 — 11</button></p></section>
<section class="ilot" id="c64-12"><h2>12. Prévention, suivi et pronostic</h2><p>Le suivi associe recherche de récidive, évaluation de fonction rénale, prévention cardiovasculaire et qualité de vie. La réduction du tabagisme, le contrôle du poids et de la pression, ainsi que le bon usage des médicaments ont une utilité propre. L’absence de dépistage populationnel n’empêche ni la réévaluation d’un symptôme nouveau ni le suivi d’une prédisposition familiale.</p><p>Après chirurgie à visée curative, le calendrier dépend du risque de récidive. Le tableau EAU utilise Leibovich pour les cellules claires ; d’autres outils s’appliquent aux autres histotypes. Les examens thorax–abdomen ne sont pas identiques pour faible et haut risque. Le calendrier détaillé de l’onglet Examens est une proposition d’experts après chirurgie, pas une règle universelle après ablation ou un programme imposé sans tenir compte des comorbidités et des souhaits.</p><p>Une consultation néphrologique est particulièrement pertinente devant maladie rénale, protéinurie, rein unique, risque de détérioration ou débit postopératoire attendu inférieur à 45 mL/min/1,73 m². La surveillance fonctionnelle peut continuer lorsque l’imagerie oncologique est espacée ou arrêtée. Une fonction stable aujourd’hui ne dispense pas de contrôler pression, protéines urinaires et trajectoire après perte de parenchyme ou traitement systémique.</p><p>Le pronostic varie avec stade, histotype, grade, nécrose, symptômes, état général et réponse au traitement. Un pourcentage de survie d’une population ne constitue pas une prédiction individuelle. Il faut distinguer survie globale, survie spécifique du cancer, survie sans récidive et survie sans progression. Une surveillance plus intensive n’a pas démontré automatiquement un gain de survie ; son intérêt doit être expliqué sans créer une fausse assurance.</p><h3>Situations particulières</h3><p><b>Personne âgée :</b> évaluer fragilité, risques concurrents et autonomie. <b>Rein unique ou maladie rénale :</b> anticiper la réserve fonctionnelle et favoriser la préservation lorsque appropriée. <b>Forme héréditaire :</b> surveillance rénale et extrarénale selon syndrome ; la règle de taille de VHL ne s’étend pas à FH agressif. <b>Grossesse :</b> organiser une décision spécialisée sur imagerie, chirurgie et médicaments ; les protocoles oncologiques adultes ne s’appliquent pas sans analyse maternofœtale. <b>Enfant :</b> filière d’oncologie pédiatrique, histologies et traitements spécifiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3,pp.8–10</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §9,pp.78–81,tableau 9.1</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.5,p.24 et§8,pp.75–77</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-12">Synthèse 20/80 — 12</button></p></section>
<section class="ilot" id="c64-13"><h2>13. Points clés et entraînement</h2><ol><li>Une masse fortuite est souvent asymptomatique ; l’absence de triade ne rassure pas à elle seule.</li><li>C64 désigne le parenchyme, tandis que bassinet et calices comme siège primitif relèvent C65.</li><li>Imagerie, histologie, grade, TNM et scores de risque répondent à des questions différentes.</li><li>La biopsie est utile si elle change la conduite ; elle précède l’ablation et le traitement systémique sans histologie.</li><li>Préserver des néphrons compte, mais la sécurité oncologique et les risques du patient gouvernent le choix.</li><li>Surveillance active, attente symptomatique, chirurgie et ablation ont des objectifs et preuves distincts.</li><li>L’adjuvant pembrolizumab concerne une population définie ; son bénéfice ne devient pas un effet de classe.</li><li>Les doses et indications suisses doivent être vérifiées produit par produit, même lorsqu’un guide européen recommande une option.</li><li>Le suivi ne s’arrête pas à la recherche de récidive : fonction, pression, toxicités et qualité de vie comptent.</li></ol><p id="c64-federal">Correspondance pédagogique : PROFILES <b>2017</b>, SSP 54 (masse abdominale) et SSP 64 (notamment hématurie), avec exigences MEBEKO de l’examen <b>2026</b> sur connaissances et compétences cliniques. Les exercices MEDINA sont originaux, non des questions officielles ; cette correspondance n’est pas une attribution CIM validée par la commission.</p><p><button class="w" data-k="c64-cas-1">Cas 1 — Une masse de 3,2 cm sans symptômes</button> <button class="w" data-k="c64-cas-2">Cas 2 — Compter les facteurs IMDC</button> <button class="w" data-k="c64-cas-3">Cas 3 — Une diarrhée sous nivolumab–ipilimumab</button> <button class="w" data-k="c64-cas-4">Cas 4 — Rehaussement, stade et risque</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS,PROFILES 2017 — p.29,SSP54 et 64</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">MEBEKO,3mars 2026 — Introduction et§2.1,examen 2026</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-13">Synthèse 20/80 — 13</button></p><div class="quiz ui"><p>Une biopsie non diagnostique prouve-t-elle la bénignité ?</p><button data-ok="1">Non, réévaluer la concordance et la conduite.</button><button data-ok="0">Oui, le cancer est exclu.</button><p class="fb" hidden="">Un prélèvement insuffisant ne constitue pas un test négatif valide.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a>.</p><div class="quiz ui"><p>Quel schéma initial nivo/ipi correspond au rein dans les FI suisses ?</p><button data-ok="1">Nivolumab 3 mg/kg + ipilimumab 1 mg/kg.</button><button data-ok="0">Nivolumab 1 mg/kg + ipilimumab 3 mg/kg.</button><p class="fb" hidden="">Ne pas copier les doses du mélanome.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a>.</p><div class="quiz ui"><p>Une recommandation EAU au risque favorable élargit-elle l’autorisation suisse ?</p><button data-ok="1">Non, vérifier les FI exactes et le cadre de prise en charge.</button><button data-ok="0">Oui, automatiquement.</button><p class="fb" hidden="">Les quatre associations lues ont une indication suisse intermédiaire/défavorable.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p><div class="quiz ui"><p>Une masse de 3,8 cm avec extension veineuse segmentaire est-elle T1a ?</p><button data-ok="1">Non, l’extension décrite correspond à T3a.</button><button data-ok="0">Oui, seule la taille compte.</button><p class="fb" hidden="">TNM décrit aussi l’extension, dans l’édition 2017 citée.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §4,pp.17–18,tableau 4.1</a>.</p></section>
<section class="ilot" id="c64-14"><h2>14. Pièges à éviter</h2><table class="t"><thead><tr><th>Piège</th><th>Correction</th></tr></thead><tbody><tr><td>Attendre la triade clinique</td><td>La majorité des petites masses ne donne pas cette présentation.</td></tr><tr><td>Nommer toute masse un cancer</td><td>Conserver les diagnostics bénins et les limites de l’imagerie.</td></tr><tr><td>Biopsie non diagnostique = bénigne</td><td>Réévaluer la concordance et l’utilité d’un nouveau prélèvement.</td></tr><tr><td>Oncocytome certain sur une carotte</td><td>La classification OMS 2022 souligne les limites d’échantillonnage.</td></tr><tr><td>Papillaire type I/II comme classification actuelle</td><td>Division abandonnée dans OMS 2022.</td></tr><tr><td>Thrombus tumoral = anticoagulation automatique</td><td>Distinguer tissu tumoral et thrombus sanguin ; stratégie spécialisée.</td></tr><tr><td>Marge positive = néphrectomie complémentaire obligatoire</td><td>Suivi intensifié et décision contextualisée.</td></tr><tr><td>IMDC = critères adjuvants</td><td>Populations et finalités distinctes.</td></tr><tr><td>Inverser les doses nivo/ipi</td><td>Rein : nivolumab 3 mg/kg et ipilimumab 1 mg/kg, pas le schéma mélanome.</td></tr><tr><td>EAU = autorisation suisse</td><td>Lire les FI exactes et vérifier la prise en charge financière.</td></tr><tr><td>Toute diarrhée sous immunothérapie est bénigne</td><td>Rechercher toxicité immune, infection et gravité sans attendre.</td></tr><tr><td>Aucune anomalie de créatinine = rein indemne</td><td>Fonction globale et lésion tumorale sont des dimensions différentes.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Chaque conclusion doit être proportionnée à la preuve et à la population réellement étudiée.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §4,pp.17–18,tableau 4.1</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.3.5,pp.48–50,tableau 7.1p.52,recommandationsp.53</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p><p class="ui"><button class="pareto-btn ui" data-k="c64-pareto-14">Synthèse 20/80 — 14</button></p></section>
<section class="ilot" id="c64-annexe-cim"><h2>Annexe de classement</h2><p>La catégorie suisse CIM-10-GM 2024 <b>C64</b> est « Tumeur maligne du rein, à l’exception du bassinet ». Le bassinet et les calices sont explicitement exclus vers <b>C65</b>. La catégorie C64 de la source consultée ne comporte pas de subdivisions droite/gauche .1/.2 : ces codes d’une autre nomenclature ne sont pas importés. Le côté, l’histotype et le stade restent documentés cliniquement et anatomopathologiquement.</p><p>Le classement administratif intervient après l’identification du siège et du diagnostic. Il ne détermine ni le grade, ni l’indication de biopsie, ni le médicament ; une masse non caractérisée ne devient pas une malignité prouvée par son simple rapprochement avec ce chapitre.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS,CIM-10-GM 2024 français — ClassesC64etC65, XML officiel</a>.</p></section>
</div></div>


<div class="panel" hidden="" id="pE"><div class="chap-body"><section class="ilot" id="c64-e-principes"><h2>Chaque examen doit modifier une décision</h2><p>Le bilan poursuit quatre objectifs : caractériser la masse, établir l’extension, préciser l’histologie quand elle est nécessaire et mesurer la <button class="w" data-k="c64-protection">réserve fonctionnelle</button>. Les résultats sont consignés avec date, méthode et contexte. Une valeur biologique normale ne neutralise pas une image suspecte ; une image suspecte ne dispense pas de vérifier l’impact rénal d’un traitement.</p><table class="t"><thead><tr><th>Examen</th><th>Question</th><th>Lecture et limite</th></tr></thead><tbody><tr><td>Créatinine et débit estimé</td><td>Quelle fonction globale avant traitement ?</td><td>Comparer au niveau antérieur ; les deux reins contribuent, et l’estimation dépend de la stabilité de la créatinine.</td></tr><tr><td>Urines : hématurie et protéines</td><td>Saignement et maladie rénale associée ?</td><td>Une hématurie peut avoir une cause différente de la masse ; la protéinurie influence le risque rénal.</td></tr><tr><td>Numération</td><td>Anémie, anomalie des plaquettes/neutrophiles ?</td><td>Interpréter avec les limites du laboratoire ; certains paramètres entrent dans IMDC.</td></tr><tr><td>Calcium, foie, phosphatase alcaline selon bilan</td><td>Retentissement, syndrome systémique ou extension ?</td><td>Une anomalie n’identifie pas seule son mécanisme.</td></tr><tr><td>CT multiphasique ou IRM</td><td>Rehaussement, anatomie, extension ?</td><td>Technique et phases comparables ; contraste individualisé.</td></tr><tr><td>Biopsie</td><td>Le tissu changera-t-il la conduite ?</td><td>Carotte, qualité et représentativité ; non diagnostique ≠ bénin.</td></tr></tbody></table><p>Les limites de référence du laboratoire suisse qui effectue l’analyse doivent être utilisées pour hémoglobine, neutrophiles, plaquettes et calcium corrigé. Il n’existe pas une valeur normale unique indépendante de l’âge, du sexe, de la méthode et des unités. Le compte IMDC utilise précisément ces limites ; lui substituer des nombres mémorisés peut changer la catégorie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a>.</p></section>
<section class="ilot" id="c64-e-imagerie"><h2>CT, IRM, échographie et rehaussement</h2><p>Le CT sans injection donne une référence de densité ; les phases après injection évaluent l’arrivée du contraste, le parenchyme, les veines et l’extension. L’EAU retient une augmentation d’au moins <b>15 unités Hounsfield</b> dans les régions solides comme indice de rehaussement. Il faut comparer des mesures techniquement pertinentes : volume partiel, taille de région d’intérêt, phase et bruit peuvent modifier le résultat.</p><p>Exemple fictif : une région mesurée à 28 HU avant et 63 HU après contraste a un gain de 35 HU. Ce calcul soutient un rehaussement ; il ne prouve ni cellules claires ni <button class="w" data-k="c64-grade">grade</button> 3. Une petite différence incertaine peut nécessiter une caractérisation complémentaire plutôt qu’une conclusion forcée. L’échographie avec contraste peut aider pour certaines lésions indéterminées selon disponibilité et expertise.</p><p>L’IRM précise notamment l’extension d’un thrombus veineux et peut aider lorsque le CT est indéterminé ou le contraste iodé problématique. Une séquence veineuse doit répondre à la hauteur du thrombus et à une éventuelle invasion de paroi. Grossesse, fonction rénale, type de produit et nécessité de contraste sont discutés avec la radiologie ; ni l’IRM ni le scanner ne sont choisis par automatisme.</p><p>Le bilan d’extension ne consiste pas à ajouter tous les examens. Le FDG-PET n’est pas recommandé en routine pour la stadification primaire. La scintigraphie osseuse ou l’imagerie cérébrale sont ciblées selon symptômes et situation métastatique. L’omission du CT thoracique est une recommandation de force faible dans un sous-groupe incident cT1a cN0 sans symptômes systémiques avec hémoglobine et plaquettes normales.</p><button class="w" data-k="c64-rehaussement">Fenêtre — Calcul et limites du rehaussement</button><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a>.</p></section>
<section class="ilot" id="c64-e-bosniak"><h2>Lésions kystiques : nommer la version de Bosniak</h2><p>La classification <b><button class="w" data-k="c64-bosniak">Bosniak</button> 2019</b> décrit des caractères radiologiques de lésions kystiques. Le compte rendu doit préciser la modalité, le rehaussement et les éléments de paroi, septa ou nodules. Elle ne doit pas être utilisée pour rebaptiser toute masse solide. Les proportions de malignité dans des séries opérées sont sélectionnées : elles ne représentent pas nécessairement toutes les lésions découvertes fortuitement.</p><table class="t"><thead><tr><th>Classe</th><th>Signification pratique</th><th>Conduite à contextualiser</th></tr></thead><tbody><tr><td>I</td><td>Kyste simple</td><td>Pas de suivi oncologique systématique pour cette seule lésion.</td></tr><tr><td>II</td><td>Caractères bénins selon critères de la version</td><td>Pas de suivi de routine si classification assurée.</td></tr><tr><td>IIF</td><td>Complexité justifiant surveillance</td><td>Imagerie de suivi organisée ; évolution morphologique importante.</td></tr><tr><td>III</td><td>Paroi ou cloisons plus suspectes</td><td>Chirurgie ou surveillance dans des situations sélectionnées.</td></tr><tr><td>IV</td><td>Composante nodulaire rehaussée suspecte</td><td>Probabilité maligne élevée, décision oncologique adaptée au patient.</td></tr></tbody></table><p>Une <button class="w" data-k="c64-biopsie">biopsie</button> de lésion kystique sans composante solide significative a un rendement insuffisant et n’est pas recommandée de routine. La formulation « complexe » seule ne suffit pas : demander quelle caractéristique et quelle classe ont été observées. Le calendrier de surveillance d’une masse solide ne remplace pas automatiquement celui d’un kyste IIF.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a>.</p></section>
<section class="ilot" id="c64-e-biopsie"><h2>Biopsie percutanée : utilité, technique et risques</h2><p>Le prélèvement carotté par voie coaxiale est préféré pour caractériser une masse solide. Il doit cibler une zone viable et éviter autant que possible le centre nécrotique ; la stratégie dépend de l’imagerie et du risque hémorragique. L’objectif n’est pas seulement d’obtenir du tissu, mais de répondre à une question thérapeutique. Une biopsie se programme <b>avant</b> une ablation thermique.</p><p>La méta-analyse rapportée par EAU donne environ 99,1 % de sensibilité et 99,7 % de spécificité pour les <b>biopsies carottées diagnostiques</b>. Environ 8 % des biopsies sont non diagnostiques dans cette synthèse. Exclure ces prélèvements du dénominateur explique pourquoi les performances élevées ne signifient pas que chaque tentative fournit une réponse certaine. Le grade est moins fiable que l’identification de malignité ou d’histotype en raison de l’hétérogénéité.</p><p>Les complications comprennent saignement et douleur ; l’hémorragie cliniquement significative est rare dans les séries synthétisées. L’essaimage tumoral sur le trajet est rare mais a été décrit : l’affirmation ancienne « aucun risque » doit être corrigée. Ces chiffres n’annulent pas l’évaluation individuelle des traitements antithrombotiques, de l’accès, de la vascularisation et de la fonction.</p><p>Après le résultat, confronter pathologie et radiologie. « Néoplasie oncocytaire », « tissu insuffisant » et « carcinome à cellules claires » ne sont pas des réponses équivalentes. Une seconde biopsie ou une autre conduite peut être nécessaire si le résultat ne concorde pas avec la question initiale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a>.</p></section>
<section class="ilot" id="c64-e-tnm"><h2>TNM : anatomie de l’extension, édition explicitée</h2><p>Le tableau ci-dessous résume la <b>classification TNM 2017</b> reproduite par le guide EAU 2026. Le préfixe c indique une évaluation clinique ; p une évaluation pathologique. Il faut documenter les limites de l’examen plutôt que convertir une suspicion radiologique en certitude histologique.</p><table class="t"><thead><tr><th>T</th><th>Extension</th></tr></thead><tbody><tr><td>T1a</td><td>≤4 cm, limitée au rein.</td></tr><tr><td>T1b</td><td>&gt;4 à ≤7 cm, limitée au rein.</td></tr><tr><td>T2a</td><td>&gt;7 à ≤10 cm, limitée au rein.</td></tr><tr><td>T2b</td><td>&gt;10 cm, limitée au rein.</td></tr><tr><td>T3a</td><td>Veine rénale ou branches segmentaires, système pyélocaliciel, graisse périrénale ou du sinus, sans dépasser le fascia de Gerota.</td></tr><tr><td>T3b</td><td>Veine cave sous le diaphragme.</td></tr><tr><td>T3c</td><td>Veine cave au-dessus du diaphragme ou invasion de sa paroi.</td></tr><tr><td>T4</td><td>Au-delà du fascia de Gerota, y compris extension contiguë à la surrénale homolatérale.</td></tr></tbody></table><p>N0 signifie absence de métastase ganglionnaire régionale démontrée dans l’évaluation ; N1 présence de métastase régionale. M0 et M1 décrivent respectivement absence et présence de métastase distante selon le bilan. La simple taille d’un ganglion ne prouve pas sa nature.</p><table class="t"><thead><tr><th>Stade</th><th>Combinaison simplifiée</th></tr></thead><tbody><tr><td>I</td><td>T1 N0 M0</td></tr><tr><td>II</td><td>T2 N0 M0</td></tr><tr><td>III</td><td>T3 N0 M0 ou T1–T3 N1 M0</td></tr><tr><td>IV</td><td>T4 tout N M0, ou tout T tout N M1</td></tr></tbody></table><p>Une petite tumeur avec extension veineuse n’est plus T1 par la seule taille. Une extension contiguë à la surrénale et une métastase surrénalienne séparée ne sont pas le même mécanisme d’extension. Le compte rendu multidisciplinaire précise ces distinctions avant le traitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §4,pp.17–18,tableau 4.1</a>.</p></section>
<section class="ilot" id="c64-e-risques"><h2>Trois évaluations de risque à ne pas mélanger</h2><h3>IMDC en maladie métastatique</h3><p>Compter un point pour chacun des six facteurs : performance de Karnofsky &lt;80 % ; délai diagnostic–traitement systémique &lt;1 an ; hémoglobine sous la limite inférieure ; calcium corrigé au-dessus de la limite supérieure ; neutrophiles au-dessus de la limite supérieure ; plaquettes au-dessus de la limite supérieure. Les limites biologiques sont celles du laboratoire.</p><table class="t"><thead><tr><th>Points</th><th>Groupe IMDC</th></tr></thead><tbody><tr><td>0</td><td>Favorable</td></tr><tr><td>1–2</td><td>Intermédiaire</td></tr><tr><td>≥3</td><td>Défavorable</td></tr></tbody></table><p>Exemple fictif : traitement commencé 4 mois après diagnostic, hémoglobine basse et neutrophiles élevés, avec autres facteurs absents : 3 points, risque défavorable. Une valeur de calcium brut ne remplace pas automatiquement le calcium corrigé demandé par le score. Le résultat ne signifie pas qu’un traitement est inutile ; il informe choix et pronostic.</p><h3>Leibovich 2003 après chirurgie des cellules claires</h3><table class="t"><thead><tr><th>Facteur</th><th>Points</th></tr></thead><tbody><tr><td>pT1a / pT1b / pT2 / pT3–4</td><td>0 / 2 / 3 / 4</td></tr><tr><td>Ganglions N0 ou Nx / N+</td><td>0 / 2</td></tr><tr><td>Diamètre &lt;10 cm / ≥10 cm</td><td>0 / 1</td></tr><tr><td>Grade 1–2 / 3 / 4</td><td>0 / 1 / 3</td></tr><tr><td>Nécrose absente / présente</td><td>0 / 1</td></tr></tbody></table><p>Score 0–2 : faible risque ; 3–5 : intermédiaire ; ≥6 : élevé. Exemple fictif : pT1b, N0, 5 cm, grade 2, sans nécrose = 2 points. Ce score n’est pas calculé avec les neutrophiles ou le délai de traitement. Les modalités de grade et la validité de l’outil doivent être considérées par l’équipe ; les autres histotypes nécessitent des modèles appropriés.</p><h3>Critères d’adjuvant</h3><p>KEYNOTE-564 définit une population de carcinomes à cellules claires après résection : pT2 grade 4/<button class="w" data-k="c64-sarcomatoide">sarcomatoïde</button>, pT3, pT4, N+ ou certains M1 sans maladie résiduelle après résection complète. La fenêtre <button class="w" data-k="c64-adjuvant">Adjuvant : population, bénéfice et limites</button> détaille le raisonnement. On ne remplace pas ces critères par « IMDC élevé ».</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.3.5,pp.48–50,tableau 7.1p.52,recommandationsp.53</a>.</p></section>
<section class="ilot" id="c64-e-suivi"><h2>Exemple de calendrier après chirurgie à visée curative</h2><p>Le tableau EAU 9.1 est une proposition fondée sur avis d’experts, adaptée à l’histologie et au risque. Pour les carcinomes à cellules claires, le classement suivant utilise Leibovich 2003. « CT » couvre thorax et abdomen ; une IRM abdominale peut remplacer le CT abdominal selon le contexte. Ce tableau ne prescrit pas le suivi après ablation ni celui d’une maladie métastatique sous traitement.</p><table class="t"><thead><tr><th>Risque</th><th>CT dans les 3 premières années</th><th>Après 3 ans</th></tr></thead><tbody><tr><td>Faible, score 0–2</td><td>6, 18 et 30 mois</td><td>Tous les 2 ans si poursuite ; discuter arrêt selon comorbidités, âge et souhaits après 3 ans.</td></tr><tr><td>Intermédiaire, score 3–5</td><td>6, 12, 24 et 36 mois</td><td>Annuel, puis tous les 2 ans après 5 ans si poursuite ; arrêt éventuel discuté après 5 ans.</td></tr><tr><td>Élevé, score ≥6</td><td>3, 6, 12, 18, 24 et 36 mois</td><td>Annuel, puis tous les 2 ans après 5 ans.</td></tr></tbody></table><p>La surveillance rénale et cardiovasculaire se poursuit selon besoin indépendamment de l’arrêt éventuel de l’imagerie. Un symptôme nouveau impose une réévaluation hors calendrier. L’échographie abdominale et la radiographie thoracique sont moins sensibles pour certaines récidives ; les remplacer sans justification change les performances du suivi.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §9,pp.78–81,tableau 9.1</a>.</p></section>
