<section class="ilot" id="g21-semio-bridges" ><h2>Du signe à l’action</h2><p><b>Science → clinique.</b> Distinguer perturbation de réseau, déficit de commande et urgence systémique avant de nommer la cause.</p><p><b>Science → examen.</b> Choisir clinique répétée, biologie, IRM ou DAT selon la question et les conséquences attendues.</p><p><b>Science → traitement.</b> Adapter médicaments et soutien à l’étiologie, aux organes et à l’urgence, avec transmission fiable.</p><div class="key"><b>À retenir.</b> Un signe n’est utile que replacé dans une trajectoire et une décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a>.</p></section>
</div><div class="sci" id="g21-s-anat" role="tabpanel" aria-labelledby="g21-tab-anat" hidden><section class="ilot" id="g21-s-anatomy" ><h2>Noyaux, voies et compartiments de la boucle motrice</h2><p>Le striatum comprend notamment noyau caudé et putamen. Le globus pallidus possède des segments externe et interne ; le noyau sous-thalamique et la substance noire appartiennent à la régulation des réseaux. Le cortex et le thalamus font partie de boucles, et non d’un fil unique allant du noyau gris au muscle.</p><figure data-g21-figure="striatum"><div data-g21-frame="wide"><img src="assets/img/g21/alpha/codex/gray718.png" alt="Planche historique humaine montrant noyau caudé, putamen, pallidum, capsule interne et thalamus, avec leurs étiquettes originales" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span><span data-g21-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Noyau caudé, composante du striatum, nommé sur l’original.</li><li>Putamen, autre composante du striatum, à distinguer du pallidum.</li><li>Capsule interne, substance blanche voisine des noyaux ; une voie n’est pas un noyau.</li><li>Thalamus, relais d’un réseau plus large que le seul striatum.</li></ol><p>Anatomie normale de référence. La page de provenance n’a pas de description détaillée : les étiquettes originales et le livre humain sont conservés, sans orientation ou diagnostic inventés. Aucune lésion vasculaire ou perte neuronale n’est démontrée.</p><p data-g21-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 718 · <a href="https://commons.wikimedia.org/wiki/File:Gray718.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La capsule interne est une substance blanche voisine de ces noyaux. Une atteinte d’une voie corticospinale peut donner faiblesse et signes pyramidaux ; une perturbation de la régulation striatale peut donner lenteur et rigidité sans la même perte de force. Cette distinction aide à interpréter un profil mêlant plusieurs signes.</p><figure data-g21-figure="basal"><div data-g21-frame="wide"><img src="assets/img/g21/alpha/codex/basal.png" alt="Schéma humain de deux niveaux de coupe coronale des noyaux gris, avec striatum, pallidum, noyau sous-thalamique et substance noire" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span><span data-g21-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Striatum, nommé sur l’original : territoire d’entrée et de modulation de la boucle.</li><li>GPi : segment interne du globus pallidus, distinct du segment externe GPe nommé juste au-dessus.</li><li>STN : noyau sous-thalamique, nommé dans le second niveau de coupe.</li><li>SN : substance noire dans le second niveau ; la figure ne sépare pas une mesure de dopamine ou un récepteur.</li></ol><p>Modèle anatomique normal à deux niveaux, pas une IRM, un dosage ou une lésion G21. Les abréviations originales sont explicitées ; aucune flèche causale ou thérapeutique nouvelle n’est dessinée.</p><p data-g21-credit>Andrew Gillies, schéma humain créé et publié en 2005 · <a href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le schéma humain d’Andrew Gillies montre deux niveaux coronaux ; le striatum et le pallidum se repèrent dans un niveau, le noyau sous-thalamique et la substance noire dans un autre. Il ne montre pas un résultat de patient ni une quantité de neurotransmetteur. Les labels SN ne quantifient pas une atteinte de pars compacta ou de pars reticulata.</p><p>Le blocage d’un récepteur striatal est une perturbation fonctionnelle différente d’une lésion vasculaire stratégique. Une localisation anormale à l’IRM doit être reliée au côté, au début et aux fonctions. Les lésions diffuses et les maladies concomitantes peuvent rendre le tableau moins simple.</p><p><b>Science → clinique.</b> Décrire bradykinésie, force, réflexes et signes axiaux séparément plutôt que tout appeler faiblesse ou Parkinson.</p><p><b>Science → examen.</b> Le modèle anatomique aide à formuler la question d’imagerie et à rechercher concordance ; il ne prouve pas la cause d’un hypersignal.</p><p><b>Science → traitement.</b> Une cause postsynaptique médicamenteuse et une lésion vasculaire n’exigent pas la même stratégie. Le repérage anatomique ne rend pas un dopaminergique universel.</p><div class="key"><b>À retenir.</b> Un noyau gris, une voie de substance blanche et un réseau ne sont pas interchangeables.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray718.png" target="_blank" rel="noopener">IMG-STRIATUM — Description,origine,licence et original</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Description,origine,licence et original</a>.</p></section>
</div><div class="sci" id="g21-s-histo" role="tabpanel" aria-labelledby="g21-tab-histo" hidden><section class="ilot" id="g21-s-histology" ><h2>Neurone pigmenté et tissu nerveux : voir sans surinterpréter</h2><p>Un neurone possède un corps cellulaire et des prolongements ; des cellules gliales soutiennent l’environnement, la myéline et la surveillance tissulaire. Une coloration morphologique montre certaines structures, sans mesurer toutes les fonctions. La neuromélanine brune de la photographie est identifiée par la provenance dans un neurone humain de substance noire.</p><figure data-g21-figure="histo"><div data-g21-frame="wide"><img src="assets/img/g21/alpha/codex/neuromelanin.jpg" alt="Microphotographie humaine H&amp;E d’un neurone de substance noire avec pigment brun de neuromélanine et barre de20micromètres" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Matériel brun de neuromélanine dans le cytoplasme du neurone, identifié par la provenance.</li><li>Région nucléaire et nucléole visibles : coloration morphologique, pas test d’un récepteur.</li><li>Barre d’échelle originale de 20 µm, soit 0,02 mm ; ne pas mesurer la cellule sur une capture redimensionnée.</li></ol><p>Statut clinique du donneur non précisé ; ne pas qualifier le cerveau de sain sur cette image seule. H&E ne dose pas la dopamine, ne montre pas un blocage D2 et ne prouve ni corps de Lewy, ni cause G21.</p><p data-g21-credit>Tulemo, microphotographie humaine personnelle, 24 janvier 2021, H&E · <a href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le statut clinique du donneur n’est pas précisé. Il ne faut donc pas transformer cette image en cerveau « sain certifié », en maladie de Parkinson diagnostiquée ou en cas de parkinsonisme médicamenteux. La barre d’échelle appartient à l’original ; une capture redimensionnée ne permet pas une mesure libre sans étalonnage.</p><p>Dans une perturbation surtout postsynaptique, la présence d’un récepteur occupé n’est pas visualisée par cette H&E. Inversement, une maladie dégénérative peut comporter des lésions présynaptiques qui ne sont pas quantifiées sur un seul champ. Le nombre de cellules sur une image isolée ne permet pas d’inférer une perte neuronale générale.</p><p>Les cellules gliales et les voies de substance blanche peuvent aussi intervenir dans des maladies structurales ou inflammatoires. Une biopsie cérébrale n’est pas une étape de routine de tout syndrome parkinsonien. L’histologie peut être utile dans des contextes spécialisés, mais l’examen et l’histoire restent le point de départ clinique.</p><p><b>Science → clinique.</b> Un pigment n’est pas une preuve de transmission dopaminergique normale ou anormale ; la fonction est évaluée chez le patient.</p><p><b>Science → examen.</b> Le DAT explore une question présynaptique différente d’une simple coloration. Ni l’un ni l’autre ne remplace le diagnostic étiologique complet.</p><p><b>Science → traitement.</b> La photographie ne justifie ni lévodopa, ni anticholinergique, ni immunothérapie. L’indication se construit sur la cause et la population.</p><div class="key"><b>À retenir.</b> Distinguer morphologie, fonction et interprétation clinique.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones,astrocytes,microglie,oligodendrocytes</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Description,origine,licence et original</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-IMG — Synthèse recommandations d’imagerie et diagnostique</a>.</p></section>
</div><div class="sci" id="g21-s-physio" role="tabpanel" aria-labelledby="g21-tab-physio" hidden><section class="ilot" id="g21-s-physiology" ><h2>Modulation dopaminergique et sélection du mouvement</h2><p>Le mouvement ne résulte pas seulement d’un message excitateur vers le muscle. Les boucles des noyaux gris contribuent à la régulation de l’activité corticale et des programmes moteurs. Un sujet peut donc conserver une force et éprouver une difficulté à initier, répéter ou ajuster un geste.</p><p>Dans le modèle simplifié décrit par la revue 2012, le blocage D2 striatal désinhibe des neurones de la voie indirecte, modifie l’activité pallidale et sous-thalamique et augmente la sortie inhibitriceGABAergique vers la projection thalamocorticale. Cette chaîne aide à comprendre une bradykinésie ; elle ne signifie pas que tous les médicaments ou toutes les causes de G21 ont le même effet à chaque étage.</p><figure data-g21-figure="basal"><div data-g21-frame="wide"><img src="assets/img/g21/alpha/codex/basal.png" alt="Schéma humain de deux niveaux de coupe coronale des noyaux gris, avec striatum, pallidum, noyau sous-thalamique et substance noire" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span><span data-g21-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Striatum, nommé sur l’original : territoire d’entrée et de modulation de la boucle.</li><li>GPi : segment interne du globus pallidus, distinct du segment externe GPe nommé juste au-dessus.</li><li>STN : noyau sous-thalamique, nommé dans le second niveau de coupe.</li><li>SN : substance noire dans le second niveau ; la figure ne sépare pas une mesure de dopamine ou un récepteur.</li></ol><p>Modèle anatomique normal à deux niveaux, pas une IRM, un dosage ou une lésion G21. Les abréviations originales sont explicitées ; aucune flèche causale ou thérapeutique nouvelle n’est dessinée.</p><p data-g21-credit>Andrew Gillies, schéma humain créé et publié en 2005 · <a href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Un récepteur postsynaptique et un transporteur présynaptique sont des cibles différentes. Un médicament peut perturber le signal reçu sans supprimer toutes les terminaisons. Cela explique qu’un examen des transporteurs puisse rester préservé dans une forme purement médicamenteuse, alors qu’un déficit peut suggérer une atteinte concomitante.</p><p>La répétition des mouvements, la résistance passive et les oscillations au repos testent des dimensions différentes. La rigidité extrapyramidale n’est pas la spasticité d’une voie pyramidale et le tremblement n’est pas requis pour tout syndrome. La clinique ne permet pourtant pas toujours une séparation certaine entre effet du médicament et maladie dévoilée.</p><p>La récupération après adaptation peut être progressive ; le fonctionnement du patient et son contexte psychiatrique ou neurologique comptent. Le retrait d’un antagoniste et l’omission d’un traitement dopaminergique ne sont pas des manipulations équivalentes.</p><p><b>Science → clinique.</b> Décrire ce que le patient peut faire et ce qui ralentit, en séparant force, amplitude, rythme et tonus.</p><p><b>Science → examen.</b> Comparer avant/après et poser une question précise au DAT ou à l’IRM, sans diagnostic automatique sur un seul résultat.</p><p><b>Science → traitement.</b> Corriger l’exposition quand possible et éviter de compenser mécaniquement par une hausse dopaminergique, surtout lorsque la FI exclut l’indication.</p><div class="key"><b>À retenir.</b> Le signal, sa cible et la structure qui le transmet sont des niveaux différents.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></section>
</div><div class="sci" id="g21-s-bio" role="tabpanel" aria-labelledby="g21-tab-bio" hidden><section class="ilot" id="g21-s-biochemistry" ><h2>Précurseur, récepteur, transporteur et élimination</h2><p>La dopamine et la lévodopa ne sont pas la même molécule. La FI Madopar explique que la lévodopa, précurseur, traverse la barrière hémato-encéphalique, puis est transformée en dopamine ; la dopamine administrée ne possède pas la même capacité de passage. Le bensérazide limite la décarboxylation périphérique dans cette association.</p><p>Les deux principes actifs sont associés dans le rapport 4:1. Le nom Madopar 125 correspond à 100 mg de lévodopa plus 25 mg de bensérazide, et non 125 mg de lévodopa. Les formes LIQ, standards et DR ont des cinétiques et consignes distinctes. L’eau utilisée pour disperserLIQ ne fait pas de tous les verres une solution de concentration fixe à fractionner arbitrairement.</p><figure data-g21-figure="histo"><div data-g21-frame="wide"><img src="assets/img/g21/alpha/codex/neuromelanin.jpg" alt="Microphotographie humaine H&amp;E d’un neurone de substance noire avec pigment brun de neuromélanine et barre de20micromètres" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Matériel brun de neuromélanine dans le cytoplasme du neurone, identifié par la provenance.</li><li>Région nucléaire et nucléole visibles : coloration morphologique, pas test d’un récepteur.</li><li>Barre d’échelle originale de 20 µm, soit 0,02 mm ; ne pas mesurer la cellule sur une capture redimensionnée.</li></ol><p>Statut clinique du donneur non précisé ; ne pas qualifier le cerveau de sain sur cette image seule. H&E ne dose pas la dopamine, ne montre pas un blocage D2 et ne prouve ni corps de Lewy, ni cause G21.</p><p data-g21-credit>Tulemo, microphotographie humaine personnelle, 24 janvier 2021, H&E · <a href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>D2 désigne un récepteur ; DAT un transporteur. Une coloration du pigment ne mesure ni l’un ni l’autre. Le bipéridène agit surtout sur la transmission cholinergique centrale dans sa FI. La FI Symmetrel décrit un mécanisme dopaminergique encore formulé comme hypothèse ; il ne doit pas être résumé à un agonisme D2 pur.</p><p>La pharmacocinétique est une autre dimension. L’amantadine s’accumule si l’élimination rénale diminue, ce qui peut favoriser confusion, hallucinations, ataxie ou myoclonies. La table de FI utilise une clairance et des intervalles spécifiques ; transformer un intervalle espacé en dose quotidienne supposée équivalente n’est pas une règle de prescription.</p><p>La bromocriptine est liée au métabolisme CYP3A et aux interactions CYP3A4 dans la FI Parlodel. Des inhibiteurs peuvent modifier l’exposition ; la cause d’une nouvelle confusion ou chute n’est donc pas toujours la maladie neurologique. Ces identifiants scientifiques gardent leur graphie exacte.</p><p><b>Science → clinique.</b> Une nouvelle dégradation après modification de dose, de rein ou d’association demande une revue de médicament et une évaluation clinique.</p><p><b>Science → examen.</b> Vérifier produit, voie, concentration/quantité par unité et méthode rénale, puis interpréter la trajectoire.</p><p><b>Science → traitement.</b> Appliquer la FI du produit, son indication et ses limites d’âge ; ne pas fusionner une dose de lévodopa, une masse de combinaison et un autre schéma de SMN.</p><div class="key"><b>À retenir.</b> Une quantité en mg n’a de sens qu’avec molécule, formulation, prise et intervalle.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Description,origine,licence et original</a>.</p></section>
</div><div class="sci" id="g21-s-immuno" role="tabpanel" aria-labelledby="g21-tab-immuno" hidden><section class="ilot" id="g21-s-immunology" ><h2>Surveillance tissulaire, encéphalite et syndrome systémique</h2><p>Les neurones fonctionnent dans un tissu soutenu par glie et vaisseaux. Les astrocytes contribuent à l’environnement extracellulaire et à la barrière ; les oligodendrocytes forment la myéline ; la microglie participe à la surveillance et à la phagocytose. Ces rôles normaux ne se réduisent pas à une inflammation toujours pathologique.</p><p>Une maladie infectieuse ou inflammatoire peut affecter réseaux, parenchyme ou voies, et laisser un déficit ou provoquer une nouvelle activité. La catégorie G21.3 se rapporte à un syndrome postencéphalitique ; elle ne prouve pas que l’immunité reste active. Une nouvelle fièvre ou un nouveau déficit exige une enquête, sans être appelé séquelle par défaut.</p><figure data-g21-figure="motor"><div data-g21-frame="tall"><img src="assets/img/g21/alpha/codex/motor.png" alt="Schéma historique humain de la voie corticospinale, capsule interne et décussation des pyramides, comparaison avec la régulation des noyaux gris" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Aire motrice corticale : commande volontaire dans le schéma.</li><li>Capsule interne : passage de fibres, distinct des noyaux striataux voisins.</li><li>Décussation des pyramides : repère de voie corticospinale, pas de la boucle dopaminergique.</li></ol><p>Anatomie normale simplifiée, sans force ou réflexe mesuré. Une lenteur, une faiblesse pyramidale et une rigidité extrapyramidale ne sont pas synonymes ; la figure ne montre ni cause toxique, ni inflammation active.</p><p data-g21-credit>Gray 1918, planche 764, trajet moteur humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La voie motrice illustrée situe une commande et des passages de fibres ; elle ne montre pas des anticorps ou une activation microgliale. Un profil mêlant signes pyramidaux et parkinsoniens peut conduire à rechercher plusieurs compartiments ou maladies, plutôt qu’une seule anomalie de dopamine.</p><p>Dans le syndrome malin, leucocytose, CK et défaillances sont possibles sans qu’un marqueur isolé identifie une infection. À l’inverse, la présence d’un médicament n’exclut pas une infection du SNC ou un sepsis concomitant. La catatonie maligne et la toxicité sérotoninergique participent également au diagnostic différentiel urgent.</p><p>Le mécanisme et le niveau de preuve doivent rester distincts d’une prescription. Une hypothèse inflammatoire ne crée pas une indication d’immunothérapie pour tout G21 ; le bilan infectieux ou immunologique est choisi avec l’équipe selon signes et histoire. Les options de SMN reposent souvent sur données faibles et soutien spécialisé, pas sur un test immunologique unique.</p><p><b>Science → clinique.</b> Examiner état général, conscience, température, trajectoire et signes nouveaux avant de conclure au déficit résiduel.</p><p><b>Science → examen.</b> Les examens ciblés recherchent infection, autre maladie ou complication ; ni CK ni numération ne répondent à toute la question.</p><p><b>Science → traitement.</b> Traiter une cause active prouvée selon son cadre et soutenir les fonctions ; la rééducation d’une déficience et le traitement d’une maladie active sont complémentaires.</p><div class="key"><b>À retenir.</b> Postencéphalitique, inflammatoire actif et syndrome malin ne sont pas synonymes.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue" target="_blank" rel="noopener">NORMAL-TISSUE — Neurones,astrocytes,microglie,oligodendrocytes</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Description,origine,licence et original</a>.</p></section>
</div></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g21-p-plan" ><h2>Une indication précise avant un traitement symptomatique</h2><p>Une forme médicamenteuse appelle d’abord réévaluation de la molécule causale avec son prescripteur : réduction, retrait ou substitution selon bénéfice et risque psychiatrique ou somatique. L’efficacité d’un ajout symptomatique ne se déduit pas de son autorisation dans un autre syndrome. Les essais anciens de traitements du parkinsonisme médicamenteux apportent des preuves limitées.</p><p>Quatre FI suisses sont attribuées à leur version réellement lue : Akineton mai 2022, Symmetrel février 2025, Madopar juin 2023 et Parlodel mai 2020. Ces dates ne prouvent pas la disponibilité de chaque emballage. Les schémas ci-dessous décrivent la FI du produit et la population indiquée ; ils ne constituent pas une prescription pour tout code G21.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a>.</p></section>
<section class="ilot" id="g21-p-akineton" ><h2>Bipéridène : distinguer parkinsonisme ordinaire et syndrome malin</h2><p><b>Akineton, FI mai 2022</b>, Laboratorio Farmaceutico S.I.T. S.r.l., GTIN 7680240360220. Le bipéridène bloque de façon réversible les récepteurs centraux de l’acétylcholine. Les indications incluent les troubles extrapyramidaux médicamenteux et certains symptômes parkinsoniens, surtout rigidité et tremblement.</p><table class="t"><thead><tr><th>Forme et indication adulte</th><th>Posologie FI et limite</th></tr></thead><tbody><tr><td>Comprimé immédiat 2 mg, Parkinson</td><td>Début 1 mg deux fois/jour ; augmentation possible de 2 mg/j ; maximum 16 mg/j</td></tr><tr><td>Forme immédiate, troubles extrapyramidaux dus aux médicaments</td><td>1–4 mg par prise, une à quatre fois/jour selon gravité ; ce n’est pas une dose initiale élevée systématique</td></tr><tr><td>Retard 4 mg</td><td>Après titration avec forme immédiate ; habituellement 1–2 comprimés/j ; maximum 3 comprimés= 12 mg/j ; ne pas diviser, mâcher ou écraser</td></tr></tbody></table><p>Les plafonds des formes immédiate et retard ne sont pas interchangeables. La formulation injectable 5 mg/mL a sa propre administration ; aucune dose IV générale n’est déduite de la dose orale.</p><p>Contre-indications notamment : glaucome à angle fermé, sténose digestive mécanique, mégacôlon/iléus et hypersensibilité. Prudence devant rétention urinaire ou hypertrophie prostatique, tachycardie et risque convulsif. Confusion, troubles mnésiques, effets périphériques anticholinergiques et aggravation de dyskinésies tardives doivent être surveillés ; addition avec d’autres anticholinergiques et alcool à examiner.</p><p>Chez la personne âgée ou cognitivement vulnérable, la tolérance impose une prudence particulière. La FI ne fournit pas d’expérience rénale/hépatique permettant d’inventer une adaptation chiffrée. Les données pédiatriques concernent surtout des troubles médicamenteux transitoires, notamment dystonies, et ne valident pas un traitement universel du parkinsonisme de l’enfant ; la forme retard n’est pas destinée aux enfants/adolescents.</p><p>Grossesse : prudence ; allaitement non recommandé dans cette FI. En dehors d’une urgence, l’arrêt doit être progressif. <b>Dans un syndrome malin suspecté, les recommandations BAP demandent au contraire l’arrêt des anticholinergiques</b>, qui peuvent entraver la dissipation de chaleur. Une indication dans les symptômes extrapyramidaux ordinaires ne doit pas être transférée à cette urgence.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a>.</p></section>
<section class="ilot" id="g21-p-amantadine" ><h2>Amantadine : la fonction rénale gouverne l’exposition</h2><p><b>Symmetrel, FI février 2025</b>, Novartis Pharma Schweiz AG, GTIN 7680318410383 : capsule 100 mg. L’indication adulte comprend des formes idiopathiques, postencéphalitiques, cérébrovasculaires et médicamenteuses. La FI décrit une modulation dopaminergique supposée, notamment libération et recapture ; ce n’est pas un agoniste D2 pur et elle ne doit pas être classée comme simple antimuscarinique.</p><p>Dans le parkinsonisme médicamenteux, réduire d’abord si possible le médicament responsable. Le début FI est 100 mg/j pendant quatre à sept jours, puis 100 mg deux fois/j si toléré. Le cadre général autorise une phase initiale jusqu’à quinze jours et des ajustements au moins hebdomadaires ; 300 mg/j ne concerne que des situations sélectionnées. Chez les personnes d’au moins 65 ans <b>sans pathologie rénale</b>, la dose maximale recommandée est 100 mg/j : ce plafond reste distinct de l’adaptation rénale.</p><p>La FI adapte l’intervalle de 100 mg à la clairance de créatinine, avec sa convention de surface corporelle. Exemple pédagogique : une clairance 30 dans les unités de son tableau, dans la tranche 25–35, conduit à 100 mg toutes les quarante-huit heures. Il ne faut ni substituer automatiquement un DFGe de laboratoire ni transformer ce schéma en 50 mg chaque jour. Les bornes partagées du tableau doivent être clarifiées par le prescripteur/pharmacien au lieu d’inventer une inégalité. En insuffisance rénale au début d’un traitement antiparkinsonien, la dose du premier jour indiquée est 100 mg ; une charge d’un autre usage ne doit pas être transférée.</p><p>Contre-indications notamment confusion/excitabilité, psychose ou délire, épilepsie réfractaire, grossesse et hypersensibilité aux composants, dont arachide/soja selon produit. Accumulation rénale : confusion, hallucinations, ataxie ou myoclonies doivent faire vérifier dose, intervalle et organes. Surveiller aussi œdèmes, somnolence et troubles du contrôle des impulsions. Les associations dopaminergiques et anticholinergiques peuvent augmenter les effets neuropsychiatriques ; certains diurétiques combinant hydrochlorothiazide et épargne potassique diminuent la clairance.</p><p>Grossesse contre-indiquée ; contraception hautement efficace pendant le traitement et jusqu’à cinq jours après la dernière dose ; allaitement à éviter. L’arrêt brutal peut provoquer une dégradation ou un tableau malin : organiser le changement avec l’équipe, sans transformer ce risque en poursuite automatique lors d’une intoxication.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a>.</p></section>
<section class="ilot" id="g21-p-madopar" ><h2>Lévodopa/bensérazide : une exclusion d’indication à connaître</h2><p><b>Madopar, FI juin 2023</b>, Roche Pharma (Schweiz) AG, GTIN 7680523770487. La lévodopa traverse la barrière hématoencéphalique et apporte un précurseur de dopamine ; le bensérazide inhibe la décarboxylation périphérique. Le rapport des deux principes est 4:1. La FI indique les syndromes parkinsoniens <b>à l’exception des formes d’origine médicamenteuse</b>. Une décision spécialisée dans un tableau vasculaire ou mixte ne devient pas une prescription automatique pour G21.1.</p><table class="t"><thead><tr><th>Présentation</th><th>Quantités à conserver</th></tr></thead><tbody><tr><td>Madopar LIQ 62,5</td><td>50 mg lévodopa +12,5 mg bensérazide</td></tr><tr><td>Madopar LIQ 125</td><td>100 mg lévodopa +25 mg bensérazide</td></tr><tr><td>Madopar DR</td><td>200 mg lévodopa +50 mg bensérazide ; une demi-dose n’est pas LIQ 62,5</td></tr></tbody></table><p>Exemple de début FI dans Parkinson précoce : un LIQ 62,5 trois à quatre fois/jour, avec titration individualisée. La plage usuelle optimale décrite est 300–800 mg de lévodopa avec 75–200 mg de bensérazide/j, répartie en au moins trois prises ; elle n’est pas une cible obligatoire de tout patient. Les formes standard, LIQ et DR ont leurs consignes propres.</p><p>LIQ est dispersé dans 25–50 mL d’eau, sans lait, jus ni eau chaude ; remuer et boire rapidement, dans les trente minutes. Ce n’est pas une solution de concentration fixe à fractionner arbitrairement. Prendre idéalement trente minutes avant ou une heure après le repas ; si intolérance digestive, une petite collation pauvre en protéines peut être discutée. Cela ne justifie pas une restriction protéique globale exposant à dénutrition.</p><p>Contre-indications notamment âge inférieur à 25 ans, grossesse ou contraception insuffisante chez une personne susceptible d’être enceinte, psychose, glaucome à angle fermé, affection cardiaque et maladie endocrine/rénale/hépatique décompensée, certains traitements par inhibiteurs de monoamine oxydase. Pour atteinte rénale légère/modérée avec clairance supérieure à 30 mL/min, pas d’adaptation selon FI ; aucune équivalence avec une maladie décompensée n’en découle. Données hépatiques limitées.</p><p>Surveiller hypotension orthostatique, dyskinésies, somnolence ou endormissement soudain, manifestations psychiatriques et contrôle des impulsions ; revoir l’ensemble des interactions et l’alimentation. Ne pas arrêter brutalement : un tableau ressemblant au syndrome malin est possible. Grossesse impose une décision médicale rapide sur les modalités ; pas d’auto-arrêt abrupt. Allaitement non recommandé. La sécurisation des prises lors de dysphagie, jeûne ou hospitalisation exige un plan pharmaceutique individualisé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-RESPONSE — DAT, tableau 2 et discussion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a>.</p></section>
<section class="ilot" id="g21-p-parlodel" ><h2>Bromocriptine : indication FI et usage hospitalier hors indication</h2><p><b>Parlodel, FI mai 2020</b>, Sandoz Pharmaceuticals AG, GTIN 7680390010204, comprimé 2,5 mg. Agoniste dopaminergique dérivé de l’ergot : indication parkinsonienne idiopathique et postencéphalitique. La FI ne crée pas une indication « syndrome malin ». L’usage éventuel dans cette urgence relève d’une décision hospitalière hors indication, de preuves limitées et de ses contre-indications.</p><p>Pour Parkinson dans la FI : début 1,25 mg/j la première semaine, de préférence le soir ; augmentation de 1,25 mg par semaine, puis répartition en deux à trois prises. Après six à huit semaines, si nécessaire, paliers de 2,5 mg/semaine ; maximum 30 mg/j. Ce calendrier lent ne doit pas être présenté comme traitement d’urgence du syndrome malin.</p><p>Contre-indications importantes : antécédent psychiatrique grave, sepsis, antécédent d’AVC, maladie coronaire ou cardiovasculaire sévère, hypertension non contrôlée, troubles vasculaires occlusifs/Raynaud, ulcère ou hémorragie digestive, insuffisance hépatique sévère Child-Pugh C et plusieurs situations obstétricales. Vérifier la FI complète. Les doses élevées prolongées exposent à des complications fibrotiques pleuropulmonaires ou rétropéritonéales ; dyspnée, douleur lombaire, œdème ou altération rénale doivent être évalués. Une fibrose valvulaire est aussi rapportée.</p><p>La bromocriptine est substrat et inhibiteur du CYP3A ; les inhibiteurs puissants ou modérés du CYP3A4, dont clarithromycine et certains azolés, sont contre-indiqués. Les antagonistes dopaminergiques peuvent s’opposer à son effet ; rechercher interactions et médicaments à marge étroite. Surveiller hypotension, somnolence/endormissement, contrôle des impulsions et signes vasculaires. Sujet âgé : début bas et progression prudente. Fonction hépatique essentielle au métabolisme ; absence d’étude rénale ne constitue pas un schéma d’adaptation validé.</p><p>Grossesse : habituellement arrêt sauf nécessité médicale évaluée ; ce contexte ne se confond pas avec les indications endocrines. Ne pas l’utiliser pendant allaitement, sauf indication médicale spécifique d’inhibition de lactation. Les indications/doses endocriniennes pédiatriques ne se transposent pas au parkinsonisme de l’enfant.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a>.</p></section>
<section class="ilot" id="g21-p-nms" ><h2>Syndrome malin : organiser l’urgence et expliciter l’incertitude</h2><p>Arrêter les antagonistes dopaminergiques en cause et les anticholinergiques, appeler l’équipe urgente et surveiller ventilation, déglutition, température, circulation, bilan hydrique, potassium, fonction rénale et rhabdomyolyse. Individualiser apports et support ; aucune vitesse de remplissage unique ne convient à tous. Si le déclencheur est une omission dopaminergique, discuter au contraire une reprise adaptée avec l’équipe.</p><p>BAP 2023 discute benzodiazépines, bromocriptine, amantadine, dantrolène et électroconvulsivothérapie selon gravité et réponse. Les preuves sont surtout séries, observations et consensus, exposées aux biais ; ni tous ces traitements ensemble ni une dose injectable générique ne sont requis par l’étiquette G21.0. Formulation, voie, contre-indications et service spécialisé comptent.</p><p>Une réintroduction antipsychotique éventuelle exige une réévaluation. BAP conseille d’attendre au moins deux semaines après résolution ; le support PHEL propose cinq à quatorze jours. Conserver cette différence de source et de point de départ, choisir avec psychiatrie et neurologie, faible dose, progression lente et surveillance ; aucun délai moyen inventé ne remplace le jugement.</p><p>Les cas pédagogiques originaux ne sont pas des questions officielles de l’examen fédéral. Les références PROFILES/MEBEKO cadrent les compétences d’examen clinique et de raisonnement, sans fabriquer un item fédéral spécifique G21. Auto-relectures IA et contrôles techniques ne constituent pas une validation médicale humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-RECHALL — Recommandation finale et discussion de réintroduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-RECHALL — Réintroduction antipsychotiques</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires, marche/équilibre, SSP système nerveux</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, examen CK et CS</a>.</p></section>
