] [data-g21-mark="3"]{left:67%; top:62%}[data-g21-figure="basal"] [data-g21-mark="4"]{left:77%; top:66%}[data-g21-figure="striatum"] [data-g21-mark="1"]{left:55%; top:23%}[data-g21-figure="striatum"] [data-g21-mark="2"]{left:64%; top:29%}[data-g21-figure="striatum"] [data-g21-mark="3"]{left:59%; top:40%}[data-g21-figure="striatum"] [data-g21-mark="4"]{left:47%; top:59%}[data-g21-figure="motor"] [data-g21-mark="1"]{left:64%; top:13%}[data-g21-figure="motor"] [data-g21-mark="2"]{left:54%; top:25%}[data-g21-figure="motor"] [data-g21-mark="3"]{left:40%; top:61%}[data-g21-figure="histo"] [data-g21-mark="1"]{left:43%; top:32%}[data-g21-figure="histo"] [data-g21-mark="2"]{left:54%; top:51%}[data-g21-figure="histo"] [data-g21-mark="3"]{left:91%; top:95%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#g21-1">Définition</a></li><li><a href="#g21-2">Épidémiologie</a></li><li><a href="#g21-3">Physiopathologie</a></li><li><a href="#g21-4">Démarche clinique</a></li><li><a href="#g21-5">Anamnèse</a></li><li><a href="#g21-6">Examen clinique</a></li><li><a href="#g21-7">Syndromes</a></li><li><a href="#g21-8">Diagnostic positif</a></li><li><a href="#g21-9">Explorations</a></li><li><a href="#g21-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#g21-11">Prise en charge</a></li><li><a href="#g21-12">Prévention, suivi et pronostic</a></li><li><a href="#g21-13">Points clés</a></li><li><a href="#g21-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="G21"><section class="ilot" id="g21-question" ><h2>Le ralentissement est-il un diagnostic, et faut-il toujours donner de la lévodopa ?</h2><p><b>Vignette fictive.</b> Une personne traitée depuis peu pour des vomissements devient lente et raide. Une autre, sous neuroleptique, présente confusion, rigidité et température anormale. Dans un troisième dossier, un traitement antiparkinsonien a été omis pendant une hospitalisation. Les trois situations impliquent des médicaments, mais leur urgence et leur conduite ne sont pas identiques.</p><p>Il faut d’abord reconnaître le syndrome, rechercher une instabilité et reconstruire la chronologie. Une cause secondaire peut être traitable ; elle peut aussi révéler une maladie sous-jacente. Le traitement de la maladie de Parkinson n’est pas une prescription automatique pour toute personne lente.</p><div class="key"><b>À retenir.</b> Reconnaître le syndrome, identifier le mécanisme et chercher l’urgence avant de choisir le médicament.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></section>
<section class="ilot" id="g21-1" ><h2>1. Définition : syndrome clinique, cause et code</h2><p>Un <button class="w" data-k="g21-syndrome">syndrome parkinsonien</button> associe une <button class="w" data-k="g21-bradykinesia">bradykinésie</button> à une rigidité et/ou un tremblement de repos. Le tremblement n’est donc pas obligatoire. Une lenteur liée à faiblesse, douleur ou trouble cognitif ne suffit pas à conclure. La bradykinésie se caractérise par des mouvements lents, avec recherche de réduction de vitesse ou d’amplitude lors de la répétition.</p><p>Le caractère secondaire repose sur une cause identifiable et une concordance clinique. Dans la nomenclature OFS 2024, G21 comprend aussi bien des formes chroniques que le <b>syndrome malin des neuroleptiques G21.0</b>. Il ne signifie pas seulement « maladie de Parkinson provoquée par un médicament ».</p><table class="t"><thead><tr><th>Sous-code OFS 2024</th><th>Libellé ou portée</th></tr></thead><tbody><tr><td>G21.0</td><td>Syndrome malin des neuroleptiques</td></tr><tr><td>G21.1</td><td>Autres syndromes secondaires parkinsoniens dus à des médicaments</td></tr><tr><td>G21.2</td><td>Secondaire à d’autres agents externes</td></tr><tr><td>G21.3</td><td>Syndrome parkinsonien post-encéphalitique</td></tr><tr><td>G21.4</td><td>Libellé OFS : Maladie de Parkinson vasculaire</td></tr><tr><td>G21.8</td><td>Autres syndromes parkinsoniens secondaires</td></tr><tr><td>G21.9</td><td>Secondaire, sans précision</td></tr></tbody></table><p>Le <button class="w" data-k="g21-coding">codage</button> distingue G20, maladie de Parkinson, G22*, syndrome au cours de maladies classées ailleurs, et G23, autres maladies dégénératives des noyaux gris. Les sous-codes.5,.6,.7 ne sont pas inventés. Pour G21.0/.1/.2, l’OFS prévoit au besoin un code supplémentaire de cause externe identifiant médicament ou agent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a>.</p><p><button class="w" data-k="g21-exp-1">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-1">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-2" ><h2>2. Épidémiologie : le bon sous-groupe et la bonne époque</h2><p>L’étude de Fleury et collègues, publiée en 2018, décrit le canton de Genève à partir de dossiers hospitaliers, de neurologues privés et d’EMS. Elle inclut des diagnostics établis entre2003 et 2012 et identifie1235 patients vivants avec parkinsonisme :80% de formes dégénératives et 20% de formes non dégénératives.</p><p><b>Parmi les formes non dégénératives</b>,43,4% sont médicamenteuses et 37% vasculaires dans le résumé primaire. Ces deux pourcentages ne portent ni sur toute la population genevoise ni sur l’ensemble des 1235 patients. Ils ne mesurent pas une incidence nationale actuelle d’un code G21.</p><p>Le résumé, et non l’article intégral sous abonnement, a été lu. Les données sont historiques et dépendantes de la recherche des cas et de leur classification. Pour le syndrome malin, les fréquences des supports et séries varient selon période, produits et définition ; aucun chiffre unique n’est présenté comme risque individuel suisse en 2026.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">CH-GENEVA — Résumé primaire obtenu via EuropePMC, objectifs/méthodes/résultats</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a>.</p><p><button class="w" data-k="g21-exp-2">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-2">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-3" ><h2>3. Physiopathologie : blocage fonctionnel, lésion et réseau</h2><p>Les noyaux gris participent à la régulation d’un <button class="w" data-k="g21-network">réseau moteur</button>. Striatum, pallidum, noyau sous-thalamique, substance noire, thalamus et cortex ont des rôles et des connexions distincts. La <button class="w" data-k="g21-dopamine">transmission dopaminergique</button> ne se résume pas à la force musculaire.</p><figure data-g21-figure="striatum"><div data-g21-frame="wide"><img src="assets/img/g21/alpha/codex/gray718.png" alt="Planche historique humaine montrant noyau caudé, putamen, pallidum, capsule interne et thalamus, avec leurs étiquettes originales" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span><span data-g21-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Noyau caudé, composante du striatum, nommé sur l’original.</li><li>Putamen, autre composante du striatum, à distinguer du pallidum.</li><li>Capsule interne, substance blanche voisine des noyaux ; une voie n’est pas un noyau.</li><li>Thalamus, relais d’un réseau plus large que le seul striatum.</li></ol><p>Anatomie normale de référence. La page de provenance n’a pas de description détaillée : les étiquettes originales et le livre humain sont conservés, sans orientation ou diagnostic inventés. Aucune lésion vasculaire ou perte neuronale n’est démontrée.</p><p data-g21-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 718 · <a href="https://commons.wikimedia.org/wiki/File:Gray718.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Un antagonisme <button class="w" data-k="g21-d2">D2 postsynaptique</button> striatal peut perturber la boucle motrice sans exiger d’emblée une destruction des terminaisons présynaptiques. Ce mécanisme diffère de la perte nigrostriatale d’une maladie dégénérative, bien que celle-ci puisse être dévoilée par le médicament. Les autres médicaments ne partagent pas tous exactement le même mécanisme.</p><p>Une lésion vasculaire stratégique peut atteindre une voie ou un réseau ; une maladie diffuse des petits vaisseaux peut participer à un tableau plus complexe. Les hypersignaux ne suffisent pas, à eux seuls, à établir la causalité. Le phénotype postencéphalitique se rapporte à une affection antérieure documentée, sans présumer une inflammation encore active.</p><p>Dans le syndrome malin, le contexte dopaminergique, la thermorégulation, la rigidité et les défaillances systémiques sont discutés. La cause d’un état après <button class="w" data-k="g21-withdrawal">sevrage dopaminergique</button> est différente d’une exposition à un antagoniste ; les consignes « arrêter » et « reprendre » ne se décident pas indistinctement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a>.</p><p><button class="w" data-k="g21-exp-3">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-3">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-4" ><h2>4. Démarche clinique : urgence, syndrome, étiologie puis plan</h2><ol><li><b>Rechercher l’urgence.</b> Confusion nouvelle, altération de conscience, température anormale, dysautonomie, rigidité importante, dégradation rapide, trouble respiratoire ou déficit brutal imposent une évaluation immédiate.</li><li><b>Objectiver le syndrome.</b> Tester gestes répétés, mobilisation passive et tremblement au repos ; distinguer faiblesse, douleur, ataxie et lenteur cognitive.</li><li><b>Reconstruire l’exposition.</b> Ordonnance complète, automédication, traitements de symptômes digestifs, injections/dépôts et médicaments récemment omis.</li><li><b>Examiner la cohérence.</b> Début, évolution, symétrie, signes non moteurs, signes pyramidaux/cérébelleux et antécédents vasculaires ou infectieux.</li><li><b>Choisir des examens et une conduite.</b> Rechercher cause et complications, adapter la stratégie avec les prescripteurs, mesurer retentissement et organiser suivi.</li></ol><p>Une <button class="w" data-k="g21-redflags">alerte clinique</button> compte davantage qu’une étiquette ancienne. Le diagnostic d’une forme médicamenteuse n’impose pas d’attendre six mois avant d’aider le patient ; le suivi peut ensuite modifier l’hypothèse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p><p><button class="w" data-k="g21-exp-4">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-4">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-5" ><h2>5. Anamnèse : une chronologie complète, y compris les omissions</h2><p>L’<button class="w" data-k="g21-history">histoire médicamenteuse</button> doit reprendre noms, indications, doses, dates de début et de changement, associations, formes retard et dernière prise réelle. Demander aussi antiémétiques, prokinétiques, médicaments de vertige ou sommeil, et traitements reçus pendant une hospitalisation. Un médicament « caché » dans une autre indication peut agir sur le système dopaminergique.</p><p>La <button class="w" data-k="g21-drug-latency">relation temporelle</button> oriente sans prouver seule la causalité. Rechercher un ralentissement antérieur, une asymétrie déjà présente, une perte d’odorat ou d’autres signes pouvant évoquer une maladie sous-jacente. Persistance ou progression après retrait peut justifier de rouvrir le diagnostic ; elle ne démontre pas immédiatement une cause unique.</p><p>Interroger marche, chutes, écriture, voix, habillage, repas et déglutition. Demander symptômes cognitifs, urinaires, autonomes et psychiatriques, en tenant compte du niveau antérieur. Une adaptation antipsychotique exige de comprendre la maladie qu’il traite et le risque de rechute.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a>.</p><p><button class="w" data-k="g21-exp-5">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-5">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-6" ><h2>6. Examen clinique : décrire trois signes différents</h2><p>Pour la bradykinésie, observer ouverture-fermeture de main, opposition pouce-index, pronosupination et mouvements des pieds. Comparer côtés, vitesse et amplitude au fil de la répétition. Évaluer aussi lever de chaise, marche, demi-tour, ballant des bras et retentissement fonctionnel. L’<button class="w" data-k="g21-exam">examen moteur</button> se fait avec attention à douleur, force et compréhension.</p><p>La <button class="w" data-k="g21-rigidity">rigidité extrapyramidale</button> est une résistance au mouvement passif relativement indépendante de sa vitesse ; le patient doit être détendu. La roue dentée peut accompagner une résistance, mais un simple phénomène saccadé sans résistance ne suffit pas. Elle se distingue de l’hypertonie spastique et d’une contracture douloureuse.</p><p>Le <button class="w" data-k="g21-tremor">tremblement</button> se décrit au repos, en posture puis en action. Un tremblement de repos et une asymétrie peuvent exister dans une forme médicamenteuse ; leur présence ne ferme pas le diagnostic. Chercher dyskinésies bucco-linguo-faciales, signes pyramidaux, coordination, oculomotricité, cognition et autonomie.</p><figure data-g21-figure="posture"><div data-g21-frame="tall"><img src="assets/img/g21/alpha/codex/gowers.jpg" alt="Dessin historique de Gowers montrant de profil et de face une personne décrite avec maladie de Parkinson, référence sémiologique et non cas G21" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tronc représenté penché : attitude visible, pas mesure du tonus.</li><li>Membre supérieur représenté en flexion : le dessin ne teste ni rigidité ni vitesse.</li><li>Position des pieds sur une image statique : marche, équilibre et festination se testent en mouvement.</li></ol><p>Référence historique de maladie de Parkinson, pas parkinsonisme secondaire prouvé ni portrait universel. Une posture ne remplace pas la recherche de bradykinésie, la mobilisation passive ou l’histoire médicamenteuse.</p><p data-g21-credit>William Richard Gowers, dessin de 1886 publié dans A Manual of Diseases of the Nervous System ; reproduction historique · <a href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Le dessin montre une attitude, pas une preuve de rigidité ni une mesure de bradykinésie. Chez un patient fébrile ou confus, le bilan neurologique s’intègre au triage et au bilan des complications.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">IMG-GOWERS — Description,origine,licence et original</a>.</p><p><button class="w" data-k="g21-exp-6">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-6">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-7" ><h2>7. Syndromes : un regroupement qui guide la question</h2><table class="t"><thead><tr><th>Profil</th><th>Hypothèses et limites</th></tr></thead><tbody><tr><td>Parkinsonisme sous médicament</td><td>Chronologie et exposition ; retrait/substitution à discuter, maladie dégénérative concomitante possible</td></tr><tr><td>Prédominance marche/axe avec signes associés</td><td>Cause vasculaire, hydrocéphalie, myélopathie ou autre réseau ; IRM à relier au tableau</td></tr><tr><td>Rigidité avec confusion, température/dysautonomie</td><td>Syndrome malin, catatonie maligne, sérotoninergique, infection ou autre défaillance urgente</td></tr><tr><td>Après encéphalite documentée</td><td>Déficit résiduel, complication ou nouvelle activité à distinguer ; G21.3 seulement si tableau approprié</td></tr><tr><td>Après omission d’un antiparkinsonien</td><td>État de sevrage possible, pouvant ressembler à SMN ; étiologie et prise en charge urgentes propres</td></tr></tbody></table><figure data-g21-figure="motor"><div data-g21-frame="tall"><img src="assets/img/g21/alpha/codex/motor.png" alt="Schéma historique humain de la voie corticospinale, capsule interne et décussation des pyramides, comparaison avec la régulation des noyaux gris" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Aire motrice corticale : commande volontaire dans le schéma.</li><li>Capsule interne : passage de fibres, distinct des noyaux striataux voisins.</li><li>Décussation des pyramides : repère de voie corticospinale, pas de la boucle dopaminergique.</li></ol><p>Anatomie normale simplifiée, sans force ou réflexe mesuré. Une lenteur, une faiblesse pyramidale et une rigidité extrapyramidale ne sont pas synonymes ; la figure ne montre ni cause toxique, ni inflammation active.</p><p data-g21-credit>Gray 1918, planche 764, trajet moteur humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une <button class="w" data-k="g21-iatrogenic">cause iatrogène</button> peut produire plusieurs mouvements anormaux. Parkinsonisme, akathisie, dystonie aiguë et dyskinésie tardive ne sont pas des synonymes ; une même personne peut présenter plusieurs dimensions. Les traitements de l’une peuvent aggraver l’autre.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p><p><button class="w" data-k="g21-exp-7">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-7">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-8" ><h2>8. Diagnostic positif : ce qui est établi et ce qui reste probable</h2><p><b>Le syndrome est clinique.</b> Objectiver bradykinésie et rigidité et/ou tremblement de repos, puis décrire retentissement. Les critères de maladie de Parkinson idiopathique et ceux d’une cause secondaire ne sont pas identiques. Une réponse à un traitement n’établit pas à elle seule toute l’étiologie.</p><p><b>Origine médicamenteuse.</b> L’exposition connue, l’absence de syndrome avant traitement et le début sous le médicament soutiennent l’hypothèse. L’amélioration après réduction ou retrait est utile, mais le suivi peut révéler une coexistence ou une maladie dévoilée. Ni symétrie obligatoire ni guérison complète à une date fixe ne doivent être exigées.</p><p><b>Origine <button class="w" data-k="g21-vascular">vasculaire</button>.</b> Rechercher concordance entre début, profil clinique et lésions pertinentes. Distinguer forme postAVC, forme insidieuse et forme mixte ; des hypersignaux de substance blanche isolés ne suffisent pas.</p><p><b>Contexte <button class="w" data-k="g21-postenceph">postencéphalitique</button>.</b> Documenter l’affection et la trajectoire, sans conclure automatiquement à une activité immunitaire persistante. Le code est choisi après caractérisation, en tenant compte des catégories distinctes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a>.</p><p><button class="w" data-k="g21-exp-8">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-8">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-9" ><h2>9. Explorations : une cible clinique pour chaque examen</h2><p>La biologie recherche complications et autres causes, notamment si syndrome malin suspecté : <button class="w" data-k="g21-ck">CK et rhabdomyolyse</button>, fonction rénale, potassium et autres ions, paramètres de perfusion, bilan hépatique et explorations infectieuses selon tableau. Un résultat isolé ne confirme ni n’exclut un syndrome malin ; les intervalles du laboratoire suisse et les unités doivent être vérifiés.</p><p>L’<button class="w" data-k="g21-mri">IRM cérébrale</button> est utile au diagnostic différentiel d’un syndrome parkinsonien, avec question structurale et vasculaire. Une image ne mesure pas seule le retentissement ni la causalité. Une urgence vasculaire ou infectieuse suit son propre circuit.</p><p>Le <button class="w" data-k="g21-dat">DAT-SPECT</button> évalue des terminaisons présynaptiques nigrostriatales. Il peut aider dans un syndrome cliniquement incertain si le résultat change la conduite. Un déficit n’identifie pas seul une maladie de Parkinson idiopathique ; une préservation peut soutenir une perturbation surtout postsynaptique. L’équipe de médecine nucléaire vérifie préparation, traitements interférents et indication.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-IMG — Synthèse recommandations d’imagerie et diagnostique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a>.</p><p><button class="w" data-k="g21-exp-9">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-9">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-10" ><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Instabilité ou apparition brutale ?</b> Évaluer immédiatement urgence systémique, vasculaire, infectieuse ou toxique.</li><li><b>Syndrome parkinsonien objectivé ?</b> Séparer bradykinésie, rigidité, tremblement, faiblesse et trouble de coordination.</li><li><b>Exposition ou omission pertinente ?</b> Reconstituer chronologie et bénéfice/risque de l’ordonnance.</li><li><b>Indices d’autre cause ou de coexistence ?</b> Début antérieur, progression, signes non moteurs, tableau atypique, lésions concordantes.</li><li><b>Conclusion proportionnée ?</b> Hypothèse, examens utiles, plan thérapeutique et suivi mesurable, avec codage approprié.</li></ol><p>Parmi les urgences, différencier <button class="w" data-k="g21-nms">syndrome malin des neuroleptiques</button>, <button class="w" data-k="g21-catatonia">catatonie maligne</button> et <button class="w" data-k="g21-serotonin">toxicité sérotoninergique</button> peut être difficile. Le médicament, la chronologie et tout l’examen comptent ; un signe ou un dosage ne remplace pas l’enquête. Une infection du SNC ou un sepsis ne doivent pas être exclus par l’existence d’un neuroleptique dans le dossier.</p><p>Hors urgence, considérer maladie de Parkinson, autres maladies dégénératives, hydrocéphalie, trouble de marche frontal ou médullaire et maladies classées ailleurs. G21 n’est pas une catégorie qui absorbe tous ces diagnostics.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a>.</p><p><button class="w" data-k="g21-exp-10">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-10">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-11" ><h2>11. Prise en charge : la cause avant la surenchère symptomatique</h2><p><b>Parkinsonisme médicamenteux sans urgence.</b> <button class="w" data-k="g21-reduce">Réévaluer le médicament causal</button> : indication, dose minimale utile, réduction, retrait ou substitution coordonnés avec le prescripteur, particulièrement en psychiatrie. L’objectif inclut contrôle de la maladie traitée et fonction du patient ; il ne s’agit pas d’arrêter tous les traitements sans plan.</p><p>Un traitement symptomatique peut être discuté chez certains patients gênés. Les FI d’<button class="w" data-k="g21-akineton">Akineton</button> et de <button class="w" data-k="g21-amantadine">Symmetrel</button> précisent indications et risques ; l’autorisation ne signifie pas une preuve forte de bénéfice chez tous. Confusion, psychose, rétention urinaire, chutes et fonction rénale peuvent modifier le choix. <button class="w" data-k="g21-levodopa">Madopar</button> exclut le syndrome d’origine médicamenteuse dans sa FI suisse.</p><p><b>Syndrome malin suspecté.</b> Prise en charge urgente, arrêt des antagonistes dopaminergiques et des anticholinergiques selon BAP, soutien des fonctions vitales et surveillance des complications. Les options spécialisées, dont <button class="w" data-k="g21-bromocriptine">bromocriptine</button>, dépendent de gravité et de contexte, avec preuves limitées. Le schéma de Parkinson d’une FI ne devient pas une dose autorisée de SMN. Un état après sevrage dopaminergique pose une conduite spécifique de reprise évaluée.</p><p><b>Autres causes.</b> Cause vasculaire, toxique ou postencéphalitique : traiter la maladie identifiée et organiser l’avis adapté. Un essai dopaminergique peut être pertinent dans certains profils, sans bénéfice universel. Un antithrombotique ou une immunothérapie ne se déduit pas du seul code.</p><p><b>Fonction.</b> <button class="w" data-k="g21-rehab">Rééducation et adaptations</button> selon marche, équilibre, activités, parole et déglutition ; prévenir chutes et aspiration et soutenir l’entourage. Évaluer le résultat sur des objectifs concrets.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-RESPONSE — DAT, tableau 2 et discussion</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a>.</p><p><button class="w" data-k="g21-exp-11">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-11">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-12" ><h2>12. Prévention, suivi et pronostic : vérifier la trajectoire</h2><p>Le <button class="w" data-k="g21-follow">suivi</button> compare signes et fonction après toute adaptation : gestes utiles, marche, chutes, cognition, symptômes psychiatriques et tolérance. Une amélioration peut prendre des semaines ou mois ; persistance, progression ou réapparition réclame une nouvelle évaluation. Une récupération complète n’est pas garantie par la seule étiquette médicamenteuse.</p><p>Après syndrome malin, la reprise d’un antipsychotique se décide avec les équipes compétentes. BAP 2023 recommande d’attendre <b>au moins deux semaines après résolution</b>, puis faible dose, progression prudente et surveillance ; le support PHEL propose une fenêtre5–14 jours. Ces références ne deviennent pas un délai moyen ou un automatisme de reprise.</p><p>La <button class="w" data-k="g21-prevention">prévention</button> repose notamment sur indications médicamenteuses pertinentes, réévaluation des associations et repérage de nouveaux mouvements anormaux. Maintenir une transmission fiable des antiparkinsoniens lors des transitions de soins, avec une solution adaptée si déglutition impossible.</p><p>Les <button class="w" data-k="g21-elderly">personnes âgées</button>, les patients avec atteinte <button class="w" data-k="g21-renal">rénale</button> et les situations de <button class="w" data-k="g21-pregnancy">grossesse/allaitement</button> demandent une vérification propre au produit. Les formes et les bornes d’âge ne sont pas interchangeables entre médicaments.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-RECHALL — Recommandation finale et discussion de réintroduction</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-RECHALL — Réintroduction antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a>.</p><p><button class="w" data-k="g21-exp-12">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-12">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-13" ><h2>13. Points clés : une décision qui reste vérifiable</h2><ul><li>Le syndrome n’est pas synonyme de maladie de Parkinson idiopathique.</li><li>Bradykinésie, rigidité et tremblement demandent des tests différents ; tremblement et symétrie ne sont pas obligatoires.</li><li>G21 comprend le syndrome malin aigu et des causes chroniques distinctes.</li><li>Lire toute l’ordonnance et les omissions ; une cause médicamenteuse peut dévoiler une autre maladie.</li><li>Une IRM vasculaire ou un DAT anormal ne fournit pas seul toute l’étiologie.</li><li>Le traitement est causal, fonctionnel et individualisé ; la FI de Madopar exclut le parkinsonisme médicamenteux.</li><li>Une rigidité fébrile/confuse ne se traite pas par bipéridène automatique ; arrêter les anticholinergiques fait partie des recommandations SMN BAP.</li><li>Vérifier produit, âge, organes, dose par prise et intervalle.</li></ul><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a>.</p><p><button class="w" data-k="g21-exp-13">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-13">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-14" ><h2>14. Pièges : ne pas faire d’une ressemblance une équivalence</h2><p>Confondre lenteur et bradykinésie, posture et rigidité, symptôme médicamenteux et maladie dégénérative, ou image vasculaire et cause prouvée sont des raccourcis différents. La photo histologique d’un pigment ne mesure pas un récepteur dopaminergique et un dessin historique n’est pas un cas secondaire diagnostiqué.</p><p>Les erreurs de prescription comprennent donner100 mg d’amantadine deux fois/j à une personne âgée sans réévaluer son âge et son rein, assimiler125 mg de Madopar à 125 mg de lévodopa, casser une forme retard non divisible ou appliquer une dose Parkinson à un SMN. La fenêtre <button class="w" data-k="g21-calculation">calcul et formulation</button> explique les unités utiles.</p><p>Enfin, « arrêter le médicament causal » n’est pas une consigne identique dans le blocage dopaminergique et dans l’omission d’un traitement dopaminergique. L’urgence et l’indication guident les actions. Les cas et quiz sont fictifs et originaux, sans statut de questions fédérales officielles.</p><div class="trap"><b>Piège.</b> Toujours relier population, cause, produit, formulation et chronologie avant de conclure.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires, marche/équilibre, SSP système nerveux</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, examen CK et CS</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Description,origine,licence et original</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">IMG-GOWERS — Description,origine,licence et original</a>.</p><p><button class="w" data-k="g21-exp-14">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g21-14">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g21-entrainement" ><h2>S’entraîner : quatre décisions et quatre cas</h2><div class="quiz ui"><p>Le tremblement de repos est-il indispensable au syndrome parkinsonien ?</p><button data-ok="1">Non, une bradykinésie avec rigidité peut suffire.</button><button data-ok="0">Oui, il doit toujours être présent.</button><p class="fb" hidden>Le syndrome associe bradykinésie à rigidité et/ou tremblement de repos.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a>.</p><div class="quiz ui"><p>Une rigidité confuse et fébrile après neuroleptique peut-elle attendre le suivi habituel ?</p><button data-ok="1">Non, une évaluation urgente est nécessaire.</button><button data-ok="0">Oui, si aucun tremblement n’est observé.</button><p class="fb" hidden>Rechercher syndrome malin et autres urgences ; le tremblement ne décide pas du triage.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a>.</p><div class="quiz ui"><p>Les hypersignaux de substance blanche prouvent-ils seuls un parkinsonisme vasculaire ?</p><button data-ok="1">Non, il faut une concordance clinique et chronologique.</button><button data-ok="0">Oui, toute lésion de substance blanche suffit.</button><p class="fb" hidden>Les lésions peuvent coexister sans expliquer tout le tableau ; formes mixtes possibles.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a>.</p><div class="quiz ui"><p>Trois Madopar LIQ 125 contiennent combien de lévodopa ?</p><button data-ok="1">Trois cents milligrammes, avec soixante-quinze de bensérazide.</button><button data-ok="0">Trois cent soixante-quinze milligrammes de lévodopa.</button><p class="fb" hidden>Le nom125 additionne100 mg de lévodopa et 25 mg de bensérazide par unité.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p><p><button class="w" data-k="g21-cas-1">Cas 1</button> <button class="w" data-k="g21-cas-2">Cas 2</button> <button class="w" data-k="g21-cas-3">Cas 3</button> <button class="w" data-k="g21-cas-4">Cas 4</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires, marche/équilibre, SSP système nerveux</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, examen CK et CS</a>.</p></section>
</div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g21-e-triage" ><h2>Bilan urgent : rechercher les complications sans attendre un test unique</h2><p>Si syndrome malin ou autre défaillance suspecté, évaluer conscience, température, respiration, circulation et déglutition. Reprendre les agents donnés, leurs dernières doses et les omissions. L’association rigidité/confusion/température anormale sous médicament peut constituer une urgence avant que tous les signes ne soient présents.</p><p>CK, myoglobine, potassium, fonction rénale, autres ions et bilan acido-basique sont choisis selon tableau et ressources ; rechercher rhabdomyolyse, hyperkaliémie et insuffisance d’organe. La CK n’est pas un test spécifique de SMN et les intervalles du laboratoire doivent rester visibles. Une leucocytose n’identifie pas seule une infection ni ne l’exclut.</p><p>L’enquête infectieuse, neurologique ou toxique suit les signes. Ne pas attribuer automatiquement un coma ou une fièvre au neuroleptique, et ne pas retarder le soutien vital en attendant une classification. Une déglutition altérée peut aussi empêcher la prise habituelle d’un antiparkinsonien.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></section>
<section class="ilot" id="g21-e-imaging" ><h2>IRM et DAT-SPECT : structure et fonction présynaptique</h2><table class="t"><thead><tr><th>Examen</th><th>Question utile</th><th>Limites</th></tr></thead><tbody><tr><td>IRM cérébrale</td><td>Lésion stratégique, maladie des petits vaisseaux, hydrocéphalie ou autre cause structurale ?</td><td>Un hypersignal ne démontre pas seul une causalité vasculaire</td></tr><tr><td>DAT-SPECT</td><td>Existe-t-il un déficit présynaptique nigrostriatal dans un syndrome cliniquement incertain ?</td><td>Déficit pas synonyme de maladie de Parkinson idiopathique ; formes dégénératives, lésion focale et coexistences à discuter</td></tr><tr><td>Examen clinique répété</td><td>Le profil et la fonction changent-ils après adaptation du médicament ?</td><td>Ni symétrie ni asymétrie ne séparent toutes les causes</td></tr><tr><td>Biologie et fonction rénale</td><td>Y a-t-il complication ou risque d’accumulation d’un traitement ?</td><td>Choisir méthode et unités selon FI ; ne pas transférer aveuglément un DFGe dans une table de clairance</td></tr></tbody></table><p>La DGN 2023 recommande l’IRM précoce pour le diagnostic différentiel d’un syndrome parkinsonien. Le DAT-SPECT est proposé en situation cliniquement incertaine si son résultat a une conséquence. Ce raisonnement ne fait pas de ces examens une routine pour toute exposition médicamenteuse ou toute rigidité aiguë.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-IMG — Synthèse recommandations d’imagerie et diagnostique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a>.</p></section>
<section class="ilot" id="g21-e-interpretation" ><h2>Interpréter un résultat dans la trajectoire</h2><p>Un DAT préservé peut soutenir une perturbation surtout postsynaptique, mais ne résume pas toutes les causes de mouvements anormaux. Un déficit peut faire rechercher une atteinte présynaptique, dont une maladie dégénérative dévoilée par le médicament. Préparation et médicaments interférents relèvent de l’équipe de médecine nucléaire ; il ne faut pas arrêter soi-même toute l’ordonnance pour préparer l’examen.</p><p>Une IRM avec maladie vasculaire peut coexister avec une neurodégénérescence. Le consensus 2018 distingue formes postAVC, insidieuses et mixtes ; la concordance anatomoclinique est plus utile qu’une étiquette fondée sur l’âge. La réponse au traitement est suivie sur des objectifs, sans faire d’un essai unique une preuve définitive.</p><p>La réévaluation garde une place centrale après retrait ou réduction. Persistance ou progression ne doit pas être ignorée, et une amélioration initiale ne garantit pas l’absence d’une maladie concomitante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-RESPONSE — DAT, tableau 2 et discussion</a>.</p></section>
</div></div>

<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g21-tab-semio" role="tab" data-s="g21-s-semio" aria-controls="g21-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="g21-tab-anat" role="tab" data-s="g21-s-anat" aria-controls="g21-s-anat" aria-selected="false">Anatomie</button><button id="g21-tab-histo" role="tab" data-s="g21-s-histo" aria-controls="g21-s-histo" aria-selected="false">Histologie</button><button id="g21-tab-physio" role="tab" data-s="g21-s-physio" aria-controls="g21-s-physio" aria-selected="false">Physiologie</button><button id="g21-tab-bio" role="tab" data-s="g21-s-bio" aria-controls="g21-s-bio" aria-selected="false">Biochimie</button><button id="g21-tab-immuno" role="tab" data-s="g21-s-immuno" aria-controls="g21-s-immuno" aria-selected="false">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div class="sci" id="g21-s-semio" role="tabpanel" aria-labelledby="g21-tab-semio"><section class="ilot" id="g21-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Un mouvement volontaire normal mobilise des voies de commande, des boucles de régulation et une exécution musculaire. Les noyaux gris modulent le réseau moteur ; la voie corticospinale n’est pas identique à cette boucle. Vitesse, amplitude, précision, force et tonus correspondent à des dimensions différentes.</p><p>Le repère normal dépend de l’âge, de la tâche et de l’état antérieur. Une personne peut avoir une force préservée tout en exécutant des gestes trop lents ou d’amplitude décroissante. À l’inverse, une lenteur liée à douleur ou faiblesse n’est pas automatiquement une bradykinésie parkinsonienne. Une posture dessinée ne teste aucune de ces fonctions à elle seule.</p><figure data-g21-figure="posture"><div data-g21-frame="tall"><img src="assets/img/g21/alpha/codex/gowers.jpg" alt="Dessin historique de Gowers montrant de profil et de face une personne décrite avec maladie de Parkinson, référence sémiologique et non cas G21" loading="lazy"><span data-g21-mark="1" aria-hidden="true">1</span><span data-g21-mark="2" aria-hidden="true">2</span><span data-g21-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tronc représenté penché : attitude visible, pas mesure du tonus.</li><li>Membre supérieur représenté en flexion : le dessin ne teste ni rigidité ni vitesse.</li><li>Position des pieds sur une image statique : marche, équilibre et festination se testent en mouvement.</li></ol><p>Référence historique de maladie de Parkinson, pas parkinsonisme secondaire prouvé ni portrait universel. Une posture ne remplace pas la recherche de bradykinésie, la mobilisation passive ou l’histoire médicamenteuse.</p><p data-g21-credit>William Richard Gowers, dessin de 1886 publié dans A Manual of Diseases of the Nervous System ; reproduction historique · <a href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">IMG-GOWERS — Description,origine,licence et original</a>.</p></section>
<section class="ilot" id="g21-semio-signs" data-semiology="signs"><h3>Signes et symptômes : lenteur, résistance et oscillation</h3><p>La plainte peut être « fatigue », maladresse, difficulté à écrire, se boutonner ou marcher. L’examinateur recherche bradykinésie, rigidité et tremblement, puis traduit le retentissement sans remplacer les mots du patient. Le tremblement n’est pas nécessaire à tout syndrome parkinsonien.</p><p>La bradykinésie se teste par des gestes répétés ; la rigidité par mobilisation passive et relâchement ; le tremblement par observation au repos, en posture et en action. Dyskinésies bucco-linguo-faciales, akathisie ou dystonie peuvent accompagner une exposition médicamenteuse, mais ne deviennent pas toutes un même syndrome. Confusion, température ou dysautonomie changent encore la question.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a>.</p></section>
<section class="ilot" id="g21-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe : postsynaptique ne veut pas dire présynaptique</h3><p>Un antagonisme D2 striatal peut modifier la boucle indirecte et augmenter l’inhibition de la projection thalamocorticale dans le modèle simplifié de la revue 2012. Ce n’est pas un blocage du muscle et cela ne suppose pas obligatoirement une mort des neurones dopaminergiques. Une maladie sous-jacente peut néanmoins être dévoilée.</p><p>Une lésion vasculaire stratégique, une atteinte plus diffuse des voies ou un contexte postencéphalitique produisent d’autres mécanismes. Le syndrome malin met en jeu rigidité, thermorégulation et risque systémique ; il ne se réduit pas à un tremblement plus fort. Une cause par sevrage dopaminergique exige de reconstruire ce qui manque, pas seulement ce qui a été ajouté.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a>.</p></section>
<section class="ilot" id="g21-semio-examination" data-semiology="examination"><h3>Examen : observer, mobiliser et comparer</h3><p>Tester opposition pouce-index, ouverture-fermeture de main, pronosupination et mouvements du pied, avec comparaison de vitesse et amplitude pendant répétition. Examiner lever, marche, demi-tour et ballant des bras. Contrôler que douleur, faiblesse ou compréhension n’expliquent pas seules un résultat.</p><p>Pour la rigidité, mobiliser passivement un membre détendu. La résistance extrapyramidale est relativement indépendante de la vitesse ; le signe s’intègre au reste de l’examen. Chercher tonus spastique, réflexes, coordination, oculomotricité, cognition et signes associés. L’état général et les paramètres vitaux passent au premier plan si le patient se dégrade.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires, marche/équilibre, SSP système nerveux</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a>.</p></section>
<section class="ilot" id="g21-semio-interpretation" data-semiology="interpretation"><h3>Interprétation : une asymétrie ne ferme pas l’enquête</h3><p>Une origine médicamenteuse est souvent bilatérale et symétrique, mais une asymétrie et un tremblement de repos sont possibles. Les considérer comme une exclusion absolue serait une erreur. Le calendrier, les signes antérieurs et l’évolution après adaptation sont nécessaires.</p><p>Un DAT préservé peut soutenir une perturbation surtout postsynaptique, alors qu’un déficit oriente vers une atteinte présynaptique ; il ne donne pas seul tout le diagnostic. De même, une lésion vasculaire n’est pertinente que si elle s’accorde au tableau. Le diagnostic et le code suivent le niveau de preuve disponible et restent réévaluables.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a>.</p></section>
<section class="ilot" id="g21-semio-differentials" data-semiology="differentials"><h3>Différentiels : des ressemblances avec des conduites opposées</h3><p>Une lenteur peut être liée à douleur, faiblesse, dépression, atteinte cognitive ou trouble de coordination. Une maladie de Parkinson ou autre dégénérescence peut coexister avec un effet médicamenteux. Hydrocéphalie, myélopathie, trouble frontal et cause vasculaire font partie des alternatives selon profil.</p><p>Dans une dégradation aiguë, discuter syndrome malin, catatonie maligne, toxicité sérotoninergique, infection et autres défaillances. Après omission dopaminergique, une réaction semblable au syndrome malin peut apparaître ; l’action utile peut être une reprise évaluée plutôt qu’un arrêt de tous les antiparkinsoniens. L’urgence précède la recherche du libellé parfait.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></section>
<section class="ilot" id="g21-semio-urgency" data-semiology="urgency"><h3>Urgence : ne pas attendre la tétrade complète</h3><p>Confusion nouvelle, altération de conscience, rigidité importante, température anormale, dysautonomie ou défaillance respiratoire demandent une évaluation urgente dans le contexte médicamenteux. Des présentations atypiques avec peu ou pas d’hyperthermie sont décrites ; une température inférieure à 39°C n’est pas une garantie de sécurité.</p><p>Rechercher complications musculaires, rénales, électrolytiques, respiratoires et circulatoires. BAP recommande arrêt des antagonistes dopaminergiques et anticholinergiques dans le syndrome malin et soutien adapté. Le bipéridène ne se donne pas automatiquement devant toute rigidité : sa réduction de sudation peut gêner la perte de chaleur. Les options spécialisées dépendent de gravité et de diagnostic.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-LIMIT — Mesures pharmacologiques</a>.</p></section>
<section class="ilot" id="g21-semio-limits" data-semiology="limits"><h3>Limites : ce que ni l’image ni un test ne démontrent</h3><p>Le dessin historique ne montre pas le mouvement ; la coupe normale ne montre pas une lésion ; le pigment brun en H&E ne dose pas la dopamine ou l’occupation D2. L’image accompagne un raisonnement et garde sa provenance propre.</p><p>Les études de parkinsonisme médicamenteux et vasculaire sont hétérogènes, et les traitements du syndrome malin reposent souvent sur cas, séries et consensus. Une FI autorise un usage mais ne prouve pas un bénéfice chez chaque personne. La licence, le diagnostic, l’efficacité et le codage ne sont pas des synonymes. L’auto-relecture de ce cours ne constitue pas une validation humaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">IMG-GOWERS — Description,origine,licence et original</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Description,origine,licence et original</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a>.</p></section>
<section class="ilot" id="g21-semio-sources" data-semiology="sources"><h3>Sources lues : retrouver la version et la portée</h3><p>L’OFS donne la nomenclature ; HUG 2018 éclaire l’examen ; PHEL est réellement daté mai 2026 malgré son URL 2023. Les FI suisses précises définissent formes, doses et populations. DGN 2023 sert aux définitions et au diagnostic différentiel, sans transposition de tout son traitement de maladie de Parkinson.</p><p>BAP 2023, association britannique à auteurs internationaux, apporte des recommandations de syndrome malin avec niveaux de preuve limités. Les revues coréenne 2012 et vasculaire internationale 2018 sont utilisées avec leur ancienneté et leurs limites. Les liens suivants donnent accès aux sources, dont les passages ciblés et paraphrases sont documentés ; les textes complets restent hors Git.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-VERSION — Titre, conditions de diffusion et introduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a>.</p></section>
