<div class="sci" id="e01-s-semio" role="tabpanel" aria-labelledby="e01-tab-semio">
<section class="ilot" id="e01-semio-normal"><h3 data-semiology="normal">Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>L’examen thyroïdien sépare la structure de la fonction. Une glande de volume normal produit les hormones nécessaires sous le contrôle de la TSH. Une augmentation de volume peut, au contraire, rester euthyroïdienne. Le terme « goitre » décrit une structure ; il ne prouve ni carence iodée, ni hyperthyroïdie, ni cancer.</p><p>La thyroïde normale se situe devant et sur les côtés de la trachée. Elle accompagne la déglutition. Sa palpabilité dépend du sujet et de l’examinateur : le grade 0 de l’OMS signifie absence de goitre palpable, et non absence de tout tissu thyroïdien perceptible. Ce repère évite de qualifier de maladie toute glande que les doigts reconnaissent.</p><div class="key"><b>À retenir.</b> Le médecin décrit séparément volume, fonction et retentissement. Cette séparation guide les examens qui suivent.</div><figure><svg viewBox="0 0 600 150" role="img" aria-label="Structure et fonction sont distinctes" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><path d="M272 50h52m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Volume et symptômes</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">TSH et hormones libres</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="22">Structure et fonction sont distinctes</text></svg><figcaption>Figure 5 — Schéma de raisonnement, non anatomique : l’examen morphologique et le bilan fonctionnel sont confrontés, sans déduire l’un de l’autre. Sources : revue suisse 2020 et ETA 2023.</figcaption></figure></section>
<section class="ilot" id="e01-semio-signs"><h3 data-semiology="signs">Décrire le symptôme avant d’en chercher la cause</h3><p>Une tuméfaction peut être ancienne, lentement progressive ou récemment aggravée. Le patient précise son évolution, la gêne esthétique, la douleur et les changements de voix. La dysphagie correspond à une difficulté à avaler ; la dyspnée décrit une gêne respiratoire, parfois d’effort, positionnelle ou au repos. Un stridor est un bruit respiratoire évocateur d’une obstruction des voies aériennes supérieures ; il ne se confond pas avec tout sifflement attribué à l’asthme.</p><p>La fatigue, l’amaigrissement, les palpitations ou l’intolérance à la chaleur orientent vers une hyperfonction sans la démontrer. Chez le sujet âgé, apathie et décompensation cardiaque peuvent dominer. À l’inverse, l’absence de plainte hormonale n’exclut ni autonomie ni compression. Les fréquences de symptômes des goitres plongeants viennent de séries sélectionnées ; elles ne décrivent pas tous les goitres de médecine générale.</p><div class="key"><b>Science → clinique.</b> La chronologie et le retentissement discriminent mieux les situations qu’un seul adjectif comme « gros » ou « ancien ».</div></section>
<section class="ilot" id="e01-semio-mechanisms"><h3 data-semiology="mechanisms">Relier chaque manifestation à un mécanisme</h3><p>La carence limite la disponibilité du substrat iodé. La glande augmente sa captation et peut accroître sa masse tout en maintenant une fonction circulante normale. Des nodules hétérogènes apparaissent au cours de l’évolution ; certains deviennent autonomes. Une charge iodée peut alors augmenter la synthèse hormonale, ce qui explique un délai de plusieurs semaines entre contraste et symptômes.</p><p>La compression relève d’un autre mécanisme. Une masse dans le défilé thoracique réduit la place disponible pour la trachée, l’œsophage ou les veines. L’élévation des bras peut aggraver l’obstacle veineux et provoquer le <button class="w" data-k="e01-pemberton">signe de Pemberton (technique et limites)</button>. Une hémorragie intranodulaire peut augmenter rapidement le volume sans signifier à elle seule cancer.</p><div class="key"><b>À retenir.</b> La fonction hormonale et l’effet mécanique suivent des mécanismes distincts. Un dosage normal ne suffit donc pas à rassurer devant une gêne respiratoire.</div></section>
<section class="ilot" id="e01-semio-examination"><h3 data-semiology="examination">Conduire l’examen sans provoquer une décompensation</h3><p>Le médecin observe d’abord la respiration, la voix, la coloration et la tolérance de la position. Il relève les constantes et le rythme cardiaque. Chez un patient stable, il inspecte le cou en position normale, puis pendant la déglutition ; la palpation apprécie volume, nodularité, mobilité et douleur. La technique de terrain de l’OMS compare les lobes à la phalange distale du pouce du patient. Ce repère ne remplace pas une volumétrie échographique.</p><p>La recherche des ganglions complète l’examen. Un ganglion simplement palpable n’équivaut pas à une adénopathie suspecte : l’échographie caractérise les anomalies. La mobilisation des bras pour rechercher Pemberton est un geste d’examen chez le patient stable ; elle n’a pas de place comme épreuve prolongée devant une détresse. La manœuvre cesse si elle provoque une gêne.</p><p>Les grades 0 et 1 ont une reproductibilité limitée entre examinateurs. Le médecin documente donc ce qu’il a observé, puis confronte la clinique à l’échographie. Une masse peu visible peut s’étendre vers le médiastin, hors de portée des doigts.</p><div class="key"><b>Science → examen.</b> La palpation décrit le cou accessible ; l’imagerie en coupe répond à la question de l’extension profonde.</div></section>
<section class="ilot" id="e01-semio-interpretation"><h3 data-semiology="interpretation">Interpréter les associations de signes et d’examens</h3><p>Un goitre multinodulaire, une TSH basse et une zone hyperfixante évoquent une autonomie fonctionnelle. Une TSH normale n’en exclut pas une forme compensée, particulièrement dans un contexte de carence ancienne. À l’opposé, une TSH élevée avec thyroxine libre basse indique une hypothyroïdie primaire ; elle ne prouve pas que la cause est nutritionnelle.</p><p>Le risque tumoral se juge par l’échographie, la clinique et, lorsqu’elle est indiquée, la cytologie. Un nodule suspect peut coexister avec un goitre ancien. Le médecin ne choisit donc pas automatiquement le plus gros nodule pour la ponction. Une cytologie bénigne discordante avec une image très suspecte doit être réévaluée.</p><p>Chez une patiente fictive de 74 ans, la coexistence d’un goitre ancien, d’une dysphagie nouvelle et d’une TSH normale conduit d’abord à apprécier la compression et les nodules. Elle ne justifie ni une simple ordonnance d’iode ni une conclusion de bénignité globale.</p><div class="key"><b>À retenir.</b> Chaque résultat répond à une question précise. La convergence de plusieurs informations soutient le diagnostic ; leur discordance oblige à le reconsidérer.</div></section>
<section class="ilot" id="e01-semio-differentials"><h3 data-semiology="differentials">Distinguer les diagnostics concurrents</h3><p>La gravité hiérarchise les hypothèses. Une obstruction, une masse rapidement évolutive, une dysphonie ou des ganglions suspects imposent d’exclure une lésion menaçante, notamment tumorale. Une maladie de Basedow se distingue de l’autonomie nodulaire par son mécanisme auto-immun et les anticorps du récepteur de la TSH. Une thyroïdite peut produire un goitre et des anomalies fonctionnelles sans carence causale.</p><p>Une relation temporelle avec un contraste iodé étaye une dysfonction induite par l’iode, mais ne suffit pas à elle seule. L’examen, les anticorps et l’imagerie recherchent le terrain. Après injection récente, une faible captation scintigraphique peut refléter la surcharge et non une destruction glandulaire. La date des expositions fait donc partie de l’interprétation.</p><div class="key"><b>À retenir.</b> Le diagnostic carentiel reste une attribution causale argumentée. Il n’efface pas la recherche d’une autre maladie thyroïdienne concomitante.</div></section>
<section class="ilot" id="e01-semio-urgency"><h3 data-semiology="urgency">Reconnaître l’urgence clinique</h3><div class="alert"><b>Une détresse ne se mesure pas seulement en millimètres.</b> Un stridor nouveau, une gêne respiratoire rapidement croissante ou une décompensation cardiovasculaire impose une évaluation urgente. Les diamètres de 8 et 5 mm et l’obstruction de 75 % cités dans les séries ne sont pas des seuils permettant d’attendre.</div><p>L’équipe spécialisée sécurise les voies aériennes et stabilise le patient avant le traitement définitif. En cas d’hyperthyroïdie sévère après une charge iodée, la conduite est individualisée avec l’endocrinologue ; les risques cardiaques du sujet âgé modifient le niveau d’urgence. La divergence entre recommandation européenne et indication suisse du carbimazole doit être reconnue, sans retarder l’avis spécialisé.</p><div class="key"><b>Science → traitement.</b> La réduction progressive d’un volume par iode radioactif ne répond pas à une obstruction aiguë ; l’œdème post-thérapeutique peut même l’aggraver.</div></section>
<section class="ilot" id="e01-semio-limits"><h3 data-semiology="limits">Connaître les limites des mesures</h3><p>L’iodurie ponctuelle varie avec les apports récents et la dilution. La médiane d’un groupe convient à la surveillance nutritionnelle, pas au diagnostic certain de carence d’une personne. Les seuils de volume de 18 ml chez la femme et 25 ml chez l’homme sont ceux d’une étude danoise citée ; le contexte morphologique et la méthode doivent rester visibles.</p><p>La fréquence rapportée du signe de Pemberton, inférieure à 5 % dans la revue des goitres plongeants, n’est pas une sensibilité validée. Les taux de cancer des séries opérées sont également sélectionnés. Enfin, une classification cytologique donne un risque ; elle ne transforme pas une probabilité en diagnostic histologique.</p><div class="key"><b>À retenir.</b> Une limite explicite évite la fausse certitude. Elle indique quel examen ou quel avis peut réellement lever l’incertitude.</div></section>
<section class="ilot" id="e01-semio-sources"><h3 data-semiology="sources">Références de la démarche</h3><p>La démarche combine la revue suisse de 2020 sur les nodules, les recommandations ETA 2023 sur leur évaluation, ETA 2021 sur les produits de contraste, le guide OMS 2007 sur l’examen et les indicateurs nutritionnels, et la revue narrative d’Unlu de 2022 sur le goitre plongeant. Les sections correspondantes ont été lues. Les FI suisses déterminent séparément les indications et précautions des produits.</p><p><button class="w" data-k="e01-sources-guides">Sources et limites (liens des textes)</button> ; <button class="w" data-k="e01-palpation">Palpation (technique OMS)</button> ; <button class="w" data-k="e01-compression">Compression (données descriptives)</button>.</p><button class="pareto-btn ui" data-k="pareto-e01-semio">▲ Loi de Pareto — Sémiologie</button></section></div>
<div class="sci" id="e01-s-anat" hidden><section class="ilot" id="e01-s-anat-cours"><h2>Anatomie normale, extension et compression</h2><p>Les deux lobes thyroïdiens encadrent la trachée sous le larynx ; l’isthme les réunit en avant. Les parathyroïdes se situent principalement à la face postérieure. La figure originale permet d’abord de repérer la glande normale avant d’étudier une compression réelle.</p>
<figure><div style="position:relative;max-width:420px;margin:0 auto"><img loading="lazy" src="assets/img/e01/alpha/codex/e01-thyroide-normale-openstax2013.jpg" width="737" height="1410" alt="Thyroïde humaine normale : vues antérieure et postérieure, puis micrographie folliculaire ; repères 1 isthme, 2 parathyroïdes, 3 colloïde." style="display:block;width:100%;height:auto"><span role="img" aria-label="Repère 1 : isthme" style="position:absolute;left:47.5%;top:17%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">1</span><span role="img" aria-label="Repère 2 : parathyroïde" style="position:absolute;left:57%;top:50.9%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">2</span><span role="img" aria-label="Repère 3 : colloïde" style="position:absolute;left:49%;top:85%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">3</span></div><figcaption>Figure 2 — Normal avant pathologique. 1 : isthme ; 2 : région des parathyroïdes en vue postérieure ; 3 : colloïde folliculaire. Original OpenStax College, Connexions, 19 juin 2013 ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">version originale sur Commons</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. La micrographie est créditée à University of Michigan Medical School dans la figure source. Fichier original inchangé ; repères en surimpression ajoutés. La licence de cette version ne se déduit pas de celle du manuel actuel.</figcaption></figure>
<p>Le déplacement de la thyroïde à la déglutition aide à reconnaître son origine cervicale. Le développement inférieur d’un goitre profite des plans de moindre résistance ; la revue anatomochirurgicale décrit aussi les effets de la déglutition, de la pression inspiratoire et de la gravité. La plupart des goitres plongeants prolongent une glande cervicale ; les formes ectopiques primitives sont beaucoup plus rares.</p><p>Les rapports expliquent les symptômes. La trachée peut être déviée et comprimée, l’œsophage peut être gêné, et le retour veineux peut être entravé au défilé thoracique. Une dysphonie appelle l’examen de la mobilité laryngée selon le contexte, car une atteinte du nerf récurrent ou une autre lésion doit être recherchée. L’image suivante montre la dimension mécanique, sans prétendre identifier la cause iodée.</p>
<figure><div style="position:relative;max-width:760px;margin:0 auto"><img loading="lazy" src="assets/img/e01/alpha/codex/e01-goitre-compressif-original.jpg" width="699" height="697" alt="Scanner sagittal humain montrant un goitre compressif ; repère 1 sur la masse antérieure, repère 2 sur la lumière aérienne rétrécie, flèche rouge originale conservée." style="display:block;width:100%;height:auto"><span role="img" aria-label="Repère 1 : masse thyroïdienne antérieure" style="position:absolute;left:37%;top:48%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">1</span><span role="img" aria-label="Repère 2 : lumière aérienne au voisinage du rétrécissement" style="position:absolute;left:46%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">2</span></div><figcaption>Figure 3 — Compression trachéale sur scanner sagittal injecté. 1 : masse antérieure ; 2 : lumière aérienne au voisinage du rétrécissement. La flèche rouge est présente dans l’original. Stockholm, 18 août 2016, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Goitre_compressif_sur_la_trach%C3%A9e_(sagittal).jpg" target="_blank" rel="noopener">source Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Octets originaux conservés ; annotations en surimpression sous la même licence. Cette image ne prouve ni carence iodée ni grade de Huins.</figcaption></figure>
<p>La coupe sagittale montre une compression trachéale ; la flèche rouge appartient déjà à l’image publiée. Les repères numérotés sont des annotations en surimpression distinctes. Une seule coupe ne permet ni une volumétrie complète, ni une classification opératoire certaine, ni l’affirmation de bénignité.</p><p>La classification de Huins situe l’extension par rapport à la crosse aortique, au péricarde et à l’oreillette droite. Elle contribue à anticiper une éventuelle voie thoracique. L’équipe chirurgicale intègre aussi la forme, les rapports vasculaires et une suspicion de malignité. Les quelque 95 % de cervicotomies rapportées dans les séries ne dispensent pas de préparer un abord différent lorsqu’il est nécessaire.</p><div class="key"><b>Science → clinique.</b> Une masse médiastinale peut comprimer sans déformation cervicale majeure ; un cou peu augmenté n’exclut pas une maladie profonde.</div><div class="key"><b>Science → examen.</b> L’échographie décrit bien le cou mais explore mal la partie rétrosternale. Le scanner cervico-médiastinal précise les rapports utiles au traitement.</div><div class="key"><b>Science → traitement.</b> Une compression importante conduit à discuter une décompression adaptée. Le choix dépend du retentissement et du risque, pas d’un grade anatomique isolé.</div><p class="src">Sources : anatomie normale OpenStax, version originale 2013 de la figure ; Unlu et collaborateurs, 2022, définitions, symptômes et imagerie ; ETA 2023, imagerie en coupe et chirurgie. <button class="w" data-k="e01-huins">Huins (définition et limites)</button>.</p><button class="pareto-btn ui" data-k="pareto-e01-s-anat">▲ Loi de Pareto — Anatomie</button><div class="key"><b>À retenir.</b> Les rapports anatomiques expliquent la compression ; l’imagerie et la clinique déterminent ensemble la conduite.</div></section></div>
<div class="sci" id="e01-s-histo" hidden><section class="ilot" id="e01-s-histo-cours"><h2>Follicule normal, hyperplasie et limites de la cytologie</h2><p>Le follicule thyroïdien est une unité épithéliale entourant une cavité contenant la colloïde. Les cellules folliculaires produisent la thyroglobuline et assurent les étapes de synthèse hormonale. La colloïde constitue donc un compartiment fonctionnel, et pas seulement un matériau de remplissage. La vue microscopique normale de la figure anatomique précède ici une photographie de tissu hyperplasique humain.</p><p>La stimulation prolongée peut augmenter la masse glandulaire. Le goitre multinodulaire réunit des zones de comportement hétérogène ; la revue de Krohn décrit des processus clonaux et des mutations somatiques. Son résumé ne permet pas de détailler une séquence moléculaire unique. Tous les nodules ne suivent pas nécessairement le même mécanisme, et « néoplasique » au sens clonal ne signifie pas automatiquement « malin ».</p>
<figure><div style="position:relative;max-width:760px;margin:0 auto"><img loading="lazy" src="assets/img/e01/alpha/codex/e01-goitre-histologie-original.jpg" width="2048" height="1532" alt="Microphotographie humaine de tissu thyroïdien hyperplasique : follicules de tailles variables, colloïde rose et bordure épithéliale ; aucune fonction hormonale ne se déduit de cette seule coupe." style="display:block;width:100%;height:auto"><span role="img" aria-label="Repère 1 : colloïde dans un grand follicule" style="position:absolute;left:35%;top:29%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">1</span><span role="img" aria-label="Repère 2 : bordure épithéliale de ce follicule" style="position:absolute;left:27.2%;top:29%;transform:translate(-50%,-50%);background:#fff;color:#111;border:2px solid #111;border-radius:50%;width:1.6em;height:1.6em;line-height:1.4em;text-align:center;font-size:14px;font-weight:700">2</span></div><figcaption>Figure 4 — Tissu thyroïdien hyperplasique humain coloré à l’hématoxyline-éosine. 1 : colloïde ; 2 : bordure épithéliale. La notice décrit un nodule hyperplasique dans un goitre multinodulaire toxique ; la cause iodée n’y est pas démontrée. Mikael Häggström, 16 novembre 2023, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Histopathology_of_thyroid_hyperplasia_with_a_nodule.jpg" target="_blank" rel="noopener">source Commons</a>, <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a>. Photographie originale non recadrée ; repères en surimpression ajoutés, sans échelle métrique inventée.</figcaption></figure>
<p>La photographie montre des follicules de tailles variables contenant une colloïde rosée, bordés d’un épithélium. La notice de l’auteur décrit un nodule hyperplasique dans un goitre multinodulaire toxique. Cette information clinique accompagne l’image ; elle ne peut pas être déduite de la couleur de la coupe. La cause carentielle n’est pas démontrée par cette photographie.</p><p>La ponction prélève des cellules et de la colloïde. Elle peut reconnaître une présentation bénigne ou suspecte, mais ne montre pas toujours l’architecture d’ensemble. Dans les lésions folliculaires, la distinction entre adénome et carcinome peut exiger l’étude histologique d’une capsule et des vaisseaux. C’est pourquoi une catégorie cytologique indéterminée peut conduire à une chirurgie diagnostique.</p><p>Cette distinction explique également la discordance possible entre des cellules rassurantes et une échographie préoccupante. La qualité du prélèvement, le nodule effectivement ciblé et la concordance clinicoradiologique sont réévalués avant de conclure. Une grande thyroïde n’est ni une preuve de cancer, ni une protection contre un cancer concomitant.</p><div class="key"><b>Science → clinique.</b> Un goitre peut associer des nodules différents ; un résultat obtenu dans l’un d’eux ne décrit pas toute la glande.</div><div class="key"><b>Science → examen.</b> La cytologie décrit les cellules ; l’histologie peut apprécier l’invasion architecturale. L’équipe choisit l’examen selon la question non résolue.</div><div class="key"><b>Science → traitement.</b> Une intervention peut être proposée pour obtenir un diagnostic lorsqu’une lésion indéterminée ne se prête pas à une surveillance sûre.</div><p class="src">Sources : OpenStax §17.4 pour le follicule normal ; photographie originale de Mikael Häggström, notice Commons et licence CC0 ; Krohn 2005, résumé ; ETA 2023, cytologie ; consensus britannique de 2026, §4. <button class="w" data-k="e01-bethesda">Bethesda (interprétation)</button>.</p><button class="pareto-btn ui" data-k="pareto-e01-histo">▲ Loi de Pareto — Histologie</button><div class="key"><b>À retenir.</b> La structure folliculaire explique la fonction et les limites du prélèvement cytologique.</div></section></div>
<div class="sci" id="e01-s-physio" hidden><section class="ilot" id="e01-s-physio-cours"><h2>Régulation hormonale et adaptation à l’apport iodé</h2><p>La TSH stimule les cellules folliculaires. Les hormones thyroïdiennes circulantes participent à un rétrocontrôle négatif : une baisse hormonale stimule l’axe hypothalamo-hypophysaire, tandis qu’une hausse freine la sécrétion de TSH. Ce système régule la fonction ; il ne permet pas à lui seul de décrire le volume ou tous les nodules.</p><p>En carence légère à modérée, l’augmentation de l’activité thyroïdienne peut préserver l’euthyroïdie. La captation de l’iodure augmente et la production privilégie relativement la triiodothyronine. Le guide OMS souligne le chevauchement des concentrations hormonales entre populations carencées et suffisamment pourvues. Une TSH obligatoirement élevée serait donc une fausse règle ; une compensation peut maintenir une valeur normale.</p><p>Lorsque la carence est sévère, cette adaptation peut ne plus suffire. Une hypothyroïdie devient possible malgré l’augmentation de l’activité et du volume. Sur le long terme, l’hétérogénéité nodulaire peut s’accompagner d’autonomie : certaines zones échappent au contrôle habituel. Une TSH basse révèle alors le retentissement fonctionnel, mais une autonomie peut précéder sa suppression.</p><p>Le tableau distingue les réponses à une surcharge iodée. La même exposition n’a pas le même effet sur toutes les glandes.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">État de la glande</th><th style="min-width:10em">Réponse possible</th><th style="min-width:10em">Conséquence pratique</th></tr></thead><tbody><tr><td style="min-width:10em">Régulation conservée</td><td style="min-width:10em">Freinage transitoire de l’organification, puis échappement</td><td style="min-width:10em">Les variations biologiques peuvent rester dans les intervalles usuels.</td></tr><tr><td style="min-width:10em">Échappement insuffisant</td><td style="min-width:10em">Hypothyroïdie, notamment sur terrain auto-immun ou glande immature</td><td style="min-width:10em">La clinique et la fonction sont réévaluées dans les situations à risque.</td></tr><tr><td style="min-width:10em">Autonomie nodulaire</td><td style="min-width:10em">Production hormonale excessive après surcharge</td><td style="min-width:10em">Le risque cardiovasculaire détermine l’intensité du suivi et du traitement.</td></tr></tbody></table><p>L’effet Wolff-Chaikoff et le phénomène de Jod-Basedow ne sont donc pas deux étapes obligatoires chez le même patient. Ils décrivent des réponses différentes. Une maladie de Basedow latente est un autre terrain à risque, avec stimulation par des anticorps et non autonomie nodulaire identique.</p><div class="key"><b>Science → clinique.</b> Un goitre ancien silencieux peut devenir hyperfonctionnel après une charge iodée.</div><div class="key"><b>Science → examen.</b> La TSH et les hormones libres caractérisent le retentissement actuel ; la scintigraphie étudie la distribution fonctionnelle lorsque son indication est retenue.</div><div class="key"><b>Science → traitement.</b> Ajouter de la lévothyroxine à une autonomie méconnue augmente l’exposition hormonale. L’évaluation fonctionnelle précède donc une prescription à visée thyroïdienne.</div><p class="src">Sources : OMS 2007, §4.4 ; Zimmermann et Boelaert 2015, résumé ; ETA 2021, mécanismes et recommandations ; ETA 2023, scintigraphie ; FI suisse Euthyrox. <button class="w" data-k="e01-wolff">Réponses à l’iode (mécanismes)</button>.</p><button class="pareto-btn ui" data-k="pareto-e01-s-physio">▲ Loi de Pareto — Physiologie</button><figure><svg viewBox="0 0 600 150" role="img" aria-label="Le rétrocontrôle relie les deux mesures" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><path d="M272 50h52m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">TSH stimule la glande</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Hormones freinent la TSH</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="22">Le rétrocontrôle relie les deux mesures</text></svg><figcaption>Figure 6 — Relation physiologique simplifiée ; elle ne représente pas une anatomie. Une autonomie peut dissocier la production nodulaire du contrôle habituel. Sources : OpenStax §17.4 et ETA 2021.</figcaption></figure><div class="key"><b>À retenir.</b> Une fonction normale peut coexister avec une carence ou une autonomie compensée ; le terrain détermine la réponse à l’iode.</div></section></div>
<div class="sci" id="e01-s-bioch" hidden><section class="ilot" id="e01-s-bioch-cours"><h2>Du substrat iodé aux cibles thérapeutiques</h2><p>Le thyrocyte capte l’iodure circulant par transport actif. À proximité de la colloïde, son oxydation et son incorporation aux résidus tyrosine de la thyroglobuline participent à la synthèse hormonale. La <button class="w" data-k="e01-thyroperoxydase">thyroperoxydase (enzyme et cible pharmacologique)</button> intervient dans l’organification et le couplage. La triiodothyronine contient trois atomes d’iode ; la thyroxine en contient quatre.</p><p>Les hormones restent associées à la thyroglobuline dans la colloïde jusqu’à leur libération après reprise et dégradation intracellulaire de cette protéine. Dans le sang, la majorité est liée à des protéines de transport ; la fraction libre participe à la disponibilité tissulaire. La conversion périphérique de thyroxine en triiodothyronine explique qu’une partie de l’hormone active ne provienne pas directement de la sécrétion thyroïdienne.</p><p>Le carbimazole est transformé en thiamazole et freine la synthèse hormonale. Cette cible biochimique ne suffit pas à autoriser tous les usages : la FI de Néo-Mercazole exclut l’hyperthyroïdie induite par l’iode de ses indications. La recommandation européenne et le texte suisse doivent donc rester distincts lorsque l’endocrinologue choisit un traitement d’exception.</p><p>Les unités permettent d’éviter une confusion de dose. Le tableau compare des quantités de nature différente, sans les rendre pharmacologiquement équivalentes.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Exposition</th><th style="min-width:10em">Grandeur</th><th style="min-width:10em">Interprétation</th></tr></thead><tbody><tr><td style="min-width:10em">Apport nutritionnel adulte de référence</td><td style="min-width:10em">150 µg d’iode par jour</td><td style="min-width:10em">Le total inclut les aliments.</td></tr><tr><td style="min-width:10em">Contraste, exemple de 60–150 ml à 300 mg d’iode/ml</td><td style="min-width:10em">18–45 g d’iode chimiquement lié</td><td style="min-width:10em">La quantité totale n’est pas celle de l’iodure libre disponible.</td></tr><tr><td style="min-width:10em">Comprimé nucléaire Axapharm</td><td style="min-width:10em">65 mg d’iodure de potassium</td><td style="min-width:10em">La masse concerne le sel pharmaceutique, pas un complément nutritionnel.</td></tr><tr><td style="min-width:10em">Traitement par iode 131</td><td style="min-width:10em">Activité en MBq ; dose absorbée en Gy</td><td style="min-width:10em">L’activité mesure les désintégrations, la dose l’énergie absorbée par le tissu.</td></tr></tbody></table><p>Le calcul 18 g ÷ 150 µg donne 120 000 ; avec 45 g, il donne 300 000. Ce rapport compare seulement des masses d’iode. Il n’est ni un facteur de risque clinique, ni une équivalence de biodisponibilité. La rétention thyroïdienne et l’élimination rénale déterminent une part du retentissement.</p><p>La thyroglobuline sanguine reflète aussi la masse et la stimulation glandulaires ; elle ne devient pas pour autant un marqueur de malignité d’un nodule. L’iodurie renseigne sur des apports récents, tandis que des indicateurs comme la thyroglobuline répondent sur une durée différente. Les deux demandent une population, une méthode et une question clinique définies.</p><div class="key"><b>Science → clinique.</b> Une surcharge peut modifier la synthèse hormonale longtemps après l’examen radiologique.</div><div class="key"><b>Science → examen.</b> Une captation isotopique basse après contraste est interprétée avec la date d’exposition ; elle ne prouve pas seule une thyroïdite destructive.</div><div class="key"><b>Science → traitement.</b> La dosimétrie de l’iode 131 tient compte du volume, de la fixation et de la rétention. Une activité fixe étrangère n’est pas une prescription suisse universelle.</div><p class="src">Sources : OpenStax §17.4, synthèse normale ; OMS 2007 ; ETA 2021 ; FI suisses Néo-Mercazole, iodure de potassium et I-131 Curium ; OFSP 2025, §1.1 et tableau 2.2.7.</p><button class="pareto-btn ui" data-k="pareto-e01-s-bioch">▲ Loi de Pareto — Biochimie</button><figure><svg viewBox="0 0 600 150" role="img" aria-label="Une cible biochimique ne vaut pas indication" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><path d="M272 50h52m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Iodure et thyroglobuline</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Synthèse des hormones</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="22">Une cible biochimique ne vaut pas indication</text></svg><figcaption>Figure 7 — Schéma logique des substrats de synthèse. Le carbimazole freine des étapes enzymatiques ; la FI suisse fixe séparément les indications. Sources : OpenStax §17.4 et FI Néo-Mercazole.</figcaption></figure><div class="key"><b>À retenir.</b> La synthèse, la disponibilité hormonale et les unités de dose doivent rester distinctes pour interpréter examens et traitements.</div></section></div>
<div class="sci" id="e01-s-sante" hidden><section class="ilot" id="e01-s-sante-cours"><h2>Prévention iodée et surveillance de la population</h2><p>L’iodation du sel a profondément modifié l’histoire du goitre en Suisse. La teneur est passée de 3,75 mg d’iode par kilogramme en 1922 à 25 mg/kg depuis 2014. La synthèse de Bürgi publiée en 1990 décrit une régression rapide chez les plus jeunes, plus lente ou incomplète chez l’adulte âgé. Ces observations historiques expliquent une partie des goitres anciens, sans démontrer leur cause chez chaque patient actuel.</p><p>La prévention cherche un apport suffisant sans augmenter la consommation de sel. L’OSAV recommande de privilégier le sel iodé utilisé avec modération et de tenir compte des aliments transformés. Les substitutions alimentaires, notamment certains produits végétaux remplaçant les laitages, peuvent modifier l’apport. Une médiane nationale adéquate ne dispense pas d’interroger l’alimentation individuelle.</p><p>Les résultats suisses ci-dessous portent sur la nutrition, pas sur la prévalence des goitres. Les groupes et les années sont indispensables pour leur interprétation.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Enquête 2020–2022</th><th style="min-width:10em">Iodurie médiane</th><th style="min-width:10em">Lecture collective</th></tr></thead><tbody><tr><td style="min-width:10em">362 enfants de 6–12 ans</td><td style="min-width:10em">127 µg/l</td><td style="min-width:10em">Apport adéquat selon le seuil OMS de ce groupe</td></tr><tr><td style="min-width:10em">473 femmes enceintes</td><td style="min-width:10em">97 µg/l</td><td style="min-width:10em">Apport insuffisant au regard du seuil de 150 µg/l</td></tr><tr><td style="min-width:10em">Femmes enceintes avec ou sans supplément</td><td style="min-width:10em">129 contre 81 µg/l</td><td style="min-width:10em">Association observée ; aucune randomisation de supplémentation</td></tr></tbody></table><p>Les 47 % d’utilisatrices prenaient des compléments apportant 150–220 µg par jour. Ce fait observé ne définit pas une dose prescrite à toutes les femmes. L’OSAV recommande de discuter un complément pendant la grossesse et de poursuivre durant l’allaitement celui qui a été commencé. Le repère de 250 µg par jour représente l’apport total ; la page suisse sur l’allaitement reconnaît une base scientifique limitée et décrit une petite étude de 17 mères.</p><p>L’effet collectif de l’iodation se juge aussi sur la durée. Une hausse transitoire d’hyperthyroïdie peut survenir dans une population porteuse d’autonomie nodulaire ; à plus long terme, une nutrition suffisante réduit la stimulation chronique. Au Danemark avant l’iodation, les incidences d’hyperthyroïdie franche différaient entre Aalborg et Copenhague : 92,9 contre 65,4 pour 100 000 personnes par an. Ce contraste écologique n’est pas une formule de risque individuel pour la Suisse.</p><div class="key"><b>Science → clinique.</b> L’âge et l’alimentation orientent les questions ; ils ne remplacent pas l’examen ni l’évaluation fonctionnelle.</div><div class="key"><b>Science → examen.</b> La médiane d’iodurie suit les programmes de prévention. Une valeur ponctuelle ne suffit pas à attribuer un goitre à une carence.</div><div class="key"><b>Science → traitement.</b> La correction nutritionnelle et le traitement d’une autonomie sont deux décisions différentes. Les comprimés nucléaires ne remplacent jamais le sel iodé alimentaire.</div><p class="src">Sources : OSAV, sel iodé et allaitement ; Fischer et collaborateurs 2024, enquête suisse ; Bürgi 1990 et Bülow Pedersen 2002, résumés ; OMS 2007. <button class="w" data-k="e01-etude2020">Étude suisse (effectifs et limites)</button>.</p><button class="pareto-btn ui" data-k="pareto-e01-s-sante">▲ Loi de Pareto — Santé publique</button><figure><svg viewBox="0 0 600 150" role="img" aria-label="La médiane décrit le groupe étudié" style="width:100%;height:auto"><rect x="10" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><rect x="330" y="15" width="260" height="70" rx="8" fill="#f3f6f7" stroke="#222"/><path d="M272 50h52m-10-7 10 7-10 7" fill="none" stroke="#222" stroke-width="2"/><text x="140" y="53" text-anchor="middle" fill="#111" font-size="22">Apports de la population</text><text x="460" y="53" text-anchor="middle" fill="#111" font-size="22">Médiane d’iodurie</text><text x="300" y="125" text-anchor="middle" fill="#111" font-size="22">La médiane décrit le groupe étudié</text></svg><figcaption>Figure 8 — Chaîne d’évaluation de santé publique, sans représentation anatomique. La mesure collective ne permet pas de diagnostiquer chaque individu. Sources : OMS 2007 et enquête suisse 2024.</figcaption></figure><div class="key"><b>À retenir.</b> Le programme collectif prévient la carence, tandis que l’alimentation et la fonction sont évaluées individuellement.</div></section></div>
