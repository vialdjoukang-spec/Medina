<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e01-p-1"><h2><span class="n">p-1</span>Choisir selon la fonction et l’objectif</h2><p>La correction d’un apport insuffisant, le remplacement d’une hormone manquante et la réduction d’une masse sont trois objectifs distincts. Un goitre euthyroïdien n’appelle pas automatiquement une prescription hormonale. Une autonomie peut rendre une surcharge iodée dangereuse ; une compression peut imposer une solution mécanique.</p><p>Le tableau situe les moyens disponibles. Le choix tient compte de la fonction, du risque tumoral, du volume, des symptômes et des préférences du patient.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Objectif</th><th style="min-width:10em">Moyen et place</th><th style="min-width:10em">Limite déterminante</th></tr></thead><tbody><tr><td style="min-width:10em">Prévenir la carence</td><td style="min-width:10em">Sel iodé avec modération ; alimentation adaptée ; complément discuté pendant la grossesse</td><td style="min-width:10em">Le repère de 250 µg/jour pendant grossesse et allaitement est un apport total, pas une dose automatique de comprimé.</td></tr><tr><td style="min-width:10em">Corriger une hypothyroïdie acquise documentée</td><td style="min-width:10em">Lévothyroxine orale, avec titration biologique</td><td style="min-width:10em">Le traitement remplace un déficit ; il ne vise pas à supprimer la TSH d’un nodule euthyroïdien.</td></tr><tr><td style="min-width:10em">Réduire un goitre bénin symptomatique</td><td style="min-width:10em">Chirurgie, iode 131 ou technique mini-invasive selon le phénotype</td><td style="min-width:10em">La compression, la déglutition, la grossesse et la captation conditionnent les options.</td></tr><tr><td style="min-width:10em">Contrôler une hyperthyroïdie autonome</td><td style="min-width:10em">Traitement spécialisé, antithyroïdien dans ses indications puis stratégie définitive adaptée</td><td style="min-width:10em">L’hyperthyroïdie induite par l’iode est exclue des indications de Néo-Mercazole ; la divergence avec ETA doit être explicitée.</td></tr><tr><td style="min-width:10em">Prévenir l’incorporation d’iode radioactif lors d’un accident nucléaire</td><td style="min-width:10em">Iodure de potassium 65 mg sur instruction des autorités</td><td style="min-width:10em">Ce produit n’est pas un traitement du goitre ni un complément nutritionnel.</td></tr></tbody></table><p>L’iode nutritionnel et l’iode radioactif ne sont pas interchangeables. La radioactivité permet une irradiation ciblée du tissu qui fixe l’iodure ; l’apport nutritionnel cherche simplement à couvrir les besoins. Les comprimés nucléaires répondent encore à une autre indication.</p><div class="key"><b>À retenir.</b> La prescription commence par la question à résoudre. Le volume ne suffit pas à choisir une molécule.</div></section>
<section class="ilot" id="e01-p-2"><h2><span class="n">p-2</span>Lévothyroxine : remplacement et indication de goitre</h2><p>La <button class="w" data-k="e01-levothyroxine">lévothyroxine (FI suisse et divergence avec les recommandations)</button> apporte une hormone déjà formée. Dans une hypothyroïdie acquise attribuable à la carence, elle peut être nécessaire pour rétablir la fonction. La cause nutritionnelle et le traitement hormonal sont évalués ensemble.</p><p>La FI suisse d’Euthyrox, datée de février 2023, conserve une indication de goitre bénin euthyroïdien et de prévention de récidive après résection. ETA 2023 déconseille cependant le traitement hormonal des nodules euthyroïdiens en routine, en raison d’un bénéfice insuffisant et des risques liés à la suppression hormonale. Il ne s’agit pas de choisir le document dont la date est la plus récente : l’autorisation et la recommandation répondent à deux questions différentes.</p><p>Le tableau reprend les doses de la FI dans leur indication exacte. La dose d’entretien n’est pas une cible identique pour tous.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Situation</th><th style="min-width:10em">Dose orale selon FI</th><th style="min-width:10em">Titration et durée</th></tr></thead><tbody><tr><td style="min-width:10em">Hypothyroïdie adulte</td><td style="min-width:10em">Début habituel 25–50 µg une fois par jour ; entretien souvent 100–200 µg/jour</td><td style="min-width:10em">Augmentation de 25–50 µg toutes les deux à quatre semaines selon la situation et les contrôles ; durée liée à la cause.</td></tr><tr><td style="min-width:10em">Personne âgée, hypothyroïdie sévère ou contexte à risque</td><td style="min-width:10em">Début prudent, notamment 25 µg/jour selon FI</td><td style="min-width:10em">Augmentation plus lente et surveillance clinique, cardiaque et biologique.</td></tr><tr><td style="min-width:10em">Goitre bénin euthyroïdien ou prévention de récidive</td><td style="min-width:10em">75–200 µg/jour dans l’autorisation suisse</td><td style="min-width:10em">Des mois ou années sont mentionnés ; cette indication n’est pas proposée en routine pour les nodules euthyroïdiens selon ETA.</td></tr></tbody></table><p>Le comprimé se prend à jeun, avec de l’eau, au moins trente minutes avant le petit-déjeuner. La dose est individualisée ; une fourchette d’entretien n’est pas une dose maximale universelle. Les données pharmacocinétiques rénales ou hépatiques ne permettent pas de fixer ici un pourcentage automatique d’ajustement.</p><p>L’essai allemand LISA de 2011 comparait placebo, iode, lévothyroxine et association pendant un an. La réduction nodulaire relative au placebo était de 17,3 % avec l’association, contre 7,3 % avec lévothyroxine seule et 4,0 % avec iode seul, sans différence significative pour ces deux monothérapies. Le texte intégral rapporte 1020 patients randomisés et 794 dans l’analyse principale après exclusions ; son résumé annonce 1024 participants. L’essai excluait notamment l’autonomie connue, la grossesse et une maladie coronarienne symptomatique. Un résultat volumétrique de ce groupe ne prouve donc pas un bénéfice clinique chez notre patiente âgée à goitre ancien.</p><div class="alert"><b>Avant et pendant le traitement.</b> Une hyperthyroïdie ou une autonomie doit être recherchée avant Euthyrox. Une insuffisance surrénalienne non traitée est une contre-indication. Une douleur thoracique, des palpitations ou une tachycardie nouvelle imposent une réévaluation de la tolérance et de la dose.</div><p>Le fer, le calcium et certains antiacides réduisent l’absorption ; Euthyrox est pris au moins deux heures avant selon sa FI. L’intervalle est de quatre à cinq heures avec les résines échangeuses d’ions. Les inhibiteurs de la pompe à protons peuvent modifier l’absorption, et les anticoagulants coumariniques nécessitent une surveillance de leur effet. La biotine peut perturber certains dosages : le laboratoire doit connaître sa prise. Les hormones nécessaires sont poursuivies pendant la grossesse et l’allaitement, avec adaptation et contrôles.</p><div class="key"><b>À retenir.</b> La substitution d’un déficit documenté et la suppression de TSH d’un nodule euthyroïdien sont des stratégies différentes. LISA ne supprime pas cette distinction.</div></section>
<section class="ilot" id="e01-p-3"><h2><span class="n">p-3</span>Antithyroïdiens : indication suisse et hyperthyroïdie iodée</h2><p>Le <button class="w" data-k="e01-ats">carbimazole (indications, doses et surveillance suisses)</button> est un précurseur du thiamazole, qui inhibe des étapes de la synthèse hormonale. La FI de Néo-Mercazole, août 2020, mentionne notamment la maladie de Basedow et la préparation d’un nodule toxique ou d’un goitre multinodulaire à une thyroïdectomie. Elle ne décrit pas une guérison de l’autonomie par une cure médicamenteuse seule.</p><div class="alert"><b>Divergence décisive.</b> La FI exclut l’hyperthyroïdie induite par l’iode de ses indications. Elle contre-indique aussi le goitre simple et les signes de compression trachéale. Les recommandations ETA 2021 sur l’hyperthyroïdie iodée ne doivent donc pas être présentées comme une indication suisse autorisée de Néo-Mercazole.</div><p>Dans une indication effectivement retenue selon la FI, les comprimés à 5 mg sont administrés par voie orale. Chez l’adulte, la dose initiale est de 20–60 mg/jour en deux ou trois prises, habituellement pendant quinze à trente jours. La réduction se fait ensuite par étapes de 5–15 mg/jour environ tous les dix jours, jusqu’à une dose d’entretien de 5–20 mg/jour. La durée de six à dix-huit mois citée par la FI ne constitue pas une durée curative universelle du goitre autonome. Le suivi biologique et clinique guide la décision spécialisée.</p><p>La FI ne donne pas un ajustement rénal numérique validé ; la prudence et la surveillance sont nécessaires. Une atteinte hépatique légère à modérée requiert aussi de la prudence ; l’insuffisance sévère de classe Child C est contre-indiquée. Chez la personne âgée, le risque d’accident hématologique grave doit être particulièrement pris en compte.</p><p>La formule sanguine est contrôlée avant traitement. La FI prévoit un contrôle hebdomadaire pendant les six premières semaines chez les patients de plus de 40 ans. Une fièvre, une angine, des ulcérations buccales ou des signes infectieux imposent l’arrêt et une numération urgente pour rechercher une agranulocytose. Des signes hépatiques ou une pancréatite imposent également l’arrêt et l’évaluation ; une pancréatite antérieure liée au carbimazole ou au thiamazole contre-indique la réexposition.</p><p>Le contexte thyroïdien et le traitement peuvent modifier l’effet des anticoagulants, de la digoxine ou des bêtabloquants. La grossesse exige une stratégie spécialisée en raison des risques malformatifs et de l’hypothyroïdie fœtale ; la plus faible dose efficace est recherchée, sans association bloquante avec lévothyroxine. La FI recommande d’éviter l’allaitement, surtout à forte dose. Si la mère choisit de poursuivre après information, elle décrit un maximum de 20 mg/jour, des prises après les tétées et une surveillance de l’enfant.</p><p>Pour l’hyperthyroïdie après contraste, ETA recommande une conduite selon gravité, âge et comorbidités : suivi rapproché dans les formes légères, traitement spécialisé dans les formes sévères et chez les personnes âgées vulnérables. Un antithyroïdien, parfois associé au perchlorate, peut être discuté par l’endocrinologue. Aucune FI suisse du perchlorate n’a été identifiée dans cette recherche ; aucune dose correspondante n’est inventée. Cette limite conduit à une décision documentée du spécialiste et du pharmacien, et non à l’absence de prise en charge.</p><div class="key"><b>À retenir.</b> Une recommandation internationale peut discuter un usage qui n’est pas couvert par la FI du produit suisse choisi. La divergence doit être connue avant de prescrire.</div></section>
<section class="ilot" id="e01-p-4"><h2><span class="n">p-4</span>Iode 131, dosimétrie et radioprotection suisses</h2><p>L’<button class="w" data-k="e01-iode131">iode 131 (indications, activité et précautions)</button> est fixé par la thyroïde et délivre une irradiation au tissu. La FI suisse de l’iodure de sodium I-131 Curium, juillet 2022, inclut notamment l’autonomie et le goitre euthyroïdien. Le traitement est réservé à une unité autorisée de médecine nucléaire.</p><p>L’activité administrée est individualisée selon le diagnostic, le volume, la fixation et la rétention. Une capsule est une forme orale ; sa gamme d’activité de fabrication n’est pas une dose standard de traitement. Les exemples d’activités fixes de la littérature européenne ne remplacent pas la dosimétrie suisse. Une insuffisance rénale modifie l’élimination et exige une appréciation spécialisée, sans pourcentage d’ajustement universel.</p><p>La grossesse et l’allaitement sont contre-indiqués. Selon la FI, l’allaitement est arrêté au moins huit semaines avant et n’est pas repris pour le même enfant. La grossesse est exclue avant traitement et la contraception est maintenue au moins six mois après un traitement bénin. Une dysphagie ou une anomalie œsophagienne peut contre-indiquer la capsule : ce point compte chez le patient compressif. Une inflammation ou un œdème post-thérapeutique peut aggraver une sténose trachéale préalable.</p><p>Les médicaments et produits iodés modifient la fixation. La FI mentionne notamment six à huit semaines après un contraste hydrosoluble et des délais plus longs après certains produits liposolubles ou l’amiodarone. Elle donne deux jours dans une section et trois jours dans une autre pour l’arrêt du carbimazole ; le centre définit donc son protocole explicite. Le patient ne suspend pas seul ses traitements.</p><p>En Suisse, la directive OFSP du 24 juin 2025 exige une dosimétrie documentée. Pour l’iode 131, l’hospitalisation est requise dès 200 MBq, avec une durée minimale de 48 heures et un débit de dose de sortie inférieur à 10 µSv/h à un mètre. Une dérogation ambulatoire entre 200 et 400 MBq nécessite l’accord préalable de l’OFSP ; fractionner pour éviter l’hospitalisation est interdit. Le patient reçoit des consignes orales et écrites adaptées à son entourage.</p><p>ETA rapporte une réduction typique d’environ 40 % du volume à douze mois pour le goitre multinodulaire bénin traité, et une hypothyroïdie chez 10–20 % à dix ans. Le suivi fonctionnel est donc prolongé à vie. Une faible captation ou une compression marquée peut modifier la stratégie et conduire à préférer une autre option.</p><p>La préstimulation par <button class="w" data-k="e01-rhtsh">thyrotropine alpha (bénéfices étudiés et hors indication)</button> peut augmenter la réduction volumétrique, mais Thyrogen n’est pas autorisé en Suisse pour cette indication bénigne. Dans la revue Cochrane 2021 de six essais et 321 participants, l’hypothyroïdie atteignait 32,5 % avec préstimulation contre 12,1 % sans, avec un risque relatif de 2,53. La différence de réduction volumétrique était de 11,9 points de pourcentage ; les données de qualité de vie restaient incertaines. Ces résultats ne justifient pas une prescription systématique.</p><div class="key"><b>À retenir.</b> L’activité en MBq, la dose absorbée en Gy et le débit de dose en µSv/h décrivent trois grandeurs différentes. Aucune ne remplace à elle seule la décision clinique.</div></section>
<section class="ilot" id="e01-p-5"><h2><span class="n">p-5</span>Prévenir les erreurs de prescription</h2><div class="alert"><b>Situations à risque.</b> Une surcharge par contraste, amiodarone ou complément peut décompenser une autonomie. Un produit destiné à la prophylaxie nucléaire ne corrige pas un goitre. Un traitement par iode 131 ne répond pas à une obstruction aiguë et peut augmenter transitoirement le volume.</div><p>Le médecin vérifie la fonction thyroïdienne avant un traitement spécifique et recherche les expositions iodées. Il évite la lévothyroxine suppressive en routine chez le patient euthyroïdien et les suppléments d’iode ou de sélénium sans déficit. Une hyperthyroïdie franche conduit à chercher une alternative au contraste iodé ; en urgence sans alternative adéquate, la décision est organisée avec les spécialistes sans retarder un examen vital.</p><p>Les comprimés d’<button class="w" data-k="e01-ki65">iodure de potassium Axapharm 65 mg (indication nucléaire)</button> sont administrés selon les autorités lors d’un accident nucléaire. Leur FI contre-indique notamment hyperthyroïdie, Basedow et autonomie. Les risques fœtaux et néonataux d’un excès pharmacologique ne signifient pas qu’un apport alimentaire adapté serait dangereux : la dose et l’indication doivent rester explicites.</p><p class="src">Sources professionnelles lues : Euthyrox (février 2023), Néo-Mercazole (août 2020), I-131 Curium (juillet 2022), Thyrogen (juin 2023), iodure de potassium Axapharm (septembre 2013), directive OFSP V2 du 24 juin 2025. Les dates de génération du site AmiKo ne sont pas des dates de révision de FI. ETA 2021 et 2023, LISA 2011 et Cochrane 2021 apportent les comparaisons cliniques.</p><div class="key"><b>À retenir.</b> Le produit exact, son indication, la voie, la dose, les interactions et la situation du patient sont vérifiés ensemble. Les usages hors indication sont identifiés comme tels.</div><button class="pareto-btn ui" data-k="pareto-e01-pharma">▲ Loi de Pareto — Pharmacologie</button></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e01-tdci" data-title="Troubles dus à la carence iodée : spectre complet">
<div class="lab">Définition</div><p>L’Organisation mondiale de la santé regroupe sous ce nom tous les effets d’un apport d’iode insuffisant. Le terme remplace le seul mot « goitre », parce que la carence touche l’ensemble de la vie, du fœtus à l’adulte âgé.</p>
<div class="lab">Contenu</div><p>À tout âge, le spectre comprend le goitre, l’hypothyroïdie et une sensibilité accrue aux radiations nucléaires. Chez l’enfant, l’adolescent et l’adulte, il comprend aussi des altérations des fonctions mentales et l’hyperthyroïdie induite par l’iode. Le syndrome congénital relève d’une autre catégorie (E00).</p>
<div class="lab">Application</div><p>Un adulte âgé dont le goitre est attribuable à une carence peut appartenir au spectre par deux voies : le goitre résiduel de la carence, et le risque d’hyperthyroïdie induite par l’iode lors d’une charge d’iode.</p>
<p class="src">Source : OMS, UNICEF et ICCIDD, <i>Assessment of iodine deficiency disorders and monitoring their elimination</i>, 3e édition, tableau 1.</p></template>

<template data-pop="e01-goitre-oms" data-title="Goitre : définition clinique et grades de l’OMS">
<div class="lab">Définition</div><p>Le goitre correspond à une augmentation du volume thyroïdien. Pour les enquêtes, l’OMS utilise un repère empirique : chaque lobe est comparé à la phalange distale du pouce du sujet. Cette approximation ne remplace pas la volumétrie échographique.</p>
<div class="lab">Grades</div><p>Le grade 0 correspond à un goitre ni palpable ni visible, et non à une thyroïde nécessairement impalpable. Au grade 1, le goitre est palpable sans être visible cou en position normale ; des nodules dans une glande non augmentée y sont inclus. Au grade 2, la tuméfaction est visible et la palpation confirme une augmentation thyroïdienne.</p>
<div class="lab">Limite</div><p>La sensibilité et la spécificité des grades 0 et 1 sont limitées, avec des différences importantes entre examinateurs. En carence légère à modérée, l’échographie est préférable.</p>
<p class="src">Source : OMS 2007, tableau 6 et paragraphes 4.3.1 à 4.3.2.</p></template>

<template data-pop="e01-tgr" data-title="Taux total de goitre et iodurie : seuils de gravité de population">
<div class="lab">Taux total de goitre chez l’écolier</div><p>Un taux de goitre inférieur à 5 % ne signale pas de carence de population selon cette grille. Les catégories légère, modérée et sévère correspondent respectivement à 5,0–19,9 %, 20,0–29,9 % et au moins 30 %. Un taux d’au moins 5 % chez les écoliers de 6 à 12 ans signale un problème de santé publique.</p>
<div class="lab">Iodurie médiane chez l’écolier</div><p>Une médiane inférieure à 20 µg/l indique une carence sévère ; les intervalles de 20–49 et 50–99 µg/l correspondent aux carences modérée et légère. L’intervalle de 100–199 µg/l est adéquat, celui de 200–299 dépasse les besoins, et une médiane d’au moins 300 µg/l indique un excès.</p>
<div class="lab">Femme enceinte</div><p>La médiane de population est insuffisante sous 150 µg/l et adéquate entre 150 et 249 µg/l.</p>
<div class="lab">Limite</div><p>La prévalence du goitre répond lentement à la correction de l’apport ; l’iodurie répond vite. Ces seuils jugent des populations, non des individus.</p>
<p class="src">Source : OMS 2007, tableaux 4, 5 et 7.</p></template>

<template data-pop="e01-gmn" data-title="Goitre multinodulaire et nodulogenèse">
<div class="lab">Définition</div><p>Le goitre multinodulaire comporte plusieurs nodules. La revue de Krohn décrit l’évolution d’une hyperplasie précoce vers des structures souvent clonales ; ce caractère ne signifie pas malignité.</p>
<div class="lab">Mécanisme établi</div><p>Des mutations somatiques interviennent, avec des conséquences physiopathologiques directes et indirectes.</p>
<div class="lab">Niveau de preuve et conséquence</div><p>Le résumé de Krohn décrit des mutations somatiques et une hétérogénéité clonale, sans établir une séquence unique chez chaque adulte. Chez l’enfant porteur d’un nodule autonome, ETA 2022 décrit fréquemment des mutations somatiques augmentant l’activité constitutive du récepteur de la TSH. Ce mécanisme explique une activité indépendante du signal hypophysaire ; il ne prouve ni une carence ni un cancer chez un patient donné. Un bilan génétique systématique du goitre carentiel adulte ne découle pas de ces observations.</p>
<p class="src">Krohn et collaborateurs, 2005, résumé ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">ETA 2022, §B10, autonomie pédiatrique</a>.</p></template>

<template data-pop="e01-eutirads" data-title="EU-TIRADS : catégories, risque et seuils de ponction">
<div class="lab">Principe</div><p>Le système européen d’évaluation du risque de malignité des nodules thyroïdiens classe le nodule en cinq catégories selon l’échographie, et fixe un seuil de taille de ponction par catégorie.</p>
<div class="lab">Catégories</div><p>1 : aucun nodule. 2 : bénin (kyste pur, spongiforme) ≈ 0 %. 3 : risque bas 2–4 %, ponction au-delà de 20 mm. 4 : intermédiaire 6–17 %, au-delà de 15 mm. 5 : élevé 26–87 %, au-delà de 10 mm.</p>
<div class="lab">Signes de haute suspicion</div><p>Les signes de haute suspicion comprennent les microcalcifications, les contours irréguliers, une forme non parallèle et l’hypoéchogénicité marquée de la partie solide.</p>
<p class="src">Source : ETA 2017 (échographie) reprise par ETA 2023, tableaux 2 et 3.</p></template>

<template data-pop="e01-bethesda" data-title="Bethesda : cytologie et risque de malignité">
<p>Les six catégories vont du prélèvement non diagnostique au résultat malin. Le tableau actualisé de l’onglet Examens utilise l’édition 2023. Le risque dépend aussi de la sélection des patients, de l’échographie et du laboratoire. Une cytologie indéterminée ne signifie pas cancer certain.</p><p>La conduite reste fondée ici sur ETA 2023 : une discordance échographique, une atypie persistante ou une suspicion de malignité se discute avec l’équipe spécialisée. L’analyse d’une capsule et des vaisseaux nécessite parfois une pièce histologique.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023, sections et tableaux concernés</a></p>
</template>

<template data-pop="e01-huins" data-title="Extension du goitre plongeant et abord opératoire">
<p>La classification de Huins situe le bord inférieur : au-dessus de la crosse aortique pour le grade 1 ; entre crosse et péricarde pour le grade 2 ; sous l’oreillette droite pour le grade 3. Les catégories aident à anticiper la difficulté opératoire. Une sternotomie ne découle pas automatiquement du grade : les rapports, la forme, une récidive et une suspicion de cancer interviennent.</p><p>La revue narrative de 2022 rapporte environ 95 % de cervicotomies dans les séries citées. Ce résultat ne constitue pas une garantie individuelle.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9350059/" target="_blank" rel="noopener">Unlu et collaborateurs, 2022, classifications et chirurgie</a></p>
</template>

<template data-pop="e01-suisse-histoire" data-title="Histoire de la carence iodée en Suisse">
<div class="lab">Avant la prophylaxie</div><p>Selon la revue historique de 1990, certaines régions comptaient 0,5 % de personnes atteintes d’un syndrome congénital endémique de carence iodée, presque 100 % des écoliers avaient un gros goitre et jusqu’à 30 % des jeunes hommes étaient inaptes au service militaire à cause d’un goitre volumineux.</p>
<div class="lab">Après le sel iodé</div><p>La régression était rapide chez le nouveau-né et l’écolier, plus lente chez les recrues et incomplète chez l’adulte âgé. Dans les cantons qui n’ont autorisé le sel iodé qu’en 1952, la régression a été retardée d’autant : cette preuve naturelle désigne le sel iodé comme cause.</p>
<div class="lab">Conséquence pour la leçon</div><p>Un goitre de l’adulte âgé peut être un reliquat de carence ancienne, sans que ce soit sa seule cause possible. Il explique pourquoi la consultation moderne voit des goitres nodulaires anciens chez des patients nés avant l’iodation efficace.</p>
<p class="src">Source : Bürgi H et collaborateurs, <i>Acta Endocrinologica</i> (cent ans après l’enquête de Kocher).</p></template>

<template data-pop="e01-sel" data-title="Chronologie de l’iodation du sel en Suisse">
<div class="lab">Étapes</div><p>La teneur initiale était de 3,75 mg d’iode par kilogramme en 1922. Elle a doublé en 1962 puis en 1980, jusqu’à 15 mg/kg. Elle est passée à 20 mg/kg en 1999, puis à 25 mg/kg en janvier 2014 ; la source mentionne une plage autorisée de 20–40 mg/kg.</p>
<div class="lab">Résultats</div><p>En 1988, 92 % du sel de détail et 76 % de tout le sel de consommation humaine étaient iodés, bien que l’usage soit volontaire. L’iodurie est passée de 18–64 à 150 µg par jour. L’augmentation de 1999 a nettement amélioré l’état iodé de la population suisse.</p>
<p class="src">Sources : Bürgi (Acta Endocrinol) ; <i>Am J Clin Nutr</i> (relèvement à 20 mg/kg) ; <i>Eur J Nutr</i> 2020–2022 ; Office fédéral de la sécurité alimentaire et des affaires vétérinaires, page « Jodiertes Salz ».</p></template>

<template data-pop="e01-etude2020" data-title="Étude nationale suisse 2020–2022">
<div class="lab">Résultats principaux</div><p>Iodurie médiane de 127 µg/l chez l’écolier (adéquate) et de 97 µg/l chez la femme enceinte (insuffisante), 30 % de moins qu’en 2015 (140 µg/l). Supplément pris par 47 % des femmes enceintes (150–220 µg d’iode par jour) : 129 µg/l chez les utilisatrices, 81 µg/l chez les autres.</p>
<div class="lab">Thyroglobuline et TSH</div><p>Thyroglobuline sur goutte de sang séché : médiane 26,0 µg/l ; valeur élevée (au-dessus de 43,5 µg/l) chez 17,0 % des femmes enceintes. TSH médiane 1,8 mU/l.</p>
<div class="lab">Limite</div><p>La supplémentation était volontaire. Les 150–220 µg des suppléments sont un fait observé, non une recommandation chiffrée suisse.</p>
<p class="src">Source : <i>Eur J Nutr</i>, étude transversale sur l’apport en iode de la population suisse cent ans après l’introduction du sel iodé.</p></template>

<template data-pop="e01-danemark" data-title="Cohortes danoises : structure thyroïdienne et incidences">
<div class="lab">Étude échographique</div><p>2656 sujets de 41 à 71 ans, région à carence limite (iodurie médiane 70 µg/l) : structure multinodulaire chez 23 % (de 20 à 46 % chez la femme et de 7 à 23 % chez l’homme selon l’âge) ; nodule froid solitaire de plus de 10 mm chez 2,4 % ; thyroïde augmentée (plus de 18 ml chez la femme, plus de 25 ml chez l’homme) chez 13,1 % des femmes et 6,2 % des hommes ; augmentation de volume associée à une iodurie inférieure à 50 µg par jour.</p>
<div class="lab">Registres avant iodation</div><p>Hyperthyroïdie franche : 92,9 pour 100 000 par an à Aalborg (iodurie 45 µg/l) contre 65,4 à Copenhague (61 µg/l) ; hypothyroïdie franche : 26,5 contre 40,1. Les auteurs discutaient un apport optimal proche de 150 µg par jour dans leur contexte ; cela ne définit pas une marge individuelle rigide.</p>
<div class="lab">Limite</div><p>Les seuils de volume sont propres à l’étude et ne constituent pas des normes universelles.</p>
<p class="src">Sources : <i>Eur J Endocrinol</i> (structure thyroïdienne) ; <i>J Clin Endocrinol Metab</i> (incidences).</p></template>

<template data-pop="e01-slovenie" data-title="Slovénie et Pologne : leçons de l’iodation">
<div class="lab">Slovénie</div><p>Passage de 10 à 25 mg d’iodure de potassium par kg de sel en 1999 : baisse de l’incidence du goitre diffus et de l’autonomie thyroïdienne ; patients autonomes plus âgés et moins souvent hyperthyroïdiens ; hyperthyroïdie induite par l’iode moins sévère ; hausse de l’incidence de la thyroïdite de Hashimoto.</p>
<div class="lab">Pologne</div><p>Après l’iodation obligatoire de 1997 (la concentration exacte n’est pas retenue ici, car l’unité du résumé consulté est incohérente avec le texte hérité), l’incidence de l’hyperthyroïdie induite par l’iode est restée à un niveau acceptable.</p>
<div class="lab">Lecture</div><p>L’iodation fait baisser la maladie nodulaire autonome, mais déplace une part du fardeau vers la thyroïdite auto-immune.</p>
<p class="src">Sources : Gaberšček et collaborateurs, <i>Arh Hig Rada Toksikol</i> ; <i>J Endocrinol Invest</i>.</p></template>

<template data-pop="e01-nis" data-title="Symporteur sodium-iodure et besoins quotidiens en iode">
<div class="lab">Mécanisme</div><p>Le symporteur sodium-iodure assure le transport actif de l’iodure dans le thyrocyte. C’est la première étape de la synthèse des hormones thyroïdiennes.</p>
<div class="lab">Besoins quotidiens (OMS, UNICEF, ICCIDD)</div><p>90 µg de 0 à 59 mois ; 120 µg de 6 à 12 ans ; 150 µg chez l’adolescent et l’adulte ; 250 µg pendant la grossesse et l’allaitement. La valeur suisse de 250 µg/jour pour l’allaitement est, selon l’autorité suisse, faiblement étayée.</p>
<p class="src">Sources : OMS 2007, §2 ; OpenStax, §17.4, captation et synthèse hormonale ; Office fédéral de la sécurité alimentaire et des affaires vétérinaires.</p></template>

<template data-pop="e01-adaptation" data-title="Adaptation hormonale à la carence et marqueurs">
<div class="lab">Adaptation</div><p>La glande augmente sa captation puis peut accroître sa masse et sécréter relativement davantage de triiodothyronine. Une adaptation suffisante peut maintenir une TSH normale.</p>
<div class="lab">Dosages en population</div><p>La thyroxine est en moyenne plus basse et la triiodothyronine plus haute que dans une population suffisamment pourvue, avec un large chevauchement. La TSH d’une population carencée est plus élevée, mais la différence est trop faible chez l’écolier et l’adulte pour servir de marqueur individuel. La thyroglobuline augmente avec l’hyperplasie ; elle reflète l’état iodé des mois ou années précédents.</p>
<p class="src">Sources : OMS 2007, §4.4 ; Zimmermann et Boelaert, 2015, résumé.</p></template>

<template data-pop="e01-autonomie" data-title="Carence sévère ou légère : deux trajectoires">
<div class="lab">Carence sévère</div><p>Malgré l’activité maximale de la thyroïde, l’iode reste insuffisant : goitre et hypothyroïdie.</p>
<div class="lab">Carence légère à modérée</div><p>La suractivité compense et maintient l’euthyroïdie chez la plupart ; en contrepartie, la stimulation chronique accroît dans la population la prévalence du goitre nodulaire toxique et de l’hyperthyroïdie.</p>
<div class="lab">Conséquence</div><p>Un sujet âgé ayant vécu une carence ancienne peut présenter cette seconde trajectoire ; l’âge et la région seuls ne la démontrent pas.</p>
<p class="src">Source : Zimmermann et Boelaert, <i>Lancet Diabetes &amp; Endocrinology</i>.</p></template>

<template data-pop="e01-wolff" data-title="Effet Wolff-Chaikoff, échappement et phénomène de Jod-Basedow">
<div class="lab">Wolff-Chaikoff</div><p>Un excès pharmacologique d’iode inhibe l’organification de l’iodure, la protéolyse de la thyroglobuline et la sécrétion hormonale. La TSH monte transitoirement, puis la thyroïde normale échappe à cet effet.</p>
<div class="lab">Défaut d’échappement</div><p>Le défaut d’échappement peut provoquer une hypothyroïdie. Il concerne notamment les régions suffisantes en iode, la thyroïdite auto-immune, le fœtus et le nouveau-né.</p>
<div class="lab">Jod-Basedow</div><p>Un tissu nodulaire autonome produit des hormones en excès sous charge iodée, sans contrôle régulateur.</p>
<p class="src">Source : <i>European Thyroid Association</i> 2021, lignes directrices sur la dysfonction thyroïdienne induite par les produits de contraste iodés.</p></template>

<template data-pop="e01-hii" data-title="Hyperthyroïdie induite par l’iode : fenêtre de risque">
<div class="lab">Qui</div><p>Le risque concerne particulièrement le sujet âgé porteur d’un goitre nodulaire, parfois même avec un apport considéré comme normal.</p>
<div class="lab">Quand</div><p>À l’échelle collective, le risque augmente surtout pendant les cinq à dix ans suivant l’introduction du sel iodé en région carencée. L’OMS déconseille un apport supérieur à 300 µg par jour dans les régions anciennement carencées.</p>
<div class="lab">Information professionnelle suisse de l’iodure de potassium</div><p>Une dose élevée d’iode peut déclencher une hyperthyroïdie chez les patients prédisposés, surtout ceux qui ont un goitre ; cela peut arriver avec des quantités considérées comme physiologiques dans d’autres pays.</p>
<p class="src">Sources : OMS 2007, §4.2 ; information professionnelle suisse de l’iodure de potassium (Axapharm, Swissmedic).</p></template>

<template data-pop="e01-facteurs" data-title="Facteurs associés au goitre et aux nodules : sélénium, tabac, alcool">
<div class="lab">Association</div><p>Les carences en iode et en sélénium sont associées à une prévalence accrue du goitre. Au Danemark, les nodules sont associés aux anticorps anti-peroxydase. Le tabac influence la prévalence du goitre ; une consommation modérée à élevée d’alcool est associée à moins de goitre et de nodules solitaires.</p>
<div class="lab">Limite</div><p>Ce sont des associations d’études d’observation, dont les limites empêchent d’établir une causalité ; elles ne fondent aucune recommandation de consommation d’alcool ni de supplémentation systématique en sélénium.</p>
<p class="src">Sources : ETA 2023 ; <i>Eur J Endocrinol</i> ; Knudsen et collaborateurs, <i>Clin Endocrinol</i>.</p></template>

<template data-pop="e01-contraste" data-title="Contraste iodé : risque, urgence et surveillance">
<p>Un examen utilisant 60–150 ml à 300 mg d’iode/ml contient 18–45 g d’iode chimiquement lié. Cette masse totale n’équivaut pas à la quantité d’iodure libre disponible. Les études citées rapportent des incidences variables de dysfonction, de 1 à 15 %, selon le terrain et la méthode ; l’estimation de 250 patients nécessaires pour un cas supplémentaire regroupe hyperthyroïdie et hypothyroïdie.</p><p>La TSH n’est pas dosée systématiquement dans la population générale. Une évaluation est proposée aux patients à haut risque, particulièrement âgés et cardiovasculaires. En hyperthyroïdie franche, une alternative à l’injection est recherchée. Si un examen vital ne peut être remplacé, les spécialistes organisent la prévention sans attendre un bilan exhaustif.</p><p>La prophylaxie médicamenteuse n’est pas universelle. Une surveillance biologique à trois ou quatre semaines concerne les patients à haut risque ; des symptômes nouveaux conduisent à consulter plus tôt. L’hyperthyroïdie survient souvent entre trois et dix semaines, parfois plus tard. Le traitement éventuel doit reconnaître la divergence entre ETA et la FI suisse de Néo-Mercazole.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">ETA 2021</a> ; <button class="w" data-k="e01-ats">Néo-Mercazole (limites de l’indication suisse)</button>.</p>
</template>

<template data-pop="e01-amiodarone" data-title="Amiodarone et goitre nodulaire">
<div class="lab">Constat</div><p>La teneur élevée en iode de l’amiodarone peut provoquer une hyperthyroïdie ou une hypothyroïdie.</p>
<div class="lab">Prudence</div><p>En cas de goitre nodulaire, qui peut contenir une autonomie non détectée, la prudence s’impose.</p>
<p class="src">Source : information professionnelle suisse d’Euthyrox® (Merck, Swissmedic), rubrique interactions ; <i>European Thyroid Association</i> 2021.</p></template>

<template data-pop="e01-compression" data-title="Compression : symptômes, mesures et limites">
<p>La revue des goitres plongeants rapporte une masse cervicale dans 69–97 % des cas, des symptômes respiratoires dans 42–96 %, une dysphagie dans 26–60 % et une obstruction aiguë dans 1–5 %. Ces intervalles proviennent de séries sélectionnées, pas de tous les goitres suivis en médecine générale.</p><p>Les observations de dyspnée sous 8 mm de diamètre trachéal, de stridor sous 5 mm et de symptômes parfois discrets malgré 75 % d’obstruction sont descriptives. Elles ne définissent ni une sensibilité diagnostique ni un seuil permettant d’attendre. Une gêne rapidement croissante nécessite une évaluation urgente.</p><p>Le scanner précise l’anatomie ; les courbes débit-volume peuvent compléter l’étude fonctionnelle. Une dysphonie appelle une évaluation laryngée selon le contexte. Ni un sifflement attribué à l’asthme ni un Pemberton négatif n’excluent une compression.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9350059/" target="_blank" rel="noopener">Unlu et collaborateurs, 2022</a>, symptômes et imagerie.</p>
</template>

<template data-pop="e01-pemberton" data-title="Signe de Pemberton : geste et interprétation">
<p>Chez un patient stable, l’élévation des bras peut accentuer une obstruction veineuse au défilé thoracique. Une congestion faciale, une dilatation veineuse, parfois une cyanose ou une gêne respiratoire constituent le signe recherché. La manœuvre est interrompue si elle provoque une gêne ; elle ne doit pas retarder la prise en charge d’une détresse.</p><p>La revue rapporte le signe dans moins de 5 % des goitres plongeants. Ce chiffre n’est pas une sensibilité validée. Un résultat négatif n’exclut donc ni extension médiastinale ni compression.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9350059/" target="_blank" rel="noopener">Unlu et collaborateurs, 2022</a></p>
</template>

<template data-pop="e01-cave" data-title="Syndrome cave supérieur">
<div class="lab">Signes</div><p>Pléthore faciale, cyanose, œdème des bras, circulation collatérale thoracique.</p>
<div class="lab">Cause</div><p>Plus souvent une malignité, qu’il faut exclure dans un goitre plongeant.</p>
<p class="src">Source : Unlu et collaborateurs.</p></template>

<template data-pop="e01-palpation" data-title="Technique de palpation de l’OMS">
<div class="lab">Technique</div><p>Inspection du cou en position normale puis en hyperextension. Palpation au pouce le long de la trachée, entre le cartilage cricoïde et le sternum. La thyroïde monte à la déglutition. Chaque lobe est comparé à la phalange distale du pouce du patient.</p>
<div class="lab">Limite</div><p>Faible fiabilité des grades 0 et 1 ; l’échographie mesure mieux le volume.</p>
<p class="src">Source : OMS 2007, §4.3.1.</p></template>

<template data-pop="e01-paf" data-title="Ponction à l’aiguille fine : indications et contre-indications">
<div class="lab">Indications</div><p>Selon EU-TIRADS (catégorie 3 au-delà de 20 mm, 4 au-delà de 15, 5 au-delà de 10), ou quel que soit le score en cas d’adénopathie pathologique ou de suspicion d’extension extrathyroïdienne. Éléments qui la renforcent : sexe masculin, jeune âge, nodule solitaire, symptômes compressifs, antécédent familial de cancer médullaire ou de néoplasie endocrinienne multiple de type 2, irradiation cervicale dans l’enfance.</p>
<div class="lab">Contre-indications</div><p>Trouble sévère de la coagulation. Une anticoagulation avec INR inférieur à 3 ne l’est pas, ni un antiagrégant.</p>
<div class="lab">Technique</div><p>Sous guidage échographique.</p>
<p class="src">Source : ETA 2023, tableaux 3 et 4.</p></template>

<template data-pop="e01-echo-cr" data-title="Compte rendu échographique et croissance nodulaire">
<div class="lab">Compte rendu</div><p>Trois diamètres et volume de chaque lobe ; extension sous-sternale ou compression ; nodules de plus de 10 mm, et nodules de 5–10 mm suspects ; si plus de trois nodules par lobe, le plus grand et les suspects ; ganglions pathologiques.</p>
<div class="lab">Croissance significative</div><p>Augmentation d’au moins 20 % de deux diamètres avec au minimum 2 mm, ou augmentation de volume de plus de 50 %. Sur cinq ans, elle survient chez environ 16 % des nodules.</p>
<p class="src">Source : ETA 2023, tableau 2 et surveillance clinique.</p></template>

<template data-pop="e01-calcitonine" data-title="Calcitonine : indication et seuils contextualisés">
<p>La calcitonine est utile lorsque la question d’un cancer médullaire se pose, notamment avant certaines interventions, dans une cytologie indéterminée ou une image suspecte. Un antécédent personnel ou familial de cancer médullaire ou de néoplasie endocrinienne multiple de type 2 renforce son indication. ETA ne tranche pas en faveur d’un dépistage universel de tous les nodules.</p><p>Les valeurs supérieures à 30 pg/ml chez la femme et 34 pg/ml chez l’homme sont des seuils proposés dans le texte européen. La méthode, le contexte et les autres causes d’élévation interviennent : une valeur isolée ne constitue pas automatiquement un diagnostic ni une indication de thyroïdectomie.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023</a>, évaluation initiale.</p>
</template>

<template data-pop="e01-scinti" data-title="Scintigraphie : fonction et piège de la surcharge">
<p>Une TSH basse ou à la limite inférieure justifie la recherche d’autonomie. Dans les régions de carence actuelle ou ancienne, une scintigraphie peut aussi être pertinente avec une TSH normale. Elle distingue les nodules hyperfonctionnels des autres et aide à préparer un traitement par iode radioactif.</p><p>Un nodule hyperfonctionnel est habituellement dispensé de ponction, sauf forte suspicion. Une injection iodée récente peut réduire la captation : ETA propose un délai d’un à deux mois, tandis que la FI suisse d’I-131 Curium mentionne six à huit semaines après contraste hydrosoluble. La nature du produit et le contexte peuvent prolonger le délai. Une faible captation récente n’est pas automatiquement une preuve de thyroïdite destructive.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">ETA 2021</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">I-131 Curium</a></p>
</template>

<template data-pop="e01-imagerie" data-title="Scanner, résonance magnétique, tomographie et incidentalomes">
<div class="lab">Scanner</div><p>Étend le bilan au médiastin supérieur, à la trachée et à l’œsophage ; supérieur à la résonance magnétique pour les rapports vasculaires et pour prédire la nécessité d’une sternotomie. Un contraste injecté expose au risque de thyrotoxicose.</p>
<div class="lab">Incidentalomes</div><p>Risque de malignité de 5 à 13 % au scanner ou à la résonance magnétique, environ 35 % pour les lésions hyperactives à la tomographie par émission de positons au fluorodésoxyglucose.</p>
<div class="lab">Fonction respiratoire</div><p>Les courbes débit-volume évaluent l’obstruction des voies aériennes supérieures.</p>
<p class="src">Sources : ETA 2023 ; Unlu et collaborateurs.</p></template>

<template data-pop="e01-tg-iodurie" data-title="Thyroglobuline et iodurie : marqueurs de population">
<div class="lab">Iodurie</div><p>Marqueur de l’apport récent, de population. En individuel, utile seulement pour étayer un excès d’iode quand le diagnostic d’hyperthyroïdie induite par l’iode est incertain.</p>
<div class="lab">Thyroglobuline sur goutte de sang séché</div><p>Intervalle de référence de 4 à 40 µg/l chez l’écolier iodosuffisant ; étude suisse : médiane 26,0 µg/l chez la femme enceinte, valeur élevée (au-dessus de 43,5 µg/l) chez 17,0 %.</p>
<p class="src">Sources : OMS 2007, §4.4.2 ; <i>Eur J Nutr</i> ; ETA 2021, recommandation 17.</p></template>

<template data-pop="e01-levothyroxine" data-title="Lévothyroxine : indication, administration et limites">
<p>Euthyrox apporte de la thyroxine. La FI suisse de février 2023 décrit une substitution adulte débutant habituellement à 25–50 µg par jour, augmentée de 25–50 µg toutes les deux à quatre semaines, avec un entretien souvent de 100–200 µg/jour. Le sujet âgé ou fragile commence plus prudemment, notamment à 25 µg/jour. La voie est orale, une fois par jour, à jeun au moins trente minutes avant le petit-déjeuner. La dose est adaptée ; aucun maximum universel ne découle de la fourchette d’entretien.</p><p>La même FI conserve l’indication du goitre bénin euthyroïdien et de prévention de récidive, à 75–200 µg/jour pendant des mois ou années. ETA 2023 déconseille cependant le traitement hormonal de routine des nodules euthyroïdiens. Une autorisation n’établit pas à elle seule le bénéfice de routine dans chaque phénotype.</p><p>Une autonomie, une hyperthyroïdie ou une insuffisance surrénalienne non traitée doit être exclue. Fer, calcium et antiacides sont séparés d’au moins deux heures, les résines de quatre à cinq heures, selon la FI. Les anticoagulants coumariniques et les modifications de l’absorption imposent une surveillance ; la biotine peut perturber les dosages. Les symptômes cardiaques signalent une possible intolérance. Aucun pourcentage fixe d’adaptation rénale ou hépatique n’est établi ici.</p><p>La substitution nécessaire est poursuivie pendant grossesse et allaitement avec contrôles. L’essai LISA de 2011 portait sur des adultes sélectionnés, sans autonomie connue, suivis un an. La réduction volumétrique avec association iode-lévothyroxine ne prouve pas un bénéfice symptomatique durable ni sa sécurité dans un goitre autonome âgé.</p><p class="src"><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Euthyrox, FI février 2023</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3206705/" target="_blank" rel="noopener">LISA 2011, méthodes et résultats</a></p>
</template>

<template data-pop="e01-iode131" data-title="Iode 131 : traitement individualisé en Suisse">
<p>La FI d’I-131 Curium inclut l’autonomie et le goitre euthyroïdien. Le traitement oral en capsule relève d’une unité autorisée ; l’activité est calculée avec volume, fixation et rétention. Les MBq mesurent l’activité, les Gy la dose absorbée. Une insuffisance rénale modifie l’élimination et demande une appréciation spécifique.</p><p>La grossesse et l’allaitement sont contre-indiqués. L’allaitement est arrêté au moins huit semaines avant et ne reprend pas pour le même enfant. Une contraception d’au moins six mois suit le traitement bénin. Une dysphagie ou certaines lésions œsophagiennes contre-indiquent la capsule ; un œdème post-thérapeutique peut aggraver une compression trachéale.</p><p>Les expositions iodées et les traitements sont revus par le centre. La FI mentionne six à huit semaines après contraste hydrosoluble. Ses indications de deux ou trois jours d’arrêt du carbimazole diffèrent selon la rubrique : le protocole du centre est explicite, sans arrêt décidé par le patient. ETA rapporte environ 40 % de réduction à douze mois et 10–20 % d’hypothyroïdie à dix ans dans le goitre multinodulaire bénin ; un suivi fonctionnel à vie reste nécessaire.</p><p>La directive OFSP de 2025 impose une dosimétrie documentée. L’hospitalisation commence à 200 MBq, dure au moins 48 heures, et la sortie nécessite un débit inférieur à 10 µSv/h à un mètre. Une dérogation ambulatoire requiert l’accord de l’OFSP et des consignes personnalisées.</p><p class="src"><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">I-131 Curium, juillet 2022</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023</a> ; <button class="w" data-k="e01-sources-guides">OFSP 2025 (source)</button>.</p>
</template>

<template data-pop="e01-rhtsh" data-title="Thyrotropine alpha : usage étudié et indication suisse">
<p>La stimulation par thyrotropine alpha augmente la captation de l’iode radioactif. Dans la revue Cochrane 2021 de six essais et 321 participants, le gain de réduction volumétrique était de 11,9 points de pourcentage, avec intervalle de confiance de 4,4–19,4. L’hypothyroïdie concernait 32,5 % contre 12,1 %, risque relatif 2,53. Le bénéfice sur la qualité de vie restait incertain.</p><p>La FI suisse de Thyrogen, juin 2023, concerne le cancer différencié chez le patient thyroïdectomisé, pour surveillance ou ablation de reliquats. La réduction d’un goitre bénin est hors indication. La dose oncologique n’est pas transposée ici. La grossesse est contre-indiquée et le produit ne doit pas être utilisé pendant l’allaitement. Une glande résiduelle importante peut produire une hausse hormonale ; le risque cardiaque et l’insuffisance rénale nécessitent une évaluation spécifique.</p><p class="src"><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">Thyrogen, juin 2023</a> ; <a data-reference-source="1" href="https://doi.org/10.1002/14651858.CD010622.pub2" target="_blank" rel="noopener">Cochrane 2021, résumé lu</a></p>
</template>

<template data-pop="e01-chirurgie" data-title="Chirurgie : indication et décision partagée">
<p>Une compression, des symptômes persistants, une cytologie suspecte ou certaines lésions indéterminées conduisent à discuter une intervention. La taille d’au moins 4 cm peut contribuer à cette discussion, sans imposer à elle seule une chirurgie. L’étendue dépend notamment du caractère limité à un lobe ou multinodulaire.</p><p>La revue suisse de 2015 rapportait environ 4000 thyroïdectomies annuelles et trois grandes indications couvrant 90 % des interventions : cancer ou suspicion, hyperthyroïdie, volume ou extension intrathoracique. Ce chiffre est historique. Une mortalité très faible dans une série ne signifie pas absence de complications individuelles. La fonction vocale, la calcémie selon l’intervention et le besoin hormonal sont intégrés au suivi de l’équipe chirurgicale.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023</a> ; <a data-reference-source="1" href="https://doi.org/10.4414/smw.2015.14144" target="_blank" rel="noopener">Vidal Fortuny et collaborateurs, 2015, résumé</a></p>
</template>

<template data-pop="e01-plongeant-ttt" data-title="Goitre plongeant : choix du traitement">
<p>Un goitre plongeant symptomatique conduit généralement à discuter la chirurgie. Les formes asymptomatiques demandent une appréciation du risque et des préférences ; la revue souligne que la conduite reste débattue. Environ 95 % de cervicotomies sont rapportées dans les séries citées, sans garantie pour une anatomie particulière.</p><p>La lévothyroxine ne constitue pas une solution fiable à une compression. L’iode radioactif peut réduire progressivement le volume mais provoquer une inflammation ou un œdème précoce ; le risque opératoire, la captation et la menace trachéale sont comparés. La présence d’une dysphagie compte aussi pour la possibilité d’avaler une capsule.</p><p>Les taux de malignité de 3,7–23,3 % cités concernent des séries de goitres plongeants, souvent opérés. Ils ne prouvent pas une transformation maligne obligatoire du goitre carentiel.</p><p class="src"><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9350059/" target="_blank" rel="noopener">Unlu et collaborateurs, 2022</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">I-131 Curium</a></p>
</template>

<template data-pop="e01-prophylaxie" data-title="Prévention iodée : alimentation et complément">
<p>Le sel consommé avec modération est préférentiellement iodé ; la prévention ne demande pas de manger davantage de sel. Le choix des produits transformés et des substituts du lait peut modifier l’apport. Les algues ont une teneur variable et peuvent entraîner un excès.</p><p>Pendant la grossesse, la nécessité d’un complément se discute avec le médecin. L’OSAV recommande de poursuivre durant l’allaitement le complément commencé. Le repère de 250 µg par jour représente l’apport total, alimentation comprise. La page suisse sur l’allaitement reconnaît une preuve limitée pour ce besoin et décrit une étude de 17 mères ; ses résultats préliminaires ne deviennent pas une dose universelle de supplément.</p><p class="src"><a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV, sel iodé</a> ; <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodtabletten-fuer-stillende-muetter-und-die-jodversorgung-von-saeuglingen" target="_blank" rel="noopener">OSAV, allaitement</a></p>
</template>

<template data-pop="e01-ki65" data-title="Comprimés d’iodure de potassium de la Confédération (65 mg)">
<div class="lab">Indication</div><p>Prophylaxie de l’incorporation d’iode radioactif en cas d’accident nucléaire, sur ordre du Conseil fédéral. Ils ne traitent pas le goitre.</p>
<div class="lab">Contre-indications et risques</div><p>Hyperthyroïdie, maladie de Basedow, autonomie locale ou diffuse. Hyperthyroïdie possible chez les patients prédisposés ; hypothyroïdie et goitre fœtaux en grossesse ; hypothyroïdie du nourrisson de moins d’un mois. Crise thyréotoxique : traitement intensif, en dernier recours plasmaphérèse ou thyroïdectomie.</p>
<p class="src">Source : information professionnelle suisse de l’iodure de potassium Axapharm 65 mg (Swissmedic).</p></template>

<template data-pop="e01-ats" data-title="Carbimazole : FI suisse et divergence pour l’iode">
<p>Néo-Mercazole contient 5 mg de carbimazole par comprimé. Le carbimazole devient thiamazole et inhibe la synthèse hormonale. Dans une indication autorisée, la FI décrit chez l’adulte 20–60 mg/jour par voie orale en deux ou trois prises, puis une réduction progressive vers 5–20 mg/jour. L’indication, la fonction et la tolérance déterminent la durée ; une autonomie n’est pas déclarée guérie après une cure standard.</p><div class="alert"><b>Limite d’indication.</b> L’hyperthyroïdie induite par l’iode est exclue des indications. Le goitre simple et les signes de compression trachéale sont contre-indiqués. La recommandation ETA sur l’hyperthyroïdie iodée ne constitue donc pas un protocole suisse autorisé de Néo-Mercazole.</div><p>Une formule sanguine précède le traitement ; la FI prévoit un contrôle hebdomadaire pendant six semaines après 40 ans. Fièvre, angine ou ulcérations buccales imposent l’arrêt et une numération urgente. Une atteinte hépatique sévère Child C, une granulopénie ou une pancréatite antérieure liée au carbimazole/thiamazole contre-indiquent le produit. L’insuffisance rénale demande prudence sans réduction numérique universelle. Les anticoagulants, la digoxine et les bêtabloquants nécessitent une réévaluation de leurs effets.</p><p>La grossesse exige une prise en charge spécialisée, à dose minimale efficace, sans blocage associé à la lévothyroxine. La FI recommande d’éviter l’allaitement ; si la mère le poursuit après information, elle mentionne au maximum 20 mg/jour, prises après tétée et surveillance infantile. La FI suisse du perchlorate n’a pas été identifiée : aucun dosage suisse n’est proposé. L’endocrinologue et le pharmacien documentent le produit et le cadre retenus en cas de recours spécialisé.</p><p class="src"><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">Néo-Mercazole, août 2020</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">ETA 2021</a></p>
</template>

<template data-pop="e01-grossesse" data-title="Grossesse : prévention et protection fœtale">
<p>L’étude suisse 2020–2022 trouve une iodurie médiane de 97 µg/l chez 473 femmes enceintes ; elle décrit une insuffisance collective. Elle ne démontre pas une carence sévère chez chaque femme ni l’effet causal d’une prescription donnée. La discussion du complément tient compte de l’alimentation, des autres produits pris et d’une maladie thyroïdienne.</p><p>Le repère de 250 µg/jour est un apport total. Un excès pharmacologique d’iodure peut provoquer une hypothyroïdie et un goitre fœtaux. L’iode 131 est contre-indiqué pendant la grossesse. Une substitution hormonale nécessaire est poursuivie et contrôlée ; une hyperthyroïdie exige une stratégie spécialisée avec prise en compte des risques des antithyroïdiens.</p><p class="src">Étude nationale suisse 2024 ; OSAV ; FI suisses Euthyrox, Néo-Mercazole, I-131 Curium et iodure de potassium.</p>
</template>

<template data-pop="e01-mnemo" data-title="Aide mnémotechnique : trois questions devant un goitre">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Trois mots ordonnent la consultation : <b>F</b>onction (TSH, scintigraphie si TSH basse ou limite), <b>N</b>odule (échographie, EU-TIRADS, ponction), <b>C</b>ompression (clinique, scanner, courbes débit-volume). Un quatrième réflexe s’y ajoute avant un examen injecté : <b>I</b>ode, c’est-à-dire l’exposition récente.</p></template>

<template data-pop="pareto-e01-definition" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="e01-1,e01-2"></p><ul><li>Goitre : lobe plus gros que la phalange distale du pouce ; grades OMS 0, 1, 2 ; E01.0 diffus, E01.1 multinodulaire, E01.2 sans précision, E01.8 autres dont hypothyroïdie acquise.</li><li>Carence de population : taux de goitre ≥ 5 % ou iodurie médiane &lt; 100 µg/l chez l’écolier ; &lt; 150 µg/l chez la femme enceinte.</li><li>Suisse : écolier adéquat (127 µg/l), femme enceinte insuffisante (97 µg/l), goitre de l’adulte âgé résiduel.</li></ul></template>
<template data-pop="pareto-e01-mecanismes" data-title="Pareto — mecanismes">
<p class="ratio" data-cover="e01-3,e01-4"></p><ul><li>Une adaptation peut préserver la fonction malgré la carence ; la TSH n’est pas obligatoirement élevée.</li><li>Une autonomie nodulaire peut produire un excès hormonal après surcharge iodée. La maladie de Basedow latente est un autre terrain à risque.</li><li>La prévention alimentaire ne dispense pas de rechercher les expositions médicamenteuses et la fonction actuelle.</li></ul>
</template>
<template data-pop="pareto-e01-clinique" data-title="Pareto — clinique">
<p class="ratio" data-cover="e01-5,e01-6"></p><ul><li>Le médecin recherche d’abord une détresse respiratoire ou cardiovasculaire, puis décrit compression, signes suspects et expositions iodées.</li><li>La palpation et le signe de Pemberton ont des limites. Un signe négatif et les seuils trachéaux descriptifs ne définissent pas une zone de sécurité.</li><li>Un sifflement chronique peut révéler une obstruction haute ; l’imagerie précise les rapports.</li></ul>
</template>
<template data-pop="pareto-e01-diagnostic" data-title="Pareto — diagnostic">
<p class="ratio" data-cover="e01-7,e01-8"></p><ul><li>La TSH et l’échographie répondent à des questions différentes. La scintigraphie recherche une autonomie, parfois malgré une TSH normale dans un contexte de carence.</li><li>La ponction dépend du risque, de la taille et des signes associés ; un nodule hyperfonctionnel peut exceptionnellement nécessiter une ponction s’il est très suspect.</li><li>L’urgence respiratoire ou cardiovasculaire précède le bilan électif. L’hyperthyroïdie iodée du sujet âgé exige une décision spécialisée.</li></ul>
</template>
<template data-pop="pareto-e01-prise-en-charge" data-title="Pareto — prise en charge">
<p class="ratio" data-cover="e01-9,e01-10,e01-11"></p><ul><li>La surveillance est graduée selon échographie et cytologie ; une compression nouvelle impose une réévaluation anticipée.</li><li>La chirurgie, l’iode 131 et les techniques mini-invasives se choisissent selon fonction, symptômes et risque. L’iode 131 nécessite dosimétrie et suivi durable.</li><li>La lévothyroxine suppressive n’est pas proposée en routine au patient euthyroïdien. Les usages hors indication et les divergences suisses sont explicites.</li></ul>
</template>
<template data-pop="pareto-e01-examens" data-title="Pareto — examens">
<p class="ratio" data-cover="e01-e-1,e01-e-2,e01-e-3,e01-e-4,e01-e-5,e01-e-6"></p><ul><li>La TSH oriente les hormones libres et les anticorps conditionnels ; la thyroglobuline ne trie pas les cancers nodulaires.</li><li>EU-TIRADS retient des seuils de ponction au-delà de 20, 15 et 10 mm pour les catégories 3, 4 et 5 ; les ganglions suspects et l’extension peuvent modifier la décision.</li><li>La cytologie et l’histologie n’apportent pas la même information. L’iodurie ponctuelle ne prouve pas une carence individuelle.</li></ul>
</template>
<template data-pop="pareto-e01-s-anat" data-title="Pareto — s anat">
<p class="ratio" data-cover="e01-s-anat-cours"></p><ul><li>Les rapports avec trachée, œsophage et veines expliquent les syndromes compressifs.</li><li>Le scanner précise l’extension profonde. Les repères de Huins contribuent au choix opératoire sans le déterminer seuls.</li><li>Les trois figures humaines sont des originaux sourcés ; une image de compression ne prouve pas une cause carentielle.</li></ul>
</template>
<template data-pop="pareto-e01-s-physio" data-title="Pareto — s physio">
<p class="ratio" data-cover="e01-s-physio-cours"></p><ul><li>La régulation maintient parfois une fonction normale malgré la carence. La TSH n’est donc pas toujours élevée.</li><li>Une surcharge peut freiner la glande régulée ou stimuler la production d’un tissu autonome.</li><li>La fonction circulante et la distribution scintigraphique sont complémentaires.</li></ul>
</template>
<template data-pop="pareto-e01-s-bioch" data-title="Pareto — s bioch">
<p class="ratio" data-cover="e01-s-bioch-cours"></p><ul><li>L’iodure est incorporé à la thyroglobuline avant libération des hormones. Le carbimazole freine leur synthèse.</li><li>Une masse d’iode lié dans un contraste n’est pas une dose équivalente d’iodure nutritionnel libre.</li><li>L’activité radioactive, la dose absorbée et le débit de dose ont des unités et des usages différents.</li></ul>
</template>
<template data-pop="pareto-e01-s-sante" data-title="Pareto — s sante">
<p class="ratio" data-cover="e01-s-sante-cours"></p><ul><li>Le sel iodé est utilisé avec modération, sans augmentation de sel total.</li><li>Les médianes d’iodurie évaluent une population. Les compléments observés dans une enquête ne constituent pas une dose universelle.</li><li>Le repère de grossesse et allaitement concerne l’apport total ; la décision du complément est individualisée.</li></ul>
</template>
<template data-pop="pareto-e01-pharma" data-title="Pareto — pharma">
<p class="ratio" data-cover="e01-p-1,e01-p-2,e01-p-3,e01-p-4,e01-p-5"></p><ul><li>La substitution d’une hypothyroïdie diffère de la suppression de TSH d’un nodule euthyroïdien.</li><li>Néo-Mercazole exclut l’hyperthyroïdie iodée de ses indications et contre-indique les signes de compression trachéale.</li><li>L’iode 131 demande dosimétrie, exclusions et radioprotection. La thyrotropine alpha pour goitre bénin est hors indication suisse.</li><li>Les comprimés d’iodure de potassium à 65 mg relèvent de la prophylaxie nucléaire.</li></ul>
</template>

<template data-pop="e01-thyroperoxydase" data-title="Thyroperoxydase : synthèse hormonale et cible">
<p>La thyroperoxydase intervient dans l’oxydation de l’iodure, son incorporation à la thyroglobuline et le couplage des précurseurs hormonaux. Le thiamazole issu du carbimazole inhibe ces étapes de synthèse. Les anticorps dirigés contre cette enzyme sont recherchés dans certaines suspicions de thyroïdite auto-immune ; leur présence n’est pas un dosage de la quantité d’iode disponible.</p><p>Le sigle parfois utilisé pour cette enzyme peut désigner ailleurs la thrombopoïétine ; le contexte thyroïdien doit rester explicite.</p><p class="src"><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680210370280" target="_blank" rel="noopener">FI Néo-Mercazole, pharmacodynamie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023</a></p>
</template>

<template data-pop="pareto-e01-general" data-title="Pareto — general">
<p class="ratio" data-cover="e01-0,e01-1,e01-2"></p><ul><li>Le goitre est une augmentation du volume ; son origine carentielle demande des arguments. Les quatre sous-codes distinguent diffus, multinodulaire, non précisé et autres affections dont l’hypothyroïdie acquise.</li><li>Les grades OMS décrivent l’examen et les médianes d’iodurie décrivent une population. Ils ne prouvent pas à eux seuls la cause chez un individu.</li><li>L’enquête suisse 2020–2022 trouve une médiane adéquate chez les écoliers et insuffisante chez les femmes enceintes ; elle ne mesure pas la prévalence du goitre adulte.</li></ul>
</template>

<template data-pop="pareto-e01-semio" data-title="Pareto — semio">
<p class="ratio" data-cover="e01-semio-normal,e01-semio-signs,e01-semio-mechanisms,e01-semio-examination,e01-semio-interpretation,e01-semio-differentials,e01-semio-urgency,e01-semio-limits,e01-semio-sources"></p><ul><li>Le médecin distingue structure, fonction et retentissement.</li><li>Une discordance entre clinique, biologie et imagerie conduit à réévaluer, sans attribuer tout goitre à une carence.</li><li>La détresse clinique prime sur les seuils descriptifs et sur l’achèvement du bilan.</li></ul>
</template>

<template data-pop="pareto-e01-histo" data-title="Pareto — histo">
<p class="ratio" data-cover="e01-s-histo-cours"></p><ul><li>Le follicule associe épithélium et colloïde, unités de synthèse et de stockage.</li><li>Un nodule hyperplasique n’est pas automatiquement malin, ni automatiquement carentiel.</li><li>La cytologie ne suffit pas toujours à apprécier une invasion capsulaire ou vasculaire ; l’histologie peut être nécessaire.</li></ul>
</template>
