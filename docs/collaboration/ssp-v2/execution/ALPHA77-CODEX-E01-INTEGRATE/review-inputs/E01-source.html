<section class="ilot" id="e01-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 74 ans, née en 1952 dans une région alpine où la généralisation du sel iodé était tardive, porte depuis trente ans un goitre multinodulaire jamais exploré. Un scanner thoracique injecté est demandé en urgence pour une autre raison. La patiente n’a aucun symptôme thyroïdien. Trois questions se posent avant l’injection, puis après elle.</p>
<ol><li>Le goitre est-il encore euthyroïdien, ou contient-il déjà du tissu autonome, c’est-à-dire une zone qui produit des hormones sans obéir à la TSH ?</li><li>Contient-il un nodule suspect de cancer ?</li><li>Comprime-t-il la trachée ou l’œsophage ?</li></ol>
<p>La priorité dépend de l’état clinique : une détresse respiratoire impose d’abord de sécuriser les voies aériennes. Par ailleurs, un <button class="w" data-k="e01-contraste">produit de contraste iodé (charge en iode et délai de risque)</button> contient habituellement 18 à 45 g d’iode chimiquement lié. Cette quantité totale n’est pas une dose équivalente d’iodure libre ; une surcharge peut néanmoins déclencher une production hormonale excessive dans un tissu autonome. Cette leçon enseigne la démarche complète : définir le goitre carentiel, comprendre pourquoi il est devenu nodulaire, reconnaître l’autonomie, trier les nodules, repérer la compression et choisir entre surveillance, <button class="w" data-k="e01-iode131">iode radioactif (indication, résultats, suivi)</button>, techniques mini-invasives et chirurgie.</p>
<p>Le contexte suisse est particulier. Le goitre a presque disparu chez l’enfant grâce au sel iodé, mais il persiste chez les adultes âgés, qui ont grandi avant l’iodation efficace, tandis que l’apport iodé de la femme enceinte est redevenu insuffisant <button class="w" data-k="e01-suisse-histoire">histoire de la carence en Suisse</button>. Le goitre ancien peut témoigner d’une carence passée ; l’âge seul n’en prouve pas la cause. Une insuffisance alimentaire actuelle reste possible à tout âge. Les données nutritionnelles de population ne diagnostiquent pas chaque personne.</p>
<p><b>Situation de départ pour la formation suisse.</b> Le catalogue PROFILES 2017 comprend la tuméfaction cervicale avec goitre, les hormones thyroïdiennes anormales et l’inspection-palpation de la thyroïde. Les vignettes de cette leçon sont des exercices pédagogiques fictifs, sans prétention de reproduire une question officielle. Les exigences de la Commission fédérale des professions médicales pour 2026 articulent connaissances cliniques et compétences pratiques.</p><div class="key"><b>À retenir.</b> Chez le sujet âgé porteur d’un goitre ancien, une charge d’iode est un événement thérapeutique à anticiper, pas une banalité de radiologie : la TSH, l’aspect des nodules et la compression se jugent lorsque le contexte le permet. Aucun bilan exhaustif ne retarde un examen vital.</div>
</section>

<section class="ilot" id="e01-1"><h2><span class="n">1</span>Définitions, classifications et périmètre</h2>
<p>La carence en iode ne produit pas une seule maladie, mais un ensemble de troubles que l’Organisation mondiale de la santé nomme <b><button class="w" data-k="e01-tdci">troubles dus à la carence iodée (spectre complet)</button></b>. À tout âge, ils comprennent le goitre, l’hypothyroïdie et une sensibilité accrue aux radiations nucléaires. Chez l’enfant, l’adolescent et l’adulte s’y ajoutent l’altération des fonctions mentales et l’<b>hyperthyroïdie induite par l’iode</b>, paradoxale mais bien réelle (voir plus loin).</p>
<p>Le <b>goitre</b> est une augmentation du volume thyroïdien. Pour les enquêtes de terrain, l’OMS propose un repère clinique empirique : la thyroïde est goitreuse lorsque chaque lobe latéral a un volume supérieur à celui de la phalange distale du pouce de la personne examinée <button class="w" data-k="e01-goitre-oms">définition et grades de palpation</button>. Le goitre est dit <b>endémique</b> lorsque, chez les écoliers de 6 à 12 ans, le taux total de goitre atteint ou dépasse 5 % : ce seuil signale un problème de santé publique. Le <b>goitre multinodulaire</b> est l’évolution de l’hyperplasie thyroïdienne précoce vers des structures nodulaires, de nature majoritairement néoplasique au sens clonal du terme <button class="w" data-k="e01-gmn">goitre multinodulaire et nodulogenèse</button>.</p>
<p>La catégorie E01 de la classification statistique suisse (CIM-10-GM 2024) comprend quatre sous-codes. E01.0 désigne le goitre diffus, endémique, lié à une carence en iode. E01.1 désigne le goitre multinodulaire, endémique, lié à une carence en iode, et inclut le goitre nodulaire. E01.2 désigne le goitre lié à une carence en iode sans précision, qui inclut le « goitre endémique sans précision ». E01.8 regroupe les autres affections thyroïdiennes liées à une carence en iode et inclut l’hypothyroïdie acquise par carence iodée sans précision. La classification OMS exclut de E01 le syndrome congénital de carence iodée (E00) et l’hypothyroïdie infraclinique par carence iodée (E02) ; les autres goitres non toxiques (E04) et la thyréotoxicose (E05) sont des catégories voisines.</p>
<p><b>Conséquence pratique.</b> Le goitre nodulaire <em>toxique</em> et l’hyperthyroïdie induite par l’iode relèvent de E05. Cette leçon les traite comme complications évolutives du goitre carentiel et comme diagnostics différentiels, parce que le médecin les rencontre dans la même consultation.</p>

<h3>1.1 Grades cliniques de palpation (OMS)</h3>
<p>Le tableau suivant fixe le vocabulaire de l’examen clinique. Il distingue ce qui se palpe de ce qui se voit.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Grade</th><th style="min-width:10em">Définition</th></tr></thead><tbody>
<tr><td style="min-width:10em">0</td><td style="min-width:10em">Goitre ni palpable ni visible</td></tr>
<tr><td style="min-width:10em">1</td><td style="min-width:10em">Goitre palpable, mais non visible cou en position normale ; les nodules dans une thyroïde par ailleurs non augmentée entrent dans ce grade</td></tr>
<tr><td style="min-width:10em">2</td><td style="min-width:10em">Tuméfaction cervicale nettement visible cou en position normale, compatible à la palpation avec une thyroïde augmentée</td></tr></tbody></table>
<p>La palpation est peu sensible et peu spécifique pour les grades 0 et 1, parce que les examinateurs divergent beaucoup. En carence légère à modérée, l’échographie est préférable pour mesurer le volume.</p>

<h3>1.2 Gravité d’une carence de population</h3>
<p>Ces indicateurs ne s’appliquent pas au patient isolé : ils décrivent une population, le plus souvent des écoliers, et servent à juger un programme de prévention <button class="w" data-k="e01-tgr">seuils de gravité de l’OMS</button>.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Indicateur chez l’écolier</th><th style="min-width:10em">Absence de carence</th><th style="min-width:10em">Carence légère</th><th style="min-width:10em">Carence modérée</th><th style="min-width:10em">Carence sévère</th></tr></thead><tbody>
<tr><td style="min-width:10em">Taux total de goitre</td><td style="min-width:10em">0,0–4,9 %</td><td style="min-width:10em">5,0–19,9 %</td><td style="min-width:10em">20,0–29,9 %</td><td style="min-width:10em">≥ 30 %</td></tr>
<tr><td style="min-width:10em">Iodurie médiane</td><td style="min-width:10em">≥ 100 µg/l (100–199 : adéquat ; 200–299 : au-dessus des besoins ; ≥ 300 : excessif)</td><td style="min-width:10em">50–99 µg/l</td><td style="min-width:10em">20–49 µg/l</td><td style="min-width:10em">&lt; 20 µg/l</td></tr></tbody></table>
<p>La lecture appelle une précaution : le taux de goitre répond lentement à la correction de l’apport iodé, alors que l’iodurie répond en quelques jours. Une population corrigée peut donc garder un goitre fréquent pendant des années. Chez la femme enceinte, l’iodurie médiane est jugée insuffisante en dessous de 150 µg/l et adéquate entre 150 et 249 µg/l.</p>

<h3>1.3 Classifications d’imagerie et de cytologie des nodules</h3>
<p>Le goitre carentiel peut devenir nodulaire ; la question suivante est donc toujours le risque de malignité. Deux classifications complémentaires s’enchaînent : l’<b>EU-TIRADS</b> classe le nodule à l’échographie <button class="w" data-k="e01-eutirads">catégories, risque estimé et seuils de ponction</button>, puis la <b>cytologie de Bethesda</b> classe la ponction <button class="w" data-k="e01-bethesda">catégories cytologiques</button>. Les valeurs sont données avec leur tableau dans l’onglet Examens complémentaires.</p>
<h3>1.4 Goitre plongeant</h3>
<p>Il n’existe pas de définition consensuelle du goitre plongeant (rétrosternal). La classification de Huins le situe par rapport à la crosse aortique : grade 1 au-dessus de la crosse ; grade 2 entre la crosse et le péricarde ; grade 3 sous l’oreillette droite. Ces repères contribuent à prévoir l’abord opératoire, sans l’imposer <button class="w" data-k="e01-huins">classification de Huins et conséquences chirurgicales</button>.</p>
<div class="trap"><span class="k">Piège</span> Un « goitre normal à l’échographie cervicale » n’exclut pas un prolongement thoracique : une extension sous-sternale se suspecte sur la clinique (compression) et se confirme au scanner, jamais à la palpation seule.</div>
<div class="key"><b>À retenir.</b> Le goitre se définit par la palpation (grades OMS 0–2) ou par l’échographie ; la gravité de la carence se juge sur des populations (taux de goitre et iodurie chez l’écolier), jamais sur un individu ; le risque de cancer se juge par EU-TIRADS puis Bethesda.</div>
</section>

<section class="ilot" id="e01-2"><h2><span class="n">2</span>Épidémiologie : de la carence endémique au goitre résiduel du sujet âgé</h2>
<h3>2.1 Suisse : avant et après la prophylaxie</h3>
<p>Avant la prophylaxie, dans certaines régions suisses, 0,5 % des habitants étaient crétins, presque tous les écoliers avaient un gros goitre et jusqu’à 30 % des jeunes hommes étaient inaptes au service militaire à cause d’un goitre volumineux <button class="w" data-k="e01-suisse-histoire">histoire de la carence en Suisse</button>.</p>
<p>Le sel de cuisine iodé a été introduit en 1922 à 3,75 mg d’iode par kg, puis doublé en 1962 et en 1980 jusqu’à 15 mg/kg, relevé à 20 mg/kg en 1999 et à 25 mg/kg en janvier 2014 (marge autorisée de 20 à 40 mg/kg). En 1988, 92 % du sel de détail et 76 % de tout le sel de consommation humaine étaient iodés, bien que l’usage reste volontaire. L’iodurie est passée de 18–64 µg par jour à 150 µg par jour, et aucun nouveau crétin endémique né après 1930 n’a été identifié <button class="w" data-k="e01-sel">chronologie de l’iodation du sel</button>.</p>
<p>La régression du goitre a été rapide chez le nouveau-né et l’écolier, plus lente chez les recrues, et <b>incomplète chez l’adulte âgé</b>. Dans les cantons qui n’avaient autorisé le sel iodé qu’en 1952, la régression a été retardée d’autant : ce décalage prouve que le sel iodé était bien la cause de la régression.</p>
<h3>2.2 Suisse aujourd’hui</h3>
<p>L’étude nationale de 2020–2022 donne une iodurie médiane de 127 µg/l chez l’écolier (apport adéquat) et de 97 µg/l chez la femme enceinte (apport insuffisant, soit 30 % de moins qu’en 2015) <button class="w" data-k="e01-etude2020">étude nationale 2020–2022</button>. 47 % des femmes enceintes prennent un supplément qui apporte 150 à 220 µg d’iode par jour ; leur iodurie est de 129 µg/l, contre 81 µg/l chez les non-utilisatrices. L’apport habituel est inadéquat chez 31 % des non-utilisatrices contre 0,2 % des utilisatrices.</p>
<p>Les sources d’iode alimentaire en Suisse sont le sel iodé (51 %), les produits laitiers (26 %) et les poissons et fruits de mer (9 %) ; seuls 34 % des produits industriels contiennent du sel iodé. Cette répartition explique les groupes à risque (section 4).</p>
<h3>2.3 Europe</h3>
<p>Environ la moitié de l’Europe restait légèrement carencée en iode d’après une revue de 2009. Au Danemark, dans une région à carence limite (iodurie médiane 70 µg/l), l’échographie de 2656 sujets de 41 à 71 ans a montré une structure multinodulaire chez 23 % d’entre eux, un nodule froid solitaire de plus de 10 mm chez 2,4 %, et une thyroïde augmentée chez 13,1 % des femmes et 6,2 % des hommes <button class="w" data-k="e01-danemark">cohortes danoises</button>. En Slovénie, le passage de 10 à 25 mg d’iodure de potassium par kg de sel en 1999 a réduit le goitre diffus et l’autonomie thyroïdienne, avec une hyperthyroïdie induite par l’iode moins sévère mais plus de thyroïdite de Hashimoto <button class="w" data-k="e01-slovenie">Slovénie et Pologne</button>.</p>
<p><b>Lacune assumée.</b> Aucune donnée récente de prévalence du goitre chez l’adulte suisse n’a été lue pour cette leçon ; seul est établi que la régression avait été incomplète chez l’adulte âgé en 1990. Cette leçon ne chiffre donc pas la prévalence actuelle.</p>
<div class="key"><b>À retenir.</b> L’écolier suisse est iodosuffisant (iodurie médiane 127 µg/l), la femme enceinte non (97 µg/l, seuil à 150) ; le goitre de l’adulte âgé est un reliquat de l’ancienne carence, d’où sa fréquente nodularité et son autonomie.</div>

<section class="ilot" id="e01-3"><h2><span class="n">3</span>Physiopathologie : du thyrocyte normal au nodule autonome</h2>
<h3>3.1 Physiologie normale</h3>
<p>L’iode est un constituant des hormones thyroïdiennes. Le symporteur sodium-iodure assure le transport actif de l’iodure dans le thyrocyte : c’est la première étape de la synthèse hormonale <button class="w" data-k="e01-nis">symporteur de l’iodure et besoins quotidiens</button>. Les besoins quotidiens en iode, selon l’OMS, l’UNICEF et le conseil international de lutte contre les troubles dus à la carence iodée, sont de 90 µg de 0 à 59 mois, 120 µg de 6 à 12 ans, 150 µg chez l’adolescent et l’adulte, et 250 µg pendant la grossesse et l’allaitement.</p>
<p>Le rétrocontrôle est simple : l’hypophyse sécrète la TSH en réponse à la thyroxine (T4) circulante, et la TSH monte quand la T4 baisse.</p>
<h3>3.2 Adaptation à la carence</h3>
<p>Quand l’iode manque, la thyroïde augmente sa captation d’iode puis sa masse : c’est le goitre. Elle sécrète préférentiellement de la triiodothyronine (T3), et la TSH peut rester normale lorsque la compensation suffit <button class="w" data-k="e01-adaptation">adaptation hormonale et marqueurs de carence</button>. En carence, la T4 sérique est typiquement plus basse et la T3 plus haute que dans une population normale, mais le chevauchement entre populations est large : aucun de ces dosages ne diagnostique une carence chez un individu. La thyroglobuline (Tg) sérique augmente avec l’hyperplasie et reflète l’état iodé des mois ou des années précédents, alors que l’iodurie reflète l’apport récent.</p>
<h3>3.3 Du goitre diffus au goitre multinodulaire et à l’autonomie</h3>
<p>Deux situations s’opposent <button class="w" data-k="e01-autonomie">carence sévère ou légère : deux trajectoires</button>. En <b>carence sévère</b>, malgré une activité thyroïdienne maximale (captation et recyclage de l’iode), la quantité d’iode reste insuffisante : il en résulte un goitre et une hypothyroïdie. En <b>carence légère à modérée</b>, la suractivité thyroïdienne compense et maintient l’euthyroïdie chez la plupart des sujets ; le prix à payer est une <b>stimulation chronique</b>, qui accroît dans la population la prévalence du goitre nodulaire toxique et de l’hyperthyroïdie.</p>
<p>L’évolution de l’hyperplasie précoce vers le goitre multinodulaire fait intervenir des structures nodulaires surtout néoplasiques et des mutations somatiques ; seul ce niveau de description est établi par les sources lues. Plusieurs facteurs sont associés au goitre et aux nodules : les carences en iode et en sélénium, les anticorps anti-peroxydase thyroïdienne (au Danemark), le tabac, tandis qu’une consommation modérée à élevée d’alcool est associée à moins de goitre et de nodules solitaires <button class="w" data-k="e01-facteurs">facteurs associés, sans causalité établie</button>.</p>
<h3>3.4 Effet Wolff-Chaikoff et phénomène de Jod-Basedow</h3>
<p>Un excès pharmacologique d’iode inhibe l’organification de l’iodure, la protéolyse de la thyroglobuline et la sécrétion hormonale : c’est l’<b>effet Wolff-Chaikoff</b>. Il s’ensuit une hausse transitoire de la TSH, puis la thyroïde normale « échappe » à cet effet. Le <b>défaut d’échappement</b> provoque une hypothyroïdie ; il concerne surtout les régions suffisantes en iode, la thyroïdite auto-immune, le fœtus et le nouveau-né <button class="w" data-k="e01-wolff">Wolff-Chaikoff, échappement et Jod-Basedow</button>.</p>
<p>Le <b>phénomène de Jod-Basedow</b> est le mécanisme qui intéresse le goitre carentiel : un tissu nodulaire autonome produit des hormones en excès sous charge iodée, sans contrôle régulateur, puisque son activité ne dépend plus normalement de la TSH. Une maladie de Basedow latente constitue un autre terrain à risque, par stimulation auto-immune du récepteur. À l’échelle d’une population, la forte prévalence d’autonomie nodulaire en carence augmente la prévalence de l’hyperthyroïdie lorsque l’apport iodé est relevé brusquement ; cette hausse est transitoire, car l’iodosuffisance normalise l’activité thyroïdienne et réduit l’autonomie à long terme.</p>
<p>L’OMS situe ce risque chez le sujet âgé porteur d’un goitre nodulaire préexistant, parfois même avec un apport iodé normal, surtout pendant les 5 à 10 ans suivant l’introduction du sel iodé <button class="w" data-k="e01-hii">hyperthyroïdie induite par l’iode : fenêtre de risque</button>.</p>

<div class="trap"><span class="k">Erreur fréquente</span> Croire que corriger la carence « guérit » le goitre. La correction normalise la population à long terme, mais un goitre nodulaire constitué peut persister chez l’adulte âgé, avec une autonomie éventuelle, et l’augmentation brutale d’apport est précisément ce qui la démasque.</div>
<div class="key"><b>À retenir.</b> Carence légère à modérée : euthyroïdie maintenue au prix d’une stimulation chronique, avec possibilité de nodules puis d’autonomie. Charge d’iode sur autonomie : hyperthyroïdie (Jod-Basedow). Charge d’iode sur thyroïde normale : freinage transitoire (Wolff-Chaikoff), puis échappement.</div>

<section class="ilot" id="e01-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>La cause du goitre carentiel est un apport alimentaire d’iode insuffisant. Les indices géographiques historiques sont les chaînes de montagnes, les plaines alluviales, l’altitude et l’éloignement de la mer. Hors de Suisse, des substances goitrogènes naturelles contenues dans l’aliment de base local peuvent s’ajouter à la carence.</p>
<p>En Suisse aujourd’hui, les situations à risque sont les suivantes.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Situation</th><th style="min-width:10em">Raison</th></tr></thead><tbody>
<tr><td style="min-width:10em">Grossesse sans supplément iodé</td><td style="min-width:10em">Apport total de référence de 250 µg/jour ; iodurie médiane de 97 µg/l dans l’étude nationale ; 31 % des non-utilisatrices d’un supplément ont un apport habituel inadéquat</td></tr>
<tr><td style="min-width:10em">Régime végétarien ou végétalien</td><td style="min-width:10em">Beaucoup de substituts végétaux du lait ne contiennent pas d’iode</td></tr>
<tr><td style="min-width:10em">Faible consommation de lait</td><td style="min-width:10em">Les produits laitiers fournissent 26 % de l’iode</td></tr>
<tr><td style="min-width:10em">Alimentation surtout industrielle sans sel iodé</td><td style="min-width:10em">Seuls 34 % des produits industriels contiennent du sel iodé</td></tr></tbody></table>
<p>Le tableau montre que le risque actuel est alimentaire et individuel, non plus géographique. Trois facteurs précipitent l’hyperthyroïdie sur goitre ancien : les <button class="w" data-k="e01-contraste">produits de contraste iodés (charge et délai)</button>, l’<button class="w" data-k="e01-amiodarone">amiodarone (teneur en iode)</button>, et un apport iodé élevé, par exemple de l’iodure ou des algues.</p>
<div class="key"><b>À retenir.</b> Le sel iodé réduit le risque collectif, sans garantir l’apport de chaque personne. La grossesse, certains régimes restrictifs et l’absence de sel iodé justifient une évaluation alimentaire. Un goitre ancien expose à une surcharge iodée tout en pouvant coexister avec un apport habituel insuffisant.</div>
<button class="pareto-btn ui" data-k="pareto-e01-mecanismes">▲ Loi de Pareto — Mécanismes et causes</button>
</section>

<section class="ilot" id="e01-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Le bilan initial de toute maladie nodulaire thyroïdienne comprend les antécédents personnels et familiaux, l’examen clinique, la fonction thyroïdienne et l’échographie cervicale. Les symptômes avant traitement sont idéalement relevés par un questionnaire de qualité de vie spécifique et validé. L’anamnèse poursuit trois buts : repérer une compression, repérer un signe de malignité, repérer une exposition iodée.</p>
<h3>5.1 Antécédents et éléments qui renforcent l’indication de ponction</h3>
<p>Plusieurs éléments augmentent l’intérêt d’une ponction à l’aiguille fine : le sexe masculin, le jeune âge, un nodule solitaire, des symptômes compressifs liés au nodule, un antécédent familial de cancer médullaire de la thyroïde ou de néoplasie endocrinienne multiple de type 2, et une irradiation cervicale dans l’enfance <button class="w" data-k="e01-paf">ponction à l’aiguille fine : indications et limites</button>. Une dysphonie, une invasion ou une dyspnée évoquent une malignité, dans le goitre plongeant comme dans le goitre cervical.</p>
<h3>5.2 Symptômes compressifs</h3>
<p>Dans le goitre plongeant, les symptômes sont par ordre de fréquence : une masse cervicale (69 à 97 %), des symptômes respiratoires (42 à 96 %), la dysphagie (26 à 60 %), l’obstruction aiguë des voies aériennes (1 à 5 %), plus rarement une dysphonie, une thyrotoxicose ou un syndrome cave supérieur <button class="w" data-k="e01-compression">symptômes compressifs et seuils trachéaux</button>. Les symptômes respiratoires associent dyspnée, toux, sensation d’étouffement, dyspnée d’effort et orthopnée ; un sifflement chronique est souvent pris à tort pour de l’asthme. La dysphagie traduit surtout une extension rétro-œsophagienne.</p>
<h3>5.3 Exposition récente à l’iode</h3>
<p>Devant une hyperthyroïdie nouvelle, le médecin recherche un produit de contraste iodé dans les deux à trois mois précédents ; devant une hypothyroïdie nouvelle, il remonte à un à deux ans. Il interroge aussi sur l’amiodarone, les compléments, les algues et le sel iodé.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Une femme fictive de 74 ans, goitre connu depuis longtemps, sans plainte thyroïdienne, à qui l’on propose un examen injecté. Le goitre est multinodulaire et indolore ; la patiente décrit seulement une gêne cervicale à l’effort. Le risque est la thyrotoxicose retardée.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Un « asthme » à sifflement chronique et dyspnée d’effort qui cache un goitre plongeant comprimant la trachée. Une dyspnée aiguë après hémorragie dans un nodule. Une fibrillation atriale révélant une hyperthyroïdie après amiodarone sur goitre non exploré.</p></div></div>
<div class="trap"><span class="k">Piège</span> L’absence de plainte thyroïdienne ne rassure pas : le goitre ancien est le plus souvent silencieux jusqu’à la compression ou jusqu’à la charge d’iode.</div>
<div class="key"><b>À retenir.</b> Trois questions : compression ? signe de malignité ? exposition iodée récente (deux à trois mois pour l’hyperthyroïdie, un à deux ans pour l’hypothyroïdie) ?</div>
</section>

<section class="ilot" id="e01-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Le premier regard apprécie l’état général, la respiration, la voix et la capacité à rester allongé. Le médecin relève le pouls, sa régularité, la pression artérielle, la fréquence respiratoire, la température et l’évolution du poids. Une détresse respiratoire, un stridor nouveau ou une décompensation cardiaque interrompt l’examen de routine et impose une prise en charge urgente. La palpation ne doit pas retarder la sécurisation des voies aériennes.</p><p>L’examen suit la technique de l’OMS <button class="w" data-k="e01-palpation">technique de palpation de l’OMS</button> : inspection du cou en position normale puis en hyperextension ; palpation au pouce le long de la trachée, entre le cartilage cricoïde et le sternum ; la thyroïde monte à la déglutition ; chaque lobe est comparé à la phalange distale du pouce du patient. Le résultat s’exprime en grade 0, 1 ou 2.</p>
<div class="two"><div class="card"><h4>Signes de compression</h4><p>Le <button class="w" data-k="e01-pemberton">signe de Pemberton</button> est présent chez moins de 5 % des goitres plongeants : le patient lève les bras, et l’obstruction veineuse transitoire au défilé thoracique provoque une dilatation des veines jugulaires externes, un érythème facial, parfois une cyanose. Le <button class="w" data-k="e01-cave">syndrome cave supérieur</button> associe pléthore faciale, cyanose, œdème des bras et circulation collatérale thoracique ; il est plus souvent dû à une malignité, qu’il faut exclure.</p></div><div class="card"><h4>Trachée</h4><p>La revue narrative d’Unlu rapporte une dyspnée d’effort pour des diamètres trachéaux inférieurs à 8 mm et un stridor sous 5 mm. Ces observations de séries cliniques ne sont pas des seuils diagnostiques universels ni des valeurs autorisant l’attente. Les symptômes d’obstruction aiguë peuvent manquer jusqu’à une obstruction de 75 % de la lumière : l’absence de stridor ne rassure pas.</p></div></div>
<p>L’examen est confronté à l’échographie, plus fiable pour le volume. Il recherche aussi des adénopathies cervicales suspectes à caractériser à l’échographie, qui peuvent imposer la ponction quel que soit le score échographique.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à l’absence de goitre plongeant parce que le cou est plat : le signe de Pemberton est rare (moins de 5 %), et sa négativité n’exclut rien.</div>
<div class="key"><b>À retenir.</b> Le grade OMS se juge à la palpation, le volume à l’échographie, la compression au scanner et aux courbes débit-volume ; des symptômes parfois discrets peuvent masquer une compression importante ; le chiffre de 75 % provient de séries et ne définit pas une zone de sécurité.</div>
<button class="pareto-btn ui" data-k="pareto-e01-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>

<section class="ilot" id="e01-7"><h2><span class="n">7</span>Démarche diagnostique et diagnostic différentiel</h2>
<p>Le diagnostic de goitre carentiel est un diagnostic d’exclusion et de contexte : il n’existe pas de test qui l’affirme chez l’individu. La démarche répond dans l’ordre à quatre questions : la fonction thyroïdienne est-elle normale, basse ou haute ? L’aspect échographique des nodules est-il suspect ? Existe-t-il un nodule hyperfonctionnel ou une autonomie ? Existe-t-il une compression ? Le tableau ordonne les examens et leur place ; leur interprétation détaillée figure dans l’onglet Examens complémentaires.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Question</th><th style="min-width:10em">Examen</th><th style="min-width:10em">Statut</th></tr></thead><tbody>
<tr><td style="min-width:10em">Fonction thyroïdienne</td><td style="min-width:10em">TSH, puis thyroxine libre si TSH anormale</td><td style="min-width:10em">Indiqué chez tout patient (minimum)</td></tr>
<tr><td style="min-width:10em">Morphologie et risque de malignité</td><td style="min-width:10em">Échographie cervicale avec classement EU-TIRADS</td><td style="min-width:10em">Indiqué</td></tr>
<tr><td style="min-width:10em">Nodule hyperfonctionnel ou autonomie</td><td style="min-width:10em">Scintigraphie thyroïdienne</td><td style="min-width:10em">Indiqué si TSH basse ou à la limite inférieure ; peut aussi se discuter à TSH normale en contexte de carence actuelle ou passée</td></tr>
<tr><td style="min-width:10em">Nature d’un nodule</td><td style="min-width:10em">Ponction à l’aiguille fine sous échographie</td><td style="min-width:10em">Selon EU-TIRADS et la taille</td></tr>
<tr><td style="min-width:10em">Cancer médullaire</td><td style="min-width:10em">Calcitonine</td><td style="min-width:10em">Avant chirurgie, si cytologie indéterminée, obligatoire si antécédent familial</td></tr>
<tr><td style="min-width:10em">Extension sous-sternale</td><td style="min-width:10em">Scanner cervico-médiastinal</td><td style="min-width:10em">Si compression ou goitre plongeant suspecté</td></tr>
<tr><td style="min-width:10em">Apport iodé d’une population</td><td style="min-width:10em">Iodurie médiane</td><td style="min-width:10em">Marqueur de population, non individuel</td></tr></tbody></table>
<p>La lecture montre que la TSH et l’échographie sont indiquées chez les patients dont un goitre ou une maladie nodulaire doit être évalué, alors que la scintigraphie est conditionnelle, et la ponction dépend de la combinaison d’un aspect et d’une taille. La thyroglobuline sérique ne trie pas les nodules bénins et malins. Les anticorps anti-thyroglobuline ne sont pas un marqueur de cancer ; ils peuvent compléter une suspicion de thyroïdite lorsque les anticorps anti-peroxydase sont négatifs.</p>
<h3>7.1 Syndromes et confirmation du diagnostic</h3><p>Le syndrome morphologique associe augmentation du volume et nodules. Le syndrome compressif ajoute dyspnée, dysphagie ou dysphonie ; le syndrome fonctionnel est séparément euthyroïdien, hypothyroïdien ou hyperthyroïdien. Ces axes peuvent coexister : un goitre euthyroïdien peut comprimer, et un petit nodule peut être autonome.</p><p>Le diagnostic positif comporte donc deux niveaux : l’échographie confirme la maladie structurale, tandis que l’anamnèse alimentaire, le contexte ancien et les diagnostics alternatifs étayent ou affaiblissent l’origine carentielle. Une iodurie ponctuelle basse ne suffit pas. En l’absence d’argument causal, le dossier décrit un goitre de cause non établie plutôt que d’affirmer E01.</p><h3>Arbre de décision clinique</h3><ol><li>Une détresse respiratoire ou cardiovasculaire conduit immédiatement à la filière urgente, avant le bilan électif.</li><li>Sans urgence, l’examen et la TSH définissent la fonction ; l’échographie décrit chaque nodule pertinent et les ganglions.</li><li>Une TSH basse conduit aux hormones libres puis à la recherche d’autonomie. Une scintigraphie peut aussi être pertinente à TSH normale dans un contexte de carence actuelle ou passée.</li><li>Un nodule hyperfonctionnel est habituellement dispensé de ponction, sauf forte suspicion. Pour les autres, l’association EU-TIRADS, taille, ganglions et extension détermine la ponction.</li><li>Une suspicion d’extension médiastinale conduit à une imagerie en coupe. La compression, la fonction, la cytologie et les préférences du patient déterminent surveillance ou traitement.</li></ol><h3>7.2 Diagnostic différentiel, classé par gravité</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Diagnostic</th><th style="min-width:10em">Élément qui le distingue</th></tr></thead><tbody>
<tr><td style="min-width:10em">Cancer thyroïdien dans le goitre</td><td style="min-width:10em">Prévalence de 1 à 5 % dans les populations non sélectionnées de nodules ; 3,7 à 23,3 % dans les goitres plongeants opérés ; aspect EU-TIRADS 5, adénopathie, dysphonie</td></tr>
<tr><td style="min-width:10em">Goitre nodulaire toxique ou adénome toxique</td><td style="min-width:10em">Autonomie, TSH basse, nodules hyperfonctionnels à la scintigraphie</td></tr>
<tr><td style="min-width:10em">Dysfonction induite par l’iode</td><td style="min-width:10em">Chronologie après produit de contraste ou amiodarone</td></tr>
<tr><td style="min-width:10em">Maladie de Basedow</td><td style="min-width:10em">Anticorps anti-récepteur de la TSH</td></tr>
<tr><td style="min-width:10em">Thyroïdite chronique lymphocytaire</td><td style="min-width:10em">TSH élevée, anticorps anti-peroxydase (et anti-thyroglobuline en cas de doute) ; une cytologie bénigne de Bethesda II peut correspondre à une thyroïdite</td></tr>
<tr><td style="min-width:10em">Hypothyroïdie infraclinique par carence iodée (E02) ; syndrome congénital de carence iodée (E00)</td><td style="min-width:10em">Exclus de cette catégorie par la classification</td></tr></tbody></table>
<div class="key"><b>À retenir.</b> TSH et échographie chez les patients présentant un goitre ou une maladie nodulaire à évaluer ; scintigraphie si TSH basse ou limite basse, ou si le nodule est possiblement autonome en zone de carence ; ponction selon EU-TIRADS ; scanner si extension sous-sternale ou compression. <button class="w" data-k="e01-mnemo">Aide mnémotechnique (non critère officiel)</button>.</div>
</section>

<section class="ilot" id="e01-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><b>Gravité d’abord.</b> Deux urgences existent dans le goitre carentiel. <b>(1) L’obstruction aiguë des voies aériennes</b> (1 à 5 % des goitres plongeants) survient le plus souvent par hémorragie spontanée ou traumatique dans un nodule ou par dégénérescence kystique ; les autres causes sont la malignité, une infection respiratoire haute, la grossesse. <b>(2) L’hyperthyroïdie induite par l’iode sévère</b>, avec crise thyréotoxique : traitement intensif, et en dernier recours plasmaphérèse ou thyroïdectomie.</div>
<h3>8.1 Obstruction aiguë</h3>
<p>Le mécanisme est volumique : un nodule qui saigne ou un kyste qui dégénère augmente brusquement le volume dans une loge cervicale ou thoracique inextensible, alors que la trachée est déjà rétrécie. Comme les symptômes peuvent manquer jusqu’à 75 % d’obstruction, la décompensation est brutale. Elle impose une prise en charge urgente des voies aériennes.</p>
<h3>8.2 Hyperthyroïdie induite par l’iode</h3>
<p>Le traitement dépend de la gravité d’après l’<i>European Thyroid Association</i> 2021 <button class="w" data-k="e01-ats">antithyroïdiens et cadre suisse : indications et limites</button>. Dans la forme sévère, on emploie un antithyroïdien de synthèse (méthimazole, carbimazole ou propylthiouracile), complété par du perchlorate en cas de réponse partielle. Même une forme légère doit être traitée après 65 ans, surtout en présence de comorbidités. Les formes légères sont surveillées, en évitant une nouvelle surcharge iodée, sous bêtabloquant. Dans la crise thyréotoxique sur hyperthyroïdie induite par l’iode, l’information professionnelle suisse de l’iodure de potassium retient en dernier recours la plasmaphérèse ou la thyroïdectomie.</p>
<p><b>Application suisse.</b> La FI de Néo-Mercazole exclut l’hyperthyroïdie induite par l’iode de ses indications et contre-indique les signes de compression trachéale. Le traitement de cette complication est donc organisé par l’endocrinologue dans un cadre documenté ; les doses d’une recommandation européenne ne sont pas transformées en prescription suisse automatique. Le perchlorate requiert également un produit et un cadre vérifiés par le spécialiste et le pharmacien.</p><h3>8.3 Autres complications</h3>
<p>Les autres complications sont la compression chronique (trachée, œsophage, syndrome cave supérieur) et la malignité (jusqu’à 23,3 % des goitres plongeants opérés) ; une dysphonie, une invasion ou une dyspnée évoquent une malignité.</p>
<div class="trap"><span class="k">Piège</span> Une hyperthyroïdie induite par l’iode « légère » n’est pas anodine chez le sujet âgé : l’<i>European Thyroid Association</i> recommande de la traiter après 65 ans, surtout en présence de comorbidités, au lieu de la seule surveillance.</div>
<div class="key"><b>À retenir.</b> Voies aériennes et crise thyréotoxique sont les deux urgences ; une évaluation thyroïdienne est organisée chez le patient âgé à goitre sans retarder un examen vital.</div>
</section>

<section class="ilot" id="e01-9"><h2><span class="n">9</span>Prise en charge hiérarchisée</h2>
<p>Les objectifs sont au nombre de quatre : prévenir la carence, évaluer le risque de malignité, soulager la compression, éviter l’hyperthyroïdie iatrogène. Les moyens se choisissent selon le tableau clinique.</p>
<h3>9.1 Prévention de population : pilier en Suisse</h3>
<p>Le sel est utilisé avec modération, mais toujours iodé, sans augmenter la consommation totale. La présence de sel iodé dans les produits transformés se vérifie. L’alimentation est variée : poisson, produits laitiers, œufs. Les végétariens et végétaliens préfèrent le sel iodé ; les algues se consomment avec parcimonie. Pendant la grossesse, la nécessité d’un complément iodé est discutée avec le médecin ; un complément choisi pour cet objectif doit effectivement contenir de l’iode ; l’Office fédéral de la sécurité alimentaire et des affaires vétérinaires recommande de poursuivre pendant l’allaitement le supplément commencé pendant la grossesse, avec un apport total recommandé de 250 µg par jour, alimentation et complément réunis <button class="w" data-k="e01-prophylaxie">sel iodé, grossesse et allaitement</button>. Les risques d’un excès d’iode sont faibles comparés à ceux de la carence ; l’introduction du sel iodé peut toutefois augmenter transitoirement les troubles thyroïdiens.</p>
<h3>9.2 Goitre ou nodules bénins asymptomatiques et euthyroïdiens</h3>
<p>La conduite est la <b>surveillance</b>, selon l’aspect échographique et la cytologie. La lévothyroxine destinée à abaisser la TSH est déconseillée par l’<i>European Thyroid Association</i> 2023 en l’absence de TSH élevée : la suppression hormonale expose à une morbidité et une mortalité accrues, alors que l’efficacité reste insuffisante pour réduire les nodules symptomatiques. Aucune supplémentation en iode ni en sélénium n’est recommandée dans les populations qui en sont suffisamment pourvues.</p>
<p><b>Point de tension entre sources.</b> L’information professionnelle suisse d’Euthyrox® (février 2023) conserve les indications « traitement d’un goitre bénin associé à un état euthyroïdien » et « prévention de la récidive d’un goitre après résection » (75 à 200 µg par jour pendant des mois ou des années ; chirurgie ou radiothérapie en cas d’échec). L’essai LISA a montré, contre placebo, une réduction du volume nodulaire de −17,3 % avec la lévothyroxine associée à l’iode, contre −7,3 % (non significatif) avec la lévothyroxine seule <button class="w" data-k="e01-levothyroxine">arbitrage entre sources sur la lévothyroxine</button>. Une autorisation décrit les usages possibles d’un produit ; une recommandation apprécie leur intérêt dans une situation donnée. Pour les nodules euthyroïdiens, la conduite européenne actuelle évite donc la suppression de la TSH, sans prétendre annuler l’autorisation suisse. L’information professionnelle et l’essai LISA restent cités comme texte en vigueur et comme donnée historique.</p>
<p><b>Précaution selon la FI suisse d’Euthyrox.</b> En cas de suspicion d’autonomie, la FI demande un test à la TRH ou une scintigraphie de suppression avant de débuter Euthyrox® : l’autonomie fonctionnelle et l’hyperthyroïdie infraclinique doivent être exclues.</p>
<h3>9.3 Goitre symptomatique ou nodules bénins symptomatiques</h3>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Option</th><th style="min-width:10em">Place et résultats</th><th style="min-width:10em">Limites</th></tr></thead><tbody>
<tr><td style="min-width:10em">Iode radioactif (131I)</td><td style="min-width:10em">Alternative à la chirurgie, surtout si le risque opératoire est élevé ; réduction typique du volume thyroïdien de 40 % en 12 mois, soulagement des symptômes chez la plupart</td><td style="min-width:10em">Hypothyroïdie estimée à 10 à 20 % à 10 ans, suivi à vie ; moins adapté au goitre plongeant (risque d’aggravation aiguë de l’obstruction)</td></tr>
<tr><td style="min-width:10em">131I après préstimulation par TSH recombinante humaine</td><td style="min-width:10em">Usage hors indication suisse pour un goitre bénin ; en cas de faible captation ou de gros goitre, réduction de volume supplémentaire de 11,9 points de pourcentage (IC 95 % 4,4–19,4)</td><td style="min-width:10em">Plus d’hypothyroïdie : 32,5 % contre 12,1 % (RR 2,53)</td></tr>
<tr><td style="min-width:10em">Nodule hyperfonctionnel (5 à 10 % des nodules solitaires ou dominants)</td><td style="min-width:10em">Rarement malin ; la ponction est généralement évitée sauf forte suspicion. L’activité de 131I est individualisée en Suisse par dosimétrie : euthyroïdie le plus souvent, réduction de 30 à 50 % en 12 mois</td><td style="min-width:10em">Suivi de la fonction thyroïdienne</td></tr>
<tr><td style="min-width:10em">Techniques mini-invasives</td><td style="min-width:10em">Éthanolisation (nodules kystiques), thermoablation (nodules solides) ; réduction de 57 à 77 % à 5 ans ; alternative pour les petits nodules hyperfonctionnels (&lt; 10 ml)</td><td style="min-width:10em">Choix du nodule</td></tr>
<tr><td style="min-width:10em">Chirurgie</td><td style="min-width:10em">Voir indications ci-dessous ; thyroïdectomie quasi totale à envisager dans un goitre nodulaire</td><td style="min-width:10em">Risque opératoire</td></tr></tbody></table>
<p>Le tableau compare des options dont les résultats se lisent sur des échelles différentes : réduction de volume, taux d’hypothyroïdie, durée de suivi. Aucune ne dispense du bilan préalable (TSH, échographie, ponction selon l’aspect, scintigraphie si TSH basse).</p>
<p><b>Sélection pour un traitement mini-invasif.</b> Une bénignité documentée, habituellement confirmée par une seconde cytologie sauf aspect de catégorie 2, précède l’intervention. La fonction vocale et le risque hémorragique sont évalués. L’éthanolisation convient surtout aux lésions kystiques symptomatiques ; la thermoablation concerne des nodules solides sélectionnés. Dans un goitre multinodulaire, elle vise un nodule dominant bien défini ou une situation palliative lorsque les autres options sont inadaptées, et non une destruction indifférenciée de toute la glande. Le suivi après intervention comprend des contrôles à six et douze mois, puis selon le contexte.</p><p><b>Indications chirurgicales (ETA 2023).</b> Maladie nodulaire symptomatique (alternative aux techniques mini-invasives et à l’iode radioactif) ; nodules bénins devenus symptomatiques ; Bethesda III–IV non éligibles à la surveillance, ou Bethesda V–VI ; nodule bénin d’au moins 4 cm pour lequel la chirurgie peut être discutée, gêne esthétique, extension rétroclaviculaire ou médiastinale ; nodules hyperfonctionnels et goitre multinodulaire toxique (en option) <button class="w" data-k="e01-chirurgie">chirurgie du goitre : indications et contexte suisse</button>. La revue suisse de 2015 rapportait environ 4000 thyroïdectomies par an ; trois indications couvrent 90 % des interventions (cancer ou suspicion de cancer, hyperthyroïdie, goitre volumineux ou intrathoracique)  ; cette revue décrivait une mortalité très faible ; ces données historiques ne garantissent pas le risque individuel actuel.</p>
<p><b>Goitre plongeant.</b> Environ 95 % étaient retirés par cervicotomie dans les séries rapportées par la revue narrative de 2022 ; la thyroïdectomie totale est préférée à la subtotale ; la lévothyroxine y est controversée et peu efficace ; l’iode radioactif n’apporte qu’une réduction modérée avec un risque d’aggravation aiguë de l’obstruction <button class="w" data-k="e01-plongeant-ttt">traitement du goitre plongeant</button>.</p>
<h3>9.4 Exposition à un produit de contraste iodé (ETA 2021)</h3>
<p>Un scanner injecté apporte 18 à 45 g d’iode (60 à 150 ml à 300 mg/ml). La dysfonction thyroïdienne touche 1 à 15 % des patients exposés ; l’hyperthyroïdie touche 0 à 9 % des patients et prédomine en zone carencée ou en cas de goitre nodulaire ; une analyse citée estime le nombre nécessaire pour observer un cas supplémentaire de dysfonction à environ 250 patients exposés ; elle regroupe hyperthyroïdie et hypothyroïdie. L’hyperthyroïdie apparaît surtout entre 3 et 10 semaines, mais jusqu’à un an après l’injection <button class="w" data-k="e01-contraste">conduite avant et après un produit de contraste iodé</button>.</p>
<ul><li>Pas de dosage systématique de la TSH dans la population générale ; TSH avant l’examen chez les patients à haut risque (sujets âgés, risque cardiovasculaire).</li><li>Un examen sans contraste iodé est privilégié en cas d’hyperthyroïdie franche. En urgence sans alternative adéquate, radiologue et endocrinologue organisent la prévention ; un examen vital n’est pas différé pour un bilan complet.</li><li>Pas de prophylaxie systématique ; méthimazole et/ou perchlorate à envisager avant un examen urgent chez un patient vulnérable (sujet âgé, goitre nodulaire, maladie cardiovasculaire en zone carencée).</li><li>Fonction thyroïdienne à 3 à 4 semaines chez les patients à haut risque.</li></ul>
<div class="trap"><span class="k">Piège</span> Ponctionner automatiquement un nodule hyperfonctionnel : la scintigraphie évite généralement la ponction, sauf forte suspicion. Prescrire de la lévothyroxine sans avoir exclu l’autonomie : elle ajoute des hormones à un tissu qui en produit déjà.</div>
<div class="key"><b>À retenir.</b> Bénin et asymptomatique : surveiller. Symptomatique : chirurgie ou 131I selon le risque opératoire et la fonction. Hyperfonctionnel : traitement spécialisé ; la ponction est généralement évitée sauf forte suspicion. Contraste iodé chez le sujet à risque : TSH avant, fonction à 3–4 semaines après.</div>
</section>

<section class="ilot" id="e01-10"><h2><span class="n">10</span>Suivi, pronostic et prévention</h2>
<p>Pour les nodules non traités, le suivi porte sur la croissance, l’évolution de l’aspect échographique et les ganglions latéraux, avec réévaluation en cas de compression ou de dysphonie. Une croissance est significative si au moins deux diamètres augmentent d’au moins 20 % avec un minimum de 2 mm, ou si le volume augmente de plus de 50 % ; sur cinq ans elle survient chez environ 16 % des nodules. Après l’iode radioactif, le suivi dure toute la vie. Après un produit de contraste iodé chez un patient à risque, la fonction thyroïdienne est contrôlée à 3 à 4 semaines.</p>
<p>Le pronostic de la carence est excellent à l’échelle d’une population quand le sel iodé est utilisé : la synthèse historique de Bürgi publiée en 1990 ne rapportait aucun nouveau cas de syndrome congénital endémique né après 1930 en Suisse. Le pronostic individuel du goitre ancien dépend de la compression, de l’autonomie et de la malignité. La prévention suisse repose sur le sel iodé (25 mg d’iode par kg) et sur le supplément iodé de la grossesse et de l’allaitement.</p>
<div class="key"><b>À retenir.</b> Croissance significative : ≥ 20 % sur deux diamètres (minimum 2 mm) ou volume &gt; 50 %.</div>
<h3>Calendrier selon le risque</h3><p>Chez l’adulte asymptomatique sans indication immédiate de ponction, ETA 2023 propose les repères suivants. Ils ne s’appliquent pas à une masse nouvellement compressive ou suspecte.</p><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Situation sans ponction indiquée</th><th style="min-width:10em">Réévaluation proposée</th></tr></thead><tbody><tr><td style="min-width:10em">EU-TIRADS 2 de 5–10 mm, ou catégorie 3 de 5–10 mm</td><td style="min-width:10em">Aucun contrôle supplémentaire systématique</td></tr><tr><td style="min-width:10em">Catégorie 2 &gt;10 mm, ou catégorie 3 de 10–20 mm</td><td style="min-width:10em">Trois à cinq ans</td></tr><tr><td style="min-width:10em">Catégorie 4 &lt;15 mm</td><td style="min-width:10em">Un an</td></tr><tr><td style="min-width:10em">Catégorie 5 &lt;10 mm</td><td style="min-width:10em">Six à douze mois</td></tr></tbody></table><p>Une stabilité pendant deux ans permet d’alléger le suivi des petits nodules de catégorie 5. Après deux cytologies bénignes concordantes, une nouvelle ponction n’est généralement pas nécessaire. Une croissance significative, un nouveau symptôme ou une discordance échographique change la conduite. Les intervalles de trois à cinq ans reposent sur des preuves limitées ; ils sont individualisés.</p><p>Le consensus britannique 2026 va jusqu’à proposer la sortie du suivi pour certains nodules bénins asymptomatiques. Son système U/Thy diffère d’EU-TIRADS/Bethesda : ses catégories et ses seuils ne sont pas mélangés dans ce calendrier. Le médecin explicite au patient les signes qui doivent provoquer une nouvelle consultation.</p><div class="key"><b>À retenir.</b> La surveillance répond à un risque défini. Une nouvelle dysphonie ou une gêne respiratoire conduit à réévaluer sans attendre l’échéance programmée.</div>
</section>
<section class="ilot" id="e01-11"><h2><span class="n">11</span>Situations particulières</h2>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Situation</th><th style="min-width:10em">Conduite et justification</th></tr></thead><tbody>
<tr><td style="min-width:10em">Grossesse</td><td style="min-width:10em">Apport insuffisant en Suisse sans supplément ; l’iodure traverse le placenta et peut provoquer hypothyroïdie et goitre fœtaux lors de prises d’iodure de potassium à dose pharmacologique <button class="w" data-k="e01-grossesse">grossesse et iode</button></td></tr>
<tr><td style="min-width:10em">Allaitement</td><td style="min-width:10em">250 µg par jour (valeur faiblement étayée selon l’autorité suisse) ; l’iodure de potassium peut déclencher une hypothyroïdie chez le nourrisson de moins d’un mois</td></tr>
<tr><td style="min-width:10em">Sujet âgé</td><td style="min-width:10em">Risque plus élevé d’hyperthyroïdie induite par l’iode ; avec Euthyrox®, dose initiale plus faible (25 µg)</td></tr>
<tr><td style="min-width:10em">Comprimés d’iodure de potassium (65 mg) de la Confédération</td><td style="min-width:10em">Réservés à la prophylaxie de l’incorporation d’iode radioactif en cas d’accident nucléaire, sur ordre du Conseil fédéral ; ils ne traitent pas le goitre ; contre-indiqués en cas d’hyperthyroïdie, de maladie de Basedow ou d’autonomie <button class="w" data-k="e01-ki65">comprimés d’iodure de potassium</button></td></tr>
<tr><td style="min-width:10em">Écolier suisse</td><td style="min-width:10em">Apport collectif adéquat dans l’enquête 2020–2022 (médiane 127 µg/l), sans exclusion d’une carence individuelle</td></tr></tbody></table>
<h3>Enfant, rein et foie</h3><p>Un nodule chez l’enfant relève d’une évaluation pédiatrique spécialisée. ETA 2022 recommande une échographie cervicale complète et une ponction des lésions suspectes ; les seuils de taille de l’adulte ne sont pas transposés. Pour une lésion bénigne, le texte propose un contrôle à six à douze mois, puis tous les douze à vingt-quatre mois pendant au moins cinq ans si elle reste stable. Une modification suspecte conduit à réévaluer la ponction. Une autonomie pédiatrique demande une discussion individualisée, avec chirurgie souvent privilégiée pour disposer de l’histologie.</p><p>En insuffisance rénale, l’élimination de l’iode et la dosimétrie de l’iode radioactif doivent être appréciées par le centre. La FI du carbimazole demande prudence, sans pourcentage d’ajustement universel. En insuffisance hépatique, Néo-Mercazole est contre-indiqué en classe Child C ; une atteinte moindre requiert une surveillance renforcée. Les doses ne sont pas déduites d’une simple fraction arbitraire de la dose adulte.</p><div class="key"><b>À retenir.</b> Les recommandations de nodule adulte, les objectifs nutritionnels et les doses des médicaments ont des populations différentes. L’âge, la grossesse et les fonctions rénale et hépatique modifient la décision.</div><h3>11.1 Cas récapitulatif</h3>
<p>Reprise de la vignette fictive. La patiente de 74 ans à goitre multinodulaire ancien doit recevoir un produit de contraste. Elle appartient au groupe à haut risque (sujet âgé, goitre nodulaire, probable carence ancienne). La TSH est dosée avant l’injection si cela ne retarde pas une prise en charge vitale ; si l’examen est urgent, un traitement préventif par antithyroïdien et/ou perchlorate peut être discuté ; la fonction thyroïdienne est contrôlée à trois à quatre semaines ; l’échographie classe les nodules selon EU-TIRADS ; une scintigraphie est envisagée devant une TSH basse ou limite. En cas d’hyperthyroïdie, un traitement adapté est organisé avec l’endocrinologue, après décision spécialisée tenant compte de la gravité, des comorbidités et de la divergence de la FI suisse.</p>

<section class="ilot" id="e01-12"><h2><span class="n">12</span>Critères formels et paramètres décisifs</h2>
<div class="alert"><b>Critères formels.</b><ul><li><b>Goitre clinique</b> : grade OMS 1 ou 2.</li><li><b>Carence iodée de population</b> : iodurie médiane inférieure à 100 µg/l chez l’écolier, ou inférieure à 150 µg/l chez la femme enceinte ; taux total de goitre d’au moins 5 % chez les écoliers.</li><li><b>Croissance nodulaire significative</b> : au moins 20 % sur deux diamètres (minimum 2 mm) ou volume &gt; 50 %.</li><li><b>Indication de ponction (EU-TIRADS)</b> : catégorie 3 au-delà de 20 mm, catégorie 4 au-delà de 15 mm, catégorie 5 au-delà de 10 mm.</li><li><b>Thyroïde augmentée à l’échographie</b> (seuils d’une étude danoise, non universels) : plus de 18 ml chez la femme, plus de 25 ml chez l’homme.</li></ul></div>
<div class="key"><b>Paramètres clés.</b><ul><li>Besoins en iode : 150 µg/jour chez l’adulte ; 250 µg/jour pendant la grossesse et l’allaitement.</li><li>Sel suisse : 25 mg d’iode par kg. Iodurie suisse 2020–2022 : 127 µg/l (écolier), 97 µg/l (femme enceinte).</li><li>Thyroglobuline sur goutte de sang séché : 4–40 µg/l chez l’écolier iodosuffisant.</li><li>Calcitonine : seuils proposés &gt;30 pg/ml chez la femme et &gt;34 pg/ml chez l’homme, à interpréter selon méthode et contexte, sans diagnostic automatique.</li><li>131I : réduction d’environ 40 % du goitre à 12 mois ; hypothyroïdie 10–20 % à 10 ans.</li><li>Produit de contraste : 18–45 g d’iode par scanner ; hyperthyroïdie surtout entre 3 et 10 semaines.</li><li>Euthyrox® pour un goitre euthyroïdien : 75–200 µg/jour selon l’information professionnelle suisse, mais recommandation européenne de 2023 défavorable.</li></ul></div>
<p>Aucun de ces seuils ne remplace le jugement clinique ; ils ont chacun une population et un contexte (écolier, femme enceinte, étude danoise) qui bornent leur usage.</p>
</section>

— Directive radiothérapie métabolique (V2, 24 juin 2025)</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/analyses/details/thyroxine-libre-ft4" target="_blank" rel="noopener">S35 — T4 libre, répertoire des analyses (Page consultée novembre 2026)</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2026/block-e00-e07.htm" target="_blank" rel="noopener">S36 — ICD-10-GM E00–E07 (2026)</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S37 — Thyroid gland, anatomy and physiology (2e, §17.4)</a></p><p>La prévalence actuelle du goitre adulte suisse n’a pas été retrouvée. Les résumés historiques restent identifiés comme tels. La FI suisse du perchlorate n’a pas été identifiée ; aucun dosage correspondant n’est proposé. Les recommandations de nodule de l’adulte ne sont pas transposées automatiquement à l’enfant. Cette auto-relecture ne constitue pas une certification clinique humaine.</p></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e01-e-1"><h2><span class="n">e-1</span>Hiérarchie des examens</h2>
<p>Chaque examen répond à une question précise ; le goitre carentiel n’a pas de test unique de référence, mais chaque sous-question a le sien. La <b>cytologie après ponction échoguidée</b> est l’examen de triage cellulaire ; l’histologie peut être nécessaire pour le diagnostic définitif, notamment dans une lésion folliculaire ; pour la <b>fonction d’un nodule</b>, c’est la scintigraphie ; pour le <b>volume</b>, l’échographie ; pour la <b>compression et l’extension sous-sternale</b>, le scanner.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Question</th><th style="min-width:10em">Examen de référence</th><th style="min-width:10em">Statut</th></tr></thead><tbody>
<tr><td style="min-width:10em">Fonction globale</td><td style="min-width:10em">TSH ; thyroxine libre et triiodothyronine libre selon la TSH</td><td style="min-width:10em">Indiqué</td></tr>
<tr><td style="min-width:10em">Volume, nodules, ganglions</td><td style="min-width:10em">Échographie cervicale</td><td style="min-width:10em">Indiqué</td></tr>
<tr><td style="min-width:10em">Nodule hyperfonctionnel</td><td style="min-width:10em">Scintigraphie</td><td style="min-width:10em">Conditionnel : TSH basse ou limite inférieure ; peut aussi se discuter à TSH normale en contexte de carence actuelle ou passée</td></tr>
<tr><td style="min-width:10em">Bénin ou malin</td><td style="min-width:10em">Ponction à l’aiguille fine sous échographie</td><td style="min-width:10em">Conditionnel : EU-TIRADS et taille</td></tr>
<tr><td style="min-width:10em">Cancer médullaire</td><td style="min-width:10em">Calcitonine</td><td style="min-width:10em">Conditionnel (voir e-2)</td></tr>
<tr><td style="min-width:10em">Compression, extension sous-sternale</td><td style="min-width:10em">Scanner cervico-médiastinal ; courbes débit-volume</td><td style="min-width:10em">Conditionnel</td></tr>
<tr><td style="min-width:10em">Thyroglobuline et anticorps anti-thyroglobuline</td><td style="min-width:10em">—</td><td style="min-width:10em">Non systématique pour le risque de cancer ; anticorps conditionnels si suspicion de thyroïdite avec anti-peroxydase négatifs</td></tr>
<tr><td style="min-width:10em">Apport iodé</td><td style="min-width:10em">Iodurie (population)</td><td style="min-width:10em">Non individuel</td></tr></tbody></table>
<p>Ce tableau précise le statut de chaque examen : <i>indiqué</i> pour tous, <i>conditionnel</i> pour ceux qui dépendent du contexte, <i>non systématique</i> pour ceux qui n’ont pas de rôle initial.</p>
<div class="key"><b>À retenir.</b> TSH et échographie devant un goitre ou une maladie nodulaire à évaluer ; le reste se décide sur un résultat précédent.</div>
</section>

<section class="ilot" id="e01-e-2"><h2><span class="n">e-2</span>Biologie : TSH, hormones, anticorps, calcitonine</h2>
<p>La TSH est le minimum de la biologie. Le résultat oriente le dosage suivant.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">TSH</th><th style="min-width:10em">Dosages à ajouter</th><th style="min-width:10em">Signification</th></tr></thead><tbody>
<tr><td style="min-width:10em">Basse</td><td style="min-width:10em">Thyroxine libre ; si normale, triiodothyronine libre ; selon le contexte, anticorps anti-récepteur de la TSH</td><td style="min-width:10em">Autonomie, hyperthyroïdie infraclinique ou franche, ou maladie de Basedow</td></tr>
<tr><td style="min-width:10em">Élevée</td><td style="min-width:10em">Thyroxine libre et anticorps anti-peroxydase ; si clinique ou échographie évoquent une thyroïdite chronique alors que ces anticorps sont négatifs, anticorps anti-thyroglobuline</td><td style="min-width:10em">Hypothyroïdie ; thyroïdite chronique</td></tr></tbody></table>
<p><b>Corrélation avec la carence.</b> Dans une population carencée, la T4 est plutôt plus basse, la T3 plus haute et la TSH plus élevée, mais la différence de TSH est trop faible chez l’écolier et l’adulte pour servir de marqueur individuel <button class="w" data-k="e01-adaptation">adaptation hormonale et marqueurs de carence</button>.</p>
<h3>Calcitonine <button class="w" data-k="e01-calcitonine">indications et seuils de la calcitonine</button></h3>
<p>Elle est appropriée avant une chirurgie ou une technique mini-invasive, et en cas de cytologie indéterminée ou d’échographie suspecte ; elle est <b>obligatoire</b> en cas d’antécédent personnel ou familial de cancer médullaire ou de néoplasie endocrinienne multiple de type 2. Les seuils proposés sont supérieurs à 30 pg/ml chez la femme et à 34 pg/ml chez l’homme, avec interprétation selon méthode et contexte ; ils ne prouvent pas seuls un cancer. Au plus une personne dépistée sur 200 a un cancer médullaire : un résultat élevé doit être confronté à l’ensemble du tableau.</p>
<div class="trap"><span class="k">Erreur fréquente</span> La thyroglobuline et ses anticorps ne permettent pas de trier les nodules selon leur risque de cancer. Les anticorps anti-thyroglobuline gardent une place conditionnelle dans une suspicion de thyroïdite avec anticorps anti-peroxydase négatifs.</div>
<div class="key"><b>À retenir.</b> Une TSH basse conduit à la thyroxine libre puis, si nécessaire, à la triiodothyronine libre ; les anticorps du récepteur dépendent du contexte. Une TSH élevée conduit à la thyroxine libre et à la recherche d’une cause auto-immune.</div>
<p><b>Valeurs normales et méthode.</b> Le laboratoire suisse Viollier donne pour la thyroxine libre sérique par immunodosage un intervalle de 11,5–22,7 pmol/l à partir de 20 ans et de 13,4–21,1 pmol/l entre 0 et 19 ans. Le résultat est comparé à l’intervalle de la méthode réellement utilisée ; une norme adulte ne définit pas une cible de grossesse. La TSH est interprétée selon le laboratoire, l’âge, la grossesse et les expositions.</p><p>Dans un exemple fictif, une thyroxine libre de 25 pmol/l dépasse la limite adulte de ce laboratoire. Une TSH basse associée soutient une hyperthyroïdie ; le dosage seul ne distingue pas autonomie et Basedow.</p><p class="src"><a data-reference-source="1" href="https://www.viollier.ch/fr/analyses/details/thyroxine-libre-ft4" target="_blank" rel="noopener">Viollier, T4 libre, valeurs de référence consultées le 2 novembre 2026</a></p></section>

<section class="ilot" id="e01-e-3"><h2><span class="n">e-3</span>Échographie, EU-TIRADS et cytologie</h2>
<p>Le compte rendu échographique comprend le volume des lobes (trois diamètres et volume), l’extension sous-sternale ou la compression, la description des nodules de plus de 10 mm et des nodules de 5 à 10 mm suspects ; s’il y a plus de trois nodules par lobe, le plus grand et les nodules suspects sont décrits ; les ganglions pathologiques sont signalés <button class="w" data-k="e01-echo-cr">compte rendu et croissance</button>.</p>
<h3>Catégories EU-TIRADS</h3><p>Le classement combine échogénicité et signes suspects ; la taille intervient ensuite dans la décision de ponction. Les risques estimés sont des probabilités de groupes, pas une certitude pour chaque nodule.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Catégorie</th><th style="min-width:10em">Aspect</th><th style="min-width:10em">Risque estimé de malignité</th><th style="min-width:10em">Ponction</th></tr></thead><tbody>
<tr><td style="min-width:10em">1</td><td style="min-width:10em">Aucun nodule</td><td style="min-width:10em">—</td><td style="min-width:10em">Non</td></tr>
<tr><td style="min-width:10em">2 (bénin)</td><td style="min-width:10em">Kyste pur ; nodule entièrement spongiforme</td><td style="min-width:10em">≈ 0 %</td><td style="min-width:10em">Non, sauf traitement prévu</td></tr>
<tr><td style="min-width:10em">3 (risque bas)</td><td style="min-width:10em">Iso- ou hyperéchogène, sans signe de haute suspicion</td><td style="min-width:10em">2–4 %</td><td style="min-width:10em">Si &gt; 20 mm</td></tr>
<tr><td style="min-width:10em">4 (risque intermédiaire)</td><td style="min-width:10em">Modérément hypoéchogène, sans signe de haute suspicion</td><td style="min-width:10em">6–17 %</td><td style="min-width:10em">Si &gt; 15 mm</td></tr>
<tr><td style="min-width:10em">5 (risque élevé)</td><td style="min-width:10em">Au moins un signe de haute suspicion</td><td style="min-width:10em">26–87 %</td><td style="min-width:10em">Si &gt; 10 mm</td></tr></tbody></table>
<p>Les signes de haute suspicion sont les microcalcifications, les contours irréguliers, l’orientation non parallèle et l’hypoéchogénicité marquée de la partie solide. Quel que soit le score, la ponction est indiquée en cas d’adénopathie pathologique ou de suspicion d’extension extrathyroïdienne. Le tableau fixe un compromis : plus le risque estimé est élevé, plus le seuil de taille pour ponctionner est bas.</p>
<h3>Cytologie : les six catégories de Bethesda</h3>
<p>La cytologie classe les cellules prélevées ; elle ne remplace pas l’examen de l’architecture tissulaire. Le tableau donne les catégories internationales de Bethesda, troisième édition 2023, et leurs estimations chez les nodules opérés.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Catégorie</th><th style="min-width:10em">Risque moyen de malignité, intervalle</th></tr></thead><tbody><tr><td style="min-width:10em">I — Non diagnostique</td><td style="min-width:10em">13 % (5–20)</td></tr><tr><td style="min-width:10em">II — Bénin</td><td style="min-width:10em">4 % (2–7)</td></tr><tr><td style="min-width:10em">III — Atypies de signification indéterminée</td><td style="min-width:10em">22 % (13–30)</td></tr><tr><td style="min-width:10em">IV — Néoplasme folliculaire</td><td style="min-width:10em">30 % (23–34)</td></tr><tr><td style="min-width:10em">V — Suspect de malignité</td><td style="min-width:10em">74 % (67–83)</td></tr><tr><td style="min-width:10em">VI — Malin</td><td style="min-width:10em">97 % (97–100)</td></tr></tbody></table>
<p>La sélection des nodules opérés surestime certains risques : après cytologie bénigne, les études de suivi donnent plutôt 1–2 %. Le diagnostic libellé accompagne le chiffre ; Bethesda III et EU-TIRADS 3 ne mesurent pas la même chose.</p>
<p>Selon ETA 2023, une ponction non diagnostique ou une atypie conduit généralement à une nouvelle ponction, puis à une décision selon l’échographie. Les catégories IV à VI justifient un avis spécialisé, avec chirurgie souvent proposée et exceptions sélectionnées. Une discordance entre EU-TIRADS 5 et cytologie bénigne impose une réévaluation. Une lésion folliculaire peut nécessiter l’histologie pour apprécier l’invasion capsulaire ou vasculaire ; une ponction ne tranche pas toujours adénome et carcinome.</p>
<p class="src"><a data-reference-source="1" href="https://doi.org/10.1089/thy.2023.0141" target="_blank" rel="noopener">Ali et collaborateurs, Bethesda 2023, tableau 2 et notes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA 2023, sections et tableaux concernés</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13124684/" target="_blank" rel="noopener">consensus britannique de 2026, §4</a></p><div class="trap"><span class="k">Piège</span> Interpréter un Bethesda II comme une absence définitive de maladie : il peut correspondre à une thyroïdite lymphocytaire, et la surveillance échographique continue de s’appliquer.</div>
<div class="key"><b>À retenir.</b> EU-TIRADS 3 &gt; 20 mm, 4 &gt; 15 mm, 5 &gt; 10 mm ; ponction en présence d’adénopathie pathologique ou de suspicion d’extension extrathyroïdienne.</div>
</section>

<section class="ilot" id="e01-e-4"><h2><span class="n">e-4</span>Scintigraphie et autres imageries</h2>
<p>La scintigraphie est indiquée quand la TSH est abaissée ou à la limite inférieure de la normale. <b>Point clé pour le goitre carentiel</b> : dans les zones de carence iodée actuelle ou passée, des nodules hyperfonctionnels existent aussi chez des sujets à TSH normale, ce qui peut justifier une scintigraphie selon la question clinique. Elle évite habituellement la ponction d’un nodule hyperfonctionnel (rarement malin), sauf forte suspicion de malignité, distingue dans un goitre multinodulaire les nodules hypofonctionnels (candidats à la ponction) des hyperfonctionnels, et évalue l’éligibilité à l’iode radioactif <button class="w" data-k="e01-scinti">scintigraphie : indications et pièges</button>.</p>
<p><b>Piège de la charge iodée.</b> La captation peut être supprimée environ deux mois après un produit de contraste iodé ; scintigraphie et iode radioactif sont à éviter un à deux mois après une exposition.</p>
<p>Le scanner cervico-médiastinal est demandé en cas de suspicion d’extension sous-sternale : il évalue l’extension au médiastin supérieur, la trachée et les rapports avec l’œsophage, et il est supérieur à l’imagerie par résonance magnétique pour les rapports vasculaires et pour prédire la nécessité d’une sternotomie. Si un produit de contraste est injecté, le risque de thyrotoxicose est pris en compte. Les incidentalomes ont un risque de malignité de 5 à 13 % au scanner ou à l’imagerie par résonance magnétique et d’environ 35 % pour les lésions hyperactives à la tomographie par émission de positons au fluorodésoxyglucose <button class="w" data-k="e01-imagerie">imageries : apports et limites</button>. Les courbes débit-volume évaluent l’obstruction des voies aériennes supérieures.</p>
<div class="key"><b>À retenir.</b> Scintigraphie avant décision de ponction si TSH basse ou limite basse ; à TSH normale, elle se discute dans un contexte de carence actuelle ou passée ; le délai après contraste est individualisé : ETA propose un à deux mois ; la FI suisse de l’iode 131 mentionne six à huit semaines pour un contraste hydrosoluble.</div>
</section>

<section class="ilot" id="e01-e-5"><h2><span class="n">e-5</span>Marqueurs de l’apport iodé : population et individu</h2>
<p>L’iodurie reflète l’apport récent ; c’est un marqueur de population. Chez un individu, une mesure isolée ne suffit pas à diagnostiquer une carence chronique ; elle peut notamment étayer un excès d’iode lorsque le diagnostic d’hyperthyroïdie induite par l’iode est incertain. La thyroglobuline reflète l’état iodé des mois ou années précédents. Sur goutte de sang séché, l’intervalle de référence est de 4 à 40 µg/l chez l’écolier iodosuffisant ; dans l’étude suisse, la médiane est de 26,0 µg/l chez la femme enceinte et 17,0 % ont une valeur supérieure à 43,5 µg/l <button class="w" data-k="e01-tg-iodurie">marqueurs de population</button>.</p>
<table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Marqueur</th><th style="min-width:10em">Reflète</th><th style="min-width:10em">Usage</th></tr></thead><tbody>
<tr><td style="min-width:10em">Iodurie médiane</td><td style="min-width:10em">Apport iodé récent</td><td style="min-width:10em">Population</td></tr>
<tr><td style="min-width:10em">Thyroglobuline</td><td style="min-width:10em">État iodé des mois ou années précédents</td><td style="min-width:10em">Population</td></tr>
<tr><td style="min-width:10em">TSH médiane des femmes enceintes enquêtées : 1,8 mU/l</td><td style="min-width:10em">Statut thyroïdien de la population</td><td style="min-width:10em">Inadaptée pour affirmer une carence iodée individuelle ; utile pour la fonction thyroïdienne</td></tr></tbody></table>
<div class="trap"><span class="k">Erreur fréquente</span> Demander une iodurie « pour savoir si ce patient est carencé » : une valeur isolée reflète l’apport récent, elle ne dit rien du statut des mois précédents.</div>
</section>

<section class="ilot" id="e01-e-6"><h2><span class="n">e-6</span>Cas corrigés</h2>
<div class="quiz ui"><p><b>Cas 1 (fictif).</b> Une patiente de 74 ans à goitre multinodulaire connu doit recevoir un scanner injecté en urgence. Que prévoir ?</p>
<button data-ok="0">A. Aucune précaution : le produit de contraste n’agit que sur les reins.</button><button data-ok="1">B. Considérer la patiente à haut risque (âge, goitre nodulaire), évaluer la TSH sans retarder un examen vital et discuter une prophylaxie spécialisée si elle est pertinente ; contrôler la fonction thyroïdienne à 3–4 semaines.</button><button data-ok="0">C. Administrer systématiquement un antithyroïdien à tout patient avant un contraste.</button>
<p class="fb" hidden>Réponse B. La recommandation européenne de 2021 déconseille la prophylaxie systématique, mais admet méthimazole et/ou perchlorate avant un examen urgent chez un patient vulnérable ; la charge de 18–45 g d’iode peut révéler une autonomie.</p></div>
<div class="quiz ui"><p><b>Cas 2 (fictif).</b> Un nodule thyroïdien de 17 mm, modérément hypoéchogène, sans signe de haute suspicion, TSH normale, chez un patient né en zone anciennement carencée. Quelle conduite ?</p>
<button data-ok="0">A. Pas de ponction : seule la catégorie 5 est ponctionnée.</button><button data-ok="1">B. EU-TIRADS 4 supérieur à 15 mm atteint le seuil de ponction ; discuter auparavant une scintigraphie dans ce contexte de carence ancienne, car une hyperfonction pourrait dispenser de ponction en l’absence de forte suspicion.</button><button data-ok="0">C. Lévothyroxine pour réduire le nodule.</button>
<p class="fb" hidden>Réponse B. La taille dépasse le seuil de ponction de la catégorie 4, mais une éventuelle hyperfonction modifie cette décision. La scintigraphie reste contextuelle à TSH normale. La lévothyroxine à visée de réduction est déconseillée en routine chez le patient euthyroïdien.</p></div>
<div class="quiz ui"><p><b>Cas 3 (fictif).</b> Un patient présente un goitre plongeant, une dyspnée d’effort et une toux. Le signe de Pemberton est négatif. Quel raisonnement est correct ?</p>
<button data-ok="0">A. La négativité du signe exclut la compression.</button><button data-ok="1">B. Le signe est présent chez moins de 5 % des cas ; le scanner cervico-médiastinal évalue l’extension, la trachée et l’œsophage.</button><button data-ok="0">C. Le sifflement chronique est de l’asthme : pas d’examen complémentaire.</button>
<p class="fb" hidden>Réponse B. Un sifflement chronique est souvent pris à tort pour de l’asthme ; les seuils de diamètre rapportés dans les séries ne remplacent pas l’appréciation clinique.</p></div>
<div class="quiz ui"><p><b>Cas 4.</b> Dans l’étude nationale suisse de 2020–2022, l’iodurie médiane des femmes enceintes est de 97 µg/l. Comment l’interpréter ?</p>
<button data-ok="0">A. Valeur adéquate pour une femme enceinte.</button><button data-ok="1">B. La médiane est insuffisante au regard du seuil collectif de 150 µg/l ; la prévention et la discussion individuelle d’un complément doivent être renforcées.</button><button data-ok="0">C. La valeur diagnostique une carence individuelle sévère.</button>
<p class="fb" hidden>Réponse B. L’iodurie médiane est un marqueur de population : elle juge un programme, non une patiente isolée.</p></div>
<button class="pareto-btn ui" data-k="pareto-e01-examens">▲ Loi de Pareto — Examens complémentaires</button>
</section>
