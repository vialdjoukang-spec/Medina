<template data-pop="g02-codage" data-title="Astérisque et croix : coder une méningite secondaire"><h3>Une catégorie astérisque</h3>
<p>G02* est une <b>catégorie à astérisque</b> : elle code la <i>manifestation</i> méningée, tandis que la maladie causale porte son propre code à croix (†). Le code G02* ne s’emploie donc jamais seul ; il accompagne le code de la maladie à l’origine de la méningite. La règle de double codage détaille cette logique. L’exclusion est explicite : la méningo-encéphalite et la méningomyélite au cours de ces maladies se codent G05.1* (virales) et G05.2* (autres infectieuses et parasitaires).</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Intitulé (OFS)</th><th>Affections causales incluses (code †)</th></tr></thead><tbody><tr><td>G02.0*</td><td>Méningite au cours d’infections virales classées ailleurs</td><td>Adénovirus (A87.1†), entérovirus (A87.0†), herpès simplex (B00.3†), mononucléose infectieuse (B27.-†), rougeole (B05.1†), oreillons (B26.1†), rubéole (B06.0†), varicelle (B01.0†), zona (B02.1†)</td></tr><tr><td>G02.1*</td><td>Méningite au cours de mycoses classées ailleurs</td><td>Candidose (B37.5†), coccidioïdomycose (B38.4†), cryptococcose (B45.1†)</td></tr><tr><td>G02.8*</td><td>Méningite au cours d’autres maladies infectieuses et parasitaires précisées classées ailleurs</td><td>Trypanosomiase africaine (B56.-†), maladie de Chagas chronique (B57.4†)</td></tr></tbody></table>
<p>Le tableau se lit ligne par ligne : la colonne de droite indique la maladie qui reçoit le code à croix, celle de gauche la méningite qui reçoit le code à astérisque. Retenir G02.0* pour toute méningite « virale » est pourtant une erreur de voisinage : l’absence d’agent identifié ne choisit pas automatiquement G03.0. Le libellé G03.0 désigne la méningite non purulente, alors que A87.9 désigne une méningite virale non précisée ; le diagnostic documenté et les règles applicables déterminent le code. Les <button class="w" data-k="g02-voisinages">voisins G01*, G03 et G05*</button> se distinguent par l’agent, non par la gravité.</p>
<div class="trap"><span class="k">Piège</span> La lymphocytose ou une PCR négative ne sélectionnent pas seules un code. Distinguer une méningite non purulente documentée (G03.0) d’une méningite virale non précisée (A87.9), puis appliquer les règles de codage en vigueur.</div><div class="lab">Règle</div><p>La CIM-10-GM distingue le code <b>à croix (†)</b>, qui désigne la maladie causale, et le code <b>à astérisque (*)</b>, qui désigne sa manifestation dans un organe. G02* est un astérisque : il ne s’emploie jamais seul. Une méningite cryptococcique se code B45.1† pour la maladie et G02.1* pour la méningite.</p><div class="lab">Application</div><p>Le médecin note d’abord la maladie causale, puis ajoute le code de la manifestation. Ainsi, une méningite à entérovirus se code A87.0† et G02.0* ; un zona méningé B02.1† et G02.0*.</p><div class="lab">Limite</div><p>Les libellés français viennent du registre de l’Office fédéral de la statistique ; la classification originale est allemande. La cartographie vers la CIM-11 et l’applicabilité administrative suisse actuelle restent à confirmer. La distinction A87.9/G03.0 a été relue dans la classification allemande 2024, sans prétendre remplacer les règles suisses actuelles.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>.</p><p class="src"><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a80-a89.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, A87.0–A87.9</a>, relu le 2 novembre 2026 ; usage suisse actuel non certifié.</p></template>
<template data-pop="g02-voisinages" data-title="Voisinages : G01*, G03 et G05*"><p>Quatre catégories se ressemblent et se distinguent par l’agent et par l’atteinte :</p><table class="t"><thead><tr><th>Code</th><th>Contenu</th><th>Quand le choisir</th></tr></thead><tbody><tr><td>G01*</td><td>Méningite au cours de maladies bactériennes classées ailleurs</td><td>Agent bactérien documenté (leçon précédente)</td></tr><tr><td>G02*</td><td>Méningite au cours d’autres maladies infectieuses et parasitaires</td><td>Virus, champignon ou parasite identifié</td></tr><tr><td>G03.0</td><td>Méningite non purulente (abactérienne)</td><td>Méningite documentée comme non purulente ; pas déduite du seul échec d’identification du virus</td></tr><tr><td>G05.1* / G05.2*</td><td>Méningo-encéphalite et méningomyélite au cours de maladies virales ou autres</td><td>Dès qu’une atteinte du parenchyme est établie</td></tr></tbody></table><p>La décision urgente repose sur la suspicion clinique d’encéphalite herpétique ; un code administratif ne constitue pas une indication thérapeutique.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a>.</p></template>
<template data-pop="g02-criteres-ie" data-title="Critères de l’International Encephalitis Consortium"><div class="lab">Définition de recherche du Consortium 2013</div><p>Le critère majeur est une altération de l’état mental durant au moins 24 heures sans autre cause. Deux critères mineurs définissent une forme possible ; au moins trois une forme probable. Les six critères sont : fièvre documentée d’au moins 38 °C dans les 72 heures avant ou après la présentation ; crises non expliquées par une épilepsie antérieure ; nouveau déficit focal ; au moins 5 leucocytes/mm³ dans le liquide ; anomalie parenchymateuse récente évocatrice à l’imagerie ; anomalie électroencéphalographique compatible non expliquée autrement.</p><p>La confirmation exige en plus une preuve anatomopathologique, microbiologique/sérologique pertinente ou auto-immune. L’absence de pléiocytose ou d’anomalie d’imagerie n’exclut pas l’encéphalite. Ces critères ne demandent pas d’attendre 24 heures avant de traiter une suspicion urgente.</p><p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3783060/" target="_blank" rel="noopener">Venkatesan et al., Consortium international, 2013, tableau 1 et notes</a>, lus le 2 novembre 2026.</p></template>
<template data-pop="g02-meningo-enceph" data-title="Méningite ou méningo-encéphalite : la frontière"><p>Une confusion, une somnolence, une aphasie ou une crise impose une réévaluation urgente : atteinte encéphalitique, crise ou cause métabolique/toxique sont à considérer. Ces signes ne démontrent pas à eux seuls une invasion virale du parenchyme. Si une encéphalite herpétique est suspectée, l’aciclovir intraveineux doit commencer sans attendre la confirmation. Le méningisme peut même manquer dans l’encéphalite.</p><div class="trap"><span class="k">Piège</span> Un patient « seulement fébrile et un peu ralenti » ne relève pas d’une méningite virale simple ; le ralentissement est une alerte à réévaluer, pas une preuve étiologique.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-triade" data-title="Triade clinique : fréquence réelle"><div class="lab">Définition</div><p>Dans la cohorte citée par la DGN, la triade étudiée associe céphalées, raideur de nuque et photophobie ou hyperacousie ; elle ne correspond pas à une triade incluant la fièvre. Dans la cohorte danoise de 1066 épisodes, la céphalée apparaît chez 95 %, un antécédent fébrile rapporté chez 71 %, la photophobie ou l’hyperacousie chez 67 % et la raideur de nuque chez 36 %. La triade complète n’est présente que chez 28 %.</p><div class="lab">Application</div><p>L’absence de raideur de nuque n’exclut donc pas une méningite : près de deux patients sur trois n’ont pas ce signe.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-lcr-normal" data-title="Liquide céphalo-rachidien : normal et pathologique"><div class="lab">Normal</div><p>Clair, moins de 5 leucocytes par µl.</p><div class="lab">Pathologique</div><p>Profil habituel de méningite virale : moins de 1000 cellules par µl, avec des exceptions documentées, mixtes à la phase précoce puis lymphocytaires, protéines et lactate normaux ou à peine élevés. Dans la cohorte danoise, la médiane est de 160 cellules par µl (écart interquartile 60–358).</p><div class="lab">Pièges</div><p>Un liquide précoce à granulocytes n’exclut pas un virus. Dans le profil usuel décrit par la DGN, le lactate peut être peu élevé ; 4,0 mmol/l n’est pas un seuil d’exclusion universel.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-pleiocytose-mixte" data-title="Pléiocytose mixte précoce : ne pas conclure trop vite"><p>Dans les 4 à 48 premières heures d’une infection virale, le liquide contient 25 à 1000 cellules par µl, avec lymphocytes, monocytes et granulocytes. Ce profil ressemble à celui d’une méningite bactérienne. Trois éléments aident à trancher : la procalcitonine (normale, inférieure à 0,5 ng/ml, dans le viral), le lactate du liquide et l’évolution clinique. Tant que l’incertitude persiste, l’antibiothérapie provisoire (céphalosporine de 3e génération et ampicilline pour couvrir Listeria) est justifiée.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-synthese-intrathecale" data-title="Indice d’anticorps : calcul et délai"><div class="lab">Définition</div><p>Indice = (anticorps du liquide × IgG du sérum) / (IgG du liquide × anticorps du sérum). Il est positif au-dessus de 1,5.</p><div class="lab">Application</div><p>Le calcul rapporte les anticorps spécifiques à la quantité totale d’IgG de chaque compartiment, ce qui corrige le passage passif depuis le sang. La réponse intrathécale est décrite tardivement dans les encéphalites par la DGN ; la cohorte danoise documentait aussi certaines méningites par ce moyen. L’absence de réponse précoce ne permet pas de conclure.</p><div class="lab">Limite</div><p>L’indice est tardif : la directive recommande donc la PCR en première intention et l’indice d’anticorps seulement après deux semaines pour les herpèsvirus.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-pct" data-title="Procalcitonine et lactate du liquide"><p>Une procalcitonine inférieure à 0,5 ng/ml soutient une origine virale ; ce marqueur ne doit pas être utilisé seul pour exclure une méningite bactérienne aiguë. La protéine C réactive dépasse rarement 50 mg/l dans les infections virales. Le lactate du liquide sépare utilement viral et bactérien ; il se mesure désormais au lit du patient.</p><div class="trap"><span class="k">Piège</span> Un marqueur bas ne dispense jamais du liquide ; il oriente, il ne tranche pas seul.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-pcr-lcr" data-title="PCR du liquide céphalo-rachidien : choix et pièges"><div class="lab">Application</div><p>La PCR (ou la PCR multiplex) se fait sur liquide non centrifugé. Elle recherche l’herpès simplex, le virus varicelle-zona, le cytomégalovirus, le virus d’Epstein-Barr, le JCV, les flavivirus et les entérovirus. L’herpès simplex, le virus varicelle-zona et le cytomégalovirus se cherchent par PCR d’ADN, les entérovirus par PCR d’ARN, le VIH par PCR d’ARN avec sérologie.</p><div class="lab">Pièges</div><p>La PCR du virus d’Epstein-Barr peut être faussement positive en cas de pléiocytose. En cas de signes d’encéphalite, le traitement part sans attendre le résultat.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-pcr-rapide-ev" data-title="PCR rapide des entérovirus : le gain mesuré à Lausanne"><p>Au CHUV, 59 adultes ont été étudiés (observationnel monocentrique). La PCR automatisée GeneXpert a ramené le délai de résultat de 60 à 5 heures. Les antibiotiques ont été réduits à une dose unique. L’hospitalisation médiane était de 4 jours sans PCR ou avec PCR négative, de 2 jours avec PCR classique, de 0,5 jour avec PCR rapide ; le coût est passé de 5458 à 921 dollars.</p><div class="trap"><span class="k">Piège</span> Une étude monocentrique ne se généralise pas sans réserve : le gain dépend du délai local de la PCR classique.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a>.</p></template>
<template data-pop="g02-enterovirus" data-title="Entérovirus : cause la plus fréquente"><p>Les entérovirus représentent 39 % des épisodes danois et sont la cause la plus fréquente de méningite aseptique. À Genève, l’échovirus 30 prédominait chez l’enfant de 3 ans et plus et chez l’adulte. Dans le sous-groupe genevois complètement prélevé, le sang et les selles étaient positifs chez 62,5 % des enfants, sans cas positif adulte. Les auteurs suggèrent des voies d’accès différentes ; cela ne prouve pas l’absence universelle de virémie adulte. En 2023, l’échovirus 11 a causé des formes néonatales graves.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a>.</p></template>
<template data-pop="g02-vzv" data-title="Varicelle-zona : méningite et terrain"><p>Le virus varicelle-zona représente 15 % des méningites virales de l’adulte danois. L’immunosuppression est présente dans 20 % des cas et un zona dans 60 %. La PCR d’ADN du liquide confirme l’agent. L’aciclovir intraveineux est recommandé dans l’encéphalite ; la brivudine citée dans la DGN n’a pas d’indication méningée ou encéphalitique dans la FI suisse Brivex et ne devient pas un substitut autorisé dans cette urgence.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-hsv2" data-title="Méningite à herpès simplex de type 2"><p>Le virus représente 16 % des méningites virales de l’adulte danois, avec 77 % de femmes. Il peut provoquer une méningite isolée, une radiculite lombosacrée (Elsberg) ou une forme récidivante (Mollaret). La réactivation est récurrente : 22 % des épisodes évoluent vers une méningite récidivante. Dans cette cohorte, le délai d’administration de l’aciclovir n’était pas associé au pronostic.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1111/ene.16081" target="_blank" rel="noopener">Petersen et al., méningite de Mollaret au Danemark, Eur J Neurol 2024</a>.</p></template>
<template data-pop="g02-mollaret" data-title="Méningite lymphocytaire bénigne récidivante (Mollaret)"><div class="lab">Définition</div><p>Forme récidivante bénigne, surtout liée à l’herpès simplex de type 2. Incidence 1,2 par million d’adultes et par an. Les cellules de Mollaret ne sont pas pathognomoniques et la PCR de l’herpès simplex de type 2 n’est que parfois positive.</p><div class="lab">Pronostic</div><p>Meilleur que celui d’un épisode isolé. Hospitalisation pour récidive : 6 % par an ; rapport de risques de 3,93 après trois épisodes antérieurs ou plus.</p><div class="lab">Traitement</div><p>Le valaciclovir à 2 × 500 mg n’empêche pas les récidives méningées ; un rebond est observé à l’arrêt (rapport de risques de 3,29 la deuxième année). L’insuffisance d’exposition dans le système nerveux est une hypothèse des auteurs, non une mesure démontrée par cet essai.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1111/ene.16081" target="_blank" rel="noopener">Petersen et al., méningite de Mollaret au Danemark, Eur J Neurol 2024</a> ; <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a>.</p></template>
<template data-pop="g02-elsberg" data-title="Syndrome d’Elsberg : radiculite lombosacrée virale"><p>Série danoise de 28 adultes : rétention urinaire exigée à l’inclusion (sondage chez 61 %), signes méningés chez 82 %, lésions génitales chez 46 %, liquide médian de 153 cellules par µl, herpès simplex de type 2 chez 68 % et varicelle-zona chez 7 %. Les femmes représentent 79 %. À 30 jours après la sortie, 11 % sont encore sondés ; à 180 jours après la sortie, 20 % gardent une invalidité modérée (Glasgow Outcome Scale 4).</p><div class="trap"><span class="k">Piège</span> Une rétention urinaire avec céphalées fébriles n’est pas fonctionnelle : elle fait chercher une radiculite virale.</div><p class="src">Références : <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a>.</p></template>
<template data-pop="g02-oreillons" data-title="Oreillons et méningite ourlienne"><p>La parotidite est d’abord unilatérale puis souvent bilatérale, après 1 à 2 jours de prodromes. Une orchite survient chez 20 à 30 % des hommes pubères ; la surdité permanente est très rare. La méningite est l’une des complications les plus fréquentes chez l’enfant et guérit en général sans séquelle. En Suisse, moins de 1000 cas par an ont été déclarés ces dernières années.</p><p class="src">Références : <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a>.</p></template>
<template data-pop="g02-vaccination" data-title="Vaccination ROR et RORV en Suisse"><p>Le vaccin contre la rougeole, les oreillons et la rubéole est donné à 9 et 12 mois ; le vaccin tétravalent avec la varicelle (RORV) est préféré depuis 2023. Deux doses protègent en général à vie. La vaccination a fait reculer la méningite ourlienne.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a>.</p></template>
<template data-pop="g02-fsme" data-title="FSME : voisinage clinique"><p>La méningo-encéphalite à tiques relève du code A84 et sort du périmètre strict de G02. Elle compte 245 cas en Suisse en 2023 (chiffre cité par la directive S1) ; la carte de risque actuelle doit être vérifiée auprès de l’OFSP ; une répartition cantonale ancienne n’est pas actualisée par cette relecture. Diagnostic : sérologie du sang et du liquide (indice d’anticorps), PCR précoce. L’IRM peut montrer une atteinte asymétrique des noyaux gris.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://www.bag.admin.ch/de/zeckenuebertragene-krankheiten" target="_blank" rel="noopener">OFSP, maladies transmises par les tiques</a>.</p></template>
<template data-pop="g02-diam" data-title="Méningite aseptique médicamenteuse"><p>Les anti-inflammatoires non stéroïdiens (ibuprofène) et certains antibiotiques peuvent provoquer une méningite aseptique, cliniquement identique à une méningite virale. L’anamnèse médicamenteuse permet de la suspecter ; la chronologie soutient l’hypothèse après évaluation des autres causes.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-hsve" data-title="Encéphalite herpétique : exclure avant tout"><p>Une suspicion d’encéphalite herpétique impose l’aciclovir intraveineux immédiat, sans attendre une ponction lombaire retardée ou contre-indiquée. Une forme grave peut nécessiter les soins intensifs. L’IRM montre une atteinte temporale puis frontobasale. Une encéphalite herpétique peut ensuite déclencher une encéphalite anti-NMDAR.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-autoimmune" data-title="Encéphalite auto-immune : quand y penser"><div class="lab">Critères de Graus 2016 (« possible »)</div><p>Début subaigu (moins de 3 mois) de troubles de mémoire, psychiatriques ou de conscience, avec un signe focal, une pléiocytose supérieure à 5, des crises ou une IRM évocatrice, et exclusion des alternatives. Elle est suspectée quand aucun pathogène n’est retrouvé (anti-NMDAR, CASPR2, LGI1).</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-imagerie" data-title="IRM dans les encéphalites"><p>L’IRM est la méthode de choix ; le scanner n’est qu’un dépistage ou un substitut. L’atteinte temporale puis frontobasale évoque l’herpès simplex, l’atteinte asymétrique des noyaux gris la FSME. L’imagerie ne retarde pas l’aciclovir.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-cryptocoque" data-title="Cryptococcose : terrain et diagnostic"><p>Présentation la plus fréquente et la plus grave : la méningite. Troisième infection fongique invasive du transplanté ; 50 à 70 % des infections à <i>C. gattii</i> touchent des hôtes apparemment immunocompétents. Mortalité de 24 à 47 % à 10 semaines dans les études citées, principalement en contexte de ressources limitées. Chez tout patient atteint, une immunodéficience est recherchée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-crag" data-title="Antigène cryptococcique : liquide, sang et dépistage"><p>L’antigène du liquide et du sang et la culture fondent le diagnostic. Le dépistage sanguin par test à flux latéral se fait chez l’adulte VIH dont les CD4 sont inférieurs à 200 par mm³. Certains tests commerciaux ne détectent pas <i>C. gattii</i>.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-pic" data-title="Hypertension intracrânienne et ponctions évacuatrices"><div class="lab">Règle</div><p>Pression d’ouverture d’au moins 20 cm d’eau avec symptômes : ponctions évacuatrices quotidiennes (environ 20–30 ml) jusqu’à 50 % de la pression initiale ou 20 cm au plus. Ponction programmée à 48–72 heures ou au 7e jour quelle que soit la pression. En cas d’échec, dérivation, de préférence ventriculo-péritonéale.</p><div class="lab">À éviter</div><p>Acétazolamide, mannitol et corticoïdes sont possiblement délétères.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-tar-iris" data-title="Antirétroviral et syndrome inflammatoire de restauration immunitaire"><p>Dans la cryptococcose, le traitement antirétroviral n’est ni immédiat ni très précoce : son début est habituellement différé de 4 à 6 semaines, avec individualisation selon le contexte. Un IRIS persistant malgré les ponctions peut conduire à une prednisone/prednisolone à 0,5–1 mg/kg/j puis décroissance sur 4–6 semaines, après exclusion d’une rechute microbiologique et décision spécialisée. La dexaméthasone systématique n’est pas recommandée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-tha" data-title="Trypanosomiase humaine africaine"><p>La forme gambiense prédomine en Afrique occidentale et centrale ; rhodesiense évolue plus rapidement en Afrique orientale et australe. La confirmation repose sur la mise en évidence du parasite dans le contexte épidémiologique. Le second stade associe plus de 5 leucocytes/µl ou des trypanosomes dans le liquide ; dans gambiense, au moins 100 leucocytes/µl définissent le stade sévère. Les troubles du sommeil seuls ne définissent pas sa sévérité.</p><p>Le fexinidazole n’est pas un traitement universel : ses conditions d’emploi usuelles dans le guide sont un âge d’au moins 6 ans et un poids d’au moins 20 kg ; NECT est privilégié pour gambiense sévère. Le choix pédiatrique diffère entre les espèces, comme le détaille le tableau clinique.</p><p class="src"><a href="https://iris.who.int/handle/10665/378083" target="_blank" rel="noopener">OMS, Guidelines for the treatment of human African trypanosomiasis, juin 2024, pp. 2–4, 6–12, 21–25, 30</a>.</p></template>
<template data-pop="g02-candidose" data-title="Candidose du système nerveux : état des sources"><p>Le guide ECMM/ISHAM 2025 aborde spécifiquement la candidose du système nerveux. Il privilégie l’amphotéricine B liposomale, habituellement avec flucytosine, puis un relais par fluconazole selon la sensibilité. Le contrôle concerne les signes cliniques, le liquide et l’imagerie ; un dispositif infecté appelle une discussion de retrait. La formulation désoxycholate ne doit pas remplacer la liposomale si celle-ci est disponible.</p><p>Les principes ont été lus, mais un erratum d’octobre 2025 reste inaccessible ; les posologies chiffrées de cette indication ne sont pas certifiées ici et ne doivent pas être copiées de la cryptococcose.</p><p class="src"><a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener">Guide ECMM/ISHAM et American Society for Microbiology, 2025, pp. e287–e288</a>.</p></template>
<template data-pop="g02-gos" data-title="Glasgow Outcome Scale : repères utilisés ici"><p>Dans la cohorte danoise, un score de 1 à 4 définit un pronostic défavorable à 30 jours après la sortie (20 % des patients). Dans le syndrome d’Elsberg, le score 4 correspond à une invalidité modérée. La cohorte définit les niveaux :1 : décès ; 2 : état végétatif ; 3 : handicap sévère ; 4 : handicap modéré ; 5 : bonne récupération ; cet outil n’a pas été validé spécifiquement pour ces infections.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a>.</p></template>
<template data-pop="g02-nouveau-ne" data-title="Nouveau-né"><p>L’échovirus 11 (2023, France et autres pays européens) a causé méningite, sepsis, myocardite et insuffisance hépatique fulminante ; 7 décès sur 9 dans la série française. À distinguer de l’infection néonatale à herpès simplex : la FI d’aciclovir prévoit alors 20 mg/kg toutes les 8 heures, 21 jours si atteinte du système nerveux ou forme disséminée. Il ne s’agit pas d’un traitement de l’échovirus.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-immunodeprime" data-title="Immunodéprimé : agents et foscarnet"><p>Cytomégalovirus, virus d’Epstein-Barr, varicelle-zona, JCV. Une résistance de l’herpès simplex à l’aciclovir est décrite au cours du sida et de la transplantation ; le foscarnet est l’alternative citée par la directive S1. La FI exacte Foscavir a été lue : ses indications couvrent la rétinite à cytomégalovirus menaçant la vue dans le sida et l’herpès résistant mucocutané de l’immunodéprimé. Elle précise que l’efficacité et la sécurité dans l’encéphalite ne sont pas étudiées ; la fenêtre du produit distingue ces cadres.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-sources-guides" data-title="Organisations et guides cités"><ul><li><b>DGN</b> : Société allemande de neurologie, directive S1 de février 2025 (consensus d’experts).</li><li><b>ECMM/ISHAM</b> : recommandation mondiale sur la cryptococcose, 2024.</li><li><b>ECMM/ISHAM</b> et American Society for Microbiology : candidose 2025, avec erratum ultérieur non obtenu.</li><li><b>OMS</b> : trypanosomiase, 2024.</li><li><b>OFSP</b> : oreillons, tiques.</li><li><b>Swissmedic</b> : informations professionnelles.</li></ul></template>
<template data-pop="g02-lacunes" data-title="Limites documentaires actuelles"><ul><li>Le texte suisse SSI Méningite a été lu ; il porte notamment sur la démarche urgente, pas sur tous les traitements rares.</li><li>Les recommandations DGN 2025, cryptococcose 2024, trypanosomiase OMS 2024 et les passages pertinents sur la coccidioïdomycose ont été effectivement consultés.</li><li>Candidose du système nerveux : principes 2025 lus, erratum ultérieur inaccessible ; pas de reprise du schéma chiffré douteux.</li><li>Flucytosine : RCP oral français exact lu ; autorisation suisse export publiée en 2024 et présence dans la liste de septembre 2026 établies, sans preuve de disponibilité suisse.</li><li>La maladie de Chagas est documentée à partir de sources suisses, européennes et du NIH. Les produits de recours de la trypanosomiase africaine ne sont pas détaillés comme monographies exhaustives ; aucun schéma chiffré non vérifié n’est proposé. Les guides ne prouvent pas l’autorisation suisse d’un produit.</li><li>L’applicabilité administrative suisse actuelle reste à confirmer. Une correspondance pédagogique explicite aux situations et activités PROFILES 2023 a été ajoutée après lecture du site officiel ; elle n’est pas une certification du cours.</li></ul></template>
<template data-pop="g02-cohorte-danoise" data-title="Cohorte danoise 2015–2019 : ce qu’elle établit"><div class="lab">Population</div><p>1066 épisodes chez 1045 adultes, cohorte nationale prospective danoise ; méthodes : janvier 2015 à décembre 2019 ; âge médian 33 ans ; 54 % de femmes ; incidence 4,7 pour 100 000 par an.</p><div class="lab">Résultats</div><p>Entérovirus 39 %, herpès simplex de type 2 16 %, varicelle-zona 15 %, autres 3 %, non identifié 27 %. Céphalées 95 %, antécédent fébrile rapporté 71 %, photophobie ou hyperacousie 67 %, raideur de nuque 36 %, triade céphalées–raideur–photophobie ou hyperacousie 28 %. Pronostic défavorable (Glasgow Outcome Scale 1 à 4) à 30 jours après la sortie chez 20 % ; le sexe féminin est associé à un risque relatif ajusté de 1,34 (intervalle de confiance à 95 % : 1,03–1,75), sans preuve de causalité ; le délai d’aciclovir n’est pas associé au pronostic des méningites à herpès simplex de type 2 ou varicelle-zona.</p><div class="lab">Limite</div><p>Étude danoise, méthodes et résultats du texte intégral relus le 2 novembre 2026 : les valeurs ne se transposent pas telles quelles à la Suisse, où aucune cohorte comparable n’a été retrouvée.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-dgn-niveaux" data-title="Quatre niveaux de recherche diagnostique (directive S1)"><p>Niveau 1 : virus traitables (herpès simplex 1 et 2, varicelle-zona, cytomégalovirus, VIH). Niveau 2 : traitement potentiel non disponible (virus d’Epstein-Barr, échovirus, coxsackie). Niveau 3 : virus fréquents non traitables (FSME, adénovirus, herpèsvirus humain 6, rougeole, rubéole). Niveau 4 : constellations particulières (poliovirus, rage, LCMV, hantavirus, voyage). Le niveau règle l’urgence et l’étendue de la recherche, pas la gravité du patient.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-voyage" data-title="Voyage : agents à évoquer"><p>Virus Toscana en Italie, virus West Nile en Méditerranée, encéphalite japonaise en Asie du Sud-Est, dengue et rage dans le monde. Un séjour en Afrique subsaharienne évoque la trypanosomiase africaine. L’anamnèse précise le lieu, la date et les piqûres, car la sérologie ou la PCR se choisit selon l’agent suspecté.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a>.</p></template>
<template data-pop="g02-ambition" data-title="Induction à dose unique d’amphotéricine B liposomale"><p>Le schéma alternatif de l’ECMM (amphotéricine B liposomale 10 mg/kg en dose unique, puis flucytosine 25 mg/kg 4 fois par jour pendant 14 jours et fluconazole 1200 mg/j) a été testé dans l’essai AMBITION en milieu à ressources limitées. Chez des adultes vivant avec le VIH en Afrique, la mortalité à 10 semaines était de 24,8 % avec la dose unique, contre 28,7 % avec le schéma comparé. L’information professionnelle suisse d’AmBisome® reprend une induction à haute dose analogue (10 mg/kg au premier jour). La transposition aux pays à ressources élevées n’est pas établie dans les sources lues.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a>.</p></template>
<template data-pop="g02-sexe" data-title="Femmes surreprésentées"><p>Les femmes représentent 54 % des méningites virales danoises, 77 % de celles à herpès simplex de type 2 et 79 % des radiculites d’Elsberg. Le sexe féminin est aussi associé à un risque relatif ajusté de 1,34 (intervalle de confiance à 95 % : 1,03–1,75) de pronostic défavorable à 30 jours après la sortie. Ces associations sont observationnelles : elles ne démontrent pas une cause.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a>.</p></template>

<template data-pop="g02-d-aciclovir" data-title="Aciclovir intraveineux : Labatec®"><div class="lab">Indications et doses</div><p>Adulte et plus de 12 ans : herpès simplex 5 mg/kg toutes les 8 heures ; zona de l’immunocompétent 5 mg/kg toutes les 8 heures ; zona de l’immunodéprimé à fonction rénale normale 10 mg/kg toutes les 8 heures pendant au moins 5 jours ; encéphalite herpétique 10 mg/kg toutes les 8 heures pendant 10 jours. Chez l’enfant de 3 mois à 12 ans, la FI distingue 250 mg/m² toutes les 8 heures pour l’herpès simplex ou l’infection varicelle-zona, et 500 mg/m² toutes les 8 heures pendant 10 jours pour l’encéphalite herpétique ; ne pas généraliser la première dose à toutes les indications. Infection néonatale à herpès simplex : 20 mg/kg toutes les 8 heures, 21 jours en cas d’atteinte du système nerveux. Perfusion lente en une heure.</p><div class="lab">Adaptation rénale</div><p>Clairance supérieure à 50 ml/min : dose usuelle toutes les 8 heures ; 25–50 : toutes les 12 heures ; 10–25 : toutes les 24 heures. Chez l’adulte et l’adolescent, pour une clairance de 0 à 10 ml/min, la FI indique la moitié de la dose usuelle toutes les 24 heures ; sous hémodialyse, la moitié de la dose usuelle toutes les 24 heures et après la dialyse. Les unités pédiatriques sont en ml/min/1,73 m² et relèvent du tableau propre à l’enfant.</p><div class="lab">Effets indésirables et précautions</div><p>Hydratation suffisante ; fonction rénale à surveiller aux fortes doses. Neurotoxicité (confusion, hallucinations, convulsions, coma) surtout en insuffisance rénale ou chez le sujet âgé, réversible, avec dialyse souvent efficace. Allaitement déconseillé.</p><div class="lab">Limites</div><p>L’information professionnelle ne comporte aucune indication « méningite » : le dosage dans la méningite est une extrapolation. Le palier de 0 à 10 ml/min et l’hémodialyse ont été relus dans la FI exacte le 2 novembre 2026 ; ils sont détaillés ci-dessus pour l’adulte et l’adolescent.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-aciclovir-duree" data-title="Contentieux : 10 jours ou au moins 14 jours d’aciclovir dans l’encéphalite herpétique ?"><div class="lab">Les deux textes</div><p>L’information professionnelle suisse (mise à jour de décembre 2025) indique 10 mg/kg toutes les 8 heures pendant <b>10 jours</b>. La directive S1 de la Société allemande de neurologie (février 2025) recommande 10 mg/kg trois fois par jour pendant <b>au moins 14 jours</b>.</p><div class="lab">Deux fonctions distinctes</div><p>La FI décrit l’utilisation autorisée du produit suisse ; la directive présente une recommandation clinique spécifique. La seule date de publication ne permet pas de choisir une durée pour un patient. Le cours conserve les deux durées et leur provenance, sans transformer la FI en recommandation préférentielle par automatisme chronologique.</p><div class="lab">Décision clinique</div><p>La durée doit être arrêtée avec l’équipe spécialisée selon le contexte, l’évolution et les recommandations applicables. Cette divergence reste à apprécier dans la décision médicale ; la présente relecture d’auteur ne la résout pas.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-d-valaciclovir" data-title="Valaciclovir : Mepha® et prévention des récidives"><p>L’information professionnelle suisse concerne les atteintes cutanéo-muqueuses (herpès génital, prévention des récidives, au maximum 12 mois avant réévaluation) ; elle ne comporte pas d’indication méningée. Adaptation rénale et neurotoxicité figurent comme pour l’aciclovir. Dans l’essai suédois de 101 adultes, 2 × 500 mg par jour pendant un an après 1 g trois fois par jour pendant une semaine n’ont pas empêché les récidives méningées (rebond la deuxième année, rapport de risques de 3,29).</p><p class="src">Références : <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680589210088" target="_blank" rel="noopener">Information professionnelle suisse Valaciclovir-Mepha®, décembre 2025</a>.</p></template>
<template data-pop="g02-d-brivudine" data-title="Brivudine : alternative et contre-indication"><p>La FI suisse de Brivex® autorise le traitement du zona précoce chez l’adulte immunocompétent : 125 mg une fois par jour pendant 7 jours. Elle ne comporte aucune indication méningée ni encéphalitique ; la mention d’une alternative dans une directive ne doit pas devenir une indication suisse.</p><p><b>Interaction potentiellement mortelle :</b> contre-indication en cas de fluoropyrimidines reçues récemment, en cours ou prévues dans les 4 semaines ; cela inclut le 5-fluorouracile topique, ses promédicaments et la flucytosine. Respecter au moins 4 semaines entre la fin de la brivudine et le début d’une fluoropyrimidine.</p><p>Brivex est également contre-indiqué chez l’immunodéprimé, l’enfant ou l’adolescent, et pendant la grossesse ou l’allaitement. En cas de prise concomitante accidentelle, la FI demande arrêt des deux médicaments, hospitalisation immédiate et contact rapide avec Tox Info Suisse.</p><p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680554650024" target="_blank" rel="noopener">FI suisse Brivex®,mai 2022,consultée le 2 novembre 2026</a>.</p></template>
<template data-pop="g02-d-ambisome" data-title="Amphotéricine B liposomale : AmBisome®"><div class="lab">Doses</div><p>Méningite cryptococcique associée au VIH, selon la FI AmBisome : induction standard 3–6 mg/kg/j en association pendant au moins 14 jours ; induction à haute dose : 10 mg/kg au 1er jour avec flucytosine 100 mg/kg/j et fluconazole 1200 mg/j pendant 14 jours. L’essai AMBITION compare la dose unique (mortalité à 10 semaines 24,8 %) à la voie standard (28,7 %).</p><div class="lab">Toxicité</div><p>Moindre néphrotoxicité que la forme conventionnelle, mais réelle ; hypokaliémie 19 % dans la FI AmBisome ; hyperkaliémie possible. Surveillance du potassium, du magnésium, des fonctions rénale et hépatique et de l’hémogramme.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a>.</p></template>
<template data-pop="g02-d-flucytosine" data-title="Flucytosine : produit, rein et surveillance"><div class="lab">Distinguer les produits et les sources</div><p>Dans la cryptococcose, le guide ECMM/ISHAM 2024 utilise 25 mg/kg quatre fois par jour, en association lors de l’induction. La monographie ci-dessous concerne <b>Ancotil 500 mg, comprimé oral français</b>, RCP du 1er septembre 2025. Ce n’est pas la FI d’une solution injectable suisse.</p><p>Swissmedic a publié en août 2024 la conversion de l’autorisation suisse 40467 d’Ancotil injectable à 1 % vers une distribution uniquement à l’étranger. Le nom figure encore dans la liste administrative des médicaments autorisés au 30 septembre 2026. Ni cette présence ni la validité annoncée de l’autorisation ne prouvent une commercialisation en Suisse. La FI suisse actuelle et l’approvisionnement hospitalier restent à vérifier avec la pharmacie.</p><div class="lab">Posologie orale du produit français</div><p>Le RCP prévoit 100 à 200 mg/kg par jour en trois ou quatre prises, selon l’infection, sa localisation et la sensibilité. Cette plage générale ne remplace pas le schéma spécifique de la cryptococcose. La flucytosine doit être associée à un autre antifongique pour limiter l’émergence de résistances, notamment dans les candidoses et cryptococcoses.</p><table class="t"><thead><tr><th>Clairance de la créatinine</th><th>Dose par prise et intervalle selon le RCP oral</th></tr></thead><tbody><tr><td>Au moins 40 ml/min</td><td>25 à 50 mg/kg toutes les 6 heures</td></tr><tr><td>De 20 inclus à moins de 40 ml/min</td><td>25 à 50 mg/kg toutes les 12 heures</td></tr><tr><td>De 10 inclus à moins de 20 ml/min</td><td>25 à 50 mg/kg toutes les 24 heures</td></tr><tr><td>Moins de 10 ml/min</td><td>Une dose de 25 mg/kg, puis dosage plasmatique 12 heures après avant toute nouvelle dose</td></tr></tbody></table><p>La molécule est dialysable : le RCP prévoit une nouvelle administration après chaque séance. Chez un patient anurique ou néphrectomisé hémodialysé, ne pas renouveler la dose initiale avant la séance suivante. La prescription doit rester liée au calendrier de dialyse et aux concentrations mesurées.</p><div class="lab">Surveiller l’exposition et les organes</div><p>Contrôler l’hémogramme, le bilan hépatique et la fonction rénale avant puis pendant le traitement, et mesurer les concentrations de flucytosine pour adapter la dose. Le RCP indique une concentration sérique moyenne à l’équilibre de 35 à 70 µg/ml ; éviter des concentrations inférieures à 25 µg/ml et des taux prolongés supérieurs à 100 µg/ml. Il ne faut pas transformer cette cible moyenne en seuil résiduel sans protocole de prélèvement approprié.</p><p>Une atteinte médullaire ou hépatique, une insuffisance rénale et l’association à d’autres médicaments toxiques exigent une surveillance renforcée. La flucytosine peut perturber certaines méthodes enzymatiques de mesure de créatinine : discuter la méthode du laboratoire devant une discordance.</p><div class="lab">Contre-indications et interactions</div><p>Le déficit complet connu en dihydropyrimidine déshydrogénase, l’allaitement, l’hypersensibilité et les associations avec certains inhibiteurs de cette enzyme sont contre-indiqués. La brivudine, la sorivudine, leurs analogues et l’uracile exposent à une toxicité liée au 5-fluoro-uracile, métabolite de la flucytosine. Attendre au moins quatre semaines après brivudine ou sorivudine avant Ancotil. L’association tégafur/giméracil/otéracil est également contre-indiquée ; le RCP impose au moins sept jours après son arrêt avant Ancotil. Les toxicités médullaires peuvent s’additionner avec la zidovudine, le ganciclovir, le valganciclovir, les cytotoxiques et certains immunosuppresseurs.</p><div class="lab">Grossesse, contraception et enfant</div><p>Éviter pendant la grossesse, sauf nécessité absolue pour une infection menaçant la vie, sans alternative efficace. Si l’exposition est indispensable, informer du risque et organiser la surveillance prénatale, postnatale et, jusqu’à l’accouchement, néonatale hématologique et hépatique. Le RCP demande une contraception efficace pendant le traitement puis six mois chez la femme et trois mois chez l’homme ou sa partenaire ; ajouter deux mois en cas d’insuffisance rénale. L’allaitement est contre-indiqué.</p><p>Le RCP oral ne fournit pas de posologie pédiatrique étayée et restreint l’emploi chez l’enfant à une association, quand les autres traitements appropriés ne sont pas disponibles et ne seront probablement pas efficaces. Les comprimés ne conviennent pas aux enfants incapables d’avaler une forme solide. La dose adulte ne doit pas être simplement transposée au nouveau-né : l’élimination prolongée et l’index thérapeutique étroit imposent une expertise et des dosages plasmatiques.</p><p class="src"><a href="https://base-donnees-publique.medicaments.gouv.fr/medicament/68758674/extrait" target="_blank" rel="noopener">Ancotil 500 mg, RCP français de l’Agence nationale de sécurité du médicament du 1er septembre 2025, §§4.1–5.2</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/en/dokumente/stab/journal/swissmedic-journal_08-2024.pdf.download.pdf/Swissmedic%2520Journal%252008-2024_web.pdf" target="_blank" rel="noopener">Swissmedic Journal août 2024, p. 648</a> ; <a href="https://www.swissmedic.ch/swissmedic/fr/home/services/listen_neu.html" target="_blank" rel="noopener">Swissmedic, liste au 30 septembre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM 2024, cryptococcose</a>. Passages lus le 2 novembre 2026.</p></template>
<template data-pop="g02-d-fluconazole" data-title="Fluconazole : Sandoz® eco"><p>Méningite : 400 mg le premier jour, puis 200–400 mg/j (jusqu’à 800 mg si menace vitale), au moins 6 à 8 semaines. Prophylaxie des récidives : 200 mg/j, durée illimitée. La concentration dans le liquide atteint environ 80 % de la concentration plasmatique en cas de méningite. Les associations avec des substrats du CYP3A4 susceptibles d’allonger le QT, notamment amiodarone, quinidine, érythromycine ou sertindole, sont contre-indiquées. Les autres associations nécessitent une vérification spécifique ; les interactions ne se résument pas au CYP3A4. Corriger les troubles électrolytiques et surveiller la fonction hépatique. Pour un traitement à doses multiples, après la dose initiale, la FI conserve 100 % de la dose si la clairance dépasse 50 ml/min et 50 % si elle est au plus de 50 ml/min sans dialyse ; en hémodialyse, 100 % après chaque séance. En consolidation de la cryptococcose : 400–800 mg/j pendant 8 semaines, puis 200 mg/j pendant 12 mois.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></template>
<template data-pop="g02-d-fexinidazole" data-title="Fexinidazole Winthrop 600 mg : conditions exactes"><div class="lab">Produit et population</div><p>Le résumé des caractéristiques du produit publié par l’Agence européenne des médicaments le 17 octobre 2025 concerne les deux stades de la trypanosomiase gambiense et rhodesiense chez l’adulte et l’enfant d’au moins 6 ans pesant au moins 20 kg. Il accompagne un avis pour une utilisation hors Union européenne ; il ne constitue pas une autorisation suisse ni une autorisation de mise sur le marché dans l’Union européenne.</p><div class="lab">Prise orale quotidienne pendant 10 jours</div><table class="t"><thead><tr><th>Poids</th><th>Jours 1 à 4</th><th>Jours 5 à 10</th></tr></thead><tbody><tr><td>Au moins 35 kg</td><td>1800 mg, soit 3 comprimés, une fois par jour</td><td>1200 mg, soit 2 comprimés, une fois par jour</td></tr><tr><td>Au moins 20 kg et moins de 35 kg</td><td>1200 mg, soit 2 comprimés, une fois par jour</td><td>600 mg, soit 1 comprimé, une fois par jour</td></tr></tbody></table><p>Prendre avec de la nourriture, chaque jour vers la même heure. Le guide OMS 2024 demande une prise directement observée avec un repas solide substantiel ; le RCP permet aussi, chez certains patients, une prise à domicile sous surveillance d’un aidant informé. Le cadre doit être fixé par une équipe formée à la trypanosomiase. Un premier vomissement ne justifie pas de reprendre la dose ; après un second épisode, contacter l’équipe. Une première dose manquée est rattrapée en poursuivant le calendrier jusqu’à une cure complète ; un second oubli impose une décision de l’équipe.</p><div class="lab">Gravité et précautions</div><p>Pour gambiense, l’OMS privilégie NECT dès 100 leucocytes/µl ; le RCP formule son avertissement pour plus de 100 leucocytes/µl et réserve alors le fexinidazole à l’absence d’alternative adéquate disponible ou tolérée. Ces seuils textuels ne sont pas identiques. Ne pas appliquer cette stratification à rhodesiense.</p><p>Le produit est contre-indiqué en cas d’atteinte hépatique sévère (Child-Pugh C ou décompensation) et dans les situations à risque de prolongation du QT décrites au RCP, notamment anomalies électrolytiques non corrigées ou associations proarythmiques. En insuffisance hépatique légère ou modérée, aucune adaptation n’est demandée mais la prudence reste requise. Aucune adaptation rénale n’est prévue ; l’absence de données en insuffisance rénale sévère impose néanmoins la prudence. Une hospitalisation est prévue en cas de risque de mauvaise observance ou d’antécédents/troubles psychiatriques. Les idées suicidaires imposent un contact médical immédiat.</p><p>Vérifier les interactions : produits allongeant le QT, provoquant une bradycardie ou une hypokaliémie sont notamment contre-indiqués en association. Le RCP demande cinq demi-vies d’élimination du médicament concerné avant le fexinidazole, ou sept jours après la fin du fexinidazole avant de débuter ce médicament. Éviter l’alcool pendant la cure et pendant 48 heures après. D’autres interactions enzymatiques nécessitent la consultation de la liste complète du RCP.</p><p>Il n’existe pas de données chez la femme enceinte : éviter de préférence au premier trimestre et évaluer le bénéfice-risque aux deuxième et troisième trimestres. Pendant l’allaitement, mettre en balance les bénéfices pour la mère et l’enfant ; ne pas présenter cette situation comme une contre-indication absolue issue du RCP.</p><p class="src"><a href="https://www.ema.europa.eu/en/documents/outside-eu-product-information/fexinidazole-winthrop-product-information_en.pdf" target="_blank" rel="noopener">Fexinidazole Winthrop 600 mg, RCP EMA, mise à jour du 17 octobre 2025, §§4.1–4.6</a> ; <a href="https://iris.who.int/handle/10665/378083" target="_blank" rel="noopener">OMS 2024, choix thérapeutiques et administration</a>. Passages lus le 2 novembre 2026 ; statut suisse non établi.</p></template>
<template data-pop="g02-interactions" data-title="Interactions et précautions"><table class="t"><thead><tr><th>Association</th><th>Risque</th><th>Conduite</th></tr></thead><tbody><tr><td>Brivudine + fluoropyrimidines</td><td>Toxicité potentiellement mortelle</td><td>Contre-indiquée ; respecter notamment 4 semaines entre l’arrêt de la brivudine et le début d’une fluoropyrimidine</td></tr><tr><td>Fluconazole + substrats du CYP3A4 allongeant le QT</td><td>Tachyarythmies ventriculaires, torsades de pointes</td><td>Association contre-indiquée, notamment avec amiodarone, quinidine, érythromycine ou sertindole ; vérifier séparément les autres interactions</td></tr><tr><td>Aciclovir + insuffisance rénale ou âge avancé</td><td>Neurotoxicité</td><td>Adapter la dose, hydrater, dialyser si besoin</td></tr></tbody></table><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></template>
<template data-pop="g02-eviter" data-title="Médicaments à éviter : justification"><p>Le schéma étudié de valaciclovir préventif, 500 mg deux fois par jour pendant un an, n’a pas montré de bénéfice méningé. Les corticoïdes systématiques, l’acétazolamide et le mannitol sont possiblement délétères dans la cryptococcose. La brivudine est dangereuse avec les fluoropyrimidines. Dans la candidose du système nerveux, le guide ECMM 2025 ne recommande pas la formulation désoxycholate lorsque la liposomale est disponible.</p><p class="src">Références : <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener">ECMM/ISHAM, candidose, 2025, principes du système nerveux</a>.</p></template>
<template data-pop="g02-mnemo" data-title="Aides pédagogiques (non critères officiels)"><p><b>2-8-12</b> : induction 2 semaines, consolidation 8 semaines, entretien 12 mois dans la cryptococcose. <b>CCF</b> : Conscience altérée, Crise, signe Focal → aciclovir immédiat. Ces mnémoniques sont une aide pédagogique, non un critère officiel.</p></template>
<template data-pop="pareto-g02-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="g02-0,g02-1,g02-2,g02-3,g02-4,g02-5,g02-6"></p><ul><li>Le code G02* est un astérisque : il accompagne toujours le code † de la maladie causale ; G03.0 désigne la méningite non purulente ; G05.1* concerne une atteinte encéphalitique virale classée ailleurs, selon la maladie retenue.</li><li>La forme virale isolée typique respecte la conscience ; une anomalie exige une réévaluation. Habituellement moins de 1000 cellules par µl, protéines et lactate peu élevés.</li><li>Entérovirus 39 %, herpès simplex de type 2 16 %, varicelle-zona 15 %, inconnu 27 % ; incidence 4,7 pour 100 000 par an (Danemark).</li><li>Le liquide précoce est mixte (4–48 h), puis lymphocytaire ; un liquide à granulocytes n’exclut pas un virus.</li><li>La triade céphalées, raideur de nuque et photophobie ou hyperacousie est présente chez 28 % ; l’absence de raideur de nuque n’exclut rien.</li><li>Contextes à chercher : immunodépression, VIH, voyage, tique, herpès génital, zona, médicaments.</li></ul></template>
<template data-pop="pareto-g02-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="g02-7,g02-8"></p><ul><li>Procalcitonine inférieure à 0,5 ng/ml : orientation virale ; ce marqueur ne doit pas être utilisé seul pour exclure une méningite bactérienne aiguë.</li><li>PCR du liquide en première intention ; indice d’anticorps tardif (après 10 jours).</li><li>Suspicion d’encéphalite herpétique → aciclovir i.v. immédiat, sans attendre la ponction ni la PCR.</li><li>Doute bactérien → antibiothérapie probabiliste urgente selon SSI et risque de Listeria.</li><li>Cryptococcose : pression d’ouverture d’au moins 20 cm d’eau avec symptômes → ponctions évacuatrices.</li></ul></template>
<template data-pop="pareto-g02-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="g02-9,g02-10,g02-11"></p><ul><li>Méningite virale isolée : traitement symptomatique ; la PCR rapide des entérovirus aide à réévaluer les antibiotiques selon le contexte clinique.</li><li>Valaciclovir préventif des récidives de méningite à herpès simplex de type 2 : non recommandé.</li><li>Aciclovir : 10 mg/kg/8 h dans l’encéphalite, 10 jours (information professionnelle) ou au moins 14 jours (directive S1).</li><li>Brivudine contre-indiquée avec les fluoropyrimidines (dont la flucytosine).</li><li>Cryptococcose : amphotéricine B liposomale + flucytosine 2 semaines, fluconazole 8 semaines puis 12 mois, antirétroviral à 4–6 semaines.</li><li>Prévention des oreillons, de la rougeole et de la rubéole par le vaccin ROR/RORV.</li></ul></template>
<template data-pop="pareto-g02-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="g02-12,g02-13,g02-14"></p><ul><li>Pronostic défavorable à 30 jours après la sortie chez 20 % des adultes, dans cette cohorte, sans différence nette selon l’étiologie.</li><li>Mollaret : 22 % des méningites à herpès simplex de type 2 évoluent ainsi ; récidive hospitalisée 6 % par an.</li><li>Elsberg : rétention urinaire exigée dans la série citée ; 11 % encore sondés à 30 jours après la sortie.</li><li>Cryptococcose : mortalité 24–47 % à 10 semaines dans les études citées, principalement en contexte de ressources limitées.</li><li>Infection néonatale à herpès simplex : aciclovir 20 mg/kg/8 h, 21 jours en cas d’atteinte du système nerveux.</li></ul></template>
<template data-pop="pareto-g02-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="g02-e-1,g02-e-2,g02-e-3,g02-e-4,g02-e-5,g02-e-6"></p><ul><li>Question avant examen : écarter l’urgence, puis caractériser le liquide, puis identifier l’agent.</li><li>Liquide : moins de 5 cellules normalement ; viral : souvent moins de 1000 par µl, mais ce seuil n’exclut pas une cause virale.</li><li>PCR d’ADN pour les herpèsvirus, PCR d’ARN pour les entérovirus.</li><li>IRM, méthode de choix dans l’encéphalite ; scanner insuffisant.</li><li>Cryptocoque : pression d’ouverture, antigène du liquide et du sang, culture.</li></ul></template>
<template data-pop="pareto-g02-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g02-p-1,g02-p-2,g02-p-3,g02-p-4,g02-p-5,g02-p-6"></p><ul><li>Aciclovir i.v. : traitement urgent de référence si encéphalite herpétique suspectée ; adapter à la clairance et discuter les résistances.</li><li>Amphotéricine B liposomale : surveiller le potassium (hypokaliémie 19 % dans la FI AmBisome).</li><li>Fluconazole : QT et CYP3A4.</li><li>À éviter : valaciclovir préventif, dexaméthasone systématique, acétazolamide, mannitol, brivudine avec fluoropyrimidine.</li></ul></template>
<template data-pop="pareto-g02-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="g02-s-physio-body"></p><ul><li>Moins de 5 leucocytes par µl normalement.</li><li>Phase mixte puis lymphocytaire.</li><li>Une pression élevée peut contribuer aux troubles visuels ou auditifs ; la mesurer et rechercher les autres causes.</li></ul></template>
<template data-pop="pareto-g02-s-immu" data-title="Pareto — Immunologie"><p class="ratio" data-cover="g02-s-immu-body"></p><ul><li>Synthèse intrathécale à interpréter selon agent et chronologie ; elle peut aussi documenter certaines méningites virales.</li><li>Indice supérieur à 1,5 après plus de 10 jours dans l’encéphalite.</li><li>L’immunosuppression élargit les agents à rechercher.</li></ul></template>
<template data-pop="pareto-g02-s-viro" data-title="Pareto — Virologie"><p class="ratio" data-cover="g02-s-viro-body"></p><ul><li>PCR d’ADN : herpèsvirus ; PCR d’ARN : entérovirus et VIH.</li><li>PCR rapide : 60 h → 5 h.</li><li>La PCR du virus d’Epstein-Barr peut être faussement positive en cas de pléiocytose.</li></ul></template>
<template data-pop="pareto-g02-s-myco" data-title="Pareto — Mycologie et parasitologie"><p class="ratio" data-cover="g02-s-myco-body"></p><ul><li>Certains tests d’antigène manquent C. gattii.</li><li>Gambiense : lent, 92 % des cas ; rhodesiense : rapide.</li><li>Stade 2 : plus de 5 leucocytes/µl ou parasites dans le liquide ; le sommeil seul ne définit pas le stade.</li></ul></template>

<template data-pop="pareto-g02-anat" data-title="Repères anatomiques : enveloppes et limites de la planche"><p>Identifier l’os puis la dure-mère, l’arachnoïde et la pie-mère sur l’original. Le sinus sagittal supérieur a sa propre légende. Cette image normale ne diagnostique ni infection ni hypertension ; revenir à la clinique et aux explorations pour ces questions.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener">Carter/Gray1918,planche1196</a>.</p></template>

<template data-pop="g02-d-nifurtimox" data-title="Nifurtimox : Lampit espagnol, produit exact"><div class="lab">Indication et schéma du produit</div><p>Le RCP espagnol de Lampit 30 mg et 120 mg, révisé en février 2024, inclut Chagas chez l’enfant né à terme pesant au moins 2,5 kg et chez l’adulte après décision individuelle de bénéfice-risque. Ce statut espagnol ne prouve pas la disponibilité en Suisse.</p><p>Chez l’adulte : 8–10 mg/kg/j par voie orale en trois prises avec nourriture, pendant 60 à 120 jours selon ce RCP. Chez l’enfant de moins de 18 ans : 8–10 mg/kg/j si le poids est d’au moins 40 kg, 10–20 mg/kg/j en dessous de 40 kg, pendant 60 jours. Le seuil espagnol est 40 kg ; ne pas lui substituer celui d’un autre libellé. Les tables du RCP permettent l’arrondi aux comprimés. Pas de dose établie ici pour un prématuré ou un nouveau-né de moins de 2,5 kg.</p><div class="lab">Tolérance et adaptations</div><p>L’insuffisance rénale ou hépatique impose prudence et supervision étroite, sans algorithme chiffré d’adaptation dans ce RCP. Contrôler le poids tous les 14 jours et ajuster si nécessaire ; anorexie et perte de poids peuvent compromettre le traitement. Troubles neurologiques ou psychiatriques, notamment antécédents de crises ou lésion cérébrale, exigent une surveillance rapprochée et une appréciation individuelle. Une hypersensibilité grave conduit à envisager l’arrêt. La porphyrie nécessite une vigilance particulière.</p><p>L’alcool pendant la cure est contre-indiqué. Les études cliniques d’interactions manquent ; les données de laboratoire ne dispensent pas de revoir les associations. Une dose oubliée peut être prise avec nourriture jusqu’à trois heures avant la suivante ; au-delà, la sauter sans doubler.</p><div class="lab">Grossesse et allaitement</div><p>Faire un test de grossesse avant traitement si pertinent. Une contraception efficace est demandée pendant la cure et six mois après chez la femme ; le préservatif pendant la cure et trois mois après chez l’homme dont la partenaire peut être enceinte. Éviter pendant la grossesse, sauf nécessité immédiate ne pouvant attendre l’accouchement. Pour l’allaitement, choisir entre son interruption et celle du traitement en pesant les bénéfices pour la mère et l’enfant.</p><p class="src"><a href="https://cima.aemps.es/cima/dochtml/ft/89507/FT_89507.html" target="_blank" rel="noopener">AEMPS, RCP Lampit 30 mg et 120 mg, février 2024, sections 4.1–4.8</a>, lu le 2 novembre 2026. Le schéma NIH de 60 jours chez l’adulte/adolescent avec VIH a une population et une portée différentes.</p></template>
<template data-pop="g02-d-benznidazole" data-title="Benznidazole : recommandation adulte et libellé pédiatrique"><div class="lab">Ne pas confondre les deux cadres</div><p>Le NIH recommande chez l’adulte/adolescent avec VIH et maladie aiguë ou réactivée 5–8 mg/kg/j par voie orale, répartis en deux prises, pendant 60 jours ; la plupart des experts limitent la dose à 300 mg/j. L’incertitude des données doit accompagner ce schéma.</p><p>Le produit exact américain Benznidazole Tablets d’Exeltis existe à 12,5 mg et 100 mg. Le libellé consulté autorise le traitement de Chagas chez l’enfant de 2 à 12 ans, à 5–8 mg/kg/j en deux prises séparées d’environ 12 heures pendant 60 jours, avec ou sans nourriture. Cette dose pédiatrique ne constitue pas une autorisation adulte ou suisse. Le libellé clinique affiche une révision de décembre 2021, dans un document DailyMed dont les métadonnées ont été révisées en août 2026.</p><div class="lab">Risques et surveillance du produit</div><p>Contre-indications : hypersensibilité aux nitroimidazolés, disulfirame pris dans les deux semaines précédentes, syndrome de Cockayne. Une réaction cutanée grave impose l’arrêt ; une éruption avec fièvre, purpura ou adénopathies justifie aussi l’arrêt et une évaluation. Des paresthésies ou symptômes de neuropathie conduisent à interrompre immédiatement le traitement. Contrôler l’hémogramme, avec leucocytes totaux et formule avant, pendant et après la cure. L’utilisation en insuffisance rénale ou hépatique n’a pas été évaluée dans ce libellé : aucune adaptation chiffrée n’en est déduite.</p><p>Le NIH préconise une abstinence d’alcool. Le libellé exact consulté précise toutefois que les données de laboratoire ne font pas attendre de réaction de type disulfirame avec le benznidazole ; ne pas présenter une telle réaction comme démontrée. L’interdiction du disulfirame reste distincte.</p><div class="lab">Reproduction</div><p>Le produit peut nuire au fœtus. Test de grossesse si pertinent et contraception pendant le traitement puis cinq jours après. Le traitement d’une infection chronique pendant la grossesse n’est pas recommandé ; une maladie aiguë symptomatique grave appelle une décision individuelle. L’allaitement n’est pas recommandé pendant la cure. Un effet sur la fertilité masculine est observé chez l’animal, sans quantification établie chez l’humain.</p><p class="src"><a href="https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=8983d6a0-f63f-4f8e-bba4-38223f39e29b" target="_blank" rel="noopener">Benznidazole Tablets, Exeltis, libellé DailyMed, sections 1–2, 4–5, 7–8</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/chagas-disease" target="_blank" rel="noopener">NIH, Chagas disease, revue mars 2026</a>. Passages lus le 2 novembre 2026 ; FI suisse non retrouvée par la recherche de nom effectuée.</p></template>

<template data-pop="g02-d-foscarnet" data-title="Foscavir : portée de la FI suisse"><p>Foscavir de Curatis est une solution intraveineuse à 24 mg/ml. La FI suisse de juin 2022 couvre les atteintes à cytomégalovirus menaçant la vue chez les patients atteints du sida et l’herpès mucocutané résistant à l’aciclovir chez l’immunodéprimé. Elle précise que la sécurité et l’efficacité dans l’encéphalite n’ont pas été étudiées. Le recours au foscarnet cité par la DGN dans une résistance herpétique neurologique exige donc une expertise ; les doses de rétinite ou de lésions muqueuses ne sont pas transposées ici.</p><p>Le risque rénal impose hydratation, contrôles fréquents de créatinine et adaptation par le tableau du produit. Le calcium ionisé peut diminuer malgré une calcémie totale normale ; surveiller aussi magnésium et autres électrolytes. QT, convulsions et associations néphrotoxiques sont des points de vigilance. La FI ne recommande pas l’usage chez l’enfant/adolescent ou l’hémodialysé ; elle demande de ne pas traiter pendant la grossesse ou l’allaitement. L’hypersensibilité est contre-indiquée. Vérifier les incompatibilités de perfusion, sans mélange ou administration par la même ligne non validés.</p><p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680523570131" target="_blank" rel="noopener">FI suisse Foscavir, juin 2022, indications, précautions, interactions et reproduction</a>, passages lus le 2 novembre 2026.</p></template>
