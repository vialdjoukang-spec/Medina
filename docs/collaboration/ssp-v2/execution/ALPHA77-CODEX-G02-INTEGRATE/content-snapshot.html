rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-crit">▲ Loi de Pareto — Suivi, situations particulières et critères</button><h3 id="g02-profiles">Objectifs de formation suisses : partir de la situation</h3><p>Les pages officielles PROFILES 2023 présentent des situations de départ et des activités à exercer sous une supervision adaptée, et non une liste obligatoire de diagnostics ou de traitements. La correspondance ci-dessous est une proposition pédagogique de cette leçon, à partir des items effectivement lus ; ce n’est pas une validation officielle de G02.</p><table class="t"><thead><tr><th>Situation PROFILES</th><th>Travail demandé dans cette leçon</th></tr></thead><tbody><tr><td>G6 : fièvre ; S7.6 : céphalée ; S1.16 : raideur ou douleur cervicale ; S1.23 : troubles visuels dont photophobie</td><td>Construire l’anamnèse, examiner et confronter les signes sans les transformer en tests d’exclusion.</td></tr><tr><td>S7.10 : convulsion/crise ; S9.9 : confusion/délire ; F1.15 : altération de conscience/coma</td><td>Identifier l’urgence et demander l’aide appropriée, sans attendre un diagnostic étiologique définitif.</td></tr></tbody></table><p>Les activités professionnelles correspondantes comprennent l’anamnèse ciblée, l’examen physique et mental, la hiérarchisation des diagnostics, la justification et l’interprétation des examens, ainsi que la prise en charge initiale de l’urgence. La ponction lombaire figure parmi les procédures ; lire une leçon ne démontre pas la compétence pratique ni l’autonomie pour l’effectuer.</p><p class="src"><a href="https://smifk-cims.ch/profiles-2023/ssps" target="_blank" rel="noopener">PROFILES 2023, situations de départ, introduction et items cités</a> ; <a href="https://smifk-cims.ch/profiles-2023/epas" target="_blank" rel="noopener">PROFILES 2023, activités professionnelles, parties 1–4, 5v et 6</a>, passages lus le 2 novembre 2026.</p><h3 id="g02-pieges">Pièges à éviter</h3><p>Ne pas confondre la fréquence d’une association de symptômes avec une règle d’exclusion. Ne pas conclure « viral » à partir de la seule prédominance lymphocytaire. Enfin, ne pas appliquer une posologie générale d’aciclovir à toutes les indications ou à tous les âges : l’encéphalite et le nouveau-né ont des schémas propres, et la fonction rénale modifie l’administration.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§1.2</a> ; <a href="https://www.revmed.ch/view/445609/3798710/RMS_526_1310.pdf" target="_blank" rel="noopener">HUG / Revue Médicale Suisse2016,p.1313</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">FI Aciclovir Labatec,décembre2025</a>.</p></section>

<div class="panel" id="pE" hidden><nav class="toc ui"><b>Examens des méningites virales et fongiques</b><ol><li><a href="#g02-e-1">Indiquer un examen</a></li><li><a href="#g02-e-2">Ponction lombaire et liquide</a></li><li><a href="#g02-e-3">Sang et marqueurs</a></li><li><a href="#g02-e-4">Identifier l’agent</a></li><li><a href="#g02-e-5">Imagerie</a></li><li><a href="#g02-e-6">Configurations biologiques</a></li><li><a href="#g02-e-7">Entraînement</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="g02-e-1"><h2><span class="n">e-1</span>Indiquer un examen</h2><p>La question précise l’examen : écarter une urgence, caractériser le liquide, identifier l’agent ou chercher un terrain immunodéprimé. Aucun test unique ne répond à toutes ces questions. Pour l’identification d’un virus, la source de référence retient la <button class="w" data-k="g02-pcr-lcr">PCR sur le liquide céphalo-rachidien</button> en première intention ; pour la cryptococcose, l’<button class="w" data-k="g02-crag">antigène cryptococcique du liquide</button> et la culture.</p>
<table class="t"><thead><tr><th>Question</th><th>Examen</th><th>Statut</th></tr></thead><tbody><tr><td>Existe-t-il une méningite ?</td><td>Ponction lombaire : cellules, formule, protéines, glucose, lactate</td><td>Indiquée, après évaluation de sa sécurité, notamment si risque d’effet de masse ; ne retarde pas le traitement urgent. La pression élevée de la cryptococcose n’est pas, à elle seule, une interdiction des ponctions thérapeutiques</td></tr><tr><td>Est-ce bactérien ?</td><td>Procalcitonine sanguine, lactate du liquide, formule</td><td>Indiqués</td></tr><tr><td>Quel virus ?</td><td>PCR du liquide (herpès simplex, varicelle-zona, cytomégalovirus, entérovirus) ; PCR multiplex</td><td>Indiquée</td></tr><tr><td>Encéphalite ?</td><td>IRM cérébrale</td><td>Indiquée au moindre signe encéphalitique</td></tr><tr><td>Cryptocoque ?</td><td>Pression d’ouverture, antigène du liquide et du sang, culture, microscopie</td><td>Indiqués devant une suspicion de cryptococcose, quel que soit le statut immunitaire</td></tr><tr><td>Réponse tardive de l’hôte ?</td><td>Indice d’anticorps après 10 jours</td><td>Conditionnel (étiologie inconnue, encéphalite)</td></tr><tr><td>Étiologie encore inconnue ?</td><td>Séquençage de nouvelle génération</td><td>Non systématique, après le bilan standard</td></tr></tbody></table>
<p>Le tableau se lit de haut en bas comme une consultation : la question précède toujours l’examen. L’erreur qu’il évite est de multiplier les tests viraux avant d’avoir écarté une urgence bactérienne ou herpétique.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></section>
<section class="ilot" id="g02-e-2"><h2><span class="n">e-2</span>Ponction lombaire et liquide céphalo-rachidien</h2><p>La ponction lombaire est l’examen central ; son interprétation exige de connaître les valeurs normales et leur cinétique.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Normal</th><th>Méningite virale</th><th>Lecture</th></tr></thead><tbody><tr><td>Leucocytes</td><td>Moins de 5 par µl</td><td>25 à 1000 par µl (médiane 160, écart interquartile 60–358, dans la cohorte danoise)</td><td>Mixte aux 4–48 premières heures, puis lymphocytaire</td></tr><tr><td>Protéines</td><td>Non chiffrées dans les sources lues</td><td>Normales ou à peine élevées</td><td>Une hausse marquée s’écarte du tableau viral habituel ; à confronter au contexte</td></tr><tr><td>Lactate</td><td>Non chiffré dans les sources lues</td><td>Normal ou peu élevé dans le profil usuel ; repère DGN 4,0 mmol/l, non exclusif</td><td>Séparer viral et bactérien</td></tr><tr><td>Pression d’ouverture</td><td>Non chiffrée dans les sources lues</td><td>Non chiffrée dans les sources lues pour la forme virale</td><td>À mesurer à chaque ponction si cryptocoque : au moins 20 cm d’eau avec symptômes = prise en charge de la pression</td></tr></tbody></table>
<div class="trap"><span class="k">Piège</span> Un liquide à polynucléaires, quatre à quarante-huit heures après le début, ne prouve pas une cause bactérienne. L’inverse est vrai aussi : un lactate normal à lui seul ne dispense pas du contexte.</div>
<div class="trap"><span class="k">Erreur fréquente</span> Attendre le résultat de la PCR pour commencer l’aciclovir devant un signe encéphalitique. La PCR se prélève et le traitement part avant son résultat.</div>
<p>Dans la <button class="w" data-k="g02-pleiocytose-mixte">pléiocytose mixte</button> précoce, la décision s’appuie sur la procalcitonine, le lactate et l’évolution clinique. La conduite est détaillée à l’îlot 7 de l’onglet Pathologie.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></section>
<section class="ilot" id="g02-e-3"><h2><span class="n">e-3</span>Sang et marqueurs</h2><p>Le sang apporte trois réponses : le diagnostic différentiel avec une cause bactérienne, le terrain, et la présence du cryptocoque.</p>
<ul><li><b>Lymphocytose relative</b> : fréquente, non spécifique.</li>
<li><b><button class="w" data-k="g02-pct">Procalcitonine</button> inférieure à 0,5 ng/ml</b> : argument fort pour une cause virale, mais aucun marqueur isolé ne suffit à exclure une méningite bactérienne.</li>
<li><b>Protéine C réactive</b> : rarement supérieure à 50 mg/l dans les infections virales.</li>
<li><b>Sérologie du VIH</b> : à proposer devant un risque, car elle oriente vers le cryptocoque (CD4 inférieurs à 200 par mm³).</li>
<li><b>Antigène cryptococcique sanguin et hémocultures</b> : chez l’immunodéprimé ; le dépistage par test à flux latéral se fait chez l’adulte VIH dont les CD4 sont inférieurs à 200 par mm³. Certains tests commerciaux ne détectent pas <i>C. gattii</i>.</li></ul>
<div class="trap"><span class="k">Piège</span> Une procalcitonine basse est un argument, non un verdict : elle ne dispense pas du liquide.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></section>
<section class="ilot" id="g02-e-4"><h2><span class="n">e-4</span>Identifier l’agent</h2><p>Le choix du test dépend de l’agent et de la date d’apparition des symptômes.</p>
<table class="t"><thead><tr><th>Agent</th><th>Test de première intention</th><th>Test de seconde intention</th></tr></thead><tbody><tr><td>Herpès simplex, varicelle-zona, cytomégalovirus</td><td>PCR d’ADN dans le liquide</td><td>Indice d’anticorps après 2 semaines</td></tr><tr><td>VIH</td><td>PCR d’ARN et sérologie</td><td>—</td></tr><tr><td>Entérovirus</td><td>PCR d’ARN dans le liquide</td><td>—</td></tr><tr><td>FSME (voisinage)</td><td>Sérologie du sang et du liquide (indice d’anticorps)</td><td>PCR précoce</td></tr><tr><td>Rougeole, rubéole</td><td>Sérologie (indice d’anticorps)</td><td>—</td></tr><tr><td>Cryptocoque</td><td>Antigène du liquide et du sang, culture</td><td>Imagerie thoracique et cérébrale</td></tr></tbody></table>
<p>La <button class="w" data-k="g02-pcr-lcr">PCR du virus d’Epstein-Barr</button> peut être faussement positive en cas de pléiocytose : ce résultat s’interprète avec le contexte clinique. La <button class="w" data-k="g02-synthese-intrathecale">synthèse intrathécale d’anticorps</button> n’est utile qu’après plusieurs jours.</p>
<div class="key"><b>Retenir.</b> Le liquide non centrifugé reste le matériel de choix pour la PCR ; dans le sous-groupe genevois aux prélèvements complets, 62,5 % des enfants et aucun adulte avaient une détection dans le sang et les selles ; ce résultat ne s’étend pas à toutes les infections entérovirales.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></section>
<section class="ilot" id="g02-e-5"><h2><span class="n">e-5</span>Imagerie</h2><p>L’<b>IRM</b> est la méthode de choix devant un syndrome encéphalitique ; le scanner n’est qu’un dépistage ou un substitut quand l’IRM n’est pas disponible. Une atteinte temporale puis frontobasale évoque l’encéphalite herpétique ; une atteinte asymétrique des noyaux gris évoque la FSME. Dans la cryptococcose, une IRM cérébrale et un scanner thoracique sont demandés. Ces constats ne remplacent pas la ponction lombaire ni l’aciclovir.</p>
<div class="trap"><span class="k">Piège</span> Un scanner normal n’écarte pas une encéphalite et ne doit pas retarder l’antiviral devant un tableau évocateur.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></section>
<section class="ilot" id="g02-e-6"><h2><span class="n">e-6</span>Configurations biologiques</h2><p>Le tableau ci-dessous croise les diagnostics et leurs associations typiques. Il ne chiffre que ce que les sources chiffrent.</p>
<table class="t"><thead><tr><th>Diagnostic</th><th>Liquide</th><th>Sang</th><th>Imagerie</th><th>Confirmation</th></tr></thead><tbody><tr><td>Méningite virale</td><td>Souvent moins de 1000 cellules/µl, avec exceptions ; prédominance lymphocytaire fréquente</td><td>Procalcitonine inférieure à 0,5 ng/ml</td><td>Non nécessaire</td><td>PCR (entérovirus, herpès simplex, varicelle-zona)</td></tr><tr><td>Méningite bactérienne</td><td>Granulocytes persistants, lactate élevé</td><td>Procalcitonine élevée</td><td>Selon contexte</td><td>Coloration de Gram, culture et PCR selon SSI ; résultats à confronter au contexte</td></tr><tr><td>Encéphalite herpétique</td><td>Lactate habituellement peu augmenté, non exclusif</td><td>Non spécifique</td><td>Atteinte temporale puis frontobasale</td><td>PCR d’ADN de l’herpès simplex</td></tr><tr><td>Cryptococcose</td><td>Pression d’ouverture, antigène, culture</td><td>Antigène sanguin</td><td>Lésions éventuelles à l’IRM</td><td>Antigène du liquide ou culture</td></tr><tr><td>Encéphalite auto-immune</td><td>Pléiocytose possible, non obligatoire</td><td>Non précisé</td><td>IRM selon critères</td><td>Critères de Graus 2016</td></tr></tbody></table><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></section>
<section class="ilot" id="g02-e-7"><h2><span class="n">e-7</span>Entraînement</h2><div class="quiz ui"><p><b>Cas pédagogique fictif 1.</b> Un homme de 24 ans, vigil, a une fièvre, des céphalées et une raideur de nuque. Le liquide compte 190 cellules par µl, à prédominance lymphocytaire. La procalcitonine est à 0,2 ng/ml. La PCR rapide des entérovirus est positive après cinq heures. Que décidez-vous ?</p><button data-ok="1">Je réévalue les antibiotiques et les critères de sortie selon l’évolution et les diagnostics urgents, puis je traite les symptômes.</button><button data-ok="0">Je poursuis l’antibiothérapie dix jours par précaution.</button><button data-ok="0">Je débute l’aciclovir de façon systématique.</button><button data-ok="0">J’attends l’indice d’anticorps du liquide avant toute décision.</button><p class="fb" hidden>La procalcitonine basse, un liquide lymphocytaire et une PCR positive soutiennent une méningite entérovirale non compliquée. La PCR rapide a permis, à Lausanne, de réduire le séjour médian à 0,5 jour. Aucun antiviral n’est démontré utile dans cette forme, et l’indice d’anticorps est un outil tardif.</p></div><div class="quiz ui"><p><b>Cas pédagogique fictif 2.</b> Une femme de 52 ans, fébrile, présente une aphasie et une crise convulsive. La ponction lombaire est prévue après l’IRM. Quelle est la conduite ?</p><button data-ok="1">J’administre l’aciclovir intraveineux immédiatement, sans attendre la ponction ni la PCR.</button><button data-ok="0">J’attends le résultat de la PCR pour confirmer l’herpès simplex.</button><button data-ok="0">Je prescris des antalgiques et je surveille.</button><button data-ok="0">Je réalise d’abord un indice d’anticorps.</button><p class="fb" hidden>Les signes focaux et la crise basculent vers l’encéphalite. La directive impose l’aciclovir immédiat, sans attendre la ponction si elle est retardée par l’imagerie ou l’hypertension intracrânienne ; un traitement par céphalosporine et ampicilline est ajouté si une cause bactérienne n’est pas exclue.</p></div><div class="quiz ui"><p><b>Cas pédagogique fictif 3.</b> Un homme infecté par le VIH, CD4 à 80 par mm³, a des céphalées subaiguës et une baisse visuelle. La pression d’ouverture est de 32 cm d’eau, l’antigène cryptococcique est positif. Quelle mesure est prioritaire en plus de l’antifongique ?</p><button data-ok="1">Des ponctions lombaires évacuatrices quotidiennes.</button><button data-ok="0">De l’acétazolamide.</button><button data-ok="0">De la dexaméthasone systématique.</button><button data-ok="0">Un traitement antirétroviral immédiat.</button><p class="fb" hidden>La pression élevée explique la baisse visuelle. Les ponctions évacuatrices sont recommandées à partir de 20 cm d’eau symptomatique. L’acétazolamide et les corticoïdes sont possiblement délétères ; le traitement antirétroviral est habituellement différé de 4 à 6 semaines, avec individualisation selon le contexte.</p></div><div class="quiz ui"><p><b>Cas pédagogique fictif 4.</b> Un liquide prélevé six heures après le début des symptômes contient 300 cellules par µl, avec de nombreux granulocytes. La procalcitonine est à 0,3 ng/ml. Que retenez-vous ?</p><button data-ok="1">Une cause virale reste possible : la phase précoce est mixte ; l’antibiothérapie provisoire se justifie tant qu’une cause bactérienne n’est pas exclue.</button><button data-ok="0">Une méningite bactérienne est certaine.</button><button data-ok="0">Une méningite virale est exclue.</button><button data-ok="0">Il faut attendre 48 heures sans traitement.</button><p class="fb" hidden>Dans les 4 à 48 premières heures, le liquide viral est mixte. La décision tient compte de la procalcitonine, du lactate et de l’évolution.</p></div><div class="quiz ui"><p><b>Cas pédagogique fictif 5.</b> Le diagnostic final est documenté comme méningite non purulente, sans diagnostic étiologique plus précis. Quel libellé de la classification 2024 correspond à cette formulation ?</p><button data-ok="1">G03.0, méningite non purulente (« abactérienne »).</button><button data-ok="0">G02.0*, car le virus est probable.</button><button data-ok="0">G01*, car l’agent est inconnu.</button><button data-ok="0">G05.1*, car il s’agit d’une encéphalite.</button><p class="fb" hidden>G03.0 correspond au libellé non purulent. Une PCR négative seule ne suffit pas à choisir ce code : A87.9 existe pour une méningite virale non précisée. La décision administrative doit suivre le diagnostic documenté et les règles en vigueur.</p></div><button class="pareto-btn ui" data-k="pareto-g02-exam">▲ Loi de Pareto — Examens complémentaires</button></section>
</div><div class="pager ui"><button class="prev">← Îlot précédent</button><span></span><button class="next">Îlot suivant →</button></div></div>
<div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g02-tab-semio" role="tab" aria-selected="true" aria-controls="g02-s-semio" data-s="g02-s-semio">Sémiologie fondamentale et analytique</button><button id="g02-tab-anat" role="tab" aria-selected="false" aria-controls="g02-s-anat" data-s="g02-s-anat">Anatomie</button><button role="tab" aria-selected="false" aria-controls="g02-s-physio" data-s="g02-s-physio">Physiologie</button><button role="tab" aria-selected="false" aria-controls="g02-s-immu" data-s="g02-s-immu">Immunologie</button><button role="tab" aria-selected="false" aria-controls="g02-s-viro" data-s="g02-s-viro">Virologie diagnostique</button><button role="tab" aria-selected="false" aria-controls="g02-s-myco" data-s="g02-s-myco">Mycologie et parasitologie</button></div><div class="chap-body sci-body"><div class="sci" id="g02-s-semio" role="tabpanel" aria-labelledby="g02-tab-semio"><section class="ilot" id="g02-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La sémiologie relie une observation à une hypothèse, puis à un examen capable de la mettre à l’épreuve. Commencer par situer les enveloppes sur la planche anatomique : elle fournit un repère spatial, tandis que l’examen et le liquide renseignent sur la maladie. Un dessin normal ne permet pas de prédire le résultat d’une ponction.</p><figure id="g02-semio-figure" data-origin="human-original"><img src="assets/img/g02/alpha/codex/Gray1196.png" alt="Planche anatomique originale de Carter : de haut en bas, cuir chevelu, os crânien puis dure-mère, arachnoïde et pie-mère ; sinus sagittal supérieur au centre." width="648" height="450" loading="lazy"><figcaption><b>Lire les enveloppes, puis localiser le syndrome.</b> Les annotations françaises suivantes traduisent les légendes originales, sans modifier l’image.</figcaption><ol><li><b>Au-dessus :</b> « Cranial bone » désigne l’os crânien ; il ne fait pas partie des trois méninges.</li><li><b>Sous l’os :</b> « Dura mater », « Arachnoid » et « Pia mater » correspondent à la dure-mère, à l’arachnoïde et à la pie-mère.</li><li><b>Au centre :</b> « Superior sagittal sinus » désigne le sinus sagittal supérieur ; suivre le trait de légende permet de le distinguer des enveloppes voisines.</li></ol><p>La planche montre une organisation anatomique normale et simplifiée. Elle ne représente ni une méningite, ni une mesure de pression, ni une imagerie de patient.</p><p class="src">Henry Vandyke Carter, dans Henry Gray, <i>Anatomy of the Human Body</i>, édition 1918, planche 1196. <a href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener">Original et droits propres à la figure : domaine public</a>. Image intégrale non retouchée ; annotations en français.</p></figure></section><section class="ilot" id="g02-semio-signs" data-semiology="signs"><h3>Science → clinique. Décrire les symptômes et les signes</h3><p>Distinguer les plaintes — céphalées, gêne à la lumière ou au bruit, nausées — des observations, notamment la raideur de nuque et l’état de vigilance. La DGN décrit la forme virale isolée typique sans trouble persistant de la conscience ni signe focal ; leur apparition impose donc de réévaluer l’hypothèse clinique, même si des signes méningés persistent.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§1.2</a>.</p></section><section class="ilot" id="g02-semio-mechanisms" data-semiology="mechanisms"><h3>Relier la perturbation à sa conséquence</h3><p>Deux dimensions différentes peuvent coexister. La réaction inflammatoire modifie les cellules du liquide : le profil viral peut être mixte au début, puis lymphocytaire. Dans la cryptococcose, l’élévation de pression ajoute une complication qui exige sa propre évaluation et sa propre prise en charge. Identifier un agent ne renseigne donc pas, à lui seul, sur la pression intracrânienne.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM 2024,diagnostic et principe4</a>.</p></section><section class="ilot" id="g02-semio-examination" data-semiology="examination"><h3>Science → examen. Poser une question précise</h3><p>Rechercher d’abord des signes de choc, une éruption pétéchiale et une altération de la conscience, puis documenter les signes méningés et les anomalies neurologiques. La présence d’une parotidite ou de vésicules, notamment génitales, aide à orienter l’enquête. L’article genevois souligne toutefois qu’aucun signe méningé classique ne dispense, à lui seul, de l’analyse du liquide.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://www.revmed.ch/view/445609/3798710/RMS_526_1310.pdf" target="_blank" rel="noopener">HUG / Revue Médicale Suisse2016,p.1310–1311</a>.</p></section><section class="ilot" id="g02-semio-interpretation" data-semiology="interpretation"><h3>Interpréter sans transformer une tendance en certitude</h3><p>La proportion de patients présentant un symptôme n’est pas automatiquement la sensibilité d’un test. De même, un liquide à prédominance lymphocytaire ne prouve pas une origine virale : le travail genevois décrit cette possibilité dans une infection bactérienne débutante ou déjà traitée. L’interprétation garde donc ensemble la chronologie, les traitements reçus et les résultats microbiologiques.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://www.revmed.ch/view/445609/3798710/RMS_526_1310.pdf" target="_blank" rel="noopener">HUG / Revue Médicale Suisse2016,p.1313</a>.</p></section><section class="ilot" id="g02-semio-differentials" data-semiology="differentials"><h3>Comparer les hypothèses qui changent la conduite</h3><table class="t"><thead><tr><th>Observation</th><th>Hypothèse à examiner</th><th>Conséquence du raisonnement</th></tr></thead><tbody><tr><td>Conscience altérée, crise ou déficit focal.</td><td>Atteinte encéphalitique.</td><td>Ne pas conserver sans réévaluation l’étiquette de méningite isolée.</td></tr><tr><td>Terrain immunodéprimé ou présentation compatible.</td><td>Cryptococcose.</td><td>Rechercher l’atteinte du système nerveux, l’antigène et la pression ; une immunité supposée normale ne l’exclut pas.</td></tr><tr><td>État de choc ou pétéchies.</td><td>Infection invasive bactérienne.</td><td>Traiter ce tableau comme une urgence, sans attendre une classification définitive.</td></tr></tbody></table><p>Le tableau hiérarchise les décisions. Il n’attribue pas un agent à partir d’un signe isolé.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§1.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM 2024,populations et diagnostic</a> ; <a href="https://www.bag.admin.ch/fr/maladies-invasives-a-meningocoques" target="_blank" rel="noopener">OFSP,maladies invasives à méningocoques</a>.</p></section><section class="ilot" id="g02-semio-urgency" data-semiology="urgency"><h3>Science → traitement. Reconnaître l’urgence</h3><p>Une suspicion d’encéphalite herpétique impose un traitement sans attendre la confirmation virologique. Dans une cryptococcose, la recommandation ECMM/ISHAM demande la mesure de pression à chaque ponction ; une élévation symptomatique nécessite une prise en charge spécifique. Ce sont deux raisons distinctes de ne pas réduire l’urgence au seul résultat de la PCR.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§3.1 et3.2.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM 2024,principe4</a>.</p></section><section class="ilot" id="g02-semio-limits" data-semiology="limits"><h3>Adapter le raisonnement à la population et au contexte suisse</h3><p>Les HUG précisent que leurs résultats virologiques du liquide ne représentent pas l’ensemble des infections de la communauté. Ils ne doivent donc pas être transformés en incidence suisse. Pour les traitements, vérifier la FI du produit exact : les schémas de l’aciclovir diffèrent selon l’âge, l’indication et la fonction rénale. Une dose adulte ne devient pas pédiatrique par simple changement de poids.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://www.hug.ch/laboratoire-virologie/epidemiologie-virale-dans-liquides-cephalo" target="_blank" rel="noopener">HUG,épidémiologie virale des LCR</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">FI Aciclovir Labatec,décembre2025</a>.</p></section><section class="ilot" id="g02-semio-sources" data-semiology="sources"><h3>À retenir. Retrouver la preuve et ses limites</h3><p>La planche normale provient de Carter et Gray ; les symptômes et la chronologie du liquide sont confrontés à la DGN 2025. Le raisonnement d’examen et ses limites reposent sur la synthèse genevoise2016, distincte d’une recommandation thérapeutique actuelle. Les points concernant la cryptococcose renvoient à la recommandation ECMM/ISHAM 2024 ; les informations suisses proviennent des HUG, de l’OFSP et des FI exactes. Les passages relus sont indexés dans le dossier de preuve ; les sections héritées non revues gardent leur réserve.</p></section></div><div class="sci" id="g02-s-anat" role="tabpanel" aria-labelledby="g02-tab-anat" hidden><section class="ilot" id="g02-anatomie"><h2>Anatomie : lire les enveloppes sur un original humain</h2><p>Cette planche de Carter se lit du haut vers le bas. Elle commence par les tissus superficiels du cuir chevelu, puis montre l’os crânien. Les trois légendes placées sous cet os nomment les enveloppes : dure-mère, arachnoïde et pie-mère. Avant d’utiliser un mot dans le raisonnement clinique, retrouver sa structure sur l’image évite de confondre l’os, une enveloppe et le tissu situé au-dessous.</p><figure id="g02-anatomie-figure" data-origin="human-original"><img src="assets/img/g02/alpha/codex/Gray1196.png" alt="Planche anatomique originale de Carter : de haut en bas, cuir chevelu, os crânien puis dure-mère, arachnoïde et pie-mère ; sinus sagittal supérieur au centre." width="648" height="450" loading="lazy"><figcaption><b>Lire les enveloppes, puis localiser le syndrome.</b> Les annotations françaises suivantes traduisent les légendes originales, sans modifier l’image.</figcaption><ol><li><b>Au-dessus :</b> « Cranial bone » désigne l’os crânien ; il ne fait pas partie des trois méninges.</li><li><b>Sous l’os :</b> « Dura mater », « Arachnoid » et « Pia mater » correspondent à la dure-mère, à l’arachnoïde et à la pie-mère.</li><li><b>Au centre :</b> « Superior sagittal sinus » désigne le sinus sagittal supérieur ; suivre le trait de légende permet de le distinguer des enveloppes voisines.</li></ol><p>La planche montre une organisation anatomique normale et simplifiée. Elle ne représente ni une méningite, ni une mesure de pression, ni une imagerie de patient.</p><p class="src">Henry Vandyke Carter, dans Henry Gray, <i>Anatomy of the Human Body</i>, édition 1918, planche 1196. <a href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener">Original et droits propres à la figure : domaine public</a>. Image intégrale non retouchée ; annotations en français.</p></figure><h3>Science → examen. Suivre les traits de légende</h3><p>Le trait associé à « Dura mater » aboutit à la couche externe des enveloppes représentées. Les deux traits suivants désignent l’arachnoïde et la pie-mère. Au milieu de la planche, une autre légende identifie le sinus sagittal supérieur : elle nomme une structure distincte, et non une quatrième méninge. Les couleurs appartiennent à l’original historique ; elles ne constituent ni un code de gravité ni une mesure physiologique.</p><h3>Science → clinique. Passer du repère à la question clinique</h3><p>Le dessin aide à comprendre le vocabulaire de la leçon, mais il ne montre pas de lésion infectieuse. Pour distinguer un syndrome méningé d’une atteinte encéphalitique, il faut revenir aux observations du patient : vigilance, signes focaux et crises, puis aux explorations adaptées. Cette distinction clinique est expliquée dans le premier sous-onglet scientifique ; elle ne se déduit pas de l’apparence normale de cette image.</p><h3>À retenir. Connaître les limites du document</h3><p>Une planche ancienne simplifie les rapports et n’est pas une coupe radiologique. Les dimensions apparentes ne servent pas à mesurer une épaisseur, un volume ou une pression. L’original est conservé intégralement ; les annotations françaises sont placées autour de l’image dans le texte, ce qui permet de les lire et de les agrandir sans redessiner l’anatomie. Pour vérifier un repère, comparer le terme français, la légende anglaise et l’extrémité de son trait, puis revenir au texte clinique.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener">Carter/Gray1918,planche1196</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§1.2</a>.</p><p><b>Science → traitement.</b> Cette planche ne fournit aucune dose ni indication thérapeutique. Les choix de prise en charge viennent du syndrome et des sources cliniques ; une structure normale illustrée ne constitue pas une preuve de traitement.</p><button class="pareto-btn ui" data-k="pareto-g02-anat">▲ Loi de Pareto — Anatomie</button></section></div><div class="sci" id="g02-s-physio" hidden><section class="ilot" id="g02-s-physio-body"><h2><span class="n"></span>Physiologie : le liquide céphalo-rachidien, son contenu et sa pression</h2>
<p>Pourquoi le liquide céphalo-rachidien d’une méningite change-t-il en quelques heures, et pourquoi la pression d’ouverture devient-elle un signe de gravité dans la cryptococcose ? Les deux questions relèvent de la même physiologie : le liquide est un compartiment d’observation, qui reflète ce que vivent les méninges.</p>
<h3>Un compartiment presque sans cellules</h3>
<p>Le liquide céphalo-rachidien normal contient moins de 5 leucocytes par µl. Tout excès signale un afflux de cellules immunitaires dans l’espace sous-arachnoïdien. Dans la méningite virale, cet afflux est d’abord <b>mixte</b> (lymphocytes, monocytes, granulocytes ; 25 à 1000 cellules par µl pendant les 4 à 48 premières heures) puis <b>lymphocytaire</b>. Les protéines et le lactate varient peu : la DGN décrit un lactate habituellement peu augmenté dans le profil encéphalitique, sans en faire ici un critère d’exclusion.</p>
<figure><svg viewBox="0 0 420 302" role="img" aria-label="Physiologie du liquide céphalo-rachidien" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="12" y="12" width="396" height="44" rx="6"/><path d="M210 56v14m-5 -7l5 7 5 -7"/><rect x="12" y="70" width="396" height="62" rx="6"/><path d="M210 132v14m-5 -7l5 7 5 -7"/><rect x="12" y="146" width="396" height="62" rx="6"/><rect x="12" y="222" width="396" height="62" rx="6"/></g><g fill="#222" text-anchor="middle"><text x="210" y="39">Deux dimensions du liquide : cellules et pression</text><text x="210" y="97">Liquide céphalo-rachidien normal</text><text x="210" y="115">normal : moins de 5 leucocytes par µl</text><text x="210" y="173">Infection virale : afflux cellulaire</text><text x="210" y="191">mixte (4–48 h), puis lymphocytaire</text><text x="210" y="249">Autre situation : pression dans la cryptococcose</text><text x="210" y="267">troubles visuels ou auditifs possibles</text></g></svg><figcaption>Figure — Le profil cellulaire viral et la pression cryptococcique sont deux exemples distincts ; la méningite virale ne se transforme pas en cryptococcose. Schéma didactique original, non à l’échelle ; ce n’est pas une image clinique.</figcaption></figure>
<h3>La pression : pourquoi elle explique les symptômes</h3>
<p>Dans la cryptococcose, la pression d’ouverture élevée peut contribuer à une baisse visuelle ou auditive ; ces symptômes appellent une évaluation complète. Les ponctions évacuatrices retirent du liquide pour ramener la pression à 50 % de la valeur initiale ou à 20 cm d’eau au plus ; l’acétazolamide, le mannitol et les corticoïdes sont possiblement délétères. La mesure de la pression est donc un examen thérapeutique autant que diagnostique.</p>
<div class="key"><b>Science → clinique.</b> Un liquide précoce à granulocytes n’exclut pas un virus ; une pression élevée est la complication mécanique à traiter, indépendamment du pathogène ; une ponction n’est pas un simple prélèvement mais un geste qui peut soulager.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p><p><b>Science → examen.</b> Dans une cryptococcose, noter la pression d’ouverture à chaque ponction permet de suivre une dimension qui ne se confond pas avec l’identification du champignon.</p><p><b>Science → traitement.</b> La recommandation distingue traitement antifongique et contrôle de pression ; un prélèvement microbiologique ne remplace pas une mesure de pression.</p><p><b>À retenir.</b> La composition cellulaire, la microbiologie et la pression répondent à des questions différentes ; interpréter chacune avec la chronologie et le contexte.</p><p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM 2024,diagnostic et principes de prise en charge,relus le 2 novembre 2026</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§2 et3.1,passages relus le 2 novembre 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-s-physio">▲ Loi de Pareto — Physiologie</button></section></div><div class="sci" id="g02-s-immu"><section class="ilot" id="g02-s-immu-body"><h2><span class="n"></span>Immunologie : de la réponse locale à l’indice d’anticorps</h2>
<p>La synthèse intrathécale ne constitue pas une frontière absolue entre méningite et encéphalite : la cohorte danoise utilisait aussi des anticorps intrathécaux spécifiques pour documenter certaines méningites virales. La DGN décrit la réponse tardive dans l’encéphalite, généralement après plus de 10 jours. La date du prélèvement change donc la question posée ; une absence de réponse précoce ne clôt pas l’enquête.</p>
<h3>Comment se calcule l’indice</h3>
<p>L’indice d’anticorps compare la part d’anticorps spécifiques dans le liquide à celle du sérum, en rapportant chaque valeur aux IgG totales du compartiment. Ce rapport corrige le passage passif d’anticorps du sang vers le liquide. Quand la proportion d’anticorps spécifiques est plus forte dans le liquide que dans le sang, l’excès est produit sur place.</p>
<figure><svg viewBox="0 0 420 248" role="img" aria-label="Indice d’anticorps" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="12" y="12" width="396" height="44" rx="6"/><path d="M210 56v14m-5 -7l5 7 5 -7"/><rect x="12" y="70" width="396" height="44" rx="6"/><path d="M210 114v14m-5 -7l5 7 5 -7"/><rect x="12" y="128" width="396" height="44" rx="6"/><path d="M210 172v14m-5 -7l5 7 5 -7"/><rect x="12" y="186" width="396" height="44" rx="6"/></g><g fill="#222" text-anchor="middle"><text x="210" y="39">Anticorps et IgG dans le sérum</text><text x="210" y="97">Anticorps et IgG dans le liquide</text><text x="210" y="155">Indice = (Ac liquide × IgG sérum) ÷ (IgG liquide × Ac sérum)</text><text x="210" y="213">Supérieur à 1,5 : production locale</text></g></svg><figcaption>Figure — Principe de l’indice d’anticorps. Schéma didactique original ; ce n’est pas une image clinique.</figcaption></figure>
<p>Exemple chiffré fictif : anticorps du liquide 3, IgG du sérum 10, IgG du liquide 0,05, anticorps du sérum 100, dans des unités cohérentes. L’indice vaut (3 × 10) / (0,05 × 100) = 30 / 5 = <b>6</b>, supérieur à 1,5 : il y a une production locale.</p>
<h3>Du côté de l’hôte</h3>
<ul><li>Une immunosuppression élargit la liste des agents à rechercher : cytomégalovirus, virus d’Epstein-Barr, varicelle-zona, JCV, herpèsvirus humain 6 ; l’entérovirus 71 a été décrit sous anti-CD20.</li>
<li>Une encéphalite herpétique peut déclencher une encéphalite anti-NMDAR : l’auto-immunité se cherche quand aucun pathogène n’est identifié.</li></ul>
<div class="key"><b>Science → clinique.</b> L’indice d’anticorps confirme tard ; la PCR précoce guide la décision. L’absence de pathogène après un bilan standard fait envisager une encéphalite auto-immune.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p><p><b>Science → examen.</b> La recherche d’une réponse intrathécale est liée au délai d’évolution. Un résultat recueilli précocement ne répond donc pas à la même question qu’une analyse faite après plusieurs semaines. Documenter la date des symptômes et celle du prélèvement fait partie de l’interprétation.</p><p><b>Science → traitement.</b> Devant une suspicion d’encéphalite herpétique, l’attente d’une réponse immunologique tardive ne doit pas différer le traitement. L’enquête étiologique continue pendant la prise en charge.</p><p><b>À retenir.</b> Une absence de pathogène ne suffit pas à établir une cause auto-immune : la DGN rappelle une combinaison de critères cliniques,paracliniques et d’exclusion d’autres causes.</p><p class="src"><a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§2 et3.1,passages relus le 2 novembre 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-s-immu">▲ Loi de Pareto — Immunologie</button></section></div><div class="sci" id="g02-s-viro"><section class="ilot" id="g02-s-viro-body"><h2><span class="n"></span>Virologie diagnostique : choisir le test selon l’agent</h2>
<p>Comment choisir entre PCR et sérologie ? La réponse tient à ce que mesure chaque test : le génome du virus, qui apparaît tôt, ou l’anticorps, qui apparaît tard.</p>
<figure><svg viewBox="0 0 420 320" role="img" aria-label="Choix du test par agent" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="12" y="12" width="396" height="62" rx="6"/><path d="M210 74v14m-5 -7l5 7 5 -7"/><rect x="12" y="88" width="396" height="62" rx="6"/><path d="M210 150v14m-5 -7l5 7 5 -7"/><rect x="12" y="164" width="396" height="62" rx="6"/><path d="M210 226v14m-5 -7l5 7 5 -7"/><rect x="12" y="240" width="396" height="62" rx="6"/></g><g fill="#222" text-anchor="middle"><text x="210" y="39">Herpès simplex, varicelle-zona, cytomégalovirus</text><text x="210" y="57">PCR d’ADN, première intention</text><text x="210" y="115">Entérovirus</text><text x="210" y="133">PCR d’ARN</text><text x="210" y="191">VIH</text><text x="210" y="209">PCR d’ARN et sérologie</text><text x="210" y="267">FSME, rougeole, rubéole</text><text x="210" y="285">sérologie du sang et du liquide</text></g></svg><figcaption>Figure — Choix du test viral selon l’agent. Schéma didactique original d’après la directive S1 ; ce n’est pas une image clinique.</figcaption></figure>
<h3>Entérovirus : de la lenteur à la rapidité</h3>
<p>La PCR automatisée des entérovirus (GeneXpert, CHUV) a réduit le délai de résultat de 60 à 5 heures ; la durée d’hospitalisation médiane est passée de 4 jours (sans PCR ou PCR négative) à 2 jours (PCR classique) puis à 0,5 jour (PCR rapide), et le coût de 5458 à 921 dollars. À Genève, l’échovirus 30 prédominait chez l’adulte et chez l’enfant de 3 ans et plus.</p>
<h3>Herpès simplex : deux pièges</h3>
<p>Une suppression par valaciclovir à 2 × 500 mg n’empêche pas les récidives méningées ; une exposition insuffisante dans le système nerveux est une hypothèse des auteurs, non une démonstration. Dans l’immunodépression, une résistance à l’aciclovir est décrite, d’où le foscarnet.</p>
<div class="key"><b>Science → clinique.</b> Une PCR précoce plutôt qu’une sérologie tardive ; les herpèsvirus se recherchent par PCR d’ADN, les entérovirus et le VIH par PCR d’ARN ; un résultat de PCR du virus d’Epstein-Barr se confronte à la pléiocytose, qui peut le fausser.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a>.</p><p><b>Science → examen.</b> Les HUG choisissent les panels de PCR selon le contexte : immunosuppression, exposition particulière ou infection communautaire. La question clinique doit donc accompagner le prélèvement ; un panel n’est pas une recherche universelle de toutes les causes possibles.</p><p><b>Science → traitement.</b> La DGN demande de ne pas attendre la confirmation virologique lorsqu’une encéphalite herpétique est suspectée. Le résultat sert ensuite à préciser l’hypothèse et la conduite, dans son contexte.</p><p><b>À retenir.</b> Décrire ce qui a été recherché, sur quel prélèvement et à quel moment évite de transformer « PCR négative » en exclusion de toute infection du système nerveux.</p><p class="src"><a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§2 et3.1,passages relus le 2 novembre 2026</a> ; <a href="https://www.hug.ch/laboratoire-virologie/epidemiologie-virale-dans-liquides-cephalo" target="_blank" rel="noopener">HUG,panels virologiques du LCR,consulté le 2 novembre 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-s-viro">▲ Loi de Pareto — Virologie</button></section></div><div class="sci" id="g02-s-myco"><section class="ilot" id="g02-s-myco-body"><h2><span class="n"></span>Mycologie et parasitologie : cryptocoque et trypanosomes</h2>
<p>Deux agents non viraux méritent une description propre : un champignon pouvant infecter des hôtes de statuts immunitaires différents et un parasite des zones tropicales.</p>
<figure><svg viewBox="0 0 420 248" role="img" aria-label="Mycologie et parasitologie" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="12" y="12" width="396" height="44" rx="6"/><path d="M210 56v14m-5 -7l5 7 5 -7"/><rect x="12" y="70" width="396" height="44" rx="6"/><path d="M210 114v14m-5 -7l5 7 5 -7"/><rect x="12" y="128" width="396" height="44" rx="6"/><path d="M210 172v14m-5 -7l5 7 5 -7"/><rect x="12" y="186" width="396" height="44" rx="6"/></g><g fill="#222" text-anchor="middle"><text x="210" y="39">Cryptococcose : terrains variés</text><text x="210" y="97">Antigène du liquide et du sang, culture</text><text x="210" y="155">Hypertension intracrânienne : baisse visuelle et auditive</text><text x="210" y="213">Trypanosomiase : stade 1 hémolymphatique, stade 2 méningo-encéphalitique</text></g></svg><figcaption>Figure — Cryptococcose et trypanosomiase en un coup d’œil. Schéma didactique original ; ce n’est pas une image clinique.</figcaption></figure>
<h3>Le cryptocoque</h3>
<p>La cryptococcose est la troisième infection fongique invasive du transplanté d’organe solide. <i>C. gattii</i> infecte, pour 50 à 70 % des cas, des hôtes apparemment immunocompétents. Le diagnostic repose sur l’antigène (liquide, sang) et la culture. Certains tests commerciaux ne détectent pas <i>C. gattii</i>, ce qui peut produire un faux négatif.</p>
<h3>Les trypanosomes</h3>
<table class="t"><thead><tr><th>Forme</th><th>Zone</th><th>Évolution</th></tr></thead><tbody><tr><td>Gambiense</td><td>Afrique occidentale et centrale</td><td>Lente ; 92 % des cas de 2018 à 2022</td></tr><tr><td>Rhodesiense</td><td>Afrique orientale et australe</td><td>Rapide</td></tr></tbody></table>
<p>Le premier stade est hémolymphatique ; le second correspond à plus de 5 leucocytes/µl ou à des parasites dans le liquide céphalorachidien. Les troubles du sommeil peuvent aussi survenir dans les formes non sévères : ils ne remplacent pas la confirmation parasitologique ni la stratification clinique. Pour gambiense, l’OMS définit la forme sévère à partir de 100 leucocytes/µl ; ce seuil thérapeutique ne doit pas être transposé à rhodesiense.</p>
<div class="key"><b>Science → clinique.</b> Un test d’antigène négatif ne dispense pas de la culture si <i>C. gattii</i> est possible ; un voyageur revenu d’Afrique subsaharienne avec des troubles du sommeil et une méningo-encéphalite évoque une trypanosomiase au stade 2.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a>.</p><p><b>Science → examen.</b> La recommandation ECMM/ISHAM associe l’étude du liquide — pression,cellules,glucose,protéines,antigène,culture et microscopie — à la recherche d’autres localisations. Elle recommande aussi de rechercher une immunodéficience non connue : l’absence de terrain déjà identifié ne clôt pas l’enquête.</p><p><b>Science → traitement.</b> Le choix antifongique dépend de la population et du contexte de soins. Le régime à dose unique d’amphotéricine liposomale a été étudié chez des personnes vivant avec le VIH dans des régions à ressources limitées ; ne pas l’étendre silencieusement aux autres populations.</p><p><b>À retenir.</b> La microbiologie,l’hôte et les complications doivent rester liés. Les définitions et choix thérapeutiques de la trypanosomiase ont été relus dans le guide OMS 2024. La coccidioïdomycose et Chagas disposent de sections cliniques distinctes, avec leurs sources propres ; une preuve concernant le cryptocoque ou la trypanosomiase africaine ne leur est pas automatiquement transposable.</p><p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM 2024,diagnostic et principes de prise en charge,relus le 2 novembre 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-s-myco">▲ Loi de Pareto — Mycologie et parasitologie</button></section></div></div></div>

<div class="panel" id="pP" hidden><nav class="toc ui"><b>Pharmacologie des méningites virales et fongiques</b><ol><li><a href="#g02-p-1">Classes et place</a></li><li><a href="#g02-p-2">Doses chez l’adulte</a></li><li><a href="#g02-p-3">Interactions dangereuses</a></li><li><a href="#g02-p-4">Surveillance et effets indésirables</a></li><li><a href="#g02-p-5">Médicaments à éviter</a></li><li><a href="#g02-p-6">Monographies et aide-mémoire</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="g02-p-1"><h2><span class="n">p-1</span>Classes et place selon le phénotype</h2><p>Aucun médicament ne traite toutes les méningites de ce chapitre : la prescription répond à l’agent et au terrain. Le produit suisse exact et sa voie sont vérifiés avant de transposer un schéma.</p>
<table class="t"><thead><tr><th>Phénotype</th><th>Classe et molécule</th><th>Place</th></tr></thead><tbody><tr><td>Méningite virale non compliquée</td><td>Antipyrétiques et antalgiques</td><td>Symptomatique ; indication antivirale à discuter selon agent et terrain, distincte de l’encéphalite</td></tr><tr><td>Encéphalite herpétique ou varicelle-zona avec signes d’encéphalite</td><td><button class="w" data-k="g02-d-aciclovir">Aciclovir intraveineux</button></td><td>Immédiat si encéphalite herpétique suspectée</td></tr><tr><td>Prévention des récidives de méningite à herpès simplex de type 2</td><td><button class="w" data-k="g02-d-valaciclovir">Valaciclovir</button></td><td>Non recommandé</td></tr><tr><td>Zona précoce chez adulte immunocompétent : indication FI Brivex</td><td><button class="w" data-k="g02-d-brivudine">Brivudine</button></td><td>Contre-indiquée avec les fluoropyrimidines</td></tr><tr><td>Herpès simplex résistant à l’aciclovir (immunodéprimé)</td><td><button class="w" data-k="g02-immunodeprime">Foscarnet</button></td><td>Alternative citée</td></tr><tr><td>Cryptococcose, induction</td><td><button class="w" data-k="g02-d-ambisome">Amphotéricine B liposomale</button> + <button class="w" data-k="g02-d-flucytosine">flucytosine</button></td><td>Standard, 2 semaines au moins</td></tr><tr><td>Cryptococcose, consolidation et entretien</td><td><button class="w" data-k="g02-d-fluconazole">Fluconazole</button></td><td>8 semaines puis 12 mois</td></tr><tr><td>Trypanosomiase africaine</td><td><button class="w" data-k="g02-d-fexinidazole">Fexinidazole</button></td><td>Gambiense et rhodesiense (OMS 2024)</td></tr></tbody></table><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></section>
<section class="ilot" id="g02-p-2"><h2><span class="n">p-2</span>Doses chez l’adulte</h2><p>Les doses ci-dessous proviennent des informations professionnelles suisses (aciclovir, valaciclovir, AmBisome®, fluconazole) et des recommandations citées. Elles ne remplacent pas la lecture du produit commercialisé.</p>
<table class="t"><thead><tr><th>Médicament</th><th>Indication</th><th>Dose et durée</th><th>Source</th></tr></thead><tbody><tr><td>Aciclovir i.v.</td><td>Herpès simplex</td><td>5 mg/kg toutes les 8 h</td><td>Information professionnelle suisse</td></tr><tr><td>Aciclovir i.v.</td><td>Encéphalite herpétique</td><td>10 mg/kg toutes les 8 h, 10 jours (information professionnelle) ; au moins 14 jours (directive S1)</td><td>Information professionnelle suisse ; DGN 2025</td></tr><tr><td>Amphotéricine B liposomale</td><td>Induction cryptococcique (FI : VIH ; guide : selon population)</td><td>3–4 mg/kg/j (recommandation) ; 3–6 mg/kg/j (information professionnelle), au moins 14 jours</td><td>ECMM 2024 ; AmBisome®</td></tr><tr><td>Amphotéricine B liposomale</td><td>Induction à dose unique, méningite cryptococcique associée au VIH</td><td>10 mg/kg au 1er jour + flucytosine + fluconazole 1200 mg/j, 14 jours</td><td>ECMM 2024 ; AmBisome®</td></tr><tr><td>Flucytosine</td><td>Induction</td><td>25 mg/kg 4 fois par jour (100 mg/kg/j)</td><td>ECMM 2024</td></tr><tr><td>Fluconazole</td><td>Consolidation</td><td>400–800 mg/j, 8 semaines</td><td>ECMM 2024</td></tr><tr><td>Fluconazole</td><td>Entretien</td><td>200 mg/j, 12 mois</td><td>ECMM 2024 ; information professionnelle (prophylaxie 200 mg/j)</td></tr><tr><td>Fluconazole</td><td>Méningite (information professionnelle)</td><td>400 mg le 1er jour puis 200–400 mg/j (jusqu’à 800 si menace vitale), 6–8 semaines au moins</td><td>Information professionnelle suisse</td></tr><tr><td>Prednisone/prednisolone</td><td>IRIS cryptococcique persistant malgré ponctions, après exclusion d’une rechute</td><td>0,5–1 mg/kg/j puis décroissance sur 4–6 semaines</td><td>ECMM 2024</td></tr></tbody></table>
<p>La dose initiale se distingue de la dose cible dans la cryptococcose : l’induction à fortes doses est suivie d’une consolidation plus basse, puis d’un entretien qui peut s’arrêter si l’immunité se rétablit. Pour l’aciclovir, la dose s’adapte à la clairance de la créatinine (dose usuelle au-dessus de 50 ml/min, toutes les 12 heures de 25 à 50, toutes les 24 heures de 10 à 25).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></section>
<section class="ilot" id="g02-p-3"><h2><span class="n">p-3</span>Interactions dangereuses</h2><p class="src">Interaction et délai vérifiés dans la <a href="https://amiko.oddb.org/fr/fi?gtin=7680554650024" target="_blank" rel="noopener">FI suisse Brivex®,mai 2022,consultée le 2 novembre 2026</a>.</p><div class="alert"><b>Brivudine et fluoropyrimidines.</b> La brivudine est contre-indiquée avec le 5-fluoro-uracile, la capécitabine, le tégafur et la flucytosine, pendant la prise de brivudine et durant les quatre semaines suivant l’arrêt de la brivudine : la toxicité peut être mortelle. Dans la cryptococcose, la flucytosine fait partie du schéma d’induction ; le patient ne doit donc <b>jamais</b> recevoir de brivudine pour un zona simultané.</div>
<p>La FI du fluconazole contre-indique les associations avec des substrats du CYP3A4 qui allongent le QT, dont l’amiodarone, la quinidine, l’érythromycine et le sertindole. D’autres interactions requièrent une vérification distincte du produit associé. L’aciclovir demande une fonction rénale surveillée et, chez le sujet âgé ou insuffisant rénal, une vigilance neurologique : les confusions, hallucinations, convulsions et comas sont réversibles et la dialyse est souvent efficace.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></section>
<section class="ilot" id="g02-p-4"><h2><span class="n">p-4</span>Surveillance et effets indésirables</h2><table class="t"><thead><tr><th>Médicament</th><th>Surveillance</th><th>Effet indésirable principal</th></tr></thead><tbody><tr><td>Aciclovir i.v.</td><td>Hydratation, fonction rénale (surtout aux fortes doses)</td><td>Fonction rénale à surveiller ; neurotoxicité réversible</td></tr><tr><td>Amphotéricine B liposomale</td><td>Potassium, magnésium, fonctions rénale et hépatique, hémogramme</td><td>Hypokaliémie (19 % dans la FI AmBisome) ; néphrotoxicité moindre qu’avec la forme conventionnelle, mais réelle</td></tr><tr><td>Fluconazole</td><td>Fonction hépatique, électrolytes, fonction rénale et interactions enzymatiques</td><td>Allongement du QT, toxicité hépatique et réactions cutanées graves</td></tr><tr><td>Fexinidazole</td><td>Repas, observance, terrain hépatique, risque de QT et symptômes neuropsychiatriques</td><td>Troubles digestifs et neuropsychiatriques ; interactions proarythmiques à vérifier dans le RCP exact</td></tr><tr><td>Flucytosine</td><td>RCP oral français : hémogramme, foie, rein et concentrations plasmatiques ; disponibilité suisse à vérifier</td><td>Toxicités médullaire, hépatique et digestive, accrues lors d’une exposition excessive</td></tr></tbody></table>
<p>La fenêtre de <button class="w" data-k="g02-d-flucytosine">flucytosine</button> distingue le produit oral français, le statut suisse documenté et les limites restantes. Les critères de modification du traitement sont : détérioration neurologique (réévaluer pression et imagerie), culture positive à deux semaines (envisager de prolonger l’induction), fonction rénale en baisse (adapter l’aciclovir et la flucytosine, surveiller l’amphotéricine).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></section>
<section class="ilot" id="g02-p-5"><h2><span class="n">p-5</span>Médicaments à éviter</h2><ul><li><b>Valaciclovir préventif</b> des récidives méningées : non recommandé (aucune différence la première année, rebond la seconde).</li>
<li><b>Dexaméthasone systématique</b> dans la cryptococcose : non recommandée.</li>
<li><b>Acétazolamide et mannitol</b> pour l’hypertension intracrânienne cryptococcique : possiblement délétères.</li>
<li><b>Brivudine</b> chez un patient sous fluoropyrimidine.</li>
<li><b>Amphotéricine B désoxycholate dans la candidose du système nerveux</b> : ne pas l’utiliser si la formulation liposomale est disponible (ECMM 2025) ; distinguer cette indication des autres mycoses.</li>
<li><b>Antibiotiques et anti-inflammatoires non stéroïdiens</b> : à relever dans l’anamnèse comme cause possible de méningite aseptique.</li></ul>
<div class="trap"><span class="k">Piège</span> Retenir la liste des « à éviter » évite autant d’erreurs que mémoriser les posologies.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener">ECMM/ISHAM, candidose, 2025, principes du système nerveux</a>.</p></section>
<section class="ilot" id="g02-p-6"><h2><span class="n">p-6</span>Monographies et aide-mémoire</h2><p>Les principaux produits sont détaillés en fenêtres : <button class="w" data-k="g02-d-aciclovir">aciclovir</button>, <button class="w" data-k="g02-aciclovir-duree">durée dans l’encéphalite herpétique</button>, <button class="w" data-k="g02-d-valaciclovir">valaciclovir</button>, <button class="w" data-k="g02-d-brivudine">brivudine</button>, <button class="w" data-k="g02-d-ambisome">amphotéricine B liposomale</button>, <button class="w" data-k="g02-d-flucytosine">flucytosine</button>, <button class="w" data-k="g02-d-fluconazole">fluconazole</button>, <button class="w" data-k="g02-d-fexinidazole">fexinidazole</button>, <button class="w" data-k="g02-d-foscarnet">foscarnet</button>, <button class="w" data-k="g02-d-nifurtimox">nifurtimox</button>, <button class="w" data-k="g02-d-benznidazole">benznidazole</button>, <button class="w" data-k="g02-interactions">interactions</button>, <button class="w" data-k="g02-eviter">médicaments à éviter</button>.</p>
<p>Deux aides pédagogiques, non critères officiels : <button class="w" data-k="g02-mnemo">2-8-12 pour la cryptococcose, CCF pour l’encéphalite</button>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-pharma">▲ Loi de Pareto — Pharmacologie</button></section>
