<div class="alert" id="g02-alpha-status"><b>Version de travail — relecture d’auteur documentée.</b> La reprise du 2 novembre 2026 ajoute une sémiologie sourcée, les causes rares et les corrections de cohérence. Les limites sur l’erratum candidose, l’accès suisse aux produits rares et l’applicabilité administrative actuelle restent explicites ; cette relecture ne constitue pas une validation médicale humaine.</div><section class="ilot" id="g02-demarche" data-semiology-clinical="G02"><h2>Démarche clinique : reconnaître le syndrome avant d’identifier l’agent</h2><p>Devant un syndrome méningé fébrile, commencer par la gravité : rechercher un état de choc, des pétéchies et une altération de la conscience. Ensuite, relier les symptômes au terrain, aux contacts, aux voyages et aux médicaments récents. Enfin, confronter cette hypothèse aux analyses du liquide céphalo-rachidien. Les signes cliniques seuls ne séparent pas sûrement une origine bactérienne d’une origine virale.</p><p>La sémiologie sert ainsi à choisir l’étape suivante. Une parotidite ou des lésions vésiculeuses orientent l’enquête ; elles ne dispensent pas de rechercher les signes d’urgence. À l’inverse, une confusion, une crise ou un déficit focal impose de considérer une atteinte encéphalitique.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://www.revmed.ch/view/445609/3798710/RMS_526_1310.pdf" target="_blank" rel="noopener">HUG / Revue Médicale Suisse, 2016, p.1310–1311</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN 2025,§1.2 et3.1</a>.</p><details><summary>Le parcours monographique en 14 points</summary><ol><li>Définition et périmètre clinique.</li><li>Épidémiologie suisse puis européenne.</li><li>Physiopathologie.</li><li>Démarche clinique.</li><li>Anamnèse.</li><li>Examen clinique.</li><li>Syndromes et classifications.</li><li>Diagnostic positif.</li><li>Explorations.</li><li>Arbre diagnostique et diagnostics différentiels.</li><li>Prise en charge.</li><li>Prévention, suivi et pronostic.</li><li>Points clés.</li><li>Pièges.</li></ol><p>Les approfondissements se trouvent dans les onglets Examens, Sciences et Pharmacologie. Les situations particulières et les sous-codes sont conservés ; la matrice de contrôle distingue les contenus présents des contenus réellement revus.</p></details></section><section class="ilot" id="g02-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p>
<p>Un homme de 27 ans consulte aux urgences après deux jours de céphalées intenses, de fièvre à 38,6 °C et d’une gêne à la lumière. Il est vigil, sans déficit moteur ni crise. La nuque résiste à la flexion. La ponction lombaire ramène un liquide clair contenant 210 cellules par µl, presque toutes des lymphocytes. La <button class="w" data-k="g02-pct">procalcitonine</button> sanguine mesure 0,2 ng/ml. Une <button class="w" data-k="g02-pcr-rapide-ev">PCR rapide des entérovirus</button> rend un résultat positif cinq heures après le prélèvement. <b>La PCR positive soutient une origine entérovirale. L’arrêt des antibiotiques et le retour à domicile nécessitent aussi une évolution favorable et une réévaluation des diagnostics urgents ; le résultat isolé n’est pas un critère de sortie.</b></p>
<p>Une <button class="w" data-k="g02-meningo-enceph">méningite virale</button> guérit le plus souvent seule. Deux diagnostics voisins, en revanche, engagent le pronostic en quelques heures : la méningite bactérienne et l’encéphalite herpétique. Le médecin doit donc, dans l’ordre, (1) écarter ces deux urgences ou les traiter sans attendre, (2) identifier l’agent par <button class="w" data-k="g02-pcr-lcr">PCR du liquide céphalo-rachidien</button> afin de ne pas prolonger inutilement antibiotiques et hospitalisation, et (3) reconnaître les contextes qui changent la conduite : immunodépression, récidives, voyage en zone tropicale.</p>
<p>Ce chapitre traite la catégorie G02*, c’est-à-dire la méningite <i>au cours</i> d’une maladie infectieuse ou parasitaire non bactérienne, classée à part. Parmi les causes virales identifiées dans la cohorte danoise d’adultes, les entérovirus, le virus herpès simplex de type 2 et le virus varicelle-zona prédominent ; ces données ne décrivent pas toutes les causes de G02 ni une incidence suisse. La <button class="w" data-k="g02-cryptocoque">cryptococcose</button> est une méningite fongique importante chez l’immunodéprimé, mais peut aussi toucher des personnes sans immunodéficience connue. La trypanosomiase africaine appartient à la médecine des voyages et de la migration.</p>
<div class="key"><b>Point de départ.</b> Pour une forme virale isolée, confronter le <button class="w" data-k="g02-triade">tableau méningé sans signe d’encéphalite</button>, un <button class="w" data-k="g02-lcr-normal">liquide souvent lymphocytaire après la phase initiale</button> et l’<button class="w" data-k="g02-hsve">évaluation urgente d’une encéphalite herpétique ou d’une méningite bactérienne</button>. Les marqueurs isolés ne suffisent pas à exclure ces urgences.</div>
<p>Le chapitre suit l’ordre d’une consultation : définir et classer (îlots 1 à 3), comprendre le mécanisme et recueillir les indices (îlots 4 à 6), poser le diagnostic et reconnaître l’urgence (îlots 7 et 8), traiter (îlots 9 à 11), puis surveiller et trancher les situations particulières (îlots 12 à 14).</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a>.</p></section>
<section class="ilot" id="g02-1"><h2><span class="n">1</span>Définition et frontière avec l’encéphalite</h2><p>Une <b>méningite virale</b> associe des céphalées, des nausées, parfois des vomissements, une raideur de nuque, une photophobie et une phonophobie. Elle ne comporte <b>ni signe focal ni trouble de la conscience</b>. Le liquide céphalo-rachidien contient habituellement moins de 1000 cellules par µl dans la description de la DGN ; ses protéines et son lactate sont normaux ou à peine élevés. L’évolution est spontanément favorable en quelques jours à quelques semaines (<button class="w" data-k="g02-sources-guides">directive S1 de la Société allemande de neurologie</button>, 2025).</p>
<p>Une <b>méningo-encéphalite</b> ajoute un trouble quantitatif ou qualitatif de la conscience, souvent des signes focaux (parésie, aphasie) ou des crises ; le méningisme peut même manquer. Les <button class="w" data-k="g02-criteres-ie">critères de l’International Encephalitis Consortium</button> formalisent cette bascule : un critère majeur (altération de la conscience, de la personnalité ou manifestation psychiatrique pendant au moins 24 heures sans autre cause) et des critères mineurs. Cette frontière est la plus importante du chapitre, car elle sépare une maladie le plus souvent bénigne d’une urgence thérapeutique.</p>
<p>Le périmètre administratif et les sous-codes restent disponibles dans la <button class="w" data-k="g02-codage">fenêtre de codage</button>, après le raisonnement clinique ; ils ne déterminent ni la gravité ni le traitement.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></section>
<section class="ilot" id="g02-2"><h2><span class="n">2</span>Classer par agent, par syndrome et par urgence</h2><p>Quatre classements se complètent, parce qu’ils répondent à quatre questions différentes.</p>
<ol><li><b>Par agent</b> (structure de la CIM) : viral (G02.0*), fongique (G02.1*), parasitaire (G02.8*). Ce classement sert au codage et à l’épidémiologie.</li>
<li><b>Par syndrome</b> (directive S1, tableau 1) : méningite aseptique (coxsackie, échovirus, adénovirus, herpès simplex de type 2, varicelle-zona, virus Toscana, poliovirus, rougeole, FSME, oreillons, virus d’Epstein-Barr, rubéole, entérovirus 71, VIH, parvovirus B19, herpèsvirus humain 6, dengue) ; méningo-encéphalite ; atteinte des nerfs crâniens (varicelle-zona, herpès simplex, cytomégalovirus, VIH, FSME, oreillons). Ce classement guide la clinique.</li>
<li><b>Par évolution</b> : aiguë, récidivante bénigne (<button class="w" data-k="g02-mollaret">méningite de Mollaret</button>, surtout liée à l’herpès simplex de type 2), chronique ou subaiguë (cryptocoque).</li></ol>
<p>Le quatrième classement mérite plus d’attention, car il hiérarchise l’<b>effort diagnostique</b> selon la possibilité d’agir. La directive S1 distingue <button class="w" data-k="g02-dgn-niveaux">quatre niveaux</button>.</p>
<table class="t"><thead><tr><th>Niveau</th><th>Contenu</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>1</td><td>Virus pour lesquels un traitement existe : herpès simplex 1 et 2, varicelle-zona, cytomégalovirus, VIH</td><td>Recherche systématique et rapide, car un antiviral change le pronostic</td></tr><tr><td>2</td><td>Traitement potentiel non disponible : virus d’Epstein-Barr, échovirus et coxsackie</td><td>Identification utile surtout pour arrêter les autres traitements</td></tr><tr><td>3</td><td>Virus fréquents sans traitement : FSME, adénovirus, herpèsvirus humain 6, rougeole, rubéole</td><td>Recherche selon le contexte épidémiologique</td></tr><tr><td>4</td><td>Constellations particulières : poliovirus, rage, LCMV, hantavirus, voyage</td><td>Recherche guidée par l’anamnèse</td></tr></tbody></table>
<p>Ce dernier tableau explique pourquoi le laboratoire demande d’abord les herpèsvirus : le niveau 1 regroupe les agents dont l’identification déclenche un geste thérapeutique. Les échovirus et les coxsackie relèvent du niveau 2 ; leur recherche reste pourtant précieuse, car un résultat positif rapide aide à réévaluer les antibiotiques selon l’évolution et les diagnostics urgents (<button class="w" data-k="g02-pcr-rapide-ev">effet de la PCR rapide</button>).</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></section>
<section class="ilot" id="g02-3"><h2><span class="n">3</span>Épidémiologie</h2><p>Les chiffres les mieux établis proviennent de la <button class="w" data-k="g02-cohorte-danoise"><b>cohorte nationale prospective danoise 2015–2019</b></button>, qui a recensé 1066 épisodes chez 1045 adultes. Les méthodes précisent les hospitalisations du 1er janvier 2015 au 31 décembre 2019 ; le résumé emploie 2015–2020. L’incidence atteint <b>4,7 pour 100 000 personnes par an</b>. L’âge médian est de 33 ans et 54 % des patients sont des femmes. Le virus est identifié dans 73 % des épisodes.</p>
<table class="t"><thead><tr><th>Agent</th><th>Part des épisodes</th><th>Particularité (cohorte danoise)</th></tr></thead><tbody><tr><td><button class="w" data-k="g02-enterovirus">Entérovirus</button></td><td>39 %</td><td>Cause la plus fréquente de méningite aseptique</td></tr><tr><td>Herpès simplex de type 2</td><td>16 %</td><td>77 % de femmes</td></tr><tr><td><button class="w" data-k="g02-vzv">Varicelle-zona</button></td><td>15 %</td><td>Immunosuppression 20 % ; zona concomitant 60 %</td></tr><tr><td>Autres virus</td><td>3 %</td><td>—</td></tr><tr><td>Non identifié</td><td>27 %</td><td>Pronostic comparable aux épisodes identifiés</td></tr></tbody></table>
<p>La somme des lignes à agent identifié (39 + 16 + 15 + 3 = 73 %) ajoutée aux 27 % de cas sans agent donne 100 %. La proportion de cas sans virus identifié rappelle que le laboratoire ne répond pas toujours : l’absence de résultat n’autorise pas à écarter une cause virale.</p>
<h3>Repères suisses</h3>
<ul><li>À Genève (Hôpitaux universitaires, 2013–2015), l’<b>échovirus 30</b> prédomine chez l’enfant de 3 ans et plus et chez l’adulte. Dans le sous-groupe genevois disposant de prélèvements complets, 62,5 % des enfants et aucun adulte avaient une détection dans le sang et les selles. Ce résultat de série ne signifie pas qu’une virémie adulte serait impossible.</li>
<li>Les oreillons causent moins de 1000 cas par an en Suisse ces dernières années. La méningite est l’une des complications les plus fréquentes chez l’enfant et guérit en général sans séquelle (OFSP).</li>
<li>La <button class="w" data-k="g02-fsme">FSME</button>, voisine mais classée en A84, a compté 245 cas en Suisse en 2023 selon le chiffre historique repris par la DGN 2025. Ce n’est pas une mesure pour 2026 ; la carte actuelle des zones à risque doit être consultée auprès de l’OFSP.</li></ul>
<p>La DGN rappelle aussi les oreillons, les arbovirus, les herpèsvirus, le VIH et le LCMV. Leur fréquence dépend de la région, de l’époque et de la vaccination ; ne pas superposer un classement général à celui de la cohorte danoise.</p>
<h3>Situations à part</h3>
<ul><li><b>Récidive</b> : l’incidence de la <button class="w" data-k="g02-mollaret">méningite de Mollaret</button> est de 1,2 par million d’adultes et par an ; 22 % (intervalle de confiance à 95 % : 15–30 %) des méningites à herpès simplex de type 2 évoluent vers une forme récidivante.</li>
<li><b>Cryptococcose</b> : troisième infection fongique invasive du transplanté d’organe solide ; 50 à 70 % des infections à <i>C. gattii</i> touchent des hôtes apparemment immunocompétents ; mortalité de la méningite de 24 à 47 % à 10 semaines dans les études citées, principalement en contexte de ressources limitées, et non estimation suisse.</li>
<li><b><button class="w" data-k="g02-tha">Trypanosomiase africaine</button></b> : la forme gambiense (Afrique occidentale et centrale, évolution lente) a représenté 92 % des cas de 2018 à 2022 ; la forme rhodesiense (Afrique orientale et australe) évolue vite.</li></ul>
<div class="key"><b><button class="w" data-k="g02-lacunes">Lacune assumée.</button></b> Aucune recommandation suisse dédiée à la méningite virale ou fongique n’a été retrouvée ; les repères suisses ci-dessus proviennent d’études de Lausanne et de Genève et des pages de l’OFSP. Les chiffres annuels suisses d’entérovirus et de FSME pour 2024–2025 n’ont pas été trouvés à la source officielle.</div>
<p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1111/ene.16081" target="_blank" rel="noopener">Petersen et al., méningite de Mollaret au Danemark, Eur J Neurol 2024</a> ; <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a> ; <a href="https://www.bag.admin.ch/de/zeckenuebertragene-krankheiten" target="_blank" rel="noopener">OFSP, maladies transmises par les tiques</a>.</p></section>
<section class="ilot" id="g02-4"><h2><span class="n">4</span>Du liquide céphalo-rachidien normal à la méningite virale</h2><p>Comprendre la cinétique du liquide céphalo-rachidien évite deux erreurs opposées : traiter par antibiotiques une méningite virale précoce, ou rassurer à tort devant un liquide encore riche en polynucléaires.</p>
<h3>Le liquide normal</h3>
<p>Le liquide céphalo-rachidien normal est clair et compte moins de 5 leucocytes par µl, seuil retenu par les critères d’encéphalite et d’auto-immunité cités par la directive S1. Dès que le virus atteint les méninges, les cellules immunitaires y affluent : la <button class="w" data-k="g02-lcr-normal">pléiocytose</button> (augmentation du nombre de cellules) est le signe biologique de la méningite.</p>
<h3>La cinétique cellulaire</h3>
<p>Dans les <b>4 à 48 premières heures</b>, la pléiocytose est <b>mixte</b> : 25 à 1000 cellules par µl, avec des lymphocytes, des monocytes et des granulocytes. Elle devient ensuite <b>lymphocytaire</b>. La DGN décrit des protéines et un lactate normaux ou peu élevés dans les profils usuels, avec un repère de lactate de 4,0 mmol/l pour l’encéphalite. Ces valeurs descriptives ne sont pas des plafonds diagnostiques universels.</p>
<figure><svg viewBox="0 0 420 302" role="img" aria-label="Cinétique du liquide céphalo-rachidien dans la méningite virale" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="12" y="12" width="396" height="44" rx="6"/><path d="M210 56v14m-5 -7l5 7 5 -7"/><rect x="12" y="70" width="396" height="62" rx="6"/><path d="M210 132v14m-5 -7l5 7 5 -7"/><rect x="12" y="146" width="396" height="62" rx="6"/><path d="M210 208v14m-5 -7l5 7 5 -7"/><rect x="12" y="222" width="396" height="62" rx="6"/></g><g fill="#222" text-anchor="middle"><text x="210" y="39">Virus dans le liquide céphalo-rachidien</text><text x="210" y="97">4 à 48 h : cellules mixtes</text><text x="210" y="115">25 à 1000 par µl (lymphocytes, monocytes, granulocytes)</text><text x="210" y="173">Ensuite : prédominance lymphocytaire</text><text x="210" y="191">protéines et lactate normaux ou peu élevés</text><text x="210" y="249">Réponse tardive, surtout décrite dans l’encéphalite :</text><text x="210" y="267">synthèse intrathécale d’anticorps (indice supérieur à 1,5)</text></g></svg><figcaption>Figure 1 — Évolution du liquide céphalo-rachidien dans une infection virale du système nerveux. Schéma didactique original, d’après la directive S1 de la Société allemande de neurologie (2025) ; ce n’est pas une image clinique.</figcaption></figure>
<p>La <button class="w" data-k="g02-pleiocytose-mixte">conséquence pratique</button> est capitale : un liquide précoce riche en polynucléaires <b>n’exclut pas un virus</b>. Tant qu’une méningite bactérienne n’est pas exclue, l’antibiothérapie provisoire reste justifiée. L’ensemble du tableau (procalcitonine, lactate, évolution) tranche ensuite.</p>
<h3>Quand les anticorps apparaissent</h3>
<p>La DGN décrit une synthèse intrathécale tardive dans les encéphalites, généralement après plus de 10 jours. Elle ne constitue pas une frontière absolue avec la méningite : la cohorte danoise utilisait aussi des anticorps intrathécaux spécifiques pour documenter certaines méningites virales. L’<button class="w" data-k="g02-synthese-intrathecale">indice d’anticorps</button> se calcule par le rapport (anticorps du liquide × IgG du sérum) / (IgG du liquide × anticorps du sérum) et devient positif au-dessus de 1,5. La <b>sérologie intrathécale est donc un outil tardif</b> ; la PCR est l’outil précoce.</p>
<h3>Comment le virus arrive</h3>
<p>Dans la série genevoise, les prélèvements complets objectivaient une dissémination sanguine et digestive chez certains enfants, sans détection chez les adultes de ce sous-groupe. Les auteurs discutent des voies d’accès différentes ; cette observation ne démontre pas un mécanisme universel. L’herpès simplex de type 2 procède d’une réactivation récurrente, ce qui explique les récidives (voir <button class="w" data-k="g02-hsv2">méningite à herpès simplex de type 2</button>).</p>
<div class="key"><b>Mécanisme → décision.</b> Cellules mixtes puis lymphocytaires : ne pas écarter un virus sur un liquide précoce. Synthèse d’anticorps tardive : ne pas attendre une sérologie intrathécale pour décider. Une recherche sanguine ou digestive négative ne remplace pas l’analyse du liquide.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a>.</p></section>
<section class="ilot" id="g02-5"><h2><span class="n">5</span>Causes, contextes et anamnèse</h2><p>L’anamnèse ne sert pas seulement à reconnaître une méningite : elle oriente vers un agent et, surtout, repère les terrains où le traitement change. La directive S1 propose de penser à une étiologie virale devant les contextes suivants.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Agents évoqués</th></tr></thead><tbody><tr><td>Cas dans l’entourage</td><td>Oreillons, varicelle, poliovirus</td></tr><tr><td>Piqûre de tique ou d’insecte, morsure animale</td><td>FSME ; rage</td></tr><tr><td>Risque de VIH, transfusion ou greffe</td><td>VIH, cytomégalovirus, parvovirus B19</td></tr><tr><td>Immunosuppression</td><td>Cytomégalovirus, JCV, varicelle-zona, herpèsvirus humain 6, virus d’Epstein-Barr, herpès simplex 1 et 2 ; entérovirus 71 sous anti-CD20</td></tr><tr><td><button class="w" data-k="g02-voyage">Voyage</button></td><td>Virus Toscana (Italie), West Nile (Méditerranée), encéphalite japonaise (Asie du Sud-Est), dengue et rage (monde entier)</td></tr></tbody></table>
<p>D’autres indices se rapportent à un agent précis : un <b>herpès génital</b> évoque le syndrome d’Elsberg (lésions concomitantes chez 46 % des patients) ; un <b>zona</b> accompagne 60 % des méningites à varicelle-zona ; un patient infecté par le VIH avec des CD4 inférieurs à 200 par mm³ doit faire penser au cryptocoque ; un séjour en Afrique subsaharienne évoque la trypanosomiase. Enfin, la prise d’<b>anti-inflammatoires non stéroïdiens (ibuprofène) ou d’antibiotiques</b> peut causer une <button class="w" data-k="g02-diam">méningite aseptique médicamenteuse</button>, cliniquement identique.</p>
<h3>Symptômes par fréquence</h3>
<p>Dans la cohorte danoise : céphalées 95 %, antécédent fébrile rapporté 71 %, photophobie ou hyperacousie 67 %, raideur de nuque 36 %. La <b>triade complète</b> (céphalées, raideur de nuque, photophobie ou hyperacousie) n’apparaît que chez <b>28 %</b> des patients. La <button class="w" data-k="g02-triade">raideur de nuque absente</button> ne permet donc jamais d’écarter une méningite : le signe manque chez près de deux patients sur trois.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Une femme de 31 ans a des céphalées, de la fièvre et une photophobie depuis un jour. Le liquide contient 160 cellules par µl, surtout lymphocytaires ; la PCR identifie un entérovirus. Après réévaluation favorable, exclusion des urgences et organisation d’une surveillance adaptée, une sortie précoce peut être envisagée avec traitement symptomatique et consignes de reconsultation ; la PCR seule ne décide pas de la sortie.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Un homme de 40 ans n’a ni fièvre ni raideur de nuque ; ses céphalées durent depuis trois jours. Le liquide est pourtant pathologique. À l’inverse, une femme sous traitement immunosuppresseur présente des céphalées subaiguës et une baisse visuelle : une pression d’ouverture élevée et un antigène cryptococcique positif révèlent une <button class="w" data-k="g02-cryptocoque">cryptococcose</button>.</p></div></div>
<div class="key"><b>Antécédents à demander.</b> Immunosuppression, VIH, greffe, vaccinations (rougeole, oreillons, rubéole, varicelle), voyages, piqûre de tique, herpès génital ou zona, médicaments récents (anti-inflammatoires non stéroïdiens, antibiotiques), épisodes antérieurs de méningite.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a>.</p></section>
<section class="ilot" id="g02-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen clinique poursuit deux objectifs : confirmer le syndrome méningé et traquer, sans relâche, les signes qui font basculer vers l’encéphalite.</p>
<div class="two"><div class="card"><h4>État général et signes vitaux</h4><p>Un antécédent de fièvre est rapporté dans 71 % des épisodes de la cohorte ; une température mesurée d’au moins 38 °C n’est constatée que dans 42 %. L’état de conscience s’évalue à chaque examen : une somnolence, un délire ou une confusion changent le diagnostic. Les constantes se relèvent avant la ponction ; tant qu’une méningite bactérienne n’est pas exclue, l’antibiothérapie provisoire reste de mise.</p></div><div class="card"><h4>Signes méningés</h4><p>La <button class="w" data-k="g02-triade">raideur de nuque</button>, la photophobie et la phonophobie (hyperacousie) se recherchent à chaque examen. Leur absence ne suffit pas à écarter une méningite : la triade céphalées, raideur de nuque et photophobie ou hyperacousie n’était présente que dans 28 % des épisodes de la cohorte citée. Ce pourcentage descriptif n’est pas la performance d’un test d’exclusion.</p></div></div>
<h3>Signes de basculement encéphalitique</h3>
<p>Un trouble de la vigilance, un délire, des crises, une aphasie ou une hémiparésie signalent une atteinte du parenchyme. Ces signes imposent d’agir comme pour une <button class="w" data-k="g02-hsve">encéphalite herpétique</button>, sans attendre le résultat de la ponction.</p>
<h3>Signes propres à certains agents</h3>
<ul><li><b>Herpès simplex de type 2 : radiculite lombosacrée (syndrome d’Elsberg).</b> Une <button class="w" data-k="g02-elsberg">rétention urinaire</button> est présente chez tous les patients de la série danoise (sondage chez 61 %), des signes méningés chez 82 % et des lésions génitales chez 46 %.</li>
<li><b>Oreillons.</b> Une <button class="w" data-k="g02-oreillons">parotidite</button>, d’abord unilatérale puis souvent bilatérale, suit 1 à 2 jours de prodromes ; une orchite touche 20 à 30 % des hommes pubères.</li>
<li><b>Cryptococcose.</b> Une baisse visuelle ou auditive traduit l’<button class="w" data-k="g02-pic">hypertension intracrânienne</button>.</li>
<li><b>Trypanosomiase.</b> Le stade 1 est hémolymphatique et peu spécifique ; le stade 2 comporte une atteinte neurologique variable. Les troubles du sommeil ne suffisent pas à définir le stade ou sa sévérité ; un coma peut survenir dans les formes avancées.</li></ul>
<div class="trap"><span class="k">Erreur fréquente</span> Une raideur de nuque absente et un patient bien vigilant ne protègent pas : une méningite bactérienne débutante ou une cryptococcose subaiguë peuvent se présenter de façon discrète. L’analyse du liquide est centrale, mais reste confrontée au tableau clinique et aux examens microbiologiques.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>

<section class="ilot" id="g02-7"><h2><span class="n">7</span>Diagnostic et diagnostic différentiel</h2><h3 id="g02-diagnostic-positif">Diagnostic positif : distinguer le syndrome et sa cause</h3><p>Devant un syndrome méningé fébrile, le diagnostic s’établit en trois temps : juger la gravité et la conscience, examiner le liquide céphalo-rachidien, puis identifier l’agent. L’ordre protège contre les diagnostics dont le retard est dangereux.</p>
<p class="src">Pour le diagnostic différentiel bactérien : <a href="https://ssi.guidelines.ch/guideline/2315/fr" target="_blank" rel="noopener">SSI, Méningite, validation septembre 2024, consultée le 2 novembre 2026</a>. La recommandation suisse demande de ne pas différer le traitement pour le scanner.</p><h3 id="g02-explorations">Explorations : confronter le tableau au liquide</h3><p>La numération cellulaire oriente mais ne confirme pas, à elle seule, l’étiologie. La synthèse genevoise décrit une prédominance lymphocytaire possible au début d’une méningite bactérienne ou après antibiothérapie. Relier donc le résultat à la chronologie et aux prélèvements microbiologiques ; le détail des examens figure dans l’onglet dédié.</p><p class="src">Sources réellement consultées le 2 novembre 2026 : <a href="https://www.revmed.ch/view/445609/3798710/RMS_526_1310.pdf" target="_blank" rel="noopener">HUG / Revue Médicale Suisse2016,p.1313</a>.</p><h3>Ce que le sang apporte</h3>
<p>Une lymphocytose relative est fréquente. La <button class="w" data-k="g02-pct">procalcitonine</button> reste normale (inférieure à 0,5 ng/ml) dans la méningite virale, mais ce repère descriptif ne suffit pas à exclure une méningite bactérienne aiguë ; la protéine C réactive dépasse rarement 50 mg/l dans les infections virales. Le lactate du liquide sépare utilement viral et bactérien et se mesure désormais au lit du patient.</p>
<h3>Ce que le liquide apporte</h3>
<p>Le <button class="w" data-k="g02-lcr-normal">liquide céphalo-rachidien</button> se lit avec son contexte : nombre de cellules, formule, protéines, lactate. La <button class="w" data-k="g02-pcr-lcr">PCR sur liquide non centrifugé</button> cherche l’herpès simplex, le virus varicelle-zona, le cytomégalovirus, le virus d’Epstein-Barr, le JCV, les flavivirus et les entérovirus ; les IgM spécifiques (West Nile, par exemple) et l’indice d’anticorps complètent. Le séquençage de nouvelle génération n’est envisagé qu’après un bilan standard resté sans réponse.</p>
<div class="trap"><span class="k">Limite des seuils</span> Dans la cohorte danoise, 38 patients avaient au moins 1000 cellules/µl malgré une méningite virale. Un seuil descriptif n’est donc pas une frontière diagnostique absolue. La même cohorte incluait des baisses transitoires du score de conscience durant moins de 24 heures ; un trouble de vigilance doit toujours être réévalué, sans être réduit à une règle de codage.</div><p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10473559/" target="_blank" rel="noopener">Petersen et al., Brain 2023, résultats et tableau 2, texte intégral consulté le 2 novembre 2026</a>.</p><h3>Quatre tableaux cliniques à ne pas confondre</h3><figure><svg viewBox="0 0 420 360" role="img" aria-label="Algorithme diagnostique" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="12" y="12" width="396" height="44" rx="6"/><path d="M210 56v14m-5 -7l5 7 5 -7"/><rect x="12" y="70" width="396" height="62" rx="6"/><path d="M210 132v14m-5 -7l5 7 5 -7"/><rect x="12" y="146" width="396" height="62" rx="6"/><path d="M210 208v14m-5 -7l5 7 5 -7"/><rect x="12" y="222" width="396" height="62" rx="6"/><path d="M210 284v14m-5 -7l5 7 5 -7"/><rect x="12" y="298" width="396" height="44" rx="6"/></g><g fill="#222" text-anchor="middle"><text x="210" y="39">Syndrome méningé fébrile</text><text x="210" y="97">Signe d’encéphalite ?</text><text x="210" y="115">conscience, crise, signe focal</text><text x="210" y="173">Suspicion herpétique : aciclovir sans délai</text><text x="210" y="191">Gravité et sécurité de la ponction à évaluer</text><text x="210" y="249">Doute bactérien : antibiotiques sans délai</text><text x="210" y="267">Puis liquide, microbiologie, réévaluation</text><text x="210" y="325">PCR du liquide : agent, contexte, terrain</text></g></svg><figcaption>Figure 2 — Séquence diagnostique devant un syndrome méningé fébrile. Schéma didactique original, d’après la directive S1 et la SSI Méningite : les traitements urgents ne sont pas différés pour l’imagerie ou les résultats. Ce n’est pas une image clinique.</figcaption></figure>
<table class="t"><thead><tr><th>Critère</th><th>Méningite virale</th><th>Méningite bactérienne</th><th>Encéphalite herpétique</th><th>Cryptococcose</th></tr></thead><tbody><tr><td>Conscience et signes focaux</td><td>Conservée, aucun signe focal</td><td>Altération de la conscience possible ; les signes classiques peuvent manquer (SSI)</td><td>Trouble de conscience, signes focaux, crises</td><td>Céphalées subaiguës, baisse visuelle ou auditive</td></tr><tr><td>Liquide</td><td>Profil habituel inférieur à 1000 cellules par µl ; exceptions documentées ; lymphocytaire après la phase mixte</td><td>Prédominance granulocytaire habituelle ; exceptions précoces ou après antibiothérapie</td><td>Pléiocytose habituelle ; lactate peu augmenté dans le profil typique décrit par la DGN</td><td>Pression d’ouverture à mesurer, antigène cryptococcique</td></tr><tr><td>Marqueur sanguin</td><td>Procalcitonine normale</td><td>Élévation de procalcitonine possible ; aucune exclusion isolée</td><td>Non précisé dans les sources lues</td><td>Antigène cryptococcique sanguin</td></tr><tr><td>Premier geste</td><td>Antalgiques, antipyrétiques</td><td>Antibiothérapie probabiliste selon SSI et risque de Listeria</td><td>Aciclovir immédiat</td><td>Amphotéricine B liposomale et flucytosine</td></tr></tbody></table>
<p>Le tableau se lit par colonne. Il ne remplace pas le jugement clinique, il le structure : le doute entre deux colonnes se règle en traitant la plus dangereuse.</p>
<h3 id="g02-arbre">Arbre diagnostique et différentiels : la gravité avant l’étiquette</h3>
<ol><li><b>Méningite bactérienne (G00/G01)</b> : à rechercher par l’ensemble du tableau clinique, du liquide et de la microbiologie ; aucun marqueur isolé ne constitue ici un test d’exclusion. Si elle est suspectée, ne pas retarder l’antibiothérapie pour une imagerie.</li>
<li><b><button class="w" data-k="g02-hsve">Encéphalite herpétique</button></b> : une suspicion d’encéphalite herpétique impose l’aciclovir immédiat.</li>
<li><b>Cryptococcose</b> chez l’immunodéprimé ; recherche d’une immunodéficience chez tout patient atteint.</li>
<li><b><button class="w" data-k="g02-autoimmune">Encéphalite auto-immune</button></b> (anti-NMDAR, CASPR2, LGI1) si aucun pathogène n’est retrouvé.</li>
<li><b><button class="w" data-k="g02-diam">Méningite médicamenteuse</button></b> (anti-inflammatoires non stéroïdiens, antibiotiques).</li>
<li><b>Méningite documentée comme non purulente</b> : libellé G03.0 ; distinguer A87.9, méningite virale non précisée, sans déduire le code d’une PCR négative.</li></ol>
<p>L’<button class="w" data-k="g02-imagerie">IRM</button> est la méthode de choix devant un syndrome encéphalitique ; le scanner n’est qu’un dépistage ou un substitut. Une atteinte temporale puis frontobasale évoque l’encéphalite herpétique ; une atteinte asymétrique des noyaux gris évoque la FSME.</p>
<div class="trap"><span class="k">Piège</span> Un liquide riche en granulocytes dans les premières heures n’est pas une méningite bactérienne par définition. Le tableau clinique, les traitements reçus et la microbiologie doivent compléter ces marqueurs ; en cas de doute, l’antibiothérapie provisoire n’est pas une erreur.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></section>
<section class="ilot" id="g02-8"><h2><span class="n">8</span>Urgences et gravité</h2><div class="alert"><b>Trois urgences à reconnaître avant tout.</b> (1) <b>Encéphalite herpétique suspectée</b> : aciclovir intraveineux <b>immédiat</b>, sans attendre la ponction lombaire en cas d’hypertension intracrânienne ou de contre-indication. (2) <b>Doute bactérien</b> : antibiothérapie probabiliste urgente selon la recommandation SSI, adaptée à l’âge et au risque de Listeria. (3) <b>Cryptococcose avec pression d’ouverture d’au moins 20 cm d’eau et symptômes</b> : ponctions lombaires évacuatrices quotidiennes. Une forme grave d’encéphalite virale peut nécessiter les soins intensifs.</div>
<p>La logique de ces priorités tient à l’asymétrie des risques. Le retard d’un traitement indiqué dans une méningite bactérienne ou une encéphalite herpétique expose à des conséquences graves. Le traitement probabiliste doit cependant être réévalué dès les résultats, avec surveillance de sa tolérance : l’aciclovir peut notamment provoquer une toxicité rénale ou neurologique, décrite dans sa FI.</p>
<h3>Trois urgences, trois gestes</h3>
<table class="t"><thead><tr><th>Situation</th><th>Signe qui la révèle</th><th>Geste immédiat</th></tr></thead><tbody><tr><td>Encéphalite herpétique</td><td>Conscience altérée, crise, signe focal</td><td>Aciclovir i.v. 10 mg/kg/8 h chez l’adulte à fonction rénale normale, IRM ; soins intensifs selon gravité</td></tr><tr><td>Méningite bactérienne non exclue</td><td>Liquide à granulocytes, procalcitonine élevée ou tableau incertain</td><td>Antibiothérapie probabiliste urgente selon SSI, avec couverture de Listeria selon le risque</td></tr><tr><td>Cryptococcose avec hypertension intracrânienne</td><td>Pression d’ouverture d’au moins 20 cm d’eau, baisse visuelle ou auditive</td><td>Ponctions évacuatrices quotidiennes</td></tr></tbody></table>
<p>Les signes du tableau sont des alertes, et non des critères nécessaires ou suffisants de chaque urgence. Il ne s’agit pas de poser le diagnostic final, mais de ne pas retarder le traitement qui ne peut pas attendre.</p>
<h3>Cryptococcose : l’urgence mécanique</h3>
<p>La pression d’ouverture se mesure à <b>chaque</b> ponction lombaire. Si elle atteint 20 cm d’eau ou plus avec symptômes, des <button class="w" data-k="g02-pic">ponctions évacuatrices</button> (environ 20 à 30 ml) sont répétées chaque jour jusqu’à 50 % de la pression initiale ou jusqu’à 20 cm d’eau ou moins. Une ponction programmée à 48–72 heures ou au 7e jour est faite quelle que soit la pression. Si cela échoue, une dérivation (de préférence ventriculo-péritonéale) est envisagée. Acétazolamide, mannitol et corticoïdes sont possiblement délétères.</p>
<h3>Gravité spécifique</h3>
<ul><li>Dans la méningite virale de l’adulte, un pronostic défavorable (<button class="w" data-k="g02-gos">Glasgow Outcome Scale</button> 1 à 4) est observé à 30 jours après la sortie chez <b>20 %</b> des patients, dans cette cohorte, sans différence nette selon l’étiologie.</li>
<li>Dans le syndrome d’Elsberg, 11 % des patients sont encore sondés à 30 jours après la sortie.</li>
<li>Chez le <button class="w" data-k="g02-nouveau-ne">nouveau-né</button>, l’échovirus 11 (2023) a causé méningite, sepsis, myocardite et insuffisance hépatique fulminante ; 7 décès sur 9 dans la série française.</li></ul>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-diag">▲ Loi de Pareto — Diagnostic et gravité</button></section>
<section class="ilot" id="g02-9"><h2><span class="n">9</span>Traiter la méningite virale</h2><p>Le traitement poursuit trois objectifs : soulager le patient, ne pas rater l’urgence voisine, et éviter les traitements inutiles. Il se hiérarchise ainsi.</p>
<h3>Méningite virale non compliquée</h3>
<p>Le traitement est <b>symptomatique</b> : antipyrétiques et antalgiques. La <button class="w" data-k="g02-pcr-rapide-ev">PCR rapide des entérovirus</button> aide à réévaluer l’antibiothérapie et les critères de sortie. Dans l’étude observationnelle lausannoise, son introduction était associée à un délai de résultat passé de 60 à 5 heures et à un séjour médian de 0,5 jour ; ce résultat ne définit pas une règle universelle de sortie.</p>
<h3>Herpès simplex de type 2 et varicelle-zona</h3>
<p>Dans la cohorte danoise, le <b>délai d’administration</b> d’aciclovir ou de valaciclovir n’est pas associé au pronostic de la méningite à herpès simplex de type 2 ou à varicelle-zona. Cette association observationnelle ne démontre ni l’absence ni la présence d’un bénéfice causal du traitement. La suspicion d’encéphalite herpétique garde une indication urgente distincte. Le <button class="w" data-k="g02-d-valaciclovir">valaciclovir</button> en prévention des récidives méningitiques (2 × 500 mg par jour pendant un an, après 1 g trois fois par jour pendant une semaine) <b>n’est pas recommandé</b> : aucune différence la première année, et un rebond l’année suivante.</p>
<h3>Aciclovir intraveineux : doses de l’information professionnelle suisse</h3>
<table class="t"><thead><tr><th>Situation</th><th>Dose (aciclovir i.v.)</th></tr></thead><tbody><tr><td>Herpès simplex, adulte et plus de 12 ans</td><td>5 mg/kg toutes les 8 heures</td></tr><tr><td>Zona de l’immunocompétent</td><td>5 mg/kg toutes les 8 heures</td></tr><tr><td>Zona de l’immunodéprimé à fonction rénale normale</td><td>10 mg/kg toutes les 8 heures, au moins 5 jours</td></tr><tr><td>Encéphalite herpétique</td><td>10 mg/kg toutes les 8 heures pendant 10 jours</td></tr><tr><td>Enfant de 3 mois à 12 ans : herpès simplex ou varicelle-zona</td><td>250 mg/m² toutes les 8 heures ; encéphalite herpétique : 500 mg/m² toutes les 8 heures pendant 10 jours, selon la FI exacte</td></tr><tr><td>Nouveau-né</td><td>20 mg/kg toutes les 8 heures, 21 jours si atteinte du système nerveux</td></tr></tbody></table>
<p>La perfusion est lente (une heure). Pour l’encéphalite herpétique, la directive S1 recommande 10 mg/kg trois fois par jour pendant au moins 14 jours : cette <button class="w" data-k="g02-aciclovir-duree">divergence de durée</button> (10 jours dans l’information professionnelle, au moins 14 jours dans la directive) est exposée en fenêtre, sans arbitrage automatique. L’adaptation rénale suit la clairance de la créatinine : au-dessus de 50 ml/min, dose usuelle toutes les 8 heures ; de 25 à 50, toutes les 12 heures ; de 10 à 25, toutes les 24 heures. La <button class="w" data-k="g02-d-aciclovir">monographie complète</button> figure dans l’onglet Pharmacologie.</p>
<p>Pour le virus varicelle-zona, l’aciclovir intraveineux est recommandé dans l’encéphalite ; la brivudine, citée par la DGN mais dont la FI suisse ne couvre que le zona précoce de l’adulte immunocompétent, est <b>contre-indiquée avec les fluoropyrimidines</b> (5-fluoro-uracile, capécitabine, tégafur, flucytosine) pendant la prise de brivudine et durant les quatre semaines suivant l’arrêt de la brivudine, car la toxicité peut être mortelle (<button class="w" data-k="g02-d-brivudine">fenêtre</button>).</p>
<h3>Méningite récidivante</h3>
<p>La <button class="w" data-k="g02-mollaret">méningite de Mollaret</button> est autolimitée ; ses récidives peuvent s’étendre sur des années. Le schéma suppressif étudié de valaciclovir 500 mg deux fois par jour n’a pas montré de bénéfice méningé ; cela ne démontre pas l’inefficacité de tout schéma possible. Le suivi et l’information restent essentiels.</p>
<h3>Immunodéprimé</h3>
<p>Une résistance de l’herpès simplex à l’aciclovir est décrite au cours du sida et de la transplantation ; le foscarnet est l’alternative citée par la directive.</p>
<div class="quiz ui"><p><b>Question de contrôle.</b> Une femme de 29 ans, après une méningite à herpès simplex de type 2, demande si un traitement quotidien de valaciclovir préviendra une récidive. Que répondez-vous ?</p><button data-ok="1">Aucun bénéfice n’a été démontré : la première année ne montre pas de différence et un rebond apparaît la seconde.</button><button data-ok="0">Oui, il supprime les récidives méningées.</button><button data-ok="0">Oui, mais seulement pendant six mois.</button><button data-ok="0">Non, car l’aciclovir est contre-indiqué.</button><p class="fb" hidden>L’essai suédois (101 adultes) n’a pas montré de différence la première année et a observé un rebond à l’arrêt (rapport de risques de 3,29 la seconde année). L’insuffisance d’exposition dans le système nerveux est une hypothèse des auteurs, non une mesure démontrée par cet essai.</p></div>
<div class="key"><b>Choix justifiés.</b> Symptomatique pour la forme isolée, antiviral pour l’encéphalite, pas de prévention par valaciclovir des récidives méningées : chaque décision découle d’un bénéfice démontré ou d’un défaut de preuve.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680589210088" target="_blank" rel="noopener">Information professionnelle suisse Valaciclovir-Mepha®, décembre 2025</a>.</p></section>
<section class="ilot" id="g02-10"><h2><span class="n">10</span>Traiter la cryptococcose</h2><p>La cryptococcose peut toucher le système nerveux à tout niveau d’immunité ; la recherche d’une immunodéficience fait partie du bilan. Son traitement s’organise en trois phases : induction, consolidation, entretien.</p>
<table class="t"><thead><tr><th>Phase</th><th>Schéma</th><th>Durée</th></tr></thead><tbody><tr><td>Induction, VIH, ressources élevées</td><td>Amphotéricine B liposomale 3–4 mg/kg/j + flucytosine 25 mg/kg 4 fois par jour</td><td>2 semaines</td></tr><tr><td><button class="w" data-k="g02-ambition">Alternative</button> (VIH, ressources limitées)</td><td>Amphotéricine B liposomale 10 mg/kg en dose unique + flucytosine 25 mg/kg 4 fois par jour + fluconazole 1200 mg/j</td><td>14 jours</td></tr><tr><td>Induction, non-VIH et transplantés</td><td>Amphotéricine B liposomale + flucytosine</td><td>Au moins 2 semaines ; 4 à 6 semaines si <i>C. gattii</i> du système nerveux</td></tr><tr><td>Consolidation</td><td>Fluconazole 400–800 mg/j</td><td>8 semaines</td></tr><tr><td>Entretien</td><td>Fluconazole 200 mg/j</td><td>12 mois ou jusqu’à restauration immunitaire</td></tr></tbody></table>
<p>Pour la méningite cryptococcique associée au VIH, l’information professionnelle suisse d’AmBisome® prévoit en induction standard 3 à 6 mg/kg/j associé pendant au moins 14 jours ; pour l’induction à haute dose, 10 mg/kg au premier jour avec flucytosine 100 mg/kg/j et fluconazole 1200 mg/j pendant 14 jours. L’information professionnelle du fluconazole fixe pour la méningite 400 mg le premier jour puis 200–400 mg/j (jusqu’à 800 mg si menace vitale) pendant au moins 6 à 8 semaines ; la prophylaxie des récidives est de 200 mg/j sans limite de durée.</p>
<h3>Décisions associées</h3>
<ul><li><b>Antirétroviral.</b> Ni immédiat ni très précoce : le <button class="w" data-k="g02-tar-iris">traitement antirétroviral</button> est habituellement différé de <b>4 à 6 semaines</b>. Lorsque le traitement antifongique optimal est disponible, la recommandation individualise ce délai selon l’évolution clinique, la pression, la stérilisation du liquide, les infections associées et la capacité du patient à suivre le traitement.</li>
<li><b>Corticoïdes.</b> La dexaméthasone systématique n’est pas recommandée ; les corticoïdes relèvent de situations précises. La recommandation distingue la courte dexaméthasone pour certaines lésions symptomatiques avec œdème ou effet de masse, et la prednisone/prednisolone généralement 0,5–1 mg/kg/j pour un syndrome inflammatoire de restauration immunitaire persistant malgré les ponctions thérapeutiques, avec décroissance sur 4–6 semaines. Ce recours spécialisé exige d’avoir exclu une rechute microbiologique.</li>
<li><b>Arrêt de l’entretien.</b> Chez les patients infectés par le VIH, à envisager selon la recommandation si la charge virale est indétectable et les CD4 supérieurs à 100 par mm³ après 12 mois ; reprise si les CD4 passent sous 100.</li>
<li><b>Dépistage.</b> L’<button class="w" data-k="g02-crag">antigène cryptococcique sanguin</button> se dépiste chez l’adulte VIH dont les CD4 sont inférieurs à 200 par mm³.</li></ul>
<p>Un <b>contrôle du liquide</b> en fin de première ou de deuxième semaine peut être envisagé pour documenter la stérilisation avant les antirétroviraux ; une culture encore positive à deux semaines conduit à envisager une induction prolongée. La recommandation ne demande pas d’intensifier le traitement sur la seule persistance d’un antigène cryptococcique positif : le résultat doit être distingué d’une culture positive et confronté à l’évolution. Des séquelles neurologiques sont décrites ; aucune fréquence unique n’est transposée ici à tous les contextes. L’amphotéricine B liposomale est moins néphrotoxique que la forme conventionnelle sans en être exempte ; la FI AmBisome rapporte une hypokaliémie à 19 %, sans en faire un risque propre à toute méningite cryptococcique, d’où la surveillance du potassium, du magnésium, des fonctions rénale et hépatique et de l’hémogramme.</p>
<div class="quiz ui"><p><b>Question de contrôle.</b> Chez un patient VIH atteint de méningite cryptococcique, quand débuter le traitement antirétroviral ?</p><button data-ok="1">Après 4 à 6 semaines : ni immédiat ni très précoce.</button><button data-ok="0">Le jour même de l’induction.</button><button data-ok="0">Jamais, tant que le fluconazole est poursuivi.</button><button data-ok="0">Seulement après les 12 mois d’entretien.</button><p class="fb" hidden>La recommandation européenne diffère le traitement antirétroviral de 4 à 6 semaines, après l’induction.</p></div><div class="trap"><span class="k">Piège</span> Traiter la levure sans mesurer la pression d’ouverture à chaque ponction revient à négliger la complication mécanique ; l’acétazolamide, le mannitol et les corticoïdes ne sont pas des mesures d’appoint inoffensives, car ils sont possiblement délétères.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></section>
<section class="ilot" id="g02-11"><h2><span class="n">11</span>Oreillons, candidose et trypanosomiase</h2><h3>Oreillons, rougeole, rubéole, varicelle</h3>
<p>La prévention est vaccinale. En Suisse, le <button class="w" data-k="g02-vaccination">vaccin contre la rougeole, les oreillons et la rubéole</button> (ROR) est administré à 9 et 12 mois ; le vaccin tétravalent (RORV, avec la varicelle) est préféré depuis 2023. Deux doses protègent en général à vie. La méningite ourlienne guérit habituellement sans séquelle chez l’enfant ; la surdité permanente est très rare. Pendant la grossesse, les oreillons du premier trimestre accroissent le risque de fausse couche sans causer de malformation.</p>
<h3>Candidose du système nerveux</h3>
<p>La recommandation ECMM/ISHAM et American Society for Microbiology, 2025 aborde directement la candidose du système nerveux : elle privilégie l’amphotéricine B liposomale, habituellement associée à la flucytosine. Un relais oral par fluconazole, seul ou associé à la flucytosine, dépend de la sensibilité de l’espèce. Le traitement se poursuit jusqu’à disparition des signes cliniques, normalisation du liquide et amélioration des anomalies infectieuses à l’imagerie. Un dispositif intracrânien infecté doit être discuté pour retrait complet avec l’équipe spécialisée.</p><p>La formulation désoxycholate reçoit seulement une recommandation modérée et ne doit pas remplacer la liposomale lorsque celle-ci est disponible. Cela actualise l’énoncé général hérité de 2012. Les posologies spécifiques ne sont pas extrapolées de la cryptococcose : un erratum ultérieur du guide 2025 reste à confronter avant validation du schéma chiffré.</p><p class="src"><a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener">ECMM/ISHAM et American Society for Microbiology, 2025,pp. e287–e288,texte consulté</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41109319/" target="_blank" rel="noopener">erratum du 15 octobre 2025 repéré,texte non accessible</a>.</p>
<h3>Trypanosomiase humaine africaine (G02.8*)</h3><p>La trypanosomiase humaine africaine doit être envisagée à partir de l’exposition et du syndrome, puis confirmée par la recherche du parasite. La forme <i>T. b. gambiense</i>, surtout en Afrique occidentale et centrale, évolue lentement ; <i>T. b. rhodesiense</i>, en Afrique orientale et australe, peut évoluer rapidement et impose un traitement immédiat lorsque le cas est confirmé. Une fièvre, des adénopathies ou des signes neurologiques ne suffisent pas à établir le diagnostic.</p>
<h4>Du stade hémolymphatique à l’atteinte nerveuse</h4><p>Le premier stade associe au maximum 5 leucocytes/µl et l’absence de trypanosomes dans le liquide. Le second stade, méningo-encéphalitique, correspond à plus de 5 leucocytes/µl <b>ou</b> à des parasites dans le liquide. Pour la forme gambiense, un liquide contenant au moins 100 leucocytes/µl définit le stade méningo-encéphalitique sévère. Les troubles du sommeil peuvent également apparaître dans une forme non sévère : ils ne suffisent donc pas à attribuer ce stade.</p>
<h4>Choisir selon l’espèce, l’âge, le poids et la gravité</h4><table class="t"><thead><tr><th>Situation selon l’OMS 2024</th><th>Choix et limite</th></tr></thead><tbody><tr><td>Gambiense, au moins 6 ans et 20 kg, sans forme sévère</td><td>Fexinidazole privilégié. Une ponction peut être évitée si la probabilité clinique de forme sévère est faible et si un suivi fiable est possible ; en cas de doute, le liquide guide le choix.</td></tr><tr><td>Gambiense, stade sévère avec au moins 100 leucocytes/µl</td><td>Association nifurtimox–éflornithine (NECT) privilégiée au fexinidazole.</td></tr><tr><td>Gambiense, moins de 6 ans ou moins de 20 kg</td><td>Pentamidine au premier stade ; NECT au second stade.</td></tr><tr><td>Rhodesiense, au moins 6 ans et 20 kg</td><td>Fexinidazole en première intention aux deux stades ; la ponction ne guide habituellement le traitement que lorsque le patient sort de cette indication, notamment pour l’âge, le poids ou une contre-indication.</td></tr><tr><td>Rhodesiense, moins de 6 ans ou moins de 20 kg</td><td>Suramine au premier stade ; mélarsoprol au second stade. Si les médicaments recommandés manquent, l’OMS prévoit une prise en charge transitoire par pentamidine.</td></tr></tbody></table>
<p>Ces recommandations sont conditionnelles, avec un niveau de certitude faible ou très faible selon la situation. Elles nécessitent une équipe expérimentée et ne constituent pas une preuve d’autorisation ou de disponibilité des produits en Suisse. Les autres choix, notamment en cas de rechute ou de contre-indication, doivent suivre le guide complet et la FI du produit effectivement utilisé.</p>
<h4>Administrer et suivre : le repas fait partie du traitement</h4><p>Le fexinidazole est donné pendant 10 jours, chaque prise étant directement observée par un soignant formé, pendant ou immédiatement après un repas solide substantiel. Une prise à jeun n’est pas considérée comme correctement absorbée. La fenêtre <button class="w" data-k="g02-d-fexinidazole">Fexinidazole Winthrop 600 mg</button> détaille les doses du produit exact selon le poids et ses précautions, à partir du RCP européen effectivement lu. Cet avis vise une utilisation hors Union européenne ; le statut suisse n’est pas établi. Le RCP permet une surveillance à domicile par un aidant informé dans certaines situations, alors que le guide OMS demande une prise directement observée par un soignant.</p><p>Après fexinidazole dans la forme gambiense, l’OMS recommande des examens à 6, 12, 18 et 24 mois, car une rechute peut être tardive. Pour la forme rhodesiense, le suivi est plus rapproché : fin du traitement, 1 et 3 mois, puis contrôle à 6 et 12 mois. La réapparition de symptômes justifie un examen sans attendre ce calendrier.</p><div class="trap"><span class="k">Piège</span> Ne pas appliquer à rhodesiense le seuil de 100 leucocytes/µl qui guide le choix thérapeutique dans gambiense. Ne pas confondre une voie orale avec un traitement sans surveillance.</div><p class="src"><a href="https://iris.who.int/handle/10665/378083" target="_blank" rel="noopener">OMS, Guidelines for the treatment of human African trypanosomiasis, juin 2024, pp. 2–4, 6–12, 21–25, 30</a>. Passages consultés le 2 novembre 2026.</p><h3 id="g02-coccidioidomycose">Coccidioïdomycose : penser au voyage devant une méningite prolongée</h3><p><i>Coccidioides immitis</i> et <i>C. posadasii</i> sont des champignons associés aux sols de régions arides des Amériques, notamment au sud-ouest des États-Unis et au Mexique. L’exposition à des poussières ou à la terre lors d’un séjour fait partie de l’anamnèse. La revue suisse de Tudisco et collaborateurs rappelle la possibilité d’une atteinte initialement respiratoire puis disséminée, ainsi que l’intérêt de rechercher une cause fongique devant une éosinophilie du liquide. Cette ancienne synthèse clinique n’est pas utilisée ici pour ses chiffres de fréquence ou ses doses.</p><h4>De l’exposition à la preuve microbiologique</h4><p>La recommandation ECMM/ISHAM 2021 demande de considérer l’atteinte méningée devant des céphalées persistantes ou d’autres symptômes neurologiques. La culture et l’identification de sphérules sur un prélèvement apportent une preuve ; la sérologie sanguine est recommandée dans les suspicions de coccidioïdomycose, et le liquide doit être étudié si une méningite est suspectée. Une radiographie thoracique recherche l’atteinte pulmonaire associée. Les différentes techniques sérologiques n’ont pas des performances identiques.</p><p>Le liquide peut ressembler à celui d’autres méningites chroniques, notamment tuberculeuse ou cryptococcique. L’éosinophilie oriente sans être spécifique ; sa recherche n’est pas un test d’exclusion. Documenter cellules, protéines, glucose, pression et examens fongiques adaptés ; une imagerie normale ne suffit pas à exclure la méningite.</p><h4>Traiter et suivre durablement</h4><p>L’ECMM/ISHAM retient le fluconazole en première intention méningée. L’IDSA 2016 précise, chez la plupart des adultes à fonction rénale normale, 400 à 1200 mg par voie orale une fois par jour, puis un traitement azolé à vie en raison des rechutes. Ce schéma de recommandation américaine n’est pas une indication explicitement répertoriée dans la FI suisse Fluconazole Sandoz eco consultée ; sa mise en œuvre nécessite une décision spécialisée et la vérification du produit, du rein et des interactions.</p><p>Une hydrocéphalie ou une hypertension intracrânienne impose une évaluation spécifique, avec imagerie et avis neurochirurgical précoces. L’aggravation malgré traitement conduit à réexaminer le liquide, l’imagerie, l’exposition médicamenteuse et les complications ; elle ne justifie pas un changement empirique isolé de molécule.</p><div class="trap"><span class="k">Piège</span> Ne pas appliquer à la méningite les possibilités d’observation sans traitement d’une coccidioïdomycose pulmonaire simple. Une amélioration des symptômes ne prouve pas l’éradication de l’infection méningée.</div><p class="src"><a href="https://www.revmed.ch/view/481214/4008357/RMS_idPAS_D_ISBN_pu2013-39s_sa03_art03.pdf" target="_blank" rel="noopener">Tudisco et al., Revue Médicale Suisse 2013, pp. 2084–2086</a> ; <a href="https://www.ecmm.info/wp-content/uploads/Thompson-Global-Guideline-Lancet-ID-2021.pdf" target="_blank" rel="noopener">ECMM/ISHAM 2021, coccidioïdomycose, pp. e367–e368</a> ; <a href="https://www.idsociety.org/practice-guideline/coccidioidomycosis/" target="_blank" rel="noopener">IDSA 2016, sections 13–17</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">FI Fluconazole Sandoz eco, juillet 2025, indications, rein et interactions</a>. Passages réellement lus le 2 novembre 2026.</p><h3 id="g02-chagas">Maladie de Chagas : distinguer infection chronique et réactivation neurologique</h3><p><i>Trypanosoma cruzi</i> est transmis notamment par les déjections du vecteur, par voie congénitale, alimentaire, transfusionnelle ou lors d’une greffe. La synthèse suisse rappelle l’importance d’interroger l’origine et les séjours en Amérique latine, ainsi que les antécédents maternels et d’immunosuppression. Une enquête ciblée chez des migrants ne fournit pas une incidence pour la population suisse.</p><h4>Pourquoi l’immunité change le tableau</h4><p>L’infection chronique peut rester asymptomatique ou donner une atteinte cardiaque ou digestive. Chez une personne immunodéprimée, la reprise de la multiplication parasitaire peut provoquer une réactivation. Dans le contexte du VIH, elle survient surtout lorsque les CD4 sont inférieurs à 200 cellules/µl. Le système nerveux peut être atteint sous forme de méningoencéphalite, parfois nécrotique ou hémorragique, ou de lésions focales appelées chagomes. Céphalées, fièvre, vomissements, confusion, crises et déficit focal sont possibles ; les signes méningés peuvent manquer. L’imagerie peut ressembler à celle d’une toxoplasmose et ne suffit pas à identifier l’agent.</p><h4>Confirmer sans confondre les tests</h4><p>Pour une infection chronique, deux méthodes sérologiques reposant sur des antigènes ou techniques différents sont nécessaires. Chez l’immunodéprimé, la sérologie peut être négative. Une PCR qualitative positive isolée dans le sang ne démontre pas, à elle seule, une réactivation : la cinétique quantitative de la parasitémie et le tableau clinique sont déterminants.</p><p>Une suspicion neurologique impose l’imagerie et l’évaluation de la sécurité d’une ponction. La recherche de parasites et de leur matériel génétique dans le sang, le liquide ou un tissu ciblé doit être organisée avec le laboratoire. Un examen sanguin négatif n’exclut pas l’atteinte tissulaire. Dans le liquide, la réaction cellulaire peut être modeste ; la détection de trypomastigotes apporte une preuve. Rechercher aussi une myocardite ou une autre atteinte associée.</p><h4>Traiter une réactivation et restaurer l’immunité</h4><p>La recommandation NIH pour les adultes et adolescents vivant avec le VIH demande de traiter toute maladie aiguë ou réactivée. Elle propose le <button class="w" data-k="g02-d-benznidazole">benznidazole</button> à 5–8 mg/kg/j en deux prises pendant 60 jours, la plupart des experts limitant la dose à 300 mg/j, ou le <button class="w" data-k="g02-d-nifurtimox">nifurtimox</button> à 8–10 mg/kg/j en trois prises avec nourriture pendant 60 jours. Ces recommandations reposent sur des données limitées ; elles ne sont pas une FI suisse ni un schéma universel de toute infection chronique.</p><p>Le RCP espagnol Lampit inclut l’adulte après appréciation individuelle du bénéfice-risque et prévoit une durée de 60 à 120 jours : cette portée diffère du schéma VIH du NIH. Le libellé américain exact Benznidazole Tablets consulté est pédiatrique ; l’emploi adulte décrit ici relève de la recommandation, hors de ce libellé. Les fenêtres précisent ces distinctions et la surveillance.</p><p>Le NIH recommande de commencer ou d’optimiser le traitement antirétroviral ; il n’identifie pas de raison propre à Chagas de le retarder. Ne pas importer le délai de la cryptococcose. La guérison parasitologique peut rester incertaine, et l’intérêt d’une prophylaxie secondaire n’est pas établi. Organiser un suivi clinique, parasitologique et de tolérance spécialisé plutôt que promettre une éradication après une cure.</p><div class="trap"><span class="k">Piège</span> Infection chronique séropositive, PCR sanguine positive et réactivation neurologique ne sont pas trois formulations équivalentes du même diagnostic. Une lésion évocatrice de toxoplasmose n’exclut pas Chagas chez une personne exposée et immunodéprimée.</div><p class="src"><a href="https://www.revmed.ch/view/518295/4229436/RMS_429_1008.pdf" target="_blank" rel="noopener">Weibel Galluzzo et al., Revue Médicale Suisse 2014, partie Chagas</a> ; <a href="https://www.semtsi.es/wp-content/uploads/2021/12/Chagas-1.pdf" target="_blank" rel="noopener">Pérez-Molina et al., recommandations SEMTSI 2011, pp. 289–291</a> ; <a href="https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-opportunistic-infections/chagas-disease" target="_blank" rel="noopener">NIH, Chagas disease, actualisation 2023, revue du 16 mars 2026, adultes/adolescents avec VIH</a>. Passages lus le 2 novembre 2026.</p>
<div class="key"><b>Sources et limites.</b> La trypanosomiase est maintenant décrite à partir du guide OMS 2024 effectivement lu. La disponibilité suisse des produits rares et l’erratum candidose restent des limites explicites. Chagas et la coccidioïdomycose ont désormais leurs sections sourcées.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a> ; <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener">ECMM/ISHAM, candidose, 2025, principes du système nerveux</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-trait">▲ Loi de Pareto — Traitement</button></section>
<section class="ilot" id="g02-12"><h2><span class="n">12</span>Suivi et pronostic</h2><p>La méningite virale est souvent qualifiée de bénigne ; les chiffres nuancent ce jugement. Dans la cohorte danoise, <b>20 %</b> des adultes ont un pronostic défavorable (Glasgow Outcome Scale 1 à 4) 30 jours après la sortie, sans différence nette selon le virus, y compris sans pathogène identifié ; le sexe féminin est associé à un risque relatif ajusté de 1,34 (intervalle de confiance à 95 % : 1,03–1,75), sans preuve de causalité. Il convient donc de prévoir un contrôle qui évalue la récupération fonctionnelle, et pas seulement la disparition de la fièvre.</p>
<h3>Lire le pronostic en un coup d’œil</h3>
<table class="t"><thead><tr><th>Situation</th><th>Repère de pronostic</th><th>Conséquence pour le suivi</th></tr></thead><tbody><tr><td>Méningite virale de l’adulte</td><td>Pronostic défavorable chez 20 % à 30 jours après la sortie</td><td>Prévoir un contrôle fonctionnel</td></tr><tr><td>Méningite à herpès simplex de type 2</td><td>22 % évoluent vers une forme récidivante</td><td>Informer le patient du risque de récidive</td></tr><tr><td>Syndrome d’Elsberg</td><td>11 % encore sondés à 30 jours après la sortie ; 5/25 avec handicap modéré à 180 jours après la sortie</td><td>Contrôler la miction à 30 jours après la sortie</td></tr><tr><td>Cryptococcose</td><td>Mortalité de 24 à 47 % à 10 semaines dans les études citées, principalement en contexte de ressources limitées</td><td>Ponction de contrôle, entretien prolongé</td></tr></tbody></table>
<h3>Selon l’étiologie</h3>
<ul><li><b>Mollaret.</b> Pronostic fonctionnel meilleur que celui d’un épisode isolé à herpès simplex de type 2. Les <button class="w" data-k="g02-mollaret">cellules de Mollaret</button> ne sont pas pathognomoniques ; la PCR n’est positive que parfois. Une hospitalisation pour récidive survient chez 6 % des patients par an ; le rapport de risques est de 3,93 avec trois épisodes antérieurs ou plus.</li>
<li><b>Elsberg.</b> Invalidité modérée (Glasgow Outcome Scale 4) chez 20 % des patients à 180 jours après la sortie.</li>
<li><b>Cryptococcose.</b> Mortalité de 24 à 47 % à 10 semaines dans les études citées, principalement en contexte de ressources limitées ; dans l’essai AMBITION, 24,8 % à 10 semaines avec une dose unique d’amphotéricine B liposomale contre 28,7 %, chez des adultes vivant avec le VIH en Afrique. Envisager une ponction de contrôle en fin de première ou de deuxième semaine et une induction prolongée si la culture demeure positive à deux semaines.</li></ul>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1111/ene.16081" target="_blank" rel="noopener">Petersen et al., méningite de Mollaret au Danemark, Eur J Neurol 2024</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></section>
<section class="ilot" id="g02-13"><h2><span class="n">13</span>Situations particulières</h2><ul><li><b>Nouveau-né.</b> L’échovirus 11 (2023, France et pays voisins) a causé méningite, sepsis, myocardite et insuffisance hépatique fulminante. À distinguer de l’infection néonatale à herpès simplex : pour cette dernière, la FI d’aciclovir prévoit 20 mg/kg toutes les 8 heures pendant 21 jours si atteinte du système nerveux ou forme disséminée. Cette posologie ne traite pas l’échovirus.</li>
<li><b>Enfant.</b> La dissémination entérovirale (sang, selles) est fréquente ; dans cette série, aucun adulte ayant les prélèvements appariés n’était positif dans le sang et les selles.</li>
<li><b>Grossesse.</b> Les oreillons du premier trimestre augmentent le risque de fausse couche sans causer de malformation. Les données sur les autres virus n’ont pas été lues.</li>
<li><b>Immunodéprimé.</b> Cytomégalovirus, virus d’Epstein-Barr, varicelle-zona, JCV ; cryptocoque ; résistance possible de l’herpès simplex à l’aciclovir, alors traité par le <button class="w" data-k="g02-immunodeprime">foscarnet</button>.</li>
<li><b>Insuffisance rénale ou sujet âgé.</b> L’aciclovir demande une hydratation suffisante et une dose adaptée ; la neurotoxicité (confusion, hallucinations, convulsions, coma) survient surtout dans ces situations et est réversible, la dialyse étant souvent efficace.</li>
<li><b><button class="w" data-k="g02-sexe">Femmes.</button></b> Elles sont surreprésentées dans la méningite à herpès simplex de type 2 (77 %) et dans le syndrome d’Elsberg (79 %).</li></ul>
<h3>Cas récapitulatif</h3>
<p>Une femme de 34 ans présente un premier épisode de céphalées, de fièvre et de rétention urinaire. Le liquide montre 153 cellules par µl ; la PCR identifie l’herpès simplex de type 2. Le tableau correspond à une radiculite lombosacrée (Elsberg). Elle est sondée tant que la rétention persiste ; le valaciclovir de prévention n’est pas prescrit en l’absence de bénéfice démontré. Une consultation de suivi à 30 jours après la sortie vérifie la miction.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></section>
<section class="ilot" id="g02-14"><h2><span class="n">14</span>Points clés : critères, profils usuels et limites</h2><div class="alert"><b>Ne pas confondre critères et profils descriptifs.</b> (1) <b>Codage</b> : G02* exige le code † de la maladie causale ; il n’existe pas de G02 isolé. (2) <b>Méningite virale isolée</b> : méningisme sans signe encéphalitique ; la DGN décrit habituellement une pléiocytose inférieure à 1000/µl, devenue lymphocytaire, avec protéines et lactate normaux ou peu élevés. Ce profil ne suffit pas à confirmer la cause ni à exclure une bactérie. (3) <b>Suspicion d’encéphalite</b> : une altération de la conscience, des crises ou des signes focaux imposent une réévaluation urgente ; si une cause herpétique est suspectée, débuter l’aciclovir sans attendre la confirmation. Le codage dépend ensuite de la maladie retenue. (4) <b>Cryptococcose</b> : antigène cryptococcique du liquide ou du sang, ou culture positive, avec pression d’ouverture mesurée.</div>
<div class="key"><b>Paramètres clés.</b>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody><tr><td>Incidence de la méningite virale de l’adulte (Danemark)</td><td>4,7 pour 100 000 par an</td></tr><tr><td>Étiologies</td><td>Entérovirus 39 %, herpès simplex de type 2 16 %, varicelle-zona 15 %, inconnue 27 %</td></tr><tr><td>Céphalées + raideur de nuque + photophobie ou hyperacousie (cohorte danoise)</td><td>28 %</td></tr><tr><td>Cellules médianes du liquide</td><td>160/µl (écart interquartile 60–358)</td></tr><tr><td>Méningite virale</td><td>Souvent moins de 1000 cellules/µl ; lactate peu augmenté dans le profil habituel, sans seuil d’exclusion</td></tr><tr><td>Procalcitonine</td><td>Moins de 0,5 ng/ml dans la forme virale</td></tr><tr><td>PCR rapide des entérovirus</td><td>Délai 5 heures ; séjour médian 0,5 jour</td></tr><tr><td>Aciclovir (encéphalite herpétique)</td><td>10 mg/kg/8 h ; 10 jours (information professionnelle) ou au moins 14 jours (directive S1)</td></tr><tr><td>Récidive de la méningite à herpès simplex de type 2</td><td>22 % évoluent vers Mollaret</td></tr><tr><td>Cryptococcose : dépistage</td><td>Antigène sanguin si CD4 inférieurs à 200/mm³</td></tr><tr><td>Cryptococcose : pression</td><td>Ponction évacuatrice si pression ≥20 cm d’eau avec symptômes</td></tr><tr><td>Antirétroviral après cryptococcose</td><td>Différé de 4 à 6 semaines</td></tr></tbody></table></div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank"
