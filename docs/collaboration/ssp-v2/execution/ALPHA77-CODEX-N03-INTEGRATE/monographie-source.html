]{left:24%;top:19%}[data-n03-figure="sediment"] [data-n03-mark="2"]{left:74%;top:20%}[data-n03-figure="sediment"] [data-n03-mark="3"]{left:25%;top:71%}[data-n03-figure="sediment"] [data-n03-mark="4"]{left:77%;top:75%}[data-n03-figure="kidney"] [data-n03-mark="1"]{left:23%;top:39%}[data-n03-figure="kidney"] [data-n03-mark="2"]{left:46%;top:31%}[data-n03-figure="kidney"] [data-n03-mark="3"]{left:65%;top:61%}[data-n03-figure="kidney"] [data-n03-mark="4"]{left:87%;top:87%}[data-n03-figure="fsgs"] [data-n03-mark="1"]{left:55%;top:43%}[data-n03-figure="fsgs"] [data-n03-mark="2"]{left:74%;top:49%}[data-n03-figure="fsgs"] [data-n03-mark="3"]{left:23%;top:25%}[data-n03-figure="fsgs"] [data-n03-mark="4"]{left:39%;top:61%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#n03-1">Définition</a></li><li><a href="#n03-2">Épidémiologie</a></li><li><a href="#n03-3">Physiopathologie</a></li><li><a href="#n03-4">Démarche clinique</a></li><li><a href="#n03-5">Anamnèse</a></li><li><a href="#n03-6">Examen clinique</a></li><li><a href="#n03-7">Syndromes</a></li><li><a href="#n03-8">Diagnostic positif</a></li><li><a href="#n03-9">Explorations</a></li><li><a href="#n03-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#n03-11">Prise en charge</a></li><li><a href="#n03-12">Prévention, suivi et pronostic</a></li><li><a href="#n03-13">Points clés</a></li><li><a href="#n03-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="N03"><section class="ilot" id="n03-question"><h2>Une anomalie ancienne, une décision actuelle</h2><p><b>Vignette fictive.</b> Une personne consulte pour renouveler un traitement antihypertenseur. Depuis huit mois, ses examens montrent une protéinurie à prédominance albuminurique et une hématurie microscopique ; le débit estimé est passé de 68 à 51 mL/min/1,73 m². Elle ne ressent aucune douleur. Le dossier porte simplement la mention « néphrite chronique ». Faut-il renouveler sans changement, prescrire un corticoïde ou proposer une dialyse ?</p><p>La première tâche consiste à vérifier les mesures, leur chronologie et les traitements. Il faut ensuite apprécier la vitesse de dégradation, rechercher une complication et établir la cause de l’atteinte glomérulaire. L’absence de symptômes n’écarte pas le risque ; le caractère chronique ne démontre pas que toute lésion soit inactive. Une protéinurie persistante peut traduire une maladie encore active, une cicatrice ou les deux. La distinction change le bilan et le traitement.</p><div class="key"><b>À retenir.</b> Distinguer quatre questions : quel syndrome, quelle cause, quelle activité et quel risque de progression ?</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p></section>
<section class="ilot" id="n03-1"><h2>1. Définition : un syndrome glomérulaire dans la durée</h2><p>Le syndrome de glomérulonéphrite chronique associe une <b>protéinurie glomérulaire persistante</b>, avec ou sans hématurie, hypertension et diminution de fonction rénale. La présentation peut rester discrète. Dans le tableau pédagogique du CUEN, toutes les glomérulopathies chroniques peuvent produire ce profil : il ne correspond donc pas à une maladie unique ni à une seule lésion histologique.</p><p>Le terme <b>chronique</b> exige une histoire documentée. Pour la maladie rénale chronique, les critères formels reposent sur une anomalie de structure ou de fonction présente au moins trois mois et ayant des conséquences pour la santé. Les valeurs antérieures, l’urine, l’imagerie et parfois la fibrose ou l’atrophie sur biopsie apportent des preuves. Un seul débit bas ne permet pas d’affirmer la chronicité ; une atteinte aiguë ou une aggravation aiguë sur maladie chronique reste possible.</p><p>Le syndrome glomérulaire et la maladie rénale chronique répondent à deux questions différentes. Le premier décrit un profil de maladie ; la seconde décrit une durée et un retentissement rénal classés selon cause, filtration et albuminurie. Une maladie glomérulaire peut exister avec un débit encore préservé. Inversement, toute maladie rénale chronique n’est pas glomérulaire, et toute lésion glomérulaire ne relève pas administrativement de N03.</p><p>Dans la CIM-10-GM suisse consultée, N03 inclut les termes glomérulopathie, glomérulonéphrite et néphrite chroniques. Les exclusions comprennent la néphrite tubulo-interstitielle chronique N11, la glomérulonéphrite sclérosante diffuse classée N18 et le syndrome néphritique sans précision N05. Les suffixes morphologiques se choisissent après le diagnostic ; ils ne doivent pas devenir l’objectif du bilan.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">CH-CIM — XML officiel : N03, N00–N08 et modificateur S14N00_4</a>.</p><p><button class="w" data-k="n03-exp-1">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-1">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-2"><h2>2. Épidémiologie : préciser ce que l’on compte</h2><p>Le Pocketguide 2025 de la Société suisse de néphrologie estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique, souvent non diagnostiquée. Ce chiffre concerne l’ensemble de la maladie rénale chronique. Il ne mesure ni l’incidence du syndrome néphritique chronique N03, ni celle d’une glomérulonéphrite particulière. Les sources retenues n’apportent pas de taux national direct de N03 ; aucun chiffre de dialyse ou de biopsie ne lui est substitué.</p><p>La fréquence observée des maladies glomérulaires dépend du dépistage, de l’indication et de l’accès à la biopsie, de l’âge et des maladies associées. Une série de biopsies décrit des personnes sélectionnées pour un examen, tandis qu’une enquête de population inclut aussi des atteintes peu symptomatiques. Une fréquence de lésion parmi des biopsies ne s’applique donc pas à toutes les personnes ayant une protéinurie.</p><p>La néphropathie à IgA, les maladies auto-immunes ou infectieuses, les anomalies du collagène IV et les maladies à dépôts participent au diagnostic différentiel. Leur poids varie avec le contexte. Un antécédent familial, un lupus connu, une infection persistante ou une gammapathie modifie la probabilité de départ. Le diabète et l’hypertension sont également fréquents dans la population ; leur présence ne suffit pas à expliquer une hématurie glomérulaire active ou une trajectoire atypique.</p><p>La conséquence pratique est de dépister les personnes à risque, de quantifier les anomalies et d’établir la cause. Les données générales justifient une vigilance ; elles ne donnent pas le diagnostic individuel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p><p><button class="w" data-k="n03-exp-2">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-2">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-3"><h2>3. Physiopathologie : perméabilité, inflammation et perte néphronique</h2><p>Le filtre glomérulaire normal associe endothélium, membrane basale et podocytes. Il sépare le sang de l’espace urinaire tout en permettant la filtration. Une altération peut augmenter le passage de protéines et permettre celui d’érythrocytes. La protéinurie à prédominance albuminurique et les hématies dysmorphiques donnent ainsi des indices sur le compartiment atteint ; ils ne nomment pas à eux seuls la maladie.</p><p>Les lésions peuvent associer dépôts immunitaires, prolifération cellulaire, atteinte structurale et cicatrices. Une prolifération active et une sclérose ne sont pas synonymes. La sclérose remplace une partie ou la totalité du glomérule par du matériel cicatriciel ; la fibrose et l’atrophie tubulo-interstitielle renseignent sur la chronicité et le pronostic. Le compte rendu de biopsie doit être interprété avec la clinique et la fonction, car un prélèvement peut montrer simultanément activité et dommages anciens.</p><figure data-n03-figure="podocytes"><div data-n03-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n03/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n03-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La perte de néphrons modifie la charge imposée aux néphrons restants. Le risque évolutif ne dépend donc pas seulement de la persistance de l’agression initiale : l’hémodynamique, la pression artérielle et la protéinurie participent également aux conséquences de la maladie. La néphroprotection vise ces voies, tandis qu’un traitement étiologique vise le mécanisme responsable lorsqu’il est identifié et accessible à un traitement.</p><p>Un aspect de sclérose segmentaire et focale peut avoir plusieurs significations. La microphotographie ci-dessous, attribuée à une variante hilaire par sa source, montre un type de lésion, sans établir un mécanisme primaire ou secondaire. Une photographie PAS ne suffit pas à décider d’une immunosuppression.</p><figure data-n03-figure="fsgs"><div data-n03-frame="wide"><img alt="Microphotographie humaine PAS d’une lésion de sclérose segmentaire et focale, variante hilaire selon la provenance" loading="lazy" src="assets/img/n03/alpha/codex/Focal_segmental_glomerulosclerosis_-_high_mag.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span><span aria-hidden="true" data-n03-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Peloton capillaire du glomérule central : repère du compartiment glomérulaire.</li><li>Région plus dense à droite du glomérule ; la source attribue le champ à une variante hilaire de sclérose segmentaire et focale.</li><li>Tubules voisins : compartiment distinct du glomérule central.</li><li>Limite externe du glomérule et espace périphérique : repère topographique.</li></ol><p>Un champ PAS ne détermine ni proportion de glomérules lésés, ni cause primaire/secondaire/génétique, ni indication d’immunosuppression. La lésion illustrée n’est pas une preuve d’un diagnostic N03 chez un patient donné.</p><p data-n03-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Focal_segmental_glomerulosclerosis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n03-exp-3">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-3">▲ Loi de Pareto — Le raisonnement essentiel</button><p class="src">Sources lues : <a data-reference-source="1" href="https://www.chuv.ch/en/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/pronostic-suivi-et-prise-en-charge" target="_blank" rel="noopener">CH-CHUV-MEC — Comment évolue l’insuffisance rénale chronique ?</a>.</p></section>
<section class="ilot" id="n03-4"><h2>4. Démarche clinique : commencer par la trajectoire et la gravité</h2><p><b>Rechercher une aggravation.</b> Comparer créatinine, débit, pression, protéinurie et diurèse aux valeurs précédentes. Une oligurie nouvelle, une dyspnée, une surcharge, une hypertension avec retentissement ou une chute rapide de fonction imposent une évaluation accélérée, souvent urgente. Un syndrome pulmonaire–rénal possible ne relève pas du prochain contrôle annuel. Le mot « chronique » dans le dossier ne protège pas d’une complication aiguë.</p><p><b>Confirmer et caractériser.</b> Vérifier recueil urinaire, infection, contamination et méthode de quantification. Distinguer albumine et protéines totales ; demander un sédiment morphologique lorsque l’origine glomérulaire est discutée. Établir la chronicité par des preuves, sans attendre trois mois lorsqu’un tableau menaçant nécessite une prise en charge immédiate.</p><p><b>Rechercher la cause et l’activité.</b> Reprendre l’anamnèse, les maladies systémiques, les médicaments, les antécédents familiaux et les examens antérieurs. Le néphrologue choisit les investigations susceptibles de modifier la décision : immunologie orientée, recherche infectieuse, génétique ou biopsie. Une maladie déjà connue peut coexister avec une autre atteinte ; la discordance entre diagnostic ancien et évolution actuelle mérite une réévaluation.</p><p><b>Évaluer le risque et organiser les soins.</b> Classer selon cause, débit et albuminurie, puis intégrer leur évolution et les complications. La SGN recommande l’orientation notamment devant hématurie glomérulaire, cause inconnue, progression ou albuminurie importante. Le compte rendu doit préciser le prochain contrôle, les traitements et les signes qui justifient un contact anticipé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n03-exp-4">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-4">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-5"><h2>5. Anamnèse : reconstituer une maladie souvent silencieuse</h2><table class="t"><thead><tr><th>Domaine</th><th>Questions</th><th>Interprétation</th></tr></thead><tbody><tr><td>Chronologie</td><td>Première protéinurie, hématurie, créatinine et pression connues ; épisodes aigus ; résultats datés</td><td>Prouver la durée et repérer une accélération ou un événement réversible.</td></tr><tr><td>Signes rénaux</td><td>Urines rouges, mousse, diurèse, œdèmes, prise de poids</td><td>Orienter le retentissement ; la mousse ou la couleur ne quantifient pas les protéines.</td></tr><tr><td>Maladie systémique</td><td>Purpura, douleurs articulaires, atteinte cutanée, ORL, respiratoire ou générale</td><td>Discuter maladie auto-immune, vascularite ou infection selon l’ensemble du tableau.</td></tr><tr><td>Infection</td><td>Fièvre prolongée, foyer connu, exposition et antécédents viraux pertinents</td><td>Une infection peut entretenir ou imiter une glomérulopathie immune.</td></tr><tr><td>Famille</td><td>Hématurie, dialyse, âge de survenue, audition et yeux</td><td>Orienter collagène IV ou autre maladie héréditaire, sans diagnostic sur le seul arbre familial.</td></tr><tr><td>Médicaments</td><td>AINS, automédication, compléments, produits naturels, traitements récents et observance</td><td>Détecter toxicité, interaction, interruption ou modification hémodynamique.</td></tr><tr><td>Événements intercurrents</td><td>Vomissements, diarrhée, fièvre, chirurgie, changement diurétique</td><td>Chercher déplétion et risque d’aggravation aiguë ; prévoir une reprise sécurisée des traitements.</td></tr><tr><td>Vie quotidienne</td><td>Alimentation, sel, activité, tabac, travail, capacité à suivre le plan</td><td>Adapter les soins aux possibilités et préférences ; éviter une prescription théorique inapplicable.</td></tr><tr><td>Grossesse et reproduction</td><td>Grossesse actuelle, projet, contraception et conseil génétique si pertinent</td><td>Revoir tôt les traitements, notamment bloqueurs du système rénine–angiotensine.</td></tr></tbody></table><p>Une anamnèse négative n’exclut pas une maladie active. À l’inverse, une plainte non spécifique ne suffit pas à prouver une complication urémique. Les médicaments réellement pris, y compris ceux achetés sans ordonnance, et les dates des résultats font partie du diagnostic.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p><p><button class="w" data-k="n03-exp-5">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-5">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-6"><h2>6. Examen clinique : mesurer le retentissement</h2><p>Mesurer la pression avec une méthode fiable et répétable ; rechercher une hypotension orthostatique si les symptômes, l’âge ou les traitements le suggèrent. La cible thérapeutique ne se discute qu’après avoir précisé la technique et la tolérance. La recommandation suisse de 120–129 mmHg systolique chez l’adulte se module selon fragilité et comorbidités ; elle ne se transpose pas directement à l’enfant.</p><p>Évaluer poids et évolution pondérale, œdèmes, signes de congestion et état d’hydratation. Une prise de poids peut traduire une rétention, tandis qu’une baisse de pression avec pertes digestives peut signaler une déplétion. L’œdème ne prouve ni la quantité d’albumine perdue ni une indication d’albumine intraveineuse. Une dyspnée exige de rechercher sa cause et sa gravité plutôt que d’augmenter automatiquement le diurétique.</p><p>L’examen recherche les indices suggérés par l’histoire : peau et purpura, articulations, signes infectieux ou systémiques, régions lombaires et appareil urinaire selon les symptômes. Une atteinte respiratoire, une altération neurologique ou un état général qui se dégrade modifie la priorité. Les manifestations auditives et oculaires peuvent orienter une maladie du collagène IV ; l’absence de plainte ne remplace pas un examen spécialisé lorsqu’il est indiqué.</p><p>Chez l’enfant, suivre croissance et développement, interpréter pression et fonction selon les références pédiatriques et organiser la continuité des soins. Chez l’adulte âgé, évaluer aussi chutes, fragilité, nutrition et charge médicamenteuse. L’examen termine une synthèse : stabilité, retentissement, arguments de cause et éléments encore non expliqués.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p><p><button class="w" data-k="n03-exp-6">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-6">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-7"><h2>7. Syndromes et classifications : garder plusieurs axes</h2><table class="t"><thead><tr><th>Axe</th><th>Ce qu’il décrit</th><th>Limite</th></tr></thead><tbody><tr><td>Syndrome glomérulaire chronique</td><td>Protéinurie persistante ± hématurie, hypertension, baisse de fonction</td><td>Ce profil ne nomme pas l’étiologie.</td></tr><tr><td>Syndrome néphritique aigu</td><td>Installation brutale avec hématurie et retentissement rénal/hydrosodé</td><td>Peut survenir sur une maladie chronique.</td></tr><tr><td>Progression rapide</td><td>Dégradation fonctionnelle sur un temps court, avec suspicion de maladie glomérulaire active</td><td>Urgence de bilan ; ne pas attendre une définition administrative de chronicité.</td></tr><tr><td>Syndrome néphrotique associé</td><td>Protéinurie importante et hypoalbuminémie selon population et référentiel</td><td>Risques et prise en charge propres ; œdème seul insuffisant.</td></tr><tr><td>Classification CGA</td><td>Cause, catégorie de débit G et albuminurie A</td><td>G1 ou G2 isolés sans marqueur ne définissent pas une MRC.</td></tr><tr><td>Histologie</td><td>Prolifération, dépôts, sclérose, fibrose et distribution des lésions</td><td>Un pattern ne suffit pas toujours à définir une maladie.</td></tr></tbody></table><p>La classification de maladie rénale chronique comporte G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². L’albuminurie est A1 &lt; 30, A2 30–300 et A3 &gt; 300 mg/g de créatinine, avec des bornes approximatives correspondantes en mg/mmol. Les méthodes et unités doivent rester visibles. Une catégorie ne remplace pas la pente d’évolution.</p><p>La morphologie ajoute un autre axe : segmentaire désigne une partie du glomérule, globale sa totalité ; focale et diffuse décrivent la distribution entre glomérules. Une lésion membranoproliférative constitue un pattern qui peut résulter de causes différentes. La bonne synthèse associe ces axes au lieu de transformer le dernier mot du compte rendu en diagnostic et en traitement complets.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p><p><button class="w" data-k="n03-exp-7">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-7">▲ Loi de Pareto — Le raisonnement essentiel</button></section>

<section class="ilot" id="n03-8"><h2>8. Diagnostic positif : quatre niveaux de preuve</h2><div class="alert"><b>Critères de raisonnement.</b> Établir une anomalie glomérulaire, documenter sa persistance, rechercher la cause et apprécier activité/retentissement. Aucun test unique ne remplace ces quatre niveaux.</div><p><b>Le signe.</b> La protéinurie est dépistée puis quantifiée ; sa composante albuminurique soutient une atteinte du filtre. Une bandelette positive pour le sang doit être confrontée à la présence d’hématies. Les HUG utilisent notamment plus de 60 % de dysmorphie, plus de 5 % d’acanthocytes ou des cylindres hématiques pour orienter l’origine glomérulaire, avec des limites de sensibilité et d’interprétation. Une hématurie peut manquer dans certaines présentations chroniques.</p><p><b>La durée.</b> Les anomalies anciennes et les contrôles apportent une preuve de chronicité. Une petite taille rénale ou une fibrose peut la soutenir, mais ne doit pas faire négliger une composante aiguë surajoutée. La maladie rénale chronique peut être définie par des marqueurs persistants même avec un débit supérieur à 60 ; le critère de débit inférieur à 60 pendant au moins trois mois constitue une autre voie diagnostique.</p><p><b>La cause.</b> Elle vient de l’ensemble clinique, biologique, génétique et histologique. Une IgA rénale ne se diagnostique pas sur l’IgA sérique ; la biopsie est nécessaire. Chez l’adulte ayant une IgA possible et une protéinurie d’au moins 0,5 g/j, KDIGO 2025 propose de considérer une biopsie si elle est réalisable. Une cause héréditaire documentée peut modifier cette démarche, mais une évolution atypique peut justifier de rechercher une maladie associée.</p><p><b>L’activité et le risque.</b> Une protéinurie persistante ne démontre pas seule une inflammation sensible aux corticoïdes. La biopsie peut préciser activité et cicatrices ; la trajectoire de fonction, la pression et les protéines contribuent au pronostic. La conclusion doit dire ce qui est confirmé, probable ou encore indéterminé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n03-exp-8">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-8">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-9"><h2>9. Explorations : choisir les examens qui changent une décision</h2><p>Le bilan commence par les valeurs antérieures, la mesure de pression, la créatinine et le débit estimé, l’albuminurie/protéinurie et le sédiment. La numération, les électrolytes, l’albumine et les autres paramètres sont adaptés au retentissement. En maladie rénale plus avancée, rechercher notamment anémie, troubles du potassium, acidose et troubles minéraux ; une anomalie n’est pas automatiquement d’origine rénale.</p><p>L’immunologie répond à des hypothèses : complément, autoanticorps ou recherche de composant monoclonal selon présentation et tissu. Devant un pattern membranoprolifératif, rechercher infection, maladie auto-immune, immunoglobuline monoclonale ou dysrégulation du complément selon le profil d’immunofluorescence. Un C3 normal ne ferme pas toutes ces hypothèses, et un C3 bas ne donne pas une étiologie unique.</p><p>L’échographie examine dimensions, parenchyme et voies excrétrices ; elle peut identifier une obstruction ou des indices de chronicité. Elle ne montre pas les dépôts glomérulaires microscopiques. Le choix d’une biopsie dépend de l’utilité attendue, du risque, des conditions du geste et de l’accord éclairé. Les études optique, immunofluorescente et parfois électronique répondent à des questions complémentaires.</p><p>La fonction calculée a des limites lorsque la créatinine change rapidement, lorsque la masse musculaire est inhabituelle ou lorsqu’une décision exige une grande précision. Le débit combinant créatinine et cystatine C, voire une mesure de filtration, peut alors être utile selon la question. L’équation doit être validée pour la population ; ne pas appliquer un calcul d’adulte à l’enfant. La pharmacologie doit aussi vérifier si la FI exprime une clairance ou un débit indexé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a>.</p><p><button class="w" data-k="n03-exp-9">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-9">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-10"><h2>10. Arbre diagnostique et diagnostics différentiels</h2><table class="t"><thead><tr><th>Étape</th><th>Éléments discriminants</th><th>Suite logique</th></tr></thead><tbody><tr><td>1. Anomalie réelle ?</td><td>Prélèvement, confirmation des cellules, analyte et unité des protéines</td><td>Contrôler contamination, interférence et infection ; ne pas conclure sur la seule bandelette.</td></tr><tr><td>2. Profil glomérulaire ?</td><td>Albuminurie, acanthocytes/cylindres, signes rénaux ou systémiques</td><td>Bilan néphrologique ; une cause urologique peut coexister selon risque.</td></tr><tr><td>3. Aigu, chronique ou aigu sur chronique ?</td><td>Résultats datés, vitesse de chute, événements intercurrents, imagerie/histologie</td><td>Une aggravation nouvelle exige une recherche de cause réversible et d’activité.</td></tr><tr><td>4. Cause glomérulaire ?</td><td>IgA, lupus/vascularite, infection, collagène IV, dépôts monoclonaux ou complément</td><td>Examens ciblés ; génétique et/ou biopsie selon contexte.</td></tr><tr><td>5. Autre compartiment ?</td><td>Obstruction, maladie tubulo-interstitielle, médicaments, profil diabétique ou vasculaire</td><td>Reconsidérer le diagnostic plutôt que conserver une étiquette ancienne sans preuve.</td></tr><tr><td>6. Risque et traitement ?</td><td>Cause, activité, cicatrices, débit, albuminurie, pente, comorbidités</td><td>Néphroprotection et traitement de cause individualisés ; suivi documenté.</td></tr></tbody></table><p>Une hypertension de longue durée et un diabète peuvent coexister avec une glomérulopathie. Une hématurie glomérulaire, une maladie systémique ou une évolution inhabituelle empêchent d’attribuer tout le tableau à ces seuls antécédents. Une maladie du collagène IV peut produire une sclérose secondaire ; un pattern membranoprolifératif peut masquer plusieurs causes. Le diagnostic différentiel porte donc à la fois sur le compartiment, le mécanisme et la temporalité.</p><p>La baisse aiguë de fonction peut également venir d’une déplétion, d’un obstacle ou d’un médicament. La reconnaître ne dispense pas de suivre la maladie chronique, mais évite de confondre un événement potentiellement réversible et une perte rénale inexorable. Les données de la biopsie restent interprétées dans cette histoire complète.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p><p><button class="w" data-k="n03-exp-10">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-10">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-11"><h2>11. Prise en charge : protéger le rein et traiter la cause</h2><p><b>Organiser le niveau de soins.</b> Le syndrome glomérulaire chronique nécessite une évaluation néphrologique pour préciser cause, activité et risque. Une complication aiguë change le délai. Les examens de cause ne doivent pas retarder la stabilisation d’une surcharge respiratoire, d’une hypertension avec atteinte d’organe ou d’un trouble métabolique menaçant. Une dialyse ne se décide pas sur le code N03 ni sur un chiffre isolé de créatinine.</p><p><b>Réduire les facteurs de progression.</b> Le Pocketguide suisse 2025 retient une alimentation adaptée, moins de 5 g de sel par jour, une activité physique visant environ 150 minutes par semaine selon les capacités, l’arrêt du tabac et la gestion du poids. L’apport protéique de 0,8 g/kg/j concerne surtout les adultes avec maladie rénale chronique ; chez l’enfant, la croissance interdit une transposition automatique, et la fragilité peut nécessiter d’autres objectifs nutritionnels. Un diététicien aide à adapter potassium, énergie et protéines aux résultats.</p><p><b>Contrôler la pression et les protéines.</b> La SGN propose une cible systolique de 120–129 mmHg, adaptée à la personne ; elle explicite que KDIGO préconise moins de 120 mmHg si une mesure standardisée est utilisée et si la cible est tolérée. Ne pas poursuivre un nombre au prix de chutes ou d’hypotension symptomatique. Le blocage rénine–angiotensine est utilisé à dose autorisée et tolérée dans les situations appropriées, sans association IEC–ARA. Contrôler pression, créatinine et potassium dans les deux à quatre semaines suivant introduction ou augmentation, plus tôt selon risque.</p><p><b>Choisir les produits dans le cadre suisse.</b> Les inhibiteurs SGLT2 ont une place dans certaines maladies rénales chroniques, y compris sans diabète. Une recommandation de classe dès un débit de 20 ne signifie pas que tous les produits suisses peuvent être débutés à ce seuil : Forxiga ne doit pas être introduit sous 25 selon sa FI consultée et n’est pas recommandé dans la néphropathie sous immunosuppresseur. Le détail des cinq produits retenus est donné dans Pharmacologie, avec leurs indications et limites propres.</p><p><b>Traiter l’étiologie démontrée.</b> Une maladie immune active, une infection, une anomalie génétique et des cicatrices avancées ne reçoivent pas le même traitement. La décision d’immunomodulation est spécialisée et fondée sur la maladie, l’activité, les risques infectieux et le bénéfice attendu. La néphroprotection reste nécessaire lorsqu’un traitement de cause est instauré ; elle ne signifie pas qu’une cause encore traitable peut être négligée. À l’inverse, le mot « glomérulonéphrite » seul n’autorise pas une corticothérapie empirique prolongée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p><p><button class="w" data-k="n03-exp-11">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-11">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-12"><h2>12. Prévention, suivi et pronostic : suivre plus qu’un résultat</h2><p>Le suivi mesure au moins pression, filtration et albuminurie/protéinurie, ainsi que symptômes, poids, tolérance et événements intercurrents. KDIGO propose au minimum une évaluation annuelle de filtration et d’albuminurie dans la maladie rénale chronique, et plus souvent lorsque le risque ou une décision thérapeutique le justifie. Ce minimum ne décrit pas le contrôle après modification d’un médicament ni celui d’une maladie glomérulaire active.</p><p>Un changement de débit supérieur à 20 % sur un contrôle, une diminution supérieure à 30 % après un traitement modifiant l’hémodynamique, ou un doublement du rapport albumine/créatinine dépasse les variations attendues et appelle une évaluation. Ce sont des signaux pour vérifier prélèvement, médicaments, volume, obstacle et activité de maladie, pas une preuve automatique de progression irréversible. Une baisse plus modeste peut aussi être pertinente si la clinique est inquiétante.</p><p>Chez les personnes avec maladie rénale chronique G3–G5, une équation validée peut estimer le risque de défaillance rénale. KDIGO propose notamment qu’un risque à cinq ans de 3–5 % contribue à décider l’orientation néphrologique, qu’un risque à deux ans supérieur à 10 % aide à planifier les soins multidisciplinaires et qu’un risque supérieur à 40 % aide à préparer la suppléance. Ces repères s’ajoutent aux critères suisses et à la clinique ; ils ne doivent pas retarder une consultation devant hématurie glomérulaire ou maladie active. Ne pas appliquer un outil G3–G5 à G1–G2.</p><p>Les complications recherchées varient avec la cause et le stade : maladie cardiovasculaire, troubles du potassium, acidose, anémie, anomalies minérales, dénutrition et retentissement psychosocial. En maladie avancée, présenter transplantation, dialyse et soins conservateurs complets selon les préférences et la situation. La préparation et le début effectif de suppléance sont deux décisions distinctes.</p><p>La prévention comporte l’évitement des néphrotoxiques inutiles, la revue de l’automédication, la compréhension des traitements et un plan en cas de maladie aiguë. Toute interruption temporaire doit avoir des consignes de contrôle et de reprise ; une suspension oubliée peut priver durablement d’un traitement utile. Le patient doit connaître son interlocuteur et les signes qui imposent un contact anticipé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p><p><button class="w" data-k="n03-exp-12">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-12">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-13"><h2>13. Points clés et entraînement clinique</h2><ul><li>Un syndrome glomérulaire chronique ne nomme pas sa cause.</li><li>Protéines, sédiment, pression et trajectoire de fonction sont complémentaires.</li><li>Chronique ne signifie ni stable, ni entièrement cicatriciel, ni toujours irréversible.</li><li>Une biopsie précise mécanisme, activité et dommages ; un pattern ne vaut pas automatiquement étiologie.</li><li>La cible de pression suppose méthode, tolérance et population précisées.</li><li>La prescription respecte la FI du produit exact et un suivi de sécurité.</li><li>Un risque calculé aide à organiser les soins ; il ne remplace pas les signes d’alerte.</li></ul><p>Les cas et quiz sont des exercices originaux fictifs. Leur lien pédagogique avec PROFILES 2017 concerne notamment les marqueurs de fonction rénale SSP161, le sédiment SSP164, la protéinurie SSP173, l’histologie/génétique SSP159 et l’hématurie SSP64. Ils ne sont ni des questions fédérales reproduites ni une correspondance officielle CIM–PROFILES. Les exigences MEBEKO lues portent sur l’examen 2026.</p><p><button class="w" data-k="n03-cas-1">Cas clinique 1 — analyser la décision</button></p><p><button class="w" data-k="n03-cas-2">Cas clinique 2 — analyser la décision</button></p><p><button class="w" data-k="n03-cas-3">Cas clinique 3 — analyser la décision</button></p><p><button class="w" data-k="n03-cas-4">Cas clinique 4 — analyser la décision</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CH-PROFILES — pp.29,32 :SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">CH-MEBEKO — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p><p><button class="w" data-k="n03-exp-13">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-13">▲ Loi de Pareto — Le raisonnement essentiel</button><div class="quiz ui"><p>Un débitG1 exclut-il touteMRC ?</p><button data-ok="1">Non, des marqueurs de dommage persistants peuvent établir la maladie.</button><button data-ok="0">Oui, seule la filtration compte.</button><p class="fb" hidden="">Durée et marqueurs urinaires, structuraux ou histologiques sont complémentaires au débit.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p><div class="quiz ui"><p>Une baisse 68→51 correspond à quelle variation ?</p><button data-ok="1">Une baisse de 25 %.</button><button data-ok="0">Une baisse de 17 %.</button><p class="fb" hidden="">(68−51) ÷ 68 × 100 = 25 %. Le repère appelle une évaluation, pas une conclusion automatique d’irréversibilité.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p><div class="quiz ui"><p>Une lésionMPGN donne-t-elle à elle seule l’étiologie ?</p><button data-ok="1">Non, il faut rechercher son mécanisme et sa cause.</button><button data-ok="0">Oui, tous les cas ont le même traitement.</button><p class="fb" hidden="">Le pattern peut résulter de mécanismes différents ; l’immunofluorescence et le contexte orientent.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p><div class="quiz ui"><p>Un débitG5 impose-t-il immédiatement une dialyse ?</p><button data-ok="1">Non, la décision associe clinique, biologie et préférences.</button><button data-ok="0">Oui, le chiffre suffit.</button><p class="fb" hidden="">Préparer la suppléance et décider de la débuter sont deux décisions distinctes.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p></section>
<section class="ilot" id="n03-14"><h2>14. Pièges : les mots qui ferment trop tôt le raisonnement</h2><table class="t"><thead><tr><th>Raccourci</th><th>Correction utile</th></tr></thead><tbody><tr><td>Chronique = attendre le prochain contrôle</td><td>Une complication aiguë ou une progression rapide impose une réévaluation immédiate.</td></tr><tr><td>Débit normal = rein normal</td><td>Une albuminurie, un sédiment ou une histologie pathologique persistants peuvent définir une maladie rénale.</td></tr><tr><td>Protéinurie persistante = inflammation active</td><td>Distinguer activité, cicatrices et conséquences hémodynamiques.</td></tr><tr><td>Sclérose segmentaire = maladie primitive à corticoïdes</td><td>Le pattern peut être secondaire ou génétique ; interpréter le contexte.</td></tr><tr><td>MPGN = étiologie</td><td>Chercher infection, immunité, composant monoclonal ou complément selon le tissu.</td></tr><tr><td>Une cible tensionnelle vaut quelle que soit la mesure</td><td>Distinguer mesure standardisée, cible suisse et tolérance individuelle.</td></tr><tr><td>Toute hausse de créatinine sous IEC prouve une toxicité irréversible</td><td>Évaluer amplitude, délai, volume, médicaments, potassium et cause.</td></tr><tr><td>Un iSGLT2 débute toujours à 20</td><td>La recommandation de classe et la FI du produit exact sont distinctes.</td></tr><tr><td>Œdème = supplément de potassium nécessaire sous diurétique</td><td>La maladie rénale et les traitements peuvent aussi augmenter le potassium ; mesurer et adapter.</td></tr><tr><td>G5 = dialyse immédiate</td><td>Décision selon symptômes, retentissement, biologie, préférences et options.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Une bonne étiquette est une conclusion provisoire qui reste confrontée aux données nouvelles.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">FI-LASIX-PO — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p><p><button class="w" data-k="n03-exp-14">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n03-14">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n03-annexe-cim"><h2>Après la conclusion clinique : sous-codes morphologiques</h2><p>Le diagnostic clinique précède le codage. Les suffixes ci-dessous sont ceux du modificateur morphologique OFS appliqué à N03. Ils ne représentent ni dix stades cliniques ni dix prescriptions. Les suffixes .0 à .8 nécessitent normalement une identification précise par biopsie ou autopsie. Un variant COL4 ou une IgA soupçonnée ne permettent pas d’inventer une morphologie.</p><table class="t"><thead><tr><th>Sous-code</th><th>Libellé morphologique OFS</th></tr></thead><tbody><tr><td>N03.0</td><td>Anomalies glomérulaires mineures</td></tr><tr><td>N03.1</td><td>Lésions glomérulaires segmentaires et focales</td></tr><tr><td>N03.2</td><td>Glomérulonéphrite membraneuse diffuse</td></tr><tr><td>N03.3</td><td>Glomérulonéphrite mésangio-proliférative diffuse</td></tr><tr><td>N03.4</td><td>Glomérulonéphrite proliférative endocapillaire diffuse</td></tr><tr><td>N03.5</td><td>Glomérulonéphrite mésangiocapillaire diffuse</td></tr><tr><td>N03.6</td><td>Maladie à dépôt dense</td></tr><tr><td>N03.7</td><td>Glomérulonéphrite diffuse en croissant</td></tr><tr><td>N03.8</td><td>Autres modifications morphologiques</td></tr><tr><td>N03.9</td><td>Type de modification morphologique non précisé</td></tr></tbody></table><p>N03 exclut la néphrite tubulo-interstitielle chronique N11, la glomérulonéphrite sclérosante diffuse N18 et le syndrome néphritique sans précision N05. Un code N18 peut compléter la description d’une maladie rénale chronique. Les indications de biopsie viennent de la clinique et des recommandations applicables, jamais de la volonté de remplir un suffixe. Un code morphologique ne décrit ni toute l’activité actuelle ni le bénéfice attendu d’un traitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">CH-CIM — XML officiel : N03, N00–N08 et modificateur S14N00_4</a>.</p></section>
</div></div>

<div class="panel" hidden="" id="pE"><div class="chap-body"><section class="ilot" id="n03-e-urines"><h2>Urines : quantifier une fuite, caractériser un sédiment</h2><table class="t"><thead><tr><th>Question</th><th>Examen</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Combien d’albumine ?</td><td>Rapport albumine/créatinine, analyte et unité précisés</td><td>A1 &lt; 30,A2 30–300,A3 &gt; 300 mg/g ; ne mesure pas toutes les protéines.</td></tr><tr><td>Combien de protéines ?</td><td>Rapport protéines/créatinine ou recueil quantitatif</td><td>Pertinent pour certaines décisions glomérulaires ; recueil 24 h adulte si introduction/intensification d’immunosuppression.</td></tr><tr><td>Quel compartiment saigne ?</td><td>Numération et morphologie des hématies, acanthocytes, cylindres</td><td>Indices glomérulaires selon méthode ; absence non excluante.</td></tr><tr><td>Le résultat est-il fiable ?</td><td>Conditions de recueil, infection, sang visible, évolution</td><td>Un résultat ponctuel varie ; confirmer ce qui change une décision.</td></tr><tr><td>Et chez l’enfant ?</td><td>Premier prélèvement du matin pour le rapport protéines/créatinine</td><td>Équations et objectifs pédiatriques ; recueil 24 h souvent difficile.</td></tr></tbody></table><p>La bandelette dite « sang » ne compte pas les hématies : elle réagit aussi aux hémoprotéines libres. Le seuil local HUG de 26 millions/L correspond à 26 cellules/µL ; l’équivalence en nombre par champ dépend de la technique. Le seuil français CUEN de 10/µL est attribué à son référentiel ; ces deux nombres ne constituent pas deux stades de N03.</p><p>Le rapport albumine/créatinine et le rapport protéines/créatinine ont des numérateurs différents. Écrire mg/g, mg/mmol ou g/g est indispensable avant toute comparaison. Pour discuter une évolution, utiliser des prélèvements comparables et tenir compte du contexte. Le doublement de l’ACR appelle une évaluation ; il ne démontre pas automatiquement une poussée immune.</p><p>Dans une glomérulopathie, une quantification prolongée peut être nécessaire lorsque la décision d’intensifier un traitement dépend d’une mesure précise. Le choix ne consiste pas à demander tous les types de collecte à chaque consultation. Il suit une question et une population.</p><figure data-n03-figure="sediment"><div data-n03-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n03/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span><span aria-hidden="true" data-n03-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n03-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p></section>
<section class="ilot" id="n03-e-fonction"><h2>Fonction rénale : interpréter une valeur et sa variation</h2><p>La créatinine est un marqueur indirect de filtration influencé notamment par sa production ; le débit estimé n’est pas une mesure de toutes les fonctions rénales. Une masse musculaire faible ou inhabituelle, une situation non stable et certains traitements limitent son interprétation. Quand la précision est déterminante, une estimation combinée créatinine–cystatine C ou une mesure de filtration peut être indiquée.</p><p>Dans la maladie rénale chronique, la variation relative aide à reconnaître ce qui dépasse les fluctuations attendues. Une baisse de débit supérieure à 20 % sur un contrôle appelle une évaluation ; après une thérapie hémodynamique, une baisse supérieure à 30 % constitue un autre repère. Pour un IEC/ARA, la recommandation de sécurité se formule aussi comme une hausse de créatinine supérieure à 30 % dans les quatre semaines après introduction ou titration. Ces formulations ne sont pas des transformations mathématiques exactement équivalentes.</p><p>Le calcul de variation doit préciser la valeur de départ, le délai et le sens de la variation. Une créatinine qui augmente et un débit qui diminue ne se soustraient pas dans le même ordre. L’analyse recherche ensuite déplétion, médicaments, obstacle et maladie active. Une aggravation symptomatique ne doit pas attendre de franchir un seuil.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a>.</p><p><button class="w" data-k="n03-calcul-variation">Calculer une variation relative</button></p></section>
<section class="ilot" id="n03-e-cause"><h2>Cause et activité : organiser les preuves</h2><table class="t"><thead><tr><th>Outil</th><th>Question</th><th>Limite</th></tr></thead><tbody><tr><td>Immunologie orientée</td><td>Auto-immunité, complément, immunoglobulines selon présentation</td><td>Un anticorps ou un C3 bas isolé ne donne pas toute la cause.</td></tr><tr><td>Recherche infectieuse</td><td>Infection active ou persistante selon histoire et tableau</td><td>Une infection peut modifier la stratégie d’immunosuppression.</td></tr><tr><td>Échographie</td><td>Taille, parenchyme, obstacle, anomalies structurales</td><td>Ne démontre pas dépôts ou intégrité de la membrane basale.</td></tr><tr><td>Génétique</td><td>Maladie familiale ou phénotype évocateur, notammentCOL4A3/4/5</td><td>Variant incertain et panel négatif ont des limites ; corrélation familiale et clinique.</td></tr><tr><td>Biopsie</td><td>Étiologie, activité, cicatrices et bénéfice possible d’un traitement</td><td>Risque et utilité individualisés ; prélèvement limité, techniques complémentaires.</td></tr></tbody></table><p>La biopsie rénale a une valeur diagnostique, pronostique et parfois thérapeutique. Une répétition n’est utile que si l’information attendue peut modifier le plan ou l’estimation du pronostic. Contrôler les conditions du geste et les traitements influençant le saignement selon le centre ; les délais d’arrêt ne doivent pas être improvisés à partir d’une règle unique.</p><p>Le compte rendu précise le compartiment, la distribution, les dépôts, les lésions actives et les cicatrices. Une fluorescence à dominante complément ou immunoglobuline change les hypothèses ; elle ne se voit pas sur une simple photographie PAS. Le patient reçoit une explication de ce que le tissu établit et de ce qui reste incertain.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p></section>
</div></div><div class="panel" hidden="" id="pS"><div class="sci-bar ui" role="tablist"><button aria-controls="n03-s-semio" aria-selected="true" data-s="n03-s-semio" id="n03-tab-semio" role="tab">Sémiologie fondamentale et analytique</button><button aria-controls="n03-s-anat" aria-selected="false" data-s="n03-s-anat" id="n03-tab-anat" role="tab">Anatomie</button><button aria-controls="n03-s-histo" aria-selected="false" data-s="n03-s-histo" id="n03-tab-histo" role="tab">Histologie</button><button aria-controls="n03-s-physio" aria-selected="false" data-s="n03-s-physio" id="n03-tab-physio" role="tab">Physiologie</button><button aria-controls="n03-s-bio" aria-selected="false" data-s="n03-s-bio" id="n03-tab-bio" role="tab">Biochimie</button><button aria-controls="n03-s-immuno" aria-selected="false" data-s="n03-s-immuno" id="n03-tab-immuno" role="tab">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div aria-labelledby="n03-tab-semio" class="sci" id="n03-s-semio" role="tabpanel"><section class="ilot" data-semiology="normal" id="n03-semio-normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le rein normal filtre puis transforme le filtrat en urine par les fonctions tubulaires. Le filtre retient les cellules et limite le passage des protéines ; une urine d’apparence habituelle ne démontre pas à elle seule que ce dispositif soit intact. L’albumine urinaire, le sédiment et la fonction donnent des informations complémentaires. La normalité doit préciser analyte, unité, méthode et population.</p><p>G1 ou G2 ne suffisent pas à exclure une maladie : des marqueurs urinaires ou histologiques persistants peuvent établir une atteinte avec filtration conservée. À l’inverse, G2 sans marqueur de dommage ne constitue pas à lui seul une maladie rénale chronique. La sémiologie commence par cette distinction entre valeur de fonction et intégrité du rein.</p><figure data-n03-figure="sediment"><div data-n03-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n03/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span><span aria-hidden="true" data-n03-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n03-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></section>
<section class="ilot" data-semiology="signs" id="n03-semio-signs"><h3>Décrire le profil et sa temporalité</h3><p>Le syndrome chronique peut être découvert sur une protéinurie, une hématurie ou une pression élevée sans symptôme douloureux. Préciser la présence de sang visible, les œdèmes, les variations de poids et de diurèse, la tolérance à l’effort et les événements intercurrents. L’urine mousseuse ne quantifie pas les protéines ; sa description conduit à une mesure.</p><p>La durée et la vitesse sont deux dimensions distinctes. Une anomalie ancienne peut évoluer lentement puis se dégrader rapidement. L’expression « stable depuis des années » exige des données datées, pas seulement l’absence de plainte. Rechercher aussi purpura, manifestations articulaires, infectieuses, respiratoires ou familiales qui orientent la cause.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p></section>
<section class="ilot" data-semiology="mechanisms" id="n03-semio-mechanisms"><h3>Relier filtre, lésion et conséquence</h3><p>Une anomalie du filtre augmente le passage d’albumine ou d’hématies ; des hématies dysmorphiques et des cylindres soutiennent une origine glomérulaire. Une prolifération, un dépôt et une sclérose sont des mécanismes ou lésions différents. Le même signe urinaire peut donc résulter de maladies distinctes et d’une combinaison de lésions actives et anciennes.</p><p>Une cicatrice ne se traite pas comme une inflammation, tandis qu’une maladie chronique peut conserver une activité traitable. La biopsie, la trajectoire et les signes systémiques aident à faire cette distinction. La pression et la protéinurie participent aussi au risque évolutif, ce qui justifie une protection rénale même lorsqu’un traitement de cause est engagé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p></section>
<section class="ilot" data-semiology="examination" id="n03-semio-examination"><h3>Mesurer dans des conditions qui permettent la comparaison</h3><p>Pour les urines, vérifier recueil, contamination, infection, sang visible et unité. Demander explicitement morphologie érythrocytaire et cylindres lorsque la localisation est en jeu. La méthode et la fraîcheur du prélèvement influencent l’examen ; un compte rendu « sang positif » ne remplace pas un sédiment.</p><p>Pour le patient, mesurer pression, poids, signes de congestion et d’hypovolémie, puis rechercher les indices de cause guidés par l’histoire. La comparaison des visites nécessite une technique cohérente. Une cible tensionnelle issue de mesures standardisées ne s’applique pas mécaniquement à une mesure occasionnelle faite dans d’autres conditions.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p></section>
<section class="ilot" data-semiology="interpretation" id="n03-semio-interpretation"><h3>Interpréter un faisceau d’arguments</h3><p>Des acanthocytes ou des cylindres hématiques renforcent la localisation glomérulaire ; leur absence ne suffit pas à l’exclure. La protéinurie, l’évolution fonctionnelle et la clinique évitent de conclure à partir d’un signe négatif isolé. Le nombre d’hématies ne mesure pas directement l’activité immune.</p><p>Le débit et l’albuminurie contribuent au risque, mais un changement doit être vérifié et expliqué. Les repères de variation KDIGO servent à déclencher une évaluation, pas à déclarer une perte irréversible. De même, un score de risque de défaillance rénale estime une probabilité dans sa population de validation ; il ne calcule pas le bénéfice d’un corticoïde pour cette personne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p></section>
