<template data-pop="n03-exp-1" data-title="1. Définition : un syndrome glomérulaire dans la durée"><p>Le syndrome de glomérulonéphrite chronique associe une <b>protéinurie glomérulaire persistante</b>, avec ou sans hématurie, hypertension et diminution de fonction rénale. La présentation peut rester discrète. Dans le tableau pédagogique du CUEN, toutes les glomérulopathies chroniques peuvent produire ce profil : il ne correspond donc pas à une maladie unique ni à une seule lésion histologique.</p><p>Le terme <b>chronique</b> exige une histoire documentée. Pour la maladie rénale chronique, les critères formels reposent sur une anomalie de structure ou de fonction présente au moins trois mois et ayant des conséquences pour la santé. Les valeurs antérieures, l’urine, l’imagerie et parfois la fibrose ou l’atrophie sur biopsie apportent des preuves. Un seul débit bas ne permet pas d’affirmer la chronicité ; une atteinte aiguë ou une aggravation aiguë sur maladie chronique reste possible.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">CH-CIM — XML officiel : N03, N00–N08 et modificateur S14N00_4</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-1" data-title="Raisonnement essentiel — 1. Définition : un syndrome glomérulaire dans la durée"><p>Le syndrome décrit une protéinurie glomérulaire durable, avec signes variables ; la cause et le stade se prouvent séparément.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a>.</p></template>
<template data-pop="n03-exp-2" data-title="2. Épidémiologie : préciser ce que l’on compte"><p>Le Pocketguide 2025 de la Société suisse de néphrologie estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique, souvent non diagnostiquée. Ce chiffre concerne l’ensemble de la maladie rénale chronique. Il ne mesure ni l’incidence du syndrome néphritique chronique N03, ni celle d’une glomérulonéphrite particulière. Les sources retenues n’apportent pas de taux national direct de N03 ; aucun chiffre de dialyse ou de biopsie ne lui est substitué.</p><p>La fréquence observée des maladies glomérulaires dépend du dépistage, de l’indication et de l’accès à la biopsie, de l’âge et des maladies associées. Une série de biopsies décrit des personnes sélectionnées pour un examen, tandis qu’une enquête de population inclut aussi des atteintes peu symptomatiques. Une fréquence de lésion parmi des biopsies ne s’applique donc pas à toutes les personnes ayant une protéinurie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-2" data-title="Raisonnement essentiel — 2. Épidémiologie : préciser ce que l’on compte"><p>Le chiffre suisse global de MRC ne mesure pasN03 ; le dénominateur et la sélection changent toute fréquence.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a>.</p></template>
<template data-pop="n03-exp-3" data-title="3. Physiopathologie : perméabilité, inflammation et perte néphronique"><p>Le filtre glomérulaire normal associe endothélium, membrane basale et podocytes. Il sépare le sang de l’espace urinaire tout en permettant la filtration. Une altération peut augmenter le passage de protéines et permettre celui d’érythrocytes. La protéinurie à prédominance albuminurique et les hématies dysmorphiques donnent ainsi des indices sur le compartiment atteint ; ils ne nomment pas à eux seuls la maladie.</p><p>Les lésions peuvent associer dépôts immunitaires, prolifération cellulaire, atteinte structurale et cicatrices. Une prolifération active et une sclérose ne sont pas synonymes. La sclérose remplace une partie ou la totalité du glomérule par du matériel cicatriciel ; la fibrose et l’atrophie tubulo-interstitielle renseignent sur la chronicité et le pronostic. Le compte rendu de biopsie doit être interprété avec la clinique et la fonction, car un prélèvement peut montrer simultanément activité et dommages anciens.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.chuv.ch/en/nephrologie/nep-home/patients-et-famille/maladies-traitees/insuffisance-renale/pronostic-suivi-et-prise-en-charge" rel="noopener" target="_blank">CH-CHUV-MEC — Comment évolue l’insuffisance rénale chronique ?</a>.</p></template>
<template data-pop="pareto-n03-3" data-title="Raisonnement essentiel — 3. Physiopathologie : perméabilité, inflammation et perte néphronique"><p>Perméabilité, inflammation et cicatrice ne sont pas synonymes ; leur combinaison guide bilan et traitement.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="n03-exp-4" data-title="4. Démarche clinique : commencer par la trajectoire et la gravité"><p><b>Rechercher une aggravation.</b> Comparer créatinine, débit, pression, protéinurie et diurèse aux valeurs précédentes. Une oligurie nouvelle, une dyspnée, une surcharge, une hypertension avec retentissement ou une chute rapide de fonction imposent une évaluation accélérée, souvent urgente. Un syndrome pulmonaire–rénal possible ne relève pas du prochain contrôle annuel. Le mot « chronique » dans le dossier ne protège pas d’une complication aiguë.</p><p><b>Confirmer et caractériser.</b> Vérifier recueil urinaire, infection, contamination et méthode de quantification. Distinguer albumine et protéines totales ; demander un sédiment morphologique lorsque l’origine glomérulaire est discutée. Établir la chronicité par des preuves, sans attendre trois mois lorsqu’un tableau menaçant nécessite une prise en charge immédiate.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p></template>
<template data-pop="pareto-n03-4" data-title="Raisonnement essentiel — 4. Démarche clinique : commencer par la trajectoire et la gravité"><p>Vérifier la trajectoire, sécuriser une complication, caractériser les urines puis établir cause et risque.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a>.</p></template>
<template data-pop="n03-exp-5" data-title="5. Anamnèse : reconstituer une maladie souvent silencieuse"><p>Une anamnèse négative n’exclut pas une maladie active. À l’inverse, une plainte non spécifique ne suffit pas à prouver une complication urémique. Les médicaments réellement pris, y compris ceux achetés sans ordonnance, et les dates des résultats font partie du diagnostic.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-5" data-title="Raisonnement essentiel — 5. Anamnèse : reconstituer une maladie souvent silencieuse"><p>Résultats datés, médicaments réellement pris, événements intercurrents et contexte familial sont des données diagnostiques.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a>.</p></template>
<template data-pop="n03-exp-6" data-title="6. Examen clinique : mesurer le retentissement"><p>Mesurer la pression avec une méthode fiable et répétable ; rechercher une hypotension orthostatique si les symptômes, l’âge ou les traitements le suggèrent. La cible thérapeutique ne se discute qu’après avoir précisé la technique et la tolérance. La recommandation suisse de 120–129 mmHg systolique chez l’adulte se module selon fragilité et comorbidités ; elle ne se transpose pas directement à l’enfant.</p><p>Évaluer poids et évolution pondérale, œdèmes, signes de congestion et état d’hydratation. Une prise de poids peut traduire une rétention, tandis qu’une baisse de pression avec pertes digestives peut signaler une déplétion. L’œdème ne prouve ni la quantité d’albumine perdue ni une indication d’albumine intraveineuse. Une dyspnée exige de rechercher sa cause et sa gravité plutôt que d’augmenter automatiquement le diurétique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p></template>
<template data-pop="pareto-n03-6" data-title="Raisonnement essentiel — 6. Examen clinique : mesurer le retentissement"><p>La mesure de pression et l’examen du volume demandent méthode, comparaison et tolérance.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a>.</p></template>
<template data-pop="n03-exp-7" data-title="7. Syndromes et classifications : garder plusieurs axes"><p>La classification de maladie rénale chronique comporte G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². L’albuminurie est A1 &lt; 30, A2 30–300 et A3 &gt; 300 mg/g de créatinine, avec des bornes approximatives correspondantes en mg/mmol. Les méthodes et unités doivent rester visibles. Une catégorie ne remplace pas la pente d’évolution.</p><p>La morphologie ajoute un autre axe : segmentaire désigne une partie du glomérule, globale sa totalité ; focale et diffuse décrivent la distribution entre glomérules. Une lésion membranoproliférative constitue un pattern qui peut résulter de causes différentes. La bonne synthèse associe ces axes au lieu de transformer le dernier mot du compte rendu en diagnostic et en traitement complets.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-7" data-title="Raisonnement essentiel — 7. Syndromes et classifications : garder plusieurs axes"><p>Syndrome, cause, catégoriesG/A et morphologie décrivent des axes complémentaires.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></template>
<template data-pop="n03-exp-8" data-title="8. Diagnostic positif : quatre niveaux de preuve"><p><b>Le signe.</b> La protéinurie est dépistée puis quantifiée ; sa composante albuminurique soutient une atteinte du filtre. Une bandelette positive pour le sang doit être confrontée à la présence d’hématies. Les HUG utilisent notamment plus de 60 % de dysmorphie, plus de 5 % d’acanthocytes ou des cylindres hématiques pour orienter l’origine glomérulaire, avec des limites de sensibilité et d’interprétation. Une hématurie peut manquer dans certaines présentations chroniques.</p><p><b>La durée.</b> Les anomalies anciennes et les contrôles apportent une preuve de chronicité. Une petite taille rénale ou une fibrose peut la soutenir, mais ne doit pas faire négliger une composante aiguë surajoutée. La maladie rénale chronique peut être définie par des marqueurs persistants même avec un débit supérieur à 60 ; le critère de débit inférieur à 60 pendant au moins trois mois constitue une autre voie diagnostique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-8" data-title="Raisonnement essentiel — 8. Diagnostic positif : quatre niveaux de preuve"><p>Confirmer le signe, la durée, la cause et le retentissement ; aucun test seul ne remplace ces niveaux.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></template>


<template data-pop="n03-exp-9" data-title="9. Explorations : choisir les examens qui changent une décision"><p>Le bilan commence par les valeurs antérieures, la mesure de pression, la créatinine et le débit estimé, l’albuminurie/protéinurie et le sédiment. La numération, les électrolytes, l’albumine et les autres paramètres sont adaptés au retentissement. En maladie rénale plus avancée, rechercher notamment anémie, troubles du potassium, acidose et troubles minéraux ; une anomalie n’est pas automatiquement d’origine rénale.</p><p>L’immunologie répond à des hypothèses : complément, autoanticorps ou recherche de composant monoclonal selon présentation et tissu. Devant un pattern membranoprolifératif, rechercher infection, maladie auto-immune, immunoglobuline monoclonale ou dysrégulation du complément selon le profil d’immunofluorescence. Un C3 normal ne ferme pas toutes ces hypothèses, et un C3 bas ne donne pas une étiologie unique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p></template>
<template data-pop="pareto-n03-9" data-title="Raisonnement essentiel — 9. Explorations : choisir les examens qui changent une décision"><p>Un examen est utile lorsqu’il répond à une question et peut modifier une décision.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n03-exp-10" data-title="10. Arbre diagnostique et diagnostics différentiels"><p>Une hypertension de longue durée et un diabète peuvent coexister avec une glomérulopathie. Une hématurie glomérulaire, une maladie systémique ou une évolution inhabituelle empêchent d’attribuer tout le tableau à ces seuls antécédents. Une maladie du collagène IV peut produire une sclérose secondaire ; un pattern membranoprolifératif peut masquer plusieurs causes. Le diagnostic différentiel porte donc à la fois sur le compartiment, le mécanisme et la temporalité.</p><p>La baisse aiguë de fonction peut également venir d’une déplétion, d’un obstacle ou d’un médicament. La reconnaître ne dispense pas de suivre la maladie chronique, mais évite de confondre un événement potentiellement réversible et une perte rénale inexorable. Les données de la biopsie restent interprétées dans cette histoire complète.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-10" data-title="Raisonnement essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>La discordance entre diagnostic ancien et évolution nouvelle rouvre les hypothèses.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p></template>
<template data-pop="n03-exp-11" data-title="11. Prise en charge : protéger le rein et traiter la cause"><p><b>Organiser le niveau de soins.</b> Le syndrome glomérulaire chronique nécessite une évaluation néphrologique pour préciser cause, activité et risque. Une complication aiguë change le délai. Les examens de cause ne doivent pas retarder la stabilisation d’une surcharge respiratoire, d’une hypertension avec atteinte d’organe ou d’un trouble métabolique menaçant. Une dialyse ne se décide pas sur le code N03 ni sur un chiffre isolé de créatinine.</p><p><b>Réduire les facteurs de progression.</b> Le Pocketguide suisse 2025 retient une alimentation adaptée, moins de 5 g de sel par jour, une activité physique visant environ 150 minutes par semaine selon les capacités, l’arrêt du tabac et la gestion du poids. L’apport protéique de 0,8 g/kg/j concerne surtout les adultes avec maladie rénale chronique ; chez l’enfant, la croissance interdit une transposition automatique, et la fragilité peut nécessiter d’autres objectifs nutritionnels. Un diététicien aide à adapter potassium, énergie et protéines aux résultats.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-11" data-title="Raisonnement essentiel — 11. Prise en charge : protéger le rein et traiter la cause"><p>Associer protection rénale et traitement de cause ; respecter cible suisse, FI et sécurité de chaque produit.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a>.</p></template>
<template data-pop="n03-exp-12" data-title="12. Prévention, suivi et pronostic : suivre plus qu’un résultat"><p>Le suivi mesure au moins pression, filtration et albuminurie/protéinurie, ainsi que symptômes, poids, tolérance et événements intercurrents. KDIGO propose au minimum une évaluation annuelle de filtration et d’albuminurie dans la maladie rénale chronique, et plus souvent lorsque le risque ou une décision thérapeutique le justifie. Ce minimum ne décrit pas le contrôle après modification d’un médicament ni celui d’une maladie glomérulaire active.</p><p>Un changement de débit supérieur à 20 % sur un contrôle, une diminution supérieure à 30 % après un traitement modifiant l’hémodynamique, ou un doublement du rapport albumine/créatinine dépasse les variations attendues et appelle une évaluation. Ce sont des signaux pour vérifier prélèvement, médicaments, volume, obstacle et activité de maladie, pas une preuve automatique de progression irréversible. Une baisse plus modeste peut aussi être pertinente si la clinique est inquiétante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p></template>
<template data-pop="pareto-n03-12" data-title="Raisonnement essentiel — 12. Prévention, suivi et pronostic : suivre plus qu’un résultat"><p>Le suivi associe fonction, protéines et clinique ; les seuils de variation déclenchent une évaluation sans prouver l’irréversibilité.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p></template>
<template data-pop="n03-exp-13" data-title="13. Points clés et entraînement clinique"><p>Les cas et quiz sont des exercices originaux fictifs. Leur lien pédagogique avec PROFILES 2017 concerne notamment les marqueurs de fonction rénale SSP161, le sédiment SSP164, la protéinurie SSP173, l’histologie/génétique SSP159 et l’hématurie SSP64. Ils ne sont ni des questions fédérales reproduites ni une correspondance officielle CIM–PROFILES. Les exigences MEBEKO lues portent sur l’examen 2026.</p><p><button class="w" data-k="n03-cas-1">Cas clinique 1 — analyser la décision</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CH-PROFILES — pp.29,32 :SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">CH-MEBEKO — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-13" data-title="Raisonnement essentiel — 13. Points clés et entraînement clinique"><p>Les tâches cliniques organisent l’entraînement ; les casMEDINA restent des exercices originaux.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CH-PROFILES — pp.29,32 :SSP64,159,161,164,173</a>.</p></template>
<template data-pop="n03-exp-14" data-title="14. Pièges : les mots qui ferment trop tôt le raisonnement"><p></p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">FI-LASIX-PO — Posologie, contre-indications et précautions</a>.</p></template>
<template data-pop="pareto-n03-14" data-title="Raisonnement essentiel — 14. Pièges : les mots qui ferment trop tôt le raisonnement"><p>Ne pas confondre chronique et stable, pattern et cause, risque et indication immédiate de dialyse.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p></template>
<template data-pop="n03-calcul-ratio" data-title="Rapport urinaire : le litre s’annule, pas l’analyte"><p>Données fictives du même prélèvement : albumine 60 mg/L, créatinine 1g/L. Le rapport albumine/créatinine est 60 ÷ 1 = 60 mg/g. Les litres s’annulent. Il s’agit d’albuminurieA2 selon les bornes du référentiel ; il ne s’agit pas d’une excrétion de 60g/j.</p><p>Si les protéines totales sont à 1,2g/L avec la même créatinine, le rapport protéines/créatinine est 1,2g/g. Les deux résultats ne sont pas interchangeables : le premier quantifie l’albumine, le second toutes les protéines mesurées.</p><p>Le calcul ne prouve pas la chronicité. Vérifier conditions, répétition, contexte et évolution. Un seuil de traitement donné en protéines totales ne se lit pas avec un rapport d’albumine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n03-calcul-variation" data-title="Variation relative : préciser le sens, la base et le délai"><p>Débit fictif passant de 68à 51 mL/min/1,73 m² : baisse absolue 68−51 = 17 ; baisse relative 17 ÷ 68 × 100 = 25 %. Elle dépasse le repère de 20 % qui appelle une évaluation selonKDIGO. Cela ne suffit pas à établir une progression irréversible.</p><p>Créatinine fictive passant de 100à 140 µmol/L après modification d’un IEC : hausse relative(140−100) ÷ 100 × 100 = 40 %. Si elle survient dans les quatre semaines, elle dépasse le repère de 30 % discuté pour la sécurité de l’IEC/ARA. Il faut chercher état volémique, médicaments, potassium et autres causes selon la clinique.</p><p>Ces exemples sont indépendants. Une hausse de créatinine de 30 % n’est pas mathématiquement la même chose qu’une baisse de débit de 30 %. Ne pas interchanger les deux seuils ni ignorer une aggravation clinique qui reste sous une borne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p></template>
<template data-pop="n03-cas-1" data-title="Cas 1 — Une fonction normale n’efface pas le dommage"><p><b>Exercice fictif original.</b></p><p>Une personne a un débit estimé à 95 mL/min/1,73 m² mais une albuminurie pathologique et un sédiment glomérulaire documentés depuis six mois. Une filtration conservée n’exclut pas une maladie rénale chronique : les marqueurs persistants apportent une autre voie diagnostique.</p><p>Il faut rechercher la cause et le risque. À l’inverse, un débit de 75 isolé sans marqueur de dommage ne suffit pas à définir uneMRC. Le chiffre de filtration se lit avec l’ensemble du dossier.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a>.</p></template>
<template data-pop="n03-cas-2" data-title="Cas 2 — Ancien ne signifie pas inactif"><p><b>Exercice fictif original.</b></p><p>Une personne suivie depuis plusieurs années développe une hausse rapide de créatinine, de nouveaux œdèmes et un purpura. Le caractère ancien de la maladie ne justifie pas d’attendre le bilan annuel. Évaluer gravité et causes réversibles, rechercher une maladie active et organiser rapidement le bilan spécialisé.</p><p>Une biopsie peut être discutée si elle doit changer le plan. L’alternative n’est pas entre corticoïde systématique et absence d’action ; la décision dépend de la cause, de l’activité et du retentissement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a>.</p></template>
<template data-pop="n03-cas-3" data-title="Cas 3 — Un pattern n’est pas une cause"><p><b>Exercice fictif original.</b></p><p>Le compte rendu décrit une lésion membranoproliférative. Le résultat oriente la recherche d’infection, de maladie auto-immune, d’immunoglobuline monoclonale ou de complément selon l’immunofluorescence. La lésion ne constitue pas à elle seule une étiologie.</p><p>La clinique, la biologie et le tissu se complètent. Une prescription immunosuppressive universelle risquerait de traiter des mécanismes différents de manière identique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="n03-cas-4" data-title="Cas 4 — Une recommandation de classe ne modifie pas uneFI"><p><b>Exercice fictif original.</b></p><p>Chez un adulte ayant un débit estimé à 22 mL/min/1,73 m², une recommandation générale évoque un inhibiteurSGLT2 dès 20. La FIForxiga consultée ne recommande pas son introduction sous 25. On ne transforme donc pas le seuil de classe en autorisation de débuter ce produit à 22.</p><p>Discuter les options avec le prescripteur en tenant compte du produit exact, de l’indication et des autres traitements. Une poursuite après introduction antérieure n’est pas la même décision qu’un début.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></template>
