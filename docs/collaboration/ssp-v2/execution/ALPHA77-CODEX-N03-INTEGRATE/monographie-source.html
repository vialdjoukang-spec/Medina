<section class="ilot" data-semiology="differentials" id="n03-semio-differentials"><h3>Reconnaître les discordances qui rouvrent le diagnostic</h3><p>Une protéinurie à prédominance albuminurique et un sédiment glomérulaire orientent le compartiment, tandis qu’une obstruction ou une atteinte tubulo-interstitielle répond à d’autres indices. Diabète et hypertension peuvent être présents sans expliquer tout le tableau. Une infection persistante ou une maladie systémique peut modifier le mécanisme et le traitement.</p><p>Un pattern membranoprolifératif demande une recherche de cause ; une sclérose segmentaire peut être primaire, secondaire ou associée à une maladie génétique. Une évolution atypique chez un patient déjà étiqueté justifie donc une reprise clinique, parfois histologique. Le diagnostic ancien ne doit pas devenir une explication automatique de tout événement nouveau.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></section>
<section class="ilot" data-semiology="urgency" id="n03-semio-urgency"><h3>Identifier le passage de la surveillance aux soins urgents</h3><p>Une dyspnée avec suspicion de surcharge ou de maladie pulmonaire–rénale, une oligurie nouvelle, une hypertension avec retentissement ou une dégradation rapide de fonction imposent une évaluation urgente. La recherche de chronicité ne doit pas retarder la sécurisation d’une fonction menacée. Une anémie ou un trouble électrolytique se juge selon sévérité, symptômes et évolution.</p><p>En maladie rénale avancée, une incapacité à contrôler volume ou pression, des anomalies métaboliques réfractaires ou des signes urémiques peuvent conduire à une suppléance. La décision combine clinique, biologie et préférences ; elle ne vient pas d’un seuil de créatinine ni du seul nom N03. Préparer un accès ou discuter une greffe n’équivaut pas à débuter immédiatement une dialyse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p></section>
<section class="ilot" data-semiology="limits" id="n03-semio-limits"><h3>Adapter la conclusion à la population et à la méthode</h3><p>Les recommandations générales de maladie rénale chronique concernent surtout l’adulte et ne remplacent pas les protocoles propres à chaque glomérulopathie. L’enfant a des références de pression et de nutrition différentes ; la fragilité peut modifier les objectifs chez l’adulte âgé. Une FI suisse peut être plus restrictive qu’une recommandation de classe internationale.</p><p>Les prélèvements et équations ont des limites ; la biopsie échantillonne le rein et la génétique n’est pas infaillible. Une source illustrant un champ de sclérose ne fournit ni une proportion globale de lésions ni un diagnostic causal complet. Les incertitudes doivent rester visibles dans le compte rendu et le plan de suivi.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></section>
<section class="ilot" data-semiology="sources" id="n03-semio-sources"><h3>Relier les signes et décisions aux passages effectivement lus</h3><p>Le syndrome glomérulaire chronique et ses alternatives viennent du CUEN 2025, tableau des syndromes et sections histologiques. L’orientation suisse s’appuie sur HUG 2024 pour l’hématurie et sur le Pocketguide SGN17.03.2025 pour la maladie rénale chronique, le suivi et la consultation spécialisée. Les différences de cible tensionnelle sont attribuées.</p><p>KDIGO 2024 précise chronicité, catégories de risque, variations à évaluer et sécurité médicamenteuse ; son utilisation en Suisse est motivée par le guide SGN qui le cite. Les principes glomérulaires 2021 sont utilisés pour le bilan et le tissu, avec les recommandations ultérieures spécifiques lorsqu’elles s’appliquent. Les cinq FI exactes restent la source des doses. Le ledger décrit les sections lues et leurs limites ; il ne revendique pas une lecture intégrale de tous les documents.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></section>
<section class="ilot" id="n03-bridge-semio"><h3>De la sémiologie à la décision</h3><p><b>Science → clinique.</b> Le profil associe des signes de filtre, de fonction et de retentissement qui peuvent évoluer à des rythmes différents.</p><p><b>Science → examen.</b> Confirmer les mesures, établir leur durée et rechercher les discordances avant une conclusion causale.</p><p><b>Science → traitement.</b> L’urgence, l’activité et le risque déterminent les soins ; une simple persistance ne prescrit pas un corticoïde.</p><div class="key"><b>À retenir.</b> Décrire le signe, expliquer son mécanisme, puis choisir une décision proportionnée.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p></section>
</div><div aria-labelledby="n03-tab-anat" class="sci" hidden="" id="n03-s-anat" role="tabpanel"><section class="ilot" id="n03-s-anat-content"><h2>Anatomie : localiser le signe avant d’identifier la maladie</h2><p>Le rein normal associe cortex, médulla et système collecteur. Les corpuscules glomérulaires du cortex filtrent le sang ; les tubules modifient ensuite le filtrat, puis l’urine rejoint les cavités et l’uretère. Cette organisation explique qu’un même résultat final — du sang ou des protéines dans l’urine — puisse nécessiter des examens de compartiments différents.</p><p>Le glomérule est un peloton capillaire dans une capsule qui reçoit le filtrat. Le filtre repose sur l’endothélium, la membrane basale et les podocytes. Le mésangium constitue un support et participe à l’organisation du peloton. Une anomalie microscopique peut rester invisible à l’échographie ; une échographie normale n’écarte donc pas une glomérulopathie.</p><figure data-n03-figure="kidney"><div data-n03-frame="tall"><img alt="Planche anatomique humaine historique du rein normal" loading="lazy" src="assets/img/n03/alpha/codex/Kidney_section_vertical.png"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span><span aria-hidden="true" data-n03-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cortex : parenchyme périphérique, distinct de la voie urinaire.</li><li>Pyramide médullaire : repère anatomique normal.</li><li>Bassinet : voie collectrice, distincte du filtre glomérulaire.</li><li>Uretère : continuité de la voie excrétrice.</li></ol><p>Planche normale historique ; elle situe le parenchyme et les voies excrétrices sans montrer une cause de saignement. Aucune lésion fictive n’est ajoutée.</p><p data-n03-credit="">Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 · <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" rel="noopener" target="_blank">Domaine public</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les voies excrétrices conduisent l’urine déjà formée. Une cause urologique peut coexister avec une maladie glomérulaire ; le risque tumoral et les symptômes restent pris en compte. Le sédiment aide à localiser une origine glomérulaire, mais ne visualise ni une paroi vésicale ni la totalité de l’arbre urinaire. Les examens sont choisis selon la question, sans demander à l’un de remplacer tous les autres.</p><p><b>Science → clinique.</b> La localisation oriente l’interprétation de la protéinurie, des hématies et des signes associés. Le syndrome chronique reste un profil de parenchyme rénal, sans exclure une complication dans un autre compartiment.</p><p><b>Science → examen.</b> L’imagerie situe taille et structure ; la biopsie et ses techniques voient l’organisation microscopique. Les indices de chronicité n’annulent pas la recherche d’un obstacle ou d’une atteinte aiguë.</p><p><b>Science → traitement.</b> La protection hémodynamique du néphron ne lève pas une obstruction et ne traite pas une infection causale. La localisation anatomique vérifie que l’intervention répond au bon mécanisme.</p><div class="key"><b>À retenir.</b> Associer compartiment, fonction et cause ; une seule image ne répond pas à toutes les questions.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-REIN — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></section>
</div><div aria-labelledby="n03-tab-histo" class="sci" hidden="" id="n03-s-histo" role="tabpanel"><section class="ilot" id="n03-s-histo-content"><h2>Histologie : distinguer activité, dépôt et cicatrice</h2><p>Le glomérule normal associe cellules endothéliales, podocytes, cellules mésangiales et cellules pariétales de la capsule. La membrane basale sépare le versant capillaire du versant podocytaire. Les techniques de tissu interrogent cette architecture : l’optique montre les lésions et leur distribution ; l’immunofluorescence recherche la nature et la localisation de dépôts ; l’électronique précise l’ultrastructure.</p><p>La prolifération peut concerner différents compartiments. La sclérose correspond à un remplacement cicatriciel partiel ou global du glomérule. Les dépôts immunitaires ou autres constituent encore une autre catégorie de lésion. Plusieurs peuvent coexister dans le même prélèvement. Dire « chronique » ne signifie donc pas que toutes les structures soient uniquement cicatricielles.</p><figure data-n03-figure="fsgs"><div data-n03-frame="wide"><img alt="Microphotographie humaine PAS d’une lésion de sclérose segmentaire et focale, variante hilaire selon la provenance" loading="lazy" src="assets/img/n03/alpha/codex/Focal_segmental_glomerulosclerosis_-_high_mag.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span><span aria-hidden="true" data-n03-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Peloton capillaire du glomérule central : repère du compartiment glomérulaire.</li><li>Région plus dense à droite du glomérule ; la source attribue le champ à une variante hilaire de sclérose segmentaire et focale.</li><li>Tubules voisins : compartiment distinct du glomérule central.</li><li>Limite externe du glomérule et espace périphérique : repère topographique.</li></ol><p>Un champ PAS ne détermine ni proportion de glomérules lésés, ni cause primaire/secondaire/génétique, ni indication d’immunosuppression. La lésion illustrée n’est pas une preuve d’un diagnostic N03 chez un patient donné.</p><p data-n03-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Focal_segmental_glomerulosclerosis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Segmentaire et globale décrivent l’étendue dans un glomérule ; focale et diffuse décrivent la distribution entre glomérules. La photographie PAS montre un champ attribué par sa provenance à une variante hilaire de sclérose segmentaire et focale. Elle ne prouve ni maladie primitive ni cause adaptative, et ne permet pas de compter la proportion de glomérules atteints dans l’ensemble du rein.</p><p><b>Science → clinique.</b> Activité et chronicité contribuent à expliquer une fonction qui se dégrade ou une protéinurie persistante. Une cicatrice importante modifie le pronostic et le bénéfice attendu d’une intervention, sans remplacer l’évaluation de la trajectoire.</p><p><b>Science → examen.</b> Le compte rendu doit préciser échantillonnage, compartiments, dépôts, activité et dommages. Une répétition se discute si elle peut changer le plan ; elle n’est pas une réponse automatique à chaque fluctuation de créatinine.</p><p><b>Science → traitement.</b> Une lésion de sclérose n’est pas une indication autonome de corticoïdes. Le mécanisme, les lésions actives et le contexte infectieux ou génétique déterminent les possibilités de traitement spécifique.</p><div class="key"><b>À retenir.</b> Un pattern histologique est une pièce du diagnostic, pas toujours son nom final.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p></section>
</div><div aria-labelledby="n03-tab-physio" class="sci" hidden="" id="n03-s-physio" role="tabpanel"><section class="ilot" id="n03-s-physio-content"><h2>Physiologie : filtration, transport et adaptation</h2><p>Le néphron filtre puis modifie le filtrat par réabsorption et sécrétion. Le volume urinaire ne mesure pas à lui seul la filtration, et la créatinine ne décrit pas toutes les fonctions du rein. La présence de protéines ou d’hématies peut signaler une atteinte avant une baisse importante du débit global. Il faut donc suivre à la fois fonction et marqueurs de dommage.</p><p>La pression intraglomérulaire et les réponses hémodynamiques participent à la progression de certaines maladies. Le blocage rénine–angiotensine et les inhibiteurs SGLT2 peuvent modifier cette hémodynamique ; une variation initiale de débit n’est pas nécessairement une destruction supplémentaire de néphrons. L’interprétation demande amplitude, délai, état volémique et signes associés.</p><figure data-n03-figure="nephron"><div data-n03-frame="tall"><img alt="Illustration humaine historique des échanges tubulaires du néphron normal" loading="lazy" src="assets/img/n03/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tubule proximal : réabsorption et sécrétion modifient le filtrat.</li><li>Branche ascendante : repère de la réabsorption de sodium, potassium et chlorure.</li><li>Canal collecteur : ajustement final de l’eau et des solutés.</li></ol><p>Schéma simplifié normal ; les flèches sont celles de l’original. Il ne mesure pas les flux d’un patient et ne représente pas une glomérulonéphrite.</p><p data-n03-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les traitements tubulaires et diurétiques modifient eau et solutés. Une diminution de congestion peut améliorer les symptômes, mais une déplétion excessive expose à une aggravation fonctionnelle. Le potassium peut baisser sous diurétique ou augmenter dans la maladie rénale et sous bloqueur du système rénine–angiotensine. Il ne faut donc pas déduire un supplément de potassium d’un seul nom de classe.</p><p><b>Science → clinique.</b> Poids, œdèmes, pression, diurèse et symptômes doivent être confrontés. Une hausse de créatinine après changement thérapeutique ne se classe pas sans l’état d’hydratation et le calendrier.</p><p><b>Science → examen.</b> Comparer les valeurs de départ et de contrôle. Les repères de variation de débit et de créatinine ne sont pas exactement la même opération ; les calculs sont expliqués dans les fenêtres de cette leçon.</p><p><b>Science → traitement.</b> Le bénéfice rénal s’accompagne d’un suivi de sécurité : pression, fonction et électrolytes. Le contrôle rapproché après titration n’est pas remplacé par le bilan annuel d’une maladie stable.</p><div class="key"><b>À retenir.</b> Une bonne réponse physiologique se juge avec la tolérance et la trajectoire, pas avec un chiffre isolé.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">FI-LASIX-PO — Posologie, contre-indications et précautions</a>.</p></section>
</div><div aria-labelledby="n03-tab-bio" class="sci" hidden="" id="n03-s-bio" role="tabpanel"><section class="ilot" id="n03-s-bio-content"><h2>Biochimie : choisir le marqueur et garder l’unité</h2><p>L’albumine est une protéine particulière ; le dosage des protéines totales additionne plusieurs constituants. Leur rapport à la créatinine urinaire réduit l’effet de dilution, sans supprimer la variabilité du prélèvement. Un seuil exprimé en albumine/créatinine ne doit pas être alimenté par une valeur de protéines totales. Le résultat doit porter son analyte et son unité.</p><p>La bandelette réagit à l’hème et peut donc être positive avec hémoglobine ou myoglobine libres. La numération et la morphologie recherchent une autre information, celle des cellules. Cette distinction explique pourquoi une bandelette positive ne suffit pas à nommer une hématurie glomérulaire ni à décider d’une biopsie.</p><figure data-n03-figure="podocytes"><div data-n03-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n03/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n03-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La créatinine est un marqueur indirect de filtration ; sa concentration dépend aussi de facteurs non rénaux. La cystatine C apporte une information complémentaire, mais le choix d’un marqueur ou d’une combinaison doit suivre la population et le besoin de précision. En phase instable, une équation ne transforme pas une concentration en mesure instantanée certaine de filtration.</p><p><b>Science → clinique.</b> Les protéines, la fonction et le sédiment décrivent des dimensions différentes. Une amélioration de l’albuminurie et une fonction stable sont utiles, sans démontrer l’absence de tout mécanisme de maladie.</p><p><b>Science → examen.</b> Les rapports se calculent avec deux concentrations du même prélèvement. Les unités du litre s’annulent, mais mg et g ne s’effacent pas arbitrairement. La variation relative se calcule par rapport à la valeur initiale et doit préciser si l’on mesure une hausse ou une baisse.</p><p><b>Science → traitement.</b> Une dose dépend du produit et de la mesure de fonction demandée par sa FI. Clairance en mL/min et débit indexé en mL/min/1,73 m² ne sont pas toujours interchangeables, surtout aux extrêmes corporels.</p><div class="key"><b>À retenir.</b> Nommer analyte, unité, méthode et délai avant d’utiliser un seuil.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a>.</p><p><button class="w" data-k="n03-calcul-ratio">Calculer un rapport urinaire</button></p></section>
</div><div aria-labelledby="n03-tab-immuno" class="sci" hidden="" id="n03-s-immuno" role="tabpanel"><section class="ilot" id="n03-s-immuno-content"><h2>Immunologie et physiopathologie : le pattern ne suffit pas</h2><p>Une atteinte glomérulaire chronique peut résulter de mécanismes immunitaires, infectieux, génétiques ou de conséquences secondaires de lésions antérieures. Dépôts immunitaires, prolifération et cicatrices ne se confondent pas. L’immunofluorescence et la clinique précisent la nature du processus ; une coloration PAS ne montre pas directement la présence d’IgA ou de complément.</p><p>Le pattern membranoprolifératif peut accompagner des dépôts d’immunoglobulines polyclonales ou monoclonales, une activation du complément ou d’autres mécanismes. KDIGO insiste sur la recherche de cause : infection, maladie auto-immune, composant monoclonal ou dysrégulation du complément selon les résultats. Une hypocomplémentémie est possible mais non obligatoire.</p><figure data-n03-figure="fsgs"><div data-n03-frame="wide"><img alt="Microphotographie humaine PAS d’une lésion de sclérose segmentaire et focale, variante hilaire selon la provenance" loading="lazy" src="assets/img/n03/alpha/codex/Focal_segmental_glomerulosclerosis_-_high_mag.jpg"/><span aria-hidden="true" data-n03-mark="1">1</span><span aria-hidden="true" data-n03-mark="2">2</span><span aria-hidden="true" data-n03-mark="3">3</span><span aria-hidden="true" data-n03-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Peloton capillaire du glomérule central : repère du compartiment glomérulaire.</li><li>Région plus dense à droite du glomérule ; la source attribue le champ à une variante hilaire de sclérose segmentaire et focale.</li><li>Tubules voisins : compartiment distinct du glomérule central.</li><li>Limite externe du glomérule et espace périphérique : repère topographique.</li></ol><p>Un champ PAS ne détermine ni proportion de glomérules lésés, ni cause primaire/secondaire/génétique, ni indication d’immunosuppression. La lésion illustrée n’est pas une preuve d’un diagnostic N03 chez un patient donné.</p><p data-n03-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Focal_segmental_glomerulosclerosis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Dans une maladie du collagène IV, une sclérose secondaire ne prouve pas une maladie immune primitive. Dans l’IgA, le diagnostic reste biopsique et les critères de risque propres à la maladie orientent la discussion thérapeutique. Un syndrome chronique ne doit pas effacer ces différences mécanistiques. Une activité traitable peut coexister avec une fibrose déjà constituée.</p><p><b>Science → clinique.</b> La persistance des protéines n’est pas synonyme d’inflammation, et une histoire ancienne n’exclut pas une poussée. Des signes généraux ou une infection changent l’interprétation d’un résultat immunologique.</p><p><b>Science → examen.</b> Le bilan est orienté par le phénotype et le tissu ; il ne se réduit pas à un panel systématique dont chaque positivité serait une preuve. Le résultat génétique doit aussi être confronté à la présentation.</p><p><b>Science → traitement.</b> Le traitement étiologique suppose une maladie démontrée, un bénéfice attendu et une évaluation des risques. La néphroprotection agit sur des voies communes, mais ne remplace pas un traitement de cause lorsqu’il est utile. Les limites suisses sous immunosuppresseur restent applicables aux associations médicamenteuses.</p><div class="key"><b>À retenir.</b> Relier cause, activité et dommages avant de choisir une immunomodulation.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></section>
</div></div></div>

<div class="panel" hidden="" id="pP"><div class="chap-body"><section class="ilot" id="n03-p-principes"><h2>Prescrire pour un objectif, puis vérifier la tolérance</h2><p>Les cinq produits ci-dessous illustrent la néphroprotection, le contrôle tensionnel et la gestion d’œdèmes dans leurs cadres précis. Aucun n’est un traitement universel du syndrome N03. Les médicaments étiologiques d’une glomérulopathie se choisissent avec le néphrologue après diagnostic, appréciation de l’activité et évaluation des risques. Une cicatrice ou un nom de pattern ne suffit pas à justifier une immunosuppression.</p><p>Les informations professionnelles suisses des produits exacts fixent voies, doses, adaptations et contre-indications. La recommandation suisse de classe ne donne pas une autorisation identique à chaque produit. L’indication rénale du ramipril retenu concerne une protéinurie supérieure à 3 g/j ; celle du losartan concerne la néphropathie diabétique hypertendue. Leur emploi dans d’autres maladies glomérulaires peut donc être hors indication rénale spécifique, même lorsque leur utilisation antihypertensive est indiquée.</p><p>Avant de prescrire, documenter pression, état volémique, créatinine/mesure de fonction appropriée, potassium, autres médicaments et projet de grossesse. Après introduction ou titration d’un IEC/ARA, contrôler pression, créatinine et potassium dans les deux à quatre semaines selon KDIGO, plus tôt si la situation le requiert. Les contrôles à long terme ne remplacent pas ce suivi initial.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a>.</p></section>
<section class="ilot" id="n03-p-ramipril"><h2>Ramipril Zentiva — dose et indication ne se transposent pas</h2><p><b>FI décembre 2021 ; comprimés par voie orale.</b> Pour la néphropathie glomérulaire avec protéinurie supérieure à 3 g/j, début à 1,25 mg une fois par jour, puis augmentation selon tolérance, en doublant dans un intervalle de deux à trois semaines. Le maximum de cette indication est <b>5 mg/j</b>. La durée du traitement prolongé est décidée individuellement. La FI de l’hypertension donne un début habituel à 2,5 mg/j et un maximum de 10 mg/j : ce second plafond ne devient pas celui de toute maladie rénale.</p><p>Pour une clairance entre 20 et 50 mL/min/1,73 m², le début est 1,25 mg/j et le maximum 5 mg/j. L’expérience insuffisante en dessous de 20 et chez le dialysé figure dans la rubrique contre-indications de cette FI. En atteinte hépatique, début sous surveillance stricte et maximum 2,5 mg/j. Corriger une déplétion hydrosodée et revoir les diurétiques selon le contexte ; une pause de diurétique n’est jamais décidée sans apprécier la congestion.</p><p>Vérifier antécédent d’angio-œdème, sténose artérielle rénale sévère bilatérale ou sur rein unique et instabilité hémodynamique. Ne pas associer au sacubitril/valsartan : intervalle d’au moins 36 heures dans les deux sens. Éviter le double blocage rénine–angiotensine et vérifier les contre-indications particulières de l’aliskirène. Potassium, diurétiques épargneurs, AINS et lithium peuvent modifier le risque ; surveiller pression, potassium et fonction.</p><p>Ne pas utiliser pendant la grossesse ; anticiper un projet avant de poursuivre une néphroprotection. L’allaitement n’est pas recommandé avec le produit consulté. La FI ne recommande pas l’usage avant 18 ans ; une stratégie pédiatrique spécialisée hors indication ne se déduit pas du schéma adulte. Les bénéfices d’une classe thérapeutique ne permettent pas d’ignorer les restrictions du produit.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a>.</p></section>
<section class="ilot" id="n03-p-cosaar"><h2>Cosaar — une indication rénale suisse spécifique</h2><p><b>Losartan, FI avril 2025 ; voie orale.</b> L’indication rénale concerne les adultes diabétiques de type 2 hypertendus ayant une créatininémie élevée et un rapport albumine/créatinine d’au moins 300 mg/g. Début habituel à 50 mg une fois par jour ; la dose peut atteindre 100 mg une fois par jour selon la réponse tensionnelle. Le traitement est prolongé et réévalué. Dans l’hypovolémie, envisager 25 mg une fois par jour au départ. Une glomérulopathie non diabétique ne correspond pas automatiquement à cette indication rénale.</p><p>La FI ne demande pas d’adaptation rénale systématique, y compris chez le dialysé, mais appelle à la prudence et à un début réduit en insuffisance sévère, hypovolémie ou traitement diurétique important. En atteinte hépatique, prévoir une dose réduite ; l’insuffisance hépatique sévère est contre-indiquée. La FI retenue ne recommande pas le produit chez l’enfant ou l’adolescent faute de données établies.</p><p>Rechercher angio-œdème antérieur, hypotension, hyperkaliémie et atteinte fonctionnelle. Les AINS peuvent augmenter le risque rénal et modifier l’effet ; le lithium et les produits augmentant le potassium doivent être revus. Ne pas superposer IEC et ARA pour augmenter arbitrairement l’antiprotéinurie. Les situations d’association à l’aliskirène contre-indiquées restent celles définies dans la FI.</p><p>Les deuxième et troisième trimestres sont contre-indiqués ; le premier trimestre est déconseillé et le traitement doit être arrêté dès diagnostic de grossesse. Le projet de grossesse exige une adaptation préalable. La cible tensionnelle se poursuit avec une stratégie compatible avec la situation, et non en maintenant un produit inadapté pour conserver un chiffre de pression.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a>.</p></section>
<section class="ilot" id="n03-p-forxiga"><h2>Forxiga — une limite de produit distincte de la recommandation de classe</h2><p><b>Dapagliflozine, FI août 2026 ; comprimés par voie orale.</b> Dans la maladie rénale chronique de l’adulte, la dose recommandée est 10 mg une fois par jour, indépendamment des repas. Avaler entier. Ce schéma rénal est distinct du début à 5 mg de certaines situations de diabète ; augmenter au-delà de 10 mg/j n’est pas une stratégie de correction de la protéinurie. La durée est prolongée selon bénéfice et tolérance.</p><p>L’instauration n’est pas recommandée si le débit estimé est inférieur à 25 mL/min/1,73 m². Un traitement déjà commencé à 10 mg/j peut être poursuivi sous ce seuil selon la FI, jusqu’à la situation de dialyse ou de transplantation. En atteinte hépatique légère ou modérée, pas d’ajustement ; si elle est sévère, début à 5 mg/j puis 10 mg/j selon tolérance. L’indication rénale de l’adulte ne se transpose pas à l’enfant.</p><p>La FI ne recommande pas le traitement de néphropathie sous immunosuppresseur, après greffe, en dialyse ou dans la polykystose faute de données suffisantes ; elle ne dispose pas d’expérience chez le non-diabétique sans albuminurie. Ainsi, le seuil de classe à 20 dans les recommandations n’autorise pas un début de ce produit à 20, et une association avec un traitement étiologique doit être discutée dans le cadre suisse exact.</p><p>Surveiller volume et pression, surtout avec un diurétique. Une acidocétose peut être évoquée devant nausées, douleurs abdominales, dyspnée ou altération générale, même sans forte hyperglycémie : interrompre et évaluer rapidement en cas de suspicion. Infections génitales et symptômes périnéaux fébriles nécessitent une évaluation. Le produit ne traite ni le diabète de type 1 ni l’acidocétose.</p><p>Arrêter si possible au moins trois jours avant chirurgie lourde ou jeûne prolongé ; reprendre lorsque l’état est stable et l’alimentation orale rétablie. Une maladie aiguë grave peut justifier une interruption avec un plan de reprise écrit. Surveiller plus fréquemment la lithiémie si associé. Arrêter dès grossesse diagnostiquée ; ne pas utiliser pendant l’allaitement. Le bénéfice attendu ne supprime pas les consignes de sécurité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a>.</p></section>
<section class="ilot" id="n03-p-norvasc"><h2>Norvasc — compléter le contrôle de pression</h2><p><b>Amlodipine, FI avril 2023 ; voie orale.</b> Pour l’hypertension, le traitement commence habituellement à 5 mg une fois par jour et peut atteindre 10 mg une fois par jour selon la réponse. Il s’agit d’un traitement de fond, avec réévaluation de pression et tolérance ; ce schéma ne remplace pas la prise en charge d’une urgence hypertensive.</p><p>Pas d’adaptation rénale habituelle ; le produit n’est pas dialysable. La prudence s’impose en atteinte hépatique, sans schéma chiffré spécifique établi par la FI. Chez le sujet âgé, un début plus faible peut être nécessaire. La FI retenue ne fournit pas de schéma établi avant 18 ans. Ne pas inventer une dose pédiatrique à partir d’une fraction du comprimé adulte.</p><p>Hypotension sévère, choc, obstruction sévère à l’éjection ventriculaire gauche et certaines situations cardiaques instables constituent des contre-indications. Surveiller vertiges, tolérance et œdèmes ; une augmentation des œdèmes après changement de traitement demande une interprétation clinique, pas une attribution automatique à la progression rénale.</p><p>Vérifier inhibiteurs ou inducteurs du CYP3A4 et éviter le pamplemousse selon la FI. Si simvastatine associée, son plafond est 20 mg/j sous amlodipine. Une surveillance des concentrations de ciclosporine ou tacrolimus peut être nécessaire. Grossesse seulement en nécessité absolue ; si le traitement est indispensable pendant l’allaitement, la FI demande le sevrage. Le choix individuel se discute avec le prescripteur.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">FI-NORVASC — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a>.</p></section>
<section class="ilot" id="n03-p-lasix"><h2>Lasix comprimés 40 mg — traiter l’œdème sans provoquer une déplétion</h2><p><b>Furosémide oral, FI mai 2025.</b> Les œdèmes d’origine rénale font partie des indications. Le début adulte est de 20 à 80 mg/j, soit un demi à deux comprimés de 40 mg par jour ; l’entretien habituel indiqué est 20–40 mg/j. Prendre à jeun, sans croquer, avec de l’eau. La dose et la durée sont adaptées à la réponse et au contexte ; conserver la dose la plus faible permettant l’effet recherché.</p><p>La FI mentionne un maximum de 1500 mg/j par voie orale ou intraveineuse dans des situations particulières ; ce plafond exceptionnel, surtout pertinent lors de fonction très diminuée et de prise en charge spécialisée, n’est ni une dose de départ ni une cible d’escalade ambulatoire. Le produit décrit ici est le comprimé de 40 mg ; il ne fournit pas le protocole d’une urgence respiratoire. Chez l’enfant, le schéma oral de la FI est 2 mg/kg/j, maximum 40 mg/j, sous évaluation adaptée.</p><p>Défaillance rénale avec anurie, hypovolémie/déshydratation, hypokaliémie ou hyponatrémie sévères et coma/précoma hépatique sont des contre-indications. L’écoulement de l’urine doit être assuré. En hypoprotéinémie ou atteinte hépatique associée, titrer prudemment et surveiller étroitement. La fonction rénale basse ne justifie pas un diurétique en présence d’anurie.</p><p>Surveiller poids, pression, créatinine, sodium, potassium et autres électrolytes selon le contexte. La FI évoque le risque de déficit potassique ; dans une maladie rénale chronique et sous bloqueur rénine–angiotensine, ne pas donner automatiquement un apport de potassium : mesurer et individualiser avec les recommandations suisses de surveillance.</p><p>AINS, lithium, médicaments ototoxiques et autres médicaments néphrotoxiques nécessitent une revue ; une hypokaliémie peut majorer le risque de certains traitements cardiaques. Grossesse uniquement sur indication stricte avec surveillance ; allaitement contre-indiqué dans la FI. Une diurèse accrue ne prouve pas une guérison de la glomérulopathie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">FI-LASIX-PO — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a>.</p></section>
<section class="ilot" id="n03-p-populations"><h2>Populations, sécurité et cadre suisse</h2><table class="t"><thead><tr><th>Situation</th><th>Adaptation du raisonnement</th></tr></thead><tbody><tr><td>Enfant</td><td>Références de pression et d’équations adaptées, croissance préservée ; pas de restriction protéique adulte ni de doses adultes extrapolées.</td></tr><tr><td>Grossesse ou projet</td><td>Revoir tôt IEC/ARA et dapagliflozine ; choix coordonné selon cause et produits, sans arrêt laissé sans stratégie de relais.</td></tr><tr><td>Fragilité ou sarcopénie</td><td>Cible tensionnelle et nutrition individualisées ; précision du débit et risque de chute réévalués.</td></tr><tr><td>Maladie aiguë</td><td>Chercher déplétion, infection et effets médicamenteux ; toute pause comporte consignes de contrôle et de reprise.</td></tr><tr><td>Atteinte hépatique</td><td>Vérifier chaque FI : limites et adaptations diffèrent entre produits.</td></tr><tr><td>Remboursement</td><td>Les recommandations SGN renvoient à la liste des spécialités ; vérifier les conditions contemporaines pour le produit et l’indication.</td></tr></tbody></table><p>Le syndrome N03 n’établit pas à lui seul une déclaration OFSP, une indemnisation Suva, un droit AI ou une règle uniforme d’aptitude professionnelle. La cause et le retentissement déterminent les démarches individuelles. Des vertiges ou une hypotension sous traitement peuvent altérer la conduite ; les consignes du produit et l’évaluation clinique s’appliquent. Une promesse de remboursement ou de capacité de travail ne se déduit pas d’une catégorie CIM.</p><p>Le plan médicamenteux doit être compréhensible : objectif de chaque produit, dose, contrôle prévu, situations de contact et modalités de reprise après interruption. La collaboration avec pharmacien, médecin traitant, néphrologue et autres spécialistes aide à éviter prescriptions incompatibles ou doublons.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">FI-NORVASC — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">FI-LASIX-PO — Posologie, contre-indications et précautions</a>.</p></section>
