<template data-pop="d50-sm-conjonctive" data-title="Pâleur conjonctivale : technique, valeur et limites"><h3>Technique</h3><p>Le médecin abaisse la paupière inférieure et compare deux zones de la conjonctive palpébrale. Chez le sujet sain, le bord antérieur paraît plus rouge que le bord postérieur. L’étude de Kalantri considère la conjonctive comme pâle lorsque le bord antérieur devient aussi pâle que le bord postérieur. La même étude examine le dos de la langue, les plis palmaires et le lit unguéal, avec une gradation de l’absence à la pâleur sévère.</p><h3>Mécanisme</h3><p>Onkopedia 2025 range la pâleur des conjonctives parmi les symptômes généraux de toute anémie. Elle reflète donc la baisse d’hémoglobine, quelle qu’en soit la cause, et non la carence en fer elle-même.</p><h3>Valeur</h3><p>mediX 08/2025 juge la pâleur cutanée peu sûre et la pâleur des muqueuses, en particulier des conjonctives, plus fiable. Aucune source suisse ou européenne lue ne la chiffre. Dans une étude indienne de 390 patients hospitalisés ou consultants de plus de 12 ans, une pâleur palmaire sévère avait un rapport de vraisemblance de 5,94 pour une hémoglobine inférieure à 90 g/L, avec un intervalle de confiance de 1,45 à 24,4. L’absence de pâleur palmaire avait un rapport de 0,25 pour une hémoglobine inférieure à 70 g/L.</p><div class="trap"><span class="k">Piège</span> La concordance entre deux examinateurs était faible, avec un coefficient kappa de 0,07 pour la conjonctive. L’étude portait sur une population où 64 % des patients étaient anémiques, sans examen standardisé : ses chiffres ne se transposent ni au cabinet suisse ni à l’enfant.</div><div class="key"><b>À retenir.</b> La pâleur conjonctivale fait demander un hémogramme ; elle ne mesure pas l’hémoglobine et n’indique pas la cause. Son absence rend surtout une anémie sévère moins probable.</div><p class="src">Références : <a href="https://doi.org/10.1371/journal.pone.0008545" target="_blank" rel="noopener">Kalantri et al., PLoS One 2010, méthodes et tableaux 2 et 3</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, Eisenmangel, 08/2025, chapitre 2</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, avril 2025, § 3.1</a>.</p></template>
<template data-pop="d50-sm-fatigue" data-title="Fatigue : mécanisme, valeur et diagnostic différentiel"><h3>Mécanisme</h3><p>Le fer n’est pas seulement un transporteur d’oxygène ; il entre dans la chaîne respiratoire mitochondriale. Dans des modèles animaux, la carence sans anémie réduisait déjà le nombre de mitochondries et l’activité des enzymes respiratoires. Clénin en déduit que la carence atteint la capacité oxydative, alors que l’anémie atteint surtout le transport de l’oxygène.</p><h3>Interrogatoire</h3><p>Le médecin date la fatigue, en précise l’intensité et le retentissement sur l’effort, la concentration et le sommeil. Il recherche des pertes, un régime pauvre en fer et les signes d’une autre maladie.</p><h3>Valeur</h3><p>mediX 08/2025 souligne qu’il n’existe, dans la population, aucune relation entre une fatigue isolée et l’anémie. Chez la femme non ménopausée carencée sans anémie, le fer peut soulager la fatigue ; l’effet n’est toutefois significatif que pour une ferritine inférieure à 15 µg/L.</p><div class="trap"><span class="k">Piège</span> Avant tout traitement martial d’une fatigue inexpliquée, mediX demande d’envisager une dépression, une hypothyroïdie ou une hyperthyroïdie, une insuffisance rénale, un diabète, une hyperparathyroïdie et une hépatite chronique.</div><div class="key"><b>À retenir.</b> La fatigue motive le dosage de la ferritine, mais ne prouve pas la carence. Une amélioration sous fer reste un argument, non une preuve.</div><p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/2310/3501?inline=1" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017, « Influence of iron on physical performance and cognition »</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, Eisenmangel, 08/2025, chapitre 2</a>.</p></template>
<template data-pop="d50-sm-jambes" data-title="Jambes sans repos : critères, mécanisme et seuils"><h3>Reconnaître</h3><p>Le diagnostic exige cinq critères essentiels. Le patient ressent un besoin de bouger les jambes, généralement accompagné de sensations désagréables. Ce besoin apparaît ou s’aggrave au repos, il est soulagé partiellement ou totalement par le mouvement et il prédomine le soir ou la nuit. Enfin, aucune autre affection n’explique mieux les symptômes.</p><h3>Mécanisme</h3><p>La recommandation germano-austro-suisse 2024 rattache la maladie à une carence en fer du système nerveux central, notamment de la substance noire, et à une signalisation dopaminergique altérée. L’efficacité des traitements dopaminergiques appuie ce rôle de la dopamine.</p><h3>Seuils selon les sources</h3><p>La recommandation germano-austro-suisse propose un traitement martial pour une ferritine inférieure à 75 µg/L ou une saturation de la transferrine inférieure ou égale à 20 %, sans dépasser 300 µg/L de ferritine. Le Delphi suisse 2019 retient, chez le sujet âgé, une ferritine inférieure à 50 µg/L ou une saturation inférieure à 16 %. mediX 08/2025 juge le bénéfice insuffisamment démontré au-delà de 15 µg/L de ferritine.</p><div class="trap"><span class="k">Piège</span> Une polyneuropathie donne des paresthésies symétriques « en chaussettes » ; des crampes nocturnes des mollets, une akathisie ou une claudication intermittente imitent aussi la maladie. Le soulagement par le mouvement et la prédominance vespérale les distinguent.</div><div class="key"><b>À retenir.</b> Chez un patient atteint de jambes sans repos, le médecin dose la ferritine et la saturation de la transferrine. Le seuil de traitement dépend de la source et du spécialiste qui prend en charge.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">Trenkwalder et al., Neurol Res Pract 2024, recommandation DGSM et DGN approuvée par la Société suisse de neurologie</a> ; <a href="https://smw.ch/index.php/smw/article/download/2646/4203?inline=1" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, 08/2025, chapitre 4.2</a>.</p></template>
<template data-pop="d50-sm-pica" data-title="Pica et pagophagie : rechercher ce que le patient ne dit pas"><h3>Définition</h3><p>Le pica désigne l’ingestion compulsive de substances non alimentaires, comme la terre. La pagophagie désigne l’envie impérieuse de croquer de la glace.</p><h3>Interrogatoire</h3><p>Le médecin pose la question directement, car le patient en parle rarement de lui-même. Il demande s’il croque des glaçons, mange de la terre, de l’argile ou d’autres substances, et depuis quand.</p><h3>Valeur et mécanisme</h3><p>La BSG range la pagophagie parmi les manifestations plus spécifiques de la carence martiale. mediX cite l’envie d’argile et de terre ; Gattermann cite le pica parmi les manifestations de la carence. Aucune source lue ne chiffre ces signes, et aucune n’en établit le mécanisme.</p><div class="trap"><span class="k">Piège</span> Le tableau des causes de la BSG mentionne aussi le syndrome de pica. Le comportement peut donc être à la fois une conséquence de la carence et une piste étiologique à explorer.</div><div class="key"><b>À retenir.</b> Une pagophagie ou un pica font doser la ferritine ; leur absence n’exclut rien.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, « Clinical features, history and examination » et tableau 1</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, 08/2025, chapitre 2</a> ; <a href="https://doi.org/10.3238/arztebl.m2021.0290" target="_blank" rel="noopener">Gattermann et al., Dtsch Arztebl Int 2021</a>.</p></template>
<template data-pop="d50-sm-trophiques" data-title="Troubles trophiques : ongles, bouche, langue et cheveux"><h3>Signes</h3><p>Onkopedia décrit une fragilité accrue des ongles et des cheveux, des fissures des commissures labiales et une atrophie de la muqueuse linguale avec dysphagie. mediX ajoute des ongles striés, une chute de cheveux, une peau sèche, un prurit et des aphtes. Le Delphi suisse cite la koilonychie, des ongles fragiles, une chéilite, une glossite atrophique, une alopécie et le syndrome de Plummer et Vinson. La BSG mentionne aussi des sclérotiques bleues.</p><h3>Technique</h3><p>Le médecin inspecte les ongles de face et de profil, les cheveux, les commissures labiales et la langue. Il recherche une concavité unguéale, une fissure commissurale ou une langue lisse dépapillée, et il interroge sur une gêne à la déglutition.</p><h3>Mécanisme</h3><p>Onkopedia rappelle que toutes les cellules ont besoin de fer, et pas seulement l’érythropoïèse. Les tissus qui se renouvellent souffrent donc de la carence, indépendamment de l’hémoglobine. Les sources lues ne détaillent pas le mécanisme propre à chaque signe.</p><h3>Valeur</h3><p>La BSG ne retrouve ces signes qu’à l’occasion ; Gattermann les décrit surtout dans la carence sévère. Aucune source lue ne les chiffre. Leur présence oriente vers la ferritine ; leur absence n’exclut rien.</p><div class="trap"><span class="k">Piège</span> Une chéilite angulaire peut avoir une cause locale, comme une prothèse dentaire ou une sécheresse buccale. La carence n’en est alors qu’un facteur possible.</div><div class="key"><b>À retenir.</b> Un trouble trophique désigne le manque de fer des tissus, même avec une hémoglobine normale. Une dysphagie associée fait discuter un syndrome de Plummer et Vinson.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, avril 2025, § 3.1</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, 08/2025, chapitre 2</a> ; <a href="https://smw.ch/index.php/smw/article/download/2646/4203?inline=1" target="_blank" rel="noopener">Delphi suisse 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.3238/arztebl.m2021.0290" target="_blank" rel="noopener">Gattermann et al., 2021</a>.</p></template>
<template data-pop="d50-sm-pertes" data-title="Examen de la cause : abdomen, région anale, toucher rectal"><h3>Ce que recommande Onkopedia</h3><p>Le guide Onkopedia, auquel participe la Société suisse d’hématologie, place la perte sanguine digestive chronique au premier rang des causes à exclure. Son tableau 7 associe l’anamnèse ciblée à l’inspection de la région anale, à la palpation de l’abdomen et au toucher rectal. Une hématurie macroscopique ou microscopique impose une exploration urologique.</p><h3>Ce que précise la BSG</h3><p>La BSG juge l’examen physique généralement normal, même s’il apporte parfois le diagnostic. Elle ne mentionne pas le toucher rectal. Elle inclut l’analyse d’urine dans le premier bilan d’une anémie ferriprive confirmée.</p><div class="trap"><span class="k">Piège</span> Un examen abdominal et rectal normal n’exclut pas une lésion digestive. Les symptômes abdominaux ne prédisent ni la présence ni le siège d’une lésion ; l’exploration endoscopique dépend de l’âge, du sexe et du contexte.</div><div class="key"><b>À retenir.</b> L’examen cherche une piste vers la perte ; il ne remplace jamais l’exploration lorsque celle-ci est indiquée.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, avril 2025, § 3.6.2 et tableau 7</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, examen et recommandation 7</a>.</p></template>
