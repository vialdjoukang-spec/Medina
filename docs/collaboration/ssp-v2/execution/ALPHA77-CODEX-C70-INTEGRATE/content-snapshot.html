<h1>C70 — Tumeur maligne des méninges</h1>
<span class="status">Revue IA de l’auteur · Aucune validation médicale humaine attestée</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div>
<div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="C70">
<section class="ilot" id="c70-0"><h2>Reconnaître une tumeur méningée, puis établir sa nature</h2>
<p>Une céphalée progressive, une première crise épileptique ou une faiblesse qui s’aggrave justifient la recherche d’une lésion intracrânienne. Une masse accolée à la dure-mère peut être un méningiome, mais cet aspect ne prouve ni son type exact ni son grade. La question clinique est double : existe-t-il une compression urgente, et quel diagnostic tissulaire déterminera le traitement ?</p>
<p>Cette leçon porte sur la <b>tumeur maligne des méninges</b>, principalement le méningiome de grade 3. Elle distingue aussi les tumeurs fibreuses solitaires malignes et les tumeurs mélanocytaires primitives, qui exigent d’autres analyses. La métastase durale ou leptoméningée est un diagnostic différentiel. Le raisonnement part des symptômes, de la localisation et de l’évolution ; le code administratif vient après la conclusion clinique.</p>
<div class="key"><b>À retenir.</b> Le danger immédiat dépend de l’effet de masse et du déficit ; le diagnostic définitif et le grade reposent sur le tissu et, lorsque indiqué, sur la biologie moléculaire.</div>
<p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r16">[réf.16]</button> · <button class="w" data-k="c70-r20">[réf.20]</button> · <button class="w" data-k="c70-r21">[réf.21]</button> · <button class="w" data-k="c70-r26">[réf.26]</button></p>
</section>
<section class="ilot" id="c70-1"><h2>Définition et classification du méningiome</h2>
<p>Le méningiome se développe à partir de cellules arachnoïdiennes des méninges. Il est habituellement extra-axial : il se trouve en dehors du parenchyme nerveux, qu’il peut comprimer. La plupart des méningiomes sont bénins ; une tumeur peut pourtant entraîner un handicap par sa seule localisation. Le grade 3 correspond à un comportement particulièrement agressif, avec croissance rapide, récidive précoce et possibilité de métastases systémiques.</p>
<table class="t"><thead><tr><th>Niveau</th><th>Ce qui le définit</th><th>Conséquence</th></tr></thead><tbody><tr><td>Grade 1</td><td>Absence de critères de grade supérieur dans une analyse adaptée</td><td>Souvent croissance lente ; surveillance possible dans certaines formes asymptomatiques.</td></tr><tr><td>Grade 2</td><td>Critères d’atypie, activité mitotique accrue ou invasion cérébrale selon OMS 2021</td><td>Risque de récidive supérieur ; traitement et surveillance renforcés.</td></tr><tr><td>Grade 3</td><td>Anaplasie franche, activité mitotique ≥12,5/mm², promoteur de TERT oncogène ou délétion homozygote CDKN2A/B</td><td>Résection maximale sûre puis radiothérapie fractionnée.</td></tr></tbody></table>
<p>Les aspects papillaire et rhabdoïde ne suffisent plus, à eux seuls, à attribuer un grade 3 dans la classification OMS 2021. Le diagnostic intègre les critères histologiques et moléculaires. Une morphologie peu atypique peut donc masquer un grade 3 moléculaire.</p>
<p><button class="w" data-k="c70-grading">OMS 2021 et cIMPACT-NOW 8 : distinguer les règles</button></p>
<div class="key"><b>À retenir.</b> Le grade biologique, le type tumoral et l’étendue de résection sont trois informations différentes. Aucun symptôme ni signe d’imagerie ne remplace leur analyse.</div>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button></p>
</section>
<section class="ilot" id="c70-2"><h2>Fréquence : préciser ce que les chiffres mesurent</h2>
<p>L’Inselspital rapporte que les méningiomes sont surtout diagnostiqués après 50 ans et répartit les grades approximativement en 70–80 % de grade 1, 15–25 % de grade 2 et 1–3 % de grade 3. Ces proportions de centre concernent l’ensemble des méningiomes ; elles ne constituent pas une incidence nationale de C70. Le CHUV souligne la fréquence supérieure chez les femmes et les personnes âgées, tous grades confondus.</p>
<p>Une étude du registre de Zurich publiée en 2025 décrit les tumeurs primitives du cerveau et du système nerveux central chez les personnes d’au moins 15 ans entre 1980 et 2021. Elle confirme une hausse des diagnostics bénins ou de comportement incertain et une incidence globale maligne plutôt stable. Son regroupement englobe plusieurs topographies et histologies : ses taux ne doivent pas être présentés comme ceux du méningiome malin.</p>
<p><b>Limite documentaire :</b> les sources consultées ne donnent pas d’incidence nationale suisse récente propre à C70 ou au grade 3 selon OMS 2021. Les fréquences de chaque symptôme, les sensibilités d’examen et un pronostic chiffré contemporain propre au grade 3 ne sont pas établis ici. Cette incertitude ne diminue pas l’urgence d’un déficit progressif.</p>
<div class="key"><b>À retenir.</b> Le grade 3 est rare parmi les méningiomes. Les chiffres de toutes les tumeurs du système nerveux central ne mesurent pas sa fréquence.</div>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r2">[réf.2]</button> · <button class="w" data-k="c70-r10">[réf.10]</button></p>
</section>
<section class="ilot" id="c70-3"><h2>Du tissu normal aux symptômes</h2>
<p>Les enveloppes méningées protègent le cerveau et la moelle. Une masse qui se développe à leur contact déplace d’abord les structures voisines ; ses conséquences varient selon la localisation et la réserve fonctionnelle. L’œdème vasogénique péritumoral ajoute du volume et peut aggraver un déficit sans que la masse tumorale elle-même ait augmenté dans les mêmes proportions.</p>
<table class="t"><thead><tr><th>Perturbation</th><th>Conséquence</th><th>Décision</th></tr></thead><tbody><tr><td>Compression du cortex ou des voies nerveuses</td><td>Parésie, trouble du langage, déficit sensitif ou visuel selon le territoire</td><td>Localiser cliniquement, puis confronter à l’imagerie.</td></tr><tr><td>Atteinte d’une région corticale</td><td>Crise épileptique pouvant révéler la lésion</td><td>Rechercher la lésion et traiter l’épilepsie lorsqu’elle est constituée.</td></tr><tr><td>Expansion et œdème</td><td>Céphalée, vomissements, signes d’hypertension intracrânienne</td><td>Évaluer rapidement la vigilance, les pupilles et l’imagerie.</td></tr><tr><td>Obstacle à l’écoulement du liquide cérébrospinal</td><td>Hydrocéphalie et risque d’engagement</td><td>Avis neurochirurgical urgent ; pas de ponction lombaire si hydrocéphalie obstructive.</td></tr><tr><td>Compression médullaire</td><td>Syndrome lésionnel et sous-lésionnel, troubles de la marche</td><td>Imagerie et prise en charge spécialisée urgentes.</td></tr></tbody></table>
<p>Les altérations moléculaires expliquent le comportement biologique, sans fournir une carte des symptômes. La perte de NF2 affecte la merline et la régulation de croissance ; TERT et la délétion homozygote de CDKN2A/B identifient un haut risque. Elles orientent le grade et le pronostic, tandis que l’examen clinique localise les conséquences de la tumeur.</p>
<button class="pareto-btn ui" data-k="pareto-c70-mecanisme">▲ Loi de Pareto — Mécanismes</button><p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r9">[réf.9]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-4"><h2>Causes et facteurs de risque</h2>
<p>Une irradiation ionisante antérieure de la tête et une prédisposition génétique, notamment la schwannomatose liée à NF2, augmentent le risque de méningiome. Un antécédent de radiothérapie, des tumeurs multiples, un début jeune ou une histoire familiale doivent être signalés. Ces éléments augmentent un risque général ; ils ne permettent pas de prédire le grade d’une tumeur individuelle.</p>
<p>La revue du traitement hormonal fait partie de l’anamnèse. La FI suisse d’Androcur-50 rapporte des méningiomes après une utilisation prolongée de cyprotérone à des doses ≥25 mg/j, avec un risque croissant selon l’exposition cumulée. Une présence ou un antécédent de méningiome constitue une contre-indication ; au diagnostic, le traitement doit être arrêté définitivement sous coordination du prescripteur.</p>
<p><button class="w" data-k="c70-hormones">Signal hormonal : attribuer le texte à sa juridiction</button></p>
<div class="key"><b>À retenir.</b> Une association hormonale ne démontre pas un grade malin. Consigner le nom du produit, la dose, la durée et l’exposition passée.</div>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r15">[réf.15]</button> · <button class="w" data-k="c70-r25">[réf.25]</button></p>
</section>
<section class="ilot" id="c70-5"><h2>Anamnèse : caractériser l’évolution</h2>
<p>Demander au patient et à ses proches ce qui a changé, depuis quand et à quelle vitesse. Une aggravation progressive, une récidive après traitement ou une croissance rapide sur des images comparatives modifient le niveau de suspicion. Rechercher des crises focales, leur généralisation éventuelle, les troubles visuels, l’odorat, le langage, l’audition, la marche et les changements cognitifs ou comportementaux.</p>
<table class="t"><thead><tr><th>Question ciblée</th><th>Ce qu’elle apporte</th></tr></thead><tbody><tr><td>Céphalée nouvelle, aggravation matinale, vomissements ?</td><td>Recherche d’un syndrome d’hypertension intracrânienne ; la céphalée seule reste peu spécifique.</td></tr><tr><td>Faiblesse, trouble du langage, de la sensibilité ou de la vision ?</td><td>Localisation probable de la structure atteinte et retentissement fonctionnel.</td></tr><tr><td>Douleur rachidienne ou radiculaire, gêne à la marche, trouble urinaire ?</td><td>Recherche d’une compression médullaire ou d’une atteinte méningée diffuse.</td></tr><tr><td>Oubli, ralentissement, changement de comportement selon l’entourage ?</td><td>Une plainte cognitive peut être minimisée par le patient ; elle influe sur la décision thérapeutique.</td></tr><tr><td>Cancer connu, irradiation, chirurgie et histologie antérieures ?</td><td>Métastase, récidive et tumeur radio-induite ne suivent pas le même raisonnement.</td></tr><tr><td>Progestatif, antiépileptique, corticoïde ou autre traitement ?</td><td>Repérage des facteurs de risque, des effets indésirables et des interactions.</td></tr></tbody></table>
<p>Documenter l’autonomie, les activités quotidiennes et les objectifs du patient. Les difficultés de mémoire, d’attention et des fonctions exécutives peuvent précéder ou suivre le traitement. Une amélioration du volume tumoral ne garantit pas une récupération cognitive complète.</p>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r2">[réf.2]</button> · <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-6"><h2>Examen clinique : localiser et mesurer le retentissement</h2>
<p>L’examen neurologique explore la vigilance, la cognition et le langage, puis la vision, l’audition, les mouvements, les réflexes, la sensibilité, l’équilibre et la coordination. Le CHUV place cette étape avant l’imagerie : chaque anomalie suggère la région à examiner, sans identifier à elle seule la nature tumorale.</p>
<p>Comparer les deux côtés, relever les capacités présentes et les difficultés concrètes, puis conserver une description reproductible pour le suivi. Rechercher une anomalie pupillaire, un œdème papillaire et une baisse de vigilance lorsqu’une hypertension intracrânienne est possible. Un trouble visuel évolutif impose une documentation adaptée et une confrontation à la localisation.</p>
<p>Dans la forme rachidienne, chercher une douleur radiculaire au niveau de la lésion, un niveau sensitif et des signes moteurs ou sensitifs sous-jacents. Une compression aiguë peut commencer par une paralysie flasque ; l’absence initiale d’hypertonie ne rassure pas. Les troubles sphinctériens peuvent être tardifs : attendre leur apparition expose à retarder le diagnostic.</p>
<div class="key"><b>À retenir.</b> L’examen normal n’exclut pas une tumeur méningée. Un examen anormal localise un retentissement ; le tissu détermine le type et le grade.</div>
<button class="pareto-btn ui" data-k="pareto-c70-clinique">▲ Loi de Pareto — Anamnèse et examen</button><p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>


<section class="ilot" id="c70-7"><h2>Démarche diagnostique et interprétation</h2>
<p>L’imagerie par résonance magnétique est l’examen principal pour une suspicion de méningiome. Elle décrit la localisation, les rapports avec le cerveau, les nerfs et les vaisseaux, l’œdème et l’effet de masse. Le scanner complète notamment l’analyse des calcifications et de l’os. Comparer aux examens antérieurs permet d’apprécier une croissance réelle.</p>
<p>Une base durale large, un rehaussement marqué et une queue durale soutiennent l’hypothèse de méningiome. Une hétérogénéité et un œdème important peuvent faire suspecter un grade supérieur, mais aucun de ces signes ne suffit à le prouver. Une queue durale est également visible dans des métastases ou d’autres lésions.</p>
<p>Le diagnostic définitif requiert généralement un prélèvement obtenu par résection ou biopsie. Le choix dépend de la sécurité du geste, de la localisation et de l’objectif de traitement. Le rapport précise l’histologie, le grade et les analyses moléculaires nécessaires. Une discordance entre l’évolution clinique, l’imagerie et un petit prélèvement impose une réévaluation spécialisée.</p>
<div class="key"><b>À retenir.</b> L’imagerie formule une hypothèse et prépare le geste ; l’examen anatomopathologique établit le diagnostic intégré.</div>
<p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r20">[réf.20]</button></p>
</section>
<section class="ilot" id="c70-8"><h2>Différentiel : une masse méningée a plusieurs explications</h2>
<p>Le tableau résume des indices à confronter au contexte et au tissu. Les signes radiologiques sont probabilistes ; leur absence ne supprime pas une hypothèse.</p>
<table class="t"><thead><tr><th>Hypothèse</th><th>Éléments utiles</th><th>Discrimination finale</th></tr></thead><tbody><tr><td>Méningiome</td><td>Masse extra-axiale à base durale ; calcification ou hyperostose possibles</td><td>Critères histologiques et moléculaires, et non taille seule.</td></tr><tr><td>Métastase durale</td><td>Cancer connu, lésions multiples ou destruction osseuse ; une queue durale reste possible</td><td>Bilan oncologique et histologie.</td></tr><tr><td>Métastase leptoméningée</td><td>Combinaison multifocale de nerfs crâniens, douleurs radiculaires, aréflexie ou troubles cognitifs</td><td>Imagerie du neuroaxe et examens spécialisés ; ponction uniquement après exclusion d’une contre-indication.</td></tr><tr><td>Tumeur fibreuse solitaire</td><td>Peut imiter une masse durale très vascularisée ; signal fibreux et érosion possibles</td><td>Fusion NAB2-STAT6 et marquage nucléaire STAT6 ; grading propre au SNC.</td></tr><tr><td>Lymphome dural</td><td>Lésion pouvant être très cellulaire avec restriction de diffusion</td><td>Analyse hématopathologique ; le traitement du méningiome ne s’y applique pas automatiquement.</td></tr><tr><td>Tumeur mélanocytaire primitive</td><td>Signal évoquant la mélanine possible, présentation nodulaire ou diffuse</td><td>Tissu et exclusion d’un mélanome cutané, oculaire ou systémique.</td></tr><tr><td>Lésion infectieuse ou inflammatoire</td><td>Tuberculose et autres processus peuvent épaissir la dure-mère</td><td>Terrain, imagerie et prélèvement ciblé ; ne pas attribuer toute masse à un cancer.</td></tr></tbody></table>
<p>Une tumeur mélanocytaire méningée primitive est une entité rare. L’IRM peut suggérer sa nature mais ne distingue pas sûrement primitif et secondaire, ni bénin et malin. Le bilan spécialisé recherche notamment une atteinte extracrânienne et une extension du neuroaxe. Une tumeur fibreuse solitaire requiert également une classification distincte ; un score de risque de sarcome extracrânien ne s’applique pas automatiquement au SNC.</p>
<p>Sources : <button class="w" data-k="c70-r16">[réf.16]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r20">[réf.20]</button> · <button class="w" data-k="c70-r21">[réf.21]</button></p>
</section>
<section class="ilot" id="c70-9"><h2>Urgences et complications</h2>
<p>Une dégradation de la vigilance, une anomalie pupillaire nouvelle, un déficit rapidement aggravé ou des signes de compression médullaire imposent une évaluation hospitalière immédiate. Stabiliser le patient et obtenir l’imagerie ne doivent pas attendre la confirmation histologique. L’équipe neurochirurgicale décide du traitement de l’effet de masse ou de l’hydrocéphalie.</p>
<table class="t"><thead><tr><th>Situation</th><th>Pourquoi elle menace</th><th>Conduite</th></tr></thead><tbody><tr><td>Ptosis et mydriase aréactive avec déficit opposé</td><td>Possibilité d’engagement temporal</td><td>Alerte immédiate, stabilisation et imagerie urgente.</td></tr><tr><td>Céphalée, vomissements et baisse de vigilance</td><td>Hypertension intracrânienne, hydrocéphalie ou autre complication</td><td>Imagerie et avis neurochirurgical sans délai.</td></tr><tr><td>Déficit aigu sur tumeur connue</td><td>Une hémorragie intratumorale ou une autre cause aiguë est possible</td><td>Évaluation urgente ; ne pas conclure à une simple progression lente.</td></tr><tr><td>Douleur radiculaire, niveau sensitif et déficit de marche</td><td>Compression médullaire avec risque de séquelles irréversibles</td><td>IRM et décision spécialisée urgentes.</td></tr><tr><td>Crise épileptique et récupération incomplète</td><td>Complication neurologique nécessitant évaluation immédiate</td><td>Prise en charge d’urgence selon le tableau ; le traitement oral d’entretien ne suffit pas à traiter un état de mal.</td></tr></tbody></table>
<p>Une hydrocéphalie obstructive contre-indique la ponction lombaire en raison du risque d’engagement. La dexaméthasone peut traiter l’œdème péritumoral, mais son délai d’action et son rôle symptomatique empêchent de la considérer comme l’unique réponse à une situation vitale.</p>
<div class="key"><b>À retenir.</b> En urgence, traiter les conséquences de la compression ; l’analyse du type tumoral se poursuit dès que la sécurité le permet.</div>
<p>Sources : <button class="w" data-k="c70-r13">[réf.13]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-10"><h2>Traitement : priorité au contrôle local et à la fonction</h2>
<p>Le tumor board réunit neurochirurgie, neuro-oncologie, neuroradiologie, neuropathologie et radio-oncologie. Il confronte le grade, le volume, la vitesse de croissance, les rapports anatomiques, les traitements précédents et les objectifs du patient. Pour le grade 3, l’EANO recommande une résection aussi complète que possible en sécurité, suivie d’une radiothérapie fractionnée.</p>
<p>La résection soulage l’effet de masse et fournit le tissu. Une radicalité qui provoquerait un déficit neurologique ou cognitif majeur peut être moins utile qu’une résection partielle planifiée suivie d’un traitement adapté. Les rapports aux sinus veineux, aux nerfs et aux structures fonctionnelles déterminent cette limite.</p>
<p><button class="w" data-k="c70-radiotherapie">Irradiation : recommandation et pratiques suisses</button></p>
<p>Pour un méningiome asymptomatique de croissance lente présumé de bas grade, une surveillance peut être adaptée. Cette stratégie ne doit pas être transposée sans discussion à une tumeur de grade 3. Une croissance rapide sous surveillance oblige à reconsidérer le diagnostic, y compris une métastase.</p>
<p>À la récidive, discuter une nouvelle chirurgie ou une irradiation si elle reste faisable. Les traitements systémiques et les radioligands sont des recours expérimentaux après épuisement des possibilités locales. EANO 2025 ne classe aucune cible moléculaire au niveau « prêt pour l’usage clinique courant » dans le méningiome ; une mutation ne suffit donc pas à transformer un médicament en standard.</p>
<p>Une tumeur mélanocytaire primitive ou une tumeur fibreuse solitaire maligne relève d’une discussion spécialisée propre à son type. Pour les formes mélanocytaires circonscrites, une résection complète sûre est recherchée ; une biopsie peut être préférable dans les formes diffuses. Les données de traitement systémique restent limitées à de petites séries.</p>

<section class="ilot" id="c70-11"><h2>Suivi, pronostic et qualité de vie</h2>
<p>Le pronostic dépend du grade, des marqueurs moléculaires, de la localisation, du résidu et des possibilités de traitement. Pour le grade 3, l’EANO recommande une IRM au moins tous les 3–6 mois selon la progression clinique. Un symptôme nouveau ou une aggravation fait avancer la réévaluation ; il ne faut pas attendre l’échéance programmée.</p>
<p>Le suivi mesure aussi les crises, la cognition, la fatigue, le sommeil, l’humeur, l’autonomie et les effets indésirables. Les atteintes cognitives peuvent persister malgré un bon contrôle radiologique. Le CHUV propose une neuroréhabilitation adaptée : physiothérapie, ergothérapie, logopédie et neuropsychologie selon les déficits.</p>
<p>Une réapparition des symptômes peut traduire récidive, œdème, complication du traitement ou effet médicamenteux. Les comparer au bilan de départ et aux images évite de confondre ces mécanismes. Les objectifs de soins et le soutien aux proches font partie de la décision, y compris lorsque les options antitumorales deviennent limitées.</p>
<div class="key"><b>À retenir.</b> Le contrôle du volume tumoral et la qualité de vie sont deux résultats à suivre. Le grade 3 requiert une surveillance rapprochée et individualisée.</div>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r9">[réf.9]</button></p>
</section>
<section class="ilot" id="c70-12"><h2>Situations particulières</h2>
<table class="t"><thead><tr><th>Situation</th><th>Adaptation du raisonnement</th></tr></thead><tbody><tr><td>Enfant ou adulte jeune</td><td>Rechercher une prédisposition selon l’histoire familiale, la multiplicité et l’histologie. Les propositions cIMPACT 8 sporadiques adultes ne sont pas validées pour l’enfant.</td></tr><tr><td>Schwannomatose liée à NF2 ou tumeur radio-induite</td><td>Biologie et risque particuliers ; ne pas appliquer sans discussion les nouveaux algorithmes moléculaires des formes sporadiques.</td></tr><tr><td>Grossesse</td><td>Des variations de taille des méningiomes sont décrites. La décision associe les spécialistes selon symptômes et urgence ; pas de calendrier universel de chirurgie ou d’irradiation déduit de ces observations.</td></tr><tr><td>Personne âgée</td><td>Considérer fragilité, autonomie, cognition et bénéfice fonctionnel. L’âge seul n’exclut pas une chirurgie de décompression, y compris pour une localisation spinale.</td></tr><tr><td>Insuffisance rénale</td><td>Adapter le lévétiracétam à la clairance selon sa FI ; un débit estimé ne se substitue pas silencieusement à la méthode du tableau.</td></tr><tr><td>Insuffisance hépatique sévère</td><td>La FI du lévétiracétam avertit que la créatinine peut sous-estimer l’atteinte rénale ; adaptation spécifique et vérification pharmaceutique.</td></tr><tr><td>Tumeur pigmentée ou méningée diffuse</td><td>Bilan du neuroaxe et exclusion d’un primitif extracrânien avant de conclure à une tumeur mélanocytaire primitive.</td></tr></tbody></table>
<p>Les posologies pédiatriques, les calendriers obstétricaux et les traitements systémiques rares ne sont pas extrapolés depuis les schémas adultes. Le risque immédiat de compression continue toutefois de guider l’orientation.</p>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r12">[réf.12]</button> · <button class="w" data-k="c70-r14">[réf.14]</button> · <button class="w" data-k="c70-r16">[réf.16]</button></p>
</section>
<section class="ilot" id="c70-13"><h2>Contexte suisse et repères de l’examen fédéral</h2>
<p>En Suisse, les diagnostics confirmés soumis à l’ordonnance sur l’enregistrement des maladies oncologiques doivent être déclarés au registre compétent dans les quatre semaines suivant la collecte. Avant 20 ans, le destinataire est le Registre du cancer de l’enfant ; autrement, il s’agit du registre cantonal de résidence. Certaines tumeurs bénignes du SNC sont aussi déclarables : déclaration et malignité ne sont pas synonymes. Une simple suspicion n’est pas soumise à déclaration selon la page ONEC consultée.</p>
<p>Le parcours repose sur le centre spécialisé, le tumor board et la réadaptation. La prise en charge financière d’une technique, l’aptitude à conduire, les prestations AI ou une éventuelle relation professionnelle se vérifient individuellement. Aucun remboursement automatique, durée d’interdiction de conduire ou droit à une prestation n’est déduit de C70. Les crises, les déficits et les effets sédatifs des traitements doivent être pris en compte avant la reprise d’activités à risque.</p>
<p>Les situations PROFILES 2017 « céphalée », « trouble de mémoire ou cognitif », « parésie/paralysie », « trouble sensitif » et « convulsion/crise » fournissent des entrées pédagogiques pertinentes. Leur rattachement à C70 dans cette leçon est une proposition clinique, et non une correspondance officielle entre PROFILES et CIM.</p>
<table class="t"><thead><tr><th>Après la conclusion clinique</th><th>Périmètre de la leçon</th></tr></thead><tbody><tr><td>C70.0</td><td>Tumeur maligne des méninges cérébrales.</td></tr><tr><td>C70.1</td><td>Tumeur maligne des méninges rachidiennes ; rechercher compression médullaire.</td></tr><tr><td>C70.9</td><td>Méninges sans localisation précisée ; préciser le siège dès que possible.</td></tr></tbody></table>
<p>La catégorie C70 décrit une topographie maligne et ne remplace pas le diagnostic histologique. Un méningiome n’est pas systématiquement malin ; les formes bénignes ou de comportement incertain exigent leur classification propre. Le périmètre présenté vient de CIM-10-GM allemande 2024 et du libellé français du dépôt, sans certification de facturation suisse 2026.</p>
<button class="pareto-btn ui" data-k="pareto-c70-federal">▲ Loi de Pareto — Raisonnement fédéral</button><p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r5">[réf.5]</button> · <button class="w" data-k="c70-r11">[réf.11]</button> · <button class="w" data-k="c70-r14">[réf.14]</button> · <button class="w" data-k="c70-r24">[réf.24]</button> · <button class="w" data-k="c70-r26">[réf.26]</button></p>
</section>
<section class="ilot" id="c70-14"><h2>Critères formels et paramètres décisifs</h2>
<div class="alert"><b>Diagnostic intégré de méningiome de grade 3.</b> Un méningiome est classé grade 3 si l’analyse adaptée montre une activité mitotique ≥12,5/mm² sur la surface requise, une anaplasie franche, une mutation oncogène du promoteur de TERT ou une délétion homozygote de CDKN2A/B. Les critères sont alternatifs ; une morphologie peu atypique n’annule pas un critère moléculaire. La suspicion radiologique reste distincte du diagnostic tissulaire.</div>
<div class="key"><b>Repères chiffrés.</b> Comptage mitotique sur 1,6 mm² ; 20 mitoses/1,6 mm² =12,5/mm². Surveillance du grade 3 au moins tous les 3–6 mois selon évolution. Exemple de pratique suisse d’irradiation :60 Gy/30 fractions, à personnaliser. Dexaméthasone orale et ampoules phosphatées ne sont pas interchangeables en mg sans vérification.</div>
<div class="quiz ui" id="c70-q1"><p><b>Cas 1.</b> Une masse durale croît rapidement avec œdème. Peut-on affirmer le grade 3 sur cette image ?</p>
<button data-ok="0">Oui, l’œdème prouve le grade.</button><button data-ok="1">Non : ces signes motivent un diagnostic tissulaire intégré.</button><p class="fb" hidden>Une croissance rapide et un œdème renforcent la suspicion, mais ne déterminent pas le type ni le grade. [réf.7, réf.20]</p>
</div>
<div class="quiz ui" id="c70-q2"><p><b>Cas 2.</b> Le prélèvement évoque un méningiome peu atypique mais porte une mutation oncogène du promoteur de TERT. Quelle interprétation ?</p>
<button data-ok="1">Grade 3 selon OMS 2021.</button><button data-ok="0">Grade 1 car l’aspect prime toujours.</button><p class="fb" hidden>Le promoteur de TERT oncogène est un critère moléculaire indépendant de grade 3. [réf.7, réf.8]</p>
</div>
<div class="quiz ui" id="c70-q3"><p><b>Cas 3.</b> Un patient n’a jamais eu de crise. Faut-il prescrire systématiquement un antiépileptique à cause du grade élevé ?</p>
<button data-ok="0">Oui, le grade suffit.</button><button data-ok="1">Non : pas de prophylaxie primaire systématique selon SNO/EANO.</button><p class="fb" hidden>Le grade et l’imagerie ne suffisent pas à justifier une prophylaxie primaire. La situation périopératoire garde une incertitude distincte. [réf.17]</p>
</div>
<div class="quiz ui" id="c70-q4"><p><b>Cas 4.</b> Une patiente présente un niveau sensitif et une marche qui se dégrade sans trouble sphinctérien. Que faire ?</p>
<button data-ok="0">Attendre les troubles urinaires.</button><button data-ok="1">Rechercher sans délai une compression médullaire.</button><p class="fb" hidden>Les troubles sphinctériens peuvent être tardifs. Le syndrome lésionnel et sous-lésionnel motive une imagerie urgente. [réf.19]</p>
</div>

</section>

<div class="panel" id="pE" hidden><div class="chap-body">
<section class="ilot" id="c70-e-1"><h2>Imagerie : répondre à des questions cliniques précises</h2>
<p>L’IRM recherche une masse extra-axiale, ses rapports avec le parenchyme, les voies du liquide et les structures neurovasculaires. L’analyse du rehaussement, de l’œdème et des examens comparatifs complète l’étude anatomique. Le scanner en fenêtre osseuse recherche hyperostose, calcifications et extension intraosseuse.</p>
<table class="t"><thead><tr><th>Examen ou séquence</th><th>Utilité et piège</th></tr></thead><tbody><tr><td>IRM avant et après contraste</td><td>Localisation, extension et rehaussement ; une queue durale soutient sans prouver le méningiome.</td></tr><tr><td>Séquences sensibles à l’œdème</td><td>Mesure du retentissement autour de la masse ; un grand œdème ne suffit pas à classer le grade.</td></tr><tr><td>Scanner osseux</td><td>Calcification et hyperostose orientent ; destruction osseuse fait aussi rechercher une métastase ou un simulateur.</td></tr><tr><td>Perfusion ou spectroscopie</td><td>Compléments dans des cas sélectionnés ; pas de seuil isolé suffisamment spécifique pour remplacer le tissu.</td></tr><tr><td>TEP dirigée vers les récepteurs de somatostatine</td><td>Peut aider lorsque l’extension ou la récidive est incertaine ; distinguer usage diagnostique et traitement radioligand expérimental.</td></tr><tr><td>IRM rachidienne ou du neuroaxe</td><td>Indiquée selon symptômes médullaires et suspicion d’une maladie diffuse ; ne pas limiter l’imagerie au crâne si la clinique est spinale.</td></tr></tbody></table>
<div class="key"><b>À retenir.</b> Le résultat doit modifier la localisation, le geste ou le suivi. Aucune séquence ne certifie seule le grade 3.</div>
<p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r16">[réf.16]</button> · <button class="w" data-k="c70-r19">[réf.19]</button> · <button class="w" data-k="c70-r20">[réf.20]</button></p>
</section>
<section class="ilot" id="c70-e-2"><h2>Prélèvement et diagnostic anatomopathologique</h2>
<p>La résection ou la biopsie procure le tissu qui distingue les types tumoraux. L’analyse confronte morphologie, activité mitotique, invasion et données moléculaires. Il faut prélever de façon représentative : TERT ou CDKN2A/B peuvent être limités aux régions les plus agressives, et un petit fragment peut sous-estimer le risque.</p>
<p><button class="w" data-k="c70-mitoses">Compter les mitoses : surface et calcul</button></p>
<p>L’invasion cérébrale requiert une infiltration à travers la limite piale vers le parenchyme. Une extension le long des espaces périvasculaires avec pie-mère intacte ne suffit pas. La fragmentation et les effets de cautérisation limitent l’interprétation ; une conclusion incertaine doit être explicitée.</p>
<p>Pour une tumeur fibreuse solitaire, la fusion NAB2-STAT6 et le marquage nucléaire STAT6 soutiennent le diagnostic. Pour une lésion mélanocytaire, le bilan cherche une origine extracrânienne ; le profil moléculaire complète la classification sans supprimer ce bilan.</p>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r9">[réf.9]</button> · <button class="w" data-k="c70-r16">[réf.16]</button> · <button class="w" data-k="c70-r21">[réf.21]</button></p>
</section>
<section class="ilot" id="c70-e-3"><h2>Biologie moléculaire : grade, pronostic ou cible ?</h2>
<table class="t"><thead><tr><th>Résultat</th><th>Interprétation</th><th>Limite</th></tr></thead><tbody><tr><td>Promoteur de TERT oncogène</td><td>Critère OMS 2021 de grade 3</td><td>Ne démontre pas l’efficacité d’un traitement ciblant TERT.</td></tr><tr><td>CDKN2A/B supprimé sur les deux copies</td><td>Critère OMS 2021 de grade 3</td><td>Une perte d’une seule copie n’est pas un critère officiel suffisant.</td></tr><tr><td>Perte de 1p avec 22q et/ou NF2</td><td>Proposition cIMPACT 8 de grade au moins 2 dans certains contextes</td><td>Guidance intérimaire non officielle ; préciser population et référentiel.</td></tr><tr><td>Profil de méthylation et variations de copies</td><td>Peuvent affiner le risque et aider une discordance</td><td>Ne pas transformer chaque résultat discordant en changement officiel de grade.</td></tr><tr><td>Altération NF2 ou voie mTOR</td><td>Pistes thérapeutiques à l’étude</td><td>EANO 2025 : niveau investigational, pas de standard prouvé.</td></tr></tbody></table>
<p>Le compte rendu précise la méthode, le prélèvement, sa représentativité et les altérations interrogées. Un test destiné au grade peut être pertinent dès le diagnostic ; le profilage destiné à un traitement de recours se discute surtout à la récidive et sur le tissu le plus récent disponible.</p>
<div class="key"><b>À retenir.</b> Une même analyse peut informer le grade, le pronostic ou une recherche thérapeutique. Ces fonctions ne sont pas interchangeables.</div>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r9">[réf.9]</button></p>
</section>
</div>

<div class="chap-body sci-body"><div class="sci" id="c70-s-semio" role="tabpanel" aria-labelledby="c70-tab-semio">
<section class="ilot" id="c70-semio-normal" data-semiology="normal"><h2>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h2>
<p>Le fonctionnement normal suppose une conduction préservée des voies motrices et sensitives, une activité corticale coordonnée et une circulation libre du liquide cérébrospinal. Les méninges entourent le tissu nerveux ; une lésion méningée peut donc agir sur une région voisine sans prendre naissance dans ce tissu. La topographie normale est le point de départ du raisonnement.</p>
<p>Une force et une sensibilité symétriques, un langage adapté et une marche stable fournissent des repères cliniques. La comparaison avec l’état antérieur est essentielle : une perte fonctionnelle nouvelle a plus de sens qu’une description isolée sans référence personnelle.</p>
<p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button> · <button class="w" data-k="c70-r22">[réf.22]</button> · <button class="w" data-k="c70-r23">[réf.23]</button></p>
</section>
<section class="ilot" id="c70-semio-signs" data-semiology="signs"><h2>Décrire le signe avant de l’interpréter</h2>
<p>Une parésie est une diminution de force ; préciser son côté, sa distribution, sa progression et son retentissement. Pour la céphalée, relever début, évolution, caractère matinal, vomissements et autres signes neurologiques. Pour la crise, documenter les manifestations observées, leur caractère focal et la récupération ; interroger un témoin si nécessaire.</p>
<p>Une perte de mémoire ou un changement de comportement doit être confronté au récit des proches. Dans la forme rachidienne, douleur radiculaire, niveau sensitif et difficulté de marche orientent davantage qu’une douleur diffuse seule. Ces signes ne déterminent jamais le grade malin.</p>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r2">[réf.2]</button> · <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-semio-mechanisms" data-semiology="mechanisms"><h2>Relier la perturbation au signe et à la décision</h2>
<table class="t"><thead><tr><th>Science normale</th><th>Perturbation</th><th>Signe et implication</th></tr></thead><tbody><tr><td>Les voies motrices transmettent une commande</td><td>Compression du cortex ou d’un faisceau</td><td>Parésie ; localiser par l’examen puis l’imagerie.</td></tr><tr><td>La fonction corticale dépend d’une activité organisée</td><td>Lésion d’une région corticale et œdème associé</td><td>Crise ; rechercher le foyer et les conséquences de la lésion.</td></tr><tr><td>Le liquide circule dans les voies ventriculaires et sous-arachnoïdiennes</td><td>Obstacle tumoral ou effet de masse</td><td>Hydrocéphalie et hypertension intracrânienne ; urgence si dégradation.</td></tr><tr><td>Les voies longues traversent la moelle</td><td>Compression avec atteinte radiculaire et sous-lésionnelle</td><td>Niveau sensitif et déficit ; ne pas attendre la rétention urinaire.</td></tr></tbody></table>
<p>La chaîne causale explique une conduite : l’imagerie doit rechercher la structure menacée, et non simplement confirmer qu’une tumeur existe. L’activité mitotique ou la mutation n’explique pas à elle seule le côté du déficit.</p>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button> · <button class="w" data-k="c70-r23">[réf.23]</button></p>
</section>
<section class="ilot" id="c70-semio-examination" data-semiology="examination"><h2>Observer et examiner de manière reproductible</h2>
<p>Commencer par la vigilance et la capacité de communiquer, puis examiner vision et pupilles, motricité, sensibilité, réflexes, coordination et équilibre selon la sécurité du patient. Décrire précisément ce qui a été observé et les conditions : coopération, douleur, fatigue ou traitement sédatif peuvent limiter l’interprétation.</p>
<p>En cas d’atteinte spinale suspecte, rechercher la limite supérieure d’une anomalie sensitive et comparer les réflexes au-dessus et au-dessous de la région suspectée. La marche s’évalue seulement si le patient peut la réaliser en sécurité. Un bilan neuropsychologique peut préciser mémoire, attention et fonctions exécutives lorsque la situation le permet.</p>
<p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-semio-interpretation" data-semiology="interpretation"><h2>Interpréter une présence et une absence</h2>
<p>Une triade céphalée-vomissements-œdème papillaire oriente vers l’hypertension intracrânienne ; elle n’est pas un test qui exclurait la maladie lorsqu’un élément manque. Une diplopie par atteinte du nerf abducens peut accompagner l’hypertension sans localiser la tumeur.</p>
<p>Une progression lente suggère un processus expansif mais n’en prouve pas la bénignité. Un déficit aigu impose d’autres hypothèses immédiates, dont une complication hémorragique. L’absence de trouble sphinctérien n’écarte pas une compression médullaire. Aucun seuil de sensibilité ou spécificité propre au méningiome grade 3 n’est revendiqué dans les lectures disponibles.</p>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-semio-differentials" data-semiology="differentials"><h2>Discriminer le syndrome et sa cause</h2>
<p>Un déficit focal avec masse durale peut venir d’un méningiome, d’une métastase ou d’un autre type tumoral. Le contexte de cancer et la destruction osseuse renforcent l’hypothèse métastatique ; une queue durale ne la supprime pas. Une atteinte multifocale de nerfs crâniens et de racines fait rechercher une maladie leptoméningée diffuse.</p>
<p>La tumeur fibreuse solitaire peut être aussi vascularisée qu’un méningiome ; le diagnostic repose sur la pathologie et STAT6. Une lésion mélanocytaire nécessite un bilan extracrânien. La sémiologie sélectionne les examens ; le diagnostic histologique définit le traitement.</p>
<p>Sources : <button class="w" data-k="c70-r16">[réf.16]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r20">[réf.20]</button> · <button class="w" data-k="c70-r21">[réf.21]</button></p>
</section>
<section class="ilot" id="c70-semio-urgency" data-semiology="urgency"><h2>Identifier le changement qui impose d’agir</h2>
<p>Une baisse de vigilance ou une nouvelle mydriase aréactive avec ptosis et déficit opposé font craindre un engagement. Une faiblesse rapidement progressive, un niveau sensitif et une marche qui se détériore font craindre une compression médullaire. Ces évolutions justifient imagerie et avis hospitalier urgents.</p>
<p>Ne pas pratiquer de ponction lombaire devant une hydrocéphalie obstructive. Un corticoïde ne remplace pas le traitement immédiat d’une situation menaçant la vie : la FI de l’ampoule rappelle un délai d’action et la nécessité de mesures complémentaires.</p>
<p>Sources : <button class="w" data-k="c70-r13">[réf.13]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-semio-limits" data-semiology="limits"><h2>Respecter la population et les incertitudes</h2>
<p>Les mécanismes généraux de compression s’appliquent au raisonnement, mais les fréquences de symptômes dépendent du siège, du grade et du mode de recrutement. Les données d’un centre sur tous les méningiomes ne deviennent pas des performances diagnostiques pour C70.</p>
<p>L’enfant, la tumeur radio-induite et la schwannomatose liée à NF2 nécessitent une interprétation propre. cIMPACT-NOW 8 est une recommandation intérimaire pour les formes sporadiques adultes ; elle ne constitue pas une nouvelle édition officielle OMS. La qualité du prélèvement et les analyses disponibles limitent le grade intégré.</p>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r16">[réf.16]</button></p>
</section>

<section class="ilot" id="c70-science-links-semio"><h3>Analyse clinique et parcours de décision</h3>
<p><b>Science → clinique.</b> La compression d’une voie explique une fonction perdue, tandis que la prolifération et les anomalies moléculaires expliquent un risque biologique. Les confronter évite d’attribuer le grade d’après la seule intensité des symptômes.</p>
<p><b>Science → examen.</b> Le niveau sensitif et la distribution du déficit orientent le champ de l’imagerie ; l’examen n’a pas pour fonction de distinguer à lui seul méningiome et métastase.</p>
<p><b>Science → traitement.</b> Une dégradation de la vigilance ou de la marche change le délai de prise en charge. Le traitement définitif sera ensuite adapté au tissu, aux structures menacées et à l’état général.</p>
<p><b>À retenir.</b> Décrire, localiser, expliquer, agir selon la menace, puis confirmer la nature de la lésion.</p>

<div class="sci" id="c70-s-anat" role="tabpanel" aria-labelledby="c70-tab-anat" hidden>
<section class="ilot" id="c70-s-anat-cours"><h2>Enveloppes, plans et limites chirurgicales</h2>
<p>La dure-mère se trouve sous l’os ; l’arachnoïde et la pie-mère constituent des plans distincts autour du cerveau. La pie-mère adhère au tissu nerveux, tandis que le liquide circule sous l’arachnoïde. La planche permet de suivre ces rapports, sans dessiner une tumeur fictive sur une anatomie normale.</p>
<figure><img src="assets/img/c70/alpha/codex/Gray1196.png" alt="Enveloppes crâniennes et sinus sagittal supérieur" loading="lazy"><figcaption>Enveloppes crâniennes et sinus sagittal supérieur. Original humain historique, Gray, <i>Anatomy of the Human Body</i>, 1918 ; Henry Vandyke Carter, domaine public. Pixels inchangés ; repères français adjacents.</figcaption>
<table class="t"><thead><tr><th>Repère visible dans l’original</th><th>Lecture française et implication</th></tr></thead><tbody><tr><td>Dura mater</td><td>La dure-mère se trouve sous l’os ; l’implantation durale oriente l’imagerie et le geste chirurgical.</td></tr><tr><td>Arachnoid</td><td>L’arachnoïde est distincte de la dure-mère ; les méningiomes dérivent de cellules arachnoïdiennes.</td></tr><tr><td>Pia mater</td><td>La pie-mère épouse la surface cérébrale. Le franchissement vers le parenchyme intervient dans l’évaluation de l’invasion.</td></tr><tr><td>Superior sagittal sinus</td><td>Le sinus sagittal supérieur est une structure veineuse voisine de la faux. Sa proximité limite parfois une résection sûre.</td></tr></tbody></table>
</figure>
<p>L’implantation durale et la proximité des voies veineuses expliquent que l’exérèse complète ne soit pas toujours sûre. L’invasion cérébrale n’est pas simplement le contact avec le cerveau : le critère exige un franchissement de la barrière piale vers le parenchyme. Dans le rachis, une tumeur méningée peut comprimer des voies longues dans un espace limité.</p>
<figure><img src="assets/img/c70/alpha/codex/Gray764.png" alt="Voie motrice du cortex vers la moelle" loading="lazy"><figcaption>Voie motrice du cortex vers la moelle. Original humain historique, Gray, <i>Anatomy of the Human Body</i>, 1918 ; Henry Vandyke Carter, domaine public. Pixels inchangés ; repères français adjacents.</figcaption>
<table class="t"><thead><tr><th>Repère visible dans l’original</th><th>Lecture française et implication</th></tr></thead><tbody><tr><td>Motor area of cortex</td><td>Le cortex moteur commande les mouvements volontaires ; sa compression peut provoquer une parésie.</td></tr><tr><td>Internal capsule</td><td>Les fibres descendent dans la capsule interne. Cette planche représente un trajet normal simplifié.</td></tr><tr><td>Decussation of pyramids</td><td>La majorité des fibres croisent dans la partie basse du tronc cérébral ; le côté du déficit dépend du niveau de l’atteinte.</td></tr><tr><td>Lateral cerebrospinal fasciculus</td><td>Le faisceau corticospinal latéral descend dans la moelle ; une compression médullaire associe déficit et signes pyramidaux sous la lésion.</td></tr></tbody></table>
</figure>
<div class="key"><b>À retenir.</b> La localisation prédit les fonctions menacées ; l’analyse tissulaire distingue contact, extension périvasculaire et invasion.</div>

</section>
<section class="ilot" id="c70-science-links-anat"><h3>Rapports normaux et sécurité du geste</h3>
<p><b>Science → clinique.</b> Les plans méningés rendent compte d’une masse extra-axiale qui refoule le cerveau. La tumeur spinale menace des voies motrices et sensitives dans un espace limité ; la distribution des signes vient de ces rapports.</p>
<p><b>Science → examen.</b> L’IRM étudie le contact avec le tissu, les nerfs et les vaisseaux ; le scanner précise les modifications de l’os. L’analyse tissulaire apprécie séparément le franchissement pial.</p>
<p><b>Science → traitement.</b> La proximité d’un sinus ou d’une fonction essentielle peut limiter l’exérèse. Une résection partielle planifiée pour préserver la fonction reste différente d’une absence de traitement.</p>
<p><b>À retenir.</b> L’original historique montre le normal ; il ne représente ni le volume ni l’invasion d’une tumeur individuelle.</p>

<div class="sci" id="c70-s-histo" role="tabpanel" aria-labelledby="c70-tab-histo" hidden>
<section class="ilot" id="c70-s-histo-cours"><h2>Prolifération, morphologie et échantillonnage</h2>
<p>La mitose est une division cellulaire visible au microscope. Sa densité renseigne sur la prolifération, mais doit être mesurée sur une surface standard et dans la région la plus active. Le passage d’un nombre par champ à un nombre par millimètre carré évite de confondre activité biologique et taille du champ du microscope.</p>
<table class="t"><thead><tr><th>Comptage sur 1,6 mm²</th><th>Densité calculée</th><th>Lecture</th></tr></thead><tbody><tr><td>4 mitoses</td><td>4÷ 1,6=2,5/mm²</td><td>Seuil mitotique du grade 2.</td></tr><tr><td>20 mitoses</td><td>20÷ 1,6=12,5/mm²</td><td>Seuil mitotique du grade 3.</td></tr></tbody></table>
<p>Une anaplasie franche est un critère alternatif de grade 3. L’invasion cérébrale doit être distinguée d’un simple trajet périvasculaire. L’échantillonnage, l’orientation et les artéfacts de cautérisation peuvent rendre l’analyse difficile. Le compte rendu doit expliciter l’incertitude plutôt que donner une précision artificielle.</p>
<div class="key"><b>À retenir.</b> Le résultat du laboratoire dépend autant de la méthode et du prélèvement que de la valeur affichée.</div>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button></p>
</section>
<section class="ilot" id="c70-science-links-histo"><h3>Du prélèvement à une décision fiable</h3>
<p><b>Science → clinique.</b> Une prolifération forte augmente la suspicion d’une évolution agressive, mais le comportement dépend aussi du contexte moléculaire. Un résultat de faible activité sur un petit fragment ne doit pas neutraliser une évolution clinique discordante.</p>
<p><b>Science → examen.</b> Le laboratoire recherche les zones les plus actives et rapporte une surface de comptage. Un microscope à champ plus large ne nécessite pas le même nombre de champs pour obtenir 1,6 mm². La qualité des coupes, l’orientation et les artéfacts doivent être connus pour interpréter un résultat incertain.</p>
<p><b>Science → traitement.</b> Le grade intégré guide le contrôle local. L’EANO recommande résection sûre et irradiation fractionnée dans le grade 3 ; une apparence papillaire ou rhabdoïde isolée ne suffit plus à décider ce grade dans OMS 2021.</p>
<p><b>À retenir.</b> Une valeur mitotique est une mesure liée à une méthode et à une surface. Son interprétation gagne en fiabilité lorsqu’elle est confrontée à la morphologie, à l’invasion et aux marqueurs moléculaires.</p>

<div class="sci" id="c70-s-physio" role="tabpanel" aria-labelledby="c70-tab-physio" hidden>
<section class="ilot" id="c70-s-physio-cours"><h2>Volume intracrânien, liquide et conduction</h2>
<p>Le tissu nerveux fonctionne dans un environnement anatomique contraint. La tumeur et l’œdème augmentent le volume occupé, compriment des structures et peuvent gêner la circulation du liquide cérébrospinal. Le lien clinique est progressif : perturbation de circulation, hydrocéphalie, hypertension intracrânienne, puis risque d’engagement si la compensation devient insuffisante.</p>
<p>La moelle associe des voies longues motrices et sensitives. Le faisceau corticospinal croise dans la moelle allongée puis descend latéralement ; certaines voies sensitives croisent à des niveaux différents. Une compression peut donc produire un syndrome lésionnel radiculaire et un syndrome sous-lésionnel dont la distribution aide à localiser le niveau.</p>
<p>Une décompression peut améliorer la fonction, mais une lésion prolongée peut laisser un déficit irréversible. Le rythme de dégradation détermine l’urgence ; la taille radiologique isolée ne mesure pas toute la menace fonctionnelle.</p>
<div class="key"><b>À retenir.</b> L’effet sur le liquide et les voies nerveuses relie la science normale aux décisions d’urgence.</div>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button> · <button class="w" data-k="c70-r23">[réf.23]</button></p>
</section>
<section class="ilot" id="c70-science-links-physio"><h3>Retentissement fonctionnel et évolution</h3>
<p><b>Science → clinique.</b> La céphalée, les vomissements et l’œdème papillaire peuvent traduire une hypertension intracrânienne. Une diplopie par atteinte du nerf abducens peut l’accompagner sans donner le siège de la tumeur. Un déficit dépend aussi de la structure comprimée et de l’œdème, et ne quantifie pas à lui seul la malignité.</p>
<p><b>Science → examen.</b> La localisation clinique sélectionne l’imagerie utile. La recherche d’un obstacle à l’écoulement du liquide est décisive, car une hydrocéphalie obstructive contre-indique la ponction lombaire. Dans le rachis, décrire le niveau et le syndrome sous-lésionnel est plus informatif que relever seulement une douleur.</p>
<p><b>Science → traitement.</b> Le contrôle de l’œdème, la décompression ou le traitement d’une hydrocéphalie répondent à des mécanismes différents. La réévaluation de la fonction complète la mesure du volume sur l’IRM ; une récupération incomplète peut motiver une réadaptation ciblée.</p>
<p><b>À retenir.</b> Une lésion anatomiquement limitée peut avoir des conséquences importantes si elle atteint un passage étroit ou une fonction essentielle.</p>

<div class="sci" id="c70-s-immuno" role="tabpanel" aria-labelledby="c70-tab-immuno" hidden>
<section class="ilot" id="c70-s-immuno-cours"><h2>Œdème, corticoïdes et immunothérapie</h2>
<p>Les glucocorticoïdes modifient la synthèse de protéines et réduisent des médiateurs inflammatoires. La FI de dexaméthasone décrit notamment l’induction de lipocortine 1 et l’inhibition de cytokines et d’enzymes pro-inflammatoires. En neuro-oncologie, leur effet symptomatique porte surtout sur l’œdème péritumoral ; ils ne constituent pas un traitement curatif du méningiome.</p>
<p>Cette action explique aussi des risques : immunosuppression, infections masquées ou réactivées, troubles métaboliques et suppression de l’axe corticotrope. La durée, la dose et le terrain déterminent la surveillance ; la diminution doit être organisée lorsque l’état permet de réduire le traitement.</p>
<p>L’immunothérapie antitumorale vise d’autres mécanismes, notamment les points de contrôle immunitaires. EANO 2025 constate des données insuffisantes pour une sélection courante par PD-L1 dans le méningiome. Les essais ou programmes prospectifs de recours sont distincts d’un standard établi.</p>
<div class="key"><b>À retenir.</b> Réduire un œdème et contrôler une tumeur sont deux objectifs différents ; leurs bénéfices et risques ne se confondent pas.</div>
<p>Sources : <button class="w" data-k="c70-r9">[réf.9]</button> · <button class="w" data-k="c70-r12">[réf.12]</button> · <button class="w" data-k="c70-r13">[réf.13]</button> · <button class="w" data-k="c70-r18">[réf.18]</button></p>
</section>
<section class="ilot" id="c70-science-links-immuno"><h3>Évaluer le bénéfice et la toxicité</h3>
<p><b>Science → clinique.</b> Un effet sur l’œdème peut améliorer des symptômes sans détruire la tumeur. À l’inverse, une fatigue, un trouble de l’humeur ou une infection pendant le traitement ne doivent pas être attribués automatiquement à une progression tumorale ; la prescription fait partie du diagnostic différentiel de l’aggravation.</p>
<p><b>Science → examen.</b> L’examen clinique, les signes infectieux et la surveillance métabolique adaptée permettent de confronter bénéfice neurologique et toxicité. Une infection peut être masquée par le corticoïde. L’effet dépend de la dose, de la durée et du terrain ; la seule présence d’un œdème radiologique ne décrit pas toute la balance bénéfice-risque.</p>
<p><b>Science → traitement.</b> La dose minimale nécessaire et la diminution organisée se discutent selon l’évolution. La suppression de l’axe corticotrope explique pourquoi un traitement prolongé ne doit pas être interrompu brutalement. Les immunothérapies de recours répondent à un autre objectif et ne remplacent pas cette prise en charge symptomatique.</p>
<p><b>À retenir.</b> Suivre les conséquences attendues et les effets indésirables du mécanisme est indispensable pour réévaluer le traitement.</p>

<div class="sci" id="c70-s-bio" role="tabpanel" aria-labelledby="c70-tab-bio" hidden>
<section class="ilot" id="c70-s-bio-cours"><h2>Freins de croissance, cycle cellulaire et grade</h2>
<p>NF2 code la merline, une protéine participant à l’inhibition de contact et à la régulation de plusieurs voies de signalisation. Sa perte perturbe des freins de croissance et peut favoriser l’activation de voies telles que mTOR. Cette compréhension mécanistique nourrit des essais thérapeutiques ; elle ne démontre pas, à elle seule, leur efficacité clinique.</p>
<p>CDKN2A et CDKN2B codent des régulateurs du cycle cellulaire. Leur perte homozygote s’associe à un risque défavorable et constitue un critère de grade 3. TERT intervient dans la télomérase ; les mutations oncogènes de son promoteur sont associées à un cours agressif et suffisent également au grade 3. La valeur pronostique ne signifie pas qu’une thérapie ciblée efficace existe pour chaque anomalie.</p>
<p>Les profils de méthylation et les pertes chromosomiques renseignent sur des groupes biologiques. Les propositions intérimaires concernant 1p/NF2 doivent rester séparées des critères officiels OMS 2021. EANO 2025 distingue le test pour grade/prognostic du test destiné à un traitement de recours.</p>
<div class="key"><b>À retenir.</b> Un mécanisme explique un risque et une piste de recherche ; une recommandation clinique requiert des preuves d’efficacité propres à la maladie.</div>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r9">[réf.9]</button></p>
</section>
<section class="ilot" id="c70-science-links-bio"><h3>De la biologie au compte rendu intégré</h3>
<p><b>Science → clinique.</b> Les marqueurs de haut risque permettent de reconnaître une tumeur agressive même lorsque le prélèvement paraît peu atypique. Ils n’indiquent pas quel symptôme devrait être présent : la topographie, l’œdème et l’état fonctionnel restent nécessaires pour comprendre le patient.</p>
<p><b>Science → examen.</b> Sélectionner un fragment représentatif est essentiel parce qu’une altération peut être limitée à un sous-clone plus agressif. Le compte rendu doit nommer la méthode et sa couverture, préciser la qualité du matériel et distinguer une variante oncogène d’un résultat incertain.</p>
<p><b>Science → traitement.</b> L’existence d’une voie activée ne garantit pas un bénéfice d’un inhibiteur. EANO 2025 réserve les approches ciblées de recours aux situations spécialisées après réévaluation des options locales ; la discussion d’un essai reconnaît cette incertitude.</p>
<p><b>À retenir.</b> Le diagnostic intégré établit le risque ; la preuve thérapeutique détermine ce qui peut être proposé en routine.</p>

<div class="panel" id="pP" hidden><div class="chap-body">
<section class="ilot" id="c70-p-1"><h2>Pharmacologie : traiter les symptômes sans promettre un contrôle tumoral</h2>
<p>La chirurgie et l’irradiation constituent le socle du traitement du méningiome malin. Les médicaments détaillés ici répondent à des complications : dexaméthasone pour l’œdème cérébral et lévétiracétam pour une épilepsie selon son indication. Le choix est individualisé ; aucun de ces schémas n’est une prescription autonome pour une tumeur simplement codée C70.</p>
<p>SNO/EANO 2021 déconseille une prophylaxie antiépileptique primaire systématique chez le patient n’ayant jamais eu de crise. Les preuves périopératoires sont insuffisantes pour une recommandation générale distincte. Un grade élevé ou un œdème ne justifie pas automatiquement un traitement préventif.</p>
<div class="key"><b>À retenir.</b> Distinguer traitement d’une épilepsie, prévention non établie et traitement antitumoral.</div>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r9">[réf.9]</button> · <button class="w" data-k="c70-r17">[réf.17]</button></p>
</section>
<section class="ilot" id="c70-p-2"><h2>Dexaméthasone orale : produit et objectif exacts</h2>
<p><button class="w" data-k="c70-dexamethasone">Dexaméthasone Galepharm comprimés : indication, dose et surveillance</button></p>
<p>Le bénéfice recherché est une diminution de l’œdème et du retentissement neurologique. Une réponse au corticoïde ne confirme pas le diagnostic de méningiome. La dose doit être réévaluée et réduite lorsque la situation le permet ; un arrêt brutal après exposition prolongée peut provoquer une insuffisance surrénalienne.</p>
<table class="t"><thead><tr><th>FI comprimés, janvier 2022</th><th>Schéma décrit pour l’œdème cérébral</th></tr></thead><tbody><tr><td>Relais oral après amélioration d’un tableau grave</td><td>4–16 mg par jour, individualisés.</td></tr><tr><td>Tableaux plus légers</td><td>2–8 mg par jour peuvent suffire.</td></tr><tr><td>Répartition</td><td>Possibilité de 2–4 prises quotidiennes pour l’œdème.</td></tr><tr><td>Durée et diminution</td><td>Selon évolution ; diminution progressive prescrite, pas calendrier universel.</td></tr></tbody></table>
<p>Sources : <button class="w" data-k="c70-r12">[réf.12]</button> · <button class="w" data-k="c70-r18">[réf.18]</button></p>
</section>
<section class="ilot" id="c70-p-3"><h2>Dexaméthasone injectable : attention à la quantité exprimée</h2>
<p><b>La FI distingue le phosphate et la base.</b> Une ampoule Galepharm Amp 4 mg/1 ml contient 4 mg de dexamethasoni dihydrogenophosphas, correspondant à 3,32 mg de dexaméthasone ; l’ampoule 8 mg/2 ml correspond à 6,64 mg de base. Une ampoule étiquetée 4 mg n’est donc pas une preuve d’équivalence en masse avec un comprimé 4 mg.</p>
<p><button class="w" data-k="c70-dexa-iv">Galepharm Amp : vérifier la prescription et le relais</button></p>
<div class="key"><b>À retenir.</b> Toujours lire la quantité de principe actif et sa forme chimique. Vérifier l’équivalence lors de tout changement de présentation.</div>
<p>Sources : <button class="w" data-k="c70-r12">[réf.12]</button> · <button class="w" data-k="c70-r13">[réf.13]</button></p>
</section>
<section class="ilot" id="c70-p-4"><h2>Lévétiracétam : épilepsie et adaptation rénale</h2>
<p><button class="w" data-k="c70-levetiracetam">Lévétiracétam Sandoz oral : produit exact et limites</button></p>
<p>Le lévétiracétam est éliminé principalement par voie rénale. La FI demande une estimation de clairance de créatinine, puis une indexation à 1,73 m² pour utiliser son tableau. Une valeur de débit glomérulaire fournie par le laboratoire ne doit pas être substituée sans vérifier méthode et unité.</p>
<table class="t"><thead><tr><th>Clairance FI, ml/min/1,73 m²</th><th>Dose d’entretien adulte/adolescent≥16 ans, poids>50 kg</th></tr></thead><tbody><tr><td>>80</td><td>500–1500 mg deux fois/j.</td></tr><tr><td>50–79</td><td>500–1000 mg deux fois/j.</td></tr><tr><td>30–49</td><td>250–750 mg deux fois/j.</td></tr><tr><td><30</td><td>250–500 mg deux fois/j.</td></tr><tr><td>Dialyse</td><td>500–1000 mg une fois/j ; supplément 250–500 mg après dialyse. La FI propose 750 mg le premier jour.</td></tr></tbody></table>
<p>Le tableau FI affiche «>80» puis «50–79» ; il ne classe pas explicitement une valeur exactement égale à 80. Ce point doit être vérifié avec la pharmacie, sans inventer un arrondi. En insuffisance hépatique sévère avec clairance<60 ml/min/1,73 m², la FI recommande de réduire de moitié l’entretien journalier ; elle avertit que la créatinine peut sous-estimer l’atteinte rénale.</p>
<p><button class="w" data-k="c70-clairance">Méthode de clairance dans la FI</button></p>
<p>Sources : <button class="w" data-k="c70-r14">[réf.14]</button> · <button class="w" data-k="c70-r17">[réf.17]</button></p>
</section>
<section class="ilot" id="c70-p-5"><h2>Recours oncologiques et prévention médicamenteuse</h2>
<p>EANO 2025 considère les traitements systémiques et les radioligands comme expérimentaux dans le méningiome, après épuisement des possibilités locales. Les données favorables de petites séries ne prouvent pas un bénéfice standard. Le profil moléculaire, l’éligibilité à un essai et les conditions réglementaires suisses se discutent en centre expert ; aucune dose non vérifiée de traitement de recours n’est proposée.</p>
<p>La revue des expositions médicamenteuses a une autre finalité : éviter de poursuivre un produit contre-indiqué. La FI d’Androcur-50 demande un arrêt définitif au diagnostic de méningiome. Les alertes européennes sur d’autres progestatifs restent attribuées à leur source et appellent la vérification de la FI suisse du produit exact.</p>
<div class="alert"><b>Diagnostic et médicament.</b> Un antiépileptique traite une épilepsie selon son indication ; le corticoïde traite l’œdème. Aucun des deux ne prouve un type histologique et aucun ne remplace la chirurgie ou l’irradiation du grade 3.</div>
<div class="key"><b>Paramètres de prescription.</b> Dexaméthasone orale :dose et durée individualisées. Ampoule 4 mg phosphate=3,32 mg base. Lévétiracétam oral chez l’adulte de plus de 40 kg : jusqu’à 1500 mg deux fois/j selon indication et fonction rénale. Toute substitution de forme exige une vérification explicite.</div>

</section>

<template data-pop="c70-grading" data-title="OMS 2021 et cIMPACT-NOW 8 : distinguer les règles"><h3>OMS 2021 et cIMPACT-NOW 8 : distinguer les règles</h3>
<p>Les mutations oncogènes du promoteur de TERT et la délétion homozygote de CDKN2A/B sont des critères officiels de grade 3 dans OMS 2021. Une délétion hémizygote de CDKN2A/B ne suffit pas.</p>
<p>cIMPACT-NOW update 8, publié en 2024 avec collection 2025, apporte une guidance intérimaire non officielle OMS. Il propose notamment un grade au moins 2 pour certaines tumeurs avec perte de 1p associée à une perte de 22q et/ou une altération oncogène de NF2. Sa proposition concernant l’invasion cérébrale isolée et les marqueurs moléculaires n’efface pas la règle OMS 2021. Le rapport anatomopathologique doit préciser le référentiel utilisé.</p>
<p>Ces propositions reposent principalement sur les méningiomes sporadiques adultes ; elles ne s’extrapolent pas directement à l’enfant, aux tumeurs radio-induites ou associées à une schwannomatose liée à NF2.</p>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button></p>
</template>
<template data-pop="pareto-c70-mecanisme" data-title="Mécanismes"><h3>Mécanismes</h3>
<p>Compression et œdème produisent les déficits ; obstruction du liquide produit l’hydrocéphalie ; les marqueurs moléculaires établissent un risque biologique sans localiser les signes.</p>
</template>
<template data-pop="c70-hormones" data-title="Signal hormonal : attribuer le texte à sa juridiction"><h3>Signal hormonal : attribuer le texte à sa juridiction</h3>
<p>La FI suisse Androcur-50, juin 2022, constitue la référence locale pour ce produit. Les associations concernent les méningiomes en général, sans preuve propre au grade 3.</p>
<p>Le PRAC de l’EMA a adopté en juillet 2026 une recommandation de modification du libellé pour désogestrel/étonogestrel. Une étude cas-témoins de méningiomes intracrâniens opérés rapporte un odds ratio de 1,3 après un usage actuel ≥1 an de désogestrel 75 µg et de 2,1 à partir de 7 ans. Un odds ratio ne mesure pas une incidence annuelle. Ce texte européen ne prouve pas sa transposition dans chaque FI suisse ; vérifier le produit exact et organiser une alternative contraceptive avec le prescripteur.</p>
<p>Sources : <button class="w" data-k="c70-r15">[réf.15]</button> · <button class="w" data-k="c70-r25">[réf.25]</button></p>
</template>
<template data-pop="pareto-c70-clinique" data-title="Anamnèse et examen"><h3>Anamnèse et examen</h3>
<p>Préciser le temps, localiser le déficit et rechercher une urgence. Interroger les proches sur cognition et comportement ; ne pas attendre les troubles sphinctériens devant une compression possible.</p>
</template>
<template data-pop="c70-radiotherapie" data-title="Irradiation : recommandation et pratiques suisses"><h3>Irradiation : recommandation et pratiques suisses</h3>
<p>L’EANO 2021 recommande une irradiation fractionnée après résection du grade 3. L’enquête de dix centres suisses publiée en 2022, avec arbres de décision validés en 2020, trouve un accord de tous les centres pour l’indication postopératoire du grade III. Un schéma de 60 Gy en 30 fractions de 2 Gy y est fréquent. Il s’agit de pratiques déclarées, pas d’un essai comparatif ni d’une directive nationale actuelle.</p>
<p>Le plan individuel dépend du résidu, de la localisation, des organes à risque et d’une irradiation antérieure. Les doses ne se déduisent pas du code C70. Une ligne de l’enquête associe 59,4 Gy et 30×1,8 Gy de manière incohérente ; elle n’est pas reprise comme consigne.</p>
<p>Au PSI, les méningiomes atypiques ou malins peuvent être évalués pour protonthérapie, notamment lorsque des doses élevées doivent épargner des structures sensibles. La protonthérapie n’est pas automatiquement supérieure pour chaque patient ; la sélection et la prise en charge suivent le processus du centre.</p>
<p>Sources : <button class="w" data-k="c70-r5">[réf.5]</button> · <button class="w" data-k="c70-r6">[réf.6]</button> · <button class="w" data-k="c70-r7">[réf.7]</button></p>
</template>
<template data-pop="pareto-c70-traitement" data-title="Traitement"><h3>Traitement</h3>
<p>Grade 3 : résection maximale sûre et irradiation fractionnée. À la récidive, réévaluer les possibilités locales ; recours moléculaires et radioligands restent expérimentaux.</p>
</template>
<template data-pop="pareto-c70-federal" data-title="Raisonnement fédéral"><h3>Raisonnement fédéral</h3>
<p>D’abord reconnaître une urgence et localiser ; ensuite distinguer méningiome, métastase et autres tumeurs méningées ; enfin obtenir le diagnostic intégré et proposer le contrôle local en centre expert.</p>
</template>
<template data-pop="c70-mitoses" data-title="Compter les mitoses : surface et calcul"><h3>Compter les mitoses : surface et calcul</h3>
<p>Le comptage s’effectue dans la région la plus proliférative sur des coupes de bonne qualité. Dix champs de 0,16 mm² représentent 1,6 mm². Avec 20 mitoses dans cette surface :20÷ 1,6=12,5 mitoses/mm², seuil de grade 3. Quatre mitoses sur 1,6 mm² correspondent à 2,5/mm², seuil mitotique du grade 2.</p>
<p>La surface réelle d’un champ dépend du microscope ; les appareils récents peuvent avoir des champs de 0,23–0,24 mm². Le nombre de champs doit être ajusté. Une extrapolation à partir d’une surface inférieure à 1,6 mm² ne convient pas pour attribuer le grade.</p>
<p>Sources : <button class="w" data-k="c70-r8">[réf.8]</button></p>
</template>
<template data-pop="c70-dexamethasone" data-title="Dexaméthasone Galepharm comprimés : indication, dose et surveillance"><h3>Dexaméthasone Galepharm comprimés : indication, dose et surveillance</h3>
<p>FI suisse, janvier 2022 : comprimés sécables à 1 mg ou 4 mg de dexaméthasone. L’œdème cérébral lié à une tumeur est une indication. Après amélioration d’un tableau sévère traité initialement par voie intraveineuse, la FI décrit un relais oral de 4–16 mg/j ; dans des tableaux plus légers,2–8 mg/j peuvent suffire. La dose est adaptée à l’état et à sa réponse ; elle peut être fractionnée en 2–4 prises pour l’œdème.</p>
<p>Prendre après les repas avec du liquide, sans croquer. Réduire progressivement dès que possible. Il n’existe pas de durée universelle pour tout méningiome ; une durée ou un maximum issus d’une autre indication ne doivent pas être importés. Le schéma de diminution est prescrit selon la durée, la dose et le contrôle clinique.</p>
<p>Surveiller notamment glycémie, pression artérielle, signes infectieux, état psychique, potassium et effets musculaires selon terrain et durée. Risques de mycose ou infection latente, diabète mal équilibré, ulcère, ostéoporose ou maladie psychiatrique appellent une évaluation spécifique. Les inhibiteurs ou inducteurs du CYP3A4 et les anti-inflammatoires non stéroïdiens peuvent modifier le risque ; vérifier l’ensemble de la prescription.</p>
<p>Sources : <button class="w" data-k="c70-r12">[réf.12]</button></p>
</template>
<template data-pop="c70-dexa-iv" data-title="Galepharm Amp : vérifier la prescription et le relais"><h3>Galepharm Amp : vérifier la prescription et le relais</h3>
<p>Une ampoule Galepharm Amp 4 mg/1 ml contient 4 mg de phosphate correspondant à 3,32 mg de dexaméthasone ; celle de 8 mg/2 ml correspond à 6,64 mg de base. Ne pas convertir silencieusement vers les comprimés.</p>
<p>FI suisse, juin 2022. Pour les œdèmes subaigus ou chroniques, notamment tumoraux, la rubrique posologie décrit 8–12 mg IV initialement puis 4 mg IV ou IM toutes les 6 heures. Ces valeurs sont rapportées telles qu’elles apparaissent dans la FI du produit phosphaté. La prescription doit préciser produit, forme, unité et quantité ; le relais oral demande une vérification de l’expression phosphate/base par l’équipe et la pharmacie.</p>
<p>La dose élevée décrite dans la FI pour d’autres œdèmes cérébraux aigus n’est pas transposée ici au méningiome. L’administration parentérale est réservée aux situations où elle est nécessaire. L’effet maximal peut demander 1–2 heures ; une situation vitale nécessite des mesures immédiates complémentaires. Dès contrôle de la phase aiguë, réduire et organiser le relais selon évolution.</p>
<p>Aucune conversion silencieuse en nombre de comprimés ou d’ampoules n’est fournie. L’absence d’un schéma universel de durée reflète la nécessité d’une prescription individualisée, et non une invitation à poursuivre sans réévaluation.</p>
<p>Sources : <button class="w" data-k="c70-r13">[réf.13]</button> · <button class="w" data-k="c70-r12">[réf.12]</button></p>
</template>
<template data-pop="c70-levetiracetam" data-title="Lévétiracétam Sandoz oral : produit exact et limites"><h3>Lévétiracétam Sandoz oral : produit exact et limites</h3>
<p>FI suisse, avril 2023, autorisation 62088 : comprimés 250/500/1000 mg et solution 100 mg/ml. Monothérapie des crises focales avec ou sans généralisation secondaire à partir de 16 ans ; les indications en association et limites d’âge sont distinctes. Le schéma adulte n’est pas transposé automatiquement à l’enfant.</p>
<p>Chez l’adulte âgé d’au moins 18 ans et pesant plus de 40 kg, la dose initiale décrite est 500 mg deux fois par jour. Une dose initiale de 250 mg deux fois par jour peut être choisie selon tolérance/efficacité, puis augmentée à 500 mg deux fois par jour après deux semaines. Maximum décrit 1500 mg deux fois par jour ; paliers de 250 ou 500 mg deux fois par jour toutes les 2–4 semaines selon réponse. Il s’agit d’un traitement oral d’entretien, pas d’un traitement d’urgence d’un état de mal.</p>
<p>Les risques fréquents incluent somnolence, fatigue et étourdissements ; surveiller les modifications de comportement, l’agressivité, la dépression et les idées suicidaires. La conduite et les machines demandent une évaluation individuelle, surtout au début et après augmentation. Ne pas arrêter soudainement. Grossesse : conseil spécialisé, surveillance et réévaluation, sans arrêt brutal.</p>
<p>Sources : <button class="w" data-k="c70-r14">[réf.14]</button></p>
</template>
<template data-pop="c70-clairance" data-title="Méthode de clairance dans la FI"><h3>Méthode de clairance dans la FI</h3>
<p>La FI estime la clairance en ml/min par la formule :[(140−âge en années)×poids en kg]/[72×créatinine sérique en mg/dl], avec un facteur 0,85 pour la femme. Puis clairance indexée=clairance absolue÷surface corporelle en m²×1,73. Les unités doivent être respectées ; une créatinine en µmol/l ne peut pas être insérée telle quelle dans cette formule. La méthode ne remplace pas un avis adapté aux situations où l’estimation est peu fiable.</p>
<p>Sources : <button class="w" data-k="c70-r14">[réf.14]</button></p>
</template>
<template data-pop="pareto-c70-pharmaco" data-title="Pharmacologie"><h3>Pharmacologie</h3>
<p>Vérifier l’objectif, le produit, la forme et la fonction rénale. Éviter prophylaxie primaire systématique et équivalence implicite phosphate/base ; aucun traitement systémique du méningiome n’est présenté comme standard.</p>
