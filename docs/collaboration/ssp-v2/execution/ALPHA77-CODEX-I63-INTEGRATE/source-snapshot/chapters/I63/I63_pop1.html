<template data-pop="i63-ait" data-title="Accident ischémique transitoire : définition et urgence"><p>Un AIT tissulaire correspond à un déficit neurologique focal transitoire sans lésion ischémique en diffusion dans le référentiel bernois 2026. Une lésion concordante en diffusion documente un infarctus malgré la récupération. La définition historique « moins de 24 heures » ne tranche pas ce point tissulaire.</p><p>La récupération n’exclut ni récidive précoce ni mécanisme traitable. La filière suisse prévoit une évaluation urgente, avec imagerie, recherche d’occlusion ou sténose et bilan cardiaque selon contexte. Un score pronostique ne remplace pas cette évaluation.</p><div class="key"><b>À retenir.</b> Un déficit résolu reste une urgence ; le classement dépend de la lésion et du contexte.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 19 : définitions AIT</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : urgence si symptômes transitoires</a>.</p></template>
<template data-pop="i63-heure" data-title="Dernière heure sans déficit"><p>Le témoin précise la dernière fois où la personne avait son état neurologique habituel. L’heure de découverte est consignée séparément. Chez une personne vue normale au coucher puis symptomatique au réveil, le début est inconnu ; le réveil n’est pas un début observé.</p><p>Ce raisonnement détermine le cadre temporel. Les informations professionnelles des produits de thrombolyse utilisent le dernier moment sans symptômes ; la sélection par imagerie en début inconnu est une décision spécialisée distincte de la fenêtre autorisée.</p><div class="key"><b>À retenir.</b> Un horaire inventé à partir de l’heure de découverte peut exposer à une thrombolyse hors cadre sans justification.</div><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : onset et last seen well</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indication AVC et fenêtre</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indication AVC et fenêtre</a>.</p><p><button class="w" data-k="i63-filiere-suisse">Lire le triage et le transfert selon la filière suisse</button>.</p></template>
<template data-pop="i63-penombre" data-title="Noyau, pénombre et collatérales"><p>Le noyau estimé correspond au volume que la méthode classe comme fortement lésé ; la région hypoperfusée peut être plus vaste. La différence et le rapport de volumes servent à sélectionner certaines populations. Ces valeurs sont des estimations d’imagerie et ne constituent pas une mesure histologique directe de chaque cellule.</p><p>Le débit résiduel, les collatérales et les conditions locales influencent la viabilité. Les critères tardifs d’altéplase européens 2021 associent noyau &lt;70 mL, rapport &gt;1,2 et différence &gt;10 mL, avec méthode précisée et thrombectomie non prévue. Une sélection différente peut être utilisée pour un geste endovasculaire.</p><div class="key"><b>À retenir.</b> La même durée d’évolution n’implique pas le même tissu restant viable.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1 et note des critères</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), Critères tardifs d’imagerie</a> ; <a href="https://doi.org/10.1002/ana.25147" target="_blank" rel="noopener" data-reference-source="1">Dreier et coll. — Terminal spreading depolarization and electrical silence in death of human cerebral cortex (2018 ; DOI 10.1002/ana.25147), Discussion « Terminal SD » : perfusion et réversibilité</a>.</p></template>
<template data-pop="i63-etiologie" data-title="Attribution étiologique de l’infarctus"><p>L’attribution repose sur la distribution des lésions, l’imagerie artérielle, le rythme et l’évaluation cardiaque. Les catégories artérielle, cardioembolique, petites artères, autre cause et indéterminée structurent le bilan. Plusieurs causes plausibles peuvent empêcher une attribution unique.</p><p>Une lésion de plusieurs territoires fait rechercher notamment une source cardiaque, aortique ou systémique. Une petite lésion profonde ne suffit pas à exclure une embolie. Les investigations spécialisées sont guidées par l’âge, les signes et l’histoire ; le résultat doit pouvoir modifier le traitement.</p><div class="key"><b>À retenir.</b> La preuve de la cause est distincte de la preuve de l’infarctus.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20–23 : TOAST/ASCOD et workup</a>.</p></template>
<template data-pop="i63-aphasie" data-title="Aphasie, dysarthrie et examen du langage"><p>L’aphasie est un trouble du langage ; la dysarthrie concerne l’articulation. Le NIHSS distingue les deux domaines : le langage se teste par la description d’une scène, la dénomination, la lecture et la compréhension au cours de l’examen ; l’articulation se juge sur la production de mots.</p><p>Le déficit du bras, la vision, la compréhension et le niveau de conscience peuvent perturber la performance ; ils doivent être pris en compte. Une aphasie empêchant les activités habituelles peut être invalidante malgré un faible score total. L’examen recherche les fonctions associées et la concordance anatomique.</p><div class="key"><b>À retenir.</b> Une parole difficile ne prouve pas une aphasie ; une aphasie peu cotée n’est pas automatiquement sans handicap.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 53 et 62–63 : systèmes fonctionnels, NIHSS langage et dysarthrie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 9.1 : déficit invalidant</a>.</p></template>
<template data-pop="i63-ataxie" data-title="Ataxie : coordination et marche"><p>Le NIHSS examine l’incoordination par les épreuves doigt–nez et talon–genou ; la faiblesse ou un trouble de compréhension peut empêcher l’interprétation. Une ataxie est jugée au-delà de ce que la seule faiblesse explique. Le test n’est pas converti automatiquement en atteinte cérébelleuse lorsque le membre est paralysé.</p><p>Un vertige soudain accompagné d’une impossibilité de marcher ou de signes visuels, moteurs ou du tronc cérébral peut correspondre à un accident vasculaire cérébral postérieur. L’examen se déroule en sécurité et l’imagerie vasculaire est sélectionnée sans conclure à une cause vestibulaire bénigne sur un score global faible.</p><div class="key"><b>À retenir.</b> La coordination et la sécurité de la marche apportent des informations que le déficit du bras ne résume pas.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 62–63 : item ataxie</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : vertige/incapacité de marche et posterior stroke</a>.</p></template>
<template data-pop="i63-negligence" data-title="Négligence et extinction"><p>L’évaluation NIHSS recherche une extinction lors de stimulations simultanées et une inattention dans plusieurs modalités. Une asymétrie peut concerner l’espace, la perception du corps ou l’attention. Elle est confrontée à la vision, à la sensibilité et à la compréhension ; une cécité d’un côté n’est pas automatiquement une extinction.</p><p>Le comportement peut faire sous-estimer le déficit par la personne elle-même. L’examen moteur et les observations des proches complètent donc la parole du patient. La localisation reste vérifiée par l’imagerie.</p><div class="key"><b>À retenir.</b> La négligence est un trouble d’attention observé ; elle ne se réduit pas à une faiblesse ou une perte du champ visuel.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 62–63 : item extinction/inattention et p. 53 : fonctions</a>.</p></template>
<template data-pop="i63-nihss" data-title="NIHSS : score clinique et limites"><p>Le score neurologique National Institutes of Health Stroke Scale décrit onze domaines avec plusieurs sous-items. Chaque ligne ci-dessous présente ses degrés et le test concerné. Il s’agit d’une gradation de déficit, pas d’un intervalle biologique de normalité.</p><table class="t"><thead><tr><th>Domaine</th><th>Points et critères reformulés</th><th>Conditions de lecture</th></tr></thead><tbody><tr><td>Vigilance</td><td>0 : éveillé ; 1 : répond à une stimulation légère ; 2 : stimulations répétées ou douloureuses nécessaires ; 3 : seules postures réflexes ou aucune réponse.</td><td>Observer la réponse, sans attribuer une cause à partir du seul item.</td></tr><tr><td>Questions : mois et âge</td><td>0 : deux réponses correctes ; 1 : une ; 2 : aucune ou aphasie.</td><td>Anarthrie ou intubation : 1 dans la grille ; coma : 2.</td></tr><tr><td>Commandes : yeux et main non parétique</td><td>0 : deux exécutées ; 1 : une ; 2 : aucune.</td><td>L’incompréhension et les limitations sont documentées.</td></tr><tr><td>Regard</td><td>0 : normal ; 1 : paralysie partielle ou déviation pouvant être dépassée ; 2 : déviation forcée.</td><td>La grille prévoit des modalités pour non-coopération et coma.</td></tr><tr><td>Champ visuel</td><td>0 : pas de perte ; 1 : hémianopsie partielle ; 2 : complète ; 3 : bilatérale.</td><td>En cas d’aphasie, examiner les réactions ; ne pas inventer une mesure manquante.</td></tr><tr><td>Face</td><td>0 : normale ; 1 : asymétrie mineure ; 2 : paralysie partielle, surtout face inférieure ; 3 : paralysie complète supérieure et inférieure.</td><td>Le coma a une cotation prévue par la grille.</td></tr><tr><td>Bras, chaque côté ; maintien 10 secondes</td><td>0 : maintien ; 1 : dérive sans appui avant le terme ; 2 : effort contre la pesanteur mais chute ; 3 : aucun effort antigravitaire ; 4 : aucun mouvement volontaire.</td><td>Les deux côtés sont cotés séparément.</td></tr><tr><td>Jambe, chaque côté ; maintien 5 secondes</td><td>0 : maintien ; 1 : dérive sans appui avant le terme ; 2 : effort mais chute ; 3 : aucun effort antigravitaire ; 4 : aucun mouvement volontaire.</td><td>Les deux côtés sont cotés séparément.</td></tr><tr><td>Ataxie des membres</td><td>0 : absente ; 1 : un membre ; 2 : deux membres.</td><td>Une paralysie, l’aphasie ou le coma limitent l’évaluation ; suivre les consignes de la grille.</td></tr><tr><td>Sensibilité</td><td>0 : normale ; 1 : perte légère à modérée, contact encore perçu ; 2 : perte sévère ou totale.</td><td>Bilatéralité, coma et aphasie ont des modalités précisées dans le référentiel.</td></tr><tr><td>Langage</td><td>0 : pas d’aphasie ; 1 : difficulté légère à modérée sans limitation majeure des idées ; 2 : communication fragmentaire sévèrement limitée ; 3 : mutisme ou aphasie globale.</td><td>La compréhension, la dénomination et la production sont examinées.</td></tr><tr><td>Dysarthrie</td><td>0 : articulation normale ; 1 : difficile mais compréhensible ; 2 : articulation incompréhensible ou mutisme selon consignes.</td><td>L’articulation et le langage ne sont pas le même domaine.</td></tr><tr><td>Extinction et inattention</td><td>0 : absentes ; 1 : une modalité ; 2 : plusieurs modalités ou hémi-inattention profonde.</td><td>Tester les deux côtés et les modalités pertinentes.</td></tr></tbody></table><p>Le total additionne les sous-items, notamment chaque bras et chaque jambe, jusqu’à 42 points. Exemple fictif : un bras coté 2 et le langage coté 1, avec tous les autres sous-items à 0, donnent 2 + 1 = 3. Ce total ne décrit pas à lui seul la perte d’autonomie ni le territoire. Zéro signifie absence de déficit détecté par ces items ; certains infarctus postérieurs ou autres déficits restent possibles. Une aphasie invalidante peut justifier une évaluation de reperfusion malgré un total faible.</p><p>La cotation doit suivre la grille complète et la formation de l’examinateur, avec ses règles d’items non évaluables. Cette fenêtre enseigne les degrés ; elle n’autorise pas une cotation approximative d’un patient inconscient ou empêché par une autre cause. Répéter l’examen aide à reconnaître une modification, avec l’imagerie et les signes.</p><p class="src">Référence : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau bernois 08/2026, p. 62–63, grille neurologique et consignes ; p. 10, déficit invalidant</a>.</p></template>
<template data-pop="i63-rankin" data-title="Rankin modifiée : autonomie"><p>L’échelle de Rankin modifiée décrit l’autonomie après l’infarctus. Le tableau sépare ses sept degrés.</p><table class="t"><tr><th>Degré</th><th>Autonomie ou état</th></tr><tr><td>0</td><td>Aucun symptôme.</td></tr><tr><td>1</td><td>Symptômes sans handicap significatif.</td></tr><tr><td>2</td><td>Handicap léger ; autonomie pour les affaires courantes.</td></tr><tr><td>3</td><td>Aide nécessaire, mais marche sans assistance.</td></tr><tr><td>4</td><td>Marche sans aide et soins corporels sans assistance impossibles.</td></tr><tr><td>5</td><td>Alitement, incontinence et soins permanents.</td></tr><tr><td>6</td><td>Décès.</td></tr></table><p>Le degré 3 conserve une marche sans assistance, contrairement au degré 4. L’état antérieur et le moment du suivi permettent de comparer les résultats.</p><p>Elle mesure l’autonomie globale ; elle ne remplace ni l’examen neurologique détaillé ni l’évaluation cognitive. L’état antérieur est consigné pour interpréter l’évolution. Dans les études, le moment de mesure et la dichotomisation choisie influencent la lecture d’un résultat.</p><div class="key"><b>À retenir.</b> Un résultat de traitement doit préciser l’échelle, le seuil et le moment de suivi.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 61 : Modified Rankin Scale</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Efficacité clinique : AcT, mRS 0–1 à 90–120 jours</a>.</p></template>
<template data-pop="i63-pression" data-title="Pression artérielle : objectifs distincts"><p>Le tableau compare les objectifs aigus et chroniques. Le résultat de la reperfusion et les autres urgences déterminent quelle ligne s’applique.</p><table class="t"><thead><tr><th>Contexte</th><th>Repère actuel vérifié</th><th>Limite</th></tr></thead><tbody><tr><td>Avant thrombolyse</td><td>&lt;185/110 mmHg.</td><td>information professionnelle et mise à jour européenne publiée en 2026.</td></tr><tr><td>Après thrombolyse</td><td>&lt;180/105 mmHg, premières 24 h.</td><td>La baisse excessive est évitée.</td></tr><tr><td>Pendant/après thrombectomie</td><td>&lt;180/105 mmHg et pas de chute excessive.</td><td>Après succès, pas d’abaissement actif sous 140 mmHg pendant les 24 h.</td></tr><tr><td>Sans reperfusion</td><td>Pas de baisse systématique si &lt;220/110 mmHg pendant 24 h ; si &gt;220/120 mmHg, consensus pour baisse prudente &lt;15 %.</td><td>Autres urgences ou comorbidités peuvent modifier la conduite ; le traitement n’est pas automatique entre les seuils.</td></tr><tr><td>Prévention au long cours</td><td>Généralement &lt;130/80 mmHg.</td><td>Adaptation à la fragilité, tolérance et perfusion.</td></tr></tbody></table><p>L’actualisation européenne déconseille également la poursuite systématique de tous les anciens antihypertenseurs en phase aiguë. Une dysphagie empêche la poursuite orale jusqu’à sécurisation de la voie. Le protocole et le contexte clinique guident les modifications.</p><div class="key"><b>À retenir.</b> Un objectif chronique ne se copie pas pendant l’ischémie aiguë.</div><p class="src">Références : <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11, PICO 2–6 et consensus</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Précautions tensionnelles</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Précautions tensionnelles</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Objectif tensionnel au long cours</a>.</p><p><button class="w" data-k="i63-calcul-reduction">Refaire le calcul d’une baisse tensionnelle en pourcentage</button>.</p></template>
<template data-pop="i63-imagerie" data-title="Lire l’imagerie de l’accident vasculaire cérébral"><p>La séquence FLAIR correspond à « Fluid-attenuated inversion recovery », soit une récupération par inversion avec atténuation du signal liquidien. Elle supprime le signal du liquide cérébrospinal pour faciliter la lecture des lésions cérébrales. Le nom désigne la séquence ; sa comparaison avec la diffusion ne date pas exactement la lésion.</p><p>La lecture distingue le sang, la lésion, l’occlusion et la perfusion. Le scanner ou la résonance est sélectionné sans retard selon la filière ; l’angiographie examine les artères, et la perfusion ou diffusion/suppression du liquide cérébrospinal répond à la sélection tardive ou au début inconnu.</p><p>Une lésion en diffusion compatible avec le syndrome soutient l’infarctus. Une discordance diffusion/suppression du liquide cérébrospinal peut sélectionner certains patients, sans dater exactement la lésion. L’estimation du noyau et du mismatch utilise les critères et le logiciel du protocole ; un seuil isolé provenant d’un essai ne suffit pas à décider de tous les traitements.</p><div class="key"><b>À retenir.</b> Le médecin demande une réponse explicite à chacune des questions, puis la relie au déficit et au traitement possible.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 7–10 et 19</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1 et 4.1</a>.</p><p class="src">Définition et sélection : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll., recommandation suisse 2021, tableau 1 et légende de la figure 2 : nom de la séquence et discordance avec la diffusion</a>.</p></template>
<template data-pop="i63-deglutition" data-title="Déglutition : sécurité de la voie orale"><p>Une dysphagie, une vigilance réduite, une atteinte faciale ou certaines anomalies neurologiques justifient une évaluation clinique structurée dans le protocole bernois. L’endoscopie fonctionnelle est envisagée notamment en cas de suspicion persistante ou d’atteinte du tronc cérébral.</p><p>L’équipe adapte aliments, liquides, nutrition et médicaments au résultat. Une forme orale ne doit pas être écrasée sans vérification de son information professionnelle : Aspirine Cardio gastro-résistant ne doit pas l’être ; Eliquis peut être écrasé et administré selon les modalités précises de son information professionnelle, y compris par sonde dans certains contextes.</p><div class="key"><b>À retenir.</b> La décision de voie dépend à la fois de la déglutition et de la préparation pharmaceutique.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 14 : GUSS, FEES et nutrition</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Mode d’administration gastro-résistant</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Mode d’administration, écrasement et sonde</a>.</p></template>
<template data-pop="i63-fibrillation" data-title="Rythme et source cardiaque"><p>Une fibrillation atriale documentée peut expliquer une embolie et modifier la prévention. Le protocole bernois associe électrocardiogramme à douze dérivations, au moins 72 heures de surveillance continue et sélection d’un enregistrement plus long selon le risque. Une mesure ponctuelle normale ne suffit pas à exclure un trouble intermittent.</p><p>L’évaluation cardiaque est choisie selon le profil et la distribution des lésions. L’anticoagulation pour fibrillation atriale non valvulaire est distincte du traitement d’une valve mécanique, d’une sténose mitrale rhumatismale ou d’une embolie de source indéterminée. L’apixaban ne doit pas être prescrit simplement parce que la distribution paraît embolique.</p><div class="key"><b>À retenir.</b> La preuve rythmique et l’imagerie causalement cohérente guident le traitement.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 21–23 et 34–35</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Pas d’anticoagulant direct pour embolie de source indéterminée</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Indications FA et valves artificielles</a>.</p></template>
<template data-pop="i63-carotide" data-title="Sténose carotidienne symptomatique"><p>Une sténose est attribuée à l’infarctus lorsqu’elle concorde avec le territoire et qu’une autre cause n’explique pas mieux l’événement. Le protocole bernois décrit la discussion des sténoses symptomatiques à partir de 50 %, avec choix entre traitement médical et geste selon degré, anatomie, risque et situation.</p><p>La décision de revascularisation se prend précocement avec les spécialistes ; le protocole mentionne une réalisation dans les jours suivant l’événement chez les patients retenus. Cela ne signifie pas que toute sténose de 50 % impose une opération. Le traitement lipidique et les facteurs de risque restent nécessaires.</p><div class="key"><b>À retenir.</b> La concordance territoriale et la sélection du patient précèdent la décision de geste.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 24 : symptomatic stenosis, seuil et board ; p. 40 : lipides</a>.</p></template>
<template data-pop="i63-dissection" data-title="Dissection cervicale"><p>Une douleur cervicale, un traumatisme, un syndrome de Horner ou une atteinte artérielle chez un sujet jeune font rechercher une dissection. L’imagerie vasculaire précise l’artère et la lésion ; le diagnostic n’est pas établi par la seule douleur.</p><p>Le protocole bernois discute antiagrégant ou anticoagulation selon le cas et distingue la dissection intracrânienne, où le risque d’hémorragie sous-arachnoïdienne rend l’anticoagulation relativement contre-indiquée. Les décisions spécialisées, les produits et les utilisations hors cadre de l’information professionnelle sont documentés individuellement.</p><div class="key"><b>À retenir.</b> La localisation de la dissection modifie le risque ; une stratégie cervicale ne s’applique pas automatiquement à une lésion intracrânienne.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20 et 25 : indices et conduite</a>.</p></template>
<template data-pop="i63-oedeme" data-title="Infarctus malin et décompression"><p>Un grand infarctus peut entraîner un œdème avec effet de masse, altération de vigilance et compression. Le protocole bernois situe la période critique souvent entre 24 et 96 heures et recommande une discussion précoce de craniectomie, parfois dans les 24–48 heures, avant une détérioration majeure.</p><p>Le protocole bernois précise les éléments de la décision. Les signes d’hypertension intracrânienne sont une baisse de vigilance, une anomalie pupillaire, une aggravation du déficit, une nouvelle parésie homolatérale ou un trouble du rythme respiratoire. Un infarctus couvrant plus des deux tiers du territoire de l’artère cérébrale moyenne, ou un grand infarctus sous-tentoriel, justifie une surveillance rapprochée et un scanner précoce, par exemple vers la douzième heure, afin de planifier une décompression préventive plutôt qu’un sauvetage tardif.</p><table class="t"><thead><tr><th>Infarctus sylvien malin selon le protocole bernois</th><th>Critères</th></tr></thead><tbody><tr><td>Indications habituelles de craniectomie</td><td>Âge généralement inférieur à 60 ans, discussion individuelle au-delà ; début depuis moins de 48 heures ; infarctus d’au moins la moitié du territoire de l’artère cérébrale moyenne ; consentement du patient ou des proches ; hémisphère dominant ou non indifférent.</td></tr><tr><td>Contre-indications</td><td>Pupilles fixes bilatérales et coma ; plus de trois facteurs défavorables parmi âge &gt;50 ans, extension au-delà du territoire sylvien, mydriase unilatérale et score de Glasgow &lt;8 ; comorbidité ou handicap antérieur sévères.</td></tr><tr><td>Infarctus cérébelleux</td><td>Grand infarctus sous-tentoriel, par exemple territoire complet de l’artère cérébelleuse postéro-inférieure, effet de masse progressif à l’imagerie rapprochée, consentement ; abstention si le tronc est irréversiblement détruit.</td></tr></tbody></table><p>Ces critères se comprennent par la mécanique : le crâne est une boîte rigide, si bien qu’un œdème volumineux déplace le cerveau et comprime le tronc. L’ouverture osseuse donne au tissu gonflé la place de se dilater sans écraser les structures vitales ; elle sauve donc la vie mais ne restaure pas le tissu déjà infarci, d’où la discussion du handicap résiduel acceptable avec le patient et ses proches.</p><p>La taille, l’âge, le handicap antérieur et le résultat fonctionnel attendu sont discutés individuellement. Chez le patient plus âgé, l’objectif et la dépendance potentielle doivent être explicités. Un infarctus cérébelleux avec hydrocéphalie ou compression du tronc peut nécessiter une décompression urgente avec prise en charge neurochirurgicale.</p><div class="key"><b>À retenir.</b> L’avis précoce vise à anticiper une dégradation ; il ne justifie pas une intervention sur un seuil isolé sans discussion.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 17 : infarctus sylvien malin et cérébelleux, signes d’hypertension intracrânienne, indications et contre-indications de la craniectomie</a>.</p></template>
<template data-pop="i63-reperfusion" data-title="Reperfusion : choisir et attribuer le cadre"><p>La thrombolyse pharmacologique et la thrombectomie endovasculaire visent la restauration du flux. Lorsque les deux sont indiquées, la thrombolyse ne doit pas être différée pendant l’organisation du geste, ni servir de motif pour attendre une amélioration avant le transfert.</p><p>Le cadre de l’information professionnelle des produits présentés est de 4,5 heures ; les sélections tardives ou au réveil décrites dans les recommandations cliniques reposent sur une imagerie et des populations spécifiques, et peuvent être hors indication. La thrombectomie peut être retenue en délai tardif sélectionné, avec une décision propre au territoire et au centre.</p><p>L’occlusion basilaire possède un référentiel européen actualisé en 2024 : la gravité et l’extension tissulaire influencent le bénéfice attendu, qui ne se transpose pas uniformément aux NIHSS &lt;10. Un symptôme postérieur reste urgent même si le score paraît faible.</p><h3>Sélections du guide national suisse de 2021</h3><p>Ces repères décrivent les tableaux 1 à 6 de Michel et collègues. Ils permettent de comprendre les sélections étudiées ; ils ne remplacent ni les évolutions ultérieures ni l’information professionnelle suisse du produit.</p><table class="t"><tr><th>Situation du guide national suisse 2021</th><th>Critère enseigné</th><th>Limite</th></tr><tr><td>Indication générale, tableau 2</td><td>Déficit nouveau invalidant ; occlusion proximale ou symptômes fluctuants peuvent modifier la discussion d’un déficit non invalidant.</td><td>Handicap antérieur majeur, très mauvaise qualité de vie ou espérance de vie &lt;3 mois demandent une décision individualisée.</td></tr><tr><td>Mismatch de perfusion, tableau 1</td><td>Rapport &gt;1,8 ; certaines études utilisent &gt;1,2.</td><td>Seuils non validés pour la circulation postérieure ; population et logiciel importent.</td></tr><tr><td>Mismatch clinique–imagerie, tableau 1</td><td>NIHSS ≥10 et noyau ≤30 mL ; ou NIHSS ≥20 et noyau 31–50 mL.</td><td>Le déficit estime la pénombre ; ces critères ne sont pas interchangeables avec les volumes de perfusion.</td></tr><tr><td>Mismatch diffusion–<button class="w" data-k="i63-imagerie">FLAIR</button>, tableau 1</td><td>Lésion aiguë en diffusion non visible en <button class="w" data-k="i63-imagerie">FLAIR</button>.</td><td>Repère de durée courte, pas mesure directe de pénombre ; applicable aussi au territoire postérieur dans ce texte.</td></tr><tr><td>Thrombolyse précoce, tableau 3</td><td>Début &lt;4,5 heures ; le texte 2021 discute au maximum 5 heures.</td><td>La fenêtre des produits suisses présentés reste 4,5 heures ; preuve d’occlusion et perfusion ne sont pas nécessaires à la sélection précoce.</td></tr><tr><td>Thrombectomie précoce, tableau 4</td><td>Début &lt;8 heures ; pour l’artère cérébrale moyenne, généralement ASPECTS ≥6 ou volume en diffusion &lt;100 mL.</td><td>Occlusion intracrânienne accessible ; les cas limites demandent imagerie, territoire et centre.</td></tr><tr><td>Thrombectomie tardive ou début inconnu, tableau 5</td><td>8–24 heures depuis le dernier état normal ; noyau supratentoriel généralement &lt;70 mL et mismatch clinique ou radiologique.</td><td>Le guide envisage certains cas plus tardifs ; cette plage n’est pas un délai d’attente.</td></tr><tr><td>Thrombolyse au réveil par résonance, tableau 6</td><td>Mismatch diffusion–<button class="w" data-k="i63-imagerie">FLAIR</button> ; lésion en diffusion généralement &lt;70 mL.</td><td>Le texte 2021 ne fixe pas de limite supérieure avec cette sélection ; emploi hors fenêtre des FI suisses et décision spécialisée.</td></tr><tr><td>Thrombolyse tardive par perfusion, tableau 6</td><td>Jusqu’à 9 heures depuis le milieu de l’intervalle entre dernier état normal et découverte ; noyau généralement &lt;30 mL et mismatch.</td><td>Dans ce texte, si les critères de thrombectomie tardive sont remplis, thrombectomie directe sans thrombolyse.</td></tr></table><p>Le protocole bernois d’août 2026 utilise d’autres branches selon artère, délai, ASPECTS, collatérales et mismatch. Il envisage notamment certaines occlusions proximales entre 4,5 et 11 heures sans exiger systématiquement le mismatch, puis des décisions différentes entre 11 et 48 heures. Son critère de perfusion mentionne un noyau approximativement jusqu’à 70 mL avec rapport &gt;1,2. La différence avec les repères nationaux de 2021 doit rester attribuée ; aucun seuil n’est copié comme règle universelle. Les critères européens détaillés de la fenêtre <button class="w" data-k="i63-calcul-mismatch">mismatch de perfusion</button> concernent encore leur propre population.</p><p>En l’absence de calcul automatique, le guide 2021 décrit une <button class="w" data-k="i63-calcul-volume-lesion">estimation géométrique du volume de lésion</button> ; son imprécision doit être comprise avant son emploi.</p><div class="key"><b>À retenir.</b> La sélection documente heure, déficit, artère, tissu, produit et contre-indications.</div><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), p. 1–6 : bridging et sélection</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1 et 4.1</a> ; <a href="https://doi.org/10.1177/23969873241257223" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation / ESMINT — Guideline on acute management of basilar artery occlusion (2024), Résumé et recommandations selon gravité</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indications</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indications</a>.</p><p><button class="w" data-k="i63-exceptions-suisses">Lire les contre-indications, exceptions et divergences suisses</button>.</p><p><button class="w" data-k="i63-situations-particulieres">Lire les situations particulières, la surveillance et le consentement</button>.</p></template>
<template data-pop="i63-bitherapie" data-title="Bithérapie courte : preuves et population"><p>La recommandation européenne 2021 est forte pour aspirine–clopidogrel 21 jours, puis monothérapie, chez les adultes avec accident vasculaire cérébral non cardioembolique NIHSS ≤3 ou AIT à haut risque, défini par un <button class="w" data-k="i63-calcul-risque-ait">score de risque ABCD2 ≥4</button> dans cette recommandation, dans les 24 heures, après imagerie. Les essais CHANCE et POINT utilisaient ce seuil ; FASTER exigeait un symptôme moteur ou de parole durant au moins cinq minutes. Ces critères ne sont pas interchangeables avec la sélection aspirine–ticagrelor, qui employait un seuil de six points ou certaines atteintes athéroscléreuses. Les essais ne fondent pas un traitement automatique des AIT incertains, des patients à indication d’anticoagulation ou à risque hémorragique reconnu.</p><p>La synthèse de trois essais rapporte une réduction absolue de 2,6 points de pourcentage du risque d’accident vasculaire cérébral ischémique à 90 jours pour les comparaisons pertinentes, avec les bénéfices surtout au cours des 21 premiers jours. Ce résultat se rapporte à cette population ; il ne prouve pas une réduction équivalente chez tout infarctus sévère ou cardioembolique.</p><p>La charge suggérée de clopidogrel est 300 mg en Europe, tandis que le protocole bernois utilise 600 mg et certains critères élargis. L’information professionnelle de Plavix ne recommande pas l’emploi dans les sept premiers jours après accident vasculaire cérébral : la pratique précoce est attribuée à la recommandation clinique hors cadre de l’information professionnelle et requiert une décision spécialisée.</p><div class="key"><b>À retenir.</b> La population, la durée et le statut réglementaire font partie du régime, autant que les doses.</div><p class="src">Références : <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), PICO 1, Recommendation 1, exclusions, charge et bénéfice 21 jours</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34 : régime et critères</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Indications AVC et mise en garde J7</a>.</p></template>
<template data-pop="i63-terrain" data-title="Terrain vasculaire et antécédents"><p>L’hypertension, le diabète, le tabagisme, la dyslipidémie, l’activité physique et les antécédents vasculaires orientent l’évaluation du risque. L’interrogatoire précise les diagnostics réellement posés, les traitements, l’adhésion et les résultats antérieurs ; il ne transforme pas une mesure isolée en histoire médicale confirmée.</p><p>Après l’urgence, le suivi relie la pression et les lipides aux objectifs de prévention, recherche le tabac et les obstacles au traitement, puis adapte la réadaptation. Les objectifs dépendent de la tolérance et du mécanisme de l’infarctus ; le contrôle du terrain ne dispense pas de rechercher une cause cardiaque ou artérielle.</p><div class="key"><b>À retenir.</b> Le terrain contribue au risque ; le mécanisme de l’événement actuel reste à documenter.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20–21 et 38–43 : causes, facteurs, objectifs et suivi</a>.</p></template>
<template data-pop="i63-energie" data-title="Énergie, gradients ioniques et dépolarisation"><p>Le fonctionnement cellulaire dépend du maintien des gradients ioniques. Les mouvements passifs de sodium et calcium vers la cellule et de potassium vers l’extérieur nécessitent une restauration par les pompes alimentées en adénosine triphosphate. L’étude de Dreier décrit l’échec de cette restauration lors de l’ischémie sévère et la dépolarisation massive qui peut suivre.</p><p>La dépolarisation s’associe à des perturbations ioniques, une élévation de glutamate extracellulaire et un œdème cytotoxique. Son début n’identifie pas à lui seul le point d’irréversibilité. Le silence électrique est également ambigu : il peut précéder cette dépolarisation dans les observations étudiées.</p><p>Les données humaines concernent neuf patients en situation de lésions cérébrales graves et d’arrêt terminal de circulation. Elles ne donnent pas la fenêtre individuelle d’un infarctus focal ; les décisions de reperfusion reposent sur les recommandations cliniques et l’imagerie.</p><div class="key"><b>À retenir.</b> Une explication biologique de l’urgence ne remplace pas les critères cliniques de traitement.</div><p class="src">Références : <a href="https://doi.org/10.1002/ana.25147" target="_blank" rel="noopener" data-reference-source="1">Dreier et coll. — Terminal spreading depolarization and electrical silence in death of human cerebral cortex (2018 ; DOI 10.1002/ana.25147), Introduction, discussion « Terminal SD », limitations et conclusion</a>.</p></template>
<template data-pop="i63-veineux" data-title="Infarctus veineux non pyogène : diagnostic et traitement distincts"><p>Une thrombose d’une veine cérébrale ou d’un sinus dural empêche le drainage veineux. Elle peut entraîner une lésion cérébrale, un œdème de congestion ou une hémorragie ; l’infarctus veineux non pyogène est une variante de cette leçon. Toutes les thromboses veineuses n’entraînent pas un infarctus. Une infection associée impose en outre la recherche et le traitement de son foyer ; ce contexte septique ne se résume pas au parcours non pyogène.</p><p>Le consensus publié en 2024 par Weimar et collègues, élaboré avec la participation de la Société suisse de neurologie, compare scanner et résonance avec angiographie veineuse pour la thrombose des sinus. La résonance est meilleure pour certaines veines corticales et préférée chez les sujets jeunes ou pendant la grossesse selon ce référentiel. Un examen artériel seul ne répond donc pas à la question veineuse. Les D-dimères ne sont pas recommandés comme moyen général d’exclure la thrombose ; l’exception d’une céphalée isolée à très faible probabilité relève d’une sélection précise, qui n’est pas celle d’un infarctus constitué.</p><p>Le bilan recherche les facteurs pertinents : hormones œstrogéniques, grossesse ou postpartum, infection, thrombophilie et maladie systémique selon le profil. Le bilan de thrombophilie n’est pas un dépistage automatique de tous les patients ; son résultat doit pouvoir changer la durée ou le type de traitement. Le protocole bernois 2026 et ce consensus décrivent une anticoagulation thérapeutique initiale, même lorsqu’une hémorragie est attribuée à la congestion veineuse. Cette position clinique doit être distinguée des contre-indications générales de l’information professionnelle Clexane, expliquées dans la fenêtre du produit.</p><p>Les héparines de bas poids moléculaire sont préférées dans de nombreux cas selon le consensus, mais une procédure imminente ou une insuffisance rénale sévère peut modifier la classe retenue. Une anticoagulation orale directe n’est pas proposée comme remplacement automatique dès la phase aiguë : la stabilisation clinique sous héparine précède le relais. Le consensus S2k distingue en outre le syndrome des antiphospholipides confirmé avec triple positivité : dans ce contexte, il privilégie un antagoniste de la vitamine K plutôt qu’un anticoagulant oral direct. Cette préférence est extrapolée d’études de thrombose veineuse extracérébrale ; elle ne repose pas sur un essai propre à la thrombose veineuse cérébrale. Le régime apixaban de fibrillation atriale enseigné ailleurs ne définit pas celui de cette thrombose.</p><p>Une aggravation malgré anticoagulation adéquate motive un avis neurointerventionnel. Le geste endovasculaire est réservé à certains cas ; l’essai évoqué par le consensus n’a pas démontré de bénéfice uniforme. Une lésion expansive avec menace d’engagement justifie une discussion de décompression urgente. La durée d’anticoagulation dépend du risque de récidive : le protocole bernois décrit généralement 3–6 mois, tandis que le consensus distingue une phase de 3–12 mois et une poursuite si le risque persiste. Une recanalisation incomplète isolée ne justifie pas à elle seule une prolongation indéfinie.</p><h3>Grossesse, post-partum et prévention secondaire</h3><p>Le consensus 2024 privilégie une héparine de bas poids moléculaire à dose thérapeutique pour une thrombose veineuse cérébrale survenant pendant la grossesse ou après l’accouchement. Le traitement se poursuit au moins six semaines après l’accouchement et dure au moins trois mois au total ; son calendrier est organisé avec une équipe obstétricale et d’hémostase. Anticoagulants oraux directs et antivitamines K ne sont pas proposés pendant la grossesse ; les anticoagulants directs ne sont pas recommandés pendant l’allaitement dans ce texte.</p><p>Après une thrombose liée à une contraception combinée ou à la grossesse, la reprise d’une contraception œstroprogestative est déconseillée lorsque l’anticoagulation n’est plus utilisée. Le choix d’une méthode sans œstrogène et le conseil de future grossesse sont discutés. En cas d’antécédent, une prophylaxie par héparine pendant la grossesse et au moins six semaines après l’accouchement se discute si aucune contre-indication n’existe, notamment après un événement hormonal, spontané ou gestationnel ; elle se distingue du traitement curatif d’une nouvelle thrombose. Les preuves sont limitées et ne fournissent pas une dose à extrapoler depuis le schéma de fibrillation atriale.</p><div class="key"><b>À retenir.</b> Distinguer le sang par congestion veineuse, l’infarctus artériel et l’hémorragie spontanée change l’examen demandé et le traitement. L’attribution exige l’imagerie et le spécialiste.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 32 : Cerebral venous and sinus thrombosis, anticoagulation, gestes et durée</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Definition ; Preliminary note ; Diagnosis ; Anticoagulation in the acute phase ; Thrombectomy und Thrombolysis ; Intracranial pressure therapy ; Anticoagulation in the maintenance phase</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane, énoxaparine en seringues préremplies (Février 2026), Contre-indications ; Mises en garde et précautions ; Posologie, insuffisance rénale</a>.</p></template>





<template data-pop="i63-ssp" data-title="Situations de départ : de la plainte à l’examen décisif"><p>Le référentiel suisse des objectifs de l’Examen fédéral (Profiles) décrit des situations de départ (Situations as Starting Points) : le candidat part d’une plainte et non d’un diagnostic. La correspondance ci-dessous entre ces situations et l’infarctus cérébral est pédagogique ; le référentiel ne publie aucune table officielle vers la classification internationale des maladies.</p><p>Chaque ligne suit le même raisonnement : la situation, l’hypothèse vasculaire, les concurrents à départager, puis l’élément et l’examen qui tranchent. La gravité commande l’ordre : on exclut d’abord ce qui tue ou ce qui se corrige en une minute.</p><table class="t"><thead><tr><th>Situation de départ</th><th>Hypothèse vasculaire</th><th>Concurrents à départager</th><th>Élément discriminant et examen décisif</th></tr></thead><tbody><tr><td>Déficit neurologique aigu ; parésie, paralysie (situations 205 et 103)</td><td>Infarctus sylvien, lacunaire ou du tronc.</td><td>Hémorragie, hypoglycémie, déficit postcritique, tumeur, hématome sous-dural, compression médullaire.</td><td>Installation brutale et systématisation artérielle ; glycémie immédiate, puis scanner ou résonance avec angiographie.</td></tr><tr><td>Trouble de la parole ou du langage (99)</td><td>Infarctus sylvien gauche (aphasie) ou lacunaire, cérébelleux, du tronc (dysarthrie).</td><td>Confusion, trouble psychiatrique, intoxication, aura migraineuse.</td><td>Distinguer aphasie et dysarthrie par la dénomination, la répétition et la compréhension ; imagerie urgente.</td></tr><tr><td>Asymétrie faciale (20)</td><td>Paralysie faciale centrale d’un infarctus.</td><td>Paralysie faciale périphérique.</td><td>La grille neurologique décrit l’atteinte centrale typique comme prédominant au bas du visage ; une asymétrie associée à un trouble de la parole ou à une faiblesse d’un membre relève de la filière urgente, et une paralysie faciale isolée n’est attribuée au nerf facial qu’après un examen neurologique complet.</td></tr><tr><td>Vertige, troubles de l’équilibre, chutes (100 et 96)</td><td>Infarctus cérébelleux ou du tronc.</td><td>Névrite vestibulaire, vertige positionnel, Ménière, migraine vestibulaire, hypotension orthostatique, arythmie.</td><td>Syndrome vestibulaire aigu avec nystagmus : examen <button class="w" data-k="i63-hints">HINTS (lecture centrale ou périphérique)</button>, audition et marche ; résonance avec diffusion, en sachant ses faux négatifs précoces.</td></tr><tr><td>Perte visuelle aiguë ou trouble visuel, diplopie (18 et 39)</td><td>Hémianopsie d’un infarctus postérieur ; occlusion de l’artère centrale de la rétine ; diplopie du tronc.</td><td>Décollement de rétine, hémorragie du vitré, artérite à cellules géantes, aura migraineuse.</td><td>Monoculaire ou binoculaire ; champ visuel au doigt ; fond d’œil ; vitesse de sédimentation si âge et céphalée évoquent l’artérite.</td></tr><tr><td>Perte de sensibilité (104)</td><td>Infarctus thalamique ou lacunaire sensitif pur.</td><td>Neuropathie, radiculopathie, trouble fonctionnel, aura.</td><td>Distribution hémicorporelle face–bras–jambe ; imagerie.</td></tr><tr><td>Confusion, changement brutal de l’état mental (126 et 216)</td><td>Infarctus sylvien droit, thalamique ou postérieur.</td><td>Délire infectieux ou toxique, hypoglycémie, troubles électrolytiques, encéphalopathie de Wernicke, état de mal non convulsif.</td><td>Début brutal plutôt que fluctuant ; recherche d’une négligence et d’une hémianopsie ; glycémie, ionogramme, imagerie.</td></tr><tr><td>Trouble de conscience, coma (145)</td><td>Occlusion basilaire, grand infarctus avec œdème.</td><td>Hémorragie, intoxication, hypoglycémie, état de mal, méningite.</td><td>Oculomotricité et pupilles ; angioscanner incluant la basilaire.</td></tr><tr><td>Céphalée (101)</td><td>Dissection cervicale, thrombose veineuse cérébrale, vasculite.</td><td>Hémorragie méningée, migraine, vasoconstriction réversible, artérite.</td><td>Céphalée brutale : imagerie immédiate à la recherche d’un saignement, puis des vaisseaux ; douleur cervicale, traumatisme ou syndrome de Horner : imagerie des artères cervicales.</td></tr><tr><td>Difficulté à avaler (23)</td><td>Infarctus du tronc (Wallenberg), grand infarctus hémisphérique.</td><td>Causes œsophagiennes et neuromusculaires.</td><td>Dépistage structuré de la déglutition avant toute prise orale ; endoscopie fonctionnelle si suspicion du tronc.</td></tr></tbody></table><p>Le tableau se lit en partant de la colonne de gauche, celle par laquelle le patient se présente. Ainsi, devant un vertige, l’étudiant ne se demande pas d’emblée « est-ce un accident vasculaire cérébral ? », mais « s’agit-il d’un syndrome vestibulaire aigu, épisodique déclenché ou épisodique spontané ? » ; seule la première forme relève de l’examen HINTS, et la seconde se teste par les manœuvres de provocation.</p><div class="key"><b>À retenir.</b> L’hypothèse vasculaire se construit sur le début brutal et la systématisation ; elle se confirme par l’imagerie ; elle se défend contre ses concurrents par un élément discriminant précis, jamais par l’absence de signe.</div><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll., 2021, tableau 1 : paralysie, langage, vision, vertige avec incapacité de marche</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Bern Stroke Network 08/2026, p. 14 : déglutition ; p. 19 : accident transitoire et aura, définition du délire ; p. 20 : indices de dissection, de vasculite et de vasoconstriction ; p. 62–63 : cotation faciale ; p. 52 : occlusion de l’artère centrale de la rétine, diagnostics différentiels et artérite</a> ; <a href="https://doi.org/10.3389/fneur.2021.682827" target="_blank" rel="noopener" data-reference-source="1">Hoyer et Szabo, 2021, tableau 1 : syndromes postérieurs et diagnostics différentiels</a> ; <a href="https://doi.org/10.3390/brainsci15010055" target="_blank" rel="noopener" data-reference-source="1">Tarnutzer et coll., 2025 : syndromes vestibulaires aigu et épisodiques, indications du HINTS</a> ; <a href="https://doi.org/10.2147/NDT.S275750" target="_blank" rel="noopener" data-reference-source="1">Wallace et Liberman, 2021 : confusion et infarctus sylvien droit</a>.</p></template>
<template data-pop="i63-hints" data-title="HINTS : examen oculomoteur du vertige aigu"><p>Le syndrome vestibulaire aigu désigne un vertige ou une sensation vertigineuse spontanés et continus, avec nausées, intolérance au mouvement, instabilité et, souvent, nystagmus. Environ un quart de ces patients a une cause grave, surtout un infarctus vertébrobasilaire ; or les signes neurologiques focaux manquent dans environ deux tiers des syndromes vestibulaires centraux. L’examen oculomoteur devient donc l’outil clinique décisif.</p><p>HINTS réunit trois épreuves ; la version enrichie ajoute l’audition. Chaque épreuve se lit comme « périphérique » ou « centrale », jamais comme « normale ».</p><table class="t"><thead><tr><th>Épreuve</th><th>Aspect compatible avec une atteinte périphérique</th><th>Aspect central, alarmant</th><th>Pourquoi</th></tr></thead><tbody><tr><td>Impulsion céphalique : rotation brève et rapide de la tête, regard fixé sur le nez de l’examinateur</td><td>Saccade de rattrapage d’un côté : le réflexe vestibulo-oculaire est déficitaire.</td><td>Aucune saccade : le réflexe est intact pendant un vertige continu.</td><td>Une névrite peut altérer le réflexe vestibulo-oculaire. Dans une atteinte centrale, ce réflexe peut rester conservé ; toutefois, une saccade de rattrapage ne suffit pas à exclure un infarctus, notamment dans le territoire de l’artère cérébelleuse antéro-inférieure.</td></tr><tr><td>Nystagmus dans les différentes directions du regard</td><td>Nystagmus horizontal battant toujours du même côté.</td><td>Nystagmus qui change de sens selon le regard, ou nystagmus évoqué par le regard.</td><td>Le maintien du regard excentré dépend d’un intégrateur central, situé dans le tronc et le cervelet.</td></tr><tr><td>Recherche d’une skew deviation : occlusion alternée de chaque œil</td><td>Absence de correction verticale.</td><td>Mouvement vertical de refixation.</td><td>Le décalage vertical des yeux traduit une atteinte des voies otolithiques centrales.</td></tr><tr><td>Audition, dans la version enrichie</td><td>Audition inchangée.</td><td>Surdité unilatérale nouvelle.</td><td>L’artère cérébelleuse antéro-inférieure nourrit aussi l’oreille interne ; ces infarctus sont les plus souvent manqués.</td></tr></tbody></table><p>Un seul aspect central suffit à classer l’examen comme central. Dans le sous-groupe des infarctus du territoire de l’artère cérébelleuse antéro-inférieure rapporté par Tarnutzer et collègues, l’ajout de l’audition fait passer la sensibilité de 84,0 % (intervalle de confiance : 65,3–93,6 %) à 95,7 % (79,0–99,2 %). Ces performances ne se transposent ni à tous les vertiges ni à un examen réalisé sans formation. Exemple fictif : un homme de 66 ans, vertigineux depuis cinq heures, a un nystagmus battant à droite, une saccade de rattrapage lors de la rotation vers la gauche, aucune skew deviation, mais une surdité gauche nouvelle ; l’examen enrichi est donc central et justifie la filière d’accident vasculaire cérébral.</p><div class="trap"><span class="k">Piège</span> L’examen n’est validé que chez le patient en syndrome vestibulaire aigu avec nystagmus, et son utilisation exige une formation à la réalisation et à l’interprétation des épreuves. Une lecture périphérique ne doit pas clore le raisonnement si le contexte reste suspect. Appliqué à un vertige positionnel ou à une sensation vertigineuse sans nystagmus, il paraît faussement central, car l’impulsion céphalique y est normale ; le vertige déclenché par les positions se teste par les manœuvres de provocation. En outre, le scanner n’a qu’une sensibilité de 28,5 % pour l’infarctus dans cette situation, et la diffusion peut rester négative jusqu’à une fois sur cinq dans les 24 à 48 premières heures.</div><div class="key"><b>À retenir.</b> Pendant un vertige continu, un réflexe vestibulo-oculaire intact n’est pas rassurant : il oriente vers une cause centrale.</div><p class="src">Référence : <a href="https://doi.org/10.3390/brainsci15010055" target="_blank" rel="noopener" data-reference-source="1">Tarnutzer, Koohi, Lee et coll. — Diagnostic Errors in the Acutely Dizzy Patient—Lessons Learned, Brain Sciences 2025 (premier auteur suisse, Baden et Zurich), Introduction, tableau 1, sections HINTS et imagerie</a> ; <a href="https://doi.org/10.3389/fneur.2021.682827" target="_blank" rel="noopener" data-reference-source="1">Hoyer et Szabo, 2021, section HINTS</a>.</p></template>
<template data-pop="i63-race" data-title="Score RACE : suspecter une occlusion proximale avant l’hôpital"><p>Le score RACE (de l’anglais « Rapid Arterial Occlusion Evaluation », évaluation rapide de l’occlusion artérielle) est l’instrument que les recommandations préhospitalières suisses de 2021 privilégient pour estimer, sur le terrain, la probabilité d’une occlusion d’un gros vaisseau. Il reprend les fonctions qu’une occlusion proximale de l’artère cérébrale moyenne détruit ensemble.</p><table class="t"><thead><tr><th>Item</th><th>Consigne</th><th>Points</th></tr></thead><tbody><tr><td>Face</td><td>« Montrez-moi les dents » : symétrie 0 ; légère asymétrie 1 ; asymétrie complète 2.</td><td>0–2</td></tr><tr><td>Bras</td><td>Maintien plus de 10 secondes 0 ; moins de 10 secondes 1 ; aucun effort contre la pesanteur 2.</td><td>0–2</td></tr><tr><td>Jambe</td><td>Maintien plus de 5 secondes 0 ; moins de 5 secondes 1 ; aucun effort contre la pesanteur 2.</td><td>0–2</td></tr><tr><td>Regard</td><td>Absence de déviation 0 ; déviation des yeux ou de la tête 1.</td><td>0–1</td></tr><tr><td>Si la paralysie est droite : langage</td><td>« Fermez les yeux » et « Serrez le poing » : deux ordres exécutés 0 ; un seul 1 ; aucun 2.</td><td>0–2</td></tr><tr><td>Si la paralysie est gauche : agnosie</td><td>« À qui est ce bras ? » et « Votre bras est-il faible ? » : reconnaît et perçoit 0 ; méconnaît le bras ou le déficit 1 ; les deux 2.</td><td>0–2</td></tr></tbody></table><p>Le total va de 0 à 9. Le protocole bernois oriente directement vers le centre un patient dont le score atteint au moins 5 et dont les symptômes datent de moins de 4,5 heures, si le trajet vers le centre n’allonge pas le transport de plus de 20 minutes par rapport à l’unité la plus proche. Dans l’étude de validation citée, la probabilité d’occlusion passait de 8 % pour un point à 47 % pour cinq points et 86 % pour neuf points.</p><p>Exemple fictif : asymétrie faciale complète (2), bras qui tombe avant 10 secondes (1), jambe tenue (0), déviation du regard (1), paralysie droite avec un seul ordre exécuté (1) : 2 + 1 + 0 + 1 + 1 = 5 points. Le score franchit le seuil de triage ; il suggère l’occlusion sans la démontrer, et seule l’angiographie la confirme.</p><div class="trap"><span class="k">Piège</span> Le score explore surtout la circulation antérieure. Un vertige avec incapacité de marcher, une diplopie ou une baisse de vigilance peuvent traduire une occlusion basilaire malgré un score faible.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Bern Stroke Network 08/2026, p. 5 : items du score, triage selon RACE ≥5 et 20 minutes, probabilités d’occlusion d’après Pérez de la Ossa 2014</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll., 2021, p. 324 : choix du score RACE pour le triage préhospitalier</a>.</p></template>
