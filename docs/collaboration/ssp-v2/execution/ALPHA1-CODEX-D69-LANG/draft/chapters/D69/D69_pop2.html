<template id="d69-ivig-calcul" data-pop="d69-ivig-calcul" data-title="IgIV : dose, volume et débit"><p>Grandeurs : la dose se calcule en g par kg de poids ; Privigen est une solution à 10 %, c’est-à-dire 10 g pour 100 mL, soit 10 mL par gramme ; le débit se calcule en mL par kg et par heure. Formules : dose (g) = 1 g/kg × poids ; volume (mL) = dose × 10 ; débit initial (mL/h) = 0,3 × poids.</p><p>Exemple pour 70 kg : 70 g, soit 700 mL ; débit initial 0,3 × 70 = 21 mL/h pendant environ 30 minutes ; débit maximal 4,8 × 70 = 336 mL/h si la tolérance est bonne. Le plafond est de 100 g par jour (PNDS). Chez un patient à risque rénal ou thrombotique, on administre 0,4 g/kg/j pendant 2 à 5 jours, au débit le plus bas.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680583140015" target="_blank" rel="noopener">Swissmedic — Privigen® (autorisation 58314 ; juillet 2025), information professionnelle</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-medicament-pti" data-pop="d69-medicament-pti" data-title="Thrombopénie immunologique médicamenteuse"><p>Le PNDS décrit une incidence de 0,1 pour 10 000 par an, une évolution aiguë et une récupération rapide à l’arrêt. Les associations rapportées incluent des vaccins, l’alemtuzumab, la doxycycline, le cotrimoxazole, la vancomycine, des chimiothérapies, l’aciclovir, le sofosbuvir, le bisoprolol et le clopidogrel.</p><p>Le PTI associé aux inhibiteurs de points de contrôle apparaît 10 à 20 semaines après le début. L’interrogatoire inclut la phytothérapie et l’automédication. Le médicament suspect est arrêté et signalé à la pharmacovigilance.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-megacaryocyte" data-pop="d69-megacaryocyte" data-title="Mégacaryocyte"><p>Le mégacaryocyte est une grande cellule de la moelle osseuse à noyau multilobé et cytoplasme granuleux. Des plaquettes nouvellement formées se voient à son voisinage sur les frottis médullaires.</p><p>Dans le PTI, selon le PNDS (partie 2.5), les mégacaryocytes sont normaux ou augmentés et non dystrophiques. Une image de mégacaryocyte ne suffit pas pour affirmer un PTI.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-ashwell" data-pop="d69-ashwell" data-title="Récepteur d’Ashwell-Morell"><p>Le récepteur d’Ashwell-Morell est un récepteur hépatique qui capte les glycoprotéines ayant perdu leur acide sialique (désialylation). Dans le PTI, la désialylation des glycoprotéines plaquettaires conduit à la capture des plaquettes par le foie.</p><p>Ce mécanisme s’ajoute à la destruction par les récepteurs Fc dans la rate : le foie et la rate participent tous deux à l’élimination des plaquettes.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-hypersplenisme" data-pop="d69-hypersplenisme" data-title="Hypersplénisme et séquestration"><p>L’hypersplénisme d’une hépatopathie chronique ou d’une maladie de surcharge entraîne une thrombopénie habituellement voisine de 50 G/L, parfois 30 G/L. Une hypertension portale peut l’entraîner sans splénomégalie.</p><p>Le bilan hépatique, le TP et l’échographie abdominale orientent. Le contexte hépatique et la thrombopénie modérée orientent vers ce diagnostic plutôt que vers un PTI.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-leucocytoclasique" data-pop="d69-leucocytoclasique" data-title="Vascularite leucocytoclasique"><p>La vascularite leucocytoclasique est la lésion histologique de la vascularite à IgA : elle atteint la paroi des petits vaisseaux. L’immunofluorescence montre des dépôts d’IgA dans environ 60 % des cas.</p><p>La biopsie cutanée confirme donc le diagnostic, mais une biopsie sans dépôts d’IgA ne l’exclut pas. La lésion rénale associée est identique à celle de la néphropathie à IgA.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/vascularite-iga-de-ladulte" target="_blank" rel="noopener">Hankard et Audemard-Verger — Vascularite à IgA de l’adulte (Revue du Praticien 2023 ; 73:1124-30)</a>.</p></template>
<template id="d69-prednisone-calcul" data-pop="d69-prednisone-calcul" data-title="Prednisone : dose et plafond"><p>Grandeurs : le poids en kg et la dose en mg par kg et par jour. Formule : dose = minimum (1 mg/kg ; 80 mg). Pour 90 kg, 1 mg/kg donnerait 90 mg ; le plafond de 80 mg s’applique donc : 80 mg/j pendant 3 semaines.</p><p>Le PNDS prévoit l’arrêt immédiat ou une décroissance de quelques jours ; l’information professionnelle de la Prednisone Streuli recommande un arrêt progressif d’un traitement de plus de quelques jours. La durée totale des corticoïdes n’excède jamais 8 semaines. L’usage dans le PTI relève de l’indication « thrombocytopénie idiopathique » de la Prednisone Streuli.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Swissmedic — Prednisone Streuli® (autorisation 29349 ; juin 2026), information professionnelle</a>.</p></template>
<template id="d69-rendement" data-pop="d69-rendement" data-title="Rendement d’un concentré plaquettaire"><p>Grandeurs : le nombre de plaquettes avant la transfusion et le gain apporté par chaque concentré. Le Compendium suisse indique un gain de 20 à 30 G/L par concentré chez l’adulte non immunisé. Formule : chiffre attendu = chiffre de départ + gain.</p><p>Exemple : insuffisance médullaire à 8 G/L, un concentré donne 28 à 38 G/L. L’immunisation, la fièvre, la splénomégalie et la destruction immunologique réduisent ce rendement. Dans le PTI, le gain à 24 heures est souvent nul : la transfusion est réservée à l’urgence vitale.</p><p class="src">Sources : <a data-reference-source="1" href="https://compendium.ch/product/1189074-thrombozytenkonz-pathogeninaktiv-apherese" target="_blank" rel="noopener">Compendium suisse — Blutspende SRK Schweiz, concentré plaquettaire pathogéninactivé d’aphérèse (page du 10.09.2026)</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-rfviia" data-pop="d69-rfviia" data-title="Facteur VII activé recombinant (NovoSeven)"><p>NovoSeven est indiqué, en Suisse, dans la thrombasthénie de Glanzmann avec anticorps anti-GPIIb/IIIa ou anti-HLA réfractaire aux transfusions de plaquettes. La dose est de 90 µg/kg (80 à 120) en bolus intraveineux toutes les 2 heures (1,5 à 2,5 h), au moins 3 doses.</p><p>Des événements thromboemboliques ont été rapportés. Chez les patients non réfractaires, les plaquettes restent le premier choix. La fiche française d’urgence mentionne des indications propres à la France ; la fiche suisse du produit fait foi.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586930057" target="_blank" rel="noopener">Swissmedic — NovoSeven® (autorisation 58693 ; septembre 2023), information professionnelle</a> ; <a data-reference-source="1" href="https://www.orpha.net/pdfs/data/patho/Emg/Int/fr/ThrombasthenieGlanzmann_FR_fr_EMG_ORPHA849.pdf" target="_blank" rel="noopener">Orphanet Urgences — Thrombasthénie de Glanzmann : bonnes pratiques en cas d’urgence (2022)</a>.</p></template>
<template id="d69-rituximab" data-pop="d69-rituximab" data-title="Rituximab hors indication dans le PTI"><p>Le rituximab n’est pas indiqué dans le PTI en Suisse : l’information professionnelle de MabThera cite les lymphomes non hodgkiniens, la polyarthrite rhumatoïde, les vascularites à ANCA et le pemphigus vulgaire. Onkopedia le propose en seconde ligne, hors indication.</p><p>La réponse est transitoire chez environ 60 % des patients ; les rémissions durables vont de 10 à 40 %. Les doses publiées (4 × 375 mg/m², 4 × 100 mg ou 2 × 1 000 mg) n’ont pas montré de supériorité. Les réactions à la perfusion sont fréquentes (environ 60 %), surtout à la première. Les vaccins sont faits jusqu’à 4–6 semaines avant ; la réponse vaccinale reste diminuée jusqu’à 6 mois. L’information professionnelle signale la réactivation de l’hépatite B et la leucoencéphalopathie multifocale progressive.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">Swissmedic — MabThera® perfusion i.v. (autorisation 54378 ; décembre 2025), information professionnelle</a>.</p></template>
<template id="d69-seuils-gestes" data-pop="d69-seuils-gestes" data-title="Seuils plaquettaires pour les gestes"><p>Les seuils d’Onkopedia viennent de la ligne directrice allemande de 2020, ceux du PNDS d’avis d’experts, ceux du Compendium suisse du concentré plaquettaire de seuils indicatifs « individuels » (insuffisance médullaire 10, ponction médullaire 20, geste invasif 30–40, transfusion massive 50, hémorragie oculaire ou cérébrale 80, patient hépariné 20 G/L).</p><p>Ces seuils proviennent de thrombopénies centrales, non du PTI. Ils sont donc individualisés : le médecin tient compte du saignement actuel, des antithrombotiques et du geste. En cas de divergence, il applique la source qu’il suit et le documente.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://compendium.ch/product/1189074-thrombozytenkonz-pathogeninaktiv-apherese" target="_blank" rel="noopener">Compendium suisse — Blutspende SRK Schweiz, concentré plaquettaire pathogéninactivé d’aphérèse (page du 10.09.2026)</a>.</p></template>
<template id="d69-splenectomie" data-pop="d69-splenectomie" data-title="Splénectomie : indications et vaccinations préalables"><p>La splénectomie donne le taux le plus élevé de rémissions durables sans traitement, soit environ deux tiers de réponses. Elle n’est pas proposée avant 12 mois. Un myélogramme est fait au préalable.</p><p>Une vaccination contre le pneumocoque, Haemophilus influenzae b et le méningocoque précède l’intervention. Le risque infectieux et le risque thrombotique augmentent après splénectomie. Selon le PNDS, le patient est vacciné après l’intervention.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-th2" data-pop="d69-th2" data-title="Score TH2 : risque thrombotique dans le PTI"><p>Grandeurs : un risque de thrombose de fond (CHA₂DS₂-VASc supérieur à 5, maladie thromboembolique veineuse spontanée, récidivante ou tumorale, ou syndrome des antiphospholipides) vaut +1 ; un traitement prothrombotique récent (IgIV dans les 2 semaines, TRA ou splénectomie dans les 4 semaines) vaut +1 ; des plaquettes inférieures à 20 G/L valent −1 ; un saignement initial de grade OMS 2 ou plus hors peau vaut −1.</p><p>Exemple : syndrome des antiphospholipides (+1), IgIV il y a 10 jours (+1), plaquettes à 15 G/L (−1), pas de saignement muqueux (0) : score +1. Un score de 0 ou plus signale un risque thrombotique prédominant. Le score est une aide ; aucune validation prospective n’est citée.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-tranexamique" data-pop="d69-tranexamique" data-title="Acide tranexamique : posologie rénale"><p>L’acide tranexamique est un antifibrinolytique de soutien, utile surtout pour les saignements muqueux. Cyklokapron s’emploie à 2 comprimés trois fois par jour pendant 7 jours dans l’épistaxis prolongée ou récidivante. Il est éliminé par le rein : la dose s’adapte à la créatinine (120 à 250 µmol/L : 15 mg/kg toutes les 12 heures ; 250 à 500 µmol/L : 15 mg/kg toutes les 24 heures).</p><p>Exemple : 60 kg, créatinine à 180 µmol/L : 15 mg/kg × 60 kg = 900 mg toutes les 12 heures. Il est contre-indiqué en insuffisance rénale sévère, en cas d’hypercoagulabilité, de CIVD, d’antécédent de thrombose ou de convulsions.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680337410494" target="_blank" rel="noopener">Swissmedic — Cyklokapron® (autorisations 33741 et 52660 ; juin 2026), information professionnelle</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="d69-transfusion" data-pop="d69-transfusion" data-title="Transfusion de plaquettes dans le PTI"><p>Dans le PTI, la transfusion est habituellement inefficace : le rendement à 24 heures est souvent nul. Elle n’est indiquée qu’en urgence vitale, toujours avec corticoïdes et IgIV, à des doses 2 à 3 fois supérieures à celles d’une thrombopénie centrale.</p><p>Onkopedia indique souvent plus d’un ou deux concentrés. Le Compendium suisse du concentré plaquettaire cite une contre-indication : allergie à l’amotosalen. Chez la femme en âge de procréer, un anti-D est à discuter en cas d’incompatibilité Rh.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://compendium.ch/product/1189074-thrombozytenkonz-pathogeninaktiv-apherese" target="_blank" rel="noopener">Compendium suisse — Blutspende SRK Schweiz, concentré plaquettaire pathogéninactivé d’aphérèse (page du 10.09.2026)</a>.</p></template>
<template id="d69-triple" data-pop="d69-triple" data-title="Triple association du PNDS"><p>En urgence vitale, le PNDS associe trois traitements. Les corticoïdes sont la méthylprednisolone 15 mg/kg/j (maximum 1 g) de J1 à J3, ou la dexaméthasone 40 mg intraveineuse pendant 4 jours. Les IgIV sont données à 1 g/kg à J1 et J2. Les plaquettes sont transfusées toutes les 8 heures : cible de 100 G/L jusqu’à stabilisation clinique, puis 50 G/L pour un hématome intracérébral, et 50 G/L pour un saignement digestif, urologique ou gynécologique ; hémoglobine 9–10 g/dL.</p><p>À 48–72 heures sans amélioration, le PNDS ajoute romiplostim 10 µg/kg (hors AMM) et vinblastine. Les mesures générales sont l’arrêt des antiagrégants, des anticoagulants et des médicaments thrombopéniants, le contrôle de la pression artérielle, l’éviction des gestes traumatiques et des injections intramusculaires.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-vaccins" data-pop="d69-vaccins" data-title="Vaccinations dans le PTI"><p>Toutes les vaccinations standard sont possibles. Les vaccins vivants sont contre-indiqués sous immunosuppression forte (corticoïdes à haute dose, rituximab), mais non sous agoniste du récepteur de la TPO. Après des IgIV, un délai d’au moins 3 mois (jusqu’à 1 an pour la rougeole) précède un vaccin vivant.</p><p>La voie sous-cutanée est possible pour éviter un hématome musculaire. Le vaccin rougeole-oreillons-rubéole provoque une thrombopénie chez environ 1 sujet sur 40 000.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680583140015" target="_blank" rel="noopener">Swissmedic — Privigen® (autorisation 58314 ; juillet 2025), information professionnelle</a>.</p></template>
<template id="d69-constitutionnelle" data-pop="d69-constitutionnelle" data-title="Thrombopénies constitutionnelles : drapeaux rouges"><p>Plusieurs signes font évoquer une thrombopénie constitutionnelle plutôt qu’un PTI : des manifestations extrahématologiques (eczéma, surdité, cataracte précoce, atteinte rénale, infections, malformations), des antécédents familiaux de thrombopénie, d’hémorragie grave ou d’hémopathie myéloïde, une thrombopénie stable résistante aux traitements, des saignements au-dessus de 50 G/L, des microplaquettes ou des plaquettes géantes et des inclusions de Döhle (gène MYH9).</p><p>Certains gènes (RUNX1, ETV6, ANKRD26) prédisposent aux hémopathies malignes. Le frottis est le premier indice ; la génétique et l’avis spécialisé confirment. La forme constitutionnelle ne se traite pas comme un PTI.</p><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="d69-bilan-base" data-pop="d69-bilan-base" data-title="Bilan de base d’une thrombopénie"><p>Onkopedia demande l’anamnèse (saignements, infections, médicaments dont anticoagulants, vaccins, alcool, grossesse, thromboses, famille, profession) et l’examen (muqueuses, ganglions, foie, rate). Les examens sont l’hémogramme sur EDTA et sur citrate, le frottis lu par un expert, le Quick/INR, le TCA et le fibrinogène, le groupe et la recherche d’anticorps si anémie, la glycémie avant corticoïdes et les immunoglobulines IgG, IgA et IgM.</p><p>Le PNDS ajoute les réticulocytes, l’haptoglobine, les LDH, la bilirubine libre, le bilan hépatique, la créatinine, l’électrophorèse des protéines, les sérologies VHB, VHC et VIH et les anticorps antinucléaires. Chaque examen répond à une question précise (tableau de l’îlot 5).</p><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="pareto-d69-a01" data-pop="pareto-d69-a01" data-title="Loi de Pareto — Cas fil rouge et sémiologie du purpura"><p class="ratio" data-cover="d69-a01"></p><ul><li>Un purpura est une tache qui ne s’efface pas à la vitropression ; le purpura fébrile à extension rapide est un purpura fulminans jusqu’à preuve du contraire.</li><li>Une tache infiltrée ou palpable évoque une vascularite ; une tache plate avec saignements muqueux évoque une thrombopénie. Seul l’hémogramme élimine un purpura thrombopénique.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p></template>
<template id="pareto-d69-a02" data-pop="pareto-d69-a02" data-title="Loi de Pareto — Définitions et grandes familles"><p class="ratio" data-cover="d69-a02"></p><ul><li>D69 se lit par mécanisme : paroi vasculaire, fonction plaquettaire, nombre de plaquettes. Les purpuras fulminans et thrombotiques thrombocytopéniques en sont exclus.</li><li>Le PTI exige moins de 100 G/L de façon répétée et l’exclusion des autres causes ; il est primaire dans 80 % des cas et chronique dans 60 à 70 % chez l’adulte.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D65–D69 (Stand 15.09.2023)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="pareto-d69-a03" data-pop="pareto-d69-a03" data-title="Loi de Pareto — Épidémiologie et physiopathologie"><p class="ratio" data-cover="d69-a03"></p><ul><li>Le PTI associe destruction des plaquettes par auto-anticorps (rate, foie) et production médullaire insuffisante par déficit relatif en TPO.</li><li>La TIH est une thrombopénie de consommation avec hypercoagulabilité : le risque est la thrombose. Aucune incidence suisse du PTI n’a été trouvée.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a>.</p></template>
<template id="pareto-d69-a04" data-pop="pareto-d69-a04" data-title="Loi de Pareto — Anamnèse et examen clinique"><p class="ratio" data-cover="d69-a04"></p><ul><li>La gravité clinique prime sur le chiffre : saignement cutané ou muqueux habituellement sous 20 G/L, digestif ou cérébral sous 10 G/L ou sous anticoagulant.</li><li>Les grades de l’OMS et la définition ISTH décident de l’urgence ; l’atteinte muqueuse (« wet purpura ») signale un risque accru. Une splénomégalie n’est pas typique du PTI.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="pareto-d69-a05" data-pop="pareto-d69-a05" data-title="Loi de Pareto — Diagnostic positif du PTI"><p class="ratio" data-cover="d69-a05"></p><ul><li>Le PTI est un diagnostic d’exclusion : plaquettes sous 100 G/L répétées, reste de l’hémogramme normal, aucune autre cause ; aucun test ne le prouve.</li><li>Les causes secondaires les plus fréquentes sont le lupus, les médicaments et la leucémie lymphoïde chronique ; les confusions les plus fréquentes sont les thrombopénies médicamenteuses, les myélodysplasies et les hépatopathies.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="pareto-d69-a06" data-pop="pareto-d69-a06" data-title="Loi de Pareto — Urgences et critères d’hospitalisation"><p class="ratio" data-cover="d69-a06"></p><ul><li>Hospitaliser toute découverte sous 20 G/L sans diagnostic ; la règle devient absolue dès un saignement muqueux ou sévère.</li><li>L’urgence vitale se traite par corticoïdes, IgIV et plaquettes ; la transfusion de plaquettes est inefficace en dehors de l’urgence vitale.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a>.</p></template>
<template id="pareto-d69-a07" data-pop="pareto-d69-a07" data-title="Loi de Pareto — Purpuras vasculaires"><p class="ratio" data-cover="d69-a07"></p><ul><li>La vascularite à IgA associe purpura déclive palpable, douleurs abdominales, arthralgies et atteinte rénale, avec des plaquettes normales.</li><li>Bandelette urinaire et créatinine dès le début ; biopsie cutanée avec immunofluorescence ; AINS à éviter. Le purpura sénile est un diagnostic d’élimination.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/vascularite-iga-de-ladulte" target="_blank" rel="noopener">Hankard et Audemard-Verger — Vascularite à IgA de l’adulte (Revue du Praticien 2023 ; 73:1124-30)</a>.</p></template>
<template id="pareto-d69-a08" data-pop="pareto-d69-a08" data-title="Loi de Pareto — Conduite thérapeutique du PTI"><p class="ratio" data-cover="d69-a08"></p><ul><li>Traiter selon le saignement et le contexte, non selon le chiffre seul ; seuils d’intervention 20, 30 ou 50 G/L selon le terrain.</li><li>Khellaf supérieur à 8 : IgIV et corticoïdes ; 8 ou moins : corticoïdes seuls, au plus 8 semaines. En seconde ligne, agonistes du récepteur de la TPO sans viser la normalisation, avec évaluation du risque thrombotique.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="pareto-d69-a09" data-pop="pareto-d69-a09" data-title="Loi de Pareto — Thrombopathies constitutionnelles"><p class="ratio" data-cover="d69-a09"></p><ul><li>Un saignement précoce ou disproportionné au chiffre fait penser à Glanzmann (agrégation absente), Bernard-Soulier (macrothrombopénie, pas d’agglutination à la ristocétine) ou Willebrand 2B.</li><li>Agrégométrie et cytométrie confirment la thrombasthénie de Glanzmann ; le facteur VII activé s’emploie si la transfusion de plaquettes est inefficace.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.orpha.net/pdfs/data/patho/Emg/Int/fr/ThrombasthenieGlanzmann_FR_fr_EMG_ORPHA849.pdf" target="_blank" rel="noopener">Orphanet Urgences — Thrombasthénie de Glanzmann : bonnes pratiques en cas d’urgence (2022)</a> ; <a data-reference-source="1" href="https://www.orpha.net/fr/disease/detail/274" target="_blank" rel="noopener">Orphanet — Syndrome de Bernard-Soulier (ORPHA:274)</a> ; <a data-reference-source="1" href="https://www.orpha.net/fr/disease/detail/721" target="_blank" rel="noopener">Orphanet — Syndrome des plaquettes grises (ORPHA:721)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586930057" target="_blank" rel="noopener">Swissmedic — NovoSeven® (autorisation 58693 ; septembre 2023), information professionnelle</a>.</p></template>
<template id="pareto-d69-a10" data-pop="pareto-d69-a10" data-title="Loi de Pareto — Situations particulières"><p class="ratio" data-cover="d69-a10"></p><ul><li>Grossesse : la thrombopénie gestationnelle domine ; au-dessous de 100 G/L, bilan comme hors grossesse ; seuils d’accouchement 50 G/L (voie basse) et 70 G/L (anesthésie neuraxiale).</li><li>Enfant : traiter selon Buchanan, souvent surveiller ; gestes : seuils variables selon la source ; PTI = risque de thrombose doublé, évalué par TH2.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://afpa.org/content/uploads/2025/04/HAS-synthese_mg_pti__de_l_enfant_et_de_l_adolescent.pdf" target="_blank" rel="noopener">HAS/CEREVANCE — PNDS PTI de l’enfant et de l’adolescent, synthèse pour le pédiatre de ville et le médecin généraliste (janvier 2025)</a> ; <a data-reference-source="1" href="https://compendium.ch/product/1189074-thrombozytenkonz-pathogeninaktiv-apherese" target="_blank" rel="noopener">Compendium suisse — Blutspende SRK Schweiz, concentré plaquettaire pathogéninactivé d’aphérèse (page du 10.09.2026)</a>.</p></template>
<template id="pareto-d69-a11" data-pop="pareto-d69-a11" data-title="Loi de Pareto — TIH et thrombopénies médicamenteuses"><p class="ratio" data-cover="d69-a11"></p><ul><li>Chute de 30 % ou plus des plaquettes 5 à 10 jours après l’héparine, surtout avec thrombose : TIH jusqu’à preuve du contraire.</li><li>4T de 6 ou plus : arrêt de toute héparine, anticoagulant non héparinique, jamais d’AVK ni de plaquettes prophylactiques avant correction ; pas de passage aux HBPM.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/outil/evaluer-la-probabilite-pre-test-du-diagnostic-de-thrombopenies-induites-par-lheparine-score" target="_blank" rel="noopener">La Revue du Praticien — score clinicobiologique des 4T (tableau extrait d’une revue sur la thrombopénie induite par l’héparine)</a>.</p></template>
<template id="pareto-d69-a12" data-pop="pareto-d69-a12" data-title="Loi de Pareto — Pronostic, suivi, critères formels et paramètres clés"><p class="ratio" data-cover="d69-a12"></p><ul><li>PTI : moins de 100 G/L répétés, exclusion des autres causes. TIH : thrombopénie plus anticorps anti-PF4–héparine, probabilité par 4T. Glanzmann : agrégation absente, intégrine αIIbβ3 anormale.</li><li>Paramètres : 20, 30, 50 G/L ; Khellaf supérieur à 8 ; 4T de 6 ou plus ; corticoïdes au plus 8 semaines ; cible 50 à 150 G/L ; IgIV 1 g/kg ; seuils d’accouchement 50 et 70 G/L.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/outil/evaluer-la-probabilite-pre-test-du-diagnostic-de-thrombopenies-induites-par-lheparine-score" target="_blank" rel="noopener">La Revue du Praticien — score clinicobiologique des 4T (tableau extrait d’une revue sur la thrombopénie induite par l’héparine)</a>.</p></template>
<template id="pareto-d69-e01" data-pop="pareto-d69-e01" data-title="Loi de Pareto — Hémogramme, frottis et hémostase"><p class="ratio" data-cover="d69-e01"></p><ul><li>L’hémogramme avec frottis manuel tranche : agrégats (fausse thrombopénie), schizocytes (microangiopathie), autres lignées (moelle), plaquettes géantes (constitutionnel).</li><li>Le tube citraté sous-estime d’environ 10 % ; un TP, un TCA et un fibrinogène normaux éliminent une CIVD ; PFA et temps de saignement sont inutiles.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="pareto-d69-e02" data-pop="pareto-d69-e02" data-title="Loi de Pareto — Examens orientés"><p class="ratio" data-cover="d69-e02"></p><ul><li>Le myélogramme n’est pas une preuve de PTI ; il s’indique selon les signes associés. Le MAIPA est spécifique à 98 % mais sensible à 63 % : négatif, il n’exclut rien.</li><li>H. pylori se recherche chez tout adulte selon Onkopedia, avec une réserve française ; agrégométrie et cytométrie explorent les thrombopathies.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.orpha.net/pdfs/data/patho/Emg/Int/fr/ThrombasthenieGlanzmann_FR_fr_EMG_ORPHA849.pdf" target="_blank" rel="noopener">Orphanet Urgences — Thrombasthénie de Glanzmann : bonnes pratiques en cas d’urgence (2022)</a>.</p></template>
<template id="pareto-d69-e03" data-pop="pareto-d69-e03" data-title="Loi de Pareto — Diagnostic différentiel et tests de la TIH"><p class="ratio" data-cover="d69-e03"></p><ul><li>Le différentiel va de la gravité à la fréquence : purpura fulminans, hémorragie sur thrombopénie profonde, microangiopathie, CIVD, TIH, puis causes graves ou variables.</li><li>TIH : score des 4T, anticorps anti-PF4, test fonctionnel ; l’argatroban allonge l’INR.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/outil/evaluer-la-probabilite-pre-test-du-diagnostic-de-thrombopenies-induites-par-lheparine-score" target="_blank" rel="noopener">La Revue du Praticien — score clinicobiologique des 4T (tableau extrait d’une revue sur la thrombopénie induite par l’héparine)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
<template id="pareto-d69-s01" data-pop="pareto-d69-s01" data-title="Loi de Pareto — Anatomie et histologie"><p class="ratio" data-cover="d69-s01"></p><ul><li>La plaquette naît du mégacaryocyte médullaire et meurt dans la rate et le foie ; la moelle du PTI est de richesse normale.</li><li>Une moelle pauvre, des cellules anormales ou plusieurs lignées touchées font changer de diagnostic ; une image seule ne prouve pas un PTI.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/vascularite-iga-de-ladulte" target="_blank" rel="noopener">Hankard et Audemard-Verger — Vascularite à IgA de l’adulte (Revue du Praticien 2023 ; 73:1124-30)</a>.</p></template>
<template id="pareto-d69-s02" data-pop="pareto-d69-s02" data-title="Loi de Pareto — Physiologie"><p class="ratio" data-cover="d69-s02"></p><ul><li>TPO relativement déficitaire et survie plaquettaire raccourcie dans le PTI ; agrégation indispensable à l’hémostase primaire.</li><li>TIH et PTI sont tous deux thrombogènes ; un concentré plaquettaire apporte 20 à 30 G/L chez l’adulte non immunisé, rarement dans le PTI.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://compendium.ch/product/1189074-thrombozytenkonz-pathogeninaktiv-apherese" target="_blank" rel="noopener">Compendium suisse — Blutspende SRK Schweiz, concentré plaquettaire pathogéninactivé d’aphérèse (page du 10.09.2026)</a>.</p></template>
<template id="pareto-d69-s03" data-pop="pareto-d69-s03" data-title="Loi de Pareto — Immunologie et pharmacologie moléculaire"><p class="ratio" data-cover="d69-s03"></p><ul><li>PTI : auto-anticorps anti-GPIIb/IIIa et GPIb/IX ; TIH : anticorps anti-PF4–héparine ; vascularite : dépôts d’IgA1.</li><li>Les agonistes du récepteur de la TPO agissent sur la production ; l’anti-D bloque la phagocytose splénique ; les cations polyvalents chélatent l’eltrombopag.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680601220019" target="_blank" rel="noopener">Swissmedic — Revolade® (autorisation 60122 ; octobre 2023), information professionnelle</a>.</p></template>
<template id="pareto-d69-p01" data-pop="pareto-d69-p01" data-title="Loi de Pareto — Traitements propres à chaque forme"><p class="ratio" data-cover="d69-p01"></p><ul><li>PTI : prednisone 1 mg/kg plafonnée à 80 mg, IgIV 1 g/kg, TRA avec cible 50 à 150 G/L ; TIH : argatroban, danaparoïde.</li><li>Chaque produit a un statut suisse : indication, hors indication ou non autorisé ; la dose de la fiche suisse et celle de la recommandation peuvent différer.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680601220019" target="_blank" rel="noopener">Swissmedic — Revolade® (autorisation 60122 ; octobre 2023), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680615410017" target="_blank" rel="noopener">Swissmedic — Nplate® (autorisation 61541 ; décembre 2025), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680678930019" target="_blank" rel="noopener">Swissmedic — Doptelet® (autorisation 67893 ; juin 2024), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680583140015" target="_blank" rel="noopener">Swissmedic — Privigen® (autorisation 58314 ; juillet 2025), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Swissmedic — Prednisone Streuli® (autorisation 29349 ; juin 2026), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680628610015" target="_blank" rel="noopener">Swissmedic — Argatra® 100 mg/ml (autorisation 62861 ; juillet 2020), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680518090170" target="_blank" rel="noopener">Swissmedic — Orgaran® (autorisation 51809 ; janvier 2024), information professionnelle</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a>.</p></template>
<template id="pareto-d69-p02" data-pop="pareto-d69-p02" data-title="Loi de Pareto — Sécurité, contre-indications, interactions et surveillance"><p class="ratio" data-cover="d69-p02"></p><ul><li>Eltrombopag : cations, foie, statines ; romiplostim : Child-Pugh 7 ou plus ; IgIV : thrombose, rein, hémolyse, vaccins vivants différés.</li><li>Argatroban : insuffisance hépatique sévère ; acide tranexamique : antécédent de thrombose ou de convulsions ; desmopressine : Willebrand 2B et clairance inférieure à 50 mL/min.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680601220019" target="_blank" rel="noopener">Swissmedic — Revolade® (autorisation 60122 ; octobre 2023), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680615410017" target="_blank" rel="noopener">Swissmedic — Nplate® (autorisation 61541 ; décembre 2025), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680583140015" target="_blank" rel="noopener">Swissmedic — Privigen® (autorisation 58314 ; juillet 2025), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680628610015" target="_blank" rel="noopener">Swissmedic — Argatra® 100 mg/ml (autorisation 62861 ; juillet 2020), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680337410494" target="_blank" rel="noopener">Swissmedic — Cyklokapron® (autorisations 33741 et 52660 ; juin 2026), information professionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527110296" target="_blank" rel="noopener">Swissmedic — Octostim® 15 µg (autorisation 52711 ; novembre 2025), information professionnelle</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p></template>
