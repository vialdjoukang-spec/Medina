<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="i64-e-1"><h2><span class="n">e-1</span>Hiérarchiser les questions sans retarder le traitement</h2>
<p data-src="R3,R6">Les examens sont organisés en parallèle. L’imagerie parenchymateuse détermine la branche initiale, l’imagerie vasculaire cherche une cible de thrombectomie, la biologie vérifie les troubles immédiatement réversibles et les risques. Le bilan étiologique complet vient ensuite, sans être oublié dans la transition entre urgence et hospitalisation.</p>
<table class="t"><thead><tr><th>Examen</th><th>Question</th><th>Limite ou suite</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R6">Scanner sans contraste</td><td data-src="R1,R2,R3,R6">Sang, effet de masse, signes précoces d’ischémie ?</td><td data-src="R1,R2,R3,R6">Peut être normal au début d’un infarctus ; ne donne pas seul toute l’information vasculaire.</td></tr><tr><td data-src="R1,R2,R3,R6">Angio-scanner/angio-IRM</td><td data-src="R1,R2,R3,R6">Occlusion, sténose, dissection ou anomalie vasculaire ?</td><td data-src="R1,R2,R3,R6">Interpréter qualité, territoire et possibilité de traitement ; ne pas confondre artère visible et tissu viable.</td></tr><tr><td data-src="R1,R2,R3,R6">Diffusion et ADC</td><td data-src="R1,R2,R3,R6">Lésion ischémique aiguë compatible ?</td><td data-src="R1,R2,R3,R6">Une restriction doit être contextualisée ; l’absence initiale ne clôt pas une forte suspicion.</td></tr><tr><td data-src="R1,R2,R3,R6">FLAIR et T2*/SWI</td><td data-src="R1,R2,R3,R6">Évolution parenchymateuse et sang ?</td><td data-src="R1,R2,R3,R6">Mismatch DWI/FLAIR utilisé dans certaines sélections, pas horloge exacte.</td></tr><tr><td data-src="R1,R2,R3,R6">Perfusion</td><td data-src="R1,R2,R3,R6">Cœur estimé et volume hypoperfusé ?</td><td data-src="R1,R2,R3,R6">Seuils et logiciels propres à une stratégie ; pas obligation universelle en phase précoce.</td></tr><tr><td data-src="R1,R2,R3,R6">ECG, scope, enregistrement prolongé</td><td data-src="R1,R2,R3,R6">Source rythmique emboligène ?</td><td data-src="R1,R2,R3,R6">Un ECG normal ponctuel n’exclut pas une FA paroxystique.</td></tr><tr><td data-src="R1,R2,R3,R6">Échographie cardiaque</td><td data-src="R1,R2,R3,R6">Thrombus, valve, cavité ou shunt pertinent ?</td><td data-src="R1,R2,R3,R6">Choisir transthoracique/transœsophagienne selon question et risques.</td></tr><tr><td data-src="R1,R2,R3,R6">Biologie ciblée</td><td data-src="R1,R2,R3,R6">Glycémie, hémostase, fonction rénale, trouble ionique ou infection ?</td><td data-src="R1,R2,R3,R6">Interpréter selon médicament, dernière prise et contexte ; pas de panel rare systématique.</td></tr></tbody></table>
</section>
<section class="ilot" id="i64-e-2"><h2><span class="n">e-2</span>Lire un mismatch avec sa population</h2>
<p data-src="R10">Dans la recommandation ESO 2021, pour certains débuts connus entre 4,5 et 9 heures et sans thrombectomie indiquée ou prévue, le mismatch de perfusion retenu associe un cœur <b>inférieur à 70 ml</b>, un ratio volume hypoperfusé/cœur supérieur à 1,2 et une différence supérieure à 10 ml. Les définitions techniques incluent un débit relatif inférieur à 30 % ou un ADC inférieur à 620 µm²/s pour le cœur, et un Tmax supérieur à 6 secondes pour l’hypoperfusion. Ces seuils sont ceux de cette stratégie, pas la définition universelle d’un infarctus.</p>
<p data-src="R10">Pour un AVC au réveil, la sélection par diffusion positive et absence de signal FLAIR marqué ne correspond pas à la même règle temporelle que la perfusion. La stratégie de perfusion discutée par l’ESO utilise notamment une borne de neuf heures à partir du milieu du sommeil. Il faut donc documenter le coucher et le réveil, puis appliquer le protocole exact ; « neuf heures après découverte » serait une autre règle, non démontrée par cette source.</p>
<p data-src="R8,R10">Des essais plus récents évaluent des populations tardives différentes. Leurs critères, le traitement utilisé, la possibilité de thrombectomie et les risques hémorragiques doivent rester attachés au résultat. Une synthèse annuelle ne remplace pas une validation locale ni la FI. La priorité reste de réduire le délai pour tout patient déjà éligible.</p>
<button class="w" data-k="i64-mismatch">Seuils ESO 2021 : ne pas mélanger les stratégies</button></section>
<section class="ilot" id="i64-e-3"><h2><span class="n">e-3</span>Hémostase, contrôle et attribution de la cause</h2>
<p data-src="R1,R2,R15,R16">L’INR est pertinent pour les AVK, mais ne permet pas d’exclure avec fiabilité une concentration active de tous les anticoagulants directs. Nom du produit, dernière prise, fonction rénale et tests adaptés doivent être confrontés. Après idarucizumab, la correction initiale ne dispense pas d’une surveillance : une activité peut réapparaître. Après PCC, contrôler INR et hémostase clinique sans supposer une durée identique chez tous.</p>
<p data-src="R3,R6">Après la phase urgente, le bilan artériel et cardiaque distingue maladie des gros troncs, cardioembolie, petites artères et causes moins fréquentes. Les tests de thrombophilie, auto-immunité, infection, génétique ou cancer sont orientés par âge, histoire, topographie et indices systémiques. Une association statistique ou un anticorps isolé ne prouve pas que la cause de cet AVC est trouvée.</p>
<p data-src="R3,R6">Le résultat doit être transmis dans le dossier de sortie avec ses incertitudes : type d’AVC, territoire, mécanisme retenu, examens encore attendus, prévention choisie et suivi. Si l’incertitude porte seulement sur la cause d’un infarctus démontré, elle ne justifie pas de revenir à l’étiquette I64.</p>
<button class="pareto-btn ui" data-k="pareto-i64-examens">▲ Loi de Pareto — Une question, un examen, une décision</button></section>
<section class="ilot" id="i64-e-4"><h2><span class="n">e-4</span>Scores cliniques : portée d’une performance diagnostique</h2>
<p data-src="R33">Dans une validation ancienne à Glasgow, 1 059 patients admis pour suspicion d’AVC entre mai 1990 et décembre 1993 ont été étudiés ; 991 AVC ont été confirmés par scanner ou autopsie. Aux seuils optimisés, Guy’s Hospital avait une sensibilité pour l’hémorragie de 70 % et une spécificité de 64 %, contre 68 % et 64 % pour Siriraj. Ces résultats appartiennent à cette cohorte historique, pas à tout examen neurologique moderne.</p>
<p data-src="R33">La sensibilité décrit la détection des hémorragies ; une sensibilité insuffisante laisse des hémorragies non reconnues, ce qui est critique avant un antithrombotique. La spécificité décrit l’identification des personnes sans hémorragie. Les auteurs concluent que ces scores ne remplacent pas l’imagerie pour exclure le sang. <button class="w" data-k="i64-scores">Une performance chiffrée doit garder sa population</button>.</p>
</section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="i64-tab-semio" role="tab" aria-selected="true" aria-controls="i64-s-semio" data-s="i64-s-semio">Sémiologie fondamentale et analytique</button><button id="i64-tab-anat" role="tab" aria-selected="false" aria-controls="i64-s-anat" data-s="i64-s-anat">Anatomie</button><button id="i64-tab-histo" role="tab" aria-selected="false" aria-controls="i64-s-histo" data-s="i64-s-histo">Histologie</button><button id="i64-tab-physio" role="tab" aria-selected="false" aria-controls="i64-s-physio" data-s="i64-s-physio">Physiologie</button><button id="i64-tab-immuno" role="tab" aria-selected="false" aria-controls="i64-s-immuno" data-s="i64-s-immuno">Immunologie</button><button id="i64-tab-bio" role="tab" aria-selected="false" aria-controls="i64-s-bio" data-s="i64-s-bio">Biochimie</button></div><div class="chap-body sci-body"><div class="sci" id="i64-s-semio" role="tabpanel" aria-labelledby="i64-tab-semio"><section class="ilot" id="i64-semio-intro"><h2>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h2><p data-src="R3,R6">La sémiologie relie un signe observé à une fonction normale, puis à une localisation et à une décision. Elle complète le chapitre clinique : apprendre les neuf étapes suivantes permet de décrire un déficit sans réduire le patient à un score.</p>
</section><section class="ilot" id="i64-semio-normal" data-semiology="normal"><h3>1. Fonction normale : mouvement, langage, vision et équilibre</h3><p data-src="R6,R24,R26">Une commande motrice efficace dépend des réseaux corticaux, des voies descendantes et de leurs relais. Le langage associe production et compréhension ; la vision utile exige le champ visuel et l’attention ; l’équilibre combine voies vestibulaires, cervelet, sensibilité et motricité. Le système vasculaire fournit l’énergie nécessaire à ces fonctions. Une interruption de perfusion peut donc produire une perte de fonction avant une destruction complète du tissu.</p>
<p data-src="R6">Avant d’interpréter une anomalie, établir l’état antérieur : parésie ancienne, trouble visuel, surdité, langue parlée, cognition et autonomie. Une asymétrie chronique n’a pas le même sens qu’une asymétrie nouvelle, mais peut compliquer la détection d’une lésion récente.</p>
</section><section class="ilot" id="i64-semio-signs" data-semiology="signs"><h3>2. Décrire les signes et les symptômes</h3><table class="t"><thead><tr><th>Domaine</th><th>Description utile</th></tr></thead><tbody><tr><td data-src="R3,R6">Motricité</td><td data-src="R3,R6">Côté, face/bras/jambe, maintien contre pesanteur, dérive et mouvement volontaire.</td></tr><tr><td data-src="R3,R6">Langage</td><td data-src="R3,R6">Compréhension, dénomination, expression ; distinguer aphasie et dysarthrie.</td></tr><tr><td data-src="R3,R6">Vision et attention</td><td data-src="R3,R6">Perte monoculaire ou hémichamp, diplopie, extinction et négligence.</td></tr><tr><td data-src="R3,R6">Sensibilité</td><td data-src="R3,R6">Modalité, territoire, comparaison des côtés et cohérence avec la localisation.</td></tr><tr><td data-src="R3,R6">Coordination et équilibre</td><td data-src="R3,R6">Dysmétrie, ataxie axiale ou des membres, capacité à tenir assis/debout si sûre.</td></tr><tr><td data-src="R3,R6">Vigilance et tronc</td><td data-src="R3,R6">Réactivité, regard, pupilles selon contexte, nerfs crâniens et déglutition.</td></tr></tbody></table>
<p data-src="R6">Noter les signes positifs autant que les pertes : scintillements ou paresthésies progressives peuvent orienter vers une aura, mouvements rythmiques vers une crise. Aucun de ces indices ne suffit isolément à exclure un AVC.</p>
</section><section class="ilot" id="i64-semio-mechanisms" data-semiology="mechanisms"><h3>3. Du mécanisme au déficit</h3><p data-src="R6,R22,R26">La baisse d’apport énergétique perturbe la transmission neuronale. Une zone de pénombre peut perdre sa fonction tout en restant potentiellement viable ; un déficit important n’implique donc pas toujours un cœur déjà très volumineux. À l’inverse, une petite lésion dans un passage dense comme la capsule interne peut avoir un effet moteur marqué.</p>
<p data-src="R6,R7">Dans une HIC, les symptômes reflètent le tissu lésé, l’effet de masse et parfois l’hydrocéphalie. Les signes peuvent ressembler à ceux d’un infarctus du même territoire. Le mécanisme clinique présumé ne remplace pas la preuve radiologique.</p>
</section><section class="ilot" id="i64-semio-examination" data-semiology="examination"><h3>4. Examiner de manière reproductible</h3><p data-src="R3">Observer avant de donner les consignes, puis utiliser une séquence constante : vigilance, orientation et consignes, regard, champs, face, motricité, sensibilité, coordination, langage, articulation et extinction. Le NIHSS demande notamment un maintien des bras pendant dix secondes et des jambes pendant cinq secondes selon ses règles. La cotation doit être apprise avec la méthode complète, pas déduite d’un résumé.</p>
<p data-src="R3,R6">Une personne aphasique peut ne pas comprendre la tâche ; démontrer si approprié, rechercher les réponses non verbales et distinguer absence de compréhension et incapacité motrice. Ne pas faire marcher sans aide une personne avec ataxie sévère. La déglutition fait l’objet d’un dépistage organisé avant toute prise orale.</p>
</section><section class="ilot" id="i64-semio-interpretation" data-semiology="interpretation"><h3>5. Localiser et pondérer</h3><p data-src="R6">Une faiblesse brachiofaciale avec aphasie suggère une atteinte hémisphérique dominante ; une faiblesse proportionnée sans signe cortical évoque une voie profonde ; un signe de nerf crânien ipsilatéral avec déficit corporel controlatéral oriente vers le tronc. La relation est probabiliste : variantes, lésions multiples et tableaux incomplets imposent la confrontation à l’imagerie.</p>
<p data-src="R3,R6">La gravité fonctionnelle n’est pas seulement la somme des items. Une aphasie, une hémianopsie ou une faiblesse de la main dominante peut bouleverser l’autonomie malgré un total limité. Décrire ce que la personne ne peut plus faire rend la décision plus pertinente.</p>
</section><section class="ilot" id="i64-semio-differentials" data-semiology="differentials"><h3>6. Discuter les diagnostics concurrents</h3><p data-src="R6">Hypoglycémie, crise avec déficit postcritique, migraine avec aura, lésion expansive, atteinte vestibulaire périphérique ou trouble fonctionnel peuvent imiter un AVC. Le diagnostic concurrent doit expliquer le mode d’installation, la distribution et l’évolution. Une crise n’exclut pas un AVC causal ; une migraine ancienne n’explique pas automatiquement un tableau nouveau.</p>
<p data-src="R6">Un déficit sensitif avec niveau sur le tronc, un syndrome périphérique ou une compression médullaire appelle une localisation différente. Céphalée brutale et trouble de vigilance peuvent nécessiter une recherche de saignement sous-arachnoïdien ; une thrombose veineuse exige une imagerie veineuse adaptée.</p>
</section><section class="ilot" id="i64-semio-urgency" data-semiology="urgency"><h3>7. Reconnaître ce qui change immédiatement la conduite</h3><p data-src="R1,R2,R3,R6">Altération respiratoire, baisse de vigilance, dysphagie, céphalée nouvelle, aggravation du déficit ou angio-œdème après lyse nécessitent une réponse immédiate. L’apparition de signes du tronc ou une ataxie sévère ne doit pas être minimisée parce que le visage et le bras semblent normaux. Une fluctuation peut traduire un processus instable, pas une guérison acquise.</p>
<p data-src="R3,R11">Transmettre une phrase structurée : début/dernier état normal, déficit actuel, glycémie, anticoagulant et dernière prise, autonomie antérieure, évolution. Cette information permet au réseau de préparer une décision avant l’arrivée.</p>
</section><section class="ilot" id="i64-semio-limits" data-semiology="limits"><h3>8. Connaître les limites de l’examen</h3><p data-src="R3,R6">La fatigue, la douleur, la langue, les troubles sensoriels, l’intubation et les déficits anciens affectent l’évaluation. Le NIHSS favorise certains déficits antérieurs et ne capture pas toute la circulation postérieure. Un examen rapide peut être incomplet ; le répéter avec une meilleure coopération est utile, sans retarder l’imagerie urgente.</p>
<p data-src="R6">Ni une clinique typique ni l’absence de signe méningé ou de céphalée ne sépare sûrement infarctus et hémorragie. Un scanner initial normal n’est pas un test d’exclusion universel. Ces limites doivent être écrites dans le dossier au lieu d’être converties en certitudes.</p>
</section><section class="ilot" id="i64-semio-sources" data-semiology="sources"><h3>9. Sources, apprentissage et transfert clinique</h3><p data-src="R3,R6,R13">L’examen et les scores reposent ici sur les passages relus du réseau bernois 2026 et du Collège des enseignants de neurologie ; l’organisation préhospitalière sur la Société cérébrovasculaire suisse. Les repères anatomiques proviennent de planches humaines historiques identifiées. Le geste clinique et la cotation standardisée requièrent un apprentissage supervisé.</p>
<p data-src="R3,R6">Auto-relecture par l’auteur : cette synthèse n’est ni une observation réelle de patient ni une validation médicale indépendante. Les vignettes sont fictives et les mesures de contenu décrivent le fichier, pas une compétence clinique certifiée.</p>
</section></div><div class="sci" id="i64-s-anat" role="tabpanel" aria-labelledby="i64-tab-anat" hidden><section class="ilot" id="i64-s-anat-cours"><h3>Anatomie : quatre artères d’apport, des communications variables</h3><p data-src="R6,R26">Les deux carotides internes alimentent surtout la circulation antérieure ; les deux vertébrales se réunissent en tronc basilaire pour la circulation postérieure. Les artères communicantes relient les systèmes au cercle de Willis, mais un cercle anatomiquement complet n’est pas constant. Les anastomoses piales et certaines communications avec le réseau carotidien externe peuvent aussi soutenir la perfusion.</p>
<figure data-src="R23,R6"><img src="assets/img/i64/alpha/codex/Gray516.png" width="600" loading="lazy" alt="Planche humaine historique montrant les carotides internes, les artères cérébrales et le système vertébrobasilaire"><figcaption>Artères de la base du cerveau humain — Gray/Carter, Anatomy of the Human Body, 1918, figure 516. Une partie temporale et cérébelleuse est retirée dans la vue originale. Domaine public ; pixels originaux inchangés, repères français adjacents.</figcaption><table class="t"><thead><tr><th>Repère visible dans l’original</th><th>Lecture clinique</th></tr></thead><tbody><tr><td data-src="R23,R6">1 — Internal carotid</td><td data-src="R23,R6">La carotide interne alimente notamment les artères cérébrales antérieure et moyenne ; la branche ophtalmique explique le lien avec l’ischémie rétinienne.</td></tr><tr><td data-src="R23,R6">2 — Anterior communicating</td><td data-src="R23,R6">La communicante antérieure relie les deux côtés ; son existence anatomique ne garantit pas une compensation efficace.</td></tr><tr><td data-src="R23,R6">3 — Basilar / vertebral</td><td data-src="R23,R6">Les vertébrales rejoignent le tronc basilaire, au contact du tronc cérébral ; une atteinte postérieure peut produire diplopie, dysphagie ou syndrome alterne.</td></tr><tr><td data-src="R23,R6">4 — Posterior cerebral</td><td data-src="R23,R6">Les cérébrales postérieures participent aux territoires visuels et profonds. La planche de base ne montre pas toute la distribution corticale.</td></tr></tbody></table>
</figure><p data-src="R6,R26">La clinique dépend du territoire effectivement privé de débit, pas seulement du nom de l’artère proximale. Les branches profondes desservent des voies compactes ; les branches corticales rejoignent des fonctions distribuées. Une atteinte du tronc peut juxtaposer noyaux de nerfs crâniens et voies longues, produisant des signes croisés.</p>
<figure data-src="R24,R6"><img src="assets/img/i64/alpha/codex/Gray764.png" width="407" loading="lazy" alt="Schéma anatomique humain historique du trajet moteur depuis le cortex vers la moelle, avec capsule interne et décussation pyramidale"><figcaption>Voie motrice descendante et croisement — Gray/Carter, 1918, figure 764, schéma modifié d’après Poirier. Domaine public ; pixels originaux inchangés, repères français adjacents.</figcaption><table class="t"><thead><tr><th>Repère visible dans l’original</th><th>Lecture clinique</th></tr></thead><tbody><tr><td data-src="R24,R6">1 — Cortex</td><td data-src="R24,R6">Une atteinte corticale motrice peut associer faiblesse et signes de fonctions voisines, comme une aphasie ou une négligence.</td></tr><tr><td data-src="R24,R6">2 — Internal capsule</td><td data-src="R24,R6">La concentration des fibres aide à comprendre une hémiparésie proportionnée, même avec une petite lésion profonde.</td></tr><tr><td data-src="R24,R6">3 — Pyramidal decussation</td><td data-src="R24,R6">Le croisement explique la faiblesse controlatérale après une lésion cérébrale située au-dessus ; la figure reste un schéma des voies principales.</td></tr><tr><td data-src="R24,R6">4 — Spinal cord</td><td data-src="R24,R6">Le trajet médullaire rappelle qu’une faiblesse n’est pas toujours cérébrale : niveau sensitif et contexte imposent une autre localisation.</td></tr></tbody></table>
</figure><p data-src="R24,R6">La planche motrice est un dessin humain historique : elle simplifie la trajectoire et ne prétend pas cartographier tous les réseaux. Les annotations ajoutées expliquent le lien entre cortex, capsule et croisement, sans modifier les pixels ni créer une pseudo-imagerie pathologique.</p>
</section></div><div class="sci" id="i64-s-histo" role="tabpanel" aria-labelledby="i64-tab-histo" hidden><section class="ilot" id="i64-s-histo-cours"><h3>Histologie : l’unité neurovasculaire, pas le neurone seul</h3><p data-src="R26,R27">L’unité neurovasculaire associe neurones, cellules endothéliales, péricytes, astrocytes, membrane basale et matrice extracellulaire. Les cellules musculaires lisses artériolaires participent au réglage du calibre ; oligodendrocytes et microglie répondent aussi à l’agression. Une lésion vasculaire engage donc plusieurs tissus et interfaces, et ne se résume pas à un nombre de neurones détruits.</p>
<table class="t"><thead><tr><th>Structure normale</th><th>Fonction</th><th>Conséquence d’une atteinte</th></tr></thead><tbody><tr><td data-src="R26,R27">Endothélium à jonctions serrées</td><td data-src="R26,R27">Régulation des échanges sang-parenchyme.</td><td data-src="R26,R27">Une perméabilité accrue favorise l’œdème vasogénique et modifie le passage de molécules/cellules.</td></tr><tr><td data-src="R26,R27">Péricytes, lame basale et interfaces astrocytaires</td><td data-src="R26,R27">Organisation et soutien de l’unité microvasculaire.</td><td data-src="R26,R27">L’ischémie perturbe la coopération entre circulation et tissu.</td></tr><tr><td data-src="R26,R27">Cellules musculaires artériolaires</td><td data-src="R26,R27">Modification active du diamètre et des résistances.</td><td data-src="R26,R27">La réserve vasculaire devient insuffisante ou altérée.</td></tr><tr><td data-src="R26,R27">Oligodendrocytes et axones myélinisés</td><td data-src="R26,R27">Conduction dans la substance blanche.</td><td data-src="R26,R27">Une atteinte de petite artère peut léser des voies longues et produire un handicap important.</td></tr><tr><td data-src="R26,R27">Microglie et astrocytes</td><td data-src="R26,R27">Surveillance, nettoyage, réponse inflammatoire et réparation.</td><td data-src="R26,R27">La réponse peut aider la réparation ou contribuer à une lésion secondaire selon contexte.</td></tr></tbody></table>
<p data-src="R6,R26">La maladie chronique des petites artères, notamment liée à l’HTA et à la lipohyalinose, altère les perforantes et la substance blanche. Une occlusion peut produire un petit infarctus profond ; une rupture peut donner une HIC profonde. Ces mécanismes rendent plausible une association, sans permettre de conclure à la cause sur la seule topographie.</p>
<p data-src="R27">L’œdème <b>cytotoxique</b> correspond principalement à une perturbation cellulaire et des mouvements d’eau intracellulaires ; l’œdème <b>vasogénique</b> implique un passage accru depuis les vaisseaux vers l’espace extracellulaire. Ils peuvent se succéder ou coexister. La diffusion et les séquences structurales renseignent sur ces phénomènes, mais une image n’est pas une coupe histologique directe.</p>
<p data-src="R23,R24,R27">Les figures de cette leçon sont anatomiques, pas histologiques. Aucun dessin de vaisseau généré par IA ni image animale n’est présenté comme tissu humain. L’histologie est exposée par le texte et le tableau ; une biopsie cérébrale n’est pas un examen de routine d’un AVC aigu.</p>
</section></div><div class="sci" id="i64-s-physio" role="tabpanel" aria-labelledby="i64-tab-physio" hidden><section class="ilot" id="i64-s-physio-cours"><h3>Physiologie : pression, résistance, gaz et métabolisme</h3><p data-src="R26">Le débit sanguin cérébral dépend de la pression de perfusion et de la résistance vasculaire : <b>DSC = PPC / RVC</b> exprime la relation générale. L’autorégulation ajuste le calibre pour amortir des variations de pression. Les collatérales redistribuent le débit si une voie se ferme, avec une efficacité très variable selon l’anatomie et la maladie vasculaire.</p>
<p data-src="R26">Les repères moyens de débit et les limites de la courbe d’autorégulation enseignés en physiologie ne sont pas des prescriptions de PA pour un patient en AVC. Le cerveau lésé peut avoir perdu sa réserve ; une baisse de pression peut alors diminuer directement le débit dans un territoire dépendant des collatérales. À l’inverse, une pression élevée peut favoriser certains dommages hémorragiques.</p>
<table class="t"><thead><tr><th>Régulation normale</th><th>Lien clinique</th></tr></thead><tbody><tr><td data-src="R26">CO2</td><td data-src="R26">L’hypercapnie dilate les vaisseaux et l’hypocapnie les contracte ; les changements ventilatoires modifient donc le débit.</td></tr><tr><td data-src="R26">Oxygène</td><td data-src="R26">Une hypoxie importante déclenche une vasodilatation, mais ne garantit pas un apport suffisant si le vaisseau est obstrué.</td></tr><tr><td data-src="R26">Couplage neurovasculaire</td><td data-src="R26">L’activité neuronale augmente localement les besoins et le débit, avec participation de signaux comme potassium et NO.</td></tr><tr><td data-src="R26">Extraction d’oxygène</td><td data-src="R26">Elle peut augmenter initialement lorsque le débit baisse ; cette compensation a des limites.</td></tr><tr><td data-src="R26">Silence fonctionnel de la pénombre</td><td data-src="R26">Une perte de fonction peut précéder une lésion irréversible, ce qui justifie la rapidité de reperfusion.</td></tr></tbody></table>
<p data-src="R7,R26">La conséquence thérapeutique est une stratégie contextualisée : éviter l’abaissement intensif avant typage, contrôler la PA pour une IVT, ne pas viser systématiquement moins de 140 après thrombectomie réussie, et discuter une cible plus basse dans certaines HIC. La physiologie explique pourquoi les recommandations diffèrent ; elle ne remplace pas leurs populations et leurs limites.</p>
<button class="w" data-k="i64-autoregulation">Pourquoi la pression ne suffit pas à décrire la perfusion</button></section></div><div class="sci" id="i64-s-immuno" role="tabpanel" aria-labelledby="i64-tab-immuno" hidden><section class="ilot" id="i64-s-immuno-cours"><h3>Immunologie : réponse à la lésion et diagnostics concurrents</h3><p data-src="R27">La microglie est une population de macrophages résidents du SNC. Elle phagocyte les débris, présente des antigènes et produit des médiateurs ; son état évolue selon l’environnement. Il est réducteur de la classer une fois pour toutes comme « bonne » ou « mauvaise ». Les astrocytes participent à la réponse et à la cicatrice gliale ; les oligodendrocytes peuvent être vulnérables à l’environnement inflammatoire.</p>
<p data-src="R27">Après une lésion ischémique ou hémorragique, une réponse inflammatoire peut nettoyer le tissu et soutenir sa réparation, mais une réponse excessive peut augmenter le dommage secondaire. Les modifications de barrière facilitent l’entrée de cellules périphériques. La présence d’inflammation ne signifie donc pas que l’AVC est une maladie auto-immune, ni qu’une immunosuppression doit être prescrite à tous.</p>
<p data-src="R6,R27">Une vascularite, un syndrome des antiphospholipides ou une infection comme l’endocardite peut aussi être une cause de lésion vasculaire. Le diagnostic repose sur des indices cliniques, biologiques et d’imagerie cohérents ; un marqueur isolé n’établit pas l’attribution. Les explorations invasives ou immunologiques sont ciblées, après prise en charge de l’urgence.</p>
<p data-src="R4">Les anticorps anti-amyloïdes introduisent une autre interaction : une ARIA peut produire œdème ou lésions hémorragiques et mimer un AVC, tout en pouvant coexister avec une occlusion. La recommandation suisse privilégie une IRM adaptée avant la discussion de lyse et une appréciation particulièrement prudente. Ce signal thérapeutique ne se généralise pas à tous les anticorps utilisés en médecine.</p>
<p data-src="R21,R27">Comprendre une voie inflammatoire ne prouve pas qu’un médicament l’inhibant améliore l’autonomie après AVC. La séparation entre plausibilité biologique, résultat radiologique et résultat clinique protège contre les promesses de neuroprotection non démontrées.</p>
</section></div><div class="sci" id="i64-s-bio" role="tabpanel" aria-labelledby="i64-tab-bio" hidden><section class="ilot" id="i64-s-bio-cours"><h3>Biochimie : énergie, excitotoxicité et hémostase</h3><p data-src="R22,R26">Le métabolisme cérébral dépend de l’oxygène et du glucose pour maintenir l’ATP. Lors d’une hypoxie-aglycémie expérimentale, la chute d’ATP perturbe les transports du glutamate et favorise son accumulation extracellulaire. L’activation de récepteurs NMDA augmente l’entrée de calcium ; radicaux libres, protéases, endonucléases et voies de mort cellulaire peuvent ensuite être engagés.</p>
<p data-src="R22">La temporalité varie selon les cellules et les modèles. La vulnérabilité différente de neurones hippocampiques CA1 et CA3 chez l’animal illustre cette complexité ; elle ne fournit pas un délai de viabilité applicable à tout patient. Les antagonistes NMDA prometteurs en expérimentation n’ont pas produit le bénéfice clinique attendu, notamment en raison de différences de modèles, de délai et d’effets sur les circuits sains.</p>
<table class="t"><thead><tr><th>Cible biochimique</th><th>Intervention</th><th>Limite clinique</th></tr></thead><tbody><tr><td data-src="R1,R2,R15,R16,R18,R20">Plasminogène et fibrine</td><td data-src="R1,R2,R15,R16,R18,R20">Altéplase/ténectéplase favorisent la génération de plasmine et la lyse du thrombus.</td><td data-src="R1,R2,R15,R16,R18,R20">Risque hémorragique ; produit, dose et fenêtre spécifiques.</td></tr><tr><td data-src="R1,R2,R15,R16,R18,R20">Dabigatran</td><td data-src="R1,R2,R15,R16,R18,R20">Idarucizumab le lie et neutralise son activité.</td><td data-src="R1,R2,R15,R16,R18,R20">Ne neutralise pas tous les anticoagulants ; rebond possible.</td></tr><tr><td data-src="R1,R2,R15,R16,R18,R20">Facteurs II, VII, IX, X</td><td data-src="R1,R2,R15,R16,R18,R20">PCC apporte des facteurs dépendants de la vitamine K.</td><td data-src="R1,R2,R15,R16,R18,R20">Surveiller correction et thrombose ; la vitamine K soutient la synthèse ultérieure.</td></tr><tr><td data-src="R1,R2,R15,R16,R18,R20">Thromboxane plaquettaire</td><td data-src="R1,R2,R15,R16,R18,R20">Aspirine réduit irréversiblement sa synthèse.</td><td data-src="R1,R2,R15,R16,R18,R20">Antiagrégant, pas dissolution immédiate d’un gros thrombus ni traitement d’une HIC.</td></tr><tr><td data-src="R1,R2,R15,R16,R18,R20">Activation du clopidogrel</td><td data-src="R1,R2,R15,R16,R18,R20">Métabolisme impliquant CYP2C19.</td><td data-src="R1,R2,R15,R16,R18,R20">Interactions comme oméprazole/ésoméprazole pouvant diminuer l’effet.</td></tr></tbody></table>
<p data-src="R1,R2,R15,R16">Les unités rendent le mécanisme praticable : mg/kg pour une dose pondérale, mg/ml pour une concentration, UI de facteur IX pour le PCC, grammes pour l’idarucizumab. Une même apparence de flacon ne rend pas les unités interchangeables. La pharmacologie relie chaque unité à son produit et à une surveillance.</p>
<button class="w" data-k="i64-energie">Du défaut énergétique au déficit</button></section></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="i64-p-1"><h2><span class="n">p-1</span>Choisir selon la branche, puis vérifier le produit</h2>
<p data-src="R1,R2,R3,R15,R16">La pharmacologie ne traite pas un code isolé. Elle répond à une situation : reperfuser un infarctus éligible, contrôler une pression dans un contexte défini, neutraliser une anticoagulation dangereuse ou prévenir une récidive après bilan. Les tableaux suivants sont des repères pédagogiques issus des FI suisses réellement relues ; ils n’abolissent ni l’évaluation individuelle ni le protocole du centre.</p>
<table class="t"><thead><tr><th>Objectif</th><th>Produit ou stratégie</th><th>Condition</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R15,R16,R17">Thrombolyse</td><td data-src="R1,R2,R3,R15,R16,R17">Actilyse ou Metalyse 5 000 U</td><td data-src="R1,R2,R3,R15,R16,R17">Infarctus éligible, hémorragie exclue ; dose et CI propres au produit.</td></tr><tr><td data-src="R1,R2,R3,R15,R16,R17">Réversion dabigatran</td><td data-src="R1,R2,R3,R15,R16,R17">Praxbind</td><td data-src="R1,R2,R3,R15,R16,R17">Hémorragie incontrôlée/menaçante ou geste urgent selon FI.</td></tr><tr><td data-src="R1,R2,R3,R15,R16,R17">Réversion AVK</td><td data-src="R1,R2,R3,R15,R16,R17">Beriplex P/N et vitamine K selon produit</td><td data-src="R1,R2,R3,R15,R16,R17">Correction urgente avec surveillance clinique et biologique.</td></tr><tr><td data-src="R1,R2,R3,R15,R16,R17">Contrôle tensionnel IV</td><td data-src="R1,R2,R3,R15,R16,R17">Urapidil Stragen selon protocole</td><td data-src="R1,R2,R3,R15,R16,R17">Cible dépendant du type d’AVC et de la reperfusion ; titration.</td></tr><tr><td data-src="R1,R2,R3,R15,R16,R17">Prévention secondaire</td><td data-src="R1,R2,R3,R15,R16,R17">Antiagrégant, anticoagulant ou traitement lipidique ciblé</td><td data-src="R1,R2,R3,R15,R16,R17">Cause, délai et risque établis ; aucune prescription automatique pour tout I64.</td></tr></tbody></table>
<div class="key" data-src="R1,R2">Les unités d’activité des thrombolytiques ne sont pas interchangeables. Vérifier nom, indication, concentration, poids, dose totale et volume avec un contrôle indépendant au sein de l’équipe de soins. Cette auto-relecture pédagogique n’est pas ce contrôle clinique.</div>
</section>
<section class="ilot" id="i64-p-2"><h2><span class="n">p-2</span>Actilyse — altéplase, FI suisse de juin 2025</h2>
<p data-src="R1">L’altéplase est un activateur recombinant du plasminogène : son interaction avec la fibrine favorise la formation de plasmine et la dissolution du thrombus. L’effet recherché expose aussi au saignement. Le schéma d’AVC diffère des schémas d’infarctus myocardique et d’embolie pulmonaire ; Cathflo 2 mg destiné aux cathéters ne doit pas être confondu avec ce traitement.</p>
<table class="t"><thead><tr><th>Élément</th><th>FI AVC</th></tr></thead><tbody><tr><td data-src="R1">Dose</td><td data-src="R1">0,9 mg/kg, maximum 90 mg ; 10 % en bolus IV, puis 90 % en perfusion sur 60 minutes.</td></tr><tr><td data-src="R1">Fenêtre</td><td data-src="R1">Commencer dans les 4,5 heures suivant le dernier état connu asymptomatique ; exclure l’hémorragie intracrânienne.</td></tr><tr><td data-src="R1">Reconstitution standard</td><td data-src="R1">10, 20 ou 50 mg avec respectivement 10, 20 ou 50 ml d’eau pour préparations injectables : 1 mg/ml.</td></tr><tr><td data-src="R1">Dilution complémentaire</td><td data-src="R1">NaCl 0,9 % possible jusqu’à une concentration minimale de 0,2 mg/ml ; nouvelle dilution par eau ou glucose non recommandée en raison du risque de turbidité.</td></tr><tr><td data-src="R1">Compatibilité</td><td data-src="R1">Pas de mélange avec d’autres médicaments, y compris héparine, dans le flacon ou la même voie ; administration contrôlée par dispositif précis.</td></tr><tr><td data-src="R1">Inspection et conservation pratique</td><td data-src="R1">Solution claire, incolore à jaune pâle, sans particules ; employer immédiatement après préparation selon les instructions relues, éliminer le reliquat.</td></tr></tbody></table>
<p data-src="R1"><b>Exemple arithmétique pédagogique :</b> pour 70 kg, la dose totale est de 63 mg, dont 6,3 mg en bolus puis 56,7 mg sur une heure. À 1 mg/ml, les volumes sont numériquement identiques en ml. Cet exemple ne constitue pas une décision d’éligibilité. Un poids estimé avec erreur, une mauvaise concentration ou un reliquat de tubulure peuvent modifier la dose réellement délivrée.</p>
<table class="t"><thead><tr><th>Risque ou population</th><th>Conséquence</th></tr></thead><tbody><tr><td data-src="R1">Saignement actif, hémorragie intracrânienne suspectée ou prouvée, risque hémorragique majeur</td><td data-src="R1">Contre-indications à vérifier dans la FI complète ; une imagerie négative ne supprime pas les risques extracrâniens.</td></tr><tr><td data-src="R1">AVK avec INR supérieur à 1,3 ; héparine récente avec TCA allongé</td><td data-src="R1">CI selon les conditions exactes de la FI ; ne pas substituer le seuil d’un autre protocole.</td></tr><tr><td data-src="R1">Plaquettes inférieures à 100 000/mm³ ; AVC sévère avec NIHSS supérieur à 25 cité en exemple</td><td data-src="R1">La FI comporte des restrictions spécifiques ; l’évaluation moderne de reperfusion et un protocole local peuvent différer, à expliciter.</td></tr><tr><td data-src="R1">Déficit mineur ou amélioration rapide</td><td data-src="R1">Restriction figurant dans la FI ; un déficit restant invalidant demande une discussion spécialisée, pas une décision par le mot « mineur ». </td></tr><tr><td data-src="R1">Glycémie très basse ou très haute</td><td data-src="R1">La FI traite les valeurs inférieures à 2,8 ou supérieures à 22,2 mmol/L dans les précautions ; corriger et réévaluer, sans les déplacer arbitrairement dans une autre rubrique.</td></tr><tr><td data-src="R1">Fonctions rénale/hépatique</td><td data-src="R1">Pas de données cliniques spécifiques pour une formule d’ajustement ; atteinte hépatique sévère contre-indiquée.</td></tr><tr><td data-src="R1">Âge</td><td data-src="R1">Moins de 16 ans : contre-indiqué ; dès 16 ans, appliquer les dispositions et l’évaluation bénéfice-risque de la FI.</td></tr><tr><td data-src="R1">Grossesse/allaitement</td><td data-src="R1">En cas de situation menaçant le pronostic vital, peser bénéfice et risque ; interruption de l’allaitement pendant 24 heures à envisager.</td></tr></tbody></table>
<p data-src="R1">Surveiller saignement, constantes et état neurologique. L’angio-œdème peut compromettre les voies aériennes, notamment sous inhibiteur de l’enzyme de conversion. Devant une réaction sévère ou un saignement préoccupant, interrompre une perfusion en cours et appliquer le protocole d’urgence. Les antiagrégants et l’héparine IV sont évités pendant les 24 premières heures ; la FI prévoit une possibilité limitée d’héparine sous-cutanée pour une autre indication, qui ne doit pas devenir une anticoagulation curative automatique.</p>
<button class="w" data-k="i64-alteplase">Altéplase : calcul et sécurité</button></section>
<section class="ilot" id="i64-p-3"><h2><span class="n">p-3</span>Metalyse 5 000 U — ténectéplase, FI suisse de mai 2025</h2>
<p data-src="R2,R9">La ténectéplase est un dérivé du t-PA à spécificité accrue pour la fibrine et résistance accrue à PAI-1. Pour l’AVC, la présentation relue est le flacon de <b>25 mg, soit 5 000 U</b>. Reconstituer avec 5 ml d’eau stérile pour préparations injectables, soit 5 mg/ml. Le bolus IV dure 5 à 10 secondes. La dose est administrée dans les 4,5 heures suivant le dernier état connu asymptomatique, après exclusion de l’hémorragie.</p>
<table class="t"><thead><tr><th>Poids selon FI suisse</th><th>Dose</th><th>Volume à 5 mg/ml</th></tr></thead><tbody><tr><td data-src="R2">Moins de 60 kg</td><td data-src="R2">15 mg</td><td data-src="R2">3 ml</td></tr><tr><td data-src="R2">60 à moins de 70 kg</td><td data-src="R2">17,5 mg</td><td data-src="R2">3,5 ml</td></tr><tr><td data-src="R2">70 à moins de 80 kg</td><td data-src="R2">20 mg</td><td data-src="R2">4 ml</td></tr><tr><td data-src="R2">80 à moins de 90 kg</td><td data-src="R2">22,5 mg</td><td data-src="R2">4,5 ml</td></tr><tr><td data-src="R2">90 kg ou plus</td><td data-src="R2">25 mg</td><td data-src="R2">5 ml</td></tr></tbody></table>
<div class="trap" data-src="R2,R3,R9"><b>Trois éléments à ne pas fusionner.</b> La FI suisse utilise ces paliers. L’ESO 2023 recommande 0,25 mg/kg, maximum 25 mg, et déconseille 0,4 mg/kg. Le tableau bernois extrait affiche 17 mg pour 3,5 ml dans un palier ; à la concentration indiquée, la FI donne 17,5 mg. La dose FI est conservée et l’anomalie locale est signalée, sans modifier le document source.</div>
<table class="t"><thead><tr><th>Domaine</th><th>Repère de sécurité</th></tr></thead><tbody><tr><td data-src="R2">Voie et compatibilité</td><td data-src="R2">Ligne compatible NaCl 0,9 %, rinçage au NaCl ; pas de glucose, d’héparine ou d’autre médicament mélangé.</td></tr><tr><td data-src="R2">Contre-indications</td><td data-src="R2">Hémorragie ou risque hémorragique majeur, anticoagulation AVK effective avec INR supérieur à 1,3, certaines lésions intracrâniennes, atteinte hépatique sévère ; vérifier la liste intégrale.</td></tr><tr><td data-src="R2">AVC non invalidant</td><td data-src="R2">Contre-indication de la FI ; distinguer faible score et déficit réellement non invalidant.</td></tr><tr><td data-src="R2">Précautions spécifiques</td><td data-src="R2">AVC très sévère, plaquettes basses, TCA prolongé, chirurgie/trauma récents ou glycémie extrême sont discutés dans les précautions selon cette FI ; ne pas recopier la colonne Actilyse.</td></tr><tr><td data-src="R2">Moins de 18 ans</td><td data-src="R2">Utilisation non recommandée ; absence de transposition automatique de l’adulte.</td></tr><tr><td data-src="R2">Grossesse/allaitement</td><td data-src="R2">Seulement si nécessité évidente ; éliminer le lait produit pendant les 24 heures après traitement.</td></tr><tr><td data-src="R2">Surveillance</td><td data-src="R2">Saignement et angio-œdème, notamment sous IEC ; surveillance clinique et tensionnelle, accès immédiat aux moyens de réanimation.</td></tr></tbody></table>
<p data-src="R2">La FI ne fournit pas ici de réduction rénale forfaitaire permettant d’adapter les paliers à la créatinine ; évaluer le risque et les médicaments associés. Les données de demi-vie mesurées dans l’infarctus myocardique ne sont pas présentées comme une mesure spécifique de tous les patients AVC. Un bolus administré ne peut pas être « arrêté » ensuite comme une perfusion : la préparation et le contrôle préalable sont essentiels.</p>
<button class="w" data-k="i64-tenecteplase">Paliers suisses et formule européenne</button></section>
<section class="ilot" id="i64-p-4"><h2><span class="n">p-4</span>Praxbind — idarucizumab et dabigatran</h2>
<p data-src="R15,R21">L’idarucizumab est un fragment d’anticorps qui lie le dabigatran et neutralise son activité. Sa FI vise les adultes sous Pradaxa nécessitant une réversion urgente pour saignement incontrôlé ou menaçant le pronostic vital, ou avant opération/procédure urgente. L’ESO 2025 soutient son usage immédiat dans l’HIC associée au dabigatran, tout en distinguant le consensus clinique de l’absence d’essai randomisé dans cette situation.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>FI suisse</th></tr></thead><tbody><tr><td data-src="R15">Dose</td><td data-src="R15">5 g IV : deux flacons de 2,5 g/50 ml, administrés successivement en perfusions de 5–10 minutes chacune ou en bolus.</td></tr><tr><td data-src="R15">Surveillance</td><td data-src="R15">Clinique du saignement et tests adaptés : temps de thrombine dilué, ECT ou TCA selon disponibilité et interprétation.</td></tr><tr><td data-src="R15">Nouvelle dose</td><td data-src="R15">Peut être envisagée dans les situations définies de récidive/risque de saignement ou nouvelle procédure urgente, avec coagulation prolongée ; pas répétition systématique.</td></tr><tr><td data-src="R15">Rebond</td><td data-src="R15">Une activité anticoagulante peut réapparaître, notamment dans les 12–24 heures ; surveiller au-delà de la première correction.</td></tr><tr><td data-src="R15">Rein/foie/âge</td><td data-src="R15">Pas d’ajustement pour âge ni insuffisance rénale légère/modérée ; données limitées en insuffisance rénale sévère dans la FI relue ; pas d’ajustement hépatique.</td></tr><tr><td data-src="R15">Précautions</td><td data-src="R15">Hypersensibilité possible ; sorbitol important en cas d’intolérance héréditaire au fructose. L’absence de CI formelle ne signifie pas absence de risque.</td></tr><tr><td data-src="R15">Grossesse/allaitement</td><td data-src="R15">Données insuffisantes ; bénéfice-risque et décision individualisée.</td></tr></tbody></table>
<p data-src="R15">La réversion expose de nouveau au risque thrombotique qui avait motivé l’anticoagulation ; la reprise est décidée selon hémostase et contexte. Les événements d’une série non comparative ne prouvent pas tous une causalité du produit. L’idarucizumab ne neutralise pas l’apixaban, le rivaroxaban ou les AVK. Une stratégie de réversion avant thrombolyse est une décision neurovasculaire spécifique et ne découle pas mécaniquement de cette table d’HIC.</p>
<button class="w" data-k="i64-praxbind">Un antidote spécifique, pas universel</button></section>
<section class="ilot" id="i64-p-5"><h2><span class="n">p-5</span>Beriplex P/N et vitamine K : corriger les facteurs</h2>
<p data-src="R16">Beriplex P/N est un concentré humain de facteurs II, VII, IX et X avec protéines C et S. Dans une réversion urgente d’AVK, la dose dépend de l’INR initial, du poids et du but clinique. Les unités de dose sont celles du facteur IX ; elles ne sont ni des milligrammes ni des unités de vitamine K.</p>
<table class="t"><thead><tr><th>INR initial</th><th>Dose FI</th><th>Volume de solution reconstituée</th></tr></thead><tbody><tr><td data-src="R16">2,0–3,9</td><td data-src="R16">25 UI FIX/kg</td><td data-src="R16">1 ml/kg</td></tr><tr><td data-src="R16">4,0–6,0</td><td data-src="R16">35 UI FIX/kg</td><td data-src="R16">1,4 ml/kg</td></tr><tr><td data-src="R16">Supérieur à 6,0</td><td data-src="R16">50 UI FIX/kg</td><td data-src="R16">2 ml/kg</td></tr></tbody></table>
<p data-src="R16">La FI recommande de ne pas dépasser une dose unique de 5 000 UI FIX. Le débit maximal est de 3 UI/kg/min, sans dépasser 210 UI/min, soit environ 8 ml/min. Contrôler l’INR, avec objectif de normalisation décrit sous 1,3, et surtout le saignement. La réponse et sa durée varient ; une répétition systématique n’est pas soutenue par les données de la FI.</p>
<p data-src="R16,R21,R31">Envisager une vitamine K associée pour maintenir la correction : le PCC apporte des facteurs immédiatement, tandis que la synthèse dépendante de vitamine K prend du temps. Le consensus ESO 2025 fournit un schéma de PCC et vitamine K qui n’est pas identique à toutes les tables de produit. La FI adulte Konakion MM 10 mg/ml a été vérifiée séparément de la fiche pédiatrique, car une recherche par GTIN partagé pouvait renvoyer au mauvais titre. La version affichée est janvier 2022, complétée par le signal Swissmedic de juillet 2026.</p>
<table class="t"><thead><tr><th>Risque</th><th>Conduite</th></tr></thead><tbody><tr><td data-src="R16">Hypersensibilité ou antécédent de HIT</td><td data-src="R16">Contre-indications du produit ; vérifier la présence d’héparine et l’histoire.</td></tr><tr><td data-src="R16">Thrombose ou coagulation intravasculaire disséminée</td><td data-src="R16">Peser le risque, surveiller ; en coagulopathie de consommation, utiliser après interruption du processus selon FI.</td></tr><tr><td data-src="R16">Maladie hépatique, terrain vasculaire, période périopératoire</td><td data-src="R16">Surveillance étroite ; aucune formule rénale/hépatique arbitraire ajoutée.</td></tr><tr><td data-src="R16">Grossesse/allaitement</td><td data-src="R16">Pas d’étude suffisante ; apprécier le bénéfice et le risque.</td></tr><tr><td data-src="R16">Produit plasmatique humain</td><td data-src="R16">Traçabilité et précautions du produit ; risque infectieux résiduel non déclaré nul.</td></tr></tbody></table>
<table class="t"><thead><tr><th>Konakion MM adulte, FI janvier 2022</th><th>Hémorragie grave ou menaçant le pronostic vital sous AVK</th></tr></thead><tbody><tr><td data-src="R31,R16">Phenprocoumone ou warfarine</td><td data-src="R31,R16">5–10 mg IV avec concentré de prothrombine ou plasma ; arrêter l’anticoagulant concerné.</td></tr><tr><td data-src="R31,R16">Acénocoumarol</td><td data-src="R31,R16">Dose unique de 5 mg IV avec plasma ou concentré de prothrombine ; ne pas convertir automatiquement en 10 mg.</td></tr><tr><td data-src="R31,R16">Présentation et administration</td><td data-src="R31,R16">10 mg/ml ; injection IV lente pendant au moins 30 secondes. Ne pas mélanger avec d’autres médicaments parentéraux. La voie orale n’est pas recommandée pour une hémorragie sévère ou potentiellement létale.</td></tr><tr><td data-src="R31,R16">Délai et surveillance</td><td data-src="R31,R16">FI Konakion : effet environ 1–3 heures après IV ; la FI Beriplex cite 4–6 heures pour l’effet de vitamine K dans son contexte. Aucun de ces délais ne dispense d’apporter rapidement les facteurs si nécessaire ni de contrôler l’INR.</td></tr><tr><td data-src="R31,R16">Risques et populations</td><td data-src="R31,R16">Hypersensibilité contre-indiquée ; anaphylaxie IV possible. Surveillance INR étroite en insuffisance hépatique sévère ; pas de formule rénale ajoutée. Grossesse sur indication stricte ; allaitement compatible aux doses thérapeutiques selon cette FI.</td></tr><tr><td data-src="R31,R16">Conservation</td><td data-src="R31,R16">Protéger de la lumière, ne pas conserver au-dessus de 25 °C ; jeter les restes d’une ampoule ouverte. La présentation adulte ne convient pas aux enfants de moins d’un an.</td></tr></tbody></table>
<p data-src="R21,R31">Le consensus ESO 2025 propose notamment vitamine K 10 mg IV dans l’HIC sous AVK. La FI adulte suisse différencie certains anticoagulants : conserver cette divergence et appliquer une décision spécialisée, sans fusion silencieuse des tableaux. La vitamine K ne neutralise ni l’héparine ni directement les anticoagulants anti-Xa.</p>
<div class="key" data-src="R25"><b>Signal Swissmedic de juillet 2026 : Konakion.</b> L’ouverture des ampoules peut produire des particules de verre. Respecter l’ouverture OPC, inspecter la solution juste avant emploi et ne pas utiliser une ampoule avec particules, turbidité ou séparation de phases. Ne pas mélanger à d’autres médicaments parentéraux. La dilution particulière mentionnée pour nouveau-nés de moins de 2,5 kg ne s’applique pas par défaut à l’adulte.</div>
<button class="w" data-k="i64-pcc">PCC : dose, INR et limites</button></section>
<section class="ilot" id="i64-p-6"><h2><span class="n">p-6</span>Pression artérielle et Urapidil Stragen</h2>
<p data-src="R7">Le choix de la cible précède le choix de la dose. L’ESO retient une PA sous 185/110 mmHg avant IVT, puis sous 180/105 pendant 24 heures. Après thrombectomie réussie, une cible intensive de PAS inférieure à 140 pendant les premières 24 heures est déconseillée. Dans l’HIC petite ou modérée précoce, une cible sous 140 peut être discutée ; le contexte hémodynamique et la vitesse de baisse restent essentiels.</p>
<p data-src="R17,R3">La FI générale d’Urapidil Stragen IV prévoit des doses de 10–50 mg IV avec adaptation à la réponse, puis éventuellement une perfusion. Le protocole bernois d’AVC emploie des bolus plus faibles de 2,5–10 mg. Ces nombres sont présentés dans leur contexte ; <b>10–50 mg n’est pas un bolus automatique pour toute PA élevée dans un AVC</b>. L’administration se fait sous surveillance, patient couché.</p>
<table class="t"><thead><tr><th>Élément de FI</th><th>Application sûre</th></tr></thead><tbody><tr><td data-src="R17">Perfusion</td><td data-src="R17">Exemples de préparation : 250 mg dans 500 ml, ou 100 mg portés à 50 ml pour seringue électrique ; concentration compatible maximale 4 mg/ml.</td></tr><tr><td data-src="R17">Débit</td><td data-src="R17">Initialement jusqu’à 2 mg/min selon réponse ; entretien moyen cité 9 mg/h, à individualiser. Ces valeurs ne sont pas une cible universelle.</td></tr><tr><td data-src="R17">Durée</td><td data-src="R17">Ne pas dépasser 48 heures pour ce produit selon FI.</td></tr><tr><td data-src="R17">Âge/rein/foie</td><td data-src="R17">Commencer plus bas chez la personne âgée ; une réduction peut être nécessaire en insuffisance rénale/hépatique, sans formule chiffrée universelle.</td></tr><tr><td data-src="R17">Risques</td><td data-src="R17">Chute trop rapide de PA, bradycardie sévère ; prudence si hypovolémie. Cimetidine et autres antihypertenseurs peuvent modifier l’effet.</td></tr><tr><td data-src="R17">CI et situations particulières</td><td data-src="R17">Hypersensibilité, coarctation et certains shunts ; vérifier la liste complète. Grossesse non recommandée sauf bénéfice justifié ; ne pas allaiter pendant le traitement.</td></tr></tbody></table>
<p data-src="R17">Une correction trop rapide peut être plus dangereuse qu’une valeur élevée isolée. Observer simultanément la PA et l’état neurologique ; si le déficit s’aggrave pendant la baisse, réévaluer la perfusion et la stratégie. Les préparations, débits et compatibilités doivent être contrôlés au lit du patient avec la pharmacie et le protocole local.</p>
<button class="w" data-k="i64-pression">Une cible dépend de la situation</button></section>
<section class="ilot" id="i64-p-7"><h2><span class="n">p-7</span>Antiagrégants : distinguer FI et prévention clinique</h2>
<table class="t"><thead><tr><th>Produit exact</th><th>FI relue</th><th>Écart à rendre visible</th></tr></thead><tbody><tr><td data-src="R18,R20,R3">Aspirine Cardio 100/300</td><td data-src="R18,R20,R3">Après AIT : 300 mg/j dans cette FI. Comprimé gastrorésistant à avaler entier, idéalement au moins 30 minutes avant un repas.</td><td data-src="R18,R20,R3">Le protocole bernois utilise notamment ASA 100 mg/j en prévention secondaire ; ce n’est pas la même ligne d’indication FI.</td></tr><tr><td data-src="R18,R20,R3">Clopidogrel Axapharm</td><td data-src="R18,R20,R3">75 mg/j ; indication après AVC ischémique de sept jours à six mois. Non recommandé durant les sept premiers jours dans cette FI.</td><td data-src="R18,R20,R3">La double antiagrégation précoce de certains AVC mineurs/AIT est une stratégie de recommandation distincte, à durée limitée et sélection précise.</td></tr></tbody></table>
<p data-src="R20">L’acide acétylsalicylique inhibe irréversiblement la synthèse de thromboxane plaquettaire. Vérifier saignement actif, ulcère, hypersensibilité, fonction rénale et hépatique et interactions, notamment méthotrexate. Aspirine Cardio est contre-indiqué en insuffisance rénale sévère avec clairance inférieure à 30 ml/min, entre autres situations. Le comprimé gastrorésistant n’est pas la préparation à écraser pour une action aiguë rapide ; choisir une formulation adaptée si un traitement immédiat est indiqué.</p>
<p data-src="R18">Le clopidogrel est un promédicament dont l’activation implique CYP2C19. Oméprazole et ésoméprazole peuvent réduire cette activation ; éviter cette association selon la FI et choisir, si nécessaire, une alternative adaptée. Saignement actif et insuffisance hépatique sévère sont contre-indiqués. En insuffisance rénale sévère, prudence ; ne pas inventer un schéma réduit. Surveiller saignement, tolérance et observance.</p>
<p data-src="R18,R20">Grossesse et allaitement se discutent pour chaque produit. Aspirine Cardio est contre-indiqué au troisième trimestre ; les autres périodes exigent une indication stricte, avec risques fœtaux particuliers après 20 semaines. Le clopidogrel ne doit être employé pendant la grossesse que si indispensable et n’est pas utilisé pendant l’allaitement selon la FI. Ces règles ne se remplacent pas par l’affirmation générique « faible dose donc sans risque ».</p>
<button class="w" data-k="i64-antiagregants">Les limites d’une dose de prévention</button></section>
<section class="ilot" id="i64-p-8"><h2><span class="n">p-8</span>Sortis — prévention lipidique ciblée</h2>
<p data-src="R19,R3">L’atorvastatine intervient dans une prévention vasculaire appropriée, notamment athéroscléreuse ; elle ne reperfuse pas l’artère en urgence. La FI de Sortis prévoit 10–80 mg une fois par jour, dose initiale usuelle 10 mg et adaptations espacées d’au moins quatre semaines, maximum 80 mg. Le choix d’une intensité plus élevée en prévention secondaire suit le profil et la stratégie du spécialiste.</p>
<table class="t"><thead><tr><th>Population ou risque</th><th>FI</th></tr></thead><tbody><tr><td data-src="R19">Insuffisance rénale</td><td data-src="R19">Pas d’ajustement posologique nécessaire.</td></tr><tr><td data-src="R19">Atteinte hépatique</td><td data-src="R19">Maladie active, élévation persistante inexpliquée des transaminases au-delà de trois fois la limite supérieure et cholestase font partie des CI.</td></tr><tr><td data-src="R19">Grossesse/allaitement</td><td data-src="R19">Contre-indiqués.</td></tr><tr><td data-src="R19">Muscle et interactions</td><td data-src="R19">Rechercher myalgies, faiblesse ou symptômes évocateurs de rhabdomyolyse ; vérifier médicaments inhibant CYP3A4 et autres interactions avant prescription.</td></tr><tr><td data-src="R19">AVC hémorragique antérieur</td><td data-src="R19">Le signal de SPARCL impose une lecture du bénéfice-risque ; pas de prescription universelle à tout AVC non typé.</td></tr></tbody></table>
<p data-src="R19">La liste des associations nécessitant éviction ou dose limitée dépend du médicament associé. Une table d’interactions complète n’est pas remplacée ici par une règle unique. Le traitement lipidique s’accompagne de contrôle tensionnel, arrêt du tabac, activité adaptée et suivi des autres facteurs de risque.</p>
