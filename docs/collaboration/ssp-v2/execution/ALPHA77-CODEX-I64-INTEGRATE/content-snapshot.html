<template data-pop="i64-scores" data-title="Guy’s Hospital et Siriraj : des scores historiques"><p data-src="R33">La validation écossaise de 1990–1993 étudie 1 059 suspicions, dont 991 AVC confirmés. Sensibilité pour l’hémorragie 70 % et spécificité 64 % pour Guy’s ; 68 % et 64 % pour Siriraj, aux seuils optimisés.</p>
<p data-src="R33">Ces chiffres ne sont pas une précision universelle de la clinique. Les faux négatifs hémorragiques empêchent d’utiliser ces scores comme autorisation d’antithrombotique sans imagerie. Lecture du résumé seul, pas du texte intégral.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:7934437%20AND%20SRC:MED&amp;resultType=core&amp;format=json">R33 — Weir et collaborateurs, Lancet 1994 : scores cliniques de distinction AVC</a>.</p></template>
<template data-pop="i64-delais" data-title="Critères suisses 2024 : mesurer les délais"><p data-src="R12">Le tableau diagnostique vise une médiane de moins de 30 minutes entre admission et imagerie parenchymateuse/artérielle si revascularisation possible. Le tableau thérapeutique vise, pour la lyse, médiane sous 30 minutes et percentile 90 sous 60 minutes.</p>
<p data-src="R12">Ces indicateurs mesurent un processus collectif ; ils ne promettent pas le même délai pour chaque patient et n’autorisent pas d’attendre. Le transfert pour thrombectomie est aussi évalué par le temps entrée-sortie ; déglutition et réadaptation sont organisées dans le réseau.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Stroke_Units_et_Stroke_Centers_en_Suisse.pdf">R12 — Société cérébrovasculaire suisse : Stroke Units et Stroke Centers, 2024</a>.</p></template>
<template data-pop="i64-formation" data-title="PROFILES : versions et calendrier"><p data-src="R28,R29,R30">La correspondance avec les SSP 96–105 et l’examen neurologique EPA 2 de PROFILES 2017 est proposée par l’auteur pour cette leçon, sans table officielle I64–SSP.</p>
<p data-src="R28,R29,R30">MEBEKO 2026 mentionne 265 situations de départ. La publication suisse de 2025 indique PROFILES 2 au semestre 2025/26 et comme base de l’examen fédéral 2028 ; ne pas mélanger les numéros des versions.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261">R28 — PROFILES 2017, document officiel</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf">R29 — MEBEKO : exigences de médecine humaine 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1">R30 — Berendonk et collaborateurs : PROFILES 2, 2025</a>.</p></template>
<template data-pop="i64-horloges" data-title="Trois horloges à documenter"><p data-src="R1,R2,R3">Le dernier état connu sans symptôme sert de référence de sécurité lorsque le début réel est inconnu. L’heure de découverte et l’heure d’arrivée restent essentielles pour comprendre le parcours, mais ne remplacent pas ce repère.</p>
<p data-src="R1,R2,R3">Au réveil, noter coucher, réveil et découverte. Une sélection tissulaire peut être possible ; elle utilise des critères propres au protocole et ne permet pas d’inventer une heure de début. La fenêtre n’est jamais un délai à attendre.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a>.</p></template>
<template data-pop="i64-cim" data-title="I64 : nature inconnue, pas cause inconnue"><p data-src="R14">I64 s’applique à un AVC qui n’est pas désigné comme hémorragique ou par infarctus. Une suspicion avant imagerie reste une suspicion clinique, pas automatiquement un diagnostic codé confirmé.</p>
<p data-src="R14">Un infarctus prouvé dont la cause reste inconnue est un infarctus cryptogénique, pas I64 pour cette seule raison. Les séquelles d’un AVC non précisé sont distinguées sous I69.4 dans la classification allemande 2024 relue. Les règles suisses de facturation ne sont pas certifiées ici.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm">R14 — BfArM : CIM-10-GM 2024, I64</a>.</p></template>
<template data-pop="i64-epidemio" data-title="Lire les données suisses sans changer le dénominateur"><p data-src="R5">Les 26 032 sorties hospitalières de 2017 ne correspondent pas nécessairement à 26 032 premiers AVC chez des personnes distinctes. Réhospitalisations et récidives peuvent contribuer au nombre ; les bases ne sont pas liées individuellement.</p>
<p data-src="R5">Les 26 879 événements estimés et le taux standardisé de 325 pour 100 000 portent sur I60–I64. Ils ne donnent ni une incidence actuelle d’I64 ni sa proportion. Une baisse de mortalité entre périodes ne démontre pas à elle seule la causalité d’une intervention.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12161988/">R5 — Hänsel et collaborateurs, 2025 : épidémiologie AVC suisse de 2017</a>.</p></template>
<template data-pop="i64-etiologie" data-title="Une cause doit rendre le tableau cohérent"><p data-src="R3,R6">L’imagerie artérielle et le bilan cardiaque recherchent des mécanismes différents : embolie depuis une plaque, source cardiaque, maladie des petites artères ou autre affection. Une FA peut être intermittente ; un ECG ponctuel négatif ne suffit pas toujours.</p>
<p data-src="R3,R6">La topographie guide sans tout prouver : plusieurs territoires suggèrent une source embolique, une petite lésion profonde évoque une perforante. Le bilan est complété selon âge, terrain et indices, sans attribuer chaque anomalie découverte à l’AVC.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="i64-anticoagulant" data-title="INR et anticoagulants directs ne sont pas synonymes"><p data-src="R1,R2,R3,R15">Demander le nom exact, la dose et la dernière prise, puis vérifier la fonction rénale et les examens pertinents. L’INR évalue surtout l’effet AVK ; un résultat normal n’exclut pas toute activité d’un anticoagulant direct.</p>
<p data-src="R1,R2,R3,R15">Les FI suisses des thrombolytiques et certains protocoles locaux ont des seuils différents. Documenter cet écart et le faire arbitrer. La neutralisation d’un anticoagulant dépend du produit : Praxbind est spécifique du dabigatran.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680658040011">R15 — FI suisse Praxbind, GTIN 7680658040011</a>.</p></template>
<template data-pop="i64-nihss" data-title="NIHSS : mesurer, décrire, interpréter"><p data-src="R3,R6">Le NIHSS standardise conscience, réponses, consignes, regard, champ, face, motricité, ataxie, sensibilité, langage, articulation et extinction. La répétition aide à reconnaître une aggravation, si la méthode et les limites sont documentées.</p>
<p data-src="R3,R6">Un faible total peut cacher une aphasie invalidante, une hémianopsie ou une atteinte postérieure. Le score ne distingue pas infarctus et hémorragie et ne remplace pas l’autonomie antérieure ni l’imagerie. Une cotation valide demande une formation à la méthode complète.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="i64-posterieur" data-title="Circulation postérieure : ne pas s’arrêter à FAST"><p data-src="R6,R13">Diplopie, dysphagie, dysarthrie, ataxie sévère, signes alternes ou trouble de vigilance peuvent révéler une atteinte du tronc ou du cervelet. Une grande hémiparésie n’est pas obligatoire.</p>
<p data-src="R6,R13">Un vertige isolé est fréquent dans les maladies périphériques, mais les signes centraux ou l’impossibilité de tenir debout imposent une évaluation adaptée. Un syndrome bulbaire peut menacer la déglutition ; un infarctus cérébelleux volumineux peut comprimer le tronc ou obstruer le quatrième ventricule.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf">R13 — Société cérébrovasculaire suisse : phase préhospitalière, 2021</a>.</p></template>
<template data-pop="i64-imagerie" data-title="L’imagerie répond à plusieurs questions"><p data-src="R3,R6">Le scanner sans contraste recherche notamment le sang et l’effet de masse ; un scanner normal très précoce n’exclut pas l’ischémie. L’angiographie montre les artères et une éventuelle cible de thrombectomie.</p>
<p data-src="R3,R6">Diffusion/ADC, FLAIR et séquences sensibles au sang donnent des informations complémentaires. La perfusion estime des volumes selon une méthode. Choisir la modalité disponible et adaptée sans retard inutile ; répéter ou compléter si le tableau demeure discordant.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="i64-penombre" data-title="Pénombre : perte de fonction encore potentiellement réversible"><p data-src="R22,R26">Le déficit peut inclure du tissu électriquement silencieux mais encore viable. Les collatérales et la réserve vasculaire rendent la vitesse d’évolution très variable. Restaurer tôt la perfusion vise à préserver ce tissu.</p>
<p data-src="R22,R26">La pénombre n’est pas une couronne identique chez tous ; un volume calculé par logiciel n’est pas une promesse individuelle. Les modèles expérimentaux d’excitotoxicité expliquent certains mécanismes, sans fournir une dose de neuroprotecteur validée.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.medecinesciences.org/articles/medsci/pdf/2008/03/medsci2008242p185.pdf">R22 — Benquet, Gee, Gerber : ischémie, NMDA et mort neuronale retardée, 2008</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/introduction-a-la-physiopathologie-et-au-traitement-des-maladies-neurologiques/chapitre-27-regulation-de-la-circulation-cerebrale-et-ischemie-cerebrale">R26 — CEN, chapitre 27 : régulation de la circulation cérébrale et ischémie</a>.</p></template>
<template data-pop="i64-mismatch" data-title="Mismatch : garder le protocole attaché au seuil"><p data-src="R10">La stratégie ESO 2021 pour certains débuts connus entre 4,5 et 9 heures retient cœur inférieur à 70 ml, ratio supérieur à 1,2 et différence supérieure à 10 ml, si la thrombectomie n’est pas indiquée ou prévue. Ces critères ne sont pas ceux de toute sélection possible.</p>
<p data-src="R10">Au réveil, DWI/FLAIR et perfusion utilisent des cadres différents ; la borne de neuf heures du protocole de perfusion se compte depuis le milieu du sommeil. Ne pas convertir cette règle en neuf heures après le réveil ni en fenêtre autorisée suisse universelle.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/">R10 — ESO, thrombolyse intraveineuse 2021</a>.</p></template>
<template data-pop="i64-simulateurs" data-title="Un diagnostic concurrent doit expliquer le déficit"><p data-src="R6">Hypoglycémie, déficit postcritique, aura, lésion expansive, atteinte vestibulaire et trouble fonctionnel sont des alternatives importantes. Chercher une cohérence de chronologie et de topographie, puis confronter aux examens.</p>
<p data-src="R6">Une crise peut être provoquée par l’AVC ; une maladie métabolique peut coexister. Le diagnostic fonctionnel repose sur des signes positifs et une expertise, pas simplement sur un premier scanner normal ou sur un antécédent psychiatrique.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="i64-lyse" data-title="Éligibilité : produit exact, tissu et handicap"><p data-src="R1,R2,R3,R9">Avant IVT, vérifier hémorragie exclue, délai, retentissement du déficit, traitements, hémostase et risques récents. Un faible NIHSS ne signifie pas nécessairement absence de handicap.</p>
<p data-src="R1,R2,R3,R9">Les FI Actilyse et Metalyse ne classent pas toutes les situations de la même manière entre contre-indications et précautions. Un tableau unique copié d’un produit vers l’autre serait trompeur. La recommandation et l’AMM sont des sources distinctes à confronter.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/">R9 — ESO, recommandation accélérée ténectéplase 2023</a>.</p></template>
<template data-pop="i64-thrombectomie" data-title="Thrombectomie : sélectionner un vaisseau et une population"><p data-src="R3,R8,R9">Une occlusion accessible peut relever d’une thrombectomie en plus ou à la place de l’IVT selon l’éligibilité. Ne pas retarder le transfert pour attendre l’effet d’une lyse. Les critères incluent vaisseau, tissu, déficit, délai et état antérieur.</p>
<p data-src="R3,R8,R9">Les essais récents de MeVO n’ont pas établi un bénéfice justifiant un traitement systématique. Les extensions de sélection dans d’autres groupes ne s’appliquent pas indistinctement à chaque artère distale ou à toute heure.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12915583/">R8 — ESO : synthèse des preuves AVC de 2025, publiée en 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/">R9 — ESO, recommandation accélérée ténectéplase 2023</a>.</p></template>
<template data-pop="i64-hic" data-title="HIC : traiter le mécanisme et les complications"><p data-src="R7,R21">La prise en charge associe PA adaptée, réversion d’une anticoagulation active, surveillance, contrôle des complications et avis neurochirurgical selon topographie et gravité. Une hydrocéphalie ou une compression change l’urgence.</p>
<p data-src="R7,R21">Sous AVK, PCC et vitamine K ; sous dabigatran, idarucizumab. Sous anti-Xa, la balance bénéfice-risque de l’andexanet ou du PCC demeure spécialisée et les résultats fonctionnels sont moins certains que la réduction de l’expansion. Pas de dose non vérifiée d’andexanet ici.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/">R7 — ESO : mise à jour 2025 de la pression artérielle, publiée en 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://eso-stroke.org/wp-content/uploads/2025-ESO-ICH-guideline-ESOC.pdf">R21 — ESO–EANS 2025 : présentation officielle de la recommandation HIC</a>.</p></template>
<template data-pop="i64-surveillance" data-title="Aggravation : reprendre l’examen et imager"><p data-src="R1,R2,R3">Après reperfusion, une céphalée nouvelle, un vomissement, une baisse de vigilance ou un déficit accru peut annoncer une complication hémorragique ou ischémique. Réévaluer immédiatement ; ne pas attendre le scanner programmé à 24 heures.</p>
<p data-src="R1,R2,R3">Vérifier aussi glycémie, oxygénation, crise, infection et point de ponction. Une douleur inguinale avec hypotension ou baisse d’hémoglobine après accès artériel peut relever d’un saignement profond. Le NIHSS seul ne surveille pas ces complications.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a>.</p></template>
<template data-pop="i64-aria" data-title="Anticorps anti-amyloïdes : ARIA ou AVC"><p data-src="R4">Sous lecanemab ou donanemab, un déficit peut relever d’ARIA avec œdème ou hémorragie, d’un AVC, ou des deux. La recommandation suisse demande une IRM adaptée avec diffusion, FLAIR, séquences sensibles au sang et angiographie avant une discussion de lyse très prudente.</p>
<p data-src="R4">Si une occlusion est rapidement accessible, la thrombectomie sans bridging est privilégiée dans ce conseil spécialisé. Les données sont limitées ; des cas rapportés ne permettent ni incidence fiable ni interdiction absolue inventée.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.neurovasc.ch/fileadmin/files/Procedere_bei_Schlaganfallsymptomen_unter_Therapie_einer_Alzheimer_Erkrankung_mit_Anti-Amyloid-Antik%C3%B6rpern.pdf">R4 — Société cérébrovasculaire suisse : symptômes AVC sous anti-amyloïdes</a>.</p></template>

<template data-pop="i64-mrs" data-title="mRS : handicap global, pas portrait complet"><p data-src="R3">La mRS va de 0, absence de symptôme, à 6, décès. Les niveaux intermédiaires décrivent symptômes sans handicap significatif, limitation avec autonomie, besoin d’aide avec marche possible, dépendance plus importante et dépendance sévère.</p>
<p data-src="R3">Établir le niveau antérieur et l’évolution, puis compléter par cognition, humeur, fatigue, communication et objectifs de vie. Une différence de score n’explique pas à elle seule ce que la personne peut reprendre au quotidien.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a>.</p></template>
<template data-pop="i64-alteplase" data-title="Altéplase : 70 kg n’est qu’un exemple de calcul"><p data-src="R1">Pour 70 kg : 0,9 mg/kg donne 63 mg ; 6,3 mg en bolus et 56,7 mg sur 60 minutes. À 1 mg/ml, les mêmes nombres correspondent aux volumes en ml. Le maximum total est 90 mg.</p>
<p data-src="R1">Vérifier éligibilité, poids, concentration et dispositif ; la dose d’AVC n’est pas celle d’un IAM ou d’une embolie pulmonaire. Ne pas mélanger avec héparine ou autres médicaments ; surveiller hémorragie et angio-œdème.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a>.</p></template>
<template data-pop="i64-tenecteplase" data-title="Metalyse : paliers suisses, pas dose coronarienne"><p data-src="R2,R9">La FI suisse du flacon 25 mg/5 000 U donne 15, 17,5, 20, 22,5 ou 25 mg selon les paliers de poids. À 5 mg/ml, les volumes sont 3, 3,5, 4, 4,5 ou 5 ml. Le bolus dure 5–10 secondes.</p>
<p data-src="R2,R9">L’ESO décrit 0,25 mg/kg, maximum 25 mg, et déconseille 0,4 mg/kg. Afficher cette différence protège d’une fusion involontaire des règles. La présentation IAM et les unités d’autres thrombolytiques ne sont pas substituables.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/">R9 — ESO, recommandation accélérée ténectéplase 2023</a>.</p></template>
<template data-pop="i64-praxbind" data-title="Praxbind : neutraliser le dabigatran"><p data-src="R15">5 g IV en deux flacons de 2,5 g ; perfusions successives de 5–10 minutes chacune ou bolus selon FI. Réservé aux conditions de réversion urgente du dabigatran, pas à tout saignement sous tout anticoagulant.</p>
<p data-src="R15">Surveiller clinique et coagulation, car une activité peut réapparaître. Une nouvelle dose exige les conditions précisées par la FI ; la dose quotidienne maximale n’est pas établie. La réversion ne supprime pas le risque thrombotique de la maladie initiale.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680658040011">R15 — FI suisse Praxbind, GTIN 7680658040011</a>.</p></template>
<template data-pop="i64-pcc" data-title="Beriplex : une table de produit, pas de classe entière"><p data-src="R16">L’INR initial détermine 25, 35 ou 50 UI FIX/kg pour les trois plages de la FI, avec maximum unique 5 000 UI. Débit maximal 3 UI/kg/min et 210 UI/min. Contrôler INR et saignement, sans répétition automatique.</p>
<p data-src="R16">Une vitamine K associée soutient la correction ultérieure. Les tables d’un autre concentré ne sont pas copiées. Vérifier hypersensibilité, HIT, risque thrombotique et coagulopathie de consommation ; documenter le produit plasmatique administré.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680006650015">R16 — FI suisse Beriplex P/N, GTIN 7680006650015</a>.</p></template>
<template data-pop="i64-pression" data-title="Pourquoi les cibles tensionnelles diffèrent"><p data-src="R7,R17">Avant IVT : sous 185/110 ; après : sous 180/105 pendant 24 heures selon ESO. Après thrombectomie réussie, éviter une cible intensive de PAS sous 140. Dans certaines HIC précoces petites/modérées, une cible sous 140 peut être discutée.</p>
<p data-src="R7,R17">La dose d’urapidil se titre à la situation et à la réponse ; le schéma général de FI n’est pas une consigne automatique d’AVC. Observer l’état neurologique et éviter les chutes brutales, particulièrement si la perfusion dépend des collatérales.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/">R7 — ESO : mise à jour 2025 de la pression artérielle, publiée en 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680660120015">R17 — FI suisse Urapidil Stragen IV, GTIN 7680660120015</a>.</p></template>
<template data-pop="i64-antiagregants" data-title="Prévention : ne pas effacer les écarts entre sources"><p data-src="R3,R18,R20">Aspirine Cardio indique 300 mg/j après AIT dans la FI relue ; le protocole bernois utilise notamment 100 mg/j en prévention secondaire. Clopidogrel Axapharm est à 75 mg/j et sa FI ne recommande pas les sept premiers jours après AVC.</p>
<p data-src="R3,R18,R20">La double antiagrégation précoce courte relève de critères de recommandations chez certains AVC mineurs/AIT à haut risque. Elle ne doit pas être présentée comme autorisée de façon identique par toutes les FI, ni prolongée automatiquement.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680659570012">R18 — FI suisse Clopidogrel Axapharm, GTIN 7680659570012</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680517950406">R20 — FI suisse Aspirine Cardio, GTIN 7680517950406</a>.</p></template>
<template data-pop="i64-autoregulation" data-title="Autorégulation et collatérales"><p data-src="R26,R7">Les vaisseaux modifient leur diamètre pour maintenir le débit malgré les variations de pression ; les collatérales redistribuent une partie du flux. Ces mécanismes ont des limites et varient selon l’individu et la maladie vasculaire.</p>
<p data-src="R26,R7">Une courbe physiologique n’est pas une ordonnance de PA dans l’AVC. Une baisse trop forte peut diminuer la perfusion d’une pénombre, tandis que certaines HIC bénéficient d’une stratégie de baisse contrôlée. Le type, le traitement et la surveillance déterminent la cible.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/introduction-a-la-physiopathologie-et-au-traitement-des-maladies-neurologiques/chapitre-27-regulation-de-la-circulation-cerebrale-et-ischemie-cerebrale">R26 — CEN, chapitre 27 : régulation de la circulation cérébrale et ischémie</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/">R7 — ESO : mise à jour 2025 de la pression artérielle, publiée en 2026</a>.</p></template>
<template data-pop="i64-energie" data-title="Excitotoxicité : un mécanisme, pas un traitement établi"><p data-src="R22,R26">La privation d’oxygène et de glucose réduit l’ATP, perturbe les transports et augmente le glutamate extracellulaire. L’activation NMDA et l’entrée calcique peuvent participer à des lésions retardées.</p>
<p data-src="R22,R26">Les modèles hippocampiques montrent une vulnérabilité cellulaire variable. La traduction thérapeutique humaine des antagonistes NMDA a déçu ; la plausibilité biologique ne dispense pas d’un essai clinique montrant un bénéfice utile.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.medecinesciences.org/articles/medsci/pdf/2008/03/medsci2008242p185.pdf">R22 — Benquet, Gee, Gerber : ischémie, NMDA et mort neuronale retardée, 2008</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/introduction-a-la-physiopathologie-et-au-traitement-des-maladies-neurologiques/chapitre-27-regulation-de-la-circulation-cerebrale-et-ischemie-cerebrale">R26 — CEN, chapitre 27 : régulation de la circulation cérébrale et ischémie</a>.</p></template>
<template data-pop="pareto-i64-definition" data-title="Loi de Pareto — Reconnaître avant de coder"><p data-src="R6,R14">Déficit soudain : suspecter un AVC et activer l’urgence. I64 décrit une nature non documentée, pas un infarctus de cause inconnue. L’imagerie précise le type ; le bilan explique ensuite la cause.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm">R14 — BfArM : CIM-10-GM 2024, I64</a>.</p></template>
<template data-pop="pareto-i64-mecanismes" data-title="Loi de Pareto — Le tissu commande la stratégie"><p data-src="R7,R22,R26">Ischémie : préserver une perfusion et reperfuser si indiqué. Hémorragie : limiter expansion et complications. La même baisse tensionnelle peut avoir des conséquences différentes ; le temps et la physiologie ne se séparent pas.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/">R7 — ESO : mise à jour 2025 de la pression artérielle, publiée en 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.medecinesciences.org/articles/medsci/pdf/2008/03/medsci2008242p185.pdf">R22 — Benquet, Gee, Gerber : ischémie, NMDA et mort neuronale retardée, 2008</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/introduction-a-la-physiopathologie-et-au-traitement-des-maladies-neurologiques/chapitre-27-regulation-de-la-circulation-cerebrale-et-ischemie-cerebrale">R26 — CEN, chapitre 27 : régulation de la circulation cérébrale et ischémie</a>.</p></template>
<template data-pop="pareto-i64-examen" data-title="Loi de Pareto — Décrire au-delà du score"><p data-src="R3,R6">Examiner langage, vision, attention, tronc et équilibre en plus de la force. Documenter l’état antérieur et le handicap réel. Un NIHSS bas ne garantit ni bénignité ni absence d’AVC.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="pareto-i64-diagnostic" data-title="Loi de Pareto — Imagerie orientée vers une décision"><p data-src="R3,R6">Rechercher sang, lésion, artère occluse et tissu à risque. Un scanner normal précoce ne clôt pas l’enquête. Le bilan étiologique vient compléter la décision urgente, sans la retarder.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="pareto-i64-urgence" data-title="Loi de Pareto — Gagner du temps utile"><p data-src="R3,R11,R13">144, préalerte, glycémie, dernier état normal et anticoagulants. Stabiliser et imager sans délai inutile. Pas de voie orale avant déglutition, pas d’antithrombotique avant typage.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://swissheart.ch/fr/maladies-et-urgences/maladies-de-c%C5%93ur-et-attaque-c%C3%A9r%C3%A9brale/avc">R11 — Fondation suisse de cardiologie : attaque cérébrale</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf">R13 — Société cérébrovasculaire suisse : phase préhospitalière, 2021</a>.</p></template>
<template data-pop="pareto-i64-reperfusion" data-title="Loi de Pareto — Sélectionner sans attendre"><p data-src="R1,R2,R9,R10">Fenêtre FI de 4,5 heures, produit exact et déficit pertinent. Si thrombectomie possible, organiser en parallèle. Les stratégies tardives exigent leurs propres critères ; elles ne rendent pas le délai indifférent.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/">R9 — ESO, recommandation accélérée ténectéplase 2023</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/">R10 — ESO, thrombolyse intraveineuse 2021</a>.</p></template>
<template data-pop="pareto-i64-hemorragie" data-title="Loi de Pareto — Réversion ciblée"><p data-src="R15,R16,R21">Identifier l’anticoagulant, réverser selon produit, surveiller PA et complications et discuter neurochirurgie. Une réduction d’expansion ne suffit pas à promettre un gain fonctionnel.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680658040011">R15 — FI suisse Praxbind, GTIN 7680658040011</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680006650015">R16 — FI suisse Beriplex P/N, GTIN 7680006650015</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://eso-stroke.org/wp-content/uploads/2025-ESO-ICH-guideline-ESOC.pdf">R21 — ESO–EANS 2025 : présentation officielle de la recommandation HIC</a>.</p></template>
<template data-pop="pareto-i64-suivi" data-title="Loi de Pareto — Cause et vie quotidienne"><p data-src="R3,R6">Prévention selon mécanisme, contrôle des facteurs et suivi de la tolérance. Réadaptation motrice, cognitive, langagière et sociale ; fatigue et humeur comptent même si la force s’améliore.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
