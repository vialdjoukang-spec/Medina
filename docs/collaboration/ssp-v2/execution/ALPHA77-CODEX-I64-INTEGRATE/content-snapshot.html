<template id="ch-I64"><div class="chap"><div class="chap-head"><div class="code">I 64 · Neurologie · Maladies cérébrovasculaires</div><h1>Accident vasculaire cérébral non précisé comme hémorragique ou par infarctus</h1><span class="status">Monographie révisée le 2 novembre 2026 · Auto-relecture IA · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie et sécurité</button></div><div class="panel" id="pA" data-semiology-clinical="I64"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#i64-0">Reconnaître l’urgence</a></li><li><a href="#i64-1">Définition et périmètre</a></li><li><a href="#i64-2">Épidémiologie suisse : lire les dénominateurs</a></li><li><a href="#i64-3">Physiopathologie : tissu, temps et pression</a></li><li><a href="#i64-4">Causes et terrains</a></li><li><a href="#i64-5">Anamnèse : trois horloges et un témoin</a></li><li><a href="#i64-6">Examen clinique immédiat</a></li><li><a href="#i64-7">Syndromes et localisation</a></li><li><a href="#i64-8">Diagnostic positif et explorations</a></li><li><a href="#i64-9">Arbre de décision et diagnostics différentiels</a></li><li><a href="#i64-10">Prise en charge avant typage</a></li><li><a href="#i64-11">Reperfusion de l’infarctus</a></li><li><a href="#i64-12">Hémorragie et réversion</a></li><li><a href="#i64-13">Surveillance et complications</a></li><li><a href="#i64-14">Prévention, réadaptation et pronostic</a></li><li><a href="#i64-15">Situations particulières</a></li><li><a href="#i64-16">Critères et scores sans automatisme</a></li><li><a href="#i64-17">Points clés et pièges</a></li></ol></nav><div class="chap-body"><section class="ilot" id="i64-0"><h2><span class="n">0</span>Reconnaître l’urgence</h2>
<p data-src="R3,R11,R13">Une faiblesse ou un trouble du langage apparaît brutalement : la première tâche est de reconnaître une <b>suspicion d’AVC</b>, de stabiliser les fonctions vitales et d’activer la filière. La nature ischémique ou hémorragique n’est pas décidée par l’intuition clinique. En Suisse, le patient ou son entourage appelle le <b>144</b>, y compris si les symptômes régressent. Le réseau organise le transport vers la structure adaptée ; chercher seul un hôpital ou attendre le médecin du lendemain fait perdre une possibilité thérapeutique.</p>
<p data-src="R1,R2,R3"><b>Vignette pédagogique fictive.</b> Une femme de 74 ans, autonome, présente une aphasie et une faiblesse droite. Son mari l’a vue normale à 07 h 30 ; la découverte a lieu à 08 h 10 et l’arrivée à 08 h 40. La référence de sécurité est le dernier état connu sans symptôme, 07 h 30, pas l’heure d’arrivée. À 08 h 40, 70 minutes se sont écoulées depuis cette référence. L’équipe vérifie les traitements, mesure la glycémie et réalise l’imagerie en urgence ; elle n’attend pas la fin de la fenêtre de 4,5 heures.</p>
<div class="key" data-src="R1,R2,R7"><b>Avant le typage : pas d’aspirine ni de thrombolytique sur la seule impression clinique.</b> Une baisse tensionnelle intensive indifférenciée peut aussi être nocive. L’hypoglycémie et les défaillances vitales se corrigent immédiatement ; cela ne dispense pas de rechercher un AVC persistant.</div>
<button class="w" data-k="i64-horloges">Dernier état normal, découverte, arrivée</button></section>
<section class="ilot" id="i64-1"><h2><span class="n">1</span>Définition et périmètre</h2>
<p data-src="R6,R14">Un accident vasculaire cérébral correspond à une atteinte neurologique d’origine vasculaire, généralement révélée par un déficit focal soudain, parfois par un trouble de vigilance. Il peut s’agir d’un infarctus, lié à une insuffisance de perfusion, ou d’une hémorragie. La distinction repose sur la confrontation clinique et radiologique. Une régression rapide évoque un accident ischémique transitoire, mais un déficit transitoire peut aussi laisser une lésion : la durée seule ne remplace pas l’imagerie.</p>
<p data-src="R14"><b>I64 est une catégorie de documentation</b> pour un AVC non désigné comme hémorragique ou par infarctus. Elle ne constitue pas une étiologie et ne doit pas transformer toute faiblesse non explorée en AVC confirmé. Elle peut rester dans un dossier insuffisamment documenté ; elle n’est donc pas obligatoirement limitée aux premières minutes. Dès que la nature est établie, on documente le diagnostic plus précis. Un infarctus de cause inconnue demeure un infarctus : « cryptogénique » n’est pas synonyme d’I64.</p>
<p data-src="R14">I64 ne comporte pas de sous-code dans la version consultée. La CIM-10-GM allemande 2024 exclut les séquelles d’un AVC non précisé vers I69.4. Cette référence explique le sens du code ; elle ne certifie pas les règles de facturation suisse 2026. La monographie traite surtout la décision clinique pendant l’incertitude, puis les deux principales branches de traitement. <button class="w" data-k="i64-cim">Code, diagnostic et cause</button>.</p>
<button class="pareto-btn ui" data-k="pareto-i64-definition">▲ Loi de Pareto — Reconnaître avant de coder</button></section>
<section class="ilot" id="i64-2"><h2><span class="n">2</span>Épidémiologie suisse : lire les dénominateurs</h2>
<p data-src="R5">L’étude suisse de Hänsel et collaborateurs, publiée en 2025, analyse des données de <b>2017</b> portant sur les codes I60 à I64. Elle rapporte 26 032 sorties hospitalières pour AVC et 2 816 décès, puis estime 26 879 événements ; le taux standardisé d’événements est de 325 pour 100 000 habitants. Les femmes représentent 45 % des sorties et 59 % des décès. Ces nombres concernent l’ensemble des AVC codés dans cette plage, pas uniquement I64.</p>
<p data-src="R5">Une sortie hospitalière n’est pas une personne nouvellement atteinte. Un même patient peut être réhospitalisé ; les bases hospitalière et des causes de décès ne peuvent pas être reliées individuellement. Les auteurs ne peuvent donc pas mesurer directement les premiers AVC, les récidives et une incidence vraie. Le taux standardisé ne doit pas être remplacé par un taux brut, ni les données 2017 être présentées comme une mesure 2026.</p>
<p data-src="R5,R11">Le recul de mortalité décrit entre périodes est compatible avec plusieurs évolutions : prévention, diagnostic, codage et organisation des soins. Il ne démontre pas à lui seul un effet causal des Stroke Units. Les chiffres arrondis de sensibilisation de la Fondation suisse de cardiologie ont une autre fonction et ne sont pas fusionnés avec cette analyse. <b>Aucune proportion suisse actuelle d’AVC restant I64 n’est établie par les sources relues.</b></p>
<div class="key" data-src="R5">Toujours conserver l’année, la population, le code inclus et le dénominateur. L’incertitude documentaire sur I64 ne justifie pas d’inventer une fréquence.</div>
<button class="w" data-k="i64-epidemio">Pourquoi hospitalisations et incidence diffèrent</button></section>
<section class="ilot" id="i64-3"><h2><span class="n">3</span>Physiopathologie : tissu, temps et pression</h2>
<p data-src="R6,R22">Le tissu nerveux dépend d’un apport continu de glucose et d’oxygène. Une occlusion artérielle réduit cet apport ; la sévérité de l’ischémie dépend aussi des collatérales, du territoire et de la durée. Le <b>cœur ischémique</b> correspond au tissu gravement lésé, tandis que la <b>pénombre</b> conserve une possibilité de récupération si la perfusion est restaurée assez vite. Ces compartiments évoluent ; deux patients au même délai peuvent avoir des volumes très différents.</p>
<p data-src="R22">Au niveau cellulaire, la diminution d’ATP perturbe les transports du glutamate. L’accumulation extracellulaire active notamment les récepteurs NMDA, avec entrée calcique et voies de dommage cellulaire. La revue mécanistique de Benquet et collaborateurs s’appuie surtout sur des modèles expérimentaux : elle explique une vulnérabilité sélective, mais ne fournit ni un chronomètre universel de mort neuronale ni une indication humaine d’antagoniste NMDA. La formule populaire « des millions de neurones par minute » ne doit pas être lue comme une mesure individuelle.</p>
<p data-src="R6,R7,R21">Dans l’hémorragie, la rupture vasculaire produit un hématome ; son expansion, l’œdème, l’effet de masse et une éventuelle extension ventriculaire peuvent aggraver rapidement le déficit. La prise en charge vise notamment une pression adaptée, la réversion d’une anticoagulation et l’évaluation neurochirurgicale. Diminuer un volume radiologique ne garantit pas automatiquement une amélioration fonctionnelle : les essais doivent examiner les deux résultats.</p>
<div class="key" data-src="R7">Le même geste peut avoir des effets différents selon le mécanisme. La pression élevée peut contribuer à l’expansion d’une HIC, mais soutient parfois une perfusion ischémique dépendante des collatérales. On ne « normalise » donc pas indistinctement la PA avant le diagnostic.</div>
<button class="w" data-k="i64-penombre">Mismatch : sélection tissulaire, pas certitude absolue</button><button class="pareto-btn ui" data-k="pareto-i64-mecanismes">▲ Loi de Pareto — Relier le mécanisme au traitement</button></section>
<section class="ilot" id="i64-4"><h2><span class="n">4</span>Causes et terrains</h2>
<table class="t"><thead><tr><th>Mécanisme ou terrain</th><th>Indices utiles</th><th>Conséquence du bilan</th></tr></thead><tbody><tr><td data-src="R3,R6">Athérosclérose des gros troncs</td><td data-src="R3,R6">Facteurs vasculaires, sténose cervicale ou intracrânienne, embolies artérielles.</td><td data-src="R3,R6">Imagerie des artères ; prévention vasculaire et discussion d’une lésion symptomatique.</td></tr><tr><td data-src="R3,R6">Cardioembolie</td><td data-src="R3,R6">Fibrillation atriale, valvulopathie, thrombus intracardiaque ; lésions de plusieurs territoires.</td><td data-src="R3,R6">ECG et monitorage, échographie ciblée ; prévention anticoagulante si indication établie.</td></tr><tr><td data-src="R3,R6">Maladie des petites artères</td><td data-src="R3,R6">HTA chronique ; syndrome lacunaire et petite lésion profonde compatibles.</td><td data-src="R3,R6">Ne pas attribuer la cause à la seule taille ; confronter au bilan artériel et cardiaque.</td></tr><tr><td data-src="R3,R6">Dissection</td><td data-src="R3,R6">Cervicalgie/céphalée, Horner, traumatisme parfois mineur ; peut survenir sans traumatisme rapporté.</td><td data-src="R3,R6">Imagerie cervicale adaptée, avis spécialisé.</td></tr><tr><td data-src="R3,R6">Hémorragie profonde</td><td data-src="R3,R6">Microangiopathie associée à l’HTA ; anticoagulation possible.</td><td data-src="R3,R6">Réversion si nécessaire, contrôle tensionnel et recherche d’autres causes selon contexte.</td></tr><tr><td data-src="R3,R6">Hémorragie lobaire ou sujet jeune</td><td data-src="R3,R6">Angiopathie amyloïde, malformation, tumeur ou autre cause selon âge et topographie.</td><td data-src="R3,R6">IRM et exploration vasculaire adaptées ; ne pas conclure à l’HTA parce que la PA est élevée.</td></tr><tr><td data-src="R3,R6">Causes moins fréquentes</td><td data-src="R3,R6">Endocardite, vascularite, antiphospholipides, maladie génétique, cancer ou trouble hématologique.</td><td data-src="R3,R6">Examens orientés par les indices ; pas de panel exhaustif systématique.</td></tr></tbody></table>
<p data-src="R6">Hypertension, tabagisme, diabète, dyslipidémie et antécédents vasculaires orientent la prévention. Leur absence n’exclut pas l’AVC, notamment chez une personne jeune. De même, une insuffisance rénale ou une maladie psychiatrique ne transforme pas automatiquement un déficit en simulateur. Une maladie préexistante et un AVC peuvent coexister.</p>
<button class="w" data-k="i64-etiologie">De la lésion à la cause</button></section>
<section class="ilot" id="i64-5"><h2><span class="n">5</span>Anamnèse : trois horloges et un témoin</h2>
<p data-src="R3,R13">Recueillir rapidement le récit du patient et d’un témoin, au téléphone si nécessaire. Distinguer le dernier état connu normal, la découverte du déficit et l’arrivée des secours. Préciser le caractère soudain, maximal d’emblée, progressif ou fluctuant ; noter un réveil avec symptômes et l’heure du coucher. Une heure incertaine se documente comme telle, sans la remplacer par l’heure la plus favorable au traitement.</p>
<table class="t"><thead><tr><th>À demander</th><th>Pourquoi cela change une décision</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R4">Déficit et retentissement</td><td data-src="R1,R2,R3,R4">Quels mots, quel bras, quelle vision, quelle marche ? Une aphasie peu cotée peut être très invalidante.</td></tr><tr><td data-src="R1,R2,R3,R4">Traitements et dernière prise</td><td data-src="R1,R2,R3,R4">AVK, anticoagulant direct, antiagrégant, insulinothérapie ; vérifier le nom, la dose, l’heure et la fonction rénale.</td></tr><tr><td data-src="R1,R2,R3,R4">Événements récents</td><td data-src="R1,R2,R3,R4">Saignement, chirurgie, traumatisme crânien, accouchement, ponction ou geste invasif : risque hémorragique et stratégie de reperfusion.</td></tr><tr><td data-src="R1,R2,R3,R4">État antérieur</td><td data-src="R1,R2,R3,R4">Autonomie réelle, handicap antérieur, cognition, lieu de vie, directives anticipées ; ne pas confondre âge et dépendance.</td></tr><tr><td data-src="R1,R2,R3,R4">Signes associés</td><td data-src="R1,R2,R3,R4">Céphalée brutale, douleur cervicale, crise, fièvre, douleur thoracique, chute, troubles visuels, dysphagie.</td></tr><tr><td data-src="R1,R2,R3,R4">Traitement anti-amyloïde</td><td data-src="R1,R2,R3,R4">Lecanemab/donanemab : possibilité d’ARIA et modification de la décision d’imagerie et de lyse.</td></tr></tbody></table>
<p data-src="R1,R2">La liste des contre-indications ne se reconstruit pas de mémoire pendant l’urgence : utiliser la fiche du produit choisi et le protocole validé du centre. L’anamnèse rapide se poursuit pendant la préparation de l’imagerie ; elle ne doit pas devenir une série d’étapes qui retarde inutilement la reperfusion.</p>
<button class="w" data-k="i64-anticoagulant">Un INR normal n’exclut pas tous les anticoagulants</button></section>
<section class="ilot" id="i64-6"><h2><span class="n">6</span>Examen clinique immédiat</h2>
<p data-src="R3,R6">Commencer par voies aériennes, respiration, circulation et vigilance, avec glycémie immédiate. Rechercher une asymétrie faciale, un déficit des bras et jambes, un trouble du langage, une déviation du regard, une perte de champ visuel, une asymétrie sensitive et une négligence. Explorer coordination et signes du tronc, notamment si vertige, diplopie, dysphagie ou déséquilibre sévère dominent. La marche n’est testée que si la sécurité le permet.</p>
<p data-src="R3">Le NIHSS structure l’examen : conscience et réponses, consignes, regard, champs visuels, face, motricité de chaque membre, ataxie, sensibilité, langage, dysarthrie et extinction. Décrire les déficits et le retentissement en plus du total. Une intubation, une barrière linguistique, une surdité ou une limitation articulaire modifie l’interprétation ; ne pas inventer un score normal lorsque l’item est non évaluable.</p>
<p data-src="R3,R6">Comparer les deux côtés, donner des consignes simples et vérifier la compréhension. Une aphasie n’est pas une confusion ; une dysarthrie altère l’articulation sans nécessairement altérer le langage. La négligence peut réduire la plainte du patient, tandis qu’un déficit visuel peut être méconnu. Un score bas n’exclut pas une atteinte postérieure ou un handicap majeur pour la personne.</p>
<div class="key" data-src="R3,R6"><b>La clinique localise ; elle ne prouve pas le type vasculaire.</b> Céphalée, vomissements et hypertension peuvent accompagner une hémorragie, mais ne remplacent pas le scanner ou l’IRM. L’aggravation se juge par rapport à un examen initial écrit.</div>
<button class="w" data-k="i64-nihss">Ce que mesure le NIHSS</button><button class="pareto-btn ui" data-k="pareto-i64-examen">▲ Loi de Pareto — Un examen rapide mais complet</button></section>
<section class="ilot" id="i64-7"><h2><span class="n">7</span>Syndromes et localisation</h2>
<table class="t"><thead><tr><th>Syndrome</th><th>Localisation évocatrice</th><th>Précaution</th></tr></thead><tbody><tr><td data-src="R6">Faiblesse et hypoesthésie brachiofaciales, aphasie ou négligence</td><td data-src="R6">Territoire superficiel de l’artère cérébrale moyenne.</td><td data-src="R6">Le langage dépend de l’hémisphère dominant ; ne pas assimiler tout trouble de parole à une aphasie.</td></tr><tr><td data-src="R6">Hémiparésie proportionnée face-bras-jambe</td><td data-src="R6">Voies profondes, notamment capsule interne.</td><td data-src="R6">Un syndrome pur évoque une lésion profonde mais n’en prouve pas la cause.</td></tr><tr><td data-src="R6">Déficit surtout crural, signes frontaux</td><td data-src="R6">Territoire cérébral antérieur.</td><td data-src="R6">Rechercher initiative, comportement et autres signes ; une faiblesse isolée de jambe a aussi des causes périphériques.</td></tr><tr><td data-src="R6">Hémianopsie homonyme, parfois troubles mnésiques ou sensitifs</td><td data-src="R6">Territoire cérébral postérieur ou voies visuelles.</td><td data-src="R6">Ne pas confondre perte monoculaire et perte d’un hémichamp des deux yeux.</td></tr><tr><td data-src="R6">Nerf crânien ipsilatéral et déficit du corps controlatéral</td><td data-src="R6">Syndrome alterne du tronc cérébral.</td><td data-src="R6">Les tableaux peuvent être incomplets ; une diplopie et une dysphagie aiguës sont des alertes.</td></tr><tr><td data-src="R6">Dysphagie/dysphonie, Horner, ataxie ipsilatérale et trouble thermoalgique croisé</td><td data-src="R6">Syndrome bulbaire latéral de Wallenberg.</td><td data-src="R6">L’absence de grande hémiparésie ne rassure pas sur la gravité de la déglutition.</td></tr><tr><td data-src="R6">Ataxie sévère, dysmétrie, vertige, impossibilité de tenir debout</td><td data-src="R6">Cervelet ou voies vestibulaires centrales.</td><td data-src="R6">Une atteinte volumineuse peut comprimer le tronc et provoquer une hydrocéphalie.</td></tr><tr><td data-src="R6">Tétraplégie et anarthrie avec conscience préservée</td><td data-src="R6">Locked-in possible par atteinte pontique.</td><td data-src="R6">Chercher une communication par mouvements oculaires verticaux ; ne pas conclure hâtivement au coma.</td></tr></tbody></table>
<p data-src="R6">La localisation est une hypothèse à tester par l’imagerie. Les territoires se chevauchent, les collatérales varient et plusieurs lésions peuvent coexister. Un syndrome lacunaire clinique ne signifie pas que toute exploration cardiaque ou artérielle devient inutile. <button class="w" data-k="i64-posterieur">Pourquoi FAST peut manquer une circulation postérieure</button>.</p>
<figure data-src="R23,R6"><img src="assets/img/i64/alpha/codex/Gray516.png" width="600" loading="lazy" alt="Planche humaine historique montrant les carotides internes, les artères cérébrales et le système vertébrobasilaire"><figcaption>Artères de la base du cerveau humain — Gray/Carter, Anatomy of the Human Body, 1918, figure 516. Une partie temporale et cérébelleuse est retirée dans la vue originale. Domaine public ; pixels originaux inchangés, repères français adjacents.</figcaption><table class="t"><thead><tr><th>Repère visible dans l’original</th><th>Lecture clinique</th></tr></thead><tbody><tr><td data-src="R23,R6">1 — Internal carotid</td><td data-src="R23,R6">La carotide interne alimente notamment les artères cérébrales antérieure et moyenne ; la branche ophtalmique explique le lien avec l’ischémie rétinienne.</td></tr><tr><td data-src="R23,R6">2 — Anterior communicating</td><td data-src="R23,R6">La communicante antérieure relie les deux côtés ; son existence anatomique ne garantit pas une compensation efficace.</td></tr><tr><td data-src="R23,R6">3 — Basilar / vertebral</td><td data-src="R23,R6">Les vertébrales rejoignent le tronc basilaire, au contact du tronc cérébral ; une atteinte postérieure peut produire diplopie, dysphagie ou syndrome alterne.</td></tr><tr><td data-src="R23,R6">4 — Posterior cerebral</td><td data-src="R23,R6">Les cérébrales postérieures participent aux territoires visuels et profonds. La planche de base ne montre pas toute la distribution corticale.</td></tr></tbody></table>
</figure></section>

<section class="ilot" id="i64-8"><h2><span class="n">8</span>Diagnostic positif et explorations</h2>
<p data-src="R1,R2,R3,R6">L’imagerie urgente répond d’abord à trois questions : existe-t-il une hémorragie, une lésion ischémique ou un diagnostic concurrent ; une artère traitable est-elle occluse ; quelle est l’étendue du tissu lésé ? Scanner sans contraste et IRM ont des avantages différents. Le choix dépend de l’accès immédiat, des contre-indications et de la question, sans retarder inutilement un traitement. Une imagerie vasculaire est ajoutée selon la filière pour identifier une occlusion et organiser un éventuel transfert.</p>
<p data-src="R6">Un scanner normal très tôt n’exclut pas un infarctus. L’IRM de diffusion est sensible aux lésions ischémiques précoces ; la carte ADC aide à reconnaître une restriction réelle. FLAIR renseigne sur les lésions et leur évolution, tandis que T2* ou SWI recherchent le sang. Un résultat négatif doit rester confronté au syndrome et au délai : répéter ou compléter l’examen peut être nécessaire si la suspicion persiste.</p>
<p data-src="R3,R6,R10">La perfusion peut quantifier un décalage entre tissu hypoperfusé et cœur estimé, notamment pour certaines décisions tardives. Un mismatch n’est pas une preuve que chaque voxel sera sauvé. Les seuils dépendent des essais, logiciels et protocoles. L’imagerie avancée ne doit pas devenir un examen obligatoire universel avant toute reperfusion précoce.</p>
<table class="t"><thead><tr><th>Examen parallèle</th><th>Utilité immédiate ou différée</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R6">Glycémie</td><td data-src="R1,R2,R3,R6">Identifier et corriger un trouble métabolique pouvant mimer ou accompagner le déficit.</td></tr><tr><td data-src="R1,R2,R3,R6">NFS/plaquettes, INR, TCA ; tests ciblés d’anticoagulant</td><td data-src="R1,R2,R3,R6">Évaluer l’hémostase et la sécurité ; les tests usuels n’excluent pas tous les anticoagulants directs.</td></tr><tr><td data-src="R1,R2,R3,R6">Créatinine, électrolytes et bilan général orienté</td><td data-src="R1,R2,R3,R6">Interpréter médicaments, contraste et troubles associés ; ne pas multiplier les retards sans motif.</td></tr><tr><td data-src="R1,R2,R3,R6">ECG et monitorage</td><td data-src="R1,R2,R3,R6">Rechercher fibrillation atriale et autres anomalies ; un ECG ponctuel normal n’exclut pas une FA paroxystique.</td></tr><tr><td data-src="R1,R2,R3,R6">Échographie cardiaque et enregistrement prolongé</td><td data-src="R1,R2,R3,R6">Bilan étiologique ciblé après la phase urgente.</td></tr><tr><td data-src="R1,R2,R3,R6">IRM/angiographie complémentaire dans l’HIC</td><td data-src="R1,R2,R3,R6">Cause vasculaire, amyloïde, tumorale ou autre selon âge et topographie.</td></tr></tbody></table>
<button class="w" data-k="i64-imagerie">Lire chaque modalité selon sa question</button><button class="pareto-btn ui" data-k="pareto-i64-diagnostic">▲ Loi de Pareto — Imager puis préciser la cause</button></section>
<section class="ilot" id="i64-9"><h2><span class="n">9</span>Arbre de décision et diagnostics différentiels</h2>
<table class="t"><thead><tr><th>Étape</th><th>Décision</th></tr></thead><tbody><tr><td data-src="R3,R6">Déficit aigu avec défaillance ou hypoglycémie</td><td data-src="R3,R6">Stabiliser et corriger immédiatement, tout en activant la filière AVC.</td></tr><tr><td data-src="R3,R6">Hémorragie à l’imagerie</td><td data-src="R3,R6">Pas de lyse ; évaluer PA, anticoagulants, extension ventriculaire, effet de masse et neurochirurgie.</td></tr><tr><td data-src="R3,R6">Ischémie probable ou confirmée sans hémorragie</td><td data-src="R3,R6">Évaluer simultanément IVT et thrombectomie : délai, déficit invalidant, vaisseau, tissu et risques.</td></tr><tr><td data-src="R3,R6">Symptômes transitoires</td><td data-src="R3,R6">Évaluation urgente d’AIT ou d’infarctus avec récupération ; prévenir la récidive selon la cause.</td></tr><tr><td data-src="R3,R6">Imagerie initiale non contributive</td><td data-src="R3,R6">Réexaminer, vérifier le délai et les limites techniques ; rechercher un simulateur sans abandonner un AVC plausible.</td></tr></tbody></table>
<table class="t"><thead><tr><th>Diagnostic concurrent</th><th>Indices et limites</th></tr></thead><tbody><tr><td data-src="R6">Hypoglycémie ou autre trouble métabolique</td><td data-src="R6">Mesure immédiate ; la correction et l’évolution orientent, mais deux maladies peuvent coexister.</td></tr><tr><td data-src="R6">Crise avec déficit postcritique</td><td data-src="R6">Mouvements rapportés, confusion postcritique, antécédents ; une crise peut aussi révéler un AVC.</td></tr><tr><td data-src="R6">Migraine avec aura</td><td data-src="R6">Symptômes positifs et progression séquentielle peuvent orienter ; première aura inhabituelle ou déficit brutal exige prudence.</td></tr><tr><td data-src="R6">Atteinte vestibulaire périphérique</td><td data-src="R6">Vertige isolé possible ; diplopie, dysarthrie, dysphagie, déficit focal ou ataxie sévère font rechercher une cause centrale.</td></tr><tr><td data-src="R6">Lésion tumorale, infectieuse ou inflammatoire</td><td data-src="R6">Chronologie et imagerie ; un saignement dans une tumeur peut se présenter brutalement.</td></tr><tr><td data-src="R6">Trouble neurologique fonctionnel</td><td data-src="R6">Diagnostic fondé sur des signes positifs et une évaluation compétente, pas sur l’âge ou l’absence de lésion au premier scanner.</td></tr><tr><td data-src="R6">TVC, hémorragie sous-arachnoïdienne, dissection</td><td data-src="R6">Céphalée, contexte et imagerie adaptée ; ne pas enfermer toutes les urgences vasculaires dans la seule opposition I63/I61.</td></tr></tbody></table>
<div class="trap" data-src="R6">La recherche d’un simulateur protège d’un traitement inadapté, mais une liste de diagnostics différentiels ne doit pas retarder une filière justifiée. Aucun score clinique seul ne remplace l’imagerie pour séparer infarctus et hémorragie.</div>
<button class="w" data-k="i64-simulateurs">Un diagnostic alternatif doit expliquer les signes</button></section>
<section class="ilot" id="i64-10"><h2><span class="n">10</span>Prise en charge avant typage</h2>
<p data-src="R3,R11,R12,R13">Le préhospitalier assure l’alerte, la stabilité, la glycémie et la transmission de l’heure, du déficit, des traitements et de l’autonomie antérieure. Le choix Stroke Unit/Stroke Center dépend du réseau et de la probabilité d’un traitement endovasculaire ; il ne se réduit pas à « toujours le plus proche » ou « toujours le plus grand ». Préalerter l’équipe permet de préparer l’imagerie et les décisions avant l’arrivée.</p>
<p data-src="R3,R6">En milieu spécialisé : oxygénation si nécessaire, accès veineux, constantes et surveillance neurologique. Corriger hypoglycémie, hypoxémie, fièvre et troubles hydriques en évitant les corrections excessives. <b>Ne rien donner par la bouche avant une évaluation de la déglutition</b>, y compris eau et comprimés. Une alimentation ou une voie médicamenteuse adaptées sont ensuite organisées. Les valeurs cibles de saturation et de glycémie varient selon protocoles ; les exemples français ne sont pas transformés en normes suisses.</p>
<p data-src="R7">Avant le typage, pas de baisse intensive automatique de la PA. Une autre urgence hypertensive ou une indication spécifique peut modifier la conduite, sous surveillance. Après diagnostic, la stratégie distingue ischémie sans reperfusion, avant/après IVT, après thrombectomie et HIC. Les seuils de ces situations ne sont pas interchangeables.</p>
<p data-src="R12">Les critères suisses publiés en 2024 évaluent une imagerie cérébrale et artérielle en médiane sous 30 minutes après admission lorsque la revascularisation aiguë est possible. Pour la thrombolyse, l’objectif est une médiane sous 30 minutes et un 90e percentile sous 60 minutes. Ce sont des indicateurs d’organisation, pas un temps d’attente autorisé pour chaque patient ; l’ancienne référence de 25 minutes ne doit pas être présentée comme le critère actuel. <button class="w" data-k="i64-delais">Délais mesurés et qualité du réseau</button>.</p>
<p data-src="R34">Une unité mobile AVC peut intégrer scanner, biologie de proximité, télémédecine et équipe spécialisée. L’ESO 2022 suggère ce modèle sur des données de certitude modérée, avec bénéfice de délais et de résultats fonctionnels dans les infarctus étudiés. Cela ne prouve pas qu’un tel véhicule soit disponible dans une région suisse donnée ; l’appel au 144 et le réseau local restent les repères pratiques.</p>
<button class="pareto-btn ui" data-k="pareto-i64-urgence">▲ Loi de Pareto — Les gestes qui gagnent du temps</button></section>
<section class="ilot" id="i64-11"><h2><span class="n">11</span>Reperfusion de l’infarctus</h2>
<p data-src="R1,R2,R9">Une thrombolyse IV se discute chez un patient avec infarctus suspecté ou confirmé, déficit pertinent et risque acceptable, après exclusion d’une hémorragie. Les FI suisses d’Actilyse et Metalyse retiennent la fenêtre de <b>4,5 heures</b> après le dernier état connu asymptomatique. Le choix et les contre-indications sont vérifiés pour le produit exact : altéplase 0,9 mg/kg, maximum 90 mg, ou ténectéplase selon les paliers suisses détaillés en pharmacologie. La recommandation ESO 2023 utilise 0,25 mg/kg et déconseille 0,4 mg/kg ; ne pas fusionner les schémas.</p>
<p data-src="R3,R8,R9">Une occlusion accessible à un traitement endovasculaire exige une discussion immédiate de thrombectomie. Une IVT éligible ne doit pas retarder le transfert ni être omise seulement parce qu’une thrombectomie est prévue. L’indication dépend du vaisseau, du déficit, du tissu, du délai et de l’état antérieur. Les essais récents ont élargi certaines populations, mais n’autorisent pas la thrombectomie systématique des occlusions moyennes ou distales.</p>
<p data-src="R8,R10">Au-delà de la fenêtre de la FI ou au réveil, des stratégies sélectionnées existent : mismatch diffusion/FLAIR ou perfusion, critères propres à l’essai et possibilité de thrombectomie. La recommandation ESO 2021 décrit notamment l’altéplase entre 4,5 et 9 heures avec mismatch si la thrombectomie n’est pas indiquée ou prévue. Des essais 2025 explorent des délais plus longs dans des populations particulières ; ce n’est ni une extension automatique de l’AMM suisse ni une permission d’attendre.</p>
<p data-src="R1,R2,R3">Après lyse : surveillance rapprochée, vigilance pour hémorragie et angio-œdème, contrôle tensionnel et imagerie. Les antiagrégants et l’héparine IV sont évités pendant les premières 24 heures selon les FI ; toute exception de prophylaxie suit le produit et le protocole, après évaluation. Une céphalée nouvelle, un vomissement, une hypertension ou une aggravation neurologique imposent une réévaluation immédiate, pas l’attente du contrôle programmé.</p>
<p data-src="R32"><b>Occlusion basilaire.</b> L’ESO–ESMINT 2024 propose une discussion de reperfusion jusqu’à 24 heures dans des situations sélectionnées. La lyse tardive relève d’un consensus, sans autre contre-indication ni lésions postérieures étendues ; elle n’étend pas automatiquement la FI suisse. L’argument de thrombectomie repose surtout sur des patients avec NIHSS au moins 10, avec une certitude souvent très faible et des différences entre populations. Sous 10, un bénéfice comparable n’est pas établi : le score ne devient ni une interdiction mécanique ni une raison d’ignorer une aggravation.</p>
<div class="trap" data-src="R1,R2,R3">Les FI suisses contre-indiquent une anticoagulation AVK effective avec INR supérieur à 1,3 ; le protocole bernois emploie un seuil différent. Cette divergence est documentée et doit être arbitrée par l’équipe, jamais effacée dans une table hybride.</div>
<button class="w" data-k="i64-lyse">Éligibilité et différences entre sources</button><button class="w" data-k="i64-thrombectomie">La sélection évolue ; le vaisseau reste essentiel</button><button class="pareto-btn ui" data-k="pareto-i64-reperfusion">▲ Loi de Pareto — Traiter tôt, sélectionner précisément</button></section>
<section class="ilot" id="i64-12"><h2><span class="n">12</span>Hémorragie et réversion</h2>
<p data-src="R3,R7,R21">L’HIC demande une prise en charge neurovasculaire urgente : arrêt des antithrombotiques concernés, réversion adaptée si anticoagulation active, contrôle tensionnel et recherche d’effet de masse ou d’hydrocéphalie. L’avis neurochirurgical est précoce dans les situations menaçantes ; tous les hématomes ne relèvent pas de la même intervention. Une extension ventriculaire avec hydrocéphalie ou une atteinte cérébelleuse compressive change l’urgence.</p>
<table class="t"><thead><tr><th>Exposition</th><th>Principe de réversion</th><th>Point de vigilance</th></tr></thead><tbody><tr><td data-src="R3,R15,R16,R21">AVK</td><td data-src="R3,R15,R16,R21">PCC à quatre facteurs avec vitamine K selon produit et protocole ; contrôle rapproché de l’INR.</td><td data-src="R3,R15,R16,R21">Le PCC agit rapidement ; la vitamine K soutient la correction. Les tables de différents concentrés ne se mélangent pas.</td></tr><tr><td data-src="R3,R15,R16,R21">Dabigatran</td><td data-src="R3,R15,R16,R21">Idarucizumab, Praxbind 5 g IV selon FI.</td><td data-src="R3,R15,R16,R21">Surveiller réapparition d’activité anticoagulante, saignement et risque thrombotique sous-jacent.</td></tr><tr><td data-src="R3,R15,R16,R21">Apixaban/rivaroxaban ou autre anti-Xa</td><td data-src="R3,R15,R16,R21">Discussion spécialisée d’un agent de réversion ou PCC selon contexte, produit disponible et protocole.</td><td data-src="R3,R15,R16,R21">Le bénéfice fonctionnel demeure incertain ; diminution de l’expansion et risque thrombotique doivent être pesés.</td></tr><tr><td data-src="R3,R15,R16,R21">Antiagrégant</td><td data-src="R3,R15,R16,R21">Arrêt et prise en charge spécialisée ; pas de transfusion plaquettaire de routine pour toute HIC.</td><td data-src="R3,R15,R16,R21">Le contexte opératoire et les anomalies hématologiques peuvent modifier la décision.</td></tr></tbody></table>
<p data-src="R7,R21">Pour une HIC petite ou modérée vue tôt, viser une PAS sous 140 mmHg peut être proposé dans un ensemble de soins ; éviter l’hypotension et les chutes brutales. La transposition aux très gros hématomes, aux formes graves ou à une PA extrême est moins assurée. Le résultat d’un essai sur l’expansion ne suffit pas à promettre un bénéfice sur autonomie ou survie.</p>
<p data-src="R21">La réversion sous anti-Xa illustre une limite importante : l’ESO 2025 considère l’andexanet dans des situations sélectionnées, mais souligne l’incertitude sur les résultats cliniques et les événements thrombotiques. La dose et les critères du produit doivent être vérifiés dans la FI locale ; aucune dose d’andexanet n’est improvisée ici. L’acide tranexamique n’est pas présenté comme traitement systématique démontré de toute HIC.</p>
<button class="w" data-k="i64-hic">Réversion : identifier d’abord l’anticoagulant</button><button class="pareto-btn ui" data-k="pareto-i64-hemorragie">▲ Loi de Pareto — Arrêter l’expansion sans créer un autre risque</button></section>
<section class="ilot" id="i64-13"><h2><span class="n">13</span>Surveillance et complications</h2>
<p data-src="R3">L’examen initial sert de référence. Répéter vigilance, déficit, pupilles selon contexte et constantes avec une fréquence adaptée à la gravité et au traitement. Le protocole bernois prévoit une imagerie à 24 heures après reperfusion et immédiatement si aggravation. La surveillance ne se réduit pas au NIHSS : respiration, déglutition, douleur, agitation, rétention, infection et complications du point de ponction comptent aussi.</p>
<table class="t"><thead><tr><th>Aggravation ou risque</th><th>Réponse clinique</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R6">Déficit nouveau, céphalée ou baisse de vigilance</td><td data-src="R1,R2,R3,R6">Réévaluation immédiate : hémorragie, extension ischémique, réocclusion, œdème, hydrocéphalie, crise ou trouble métabolique.</td></tr><tr><td data-src="R1,R2,R3,R6">Dysphagie, toux ou encombrement</td><td data-src="R1,R2,R3,R6">Suspendre voie orale, réévaluer déglutition et protection des voies aériennes ; nutrition adaptée.</td></tr><tr><td data-src="R1,R2,R3,R6">Fièvre et infection</td><td data-src="R1,R2,R3,R6">Chercher une cause, traiter selon contexte ; ne pas attribuer toute fièvre à la lésion cérébrale.</td></tr><tr><td data-src="R1,R2,R3,R6">Immobilité</td><td data-src="R1,R2,R3,R6">Prévention personnalisée des thromboses, escarres, douleurs et rétractions ; mobilisation et réadaptation adaptées à la stabilité.</td></tr><tr><td data-src="R1,R2,R3,R6">Après accès artériel</td><td data-src="R1,R2,R3,R6">Inspecter le site et le membre : hématome, douleur, hypotension, chute d’hémoglobine ou ischémie périphérique imposent un avis rapide.</td></tr><tr><td data-src="R1,R2,R3,R6">Angio-œdème après lyse</td><td data-src="R1,R2,R3,R6">Protéger les voies aériennes, interrompre une perfusion en cours et appliquer le protocole d’urgence.</td></tr></tbody></table>
<p data-src="R3,R6">La prévention des complications associe soins infirmiers, physiothérapie, ergothérapie, logopédie et nutrition. Une intervention « précoce » doit rester compatible avec l’état hémodynamique et neurologique ; elle n’est pas synonyme de mobilisation intensive immédiate chez tous. Les objectifs sont individualisés et réévalués.</p>
<button class="w" data-k="i64-surveillance">Une aggravation n’attend pas le prochain score</button></section>
<section class="ilot" id="i64-14"><h2><span class="n">14</span>Prévention, réadaptation et pronostic</h2>
<p data-src="R3,R6">La prévention secondaire traite la <b>cause</b> : antiagrégant pour une maladie non cardioembolique appropriée ; anticoagulation si fibrillation atriale ou autre indication, à un moment individualisé ; discussion d’une sténose symptomatique ; contrôle tensionnel et lipidique, arrêt du tabac et prise en charge du diabète. On ne prescrit pas empiriquement un anticoagulant direct à tout infarctus dont la cause est encore inconnue.</p>
<p data-src="R3,R18,R20">Une double antiagrégation courte peut être indiquée après certains infarctus mineurs ou AIT à haut risque, avec critères et durée définis. Le protocole bernois utilise notamment trois semaines dans une population sélectionnée. Cela ne s’étend ni à toute hémorragie ni à tout AVC, et la FI de Clopidogrel Axapharm ne recommande pas son emploi pendant les sept premiers jours : l’écart entre FI et stratégie clinique doit être explicite. La FI d’Aspirine Cardio après AIT et la dose de prévention du protocole bernois diffèrent également.</p>
<p data-src="R3,R6">Le suivi évalue récupération motrice, marche, langage, déglutition, cognition, fatigue, humeur, douleur, spasticité, continence et sexualité. Vérifier observance, tolérance, soutien du proche, logement, reprise du travail et accès aux thérapies. Une amélioration du NIHSS ne garantit pas le retour à une vie autonome ; la fatigue et les troubles cognitifs peuvent rester invalidants avec peu de signes moteurs.</p>
<p data-src="R3">La mRS décrit le handicap global de 0 à 6 ; elle ne remplace pas les objectifs personnels. Le pronostic dépend de la lésion, de la gravité initiale, des complications, de la récupération et du contexte antérieur. Aucun score isolé ne doit servir de prédiction certaine ou de justification automatique d’une limitation de soins. Les souhaits du patient et une discussion collégiale comptent.</p>
<p data-src="R3,R6">Le retour à la conduite nécessite une évaluation adaptée aux déficits et aux règles suisses en vigueur. La table reprise dans le document bernois est une position non contraignante issue d’un cadre allemand : ses délais ne sont pas présentés ici comme une loi suisse. Informer le patient de l’évaluation nécessaire avant reprise, ainsi que des signes de récidive imposant le 144.</p>
<button class="pareto-btn ui" data-k="pareto-i64-suivi">▲ Loi de Pareto — Prévenir la récidive et retrouver une vie possible</button></section>
<section class="ilot" id="i64-15"><h2><span class="n">15</span>Situations particulières</h2>
<table class="t"><thead><tr><th>Situation</th><th>Adaptation indispensable</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R4">AVC au réveil ou horaire inconnu</td><td data-src="R1,R2,R3,R4">Garder les trois horloges ; sélectionner par une stratégie d’imagerie validée, sans inventer l’heure de début.</td></tr><tr><td data-src="R1,R2,R3,R4">Déficit mineur mais invalidant</td><td data-src="R1,R2,R3,R4">Décrire le handicap réel : langage, main professionnelle, vision ou marche. Le total NIHSS n’est pas une décision autonome.</td></tr><tr><td data-src="R1,R2,R3,R4">Sujet très âgé ou handicap antérieur</td><td data-src="R1,R2,R3,R4">Évaluer autonomie, objectifs, comorbidités et bénéfice-risque ; pas d’exclusion fondée sur l’âge seul.</td></tr><tr><td data-src="R1,R2,R3,R4">Grossesse ou post-partum</td><td data-src="R1,R2,R3,R4">Coordination neurovasculaire et obstétricale ; rechercher causes spécifiques, saignement et risques du produit. Les FI des thrombolytiques imposent une appréciation bénéfice-risque.</td></tr><tr><td data-src="R1,R2,R3,R4">Enfant ou adolescent</td><td data-src="R1,R2,R3,R4">Filière pédiatrique spécialisée ; Actilyse a des dispositions dès 16 ans, Metalyse n’est pas recommandé sous 18 ans dans les FI relues. Ne pas transposer l’adulte.</td></tr><tr><td data-src="R1,R2,R3,R4">Insuffisance rénale ou hépatique</td><td data-src="R1,R2,R3,R4">Identifier effet sur anticoagulants, produits et risques ; absence de formule FI n’autorise pas une réduction arbitraire.</td></tr><tr><td data-src="R1,R2,R3,R4">Anticorps anti-amyloïdes</td><td data-src="R1,R2,R3,R4">Déficit possible par ARIA ou AVC ; IRM adaptée et décision spécialisée avant lyse, thrombectomie sans bridging privilégiée si rapidement accessible.</td></tr></tbody></table>
<p data-src="R4">Le signal anti-amyloïde repose sur peu de données : les cas rapportés ne donnent pas une fréquence individuelle fiable. Il modifie la prudence et l’imagerie, sans permettre d’inventer une interdiction absolue de toute reperfusion. Le nom et la date de la dernière administration doivent être transmis à l’équipe.</p>
<button class="w" data-k="i64-aria">ARIA et AVC : une interaction diagnostique récente</button></section>
<section class="ilot" id="i64-16"><h2><span class="n">16</span>Critères et scores sans automatisme</h2>
<table class="t"><thead><tr><th>Outil ou critère</th><th>Ce qu’il apporte</th><th>Ce qu’il ne décide pas seul</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R7,R10">NIHSS</td><td data-src="R1,R2,R3,R7,R10">Description standardisée du déficit et de son évolution.</td><td data-src="R1,R2,R3,R7,R10">Nature hémorragique/ischémique, retentissement personnel, absence d’AVC postérieur.</td></tr><tr><td data-src="R1,R2,R3,R7,R10">mRS</td><td data-src="R1,R2,R3,R7,R10">Handicap global avant et après l’événement.</td><td data-src="R1,R2,R3,R7,R10">Qualité de vie complète, cognition détaillée ou bénéfice individuel certain d’un traitement.</td></tr><tr><td data-src="R1,R2,R3,R7,R10">DWI/FLAIR</td><td data-src="R1,R2,R3,R7,R10">Décalage tissulaire utilisé dans certaines sélections au réveil.</td><td data-src="R1,R2,R3,R7,R10">Heure exacte de début pour chaque patient.</td></tr><tr><td data-src="R1,R2,R3,R7,R10">Mismatch de perfusion</td><td data-src="R1,R2,R3,R7,R10">Comparaison de volumes selon une méthode et des seuils d’essai.</td><td data-src="R1,R2,R3,R7,R10">Garantie de tissu récupérable ni indication indépendante de tout autre critère.</td></tr><tr><td data-src="R1,R2,R3,R7,R10">PA avant/après IVT</td><td data-src="R1,R2,R3,R7,R10">ESO : sous 185/110 avant, puis sous 180/105 pendant 24 heures.</td><td data-src="R1,R2,R3,R7,R10">Cible intensive universelle avant typage ou après thrombectomie réussie.</td></tr><tr><td data-src="R1,R2,R3,R7,R10">INR sous AVK</td><td data-src="R1,R2,R3,R7,R10">Paramètre d’hémostase à interpréter avec la FI et le contexte.</td><td data-src="R1,R2,R3,R7,R10">Exclusion fiable de tous les anticoagulants directs.</td></tr></tbody></table>
<p data-src="R3,R14">Il n’existe pas ici de score qui « confirme I64 ». La catégorie documentaire n’a pas de critères cliniques autonomes. La décision repose sur le syndrome, l’imagerie, le mécanisme et les règles du traitement choisi. Les scores détaillés sont des outils de communication ; leur apprentissage exige aussi un examen supervisé.</p>
<button class="w" data-k="i64-mrs">Handicap et autonomie : lecture de la mRS</button></section>
<section class="ilot" id="i64-17"><h2><span class="n">17</span>Points clés et pièges</h2>
<div class="key" data-src="R1,R2,R3,R6,R7"><b>À retenir.</b> Déficit soudain : 144 et filière spécialisée. Mesurer la glycémie, dater le dernier état normal, décrire le déficit et imager vite. I64 ne signifie pas « infarctus de cause inconnue ». Les traitements suivent le type d’AVC ; les fenêtres étendues exigent une sélection, les doses une FI exacte. La surveillance et la réadaptation commencent dès la phase aiguë.</div>
<table class="t"><thead><tr><th>Piège</th><th>Correction</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R6,R7,R21">Attendre une récupération spontanée</td><td data-src="R1,R2,R3,R6,R7,R21">Un déficit transitoire reste une urgence.</td></tr><tr><td data-src="R1,R2,R3,R6,R7,R21">Rassurer sur un faible NIHSS</td><td data-src="R1,R2,R3,R6,R7,R21">Décrire retentissement, vision et circulation postérieure.</td></tr><tr><td data-src="R1,R2,R3,R6,R7,R21">Appeler tout scanner normal « absence d’AVC »</td><td data-src="R1,R2,R3,R6,R7,R21">Tenir compte du délai, du territoire et de la modalité ; compléter si nécessaire.</td></tr><tr><td data-src="R1,R2,R3,R6,R7,R21">Donner aspirine ou lyse avant exclusion du sang</td><td data-src="R1,R2,R3,R6,R7,R21">Le traitement antithrombotique dépend du typage et du risque.</td></tr><tr><td data-src="R1,R2,R3,R6,R7,R21">Utiliser la dose de Metalyse de l’infarctus myocardique</td><td data-src="R1,R2,R3,R6,R7,R21">Vérifier flacon 25 mg/5 000 U et paliers AVC suisses.</td></tr><tr><td data-src="R1,R2,R3,R6,R7,R21">Fusionner FI et protocole local</td><td data-src="R1,R2,R3,R6,R7,R21">Documenter les divergences et faire arbitrer la stratégie.</td></tr><tr><td data-src="R1,R2,R3,R6,R7,R21">Prendre une baisse d’hématome pour une guérison prouvée</td><td data-src="R1,R2,R3,R6,R7,R21">Distinguer critère radiologique et résultat fonctionnel.</td></tr><tr><td data-src="R1,R2,R3,R6,R7,R21">Réduire le suivi au bras et à la marche</td><td data-src="R1,R2,R3,R6,R7,R21">Rechercher fatigue, humeur, cognition, langage et participation sociale.</td></tr></tbody></table>

<section class="ilot" id="i64-18"><h2><span class="n">18</span>Formation suisse : correspondances pédagogiques</h2>
<p data-src="R28,R29,R30">Cette leçon se rapproche des situations PROFILES 2017 SSP 96–105 : équilibre, marche, mouvements, langage, vertige, céphalée, cognition, parésie, sensibilité et crises, ainsi que de l’examen neurologique de l’EPA 2. Il s’agit d’un rapprochement pédagogique de l’auteur, pas d’une correspondance officielle entre I64 et ces situations. MEBEKO 2026 mentionne 265 situations de départ. La publication suisse sur PROFILES 2 précise une entrée en vigueur au semestre 2025/26 et une utilisation comme base de l’examen fédéral à partir de 2028 ; les identifiants des versions ne doivent pas être mélangés. <button class="w" data-k="i64-formation">Versions et calendrier</button></p>
</section>
<section class="ilot" id="i64-auto-evaluation"><h2>Auto-évaluation raisonnée — cas fictifs</h2><div class="quiz ui"><p data-src="R3,R14"><b>Cas 1.</b> L’IRM confirme un infarctus, mais la cause reste inconnue.</p>
<button data-ok="1">Le type reste un infarctus ; poursuivre le bilan étiologique.</button><button data-ok="0">Le code I64 devient obligatoire parce que la cause est inconnue.</button><p class="fb" hidden data-src="R3,R14">I64 désigne une nature non précisée, pas une étiologie inconnue.</p></div><div class="quiz ui"><p data-src="R2,R9"><b>Cas 2.</b> Pour un patient de 65 kg, l’équipe applique la FI suisse Metalyse 5 000 U.</p>
<button data-ok="1">Le palier FI est 17,5 mg, soit 3,5 ml à 5 mg/ml.</button><button data-ok="0">La dose coronarienne peut être reprise si le poids est le même.</button><p class="fb" hidden data-src="R2,R9">La FI suisse AVC utilise des paliers ; la présentation et l’indication doivent être contrôlées.</p></div><div class="quiz ui"><p data-src="R6,R13"><b>Cas 3.</b> Vertige aigu avec dysphagie et ataxie sévère, sans grande faiblesse du bras.</p>
<button data-ok="1">Rechercher une atteinte de circulation postérieure en urgence.</button><button data-ok="0">Exclure un AVC parce que FAST moteur est peu contributif.</button><p class="fb" hidden data-src="R6,R13">Une atteinte du tronc ou du cervelet peut être grave sans hémiparésie majeure.</p></div><div class="quiz ui"><p data-src="R7"><b>Cas 4.</b> Après thrombectomie réussie, une cible systématique de PAS inférieure à 140 est envisagée.</p>
