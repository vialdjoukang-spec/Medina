<template id="ch-G22"><div class="chap"><div class="chap-head"><div class="code">G22 · Neurologie</div><h1>G22 — Syndrome parkinsonien au cours de maladies classées ailleurs</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G22"><section class="ilot" id="g22-question"><h2>Un ralentissement moteur demande un diagnostic de syndrome et de cause</h2><p>Une personne décrit une écriture devenue petite, des gestes lents ou une difficulté à marcher. La première question est de savoir si elle présente réellement une bradykinésie avec rigidité et/ou tremblement de repos. La seconde est d’en rechercher la cause. Une sérologie, une anomalie radiologique ou un médicament associé ne répond pas à lui seul à ces deux questions. Le début, la progression et les autres signes orientent le raisonnement.</p><p>G22* désigne le syndrome parkinsonien au cours de maladies classées ailleurs. Il s’agit d’un code de manifestation. L’inclusion explicitement vérifiée dans la classification française est le parkinsonisme syphilitique, associé à A52.1†. La leçon explique cette situation et les diagnostics concurrents traitables, sans faire de G22 le code de tous les syndromes parkinsoniens secondaires.</p><div class="key"><b>À retenir.</b> Confirmer le syndrome, établir la cause et vérifier l’association de codes ; trois démarches liées, mais distinctes.</div><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r2">[2]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button> · <button class="w" data-k="g22-r12">[12]</button></p></section><section class="ilot" id="g22-definition"><h2>Le syndrome parkinsonien ne se réduit ni au tremblement ni au manque de force</h2><p><button class="w" data-k="g22-parkinsonisme">Bradykinésie, rigidité et tremblement : quels mots employer ?</button></p><table class="t"><thead><tr><th>Terme</th><th>Ce que l’examen cherche</th><th>Ce qui ne suffit pas</th></tr></thead><tbody><tr><td>Bradykinésie</td><td>Gestes ralentis et amplitude observée durant des répétitions comparables.</td><td>Dire seulement que la personne est fatiguée.</td></tr><tr><td>Rigidité</td><td>Résistance passive chez une personne relâchée.</td><td>Douleur ou roue dentée isolée sans résistance.</td></tr><tr><td>Tremblement</td><td>Préciser repos, posture et action.</td><td>Conclure que tout tremblement est Parkinson.</td></tr><tr><td>Force</td><td>Capacité de produire une force, examinée séparément.</td><td>Assimiler lenteur et parésie.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le signe doit être observé et décrit avant d’être interprété comme une maladie.</div><p>Sources : <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-code-body"><h2>G22* est un code de manifestation : vérifier la paire, puis l’ordre</h2><p><button class="w" data-k="g22-codage">Dague et étoile : portée réelle de G22*</button></p><p>Le dossier doit nommer la maladie causale et décrire le syndrome effectivement présent, avec le niveau de certitude. Une syphilis ancienne traitée ou une sérologie isolée ne démontre pas que le ralentissement actuel est syphilitique. La cause et la manifestation sont documentées avant la traduction dans le codage.</p><div class="trap"><span class="k">Piège</span> « Secondaire » dans une revue clinique n’est pas synonyme de « G22* » dans la classification.</div><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r2">[2]</button> · <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r12">[12]</button></p></section><section class="ilot" id="g22-epidemiologie"><h2>Les données de syphilis et de Parkinson ne mesurent pas l’incidence de G22</h2><p>Aucune estimation nationale suisse spécifique de l’incidence ou de la prévalence de G22 n’a été établie dans les sources réellement lues. Il n’est donc pas justifié d’annoncer une fréquence suisse précise, une répartition exhaustive par âge ou un pronostic chiffré propre à ce code. Les observations de parkinsonisme associé à une neurosyphilis documentent la possibilité clinique, pas un dénominateur populationnel.</p><p>Le guide OFSP 2026 indique environ 12 nouvelles infections ou réinfections syphilitiques pour 100 000 habitants et près de 90 % d’hommes parmi les cas. Ces données portent sur la syphilis globale et ne quantifient ni la neurosyphilis ni le parkinsonisme syphilitique. Les observations estonienne de 2016 et chinoise de 2025 décrivent des hommes de 42 et 50 ans ; ces deux âges ne définissent pas une distribution de G22.</p><div class="key"><b>À retenir.</b> Toujours lire le numérateur et le dénominateur : une infection fréquente ne rend pas chacune de ses manifestations fréquente.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r9">[9]</button> · <button class="w" data-k="g22-r13">[13]</button></p></section><section class="ilot" id="g22-causes"><h2>Chercher une cause cohérente avec le tempo et les signes associés</h2><p><button class="w" data-k="g22-causes">La cause change le traitement, pas seulement le nom du syndrome</button></p><table class="t"><thead><tr><th>Contexte</th><th>Question utile</th><th>Limite</th></tr></thead><tbody><tr><td>Infectieux ou immunodéprimé</td><td>Neurosyphilis, foyer et autres infections selon terrain ?</td><td>Ne pas demander une série indifférenciée de tests à toute personne.</td></tr><tr><td>Hépatique, psychiatrique et moteur</td><td>Un bilan Wilson est-il indiqué ?</td><td>Un cuivre isolé ne suffit ni à confirmer ni à exclure.</td></tr><tr><td>Nouvelle exposition médicamenteuse</td><td>Chronologie et plausibilité de l’iatrogénie ?</td><td>Ne pas arrêter brutalement un traitement nécessaire.</td></tr><tr><td>Début focal ou aigu</td><td>Lésion vasculaire ou structurale ?</td><td>L’urgence clinique précède le classement de code.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-anamnese"><h2>L’histoire précise ce que le mot lenteur recouvre</h2><p>Faire décrire les premières difficultés par la personne et, avec son accord, par un proche : écriture, toilette, repas, habillage, démarrage de la marche, chutes, voix et autonomie. Préciser la date, le mode d’installation, la symétrie et les fluctuations. Une évolution en quelques semaines ou l’association à une modification cognitive ou comportementale ne doit pas être banalisée comme vieillissement.</p><p><button class="w" data-k="g22-histoire">Questions ciblées et respect de la personne</button></p><div class="key"><b>À retenir.</b> Une chronologie précise permet de tester les causes possibles ; une simple liste de diagnostics les juxtapose.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r9">[9]</button> · <button class="w" data-k="g22-r10">[10]</button></p></section><section class="ilot" id="g22-examen-body"><h2>Examiner le mouvement, puis les autres systèmes neurologiques</h2><p>Observer d’abord la conversation et les gestes spontanés : expression du visage, voix, utilisation des mains, installation sur la chaise et marche si elle est sûre. Faire répéter les mouvements des doigts, l’ouverture-fermeture des mains, la pronation-supination et les mouvements des pieds, dans des conditions comparables. Comparer droite et gauche, noter vitesse, amplitude et évolution au cours de la séquence.</p><p><button class="w" data-k="g22-examen">Un examen reproductible ne se limite pas à un résultat positif</button></p><div class="key"><b>À retenir.</b> La bradykinésie est une performance motrice observée ; l’examen associé localise et recherche une autre explication.</div><p>Sources : <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button> · <button class="w" data-k="g22-r16">[16]</button></p></section><section class="ilot" id="g22-urgence"><h2>Déficit aigu, confusion ou menace visuelle : organiser une évaluation urgente</h2><p>Une installation brutale, une baisse de vigilance, une crise, un déficit focal, une céphalée inhabituelle avec fièvre ou un trouble visuel aigu ne relève pas d’un simple essai dopaminergique ambulatoire. Stabiliser et mobiliser l’équipe urgente, avec imagerie et investigations adaptées au contexte. L’étiquette de parkinsonisme ne doit pas retarder la prise en charge d’une infection centrale, d’une complication vasculaire ou d’une autre lésion.</p><p>Une détérioration neurologique sous traitement demande aussi une réévaluation : progression causale, autre maladie, effet médicamenteux et exposition excessive peuvent donner des signes proches. Avec pénicilline à forte dose, insuffisance rénale et susceptibilité convulsive augmentent le risque neurotoxique. Sous chélateur du cuivre, une aggravation initiale paradoxale est possible ; elle n’autorise pas une adaptation improvisée.</p><div class="trap"><span class="k">Piège</span> Attribuer une confusion nouvelle à la maladie connue sans recontrôler signes vitaux, médicaments et fonction rénale peut masquer une complication.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-neurosyph-body"><h2>Neurosyphilis : établir l’infection neurologique et son rôle dans le syndrome</h2><p><button class="w" data-k="g22-lcr-syph">De la sérologie à une hypothèse neurologique étayée</button></p><p>Une atteinte cognitive, psychiatrique, pupillaire, vasculaire ou cérébelleuse associée peut renforcer la nécessité d’une enquête. Aucune association isolée n’est pathognomonique. Les deux observations publiées montrent des présentations possibles ; leur amélioration après traitement ne transforme pas chaque ralentissement avec sérologie positive en parkinsonisme syphilitique.</p><div class="key"><b>À retenir.</b> Séropositivité, infection neurologique et causalité du syndrome doivent être reliées, sans les rendre équivalentes.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r9">[9]</button></p></section>

<section class="ilot" id="g22-criteres-body"><h2>Critères formels : ils répondent à des questions différentes</h2><p><button class="w" data-k="g22-criteres">Critères de neurosyphilis, Leipzig et syndrome moteur</button></p><table class="t"><thead><tr><th>Outil</th><th>Question</th><th>Limite</th></tr></thead><tbody><tr><td>Noyau moteur</td><td>Existe-t-il un syndrome parkinsonien ?</td><td>Ne démontre pas la maladie causale.</td></tr><tr><td>Critères de neurosyphilis</td><td>Le tableau est-il compatible avec une infection neurologique syphilitique ?</td><td>Ne remplace pas l’interprétation biologique ni l’enquête concurrente.</td></tr><tr><td>Leipzig</td><td>Quel faisceau soutient Wilson ?</td><td>Pas un score de parkinsonisme ni une paire de codes.</td></tr><tr><td>Dague-étoile</td><td>Comment coder une association vérifiée ?</td><td>Ne crée pas la preuve médicale.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r11">[11]</button> · <button class="w" data-k="g22-r12">[12]</button></p></section><section class="ilot" id="g22-wilson-body"><h2>Wilson est un différentiel traitable : rechercher un faisceau de preuves</h2><p><button class="w" data-k="g22-wilson">Ne pas exclure Wilson sur un seul dosage normal</button></p><p>Le diagnostic de Wilson, son traitement et son codage doivent être séparés. Cette leçon l’utilise pour apprendre à identifier une cause possible et un piège de raisonnement ; elle n’affirme pas que toute manifestation parkinsonienne de Wilson reçoit G22*.</p><div class="key"><b>À retenir.</b> Une cause traitable mérite une enquête précise ; elle ne justifie ni un test unique décisif ni un code associé supposé.</div><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button></p></section><section class="ilot" id="g22-differentiel"><h2>Les diagnostics concurrents restent ouverts pendant l’enquête</h2><table class="t"><thead><tr><th>Hypothèse</th><th>Éléments à examiner</th><th>Erreur à éviter</th></tr></thead><tbody><tr><td>Maladie de Parkinson ou autre dégénérescence</td><td>Tempo, signes moteurs/non moteurs, examen et évolution spécialisée.</td><td>Utiliser une amélioration sous lévodopa comme preuve unique.</td></tr><tr><td>Iatrogénie</td><td>Médicament, date et variation de dose ; discussion avec prescripteur.</td><td>Arrêter sans plan ou ignorer une autre cause associée.</td></tr><tr><td>Atteinte vasculaire ou structurale</td><td>Installation, focalité, autres déficits et imagerie.</td><td>Attribuer tout ralentissement à une anomalie banale de l’image.</td></tr><tr><td>Ataxie, faiblesse ou limitation douloureuse</td><td>Coordination, force, sensibilité, articulations et compréhension.</td><td>Appeler toute marche lente parkinsonienne.</td></tr><tr><td>Infection ou trouble métabolique</td><td>Terrain, signes associés et investigations ciblées.</td><td>Confondre test positif, causalité et code manifestation.</td></tr></tbody></table><p>Le diagnostic peut changer avec le temps. Une réponse symptomatique imparfaite ne prouve pas une infection et ne l’exclut pas. La coexistence de plusieurs facteurs est possible : médicament, lésion et maladie dégénérative ne s’excluent pas toujours. La réévaluation s’appuie sur des faits nouveaux, pas sur le simple maintien d’une première étiquette.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-traitement-cause"><h2>Traiter la cause et soutenir la fonction en parallèle</h2><p><button class="w" data-k="g22-traitement">Deux objectifs : interrompre le mécanisme causal et réduire le handicap</button></p><div class="key"><b>À retenir.</b> Le traitement causal n’efface pas le besoin de rééducation ; le soulagement symptomatique n’efface pas le besoin de preuve causale.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r14">[14]</button></p></section><section class="ilot" id="g22-complications"><h2>Le pronostic dépend de la cause, des lésions et de la réponse</h2><p>Les conséquences comprennent difficultés de marche et de gestes, chutes, perte d’autonomie et troubles cognitifs ou comportementaux selon l’atteinte. Une évolution aiguë ou une complication visuelle, vasculaire ou convulsive demande une prise en charge propre. Le traitement précoce d’une cause accessible peut améliorer la fonction, sans garantir la récupération complète d’un réseau lésé.</p><p><button class="w" data-k="g22-pronostic">Ce que les observations permettent réellement de dire</button></p><div class="trap"><span class="k">Piège</span> Promettre une réversibilité complète à partir d’un cas publié transforme une possibilité en certitude.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r9">[9]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-suivi"><h2>Le suivi distingue réponse clinique, preuve biologique et toxicité</h2><p>Documenter marche, gestes, cognition, activités quotidiennes, chutes et tolérance au traitement. Pour la neurosyphilis, le guide privilégie le suivi clinique ; la nécessité d’un contrôle du liquide dépend notamment de la réponse, d’une aggravation et du traitement réellement reçu. Une ponction de contrôle systématique n’est pas déduite du seul code G22. Les anticorps tréponémiques persistants ne sont pas un indicateur de guérison à eux seuls.</p><p>Dans Wilson, les observations neurologiques, paramètres hépatiques et bilan du cuivre sont interprétés ensemble. Une excrétion urinaire sous chélateur ne mesure pas directement la charge tissulaire. Une valeur basse peut demander d’examiner observance, surtraitement et autres paramètres ; une dose ne se change pas sur une valeur isolée. La FI Cuprior prévoit un suivi plus rapproché au début et lors des changements.</p><p>Réévaluer aussi traitements associés, organes, déglutition et sécurité de la marche. La personne et ses proches reçoivent des critères de recontact : nouveau déficit, confusion, crise, réaction allergique, aggravation fonctionnelle ou effet indésirable. Le calendrier est adapté à la cause et à la stabilité, sans intervalle universel G22.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button></p></section><section class="ilot" id="g22-suisse"><h2>Parcours suisse : déclaration de la cause et accès aux soins</h2><p><button class="w" data-k="g22-declaration">Syphilis : les responsabilités de déclaration sont distinctes</button></p><p>Coordonner neurologie, infectiologie ou hépatologie selon la cause, laboratoire, pharmacie et rééducation. Les règles détaillées de remboursement, de listes de spécialités, de prestations d’assurance, de conduite et d’invalidité n’ont pas été vérifiées exhaustivement pour ce code. Elles sont examinées avec les professionnels compétents pour la situation réelle ; aucune absence d’obligation n’est affirmée.</p><div class="key"><b>À retenir.</b> Déclarer selon la maladie causale et les critères applicables ; G22 n’est pas un formulaire de déclaration en soi.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r12">[12]</button> · <button class="w" data-k="g22-r13">[13]</button></p></section><section class="ilot" id="g22-situations"><h2>Enfant, grossesse, allaitement et organes : ne pas prolonger le schéma adulte par défaut</h2><p>La présentation et les investigations de Wilson peuvent concerner l’enfant ; les doses adultes de cette leçon ne lui sont pas appliquées automatiquement. Cuprior est indiqué à partir de cinq ans dans les conditions de sa notice ; en dessous, efficacité et sécurité ne sont pas établies pour cette formulation. Les informations d’adaptation rénale et hépatique restent spécifiques au produit.</p><p>Le guide EASL recommande de maintenir une thérapie anti-cuivre pendant grossesse et allaitement. La FI Cuprior demande une évaluation individuelle bénéfice-risque pendant grossesse, envisage une dose efficace minimale et une surveillance ; pour l’allaitement, elle demande une décision entre allaitement et traitement selon bénéfices. Ces niveaux de recommandation ne sont pas effacés : planification conjointe spécialisée, sans arrêt brutal spontané.</p><p>La FI pénicilline autorise l’emploi pendant la grossesse ; les expositions et précautions d’allaitement restent décrites pour ce produit. Allergie, rein, foie, âge et traitements associés peuvent changer le choix. Il n’existe pas de dose ou d’intervalle universel fondé sur le seul code de manifestation.</p><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r14">[14]</button></p></section><section class="ilot" id="g22-cas"><h2>Quatre exercices pour relier signe, preuve et décision</h2><div class="quiz ui" id="g22-q1"><p><b>Cas pédagogique fictif 1.</b> Une personne bouge lentement mais sa force est conservée. Quel examen précise le syndrome ?</p><button data-ok="1">Observer des mouvements répétés et rechercher rigidité ou tremblement de repos.</button><button data-ok="0">Conclure à une paralysie sur la lenteur seule.</button><p class="fb" hidden>La force et la vitesse sont des dimensions différentes. Décrire les mouvements répétés, vérifier les facteurs limitants et rechercher les signes associés.</p></div><div class="quiz ui" id="g22-q2"><p><b>Cas pédagogique fictif 2.</b> Un test tréponémique sérique reste positif après un traitement ancien. Cela suffit-il à expliquer un parkinsonisme actuel ?</p><button data-ok="1">Non : confronter clinique, traitements antérieurs et investigations neurologiques adaptées.</button><button data-ok="0">Oui : le test prouve une infection cérébrale active.</button><p class="fb" hidden>Une cicatrice sérologique peut persister. La cause neurologique demande un faisceau de preuves, avec étude du liquide selon indication.</p></div><div class="quiz ui" id="g22-q3"><p><b>Cas pédagogique fictif 3.</b> Une maladie de Wilson est confirmée. Quelle conclusion de codage est établie par cette leçon ?</p><button data-ok="1">Vérifier l’association dans la classification ; G22 ne devient pas automatique.</button><button data-ok="0">Toute cause secondaire porte G22* sans code causal.</button><p class="fb" hidden>G22 est un code manifestation et ne s’utilise pas seul. L’inclusion syphilitique est vérifiée ; les autres couples ne sont pas présumés.</p></div><div class="quiz ui" id="g22-q4"><p><b>Cas pédagogique fictif 4.</b> Trois comprimés de Cuprior à 150 mg de trientine base représentent quelle masse quotidienne si c’est le nombre total prescrit ?</p><button data-ok="1">450 mg de trientine base au total, avec répartition décidée par la prescription.</button><button data-ok="0">450 mg de sel interchangeable avec toute présentation de trientine.</button><p class="fb" hidden>Le calcul porte sur la base par comprimé. La formulation, l’indication, la répartition et la surveillance restent à vérifier ; cet exercice n’est pas une ordonnance.</p></div><div class="key"><b>À retenir.</b> Pour l’examen fédéral : expliciter ce que le signe prouve, ce que le test ne prouve pas et ce qui rend la décision urgente.</div><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r12">[12]</button> · <button class="w" data-k="g22-r15">[15]</button></p></section><section class="ilot" id="g22-synthese"><h2>Une démarche courte, réévaluable et traçable</h2><table class="t"><thead><tr><th>Étape</th><th>Résultat attendu</th></tr></thead><tbody><tr><td>Décrire</td><td>Noyau moteur observé, autonomie et facteurs limitants.</td></tr><tr><td>Localiser et hiérarchiser</td><td>Autres systèmes, tempo, signes de gravité et image selon contexte.</td></tr><tr><td>Établir la cause</td><td>Faisceau cohérent, limites des tests et diagnostics concurrents.</td></tr><tr><td>Traiter</td><td>Cause, handicap et sécurité, produit exact et surveillance.</td></tr><tr><td>Réévaluer</td><td>Réponse, toxicité, complications et nouvelle information.</td></tr><tr><td>Coder</td><td>Paire causale/manifestation vérifiée et règles suisses applicables.</td></tr></tbody></table><button class="pareto-btn ui" data-k="pareto-g22-a">▲ Loi de Pareto — Syndrome, cause, code</button><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button> · <button class="w" data-k="g22-r12">[12]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g22-e-strategie"><h2>Les examens partent de la question clinique</h2><p>Aucun bilan unique ne convient à tout ralentissement moteur. L’examen clinique et la chronologie déterminent la recherche de lésion, d’infection, de trouble métabolique ou d’iatrogénie. Une forme aiguë, focalisée ou rapidement progressive ne suit pas le même rythme qu’un tableau lentement évolutif. Nommer la question dans la demande permet au laboratoire et à l’imagerie de répondre utilement.</p><table class="t"><thead><tr><th>Question</th><th>Examen orienté</th><th>Limite</th></tr></thead><tbody><tr><td>Lésion structurale ou vasculaire ?</td><td>IRM ou autre imagerie adaptée à l’urgence et au contexte.</td><td>Image seule ne prouve pas la cause de tous les signes.</td></tr><tr><td>Neurosyphilis plausible ?</td><td>Sérologie spécifique confirmée ; liquide-sérum selon indication et sécurité.</td><td>Sérologie ancienne ou VDRL liquide négatif isolé insuffisants.</td></tr><tr><td>Wilson plausible ?</td><td>Bilan cuivre multimodal, lampe à fente, foie et génétique selon équipe.</td><td>Céruloplasmine normale et seuil isolé ne closent pas le dossier.</td></tr><tr><td>Facteur iatrogène ou limitation ?</td><td>Revue des traitements et réexamen.</td><td>L’absence d’anomalie biologique ne démontre pas une cause dégénérative.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-e-irm"><h2>L’IRM décrit une lésion ou un contexte, pas un agent par son seul aspect</h2><p><button class="w" data-k="g22-imagerie">Concordance entre topographie et examen</button></p><figure><img src="assets/img/g22/alpha/codex/Neurosyphilis2016.jpg" alt="IRM axiale FLAIR publiée dans une observation de neurosyphilis" loading="lazy"><figcaption>IRM axiale FLAIR publiée dans une observation de neurosyphilis. Sabre et coll., BMC Research Notes, 2016, figure 1 ; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">Creative Commons Attribution 4.0</a>. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4964046/" target="_blank" rel="noopener noreferrer">Publication originale</a>. IRM humaine clinique, homme de 42 ans, consentement écrit de publication et des images rapporté par les auteurs. Pixels inchangés ; annotations françaises adjacentes ajoutées.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée</th></tr></thead><tbody><tr><td>Six coupes axiales de l’original</td><td>Images du même patient de 42 ans ; l’agencement n’est pas une chronologie thérapeutique.</td></tr><tr><td>Atrophie asymétrique</td><td>La légende indique une atrophie plus marquée dans l’hémisphère droit ; ne pas inférer la droite de l’écran sans repère.</td></tr><tr><td>Sillons et espaces liquidiens visibles</td><td>Illustrent la description d’atrophie dans ce cas, sans seuil volumétrique ajouté.</td></tr><tr><td>Portée de l’image</td><td>Ne prouve pas seule l’agent ni la causalité de la bradykinésie ; aucun marquage diagnostique ajouté aux pixels.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> La morphologie doit renforcer ou contester une hypothèse clinique, pas la remplacer.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-e-liquide"><h2>Liquide céphalorachidien : indication, sécurité et interprétation</h2><p>Une ponction n’est pas demandée à toute personne avec tremblement ou sérologie ancienne. L’indication dépend de la suspicion neurologique et du contexte. Vérifier la sécurité de la procédure, notamment signes de masse ou autre contre-indication clinique, traitements antithrombotiques et organisation du laboratoire. Les mesures appariées exigent un prélèvement sanguin associé au liquide selon le protocole.</p><p><button class="w" data-k="g22-lcr">Pourquoi apparier liquide et sérum ?</button></p><div class="key"><b>À retenir.</b> Un liquide pathologique signale une atteinte à interpréter ; il ne remplace pas l’ensemble du diagnostic.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button></p></section><section class="ilot" id="g22-e-cuivre"><h2>Lire le bilan du cuivre avec les unités et le contexte</h2><p><button class="w" data-k="g22-cuivre-bilan">REC, cuivre urinaire et Leipzig : trois objets différents</button></p><table class="t"><thead><tr><th>Résultat</th><th>Interprétation prudente</th></tr></thead><tbody><tr><td>Céruloplasmine normale</td><td>N’exclut pas à elle seule Wilson.</td></tr><tr><td>REC supérieur à 15%</td><td>Table 2025 : > 15 % ; figure 2 : ≥ 15 %. Égalité discutée avec laboratoire et centre, sans harmonisation tacite.</td></tr><tr><td>Cuivre urinaire modifié</td><td>Vérifier collecte, contexte et traitement.</td></tr><tr><td>Cuivre libre calculé impossible</td><td>Revoir méthode ; ne pas ajuster automatiquement la dose.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button></p></section><section class="ilot" id="g22-e-resultat"><h2>Un résultat discordant est une information à travailler</h2><p>Si la clinique progresse malgré un bilan apparemment rassurant, reprendre la chronologie, les conditions de prélèvement, les méthodes et les diagnostics concurrents. Ne pas multiplier les tests sans question. Une donnée sérologique peut être ancienne, une céruloplasmine peut être normale dans Wilson et une image peut être non spécifique ; ces limites doivent être connues avant la décision.</p><p>Les examens de suivi ne sont pas tous des tests de guérison. Décrire ce qui s’améliore ou s’aggrave dans la vie quotidienne et à l’examen permet de mettre les analyses en perspective. Un contrôle est décidé parce qu’il peut changer le diagnostic, le traitement ou la sécurité ; le seul maintien du code G22 n’est pas son indication.</p><button class="pareto-btn ui" data-k="pareto-g22-e">▲ Loi de Pareto — Un test pour une question</button><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g22-tab-semio" role="tab" aria-selected="true" aria-controls="g22-s-semio" data-s="g22-s-semio">Sémiologie fondamentale et analytique</button><button id="g22-tab-anat" role="tab" aria-selected="false" aria-controls="g22-s-anat" data-s="g22-s-anat">Anatomie</button><button id="g22-tab-physio" role="tab" aria-selected="false" aria-controls="g22-s-physio" data-s="g22-s-physio">Physiologie et physiopathologie</button><button id="g22-tab-biochim" role="tab" aria-selected="false" aria-controls="g22-s-biochim" data-s="g22-s-biochim">Biochimie et génétique</button><button id="g22-tab-micro" role="tab" aria-selected="false" aria-controls="g22-s-micro" data-s="g22-s-micro">Microbiologie et immunologie</button><button id="g22-tab-pk" role="tab" aria-selected="false" aria-controls="g22-s-pk" data-s="g22-s-pk">Pharmacologie fondamentale</button></div><div class="chap-body sci-body"><div class="sci" id="g22-s-semio" role="tabpanel" aria-labelledby="g22-tab-semio"><section class="ilot" id="g22-s-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Un mouvement volontaire efficace associe une intention comprise, une force suffisante, une coordination adaptée et une amplitude entretenue pendant l’action. Ces dimensions peuvent être perturbées séparément. Une personne lente n’est pas nécessairement faible ; une personne forte peut avoir du mal à initier ou à répéter un geste. L’examen doit donc décrire le normal attendu avant de nommer le signe pathologique.</p><p>Dans une séquence répétée correctement comprise, le clinicien observe vitesse, amplitude et maintien de la performance. Il tient compte de douleur, arthrose, fatigue, attention et compréhension. Le but n’est pas d’exiger une vitesse absolue identique à tout âge, mais d’identifier un trouble moteur reproductible et cohérent avec les autres observations. La marche renseigne en plus sur équilibre, coordination et sécurité.</p><p>Sources : <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-s-semio-signs" data-semiology="signs"><h3>Décomposer les signes au lieu de les confondre</h3><p>La bradykinésie se recherche aux doigts, mains et pieds par des mouvements répétés. Une réduction progressive de vitesse ou d’amplitude peut renforcer la description, mais le contexte et les autres signes comptent. La rigidité est recherchée par mobilisation passive chez une personne relâchée, indépendamment d’une commande volontaire. La sensation de résistance est distinguée d’une douleur limitant le mouvement ou d’une défense.</p><p>Le tremblement est nommé selon la situation où il apparaît : repos, posture ou action. Il peut manquer dans un syndrome parkinsonien. Le noyau moteur associe bradykinésie à rigidité et/ou tremblement de repos. Hypomimie, voix moins sonore, petit pas et perte du ballant peuvent compléter le tableau ; leur présence isolée n’établit pas une cause. Une faiblesse exige son propre examen et ne doit pas être déduite de la lenteur.</p><p>Sources : <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-s-semio-mechanisms" data-semiology="mechanisms"><h3>Relier le phénotype au réseau sans imposer une seule lésion</h3><p>Les observations lésionnelles montrent que le parkinsonisme peut accompagner une atteinte mésencéphalique ou des ganglions de la base, mais aussi une perturbation de régions connectées. La production et l’organisation du mouvement dépendent de réseaux : une lésion structurale visible ne fournit pas toujours une relation simple entre son volume et le handicap. Une partie seulement des lésions de certains territoires produit un syndrome parkinsonien.</p><p>Cette logique explique pourquoi un tableau ressemblant peut avoir plusieurs causes et des signes associés différents. Dans une infection, inflammation, atteinte vasculaire et atteinte parenchymateuse peuvent contribuer. Dans une maladie du cuivre, l’atteinte métabolique ne se réduit pas à un manque de neurotransmetteur. Un traitement symptomatique peut aider une fonction sans supprimer le mécanisme causal ; sa réponse ne devient pas une preuve de maladie de Parkinson.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-s-semio-examination" data-semiology="examination"><h3>Faire et documenter un examen actif, passif et fonctionnel</h3><p>Montrer le geste puis demander une séquence de mouvements répétés des doigts et des mains, avec comparaison des deux côtés. Examiner les pieds selon la même logique. Observer et noter vitesse, amplitude, hésitations et variation au fil de la séquence, en précisant douleur ou mauvaise compréhension. Examiner ensuite la résistance passive et le tremblement aux différents états ; ce sont des observations distinctes.</p><p>La fonction est explorée par se lever, marcher, tourner et se rasseoir, si la sécurité le permet. La protection contre les chutes précède toute manœuvre de déséquilibre. Compléter par force, réflexes, coordination, sensibilité, pupilles, oculomotricité et cognition selon les hypothèses. L’examen initial sert de référence au suivi ; il ne doit pas être remplacé par une mention globale de syndrome extrapyramidal sans description.</p><p>Sources : <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-s-semio-interpretation" data-semiology="interpretation"><h3>Interpréter le signe avec son contexte et son évolution</h3><p>Une asymétrie, un début progressif ou un tremblement de repos orientent, sans prouver à eux seuls la maladie de Parkinson. Une progression rapide, un changement cognitif ou comportemental, des troubles pupillaires, des signes cérébelleux ou un déficit focal élargissent la recherche. Le tempo peut être aussi informatif qu’un signe isolé. Les observations de neurosyphilis illustrent ces associations, sans leur donner une sensibilité universelle.</p><p>La réponse au traitement doit être décrite par fonction et délai. Une amélioration sous antibiotiques après plusieurs interventions soutient parfois une hypothèse, mais ne fournit pas l’effet causal d’un essai contrôlé. Une réponse à un traitement dopaminergique n’établit pas automatiquement une cause dégénérative et ne dispense pas de rechercher une lésion ou un trouble métabolique lorsque l’histoire l’indique.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r9">[9]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-s-semio-differentials" data-semiology="differentials"><h3>Distinguer lenteur, faiblesse, ataxie et trouble de la marche</h3><p>Une parésie limite la force produite ; une ataxie altère la coordination ; une douleur réduit l’amplitude pour une autre raison ; une difficulté cognitive peut empêcher la bonne exécution de la consigne. Ces mécanismes peuvent coexister avec une bradykinésie. Leur examen propre évite de donner un nom unique à plusieurs déficits. La voie corticospinale normale de Gray, présentée dans l’onglet anatomique, aide à séparer commande de force et organisation du mouvement.</p><p>Parmi les causes de syndrome parkinsonien, revoir traitements, causes vasculaires, structurales, infectieuses et métaboliques. Dans la classification, la catégorie G21 et les codes causaux ne se confondent pas avec G22*. Le diagnostic différentiel vise ce qui change la décision ; il ne consiste pas à multiplier des maladies rares sans arguments. Un signe concurrent doit être expliqué ou investigué plutôt que laissé en marge.</p><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button> · <button class="w" data-k="g22-r16">[16]</button></p></section><section class="ilot" id="g22-s-semio-urgency" data-semiology="urgency"><h3>Reconnaître ce qui change immédiatement le niveau de soins</h3><p>Un déficit d’installation brutale, une baisse de vigilance, une crise ou un trouble visuel aigu impose une évaluation urgente. Une fièvre avec signes neurologiques ou une évolution rapidement progressive fait rechercher une atteinte infectieuse ou une autre complication centrale. La stabilisation et l’imagerie adaptée ne doivent pas attendre un essai symptomatique prolongé ou le classement final dans une catégorie de code.</p><p>Pendant le traitement, distinguer progression, complication et toxicité. Une réaction immédiate avec urticaire ou signes d’anaphylaxie exige une prise en charge urgente et l’arrêt du produit selon la FI ; elle ne doit pas être rebaptisée réaction de Jarisch-Herxheimer. Des myoclonies ou une confusion sous pénicilline à forte dose peuvent signaler une neurotoxicité, surtout si le rein se dégrade. L’urgence est guidée par le patient, pas par le nom de la maladie connue.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-s-semio-limits" data-semiology="limits"><h3>Connaître les limites de la mesure et de la causalité</h3><p>Les performances dépendent de l’état de fatigue, de l’attention, de la douleur, des médicaments et des conditions de consigne. Une comparaison dans le temps exige de décrire ces conditions. Une observation unique n’est pas une preuve de progression, et l’absence d’un tremblement n’exclut pas le syndrome. Aucune sensibilité ou spécificité non mesurée n’est attribuée aux signes dans cette leçon.</p><p>La sérologie, l’IRM et le bilan du cuivre ont leurs limites propres. Une cicatrice sérologique peut persister ; une image d’atrophie n’est pas spécifique ; une céruloplasmine normale n’exclut pas Wilson. Il n’existe pas ici de score unique validé pour toutes les causes de G22. La conclusion clinique comporte donc un niveau de certitude, les hypothèses concurrentes et le plan pour les réévaluer.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><section class="ilot" id="g22-s-semio-sources" data-semiology="sources"><h3>Sources de sémiologie et portée de leur utilisation</h3><p>Les définitions et les manœuvres reposent sur les passages réellement lus du guide DGN 2023, l’enseignement HUG 2018 et la revue européenne des formes lésionnelles de 2024. Les manifestations syphilitiques et la logique biologique sont confrontées au guide DGN/SNG 2026 et aux observations, qui ne sont pas des essais comparatifs. Le guide EASL 2025 sert au différentiel Wilson et à ses limites analytiques.</p><p>La lecture d’un guide de maladie de Parkinson n’autorise pas à transférer sa stratégie entière à une infection ou à une maladie du cuivre. Les signes et l’examen peuvent être partagés, tandis que cause, traitement et pronostic diffèrent. Les fenêtres de référence indiquent les passages lus et les limites ; la <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener noreferrer">revue européenne 2024 sur les causes lésionnelles</a> est directement accessible.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><figure id="g22-science-links-semio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g22-diag-semio"><title id="g22-diag-semio">Geste répété observé puis Syndrome décrit puis Cause à documenter</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Geste répété observé</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Syndrome décrit</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Cause à documenter</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Du geste au signe</td><td>Comparer vitesse et amplitude avec conditions de réalisation.</td></tr><tr><td>Du syndrome à la cause</td><td>Un phénotype moteur demande un faisceau causal ; le code ne remplace pas cette preuve.</td></tr><tr><td>Limite</td><td>Le schéma ne donne ni seuil diagnostique numérique ni automatisme de codage.</td></tr></tbody></table></figure><p><b>Science → clinique.</b> Le signe observé distingue lenteur, force et coordination.</p><p><b>Science → examen.</b> Décrire les gestes et les conditions, puis rechercher la cause.</p><p><b>Science → traitement.</b> Ne pas donner un traitement commun sur le seul code.</p><div class="key"><b>À retenir.</b> Relier le normal, le mécanisme perturbé, le signe, l’examen et la décision, en gardant les limites des preuves.</div></div><div class="sci" id="g22-s-anat" role="tabpanel" aria-labelledby="g22-tab-anat" hidden><section class="ilot" id="g22-s-anat-body"><h2>Distinguer la voie de force et les réseaux du mouvement</h2><p>La commande motrice ne dépend pas d’une seule structure. La voie corticospinale participe à la commande volontaire et son examen aide à rechercher une faiblesse ou des signes pyramidaux. Le document historique de Gray montre des fibres issues du cortex, la capsule interne, la décussation et les faisceaux descendants. Cette image normale ne représente pas les circuits dopaminergiques et ne doit pas être annotée comme une carte de maladie de Parkinson.</p><p>La revue lésionnelle décrit des parkinsonismes associés à des atteintes mésencéphaliques, des ganglions de la base ou de régions connectées. Elle montre que la correspondance localisation-phénotype n’est pas univoque : beaucoup de lésions des ganglions de la base ne produisent pas de parkinsonisme. La fonction résulte aussi des connexions et de la vulnérabilité individuelle. Une image aide à localiser, mais ne démontre pas à elle seule l’agent ni le mécanisme de tous les signes.</p><p>Cette distinction anatomique a une conséquence directe à l’examen. Une personne peut conserver une force utile et pourtant initier lentement un mouvement ou perdre de l’amplitude au cours d’une séquence. À l’inverse, une lésion responsable de faiblesse peut ralentir les gestes sans constituer une bradykinésie parkinsonienne. Force, résistance passive, coordination et gestes répétés sont donc décrits séparément, puis réunis dans une conclusion topographique.</p><p>Une atteinte infectieuse peut être méningée, vasculaire ou parenchymateuse et produire plusieurs dimensions du déficit. Une atrophie asymétrique dans une observation de neurosyphilis n’est pas l’image d’un circuit unique lésé ni la preuve visuelle d’un tréponème. Les corrélations doivent être confrontées au reste du dossier et aux hypothèses concurrentes. Ce niveau de prudence évite de promettre qu’une lésion anatomique donnée aura toujours le même symptôme ou la même réponse.</p><figure><img src="assets/img/g22/alpha/codex/Gray764.png" alt="Voie motrice corticospinale normale dans une illustration historique" loading="lazy"><figcaption>Voie motrice corticospinale normale dans une illustration historique. Gray, Anatomy of the Human Body, 1918, illustration attribuée à Henry Vandyke Carter ; <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">original humain historique du domaine public</a>. Pixels inchangés ; annotations françaises adjacentes ajoutées.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée</th></tr></thead><tbody><tr><td>Motor area of cortex</td><td>Aire motrice du cortex : commande volontaire, pas localisation unique d’une bradykinésie.</td></tr><tr><td>Internal capsule</td><td>Capsule interne : trajet de fibres ; une atteinte peut produire un déficit à préciser par l’examen.</td></tr><tr><td>Decussation of pyramids</td><td>Décussation des pyramides : croisement dessiné dans l’original historique.</td></tr><tr><td>Anterior et lateral cerebrospinal fasciculi</td><td>Faisceaux corticospinaux représentés ; ne figurent pas un réseau dopaminergique complet.</td></tr></tbody></table></figure><figure id="g22-science-links-anat"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g22-diag-anat"><title id="g22-diag-anat">Force et mouvement puis Localisation clinique puis Image contextualisée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Force et mouvement</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Localisation clinique</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Image contextualisée</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Examen</td><td>Séparer faiblesse, résistance passive et organisation des gestes.</td></tr><tr><td>Imagerie</td><td>Confronter territoire et signes, avec les limites des réseaux.</td></tr><tr><td>Limite</td><td>Illustration normale historique ; aucune anatomie dessinée par IA.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r11">[11]</button> · <button class="w" data-k="g22-r16">[16]</button></p></section><p><b>Science → clinique.</b> Une faiblesse et une bradykinésie peuvent provenir de mécanismes différents.</p><p><b>Science → examen.</b> Examiner plusieurs systèmes avant de relier une image au tableau.</p><p><b>Science → traitement.</b> La localisation et la cause guident les soins ; pas de correspondance automatique lésion-dose.</p><div class="key"><b>À retenir.</b> Relier le normal, le mécanisme perturbé, le signe, l’examen et la décision, en gardant les limites des preuves.</div></div><div class="sci" id="g22-s-physio" role="tabpanel" aria-labelledby="g22-tab-physio" hidden><section class="ilot" id="g22-s-physio-body"><h2>Le réseau moteur peut être perturbé par plusieurs mécanismes</h2><p>Une action efficace demande de sélectionner, initier et entretenir un programme moteur tout en l’ajustant aux informations sensorielles. L’examen décrit ces fonctions par des observations : geste répété, changement d’amplitude, marche, demi-tour et coordination. La force volontaire est nécessaire à certaines tâches, mais ne décrit pas à elle seule leur vitesse et leur organisation. C’est pourquoi la normalité de la force ne rend pas normale toute performance motrice.</p><p>Les parkinsonismes lésionnels soutiennent une compréhension en réseau. La revue européenne décrit des atteintes à plusieurs localisations, avec perturbations à distance des zones connectées. Cela aide à comprendre qu’un syndrome similaire puisse apparaître dans des maladies différentes, et qu’une anomalie radiologique isolée n’ait pas une conséquence motrice constante. Il faut résister à un modèle qui attribuerait chaque symptôme à un noyau unique sans tenir compte des autres données.</p><p>Dans une neuroinfection, la perturbation peut résulter d’une inflammation méningée, d’une atteinte vasculaire ou d’un processus parenchymateux. Ces mécanismes peuvent expliquer l’association de symptômes moteurs avec cognition, pupilles, réflexes, coordination ou crises. Une atteinte infectieuse ne se réduit donc pas à un déficit dopaminergique pur. Le traitement étiologique vise la cause, tandis que la prise en charge fonctionnelle s’adapte aux conséquences observées.</p><p>Les troubles métaboliques et toxiques peuvent aussi perturber des réseaux sensibles à l’énergie et au stress oxydatif. La revue ne fournit pas de règle permettant de prédire la récupération à partir d’une seule lésion. L’amélioration après correction de la cause peut être partielle ou tardive. Le suivi doit distinguer activité causale persistante, séquelle et autre mécanisme associé ; une absence de réponse immédiate n’équivaut pas à une preuve d’échec définitif.</p><figure id="g22-science-links-physio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g22-diag-physio"><title id="g22-diag-physio">Réseau fonctionnel puis Perturbation causale puis Signe et handicap</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Réseau fonctionnel</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Perturbation causale</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Signe et handicap</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Mécanisme</td><td>Infection, métabolisme et lésion structurale peuvent perturber des fonctions communes.</td></tr><tr><td>Mesure</td><td>Décrire plusieurs dimensions du mouvement et les signes associés.</td></tr><tr><td>Traitement</td><td>Agir sur la cause et soutenir la fonction ; réversibilité non garantie.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></section><p><b>Science → clinique.</b> Plusieurs causes peuvent perturber un réseau moteur commun.</p><p><b>Science → examen.</b> Tempo et signes associés testent la cohérence mécanistique.</p><p><b>Science → traitement.</b> Cause et fonction se traitent en parallèle, avec réponse suivie.</p><div class="key"><b>À retenir.</b> Relier le normal, le mécanisme perturbé, le signe, l’examen et la décision, en gardant les limites des preuves.</div></div><div class="sci" id="g22-s-biochim" role="tabpanel" aria-labelledby="g22-tab-biochim" hidden><section class="ilot" id="g22-s-biochim-body"><h2>Le cuivre : distinguer fonction normale, accumulation et mesure</h2><p>Le cuivre est nécessaire à l’organisme ; le traitement ne vise pas une absence totale de cuivre. Dans Wilson, les variants causaux des deux allèles d’ATP7B altèrent l’élimination biliaire et la maturation de la céruloplasmine. Le guide décrit une accumulation dans le foie, le système nerveux et d’autres organes, avec toxicité cellulaire. Cette origine génétique ne signifie pas que tout symptôme neurologique d’une personne atteinte a le même mécanisme ou le même code manifestation.</p><p>Le bilan mesure des objets différents. La céruloplasmine dépend de la méthode et peut être normale dans une partie des cas. Le cuivre total n’est pas le cuivre échangeable, et le rapport cuivre échangeable/total est un pourcentage. Les paramètres urinaires dépendent de la collecte et du traitement. Le raisonnement diagnostique combine ces données avec l’examen, le foie, l’œil et la génétique ; les valeurs ne sont pas substituées les unes aux autres.</p><p>La table EASL 2025 donne une forte suspicion pour un cuivre échangeable relatif supérieur à 15%, tandis que le score de Leipzig organise d’autres arguments. La figure 2 de la même recommandation utilise une borne supérieure ou égale à 15 %, différence conservée pour le cas exactement à 15 %. Le texte cite aussi 18,5 % dans une étude : ce chiffre n’est pas transformé en seuil unique. Un chiffre n’est pas une décision isolée. En particulier, le cuivre libre calculé suppose une relation entre cuivre et céruloplasmine qui peut produire des résultats négatifs impossibles biologiquement. Une telle valeur impose de revoir la méthode et de discuter avec le laboratoire avant d’adapter le traitement.</p><p>La chélation modifie le bilan : une excrétion urinaire accrue peut traduire l’élimination facilitée par le médicament, et une valeur basse peut nécessiter une recherche d’observance ou de surtraitement selon les autres paramètres. Le cuivre tissulaire n’est pas directement donné par un seul dosage urinaire. Une carence iatrogène est également nocive, notamment pendant croissance et grossesse. L’objectif est un équilibre clinique et biologique surveillé, sans cible unique calculée à poursuivre mécaniquement.</p><figure id="g22-science-links-biochim"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g22-diag-biochim"><title id="g22-diag-biochim">Transport du cuivre puis Accumulation toxique puis Bilan multimodal</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Transport du cuivre</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Accumulation toxique</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Bilan multimodal</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Mécanisme</td><td>Défaut ATP7B et élimination biliaire perturbée dans Wilson.</td></tr><tr><td>Examen</td><td>Comparer méthodes, unités, contexte et plusieurs paramètres.</td></tr><tr><td>Traitement</td><td>Éviter sous-traitement et excès de chélation avec une surveillance spécialisée.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button></p></section><p><b>Science → clinique.</b> Accumulation et carence en cuivre peuvent être nocives.</p><p><b>Science → examen.</b> Les paramètres du cuivre se complètent sans s’interchanger.</p><p><b>Science → traitement.</b> La surveillance spécialisée évite une adaptation sur un chiffre isolé.</p><div class="key"><b>À retenir.</b> Relier le normal, le mécanisme perturbé, le signe, l’examen et la décision, en gardant les limites des preuves.</div></div><div class="sci" id="g22-s-micro" role="tabpanel" aria-labelledby="g22-tab-micro" hidden><section class="ilot" id="g22-s-micro-body"><h2>L’infection, l’inflammation et la mémoire sérologique ne sont pas équivalentes</h2><p>Treponema pallidum est l’agent de la syphilis. La présence d’une réponse anticorps permet de documenter une rencontre immunologique, mais un test tréponémique peut rester positif longtemps après traitement. Les tests non spécifiques et les tests spécifiques ne répondent donc pas exactement à la même question. Dans une suspicion de neurosyphilis, le guide 2026 exige de mettre en relation tableau clinique, confirmation sérique et investigations du liquide selon indication.</p><p>Le liquide céphalorachidien n’est pas isolé du compartiment sanguin par une frontière absolument imperméable. Des anticorps peuvent provenir du sang, et l’état de barrière influence leur passage. L’évaluation d’une production intrathécale rapporte les quotients spécifiques aux immunoglobulines et aux paramètres de barrière. Une comparaison liquide-sérum appariée permet une interprétation plus rigoureuse qu’un résultat non contextualisé dans un seul compartiment.</p><p>La négativité d’un test dont la sensibilité est limitée n’est pas une exclusion universelle. Le VDRL et le RPR du liquide peuvent être négatifs dans une neurosyphilis pertinente. La PCR n’est pas proposée comme solution universelle de confirmation ou d’exclusion en raison de ses limites. Le marqueur CXCL13 peut augmenter dans d’autres affections et ne doit pas être transformé en identification d’agent. La méthode, la phase et les traitements antérieurs doivent être transmis au laboratoire.</p><p>Après traitement, la persistance d’anticorps n’a pas le même sens qu’une aggravation clinique ou une nouvelle inflammation. Il faut distinguer cicatrice, activité, réinfection possible et autre maladie. La réponse clinique se mesure dans les mêmes domaines qu’au départ ; les examens de contrôle sont choisis selon le cas. Cette distinction immunologique protège contre deux erreurs opposées : traiter à répétition une cicatrice seule, ou exclure une maladie active sur un test isolé faussement rassurant.</p><figure id="g22-science-links-micro"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g22-diag-micro"><title id="g22-diag-micro">Agent et inflammation puis Réponse anticorps puis Interprétation clinique</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Agent et inflammation</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Réponse anticorps</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Interprétation clinique</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Biologie</td><td>Anticorps spécifiques persistants possibles après guérison.</td></tr><tr><td>Examen</td><td>Liquide-sérum apparié et paramètres de barrière selon indication.</td></tr><tr><td>Traitement</td><td>Activité et réponse se discutent avec clinique ; pas retraitement sur cicatrice seule.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r13">[13]</button></p></section><p><b>Science → clinique.</b> Infection neurologique et mémoire anticorps se distinguent.</p><p><b>Science → examen.</b> Interpréter tests et compartiments avec leurs limites.</p><p><b>Science → traitement.</b> Ne pas répéter un traitement sur la seule persistance d’anticorps.</p><div class="key"><b>À retenir.</b> Relier le normal, le mécanisme perturbé, le signe, l’examen et la décision, en gardant les limites des preuves.</div></div><div class="sci" id="g22-s-pk" role="tabpanel" aria-labelledby="g22-tab-pk" hidden><section class="ilot" id="g22-s-pk-body"><h2>Exposition, cible et toxicité expliquent les règles du produit</h2><p>La benzylpénicilline est un antibiotique parentéral dont la pharmacocinétique aide à comprendre les administrations répétées. Elle bloque la synthèse de la paroi bactérienne pendant la croissance ; son efficacité dépend du temps d’exposition au-dessus de la concentration inhibitrice. Sa demi-vie est courte lorsque les reins fonctionnent normalement, et son élimination est principalement rénale. L’insuffisance rénale peut augmenter fortement l’exposition. La diffusion dans le système nerveux et le liquide est limitée en situation normale et augmente avec l’inflammation méningée. Un schéma efficace ne se déduit donc ni d’une dose orale imaginaire ni d’un code de maladie.</p><p>La FI suisse décrit un risque neurotoxique aux hautes doses, notamment lorsque le rein est insuffisant. Confusion, myoclonies, hyperréflexie ou convulsions peuvent alors imiter une aggravation neurologique de la maladie. Le débit d’administration et l’apport de sodium du sel sodique font partie de la sécurité du produit. La dose, l’intervalle et la surveillance sont vérifiés avec l’état de l’organisme et non conservés mécaniquement pendant toute l’hospitalisation.</p><p>La trientine est un chélateur utilisé dans les conditions de sa notice pour Wilson. Sa faible absorption et la formation de complexes avec des éléments présents dans l’alimentation expliquent les prises à jeun et l’espacement des autres produits. La formulation Cuprior contient du tétrahydrochlorure équivalant à une masse de base ; une autre forme de trientine ne peut pas être substituée sur une égalité apparente de milligrammes. L’exposition et l’effet clinique peuvent différer.</p><p>L’objectif n’est pas de mobiliser le cuivre le plus vite possible. Une aggravation neurologique initiale est décrite sous traitement anti-cuivre, tandis qu’un traitement insuffisant ou mal pris expose à l’activité de la maladie. La titration prudente et le suivi rapproché permettent de rechercher efficacité et tolérance ensemble. Une concentration calculée isolée, une quantité de comprimés ou une comparaison à une autre spécialité ne fournit pas à elle seule le bon ajustement. La prescription garde substance, forme, unité et indication visibles.</p><figure id="g22-science-links-pk"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g22-diag-pk"><title id="g22-diag-pk">Produit et exposition puis Effet et toxicité puis Dose réévaluée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Produit et exposition</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Effet et toxicité</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Dose réévaluée</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Pénicilline</td><td>Voie, rein et débit modifient exposition et sécurité.</td></tr><tr><td>Trientine</td><td>Base, formulation et prises à jeun ne sont pas interchangeables.</td></tr><tr><td>Surveillance</td><td>Clinique, organes et analyses ensemble ; adaptation spécialisée.</td></tr></tbody></table></figure><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r14">[14]</button></p></section><p><b>Science → clinique.</b> L’exposition peut produire une toxicité qui ressemble à la maladie.</p><p><b>Science → examen.</b> Revoir rein, produit, prises et médicaments lors d’une aggravation.</p><p><b>Science → traitement.</b> Prescrire avec unité, voie, intervalle et surveillance explicites.</p><div class="key"><b>À retenir.</b> Relier le normal, le mécanisme perturbé, le signe, l’examen et la décision, en gardant les limites des preuves.</div><button class="pareto-btn ui" data-k="pareto-g22-sci">▲ Loi de Pareto — Comprendre avant de compter</button></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g22-p-principes"><h2>Les repères médicamenteux ne sont pas une ordonnance universelle de G22</h2><p>Les fiches suivantes rapprochent recommandation clinique et information de produit suisse. Elles nomment la population, la substance, la forme, la voie et les limites. La décision est individualisée selon preuve causale, allergies, organes, âge, grossesse, traitements associés et surveillance disponible. Une dose d’une autre indication n’est pas présentée comme validation propre au code G22.</p><p>Aucun médicament symptomatique nouveau ne reçoit ici une dose de mémoire. Une lévodopa peut être discutée dans certaines situations spécialisées, mais son efficacité variable et la cause sous-jacente interdisent une recette commune. La conduite traite aussi mobilité, communication, sécurité et autonomie. Les notices complètes et le protocole du centre restent nécessaires avant prescription réelle.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r14">[14]</button></p></section><section class="ilot" id="g22-p-penicilline"><h2>Pénicilline G : conserver unité, formulation et schéma quotidien</h2><p><button class="w" data-k="g22-penicilline">Guide de neurosyphilis et FI Grünenthal : deux niveaux à confronter</button></p><p><button class="w" data-k="g22-pen-rein">Rein, sodium et neurotoxicité : une sécurité active</button></p><div class="key"><b>À retenir.</b> Un total quotidien juste doit rester associé au rythme, au produit, au rein et au débit.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r7">[7]</button></p></section><section class="ilot" id="g22-p-reactions"><h2>Jarisch-Herxheimer et allergie : ne pas les confondre</h2><p><button class="w" data-k="g22-herxheimer">Une réaction après la première dose demande une analyse clinique</button></p><div class="key"><b>À retenir.</b> Surveiller, évaluer la gravité et distinguer mécanismes ; ne pas donner de corticoïdes ou poursuivre un produit allergisant par automatisme.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r9">[9]</button></p></section><section class="ilot" id="g22-p-cef"><h2>Ceftriaxone : alternative du guide et spécialité suisse exacte</h2><p><button class="w" data-k="g22-ceftriaxone">Ceftriaxon Labatec : dose, rein et limites de la notice</button></p><div class="key"><b>À retenir.</b> Nommer le produit suisse et l’origine du schéma de guide, puis vérifier leur compatibilité avec le patient.</div><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r14">[14]</button></p></section><section class="ilot" id="g22-p-cuprior"><h2>Cuprior : des milligrammes de base, une indication et une titration</h2><p><button class="w" data-k="g22-cuprior">Trientine : l’équivalence de base ne permet pas une substitution silencieuse</button></p><p><button class="w" data-k="g22-cuprior-prises">Prises, interactions et surveillance de la réponse</button></p><div class="key"><b>À retenir.</b> Indication d’intolérance, base par comprimé, formulation, prises à jeun et titration lente restent visibles.</div><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button></p></section><section class="ilot" id="g22-p-grossesse"><h2>Grossesse et allaitement : confronter guide et notice sans effacer leur différence</h2><p>EASL 2025 recommande de maintenir une thérapie anti-cuivre pendant grossesse et allaitement, compte tenu des risques de Wilson non traité ou sous-traité. La FI Cuprior demande pendant grossesse une analyse individuelle du rapport bénéfice-risque, une dose efficace minimale si le traitement est poursuivi et une surveillance materno-fœtale avec attention au cuivre. Il faut planifier cette prise en charge plutôt qu’arrêter spontanément un traitement.</p><p>Pour l’allaitement, la FI Cuprior indique des données limitées et une décision entre allaitement et traitement selon leurs bénéfices, tandis que le guide ne trouve pas de raison générale de contre-indiquer l’allaitement sous traitement anti-cuivre. Cette différence est explicitée et confiée au centre expert avec la personne. Aucun message de sécurité absolue ni d’arrêt automatique n’est donné.</p><p>La benzylpénicilline peut être utilisée pendant grossesse selon sa FI. Elle diffuse faiblement dans le lait, avec possibilité de sensibilisation ou de modification de la flore du nourrisson à prendre en compte. La situation infectieuse et le produit précis priment ; une règle de trientine ne se transfère pas à un antibiotique ou réciproquement.</p><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button></p></section><section class="ilot" id="g22-p-revision"><h2>Un traitement doit pouvoir être révisé sans perdre son objectif</h2><p>Avant chaque changement, nommer le problème : cause insuffisamment contrôlée, effet indésirable, interaction, observance, évolution des organes ou séquelle. La marche et la cognition se mesurent avec les observations initiales. Le traitement symptomatique est utile s’il améliore une fonction ; son bénéfice ne prouve pas à lui seul une étiologie ni ne remplace l’action causale.</p><p>La personne reçoit un plan de suivi, des explications sur prises et signes nécessitant un contact rapide, et les coordonnées adaptées au contexte. Une prescription écrite distingue la dose par prise et la dose totale quotidienne, les unités et la formulation. Un calcul est vérifié, mais la justesse du calcul n’établit pas la justesse de l’indication.</p><button class="pareto-btn ui" data-k="pareto-g22-p">▲ Loi de Pareto — Produit, preuve et patient</button><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r14">[14]</button></p></section><section class="ilot" id="g22-sources"><h2>Sources réellement lues et portée de leur utilisation</h2><p>Les références indiquent les passages effectivement lus et les réutilisations de lectures antérieures de Sol. Les sources suisses prioritaires comprennent classification et manuel OFS, guide OFSP et informations exactes de spécialités. Le guide neurosyphilis avec participation SNG et EASL 2025 fondent les décisions cliniques de leur champ ; les observations restent des illustrations à preuve limitée. Les fenêtres permettent d’ouvrir la source primaire.</p><ol><li><button class="w" data-k="g22-r1">[1] OFS : CIM-10-GM française, fichier structuré de la classification 2024</button></li><li><button class="w" data-k="g22-r2">[2] BfArM : entrée G22 complète</button></li><li><button class="w" data-k="g22-r3">[3] DGN/SNG : Neurosyphilis</button></li><li><button class="w" data-k="g22-r4">[4] DGN : Parkinson-Krankheit, sémiologie et diagnostic</button></li><li><button class="w" data-k="g22-r5">[5] EASL-ERN Clinical Practice Guidelines on Wilson’s disease</button></li><li><button class="w" data-k="g22-r6">[6] Cuprior : information professionnelle suisse</button></li><li><button class="w" data-k="g22-r7">[7] Pénicilline Grünenthal : information professionnelle suisse</button></li><li><button class="w" data-k="g22-r8">[8] Sabre et coll. : Neurosyphilis as a great imitator, case report</button></li><li><button class="w" data-k="g22-r9">[9] Shi et coll. : Unmasking the hidden culprit, neurosyphilis mimicking parkinsonism</button></li><li><button class="w" data-k="g22-r10">[10] HUG : Syndromes parkinsoniens, update pour le praticien</button></li><li><button class="w" data-k="g22-r11">[11] Secondary parkinsonism associated with focal brain lesions</button></li><li><button class="w" data-k="g22-r12">[12] Manuel de codage médical, version 2026</button></li><li><button class="w" data-k="g22-r13">[13] Guide de la déclaration obligatoire 2026 : syphilis</button></li><li><button class="w" data-k="g22-r14">[14] Ceftriaxon Labatec : information professionnelle</button></li><li><button class="w" data-k="g22-r15">[15] PROFILES 2017 : situations neurologiques</button></li><li><button class="w" data-k="g22-r16">[16] Gray 764 : voie motrice et droits de l’original</button></li></ol><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r12">[12]</button> · <button class="w" data-k="g22-r13">[13]</button> · <button class="w" data-k="g22-r14">[14]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>
