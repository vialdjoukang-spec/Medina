<section class="ilot" id="n29-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3>
<p>La sémiologie relie une fonction normale à une anomalie observable. Le rein forme un filtrat, les tubules en modifient la composition et les voies excrétrices assurent son écoulement. Une anomalie de quantité, de composition ou de transit des urines n’a donc pas la même signification. L’interrogatoire doit séparer la <b>pollakiurie</b>, augmentation de la fréquence mictionnelle, de la <b>polyurie</b>, augmentation du volume urinaire : la première accompagne souvent une irritation vésicale, la seconde peut résulter d’une perte tubulaire d’eau et de solutés.</p>
<p>Le néphron normal sert ici de repère, sans transformer son dessin en représentation d’une maladie. La créatinine apprécie surtout la filtration ; elle ne mesure pas directement la réabsorption proximale. Dans la cystinose infantile, un enfant peut ainsi avoir des pertes urinaires importantes et une créatinine encore normale. Les normes de croissance, d’électrolytes et de bicarbonates se lisent selon l’âge et le laboratoire, jamais comme des seuils adultes transplantés chez le nourrisson.</p>
<figure id="n29-figure-semio" data-n29-figure="nephron"><div data-n29-imagebox="nephron"><img src="assets/img/n29/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg" width="1138" height="2171" loading="lazy" alt="Illustration humaine du néphron normal montrant réabsorption et sécrétion par segments"><span data-n29-marker="nephron-1" aria-label="Repère1">1</span><span data-n29-marker="nephron-2" aria-label="Repère2">2</span><span data-n29-marker="nephron-3" aria-label="Repère3">3</span></div><figcaption><b>Repères normaux pour interpréter polyurie et pertes tubulaires</b><ol><li><b>1.</b> Tubule proximal : lieu de réabsorption de nombreux solutés ; son dysfonctionnement explique les pertes du syndrome de Fanconi.</li><li><b>2.</b> Branche ascendante de l’anse : autre segment, à ne pas confondre avec le tubule proximal.</li><li><b>3.</b> Canal collecteur : segment distinct de l’unité proximale atteinte précocement dans la cystinose.</li></ol><p>Schéma normal de transport, non une coupe histologique ; les repères n’illustrent ni cristaux ni une lésion de cystinose.</p><p>Original : OpenStax College, Anatomy & Physiology, 2013 ; <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<p>Sources : OpenStax, anatomie rénale et néphron ; Hohenfellner et al., 2026, diagnostic et atteinte tubulaire.</p></section>
<section class="ilot" id="n29-semio-signs" data-semiology="signs"><h3>Décrire les signes avec leur temporalité</h3>
<p>Une <b>hématurie terminale</b> apparaît en fin de miction ; elle est classiquement décrite dans la schistosomiase urinaire, mais n’en constitue pas une preuve. Préciser début, durée, douleur, récidive et exposition aux eaux douces. La <b>dysurie</b> ou les brûlures, la pollakiurie et les douleurs sus-pubiennes décrivent l’irritation du bas appareil. Une douleur lombaire fait rechercher le retentissement sur le haut appareil sans identifier seule sa cause.</p>
<p>La <b>leucocyturie dite stérile</b> signifie des leucocytes avec culture bactérienne usuelle négative ; elle ne démontre pas l’absence d’infection et ne remplace pas une recherche spécifique de mycobactéries. Chez l’enfant, polyurie, polydipsie, vomissements, déshydratation et défaut de croissance doivent être rapprochés des pertes tubulaires. La photophobie peut signaler des dépôts cornéens de cystine, tandis qu’une baisse visuelle aiguë dans un contexte syphilitique ou sous éthambutol appelle un autre raisonnement urgent.</p>
<p>Sources : EAU, §3.16.2 ; RMS 2018, symptomatologie ; recommandations cystinose 2026 ; FI Myambutol® ; HAS 2025.</p></section>
<section class="ilot" id="n29-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe, puis à l’examen</h3>
<p><b>Tuberculose :</b> dissémination hématogène, foyer cortical, lésions papillaires puis communication avec les cavités excrétrices expliquent la possibilité de détecter le bacille dans l’urine. La réaction inflammatoire et la fibrose produisent sténoses et rétraction vésicale : les symptômes mictionnels et l’imagerie évaluent une conséquence que la microbiologie seule ne mesure pas.</p>
<p><b>Schistosomiase :</b> les œufs piégés dans les tissus déclenchent l’inflammation ; ulcération et fragilité pariétale expliquent le saignement, tandis que fibrose et obstruction expliquent une partie du risque rénal tardif. Rechercher l’œuf répond à la question parasitologique ; l’échographie apprécie les conséquences urinaires.</p>
<p><b>Cystinose :</b> le défaut de cystinosine perturbe l’efflux lysosomal de cystine et le fonctionnement tubulaire. Les pertes d’eau et d’électrolytes expliquent polyurie et déshydratation ; pertes de phosphate et acidose contribuent à l’atteinte osseuse. La correction des pertes et la déplétion de cystine sont donc complémentaires, avec des critères de suivi distincts.</p>
<p>Sources : Mantica et al., 2021, §3.3–3.5 ; Barsoum, 2013, lésions urinaires ; Hohenfellner et al., 2026, introduction et encadré 3.</p></section>
<section class="ilot" id="n29-semio-examination" data-semiology="examination"><h3>Observer et prélever correctement</h3>
<p>Rechercher état général, hydratation, croissance chez l’enfant et signes de retentissement ; puis adapter l’examen aux plaintes urinaires, génitales, oculaires ou neurologiques. Un examen pauvre ne ferme pas le dossier : tuberculose rénale et schistosomiase dépistée chez le migrant peuvent être silencieuses.</p>
<p>Pour la tuberculose urogénitale, l’EAU recommande <b>trois prélèvements d’urine du matin au milieu de jet sur trois jours consécutifs</b>, avec demande explicite de culture mycobactérienne. Une amplification validée complète la recherche. Pour <i>S. haematobium</i>, la RMS recommande un recueil de fin de matinée après effort physique pour améliorer la recherche d’œufs ; les modalités concrètes se confirment avec le laboratoire.</p>
<p>La lampe à fente recherche des cristaux cornéens ; leur absence chez un très jeune enfant ne suffit pas à écarter la cystinose. Pour la cystine leucocytaire, consigner méthode, conservation, transport, formulation de cystéamine et horaire de la dernière dose. Ces conditions font partie du résultat, car une variation préanalytique peut être prise à tort pour un défaut d’observance.</p></section>
<section class="ilot" id="n29-semio-interpretation" data-semiology="interpretation"><h3>Interpréter un résultat avec sa population</h3>
<p>Les performances d’un test dépendent des patients étudiés, du prélèvement et de la référence utilisée. La culture urinaire tuberculeuse illustre cette variabilité : la revue 2021 rapporte 80–90 % de sensibilité, alors que l’EAU cite 23,3–30 % dans d’autres séries rénales. Il faut garder la culture pour l’isolement et l’étude des résistances, tout en associant les autres preuves, au lieu d’utiliser un chiffre rassurant pour exclure la maladie.</p>
<p>Dans la cohorte de Barcelone, 96 urines positives sur 831 cas examinés et 763 sérologies positives sur 772 cas testés sont des <b>proportions de positivité</b>. Elles ne mesurent pas directement la sensibilité : les cas ont notamment été définis par la sérologie et tous les sujets n’ont pas reçu les mêmes examens. Une sérologie schistosomienne positive peut refléter une exposition ancienne. De même, un test tréponémique de syphilis peut rester positif après guérison ; le titre non tréponémique et l’histoire clinique apportent une information différente.</p>
<p>Sources : EAU, §3.16.2 ; cohorte Barcelone, tableau 2 ; IUSTI 2020, tests sérologiques.</p></section>
<section class="ilot" id="n29-semio-differentials" data-semiology="differentials"><h3>Distinguer sans enfermer le diagnostic</h3>
<p>Une exposition précise augmente la plausibilité d’une cause ; elle n’exclut pas les autres. Chez un migrant avec hématurie, le raisonnement conserve infection bactérienne usuelle, tuberculose, schistosomiase, lithiase et tumeur. Une lacune urétérale ou pyélique peut simuler une tumeur ; inversement, une infection parasitaire chronique n’exclut pas une complication tumorale. L’imagerie localise, la microbiologie recherche l’agent et une exploration histologique peut être nécessaire selon la lésion.</p>
<p>Une polyurie avec glycosurie sans hyperglycémie, acidose et pertes électrolytiques décrit un mécanisme proximal, non un diagnostic génétique unique. La cystinose doit être confirmée par les examens spécifiques, avec réévaluation d’un résultat discordant. Dans la syphilis, séparer forme latente tardive, manifestation tertiaire et glomérulopathie secondaire évite d’attribuer une fréquence ou une présentation rénale à une catégorie qui n’a pas été étudiée comme telle.</p>
<p>Sources : EAU, imagerie et diagnostic ; RMS 2018, diagnostics différentiels ; recommandations cystinose 2026, diagnostic ; IUSTI 2020, stades.</p></section>
<section class="ilot" id="n29-semio-urgency" data-semiology="urgency"><h3>Reconnaître ce qui modifie le délai d’action</h3>
<p>L’obstruction avec menace fonctionnelle ou infection nécessite une évaluation urologique rapide ; le traitement causal n’annule pas le besoin de drainage. Ne pas assimiler le délai proposé pour une reconstruction après contrôle infectieux à un délai acceptable pour toute obstruction. Chez l’enfant avec Fanconi, déshydratation et pertes électrolytiques importantes imposent une correction et une surveillance adaptées ; le traitement de fond ne remplace pas cette stabilisation.</p>
<p>Une baisse visuelle sous éthambutol doit faire interrompre et réévaluer le traitement selon la FI, avec examen ophtalmologique. Dans un contexte de syphilis, manifestations oculaires ou vestibulo-cochléaires justifient une consultation spécialisée urgente : le schéma intramusculaire retard de la forme tardive ne couvre pas ces situations. Une réaction après antibiotique doit être distinguée d’une allergie grave ; la possibilité de Jarisch–Herxheimer ne justifie pas de banaliser une dégradation clinique.</p>
<p>Sources : Mantica, prise en charge obstructive ; EAU, limites du délai chirurgical ; FI Myambutol® et Extencilline® ; HAS 2025, pp 8–13.</p></section>
<section class="ilot" id="n29-semio-limits" data-semiology="limits"><h3>Limites de méthode et applicabilité suisse</h3>
<p>Les données suisses de tuberculose ne permettent pas de calculer une incidence propre aux formes urogénitales. Les proportions de la cohorte espagnole ne constituent pas une prévalence suisse. La syphilis rénale tertiaire reste très peu documentée dans les recommandations consultées ; ne pas lui prêter le tableau mieux décrit de la glomérulopathie secondaire.</p>
<p>Les informations professionnelles suisses peuvent diverger d’un guide clinique : c’est le cas du pyrazinamide en insuffisance rénale et de certains horaires ou conversions de cystéamine. Exposer cette divergence protège le raisonnement ; la date seule ne transforme pas une contre-indication en autorisation. Les valeurs de cystine dépendent du type cellulaire et du laboratoire. Enfin, un examen négatif, une anatomie normale en image ou une absence de symptôme ne possèdent de valeur d’exclusion que si la méthode et la situation l’autorisent.</p></section>
<section class="ilot" id="n29-semio-sources" data-semiology="sources"><h3>Sources reliées aux décisions</h3>
<p><b>Suspicion et confirmation tuberculeuse :</b> guide OFSP/Ligue pulmonaire 2024, chapitre 6, complété par EAU §3.16 pour les prélèvements urinaires et l’amplification. <b>Œufs, hématurie et traitement de la schistosomiase :</b> RMS 2018, diagnostic et traitement ; la cohorte de Barcelone sert aux limites de dépistage, pas à fabriquer une sensibilité. <b>Fanconi, cristaux et cystine :</b> Hohenfellner et al., 2026, diagnostic et encadrés 1–3, confrontés à la FI suisse Procysbi® pour la méthode et l’horaire du dosage.</p>
<p><b>Sérologie et stade syphilitique :</b> IUSTI 2020, pp 4–8 ; HAS 2025 pour les formes spécialisées et le suivi. <b>Toxicités :</b> FI suisses Myambutol® et Extencilline®. Les passages lus, empreintes, populations et limites figurent dans le registre de cette livraison. Les références historiques du cours sont conservées comme héritage attribué, sans être présentées comme une nouvelle lecture intégrale.</p>
<div class="key"><b>Science → clinique.</b> Le mécanisme localise le signe, mais ne suffit pas à nommer l’étiologie.</div><div class="key"><b>Science → examen.</b> Prélever au bon site, avec la bonne méthode, puis interpréter le résultat dans son contexte.</div><div class="key"><b>Science → traitement.</b> Corriger la cause et son retentissement avec un produit et un protocole réellement applicables.</div><div class="key"><b>À retenir.</b> Décrire, localiser, confirmer, mesurer le retentissement et réévaluer les discordances.</div>
</section></div>
<div class="sci" id="n29-s-immuno" hidden><section class="ilot" id="n29-s-immuno-cours"><h2>Immunologie et génétique : des lésions semblables, des causes distinctes</h2>
<p>Le mot <b>granulome</b> décrit une organisation de la réaction tissulaire ; il ne nomme pas un agent. Dans la tuberculose, les mycobactéries inhalées sont prises en charge par les macrophages alvéolaires. Certaines sont éliminées, d’autres persistent ou se multiplient et peuvent se disséminer. La réactivation d’un foyer rénal, parfois longtemps après l’infection initiale, explique pourquoi l’absence d’un épisode pulmonaire récent ne suffit pas à écarter une tuberculose urogénitale. Immunodépression, diabète et insuffisance rénale modifient ce contexte de risque ; ils ne constituent pas une preuve microbiologique.</p>
<p>Dans la schistosomiase, le parasite adulte et les <b>œufs déposés dans les tissus</b> ne jouent pas le même rôle lésionnel. La réaction autour des œufs piégés produit l’inflammation puis participe à la fibrose. La photographie ci-dessous montre des œufs entourés d’un infiltrat ; la légende de la source décrit des éosinophiles et d’autres cellules inflammatoires. À ce grossissement, les repères identifient les groupes d’œufs et la zone réactionnelle, sans prétendre compter ou typer chaque cellule. La présence de cette réaction explique le dommage pariétal, mais ne fournit pas à elle seule la charge parasitaire de tout l’organisme.</p>
<figure id="n29-figure-immuno" data-n29-figure="schisto"><div data-n29-imagebox="schisto"><img src="assets/img/n29/alpha/codex/schistosoma-bladder-phil34-lores.jpg" width="700" height="467" loading="lazy" alt="Photomicrographie humaine vésicale de schistosomiase : groupes d’œufs et infiltrat inflammatoire"><span data-n29-marker="schisto-1" aria-label="Repère1">1</span><span data-n29-marker="schisto-2" aria-label="Repère2">2</span><span data-n29-marker="schisto-3" aria-label="Repère3">3</span></div><figcaption><b>L’élément causal et la réaction de l’hôte</b><ol><li><b>1.</b> Groupe d’œufs visible dans le tissu vésical.</li><li><b>2.</b> Zone inflammatoire autour des dépôts : la source décrit éosinophiles et autres cellules.</li><li><b>3.</b> Autre groupe d’œufs : distribution multifocale sur cette coupe.</li></ol><p>Image source publiée 700×467, octets inchangés ; grossissement et coloration non précisés ici. Aucun comptage cellulaire, typage de chaque cellule ou diagnostic individuel ne peut être tiré des repères.</p><p>Original : CDC / Dr Edwin P. Ewing Jr., 1973, PHIL 34 ; <a href="https://phil.cdc.gov/details.aspx?pid=34" target="_blank" rel="noopener">source</a>, <a href="https://phil.cdc.gov/details.aspx?pid=34" target="_blank" rel="noopener">Domaine public</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<p>L’éosinophilie sanguine n’est pas une condition nécessaire au diagnostic : elle n’était rapportée que chez 248 des 835 cas disposant de cette donnée dans la cohorte de Barcelone. Une réponse immunologique mesurée dans le sang ne renseigne pas directement sur la présence actuelle d’œufs dans l’urine. La sérologie schistosomienne peut persister après exposition ou traitement, de même que le test tréponémique peut persister après syphilis traitée ; leur lecture demande une histoire clinique.</p>
<p>La <b>cystinose</b> illustre une autre origine : les variants bialléliques pathogènes de <i>CTNS</i> altèrent une protéine lysosomale. Ce mécanisme génétique ne se confond ni avec un granulome infectieux ni avec un simple apport alimentaire de cystine. La variabilité des variants et du phénotype explique des formes infantiles, juvéniles ou surtout oculaires. La génétique confirme l’étiologie et peut guider l’évaluation familiale ; le dosage leucocytaire et l’examen cornéen renseignent des aspects complémentaires. Le nouveau-né d’une fratrie atteinte doit être testé rapidement selon les recommandations 2026, avant d’attendre les manifestations du syndrome de Fanconi.</p>
<div class="key"><b>Science → clinique.</b> Une réaction granulomateuse et une surcharge lysosomale peuvent toutes deux léser le rein, mais leur temporalité, leur terrain et leur preuve diffèrent.</div><div class="key"><b>Science → examen.</b> Rechercher l’agent ou l’œuf pour l’infection ; caractériser le défaut biochimique et génétique pour la cystinose.</div><div class="key"><b>Science → traitement.</b> Antimicrobien causal, drainage si nécessaire et déplétion de cystine répondent à des mécanismes différents ; ils ne se remplacent pas.</div><div class="key"><b>À retenir.</b> La forme d’une lésion n’est pas son étiologie. La preuve relie morphologie, contexte et examen spécifique.</div>
<p>Sources : Mantica et al., 2021, physiopathologie ; Barsoum, 2013, lésions urinaires ; cohorte Barcelone, tableau 2 ; Hohenfellner et al., 2026, introduction et diagnostic. Photographie : CDC/Dr Edwin P. Ewing Jr., PHIL 34,1973, domaine public ; source iconographique uniquement.</p>
</section></div>
<div class="sci" id="n29-s-anat" hidden><section class="ilot" id="n29-s-anat-cours"><h2>Anatomie des voies urinaires atteintes</h2>
<p>La localisation d’une lésion explique les symptômes et le choix du geste. Le rein comprend un cortex, où se situent les glomérules, et une médullaire dont les papilles s’ouvrent dans les voies excrétrices. L’urine passe ensuite par le bassinet, la jonction pyélo-urétérale, l’uretère, la jonction urétéro-vésicale, puis la vessie. Chez l’homme, les vésicules séminales, la prostate, l’épididyme, le testicule et le déférent appartiennent à la voie génitale voisine.</p>
<figure id="n29-figure-anat" data-n29-figure="kidney"><div data-n29-imagebox="kidney"><img src="assets/img/n29/alpha/codex/Kidney_section_vertical.png" width="417" height="700" loading="lazy" alt="Coupe humaine historique du rein normal avec cortex, pyramides, bassinet et uretère"><span data-n29-marker="kidney-1" aria-label="Repère1">1</span><span data-n29-marker="kidney-2" aria-label="Repère2">2</span><span data-n29-marker="kidney-3" aria-label="Repère3">3</span><span data-n29-marker="kidney-4" aria-label="Repère4">4</span></div><figcaption><b>Du cortex au bassinet : lire les niveaux anatomiques</b><ol><li><b>1.</b> Cortex : repère du foyer initial décrit dans la tuberculose.</li><li><b>2.</b> Pyramide médullaire : distinguer la papille et son ouverture vers un calice.</li><li><b>3.</b> Bassinet : collecte les urines avant leur passage dans l’uretère.</li><li><b>4.</b> Uretère : voie d’écoulement, non représentée ici sur toute sa longueur.</li></ol><p>Planche anatomique normale historique ; aucune lésion tuberculeuse, sténose ou fonction rénale n’est représentée.</p><p>Original : Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 ; <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<p>Dans la tuberculose, le foyer initial est cortical. Il se réactive, atteint les papilles puis s’ouvre dans les voies excrétrices. Les sténoses se localisent aux deux jonctions et, au scanner, le tiers distal de l’uretère est le siège le plus fréquent. La vessie est touchée d’abord autour du méat urétéral.</p>
<p>Dans la schistosomiase, les vers gagnent l’appareil urinaire par des anastomoses veineuses mésentérico-périurétérales situées vers la troisième vertèbre lombaire. La revue décrit des lésions urétérales typiquement dans la moitié inférieure ; cette prédilection n’est pas un critère d’exclusion topographique. <i>S. haematobium</i> atteint aussi les vésicules séminales et, plus rarement, la prostate et le tractus génital féminin.</p>
<div class="key"><b>Corrélation.</b> Science → clinique. Une lésion de la moitié inférieure de l’uretère chez un migrant évoque la schistosomiase ; une sténose des jonctions avec cavités papillaires évoque la tuberculose.</div>
<div class="key"><b>Corrélation.</b> Science → examen. L’uro-scanner repère les sténoses et les calcifications ; l’échographie est l’examen de référence pour le testicule, l’épididyme et le déférent.</div>
<button class="pareto-btn ui" data-k="pareto-n29-anat">▲ Loi de Pareto — Anatomie</button>
<p>La coupe normale permet de distinguer trois niveaux : parenchyme, cavités excrétrices et uretère. Une cavité papillaire n’est pas une sténose urétérale ; les deux peuvent cependant participer au même processus tuberculeux. Le cortex contient les corpuscules rénaux et les tubules contournés, tandis que les pyramides médullaires se terminent par les papilles. L’urine rejoint les calices puis le bassinet avant l’uretère. Cette continuité rend intelligible la propagation vers la voie excrétrice décrite dans la tuberculose, mais le sens de circulation normal ne prouve pas qu’une lésion donnée est infectieuse.</p><p>Le dessin ne mesure ni drainage ni fonction. Une dilatation à l’imagerie doit être confrontée au contexte, aux sténoses et au retentissement ; une apparence anatomique seule ne décide pas d’une néphrectomie. L’EAU recommande une décision chirurgicale individualisée selon le siège, l’étendue et le dommage, et souligne le faible niveau de preuve sur le meilleur délai opératoire.</p><div class="key"><b>Science → traitement.</b> Distinguer drainage nécessaire et reconstruction différée : le geste répond à une lésion et à son retentissement.</div><div class="key"><b>À retenir.</b> Localiser précisément avant d’interpréter la cause ou le geste.</div><p>Sources : OpenStax, §25.3, anatomie normale ; Mantica 2021, §3.3–3.5 ; EAU, §3.16.2–3.16.4. Illustration historique de Carter/Gray, domaine public.</p></section></div><div class="sci" id="n29-s-histo" hidden><section class="ilot" id="n29-s-histo-cours"><h2>Histologie des lésions</h2>
<p>La lésion élémentaire est un granulome dans les deux infections, mais l’élément déclenchant diffère. Dans la tuberculose, la lésion papillaire se <b>caséifie</b> : le tissu nécrosé se vide dans les voies excrétrices et forme une cavité, signe précoce de nécrose papillaire au scanner. Au stade avancé, le parenchyme est remplacé par des calcifications.</p>
<p>Dans la schistosomiase urinaire, le granulome se forme autour de l’<b>œuf piégé</b> dans la paroi, par hypersensibilité de type IV. La phase inflammatoire donne des pseudotubercules, des nodules et des ulcérations. La phase fibreuse donne des plaques sablonneuses calcifiées, une cystite kystique et une urétérite kystique.</p>
<figure id="n29-figure-histo" data-n29-figure="schisto"><div data-n29-imagebox="schisto"><img src="assets/img/n29/alpha/codex/schistosoma-bladder-phil34-lores.jpg" width="700" height="467" loading="lazy" alt="Photomicrographie humaine vésicale de schistosomiase : groupes d’œufs et infiltrat inflammatoire"><span data-n29-marker="schisto-1" aria-label="Repère1">1</span><span data-n29-marker="schisto-2" aria-label="Repère2">2</span><span data-n29-marker="schisto-3" aria-label="Repère3">3</span></div><figcaption><b>Œufs et réaction tissulaire dans la paroi vésicale</b><ol><li><b>1.</b> Groupe d’œufs visible dans le tissu vésical.</li><li><b>2.</b> Zone inflammatoire autour des dépôts : la source décrit éosinophiles et autres cellules.</li><li><b>3.</b> Autre groupe d’œufs : distribution multifocale sur cette coupe.</li></ol><p>Image source publiée 700×467, octets inchangés ; grossissement et coloration non précisés ici. Aucun comptage cellulaire, typage de chaque cellule ou diagnostic individuel ne peut être tiré des repères.</p><p>Original : CDC / Dr Edwin P. Ewing Jr., 1973, PHIL 34 ; <a href="https://phil.cdc.gov/details.aspx?pid=34" target="_blank" rel="noopener">source</a>, <a href="https://phil.cdc.gov/details.aspx?pid=34" target="_blank" rel="noopener">Domaine public</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<p>Dans la syphilis précoce, la glomérulonéphrite extramembraneuse est la lésion la plus fréquente ; le mécanisme proposé est un dépôt sous-épithélial de complexes immuns à antigènes tréponémiques. Des formes mésangioprolifératives, à croissants et des néphrites interstitielles sont décrites. Dans la cystinose, la surcharge se manifeste par des <b>cristaux</b> de cystine dans la plupart des tissus, notamment la cornée, visible à la lampe à fente.</p>
<div class="key"><b>Corrélation.</b> Science → clinique. Un granulome caséeux est compatible avec la tuberculose, sans prouver seul son étiologie ; un œuf entouré de granulome traduit la schistosomiase ; des cristaux cornéens traduisent la cystinose.</div>
<button class="pareto-btn ui" data-k="pareto-n29-histo">▲ Loi de Pareto — Histologie</button>
<p>La photographie de schistosomiase montre une lésion réelle de vessie, avec plusieurs groupes d’œufs dans une réaction tissulaire. La légende originale identifie une infiltration d’éosinophiles et d’autres cellules inflammatoires. Les annotations repèrent les zones utiles ; elles ne transforment pas cette vue d’ensemble en preuve d’une classification cellulaire détaillée. La densité apparente sur une coupe ne donne ni le nombre total de parasites vivants ni l’activité de toute la maladie.</p><p>Il faut aussi distinguer inflammation et séquelle. Une réaction active peut évoluer vers la fibrose ; celle-ci peut laisser persister une anomalie anatomique malgré le traitement antiparasitaire. Une nouvelle masse, une hématurie persistante ou une discordance clinique ne s’explique donc pas automatiquement par une infection connue : une lésion tumorale ou une autre cause doit rester envisagée. Dans la cystinose, la recherche de cristaux cornéens et la mesure de cystine ne sont pas interchangeables avec une biopsie rénale ; les recommandations 2026 privilégient un diagnostic spécifique articulant biochimie, génétique et ophtalmologie.</p><div class="key"><b>Science → examen.</b> La morphologie oriente et complète les autres preuves ; une image isolée ne suffit pas à attribuer toutes les anomalies rénales.</div><div class="key"><b>Science → traitement.</b> Le traitement causal n’efface pas nécessairement une cicatrice fibreuse ; surveiller le retentissement.</div><div class="key"><b>À retenir.</b> Décrire ce qui est visible et séparer réaction, agent et séquelle.</div><p>Sources : PHIL 34, légende ; Barsoum 2013, lésions urinaires ; RMS 2018, diagnostic et complications ; Hohenfellner 2026, diagnostic.</p></section></div><div class="sci" id="n29-s-physio" hidden><section class="ilot" id="n29-s-physio-cours"><h2>Physiologie : de la fonction normale à l’atteinte</h2>
<p>Le rein filtre le plasma, et le tubule ajuste la composition du filtrat ; la voie excrétrice évacue ensuite l’urine. Trois atteintes illustrent les trois niveaux de cette fonction.</p>
<p><b>Niveau tubulaire.</b> Dans la cystinose, la fonction tubulaire est préservée à la naissance. Le syndrome de Fanconi, qui débute vers 4 à 6 mois, associe polyurie, pertes électrolytiques, protéinurie de bas poids moléculaire, acidose sévère, hypophosphatémie et trouble du métabolisme du calcitriol. Ces pertes expliquent le retard de croissance et le rachitisme. Le glomérule, lui, reste d’abord fonctionnel : la créatinine est souvent normale chez le jeune enfant.</p>
<p><b>Niveau interstitiel.</b> Dans la schistosomiase, la néphrite interstitielle chronique suit une triade précoce : défaut de concentration, perte sodée et acidose tubulaire. Au stade terminal, l’anémie est sévère, l’acidose marquée et l’ostéopathie précoce.</p>
<p><b>Niveau excréteur.</b> L’œdème de la jonction urétéro-vésicale crée une obstruction ou un reflux transitoires, réversibles sous traitement antiparasitaire. L’uretère supérieur compense par une dilatation-hypertrophie qui protège le rein ; lorsque cette compensation échoue ou qu’un reflux s’installe, la néphropathie obstructive apparaît, aggravée par l’infection ascendante.</p>
<figure id="n29-figure-physio" data-n29-figure="nephron"><div data-n29-imagebox="nephron"><img src="assets/img/n29/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg" width="1138" height="2171" loading="lazy" alt="Illustration humaine du néphron normal montrant réabsorption et sécrétion par segments"><span data-n29-marker="nephron-1" aria-label="Repère1">1</span><span data-n29-marker="nephron-2" aria-label="Repère2">2</span><span data-n29-marker="nephron-3" aria-label="Repère3">3</span></div><figcaption><b>Transport normal et localisation du syndrome de Fanconi</b><ol><li><b>1.</b> Tubule proximal : lieu de réabsorption de nombreux solutés ; son dysfonctionnement explique les pertes du syndrome de Fanconi.</li><li><b>2.</b> Branche ascendante de l’anse : autre segment, à ne pas confondre avec le tubule proximal.</li><li><b>3.</b> Canal collecteur : segment distinct de l’unité proximale atteinte précocement dans la cystinose.</li></ol><p>Schéma normal de transport, non une coupe histologique ; les repères n’illustrent ni cristaux ni une lésion de cystinose.</p><p>Original : OpenStax College, Anatomy & Physiology, 2013 ; <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<div class="key"><b>Corrélation.</b> Science → clinique. Un défaut de concentration avec perte sodée évoque une atteinte interstitielle ; une glycosurie sans hyperglycémie avec acidose évoque une atteinte tubulaire proximale ; une hydronéphrose évoque un obstacle.</div>
<button class="pareto-btn ui" data-k="pareto-n29-physio">▲ Loi de Pareto — Physiologie</button>
<p>La protéinurie du syndrome de Fanconi est d’abord tubulaire : elle traduit un défaut de récupération de petites protéines filtrées. Une albuminurie croissante peut aussi signaler une atteinte glomérulaire secondaire dans la cystinose ; la distinction est utile pour lire l’évolution. Les pertes de bicarbonate favorisent l’acidose, les pertes de phosphate et l’acidose contribuent à l’atteinte osseuse. Aucun de ces mécanismes n’autorise à conclure sur une créatinine isolée : la fonction tubulaire et la filtration doivent être suivies séparément.</p><p>Les recommandations 2026 ne disposent pas d’essais contrôlés définissant toute la prise en charge du Fanconi. Elles recommandent néanmoins une supplémentation adaptée aux pertes et aux concentrations sanguines, une hydratation accessible et un suivi néphrologique spécialisé. La déplétion lysosomale par cystéamine vise la maladie causale ; eau, électrolytes et alcalins corrigent ses conséquences. Un traitement très précoce peut limiter le développement du Fanconi, alors que les lésions installées restent généralement irréversibles.</p><div class="key"><b>Science → examen.</b> Associer bilan sanguin et pertes urinaires, croissance et filtration ; ne pas confondre les fonctions mesurées.</div><div class="key"><b>Science → traitement.</b> Suppléer les pertes et traiter la cause sont deux objectifs complémentaires, avec surveillance adaptée à l’âge et à l’état clinique.</div><div class="key"><b>À retenir.</b> Une filtration préservée peut coexister avec une atteinte tubulaire importante.</div><p>Source : Hohenfellner et al., 2026, fonction tubulaire et encadré 3 ; schéma normal OpenStax 2013.</p></section></div><div class="sci" id="n29-s-bioch" hidden><section class="ilot" id="n29-s-bioch-cours"><h2>Biochimie : cystine, antituberculeux et immunité</h2>
<p><b>Cystine.</b> La cystinose est due à des variants bialléliques de <i>CTNS</i> (17p13.2), qui code la cystinosine, symport cystine/proton lysosomal. Le défaut d’efflux lysosomal de la cystine conduit à son accumulation. Le dosage de la cystine leucocytaire est donc le reflet biochimique direct de la maladie, avec, pour les leucocytes mixtes et selon la FI Procysbi®, une cible thérapeutique inférieure à 1 nmol d’hémicystine/mg de protéine ; prélèvement 30 minutes après la dose matinale. Les autres méthodes nécessitent leur cible propre.</p>
<p><b>Antituberculeux.</b> La rifampicine est un inducteur puissant des cytochromes P450, de l’uridine diphosphate glucuronosyltransférase et de la glycoprotéine P. Elle abaisse donc les concentrations de nombreux médicaments associés. L’éthambutol est éliminé surtout par le rein (environ 50 % de la dose inchangée dans l’urine en 24 heures), ce qui explique la réduction de dose en insuffisance rénale.</p>
<p><b>Immunité.</b> La glomérulonéphrite extramembraneuse de la syphilis précoce suit le modèle du dépôt de complexes immuns ; le NDNF est proposé comme antigène cible. Sous pénicilline, la rémission complète survient en général en 1 à 3 mois.</p>
<figure id="n29-figure-bioch" data-n29-figure="nephron"><div data-n29-imagebox="nephron"><img src="assets/img/n29/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg" width="1138" height="2171" loading="lazy" alt="Illustration humaine du néphron normal montrant réabsorption et sécrétion par segments"><span data-n29-marker="nephron-1" aria-label="Repère1">1</span><span data-n29-marker="nephron-2" aria-label="Repère2">2</span><span data-n29-marker="nephron-3" aria-label="Repère3">3</span></div><figcaption><b>La mesure biologique doit correspondre au mécanisme</b><ol><li><b>1.</b> Tubule proximal : lieu de réabsorption de nombreux solutés ; son dysfonctionnement explique les pertes du syndrome de Fanconi.</li><li><b>2.</b> Branche ascendante de l’anse : autre segment, à ne pas confondre avec le tubule proximal.</li><li><b>3.</b> Canal collecteur : segment distinct de l’unité proximale atteinte précocement dans la cystinose.</li></ol><p>Schéma normal de transport, non une coupe histologique ; les repères n’illustrent ni cristaux ni une lésion de cystinose.</p><p>Original : OpenStax College, Anatomy & Physiology, 2013 ; <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<div class="key"><b>Corrélation.</b> Science → clinique. Une cible biochimique mesurable (cystine leucocytaire) permet d’ajuster la dose de cystéamine ; l’induction enzymatique par la rifampicine impose de revoir la liste des médicaments.</div>
<button class="pareto-btn ui" data-k="pareto-n29-bioch">▲ Loi de Pareto — Biochimie</button>
<p>La cystinosine permet normalement le transfert de cystine hors du lysosome en couplage avec un proton. Son déficit ne se réduit pas à des cristaux mécaniquement encombrants : les recommandations 2026 décrivent aussi des perturbations de la signalisation mTOR, des mitochondries et du stress oxydant dans la pathogénie tubulaire. La cystéamine forme avec la cystine un disulfure mixte cystéamine–cystéine pouvant emprunter une autre voie de sortie lysosomale ; ce mécanisme explique une déplétion sans correction du gène <i>CTNS</i>.</p><p>La quantité de cystine mesurée dépend des cellules analysées : les granulocytes, riches en lysosomes, ne donnent pas les mêmes valeurs que les préparations leucocytaires mixtes. Conservation, transport et extraction modifient aussi le résultat. La FI suisse Procysbi® définit une cible et un horaire pour une méthode précise ; les recommandations internationales proposent un protocole de résiduelle différent. Une valeur inattendue doit faire vérifier la préanalytique et le protocole avant d’être interprétée comme un défaut d’observance ou d’entraîner une augmentation de dose.</p><div class="key"><b>Science → examen.</b> Inscrire méthode, unité, laboratoire et horaire : le nombre seul est insuffisant.</div><div class="key"><b>Science → traitement.</b> La déplétion biochimique guide le traitement de fond ; elle ne dispense pas du suivi rénal, cornéen et extrarénal.</div><div class="key"><b>À retenir.</b> Le biomarqueur reflète un mécanisme, une méthode et une fenêtre temporelle.</div><p>Sources : Hohenfellner 2026, introduction et traitement ; FI suisse Procysbi®, posologie ; schéma normal OpenStax 2013.</p></section></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
<div class="panel" id="pP" hidden><div class="chap-body">
<section class="ilot" id="n29-p-1"><h2><span class="n">p-1</span>Stratégie pharmacologique</h2>
<p>Aucun médicament ne traite l’ensemble de la catégorie : chaque maladie causale a son traitement. Le produit suisse exact, sa dose et ses restrictions se vérifient dans son information professionnelle avant de transposer un schéma clinique.</p>
<table class="t"><thead><tr><th>Maladie causale</th><th>Médicament</th><th>Information professionnelle suisse lue</th><th>Remarque</th></tr></thead><tbody><tr><td>Tuberculose</td><td><button class="w" data-k="n29-rifater">Rifater®</button> (rifampicine, isoniazide, pyrazinamide) puis rifampicine et isoniazide ; <button class="w" data-k="n29-myambutol">Myambutol®</button> (éthambutol) ; <button class="w" data-k="n29-pyrazinamide">Pyrazinamide Labatec®</button></td><td>Oui (Rifater®, Myambutol®, Pyrazinamide Labatec®)</td><td>Schéma standard 2 HRZE / 4 HR selon le guide suisse 2024</td></tr><tr><td>Schistosomiase</td><td><button class="w" data-k="n29-praziquantel">Praziquantel</button></td><td>Aucune trouvée</td><td>Recommandation de l’Organisation mondiale de la santé ; disponibilité suisse non documentée</td></tr><tr><td>Syphilis tardive</td><td><button class="w" data-k="n29-extencilline">Extencilline®</button> (benzathine benzylpénicilline) ; pénicilline procaïne ; doxycycline</td><td>Oui (Extencilline®)</td><td>Prednisolone à discuter dans certaines formes à risque ; preuve limitée, avis spécialisé</td></tr><tr><td>Cystinose</td><td><button class="w" data-k="n29-procysbi">Procysbi®</button> (mercaptamine, voie orale) ; <button class="w" data-k="n29-cystadrops">Cystadrops®</button> (collyre)</td><td>Oui (Procysbi®, Cystadrops®)</td><td>Cible propre à la méthode ; leucocytes mixtes<1nmol d’hémicystine/mg,30min après la dose matinale de Procysbi®</td></tr></tbody></table>
<p>Ce tableau relie chaque maladie à ses médicaments et signale les lacunes : le praziquantel n’a pas d’information professionnelle suisse trouvée. Il rappelle que la seule présence d’une recommandation internationale ne garantit pas la disponibilité du produit en Suisse.</p>
<div class="key"><b>À retenir.</b> Un médicament, une maladie, une information professionnelle : la prescription suit le mécanisme causal, jamais le code.</div>
</section>

<section class="ilot" id="n29-p-2"><h2><span class="n">p-2</span>Doses adultes et objectifs</h2>
<table class="t"><thead><tr><th>Médicament</th><th>Dose ou schéma</th><th>Source</th></tr></thead><tbody><tr><td>Isoniazide / rifampicine / pyrazinamide / éthambutol</td><td>mg/kg/jour : H 5 (4–6), R 10 (8–12), Z 25 (20–30), E 15 (15–20) ; une prise matinale</td><td>Guide suisse 2024, tableau 7-1</td></tr><tr><td>Rifater®</td><td>Phase initiale de 2 mois ; comprimés selon le poids : 30–39 kg = 3,40–49 kg = 4,50–64 kg = 5, ≥ 65 kg = 6</td><td>Information professionnelle suisse</td></tr><tr><td>Myambutol®</td><td>FI : attaque 25 mg/kg/j, puis stabilisation 15 mg/kg/j ; tableau rénal :25 mg/kg si clairance>75 mL/min ; 15 mg/kg entre 40 et 75 ; 15 mg/kg tous les 2 jours entre 30 et 40 ; sous 30, doser le taux sérique</td><td>Information professionnelle suisse</td></tr><tr><td>Pyrazinamide Labatec®</td><td>FI : contre-indiqué si clairance < 50 mL/min. La mention séparée de 1 g/j d’entretien en insuffisance rénale et d’une prise après dialyse ne lève pas cette contre-indication ; divergence à résoudre avec l’équipe spécialisée</td><td>Information professionnelle suisse, octobre 2022</td></tr><tr><td>Benzathine benzylpénicilline</td><td>2,4 millions d’unités par voie intramusculaire aux jours 1, 8 et 15 (européen) ; une fois par semaine pendant 3 semaines (Extencilline®)</td><td>Recommandation européenne 2020 ; information suisse</td></tr><tr><td>Doxycycline (allergie)</td><td>100 mg par voie orale deux fois par jour pendant 28 jours chez l’adulte non enceinte allergique aux pénicillines, selon Doxycyclin-Mepha® et HAS 2025</td><td>FI suisse Doxycyclin-Mepha® ; HAS 2025</td></tr><tr><td>Praziquantel</td><td>S. haematobium : 40 mg/kg par voie orale en prise unique ; répétition après 4 semaines selon la revue suisse</td><td>RMS 2018 ; RCP français Biltricide® pour le produit, disponibilité suisse à confirmer</td></tr><tr><td>Procysbi®</td><td>Entretien 1,3 g/m²/jour en deux prises (maximum 1,95) ; début à 1/6–1/4 de la dose cible, augmentation toutes les 4–6 semaines</td><td>Information professionnelle suisse</td></tr><tr><td>Cystadrops®</td><td>1 goutte par œil 4 fois par jour, chez l’enfant de plus de 6 mois</td><td>Information professionnelle suisse</td></tr></tbody></table>
<p>Le tableau donne les doses initiales, les doses cibles et leurs sources. Les exemples chiffrés sont détaillés dans les fenêtres : <button class="w" data-k="n29-calcul-tb">calcul des doses antituberculeuses</button> et <button class="w" data-k="n29-calcul-procysbi">calcul de la dose de Procysbi®</button>.</p>
<div class="key"><b>À retenir.</b> La dose antituberculeuse suit le poids, la dose de cystéamine suit la surface corporelle, la dose de Myambutol® suit la clairance de la créatinine.</div>
</section>

<section class="ilot" id="n29-p-3"><h2><span class="n">p-3</span>Interactions et effets indésirables</h2>
<div class="alert"><b>Interactions et risques majeurs.</b> La <b>rifampicine</b> est un inducteur puissant des cytochromes P450, de l’uridine diphosphate glucuronosyltransférase et de la glycoprotéine P : la liste des médicaments doit être dressée avant le traitement. L’<b>éthambutol</b> expose à la névrite optique rétrobulbaire (contrôle ophtalmologique avant puis toutes les 4 semaines, et chaque semaine en cas d’insuffisance rénale). L’<b>isoniazide</b> a provoqué un syndrome cérébelleux, surtout chez les insuffisants rénaux chroniques. La <b>fonction hépatique</b> est surveillée avant traitement puis toutes les 2 à 4 semaines.</div>
<table class="t"><thead><tr><th>Médicament</th><th>Effets indésirables ou précautions</th><th>Contre-indications</th></tr></thead><tbody><tr><td>Rifater®</td><td>Surveillance hépatique ; inducteur enzymatique</td><td>Clairance<30mL/min ; ictère/hépatopathie aiguë ou hépatite médicamenteuse antérieure ; neuropathie périphérique, goutte, porphyrie, hypersensibilité et associations contre-indiquées de la FI.</td></tr><tr><td>Myambutol®</td><td>Névrite optique rétrobulbaire ; élimination rénale d’environ 50 % en 24 heures</td><td>Lésion du nerf optique ou maladie oculaire préexistante ; hypersensibilité. FI : contrôle oculaire hebdomadaire si insuffisance rénale.</td></tr><tr><td>Pyrazinamide Labatec®</td><td>Adaptation en insuffisance rénale ; divergence avec le guide 2024</td><td>Clairance < 50 mL/min selon l’information 2022</td></tr><tr><td>Procysbi®</td><td>Troubles digestifs, odeur cutanée anormale, éruption ; à forte dose lésions de type Ehlers-Danlos, hypertension intracrânienne bénigne, ostéopénie</td><td>Hypersensibilité à la cystéamine ou à la pénicillamine ; allaitement</td></tr><tr><td>Extencilline®</td><td>Surveillance 30 minutes après l’injection (recommandation européenne)</td><td>Allergie pénicillines, soja/arachide, ou antécédent de réaction immédiate sévère à une autre bêta-lactamine ; voie strictement IM, jamais IV.</td></tr><tr><td>Prednisolone préventive</td><td>À discuter avant l’antibiotique dans les formes cardiovasculaires ou neurologiques à risque ; non systématique</td><td>—</td></tr></tbody></table>
<p>Ce tableau classe les risques par produit. La plupart sont prévisibles et se préviennent par la surveillance (ophtalmologique, hépatique) et par la liste exacte des médicaments.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Prescrire un antituberculeux sans lister les médicaments du patient : l’induction enzymatique de la rifampicine peut diminuer l’effet de nombreux traitements.</div>
<div class="key"><b>À retenir.</b> Rifampicine : interactions. Éthambutol : vision. Isoniazide : cervelet chez l’insuffisant rénal. Cystéamine : allaitement exclu.</div>
</section>

<section class="ilot" id="n29-p-4"><h2><span class="n">p-4</span>Médicaments à éviter, limites et lacunes</h2>
<ul><li><b>Azithromycine</b> : exclue à tous les stades de la syphilis (recommandation européenne 2020).</li><li><b>Indométacine</b> dans la cystinose : les recommandations 2026 envisagent son emploi spécialisé chez certains jeunes enfants dont le Fanconi reste difficile à contrôler. Arrêt lorsque les pertes sont maîtrisées ou la fonction rénale baisse ; ne pas associer à un inhibiteur de l’enzyme de conversion ou un antagoniste de l’angiotensine II. Ce n’est pas un traitement de routine de l’enfant plus âgé atteint de maladie rénale chronique.</li><li><b>Corticostéroïdes</b> dans la tuberculose : limités à la méningite, à la péricardite et aux formes septiques graves ; leur usage dans la tuberculose urogénitale est débattu.</li><li><b>Pyrazinamide</b> en insuffisance rénale : divergence entre le guide suisse 2024 et l’information professionnelle 2022 (<button class="w" data-k="n29-tb-ir">fenêtre dédiée</button>).</li><li><b>Praziquantel</b> : aucune FI suisse identifiée dans la recherche effectuée, sans conclusion sur la possibilité d’accès. La revue suisse RMS 2018 et le RCP français Biltricide® documentent le traitement ; confirmer le produit disponible avec la pharmacie.</li></ul>
<p>Ces limites ne sont pas des interdictions générales : chacune dépend du contexte (maladie, fonction rénale, grossesse) et de la source qui l’établit.</p>
<div class="key"><b>À retenir.</b> Les limites sont attachées à une source datée. Quand deux sources divergent, leur champ, leur méthode et le produit concerné doivent être comparés. Une recommandation plus récente n’annule pas à elle seule une contre-indication de l’information professionnelle suisse.</div>
<button class="pareto-btn ui" data-k="pareto-n29-pharma">▲ Loi de Pareto — Pharmacologie</button>
</section>

<section class="ilot" id="n29-produits-ch"><h2>Prescription suisse : préciser le produit et résoudre les divergences</h2>
<h3>Antituberculeux et fonction rénale</h3>
<p><b>Rifater® associe rifampicine, isoniazide et pyrazinamide, sans éthambutol.</b> La FI prévoit une prise quotidienne une à deux heures avant le repas ; elle contre-indique le produit si la clairance de créatinine est inférieure à 30 mL/min. Le schéma du guide suisse qui espace certains composants en insuffisance rénale ne peut donc pas être reproduit en espaçant indistinctement les comprimés de Rifater®. La présentation fixe ne permet pas toutes les adaptations individuelles ; le choix de composants séparés relève de l’équipe spécialisée.</p>
<p>Pour <b>Myambutol®</b>, la FI décrit une attaque pouvant atteindre 25 mg/kg/j, puis 15 mg/kg/j en stabilisation. Le guide suisse 2024 indique, chez l’adulte, 15 mg/kg/j avec une plage de 15–20 mg/kg/j. Ces cadres ne sont pas interchangeables : le cours ne transforme pas la ligne rénale « clairance supérieure à 75 mL/min : 25 mg/kg » en dose universelle. Une atteinte visuelle impose une réévaluation immédiate ; le contrôle ophtalmologique est prévu avant le traitement puis toutes les quatre semaines, <b>chaque semaine en cas d’insuffisance rénale</b>. Les contrôles comprennent acuité, champ visuel et perception des couleurs.</p>
<p>La FI de <b>Pyrazinamide Labatec®</b> donne 25 mg/kg/j (20–30), maximum 2 g/j en prise quotidienne, en une fois après un repas. Elle contre-indique une clairance inférieure à 50 mL/min, tout en mentionnant ailleurs une dose d’entretien de 1 g/j en insuffisance rénale et une prise après dialyse. Le guide suisse 2024 propose pour sa part trois prises par semaine sous 30 mL/min. <b>Cette discordance ne se résout pas par une ordonnance générique.</b> Infectiologie, néphrologie et pharmacie confrontent indication, autorisation du produit, alternatives et surveillance ; le choix et son éventuel écart à la FI doivent être documentés. Les recommandations posologiques par classe ne suppriment pas les contre-indications hépatiques, rénales, métaboliques ou liées à la grossesse du produit.</p>
<h3>Cystéamine : formulation, méthode et horaire</h3>
<p>La FI suisse de <b>Procysbi®</b> fixe, pour le dosage sur leucocytes mixtes, une cible inférieure à 1 nmol d’hémicystine/mg de protéine. Le prélèvement est prévu <b>30 minutes après la dose du matin, soit 12,5 heures après celle du soir</b>. Le laboratoire précise les cibles correspondant à sa propre méthode ; une mesure sur granulocytes purs ne se compare pas directement à cette valeur. La prise est espacée de douze heures ; le lien aux repas doit rester constant. Les granules ne sont ni mâchés ni écrasés.</p>
<p>Deux différences avec les recommandations internationales 2026 doivent rester visibles : celles-ci discutent une conversion à 80 % de la dose immédiate et un dosage résiduel à douze heures ; la FI suisse décrit <b>la même dose quotidienne totale lors du changement de formulation</b> et l’horaire de 12,5 heures. Le cours donne priorité à la FI du produit suisse pour présenter son utilisation et renvoie tout changement de protocole au centre spécialisé. Chez l’adulte nouvellement diagnostiqué, commencer à un sixième à un quart de la cible, puis augmenter toutes les quatre à six semaines ; chez l’enfant de un à six ans, la FI autorise une titration toutes les deux semaines. Le maximum recommandé est 1,95 g/m²/j. L’insuffisance rénale ne nécessite habituellement pas d’ajustement, mais impose le suivi biologique.</p>
<p><b>Cystadrops®</b> traite les dépôts cornéens, avec une goutte par œil quatre fois par jour lorsque le patient est éveillé, intervalle recommandé de quatre heures ; ne pas dépasser quatre gouttes par œil et par jour. La FI vise les enfants de plus de six mois et les adultes. Le collyre ne remplace pas le traitement systémique ; celui-ci ne suffit pas à prévenir les dépôts cornéens.</p>
<h3>Syphilis : distinguer traitement retard et atteintes spécialisées</h3>
<p><b>Extencilline®</b> s’administre strictement par voie intramusculaire profonde, jamais par voie intraveineuse. Le schéma tardif adulte est 2,4 MUI une fois par semaine pendant trois semaines ; la neurosyphilis, l’otosyphilis et la syphilis oculaire demandent un autre traitement spécialisé. En insuffisance rénale ou en dialyse, ne pas convertir mécaniquement le tableau général de la FI en un calendrier hebdomadaire : vérifier le protocole avec la pharmacie et l’infectiologie.</p>
<p>La FI suisse de <b>Doxycyclin-Mepha®</b> prévoit, chez les personnes non enceintes allergiques à la pénicilline, 100 mg par voie orale deux fois par jour pendant quatre semaines lorsque l’infection n’est pas connue comme datant de moins d’un an. Ce schéma concorde avec les 28 jours de la HAS 2025 ; l’intervalle de 21–28 jours de l’IUSTI 2020 est conservé comme historique, pas comme choix indifférent. Hypersensibilité aux tétracyclines et insuffisance hépatique sévère sont contre-indiquées. La FI permet les doses usuelles en insuffisance rénale ; la grossesse relève d’une autre stratégie spécialisée et l’allaitement doit être arrêté si ce médicament est indispensable. Vérifier les interactions et les précautions propres à l’enfant avant toute prescription.</p>
<p>La corticothérapie préventive d’une réaction de Jarisch–Herxheimer <b>se discute dans des situations à risque</b>, elle n’est pas une prémédication universelle de la syphilis. La HAS 2025 indique le faible niveau de preuve, la surveillance hospitalière des formes neurologiques ou cardiaques et la discussion spécialisée ; la dose de prednisolone citée dans les fenêtres vient de cette recommandation et ne doit pas être présentée comme une indication propre de sa FI suisse.</p>
<h3>Praziquantel : recommandation clinique et disponibilité distinctes</h3>
<p>La recherche AmiKo par substance n’a retourné aucun produit suisse le 2 novembre 2026 ; elle ne prouve pas l’impossibilité d’un accès par pharmacie ou importation. La revue suisse RMS 2018 documente le schéma de <i>S. haematobium</i>, et le RCP français de <b>Biltricide® 600 mg</b> a été lu comme référence européenne de produit, explicitement étrangère. La pharmacie doit confirmer produit, disponibilité et modalités légales avant prescription. Son association à la <b>rifampicine est contre-indiquée</b> : l’induction enzymatique peut abaisser le praziquantel sous des concentrations efficaces. Une co-infection tuberculose–schistosomiase exige un plan infectiologique coordonné, sans interruption improvisée du traitement antituberculeux.</p>
<p>Sources réellement relues : FI suisses Procysbi®, Cystadrops®, Rifater®, Myambutol®, Pyrazinamide Labatec®, Extencilline®, Doxycyclin-Mepha® ; guide OFSP/Ligue pulmonaire 2024 ; RMS 2018 ; HAS 2025 ; Hohenfellner et al. 2026 ; RCP français Biltricide®.</p></section>
