<template data-pop="n29-asterisque" data-title="Système croix-astérisque et règles de codage">
<div class="lab">Définition</div><p>Dans la CIM-10-GM 2024, un code à astérisque (*) décrit la manifestation d’une maladie dont l’étiologie est codée ailleurs par un code à croix (†). N29 est une catégorie à astérisque : elle ne se code jamais seule.</p>
<div class="lab">Application</div><p>Pour N29.0*, l’étiologie est A52.7† ; pour N29.1*, A18.1† (tuberculose) ou B65.-† (schistosomiase) ; pour N29.8*, E72.0† (cystinose). Le médecin code d’abord la maladie causale, puis la manifestation rénale ou urétérale.</p>
<div class="lab">Délimitations</div><p>Une glomérulopathie de la syphilis ou de la schistosomiase se code N08.0*. L’atteinte tubulo-interstitielle de la cystinose figure aussi sous N16.3*. Le double rattachement N16.3*/N29.8* est un fait de la classification ; le dossier de recherche n’a pas trouvé de règle d’arbitrage.</p>
<div class="lab">Limite</div><p>Le code décrit la classification, non la gravité ni le traitement. La catégorie N29 n’ajoute pas de note générale ; N29.1 inclut explicitement tuberculose et schistosomiase, et N29.8 la thésaurismose cystinique. Ces inclusions ont été vérifiées dans le fichier OFS CIM-10-GM 2024.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n25-n29.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc N25–N29</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n00-n08.htm" target="_blank" rel="noopener">CIM-10-GM 2024, N08.0*</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n10-n16.htm" target="_blank" rel="noopener">CIM-10-GM 2024, N16.3*</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm" target="_blank" rel="noopener">CIM-10-GM 2024, A52.7</a>.</p>
</template>
<template data-pop="n29-tb-hematogene" data-title="Tuberculose urogénitale : voie hématogène">
<div class="lab">Mécanisme</div><p>Le bacille atteint le rein par le sang, presque toujours à partir d’une tuberculose pulmonaire latente, parfois après la primo-infection. Le foyer cortical cicatrise, puis se réactive souvent à partir d’un foyer unique.</p>
<div class="lab">Conséquence clinique</div><p>Le délai après l’infection pulmonaire peut dépasser 30 ans. L’absence d’antécédent ne permet donc pas d’exclure la maladie, et une radiographie ou un scanner thoracique est réalisé même si l’on suspecte une forme extrathoracique.</p>
<div class="lab">Limite</div><p>Les données épidémiologiques détaillées proviennent d’une revue non systématique ; la conduite a été confrontée au guide suisse 2024 et à la section urogénitale 3.16 de l’EAU.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a> ; <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-papille" data-title="Lésions papillaires et caséification">
<div class="lab">Mécanisme</div><p>Les lésions papillaires de la tuberculose se caséifient, forment des cavités et s’ouvrent dans les voies excrétrices.</p>
<div class="lab">Conséquence</div><p>L’ouverture libère des bacilles dans l’urine : c’est ce qui rend la culture d’urine utile. Au scanner, les cavités sont un signe précoce de nécrose papillaire.</p>
<div class="lab">Limite</div><p>L’atteinte bilatérale peut conduire à l’insuffisance rénale.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-stenose-uretere" data-title="Sténoses urétérales de la tuberculose">
<div class="lab">Définition</div><p>Les sténoses urétérales siègent surtout aux jonctions urétéro-vésicale et pyélo-urétérale. Au scanner, le tiers distal est le siège le plus fréquent.</p>
<div class="lab">Application</div><p>Une hydronéphrose obstructive impose le drainage par sonde urétérale (JJ) ou néphrostomie, sans retard, pour prévenir l’insuffisance rénale.</p>
<div class="lab">Limite</div><p>Les lacunes urétérales ou pyéliques peuvent simuler un carcinome urothélial à l’imagerie.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-vessie-retractee" data-title="Petite vessie rétractée">
<div class="lab">Mécanisme</div><p>La vessie s’enflamme d’abord autour du méat urétéral. Sans traitement, elle évolue vers la fibrose et la petite vessie rétractée.</p>
<div class="lab">Traitement</div><p>Une entérocystoplastie d’agrandissement est proposée pour une capacité vésicale d’environ 150 à 200 mL ; une néovessie orthotopique après cystectomie pour une capacité de 15 à 20 mL.</p>
<div class="lab">Limite</div><p>Chirurgie reconstructrice individualisée après début du traitement médical ; l’EAU rapporte des délais proposés allant de 2–6 semaines à plusieurs mois sans délai universel validé. Ne pas différer un drainage urgent.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-autonephrectomie" data-title="Autonéphrectomie">
<div class="lab">Définition</div><p>Au stade avancé de la tuberculose rénale, le parenchyme peut être remplacé par des calcifications : c’est l’autonéphrectomie.</p>
<div class="lab">Conséquence</div><p>Le rein détruit ne contribue plus à la filtration. La néphrectomie est indiquée pour un rein détruit non fonctionnel symptomatique, une hypertension ou des lésions diffuses ; les données sur la néphrectomie partielle sont faibles.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-pyurie-sterile" data-title="Leucocyturie (pyurie) stérile">
<div class="lab">Définition</div><p>Présence de leucocytes dans l’urine sans germe trouvé par la culture standard. C’est un premier signe fréquent de tuberculose urogénitale, avec ou sans hématurie.</p>
<div class="lab">Application</div><p>Devant une leucocyturie stérile chez un patient d’un pays à forte incidence, on demande la culture mycobactérienne de trois urines du matin.</p>
<div class="lab">Limite</div><p>Une culture standard négative ne renseigne pas sur les mycobactéries : la recherche doit être spécifique.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a>.</p>
</template>
<template data-pop="n29-hematurie" data-title="Hématurie : caractérisation">
<div class="lab">Tuberculose</div><p>L’atteinte vésicale tuberculeuse donne hématurie, pollakiurie, dysurie et douleurs abdominales, lombaires ou sus-pubiennes.</p>
<div class="lab">Schistosomiase</div><p>Le signe classique est l’hématurie terminale (en fin de miction), avec pollakiurie et dysurie ; la bandelette détecte l’hématurie microscopique, quasi constante chez l’enfant infecté par <i>S. haematobium</i>.</p>
<div class="lab">Limite</div><p>Dans la cohorte de Barcelone, 19/855 cas probables ou confirmés étaient symptomatiques (2,2 %) ; ce constat ne décrit pas toutes les présentations européennes.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a> ; <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a> ; <a href="https://doi.org/10.1186/s40249-026-01415-y" target="_blank" rel="noopener">Étude rétrospective de Barcelone 2014–2023, Infect Dis Poverty 2026</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/schistosomiasis" target="_blank" rel="noopener">Organisation mondiale de la santé, fiche sur la schistosomiase</a>.</p>
</template>
<template data-pop="n29-tb-epidemio" data-title="Tuberculose en Suisse en 2025">
<div class="lab">Données</div><p>544 cas déclarés ; taux de 6,0 pour 100 000 habitants (4,8 auparavant), moyenne européenne de 8,4 en 2024. 268 cas exclusivement pulmonaires, 238 pulmonaires et extrapulmonaires, 32 exclusivement extrapulmonaires. Part exclusivement extrapulmonaire de 4,2 % sur 2020–2025. En 2022,73 % des cas déclarés n’étaient pas d’origine suisse.</p>
<div class="lab">Conséquence</div><p>L’augmentation concerne surtout de jeunes personnes issues de la migration : l’origine est un critère d’orientation du bilan.</p>
<div class="lab">Limite</div><p>Le Bulletin ne ventile pas les formes extrapulmonaires par organe : la fréquence suisse de la tuberculose urogénitale est inconnue.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener">Bulletin OFSP, La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025</a>.</p>
</template>
<template data-pop="n29-tb-culture" data-title="Culture urinaire de la tuberculose">
<div class="lab">Définition</div><p>Au moins trois urines du matin, premier jet exclu, recueillies en milieu de jet sur des jours consécutifs.</p>
<div class="lab">Performance</div><p>La revue 2021 rapporte 80–90 % de sensibilité ; l’EAU cite 23,3–30 % dans d’autres études rénales, avec 92–100 % de spécificité. Populations et méthodes diffèrent : aucune de ces valeurs ne garantit l’exclusion individuelle. En milieu liquide, une culture positive demande au moins 9 à 10 jours ; une culture n’est rendue négative qu’après 6 semaines.</p>
<div class="lab">Application</div><p>La culture reste la référence pour confirmer le diagnostic et tester les résistances, notamment à la rifampicine, avant de débuter le traitement.</p>
<div class="lab">Limite</div><p>Les chiffres de la revue 2021 et ceux de l’EAU actuel proviennent d’études différentes ; leur hétérogénéité doit rester visible.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener">Bulletin OFSP, La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025</a>.</p>
</template>
<template data-pop="n29-baar" data-title="Examen direct des bacilles acido-alcoolo-résistants">
<div class="lab">Performance</div><p>Sur l’urine, spécificité d’environ 97 %, sensibilité d’environ 20 %.</p>
<div class="lab">Conséquence</div><p>Positif, il oriente fortement ; négatif, il n’exclut pas la tuberculose : la culture est indispensable.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-taan" data-title="Amplification génique (test d’amplification des acides nucléiques)">
<div class="lab">Définition</div><p>Technique moléculaire de détection de l’espèce du complexe <i>M. tuberculosis</i>, par exemple Xpert. En Suisse, le diagnostic définitif repose sur la culture et/ou l’amplification à partir d’un prélèvement biologique.</p>
<div class="lab">Données</div><p>La revue 2021 la disait prometteuse ; le chapitre EAU actuellement consulté recommande un test PCR validé en complément de la culture et rapporte pour Xpert MTB/RIF une sensibilité groupée de 84,7 % (70,8–93,1) et une spécificité de 97,3 % (91,0–99,2). En 2025,93,8 % des cas suisses étaient confirmés au laboratoire, avec une part croissante de diagnostics par PCR.</p>
<div class="lab">Limite</div><p>La culture reste la référence pour tester les résistances.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener">Bulletin OFSP, La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025</a> ; <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-igra" data-title="Test immunologique (IGRA) et test tuberculinique">
<div class="lab">Lecture</div><p>Un résultat positif ne distingue pas la maladie de l’infection. Un résultat négatif n’exclut pas la tuberculose.</p>
<div class="lab">Conséquence</div><p>Ces tests ne confirment ni n’excluent la tuberculose urogénitale ; la confirmation est microbiologique.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a>.</p>
</template>
<template data-pop="n29-uroscanner" data-title="Uro-scanner dans la tuberculose urogénitale">
<div class="lab">Signes</div><p>Granulomes au temps néphrographique, calcifications lobaires à bord calcifié, cavités (signe précoce de nécrose papillaire), sténoses urétérales. Sensibilité de 91,4 % rapportée par la revue 2021 ; l’EAU retient environ 90 % avec un niveau de preuve faible à très faible, sans valeur d’exclusion individuelle.</p>
<div class="lab">Limite</div><p>Les lacunes peuvent simuler un carcinome urothélial. L’échographie peut être normale au début ; l’imagerie par résonance magnétique est peu sensible au début ; la tomographie par émission de positons ne distingue pas la tuberculose d’un cancer.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-echo-genital" data-title="Échographie des organes génitaux masculins">
<div class="lab">Rôle</div><p>Examen de référence pour les atteintes du testicule, de l’épididyme et du déférent.</p>
<div class="lab">Limite</div><p>Elle peut être normale au début de l’atteinte rénale.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-tb-schema" data-title="Schéma 2 HRZE / 4 HR">
<div class="lab">Définition</div><p>Isoniazide (H), rifampicine (R), pyrazinamide (Z) et éthambutol (E) quotidiennement pendant 2 mois, puis isoniazide et rifampicine pendant 4 mois. Toutes les formes de tuberculose reçoivent ce schéma, sauf les exceptions listées (méningite, péricardite, tuberculose à <i>M. bovis</i>, etc.).</p>
<div class="lab">Doses</div><p>Adulte, en mg/kg/jour : H 5 (4–6), R 10 (8–12), Z 25 (20–30), E 15 (15–20). On utilise des associations à dose fixe. La pyridoxine accompagne l’isoniazide. Une seule dose est prise le matin, de préférence à jeun ou avec un repas pauvre en graisses.</p>
<div class="lab">Avant le traitement</div><p>Prélèvements, évaluation du risque de résistance à la rifampicine, test pour le virus de l’immunodéficience humaine, fonction hépatique et rénale, liste des médicaments.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse de Rifater®, Swissmedic</a>.</p>
</template>
<template data-pop="n29-tb-ir" data-title="Pyrazinamide et insuffisance rénale : deux textes suisses">
<div class="lab">Guide suisse 2024 (le plus récent)</div><p>Si la clairance de la créatinine est inférieure à 30 mL/min, éthambutol et pyrazinamide passent à trois prises par semaine ; l’éthambutol peut être omis en l’absence de résistance. En hémodialyse, tous les médicaments se donnent après la séance.</p>
<div class="lab">Information professionnelle de Pyrazinamide Labatec® (octobre 2022)</div><p>Le pyrazinamide est contre-indiqué si la clairance est inférieure à 50 mL/min. L’information recommande 1000 mg/jour d’entretien en cas d’insuffisance rénale et la dose usuelle après hémodialyse. Ce texte reste accessible et reste le texte d’autorisation du produit.</p>
<div class="lab">Choix retenu</div><p>Le guide suisse 2024 propose un espacement, tandis que la FI du produit interdit son emploi sous 50 mL/min. La seule chronologie ne résout pas cette divergence : le cours ne transforme pas l’espacement en prescription automatique contraire à la FI. Infectiologie, néphrologie et pharmacie doivent fixer et documenter un schéma individualisé, avec produits séparés si nécessaire.</p>
<div class="lab">Limite</div><p>L’arbitrage ne repose pas sur la seule date : une prescription contraire à la FI ne découle pas automatiquement du guide. Une décision spécialisée doit préciser produit, schéma, surveillance et justification.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse de Pyrazinamide Labatec®, Swissmedic, octobre 2022</a>.</p>
</template>
<template data-pop="n29-tb-chirurgie" data-title="Chirurgie de la tuberculose urogénitale">
<div class="lab">Indications</div><p>Les séries citées par l’EAU rapportent un recours à la chirurgie chez plus de 50 % des patients ; ce chiffre descriptif ne constitue pas une indication universelle. La néphrectomie concerne un rein détruit non fonctionnel symptomatique, une hypertension ou des lésions diffuses ; le délai de chirurgie reconstructrice est individualisé, l’EAU ne fixant pas de délai universel faute de preuves suffisantes.</p>
<div class="lab">Reconstruction</div><p>Entérocystoplastie d’agrandissement pour une capacité vésicale d’environ 150 à 200 mL ; néovessie orthotopique après cystectomie pour 15 à 20 mL.</p>
<div class="lab">Limite</div><p>Les données sur la néphrectomie partielle sont faibles.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-drainage" data-title="Drainage des voies urinaires obstruées">
<div class="lab">Règle</div><p>En cas d’hydronéphrose obstructive, la sonde urétérale (JJ) ou la néphrostomie ne doit pas être retardée, afin de prévenir l’insuffisance rénale.</p>
<div class="lab">Limite</div><p>Cette règle vient d’une revue non systématique ; elle ne remplace pas l’avis de l’urologue.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-tb-decla" data-title="Déclaration obligatoire et enquête d’entourage">
<div class="lab">Règle</div><p>Tout cas traité par au moins trois antituberculeux est déclaré, ainsi que le résultat du traitement.</p>
<div class="lab">Entourage</div><p>L’enquête d’entourage est organisée par le médecin cantonal et la Ligue pulmonaire cantonale.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a>.</p>
</template>
<template data-pop="n29-corticoides" data-title="Corticostéroïdes dans la tuberculose">
<div class="lab">Règle</div><p>Le guide suisse ne recommande les corticostéroïdes que pour la méningite, la péricardite et les formes septiques graves.</p>
<div class="lab">Débat</div><p>Dans la tuberculose urogénitale, leur usage pour prévenir l’aggravation des sténoses urétérales est débattu.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a> ; <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>.</p>
</template>
<template data-pop="n29-schisto-cycle" data-title="Schistosomiase : infection et élimination des œufs">
<div class="lab">Mécanisme</div><p>L’infection survient au contact d’eau douce infestée : les larves libérées par des mollusques traversent la peau. Les œufs sont éliminés dans les urines ou les selles.</p>
<div class="lab">Conséquence</div><p>La recherche d’œufs dans l’urine prouve l’infection active par <i>S. haematobium</i>.</p>
<div class="lab">Limite</div><p>Au moins 253,7 millions de personnes avaient besoin d’un traitement préventif en 2024 selon l’Organisation mondiale de la santé.</p>
<p class="src">Références : <a href="https://www.who.int/news-room/fact-sheets/detail/schistosomiasis" target="_blank" rel="noopener">Organisation mondiale de la santé, fiche sur la schistosomiase</a> ; <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a>.</p>
</template>
<template data-pop="n29-granulome" data-title="Granulome de la schistosomiase">
<div class="lab">Mécanisme</div><p>La lésion élémentaire est le granulome autour de l’œuf piégé, réponse d’hypersensibilité de type IV. Les vers adultes eux-mêmes ne lèsent pas directement l’hôte.</p>
<div class="lab">Conséquence</div><p>Le granulome, et non le ver adulte, est donc la cause des lésions de la paroi. Une réversibilité sous traitement antiparasitaire n’est décrite que pour l’œdème de la jonction urétéro-vésicale.</p>
<div class="lab">Limite</div><p>La distinction entre phase inflammatoire (pseudotubercules, nodules, ulcérations) et phase fibreuse (plaques sablonneuses, calcifications) conditionne la réversibilité.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a>.</p>
</template>
<template data-pop="n29-uretere-bas" data-title="Pourquoi la moitié inférieure de l’uretère ?">
<div class="lab">Mécanisme</div><p>Les vers gagnent l’appareil urinaire par des anastomoses veineuses mésentérico-périurétérales situées vers la troisième vertèbre lombaire.</p>
<div class="lab">Conséquence</div><p>Les lésions urétérales siègent typiquement dans la moitié inférieure, selon la revue mécanistique citée. L’uretère supérieur compense souvent par une dilatation-hypertrophie qui protège le rein.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a>.</p>
</template>
<template data-pop="n29-schisto-obstruction" data-title="Néphropathie obstructive de la schistosomiase">
<div class="lab">Mécanisme</div><p>Elle survient en cas d’échec de la compensation de l’uretère supérieur, ou en cas de reflux ; l’infection ascendante l’aggrave.</p>
<div class="lab">Conséquence</div><p>L’œdème de la jonction urétéro-vésicale crée une obstruction ou un reflux transitoires, réversibles sous traitement antiparasitaire. La revue de 2013 décrit le test de Whitaker comme une exploration possible lorsque la dilatation persiste malgré la levée de l’obstacle ; elle rapporte une concordance d’environ 75 % avec la scintigraphie diurétique. Ce repère historique n’impose pas un examen invasif systématique : l’urologue choisit l’exploration selon la question fonctionnelle et les examens disponibles.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a>.</p>
</template>
<template data-pop="n29-nic" data-title="Néphrite interstitielle chronique de la schistosomiase">
<div class="lab">Triade précoce</div><p>Défaut de concentration, perte sodée et acidose tubulaire.</p>
<div class="lab">Évolution</div><p>Au stade terminal, l’anémie est sévère, l’acidose marquée et l’ostéopathie précoce. Les lithiases infectieuses sont fréquentes ; la surinfection bactérienne, notamment à salmonelles en zone d’endémie, aussi.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a>.</p>
</template>
<template data-pop="n29-schisto-cancer" data-title="Cancer de la vessie et schistosomiase">
<div class="lab">Données</div><p>En série historique, il s’agissait d’un carcinome épidermoïde dans environ 60 % des cas. Dans une série égyptienne récente d’environ 10 000 patients, l’association schistosomienne est tombée à 55,3 % et le carcinome urothélial prédomine (65,8 %).</p>
<div class="lab">Signal d’alarme</div><p>Une nécrurie ou une modification des symptômes de cystite chronique doit faire suspecter le cancer.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a>.</p>
</template>
<template data-pop="n29-schisto-urine" data-title="Œufs dans l’urine">
<div class="lab">Méthode</div><p>Recherche d’œufs par filtration de l’urine. La bandelette détecte l’hématurie microscopique, quasi constante chez l’enfant infecté par <i>S. haematobium</i>.</p>
<div class="lab">Limite</div><p>Dans la cohorte de Barcelone, l’examen était positif chez 96 des 831 cas probables ou confirmés ayant eu cet examen (11,5 %) ; ce n’est ni une sensibilité indépendante ni un taux applicable à tous les migrants dépistés.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a> ; <a href="https://doi.org/10.1186/s40249-026-01415-y" target="_blank" rel="noopener">Étude rétrospective de Barcelone 2014–2023, Infect Dis Poverty 2026</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/schistosomiasis" target="_blank" rel="noopener">Organisation mondiale de la santé, fiche sur la schistosomiase</a>.</p>
</template>
<template data-pop="n29-schisto-serologie" data-title="Sérologie de la schistosomiase">
<div class="lab">Performance</div><p>Positive chez 763/772 cas probables ou confirmés testés (98,8 %) dans l’étude de Barcelone.</p>
<div class="lab">Limite</div><p>Elle ne distingue pas l’infection active de l’infection ancienne ; seule, elle définit un cas « probable ». Après traitement, la sérologie reste positive dans 84 % des cas : elle ne mesure pas la guérison. L’éosinophilie n’était présente que chez 29,7 % des patients.</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s40249-026-01415-y" target="_blank" rel="noopener">Étude rétrospective de Barcelone 2014–2023, Infect Dis Poverty 2026</a>.</p>
</template>
<template data-pop="n29-praziquantel" data-title="Praziquantel">
<p class="src">Compléments relus : RMS 2018, diagnostic de schistosomiase urinaire ; RCP français Biltricide® 600 mg, §4.2–4.6. Confirmer le produit disponible avec la pharmacie suisse.</p>
<div class="lab">Posologie</div><p>Pour S. haematobium, RMS 2018 : 40 mg/kg par voie orale en prise unique, répétée après quatre semaines. Le RCP français Biltricide® autorise la grossesse si cliniquement justifié ; les doses varient selon l’espèce et l’association à la rifampicine est contre-indiquée. Pratique observée à Barcelone : 40 mg/kg pendant 1 jour (29,2 %), 2 jours (70,1 %) ou 3 jours (0,5 %).</p>
<div class="lab">Résultats observés</div><p>Au suivi de la cohorte : urine positive chez 8/60 (13,3 %), éosinophilie persistante chez 13/43 (30,2 %), sérologie positive chez 74/88 (84 %) et anomalies échographiques persistantes chez 12/23 (52,2 %). Les groupes et délais diffèrent ; des œufs non viables ou des contrôles précoces expliquaient plusieurs microscopies positives. Ces chiffres ne définissent pas un taux d’échec thérapeutique.</p>
<div class="lab">Lacune suisse</div><p>Aucune information professionnelle suisse de praziquantel n’a été trouvée dans AIPS/AmiKo (Biltricide® absent). La disponibilité suisse n’est pas documentée.</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s40249-026-01415-y" target="_blank" rel="noopener">Étude rétrospective de Barcelone 2014–2023, Infect Dis Poverty 2026</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/schistosomiasis" target="_blank" rel="noopener">Organisation mondiale de la santé, fiche sur la schistosomiase</a> ; <a href="https://www.who.int/teams/control-of-neglected-tropical-diseases/schistosomiasis/control-and-elimination-programmes" target="_blank" rel="noopener">Organisation mondiale de la santé, programmes de lutte contre la schistosomiase</a>.</p>
</template>
<template data-pop="n29-syph-stades" data-title="Stades de la syphilis">
<div class="lab">Définition</div><p>La syphilis précoce correspond à une infection de moins d’un an ; la syphilis tardive à une infection d’au moins un an selon la définition européenne, ou de durée inconnue, incluant la syphilis latente tardive et la syphilis tertiaire.</p>
<div class="lab">Tertiaire</div><p>Elle survient chez environ 10 % des patients non traités : forme gommeuse (nodules, plaques ou ulcères cutanés, muqueux ou viscéraux), neurosyphilis tardive, syphilis cardiovasculaire.</p>
<div class="lab">Suisse</div><p>1078 cas ont été déclarés en 2022 ; la déclaration est obligatoire.</p>
<p class="src">Références : <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener">Janier et collaborateurs, recommandation européenne 2020 sur la syphilis, J Eur Acad Dermatol Venereol 2021; 35:574-588</a> ; <a href="https://www.bag.admin.ch/fr/syphilis-fr" target="_blank" rel="noopener">Office fédéral de la santé publique, page Syphilis</a>.</p>
</template>
<template data-pop="n29-syph-glomerulo" data-title="Glomérulopathie de la syphilis (N08.0*)">
<div class="lab">Données</div><p>Dans la syphilis précoce, le syndrome néphrotique touche environ 0,28 % des patients. La glomérulonéphrite extramembraneuse est la lésion la plus fréquente ; on décrit aussi des formes mésangioprolifératives, à croissants et des néphrites interstitielles.</p>
<div class="lab">Mécanisme</div><p>Complexes immuns à antigènes tréponémiques sous-épithéliaux ; le NDNF est un antigène cible proposé.</p>
<div class="lab">Évolution</div><p>Sous pénicilline, la rémission complète survient en général en 1 à 3 mois.</p>
<div class="lab">Codage</div><p>La glomérulopathie se code N08.0* et non N29.0*.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s13730-025-01074-2" target="_blank" rel="noopener">Ashizawa et collaborateurs, Clinical and Experimental Nephrology Case Reports 2026; 15:29 (néphropathie extramembraneuse de la syphilis)</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener">Janier et collaborateurs, recommandation européenne 2020 sur la syphilis, J Eur Acad Dermatol Venereol 2021; 35:574-588</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n00-n08.htm" target="_blank" rel="noopener">CIM-10-GM 2024, N08.0*</a>.</p>
</template>
<template data-pop="n29-syph-jh" data-title="Réaction de Jarisch-Herxheimer">
<p class="src">Sources complémentaires : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2025-05/recommandations_de_prise_en_charge_des_personnes_ayant_une_syphilis_-_recommandations.pdf" target="_blank" rel="noopener">HAS 2025, p. 13</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680388400109" target="_blank" rel="noopener">FI suisse Spiricort®</a>.</p>
<div class="lab">Définition</div><p>Elle est rare dans la syphilis tardive mais peut être grave si un site stratégique est atteint.</p>
<div class="lab">Prévention discutée</div><p>La HAS 2025 cite une option par prednisolone orale 20 à 60 mg/jour pendant 3 jours, débutée 24 heures avant l’antibiotique, dans les formes cardiovasculaires ou neurologiques à risque. Niveau de preuve faible : décision spécialisée, non systématique et surveillance hospitalière. La FI suisse Spiricort® documente le produit, ses contre-indications et précautions ; elle ne fournit pas cette indication spécifique de prophylaxie. Hypersensibilité contre-indiquée ; évaluer notamment infections concomitantes, glycémie et risque digestif.</p>
<div class="lab">Surveillance</div><p>L’observation de 30 minutes après Extencilline® vise notamment les réactions immédiates ; elle ne couvre pas toute la période possible de Jarisch–Herxheimer, qui peut débuter après plusieurs heures. Les formes neurologiques ou cardiovasculaires demandent une surveillance hospitalière adaptée.</p>
<p class="src">Références : <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener">Janier et collaborateurs, recommandation européenne 2020 sur la syphilis, J Eur Acad Dermatol Venereol 2021; 35:574-588</a>.</p>
</template>
<template data-pop="n29-syph-ttt" data-title="Traitement de la syphilis tardive">
<div class="lab">Première intention</div><p>Benzathine benzylpénicilline 2,4 millions d’unités par voie intramusculaire aux jours 1, 8 et 15. L’information professionnelle suisse d’Extencilline® donne 2,4 millions d’unités une fois par semaine pendant 3 semaines pour la syphilis tardive, hors neurosyphilis.</p>
<div class="lab">Seconde intention</div><p>Alternative historique de l’IUSTI 2020 : pénicilline procaïne 600 000 UI IM/j pendant 17–21 jours. Aucun produit suisse correspondant n’a été vérifié dans cette reprise ; ce schéma ne doit pas être utilisé comme ordonnance suisse prête à appliquer. La HAS 2025 privilégie la doxycycline 28 jours si la benzathine pénicilline est indisponible, hors grossesse et après vérification du contexte.</p>
<div class="lab">Allergie</div><p>Doxycycline 100 mg par voie orale deux fois par jour pendant 28 jours chez l’adulte non enceinte allergique aux pénicillines, selon Doxycyclin-Mepha® et HAS 2025 ; certains spécialistes préfèrent la désensibilisation. L’azithromycine est exclue à tous les stades.</p>
<div class="lab">Choix retenu</div><p>Les deux textes concordent sur le schéma de trois injections hebdomadaires ; l’information suisse précise l’exclusion de la neurosyphilis.</p>
<p class="src">Références : <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener">Janier et collaborateurs, recommandation européenne 2020 sur la syphilis, J Eur Acad Dermatol Venereol 2021; 35:574-588</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse d’Extencilline®, Swissmedic</a>.</p>
</template>
<template data-pop="n29-cyst-gene" data-title="Cystinose : génétique et cystinosine">
<div class="lab">Définition</div><p>Maladie lysosomale autosomique récessive due à des variants bialléliques de <i>CTNS</i> (17p13.2), qui code la cystinosine, symport cystine/proton lysosomal.</p>
<div class="lab">Mécanisme</div><p>Le défaut d’efflux lysosomal de la cystine conduit à son accumulation et à des cristaux dans la plupart des tissus.</p>
<div class="lab">Formes</div><p>Infantile néphropathique (environ 95 %), Fanconi dès la première année ; juvénile ou tardive, avec un Fanconi atténué ou une protéinurie isolée ; oculaire ou adulte, limitée aux cristaux cornéens.</p>
<div class="lab">Fréquence</div><p>Environ 0,5 à 1 pour 100 000 naissances.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/ndt/gfu090" target="_blank" rel="noopener">Emma et collaborateurs, consensus international sur la cystinose néphropathique, Nephrol Dial Transplant 2014; 29 Suppl 4:iv87-94</a> ; <a href="https://doi.org/10.1038/s41581-026-01089-7" target="_blank" rel="noopener">Hohenfellner et collaborateurs, recommandations 2026 sur la cystinose néphropathique, Nat Rev Nephrol 2026; 22:651-670 (texte intégral, sections pertinentes relues en novembre 2026)</a>.</p>
</template>
<template data-pop="n29-fanconi" data-title="Syndrome de Fanconi de la cystinose">
<div class="lab">Définition</div><p>Atteinte du tubule proximal qui débute vers 4 à 6 mois (6 à 12 mois selon une autre source). Un syndrome de Fanconi installé ne se corrige généralement pas sous cystéamine ; un traitement commencé dans les deux premiers mois de vie peut néanmoins en atténuer fortement le développement (recommandations 2026, encadrés 1–3).</p>
<div class="lab">Clinique et biologie</div><p>Polyurie, polydipsie, retard de croissance, vomissements, constipation, déshydratation, rachitisme ; pertes électrolytiques, protéinurie de bas poids moléculaire, acidose sévère, hypophosphatémie, trouble du métabolisme du calcitriol ; à la bandelette, faible densité, glycosurie, albuminurie modérée.</p>
<div class="lab">Évolution</div><p>Sans cystéamine, l’insuffisance rénale terminale survient vers 10 à 12 ans ; le traitement précoce la retarde d’environ 6 à 10 ans.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/ndt/gfu090" target="_blank" rel="noopener">Emma et collaborateurs, consensus international sur la cystinose néphropathique, Nephrol Dial Transplant 2014; 29 Suppl 4:iv87-94</a> ; <a href="https://doi.org/10.1007/s00467-026-07518-w" target="_blank" rel="noopener">Schön, Szaroszyk, Haffner, atteinte osseuse de la cystinose, Pediatr Nephrol 2026</a>.</p>
</template>
<template data-pop="n29-cyst-cystine" data-title="Cystine leucocytaire et diagnostic">
<div class="lab">Seuils</div><p>Supérieure à 2 nmol d’hémicystine/mg de protéine dans la cystinose, contre moins de 0,2 chez le sujet sain ; habituellement inférieure à 1 chez l’hétérozygote (dosage leucocytaire mixte).</p>
<div class="lab">Examens associés</div><p>Cristaux cornéens à la lampe à fente (habituellement détectables dans la deuxième année ; parfois absents ou difficiles à voir avant deux ans selon les recommandations 2026) et génétique <i>CTNS</i>. Un diagnostic prénatal est possible.</p>
<div class="lab">Cible thérapeutique</div><p>Avec Procysbi® : cible sur leucocytes mixtes inférieure à 1 nmol d’hémicystine/mg de protéine, 30 minutes après la prise matinale, soit 12,5 heures après celle du soir ; ne pas transposer ce protocole à une autre préparation cellulaire ou formulation.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/ndt/gfu090" target="_blank" rel="noopener">Emma et collaborateurs, consensus international sur la cystinose néphropathique, Nephrol Dial Transplant 2014; 29 Suppl 4:iv87-94</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle suisse de Procysbi®, Swissmedic</a>.</p>
</template>
<template data-pop="n29-cyst-soutien" data-title="Traitements de soutien de la cystinose">
<div class="lab">Mesures</div><p>Apports nutritionnels d’au moins 100 % des apports recommandés ; compensation des pertes ; indométacine : les recommandations internationales 2026 discutent 1 à 3 mg/kg/jour en deux ou trois prises chez certains jeunes enfants, avec preuve limitée et surveillance spécialisée. La FI suisse Indocid®-Retard 75 mg ne comporte pas cette indication et ne recommande pas l’usage pédiatrique ; elle contre-indique une clairance inférieure à 30 mL/min. Cette capsule retard ne doit pas être assimilée à une formulation pédiatrique permettant ce schéma. Le choix éventuel hors indication, de la préparation et de la dose appartient au centre spécialisé et à la pharmacie ; ne pas associer aux inhibiteurs de l’enzyme de conversion ou antagonistes de l’angiotensine II ; inhibiteurs de l’enzyme de conversion ou antagonistes des récepteurs de l’angiotensine avec prudence ; hormone de croissance.</p>
<div class="lab">Os</div><p>Phosphate, vitamine D active, correction de l’acidose et physiothérapie.</p>
<div class="lab">Complications extrarénales</div><p>Hypothyroïdie (environ 75 % à 10 ans), diabète à la deuxième ou troisième décennie, hypogonadisme masculin avec infertilité, hépatosplénomégalie, myopathie, atteinte pulmonaire, troubles neurocognitifs.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/ndt/gfu090" target="_blank" rel="noopener">Emma et collaborateurs, consensus international sur la cystinose néphropathique, Nephrol Dial Transplant 2014; 29 Suppl 4:iv87-94</a> ; <a href="https://doi.org/10.1007/s00467-026-07518-w" target="_blank" rel="noopener">Schön, Szaroszyk, Haffner, atteinte osseuse de la cystinose, Pediatr Nephrol 2026</a>.</p>
</template>
<template data-pop="n29-cyst-greffe" data-title="Transplantation rénale dans la cystinose">
<div class="lab">Principe</div><p>Traitement de choix au stade terminal. Le syndrome de Fanconi ne récidive pas dans le greffon et la survie du greffon est meilleure.</p>
<div class="lab">Suite</div><p>La cystéamine se poursuit à vie, même après la greffe. La transition pédiatrie–adulte doit être organisée.</p>
<div class="lab">Limite</div><p>Les sections pertinentes du texte intégral des recommandations 2026 ont été relues ; la greffe corrige la défaillance rénale, pas l’accumulation extrarénale de cystine.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/ndt/gfu090" target="_blank" rel="noopener">Emma et collaborateurs, consensus international sur la cystinose néphropathique, Nephrol Dial Transplant 2014; 29 Suppl 4:iv87-94</a> ; <a href="https://doi.org/10.1038/s41581-026-01089-7" target="_blank" rel="noopener">Hohenfellner et collaborateurs, recommandations 2026 sur la cystinose néphropathique, Nat Rev Nephrol 2026; 22:651-670 (texte intégral, sections pertinentes relues en novembre 2026)</a>.</p>
</template>

<template data-pop="n29-rifater" data-title="Rifater®">
<div class="lab">Indication et posologie</div><p>Association rifampicine, isoniazide et pyrazinamide pour la phase initiale de 2 mois, puis rifampicine et isoniazide (Rifinah®) au moins 4 mois. Comprimés selon le poids : 30–39 kg = 3,40–49 kg = 4,50–64 kg = 5, ≥ 65 kg = 6.</p>
<div class="lab">Pharmacologie</div><p>La rifampicine est un inducteur puissant des cytochromes P450, de l’uridine diphosphate glucuronosyltransférase et de la glycoprotéine P. La fonction hépatique est surveillée avant traitement puis toutes les 2 à 4 semaines.</p>
<div class="lab" id="n29-rifater-safety">Sécurité du produit fixe</div><p>Rifater® ne contient pas d’éthambutol. La FI contre-indique une clairance inférieure à 30 mL/min et plusieurs situations hépatiques ou associations médicamenteuses. Ne pas adapter une insuffisance rénale en espaçant indistinctement le comprimé combiné ; envisager les composants séparés avec l’équipe spécialisée.</p><div class="lab">Effet indésirable</div><p>L’isoniazide a provoqué un syndrome cérébelleux, surtout chez les insuffisants rénaux chroniques.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680470630353" target="_blank" rel="noopener">information professionnelle suisse de Rifater®, Swissmedic</a>.</p>
</template>
<template data-pop="n29-myambutol" data-title="Myambutol® (éthambutol)">
<div class="lab">Posologie</div><p>La FI distingue attaque jusqu’à 25 mg/kg/j et stabilisation à 15 mg/kg/j ; le guide suisse 2024 indique 15 (15–20) mg/kg/j chez l’adulte. Son tableau rénal indique 25 mg/kg si la clairance est supérieure à 75 mL/min, sans en faire une dose universelle ; 15 mg/kg entre 40 et 75 ; 15 mg/kg tous les 2 jours entre 30 et 40 ; sous 30, doser le taux sérique.</p>
<div class="lab">Pharmacocinétique</div><p>Élimination surtout rénale : environ 50 % de la dose inchangée dans l’urine en 24 heures.</p>
<div class="lab">Sécurité</div><p>Risque de névrite optique rétrobulbaire : contrôle ophtalmologique (acuité, champ visuel, vision des couleurs rouge-vert) avant le traitement, puis toutes les 4 semaines ; chaque semaine en cas d’insuffisance rénale selon la FI. Toute baisse visuelle exige une évaluation immédiate.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680331530013" target="_blank" rel="noopener">information professionnelle suisse de Myambutol®, Swissmedic</a>.</p>
</template>
<template data-pop="n29-pyrazinamide" data-title="Pyrazinamide Labatec®">
<div class="lab">Information professionnelle 2022</div><p>La FI contre-indique une clairance inférieure à 50 mL/min, mais mentionne séparément 1000 mg/jour d’entretien en insuffisance rénale et la dose usuelle après hémodialyse. Ces mentions ne constituent pas une autorisation de traiter sous 50 mL/min : l’écart interne à la FI et la divergence avec le guide exigent un avis spécialisé documenté.</p>
<div class="lab">Divergence</div><p>Le guide suisse 2024 prévoit en revanche des prises trois fois par semaine si la clairance est inférieure à 30 mL/min. Voir la fenêtre sur le contentieux de sources.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680576990023" target="_blank" rel="noopener">information professionnelle suisse de Pyrazinamide Labatec®, Swissmedic, octobre 2022</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a>.</p>
</template>
<template data-pop="n29-extencilline" data-title="Extencilline® (benzathine benzylpénicilline)">
<div class="lab">Posologie</div><p>Pour la syphilis tardive de l’adulte : 2,4 millions d’unités par voie intramusculaire profonde une fois par semaine pendant 3 semaines. Jamais par voie intraveineuse. Les atteintes neurologiques, oculaires et otiques requièrent un autre traitement spécialisé.</p>
<div class="lab">Contexte</div><p>Première intention de la recommandation européenne 2020 (jours 1, 8 et 15).</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680697650011" target="_blank" rel="noopener">information professionnelle suisse d’Extencilline®, Swissmedic</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener">Janier et collaborateurs, recommandation européenne 2020 sur la syphilis, J Eur Acad Dermatol Venereol 2021; 35:574-588</a>.</p>
</template>
<template data-pop="n29-procysbi" data-title="Procysbi® (mercaptamine à libération retardée)">
<div class="lab">Posologie</div><p>Entretien 1,3 g/m²/jour en deux prises toutes les 12 heures, maximum 1,95 g/m²/jour. On commence par un sixième à un quart de la dose cible, puis on augmente toutes les 4 à 6 semaines (toutes les 2 semaines de 1 à 6 ans).</p>
<div class="lab">Cible</div><p>Pour Procysbi® et une préparation de leucocytes mixtes : cystine inférieure à 1 nmol d’hémicystine/mg de protéine, 30 minutes après la dose matinale, soit 12,5 heures après celle du soir. La cible et l’horaire doivent correspondre à la méthode du laboratoire et à la formulation.</p>
<div class="lab">Sécurité</div><p>Effets : troubles digestifs, odeur cutanée anormale, éruption ; à forte dose, lésions de type Ehlers-Danlos, hypertension intracrânienne bénigne et ostéopénie. Contre-indications : hypersensibilité à la cystéamine ou à la pénicillamine, et allaitement.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680671290011" target="_blank" rel="noopener">information professionnelle suisse de Procysbi®, Swissmedic</a>.</p>
</template>
<template data-pop="n29-cystadrops" data-title="Cystadrops® (mercaptamine, collyre)">
<div class="lab">Posologie</div><p>1 goutte par œil 4 fois par jour pour les dépôts cornéens, chez l’enfant de plus de 6 mois. Le traitement ne doit pas être arrêté.</p>
<div class="lab">Place</div><p>La cystéamine orale ne suffit pas pour l’œil : il existe une indication spécifique de collyre.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680673800010" target="_blank" rel="noopener">information professionnelle suisse de Cystadrops®, Swissmedic</a> ; <a href="https://doi.org/10.1093/ndt/gfu090" target="_blank" rel="noopener">Emma et collaborateurs, consensus international sur la cystinose néphropathique, Nephrol Dial Transplant 2014; 29 Suppl 4:iv87-94</a>.</p>
</template>
<template data-pop="n29-calcul-tb" data-title="Exemple chiffré : doses antituberculeuses">
<div class="lab">Énoncé fictif</div><p>Adulte de 60 kg.</p>
<div class="lab">Calcul</div><p>Isoniazide 5 mg/kg × 60 = 300 mg ; rifampicine 10 × 60 = 600 mg ; pyrazinamide 25 × 60 = 1500 mg ; éthambutol 15 × 60 = 900 mg par jour.</p>
<div class="lab">Lecture</div><p>Ces valeurs sont le calcul brut à partir des doses de l’Organisation mondiale de la santé. En pratique, on utilise des associations à dose fixe : le poids de 60 kg correspond à 5 comprimés de Rifater® (tranche 50–64 kg).</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680470630353" target="_blank" rel="noopener">information professionnelle suisse de Rifater®, Swissmedic</a>.</p>
</template>
<template data-pop="n29-calcul-procysbi" data-title="Exemple chiffré : dose de Procysbi®">
<div class="lab">Énoncé fictif</div><p>Enfant de surface corporelle 0,7 m².</p>
<div class="lab">Calcul</div><p>Dose cible 1,3 g/m²/jour × 0,7 = 0,91 g/jour, soit 0,455 g toutes les 12 heures. Maximum : 1,95 × 0,7 = 1,365 g/jour. Dose de départ : de 1/6 à 1/4 de 0,91 g, soit environ 0,15 à 0,23 g/jour.</p>
<div class="lab">Lecture</div><p>La dose de Procysbi® est ajustée sur la cystine des leucocytes mixtes, mesurée 30 minutes après la prise matinale (12,5 heures après celle du soir), avec une augmentation toutes les 4 à 6 semaines (2 semaines de 1 à 6 ans).</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680671290011" target="_blank" rel="noopener">information professionnelle suisse de Procysbi®, Swissmedic</a>.</p>
</template>
<template data-pop="pareto-n29-definition" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="n29-0,n29-1,n29-2"></p><ul><li>N29 est une catégorie à astérisque : elle décrit l’atteinte rénale ou urétérale d’une maladie générale codée par une croix.</li><li>Trois sous-codes : N29.0* syphilis tardive, N29.1* tuberculose et schistosomiase, N29.8* cystinose ; les glomérulopathies se codent N08.0*.</li><li>La fréquence suisse de la forme urogénitale de la tuberculose est inconnue ; la surveillance Suisse et Liechtenstein 2025 compte 544 cas.</li></ul></template>
<template data-pop="pareto-n29-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="n29-3"></p><ul><li>Tuberculose : voie hématogène, caséification papillaire, sténoses des jonctions, petite vessie.</li><li>Schistosomiase : granulome autour de l’œuf, uretère inférieur, cancer de la vessie.</li><li>Syphilis : complexes immuns glomérulaires ; cystinose : accumulation lysosomale de cystine.</li></ul></template>
<template data-pop="pareto-n29-causes" data-title="Pareto — Causes et terrain">
<p class="ratio" data-cover="n29-4"></p><ul><li>Le terrain (origine, eau douce, enfant avec Fanconi) oriente l’hypothèse, sans remplacer la preuve.</li><li>Le délai de la tuberculose peut dépasser 30 ans : l’absence d’antécédent n’exclut rien.</li></ul></template>
<template data-pop="pareto-n29-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="n29-5,n29-6"></p><ul><li>Les signes sont souvent pauvres : tuberculose asymptomatique, schistosomiase silencieuse en Europe.</li><li>Hématurie terminale (schistosomiase), leucocyturie stérile (tuberculose), retard de croissance avec polyurie (cystinose).</li></ul></template>
<template data-pop="pareto-n29-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="n29-7"></p><ul><li>La preuve est étiologique : culture ou amplification génique, œufs, cystine leucocytaire.</li><li>Le différentiel inclut le cancer urothélial ; la tomographie par émission de positons ne distingue pas la tuberculose d’un cancer.</li></ul></template>
<template data-pop="pareto-n29-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="n29-8"></p><ul><li>Hydronéphrose obstructive : drainage sans retard.</li><li>Surveiller la névrite optique de l’éthambutol et la fonction hépatique ; discuter la prévention de Jarisch–Herxheimer et la surveillance hospitalière dans les formes cardiovasculaires ou neurologiques.</li></ul></template>
<template data-pop="pareto-n29-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="n29-9"></p><ul><li>Tuberculose : 2 HRZE / 4 HR ; schistosomiase : praziquantel 40 mg/kg ; syphilis tardive : benzathine pénicilline 3 injections ; cystinose : cystéamine et greffe au stade terminal.</li><li>Le contentieux sur le pyrazinamide en insuffisance rénale est présenté avec les deux textes.</li></ul></template>
<template data-pop="pareto-n29-suivi" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="n29-10,n29-11,n29-12"></p><ul><li>Tuberculose : suivi infectieux et urologique individualisé ; les séries proposant jusqu’à dix ans ne fixent pas une norme suisse universelle. Cystinose : cystéamine à poursuivre même après greffe.</li><li>Adaptations rénales (éthambutol), grossesse (praziquantel si cliniquement justifié selon le produit et le contexte), allergie (doxycycline), allaitement (Procysbi® contre-indiqué).</li><li>Chaque sous-code exige la preuve de la maladie causale.</li></ul></template>
<template data-pop="pareto-n29-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="n29-e-1,n29-e-2,n29-e-3,n29-e-4,n29-e-5,n29-e-6,n29-e-7"></p><ul><li>Culture urinaire de trois urines du matin : référence de la tuberculose urogénitale ; examen direct à environ 20 %.</li><li>Schistosomiase : œufs urinaires positifs chez 96/831 cas testés dans la cohorte de Barcelone, sérologie positive chez 763/772 ; ces proportions sélectionnées ne sont pas des sensibilités et la sérologie ne prouve pas l’activité.</li><li>Cystinose : cystine leucocytaire > 2 nmol/mg, cristaux cornéens, génétique.</li></ul></template>
<template data-pop="pareto-n29-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="n29-s-anat-cours"></p><ul><li>Jonctions pyélo-urétérale et urétéro-vésicale (tuberculose) ; moitié inférieure de l’uretère (schistosomiase).</li></ul></template>
<template data-pop="pareto-n29-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="n29-s-histo-cours"></p><ul><li>Granulome caséeux (tuberculose), granulome autour de l’œuf (schistosomiase), cristaux de cystine (cystinose), complexes immuns sous-épithéliaux (syphilis).</li></ul></template>
<template data-pop="pareto-n29-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="n29-s-physio-cours"></p><ul><li>Trois niveaux d’atteinte : tubulaire (Fanconi), interstitiel (concentration, perte sodée, acidose), excréteur (obstruction).</li></ul></template>
<template data-pop="pareto-n29-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="n29-s-bioch-cours"></p><ul><li>Cystinosine et efflux lysosomal de cystine ; induction enzymatique par la rifampicine ; élimination rénale de l’éthambutol.</li></ul></template>
<template data-pop="pareto-n29-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="n29-p-1,n29-p-2,n29-p-3,n29-p-4"></p><ul><li>Un médicament par maladie causale ; praziquantel : référence clinique suisse et RCP français identifiés, produit disponible à confirmer avec la pharmacie.</li><li>Rifampicine : interactions ; éthambutol : vision ; cystéamine : cible de cystine leucocytaire et allaitement exclu.</li></ul></template>
