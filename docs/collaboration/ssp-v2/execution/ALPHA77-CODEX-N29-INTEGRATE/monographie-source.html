<section class="ilot" id="n29-syndromes"><h2>Syndromes : localiser avant de nommer la maladie</h2>
<p>Trois présentations organisent le raisonnement. Un <b>syndrome irritatif urinaire</b> associe pollakiurie, dysurie, douleurs et parfois hématurie ; il attire l’attention sur la voie excrétrice, mais ne sépare pas à lui seul tuberculose, schistosomiase, infection banale et tumeur. Un <b>syndrome obstructif</b> associe une anomalie de l’écoulement et son retentissement à l’imagerie : la priorité devient de préserver la fonction, tout en recherchant la cause. Un <b>syndrome de Fanconi</b> est un défaut global de réabsorption proximale : glycosurie, pertes de bicarbonate et d’électrolytes, protéinurie de bas poids moléculaire et polyurie constituent un ensemble, souvent présent avant l’élévation de créatinine.</p>
<p>La <b>protéinurie glomérulaire avec œdèmes</b> ouvre un autre chemin. Une syphilis ou une schistosomiase peut s’accompagner d’une glomérulopathie ; cela impose d’en documenter le mécanisme au lieu de ramener toute anomalie rénale au même code. Inversement, l’enfant atteint de cystinose peut développer secondairement une atteinte glomérulaire : l’évolution de l’albuminurie et du débit de filtration complète donc le suivi des pertes tubulaires.</p>
<div class="key"><b>À retenir.</b> Une créatinine normale n’exclut pas une tubulopathie ; une dilatation n’identifie pas sa cause ; une hématurie n’est pas une preuve d’infection.</div>
<p>Sources : guide suisse de tuberculose 2024, chapitre 6 ; EAU, §3.16.2 ; RMS 2018, symptomatologie ; Hohenfellner et al., 2026, « Renal Fanconi syndrome and glomerular disease ».</p></section>
<section class="ilot" id="n29-arbre"><h2>Arbre diagnostique : de la présentation à la preuve</h2>
<ol><li><b>Rechercher d’abord le retentissement.</b> Obstruction avec altération fonctionnelle, infection grave, déshydratation ou désordre électrolytique imposent une évaluation rapide. Le prélèvement microbiologique et le traitement de la cause ne remplacent pas un drainage nécessaire ou la correction des pertes.</li>
<li><b>Hématurie ou symptômes urinaires persistants.</b> Reconstituer expositions à la tuberculose et aux eaux douces, chronologie, traitements antérieurs et examen urinaire. Une culture bactérienne standard négative n’a pas recherché toutes les causes. Si la tuberculose est plausible : trois urines matinales en culture spécifique, amplification validée et bilan thoracique. Si l’exposition parasitaire est plausible : recherche d’œufs urinaires selon les consignes du laboratoire, sérologie interprétée selon les expositions antérieures, puis imagerie du retentissement.</li>
<li><b>Une lésion urinaire demeure inexpliquée.</b> Ne pas conclure sur le seul terrain : calcul, tumeur urothéliale, infection usuelle et autres causes de pyurie ou d’hématurie restent à comparer. Une lacune ou une masse peut nécessiter une exploration urologique et histologique, même si un test infectieux est positif. Des infections peuvent coexister.</li>
<li><b>Polyurie et défaut de croissance avec pertes tubulaires.</b> Quantifier les anomalies sanguines et urinaires, rechercher cystine leucocytaire, variants pathogènes de <i>CTNS</i> et cristaux cornéens. L’absence de cristaux avant deux ans ou une créatinine normale ne ferme pas cette branche. La préanalytique du dosage et sa méthode sont décisives.</li>
<li><b>Sérologie de syphilis positive et lésion rénale.</b> Distinguer infection antérieure traitée, infection actuelle et stade ; examiner les signes neurologiques, oculaires et auditifs. L’attribution rénale requiert une concordance clinique et paraclinique, avec recherche de diagnostics concurrents. Une sérologie isolée n’est pas une preuve d’une gomme rénale.</li></ol>
<p>Ce parcours synthétise les recommandations suisses puis européennes citées ; il ne crée ni score validé ni seuil universel. Les probabilités et les examens se réévaluent lorsqu’un résultat est discordant avec le tableau.</p></section>
<section class="ilot" id="n29-suivi-actualise"><h2>Suivi : définir ce qui doit s’améliorer</h2>
<h3>Tuberculose et schistosomiase</h3>
<p>Dans la tuberculose, vérifier tolérance, observance, sensibilité microbiologique et évolution du retentissement urinaire. Une amélioration infectieuse ne garantit pas la disparition d’une sténose fibreuse. Les délais de surveillance prolongée proposés dans les séries de tuberculose urogénitale restent peu standardisés ; ils doivent être individualisés, sans présenter dix ans comme une règle suisse universelle.</p>
<p>Pour la schistosomiase à <i>S. haematobium</i>, la revue suisse de 2018 propose <b>40 mg/kg de praziquantel par voie orale en prise unique, répétée après quatre semaines</b>. Lorsqu’il existait des œufs avant traitement, elle préconise un contrôle urinaire après six à huit semaines ; leur persistance conduit à réévaluer et retraiter. Une sérologie restant positive n’est pas, à elle seule, un échec. Le praziquantel agit sur les vers adultes ; la prise en charge d’une exposition très récente ou d’un syndrome de Katayama ne se réduit pas à appliquer ce schéma sans avis spécialisé. La prévention repose aussi sur l’évitement d’une nouvelle exposition aux eaux douces infestées.</p>
<h3>Syphilis et cystinose</h3>
<p>Le suivi sérologique de la syphilis utilise le <b>même test non tréponémique quantitatif, dans le même laboratoire</b>, comparé au titre initial. La HAS 2025 propose des contrôles à trois, six et douze mois. Une hausse d’un facteur quatre évoque une réinfection ou un échec à réévaluer. Une baisse insuffisante ne déclenche pas automatiquement un retraitement : l’IUSTI 2020 souligne que, dans la syphilis latente tardive, une réponse sérologique peut être absente et qu’un faible titre stable peut persister après traitement adéquat. Le stade, les expositions et les signes neurologiques guident la discussion spécialisée.</p>
<p>Dans la cystinose, suivre à la fois <b>fonction tubulaire, filtration, croissance, atteintes extrarénales et observance</b>. Les recommandations 2026 proposent un contrôle des électrolytes et bicarbonates au moins tous les deux à trois mois chez le jeune enfant ; chez l’enfant de plus de six ans stable, l’intervalle peut atteindre trois à quatre mois. Ces intervalles s’adaptent à la gravité, aux pertes et aux traitements. L’accès libre à l’eau et aux toilettes accompagne le traitement de la polyurie. La cystéamine systémique reste nécessaire après greffe, car celle-ci ne corrige pas le défaut métabolique des autres organes ; le suivi ophtalmologique et le traitement local restent distincts.</p>
<p>Sources : guide suisse 2024, chapitre 7.4 ; EAU, §3.16 ; RMS 2018, traitement ; IUSTI 2020, suivi ; HAS 2025, p 15 ; Hohenfellner et al., 2026, encadrés 2–3.</p></section>
<section class="ilot" id="n29-conclusion"><h2>Points clés pour le raisonnement clinique</h2>
<p>Devant une anomalie rénale ou urinaire, identifier le syndrome, puis la cause et son retentissement. La tuberculose peut rester discrète : multiplier les prélèvements adaptés et associer culture et amplification selon le contexte. Une exposition aux eaux douces oriente vers la schistosomiase, dont la preuve parasitologique et le retentissement se recherchent séparément. La cystinose se révèle souvent par une tubulopathie alors que la filtration paraît encore préservée. Une syphilis positive n’explique pas automatiquement toute lésion rénale.</p>
<p>Le traitement suit la maladie causale, le produit réellement disponible et la fonction rénale. Un obstacle menaçant le rein, une toxicité médicamenteuse ou une perte électrolytique sévère imposent leur propre conduite. Les données anciennes, les recommandations et les informations professionnelles sont comparées explicitement lorsqu’elles divergent.</p></section>
<section class="ilot" id="n29-pieges"><h2>Pièges à éviter</h2>
<ul><li>Confondre le pourcentage de tests positifs d’une cohorte sélectionnée avec la sensibilité d’un test.</li><li>Exclure une tuberculose sur une culture urinaire ou un IGRA négatif, ou considérer une amplification positive comme un bilan complet des résistances.</li><li>Confondre un traitement médical efficace avec la levée d’une sténose fibreuse ; différer un drainage nécessaire au motif qu’une chirurgie reconstructrice sera programmée.</li><li>Affirmer que la cystéamine ne peut jamais atténuer Fanconi : le bénéfice d’une initiation très précoce diffère de la réversibilité d’une lésion installée.</li><li>Utiliser un seuil de cystine sans préciser le type de leucocytes, l’unité et l’horaire par rapport à la formulation de cystéamine.</li><li>Associer rifampicine et praziquantel sans examiner leur contre-indication d’association ; appliquer une adaptation antituberculeuse sans vérifier la FI du produit exact.</li><li>Traiter une manifestation neurologique, oculaire ou auditive de syphilis par le seul schéma retard intramusculaire prévu pour une forme tardive sans cette atteinte.</li></ul>
<p>Ces pièges correspondent aux passages relus du guide suisse, des FI, de l’EAU, de la RMS, de l’IUSTI/HAS et des recommandations cystinose 2026. La couverture pédagogique et les tests techniques ne constituent pas une validation médicale humaine.</p></section>
<section class="ilot" id="n29-federal"><h2>Points de raisonnement pour l’examen fédéral</h2><p>La leçon entraîne une démarche à partir de symptômes : reconnaître une anomalie des volumes urinaires, interpréter dysurie, pyurie ou hématurie, puis relier fonction rénale, sédiment et protéinurie. Ce rapprochement pédagogique correspond aux situations SSP 63, 64, 161, 164 et 173 de <b>PROFILES 2017</b>, pp. 29 et 33. Il ne signifie pas que chaque maladie rare de cette catégorie constitue une question obligatoire de l’examen.</p><p>Les exigences MEBEKO pour l’examen 2026, §2.1, fondent les contenus sur les objectifs légaux, PROFILES et un plan d’épreuve à plusieurs dimensions. Les vignettes et quiz de ce cours sont des exercices pédagogiques originaux, sans statut de question officielle. La numérotation utilisée ici est celle de l’édition 2017 ; elle ne doit pas être confondue avec les identifiants de l’édition 2023.</p><p>À maîtriser : choisir le prélèvement qui répond à la question clinique, reconnaître une urgence obstructive ou médicamenteuse, expliquer pourquoi un test négatif isolé ne suffit pas et vérifier la FI du produit suisse avant de proposer une adaptation. Sources : <a href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES 2017, document officiel CIMS</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">MEBEKO, exigences 2026, §2.1</a>.</p></section><section class="ilot" id="n29-annexe-cim"><h2><span class="n">1</span>Annexe documentaire : logique croix-astérisque et sous-codes</h2>
<p>La catégorie N29 regroupe les « autres affections du rein et de l’uretère au cours de maladies classées ailleurs ». C’est une catégorie à <b>astérisque</b> (<button class="w" data-k="n29-asterisque">système croix-astérisque et règles de codage</button>). Dans la CIM-10-GM 2024, l’étiologie est codée par un code à <b>croix</b> (†), et la manifestation d’organe par un code à astérisque (*). Le code à astérisque ne s’emploie donc jamais seul : il suppose que la maladie causale soit identifiée.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Intitulé de l’Office fédéral de la statistique</th><th>Code étiologique (†)</th><th>Maladie à enseigner</th></tr></thead><tbody><tr><td>N29.0*</td><td>Syphilis tardive du rein</td><td>A52.7†</td><td>Syphilis tardive (tertiaire) avec atteinte rénale</td></tr><tr><td>N29.1*</td><td>Affections du rein et de l’uretère au cours de maladies infectieuses et parasitaires classées ailleurs</td><td>A18.1† (tuberculose) ; B65.-† (schistosomiase)</td><td>Tuberculose urogénitale ; schistosomiase urinaire</td></tr><tr><td>N29.8*</td><td>Affections du rein et de l’uretère au cours d’autres maladies classées ailleurs</td><td>E72.0† (cystinose)</td><td>Cystinose néphropathique</td></tr></tbody></table>
<p>Ce tableau attribue une maladie à chaque sous-code. Il montre aussi que N29.1* rassemble deux infections très différentes : une bactérie à croissance lente (la tuberculose) et un parasite (la schistosomiase). Le point commun est l’atteinte de l’appareil urinaire, non le mécanisme.</p>
<h3>1.1 Délimitations de codage à connaître</h3>
<ul><li>Une <b>glomérulopathie</b> de la syphilis ou de la schistosomiase se code <b>N08.0*</b> (avec A52.7† ou B65.-†), et non N29. La classification réserve donc N29 aux atteintes qui ne sont pas glomérulaires (<button class="w" data-k="n29-asterisque">règles de codage</button>).</li><li>L’atteinte <b>tubulo-interstitielle</b> de la cystinose figure aussi sous <b>N16.3*</b> (avec E72.0†). Le double rattachement N16.3* et N29.8* est un fait de la classification ; le dossier de recherche n’a trouvé aucune règle d’arbitrage entre les deux.</li><li>Le code A52.7 « autres formes tardives de syphilis symptomatique » comprend la gomme syphilitique et la syphilis tertiaire de toute localisation, à l’exclusion des formes A52.0 à A52.3.</li><li>La catégorie N29 n’ajoute pas de note générale ; N29.1 inclut explicitement tuberculose et schistosomiase, et N29.8 la thésaurismose cystinique. Ces inclusions ont été vérifiées dans le fichier OFS CIM-10-GM 2024.</li></ul>
<div class="trap"><span class="k">Piège de codage</span> Coder N29.0* pour toute néphropathie de la syphilis est une erreur. La glomérulonéphrite syphilitique, la plus documentée, relève de N08.0*. N29.0* est réservé à l’atteinte rénale de la syphilis <i>tardive</i> qui n’est pas glomérulaire, pour laquelle le dossier ne contient aucune description clinique (voir la lacune au paragraphe 3.3).</div>
<div class="key"><b>À retenir.</b> Croix = maladie causale, astérisque = organe atteint. Le choix du sous-code suit la maladie causale : syphilis tardive (N29.0*), infection tuberculeuse ou parasitaire (N29.1*), cystinose (N29.8*).</div>
</section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
<div class="panel" id="pE" hidden><div class="chap-body">
<section class="ilot" id="n29-e-1"><h2><span class="n">e-1</span>Hiérarchie des examens</h2>
<p>Aucun examen unique ne répond à toutes les questions de la catégorie. Pour chaque maladie, l’examen se choisit selon la question posée : détecter l’agent, mesurer le retentissement, ou identifier la cause génétique. Le tableau suivant relie chaque question à l’examen de référence et à son statut.</p>
<table class="t"><thead><tr><th>Question</th><th>Examen et statut</th><th>Examen de référence</th></tr></thead><tbody><tr><td>Le bacille de la tuberculose est-il présent dans l’urine ?</td><td><button class="w" data-k="n29-tb-culture">Trois urines du matin en culture</button> : indiquées. Examen direct : conditionnel (sensibilité faible). <button class="w" data-k="n29-taan">Amplification génique</button> : complémentaire</td><td>La culture confirme le diagnostic et teste les résistances</td></tr><tr><td>Y a-t-il une tuberculose pulmonaire associée ?</td><td>Radiographie ou scanner thoracique : indiqués même si la forme paraît extrathoracique</td><td>Imagerie thoracique couplée à la microbiologie</td></tr><tr><td>Quelle est l’étendue des lésions urinaires ?</td><td><button class="w" data-k="n29-uroscanner">Uro-scanner</button> : indiqué. Échographie : conditionnelle (organes génitaux masculins). Imagerie par résonance magnétique : non systématique</td><td>Uro-scanner pour le haut appareil</td></tr><tr><td>La schistosomiase est-elle active ?</td><td><button class="w" data-k="n29-schisto-urine">Œufs dans l’urine</button> : indiqués. <button class="w" data-k="n29-schisto-serologie">Sérologie</button> : indiquée mais non discriminante</td><td>Œufs dans l’urine pour l’infection active</td></tr><tr><td>La cystinose est-elle présente ?</td><td><button class="w" data-k="n29-cyst-cystine">Cystine leucocytaire</button>, lampe à fente, génétique <i>CTNS</i> : indiquées</td><td>Les trois examens se complètent</td></tr><tr><td>Une tumeur est-elle associée ?</td><td>Cystoscopie, imagerie, biopsie selon le contexte : conditionnelles</td><td>Non précisé par les sources lues</td></tr></tbody></table>
<p>Le statut distingue les examens indiqués d’emblée (qui répondent directement), conditionnels (selon le contexte) et non systématiques (de rendement faible). La colonne de référence nomme le <b>gold standard</b> pour chaque question : la culture pour la tuberculose, la recherche d’œufs pour la schistosomiase active, la cystine leucocytaire jointe à la génétique pour la cystinose.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Demander un seul examen non discriminant. Une sérologie positive de schistosomiase ne dit pas si l’infection est active, et un test immunologique positif de tuberculose ne distingue pas infection et maladie.</div>
<div class="key"><b>À retenir.</b> La question dicte l’examen. Pour la tuberculose urogénitale, la culture d’urine répétée est le test de confirmation ; pour la schistosomiase, la preuve est l’œuf ; pour la cystinose, la cystine leucocytaire.</div>
</section>

<section class="ilot" id="n29-e-2"><h2><span class="n">e-2</span>Tuberculose : microbiologie urinaire et tests immunologiques</h2>
<p>Les bacilles de la tuberculose sont éliminés dans l’urine lorsque les lésions papillaires s’ouvrent dans les voies excrétrices. Leur recherche répond à une question précise : le bacille est-il présent, et quelle est sa sensibilité aux médicaments ?</p>
<table class="t"><thead><tr><th>Examen</th><th>Performance rapportée</th><th>Lecture et piège</th></tr></thead><tbody><tr><td><button class="w" data-k="n29-tb-culture">Culture urinaire</button> (au moins 3 urines du matin)</td><td>Sensibilité variable : 80–90 % dans la revue 2021, mais 23,3–30 % dans les études de tuberculose rénale citées par l’EAU ; spécificité 92–100 % selon l’EAU</td><td>En milieu liquide, culture positive après au moins 9–10 jours ; négative seulement après 6 semaines</td></tr><tr><td><button class="w" data-k="n29-baar">Examen direct</button> (bacilles acido-alcoolo-résistants)</td><td>Sensibilité environ 20 %, spécificité environ 97 %</td><td>Un examen direct négatif n’exclut pas la tuberculose</td></tr><tr><td><button class="w" data-k="n29-taan">Amplification génique</button> sur urine</td><td>EAU : Xpert MTB/RIF, sensibilité groupée 84,7 % (70,8–93,1), spécificité 97,3 % (91,0–99,2) ; complément de la culture</td><td>En Suisse, la culture et/ou l’amplification confirment le diagnostic</td></tr><tr><td><button class="w" data-k="n29-igra">Test immunologique ou tuberculinique</button></td><td>Ne distingue pas infection et maladie</td><td>Un résultat négatif n’exclut pas la tuberculose</td></tr></tbody></table>
<p>Le tableau explique la hiérarchie : la culture permet l’isolement du bacille et possède une spécificité élevée, mais sa sensibilité urinaire varie, donc c’est le test qui confirme et qui permet l’antibiogramme. L’examen direct, très spécifique mais peu sensible, ne sert qu’à confirmer rapidement un résultat positif. Le test immunologique ne peut ni confirmer ni exclure.</p>
<h3>Recueil des urines</h3>
<p>On recueille au moins trois urines du matin, premier jet exclu, en milieu de jet, sur des jours consécutifs. Cette consigne est reprise par l’EAU, §3.16, en complément du cadre suisse général ; les modalités de prélèvement se coordonnent avec le laboratoire.</p>
<div class="trap"><span class="k">Piège</span> Un seul prélèvement urinaire négatif ne suffit pas, de même qu’un examen direct négatif. La pratique recommandée est la répétition (trois urines du matin) et la culture.</div>
<div class="key"><b>À retenir.</b> Culture urinaire répétée et résistance à la rifampicine : deux informations obtenues par un même prélèvement, avant le début du traitement.</div>
</section>

<section class="ilot" id="n29-e-3"><h2><span class="n">e-3</span>Schistosomiase : urine, sérologie et imagerie</h2>
<p>La schistosomiase urinaire se confirme par l’œuf. Les autres examens apprécient le retentissement ou orientent le dépistage.</p>
<table class="t"><thead><tr><th>Examen</th><th>Résultat chez les migrants dépistés à Barcelone</th><th>Lecture</th></tr></thead><tbody><tr><td><button class="w" data-k="n29-schisto-urine">Microscopie urinaire</button> (filtration)</td><td>Positive chez 96/831 cas probables ou confirmés ayant eu cet examen (11,5 %)</td><td>Preuve d’infection active, mais peu sensible en contexte européen</td></tr><tr><td><button class="w" data-k="n29-schisto-serologie">Sérologie</button></td><td>Positive chez 763/772 cas probables ou confirmés testés (98,8 %)</td><td>Ne distingue pas infection active et infection ancienne ; cas « probable » si isolée</td></tr><tr><td>Éosinophilie</td><td>Présente chez 29,7 %</td><td>Absence fréquente : ne pas l’exiger</td></tr><tr><td>Échographie (faite chez 14 %)</td><td>Anomalies dans 20,4 % : épaississement vésical 9,0 %, calcifications vésicales 4,1 %, hydronéphrose 2,4 %</td><td>Évalue le retentissement, non l’activité</td></tr><tr><td>Bandelette urinaire</td><td>Hématurie microscopique, quasi constante chez l’enfant infecté par <i>S. haematobium</i></td><td>Dépistage en zone d’endémie</td></tr></tbody></table>
<p>Le tableau montre des proportions de résultats positifs dans une population sélectionnée, et non des sensibilités calculées contre une référence indépendante. La définition de cas inclut la sérologie et certains sujets n’ont pas eu tous les examens. La sérologie convient donc au dépistage, la recherche d’œufs à la preuve. Après traitement, la sérologie reste positive dans 84 % des cas : elle ne sert pas à juger de la guérison.</p>
<p>La <b>cystoscopie</b> montre des pseudotubercules, des plaques sablonneuses, une cystite kystique ou une tumeur ; elle est habituellement inutile en zone d’endémie. La radiographie montre la calcification vésicale linéaire, l’urographie l’hydronéphrose.</p>
<div class="key"><b>À retenir.</b> Dépistage par la sérologie, preuve par les œufs urinaires, retentissement par l’échographie : trois questions, trois examens.</div>
</section>

<section class="ilot" id="n29-e-4"><h2><span class="n">e-4</span>Syphilis tardive et cystinose</h2>
<h3>Syphilis tardive</h3>
<p>La syphilis tardive comprend une <b>forme latente sans symptôme</b> et les formes tertiaires ; une manifestation tertiaire n’est donc pas obligatoire. L’anamnèse des expositions, des traitements antérieurs et des sérologies permet de dater l’infection ; si sa durée reste inconnue, elle est prise en charge comme tardive. Un test tréponémique réactif doit être confronté à un test non tréponémique quantitatif (RPR ou VDRL), au contexte et au traitement antérieur. Les tests tréponémiques restent souvent positifs à vie et ne servent pas à mesurer l’activité ou la guérison. Le titre RPR/VDRL initial, idéalement au jour du traitement, permet la comparaison dans le même laboratoire. Une sérologie positive ne prouve pas à elle seule que la lésion rénale est syphilitique ; la caractérisation de la lésion, la recherche d’autres causes et, si indiquée, l’histologie restent nécessaires. Sources : IUSTI 2020, pp 4–8, et HAS 2025, pp 8–10. Aucun critère rénal tertiaire validé n’a été trouvé dans ces recommandations.</p>
<h3>Cystinose</h3>
<table class="t"><thead><tr><th>Examen</th><th>Valeur normale ou attendue</th><th>Valeur pathologique</th></tr></thead><tbody><tr><td><button class="w" data-k="n29-cyst-cystine">Cystine leucocytaire</button></td><td>Moins de 0,2 nmol d’hémicystine/mg de protéine chez le sujet sain</td><td>Supérieure à 2 nmol/mg dans la cystinose ; chez l’hétérozygote habituellement inférieure à 1 nmol/mg (dosage leucocytaire mixte)</td></tr><tr><td>Lampe à fente</td><td>Cornée sans dépôt</td><td>Cristaux cornéens, habituellement détectables dans la deuxième année ; parfois absents ou difficiles à voir avant deux ans selon les recommandations 2026</td></tr><tr><td>Génétique <i>CTNS</i></td><td>Absence de variants bialléliques de <i>CTNS</i></td><td>Variants bialléliques de <i>CTNS</i></td></tr><tr><td>Bandelette urinaire</td><td>—</td><td>Faible densité, glycosurie, albuminurie modérée</td></tr><tr><td>Créatinine</td><td>Souvent normale chez le jeune enfant</td><td>Élevée plus tard : insuffisance rénale terminale vers 10–12 ans sans cystéamine</td></tr></tbody></table>
<p>Le tableau montre que le diagnostic de cystinose repose sur trois examens complémentaires (cystine leucocytaire, lampe à fente, génétique), alors que la fonction glomérulaire peut rester normale. Un diagnostic prénatal est possible.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Se rassurer sur une créatinine normale chez un enfant avec polyurie et retard de croissance. Le syndrome de Fanconi est tubulaire : il précède la baisse de filtration.</div>
<div class="key"><b>À retenir.</b> Devant un Fanconi du jeune enfant, la cystine leucocytaire est l’examen décisif, même si la créatinine est normale.</div>
</section>

<section class="ilot" id="n29-e-5"><h2><span class="n">e-5</span>Imagerie et examens spécialisés</h2>
<p>L’imagerie répond à la question du retentissement : où sont les lésions, quelle est la voie obstruée, que reste-t-il de parenchyme fonctionnel ?</p>
<table class="t"><thead><tr><th>Examen</th><th>Ce qu’il montre dans la tuberculose urogénitale</th><th>Limite</th></tr></thead><tbody><tr><td><button class="w" data-k="n29-uroscanner">Uro-scanner</button></td><td>Granulomes au temps néphrographique, calcifications lobaires à bord calcifié, cavités (signe précoce de nécrose papillaire), sténoses urétérales (tiers distal le plus fréquent). Sensibilité de l’imagerie : 91,4 %</td><td>Les lacunes peuvent simuler un carcinome urothélial</td></tr><tr><td><button class="w" data-k="n29-echo-genital">Échographie</button></td><td>Peut être normale au début ; examen de référence pour les atteintes du testicule, de l’épididyme et du déférent</td><td>Normale au début : n’exclut pas une atteinte rénale</td></tr><tr><td>Imagerie par résonance magnétique</td><td>Peu sensible au début</td><td>Non systématique</td></tr><tr><td>Tomographie par émission de positons au fluorodésoxyglucose</td><td>Hyperfixation</td><td>Ne distingue pas la tuberculose d’un cancer</td></tr><tr><td>Biopsie vésicale</td><td>Sensibilité de 18,5 à 52 %</td><td>Rendement variable</td></tr></tbody></table>
<p>Dans la schistosomiase, l’imagerie complète le bilan : la radiographie montre la calcification vésicale linéaire, l’urographie l’hydronéphrose ; la levée de l’obstacle peut ne pas corriger l’aspect radiologique, la revue de 2013 évoque alors une mesure de pression (test de Whitaker), avec une concordance rapportée d’environ 75 % avec la scintigraphie diurétique. Ce repère historique ne rend pas ce test invasif systématique : l’exploration fonctionnelle se choisit avec l’urologue.</p>
<div class="trap"><span class="k">Piège</span> Interpréter une lacune urétérale comme un cancer sans rechercher la tuberculose, ou une hyperfixation en tomographie par émission de positons comme preuve de tumeur. Le contexte (origine, microbiologie) tranche.</div>
<div class="key"><b>À retenir.</b> L’uro-scanner décrit, la microbiologie confirme : aucune imagerie ne remplace la culture d’urine dans la tuberculose urogénitale.</div>
</section>

<section class="ilot" id="n29-e-6"><h2><span class="n">e-6</span>Diagnostics et associations biologiques</h2>
<table class="t"><thead><tr><th>Diagnostic</th><th>Leucocyturie stérile</th><th>Hématurie terminale</th><th>Œufs urinaires</th><th>Syndrome de Fanconi</th><th>Culture positive</th></tr></thead><tbody><tr><td>Tuberculose urogénitale</td><td>Oui (premiers signes fréquents)</td><td>Possible (atteinte vésicale)</td><td>Non</td><td>Non</td><td>Oui (confirmation)</td></tr><tr><td>Schistosomiase urinaire</td><td>Non décrite</td><td>Oui (signe classique)</td><td>Oui (preuve)</td><td>Non</td><td>Non</td></tr><tr><td>Cystinose</td><td>Non</td><td>Non</td><td>Non</td><td>Oui</td><td>Non</td></tr><tr><td>Syphilis tardive</td><td>Non décrite</td><td>Non décrite</td><td>Non</td><td>Non</td><td>Non</td></tr></tbody></table>
<p>Ce tableau croise quatre diagnostics et cinq signes biologiques. Il aide à ne pas confondre les maladies, mais il n’est pas exclusif : des associations sont possibles chez un même patient exposé à plusieurs risques, et une cellule « non décrite » signifie que les sources lues ne documentent pas l’association.</p>
</section>

<section class="ilot" id="n29-e-7"><h2><span class="n">e-7</span>Cas corrigés</h2>
<p>Les cas suivants utilisent des valeurs choisies pour exercer le raisonnement. Ils ne représentent pas des résultats d’étude.</p>
<div class="quiz ui"><p><b>Cas 1.</b> Un homme de 30 ans, originaire d’un pays à forte incidence de tuberculose, a une leucocyturie à la bandelette et une culture d’urine standard négative. Quelle étape suit ?</p>
<button data-ok="0">A. Conclure à une cystite non bactérienne bénigne puisque la culture standard est négative.</button><button data-ok="1">B. Rechercher une tuberculose urogénitale par trois urines du matin en culture, sans exclure la maladie sur un seul prélèvement.</button><button data-ok="0">C. Commander une tomographie par émission de positons et attendre son résultat avant toute microbiologie.</button><p class="fb" hidden>Réponse B. Une leucocyturie stérile est un premier signe fréquent de tuberculose urogénitale. La culture répétée garde une sensibilité variable et doit être associée à une amplification validée selon l’EAU ; la tomographie par émission de positons ne distingue pas la tuberculose d’un cancer.</p></div>
<div class="quiz ui"><p><b>Cas 2.</b> Un migrant subsaharien de 22 ans est asymptomatique ; la sérologie de schistosomiase est positive et la microscopie urinaire négative. Que conclure ?</p>
<button data-ok="0">A. La microscopie négative exclut toute infection.</button><button data-ok="1">B. Il s’agit d’un cas probable : la sérologie ne distingue pas infection active et ancienne, et la microscopie urinaire était positive chez 96/831 cas probables ou confirmés examinés dans la cohorte citée ; cette proportion n’est pas une sensibilité.</button><button data-ok="0">C. L’infection est certaine et active, donc aucun autre examen n’est utile.</button><p class="fb" hidden>Réponse B. En Europe, la microscopie urinaire est peu sensible. La sérologie oriente, mais ne prouve pas l’activité ; le praziquantel 40 mg/kg reste le traitement recommandé par l’Organisation mondiale de la santé.</p></div>
<div class="quiz ui"><p><b>Cas 3.</b> Un nourrisson de 9 mois présente polyurie, vomissements et retard de croissance ; la créatinine est normale, la bandelette montre une glycosurie. Quel examen est décisif ?</p>
<button data-ok="0">A. Le dosage de la créatinine suffit : elle est normale, donc l’atteinte rénale est exclue.</button><button data-ok="1">B. La cystine leucocytaire, complétée par la lampe à fente et la génétique de <i>CTNS</i>.</button><button data-ok="0">C. Une sérologie de syphilis tardive.</button><p class="fb" hidden>Réponse B. Le syndrome de Fanconi de la cystinose débute vers 4 à 6 mois, avec une créatinine souvent normale chez le jeune enfant. La cystine leucocytaire dépasse 2 nmol/mg dans la maladie.</p></div>
<div class="quiz ui"><p><b>Cas 4.</b> Un patient atteint de tuberculose urogénitale présente une hydronéphrose obstructive sous traitement. Quelle est la conduite ?</p>
<button data-ok="0">A. Attendre la fin du traitement antituberculeux avant de drainer.</button><button data-ok="1">B. Drainer sans retard (sonde urétérale JJ ou néphrostomie) pour prévenir l’insuffisance rénale, en poursuivant le traitement causal.</button><button data-ok="0">C. Pratiquer d’emblée une néphrectomie.</button><p class="fb" hidden>Réponse B. Le drainage ne doit pas être retardé. Le délai de chirurgie reconstructrice est individualisé après début du traitement médical, et la néphrectomie est réservée au rein détruit non fonctionnel symptomatique, à l’hypertension ou aux lésions diffuses.</p></div>
<button class="pareto-btn ui" data-k="pareto-n29-examens">▲ Loi de Pareto — Examens complémentaires</button>
</section>
