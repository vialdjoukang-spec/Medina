<section class="ilot" id="n29-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un homme de 28 ans, originaire d’Afrique subsaharienne et installé en Suisse depuis deux ans, consulte pour une hématurie survenue en fin de miction, une pollakiurie et des brûlures mictionnelles. La culture d’urine standard ne trouve aucun germe, alors que la bandelette révèle des leucocytes. Ces valeurs pédagogiques servent à poser la question centrale de la catégorie : quelle maladie générale se manifeste ici par le rein ou la voie urinaire ?</p>
<p>Deux hypothèses se disputent ce tableau. La <button class="w" data-k="n29-tb-hematogene">tuberculose urogénitale</button> donne classiquement une <button class="w" data-k="n29-pyurie-sterile">leucocyturie stérile</button>. La <button class="w" data-k="n29-schisto-cycle">schistosomiase urinaire</button> donne une hématurie terminale chez un migrant exposé à l’eau douce infestée. Le cours enseigne comment les départager, puis comment prendre en charge chacune, et il complète le tableau par deux atteintes plus rares : la syphilis tardive et la <button class="w" data-k="n29-cyst-gene">cystinose néphropathique</button>.</p>
<div class="key"><b>À retenir.</b> La catégorie N29 ne décrit pas une maladie rénale autonome. Elle décrit le rein et l’uretère <i>atteints par une maladie générale</i>, dont la cause doit toujours être nommée et traitée.</div>
</section>

<section class="ilot" id="n29-1"><h2><span class="n">1</span>Définition clinique et périmètre</h2><p>Une maladie générale peut altérer le rein par une infection du parenchyme, une inflammation et une obstruction des voies excrétrices, ou un défaut métabolique des cellules tubulaires. Cette leçon suit quatre situations : tuberculose urogénitale, schistosomiase urinaire, syphilis tardive et cystinose néphropathique. Leur point commun est une atteinte rénale ou urétérale dont la prise en charge exige d’identifier la cause.</p><p>Il faut d’emblée distinguer la lésion dominante : <b>obstacle</b> compromettant l’écoulement, <b>atteinte tubulaire</b> responsable de pertes urinaires, ou <b>atteinte glomérulaire</b> imposant un raisonnement néphrologique propre. Les glomérulopathies infectieuses sont expliquées pour cette distinction, sans les confondre avec toute manifestation urinaire. Le classement administratif détaillé est conservé après la conclusion clinique.</p><div class="key"><b>À retenir.</b> Partir du syndrome observé, rechercher son mécanisme, prouver sa cause et mesurer son retentissement : un intitulé de classification ne remplace aucune de ces étapes.</div><p>Sources : guide suisse de tuberculose 2024, EAU§3.16, RMS 2018 et recommandations cystinose 2026 ; périmètre de la classification conservé en annexe.</p></section>

<section class="ilot" id="n29-2"><h2><span class="n">2</span>Fréquence et contexte épidémiologique</h2>
<p>Les quatre maladies n’ont ni la même fréquence ni la même histoire. Il faut donc les considérer séparément, en précisant à chaque fois la population concernée.</p>
<h3>2.1 Tuberculose</h3>
<p>La tuberculose génito-urinaire représente <b>jusqu’à un quart des tuberculoses extrapulmonaires</b>. Plus de 90 % des cas surviennent dans les pays en développement, où elle est la deuxième forme extrapulmonaire. Elle touche environ deux hommes pour une femme, avec un âge médian proche de 40 ans. Le délai après l’infection pulmonaire peut dépasser 30 ans, et le risque de réactivation sur la vie est estimé jusqu’à 15 %. Ces chiffres proviennent d’une revue non systématique.</p>
<p>En <b>Suisse et au Liechtenstein</b>, 544 cas de tuberculose ont été déclarés en 2025 (<button class="w" data-k="n29-tb-epidemio">données du Bulletin</button>). Le taux de déclaration est passé de 4,8 à 6,0 pour 100 000 habitants, contre une moyenne européenne de 8,4 en 2024. Parmi ces cas, 268 étaient exclusivement pulmonaires, 238 pulmonaires et extrapulmonaires, et 32 exclusivement extrapulmonaires. Sur la période 2020–2025, la part exclusivement extrapulmonaire est de 4,2 %, et les poumons sont atteints chez 94 % des malades. En 2022,73 % des cas déclarés n’étaient pas d’origine suisse ; l’augmentation actuelle concerne surtout de jeunes personnes issues de la migration.</p>
<div class="trap"><span class="k">Lacune assumée</span> Le Bulletin de l’Office fédéral de la santé publique ne ventile pas les formes extrapulmonaires par organe. La fréquence suisse de la tuberculose urogénitale est donc inconnue ; aucun chiffre ne doit en être déduit des données étrangères.</div>
<h3>2.2 Schistosomiase</h3>
<p>Au moins 253,7 millions de personnes avaient besoin d’un traitement préventif en 2024. Dans la cohorte européenne citée ici, les données viennent d’un centre de dépistage de migrants ; elles ne décrivent ni toute l’Europe ni la population suisse. À Barcelone, entre 2014 et 2023,855 des 3214 migrants subsahariens dépistés avaient une schistosomiase (26,6 %) ; il s’agissait à 87 % d’hommes, d’âge médian 22 ans. Parmi les 213 cas confirmés, <i>S. haematobium</i> représentait 42,7 % des cas, <i>S. mansoni</i> 33,3 % et <i>S. intercalatum/guineensis</i> 21,6 %.</p>
<h3>2.3 Syphilis</h3>
<p>La Suisse a déclaré 1078 cas de syphilis en 2022 ; la déclaration est obligatoire. La syphilis tertiaire survient chez environ 10 % des patients non traités. L’atteinte rénale de la syphilis précoce est rare : le syndrome néphrotique touche environ 0,28 % des patients. Aucune fréquence n’est disponible pour une atteinte rénale tertiaire.</p>
<h3>2.4 Cystinose</h3>
<p>L’incidence est d’environ 0,5 à 1 pour 100 000 naissances. La cystinose est la cause la plus fréquente de <b>syndrome de Fanconi héréditaire</b> du jeune enfant. La forme infantile néphropathique représente environ 95 % des cas.</p>
<div class="key"><b>À retenir.</b> Chez un migrant avec symptômes urinaires, la tuberculose et la schistosomiase restent à évoquer ensemble ; la syphilis est une infection à déclaration obligatoire ; la cystinose se cherche chez l’enfant avec un syndrome de Fanconi.</div>
<button class="pareto-btn ui" data-k="pareto-n29-definition">▲ Loi de Pareto — Définition et fréquence</button>
</section>

<section class="ilot" id="n29-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le rein normal filtre le plasma, puis les tubules ajustent la composition du filtrat. Les urines sont ensuite évacuées par les cavités excrétrices, l’uretère et la vessie. Chacune des quatre maladies perturbe cette chaîne à un niveau différent : le parenchyme et les voies par une infection bactérienne, la paroi des voies basses par des œufs de parasite, le glomérule par des complexes immuns, le tubule proximal par une surcharge lysosomale.</p>
<figure id="n29-figure-clinical-kidney" data-n29-figure="kidney"><div data-n29-imagebox="kidney"><img src="assets/img/n29/alpha/codex/Kidney_section_vertical.png" width="417" height="700" loading="lazy" alt="Coupe humaine historique du rein normal avec cortex, pyramides, bassinet et uretère"><span data-n29-marker="kidney-1" aria-label="Repère1">1</span><span data-n29-marker="kidney-2" aria-label="Repère2">2</span><span data-n29-marker="kidney-3" aria-label="Repère3">3</span><span data-n29-marker="kidney-4" aria-label="Repère4">4</span></div><figcaption><b>Niveau rénal : repères normaux avant l’analyse des lésions</b><ol><li><b>1.</b> Cortex : repère du foyer initial décrit dans la tuberculose.</li><li><b>2.</b> Pyramide médullaire : distinguer la papille et son ouverture vers un calice.</li><li><b>3.</b> Bassinet : collecte les urines avant leur passage dans l’uretère.</li><li><b>4.</b> Uretère : voie d’écoulement, non représentée ici sur toute sa longueur.</li></ol><p>Planche anatomique normale historique ; aucune lésion tuberculeuse, sténose ou fonction rénale n’est représentée.</p><p>Original : Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 ; <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<h3>3.1 Tuberculose urogénitale</h3>
<p>La propagation est <button class="w" data-k="n29-tb-hematogene">hématogène</button> : le bacille atteint le rein à partir d’une tuberculose pulmonaire latente, parfois dès la primo-infection. Le foyer cortical cicatrise, puis se réactive souvent à partir d’un foyer unique, parfois des décennies plus tard. Les lésions des <button class="w" data-k="n29-papille">papilles</button> se caséifient, forment des cavités et s’ouvrent dans les voies excrétrices. Cette ouverture explique la présence de bacilles dans l’urine, donc la possibilité du diagnostic microbiologique urinaire.</p>
<p>Les bacilles descendent ensuite avec l’urine. Les <button class="w" data-k="n29-stenose-uretere">sténoses urétérales</button> siègent surtout aux jonctions urétéro-vésicale et pyélo-urétérale ; au scanner, le tiers distal est le siège le plus fréquent. La vessie s’enflamme d’abord autour du méat urétéral, puis, sans traitement, évolue vers la fibrose et la <button class="w" data-k="n29-vessie-retractee">petite vessie rétractée</button>. Au stade avancé, le parenchyme peut être remplacé par des calcifications : c’est l’<button class="w" data-k="n29-autonephrectomie">autonéphrectomie</button>. Une atteinte bilatérale peut conduire à l’insuffisance rénale.</p>
<div class="key"><b>À retenir.</b> Le rein tuberculeux s’atteint par le sang, mais les complications obstructives surviennent sur l’uretère et la vessie. Le dommage fonctionnel dépend donc autant de l’obstacle que de la destruction parenchymateuse.</div>
<h3>3.2 Schistosomiase urinaire</h3>
<p>La lésion élémentaire est le <button class="w" data-k="n29-granulome">granulome</button> formé autour de l’œuf piégé dans la paroi : il s’agit d’une réponse d’hypersensibilité de type IV. Les vers adultes eux-mêmes ne lèsent pas directement l’hôte. <i>S. haematobium</i> atteint la vessie, la partie basse des uretères, les vésicules séminales et, plus rarement, la prostate et le tractus génital féminin. Les vers gagnent l’appareil urinaire par des anastomoses veineuses mésentérico-périurétérales situées vers la troisième vertèbre lombaire. C’est pourquoi les lésions urétérales siègent typiquement dans la <b>moitié inférieure</b> des uretères (<button class="w" data-k="n29-uretere-bas">distribution des lésions</button>).</p>
<p>La <b>phase inflammatoire</b> forme des pseudotubercules, des nodules et des ulcérations. L’œdème de la jonction urétéro-vésicale peut créer une obstruction ou un reflux transitoires, <b>réversibles sous traitement antiparasitaire</b>. La <b>phase fibreuse</b> produit des plaques sablonneuses qui se calcifient (calcification vésicale linéaire), une cystite kystique, une rétraction vésicale, des troubles urodynamiques, une obstruction du col vésical et une urétérite kystique. L’uretère supérieur compense souvent par une dilatation-hypertrophie qui protège le rein.</p>
<p>La <button class="w" data-k="n29-schisto-obstruction">néphropathie obstructive</button> survient lorsque cette compensation échoue ou en présence d’un reflux ; l’infection ascendante l’aggrave. La <button class="w" data-k="n29-nic">néphrite interstitielle chronique</button> suit une triade précoce : défaut de concentration, perte sodée et acidose tubulaire. La surinfection bactérienne est fréquente, notamment à salmonelles en zone d’endémie, et les lithiases infectieuses sont fréquentes. Enfin, le <button class="w" data-k="n29-schisto-cancer">cancer de la vessie</button> est une complication tardive majeure.</p>
<h3>3.3 Syphilis tardive et rein</h3>
<p>La syphilis précoce correspond à une infection de moins d’un an, la syphilis tardive à une infection d’au moins un an selon la définition européenne, ou de durée inconnue (<button class="w" data-k="n29-syph-stades">stades</button>). La syphilis tertiaire comprend la forme gommeuse (nodules, plaques ou ulcères cutanés, muqueux ou viscéraux), la neurosyphilis tardive et la syphilis cardiovasculaire. La <button class="w" data-k="n29-syph-glomerulo">glomérulonéphrite</button> est possible dès la syphilis secondaire et dans la syphilis congénitale ; elle se code N08.0*. Dans la syphilis précoce, la lésion la plus fréquente est la glomérulonéphrite extramembraneuse, dont le mécanisme proposé est le dépôt sous-épithélial de complexes immuns contenant des antigènes tréponémiques.</p>
<div class="trap"><span class="k">Lacune du dossier</span> Aucune source lue ne décrit la gomme rénale ni l’atteinte rénale de la syphilis tertiaire proprement dite. Le cours ne peut affirmer ni sa fréquence ni sa présentation ; il décrit ce que la littérature lue documente (la glomérulopathie) en signalant son code distinct.</div>
<h3>3.4 Cystinose néphropathique</h3>
<p>La cystinose est une maladie lysosomale <b>autosomique récessive</b>, due à des variants bialléliques du gène <i>CTNS</i> (17p13.2), qui code la <b>cystinosine</b>, un symport cystine/proton lysosomal (<button class="w" data-k="n29-cyst-gene">génétique et biochimie</button>). Le défaut d’efflux lysosomal de la cystine conduit à son accumulation et à la formation de cristaux dans la plupart des tissus. La fonction tubulaire est préservée à la naissance ; le <button class="w" data-k="n29-fanconi">syndrome de Fanconi</button> débute vers 4 à 6 mois (6 à 12 mois selon une autre source). La cystéamine ne corrige généralement pas les lésions tubulaires déjà installées. Les recommandations 2026 rapportent toutefois qu’un début très précoce, dans les deux premiers mois de vie, peut fortement atténuer le syndrome de Fanconi ; il faut donc éviter une négation absolue de ce bénéfice précoce (Hohenfellner et al., 2026, diagnostic et encadrés 1–3).</p>
<div class="key"><b>À retenir.</b> Le même niveau d’atteinte (le rein) recouvre quatre mécanismes : dissémination bactérienne, granulome d’œuf, complexes immuns, accumulation lysosomale. Le traitement ne se déduit donc jamais du code, mais de la maladie causale.</div>
<button class="pareto-btn ui" data-k="pareto-n29-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="n29-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes de N29 sont les maladies générales elles-mêmes. Pour chacune, le terrain oriente la probabilité avant tout examen.</p>
<table class="t"><thead><tr><th>Maladie causale</th><th>Terrain et facteurs de risque</th><th>Ce que le terrain change</th></tr></thead><tbody><tr><td>Tuberculose urogénitale</td><td>Origine d’un pays à forte incidence ; antécédent de tuberculose (environ un tiers des patients extrapulmonaires) ; insuffisance rénale chronique et diabète, cités parmi les situations à risque de progression</td><td>Elle justifie de chercher une tuberculose chez un migrant avec symptômes urinaires, même sans signe pulmonaire</td></tr><tr><td>Schistosomiase urinaire</td><td>Contact avec de l’eau douce infestée en zone d’endémie ; en Europe, migrants subsahariens, surtout des hommes jeunes</td><td>Elle justifie la recherche d’œufs dans l’urine et une sérologie chez un migrant exposé</td></tr><tr><td>Syphilis tardive</td><td>Infection non traitée d’au moins un an ou de durée inconnue ; la syphilis tertiaire survient chez environ 10 % des patients non traités</td><td>Elle justifie une sérologie devant toute atteinte multisystémique compatible</td></tr><tr><td>Cystinose</td><td>Transmission autosomique récessive, deux variants du gène <i>CTNS</i></td><td>Elle justifie le dosage de la cystine leucocytaire devant un syndrome de Fanconi du jeune enfant</td></tr></tbody></table>
<p>Le tableau associe à chaque maladie un terrain précis. Ce terrain ne remplace pas le diagnostic : il hiérarchise seulement les hypothèses. Une absence de facteur de risque ne dispense pas du bilan lorsque le tableau clinique est évocateur.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Attribuer une hématurie ou une leucocyturie stérile à une cause banale parce que le patient est « sans antécédent ». Dans la tuberculose urogénitale, le délai entre l’infection pulmonaire et l’atteinte rénale peut dépasser 30 ans : l’absence d’antécédent connu n’exclut rien.</div>
<button class="pareto-btn ui" data-k="pareto-n29-causes">▲ Loi de Pareto — Causes et terrain</button>
</section>

<section class="ilot" id="n29-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord la maladie causale, car l’atteinte rénale en est la conséquence. Il établit l’origine géographique, les séjours, le contact avec l’eau douce, les antécédents infectieux, l’âge de début des symptômes chez l’enfant et les traitements déjà reçus.</p>
<div class="two"><div class="card"><h4>Tuberculose urogénitale</h4><p>La tuberculose rénale est souvent <b>asymptomatique</b> malgré des lésions importantes. Les premiers signes sont souvent des symptômes urinaires bas non spécifiques ou une <button class="w" data-k="n29-pyurie-sterile">leucocyturie stérile</button>, avec ou sans <button class="w" data-k="n29-hematurie">hématurie</button>.</p>
<p>L’atteinte vésicale donne hématurie, pollakiurie, dysurie et douleurs abdominales, lombaires ou sus-pubiennes. Chez l’homme, on peut trouver une masse scrotale ou épididymaire ; chez la femme, des troubles menstruels ou des douleurs pelviennes.</p>
</div><div class="card"><h4>Schistosomiase urinaire</h4><p>Le signe classique est l’<b>hématurie terminale</b>, avec pollakiurie et dysurie. En Europe, la maladie est le plus souvent <b>silencieuse</b> : 2,2 % des migrants infectés étaient symptomatiques (hématurie 1,8 %, dysurie 1,6 %).</p>
<p>Les formes génitales féminines donnent des lésions génitales, des saignements, une dyspareunie et des nodules vulvaires ; chez l’homme, des douleurs éjaculatoires, une hémospermie et une infertilité possible. Elles augmentent le risque d’infection par le virus de l’immunodéficience humaine.</p>
</div></div>
<div class="two"><div class="card"><h4>Syphilis tardive</h4><p>Le dossier ne décrit pas de symptôme rénal propre à la syphilis tardive. L’interrogatoire cherche le contexte : infection de plus d’un an, ou de durée inconnue, antécédents de syphilis non traitée ou traitée de manière incertaine, manifestations cutanées, neurologiques ou cardiovasculaires.</p>
<p>Dans la syphilis précoce, un syndrome néphrotique (œdèmes) oriente vers la glomérulopathie, qui se code N08.0*.</p>
</div><div class="card"><h4>Cystinose néphropathique</h4><p>L’enfant présente une polyurie, une polydipsie, un retard de croissance, des vomissements, une constipation, une déshydratation et un rachitisme. Au moins 50 % des enfants sont diagnostiqués après l’âge d’un an.</p>
<p>Chez l’adolescent ou l’adulte, l’histoire peut être plus discrète : photophobie, érosions cornéennes, protéinurie isolée ou Fanconi atténué selon la forme.</p>
</div></div>
<div class="key"><b>À retenir.</b> Une hématurie en fin de miction chez un migrant évoque la schistosomiase ; une leucocyturie stérile oriente vers la tuberculose ; un retard de croissance avec polyurie chez le nourrisson oriente vers la cystinose. Aucun de ces signes ne suffit sans confirmation biologique.</div>
</section>

<section class="ilot" id="n29-6"><h2 data-semiology-clinical="N29"><span class="n">6</span>Examen clinique</h2>
<p>L’examen commence par l’état général et les signes vitaux, puis recherche les signes de la maladie causale et ceux de l’atteinte urinaire. Les constatations sont généralement pauvres ; c’est l’orientation par le terrain qui donne leur valeur aux examens complémentaires.</p>
<div class="two"><div class="card"><h4>Tuberculose</h4><p>L’examen peut être normal, car la tuberculose rénale est souvent asymptomatique. Chez l’homme, on palpe le scrotum et l’épididyme (masse) et on inspecte le pénis (ulcération) ; chez la femme, on recherche une douleur pelvienne.</p>
<p>Une douleur lombaire ou sus-pubienne, rapportée par le patient ou provoquée à la palpation, oriente vers l’atteinte vésicale ou urétérale.</p>
</div><div class="card"><h4>Schistosomiase</h4><p>Elle est le plus souvent silencieuse à l’examen. On recherche l’hématurie macroscopique et les signes de retentissement obstructif ou génital (nodules vulvaires, hémospermie).</p>
<p>La bandelette urinaire détecte l’hématurie microscopique, quasi constante chez l’enfant infecté par <i>S. haematobium</i>.</p>
</div></div>
<div class="two"><div class="card"><h4>Syphilis</h4><p>L’examen cherche les stigmates de syphilis tertiaire : lésions gommeuses cutanées ou muqueuses, signes neurologiques et cardiovasculaires. Les œdèmes orientent vers un syndrome néphrotique.</p>
<p>Un examen normal n’exclut pas la maladie.</p>
</div><div class="card"><h4>Cystinose</h4><p>L’examen mesure la croissance et la taille, recherche un rachitisme (signes osseux, douleurs osseuses), une déshydratation et une photophobie. À la bandelette : faible densité, glycosurie et albuminurie modérée.</p>
<p>La créatinine est souvent normale chez le jeune enfant : la fonction glomérulaire préservée ne signifie pas l’absence de maladie tubulaire.</p>
</div></div>
<div class="trap"><span class="k">Piège</span> Un examen clinique normal est fréquent dans ces quatre maladies. La décision d’explorer repose sur le terrain (origine, contact avec l’eau douce, âge de l’enfant) et sur les anomalies urinaires.</div>
<figure id="n29-figure-clinical-bladder" data-n29-figure="bladder"><div data-n29-imagebox="bladder"><img src="assets/img/n29/alpha/codex/2604_Nerves_Innervating_the_Urinary_SystemN.jpg" width="1738" height="1265" loading="lazy" alt="Coupe sagittale humaine du pelvis féminin normal situant vessie et organes voisins"><span data-n29-marker="bladder-1" aria-label="Repère1">1</span><span data-n29-marker="bladder-2" aria-label="Repère2">2</span><span data-n29-marker="bladder-3" aria-label="Repère3">3</span></div><figcaption><b>Bas appareil : situer les symptômes, sans inférer la cause</b><ol><li><b>1.</b> Vessie : repère anatomique des symptômes du bas appareil.</li><li><b>2.</b> Utérus : organe voisin postéro-supérieur sur cette coupe.</li><li><b>3.</b> Os pubien : repère antérieur ; la vessie est située en arrière.</li></ol><p>Illustration normale du pelvis féminin et de son innervation ; ni sténose urétérale, ni granulome, ni reflux ne sont représentés.</p><p>Original : OpenStax College, Anatomy & Physiology, 2013 ; <a href="https://commons.wikimedia.org/wiki/File:2604_Nerves_Innervating_the_Urinary_SystemN.jpg" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure><div class="key"><b>À retenir.</b> L’examen oriente, il ne confirme pas : la confirmation est biologique (urine, sérologie, cystine leucocytaire) ou génétique.</div>

<section class="ilot" id="n29-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>Le diagnostic poursuit deux buts successifs. Il identifie d’abord la <b>maladie causale</b> (bacille, parasite, tréponème ou défaut génétique), puis il mesure son <b>retentissement</b> sur le rein, l’uretère et la vessie. Un code à astérisque ne se pose qu’après ces deux étapes.</p>
<table class="t"><thead><tr><th>Maladie évoquée</th><th>Test qui oriente</th><th>Test qui confirme</th><th>Limite à connaître</th></tr></thead><tbody><tr><td>Tuberculose urogénitale</td><td><button class="w" data-k="n29-pyurie-sterile">Leucocyturie stérile</button> ; <button class="w" data-k="n29-uroscanner">uro-scanner</button></td><td><button class="w" data-k="n29-tb-culture">Culture urinaire</button> et/ou <button class="w" data-k="n29-taan">amplification génique</button> sur un prélèvement biologique</td><td>L’examen direct est peu sensible (environ 20 %) ; un <button class="w" data-k="n29-igra">test immunologique</button> positif ne distingue pas infection et maladie</td></tr><tr><td>Schistosomiase urinaire</td><td>Hématurie terminale ; bandelette</td><td><button class="w" data-k="n29-schisto-urine">Œufs dans l’urine</button> (filtration)</td><td>En Europe, la microscopie urinaire n’est positive que dans 11,5 % des cas ; la <button class="w" data-k="n29-schisto-serologie">sérologie</button> ne distingue pas infection active et ancienne</td></tr><tr><td>Syphilis tardive</td><td>Histoire de l’infection, sérologie et recherche de manifestations ; la forme tardive peut être latente</td><td>Diagnostic sérologique, datation (au moins un an ou durée inconnue pour la forme tardive), puis évaluation de la lésion et du lien causal</td><td>Aucun critère rénal spécifique n’a été trouvé dans les sources lues</td></tr><tr><td>Cystinose</td><td>Syndrome de Fanconi du jeune enfant</td><td><button class="w" data-k="n29-cyst-cystine">Cystine leucocytaire</button>, cristaux cornéens, <button class="w" data-k="n29-cyst-gene">variants du gène CTNS</button></td><td>Au moins 50 % des enfants sont diagnostiqués après l’âge d’un an</td></tr></tbody></table>
<p>Le tableau sépare deux niveaux de preuve. Le test qui oriente justifie de poursuivre ; le test qui confirme autorise le traitement et la déclaration. Les limites de chaque examen expliquent pourquoi un résultat négatif isolé n’exclut pas la maladie.</p>
<h3>7.1 Diagnostic différentiel, hiérarchisé par gravité</h3>
<ul><li><b>Carcinome urothélial</b>, devant des lacunes urétérales ou pyéliques à l’imagerie : les lacunes de la tuberculose peuvent le simuler, et la schistosomiase est elle-même associée au cancer de la vessie.</li><li><b>Cancer</b>, devant une hyperfixation à la tomographie par émission de positons au fluorodésoxyglucose : cet examen ne distingue pas la tuberculose d’un cancer.</li><li><b>Schistosomiase urinaire</b>, chez le migrant d’Afrique subsaharienne avec hématurie et calcifications vésicales : elle est à distinguer de la tuberculose urogénitale, qui peut coexister dans la même population.</li><li><b>Glomérulopathie</b> d’une syphilis ou d’une schistosomiase : elle se code N08.0* et non N29.</li></ul>
<div class="trap"><span class="k">Piège</span> Une masse ou une lacune des voies urinaires chez un migrant n’est pas forcément un cancer. Écarter une tuberculose avant une chirurgie lourde évite une intervention inutile ; inversement, une calcification vésicale chez un patient exposé à la schistosomiase impose de rechercher un cancer.</div>
<div class="key"><b>À retenir.</b> Le bilan diagnostique associe toujours la maladie générale (microbiologie, sérologie, dosage) et l’imagerie des voies urinaires. L’un sans l’autre ne permet ni le traitement causal ni la prévention de l’insuffisance rénale.</div>
<button class="pareto-btn ui" data-k="pareto-n29-diagnostic">▲ Loi de Pareto — Diagnostic</button>
</section>

<section class="ilot" id="n29-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><b>Gravité d’abord.</b> Dans cette catégorie, l’urgence est l’<b>obstacle sur les voies urinaires</b> : en cas d’hydronéphrose obstructive d’une tuberculose urogénitale, la sonde urétérale (JJ) ou la néphrostomie ne doit pas être retardée, afin de prévenir l’insuffisance rénale. Les autres menaces sont la toxicité des traitements (névrite optique de l’éthambutol, atteinte hépatique), la réaction de Jarisch-Herxheimer de la syphilis tardive et, dans la schistosomiase, le cancer de la vessie.</div>
<table class="t"><thead><tr><th>Complication</th><th>Maladie</th><th>Pourquoi elle survient</th><th>Réponse</th></tr></thead><tbody><tr><td>Hydronéphrose obstructive</td><td>Tuberculose ; schistosomiase</td><td>Sténose urétérale fibreuse (tuberculose) ou œdème puis fibrose de la jonction urétéro-vésicale (schistosomiase)</td><td>Drainage sans retard ; traitement causal</td></tr><tr><td>Insuffisance rénale</td><td>Tuberculose bilatérale ; schistosomiase ; cystinose</td><td>Destruction parenchymateuse, obstruction, néphrite interstitielle ou atteinte tubulaire progressive</td><td>Traitement causal, adaptation des médicaments, suppléance au stade terminal</td></tr><tr><td>Petite vessie rétractée</td><td>Tuberculose</td><td>Fibrose vésicale après inflammation non traitée</td><td>Prévention par le traitement précoce ; chirurgie reconstructrice</td></tr><tr><td>Cancer de la vessie</td><td>Schistosomiase</td><td>Association documentée ; carcinome épidermoïde dans environ 60 % des séries historiques, urothélial majoritaire dans une série égyptienne récente</td><td>Suspecter devant une nécrurie ou une modification des symptômes de cystite chronique</td></tr><tr><td>Névrite optique rétrobulbaire</td><td>Traitement antituberculeux</td><td>Éthambutol, d’élimination surtout rénale</td><td>Contrôle ophtalmologique avant et pendant le traitement</td></tr><tr><td>Réaction de Jarisch-Herxheimer</td><td>Syphilis tardive</td><td>Réaction survenant après le début du traitement antibiotique ; rare dans la syphilis tardive mais grave si un site stratégique est atteint</td><td>Prophylaxie à discuter dans les formes à risque ; surveillance hospitalière, preuve limitée</td></tr></tbody></table>
<p>Le tableau relie chaque complication à son mécanisme et à sa réponse. Il montre que deux complications relèvent du traitement lui-même (névrite optique, Jarisch-Herxheimer) La surveillance permet de repérer leur survenue et d’adapter la prise en charge ; elle ne garantit pas leur prévention.</p>
<div class="key"><b>À retenir.</b> Devant une hydronéphrose chez un patient atteint de tuberculose urogénitale, le drainage prime sur l’attente de la réponse au traitement antituberculeux.</div>
<button class="pareto-btn ui" data-k="pareto-n29-urgences">▲ Loi de Pareto — Urgences</button>
</section>

<section class="ilot" id="n29-9"><h2><span class="n">9</span>Prise en charge causale et soutien</h2>
<p>Le traitement vise la maladie causale, puis traite les conséquences urinaires. La hiérarchie est identique pour les quatre maladies : 1. traiter la cause ; 2. lever l’obstacle ; 3. soutenir la fonction rénale ; 4. surveiller et prévenir.</p>
<h3>9.1 Tuberculose urogénitale</h3>
<p>Le <b>schéma standard suisse</b> est <button class="w" data-k="n29-tb-schema">2 HRZE / 4 HR</button> : isoniazide, rifampicine, pyrazinamide et éthambutol quotidiennement pendant 2 mois, puis isoniazide et rifampicine pendant 4 mois. Toutes les formes de tuberculose reçoivent ce schéma, sauf les exceptions listées (méningite, péricardite, tuberculose à <i>M. bovis</i>, etc.). Les doses de l’Organisation mondiale de la santé chez l’adulte sont, en mg/kg/jour : isoniazide 5, rifampicine 10, pyrazinamide 25, éthambutol 15. On utilise des associations à dose fixe, avec de la pyridoxine, en une seule prise matinale, de préférence à jeun ou avec un repas pauvre en graisses.</p>
<p>Avant le traitement, il faut faire les prélèvements, évaluer le risque de résistance à la rifampicine, faire un test pour le virus de l’immunodéficience humaine, évaluer les fonctions hépatique et rénale et dresser la liste des médicaments. En cas d’<b>insuffisance rénale</b>, la clairance de la créatinine inférieure à 30 mL/min conduit à donner l’éthambutol et le pyrazinamide trois fois par semaine (<button class="w" data-k="n29-tb-ir">contentieux de sources sur le pyrazinamide</button>).</p>
<p>Un obstacle menaçant la fonction rénale demande un drainage sans attendre l’effet des antibiotiques. Les séries citées par l’EAU rapportent un recours chirurgical chez plus de 50 % des patients, mais ce chiffre descriptif ne constitue pas une indication automatique. Le siège, le dommage et la réponse médicale guident le geste ; les délais proposés de chirurgie reconstructrice vont de deux à six semaines à plusieurs mois, sans règle universelle validée. Source : EAU, §3.16.4.</p>
<p>La <b>déclaration</b> est obligatoire pour tout cas traité par au moins trois antituberculeux, ainsi que celle du résultat du traitement (<button class="w" data-k="n29-tb-decla">déclaration et enquête d’entourage</button>).</p>
<h3>9.2 Schistosomiase urinaire</h3>
<p>Pour la schistosomiase à <i>S. haematobium</i>, la revue suisse RMS 2018 propose du <button class="w" data-k="n29-praziquantel">praziquantel</button>, 40 mg/kg par voie orale en prise unique, répétée après quatre semaines. Le RCP français Biltricide® décrit cette dose unique pour cette espèce, avec prise pendant ou après un repas ; les doses diffèrent pour certaines autres espèces. Une exposition très récente ou un syndrome de Katayama exige une discussion spécialisée, car les formes immatures sont peu sensibles au médicament. Les lésions inflammatoires peuvent régresser ; une fibrose fixée ne doit pas être considérée comme réversible par le seul traitement antiparasitaire. Les gestes urologiques se discutent selon l’obstacle persistant et son retentissement.</p>
<div class="trap"><span class="k">Lacune suisse</span> Aucune information professionnelle suisse de praziquantel n’a été trouvée (Biltricide® absent de la base consultée), et la disponibilité en Suisse n’est pas documentée. La revue suisse RMS 2018 et le RCP français Biltricide® ont été relus dans cette reprise. La pharmacie doit confirmer le produit et les modalités d’accès ; l’absence de résultat dans une base ne prouve pas l’indisponibilité.</div>
<h3>9.3 Syphilis tardive</h3>
<p>La première intention chez l’adulte atteint de syphilis tardive, sans atteinte neurologique, oculaire ou otique, est la <button class="w" data-k="n29-extencilline">benzathine benzylpénicilline</button> : Extencilline® 2,4 millions d’unités par voie intramusculaire profonde une fois par semaine pendant trois semaines. L’IUSTI 2020 mentionne la pénicilline procaïne 600 000 unités par jour pendant 17 à 21 jours comme alternative historique ; aucun produit suisse correspondant n’a été vérifié ici. La HAS 2025 propose une autre voie en cas d’indisponibilité : doxycycline pendant 28 jours, hors grossesse et atteinte neurologique. Chez l’adulte non enceinte allergique à la pénicilline, la FI suisse Doxycyclin-Mepha® prévoit 100 mg par voie orale deux fois par jour pendant quatre semaines. Certains contextes demandent une désensibilisation spécialisée. L’azithromycine est exclue par l’IUSTI.</p>
<p>La <button class="w" data-k="n29-syph-jh">réaction de Jarisch-Herxheimer</button> est rare dans la syphilis tardive mais peut être grave si un site stratégique est atteint. En cas d’atteinte cardiovasculaire ou neurologique, une prophylaxie par prednisolone peut être discutée par l’équipe spécialisée : la HAS 2025 cite 20 à 60 mg/jour pendant 3 jours, débutés 24 heures avant l’antibiotique, sur avis d’experts et avec un faible niveau de preuve. Cette mesure n’est ni systématique ni une garantie de prévention ; ces atteintes nécessitent une surveillance hospitalière. Le patient reste sous surveillance 30 minutes après l’injection, et les partenaires sont recherchés sur une période plus longue.</p>
<h3>9.4 Cystinose néphropathique</h3>
<p>Le traitement spécifique est la <button class="w" data-k="n29-procysbi">cystéamine</button> : Procysbi® à libération retardée, dose d’entretien de 1,3 g/m²/jour en deux prises espacées de douze heures, maximum 1,95 g/m²/jour. Commencer à un sixième à un quart de la dose cible, puis augmenter toutes les quatre à six semaines, ou toutes les deux semaines entre un et six ans selon la FI. Pour les leucocytes mixtes, la cible est inférieure à 1 nmol d’hémicystine/mg de protéine, avec prélèvement 30 minutes après la dose du matin, soit 12,5 heures après celle du soir. Le laboratoire précise la cible de toute autre méthode. <button class="w" data-k="n29-cystadrops">Cystadrops®</button>, une goutte par œil quatre fois par jour chez l’enfant de plus de six mois et chez l’adulte, traite les dépôts cornéens ; la cystéamine orale ne suffit pas pour l’œil.</p>
<p>Le soutien comprend nutrition adaptée, accès libre à l’eau et compensation individualisée des pertes hydriques, électrolytiques et de bicarbonate. Les recommandations 2026 discutent l’indométacine chez certains jeunes enfants dont le Fanconi reste incontrôlé ; l’arrêter si les pertes sont maîtrisées ou si la fonction rénale baisse, et ne pas l’associer aux inhibiteurs de l’enzyme de conversion ou antagonistes de l’angiotensine II. Ces derniers ne constituent pas une néphroprotection systématique dans la cystinose ; leur indication dépend notamment de l’hypertension ou d’une protéinurie glomérulaire. La prise en charge spécialisée de la croissance et de l’os peut associer hormone de croissance, phosphate, vitamine D active, correction de l’acidose et physiothérapie. La transplantation est le traitement de choix au stade terminal, sans supprimer le besoin de cystéamine systémique.</p>
<div class="key"><b>À retenir.</b> Un traitement causal précoce change le pronostic : cystéamine pour retarder l’insuffisance rénale terminale de 6 à 10 ans, schéma antituberculeux complet de 6 mois, praziquantel avant la fibrose, pénicilline pour la syphilis.</div>
<button class="pareto-btn ui" data-k="pareto-n29-traitement">▲ Loi de Pareto — Prise en charge</button>
</section>

<section class="ilot" id="n29-10"><h2><span class="n">10</span>Surveillance, récupération et prévention</h2>
<table class="t"><thead><tr><th>Maladie</th><th>Suivi proposé</th><th>Source et limite</th></tr></thead><tbody><tr><td>Tuberculose urogénitale</td><td>Rechute dans 6,3 à 22 % des cas, même après 12 mois de traitement (2 à 6 % pour la forme pulmonaire) ; rechute en moyenne vers 5 ans (de 11 mois à 27 ans) ; surveillance jusqu’à 10 ans proposée</td><td>Revue non systématique ; aucun protocole standard</td></tr><tr><td>Traitement antituberculeux</td><td>Fonction hépatique avant traitement puis toutes les 2 à 4 semaines ; contrôle ophtalmologique (acuité, champ visuel, vision des couleurs) avant puis toutes les 4 semaines sous éthambutol, chaque semaine si insuffisance rénale</td><td>Informations professionnelles suisses</td></tr><tr><td>Schistosomiase</td><td>Après traitement à Barcelone : urine 8/60 positive, éosinophilie 13/43 persistante, sérologie 74/88 positive, échographie 12/23 encore anormale ; populations et délais différents, sans équivalence avec un échec</td><td>Suivi de cohorte descriptif ; conduite clinique suisse RMS 2018 détaillée ci-dessous</td></tr><tr><td>Syphilis tardive</td><td>Surveillance 30 minutes après l’injection ; recherche des partenaires sur une période plus longue</td><td>Recommandation européenne 2020</td></tr><tr><td>Cystinose</td><td>Cystine des leucocytes mixtes 30 minutes après la dose matinale de Procysbi® (12,5 heures après celle du soir), croissance, atteinte osseuse, hypothyroïdie, diabète ; transition pédiatrie–adulte organisée</td><td>Recommandations 2026, sections complètes relues ; FI suisse Procysbi® pour méthode et horaire</td></tr></tbody></table>
<p>Le suivi tient à un constat de fond : la guérison microbiologique ou parasitaire n’est pas la guérison des lésions. Après la schistosomiase, la sérologie reste positive dans la majorité des cas et ne mesure donc pas l’efficacité du traitement. Après la tuberculose urogénitale, des rechutes tardives justifient une surveillance prolongée.</p>
<div class="key"><b>À retenir.</b> Le suivi de la tuberculose urogénitale s’étend sur des années ; celui de la cystinose est à vie, la cystéamine se poursuivant même après la greffe.</div>
</section>

<section class="ilot" id="n29-11"><h2><span class="n">11</span>Situations particulières</h2>
<div class="two"><div class="card"><h4>Insuffisance rénale et antituberculeux</h4><p>Si la clairance de la créatinine est inférieure à 30 mL/min, le guide suisse propose l’éthambutol et le pyrazinamide trois fois par semaine ; cette proposition doit être confrontée aux FI, notamment à la contre-indication de Pyrazinamide Labatec® sous 50 mL/min et de Rifater® sous 30 mL/min ; l’éthambutol peut être omis en l’absence de résistance. En hémodialyse, tous les médicaments se donnent après la séance.</p>
<p>L’isoniazide a provoqué un syndrome cérébelleux, surtout chez les insuffisants rénaux chroniques.</p>
</div><div class="card"><h4>Grossesse et allaitement</h4><p>Le RCP français Biltricide® autorise le praziquantel pendant la grossesse si cela est cliniquement justifié ; il demande, pour un traitement court, d’interrompre l’allaitement le jour du traitement et durant les 24 heures suivantes. Confirmer le produit effectivement disponible en Suisse. La cystéamine (Procysbi®) est contre-indiquée pendant l’allaitement.</p>
<p>Dans la syphilis, les partenaires sont recherchés selon la recommandation européenne.</p>
</div></div>
<div class="two"><div class="card"><h4>Allergie à la pénicilline</h4><p>La doxycycline 100 mg par voie orale deux fois par jour pendant 28 jours chez l’adulte non enceinte allergique aux pénicillines, selon Doxycyclin-Mepha® et HAS 2025 est l’alternative ; certains spécialistes préfèrent la désensibilisation. L’azithromycine est exclue.</p>
<p>Le choix confronte la FI du produit suisse exact à la HAS 2025 et à l’IUSTI 2020 ; les formulations de pénicilline ne sont pas interchangeables. En cas de grossesse, de signes neurologiques, oculaires ou auditifs, demander un avis spécialisé plutôt que transposer cette alternative orale.</p>
</div><div class="card"><h4>Cystinose chez l’adulte ou après greffe</h4><p>Le syndrome de Fanconi ne récidive pas dans le greffon et la survie du greffon est meilleure, mais la cystéamine se poursuit à vie car la cystine s’accumule dans la plupart des tissus.</p>
<p>La transition pédiatrie–adulte doit être organisée.</p>
</div></div>
<p>Ces situations ont en commun de modifier la dose, la voie ou la durée d’un traitement sans en changer l’objectif. L’adaptation se justifie par le mécanisme d’élimination du médicament (rénal pour l’éthambutol), par le terrain (grossesse) ou par la persistance de la maladie dans d’autres organes (cystinose).</p>
<div class="key"><b>À retenir.</b> Chaque situation particulière modifie le <i>comment</i> du traitement, jamais le <i>pourquoi</i>. Vérifier l’information professionnelle suisse du produit avant toute adaptation.</div>
<button class="pareto-btn ui" data-k="pareto-n29-suivi">▲ Loi de Pareto — Suivi et situations particulières</button>
</section>

<section class="ilot" id="n29-12"><h2><span class="n">12</span>Critères officiels et paramètres décisifs</h2>
<div class="alert"><b>Critères formels du diagnostic.</b> <b>Tuberculose</b> (N29.1*) : identification d’une espèce du complexe <i>M. tuberculosis</i> dans un prélèvement biologique, par culture et/ou amplification génique ; pour l’urine, trois urines du matin. <b>Schistosomiase</b> (N29.1*) : œufs dans l’urine (preuve) ; une sérologie isolée définit un cas « probable » dans l’étude de Barcelone. <b>Atteinte rénale et syphilis tardive</b> : une infection d’au moins un an ou de durée inconnue peut être latente, sans manifestation tertiaire. N29.0* désigne une manifestation rénale, pas toute sérologie de syphilis tardive chez un patient néphrologique. Il faut démontrer l’infection, caractériser la lésion et discuter leur lien causal ; aucun critère rénal tertiaire validé n’a été trouvé dans les recommandations consultées. <b>Cystinose</b> (N29.8*) : cystine leucocytaire supérieure à 2 nmol d’hémicystine/mg, cristaux cornéens, variants de <i>CTNS</i>.</div>
<table class="t"><thead><tr><th>Paramètre</th><th>Repère utile</th><th>Décision ou limite</th></tr></thead><tbody><tr><td>Tuberculose en Suisse et au Liechtenstein, 2025</td><td>544 cas ; 6,0 pour 100 000 ; 4,2 % exclusivement extrapulmonaires (2020–2025)</td><td>Fréquence suisse de la forme urogénitale inconnue</td></tr><tr><td>Schéma antituberculeux</td><td>2 HRZE / 4 HR ; mg/kg : H 5, R 10, Z 25, E 15</td><td>Toutes formes, sauf exceptions listées</td></tr><tr><td>Culture urinaire</td><td>Sensibilité variable : 80–90 % dans la revue 2021, mais 23,3–30 % dans les études de tuberculose rénale citées par l’EAU ; spécificité 92–100 % selon l’EAU ; trois urines du matin</td><td>Culture positive après au moins 9–10 jours en milieu liquide</td></tr><tr><td>Examen direct urinaire</td><td>Sensibilité environ 20 %, spécificité environ 97 %</td><td>Un résultat négatif n’exclut pas</td></tr><tr><td>Rechute tuberculose urogénitale</td><td>6,3 à 22 % ; surveillance jusqu’à 10 ans</td><td>Aucun protocole standard</td></tr><tr><td>Schistosomiase chez les migrants</td><td>Microscopie urinaire positive 11,5 % ; sérologie 98,8 % ; praziquantel 40 mg/kg</td><td>Sérologie : ne distingue pas infection active et ancienne</td></tr><tr><td>Syphilis tardive</td><td>Benzathine pénicilline 2,4 millions d’unités aux jours 1, 8 et 15</td><td>Hors neurosyphilis pour l’information suisse</td></tr><tr><td>Cystinose</td><td>Cible < 1 nmol d’hémicystine/mg ; Procysbi® 1,3 g/m²/jour (maximum 1,95) ; insuffisance rénale terminale vers 10–12 ans sans traitement</td><td>Traitement précoce : retard d’environ 6 à 10 ans</td></tr></tbody></table>
<p>Le tableau distingue les critères de diagnostic, les repères d’organisation du traitement et les limites des examens. Une valeur seule ne remplace pas le contexte clinique ni la source qui l’établit.</p>
<div class="key"><b>À retenir.</b> Pour chaque sous-code, la maladie causale est nommée avec sa preuve : bacille en culture ou amplification génique, œufs dans l’urine, syphilis documentée et lésion d’organe caractérisée sans confondre forme tardive et forme tertiaire, cystine leucocytaire élevée avec variants de <i>CTNS</i>.</div>
</section>

<div class="src"><p>Références héritées de la livraison du 14 octobre 2026, conservées avec leur attribution ; les relectures ciblées du 2 novembre sont précisées dans les paragraphes et le registre de sources : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n25-n29.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc N25–N29</a>; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n00-n08.htm" target="_blank" rel="noopener">CIM-10-GM 2024, N08.0*</a>; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n10-n16.htm" target="_blank" rel="noopener">CIM-10-GM 2024, N16.3*</a>; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a50-a64.htm" target="_blank" rel="noopener">CIM-10-GM 2024, A52.7</a>; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Guide suisse « Tuberculose en Suisse », OFSP et Ligue pulmonaire suisse, version 1.2024</a>; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener">Bulletin OFSP, La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025</a>; <a href="https://www.guidelines.fmh.ch/pdfs/f37e3a6a4d278af20655207d1a472f93-fr.pdf" target="_blank" rel="noopener">Fiche FMH, La tuberculose en Suisse</a>; <a href="https://doi.org/10.3390/antibiotics10111399" target="_blank" rel="noopener">Mantica et collaborateurs, Antibiotics 2021; 10:1399 (revue de la tuberculose génito-urinaire)</a>; <a href="https://doi.org/10.1016/j.jare.2012.08.004" target="_blank" rel="noopener">Barsoum, J Adv Res 2013; 4:453-9 (revue de la schistosomiase urinaire)</a>; <a href="https://doi.org/10.1186/s40249-026-01415-y" target="_blank" rel="noopener">Étude rétrospective de Barcelone 2014–2023, Infect Dis Poverty 2026</a>; <a href="https://www.who.int/news-room/fact-sheets/detail/schistosomiasis" target="_b
