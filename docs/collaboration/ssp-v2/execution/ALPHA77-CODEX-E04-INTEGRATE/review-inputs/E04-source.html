<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e04-e-1"><h2><span class="n">e-1</span>Échographie : risque, dimensions et ganglions</h2><table class="t" data-e04-table="1"><thead><tr><th>Catégorie adulte</th><th>Description résumée</th><th>Ponction dans le guide 2023</th></tr></thead><tbody><tr><td><button class="w" data-k="e04-tirads">EU-TIRADS</button> 2</td><td>Kyste pur ou entièrement spongiforme.</td><td>Non, sauf projet thérapeutique particulier.</td></tr><tr><td><button class="w" data-k="e04-tirads">EU-TIRADS</button> 3</td><td>Iso/hyperéchogène sans signe de forte suspicion.</td><td>Si diamètre > 20 mm.</td></tr><tr><td><button class="w" data-k="e04-tirads">EU-TIRADS</button> 4</td><td>Modérément hypoéchogène sans signe de forte suspicion.</td><td>Si diamètre > 15 mm.</td></tr><tr><td><button class="w" data-k="e04-tirads">EU-TIRADS</button> 5</td><td>Au moins un signe très suspect : forme ou marges irrégulières, microcalcifications, hypoechogénicité marquée.</td><td>Si diamètre > 10 mm ; plus petit selon ganglion/extension/contexte.</td></tr></tbody></table>
<p>Ces seuils sont strictement « supérieur à », et s’appliquent aux adultes. Un ganglion pathologique ou une suspicion d’extension extrathyroïdienne peut justifier une ponction indépendamment du score. Pour un nodule de 5–10 mm très suspect, cette discussion est notamment indiquée si ganglions suspects ou extension ; la proximité de la trachée ou d’un nerf importe aussi dans la décision intégrée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Le compte rendu décrit les trois dimensions, composition, échogénicité, forme, marges, calcifications et rapports. En cas de nodules multiples, repérer et identifier ceux qui nécessitent un suivi ou un prélèvement. L’échographie n’exclut pas à elle seule toute forme de cancer : les systèmes ont surtout été développés pour certaines formes papillaires et sont moins performants pour d’autres tumeurs [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les pourcentages de risque sont dépendants de la population et du recrutement. Il serait incorrect d’annoncer le risque d’une série opérée comme la probabilité personnelle de toute personne ayant le même score. Le score structure le raisonnement, sans remplacer la clinique ni la cytologie indiquée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Rapporter le score avec les dimensions et le cou entier. Le ganglion ou l’extension peut changer la décision avant un seuil dimensionnel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-e-2"><h2><span class="n">e-2</span>Biologie et scintigraphie : lire la fonction</h2><p>La <button class="w" data-k="e04-tsh">TSH</button> s’interprète avec l’intervalle du laboratoire et le contexte. Une valeur sous la limite normale appelle un dosage hormonal et, selon le bilan, une scintigraphie. Une <button class="w" data-k="e04-tsh">TSH</button> dans la norme ne renseigne pas directement sur la nature histologique d’un nodule. La biotine, des médicaments et une maladie intercurrente peuvent compliquer l’interprétation ; documenter avant de conclure à une nouvelle maladie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p>La thyroxine et la triiodothyronine circulent largement liées à des protéines ; les fractions libres utilisées en clinique ne se confondent pas avec les concentrations totales. Les mesures gardent leur méthode, leurs unités et leurs références, surtout en grossesse. Ne pas convertir un nombre sans savoir s’il s’agit de fraction libre ou totale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>La scintigraphie montre la répartition de captation, pas une photographie de toutes les cellules. Elle distingue des zones hyperfonctionnelles et hypofonctionnelles et aide à sélectionner les prélèvements et l’éligibilité au radioiode. Un <button class="w" data-k="e04-contraste">contraste iodé</button> récent peut réduire la fixation et rendre l’examen trompeur ; une image peu fixante doit être située dans l’histoire d’exposition [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>La calcitonine peut être utile devant une suspicion de cancer médullaire, une histoire familiale pertinente, une cytologie indéterminée ou avant certains traitements. La thyroglobuline sérique n’est pas un test initial fiable de bénignité. Aucun dosage ne remplace une analyse du nodule et du contexte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> La fonction biologique et la fonction régionale ne sont pas la cytologie. Un résultat doit garder sa méthode et son contexte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-e-3"><h2><span class="n">e-3</span>Cytologie : ni score de fonction ni verdict universel</h2><table class="t" data-e04-table="1"><thead><tr><th>Résultat</th><th>Interprétation</th><th>Étape possible selon contexte</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda I</a></td><td>Non diagnostique : cellules insuffisantes ou prélèvement inadéquat.</td><td>Répéter ponction ; autres prélèvements/discussion si échecs persistants.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda II</a></td><td>Bénin en cytologie.</td><td>Confronter à échographie ; répéter si discordance très suspecte.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda III</a></td><td>Atypie de signification indéterminée.</td><td>Répéter ponction puis surveillance/analyses/discussion selon risque.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda IV</a></td><td>Néoplasie folliculaire ou suspicion de telle néoplasie.</td><td>Discussion spécialisée souvent chirurgicale, surveillance possible dans cas sélectionnés.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda V</a>–VI</td><td>Suspect de malignité ou malin.</td><td>Parcours tumoral spécialisé ; le type compte, notamment si lymphome suspect.</td></tr></tbody></table>
<p>La cytologie utilise une classification normalisée et une estimation locale du risque. Ce tableau reprend les catégories qualitatives utilisées par le guide européen 2023 ; son tableau numérique se fondait sur l’édition 2017 de <button class="w" data-k="e04-cyto">Bethesda</button>, et la troisième édition est parue après la première version du manuscrit. Aucun pourcentage ancien n’est présenté ici comme valeur absolue de 2026 [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Une lésion folliculaire peut nécessiter une analyse tissulaire pour distinguer certaines entités. Les tests moléculaires sont des outils complémentaires sélectionnés ; des anomalies comme une mutation <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">RAS</a> peuvent aussi se rencontrer dans des lésions bénignes. Leurs performances dépendent de la validation et du risque préalable ; un résultat commercial ne garantit ni diagnostic individuel ni remboursement suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Un prélèvement insuffisant ne rassure pas. Une atypie n’est pas synonyme de cancer ; la concordance et le contexte guident la suite [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-e-4"><h2><span class="n">e-4</span>Comparer la croissance : un calcul explicite</h2><p>Pour un diamètre, la variation relative est : (nouvelle mesure−ancienne mesure)÷ancienne mesure×100. Exemple pédagogique fictif : passer de 20 à 24 mm donne (24−20)÷20 ×100=20%, soit 4 mm. Cela ne suffit pas seul au critère européen qui demande cette augmentation dans au moins deux diamètres, avec 2 mm minimum, ou un volume augmenté de plus 50% [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les plans et la technique doivent être comparables. Une différence de mesure n’est pas nécessairement une modification biologique ; un changement kystique ou un saignement peut aussi faire varier le volume. L’état clinique et les caractéristiques échographiques comptent avec les nombres. Le seuil de croissance vise à décider d’une réévaluation, pas à prédire seul la malignité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Avant d’appliquer une règle de suivi, vérifier âge, score, taille, cytologie éventuelle et symptômes. Les adultes avec deux prélèvements bénins concordants et les enfants avec un nodule suspect ne relèvent pas d’un tableau unique. Les calendriers ne doivent pas retarder une évaluation si une nouvelle gêne apparaît [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> Un seul diamètre à 20% ne satisfait pas à lui seul le critère complet. Calculer, puis interpréter [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-e-4">Essentiel de cette partie</button></section>
<div class="quiz"><b>Question 1. Une <button class="w" data-k="e04-tsh">TSH</button> normale devant un goitre signifie…</b><div><button data-ok="1">La fonction est actuellement compatible avec une normalité, mais le risque tumoral reste à évaluer.</button><button data-ok="0">Le cancer et la compression sont exclus.</button></div><div class="fb" hidden>La fonction et la structure sont distinctes ; évaluer symptômes, échographie et prélèvement indiqué [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</div></div>
<div class="quiz"><b>Question 2. Un nodule adulte <button class="w" data-k="e04-tirads">EU-TIRADS</button> 4 de 15 mm exactement, sans autre signe, franchit-il le seuil dimensionnel de ponction du guide 2023 ?</b><div><button data-ok="1">Non : le seuil est strictement supérieur à 15 mm ; considérer tout le contexte.</button><button data-ok="0">Oui, le seuil est automatiquement au moins 15 mm.</button></div><div class="fb" hidden>Le comparateur strict doit être conservé. Ganglion suspect, extension et contexte peuvent modifier la décision [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div></div>
<div class="quiz"><b>Question 3. Une FI mentionne 75–200 µg/j de <button class="w" data-k="e04-levothyroxine">lévothyroxine</button> pour goitre bénin euthyroïdien. Faut-il traiter tout nodule euthyroïdien ?</b><div><button data-ok="1">Non ; la FI décrit une indication et une dose, tandis que le guide 2023 déconseille le traitement systématique de la maladie nodulaire euthyroïdienne.</button><button data-ok="0">Oui ; toute indication de FI rend le traitement obligatoire.</button></div><div class="fb" hidden>Une indication réglementaire n’est pas une recommandation de traiter toute personne ; bénéfice et risques doivent être évalués [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</div></div>
<div class="quiz"><b>Question 4. Un goitre provoque une compression respiratoire qui doit être levée rapidement. Choisir le radioiode seul immédiatement ?</b><div><button data-ok="1">Non ; organiser une évaluation urgente et une décompression adaptée, car son effet est retardé et un gonflement transitoire est possible.</button><button data-ok="0">Oui ; le radioiode décomprime immédiatement.</button></div><div class="fb" hidden>Le besoin de résolution rapide de la compression est une contre-indication au radioiode dans le guide spécialisé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</div></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e04-tab-semio" role="tab" aria-controls="e04-s-semio" aria-selected="true" data-s="e04-s-semio">Sémiologie fondamentale et analytique</button><button id="e04-tab-anat" role="tab" aria-controls="e04-s-anat" aria-selected="false" data-s="e04-s-anat">Anatomie</button><button id="e04-tab-histo" role="tab" aria-controls="e04-s-histo" aria-selected="false" data-s="e04-s-histo">Histologie</button><button id="e04-tab-physio" role="tab" aria-controls="e04-s-physio" aria-selected="false" data-s="e04-s-physio">Physiologie</button><button id="e04-tab-bioch" role="tab" aria-controls="e04-s-bioch" aria-selected="false" data-s="e04-s-bioch">Biochimie</button><button id="e04-tab-gene" role="tab" aria-controls="e04-s-gene" aria-selected="false" data-s="e04-s-gene">Génétique et immunologie</button></div><div class="sci" id="e04-s-semio" role="tabpanel" aria-labelledby="e04-tab-semio"><section class="ilot" id="e04-semio-cours"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><section class="ilot" id="e04-semio-normal" data-semiology="normal"><h3>Normal : séparer volume et fonction</h3><p>La thyroïde est un organe cervical organisé en follicules. La fonction hormonale est régulée, tandis que l’examen et l’échographie décrivent la structure et le volume. Un dosage normal ne décrit donc pas toutes les dimensions de l’organe. La palpation, les rapports anatomiques et le contexte complètent le bilan ; aucune image normale ne démontre la bénignité d’une masse individuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
</section>
<section class="ilot" id="e04-semio-signs" data-semiology="signs"><h3>Signes : masse, gêne et évolution</h3><p>Un gonflement cervical, un contour irrégulier, une gêne à avaler, une dyspnée ou une voix modifiée sont des observations à dater et à décrire. Le mot non toxique ne les annule pas. Une lésion peut être palpable ou découverte par imagerie ; l’absence de nodule palpable ne suffit pas à exclure une lésion profonde ou petite. Ni douleur ni absence de douleur ne tranche seule la nature [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
</section>
<section class="ilot" id="e04-semio-mechanisms" data-semiology="mechanisms"><h3>Mécanismes : du tissu au retentissement</h3><p>Prolifération, colloïde et composantes kystiques peuvent accroître le volume alors que la production hormonale reste équilibrée. Une croissance vers la trachée ou l’œsophage peut produire une gêne mécanique. Une autonomie fonctionnelle peut se développer ou être révélée par une charge iodée ; ce mécanisme se distingue d’une compression et d’une transformation tumorale, qui ne sont pas des étapes obligatoires du même processus [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
</section>
<section class="ilot" id="e04-semio-examination" data-semiology="examination"><h3>Examen : observer et palper avec méthode</h3><p>Évaluer respiration et voix, inspecter le cou, puis palper doucement lobes, isthme et aires ganglionnaires. Décrire siège, mobilité à la déglutition, douleur, consistance et limites accessibles. La mobilité suggère une origine, sans prouver la bénignité. Une suspicion d’extension rétrosternale ou un symptôme compressif appelle une exploration ciblée plutôt qu’une conclusion fondée sur la seule partie palpable [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
</section>
<section class="ilot" id="e04-semio-interpretation" data-semiology="interpretation"><h3>Interprétation : raisonner par questions</h3><p>La <button class="w" data-k="e04-tsh">TSH</button> renseigne sur le contrôle fonctionnel, l’échographie sur les caractéristiques et les ganglions, la scintigraphie sur la fonction régionale et la cytologie sur les cellules prélevées. Une discordance mérite une analyse. Un score élevé n’est pas un résultat histologique ; un prélèvement insuffisant n’est pas bénin. Les normes biologiques et les probabilités dépendent des méthodes et des populations [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
</section>
<section class="ilot" id="e04-semio-differentials" data-semiology="differentials"><h3>Différentiels : garder la cause ouverte</h3><p>Comparer goitre bénin non toxique, maladie par carence iodée, thyroïdite, goitre avec hyperthyroïdie, tumeur et masse d’autre origine. L’élément discriminant peut être fonctionnel, échographique, cytologique ou étiologique. Un diagnostic causal établi peut modifier le code. Des nodules multiples ne protègent pas du cancer et un nodule unique ne l’affirme pas ; le choix du prélèvement repose sur le risque, pas seulement sur le nombre [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
</section>
<section class="ilot" id="e04-semio-urgency" data-semiology="urgency"><h3>Urgence : la respiration avant le calendrier</h3><p>Stridor ou détresse respiratoire demandent une évaluation urgente adaptée aux voies aériennes. Une croissance rapide, un ganglion suspect ou une voix nouvellement modifiée accélèrent l’analyse spécialisée selon retentissement. Le radioiode n’agit pas immédiatement et peut faire gonfler transitoirement la glande ; il ne remplace pas une décompression rapide quand elle est nécessaire. Le délai clinique ne se déduit pas d’un code [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</p>
</section>
<section class="ilot" id="e04-semio-limits" data-semiology="limits"><h3>Limites : mesures, seuils et populations</h3><p>La palpation et l’échographie dépendent de l’examinateur ; les systèmes échographiques ont des limites selon le type tumoral. Les seuils adultes ne se transposent pas directement à l’enfant. Un changement de mesure ne représente pas nécessairement une croissance biologique. Les calendriers de suivi ont une certitude limitée, et une <button class="w" data-k="e04-tsh">TSH</button> initialement normale n’exclut pas une dysfonction après <button class="w" data-k="e04-contraste">contraste iodé</button> sur terrain autonome [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
</section>
<section class="ilot" id="e04-semio-sources" data-semiology="sources"><h3>Sources lues : niveaux et décisions</h3><p>La classification suisse locale et les notes allemandes 2024 encadrent le code. Le guide européen 2023 fonde le bilan et les choix adultes ; le guide pédiatrique 2022 garde son périmètre. Les informations professionnelles suisses datées fondent les médicaments, et la directive <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">OFSP</a> 2025 la radioprotection. Les liens renvoient aux sources réellement lues, sans confondre notice réglementaire, formation et preuve de bénéfice [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
</section>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Signe observé</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mécanisme et question</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Examen puis décision</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. La démarche ne transforme pas un signe en diagnostic automatique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Décrire le signe, expliquer un mécanisme plausible, choisir le test qui répond à la question puis décider selon la gravité et le risque [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</div></section>
<div class="key"><b>Science → clinique.</b> Le fonctionnement normal explique un signe possible sans prouver sa cause individuelle. <b>Science → examen.</b> Choisir la mesure qui répond à la question et confronter ses limites. <b>Science → traitement.</b> Adapter l’intervention à la fonction, au risque et au retentissement, après discussion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</div></div><div class="sci" id="e04-s-anat" role="tabpanel" aria-labelledby="e04-tab-anat" hidden><section class="ilot" id="e04-s-anat-cours"><h2><span class="n">s-anat-cours</span>Anatomie : rapports qui expliquent les symptômes</h2><p>La thyroïde normale comprend deux lobes latéraux et un isthme en avant de la trachée, sous le larynx. Les parathyroïdes se trouvent principalement sur la face postérieure. Les vaisseaux et les structures laryngées sont proches, sans constituer les mêmes tissus. La planche présente une vue antérieure et une vue postérieure : reconnaître l’orientation évite de confondre les rapports visibles et les régions profondes [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">S15</a>].</p>
<p>Une augmentation de volume peut être diffuse ou faite de nodules. La surface accessible à la palpation ne représente pas nécessairement tout le développement de la glande ; une partie peut se prolonger derrière le sternum. La présence d’une fonction normale ne modifie pas ces rapports. Un organe qui produit une quantité appropriée d’hormones peut malgré tout prendre de la place et exercer une pression [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>La trachée conduit l’air et l’œsophage permet la déglutition ; leur proximité explique pourquoi dyspnée et dysphagie sont des questions pertinentes. Une voix modifiée conduit à évaluer le larynx et les structures nerveuses dans le contexte. Ces symptômes n’identifient pas seuls le tissu causal et ne prouvent pas une invasion cancéreuse, mais demandent une explication proportionnée au retentissement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>L’échographie examine la glande et les ganglions du cou. Une extension sous-sternale peut justifier une imagerie en coupe afin d’étudier la trachée, le médiastin supérieur et les rapports profonds. Le choix du contraste tient compte du contexte iodé et fonctionnel ; il n’est pas un détail interchangeable avant une scintigraphie ou un radioiode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Pour le traitement, ces rapports expliquent la nécessité d’une équipe expérimentée en chirurgie et la vérification des cordes vocales avant certaines ablations. Le geste est choisi selon les territoires atteints et la question clinique. La planche normale aide à comprendre le risque anatomique ; elle ne montre ni la compression de la patiente fictive ni une lésion de nerf, et ne permet pas de mesurer un goitre individuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<figure><div data-e04-frame="1"><img src="assets/img/e04/alpha/codex/thyroid-openstax2013.jpg" alt="Planche humaine normale : vues antérieure et postérieure de la thyroïde puis micrographie de follicules ; quatre repères français explicités." loading="eager"><span data-e04-marker="1" data-e04-pin="1">1</span><span data-e04-marker="1" data-e04-pin="2">2</span><span data-e04-marker="1" data-e04-pin="3">3</span><span data-e04-marker="1" data-e04-pin="4">4</span></div><figcaption>OpenStax College, Connexions, 19 juin 2013 ; micrographie fournie par les Regents of University of Michigan Medical School©2012. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">Original 1811, Creative Commons Attribution 3.0</a>. Pixels inchangés ; repères superposés : 1 isthme devant la trachée, 2 trachée, 3 parathyroïde postérieure, 4 colloïde d’un follicule. Planche normale, pas goitre <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ni cytologie de risque. Un même original utilisé deux fois. Microscopie optique 1332 × dans la légende du manuel, pas calibration de l’écran ; coloration non établie. Les labels anglais sont complétés par la légende française [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">S15</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Les rapports expliquent les symptômes mécaniques et les précautions du geste, indépendamment de la fonction hormonale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-s-anat-cours">Essentiel de cette partie</button></section>
<div class="key"><b>Science → clinique.</b> Le fonctionnement normal explique un signe possible sans prouver sa cause individuelle. <b>Science → examen.</b> Choisir la mesure qui répond à la question et confronter ses limites. <b>Science → traitement.</b> Adapter l’intervention à la fonction, au risque et au retentissement, après discussion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div></div><div class="sci" id="e04-s-histo" role="tabpanel" aria-labelledby="e04-tab-histo" hidden><section class="ilot" id="e04-s-histo-cours"><h2><span class="n">s-histo-cours</span>Histologie : follicule, colloïde et limites du prélèvement</h2><p>Le follicule thyroïdien normal est une unité constituée de cellules épithéliales autour d’une lumière contenant de la colloïde. La thyroglobuline y sert de support à la synthèse et au stockage des hormones. Les cellules folliculaires ne doivent pas être confondues avec les cellules parafolliculaires, ou cellules C, associées à la calcitonine. La micrographie de cette planche représente le tissu normal ; elle n’est pas une cytoponction d’un nodule ni une preuve de bénignité [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">S15</a>].</p>
<p>Dans une maladie nodulaire, architecture, quantité de colloïde, cellules et remaniements peuvent varier selon les zones. Un aspect kystique décrit une composition, sans résumer à lui seul tout le risque. Les images échographiques utilisent une autre échelle et d’autres propriétés du tissu : une zone sombre à l’échographie ne s’identifie pas simplement à la couleur d’une structure sur une lame [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>La cytoponction recueille des cellules et du matériel. Sa qualité dépend du prélèvement, de la cible et de l’analyse. Une catégorie non diagnostique signifie que l’échantillon ne permet pas de conclure ; elle ne prouve pas que le nodule est normal. Une catégorie bénigne doit rester concordante avec l’échographie et l’évolution. En cas de discordance très suspecte, la réévaluation protège contre une rassurance fondée sur un résultat isolé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Certains diagnostics folliculaires demandent une analyse tissulaire complémentaire ; la catégorie cytologique n’est donc pas une simple étiquette oui/non. La chirurgie peut avoir un objectif diagnostique lorsque l’incertitude et le contexte le justifient. Des prélèvements plus larges peuvent aussi être discutés dans certaines situations, notamment si un lymphome ou une autre histologie particulière est suspecté [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les immunomarquages et tests moléculaires ne remplacent pas systématiquement la morphologie. Le guide européen insiste sur les performances locales et les validations ; une anomalie moléculaire peut aussi exister dans une lésion bénigne. Comprendre les limites du matériau évite d’annoncer un cancer sur un terme indéterminé ou de promettre qu’un prélèvement incomplet a tout exclu [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>

<div class="key"><b>À retenir.</b> La cytologie étudie ce qui a été prélevé. Interpréter sa qualité et sa concordance avant de décider [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-s-histo-cours">Essentiel de cette partie</button></section>
<div class="key"><b>Science → clinique.</b> Le fonctionnement normal explique un signe possible sans prouver sa cause individuelle. <b>Science → examen.</b> Choisir la mesure qui répond à la question et confronter ses limites. <b>Science → traitement.</b> Adapter l’intervention à la fonction, au risque et au retentissement, après discussion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div></div><div class="sci" id="e04-s-physio" role="tabpanel" aria-labelledby="e04-tab-physio" hidden><section class="ilot" id="e04-s-physio-cours"><h2><span class="n">s-physio-cours</span>Physiologie : rétrocontrôle et autonomie régionale</h2><p>Le fonctionnement normal associe une commande hypophysaire et la réponse des cellules folliculaires. La thyréostimuline stimule la synthèse et la libération des hormones ; lorsque les hormones augmentent, le rétrocontrôle réduit la stimulation. La thyroxine et la triiodothyronine participent aux fonctions métaboliques et au développement. Le système règle une production, mais il n’assure pas que chaque région ait une architecture ou une taille identiques [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>Un goitre non toxique peut maintenir une production globale dans l’intervalle attendu. La présence d’un volume important ne signifie pas nécessairement une production excessive ; inversement, une petite région autonome peut modifier le contrôle global. L’évaluation garde donc des axes distincts : structure, sécrétion et risque de nature du tissu. La <button class="w" data-k="e04-tsh">TSH</button> donne un signal fonctionnel utile mais ne visualise aucun nodule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Dans une autonomie, une région fonctionne moins sous le contrôle habituel. La scintigraphie renseigne sur la répartition relative de la captation et peut identifier cette hétérogénéité. Dans des régions ayant connu une carence iodée, des zones hyperfonctionnelles peuvent être présentes alors que la <button class="w" data-k="e04-tsh">TSH</button> est encore normale ; l’indication de scintigraphie se discute donc selon l’ensemble clinique et l’objectif [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Une charge iodée importante peut fournir davantage de substrat à un tissu autonome et révéler une hyperthyroïdie. Le contraste peut également produire des changements transitoires des dosages et réduire la fixation des isotopes. Les conséquences sont particulièrement pertinentes chez les personnes âgées ou cardiaques, dont les signes peuvent être discrets. Une valeur normale avant contraste ne garantit pas que la fonction restera normale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Cette physiologie éclaire le traitement : on ne donne pas automatiquement une hormone supplémentaire à une glande dont la fonction est normale. L’effet recherché doit être confronté au risque de surtraitement, notamment cardiaque et osseux. Une vraie insuffisance demandant substitution reste une autre indication ; sa prise en charge ne se déduit pas d’une stratégie ancienne de réduction de volume [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Commande et rétrocontrôle</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Production globale et régions différentes</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Bilan fonctionnel contextualisé</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Organisation du raisonnement physiologique, sans prétendre que toute autonomie devient toxique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Euthyroïdie globale et hétérogénéité régionale peuvent coexister. La fonction ne révèle pas toute la structure [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-s-physio-cours">Essentiel de cette partie</button></section>
<div class="key"><b>Science → clinique.</b> Le fonctionnement normal explique un signe possible sans prouver sa cause individuelle. <b>Science → examen.</b> Choisir la mesure qui répond à la question et confronter ses limites. <b>Science → traitement.</b> Adapter l’intervention à la fonction, au risque et au retentissement, après discussion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</div></div><div class="sci" id="e04-s-bioch" role="tabpanel" aria-labelledby="e04-tab-bioch" hidden><section class="ilot" id="e04-s-bioch-cours"><h2><span class="n">s-bioch-cours</span>Biochimie : iode, hormones et médicaments distincts</h2><p>L’iodure est un substrat de la synthèse hormonale. Il est capté par les cellules folliculaires puis incorporé à des résidus de tyrosine de la thyroglobuline ; le couplage permet de former les hormones contenant trois ou quatre atomes d’iode. Leur libération implique la reprise et la dégradation du support protéique. Ces étapes décrivent une chaîne cellulaire organisée, pas la conversion directe de tout aliment iodé en un effet immédiat sur le volume du cou [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>Dans le sang, les hormones circulent surtout liées à des protéines. La fraction libre et la concentration totale ne répondent donc pas exactement à la même mesure. Le laboratoire précise méthode, unités et intervalle ; certains traitements ou suppléments peuvent perturber l’analyse. La biotine signalée dans la FI doit être documentée et discutée avec le laboratoire, sans inventer un délai d’arrêt unique pour tous les produits et toutes les méthodes [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>La <button class="w" data-k="e04-levothyroxine">lévothyroxine</button> apporte une hormone, tandis que l’iode stable apporte un substrat et que l’iode radioactif délivre une irradiation à un tissu qui le fixe. Ces trois interventions n’ont ni la même unité, ni la même indication, ni le même mécanisme. Microgrammes d’hormone, milligrammes d’iode par kilogramme de sel et mégabecquerels d’activité ne sont pas des quantités interchangeables [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>].</p>
<p>La fixation du radioiode dépend du volume, de la fonction régionale, des apports iodés et de la clairance. Un produit de contraste ou l’amiodarone peut modifier cette fixation ; le service spécialisé établit les conditions et le calendrier. Une gélule dont la présentation couvre une large plage d’activité n’est pas une prescription standard pour tout goitre. L’insuffisance rénale peut accroître l’exposition en retardant l’élimination [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Enfin, corriger un déficit nutritionnel documenté et traiter un nodule bénin symptomatique sont des objectifs différents. Le guide européen ne recommande pas d’ajouter iode ou sélénium à toute maladie nodulaire lorsque les apports sont suffisants. Une source alimentaire ou un supplément ne se choisit pas sur l’espoir de faire disparaître automatiquement une lésion structurale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/dam/de/sd-web/DknRSfuZymhE/faq-jod-supplement-de.pdf" target="_blank" rel="noopener">S11</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Substrat iodé</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Synthèse et transport hormonal</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Tests et traitements de buts différents</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Schéma conceptuel, sans anatomie ; les branches ne sont pas une équivalence de doses [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Distinguer le substrat, l’hormone et l’activité radioactive avant de lire un chiffre ou de calculer une prise [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-s-bioch-cours">Essentiel de cette partie</button></section>
<div class="key"><b>Science → clinique.</b> Le fonctionnement normal explique un signe possible sans prouver sa cause individuelle. <b>Science → examen.</b> Choisir la mesure qui répond à la question et confronter ses limites. <b>Science → traitement.</b> Adapter l’intervention à la fonction, au risque et au retentissement, après discussion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div></div><div class="sci" id="e04-s-gene" role="tabpanel" aria-labelledby="e04-tab-gene" hidden><section class="ilot" id="e04-s-gene-cours"><h2><span class="n">s-gene-cours</span>Génétique et immunologie : terrain, nodule et preuve</h2><p>Les cellules d’un tissu normal contrôlent leur fonctionnement et leur renouvellement par des programmes moléculaires. Le système immunitaire et les anticorps peuvent aussi modifier l’environnement thyroïdien. La distinction entre une anomalie du tissu, une réponse auto-immune et une modification de fonction évite de faire du mot goitre une cause unique. L’évaluation initiale ne repose pas sur un séquençage général mais sur histoire, fonction, échographie et prélèvement indiqué [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>Des nodules peuvent porter des modifications somatiques qui ne sont pas présentes dans toutes les cellules du corps. Le guide européen rapporte que certaines mutations <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">RAS</a> et certains remaniements peuvent aussi être observés dans des lésions bénignes. Leur détection ne constitue donc pas automatiquement une preuve de cancer ni une indication de chirurgie totale. Une analyse moléculaire complète la morphologie et le risque préalable selon ses performances réellement validées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Une prédisposition germinale est une autre situation. Chez l’enfant et dans des familles ou phénotypes évocateurs, les syndromes liés à <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">DICER1</a> ou à <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">PTEN</a> peuvent associer goitre multinodulaire et autres lésions. L’histoire personnelle, familiale et les manifestations associées guident l’orientation spécialisée. Cela ne signifie pas que la majorité des adultes avec <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ont une maladie mendélienne, ni qu’un nodule multiple isolé demande tous les tests génétiques possibles [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<p>Du côté immunologique, une thyroïdite peut modifier l’architecture et produire des zones ressemblant à des nodules. Si la <button class="w" data-k="e04-tsh">TSH</button> est augmentée, les anticorps antithyroperoxydase peuvent aider à documenter ce contexte ; d’autres anticorps sont discutés si la suspicion persiste. Un anticorps positif ne classe pas à lui seul chaque nodule et ne remplace pas l’analyse d’un signe échographique suspect [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Pour la conduite, retenir la différence entre risque, association et preuve. Un test doit répondre à une question susceptible de modifier la décision. Les performances commerciales et les résultats de centres sélectionnés ne garantissent pas les mêmes valeurs prédictives ailleurs. Le patient doit comprendre ce qui est appris, ce qui reste incertain et quelles alternatives de surveillance ou d’analyse existent avant une décision irréversible [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
