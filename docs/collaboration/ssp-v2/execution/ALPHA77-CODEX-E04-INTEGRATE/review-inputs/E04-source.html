<div class="key"><b>À retenir.</b> Germinal, somatique et auto-immun ne sont pas synonymes. Un résultat moléculaire reste lié à sa validation et au contexte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-s-gene-cours">Essentiel de cette partie</button></section>
<div class="key"><b>Science → clinique.</b> Le fonctionnement normal explique un signe possible sans prouver sa cause individuelle. <b>Science → examen.</b> Choisir la mesure qui répond à la question et confronter ses limites. <b>Science → traitement.</b> Adapter l’intervention à la fonction, au risque et au retentissement, après discussion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</div></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e04-p-1"><h2><span class="n">p-1</span>Avant un médicament : clarifier l’objectif</h2><p>Traiter un déficit hormonal, réduire un volume bénin et prévenir une conséquence de charge iodée ne sont pas le même objectif. Un nodule euthyroïdien asymptomatique peut être surveillé ; l’existence d’une ligne de posologie dans une FI ne rend pas le traitement nécessaire pour toute personne ayant le même code [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p>Le guide européen 2023 déconseille les hormones thyroïdiennes dans la maladie nodulaire euthyroïdienne. Le guide de médecine nucléaire 2023 discute encore une sélection de jeunes personnes avec goitre modeste pour la <button class="w" data-k="e04-levothyroxine">lévothyroxine</button> ; ce périmètre et cette position ne doivent pas être transformés en consensus contraire au guide nodulaire. La décision individuelle expose la population, l’objectif et les risques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Les thyréostatiques ne traitent pas automatiquement un goitre sans hyperthyroïdie. Une hyperthyroïdie sur autonomie ou après contraste ouvre un autre parcours ; une éventuelle prophylaxie est spécialisée et non recommandée chez tout patient à risque. Aucune posologie de carbimazole n’est présentée ici comme dose de radioiode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> L’indication précède la dose. Distinguer bénéfice attendu, information réglementaire et recommandation clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-p-2"><h2><span class="n">p-2</span><button class="w" data-k="e04-levothyroxine">Euthyrox</button> : formulation, dose et risque de surtraitement</h2><table class="t" data-e04-table="1"><thead><tr><th>Situation, FI février 2023</th><th>Repère de dose/prise</th><th>Limite</th></tr></thead><tbody><tr><td>Goitre bénin euthyroïdien, adulte</td><td>75–200 µg une fois/jour, oral, selon indication et réponse.</td><td>Dose de FI, pas recommandation de traiter toute maladie nodulaire euthyroïdienne.</td></tr><tr><td>Prise du comprimé</td><td>À jeun, au moins 30 min avant petit-déjeuner, avec eau.</td><td>Horaire et interactions peuvent modifier absorption.</td></tr><tr><td>Patient âgé/cardiaque ou hypothyroïdie sévère ancienne si substitution indiquée</td><td>Début bas, notamment 25 µg/j puis augmentation prudente.</td><td>Pas dose automatique de réduction <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ; suivi clinique et biologique.</td></tr><tr><td>Rein/foie</td><td>Pharmacocinétique non étudiée selon FI.</td><td>Pas adaptation chiffrée universelle inventée.</td></tr><tr><td>Enfant</td><td>Dose dépend indication et âge ; prise en charge adaptée.</td><td>Les doses d’hypothyroïdie congénitale ne sont pas un schéma de goitre <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.</td></tr></tbody></table>
<p>La FI lue est celle d’<button class="w" data-k="e04-levothyroxine">Euthyrox</button>, comprimés de <button class="w" data-k="e04-levothyroxine">lévothyroxine</button> sodique de 25 à 200 µg, mise à jour février 2023, référence produit identifiant de produit 7680549490017. Une dose de 75 µg correspond à 0,075 mg : ce simple changement d’unité ne transforme pas une dose en indication. Confondre microgramme et milligramme produit un facteur mille [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p>La plage 75–200 µg/j figure pour le goitre bénin euthyroïdien et la prévention de récidive, sur des mois à des années selon la situation. Elle reste confrontée au guide européen 2023 qui ne recommande pas le traitement systématique de la maladie nodulaire euthyroïdienne. Les doses de substitution de l’hypothyroïdie relèvent d’une autre indication et ne sont pas ajoutées à cette plage [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p>Rechercher autonomie et maladies cardiaques avant une décision hormonale. Les contre-indications du produit comprennent notamment certaines affections cardiaques aiguës ou non stabilisées, une insuffisance surrénalienne/hypophysaire non traitée et une hyperthyroïdie hors situations précisées dans la FI. Une dose excessive peut provoquer palpitations, tachycardie et arythmie ; la suppression prolongée expose aussi l’os. Le suivi doit rechercher le bénéfice comme le surtraitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Une quantité exacte n’est sûre qu’avec l’indication, l’unité et le suivi appropriés. Ne pas supprimer la <button class="w" data-k="e04-tsh">TSH</button> de routine pour un nodule euthyroïdien [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-p-3"><h2><span class="n">p-3</span>Lévothyroxine : interactions, grossesse et allaitement</h2><table class="t" data-e04-table="1"><thead><tr><th>Produit/contexte</th><th>FI <button class="w" data-k="e04-levothyroxine">Euthyrox</button></th><th>Décision</th></tr></thead><tbody><tr><td>Résines échangeuses d’ions</td><td>Les administrer 4–5 h après <button class="w" data-k="e04-levothyroxine">lévothyroxine</button>.</td><td>Éviter absorption diminuée.</td></tr><tr><td>Calcium, fer, médicaments contenant aluminium</td><td>Lévothyroxine au moins 2 h avant.</td><td>Ne pas remplacer ce délai de FI par un intervalle universel inventé.</td></tr><tr><td>Inhibiteur de pompe à protons, soja ou modification d’alimentation</td><td>Absorption ou besoin peuvent changer.</td><td>Contrôle biologique/clinique et dose réévaluée.</td></tr><tr><td>Anticoagulants et antidiabétiques</td><td>Effet thérapeutique peut être modifié.</td><td>Surveillance adaptée au médicament.</td></tr><tr><td>Biotine</td><td>Interférence possible avec analyses thyroïdiennes.</td><td>Informer laboratoire/prescripteur ; stratégie selon méthode.</td></tr></tbody></table>
<p><button class="w" data-k="e04-interactions">La liste</button> des médicaments et compléments doit être concrète : produit, horaire, dose, changement récent. Une <button class="w" data-k="e04-tsh">TSH</button> différente après un nouveau produit peut refléter une absorption modifiée ou une interférence d’analyse ; l’augmentation immédiate de dose n’est pas la seule explication possible. L’interprétation prend aussi en compte prise réelle et indication initiale [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p>Une substitution réellement nécessaire est poursuivie pendant grossesse et allaitement avec surveillance spécialisée ; les besoins peuvent augmenter en grossesse. Après accouchement, la FI prévoit retour à la dose préconceptionnelle et contrôle de <button class="w" data-k="e04-tsh">TSH</button> après six à huit semaines selon le contexte. Cela ne crée pas une indication de commencer une suppression hormonale pour chaque goitre euthyroïdien [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p>L’association de <button class="w" data-k="e04-levothyroxine">lévothyroxine</button> avec un thyréostatique dans une stratégie de blocage-substitution est contre-indiquée pendant grossesse selon cette FI. La compatibilité de la substitution ne signifie donc pas que toute combinaison ou tout objectif thérapeutique soit compatible. Les symptômes et résultats sont suivis sans arrêt autonome d’un traitement nécessaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<div class="key"><b>À retenir.</b> Vérifier l’absorption et le contexte avant de changer une dose. La substitution nécessaire pendant grossesse est distincte d’une suppression de routine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-p-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-p-4"><h2><span class="n">p-4</span>Radioiode : produit exact et dosimétrie</h2><table class="t" data-e04-table="1"><thead><tr><th>Curium, FI juillet 2022</th><th>Ce qui est établi</th><th>Ce qui ne se déduit pas</th></tr></thead><tbody><tr><td>Produit</td><td>Sodium iodide (I-131) capsule T Curium, oral ; indication inclut goitre euthyroïdien.</td><td>Pas carbimazole ni capsule diagnostique d’iode 123.</td></tr><tr><td>Présentation</td><td>37–7400 mégabecquerels par capsule à la date de calibration.</td><td>Pas plage prescrite à toute personne <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.</td></tr><tr><td>Activité thérapeutique</td><td>Individualisée selon diagnostic, volume, fixation et clairance ; effet en semaines.</td><td>Pas dose fixe universelle ni traitement immédiat d’une compression.</td></tr><tr><td>Fonction rénale</td><td>Élimination retardée, exposition potentiellement accrue, attention/ajustement individualisés.</td><td>Pas formule de réduction copiée sans dosimétrie.</td></tr><tr><td>Enfant/adolescent</td><td>Bénéfice/risque soigneusement évalué, activité adaptée ou dosimétrie individuelle.</td><td>Pas simple transposition de l’adulte ni indication usuelle de tout nodule pédiatrique.</td></tr></tbody></table>
<p><button class="w" data-k="e04-radioiode">Le radioiode</button> peut être choisi pour certains goitres bénins symptomatiques après bilan. Le guide spécialisé rapporte dans des populations sélectionnées une réduction de volume d’environ 40–50% à un an, variable et non immédiate. Un besoin de décompression trachéale rapide ou une suspicion de cancer empêche de le traiter simplement comme un goitre bénin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>La dosimétrie met en relation activité administrée, volume cible, fixation et durée de rétention ; mégabecquerel décrit une activité et gray une dose absorbée. La FI précise ces paramètres et renvoie au guide spécialisé. Le service calcule et documente l’activité, la mesure avant utilisation et vérifie que les conditions du test et du traitement concordent. Aucune valeur de présentation ni dose d’ablation d’un cancer n’est convertie en dose <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>La stimulation par thyréostimuline recombinante pour augmenter la fixation d’un goitre non toxique est hors indication dans le guide européen 2023 et n’est pas un adjuvant routinier. Elle peut augmenter certains effets comme le gonflement et l’hypothyroïdie. Une mention de cette stratégie dans une étude ou une autre indication de FI n’autorise pas à en faire une étape obligatoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Vérifier le produit et l’objectif avant les unités. La dosimétrie est individuelle et ne remplace pas l’évaluation de la compression [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-p-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-p-5"><h2><span class="n">p-5</span>Radioiode : contre-indications, interactions et entourage</h2><p>La FI Curium juillet 2022 contre-indique grossesse existante, supposée ou non exclue et allaitement. Elle demande un sevrage au moins huit semaines avant, sans reprise de cet allaitement. Le guide européen 2023 évoque six semaines : cette différence n’est pas effacée et le libellé du produit reste identifié. Le conseil de projet de grossesse de la FI évoque six à douze mois, tandis que sa rubrique contraception mentionne six mois après affection bénigne ; le plan doit être clarifié avec le service plutôt que choisir silencieusement un seul nombre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</p>
<p>La capsule est aussi contre-indiquée en cas de dysphagie, sténose ou certaines lésions digestives selon le libellé. C’est un point particulièrement pertinent devant un goitre compressif : ne pas demander de forcer la déglutition. Rechercher hypersensibilité aux composants et les conditions qui changent l’exposition ou la sécurité [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</p>
<p>Contraste, amiodarone, hormones, thyréostatiques et produits iodés peuvent modifier la fixation. La FI donne des délais indicatifs selon produit, avec une incohérence interne de deux versus trois jours pour certains thyréostatiques ; elle ne sert pas à organiser un arrêt autonome. Le service coordonne avec le prescripteur, notamment cardiologue pour amiodarone. Après <button class="w" data-k="e04-contraste">contraste iodé</button> hydrosoluble, la FI indique six à huit semaines ; le guide 2021 recommande éviter scintigraphie/radioiode pendant un à deux mois selon contexte [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Les effets possibles incluent hypothyroïdie, hyperthyroïdie transitoire, inflammation/gonflement et atteinte salivaire. Le risque dépend de l’activité, de l’indication et du terrain ; ne pas annoncer des fréquences de traitement carcinologique à tout goitre bénin. Les consignes de proximité, d’hygiène et de sortie sont écrites et orales, individualisées pour protéger entourage et environnement. Le fractionnement pour éviter une hospitalisation n’est pas autorisé par la directive suisse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<div class="key"><b>À retenir.</b> Grossesse, allaitement, déglutition et interactions sont vérifiés avant la capsule. Les divergences de délais doivent être résolues par l’équipe, pas masquées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-p-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-p-6"><h2><span class="n">p-6</span>Iode nutritionnel : concentration et apport total</h2><p>Le sel enrichi suisse contient 25 mg d’iode par kilogramme, soit 25 µg par gramme de sel : 25 mg=25000 µg et 1 kg=1000 g. Ce calcul explique une concentration ; il ne recommande pas de manger davantage de sel pour atteindre un apport. Choisir le sel iodé dans une consommation modérée et considérer les autres aliments est la stratégie institutionnelle [<a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/dam/de/sd-web/DknRSfuZymhE/faq-jod-supplement-de.pdf" target="_blank" rel="noopener">S11</a>].</p>
<p>Les compléments se jugent sur l’apport total, le besoin et le terrain. Le conseil institutionnel d’un apport total de 250 µg/j pendant allaitement ne signifie pas un comprimé de 250 µg à ajouter automatiquement. Le petit essai de 17 paires mère-enfant explore des doses ; son intervalle expérimental n’est pas une prescription générale. L’<a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV</a> conseille notamment de poursuivre pendant allaitement le complément iodé commencé en grossesse, avec vérification de l’ensemble des apports [<a data-reference-source="1" href="https://www.blv.admin.ch/de/jodtabletten-fuer-stillende-muetter-und-die-jodversorgung-von-saeuglingen" target="_blank" rel="noopener">S10</a>].</p>
<p>Le guide européen ne recommande pas de supplément d’iode ou de sélénium systématique en population suffisamment couverte. Les algues ont des teneurs variables et peuvent apporter un excès. Une réaction à un contraste n’est pas une allergie universelle à l’iode alimentaire ; un régime pauvre en iode avant radioiode est une consigne temporaire de procédure, pas un régime permanent à imposer à toute maladie thyroïdienne [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/dam/de/sd-web/DknRSfuZymhE/faq-jod-supplement-de.pdf" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Lire concentration, apport total et objectif séparément. Ni plus de sel ni plus de complément n’est une réponse automatique à <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodtabletten-fuer-stillende-muetter-und-die-jodversorgung-von-saeuglingen" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/dam/de/sd-web/DknRSfuZymhE/faq-jod-supplement-de.pdf" target="_blank" rel="noopener">S11</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-p-6">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e04-tsh" data-title="Thyréostimuline : commande et interprétation"><p>La thyréostimuline, ou <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">TSH</a>, est une hormone hypophysaire régulant les cellules folliculaires. Sa valeur s’interprète avec méthode et intervalle du laboratoire, âge, grossesse, médicaments et contexte. Une valeur normale ne prouve pas la bénignité d’un nodule ; une valeur basse demande exploration fonctionnelle et discussion de scintigraphie. Le dosage n’est pas une mesure du volume ni une image des cellules [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
</template>
<template data-pop="e04-tirads" data-title="EU-TIRADS : score, taille et exceptions"><table class="t" data-e04-table="1"><thead><tr><th>Catégorie adulte</th><th>Description résumée</th><th>Ponction dans le guide 2023</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">EU-TIRADS</a> 2</td><td>Kyste pur ou entièrement spongiforme.</td><td>Non, sauf projet thérapeutique particulier.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">EU-TIRADS</a> 3</td><td>Iso/hyperéchogène sans signe de forte suspicion.</td><td>Si diamètre > 20 mm.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">EU-TIRADS</a> 4</td><td>Modérément hypoéchogène sans signe de forte suspicion.</td><td>Si diamètre > 15 mm.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">EU-TIRADS</a> 5</td><td>Au moins un signe très suspect : forme ou marges irrégulières, microcalcifications, hypoechogénicité marquée.</td><td>Si diamètre > 10 mm ; plus petit selon ganglion/extension/contexte.</td></tr></tbody></table>
<p>Ce tableau concerne l’adulte. Un ganglion pathologique ou une extension suspectée peut modifier l’indication ; seuils adultes non transposables directement à l’enfant. La catégorie n’est pas un diagnostic histologique et ne contient pas à elle seule toute l’analyse des ganglions [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e04-cyto" data-title="Bethesda : résultat de cytologie et concordance"><table class="t" data-e04-table="1"><thead><tr><th>Résultat</th><th>Interprétation</th><th>Étape possible selon contexte</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda I</a></td><td>Non diagnostique : cellules insuffisantes ou prélèvement inadéquat.</td><td>Répéter ponction ; autres prélèvements/discussion si échecs persistants.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda II</a></td><td>Bénin en cytologie.</td><td>Confronter à échographie ; répéter si discordance très suspecte.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda III</a></td><td>Atypie de signification indéterminée.</td><td>Répéter ponction puis surveillance/analyses/discussion selon risque.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda IV</a></td><td>Néoplasie folliculaire ou suspicion de telle néoplasie.</td><td>Discussion spécialisée souvent chirurgicale, surveillance possible dans cas sélectionnés.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda V</a>–VI</td><td>Suspect de malignité ou malin.</td><td>Parcours tumoral spécialisé ; le type compte, notamment si lymphome suspect.</td></tr></tbody></table>
<p>Le guide européen 2023 s’appuie sur les catégories de l’édition 2017 et signale la troisième édition parue après manuscrit. Pas de pourcentages anciens présentés comme absolus 2026. Une discordance entre cytologie bénigne et échographie très suspecte demande une réévaluation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
</template>
<template data-pop="e04-croissance" data-title="Croissance : dénominateur et deux dimensions"><p>Variation en pourcentage=(nouveau−ancien)÷ancien×100. Exemple fictif 20→24 mm : 4 ÷20 ×100=20%, avec 4 mm de différence. Le critère complet demande au moins 20% dans deux diamètres avec 2 mm minimum, ou volume augmenté de plus 50%. Un seul diamètre ne suffit donc pas ; une croissance motive une réévaluation et ne prouve pas seule un cancer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
</template>
<template data-pop="e04-levothyroxine" data-title="Euthyrox : FI et indication clinique"><table class="t" data-e04-table="1"><thead><tr><th>Situation, FI février 2023</th><th>Repère de dose/prise</th><th>Limite</th></tr></thead><tbody><tr><td>Goitre bénin euthyroïdien, adulte</td><td>75–200 µg une fois/jour, oral, selon indication et réponse.</td><td>Dose de FI, pas recommandation de traiter toute maladie nodulaire euthyroïdienne.</td></tr><tr><td>Prise du comprimé</td><td>À jeun, au moins 30 min avant petit-déjeuner, avec eau.</td><td>Horaire et interactions peuvent modifier absorption.</td></tr><tr><td>Patient âgé/cardiaque ou hypothyroïdie sévère ancienne si substitution indiquée</td><td>Début bas, notamment 25 µg/j puis augmentation prudente.</td><td>Pas dose automatique de réduction <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ; suivi clinique et biologique.</td></tr><tr><td>Rein/foie</td><td>Pharmacocinétique non étudiée selon FI.</td><td>Pas adaptation chiffrée universelle inventée.</td></tr><tr><td>Enfant</td><td>Dose dépend indication et âge ; prise en charge adaptée.</td><td>Les doses d’hypothyroïdie congénitale ne sont pas un schéma de goitre <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.</td></tr></tbody></table>
<p>FI février 2023, identifiant de produit 7680549490017. Le guide nodulaire 2023 déconseille les hormones en maladie nodulaire euthyroïdienne ; la dose de FI ne rend pas le traitement obligatoire. Microgramme et milligramme diffèrent d’un facteur 1000. Surtraitement cardiaque et osseux, indication et suivi sont discutés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e04-interactions" data-title="Lévothyroxine : absorption et analyses"><table class="t" data-e04-table="1"><thead><tr><th>Produit/contexte</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Euthyrox</a></th><th>Décision</th></tr></thead><tbody><tr><td>Résines échangeuses d’ions</td><td>Les administrer 4–5 h après <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">lévothyroxine</a>.</td><td>Éviter absorption diminuée.</td></tr><tr><td>Calcium, fer, médicaments contenant aluminium</td><td>Lévothyroxine au moins 2 h avant.</td><td>Ne pas remplacer ce délai de FI par un intervalle universel inventé.</td></tr><tr><td>Inhibiteur de pompe à protons, soja ou modification d’alimentation</td><td>Absorption ou besoin peuvent changer.</td><td>Contrôle biologique/clinique et dose réévaluée.</td></tr><tr><td>Anticoagulants et antidiabétiques</td><td>Effet thérapeutique peut être modifié.</td><td>Surveillance adaptée au médicament.</td></tr><tr><td>Biotine</td><td>Interférence possible avec analyses thyroïdiennes.</td><td>Informer laboratoire/prescripteur ; stratégie selon méthode.</td></tr></tbody></table>
<p>La biotine peut modifier les tests ; informer le laboratoire et préciser produit/dose. Les délais sont ceux de la FI février 2023, pas un délai universel pour chaque molécule. Une grossesse exige de maintenir une substitution nécessaire et de suivre les besoins ; elle ne crée pas une indication de suppression pour tout nodule [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e04-radioiode" data-title="Iode131 thérapeutique : produit et objectif"><table class="t" data-e04-table="1"><thead><tr><th>Curium, FI juillet 2022</th><th>Ce qui est établi</th><th>Ce qui ne se déduit pas</th></tr></thead><tbody><tr><td>Produit</td><td>Sodium iodide (I-131) capsule T Curium, oral ; indication inclut goitre euthyroïdien.</td><td>Pas carbimazole ni capsule diagnostique d’iode 123.</td></tr><tr><td>Présentation</td><td>37–7400 mégabecquerels par capsule à la date de calibration.</td><td>Pas plage prescrite à toute personne <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.</td></tr><tr><td>Activité thérapeutique</td><td>Individualisée selon diagnostic, volume, fixation et clairance ; effet en semaines.</td><td>Pas dose fixe universelle ni traitement immédiat d’une compression.</td></tr><tr><td>Fonction rénale</td><td>Élimination retardée, exposition potentiellement accrue, attention/ajustement individualisés.</td><td>Pas formule de réduction copiée sans dosimétrie.</td></tr><tr><td>Enfant/adolescent</td><td>Bénéfice/risque soigneusement évalué, activité adaptée ou dosimétrie individuelle.</td><td>Pas simple transposition de l’adulte ni indication usuelle de tout nodule pédiatrique.</td></tr></tbody></table>
<p>FI juillet 2022, identifiant de produit 7680527280012, pas indication de cancer copiée vers goitre. Grossesse/allaitement contreindiqués, précautions de déglutition et rein. Effet retardé et risque gonflement : besoin de décompression rapide contreindique cette stratégie dans le guide spécialisé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</p>
</template>
<template data-pop="e04-contraste" data-title="Contraste iodé : risque ciblé et calendrier"><p>Une autonomie nodulaire peut exister malgré une fonction normale avant contraste. Le guide 2021 ne demande pas de contrôle systématique chez toute personne ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">TSH</a> ciblée chez sujets à risque et contrôle après trois à quatre semaines dans certains terrains à haut risque, notamment âgés/cardiaques. Le contraste peut réduire fixation scintigraphique/radioiode ; délai usuel un à deux mois selon contexte. Ne pas retarder une imagerie vitale par un algorithme ambulatoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
</template>
<template data-pop="e04-semio" data-title="Sémiologie : signe, mécanisme, test, action"><p>Décrire masse, douleur, évolution, voix, respiration et déglutition ; comprendre les rapports puis choisir bilan de fonction, échographie, prélèvement ou imagerie d’extension. Une <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">TSH</a> normale n’exclut ni cancer ni compression. Stridor/détresse : urgence adaptée. Le premier onglet scientifique développe neuf étapes et leurs sources [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
</template>

<template data-pop="e04-profiles" data-title="PROFILES : compétence et situations"><p>Le document suisse 2017 demande inspection/palpation des structures cervicales et de la thyroïde ; les situations incluent gonflement du cou/goitre et hormones thyroïdiennes anormales. Lien pédagogique à examen, raisonnement et communication, pas correspondance officielle <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">CIM</a>–<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> ni question garantie. Aucune numérotation héritée de coque n’est certifiée ici [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
</template>


<template data-pop="pareto-e04-1" data-title="Essentiel — Une masse cervicale avec une fonction normale"><p>Séparer gravité mécanique, fonction et risque tumoral. Une analyse hormonale normale ne remplace pas l’examen du cou [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e04-1"></p>
</template>
<template data-pop="pareto-e04-2" data-title="Essentiel — Définition et sous-codes : documenter avant de classer"><p>Couvrir <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.0, .1, .2, .8 et .9 ; ne pas classer automatiquement ici un goitre par carence iodée ou une maladie congénitale [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>].</p>
<p class="ratio" data-cover="e04-2"></p>
</template>
<template data-pop="pareto-e04-3" data-title="Essentiel — Fréquence : nodules, goitres et statut iodé"><p>Toujours nommer la population, la méthode et le dénominateur. Une fréquence de nodules n’est pas une incidence <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>].</p>
<p class="ratio" data-cover="e04-3"></p>
</template>
<template data-pop="pareto-e04-4" data-title="Essentiel — Du follicule normal au volume nodulaire"><p>Le volume, la fonction et la nature du tissu sont liés mais distincts. Le follicule normal aide à comprendre cette séparation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e04-4"></p>
</template>
<template data-pop="pareto-e04-5" data-title="Essentiel — Causes, risques et diagnostics à ne pas confondre"><p>Le contexte oriente sans remplacer l’évaluation du nodule. Un goitre est une description qui demande encore une explication [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e04-5"></p>
</template>
<template data-pop="pareto-e04-6" data-title="Essentiel — Anamnèse : évolution, compression et expositions"><p>La chronologie et les symptômes de compression sont aussi utiles que l’ancienne prise de sang. Identifier les expositions avant de choisir un examen [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e04-6"></p>
</template>
<template data-pop="pareto-e04-7" data-title="Essentiel — Sémiologie clinique : examiner le cou et la respiration"><p>Observer et décrire avant de conclure. Ni la mobilité à la déglutition ni l’absence de symptômes hormonaux ne certifient un nodule bénin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e04-7"></p>
</template>
<template data-pop="pareto-e04-8" data-title="Essentiel — Drapeaux rouges : choisir le délai et le niveau de soins"><p>La fonction normale ne protège pas d’une compression. La gravité respiratoire fixe la priorité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e04-8"></p>
</template>
<template data-pop="pareto-e04-9" data-title="Essentiel — Explorations : une question pour chaque examen"><p>L’échographie mesure la structure, la scintigraphie la fonction régionale et la cytologie les cellules. Leurs résultats ne sont pas interchangeables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e04-9"></p>
</template>
<template data-pop="pareto-e04-10" data-title="Essentiel — Différentiels : ce qui change réellement la décision"><p>Chercher l’élément qui sépare les hypothèses et change l’action. Le nombre de nodules et la <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">TSH</a> seule ne suffisent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e04-10"></p>
</template>
<template data-pop="pareto-e04-11" data-title="Essentiel — Traitement : une décision partagée et proportionnée"><p>Choisir entre surveillance, chirurgie, ablation et radioiode après avoir établi la question, la bénignité suffisamment documentée et les contraintes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e04-11"></p>
</template>
<template data-pop="pareto-e04-12" data-title="Essentiel — Suivi et pronostic : comparer ce qui est comparable"><p>Comparer mesures, symptômes et images antérieures. Croissance significative signifie réévaluer, pas conclure automatiquement au cancer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e04-12"></p>
</template>
<template data-pop="pareto-e04-13" data-title="Essentiel — Prévention et situations particulières"><p>Prévention nutritionnelle, supplément ciblé et radioiode ont des objectifs différents. Âge, grossesse, cœur et rein modifient les choix [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e04-13"></p>
</template>
<template data-pop="pareto-e04-14" data-title="Essentiel — Critères formels, cadre suisse et pièges d’examen"><p>Le diagnostic doit être descriptif, fonctionnel et raisonné. Les nombres gardent leur source, leur population et leur objectif [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e04-14"></p>
</template>
<template data-pop="pareto-e04-e-1" data-title="Essentiel — Échographie : risque, dimensions et ganglions"><p>Rapporter le score avec les dimensions et le cou entier. Le ganglion ou l’extension peut changer la décision avant un seuil dimensionnel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e04-e-1"></p>
</template>
<template data-pop="pareto-e04-e-2" data-title="Essentiel — Biologie et scintigraphie : lire la fonction"><p>La fonction biologique et la fonction régionale ne sont pas la cytologie. Un résultat doit garder sa méthode et son contexte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e04-e-2"></p>
</template>
<template data-pop="pareto-e04-e-3" data-title="Essentiel — Cytologie : ni score de fonction ni verdict universel"><p>Un prélèvement insuffisant ne rassure pas. Une atypie n’est pas synonyme de cancer ; la concordance et le contexte guident la suite [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e04-e-3"></p>
</template>
<template data-pop="pareto-e04-e-4" data-title="Essentiel — Comparer la croissance : un calcul explicite"><p>Un seul diamètre à 20% ne satisfait pas à lui seul le critère complet. Calculer, puis interpréter [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e04-e-4"></p>
</template>
<template data-pop="pareto-e04-s-anat-cours" data-title="Essentiel — Anatomie : rapports qui expliquent les symptômes"><p>Les rapports expliquent les symptômes mécaniques et les précautions du geste, indépendamment de la fonction hormonale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e04-s-anat-cours"></p>
</template>
<template data-pop="pareto-e04-s-histo-cours" data-title="Essentiel — Histologie : follicule, colloïde et limites du prélèvement"><p>La cytologie étudie ce qui a été prélevé. Interpréter sa qualité et sa concordance avant de décider [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e04-s-histo-cours"></p>
</template>
<template data-pop="pareto-e04-s-physio-cours" data-title="Essentiel — Physiologie : rétrocontrôle et autonomie régionale"><p>Euthyroïdie globale et hétérogénéité régionale peuvent coexister. La fonction ne révèle pas toute la structure [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e04-s-physio-cours"></p>
</template>
<template data-pop="pareto-e04-s-bioch-cours" data-title="Essentiel — Biochimie : iode, hormones et médicaments distincts"><p>Distinguer le substrat, l’hormone et l’activité radioactive avant de lire un chiffre ou de calculer une prise [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e04-s-bioch-cours"></p>
</template>
<template data-pop="pareto-e04-s-gene-cours" data-title="Essentiel — Génétique et immunologie : terrain, nodule et preuve"><p>Germinal, somatique et auto-immun ne sont pas synonymes. Un résultat moléculaire reste lié à sa validation et au contexte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e04-s-gene-cours"></p>
</template>
<template data-pop="pareto-e04-p-1" data-title="Essentiel — Avant un médicament : clarifier l’objectif"><p>L’indication précède la dose. Distinguer bénéfice attendu, information réglementaire et recommandation clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p class="ratio" data-cover="e04-p-1"></p>
</template>
<template data-pop="pareto-e04-p-2" data-title="Essentiel — Euthyrox : formulation, dose et risque de surtraitement"><p>Une quantité exacte n’est sûre qu’avec l’indication, l’unité et le suivi appropriés. Ne pas supprimer la <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">TSH</a> de routine pour un nodule euthyroïdien [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p class="ratio" data-cover="e04-p-2"></p>
</template>
<template data-pop="pareto-e04-p-3" data-title="Essentiel — Lévothyroxine : interactions, grossesse et allaitement"><p>Vérifier l’absorption et le contexte avant de changer une dose. La substitution nécessaire pendant grossesse est distincte d’une suppression de routine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p class="ratio" data-cover="e04-p-3"></p>
</template>
<template data-pop="pareto-e04-p-4" data-title="Essentiel — Radioiode : produit exact et dosimétrie"><p>Vérifier le produit et l’objectif avant les unités. La dosimétrie est individuelle et ne remplace pas l’évaluation de la compression [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e04-p-4"></p>
</template>
<template data-pop="pareto-e04-p-5" data-title="Essentiel — Radioiode : contre-indications, interactions et entourage"><p>Grossesse, allaitement, déglutition et interactions sont vérifiés avant la capsule. Les divergences de délais doivent être résolues par l’équipe, pas masquées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e04-p-5"></p>
</template>
<template data-pop="pareto-e04-p-6" data-title="Essentiel — Iode nutritionnel : concentration et apport total"><p>Lire concentration, apport total et objectif séparément. Ni plus de sel ni plus de complément n’est une réponse automatique à <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodtabletten-fuer-stillende-muetter-und-die-jodversorgung-von-saeuglingen" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/dam/de/sd-web/DknRSfuZymhE/faq-jod-supplement-de.pdf" target="_blank" rel="noopener">S11</a>].</p>
<p class="ratio" data-cover="e04-p-6"></p>
</template>
