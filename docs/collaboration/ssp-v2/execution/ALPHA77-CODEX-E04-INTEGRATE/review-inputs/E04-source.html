<template id="ch-E04"><div class="chap"><style>[data-e04-table="1"]{font-size:inherit!important;display:block;max-width:100%;overflow-x:auto}[data-e04-table="1"] th,[data-e04-table="1"] td{font-size:inherit!important;min-width:9em}[data-e04-frame]{position:relative}[data-e04-frame] img{display:block;max-width:100%;height:auto}[data-e04-marker]{position:absolute;background:#123d4e;color:white;border:2px solid white;border-radius:50%;padding:1px 4px;font-weight:bold;font-size:clamp(8px,1vw,12px);line-height:1.2}[data-e04-pin="1"]{left:44%;top:16%}[data-e04-pin="2"]{left:47%;top:24%}[data-e04-pin="3"]{left:40%;top:50%}[data-e04-pin="4"]{left:53%;top:84%}</style><div class="chap-head"><div class="code"><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> · Autres goitres non toxiques · Endocrinologie et métabolisme</div><h1>Autres goitres non toxiques</h1><span class="status">Production Sol du 2 novembre 2026 · Sources datées suisses et européennes · Auto-relecture, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e04-1">Une masse cervicale avec une fonction normale</a></li><li><a href="#e04-2">Définition et sous-codes : documenter avant de classer</a></li><li><a href="#e04-3">Fréquence : nodules, goitres et statut iodé</a></li><li><a href="#e04-4">Du follicule normal au volume nodulaire</a></li><li><a href="#e04-5">Causes, risques et diagnostics à ne pas confondre</a></li><li><a href="#e04-6">Anamnèse : évolution, compression et expositions</a></li><li><a href="#e04-7">Sémiologie clinique : examiner le cou et la respiration</a></li><li><a href="#e04-8">Drapeaux rouges : choisir le délai et le niveau de soins</a></li><li><a href="#e04-9">Explorations : une question pour chaque examen</a></li><li><a href="#e04-10">Différentiels : ce qui change réellement la décision</a></li><li><a href="#e04-11">Traitement : une décision partagée et proportionnée</a></li><li><a href="#e04-12">Suivi et pronostic : comparer ce qui est comparable</a></li><li><a href="#e04-13">Prévention et situations particulières</a></li><li><a href="#e04-14">Critères formels, cadre suisse et pièges d’examen</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e04-1"><h2><span class="n">1</span>Une masse cervicale avec une fonction normale</h2><p>Une patiente fictive de cinquante-six ans consulte parce que son col devient serré. Elle ne décrit ni palpitations ni amaigrissement ; une prise de sang antérieure était annoncée normale. À la palpation, la thyroïde paraît augmentée et irrégulière. Il reste pourtant trois questions différentes : existe-t-il une complication mécanique, quelle est la fonction hormonale, et les nodules comportent-ils un risque tumoral ? Une réponse rassurante à une question ne répond pas aux deux autres [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Le mot « non toxique » signifie que le goitre n’est pas associé à une hyperthyroïdie dans le tableau considéré. Il ne signifie pas « sans danger », « non compressif » ou « cancer exclu ». Une thyroïde peut augmenter de volume tout en maintenant une production hormonale normale ; un cancer peut aussi se présenter chez une personne euthyroïdienne [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>La formation suisse <button class="w" data-k="e04-profiles">PROFILES</button> demande d’inspecter et palper la thyroïde et les structures cervicales, de raisonner devant un gonflement du cou ou un goitre, et d’interpréter des hormones thyroïdiennes anormales. Ces objectifs soutiennent cette démarche, sans constituer une correspondance officielle entre un code et une question d’examen. La vignette et ses données sont pédagogiques [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> Séparer gravité mécanique, fonction et risque tumoral. Une analyse hormonale normale ne remplace pas l’examen du cou [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-2"><h2><span class="n">2</span>Définition et sous-codes : documenter avant de classer</h2><p>Le catalogue suisse local 2024 donne <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> — Autres goitres non toxiques. Un goitre décrit une augmentation de la glande ; un nodule est une lésion qui se distingue du tissu environnant à l’échographie. La présence d’un petit nodule n’implique donc pas à elle seule que tout le volume glandulaire soit augmenté. Décrire la morphologie et la fonction évite de confondre ces dimensions [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<table class="t" data-e04-table="1"><thead><tr><th>Sous-code suisse</th><th>Libellé</th><th>Précision utile</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.0</td><td>Goitre diffus non toxique</td><td>Augmentation diffuse ; les notes allemandes incluent goitre simple et colloïde.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.1</td><td>Nodule thyroïdien simple non toxique</td><td>Nodule unique, notamment kystique selon les inclusions ; « simple » ne remplace pas évaluation du risque.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.2</td><td>Goitre multinodulaire non toxique</td><td>Plusieurs nodules, y compris formes kystiques multiples.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.8</td><td>Autres goitres non toxiques précisés</td><td>Une forme précisée ne relevant pas des précédentes doit être documentée.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.9</td><td>Goitre non toxique, sans précision</td><td>Réserver à une documentation insuffisante ; ne pas effacer une morphologie connue.</td></tr></tbody></table>
<p>Les notes excluent les goitres liés à une carence en iode, classés <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E00</a>–<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E02</a>, et le goitre congénital diffus, classé <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E03</a>.0. Une histoire ancienne de carence régionale peut contribuer au terrain nodulaire ; elle ne prouve pas à elle seule la cause actuelle d’un goitre individuel. À l’inverse, une carence iodée causale établie demande de reconsidérer le code [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>].</p>
<p>Les libellés français proviennent des métadonnées suisses locales ; les inclusions/exclusions ont été confrontées au texte allemand 2024. Le document officiel <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS</a> intégral n’a pas été relu pour cette leçon : il ne s’agit pas d’une certification de codage individuel ou de remboursement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>].</p>
<div class="key"><b>À retenir.</b> Couvrir <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.0, .1, .2, .8 et .9 ; ne pas classer automatiquement ici un goitre par carence iodée ou une maladie congénitale [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-3"><h2><span class="n">3</span>Fréquence : nodules, goitres et statut iodé</h2><p>Aucune incidence suisse contemporaine spécifique de <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> n’a été établie dans les lectures ciblées. L’absence de chiffre dans ce dossier ne démontre pas l’absence de maladie. Une série de nodules découverts à l’échographie, un registre de chirurgie et une enquête sur l’iode ne mesurent pas le même événement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://www.revmed.ch/view/399468/3537941/RMS_699_1311.pdf" target="_blank" rel="noopener">S17</a>].</p>
<p>Le guide européen 2023 indique que des nodules peuvent être détectés chez jusqu’à 60% des adultes selon les populations et la méthode d’imagerie. Ils deviennent plus fréquents avec l’âge et sont plus souvent trouvés chez les femmes. Ce chiffre ne représente ni la prévalence suisse des goitres <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ni une indication de dépister tout adulte asymptomatique. Le guide estime le risque de malignité autour de 1–5% dans des populations non sélectionnées ; une consultation spécialisée ou une sélection chirurgicale change le dénominateur [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>En Suisse, le monitoring 2020–2022 a mesuré une iodurie médiane de 127 µg/l chez 362 enfants de six à douze ans, et de 97 µg/l chez 473 femmes enceintes. La couverture était considérée adéquate chez les enfants et insuffisante au niveau populationnel chez les femmes enceintes. Ces concentrations urinaires ne comptent pas les goitres et un échantillon urinaire isolé ne devient pas un diagnostic individuel de carence causale [<a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>].</p>
<p>Chez les femmes enceintes de cette enquête, 47% déclaraient un supplément ; les médianes étaient 88 µg/l sans supplément et 140 µg/l avec. L’amélioration du marqueur ne permet pas d’affirmer que toute personne supplémentée atteignait l’objectif, ni que tout goitre suisse était lié à une carence [<a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Toujours nommer la population, la méthode et le dénominateur. Une fréquence de nodules n’est pas une incidence <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-4"><h2><span class="n">4</span>Du follicule normal au volume nodulaire</h2><p>La thyroïde normale comprend deux lobes réunis par un isthme devant la trachée. Les cellules folliculaires entourent une lumière contenant la colloïde et la thyroglobuline. Elles captent l’iodure, fabriquent les hormones et les libèrent sous le contrôle de la thyréostimuline hypophysaire, ou <button class="w" data-k="e04-tsh">TSH</button>. Le rétrocontrôle ajuste la production ; la taille et l’architecture ne se déduisent pas directement d’un seul dosage [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>Une prolifération, une accumulation de colloïde, une dégénérescence kystique ou des remaniements de nodules peuvent augmenter le volume sans entraîner immédiatement une hyperthyroïdie. Un goitre multinodulaire est hétérogène : tous les nodules n’ont pas forcément la même fonction, la même structure ou le même risque [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Une croissance vers les espaces profonds peut déplacer ou comprimer la trachée et l’œsophage. L’effet dépend du siège, de la forme et des rapports anatomiques, pas seulement du diamètre maximal externe. C’est pourquoi des symptômes respiratoires, une dysphagie ou une modification de voix doivent être explorés même si le bilan hormonal reste normal [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Enfin, une zone peut devenir autonome et répondre moins au contrôle hypophysaire. La <button class="w" data-k="e04-tsh">TSH</button> peut alors baisser, parfois avant l’augmentation des hormones libres. Une charge iodée importante peut révéler une production excessive sur ce terrain ; une fonction normale au départ n’élimine pas toute autonomie ni tout risque après contraste [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Structure et volume</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Fonction hormonale</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Risque et retentissement</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Trois dimensions à évaluer ensemble ; les flèches organisent le raisonnement, elles ne décrivent pas une succession obligatoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Le volume, la fonction et la nature du tissu sont liés mais distincts. Le follicule normal aide à comprendre cette séparation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-5"><h2><span class="n">5</span>Causes, risques et diagnostics à ne pas confondre</h2><p>L’histoire iodée et familiale, l’âge, les antécédents de maladie thyroïdienne et les expositions participent au raisonnement. Un médicament iodé ou une injection de contraste doit être recherché, surtout lorsqu’une anomalie fonctionnelle apparaît. Les compléments alimentaires et les algues peuvent aussi apporter des quantités variables d’iode ; « naturel » ne signifie pas dose faible et constante [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Une irradiation cervicale pendant l’enfance, une histoire familiale de cancer thyroïdien ou de syndrome de prédisposition renforcent l’attention portée à une lésion. Ils ne prouvent pas qu’un nodule donné est malin. Des nodules multiples et apparemment bénins ne dispensent pas d’identifier les plus suspects à l’échographie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<p>Une thyroïdite auto-immune ou inflammatoire peut augmenter le volume et produire des zones ressemblant à des nodules. Une maladie de Basedow peut donner un goitre avec hyperthyroïdie ; une tumeur, un ganglion ou une lésion d’un autre organe cervical peut imiter une masse thyroïdienne. Ces hypothèses demandent leur évaluation et, lorsqu’elles sont établies, leur classification propre [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Chez l’enfant ou en présence de manifestations syndromiques, certaines prédispositions comme <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">DICER1</a> ou le syndrome lié à <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">PTEN</a> peuvent s’accompagner d’un goitre multinodulaire. Elles justifient une orientation ciblée selon l’ensemble clinique et familial, pas un séquençage systématique de tout adulte présentant <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> Le contexte oriente sans remplacer l’évaluation du nodule. Un goitre est une description qui demande encore une explication [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-6"><h2><span class="n">6</span>Anamnèse : évolution, compression et expositions</h2><p>Préciser date de découverte, changement du volume, douleur ou gonflement soudain, gêne esthétique, difficulté à avaler, voix modifiée, dyspnée et gêne en position couchée. Une aggravation rapide ne se résume pas à « le goitre a grandi » : elle peut traduire une hémorragie, une inflammation ou un processus tumoral et doit être confrontée à l’état respiratoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Demander symptômes de fonction excessive ou insuffisante, antécédents de chirurgie, irradiation, ponction et résultats anciens. Une ancienne cytologie dite bénigne est utile si l’on sait quel nodule avait été ponctionné, à quelle date et avec quelle concordance échographique. Un goitre ancien n’assure pas que toute nouvelle modification est sans importance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Rechercher antécédents familiaux de cancer, notamment médullaire, et de néoplasie endocrinienne multiple de type 2. Documenter grossesse, projet de grossesse, allaitement, comorbidités cardiaques et rénales, ainsi que médicaments, biotine, amiodarone, hormones, iode et contraste récent. Ces éléments peuvent modifier le choix des examens et traitements [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Enfin, demander ce qui gêne réellement la personne et ce qu’elle attend : rassurance argumentée, amélioration de la déglutition, réduction du volume ou certitude diagnostique. Surveillance et intervention ont chacune des contraintes ; expliquer les alternatives est une partie du soin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> La chronologie et les symptômes de compression sont aussi utiles que l’ancienne prise de sang. Identifier les expositions avant de choisir un examen [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-7"><h2><span class="n">7</span>Sémiologie clinique : examiner le cou et la respiration</h2><div data-semiology-clinical="E04"><p><button class="w" data-k="e04-semio">La sémiologie clinique</button> commence par l’état général, la respiration et la voix, puis relie inspection, palpation et bilan. Une masse mobile à la déglutition est compatible avec une origine thyroïdienne mais ne suffit pas à affirmer sa nature bénigne. Un examen rassurant ne remplace pas une échographie indiquée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
</div><p>Inspecter le cou au repos et pendant la déglutition, rechercher asymétrie, augmentation visible et circulation veineuse anormale. Palper doucement les lobes et l’isthme, apprécier consistance, mobilité, douleur, contours et nodules perceptibles. Examiner les aires ganglionnaires cervicales. Noter si le pôle inférieur est accessible ; la palpation n’exclut pas une extension rétrosternale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<p>Une lésion dure ou fixée, un ganglion suspect, une voix nouvellement rauque ou une croissance préoccupante renforcent la suspicion et accélèrent l’évaluation. Leur absence ne constitue pas un test d’exclusion du cancer. Aucune sensibilité ou spécificité universelle de la palpation n’est établie dans les lectures : la performance dépend notamment de la taille, du siège et de l’examinateur [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Décrire les signes fonctionnels avec fréquence cardiaque, tremblement et autres observations pertinentes. Un tableau hormonal doit être confirmé biologiquement et expliqué ; ne pas transformer l’absence de tremblement en preuve d’euthyroïdie. Une détresse respiratoire fait passer les soins urgents avant le bilan ambulatoire complet [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Observer et décrire avant de conclure. Ni la mobilité à la déglutition ni l’absence de symptômes hormonaux ne certifient un nodule bénin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-7">Essentiel de cette partie</button></section>

<section class="ilot" id="e04-8"><h2><span class="n">8</span>Drapeaux rouges : choisir le délai et le niveau de soins</h2><div class="alert"><b>Urgence respiratoire.</b> Stridor, détresse respiratoire ou aggravation aiguë avec gêne majeure imposent une évaluation urgente des voies aériennes et une équipe adaptée. Ne pas attendre une ponction programmée ou l’effet retardé du radioiode pour décomprimer une situation critique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</div><table class="t" data-e04-table="1"><thead><tr><th>Observation</th><th>Question</th><th>Action</th></tr></thead><tbody><tr><td>Gonflement soudain, douleur, gêne respiratoire</td><td>Hémorragie ou autre complication compressive ?</td><td>Évaluation urgente selon retentissement, sécurisation respiratoire si nécessaire.</td></tr><tr><td>Voix modifiée, masse fixée, ganglion suspect, croissance inquiétante</td><td>Atteinte nerveuse ou lésion tumorale ?</td><td>Évaluation spécialisée accélérée, échographie et prélèvement ciblé selon contexte.</td></tr><tr><td>Dyspnée positionnelle, dysphagie, goitre profond</td><td>Extension rétrosternale et rapports trachée/œsophage ?</td><td>Imagerie d’extension et discussion spécialisée ; urgence selon gravité.</td></tr><tr><td>Palpitations ou décompensation après contraste</td><td>Hyperthyroïdie induite sur autonomie ?</td><td>Fonction thyroïdienne et évaluation clinique, prise en charge rapide si état cardiaque/clinique préoccupant.</td></tr></tbody></table>
<p>Aucun délai numérique unique n’est applicable à tous les signes suspects. Le guide européen distingue les caractéristiques préoccupantes et les indications d’investigation ; la priorité concrète dépend de la respiration, de l’évolution et des ressources. Un symptôme stable mérite également une réponse organisée et un contact en cas d’aggravation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Le radioiode réduit progressivement le volume ; une inflammation ou un gonflement transitoire peut survenir. Il n’est donc pas une réponse à un besoin de décompression trachéale rapide. Une suspicion de cancer demande son propre parcours diagnostique, avant un traitement de réduction supposé bénin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> La fonction normale ne protège pas d’une compression. La gravité respiratoire fixe la priorité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-8">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-9"><h2><span class="n">9</span>Explorations : une question pour chaque examen</h2><p>Le bilan initial associe histoire, examen, fonction thyroïdienne et échographie cervicale. La <button class="w" data-k="e04-tsh">TSH</button> est le premier test biologique ; si elle est basse, mesurer la thyroxine libre, puis la triiodothyronine libre si la première est normale. Si elle est élevée, mesurer thyroxine libre et anticorps antithyroperoxydase selon la situation. Les intervalles de référence dépendent du laboratoire, de la méthode, de l’âge et de la grossesse : pas de norme numérique unique attribuée à tout <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>].</p>
<p>L’échographie décrit volume glandulaire, caractéristiques et dimensions des nodules, ainsi que ganglions centraux et latéraux. Dans un goitre multiple, la sélection ne porte pas seulement sur le plus gros nodule. La catégorie <button class="w" data-k="e04-tirads">EU-TIRADS</button> et les signes d’extension ou ganglions suspects aident à choisir la cytoponction ; le score ne comprend pas à lui seul l’examen ganglionnaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>La scintigraphie renseigne sur la fonction régionale ; elle est indiquée si la <button class="w" data-k="e04-tsh">TSH</button> est sous la normale. Dans un terrain de carence iodée actuelle ou ancienne et un goitre multinodulaire, elle peut aussi être discutée avec <button class="w" data-k="e04-tsh">TSH</button> normale. Un nodule hyperfonctionnel n’est généralement pas ponctionné sauf suspicion particulière ; « chaud » ne signifie toutefois pas impossibilité absolue de cancer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Une tomodensitométrie ou une imagerie par résonance magnétique sert à évaluer extension profonde et rapports compressifs, pas à remplacer systématiquement l’échographie initiale. Le <button class="w" data-k="e04-contraste">contraste iodé</button> demande une évaluation du risque fonctionnel et peut perturber une scintigraphie ou un radioiode ultérieurs. La thyroglobuline sanguine n’est pas un test initial de dépistage du cancer nodulaire ; le dosage de calcitonine est ciblé selon le contexte, sans consensus européen pour ou contre son dosage chez tout nodule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> L’échographie mesure la structure, la scintigraphie la fonction régionale et la cytologie les cellules. Leurs résultats ne sont pas interchangeables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-9">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-10"><h2><span class="n">10</span>Différentiels : ce qui change réellement la décision</h2><p>Un goitre diffus ou nodulaire euthyroïdien n’est retenu qu’après confrontation au contexte. La dénomination <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ne doit pas servir à fermer le diagnostic devant une maladie causale ou un cancer documentés [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<table class="t" data-e04-table="1"><thead><tr><th>Hypothèse</th><th>Élément discriminant</th><th>Conséquence</th></tr></thead><tbody><tr><td>Goitre lié à carence iodée</td><td>Contexte et carence causale établie, pas seule iodurie ponctuelle.</td><td>Étiologie et code <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E00</a>–<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E02</a> à reconsidérer.</td></tr><tr><td>Goitre toxique / autonomie</td><td><button class="w" data-k="e04-tsh">TSH</button> basse, hormones et scintigraphie selon situation.</td><td>Parcours de dysfonction, pas simple maintien <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> par ancien libellé.</td></tr><tr><td>Thyroïdite</td><td>Douleur ou contexte inflammatoire/auto-immun, biologie et aspect diffus concordants.</td><td>Reconnaître maladie causale ; pseudo-nodule possible.</td></tr><tr><td>Cancer thyroïdien</td><td>Signes échographiques, ganglion, cytologie/histologie selon cas.</td><td>Fonction normale non exclusive ; parcours spécialisé.</td></tr><tr><td>Kyste ou nodule bénin</td><td>Aspect et cytologie si indiquée, concordance clinique.</td><td>Surveillance ou traitement selon gêne, récidive et risque.</td></tr><tr><td>Masse non thyroïdienne</td><td>Rapports anatomiques, échographie et examen ganglionnaire.</td><td>Autre origine cervicale, exploration ciblée.</td></tr></tbody></table>
<p>Une cytologie bénigne discordante avec une échographie très suspecte mérite une réévaluation. Un prélèvement non diagnostique n’est pas synonyme de bénignité ; une cytologie folliculaire indéterminée ne devient pas automatiquement un cancer. L’interprétation est intégrée à la taille, aux symptômes, à l’histoire et aux préférences [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Chercher l’élément qui sépare les hypothèses et change l’action. Le nombre de nodules et la <button class="w" data-k="e04-tsh">TSH</button> seule ne suffisent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-10">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-11"><h2><span class="n">11</span>Traitement : une décision partagée et proportionnée</h2><p>Un nodule bénin, asymptomatique et concordant avec l’évaluation peut être surveillé. Un traitement vise une question concrète : compression, gêne esthétique importante, récidive kystique, risque ou incertitude diagnostique. Ni découverte fortuite ni augmentation de taille isolée ne donnent une indication uniforme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>La chirurgie permet une réduction rapide et une analyse histologique. Elle est discutée selon symptômes, extension profonde, cytologie, taille et risque, terrain et préférence. Une lésion limitée à un lobe et un goitre bilatéral ne réclament pas toujours le même geste ; l’équipe explique risque nerveux, risque parathyroïdien et besoin éventuel de substitution. La possibilité de considérer une chirurgie pour un nodule bénin d’au moins 4 cm ne signifie pas obligation pour tous [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>L’alcoolisation est une option privilégiée pour un kyste pur ou majoritairement kystique symptomatique. Une ablation thermique peut traiter certains nodules solides bénins symptomatiques ; une preuve de bénignité, la concordance, la situation des cordes vocales et les risques de saignement sont vérifiés avant. Dans un goitre multiple, elle vise surtout une cible dominante bien définie ; elle n’est pas automatiquement un traitement de toute la glande [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Le radioiode est une alternative spécialisée pour certains goitres multinodulaires bénins symptomatiques, notamment si le risque chirurgical est important. Il agit lentement et exige évaluation de fixation, dosimétrie, contre-indications et radioprotection. La <button class="w" data-k="e04-levothyroxine">lévothyroxine</button> n’est pas un traitement systématique de la maladie nodulaire euthyroïdienne dans le guide européen 2023 ; l’indication présente dans une FI doit rester distincte de la décision de traiter [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<div class="key"><b>À retenir.</b> Choisir entre surveillance, chirurgie, ablation et radioiode après avoir établi la question, la bénignité suffisamment documentée et les contraintes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-11">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-12"><h2><span class="n">12</span>Suivi et pronostic : comparer ce qui est comparable</h2><p>La surveillance dépend de la catégorie échographique, de la taille, de la cytologie et des symptômes. <button class="w" data-k="e04-croissance">Une croissance significative</button> correspond à une augmentation d’au moins 20% de deux diamètres avec au moins 2 mm d’augmentation, ou une hausse de volume supérieure à 50%. Ces critères déclenchent une réévaluation ; ils ne constituent pas une preuve de cancer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Pour des nodules asymptomatiques non ponctionnés, le guide 2023 propose par exemple une réévaluation à trois à cinq ans pour certaines lésions <button class="w" data-k="e04-tirads">EU-TIRADS</button> 2 de plus 10 mm ou 3 de 10–20 mm, à un an pour 4 de moins 15 mm, et tous les six à douze mois pour 5 de moins 10 mm. Les petits nodules 2 ou 3 de 5–10 mm peuvent ne pas nécessiter d’autre contrôle. Les calendriers gardent leurs populations et leurs exceptions ; les preuves sur la durée optimale du suivi sont limitées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Une nouvelle gêne, une voix modifiée, une évolution échographique ou un ganglion suspect demande une réévaluation hors calendrier. Après deux cytologies bénignes, une nouvelle biopsie n’est généralement plus nécessaire ; une discordance ou un nouveau problème clinique reste une autre question [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Après traitement, suivre volume et symptômes, fonction thyroïdienne et effets indésirables. Le radioiode peut conduire à une hypothyroïdie tardive ; la surveillance reste prolongée. Une réduction de volume ne prouve pas la disparition de tout risque ni la guérison d’une maladie indépendante. Le plan de suivi doit être communiqué et compréhensible [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Comparer mesures, symptômes et images antérieures. Croissance significative signifie réévaluer, pas conclure automatiquement au cancer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-12">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-13"><h2><span class="n">13</span>Prévention et situations particulières</h2><p>La prévention iodée suisse repose notamment sur le sel enrichi à 25 mg d’iode par kilogramme. Il s’agit de choisir du sel iodé dans la quantité de sel utilisée, pas d’augmenter les apports en sel. Un complément d’iode ou de sélénium n’est pas recommandé de routine chez une population suffisamment couverte ; une carence documentée se traite dans son contexte et peut modifier le classement étiologique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/dam/de/sd-web/DknRSfuZymhE/faq-jod-supplement-de.pdf" target="_blank" rel="noopener">S11</a>].</p>
<p>Grossesse et allaitement modifient les besoins et le choix des examens. Le radioiode thérapeutique est contre-indiqué ; échographie et raisonnement spécialisé évitent d’abandonner le bilan d’un nodule suspect. Une substitution de <button class="w" data-k="e04-levothyroxine">lévothyroxine</button> réellement nécessaire ne doit pas être interrompue parce qu’une grossesse commence. Le conseil <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV</a> de 250 µg/j pendant allaitement concerne l’apport total ; ce n’est pas une dose universelle de comprimé à ajouter à tous les aliments [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodtabletten-fuer-stillende-muetter-und-die-jodversorgung-von-saeuglingen" target="_blank" rel="noopener">S10</a>].</p>
<p>Chez l’enfant, les seuils dimensionnels de ponction des adultes ne se transposent pas directement. Le guide européen pédiatrique demande une échographie complète du cou, une analyse des caractéristiques et un parcours spécialisé si suspicion. Les lésions bénignes sont suivies avec nouvelle ponction si évolution suspecte ; bénéfices et risques d’une intervention sont discutés avec la famille [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<p>Chez la personne âgée ou cardiaque, les conséquences d’un surtraitement hormonal et d’une hyperthyroïdie après charge iodée peuvent être importantes. L’insuffisance rénale peut retarder l’élimination du radioiode ; l’activité et les mesures sont individualisées. L’absence de schéma chiffré rénal ou hépatique ne justifie pas d’en inventer un [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Prévention nutritionnelle, supplément ciblé et radioiode ont des objectifs différents. Âge, grossesse, cœur et rein modifient les choix [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-13">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-14"><h2><span class="n">14</span>Critères formels, cadre suisse et pièges d’examen</h2><div class="alert"><b>Formulation du diagnostic.</b> Décrire goitre diffus, nodule unique ou goitre multinodulaire, préciser l’état fonctionnel, les symptômes et les éléments de risque, puis vérifier la maladie causale et les exclusions. Une <button class="w" data-k="e04-tsh">TSH</button> normale n’est pas un critère de bénignité ; une cytologie non diagnostique n’est pas une preuve de tissu sain [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><div class="key"><b>Paramètres utiles.</b> Chez l’adulte, ponction <button class="w" data-k="e04-tirads">EU-TIRADS</button> 3 si diamètre > 20 mm, 4 si > 15 mm, 5 si > 10 mm ; ganglion suspect ou extension peuvent modifier l’indication indépendamment du score. Croissance : 20% dans deux diamètres avec 2 mm minimum, ou volume > 50%. Sel iodé suisse 25 mg/kg : concentration du sel, pas dose quotidienne de supplément [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>].</div><p>En Suisse, le radioiode relève d’une structure autorisée et d’une planification individuelle. La directive <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">OFSP</a> 2025 prévoit pour l’iode 131 un traitement résidentiel dès 200 mégabecquerels, une durée minimale de 48 heures et un débit de dose inférieur à 10 µSv/h à un mètre comme critère de sortie supplémentaire. Des exceptions ambulatoires entre 200 et 400 mégabecquerels requièrent une autorisation préalable ; ces chiffres sont des critères de radioprotection et non une dose à prescrire à tout goitre [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Aucune obligation générale propre <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> de déclaration, de mesure Suva, d’invalidité ou de restriction de conduite n’a été établie dans ces lectures. La FI Curium indique une influence nulle ou négligeable sur la conduite, sans études correspondantes ; l’état réel et les autres traitements restent évalués. Le code ne promet ni remboursement automatique, ni disponibilité actuelle d’un produit, ni accès à toute technique [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Pour l’examen, expliquer pourquoi « non toxique » ne signifie pas bénin, pourquoi le plus gros nodule n’est pas toujours la meilleure cible, et pourquoi un seuil de ponction n’est pas un seuil de chirurgie. Justifier le niveau de soins, les limites du test et le suivi. Audit différé — revue par intelligence artificielle, distincte d’une validation médicale humaine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> Le diagnostic doit être descriptif, fonctionnel et raisonné. Les nombres gardent leur source, leur population et leur objectif [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-14">Essentiel de cette partie</button></section>
<div class="src"><h3>Sources effectivement consultées</h3><ul data-justification-sources="1"><li><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] Libellés suisses locaux E04 et sous-codes</a> — <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">CIM</a>-10-GM2024. Entrées <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.0, .1, .2, .8, .9. Limites : Métadonnées dérivées ; document officiel <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS</a> intégral non relu, pas certification de codage 2026.</li><li><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">[S2] Notes de classification E04</a> — 2024. Bloc <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E00</a>–E07 : <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E03</a>.0 et ensemble <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>. Limites : Pas une recommandation thérapeutique ni édition suisse 2026.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">[S3] Clinical practice guidelines for thyroid nodule management</a> — 2023. Corps introduction, méthodes, tableau 1/notes, tableaux 3–6, biologie/échographie/cytologie/moléculaire/imagerie et traitements jusqu’à conclusion. Limites : Pas seuil pédiatrique ; <button class="w" data-k="e04-cyto">Bethesda</button> tableau 2017, troisième édition parue après manuscrit ; performance dépend population. Ne pas reprendre performances commerciales comme validation suisse.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">[S4] Radioiodine therapy of benign thyroid disease</a> — 2023. Section non-toxic goiter : définition, indications, contre-indications, préparation, traitement et rhTSH ; sections générales ciblées. Limites : Contient contextes carence iodée hors <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> si prouvée, et une incidence textuelle incohérente non reprise. Pas fondement de doses de FI.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">[S5] Euthyrox : information professionnelle exacte</a> — Février 2023. Composition, indications, posologie, populations, contre-indications, interactions, grossesse/allaitement, effets et miseàjour. Limites : Indication de FI goitre bénin euthyroïdien 75–200 µg/j ne devient pas recommandation de traiter tous nodules ; doses pédiatriques congénitales hors <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> non transposées.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">[S6] Sodium iodide (I-131) capsule T Curium</a> — Juillet 2022. Indication, posologie, rein/enfant, contre-indications, sécurité/interactions, grossesse/allaitement, miseàjour ; pas tables dosimétriques tousorganes reprises. Limites : Plage de présentation non dose standard <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>. Texte interne 2 jours versus 3 jours carbimazole et conseils conception 6–12 mois versus contraception 6 mois bénin : ne pas harmoniser, plan spécialisé. Ne pas certifier stock 2026.</li><li><a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">[S7] Radiothérapie métabolique</a> — V2,24 juin 2025. p 1–4, tableau 1 et 1.1–1.5. Limites : Directive de radioprotection, pas FI ni indication clinique. Pas extrapolation des règles Lu 177 au 131.</li><li><a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">[S8] Sel iodé</a> — Page consultée 2 nov 2026. Corps entier, stratégie iodation et alimentation. Limites : Page grandpublic, pas incidence <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ni justification supplément à tous ; dates de pièces jointes non dates de nouvelle recommandation.</li><li><a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">[S9] Monitoring de la couverture iodée suisse</a> — Enquête 2020–2022, page consultée 2026. Corps entier, échantillons/médianes et limites. Limites : Statut populationnel, pas incidence goitre, pas diagnostic individuel par spot ; moyenne normale fonction ne prouve pas suffisance iodée de toute grossesse.</li><li><a data-reference-source="1" href="https://www.blv.admin.ch/de/jodtabletten-fuer-stillende-muetter-und-die-jodversorgung-von-saeuglingen" target="_blank" rel="noopener">[S10] Iode chez mère allaitante et nourrisson</a> — Étude 2021–2024, page consultée 2026. Corps entier et taille/population étude. Limites : Petit essai et information institutionnelle, pas publication indépendante relue ni dose 0–300 µg recommandée.</li><li><a data-reference-source="1" href="https://www.blv.admin.ch/dam/de/sd-web/DknRSfuZymhE/faq-jod-supplement-de.pdf" target="_blank" rel="noopener">[S11] FAQ supplémentation iodée</a> — Octobre 2024. Deux pages entières. Limites : Upload 2026 ne renouvelle pas version 2024 ; restriction temporaire pré-radioiode distincte de régime courant.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">[S12] Iodine-based contrast media-induced thyroid dysfunction</a> — 2021. Passages PMC lignes 147–343 : méthode, recommandations 1–22, facteurs, surveillance. Limites : Passages textuels réellement relus, pas HTML homonyme qui contient CAPTCHA. Pas doses antithyroïdiennes copiées sans FI.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">[S13] Pediatric thyroid nodules and differentiated thyroid carcinoma</a> — 2022. Méthode, tableau 3 partieB, sectionsB1–B2 et tableau 5 génétique, recommandations 3/4/7. Limites : Guide européen ayant repris certaines opinions ATA2015 déclarées niveau 4 ; pas conduite fondée directement sur recommandation américaine. Seuils adultes non transposables.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">[S14] Thyroid gland : science normale</a> — AnatomyPhysiology 2 e. Anatomie, follicule, synthèse/rétrocontrôle et légende 17.12 réellement relus. Limites : Manuel américain pour science normale seulement, pas recommandations cliniques ; raccourcis étiologiques pathologiques non repris.</li><li><a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1811_The_Thyroid_Gland.jpg" target="_blank" rel="noopener">[S15] Notice propre image 1811</a> — 19 juin 2013. Métadonnées auteur/crédit/licence, original 555506 octets réellement inspecté. Limites : Un original distinct réutilisé 2 fois, pas biopsie <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ni figure échographique de risque ; anglais original, repères FR superposés sans pixels modifiés.</li><li><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S16] PROFILES</a> — 2017. EPA2 m/2 n p 18, SSP37 et 163. Limites : Pas correspondance CIMofficielle ni prédiction question.</li><li><a data-reference-source="1" href="https://www.revmed.ch/view/399468/3537941/RMS_699_1311.pdf" target="_blank" rel="noopener">[S17] Diagnostic étiologique des nodules thyroïdiens</a> — 2020; 16: 1311–1315. p 1311 et début 1312 : introduction, collaboration et origine algorithme. Limites : Algorithme fondé AACE/ACE/AMEaméricain, NON utilisé pour seuils/conduite ; hiérarchie ETA2023 pour décisions.</li></ul><p>Audit différé — auto-relecture par intelligence artificielle, distincte d’une validation médicale humaine. Textes sources intégraux en cache externe ; paraphrases et métadonnées seulement dans le cours.</p>
