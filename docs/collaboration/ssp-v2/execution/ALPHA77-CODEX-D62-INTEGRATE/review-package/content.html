évision juillet 2022, modification mai 2023</b>. Positions sur carence sans anémie divergentes du Delphi et d’ECCO ; ne pas étendre aux indications rénales/cardiaques spécifiques.</li><li><b>HUG, enseignement hémogramme adulte, septembre 2019 — enseignement 9 septembre 2019</b>. Repères datés non norme nationale 2026 ; exemple avec unité <button class="w" data-k="d62-concentration">Hb</button> manifestement incohérente non utilisé.</li><li><b><button class="w" data-k="d62-profiles">PROFILES</button> 2017, situations de départ — 2017</b>. Référentiel 2017 distinct de <button class="w" data-k="d62-profiles">PROFILES</button> 2/examen 2028.</li><li><b>OFSP/<button class="w" data-k="d62-profiles">MEBEKO</button>, exigences examen 2026, §2 — exigences examen 2026</b>. Lecture parent partagée et attribuée ; n’anticipe pas les questions d’examen.</li><li><b>Swiss Medical Weekly 2025, transition <button class="w" data-k="d62-profiles">PROFILES</button> 2 — 2025</b>. Lecture parent partagée ; version d’enseignement distincte du cadre examen 2026.</li><li><b>OFSP, liste des spécialités — page consultée 2 novembre 2026</b>. Aucune limitation individuelle des produits étudiés n’est certifiée ici.</li><li><b>OFSP, cas particuliers, art. 71 a–d OAMal — page consultée 2 novembre 2026</b>. Explication générale, pas accord d’assurance ni garantie financière individuelle.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D60-D64?lang=fr" target="_blank" rel="noopener">[S601] CIM-10-GM 2024 français, D62</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S602] ICD-10-GM 2024 D62</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S613] Top 5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S616] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S617] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S618] Human blood smear — Кров людини</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S619] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S622] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S623] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S624] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S625] Swiss Medical Weekly 2025, transition PROFILES 2</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S626] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S627] OFSP, cas particuliers, art. 71 a–d OAMal</a>.</p></div></template>
<template data-pop="pareto-d62-cours" data-title="Loi de Pareto — Monographie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Reconnaître une perte encore active et sa tolérance.</li><li>L’hémoglobine initiale peut masquer la perte.</li><li>Contrôler la source ; contextualiser transfusion et <button class="w" data-k="d62-txa">TXA</button>.</li><li>Après stabilisation, rechercher carence et récidive.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></template>
<template data-pop="pareto-d62-examens" data-title="Loi de Pareto — Examens"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Relier chaque prélèvement aux pertes et traitements.</li><li>Numération, perfusion, coagulation et imagerie répondent à des questions différentes.</li><li>La compatibilité et l’identité font partie de la sécurité.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></template>
<template data-pop="pareto-d62-pharma" data-title="Loi de Pareto — Pharmacologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Nommer la fonction à corriger avant le produit.</li><li>Comparer indication clinique et <button class="w" data-k="d62-fi">FI</button> exacte.</li><li>Ne pas confondre dose, concentration, débit et besoin total.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a>.</p></div></template>
<template data-pop="pareto-d62-semio" data-title="Loi de Pareto — Sémiologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Associer signes de tolérance et mesures répétées.</li><li>Aucun signe ni chiffre isolé ne mesure la perte.</li><li>Le contexte détermine l’urgence et les objectifs.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="pareto-d62-anat" data-title="Loi de Pareto — Anatomie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Distinguer circulation, moelle et site de perte.</li><li>Une perte interne peut ne pas être visible.</li><li>Traiter la source et remplacer le sang répondent à deux besoins.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="pareto-d62-histo" data-title="Loi de Pareto — Histologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>La photographie montre une morphologie, pas une concentration.</li><li>Les indices sont des moyennes.</li><li>Les réticulocytes se lisent avec sévérité et chronologie.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S618] Human blood smear — Кров людини</a>.</p></div></template>
