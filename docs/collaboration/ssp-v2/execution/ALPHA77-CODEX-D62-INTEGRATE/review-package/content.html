<figure id="d62-science-marrow" data-origin="human-original"><img src="assets/img/d62/alpha/codex/normal-marrow-openstax2016.jpg" alt="Photographie de coupe osseuse avec travées claires et espaces médullaires rouges" loading="lazy"><figcaption><b>Le tissu médullaire qui renouvelle le sang.</b> <b>Repère 1, centre rouge :</b> tissu médullaire entre les travées. <b>Repère 2, travées pâles :</b> charpente de l’os spongieux. <b>Repère 3, bord de la pièce :</b> limite osseuse du compartiment. <b>Repère 4, barre blanche supérieure :</b> barre originale conservée, sans valeur mesurée faute d’étalonnage lisible. Cette photographie macroscopique localise la moelle ; elle ne montre ni un taux de réticulocytes ni une réponse immédiate à une perte sanguine. Original : OpenStax, édition 8.25 du 18 mai 2016, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; repères français situés dans cette légende.</figcaption></figure>
<p>Cette distinction guide les examens : un prélèvement sanguin observe ce qui circule, une imagerie cherche une lésion ou une collection, et un examen médullaire explore une production anormale lorsqu’une telle hypothèse est pertinente. Une hémorragie expliquée n’impose pas à elle seule une exploration médullaire systématique.</p>
<p>Le contrôle de la source doit viser le compartiment responsable. Remplacer des globules rouges améliore le transport d’oxygène mais ne ferme pas une lésion. Inversement, l’hémostase obtenue n’annule pas immédiatement l’anémie résiduelle. Les deux actions répondent à deux problèmes anatomiques et fonctionnels distincts.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S617] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Le site de perte détermine une partie des manifestations.</p><p><b>Science → examen.</b> Imagerie et sang explorent des compartiments différents.</p><p><b>Science → traitement.</b> Contrôler la source et remplacer ce qui manque sont deux actions distinctes.</p><p><b>À retenir.</b> Relier le mécanisme, la mesure et la décision avec leurs limites.</p></div><button class="pareto-btn ui" data-k="pareto-d62-anat">▲ Loi de Pareto — Anatomie</button></div><div class="sci" id="d62-s-histo" role="tabpanel" aria-labelledby="d62-tab-histo" hidden><section class="ilot" id="d62-s-histo-cours"><h3>Les cellules : forme, nombre et maturation</h3>
<p>Les hématies matures contiennent l’hémoglobine qui transporte l’oxygène. Le frottis permet de regarder leur morphologie et leur distribution sur une lame ; la numération apporte les quantités et indices mesurés. Un champ photographié, même très riche en cellules, ne révèle pas à lui seul la concentration d’hémoglobine du patient.</p>
<figure id="d62-science-blood" data-origin="human-original"><img src="assets/img/d62/alpha/codex/normal-peripheral-blood.jpg" alt="Champ large de frottis humain avec nombreux disques rouges et barre originale100micromètres en haut à gauche" loading="lazy"><figcaption><b>Un frottis humain : une image n’est pas une concentration.</b> <b>Repère 1, disques rouges :</b> hématies réparties sur le champ. <b>Repère 2, centre plus clair de nombreux disques :</b> contraste de coloration, sans mesure individuelle. <b>Repère 3, régions plus denses :</b> la répartition sur une lame varie ; elle ne donne pas l’hémoglobine du patient. <b>Repère 4, haut gauche :</b> échelle originale 100µm conservée. Ce faible grossissement ne permet pas d’identifier une réticulocytose ni une carence martiale. Aucun aspect de ce champ ne prouve ou n’exclut une hémorragie aiguë. Original : Степанюк Ярослав et Борис Максим, photographie diffusée sur Wikimedia Commons, <a href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; repères français situés dans cette légende.</figcaption></figure>
<p>Le volume globulaire moyen décrit la taille moyenne des hématies ; la teneur corpusculaire et la concentration corpusculaire décrivent d’autres relations avec l’hémoglobine. Une moyenne peut masquer plusieurs populations ou mécanismes associés. Les valeurs de référence doivent être celles de la méthode et de la population examinées.</p>
<p>La stratégie HUG 2022 propose, à titre de repère daté, un volume globulaire moyen de 82–98 f L. En dessous, elle parle de microcytose ; au-dessus, de macrocytose. Un tableau de gradation et les limites figurent dans la fenêtre sur les indices. Cette plage ne devient pas une norme nationale universelle.</p>
<p>Les réticulocytes sont des cellules érythrocytaires encore immatures. Leur nombre renseigne la réponse de production et doit être rapproché de la sévérité de l’anémie et de la chronologie. Le document HUG associe une réponse régénérative à l’hémorragie ou à l’hémolyse ; cette association ne constitue pas une preuve de l’une des deux causes. Le faible grossissement de l’image ci-dessus ne permet pas de les identifier de manière fiable.</p>
<p>Une carence en fer préexistante, une inflammation, une maladie de production ou une transfusion peuvent compliquer l’interprétation du tableau cellulaire. Un saignement aigu ne se diagnostique donc pas par une « image typique D62 ». Il se comprend par la concordance entre histoire, évolution biologique et source documentée.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S618] Human blood smear — Кров людини</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Morphologie, moyenne et quantité ne sont pas identiques.</p><p><b>Science → examen.</b> Frottis et numération se complètent.</p><p><b>Science → traitement.</b> Ne pas choisir une transfusion à partir d’une photographie.</p><p><b>À retenir.</b> Relier le mécanisme, la mesure et la décision avec leurs limites.</p></div><button class="pareto-btn ui" data-k="pareto-d62-histo">▲ Loi de Pareto — Histologie</button></div><div class="sci" id="d62-s-physio" role="tabpanel" aria-labelledby="d62-tab-physio" hidden><section class="ilot" id="d62-s-physio-cours"><h3>Transport d’oxygène : quantité, saturation et circulation</h3>
<p>Une molécule d’hémoglobine peut fixer de l’oxygène. La saturation décrit la part des sites occupés, alors que la concentration d’hémoglobine décrit la quantité de transporteurs par volume. Ces deux variables répondent à des questions différentes. Une saturation conservée ne signifie pas qu’il existe assez de transporteurs pour tous les besoins tissulaires.</p>
<p>Le sang doit aussi atteindre les organes. Une perte de volume peut altérer la circulation, en plus de la perte de globules rouges. Le corps mobilise des réponses compensatrices, dont l’augmentation de la fréquence et de l’éjection cardiaques décrite par HUG. Leur efficacité dépend du terrain et du rythme de la perte ; une maladie cardiaque peut réduire la tolérance.</p>
<figure id="d62-causal-oxygene"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Pourquoi saturation et hémoglobine ne suffisent pas seules"><title>Pourquoi saturation et hémoglobine ne suffisent pas seules</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Hémoglobine : quantité de</tspan><tspan x="290" dy="29">transporteurs</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Saturation : proportion de sites</tspan><tspan x="290" dy="29">occupés</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Circulation : acheminement aux</tspan><tspan x="290" dy="29">tissus</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Tolérance clinique et perfusion à</tspan><tspan x="290" dy="29">vérifier</tspan></text></svg><figcaption><b>Pourquoi saturation et hémoglobine ne suffisent pas seules.</b> Trois dimensions complémentaires ; aucune valeur numérique de débit ou de contenu artériel n’est calculée à partir de ce seul schéma. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure>
<p>L’hypoperfusion peut augmenter la production de lactate et modifier l’équilibre acido-basique. La directive européenne recommande le lactate pour estimer et suivre la perturbation, avec le déficit de base comme alternative si la mesure n’est pas disponible. Cependant, une clairance hépatique altérée influence aussi le lactate et d’autres causes d’acidose modifient le déficit de base.</p>
<p>La production érythrocytaire dépend de la moelle, du signal érythropoïétique et des substrats, notamment le fer. Elle intervient dans la récupération ; son évaluation ne remplace pas le soutien immédiat d’une circulation défaillante. De même, la réponse réticulocytaire se lit avec le moment du prélèvement et les causes associées.</p>
<p>La concentration d’hémoglobine est sensible aux changements de volume plasmatique. Les séries de résultats deviennent plus instructives lorsqu’elles sont reliées aux pertes et aux traitements. Cette lecture dynamique explique pourquoi une décision de transfusion dans le choc ne peut dépendre d’un seul seuil emprunté à une population stable.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Quantité d’hémoglobine, saturation et circulation conditionnent l’apport.</p><p><b>Science → examen.</b> La trajectoire clinique et biologique compte.</p><p><b>Science → traitement.</b> Adapter le support au mécanisme et à la tolérance.</p><p><b>À retenir.</b> Relier le mécanisme, la mesure et la décision avec leurs limites.</p></div><button class="pareto-btn ui" data-k="pareto-d62-physio">▲ Loi de Pareto — Physiologie</button></div><div class="sci" id="d62-s-bio" role="tabpanel" aria-labelledby="d62-tab-bio" hidden><section class="ilot" id="d62-s-bio-cours"><h3>Hémostase et fer : arrêter la perte, puis reconstruire</h3>
<p>L’hémostase mobilise les plaquettes et la coagulation pour stabiliser une lésion vasculaire. La fibrine forme une composante du caillot ; sa dégradation fait intervenir le système fibrinolytique. Le traitement peut viser un déficit de facteurs, un manque de plaquettes ou une dégradation excessive, mais ces mécanismes ne sont pas équivalents.</p>
<p>En hémorragie majeure, la directive européenne recommande de surveiller régulièrement plaquettes, fibrinogène et paramètres de coagulation, éventuellement avec des méthodes viscoélastiques. La température et le calcium ionisé ont également une importance fonctionnelle. Remplacer uniquement des hématies ne corrige pas nécessairement les autres perturbations.</p>
<figure id="d62-causal-txa"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="La cible de l’acide tranexamique"><title>La cible de l’acide tranexamique</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Plasminogène et système</tspan><tspan x="290" dy="29">fibrinolytique</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">TXA : limite l’activation en</tspan><tspan x="290" dy="29">plasmine</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Dégradation de la fibrine réduite</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Bénéfice dépendant du contexte et</tspan><tspan x="290" dy="29">du délai</tspan></text></svg><figcaption><b>La cible de l’acide tranexamique.</b> Mécanisme décrit dans la <button class="w" data-k="d62-fi">FI</button> suisse ; il ne prouve pas un bénéfice dans tout saignement et ne justifie pas l’usage digestif déconseillé par <button class="w" data-k="d62-sources">ESGE</button>. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure>
<p>Le <button class="w" data-k="d62-txa">TXA</button> se lie au plasminogène et limite sa conversion en plasmine ; la <button class="w" data-k="d62-fi">FI</button> décrit ainsi une action antifibrinolytique. Il ne produit pas de nouvelles hématies et n’apporte pas de facteurs de coagulation. Cette distinction explique à la fois son association à d’autres mesures dans certaines hémorragies et l’impossibilité de l’utiliser comme substitut à une transfusion indiquée.</p>
<p>Après la perte, le fer redevient un substrat essentiel à la synthèse d’hémoglobine. Un traitement martial doit tenir compte des réserves, de l’inflammation et de l’absorption ou de la tolérance digestive. La ferritine est utile mais son élévation inflammatoire peut masquer une carence ; le contexte postpartum en est un exemple explicitement traité par l’<button class="w" data-k="d62-sources">OMS</button>.</p>
<p>La voie intraveineuse contourne certaines limites de la voie orale, au prix de précautions propres au produit : hypersensibilité et, pour le carboxymaltose ferrique, risque d’hypophosphatémie. Le besoin total calculé, la dose autorisée par administration et la vitesse ne doivent pas être confondus. Une quantité de fer n’est pas un objectif d’hémoglobine immédiat.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S616] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> Caillot, fibrinolyse et disponibilité du fer répondent à des fonctions différentes.</p><p><b>Science → examen.</b> Mesurer les déficits pertinents selon le contexte.</p><p><b>Science → traitement.</b> <button class="w" data-k="d62-txa">TXA</button>, produits sanguins et fer ne sont pas interchangeables.</p><p><b>À retenir.</b> Relier le mécanisme, la mesure et la décision avec leurs limites.</p></div><button class="pareto-btn ui" data-k="pareto-d62-bio">▲ Loi de Pareto — Biochimie et hémostase</button></div><div class="sci" id="d62-s-immuno" role="tabpanel" aria-labelledby="d62-tab-immuno" hidden><section class="ilot" id="d62-s-immuno-cours"><h3>Transfuser implique une compatibilité biologique et une identité certaine</h3>
<p>Les cellules transfusées portent des antigènes. Des anticorps du receveur dirigés contre des antigènes érythrocytaires peuvent entraîner une destruction accélérée des cellules transfusées. Swissmedic distingue les réactions hémolytiques aiguës et retardées, ainsi que les mécanismes intravasculaires et extravasculaires. Une anémie après transfusion n’est donc pas automatiquement une nouvelle perte sanguine.</p>
<p>La concordance de l’identité est une étape biologique de sécurité : un produit correctement préparé pour une autre personne peut être incompatible avec le receveur présent. La procédure HUG 2025 demande de vérifier l’identité, le bracelet, les documents et le produit, puis les contrôles de compatibilité prévus. Un résultat ancien ou une étiquette supposée correcte ne remplace pas le contrôle au lit.</p>
<p>Si une réaction hémolytique est suspectée, l’investigation associe contrôle documentaire, groupe, recherche d’anticorps, test de compatibilité et test direct à l’antiglobuline selon le laboratoire. Une haptoglobine diminuée, une bilirubine et une lactate-déshydrogénase augmentées ou une réponse insuffisante de l’hémoglobine orientent vers une destruction ; aucun marqueur n’est interprété seul.</p>
<p>Une dyspnée après transfusion peut relever de plusieurs mécanismes. Le <button class="w" data-k="d62-taco-trali">TACO</button> correspond à une surcharge circulatoire. Le <button class="w" data-k="d62-taco-trali">TRALI</button> correspond à une atteinte pulmonaire associée à la transfusion, sans preuve de surcharge ventriculaire gauche dans la définition Swissmedic 2024 citée. Des mécanismes immunologiques ou d’activation des neutrophiles sont décrits ; les deux situations ne se traitent pas comme un simple déficit persistant d’hémoglobine.</p>
<p>La première réponse à une réaction suspecte consiste à arrêter la transfusion et à alerter selon le protocole local. La poche et le matériel sont conservés pour investigation. L’hémovigilance classe séparément la gravité et l’imputabilité : un événement très grave peut avoir une causalité encore incertaine, et cette incertitude ne justifie pas de le taire.</p>
<figure id="d62-causal-immuno"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Sécurité avant et après le produit"><title>Sécurité avant et après le produit</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="66" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Identité et produit concordants</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Compatibilité selon le laboratoire</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Surveillance de la réaction</tspan><tspan x="290" dy="29">clinique</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Arrêt et investigation si</tspan><tspan x="290" dy="29">suspicion</tspan></text></svg><figcaption><b>Sécurité avant et après le produit.</b> La concordance évite une erreur de receveur ; la surveillance recherche les complications qui restent possibles malgré les contrôles. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></section><div class="key"><p><b>Science → clinique.</b> L’incompatibilité peut détruire les hématies transfusées.</p><p><b>Science → examen.</b> Identité, compatibilité et investigation d’une réaction sont essentielles.</p><p><b>Science → traitement.</b> Arrêter et signaler une réaction suspecte, puis traiter son mécanisme.</p><p><b>À retenir.</b> Relier le mécanisme, la mesure et la décision avec leurs limites.</p></div><button class="pareto-btn ui" data-k="pareto-d62-immuno">▲ Loi de Pareto — Immunohématologie</button></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="d62-p-1"><h2><span class="n">p-1</span> Produits sanguins : remplacer une fonction précise</h2>
<p>Un concentré érythrocytaire apporte des globules rouges et soutient le transport d’oxygène. Le plasma et les plaquettes répondent à d’autres déficits de l’hémostase. Aucun de ces produits n’a pour fonction de fermer une lésion responsable du saignement ; leur utilisation accompagne le contrôle de la source.</p>
<p>En hémorragie majeure, la composition du support dépend du protocole, des pertes et des résultats répétés. La directive européenne décrit plusieurs stratégies initiales puis une adaptation aux déficits. Elle ne permet pas de transformer D62 en ordonnance fixe d’un même nombre de poches pour tous.</p>
<p>Chez un patient stable, la liste suisse smartermedicine recommande une quantité minimale adaptée et une réévaluation ; il n’est pas nécessaire de prescrire deux unités si une seule suffit. Cette logique ne doit pas retarder le support d’une hémorragie massive persistante.</p>
<p>La sécurité comprend identité, compatibilité, surveillance, conservation du produit en cas de réaction et traçabilité. L’événement clinique et son imputabilité sont documentés séparément. Les détails de préparation et les débits suivent la procédure du centre.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S613] Top 5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></section>
<section class="ilot" id="d62-p-2"><h2><span class="n">p-2</span> Acide tranexamique : produit exact et contexte exact</h2>
<p><b>Tranexamic Acid Leman, solution injectable 100 mg/mL ; <button class="w" data-k="d62-fi">FI</button> septembre 2026.</b> Le produit contient 500 mg dans 5 mL ou 1000 mg dans 10 mL. Il agit sur la fibrinolyse. La <button class="w" data-k="d62-fi">FI</button> indique, chez l’adulte,0,5–1 g <button class="w" data-k="d62-fi">IV</button> lentement deux à trois fois par jour pour une fibrinolyse locale et 1 g toutes les 6–8 heures pour une fibrinolyse générale, à 1 mL/min. Ces schémas généraux ne sont pas le schéma spécifique de traumatologie ni celui du post-partum.</p>
<p>Le tableau de la partie 10 donne les schémas des directives et leurs horloges. Une injection rapide expose notamment à l’hypotension, à la bradycardie ou à l’asystolie. La voie doit être clairement marquée <button class="w" data-k="d62-fi">IV</button>. Les voies neuraxiales et intracérébrales sont contre-indiquées et la voie intramusculaire n’est pas indiquée.</p>
<p>Contre-indications et précautions comprennent hypersensibilité, thrombose aiguë, insuffisance rénale sévère, antécédents de convulsions et certaines coagulopathies de consommation. Le risque thrombotique, les contraceptifs contenant des œstrogènes, les troubles visuels et les associations influençant l’hémostase demandent une évaluation. La <button class="w" data-k="d62-fi">FI</button> n’établit pas un régime pédiatrique universel pour tout saignement.</p>
<p>Les données de grossesse sont limitées ; la <button class="w" data-k="d62-fi">FI</button> déconseille le premier trimestre et réserve l’usage pendant la grossesse à la nécessité absolue. Elle ne recommande pas l’allaitement. Ces mentions restent visibles à côté de la recommandation obstétricale de <button class="w" data-k="d62-txa">TXA</button> précoce ; le choix clinique exige une appréciation contextualisée, sans consensus fictif.</p>
<div class="alert"><b>Point de décision.</b> La <button class="w" data-k="d62-fi">FI</button> comporte un tableau rénal dont la ligne>500µmol/L coexiste avec la contre-indication d’insuffisance rénale sévère. Ne pas utiliser cette ligne comme autorisation automatique. Clarifier avec le spécialiste et le produit actuel.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a>.</p></div></section>
<section class="ilot" id="d62-p-3"><h2><span class="n">p-3</span> Fer oral : une correction de carence, après l’urgence</h2>
<p><b>ferro sanol ; <button class="w" data-k="d62-fi">FI</button> suisse avril 2021.</b> La quantité pertinente est le <b>fer élémentaire</b>. Un traitement oral convient dans les indications du produit lorsque la voie est tolérée et efficace ; il ne remplace pas la prise en charge d’un choc ou d’une perte active.</p>
<p>La <button class="w" data-k="d62-fi">FI</button> décrit 100 mg de fer élémentaire par jour selon les conditions d’âge et de poids. Dans les carences importantes, une phase initiale à 200 mg/j est prévue chez les personnes d’au moins 15 ans et d’au moins 50 kg, avec plafond de 5 mg/kg/j. Ce n’est pas une règle applicable à tout enfant ni un schéma automatique après toute hémorragie.</p>
<p>La tolérance digestive, l’observance et les interactions influencent le résultat. Des médicaments et aliments peuvent modifier l’absorption ; respecter les conditions et espacements du produit exact. Les atteintes rénale ou hépatique sévères figurent parmi les contre-indications de cette <button class="w" data-k="d62-fi">FI</button> : l’absence d’une table d’ajustement ne les efface pas.</p>
<p>Réévaluer la réponse, la persistance des pertes et la pertinence du diagnostic si l’hémoglobine ne se corrige pas comme attendu. Des schémas alternés discutés dans d’autres recommandations ne sont pas présentés comme la posologie de cette <button class="w" data-k="d62-fi">FI</button>.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a>.</p></div></section>
<section class="ilot" id="d62-p-4"><h2><span class="n">p-4</span> Carboxymaltose ferrique : besoin total, dose et surveillance</h2>
<p><b>Ferinject ; <button class="w" data-k="d62-fi">FI</button> suisse juin 2025.</b> L’indication concerne la carence martiale confirmée chez l’adulte lorsque le fer oral est insuffisamment efficace, inefficace ou impossible. Calculer le besoin total ne suffit pas : chaque administration doit respecter les limites de voie, de poids et de semaine. La fenêtre<button class="w" data-k="d62-fer-calcul">calculer sans dépasser la dose</button> distingue ces étapes.</p>
<table class="t"><thead><tr><th>Administration adulte de la <button class="w" data-k="d62-fi">FI</button></th><th>Limite</th><th>Conséquence</th></tr></thead><tbody><tr><td>Injection intraveineuse</td><td>15 mg de fer/kg, sans dépasser 1000 mg</td><td>Ne pas reprendre le plafond pondéral de la perfusion pour une injection.</td></tr><tr><td>Perfusion intraveineuse</td><td>20 mg de fer/kg, sans dépasser 1000 mg</td><td>Respecter la dilution et la vitesse de la <button class="w" data-k="d62-fi">FI</button>.</td></tr><tr><td>Dose cumulée hebdomadaire</td><td>1000 mg ; administrations fractionnées espacées d’au moins une semaine si besoin supérieur</td><td>Le besoin total peut dépasser la quantité autorisée en une séance.</td></tr><tr><td>Surveillance après administration</td><td>Au moins 30 minutes</td><td>Personnel et moyens de traitement d’une anaphylaxie disponibles.</td></tr></tbody></table>
<p>Les contre-indications comprennent anémie dont l’origine ferriprive n’est pas confirmée, surcharge en fer et hypersensibilité grave connue au fer parentéral, ainsi que les autres conditions de la <button class="w" data-k="d62-fi">FI</button>. Le premier trimestre de grossesse est contre-indiqué ; les situations ultérieures exigent une évaluation du bénéfice et du risque. L’autorisation pédiatrique ne se déduit pas de la simple présence d’essais pédiatriques dans une fiche.</p>
<p>Le risque d’hypophosphatémie doit être pris en compte, surtout avec doses répétées élevées ou facteurs de risque. Des douleurs osseuses ou articulaires et une hypophosphatémie persistante justifient une réévaluation. Les préparations de fer oral ne sont pas administrées simultanément selon la <button class="w" data-k="d62-fi">FI</button> ; la séquence doit être organisée.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></section>
<section class="ilot" id="d62-p-5"><h2><span class="n">p-5</span> Concentré de complexe prothrombinique : une indication ciblée</h2>
<p><b>Octaplex 500/1000 ; <button class="w" data-k="d62-fi">FI</button> suisse novembre 2021.</b> Ce concentré de facteurs dépendant de la vitamine K est indiqué dans certains déficits acquis nécessitant une correction urgente, notamment sous antagoniste de la vitamine K, et dans des déficits congénitaux précis lorsqu’un concentré spécifique n’est pas disponible. Il ne traite pas une simple concentration basse d’hémoglobine.</p>
<p>La <button class="w" data-k="d62-fi">FI</button> demande l’avis d’un spécialiste et une individualisation selon état clinique, importance et site de l’hémorragie, paramètres de coagulation et efficacité. En déficit acquis lié à un antagoniste de la vitamine K, l’association à la vitamine K doit être envisagée par l’équipe : l’action du concentré peut être plus courte que celle de l’antagoniste. Aucun protocole universel de dose pour D62 n’est déduit ici.</p>
<p>Octaplex contient de l’héparine. Une hypersensibilité à celle-ci ou un antécédent de thrombocytopénie induite par héparine contre-indique le produit. La <button class="w" data-k="d62-fi">FI</button> contre-indique aussi certaines situations pouvant entraîner un déficit en antithrombine III, le produit n’en contenant pas. Le risque thrombotique et la coagulation intravasculaire disséminée exigent une surveillance.</p>
<p>Les données d’utilisation et de sécurité chez l’enfant ne sont pas établies dans cette <button class="w" data-k="d62-fi">FI</button>. La grossesse et l’allaitement requièrent une indication clairement posée. Consigner le produit et le lot pour la traçabilité ; le statut de produit plasmatique impose ses précautions propres.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a>.</p></div></section>
<section class="ilot" id="d62-p-6"><h2><span class="n">p-6</span> Éviter les erreurs de mécanisme et de formulation</h2>
<p>La prescription part de la fonction à corriger. Une anémie mal tolérée, un déficit de facteurs, une fibrinolyse et une carence en fer ne sont pas la même indication. Le tableau permet de vérifier l’objectif avant de choisir le produit et la dose.</p>
<table class="t"><thead><tr><th>Intervention</th><th>Ce qu’elle vise</th><th>Ce qu’elle ne remplace pas</th></tr></thead><tbody><tr><td>Concentré érythrocytaire</td><td>Transporteurs d’oxygène</td><td>Contrôle de la source ou correction de tout déficit hémostatique.</td></tr><tr><td>Acide tranexamique</td><td>Fibrinolyse dans les contextes indiqués</td><td>Globules rouges, facteurs ou bénéfice démontré dans tout saignement.</td></tr><tr><td>Concentré de facteurs</td><td>Déficit précis documenté ou fortement suspecté selon contexte</td><td>Remplissage général ou traitement de toute D62.</td></tr><tr><td>Fer oral ou intraveineux</td><td>Substrat de production en carence</td><td>Réanimation immédiate du choc.</td></tr></tbody></table>
<p>Vérifier ensuite le produit exact, la concentration, la voie, les contre-indications et les adaptations. Un volume de 10 mL n’a de sens que si la concentration est connue. Une cible d’hémoglobine n’est pas une dose de fer ; un besoin total en fer n’est pas une autorisation d’administrer toute cette quantité immédiatement.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une patiente de 45 kg a une indication confirmée à une perfusion de Ferinject. Quel plafond pondéral faut-il vérifier avant la limite absolue ?</p><button data-ok="1">20 mg/kg, soit 900 mg dans cet exemple ; le besoin réel peut être inférieur.</button><button data-ok="0">1000 mg pour toute personne, sans tenir compte du poids.</button><button data-ok="0">La totalité du besoin calculé peut être perfusée en une fois.</button><p class="fb" hidden>45 × 20 = 900 mg. La limite est la plus contraignante entre poids, plafond absolu et besoin réel ; les autres conditions de la <button class="w" data-k="d62-fi">FI</button> restent nécessaires.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d62-pharma">▲ Loi de Pareto — Pharmacologie</button></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="d62-indice" data-title="Indice de choc : calculer et contextualiser"><p>L’indice de choc se calcule en divisant la fréquence cardiaque, en battements par minute, par la pression artérielle systolique, enmm Hg. Exemple pédagogique :110/min et 100 mm Hg donnent 110 ÷ 100 = 1,1. Il s’agit d’un indice conventionnel ; écrire les unités des mesures évite de confondre pression systolique et moyenne.</p><p>Il rapproche la réponse cardiaque de la pression obtenue. Il ne mesure pas les litres de sang perdus. En obstétrique,<button class="w" data-k="d62-sources">SGGG</button> 2022 signale un indice>0,9 dans son contexte de choc ; <button class="w" data-k="d62-sources">OMS</button> 2025 retient notamment>1 comme signe associé au seuil de perte 300 mL pour déclencher les premières mesures. Ces valeurs ne sont pas un seuil universel pour toute D62.</p><p>Interpréter l’indice avec l’examen, la chronologie et les autres mesures de perfusion. Son évolution et le contexte importent davantage qu’une lecture isolée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></template>
<template data-pop="d62-unites" data-title="Hémoglobine : convertir g/dL et g/L"><p>Un décilitre est un dixième de litre. Pour exprimer la même concentration par litre, multiplier la valeur eng/dL par 10. Ainsi 7 g/dL = 70 g/L ;8 g/dL = 80 g/L ;13 g/dL = 130 g/L. Dans l’autre sens, diviser par 10.</p><p>La conversion ne change pas la population ni l’indication. Le seuil diagnostique d’une anémie n’est pas un seuil de transfusion ; une cible post-transfusionnelle n’est pas un seuil de déclenchement. Les tableaux de la leçon précisent ces rôles avant de donner le nombre.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S619] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a>.</p></div></template>
<template data-pop="d62-concentration" data-title="Pourquoi l’hémoglobine ne mesure pas directement la perte"><p>Une concentration est une quantité rapportée à un volume. Après une perte de sang, globules rouges et plasma peuvent diminuer ensemble ; les échanges de liquide et le remplissage modifient ensuite le volume dans lequel l’hémoglobine est mesurée.</p><p>Une valeur initiale normale peut donc masquer l’hémorragie précoce. Une baisse ultérieure ne prouve pas, à elle seule, une nouvelle perte : dilution, saignement persistant et autres mécanismes peuvent coexister. La directive européenne recommande des mesures répétées et une décision fondée sur l’ensemble clinique.</p><p>Il n’est pas valide de convertir automatiquement une baisse donnée d’hémoglobine en un nombre de litres perdus sans modèle et données supplémentaires.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="d62-oxygene" data-title="Saturation, hémoglobine et apport d’oxygène"><p>La saturation est la proportion de sites de l’hémoglobine occupés par l’oxygène. Elle ne compte pas les molécules d’hémoglobine disponibles. La circulation doit ensuite acheminer ce sang vers les tissus.</p><p>Une saturation conservée peut donc coexister avec un déficit de transporteurs et une mauvaise tolérance. Inversement, une dyspnée n’a pas une seule cause. Relier hémoglobine, contexte circulatoire et examen permet d’éviter de conclure que « la saturation est bonne, donc l’anémie est sans importance ».</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="d62-indices" data-title="Indices érythrocytaires : moyennes et références"><p>Le volume globulaire moyen décrit une taille moyenne ; la teneur corpusculaire moyenne décrit la quantité moyenne d’hémoglobine par hématie ; la concentration corpusculaire moyenne la rapporte au volume érythrocytaire. Ces mesures ne sont pas interchangeables.</p><p>Le tableau reprend les repères du document HUG 2022. Utiliser en pratique l’intervalle du laboratoire et la population du patient.</p><table class="t"><thead><tr><th>Mesure</th><th>Repère HUG 2022</th><th>Portée</th></tr></thead><tbody><tr><td>Volume globulaire moyen</td><td>82–98 f L</td><td>Microcytose<82 ; macrocytose>98 dans ce document.</td></tr><tr><td>Teneur corpusculaire moyenne</td><td>26–34 pg</td><td>Quantité moyenne d’hémoglobine par hématie.</td></tr><tr><td>Concentration corpusculaire moyenne</td><td>320–360 g/L</td><td>Rapport à la fraction érythrocytaire, pas concentration <button class="w" data-k="d62-concentration">Hb</button> totale du sang.</td></tr></tbody></table><p>Une moyenne normale ne supprime pas une cause mixte. Le document utilise des repères datés, dont certaines valeurs diffèrent de son propre schéma introductif ; le tableau de définitions est ici attribué sans en faire une norme suisse universelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a>.</p></div></template>
<template data-pop="d62-reticulocytes" data-title="Réticulocytes : production et chronologie"><p>Les réticulocytes sont des éléments érythrocytaires encore immatures. Leur nombre aide à apprécier la production médullaire. Il s’interprète avec la sévérité de l’anémie, la chronologie de la perte et les facteurs qui peuvent limiter la production.</p><p>La stratégie HUG 2022 donne les catégories suivantes ; elles ne remplacent pas la référence de la méthode.</p><table class="t"><thead><tr><th>Valeur absolue</th><th>Interprétation HUG 2022</th><th>Limite</th></tr></thead><tbody><tr><td><70G/L</td><td>Réponse dite arégénérative</td><td>À confronter à la sévérité et au moment du prélèvement.</td></tr><tr><td>70 à<120G/L</td><td>Zone non classée par les deux seuils du document</td><td>Ne pas forcer une catégorie.</td></tr><tr><td>≥120 G/L</td><td>Réponse dite régénérative</td><td>Peut accompagner perte sanguine ou hémolyse.</td></tr></tbody></table><p>Une photographie de frottis à faible grossissement ne fournit pas cette valeur absolue. La réponse de production ne remplace pas l’évaluation d’un choc.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a>.</p></div></template>
<template data-pop="d62-lactate" data-title="Lactate et déficit de base : suivre la perfusion"><p>Le lactate peut augmenter lorsque l’apport tissulaire est perturbé. Sa concentration dépend aussi de sa clairance, notamment hépatique. La directive de traumatologie recommande de le mesurer et de le suivre ; le déficit de base est une alternative si le lactate n’est pas disponible.</p><p>Ces mesures ne sont pas identiques. D’autres causes d’acidose, telles qu’une insuffisance rénale ou une hyperchlorémie, peuvent modifier le déficit de base. Les intervalles et conditions de prélèvement sont ceux du laboratoire. Aucun seuil universel de D62 n’est inventé dans cette leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="d62-hemostase" data-title="Hémostase : plaquettes, facteurs et fibrinolyse"><p>Les plaquettes et la coagulation concourent à stabiliser le caillot. La fibrinolyse participe à la dégradation de la fibrine. Les déficits de plaquettes, de fibrinogène et de facteurs ne se corrigent pas par le même produit.</p><p>En hémorragie majeure, la directive européenne recommande des contrôles répétés : numération plaquettaire, fibrinogène de Clauss, temps de prothrombine ou rapport normalisé et, selon le contexte, méthodes viscoélastiques. Température et calcium ionisé influencent aussi le fonctionnement.</p><p>La correction est guidée par le contexte et les résultats. Une anémie seule ne suffit pas à prescrire un concentré de facteurs ou du plasma.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S616] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="d62-txa-calcul" data-title="TXA : de la dose au volume, puis à la durée"><p>Pour la solution injectable Leman 100 mg/mL :1 g = 1000 mg. Le volume correspondant est 1000 mg ÷ 100 mg/mL = 10 mL. À 1 mL/min, ces 10 mL demandent 10 minutes. Cette égalité concerne la solution exacte ; une autre concentration exige un nouveau calcul.</p><p>Le schéma trauma européen commence par 1 g sur 10 minutes puis 1 g sur 8 heures. Le schéma postpartum <button class="w" data-k="d62-sources">OMS</button> utilise 1 g sur 10 minutes puis éventuellement une deuxième dose selon persistance ou reprise. La perfusion ultérieure et les préparations suivent les modalités du produit et du service ; ne pas confondre dose, volume et débit.</p><p>La voie est intraveineuse, clairement étiquetée. Une bonne arithmétique ne supprime ni les contre-indications rénales/thrombotiques ni l’absence d’indication dans le saignement digestif haut non variqueux.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a>.</p></div></template>
<template data-pop="d62-fer-calcul" data-title="Ferinject : besoin total et plafond par administration"><p>La <button class="w" data-k="d62-fi">FI</button> détermine d’abord le besoin total à partir du poids et de l’hémoglobine, par formule ou tableau adaptés. Ensuite, chaque administration respecte ses plafonds. Le calcul ci-dessous vérifie un plafond ; il ne calcule pas à lui seul le besoin total.</p><p>Exemple pédagogique pour une perfusion chez une adulte de 45 kg :45 kg × 20 mg/kg = 900 mg. La limite pondérale 900 mg est plus basse que le plafond absolu 1000 mg : elle prévaut, et le besoin réel peut être inférieur. Pour une injection, le plafond pondéral serait 45 × 15 = 675 mg. Les deux voies ont donc des limites différentes.</p><p>La dose cumulée maximale recommandée est 1000 mg par semaine ; si plusieurs administrations sont nécessaires, respecter au moins une semaine d’intervalle et les autres contraintes de la <button class="w" data-k="d62-fi">FI</button>. Surveiller l’hypersensibilité pendant puis au moins 30 minutes après administration. Le résultat ne devient pas une prescription sans indication confirmée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d62-rein" data-title="Fonction rénale : une table ne supprime pas une contre-indication"><p>Le <button class="w" data-k="d62-txa">TXA</button> peut s’accumuler en cas d’insuffisance rénale. Sa <button class="w" data-k="d62-fi">FI</button> 2026 contre-indique l’insuffisance rénale sévère tout en comportant une ligne de tableau pour créatinine>500µmol/L. Cette tension textuelle ne doit pas être convertie en algorithme automatique ; l’indication et le produit actuel doivent être clarifiés avec l’équipe spécialisée.</p><p>Les autres produits ont leurs propres règles. La <button class="w" data-k="d62-fi">FI</button> deferro sanol contre-indique certaines atteintes rénales ou hépatiques sévères ; Ferinject demande une évaluation du bénéfice et du risque dans les troubles hépatiques et une surveillance adaptée. Ne pas appliquer la règle d’un produit à tous les traitements de D62.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d62-transfusion" data-title="Seuil, cible et décision clinique"><p>Le seuil est un repère pour envisager une intervention ; la cible décrit le résultat recherché après traitement. Les deux doivent préciser population et contexte. Les seuils de patients hémodynamiquement stables ne gouvernent pas seuls une hémorragie massive active.</p><p>La liste suisse smartermedicine recommande une quantité minimale et une réévaluation dans sa population stable. <button class="w" data-k="d62-sources">ESGE</button> 2026 distingue les patients avec et sans cardiopathie. En choc, la directive européenne insiste sur l’anticipation et sur une décision qui ne repose pas uniquement sur l’hémoglobine.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S613] Top 5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="d62-reaction" data-title="Réaction transfusionnelle : conduite immédiate"><p>La procédure HUG 2025 demande d’arrêter la transfusion suspecte et de ne pas la redémarrer, d’alerter le médecin, de surveiller les signes vitaux et de maintenir l’accès veineux selon la procédure. Conserver la poche et le matériel pour les investigations, sans les jeter.</p><p>Après stabilisation, informer le laboratoire et organiser les prélèvements et la déclaration selon le circuit local. Les documents, le produit et les échantillons permettent de rechercher erreur, hémolyse, infection ou autre mécanisme. Les modalités précises du service priment sur un numéro interne d’un autre établissement.</p><p>La gravité et l’imputabilité sont deux axes distincts : l’incertitude sur la cause ne dispense pas de signaler un événement grave.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></template>
<template data-pop="d62-taco-trali" data-title="Dyspnée après transfusion : deux mécanismes à distinguer"><p>Swissmedic 2024 décrit le <button class="w" data-k="d62-taco-trali">TACO</button> comme une surcharge circulatoire associée à la transfusion. Hypertension, bilan liquidien positif et signes d’œdème pulmonaire orientent dans ce contexte. Le <button class="w" data-k="d62-taco-trali">TRALI</button> est une atteinte respiratoire aiguë associée à la transfusion, sans signe de surcharge ventriculaire gauche dans la définition citée.</p><p>Une dyspnée impose d’interrompre la transfusion suspecte et de faire évaluer rapidement le patient. L’examen, l’imagerie, les données circulatoires et biologiques aident à distinguer les causes. Une nouvelle transfusion ne constitue pas la réponse automatique.</p><p>Les définitions et délais détaillés du document Swissmedic 2024 sont des critères datés ; ils ne sont pas présentés comme la révision la plus récente de tous les consensus internationaux.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></template>
<template data-pop="d62-postpartum" data-title="Post-partum : définition et départ de l’horloge"><p>La directive <button class="w" data-k="d62-sources">SGGG</button> 2022 avec <button class="w" data-k="d62-sources">DGGG</button>/<button class="w" data-k="d62-sources">OEGGG</button> et les recommandations <button class="w" data-k="d62-sources">OMS</button> 2025 ont des formulations différentes. La première définit des volumes selon la voie d’accouchement et reconnaît le choc indépendamment du volume visible. L’<button class="w" data-k="d62-sources">OMS</button> propose une définition thérapeutique destinée à déclencher plus tôt les premières mesures.</p><p>Dans les premières 24 heures, l’<button class="w" data-k="d62-sources">OMS</button> retient perte mesurée≥300 mL avec un signe hémodynamique anormal, ou≥500 mL, au premier critère atteint. Cela ne commande pas automatiquement une chirurgie ou une transfusion. Les seuils et signes sont détaillés dans la partie 13.</p><p>Pour le <button class="w" data-k="d62-txa">TXA</button>, la fenêtre des 3 heures part de la naissance, non de l’heure de la dernière numération. Le médicament complète les autres mesures obstétricales.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a>.</p></div></template>
<template data-pop="d62-classification" data-title="D62 : une catégorie sans sous-code"><p>La CIM-10-GM 2024 française de l’<button class="w" data-k="d62-classification">OFS</button> intitule D62 « Anémie posthémorragique aiguë ». Elle est sans subdivision. Les pertes intra- et postopératoires y sont incluses ; l’anémie congénitale par perte sanguine fœtale P61.3 est exclue.</p><p>D50.0 désigne la carence en fer secondaire à une perte chronique. Le code D62 ne remplace pas la description de la source, du trouble hémostatique ou du choc. Il ne justifie pas à lui seul une transfusion et ne certifie pas les règles de facturation d’une autre année.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D60-D64?lang=fr" target="_blank" rel="noopener">[S601] CIM-10-GM 2024 français, D62</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S602] ICD-10-GM 2024 D62</a>.</p></div></template>
<template data-pop="d62-fi" data-title="Lire une information professionnelle suisse"><p>Une information professionnelle décrit un produit exact : formulation, concentration, indications, doses, voie, contre-indications, interactions et populations particulières. Sa date compte. La présence d’une indication dans une <button class="w" data-k="d62-fi">FI</button> n’implique pas que toutes les recommandations récentes conseillent son utilisation dans tous les sous-contextes.</p><p>Exemple : la <button class="w" data-k="d62-fi">FI</button> du <button class="w" data-k="d62-txa">TXA</button> mentionne des hémorragies digestives ;<button class="w" data-k="d62-sources">ESGE</button> 2026 déconseille l’acide tranexamique dans l’hémorragie digestive haute non variqueuse. Autre exemple : une dose de Ferinject calculée sur le besoin total ne supprime pas ses plafonds par administration. Les différences sont exposées plutôt que fusionnées.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a>.</p></div></template>

<template data-pop="d62-compatibilite" data-title="Identité, anticorps et compatibilité"><p>Un produit destiné à une personne peut être incompatible avec une autre. Vérifier l’identité et la concordance documentaire est donc une étape de sécurité biologique. La procédure HUG 2025 précise les contrôles au lit, les informations du produit et le circuit de laboratoire.</p><p>Les anticorps dirigés contre les antigènes érythrocytaires peuvent détruire les cellules transfusées. Une réaction peut être immédiate ou retardée. La recherche d’anticorps, les tests de compatibilité et l’historique transfusionnel répondent à cette question ; les délais de validité et exceptions suivent la procédure locale.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></template>
<template data-pop="d62-phosphate" data-title="Ferinject et hypophosphatémie"><p>La <button class="w" data-k="d62-fi">FI</button> suisse de Ferinject décrit une hypophosphatémie, habituellement transitoire, et des cas symptomatiques avec ostéomalacie et fractures. Le risque mérite une attention particulière en cas de doses répétées élevées et de facteurs de risque.</p><p>Des douleurs osseuses ou articulaires doivent conduire à une évaluation. Chez les patients à risque recevant des traitements répétés, contrôler le phosphate selon la <button class="w" data-k="d62-fi">FI</button>. Une hypophosphatémie persistante impose de réévaluer le traitement. Ne pas attribuer automatiquement une fatigue persistante après fer à une anémie insuffisamment corrigée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d62-pcc" data-title="Octaplex : facteurs de coagulation, pas hémoglobine"><p>Octaplex apporte des facteurs du complexe prothrombinique. Sa <button class="w" data-k="d62-fi">FI</button> suisse de novembre 2021 précise des indications urgentes dans certains déficits acquis et des indications congénitales spécifiques. L’évaluation spécialisée, la réponse clinique et les contrôles de coagulation guident la dose.</p><p>Le produit contient de l’héparine et est contre-indiqué notamment en cas d’hypersensibilité à l’héparine ou d’antécédent de thrombocytopénie induite par héparine. Il ne contient pas d’antithrombine III et comporte des restrictions dans les situations exposant à son déficit. Il ne s’ajoute pas à toute D62.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a>.</p></div></template>
<template data-pop="d62-txa" data-title="Antifibrinolytique ne signifie pas traitement de tout saignement"><p>Le <button class="w" data-k="d62-txa">TXA</button> limite l’activation du plasminogène en plasmine et la dégradation de la fibrine. Ce mécanisme explique une possibilité d’action ; il ne démontre pas à lui seul un bénéfice clinique dans toutes les maladies.</p><p>Les directives trauma et postpartum soutiennent un usage précoce dans des populations précises, alors que <button class="w" data-k="d62-sources">ESGE</button> déconseille l’usage dans le saignement digestif haut non variqueux. La <button class="w" data-k="d62-fi">FI</button> exacte apporte les limites de voie, de rein, de thrombose et de convulsions. Un traitement doit satisfaire à la fois le contexte et la sécurité du produit.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a>.</p></div></template>
<template data-pop="d62-feroral" data-title="Fer oral : objectif et limites"><p>Le fer oral apporte un substrat à la production de nouvelles hématies en cas de carence. Il n’est pas un traitement immédiat du choc. L’efficacité dépend du diagnostic, de l’absorption, de la tolérance et de la persistance éventuelle de pertes.</p><p>La <button class="w" data-k="d62-fi">FI</button> deferro sanol d’avril 2021 précise doses selon poids/âge, plafond, interactions et contre-indications, dont certaines atteintes rénale ou hépatique sévères. La dose en fer élémentaire ne se confond pas avec la masse d’un sel. Le schéma de cette <button class="w" data-k="d62-fi">FI</button> ne doit pas être remplacé implicitement par une stratégie alternée issue d’une autre recommandation.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a>.</p></div></template>
<template data-pop="d62-feriv" data-title="Fer intraveineux : corriger une carence documentée"><p>Ferinject est indiqué chez l’adulte en carence confirmée lorsque le fer oral ne convient pas selon sa <button class="w" data-k="d62-fi">FI</button>. Le besoin total, la dose par séance, la voie et les intervalles sont contrôlés séparément. Une équipe capable de traiter une anaphylaxie et une surveillance d’au moins 30 minutes après administration sont nécessaires.</p><p>Les réactions d’hypersensibilité et l’hypophosphatémie font partie des précautions. Après une hémorragie postpartum, la ferritine inflammatoire et les indications contextuelles <button class="w" data-k="d62-sources">OMS</button> doivent être confrontées à la <button class="w" data-k="d62-fi">FI</button> suisse. Le fer intraveineux ne se substitue pas à une transfusion cliniquement nécessaire.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></template>
<template data-pop="d62-profiles" data-title="PROFILES et examen fédéral2026"><p>Les situations de départ <button class="w" data-k="d62-profiles">PROFILES</button> 2017 pertinentes comprennent fatigue, dyspnée, pâleur et anémie. Elles servent à organiser un raisonnement clinique : reconnaître l’urgence, formuler des hypothèses, choisir un examen et expliquer une décision.</p><p>Les exigences <button class="w" data-k="d62-profiles">MEBEKO</button> 2026 consultées sont distinguées de la transition vers <button class="w" data-k="d62-profiles">PROFILES</button> 2. Aucun numéro hérité de bannière ni score de préparation ne prouve une certification fédérale de cette leçon. Les cas présentés sont fictifs ; ils illustrent des décisions justifiées par les sources.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S623] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S624] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S625] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></template>
<template data-pop="d62-sources" data-title="Sources, versions et limites"><p>Les recommandations sont datées et attribuées. Les lectures ciblées et les réemplois de passages réellement lus auparavant sont distingués dans le dossier de recherche. Une entrée n’équivaut pas à une lecture intégrale.</p><p>Les limites principales concernent l’absence de fréquence nationale D62 établie ici, les populations des seuils transfusionnels, les divergences entre <button class="w" data-k="d62-fi">FI</button> et directives et les règles institutionnelles de transfusion.</p><ul><li><b>CIM-10-GM 2024 français, D62 — 2024</b>. Ne certifie pas la facturation de toutes les années ; pas de code américain importé.</li><li><b>ICD-10-GM 2024 D62 — 2024</b>. D62 ne code pas à lui seul le site ni le mécanisme causal de la perte.</li><li><b>Anémie, stratégie SMPR — 2022</b>. Document institutionnel 2022 ; seuils de laboratoire datés, transfusion aiguë contextualisée par directives plus spécifiques.</li><li><b>European guideline on major bleeding and coagulopathy following trauma, sixth edition — 1 mars 2023</b>. Pas une directive digestive/obstétricale ; portions non lues non revendiquées. Date de téléchargement 2026 non prise pour version. Objectifs transfusionnels ne deviennent pas seuils isolés en choc.</li><li><b>Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026 — publication 13 mai 2026 ;58:899–924</b>. Ne pas généraliser les seuils au choc ni appliquer aux varices ; recommandations antithrombotiques reconduites non réévaluées ; anciennes pages 2015/2021 non prises pour version 2026.</li><li><b>Peripartum haemorrhage: <button class="w" data-k="d62-sources">DGGG</button>/<button class="w" data-k="d62-sources">OEGGG</button>/<button class="w" data-k="d62-sources">SGGG</button> guideline — S2k août 2022 ; validité jusqu’au 31 juillet 2027</b>. Consensus S2k, pas S3 ; définition thérapeutique <button class="w" data-k="d62-sources">OMS</button> 2025 plus précoce présentée séparément ; pas extrapolation à D62 tout contexte.</li><li><b>Consolidated guidelines for postpartum haemorrhage — 2025</b>. Hébergement NLM ne fait pas de ce texte une directive américaine. Lecture du PDF ciblée, pas résumé seul. Critères <button class="w" data-k="d62-sources">OMS</button> de réponse initiale ne déclenchent pas automatiquement chirurgie/transfusion ; pas adoption suisse inventée.</li><li><b>Tranexamic Acid Leman, solution injectable 100 mg/mL — septembre 2026</b>. Table rénale&gt;500µmol/L en tension avec CI rénale sévère : aucune ordonnance simplifiée ; indication digestive <button class="w" data-k="d62-fi">FI</button> différente de <button class="w" data-k="d62-sources">ESGE</button> ; allaitement non recommandé <button class="w" data-k="d62-fi">FI</button> ; horaires trauma/PPH attribués à directives.</li><li><b>Octaplex 500/1000 — novembre 2021</b>. Pas substitution universelle en D62 ; pas dose 25–50 UI/kg recopiée hors contexte ; données enfant non établies ; formulation INR/Quick ambiguë non reproduite.</li><li><b>Information professionnelle suisse Ferinject — juin 2025</b>. Autorisation pédiatrique non établie par les essais cités dans la <button class="w" data-k="d62-fi">FI</button> ; doses d’étude ne deviennent pas prescription.</li><li><b>Technique clinique : transfusions de produits sanguins labiles — version 3.0 applicable 2 mai 2025</b>. Délai <button class="w" data-k="d62-compatibilite">RAI</button> et moyens locaux ne deviennent pas règle nationale ; numéro interne non proposé hors HUG ; unité O2 incohérente dans extraction non reprise.</li><li><b>Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f — version 1.0,9 août 2024</b>. Classification datée ; ne prétend pas revalider toutes les définitions internationales ultérieures.</li><li><b>Top 5 médecine interne hospitalière : transfusion — mai 2016, page consultée 2 novembre 2026</b>. Repères de cette liste datée, pas algorithme universel pour hémorragie active ou ischémie aiguë.</li><li><b>18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax — 2022 ; page consultée 2026</b>. Ouvrage américain de biologie, aucune recommandation clinique américaine ; paraphrases factuelles uniquement ; aucune figure de cette version NC-SA reproduite.</li><li><b>18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax — Anatomy and Physiology 2 e, page consultée 2026</b>. Paraphrases factuelles ciblées ; aucune recommandation américaine de traitement ni image sous licence actuelle reprise. Intervalles chiffrés et simplifications pathologiques du manuel non utilisés.</li><li><b>18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax — Anatomy and Physiology 2 e, page consultée 2026</b>. Paraphrases factuelles ciblées ; aucune recommandation américaine de traitement ni image sous licence actuelle reprise. Intervalles chiffrés et simplifications pathologiques du manuel non utilisés.</li><li><b>File:2205 Bone Marrow.jpg - Wikimedia Commons — édition 8.25,18 mai 2016 ; CC BY 4.0</b>. La licence de cet original 2016 est CC BY 4.0 ; distincte du manuel 2026 NC-SA. Barre sans valeur non mesurée ; pas preuve diagnostique de leucémie.</li><li><b>Human blood smear — Кров людини — CC BY 4.0, copie D50 du 15 octobre 2026</b>. Champ peu grossi, ne permet pas de qualifier des réticulocytes ni les réserves en fer. Aucun pixel modifié. </li><li><b>Guideline on haemoglobin cutoffs to define anaemia in individuals and populations — 5 mars 2024, ISBN 9789240088542</b>. Seuils diagnostiques, pas seuils transfusionnels ; pas norme spécifique &gt;65 ans ou &lt;6 mois inventée. Tables paraphrasées, pas image reproduite.</li><li><b>Information professionnelle suisse ferro sanol — avril 2021</b>. Atteintes rénale/hépatique sévères contre-indiquées ; absence de données d’ajustement ne supprime pas ces CI. Schéma alterné ECCO distinct de posologie <button class="w" data-k="d62-fi">FI</button>.</li><li><b>Carence en fer — medi X — r
