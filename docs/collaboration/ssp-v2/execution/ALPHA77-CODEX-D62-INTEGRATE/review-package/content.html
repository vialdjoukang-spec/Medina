<template id="ch-D62"><div class="chap"><div class="chap-head"><div class="code">D62 — Anémie posthémorragique aiguë · CIM-10-GM 2024 · Sang et organes hématopoïétiques</div><h1>Après une perte de sang : reconnaître l’urgence et comprendre l’anémie</h1><span class="status">Adulte ; contextes traumatique, digestif, opératoire et obstétrical distingués · Sources au 02.11.2026 · Auto-relecture pédagogique distincte d’une validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#d62-1">La première question : le saignement est-il encore actif ?</a></li><li><a href="#d62-2">Définition, limites et codage D62</a></li><li><a href="#d62-3">Classer le contexte pour choisir la bonne conduite</a></li><li><a href="#d62-4">Comprendre la différence entre quantité de sang et concentration</a></li><li><a href="#d62-5">Anamnèse : reconstruire la perte et la tolérance</a></li><li><a href="#d62-6">Sémiologie clinique : relier chaque signe à sa limite</a></li><li><a href="#d62-7">Bilan initial : plusieurs questions, plusieurs mesures</a></li><li><a href="#d62-8">Localiser la source et discuter les autres mécanismes</a></li><li><a href="#d62-9">Urgence : soutenir la perfusion et obtenir l’hémostase</a></li><li><a href="#d62-10">Hémostase : trois contextes à ne pas mélanger</a></li><li><a href="#d62-11">Transfusion : choisir, réévaluer et prévenir les complications</a></li><li><a href="#d62-12">Après l’urgence : récupérer et éviter la récidive</a></li><li><a href="#d62-13">Situations particulières et parcours suisse</a></li><li><a href="#d62-14">Critères formels et paramètres à emporter</a></li></ol></nav><div class="chap-body"><section class="ilot" id="d62-1"><h2><span class="n">1</span> La première question : le saignement est-il encore actif ?</h2>
<p>L’anémie posthémorragique aiguë est la conséquence d’une perte sanguine récente. Le chiffre d’hémoglobine ne suffit pas à décrire la situation : il faut déterminer si le saignement continue, si la circulation assure encore la perfusion des organes et si le transport d’oxygène est suffisant. Une hémorragie menaçante peut précéder la baisse mesurée de l’hémoglobine.</p>
<p>Après un traumatisme, une intervention, une hématémèse ou un accouchement, rechercher simultanément la source et les signes de mauvaise tolérance. Une confusion, une syncope, une douleur thoracique, une dyspnée importante, des marbrures ou une oligurie imposent d’évaluer la perfusion et la gravité. Leur interprétation dépend du contexte et de l’évolution ; aucun signe isolé ne résume le volume perdu.</p>
<div class="alert"><b>Point de décision.</b> Une hémoglobine initiale dans l’intervalle du laboratoire ne permet pas d’exclure une hémorragie précoce. En présence d’un choc et d’une source probable, le contrôle du saignement ne doit pas attendre une numération devenue franchement anormale.</div>
<p>Le raisonnement suit trois temps : <b>contrôler la perte et soutenir la perfusion</b>, <b>rétablir un transport d’oxygène adapté</b>, puis <b>corriger les conséquences et prévenir la récidive</b>. Ces temps peuvent se chevaucher ; le fer ne remplace pas une réanimation, et une transfusion ne traite pas la lésion qui saigne.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Après un traumatisme, une personne est pâle, confuse et hypotendue. Son premier résultat d’hémoglobine reste normal. Quelle interprétation est justifiée ?</p><button data-ok="1">Une hémorragie précoce reste possible ; poursuivre immédiatement évaluation et contrôle de la source.</button><button data-ok="0">Une hémoglobine normale exclut un saignement important.</button><button data-ok="0">Attendre la prochaine numération avant tout geste.</button><p class="fb" hidden>La concentration initiale peut masquer la perte de sang. La physiologie et la source probable guident l’urgence ; les mesures répétées complètent la décision.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a>.</p></div></section>
<section class="ilot" id="d62-2"><h2><span class="n">2</span> Définition, limites et codage D62</h2>
<p>Le libellé français officiel est <b>« Anémie posthémorragique aiguë »</b>. Dans la CIM-10-GM 2024 employée par ce projet, D62 est <b>sans subdivision</b> : il n’existe pas de série D62.0, D62.1 à compléter. La classification inclut les anémies après pertes intraopératoires et postopératoires. Elle exclut l’anémie congénitale par perte sanguine fœtale, classée en P61.3.</p>
<p>Le tableau distingue la conséquence sanguine de sa cause. Le site du saignement, une complication opératoire, un trouble de l’hémostase et un éventuel choc demandent leur propre caractérisation ; D62 ne les remplace pas.</p>
<table class="t"><thead><tr><th>Situation</th><th>Ce que désigne le classement</th><th>Conséquence pour le raisonnement</th></tr></thead><tbody><tr><td>Perte récente avec anémie attribuable</td><td>D62 : anémie posthémorragique aiguë</td><td>Documenter chronologie, perte et évolution de l’hémogramme.</td></tr><tr><td>Perte chronique et carence martiale</td><td>D50.0 : anémie par carence en fer secondaire à une perte de sang chronique</td><td>Rechercher la cause de la perte et la carence ; ne pas appeler automatiquement cet état D62.</td></tr><tr><td>Anémie congénitale par perte fœtale</td><td>P61.3, exclusion de D62</td><td>Contexte néonatal spécialisé ; les règles de l’adulte ne s’appliquent pas.</td></tr><tr><td>Hypotension avec hémorragie</td><td>Évaluer un choc en plus de l’anémie</td><td>L’urgence peut être présente avant l’anémie biologique manifeste.</td></tr></tbody></table>
<p>Pour les adultes de 15 à 65 ans, les seuils diagnostiques <button class="w" data-k="d62-sources">OMS</button> 2024 sont une hémoglobine inférieure à 120 g/L chez la femme non enceinte et à 130 g/L chez l’homme. Ce sont des <b>seuils de définition</b>, pas des seuils de transfusion. L’âge, la grossesse, les conditions de mesure et les références locales comptent ; ces repères ne créent pas une norme spécifique pour tout sujet âgé.</p>
<div class="key"><b>À retenir.</b> Une perte aiguë, une concentration basse et une mauvaise perfusion sont trois informations liées, mais non interchangeables.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D60-D64?lang=fr" target="_blank" rel="noopener">[S601] CIM-10-GM 2024 français, D62</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S602] ICD-10-GM 2024 D62</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S619] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></section>
<section class="ilot" id="d62-3"><h2><span class="n">3</span> Classer le contexte pour choisir la bonne conduite</h2>
<p>D62 rassemble des situations qui exigent des réponses différentes. Une artère lésée, un ulcère digestif, une perte opératoire et une hémorragie du post-partum ne partagent pas tous les mêmes traitements. La classification clinique suivante sert à orienter la recherche de source ; elle n’est pas un score pronostique validé.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Questions prioritaires</th><th>Limite à respecter</th></tr></thead><tbody><tr><td>Traumatique</td><td>Mécanisme, lésions, perte extériorisée ou cavitaire, perfusion, atteinte cérébrale</td><td>La stratégie de pression et l’hémostase dépendent des lésions associées.</td></tr><tr><td>Périopératoire</td><td>Moment de la perte, site opératoire, drains, anticoagulants et évolution</td><td>Une perte peut être interne ; le volume visible n’est pas tout le volume perdu.</td></tr><tr><td>Digestif</td><td>Hématémèse, méléna, rectorragie, stabilité et terrain</td><td>La directive digestive haute non variqueuse ne traite pas toutes les causes digestives.</td></tr><tr><td>Obstétrical</td><td>Moment par rapport à la naissance, volume mesuré, tonus, lésions, état circulatoire</td><td>Les seuils de déclenchement et l’horloge du traitement sont propres à ce contexte.</td></tr><tr><td>Après contrôle de la perte</td><td>Anémie résiduelle, carence martiale, reprise du saignement, autre cause associée</td><td>Ne pas poursuivre indéfiniment un protocole d’urgence chez un patient devenu stable.</td></tr></tbody></table>
<p>Une perte peut être <b>extériorisée</b> ou <b>occulte</b>, unique ou répétée. Une anémie ancienne peut précéder l’événement aigu : l’hémogramme antérieur aide alors à comprendre la part nouvelle. Chez les personnes âgées ou multimorbides, plusieurs mécanismes peuvent coexister.</p>
<p>Aucune incidence nationale suisse spécifique à D62 n’a été retrouvée dans les recherches réalisées pour cette leçon. Les statistiques d’anémie générale, de traumatisme majeur ou d’hémorragie obstétricale ne sont donc pas utilisées comme fréquence de D62. Aucun stade universel de cette catégorie n’est inventé.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a>.</p></div></section>
<section class="ilot" id="d62-4"><h2><span class="n">4</span> Comprendre la différence entre quantité de sang et concentration</h2>
<p>L’hémoglobine est portée par les globules rouges. Sa concentration exprime une quantité par volume de sang ; elle ne mesure pas directement tout le stock de globules rouges de l’organisme. Lors d’une perte aiguë, des globules rouges et du plasma quittent ensemble la circulation. Les mouvements de liquide et les perfusions modifient ensuite la concentration observée.</p>
<p>Il est donc possible de perdre du sang avant de mesurer une baisse nette d’hémoglobine. Inversement, une baisse après expansion liquidienne peut comporter une composante de dilution. Cela n’autorise ni à nier le saignement ni à affirmer une nouvelle perte sans autres arguments. Il faut comparer les prélèvements, leur horaire, les traitements reçus et l’évolution clinique.</p>
<figure id="d62-causal-concentration"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Pourquoi le premier chiffre peut tromper"><title>Pourquoi le premier chiffre peut tromper</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Perte de globules rouges et de</tspan><tspan x="290" dy="29">plasma</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Mouvements de liquide et</tspan><tspan x="290" dy="29">remplissage</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Concentration Hb changeante dans</tspan><tspan x="290" dy="29">le temps</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Clinique + mesures répétées +</tspan><tspan x="290" dy="29">source</tspan></text></svg><figcaption><b>Pourquoi le premier chiffre peut tromper.</b> La directive européenne de traumatologie recommande des mesures répétées ; le schéma n’est pas un calcul du volume perdu. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure>
<p>La saturation en oxygène indique la proportion d’hémoglobine occupée par l’oxygène. Une saturation rassurante ne garantit donc pas une quantité suffisante d’hémoglobine. La perfusion dépend aussi de la circulation : une anémie et une hypovolémie peuvent réduire l’apport tissulaire par des mécanismes complémentaires.</p>
<p>La moelle produit les nouveaux éléments sanguins. Cette réponse dépend notamment de la stimulation par l’érythropoïétine et de la disponibilité du fer. Un résultat de réticulocytes s’interprète avec la chronologie et la sévérité ; il ne remplace pas l’évaluation immédiate de la circulation.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a>.</p></div></section>
<section class="ilot" id="d62-5"><h2><span class="n">5</span> Anamnèse : reconstruire la perte et la tolérance</h2>
<p>Commencer par le moment d’apparition et l’évolution : début brutal ou progressif, épisode unique ou répété, malaise associé, douleur et retentissement fonctionnel. Demander les valeurs antérieures d’hémoglobine si elles sont disponibles. Une personne avec une anémie préexistante n’a pas nécessairement perdu tout le déficit observé pendant l’événement récent.</p>
<p>Rechercher les sites accessibles à l’interrogatoire : vomissement de sang, selles noires ou rouges, sang dans les urines, pertes gynécologiques, saignement d’une plaie et contexte opératoire. L’absence de perte visible ne suffit pas à exclure une hémorragie interne. Après un traumatisme, le mécanisme et les régions atteintes orientent les examens.</p>
<p>Préciser les anticoagulants, antiagrégants et traitements récents, leur dernière prise quand elle est connue, ainsi que les antécédents hémorragiques et transfusionnels. Les réactions transfusionnelles antérieures et les anticorps connus sont utiles au laboratoire. Les maladies cardiaques, respiratoires, rénales et hépatiques influencent la tolérance et les choix thérapeutiques.</p>
<p>Dans le contexte obstétrical, dater la naissance et mesurer la perte selon le dispositif local. Ce point temporel est déterminant pour l’utilisation précoce d’acide tranexamique. La définition obstétricale et sa prise en charge ne doivent pas être remplacées par les seuils d’une hémorragie digestive.</p>
<div class="key"><b>À retenir.</b> Reconstituer la chronologie, la source probable, les médicaments et la réserve physiologique. Les fréquences de symptômes spécifiques à D62 ne sont pas établies ici.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></section>
<section class="ilot" id="d62-6" data-semiology-clinical="D62"><h2><span class="n">6</span> Sémiologie clinique : relier chaque signe à sa limite</h2>
<p>L’examen commence par l’état de conscience, la respiration, la circulation et les pertes visibles. Pâleur et fatigue orientent vers une anémie ; hypotension, marbrures et oligurie suggèrent une perfusion insuffisante. La dyspnée et la douleur thoracique peuvent traduire une mauvaise tolérance. Chaque signe doit être interprété avec le terrain et les autres constatations.</p>
<p>La fréquence cardiaque et la pression artérielle donnent des renseignements complémentaires. Leur rapport, l’<button class="w" data-k="d62-indice">indice de choc</button>, aide à décrire l’évolution circulatoire. Il ne mesure pas le volume perdu et aucun seuil unique n’est valable pour toutes les populations. En obstétrique, la recommandation 2022 signale un indice supérieur à 0,9 ; les critères thérapeutiques <button class="w" data-k="d62-sources">OMS</button> 2025 emploient notamment un indice supérieur à 1. Les définitions et les objectifs doivent rester visibles.</p>
<table class="t"><thead><tr><th>Observation</th><th>Lien physiologique</th><th>Ce qu’elle ne démontre pas seule</th></tr></thead><tbody><tr><td>Pâleur, fatigue</td><td>Manifestations possibles du déficit en transporteurs d’oxygène</td><td>Ni valeur exacte d’hémoglobine ni cause du déficit.</td></tr><tr><td>Tachycardie, hypotension, malaise</td><td>Réponse circulatoire et possible hypovolémie</td><td>Ni volume sanguin perdu ni étiologie unique.</td></tr><tr><td>Marbrures, oligurie, confusion</td><td>Indices de mauvaise perfusion d’organes</td><td>Une cause hémorragique certaine sans contexte.</td></tr><tr><td>Dyspnée, douleur thoracique</td><td>Tolérance cardiopulmonaire à examiner rapidement</td><td>Une saturation normale ne neutralise pas leur importance.</td></tr><tr><td>Saignement visible, abdomen ou région traumatique à examiner</td><td>Piste anatomique vers la source</td><td>L’absence de perte visible n’exclut pas une perte interne.</td></tr></tbody></table>
<p>Répéter l’examen après les mesures initiales : amélioration de la conscience, de la perfusion et de la pression, évolution de la fréquence, diurèse et reprise de la perte. Une amélioration transitoire ne prouve pas une hémostase durable. La sémiologie fondamentale reprend ces liens dans le premier sous-onglet scientifique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></section>
<section class="ilot" id="d62-7"><h2><span class="n">7</span> Bilan initial : plusieurs questions, plusieurs mesures</h2>
<p>L’hémogramme précise la concentration d’hémoglobine, les indices érythrocytaires et le nombre de plaquettes. Il est répété selon la gravité et l’évolution. Un volume globulaire moyen normal n’exclut pas une hémorragie, une carence associée ou plusieurs causes simultanées. Les réticulocytes renseignent la production ; ils ne remplacent pas l’estimation clinique de l’urgence.</p>
<p>Le lactate renseigne la perturbation de la perfusion et sa trajectoire ; le déficit de base constitue une alternative dans la directive de traumatologie. Leurs résultats restent influencés par d’autres mécanismes : clairance hépatique pour le lactate, causes non hémorragiques d’acidose pour le déficit de base. Utiliser les références et conditions de prélèvement du laboratoire.</p>
<p>En hémorragie majeure, contrôler précocement et de manière répétée l’hémostase : temps de prothrombine ou rapport normalisé, fibrinogène de Clauss, numération plaquettaire et, selon disponibilité, évaluation viscoélastique. La température et le calcium ionisé participent aussi à la qualité de l’hémostase. Le prélèvement pour groupe, recherche d’anticorps et compatibilité suit la procédure locale de transfusion.</p>
<p>Après stabilisation, rechercher une carence martiale si elle est plausible. Une ferritine isolée peut être trompeuse en présence d’inflammation, particulièrement après l’accouchement. Si le tableau évoque une hémolyse, compléter avec les marqueurs et examens appropriés ; une anémie régénérative n’est pas synonyme de saignement.</p>
<div class="key"><b>À retenir.</b> Horodater prélèvements, pertes, perfusions et transfusions pour interpréter les résultats. L’examen complémentaire répond à une question explicite et ne retarde pas un contrôle urgent de la source.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S622] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></section>

<section class="ilot" id="d62-8"><h2><span class="n">8</span> Localiser la source et discuter les autres mécanismes</h2>
<p>Une source évidente associée à un choc peut imposer un geste immédiat de contrôle. Lorsque la source reste inconnue et qu’un contrôle immédiat n’est pas nécessaire, la directive de traumatologie recommande une investigation rapide. L’échographie ciblée et le scanner injecté répondent à des questions différentes ; leur choix dépend des lésions, de la stabilité et du circuit disponible.</p>
<p>L’imagerie ne doit pas devenir un détour qui retarde une hémostase indispensable. Une échographie ciblée recherche notamment du liquide dans certains espaces ; elle ne constitue pas un examen universel de toutes les causes de saignement. Le contexte digestif ou obstétrical réclame son exploration spécifique.</p>
<p>Le tableau suivant organise les alternatives à une perte aiguë isolée. Une association reste possible, notamment chez une personne âgée ou multimorbide.</p>
<table class="t"><thead><tr><th>Mécanisme discuté</th><th>Éléments discriminants</th><th>Piège</th></tr></thead><tbody><tr><td>Hémolyse</td><td>Contexte, ictère, bilirubine, lactate-déshydrogénase, haptoglobine et test direct à l’antiglobuline selon hypothèse</td><td>Une réticulocytose existe aussi après saignement ; elle ne distingue pas seule les deux.</td></tr><tr><td>Carence martiale chronique</td><td>Histoire prolongée, bilan martial interprété avec inflammation, recherche de perte répétée</td><td>Un volume globulaire normal ne supprime pas une cause mixte.</td></tr><tr><td>Défaut de production ou inflammation</td><td>Réponse réticulocytaire insuffisante, terrain et autres anomalies de l’hémogramme</td><td>Ne pas attribuer toute anémie postopératoire à une perte encore active.</td></tr><tr><td>Dilution</td><td>Chronologie de l’expansion liquidienne, évolution de plusieurs paramètres et clinique</td><td>Une baisse après perfusion n’exclut pas un saignement concomitant.</td></tr><tr><td>Anémie ancienne plus événement aigu</td><td>Résultats antérieurs, histoire et évolution depuis l’événement</td><td>Ne pas calculer le volume perdu à partir d’une seule différence d’hémoglobine.</td></tr></tbody></table>
<p>Une évolution défavorable malgré le contrôle apparent de la perte impose de reprendre le raisonnement : source persistante, nouvelle perte, hémolyse, inflammation, carence ou maladie associée. L’avis spécialisé est indiqué si l’étiologie demeure incertaine ou la réponse inadaptée.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S622] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a>.</p></div></section>
<section class="ilot" id="d62-9"><h2><span class="n">9</span> Urgence : soutenir la perfusion et obtenir l’hémostase</h2>
<p>En présence d’une hémorragie menaçante, organiser une prise en charge hospitalière immédiate, mobiliser l’équipe adaptée et anticiper les besoins de sang. La compression d’une plaie et, pour certaines hémorragies d’un membre menaçant la vie, le garrot font partie des moyens de contrôle décrits en traumatologie. Le geste définitif dépend de la source.</p>
<p>La réanimation doit éviter l’aggravation de l’hypothermie et soutenir l’hémostase. La directive européenne propose un remplissage cristalloïde initial chez le traumatisé hypotendu, avec stratégie restrictive adaptée. Elle recommande de limiter les colloïdes en raison de leurs effets sur l’hémostase. Aucun volume standard valable pour toutes les causes de D62 n’est proposé ici.</p>
<p>Les objectifs ci-dessous appartiennent au <b>traumatisme majeur</b>. Ce sont des cibles de prise en charge contextualisées, pas des valeurs normales de population.</p>
<table class="t"><thead><tr><th>Situation de la directive européenne 2023</th><th>Objectif cité</th><th>Limite</th></tr></thead><tbody><tr><td>Traumatisme avec saignement non contrôlé, sans lésion cérébrale clinique</td><td>Pression systolique 80–90 mm Hg, pression moyenne 50–60 mm Hg</td><td>Ne pas appliquer mécaniquement aux lésions cérébrales/spinales ; prudence âgé et hypertension chronique.</td></tr><tr><td>Traumatisme crânien grave, score de Glasgow≤8</td><td>Pression artérielle moyenne≥80 mm Hg</td><td>La perfusion cérébrale change la stratégie ; circuit spécialisé.</td></tr><tr><td>Transfusion érythrocytaire nécessaire en trauma</td><td>Hémoglobine cible 70–90 g/L</td><td>La décision en choc ne repose pas sur un chiffre isolé ; anticipation nécessaire.</td></tr></tbody></table>
<p>Surveiller la réponse clinique et les marqueurs de perfusion. La baisse de température, l’altération de la coagulation et l’hypocalcémie peuvent compliquer une hémorragie majeure et son traitement. Le contrôle de la source reste central : améliorer provisoirement la pression ne garantit pas l’arrêt de la perte.</p>
<div class="alert"><b>Point de décision.</b> Une cible de pression issue de la traumatologie ne devient pas une consigne générale pour toute anémie, grossesse ou maladie cardiaque. Les produits, volumes et vitesses sont fixés par le protocole clinique applicable.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></section>
<section class="ilot" id="d62-10"><h2><span class="n">10</span> Hémostase : trois contextes à ne pas mélanger</h2>
<p>L’acide tranexamique limite la dégradation de la fibrine. Il ne remplace ni les globules rouges perdus ni un geste sur la source. Son bénéfice dépend du contexte et du moment. Les recommandations spécifiques doivent être comparées à la fiche du produit suisse exact.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Recommandation réellement lue</th><th>Application et réserve</th></tr></thead><tbody><tr><td>Traumatisme avec saignement ou risque de saignement significatif</td><td>Directive européenne 2023 :1 g <button class="w" data-k="d62-fi">IV</button> sur 10 min, puis 1 g <button class="w" data-k="d62-fi">IV</button> sur 8 h ; commencer au plus tôt et dans 3 h du traumatisme</td><td>Ne pas attendre un résultat viscoélastique. Schéma de directive, distinct de la posologie générale de la <button class="w" data-k="d62-fi">FI</button>.</td></tr><tr><td>Hémorragie du post-partum</td><td><button class="w" data-k="d62-sources">OMS</button> 2025 :1 g <button class="w" data-k="d62-fi">IV</button> sur 10 min, dans 3 h après la naissance ; deuxième 1 g si persistance après 30 min ou reprise dans 24 h</td><td>Ajouter aux mesures obstétricales ; l’heure de naissance est le départ de l’horloge. La directive <button class="w" data-k="d62-sources">SGGG</button> 2022 préconise aussi 1 g <button class="w" data-k="d62-fi">IV</button> dès diagnostic.</td></tr><tr><td>Hémorragie digestive haute non variqueuse</td><td><button class="w" data-k="d62-sources">ESGE</button> 2026 : acide tranexamique non recommandé</td><td>La <button class="w" data-k="d62-fi">FI</button> suisse mentionne une indication digestive ; cette autorisation ne suffit pas à justifier son emploi dans le contexte déconseillé.</td></tr></tbody></table>
<p>La <button class="w" data-k="d62-fi">FI</button> de <b>Tranexamic Acid Leman injectable 100 mg/mL, septembre 2026</b>, impose une voie intraveineuse exclusive et une administration lente. Les voies intrathécale, épidurale, intraventriculaire et intracérébrale sont contre-indiquées ; la voie intramusculaire ne convient pas. Étiqueter clairement les seringues évite une erreur potentiellement mortelle. Les conversions de<button class="w" data-k="d62-txa-calcul">dose, volume et durée</button> doivent conserver la concentration du produit exact.</p>
<p>Les thromboses aiguës, l’insuffisance rénale sévère et les antécédents de convulsions figurent parmi les contre-indications. Le tableau rénal de la <button class="w" data-k="d62-fi">FI</button> comporte une ligne pour une créatinine supérieure à 500µmol/L alors que l’insuffisance sévère est contre-indiquée : cette tension ne doit pas être résolue par une prescription automatique. La fiche détaillée expose aussi les limites pendant grossesse et allaitement.</p>
<p>Les déficits en facteurs, plaquettes ou fibrinogène demandent une stratégie guidée par la situation, les examens et le protocole local. Un concentré de complexe prothrombinique tel qu’Octaplex a des indications et contre-indications propres ; il ne s’ajoute pas systématiquement à toute anémie hémorragique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a>.</p></div></section>
<section class="ilot" id="d62-11"><h2><span class="n">11</span> Transfusion : choisir, réévaluer et prévenir les complications</h2>
<p>En choc hémorragique ou en perte massive persistante, anticiper le besoin de produits sanguins à partir de l’ensemble clinique et biologique. Le seuil d’un patient stable ne doit pas retarder une transfusion nécessaire. Les recommandations <button class="w" data-k="d62-sources">OMS</button> 2025 sur l’hémorragie obstétricale soulignent elles aussi l’absence d’un critère unique supérieur à tous les autres.</p>
<p>Après stabilisation, une stratégie restrictive devient pertinente dans les populations étudiées. Les repères de ce tableau sont attribués à leur source ; ils ne constituent pas une ordonnance universelle.</p>
<table class="t"><thead><tr><th>Population stabilisée</th><th>Repère de la source</th><th>Interprétation</th></tr></thead><tbody><tr><td>Liste suisse smartermedicine 2016, sans cardiopathie</td><td>70 g/L comme repère restrictif</td><td>Quantité minimale nécessaire, réévaluation ; une unité peut suffire selon situation.</td></tr><tr><td>Même liste, cardiopathie préexistante stable</td><td>80 g/L</td><td>Ne représente pas automatiquement une ischémie coronarienne aiguë.</td></tr><tr><td><button class="w" data-k="d62-sources">ESGE</button> 2026, hémorragie digestive haute sans cardiopathie</td><td>Seuil<70g/L ; cible après transfusion70–90g/L</td><td>Recommandation forte, certitude modérée ; concerne patients hémodynamiquement stables.</td></tr><tr><td><button class="w" data-k="d62-sources">ESGE</button> 2026, cardiopathie aiguë ou chronique</td><td>Seuil≤80 g/L ; cible≥100 g/L citée</td><td>Recommandation de faible certitude ; ne pas remplacer l’évaluation cardiologique par ce tableau.</td></tr></tbody></table>
<p>La sécurité commence avant la poche : identité déclarée ou bracelet selon état, concordance documentaire, produit, groupe, compatibilité et péremption. Aux HUG, ces contrôles sont définis par la procédure 2025. Les modalités institutionnelles, notamment la validité de la recherche d’anticorps, doivent être celles du service qui transfuse.</p>
<p>Une réaction suspecte impose d’arrêter la transfusion, d’alerter, de surveiller et de conserver le produit pour investigation selon le circuit local. La<button class="w" data-k="d62-reaction">conduite immédiate</button> et la distinction<button class="w" data-k="d62-taco-trali">surcharge circulatoire / atteinte pulmonaire post-transfusionnelle</button> sont détaillées. La gravité de l’événement et sa causalité probable sont évaluées séparément en hémovigilance.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S613] Top 5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></section>
<section class="ilot" id="d62-12"><h2><span class="n">12</span> Après l’urgence : récupérer et éviter la récidive</h2>
<p>Le suivi vérifie d’abord l’absence de reprise du saignement et la récupération clinique. L’hémoglobine, la réponse réticulocytaire et le bilan martial sont interprétés avec la chronologie, les transfusions reçues, l’inflammation et les maladies associées. Une mauvaise réponse fait rechercher une perte persistante ou un autre mécanisme.</p>
<p>Le fer a sa place lorsque la carence est démontrée ou étayée dans le contexte approprié. Il ne corrige pas immédiatement le défaut de perfusion d’un choc. Le choix oral ou intraveineux tient compte de la tolérance, de l’efficacité attendue, de l’urgence de correction et des indications du produit suisse. Il ne faut pas confondre quantité de fer élémentaire et masse du sel.</p>
<p>Pour Ferinject, la <button class="w" data-k="d62-fi">FI</button> suisse demande une carence certaine confirmée par des examens appropriés et réserve le produit aux adultes lorsque le fer oral est insuffisamment efficace, inefficace ou impossible. Le calcul du besoin total et la dose maximale par administration sont deux étapes distinctes. Une surveillance d’au moins 30 minutes après l’administration est requise pour l’hypersensibilité.</p>
<p>Après l’accouchement, l’<button class="w" data-k="d62-sources">OMS</button> 2025 souligne que la ferritine est perturbée par l’inflammation. Sa recommandation de fer intraveineux est contextuelle, notamment si le fer oral ne convient pas ou si une correction rapide d’une anémie ferriprive sévère est nécessaire. Cette situation doit être conciliée avec les exigences de la <button class="w" data-k="d62-fi">FI</button> suisse, sans considérer une ferritine isolée comme une preuve suffisante.</p>
<p>Prévenir la récidive signifie traiter la cause de la perte, revoir les traitements qui favorisent le saignement et organiser les contrôles. Le rythme du suivi dépend de la gravité, de la source et de l’évolution ; aucun calendrier unique D62 n’est imposé sans source.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></section>
<section class="ilot" id="d62-13"><h2><span class="n">13</span> Situations particulières et parcours suisse</h2>
<p>La grossesse et le post-partum disposent de critères et de circuits spécifiques. La directive <button class="w" data-k="d62-sources">DGGG</button>/<button class="w" data-k="d62-sources">OEGGG</button>/<button class="w" data-k="d62-sources">SGGG</button> 2022 définit l’hémorragie après naissance par des volumes différents selon la voie d’accouchement, tout en reconnaissant le choc indépendamment du volume visible. L’<button class="w" data-k="d62-sources">OMS</button> 2025 propose un seuil thérapeutique plus précoce pour déclencher les premières mesures.</p>
<table class="t"><thead><tr><th>Référence</th><th>Critères cités</th><th>But et limite</th></tr></thead><tbody><tr><td><button class="w" data-k="d62-sources">SGGG</button> avec <button class="w" data-k="d62-sources">DGGG</button>/<button class="w" data-k="d62-sources">OEGGG</button>,2022</td><td>≥500 mL après voie basse ;≥1000 mL après césarienne ; présumer hémorragie si signes de choc, même avec volume visible moindre</td><td>Définition et prise en charge péripartales ; validité annoncée jusqu’au 31 juillet 2027.</td></tr><tr><td><button class="w" data-k="d62-sources">OMS</button> 2025, premières 24 h</td><td>Perte mesurée≥300 mL avec au moins un signe hémodynamique anormal, ou≥500 mL, au premier critère atteint</td><td>Seuil de premières mesures ; vigilance accrue premières 2 h ; pas déclencheur automatique de chirurgie ou transfusion.</td></tr><tr><td>Signes <button class="w" data-k="d62-sources">OMS</button> associés au seuil 300 mL</td><td>Pouls>100/min, pression systolique<100mmHg, diastolique<60mmHg ou indice de choc>1</td><td>Un seul suffit dans cette définition, pas une norme D62 générale.</td></tr></tbody></table>
<p>Chez l’enfant, ne pas reprendre les volumes, objectifs et schémas adultes. La <button class="w" data-k="d62-fi">FI</button> de <button class="w" data-k="d62-txa">TXA</button> précise des indications à partir d’un an et des données limitées ; celle d’Octaplex ne considère pas l’utilisation et la sécurité pédiatriques comme établies. Le sujet âgé, la cardiopathie et les atteintes cérébrales imposent de revoir la tolérance et les cibles.</p>
<p>L’insuffisance rénale modifie la sécurité de plusieurs traitements. Le fer intraveineux, le <button class="w" data-k="d62-txa">TXA</button> et les concentrés de facteurs ont chacun leurs règles ; « pas d’ajustement chiffré disponible » ne signifie pas « pas de contre-indication ». Pour la personne refusant certains produits sanguins, anticiper la discussion, documenter les choix et mobiliser l’équipe compétente ; aucune solution unique n’est imposée.</p>
<p>En Suisse, les incidents transfusionnels suivent le circuit d’hémovigilance et de traçabilité. Les conditions de remboursement sont celles de la liste officielle et de l’assureur dans le contexte applicable. Cette leçon ne garantit ni remboursement, ni délai standard d’arrêt de travail, ni reprise de conduite : aucune règle spécifique D62 de ce type n’a été établie dans les textes consultés.</p>

<section class="ilot" id="d62-14"><h2><span class="n">14</span> Critères formels et paramètres à emporter</h2>
<div class="alert"><b>Critères de raisonnement diagnostique.</b><p>Documenter une perte récente, une anémie compatible dans son contexte et sa chronologie, puis discuter les alternatives ou causes associées. Une hémoglobine initiale normale n’exclut pas l’hémorragie précoce. D62 est une catégorie sans subdivision ; elle inclut les pertes intra- et postopératoires et exclut la perte sanguine fœtale congénitale P61.3. Le code ne quantifie ni le choc ni la source.</p></div>
<div class="key"><b>Paramètres clés : nommer la population avant le chiffre.</b><p>Seuil diagnostique <button class="w" data-k="d62-sources">OMS</button> 2024 chez l’adulte 15–65 ans :120 g/L femme non enceinte,130 g/L homme. Ce n’est pas un seuil transfusionnel. En trauma transfusé, la cible 70–90 g/L ne remplace pas la clinique du choc. En digestif haut stabilisé, les seuils et cibles <button class="w" data-k="d62-sources">ESGE</button> dépendent du terrain cardiaque. Les critères obstétricaux ont leur propre tableau ci-dessus.</p><p>Horodater l’hémoglobine, les pertes, les perfusions, les produits sanguins, le lactate et les signes de perfusion. Pour le <button class="w" data-k="d62-txa">TXA</button>, préciser le contexte, la concentration exacte, la voie <button class="w" data-k="d62-fi">IV</button> et le départ de l’horloge : traumatisme ou naissance. Relire les contre-indications du produit suisse.</p></div>
<p>Pour l’examen fédéral, relier fatigue, dyspnée, pâleur et anémie aux situations de départ <button class="w" data-k="d62-profiles">PROFILES</button> 2017. La démarche attendue consiste à reconnaître l’urgence, interpréter les limites d’un test, traiter la source et justifier le traitement. Les documents <button class="w" data-k="d62-profiles">MEBEKO</button> 2026 et la transition ultérieure de <button class="w" data-k="d62-profiles">PROFILES</button> sont distingués ; aucune prédiction de question ou note médicale n’est revendiquée.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une personne stabilisée après une hémorragie digestive haute non variqueuse demande pourquoi on ne lui donne pas systématiquement du <button class="w" data-k="d62-txa">TXA</button>.</p><button data-ok="1">La directive ESGE déconseille cet usage dans ce contexte, malgré l’indication digestive inscrite dans la fiche suisse.</button><button data-ok="0">Tous les saignements reçoivent le même schéma de TXA.</button><button data-ok="0">Le TXA remplace les globules rouges perdus.</button><p class="fb" hidden>Une indication réglementaire et une recommandation clinique contextualisée sont deux informations différentes ; leur divergence doit rester explicite.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D60-D64?lang=fr" target="_blank" rel="noopener">[S601] CIM-10-GM 2024 français, D62</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S602] ICD-10-GM 2024 D62</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S619] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S623] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S624] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S625] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d62-cours">▲ Loi de Pareto — Monographie</button><details id="d62-reference-index"><summary>Ouvrir une explication ou une synthèse</summary><ul><li><button class="w" data-k="d62-indice">Indice de choc : calculer et contextualiser</button></li><li><button class="w" data-k="d62-unites">Hémoglobine : convertir g/dL et g/L</button></li><li><button class="w" data-k="d62-concentration">Pourquoi l’hémoglobine ne mesure pas directement la perte</button></li><li><button class="w" data-k="d62-oxygene">Saturation, hémoglobine et apport d’oxygène</button></li><li><button class="w" data-k="d62-indices">Indices érythrocytaires : moyennes et références</button></li><li><button class="w" data-k="d62-reticulocytes">Réticulocytes : production et chronologie</button></li><li><button class="w" data-k="d62-lactate">Lactate et déficit de base : suivre la perfusion</button></li><li><button class="w" data-k="d62-hemostase">Hémostase : plaquettes, facteurs et fibrinolyse</button></li><li><button class="w" data-k="d62-txa-calcul">TXA : de la dose au volume, puis à la durée</button></li><li><button class="w" data-k="d62-fer-calcul">Ferinject : besoin total et plafond par administration</button></li><li><button class="w" data-k="d62-rein">Fonction rénale : une table ne supprime pas une contre-indication</button></li><li><button class <div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="d62-e-1"><h2><span class="n">e-1</span> Hémogramme et réticulocytes : une lecture dynamique</h2>
<p>L’hémoglobine et l’hématocrite décrivent le sang prélevé à un moment donné. Comparer les résultats exige de connaître les pertes, les perfusions et les transfusions survenues entre les prélèvements. La directive européenne insiste sur les mesures répétées parce qu’une première valeur normale peut masquer la perte précoce.</p>
<p>Les indices érythrocytaires décrivent des propriétés moyennes. La fenêtre<button class="w" data-k="d62-indices">indices et plages de référence</button> distingue volume globulaire moyen, teneur et concentration corpusculaires. Une anémie normocytaire peut avoir plusieurs causes ; elle ne démontre pas une perte aiguë et n’exclut pas des carences associées.</p>
<p>Le document HUG 2022 décrit une réponse régénérative à partir de 120 G/L de réticulocytes et une réponse arégénérative en dessous de 70 G/L. La zone intermédiaire et la sévérité de l’anémie exigent une interprétation, pas un classement forcé. Ces repères datés ne remplacent pas les références du laboratoire ni la chronologie. L’hémolyse peut aussi être régénérative.</p>
<figure id="d62-exam-blood" data-origin="human-original"><img src="assets/img/d62/alpha/codex/normal-peripheral-blood.jpg" alt="Champ large de frottis humain avec nombreux disques rouges et barre originale100micromètres en haut à gauche" loading="lazy"><figcaption><b>Un frottis humain : une image n’est pas une concentration.</b> <b>Repère 1, disques rouges :</b> hématies réparties sur le champ. <b>Repère 2, centre plus clair de nombreux disques :</b> contraste de coloration, sans mesure individuelle. <b>Repère 3, régions plus denses :</b> la répartition sur une lame varie ; elle ne donne pas l’hémoglobine du patient. <b>Repère 4, haut gauche :</b> échelle originale 100µm conservée. Ce faible grossissement ne permet pas d’identifier une réticulocytose ni une carence martiale. Aucun aspect de ce champ ne prouve ou n’exclut une hémorragie aiguë. Original : Степанюк Ярослав et Борис Максим, photographie diffusée sur Wikimedia Commons, <a href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; repères français situés dans cette légende.</figcaption></figure><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Après une perte sanguine, on vous montre un frottis riche en hématies. Que pouvez-vous en conclure ?</p><button data-ok="1">L’image montre une morphologie, mais elle ne donne ni la concentration d’hémoglobine ni le volume perdu.</button><button data-ok="0">Le patient ne peut pas être anémique.</button><button data-ok="0">La photo suffit pour calculer le nombre d’unités à transfuser.</button><p class="fb" hidden>Une distribution de cellules sur une lame ne mesure pas le sang circulant. Numération, chronologie et tolérance restent nécessaires.</p></div><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S618] Human blood smear — Кров людини</a>.</p></div></section>
<section class="ilot" id="d62-e-2"><h2><span class="n">e-2</span> Perfusion et hémostase : compléter la numération</h2>
<p>Le lactate est utile pour estimer et suivre la perturbation de perfusion en traumatologie. Un résultat élevé ne constitue pas une preuve exclusive de saignement : la production et la clairance peuvent toutes deux intervenir. Le déficit de base fournit une autre information acido-basique ; insuffisance rénale et hyperchlorémie peuvent aussi le modifier.</p>
<p>Les examens d’hémostase recherchent les déficits associés à une hémorragie majeure. Le temps de prothrombine ou son rapport normalisé, le fibrinogène de Clauss et la numération plaquettaire apportent des informations différentes. Les méthodes viscoélastiques peuvent compléter le bilan selon le protocole disponible.</p>
<p>Le tableau présente des repères de la directive européenne de traumatologie 2023. Les valeurs normales sont celles du laboratoire ; les chiffres ci-dessous sont des <b>objectifs ou déclencheurs contextualisés</b>.</p>
<table class="t"><thead><tr><th>Mesure</th><th>Repère en trauma</th><th>Limite</th></tr></thead><tbody><tr><td>Fibrinogène de Clauss</td><td>≤1,5 g/L avec hémorragie majeure : supplémentation à envisager selon recommandation</td><td>Une anomalie viscoélastique fonctionnelle peut aussi guider ; produit et dose relèvent du protocole.</td></tr><tr><td>Plaquettes</td><td>Maintenir>50 G/L si saignement persistant ;>100 G/L si traumatisme crânien</td><td>Recommandation de faible niveau de preuve, pas objectif pour toute anémie.</td></tr><tr><td>Calcium ionisé</td><td>Maintenir dans l’intervalle normal de la méthode</td><td>Surveillance particulièrement importante lors de transfusion massive ; ne pas substituer sans contextualisation le calcium total.</td></tr><tr><td>Température</td><td>Prévenir les pertes de chaleur et maintenir la normothermie</td><td>La température participe à l’hémostase ; pas de seuil de clôture D62 déduit.</td></tr></tbody></table>
<p>Les résultats sont réévalués pendant la prise en charge. Un bilan initial acceptable n’assure pas qu’il le restera si la perte se poursuit.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></section>
<section class="ilot" id="d62-e-3"><h2><span class="n">e-3</span> Localiser sans retarder le traitement</h2>
<p>La première décision est de savoir si une investigation supplémentaire peut précéder le contrôle de la source. La directive européenne recommande un contrôle immédiat chez les patients avec source évidente et chez ceux en choc extrême avec source suspectée. Chez les autres, elle recommande une investigation rapide si la source n’est pas connue.</p>
<p>L’échographie ciblée au point de soins fait partie de l’évaluation du traumatisme thoracoabdominal. Elle recherche notamment du liquide dans des espaces définis. Le scanner injecté corps entier peut identifier les lésions et la source potentielle. Une méthode rapide ne devient pas un examen exhaustif ; son résultat doit être confronté à la physiologie et au mécanisme de la lésion.</p>
<p>Dans une hémorragie digestive ou obstétricale, mobiliser le circuit de la spécialité. Une même baisse d’hémoglobine peut conduire à des examens et à des gestes différents selon le siège. La leçon D62 explique la conséquence hématologique et les principes transversaux ; elle ne remplace pas la monographie de chaque source.</p>
<div class="key"><b>À retenir.</b> Un examen a de la valeur s’il répond à la question clinique au bon moment. Il ne doit pas devenir un délai inutile avant une hémostase urgente.</div><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a>.</p></div></section>
<section class="ilot" id="d62-e-4"><h2><span class="n">e-4</span> Préparer la transfusion et analyser une réaction</h2>
<p>Avant transfusion, la procédure HUG 2025 prévoit la vérification de l’identité et de la concordance entre documents et produit, du groupe, des contrôles de compatibilité et des conditions du produit. Le laboratoire doit connaître les antécédents transfusionnels et les informations utiles. Les délais et exceptions relèvent de la procédure institutionnelle.</p>
<p>Une réaction suspecte nécessite d’abord la conduite clinique immédiate. L’investigation peut ensuite comprendre contrôle documentaire, groupe, recherche d’anticorps, compatibilité et test direct à l’antiglobuline. Les marqueurs de destruction érythrocytaire aident à rechercher une hémolyse ; des prélèvements bactériologiques peuvent être requis si une contamination est discutée.</p>
<p>Selon Swissmedic 2024, une réaction hémolytique peut être immédiate ou retardée. Une baisse d’hémoglobine, une réponse insuffisante à la transfusion, un ictère ou des urines foncées doivent être interprétés avec le contexte. Une dyspnée nouvelle peut relever d’une surcharge, d’une atteinte pulmonaire, d’une allergie ou d’une autre cause : ne pas conclure seulement « encore anémique ».</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></section>
<section class="ilot" id="d62-e-5"><h2><span class="n">e-5</span> Bilan martial et contrôle après stabilisation</h2>
<p>Le bilan martial répond à une question de récupération : existe-t-il un manque de fer qui limite la production ? La ferritine, la saturation de la transferrine et l’hémogramme doivent être interprétés ensemble et selon l’inflammation. Un résultat isolé ne résume pas tous les contextes.</p>
<p>Après l’accouchement, l’<button class="w" data-k="d62-sources">OMS</button> 2025 souligne que la ferritine est sensible à l’inflammation et ne convient pas comme critère isolé immédiat pour établir une carence. Le contexte de perte, l’anémie antérieure et les autres données guident une évaluation spécialisée. La <button class="w" data-k="d62-fi">FI</button> de Ferinject exige de son côté une carence confirmée par des analyses appropriées ; cette exigence n’est pas supprimée par le recours à une recommandation générale.</p>
<p>Pour juger la réponse à une supplémentation par Ferinject, sa <button class="w" data-k="d62-fi">FI</button> propose de réévaluer l’hémoglobine au plus tôt quatre semaines après la dernière administration. Ce délai concerne l’évaluation du traitement martial : il ne signifie jamais qu’il faut attendre quatre semaines pour contrôler une numération si un saignement ou une aggravation sont suspectés.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></section><button class="pareto-btn ui" data-k="pareto-d62-examens">▲ Loi de Pareto — Examens</button></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="d62-tab-semio" role="tab" aria-selected="true" aria-controls="d62-s-semio" data-s="d62-s-semio">Sémiologie fondamentale et analytique</button><button id="d62-tab-anat" role="tab" aria-selected="false" aria-controls="d62-s-anat" data-s="d62-s-anat">Anatomie</button><button id="d62-tab-histo" role="tab" aria-selected="false" aria-controls="d62-s-histo" data-s="d62-s-histo">Histologie</button><button id="d62-tab-physio" role="tab" aria-selected="false" aria-controls="d62-s-physio" data-s="d62-s-physio">Physiologie</button><button id="d62-tab-bio" role="tab" aria-selected="false" aria-controls="d62-s-bio" data-s="d62-s-bio">Biochimie et hémostase</button><button id="d62-tab-immuno" role="tab" aria-selected="false" aria-controls="d62-s-immuno" data-s="d62-s-immuno">Immunohématologie</button></div><div class="chap-body sci-body"><div class="sci" id="d62-s-semio" role="tabpanel" aria-labelledby="d62-tab-semio"><section class="ilot" id="d62-semio-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><h4>La fonction normale : transporter et perfuser</h4><p>L’hémoglobine des hématies transporte l’oxygène ; la circulation l’amène aux tissus. Le nombre de transporteurs, leur saturation et le débit sont des dimensions différentes. La moelle renouvelle les éléments figurés, tandis que l’hémostase limite les pertes après une lésion. Cette organisation explique pourquoi un seul examen ne peut résumer une hémorragie.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S616] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a>.</p></div></section><section class="ilot" id="d62-semio-signs" data-semiology="signs"><h3>Des signes à observer ensemble</h3><p>La pâleur et l’asthénie peuvent accompagner l’anémie. La dyspnée, les vertiges, la syncope ou la douleur thoracique renseignent la tolérance. L’hypotension, les marbrures, l’oligurie et les troubles de conscience font rechercher une mauvaise perfusion. Leur importance dépend de la vitesse d’installation et du terrain ; aucun ne démontre à lui seul le mécanisme.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a>.</p></div></section><section class="ilot" id="d62-semio-mechanisms" data-semiology="mechanisms"><h3>Deux perturbations qui se renforcent</h3><p>La perte de sang peut réduire le volume circulant et la masse érythrocytaire. Une réponse cardiovasculaire compense une partie du déficit, mais elle n’est pas toujours suffisante. Les mouvements de liquide et les perfusions modifient ensuite la concentration d’hémoglobine. Une saturation normale ne corrige pas la diminution du nombre de molécules d’hémoglobine disponibles.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a>.</p></div></section><section class="ilot" id="d62-semio-examination" data-semiology="examination"><h3>Choisir une mesure pour une question</h3><p>L’examen répété recherche la source et la tolérance. La numération mesure une concentration et des populations cellulaires ; le lactate renseigne la perturbation de perfusion ; les tests d’hémostase étudient la capacité à former un caillot. L’échographie et le scanner explorent des lésions et compartiments. Le choix de leur ordre dépend de la nécessité d’une hémostase immédiate.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a>.</p></div></section><section class="ilot" id="d62-semio-interpretation" data-semiology="interpretation"><h3>L’heure du résultat fait partie du résultat</h3><p>Relier le prélèvement au début du saignement, au remplissage et aux produits transfusés. Une première hémoglobine normale peut être trompeuse ; une diminution ultérieure peut associer perte et dilution. Le lactate peut aussi varier avec sa clairance. Les références du laboratoire et le contexte évitent d’appeler chaque variation une aggravation du même mécanisme.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></section><section class="ilot" id="d62-semio-differentials" data-semiology="differentials"><h3>Distinguer sans exclure les associations</h3><p>Une réticulocytose se rencontre dans la réponse à une perte mais aussi dans l’hémolyse. Ictère, marqueurs de destruction et immunohématologie orientent la seconde hypothèse. La carence chronique et l’inflammation modifient les indices et les réserves en fer. Un antécédent d’anémie ou une maladie médullaire peut expliquer une partie du résultat actuel.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S622] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a>.</p></div></section><section class="ilot" id="d62-semio-urgency" data-semiology="urgency"><h3>Reconnaître le moment où il faut agir</h3><p>Un choc avec source évidente ou probable impose le circuit de contrôle urgent du saignement. Une altération de conscience, une mauvaise perfusion ou une douleur thoracique ne doivent pas attendre le franchissement d’un seuil d’hémoglobine. Les objectifs de pression et les schémas hémostatiques diffèrent entre traumatisme, saignement digestif et contexte obstétrical.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a>.</p></div></section><section class="ilot" id="d62-semio-limits" data-semiology="limits"><h3>Ce que la sémiologie ne permet pas d’affirmer</h3><p>Le volume perdu n’est pas calculable avec exactitude à partir d’un signe isolé, d’une photographie de frottis ou d’un seul chiffre d’hémoglobine. Les fréquences et sensibilités spécifiques à D62 ne sont pas établies dans ce dossier. Les objectifs de patients stables ne sont pas des seuils universels en hémorragie active ; une amélioration transitoire ne certifie pas l’arrêt définitif de la perte.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S618] Human blood smear — Кров людини</a>.</p></div></section><section class="ilot" id="d62-semio-sources" data-semiology="sources"><h3>Sources, populations et décisions</h3><p>Le cadre suisse de premier recours est confronté à la directive européenne de traumatologie 2023, à <button class="w" data-k="d62-sources">ESGE</button> 2026 et aux textes obstétricaux <button class="w" data-k="d62-sources">SGGG</button> 2022 et <button class="w" data-k="d62-sources">OMS</button> 2025. Les textes n’ont pas tous le même niveau de preuve ni la même population. Les fiches suisses de produits sont datées et leurs divergences sont enseignées ; les décisions restent liées au contexte réellement étudié.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a>.</p></div></section><figure id="d62-causal-semio"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="550" viewBox="0 0 580 550" role="img" aria-label="Du mécanisme à la décision"><title>Du mécanisme à la décision</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="66" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Perte récente : quantité et volume</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="182" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Signes de tolérance + mesures</tspan><tspan x="290" dy="29">datées</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="312" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Source à contrôler, support à</tspan><tspan x="290" dy="29">adapter</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Réévaluation clinique et</tspan><tspan x="290" dy="29">biologique</tspan></text></svg><figcaption><b>Du mécanisme à la décision.</b> Cette chaîne résume les recommandations HUG et européennes ; elle ne remplace pas un protocole de réanimation. Schéma causal non anatomique ; aucune structure du corps dessinée.</figcaption></figure><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div><div class="key"><p><b>Science → clinique.</b> Perte et tolérance produisent des signes complémentaires.</p><p><b>Science → examen.</b> Relier clinique et mesures horodatées.</p><p><b>Science → traitement.</b> Agir sur source et perfusion sans attendre un chiffre isolé.</p><p><b>À retenir.</b> Relier le mécanisme, la mesure et la décision avec leurs limites.</p></div><button class="pareto-btn ui" data-k="pareto-d62-semio">▲ Loi de Pareto — Sémiologie fondamentale et analytique</button></div><div class="sci" id="d62-s-anat" role="tabpanel" aria-labelledby="d62-tab-anat" hidden><section class="ilot" id="d62-s-anat-cours"><h3>Les compartiments : circulation, moelle et lieu de perte</h3>
<p>Le sang circule dans le système vasculaire. Une lésion peut permettre sa sortie vers l’extérieur ou vers un espace interne. Le lieu où le sang est perdu détermine ce qui est visible et quels examens sont utiles. La quantité aperçue dans une plaie, des selles ou un drain n’est pas automatiquement la totalité de la perte.</p>
<p>En traumatologie thoracoabdominale, les examens ciblés cherchent notamment du liquide dans les espaces accessibles à l’échographie ; le scanner injecté peut préciser lésions et source. Ces moyens ne sont pas interchangeables. La stabilité du patient et l’existence d’une source exigeant un contrôle immédiat déterminent la place de l’imagerie.</p>
<p>La moelle hématopoïétique est un autre compartiment. Elle produit les nouvelles cellules sanguines et les libère dans la circulation. La photographie situe ce tissu à l’intérieur de l’os ; elle ne représente ni un réservoir de sang immédiatement mobilisable ni une image de l’hémorragie du patient.</p>
