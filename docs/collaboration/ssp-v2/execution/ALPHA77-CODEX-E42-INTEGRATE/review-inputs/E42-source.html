<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e42-e-1"><h2><span class="n">e-1</span>Mesurer la croissance et les deux composantes</h2><table class="t" data-e42-table="1"><thead><tr><th>Mesure</th><th>Question</th><th>Interprétation</th></tr></thead><tbody><tr><td>Poids et courbe</td><td>Quelle évolution avant et pendant la maladie ?</td><td>L’eau augmente le poids ; les pertes digestives peuvent le diminuer rapidement.</td></tr><tr><td>Taille ou longueur</td><td>Quelle croissance et quel poids pour cette taille ?</td><td>Matériel adapté, position et référence sont nécessaires ; ne pas confondre poids pour âge et poids pour taille.</td></tr><tr><td>Périmètre brachial</td><td>Existe-t-il une émaciation sévère chez les 6–59 mois ?</td><td>Moins de 115 mm est un seuil utile, pas une mesure sans erreur ni une cause.</td></tr><tr><td>Œdème</td><td>Est-il bilatéral, prenant le godet et de cause nutritionnelle probable ?</td><td>Décrire extension, symétrie et évolution ; chercher les autres causes.</td></tr></tbody></table>
<p>Un examen répété après correction des pertes ou diminution de l’œdème peut modifier la lecture du poids. Documenter l’état hydrique de chaque mesure, plutôt que déclarer toute variation comme gain ou perte de tissu. Le même matériel et une technique reproductible rendent la série plus utile [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Mesurer permet de suivre ; interpréter exige de savoir ce qui a changé dans l’eau et les tissus [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-e-2"><h2><span class="n">e-2</span>Biologie : complications et diagnostics différentiels</h2><p>La glycémie est une mesure immédiate si l’enfant est malade ou présente des signes de danger. Le bilan des électrolytes, du phosphate, du magnésium, de la fonction rénale et de l’état infectieux dépend de la gravité et du contexte. La surveillance est rapprochée lors de la renutrition ; un résultat initial normal n’exclut pas un manque de réserve [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Albumine, protéines et bilan hépatique peuvent aider à comprendre un œdème ou une maladie associée. L’albumine est aussi influencée par l’inflammation, la dilution et les pertes : elle ne suffit pas à classer une forme nutritionnelle ni à mesurer directement l’apport alimentaire. Une protéinurie ou une perte digestive demande son raisonnement propre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>Dans le diagnostic différentiel pédiatrique, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">IPNA</a> définit la protéinurie de rang néphrotique par un rapport protéines/créatinine urinaires au moins 200 mg/mmol, ou des critères de collecte équivalents. Associée à albumine inférieure à 30 g/l, ou à un œdème si l’albumine n’est pas disponible, elle définit un syndrome néphrotique. La bandelette dépiste ; la quantification confirme. Ce seuil ne définit pas <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
<p>Devant une suspicion de perte digestive de protéines, la recherche fécale d’alpha-1-antitrypsine et sa clairance peuvent être utiles selon le contexte. Elles ne révèlent pas seules la cause et n’identifient pas toujours une fuite gastrique. Le choix du test suit l’hypothèse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> La biologie recherche surtout complications et causes associées ; aucune albumine seuil ne remplace la description clinique de la forme mixte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-e-3"><h2><span class="n">e-3</span>Explorations ciblées et limites des marqueurs récents</h2><p>Urines, microbiologie, recherche de tuberculose ou d’une autre infection, bilan digestif et exploration cardiaque ou hépatique sont orientés par l’histoire et l’examen. Il ne s’agit pas d’un catalogue obligatoire à demander pour tout enfant. Une infection peut nécessiter des soins avant une confirmation complète [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>L’imagerie ou l’endoscopie peuvent répondre à une hypothèse spécifique de maladie d’organe ; elles ne sont pas des critères universels de <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>. Une micrographie normale sert à comprendre l’absorption, pas à poser le diagnostic individuel. Une biopsie n’est pas demandée pour simplement constater l’émaciation [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p>L’étude de 2026 sur les protéines de matrice et les lipides a comparé des groupes d’enfants sélectionnés, sans séparer les formes mixtes des autres formes œdémateuses. Les différences observées sont exploratoires et n’ont pas de seuil clinique validé pour diagnostiquer <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>. Ni analyse de microbiote ni séquençage génétique ne remplacent actuellement l’évaluation clinique et anthropométrique décrite par l’<button class="w" data-k="e42-oms">OMS</button> [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Un examen devient utile s’il répond à une question et peut modifier les soins. Un marqueur de recherche n’est pas automatiquement un test disponible ou validé [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-e-4"><h2><span class="n">e-4</span>Quatre exercices pour relier signes et décisions</h2><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Un enfant de dix-huit mois a un bras mesuré à 105 mm et des œdèmes bilatéraux au godet. Quelle démarche ?</p>
<button data-ok="0">Conclure sur l’œdème seul et ne pas mesurer la croissance.</button><button data-ok="1">Rechercher la gravité, confirmer les composantes et évaluer la cause nutritionnelle ainsi que les autres causes d’œdème.</button><p class="fb" hidden>La fonte et l’œdème peuvent coexister, mais un œdème bilatéral peut aussi avoir une cause rénale ou autre. Le triage et l’enquête restent nécessaires [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
</div><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Le poids baisse pendant que l’œdème diminue sous traitement. Que conclure ?</p>
<button data-ok="0">Déclarer nécessairement un échec nutritionnel parce que tout poids perdu est du muscle.</button><button data-ok="1">Interpréter avec état hydrique, prises et évolution clinique ; la baisse peut correspondre à une perte d’eau.</button><p class="fb" hidden>Eau et tissu contribuent au poids. Une mesure isolée ne départage pas leur évolution [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
</div><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> L’enfant est stable et transférable vers l’ambulatoire. Est-ce la fin du traitement nutritionnel ?</p>
<button data-ok="0">Oui ; quitter l’hôpital signifie que tous les critères anthropométriques de sortie sont atteints.</button><button data-ok="1">Non ; le transfert clinique et la fin du traitement ont des critères distincts et nécessitent une continuité organisée.</button><p class="fb" hidden>L’<button class="w" data-k="e42-oms">OMS</button> distingue transfert et fin du programme. Les critères de fin chez 6–59 mois gardent les deux mesures anthropométriques et l’absence d’œdème répétées [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
</div><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Que prouvent les essais récents sans surcharge observée pendant la réhydratation ?</p>
<button data-ok="0">Ils autorisent à appliquer un volume intraveineux unique à tout enfant E42, sans surveillance.</button><button data-ok="1">Ils apportent des données utiles mais ne garantissent pas un risque nul dans toute forme mixte et toute situation.</button><p class="fb" hidden>Peu d’enfants avaient un œdème et les équipes assuraient un suivi étroit. Absence d’événement, équivalence universelle et absence de risque ne sont pas synonymes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</p>
</div><div class="key"><b>À retenir.</b> Une bonne réponse explique ce que les signes permettent de conclure, et ce qu’ils ne prouvent pas [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-e-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e42-tab-semio" role="tab" aria-controls="e42-s-semio" data-s="e42-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="e42-tab-anat" role="tab" aria-controls="e42-s-anat" data-s="e42-s-anat" aria-selected="false">Anatomie</button><button id="e42-tab-histo" role="tab" aria-controls="e42-s-histo" data-s="e42-s-histo" aria-selected="false">Histologie</button><button id="e42-tab-physio" role="tab" aria-controls="e42-s-physio" data-s="e42-s-physio" aria-selected="false">Physiologie</button><button id="e42-tab-bioch" role="tab" aria-controls="e42-s-bioch" data-s="e42-s-bioch" aria-selected="false">Biochimie</button><button id="e42-tab-gene" role="tab" aria-controls="e42-s-gene" data-s="e42-s-gene" aria-selected="false">Génétique et immunologie</button></div><div class="chap-body sci-body"><div class="sci" role="tabpanel" aria-labelledby="e42-tab-semio" id="e42-s-semio"><section class="ilot" id="e42-s-semio-cours"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><div class="key"><b>Science → clinique.</b> Comprendre le fonctionnement normal puis sa perturbation aide à interpréter les signes. <b>Science → examen.</b> La question clinique détermine la mesure et ses limites. <b>Science → traitement.</b> Les soins suivent gravité, âge et cause ; aucune observation isolée ne fournit une prescription universelle [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Signe et mécanisme</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mesure et interprétation</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Orientation et soins</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement de raisonnement, pas schéma anatomique ni score individuel [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</figcaption></figure>
<p>Relier un signe à un mécanisme ne consiste pas à lui attribuer une cause certaine. L’enjeu est de comprendre ce qu’il permet de rechercher, de mesurer et de décider dans cette population [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<section class="ilot" id="e42-semio-normal" data-semiology="normal"><h3>Normal : réserves et croissance</h3><p>Un enfant en croissance reçoit et absorbe les nutriments nécessaires aux fonctions et à la construction des tissus. La courbe décrit une trajectoire, tandis que les mesures de poids, longueur et bras apportent des informations complémentaires. L’eau participe aussi au poids ; elle ne représente pas une réserve musculaire ou graisseuse. Un examen normal est toujours situé dans l’âge et le contexte, sans confondre petite taille constitutionnelle et perte récente de tissu [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
</section>
<section class="ilot" id="e42-semio-signs" data-semiology="signs"><h3>Signes et symptômes</h3><p>La fonte musculaire et la perte de graisse peuvent coexister avec un œdème bilatéral prenant le godet. Chercher fatigue, baisse d’appétit, diarrhée, difficultés alimentaires, lésions de peau et changements des cheveux, sans exiger chaque signe. L’œdème peut masquer la minceur des membres ou du visage. L’infection peut être peu fébrile ; un comportement inhabituel ou une difficulté respiratoire garde donc toute sa valeur clinique [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
</section>
<section class="ilot" id="e42-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe</h3><p>Le manque d’apports ou une maladie réduisent les ressources disponibles, avec mobilisation des réserves et ralentissement de la croissance. Les échanges d’eau et les barrières contribuent au phénotype œdémateux ; l’albumine seule n’en explique pas toutes les différences. Faiblesse et mauvaise tolérance aux apports peuvent refléter plusieurs perturbations. Les pistes moléculaires de matrice et de lipides sont des associations exploratoires, pas une cause unique démontrée chez chaque enfant [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
</section>
<section class="ilot" id="e42-semio-examination" data-semiology="examination"><h3>Examen expliqué</h3><p>Commencer par respiration, conscience, perfusion, température et glycémie si l’enfant est malade. Rechercher le godet aux deux pieds et décrire son extension. Mesurer bras gauche relâché, ruban sans compression, puis poids et taille ou longueur avec méthode adaptée. Examiner bouche, peau, abdomen, respiration et diurèse. Les gestes sont expliqués à l’enfant et à l’accompagnant ; une mesure faite rapidement mais sans bonne technique peut égarer [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
</section>
<section class="ilot" id="e42-semio-interpretation" data-semiology="interpretation"><h3>Interprétation contextualisée</h3><p>Chez les six à cinquante-neuf mois, bras inférieur à 115 mm ou poids pour taille/longueur inférieur à−3 écarts-types indique une émaciation sévère selon l’<button class="w" data-k="e42-oms">OMS</button>. L’œdème nutritionnel suffit aussi à classer une malnutrition aiguë sévère, mais ne prouve pas sa cause sur simple inspection. Une baisse pondérale sous traitement peut accompagner la disparition de l’eau. Croiser mesures, histoire, examen et évolution évite de confondre quantité de tissu et volume liquidien [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
</section>
<section class="ilot" id="e42-semio-differentials" data-semiology="differentials"><h3>Différentiels utiles</h3><p>Le syndrome néphrotique peut produire un godet semblable : rechercher et quantifier les protéines urinaires. Une perte digestive, un défaut de synthèse hépatique, une atteinte cardiaque ou une fuite capillaire peuvent aussi contribuer à l’œdème. Une albumine basse ne tranche pas à elle seule. Plusieurs causes et une dénutrition peuvent coexister ; il faut donc éviter à la fois le bilan uniforme de tous les organes et l’étiquette nutritionnelle automatique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
</section>
<section class="ilot" id="e42-semio-urgency" data-semiology="urgency"><h3>Urgence et orientation</h3><p>Danger neurologique, impossibilité de boire, choc, détresse respiratoire, hypoglycémie, hypothermie ou infection sévère imposent une évaluation urgente. L’échec du test d’appétit et l’œdème sévère orientent aussi vers l’hospitalisation dans les protocoles de six à cinquante-neuf mois. L’alimentation spécialisée ne remplace pas les soins d’une complication. La déshydratation est réévaluée fréquemment ; les signes habituels peuvent être modifiés par la fonte et l’œdème [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
</section>
<section class="ilot" id="e42-semio-limits" data-semiology="limits"><h3>Limites et relation de soin</h3><p>Aucun examen unique ne donne la cause ou toutes les réserves. Les seuils ne se transposent pas directement au nourrisson plus jeune ou à l’adulte ; les références et le matériel comptent. Un retrait relationnel, une difficulté matérielle ou un trouble de l’alimentation demandent une écoute sans culpabilisation. La fin du séjour hospitalier ne termine pas nécessairement le traitement ; expliquer le suivi et vérifier l’accès aux aliments et aux visites font partie de l’examen global [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
</section>
<section class="ilot" id="e42-semio-sources" data-semiology="sources"><h3>Sources, populations et portée</h3><p>Les critères cliniques et les décisions sont reliés à la <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">directive OMS 2023</a> et au <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">manuel MSF 2024</a>. Les recommandations <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">IPNA 2022</a> soutiennent le différentiel rénal. Les populations et critères de sortie divergent parfois ; cette leçon les conserve explicitement. Les lectures suisses de produits et de formation n’établissent ni un protocole suisse unique <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ni une validation médicale humaine [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
</section>
<div class="key"><b>À retenir.</b> Lire fonte, œdème et évolution ensemble, rechercher urgence puis cause et maintenir un suivi adapté [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e42-tab-anat" id="e42-s-anat" hidden><div class="key"><b>Science → clinique.</b> Comprendre le fonctionnement normal puis sa perturbation aide à interpréter les signes. <b>Science → examen.</b> La question clinique détermine la mesure et ses limites. <b>Science → traitement.</b> Les soins suivent gravité, âge et cause ; aucune observation isolée ne fournit une prescription universelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</div><section class="ilot" id="e42-s-anat-cours"><h2><span class="n">s-anat-cours</span>Anatomie : trajet des nutriments et échanges de liquide</h2><p>Le tube digestif transforme et absorbe les aliments ; le grêle comprend duodénum, jéjunum et iléon. Sa paroi comporte plusieurs couches et sa muqueuse forme des plis, des villosités et des microvillosités. Ces structures ne sont pas trois noms pour un même relief : les plis comprennent muqueuse et sous-muqueuse, les villosités sont des projections de muqueuse, et les microvillosités se trouvent à la surface apicale des cellules [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p>Une villosité contient des vaisseaux sanguins et un chylifère lymphatique. Les sucres et acides aminés absorbés rejoignent le sang portal ; une partie des lipides passe par la lymphe avant de rejoindre la circulation. Cette organisation explique pourquoi absorption, circulation sanguine et drainage lymphatique sont liés mais non équivalents. Les schémas de la planche décrivent le normal, pas le mécanisme certain d’un œdème nutritionnel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p>La graisse sous-cutanée et le muscle constituent des compartiments que l’examen peut apprécier et les mesures suivre indirectement. Dans la forme mixte, la fonte peut être importante alors que le liquide interstitiel augmente le volume des membres. Un contour externe plus arrondi n’assure donc pas que la masse musculaire soit conservée. Le périmètre du bras apporte une information utile, sans être une imagerie directe de la composition de chaque tissu [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Le foie, les vaisseaux et les voies lymphatiques participent aux échanges et à la distribution des substrats. Les travaux récents sur la matrice des tissus et le drainage sont des pistes : ils ne prouvent pas une lésion anatomique unique dans toute <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>. Une atteinte cardiaque, rénale ou digestive peut aussi modifier les échanges, d’où le diagnostic différentiel de l’œdème [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>La démarche anatomique guide les questions : pertes digestives et diarrhée orientent vers le tube digestif, protéinurie vers le rein, signes de congestion vers le cœur. Elle ne justifie pas de demander toute imagerie ni une biopsie systématique. Le traitement doit maintenir des apports absorbables, corriger les complications et rechercher la cause accessible au soin [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>

</div><div class="sci" role="tabpanel" aria-labelledby="e42-tab-histo" id="e42-s-histo" hidden><div class="key"><b>Science → clinique.</b> Comprendre le fonctionnement normal puis sa perturbation aide à interpréter les signes. <b>Science → examen.</b> La question clinique détermine la mesure et ses limites. <b>Science → traitement.</b> Les soins suivent gravité, âge et cause ; aucune observation isolée ne fournit une prescription universelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</div><section class="ilot" id="e42-s-histo-cours"><h2><span class="n">s-histo-cours</span>Histologie : surface d’absorption et barrière</h2><p>Au microscope, le grêle normal montre un épithélium simple avec cellules absorbantes, cellules à mucus et autres cellules spécialisées. Les villosités augmentent la surface et les cryptes occupent les espaces qui les séparent. La bordure en brosse correspond à un ensemble de microvillosités apicales ; ce n’est pas une seconde couche de villosités visible à l’œil nu. L’image électronique et les vues optiques montrent donc des échelles différentes [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p>La barrière n’est pas une paroi inerte. Les cellules et leur environnement participent à l’absorption, à la sécrétion et à la défense. Une lésion de muqueuse ou une altération de son intégrité peut contribuer à malabsorption, pertes et inflammation. Dans la dénutrition et certaines entéropathies, ces anomalies peuvent entretenir la difficulté à récupérer malgré des aliments proposés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>Il ne faut pourtant pas déduire une lésion histologique précise du seul code. Les altérations intestinales décrites dans les revues sont hétérogènes et dépendent des maladies, des infections et du recrutement. Une villosité raccourcie n’est pas spécifique de la forme mixte, et les modèles de souris ou de porcelets ne remplacent pas une observation humaine. Le tissu normal montré ici n’est ni une biopsie d’un enfant <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ni un contrôle apparié à l’étude moléculaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p>Les pertes digestives protéiques peuvent relever d’une surface muqueuse lésée ou d’un trouble lymphatique. Le dosage fécal ciblé et l’examen de la cause peuvent alors être plus utiles qu’une simple répétition d’albumine. Une endoscopie avec prélèvement reste une décision spécialisée pour une question précise, pas une condition préalable à l’alimentation d’un enfant instable [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>Pour les soins, cette histologie explique pourquoi une diarrhée, un défaut d’absorption ou une infection peuvent demander plus qu’un apport calorique théorique. Les aliments sont choisis selon phase et tolérance ; une mauvaise réponse conduit à réévaluer la cause et la mise en œuvre. La coloration des micrographies n’étant pas précisée dans la notice, elle n’est pas inventée ; leurs grossissements originaux ne sont pas une mesure à effectuer sur l’écran [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2418_Histology_Small_IntestinesN.jpg" target="_blank" rel="noopener">S20</a>].</p>

<section class="ilot" id="e42-s-physio-cours"><h2><span class="n">s-physio-cours</span>Physiologie : adaptation, perfusion et renutrition</h2><p>À l’état nourri, les apports permettent d’utiliser et de stocker les substrats tout en soutenant croissance et fonctions. Quand les apports diminuent, la production d’insuline baisse et le métabolisme mobilise progressivement glycogène, protéines et graisse. La dépense et la croissance s’adaptent, mais cette réponse ne supprime ni les besoins essentiels ni le risque infectieux [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>La fonte représente une perte de réserve fonctionnelle autant qu’un changement de poids. Le muscle participe au mouvement et à la respiration ; fatigue, baisse d’activité et moindre tolérance à une maladie peuvent accompagner sa perte. L’état circulatoire dépend aussi de la perfusion et des échanges d’eau, qui ne se lisent pas directement sur la présence ou l’absence d’un œdème. Un enfant œdémateux peut être déshydraté [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>La classification de l’hydratation est difficile parce que yeux creux et pli cutané peuvent être modifiés par la malnutrition. L’histoire de diarrhée, vomissements et apports, la perfusion, la diurèse et les examens répétés servent à suivre une trajectoire. Le poids peut changer rapidement avec l’eau, sans que toute variation représente du tissu reconstitué ou perdu [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>La réalimentation réactive l’utilisation glucidique et l’anabolisme. Des électrolytes entrent dans les cellules, tandis que l’équilibre hydrosodé se modifie. Si les réserves sont basses, un apport trop peu surveillé peut révéler faiblesse, troubles du rythme ou dysfonction respiratoire. Cela ne signifie pas qu’il faut laisser persister une hypoglycémie : l’urgence métabolique et la progression nutritionnelle planifiée répondent à des objectifs différents [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Les protocoles répartissent ainsi stabilisation, transition et rattrapage. L’enfant sans complication et avec appétit peut entrer directement dans un programme ambulatoire adapté ; l’enfant instable a d’abord besoin de soins hospitaliers. L’efficacité se juge sur l’ensemble clinique, l’alimentation tolérée, la disparition de l’œdème et la récupération mesurée, pas sur un gain pondéral instantané [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> L’adaptation au déficit a ses limites ; le retour des apports exige lui aussi une surveillance physiologique [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-s-physio-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e42-tab-bioch" id="e42-s-bioch" hidden><div class="key"><b>Science → clinique.</b> Comprendre le fonctionnement normal puis sa perturbation aide à interpréter les signes. <b>Science → examen.</b> La question clinique détermine la mesure et ses limites. <b>Science → traitement.</b> Les soins suivent gravité, âge et cause ; aucune observation isolée ne fournit une prescription universelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Réserves et besoins</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Bilan et déplacements</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Correction surveillée</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement de raisonnement, pas schéma anatomique ni score individuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</figcaption></figure>
<section class="ilot" id="e42-s-bioch-cours"><h2><span class="n">s-bioch-cours</span>Biochimie : substrats, cofacteurs et réserves invisibles</h2><p>L’oxydation des glucides, des lipides et des acides aminés dépend de réactions enzymatiques et de cofacteurs. Le phosphate intervient dans les molécules énergétiques et de nombreuses réactions ; le magnésium et le potassium participent au fonctionnement cellulaire. La thiamine, transformée en coenzyme, contribue notamment au métabolisme glucidique. Une carence peut devenir particulièrement importante lorsque l’utilisation des glucides augmente [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p>La concentration sanguine d’un élément n’est pas la quantité totale disponible dans le corps. Pendant un déficit prolongé, des stocks peuvent diminuer avant qu’un prélèvement ne montre une anomalie majeure. Après réalimentation, les déplacements intracellulaires et les besoins accrus peuvent faire baisser phosphate, potassium et magnésium. Les chiffres servent à adapter la correction, mais leur lecture garde le contexte rénal, acido-basique et médicamenteux [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>L’albumine possède des fonctions de transport et participe à la pression oncotique. Sa concentration dépend aussi de la synthèse, des pertes, de l’inflammation et de la dilution. Elle n’est donc ni une mesure directe du dernier repas ni un test spécifique de <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>. Une hypoalbuminémie peut accompagner un syndrome néphrotique, une perte digestive ou une maladie inflammatoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>Les analyses de 2026 ont identifié dans une cohorte des signatures de protéines de matrice et de sphingolipides associées à l’œdème et évoluant avec le traitement. Ces lipides participent à la structure et à la signalisation cellulaires. Les analyses ne prouvent cependant pas si les signatures sont causes, conséquences ou manifestations parallèles d’un processus commun. L’étude n’a pas validé une analyse sanguine de routine spécifique de la forme mixte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<p>Le lien clinique est concret : surveiller les complications biochimiques pendant la renutrition, rechercher les causes d’anomalies et vérifier produit, voie et fonction rénale avant supplémentation. Les molécules de recherche ne deviennent pas des compléments universels et l’albumine basse ne constitue pas, seule, une indication de perfusion d’albumine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Le bilan est une fenêtre sur un système dynamique. Il ne mesure pas à lui seul les réserves et ne remplace pas les critères cliniques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-s-bioch-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e42-tab-gene" id="e42-s-gene" hidden><div class="key"><b>Science → clinique.</b> Comprendre le fonctionnement normal puis sa perturbation aide à interpréter les signes. <b>Science → examen.</b> La question clinique détermine la mesure et ses limites. <b>Science → traitement.</b> Les soins suivent gravité, âge et cause ; aucune observation isolée ne fournit une prescription universelle [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Barrière et réponse immune</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Infection et signes parfois discrets</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Soins et suivi de récupération</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement de raisonnement, pas schéma anatomique ni score individuel [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</figcaption></figure>
<section class="ilot" id="e42-s-gene-cours"><h2><span class="n">s-gene-cours</span>Génétique et immunologie : terrain et réponse de l’hôte</h2><p>Normalement, les barrières, les cellules de l’immunité innée et celles de l’immunité adaptative coopèrent pour reconnaître et contrôler les agents infectieux. Les cellules présentatrices d’antigènes contribuent à activer les lymphocytes, et les réponses nécessitent énergie et nutriments. Le nombre de cellules dans le sang n’est pas une mesure complète de leur efficacité ni de l’intégrité de la barrière intestinale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<p>Dans la malnutrition sévère, des études humaines décrivent des perturbations de présentation antigénique, de réponses cellulaires ou de médiateurs, tandis que d’autres mécanismes proviennent surtout de modèles animaux. Les résultats ne sont pas uniformes : des nombres leucocytaires préservés peuvent coexister avec une fonction altérée. Cela explique la prudence devant un enfant infecté qui ne présente pas une fièvre ou une réaction biologique habituelle [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<p>La susceptibilité à une forme œdémateuse a conduit à étudier le terrain de l’hôte, l’environnement et le microbiote. Cela ne fait pas de <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> une maladie mendélienne définie par une mutation unique. Les critères de l’<button class="w" data-k="e42-oms">OMS</button> reposent sur l’évaluation clinique et anthropométrique ; ils ne demandent pas un séquençage ou une analyse de microbiote. Une maladie génétique sous-jacente peut être recherchée si d’autres arguments la suggèrent, sans devenir l’explication par défaut de toute forme mixte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<p>Les travaux moléculaires récents renforcent l’idée d’une réponse complexe impliquant inflammation, matrice et lipides, mais leurs groupes œdémateux ne séparent pas les enfants avec marasme associé. Les analyses de microbiome avaient de petits effectifs et n’ont pas montré de signature spécifique robuste. Un résultat négatif dans ce cadre ne démontre pas que tout rôle du microbiote est absent [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<p>Pour la clinique et le traitement, retenir la vulnérabilité infectieuse, la nécessité d’une recherche adaptée et la surveillance de la récupération. Une normalisation du poids ne certifie pas la restauration complète de l’immunité ; une efficacité observée chez la souris ou le porc n’autorise pas un probiotique ou une intervention génétique de routine chez l’enfant. Les résultats d’études anciennes et leur qualité doivent rester contrôlés avant toute application [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Le terrain influence la réponse, sans fournir un test génétique universel <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>. Distinguer normal, observations humaines et modèles expérimentaux [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-s-gene-cours">Essentiel de cette partie</button></section>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e42-p-1"><h2><span class="n">p-1</span>Aliments thérapeutiques : dose, phase et composition</h2><table class="t" data-e42-table="1"><thead><tr><th>Produit et phase</th><th>Composition ou apport source</th><th>Population et limite</th></tr></thead><tbody><tr><td><button class="w" data-k="e42-f75">F-75</button>, stabilisation</td><td>75 kcal et 0,9 g de protéines pour 100 ml.</td><td>Volume prescrit selon état et protocole ; pas 130 ml/kg/j universel en œdème sévère.</td></tr><tr><td><button class="w" data-k="e42-f100">F-100</button>, réhabilitation</td><td>100 kcal et 2,9 g de protéines pour 100 ml.</td><td>Après stabilisation ; moins 6 mois avec œdème/instabilité, pas à pleine concentration.</td></tr><tr><td>Transition hospitalière vers aliment prêt à l’emploi</td><td>100–135 kcal/kg/j, transition de 2–3 jours selon tolérance.</td><td>Recommandation <button class="w" data-k="e42-oms">OMS</button> maintenue, distincte du rattrapage ambulatoire.</td></tr><tr><td>Aliment thérapeutique prêt à l’emploi, 6–59 mois ambulatoires</td><td>150–185 kcal/kg/j jusqu’à récupération ; ou réduction 100–130 après disparition émaciation sévère/œdème, jusqu’à récupération.</td><td>Deux options, décision du programme et du suivi ; pas réduction obligatoire après guérison.</td></tr></tbody></table>
<p>Ces produits sont des aliments à fins médicales spécifiques, pas des médicaments interchangeables au même volume. La composition, la dilution, le mode de préparation, les apports liquides et la conservation se vérifient sur le produit réel et dans le protocole. Ne pas remplacer un lait de stabilisation par un lait plus concentré simplement pour « rattraper » plus vite [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Les aliments conformes contiennent vitamines et minéraux. Avant d’ajouter vitamine A, zinc ou autres compléments, vérifier ce qui est déjà reçu. Les fortes doses supplémentaires de vitamine A ne sont pas routinières si les aliments conformes en apportent suffisamment. Une indication spécifique doit rester distincte de l’ajout systématique [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>La qualité des soins comprend l’observation de la prise, la poursuite de l’allaitement si présent, la gestion des intolérances et l’accès aux aliments après transfert. Les durées typiques de phase sont des repères de programme, pas un calendrier qui remplace l’état de l’enfant [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> Vérifier la phase et la préparation avant le calcul. Un apport théorique ne garantit ni ingestion, ni absorption, ni sécurité [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-p-2"><h2><span class="n">p-2</span>Réhydratation : voie, sodium et surveillance</h2><table class="t" data-e42-table="1"><thead><tr><th>Source / situation</th><th>Choix décrit</th><th>Ce qu’il faut éviter</th></tr></thead><tbody><tr><td><button class="w" data-k="e42-oms">OMS</button> 2023,6–59 mois sévères déshydratés sans choc</td><td><button class="w" data-k="e42-resomal">ReSoMal</button> préféré ; solution orale de faible osmolarité si indisponible.</td><td><button class="w" data-k="e42-resomal">ReSoMal</button> à domicile ou débit sans surveillance.</td></tr><tr><td>Choléra suspecté ou diarrhée aqueuse profuse</td><td>Solution <button class="w" data-k="e42-oms">OMS</button> standard de faible osmolarité, préparée normalement.</td><td>Dilution supplémentaire ou remplacement automatique par <button class="w" data-k="e42-resomal">ReSoMal</button>.</td></tr><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2022, sachet <button class="w" data-k="e42-resomal">ReSoMal</button></td><td>84 g dans 2 litres d’eau propre bouillie et refroidie ; utiliser solution dans 24 h.</td><td>Concentrer le sachet, injecter la solution, mélanger les quantités avec un autre produit.</td></tr><tr><td>Déshydratation grave / choc / intolérance</td><td>Évaluation et protocole hospitalier selon perfusion, pertes, voie tolérée et surveillance.</td><td>Interdire toute perfusion ou appliquer à tous un volume d’essai clinique.</td></tr></tbody></table>
<p>Le bilan inclut tous les liquides : réhydratation, laits, eau, perfusions et médicaments. Rechercher réponse clinique, diurèse, poids et signes de surcharge sans attribuer automatiquement un gonflement à une seule cause. L’œdème n’exclut pas un déficit intravasculaire ou une déshydratation par diarrhée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">S5</a>].</p>
<p>Les débits de différents manuels et essais ne sont pas ajoutés. Les protocoles <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> ont leur méthode d’estimation et de réévaluation, tandis que l’<button class="w" data-k="e42-oms">OMS</button> 2023 énonce un choix de solution et des conditions. L’essai oral <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">GASTROSAM</a> 2026 a comparé les solutions avec des volumes, des équipes et une surveillance définis ; ce n’est pas un protocole familial universel [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>].</p>
<p>Dans l’essai oral, seuls 24 des 415 enfants avaient un œdème nutritionnel. Dans l’essai intraveineux, 11 des 272 avaient un kwashiorkor. L’absence de surcharge observée et l’absence de différence de mortalité établie doivent donc être interprétées avec prudence pour les formes mixtes, sans nier ces données nouvelles ni certifier une équivalence générale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</p>
<div class="key"><b>À retenir.</b> Réhydrater exige de choisir une stratégie complète et de suivre la réponse. Le débat récent ne supprime ni le besoin de liquide ni la surveillance [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-p-3"><h2><span class="n">p-3</span>Amoxicilline : produit, indication et rythme</h2><table class="t" data-e42-table="1"><thead><tr><th>Référence / population</th><th>Dose et rythme</th><th>Limite</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> février 2024, 6–59 mois, routine nutritionnelle sans infection spécifique</td><td>50 mg/kg par prise, max 1 g, deux fois par jour pendant 5–7 jours, voie orale.</td><td>Protocole de programme, pas traitement de tout sepsis ni fréquence de FI suisse.</td></tr><tr><td>FI axapharm suspension octobre 2024, enfant ≤ 40 kg</td><td>50–100 mg/kg/j en 3–4 prises ; maximum 2000 mg/j et 50 mg/kg par prise.</td><td>Pas indication spécifique <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ; volume 50 mg/ml après préparation.</td></tr><tr><td>Nouveau-né / prématuré, FI</td><td>Parentéral en règle du fait absorption incertaine ; oral au plus tôt dès 8 jours.</td><td>Pas application automatique du schéma 6–59 mois au nouveau-né.</td></tr><tr><td>Rein, enfant ≤ 40 kg</td><td>FI demande une forme parentérale en insuffisance rénale.</td><td>Ne pas inventer un intervalle oral infantile à partir du tableau adulte.</td></tr><tr><td>Rein, adulte/enfant > 40 kg</td><td>Clairance 10–30 ml/min : maximum 500 mg toutes 12 h ; &lt;  10 : maximum 500 mg toutes 24 h.</td><td>Ces plafonds ne sont pas une nouvelle dose <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ni un tableau de nourrisson.</td></tr></tbody></table>
<p>La formulation lue est <button class="w" data-k="e42-amoxicilline">Amoxicilline axapharm</button> 200 mg/4 ml, poudre pour suspension orale, soit 50 mg/ml après préparation, FI octobre 2024. Les comprimés dispersibles axapharm d’abord consultés ne sont pas prévus pour les enfants jusqu’à 40 kg : ils ne servent donc pas de preuve de posologie de cette suspension [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
<p>La dose quotidienne haute du manuel <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> est dans la plage quotidienne de la FI, mais la fréquence n’est pas la même et l’indication nutritionnelle de programme n’est pas une indication spécifique du libellé suisse. Le prescripteur vérifie protocole applicable, germe éventuel, produit et terrain ; il ne combine pas arbitrairement le nombre de prises d’une source avec la durée d’une autre. Vomissements importants, mauvaise absorption ou infection grave peuvent imposer un autre parcours hospitalier [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
<p>Contre-indications : hypersensibilité aux pénicillines/céphalosporines et situations du libellé comme mononucléose ou leucémie lymphoïde. Rechercher réaction immédiate, éruption grave, diarrhée sévère ou sanglante, et atteinte rénale/cristallurie. Méthotrexate, allopurinol et anticoagulants oraux demandent une vérification des interactions ; le suivi est adapté au traitement prolongé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
<p>La FI demande prudence en grossesse ; elle prévoit de ne pas administrer pendant l’allaitement ou de sevrer si nécessaire. Cette formulation datée reste attribuée au produit, sans devenir une règle universelle de toute <button class="w" data-k="e42-amoxicilline">amoxicilline</button> : une décision chez une mère allaitante se discute avec le prescripteur. Agiter la suspension et respecter sa conservation maximale de dix jours après préparation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Nom, concentration et population sont aussi importants que mg/kg. La routine nutritionnelle ne remplace pas l’évaluation d’une infection grave [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-p-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-p-4"><h2><span class="n">p-4</span>Thiamine : prévenir sans extrapoler</h2><table class="t" data-e42-table="1"><thead><tr><th>Population / indication</th><th>Repère réellement lu</th><th>Ce qui ne se transpose pas</th></tr></thead><tbody><tr><td>Consensus suisse 2019, adulte médical à risque de renutrition</td><td>Thiamine 200–300 mg au moins 30 min avant les apports planifiés ; suivi clinique et biologique.</td><td>Pas dose de nourrisson, pas raison de retarder correction d’une hypoglycémie urgente.</td></tr><tr><td><button class="w" data-k="e42-thiamine">Benerva</button> FI avril 2019, adulte/adolescent dès 12 ans, prophylaxie</td><td>100 mg un jour sur deux par voie orale.</td><td>Pas protocole universel de prévention de renutrition pédiatrique.</td></tr><tr><td><button class="w" data-k="e42-thiamine">Benerva</button>, carence modérée / grave orale</td><td>100 mg/j modérée ; 200–300 mg/j grave.</td><td>Ces schémas sont ceux de la FI, pas des prises à empiler.</td></tr><tr><td><button class="w" data-k="e42-thiamine">Benerva</button>, grave carence parentérale</td><td>Jusqu’à 200 mg/j ; intramusculaire ou intraveineuse très lente, puis orale si possible.</td><td>300 mg oral ne signifie pas 300 mg intraveineux ; injection hospitalière avec surveillance.</td></tr><tr><td>Moins 12 ans</td><td>Utilisation/innocuité non systématiquement étudiées selon FI.</td><td>Ne pas fabriquer une dose infantile à partir des comprimés adultes.</td></tr></tbody></table>
<p><button class="w" data-k="e42-thiamine">Benerva</button> existe en comprimés 100 et 300 mg et ampoules de 100 mg pour 1 ml. La thiamine est un cofacteur de réactions du métabolisme glucidique ; une réserve insuffisante peut devenir problématique au retour des apports. Le besoin quotidien physiologique, le traitement d’une carence et la prévention de renutrition d’un adulte à risque ne sont pas le même schéma [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p>La voie orale est préférée si possible ; l’injection intraveineuse doit être très lente et limitée aux patients hospitalisés en raison des réactions anaphylactoïdes. Hypersensibilité est une contre-indication. Les comprimés 100 mg contiennent lactose et saccharose avec contre-indications particulières d’intolérance ; les ampoules contiennent un conservateur, et la quantité restante est éliminée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p>Antiacides peuvent diminuer l’absorption ; des antagonistes comme 5-fluorouracile interfèrent avec l’action. La FI réserve les doses de <button class="w" data-k="e42-thiamine">Benerva</button> en grossesse/allaitement à une nécessité absolue, distincte des quantités couvrant les besoins quotidiens. Elle ne fournit pas un ajustement chiffré universel pour tout rein ou foie [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p>Chez l’enfant plus jeune, l’équipe pédiatrique détermine produit, voie et dose selon le protocole applicable et les apports reçus. L’absence de dose infantile validée dans cette FI n’est pas une raison d’ignorer une carence suspectée, mais une raison de ne pas copier le tableau adulte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> La thiamine doit être pensée avec la renutrition, mais une dose adulte ou une voie n’est pas interchangeable avec une dose infantile [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-p-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-p-5"><h2><span class="n">p-5</span>Électrolytes, vitamines et risque de doublon</h2><p>Phosphate, potassium et magnésium sont suivis et corrigés selon l’état, les résultats et la fonction rénale. La correction d’un seul chiffre sans rechercher les autres perturbations peut être insuffisante. Le consensus adulte souligne notamment le lien entre magnésium et hypokaliémie persistante ; ce mécanisme ne fournit pas un débit pédiatrique de perfusion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Avant supplémentation, compter ce qui provient des aliments thérapeutiques, des solutions et des médicaments. Le fait de recevoir un produit nutritionnel n’assure pas que toute anomalie soit corrigée, mais rend également possible un doublon. Les prescriptions prennent en compte voie, concentration, vitesse, quantité par prise et total quotidien [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Les fortes doses de vitamine A ne sont pas ajoutées systématiquement à des aliments conformes déjà enrichis ; le zinc supplémentaire n’est pas routinier dans le protocole <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> lorsque les quantités recommandées d’aliments thérapeutiques sont prises. Une carence spécifique, une malabsorption ou une autre indication demandent une évaluation distincte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Ce cours ne donne pas de dose parentérale de phosphate, de potassium ou de magnésium sans monographie du produit exact et protocole pédiatrique adaptés. Un schéma adulte ou une dose d’essai ne devient pas une prescription générale <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>. Surveillance cardiaque et biologique, fonctions d’organe et réponse clinique guident l’équipe [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
