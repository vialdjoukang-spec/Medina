ui s’entretiennent</a></li><li><a href="#e42-6">Anamnèse : reconstruire l’évolution sans culpabiliser</a></li><li><a href="#e42-7">Examen clinique : voir, mesurer et interpréter</a></li><li><a href="#e42-8">Urgences et complications : ne pas attendre la renutrition</a></li><li><a href="#e42-9">Diagnostic : confirmer les composantes et rechercher une autre cause</a></li><li><a href="#e42-10">Traitement nutritionnel : une progression guidée par l’état</a></li><li><a href="#e42-11">Médicaments et liquides : ne pas mélanger les protocoles</a></li><li><a href="#e42-12">Suivi, transfert et prévention des rechutes</a></li><li><a href="#e42-13">Âges particuliers et pratique suisse</a></li><li><a href="#e42-14">Critères utiles et pièges de raisonnement</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e42-1"><h2><span class="n">1</span>Un œdème qui masque la fonte</h2><p>Une enfant fictive de dix-huit mois arrive pour diarrhée et refus de manger. Ses pieds sont gonflés, mais les bras sont très fins et la courbe de croissance s’est infléchie. Son poids paraît moins inquiétant que son état : l’eau des œdèmes peut masquer une perte de tissus. Le premier enjeu est de repérer une urgence, puis de caractériser ensemble l’émaciation et l’œdème, sans conclure à une cause nutritionnelle sur le seul aspect [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Le kwashiorkor avec marasme associe les signes d’une forme œdémateuse et ceux d’une émaciation importante. On ne soigne pas deux maladies indépendantes l’une après l’autre : on évalue un enfant vulnérable dont les besoins nutritionnels, l’infection éventuelle, les pertes digestives et la perfusion doivent être pris en charge de façon coordonnée [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>En Suisse, <button class="w" data-k="e42-profiles">PROFILES</button> demande notamment d’évaluer l’état nutritionnel, une perte de poids, un œdème, une croissance insuffisante et les difficultés alimentaires de l’enfance. Le lien avec <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> est pédagogique ; ce n’est ni une correspondance officielle entre classification et objectif fédéral, ni une question d’examen garantie. La vignette est originale [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> L’œdème peut rendre la dénutrition moins visible. Chercher d’abord la gravité, puis mesurer et expliquer les deux composantes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-2"><h2><span class="n">2</span>Définition, périmètre et classification</h2><p>Le libellé suisse local de la classification 2024 est « Kwashiorkor avec marasme ». <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ne comporte pas de sous-code dans ce catalogue. Les notes allemandes incluent une malnutrition protéino-énergétique grave de forme intermédiaire ou présentant simultanément les signes du kwashiorkor et du marasme [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>].</p>
<table class="t" data-e42-table="1"><thead><tr><th>Catégorie</th><th>Ce qu’elle décrit</th><th>Prudence</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E40</a></td><td>Kwashiorkor : œdème nutritionnel et autres signes possibles.</td><td>Un poids proche de la moyenne n’est pas une condition obligatoire ; l’œdème ne dit pas seul s’il existe une fonte.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E41</a></td><td>Marasme nutritionnel avec émaciation.</td><td>La présence d’un œdème nutritionnel associé fait rechercher une forme mixte.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a></td><td>Signes simultanés ou forme intermédiaire.</td><td>Documenter les signes, les mesures et la cause ; pas de diagnostic sur albumine seule.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E43</a></td><td>Malnutrition protéino-énergétique grave sans précision.</td><td>Ne remplace pas une forme mixte effectivement décrite ; comprend un œdème de famine non précisé.</td></tr></tbody></table>
<p>La terminologie actuelle de l’<button class="w" data-k="e42-oms">OMS</button> parle d’émaciation et/ou d’œdème nutritionnel. Chez les enfants de six à cinquante-neuf mois, une émaciation sévère correspond à un poids pour la taille ou la longueur inférieur à trois écarts-types sous la médiane, ou à un périmètre brachial inférieur à 115 mm. L’œdème nutritionnel bilatéral suffit aussi à classer une malnutrition aiguë sévère. Pour parler de la forme mixte, il faut reconnaître également l’émaciation [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>Le mot « aiguë » n’implique pas nécessairement un début récent : les facteurs causaux peuvent évoluer depuis longtemps. Retard statural, poids insuffisant pour l’âge, émaciation et œdème décrivent des dimensions différentes, parfois simultanées. Les notes générales de codage et les seuils de décision clinique gardent leurs objectifs propres [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> désigne un tableau mixte documenté. Ni un œdème isolé, ni une albumine basse, ni le seul code ne suffisent à raconter la situation [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-3"><h2><span class="n">3</span>Épidémiologie : le bon indicateur et le bon dénominateur</h2><p>Aucune incidence suisse contemporaine de la forme mixte <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> n’est établie dans les lectures ciblées. Cela ne démontre pas son absence : une présentation rare peut être liée à une maladie digestive, à des difficultés alimentaires ou à une vulnérabilité sociale. Les fréquences de dénutrition hospitalière, d’émaciation mondiale et de kwashiorkor ne sont pas interchangeables [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">S15</a>].</p>
<p>Les estimations conjointes <a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">UNICEF</a>, <button class="w" data-k="e42-oms">OMS</button> et Banque mondiale publiées en 2025 décrivent pour 2024 environ 42,8 millions d’enfants de moins de cinq ans avec une émaciation, soit 6,6%, dont 12,2 millions avec une émaciation sévère. Ce sont des estimations de prévalence largement fondées sur des enquêtes, pas le nombre de tous les épisodes survenant au cours d’une année. Elles ne donnent pas directement la fréquence des œdèmes ni des formes mixtes [<a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">S15</a>].</p>
<p>Les séries hospitalières sélectionnent souvent les cas compliqués ; les programmes ambulatoires sélectionnent autrement. Une mortalité observée dans une cohorte ne devient donc pas le risque d’une enfant suivie en Suisse, ni une hiérarchie universelle entre marasme, kwashiorkor et forme mixte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<p>Dans l’étude moléculaire publiée en octobre 2026 au Niger, soixante enfants par groupe ont été recrutés selon un plan cas-témoins. Les enfants œdémateux y regroupent aussi les formes avec émaciation. Un tel échantillonnage n’est pas un sondage de prévalence et ne permet pas d’isoler une fréquence <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<div class="key"><b>À retenir.</b> Une prévalence d’émaciation n’est ni une incidence annuelle, ni une mesure des seules formes mixtes. Toujours préciser population et recrutement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">S15</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-4"><h2><span class="n">4</span>Du fonctionnement normal aux pertes de réserve</h2><p>Les apports alimentaires fournissent énergie, acides aminés, acides gras et micronutriments. Le tube digestif doit permettre digestion et absorption, le foie transforme et distribue les substrats, et les tissus utilisent ou stockent ces ressources. Une réserve corporelle ne se lit pas sur une seule concentration sanguine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p>Quand les apports restent insuffisants, l’organisme mobilise glycogène, graisse et protéines, tout en réduisant certaines dépenses et la croissance. Cette adaptation peut limiter temporairement les besoins sans rendre le déficit sans danger. Fonte musculaire, faiblesse et perte de graisse deviennent visibles ; l’infection et les pertes digestives peuvent accélérer le déséquilibre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Dans la forme œdémateuse, une hypoalbuminémie peut contribuer aux mouvements d’eau, mais n’explique pas seule tout le tableau. L’intégrité des barrières, le drainage lymphatique, l’inflammation et la matrice des tissus sont aussi étudiés. Les associations moléculaires récentes restent des pistes, pas une démonstration d’un mécanisme unique ni une indication de perfuser systématiquement de l’albumine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<p>La réalimentation change encore la situation : la sécrétion d’insuline et l’utilisation des glucides augmentent, avec des besoins en phosphate, potassium, magnésium et thiamine. Des réserves épuisées peuvent se révéler par des anomalies sanguines et une défaillance d’organes. L’œdème déjà présent avant les apports et un œdème qui s’aggrave pendant la renutrition ne s’interprètent donc pas automatiquement de la même façon [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Apports, absorption et besoins</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Réserves, tissus et échanges d’eau</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Mesures puis soins coordonnés</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les voies sont multiples ; ce schéma ne quantifie pas une cause d’œdème et ne représente pas une anatomie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Comprendre la réserve, la fonction et les échanges d’eau explique pourquoi le poids et l’albumine ne suffisent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-5"><h2><span class="n">5</span>Causes, formes et facteurs qui s’entretiennent</h2><p>Une disponibilité alimentaire insuffisante, un sevrage mal accompagné, une alimentation peu diversifiée, des préparations inadaptées ou des difficultés de prise peuvent réduire les apports. Les conditions économiques, l’accès à l’eau, la sécurité alimentaire et la santé des personnes qui s’occupent de l’enfant font partie de l’histoire médicale ; ils ne sont pas des motifs de jugement moral [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Une maladie peut réduire l’appétit, augmenter les besoins ou provoquer des pertes. Diarrhée persistante, infection, maladie digestive, atteinte neurologique ou autre maladie chronique peuvent participer. Plusieurs mécanismes peuvent coexister ; le diagnostic nutritionnel ne dispense jamais de rechercher une cause accessible au traitement [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>La forme mixte comporte des signes de fonte et un œdème nutritionnel. Les lésions de peau, les changements des cheveux et une hépatomégalie peuvent orienter mais ne sont pas obligatoires pour reconnaître une urgence. L’absence d’un aspect « typique » ne suffit pas à rassurer, et une alimentation dite riche en calories ne prouve pas la couverture de tous les besoins [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Les modèles de carence protéique isolée ont une valeur historique mais ne résument pas les connaissances actuelles. La réponse de l’hôte, les infections, les barrières et les échanges moléculaires sont étudiés ; aucune mutation ou composition de microbiote n’est actuellement nécessaire aux critères cliniques de l’<button class="w" data-k="e42-oms">OMS</button>. Les résultats animaux ne deviennent pas un test ou un traitement validé de la forme mixte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Chercher comment apports, maladie et environnement se combinent. Le phénotype ne remplace ni l’enquête causale ni l’écoute de la famille [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-6"><h2><span class="n">6</span>Anamnèse : reconstruire l’évolution sans culpabiliser</h2><p>Reprendre les courbes, les anciens poids et les dates des œdèmes, de la diarrhée, de la fièvre et de la baisse d’appétit. Demander ce qui était réellement préparé, proposé, accepté et absorbé, avec des quantités et des fréquences aussi concrètes que possible. Une prise présentée comme abondante peut être peu énergétique, mal diluée, vomie ou partagée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Chez le nourrisson, observer l’allaitement ou la préparation des substituts plutôt que se limiter à « allaitement oui/non ». Rechercher difficultés de succion, déglutition, douleur, fatigue, refus alimentaire ou besoin d’aide. L’<button class="w" data-k="e42-oms">OMS</button> insiste sur l’évaluation du couple nourrisson-personne qui s’en occupe, y compris santé physique, santé mentale et soutien disponible [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p>Explorer infections et expositions, traitements, maladies digestives ou chroniques, antécédents et trajectoire du développement. Devant un œdème, des urines anormales, un gonflement matinal des paupières, une cardiopathie ou des signes de maladie hépatique peuvent conduire à d’autres hypothèses, sans exclure une dénutrition associée [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>Enfin, demander si les aliments prescrits, l’eau sûre, les visites de suivi et les médicaments sont accessibles. Les conseils doivent tenir compte de la langue, des gestes possibles et des ressources. Documenter l’obstacle et organiser une aide concrète est plus utile que noter simplement une « mauvaise observance » [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> Une chronologie précise et des gestes observés révèlent les mécanismes. Les difficultés matérielles et relationnelles font partie du soin [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-7"><h2><span class="n">7</span>Examen clinique : voir, mesurer et interpréter</h2><div data-semiology-clinical="E42"><p><button class="w" data-k="e42-semio">La sémiologie clinique</button> relie fonte, œdème, état général et signes de complication. Commencer par conscience, respiration, perfusion, température et glycémie ; poursuivre par les mesures et l’examen des organes. Un enfant malnutri peut être infecté sans présenter une fièvre ou une réaction habituelle [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
</div><p>Rechercher <button class="w" data-k="e42-godet">un godet</button> sur les deux pieds : après pression puis relâchement, une dépression persistante traduit un œdème prenant le godet. Décrire symétrie et extension, puis peau, cheveux, masses musculaires et graisse sous-cutanée. Un œdème bilatéral n’est appelé nutritionnel qu’après confrontation au contexte et aux autres causes, notamment rénales [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
<p>Mesurer poids, taille ou longueur avec le matériel approprié, puis <button class="w" data-k="e42-bras">périmètre du bras gauche</button> au milieu du bras relâché, ruban au contact sans comprimer. Reporter sur les références adaptées, avec mesures sériées. Le poids est augmenté par l’eau ; une baisse pendant la résolution de l’œdème ne prouve pas à elle seule une perte nutritionnelle supplémentaire [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Évaluer bouche, peau, respiration, abdomen, foie, état neurologique, signes infectieux et diurèse. La perte de tissu peut modifier le pli cutané et l’aspect des yeux, tandis que l’œdème peut masquer la déshydratation. L’histoire des pertes, la perfusion et les réévaluations comptent davantage qu’un signe isolé présenté comme infaillible [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> Le godet, les mesures et les signes de perfusion répondent à des questions différentes. Leur interprétation reste clinique et répétée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-7">Essentiel de cette partie</button></section>

<section class="ilot" id="e42-8"><h2><span class="n">8</span>Urgences et complications : ne pas attendre la renutrition</h2><p>Incapacité de boire ou téter, vomissement de tout apport, convulsions, léthargie ou inconscience sont des signes de danger. Détresse respiratoire, choc, hypoglycémie, hypothermie, anémie grave ou infection sévère imposent un niveau de soins adapté. La prise en charge vitale précède les calculs d’apport et ne se réduit pas à administrer une pâte thérapeutique [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>Chez l’enfant de six à cinquante-neuf mois, l’<button class="w" data-k="e42-oms">OMS</button> recommande l’hospitalisation en présence de signes de danger, de problème médical aigu, d’œdème nutritionnel sévère (+++) ou d’échec au test d’appétit. Le manuel <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> retient notamment l’extension de l’œdème jusqu’au visage parmi les complications graves ; ces descriptions doivent être utilisées dans leur protocole, sans fabriquer une gradation commune à toutes les publications [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>Une infection sévère peut se révéler par abattement, hypothermie, hypoglycémie ou difficulté respiratoire sans fièvre franche. Un traitement anti-infectieux hospitalier et le soutien des fonctions sont alors organisés rapidement ; l’<button class="w" data-k="e42-amoxicilline">amoxicilline</button> orale de routine d’un programme nutritionnel ne suffit pas à traiter tout sepsis [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
<p>À l’introduction ou à l’augmentation des apports, surveiller faiblesse nouvelle, tachycardie, tachypnée, anomalies neurologiques et aggravation des œdèmes. Le <button class="w" data-k="e42-renutrition">syndrome de renutrition</button> combine parfois perturbations électrolytiques, manque de thiamine et rétention hydrosodée. Une hypophosphatémie seule ne définit pas toute la gravité et d’autres causes doivent rester envisagées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<div class="key"><b>À retenir.</b> Traiter immédiatement les menaces vitales et rechercher leur cause. La nutrition est indispensable, mais ne remplace pas la réanimation d’une complication [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-8">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-9"><h2><span class="n">9</span>Diagnostic : confirmer les composantes et rechercher une autre cause</h2><p>Après le triage, documenter l’émaciation, l’œdème et le contexte nutritionnel. Chez les six à cinquante-neuf mois, périmètre brachial et poids pour la taille ou la longueur apportent des critères utiles, mais l’eau et une déshydratation aiguë peuvent modifier les mesures. L’examen et la trajectoire évitent de transformer une valeur ponctuelle en diagnostic complet [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<table class="t" data-e42-table="1"><thead><tr><th>Hypothèse</th><th>Indice et examen utile</th><th>Limite</th></tr></thead><tbody><tr><td>Forme mixte nutritionnelle</td><td>Fonte et œdème nutritionnel simultanés, histoire et croissance.</td><td>Pas besoin d’une dermatose, pas de seuil d’albumine définissant <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>.</td></tr><tr><td>Syndrome néphrotique</td><td>Bandelette puis quantification de la protéinurie, fonction rénale et albumine.</td><td>L’œdème au godet peut être semblable ; une dénutrition peut coexister.</td></tr><tr><td>Perte digestive de protéines</td><td>Contexte digestif, albumine et recherche ciblée de perte fécale.</td><td>Une alpha-1-antitrypsine fécale n’indique pas seule le site ou la cause.</td></tr><tr><td>Atteinte cardiaque, hépatique ou fuite capillaire</td><td>Examen, histoire et explorations orientées vers l’organe ou l’infection.</td><td>Ne pas tout attribuer à l’alimentation ni demander le même bilan à tous.</td></tr></tbody></table>
<p>Le syndrome néphrotique pédiatrique associe une protéinurie de rang néphrotique à une hypoalbuminémie, ou à un œdème si l’albumine n’est pas disponible. Une bandelette positive conduit à une quantification, de préférence sur urine matinale. Ce raisonnement ferme une lacune importante : l’œdème bilatéral n’est pas, par lui-même, la preuve d’une cause nutritionnelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
<p>Les pertes digestives, les défauts de synthèse, l’inflammation et la dilution peuvent aussi abaisser l’albumine. Le bilan s’oriente selon la situation ; la biopsie digestive n’est ni une condition de diagnostic de <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>, ni une manière de retarder le traitement d’une complication [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Établir les deux composantes, puis leur cause. Une albumine basse ne départage pas à elle seule nutrition, perte rénale, perte digestive et inflammation [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-9">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-10"><h2><span class="n">10</span>Traitement nutritionnel : une progression guidée par l’état</h2><p>Le lieu de traitement dépend de la gravité et de la possibilité d’un suivi sûr. Une forme sans complication, avec appétit conservé et évaluation suffisante, peut relever d’un programme ambulatoire ; une forme compliquée demande stabilisation hospitalière. Le plan inclut soins médicaux, aliments thérapeutiques et soutien de la famille [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>En stabilisation, les laits thérapeutiques comme <button class="w" data-k="e42-f75">F-75</button> permettent des apports adaptés à une physiologie fragile. Le volume, les prises, les apports liquides associés et la surveillance sont prescrits selon le protocole et l’état, particulièrement si l’œdème est important. Un volume unique de 130 ml/kg/j recopié d’une revue ne constitue pas une ordonnance pour tous les enfants œdémateux [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Après stabilisation, retour de l’appétit et réduction de l’œdème, la transition augmente les apports de façon tolérée. L’<button class="w" data-k="e42-oms">OMS</button> décrit en hospitalisation une transition vers l’<button class="w" data-k="e42-aliments">aliment thérapeutique prêt à l’emploi</button> sur deux à trois jours, avec 100–135 kcal/kg/j pendant cette transition. Ce stade n’est pas identique au traitement ambulatoire de rattrapage [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p>En ambulatoire chez les six à cinquante-neuf mois, l’<button class="w" data-k="e42-oms">OMS</button> 2023 propose deux options : 150–185 kcal/kg/j jusqu’à récupération anthropométrique et disparition de l’œdème ; ou la même quantité initiale, puis 100–130 kcal/kg/j lorsque l’enfant n’est plus sévèrement émacié et n’a plus d’œdème, jusqu’à récupération. Le choix de réduire dépend du programme, de la sécurité alimentaire et du suivi ; il ne s’agit pas d’une réduction obligatoire après guérison [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p>Poursuivre l’allaitement lorsque présent, assurer les besoins en eau et vérifier la préparation des produits. Une prise insuffisante, une intolérance, une infection ou une stagnation demande réévaluation. Aucun aliment spécialisé ne traite seul un trouble de déglutition, une malabsorption ou un sepsis [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<div class="key"><b>À retenir.</b> Stabilisation, transition et rattrapage ont des objectifs distincts. Augmenter ou réduire les apports selon un protocole complet et la réponse réelle [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-10">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-11"><h2><span class="n">11</span>Médicaments et liquides : ne pas mélanger les protocoles</h2><p>Les aliments thérapeutiques couvrent une partie importante des micronutriments. Vérifier leur composition avant d’ajouter systématiquement vitamines, zinc ou autres suppléments. L’<button class="w" data-k="e42-oms">OMS</button> ne recommande pas de forte dose supplémentaire de vitamine A si des aliments conformes en apportent déjà suffisamment ; une indication spécifique reste évaluée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>L’<button class="w" data-k="e42-amoxicilline">amoxicilline</button> orale de routine recommandée dans certains programmes sévères non compliqués est différente du traitement d’une infection identifiée ou d’un sepsis. Le manuel <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2024 donne 50 mg/kg par prise, deux fois par jour, maximum 1 g par prise, pendant cinq à sept jours. La FI suisse de la suspension axapharm donne chez l’enfant jusqu’à 40 kg une plage de 50–100 mg/kg/j en trois à quatre prises et ne cite pas <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> comme indication spécifique. Population, fréquence et contexte restent explicités, sans nouvelle posologie composite [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
<p>Pour la déshydratation sans choc, l’<button class="w" data-k="e42-oms">OMS</button> 2023 préfère <button class="w" data-k="e42-resomal">ReSoMal</button> sous surveillance en structure de santé ; une solution de réhydratation orale de faible osmolarité peut être utilisée si <button class="w" data-k="e42-resomal">ReSoMal</button> n’est pas disponible. Le choléra suspecté ou une diarrhée aqueuse profuse demandent la solution standard, non davantage diluée. Le choc et l’intolérance nécessitent une stratégie hospitalière adaptée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">S5</a>].</p>
<p>Les essais <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">GASTROSAM</a> 2025/2026 remettent en question certaines restrictions traditionnelles. Ils n’ont pas établi de différence de mortalité entre stratégies et n’ont pas observé de surcharge, mais les formes œdémateuses étaient peu nombreuses et la surveillance étroite. Ces données ne justifient ni une interdiction absolue de toute perfusion, ni une prescription automatique de gros volumes pour toute <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</p>
<p>La thiamine et les électrolytes sont évalués dans le risque de renutrition. Les doses adultes d’un consensus suisse et les doses de <button class="w" data-k="e42-thiamine">Benerva</button> dès douze ans ne sont pas des doses de nourrisson. La correction dépend du produit, de la voie, des reins, du bilan et du protocole ; une valeur sanguine normale peut coexister avec des réserves réduites [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> Choisir un protocole applicable et un produit exact. Ne pas assembler une dose, une fréquence et une population provenant de trois sources différentes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-11">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-12"><h2><span class="n">12</span>Suivi, transfert et prévention des rechutes</h2><p>Le transfert de l’hôpital vers l’ambulatoire repose sur l’amélioration clinique, l’appétit et la résolution suffisante des complications, avec œdème en diminution et plus de grade+++. L’<button class="w" data-k="e42-oms">OMS</button> demande notamment l’absence de signes de danger depuis 24–48 heures chez les six à cinquante-neuf mois. Un poids cible ou un périmètre donné ne remplace pas ces critères de transfert [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p><button class="w" data-k="e42-sortie">La fin du traitement nutritionnel</button> est une autre décision. Pour les six à cinquante-neuf mois, la recommandation <button class="w" data-k="e42-oms">OMS</button> 2023 exige poids pour la taille ou la longueur au moins à−2 écarts-types et périmètre brachial au moins 125 mm, observés sur au moins deux visites ou mesures consécutives, ainsi qu’absence d’œdème à deux visites ou mesures consécutives. Les problèmes médicaux et sociaux persistants doivent être orientés. Le pourcentage de gain pondéral n’est pas un critère de sortie [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p>Le manuel <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2024 présente une règle opérationnelle avec poids pour la taille supérieur à−2 ou bras supérieur à 125 mm, absence d’œdème et au moins deux semaines. Cette différence est conservée comme telle : les opérateurs suivent leur programme validé, et le cours ne fusionne pas « et », « ou », deux visites et deux semaines en une formule fictive [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>Le suivi évalue croissance, alimentation, maladies associées, développement, disponibilité des aliments et capacité d’accès aux soins. Une récupération de poids ne prouve pas à elle seule une récupération complète de la fonction immunitaire. La continuité et l’aide concrète à la famille réduisent les risques de rupture, sans promettre une prévention absolue des rechutes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Quitter l’hôpital ne signifie pas finir le traitement. Les critères de sortie gardent leur source et le suivi continue après la récupération [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-12">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-13"><h2><span class="n">13</span>Âges particuliers et pratique suisse</h2><p>Avant six mois, ne pas appliquer automatiquement les seuils et schémas des six à cinquante-neuf mois. Un œdème nutritionnel ou une perte de poids récente justifie l’admission selon l’<button class="w" data-k="e42-oms">OMS</button> 2023. L’évaluation concerne le nourrisson et la personne qui s’en occupe, l’efficacité de l’allaitement ou du remplacement et les besoins de soutien [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p>Chez un nourrisson hospitalisé avec œdème, les compléments décrits sont une formule infantile du commerce ou <button class="w" data-k="e42-f75">F-75</button> en complément du lait maternel. Le <button class="w" data-k="e42-f100">F-100</button> à pleine concentration n’est pas donné en présence d’instabilité, diarrhée, déshydratation ou œdème nutritionnel, notamment du fait de sa charge rénale et du risque de déshydratation hypernatrémique. Les volumes ne sont pas déduits du schéma de l’enfant plus âgé [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p>Après cinq ans, chez l’adolescent ou l’adulte, l’anthropométrie et le protocole nutritionnel doivent être adaptés. Le consensus suisse de renutrition de 2019 concerne des patients médicaux adultes et exclut les troubles alimentaires ; ses repères ne sont pas une prescription infantile ni un protocole universel d’anorexie mentale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Maladie rénale, hépatique, cardiaque, infection ou difficultés de déglutition modifient les besoins, les risques et le choix de voie. Pour un médicament, grossesse et allaitement se lisent dans la FI du produit réel : la nécessité de nutrition ne crée pas une autorisation générale de toutes les doses et molécules [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p>En Suisse, documenter les constatations, le plan et les responsabilités, organiser pédiatrie, diététique et aide sociale selon les besoins. Les références de classification 2024 et <button class="w" data-k="e42-profiles">PROFILES</button> 2017 gardent leur date ; le cours ne certifie ni remboursement individuel, ni disponibilité de tout aliment spécialisé, ni correspondance officielle avec une question fédérale [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> L’âge, la maladie associée et la formulation changent la décision. Un protocole utile dans une population n’est pas une recette pour toutes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-13">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-14"><h2><span class="n">14</span>Critères utiles et pièges de raisonnement</h2><table class="t" data-e42-table="1"><thead><tr><th>Question</th><th>Repère et population</th><th>Ce qu’il ne signifie pas</th></tr></thead><tbody><tr><td>Émaciation sévère, 6–59 mois</td><td>Poids/taille ou longueur &lt; −3 écarts-types, ou bras &lt;  115 mm.</td><td>Pas seuil de nourrisson de tout âge ni diagnostic de la cause.</td></tr><tr><td>Forme mixte</td><td>Fonte et œdème nutritionnel simultanés ou forme intermédiaire documentée.</td><td>Pas tout œdème au godet ni toute hypoalbuminémie.</td></tr><tr><td>Fin de traitement <button class="w" data-k="e42-oms">OMS</button> 2023</td><td>Poids/taille ≥ −2 et bras ≥ 125 mm sur deux mesures, sans œdème sur deux mesures.</td><td>Pas le même événement que transfert hospitalier ; pas pourcentage de gain pondéral.</td></tr><tr><td>Apport ambulatoire <button class="w" data-k="e42-oms">OMS</button></td><td>150–185 kcal/kg/j ; éventuelle réduction 100–130 selon option et état.</td><td>Pas réduction obligatoire seulement après guérison.</td></tr><tr><td>Mécanismes récents</td><td>Signatures matrice/sphingolipides associées à œdème dans une étude.</td><td>Pas causalité établie, biomarqueur <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> validé ou traitement ciblé.</td></tr></tbody></table>
<p>Les erreurs qui changent les soins sont de se fier à un poids rassurant gonflé d’eau, d’exclure une infection parce qu’il n’y a pas de fièvre, de diagnostiquer une cause nutritionnelle sur l’albumine, de confondre transfert et guérison, ou de reprendre une dose adulte pour un nourrisson. Chaque donnée doit garder sa méthode, son âge et sa source [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p>Les études récentes améliorent les connaissances mais ne rendent pas toutes les incertitudes caduques. Un essai sans événement de surcharge ne prouve pas un risque nul ; une association moléculaire ne prouve pas un mécanisme unique ; une cohorte de trois groupes de même taille ne mesure pas la prévalence. Expliquer ces limites fait partie d’un raisonnement précis [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</p>
<div class="key"><b>À retenir.</b> Connaître les seuils sert à décider ; connaître leurs limites évite de décider pour la mauvaise population [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-14">Essentiel de cette partie</button></section>
<div class="src"><h3>Sources effectivement consultées</h3><ul data-justification-sources="1"><li><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] CIM-10-GM : libellé local suisse E42</a> — 2024. Entrée <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> locale, titre, code unique et version ; pas PDF intégral relu. Limites : Source de métadonnées locale dérivée, pas relecture du PDF OFS intégral ni certification de codage 2026.</li><li><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">[S2] CIM-10-GM E40–E46 et définition E42</a> — 2024. Notes du bloc et <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E40</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E41</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E43</a> et exclusions. Limites : Poids de référence et notes générales non assimilés à une nouvelle définition <button class="w" data-k="e42-oms">OMS</button> ni à une prescription.</li><li><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">[S3] Prevention and management of wasting and nutritional oedema under 5</a> — 2023. Glossairevii–ix ; introductionp 6–8 ; A1–A7 ; B1–B10 ; p 70–72,83–84 ; recommandations maintenuesp 152–155. Limites : Recommandations et certitudes variées. Pas protocole adulte, pas nouvelle norme 2026. Texte paraphrasé seulement, pas figures <button class="w" data-k="e42-oms">OMS</button> sous licenceNC réutilisées.</li><li><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">[S4] Severe acute malnutrition : manuel clinique</a> — Février 2024. Chapitre 1 : diagnostic, complications, phases, traitement, transfert/sortie. Limites : Protocole opérationnel, pas FI suisse. Différence sortie : poids/taille &gt; −2 OU bras &gt;  125 sur 2 semaines, tandis <button class="w" data-k="e42-oms">OMS</button> 2023 demandeET/deuxvisites ; ne pas fusionner.</li><li><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">[S5] ReSoMal oral : préparation et précautions</a> — Novembre 2022. Indication, sachet, dilution, doses, contre-indications, conservation. Limites : Protocole externe non disponibilité/autorisation suisse établie. Doses diffèrent de schémas plus anciens et essais ; ne pas construire un débit composite.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">[S6] Acute Malnutrition in Children: Pathophysiology, Clinical Effects and Treatment</a> — 2020. Corps sections 1–5.3, tableaux 1–2, conclusion ; source réellement relue. Limites : Revue ancienne avec références parfois discordantes et hypothèse simplecarenceprotéique/œdème trop réductrice. Ne pas adopter chiffres globaux anciens, irréversibilité cerveau 3–4 ans ou schéma 45 mg/kg/j comme norme actuelle.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">[S7] Management of Refeeding Syndrome in Medical Inpatients</a> — 2019. Corps sections 1–10 essaires donc non copiés.</li><li><a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">[S15] Joint Child Malnutrition Estimates : key findings 2025</a> — 2025, données 2024. p 1–2 : chiffres, définition, portéeprévalence et limites. Limites : Pas incidenceannuelle, pas estimation des seulsœdèmes/formesmixtesE42, pas incidence suisse. Anciennesestimations remplacées.</li><li><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S16] PROFILES 2017</a> — 2017. EPAévaluationnutritionnellep 18 ; SSPœdème/pertepoids ; situationsenfance croissance/alimentation. Limites : Objectifspédagogiques, pas correspondanceofficielleE42 ouprévisionquestionfédérale.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">[S17] GASTROSAM oral: WHO-ORS versus ReSoMal</a> — Mars 2026. Résumé, méthodes, sélection, résultats/natrémie, discussion et limites. Limites : Essaisupériorité, pas preuved’équivalenceuniverselle ; forte surveillance, peuformesœdémateuses, pascholéra ; mélangefactorielliquidesIV dansstrateA.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">[S18] GASTROSAM : intravenous rehydration</a> — Juin 2025. Résumé, méthodes/sélection et discussion/limites ciblées. Limites : Faibleeffectifœdémateux, mortalitéinférieureprévue doncpuissancelimitée. Texteabstractcomportecertainschiffres/coquillesincohérents ; pasrepriscommecomparaisonnumériquefinale.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">[S19] Intravenous rehydration : systematic review and meta-analysis</a> — Septembre 2026. Résumé, méthodeséligibilité, résultats et discussion/limites ciblés. Limites : Unseulessaicritèresstricts, troisstratégieshétérogènes ; sousgroupekwashiorkor nonisolable, pasautorisationdelibérerprescriptionindividuelle.</li><li><a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2418_Histology_Small_IntestinesN.jpg" target="_blank" rel="noopener">[S20] Notice propre de planche intestinale 2418</a> — 19 juin 2013. MétadonnéesCommons auteur/source/licence, imageentière inspectée réellement. Limites : LicencepropreCCBY3.0 ; pasfigurecliniqueE42. Notice+créditMichigan lus, aucuneéditionpixels ; repèresFRsuperposésàannoncer.</li></ul><p>Audit différé — auto-relecture par intelligence artificielle, distincte d’une validation médicale humaine. Sources intégrales en cache externe ; texte public par paraphrases, références et limites.</p>
