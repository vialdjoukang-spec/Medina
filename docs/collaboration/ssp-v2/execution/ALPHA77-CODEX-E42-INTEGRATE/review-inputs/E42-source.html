<div class="key"><b>À retenir.</b> Éviter à la fois la carence non corrigée et le doublon. Concentration, voie et vitesse comptent autant que la quantité [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-p-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-p-6"><h2><span class="n">p-6</span>Organiser une prescription compréhensible et réévaluable</h2><p>Une prescription utile précise le produit, l’objectif, la quantité, la concentration, la voie, la fréquence et les conditions de réévaluation. Distinguer alimentation, réhydratation, traitement d’infection et supplémentation aide à repérer les doublons et les erreurs de volumes. Les prises réelles et la tolérance sont documentées [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p>La situation change pendant les soins : œdème qui diminue, appétit qui revient, diarrhée qui persiste, fonction rénale qui se modifie ou nouvelle infection. Les besoins et les risques sont réévalués, sans appliquer indéfiniment le schéma du premier jour. Une amélioration du poids seule ne permet pas d’arrêter tous les soins [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Lors du transfert, vérifier la capacité d’obtenir les aliments et médicaments, de les préparer, de comprendre les quantités et de revenir aux rendez-vous. Expliquer les signes de danger et les contacts à utiliser. La famille ne doit pas avoir à reconstruire un protocole en combinant des tableaux d’âges ou de sources différents [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> La sécurité dépend d’une décision précise, appliquée et réévaluée. Un tableau exact mais incompris ne suffit pas [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-p-6">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e42-aliments" data-title="Aliments thérapeutiques : phase et quantité"><table class="t" data-e42-table="1"><thead><tr><th>Produit et phase</th><th>Composition ou apport source</th><th>Population et limite</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a>, stabilisation</td><td>75 kcal et 0,9 g de protéines pour 100 ml.</td><td>Volume prescrit selon état et protocole ; pas 130 ml/kg/j universel en œdème sévère.</td></tr><tr><td><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-100</a>, réhabilitation</td><td>100 kcal et 2,9 g de protéines pour 100 ml.</td><td>Après stabilisation ; moins 6 mois avec œdème/instabilité, pas à pleine concentration.</td></tr><tr><td>Transition hospitalière vers aliment prêt à l’emploi</td><td>100–135 kcal/kg/j, transition de 2–3 jours selon tolérance.</td><td>Recommandation <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> maintenue, distincte du rattrapage ambulatoire.</td></tr><tr><td>Aliment thérapeutique prêt à l’emploi, 6–59 mois ambulatoires</td><td>150–185 kcal/kg/j jusqu’à récupération ; ou réduction 100–130 après disparition émaciation sévère/œdème, jusqu’à récupération.</td><td>Deux options, décision du programme et du suivi ; pas réduction obligatoire après guérison.</td></tr></tbody></table>
<p>Les deux options ambulatoires de l’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023 ne sont pas une réduction obligatoire après guérison. Choix du programme, tolérance, sécurité alimentaire et suivi comptent ; avant six mois, la stratégie est distincte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
</template>
<template data-pop="e42-f75" data-title="F-75 : stabilisation et population"><p><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a> contient 75 kcal et 0,9 g de protéines pour 100 ml. C’est un lait thérapeutique de stabilisation, pas une préparation maison à concentrer ni une prescription identique pour tout œdème. Volume, prises, eau et autres apports sont ajustés au protocole, à l’âge et à l’état. Chez le nourrisson de moins six mois avec œdème, l’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> décrit <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a> ou formule infantile comme complément au lait maternel, avec soutien de l’allaitement [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
</template>
<template data-pop="e42-f100" data-title="F-100 : réhabilitation et précaution avant six mois"><p><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-100</a> contient 100 kcal et 2,9 g de protéines pour 100 ml. Son rôle est différent de celui de <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a>. L’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> demande de ne pas utiliser <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-100</a> à pleine concentration chez le nourrisson de moins de six mois instable, déshydraté, diarrhéique ou avec œdème nutritionnel, notamment à cause de la charge rénale et du risque hypernatrémique. Ce produit n’est pas interchangeable avec un lait initial au même volume [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
</template>
<template data-pop="e42-resomal" data-title="Réhydratation : solution, voie et limites"><table class="t" data-e42-table="1"><thead><tr><th>Source / situation</th><th>Choix décrit</th><th>Ce qu’il faut éviter</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023,6–59 mois sévères déshydratés sans choc</td><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a> préféré ; solution orale de faible osmolarité si indisponible.</td><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a> à domicile ou débit sans surveillance.</td></tr><tr><td>Choléra suspecté ou diarrhée aqueuse profuse</td><td>Solution <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> standard de faible osmolarité, préparée normalement.</td><td>Dilution supplémentaire ou remplacement automatique par <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a>.</td></tr><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2022, sachet <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a></td><td>84 g dans 2 litres d’eau propre bouillie et refroidie ; utiliser solution dans 24 h.</td><td>Concentrer le sachet, injecter la solution, mélanger les quantités avec un autre produit.</td></tr><tr><td>Déshydratation grave / choc / intolérance</td><td>Évaluation et protocole hospitalier selon perfusion, pertes, voie tolérée et surveillance.</td><td>Interdire toute perfusion ou appliquer à tous un volume d’essai clinique.</td></tr></tbody></table>
<p><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a> sous surveillance en structure, pas par famille à domicile selon <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023. Le choix de solution, la vitesse, la perfusion et la surveillance forment une stratégie complète ; les volumes de différents protocoles ne sont pas additionnés [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e42-amoxicilline" data-title="Amoxicilline : formulation suisse et protocole"><table class="t" data-e42-table="1"><thead><tr><th>Référence / population</th><th>Dose et rythme</th><th>Limite</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> février 2024, 6–59 mois, routine nutritionnelle sans infection spécifique</td><td>50 mg/kg par prise, max 1 g, deux fois par jour pendant 5–7 jours, voie orale.</td><td>Protocole de programme, pas traitement de tout sepsis ni fréquence de FI suisse.</td></tr><tr><td>FI axapharm suspension octobre 2024, enfant ≤ 40 kg</td><td>50–100 mg/kg/j en 3–4 prises ; maximum 2000 mg/j et 50 mg/kg par prise.</td><td>Pas indication spécifique <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ; volume 50 mg/ml après préparation.</td></tr><tr><td>Nouveau-né / prématuré, FI</td><td>Parentéral en règle du fait absorption incertaine ; oral au plus tôt dès 8 jours.</td><td>Pas application automatique du schéma 6–59 mois au nouveau-né.</td></tr><tr><td>Rein, enfant ≤ 40 kg</td><td>FI demande une forme parentérale en insuffisance rénale.</td><td>Ne pas inventer un intervalle oral infantile à partir du tableau adulte.</td></tr><tr><td>Rein, adulte/enfant > 40 kg</td><td>Clairance 10–30 ml/min : maximum 500 mg toutes 12 h ; &lt;  10 : maximum 500 mg toutes 24 h.</td><td>Ces plafonds ne sont pas une nouvelle dose <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ni un tableau de nourrisson.</td></tr></tbody></table>
<p>Produit lu : suspension axapharm 200 mg/4 ml, FI octobre 2024, pas comprimé dispersible. <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2024 et FI ont des fréquences différentes ; ne pas créer une fausse posologie composite. Rechercher allergie, diarrhée grave, réaction cutanée, interactions et fonction rénale ; agiter, conserver dix jours maximum après préparation. Sepsis ou absorption insuffisante demandent un autre parcours hospitalier [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
</template>
<template data-pop="e42-thiamine" data-title="Thiamine : source et âge avant la dose"><table class="t" data-e42-table="1"><thead><tr><th>Population / indication</th><th>Repère réellement lu</th><th>Ce qui ne se transpose pas</th></tr></thead><tbody><tr><td>Consensus suisse 2019, adulte médical à risque de renutrition</td><td>Thiamine 200–300 mg au moins 30 min avant les apports planifiés ; suivi clinique et biologique.</td><td>Pas dose de nourrisson, pas raison de retarder correction d’une hypoglycémie urgente.</td></tr><tr><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a> FI avril 2019, adulte/adolescent dès 12 ans, prophylaxie</td><td>100 mg un jour sur deux par voie orale.</td><td>Pas protocole universel de prévention de renutrition pédiatrique.</td></tr><tr><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a>, carence modérée / grave orale</td><td>100 mg/j modérée ; 200–300 mg/j grave.</td><td>Ces schémas sont ceux de la FI, pas des prises à empiler.</td></tr><tr><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a>, grave carence parentérale</td><td>Jusqu’à 200 mg/j ; intramusculaire ou intraveineuse très lente, puis orale si possible.</td><td>300 mg oral ne signifie pas 300 mg intraveineux ; injection hospitalière avec surveillance.</td></tr><tr><td>Moins 12 ans</td><td>Utilisation/innocuité non systématiquement étudiées selon FI.</td><td>Ne pas fabriquer une dose infantile à partir des comprimés adultes.</td></tr></tbody></table>
<p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a> : FI avril 2019, comprimés 100/300 mg et ampoule 100 mg/ml ; doses décrites adultes/adolescents dès 12 ans, usage pédiatrique non étudié systématiquement. Intraveineux très lent à l’hôpital, risque anaphylactoïde, voie orale préférée si possible. Ne pas transformer 200–300 mg oral ou consensus adulte en dose intraveineuse de nourrisson [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e42-godet" data-title="Œdème au godet et cause"><p>Un œdème prenant le godet garde une dépression après pression puis relâchement. L’examen recherche les deux pieds, la symétrie et l’extension ; l’aspect seul ne prouve pas une cause nutritionnelle. Le syndrome néphrotique peut donner un œdème déclive au godet, et une protéinurie doit être recherchée selon le contexte. Une dénutrition peut aussi coexister avec une maladie d’organe [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
</template>
<template data-pop="e42-bras" data-title="Périmètre brachial : geste et seuil"><p>Chez l’enfant de six à cinquante-neuf mois, moins 115 mm indique une émaciation sévère selon l’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a>. Mesurer au milieu du bras gauche relâché, ruban au contact sans comprimer. Ce n’est ni une mesure directe de toute masse musculaire ni un seuil identique avant six mois ou chez l’adulte. Reporter la méthode et interpréter avec œdème, croissance et état hydrique [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
</template>
<template data-pop="e42-sortie" data-title="Transfert et fin de traitement : règles distinctes"><table class="t" data-e42-table="1"><thead><tr><th>Décision</th><th><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023,6–59 mois</th><th>Limite</th></tr></thead><tbody><tr><td>Transfert hospitalier vers ambulatoire</td><td>Amélioration, absence danger 24–48 h, problèmes aigus suffisamment résolus, appétit et œdème non+++en diminution, suivi organisé.</td><td>Pas décision fondée seulement sur un chiffre anthropométrique.</td></tr><tr><td>Fin du traitement nutritionnel</td><td>Poids/taille ou longueur ≥ −2 et bras ≥ 125 mm sur deux visites/mesures, absence d’œdème sur deux visites/mesures, orientations nécessaires faites.</td><td>Pas gain pondéral absolu ou pourcentage ; recommandation conditionnelle, certitude très faible.</td></tr><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2024, règle de programme</td><td>Poids/taille > −2 ou bras > 125, absence œdème sur au moins deux semaines, autres soins organisés.</td><td>Divergence conservée, pas transformation de « et » en « ou » ni de deux visites en deux semaines.</td></tr></tbody></table>
<p>Une récupération de poids ou la sortie de l’hôpital ne prouve pas la fin de tous les besoins de suivi [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
</template>
<template data-pop="e42-renutrition" data-title="Renutrition : mécanisme, population et prudence"><p>Le retour des glucides modifie les besoins et les mouvements de phosphate, potassium et magnésium, avec risque de déficit de thiamine et de rétention hydrosodée. Le consensus suisse 2019 concerne des adultes médicaux et exclut les troubles alimentaires ; ses 5–15 kcal/kg/j initiaux et 200–300 mg de thiamine avant ne sont pas des doses infantiles. Défaillance clinique et anomalies biologiques demandent réévaluation, sans retarder la correction urgente d’une hypoglycémie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e42-profiles" data-title="Formation suisse et situations cliniques"><p><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> 2017 demande évaluation nutritionnelle, poids, œdème, croissance et alimentation dans l’enfance. Les compétences se travaillent par histoire, mesures, examen et décisions argumentées. Ce lien pédagogique ne constitue ni une correspondance officielle <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">CIM</a>–<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> ni une question fédérale garantie. Les chiffres de bannière hérités de la coque ne sont pas certifiés par cette leçon [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
</template>
<template data-pop="e42-oms" data-title="OMS : cadre et population"><p>Organisation mondiale de la Santé. La directive 2023 porte sur l’émaciation et l’œdème nutritionnel chez les moins de cinq ans, avec recommandations spécifiques pour moins de six mois et six à cinquante-neuf mois. Les critères, les certitudes et les décisions de transfert/fin de traitement gardent leur contexte ; aucune dose adulte ou stratégie universelle de renutrition ne s’en déduit [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
</template>
<template data-pop="e42-semio" data-title="Sémiologie : signes, mesures et décision"><p>Relier fonte, œdème et état général, sans attribuer à tout godet une cause nutritionnelle. Rechercher danger, mesurer croissance et bras, puis explorer une autre cause si indiquée. Le premier onglet scientifique présente neuf sections reliant normal, mécanismes, signes, examen, interprétation, différentiels, urgence, limites et sources réellement lues [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
</template>

<template data-pop="pareto-e42-1" data-title="Essentiel — Un œdème qui masque la fonte"><p>L’œdème peut rendre la dénutrition moins visible. Chercher d’abord la gravité, puis mesurer et expliquer les deux composantes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e42-1"></p>
</template>
<template data-pop="pareto-e42-2" data-title="Essentiel — Définition, périmètre et classification"><p><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> désigne un tableau mixte documenté. Ni un œdème isolé, ni une albumine basse, ni le seul code ne suffisent à raconter la situation [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e42-2"></p>
</template>
<template data-pop="pareto-e42-3" data-title="Essentiel — Épidémiologie : le bon indicateur et le bon dénominateur"><p>Une prévalence d’émaciation n’est ni une incidence annuelle, ni une mesure des seules formes mixtes. Toujours préciser population et recrutement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">S15</a>].</p>
<p class="ratio" data-cover="e42-3"></p>
</template>
<template data-pop="pareto-e42-4" data-title="Essentiel — Du fonctionnement normal aux pertes de réserve"><p>Comprendre la réserve, la fonction et les échanges d’eau explique pourquoi le poids et l’albumine ne suffisent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e42-4"></p>
</template>
<template data-pop="pareto-e42-5" data-title="Essentiel — Causes, formes et facteurs qui s’entretiennent"><p>Chercher comment apports, maladie et environnement se combinent. Le phénotype ne remplace ni l’enquête causale ni l’écoute de la famille [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p class="ratio" data-cover="e42-5"></p>
</template>
<template data-pop="pareto-e42-6" data-title="Essentiel — Anamnèse : reconstruire l’évolution sans culpabiliser"><p>Une chronologie précise et des gestes observés révèlent les mécanismes. Les difficultés matérielles et relationnelles font partie du soin [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p class="ratio" data-cover="e42-6"></p>
</template>
<template data-pop="pareto-e42-7" data-title="Essentiel — Examen clinique : voir, mesurer et interpréter"><p>Le godet, les mesures et les signes de perfusion répondent à des questions différentes. Leur interprétation reste clinique et répétée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e42-7"></p>
</template>
<template data-pop="pareto-e42-8" data-title="Essentiel — Urgences et complications : ne pas attendre la renutrition"><p>Traiter immédiatement les menaces vitales et rechercher leur cause. La nutrition est indispensable, mais ne remplace pas la réanimation d’une complication [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e42-8"></p>
</template>
<template data-pop="pareto-e42-9" data-title="Essentiel — Diagnostic : confirmer les composantes et rechercher une autre cause"><p>Établir les deux composantes, puis leur cause. Une albumine basse ne départage pas à elle seule nutrition, perte rénale, perte digestive et inflammation [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p class="ratio" data-cover="e42-9"></p>
</template>
<template data-pop="pareto-e42-10" data-title="Essentiel — Traitement nutritionnel : une progression guidée par l’état"><p>Stabilisation, transition et rattrapage ont des objectifs distincts. Augmenter ou réduire les apports selon un protocole complet et la réponse réelle [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e42-10"></p>
</template>
<template data-pop="pareto-e42-11" data-title="Essentiel — Médicaments et liquides : ne pas mélanger les protocoles"><p>Choisir un protocole applicable et un produit exact. Ne pas assembler une dose, une fréquence et une population provenant de trois sources différentes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e42-11"></p>
</template>
<template data-pop="pareto-e42-12" data-title="Essentiel — Suivi, transfert et prévention des rechutes"><p>Quitter l’hôpital ne signifie pas finir le traitement. Les critères de sortie gardent leur source et le suivi continue après la récupération [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e42-12"></p>
</template>
<template data-pop="pareto-e42-13" data-title="Essentiel — Âges particuliers et pratique suisse"><p>L’âge, la maladie associée et la formulation changent la décision. Un protocole utile dans une population n’est pas une recette pour toutes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e42-13"></p>
</template>
<template data-pop="pareto-e42-14" data-title="Essentiel — Critères utiles et pièges de raisonnement"><p>Connaître les seuils sert à décider ; connaître leurs limites évite de décider pour la mauvaise population [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e42-14"></p>
</template>
<template data-pop="pareto-e42-e-1" data-title="Essentiel — Mesurer la croissance et les deux composantes"><p>Mesurer permet de suivre ; interpréter exige de savoir ce qui a changé dans l’eau et les tissus [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p class="ratio" data-cover="e42-e-1"></p>
</template>
<template data-pop="pareto-e42-e-2" data-title="Essentiel — Biologie : complications et diagnostics différentiels"><p>La biologie recherche surtout complications et causes associées ; aucune albumine seuil ne remplace la description clinique de la forme mixte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p class="ratio" data-cover="e42-e-2"></p>
</template>
<template data-pop="pareto-e42-e-3" data-title="Essentiel — Explorations ciblées et limites des marqueurs récents"><p>Un examen devient utile s’il répond à une question et peut modifier les soins. Un marqueur de recherche n’est pas automatiquement un test disponible ou validé [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p class="ratio" data-cover="e42-e-3"></p>
</template>
<template data-pop="pareto-e42-e-4" data-title="Essentiel — Quatre exercices pour relier signes et décisions"><p>Une bonne réponse explique ce que les signes permettent de conclure, et ce qu’ils ne prouvent pas [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e42-e-4"></p>
</template>
<template data-pop="pareto-e42-s-anat-cours" data-title="Essentiel — Anatomie : trajet des nutriments et échanges de liquide"><p>Du relief intestinal aux compartiments corporels, la structure explique les signes et les limites du poids. La planche représente le normal [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e42-s-anat-cours"></p>
</template>
<template data-pop="pareto-e42-s-histo-cours" data-title="Essentiel — Histologie : surface d’absorption et barrière"><p>La surface et la barrière rendent l’absorption possible. Un mécanisme plausible ne transforme pas une image normale en preuve de lésion individuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e42-s-histo-cours"></p>
</template>
<template data-pop="pareto-e42-s-physio-cours" data-title="Essentiel — Physiologie : adaptation, perfusion et renutrition"><p>L’adaptation au déficit a ses limites ; le retour des apports exige lui aussi une surveillance physiologique [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e42-s-physio-cours"></p>
</template>
<template data-pop="pareto-e42-s-bioch-cours" data-title="Essentiel — Biochimie : substrats, cofacteurs et réserves invisibles"><p>Le bilan est une fenêtre sur un système dynamique. Il ne mesure pas à lui seul les réserves et ne remplace pas les critères cliniques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e42-s-bioch-cours"></p>
</template>
<template data-pop="pareto-e42-s-gene-cours" data-title="Essentiel — Génétique et immunologie : terrain et réponse de l’hôte"><p>Le terrain influence la réponse, sans fournir un test génétique universel <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a>. Distinguer normal, observations humaines et modèles expérimentaux [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<p class="ratio" data-cover="e42-s-gene-cours"></p>
</template>
<template data-pop="pareto-e42-p-1" data-title="Essentiel — Aliments thérapeutiques : dose, phase et composition"><p>Vérifier la phase et la préparation avant le calcul. Un apport théorique ne garantit ni ingestion, ni absorption, ni sécurité [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p class="ratio" data-cover="e42-p-1"></p>
</template>
<template data-pop="pareto-e42-p-2" data-title="Essentiel — Réhydratation : voie, sodium et surveillance"><p>Réhydrater exige de choisir une stratégie complète et de suivre la réponse. Le débat récent ne supprime ni le besoin de liquide ni la surveillance [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619504/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7617792/" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7619270/" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e42-p-2"></p>
</template>
<template data-pop="pareto-e42-p-3" data-title="Essentiel — Amoxicilline : produit, indication et rythme"><p>Nom, concentration et population sont aussi importants que mg/kg. La routine nutritionnelle ne remplace pas l’évaluation d’une infection grave [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e42-p-3"></p>
</template>
<template data-pop="pareto-e42-p-4" data-title="Essentiel — Thiamine : prévenir sans extrapoler"><p>La thiamine doit être pensée avec la renutrition, mais une dose adulte ou une voie n’est pas interchangeable avec une dose infantile [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e42-p-4"></p>
</template>
<template data-pop="pareto-e42-p-5" data-title="Essentiel — Électrolytes, vitamines et risque de doublon"><p>Éviter à la fois la carence non corrigée et le doublon. Concentration, voie et vitesse comptent autant que la quantité [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e42-p-5"></p>
</template>
<template data-pop="pareto-e42-p-6" data-title="Essentiel — Organiser une prescription compréhensible et réévaluable"><p>La sécurité dépend d’une décision précise, appliquée et réévaluée. Un tableau exact mais incompris ne suffit pas [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
<p class="ratio" data-cover="e42-p-6"></p>
</template>
