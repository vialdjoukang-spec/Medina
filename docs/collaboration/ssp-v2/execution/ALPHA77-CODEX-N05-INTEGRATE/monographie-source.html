<section class="ilot" data-semiology="urgency" id="n05-semio-urgency"><h3>Identifier le passage de la surveillance aux soins urgents</h3><p>Une dyspnée avec suspicion de surcharge ou de maladie pulmonaire–rénale, une oligurie nouvelle, une hypertension avec retentissement ou une dégradation rapide de fonction imposent une évaluation urgente. La recherche de chronicité ne doit pas retarder la sécurisation d’une fonction menacée. Une anémie ou un trouble électrolytique se juge selon sévérité, symptômes et évolution.</p><p>Lors d’une atteinte aiguë ou en maladie rénale avancée, une incapacité à contrôler volume ou pression, des anomalies métaboliques réfractaires ou des signes urémiques peuvent conduire à une suppléance. La décision combine clinique, biologie et préférences ; elle ne vient pas d’un seuil de créatinine ni du seul nom N05. Préparer un accès ou discuter une greffe n’équivaut pas à débuter immédiatement une dialyse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a>.</p></section>
<section class="ilot" data-semiology="limits" id="n05-semio-limits"><h3>Adapter la conclusion à la population et à la méthode</h3><p>Les recommandations générales de maladie rénale chronique concernent surtout l’adulte et ne remplacent pas les protocoles propres à chaque glomérulopathie. L’enfant a des références de pression et de nutrition différentes ; la fragilité peut modifier les objectifs chez l’adulte âgé. Une FI suisse peut être plus restrictive qu’une recommandation de classe internationale.</p><p>Les prélèvements et équations ont des limites ; la biopsie échantillonne le rein et la génétique n’est pas infaillible. Une source illustrant un champ de sclérose ne fournit ni une proportion globale de lésions ni un diagnostic causal complet. Les incertitudes doivent rester visibles dans le compte rendu et le plan de suivi.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisseForxiga,août 2026 — Indication MRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></section>
<section class="ilot" data-semiology="sources" id="n05-semio-sources"><h3>Relier les signes et décisions aux passages effectivement lus</h3><p>Les profils glomérulaires et leurs alternatives viennent du CUEN 2025, tableau des syndromes et sections histologiques. L’orientation suisse s’appuie sur HUG 2024 pour l’hématurie et sur le Pocketguide SGN 17.03.2025 pour la maladie rénale chronique, le suivi et la consultation spécialisée. Les différences de cible tensionnelle sont attribuées.</p><p>KDIGO 2024 précise chronicité, catégories de risque, variations à évaluer et sécurité médicamenteuse ; son utilisation en Suisse est motivée par le guide SGN qui le cite. Les principes glomérulaires 2021 sont utilisés pour le bilan et le tissu, avec les recommandations ultérieures spécifiques lorsqu’elles s’appliquent. Les six FI exactes restent la source des doses. Le CUEN 2025 complète la démarche devant une IRA ; les critères KDIGO 2012 sont attribués, tandis que la pageofficielle présente encore AKI/AKD 2026 comme projet. Le ledger décrit les sections lues et leurs limites ; il ne revendique pas une lecture intégrale de tous les documents.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://kdigo.org/guidelines/acute-kidney-injury/" rel="noopener" target="_blank">KDIGO, page officielle consultée 2novembre 2026 — Guideline Update et Guideline Suite</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a>.</p></section>
<section class="ilot" id="n05-bridge-semio"><h3>De la sémiologie à la décision</h3><p><b>Science → clinique.</b> Le profil associe des signes de filtre, de fonction et de retentissement qui peuvent évoluer à des rythmes différents.</p><p><b>Science → examen.</b> Confirmer les mesures, établir leur durée et rechercher les discordances avant une conclusion causale.</p><p><b>Science → traitement.</b> L’urgence, l’activité et le risque déterminent les soins ; une simple persistance ne prescrit pas un corticoïde.</p><div class="key"><b>À retenir.</b> Décrire le signe, expliquer son mécanisme, puis choisir une décision proportionnée.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a>.</p></section>
</div><div aria-labelledby="n05-tab-anat" class="sci" hidden="" id="n05-s-anat" role="tabpanel"><section class="ilot" id="n05-s-anat-content"><h2>Anatomie : localiser le signe avant d’identifier la maladie</h2><p>Le rein normal associe cortex, médulla et système collecteur. Les corpuscules glomérulaires du cortex filtrent le sang ; les tubules modifient ensuite le filtrat, puis l’urine rejoint les cavités et l’uretère. Cette organisation explique qu’un même résultat final — du sang ou des protéines dans l’urine — puisse nécessiter des examens de compartiments différents.</p><p>Le glomérule est un peloton capillaire dans une capsule qui reçoit le filtrat. Le filtre repose sur l’endothélium, la membrane basale et les podocytes. Le mésangium constitue un support et participe à l’organisation du peloton. Une anomalie microscopique peut rester invisible à l’échographie ; une échographie normale n’écarte donc pas une glomérulopathie.</p><figure data-n05-figure="kidney"><div data-n05-frame="tall"><img alt="Planche anatomique humaine historique du rein normal" loading="lazy" src="assets/img/n05/alpha/codex/Kidney_section_vertical.png"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span><span aria-hidden="true" data-n05-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cortex : parenchyme périphérique, distinct de la voie urinaire.</li><li>Pyramide médullaire : repère anatomique normal.</li><li>Bassinet : voie collectrice, distincte du filtre glomérulaire.</li><li>Uretère : continuité de la voie excrétrice.</li></ol><p>Planche normale historique ; elle situe le parenchyme et les voies excrétrices sans montrer une cause de saignement. Aucune lésion fictive n’est ajoutée.</p><p data-n05-credit="">Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 · <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" rel="noopener" target="_blank">Domaine public</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les voies excrétrices conduisent l’urine déjà formée. Une cause urologique peut coexister avec une maladie glomérulaire ; le risque tumoral et les symptômes restent pris en compte. Le sédiment aide à localiser une origine glomérulaire, mais ne visualise ni une paroi vésicale ni la totalité de l’arbre urinaire. Les examens sont choisis selon la question, sans demander à l’un de remplacer tous les autres.</p><p><b>Science → clinique.</b> La localisation oriente l’interprétation de la protéinurie, des hématies et des signes associés. Un profil néphritique fait discuter le parenchyme ; le libellé N05 ne dispense pas de vérifier un obstacle ou une autre cause associée.</p><p><b>Science → examen.</b> L’imagerie situe taille et structure ; la biopsie et ses techniques voient l’organisation microscopique. Les indices de chronicité n’annulent pas la recherche d’un obstacle ou d’une atteinte aiguë.</p><p><b>Science → traitement.</b> La protection hémodynamique du néphron ne lève pas une obstruction et ne traite pas une infection causale. La localisation anatomique vérifie que l’intervention répond au bon mécanisme.</p><div class="key"><b>À retenir.</b> Associer compartiment, fonction et cause ; une seule image ne répond pas à toutes les questions.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></section>
</div><div aria-labelledby="n05-tab-histo" class="sci" hidden="" id="n05-s-histo" role="tabpanel"><section class="ilot" id="n05-s-histo-content"><h2>Histologie : un croissant ne donne pas toute la cause</h2><p>Le glomérule normal associe endothélium fenestré, membrane basale et podocytes, avec un mésangium de soutien. Les cellules pariétales tapissent la capsule. La morphologie précise le compartiment et la distribution des lésions, mais doit être confrontée à la trajectoire clinique et aux techniques complémentaires.</p><p>La prolifération extracapillaire produit un croissant dans l’espace de Bowman. Elle peut accompagner plusieurs maladies ; la source de cette image rapporte une maladie anti-membrane basale établie par immunofluorescence linéaireIgG. Cette propriété diagnostique vient du dossier de provenance, pas d’un dépôt directement visible sur le PAS. Le repère ne transforme donc pas l’image en test autonome de maladie anti-MBG.</p><figure data-n05-figure="crescent"><div data-n05-frame="wide"><img alt="Microphotographie humaine PAS d’une glomérulonéphrite extracapillaire, avec maladie anti-membrane basale documentée par la source" loading="lazy" src="assets/img/n05/alpha/codex/Crescentic_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Premier glomérule lésé dans la moitié gauche.</li><li>Autre glomérule lésé ; l’évaluation d’activité et de fibrose nécessite toute la biopsie.</li><li>Lumière tubulaire : repère de séparation entre compartiments.</li></ol><p>La source rapporte des dépôts linéaires d’IgG en immunofluorescence ; ce signal n’est pas visible sur cette coloration PAS. Les repères localisent les structures sans prétendre typer chaque cellule ni quantifier les croissants.</p><p data-n05-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Crescentic_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La microscopie optique décrit prolifération, nécrose, dépôts visibles, sclérose et atteinte interstitielle ou vasculaire. L’immunofluorescence précise la nature et la répartition des dépôts ; la microscopie électronique explore l’ultrastructure. Activité et dommages anciens peuvent coexister. La biopsie échantillonne le rein ; un seul champ ne donne pas la proportion globale de glomérules atteints ni la vitesse de perte de fonction.</p><p><b>Science → clinique.</b> Une dégradation rapide avec hématurie et protéinurie fait suspecter une maladie glomérulaire active et justifie une démarche urgente. Un croissant sur tissu et un syndrome rapidement progressif sont deux informations liées, mais distinctes.</p><p><b>Science → examen.</b> Confronter optique, immunofluorescence, éventuelle électronique, immunologie et clinique. Le prélèvement doit répondre à une question diagnostique ou thérapeutique, avec appréciation du risque par le néphrologue.</p><p><b>Science → traitement.</b> Le mécanisme, l’activité, la chronicité et les risques déterminent les soins. La photographie ne prescrit pas une immunosuppression universelle, et une cicatrice ne se confond pas avec une inflammation réversible.</p><div class="key"><b>À retenir.</b> Relier lésion, mécanisme et patient ; ne pas déduire une cause d’une seule coloration.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></section>
</div><div aria-labelledby="n05-tab-physio" class="sci" hidden="" id="n05-s-physio" role="tabpanel"><section class="ilot" id="n05-s-physio-content"><h2>Physiologie : filtration, transport et adaptation</h2><p>Le néphron filtre puis modifie le filtrat par réabsorption et sécrétion. Le volume urinaire ne mesure pas à lui seul la filtration, et la créatinine ne décrit pas toutes les fonctions du rein. La présence de protéines ou d’hématies peut signaler une atteinte avant une baisse importante du débit global. Il faut donc suivre à la fois fonction et marqueurs de dommage.</p><p>La filtration dépend de la pression utile et du coefficient d’ultrafiltration. Hypoperfusion, augmentation de pression en amont d’un obstacle ou diminution de surface filtrante peuvent la réduire. Des réponses hémodynamiques participent aussi à la progression de certaines maladies. Le blocage rénine–angiotensine et les inhibiteurs SGLT2 peuvent modifier cette hémodynamique ; une variation initiale de débit n’est pas nécessairement une destruction supplémentaire de néphrons. L’interprétation demande amplitude, délai, état volémique et signes associés.</p><figure data-n05-figure="nephron"><div data-n05-frame="tall"><img alt="Illustration humaine historique des échanges tubulaires du néphron normal" loading="lazy" src="assets/img/n05/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Tubule proximal : réabsorption et sécrétion modifient le filtrat.</li><li>Branche ascendante : repère de la réabsorption de sodium, potassium et chlorure.</li><li>Canal collecteur : ajustement final de l’eau et des solutés.</li></ol><p>Schéma simplifié normal ; les flèches sont celles de l’original. Il ne mesure pas les flux d’un patient et ne représente pas une glomérulonéphrite.</p><p data-n05-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les traitements tubulaires et diurétiques modifient eau et solutés. Une diminution de congestion peut améliorer les symptômes, mais une déplétion excessive expose à une aggravation fonctionnelle. Le potassium peut baisser sous diurétique ou augmenter dans la maladie rénale et sous bloqueur du système rénine–angiotensine. Il ne faut donc pas déduire un supplément de potassium d’un seul nom de classe.</p><p><b>Science → clinique.</b> Poids, œdèmes, pression, diurèse et symptômes doivent être confrontés. Une hausse de créatinine après changement thérapeutique ne se classe pas sans l’état d’hydratation et le calendrier.</p><p><b>Science → examen.</b> Comparer les valeurs de départ et de contrôle. Les repères de variation de débit et de créatinine ne sont pas exactement la même opération ; les calculs sont expliqués dans les fenêtres de cette leçon.</p><p><b>Science → traitement.</b> Le bénéfice rénal s’accompagne d’un suivi de sécurité : pression, fonction et électrolytes. Le contrôle rapproché après titration n’est pas remplacé par le bilan annuel d’une maladie stable.</p><div class="key"><b>À retenir.</b> Une bonne réponse physiologique se juge avec la tolérance et la trajectoire, pas avec un chiffre isolé.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisseForxiga,août 2026 — Indication MRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a>.</p></section>
</div><div aria-labelledby="n05-tab-bio" class="sci" hidden="" id="n05-s-bio" role="tabpanel"><section class="ilot" id="n05-s-bio-content"><h2>Biochimie : choisir le marqueur et garder l’unité</h2><p>L’albumine est une protéine particulière ; le dosage des protéines totales additionne plusieurs constituants. Leur rapport à la créatinine urinaire réduit l’effet de dilution, sans supprimer la variabilité du prélèvement. Un seuil exprimé en albumine/créatinine ne doit pas être alimenté par une valeur de protéines totales. Le résultat doit porter son analyte et son unité.</p><p>La bandelette réagit à l’hème et peut donc être positive avec hémoglobine ou myoglobine libres. La numération et la morphologie recherchent une autre information, celle des cellules. Cette distinction explique pourquoi une bandelette positive ne suffit pas à nommer une hématurie glomérulaire ni à décider d’une biopsie.</p><figure data-n05-figure="podocytes"><div data-n05-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n05/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n05-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>La créatinine est un marqueur indirect de filtration ; sa concentration dépend aussi de facteurs non rénaux. La cystatine C apporte une information complémentaire, mais le choix d’un marqueur ou d’une combinaison doit suivre la population et le besoin de précision. En phase instable, une équation ne transforme pas une concentration en mesure instantanée certaine de filtration.</p><p><b>Science → clinique.</b> Les protéines, la fonction et le sédiment décrivent des dimensions différentes. Une amélioration de l’albuminurie et une fonction stable sont utiles, sans démontrer l’absence de tout mécanisme de maladie.</p><p><b>Science → examen.</b> Les rapports se calculent avec deux concentrations du même prélèvement. Les unités du litre s’annulent, mais mg et g ne s’effacent pas arbitrairement. La variation relative se calcule par rapport à la valeur initiale et doit préciser si l’on mesure une hausse ou une baisse.</p><p><b>Science → traitement.</b> Une dose dépend du produit et de la mesure de fonction demandée par sa FI. Clairance en mL/min et débit indexé en mL/min/1,73 m² ne sont pas toujours interchangeables, surtout aux extrêmes corporels.</p><div class="key"><b>À retenir.</b> Nommer analyte, unité, méthode et délai avant d’utiliser un seuil.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a>.</p><p><button class="w" data-k="n05-calcul-ratio">Calculer un rapport urinaire</button></p></section>
</div><div aria-labelledby="n05-tab-immuno" class="sci" hidden="" id="n05-s-immuno" role="tabpanel"><section class="ilot" id="n05-s-immuno-content"><h2>Immunologie et physiopathologie : le pattern ne suffit pas</h2><p>Une atteinte glomérulaire peut résulter de mécanismes immunitaires, infectieux, génétiques ou de conséquences secondaires de lésions antérieures. Dépôts immunitaires, prolifération et cicatrices ne se confondent pas. L’immunofluorescence et la clinique précisent la nature du processus ; une coloration PAS ne montre pas directement la présence d’IgA ou de complément.</p><p>Le pattern membranoprolifératif peut accompagner des dépôts d’immunoglobulines polyclonales ou monoclonales, une activation du complément ou d’autres mécanismes. KDIGO insiste sur la recherche de cause : infection, maladie auto-immune, composant monoclonal ou dysrégulation du complément selon les résultats. Une hypocomplémentémie est possible mais non obligatoire.</p><figure data-n05-figure="crescent"><div data-n05-frame="wide"><img alt="Microphotographie humaine PAS d’une glomérulonéphrite extracapillaire, avec maladie anti-membrane basale documentée par la source" loading="lazy" src="assets/img/n05/alpha/codex/Crescentic_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Premier glomérule lésé dans la moitié gauche.</li><li>Autre glomérule lésé ; l’évaluation d’activité et de fibrose nécessite toute la biopsie.</li><li>Lumière tubulaire : repère de séparation entre compartiments.</li></ol><p>La source rapporte des dépôts linéaires d’IgG en immunofluorescence ; ce signal n’est pas visible sur cette coloration PAS. Les repères localisent les structures sans prétendre typer chaque cellule ni quantifier les croissants.</p><p data-n05-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Crescentic_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Dans une maladie du collagène IV, une sclérose secondaire ne prouve pas une maladie immune primitive. Dans l’IgA, le diagnostic reste biopsique et les critères de risque propres à la maladie orientent la discussion thérapeutique. Un syndrome sans précision ne doit pas effacer ces différences mécanistiques. Une activité traitable peut coexister avec une fibrose déjà constituée.</p><p><b>Science → clinique.</b> La persistance des protéines n’est pas synonyme d’inflammation, et une histoire ancienne n’exclut pas une poussée. Des signes généraux ou une infection changent l’interprétation d’un résultat immunologique.</p><p><b>Science → examen.</b> Le bilan est orienté par le phénotype et le tissu ; il ne se réduit pas à un panel systématique dont chaque positivité serait une preuve. Le résultat génétique doit aussi être confronté à la présentation.</p><p><b>Science → traitement.</b> Le traitement étiologique suppose une maladie démontrée, un bénéfice attendu et une évaluation des risques. La néphroprotection agit sur des voies communes, mais ne remplace pas un traitement de cause lorsqu’il est utile. Les limites suisses sous immunosuppresseur restent applicables aux associations médicamenteuses.</p><div class="key"><b>À retenir.</b> Relier cause, activité et dommages avant de choisir une immunomodulation.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">KDIGO, consensus international 2025 — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisseForxiga,août 2026 — Indication MRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></section>
</div></div></div>

<div class="panel" hidden="" id="pP"><div class="chap-body"><section class="ilot" id="n05-p-principes"><h2>Prescrire pour un objectif, puis vérifier la tolérance</h2><p>Les six FI de produits et formes ci-dessous illustrent la néphroprotection, le contrôle tensionnel et la gestion d’œdèmes dans leurs cadres précis. Aucun n’est un traitement universel du syndrome N05. Les schémas de néphroprotection se discutent après clarification de la cause et stabilisation ; ils ne sont pas une prescription initiale automatique devant une fonction instable. Les médicaments étiologiques d’une glomérulopathie se choisissent avec le néphrologue après diagnostic, appréciation de l’activité et évaluation des risques. Une cicatrice ou un nom de pattern ne suffit pas à justifier une immunosuppression.</p><p>Les informations professionnelles suisses des produits exacts fixent voies, doses, adaptations et contre-indications. La recommandation suisse de classe ne donne pas une autorisation identique à chaque produit. L’indication rénale du ramipril retenu concerne une protéinurie supérieure à 3 g/j ; celle du losartan concerne la néphropathie diabétique hypertendue. Leur emploi dans d’autres maladies glomérulaires peut donc être hors indication rénale spécifique, même lorsque leur utilisation antihypertensive est indiquée.</p><p>Avant de prescrire, documenter pression, état volémique, créatinine/mesure de fonction appropriée, potassium, autres médicaments et projet de grossesse. Après introduction ou titration d’un IEC/ARA, contrôler pression, créatinine et potassium dans les deux à quatre semaines selon KDIGO, plus tôt si la situation le requiert. Les contrôles à long terme ne remplacent pas ce suivi initial.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications,posologie,organes,contre-indications,interactions,grossesse</a>.</p></section>
<section class="ilot" id="n05-p-ramipril"><h2>Ramipril Zentiva — dose et indication ne se transposent pas</h2><p><b>FI décembre 2021 ; comprimés par voie orale.</b> Pour la néphropathie glomérulaire avec protéinurie supérieure à 3 g/j, début à 1,25 mg une fois par jour, puis augmentation selon tolérance, en doublant dans un intervalle de deux à trois semaines. Le maximum de cette indication est <b>5 mg/j</b>. La durée du traitement prolongé est décidée individuellement. La FI de l’hypertension donne un début habituel à 2,5 mg/j et un maximum de 10 mg/j : ce second plafond ne devient pas celui de toute maladie rénale.</p><p>Pour une clairance entre 20 et 50 mL/min/1,73 m², le début est 1,25 mg/j et le maximum 5 mg/j. L’expérience insuffisante en dessous de 20 et chez le dialysé figure dans la rubrique contre-indications de cette FI. En atteinte hépatique, début sous surveillance stricte et maximum 2,5 mg/j. Corriger une déplétion hydrosodée et revoir les diurétiques selon le contexte ; une pause de diurétique n’est jamais décidée sans apprécier la congestion.</p><p>Vérifier antécédent d’angio-œdème, sténose artérielle rénale sévère bilatérale ou sur rein unique et instabilité hémodynamique. Ne pas associer au sacubitril/valsartan : intervalle d’au moins 36 heures dans les deux sens. Éviter le double blocage rénine–angiotensine et vérifier les contre-indications particulières de l’aliskirène. Potassium, diurétiques épargneurs, AINS et lithium peuvent modifier le risque ; surveiller pression, potassium et fonction.</p><p>Ne pas utiliser pendant la grossesse ; anticiper un projet avant de poursuivre une néphroprotection. L’allaitement n’est pas recommandé avec le produit consulté. La FI ne recommande pas l’usage avant 18 ans ; une stratégie pédiatrique spécialisée hors indication ne se déduit pas du schéma adulte. Les bénéfices d’une classe thérapeutique ne permettent pas d’ignorer les restrictions du produit.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a>.</p></section>
<section class="ilot" id="n05-p-cosaar"><h2>Cosaar — une indication rénale suisse spécifique</h2><p><b>Losartan, FI avril 2025 ; voie orale.</b> L’indication rénale concerne les adultes diabétiques de type 2 hypertendus ayant une créatininémie élevée et un rapport albumine/créatinine d’au moins 300 mg/g. Début habituel à 50 mg une fois par jour ; la dose peut atteindre 100 mg une fois par jour selon la réponse tensionnelle. Le traitement est prolongé et réévalué. Dans l’hypovolémie, envisager 25 mg une fois par jour au départ. Une glomérulopathie non diabétique ne correspond pas automatiquement à cette indication rénale.</p><p>La FI ne demande pas d’adaptation rénale systématique, y compris chez le dialysé, mais appelle à la prudence et à un début réduit en insuffisance sévère, hypovolémie ou traitement diurétique important. En atteinte hépatique, prévoir une dose réduite ; l’insuffisance hépatique sévère est contre-indiquée. La FI retenue ne recommande pas le produit chez l’enfant ou l’adolescent faute de données établies.</p><p>Rechercher angio-œdème antérieur, hypotension, hyperkaliémie et atteinte fonctionnelle. Les AINS peuvent augmenter le risque rénal et modifier l’effet ; le lithium et les produits augmentant le potassium doivent être revus. Ne pas superposer IEC et ARA pour augmenter arbitrairement l’antiprotéinurie. Les situations d’association à l’aliskirène contre-indiquées restent celles définies dans la FI.</p><p>Les deuxième et troisième trimestres sont contre-indiqués ; le premier trimestre est déconseillé et le traitement doit être arrêté dès diagnostic de grossesse. Le projet de grossesse exige une adaptation préalable. La cible tensionnelle se poursuit avec une stratégie compatible avec la situation, et non en maintenant un produit inadapté pour conserver un chiffre de pression.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a>.</p></section>
<section class="ilot" id="n05-p-forxiga"><h2>Forxiga — une limite de produit distincte de la recommandation de classe</h2><p><b>Dapagliflozine, FI août 2026 ; comprimés par voie orale.</b> Dans la maladie rénale chronique de l’adulte, la dose recommandée est 10 mg une fois par jour, indépendamment des repas. Avaler entier. Ce schéma rénal est distinct du début à 5 mg de certaines situations de diabète ; augmenter au-delà de 10 mg/j n’est pas une stratégie de correction de la protéinurie. La durée est prolongée selon bénéfice et tolérance.</p><p>L’instauration n’est pas recommandée si le débit estimé est inférieur à 25 mL/min/1,73 m². Un traitement déjà commencé à 10 mg/j peut être poursuivi sous ce seuil selon la FI, jusqu’à la situation de dialyse ou de transplantation. En atteinte hépatique légère ou modérée, pas d’ajustement ; si elle est sévère, début à 5 mg/j puis 10 mg/j selon tolérance. L’indication rénale de l’adulte ne se transpose pas à l’enfant.</p><p>La FI ne recommande pas le traitement de néphropathie sous immunosuppresseur, après greffe, en dialyse ou dans la polykystose faute de données suffisantes ; elle ne dispose pas d’expérience chez le non-diabétique sans albuminurie. Ainsi, le seuil de classe à 20 dans les recommandations n’autorise pas un début de ce produit à 20, et une association avec un traitement étiologique doit être discutée dans le cadre suisse exact.</p><p>Surveiller volume et pression, surtout avec un diurétique. Une acidocétose peut être évoquée devant nausées, douleurs abdominales, dyspnée ou altération générale, même sans forte hyperglycémie : interrompre et évaluer rapidement en cas de suspicion. Infections génitales et symptômes périnéaux fébriles nécessitent une évaluation. Le produit ne traite ni le diabète de type 1 ni l’acidocétose.</p><p>Arrêter si possible au moins trois jours avant chirurgie lourde ou jeûne prolongé ; reprendre lorsque l’état est stable et l’alimentation orale rétablie. Une maladie aiguë grave peut justifier une interruption avec un plan de reprise écrit. Surveiller plus fréquemment la lithiémie si associé. Arrêter dès grossesse diagnostiquée ; ne pas utiliser pendant l’allaitement. Le bénéfice attendu ne supprime pas les consignes de sécurité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisseForxiga,août 2026 — Indication MRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a>.</p></section>
<section class="ilot" id="n05-p-norvasc"><h2>Norvasc — compléter le contrôle de pression</h2><p><b>Amlodipine, FI avril 2023 ; voie orale.</b> Pour l’hypertension, le traitement commence habituellement à 5 mg une fois par jour et peut atteindre 10 mg une fois par jour selon la réponse. Il s’agit d’un traitement de fond, avec réévaluation de pression et tolérance ; ce schéma ne remplace pas la prise en charge d’une urgence hypertensive.</p><p>Pas d’adaptation rénale habituelle ; le produit n’est pas dialysable. La prudence s’impose en atteinte hépatique, sans schéma chiffré spécifique établi par la FI. Chez le sujet âgé, un début plus faible peut être nécessaire. La FI retenue ne fournit pas de schéma établi avant 18 ans. Ne pas inventer une dose pédiatrique à partir d’une fraction du comprimé adulte.</p><p>Hypotension sévère, choc, obstruction sévère à l’éjection ventriculaire gauche et certaines situations cardiaques instables constituent des contre-indications. Surveiller vertiges, tolérance et œdèmes ; une augmentation des œdèmes après changement de traitement demande une interprétation clinique, pas une attribution automatique à la progression rénale.</p><p>Vérifier inhibiteurs ou inducteurs du CYP3A4 et éviter le pamplemousse selon la FI. Si simvastatine associée, son plafond est 20 mg/j sous amlodipine. Une surveillance des concentrations de ciclosporine ou tacrolimus peut être nécessaire. Grossesse seulement en nécessité absolue ; si le traitement est indispensable pendant l’allaitement, la FI demande le sevrage. Le choix individuel se discute avec le prescripteur.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Norvasc, avril 2023 — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a>.</p></section>
<section class="ilot" id="n05-p-lasix"><h2>Lasix comprimés 40 mg — traiter l’œdème sans provoquer une déplétion</h2><p><b>Furosémide oral, FI mai 2025.</b> Les œdèmes d’origine rénale font partie des indications. Le début adulte est de 20 à 80 mg/j, soit un demi à deux comprimés de 40 mg par jour ; l’entretien habituel indiqué est 20–40 mg/j. Prendre à jeun, sans croquer, avec de l’eau. La dose et la durée sont adaptées à la réponse et au contexte ; conserver la dose la plus faible permettant l’effet recherché.</p><p>La FI mentionne un maximum de 1500 mg/j par voie orale ou intraveineuse dans des situations particulières ; ce plafond exceptionnel, surtout pertinent lors de fonction très diminuée et de prise en charge spécialisée, n’est ni une dose de départ ni une cible d’escalade ambulatoire. Le produit décrit ici est le comprimé de 40 mg ; il ne fournit pas le protocole d’une urgence respiratoire. Chez l’enfant, le schéma oral de la FI est 2 mg/kg/j, maximum 40 mg/j, sous évaluation adaptée.</p><p>Défaillance rénale avec anurie, hypovolémie/déshydratation, hypokaliémie ou hyponatrémie sévères et coma/précoma hépatique sont des contre-indications. L’écoulement de l’urine doit être assuré. En hypoprotéinémie ou atteinte hépatique associée, titrer prudemment et surveiller étroitement. La fonction rénale basse ne justifie pas un diurétique en présence d’anurie.</p><p>Surveiller poids, pression, créatinine, sodium, potassium et autres électrolytes selon le contexte. La FI évoque le risque de déficit potassique ; dans une maladie rénale chronique et sous bloqueur rénine–angiotensine, ne pas donner automatiquement un apport de potassium : mesurer et individualiser avec les recommandations suisses de surveillance.</p><p>AINS, lithium, médicaments ototoxiques et autres médicaments néphrotoxiques nécessitent une revue ; une hypokaliémie peut majorer le risque de certains traitements cardiaques. Grossesse uniquement sur indication stricte avec surveillance ; allaitement contre-indiqué dans la FI. Une diurèse accrue ne prouve pas une guérison de la glomérulopathie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a>.</p></section>
<section class="ilot" id="n05-p-lasix-iv"><h2>Lasix ampoule 20 mg — une forme et une situation distinctes</h2><p><b>Furosémide injectable, FI mars 2025 ; ampoule 20 mg/2 mL.</b> Pour les indications de la FI, adulte et adolescent dès 15 ans : dose initiale 20–40 mg IV ; si effet insuffisant, augmentation par 20 mg toutes les 2 heures selon réponse sous surveillance. La dose unitaire trouvée peut être répétée une à deux fois par jour. La durée et le relais sont adaptés ; passer à l’oral dès que possible.</p><p>Dans l’œdème pulmonaire aigu, la FI donne 40 mg IV initialement, puis 20–40 mg après 20 minutes si l’état le nécessite, en association aux autres mesures de prise en charge. Injecter lentement, sans dépasser 4 mg/min ; si créatinine supérieure à 5 mg/dL, la limite est 2,5 mg/min. Ce schéma ne remplace pas l’évaluation urgente ni une épuration nécessaire ; l’intramusculaire n’est pas indiqué dans une telle situation aiguë.</p><p>Le maximum IV mentionné est 1500 mg/j dans des situations exceptionnelles de fonction très diminuée, sous prise en charge spécialisée ; ce n’est ni une dose initiale ni une cible d’escalade usuelle. Chez le nourrisson et l’enfant de moins de 15 ans, la voie parentérale est réservée aux cas critiques :1 mg/kg IV ou IM, maximum 20 mg/j selon cette FI. L’adaptation pédiatrique ne se déduit pas du schéma oral.</p><p>Anurie, hypovolémie/déshydratation, hypokaliémie ou hyponatrémie sévères, coma/précoma hépatique et allaitement sont des contre-indications. Assurer l’écoulement urinaire. Surveiller volume, pression, créatinine et électrolytes ; titrer prudemment en hypoprotéinémie. Pas d’apport potassique automatique devant un risque d’hyperkaliémie.</p><p>Les aminoglycosides peuvent majorer une ototoxicité parfois irréversible ; lithium, AINS et autres néphrotoxiques nécessitent une revue. L’association à IEC/ARA expose à hypotension et altération fonctionnelle, surtout si déplétion ; toute réduction ou pause tient compte de la congestion et du plan de reprise. Pendant la grossesse : seulement nécessité absolue, indication expresse et période brève, avec surveillance de croissance fœtale. Si indispensable pendant l’allaitement, le sevrage est requis selon la FI.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a>.</p></section>
<section class="ilot" id="n05-p-populations"><h2>Populations, sécurité et cadre suisse</h2><table class="t"><thead><tr><th>Situation</th><th>Adaptation du raisonnement</th></tr></thead><tbody><tr><td>Enfant</td><td>Références de pression et d’équations adaptées, croissance préservée ; pas de restriction protéique adulte ni de doses adultes extrapolées.</td></tr><tr><td>Grossesse ou projet</td><td>Revoir tôt IEC/ARA et dapagliflozine ; choix coordonné selon cause et produits, sans arrêt laissé sans stratégie de relais.</td></tr><tr><td>Fragilité ou sarcopénie</td><td>Cible tensionnelle et nutrition individualisées ; précision du débit et risque de chute réévalués.</td></tr><tr><td>Maladie aiguë</td><td>Chercher déplétion, infection et effets médicamenteux ; toute pause comporte consignes de contrôle et de reprise.</td></tr><tr><td>Atteinte hépatique</td><td>Vérifier chaque FI : limites et adaptations diffèrent entre produits.</td></tr><tr><td>Remboursement</td><td>Les recommandations SGN renvoient à la liste des spécialités ; vérifier les conditions contemporaines pour le produit et l’indication.</td></tr></tbody></table><p>Le syndrome N05 n’établit pas à lui seul une déclaration OFSP, une indemnisation Suva, un droit AI ou une règle uniforme d’aptitude professionnelle. La cause et le retentissement déterminent les démarches individuelles. Des vertiges ou une hypotension sous traitement peuvent altérer la conduite ; les consignes du produit et l’évaluation clinique s’appliquent. Une promesse de remboursement ou de capacité de travail ne se déduit pas d’une catégorie CIM.</p><p>Le plan médicamenteux doit être compréhensible : objectif de chaque produit, dose, contrôle prévu, situations de contact et modalités de reprise après interruption. La collaboration avec pharmacien, médecin traitant, néphrologue et autres spécialistes aide à éviter prescriptions incompatibles ou doublons.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisseForxiga,août 2026 — Indication MRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Norvasc, avril 2023 — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a>.</p></section>
