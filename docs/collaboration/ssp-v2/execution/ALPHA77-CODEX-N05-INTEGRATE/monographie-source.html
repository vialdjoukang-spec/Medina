rk="1"]{left:28%;top:46%}[data-n05-figure="crescent"] [data-n05-mark="2"]{left:38%;top:80%}[data-n05-figure="crescent"] [data-n05-mark="3"]{left:47%;top:42%}[data-n05-figure="sediment"] [data-n05-mark="1"]{left:24%;top:19%}[data-n05-figure="sediment"] [data-n05-mark="2"]{left:74%;top:20%}[data-n05-figure="sediment"] [data-n05-mark="3"]{left:25%;top:71%}[data-n05-figure="sediment"] [data-n05-mark="4"]{left:77%;top:75%}[data-n05-figure="kidney"] [data-n05-mark="1"]{left:23%;top:39%}[data-n05-figure="kidney"] [data-n05-mark="2"]{left:46%;top:31%}[data-n05-figure="kidney"] [data-n05-mark="3"]{left:65%;top:61%}[data-n05-figure="kidney"] [data-n05-mark="4"]{left:87%;top:87%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#n05-1">Définition</a></li><li><a href="#n05-2">Épidémiologie</a></li><li><a href="#n05-3">Physiopathologie</a></li><li><a href="#n05-4">Démarche clinique</a></li><li><a href="#n05-5">Anamnèse</a></li><li><a href="#n05-6">Examen clinique</a></li><li><a href="#n05-7">Syndromes</a></li><li><a href="#n05-8">Diagnostic positif</a></li><li><a href="#n05-9">Explorations</a></li><li><a href="#n05-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#n05-11">Prise en charge</a></li><li><a href="#n05-12">Prévention, suivi et pronostic</a></li><li><a href="#n05-13">Points clés</a></li><li><a href="#n05-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="N05"><section class="ilot" id="n05-question"><h2>Le dossier dit « néphrite » : que faut-il décider aujourd’hui ?</h2><p><b>Vignette fictive.</b> Une personne arrive avec un résultat de créatinine élevé, une hématurie et une protéinurie. Aucun résultat ancien n’est disponible. Depuis quelques jours, elle remarque des chevilles gonflées et urine moins. Le courrier mentionne simplement « néphrite, sans précision ». Ce libellé ne permet de conclure ni à une maladie récente, ni à une cicatrice ancienne, ni à une indication de corticoïdes.</p><p>Le premier examen recherche une complication : dyspnée, surcharge, hypertension avec retentissement, trouble du potassium ou dégradation rapide. En parallèle, il faut retrouver les valeurs antérieures, caractériser les urines et organiser la recherche de cause. Une incertitude diagnostique impose un plan explicite ; elle ne justifie pas une attente sans surveillance.</p><div class="key"><b>À retenir.</b> Écrire séparément ce qui est observé, ce qui menace le patient et ce qui manque encore pour préciser le diagnostic.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a>.</p></section>
<section class="ilot" id="n05-1"><h2>1. Définition : un cadre à préciser</h2><p>Un syndrome glomérulaire est évoqué devant une protéinurie glomérulaire et/ou une hématurie, auxquelles peuvent s’associer hypertension, œdèmes et insuffisance rénale. La présentation néphritique fait rechercher particulièrement hématurie, baisse de filtration et rétention hydrosodée. Leur combinaison et leur vitesse d’apparition orientent la gravité et la cause ; tous les signes ne sont pas nécessairement présents au même moment.</p><p><b>« Sans précision » décrit une information insuffisante.</b> Il ne désigne pas une étiologie autonome et n’établit pas que la maladie soit bénigne. Une même première observation peut correspondre à une atteinte aiguë, une maladie ancienne découverte tardivement ou une aggravation sur maladie chronique. Le diagnostic doit progresser dès que la chronologie, le bilan ou le tissu le permettent.</p><p>La CIM-10-GM suisse N05 inclut notamment glomérulopathie, glomérulonéphrite ou néphrite sans autre indication. Elle distingue la maladie rénale sans précision avec une morphologie connue, et exclut la maladie rénale ou néphropathie sans précision sans lésion morphologique précisée, classée N28.9, ainsi que la néphrite tubulo-interstitielle sans précision N12. Toute créatinine élevée inexpliquée ne relève donc pas automatiquement de N05.</p><p>Le diagnostic clinique vient avant le code. La cause, la temporalité, les lésions, la fonction et les complications se documentent sur des axes complémentaires. Le nom administratif ne fournit aucun protocole thérapeutique commun à tous les patients.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p><p><button class="w" data-k="n05-exp-1">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-1">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-2"><h2>2. Épidémiologie : ne pas donner une fréquence à une information manquante</h2><p>Les sources retenues ne donnent pas d’incidence suisse directe du syndrome néphritique sans précision N05. Ce libellé dépend aussi du degré de précision des dossiers et du codage ; une fréquence de codes ne serait pas nécessairement celle d’une maladie biologique unique. Aucun chiffre de dialyse, d’insuffisance rénale aiguë ou de biopsie ne lui est substitué.</p><p>La SGN estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique. Il s’agit d’un contexte de dépistage, non d’une estimation de N05. De même, une série européenne de biopsies sélectionne les personnes pour lesquelles un prélèvement a été réalisé : elle ne représente pas toutes les hématuries de la population.</p><p>La probabilité d’une cause change avec l’âge, les antécédents, la famille, les infections, les maladies auto-immunes, les expositions et l’évolution. Ces données guident les hypothèses sans remplacer les preuves. L’absence de taux national précis n’empêche ni la reconnaissance d’une urgence ni une enquête ciblée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a>.</p><p><button class="w" data-k="n05-exp-2">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-2">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-3"><h2>3. Physiopathologie : un même signe, plusieurs mécanismes</h2><p>Le filtre normal associe endothélium, membrane basale et podocytes. Une lésion peut augmenter le passage d’albumine et d’érythrocytes vers l’urine. La morphologie des hématies et les cylindres apportent des indices de localisation ; ils n’identifient pas à eux seuls le mécanisme immunitaire ou la maladie causale.</p><figure data-n05-figure="podocytes"><div data-n05-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n05/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n05-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Les maladies glomérulaires peuvent associer dépôts, prolifération, altération structurale et cicatrices. Une baisse de filtration peut accompagner une lésion glomérulaire active, mais aussi une hypoperfusion, une obstruction ou une atteinte tubulaire associée. Une baisse du coefficient d’ultrafiltration ou de la pression utile à la filtration diminue le débit ; le résultat biologique final ne distingue pas seul ces mécanismes.</p><p>La rétention de sodium et d’eau contribue aux œdèmes, à la prise de poids et à l’hypertension. La baisse des capacités d’excrétion peut favoriser hyperkaliémie et acidose. Le retentissement clinique dépend de la rapidité, de l’intensité et du terrain ; la quantité de sang visible ne mesure pas cette gravité.</p><p>Le croissant est une lésion extracapillaire. Sur l’original PAS ci-dessous, la provenance rapporte une maladie anti-membrane basale démontrée par immunofluorescence ; cette démonstration ne se voit pas sur cette seule coloration. Un croissant n’identifie donc pas à lui seul toute l’étiologie, et une photographie ne mesure pas la vitesse de dégradation du patient.</p><figure data-n05-figure="crescent"><div data-n05-frame="wide"><img alt="Microphotographie humaine PAS d’une glomérulonéphrite extracapillaire, avec maladie anti-membrane basale documentée par la source" loading="lazy" src="assets/img/n05/alpha/codex/Crescentic_glomerulonephritis_-_high_mag.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Premier glomérule lésé dans la moitié gauche.</li><li>Autre glomérule lésé ; l’évaluation d’activité et de fibrose nécessite toute la biopsie.</li><li>Lumière tubulaire : repère de séparation entre compartiments.</li></ol><p>La source rapporte des dépôts linéaires d’IgG en immunofluorescence ; ce signal n’est pas visible sur cette coloration PAS. Les repères localisent les structures sans prétendre typer chaque cellule ni quantifier les croissants.</p><p data-n05-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Crescentic_glomerulonephritis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a>.</p><p><button class="w" data-k="n05-exp-3">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-3">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-4"><h2>4. Démarche clinique : sécuriser, dater, localiser, expliquer</h2><p><b>Sécuriser.</b> Apprécier respiration, circulation, état neurologique, pression, volume et diurèse. Chercher potassium et troubles acido-basiques selon le contexte, avec ECG lorsqu’une insuffisance rénale aiguë est suspectée. Une complication menaçante appelle des soins hospitaliers et un avis spécialisé immédiat, sans attendre la cause finale.</p><p><b>Dater.</b> Retrouver les créatininémies, urines et pressions antérieures, les hospitalisations, les médicaments et les événements intercurrents. L’absence de résultat ancien n’est pas une preuve de début récent. Inversement, une maladie ancienne peut subir une aggravation aiguë. Les critères de maladie rénale chronique exigent au moins trois mois ; ce délai de définition n’est jamais un délai d’attente imposé aux soins.</p><p><b>Localiser.</b> Confirmer les hématies, quantifier albumine et protéines, examiner le sédiment et vérifier les conditions de recueil. Rechercher aussi une infection ou un obstacle selon le tableau. La présence d’un indice glomérulaire ne dispense pas de rechercher une cause associée.</p><p><b>Expliquer et organiser.</b> Orienter immunologie, recherche infectieuse, génétique et biopsie avec le néphrologue. La conclusion distingue confirmé, probable et encore inconnu. Préciser qui revoit le patient, quand seront contrôlées fonction et urines, et quels signes déclenchent un contact immédiat.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n05-exp-4">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-4">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-5"><h2>5. Anamnèse : retrouver la chronologie et les indices de cause</h2><table class="t"><thead><tr><th>Domaine</th><th>Données recherchées</th><th>Conséquence</th></tr></thead><tbody><tr><td>Temps</td><td>Dates des premières anomalies ; derniers résultats normaux ; vitesse des changements</td><td>Distinguer aigu, chronique et aigu sur chronique sans supposer une durée.</td></tr><tr><td>Urines et volume</td><td>Sang visible, diurèse, œdèmes, poids, dyspnée</td><td>Évaluer retentissement ; couleur et mousse ne quantifient ni fonction ni protéines.</td></tr><tr><td>Signes systémiques</td><td>Purpura, arthralgies, fièvre, symptômes ORL ou respiratoires</td><td>Orienter infection, auto-immunité ou vascularite ; hémoptysie et atteinte rénale imposent urgence.</td></tr><tr><td>Infection</td><td>Foyer récent ou persistant, état général, exposition pertinente</td><td>Rechercher une cause infectieuse avant une stratégie immune non ciblée.</td></tr><tr><td>Famille</td><td>Hématurie, insuffisance rénale, âge de survenue, audition, yeux</td><td>Discuter maladie héréditaire et conseil spécialisé.</td></tr><tr><td>Produits pris</td><td>AINS, traitements prescrits, changements récents, plantes et compléments</td><td>Chercher néphrotoxicité, interaction, modification hémodynamique ou déplétion.</td></tr><tr><td>Maladies connues</td><td>Diabète, lupus, hépatite, gammapathie et diagnostic rénal antérieur</td><td>Une cause connue ne prouve pas qu’elle explique tout épisode nouveau.</td></tr><tr><td>Terrain</td><td>Grossesse, croissance, fragilité, alimentation, travail et accès aux soins</td><td>Adapter examens, traitements et plan de surveillance.</td></tr></tbody></table><p>Un dossier incomplet appelle une recherche active des anciens résultats avec le patient et les soignants concernés. Une mention « normal » sans date, analyte ou unité ne suffit pas. Les traitements effectivement pris peuvent différer de la dernière ordonnance ; cette différence peut expliquer une partie de l’évolution.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a>.</p><p><button class="w" data-k="n05-exp-5">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-5">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-6"><h2>6. Examen clinique : identifier le retentissement actuel</h2><p>Mesurer pression, fréquence cardiaque, poids et état d’hydratation, puis rechercher œdèmes et signes de congestion. Une dyspnée nécessite une appréciation respiratoire et une recherche de surcharge ou d’atteinte pulmonaire systémique. Une pression élevée se juge avec ses conséquences neurologiques, cardiaques et rénales ; la prise en charge d’une urgence ne se confond pas avec une cible de traitement prolongé.</p><p>Rechercher les indices guidés par l’anamnèse : purpura, atteinte articulaire, foyer infectieux, signes ORL, manifestations oculaires ou auditives, anomalies des voies urinaires. Un tableau pulmonaire–rénal possible exige une évaluation urgente. L’absence d’un signe extrarénal ne suffit pas à exclure une glomérulopathie.</p><p>L’œdème ne prouve pas que tout patient soit correctement perfusé ni qu’une perfusion ou une hausse de diurétique soit appropriée. L’examen, les pertes, les médicaments et la trajectoire se confrontent. Chez l’enfant, pression et croissance s’interprètent selon les références pédiatriques ; chez la personne âgée, fragilité, orthostatisme, chutes et nutrition modifient la tolérance des objectifs.</p><p>Pour un éventuel suivi chronique stable, utiliser une méthode tensionnelle reproductible. La SGN 2025 propose une systolique 120–129mmHg individualisée ; KDIGO 2024 propose moins de 120 en mesure standardisée lorsque toléré. Ces recommandations attribuées ne donnent pas une cible immédiate universelle devant un syndrome non précisé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p><p><button class="w" data-k="n05-exp-6">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-6">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-7"><h2>7. Syndromes et classifications : séparer les axes</h2><table class="t"><thead><tr><th>Axe</th><th>Repères</th><th>Ce qui reste à préciser</th></tr></thead><tbody><tr><td>Néphritique aigu</td><td>Quelques jours ; hématurie, rétention/HTA, protéinurie, insuffisance rénale et oligurie possibles</td><td>Cause, sévérité et complications.</td></tr><tr><td>Rapidement progressif</td><td>Dégradation rapide de fonction avec signes glomérulaires</td><td>Urgence néphrologique ; immunologie et tissu orientent la cause.</td></tr><tr><td>Glomérulaire chronique</td><td>Protéinurie persistante ± hématurie, HTA ou baisse de fonction</td><td>Preuve de durée, activité, cicatrices et risque.</td></tr><tr><td>Néphrotique associé</td><td>Chez l’adulte selon CUEN : protéines ≥ 3 g/j ou g/g et albumine &lt; 30 g/L</td><td>Risques et conduite propres ; œdème isolé insuffisant.</td></tr><tr><td>IRA</td><td>Créatinine et/ou diurèse dans une fenêtre de temps définie</td><td>Décrit fonction et gravité, non l’étiologie.</td></tr><tr><td>MRC</td><td>Atteinte ≥ 3 mois ; cause, catégories G et A</td><td>G1/G2 sans marqueur ne suffisent pas à définir la maladie.</td></tr><tr><td>Morphologie</td><td>Dépôts, prolifération, croissants, sclérose, distribution</td><td>Une lésion peut avoir plusieurs causes.</td></tr></tbody></table><p>N05 ne constitue pas un stade entre aigu et chronique. Il faut continuer à préciser le tableau à partir des preuves disponibles. Le suffixe morphologique ne résume ni le retentissement ni la vitesse d’évolution.</p><p>Si une MRC est établie, les catégories de débit sont G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². L’albuminurie A1 &lt; 30, A2 30–300, A3 &gt; 300 mg/g constitue un autre axe. Ces catégories ne servent pas à classer une valeur instable comme si l’équation donnait alors une mesure fiable de filtration.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p><p><button class="w" data-k="n05-exp-7">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-7">▲ Loi de Pareto — Le raisonnement essentiel</button></section>

<section class="ilot" id="n05-8"><h2>8. Diagnostic positif : rendre les preuves et les incertitudes explicites</h2><p><b>Confirmer le signe.</b> Une bandelette positive pour le sang n’établit pas seule une hématurie ; vérifier la présence d’érythrocytes. Quantifier protéines et albumine dans les unités du laboratoire. Une dysmorphie supérieure à 60 %, des acanthocytes supérieurs à 5 % ou des cylindres hématiques orientent une origine glomérulaire selon HUG 2024 ; sensibilité, recueil et lecture en limitent l’interprétation. Leur absence n’exclut pas une maladie glomérulaire.</p><p><b>Décrire la fonction avec le temps.</b> Dans la dernière directive AKI adoptée trouvée, reprise par le CUEN 2025, l’IRA correspond à une hausse de créatinine ≥ 26,5 µmol/L en 48 h, ou ≥ 1,5 fois la valeur de base connue ou présumée en 7 jours, ou une diurèse &lt; 0,5 mL/kg/h pendant 6 h. Un de ces critères suffit. Ils ne diagnostiquent pas une glomérulonéphrite. Une dégradation plus lente peut rester grave sans remplir cette fenêtre.</p><p><b>Préciser le syndrome et la cause.</b> L’ensemble clinique et urinaire soutient la localisation ; les examens orientés et parfois la biopsie établissent la maladie. Une IgA sérique ne prouve pas une néphropathie à IgA ; le diagnostic est tissulaire. La génétique peut préciser une atteinte COL4A3/COL4A4/COL4A5, avec ses limites et la possibilité d’une maladie associée.</p><p><b>Actualiser le diagnostic.</b> Documenter ce qui empêche encore une précision : antériorité absente, bilan en attente ou tissu non disponible. La page officielle KDIGO consultée présente encore AKI/AKD 2026 comme projet préparé pour publication ; il n’est pas utilisé ici comme directive adoptée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://kdigo.org/guidelines/acute-kidney-injury/" rel="noopener" target="_blank">KDIGO, page officielle consultée 2novembre 2026 — Guideline Update et Guideline Suite</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">KDIGO, consensus international 2025 — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a>.</p><p><button class="w" data-k="n05-exp-8">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-8">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-9"><h2>9. Explorations : une question pour chaque examen</h2><table class="t"><thead><tr><th>Examen</th><th>Question</th><th>Limite</th></tr></thead><tbody><tr><td>Créatinine, électrolytes, équilibre acido-basique, ECG selon contexte</td><td>Retentissement et complications immédiates ?</td><td>Un chiffre isolé ne date ni ne localise la maladie.</td></tr><tr><td>Urines et sédiment</td><td>Hématies réelles, morphologie, cylindres, albumine/protéines ?</td><td>Méthode, fraîcheur, contamination et variabilité.</td></tr><tr><td>Échographie rénale et voies urinaires</td><td>Obstacle ou anomalie structurale ? Indices de chronicité ?</td><td>Ne montre pas les dépôts glomérulaires microscopiques.</td></tr><tr><td>Immunologie orientée</td><td>Complément, ANCA,anti-MBG,autoanticorps ou immunoglobuline monoclonale selon tableau ?</td><td>Ne constitue pas un panel diagnostique indépendant du contexte.</td></tr><tr><td>Recherche infectieuse</td><td>Foyer actif ou persistant susceptible d’expliquer/modifier le tableau ?</td><td>Choix guidé par histoire et examen.</td></tr><tr><td>Biopsie</td><td>Cause, activité, chronicité et conséquence thérapeutique ?</td><td>Échantillonnage, risques et techniques complémentaires.</td></tr><tr><td>Génétique</td><td>Phénotype familial ou structural évocateur ?</td><td>Variant incertain ou test négatif ne ferment pas toute hypothèse.</td></tr></tbody></table><p>La biopsie est encadrée par le néphrologue ; son intérêt diagnostique, pronostique et thérapeutique se confronte au risque. En cas de suspicion de glomérulonéphrite rapidement progressive, bilan immunologique et démarche tissulaire sont urgents. La prise en charge des complications avance en parallèle. Les délais d’arrêt d’un anticoagulant ou antiagrégant sont ceux du centre et de la situation, sans automatisme dérivé du code N05.</p><p>Les microscopies optique, immunofluorescente et électronique répondent à des questions distinctes. Un pattern membranoprolifératif oriente une recherche d’infection, auto-immunité, immunoglobuline monoclonale ou complément selon le profil. Un complément normal ne ferme pas toutes les causes ; une valeur basse ne donne pas une étiologie unique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a>.</p><p><button class="w" data-k="n05-exp-9">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-9">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-10"><h2>10. Arbre diagnostique : avancer malgré l’information manquante</h2><table class="t"><thead><tr><th>Étape</th><th>Décision</th><th>Suite</th></tr></thead><tbody><tr><td>1. Complication ou accélération ?</td><td>Dyspnée, oligurie, retentissement hypertensif, potassium/acidose, signes systémiques</td><td>Sécurisation et avis urgent ; ne pas attendre le résultat final.</td></tr><tr><td>2. Anomalie réelle ?</td><td>Recueil, hématies, protéines/albumine et unités</td><td>Corriger une erreur préanalytique tout en évaluant la gravité réelle.</td></tr><tr><td>3. Compartiment glomérulaire ?</td><td>Sédiment, prédominance albuminurique, contexte</td><td>Confronter causes urologiques, tubulaires, interstitielles et vasculaires.</td></tr><tr><td>4. Quelle durée ?</td><td>Résultats anciens, trajectoire, imagerie/tissu</td><td>Aigu, chronique ou aigu sur chronique ; préciser si encore inconnu.</td></tr><tr><td>5. Quelle cause ?</td><td>Infection, auto-immunité/vascularite, dépôts, famille, médicaments</td><td>Examens orientés et tissu/génétique lorsque utile.</td></tr><tr><td>6. Quel plan ?</td><td>Cause certaine/probable, activité, risques, préférences</td><td>Traitement adapté et contrôle daté ; réviser le libellé quand possible.</td></tr></tbody></table><p>Une hypoperfusion ou une obstruction peut expliquer une part de la baisse de fonction, même si une hématurie est présente. Une leucocyturie n’établit pas seule une infection, et un cylindre leucocytaire ne nomme pas une glomérulonéphrite. Diabète ou hypertension connus n’expliquent pas automatiquement un sédiment actif, un purpura ou une dégradation atypique.</p><p>La discordance est utile : un résultat qui ne correspond pas à l’hypothèse initiale impose de rouvrir les possibilités plutôt que de conserver N05 comme explication définitive. Une infection active et une maladie immune peuvent exiger des stratégies très différentes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a>.</p><p><button class="w" data-k="n05-exp-10">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-10">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-11"><h2>11. Prise en charge : traiter le risque actuel et préciser la cause</h2><p><b>Urgence.</b> Une suspicion de syndrome pulmonaire–rénal, une baisse rapide de fonction ou une complication menaçante relève d’une prise en charge hospitalière spécialisée. Rechercher et traiter hyperkaliémie, acidose, surcharge et trouble hémodynamique selon protocoles adaptés. L’épuration extrarénale est urgente si les troubles hydriques, électrolytiques ou acido-basiques menacent la vie ; le contexte et la tendance comptent davantage qu’un seuil isolé de créatinine.</p><p><b>Volume et pression.</b> La stratégie dépend de l’état réel : une personne déplétée et une personne congestive ne reçoivent pas le même traitement. Le furosémide peut traiter une surcharge dans son cadre d’indication ; il ne répare pas le filtre ni ne remplace une suppléance nécessaire. Les doses IV de Lasix proviennent de la FI de l’ampoule, distincte de celle du comprimé. Le traitement d’une urgence hypertensive ne se déduit pas du schéma oral d’amlodipine.</p><p><b>Cause.</b> Infection, auto-immunité, maladie à dépôts ou maladie héréditaire nécessitent des démarches différentes. Aucune immunosuppression systématique n’est prescrite sur le seul nom N05. La suspicion de maladie active grave appelle une décision spécialisée rapide ; l’incertitude ne doit devenir ni une prescription aveugle ni une raison d’inaction.</p><p><b>Après stabilisation.</b> Si une MRC est établie, discuter néphroprotection selon cause, albuminurie, fonction et tolérance. Le guide SGN 2025 et les FI exactes guident IEC/ARA, contrôle tensionnel et éventuel iSGLT2. Le seuil de classe SGLT2 de 20 ne remplace pas la limite d’introduction Forxiga à 25 mL/min/1,73 m² ; la FI ne recommande pas le produit pour une néphropathie sous immunosuppresseur. Revoir AINS, interactions, grossesse et risque de déplétion. Une pause médicamenteuse doit comporter un contrôle et un plan de reprise.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Norvasc, avril 2023 — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisseForxiga,août 2026 — Indication MRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p><p><button class="w" data-k="n05-exp-11">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-11">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-12"><h2>12. Prévention, suivi et pronostic : ne pas perdre un patient encore non classé</h2><p>Le premier suivi doit répondre aux incertitudes qui ont motivé le libellé : retrouver les données, vérifier l’évolution fonctionnelle et urinaire, obtenir les examens en attente et préciser le diagnostic. L’intervalle dépend de la gravité et de la vitesse, non du seul mot « sans précision ». Oligurie, dyspnée, hémoptysie, signes neurologiques ou aggravation clinique imposent un contact anticipé.</p><p>Le pronostic dépend de la cause, de l’activité, des cicatrices, de la fonction, des protéines et de la réponse. Un champ histologique ou un résultat ponctuel ne donne pas une trajectoire individuelle certaine. Après une atteinte aiguë, rechercher récupération et séquelles ; si des anomalies persistent au moins trois mois, vérifier les critères et le classement de MRC. L’amélioration de la diurèse n’établit pas seule la guérison.</p><p>Dans une MRC confirmée, suivre débit et albuminurie au moins annuellement, plus souvent si le risque ou un changement thérapeutique le demande. Les variations de débit supérieures à 20 %, ou à 30 % après une thérapie hémodynamique, et un doublement de l’ACR appellent une évaluation. Ces repères de suivi ne doivent pas retarder les soins d’une aggravation aiguë. Les équations de risque validées G3–G5 ne se transposent pas à une fonction instable ou à G1/G2.</p><p>Prévention et éducation associent revue des produits pris, surveillance adaptée, contrôle tensionnel et mesures de mode de vie lorsque le cadre est stable. Les objectifs alimentaires sont individualisés : pas de restriction protéique adulte automatique chez l’enfant, la personne fragile ou une situation aiguë. Le patient doit comprendre le prochain examen et le professionnel à contacter.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a>.</p><p><button class="w" data-k="n05-exp-12">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-12">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-13"><h2>13. Points clés pour l’examen fédéral</h2><p>Présenter une synthèse en quatre phrases : syndrome observé ; gravité et trajectoire ; hypothèses causales ; plan immédiat et suivi. Dire ce qui manque permet une décision transparente. Il faut savoir expliquer pourquoi le bilan doit être urgent ou pourquoi un contrôle ambulatoire organisé est possible dans la situation donnée.</p><p>Dans PROFILES 2017, l’hématurie se relie à SSP64 ; les tâches 159,161,164 et 173 concernent notamment tissu/génétique, fonction rénale, sédiment et protéinurie. Les directives MEBEKO 2026 articulent connaissances et compétences cliniques. Les cas et quiz ci-dessous sont des exercices originaux MEDINA, sans statut de questions officielles.</p><p>Une réponse utile associe toujours test et conséquence : sédiment pour localiser, créatinine datée pour apprécier la trajectoire, échographie pour rechercher un obstacle, immunologie orientée et tissu pour préciser une cause. Le code apparaît après cette conclusion clinique.</p><p><button class="w" data-k="n05-cas-1">Cas clinique 1</button> <button class="w" data-k="n05-cas-2">Cas clinique 2</button> <button class="w" data-k="n05-cas-3">Cas clinique 3</button> <button class="w" data-k="n05-cas-4">Cas clinique 4</button> </p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS, PROFILES 2017 — pp.29,32 :SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">MEBEKO,3mars 2026 — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p><p><button class="w" data-k="n05-exp-13">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-13">▲ Loi de Pareto — Le raisonnement essentiel</button><div class="quiz ui"><p>Sans résultat ancien, une créatinine élevée prouve-t-elle une atteinte aiguë ?</p><button data-ok="1">Non, la durée reste à documenter.</button><button data-ok="0">Oui, toute première découverte est aiguë.</button><p class="fb" hidden="">Retrouver les valeurs antérieures et suivre la trajectoire ; évaluer la gravité immédiatement.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p><div class="quiz ui"><p>Une baisse 68→51 correspond à quelle variation ?</p><button data-ok="1">Une baisse de 25 %.</button><button data-ok="0">Une baisse de 17 %.</button><p class="fb" hidden="">(68−51) ÷ 68 × 100 = 25 %. En suivi MRC ce repère appelle une évaluation, sans prouver une perte irréversible.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a>.</p><div class="quiz ui"><p>Un croissant PAS prouve-t-il une maladie anti-MBG ?</p><button data-ok="1">Non, plusieurs mécanismes sont possibles.</button><button data-ok="0">Oui, le PAS suffit.</button><p class="fb" hidden="">L’immunofluorescence, les anticorps et la clinique complètent la lésion morphologique.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><div class="quiz ui"><p>Faut-il attendre une cause certaine pour traiter une complication menaçante ?</p><button data-ok="1">Non, sécurisation et diagnostic avancent en parallèle.</button><button data-ok="0">Oui, le bilan doit toujours être terminé.</button><p class="fb" hidden="">Troubles hydriques, électrolytiques ou acido-basiques menaçants peuvent imposer une épuration urgente.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a>.</p></section>
<section class="ilot" id="n05-14"><h2>14. Pièges : ce que le libellé ne permet pas de conclure</h2><table class="t"><thead><tr><th>Raccourci</th><th>Correction</th><th>Conséquence</th></tr></thead><tbody><tr><td>Sans précision = bénin</td><td>La précision du dossier et la gravité sont indépendantes</td><td>Évaluer les complications dès le premier contact.</td></tr><tr><td>Créatinine élevée = néphrite N05</td><td>Fonction, localisation et nomenclature sont distinctes</td><td>Chercher obstacle,hypoperfusion et autres compartiments.</td></tr><tr><td>Pas d’antériorité = aigu</td><td>Le début est inconnu</td><td>Retrouver les données et surveiller la trajectoire.</td></tr><tr><td>Attendre trois mois pour agir</td><td>Trois mois définit la MRC</td><td>Traiter une menace actuelle immédiatement.</td></tr><tr><td>Croissant = anti-MBG</td><td>Plusieurs mécanismes produisent ce pattern</td><td>Confronter immunologie et techniques tissulaires.</td></tr><tr><td>Corticoïdes pour toute néphrite</td><td>Traitement causal et risques différents</td><td>Décision spécialisée adaptée, notamment à l’infection.</td></tr><tr><td>Plus d’urines = rein guéri</td><td>La diurèse ne mesure pas toutes les fonctions</td><td>Suivre fonction,volume et électrolytes.</td></tr><tr><td>Dose d’une forme = dose de toute forme</td><td>FIproduit et voie exactes</td><td>Lasix IVmars 2025 et oralmai 2025 distingués.</td></tr><tr><td>Projet 2026 = directiveadoptée</td><td>Statut officiel vérifié séparément</td><td>Attribuer le référentiel utilisé.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le bon diagnostic provisoire contient déjà un plan pour réduire l’incertitude.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://kdigo.org/guidelines/acute-kidney-injury/" rel="noopener" target="_blank">KDIGO, page officielle consultée 2novembre 2026 — Guideline Update et Guideline Suite</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a>.</p><p><button class="w" data-k="n05-exp-14">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n05-14">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n05-annexe-cim"><h2>Après la conclusion clinique : sous-codes morphologiques</h2><p>Le diagnostic clinique précède le codage. Les suffixes morphologiques OFS ci-dessous ne sont ni dix stades ni dix traitements. Les formes .0 à .8 nécessitent normalement une preuve précise par biopsie ou autopsie ; .9 décrit une morphologie non précisée.</p><table class="t"><thead><tr><th>Sous-code</th><th>Libellé morphologique</th></tr></thead><tbody><tr><td>N05.0</td><td>Anomalies glomérulaires mineures</td></tr><tr><td>N05.1</td><td>Lésions glomérulaires segmentaires et focales</td></tr><tr><td>N05.2</td><td>Glomérulonéphrite membraneuse diffuse</td></tr><tr><td>N05.3</td><td>Glomérulonéphrite mésangio-proliférative diffuse</td></tr><tr><td>N05.4</td><td>Glomérulonéphrite proliférative endocapillaire diffuse</td></tr><tr><td>N05.5</td><td>Glomérulonéphrite mésangiocapillaire diffuse</td></tr><tr><td>N05.6</td><td>Maladie à dépôt dense</td></tr><tr><td>N05.7</td><td>Glomérulonéphrite diffuse en croissant</td></tr><tr><td>N05.8</td><td>Autres modifications morphologiques</td></tr><tr><td>N05.9</td><td>Type de modification morphologique non précisé</td></tr></tbody></table><p>N05 inclut glomérulopathie, glomérulonéphrite et néphrite SAI, ainsi que maladie rénale SAI avec morphologie précisée. Il exclut néphropathie ou maladie rénale SAI sans lésion morphologique précisée N28.9 et néphrite tubulo-interstitielle SAI N12. Le code ne doit pas remplacer la recherche de cause et de temporalité ; la volonté de choisir un suffixe n’est pas une indication de biopsie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a>.</p></section>
</div></div>

<div class="panel" hidden="" id="pE"><div class="chap-body"><section class="ilot" id="n05-e-urines"><h2>Urines : quantifier une fuite, caractériser un sédiment</h2><table class="t"><thead><tr><th>Question</th><th>Examen</th><th>Interprétation et limite</th></tr></thead><tbody><tr><td>Combien d’albumine ?</td><td>Rapport albumine/créatinine, analyte et unité précisés</td><td>A1 &lt; 30, A2 30–300, A3 &gt; 300 mg/g ; ne mesure pas toutes les protéines.</td></tr><tr><td>Combien de protéines ?</td><td>Rapport protéines/créatinine ou recueil quantitatif</td><td>Pertinent pour certaines décisions glomérulaires ; recueil 24 h adulte si introduction/intensification d’immunosuppression.</td></tr><tr><td>Quel compartiment saigne ?</td><td>Numération et morphologie des hématies, acanthocytes, cylindres</td><td>Indices glomérulaires selon méthode ; absence non excluante.</td></tr><tr><td>Le résultat est-il fiable ?</td><td>Conditions de recueil, infection, sang visible, évolution</td><td>Un résultat ponctuel varie ; confirmer ce qui change une décision.</td></tr><tr><td>Et chez l’enfant ?</td><td>Premier prélèvement du matin pour le rapport protéines/créatinine</td><td>Équations et objectifs pédiatriques ; recueil 24 h souvent difficile.</td></tr></tbody></table><p>La bandelette dite « sang » ne compte pas les hématies : elle réagit aussi aux hémoprotéines libres. Le seuil local HUG de 26 millions/L correspond à 26 cellules/µL ; l’équivalence en nombre par champ dépend de la technique. Le seuil français CUEN de 10/µL est attribué à son référentiel ; ces deux nombres ne constituent pas deux stades de N05.</p><p>Le rapport albumine/créatinine et le rapport protéines/créatinine ont des numérateurs différents. Écrire mg/g, mg/mmol ou g/g est indispensable avant toute comparaison. Pour discuter une évolution, utiliser des prélèvements comparables et tenir compte du contexte. Le doublement de l’ACR appelle une évaluation ; il ne démontre pas automatiquement une poussée immune.</p><p>Dans une glomérulopathie, une quantification prolongée peut être nécessaire lorsque la décision d’intensifier un traitement dépend d’une mesure précise. Le choix ne consiste pas à demander tous les types de collecte à chaque consultation. Il suit une question et une population.</p><figure data-n05-figure="sediment"><div data-n05-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n05/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span><span aria-hidden="true" data-n05-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n05-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">CUEN,12e édition 2025 — pp.118–123, texte hors arbre p 122 mal extrait</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a>.</p></section>
<section class="ilot" id="n05-e-fonction"><h2>Fonction rénale : interpréter une valeur et sa variation</h2><p>La créatinine est un marqueur indirect de filtration influencé notamment par sa production ; le débit estimé n’est pas une mesure de toutes les fonctions rénales. Une masse musculaire faible ou inhabituelle, une situation non stable et certains traitements limitent son interprétation. Quand la précision est déterminante, une estimation combinée créatinine–cystatine C ou une mesure de filtration peut être indiquée.</p><p>Une fonction instable ne se classe pas avec une équation comme si elle était à l’équilibre. Les critères IRA portent sur la créatinine et la diurèse avec leurs délais ; ils ne prouvent pas une cause glomérulaire. Dans une maladie rénale chronique établie, la variation relative aide à reconnaître ce qui dépasse les fluctuations attendues. Une baisse de débit supérieure à 20 % sur un contrôle appelle une évaluation ; après une thérapie hémodynamique, une baisse supérieure à 30 % constitue un autre repère. Pour un IEC/ARA, la recommandation de sécurité se formule aussi comme une hausse de créatinine supérieure à 30 % dans les quatre semaines après introduction ou titration. Ces formulations ne sont pas des transformations mathématiques exactement équivalentes.</p><p>Le calcul de variation doit préciser la valeur de départ, le délai et le sens de la variation. Une créatinine qui augmente et un débit qui diminue ne se soustraient pas dans le même ordre. L’analyse recherche ensuite déplétion, médicaments, obstacle et maladie active. Une aggravation symptomatique ne doit pas attendre de franchir un seuil.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a>.</p><p><button class="w" data-k="n05-calcul-variation">Calculer une variation relative</button></p></section>
<section class="ilot" id="n05-e-cause"><h2>Cause et activité : organiser les preuves</h2><table class="t"><thead><tr><th>Outil</th><th>Question</th><th>Limite</th></tr></thead><tbody><tr><td>Immunologie orientée</td><td>Auto-immunité, complément, immunoglobulines selon présentation</td><td>Un anticorps ou un C3 bas isolé ne donne pas toute la cause.</td></tr><tr><td>Recherche infectieuse</td><td>Infection active ou persistante selon histoire et tableau</td><td>Une infection peut modifier la stratégie d’immunosuppression.</td></tr><tr><td>Échographie</td><td>Taille, parenchyme, obstacle, anomalies structurales</td><td>Ne démontre pas dépôts ou intégrité de la membrane basale.</td></tr><tr><td>Génétique</td><td>Maladie familiale ou phénotype évocateur, notamment COL4A3/4/5</td><td>Variant incertain et panel négatif ont des limites ; corrélation familiale et clinique.</td></tr><tr><td>Biopsie</td><td>Étiologie, activité, cicatrices et bénéfice possible d’un traitement</td><td>Risque et utilité individualisés ; prélèvement limité, techniques complémentaires.</td></tr></tbody></table><p>La biopsie rénale a une valeur diagnostique, pronostique et parfois thérapeutique. Une répétition n’est utile que si l’information attendue peut modifier le plan ou l’estimation du pronostic. Contrôler les conditions du geste et les traitements influençant le saignement selon le centre ; les délais d’arrêt ne doivent pas être improvisés à partir d’une règle unique.</p><p>Le compte rendu précise le compartiment, la distribution, les dépôts, les lésions actives et les cicatrices. Une fluorescence à dominante complément ou immunoglobuline change les hypothèses ; elle ne se voit pas sur une simple photographie PAS. Le patient reçoit une explication de ce que le tissu établit et de ce qui reste incertain.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">KDIGO, consensus international 2025 — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p></section>
</div></div><div class="panel" hidden="" id="pS"><div class="sci-bar ui" role="tablist"><button aria-controls="n05-s-semio" aria-selected="true" data-s="n05-s-semio" id="n05-tab-semio" role="tab">Sémiologie fondamentale et analytique</button><button aria-controls="n05-s-anat" aria-selected="false" data-s="n05-s-anat" id="n05-tab-anat" role="tab">Anatomie</button><button aria-controls="n05-s-histo" aria-selected="false" data-s="n05-s-histo" id="n05-tab-histo" role="tab">Histologie</button><button aria-controls="n05-s-physio" aria-selected="false" data-s="n05-s-physio" id="n05-tab-physio" role="tab">Physiologie</button><button aria-controls="n05-s-bio" aria-selected="false" data-s="n05-s-bio" id="n05-tab-bio" role="tab">Biochimie</button><button aria-controls="n05-s-immuno" aria-selected="false" data-s="n05-s-immuno" id="n05-tab-immuno" role="tab">Immunologie et physiopathologie</button></div><div class="chap-body sci-body"><div aria-labelledby="n05-tab-semio" class="sci" id="n05-s-semio" role="tabpanel"><section class="ilot" data-semiology="normal" id="n05-semio-normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>Le rein normal filtre puis transforme le filtrat en urine par les fonctions tubulaires. Le filtre retient les cellules et limite le passage des protéines ; une urine d’apparence habituelle ne démontre pas à elle seule que ce dispositif soit intact. L’albumine urinaire, le sédiment et la fonction donnent des informations complémentaires. La normalité doit préciser analyte, unité, méthode et population.</p><p>G1 ou G2 ne suffisent pas à exclure une maladie : des marqueurs urinaires ou histologiques persistants peuvent établir une atteinte avec filtration conservée. À l’inverse, G2 sans marqueur de dommage ne constitue pas à lui seul une maladie rénale chronique. La sémiologie commence par cette distinction entre valeur de fonction et intégrité du rein.</p><figure data-n05-figure="sediment"><div data-n05-frame="wide"><img alt="Quatre photographies originales de cylindres urinaires : épithélial, granuleux, leucocytaire et érythrocytaire" loading="lazy" src="assets/img/n05/alpha/codex/RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg"/><span aria-hidden="true" data-n05-mark="1">1</span><span aria-hidden="true" data-n05-mark="2">2</span><span aria-hidden="true" data-n05-mark="3">3</span><span aria-hidden="true" data-n05-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Panneau a : cylindre de cellules épithéliales tubulaires, selon la légende source.</li><li>Panneau b : cylindre granuleux brun, selon la légende source.</li><li>Panneau c : cylindre leucocytaire, selon la légende source.</li><li>Panneau d : cylindre érythrocytaire, repère pertinent pour une atteinte glomérulaire.</li></ol><p>Original disponible en 567 × 337 pixels ; les cellules ne sont pas reclassées au-delà de la légende publiée. Source utilisée pour la figure, pas comme recommandation américaine de prise en charge. La page Commons fournit les droits propres ; l’accès direct PMC a renvoyé une vérification de navigateur, sans lecture de l’article intégral.</p><p data-n05-credit="">V. Mohsenin, J Intensive Care 2017;5:57, figure de microscopie · <a href="https://commons.wikimedia.org/wiki/File:RTE_cast,_muddy_granular_cast,_WBC_cast_and_RBC_cast_in_urine.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></section>
<section class="ilot" data-semiology="signs" id="n05-semio-signs"><h3>Décrire le profil et sa temporalité</h3><p>La présentation peut être découverte sur une protéinurie, une hématurie ou une pression élevée, ou se manifester par une oligurie et des œdèmes. Sans antériorité, la durée reste inconnue : elle ne devient pas aiguë par défaut. Préciser la présence de sang visible, les œdèmes, les variations de poids et de diurèse, la tolérance à l’effort et les événements intercurrents. L’urine mousseuse ne quantifie pas les protéines ; sa description conduit à une mesure.</p><p>La durée et la vitesse sont deux dimensions distinctes. Une anomalie ancienne peut évoluer lentement puis se dégrader rapidement. L’expression « stable depuis des années » exige des données datées, pas seulement l’absence de plainte. Rechercher aussi purpura, manifestations articulaires, infectieuses, respiratoires ou familiales qui orientent la cause.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a>.</p></section>
<section class="ilot" data-semiology="mechanisms" id="n05-semio-mechanisms"><h3>Relier filtre, lésion et conséquence</h3><p>Une anomalie du filtre augmente le passage d’albumine ou d’hématies ; des hématies dysmorphiques et des cylindres soutiennent une origine glomérulaire. Une prolifération, un dépôt et une sclérose sont des mécanismes ou lésions différents. Le même signe urinaire peut donc résulter de maladies distinctes et d’une combinaison de lésions actives et anciennes.</p><p>Une cicatrice ne se traite pas comme une inflammation, tandis qu’une maladie chronique peut conserver une activité traitable. La biopsie, la trajectoire et les signes systémiques aident à faire cette distinction. La pression et la protéinurie participent aussi au risque évolutif, ce qui justifie une protection rénale même lorsqu’un traitement de cause est engagé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></section>
<section class="ilot" data-semiology="examination" id="n05-semio-examination"><h3>Mesurer dans des conditions qui permettent la comparaison</h3><p>Pour les urines, vérifier recueil, contamination, infection, sang visible et unité. Demander explicitement morphologie érythrocytaire et cylindres lorsque la localisation est en jeu. La méthode et la fraîcheur du prélèvement influencent l’examen ; un compte rendu « sang positif » ne remplace pas un sédiment.</p><p>Pour le patient, mesurer pression, poids, signes de congestion et d’hypovolémie, puis rechercher les indices de cause guidés par l’histoire. La comparaison des visites nécessite une technique cohérente. Une cible tensionnelle issue de mesures standardisées ne s’applique pas mécaniquement à une mesure occasionnelle faite dans d’autres conditions.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></section>
<section class="ilot" data-semiology="interpretation" id="n05-semio-interpretation"><h3>Interpréter un faisceau d’arguments</h3><p>Des acanthocytes ou des cylindres hématiques renforcent la localisation glomérulaire ; leur absence ne suffit pas à l’exclure. La protéinurie, l’évolution fonctionnelle et la clinique évitent de conclure à partir d’un signe négatif isolé. Le nombre d’hématies ne mesure pas directement l’activité immune.</p><p>Le débit et l’albuminurie contribuent au risque, mais un changement doit être vérifié et expliqué. Les repères de variation KDIGO servent à déclencher une évaluation, pas à déclarer une perte irréversible. De même, un score de risque de défaillance rénale estime une probabilité dans sa population de validation ; il ne calcule pas le bénéfice d’un corticoïde pour cette personne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></section>
<section class="ilot" data-semiology="differentials" id="n05-semio-differentials"><h3>Reconnaître les discordances qui rouvrent le diagnostic</h3><p>Une protéinurie à prédominance albuminurique et un sédiment glomérulaire orientent le compartiment, tandis qu’une obstruction ou une atteinte tubulo-interstitielle répond à d’autres indices. Diabète et hypertension peuvent être présents sans expliquer tout le tableau. Une infection persistante ou une maladie systémique peut modifier le mécanisme et le traitement.</p><p>Un pattern membranoprolifératif demande une recherche de cause ; une sclérose segmentaire peut être primaire, secondaire ou associée à une maladie génétique. Une évolution atypique chez un patient déjà étiqueté justifie donc une reprise clinique, parfois histologique. Le diagnostic ancien ne doit pas devenir une explication automatique de tout événement nouveau.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></section>
