<template data-pop="g92-sm-aphasie" data-title="Aphasie expressive : recherche et valeur">
<div class="lab">Normal</div><p>Un adulte sans atteinte nomme sans hésiter trois objets montrés, par exemple une horloge, un stylo et un bouton [S3].</p>
<div class="lab">Technique</div><p>Le médecin montre les trois objets et demande leur nom ; chaque bonne réponse vaut un point du score ICE [S3]. Il écoute aussi le discours spontané.</p>
<div class="lab">Mécanisme</div><p>L’aphasie traduit une atteinte des réseaux corticaux du langage ; sa physiopathologie n’est pas élucidée [S3].</p>
<div class="lab">Valeur et piège</div><p>Dans un essai de phase 1, l’aphasie expressive est apparue chez 19 des 22 patients qui ont évolué vers une neurotoxicité sévère [S3]. Ce chiffre ne donne aucune spécificité. Les premiers indices sont le manque du mot, les paraphasies, le discours hésitant et les persévérations [S3].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, description clinique et tableau 5</a>.</p></template>
<template data-pop="g92-sm-globale" data-title="Aphasie globale : le patient éveillé et muet">
<div class="lab">Définition</div><p>L’aphasie globale associe une atteinte expressive et réceptive : le patient paraît bien éveillé, mais il est muet et n’exécute aucun ordre [S3].</p>
<div class="lab">Technique</div><p>Le médecin vérifie l’éveil, puis demande un ordre simple, par exemple montrer deux doigts ou fermer les yeux et tirer la langue [S3].</p>
<div class="lab">Valeur</div><p>Ce tableau est le trait le plus caractéristique de l’ICANS face aux autres encéphalopathies [S3]. Les crises surviennent souvent après lui [S3].</p>
<div class="lab">Piège</div><p>L’ICE est alors à 0 ; le patient éveillé reste en grade 3, et seul le patient inaccessible passe en grade 4 [S3].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, tableau 6, note ^</a>.</p></template>
<template data-pop="g92-sm-vigilance" data-title="Vigilance : stimulation graduée">
<div class="lab">Normal</div><p>Le sujet sain s’éveille spontanément [S3].</p>
<div class="lab">Technique</div><p>Le médecin observe d’abord l’éveil spontané, puis appelle le patient, puis le touche ; il ne recourt aux stimulations vigoureuses répétées qu’en l’absence de réponse [S3]. Chez le patient comateux, l’Académie européenne de neurologie conseille le score FOUR plutôt que l’échelle de Glasgow en phase aiguë [S26].</p>
<div class="lab">Valeur</div><p>Éveil à la voix : grade 2 ; au seul toucher : grade 3 ; inaccessible, stupeur ou coma : grade 4 [S3].</p>
<div class="lab">Piège</div><p>Une baisse de vigilance due à un sédatif n’entre pas dans le grade [S3].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT, tableau 6</a> ; <a href="https://doi.org/10.1111/ene.14151" target="_blank" rel="noopener">EAN 2020, diagnostic du coma</a>.</p></template>
<template data-pop="g92-sm-htic" data-title="Signes d’hypertension intracrânienne">
<div class="lab">Signes</div><p>Œdème papillaire au fond d’œil, paralysie du nerf crânien VI, posture de décérébration ou de décortication et triade de Cushing définissent le grade 4 [S3].</p>
<div class="lab">Mécanisme</div><p>Un œdème cérébral diffus élève la pression intracrânienne ; il peut avoir une physiopathologie distincte de la neurotoxicité réversible [S3].</p>
<div class="lab">Piège</div><p>L’œdème peut être fulminant, avec peu de signes d’alerte ; un fond d’œil normal ne l’exclut pas [S3].</p>
<div class="lab">Conduite</div><p>Le grade 4 avec œdème impose les soins intensifs ; la tête surélevée, l’hyperventilation et l’osmothérapie relèvent des neurologues et des réanimateurs [S2].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll. 2026, § 5.4 et 11</a>.</p></template>
<template data-pop="g92-sm-asterixis" data-title="Astérixis : technique et sens">
<div class="lab">Définition</div><p>L’astérixis est une myoclonie négative : de brèves pauses de la contraction interrompent une posture maintenue [S28].</p>
<div class="lab">Technique</div><p>Le patient tend les bras, écarte les doigts, met les poignets en dorsiflexion et ferme les yeux ; le médecin recherche de brefs fléchissements des mains qui reviennent aussitôt à leur position [S28].</p>
<div class="lab">Valeur et piège</div><p>Le signe n’est pas spécifique ; il évoque une cause toxique ou métabolique, dont l’hyperammoniémie sous valproate [S28]. L’information professionnelle de l’ifosfamide le cite parmi les effets neurologiques [S7]. Dans l’ICANS, il est exclu de la définition et ne change pas le grade [S3]. Aucune sensibilité n’a été trouvée dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10972428/" target="_blank" rel="noopener">Rissardo et coll. 2024, § 4.1 (revue narrative, technique seulement)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680412170817" target="_blank" rel="noopener">Information professionnelle suisse Holoxan</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12180426/" target="_blank" rel="noopener">Consensus ASTCT</a>.</p></template>
<template data-pop="g92-sm-4at" data-title="Score 4AT du sujet âgé">
<div class="lab">Items</div><p>Vigilance : 0 ou 4 points ; AMT4, soit âge, date de naissance, lieu et année : 0 à 2 ; mois de l’année à rebours depuis décembre : 0 à 2 ; changement aigu ou fluctuant sur deux semaines : 0 ou 4 [S25].</p>
<div class="lab">Interprétation</div><p>0 : ni délire ni trouble cognitif modéré à sévère, sans les exclure ; 1 à 3 : trouble cognitif sans délire probable ; 4 ou plus : délire probable, à confirmer cliniquement [S25].</p>
<div class="lab">Valeur</div><p>Chez les 65 ans et plus, la méta-analyse de 17 études donne une sensibilité de 0,88 et une spécificité de 0,88 [S24].</p>
<div class="lab">Limite</div><p>Le 4AT n’est pas validé dans l’ICANS ; il sert à dépister le délire d’une encéphalopathie médicamenteuse du sujet âgé [S24].</p>
<p class="src">Références : <a href="https://www.the4at.com/userguide" target="_blank" rel="noopener">4AT, guide d’utilisation</a> ; <a href="https://doi.org/10.1093/ageing/afaa224" target="_blank" rel="noopener">Tieges et coll. 2021</a>.</p></template>
