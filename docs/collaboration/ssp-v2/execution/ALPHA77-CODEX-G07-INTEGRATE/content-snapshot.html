<template id="ch-G07"><div class="chap"><div class="chap-head"><div class="code">G07 · Neurologie</div><h1>G07 — Abcès et granulomes intracrâniens et intrarachidiens au cours de maladies classées ailleurs</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G07"><section class="ilot" id="g07-question"><h2>Une lésion focale : protéger la fonction et identifier la cause</h2><p>Une céphalée inhabituelle associée à un déficit, une crise ou une baisse de vigilance fait rechercher une lésion intracrânienne menaçante. Une douleur rachidienne avec faiblesse, niveau sensitif ou trouble sphinctérien impose de rechercher une atteinte médullaire ou radiculaire. La première décision est la sécurité : stabiliser, obtenir l’imagerie adaptée et joindre les équipes neurologique, infectiologique et neurochirurgicale selon le territoire et la gravité. L’identification précise de l’agent se poursuit en parallèle.</p><p>G07* désigne des abcès et granulomes intracrâniens et intrarachidiens au cours de maladies classées ailleurs. Ce code de manifestation ne correspond ni à un agent unique ni à une ordonnance commune. La leçon part de la fonction normale et de la localisation, puis distingue l’infection causale, le degré de preuve et les risques du traitement. Les inclusions de classification guident la documentation ; elles ne remplacent pas le raisonnement clinique.</p><div class="key"><b>À retenir.</b> D’abord évaluer l’urgence et le territoire ; ensuite établir la cause et choisir un traitement spécifique. Une lésion annulaire ne prouve pas un agent.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r11">[11]</button> · <button class="w" data-k="g07-r12">[12]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r19">[19]</button></p></section><section class="ilot" id="g07-definition"><h2>Abcès et granulome : deux organisations différentes</h2><p>Un abcès est une collection purulente. Dans la tuberculose intracrânienne, une collection contenant du pus et des bacilles peut avoir une paroi sans l’organisation granulomateuse typique du tuberculome. Un granulome est une organisation de cellules inflammatoires. Le tuberculome comporte notamment des histiocytes épithélioïdes, des cellules géantes multinucléées et des lymphocytes, parfois autour d’une caséation ; une réaction astrocytaire et une capsule peuvent l’entourer. La morphologie seule ne suffit pas à établir une cause certaine.</p><table class="t"><thead><tr><th>Organisation</th><th>Ce qu’elle apporte</th><th>Ce qu’elle ne démontre pas seule</th></tr></thead><tbody><tr><td>Collection purulente</td><td>Lésion pouvant nécessiter prélèvement, drainage et contrôle de l’effet de masse.</td><td>Agent, sensibilité et durée optimale.</td></tr><tr><td>Granulome organisé</td><td>Type de réaction tissulaire, contexte et prélèvements à orienter.</td><td>Tuberculose certaine ni indication automatique d’immunosuppression.</td></tr><tr><td>Lésion méningée ou parenchymateuse</td><td>Territoire différent, complications et accès au prélèvement différents.</td><td>Équivalence entre méningite, tuberculome méningé et tuberculome cérébral.</td></tr></tbody></table><p>Une méningite tuberculeuse peut coexister avec un tuberculome, mais les données de l’une ne sont pas automatiquement les données de l’autre. De même, un granulome schistosomien et une myélite ne sont pas des synonymes administratifs. Le compte rendu précise le compartiment, le caractère expansif, les complications et le niveau de certitude étiologique.</p><div class="key"><b>À retenir.</b> Décrire le tissu et le territoire avant de nommer l’agent ou d’appliquer un code causal.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r12">[12]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-codage"><h2>G07* est sans subdivision et accompagne une maladie causale</h2><p><button class="w" data-k="g07-asterisque">Lire le code de manifestation et ses inclusions</button></p><table class="t"><thead><tr><th>Inclusion de G07*</th><th>Code causal cité</th><th>Précision à conserver</th></tr></thead><tbody><tr><td>Abcès cérébral amibien</td><td>A06.6†</td><td>Lésion cérébrale ; ne pas confondre avec une amibiase intestinale.</td></tr><tr><td>Abcès gonococcique</td><td>A54.8†</td><td>Infection disséminée et preuve causale à documenter.</td></tr><tr><td>Abcès cérébral tuberculeux</td><td>A17.8†</td><td>Collection et agent ; ne pas appeler tout tuberculome un abcès.</td></tr><tr><td>Granulome schistosomien</td><td>B65.-†</td><td>Espèce et territoire selon les preuves disponibles.</td></tr><tr><td>Tuberculome cérébral</td><td>A17.8†</td><td>Localisation parenchymateuse.</td></tr><tr><td>Tuberculome méningé</td><td>A17.1†</td><td>Localisation méningée distincte de la seule méningite.</td></tr></tbody></table><p>Les libellés français des causes, notamment « Abcès amibien du cerveau », « Tuberculome méningé », « Autres formes de tuberculose du système nerveux » et « Autres infections gonococciques », ont été relus dans le fichier OFS. Ce fichier ne contient pas toutes les notes contextuelles. Le codage final suit la version applicable et les règles locales vérifiées, sans certifier ici une facture 2026.</p><div class="key"><b>À retenir.</b> G07 sans subdivision : documenter la manifestation et la maladie causale, sans convertir les inclusions en une liste fermée de maladies.</div><p>Sources : <button class="w" data-k="g07-r11">[11]</button> · <button class="w" data-k="g07-r12">[12]</button></p></section><section class="ilot" id="g07-epidemio"><h2>Épidémiologie suisse : conserver le bon dénominateur</h2><p>Le bulletin OFSP publié en 2026 rapporte 544 cas de tuberculose en 2025 en Suisse et au Liechtenstein, soit 6,0 pour 100000 habitants. Ces chiffres regroupent toutes les tuberculoses déclarées. Ils ne mesurent ni l’incidence de G07, ni celle du tuberculome cérébral, ni la probabilité d’une cause tuberculeuse chez un patient avec une masse cérébrale.</p><p>Les recherches et lectures réalisées n’établissent pas une incidence ou une prévalence nationale actuelle de toutes les lésions G07, avec répartition complète par âge et sexe. Les séries de tuberculomes et les observations de schistosomiase ou d’amibiase proviennent de populations et de systèmes de soins différents. Leurs proportions ne deviennent pas des statistiques suisses, et les mortalités d’un essai de méningite tuberculeuse ne deviennent pas le pronostic de tout granulome isolé.</p><table class="t"><thead><tr><th>Donnée</th><th>Population</th><th>Limite clinique</th></tr></thead><tbody><tr><td>544 cas ; 6,0/100000</td><td>Tuberculoses déclarées en Suisse et au Liechtenstein en 2025.</td><td>Pas une incidence G07.</td></tr><tr><td>499 personnes analysées dans HARVEST</td><td>Adultes avec méningite tuberculeuse dans trois pays.</td><td>Ni enfants, ni ensemble des tuberculomes isolés.</td></tr><tr><td>Lésions parasitaires rares</td><td>Revues et séries sélectionnées.</td><td>Pas de fréquence nationale suisse déduite.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Nommer maladie, année, territoire et population avant tout chiffre ; garder explicite la lacune suisse propre à G07.</div><p>Sources : <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r4">[4]</button> · <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-causes"><h2>Chercher la cause sans réduire le patient à une exposition</h2><p>Les inclusions de G07 citent les atteintes tuberculeuses, amibiennes, gonococciques et schistosomiennes. Elles appellent des recherches distinctes. Une exposition ou un antécédent augmente une probabilité ; il ne démontre pas la cause d’une lésion nouvelle. Une maladie tumorale ou une autre infection peut coexister, y compris chez un patient déjà traité pour tuberculose.</p><table class="t"><thead><tr><th>Contexte</th><th>Questions orientées</th><th>Conséquence diagnostique</th></tr></thead><tbody><tr><td>Tuberculose</td><td>Contact connu, infection antérieure, traitement et observance, foyer pulmonaire ou extrapulmonaire, immunité.</td><td>Rechercher preuve microbiologique et résistances, avec bilan du système nerveux.</td></tr><tr><td>Amibiase</td><td>Séjour même ancien, signes digestifs, foyer hépatique, transmission possible par contact sexuel.</td><td>Recherche spécifique d’Entamoeba histolytica ; ne pas présumer l’espèce sur un seul examen non discriminant.</td></tr><tr><td>Schistosomiase</td><td>Contact avec de l’eau douce dans une zone de transmission, manifestations urinaires ou digestives, signes médullaires.</td><td>Tests adaptés et évaluation spécialisée de l’atteinte neurologique.</td></tr><tr><td>Infection gonococcique disséminée</td><td>Contexte d’infection sexuellement transmissible, manifestations articulaires ou systémiques, prélèvements antérieurs.</td><td>Ne pas appliquer à une lésion cérébrale la seule durée d’arthrite.</td></tr></tbody></table><p>Le statut VIH, les immunosuppresseurs, une grossesse possible, le rein, le foie et les médicaments modifient le bilan et les possibilités thérapeutiques. Une origine géographique n’est pas une preuve et ne dispense pas d’examiner les diagnostics concurrents. La confidentialité et une formulation non stigmatisante favorisent une anamnèse utilisable.</p><div class="key"><b>À retenir.</b> Relier une exposition précise à un test et à une décision ; garder ouvertes les causes concurrentes jusqu’à un degré de preuve suffisant.</div><p>Sources : <button class="w" data-k="g07-r5">[5]</button> · <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-anamnese"><h2>Reconstruire la chronologie des signes et des traitements</h2><p>Préciser céphalée, vomissements, crise, trouble du langage, faiblesse, trouble sensitif, comportement et vigilance. Distinguer apparition initiale, évolution continue et aggravation après le début du traitement. Si le rachis est concerné, demander faiblesse, niveau sensitif, marche et modification vésicosphinctérienne. Une plainte discrète peut être fonctionnellement importante ; l’entourage peut préciser une modification de comportement ou une perte d’autonomie.</p><p>Noter les dates, doses, interruptions et effets indésirables des médicaments déjà pris. Une aggravation sous antituberculeux peut correspondre à une réaction paradoxale, mais aussi à une mauvaise exposition, une résistance, une autre maladie ou une complication mécanique. La chronologie oriente ; elle ne permet pas de déclarer automatiquement la réaction paradoxale.</p><p><button class="w" data-k="g07-chronologie">Une aggravation sous traitement exige une nouvelle question clinique</button></p><div class="key"><b>À retenir.</b> Conserver l’heure des changements, la liste exacte des produits et les examens antérieurs pour rendre la décision révisable.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-clinique"><h2>Mesurer une fonction avant d’interpréter un signe</h2><p>Évaluer d’abord conscience, respiration, circulation et stabilité. Examiner ensuite attention, langage, nerfs crâniens, force, sensibilité, coordination et marche lorsque cela est sûr. Rechercher une asymétrie, un territoire cohérent et une évolution. Une anomalie localise une fonction perturbée ; elle ne prouve pas l’agent infectieux. Une douleur, une fatigue ou une coopération insuffisante limitent l’interprétation et doivent être notées.</p><p><button class="w" data-k="g07-force">La force musculaire : six grades, une méthode répétable</button></p><p>Une plainte visuelle sous éthambutol ne doit pas être attribuée d’emblée à une lésion cérébrale. La notice Myambutol impose une surveillance de l’acuité, du champ et des couleurs et une action urgente en cas de changement. Réciproquement, une toxicité suspectée ne dispense pas de rechercher une complication infectieuse ou compressive.</p><div class="key"><b>À retenir.</b> Décrire la fonction, la méthode et son changement ; la répétition de l’examen vaut mieux qu’un grade isolé sans contexte.</div><p>Sources : <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button></p></section><section class="ilot" id="g07-urgence"><h2>Effet de masse et ponction lombaire : la sécurité précède le rendement</h2><p>Baisse de vigilance, déficit rapidement progressif, crise persistante ou répétée, signes de compression médullaire et détérioration générale exigent une prise en charge urgente. Une lésion expansive, une hydrocéphalie ou une hypertension intracrânienne peut rendre la ponction lombaire dangereuse. L’imagerie et l’avis spécialisé guident alors la stratégie ; le besoin de documenter une infection ne justifie pas un prélèvement dangereux.</p><p><button class="w" data-k="g07-pl">Pourquoi une ponction lombaire n’est pas systématique</button></p><p>L’absence d’un seuil de diamètre universel n’interdit pas d’agir : localisation, effet mécanique, hydrocéphalie, état clinique et accessibilité du prélèvement comptent. Il ne faut pas attendre une triade complète, une preuve microbiologique finale ou une échéance arbitraire lorsque la fonction se dégrade.</p><div class="key"><b>À retenir.</b> Stabilisation, imagerie et avis urgent en parallèle ; pas de ponction lombaire automatique devant une lésion focale menaçante.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section>

<section class="ilot" id="g07-traitement"><h2>Traitement causal et contrôle mécanique répondent à deux besoins</h2><p>La stratégie associe recherche de la cause, traitement anti-infectieux adapté et contrôle de l’effet de masse lorsque nécessaire. La neurologie, l’infectiologie, la neuroradiologie et la neurochirurgie discutent le besoin de biopsie, de drainage ou de décompression. L’absence d’essai comparatif sur le moment idéal de la chirurgie n’est pas une interdiction de traiter une urgence mécanique.</p><p>Pour la tuberculose, le guide suisse constitue le point de départ, avec adaptation aux résultats microbiologiques, aux résistances, au site et aux organes du patient. Une association fixe n’est pas un calcul automatique pour toute atteinte du système nerveux. Les causes parasitaires ou gonococciques nécessitent une conduite distincte. Aucun mélange empirique de tous les traitements cités dans ce chapitre n’est proposé.</p><p><button class="w" data-k="g07-chirurgie">Quand le tissu ou la décompression devient une question centrale</button></p><div class="key"><b>À retenir.</b> Une molécule traite un agent sensible ; une décompression traite une menace mécanique. Ces décisions peuvent être nécessaires ensemble.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r5">[5]</button> · <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r8">[8]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-tuberculose"><h2>Tuberculome isolé et méningite tuberculeuse : garder les preuves distinctes</h2><p><button class="w" data-k="g07-schema">Deux mois plus dix mois : à quelle situation ce calcul s’applique-t-il ?</button></p><p>Le guide international recommande fortement les corticoïdes dans la méningite tuberculeuse sans VIH ; en présence du VIH, la décision est individualisée. Le calendrier du traitement antirétroviral dans une méningite est une décision spécialisée et ne s’étend pas automatiquement à toute lésion G07 isolée. Dans les lésions expansives, le traitement d’un œdème ou d’une réaction inflammatoire est également individualisé. Aucune dose générale d’ampoule pour œdème n’est présentée comme un schéma adulte universel de méningite.</p><p><button class="w" data-k="g07-harvest">Rifampicine à forte dose : ce que montre réellement HARVEST</button></p><div class="key"><b>À retenir.</b> Douze mois dans le guide suisse pour la méningite tuberculeuse ; durée du tuberculome isolé discutée séparément, sans prolongation fondée sur la seule image.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r14">[14]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-parasites"><h2>Schistosomiase et amibiase : deux mécanismes et deux stratégies</h2><p>La schistosomiase neurologique associe dépôt d’œufs et réaction inflammatoire de l’hôte. Une atteinte cérébrale ou médullaire peut être invalidante et nécessite une prise en charge urgente. La revue européenne décrit l’association de traitement antiparasitaire et de corticoïdes selon la situation, avec des pratiques variables. Un schéma utilisé dans certains centres ne devient pas une dose suisse universelle. Avant un traitement immunosuppresseur, l’équipe évalue notamment le risque de strongyloïdose, sans retarder la prise en charge d’une urgence neurologique.</p><p><button class="w" data-k="g07-schisto-meca">Schistosomiase : ne pas appliquer une ancienne consigne isolée</button></p><p>Dans l’amibiase invasive, le parasite envahit le tissu et peut atteindre un territoire extra-intestinal. Un test de selles positif ne prouve pas que la masse cérébrale a cette cause ; une sérologie peut persister. La revue récente distingue traitement tissulaire et réservoir intestinal, mais renvoie les localisations extra-intestinales autres qu’hépatiques au spécialiste. Les doses de colite ou d’abcès hépatique ne deviennent pas des doses cérébrales.</p><p><button class="w" data-k="g07-amibiase">Traiter le cerveau et discuter le réservoir intestinal séparément</button></p><div class="key"><b>À retenir.</b> Agent, territoire et produit exact déterminent la décision ; une dose intestinale, une pratique étrangère et une FI suisse ne sont pas interchangeables.</div><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r8">[8]</button> · <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r16">[16]</button> · <button class="w" data-k="g07-r17">[17]</button></p></section><section class="ilot" id="g07-gonocoque"><h2>Gonococcie disséminée : ne pas confondre articulation, méninge et abcès</h2><p>Le document britannique 2025 consulté est le guide BASHH, pas un guide IUSTI 2025. Il distingue les tableaux d’infection disséminée et réserve une prise en charge spécialisée. Une durée de sept jours dans une arthrite ne s’applique pas à un abcès cérébral. De même, une durée de méningite ne démontre pas la durée optimale d’une collection cérébrale gonococcique.</p><p>La FI suisse de ceftriaxone précise le produit, les doses générales et les limites liées notamment au rein. Le guide britannique apporte un contexte de syndrome ; il ne remplace pas la notice suisse ni un protocole de centre pour une localisation rare. Documenter l’agent, sa sensibilité, les prélèvements et les autres foyers avant d’adapter le traitement. Le suivi de l’infection sexuellement transmissible est organisé avec l’équipe compétente.</p><div class="key"><b>À retenir.</b> Ne pas appeler « traitement de l’abcès gonococcique » un tableau de doses d’arthrite ou de méningite.</div><p>Sources : <button class="w" data-k="g07-r5">[5]</button> · <button class="w" data-k="g07-r22">[22]</button></p></section><section class="ilot" id="g07-suivi"><h2>Une image persistante n’est pas, à elle seule, un échec</h2><p>Le suivi associe symptômes, examen neurologique répété, observance, tolérance, microbiologie disponible et imagerie discutée selon l’évolution. Une croissance paradoxale ou un rehaussement durable est décrit dans la tuberculose. Avant de retenir cette interprétation, il faut rechercher erreur diagnostique, résistance, mauvaise exposition, interaction et complication mécanique. L’aggravation clinique garde sa valeur d’alarme, quelle que soit l’étiquette donnée à l’image.</p><p><button class="w" data-k="g07-paradoxal">Rehaussement, inflammation et activité bactérienne ne sont pas équivalents</button></p><p>Surveiller toxicités hépatiques, rénales, hématologiques, visuelles et neurologiques selon les produits. Une nouvelle confusion peut être infectieuse, mécanique, métabolique ou médicamenteuse ; la recherche ne se limite pas à une seule hypothèse. Les séquelles fonctionnelles justifient rééducation et réévaluation de l’autonomie, avec une conduite et une activité adaptées à l’état neurologique réel.</p><div class="key"><b>À retenir.</b> Le suivi doit pouvoir expliquer pourquoi poursuivre, modifier, prélever ou arrêter ; ni prolongation indéfinie ni arrêt autonome sur une seule image.</div><p>Sources : <button class="w" data-k="g07-r2">[2]</button> · <button class="w" data-k="g07-r8">[8]</button> · <button class="w" data-k="g07-r9">[9]</button> · <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-suisse"><h2>Prévention et parcours suisse : distinguer information et droit établi</h2><p>La tuberculose relève d’une déclaration médicale et de laboratoire selon les modalités OFSP applicables. Le bulletin 2026 a été lu pour les situations déclarées ; aucun délai chiffré non vérifié n’est ajouté ici. L’enquête d’entourage est coordonnée avec les autorités compétentes. Le risque de transmission dépend notamment des foyers associés : une masse cérébrale ne suffit pas à qualifier seule la contagiosité respiratoire.</p><p>Le guide suisse décrit la prise en charge habituelle des examens et traitements indiqués par l’assurance-maladie, sans dispense générale de participation aux coûts. Une suspicion de maladie professionnelle relève d’une appréciation par l’assureur compétent. La coordination cantonale des investigations d’entourage ne constitue pas une garantie générale de remboursement de tout soin G07. Les règles actuelles de liste des spécialités, de moyens auxiliaires, d’assurance-invalidité et d’aptitude à la conduite n’ont pas été établies exhaustivement par ces lectures et doivent être vérifiées individuellement.</p><p>La prévention suit l’agent : enquête et traitement des infections tuberculeuses selon les recommandations applicables, réduction des expositions à l’eau douce pour la schistosomiase, hygiène et prévention des transmissions de l’amibiase, et parcours d’infection sexuellement transmissible pour la gonococcie. Ces mesures n’effacent pas le besoin de suivre la lésion neurologique et ses séquelles.</p><div class="key"><b>À retenir.</b> Déclaration, contact, coût et aptitude sont des questions distinctes ; nommer l’autorité ou le professionnel qui doit vérifier chacune.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r4">[4]</button> · <button class="w" data-k="g07-r5">[5]</button> · <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-particuliers"><h2>Enfant, grossesse, VIH et organes : aucune extrapolation automatique</h2><p>Les doses adultes ne sont pas des doses pédiatriques. Le guide suisse comporte des tableaux d’enfants distincts ; HARVEST concerne des adultes et exclut grossesse et allaitement. Les notices présentent des restrictions spécifiques : Pyrazinamide Labatec et Humatin contre-indiquent notamment grossesse et allaitement dans les passages lus. Une urgence chez une personne enceinte doit donc être arbitrée par les spécialistes, sans abandon du traitement ni copie d’une recette générale.</p><p>La fonction rénale et le foie modifient choix et exposition. Des produits contenant plusieurs substances peuvent être inadaptés lorsqu’un composant doit être ajusté séparément. L’âge, la fragilité et les autres médicaments renforcent le besoin de surveillance. Le statut VIH modifie certaines décisions de méningite tuberculeuse, notamment corticoïdes et calendrier antirétroviral ; ces règles ne deviennent pas des règles de toutes les lésions isolées.</p><div class="key"><b>À retenir.</b> Toujours retrouver la population, le produit, la version de notice et le territoire neurologique avant de reprendre une dose ou une durée.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r2">[2]</button> · <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r8">[8]</button> · <button class="w" data-k="g07-r9">[9]</button> · <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r17">[17]</button></p></section><section class="ilot" id="g07-criteres"><h2>Critères formels et paramètres clés</h2><div class="alert"><b>Critères formels.</b> Aucun critère diagnostique universel validé de tout G07 n’a été établi dans les lectures. Documenter une lésion intracrânienne ou intrarachidienne compatible, son territoire, sa gravité, la maladie causale et le degré de preuve. Confronter clinique, imagerie, microbiologie et anatomopathologie selon ce qui est accessible et sûr. Les définitions de recherche de méningite tuberculeuse ne s’étendent pas à toutes les masses isolées ; l’image seule et le code ne certifient pas l’agent.</div><div class="key"><b>À retenir.</b> G07 sans subdivision ; six inclusions causales présentées. Dans la méningite tuberculeuse du guide suisse : 2 + 10 = 12 mois. Force musculaire : 0–5, distincte des stades de méningite. Galepharm Amp : 4 mg de phosphate correspondent à 3,32 mg de dexaméthasone base. Les seuils rénaux et les règles de surveillance sont propres à chaque spécialité ; ne pas les fusionner.</div><button class="pareto-btn ui" data-k="pareto-g07-clinique">▲ Loi de Pareto — Les décisions à retenir</button><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r11">[11]</button> · <button class="w" data-k="g07-r12">[12]</button> · <button class="w" data-k="g07-r14">[14]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="g07-e-imagerie"><h2>Imagerie : situer, caractériser et évaluer le risque</h2><p>L’imagerie en résonance magnétique caractérise la localisation, le nombre de lésions, leur contenu, l’œdème et les rapports avec ventricules, méninges ou moelle. Une autre modalité peut être choisie immédiatement selon disponibilité et stabilité. La comparaison avec les images antérieures et l’état clinique compte autant qu’une description isolée. Une lésion annulaire peut correspondre à des organisations et à des causes différentes.</p><p><button class="w" data-k="g07-irm">Pourquoi la diffusion ne fournit pas le nom du germe</button></p><div class="key"><b>À retenir.</b> L’imagerie guide sécurité, différentiel, suivi et accès au tissu ; elle ne remplace pas la preuve étiologique.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-e-preuves"><h2>Prélever pour répondre à une question précise</h2><p>Discuter les prélèvements avec microbiologie et anatomopathologie avant le geste : tissu pour morphologie et matériel pour culture ou tests moléculaires ont des exigences différentes. Des prélèvements hors du système nerveux peuvent établir un foyer causal ou une sensibilité, sans démontrer automatiquement l’origine de toutes les lésions. L’antibiothérapie préalable et la quantité de matériel influencent le rendement.</p><p>Dans une suspicion de méningite tuberculeuse, les tests moléculaires adaptés et la culture sont complémentaires ; un test négatif ne suffit pas à exclure la maladie. L’obtention de liquide céphalorachidien reste soumise à la sécurité. Pour les parasites, les tests sont choisis selon espèce, territoire et exposition. Un test intestinal ou une sérologie persistante n’est pas une preuve autonome d’atteinte cérébrale.</p><p><button class="w" data-k="g07-prelevement">Dire ce que prouve chaque résultat</button></p><div class="key"><b>À retenir.</b> Avant un prélèvement : question, sécurité, laboratoire destinataire et effet attendu sur la décision.</div><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-e-differentiel"><h2>Différentiel : utiliser les discordances plutôt qu’un signe unique</h2><p>Face à une masse annulaire, comparer infection pyogène, tuberculose, autre infection opportuniste selon le terrain, tumeur et autre processus inflammatoire. La recherche porte sur l’évolution, l’immunité, les foyers associés, la diffusion, les autres séquences et les preuves de tissu ou d’agent. Une image ressemblante n’implique pas une durée ou une molécule identique.</p><table class="t"><thead><tr><th>Hypothèse concurrente</th><th>Élément discriminant à rechercher</th><th>Piège</th></tr></thead><tbody><tr><td>Tuberculome et abcès tuberculeux</td><td>Organisation solide ou liquéfiée, preuve de tuberculose et sensibilité.</td><td>Les appeler synonymes sur le seul rehaussement.</td></tr><tr><td>Autre abcès infectieux</td><td>Terrain, foyer, culture et tests adaptés.</td><td>Réutiliser tous les schémas de G06 pour une cause G07 particulière.</td></tr><tr><td>Processus tumoral</td><td>Discordance clinique, évolution et besoin de tissu.</td><td>L’exclure parce qu’un foyer tuberculeux existe ailleurs.</td></tr><tr><td>Réaction paradoxale</td><td>Chronologie et exclusion d’échec, résistance, mauvaise exposition ou autre cause.</td><td>La déclarer avant de vérifier une aggravation neurologique.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Une discordance doit rouvrir le diagnostic, surtout avant une prolongation ou une immunosuppression.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-e-cas"><h2>Quatre cas pour relier les preuves aux décisions</h2><p>Ces situations sont fictives. Elles entraînent des décisions de sécurité et d’interprétation ; elles ne constituent pas des prescriptions individuelles. Les situations PROFILES 2017 associées sont notamment céphalée, parésie, trouble sensitif, crise, déficit aigu et méningisme.</p><div class="quiz ui" id="g07-q1"><p><b>Cas pédagogique fictif 1.</b> Une personne présente une masse cérébrale, un déficit progressif et une baisse de vigilance. Quelle priorité ?</p><button data-ok="0">Réaliser une ponction lombaire avant toute autre démarche.</button><button data-ok="1">Stabiliser, organiser imagerie et avis urgent, puis choisir un prélèvement sûr.</button><p class="fb" hidden>Une masse menaçante peut contre-indiquer la ponction lombaire ; sécurité et traitement urgent ne doivent pas attendre une preuve dangereuse.</p></div><div class="quiz ui" id="g07-q2"><p><b>Cas pédagogique fictif 2.</b> Un tuberculome rehausse encore à l’imagerie, alors que le patient s’améliore. Que conclure ?</p><button data-ok="0">L’image prouve des bacilles vivants et impose une prolongation indéfinie.</button><button data-ok="1">Confronter clinique, traitement, preuves initiales et évolution avant de décider.</button><p class="fb" hidden>Un rehaussement persistant ne mesure pas seul l’activité bactérienne ; la durée du tuberculome isolé reste individualisée.</p></div><div class="quiz ui" id="g07-q3"><p><b>Cas pédagogique fictif 3.</b> Sous éthambutol, une personne signale une baisse des couleurs et de l’acuité. Que faire ?</p><button data-ok="0">Attendre l’imagerie programmée car cela vient nécessairement du granulome.</button><button data-ok="1">Organiser immédiatement l’évaluation et la conduite prévue par la notice pour toxicité possible.</button><p class="fb" hidden>Une toxicité optique peut laisser des séquelles. L’équipe réévalue aussi les autres causes ; le symptôme ne doit pas être banalisé.</p></div><div class="quiz ui" id="g07-q4"><p><b>Cas pédagogique fictif 4.</b> Deux produits antituberculeux ont des seuils rénaux différents. Quelle méthode ?</p><button data-ok="0">Choisir un seuil unique pour toute la classe.</button><button data-ok="1">Vérifier chaque spécialité, ses composants et son contexte avant adaptation.</button><p class="fb" hidden>Rifampicine séparée, pyrazinamide, éthambutol et association fixe ne partagent pas une règle rénale universelle.</p></div><button class="pareto-btn ui" data-k="pareto-g07-examens">▲ Loi de Pareto — Relier chaque test à une décision</button><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r19">[19]</button></p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="g07-tab-semio" role="tab" aria-selected="true" aria-controls="g07-s-semio" data-s="g07-s-semio">Sémiologie fondamentale et analytique</button><button id="g07-tab-anat" role="tab" aria-selected="false" aria-controls="g07-s-anat" data-s="g07-s-anat">Anatomie</button><button id="g07-tab-histo" role="tab" aria-selected="false" aria-controls="g07-s-histo" data-s="g07-s-histo">Histologie</button><button id="g07-tab-physio" role="tab" aria-selected="false" aria-controls="g07-s-physio" data-s="g07-s-physio">Physiologie</button><button id="g07-tab-biochim" role="tab" aria-selected="false" aria-controls="g07-s-biochim" data-s="g07-s-biochim">Biochimie et pharmacologie fondamentale</button><button id="g07-tab-immuno" role="tab" aria-selected="false" aria-controls="g07-s-immuno" data-s="g07-s-immuno">Immunologie</button></div><div class="chap-body sci-body"><div class="sci" id="g07-s-semio" role="tabpanel" aria-labelledby="g07-tab-semio"><section class="ilot" id="g07-s-normal" data-semiology="normal"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><p>La sémiologie relie une fonction normale à une perturbation, puis à un signe observable et à une décision. Normalement, un mouvement demandé peut être exécuté de manière coordonnée, avec une force adaptée, et les deux côtés sont comparables en tenant compte des différences anciennes. Le langage, la vigilance et la sensibilité doivent être évalués dans le contexte du patient. Une difficulté nouvelle doit être décrite avant d’être attribuée à une infection.</p><p>Dans cette leçon, une lésion focale, son œdème ou une compression peut perturber une fonction localisée. L’examen permet de décrire la fonction menacée et son évolution ; l’imagerie précise le territoire. Le signe n’identifie pas l’agent. La référence normale ne doit pas être réduite à l’absence de fièvre ou à une valeur sanguine : c’est aussi un fonctionnement neurologique antérieur documenté.</p><p>Sources : <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button> · <button class="w" data-k="g07-r20">[20]</button> · <button class="w" data-k="g07-r21">[21]</button></p></section><section class="ilot" id="g07-s-signs" data-semiology="signs"><h3>Reconnaître et décrire les signes élémentaires</h3><p>Une parésie est une diminution de force, à localiser et à grader. Une crise traduit une perturbation électrique clinique à prendre en charge selon sa gravité, sans prouver la cause de la lésion. Une baisse de vigilance modifie la sécurité de l’ensemble de la démarche. Céphalée et vomissements doivent être interprétés avec l’examen et l’imagerie ; isolés, ils ne démontrent ni granulome ni hypertension intracrânienne.</p><p>Un niveau sensitif, une modification de marche ou une dysfonction sphinctérienne oriente vers un territoire médullaire ou radiculaire à explorer. Demander ce que la personne ne peut plus faire précise le retentissement. Noter côté, distribution, intensité, début et évolution évite le terme vague « neurologique » qui ne permet pas de comparer les examens.</p><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button></p></section><section class="ilot" id="g07-s-mechanisms" data-semiology="mechanisms"><h3>Relier la lésion au signe sans raccourci étiologique</h3><p>Une inflammation organisée, une collection et l’œdème périphérique peuvent altérer une voie ou exercer un effet mécanique. Le signe dépend alors du territoire fonctionnel atteint, du volume et de la vitesse d’évolution. Une réaction inflammatoire peut aussi participer à une aggravation sous traitement, sans que cela prouve à elle seule la persistance de bacilles vivants.</p><p>Une lésion tuberculeuse solide et un abcès liquéfié n’ont pas toujours le même comportement en imagerie. La chaîne utile est : mécanisme plausible, fonction perturbée, signe constaté, examen de confirmation puis décision. Elle ne doit pas sauter directement de « faiblesse » à « tuberculose » ou de « rehaussement » à « antibiotique plus long ».</p><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-s-examination" data-semiology="examination"><h3>Faire un examen comparable dans le temps</h3><p>Tester conscience et langage, puis nerfs crâniens, force, sensibilité et coordination selon le tableau. Pour la force, isoler le mouvement et éviter les compensations ; documenter le grade 0 à 5 avec le muscle ou le territoire. Comparer les côtés et les contrôles successifs dans des conditions aussi proches que possible. Une douleur ou une coopération limitée doit être signalée, plutôt que convertie en déficit certain.</p><p>Vérifier la marche uniquement si cela est sûr. Rechercher les symptômes sphinctériens lorsque le territoire rachidien est possible. Sous éthambutol, l’évaluation visuelle est aussi une surveillance médicamenteuse : une anomalie nouvelle appelle une réévaluation urgente. La surveillance répétée recherche un changement qui peut modifier l’urgence avant même le contrôle radiologique prévu.</p><p>Sources : <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button></p></section><section class="ilot" id="g07-s-interpretation" data-semiology="interpretation"><h3>Interpréter en croisant clinique, image et preuve</h3><p>Un déficit cohérent localise une fonction ; il ne différencie pas seul infection et tumeur. Une sérologie positive peut documenter une exposition ou une infection selon le test, sans démontrer l’origine d’une masse. Une culture ou un test moléculaire négatif peut manquer une infection, particulièrement lorsque le prélèvement ou le prétraitement limite le rendement.</p><p>L’interprétation doit préciser ce qui est établi, probable ou encore discuté. Une discordance entre amélioration clinique et image persistante demande une lecture spécialisée de la trajectoire. Une aggravation clinique ne doit pas être rassurée par un test antérieur négatif ni par une hypothèse de réaction paradoxale non vérifiée.</p><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-s-differentials" data-semiology="differentials"><h3>Distinguer une autre maladie et une toxicité</h3><p>Une autre infection, un processus tumoral et une réaction inflammatoire figurent dans le différentiel d’une masse. Le terrain, les foyers associés, la morphologie et le tissu orientent. Une preuve de tuberculose ailleurs n’exclut pas une deuxième cause cérébrale. Le besoin de biopsie se rediscute lorsque l’évolution ne correspond pas au diagnostic initial.</p><p>Une toxicité médicamenteuse peut imiter une complication : atteinte visuelle sous éthambutol, ataxie ou confusion sous métronidazole. Examiner le traitement et la fonction d’organe en parallèle de l’infection. Une étiquette de toxicité ne doit pas faire oublier un nouvel effet de masse, et l’inverse expose à poursuivre un produit nocif.</p><p>Sources : <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-s-urgency" data-semiology="urgency"><h3>Reconnaître le signe qui change immédiatement la conduite</h3><p>Une baisse de vigilance, une crise persistante ou répétée, une faiblesse rapidement progressive ou des signes de compression médullaire exigent stabilisation et évaluation urgente. Imagerie, traitement et avis spécialisé sont organisés en parallèle selon la situation. L’urgence se fonde sur la fonction menacée et l’évolution, sans seuil universel de diamètre.</p><p>Une suspicion d’effet de masse impose de vérifier la sécurité avant toute ponction lombaire. Le souhait de confirmer un agent ne justifie pas de prendre un risque d’engagement. Lorsque le patient est gravement malade, la stratégie de prélèvement et le traitement doivent être arbitrés rapidement avec les spécialistes.</p><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-s-limits" data-semiology="limits"><h3>Conserver les limites de l’examen et des données</h3><p>Douleur, sédation, crise récente, fatigue et coopération peuvent limiter l’examen. Documenter ces conditions permet de ne pas attribuer un changement de mesure à une progression certaine. Une mesure répétée est plus informative si la méthode et les conditions sont explicites.</p><p>Les sources ne donnent pas une sensibilité ou une spécificité universelle de chaque signe pour tout G07. Les données de méningite tuberculeuse, d’adulte ou de série étrangère ne sont pas extrapolées aux enfants ou à toutes les masses isolées. L’absence de statistique nationale spécifique et l’incertitude de durée restent visibles.</p><p>Sources : <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button></p></section><section class="ilot" id="g07-s-sources" data-semiology="sources"><h3>Sources de la sémiologie et portée de leur lecture</h3><p>La description de la force repose sur le manuel du Medical Research Council ; le raisonnement sur les lésions expansives et la sécurité de la ponction sur les passages réellement lus du guide de méningite tuberculeuse et de la revue de Marais. Les originaux Gray montrent une anatomie normale historique. Les fenêtres détaillent populations et limites ; une image ancienne ne sert pas de carte opératoire.</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6996525/" target="_blank" rel="noopener noreferrer">Marais et coll. : lésions expansives tuberculeuses intracrâniennes</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12419961/" target="_blank" rel="noopener noreferrer">Guide international de méningite tuberculeuse</a></p><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button> · <button class="w" data-k="g07-r20">[20]</button> · <button class="w" data-k="g07-r21">[21]</button></p></section><figure id="g07-science-links-semio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g07-diag-semio"><title id="g07-diag-semio">Fonction habituelle puis Signe nouveau puis Décision adaptée</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Fonction habituelle</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Signe nouveau</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Décision adaptée</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Fonction vers signe</td><td>La lésion et son environnement peuvent perturber une fonction ; décrire le territoire sans nommer d’emblée l’agent.</td></tr><tr><td>Signe vers décision</td><td>Une aggravation change la sécurité et l’urgence ; clinique, imagerie et preuves sont confrontées.</td></tr></tbody></table></figure><p><b>Science → clinique.</b> Le signe décrit une fonction menacée, sans donner le nom de l’agent.</p><p><b>Science → examen.</b> La même méthode d’examen permet de repérer un changement et de le confronter à l’imagerie.</p><p><b>Science → traitement.</b> La gravité peut imposer d’agir avant la preuve finale, avec des prélèvements sûrs.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision, en conservant les limites des sources.</div></div><div class="sci" id="g07-s-anat" role="tabpanel" aria-labelledby="g07-tab-anat" hidden><section class="ilot" id="g07-s-anat-body"><h2>Enveloppes, parenchyme et voies : localiser ce que l’on observe</h2><p>Les enveloppes méningées et le parenchyme sont des territoires différents. L’original Gray 1196 permet d’identifier dure-mère, arachnoïde et pie-mère, ainsi qu’un rapport avec le sinus sagittal supérieur. Le tuberculome méningé et le tuberculome cérébral sont distingués dans les inclusions de classification. Une figure normale éclaire le vocabulaire de localisation ; elle ne démontre pas le compartiment réel d’une lésion du patient.</p><figure><img src="assets/img/g07/alpha/codex/Gray1196.png" alt="Enveloppes méningées normales et sinus sagittal supérieur" loading="lazy"><figcaption>Enveloppes méningées normales et sinus sagittal supérieur. Gray, <i>Anatomy of the Human Body</i>, 1918, illustrations attribuées à Henry Vandyke Carter ; domaine public. Original humain historique, pixels inchangés, repères français dans le tableau adjacent.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée clinique</th></tr></thead><tbody><tr><td>Dura mater</td><td>Dure-mère : enveloppe identifiée dans l’original ; une lésion méningée se décrit par rapport à ces plans.</td></tr><tr><td>Arachnoid</td><td>Arachnoïde : repère distinct de la dure-mère et de la pie-mère.</td></tr><tr><td>Pia mater</td><td>Pie-mère : enveloppe au contact de la surface cérébrale dans cette coupe.</td></tr><tr><td>Superior sagittal sinus</td><td>Sinus sagittal supérieur : rapport veineux de la figure, sans cartographie opératoire individuelle.</td></tr></tbody></table></figure><p>L’original Gray 764 montre la continuité de voies motrices depuis les régions corticales vers des trajets plus profonds, avec une décussation et des voies descendantes. Il aide à comprendre pourquoi le côté du déficit et le niveau de la lésion ne s’interprètent pas sans tenir compte du trajet. Une même plainte de faiblesse peut résulter de territoires différents ; l’examen et l’imagerie localisent chez le patient réel.</p><figure><img src="assets/img/g07/alpha/codex/Gray764.png" alt="Voies motrices normales, représentation historique" loading="lazy"><figcaption>Voies motrices normales, représentation historique. Gray, <i>Anatomy of the Human Body</i>, 1918, illustrations attribuées à Henry Vandyke Carter ; domaine public. Original humain historique, pixels inchangés, repères français dans le tableau adjacent.</figcaption><table class="t"><thead><tr><th>Repère de l’original</th><th>Annotation française et portée clinique</th></tr></thead><tbody><tr><td>Motor area of cortex</td><td>Région motrice du cortex : point de départ représenté de voies descendantes.</td></tr><tr><td>Internal capsule</td><td>Capsule interne : passage profond représenté ; la localisation précise du patient demande son imagerie.</td></tr><tr><td>Decussation of pyramids</td><td>Décussation des pyramides : croisement de fibres figuré dans l’original.</td></tr><tr><td>Lateral cerebrospinal fasciculus</td><td>Faisceau descendant latéral : ancien libellé anglais conservé dans les pixels ; relation fonctionnelle à confronter au territoire clinique.</td></tr></tbody></table></figure><p>L’atteinte peut provenir de la lésion elle-même, de son œdème ou d’un effet mécanique. La taille seule ne décrit pas le risque ; les rapports avec structures voisines, ventricules et voies fonctionnelles comptent. Le cerveau et la moelle n’offrent pas les mêmes conditions d’expansion et d’accès au prélèvement. La figure historique ne fournit ni seuil de compression ni voie chirurgicale.</p><p>Ces deux images sont des originaux humains historiques, pas des anatomies produites par IA. Les repères français sont adjacents et les pixels restent inchangés. Leur usage pédagogique se limite au normal, avec la source et le statut de droits explicités ; aucune certification médicale humaine de cette version du cours n’est revendiquée.</p><figure id="g07-science-links-anat"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g07-diag-anat"><title id="g07-diag-anat">Territoire normal puis Atteinte localisée puis Fonction à tester</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Territoire normal</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Atteinte localisée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Fonction à tester</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Territoire vers atteinte</td><td>La localisation méningée ou parenchymateuse doit être décrite sur l’imagerie réelle, pas déduite de l’original ancien.</td></tr><tr><td>Atteinte vers examen</td><td>L’examen recherche la fonction et son changement ; le côté et le niveau doivent rester cohérents.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> L’anatomie permet de formuler une question de localisation ; l’imagerie et l’examen du patient répondent à cette question.</div><p>Sources : <button class="w" data-k="g07-r12">[12]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button> · <button class="w" data-k="g07-r20">[20]</button> · <button class="w" data-k="g07-r21">[21]</button></p></section><p><b>Science → clinique.</b> Le territoire et les rapports expliquent la distribution possible d’un déficit.</p><p><b>Science → examen.</b> Les images normales servent au vocabulaire ; l’imagerie du patient localise réellement.</p><p><b>Science → traitement.</b> Le compartiment et l’effet de masse orientent prélèvement ou décompression, sans choisir seuls la molécule.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision, en conservant les limites des sources.</div></div><div class="sci" id="g07-s-histo" role="tabpanel" aria-labelledby="g07-tab-histo" hidden><section class="ilot" id="g07-s-histo-body"><h2>Organisation inflammatoire : comprendre ce que montre le tissu</h2><p>La revue des lésions tuberculeuses décrit un tuberculome comme une organisation inflammatoire, avec histiocytes épithélioïdes, cellules géantes multinucléées et lymphocytes, parfois autour d’une caséation. Une réaction astrocytaire et un tissu périphérique peuvent accompagner l’ensemble. Ces termes décrivent une architecture ; ils ne donnent pas seuls une preuve d’espèce ou de sensibilité aux médicaments.</p><p>Un abcès tuberculeux est différent : la cavité contient du pus et des bacilles, et sa paroi ne présente pas nécessairement la même organisation granulomateuse. Une lésion solide et une lésion liquéfiée peuvent donc produire des aspects différents en imagerie. La présence d’une capsule ne signifie ni stérilité ni stabilité. La corrélation entre tissu, image et clinique doit être explicite.</p><p>Dans la schistosomiase, les œufs et la réaction de l’hôte participent aux lésions neurologiques. Le problème n’est donc pas seulement la présence d’un parasite, mais aussi la réponse inflammatoire dans un territoire fonctionnel. Dans l’amibiase, l’invasion tissulaire se distingue du réservoir intestinal. Un agent agissant essentiellement dans l’intestin ne remplace pas le traitement du tissu atteint.</p><table class="t"><thead><tr><th>Observation</th><th>Question à poser au laboratoire</th><th>Limite</th></tr></thead><tbody><tr><td>Granulome ou caséation</td><td>Quels éléments morphologiques et quelles recherches d’agent sont disponibles ?</td><td>L’organisation ne suffit pas seule à nommer l’agent.</td></tr><tr><td>Contenu purulent</td><td>Quelles cultures et recherches moléculaires sur matériel adapté ?</td><td>Le pus ne signifie pas toujours la même bactérie ou le même traitement.</td></tr><tr><td>Matériel peu abondant</td><td>Comment répartir pour morphologie et microbiologie ?</td><td>Les conditions d’envoi et de conservation doivent être anticipées.</td></tr></tbody></table><p>Préparer le prélèvement en amont évite qu’une seule analyse épuise le matériel ou qu’un conditionnement empêche une autre recherche. Les méthodes sont choisies avec les équipes de laboratoire. Une biopsie n’est pas exigée automatiquement dans tous les cas ; son bénéfice dépend notamment de l’incertitude diagnostique, du risque, de l’accès au tissu et de la possibilité de modifier la prise en charge.</p><figure id="g07-science-links-histo"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g07-diag-histo"><title id="g07-diag-histo">Tissu organisé puis Preuves confrontées puis Traitement causal</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Tissu organisé</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Preuves confrontées</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Traitement causal</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Tissu vers preuves</td><td>Morphologie, culture et tests moléculaires apportent des informations complémentaires ; la sécurité du prélèvement reste première.</td></tr><tr><td>Preuves vers traitement</td><td>Le choix causal intègre agent et sensibilité ; un granulome seul ne justifie pas une immunosuppression.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Décrire l’organisation, chercher la cause et anticiper les analyses ; une histologie évocatrice reste à confronter aux autres preuves.</div><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><p><b>Science → clinique.</b> Collection et granulome ne sont pas la même organisation tissulaire.</p><p><b>Science → examen.</b> Morphologie, culture et tests moléculaires répondent à des questions complémentaires.</p><p><b>Science → traitement.</b> La cause et la sensibilité orientent le traitement ; le mot granulome ne suffit pas.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision, en conservant les limites des sources.</div></div><div class="sci" id="g07-s-physio" role="tabpanel" aria-labelledby="g07-tab-physio" hidden><section class="ilot" id="g07-s-physio-body"><h2>Inflammation, volume et fonction : pourquoi l’état peut changer</h2><p>Une fonction neurologique habituelle suppose une activité tissulaire et des voies capables de transmettre l’information. Dans une lésion focale, la collection ou l’inflammation peut altérer localement cette fonction et s’accompagner d’œdème ou de compression. Le signe clinique dépend du territoire et de la dynamique, pas uniquement d’une mesure de diamètre. Une petite variation dans un emplacement critique peut changer la décision.</p><p>L’effet de masse et l’hydrocéphalie expliquent pourquoi une démarche de prélèvement habituellement utile peut devenir dangereuse. La ponction lombaire ne se décide pas sur le seul besoin de liquide : il faut vérifier le risque lié à la lésion et à l’état clinique. Le guide de méningite tuberculeuse recommande une stratégie sûre et rapide ; une contre-indication à la ponction ne doit pas suspendre toute recherche ni le traitement urgent.</p><p>Au cours du traitement d’une lésion tuberculeuse, la réponse inflammatoire peut évoluer indépendamment de la quantité de microorganismes vivants. Une aggravation paradoxale est possible, mais elle n’est retenue qu’après réévaluation des alternatives. La barrière vasculaire et le rehaussement peuvent rester modifiés longtemps ; l’image ne constitue pas une mesure directe de viabilité bactérienne.</p><table class="t"><thead><tr><th>Mécanisme</th><th>Signe ou examen</th><th>Décision raisonnée</th></tr></thead><tbody><tr><td>Volume, œdème ou compression</td><td>Déficit, vigilance, rapports et complications en imagerie.</td><td>Évaluer urgence et possibilité de décompression.</td></tr><tr><td>Inflammation sous traitement</td><td>Changement clinique et radiologique comparé à la trajectoire antérieure.</td><td>Vérifier preuve, observance, interactions et résistances avant de conclure.</td></tr><tr><td>Rehaussement persistant</td><td>Image confrontée à l’amélioration ou aggravation clinique.</td><td>Ne pas imposer seul poursuite indéfinie ou arrêt autonome.</td></tr></tbody></table><p>La surveillance relie donc une mesure répétable à une question concrète : la fonction s’améliore-t-elle, une menace mécanique apparaît-elle, et le traitement reste-t-il crédible et toléré ? Cette démarche évite de demander à un seul marqueur de résumer une maladie complexe. Les sources ne donnent pas de seuil universel d’imagerie ou de biomarqueur validant la fin de traitement de tout tuberculome isolé.</p><figure id="g07-science-links-physio"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g07-diag-physio"><title id="g07-diag-physio">Inflammation focale puis Fonction perturbée puis Réévaluation urgente</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Inflammation focale</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Fonction perturbée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Réévaluation urgente</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Inflammation vers fonction</td><td>Lésion, œdème et effet mécanique peuvent expliquer un signe, sans identifier seuls l’agent.</td></tr><tr><td>Fonction vers décision</td><td>Une dégradation change l’urgence ; l’image et les preuves sont réévaluées en parallèle.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Une hypothèse physiopathologique explique un signe ; elle ne dispense pas de vérifier la cause, la gravité et les effets du traitement.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button></p></section><p><b>Science → clinique.</b> Œdème et compression peuvent expliquer une dégradation fonctionnelle.</p><p><b>Science → examen.</b> Un changement d’examen peut imposer une nouvelle imagerie et une stratégie de prélèvement différente.</p><p><b>Science → traitement.</b> La sécurité et l’urgence se décident sur l’état réel, sans attendre un seuil de taille universel.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision, en conservant les limites des sources.</div></div><div class="sci" id="g07-s-biochim" role="tabpanel" aria-labelledby="g07-tab-biochim" hidden><section class="ilot" id="g07-s-biochim-body"><h2>Cible microbienne et exposition humaine : deux niveaux à distinguer</h2><p>La rifampicine agit sur la synthèse de l’acide ribonucléique bactérien en inhibant une polymérase. L’isoniazide agit notamment sur des constituants de la paroi mycobactérienne selon la notice de l’association. Le pyrazinamide a une activité liée au milieu acide ; son mécanisme n’est pas entièrement résolu dans les passages de FI. Un mécanisme plausible ne prouve ni la sensibilité de l’espèce ni une exposition suffisante au site de lésion.</p><p>Les notices d’éthambutol consultées ne donnent pas des formulations moléculaires concordantes ; le cours ne choisit pas de mémoire une cible unique pour effacer cette divergence. Il conserve les faits utiles vérifiés : substance du produit, adaptation rénale et risque optique. Pour les médicaments, reconnaître une incertitude évite une explication séduisante mais non étayée.</p><p>La rifampicine induit des enzymes et des transporteurs humains. Une concentration d’un médicament associé peut diminuer, avec perte d’effet ; l’arrêt peut ensuite modifier cette exposition dans l’autre sens. La revue des interactions est donc nécessaire au début, pendant et à l’arrêt. L’interaction entre rifampicine et praziquantel est particulièrement importante lorsqu’on discute deux causes infectieuses possibles.</p><p>Le métronidazole est activé dans les microorganismes sensibles ; des produits réactifs altèrent leur matériel génétique. La présence d’Entamoeba histolytica dans le spectre ne définit pas une dose ou une durée d’infection cérébrale. La paromomycine orale est peu absorbée et agit principalement dans la lumière intestinale. Son mécanisme ne transforme pas cette spécialité en traitement de tissu cérébral.</p><table class="t"><thead><tr><th>Niveau</th><th>Question utile</th><th>Exemple</th></tr></thead><tbody><tr><td>Cible microbienne</td><td>L’agent est-il sensible et la preuve pertinente ?</td><td>Ne pas présumer une résistance nulle dans toutes les mycobactéries.</td></tr><tr><td>Exposition humaine</td><td>Produit, organes et interactions permettent-ils l’exposition voulue ?</td><td>Rifampicine et médicaments associés à revoir ensemble.</td></tr><tr><td>Unité de dose</td><td>La masse exprime-t-elle sel, ester ou substance active ?</td><td>Phosphate de dexaméthasone et sulfate de paromomycine ne se lisent pas comme masses de base identiques.</td></tr></tbody></table><figure id="g07-science-links-biochim"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g07-diag-biochim"><title id="g07-diag-biochim">Cible sensible puis Exposition adaptée puis Effet et surveillance</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Cible sensible</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Exposition adaptée</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Effet et surveillance</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Cible vers exposition</td><td>La pharmacologie ne suffit pas sans produit, voie, population et interactions vérifiés.</td></tr><tr><td>Exposition vers effet</td><td>Réponse et toxicités sont suivies ; augmenter une dose n’est pas une garantie de bénéfice, comme le montre HARVEST dans sa population.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Une bonne explication moléculaire reste incomplète sans espèce, exposition, unité et surveillance du patient.</div><p>Sources : <button class="w" data-k="g07-r2">[2]</button> · <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r8">[8]</button> · <button class="w" data-k="g07-r9">[9]</button> · <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r14">[14]</button> · <button class="w" data-k="g07-r17">[17]</button></p></section><p><b>Science → clinique.</b> Une exposition excessive ou insuffisante peut modifier réponse et toxicité.</p><p><b>Science → examen.</b> Fonction d’organe, composition et interactions sont vérifiées avec le produit exact.</p><p><b>Science → traitement.</b> La cible microbienne ne dispense pas d’un schéma adapté ni d’une surveillance.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision, en conservant les limites des sources.</div></div><div class="sci" id="g07-s-immuno" role="tabpanel" aria-labelledby="g07-tab-immuno" hidden><section class="ilot" id="g07-s-immuno-body"><h2>La réponse de l’hôte protège et peut aussi léser</h2><p>La réponse inflammatoire participe au contrôle d’un agent et à l’organisation du granulome. Dans le système nerveux, cette réponse peut également contribuer à l’œdème et à la perte de fonction. La revue des lésions tuberculeuses décrit ce double rôle et discute plusieurs voies de l’hôte. Il ne suffit pas de nommer un médiateur pour démontrer qu’un traitement ciblé améliore toutes les formes cliniques.</p><p>Les corticoïdes modifient la transcription cellulaire par leurs récepteurs et ont des effets anti-inflammatoires et immunosuppresseurs. Leur bénéfice dépend du syndrome et de la population. Le guide international recommande fortement les corticoïdes pour la méningite tuberculeuse sans VIH ; la décision est individualisée en présence du VIH. Ce niveau de preuve ne s’applique pas automatiquement à chaque masse isolée ou à chaque parasite.</p><p>Une réaction paradoxale sous traitement souligne que l’évolution inflammatoire et la présence d’agent vivant ne sont pas parfaitement superposables. Mais attribuer trop vite une aggravation à l’immunité expose à manquer résistance, mauvaise exposition, diagnostic concurrent ou complication mécanique. L’augmentation d’une immunosuppression se décide après une réévaluation clinique et infectiologique, en tenant compte des risques.</p><p>Dans la neuroschistosomiase, la réaction aux œufs contribue aux lésions et explique l’intérêt discuté des corticoïdes avec le traitement antiparasitaire. La revue signale le risque de strongyloïdose lorsque l’on immunosupprime : le terrain et les expositions doivent être évalués. Une ancienne règle d’interaction isolée ne doit pas conduire à arrêter automatiquement un corticoïde nécessaire au contrôle d’une atteinte neurologique.</p><table class="t"><thead><tr><th>Situation</th><th>Ce que la source permet</th><th>Limite</th></tr></thead><tbody><tr><td>Méningite tuberculeuse sans VIH</td><td>Recommandation forte de corticoïdes dans le guide.</td><td>Dose de notice générale non transformée en protocole universel.</td></tr><tr><td>Méningite avec VIH</td><td>Décision individualisée.</td><td>Pas de transposition automatique d’un résultat sans VIH.</td></tr><tr><td>Masse ou granulome parasitaire</td><td>Discussion spécialisée selon inflammation et risque.</td><td>Ni biologiques ni durée de corticoïdes universels ajoutés de mémoire.</td></tr></tbody></table><figure id="g07-science-links-immuno"><svg width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="g07-diag-immuno"><title id="g07-diag-immuno">Réponse de l’hôte puis Contrôle et lésions puis Bénéfice à évaluer</title><rect x="10" y="10" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="53" text-anchor="middle" font-size="26">Réponse de l’hôte</text><path d="M 210 80 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="130" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="173" text-anchor="middle" font-size="26">Contrôle et lésions</text><path d="M 210 200 v 50 m -7 -10 l 7 10 l 7 -10" fill="none" stroke="#38684b"/><rect x="10" y="250" width="400" height="70" rx="8" fill="#edf6ef" stroke="#38684b"/><text x="210" y="293" text-anchor="middle" font-size="26">Bénéfice à évaluer</text></svg><figcaption>Schéma conceptuel non anatomique. Les flèches représentent les relations expliquées dans le texte et le tableau, avec leurs limites.</figcaption><table class="t"><thead><tr><th>Relation</th><th>Interprétation clinique</th></tr></thead><tbody><tr><td>Réponse vers conséquences</td><td>La réaction peut aider au contrôle et participer au dommage ; les deux dimensions sont confrontées à la clinique.</td></tr><tr><td>Conséquences vers traitement</td><td>La décision anti-inflammatoire dépend du syndrome et des preuves, avec risque infectieux et surveillance.</td></tr></tbody></table></figure><div class="key"><b>À retenir.</b> Le bénéfice d’un anti-inflammatoire se démontre dans une situation précise ; le mécanisme seul ne suffit pas à prescrire.</div><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r14">[14]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><p><b>Science → clinique.</b> La réponse de l’hôte peut contribuer au contrôle comme au dommage.</p><p><b>Science → examen.</b> Une aggravation impose de confronter inflammation, agent et complication mécanique.</p><p><b>Science → traitement.</b> Le bénéfice des corticoïdes reste lié au syndrome et à la population étudiés.</p><div class="key"><b>À retenir.</b> Relier le normal, la perturbation, le signe, l’examen et la décision, en conservant les limites des sources.</div><button class="pareto-btn ui" data-k="pareto-g07-sci">▲ Loi de Pareto — Du normal à la décision</button></div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="g07-p-principes"><h2>Une prescription garde sa source, son produit et son territoire</h2><p>Les informations suivantes expliquent les choix et les pièges de lecture ; elles ne constituent pas un schéma commun à toutes les lésions G07. Pour chaque ordonnance, préciser agent probable ou confirmé, site, produit exact, voie, dose de chaque substance, intervalle, durée prévue et surveillance. Les recommandations cliniques et la notice du produit répondent à des questions complémentaires et leurs écarts doivent rester visibles.</p><p>Avant de traiter, vérifier allergies, grossesse ou allaitement, fonction rénale et hépatique, médicaments associés et possibilité de surveillance. Une association fixe peut être inadaptée si un composant doit être ajusté séparément. L’absence de dose cérébrale spécifique dans une FI ne permet ni d’inventer cette dose ni d’affirmer qu’aucune prise en charge spécialisée n’est possible.</p><div class="key"><b>À retenir.</b> Toujours pouvoir retrouver la phrase source, la population et la formulation du produit derrière un chiffre.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r2">[2]</button> · <button class="w" data-k="g07-r8">[8]</button> · <button class="w" data-k="g07-r9">[9]</button> · <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r14">[14]</button> · <button class="w" data-k="g07-r17">[17]</button> · <button class="w" data-k="g07-r22">[22]</button></p></section><section class="ilot" id="g07-p-antitb"><h2>Antituberculeux : le schéma suisse et les limites de l’association fixe</h2><p>Le guide suisse donne les doses quotidiennes adultes du tableau ci-dessous. Ce sont des repères de traitement antituberculeux ; le système nerveux central, les résistances et les organes peuvent nécessiter une stratégie spécialisée. La méningite tuberculeuse reçoit une durée spécifique ; le tuberculome isolé ne se réduit pas à un compteur de comprimés.</p><table class="t"><thead><tr><th>Substance</th><th>Repère adulte du guide suisse</th><th>Vérification complémentaire</th></tr></thead><tbody><tr><td>Isoniazide</td><td>5 mg/kg/j ; plage 4–6.</td><td>Association, contexte, foie et interactions ; pas de monothérapie.</td></tr><tr><td>Rifampicine</td><td>10 mg/kg/j ; plage 8–12.</td><td>FI du produit séparé, interactions et association fixe distinctes.</td></tr><tr><td>Pyrazinamide</td><td>25 mg/kg/j ; plage 20–30.</td><td>Rein, foie, grossesse et contre-indications de la spécialité.</td></tr><tr><td>Éthambutol</td><td>15 mg/kg/j ; plage 15–20.</td><td>Unité de substance, fonction rénale et examen visuel.</td></tr></tbody></table><p><button class="w" data-k="g07-rimstar">Rimstar : quatre substances, quatre possibilités de limite</button></p><p>La pyridoxine est discutée dans le guide ; aucune dose non vérifiée n’est ajoutée ici. Ni une forte dose empirique de rifampicine, ni le maintien automatique de tous les composants pendant douze mois ne découlent de la présentation de l’association fixe.</p><div class="key"><b>À retenir.</b> Distinguer phases, composants, produit et forme clinique ; une association fixe ne supprime pas le raisonnement individuel.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r8">[8]</button> · <button class="w" data-k="g07-r9">[9]</button> · <button class="w" data-k="g07-r10">[10]</button></p></section><section class="ilot" id="g07-p-rifampicine"><h2>Rifampicine : l’interaction se vérifie aussi à l’arrêt</h2><p><button class="w" data-k="g07-rifampicine">Rifampicin Labatec : dose générale et précautions propres au produit</button></p><div class="key"><b>À retenir.</b> Revoir les interactions au début, lors de toute modification et à l’arrêt, avec le produit et les autres médicaments exacts.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r2">[2]</button> · <button class="w" data-k="g07-r3">[3]</button></p></section><section class="ilot" id="g07-p-pyrazinamide"><h2>Pyrazinamide : ne pas effacer une contre-indication par un autre paragraphe</h2><p><button class="w" data-k="g07-pyrazinamide">Pyrazinamide Labatec : dose, rein et foie</button></p><div class="key"><b>À retenir.</b> Une divergence interne de notice ou entre produits se signale et se résout avec les spécialistes ; elle ne se répare pas par un seuil inventé.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r9">[9]</button></p></section><section class="ilot" id="g07-p-ethambutol"><h2>Éthambutol : protéger la vision et suivre le rein</h2><p><button class="w" data-k="g07-ethambutol">Myambutol : la plainte visuelle exige une action</button></p><div class="key"><b>À retenir.</b> Nouvelle baisse d’acuité ou des couleurs sous éthambutol : agir immédiatement et réévaluer aussi les autres causes.</div><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r10">[10]</button></p></section><section class="ilot" id="g07-p-metro"><h2>Métronidazole : activité tissulaire et durée cérébrale sont deux questions</h2><p><button class="w" data-k="g07-m-metro">Metronidazole SINT i.v. : lire le produit et la limite de son indication</button></p><div class="key"><b>À retenir.</b> Ne pas convertir une dose d’infection anaérobie, une dose digestive étrangère et une durée cérébrale en une ordonnance unique.</div><p>Sources : <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-p-humatin"><h2>Humatin : la restriction de la notice reste visible</h2><p><button class="w" data-k="g07-humatin">Paromomycine intestinale : substance, territoire et restriction</button></p><div class="key"><b>À retenir.</b> Ne
