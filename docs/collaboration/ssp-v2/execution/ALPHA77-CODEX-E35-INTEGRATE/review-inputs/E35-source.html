.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">[S19] Information professionnelle suisse Rocephin ceftriaxone IV/IM</a> — Juin 2025. Formulation, indication, posologie, contre-indications, adaptations ; précautions/interactions et grossesse ciblées. Limites : La dose de prophylaxie 125/250 mgIM <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> n’est pas celle d’une infection invasive, ni indication propre énumérée par cette FI ; protocole hospitalier et sourceSSI datés séparés.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">[S20] Information professionnelle suisse Rimactan rifampicine gélules 150/300 mg</a> — Octobre 2023. Formulation, indication, posologie, contre-indications, adaptations ; précautions/interactions et grossesse ciblées. Limites : Bornes de poids exactes FI ne définissent pas le cas 60 kg ; OFSPprésente 10 mg/kg max 600≥1 mois. Pas rifampicine seule pour TB ; forme adaptée jeune enfant, pas gélule imposée.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">[S21] Information professionnelle suisse Ciproxine comprimés/suspension orale, pas Ciproxin HC otique</a> — Août 2025. Formulation, indication, posologie, contre-indications, adaptations ; précautions/interactions et grossesse ciblées. Limites : Divergence réelle : OFSPautorise toutes molécules citées pendant allaitement, FIcipro interdit ; ne pas fusionner. Swisspeddose ajoutée au bas de page n’est pas le texte FI. <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">HC</a> otique homonyme exclu.</li><li><a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">[S22] SSI Guidelines Meningitis : Swiss Addendum</a> — PDFcréé/modifié 28 décembre 2017. Deux pages, traitement empirique et contraintes PL ; ceftriaxone, corticothérapie. Limites : Addendum ancien, pas version dynamique 2026 établie. Source découverte dans dossier G03 en lecture seule ; texte effectivement téléchargé et lu par nous, aucune reprise de validation étrangère.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">[S23] The adrenal glands</a> — 2 e, version servie 2026. Anatomie/cortex/zones, hormones et rétrocontrôle. Limites : Manuel américain de normal uniquement ; raccourcis ACTH/aldostérone et tumeur hypophysaire sécrétant cortisol non adoptés, confrontés à source suisse. Licence de figure historique propre 2013, pas déduite du site actuel.</li><li><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S24] PROFILES 2017</a> — 2017. p 22 EPA6.4–6.9 et 6 a–6 k ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">SSP</a> 88 et 214 repérés, nouvelle lecture ciblée. Limites : Rapprochement pédagogique, pas mapping officiel CIM-E35 ni question fédérale garantie.</li><li><a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">[S25] The thyroid gland</a> — 2 e, version servie 2026. Anatomie, follicule/colloïde, hormones iodées et rétrocontrôle. Limites : Manuel américain, pas fondation de conduite clinique. Pas reprise des généralités étiologiques sur hyperthyroïdie ou des détails simplificateurs de transport membranaire ; TH évité car homonyme du glossaire.</li></ul><p>Audit différé — auto-relecture par intelligence artificielle, distincte d’une validation médicale humaine. Sources intégrales en cache externe ; texte public par paraphrases, références et limites.</p>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="e35-e-1"><h2><span class="n">e-1</span>Choisir l’examen qui change la décision</h2><table class="t" data-e35-table="1"><thead><tr><th>Question</th><th>Examen orienté</th><th>Limite</th></tr></thead><tbody><tr><td>Une crise impose-t-elle de traiter ?</td><td>Clinique, circulation, conscience, glycémie et ionogramme.</td><td>Le traitement ne dépend pas d’une anomalie obligatoire du potassium ou d’une imagerie.</td></tr><tr><td>Quelle réserve après stabilisation ?</td><td>Cortisol et signal corticotrope dans conditions connues, puis stimulation si indiquée.</td><td>Heure, méthode, protéines de transport et traitement reçu modifient le résultat.</td></tr><tr><td>Atteinte glandulaire, hémorragie ou masse ?</td><td>Imagerie surrénalienne selon contexte.</td><td>Une image n’identifie pas seule le germe ni toute perte de réserve.</td></tr><tr><td>Quelle cause thyroïdienne ?</td><td>Échographie, prélèvement pertinent et microbiologie.</td><td>Image et granulomes ne sont pas spécifiques du complexe tuberculeux.</td></tr></tbody></table>
<p>Si le patient est instable, les prélèvements utiles peuvent précéder la première dose seulement s’ils ne retardent pas les soins. Documenter ensuite la dose, la voie et l’heure de l’hydrocortisone : un dosage postérieur n’est pas un résultat basal non traité [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> La question précède le test. La réanimation et le traitement causal ne sont pas suspendus pour obtenir une valeur parfaite [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-e-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-e-2"><h2><span class="n">e-2</span>Cortisol et ionogramme : contexte et méthode</h2><p>Le cortisol matinal est interprété avec l’état clinique et la méthode. Les repères 150/300 nmol/L du guide britannique s’adressent aux personnes d’au moins un an avec immunodosages modernes, dans la démarche diagnostique prévue. Chez le nourrisson de moins d’un an, le guide demande une interprétation pédiatrique spécifique ; en urgence, on n’attend pas le lendemain matin [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p>
<p>Une hormone adrénocorticotrope élevée face à un cortisol insuffisant oriente une atteinte primaire ; un signal bas ou inadapté peut être central ou iatrogène. Le déficit minéralocorticoïde est exploré par rénine, aldostérone et électrolytes. Les seuils et conditions du laboratoire comptent ; potassium normal et absence de pigmentation restent possibles en aigu [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>Les œstrogènes oraux et les protéines porteuses modifient le cortisol total. Le guide britannique prévoit, pour un test électif, des mesures particulières après certains traitements ; cela ne justifie pas de retarder une prise en charge urgente. Une réponse stimulée se lit avec le seuil propre à l’essai, pas avec une valeur copiée sans contexte [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> Le résultat doit garder son heure, sa méthode et l’exposition médicamenteuse. Aucun seuil stable ne neutralise un tableau de crise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-e-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-e-3"><h2><span class="n">e-3</span>Imagerie, tissus et microbiologie</h2><p>Le scanner ou la résonance magnétique peuvent montrer hémorragie, nécrose, infiltration ou calcifications. Une calcification peut persister après une maladie ancienne et n’est pas une preuve d’infection active. Une masse hémorragique sous-jacente peut nécessiter une évaluation endocrine et oncologique spécialisée, souvent après stabilisation [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p>La recherche d’un germe exige un prélèvement adapté au site et à la question : culture, amplification ciblée, examen histologique et recherche de résistances selon le contexte. Les résultats sont confrontés à l’exposition et à l’imagerie, sans transformer l’absence de lésion pulmonaire en exclusion d’une atteinte thyroïdienne [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<p>La revue de 33 cas de tuberculose thyroïdienne avec abcès comporte des diagnostics parfois fondés sur histologie ou coloration de bacilles seuls. Leurs résultats n’ont pas tous le même niveau de confirmation. Cela explique pourquoi « granulomes compatibles » et « identification du complexe tuberculeux avec sensibilité » ne sont pas deux conclusions identiques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Le prélèvement doit prouver ce que l’on cherche. La morphologie, l’espèce et la sensibilité thérapeutique sont trois informations différentes [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-e-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-e-4"><h2><span class="n">e-4</span>Quatre exercices de raisonnement</h2><div class="quiz ui"><p><b>Cas fictif 1.</b> Une personne fébrile est en choc, avec vomissements et suspicion de crise surrénalienne. Quelle conduite ?</p>
<button data-ok="1">Prélèvements si cela ne retarde pas les soins, hydrocortisone parentérale, soutien circulatoire et traitement de la cause en parallèle.</button><button data-ok="0">Attendre le test de stimulation pour éviter de perturber les dosages.</button><p class="fb" hidden>La crise est urgente et clinique ; les tests peuvent être complétés après stabilisation. Aucun examen ne doit retarder le remplacement nécessaire [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 2.</b> Un nouveau-né est suspect de crise. Peut-on recopier 100 mg du protocole adulte ?</p>
<button data-ok="1">Non ; utiliser le protocole pédiatrique adapté à l’âge corrigé/poids et à l’état, sans additionner les options.</button><button data-ok="0">Oui ; 100 mg est une dose uniforme pour tous les âges et toutes les formulations.</button><p class="fb" hidden>Le protocole britannique propose des options pédiatriques d’âge ou de poids, distinctes de l’adulte. La mention FI 25 mg/j n’est pas un bolus universel [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 3.</b> Une masse thyroïdienne est présente avec fonction hormonale normale. Que conclure ?</p>
<button data-ok="1">La fonction conservée n’exclut ni infection ni tumeur ; caractériser la masse et orienter les prélèvements.</button><button data-ok="0">La fonction normale exclut toute tuberculose thyroïdienne.</button><p class="fb" hidden>La sécrétion et l’étiologie d’une masse sont deux questions distinctes ; l’imagerie et les prélèvements gardent leur place [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
</div><div class="quiz ui"><p><b>Cas fictif 4.</b> Une prophylaxie méningococcique est nécessaire chez une personne allaitante. Les sources divergent pour ciprofloxacine. Que faire ?</p>
<button data-ok="1">Confronter directive OFSP et FI du produit, choisir une option adaptée et documenter la décision sans abandonner la prophylaxie indiquée.</button><button data-ok="0">Présenter toutes les molécules de la directive comme autorisées sans réserve dans chaque FI.</button><p class="fb" hidden>Le document <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025 permet les molécules citées pendant allaitement, mais la FI <button class="w" data-k="e35-ciprofloxacine">Ciproxine</button> conserve une interdiction. Les textes et la population doivent rester distincts ; le prescripteur adapte le choix [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
</div><div class="key"><b>À retenir.</b> Urgence, population, fonction et statut d’un produit sont quatre questions qui ne se remplacent pas [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-e-4">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="e35-tab-semio" role="tab" aria-controls="e35-s-semio" data-s="e35-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button id="e35-tab-anat" role="tab" aria-controls="e35-s-anat" data-s="e35-s-anat" aria-selected="false">Anatomie</button><button id="e35-tab-histo" role="tab" aria-controls="e35-s-histo" data-s="e35-s-histo" aria-selected="false">Histologie</button><button id="e35-tab-physio" role="tab" aria-controls="e35-s-physio" data-s="e35-s-physio" aria-selected="false">Physiologie</button><button id="e35-tab-bioch" role="tab" aria-controls="e35-s-bioch" data-s="e35-s-bioch" aria-selected="false">Biochimie</button><button id="e35-tab-gene" role="tab" aria-controls="e35-s-gene" data-s="e35-s-gene" aria-selected="false">Génétique et immunologie</button></div><div class="chap-body sci-body"><div class="sci" role="tabpanel" aria-labelledby="e35-tab-semio" id="e35-s-semio"><section class="ilot" id="e35-s-semio-cours"><h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3><div class="key"><p><b>Science → clinique.</b> Reconnaître les signes de gravité avant d’exiger un résultat confirmatoire. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>]</p>
<p><b>Science → examen.</b> Prélever si cela ne retarde pas les soins ; compléter après stabilisation. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>]</p>
<p><b>Science → traitement.</b> Traiter le déclencheur et le déficit nécessaire en parallèle. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>]</p>
<p><b>À retenir.</b> La fonction, la cause et la gravité sont confrontées, sans se remplacer.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Signe et gravité</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mécanisme et prélèvement utile</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Soins puis confirmation</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement de raisonnement sans anatomie ni score individuel [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</figcaption></figure>
<section class="ilot" id="e35-semio-normal" data-semiology="normal"><h3>Normal : fonction et réserve</h3><p>Le cortex surrénalien produit cortisol, minéralocorticoïdes et précurseurs androgéniques ; la médulla est un autre compartiment. La thyroïde sécrète des hormones iodées depuis une architecture folliculaire. Une fonction suffisante au repos ne décrit pas toujours la réponse nécessaire lors d’une maladie aiguë. Organe visible, fonction hormonale et réserve sont trois dimensions [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
</section>
<section class="ilot" id="e35-semio-signs" data-semiology="signs"><h3>Signes et symptômes</h3><p>Fatigue, amaigrissement, nausées, douleur abdominale et hypotension sont peu spécifiques. Une pigmentation et une envie de sel peuvent accompagner une insuffisance primaire chronique, mais manquer en aigu. Fièvre, purpura, altération de conscience ou dégradation circulatoire changent l’urgence. Une masse cervicale peut rester indolore et la fonction thyroïdienne peut être conservée [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
</section>
<section class="ilot" id="e35-semio-mechanisms" data-semiology="mechanisms"><h3>Du mécanisme au signe</h3><p>Le manque de cortisol compromet la réponse au stress et favorise vasoplégie et déséquilibre métabolique. La perte d’aldostérone peut ajouter une perte sodée et une déplétion ; un déficit central ne touche pas toujours cette régulation. Infection et hémorragie peuvent léser les glandes, tandis qu’une infection peut aussi simplement déclencher une crise sur déficit antérieur. La distinction choisit les examens et le suivi [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
</section>
<section class="ilot" id="e35-semio-examination" data-semiology="examination"><h3>Examen expliqué</h3><p>Décrire conscience, perfusion, respiration, pression, pouls, température et déshydratation. Rechercher purpura et signes infectieux, abdomen douloureux, pigmentation chronique et symptômes orthostatiques si l’état permet cet examen. Au cou, décrire masse, adénopathies, voix et déglutition. La dégradation clinique impose action sans attendre un examen complet électif [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
</section>
<section class="ilot" id="e35-semio-interpretation" data-semiology="interpretation"><h3>Interprétation contextualisée</h3><p>Aucun signe isolé ne confirme toute crise ou son étiologie. Potassium normal, absence de pigmentation ou de fièvre ne suffisent pas à exclure une atteinte aiguë. Les valeurs de cortisol gardent heure, méthode et traitement. Une image bilatérale augmente la vigilance mais ne quantifie pas à elle seule la réserve ; fonction thyroïdienne normale n’exclut pas masse infectieuse [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
</section>
<section class="ilot" id="e35-semio-differentials" data-semiology="differentials"><h3>Différentiels utiles</h3><p>Choc septique, hypovolémie, défaillance endocrine et autres urgences peuvent se superposer. Les déficits centraux, médicamenteux, auto-immuns ou congénitaux ne sont pas automatiquement E35. Une masse thyroïdienne confronte infection, inflammation et tumeur. Un prélèvement granulomateux doit être corrélé à la microbiologie et au contexte, pas seulement à une réputation de rareté [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
</section>
<section class="ilot" id="e35-semio-urgency" data-semiology="urgency"><h3>Urgence et orientation</h3><p>Instabilité circulatoire, trouble de conscience, hypoglycémie, vomissements empêchant la prise orale, purpura ou gêne respiratoire commandent une évaluation urgente. Hydrocortisone si crise suspectée, soutien circulatoire et traitement infectieux indiqué se font en parallèle. Les doses d’adulte, de nouveau-né et de contact sain ne s’échangent pas ; les prélèvements ne doivent pas retarder les soins [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
</section>
<section class="ilot" id="e35-semio-limits" data-semiology="limits"><h3>Limites et relation de soin</h3><p>La clinique déclenche l’action, mais ne prouve pas toujours l’agent ni le niveau de la lésion. Les tests sont complétés après stabilisation, avec limites du prélèvement et de la méthode. Expliquer le plan de suivi et entraîner réellement au kit d’urgence sont nécessaires ; un texte appris ne garantit pas son application. Aucun score E35 universel ou certification clinique n’est revendiqué [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
</section>
<section class="ilot" id="e35-semio-sources" data-semiology="sources"><h3>Sources, populations et portée</h3><p>Sources suisses de classification, pédiatrie, médicament, infection invasive et tuberculose sont confrontées aux guides européens et aux synthèses. Les protocoles britanniques, l’addendum suisse 2017 et les FI datées ne sont pas fusionnés en une règle nouvelle. Les cas ou séries sélectionnés ne deviennent pas des risques suisses ; liens ci-dessous vers les sources effectivement lues [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
</section>
</section>
</div><div class="sci" role="tabpanel" aria-labelledby="e35-tab-anat" id="e35-s-anat" hidden><div class="key"><p><b>Science → clinique.</b> La localisation et les compartiments expliquent symptômes et réserve. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>]</p>
<p><b>Science → examen.</b> L’imagerie précise l’atteinte et la glande opposée. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>]</p>
<p><b>Science → traitement.</b> Le choix d’un geste dépend du saignement, de la stabilité et de la cause. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>]</p>
<p><b>À retenir.</b> La fonction, la cause et la gravité sont confrontées, sans se remplacer.</p>
</div><section class="ilot" id="e35-s-anat-cours"><h2><span class="n">s-anat-cours</span>Anatomie : un organe, deux compartiments</h2><p>Les surrénales se situent au-dessus des reins et comportent une capsule, un cortex périphérique et une médulla centrale. Leur position explique qu’une lésion puisse se manifester par douleur abdominale, lombaire ou du flanc, tout en restant non palpable à l’examen habituel. L’imagerie précise le siège, l’étendue et les rapports quand l’état le permet [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>La vascularisation est riche et le drainage veineux est organisé autour d’une veine principale. Les mécanismes de congestion, thrombose et hémorragie dans certaines situations de stress ou de coagulation rendent la glande vulnérable ; cette explication physiopathologique ne signifie pas que toute glande très vascularisée saigne ou que tout hématome soit septique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<figure id="e35-anat-figure"><div data-e35-frame="anat"><img src="assets/img/e35/alpha/codex/adrenal-openstax2013.jpg" alt="Original humain : surrénale au-dessus du rein, coupe corticale et médullaire, micrographie et régions fonctionnelles ; planche normale." width="1102" height="316"><span data-e35-marker="1" data-e35-pin="1">1</span><span data-e35-marker="1" data-e35-pin="2">2</span><span data-e35-marker="1" data-e35-pin="3">3</span><span data-e35-marker="1" data-e35-pin="4">4</span></div><figcaption>Original humain OpenStax College, Connexions, 19 juin 2013 ; micrographie University of Michigan Medical School ©2012. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1818_The_Adrenal_Glands.jpg" target="_blank" rel="noopener">Figure historique 1818</a>, <a data-reference-source="1" href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">Creative Commons Attribution 3.0</a>. Pixels inchangés ; repères français superposés : 1 surrénale au-dessus du rein ; 2 cortex périphérique et médulla centrale dans la coupe ; 3 micrographie ; 4 régions corticales et médullaire indiquées par la planche. Même original utilisé dans anatomie et histologie, pas deux originaux différents. Image normale, pas lésion infectieuse ou hémorragique. Grossissement optique d’origine 204 ×, pas mesure d’écran ; coloration non précisée dans la notice lue. Labels anglais complétés par légende française, essentielle sur petit écran [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</figcaption></figure>
<p>Le cortex et la médulla sont distincts par développement, organisation et hormones. Une insuffisance corticale ne se confond donc pas avec une absence de toute activité médullaire. La perte corticale bilatérale expose davantage au déficit qu’une lésion unilatérale avec glande opposée fonctionnelle ; une atteinte controlatérale discrète ou une maladie préexistante peut toutefois modifier cette règle pratique [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>La planche humaine normale donne les compartiments, pas un diagnostic individuel d’hémorragie, d’infection ou de réserve. Les repères français complètent les labels originaux et ne dessinent aucune nouvelle anatomie. Les rapports vasculaires détaillés ne sont pas représentés comme s’ils étaient mesurés sur la micrographie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>La thyroïde est un autre organe : elle siège devant la trachée, sous le larynx, avec deux lobes reliés par un isthme. Une masse cervicale et des adénopathies se localisent par examen et échographie ; une extension ou une compression modifie la prise en charge. La topographie thyroïdienne ne détermine pas seule si la cause est tuberculeuse, pyogène ou tumorale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<div class="key"><b>À retenir.</b> Topographie, vascularisation et compartiments expliquent les questions de l’examen. La planche normale ne démontre pas la maladie du patient [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-s-anat-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e35-tab-histo" id="e35-s-histo" hidden><div class="key"><p><b>Science → clinique.</b> Une fonction conservée n’exclut pas une lésion focale. [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>]</p>
<p><b>Science → examen.</b> Tissu, culture et amplification apportent des preuves différentes. [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>]</p>
<p><b>Science → traitement.</b> Éviter une chirurgie automatique sans question diagnostique ou thérapeutique. [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>]</p>
<p><b>À retenir.</b> La fonction, la cause et la gravité sont confrontées, sans se remplacer.</p>
</div><section class="ilot" id="e35-s-histo-cours"><h2><span class="n">s-histo-cours</span>Histologie : du compartiment normal à la lésion</h2><p>Le cortex surrénalien est organisé en régions glomérulée, fasciculée et réticulée, associées à des productions stéroïdiennes différentes. La médulla contient des cellules neuroendocrines produisant des catécholamines. Cette organisation explique qu’un dosage de cortisol, un profil minéralocorticoïde et une recherche de sécrétion médullaire ne répondent pas à la même question [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>La micrographie incluse dans l’original montre une structure normale. Le grossissement optique annoncé par la source n’est pas un grossissement d’écran ni une calibration permettant de mesurer des cellules depuis cette page. La légende repère la coupe et ses régions ; aucune lésion tuberculeuse, nécrose ou hémorragie n’y est inventée [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<figure id="e35-histo-figure"><div data-e35-frame="histo"><img src="assets/img/e35/alpha/codex/adrenal-openstax2013.jpg" alt="Original humain : surrénale au-dessus du rein, coupe corticale et médullaire, micrographie et régions fonctionnelles ; planche normale." width="1102" height="316"><span data-e35-marker="1" data-e35-pin="1">1</span><span data-e35-marker="1" data-e35-pin="2">2</span><span data-e35-marker="1" data-e35-pin="3">3</span><span data-e35-marker="1" data-e35-pin="4">4</span></div><figcaption>Original humain OpenStax College, Connexions, 19 juin 2013 ; micrographie University of Michigan Medical School ©2012. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:1818_The_Adrenal_Glands.jpg" target="_blank" rel="noopener">Figure historique 1818</a>, <a data-reference-source="1" href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">Creative Commons Attribution 3.0</a>. Pixels inchangés ; repères français superposés : 1 surrénale au-dessus du rein ; 2 cortex périphérique et médulla centrale dans la coupe ; 3 micrographie ; 4 régions corticales et médullaire indiquées par la planche. Même original utilisé dans anatomie et histologie, pas deux originaux différents. Image normale, pas lésion infectieuse ou hémorragique. Grossissement optique d’origine 204 ×, pas mesure d’écran ; coloration non précisée dans la notice lue. Labels anglais complétés par légende française, essentielle sur petit écran [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</figcaption></figure>
<p>Dans une infection granulomateuse, l’architecture peut être remplacée par inflammation et nécrose. Des granulomes et une nécrose caséeuse sont compatibles avec certaines infections, mais leur présence ne remplace pas la recherche du microorganisme et de sa sensibilité. Une coloration de bacilles acido-alcoolo-résistants ne distingue pas à elle seule toutes les espèces mycobactériennes [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p>La thyroïde normale comporte des follicules épithéliaux entourant un colloïde riche en thyroglobuline. Une maladie locale peut perturber ce tissu sans abolir immédiatement toute sécrétion hormonale. Une masse avec fonction conservée mérite donc encore une caractérisation ; la biologie normale n’est pas une biopsie négative [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<p>La représentativité du prélèvement est centrale. Une aspiration pauvre, une région nécrotique ou une zone non atteinte peut ne pas répondre à la question. Les cas publiés de tuberculose thyroïdienne n’ont pas tous une confirmation au même niveau : histologie, coloration, culture et amplification moléculaire apportent des preuves différentes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<p>Enfin, une lésion hémorragique peut masquer un processus sous-jacent. Le compte rendu, les images et le contexte sont confrontés avant de conclure à une simple conséquence infectieuse. Cette démarche peut conduire à surveillance ou à prélèvement/traitement spécialisé, sans chirurgie automatique de toute glande anormale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<div class="key"><b>À retenir.</b> L’architecture, le site prélevé et la preuve microbiologique se complètent. Une image normale pédagogique ne classifie pas une lésion réelle [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-s-histo-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e35-tab-physio" id="e35-s-physio" hidden><div class="key"><p><b>Science → clinique.</b> Une réserve insuffisante peut se révéler seulement lors du stress. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → examen.</b> Le niveau de l’atteinte guide les mesures complémentaires. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>]</p>
<p><b>Science → traitement.</b> Stress glucocorticoïde et remplacement minéralocorticoïde ont des règles distinctes. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>]</p>
<p><b>À retenir.</b> La fonction, la cause et la gravité sont confrontées, sans se remplacer.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Réserve et besoin de stress</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Cortisol et circulation</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Remplacement selon le contexte</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement de raisonnement sans anatomie ni score individuel [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>].</figcaption></figure>
<section class="ilot" id="e35-s-physio-cours"><h2><span class="n">s-physio-cours</span>Physiologie : réserve et réponse au stress</h2><p>L’hypothalamus, l’hypophyse et le cortex surrénalien forment un axe de régulation. Le signal hypothalamique stimule la sécrétion hypophysaire de l’hormone adrénocorticotrope, qui stimule la production corticale de cortisol. Celui-ci exerce un rétrocontrôle. Une insuffisance peut donc venir de la glande, du signal central ou d’une suppression après exposition médicamenteuse [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>Le cortisol contribue à mobiliser les substrats énergétiques et à maintenir une réponse appropriée au stress. Le manque peut se manifester par faiblesse, hypoglycémie, intolérance à une maladie intercurrente et défaillance circulatoire. Ces signes ne sont pas spécifiques, et une infection peut produire des symptômes semblables ; les deux mécanismes peuvent s’ajouter au lieu de s’exclure [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>].</p>
<p>L’aldostérone répond surtout au système rénine-angiotensine et au potassium. Elle favorise la conservation sodée et l’excrétion potassique. Une atteinte primaire peut donc produire un déficit glucocorticoïde et minéralocorticoïde, tandis qu’un déficit central conserve généralement la seconde régulation. Une hyponatrémie isolée ne suffit pas à identifier le niveau de la lésion [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>À doses de stress, l’hydrocortisone a aussi une activité minéralocorticoïde. Cela explique pourquoi le plan de crise n’ajoute pas automatiquement un triplement de fludrocortisone. Le retour au remplacement chronique et son ajustement sont guidés par état clinique, pression et électrolytes, pas par une règle de multiplication appliquée à toutes les hormones [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p>La réserve peut être insuffisante seulement lorsque les besoins augmentent. Vomissements, mauvaise absorption ou augmentation de clairance par un médicament peuvent aggraver le déficit même sans nouvelle destruction anatomique. Distinguer ces mécanismes aide à traiter le déclencheur et à prévenir la prochaine crise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>La physiologie thyroïdienne illustre une autre séparation : la production d’hormones peut rester suffisante malgré une lésion focale infectieuse. Fonction et nature de la masse restent deux questions. Dans les deux glandes, un chiffre normal à un moment ne remplace pas l’évolution et la question clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<div class="key"><b>À retenir.</b> Le besoin augmente pendant le stress, mais les hormones n’ont pas toutes la même régulation ni le même ajustement [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-s-physio-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e35-tab-bioch" id="e35-s-bioch" hidden><div class="key"><p><b>Science → clinique.</b> Un résultat dépend de son heure, de son traitement et de sa méthode. [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>]</p>
<p><b>Science → examen.</b> L’identité du germe ne se lit pas sur le cortisol. [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>]</p>
<p><b>Science → traitement.</b> Interactions et absorption modifient le remplacement sans dose universelle nouvelle. [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>]</p>
<p><b>À retenir.</b> La fonction, la cause et la gravité sont confrontées, sans se remplacer.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Signal et conditions</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Mesure contextualisée</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Décision et réévaluation</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement de raisonnement sans anatomie ni score individuel [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</figcaption></figure>
<section class="ilot" id="e35-s-bioch-cours"><h2><span class="n">s-bioch-cours</span>Biochimie : mesurer le bon signal</h2><p>Le cortisol circulant, son signal hypophysaire et les paramètres minéralocorticoïdes représentent des étages différents. Un cortisol insuffisant avec un signal corticotrope élevé oriente la glande ; un signal bas ou inadapté peut orienter le centre ou une suppression médicamenteuse. Le prélèvement et sa méthode restent indispensables à l’interprétation [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>].</p>
<p>Le cortisol total dépend notamment des protéines de transport. Les œstrogènes oraux peuvent l’augmenter sans que la même variation reflète une modification identique de réserve. Le guide britannique prévoit des conditions particulières pour un bilan électif ; dans une urgence, ces interférences sont documentées sans retarder le traitement. Un résultat post-hydrocortisone n’est pas une valeur basale intacte [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>Les seuils de stimulation varient entre méthodes ; les anciens repères ne se transportent pas automatiquement à tous les essais modernes. Les valeurs matinales 150/300 nmol/L du guide britannique sont des repères dans un parcours et une population, pas un test universel à toute heure ni en choc. Chez le nourrisson, une lecture spécialisée est requise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>Les interactions changent aussi la quantité de médicament disponible. La rifampicine induit des voies métaboliques et peut réduire l’exposition à l’hydrocortisone ; sa mise en route ou son arrêt demande réévaluation, sans facteur multiplicatif unique déduit de cette propriété. Une mauvaise absorption digestive produit un autre mécanisme de sous-remplacement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p>Dans la thyroïde, l’iodure et les résidus tyrosine de la thyroglobuline participent à la synthèse des hormones iodées dans l’architecture folliculaire. Une infection peut toucher la structure sans abolir immédiatement la sécrétion. Les hormones circulantes ne sont donc pas une identification microbiologique du germe [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<p>Enfin, la microbiologie mesure encore autre chose : amplification ciblée, culture et sensibilité répondent à identité et résistance. Une histologie compatible n’est pas une analyse génétique du pathogène, et la détection d’une infection ne quantifie pas à elle seule la réserve endocrine. La décision réunit ces informations [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Résultat hormonal, exposition au médicament et preuve du germe ont des objets différents ; l’un ne remplace pas les autres [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-s-bioch-cours">Essentiel de cette partie</button></section>
</div><div class="sci" role="tabpanel" aria-labelledby="e35-tab-gene" id="e35-s-gene" hidden><div class="key"><p><b>Science → clinique.</b> Une infection peut révéler une cause congénitale ou un terrain sans être cette cause. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>]</p>
<p><b>Science → examen.</b> Distinguer analyses de l’hôte et recherches sur le microorganisme. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>]</p>
<p><b>Science → traitement.</b> Remplacement vital, anti-infectieux et immunosuppression ne sont pas interchangeables. [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>]</p>
<p><b>À retenir.</b> La fonction, la cause et la gravité sont confrontées, sans se remplacer.</p>
</div><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Hôte et agent distincts</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Preuve ciblée</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Traitement et prévention adaptés</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Enchaînement de raisonnement sans anatomie ni score individuel [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</figcaption></figure>
<section class="ilot" id="e35-s-gene-cours"><h2><span class="n">s-gene-cours</span>Génétique et immunologie : hôte, pathogène et terrain</h2><p>Les anomalies endocriniennes acquises dans une infection ne sont pas toutes des maladies génétiques de l’hôte. Chez l’enfant, une anomalie congénitale peut être révélée par une infection sans que l’infection ait créé le déficit enzymatique. La revue suisse rappelle de nombreuses causes héréditaires de déficit primaire ou central ; elles servent ici de différentiels et ne sont pas reclassées automatiquement E35 [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>].</p>
<p>Un déficit de l’hôte peut modifier le risque infectieux. Le document suisse sur le méningocoque mentionne notamment asplénie et anomalies du complément, tout en rappelant que des formes graves surviennent chez des personnes auparavant saines. Cette association ne justifie pas un test génétique universel de chaque patient ni une conclusion héréditaire à partir d’un seul épisode septique [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p>Le terrain immunitaire intervient aussi dans les infections granulomateuses. Immunosuppression, maladie sous-jacente, sites atteints et exposition orientent les recherches. La présence d’une masse thyroïdienne sans signes pulmonaires ne suffit pas à conclure que l’hôte est immunodéficient ; la revue d’abcès thyroïdiens comportait de nombreux patients sans immunodépression rapportée [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p>Il faut distinguer génétique de l’hôte et analyse du microorganisme. Une amplification peut identifier le complexe tuberculeux et rechercher des résistances selon la méthode ; ce résultat n’est pas un diagnostic constitutionnel du patient. La culture et l’antibiogramme complètent la stratégie, et les performances dépendent de la qualité du prélèvement [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p>Les glucocorticoïdes ont des effets immunologiques dont l’intensité dépend de l’exposition. Remplacement indispensable et traitement immunosuppresseur prolongé ne sont pas une même indication, même si le produit a le même nom. Une infection sévère nécessite traitement étiologique et surveillance ; la crainte de l’immunosuppression ne doit pas retarder un remplacement vital dans une crise suspectée [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p>Enfin, les observations d’autopsie et les associations de cas sont différentes d’une mesure prospective du risque. Des agents variés peuvent accompagner le tableau de <button class="w" data-k="e35-waterhouse">Waterhouse-Friderichsen</button> ; le mécanisme et l’identification doivent rester documentés. Aucun variant unique ni signature immunitaire ne sont inventés pour toute la catégorie E35 [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> Hôte, agent et médicament influencent le tableau par des mécanismes différents ; une infection révélatrice n’est pas forcément la cause initiale du déficit [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-s-gene-cours">Essentiel de cette partie</button></section>
</div></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="e35-p-1"><h2><span class="n">p-1</span>Hydrocortisone d’urgence : voie et population</h2><p><button class="w" data-k="e35-hydrocortisone">Solu-Cortef</button> est une poudre et un solvant pour injection/perfusion. Les présentations <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">Act-O-Vial</a> 100 mg et 250 mg ont chacune 2 ml de solvant, avec quantités différentes de principe actif. La voie intrathécale, réservée à des indications particulières, n’est pas une voie de crise ; l’épidurale est contre-indiquée. L’urgence privilégie la voie intraveineuse et la technique exacte de la FI [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
