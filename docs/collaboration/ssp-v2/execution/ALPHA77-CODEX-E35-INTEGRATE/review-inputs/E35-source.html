<template id="ch-E35"><div class="chap"><style>[data-e35-table="1"]{font-size:inherit!important;display:block;max-width:100%;overflow-x:auto}[data-e35-table="1"] th,[data-e35-table="1"] td{font-size:inherit!important;min-width:9em}[data-e35-frame]{position:relative}[data-e35-frame] img{display:block;max-width:100%;height:auto}[data-e35-marker]{position:absolute;background:#123d4e;color:white;border:2px solid white;border-radius:50%;padding:1px 4px;font-weight:bold;font-size:clamp(8px,1vw,12px);line-height:1.2}[data-e35-pin="1"]{left:9%;top:40%}[data-e35-pin="2"]{left:14%;top:57%}[data-e35-pin="3"]{left:39%;top:30%}[data-e35-pin="4"]{left:56%;top:58%}</style><div class="chap-head"><div class="code">E35* · <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.0</a>*, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.1</a>*, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.8</a>* · Endocrinologie et métabolisme</div><h1>Anomalies endocriniennes au cours de maladies classées ailleurs</h1><span class="status">Relecture Sol du 2 novembre 2026 · Sources suisses et européennes · Auto-relecture, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e35-1">Deux mécanismes à traiter ensemble</a></li><li><a href="#e35-2">Définition et double codage</a></li><li><a href="#e35-3">Épidémiologie : ne pas mesurer la mauvaise maladie</a></li><li><a href="#e35-4">Du fonctionnement normal à la défaillance</a></li><li><a href="#e35-5">Mécanismes, causes et diagnostics voisins</a></li><li><a href="#e35-6">Anamnèse : chronologie, traitements et absorption</a></li><li><a href="#e35-7">Examen clinique et sémiologie</a></li><li><a href="#e35-8">Urgence : agir sans attendre la preuve</a></li><li><a href="#e35-9">Diagnostic : confirmer la fonction et la cause</a></li><li><a href="#e35-10">Prise en charge selon la situation</a></li><li><a href="#e35-11">Contacts, prophylaxie et santé publique suisse</a></li><li><a href="#e35-12">Suivi, pronostic et prévention des crises</a></li><li><a href="#e35-13">Populations particulières et choix du produit</a></li><li><a href="#e35-14">Critères et pièges de raisonnement</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e35-1"><h2><span class="n">1</span>Deux mécanismes à traiter ensemble</h2><p>Un homme fictif de vingt ans présente fièvre, vomissements, purpura et choc. Une femme fictive de quarante-deux ans, traitée pour une tuberculose surrénalienne, devient très faible et hypotendue après une gastroentérite. Les causes immédiates diffèrent, mais le raisonnement est commun : reconnaître la défaillance, traiter l’infection ou le déclencheur, et ne pas retarder une substitution parentérale si une crise surrénalienne est suspectée [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p>Dans le premier cas, l’hémorragie surrénalienne septique peut accompagner une infection fulminante. Dans le second, la glande déjà lésée peut ne plus répondre au stress, et les vomissements compromettent la prise orale. L’antibiothérapie, le soutien circulatoire et le remplacement hormonal nécessaire s’organisent en parallèle ; attendre le résultat d’un test hormonal ou d’une imagerie ne doit pas retarder les premières mesures [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>La formation suisse <button class="w" data-k="e35-profiles">PROFILES</button> demande de reconnaître choc, hypotension sévère, méningisme, altération de conscience et douleur abdominale, puis d’initier les soins et de transmettre les informations utiles. Ce rapprochement avec E35 est pédagogique, sans correspondance officielle entre code et question fédérale. Les vignettes sont originales [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
<div class="key"><b>À retenir.</b> L’infection et la défaillance endocrine peuvent coexister. Traiter l’une n’autorise pas à attendre pour l’autre [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-2"><h2><span class="n">2</span>Définition et double codage</h2><p>E35 désigne des anomalies endocriniennes au cours de maladies classées ailleurs. Les subdivisions portent un astérisque : elles décrivent une manifestation d’organe et ne s’utilisent pas seules. Le code étiologique primaire classe la maladie causale ; le code de manifestation ajoute la conséquence endocrine lorsqu’il est approprié [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</p>
<table class="t" data-e35-table="1"><thead><tr><th>Manifestation locale suisse 2024</th><th>Exemple expressément nommé dans les notes allemandes</th><th>Portée</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.0</a>* : thyroïde</td><td>Tuberculose thyroïdienne, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A18.8</a>†</td><td>Cause et atteinte glandulaire sont documentées ensemble.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.1</a>* : surrénale</td><td>Addison tuberculeux, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A18.7</a>† ; <button class="w" data-k="e35-waterhouse">Waterhouse-Friderichsen</button> méningococcique, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A39.1</a>†</td><td>Un syndrome septique dû à un autre germe ne reçoit pas automatiquement <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A39.1</a>†.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.8</a>* : autres glandes</td><td>Aucune entité particulière nommée dans cette rubrique 2024</td><td>Absence d’exemple n’est pas preuve de rubrique vide ; vérifier diagnostic et index de codage.</td></tr></tbody></table>
<p>Les inclusions infectieuses nommées servent de modèles cliniques à la leçon ; elles ne démontrent pas que toute E35 serait exclusivement infectieuse. À l’inverse, toute insuffisance surrénalienne, thyroïdite ou maladie intercurrente ne reçoit pas E35. Une insuffisance auto-immune, génétique ou médicamenteuse garde son diagnostic et sa classification propres [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>].</p>
<p>La classification suisse locale est celle de 2024, confrontée aux notes allemandes et au principe dague-astérisque. Ces références ne sont ni un certificat de codage individuel 2026 ni une règle de remboursement. Le diagnostic médical précède le choix des codes [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> L’astérisque documente une manifestation ; il ne remplace jamais la cause. Le libellé ne prescrit pas le traitement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-3"><h2><span class="n">3</span>Épidémiologie : ne pas mesurer la mauvaise maladie</h2><p>Aucune incidence suisse de l’ensemble des manifestations E35, de la tuberculose surrénalienne ou de la tuberculose thyroïdienne n’est établie dans les lectures ciblées. Les données disponibles concernent surtout la maladie causale, des populations spécialisées ou des cas publiés [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<p>Le guide suisse de la tuberculose <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">V1.2024</a> rapporte 365 cas en 2022, soit 4,16 pour 100000 habitants. Il indique une atteinte pulmonaire dans 94% des cas de 2020 ; cela ne signifie pas que 6% seulement auraient une atteinte extrapulmonaire, car les localisations peuvent coexister. Ces chiffres ne donnent pas la part endocrine ni une incidence 2026 [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>].</p>
<p>Le document <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> du 20 janvier 2025 décrit environ 48 infections invasives à méningocoque par an en moyenne décennale, incidence 0,6 pour 100000, et une létalité de 5–15%. Ces données concernent toutes les infections invasives de cette population, pas spécifiquement le syndrome de <button class="w" data-k="e35-waterhouse">Waterhouse-Friderichsen</button>. Une synthèse médico-légale de 86 décès sélectionnés ne peut pas fournir une létalité de tous les patients atteints [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<p>En Suède, 29 des 1743 patients avec traumatisme abdominal grave avaient une lésion surrénalienne dans une série 2013–2018. Cette fréquence de 1,7% ne décrit pas les infections surrénaliennes. Une revue de tuberculose thyroïdienne avec abcès réunissait 33 cas publiés dans 22 études ; elle ne permet pas de calculer un risque populationnel. La sélection et les examens incomplets limitent toute extrapolation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> L’incidence de l’infection causale n’est pas celle de sa complication endocrine. Chaque chiffre garde sa période et son dénominateur [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-4"><h2><span class="n">4</span>Du fonctionnement normal à la défaillance</h2><p>Le cortex surrénalien produit des stéroïdes ; la médulla produit des catécholamines. Le cortisol participe à la réponse métabolique et circulatoire au stress. L’aldostérone contribue à la conservation du sodium et à l’excrétion du potassium ; sa régulation dépend surtout du système rénine-angiotensine et du potassium, et ne se réduit pas à l’axe corticotrope [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>Une destruction corticale bilatérale peut diminuer cortisol et aldostérone. L’atteinte centrale ou la suppression par des glucocorticoïdes réduit surtout le signal corticotrope et conserve généralement la régulation minéralocorticoïde. Cela explique pourquoi une même hyponatrémie ne prouve pas un même mécanisme et pourquoi la fludrocortisone n’est pas ajoutée à tous les déficits [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>].</p>
<p>Infection granulomateuse, nécrose, infarctus ou hémorragie peuvent détruire du tissu. Une glande touchée à l’imagerie ne signifie pas automatiquement perte complète de réserve ; l’étendue et l’évolution comptent. Une hémorragie unilatérale ne produit habituellement pas le même risque qu’une atteinte bilatérale, sans exclure une lésion controlatérale moins visible [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p>La thyroïde normale est organisée en follicules autour d’un colloïde. Une infection peut produire masse, collection ou granulomes tout en conservant une sécrétion hormonale suffisante. Fonction normale et absence d’infection ne sont donc pas synonymes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Maladie causale et tissu atteint</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Réserve hormonale et réponse au stress</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Signes, examens puis soins parallèles</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. La lésion et la fonction s’évaluent ensemble ; aucune perte de réserve chiffrée universelle n’est déduite du dessin [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> L’organe, le niveau de l’atteinte et la réserve expliquent le tableau. Cortex, médulla et thyroïde ne sont pas interchangeables [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-5"><h2><span class="n">5</span>Mécanismes, causes et diagnostics voisins</h2><table class="t" data-e35-table="1"><thead><tr><th>Profil</th><th>Causes ou contexte</th><th>Question utile</th></tr></thead><tbody><tr><td>Atteinte surrénalienne infectieuse chronique</td><td>Tuberculose ; autres agents selon terrain et exposition, notamment certaines mycoses.</td><td>Réserve hormonale, microbiologie, autres localisations et résistances.</td></tr><tr><td>Atteinte hémorragique aiguë</td><td>Sepsis, trouble de coagulation/anticoagulants, traumatisme, contexte tumoral ou obstétrical.</td><td>Stabilité, caractère bilatéral, saignement persistant, cause sous-jacente.</td></tr><tr><td>Tuberculose thyroïdienne</td><td>Masse ou collection, parfois avec adénopathie, fonction souvent conservée.</td><td>Prélèvement pertinent et confirmation microbiologique, pas image spécifique.</td></tr><tr><td>Déficit sans infection glandulaire</td><td>Auto-immunité, anomalie congénitale, atteinte centrale, exposition aux glucocorticoïdes.</td><td>Ne pas attribuer automatiquement E35 ni perdre la cause réelle.</td></tr></tbody></table>
<p>Le syndrome de <button class="w" data-k="e35-waterhouse">Waterhouse-Friderichsen</button> associe un tableau septique fulminant et une hémorragie surrénalienne bilatérale. Le méningocoque est classique, mais d’autres agents sont décrits. Une série d’autopsies de décès ne remplace pas un test clinique prospectif, et le code méningococcique reste lié à cette étiologie [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<p>Le terrain oriente la recherche : traitement immunosuppresseur, exposition tuberculeuse, maladie ou voyage, hémopathie, anticoagulation et antécédent de crise. Une insuffisance congénitale peut être révélée par une infection sans que l’infection ait détruit la glande ; ce sont deux mécanismes différents [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> Distinguer cause glandulaire, déclencheur d’une crise et diagnostic voisin. Le déclencheur n’est pas toujours l’étiologie du déficit [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-6"><h2><span class="n">6</span>Anamnèse : chronologie, traitements et absorption</h2><p>Préciser fatigue, amaigrissement, appétit, envies de sel, vertiges au lever, douleurs abdominales, vomissements et évolution. Dater fièvre, céphalée, purpura, exposition et symptômes cervicaux. La progression lente d’une insuffisance n’a pas le même calendrier qu’une hémorragie septique ou qu’une malabsorption aiguë d’un traitement habituel [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p>Demander une insuffisance connue, une carte et un kit d’urgence, la dernière prise réellement absorbée et les adaptations prévues en cas de maladie. Rechercher toutes les voies de glucocorticoïdes, une diminution ou un arrêt récent, ainsi que les traitements oncologiques ou autres causes susceptibles d’altérer les axes endocriniens. La voie non orale n’exclut pas une suppression de l’axe [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>].</p>
<p>La rifampicine peut accélérer le métabolisme de l’hydrocortisone. Vérifier son début ou son arrêt, l’observance, les médicaments associés et les symptômes de sous- ou sur-remplacement. Une augmentation chiffrée identique chez tous n’est pas déduite du seul nom de l’antibiotique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p>Pour une tuberculose suspectée, rechercher contacts, localisations antérieures, traitements et résistances connus, sans inférer une cause sur le pays de naissance seul. Une absence d’exposition identifiée, de signes généraux ou de lésion pulmonaire n’exclut pas une atteinte thyroïdienne. Un nodule suspect garde aussi ses diagnostics tumoraux [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> Le traitement reçu, celui réellement absorbé et son calendrier font partie du diagnostic. Une infection peut révéler un déficit préexistant [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-7"><h2><span class="n">7</span>Examen clinique et sémiologie</h2><div data-semiology-clinical="E35"><p>Commencer par vigilance, respiration, perfusion, pression artérielle, fréquence cardiaque, température et signes de déshydratation. Un choc ou une détérioration rapide commande le niveau de soins. Rechercher purpura et signes méningés selon contexte, mais leur absence ne rassure pas à elle seule, notamment chez le petit enfant [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
<p>Dans une forme chronique, décrire amaigrissement, hypotension orthostatique et hyperpigmentation des plis, cicatrices ou muqueuses. La pigmentation traduit une stimulation corticotrope prolongée ; elle peut manquer dans une atteinte primaire très aiguë et n’est pas attendue de la même façon dans un déficit central. Un potassium normal n’exclut pas une crise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>Examiner abdomen et flancs si douleur, et rechercher une masse cervicale, sa sensibilité, les adénopathies, la voix, la déglutition et la respiration. L’examen ne distingue pas à lui seul tuberculose, collection pyogène, inflammation et tumeur thyroïdienne. Une fonction hormonale encore normale ne remplace pas la caractérisation d’une masse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<p><button class="w" data-k="e35-semio">La sémiologie clinique</button> est reliée aux neuf volets du premier sous-onglet scientifique : normal, signes, mécanismes, examen, interprétation, différentiels, urgence, limites et sources. Aucun score E35 clinique unique n’est proposé [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
</div><div class="key"><b>À retenir.</b> La gravité précède l’étiquette. Ni absence de pigmentation ni ionogramme normal ne permettent d’attendre devant une crise plausible [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-7">Essentiel de cette partie</button></section>

<section class="ilot" id="e35-8"><h2><span class="n">8</span>Urgence : agir sans attendre la preuve</h2><p>Hypotension ou choc, altération de conscience, hypoglycémie, vomissements persistants, purpura ou détresse respiratoire justifient une évaluation et des soins urgents. Les mécanismes septique, hypovolémique et endocrinien peuvent coexister. Si une crise surrénalienne est suspectée, l’hydrocortisone parentérale et la réanimation liquidienne adaptée ne doivent pas attendre un test dynamique [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p>Si cela ne retarde pas le traitement, prélever cortisol et hormone adrénocorticotrope, glycémie, ionogramme et examens infectieux pertinents avant la première dose. Sinon, traiter et compléter ensuite la démarche. Surveiller de façon répétée circulation, conscience, glucose et électrolytes ; l’imagerie ne doit pas devenir un obstacle aux premières mesures [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>Chez l’adulte, les guides décrivent 100 mg d’hydrocortisone intraveineuse ou intramusculaire puis 200 mg sur 24 heures, ou 50 mg toutes les six heures selon le protocole. La FI suisse précise formulation, voie et technique ; l’injection intraveineuse de 100 mg se fait en au moins 30 secondes. Les schémas pédiatriques sont distincts et ne reçoivent pas un bolus adulte uniforme [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Une infection invasive à méningocoque suspectée impose hospitalisation, antibiotique urgent, précautions et déclaration sans attendre la confirmation. Les petites doses utilisées chez un contact sain ne sont pas celles d’un malade avec sepsis ou méningite. Identifier les contacts vient en parallèle des soins du patient, avec le service cantonal [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<div class="key"><b>À retenir.</b> Prélèvements si possibles, traitement sans délai indu. Le protocole adulte n’est pas une prescription universelle pédiatrique [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-8">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-9"><h2><span class="n">9</span>Diagnostic : confirmer la fonction et la cause</h2><p>La crise reste un diagnostic clinique urgent. Hors phase critique et hors interférence majeure, le cortisol matinal aide à évaluer la réserve. Le guide britannique donne, chez les personnes d’au moins un an et avec immunodosages modernes, moins de 150 nmol/L comme suspect, 150–300 comme incertain et plus de 300 comme rendant un déficit très improbable. Ces repères ne sont pas une règle de non-traitement en choc, et d’autres méthodes ont d’autres références [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p>
<p>Associer le signal corticotrope au cortisol pour distinguer atteinte primaire et centrale, puis rénine, aldostérone et ionogramme selon le profil. Les conditions de prélèvement, glucocorticoïdes reçus, œstrogènes et protéines de transport modifient l’interprétation. Un test de stimulation se discute à l’état stable si le bilan reste incertain ; sa réponse garde le seuil propre à la méthode [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>L’imagerie surrénalienne recherche hémorragie, infarctus, infiltration et masses ; elle ne confirme pas seule une infection spécifique. Une lésion bilatérale augmente la vigilance pour la réserve, sans transformer toute image en crise. La recherche d’une tumeur ou d’un trouble de coagulation dépend du contexte, après stabilisation si nécessaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p>Pour une masse thyroïdienne ou une collection, échographie et prélèvement orienté peuvent apporter cytologie, histologie, culture et amplification ciblée. Des granulomes ou des bacilles acido-alcoolo-résistants ne prouvent pas à eux seuls l’espèce du complexe tuberculeux ; documenter le germe et les résistances évite un traitement mal ciblé. Un test immunologique positif ne localise pas une atteinte endocrine [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> La fonction endocrine et l’étiologie sont deux preuves complémentaires. Image, histologie et microbiologie ne se remplacent pas [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-9">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-10"><h2><span class="n">10</span>Prise en charge selon la situation</h2><p>La crise suspectée reçoit traitement hormonal parentéral, correction hydroélectrolytique et prise en charge du déclencheur. La voie orale revient quand l’état est stable et l’absorption fiable. Diminuer ensuite selon l’évolution et le plan spécialisé ; ne pas interrompre le remplacement indispensable sous prétexte que l’infection a été traitée [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>].</p>
<p>La tuberculose glandulaire nécessite une stratégie antituberculeuse combinée, fondée sur prélèvements, sensibilité, sites, terrain et recommandations suisses datées. Le guide <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">V1.2024</a> décrit un schéma standard de six mois pour les situations usuelles, avec exceptions. Un schéma court étudié pour la tuberculose pulmonaire ne se transfère pas automatiquement à la thyroïde ou à la surrénale ; la rifampicine n’est pas utilisée seule pour traiter la tuberculose [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p>Une collection thyroïdienne peut demander aspiration ou drainage, et une compression des voies aériennes ou une suspicion tumorale persistante peut modifier l’indication chirurgicale. Les résections historiques fréquentes reflètent parfois une incertitude diagnostique avant reconnaissance de la tuberculose, pas une nécessité de retirer toute thyroïde infectée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<p>L’hémorragie surrénalienne se traite selon stabilité, caractère persistant du saignement et cause sous-jacente. Une surveillance conservatrice est fréquente ; embolisation ou chirurgie sont discutées si indiquées. Une revue proposant une stratégie très chirurgicale ne justifie pas l’opération de toute hémorragie, en particulier dans un contexte septique déjà instable [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>].</p>
<p>En insuffisance primaire avec déficit minéralocorticoïde, un remplacement spécifique peut devenir nécessaire. Les doses de stress d’hydrocortisone ont déjà une activité minéralocorticoïde ; on ne triple donc pas automatiquement <button class="w" data-k="e35-fludrocortisone">Florinef</button>. Dans une insuffisance centrale sans déficit aldostéronique, ce médicament n’est pas ajouté par principe [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<div class="key"><b>À retenir.</b> Traiter la cause et remplacer ce qui manque, avec un niveau de soins adapté. Une guérison microbiologique ne garantit pas la récupération glandulaire [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-10">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-11"><h2><span class="n">11</span>Contacts, prophylaxie et santé publique suisse</h2><p>Selon l’<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025, <button class="w" data-k="e35-contacts">les contacts étroits</button> d’un cas possible, probable ou confirmé d’infection invasive à méningocoque sont évalués rapidement. La période pertinente va de sept jours avant les signes à 24 heures après le début d’un traitement spécifique. Vie dans le même foyer ou situation comparable, contact intense avec sécrétions et certaines situations de petite enfance répondent aux critères ; la proximité spatiale seule ou la même classe scolaire ne suffit pas toujours [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p>La chimioprophylaxie est débutée idéalement dans les 24 heures et n’est indiquée que si elle peut commencer dans les dix jours suivant l’exposition selon ce document. Elle ne remplace pas l’information sur les signes d’alerte ni l’évaluation d’une personne déjà symptomatique. Le choix dépend de l’âge, de la grossesse, des contre-indications et des interactions [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>Le protocole suisse prévoit ciprofloxacine en premier choix hors grossesse, et rifampicine ou ceftriaxone comme alternatives selon les groupes. Certaines conduites pédiatriques ou d’allaitement diffèrent de la FI du produit : elles sont identifiées dans Pharmacologie, pas présentées comme une autorisation uniforme de la FI. La vaccination post-exposition est discutée selon sérogroupe, âge, antécédents et contexte, avec les autorités [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>La suspicion de méningococcie invasive est à déclarer dans 24 heures selon l’<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025. Le guide suisse de tuberculose <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">V1.2024</a> distingue déclaration clinique sous une semaine et déclaration de laboratoire dans 24 heures. Les formulaires et règles courantes sont vérifiés par l’équipe ; le code E35 seul ne remplace pas la déclaration de la maladie causale [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Prophylaxie d’un contact sain et traitement d’un cas malade ont des objectifs et des doses différents [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-11">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-12"><h2><span class="n">12</span>Suivi, pronostic et prévention des crises</h2><p>Après une lésion surrénalienne bilatérale, le déficit peut persister malgré la résolution de l’infection ou de l’hémorragie. Une récupération est parfois possible, mais l’arrêt du remplacement exige une évaluation spécialisée de la réserve. Le suivi de l’image recherche aussi une éventuelle lésion sous-jacente, sans calendrier universel appliqué à toutes les causes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p>Évaluer symptômes de sous- et sur-remplacement, pression couchée/debout, poids, électrolytes et, pour le minéralocorticoïde, rénine selon indication. Chez l’enfant, suivre croissance et développement. Une dose chronique excessive n’est pas une solution à toute fatigue ; une maladie intercurrente et une mauvaise absorption demandent un autre raisonnement [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p>La personne et son entourage reçoivent un plan écrit de stress, une carte et un kit adaptés, avec entraînement réel à l’injection et règles en cas de vomissements. Renouveler les explications et préparer voyages, procédures et transitions de soins évite que les connaissances restent théoriques. Un contrôle biologique programmé ne remplace pas l’action devant une dégradation aiguë [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>].</p>
<p>Après tuberculose thyroïdienne, suivre réponse clinique, résolution de la collection et fonction selon le cas. Les séries publiées ont des suivis incomplets : une absence de complication rapportée n’est pas un risque nul. Le suivi infectieux et celui de la fonction hormonale sont coordonnés [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Suivre l’infection, la lésion et la réserve hormonale séparément. Le plan d’urgence doit pouvoir être appliqué au moment utile [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-12">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-13"><h2><span class="n">13</span>Populations particulières et choix du produit</h2><p>Le nouveau-né et le jeune enfant n’ont pas une version réduite arbitraire du bolus adulte. Le protocole pédiatrique distingue âge, poids et âge gestationnel corrigé ; les options ne s’additionnent pas. Les tableaux de différentes sources ont des bornes différentes et ne sont pas fusionnés en une nouvelle règle [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Grossesse et allaitement imposent un choix individualisé, tout en maintenant le remplacement vital nécessaire. Les FI de l’hydrocortisone et de la fludrocortisone conservent leurs précautions ; l’<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> privilégie une alternative adaptée pour la prophylaxie pendant la grossesse. L’<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> et la FI ciprofloxacine diffèrent pour l’allaitement, ce qui demande une décision documentée du prescripteur et non une fausse équivalence [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>Foie, rein, âge avancé et interactions influencent la sécurité. <button class="w" data-k="e35-rifampicine">Rimactan</button> est contre-indiqué par sa FI si la clairance de la créatinine est inférieure à 25 ml/min et en insuffisance hépatique sévère. Le produit ceftriaxone a des limites propres chez le nouveau-né et en insuffisance rénale préterminale ; ces règles ne se transposent pas à toutes les molécules [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>Les informations de classification et de santé publique sont datées. Aucune disponibilité, prise en charge d’assurance ou obligation professionnelle individuelle 2026 n’est déduite du diagnostic seul ; l’équipe applique les règles suisses courantes avec les services compétents [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> La population et la formulation font partie de chaque prescription. L’urgence vitale et les précautions du suivi ne sont pas opposées [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-13">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-14"><h2><span class="n">14</span>Critères et pièges de raisonnement</h2><p><b>Critères formels.</b> E35* requiert une maladie causale classée ailleurs et une manifestation endocrine documentée ; ce n’est pas un diagnostic étiologique autonome. La crise est clinique : les guides décrivent hypotension/choc avec symptômes compatibles, mais aucune anomalie biologique isolée ne doit devenir une condition obligatoire retardant le traitement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>].</p>
<p><b>Paramètres.</b> Les seuils matinaux 150/300 nmol/L du guide britannique concernent une population et une méthode définies ; ils ne remplacent pas l’évaluation d’un malade en choc ni les références d’un autre laboratoire. Les doses adultes, pédiatriques, de traitement infectieux et de prophylaxie gardent indication, voie et intervalle [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p><b>Pièges.</b> Attendre une pigmentation ou une hyperkaliémie ; attendre le test de stimulation ; appliquer 100 mg à tout nouveau-né ; additionner dose à l’âge et dose au poids ; confondre 125/250 mg de prophylaxie et traitement de méningite ; oublier l’induction par rifampicine ; arrêter un remplacement vital pour éviter une interaction au lieu de revoir le choix du médicament [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p><b>Autres pièges.</b> Conclure tuberculose sur image ou granulomes seuls ; interpréter 86 décès sélectionnés comme une létalité ; conclure absence de déficit bilatéral sur une série sans tests hormonaux ; imposer chirurgie à toute hémorragie ; transférer un schéma pulmonaire court à une localisation thyroïdienne sans expertise [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<div class="key"><b>À retenir.</b> Une donnée n’a de sens qu’avec sa méthode, sa population et sa question. Expliquer l’incertitude prépare une meilleure décision [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-14">Essentiel de cette partie</button></section>
<div class="src"><h3>Sources effectivement consultées</h3><ul data-justification-sources="1"><li><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S1] CIM-10-GM E35 et subdivisions astérisque</a> — 2024. Entrées locales E35*, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.0</a>*, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.1</a>*, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.8</a>*. Limites : Libellés 2024, sans certification du codage individuel 2026.</li><li><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">[S2] Inclusions E35* et catégories voisines</a> — 2024. <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.0</a>/.1/.8 et notes ; réutilisation déclarée du cache lu ce jour puis nouvelle lecture E35. Limites : Notes confrontées aux libellés suisses ; absence d’exemple en <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.8</a> n’est pas preuve que la rubrique soit vide.</li><li><a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">[S3] Code structure : codes primaires et secondaires</a> — Page consultée 2 novembre 2026. Primary, additional and optional codes ; dagger/asterisk. Limites : Principe allemand, pas validation administrative suisse individuelle.</li><li><a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">[S4] Nebenniereninsuffizienz : selten, aber potenziell lebensgefährlich</a> — 3/2023. p 28 : normal et signes ; p 30–33 : niveaux, diagnostic/traitement ; tableau 2 p 31. Limites : Revue suisse pédiatrique ; exemples génétiques et auto-immuns ne deviennent pas E35. Tableau d’âge présente bornes qui se chevauchent à 3/12 ans, non harmonisé par invention. Légende figure 3 attribuant CRH à hypophyse non reprise : texte situe correctement hypothalamus.</li><li><a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">[S5] NG243 : Adrenal insufficiency, identification and management</a> — 2024. 1.2.7–13,1.3 remplacement ciblé, 1.4 stress/grossesse, 1.6–1.8 crise/suivi. Limites : Guide britannique, pas FI suisse ni règle de remboursement. Doses chroniques fludrocortisone différentes de FI suisse ; non fusionnées.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">[S6] ESE/Endocrine Society Joint Clinical Guideline : Glucocorticoid-induced adrenal insufficiency</a> — 10 mai 2024. Section 3 R3.1–3.2, tableaux 8–9 et rationales. Limites : Consensus conjoint, auteurs suisses/européens ; pas fondement américain seul, confronté à Flück/<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">NICE</a>/FI. Atteinte iatrogène discutée en différentiel, pas classée automatiquement E35.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">[S7] Emergency and perioperative management of adrenal insufficiency in children : BSPED consensus</a> — 2023. Tableau 3 de crise réellement relu ce jour ; contexte/méthodes déjà lus lors E25. Limites : Réutilisation déclarée, pas lecture nouvelle du texte entier. Consensus européen à adapter au centre suisse et FI. Tableau comparatif des anciens guides n’est pas le tableau de conduite <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a>.</li><li><a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">[S8] Vorgehen nach Kontakt mit invasiver Meningokokken-Erkrankung</a> — Bulletin 4 du 20 janvier 2025. p 12–16 : épidémiologie, contacts, déclaration, délais, figure 3 et vaccination. Limites : Document 2025 daté ; pas incidence actuelle E35. Schémas de prophylaxie pédiatrique/allaitement à confronter aux FI, qui diffèrent pour ciprofloxacine.</li><li><a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">[S9] Tuberculose en Suisse : guide professionnel</a> — <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">V1.2024</a>. p 9 épidémiologie ; passages diagnostic, chapitre 7 traitement général ;p 46 déclaration. Limites : Source générale ; pas protocole spécifique thyroïde/surrénale ni donnée 2026 actualisée.94% atteinte pulmonaire ne signifie pas 6% de toutes atteintes extrapulmonaires exclusives.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">[S10] Approach to the Patient With Adrenal Hemorrhage</a> — 2023. Épidémiologie, Clinical relevance/presentation, Laboratory Investigations réellement lu, management aigu et suivi. Limites : Revue européenne en revue américaine, pas guideline américaine seule ; séries hétérogènes, seuils de suivi dépendants de méthode.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">[S11] Adrenal trauma experience at a major tertiary centre in Sweden</a> — 2022. Résumé et discussion/limites. Limites : Rétrospective monocentrique ; aucun cortisol matinal/test de stimulation chez survivants. Pas preuve que toute hémorragie bilatérale garde sa fonction.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">[S12] Thyroid Tuberculosis Abscess : systematic review of diagnostic pathways and management</a> — 15 mars 2026. Résultats 3.1–3.7, discussion 4.1–4.3, conclusions. Limites : Cas/petites séries sans comparaison, données microbiologiques et pourcentages parfois incohérents ; pas précision de risque populationnel ni protocole suisse. Pas fondement américain.</li><li><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">[S13] Thyroid Tuberculosis Misdiagnosed as Papillary Thyroid Carcinoma</a> — 2025. Présentation, histologie et limites du cas ; discussion regardée mais traitement général non adopté. Limites : Microbiologie spécifique non documentée dans texte lu ; diagnostic rapporté surtout histologique. Fréquence 0,1–0,4% et stratégie courte américaine non adoptées. Figures NC non réutilisées.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">[S14] Adrenal Infections: An Underrecognized Cause of Primary Adrenal Insufficiency.</a> — 9 octobre 2026. Résumé publié. Limites : Résumé seul ; aucun algorithme ou dose fondé uniquement dessus ; 14–100% très hétérogène non utilisé comme risque individuel.</li><li><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">[S15] Fatal waterhouse-friderichsen syndrome at autopsy: a systematic review and forensic diagnostic framework.</a> — 29 août 2026. Résumé publié. Limites : Résumé seul, sélection de décès : pas dénominateur pour létalité, pas test clinique prospectif.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">[S16] Information professionnelle suisse Solu-Cortef injectable 100/250 mg</a> — Octobre 2025. Formulation, indication, posologie, contre-indications, adaptations ; précautions/interactions et grossesse ciblées. Limites : FI générale multindications non protocole complet d’urgences ; schémas <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">NICE</a>/<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> identifiés séparément.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">[S17] Information professionnelle suisse Hydrocortisone Galepharm comprimé 10 mg sécable</a> — Août 2025. Formulation, indication, posologie, contre-indications, adaptations ; précautions/interactions et grossesse ciblées. Limites : Réutilisation déclarée du cache lu E25, nouvelle lecture posologie chronique ; 15–25 mgdu guide britannique non substitué comme dose de FI. Swisspeddose annexée non confondue avec FI.</li><li><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">[S18] Information professionnelle suisse Florinef comprimé 0,1 mg</a> — Mars 2026. Formulation, indication, posologie, contre-indications, adaptations ; précautions/interactions et grossesse ciblées. Limites : Repères différents de <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> et revue pédiatrique, pas dose composite ni triplement automatique au stress ; urgence par hydrocortisone de stress distincte.</li><li><a data-reference-source="1" href="https://amiko
