<table class="t" data-e35-table="1"><thead><tr><th>Population / source</th><th>Repère de protocole</th><th>Produit et limite</th></tr></thead><tbody><tr><td>Adulte, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> 2024/<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">ESE</a> 2024</td><td>100 mg intraveineux ou intramusculaire immédiatement ; puis 200 mg/24 h en perfusion ou 50 mg toutes les 6 h selon protocole.</td><td><button class="w" data-k="e35-hydrocortisone">Solu-Cortef</button> FI octobre 2025 : <button class="w" data-k="e35-routes">IV</button> préférée en urgence ; 100 mg en au moins 30 secondes.</td></tr><tr><td>Enfant, option âge <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023</td><td>Moins 1 an 25 mg ; 1–5 ans 50 mg ;dès 6 ans 100 mg, <button class="w" data-k="e35-routes">IM</button>/<button class="w" data-k="e35-routes">IV</button>.</td><td>Option d’âge, pas addition à la dose au poids.</td></tr><tr><td>Enfant, option poids <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023</td><td>Après 28 jours corrigés : 2 mg/kg <button class="w" data-k="e35-routes">IV</button>, maximum 100 mg ; avant 28 jours corrigés : 4 mg/kg <button class="w" data-k="e35-routes">IV</button>.</td><td>Fréquence et diminution ensuite selon état et protocole pédiatrique ; ne pas recopier le bolus adulte.</td></tr><tr><td>FI suisse générale pédiatrique</td><td>Adaptation à l’état/réponse ; mention de minimum 25 mg/j.</td><td>Ce minimum journalier n’est pas un bolus universel ; protocole pédiatrique et produit confrontés par l’équipe.</td></tr></tbody></table>
<p>Le <button class="w" data-k="e35-hydrocortisone">détail des options pédiatriques et du produit</button> distingue le schéma d’âge et celui au poids. Le tableau suisse de Flück 2023 et le consensus britannique ont des limites d’âge différentes : on applique le protocole validé pour la population du centre, sans composer une nouvelle règle. La fluidothérapie, le glucose et les électrolytes sont surveillés en parallèle [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Allergie, contre-indication de l’intramusculaire en purpura thrombopénique idiopathique, précautions hépatiques et interactions sont conservées. La FI ne demande pas d’adaptation rénale, mais l’ensemble du malade reste surveillé. La nécessité vitale de substitution dans une crise suspectée n’est pas annulée par les précautions d’une corticothérapie prolongée [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> Dose initiale, voie, concentration et population sont vérifiées ensemble. Pas de 100 mg uniforme chez le nouveau-né [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-p-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-p-2"><h2><span class="n">p-2</span>Relais oral et déficit minéralocorticoïde</h2><table class="t" data-e35-table="1"><thead><tr><th>Produit suisse daté</th><th>Repère de FI</th><th>Surveillance / limite</th></tr></thead><tbody><tr><td><button class="w" data-k="e35-galepharm">Hydrocortisone Galepharm 10 mg, août 2025</button></td><td>Insuffisance chronique 10–20 mg/j, parfois davantage ; prise(s) selon indication.</td><td>La plage 10–30 mg/j de l’hyperplasie congénitale n’est pas une dose E35 universelle.</td></tr><tr><td><button class="w" data-k="e35-fludrocortisone">Florinef 0,1 mg, mars 2026</button></td><td>Adulte 0,1 mg 3 fois/semaine à 0,2 mg/j, dose courante 0,1 mg/j ; 12–18 ans comme adulte.</td><td>Pression, poids, électrolytes et rénine ; rein/foie peu étudiés.</td></tr><tr><td><button class="w" data-k="e35-fludrocortisone">Florinef</button>, 0–12 ans</td><td>2–5µg/kg/j selon FI.</td><td>Repères spécialisés et FI différents ; pas transposition automatique d’une dose néonatale fixe.</td></tr></tbody></table>
<p>Le relais oral attend stabilité et absorption suffisante. Les besoins glucocorticoïdes et minéralocorticoïdes sont réévalués séparément ; on ne triple pas automatiquement <button class="w" data-k="e35-fludrocortisone">Florinef</button> en cas de fièvre. Le déficit central sans déficit aldostéronique ne reçoit pas ce produit par principe [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p>La FI <button class="w" data-k="e35-fludrocortisone">Florinef</button> décrit notamment hypertension sévère et autres contre-indications, risque de rétention sodée, œdèmes et hypokaliémie, et une absence de données permettant une adaptation chiffrée en atteinte rénale/hépatique. Elle réserve la grossesse aux nécessités et demande de ne pas allaiter ; le suivi spécialisé maintient le remplacement indispensable en choisissant une stratégie adaptée [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<div class="key"><b>À retenir.</b> Le relais et les deux remplacements sont individualisés. Le contrôle de l’infection ne permet pas d’arrêter automatiquement les hormones [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-p-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-p-3"><h2><span class="n">p-3</span>Ceftriaxone : malade et contact sain</h2><table class="t" data-e35-table="1"><thead><tr><th>Situation</th><th>Repère daté</th><th>Limite</th></tr></thead><tbody><tr><td>Maladie invasive adulte</td><td>FI <button class="w" data-k="e35-ceftriaxone">Rocephin</button> juin 2025 : généralement 1–2 g/j, jusqu’à 4 g/j en sévère ; addendum <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">SSI</a> 2017 pour méningite empirique : 2 ×2 g.</td><td>Schéma hospitalier choisi selon syndrome, germe et protocole courant ; pas petite dose de prophylaxie.</td></tr><tr><td>Méningite de l’enfant</td><td>FI : 100 mg/kg/j, maximum 4 g, puis adaptation au germe/sensibilité.</td><td>Ne pas appliquer sans les restrictions néonatales et la voie/temps de perfusion appropriés.</td></tr><tr><td>Prophylaxie <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025, contact sain</td><td>≤12 ans 125 mg <button class="w" data-k="e35-routes">IM</button> unique ; grossesse et alternative>12 ans 250 mg <button class="w" data-k="e35-routes">IM</button> unique.</td><td>Conduite de santé publique distincte de l’indication infectieuse et du schéma de traitement FI.</td></tr></tbody></table>
<p><button class="w" data-k="e35-ceftriaxone">Rocephin, juin 2025</button> distingue préparations intraveineuses et intramusculaire avec lidocaïne. Une solution contenant de la lidocaïne ne doit jamais être injectée dans une veine. Les doses pédiatriques élevées sont perfusées selon la FI ; les contre-indications de la lidocaïne s’ajoutent pour la préparation intramusculaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
<p>Prématuré jusqu’à 41 semaines postmenstruelles : contre-indication ; nouveau-né jusqu’à 28 jours ayant besoin ou susceptible d’avoir besoin de calcium intraveineux : contre-indication ; hyperbilirubinémie néonatale : ne pas traiter selon FI. Le schéma 100 mg/kg de méningite enfant n’annule pas le maximum 50 mg/kg/j du nouveau-né jusqu’à 14 jours et les autres restrictions néonatales [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
<p>En insuffisance rénale avec clairance inférieure à 10 ml/min, la FI limite à 2 g/j, de même chez le dialysé ; les atteintes rénale et hépatique combinées requièrent surveillance. Allergie, hémolyse, réactions cutanées, colite et encéphalopathie font partie des risques. Les choix d’urgence sont faits par l’équipe pour la population réelle [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
<div class="key"><b>À retenir.</b> Deux doses très différentes peuvent avoir le même nom de produit : toujours préciser si l’on traite une infection ou un contact sain [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-p-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-p-4"><h2><span class="n">p-4</span>Rifampicine : prophylaxie, tuberculose et interactions</h2><table class="t" data-e35-table="1"><thead><tr><th>Prophylaxie selon FI <button class="w" data-k="e35-rifampicine">Rimactan</button> octobre 2023</th><th>Dose orale</th><th>Durée</th></tr></thead><tbody><tr><td>Adulte/ado>12 ans et poids>60 kg</td><td>600 mg toutes les 12 h</td><td>2 jours, quatre doses</td></tr><tr><td>Dès 1 mois, enfant jusqu 12 ans ou ado>12 ans avec poids<60kg</td><td>10 mg/kg toutes les 12 h, sans dépasser dose adulte</td><td>2 jours, quatre doses</td></tr><tr><td>Moins 1 mois</td><td>5 mg/kg toutes les 12 h</td><td>2 jours, quatre doses</td></tr></tbody></table>
<p>Le protocole <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025 décrit 10 mg/kg par dose, maximum 600 mg, dès un mois, et 5 mg/kg avant un mois. Les bornes de poids du libellé FI ne sont pas élargies arbitrairement au point exact 60 kg ; l’équipe applique le protocole adapté. Une forme compatible avec le jeune âge est nécessaire, pas une gélule imposée [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p><button class="w" data-k="e35-rifampicine">Rimactan, octobre 2023</button> ne traite pas une méningite méningococcique manifeste. Pour la tuberculose, la rifampicine s’emploie en association, selon guide suisse et sensibilité. La dose et la durée de prophylaxie ne sont pas celles d’un traitement antituberculeux [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p>Contre-indication si clairance de la créatinine inférieure à 25 ml/min ou insuffisance hépatique sévère selon cette FI. Hépatotoxicité, interactions multiples et diminution d’efficacité de contraceptifs hormonaux sont à vérifier. L’induction peut réduire l’exposition à l’hydrocortisone : réévaluer le remplacement lors de début/arrêt sans multiplicateur universel ni interruption du traitement vital [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Même molécule, deux indications et deux durées différentes. L’interaction peut révéler ou aggraver une insuffisance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-p-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-p-5"><h2><span class="n">p-5</span>Ciprofloxacine : divergence entre protocole et FI</h2><table class="t" data-e35-table="1"><thead><tr><th>Source et population</th><th>Schéma de prophylaxie</th><th>Portée</th></tr></thead><tbody><tr><td>FI <button class="w" data-k="e35-ciprofloxacine">Ciproxine</button> orale août 2025, adulte</td><td>500 mg en dose unique.</td><td>Indication de prévention invasive explicitement listée chez adulte.</td></tr><tr><td><a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025, hors grossesse</td><td>20 mg/kg en dose orale unique ; maximum 500 mg dès 1 mois.</td><td>Directive pédiatrique distincte : les indications/contre-indications de croissance de la FI ne couvrent pas ce schéma comme autorisation générale.</td></tr><tr><td>Allaitement</td><td><a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> permet les molécules citées, FI <button class="w" data-k="e35-ciprofloxacine">Ciproxine</button> demande de ne pas l’utiliser.</td><td>Divergence explicite, choix spécialisé d’une option adaptée et documentation.</td></tr></tbody></table>
<p>Le produit est <button class="w" data-k="e35-ciprofloxacine">Ciproxine comprimés ou suspension orale</button>, pas Ciproxin <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">HC</a> otique. La FI réserve l’enfant à des indications et conditions particulières, et contre-indique grossesse/allaitement hors situations spéciales décrites. Le protocole <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> n’est donc pas recopié sous la mention « dose autorisée par toute FI » ; indication, population, formulation et décision du prescripteur restent visibles [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>Tizanidine et agomélatine concomitantes sont contre-indiquées. Tendinites/ruptures, neuropathies et autres effets graves sont décrits ; l’association aux corticostéroïdes majore notamment le risque tendineux. Chez une personne nécessitant un remplacement vital, on revoit le choix prophylactique avec l’équipe plutôt que supprimer d’office ce remplacement [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>Les cations et certains antiacides diminuent la résorption : la FI prévoit prise une–deux heures avant ou quatre heures après ces produits. L’insuffisance rénale influence les maxima journaliers de la FI ; une dose unique ne dispense pas de vérifier le terrain. Les informations Swisspeddose ajoutées à la page sont distinctes du texte d’autorisation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> Une directive et une FI répondent à des questions différentes. Les désaccords doivent rester explicites, surtout en pédiatrie et allaitement [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-p-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-p-6"><h2><span class="n">p-6</span>Coordonner les traitements et le suivi</h2><p>Avant et pendant les soins, vérifier produit exact, quantité, voie, intervalle, indication et dernière dose absorbée. La surveillance vise pression, perfusion, glycémie, électrolytes et réponse infectieuse. Les interactions et l’évolution clinique peuvent modifier les besoins ; aucun tableau ne remplace cette réévaluation [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>Une corticothérapie adjuvante d’une méningite, un remplacement de crise et un traitement immunosuppresseur prolongé ne sont pas des schémas à additionner automatiquement. L’équipe clarifie l’objectif de chaque médicament et les équivalences pertinentes. La formulation et la dose de stress sont revues lorsque l’état se stabilise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<p>Le suivi organise les kits, les doses disponibles et l’entraînement. Une ordonnance de sortie doit être compréhensible pour la personne, son entourage et les professionnels appelés en urgence. Les précautions de grossesse, allaitement, foie ou rein sont reprises pour le produit réellement poursuivi [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> La sécurité repose aussi sur une coordination compréhensible et un plan appliqué, pas seulement sur une dose exacte sur papier [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-p-6">Essentiel de cette partie</button></section>
</div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>

<template data-pop="e35-hydrocortisone" data-title="Hydrocortisone : produit et options pédiatriques"><table class="t" data-e35-table="1"><thead><tr><th>Population / source</th><th>Repère de protocole</th><th>Produit et limite</th></tr></thead><tbody><tr><td>Adulte, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> 2024/<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">ESE</a> 2024</td><td>100 mg intraveineux ou intramusculaire immédiatement ; puis 200 mg/24 h en perfusion ou 50 mg toutes les 6 h selon protocole.</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">Solu-Cortef</a> FI octobre 2025 : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> préférée en urgence ; 100 mg en au moins 30 secondes.</td></tr><tr><td>Enfant, option âge <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023</td><td>Moins 1 an 25 mg ; 1–5 ans 50 mg ;dès 6 ans 100 mg, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IM</a>/<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>.</td><td>Option d’âge, pas addition à la dose au poids.</td></tr><tr><td>Enfant, option poids <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023</td><td>Après 28 jours corrigés : 2 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>, maximum 100 mg ; avant 28 jours corrigés : 4 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>.</td><td>Fréquence et diminution ensuite selon état et protocole pédiatrique ; ne pas recopier le bolus adulte.</td></tr><tr><td>FI suisse générale pédiatrique</td><td>Adaptation à l’état/réponse ; mention de minimum 25 mg/j.</td><td>Ce minimum journalier n’est pas un bolus universel ; protocole pédiatrique et produit confrontés par l’équipe.</td></tr></tbody></table>
<p>Le tableau 3 <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023 propose une option d’âge ou de poids : ne pas additionner. Enfant après 28 jours corrigés : 2 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> initial, max 100 mg, puis selon état ; nouveau-né avant 28 jours corrigés : 4 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>. Lorsqu’il est stable et s’améliore, le protocole décrit 1 mg/kg max 50 toutes les six heures chez enfant, 2 mg/kg chez nouveau-né, puis relais oral de maladie si toléré. Cette conduite est distincte de la FI générale et du tableau suisse 2023, dont les bornes diffèrent [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">Act-O-Vial</a> 100 mg et 250 mg ont chacun 2 ml de solvant : ne pas supposer la même concentration. Injection <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> 100 mg en au moins 30 secondes ; intrathécal n’est pas voie de crise. La mention FI minimum 25 mg/j pédiatrique n’est pas un bolus 25 mg universel et ne constitue pas un protocole néonatal complet [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
</template>
<template data-pop="e35-galepharm" data-title="Remplacement oral : produit suisse daté"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">Hydrocortisone Galepharm</a> 10 mg, FI août 2025 : insuffisance surrénale chronique 10–20 mg/j, parfois davantage, doses et prises adaptées. La plage hyperplasie congénitale 10–30 mg/j n’est pas celle de toute E35. Le guide britannique utilise une autre plage habituelle 15–25 mg/j ; ne pas l’étiqueter comme dose de la FI suisse ni créer une moyenne [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>].</p>
<p>Vomissements ou mauvaise absorption et crise imposent un autre parcours, souvent parentéral. L’arrêt du remplacement vital n’est pas une mesure de gestion d’une interaction ; la dose est réévaluée avec le prescripteur [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e35-fludrocortisone" data-title="Déficit minéralocorticoïde et dose"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">Florinef</a> comprimé 0,1 mg, FI mars 2026 : adulte 0,1 mg trois fois par semaine à 0,2 mg/j, dose habituelle 0,1 mg/j ; 12–18 ans comme adulte ; 0–12 ans 2–5µg/kg/j. Surveiller pression, poids, électrolytes et rénine ; pas adaptation chiffrée validée pour tout rein/foie. Le stress ne conduit pas à tripler automatiquement ce médicament [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p>La FI demande de ne pas allaiter et réserve grossesse à nécessité ; le suivi spécialisé maintient une stratégie de remplacement indispensable et adaptée. Les protocoles étrangers, la FI et l’âge ne sont pas fusionnés [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
</template>
<template data-pop="e35-ceftriaxone" data-title="Ceftriaxone : voie, âge et indication"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">Rocephin</a> FI juin 2025 : préparations intraveineuses distinctes de la forme intramusculaire avec lidocaïne ; solution lidocaïnée jamais <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>. Adulte 1–2 g/j, jusqu’à 4 g/j en sévère ; addendum suisse 2017 méningite 2 ×2 g, protocole hospitalier à contextualiser. Enfant méningite 100 mg/kg/j max 4 g ; le nouveau-né jusqu’à 14 jours garde un maximum 50 mg/kg/j ; de 15 jours à 12 ans, la plage usuelle est 20–80 mg/kg/j hors schéma spécifique, avec dose adulte si poids≥50 kg [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<p>Prématuré jusqu’à 41 semaines postmenstruelles contre-indiqué ; nouveau-né≤28 jours avec besoin actuel/probable de calcium <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> contre-indiqué ; hyperbilirubinémie néonatale ne pas traiter. Prophylaxie <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 125/250 mg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IM</a> unique chez contact n’est jamais la dose d’un malade invasif [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
</template>
<template data-pop="e35-rifampicine" data-title="Rifampicine : indication et induction"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">Rimactan</a> gélules 150/300 mg, FI octobre 2023. Prophylaxie méningocoque : 600 mg toutes les douze heures deux jours chez adulte/ado>12 ans et>60 kg ; 10 mg/kg par prise sans dépasser dose adulte dès un mois chez les groupes de poids/âge précisés ; avant un mois 5 mg/kg. <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> présente aussi une option au poids 10 mg/kg max 600 dès un mois ; pas élargissement arbitraire des bornes strictes du libellé [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p>Pas traitement d’une méningite manifeste ni monothérapie de tuberculose. Clairance<25ml/min ou foie sévère : contre-indications FI. Induction du métabolisme et interactions nombreuses ; hydrocortisone peut demander adaptation à début/arrêt, sans facteur unique ni arrêt d’un remplacement vital [S6, S16, S20].</p>
</template>
<template data-pop="e35-ciprofloxacine" data-title="Prophylaxie : directive et autorisation du produit"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">Ciproxine</a> orale FI août 2025 : adulte 500 mgdoseunique pour prévention invasive à méningocoque. La directive <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025 prévoit 20 mg/kgdoseunique en pédiatrie, max 500 dès un mois, mais la FI réserve les indications avant fin de croissance et ne fournit pas une autorisation générale de ce schéma. Le produit Ciproxin <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">HC</a> est otique et ne s’utilise pas ici [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>La FI interdit grossesse/allaitement hors cas particulier ; l’<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> permet toutes les molécules citées pendant allaitement et choisit ceftriaxone en grossesse. Cette divergence reste explicite pour le prescripteur. Tizanidine/agomélatine contre-indiquées, risques tendineux majorés par corticoïdes, cations diminuant absorption ; ne pas interrompre un remplacement vital pour régler le choix d’une prophylaxie [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
</template>


<template data-pop="e35-contacts" data-title="Contact étroit : définition et délai"><p><a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 20 janvier 2025 : contacts étroits de sept jours avant signes à 24 heures après traitement spécifique ; foyer et contact intense avec sécrétions, situations de petite enfance selon critères. Simple proximité ou même classe scolaire n’est pas toujours une indication. Prophylaxie idéalement 24 heures et début au plus dix jours après exposition ; personne symptomatique évaluée comme possible cas, pas seulement prophylaxie [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
</template>
<template data-pop="e35-profiles" data-title="Objectifs suisses de formation"><p><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> 2017 : décompensation, choc/hypotension sévère, méningisme, altération de conscience et douleur abdominale ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">SSP</a> 88 purpura et 214 pressions extrêmes complètent le raisonnement. Rapprochement pédagogique, pas correspondance officielle E35 ni question d’examen garantie [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
</template>
<template data-pop="e35-semio" data-title="Sémiologie et niveau de soins"><p>L’examen recherche d’abord la gravité : circulation, conscience, glucose, respiration, purpura et absorption des médicaments. Ni pigmentation absente ni potassium normal ne suffisent à exclure une atteinte aiguë. Les neuf sections de sémiologie scientifique lient mécanisme, examen, interprétation, différentiels, urgence et limites [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
</template>
<template data-pop="e35-routes" data-title="Voies parentérales et produit exact"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IM</a> signifie intramusculaire ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> intraveineux. Ces voies ne rendent pas les doses ou préparations équivalentes. Pour la crise, hydrocortisone parentérale selon population et formulation ; pour <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">Rocephin</a> intramusculaire, le solvant peut contenir lidocaïne et cette solution ne doit jamais être injectée dans une veine. Le produit exact, sa voie et ses contre-indications sont vérifiés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
</template>
<template data-pop="e35-waterhouse" data-title="Syndrome septique et hémorragie surrénalienne"><p><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">Waterhouse-Friderichsen</a> désigne un tableau septique fulminant avec hémorragie surrénalienne bilatérale, classiquement méningococcique mais décrit avec d’autres agents. Les soins infectieux, circulatoires et endocriniens nécessaires se font en parallèle. Seul le contexte méningococcique justifie l’exemple <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A39.1</a>†/<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.1</a>* ; une série de décès à autopsie ne donne pas une létalité de tous les patients [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
</template>

<template data-pop="pareto-e35-1" data-title="Essentiel — Deux mécanismes à traiter ensemble"><p>L’infection et la défaillance endocrine peuvent coexister. Traiter l’une n’autorise pas à attendre pour l’autre [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e35-1"></p>
</template>
<template data-pop="pareto-e35-2" data-title="Essentiel — Définition et double codage"><p>L’astérisque documente une manifestation ; il ne remplace jamais la cause. Le libellé ne prescrit pas le traitement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e35-2"></p>
</template>
<template data-pop="pareto-e35-3" data-title="Essentiel — Épidémiologie : ne pas mesurer la mauvaise maladie"><p>L’incidence de l’infection causale n’est pas celle de sa complication endocrine. Chaque chiffre garde sa période et son dénominateur [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-3"></p>
</template>
<template data-pop="pareto-e35-4" data-title="Essentiel — Du fonctionnement normal à la défaillance"><p>L’organe, le niveau de l’atteinte et la réserve expliquent le tableau. Cortex, médulla et thyroïde ne sont pas interchangeables [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<p class="ratio" data-cover="e35-4"></p>
</template>
<template data-pop="pareto-e35-5" data-title="Essentiel — Mécanismes, causes et diagnostics voisins"><p>Distinguer cause glandulaire, déclencheur d’une crise et diagnostic voisin. Le déclencheur n’est pas toujours l’étiologie du déficit [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-5"></p>
</template>
<template data-pop="pareto-e35-6" data-title="Essentiel — Anamnèse : chronologie, traitements et absorption"><p>Le traitement reçu, celui réellement absorbé et son calendrier font partie du diagnostic. Une infection peut révéler un déficit préexistant [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-6"></p>
</template>
<template data-pop="pareto-e35-7" data-title="Essentiel — Examen clinique et sémiologie"><p>La gravité précède l’étiquette. Ni absence de pigmentation ni ionogramme normal ne permettent d’attendre devant une crise plausible [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-7"></p>
</template>
<template data-pop="pareto-e35-8" data-title="Essentiel — Urgence : agir sans attendre la preuve"><p>Prélèvements si possibles, traitement sans délai indu. Le protocole adulte n’est pas une prescription universelle pédiatrique [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-8"></p>
</template>
<template data-pop="pareto-e35-9" data-title="Essentiel — Diagnostic : confirmer la fonction et la cause"><p>La fonction endocrine et l’étiologie sont deux preuves complémentaires. Image, histologie et microbiologie ne se remplacent pas [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-9"></p>
</template>
<template data-pop="pareto-e35-10" data-title="Essentiel — Prise en charge selon la situation"><p>Traiter la cause et remplacer ce qui manque, avec un niveau de soins adapté. Une guérison microbiologique ne garantit pas la récupération glandulaire [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e35-10"></p>
</template>
<template data-pop="pareto-e35-11" data-title="Essentiel — Contacts, prophylaxie et santé publique suisse"><p>Prophylaxie d’un contact sain et traitement d’un cas malade ont des objectifs et des doses différents [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e35-11"></p>
</template>
<template data-pop="pareto-e35-12" data-title="Essentiel — Suivi, pronostic et prévention des crises"><p>Suivre l’infection, la lésion et la réserve hormonale séparément. Le plan d’urgence doit pouvoir être appliqué au moment utile [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-12"></p>
</template>
<template data-pop="pareto-e35-13" data-title="Essentiel — Populations particulières et choix du produit"><p>La population et la formulation font partie de chaque prescription. L’urgence vitale et les précautions du suivi ne sont pas opposées [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-13"></p>
</template>
<template data-pop="pareto-e35-14" data-title="Essentiel — Critères et pièges de raisonnement"><p>Une donnée n’a de sens qu’avec sa méthode, sa population et sa question. Expliquer l’incertitude prépare une meilleure décision [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-14"></p>
</template>
<template data-pop="pareto-e35-e-1" data-title="Essentiel — Choisir l’examen qui change la décision"><p>La question précède le test. La réanimation et le traitement causal ne sont pas suspendus pour obtenir une valeur parfaite [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e35-e-1"></p>
</template>
<template data-pop="pareto-e35-e-2" data-title="Essentiel — Cortisol et ionogramme : contexte et méthode"><p>Le résultat doit garder son heure, sa méthode et l’exposition médicamenteuse. Aucun seuil stable ne neutralise un tableau de crise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-e-2"></p>
</template>
<template data-pop="pareto-e35-e-3" data-title="Essentiel — Imagerie, tissus et microbiologie"><p>Le prélèvement doit prouver ce que l’on cherche. La morphologie, l’espèce et la sensibilité thérapeutique sont trois informations différentes [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-e-3"></p>
</template>
<template data-pop="pareto-e35-e-4" data-title="Essentiel — Quatre exercices de raisonnement"><p>Urgence, population, fonction et statut d’un produit sont quatre questions qui ne se remplacent pas [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e35-e-4"></p>
</template>
<template data-pop="pareto-e35-s-anat-cours" data-title="Essentiel — Anatomie : un organe, deux compartiments"><p>Topographie, vascularisation et compartiments expliquent les questions de l’examen. La planche normale ne démontre pas la maladie du patient [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p class="ratio" data-cover="e35-s-anat-cours"></p>
</template>
<template data-pop="pareto-e35-s-histo-cours" data-title="Essentiel — Histologie : du compartiment normal à la lésion"><p>L’architecture, le site prélevé et la preuve microbiologique se complètent. Une image normale pédagogique ne classifie pas une lésion réelle [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-s-histo-cours"></p>
</template>
<template data-pop="pareto-e35-s-physio-cours" data-title="Essentiel — Physiologie : réserve et réponse au stress"><p>Le besoin augmente pendant le stress, mais les hormones n’ont pas toutes la même régulation ni le même ajustement [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e35-s-physio-cours"></p>
</template>
<template data-pop="pareto-e35-s-bioch-cours" data-title="Essentiel — Biochimie : mesurer le bon signal"><p>Résultat hormonal, exposition au médicament et preuve du germe ont des objets différents ; l’un ne remplace pas les autres [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-s-bioch-cours"></p>
</template>
<template data-pop="pareto-e35-s-gene-cours" data-title="Essentiel — Génétique et immunologie : hôte, pathogène et terrain"><p>Hôte, agent et médicament influencent le tableau par des mécanismes différents ; une infection révélatrice n’est pas forcément la cause initiale du déficit [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>].</p>
<p class="ratio" data-cover="e35-s-gene-cours"></p>
</template>
<template data-pop="pareto-e35-p-1" data-title="Essentiel — Hydrocortisone d’urgence : voie et population"><p>Dose initiale, voie, concentration et population sont vérifiées ensemble. Pas de 100 mg uniforme chez le nouveau-né [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-p-1"></p>
</template>
<template data-pop="pareto-e35-p-2" data-title="Essentiel — Relais oral et déficit minéralocorticoïde"><p>Le relais et les deux remplacements sont individualisés. Le contrôle de l’infection ne permet pas d’arrêter automatiquement les hormones [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e35-p-2"></p>
</template>
<template data-pop="pareto-e35-p-3" data-title="Essentiel — Ceftriaxone : malade et contact sain"><p>Deux doses très différentes peuvent avoir le même nom de produit : toujours préciser si l’on traite une infection ou un contact sain [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e35-p-3"></p>
</template>
<template data-pop="pareto-e35-p-4" data-title="Essentiel — Rifampicine : prophylaxie, tuberculose et interactions"><p>Même molécule, deux indications et deux durées différentes. L’interaction peut révéler ou aggraver une insuffisance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p class="ratio" data-cover="e35-p-4"></p>
</template>
<template data-pop="pareto-e35-p-5" data-title="Essentiel — Ciprofloxacine : divergence entre protocole et FI"><p>Une directive et une FI répondent à des questions différentes. Les désaccords doivent rester explicites, surtout en pédiatrie et allaitement [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e35-p-5"></p>
</template>
<template data-pop="pareto-e35-p-6" data-title="Essentiel — Coordonner les traitements et le suivi"><p>La sécurité repose aussi sur une coordination compréhensible et un plan appliqué, pas seulement sur une dose exacte sur papier [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p>
<p class="ratio" data-cover="e35-p-6"></p>
</template>
