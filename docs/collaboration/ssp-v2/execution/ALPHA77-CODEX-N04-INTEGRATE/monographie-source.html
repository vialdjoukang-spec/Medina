<template data-pop="n04-calc-cyclo" data-title="Calcul : la dose cumulée de cyclophosphamide"><p><b>Principe.</b> Le risque de cancer et d’infertilité dépend de la dose totale reçue. Dose cumulée = dose quotidienne × nombre de jours de traitement. Plafonds : moins de 36 g (risque de cancer), en pratique 25 g au plus, 10 g au plus si la fertilité doit être préservée ; l’ÖGN, citant KDIGO, indique 200 mg/kg ; enfant : 168 mg/kg (2 mg/kg/jour pendant 12 semaines).</p><p><b>Exemple (homme de 80 kg).</b> Schéma cyclique : 2,5 mg/kg/jour = 200 mg par jour aux mois 2, 4 et 6, soit environ 18 g. Schéma continu : 1,5 mg/kg/jour = 120 mg par jour pendant 6 mois, soit environ 22 g. Pour cet homme, 200 mg/kg correspondent à 16 g : les sources ne concilient pas cette valeur avec les 18 g du schéma cyclique ; la décision revient au centre spécialisé.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a>.</p></template>
<template data-pop="n04-immunosuppression-severe" data-title="Immunosuppression sévère au sens du plan de vaccination suisse"><p>Le plan suisse définit l’immunosuppression sévère par : une corticothérapie d’au moins 2 mg/kg/jour (dose enfant) ou d’au moins 20 mg par jour d’équivalent prednisolone pendant plus de deux semaines ; une déplétion des lymphocytes B ; une chimiothérapie forte ; ou des associations. Les vaccins vivants atténués ne doivent en principe pas être donnés en cas de déficit immunitaire. KDIGO propose de différer les vaccins vivants jusqu’à une prednisone inférieure à 20 mg/jour et/ou 1 à 3 mois après l’arrêt des immunosuppresseurs.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">OFSP/CFV — Plan de vaccination suisse 2026 (février 2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-reponse-enfant" data-title="Définitions pédiatriques de réponse et de résistance"><p>Corticosensible : rémission complète dans les 4 semaines de prednisone à dose standard. Corticorésistant : absence de rémission complète à 4 semaines, avec une période de confirmation entre 4 et 6 semaines (répondeur tardif si rémission complète à 6 semaines). Rechutes fréquentes : au moins 2 rechutes dans les 6 premiers mois après la rémission initiale, ou au moins 3 par 12 mois. Corticodépendance : 2 rechutes consécutives sous corticothérapie ou dans les 14 jours suivant l’arrêt. Corticorésistance secondaire : échec à 4 semaines lors d’une rechute ultérieure. Résistance aux anticalcineurines : pas de rémission partielle après au moins 6 mois. Multirésistance : pas de rémission complète après 12 mois de deux agents d’épargne de mécanisme distinct. Rémission complète : rapport ≤ 20 mg/mmol, bandelette négative ou traces, ou moins de 100 mg/m²/jour, pendant au moins 3 jours consécutifs. Rémission partielle : rapport entre 20 et 200 mg/mmol et, si disponible, albumine ≥ 30 g/L.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a>.</p></template>
<template data-pop="n04-contentieux-pjp" data-title="Contentieux : prophylaxie de la pneumocystose"><p><b>KDIGO 2021</b> (point de pratique 1.8.4) : à envisager sous forte dose de prednisone, rituximab ou cyclophosphamide. <b>ÖGN 2023</b> : non indiquée dans les lésions minimes, la hyalinose, la néphropathie membraneuse et la néphropathie à IgA en Europe centrale, car la pneumocystose y est rare et le cotrimoxazole est toxique. <b>Suisse</b> : aucune recommandation trouvée ; l’information professionnelle de Bactrim forte® donne la dose de prophylaxie de l’adulte et de l’adolescent (1 comprimé forte, 3 fois par semaine). Si une prophylaxie est prescrite, l’ÖGN indique 160/800 mg trois fois par semaine, et la demi-dose si le DFGe est inférieur à 30 mL/min.</p><p><b>Choix du cours.</b> La décision est individualisée : on pèse le risque d’infection (forte dose, rituximab, cyclophosphamide) contre la toxicité du cotrimoxazole. La source européenne la plus récente pour l’Europe centrale est l’ÖGN 2023 ; le texte KDIGO 2021 reste consultable.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680483060482" target="_blank" rel="noopener">Information professionnelle Swissmedic — Bactrim forte® (mars 2023)</a>.</p></template>
<template data-pop="n04-contentieux-sglt2" data-title="Contentieux : inhibiteur de SGLT2 et immunosuppression"><p><b>KDIGO 2021</b> ne traite pas ce point. <b>ÖGN 2023</b> (néphropathie membraneuse) : l’inhibiteur de SGLT2 est à viser avec le blocage du système rénine-angiotensine. <b>Suisse</b> : l’information professionnelle de Forxiga® (état août 2026) indique que les données sont insuffisantes et que le traitement n’est pas recommandé chez les patients néphropathes traités par immunosuppresseurs ; elle ne recommande pas non plus de l’initier si le DFGe est inférieur à 25.</p><p><b>Choix du cours.</b> L’information professionnelle suisse prime pour la prescription : l’inhibiteur de SGLT2 n’est pas enseigné comme standard pendant l’immunosuppression.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle Swissmedic — Forxiga® (août 2026)</a>.</p></template>
<template data-pop="n04-contentieux-prednisone" data-title="Contentieux : plafond et durée de la prednisone"><p><b>Plafond.</b> KDIGO 2021 : 1 mg/kg/jour, maximum 80 mg (ou 2 mg/kg un jour sur deux, maximum 120 mg). ÖGN 2023 : maximum 60 mg/jour, comme les recommandations nationales et l’essai TURING ; le schéma alterné est inhabituel en Europe centrale. Suisse : l’information professionnelle autorise les doses de 5 à 60 mg/jour habituelles et des doses plus élevées ; Spiricort® cite 80 à 120 mg/jour pour un traitement à dose élevée, habituellement limité à 48–72 heures jusqu’à stabilisation ; ce passage ne définit pas un protocole néphrologique prolongé.</p><p><b>Durée.</b> Dans le PDF KDIGO 2021 consulté, la figure 45 (page 155 du supplément) mentionne une décroissance sur au moins 24 semaines, mais le texte voisin (page 156 du supplément) décrit une exposition totale d’environ 24 semaines et constate l’absence de comparaison entre décroissance rapide et lente chez l’adulte. L’ÖGN 2023 retient une durée totale d’au plus 24 semaines, reconnaît l’absence de schéma uniforme et évoque une réduction de 5 à 10 mg par semaine après rémission. La figure et le texte KDIGO ne permettent donc pas d’enseigner un minimum universel de 24 semaines de décroissance. Le cadre européen et la situation individuelle guident la discussion spécialisée ; aucune recommandation suisse précisant cette durée n’a été trouvée dans les sources consultées.</p><p><b>Choix du cours.</b> Présenter les schémas spécialisés de 1 mg/kg avec leurs plafonds respectifs, en les distinguant des plages générales et des durées décrites dans les FI suisses. Ne pas présenter les FI comme une autorisation globale de tous les schémas prolongés. La durée et la décroissance restent à individualiser avec le centre spécialisé, en explicitant la discordance des sources.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680388400109" target="_blank" rel="noopener">Information professionnelle Swissmedic — Spiricort® (juin 2026)</a>.</p></template>
<template data-pop="n04-contentieux-mn" data-title="Contentieux : première ligne de la néphropathie membraneuse à risque"><p><b>KDIGO 2021</b> : rituximab, cyclophosphamide avec glucocorticoïdes ou anticalcineurine selon le niveau de risque (1B). <b>ÖGN 2023</b> : rituximab en monothérapie d’abord ; les anticalcineurines sont très restreintes (néphrotoxicité, rechutes à l’arrêt). <b>Suisse</b> : le rituximab est hors indication dans l’information professionnelle de MabThera® ; Endoxan® a l’indication « maladies auto-immunes d’évolution menaçante, p. ex. syndrome néphrotique » ; Sandimmun Neoral® n’a l’indication que pour le syndrome idiopathique corticodépendant ou corticorésistant.</p><p><b>Choix du cours.</b> Enseigner l’arbre de risque de KDIGO, la préférence européenne pour le rituximab et le statut d’autorisation suisse ; la décision revient à un centre spécialisé. L’ÖGN cite les essais GEMRITUX, MENTOR, STARMEN et RI-CYCLO (réponses à 6 mois de 70 à 90 %).</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">Information professionnelle Swissmedic — MabThera® (décembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680254410362" target="_blank" rel="noopener">Information professionnelle Swissmedic — Endoxan® (février 2021)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680526560283" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sandimmun Neoral® (janvier 2026)</a>.</p></template>
<template data-pop="n04-contentieux-avk" data-title="Contentieux : antivitamine K et cible d’INR"><p><b>KDIGO 2021</b> : warfarine, INR 2 à 3. <b>ÖGN 2023</b> : phenprocoumone ou acénocoumarol, INR 1,5 à 2,5 en prophylaxie. <b>Suisse</b> : la warfarine est absente de la base de l’information professionnelle consultée ; Marcoumar® et Sintrom® donnent un INR de 2 à 3 dans leurs indications.</p><p><b>Choix du cours.</b> Nommer les antivitamines K suisses ; retenir l’INR 2 à 3 pour un traitement curatif (FI) ; l’INR 1,5 à 2,5 est une position d’experts pour la prophylaxie, hors cadre de la FI.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680193950011" target="_blank" rel="noopener">Information professionnelle Swissmedic — Marcoumar® (octobre 2020)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680216930143" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sintrom® (novembre 2025)</a>.</p></template>
<template data-pop="n04-contentieux-pcv" data-title="Contentieux : vaccination antipneumococcique"><p><b>KDIGO</b> : vaccin conjugué puis polysaccharidique à 23 valences. <b>ÖGN</b> : conjugué puis polysaccharidique plus de 8 semaines après. <b>Suisse (plan 2026, prise de position du 01.07.2026)</b> : un seul vaccin conjugué ; PCV21 de 18 à 64 ans, PCV15 ou PCV20 de 5 à 17 ans ; le polysaccharidique n’est plus recommandé depuis 2014 ; grippe annuelle ; varicelle dès 40 ans chez le non-immun.</p><p><b>Choix du cours.</b> Le plan suisse, plus récent, l’emporte.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">OFSP/CFV — Plan de vaccination suisse 2026 (février 2026)</a> ; <a data-reference-source="1" href="https://www.infovac.ch/docs/public/streptococcus/ofsp-cfv-prise-de-position-recommandation-des-pcv-par-groupe-cible-e--tat-au-01-07-26-fr.pdf" target="_blank" rel="noopener">OFSP/CFV — vaccins antipneumococciques conjugués par groupe d’âge (01.07.2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-contentieux-pression" data-title="Contentieux : cible de pression artérielle"><p><b>KDIGO 2021</b> : systolique inférieure à 120 mmHg, non validée dans les glomérulonéphrites (120 à 130 mmHg en pratique). <b>Société suisse de néphrologie 2025</b> : 120 à 129 mmHg pour la maladie rénale chronique. <b>Choix du cours.</b> Cible suisse : 120 à 129 mmHg.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN — dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n04-contentieux-iec" data-title="Contentieux : inhibiteur de l’enzyme de conversion en dehors du diabète"><p><b>KDIGO et ÖGN</b> : blocage du système rénine-angiotensine en première ligne si protéinurie avec ou sans hypertension. <b>Suisse</b> : l’information professionnelle de Zestril® indique l’hypertension, l’insuffisance cardiaque, l’infarctus aigu et le diabète avec microalbuminurie, sans indication « protéinurie non diabétique » ; Cosaar® ne vise que la néphropathie du diabète de type 2 hypertendu avec rapport albumine/créatinine d’au moins 300 mg/g. <b>Choix du cours.</b> Usage hors indication à nommer au patient ; contre-indication de grossesse.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680492970178" target="_blank" rel="noopener">Information professionnelle Swissmedic — Zestril® (avril 2024)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" target="_blank" rel="noopener">Information professionnelle Swissmedic — Cosaar® (avril 2025)</a>.</p></template>
<template data-pop="n04-contentieux-albumine" data-title="Contentieux : albumine intraveineuse avec diurétique"><p><b>KDIGO 2021</b> : option en cas de résistance au diurétique intraveineux maximal et d’albumine inférieure à 20 g/L, effet transitoire. <b>Suisse</b> : l’information professionnelle d’Albunorm® indique la restauration et le maintien du volume circulant lorsque la perte de volume est démontrée, et fonde la posologie sur le volume et non sur l’albuminémie. <b>Choix du cours.</b> Usage hors indication, réservé à l’hôpital et à la décision spécialisée.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680626600032" target="_blank" rel="noopener">Information professionnelle Swissmedic — Albunorm® (mars 2023)</a>.</p></template>
<template data-pop="n04-contentieux-mesna" data-title="Contentieux : mesna avec le cyclophosphamide"><p><b>ÖGN 2023</b> : le mesna n’est pas obligatoire hors oncologie (étude de 1018 patients). <b>Suisse</b> : l’information professionnelle d’Endoxan® prescrit le mesna lors de doses intraveineuses supérieures à 10 mg/kg. <b>Choix du cours.</b> La FI prime pour la prescription ; la discussion européenne est mentionnée.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680254410362" target="_blank" rel="noopener">Information professionnelle Swissmedic — Endoxan® (février 2021)</a>.</p></template>
<template data-pop="n04-contentieux-furosemide-enfant" data-title="Contentieux : furosémide oral chez l’enfant"><p>La FI de Lasix® indique 2 mg/kg/jour, maximum 40 mg/jour par voie orale chez l’enfant. Swisspeddose, intégré à l’information, donne 1 à 2 mg/kg/dose, 1 à 4 fois par jour, maximum 600 mg/jour. Les deux sources suisses diffèrent ; Swisspeddose correspond à l’harmonisation nationale pédiatrique. Le prescripteur signale la différence et adapte à la clinique.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle Swissmedic — Lasix® comprimés (mai 2025)</a>.</p></template>
<template data-pop="n04-mono-prednisone" data-title="Monographie : prednisone et prednisolone"><p><b>Mécanisme.</b> Glucocorticoïdes de synthèse à action anti-inflammatoire et immunosuppressive.</p><p><b>Preuves.</b> Lésions minimes de l’adulte : rémission de 80 à 90 % sous forte dose (KDIGO 2021). Selon l’ÖGN, la moitié des patients sont en rémission complète à 4 semaines et environ 80 % à 16 semaines ; l’essai TURING sert de référence au plafond de 60 mg/jour. Enfant : rémission à 4 semaines définit la corticosensibilité (KDIGO 2025).</p><p><b>Posologie.</b> Adulte : 1 mg/kg/jour sur le poids sec, plafond 80 mg (KDIGO) ou 60 mg (ÖGN) ; enfant : 60 mg/m²/jour (ou 2 mg/kg/jour, maximum 60 mg) pendant 4 semaines, puis 40 mg/m² (ou 1,5 mg/kg, maximum 40 mg) un jour sur deux. FI : 5 à 60 mg/jour habituels ; après plus de 8 à 10 jours, arrêt progressif ; doubler voire tripler la dose en cas de maladie intercurrente ; hydrocortisone périopératoire.</p><p><b>Effets indésirables et surveillance.</b> Seuil de Cushing à 7,5 mg/jour ; arrêt de croissance chez l’enfant après 2 à 3 mois de traitement prolongé ; risque thrombotique accru ; tendinopathies avec les fluoroquinolones ; kaliémie avec les diurétiques hypokaliémiants ; coagulation avec les anticoagulants.</p><p><b>Contre-indications.</b> Voir le tableau de l’onglet Pharmacologie (traitement prolongé) ; vaccins vivants contre-indiqués. Grossesse : prednisone et prednisolone à préférer si un glucocorticoïde est indispensable.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680388400109" target="_blank" rel="noopener">Information professionnelle Swissmedic — Spiricort® (juin 2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p></template>
<template data-pop="n04-mono-furosemide" data-title="Monographie : furosémide, torasémide et diurétiques"><p><b>Mécanisme.</b> Le furosémide et le torasémide inhibent la réabsorption du sodium dans l’anse de Henle. En hypoalbuminémie, la dose active qui atteint l’anse est réduite (voir la <button class="w" data-k="n04-resistance">fenêtre sur la résistance</button>).</p><p><b>Posologie (FI suisse).</b> Furosémide : adulte ½ à 2 comprimés de 40 mg par jour au départ ; par voie intraveineuse 20 à 40 mg, puis +20 mg toutes les 2 heures jusqu’à effet ; dose maximale 1500 mg/jour ; enfant 2 mg/kg/jour, maximum 40 mg/jour par voie orale (voir la <button class="w" data-k="n04-contentieux-furosemide-enfant">divergence avec Swisspeddose</button>). Torasémide : 20 mg le matin, jusqu’à 100 mg/jour (à partir de 12 ans).</p><p><b>Effets indésirables.</b> Hyponatrémie (thiazidiques), hypokaliémie, baisse du DFG, déplétion volémique, surdité et acouphènes en injection rapide.</p><p><b>Contre-indications.</b> Anurie, coma hépatique, hypokaliémie ou hyponatrémie sévères, hypovolémie, déshydratation, allaitement, allergie aux sulfamides. <b>Surveillance :</b> créatinine, urée, potassium, calcium, chlore, bicarbonate. Une forte restriction sodée peut réduire le DFG et l’effet diurétique.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle Swissmedic — Lasix® comprimés (mai 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680485781446" target="_blank" rel="noopener">Information professionnelle Swissmedic — Torem® (septembre 2019)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-mono-ciclosporine" data-title="Monographie : ciclosporine"><p><b>Mécanisme.</b> Inhibiteur de la calcineurine, qui bloque l’activation des lymphocytes T.</p><p><b>Preuves et cibles.</b> Les cibles de taux résiduel varient selon l’indication : lésions minimes 150 à 200 ng/ml (cibles initiales KDIGO), hyalinose 100 à 175 ng/ml, néphropathie membraneuse 125 à 225 ng/ml à 3,5 mg/kg/jour, enfant 60 à 150 ng/ml à 4 à 5 mg/kg/jour ; ÖGN : 80 à 175 ng/ml.</p><p><b>Posologie (FI).</b> Induction 5 mg/kg/jour (adulte) ou 6 mg/kg/jour (enfant) en 2 prises si la fonction rénale le permet ; si la créatinine initiale est anormale dans l’exception néphrotique de la FI, maximum initial 2,5 mg/kg/jour avec surveillance étroite ; réduire de 25 à 50 % si la créatinine dépasse de plus de 30 % la valeur initiale ; arrêt si aucun effet après 3 mois (<button class="w" data-k="n04-calc-ciclo">calcul</button>). Swisspeddose : 2 à 3 mg/kg/dose deux fois par jour chez l’enfant de 1 à 18 ans, ajusté par suivi thérapeutique.</p><p><b>Effets indésirables.</b> Néphrotoxicité structurelle possible sans hausse de la créatinine (biopsie à envisager après plus d’un an dans les lésions minimes corticodépendantes), hyperkaliémie, myalgies avec les statines. <b>Contre-indications :</b> insuffisance rénale (sauf exception néphrotique), hypertension ou infections non contrôlées, cancer. <b>Interactions :</b> voir l’encadré de l’onglet Pharmacologie.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680526560283" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sandimmun Neoral® (janvier 2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a>.</p></template>
<template data-pop="n04-mono-rituximab" data-title="Monographie : rituximab"><p><b>Mécanisme.</b> Anticorps monoclonal anti-CD20, qui déplète les lymphocytes B.</p><p><b>Preuves.</b> Dans la néphropathie membraneuse, l’ÖGN le choisit en monothérapie de première intention et cite les essais GEMRITUX, MENTOR, STARMEN et RI-CYCLO, avec des réponses à 6 mois de 70 à 90 %. KDIGO le place parmi les options de première intention.</p><p><b>Posologie.</b> 1 g par voie intraveineuse deux fois à 2 semaines d’intervalle ou 375 mg/m² 1 à 4 fois par semaine ; l’ÖGN adapte ensuite selon la cinétique des anti-PLA2R jusqu’à moins de 2 unités relatives par ml. Statut suisse : hors indication dans le syndrome néphrotique.</p><p><b>Effets indésirables.</b> Réactions à la perfusion (environ 25 %), hypogammaglobulinémie, réactivation de l’hépatite B, leucoencéphalopathie multifocale progressive. <b>Contre-indications :</b> hypersensibilité, insuffisance cardiaque NYHA IV, infection active. <b>Surveillance :</b> AgHBs et anti-HBc avant, IgG de base puis tous les 6 mois, vaccins complétés avant.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">Information professionnelle Swissmedic — MabThera® (décembre 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-mono-cyclophosphamide" data-title="Monographie : cyclophosphamide"><p><b>Mécanisme.</b> Agent alkylant cytotoxique ; l’acroléine, un de ses métabolites, est responsable de la cystite hémorragique.</p><p><b>Preuves et schémas.</b> Néphropathie membraneuse de risque élevé ou très élevé (KDIGO 2021) ; lésions minimes corticodépendantes (KDIGO) ; enfant 2 mg/kg/jour pendant 12 semaines (un seul cycle, cumul maximal 168 mg/kg).</p><p><b>Posologie.</b> Schémas cyclique et continu du tableau de l’îlot A10. FI : voie intraveineuse continue 3 à 6 mg/kg/jour, intermittente 10 à 15 mg/kg tous les 2 à 5 jours ; les doses orales viennent de KDIGO. Dose cumulée : voir le <button class="w" data-k="n04-calc-cyclo">calcul</button>.</p><p><b>Effets indésirables.</b> Leucopénie (nadir vers J10–J14), cystite hémorragique, infertilité possiblement irréversible, cancers au-delà de 36 g. <b>Contre-indications :</b> insuffisance médullaire sévère, cystite, obstacle à l’écoulement urinaire, infections florides, grossesse, allaitement. <b>Surveillance :</b> leucocytes, vessie, hydratation ; mesna selon la FI (voir la <button class="w" data-k="n04-contentieux-mesna">fenêtre dédiée</button>).</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680254410362" target="_blank" rel="noopener">Information professionnelle Swissmedic — Endoxan® (février 2021)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></template>
<template data-pop="n04-mono-avk-hbpm" data-title="Monographie : antivitamines K et héparines de bas poids moléculaire"><p><b>Mécanisme.</b> Les antivitamines K diminuent la synthèse hépatique de facteurs dépendants de la vitamine K ; l’énoxaparine potentialise l’antithrombine et inhibe surtout le facteur Xa.</p><p><b>Particularités du syndrome néphrotique.</b> Les antivitamines K sont liées à 99 % à l’albumine : en hypoalbuminémie, leur clairance augmente et la demi-vie peut être divisée par deux. L’énoxaparine est peu liée aux protéines et son effet est prévisible. La perte urinaire d’antithrombine peut rendre l’héparine moins efficace.</p><p><b>Posologie (FI).</b> Énoxaparine : prophylaxie 40 mg par jour par voie sous-cutanée, 20 mg si la clairance est inférieure à 30 mL/min ; traitement de la thrombose 1 mg/kg toutes les 12 heures. Phenprocoumone (Marcoumar®) : INR 2 à 3 ; latence de 36 à 72 heures, plein effet en 7 jours, donc début sous héparine ; jour 1 : 4,5 à 9 mg, jour 2 : 2 comprimés ; INR dès J3–J4 ; ne pas donner si l’INR dépasse 4,5. Acénocoumarol (Sintrom®) : entretien 1 à 8 mg/jour. Voir les <button class="w" data-k="n04-calc-anticoag">doses et l’anti-Xa</button>.</p><p><b>Contre-indications.</b> Grossesse, diathèse hémorragique, ulcère, lésion hépatique grave (antivitamines K). <b>Surveillance :</b> INR fréquent, surtout quand l’albumine remonte ; anti-Xa si DFGe inférieur à 30, IMC supérieur à 40, maigreur ou grossesse.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener">Information professionnelle Swissmedic — Clexane® (février 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680193950011" target="_blank" rel="noopener">Information professionnelle Swissmedic — Marcoumar® (octobre 2020)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680216930143" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sintrom® (novembre 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></template>
<template data-pop="n04-mono-spironolactone" data-title="Monographie : spironolactone"><p><b>Mécanisme.</b> Antagoniste de l’aldostérone, qui agit dans le néphron distal.</p><p><b>Posologie (FI).</b> Syndrome néphrotique : 100 à 200 mg/jour (enfant 1,5 à 3 mg/kg/jour répartis), seulement si la restriction hydrosodée et les diurétiques classiques échouent ; plein effet au 3e jour. <b>Effets indésirables :</b> hyperkaliémie. <b>Contre-indications :</b> insuffisance rénale aiguë, clairance inférieure à 30 mL/min, anurie, maladie d’Addison, hyperkaliémie, hyponatrémie, éplérénone. <b>Interactions :</b> potassium, inhibiteurs de l’enzyme de conversion, antagonistes de l’angiotensine II, AINS, héparines, triméthoprime. <b>Surveillance :</b> potassium.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle Swissmedic — Aldactone® (août 2025)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-mono-atorvastatine" data-title="Monographie : atorvastatine"><p><b>Mécanisme.</b> Inhibiteur de l’hydroxyméthylglutaryl-coenzyme A réductase, qui réduit la synthèse hépatique du cholestérol.</p><p><b>Place.</b> Première ligne si la dyslipidémie persiste (KDIGO 2021). <b>Posologie (FI) :</b> 10 mg/jour au départ, paliers d’au moins 4 semaines, maximum 80 mg/jour ; avec la ciclosporine, au plus 10 mg/jour (exposition multipliée par 8,7). <b>Contre-indications :</b> hépatopathie active, transaminases supérieures à 3 fois la normale, cholestase, myopathie, grossesse, allaitement. <b>Surveillance :</b> transaminases avant et pendant ; lipides et tolérance à 4 à 12 semaines.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sortis® (avril 2025)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p><p>Population : la FI suisse de Sortis n’autorise pas son utilisation chez l’enfant ou l’adolescent. Une recommandation internationale sur la classe des statines ne constitue pas une autorisation pédiatrique de ce produit.</p></template>
<template data-pop="n04-mono-cotrimoxazole" data-title="Monographie : cotrimoxazole (prophylaxie de la pneumocystose)"><p><b>Mécanisme.</b> Association de triméthoprime et de sulfaméthoxazole, qui bloque deux étapes de la synthèse bactérienne de l’acide folique.</p><p><b>Place.</b> Discutée (voir la <button class="w" data-k="n04-contentieux-pjp">fenêtre « contentieux »</button>). <b>Posologie (FI) :</b> 1 comprimé forte (160/800 mg) trois fois par semaine pour la prophylaxie de l’adulte et de l’adolescent ; demi-dose si le DFGe est inférieur à 30 mL/min (ÖGN). <b>Contre-indications :</b> hypersensibilité aux sulfamides ou au triméthoprime, antécédent de Stevens-Johnson ou de DRESS, déficit en G6PD, porphyrie, atteinte hépatique grave, clairance inférieure à 15 mL/min, anomalies hématologiques, nouveau-nés, troisième trimestre de grossesse, dofétilide. <b>Surveillance :</b> potassium (hyperkaliémie par le triméthoprime, surtout en insuffisance rénale), hémogramme.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680483060482" target="_blank" rel="noopener">Information professionnelle Swissmedic — Bactrim forte® (mars 2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></template>
<template data-pop="pareto-n04-a1" data-title="Pareto — Définitions, classification et épidémiologie"><p class="ratio" data-cover="n04-a01,n04-a02,n04-a03"></p><ul><li>Le syndrome néphrotique de l’adulte associe une protéinurie d’au moins 3,5 g/24 h ou un rapport d’au moins 300 mg/mmol et une hypoalbuminémie propre à la méthode ; celui de l’enfant, un rapport d’au moins 200 mg/mmol et une albumine inférieure à 30 g/L ou un œdème.</li><li>Les sous-codes N04.0 à N04.8 supposent une biopsie ; sans elle, N04.9.</li><li>La méthode de dosage de l’albumine décale les seuils d’environ 5 g/L.</li><li>Les lésions minimes dominent chez l’enfant, la néphropathie membraneuse chez l’adulte (environ 30 %) ; aucune donnée d’incidence suisse n’est publiée.</li></ul></template>
<template data-pop="pareto-n04-a2" data-title="Pareto — Physiopathologie, étiologies et clinique"><p class="ratio" data-cover="n04-a04,n04-a05,n04-a06"></p><ul><li>Le filtre lésé laisse passer l’albumine ; l’œdème naît d’un sous-remplissage et d’un surremplissage par activation d’ENaC.</li><li>Le DFGe est surestimé (sécrétion de créatinine).</li><li>Le bilan des causes secondaires se fait même si les anti-PLA2R sont positifs.</li><li>Début brutal : lésions minimes ; début lent à fonction conservée : néphropathie membraneuse.</li><li>L’ascite fébrile de l’enfant impose une ponction.</li></ul></template>
<template data-pop="pareto-n04-a3" data-title="Pareto — Diagnostic, différentiels et urgences"><p class="ratio" data-cover="n04-a07,n04-a08"></p><ul><li>Quantifier d’abord, puis chercher la forme ; anti-PLA2R chez tout adulte.</li><li>Biopsie : adulte aux anti-PLA2R nettement positifs et DFGe supérieur à 60 : non nécessaire ; enfant de moins de 12 ans corticosensible : non ; enfant de 12 ans et plus : oui.</li><li>Un test anti-PLA2R négatif n’exclut pas la maladie (sensibilité 0,78).</li><li>Les D-dimères ne guident pas la prophylaxie.</li><li>Thrombose (surtout dans la néphropathie membraneuse), insuffisance rénale aiguë, infection, hyperkaliémie : évaluation urgente.</li></ul></template>
<template data-pop="pareto-n04-a4" data-title="Pareto — Traitements de soutien et spécifiques"><p class="ratio" data-cover="n04-a09,n04-a10"></p><ul><li>Sodium inférieur à 2,0 g/jour (environ 5 g de sel) ; diurétique de l’anse deux fois par jour.</li><li>Ne pas débuter un bloqueur du système rénine-angiotensine lors d’un début brutal.</li><li>Prophylaxie anticoagulante : albumine (selon la méthode), forme, risque hémorragique.</li><li>Vaccins suisses dès le diagnostic ; un seul PCV.</li><li>Prednisone 1 mg/kg/jour (80 mg KDIGO, 60 mg ÖGN) pour les lésions minimes ; néphropathie membraneuse selon le risque ; enfant 60 mg/m²/jour.</li></ul></template>
<template data-pop="pareto-n04-a5" data-title="Pareto — Suivi, particularités et critères formels"><p class="ratio" data-cover="n04-a11,n04-a12"></p><ul><li>Anti-PLA2R : rémission immunologique à moins de 2 RU/ml ; la protéinurie suit avec retard.</li><li>Grossesse : coordonner néphrologie et obstétrique ; plusieurs médicaments sont contre-indiqués.</li><li>Adapter énoxaparine, ciclosporine, cotrimoxazole et spironolactone au DFGe.</li><li>Critères formels de l’alerte et paramètres clés de l’encadré.</li></ul></template>
<template data-pop="pareto-n04-e" data-title="Pareto — Examens du syndrome néphrotique"><p class="ratio" data-cover="n04-e01,n04-e02,n04-e03"></p><ul><li>Récolte de 24 heures pour décider l’immunosuppression ; biopsie pour la forme.</li><li>Rapport normal inférieur à 15 mg/mmol ; albumine au pourpre de 31 à 45 g/L.</li><li>Corps gras ovalaire : lipidurie.</li><li>Microscopie optique normale dans les lésions minimes ; effacement des pédicelles en microscopie électronique.</li></ul></template>
<template data-pop="pareto-n04-s" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="n04-s01,n04-s02,n04-s03,n04-s04"></p><ul><li>Le filtre : endothélium, membrane basale, podocytes et diaphragme de fente.</li><li>Trois signatures histologiques : lésions minimes, hyalinose, membraneuse.</li><li>Starling, ENaC et résistance aux diurétiques.</li><li>Lipides, antithrombine et antigènes PLA2R, THSD7A.</li></ul></template>
<template data-pop="pareto-n04-p" data-title="Pareto — Pharmacologie du syndrome néphrotique"><p class="ratio" data-cover="n04-p01,n04-p02,n04-p03"></p><ul><li>Autorisés dans l’indication : prednisone, prednisolone, méthylprednisolone, furosémide, torasémide, spironolactone, ciclosporine, cyclophosphamide.</li><li>Hors indication : rituximab, tacrolimus, mycophénolate mofétil, albumine, anticoagulants oraux directs, inhibiteurs de l’enzyme de conversion hors diabète.</li><li>Interactions : ciclosporine avec statine, hyperkaliémie, CYP3A4, antivitamines K.</li><li>Grossesse : lisinopril, atorvastatine, mycophénolate, cyclophosphamide, phenprocoumone contre-indiqués.</li></ul></template>
