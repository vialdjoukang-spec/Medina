un aspect optique peu modifié n’exclut pas une podocytopathie.</div><div class="key"><b>Science → traitement.</b> Distinguer une hyalinose primitive, secondaire ou génétique conditionne l’indication d’immunosuppression : le nom histologique seul ne suffit pas.</div></section></div><div class="sci" id="n04-s03-sci" hidden><section class="ilot" id="n04-s03"><h2><span class="n">S03</span> Physiologie : Starling, sodium et diurétiques</h2><h3 id="n04-s03-partie-1">1. Les forces de Starling et l’œdème</h3><p>Au niveau d’un capillaire, la sortie de liquide vers l’interstitium résulte d’un équilibre entre la pression hydrostatique, qui pousse le liquide hors du vaisseau, et la pression oncotique, qui le retient. Normalement, l’albumine plasmatique maintient cette pression. Dans le syndrome néphrotique, l’hypoalbuminémie abaisse la pression oncotique ; le liquide fuit alors vers l’interstitium, d’où l’œdème. Le volume plasmatique diminue (hypovolémie relative) et active le système rénine-angiotensine-aldostérone et la vasopressine, qui retiennent sodium et eau (hypothèse du sous-remplissage). L’autre mécanisme, la rétention primaire de sodium par activation d’ENaC, coexiste. La <button class="w" data-k="n04-oncotique">fenêtre sur Starling</button> en détaille les éléments.</p><h3 id="n04-s03-partie-2">2. Le sodium dans le tubule collecteur et les diurétiques</h3><p>Les protéases filtrées, dont la plasmine, clivent les sous-unités α et γ d’ENaC et l’activent : le sodium est réabsorbé de façon excessive. L’amiloride bloque ENaC. Comme KDIGO le rappelle, cet effet n’est pas validé par un essai randomisé. Les diurétiques de l’anse inhibent la réabsorption du sodium dans l’anse de Henle ; ils doivent donc atteindre l’anse sous forme active. En hypoalbuminémie, le volume de distribution est plus grand et le diurétique filtré se lie à l’albumine tubulaire : moins de médicament actif arrive à l’anse. S’ajoutent un phénomène de freinage aigu, une adaptation tubulaire chronique et l’œdème de la paroi intestinale, qui rend l’absorption orale incertaine. D’où la stratégie de combiner un diurétique de mécanisme différent et de passer à la voie intraveineuse.</p><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="1"] [data-n04-image]{max-width:650px}[data-n04-annotation="1-1"]{left:35%;top:30%}[data-n04-annotation="1-2"]{left:53%;top:65%}[data-n04-annotation="1-3"]{left:78%;top:70%}</style><figure data-n04-original="1"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/2618_Nephron_Secretion_Reabsorption.jpg" alt="Néphron normal et échanges tubulaires : dessin anatomique humain OpenStax College (2013)." loading="lazy"><span data-n04-annotation="1-1" aria-hidden="true">1</span><span data-n04-annotation="1-2" aria-hidden="true">2</span><span data-n04-annotation="1-3" aria-hidden="true">3</span></div><figcaption>Figure 8 — Néphron normal et échanges tubulaires : dessin anatomique humain OpenStax College (2013). <b>1.</b> Région proximale : réabsorption majeure de solutés et d’eau. <b>2.</b> Branche ascendante de l’anse ; distinguer son trajet de la branche descendante. <b>3.</b> Canal collecteur : ajustement final des échanges, selon le contexte hormonal. <a href="https://commons.wikimedia.org/wiki/File:2618_Nephron_Secretion_Reabsorption.jpg" target="_blank" rel="noopener">Original : OpenStax College</a>, <a href="https://creativecommons.org/licenses/by/3.0" target="_blank" rel="noopener">CC BY 3.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. Les noms et les doses des diurétiques ne proviennent pas de cette illustration : le texte du cours expose séparément leurs sites d’action et les informations professionnelles suisses. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure><p>La figure se lit de gauche à droite : le filtrat traverse les segments, et chaque classe agit sur un site précis. Elle situe la combinaison de mécanismes différents proposée par KDIGO en cas de résistance. Chez M. R., on associerait un diurétique de l’anse et, si nécessaire, un diurétique du tubule distal ou collecteur.</p><h3 id="n04-s03-partie-3">3. Une filtration paradoxalement réduite</h3><p>Dans les lésions minimes, la perméabilité aux petites molécules diminue : la filtration baisse d’environ 25 % de façon réversible. Comme la sécrétion tubulaire de créatinine augmente, les formules fondées sur la créatinine surestiment alors le débit de filtration. Le DFGe de 85 de M. R. doit donc être lu comme une borne haute.</p><div class="key"><b>À retenir.</b> Une pression oncotique basse et une activation d’ENaC se combinent dans l’œdème néphrotique. Corrélation science vers traitement : les diurétiques de l’anse agissent à l’anse de Henle, l’amiloride sur ENaC, et la combinaison vise deux sites. Corrélation science vers examen : le DFGe est surestimé, donc la créatinine rassure à tort.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p><div class="key"><b>Science → clinique.</b> Un œdème important peut coexister avec un volume circulant efficace diminué ; sa taille ne mesure pas la tolérance à une déplétion.</div><div class="key"><b>Science → examen.</b> Suivre poids, diurèse, pression artérielle, créatinine et électrolytes ; interpréter leur évolution conjointement.</div><div class="key"><b>Science → traitement.</b> Les sites tubulaires différents expliquent les associations de diurétiques, mais aussi le risque de déplétion et de troubles électrolytiques. Les doses relèvent des informations professionnelles et du contexte clinique.</div></section></div><div class="sci" id="n04-s04-sci" hidden><section class="ilot" id="n04-s04"><h2><span class="n">S04</span> Biochimie et coagulation</h2><h3 id="n04-s04-partie-1">1. Les lipoprotéines et la dyslipidémie</h3><p>Les lipides circulent dans des lipoprotéines : VLDL et IDL (contenant l’apolipoprotéine B), LDL et HDL. Dans le syndrome néphrotique, le cholestérol, les triglycérides et les lipoprotéines à apolipoprotéine B augmentent, tandis que l’activité de la lipoprotéine lipase (endothélium, muscle, tissu adipeux) et de la lipase hépatique diminue. La protéine PCSK9 est augmentée. Les HDL sont immatures et l’efflux de cholestérol est réduit. Cette synthèse provient d’une revue américaine utilisée pour la seule biochimie. Elle explique pourquoi les statines sont envisagées et pourquoi les inhibiteurs de PCSK9 existent parmi les non-statines.</p><p>Le tableau récapitule ces changements. Il répond à la question « quelle anomalie lipidique et pour quelle raison ? ». Lire la colonne du mécanisme.</p><table class="t"><thead><tr><th>Élément</th><th>Direction</th><th>Mécanisme</th></tr></thead><tbody><tr><td>Cholestérol, triglycérides</td><td>Augmentés</td><td>Hausse des lipoprotéines contenant l’apolipoprotéine B</td></tr><tr><td>VLDL et IDL</td><td>Augmentées</td><td>Dégradation réduite</td></tr><tr><td>Lipoprotéine lipase</td><td>Activité diminuée</td><td>Moins d’hydrolyse des triglycérides</td></tr><tr><td>Lipase hépatique</td><td>Activité diminuée</td><td>Hydrolyse hépatique des lipoprotéines réduite</td></tr><tr><td>PCSK9</td><td>Augmentée</td><td>Moins de récepteurs des LDL</td></tr><tr><td>HDL</td><td>Immatures, efflux de cholestérol réduit</td><td>Maturation et efflux de cholestérol perturbés</td></tr></tbody></table><p>La source relève les anomalies ; la colonne « Mécanisme » y associe leur conséquence biochimique classique. Pour M. R., ces anomalies expliquent le cholestérol total de 9,4 mmol/L, bien au-dessus de la valeur de référence de 5,18 mmol/L.</p><h3 id="n04-s04-partie-2">2. La coagulation</h3><p>L’antithrombine, de 65 kDa, passe dans l’urine : sa perte réduit l’anticoagulation naturelle. Les protéines procoagulantes de haut poids moléculaire (fibrinogène, facteurs V et VIII) s’élèvent dans le plasma. S’y ajoutent une thrombocytose fréquente et une fibrinolyse diminuée. Ainsi, l’héparine, qui agit par l’antithrombine, peut être moins efficace et exiger une dose plus élevée ; la <button class="w" data-k="n04-coagulation">fenêtre sur la coagulation</button> approfondit ce point.</p><div class="key"><b>À retenir.</b> Les lipoprotéines à apolipoprotéine B montent, l’antithrombine se perd, PLA2R est l’antigène de la majorité des néphropathies membraneuses primaires. Corrélation science vers examen : le dosage des anti-PLA2R évite parfois la biopsie. Corrélation science vers traitement : la perte d’antithrombine et la liaison des antivitamines K à l’albumine expliquent la difficulté de l’anticoagulation.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5770189/" target="_blank" rel="noopener">Agrawal et coll. 2018 — Nat Rev Nephrol 14:57–70</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3302669/" target="_blank" rel="noopener">Kerlin et coll. 2012 — Clin J Am Soc Nephrol 7:513–520</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-s">▲ Loi de Pareto — Sciences fondamentales</button><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="3"] [data-n04-image]{max-width:950px}[data-n04-annotation="3-1"]{left:65%;top:40%}[data-n04-annotation="3-2"]{left:20%;top:35%}</style><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="4"] [data-n04-image]{max-width:850px}[data-n04-annotation="4-1"]{left:49%;top:46%}</style><figure data-n04-original="4"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/Oval_Fat_Bodies_in_Urine_Microscopy.jpg" alt="Corps gras ovalaire dans un sédiment urinaire, microscopie optique." loading="lazy"><span data-n04-annotation="4-1" aria-hidden="true">1</span></div><figcaption>Figure S04 — Corps gras ovalaire dans un sédiment urinaire, microscopie optique. <b>1.</b> Cellule arrondie contenant de nombreuses gouttelettes réfringentes ; aspect compatible avec une lipidurie. <a href="https://commons.wikimedia.org/wiki/File:Oval_Fat_Bodies_in_Urine_Microscopy.jpg" target="_blank" rel="noopener">Original : Ajay Kumar Chaurasiya</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. La lumière polarisée n’est pas montrée : aucune croix de Malte ne peut être affirmée sur cette image. La lipidurie ne détermine pas à elle seule la cause de la protéinurie. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure><p>Cette photographie montre la traduction urinaire possible de l’accumulation lipidique ; elle ne quantifie pas les lipides plasmatiques et ne détermine pas la cause de la glomérulopathie.</p><div class="key"><b>Science → clinique.</b> Le risque de thrombose résulte de plusieurs modifications de l’hémostase ; une hypoalbuminémie ne constitue pas, isolément, une ordonnance d’anticoagulation.</div><div class="key"><b>Science → examen.</b> Les anti-PLA2R s’interprètent avec leur méthode, le contexte et la fonction rénale ; une négativité ne suffit pas à exclure une néphropathie membraneuse.</div><div class="key"><b>Science → traitement.</b> La prophylaxie anticoagulante confronte risque thrombotique et risque hémorragique ; les changements d’albuminémie peuvent modifier la pharmacocinétique et imposent une surveillance adaptée.</div></section></div><div class="sci" id="n04-s05-sci" role="tabpanel" aria-labelledby="n04-tab-immunogenetique" hidden><section class="ilot" id="n04-s05">
<h2><span class="n">S05</span> Immunologie et génétique : relier le mécanisme à l’enquête</h2>
<h3 id="n04-s04-partie-3">3. Auto-immunité, complément et génétique</h3><p>Dans la néphropathie membraneuse, les anticorps (surtout IgG4) ciblent des antigènes podocytaires : PLA2R (environ 75 % des formes primaires) et THSD7A (5 à 10 % des formes PLA2R-négatives). Les complexes immuns sous-épithéliaux activent le complément localement, ce qui laisse des dépôts de C3 et C4 et lèse les podocytes. L’association HLA-DQA1 et PLA2R n’implique pas d’hérédité mendélienne. Dans les lésions minimes, des anticorps anti-néphrine existent chez environ 30 % des patients d’une étude récente et le rituximab est efficace, ce qui suggère un rôle des lymphocytes B. Dans la hyalinose, des mutations de protéines podocytaires définissent les formes génétiques, et le génotype APOL1 à risque s’associe à la forme liée au SARS-CoV-2.</p>
<h3 id="n04-s05-partie-1">1. Un antigène, un anticorps et une lésion ne sont pas interchangeables</h3>
<p>Un antigène podocytaire est une structure du rein ; l’anticorps correspondant est un élément de la réponse immunitaire. Dans la néphropathie membraneuse associée aux anti-PLA2R, le dosage sérique recherche la réponse immunitaire, tandis que l’examen tissulaire peut rechercher l’antigène dans les dépôts. Ces mesures n’interrogent pas exactement le même compartiment et leurs évolutions peuvent être décalées. Le consensus autrichien recommande de préciser l’association antigénique lorsqu’elle est identifiée ; il rappelle que d’autres antigènes existent et que leur recherche n’est pas toujours disponible en routine. Un test négatif pour un antigène particulier ne signifie donc pas que toute néphropathie membraneuse est exclue.</p>
<p>Les complexes immuns sous-épithéliaux et l’activation locale du complément relient l’auto-immunité à l’altération podocytaire. La coloration argentique ci-dessous montre des parois capillaires ; elle ne permet pas de voir l’anticorps, de quantifier sa concentration sérique ou d’identifier l’antigène responsable. L’immunofluorescence et la microscopie électronique apportent des informations complémentaires. Cette distinction évite de lire un mécanisme moléculaire directement dans une photographie de microscopie optique. [ÖGN 2023, néphropathie membraneuse, introduction et diagnostic]</p>
<style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="3"] [data-n04-image]{max-width:950px}[data-n04-annotation="3-1"]{left:65%;top:40%}[data-n04-annotation="3-2"]{left:20%;top:35%}</style><figure data-n04-original="3"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/Membranous_nephropathy_-_mpas_-_very_high_mag.jpg" alt="Néphropathie membraneuse, coloration argentique : photographie histologique humaine." loading="lazy"><span data-n04-annotation="3-1" aria-hidden="true">1</span><span data-n04-annotation="3-2" aria-hidden="true">2</span></div><figcaption>Figure S05 — Néphropathie membraneuse, coloration argentique : photographie histologique humaine. <b>1.</b> Parois capillaires glomérulaires soulignées par l’argentation. <b>2.</b> Structures tubulaires autour du floculus, à distinguer des anses capillaires. <a href="https://commons.wikimedia.org/wiki/File:Membranous_nephropathy_-_mpas_-_very_high_mag.jpg" target="_blank" rel="noopener">Original : Nephron</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. L’identification fine de spicules exige le grossissement adéquat ; les dépôts sous-épithéliaux ne sont pas montrés en microscopie électronique ici. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure>
<h3 id="n04-s05-partie-2">2. Une image de hyalinose peut avoir plusieurs causes</h3>
<p>La hyalinose segmentaire et focale décrit un profil lésionnel qui peut résulter d’un processus immunitaire, d’une adaptation à une contrainte glomérulaire, d’une exposition ou d’une anomalie génétique. Le consensus autrichien indique que la quantité d’effacement des pédicelles ne suffit pas, à elle seule, à départager ces groupes : un effacement diffus n’exclut pas complètement une forme secondaire ou génétique. La proposition d’un facteur circulant de perméabilité est une hypothèse soutenue par certaines récidives précoces après transplantation et par la réponse à des traitements, mais le texte de 2023 ne reconnaît pas un facteur causal universel démontré. Une réponse thérapeutique ne prouve donc pas rétrospectivement un mécanisme unique.</p>
<p>Les formes héréditaires concernent notamment les protéines de la fente de filtration, le cytosquelette, la membrane basale et certaines voies métaboliques podocytaires. L’âge, les signes extrarénaux, l’histoire familiale et la résistance thérapeutique orientent l’enquête. Une histoire familiale négative n’exclut pas une cause génétique : transmission récessive, pénétrance incomplète et expression variable compliquent la lecture familiale. Un variant de signification incertaine ne doit pas être présenté comme un diagnostic certain ; son interprétation exige une confrontation spécialisée entre génétique, clinique et histologie. [ÖGN 2023, hyalinose segmentaire et focale, diagnostic et exploration génétique]</p>
<h3 id="n04-s05-partie-3">3. Conséquences pratiques et limites</h3>
<p>Une cause génétique identifiée peut modifier l’intérêt de l’immunosuppression, la recherche d’atteintes extrarénales, le conseil familial et l’évaluation d’un donneur apparenté. Ces conséquences justifient une démarche ciblée avec le spécialiste. Elles ne signifient pas qu’un panel négatif exclut toute cause héréditaire, ni que tous les variants découverts expliquent la maladie. Dans les lésions minimes, l’observation d’anticorps anti-néphrine rapportée par le consensus de 2023 reste attachée à la population de l’étude citée ; elle ne constitue pas ici un test de dépistage universel ni une estimation actuelle de toutes les formes néphrotiques.</p>
<div class="key"><b>Science → clinique.</b> La même présentation néphrotique peut résulter de mécanismes différents ; l’histoire familiale et les manifestations extrarénales complètent la description de l’œdème.</div>
<div class="key"><b>Science → examen.</b> Distinguer dosage d’anticorps, recherche tissulaire d’antigène, morphologie et analyse génétique ; chaque examen répond à une question et garde ses limites.</div>
<div class="key"><b>Science → traitement.</b> Une cause secondaire ou génétique peut rendre une immunosuppression inadaptée. Le mécanisme suspecté doit être confronté aux preuves avant d’exposer le patient à un traitement.</div>
<div class="key"><b>À retenir.</b> Un marqueur positif peut préciser une maladie ; un marqueur négatif ne l’efface pas nécessairement. Une morphologie n’est pas une étiologie, et un variant incertain n’est pas un diagnostic.</div>
<p class="src">Sources européennes, passages relus le 2 novembre 2026 : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse, introduction et diagnostic</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale, physiopathologie, diagnostic et exploration génétique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions minimes, physiopathologie</a>. Ces passages ne constituent pas une veille exhaustive des marqueurs postérieure à 2023.</p>
</section></div>

<div class="panel" id="pP" hidden><div class="chap-body"><section class="ilot" id="n04-p01"><h2><span class="n">P01</span> Classes, place et doses suisses</h2><h3 id="n04-p01-partie-1">1. Les classes et leur rôle</h3><p>Le traitement du syndrome néphrotique mobilise sept classes, chacune avec un rôle précis. Les diurétiques (furosémide, torasémide, spironolactone) traitent l’œdème. Les inhibiteurs de l’enzyme de conversion et les antagonistes de l’angiotensine II réduisent la protéinurie. La statine traite la dyslipidémie. Les anticoagulants (énoxaparine, antivitamines K) préviennent ou traitent la thrombose. Les glucocorticoïdes (prednisone, prednisolone, méthylprednisolone) et les immunosuppresseurs (ciclosporine, cyclophosphamide, rituximab, tacrolimus, mycophénolate mofétil) traitent la glomérulopathie. Le cotrimoxazole prévient la pneumocystose lorsqu’on le prescrit. L’albumine intraveineuse et l’inhibiteur de SGLT2 sont des options sous conditions. Le statut d’autorisation suisse de chaque produit est un critère de choix : certaines molécules sont prescrites en dehors de leur indication, ce qui est signalé dans les tableaux.</p><h3 id="n04-p01-partie-2">2. Médicaments autorisés dans l’indication néphrotique</h3><p>Le premier tableau liste les produits dont l’information professionnelle suisse mentionne le syndrome néphrotique. Il répond à la question « quelle dose la FI propose-t-elle ? ». Lire la dose initiale avant la dose maximale et vérifier la forme et le numéro d’autorisation ; l’erreur fréquente est d’appliquer à l’enfant une dose d’adulte.</p><table class="t"><thead><tr><th>Produit (n° d’autorisation)</th><th>Indication et dose de l’information professionnelle</th><th>Remarques</th></tr></thead><tbody><tr><td>Prednisone Streuli® 5, 20 et 50 mg (29349)</td><td>Syndrome néphrotique avec états œdémateux (diurèse, protéinurie du syndrome idiopathique non urémique ou lupique) ; dose habituelle 5 à 60 mg/jour en prise matinale unique, alternée ou intermittente</td><td>Seuil de Cushing 7,5 mg/jour ; arrêt progressif après plus de 8 à 10 jours ; pédiatrie : 25 % de la dose adulte (0–1 an), 50 % (2–7 ans), 75 % (8–12 ans)</td></tr><tr><td>Spiricort® (prednisolone) (38840)</td><td>Même indication néphrotique ; 80 à 120 mg/jour pour le traitement à dose élevée du syndrome néphrotique ; la FI limite habituellement ce traitement à dose élevée à 48–72 heures, jusqu’à stabilisation</td><td>Cette plage de la FI ne définit pas le protocole néphrologique prolongé. Les schémas pédiatriques en mg/m² de KDIGO 2025 sont distincts et relèvent de la décision spécialisée</td></tr><tr><td>Solu-Medrol® (méthylprednisolone) (35112)</td><td>Syndrome néphrotique idiopathique non urémique ou lupique ; doses de plus de 250 mg en au moins 30 minutes ; thérapie intermittente de 250 mg/jour ou plus pendant 5 jours au plus</td><td>Hépatites aiguës rapportées à partir d’environ 1 g/jour</td></tr><tr><td>Lasix® 40 mg comprimés (30629) et injectable (30630)</td><td>Œdèmes d’origine rénale : adulte ½ à 2 comprimés/jour au départ ; enfant 2 mg/kg/jour, maximum 40 mg/jour par voie orale ; par voie intraveineuse 20 à 40 mg puis +20 mg toutes les 2 h jusqu’à effet, enfant 1 mg/kg (maximum 20 mg/jour) ; maximum intraveineux 1500 mg/jour, réservé dans la FI aux situations de fonction rénale fortement diminuée</td><td>Titration prudente en hypoprotéinémie ; le traitement de la maladie de base est prioritaire</td></tr><tr><td>Torem® (48578)</td><td>Œdèmes du syndrome néphrotique : 20 mg le matin, jusqu’à 100 mg/jour</td><td>Contre-indiqué avant 12 ans</td></tr><tr><td>Aldactone® (27257)</td><td>Syndrome néphrotique lorsque la restriction hydrosodée et les diurétiques classiques échouent : 100 à 200 mg/jour (enfant 1,5 à 3 mg/kg/jour répartis)</td><td>Plein effet au 3e jour</td></tr><tr><td>Sandimmun Neoral® (52656, 52657)</td><td>Syndrome néphrotique idiopathique corticodépendant ou corticorésistant après échec d’une thérapie cytostatique standard et si la fonction rénale n’est pas de plus de 50 % sous la norme : induction 5 mg/kg/jour (adulte) ou 6 mg/kg/jour (enfant) en 2 prises</td><td>Si la créatinine initiale est anormale : maximum initial 2,5 mg/kg/jour, sous surveillance étroite, dans l’exception néphrotique de la FI ; seuils de créatinine 200 µmol/L (adulte) et 140 µmol/L (enfant). Arrêt si aucun effet après 3 mois</td></tr><tr><td>Endoxan® (25441, 25442)</td><td>Maladies auto-immunes d’évolution menaçante, dont le syndrome néphrotique : voie orale : 50 à 200 mg/jour (1 à 4 dragées), le matin, sans fractionner les dragées ; voie intraveineuse continue : 3 à 6 mg/kg/jour, intermittente : 10 à 15 mg/kg tous les 2 à 5 jours. Ces plages générales de la FI ne remplacent pas les protocoles néphrologiques spécifiques</td><td>Prescription par un spécialiste ; mesna au-delà de 10 mg/kg par voie intraveineuse</td></tr></tbody></table><p>Pour Léa, la dose de la FI du Spiricort® (80 à 120 mg/jour) est une dose d’adulte et ne s’applique pas : on utilise la dose pédiatrique en mg/m² de KDIGO 2025 (voir la <button class="w" data-k="n04-calc-mgm2">fenêtre de calcul</button>).</p><h3 id="n04-p01-partie-3">3. Médicaments à statut particulier ou hors indication</h3><p>Le second tableau liste les produits dont l’usage dans le syndrome néphrotique sort de l’indication suisse ou dont l’indication est différente. Il répond à la question « puis-je prescrire ce produit, et sous quelle responsabilité ? ». Lire d’abord la colonne du statut.</p><table class="t"><thead><tr><th>Produit (n° d’autorisation)</th><th>Indication suisse et dose</th><th>Statut dans le syndrome néphrotique</th></tr></thead><tbody><tr><td>Zestril® (lisinopril) (49297)</td><td>Hypertension, insuffisance cardiaque, infarctus aigu, diabète avec microalbuminurie ; hypertension : 10 mg/jour puis 20 mg/jour, maximum étudié 80 mg/jour</td><td>Antiprotéinurie du syndrome non diabétique : hors indication ; contre-indiqué pendant la grossesse</td></tr><tr><td>Cosaar® (losartan) (52904)</td><td>Néphropathie du diabète de type 2 hypertendu avec rapport albumine/créatinine ≥ 300 mg/g</td><td>Hors indication dans le syndrome non diabétique</td></tr><tr><td>Sortis® (atorvastatine) (54085)</td><td>10 mg/jour au départ, paliers d’au moins 4 semaines, maximum 80 mg/jour ; avec ciclosporine, au plus 10 mg/jour</td><td>Prescrite pour la dyslipidémie persistante ; Sortis n’est pas autorisé chez l’enfant ou l’adolescent ; contre-indiquée pendant la grossesse</td></tr><tr><td>Clexane® (énoxaparine) (49456, 54297)</td><td>Prophylaxie en médecine 40 mg par voie sous-cutanée par jour ; clairance &lt; 30 mL/min : 20 mg/jour ; thrombose veineuse : 1 mg/kg toutes les 12 h ; si clairance &lt; 30 mL/min, 1 mg/kg une fois par jour selon la FI</td><td>Prophylaxie propre au syndrome néphrotique : position d’experts (ÖGN), distincte des indications médicales aiguës et chirurgicales de la FI</td></tr><tr><td>Marcoumar® (19395) et Sintrom® (21693)</td><td>Phenprocoumone : INR 2,0 à 3,0 pour thrombose veineuse profonde et embolie pulmonaire ; acénocoumarol : INR habituellement 2 à 3, entretien 1 à 8 mg/jour</td><td>INR cible 1,5 à 2,5 de l’ÖGN en prophylaxie : hors cadre de la FI, position d’experts</td></tr><tr><td>Eliquis® (61549)</td><td>Prévention après prothèse de hanche ou de genou, fibrillation auriculaire non valvulaire, thrombose veineuse profonde et embolie pulmonaire</td><td>Aucune indication de prophylaxie du syndrome néphrotique : hors indication</td></tr><tr><td>MabThera® (54378)</td><td>Lymphomes, leucémie lymphoïde chronique, polyarthrite rhumatoïde, vascularites à ANCA, pemphigus ; vascularites : 375 mg/m² par semaine, 4 fois</td><td>Syndrome néphrotique : hors indication</td></tr><tr><td>Prograf™ (53152, 53153)</td><td>Transplantation (foie, rein, cœur)</td><td>Syndrome néphrotique : hors indication</td></tr><tr><td>CellCept® (53337, 53338, 54701, 54688)</td><td>Prévention du rejet de greffe (rein, cœur, foie)</td><td>Syndrome néphrotique : hors indication ; contre-indiqué pendant la grossesse</td></tr><tr><td>Bactrim forte® (48306)</td><td>Prophylaxie de la pneumocystose de l’adulte et de l’adolescent : 1 comprimé forte 3 fois par semaine</td><td>Prophylaxie sujette à contentieux (voir fenêtre)</td></tr><tr><td>Albunorm® (62660)</td><td>Restauration du volume circulant lorsque la perte est démontrée</td><td>Usage avec diurétique dans l’œdème réfractaire : hors indication</td></tr><tr><td>Forxiga® (65176)</td><td>Réduction du risque de progression d’une néphropathie chronique de l’adulte ; ne pas initier si DFGe &lt; 25</td><td>Non recommandé chez les patients néphropathes traités par immunosuppresseurs</td></tr></tbody></table><p>Le tableau montre que plusieurs traitements du syndrome néphrotique reposent sur des recommandations internationales plutôt que sur une autorisation suisse dans cette indication. Le prescripteur doit le dire au patient et privilégier la décision d’un centre spécialisé pour les schémas d’immunosuppression de la néphropathie membraneuse.</p><div class="key"><b>À retenir.</b> Prednisone, prednisolone, méthylprednisolone, furosémide, torasémide, spironolactone, ciclosporine et cyclophosphamide possèdent une indication néphrotique dans l’information professionnelle suisse. Le rituximab, le tacrolimus, le mycophénolate mofétil, les inhibiteurs de l’enzyme de conversion (hors diabète), l’albumine et les anticoagulants oraux directs sont hors indication dans ce contexte.</div><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680388400109" target="_blank" rel="noopener">Information professionnelle Swissmedic — Spiricort® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680351120812" target="_blank" rel="noopener">Information professionnelle Swissmedic — Solu-Medrol® (août 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle Swissmedic — Lasix® comprimés (mai 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680485781446" target="_blank" rel="noopener">Information professionnelle Swissmedic — Torem® (septembre 2019)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle Swissmedic — Aldactone® (août 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680526560283" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sandimmun Neoral® (janvier 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680254410362" target="_blank" rel="noopener">Information professionnelle Swissmedic — Endoxan® (février 2021)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680492970178" target="_blank" rel="noopener">Information professionnelle Swissmedic — Zestril® (avril 2024)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" target="_blank" rel="noopener">Information professionnelle Swissmedic — Cosaar® (avril 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sortis® (avril 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener">Information professionnelle Swissmedic — Clexane® (février 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680193950011" target="_blank" rel="noopener">Information professionnelle Swissmedic — Marcoumar® (octobre 2020)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680216930143" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sintrom® (novembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle Swissmedic — Eliquis® (août 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">Information professionnelle Swissmedic — MabThera® (décembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680531520234" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prograf® (décembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680533370011" target="_blank" rel="noopener">Information professionnelle Swissmedic — CellCept® (septembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680483060482" target="_blank" rel="noopener">Information professionnelle Swissmedic — Bactrim forte® (mars 2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680626600032" target="_blank" rel="noopener">Information professionnelle Swissmedic — Albunorm® (mars 2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle Swissmedic — Forxiga® (août 2026)</a>.</p></section><section class="ilot" id="n04-p02"><h2><span class="n">P02</span> Interactions, contre-indications et surveillance</h2><div class="alert"><b>Interactions dangereuses.</b> <b>(1) Ciclosporine et atorvastatine</b> : ne pas dépasser 10 mg/jour d’atorvastatine (exposition multipliée par 8,7). <b>(2) Spironolactone avec potassium, inhibiteur de l’enzyme de conversion, antagoniste de l’angiotensine II, AINS, héparines ou triméthoprime</b> : hyperkaliémie grave ; <b>ciclosporine avec inhibiteur de l’enzyme de conversion, antagoniste de l’angiotensine II ou épargneur de potassium</b> : hyperkaliémie. <b>(3) Ciclosporine et inhibiteurs ou inducteurs du CYP3A4</b> : macrolides, azolés, diltiazem et vérapamil augmentent le taux ; rifampicine, carbamazépine et millepertuis le diminuent ; le pamplemousse est à éviter. <b>(4) Prednisone et vaccins vivants</b> : contre-indiqué. <b>(5) Antivitamines K</b> : marge étroite, toute comédication modifie l’INR. <b>(6) Torasémide avec aminosides, céphalosporines ou cytostatiques platinés</b> : ototoxicité et néphrotoxicité majorées.</div><h3 id="n04-p02-partie-1">1. Contre-indications et surveillance par médicament</h3><p>Chaque médicament impose ses contre-indications et sa surveillance. Le tableau les résume. Il répond à la question « que vérifier avant de prescrire et pendant le traitement ? ». Lire d’abord les contre-indications, puis la surveillance.</p><table class="t"><thead><tr><th>Médicament</th><th>Contre-indications principales (FI)</th><th>Surveillance</th></tr></thead><tbody><tr><td>Prednisone (traitement prolongé)</td><td>Ulcères gastro-intestinaux, ostéoporose sévère, diabète de type 2, insuffisance rénale, hypertension sévère, antécédents psychiatriques, herpès ou zona virémique, varicelle, mycoses systémiques, glaucome, environ 8 semaines avant et 2 semaines après une vaccination</td><td>Kaliémie avec diurétiques hypokaliémiants, coagulation avec anticoagulants, glycémie, taux de ciclosporine, tendinopathies avec fluoroquinolones</td></tr><tr><td>Furosémide</td><td>Anurie, coma hépatique, hypokaliémie ou hyponatrémie sévères, hypovolémie, déshydratation, allaitement, allergie aux sulfamides</td><td>Créatinine, urée, potassium, calcium, chlore, bicarbonate</td></tr><tr><td>Aldactone®</td><td>Insuffisance rénale aiguë, clairance &lt; 30 mL/min, anurie, maladie d’Addison, hyperkaliémie, hyponatrémie</td><td>Potassium</td></tr><tr><td>Lisinopril</td><td>Angio-œdème, grossesse, aliskirène si diabète ou DFG &lt; 60, sacubitril/valsartan, racécadotril</td><td>Créatinine, potassium</td></tr><tr><td>Atorvastatine</td><td>Hépatopathie active, transaminases &gt; 3 fois la normale, cholestase, myopathie, grossesse, allaitement</td><td>Transaminases avant et pendant</td></tr><tr><td>Ciclosporine</td><td>Hors greffe : insuffisance rénale (sauf l’exception néphrotique), hypertension ou infections non contrôlées, cancer</td><td>Créatinine, taux résiduel, potassium</td></tr><tr><td>Cyclophosphamide</td><td>Insuffisance médullaire sévère, cystite, obstacle à l’écoulement urinaire, infections florides, grossesse et allaitement</td><td>Leucocytes entre J10 et J14, vessie, fertilité</td></tr><tr><td>Rituximab</td><td>Hypersensibilité, insuffisance cardiaque NYHA IV, hépatite B active</td><td>AgHBs et anti-HBc avant, IgG, réactions à la perfusion</td></tr><tr><td>Cotrimoxazole</td><td>Hypersensibilité aux sulfamides ou au triméthoprime, déficit en G6PD, atteinte hépatique grave, clairance &lt; 15 mL/min, troisième trimestre de grossesse</td><td>Potassium, hémogramme</td></tr><tr><td>Mycophénolate mofétil</td><td>Grossesse, femme en âge de procréer sans contraception hautement efficace</td><td>Contraception</td></tr></tbody></table><p>Une tension existe entre la FI et la pratique : la FI de la prednisone liste l’insuffisance rénale parmi les contre-indications du traitement prolongé, alors que KDIGO traite des lésions minimes avec insuffisance rénale aiguë. La décision se prend avec le néphrologue et la surveillance de la créatinine.</p><h3 id="n04-p02-partie-2">2. Le rituximab, le cyclophosphamide et le cotrimoxazole en pratique</h3><p>Avant le rituximab, le dépistage de l’hépatite B (AgHBs et anti-HBc) est obligatoire. Le consensus autrichien exige une prophylaxie antivirale (ténofovir ou entécavir) en cas d’antécédent d’hépatite B, débutée une semaine avant et poursuivie au moins un an après la dernière dose. Les IgG de base sont mesurées (hypogammaglobulinémie légère de 5 à 7 g/L, modérée de 3 à 5 g/L, sévère à 3 g/L ou moins). Les réactions à la perfusion surviennent chez environ 25 % des patients. La prémédication comprend le paracétamol (1000 mg), la (méthyl)prednisolone (50 à 100 mg) et la diphénhydramine (30 mg). Les vaccins se complètent avant le traitement, car la réponse vaccinale est ensuite altérée. En cas de protéinurie massive, le rituximab est perdu dans l’urine. Des leucoencéphalopathies multifocales progressives sont rapportées.</p><p>Le cyclophosphamide impose de mesurer les leucocytes entre J10 et J14 pour adapter la dose selon le nadir. Il réduit la fertilité selon la dose cumulée : conseil gynécologique et cryoconservation ; chez l’homme, la FI recommande la conservation du sperme et la contraception jusqu’à 6 mois après l’arrêt. Il provoque une cystite hémorragique par l’acroléine ; l’hydratation et l’administration le matin la préviennent. Le risque de cancers (cutanés non mélanomes, vessie, leucémie myéloïde) augmente au-delà de 36 g. La FI exige du mesna pour les doses intraveineuses supérieures à 10 mg/kg, alors que l’ÖGN le juge non obligatoire hors oncologie : la FI prime pour la prescription (voir la <button class="w" data-k="n04-contentieux-mesna">fenêtre dédiée</button>).</p><div class="key"><b>À retenir.</b> Quatre interactions dominent : ciclosporine avec statine, hyperkaliémie des épargneurs de potassium, inducteurs et inhibiteurs du CYP3A4, antivitamines K. Le rituximab impose le dépistage de l’hépatite B, le cyclophosphamide la surveillance des leucocytes et de la vessie, le cotrimoxazole celle du potassium. La grossesse contre-indique lisinopril, atorvastatine, mycophénolate, cyclophosphamide et phenprocoumone.</div><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle Swissmedic — Lasix® comprimés (mai 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle Swissmedic — Aldactone® (août 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680492970178" target="_blank" rel="noopener">Information professionnelle Swissmedic — Zestril® (avril 2024)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sortis® (avril 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680526560283" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sandimmun Neoral® (janvier 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680254410362" target="_blank" rel="noopener">Information professionnelle Swissmedic — Endoxan® (février 2021)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">Information professionnelle Swissmedic — MabThera® (décembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680483060482" target="_blank" rel="noopener">Information professionnelle Swissmedic — Bactrim forte® (mars 2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680533370011" target="_blank" rel="noopener">Information professionnelle Swissmedic — CellCept® (septembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680485781446" target="_blank" rel="noopener">Information professionnelle Swissmedic — Torem® (septembre 2019)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680193950011" target="_blank" rel="noopener">Information professionnelle Swissmedic — Marcoumar® (octobre 2020)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></section><section class="ilot" id="n04-p03"><h2><span class="n">P03</span> Monographies en fenêtres et Pareto</h2><h3 id="n04-p03-partie-1">1. Monographies en fenêtres</h3><p>Chaque fenêtre résume un médicament : mécanisme, essais cités dans les sources, posologie, effets indésirables, contre-indications et surveillance. Elles se consultent à la prescription.</p><p><button class="w" data-k="n04-mono-prednisone">Prednisone et prednisolone</button> <button class="w" data-k="n04-mono-furosemide">Furosémide et diurétiques</button> <button class="w" data-k="n04-mono-ciclosporine">Ciclosporine</button> <button class="w" data-k="n04-mono-rituximab">Rituximab</button> <button class="w" data-k="n04-mono-cyclophosphamide">Cyclophosphamide</button> <button class="w" data-k="n04-mono-avk-hbpm">Antivitamines K et héparines de bas poids moléculaire</button> <button class="w" data-k="n04-mono-spironolactone">Spironolactone</button> <button class="w" data-k="n04-mono-atorvastatine">Atorvastatine</button> <button class="w" data-k="n04-mono-cotrimoxazole">Cotrimoxazole</button></p><h3 id="n04-p03-partie-2">2. Médicaments à éviter ou à ne pas débuter</h3><p>Quatre prescriptions sont à éviter : les anti-inflammatoires non stéroïdiens (néphrotoxiques, hyperkaliémie avec la spironolactone, ulcères avec la prednisone) ; un bloqueur du système rénine-angiotensine lors d’un début brutal ; l’aspirine comme seule prévention de la thrombose veineuse ; et l’immunosuppression d’une hyalinose sans syndrome néphrotique. La <button class="w" data-k="n04-contentieux-sglt2">fenêtre sur l’inhibiteur de SGLT2</button> précise pourquoi on ne l’enseigne pas comme standard sous immunosuppression.</p><div class="key"><b>À retenir.</b> Les monographies guident la prescription. À éviter : AINS, bloqueur du système rénine-angiotensine lors d’un début brutal, aspirine seule contre la thrombose veineuse, immunosuppression d’une hyalinose sans syndrome néphrotique.</div><button class="pareto-btn ui" data-k="pareto-n04-p">▲ Loi de Pareto — Pharmacologie du syndrome néphrotique</button></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div></div></template>
<template data-pop="n04-filtration" data-title="Barrière de filtration glomérulaire"><p>Le glomérule filtre le plasma à travers trois couches successives : l’endothélium fenêtré du capillaire, la membrane basale glomérulaire et la couche des podocytes. Les podocytes sont des cellules épithéliales post-mitotiques et terminalement différenciées. Leurs pédicelles s’interdigitent avec ceux des podocytes voisins ; les espaces qui les séparent sont fermés par un diaphragme de fente. Cet ensemble laisse passer l’eau et les petites molécules (urée, créatinine) et retient les grosses protéines, dont l’albumine.</p><p>Dans le syndrome néphrotique, la lésion podocytaire se traduit d’abord par l’aplatissement des pédicelles et la perte des diaphragmes de fente, avec une protéinurie massive. La perte des podocytes et leur détachement de la membrane basale conduisent à la sclérose segmentaire. La conséquence pratique est simple : la protéinurie néphrotique signale une perte de sélectivité du filtre, et non un manque de production de l’albumine.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-oncotique" data-title="Pression oncotique et forces de Starling"><p>Un capillaire échange du liquide avec l’interstitium sous l’effet de deux forces opposées. La pression hydrostatique du sang pousse le liquide hors du vaisseau. La pression oncotique, exercée par les protéines plasmatiques, surtout l’albumine, retient le liquide dans le vaisseau. Ce sont les forces de Starling.</p><p>Les protéines totales sériques de référence se situent entre 64 et 83 g/L (18–60 ans) et l’albumine entre 31 et 45 g/L chez l’adulte (Viollier). Chez M. R., l’albumine de 19 g/L est inférieure de 12 g/L à la limite basse de référence : la pression oncotique plasmatique est abaissée, et le liquide sort du capillaire. Cette fuite appauvrit le volume plasmatique, ce qui active le système rénine-angiotensine-aldostérone et la vasopressine : le rein retient alors du sodium et de l’eau et l’œdème se majore. Le liquide perdu reste dans l’interstitium, il ne revient pas dans le plasma tant que l’albumine reste basse.</p><p>Limite : l’hypothèse du sous-remplissage explique une partie seulement de l’œdème, car la rétention primaire de sodium par activation d’ENaC coexiste.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-calc-rpc" data-title="Calcul : le rapport protéines/créatinine"><p><b>Ce que représente chaque grandeur.</b> Les protéines urinaires se mesurent en milligrammes par litre. La créatinine urinaire se mesure en millimoles par litre : l’organisme en produit une quantité à peu près constante par jour, de sorte que sa concentration dans l’urine varie surtout avec la dilution de l’urine.</p><p><b>Pourquoi diviser l’une par l’autre.</b> Une urine concentrée contient plus de protéines et plus de créatinine ; une urine diluée en contient moins des deux. Le rapport annule la dilution et estime donc la protéinurie de 24 heures à partir d’un seul échantillon. KDIGO fait correspondre une protéinurie de 3,5 g/24 h et un rapport de 3000 mg/g (300 mg/mmol).</p><p><b>Formule et unités.</b> Rapport (mg/mmol) = protéines urinaires (mg/L) ÷ créatinine urinaire (mmol/L).</p><p><b>Exemple chiffré.</b> Protéines : 2400 mg/L ; créatinine : 6 mmol/L. Étape 1 : 2400 ÷ 6 = 400. Étape 2 : l’unité est mg/mmol. Résultat : 400 mg/mmol, supérieur à 300 mg/mmol (rang néphrotique de l’adulte). La valeur de référence de Viollier est inférieure à 15 mg/mmol : le résultat est plus de vingt-six fois cette limite.</p><p><b>Conversion mg/g et mg/mmol.</b> La créatinine a une masse molaire d’environ 113 g/mol : 1 g de créatinine contient environ 8,84 mmol. Un rapport « par gramme » se divise donc par 8,84 pour devenir un rapport « par millimole ». Exemple : 4200 mg/g ÷ 8,84 ≈ 475 mg/mmol. Les recommandations arrondissent à une division par 10 (3000 mg/g ↔ 300 mg/mmol ; 200 mg/g ↔ 20 mg/mmol), soit environ 420 mg/mmol pour 4200 mg/g. Dans les deux cas, le résultat dépasse 300 mg/mmol. Pour M. R., 650 mg/mmol équivalent à environ 5750 mg/g par la multiplication exacte ou 6500 mg/g avec l’arrondi.</p><p><b>Limites.</b> La production de créatinine varie avec le sexe, le régime, l’origine et la condition physique ; un rapport isolé est imparfait. D’où la récolte de 24 heures avant d’initier ou d’intensifier une immunosuppression, ou le rapport sur une aliquote d’une récolte de 24 heures. La figure source de KDIGO donne la protéinurie non néphrotique par un rapport inférieur à 30 mg/mmol, ce qui ne coïncide pas exactement avec 3,4 g/24 h ; la valeur en grammes par 24 heures est retenue.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-calc-albumine" data-title="Calcul : la méthode de dosage de l’albumine"><p><b>Le problème.</b> Deux appareils peuvent donner deux valeurs différentes pour le même sérum. Le vert de bromocrésol donne des valeurs supérieures d’environ 5,5 g/L à celles du pourpre de bromocrésol (BCP), de l’électrophorèse capillaire ou de l’immunonéphélométrie. Le seuil d’hypoalbuminémie dépend donc de la méthode.</p><p><b>Règle de conversion.</b> Seuil au pourpre ≈ seuil au vert − 5 g/L. KDIGO arrondit 25 g/L au vert à 20 g/L au pourpre, et 32 g/L au vert à 30 g/L au pourpre. Le laboratoire Viollier utilise le pourpre : sa valeur de référence est de 31 à 45 g/L chez l’adulte ; avec la néphélométrie, elle est de 35 à 52 g/L.</p><p><b>Exemples.</b> M. R. : 19 g/L au pourpre, soit environ 24 g/L au vert (19 + 5) : il est sous les deux seuils de 20 et 25 g/L. Autre patient : 22 g/L au pourpre, soit environ 27 g/L au vert : au-dessus de 20 g/L (pourpre), donc l’indication de prophylaxie dépend des autres facteurs.</p><p><b>Limite.</b> Il faut toujours vérifier la méthode du laboratoire avant de comparer à un seuil.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-calc-sel" data-title="Calcul : sodium, millimoles et sel de cuisine"><p><b>Grandeurs.</b> Les recommandations expriment la limite de sodium alimentaire de deux manières : KDIGO en grammes de sodium (moins de 2,0 g/jour) et en millimoles (moins de 90 mmol/jour) ; la Société suisse de néphrologie en grammes de sel (moins de 5 g/jour).</p><p><b>Bases de chimie.</b> La masse molaire du sodium est de 23 g/mol ; celle du chlorure de sodium, de 58,4 g/mol. Le sodium représente donc environ 39 % de la masse du sel (23 ÷ 58,4).</p><p><b>Formules.</b> mmol = mg ÷ 23 ; sel (g) ≈ sodium (g) × 2,54.</p><p><b>Exemple.</b> 2,0 g de sodium = 2000 mg ÷ 23 ≈ 87 mmol (soit environ 90 mmol), et 2,0 × 2,54 ≈ 5,1 g de sel. Les deux cibles coïncident.</p><p><b>Limite.</b> Les masses molaires sont des constantes de chimie, non tirées des sources médicales lues.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN — dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n04-cim" data-title="Codage CIM-10-GM : N04 et ses sous-codes"><p>La CIM-10-GM 2024 (version française suisse de l’Office fédéral de la statistique) classe le syndrome néphrotique en N04. L’inclusion comprend le syndrome néphrotique congénital et la néphrose lipoïdique. Le quatrième caractère est commun aux catégories N00 à N07 : .0 à .8 décrivent la morphologie, .9 le type non précisé.</p><p><b>Règle.</b> Les subdivisions .0 à .8 ne doivent normalement être utilisées qu’après identification précise par biopsie rénale ou autopsie ; la catégorie à trois caractères désigne le syndrome clinique. Conséquence pédagogique : un enfant traité sans biopsie reste codé N04.9.</p><p><b>Codes supplémentaires du bloc N00–N08.</b> I12 ou I13 pour une maladie rénale hypertensive, N18 pour une maladie rénale chronique, N17 ou N19 pour une insuffisance rénale aiguë ou non précisée, chapitre des causes externes pour la cause externe. Les glomérulopathies au cours de maladies classées ailleurs relèvent de N08 (N08.3 au cours du diabète sucré, E10 à E14, avec le quatrième caractère .2).</p><p class="src">Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">OFS — CIM-10-GM 2024, version française (31.10.2024)</a>.</p></template>
<template data-pop="n04-pla2r" data-title="Anticorps anti-PLA2R et anti-THSD7A : seuils et unités"><p>PLA2R est le récepteur de type M de la phospholipase A2, un antigène du podocyte ; THSD7A est la protéine à domaine de type 1 de la thrombospondine, de type 7A (« thrombospondin type-1 domain-containing 7A »). Les anticorps dirigés contre ces antigènes forment des complexes immuns sous-épithéliaux, surtout d’IgG4, dans la néphropathie membraneuse : anti-PLA2R dans environ 75 % des formes primaires, anti-THSD7A dans 5 à 10 % des formes PLA2R-négatives.</p><p>Le tableau suivant distingue quatre seuils qu’il ne faut pas confondre.</p><table class="t"><thead><tr><th>Seuil</th><th>Valeur</th><th>Signification</th><th>Source</th></tr></thead><tbody><tr><td>Valeur de référence</td><td>&lt; 14 U/mL (anti-PLA2R) ; &lt; 10 (anti-THSD7A)</td><td>Normal selon le laboratoire</td><td>Viollier</td></tr><tr><td>Seuil diagnostique sans biopsie</td><td>&gt; 20 unités relatives par ml (ELISA Euroimmun) ou immunofluorescence indirecte positive</td><td>Renoncer à la biopsie si DFGe &gt; 60 et autres causes exclues</td><td>ÖGN 2023</td></tr><tr><td>Seuil de risque</td><td>&gt; 50 RU/ml (non validé)</td><td>Critère de risque élevé</td><td>KDIGO 2021</td></tr><tr><td>Cible de rémission immunologique</td><td>&lt; 2 RU/ml (ELISA) ou immunofluorescence négative</td><td>Rémission immunologique complète</td><td>KDIGO 2021, ÖGN</td></tr></tbody></table><p>Une méta-analyse (710 patients, 1502 témoins) rapporte une sensibilité de 0,78 et une spécificité de 0,99. Un résultat positif est donc très évocateur ; un résultat négatif n’exclut pas la maladie. Les dosages sont disponibles au CHUV (ELISA, deux fois par mois, délai 1 à 2 semaines, analyse accréditée) et chez Viollier (ELISA, deux fois par mois, délai de 2 semaines). <b>Piège :</b> les unités (U/mL, unités relatives par ml, RU/ml) appartiennent chacune à une méthode ; les seuils de la littérature ne se transposent pas sans vérifier la méthode du laboratoire.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a> ; <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/download/DLA_INV_01_00380?no_cache=1" target="_blank" rel="noopener">CHUV — catalogue des analyses, anticorps anti-PLA2R (V12, 27.09.2023)</a>.</p></template>
<template data-pop="n04-mcd" data-title="Lésions glomérulaires minimes"><p>Les lésions glomérulaires minimes sont une cause de 10 à 25 % des syndromes néphrotiques de l’adulte (KDIGO) et de loin la cause la plus fréquente chez l’enfant. La microscopie optique est normale ; la microscopie électronique montre un effacement étendu des pédicelles sans dépôts denses. La pathogenèse est incomplètement connue : dysrégulation des lymphocytes T, rôle des lymphocytes B (suggéré par l’efficacité du rituximab), anticorps anti-néphrine chez environ 30 % des patients d’une étude récente. Le début est brutal, en jours à semaines. Le traitement repose sur les glucocorticoïdes à forte dose, avec rémission chez 80 à 90 % des adultes. Code : N04.0.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p></template>
<template data-pop="n04-fsgs" data-title="Hyalinose segmentaire et focale"><p>La hyalinose segmentaire et focale désigne une sclérose d’un segment (segmentaire) de certains glomérules seulement (focale). Environ 9 % des biopsies rénales de l’adulte en Europe la montrent ; la forme primaire est la deuxième cause de syndrome néphrotique de l’adulte, mais la forme adaptative secondaire est probablement la plus fréquente. Trois groupes existent : primaire (syndrome néphrotique complet, effacement diffus des pédicelles), secondaire (protéinurie néphrotique avec albumine supérieure à 30 g/L) et génétique (familial, syndromique, avant 1 an, corticorésistance). Seule la forme primaire reçoit une immunosuppression. Code : N04.1.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-mn" data-title="Néphropathie membraneuse"><p>La néphropathie membraneuse est une glomérulonéphrite à complexes immuns sous-épithéliaux. Elle représente environ 30 % des syndromes néphrotiques de l’adulte, avec un pic aux 4e et 5e décennies et un sex-ratio de 2 hommes pour 1 femme. Elle est primaire dans 70 à 80 % des cas (anti-PLA2R dans environ 75 %) et secondaire dans 20 à 30 % (hépatite B, cancers, médicaments, lupus). Un tiers des patients entre en rémission spontanée. Le risque de thrombose y est maximal. Code : N04.2.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a>.</p></template>
<template data-pop="n04-enac" data-title="Le canal sodique épithélial ENaC et la plasmine"><p>ENaC est un canal qui réabsorbe le sodium dans le néphron distal. Il se compose de sous-unités α, β et γ. Dans le syndrome néphrotique, des sérine-protéases filtrées, surtout la plasmine (formée à partir du plasminogène par l’activateur de type urokinase), clivent les sous-unités α et γ : le canal devient actif et retient du sodium. Ce mécanisme est indépendant du système rénine-angiotensine-aldostérone et explique la rétention de sodium chez des patients à rénine et aldostérone basses. L’amiloride bloque ENaC ; KDIGO précise que cet effet n’est pas validé par un essai randomisé. Une partie des preuves provient de modèles murins.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-lipides" data-title="Dyslipidémie néphrotique : lipoprotéines, LPL et PCSK9"><p>Les lipoprotéines transportent le cholestérol et les triglycérides : VLDL et IDL (riches en triglycérides, contenant l’apolipoprotéine B), puis LDL, puis HDL. La lipoprotéine lipase (LPL), située sur l’endothélium du muscle et du tissu adipeux, hydrolyse les triglycérides des VLDL. Dans le syndrome néphrotique, son activité diminue, ainsi que celle de la lipase hépatique ; la protéine PCSK9, qui régule les récepteurs des LDL, augmente. Les HDL sont immatures et l’efflux de cholestérol est réduit. Chez M. R., le cholestérol total (9,4 mmol/L) dépasse nettement la valeur de référence de 5,18 mmol/L. Une valeur de laboratoire comme le LDL inférieur à 2,60 mmol/L n’est pas une cible thérapeutique. Cette synthèse repose sur une revue américaine employée pour la seule biochimie, sans décision clinique.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5770189/" target="_blank" rel="noopener">Agrawal et coll. 2018 — Nat Rev Nephrol 14:57–70</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-coagulation" data-title="Hypercoagulabilité du syndrome néphrotique"><p>L’antithrombine, protéine de 65 kDa qui inhibe la coagulation, passe dans l’urine. Les protéines procoagulantes de haut poids moléculaire (fibrinogène, facteurs V et VIII) augmentent dans le plasma, la thrombocytose est fréquente et la fibrinolyse diminue. L’activité de l’antithrombine de référence (Viollier) est de 83 à 118 %. Conséquence : l’héparine, dont l’effet passe par l’antithrombine, peut être moins efficace ; KDIGO note qu’une dose plus élevée que d’habitude peut être nécessaire. Le risque est maximal dans la néphropathie membraneuse et pendant les 6 premiers mois.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3302669/" target="_blank" rel="noopener">Kerlin et coll. 2012 — Clin J Am Soc Nephrol 7:513–520</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-orthostatique" data-title="Protéinurie orthostatique"><p>Certains sujets, souvent jeunes, éliminent des protéines seulement en position debout. La première urine du matin, recueillie après le décubitus, ne contient alors pas de protéines. Piège : un rapport sur la première urine du matin sous-estime la protéinurie de 24 heures d’environ 20 % et manque cette forme. Pour la détecter, on recueille séparément la première urine du matin et on mesure son rapport protéines/créatinine. Cette forme ne s’accompagne ni d’hypoalbuminémie ni d’œdème.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-resistance" data-title="Résistance aux diurétiques de l’anse"><p>Un diurétique de l’anse doit atteindre l’anse de Henle sous forme active. Trois mécanismes limitent sa dose active dans le syndrome néphrotique : (1) un volume de distribution plus grand en hypoalbuminémie ; (2) la liaison du diurétique filtré à l’albumine tubulaire ; (3) l’œdème de la paroi intestinale, qui rend l’absorption orale incertaine. S’ajoutent le phénomène de freinage aigu (réponse atténuée après une dose) et l’adaptation tubulaire chronique. La stratégie suit le niveau de résistance : doubler la dose, passer au torasémide ou au bumétanide, associer un diurétique de mécanisme différent, utiliser la voie intraveineuse en perfusion continue, enfin l’ultrafiltration ou l’hémodialyse.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-rein-eponge" data-title="Captation rénale précoce des anticorps (« rein puits »)"><p>Au début de la maladie, les anticorps anti-PLA2R peuvent se fixer sur les podocytes et rester indétectables dans le sérum : les anticorps seraient initialement captés par leurs antigènes rénaux (hypothèse dite « kidney as a sink » ou « rein puits »). Cette expression ne désigne pas le rein médullaire en éponge, qui est une autre affection. À l’inverse, après la rémission immunologique, l’antigène reste visible dans la biopsie plus longtemps que les anticorps sériques. La protéinurie suit la rémission immunologique avec un retard de plusieurs mois. Conséquence : un test sérique négatif n’exclut pas la maladie, et la protéinurie qui persiste après la négativation des anticorps ne signifie pas un échec du traitement.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a>.</p></template>
<template data-pop="n04-iec-debut-brutal" data-title="Pourquoi ne pas débuter un bloqueur lors d’un début brutal"><p>Un syndrome néphrotique à début brutal est le plus souvent une lésion minime, qui répond aux corticoïdes. Dans cette situation, la filtration est déjà réduite et le patient peut être hypovolémique. Un inhibiteur de l’enzyme de conversion ou un antagoniste de l’angiotensine II dilate l’artériole efférente et abaisse la pression de filtration : il peut déclencher une insuffisance rénale aiguë. KDIGO recommande donc de ne pas les débuter lors d’un début brutal, et d’en différer l’introduction chez le non-hypertendu dont la podocytopathie répondra vite à l’immunosuppression. Une fois l’état stabilisé, ils reprennent leur place pour réduire la protéinurie.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-anticoag" data-title="Arbre de décision de la prophylaxie anticoagulante"><p>La décision suit cinq étapes. <b>1. Thrombose avérée ?</b> Si oui, anticoagulation curative pendant 6 à 12 mois et/ou la durée du syndrome néphrotique. <b>2. Albumine, avec sa méthode.</b> Convertir la valeur : 25 g/L au vert de bromocrésol valent environ 20 g/L au pourpre ou en immunodosage. <b>3. Facteurs de risque thrombotique.</b> Au moins un parmi : protéinurie supérieure à 10 g/jour, IMC supérieur à 35 kg/m², prédisposition génétique, insuffisance cardiaque NYHA III ou IV, chirurgie orthopédique ou abdominale récente, immobilisation prolongée ; la néphropathie membraneuse confère un risque particulièrement élevé. <b>4. Risque hémorragique.</b> Contre-indications relatives : préférence ou adhérence, diathèse hémorragique, lésion cérébrale à risque, mutations modifiant les antivitamines K, fragilité avec chutes, antécédent d’hémorragie digestive. <b>5. Choix du traitement.</b> Héparine de bas poids moléculaire à faible dose, puis relais par antivitamine K ; l’aspirine ne prévient pas la thrombose veineuse ; les anticoagulants oraux directs sont hors indication ; l’arrêt est envisagé quand l’albumine remonte durablement au-dessus de 25 à 30 g/L.</p><p>Dans l’algorithme KDIGO de la néphropathie membraneuse : albumine inférieure à 25 g/L (vert) ou 20 g/L (pourpre) avec risque veineux élevé : évaluer le saignement, antivitamine K si risque faible. Albumine inférieure à 32 g/L (vert) ou 30 g/L (pourpre) : estimer le risque artériel (Framingham, DFGe, diabète, antécédents) ; aspirine si plus de 20 pour 1000 patients-années. Cet algorithme est une opinion d’experts dont la valeur hors néphropathie membraneuse est inconnue. Les glucocorticoïdes augmentent eux-mêmes le risque thrombotique.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></template>
<template data-pop="n04-calc-anticoag" data-title="Calcul : doses d’énoxaparine et anti-Xa"><p><b>Grandeurs.</b> L’énoxaparine se prescrit en milligrammes ; son activité se mesure en unités internationales anti-Xa (UI), c’est-à-dire par l’inhibition du facteur Xa de la coagulation. Équivalence : 20 mg = 2000 UI ; 40 mg = 4000 UI.</p><p><b>Doses.</b> Prophylaxie en médecine : 40 mg par voie sous-cutanée une fois par jour ; clairance de la créatinine inférieure à 30 mL/min : 20 mg une fois par jour (FI suisse Clexane® et consensus autrichien). Traitement de la thrombose veineuse : 1 mg/kg toutes les 12 heures ; si la clairance de la créatinine est inférieure à 30 mL/min, la FI prévoit 1 mg/kg une fois par jour.</p><p><b>Contrôle.</b> Cible de l’anti-Xa selon le consensus autrichien : 0,3 à 0,5 UI/ml mesurés 4 heures après la dose, sans dépasser 0,8. Un contrôle est recommandé en cas de DFGe inférieur à 30, d’IMC supérieur à 40, de maigreur ou de grossesse.</p><p><b>Exemple.</b> Patient dont la clairance de la créatinine est de 25 mL/min, en prophylaxie : 20 mg par jour, soit 2000 UI, avec un anti-Xa à contrôler. Patient de 85 kg, sans insuffisance rénale sévère, en traitement d’une thrombose : 85 mg toutes les 12 heures (1 mg/kg). Le DFGe indexé en mL/min/1,73 m² ne doit pas être substitué sans examen à une clairance en mL/min pour l’adaptation du produit.</p><p><b>Limite.</b> L’usage dans la prophylaxie du syndrome néphrotique est une position d’experts, non une indication de la FI.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener">Information professionnelle Swissmedic — Clexane® (février 2026)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></template>
<template data-pop="n04-calc-prednisone" data-title="Calcul : la dose de prednisone de l’adulte"><p><b>Principe.</b> La dose initiale est de 1 mg par kilogramme et par jour, calculée sur le poids sec, c’est-à-dire le poids avant les œdèmes (ÖGN), plafonnée à 80 mg (KDIGO) ou 60 mg (ÖGN, recommandations nationales et essai TURING). Formule : dose = minimum de (1 mg × poids sec) et du plafond.</p><p><b>Pourquoi le poids sec.</b> Les œdèmes ajoutent des kilogrammes d’eau qui ne reçoivent pas le médicament : les inclure surdoserait.</p><p><b>Exemple.</b> Patient de 78 kg secs (86 kg avec œdèmes). Étape 1 : 1 mg × 78 = 78 mg. Étape 2 : comparer au plafond. Selon KDIGO, 78 mg (inférieur à 80) ; selon l’ÖGN, 60 mg. Dans les deux cas, le poids avec œdèmes (86 mg) ne sert pas. La FI suisse de la Prednisone Streuli® propose des comprimés sécables de 5, 20 et 50 mg et autorise des doses plus élevées que les doses habituelles de 5 à 60 mg/jour ; la FI de Spiricort® cite 80 à 120 mg/jour pour le traitement à dose élevée du syndrome néphrotique.</p><p><b>Interprétation.</b> La différence entre 60 et 80 mg est une divergence entre sources, non une erreur ; voir la <button class="w" data-k="n04-contentieux-prednisone">fenêtre « contentieux »</button>.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680388400109" target="_blank" rel="noopener">Information professionnelle Swissmedic — Spiricort® (juin 2026)</a>.</p></template>
<template data-pop="n04-calc-mgm2" data-title="Calcul : la dose pédiatrique en mg/m²"><p><b>Bases.</b> La surface corporelle (en m²) intègre la taille et le poids de l’enfant. Dosée par surface, la prednisone évite de sous-doser le jeune enfant, car le métabolisme d’un petit enfant est relativement plus rapide que celui d’un adulte. La formule de calcul de la surface n’a pas été lue dans les sources : la surface est donnée comme une donnée de l’exemple.</p><p><b>Formules (KDIGO 2025).</b> Dose quotidienne = 60 mg × surface (m²), plafonnée à 60 mg. Dose un jour sur deux = 40 mg × surface, plafonnée à 40 mg. Alternative au poids : 2 mg/kg/jour (maximum 60 mg) puis 1,5 mg/kg (maximum 40 mg) un jour sur deux.</p><p><b>Exemple.</b> Léa, surface 0,7 m². Étape 1 : 60 × 0,7 = 42 mg par jour, inférieur au plafond de 60 mg, pendant 4 semaines (ou 6). Étape 2 : 40 × 0,7 = 28 mg un jour sur deux pendant 4 semaines (ou 6). Durée totale : 8 semaines (ou 12 semaines).</p><p><b>Limite.</b> Au-delà de 12 semaines, les effets indésirables augmentent sans réduire les rechutes (KDIGO 2025).</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a>.</p></template>
<template data-pop="n04-calc-ciclo" data-title="Calcul : ciclosporine et créatinine"><p><b>Bases.</b> La ciclosporine peut léser le rein de façon dose-dépendante ; on surveille donc la créatinine. La FI de Sandimmun Neoral® fixe l’induction à 5 mg/kg/jour chez l’adulte, en 2 prises, et la règle d’adaptation à la créatinine : réduire de 25 à 50 % si elle dépasse de plus de 30 % la valeur initiale.</p><p><b>Formules.</b> Dose initiale = 5 mg × poids. Seuil d’alerte = créatinine de base × 1,30.</p><p><b>Exemple.</b> Adulte de 70 kg : 5 × 70 = 350 mg par jour (175 mg deux fois). Créatinine de base 80 µmol/L : seuil 80 × 1,30 = 104 µmol/L. À 110 µmol/L, on réduit la dose à 175 à 263 mg par jour (350 × 0,5 et 350 × 0,75). Le taux résiduel cible vient de KDIGO (100 à 175 ng/ml dans la hyalinose).</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680526560283" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sandimmun Neoral® (janvier 2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
