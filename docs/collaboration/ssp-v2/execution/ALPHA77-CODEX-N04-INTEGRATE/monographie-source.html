mab</td><td>1 g par voie intraveineuse, deux fois à 2 semaines d’intervalle, ou 375 mg/m² 1 à 4 fois, une fois par semaine</td></tr><tr><td>Tacrolimus</td><td>0,05 à 0,1 mg/kg/jour (cible 3 à 8 ng/ml) pendant 12 mois</td></tr><tr><td>Ciclosporine</td><td>3,5 mg/kg/jour (cible 125 à 225 ng/ml)</td></tr><tr><td>Inefficaces</td><td>Mycophénolate mofétil en monothérapie ; corticoïdes seuls</td></tr></tbody></table><p>Le cyclophosphamide a une dose cumulée limitée à moins de 36 g (risque de cancer), en pratique à 25 g au plus et à 10 g au plus si le patient souhaite conserver sa fertilité ; la dose est divisée par deux si le DFGe est inférieur à 50. La position européenne diffère : le consensus autrichien réserve l’immunosuppression au syndrome néphrotique sans rémission spontanée 6 à 9 mois après le début (immédiate en cas de perte rapide de fonction, de complication grave ou de titres très élevés), choisit le rituximab en monothérapie en première intention (1000 mg initialement si syndrome néphrotique, puis selon la cinétique des anti-PLA2R jusqu’à moins de 2 unités relatives par ml) et restreint davantage les anticalcineurines (ciclosporine 80 à 175 ng/ml, tacrolimus 5 à 8 ng/ml). Il ne traite pas si le DFGe reste inférieur à 30 ou si la fibrose est marquée. Les réponses à 6 mois atteignent 70 à 90 % (essais GEMRITUX, MENTOR, STARMEN et RI-CYCLO). En Suisse, le rituximab est hors indication, tandis que le cyclophosphamide possède l’indication « maladies auto-immunes d’évolution menaçante, p. ex. syndrome néphrotique » ; la <button class="w" data-k="n04-contentieux-mn">fenêtre de contentieux</button> expose l’arbitrage.</p><h3 id="n04-a10-partie-5">5. Syndrome néphrotique de l’enfant</h3><p>Pour le premier épisode, KDIGO 2025 recommande la prednisone ou la prednisolone orale à 60 mg/m²/jour ou 2 mg/kg/jour (maximum 60 mg/jour) pendant 4 semaines, puis 40 mg/m² ou 1,5 mg/kg (maximum 40 mg) un jour sur deux pendant 4 semaines, soit 8 semaines au total, ou 6 plus 6 semaines, soit 12 semaines. Au-delà de 12 semaines, les effets indésirables augmentent sans réduction des rechutes. Une prise unique quotidienne est possible. Le dosage par surface corporelle évite de sous-doser le jeune enfant, comme le montre le <button class="w" data-k="n04-calc-mgm2">calcul pédiatrique</button> : pour Léa, de surface 0,7 m², la dose est de 42 mg par jour.</p><p>Lors d’une rechute, la prednisone est reprise à 60 mg/m²/jour ou 2 mg/kg/jour jusqu’à rémission complète pendant au moins 3 jours, puis à 40 mg/m² ou 1,5 mg/kg un jour sur deux pendant 4 semaines. Il n’y a pas de corticothérapie quotidienne systématique lors des infections (1C). En cas de rechutes fréquentes sans toxicité, une prednisone alternée à faible dose (jusqu’à 0,5 mg/kg/dose) est possible. En cas de rechutes fréquentes avec toxicité grave et pour toute corticodépendance, un agent d’épargne s’impose (1B) : anticalcineurine pendant au moins 12 mois (ciclosporine 4 à 5 mg/kg/jour, taux résiduel 60 à 150 ng/ml ; tacrolimus 0,1 mg/kg/jour, 5 à 10 ng/ml), cyclophosphamide oral 2 mg/kg/jour pendant 12 semaines (cumul maximal 168 mg/kg, un seul cycle), lévamisole 2,5 mg/kg un jour sur deux (maximum 150 mg), mycophénolate mofétil 1200 mg/m²/jour ou rituximab 375 mg/m² 1 à 4 fois (après dépistage de l’hépatite B et de la tuberculose). La corticorésistance relève de la ciclosporine ou du tacrolimus en deuxième ligne (1C). Aucune information professionnelle suisse n’a été trouvée pour le lévamisole : il est présenté comme non autorisé en Suisse selon cette recherche.</p><div class="quiz ui"><p>Léa, 4 ans, corticosensible, rechute 3 semaines après l’arrêt de la prednisone avec une bandelette à 3+ pendant 3 jours consécutifs. Que faire ?</p><button data-ok="1">Reprendre la prednisone à 60 mg/m²/jour (ou 2 mg/kg/jour, maximum 60 mg) jusqu’à rémission complète d’au moins 3 jours, puis 40 mg/m² un jour sur deux pendant 4 semaines.</button><button data-ok="0">Débuter d’emblée un cyclophosphamide car toute rechute impose un immunosuppresseur d’épargne.</button><p class="fb" hidden>Une rechute isolée se traite par prednisone reprise à dose standard. L’agent d’épargne est réservé aux rechutes fréquentes avec toxicité grave et à la corticodépendance.</p></div><div class="key"><b>À retenir.</b> Les lésions minimes de l’adulte répondent à 1 mg/kg/jour de prednisone (maximum 80 mg selon KDIGO, 60 mg selon l’ÖGN) ; la hyalinose primaire reçoit le même schéma, la secondaire non. La néphropathie membraneuse se traite selon le risque : attente, rituximab, cyclophosphamide ou anticalcineurine. L’enfant reçoit 60 mg/m²/jour puis 40 mg/m² un jour sur deux ; on parle de rechute après une rémission complète, de corticorésistance après 4 semaines sans rémission.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">Information professionnelle Swissmedic — MabThera® (décembre 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680254410362" target="_blank" rel="noopener">Information professionnelle Swissmedic — Endoxan® (février 2021)</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-a4">▲ Loi de Pareto — Traitements de soutien et spécifiques</button></section><section class="ilot" id="n04-a11"><h2><span class="n">A11</span> Suivi, pronostic et situations particulières</h2><h3 id="n04-a11-partie-1">1. Suivre la réponse</h3><p>Après le début du traitement, le médecin mesure la protéinurie et l’albumine aux rythmes qui correspondent à la définition de la réponse. Dans la néphropathie membraneuse, le suivi immunologique repose sur les anticorps anti-PLA2R tous les 3 à 6 mois selon KDIGO (plus souvent si les titres sont élevés) ; le consensus autrichien les mesure toutes les 4 à 12 semaines jusqu’à négativation, puis tous les 3 mois pendant 2 à 3 ans, puis chaque année. Leur disparition précède la rémission clinique et doit faire renoncer à un traitement supplémentaire : la rémission immunologique complète se définit par un taux inférieur à 2 RU/ml (ELISA) ou une immunofluorescence indirecte négative, contrôlée 6 mois après le début du traitement. La protéinurie suit la rémission immunologique avec un retard de plusieurs mois, et l’hypothèse de captation rénale précoce des anticorps (« rein puits ») explique pourquoi les anticorps sériques peuvent manquer au début ou disparaître avant l’antigène de la biopsie (voir la <button class="w" data-k="n04-rein-eponge">fenêtre dédiée</button>). Sous rituximab, les IgG se mesurent tous les 6 mois ; en cas d’antécédent d’hépatite B, les transaminases et la PCR du virus se contrôlent tous les 3 mois jusqu’à un an après l’arrêt.</p><p>Pour la fonction rénale, une baisse du DFGe d’au moins 40 % sur 2 à 3 ans est proposée comme critère substitutif d’insuffisance rénale.</p><h3 id="n04-a11-partie-2">2. Grossesse</h3><p>La grossesse d’une femme atteinte de glomérulopathie exige une coordination entre néphrologie et obstétrique, idéalement avant la conception. La maladie et la pression doivent être contrôlées avant de planifier ; le DFG à la conception est le principal prédicteur de l’issue. L’aspirine à faible dose (60 à 150 mg) est à envisager après le premier trimestre pour réduire le risque de prééclampsie. Plusieurs médicaments du syndrome sont contre-indiqués selon les informations professionnelles suisses : lisinopril, atorvastatine, mycophénolate mofétil, cyclophosphamide et phenprocoumone. La prednisone et la prednisolone sont à préférer si un glucocorticoïde est indispensable, car elles ont le plus faible passage placentaire. Le cyclophosphamide impose en outre une conservation de la fertilité (voir l’îlot 10).</p><h3 id="n04-a11-partie-3">3. Enfant et sujet âgé</h3><p>Chez l’enfant corticosensible avec une vitamine D normale, la supplémentation n’est pas requise. En revanche, la prévention de la perte minérale osseuse par calcium et vitamine D se justifie dans les formes à rechutes fréquentes ou corticodépendantes, ou en cas de carence. KDIGO ne recommande pas de protection gastrique systématique par inhibiteur de la pompe à protons en l’absence de facteur de risque. Le syndrome persiste à l’âge adulte dans 15 à 25 % des cas, ce qui impose un relais de suivi.</p><p>Chez le sujet âgé, les lésions minimes prennent une forme atypique (hypertension, fonction rénale altérée) et justifient un dépistage des cancers adapté à l’âge, car néoplasies et lésions minimes s’associent.</p><h3 id="n04-a11-partie-4">4. Insuffisance rénale : adapter les médicaments</h3><p>L’insuffisance rénale change les doses et les contre-indications. Le tableau les rassemble. Il répond à la question « quel médicament ajuster à quel niveau de filtration ? ». Lire la ligne du médicament puis le seuil ; l’erreur fréquente est de laisser une dose fixe quand le DFGe baisse.</p><table class="t"><thead><tr><th>Médicament</th><th>Seuil ou situation</th><th>Conduite</th></tr></thead><tbody><tr><td>Énoxaparine — prophylaxie</td><td>Clairance &lt; 30 mL/min</td><td>20 mg par voie sous-cutanée par jour (au lieu de 40 mg) ; anti-Xa à contrôler (ÖGN)</td></tr><tr><td>Ciclosporine (Sandimmun Neoral®)</td><td>Créatinine initiale augmentée ; créatinine &gt; 30 % au-dessus de la base</td><td>Dose initiale maximale 2,5 mg/kg/jour ; réduire de 25 à 50 % ; contre-indiquée en insuffisance rénale hors exception néphrotique</td></tr><tr><td>Cotrimoxazole (Bactrim forte®)</td><td>DFGe &lt; 30 (ÖGN) ; clairance &lt; 15 mL/min</td><td>La FI prévoit une demi-dose pour une clairance de 15 à 30 mL/min ; ne pas utiliser si clairance &lt; 15 mL/min. Ne pas assimiler sans vérification clairance en mL/min et DFGe indexé</td></tr><tr><td>Spironolactone (Aldactone®)</td><td>Clairance &lt; 30 mL/min</td><td>Contre-indiquée</td></tr><tr><td>Furosémide (Lasix®)</td><td>Anurie, hypovolémie</td><td>Contre-indiqué ; titration prudente en hypoprotéinémie</td></tr><tr><td>Immunosuppression</td><td>DFGe &lt; 30 persistant ou fibrose marquée (ÖGN)</td><td>Pas d’immunosuppression dans la néphropathie membraneuse</td></tr></tbody></table><p>Pour M. R., les doses de l’énoxaparine resteraient à 40 mg tant que le DFGe est supérieur à 30.</p><h3 id="n04-a11-partie-5">5. Retour au cas fil rouge</h3><p>M. R. présente une néphropathie membraneuse à anticorps nettement positifs. Le diagnostic s’appuie sur le rapport de 650 mg/mmol, l’albumine de 19 g/L et les anti-PLA2R, sans biopsie. Son risque se classe selon le tableau KDIGO : une albumine inférieure à 25 g/L au pourpre de bromocrésol compte parmi les critères du risque élevé si la protéinurie reste supérieure à 3,5 g/jour après six mois de traitement néphroprotecteur, tout comme un titre d’anti-PLA2R supérieur à 50 RU/ml dans la méthode concernée. Le traitement de soutien démarre sans attendre : régime sans sel, diurétique de l’anse, inhibiteur de l’enzyme de conversion si l’évolution n’est pas brutale, statine si la dyslipidémie persiste, et prophylaxie anticoagulante discutée puisque l’albumine est inférieure à 20 g/L. L’immunosuppression, rituximab en première intention en Europe, est décidée avec un centre spécialisé. Léa, corticosensible, est suivie jusqu’à l’âge adulte : une rechute se reconnaît à une bandelette à 3+ pendant 3 jours consécutifs et se traite par la prednisone ; trois rechutes en 12 mois définiraient des rechutes fréquentes et conduiraient à discuter un agent d’épargne.</p><div class="key"><b>À retenir.</b> Le suivi s’appuie sur des définitions chiffrées de la réponse et, dans la néphropathie membraneuse, sur les anti-PLA2R. La grossesse se prépare avec la néphrologie et l’obstétrique ; plusieurs médicaments sont contre-indiqués. L’insuffisance rénale impose d’adapter les doses d’énoxaparine, de ciclosporine, de cotrimoxazole et de spironolactone.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680526560283" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sandimmun Neoral® (janvier 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener">Information professionnelle Swissmedic — Clexane® (février 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680483060482" target="_blank" rel="noopener">Information professionnelle Swissmedic — Bactrim forte® (mars 2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle Swissmedic — Aldactone® (août 2025)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle Swissmedic — Lasix® comprimés (mai 2025)</a>.</p></section><section class="ilot" id="n04-a12"><h2><span class="n">A12</span> Critères formels du diagnostic et paramètres clés</h2><h3 id="n04-a12-partie-1">1. Critères formels du diagnostic</h3><div class="alert"><b>Critères formels du diagnostic.</b> <b>Adulte (KDIGO 2021)</b> : protéinurie d’au moins 3,5 g/24 h ou rapport protéines/créatinine d’au moins 300 mg/mmol (3000 mg/g) <i>et</i> hypoalbuminémie (valeur propre à la méthode du laboratoire) ; œdème et hyperlipidémie variables. <b>Enfant de 1 à 18 ans (KDIGO 2025)</b> : rapport d’au moins 200 mg/mmol (2 g/g) ou au moins 1000 mg/m²/jour, <i>et</i> albumine inférieure à 30 g/L ou œdème si l’albumine n’est pas disponible. <b>Néphropathie membraneuse</b> : syndrome néphrotique avec anticorps anti-PLA2R nettement positifs (supérieurs à 20 unités relatives par ml en ELISA ou immunofluorescence indirecte positive) et DFGe supérieur à 60 mL/min/1,73 m² : biopsie non nécessaire si les autres causes sont exclues (ÖGN ; KDIGO : surtout si DFGe normal). <b>Lésions minimes de l’adulte</b> : diagnostic par biopsie seulement. <b>Codage</b> : N04.0 à N04.8 uniquement après identification précise par biopsie ou autopsie ; sans biopsie, N04.9.</div><h3 id="n04-a12-partie-2">2. Paramètres clés à connaître par cœur</h3><div class="key"><b>Paramètres clés.</b> <ul><li>Valeur normale du rapport protéines/créatinine urinaire : inférieure à 15 mg/mmol (Viollier) ; seuil néphrotique de l’adulte : 300 mg/mmol (KDIGO).</li><li>Albumine sérique, méthode au pourpre de bromocrésol : 31 à 45 g/L chez l’adulte (Viollier). Seuils de thrombose : 20 g/L (pourpre) ou 25 g/L (vert).</li><li>Anticorps anti-PLA2R : valeur de référence inférieure à 14 U/mL (Viollier) ; diagnostic sans biopsie au-dessus de 20 unités relatives par ml (ÖGN) ; marqueur de risque au-dessus de 50 RU/ml (KDIGO, non validé) ; rémission immunologique inférieure à 2 RU/ml.</li><li>Prednisone de l’adulte : 1 mg/kg/jour, maximum 80 mg (KDIGO) ou 60 mg (ÖGN) ; enfant : 60 mg/m²/jour, maximum 60 mg.</li><li>Ciclosporine : réduire de 25 à 50 % si la créatinine dépasse de plus de 30 % la valeur de base.</li><li>Cyclophosphamide : dose cumulée inférieure à 36 g, en pratique 25 g au plus, 10 g au plus si fertilité souhaitée.</li><li>Pièges : le DFGe est surestimé ; les D-dimères ne guident pas la prophylaxie ; les inhibiteurs de l’enzyme de conversion ne se débutent pas lors d’un début brutal ; un test anti-PLA2R négatif n’exclut pas la maladie ; les unités des laboratoires (U/mL, unités relatives par ml, RU/ml) ne sont pas interchangeables sans vérifier la méthode.</li></ul></div><h3 id="n04-a12-partie-3">3. Retour à M. R. et à Léa</h3><p>M. R. remplit les critères adultes (650 mg/mmol, albumine 19 g/L), la néphropathie membraneuse est portée par les anti-PLA2R et son DFGe de 85 mL/min/1,73 m² permet d’envisager l’absence de biopsie si les anticorps sont nettement positifs avec la méthode considérée et si les autres causes ont été exclues. Léa remplit les critères pédiatriques (bandelette 3+, œdème), répond à la prednisone en moins de 4 semaines et reste codée N04.9. Les deux diagnostics reposent sur l’ensemble des critères de l’encadré, et non sur un seul chiffre.</p><button class="pareto-btn ui" data-k="pareto-n04-a5">▲ Loi de Pareto — Suivi, particularités et critères formels</button></section><section class="ilot" id="n04-annexe-cim"><h2><span class="n">Annexe</span> Correspondance nosologique suisse</h2><h3 id="n04-a02-partie-4">CIM-10-GM 2024 : un syndrome et dix sous-codes</h3><p>La catégorie N04 « Syndrome néphrotique » inclut le syndrome néphrotique congénital et la néphrose lipoïdique. Son quatrième caractère suit la liste commune du bloc N00–N08. Une règle de codage s’impose : les subdivisions .0 à .8 ne s’emploient normalement qu’après identification précise de la lésion par biopsie rénale ou autopsie ; la catégorie à trois caractères désigne le syndrome clinique. Un enfant traité sans biopsie reste donc codé N04.9. La <button class="w" data-k="n04-cim">fenêtre de codage</button> détaille cette règle et les codes supplémentaires.</p><p>Le tableau donne la lésion que désigne chaque sous-code. Il aide à relier un compte rendu de biopsie à un code, et inversement. Lire la colonne de la morphologie avant celle de l’exemple : seuls quatre sous-codes ont un exemple clinique dans les sources lues.</p><table class="t"><thead><tr><th>Code</th><th>Lésion (libellé OFS)</th><th>Exemple clinique</th></tr></thead><tbody><tr><td>N04.0</td><td>Anomalies glomérulaires mineures</td><td>Lésions glomérulaires minimes</td></tr><tr><td>N04.1</td><td>Lésions glomérulaires segmentaires et focales (hyalinose ou sclérose segmentaire et focale, glomérulonéphrite focale)</td><td>Hyalinose segmentaire et focale</td></tr><tr><td>N04.2</td><td>Glomérulonéphrite membraneuse diffuse</td><td>Néphropathie membraneuse</td></tr><tr><td>N04.3</td><td>Glomérulonéphrite mésangio-proliférative diffuse</td><td>Définie par la morphologie</td></tr><tr><td>N04.4</td><td>Glomérulonéphrite proliférative endocapillaire diffuse</td><td>Définie par la morphologie</td></tr><tr><td>N04.5</td><td>Glomérulonéphrite mésangiocapillaire diffuse (membranoproliférative types 1 et 3, ou non précisée)</td><td>Définie par la morphologie</td></tr><tr><td>N04.6</td><td>Maladie à dépôt dense (membranoproliférative type 2)</td><td>Définie par la morphologie</td></tr><tr><td>N04.7</td><td>Glomérulonéphrite diffuse en croissant (extracapillaire)</td><td>Glomérulonéphrite à croissants</td></tr><tr><td>N04.8</td><td>Autres modifications morphologiques (proliférative non précisée)</td><td>Définie par la morphologie</td></tr><tr><td>N04.9</td><td>Type de modification morphologique non précisé</td><td>Syndrome clinique sans biopsie, par exemple l’enfant corticosensible</td></tr></tbody></table><p>Les sources ne chiffrent aucune fréquence par sous-code ; aucune n’est donnée ici. Un patient comme M. R., biopsié et porteur de dépôts membraneux, serait codé N04.2 ; Léa, jamais biopsiée, resterait N04.9.</p><p class="src">Source : Office fédéral de la statistique, CIM-10-GM 2024 française, nomenclature du 31 octobre 2024 ; catégorie N04 et table commune des sous-codes N00–N07 relues le 2 novembre 2026. La nomenclature décrit les lésions et ne remplace pas la démarche clinique.</p></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div>
<div class="panel" id="pE" hidden><div class="chap-body"><section class="ilot" id="n04-e01"><h2><span class="n">E01</span> Quantifier la protéinurie et l’albumine</h2><h3 id="n04-e01-partie-1">1. Quel examen pour quelle question</h3><p>Chaque examen répond à une question précise ; le tableau les associe et indique leur statut. L’examen de référence pour décider d’une immunosuppression est la récolte des urines de 24 heures ; l’examen de référence pour identifier la forme est la biopsie rénale. Lire d’abord la question, puis le statut ; l’erreur fréquente est de demander tous les examens du tableau chez chaque patient, alors que plusieurs sont conditionnels.</p><table class="t"><thead><tr><th>Question</th><th>Examen</th><th>Statut</th></tr></thead><tbody><tr><td>La protéinurie est-elle présente ?</td><td>Bandelette urinaire (3+ ou 4+ évoque le rang néphrotique chez l’enfant)</td><td>Indiqué</td></tr><tr><td>Quelle est son importance ?</td><td>Rapport protéines/créatinine urinaire</td><td>Indiqué</td></tr><tr><td>Faut-il initier ou intensifier une immunosuppression ?</td><td>Récolte des urines de 24 heures (examen de référence) ou rapport sur une aliquote d’une récolte de 24 heures</td><td>Conditionnel</td></tr><tr><td>L’albumine est-elle basse ?</td><td>Albumine sérique, avec la méthode du laboratoire</td><td>Indiqué</td></tr><tr><td>Le rapport albumine/créatinine est-il utile ?</td><td>Rapport albumine/créatinine urinaire (dépistage et adressage selon la Société suisse de néphrologie)</td><td>Conditionnel</td></tr><tr><td>Quelle est la forme ?</td><td>Anticorps anti-PLA2R (tout adulte au premier épisode), puis biopsie rénale (examen de référence de la forme)</td><td>Indiqué ; biopsie conditionnelle</td></tr><tr><td>Le sédiment oriente-t-il vers une glomérulonéphrite ?</td><td>Examen du sédiment urinaire</td><td>Indiqué</td></tr><tr><td>Faut-il décider d’une prophylaxie anticoagulante ?</td><td>Albumine, facteurs de risque ; les D-dimères ne guident pas la décision</td><td>D-dimères non systématiques</td></tr></tbody></table><p>Pour M. R., le rapport de 650 mg/mmol et l’albumine suffisent à confirmer le syndrome ; une récolte de 24 heures devient nécessaire dès que l’on envisage une immunosuppression, pour étalonner le rapport.</p><h3 id="n04-e01-partie-2">2. Les trois mesures de la protéinurie</h3><p>La bandelette, le rapport protéines/créatinine et la récolte de 24 heures n’ont ni la même précision ni les mêmes pièges. La bandelette est qualitative : elle lit une concentration, qui varie avec la dilution de l’urine, et dépend du fabricant (3+ correspond à 300 à moins de 1000 mg/dl, 4+ à au moins 1000 mg/dl). Le rapport protéines/créatinine divise la concentration de protéines par celle de la créatinine du même échantillon, ce qui annule la dilution ; il reste imparfait, car la production de créatinine varie selon le sexe, le régime, l’origine et la condition physique. La récolte de 24 heures évite ces biais mais dépend de la complétude du recueil. L’albumine représente environ 65 % de la protéinurie totale en moyenne, davantage dans les lésions minimes : la protéinurie totale et l’albuminurie ne sont donc pas interchangeables.</p><div class="quiz ui"><p>Un adulte a une concentration urinaire de protéines de 2400 mg/L et de créatinine de 6 mmol/L. Quel est son rapport protéines/créatinine et est-il de rang néphrotique ?</p><button data-ok="1">400 mg/mmol (2400 ÷ 6) : supérieur à 300 mg/mmol, donc de rang néphrotique chez l’adulte.</button><button data-ok="0">40 mg/mmol : inférieur à 300, donc non néphrotique.</button><p class="fb" hidden>Le rapport est 2400 ÷ 6 = 400 mg/mmol, soit plus de vingt-six fois la limite de 15 mg/mmol. Un résultat de 400 est supérieur à 300 : il suffit au critère protéinurique de l’adulte.</p></div><h3 id="n04-e01-partie-3">3. La gradation de la protéinurie</h3><p>Une valeur normale, un seuil diagnostique et une cible se distinguent. Le tableau gradue la protéinurie : il répond à la question « à quel niveau en est ce patient ? ». Lire d’abord la ligne qui contient la valeur, puis le contexte. L’erreur fréquente est de comparer un rapport en mg/g à un seuil en mg/mmol : la conversion se fait par la division par 8,84, que les recommandations arrondissent à une division par 10 (voir la <button class="w" data-k="n04-calc-rpc">fenêtre de calcul</button>).</p><table class="t"><thead><tr><th>Niveau</th><th>Mesure (adulte)</th><th>Mesure (enfant)</th><th>Signification</th></tr></thead><tbody><tr><td>Normal</td><td>Rapport protéines/créatinine &lt; 15 mg/mmol (Viollier, urine spontanée, 2e urine du matin) ; rapport albumine/créatinine &lt; 3 mg/mmol</td><td>Non précisé dans les sources lues</td><td>Valeur de référence du laboratoire</td></tr><tr><td>Albuminurie</td><td>Rapport albumine/créatinine ≥ 3 mg/mmol (SSN)</td><td>Non précisé</td><td>Marqueur de lésion rénale ; adressage si &gt; 30 mg/mmol</td></tr><tr><td>Protéinurie non néphrotique</td><td>0,3 à 3,4 g/24 h, albumine normale, sans symptôme</td><td>Non précisé</td><td>Pas de syndrome néphrotique</td></tr><tr><td>Rang néphrotique</td><td>≥ 3,5 g/24 h ou rapport ≥ 300 mg/mmol (3000 mg/g)</td><td>Rapport ≥ 200 mg/mmol (2 g/g) ou ≥ 1000 mg/m²/jour ; bandelette 3+ ou 4+</td><td>Seuil diagnostique, avec hypoalbuminémie</td></tr><tr><td>Rémission complète</td><td>&lt; 0,3 g/jour ou rapport &lt; 30 mg/mmol</td><td>Rapport ≤ 20 mg/mmol ou bandelette négative ou traces</td><td>Cible de traitement</td></tr></tbody></table><p>Exemple : M. R. (650 mg/mmol) se situe plus de deux fois au-dessus du seuil de 300 mg/mmol. Une valeur exprimée en mg/g, par exemple 4200 mg/g, vaut environ 475 mg/mmol par la division exacte et environ 420 mg/mmol avec l’arrondi décimal : dans les deux cas elle dépasse 300.</p><h3 id="n04-e01-partie-4">4. Intervalles de référence suisses et méthodes</h3><p>Les valeurs de référence proviennent des laboratoires Viollier et dépendent de la méthode, de l’âge et du sexe. Le tableau les rassemble pour que l’on puisse lire un résultat ; il répond à la question « cette valeur est-elle normale ? ». Les seuils diagnostiques de KDIGO ne se confondent pas avec ces valeurs de référence.</p><table class="t"><thead><tr><th>Paramètre</th><th>Valeur de référence</th><th>Population ou méthode</th><th>Usage</th></tr></thead><tbody><tr><td>Albumine sérique</td><td>31 à 45 g/L</td><td>Adultes ≥ 19 ans, pourpre de bromocrésol (35–45 g/L à 1–7 ans, 37–47 g/L à 8–14 ans, 35–49 g/L chez les filles et 38–50 g/L chez les garçons de 15–18 ans)</td><td>Méthode à utiliser avec les seuils KDIGO « pourpre de bromocrésol » (20 et 30 g/L)</td></tr><tr><td>Albumine sérique (néphélométrie)</td><td>35 à 52 g/L</td><td>Adultes</td><td>L’intervalle dépend de la méthode</td></tr><tr><td>Protéines totales sériques</td><td>64 à 83 g/L (18–60 ans) ; 62 à 81 g/L (≥ 61 ans) ; 60 à 80 g/L (3–18 ans)</td><td>Biuret</td><td>Hypoprotidémie</td></tr><tr><td>Cholestérol total</td><td>&lt; 5,18 mmol/L</td><td>Adultes</td><td>Dyslipidémie néphrotique</td></tr><tr><td>Cholestérol LDL calculé</td><td>&lt; 2,60 mmol/L</td><td>Adultes</td><td>Valeur de laboratoire, distincte d’une cible thérapeutique</td></tr><tr><td>Triglycérides</td><td>&lt; 1,70 mmol/L (≥ 20 ans) ; &lt; 1,71 (13–19 ans) ; &lt; 1,14 (0–12 ans)</td><td>À jeun 12 h</td><td>Dyslipidémie</td></tr><tr><td>Antithrombine (activité)</td><td>83 à 118 %</td><td>Adultes</td><td>Base biochimique de l’hypercoagulabilité</td></tr><tr><td>Fraction C3 du complément</td><td>0,83–1,93 g/L (femmes ≥ 15 ans) ; 0,82–1,85 g/L (hommes ≥ 15 ans) ; 0,82–1,73 (filles 0–14) ; 0,80–1,70 (garçons 0–14)</td><td>Selon âge et sexe</td><td>C3 bas : autre glomérulopathie (KDIGO 2025)</td></tr><tr><td>Fraction C4 du complément</td><td>0,15–0,57 g/L (femmes ≥ 15 ans) ; 0,15–0,53 g/L (hommes ≥ 15 ans) ; 0,13–0,46 (filles 0–14) ; 0,14–0,44 (garçons 0–14)</td><td>Selon âge et sexe</td><td>Lupus, glomérulonéphrite membranoproliférative</td></tr><tr><td>Anticorps anti-PLA2R</td><td>&lt; 14 U/mL</td><td>ELISA, 2 fois par mois, délai 2 semaines</td><td>Voir la <button class="w" data-k="n04-pla2r">fenêtre sur les seuils</button></td></tr><tr><td>Anticorps anti-THSD7A</td><td>&lt; 10</td><td>Viollier</td><td>Néphropathie membraneuse PLA2R-négative</td></tr></tbody></table><p>Une albumine de 22 g/L, au pourpre de bromocrésol, est donc inférieure à la limite basse de 31 g/L mais supérieure au seuil de 20 g/L de KDIGO ; ces deux repères répondent à deux questions différentes : l’hypoalbuminémie (valeur de référence) et le risque thrombotique (seuil de décision). La <button class="w" data-k="n04-calc-albumine">fenêtre sur la méthode</button> convertit les valeurs.</p><div class="key"><b>À retenir.</b> La question guide l’examen : le rapport protéines/créatinine quantifie, la récolte de 24 heures décide de l’immunosuppression, la biopsie identifie la forme. Il faut toujours noter la méthode de dosage de l’albumine et distinguer valeur de référence, seuil diagnostique et cible.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN — dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></section><section class="ilot" id="n04-e02"><h2><span class="n">E02</span> Bilan étiologique, sédiment et complications</h2><h3 id="n04-e02-partie-1">1. Le sédiment urinaire</h3><p>Le sédiment urinaire se lit au microscope. Les hématies glomérulaires sont déformées (acanthocytes) et forment des cylindres érythrocytaires ; ces éléments orientent vers une glomérulonéphrite et non vers un syndrome néphrotique pur. Une microhématurie existe pourtant chez 29 à 59 % des patients atteints de lésions minimes et chez 30 à 40 % de ceux atteints de néphropathie membraneuse : elle ne suffit donc pas à écarter ces formes, mais des cylindres érythrocytaires sont très rares dans la néphropathie membraneuse.</p><p>Le corps gras ovalaire est une cellule tubulaire arrondie remplie de gouttelettes lipidiques. Il est absent de l’urine normale et traduit une lipidurie, c’est-à-dire l’élimination urinaire de lipides par un glomérule perméable.</p><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="4"] [data-n04-image]{max-width:850px}[data-n04-annotation="4-1"]{left:49%;top:46%}</style><figure data-n04-original="4"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/Oval_Fat_Bodies_in_Urine_Microscopy.jpg" alt="Corps gras ovalaire dans un sédiment urinaire, microscopie optique." loading="lazy"><span data-n04-annotation="4-1" aria-hidden="true">1</span></div><figcaption>Figure 4 — Corps gras ovalaire dans un sédiment urinaire, microscopie optique. <b>1.</b> Cellule arrondie contenant de nombreuses gouttelettes réfringentes ; aspect compatible avec une lipidurie. <a href="https://commons.wikimedia.org/wiki/File:Oval_Fat_Bodies_in_Urine_Microscopy.jpg" target="_blank" rel="noopener">Original : Ajay Kumar Chaurasiya</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. La lumière polarisée n’est pas montrée : aucune croix de Malte ne peut être affirmée sur cette image. La lipidurie ne détermine pas à elle seule la cause de la protéinurie. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure><p>La figure se lit par la cellule centrale, unique et arrondie, puis par ses gouttelettes brillantes. Elle ne donne pas la cause de la lipidurie ni le taux de protéinurie ; seule la quantification le fait. Chez M. R., ce sédiment confirme l’origine glomérulaire de la fuite.</p><h3 id="n04-e02-partie-2">2. Biochimie, fonction rénale et complications</h3><p>Le bilan sanguin comprend les lipides (cholestérol total, LDL, triglycérides), la créatinine et le DFGe, les électrolytes sous diurétiques et les IgG en cas d’infections répétées. Le DFGe est surestimé dans le syndrome néphrotique, par sécrétion tubulaire accrue de créatinine. Les marqueurs de complication sont l’anti-Xa et l’INR : sous énoxaparine, l’anti-Xa se mesure 4 heures après la dose, avec une cible de 0,3 à 0,5 UI/ml (pas au-delà de 0,8) selon le consensus autrichien ; sous antivitamine K, l’INR se contrôle souvent, car il varie avec l’albumine.</p><h3 id="n04-e02-partie-3">3. Immunologie et imagerie</h3><p>Les anticorps anti-PLA2R se dosent par ELISA (CHUV et Viollier) ou par immunofluorescence indirecte. Ils sont positifs dans environ 75 % des formes primaires de néphropathie membraneuse ; les anticorps anti-THSD7A se cherchent si le test PLA2R est négatif (5 à 10 % des formes PLA2R-négatives). Les anticorps antinucléaires, les fractions C3 et C4 et les anticorps anti-MPO et anti-PR3 complètent le bilan, ainsi que les sérologies VHB, VHC, VIH et tréponème, et l’électrophorèse des protéines avec chaînes légères libres selon le contexte. L’échographie rénale et la radiographie thoracique (sarcoïdose) complètent le bilan chez tous les adultes.</p><p>Le tableau associe les diagnostics aux données biologiques qui les distinguent. Il répond à la question « quelle anomalie biologique évoque quelle maladie ? ». Lire la colonne des anticorps avant celle du complément.</p><table class="t"><thead><tr><th>Diagnostic</th><th>Associations biologiques</th></tr></thead><tbody><tr><td>Lésions glomérulaires minimes</td><td>Syndrome néphrotique complet d’apparition brutale ; microhématurie dans 29 à 59 % ; insuffisance rénale aiguë dans 10 à 40 % ; anticorps anti-néphrine chez environ 30 % des patients d’une étude récente</td></tr><tr><td>Hyalinose segmentaire et focale</td><td>Primaire : syndrome néphrotique complet ; secondaire : albumine &gt; 30 g/L ; génétique : contexte familial, test génétique</td></tr><tr><td>Néphropathie membraneuse</td><td>Anti-PLA2R (environ 75 % des formes primaires) ; anti-THSD7A (5 à 10 % des formes PLA2R-négatives) ; microhématurie dans 30 à 40 % ; dépôts d’IgG4 et de C3 et C4 à la biopsie</td></tr><tr><td>Lupus</td><td>Anticorps antinucléaires, C3 et C4 abaissés</td></tr><tr><td>Amylose</td><td>Électrophorèse et chaînes légères libres, biopsie</td></tr><tr><td>Diabète (N08.3)</td><td>Contexte diabétique, biopsie selon le tableau</td></tr><tr><td>Autre glomérulopathie</td><td>C3 bas (KDIGO 2025) ; anti-MPO ou anti-PR3 si microhématurie</td></tr></tbody></table><p>M. R. aurait une biologie compatible avec une néphropathie membraneuse primaire : anti-PLA2R positifs, anticorps antinucléaires et C3 normaux. Un C3 abaissé aurait fait suspecter une autre glomérulopathie.</p><div class="key"><b>À retenir.</b> Le sédiment montre l’origine glomérulaire de la fuite ; le corps gras ovalaire signe la lipidurie. Les anti-PLA2R orientent vers la néphropathie membraneuse, mais un test négatif n’exclut pas la maladie. L’anti-Xa et l’INR surveillent l’anticoagulation.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/download/DLA_INV_01_00380?no_cache=1" target="_blank" rel="noopener">CHUV — catalogue des analyses, anticorps anti-PLA2R (V12, 27.09.2023)</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p></section><section class="ilot" id="n04-e03"><h2><span class="n">E03</span> Biopsie rénale et lecture histologique</h2><h3 id="n04-e03-partie-1">1. Quand biopsier et ce que la biopsie lit</h3><p>La biopsie rénale est l’examen de référence de la forme histologique. Ses indications chez l’adulte et chez l’enfant sont rassemblées à l’îlot A07. La lecture associe trois techniques : la microscopie optique, l’immunofluorescence et la microscopie électronique. Chaque forme laisse une signature différente, que le tableau compare. Il répond à la question « que verrai-je dans chaque forme ? ». Lire d’abord la microscopie électronique pour les lésions minimes, car la microscopie optique y est normale.</p><table class="t"><thead><tr><th>Forme (code)</th><th>Microscopie optique</th><th>Immunofluorescence</th><th>Microscopie électronique</th></tr></thead><tbody><tr><td>Lésions minimes (N04.0)</td><td>Pas de lésion glomérulaire ou proéminence mésangiale minime</td><td>Négative ou faible pour C3 et/ou IgM</td><td>Effacement étendu des pédicelles, sans dépôts denses</td></tr><tr><td>Hyalinose segmentaire et focale (N04.1)</td><td>Sclérose segmentaire d’une partie du floculus</td><td>Non précisée dans les sources lues</td><td>Effacement des pédicelles, diffus dans la forme primaire</td></tr><tr><td>Néphropathie membraneuse (N04.2)</td><td>Épaississement des parois capillaires, spicules de la membrane basale (coloration argentique)</td><td>Dépôts granuleux d’IgG, surtout IgG4, le long des membranes basales</td><td>Dépôts sous-épithéliaux</td></tr></tbody></table><p>Une hyalinose débutante peut être manquée par erreur d’échantillonnage, car la sclérose touche un segment de certains glomérules seulement. D’où l’intérêt de l’immunofluorescence et de la microscopie électronique pour compléter la lecture.</p><div class="quiz ui"><p>Un adulte présente une protéinurie de rang néphrotique avec albumine à 36 g/L et œdème discret ; la biopsie montre une hyalinose segmentaire et focale. Faut-il débuter une immunosuppression ?</p><button data-ok="1">Non. L’absence de syndrome néphrotique complet (albumine supérieure à 30 g/L) oriente vers une forme secondaire : on cherche la cause et on traite le terrain, sans immunosuppression.</button><button data-ok="0">Oui, toute hyalinose segmentaire et focale reçoit des glucocorticoïdes à forte dose.</button><p class="fb" hidden>KDIGO déconseille l’immunosuppression devant une hyalinose sans syndrome néphrotique, car la forme est secondaire ou adaptative. La présence d’un syndrome complet avec effacement diffus des pédicelles oriente vers la forme primaire.</p></div><div class="quiz ui"><p>Un garçon de 13 ans présente un premier syndrome néphrotique sans signe atypique. La biopsie rénale est-elle indiquée avant tout traitement ?</p><button data-ok="1">Oui. À partir de 12 ans, KDIGO 2025 indique la biopsie dès la présentation.</button><button data-ok="0">Non, tout enfant reçoit d’abord de la prednisone sans biopsie.</button><p class="fb" hidden>La règle du traitement sans biopsie vaut pour l’enfant de moins de 12 ans avec syndrome corticosensible attendu. À 12 ans et plus, la biopsie est indiquée d’emblée.</p></div><div class="quiz ui"><p>Un adulte atteint de néphropathie membraneuse a une albumine de 22 g/L au pourpre de bromocrésol. L’albumine seule impose-t-elle une anticoagulation à dose curative ?</p><button data-ok="1">Non. Le seuil veineux de l’algorithme KDIGO est de 20 g/L au pourpre de bromocrésol ; à 22 g/L, le patient est au-dessus et l’étape suivante est l’estimation du risque artériel (aspirine si plus de 20 pour 1000 patients-années, qui ne prévient pas la thrombose veineuse).</button><button data-ok="0">Oui, toute albumine inférieure à 30 g/L impose l’anticoagulation à dose curative.</button><p class="fb" hidden>Les seuils dépendent de la méthode : 25 g/L au vert de bromocrésol valent environ 20 g/L au pourpre. À 22 g/L au pourpre, l’indication veineuse repose sur les autres facteurs de risque et sur le saignement, et la valeur doit être recontrôlée.</p></div><div class="key"><b>À retenir.</b> La microscopie optique est normale dans les lésions minimes ; l’effacement des pédicelles ne se voit qu’en microscopie électronique. La biopsie n’est pas nécessaire chez l’enfant de moins de 12 ans corticosensible ni chez l’adulte aux anti-PLA2R nettement positifs et au DFGe supérieur à 60. Une hyalinose sans syndrome néphrotique ne reçoit pas d’immunosuppression.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-e">▲ Loi de Pareto — Examens du syndrome néphrotique</button></section></div><div class="pager ui"><button class="prev">← Partie précédente</button><span></span><button class="next">Partie suivante →</button></div></div><div class="panel" id="pS" hidden><div class="sci-bar ui" role="tablist"><button id="n04-tab-semio" role="tab" data-s="n04-s-semio" aria-controls="n04-s-semio" aria-selected="true">Sémiologie fondamentale et analytique</button><button role="tab" data-s="n04-s01-sci" aria-controls="n04-s01-sci" aria-selected="false">Anatomie et histologie du glomérule</button><button role="tab" data-s="n04-s02-sci" aria-controls="n04-s02-sci" aria-selected="false">Histopathologie des formes primaires</button><button role="tab" data-s="n04-s03-sci" aria-controls="n04-s03-sci" aria-selected="false">Physiologie : Starling, sodium et diurétiques</button><button role="tab" data-s="n04-s04-sci" aria-controls="n04-s04-sci" aria-selected="false">Biochimie et coagulation</button><button id="n04-tab-immunogenetique" role="tab" data-s="n04-s05-sci" aria-controls="n04-s05-sci" aria-selected="false">Immunologie et génétique</button></div><div class="chap-body"><div class="sci" id="n04-s-semio" role="tabpanel" aria-labelledby="n04-tab-semio">
<section class="ilot" id="n04-semio-normal" data-semiology="normal">
<h2><span class="n">S00</span> Sémiologie fondamentale et analytique</h2>
<h3>Pour la leçon : quelle est la sémiologie fondamentale et analytique ?</h3>
<p>La sémiologie relie ce que la personne ressent, ce que le médecin constate et ce que mesurent les examens à une anomalie du fonctionnement rénal. Elle doit répondre à trois questions successives : existe-t-il un syndrome néphrotique, menace-t-il immédiatement le patient, quelle maladie peut l’expliquer ? Un œdème constitue un point de départ ; il ne fournit ni la preuve biologique du syndrome, ni son diagnostic histologique.</p>
<h3>1. Partir du fonctionnement normal</h3>
<p>Dans le corpuscule rénal normal, les capillaires du glomérule sont placés entre une artériole afférente et une artériole efférente. Le feuillet viscéral de la capsule de Bowman est constitué de podocytes ; leurs prolongements, les pédicelles, s’interdigitent autour des capillaires et délimitent des fentes de filtration. L’endothélium fenêtré, la membrane basale et l’appareil de fente forment une barrière organisée, distincte d’un simple tamis troué. L’ultrafiltrat rejoint l’espace urinaire puis les tubules, qui modifient sa composition. Une atteinte de cette barrière peut augmenter la perte de protéines alors que la filtration globale reste initialement conservée : une créatinine normale n’exclut donc pas une glomérulopathie importante. La figure permet d’identifier les structures normales avant de discuter les lésions ; elle ne représente pas une biopsie pathologique. [réf. 6, réf. 10]</p>
<style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="0"] [data-n04-image]{max-width:100%}[data-n04-annotation="0-1"]{left:24%;top:50%}[data-n04-annotation="0-2"]{left:83%;top:48%}</style><figure data-n04-original="0"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/2613_Podocytes.jpg" alt="Podocytes normaux : dessin anatomique humain OpenStax College (2013), avant toute comparaison avec une lésion." loading="lazy"><span data-n04-annotation="0-1" aria-hidden="true">1</span><span data-n04-annotation="0-2" aria-hidden="true">2</span></div><figcaption>Figure S00 — Podocytes normaux : dessin anatomique humain OpenStax College (2013), avant toute comparaison avec une lésion. <b>1.</b> Pédicelles interdigités : les prolongements de podocytes voisins délimitent les fentes. <b>2.</b> Corps d’un podocyte appliqué contre le capillaire ; l’image représente une organisation normale. <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" target="_blank" rel="noopener">Original : OpenStax College</a>, <a href="https://creativecommons.org/licenses/by/3.0" target="_blank" rel="noopener">CC BY 3.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure>
</section>
<section class="ilot" id="n04-semio-signs" data-semiology="signs">
<h3>2. Décrire les signes avant de les interpréter</h3>
<p>Rechercher le début et la progression de la prise de poids, la localisation et l’extension des œdèmes, une diminution des urines et les symptômes associés. Chez l’enfant, les recommandations IPNA décrivent des œdèmes déclives, parfois associés à une ascite ou à des épanchements, ainsi qu’une fatigue, une gêne abdominale ou une fièvre. L’examen et les mesures répétées complètent le récit : poids, pression artérielle, diurèse lorsqu’elle est mesurable et évolution de l’œdème. Une valeur isolée ne raconte pas la trajectoire du malade. [réf. 8]</p>
<p>Le délai d’installation, la pression artérielle et l’hématurie orientent sans identifier seuls la lésion. Un début brusque en quelques jours ou semaines est décrit dans les lésions glomérulaires minimes de l’adulte. Une microhématurie et une hypertension peuvent également y être présentes ; elles ne permettent donc pas d’opposer avec certitude lésions minimes et néphropathie membraneuse. Les formes membraneuses comportent elles aussi souvent une fonction rénale initialement conservée. Chez M. R., albumine à 19 g/L, œdème et microhématurie justifient l’enquête glomérulaire, sans désigner d’emblée une histologie. [réf. 3, réf. 5]</p>
<div class="key"><b>Science → clinique.</b> La perte de sélectivité du filtre peut précéder la baisse du débit de filtration : confronter les œdèmes à la protéinurie et à l’albuminémie même si la créatinine paraît rassurante.</div>
</section>
<section class="ilot" id="n04-semio-mechanisms" data-semiology="mechanisms">
<h3>3. Comprendre les mécanismes sans confondre œdème et volémie</h3>
<p>Dans le modèle de sous-remplissage, la perte urinaire de protéines contribue à l’hypoalbuminémie, puis à la baisse de pression oncotique plasmatique. Le liquide se redistribue vers l’interstitium ; la diminution du volume circulant efficace favorise la rétention de sodium et d’eau. Dans le modèle de sur-remplissage, une rétention rénale primaire de sodium participe à l’expansion extracellulaire. Les deux mécanismes peuvent coexister et leur contribution change dans le temps. L’hypoalbuminémie seule n’explique pas tous les œdèmes : la revue de Fratila et collaborateurs souligne notamment l’absence d’œdème dans certaines analbuminémies congénitales et la difficulté d’estimer la volémie au lit du malade. [réf. 4]</p>
<p>Le signe visible, un œdème abondant, ne signifie donc pas que le compartiment circulant tolérera une déplétion rapide. Chez l’enfant néphrotique, tachycardie, temps de recoloration prolongé, oligurie, gêne abdominale ou insuffisance rénale aiguë peuvent signaler un sous-remplissage. Leur association et leur évolution comptent davantage qu’un signe seul. Les recommandations pédiatriques déconseillent les diurétiques en cas de signes d’hypovolémie ; l’évaluation spécialisée précède alors le choix du traitement. Cette recommandation pédiatrique ne doit pas être transformée en règle posologique universelle pour l’adulte. [réf. 9]</p>
<div class="key"><b>Science → traitement.</b> La rétention hydrosodée et le volume circulant efficace sont deux questions différentes. Réévaluer perfusion, pression artérielle, fonction rénale et électrolytes avant d’intensifier un diurétique ; les doses et limites des produits suisses sont détaillées dans Pharmacologie.</div>
</section>
<section class="ilot" id="n04-semio-examination" data-semiology="examination">
<h3>4. Conduire une anamnèse et un examen orientés</h3>
<p>Commencer par la chronologie : état antérieur, épisode infectieux récent, médicaments commencés ou modifiés, rechutes éventuelles, évolution du poids et des urines. Chercher une maladie systémique connue ou suspectée, des antécédents familiaux rénaux et les expositions pertinentes. Chez l’adulte avec suspicion de néphropathie membraneuse, le consensus autrichien insiste sur les maladies auto-immunes, les infections, les cancers et les médicaments ; la recherche de cancer reste adaptée à l’âge et au contexte, et ne découle pas du seul œdème. Chez l’enfant, ajouter croissance, histoire familiale et statut vaccinal. [réf. 5, réf. 8]</p>
<p>La grille suivante organise l’examen initial. Ses éléments pédiatriques sont explicitement distingués ; aucun n’est présenté comme un test diagnostique validé isolément.</p>
<table class="t"><thead><tr><th>Question clinique</th><th>Ce qu’il faut documenter</th><th>Conséquence de lecture</th></tr></thead><tbody>
<tr><td>Quelle extension de l’œdème ?</td><td>Répartition, poids actuel et antérieur ; ascite ou épanchement si le contexte l’évoque</td><td>Établir une référence pour le suivi, sans assimiler cette extension au volume circulant</td></tr>
<tr><td>Existe-t-il une mauvaise perfusion ?</td><td>Pression artérielle, fréquence cardiaque, diurèse ; chez l’enfant, recoloration capillaire et signes décrits ci-dessus</td><td>Une suspicion de sous-remplissage change l’urgence et la prudence thérapeutique</td></tr>
<tr><td>Existe-t-il une infection ?</td><td>Fièvre et examen dirigé ; IPNA : poumon, peau, abdomen et voies urinaires</td><td>Ne pas attribuer automatiquement une douleur abdominale ou une altération générale à l’œdème</td></tr>
<tr><td>Existe-t-il une atteinte extrarénale ?</td><td>Éruption, arthrite, adénopathies ; signes oculaires, génitaux ou dysmorphiques chez l’enfant selon le contexte</td><td>Rechercher une cause secondaire ou syndromique avec le spécialiste</td></tr>
</tbody></table>
<p>Consigner aussi les résultats négatifs pertinents, les limites de l’examen et les données manquantes. Une absence de signe extrarénal à la première consultation ne clôt pas l’enquête étiologique. [réf. 5, réf. 8]</p>
</section>
<section class="ilot" id="n04-semio-interpretation" data-semiology="interpretation">
<h3>5. Articuler signes et mesures</h3>
<p>Chez l’adulte, la définition utilisée ici associe une protéinurie d’au moins 3,5 g/24 heures et une hypoalbuminémie ; le rapport protéines/créatinine urinaire de gamme néphrotique est d’environ 3 g/g, soit 300 mg/mmol dans la figure de KDIGO. Chez l’enfant, KDIGO 2025 définit la protéinurie néphrotique par un rapport d’au moins 200 mg/mmol (2 g/g), ou au moins 1 000 mg/m²/jour ; le syndrome associe une albumine inférieure à 30 g/L, ou un œdème lorsque l’albumine n’est pas disponible. Ne pas transférer le seuil adulte à l’enfant. Œdème et hyperlipidémie sont des éléments associés dont la présence et l’intensité varient. Les définitions, la méthode et les unités doivent rester visibles près du résultat. [réf. 6, réf. 7]</p>
<p>Le rapport protéines/créatinine et le rapport albumine/créatinine mesurent des quantités différentes : les seuils d’orientation pour maladie rénale chronique de la Société suisse de néphrologie ne sont pas des critères interchangeables de syndrome néphrotique. Une albuminurie importante et persistante, une hématurie glomérulaire, une insuffisance rénale aiguë ou une chute brutale et persistante du débit de filtration motivent un recours néphrologique selon le contexte suisse. [réf. 2]</p>
<p>Un recueil de 24 heures peut être nécessaire chez l’adulte avant une introduction ou une intensification de l’immunosuppression, ou lors d’un changement clinique. Chez l’enfant, un échantillon du premier matin est privilégié. La posture, le rythme nycthéméral, les erreurs de recueil et la production de créatinine limitent la comparaison des résultats. La méthode de dosage de l’albumine importe aussi : les valeurs obtenues au vert de bromocrésol et au pourpre de bromocrésol ne se superposent pas. Le cours conserve cette distinction pour les décisions d’anticoagulation. [réf. 6]</p>
<div class="key"><b>Science → examen.</b> Quantifier les protéines urinaires, préciser le prélèvement et la méthode d’albuminémie, puis examiner le sédiment. Aucun de ces résultats ne remplace, à lui seul, la recherche de la cause.</div>
</section>
<section class="ilot" id="n04-semio-differentials" data-semiology="differentials">
<h3>6. Éviter la fermeture prématurée du diagnostic</h3>
<p>La première distinction oppose un syndrome biologiquement documenté à un œdème d’autre origine. La seconde sépare le syndrome de sa cause : lésions minimes, hyalinose segmentaire et focale, néphropathie membraneuse et maladies secondaires ne se distinguent pas par le seul volume de l’œdème. Une hématurie glomérulaire ou une altération rapide de la fonction rénale demande une enquête adaptée et peut évoquer une composante inflammatoire ; une microhématurie isolée reste possible dans plusieurs formes néphrotiques. [réf. 1, réf. 2, réf. 3, réf. 5]</p>
<p>Dans la suspicion de néphropathie membraneuse, rechercher notamment les anticorps anti-PLA2R selon le contexte. Leur négativité n’exclut pas la maladie. Le consensus autrichien envisage l’absence de biopsie seulement dans une situation sélectionnée : anticorps clairement positifs, fonction rénale conservée et exclusion des autres causes ; l’interprétation dépend du test utilisé. Il ne suffit donc pas de dire « PLA2R positif » pour rendre toute biopsie inutile. Les indications et limites de la biopsie sont développées dans Examens complémentaires. [réf. 5]</p>
</section>
<section class="ilot" id="n04-semio-urgency" data-semiology="urgency">
<h3>7. Repérer ce qui impose une évaluation urgente</h3>
<p>Une dégradation rénale aiguë, une oligurie associée à des signes de mauvaise perfusion, une infection suspectée ou un événement thromboembolique possible font sortir de la simple consultation programmée. Chez l’enfant, fièvre et douleur abdominale imposent notamment de considérer une infection péritonéale ; une tachycardie et une recoloration prolongée peuvent accompagner l’hypovolémie. La présence d’œdèmes n’écarte pas ces urgences. [réf. 2, réf. 8, réf. 9]</p>
<p>Chez l’adulte néphrotique, une douleur du flanc avec hématurie macroscopique et altération rénale fait notamment rechercher une thrombose veineuse rénale, parmi les autres causes possibles. Une insuffisance rénale aiguë peut aussi être favorisée par une déplétion sous diurétiques ou un bloqueur du système rénine-angiotensine. Ces associations sont des motifs d’investigation ; elles ne sont pas des preuves suffisantes pour attribuer la cause ni pour commencer seul une anticoagulation. Le chapitre Urgences détaille l’orientation. [réf. 3]</p>
</section>
<section class="ilot" id="n04-semio-limits" data-semiology="limits">
<h3>8. Nommer les limites de l’interprétation</h3>
<p>Les fréquences issues de séries de lésions minimes ou de néphropathies membraneuses décrivent des groupes déjà diagnostiqués ; elles ne constituent pas une probabilité individuelle applicable sans autre information à M. R. Une photographie ou une coupe histologique illustre un aspect et ne valide pas le diagnostic d’un patient. L’image de podocytes ci-dessus est un dessin anatomique humain publié en 2013, présenté intact avec des repères ajoutés ; ce n’est ni une reconstruction d’un malade ni une image produite par intelligence artificielle.</p>
<p>La source suisse de la Revue Médicale Suisse n’était accessible que par son résumé : seules ses affirmations sur l’œdème comme point d’appel et sur les causes non rénales sont utilisées ici. Les recommandations suisses de maladie rénale chronique servent au recours spécialisé, les textes européens précisent l’étiologie et les recommandations pédiatriques sont réservées à leur population. KDIGO est une recommandation internationale complémentaire, et OpenStax une référence anatomique, sans rôle dans le choix d’un médicament suisse. Les observations discordantes, la situation individuelle et les informations professionnelles en vigueur restent déterminantes.</p>
<div class="key"><b>À retenir.</b> Décrire d’abord, confirmer ensuite, rechercher la gravité puis la cause. Un œdème ne mesure pas la volémie ; une créatinine normale n’exclut pas une glomérulopathie ; une microhématurie ne choisit pas l’histologie ; un résultat doit rester attaché à son unité, à sa méthode et à sa population.</div>
</section>
<section class="ilot" id="n04-semio-sources" data-semiology="sources">
<h3>9. Sources et passages de référence</h3>
<p>Passages consultés le 2 novembre 2026 pour cette section : sources suisses d’abord, consensus européens ensuite, références internationales pour les définitions et la pédiatrie. Les limites de lecture sont indiquées ci-dessus ; les références héritées du reste du cours ne sont pas présentées comme une relecture intégrale de cette révision.</p>
<ol><li><b>réf. 1.</b> <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2022/revue-medicale-suisse-771/syndrome-nephrotique-de-l-adulte-et-autres-proteinuries-de-fort-debit" target="_blank" rel="noopener">Syndrome néphrotique de l&#x27;adulte et autres protéinuries de fort débit. Rev Med Suisse 2022;18(771):370–378. doi:10.53738/REVMED.2022.18.771.370</a> — Résumé. Population : Adulte avec œdème. Limite : Résumé seul ; aucune posologie ni recommandation détaillée issue de cette source.</li><li><b>réf. 2.</b> <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Recommandations pour le dépistage et l&#x27;identification de l&#x27;insuffisance rénale chronique, version 17.03.2025</a> — Figure4, orientation néphrologique. Population : Maladie rénale chronique et critères de recours en Suisse. Limite : Ne définit pas à elle seule le syndrome néphrotique ; urgence selon contexte.</li><li><b>réf. 3.</b> <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">Diagnosis and treatment of Minimal Change Disease in adults – 2023. Wien Klin Wochenschr 2023;135(Suppl 5) (CC BY 4.0)</a> — Klinik et tableau2. Population : Adulte avec maladie à lésions glomérulaires minimes. Limite : Consensus autrichien2023 ; fréquences de séries, non probabilités individuelles.</li><li><b>réf. 4.</b> <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Nephrotic Syndrome: From Pathophysiology to Novel Therapeutic Approaches. Biomedicines 2024;12(3):569. doi:10.3390/biomedicines12030569 (CC BY 4.0)</a> — 2.1 Underfill / 2.2 Overfill. Population : Syndrome néphrotique, mécanismes de l’œdème. Limite : Revue mécanistique européenne ; volume circulant non déduit de la seule albuminémie.</li><li><b>réf. 5.</b> <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">Diagnostik und Therapie der Membranösen Nephropathie – 2023. Wien Klin Wochenschr 2023;135(Suppl 5):648–655. doi:10.1007/s00508-023-02261-w (CC BY 4.0)</a> — Klinik et Diagnostik. Population : Adulte, néphropathie membraneuse. Limite : Consensus autrichien ; examens sélectionnés selon contexte suisse.</li><li><b>réf. 6.</b> <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021;100(4S):réf. 1–S276</a> — Chapitre1, pages 90–91 du supplément, Figure4 et points de pratique 1.2.1–1.2.2. Population : Glomérulopathies, adulte et enfant distingués. Limite : Figure4 vue sur page96 du PDF. Borne RPC non néphrotique incohérente avec g/j dans la figure : non utilisée comme équivalence.</li><li><b>réf. 7.</b> <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 Clinical Practice Guideline for the Management of Nephrotic Syndrome in Children. Kidney Int 2025;107(5S):S241–S289</a> — Figure1 page 256 du supplément, définitions pédiatriques. Population : Enfants1–18ans. Limite : Recommandation internationale admise comme donnée ; seuils non transférés à adulte.</li><li><b>réf. 8.</b> <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">IPNA clinical practice recommendations for diagnosis and management of children with steroid-sensitive nephrotic syndrome</a> — Tableau2 bilan initial et section hypovolémie. Population : Enfant avec syndrome néphrotique. Limite : Association internationale, recommandations élaborées avec experts européens ; examen pédiatrique non extrapolé automatiquement à adulte.</li><li><b>réf. 9.</b> <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">IPNA clinical practice recommendations for diagnosis and management of children with steroid-sensitive nephrotic syndrome</a> — Évaluation de la volémie : hypovolémie ou insuffisance rénale aiguë. Population : Enfant, syndrome néphrotique corticosensible. Limite : Utilisée ici pour signes et interprétation, pas pour importer une dose pédiatrique.</li><li><b>réf. 10.</b> <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">Anatomy and Physiology2e : microscopic anatomy of the kidney</a> — Renal Corpuscle et Figure25.11. Population : Anatomie et histologie humaines normales. Limite : Manuel de science fondamentale ; aucune conduite thérapeutique américaine retenue.</li></ol>
</section></div>
<div class="sci" id="n04-s01-sci" hidden><section class="ilot" id="n04-s01"><h2><span class="n">S01</span> Anatomie et histologie normales du filtre glomérulaire</h2><h3 id="n04-s01-partie-1">1. Un filtre à trois couches</h3><p>Le glomérule est un peloton de capillaires entouré d’une capsule. Le plasma le traverse d’abord par un endothélium fenêtré, puis par la membrane basale, enfin par les fentes que dessinent les podocytes. Les podocytes enserrent le capillaire avec leurs pédicelles, qui s’interdigitent et sont reliés par un diaphragme de fente. Cette organisation retient l’albumine tout en laissant passer l’eau, l’urée et la créatinine. Les podocytes matures sont post-mitotiques : leur prolifération ne compense pas efficacement leur perte. Le consensus autrichien décrit toutefois une réserve limitée de précurseurs épithéliaux pariétaux. Une perte podocytaire persistante dépasse cette réparation limitée et peut conduire à la sclérose.</p><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="0"] [data-n04-image]{max-width:100%}[data-n04-annotation="0-1"]{left:24%;top:50%}[data-n04-annotation="0-2"]{left:83%;top:48%}</style><figure data-n04-original="0"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/2613_Podocytes.jpg" alt="Podocytes normaux : dessin anatomique humain OpenStax College (2013), avant toute comparaison avec une lésion." loading="lazy"><span data-n04-annotation="0-1" aria-hidden="true">1</span><span data-n04-annotation="0-2" aria-hidden="true">2</span></div><figcaption>Figure 5 — Podocytes normaux : dessin anatomique humain OpenStax College (2013), avant toute comparaison avec une lésion. <b>1.</b> Pédicelles interdigités : les prolongements de podocytes voisins délimitent les fentes. <b>2.</b> Corps d’un podocyte appliqué contre le capillaire ; l’image représente une organisation normale. <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" target="_blank" rel="noopener">Original : OpenStax College</a>, <a href="https://creativecommons.org/licenses/by/3.0" target="_blank" rel="noopener">CC BY 3.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure><p>La lecture de la figure commence par le panneau (a), qui montre les pédicelles vus de la surface, interdigités entre podocytes voisins. Elle se poursuit par le panneau (b), où un podocyte enveloppe un capillaire : les fentes de filtration sont les espaces entre les pédicelles voisins. L’image illustre le filtre normal ; le filtre lésé est schématisé à la figure 1.</p><h3 id="n04-s01-partie-2">2. De l’anatomie à la clinique</h3><p>Une lésion du podocyte se traduit d’abord par l’effacement des pédicelles avec perte des diaphragmes de fente, puis par une protéinurie massive. L’albumine, qui représente environ 65 % de la protéinurie totale en moyenne, passe en premier. Une protéinurie à prédominance d’albumine est donc cohérente avec une lésion podocytaire pure comme celle des lésions minimes.</p><div class="key"><b>À retenir.</b> Le filtre comprend un endothélium, une membrane basale et des podocytes aux pédicelles reliés par un diaphragme de fente. Corrélation science vers clinique : l’effacement des pédicelles explique la protéinurie massive. Corrélation science vers examen : il ne se voit qu’en microscopie électronique. Corrélation science vers traitement : la perte de podocytes explique la sclérose segmentaire des lésions persistantes.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p><div class="key"><b>Science → clinique.</b> Une perte de protéines peut précéder une chute du débit de filtration : une créatinine normale ne suffit pas à exclure une lésion glomérulaire.</div><div class="key"><b>Science → examen.</b> Confronter protéinurie, albuminémie et sédiment ; la photographie de podocytes normaux ne montre pas la lésion d’un patient.</div><div class="key"><b>Science → traitement.</b> Préserver la fonction rénale et limiter la perte de protéines dépend de la cause ; la barrière décrite ici ne désigne pas à elle seule un immunosuppresseur.</div></section></div><div class="sci" id="n04-s02-sci" hidden><section class="ilot" id="n04-s02"><h2><span class="n">S02</span> Histopathologie des trois formes primaires</h2><h3 id="n04-s02-partie-1">1. Trois formes, trois signatures</h3><p>Les trois formes primaires se reconnaissent à la biopsie. Dans les lésions minimes, la microscopie optique est normale, ou montre une proéminence mésangiale minime ; la microscopie électronique montre un effacement étendu des pédicelles sans dépôts denses. Dans la hyalinose segmentaire et focale, une partie seulement du floculus est sclérosée (sclérose segmentaire), dans certains glomérules seulement (atteinte focale). Dans la néphropathie membraneuse, les parois capillaires sont épaissies par des dépôts immuns sous-épithéliaux.</p><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="2"] [data-n04-image]{max-width:950px}[data-n04-annotation="2-1"]{left:70%;top:50%}[data-n04-annotation="2-2"]{left:44%;top:48%}</style><figure data-n04-original="2"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/Focal_segmental_glomerulosclerosis_-_high_mag.jpg" alt="Hyalinose segmentaire et focale, variante hilaire, coloration PAS : photographie histologique humaine." loading="lazy"><span data-n04-annotation="2-1" aria-hidden="true">1</span><span data-n04-annotation="2-2" aria-hidden="true">2</span></div><figcaption>Figure 6 — Hyalinose segmentaire et focale, variante hilaire, coloration PAS : photographie histologique humaine. <b>1.</b> Segment dense du floculus, à confronter aux anses encore ouvertes. <b>2.</b> Autres anses du même glomérule : le contraste illustre le caractère segmentaire. <a href="https://commons.wikimedia.org/wiki/File:Focal_segmental_glomerulosclerosis_-_high_mag.jpg" target="_blank" rel="noopener">Original : Nephron</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. Une seule coupe ne démontre pas le caractère focal dans l’ensemble des glomérules de la biopsie. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure><p>La figure se lit par la zone dense et condensée près du hile, qui est le segment sclérosé, puis par le reste du glomérule, resté ouvert. Elle montre pourquoi la lésion peut être manquée : un prélèvement ne contenant que des glomérules intacts ne la montre pas.</p><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="3"] [data-n04-image]{max-width:950px}[data-n04-annotation="3-1"]{left:65%;top:40%}[data-n04-annotation="3-2"]{left:20%;top:35%}</style><figure data-n04-original="3"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/Membranous_nephropathy_-_mpas_-_very_high_mag.jpg" alt="Néphropathie membraneuse, coloration argentique : photographie histologique humaine." loading="lazy"><span data-n04-annotation="3-1" aria-hidden="true">1</span><span data-n04-annotation="3-2" aria-hidden="true">2</span></div><figcaption>Figure 7 — Néphropathie membraneuse, coloration argentique : photographie histologique humaine. <b>1.</b> Parois capillaires glomérulaires soulignées par l’argentation. <b>2.</b> Structures tubulaires autour du floculus, à distinguer des anses capillaires. <a href="https://commons.wikimedia.org/wiki/File:Membranous_nephropathy_-_mpas_-_very_high_mag.jpg" target="_blank" rel="noopener">Original : Nephron</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. L’identification fine de spicules exige le grossissement adéquat ; les dépôts sous-épithéliaux ne sont pas montrés en microscopie électronique ici. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure><p>La coloration argentique noircit la membrane basale, ce qui la rend visible : on lit l’épaisseur des parois noires. À cette résolution, les spicules ne sont pas individualisables ; seul l’épaississement visible est donc décrit.</p><h3 id="n04-s02-partie-2">2. Pourquoi la forme est visible seulement en microscopie électronique ou en immunofluorescence</h3><p>L’immunofluorescence révèle les dépôts d’immunoglobulines et de complément : granuleux d’IgG, surtout IgG4, dans la néphropathie membraneuse ; négatifs ou faibles pour C3 et IgM dans les lésions minimes. La microscopie électronique est la seule à montrer l’effacement des pédicelles. Ces différences répondent à la nature de la lésion : atteinte cellulaire du podocyte (lésions minimes), perte de podocytes avec cicatrice (hyalinose), dépôts immuns (membraneuse).</p><div class="key"><b>À retenir.</b> Les lésions minimes se lisent en microscopie électronique, la hyalinose en microscopie optique (sclérose segmentaire) et la néphropathie membraneuse par l’épaississement de la membrane basale et les dépôts d’IgG4. Corrélation science vers traitement : la signature histologique détermine l’immunosuppression, donc la biopsie reste décisive quand elle est indiquée.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a>.</p><div class="key"><b>Science → clinique.</b> « Segmentaire » décrit une partie d’un glomérule et « focal » une partie des glomérules ; une seule microphotographie ne prouve pas les deux dimensions.</div><div class="key"><b>Science → examen.</b> La microscopie optique, l’immunofluorescence et la microscopie électronique répondent à des questions complémentaires ;
