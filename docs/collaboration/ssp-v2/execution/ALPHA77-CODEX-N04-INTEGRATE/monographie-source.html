<template id="ch-N04"><div class="chap"><div class="chap-head"><div class="code">N04 · N04.0–N04.9 · Néphrologie · Rénal et voies urinaires</div><h1>Syndrome néphrotique</h1><span class="status">Syndrome néphrotique de l’adulte et de l’enfant · Révision ciblée du 2 novembre 2026 · Statut : aperçu provisoire en revue ; auto-relecture et vérification ciblée effectuées, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie du syndrome néphrotique</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan</b><ol>
<li><a href="#n04-a01">Cas initial, objectifs et prérequis</a></li><li><a href="#n04-a02">Définitions et classification</a></li><li><a href="#n04-a03">Épidémiologie et pronostic global</a></li><li><a href="#n04-a04">Physiopathologie : du filtre lésé aux complications</a></li><li><a href="#n04-a05">Étiologies et formes</a></li><li><a href="#n04-a06">Anamnèse et examen clinique</a></li><li><a href="#n04-a07">Démarche diagnostique et diagnostics différentiels</a></li><li><a href="#n04-a08">Urgences et complications</a></li><li><a href="#n04-a09">Traitement de soutien commun</a></li><li><a href="#n04-a10">Traitement spécifique selon la forme</a></li><li><a href="#n04-a11">Suivi, pronostic et situations particulières</a></li><li><a href="#n04-a12">Critères formels du diagnostic et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="n04-a01"><h2><span class="n">A01</span> Cas initial, objectifs et prérequis</h2><h3 id="n04-a01-partie-1">1. Un cas fictif suivi tout au long du cours</h3><p>M. R., 52 ans, personnage fictif, consulte pour des œdèmes des jambes apparus en quelques semaines et une prise de poids de 7 kg. Il urine moins qu’auparavant et remarque des urines mousseuses. La bandelette urinaire indique des protéines à 4+. Le rapport protéines/créatinine urinaire, ou <button class="w" data-k="n04-calc-rpc">RPC</button>, atteint 650 mg/mmol. L’albumine sérique est de 19 g/L (méthode au pourpre de bromocrésol, ou <button class="w" data-k="n04-calc-albumine">BCP</button>) et le cholestérol total s’élève à 9,4 mmol/L. La créatinine est normale : le débit de filtration glomérulaire estimé, ou DFGe, vaut 85 mL/min/1,73 m². Le sédiment urinaire montre une microhématurie. Les anticorps anti-<button class="w" data-k="n04-pla2r">PLA2R</button> sont fortement positifs selon le laboratoire.</p><p>Ces valeurs sont inventées pour apprendre un raisonnement ; elles ne décrivent aucun patient réel. Elles recouvrent pourtant quatre situations de départ du référentiel PROFILES : 63 (oligurie), 161 (marqueurs de la fonction rénale anormaux), 164 (sédiment urinaire anormal) et 173 (protéinurie). Chacune ouvre une question distincte : la quantité d’urine émise, la fiabilité de la créatinine, la nature des cellules et des cylindres, puis le débit de protéines perdues.</p><h3 id="n04-a01-partie-2">2. Quatre résultats attendus du raisonnement</h3><p>Le raisonnement poursuit quatre buts successifs. Le premier consiste à confirmer le syndrome, c’est-à-dire à vérifier la protéinurie de rang néphrotique et l’hypoalbuminémie. Le deuxième cherche la forme : lésions glomérulaires minimes (<button class="w" data-k="n04-mcd">MCD</button>), hyalinose segmentaire et focale (<button class="w" data-k="n04-fsgs">FSGS</button>), néphropathie membraneuse (<button class="w" data-k="n04-mn">MN</button>) ou glomérulopathie secondaire. Le troisième mesure le risque, qui se décline en thrombose, infection et atteinte rénale. Le quatrième choisit le traitement. Une seule étiquette ne remplit pas ces quatre fonctions : « syndrome néphrotique » décrit un syndrome clinique et biologique, mais ne nomme ni la lésion ni la cause.</p><h3 id="n04-a01-partie-3">3. Un message suisse : penser au syndrome néphrotique devant tout œdème</h3><p>Le résumé de la <i>Revue Médicale Suisse</i> (CHUV, 2022) rappelle qu’un syndrome néphrotique peut être l’expression précoce d’une affection non rénale éventuellement sévère et évolutive. Il faut donc y penser chez tout patient œdémateux, quels que soient son âge et ses comorbidités. La raison tient aux causes secondaires : infections, cancers, médicaments et maladies auto-immunes atteignent parfois le glomérule avant de se manifester par un autre signe. Cette recommandation repose sur le résumé de l’article, seul accessible sans abonnement.</p><h3 id="n04-a01-partie-4">4. Prérequis cliquables et contraste pédiatrique</h3><p>Deux notions soutiennent tout le raisonnement. La <button class="w" data-k="n04-filtration">barrière de filtration</button> retient normalement l’albumine dans le sang. La <button class="w" data-k="n04-oncotique">pression oncotique</button>, exercée par l’albumine, retient l’eau dans les capillaires. Quand la première cède, la seconde s’effondre et l’œdème apparaît.</p><p>Un contraste pédiatrique éclaire le reste. Léa, 4 ans, personnage fictif, se réveille avec les paupières gonflées. La bandelette indique 3+ de protéines. Après quatre semaines de prednisone à dose standard, les urines ne contiennent plus de protéines : le syndrome est corticosensible. L’adulte et l’enfant n’obéissent ni aux mêmes seuils ni aux mêmes règles de biopsie ; les deux sont comparés ci-dessous.</p><div class="key"><b>À retenir.</b> Un syndrome néphrotique se résout en quatre questions : le confirmer, trouver sa forme, mesurer son risque, le traiter. La barrière de filtration et la pression oncotique ouvrent l’explication de l’œdème. Deux patients fictifs, M. R. (adulte) et Léa (enfant), montrent ce que l’âge change.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2022/revue-medicale-suisse-771/syndrome-nephrotique-de-l-adulte-et-autres-proteinuries-de-fort-debit" target="_blank" rel="noopener">Ngatchou et Kissling — Rev Med Suisse 2022 ; 18(771):370 (résumé)</a>.</p></section><section class="ilot" id="n04-a02"><h2><span class="n">A02</span> Définitions et classification</h2><h3 id="n04-a02-partie-1">1. Le syndrome néphrotique de l’adulte</h3><p>Chez l’adulte, KDIGO 2021 définit le syndrome néphrotique par deux critères essentiels. Le premier est une protéinurie d’au moins 3,5 g par 24 heures ou un rapport protéines/créatinine d’au moins 3000 mg/g, soit 300 mg/mmol. Le second est une hypoalbuminémie, dont la valeur seuil dépend du laboratoire. L’œdème et l’hyperlipidémie sont des critères variables : leur absence n’exclut pas le diagnostic. Le calcul du rapport et la conversion entre mg/g et mg/mmol sont détaillés dans une <button class="w" data-k="n04-calc-rpc">fenêtre dédiée</button>.</p><p>La méthode de dosage de l’albumine compte autant que le chiffre. Le vert de bromocrésol donne des valeurs supérieures d’environ 5,5 g/L à celles du pourpre de bromocrésol, de l’électrophorèse capillaire ou de l’immunonéphélométrie. Un même sérum peut donc franchir ou non le seuil selon l’appareil ; la <button class="w" data-k="n04-calc-albumine">fenêtre sur la méthode</button> explique comment convertir.</p><h3 id="n04-a02-partie-2">2. Le syndrome néphrotique de l’enfant</h3><p>Chez l’enfant de 1 à 18 ans, KDIGO 2025 fixe la protéinurie de rang néphrotique à un rapport protéines/créatinine d’au moins 200 mg/mmol (2 g/g) sur un échantillon, ou à au moins 1000 mg/m² par jour sur 24 heures. À la bandelette, cela correspond à 3+ (300 à moins de 1000 mg/dl) ou 4+ (au moins 1000 mg/dl). Le syndrome néphrotique associe cette protéinurie et une albumine sérique inférieure à 30 g/L ; quand l’albumine n’est pas disponible, la présence d’un œdème remplace ce critère.</p><p>Le tableau compare les deux définitions. Il répond à une question pratique : un même patient peut-il être néphrotique selon un seuil et non selon l’autre ? La réponse est oui, parce que les protéinuries et les albuminémies de référence ne sont pas les mêmes. Lire d’abord la ligne de la protéinurie, puis celle de l’albumine ; une erreur fréquente consiste à appliquer le seuil de l’adulte (300 mg/mmol) à un enfant, ce qui retarde le diagnostic.</p><table class="t"><thead><tr><th>Critère</th><th>Adulte (KDIGO 2021)</th><th>Enfant 1–18 ans (KDIGO 2025)</th></tr></thead><tbody><tr><td>Protéinurie</td><td>≥ 3,5 g/24 h ou rapport ≥ 300 mg/mmol (3000 mg/g) ; critère essentiel</td><td>Rapport ≥ 200 mg/mmol (2 g/g) ou ≥ 1000 mg/m²/jour ; bandelette 3+ ou 4+</td></tr><tr><td>Albumine sérique</td><td>Hypoalbuminémie, valeur propre au laboratoire ; critère essentiel</td><td>&lt; 30 g/L (ou œdème si l’albumine manque)</td></tr><tr><td>Œdème</td><td>Variable</td><td>Remplace l’albumine si elle est indisponible</td></tr><tr><td>Hyperlipidémie</td><td>Variable</td><td>Non requise par la définition</td></tr></tbody></table><p>Le tableau montre que la bandelette n’intervient dans les sources lues que pour l’enfant. La lecture de la bandelette dépend du fabricant : négatif de 0 à moins de 15 mg/dl, traces de 15 à moins de 30, 1+ de 30 à moins de 100, 2+ de 100 à moins de 300, 3+ de 300 à moins de 1000, 4+ à partir de 1000 mg/dl.</p><h3 id="n04-a02-partie-3">3. Protéinurie de rang néphrotique sans syndrome néphrotique</h3><p>La protéinurie atteint parfois le seuil néphrotique sans que l’albumine baisse ni que l’œdème apparaisse. Elle est fréquente dans la hyalinose segmentaire et focale secondaire et dans la néphropathie à IgA. Les lipides sont alors normaux ou peu élevés. Cette distinction oriente le traitement : une protéinurie néphrotique sans syndrome signale souvent une cause secondaire, pour laquelle l’immunosuppression n’est pas indiquée. À l’inverse, une protéinurie non néphrotique se situe entre 0,3 et 3,4 g/24 h, avec albumine normale et sans symptôme. La figure source de KDIGO exprime cette borne par un rapport inférieur à 30 mg/mmol ; ce chiffre ne coïncide pas exactement avec 3,4 g/24 h, c’est pourquoi la valeur en grammes par 24 heures est retenue.</p><p>Le diagnostic clinique précède le codage. La table complète N04.0–N04.9 est conservée dans l’annexe nosologique, après la conclusion clinique.</p><div class="key"><b>À retenir.</b> L’adulte est néphrotique au-delà de 300 mg/mmol avec une albumine basse selon la méthode du laboratoire ; l’enfant l’est dès 200 mg/mmol avec une albumine inférieure à 30 g/L ou un œdème. Une protéinurie néphrotique sans hypoalbuminémie évoque une cause secondaire. Les sous-codes N04.0 à N04.8 supposent une biopsie ; sans elle, le code est N04.9.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">OFS — CIM-10-GM 2024, version française (31.10.2024)</a>.</p></section><section class="ilot" id="n04-a03"><h2><span class="n">A03</span> Épidémiologie et pronostic global</h2><h3 id="n04-a03-partie-1">1. Combien de patients et de quelles formes</h3><p>Chez l’adulte, l’incidence du syndrome néphrotique est d’environ 2,7 à 3 nouveaux cas pour 100 000 personnes et par an, valeur restée stable au fil des années. Chez l’enfant, c’est la maladie glomérulaire la plus fréquente, avec une incidence de 1,15 à 16,9 pour 100 000 enfants. Aucune donnée d’incidence suisse n’a été trouvée dans les sources consultées ; les chiffres sont internationaux et européens et leur origine est indiquée.</p><p>La part de chaque forme varie avec l’âge. Le tableau les compare. Il répond à la question « devant un adulte néphrotique, quelle forme est la plus probable ? ». Lire d’abord la colonne de la fréquence, puis celle de l’évolution naturelle, qui fonde la décision d’attendre ou de traiter ; l’erreur fréquente est d’additionner des pourcentages calculés sur des dénominateurs différents, comme ceux de la ligne des lésions minimes.</p><table class="t"><thead><tr><th>Forme</th><th>Fréquence</th><th>Terrain</th><th>Évolution naturelle</th></tr></thead><tbody><tr><td>Néphropathie membraneuse</td><td>Environ 30 % des syndromes néphrotiques de l’adulte ; incidence 1/100 000 (ÖGN)</td><td>Pic aux 4e et 5e décennies ; hommes deux fois plus touchés</td><td>Rémission spontanée chez environ un tiers ; parmi les deux tiers restants, la moitié garde une protéinurie avec fonction conservée longtemps, l’autre moitié évolue plus vite vers l’insuffisance rénale terminale ; récidive après greffe dans environ 40 %</td></tr><tr><td>Lésions glomérulaires minimes</td><td>10–25 % des syndromes néphrotiques de l’adulte (KDIGO) ou 10–15 % des syndromes néphrotiques primaires (ÖGN) ; cause de loin la plus fréquente chez l’enfant</td><td>Hommes plus touchés</td><td>Rémission sous corticoïdes à forte dose dans 80 à 90 % des cas chez l’adulte (KDIGO) ; rechute chez environ deux tiers après l’arrêt (ÖGN)</td></tr><tr><td>Hyalinose segmentaire et focale</td><td>Environ 9 % des biopsies rénales de l’adulte en Europe ; la forme primaire est la deuxième cause de syndrome néphrotique de l’adulte ; la forme adaptative secondaire est probablement la plus fréquente</td><td>Non précisé dans les sources lues</td><td>Corticorésistance et insuffisance rénale possibles</td></tr></tbody></table><p>Les deux estimations des lésions minimes diffèrent parce que leurs dénominateurs diffèrent : KDIGO rapporte à tous les syndromes néphrotiques de l’adulte, l’ÖGN aux seuls syndromes primaires. Il ne s’agit pas d’une contradiction, mais de deux populations.</p><h3 id="n04-a03-partie-2">2. Le pronostic de l’enfant</h3><p>Avant les antibiotiques et la corticothérapie, environ 40 % des enfants néphrotiques mouraient d’infection, d’insuffisance rénale ou, plus rarement, de thrombose. Aujourd’hui, avec un traitement correct, la fonction rénale des formes corticosensibles est préservée. Le syndrome persiste toutefois à l’âge adulte dans 15 à 25 % des cas, et moins de 5 % des enfants deviennent secondairement corticorésistants, avec un risque élevé d’insuffisance rénale et de récidive après greffe. Léa, corticosensible, a donc une bonne probabilité de préserver ses reins, mais elle peut rechuter pendant des années.</p><div class="key"><b>À retenir.</b> Les formes se répartissent différemment selon l’âge : les lésions minimes dominent chez l’enfant, la néphropathie membraneuse chez l’adulte. Le pronostic de l’enfant s’est transformé grâce aux corticoïdes. La Suisse n’a pas de chiffres d’incidence publiés dans les sources lues ; cette lacune est nommée, non comblée.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-a1">▲ Loi de Pareto — Définitions, classification et épidémiologie</button></section><section class="ilot" id="n04-a04"><h2><span class="n">A04</span> Physiopathologie : du filtre lésé aux complications</h2><h3 id="n04-a04-partie-1">1. Un filtre qui retient l’albumine, puis un filtre qui cède</h3><p>Le glomérule filtre le plasma à travers trois couches : l’endothélium, la membrane basale et les podocytes. Les podocytes sont des cellules post-mitotiques et terminalement différenciées dont les pédicelles s’interdigitent et sont reliés par un diaphragme de fente. Cet assemblage laisse passer l’eau et les petites molécules et retient l’albumine. La <button class="w" data-k="n04-filtration">fenêtre sur la barrière de filtration</button> reprend cette anatomie.</p><p>Quand le podocyte est lésé, ses pédicelles s’aplatissent et les diaphragmes de fente disparaissent. Cet effacement des pédicelles s’accompagne en général d’une protéinurie massive. Si la lésion persiste, des podocytes se perdent ou se détachent de la membrane basale ; le glomérule se cicatrise alors par sclérose segmentaire. La figure 1 oppose les deux états : la protéinurie vient d’une perte de sélectivité du filtre et non d’une obstruction.</p><style>[data-n04-original] [data-n04-image]{position:relative;margin:auto}[data-n04-original] img{display:block;width:100%;height:auto}[data-n04-annotation]{position:absolute;transform:translate(-50%,-50%);background:#163c59;color:white;border:2px solid white;border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font:bold 16px sans-serif;box-shadow:0 0 0 1px #163c59}[data-n04-original="0"] [data-n04-image]{max-width:100%}[data-n04-annotation="0-1"]{left:24%;top:50%}[data-n04-annotation="0-2"]{left:83%;top:48%}</style><figure data-n04-original="0"><div data-n04-image="1"><img src="assets/img/n04/alpha/codex/2613_Podocytes.jpg" alt="Podocytes normaux : dessin anatomique humain OpenStax College (2013), avant toute comparaison avec une lésion." loading="lazy"><span data-n04-annotation="0-1" aria-hidden="true">1</span><span data-n04-annotation="0-2" aria-hidden="true">2</span></div><figcaption>Figure 1 — Podocytes normaux : dessin anatomique humain OpenStax College (2013), avant toute comparaison avec une lésion. <b>1.</b> Pédicelles interdigités : les prolongements de podocytes voisins délimitent les fentes. <b>2.</b> Corps d’un podocyte appliqué contre le capillaire ; l’image représente une organisation normale. <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" target="_blank" rel="noopener">Original : OpenStax College</a>, <a href="https://creativecommons.org/licenses/by/3.0" target="_blank" rel="noopener">CC BY 3.0</a>. Repères numérotés superposés par MEDINA, sous la même licence ; pixels de l’original inchangés. Les repères commentent l’image et ne constituent pas une validation diagnostique indépendante.</figcaption></figure><p>La lecture de la figure commence par les pédicelles : séparés à gauche, étalés et sans fentes à droite. Elle se poursuit par le sort des cercles blancs : ils restent dans le capillaire à gauche et traversent à droite. Chez M. R., cette traversée explique la bandelette à 4+.</p><h3 id="n04-a04-partie-2">2. La protéinurie : surtout de l’albumine, et une filtration paradoxale</h3><p>En moyenne, l’albumine représente environ 65 % de la protéinurie totale dans les glomérulopathies ; cette proportion est plus élevée dans certaines maladies, comme les lésions glomérulaires minimes. L’albumine est le principal contributeur de la pression oncotique plasmatique : sa perte abaisse donc cette pression.</p><p>Un paradoxe doit être connu. Dans les lésions glomérulaires minimes, la lésion podocytaire augmente la perméabilité à l’albumine mais diminue celle des petites molécules comme l’eau, l’urée et la créatinine. La filtration baisse alors d’environ 25 %, de façon réversible et souvent sans hausse de la créatinine. De plus, la sécrétion tubulaire de créatinine est accrue dans le syndrome néphrotique ; les formules fondées sur la créatinine surestiment alors systématiquement le débit de filtration. Ainsi, le DFGe de 85 de M. R. peut cacher une filtration réelle plus basse.</p><h3 id="n04-a04-partie-3">3. L’œdème : deux hypothèses qui coexistent</h3><p>L’hypothèse du sous-remplissage suit une chaîne : protéinurie, hypoalbuminémie, baisse de la pression oncotique plasmatique, fuite de liquide vers l’interstitium selon les forces de Starling, hypovolémie relative, puis activation compensatrice du système rénine-angiotensine-aldostérone et de la vasopressine, avec rétention d’eau et de sodium. L’<button class="w" data-k="n04-oncotique">explication des forces de Starling</button> précise ce raisonnement.</p><p>L’hypothèse du surremplissage invoque une rétention primaire de sodium par le rein, démontrée chez des patients dont la rénine et l’aldostérone sont basses. Des sérine-protéases filtrées, surtout la plasmine issue du plasminogène par l’activateur de type urokinase, clivent les sous-unités α et γ du canal sodique épithélial du néphron distal, ou <button class="w" data-k="n04-enac">ENaC</button>, et l’activent. L’amiloride bloque ce canal. KDIGO confirme que la plasmine urinaire peut activer ENaC et contribuer à la résistance aux diurétiques, tout en notant que l’effet de l’amiloride n’est pas validé par un essai randomisé. Une partie des preuves provient de modèles murins. Les deux mécanismes coexistent et interagissent ; l’un prédomine selon le patient. Cette coexistence justifie qu’on traite à la fois le sodium (régime, diurétiques) et la cause de la fuite.</p><h3 id="n04-a04-partie-4">4. Lipides, coagulation et infections</h3><p>La <button class="w" data-k="n04-lipides">dyslipidémie</button> associe une hausse du cholestérol, des triglycérides et des lipoprotéines contenant l’apolipoprotéine B, une baisse d’activité de la lipoprotéine lipase et de la lipase hépatique, et une hausse de la protéine PCSK9. Cette synthèse biochimique provient d’une revue américaine utilisée ici pour la seule biochimie. La <button class="w" data-k="n04-coagulation">tendance thrombotique</button> repose sur la perte urinaire d’antithrombine (65 kDa), la hausse plasmatique de protéines procoagulantes de haut poids moléculaire (fibrinogène, facteurs V et VIII), la thrombocytose fréquente et la fibrinolyse diminuée. Ainsi, l’héparine peut être moins efficace et exiger une dose plus élevée.</p><p>Les infections bactériennes restent une complication du syndrome : si elles se répètent, KDIGO recommande de doser les IgG.</p><div class="key"><b>À retenir.</b> Le filtre lésé laisse passer l’albumine. L’œdème naît de deux mécanismes qui coexistent : sous-remplissage par baisse de la pression oncotique, et surremplissage par activation d’ENaC. Le DFGe est surestimé. Les lipides montent et la coagulation s’emballe, ce qui prépare les complications de l’îlot 8.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5770189/" target="_blank" rel="noopener">Agrawal et coll. 2018 — Nat Rev Nephrol 14:57–70</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3302669/" target="_blank" rel="noopener">Kerlin et coll. 2012 — Clin J Am Soc Nephrol 7:513–520</a>.</p></section><section class="ilot" id="n04-a05"><h2><span class="n">A05</span> Étiologies et formes</h2><h3 id="n04-a05-partie-1">1. Primaire, secondaire, génétique</h3><p>Le syndrome néphrotique résulte d’une glomérulopathie primaire, d’une cause secondaire ou d’une anomalie génétique. La question de la cause précède celle du traitement, parce que traiter la cause secondaire suffit parfois et que l’immunosuppression d’une forme secondaire est inutile ou dangereuse. Les trois formes histologiques principales se déclinent ainsi.</p><p>Les lésions glomérulaires minimes ont une pathogenèse incomplètement connue : dysrégulation des lymphocytes T, rôle des lymphocytes B (suggéré par l’efficacité du rituximab), anticorps anti-néphrine chez environ 30 % des patients d’une étude récente ; les infections virales et les allergènes sont des déclencheurs possibles. La néphropathie membraneuse est une glomérulonéphrite à complexes immuns sous-épithéliaux, surtout d’IgG4, dirigés contre des antigènes podocytaires : le récepteur de type M de la phospholipase A2 (<button class="w" data-k="n04-pla2r">PLA2R</button>, environ 75 % des formes primaires) et la protéine à domaine de type 1 de la thrombospondine, de type 7A (<button class="w" data-k="n04-pla2r">THSD7A</button>, 5 à 10 % des formes PLA2R négatives). La hyalinose segmentaire et focale est primaire, secondaire ou génétique.</p><h3 id="n04-a05-partie-2">2. Les causes secondaires et leur dépistage</h3><p>Le tableau associe chaque forme à ses causes secondaires et à l’examen qui les dépiste. Il répond à la question « que chercher devant cette forme ? ». Lire la ligne de la forme biopsiée, puis les causes, puis l’examen. L’erreur fréquente est de s’arrêter à la positivité des anticorps anti-PLA2R : le bilan des conditions associées se fait que ces anticorps soient présents ou non.</p><table class="t"><thead><tr><th>Forme</th><th>Causes secondaires</th><th>Dépistage</th></tr></thead><tbody><tr><td>Lésions glomérulaires minimes</td><td>Médicaments (AINS, lithium, sels d’or, ampicilline, rifampicine, interféron, inhibiteurs de points de contrôle) ; infections ; atopie ; néoplasies (lymphomes de Hodgkin et non hodgkiniens, leucémie, myélome, thymome) ; maladies auto-immunes (lupus, syndrome de Sjögren) ; vaccinations</td><td>Anamnèse ; VIH, hépatites, tuberculose ; anticorps antinucléaires ; électrophorèse et chaînes légères libres selon le contexte</td></tr><tr><td>Hyalinose segmentaire et focale</td><td>Atteinte épithéliale : VIH (établi), CMV (probable), parvovirus B19, EBV et VHC (possibles), SARS-CoV-2 avec génotype APOL1 à risque ; médicaments (inhibiteurs de mTOR, anticalcineurines, anthracyclines, héroïne, lithium, interféron, stéroïdes anabolisants, AINS). Adaptation à une hypertension glomérulaire : nombre de néphrons réduit (néphropathie de reflux, dysplasie, oligoméganéphronie, drépanocytose, âge) ou normal (obésité, autres glomérulopathies, néphropathie diabétique ou hypertensive)</td><td>Contexte clinique ; dosage de l’albumine (un syndrome néphrotique complet oriente vers la forme primaire) ; test génétique selon indications</td></tr><tr><td>Néphropathie membraneuse (20 à 30 % de formes secondaires)</td><td>Infections (hépatite B, plus rarement C, syphilis) ; cancers (surtout solides : prostate, poumon, tube digestif ; plus rarement leucémie lymphoïde chronique) ; médicaments (AINS, sels d’or, pénicillamine) ; maladies auto-immunes (lupus, polyarthrite rhumatoïde) ; sarcoïdose ; réaction du greffon contre l’hôte</td><td>Anamnèse, examen cutané et articulaire, radiographie thoracique, échographie rénale, sérologies VHB, VHC, VIH et tréponème selon indication, anticorps antinucléaires, dépistage des cancers adapté à l’âge</td></tr><tr><td>Glomérulopathies secondaires hors forme primaire</td><td>Diabète (N08.3 avec E10–E14), amylose (E85), lupus, infections, cancers, médicaments</td><td>Sérologies, anticorps antinucléaires, électrophorèse et chaînes légères libres, biopsie (amylose, diabète)</td></tr></tbody></table><p>Cas de M. R. : il ne prend aucun anti-inflammatoire et ses sérologies hépatiques sont négatives, mais le dépistage du cancer adapté à son âge reste à faire, car la néphropathie membraneuse peut précéder un cancer solide. Une hyalinose segmentaire et focale sans syndrome néphrotique complet (albumine supérieure à 30 g/L) doit faire rechercher une cause secondaire ou génétique et ne justifie pas d’emblée une immunosuppression.</p><h3 id="n04-a05-partie-3">3. Les formes génétiques</h3><p>Les formes génétiques de hyalinose segmentaire et focale résultent de mutations de protéines podocytaires et de la membrane basale ; elles sont familiales, sporadiques ou syndromiques. KDIGO juge le test génétique utile en cas d’antécédents familiaux forts, de signes syndromiques ou de corticorésistance, pour limiter l’exposition à l’immunosuppression, estimer le risque de récidive après greffe ou évaluer un donneur apparenté. Un syndrome néphrotique avant l’âge de 1 an doit aussi faire consulter la néphrologie pédiatrique.</p><div class="key"><b>À retenir.</b> La cause précède le traitement. Les anticorps anti-PLA2R n’exemptent pas du bilan des conditions associées. Une hyalinose sans syndrome néphrotique complet fait rechercher une cause secondaire ou génétique et ne justifie pas d’emblée une immunosuppression. Un test génétique est indiqué en cas de contexte familial, syndromique ou de corticorésistance.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">OFS — CIM-10-GM 2024, version française (31.10.2024)</a>.</p></section><section class="ilot" id="n04-a06"><h2 data-semiology-clinical="N04"><span class="n">A06</span> Anamnèse et examen clinique</h2><h3 id="n04-a06-partie-1">1. Le motif de consultation et le début</h3><p>L’œdème est le principal motif de consultation. L’hypervolémie qui l’accompagne peut entraîner une congestion pulmonaire, une hypertension, une anasarque et une gêne à la mobilité. Le début oriente la forme, comme l’opposent les deux cartes suivantes.</p><div class="two"><div class="card"><h4>Lésions glomérulaires minimes</h4><p>Le syndrome néphrotique complet s’installe de façon brutale, en quelques jours à quelques semaines, et le patient date souvent l’apparition des œdèmes. La prise de poids est marquée. L’hypertension touche 30 à 47 % des patients et la microhématurie 29 à 59 %. Une insuffisance rénale aiguë (créatinine multipliée par 1,5) survient dans 10 à 40 % des cas, dont environ un quart reçoit une dialyse transitoire. Chez le sujet âgé, les formes sont atypiques : hypertension et fonction rénale altérée.</p></div><div class="card"><h4>Néphropathie membraneuse</h4><p>Le syndrome néphrotique est déjà présent au diagnostic chez 60 à 80 % des patients. Sinon, la protéinurie est d’abord non néphrotique et progresse vers le syndrome néphrotique dans environ 60 % des cas sans traitement. La microhématurie existe chez 30 à 40 % des patients, les cylindres érythrocytaires sont très rares et la fonction rénale est normale ou peu altérée chez 80 % des patients.</p></div></div><p>M. R., avec un début en quelques semaines, une albumine à 19 g/L, une fonction rénale conservée et une microhématurie, est compatible avec plusieurs glomérulopathies, dont une néphropathie membraneuse et des lésions glomérulaires minimes. Ces seuls signes ne permettent pas de privilégier une histologie ; les examens étiologiques et, selon le contexte, la biopsie déterminent la suite.</p><h3 id="n04-a06-partie-2">2. Ce que l’anamnèse doit chercher</h3><p>Le médecin demande la date de début des œdèmes et de la prise de poids, les signes de thrombose (douleur d’un mollet, douleur lombaire, essoufflement), les infections récentes et les médicaments en cours : anti-inflammatoires non stéroïdiens, lithium, sels d’or, pénicillamine, inhibiteurs de mTOR. Il demande aussi les antécédents familiaux de protéinurie ou de hyalinose, et les séjours en zone tropicale, car une strongyloïdose doit être dépistée avant une immunosuppression chez un patient ayant vécu dans une telle zone, surtout avec éosinophilie et IgE élevées.</p><h3 id="n04-a06-partie-3">3. L’examen clinique</h3><p>L’examen suit l’ordre état général, constantes, poids, signes ciblés. Il mesure la pression artérielle, objective les œdèmes (godet), recherche une anasarque et une ascite. Chez l’enfant avec ascite, une péritonite bactérienne spontanée doit être cherchée par examen microscopique et culture du liquide. L’examen cherche aussi des signes de maladie systémique : peau et articulations, évocateurs d’un lupus ou d’une néphropathie membraneuse secondaire.</p><p>La photographie illustre l’œdème matinal de l’enfant, souvent confondu avec une allergie. Elle ne dit rien de la cause ni du taux d’albumine ; seule la bandelette puis le rapport protéines/créatinine tranchent. Léa, à son réveil, présentait exactement ce tableau.</p><div class="key"><b>À retenir.</b> L’œdème est le motif de consultation. Un début brutal en quelques jours évoque des lésions minimes ; un début plus lent avec fonction conservée évoque une néphropathie membraneuse. L’anamnèse recherche les médicaments, les voyages en zone tropicale et les signes de thrombose. L’ascite de l’enfant impose de chercher une péritonite.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-a2">▲ Loi de Pareto — Physiopathologie, étiologies et clinique</button></section><section class="ilot" id="n04-a07"><h2><span class="n">A07</span> Démarche diagnostique et diagnostics différentiels</h2><h3 id="n04-a07-partie-1">1. Confirmer et quantifier la protéinurie</h3><p>La première étape établit que la protéinurie est de rang néphrotique et mesure l’albumine. KDIGO préfère la récolte des urines de 24 heures lorsque l’on débute ou intensifie une immunosuppression, ou que l’état du patient change, parce qu’un rapport protéines/créatinine isolé varie avec la production de créatinine et la concentration de l’urine. Chez l’enfant, le rapport se mesure sur la première urine du matin. La première miction du matin sous-estime la protéinurie de 24 heures d’environ 20 % et ne détecte pas une protéinurie orthostatique ; un compromis consiste à doser le rapport sur une aliquote d’une récolte de 24 heures prévue. La <button class="w" data-k="n04-calc-rpc">fenêtre de calcul</button> détaille le rapport, et l’<button class="w" data-k="n04-orthostatique">encadré sur la protéinurie orthostatique</button> précise le piège.</p><h3 id="n04-a07-partie-2">2. Fonction rénale, sédiment et bilan de base</h3><p>Pour estimer le débit de filtration glomérulaire, KDIGO préfère l’équation CKD-EPI fondée sur la créatinine chez l’adulte et l’équation de Schwartz modifiée chez l’enfant. Le sédiment urinaire est examiné systématiquement : morphologie des érythrocytes, cylindres, acanthocytes. Une hématurie glomérulaire oriente vers une glomérulonéphrite et non vers une néphropathie purement podocytaire.</p><p>Chez tout adulte présentant un premier syndrome néphrotique, il faut doser les anticorps anti-PLA2R (ELISA ou immunofluorescence indirecte) et rechercher les causes secondaires. Le bilan de base proposé par le consensus autrichien pour la néphropathie membraneuse comprend : anticorps anti-PLA2R, anticorps antinucléaires, fractions C3 et C4, anticorps anti-MPO et anti-PR3 en cas de microhématurie, sérologies des hépatites B et C, anticorps anti-THSD7A si le test PLA2R est négatif, bandelette, sédiment, rapport protéines/créatinine, une récolte initiale de 24 heures pour étalonner le rapport, et chez tous une échographie abdominale et une radiographie (ou un scanner) du thorax. En Suisse, ces dosages sont disponibles (CHUV et Viollier : ELISA, deux fois par mois, délai de 1 à 2 semaines).</p><h3 id="n04-a07-partie-3">3. Biopsie ou pas : la décision qui change selon l’âge</h3><p>La biopsie rénale est l’examen de référence des glomérulopathies. Elle se justifie lorsque son résultat doit modifier le traitement ou apporter un pronostic. Le tableau oppose les situations. Il répond à la question « puis-je traiter sans biopsie ? ». Lire d’abord la colonne de l’âge ; l’erreur fréquente est d’étendre à l’adulte la règle pédiatrique du traitement d’épreuve par corticoïdes.</p><table class="t"><thead><tr><th>Situation</th><th>Biopsie ?</th><th>Justification</th></tr></thead><tbody><tr><td>Enfant &lt; 12 ans, syndrome néphrotique corticosensible, sans signe atypique</td><td>Non, traitement d’emblée</td><td>La réponse à quatre semaines de corticoïdes tient lieu de diagnostic</td></tr><tr><td>Enfant avec signe atypique (hématurie macroscopique, C3 bas, insuffisance rénale aiguë non liée à l’hypovolémie, hypertension soutenue, arthrite, éruption)</td><td>Oui, d’emblée</td><td>Ces signes évoquent une autre maladie</td></tr><tr><td>Enfant ≥ 12 ans à la présentation, corticorésistance (ou secondaire), baisse de fonction sous anticalcineurines ou exposition de 2 à 3 ans</td><td>Oui</td><td>Autre glomérulopathie ou toxicité</td></tr><tr><td>Adulte avec anti-PLA2R nettement positifs, DFGe &gt; 60 mL/min/1,73 m² et autres causes exclues</td><td>Non (position ÖGN, KDIGO : surtout si DFGe normal)</td><td>Spécificité de 0,99 du test, sensibilité de 0,78</td></tr><tr><td>Adulte, syndrome néphrotique aigu sans cause identifiée (par exemple sans anti-PLA2R)</td><td>Oui, en principe</td><td>Seule la biopsie distingue lésions minimes et hyalinose</td></tr><tr><td>Adulte, fonction altérée, croissants possibles, néphropathie diabétique associée</td><td>Oui</td><td>Le test sérologique ne suffit plus</td></tr></tbody></table><p>Le tableau se lit avec M. R. : anticorps nettement positifs et DFGe de 85, donc pas de biopsie selon le consensus autrichien. Léa, 4 ans, sans signe atypique, reçoit directement la prednisone.</p><p>La spécificité de 0,99 d’un test positif signifie que presque aucun patient sans néphropathie membraneuse n’est positif. La sensibilité de 0,78 signifie que 22 % des patients atteints sont négatifs ; un test négatif n’exclut donc pas la maladie, et il impose la biopsie chez l’adulte. Cette méta-analyse a porté sur 710 patients et 1502 témoins.</p><div class="quiz ui"><p>Un adulte de 48 ans a un syndrome néphrotique complet, des anticorps anti-PLA2R nettement positifs et un DFGe de 85 mL/min/1,73 m². Une biopsie rénale est-elle nécessaire avant de traiter ?</p><button data-ok="1">Non. Les anticorps nettement positifs avec DFGe supérieur à 60 mL/min/1,73 m² et autres causes exclues permettent de renoncer à la biopsie selon le consensus autrichien.</button><button data-ok="0">Oui, toute néphropathie de l’adulte exige une biopsie sans exception.</button><p class="fb" hidden>Le consensus autrichien et KDIGO admettent un traitement sans biopsie dans la néphropathie membraneuse à anti-PLA2R positifs, surtout si le DFGe est normal. Le bilan des conditions associées reste obligatoire.</p></div><figure id="n04-fig-algo"><svg viewBox="0 0 760 420" role="img" aria-label="Schéma didactique de la démarche diagnostique du syndrome néphrotique chez l’adulte et chez l’enfant" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif" font-size="12" fill="#222" stroke="#222" stroke-width="1.5">

<figcaption>Figure 3 — Schéma didactique de la démarche diagnostique chez l’adulte (à gauche) et chez l’enfant (à droite). Les seuils viennent de KDIGO 2021 et 2025 et du consensus autrichien. Il ne remplace pas la décision spécialisée.</figcaption></figure><h3 id="n04-a07-partie-4">4. Les diagnostics différentiels, de la gravité à la fréquence</h3><p>Devant des œdèmes et une protéinurie, le médecin écarte d’abord les diagnostics qui menacent la vie ou le rein, puis les plus fréquents. Le tableau les classe dans cet ordre. Il répond à la question « que dois-je ne pas manquer ? ». La colonne du discriminant donne le signe qui sépare chaque entité du syndrome néphrotique simple ; la dernière colonne donne l’examen décisif.</p><table class="t"><thead><tr><th>Rang</th><th>Entité</th><th>Gravité</th><th>Discriminant</th><th>Examen décisif</th></tr></thead><tbody><tr><td>1</td><td>Syndrome néphrotique compliqué (thrombose de la veine rénale, embolie pulmonaire, péritonite de l’enfant, insuffisance rénale aiguë)</td><td>Menace vitale ou rénale</td><td>Douleur lombaire, LDH élevée, hématurie macroscopique (thrombose rénale) ; ascite fébrile de l’enfant ; hausse de la créatinine</td><td>Imagerie vasculaire selon le site ; ponction et culture d’ascite ; créatinine</td></tr><tr><td>2</td><td>Glomérulonéphrite rapidement progressive ou syndrome néphritique avec protéinurie abondante</td><td>Menace rénale</td><td>Hématurie glomérulaire, cylindres érythrocytaires, acanthocytes, hypertension, baisse rapide du DFG ; C3 bas, signes systémiques de vascularite</td><td>Sédiment, C3 et C4, ANCA (MPO et PR3), biopsie (N04.7 = croissants)</td></tr><tr><td>3</td><td>Néphropathie membraneuse (N04.2)</td><td>Risque thrombotique maximal</td><td>Adulte des 4e et 5e décennies, anti-PLA2R positifs (environ 75 % des formes primaires), microhématurie dans 30 à 40 %</td><td>Anti-PLA2R (diagnostic sans biopsie si nettement positifs et DFGe &gt; 60) ; biopsie sinon</td></tr><tr><td>4</td><td>Lésions glomérulaires minimes (N04.0)</td><td>Insuffisance rénale aiguë dans 10 à 40 %</td><td>Début brutal daté, enfant ou adulte jeune, réponse « tout ou rien » aux corticoïdes</td><td>Enfant &lt; 12 ans : réponse à 4 semaines de corticoïdes ; adulte : biopsie (effacement des pédicelles en microscopie électronique)</td></tr><tr><td>5</td><td>Hyalinose segmentaire et focale (N04.1) primaire, secondaire ou génétique</td><td>Corticorésistance, insuffisance rénale</td><td>Primaire : syndrome néphrotique complet ; secondaire : protéinurie néphrotique avec albumine &gt; 30 g/L ; génétique : familial, syndromique, &lt; 1 an, corticorésistance</td><td>Biopsie (microscopie optique et électronique) ; test génétique selon indications</td></tr><tr><td>6</td><td>Glomérulopathies secondaires (diabète N08.3 avec E10–E14, amylose E85, lupus, infections, cancers, médicaments)</td><td>Variable</td><td>Contexte (diabète, myélome, maladie systémique, AINS, lithium, voyages), sérologies</td><td>Sérologies, anticorps antinucléaires, électrophorèse et chaînes légères libres, biopsie</td></tr><tr><td>7</td><td>Protéinurie de rang néphrotique sans syndrome néphrotique (hyalinose secondaire, néphropathie à IgA)</td><td>Progression lente</td><td>Albumine normale, œdème absent ou discret</td><td>Albumine sérique avec méthode connue ; rapport protéines/créatinine</td></tr></tbody></table><p>Quand les œdèmes existent sans protéinurie de rang néphrotique, la cause est extrarénale : insuffisance cardiaque (voir le cours I50), cirrhose (voir K74), causes veineuses ou médicamenteuses. Ces entités ne sont pas développées ici faute de source lue pour leurs critères. À l’inverse, une protéinurie isolée sans œdème peut être orthostatique (première urine du matin non protéinurique) ou non néphrotique (0,3 à 3,4 g/24 h, albumine normale, sans symptôme).</p><p>Pour M. R., le rang 1 est écarté (pas de douleur lombaire, de fièvre ni de hausse de la créatinine) ; le rang 2 l’est aussi (dans ce cas fictif, ni hypertension ni cylindres érythrocytaires) ; le rang 3 est le plus probable.</p><h3 id="n04-a07-partie-5">5. Quand adresser en Suisse</h3><p>La Société suisse de néphrologie recommande d’adresser au néphrologue tout patient dont le rapport albumine/créatinine est constamment supérieur à 30 mg/mmol (300 mg/g), qui présente une hématurie glomérulaire, une maladie rénale d’origine inconnue, un DFGe inférieur à 30, une insuffisance rénale aiguë ou une chute brutale et persistante du DFGe, des anomalies persistantes du potassium ou une maladie héréditaire. Un syndrome néphrotique remplit toujours le premier critère.</p><div class="key"><b>À retenir.</b> Le diagnostic confirme d’abord le rang néphrotique et l’albumine, puis cherche la forme. Chez l’adulte, les anti-PLA2R se dosent d’emblée et permettent parfois d’éviter la biopsie ; chez l’enfant de moins de 12 ans sans signe atypique, la réponse aux corticoïdes remplace la biopsie. Un test anti-PLA2R négatif n’exclut pas la néphropathie membraneuse. Tout syndrome néphrotique est adressé au néphrologue.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN — dépistage et identification de la maladie rénale chronique (17.03.2025)</a> ; <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/download/DLA_INV_01_00380?no_cache=1" target="_blank" rel="noopener">CHUV — catalogue des analyses, anticorps anti-PLA2R (V12, 27.09.2023)</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></section><section class="ilot" id="n04-a08"><h2><span class="n">A08</span> Urgences et complications</h2><h3 id="n04-a08-partie-1">1. Les situations graves d’abord</h3><div class="alert"><b>Évaluation urgente.</b> Quatre situations imposent une évaluation urgente. <b>(1) Une thrombose</b> : douleur lombaire, hématurie macroscopique et LDH élevée évoquent une thrombose de la veine rénale ; une embolie pulmonaire peut être silencieuse. <b>(2) Une insuffisance rénale aiguë</b> : elle complique 10 à 40 % des lésions minimes de l’adulte et peut venir d’une déplétion volémique par diurétiques ou d’un bloqueur du système rénine-angiotensine à forte dose. <b>(3) Une infection</b>, notamment une péritonite chez l’enfant avec ascite fébrile. <b>(4) Une hyperkaliémie</b> sous spironolactone associée à un bloqueur du système rénine-angiotensine. Les sources lues ne publient pas de liste formelle d’hospitalisation : ces quatre situations sont celles que les sources qualifient de graves.</div><p>Les thromboses sont la complication la plus redoutée. Le risque artériel et veineux dépasse celui de la population générale, surtout pendant les six premiers mois. Les thromboses sont plus fréquentes chez l’adulte et plus souvent veineuses : thrombose veineuse profonde, thrombose de la veine rénale, embolie pulmonaire parfois silencieuse. Le risque est maximal dans la néphropathie membraneuse. Les meilleurs prédicteurs sont l’histologie, la protéinurie et l’albumine inférieure à 25 g/L ; s’y ajoutent un antécédent de thrombose, une thrombophilie, des antiphospholipides, l’immobilité, l’obésité, un cancer, une grossesse ou une chirurgie. Historiquement, la thrombose veineuse profonde survient dans environ 15 % des cas et l’embolie pulmonaire dans 10 à 30 % ; près de la moitié des thromboses surviennent à la première manifestation, et la corticothérapie à forte dose ajoute un risque. Ces données sont anciennes et probablement en baisse avec les traitements actuels, selon la source. Dans les lésions minimes, les thromboses veineuses touchent 10 à 37 % des patients et les thromboses artérielles 0,3 % par an.</p><h3 id="n04-a08-partie-2">2. Un tableau pour ne rien manquer</h3><p>Le tableau relie chaque complication à son mécanisme, à son signe d’alerte et à l’examen qui la confirme. Il répond à la question « que surveiller chez ce patient ? ». Lire la colonne du signe d’alerte avant celle de l’examen ; l’erreur fréquente est de se fier aux D-dimères : ils sont élevés dans le syndrome néphrotique sans thrombose cliniquement pertinente et ne servent pas à décider d’une prophylaxie.</p><table class="t"><thead><tr><th>Complication</th><th>Mécanisme</th><th>Signe d’alerte</th><th>Examen</th></tr></thead><tbody><tr><td>Thrombose veineuse ou artérielle, embolie pulmonaire</td><td>Perte d’antithrombine, protéines procoagulantes élevées, fibrinolyse diminuée</td><td>Mollet douloureux, dyspnée ; sinus veineux cérébraux et veines mésentériques possibles</td><td>Imagerie selon le site ; les D-dimères ne guident pas la décision</td></tr><tr><td>Thrombose de la veine rénale</td><td>Même mécanisme, risque maximal dans la néphropathie membraneuse</td><td>Douleur lombaire, LDH élevée, hématurie macroscopique ; bilatérale : insuffisance rénale aiguë</td><td>Imagerie vasculaire rénale</td></tr><tr><td>Infection bactérienne</td><td>Risque infectieux du syndrome ; IgG parfois abaissées</td><td>Fièvre ; infections répétées</td><td>Dosage des IgG en cas de récidive ; cultures</td></tr><tr><td>Péritonite bactérienne spontanée (enfant)</td><td>Ascite infectée</td><td>Ascite fébrile, signes abdominaux (bactériémie possible)</td><td>Examen microscopique et culture du liquide ; CRP utile, vitesse de sédimentation inutile ; antibiotiques par voie parentérale après prélèvements</td></tr><tr><td>Insuffisance rénale aiguë (surtout lésions minimes)</td><td>Sexe masculin, âge, hypertension, albumine basse, déplétion volémique, bloqueur du système rénine-angiotensine, néphrotoxiques</td><td>Hausse de la créatinine supérieure à 1,5 fois</td><td>Créatinine ; suspendre temporairement le bloqueur</td></tr><tr><td>Hypovolémie et hyperkaliémie iatrogènes</td><td>Diurétiques excessifs ; spironolactone avec bloqueur du système rénine-angiotensine</td><td>Fatigue, hypotension ; potassium élevé</td><td>Créatinine, potassium</td></tr></tbody></table><p>M. R. relève du risque thrombotique maximal : néphropathie membraneuse, albumine de 19 g/L. La prophylaxie anticoagulante, décidée à l’îlot 9, devient le premier acte de traitement de soutien.</p><div class="key"><b>À retenir.</b> La thrombose domine le risque, surtout dans la néphropathie membraneuse et pendant les six premiers mois. L’insuffisance rénale aiguë touche 10 à 40 % des lésions minimes. Les D-dimères ne guident pas la prophylaxie. L’enfant avec ascite fébrile doit bénéficier d’une ponction.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-a3">▲ Loi de Pareto — Diagnostic, différentiels et urgences</button></section>
<section class="ilot" id="n04-a09"><h2><span class="n">A09</span> Traitement de soutien commun</h2><h3 id="n04-a09-partie-1">1. Trois objectifs avant tout traitement spécifique</h3><p>Le traitement de soutien vise trois buts : soulager l’œdème, protéger le rein et prévenir les complications (thrombose, infection, dyslipidémie). Il s’applique quelle que soit la forme histologique. La protéinurie sert de repère de réussite : lorsqu’elle descend vers un niveau non néphrotique, l’albumine remonte, ce qui réduit le risque thromboembolique et infectieux et améliore les symptômes. La perte de fonction rénale est largement prévenue si la protéinurie descend sous 0,5 g/jour, et ralentie sous 1 à 1,5 g/jour, sauf dans les lésions minimes et le syndrome corticosensible, où la rémission complète définit l’évolution.</p><h3 id="n04-a09-partie-2">2. L’œdème : le sodium d’abord, puis les diurétiques</h3><p>KDIGO limite le sodium alimentaire à moins de 2,0 g par jour (moins de 90 mmol par jour). La Société suisse de néphrologie recommande moins de 5 g de sel par jour. Les deux cibles coïncident, comme le montre la <button class="w" data-k="n04-calc-sel">conversion du sodium en sel</button> : 2,0 g de sodium valent environ 87 mmol, soit environ 5,1 g de sel. Une restriction hydrique est inutile, sauf en cas d’hyponatrémie, car ces patients sont souvent hypovolémiques.</p><p>Le diurétique de l’anse est le traitement de première ligne, en deux prises par jour (une prise est acceptable si le débit de filtration est réduit). La dose augmente jusqu’à obtenir une diurèse significative ou jusqu’à la dose maximale efficace. Si le médicament échoue ou si sa biodisponibilité est douteuse, on passe au bumétanide ou au torasémide. La <button class="w" data-k="n04-resistance">résistance aux diurétiques</button> a trois explications : un volume de distribution accru en hypoalbuminémie, la liaison du diurétique filtré à l’albumine tubulaire, et l’œdème de la paroi intestinale qui rend l’absorption orale incertaine. En cas de résistance, on associe un diurétique de mécanisme différent : thiazidique à forte dose, amiloride, acétazolamide en cas d’alcalose, ou spironolactone. Le thiazidique se donne 2 à 5 heures avant le diurétique de l’anse intraveineux. La voie intraveineuse en injection rapide expose à l’ototoxicité (surdité, acouphènes) ; la perfusion continue la limite.</p><p>Lorsque le diurétique intraveineux maximal échoue et que l’albumine est inférieure à 20 g/L, KDIGO propose de l’associer à de l’albumine intraveineuse (25 à 50 g, 30 à 60 minutes avant le diurétique), avec un effet transitoire car l’albumine s’élimine vite. En Suisse, cet usage est hors indication de l’information professionnelle d’Albunorm® (voir la <button class="w" data-k="n04-contentieux-albumine">fenêtre dédiée</button>). Les ultimes recours sont l’ultrafiltration et l’hémodialyse. La surveillance porte sur l’hyponatrémie (thiazidiques), l’hypokaliémie, la baisse du DFG, la déplétion volémique (chez l’enfant et le sujet âgé) et l’hyperkaliémie (spironolactone ou éplérénone associées à un bloqueur du système rénine-angiotensine).</p><h3 id="n04-a09-partie-3">3. Néphroprotection, pression artérielle et lipides</h3><p>Chez le patient hypertendu et protéinurique, l’inhibiteur de l’enzyme de conversion ou l’antagoniste des récepteurs de l’angiotensine II se donne à la dose maximale tolérée. Ils réduisent la protéinurie jusqu’à 40 à 50 % de façon dose-dépendante, surtout si le régime sans sel est respecté. Une hausse de 10 à 20 % de la créatinine est attendue et hémodynamique ; on n’arrête pas le traitement pour une hausse modérée et stable (jusqu’à 30 %), mais on l’arrête en cas d’aggravation progressive ou d’hyperkaliémie réfractaire. L’association des deux classes expose à l’insuffisance rénale aiguë et à l’hyperkaliémie.</p><p>Une restriction s’impose : <button class="w" data-k="n04-iec-debut-brutal">ne pas débuter un bloqueur du système rénine-angiotensine lors d’un début brutal de syndrome néphrotique</button>, car ces médicaments peuvent provoquer une insuffisance rénale aiguë, surtout dans les lésions minimes. On peut aussi différer chez le non-hypertendu dont la podocytopathie attendue répond rapidement à l’immunosuppression. En cas de risque de déplétion (« jours de maladie »), on suspend ces médicaments et les diurétiques. En Suisse, l’antiprotéinurie du syndrome néphrotique non diabétique est hors indication pour le lisinopril, comme le détaille la <button class="w" data-k="n04-contentieux-iec">fenêtre sur l’usage hors indication</button>.</p><p>Pour la pression artérielle, KDIGO vise une systolique inférieure à 120 mmHg (non validée dans les glomérulonéphrites, 120 à 130 en pratique) ; la Société suisse de néphrologie retient 120 à 129 mmHg pour la maladie rénale chronique, cible adoptée ici (voir la <button class="w" data-k="n04-contentieux-pression">fenêtre</button>). Chez l’enfant, la moyenne ambulatoire sur 24 heures doit rester au plus au 50e percentile.</p><p>Pour la dyslipidémie, le traitement est envisageable, surtout avec d’autres facteurs de risque. Les mesures d’hygiène de vie sont de première ligne chez l’enfant. La statine est de première ligne si la dyslipidémie persiste. La mention internationale d’un traitement dès 8 ans, selon le contexte familial et des LDL ou Lp(a) très élevés, ne vaut pas autorisation de tout produit suisse : la FI de Sortis ne l’autorise pas chez l’enfant ou l’adolescent. Le choix pédiatrique dépend du produit, de son indication et de l’avis spécialisé. Le contrôle des lipides et de la tolérance se fait 4 à 12 semaines après le début, puis tous les 3 à 12 mois. Les non-statines (séquestrants, fibrates avec risque de hausse de créatinine, ézétimibe, inhibiteurs de PCSK9, aphérèse) sont réservés à l’intolérance. Les myalgies et la myosite sont plus fréquentes lorsque la statine est associée à un anticalcineurine.</p><h3 id="n04-a09-partie-4">4. Alimentation et hygiène de vie</h3><p>Les mesures d’hygiène de vie comprennent un sodium inférieur à 2,0 g par jour, la normalisation du poids, un exercice régulier et l’arrêt du tabac. La Société suisse de néphrologie recommande des protéines à 0,8 g/kg/jour et 150 minutes d’activité par semaine. KDIGO propose 0,8 à 1 g/kg/jour de protéines, plus 1 g par gramme de protéinurie (jusqu’à 5 g/jour) en cas de protéinurie néphrotique ; 0,8 g/kg/jour si le DFGe est inférieur à 60 ; il faut éviter moins de 0,6 g/kg/jour. La sécurité de la restriction protéique n’est pas établie chez l’enfant. L’apport énergétique est de 35 kcal/kg/jour (30 à 35 si le DFGe est inférieur à 60), avec des graisses à moins de 30 % des calories.</p><h3 id="n04-a09-partie-5">5. Prophylaxie de la thrombose : décider avec l’albumine, la forme et le saignement</h3><p>La décision d’anticoaguler en prévention associe le taux d’albumine, la forme du syndrome, les facteurs de risque thrombotiques et le risque hémorragique. Les valeurs dépendent de la méthode de dosage de l’albumine : 25 g/L au vert de bromocrésol correspondent à environ 20 g/L au pourpre de bromocrésol ou en immunodosage, et 32 g/L à 30 g/L. Les schémas de prévention ne sont pas uniformisés : la figure 11 de KDIGO emploie une anticoagulation à dose pleine à envisager dans certains profils à haut risque, tandis que l’ÖGN souligne l’absence d’essais contrôlés et de frontière posologique uniforme entre prévention et traitement. Les doses prophylactiques et curatives de la FI ne doivent donc pas être interchangées automatiquement ; le choix relève d’une appréciation spécialisée du bénéfice et du risque. Le tableau gradue la conduite selon l’albumine. Il répond à la question « à partir de quel taux d’albumine faut-il envisager une prophylaxie ? ». Lire d’abord la méthode de dosage, puis la forme ; l’erreur fréquente est de comparer un taux au pourpre de bromocrésol à un seuil exprimé au vert de bromocrésol.</p><table class="t"><thead><tr><th>Situation</th><th>Albumine (vert / pourpre de bromocrésol)</th><th>Conduite proposée</th><th>Source</th></tr></thead><tbody><tr><td>Thrombose avérée</td><td>Quelle que soit l’albumine</td><td>Anticoagulation curative pendant 6 à 12 mois et/ou la durée du syndrome néphrotique</td><td>KDIGO 2021</td></tr><tr><td>Prévention générale de l’adulte</td><td>&lt; 20–25 g/L (25 g/L au vert de bromocrésol ≈ 20 g/L au pourpre), avec au moins un facteur : protéinurie &gt; 10 g/jour, IMC &gt; 35 kg/m², prédisposition génétique, insuffisance cardiaque NYHA III–IV, chirurgie orthopédique ou abdominale récente, immobilisation prolongée</td><td>Prophylaxie à dose curative envisagée en l’absence de contre-indication</td><td>KDIGO 2021</td></tr><tr><td>Néphropathie membraneuse, risque veineux</td><td>&lt; 25 g/L (vert) ou &lt; 20 g/L (pourpre)</td><td>Évaluer le risque hémorragique ; antivitamine K si faible ; débuter par héparine de bas poids moléculaire à faible dose puis relais</td><td>KDIGO 2021 (algorithme d’experts)</td></tr><tr><td>Néphropathie membraneuse, risque artériel</td><td>&lt; 32 g/L (vert) ou &lt; 30 g/L (pourpre)</td><td>Estimer le risque artériel (score de Framingham, DFGe, diabète, antécédent) ; aspirine si &gt; 20 pour 1000 patients-années ; l’aspirine ne prévient pas la thrombose veineuse</td><td>KDIGO 2021</td></tr><tr><td>Consensus autrichien</td><td>&lt; 25 g/L (vert) ou &lt; 20 g/L (pourpre) avec risque élevé (néphropathie membraneuse ou autre facteur) sans risque hémorragique ; chez tout patient si &lt; 20 g/L</td><td>Énoxaparine ou antivitamine K (voir fenêtre) ; aspirine 75 mg/jour possible entre 25 et 29 g/L dans la néphropathie membraneuse ; arrêt quand l’albumine dépasse durablement 25–30 g/L</td><td>ÖGN 2023</td></tr></tbody></table><p>Les contre-indications relatives à l’anticoagulation sont : la préférence ou l’adhérence du patient, une diathèse hémorragique, une lésion cérébrale à risque, des mutations modifiant l’effet des antivitamines K, la fragilité (risque de chutes) et un antécédent d’hémorragie digestive. Les glucocorticoïdes augmentent eux-mêmes le risque thrombotique. Un exemple chiffré éclaire le tableau : M. R. a une albumine de 19 g/L au pourpre de bromocrésol, inférieure à 20 g/L ; avec une néphropathie membraneuse, il remplit donc le critère d’une prophylaxie à discuter, sous réserve de l’absence de risque hémorragique. Un autre patient à 22 g/L au pourpre, dont la valeur est supérieure à 20 g/L, ne remplit pas ce critère veineux par l’albumine seule et relève de l’évaluation du risque artériel (voir le <button class="w" data-k="n04-anticoag">schéma décisionnel</button>).</p><p>Pour le choix du médicament, l’énoxaparine est peu liée aux protéines et son effet est prévisible, mais le dosage de l’anti-Xa est recommandé si le DFGe est inférieur à 30, l’IMC supérieur à 40, en cas de maigreur ou de grossesse. Les antivitamines K sont liées à 99 % à l’albumine : en hypoalbuminémie, leur clairance augmente et la demi-vie peut être divisée par deux. L’INR doit donc être contrôlé souvent, surtout quand l’albumine remonte au début de la rémission. En Suisse, les antivitamines K disponibles sont la phenprocoumone (Marcoumar®) et l’acénocoumarol (Sintrom®), et non la warfarine, qui n’a pas d’information professionnelle trouvée (voir la <button class="w" data-k="n04-contentieux-avk">fenêtre sur les antivitamines K</button>). Les anticoagulants oraux directs sont hors indication dans cette prophylaxie. Les <button class="w" data-k="n04-calc-anticoag">doses et l’anti-Xa</button> sont détaillés à part.</p><h3 id="n04-a09-partie-6">6. Vaccinations et prophylaxies infectieuses</h3><p>En Suisse, le syndrome néphrotique est une indication de vaccination contre la grippe et contre les pneumocoques dès le diagnostic. La vaccination contre la varicelle est recommandée chez les personnes d’au moins 40 ans non immunes. Un seul vaccin conjugué (PCV) suffit dès 2 ans ; le vaccin polysaccharidique à 23 valences n’est plus recommandé en Suisse depuis 2014. Le tableau résume l’offre. KDIGO conseille un schéma différent (conjugué puis polysaccharidique) ; la divergence est tranchée en faveur du plan suisse (voir la <button class="w" data-k="n04-contentieux-pcv">fenêtre dédiée</button>).</p><table class="t"><thead><tr><th>Vaccin</th><th>Population</th><th>Précision</th></tr></thead><tbody><tr><td>Grippe</td><td>Syndrome néphrotique, dès le diagnostic</td><td>Annuelle</td></tr><tr><td>Pneumocoque conjugué (PCV)</td><td>Dès 2 ans ; 5 à 17 ans : PCV15 ou PCV20 (hors étiquette de 6 à 17 ans) ; 18 à 64 ans : PCV21</td><td>Un seul vaccin conjugué ; polysaccharidique à 23 valences non recommandé depuis 2014</td></tr><tr><td>Varicelle</td><td>Personnes ≥ 40 ans non immunes avec syndrome néphrotique ; enfant non immun dès que possible après le premier épisode corticosensible</td><td>Vaccin vivant atténué (voir ci-dessous)</td></tr><tr><td>Vaccins vivants atténués</td><td>En principe contre-indiqués en cas de déficit immunitaire</td><td>KDIGO : différer jusqu’à une prednisone &lt; 20 mg/jour et/ou 1 à 3 mois après l’arrêt des immunosuppresseurs</td></tr></tbody></table><p>Le plan suisse définit l’<button class="w" data-k="n04-immunosuppression-severe">immunosuppression sévère</button> par une corticothérapie d’au moins 2 mg/kg/jour (enfant) ou d’au moins 20 mg/jour d’équivalent prednisolone pendant plus de deux semaines, la déplétion des lymphocytes B, une chimiothérapie forte ou des associations. Lire cette définition avant de vacciner un patient sous prednisone à forte dose.</p><p>Deux prophylaxies divisent les sources. Pour la pneumocystose, KDIGO propose de l’envisager sous forte dose de prednisone, rituximab ou cyclophosphamide ; le consensus autrichien la juge non indiquée dans les lésions minimes, la hyalinose, la néphropathie membraneuse et la néphropathie à IgA en Europe centrale. Aucune recommandation suisse n’a été trouvée (voir la <button class="w" data-k="n04-contentieux-pjp">fenêtre « contentieux »</button>). Pour l’inhibiteur de SGLT2, le consensus autrichien le vise dans la néphropathie membraneuse, mais l’information professionnelle suisse de Forxiga® ne le recommande pas chez les patients traités par immunosuppresseurs (voir la <button class="w" data-k="n04-contentieux-sglt2">fenêtre dédiée</button>).</p><div class="key"><b>À retenir.</b> Le sodium limité à moins de 2,0 g par jour (environ 5 g de sel) et un diurétique de l’anse en deux prises forment la base. Les bloqueurs du système rénine-angiotensine réduisent la protéinurie, mais ne se commencent pas lors d’un début brutal. L’anticoagulation préventive se décide avec l’albumine (selon la méthode), la forme (néphropathie membraneuse en tête) et le risque hémorragique. Les vaccinations suisses sont indiquées dès le diagnostic.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN — dépistage et identification de la maladie rénale chronique (17.03.2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">OFSP/CFV — Plan de vaccination suisse 2026 (février 2026)</a> ; <a data-reference-source="1" href="https://www.infovac.ch/docs/public/streptococcus/ofsp-cfv-prise-de-position-recommandation-des-pcv-par-groupe-cible-e--tat-au-01-07-26-fr.pdf" target="_blank" rel="noopener">OFSP/CFV — vaccins antipneumococciques conjugués par groupe d’âge (01.07.2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680626600032" target="_blank" rel="noopener">Information professionnelle Swissmedic — Albunorm® (mars 2023)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle Swissmedic — Forxiga® (août 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680492970178" target="_blank" rel="noopener">Information professionnelle Swissmedic — Zestril® (avril 2024)</a>.</p></section><section class="ilot" id="n04-a10"><h2><span class="n">A10</span> Traitement spécifique selon la forme</h2><h3 id="n04-a10-partie-1">1. Lésions glomérulaires minimes de l’adulte</h3><p>KDIGO 2021 recommande des glucocorticoïdes oraux à forte dose (recommandation de force 1, niveau de preuve C) : prednisone ou prednisolone à 1 mg/kg/jour (maximum 80 mg) ou 2 mg/kg un jour sur deux (maximum 120 mg), pendant au moins 4 semaines et au plus 16 semaines. La décroissance commence 2 semaines après la rémission complète. La durée doit être individualisée : le texte de KDIGO décrit environ 24 semaines d’exposition totale, tandis que sa figure 45 mentionne une décroissance d’au moins 24 semaines. Le consensus européen ÖGN vise au plus 24 semaines de traitement total ; ces durées ne doivent pas être additionnées ni transformées en minimum universel de décroissance (voir la fenêtre de discussion ci-dessous). Le taux de rémission est de 80 à 90 %. Le <button class="w" data-k="n04-calc-prednisone">calcul de la dose</button> part du poids sec, c’est-à-dire du poids sans les œdèmes, et la <button class="w" data-k="n04-contentieux-prednisone">fenêtre « contentieux »</button> oppose les plafonds et les durées des sources.</p><p>Le consensus autrichien prescrit la prednisolone à 1 mg/kg/jour le matin (7 à 8 h) sur le poids d’avant les œdèmes. Il limite la dose à 60 mg/jour, comme les recommandations nationales et l’essai TURING, et juge le schéma alterné inhabituel en Europe centrale. La moitié des patients sont en rémission complète à 4 semaines (médiane de 2 mois), environ 80 % à 16 semaines, et 25 % sans rémission. La décroissance est de 5 à 10 mg par semaine après la rémission (recommandation de KDIGO citée par l’ÖGN), pour une durée totale d’au plus 24 semaines. Environ deux tiers des patients rechutent après l’arrêt, la moitié dans les 6 mois.</p><p>Lorsque les glucocorticoïdes sont contre-indiqués, KDIGO propose le cyclophosphamide oral (2 à 2,5 mg/kg/jour pendant 8 semaines), la ciclosporine (3 à 5 mg/kg/jour pendant 1 à 2 ans), le tacrolimus (0,05 à 0,1 mg/kg/jour pendant 1 à 2 ans) ou le mycophénolate mofétil avec des glucocorticoïdes réduits. En cas de rechutes fréquentes ou de corticodépendance, il propose le cyclophosphamide (si jamais reçu), le rituximab, les anticalcineurines (cibles initiales : ciclosporine 150 à 200 ng/ml, tacrolimus 4 à 7 ng/ml) ou le mycophénolate mofétil (1000 mg deux fois par jour). Une rechute peu fréquente se traite par glucocorticoïdes. Le rituximab, le tacrolimus et le mycophénolate mofétil sont hors indication suisse dans cette situation.</p><h3 id="n04-a10-partie-2">2. Définir la réponse</h3><p>Les mots « rémission », « rechute » et « corticorésistance » ont des définitions chiffrées. Le tableau les donne pour l’adulte (lésions minimes et hyalinose segmentaire et focale) et pour l’enfant. Il répond à la question « ce patient est-il en rémission ? ». Lire d’abord le critère de protéinurie, puis l’albumine, puis la durée ; l’erreur fréquente est de déclarer une rémission sur une seule mesure.</p><table class="t"><thead><tr><th>Terme</th><th>Adulte (KDIGO 2021)</th><th>Enfant (KDIGO 2025)</th></tr></thead><tbody><tr><td>Rémission complète</td><td>Protéinurie &lt; 0,3 g/jour ou rapport &lt; 30 mg/mmol, créatinine stable, albumine &gt; 35 g/L</td><td>Rapport ≤ 20 mg/mmol ou bandelette négative ou traces, ou &lt; 100 mg/m²/jour, pendant au moins 3 jours consécutifs</td></tr><tr><td>Rémission partielle</td><td>0,3 à 3,5 g/jour (rapport de 30 à 350 mg/mmol) et baisse de plus de 50 %</td><td>Rapport &gt; 20 et &lt; 200 mg/mmol et, si disponible, albumine ≥ 30 g/L</td></tr><tr><td>Rechute</td><td>&gt; 3,5 g/jour (rapport &gt; 350 mg/mmol) après rémission complète</td><td>Retour d’une protéinurie de rang néphrotique après rémission complète (en pratique, bandelette ≥ 3+ pendant 3 jours consécutifs)</td></tr><tr><td>Corticorésistance</td><td>Protéinurie &gt; 3,5 g/jour avec baisse &lt; 50 % malgré prednisone 1 mg/kg/jour ou 2 mg/kg un jour sur deux pendant plus de 16 semaines</td><td>Absence de rémission complète à 4 semaines de prednisone à dose standard ; confirmation entre 4 et 6 semaines (répondeur tardif si rémission complète à 6 semaines)</td></tr><tr><td>Rechutes fréquentes</td><td>≥ 2 en 6 mois ou ≥ 4 en 12 mois</td><td>≥ 2 rechutes dans les 6 premiers mois après la rémission initiale ou ≥ 3 par 12 mois</td></tr><tr><td>Corticodépendance</td><td>Rechute sous traitement ou dans les 2 semaines suivant l’arrêt</td><td>2 rechutes consécutives sous corticothérapie ou dans les 14 jours suivant l’arrêt</td></tr></tbody></table><p>Pour la hyalinose segmentaire et focale, la rechute inclut aussi une hausse de plus de 50 % de la protéinurie pendant une rémission partielle ; la résistance aux anticalcineurines se définit par une baisse inférieure à 50 % après 4 à 6 mois au taux résiduel cible. Chez l’enfant, la corticosensibilité se définit par la rémission complète dans les 4 semaines. D’autres termes pédiatriques (corticorésistance secondaire, résistance aux anticalcineurines, multirésistance) sont détaillés dans la <button class="w" data-k="n04-reponse-enfant">fenêtre pédiatrique</button>.</p><h3 id="n04-a10-partie-3">3. Hyalinose segmentaire et focale</h3><p>Dans la forme primaire, les glucocorticoïdes à forte dose sont de première ligne (recommandation 1D) selon le même schéma que les lésions minimes, jusqu’à la rémission complète ou 16 semaines. Chez le répondeur, la corticothérapie dure au moins 6 mois au total, avec une décroissance de 5 mg toutes les 1 à 2 semaines. En cas de contre-indication, on utilise un anticalcineurine : ciclosporine à 3 à 5 mg/kg/jour en 2 prises (taux résiduel de 100 à 175 ng/ml) ou tacrolimus à 0,05 à 0,1 mg/kg/jour (5 à 10 ng/ml). En cas de corticorésistance, la ciclosporine ou le tacrolimus se prescrit au moins 6 mois (1C), puis au moins 12 mois si la réponse est obtenue. On réduit la dose si la créatinine dépasse de plus de 30 % la valeur de base et on arrête si le DFGe reste inférieur à 30. En revanche, une hyalinose de cause indéterminée ou secondaire ne reçoit pas d’immunosuppression : on traite la cause et on soutient ; la forme génétique évite aussi l’immunosuppression.</p><h3 id="n04-a10-partie-4">4. Néphropathie membraneuse : traiter selon le risque</h3><p>La néphropathie membraneuse se traite selon un niveau de risque qui combine la fonction rénale, la protéinurie, l’albumine et les anticorps. Le tableau gradue le risque de KDIGO et la conduite correspondante. Il répond à la question « ce patient mérite-t-il une immunosuppression ? ». Lire d’abord le DFGe, puis la protéinurie, puis l’albumine ; l’erreur fréquente est de traiter un patient à faible risque, pour lequel l’attente vigilante est la règle. Les valeurs seuils de ce score ne sont pas validées.</p><table class="t"><thead><tr><th>Niveau de risque</th><th>Critères</th><th>Conduite KDIGO 2021</th></tr></thead><tbody><tr><td>Faible</td><td>DFGe normal, protéinurie &lt; 3,5 g/jour et albumine &gt; 30 g/L (ou baisse &gt; 50 % après 6 mois d’inhibiteur de l’enzyme de conversion ou d’antagoniste de l’angiotensine II)</td><td>Attente vigilante</td></tr><tr><td>Modéré</td><td>DFGe normal, protéinurie &gt; 3,5 g/jour sans baisse de plus de 50 % après 6 mois, sans critère de risque élevé</td><td>Attente, ou rituximab, ou anticalcineurine avec ou sans glucocorticoïdes</td></tr><tr><td>Élevé</td><td>DFGe &lt; 60 et/ou protéinurie &gt; 8 g/jour pendant plus de 6 mois ; ou DFGe normal avec protéinurie &gt; 3,5 g/jour non réduite de 50 % et au moins un de : albumine &lt; 25 g/L (pourpre), anti-PLA2R &gt; 50 RU/ml, α1-microglobuline urinaire &gt; 40 µg/min, IgG urinaire &gt; 1 µg/min, β2-microglobuline &gt; 250 mg/jour, index de sélectivité &gt; 0,20</td><td>Rituximab, ou cyclophosphamide avec glucocorticoïdes, ou anticalcineurine avec rituximab</td></tr><tr><td>Très élevé</td><td>Syndrome néphrotique menaçant ou dégradation rapide inexpliquée</td><td>Cyclophosphamide avec glucocorticoïdes</td></tr></tbody></table><p>La recommandation de force 1B est d’utiliser le rituximab, ou le cyclophosphamide avec des glucocorticoïdes un mois sur deux pendant 6 mois, ou un traitement par anticalcineurine d’au moins 6 mois. KDIGO déconseille toute immunosuppression si la protéinurie est inférieure à 3,5 g/jour, l’albumine supérieure à 30 g/L (pourpre) et le DFGe supérieur à 60, ou si le syndrome néphrotique survient à DFGe normal sans facteur de risque ni complication grave.</p><p>Le tableau suivant détaille les schémas. Il répond à la question « comment administrer le traitement choisi ? ». Les doses cumulées de cyclophosphamide se calculent dans la <button class="w" data-k="n04-calc-cyclo">fenêtre dédiée</button>.</p><table class="t"><thead><tr><th>Schéma</th><th>Posologie (KDIGO 2021)</th></tr></thead><tbody><tr><td>Cyclophosphamide cyclique</td><td>Méthylprednisolone 1 g par voie intraveineuse 3 jours aux mois 1, 3 et 5 ; prednisone 0,5 mg/kg/jour aux mois 1, 3 et 5 ; cyclophosphamide 2,5 mg/kg/jour aux mois 2, 4 et 6</td></tr><tr><td>Cyclophosphamide continu</td><td>Méthylprednisolone idem ; prednisone 0,5 mg/kg un jour sur deux, mois 1 à 6 ; cyclophosphamide 1,5 mg/kg/jour, mois 1 à 6</td></tr><tr><td>Rituxi
