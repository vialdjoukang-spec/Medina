<template data-pop="g71-sm-faiblesse" data-title="Faiblesse musculaire : topographie et cotation">
<div class="lab">Définition</div><p>La faiblesse est une diminution de la force que le muscle produit contre une résistance. Elle se distingue de la fatigue, qui est une plainte subjective sans déficit objectif. Elle est le signe principal des myopathies, et sa distribution oriente le diagnostic [S21].</p>
<div class="lab">Normal</div><p>Un sujet sain cote 5 sur 5 à chaque muscle de l’échelle du Medical Research Council [S22].</p>
<div class="lab">Technique</div><p>Le patient est réchauffé et informé ; le test est interrompu en cas de fatigue. Chaque muscle est testé autour d’une seule articulation et coté de 0 (aucune contraction) à 5 (force normale) ; le grade 4 peut être subdivisé [S22].</p>
<div class="lab">Mécanisme</div><p>La perte ou la dégénérescence des fibres diminue le nombre d’unités contractiles disponibles ; dans la dystrophie de Duchenne, l’absence de dystrophine fragilise la fibre, qui dégénère [S1].</p>
<div class="lab">Valeur et limite</div><p>Les sources lues ne chiffrent ni sensibilité ni spécificité. La cotation dépend de la coopération du patient [S22].</p>
<p class="src">Références : <a href="https://www.ukri.org/wp-content/uploads/2021/12/MRC-011221-AidsToTheExaminationOfThePeripheralNervousSystem.pdf" target="_blank" rel="noopener">Medical Research Council, mémorandum 45, p. 7 (utilisé avec la permission du Medical Research Council, licence Open Government 3.0)</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.779.799" target="_blank" rel="noopener">Vicino et coll., Rev Med Suisse 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5869704/" target="_blank" rel="noopener">Birnkrant et coll., Lancet Neurol 2018, partie 1</a>, consultées le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-raideur" data-title="Raideur myotonique : la main qui ne lâche pas">
<div class="lab">Définition</div><p>La myotonie est un retard anormal de relaxation du muscle strié ; elle se manifeste par raideur, crampes, blocage, douleur et fatigue [S14].</p>
<div class="lab">Normal</div><p>Le muscle sain se relâche dès que la commande cesse.</p>
<div class="lab">Questions de caractérisation</div><p>Le médecin demande si le patient peine à lâcher un objet saisi, à parler ou à avaler [S4].</p>
<div class="lab">Valeur</div><p>Fréquence, sensibilité et spécificité non chiffrées dans les sources lues. Le diagnostic de dystrophie myotonique de type 1 repose sur l’analyse de l’expansion CTG [S4].</p>
<div class="lab">Piège</div><p>Une myotonie sans atteinte cardiaque n’exclut pas une dystrophie myotonique : seule la génétique distingue les deux groupes [S14 ; S4].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11977047/" target="_blank" rel="noopener">Cochrane, Drug treatment for myotonia, 2025 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6294540/" target="_blank" rel="noopener">Ashizawa et coll., Neurol Clin Pract 2018</a>, consultées le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-effort" data-title="Intolérance à l’effort">
<div class="lab">Définition</div><p>Le patient ne peut pas soutenir un effort qu’un sujet du même âge tolère, alors que sa force au repos peut être normale.</p>
<div class="lab">Valeur</div><p>Même isolée, elle peut indiquer une myopathie, en particulier métabolique [S21]. Non chiffrée dans les sources lues.</p>
<div class="lab">Piège</div><p>Les troubles métaboliques sont exclus de G71 et classés en E70–E90 [S9].</p>
<p class="src">Références : <a href="https://doi.org/10.53738/REVMED.2022.18.779.799" target="_blank" rel="noopener">Vicino et coll., Rev Med Suisse 2022 (résumé)</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">ICD-10-GM 2024 (BfArM), bloc G70–G73</a>, consultées le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-myalgie" data-title="Myalgies isolées">
<div class="lab">Valeur</div><p>Des myalgies isolées, notamment au repos, ne sont en général pas associées aux myopathies [S21].</p>
<div class="lab">Conséquence</div><p>Une douleur isolée, sans faiblesse cotée ni CK persistante, ne justifie pas à elle seule une exploration lourde.</p>
<p class="src">Références : <a href="https://doi.org/10.53738/REVMED.2022.18.779.799" target="_blank" rel="noopener">Vicino et coll., Rev Med Suisse 2022 (résumé)</a>, consultée le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-hypoventilation" data-title="Hypoventilation nocturne : la plainte arrive tard">
<div class="lab">Mécanisme</div><p>Les muscles respiratoires affaiblis ne maintiennent plus la ventilation pendant le sommeil ; le dioxyde de carbone s’accumule [S2].</p>
<div class="lab">Symptômes</div><p>Dyspnée, fatigue et difficulté de concentration [S2].</p>
<div class="lab">Mesure</div><p>Chez le non-ambulant, capacité vitale forcée assise, pressions maximales, débit de pointe à la toux et SpO2 au moins tous les 6 mois ; CO2 de fin d’expiration ou transcutané si la SpO2 est de 95 % ou moins [S2].</p>
<div class="lab">Piège</div><p>L’hypoxémie traduit hypoventilation, atélectasie ou pneumonie ; l’oxygène seul n’est pas utilisé [S2].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5889091/" target="_blank" rel="noopener">Birnkrant et coll., Lancet Neurol 2018, partie 2</a>, consultée le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-cardiaque" data-title="Palpitations, lipothymie et syncope dans la DM1">
<div class="lab">Mécanisme</div><p>La maladie atteint le tissu de conduction et provoque bradycardie sinusale, blocs, fibrillation ou flutter atriaux et tachycardie ventriculaire [S4].</p>
<div class="lab">Conduite</div><p>Palpitations, douleur thoracique, dyspnée, orthopnée, lipothymie et syncope justifient une investigation cardiaque [S4].</p>
<div class="lab">Piège</div><p>L’atteinte cardiaque significative est souvent asymptomatique : l’ECG est fait même sans plainte [S4].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6294540/" target="_blank" rel="noopener">Ashizawa et coll., Neurol Clin Pract 2018</a>, consultée le 16 octobre 2026.</p>
</template>
