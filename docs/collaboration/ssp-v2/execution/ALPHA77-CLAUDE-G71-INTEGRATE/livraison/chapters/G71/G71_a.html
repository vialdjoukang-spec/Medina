<p data-src="S15,S3">Dans cette <b>vignette fictive</b>, un garçon de 4 ans et demi est amené à la consultation parce qu’il tombe souvent, monte les escaliers avec peine et marche sur la pointe des pieds. Ses mollets paraissent volumineux et il se relève du sol en prenant appui sur ses propres jambes. Le bilan d’un premier médecin montre des ASAT et des ALAT élevées ; une atteinte du foie est évoquée. La créatine kinase dépasse 1000 U/L. Ces valeurs sont pédagogiques ; elles servent à poser les questions de décision.</p>
<p data-src="S6">Dans une seconde <b>vignette fictive</b>, une femme de 36 ans ne parvient plus à lâcher rapidement la poignée d’une porte. Elle présente un ptosis, une cataracte précoce et des palpitations ; sa mère a eu les mêmes difficultés. Le tableau mêle muscle, œil et cœur, ce qui constitue en soi un indice diagnostique.</p>
<p data-src="S1,S17">Devant une faiblesse musculaire chronique, trois questions se posent. Comment reconnaître une <button class="w" data-k="g71-sousgroupes">myopathie primitive (périmètre des affections musculaires primitives)</button> à sa topographie, à son évolution et à ses atteintes extramusculaires ? Comment la confirmer, sachant que la plupart de ces maladies sont génétiques ? Quelles complications respiratoires, cardiaques et anesthésiques faut-il anticiper, puisque ce sont elles qui déterminent le pronostic ?</p>
<div class="key" data-src="S17,S3,S6"><b>À retenir.</b> Le diagnostic de sous-type n’est pas un raffinement : les complications cardiaques et respiratoires varient fortement d’une dystrophie à l’autre, et connaître le sous-type permet d’organiser des soins anticipés plutôt que réactifs.</div>
</section>

<section class="ilot" id="g71-1"><h2><span class="n">1</span>Définition et classification</h2>
<p data-src="S1,S2">La catégorie G71 de la CIM-10-GM 2024 (Office fédéral de la statistique pour la version française, BfArM pour la version allemande) réunit les <b>affections musculaires primitives</b> en six sous-catégories : la dystrophie musculaire (G71.0), les affections myotoniques (G71.1), les myopathies congénitales (G71.2), la myopathie mitochondriale non classée ailleurs (G71.3), les autres affections musculaires primitives (G71.8) et l’affection musculaire primitive sans précision, qui inclut la « myopathie héréditaire sans précision » (G71.9). Le contenu précis de chaque sous-catégorie figure dans la fenêtre <button class="w" data-k="g71-sousgroupes">périmètre de G71 (inclusions et exclusions)</button>.</p>
<p data-src="S1">La catégorie exclut l’arthrogrypose multiple congénitale, la myosite et les troubles métaboliques (chapitre des maladies endocriniennes, nutritionnelles et métaboliques, E70–E90). Les myopathies inflammatoires, c’est-à-dire la dermatomyosite-polymyosite, et l’infarctus musculaire ischémique relèvent d’autres rubriques, et non de G71. Ce choix de classement oriente le diagnostic différentiel : une myosite se traite autrement qu’une dystrophie.</p>
<p data-src="S17">Une <b>dystrophie musculaire</b> est une maladie primitive du muscle, due à des mutations de plus de 40 gènes et caractérisée par des lésions dystrophiques à la biopsie. Comme les atteintes cardiaque et respiratoire dépendent du sous-type, le diagnostic précis du sous-type guide les soins.</p>
<p data-src="S19">La <b>myotonie</b> est un retard anormal de relaxation du muscle strié ; elle se manifeste par raideur, crampes, blocage, douleur et fatigue. Deux grands groupes existent : les <button class="w" data-k="g71-myotonie">myotonies non dystrophiques (canalopathies musculaires)</button> et les dystrophies myotoniques, qui sont des maladies systémiques avec myopathie progressive, arythmies et cataracte.</p>
<p data-src="S25,S26">Les <button class="w" data-k="g71-congenitales">myopathies congénitales (hypotonie dès la naissance, classification par la biopsie)</button> sont des myopathies héréditaires marquées par une hypotonie et une faiblesse, généralement dès la naissance, d’évolution statique ou lentement progressive.</p>
<p>Le 277e atelier de l’ENMC (2024, publié en 2026) les définit comme des maladies musculaires génétiques hétérogènes, révélées en général en période périnatale ou dans la petite enfance par une hypotonie et une faiblesse, non ou lentement progressives, avec des anomalies histologiques <b>structurelles non dystrophiques</b>. Il propose de les nommer par le gène, le mode de transmission et l’histologie, par exemple « myopathie congénitale liée à RYR1, autosomique récessive, avec cores ». Il recommande une démarche génétique d’abord (panels, exome ou génome), complétée par l’électromyogramme, l’imagerie musculaire et la biopsie si elle est indiquée. La CIM-10-GM range pourtant aussi la dystrophie musculaire congénitale en G71.2 : le code n’épouse pas la définition histologique de l’ENMC.</p>
<p data-src="S23">Le syndrome <button class="w" data-k="g71-melas">MELAS (épisodes pseudo-vasculaires et variant m.3243A&gt;G)</button> est défini par un consensus européen comme la survenue d’un ou plusieurs épisodes pseudo-vasculaires dans un contexte de dysfonction mitochondriale liée à un variant pathogène de l’ADN mitochondrial, en particulier m.3243A&gt;G dans le gène MT-TL1. Les termes « MELAS-like » et « spectre MELAS » sont déconseillés par ce consensus.</p>
<p>Le 280e atelier de l’ENMC (2024) définit les myopathies mitochondriales primaires comme des maladies mitochondriales génétiquement déterminées, à atteinte prédominante du muscle squelettique. Il en retient deux phénotypes majeurs : la myopathie mitochondriale avec ou sans ophtalmoplégie externe progressive. Il insiste sur la génétique et la biopsie musculaire pour poser le diagnostic.</p>
<p class="src">Sources : <a href="https://doi.org/10.1016/j.nmd.2025.106328" target="_blank" rel="noopener">277e atelier de l’ENMC, myopathies congénitales, Neuromuscul Disord 2026 (résumé)</a> ; <a href="https://doi.org/10.1016/j.nmd.2025.105340" target="_blank" rel="noopener">280e atelier de l’ENMC, myopathies mitochondriales primaires, Neuromuscul Disord 2025 (résumé)</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">ICD-10-GM 2024 (BfArM), bloc G70–G73</a>, consultées le 16 octobre 2026.</p>

<div class="key" data-src="S1,S17,S19"><b>À retenir.</b> « Myopathie primitive » désigne une maladie propre au muscle, le plus souvent génétique. On la distingue des myosites, des maladies métaboliques et des causes neurogènes par la clinique, le dosage de la créatine kinase, l’électromyogramme et la génétique.</div>
</section>

<section class="ilot" id="g71-2"><h2><span class="n">2</span>Fréquence et épidémiologie</h2>
<p data-src="S3">La dystrophie musculaire de Duchenne touche 15,9 garçons pour 100 000 naissances vivantes masculines aux États-Unis et 19,5 au Royaume-Uni. Ces chiffres décrivent des populations américaine et britannique ; aucune donnée suisse n’a été lue.</p>
<p data-src="S6,S7,S22,S12,S14">La <button class="w" data-k="g71-dm1-genetique">dystrophie myotonique de type 1 (génétique et fréquence)</button> concerne entre 1 individu sur 3000 et 1 sur 8000 dans le monde selon le consensus de 2018 ; le consensus pneumologique cite environ 1 sur 2500. Elle est la dystrophie musculaire la plus fréquente à début adulte. La dystrophie facio-scapulo-humérale compte parmi les dystrophies héréditaires les plus fréquentes et vient au deuxième rang des dystrophies de l’adulte.</p>
<table class="t" data-src="S3,S6,S7,S16,S24,S32"><thead><tr><th>Maladie</th><th>Donnée lue</th><th>Population et limite</th></tr></thead><tbody><tr><td>Duchenne</td><td>15,9 et 19,5 pour 100 000 naissances vivantes masculines</td><td>États-Unis et Royaume-Uni</td></tr><tr><td>Dystrophie myotonique de type 1</td><td>1/3000 à 1/8000 (environ 1/2500 selon une autre estimation)</td><td>Monde ; estimations discordantes</td></tr><tr><td><button class="w" data-k="g71-becker-cohorte">Becker</button></td><td>Perte de la marche en moyenne à 42,2 ans ; 23 % non ambulants à la dernière évaluation</td><td>163 hommes, centre britannique, rétrospectif</td></tr><tr><td><button class="w" data-k="g71-mito-cohorte">Myopathies mitochondriales de l’adulte</button></td><td>Délai médian entre symptôme et diagnostic : 11 ans</td><td>94 adultes, centre américain, descriptif</td></tr><tr><td>Facio-scapulo-humérale</td><td>Début par la ceinture scapulaire dans 45,2 % des cas, par la face dans 34,4 %</td><td>Registre russe, 491 participants</td></tr></tbody></table>
<p data-src="S16">La cohorte de Becker montre que cette forme n’est pas bénigne par défaut : 52,3 % des patients présentent une atteinte cardiaque et 44,2 % des troubles neuropsychiatriques. Le diagnostic a été évoqué sur des symptômes musculaires dans 52,2 % des cas, sur une histoire familiale dans 27,6 %, sur des troubles neuropsychiatriques dans 9,7 %, sur une découverte fortuite dans 6,7 % et sur une cardiomyopathie dans 3,8 %.</p>
<p data-src="S24">Chez l’adulte atteint d’une myopathie mitochondriale, le diagnostic est posé à l’âge médian de 48 ans, avec une atteinte musculaire isolée dans 27 % des cas, une atteinte du système nerveux central dans 69 % et une atteinte cardiaque dans 21 %. Ces chiffres rappellent que l’atteinte musculaire est souvent la partie visible d’une maladie multisystémique.</p>
<p>Deux données suisses existent pour des formes rares. Dans le registre suisse des maladies neuromusculaires (Swiss-Reg-NMD), la dystrophie musculaire liée à LAMA2 a une prévalence d’au moins 0,8 pour 100 000 personnes de 0 à 23 ans. En mai 2023, le registre comptait 18 patients de 16 familles, dont 14 atteints de la forme congénitale sévère, qui n’ont jamais marché. La CK, connue chez 13 patients, était élevée dans tous les cas, entre 676 et 21 160 U/L ; 13 des 14 IRM cérébrales disponibles montraient des anomalies de la substance blanche.</p>
<p>Une étude des centres neuromusculaires de Bâle, de Lausanne et de Zurich a décrit 13 patients d’origine suisse atteints de dysferlinopathie, une dystrophie des ceintures. Les premiers signes apparaissaient vers 19 ans, et la CK moyenne atteignait 12 500 U/L. Neuf patients de trois familles non apparentées du canton de Schwyz portaient la même mutation c.3031+2T&gt;C, dont sept à l’état homozygote ; l’analyse des haplotypes évoque un effet fondateur. Les auteurs en déduisent l’intérêt d’un diagnostic moléculaire ciblé chez un patient d’origine suisse.</p>
<div class="key" data-src="S3,S6,S24"><b>À retenir.</b> La Suisse ne dispose pas de chiffre lu pour la dystrophie de Duchenne ni pour la dystrophie myotonique : les ordres de grandeur étrangers servent à hiérarchiser les hypothèses, pas à prédire le risque d’un patient suisse donné. Le registre suisse apporte en revanche une prévalence pour la forme liée à LAMA2, et une mutation fondatrice de la dysferline oriente le test génétique en Suisse centrale.</div>
<p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11380305/" target="_blank" rel="noopener">Enzmann et coll., cohorte suisse LAMA2, J Neuromuscul Dis 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4596355/" target="_blank" rel="noopener">Petersen et coll., dysferlinopathie en Suisse, BMC Neurol 2015</a>, consultées le 16 octobre 2026.</p>

<section class="ilot" id="g71-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-src="S3,S17">Chaque famille suit la même logique : une anomalie du génome altère une protéine ou un ARN, la fibre musculaire se dégrade ou fonctionne mal, puis l’organe entier est touché. La <b>figure 1</b> résume cette chaîne ; les paragraphes suivants la précisent par famille.</p>
<figure data-src="S3,S30,S14,S35"><svg viewBox="0 0 420 330" role="img" aria-label="Figure 1 — Du gène à l’insuffisance d’organe" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="10" y="8" width="400" height="38" rx="5"/><path d="M210 46v12m-4-4l4 4 4-4"/><rect x="10" y="58" width="400" height="38" rx="5"/><path d="M210 96v12m-4-4l4 4 4-4"/><rect x="10" y="108" width="400" height="38" rx="5"/><path d="M210 146v12m-4-4l4 4 4-4"/><rect x="10" y="158" width="400" height="38" rx="5"/><path d="M210 196v12m-4-4l4 4 4-4"/><rect x="10" y="208" width="400" height="38" rx="5"/><path d="M210 246v12m-4-4l4 4 4-4"/><rect x="10" y="258" width="400" height="62" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="210" y="32">Variant du génome (nucléaire ou mitochondrial)</text><text x="210" y="82">Protéine absente, ARN toxique ou DUX4 dérépressé</text><text x="210" y="132">Fibre fragile, mal relaxée ou à énergie insuffisante</text><text x="210" y="182">Dégénérescence, myotonie ou perte de fibres</text><text x="210" y="232">Faiblesse, raideur ou fatigabilité du muscle</text><text x="210" y="283">Atteintes respiratoire, cardiaque,</text><text x="210" y="303">digestive, oculaire ou cérébrale selon la famille</text></g></svg><figcaption>Figure 1 — Schéma didactique de la chaîne génotype, mécanisme cellulaire, phénotype, d’après les mécanismes lus. Les étapes intermédiaires diffèrent selon la maladie ; ce dessin n’est pas calibré.</figcaption></figure>
<h3>3.1 Dystrophinopathies</h3>
<p data-src="S3">À l’état normal, la <button class="w" data-k="g71-dystrophine">dystrophine (protéine du cytosquelette)</button> relie le cytosquelette de la fibre musculaire et en assure la solidité, la stabilité et la fonction. Dans la dystrophie de Duchenne, maladie récessive liée à l’X, le gène de la dystrophine est muté et la protéine est absente ou insuffisante. La fibre se dégrade et dégénère de façon progressive, d’où la faiblesse, le retard moteur, la perte de la marche, l’atteinte respiratoire et la cardiomyopathie. Le décès survient en général par atteinte cardiaque ou respiratoire.</p>
<p data-src="S3">La fragilité structurelle des fibres, avec des anomalies métaboliques et du monoxyde d’azote qui contribuent à une ischémie d’effort, réduit la capacité d’effort. C’est pourquoi le consensus déconseille l’exercice excentrique et le renforcement à haute résistance (<button class="w" data-k="g71-exercice">exercice dans les dystrophinopathies : ce qui nuit, ce qui aide</button>).</p>
<p data-src="S4">Le <button class="w" data-k="g71-coeur-dmd">cœur de la dystrophie de Duchenne (fibrose et arythmies)</button> subit le même mécanisme : la déficience en dystrophine myocardique produit une cardiomyopathie, et la fibrose progressive conduit à une dysfonction ventriculaire et à un risque d’arythmies graves. La fonction respiratoire suit une courbe particulière : la capacité vitale forcée augmente avec la croissance jusqu’à la perte de la marche, atteint un plateau, puis décline. Cette baisse peut être silencieuse sans spirométrie régulière, et la diminution de la capacité vitale rend la paroi thoracique rigide et restrictive.</p>
<h3>3.2 Dystrophie myotonique de type 1</h3>
<p data-src="S22,S6,S30">Cette maladie autosomique dominante résulte de l’expansion instable d’un triplet CTG dans la région 3′ non traduite du gène DMPK. La plupart des symptômes musculaires s’expliquent par des effets toxiques de l’ARN porteur de l’expansion. La taille de l’expansion est grossièrement corrélée à l’âge de début et à la sévérité, mais la longueur seule ne prédit pas la sévérité : des facteurs épigénétiques interviennent (<button class="w" data-k="g71-dm1-genetique">DM1 : expansion, anticipation et épigénétique</button>).</p>
<h3>3.3 Dystrophie facio-scapulo-humérale</h3>
<p data-src="S14,S12,S32">Le facteur de transcription DUX4, toxique pour le muscle, est exprimé lorsque le locus 4q35 est hypométhylé ; la maladie est donc une dérépression d’un gène normalement silencieux. Dans la cohorte russe, le nombre d’unités D4Z4 est inversement corrélé à la sévérité.</p>
<h3>3.4 Autres mécanismes</h3>
<p data-src="S19,S25,S26">Les <button class="w" data-k="g71-myotonie">myotonies non dystrophiques</button> sont des canalopathies musculaires génétiques : la myotonie domine le tableau et, d’après les textes lus, il n’y a pas d’atteinte cardiaque. Les <button class="w" data-k="g71-congenitales">myopathies congénitales</button> relèvent de nombreux gènes (NEB, ACTA1, ADSSL1, RYR1, SELENON, MTM1, DNM2, TPM3) ; un même gène peut donner des aspects histologiques différents et plusieurs gènes un même aspect.</p>
<p data-src="S35,S24,S23">Dans les <button class="w" data-k="g71-mito">maladies mitochondriales</button> primaires, le défaut touche surtout les complexes I à V de la phosphorylation oxydative, c’est-à-dire la production d’énergie de la cellule. Cette atteinte énergétique est cohérente avec la fréquence de l’association entre myopathie et atteinte du système nerveux central (69 % dans la cohorte adulte), mais le dossier lu ne détaille pas la sélectivité tissulaire.</p>
<p data-src="S28,S26">Dans l’<button class="w" data-k="g71-hm">hyperthermie maligne (réaction hypermétabolique à l’anesthésie)</button>, des sujets génétiquement prédisposés réagissent par une crise hypermétabolique aux anesthésiques volatils puissants ou au suxaméthonium. RYR1 figure parmi les gènes des myopathies congénitales à cores ; le lien explicite entre RYR1 et hyperthermie maligne n’est pas énoncé dans les textes lus.</p>
<div class="key" data-src="S3,S30,S14,S35"><b>À retenir.</b> Le mécanisme explique la conduite : une fibre sans dystrophine se dégrade à l’effort, un ARN toxique perturbe plusieurs organes à la fois, DUX4 atteint la face et les ceintures, et une chaîne énergétique déficiente touche d’abord les tissus gourmands. Chaque famille a donc ses organes cibles à surveiller.</div>
</section>

<section class="ilot" id="g71-4"><h2><span class="n">4</span>Causes génétiques et transmission</h2>
<p data-src="S17,S25,S26">Presque toutes les affections de ce cours sont d’origine génétique : plus de 40 gènes pour les dystrophies, huit gènes majeurs pour les myopathies congénitales, un variant de l’ADN mitochondrial pour la plupart des syndromes MELAS. Le mode de transmission conditionne le conseil génétique, le dépistage des apparentés et la surveillance des femmes de la famille.</p>
<table class="t" data-src="S3,S15,S6,S22,S30,S14,S32,S11,S26,S27,S23"><thead><tr><th>Maladie</th><th>Gène ou variant</th><th>Transmission</th><th>Point utile à la décision</th></tr></thead><tbody><tr><td>Dystrophinopathies</td><td>Gène DMD, locus Xp21</td><td>Récessive liée à l’X</td><td>Environ 70 % de délétions ou duplications d’exons ; conductrices parfois symptomatiques</td></tr><tr><td>Dystrophie myotonique de type 1</td><td>Expansion CTG dans DMPK</td><td>Autosomique dominante</td><td>Plus de 35 répétitions : instabilité ; 50 ou plus : compatible avec le diagnostic</td></tr><tr><td>Dystrophie myotonique de type 2</td><td>Expansion CCTG, intron 1 de CNBP</td><td>Non précisée dans les textes lus</td><td>Atteinte surtout proximale, en général moins sévère que le type 1</td></tr><tr><td>Facio-scapulo-humérale</td><td>Dérépression de DUX4, locus 4q35 hypométhylé</td><td>Non précisée dans les textes lus</td><td>Moins d’unités D4Z4, forme plus sévère</td></tr><tr><td>Dystrophies des ceintures</td><td>Nombreux gènes</td><td>Dominante (ancienne LGMD1) ou récessive (LGMD2)</td><td>Nomenclature réformée en 2017</td></tr><tr><td>Myopathies congénitales</td><td>NEB, ACTA1, ADSSL1, RYR1, SELENON, MTM1, DNM2, TPM3</td><td>Liée à l’X ou autosomique selon la forme</td><td>Séquençage d’exome ou de génome en première ligne chez beaucoup de patients</td></tr><tr><td>MELAS</td><td>ADN mitochondrial, surtout m.3243A&gt;G (MT-TL1)</td><td>Non précisée dans les textes lus</td><td>Épisode pseudo-vasculaire plus dysfonction mitochondriale</td></tr></tbody></table>
<p data-src="S31,S6">Dans la dystrophie myotonique de type 1, l’<b>anticipation génétique</b> est marquée : l’expansion tend à s’allonger de génération en génération, avec un début plus précoce et une forme plus sévère. La forme congénitale, la plus grave, est liée en général à de très grandes expansions et présente un fort biais de transmission maternelle. Le conseil génétique doit donc aborder ce risque avec une femme atteinte avant une grossesse (<button class="w" data-k="g71-cdm1">DM1 congénitale : début prénatal, hypotonie, ventilation</button>).</p>
<p data-src="S3,S4,S15">Dans la dystrophie de Duchenne, les mères et sœurs porteuses (conductrices) ne sont pas indemnes : certaines deviennent symptomatiques, avec un risque de myopathie et de cardiomyopathie (<button class="w" data-k="g71-conductrices">conductrices de dystrophinopathie</button>).</p>
<p data-src="S28,S6,S4">Parmi les <b>facteurs de risque de complication</b>, l’anesthésie occupe une place à part. Les anesthésiques volatils et le suxaméthonium exposent à l’hyperthermie maligne chez les sujets prédisposés et à la rhabdomyolyse avec hyperkaliémie dans la dystrophie de Duchenne ; la dystrophie myotonique expose à des réactions aux anesthésiques et aux opioïdes, même dans les formes légères.</p>
<div class="key" data-src="S6,S22,S31,S3"><b>À retenir.</b> Avant toute analyse, retenir la transmission : liée à l’X pour les dystrophinopathies (garçons atteints, femmes conductrices à surveiller), dominante pour la dystrophie myotonique de type 1 (anticipation, risque congénital par la mère).</div>

<section class="ilot" id="g71-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-src="S3,S15,S6">L’interrogatoire cherche l’âge de début, la topographie de la faiblesse (proximale, distale, faciale, axiale), l’évolution, l’histoire familiale sur plusieurs générations et les atteintes extramusculaires (œil, cœur, digestif, sommeil, cognition). Il demande aussi les antécédents d’anesthésie, car ils révèlent une prédisposition ou une réaction anormale.</p>
<h3>5.1 Dystrophinopathies</h3>
<p data-src="S3">Les signes d’appel de la petite enfance sont la faiblesse, la maladresse, le <button class="w" data-k="g71-gowers">signe de Gowers (se relever du sol avec ses mains)</button>, la difficulté à monter les escaliers et la marche sur la pointe des pieds. Le tableau typique associe retard moteur, faiblesse proximale et axiale progressive, hypertrophie des mollets et créatine kinase supérieure à 1000 U/L.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p data-src="S15,S3">Retard moteur, chutes, faiblesse proximale et axiale progressive, mollets volumineux, CK très élevée. Le garçon perd la marche en moyenne entre 10 et 14 ans selon la corticothérapie reçue.</p></div><div class="card"><h4>Formes atypiques</h4><p data-src="S3,S15">Retard de développement ou de langage, autisme, ou élévation fortuite d’ALAT, d’ASAT ou de LDH avec CK élevée et GGT normale, sans plainte musculaire au premier plan.</p></div></div>
<div class="trap" data-src="S3,S15"><span class="k">Piège</span> Une élévation des transaminases d’origine musculaire peut faire croire à une hépatopathie et retarder le diagnostic de plusieurs années. Une CK élevée avec GGT normale oriente vers le muscle (<button class="w" data-k="g71-transaminases">transaminases d’origine musculaire : pourquoi et comment trancher</button>).</div>
<p data-src="S4">Chez l’adolescent non ambulant, l’insuffisance cardiaque est souvent méconnue : fatigue, perte de poids, vomissements, douleurs abdominales, troubles du sommeil et intolérance aux activités doivent la faire rechercher. La classification NYHA est inadaptée, puisque la limitation d’effort est aussi musculaire (<button class="w" data-k="g71-coeur-dmd">cœur de la dystrophie de Duchenne</button>). L’hypoventilation nocturne se révèle par fatigue, dyspnée, céphalées matinales, réveils fréquents, hypersomnolence, troubles de la concentration, réveils dyspnéiques avec tachycardie et cauchemars ; certains patients restent asymptomatiques (<button class="w" data-k="g71-resp-dmd">atteinte respiratoire de la dystrophie de Duchenne</button>).</p>
<h3>5.2 Dystrophie myotonique de type 1</h3>
<p data-src="S6">C’est une maladie multisystémique, de début à tout âge, très variable même au sein d’une famille. Le patient décrit une raideur et une préhension prolongée (difficulté à relâcher), une faiblesse distale, des troubles de la parole et de la déglutition. L’interrogatoire explore chaque organe : cœur (palpitations, douleur thoracique, dyspnée, orthopnée, lipothymie, syncope), tube digestif (dysphagie, reflux, douleurs, diarrhée, constipation, incontinence), sommeil et cerveau (apathie, somnolence diurne excessive, troubles cognitifs), endocrinien (dysfonction érectile, infertilité). La fenêtre <button class="w" data-k="g71-dm1-organes">organes atteints dans la DM1 (symptômes, bilan, enjeu)</button> détaille ces atteintes.</p>
<h3>5.3 Facio-scapulo-humérale, congénitales, mitochondriales</h3>
<p data-src="S12,S14,S13">La <button class="w" data-k="g71-fshd">dystrophie facio-scapulo-humérale</button> débute par une faiblesse faciale, scapulaire et des membres supérieurs, souvent asymétrique, avec douleur et fatigue fréquentes. Les formes précoces sévères ajoutent surdité, troubles cognitifs et déformations rachidiennes. Les troubles respiratoires du sommeil peuvent précéder l’atteinte motrice : le patient peut consulter pour somnolence ou céphalées plutôt que pour la faiblesse.</p>
<p data-src="S27,S25">Chez le nourrisson, une <button class="w" data-k="g71-congenitales">myopathie congénitale</button> s’annonce par une hypotonie, une faiblesse, un retard ou une absence d’acquisitions motrices, des difficultés alimentaires et respiratoires et un faciès myopathique.</p>
<p data-src="S24">Chez l’adulte, les phénotypes mitochondriaux comprennent l’atteinte multisystémique, le MELAS, la myopathie des membres, l’ophtalmoplégie externe progressive chronique et sa forme étendue. La faiblesse est modérée et lentement progressive ; la cohorte lue indique un délai médian de 5,5 ans entre le diagnostic et l’aide à la marche.</p>
<div class="key" data-src="S3,S6,S12,S27,S24"><b>À retenir.</b> L’histoire de la maladie et l’âge de début orientent plus vite que n’importe quel examen : garçon avec retard moteur et mollets volumineux, adulte avec myotonie et cataracte, atteinte du visage et des épaules, nourrisson hypotone, ptosis avec ophtalmoplégie.</div>
</section>

<section class="ilot" id="g71-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-src="S4,S6">L’examen suit l’ordre habituel, de l’état général aux signes ciblés. L’<b>état général et les constantes</b> comptent plus ici qu’ailleurs : la saturation en oxygène (SpO2), la fréquence cardiaque et la qualité de la toux renseignent sur le retentissement respiratoire et cardiaque, souvent muet. Chez l’enfant, la <b>taille et le poids</b> sont suivis dans la dystrophie de Duchenne (taille tous les 6 mois ; orientation endocrinologique si la vitesse de croissance est inférieure à 4 cm par an ou au troisième percentile).</p>
<div class="two"><div class="card"><h4>Signes de l’enfant et de l’adolescent</h4><p data-src="S3,S15">Faiblesse proximale et axiale, <button class="w" data-k="g71-gowers">signe de Gowers</button>, marche sur la pointe des pieds, hypertrophie des mollets, difficulté à monter les escaliers. La scoliose et les rétractions font l’objet d’une surveillance orthopédique.</p></div><div class="card"><h4>Signes de l’adulte</h4><p data-src="S6,S12">Myotonie de préhension, faiblesse distale, ptosis, faiblesse de l’orbiculaire (DM1) ; faiblesse faciale, décollement scapulaire et faiblesse abdominale avec <button class="w" data-k="g71-fshd">signe de Beevor positif</button> (facio-scapulo-humérale).</p></div></div>
<p data-src="S6">Dans la dystrophie myotonique de type 1, l’examen de l’œil recherche une cataracte (présente chez la plupart des patients), un ptosis par faiblesse du releveur et une faiblesse de l’orbiculaire ; dans les formes congénitales et juvéniles s’ajoutent strabisme, troubles oculomoteurs, myopie et astigmatisme. L’examen cardiaque cherche bradycardie ou irrégularité du pouls, mais l’atteinte reste souvent asymptomatique, ce qui impose l’ECG même en l’absence de plainte. La peau peut porter des pilomatrixomes.</p>
<p data-src="S12,S14">Dans la facio-scapulo-humérale, la combinaison faiblesse faciale, décollement scapulaire et faiblesse abdominale avec signe de Beevor positif est presque pathognomonique. Les formes tardives ou légères sont plus difficiles à reconnaître. L’asymétrie de la faiblesse est un indice supplémentaire.</p>
<p data-src="S37,S24">Devant un ptosis avec ophtalmoplégie, il faut distinguer l’ophtalmoplégie externe progressive chronique d’origine mitochondriale d’une myasthénie ; la fenêtre <button class="w" data-k="g71-ptosis">ptosis et ophtalmoplégie (OEPC ou myasthénie)</button> rappelle un piège biologique.</p>
<p data-src="S27,S25">Chez le nourrisson, l’examen note l’hypotonie, la faiblesse, le faciès myopathique et les difficultés alimentaires et respiratoires.</p>
<div class="card" data-semiology-clinical="G71" id="g71-6-semiologie"><h3>Repère sémiologique des affections musculaires primitives</h3>
<p><b>Symptômes.</b> La plainte principale est une <button class="w" data-k="g71-sm-faiblesse">faiblesse musculaire</button>, dont la distribution oriente : proximale chez le garçon atteint de dystrophie de Duchenne, distale avec myotonie dans la dystrophie myotonique de type 1, faciale et scapulaire dans la forme facio-scapulo-humérale. Une <button class="w" data-k="g71-sm-raideur">raideur myotonique</button> se traduit par une difficulté à lâcher un objet saisi. Une <button class="w" data-k="g71-sm-effort">intolérance à l’effort</button>, même sans faiblesse au repos, peut révéler une myopathie. À l’inverse, des <button class="w" data-k="g71-sm-myalgie">myalgies isolées</button>, surtout au repos, ne relèvent en général pas d’une myopathie.</p>
<p><b>Anamnèse analytique.</b> Chez l’enfant, l’interrogatoire recherche les signes d’appel : maladresse, difficulté à monter les escaliers, marche sur la pointe des pieds. Il cherche ensuite ce que la faiblesse masque : dyspnée, fatigue et difficulté de concentration d’une <button class="w" data-k="g71-sm-hypoventilation">hypoventilation nocturne</button> ; palpitations, lipothymie ou syncope dans la DM1. Il note un traitement par glucocorticoïdes, qui expose à la crise surrénalienne.</p>
<p><b>Signes et examen.</b> L’examen se fait chez un patient réchauffé et informé ; la force est cotée de 0 à 5 muscle par muscle. Il recherche le <button class="w" data-k="g71-gowers">signe de Gowers</button>, difficulté à se relever du sol qui traduit une faiblesse proximale, et chronomètre le relever du sol : après 7 ans, plus de 30 secondes est associé à un déclin plus rapide de la marche dans les 12 mois. Il recherche la myotonie de préhension, la cataracte et le ptosis de la DM1. Il mesure la SpO2 à l’air ambiant et le débit de pointe à la toux, normal au-delà de 270 L/min ; dans la DM1, l’ECG à 12 dérivations recherche notamment une fréquence sinusale inférieure à 50/min, un PR supérieur à 200 ms ou un QRS supérieur à 100 ms.</p>
<p><b>Discrimination clinique.</b> Une faiblesse avec CK élevée et tracé myopathique désigne le muscle plutôt que le nerf. Des transaminases élevées chez un garçon peuvent venir du muscle : la CK tranche. Les myopathies des troubles du métabolisme sont exclues de G71 par la classification (E70–E90). Aucun de ces signes n’a de sensibilité ni de spécificité chiffrée dans les sources lues.</p>
<p><b>Situations urgentes.</b> Une SpO2 inférieure à 95 % à l’air ambiant chez un patient atteint de dystrophie de Duchenne impose la toux assistée et la ventilation non invasive, sans oxygène seul. Une fatigue excessive, des vomissements ou une confusion sous glucocorticoïdes évoquent une crise surrénalienne et imposent l’hydrocortisone intramusculaire sans délai. Une syncope dans la DM1 impose un bilan cardiaque rapide. Un déficit aigu chez un patient atteint de MELAS impose d’abord une imagerie précoce, un EEG et la génétique pour confirmer l’épisode pseudo-vasculaire et exclure une ischémie vasculaire ; les antiplaquettaires et la thrombolyse ne sont écartés qu’une fois l’épisode pseudo-vasculaire établi. Le contexte mitochondrial connu ne suffit pas à lui seul.</p>
<p><b>Lien avec le raisonnement de la leçon.</b> La faiblesse pose le niveau myogène, la topographie et les signes extramusculaires choisissent le test génétique, et les signes respiratoires, cardiaques et surrénaliens fixent l’urgence, avant tout diagnostic de famille.</p>
<p class="src">Sources : <a href="https://doi.org/10.53738/REVMED.2022.18.779.799" target="_blank" rel="noopener">Vicino et coll., Rev Med Suisse 2022 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5869704/" target="_blank" rel="noopener">Birnkrant et coll., Duchenne, partie 1, Lancet Neurol 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5889091/" target="_blank" rel="noopener">Birnkrant et coll., Duchenne, partie 2, Lancet Neurol 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5902408/" target="_blank" rel="noopener">Birnkrant et coll., Duchenne, partie 3, Lancet Neurol 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6294540/" target="_blank" rel="noopener">Ashizawa et coll., DM1, Neurol Clin Pract 2018</a> ; <a href="https://www.ukri.org/wp-content/uploads/2021/12/MRC-011221-AidsToTheExaminationOfThePeripheralNervousSystem.pdf" target="_blank" rel="noopener">Medical Research Council, Aids to the examination of the peripheral nervous system, p. 7</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680696500010" target="_blank" rel="noopener">Information professionnelle suisse AGAMREE® (vamorolone), Swissmedic (AIPS via AmiKo), mise à jour d’octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13090769/" target="_blank" rel="noopener">Consensus ERN EURO-NMD, MELAS et épisodes pseudo-vasculaires, Eur J Neurol 2026, texte intégral</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">ICD-10-GM 2024 (BfArM), bloc G70–G73</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2010.03012.x" target="_blank" rel="noopener">EFNS, hyperCKémie, Eur J Neurol 2010 (résumé)</a> ; <a href="https://doi.org/10.1016/j.nmd.2025.106328" target="_blank" rel="noopener">277e atelier de l’ENMC, myopathies congénitales, Neuromuscul Disord 2026 (résumé)</a>, consultées le 16 octobre 2026.</p></div>
<div class="trap" data-src="S4,S3"><span class="k">Erreur fréquente</span> Se fier à la dyspnée pour juger la fonction respiratoire du patient non ambulant, ou à la classe NYHA pour juger son cœur. La limitation musculaire masque la limitation cardiorespiratoire ; la spirométrie, la SpO2 et l’imagerie cardiaque la révèlent avant la plainte.</div>
<div class="key" data-src="S12,S6,S3"><b>À retenir.</b> L’examen d’une myopathie ne s’arrête pas au muscle : œil, cœur, respiration, croissance et peau font partie du dossier.</div>
