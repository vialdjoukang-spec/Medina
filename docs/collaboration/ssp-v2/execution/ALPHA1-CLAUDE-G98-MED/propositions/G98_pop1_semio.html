<template data-pop="g98-sm-chaleur" data-title="Chaleur unilatérale du pied : l’écart thermique">
<div class="lab">Définition</div><p>L’écart thermique est la différence de température cutanée entre le point le plus chaud du pied atteint et le même point anatomique du pied opposé [S1, recommandation 3].</p>
<div class="lab">Normal</div><p>Chez le sujet sain, la température cutanée des deux pieds est symétrique [S1].</p>
<div class="lab">Technique</div><p>La mesure se fait pieds nus, après acclimatation, aux mêmes sites à chaque visite, au thermomètre infrarouge ou à la main à défaut [S1]. En cas d’atteinte bilatérale ou de membre opposé absent, le gradient de l’orteil vers le genou sert de comparaison [S1, recommandation 4].</p>
<div class="lab">Mécanisme</div><p>L’inflammation stérile de l’os élève la température locale ; l’écart est corrélé à la captation locale du traceur à la scintigraphie osseuse [S1].</p>
<div class="lab">Valeur et limite</div><p>Un écart de 2 °C est le seuil le plus employé ; sa précision diagnostique n’a jamais été démontrée [S1]. Le site de l’écart maximal concordait avec l’atteinte radiographique dans 92 % des cas au diagnostic [S1]. Une hausse isolée, sans rougeur ni œdème, n’est pas toujours un Charcot [S1].</p>
<div class="lab">Piège</div><p>Lire « 4 °F » comme l’équivalent de 2 °C : un écart de 4 °F vaut 2,2 °C [S1].</p>
<p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, Charcot actif, recommandations 1 à 4 et justification</a>, consultée le 16 octobre 2026.</p>
</template>
<template data-pop="g98-sm-oedeme" data-title="Tuméfaction du pied">
<div class="lab">Définition</div><p>La tuméfaction est l’augmentation de volume du pied atteint par rapport au pied opposé [S1].</p>
<div class="lab">Technique</div><p>Le médecin compare les deux pieds ; une étude mesurait la circonférence au médio-pied et à la cheville [S1, identification de la rémission]. Une approche standardisée est conseillée pour comparer les visites [S1].</p>
<div class="lab">Mécanisme</div><p>L’IRM précoce montre un œdème des parties molles et de la moelle osseuse [S2]. La décharge réduit cet œdème, ce qui rend le dispositif initial trop large [S1 ; S3].</p>
<div class="lab">Valeur et limite</div><p>L’œdème seul ne permet pas de juger la rémission (recommandation conditionnelle) ; il peut persister malgré la consolidation radiographique [S1, recommandation 12].</p>
<div class="lab">Piège</div><p>Ne pas refaire le plâtre quand l’œdème fond : le dispositif devenu trop large frotte et blesse [S3].</p>
<p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et coll. 2019</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED 2020</a>, consultés le 16 octobre 2026.</p>
</template>
<template data-pop="g98-sm-douleur" data-title="Douleur : absente, modérée ou sévère">
<div class="lab">Constat</div><p>La douleur est absente ou relativement modérée à cause de la neuropathie sensitive ; certains patients ont pourtant une douleur sévère [S1].</p>
<div class="lab">Mécanisme</div><p>La baisse de la sensibilité douloureuse et de la proprioception supprime l’alarme qui ferait ménager le pied [S2].</p>
<div class="lab">Valeur et limite</div><p>Aucune fréquence chiffrée n’est donnée dans les sources lues. Ni l’absence ni la présence de douleur ne permettent d’exclure le diagnostic [S1].</p>
<div class="lab">Conséquence</div><p>Le patient continue de marcher et consulte tard ; les dispositifs de décharge sont mal acceptés par un patient qui n’a pas mal [S1].</p>
<p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et coll. 2019</a>, consultés le 16 octobre 2026.</p>
</template>
<template data-pop="g98-sm-monofilament" data-title="Monofilament de 10 g (Semmes-Weinstein 5.07)">
<div class="lab">But</div><p>Il détecte la perte de la sensibilité protectrice, condition du diagnostic de Charcot [S13, annexe 1 ; S3].</p>
<div class="lab">Technique</div><p>Le médecin montre d’abord la sensation sur la main. Il teste trois sites par pied, hors de la vue du patient, perpendiculairement à la peau, jusqu’à ce que le filament se courbe, pendant environ 2 secondes. Il répète deux fois au même site en intercalant au moins une fausse application. Il évite ulcère, callosité, cicatrice et nécrose [S13, annexe 1].</p>
<div class="lab">Lecture</div><p>La sensibilité est présente à un site si le patient répond juste deux fois sur trois, absente s’il se trompe deux fois sur trois [S13, annexe 1].</p>
<div class="lab">Piège</div><p>Un filament usé perd sa force de flexion : il ne faut plus l’utiliser pendant 24 heures après 10 à 15 patients et le remplacer après 70 à 90 patients, selon le modèle [S13, annexe 1].</p>
<p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-01-Practical-Guidelines.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandations pratiques, annexe 1</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED 2020</a>, consultés le 16 octobre 2026.</p>
</template>
<template data-pop="g98-sm-diapason" data-title="Diapason de 128 Hz">
<div class="lab">But</div><p>Il détecte la perte de la sensibilité vibratoire [S13, annexe 1].</p>
<div class="lab">Technique</div><p>Le médecin montre la sensation au poignet, puis applique le diapason perpendiculairement, avec une pression constante, sur la face dorsale de la phalange distale du gros orteil, hors de la vue du patient. Il répète deux fois en intercalant au moins une application sans vibration [S13, annexe 1].</p>
<div class="lab">Lecture</div><p>Le test est positif si le patient répond juste au moins deux fois sur trois ; s’il ne perçoit rien à l’orteil, le médecin remonte à la malléole puis à la tubérosité tibiale [S13, annexe 1].</p>
<div class="lab">Limite</div><p>Aucune sensibilité ni spécificité pour le diagnostic du Charcot n’est donnée dans les sources lues.</p>
<p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-01-Practical-Guidelines.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandations pratiques, annexe 1</a>, consultée le 16 octobre 2026.</p>
</template>
<template data-pop="g98-sm-icb" data-title="Indice cheville-bras chez le diabétique">
<div class="lab">Pourquoi</div><p>Chez le diabétique, l’examen clinique détecte mal l’artériopathie ; une mesure objective est conseillée en cas de pouls absent ou d’ulcère [S13, annexe 2].</p>
<div class="lab">Technique</div><p>Le patient est allongé depuis 10 minutes, dans une pièce à 22–24 °C, sans alcool, effort ni caféine depuis 2 heures. Le médecin mesure au Doppler la pression systolique des deux bras, puis de l’artère pédieuse et de la tibiale postérieure, brassard placé environ 2 cm au-dessus de la malléole [S13, annexe 2].</p>
<div class="lab">Calcul</div><p>L’indice d’un membre est la plus basse des deux pressions de cheville divisée par la plus haute des pressions brachiales. Exemple : 118/142 = 0,83 [S13, annexe 2].</p>
<div class="lab">Lecture et piège</div><p>Une valeur inférieure à 0,9 ou supérieure à 1,3 est anormale [S13, annexe 2]. Un indice élevé ne rassure donc pas : 188/130 = 1,45 est anormal.</p>
<p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-01-Practical-Guidelines.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandations pratiques, section 4.1 et annexe 2</a>, consultée le 16 octobre 2026.</p>
</template>
<template data-pop="g98-sm-deformation" data-title="Déformation du pied de Charcot chronique">
<div class="lab">Description</div><p>Pied « à bascule » (rocker-bottom) ou en tampon buvard ; déformations souvent multiplanaires de la cheville et du tarse ; raccourcissement du membre après effondrement du tibia distal, du talus et du calcanéum [S3, pied chronique].</p>
<div class="lab">Normal et mesure</div><p>Sur la radiographie de profil en charge, l’angle de Meary vaut environ 0°, la hauteur du cuboïde environ 1,2 cm et la pente calcanéenne 20 à 30°. Dans le Charcot, l’angle de Meary augmente, la hauteur du cuboïde diminue jusqu’à devenir négative et la pente calcanéenne baisse [S2, rôle des radiographies].</p>
<div class="lab">Mécanisme et conséquence</div><p>Le cuboïde devenu le point le plus bas concentre la pression : callosités, phlyctènes, puis ulcère sous-cuboïdien et ostéomyélite [S2].</p>
<div class="lab">Piège</div><p>La déformation signe la séquelle ; elle ne prouve pas l’activité. L’écart thermique est alors inférieur à 2 °C, sans œdème [S3].</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et coll., Insights Imaging 2019</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED 2020</a>, consultés le 16 octobre 2026.</p>
</template>
